prompt: |-
  hey so im in this criminology seminar and we're comparing prison models but i keep getting stuck on one specific tension. my professor mentioned that Halden prison in Norway—the one that opened around 2010—lets inmates cook together in shared kitchens with actual metal knives, which sounds like this big rehabilitative trust move, but also maybe its a calculated form of governance? meanwhile american supermax facilities like ADX Florence in colorado use total isolation and sensory deprivation, but maintaining that apparently takes enormous bureaucratic care—doctors, psychologists, constant legal review—just to keep people alive in solitary.

  i want to analyze both through institutional logics theory, specifically how the care logic and security logic aren't just opposites but actually depend on eachother in weird ways. like, does Halden's visible care produce a different kind of docility, and does american mass incarceration's security logic secretly require a hidden care infrastructure? also my roommate said im overreading the knife thing, but can you help me think through whether this framework explains why Norway's model never scaled, or if we're missing the economic logic of prison labor and private contracting that drives american expansion? dont need citations or reading lists, just want to work through the idea and see if the theory actually holds up or breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Criminology seminar, comparing prison models (Halden, Norway vs. ADX Florence, USA).
      *   **Core Question/Tension:** Analyzing these models through *institutional logics theory*, specifically the interplay between *care logic* and *security logic*.
      *   **Specific Hypotheses:**
          1.  Halden's "care" (cooking with knives) might produce a specific kind of docility/governance.
          2.  ADX's "security" (isolation) secretly relies on a hidden "care" infrastructure (medical/legal oversight) to function.
          3.  Are care and security opposites, or mutually constitutive/dependent?
      *   **Secondary Question:** Why hasn't the Norway model scaled? Is it economic (prison labor/private contracting) or something else explained by this framework?
      *   **Constraint:** No citations or reading lists. Just theoretical brainstorming/validation.
      *   **Roommate's Objection:** "Overreading the knife thing." (Needs addressing).

  2.  **Deconstruct the Theoretical Framework (Institutional Logics):**
      *   *Institutional Logics:* The "rules of the game," belief systems, and material practices that guide behavior in a field.
      *   *Care Logic:* Focus on well-being, rehabilitation, humanity, growth.
      *   *Security Logic:* Focus on risk management, containment, order, public safety.
      *   *Standard View:* They are trade-offs (more care = less security, vice versa).
      *   *User's Insight:* They are co-constitutive (one enables the other). This is a sophisticated take.

  3.  **Analyze Halden (Norway):**
      *   *Surface:* Trust, normalcy, metal knives, cooking.
      *   *User's Insight:* Is this care actually governance?
      *   *Theoretical Angle:* Foucault's "governmentality." By giving inmates responsibility (knives), the institution internalizes control. The inmate *chooses* not to stab someone, becoming a self-regulating subject.
      *   *Security via Care:* The "care" (trust) *is* the security mechanism. If you break the trust, you lose the privilege. It shifts the burden of security onto the inmate.
      *   *Roommate's Objection:* Is it just a knife? No, it's a symbol of the *contract*. It's not overreading; it's reading the *symbolic power* of the object.

  4.  **Analyze ADX Florence (USA):**
      *   *Surface:* Isolation, sensory deprivation, maximum security.
      *   *User's Insight:* Does security require hidden care?
