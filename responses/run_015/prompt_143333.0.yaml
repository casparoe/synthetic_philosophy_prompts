      *   *Verdict:* The framework holds. The "Care/Security" logic in the US is subordinated to a "Market/Punishment" logic. In Norway, it's subordinated to a "Welfare/Reintegration" logic. You can't transplant the logic without the surrounding institutional ecosystem.

