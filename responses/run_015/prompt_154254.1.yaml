answer: |-
  The commission sat on the steel table, a sketch of a double-walled sphere with a neck no wider than a knitting needle. It was meant to hold a single breath of air, sealed forever.

  Mara stood at the bench, the glow of the glory hole reflecting in her pupils. She turned the blowpipe, her wrists loose, her body swaying with the rhythm of the viscous glass. She didn't know that the glowing orb was silicon dioxide mixed with sodium carbonate. She didn't know the annealing lehr was set to 950 degrees Fahrenheit. She knew only that the light was too yellow, meaning it was hungry, and that the weight on the end of the pipe felt like a heavy peach turning into a plum.

  Leo stood behind the safety glass of the control nook. His hands rested on the countertop, still as stones, but if he reached for a tool, the fine tremor started in his fingers, a vibration inherited from their father but amplified by his own nerves. He had a tablet open, displaying real-time thermal imaging of the gather. He knew the exact coefficient of expansion for the batch. He knew the air density in the room was lower than standard because of the coastal fog pressing against the windows.

  In the corner, the Recorder hummed. It was a box of brass dials and punched paper tape, wired to the bellows system. Years ago, a master blower had used it to capture the perfect pressure curve of a successful blow. It didn't know what glass was. It knew only that when the tape hole was big, the bellows pushed hard, and when the hole was small, they eased off. It was muscle memory stripped of muscle.

  "Ready," Mara said. Her voice was rough from the heat.

  "Room temperature is up two degrees," Leo called out, not looking at her, watching the thermal feed. "Viscosity will drop slower than the baseline. If you follow the standard curve, you'll over-expand the inner wall."

  Mara didn't answer. She couldn't parse 'viscosity' in the abstract. She dipped the pipe back into the furnace. She felt the drag. It felt like stirring honey instead of molasses. She pulled the pipe out. The glass sagged slightly more than she expected.

  "Engage the Recorder," she said.

  Leo flipped the switch. The brass mechanism whirred. The paper tape clicked through the sprockets. The bellows inhale was mechanical, precise.

  Mara put her lips to the mouthpiece. She wasn't blowing; she was guiding. The machine provided the force, but she provided the resistance, valving the air with her throat and tongue.

  The tape hit the first major surge. The bellows pushed.

  On a normal day, the glass would have resisted, stiffening as it met the cooler air. But the room was warm. The glass stayed fluid. The pressure hit the wall, and the sphere bloomed too quickly.

  Mara felt the sudden lack of resistance in her cheeks. The glass was pushing back too easy.

  "Cut it!" Leo shouted, seeing the thermal bloom spread too thin on his screen. "The pressure is too high for the current thermal mass!"

  The machine couldn't hear him. It was reading the holes in the paper, not the glass. It pushed harder, following the memory of a winter day when the air was cold and the glass stiffened fast.

  Mara clamped her throat shut, fighting the machine's air. Her lungs burned. She couldn't stop the bellows, but she could choke the flow. She danced backward, spinning the pipe faster to use centrifugal force to hold the shape against the excess pressure.

  Leo saw the tremor in his own hands as he reached for the furnace controls. He couldn't adjust the pipe, but he could adjust the environment. He slammed the dampers on the side vents. He couldn't cool the room instantly, but he could stop the heat from building. He typed a command into the furnace controller, dropping the glory hole temperature by fifty degrees to compensate for the room's warmth.

  "The glass is stiffening!" Leo yelled. "Now! The curve changes at second forty!"

  The machine was still on the winter curve. It was preparing to ease off the pressure, expecting the glass to hold its shape. But Leo had just cooled the furnace. The glass was seizing faster than the tape expected. If the pressure dropped now, the neck would collapse before it sealed.

  Mara felt the drag return. The honey was turning to taffy. The machine was backing off the air, just like the tape told it to. The sphere began to dimple.

  She couldn't change the tape. She couldn't change the furnace. She only had her breath.

  She broke her seal from the mouthpiece and blew hard, manual pressure overriding the machine's declining curve. It was a guess. She didn't know the pressure in PSI. She knew the feeling of a lung full of air against a closing throat. She pushed until her vision spotted, holding the shape open while the glass cooled past the point of movement.

  The machine clicked to a halt. The tape ended.

  Silence rushed back into the workshop, save for the cooling ticks of the furnace.

  Mara lowered the pipe. Her arms shook, not from nerves, but from exertion. She carried the piece to the annealer and slipped it inside, breaking the neck with a sharp tap of the tweezers. The sphere rolled onto the shelf, perfect, the inner wall suspended within the outer like a ghost.

  Leo slumped against the control panel. His hands were still now.

  Mara wiped sweat from her forehead with a rag. She looked at the Recorder, then at Leo's tablet, then at the closed door of the annealer.

  "The tape was wrong," she said.

  "The room was wrong," Leo corrected.

  "The glass was right," Mara said. She turned off the torch. "Just didn't match the memory."

  Leo nodded, looking at his hands. "I'll recalculate the curve for tomorrow. Adjust for humidity."

  "I'll listen to the drag," Mara said.

  They left the machine humming in the corner, waiting for a day that matched the past exactly, while the two of them walked out into the cool coastal night, leaving the heat and the knowledge behind them.
