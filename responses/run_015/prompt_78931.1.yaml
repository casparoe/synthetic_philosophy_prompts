prompt: |-
  Write a deadpan, in-universe public information brochure: the welcome packet handed to newly selected members of a national body that has replaced its expert advisory committees with large randomly selected juries. Each panel votes in private, without deliberating, on a question that has been reformulated as a yes/no, and its majority verdict is then treated as the settled answer to the question. Invent the institution and its bureaucratic subdivisions, and write in its voice — proud, procedural, unembarrassed — with numbered sections, a list of juror duties, a pay schedule, and an appendix of performance statistics. Around 800 words.

  The premise the institution takes entirely for granted is the Condorcet jury theorem, and the humour has to come from getting the theorem right rather than from the familiar comedy of foolish bureaucracy. Let the packet's own details enact, without ever naming or noticing them, the assumptions it leans on and the ones it quietly breaks: that the theorem requires each juror to be better than chance, and tells you only what happens as the panel grows; that it requires the jurors' errors to be independent, which makes the rules forbidding discussion, common reading, and deliberation genuinely load-bearing, while the agency's pride in a standardised training programme that lifts every juror's individual accuracy is precisely what correlates their mistakes; that the theorem concerns a binary choice with one correct answer, so the rule that every question be reduced to a yes/no is at once indispensable and absurd for questions that have no fact of the matter or more than two live options; and that the theorem's converse is a threat rather than a reassurance, since competence slipping below one-half makes a larger panel worse, not better. Include a satisfied juror's testimonial that, read carefully, gives the game away while the agency quotes it approvingly.

  No official, footnote, or quoted complainant may wink at the reader or concede any of this; the packet should stay in frame from beginning to end, so that a reader who knows the theorem finds the satire fair and funny, and a reader who does not can still tell what is being mocked.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** A deadpan, in-universe public information brochure/welcome packet for a national body replacing expert committees with large randomly selected juries.
      *   **Mechanism:** Panels vote in private, without deliberating, on yes/no questions. Majority verdict = settled answer.
      *   **Tone:** Proud, procedural, unembarrassed, bureaucratic.
      *   **Length:** Around 800 words.
      *   **Core Humor/Satire:** Based on the Condorcet Jury Theorem (CJT).
          *   CJT Assumption 1: Jurors must be better than chance (>50% accuracy).
          *   CJT Assumption 2: Jurors' errors must be independent (no correlation).
          *   CJT Assumption 3: Binary choice with one correct answer.
          *   CJT Converse: If competence <50%, larger panels make things worse.
      *   **Requirement:** The text must *enact* these assumptions/breakages without naming them or winking at the reader. No official may concede the flaws.
      *   **Specific Inclusion:** A satisfied juror's testimonial that inadvertently reveals the flaws (e.g., copying others, guessing, following a leader) while the agency praises it.
      *   **Structure:** Numbered sections, list of juror duties, pay schedule, appendix of performance statistics.
      *   **Institution:** Invent a name and subdivisions.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) for Satire:**
      *   *Independence:* The brochure must emphasize strict isolation to ensure independence, but also mention a "standardized training program" that inadvertently correlates errors (making them all make the same mistake).
      *   *Competence (>0.5):* The brochure must claim high accuracy, but the testimonial or stats should hint that they are barely above chance or systematically biased.
      *   *Binary Reduction:* Complex policy questions must be forced into Yes/No.
      *   *Panel Size:* Pride in large numbers, ignoring the risk if competence drops below 50%.

  3.  **Drafting - Section by Section:**

      *   **Header:** Name of the institution. "National Epistemic Jury Commission" (NEJC)? "Bureau of Collective Veracity"? Let's go with "The National Consensus Directorate (NCD)."
      *   **Introduction:** Welcome the juror. Explain the shift from experts to randomness. Emphasize the mathematical certainty of the process.
      *   **Section 1: The Mandate:** Explain the Yes/No rule. Complex questions simplified.
      *   **Section 2: Juror Duties & Conduct:** Focus on isolation. No talking, no shared materials. This protects independence.
      *   **Section 3: Training:** The standardized module. This is where the correlation error comes in. Everyone learns the *same* heuristic.
      *   **Section 4: Compensation:** Pay schedule.
      *   **Testimonial:** A juror praising the system but revealing they just followed the gut feeling instilled by training or looked for cues.
      *   **Appendix:** Stats showing large panels achieving "consistency" (which might just be consistent error).

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Sterile, confident, bureaucratic. Use words like "optimization," "aggregation," "statistical inevitability."
      *   *The Trap:* The training manual ensures everyone thinks alike (violating independence). The questions are subjective (violating binary truth). The testimonial admits to guessing or following a pattern.

  5.  **Refining the Satire (Self-Correction during drafting):**
      *   *Check:* Did I name the theorem? No.
      *   *Check:* Did anyone admit it might fail? No.
      *   *Check:* Is the testimonial damaging? It needs to sound positive but imply low competence or high correlation. Example: "I didn't know the answer, but I knew what felt right based on the video."
      *   *Check:* Word count. Need to expand on the bureaucratic details to hit ~800 words.

  6.  **Writing - Step-by-Step:**

      *   *Title:* Welcome to the National Consensus Directorate.
      *   *Intro:* You have been selected. Experts are out; randomness is in.
      *   *Section 1 (The Question):* All policy is binary. Nuance is noise.
      *   *Section 2 (Isolation):* Strict silence. No deliberation. This ensures independent errors (in theory).
      *   *Section 3 (Training):* The "Standardized Heuristic Module." Everyone watches the same video. This creates correlation.
      *   *Testimonial:* "I usually guess, but the training gave me a common sense."
      *   *Pay:* Flat rate.
      *   *Appendix:* Panel sizes vs. Accuracy. Show that as panels get bigger, confidence goes up, even if accuracy is dubious.

  7.  **Polishing the Math/Logic Errors:**
      *   Make sure the text claims that *because* the panel is large, the answer *must* be right.
      *   Highlight the training program as a quality assurance measure, unaware that it synchronizes mistakes.
      *   Ensure the Yes/No reduction is applied to something clearly not binary (e.g., economic policy).

  8.  **Final Review against Constraints:**
      *   Deadpan? Yes.
      *   In-universe? Yes.
      *   No winking? Yes.
      *   Condorcet assumptions enacted/broken? Yes (Independence broken by training, Competence assumed via size, Binary forced).
      *   Word count? Aiming for 800.

  *(Self-Correction on Word Count)*: I need to ensure I don't write too little. I will expand the "Juror Duties" and "Performance Statistics" to bulk it up while maintaining the density of the satire.

  *(Refining the Testimonial)*: The juror should say something like, "I found that if I just answered exactly how the training video suggested, I felt part of something bigger." This implies they aren't thinking independently, but the NCD reads this as "alignment."

  *(Refining the Stats)*: The stats should show high agreement rates, conflating agreement with accuracy.

  9.  **Final Polish:** Check the voice. It should sound like a DMV manual met a statistics textbook.

