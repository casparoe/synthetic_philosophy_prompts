  ## 5. Troubleshooting: What Will Go Wrong

  1.  **Problem:** *Students treat it as a personality contest.*
      *   **Fix:** Enforce the "Block Vote." Only the Party Leader submits the vote. Remind them they are agents of the Party Payoff, not individuals.
  2.  **Problem:** *Parties fail to coalesce in time (especially in Regime B).*
      *   **Fix:** Announce "3 minutes remaining" loudly. In Regime B, if they haven't reached 20 votes by the buzzer, the vote fails automatically (Executive wins). This mimics transaction costs.
  3.  **Problem:** *The Executive (P3) is ignored or dominates too much.*
      *   **Fix:** P3 needs to be active. Instruct P3 privately before Round 1: "Your goal is to pass Package X. Offer side-payments if allowed (verbal only)."
  4.  **Problem:** *The Election Mechanic never triggers in Regime A.*
      *   **Fix:** This is actually the *desired outcome* (see Honesty Check). If they *do* trigger it, check their math. If P1/P2 vote to elect, they miscalculated their exposure. Point this out in debrief as "Bluffing Failure."
  5.  **Problem:** *Students confuse the Caretaker (Y) with Assembly Pref (Z) in Regime C.*
      *   **Fix:** Write the Regime C outcome clearly on the board: **Dismiss = Policy Y.**

  ---

  ## 6. Limitations (For Instructor Debrief)

  *Be frank about what this does not capture:*
  1.  **Repeated Games:** Real legislatures interact over years. Reputation matters. Here, it's one-shot.
  2.  **Intra-Party Conflict:** Parties here are monoliths. Real parties have factions (e.g., backbenchers vs. ministers).
  3.  **External Shocks:** No economy, no war, no media.
  4.  **Selection Effect:** We fixed P3 as Executive. In real Regime A, the Assembly might select a weaker P3 initially to avoid this trap. The simulation isolates *Survival*, but *Origin* matters for selection.

  ---

  ## 7. The Amendment Activity (56-66 mins)

  **Instruction:** "You have seen how the rules affected your score. You now have the power to draft **one constitutional amendment**. It must be one sentence. It can change a threshold, a cost, or a procedure. It must benefit *your* party specifically."

  **Expected Clusters on the Board:**
  *   **Cluster 1 (Survival Focus):** "Remove election cost in Regime A," "Make elections mandatory," "Lower dismissal threshold."
      *   *Maps to:* Tenure Security / Mutual Dependence.
  *   **Cluster 2 (Origin/Power Focus):** "Let Assembly choose Executive in Regime C," "Give Executive veto in Regime C," "Change Supermajority in Regime B."
      *   *Maps to:* Separation of Powers / Origin.

  **Goal:** Students notice that the parties who suffered most from the *Election Cost* want to change the Cost, not the Voting Threshold. This reveals the binding constraint.

  ---

  ## 8. Debrief Script & Theory Mapping (66-90 mins)

  **Step 1: The Outcome Review (5 mins)**
  *   "In Regime B, who won?" (P3/Executive). "Why?" (Supermajority too high).
  *   "In Regime C, who won?" (Assembly). "Why?" (Free dismissal).
  *   "In Regime A, who won?" (Likely P3/Executive). "Wait—you had the right to fire him. Why didn't you?"
  *   *Elicit:* "Because the election cost too much."

  **Step 2: The Two Variables (10 mins)**
  *   Draw a 2x2 on the board.
      *   **Axis 1:** Origin (Separate vs. Assembly).
      *   **Axis 2:** Survival (Fixed vs. Confidence).
  *   "Regime B was Separate Origin + Fixed Survival."
  *   "Regime C was Separate Origin + Assembly Survival."
  *   "Regime A was Assembly Origin + Mutual Survival."
  *   "You predicted power would rise B -> A -> C. It went B ≈ A < C."
  *   **Key Point:** "The *Survival* variable (Axis 2) did the heavy lifting. The *Origin* variable (Axis 1) mattered less than the cost of falling."

  **Step 3: Mutual Destruction & Credibility (5 mins)**
  *   "In Regime A, you had a gun, but it was pointed at your own head."
  *   "A threat is only credible if you are willing to pull the trigger. If pulling the trigger hurts you more than letting the Executive win, the Executive knows you won't fire."
  *   "This is why 'Vote of Confidence' rules stabilize governments. It's not about power; it's about shared risk."

  **Step 4: Labeling (Final 5 mins)**
  *   "In the literature, Regime A is **Parliamentary** (Fusion of Powers + Confidence)."
  *   "Regime B is **Presidential** (Separation + Fixed Terms)."
  *   "Regime C is a **Hybrid/Recall** model (rare, but illustrates the variable)."
  *   "The lesson: Don't ask 'Is it Presidential?' Ask 'Who pays the price when the government ends?'"

