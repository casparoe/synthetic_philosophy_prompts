answer: |-
  # Simulation Design: The Survival Constraint

  ## 1. Core Mechanics & Variables

  This simulation isolates two constitutional variables often conflated in the presidential/parliamentary dichotomy:
  1.  **Origin:** Is the Executive chosen by the Assembly or separately?
  2.  **Survival:** Does dismissing the Executive trigger an election (Mutual Destruction) or not?

  **The Setup:**
  *   **Students:** 24 total.
  *   **Parties:** 5 Parties (P1–P5). Sizes: P1(5), P2(5), P3(5), P4(5), P5(4).
  *   **Roles:** Each party caucuses internally but casts **one block vote** weighted by their seat count.
  *   **Executive:** Party 3 (P3) is the Executive in all three rounds. (This holds Executive preference constant to isolate rule effects).
  *   **Policies:** Three fixed policy packages (X, Y, Z).
  *   **Payoffs:** Points awarded at the end of each round based on the final policy and whether an election occurred.

  **The Three Regimes:**
  *   **Regime A (Mutual Destruction):** Assembly confirms Executive. Assembly may dismiss Executive, but dismissal triggers an **Immediate Election** (costly for some).
  *   **Regime B (Fixed Term):** Executive serves fixed term. Assembly may override Executive only with a **Supermajority (20 votes)**. No election possible.
  *   **Regime C (Recall):** Executive serves fixed term. Assembly may dismiss Executive with **Simple Majority (13 votes)**. Replacement is a Caretaker (Policy Y). **No Election.**

  ---

  ## 2. Materials & Payoffs

  *Print these on cards. Do not use forbidden terms (Presidential, Parliamentary, etc.).*

  ### Party Payoff Sheets (Identical for all Parties)

  | Policy Package | Description | P1 Points | P2 Points | P3 (Exec) Points | P4 Points | P5 Points |
  | :--- | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Package X** | Executive Preference | 2 | 2 | **10** | 2 | 2 |
  | **Package Y** | Caretaker / Compromise | 5 | 5 | 5 | 5 | 5 |
  | **Package Z** | Assembly Preference | **8** | **8** | 1 | **8** | **8** |

  ### Private "Electoral Exposure" Cards (Distribute Secretly)

  *This number is **subtracted** from your total score if an Immediate Election is triggered.*

  | Party | Seats | Electoral Exposure (Cost) | Rationale |
  | :--- | :---: | :---: | :--- |
  | **P1** | 5 | **-10** | High Cost (Election Averse) |
  | **P2** | 5 | **-10** | High Cost (Election Averse) |
  | **P3** | 5 | **-2** | Low Cost (Election Hungry) |
  | **P4** | 5 | **-6** | Medium Cost (Swing) |
  | **P5** | 4 | **-6** | Medium Cost (Swing) |

  ### Rule Cards (One per Round)

  **Regime A Rules:**
  1.  P3 proposes a Policy (X, Y, or Z).
  2.  Assembly votes. **13 votes** needed to Reject.
  3.  If Rejected: **Immediate Election.** Policy becomes Z, but all parties subtract their *Electoral Exposure* cost.
  4.  If Accepted: Policy passes. No Election.

  **Regime B Rules:**
  1.  P3 proposes a Policy (X, Y, or Z).
  2.  Assembly votes. **20 votes** needed to Override.
  3.  If Overridden: Policy becomes Z. No Election.
  4.  If Failed: P3's Policy passes. No Election.

  **Regime C Rules:**
  1.  P3 proposes a Policy (X, Y, or Z).
  2.  Assembly votes. **13 votes** needed to Dismiss.
  3.  If Dismissed: P3 removed. **Caretaker** installs Policy Y. No Election.
  4.  If Failed: P3's Policy passes. No Election.

  ---

  ## 3. Honesty Check: Will the Prediction Hold?

  **Student Prediction:** Assembly Power is Monotonic: **B (Low) < A (Medium) < C (High).**
  *Reasoning:* In B they can't fire. In A they can fire but it costs something. In C they can fire for free.

  **Simulation Outcome:** **B (Low) ≈ A (Low) < C (High).**
  *The monotonic prediction **fails**.*

  **Why?**
  In Regime A, the formal power to dismiss exists (Simple Majority). However, the *cost* of exercising that power (Election) is higher than the *benefit* of the policy change for the pivotal parties (P1, P2, P4).
  *   **Benefit of Rejecting P3's Package X:** Moving from X (2 pts) to Z (8 pts) = +6 gain.
  *   **Cost of Election for P1/P2:** -10 pts.
  *   **Net Result:** -4. They prefer accepting Package X (2 pts) over rejecting it (-4 pts).
  *   **Result:** The Assembly in Regime A behaves exactly like Regime B (Executive Dominance), despite having formal dismissal powers.
  *   **Regime C:** No election cost. Benefit of moving X (2 pts) to Y (5 pts) is +3. They dismiss. Assembly Dominance.

  **What breaks the prediction?**
  The **Survival Variable** (Election Cost) overwhelms the **Origin Variable** (Dismissal Right). The "Mutual Destruction" clause in Regime A renders the Assembly's threat non-credible.
  *   *For the prediction to come out true (B < A < C):* You would need to lower the Electoral Exposure for P1/P2 to something like -3. Then they would fire in A, but perhaps hesitate in B due to the supermajority threshold.
  *   *Why I designed it this way:* To demonstrate that "Who pays when the government falls" is more determinative of behavior than "Who has the right to vote."

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup:** Divide into 5 parties. Hand out Payoff & Exposure cards. | Ensure seats add to 24. |
  | **05-07** | **Instruction:** Explain scoring. Emphasize: "Maximize your party's points." | Do not explain the theory yet. |
  | **07-20** | **Round 1 (Regime A):** 5 min caucus/negotiate, 3 min vote, 5 min score. | P3 proposes X. Watch if Assembly bluffs. |
  | **20-33** | **Round 2 (Regime B):** 5 min caucus, 3 min vote, 5 min score. | P3 proposes X. Assembly tries to reach 20 votes (fails). |
  | **33-46** | **Round 3 (Regime C):** 5 min caucus, 3 min vote, 5 min score. | P3 proposes X. Assembly dismisses for Y. |
  | **46-56** | **Score Tally:** Calculate totals per party. | Identify winners/losers per regime. |
  | **56-66** | **Amendment Phase:** Parties draft 1-line rule changes. | "Change one number/word to help your party." |
  | **66-90** | **Debrief:** Map outcomes to variables. Cluster amendments. | Connect to real-world institutions. |

