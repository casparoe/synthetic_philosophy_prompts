      *   **Frankfurt Cases:** This scenario is almost a textbook example of a *Frankfurt Case* (named after philosopher Harry Frankfurt). In a Frankfurt Case, an agent chooses X. There is a mechanism that would have forced them to choose X if they tried to choose Y. But since they chose X on their own, the mechanism never activated. Frankfurt argues moral responsibility *does not* require alternative possibilities.
      *   **Actual Sequence vs. Counterfactual Sequence:** The friend is focusing on the *counterfactual* (what would have happened if she said yes). The sister is focusing on the *actual sequence* (what actually happened: she said no based on her values).
      *   **Second-Order Desires:** This refers to Harry Frankfurt's work on free will and personhood. A first-order desire is "I want to take the job." A second-order desire is "I want to *want* to be with my dad." Acting in alignment with second-order volitions is often seen as the essence of free will/authenticity.

