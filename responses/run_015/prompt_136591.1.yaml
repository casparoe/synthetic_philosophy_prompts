      *   **The Sister's Feeling:** She feels she made a genuine sacrifice and struggled with the decision. She believes the hidden clause is irrelevant because she never signed the contract.
      *   **The User's Question:** Is the friend's argument valid? Does the sister get moral credit? Does her "second-order desire" (wanting to be the kind of person who chooses family) matter? How does this map onto philosophical debates (free will, moral responsibility)?
