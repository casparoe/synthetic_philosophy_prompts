answer: |-
  This is a fascinating situation because your sister and her friend have accidentally stumbled into one of the most famous debates in modern philosophy regarding free will and moral responsibility.

  The short answer is: **Your sister is right, and her friend's argument is philosophically unsound.**

  Here is a breakdown of why the friend's logic fails, how this maps onto specific philosophical concepts (specifically "Frankfurt Cases"), and why your sister's "second-order desire" is actually the most important part of the equation.

  ### 1. The Philosophical Framework: "Frankfurt Cases"
  In 1969, a philosopher named **Harry Frankfurt** published a paper that changed how we think about free will. He proposed a thought experiment (now called a "Frankfurt Case") that looks almost exactly like your sister's situation.

  *   **The Setup:** Imagine a person, Jones, is deciding whether to vote for Candidate A or Candidate B. Jones decides on his own to vote for A. However, unknown to Jones, there is a neuroscientist monitoring his brain. If Jones had shown signs of choosing Candidate B, the neuroscientist would have intervened and forced him to choose A. But since Jones chose A on his own, the neuroscientist never did anything.
  *   **The Question:** Is Jones morally responsible for voting for A?
  *   **The Intuition:** Most people say **yes**. Even though Jones *could not have done otherwise* (because the neuroscientist would have stopped him), he is still responsible because the actual cause of his action was his own will, not the neuroscientist.

  **Mapping it to your sister:**
  *   **Jones** = Your sister.
  *   **Voting A** = Staying with Dad.
  *   **The Neuroscientist** = The hidden contract clause.
  *   **The Intervention** = The legal lock-in (which never happened).

  Your sister chose to stay with her dad based on her own values. The "trap" (the contract) was a counterfactual intervener—it existed in the background but played **zero causal role** in her actual decision. Because the trap never activated, it did not coerce her.

  ### 2. Actual Sequence vs. Alternative Possibilities
  The friend's argument relies on the **Principle of Alternative Possibilities (PAP)**. This is the idea that you are only responsible for an action if you could have done otherwise. The friend is arguing: *"In the world where you took the job, you couldn't have left. Therefore, you never really had the option to leave Dad."*

  However, most contemporary philosophers favor **Actual Sequence Responsibility**. This view holds that what matters is what *actually* happened in the timeline we live in, not what *would have* happened in a parallel timeline.

  *   **In the Actual Sequence:** Your sister weighed her values. She felt the pull of career. She felt the pull of family. She chose family. Nothing forced her hand.
  *   **In the Counterfactual Sequence:** She takes the job. The contract locks her in.

  The friend is trying to invalidate the *Actual Sequence* based on the *Counterfactual Sequence*. But the contract clause was causally inert. It did not push her, threaten her, or influence her. Therefore, it cannot rob her of the credit for her choice.

  **Analogy:** Imagine you decide not to rob a bank because you believe stealing is wrong. Unbeknownst to you, the bank's vault was broken that day and would have been impossible to rob. Does the fact that the robbery *would have failed* mean you don't get moral credit for choosing honesty? No. Your choice was based on integrity, not the physical possibility of success.

  ### 3. The "Second-Order Desire" (Not Psychobabble)
  You asked if her desire to "be the kind of person who picks family" is just psychobabble. In philosophy, this is called a **Second-Order Volition**, and it is crucial to the definition of personhood and freedom.

  *   **First-Order Desire:** "I want that promotion." (An impulse or immediate want).
  *   **Second-Order Desire:** "I want to be a person who prioritizes my father over my career." (A desire about your desires).

  Harry Frankfurt argued that true free will isn't just doing what you want; it's acting in alignment with who you *want to be*.

  Your sister experienced **conflict**. She wanted the job (first-order), but she valued being a devoted daughter more (second-order). When she turned down the promotion, she aligned her actions with her second-order volition. That alignment is the very essence of moral agency. The fact that she struggled makes the choice *more* hers, not less, because it required her to adjudicate between competing values.

  ### 4. Why the Friend's Argument is Harmful
  The friend is committing a modal fallacy (confusing necessity with possibility). They are arguing that because the *exit* from the job path was blocked, the *entry* into the family path wasn't free.

  But consider the reverse: If the contract *didn't* exist, and she took the job, she could have quit. The friend implies that the existence of a trap in Path B validates the freedom of Path A. But freedom doesn't work that way. Path A was open because **nothing blocked it.**

  The friend is essentially telling your sister: *"Your sacrifice doesn't count because you were lucky enough to avoid a trap you didn't know about."* This invalidates her internal struggle. It tells her that her values don't matter, only the external mechanics of the universe matter. That is a deeply alienating way to view human life.

  ### 5. How to Help Her Navigate This
  Your sister is feeling "guilt" (or perhaps invalidation) because the friend has made her feel like her agency is an illusion. Here is how you can reframe it for her:

  1.  **The "Causal Chain" Argument:** Remind her that the contract clause is irrelevant because it never touched her life. It didn't whisper in her ear; it didn't threaten her. Her decision was generated 100% by her own brain and heart. The "trap" is a ghost; her sacrifice is real.
  2.  **The "Temptation" Reality:** She *wanted* the promotion. The sacrifice was real because the desire was real. The fact that the other door would have locked behind her doesn't change the fact that she voluntarily chose not to walk through it.
  3.  **Validate the Second-Order Desire:** Tell her that her wish to be a family-oriented person is the most "free" thing about her. Robots follow code; humans struggle with values and choose the harder right over the easier wrong. That struggle is where moral credit lives.
  4.  **Dismiss the Counterfactual:** Remind her that we live in *this* timeline. We don't get moral credit or blame for things that happened in universes that don't exist. In this universe, she chose her dad.

  ### Summary
  *   **Does the friend's argument hold water?** No. It relies on a discredited view of free will (that you need alternative possibilities to be responsible).
  *   **Is the decision genuinely hers?** Yes. It arose from her actual values, not external coercion.
  *   **Does the second-order desire matter?** Yes, it is the philosophical definition of authentic action.

  Your sister gets full moral credit. She looked at a career jump she wanted, weighed it against her father's needs, and made a choice based on her character. The hidden contract is a footnote in a book she didn't write.
