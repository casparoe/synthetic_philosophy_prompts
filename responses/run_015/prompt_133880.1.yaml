answer: |-
  Your hypothesis that the stalemate arises from divergent *explananda* is astute, but it requires sharpening. The dispute is not merely that participants are asking different questions; it is that they disagree on the **order of explanation** between the normative and the psychological. The Strawsonians treat the practice of holding responsible as the datum from which norms are derived; the Rationalists treat the properties of the agent as the datum from which the legitimacy of the practice is derived. Your three cases do not just separate the questions; they reveal that the two camps are constructing responsibility from opposite ends of the normative chain.

  Consider the **one-sided community**. Here, the divergence is not descriptive but metaphysical. For the Strawsonian, the reactive attitudes are not merely signals of responsibility; they are constitutive of the moral relationship. If a community lacks other-directed resentment, they lack the specific interpersonal stake that makes an obligation a *moral* demand rather than a rule of prudence. To say they hold one another responsible is, for the Strawsonian, a category error. For the Rationalist, however, responsibility is a property of the agent's architecture (reasons-sensitivity). If the agents possess the relevant machinery, they are responsible, even if their community is emotionally muted. The disagreement here is whether responsibility is essentially **relational** (Strawson) or **monadic** (Rationalist). Your hypothesis identifies this as a conceptual split, but it is deeper: it is a disagreement about whether morality is fundamentally a system of coordination or a system of assessment.

  The case of **address without an audience** tests the communicative function of blame. If holding responsible is essentially a demand for recognition (as Strawsonians like Wallace argue), blaming the dead is a degenerate practice, akin to shouting at a wall. It preserves the form of the attitude but loses its function. Rationalists, however, can accommodate this easily: if responsibility is about the link between agent and action, the agent's current capacity to receive address is irrelevant to their status as a responsible agent at the time of action. This case reveals that the Strawsonian view is inherently **forward-looking** (aimed at regulating future relations), while the Rationalist view is **backward-looking** (aimed at assessing past agency). When your seminar argues here, they are not disagreeing about the facts of the case; they are disagreeing about whether the point of responsibility is to govern relationships or to judge history.

  The **calibration test** exposes the **Euthyphro dilemma** at the heart of the debate. If our reactive attitudes are poorly calibrated to reasons-sensitivity, the Rationalist says our attitudes are wrong and the theory stands. The Strawsonian says the theory must account for the attitudes, even if they require refinement. This shows that the empirical strand cannot be pulled apart from the normative one. For the Rationalist, empirical facts about resentment are irrelevant to the metaphysics of control. For the Strawsonian, empirical facts about our emotional economy are the very ground of the normative. You cannot isolate the empirical question because each side assigns it a different logical weight.

  Therefore, the disagreement doing the real work is not simply about definitions, but about **priority**. Is the normativity of responsibility grounded in the nature of agency (Rationalist) or in the conditions of interpersonal community (Strawson)? This is why objections are absorbed rather than answered. When a Rationalist argues that a psychopath lacks reasons-sensitivity, the Strawsonian replies that we still feel reactive attitudes toward them, implying the normativity lies in the reaction. When a Strawsonian argues that coercion exempts because it alters the relational dynamic, the Rationalist replies that coercion alters the mechanism of choice. They are both right, but they are mapping different territories.

  Can these strands be pulled apart? Not without abandoning the core commitments of each view. However, progress is possible if the seminar stops trying to unify these priorities under a single concept of "responsibility." The most productive path forward is to adopt a **pluralist taxonomy**, specifically the distinction between **attributability**, **answerability**, and **accountability**.

  *   **Attributability** asks if an action reflects the agent's character (satisfying the Rationalist's focus on agency).
  *   **Answerability** asks if the agent can justify the action through reason (satisfying the Rationalist's focus on reasons-sensitivity).
  *   **Accountability** asks if the agent is liable to sanctions or demands from others (satisfying the Strawsonian focus on community and reactive attitudes).

  Progress for your seminar would look like a shift from asking "Is the agent responsible?" to "Which kind of responsibility is at stake?" In the one-sided community, agents might be *attributable* and *answerable* but not *accountable* in the full sense, as the community lacks the sanctions of resentment. In the case of the dead, we might hold them *attributably* responsible but acknowledge that *accountability* is no longer applicable. In the calibration case, we can admit our attitudes are empirically flawed regarding *accountability* without denying the metaphysical facts of *answerability*.

  This distinction dissolves the appearance of conflict by granting each side jurisdiction over a different domain. The Rationalists are largely theorizing attributability and answerability; the Strawsonians are theorizing accountability. The stalemate persists because each side claims their domain is the whole of moral responsibility.

  However, this diagnosis is itself contested. First, **hard incompatibilists** would argue that this pluralism is merely rearranging deck chairs on a sinking ship; if determinism undermines the control required for attributability, the distinctions collapse. Second, **unified Strawsonians** might argue that splitting these concepts loses the phenomenon entirely. They would claim that accountability is the only kind of responsibility that matters morally, and that attributability without the threat of sanctions is merely aesthetic appraisal, not moral judgment. They would resist the tripartite split as a concession that dilutes the normative force of blame.

  If this diagnosis holds, the seminar should not expect an empirical result or a formal proof to settle the matter. The progress lies in **conceptual differentiation**. The hour should be spent mapping which intuitions in your cases belong to which category of responsibility. If you find that your participants cannot agree on which category is in play, you have identified the true source of the impasse: not a lack of data, but a conflation of distinct normative practices under a single, overloaded term.
