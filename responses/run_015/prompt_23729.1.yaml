          *   Devlin: "Invisible bonds" of shared morality (root system metaphor), disintegration thesis, intolerance/indignation/ disgust as indicators of moral breach.
          *   Hart: Minimum content of natural law, harm principle, distinction between positive morality and critical morality, liberty vs. enforcement of morals.
          *   Specific Nuance: Is this a *minimal/universal* moral rule (acceptable to liberals) or a *comprehensive/culture-specific* one (illiberal)?
