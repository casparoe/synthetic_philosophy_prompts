answer: |-
  This is an excellent pedagogical pivot. You are right to worry that the Hart-Devlin debate often calcifies into a historical reenactment of the 1960s sexual revolution. By moving the terrain to non-consensual intimate image sharing (NCII), you force students to grapple with the *structure* of the arguments rather than the *cultural baggage* of the Wolfenden Report.

  Here is a reconstruction of the debate applied to NCII, designed to highlight the tension between social cohesion (Devlin) and individual liberty/critical morality (Hart), specifically focusing on your distinction between minimal universal rules and comprehensive cultural claims.

  ### I. Devlin's Reconstruction: The Root System and the Disintegration Thesis

  To be charitable to Lord Devlin, we must strip away the caricature of him as a mere religious conservative. Devlin was a legal structuralist. His core claim in *The Enforcement of Morals* is not that "sin must be punished," but that "society is impossible without a shared morality."

  **The Argument from Social Cohesion**
  Devlin would argue that NCII is not merely a private tort between two ex-partners. It is an assault on the "invisible bonds" that hold the community together. Using your metaphor: if society is a tree, the shared morality is the root system. You cannot prune away fundamental norms regarding trust, privacy, and sexual integrity without threatening the stability of the whole organism.

  For Devlin, the law is the defender of this moral fabric. He would posit that sexual intimacy relies on a pre-legal, moral expectation of confidentiality. When that expectation is violated systematically, it does not just harm the individual victim; it degrades the *institution* of trust necessary for intimacy to function at all. If the law does not step in, the message sent to the community is that this moral bond is optional.

  **The "Disgust" Test and the Victimless Crime**
  You mentioned the difficulty of pinning down the victim or the physical harm. This is where Devlin shines. He would argue that the "harm" is to the moral environment itself.
  1.  **Intolerance, Indignation, and Disgust:** Devlin suggests that when a practice provokes deep, widespread indignation (not just annoyance, but a feeling that "this cannot be tolerated"), it is evidence that a foundational moral boundary has been crossed. NCII provokes a visceral reaction across political and religious spectrums. For Devlin, this consensus *is* the evidence that the root system is threatened.
  2.  **The Diffuse Harm:** Even if a specific victim is hard to identify (e.g., images circulated in a way where the subject is anonymous, or the harm is the normalization of non-consent), Devlin would argue the state has a legitimate interest. A society that tolerates the instrumentalization of sexual privacy is a society that is loosening its grip on the concept of human dignity. If the law waits for physical violence, it has waited too long; the moral disintegration has already occurred.

  **Is this Minimal or Comprehensive?**
  Devlin would insist this is a **minimal, near-universal rule**. He would argue that every functioning society, regardless of its specific cultural mores regarding sex, requires a norm that "private confidences should not be weaponized." This isn't about enforcing a specific view on *what* sexual acts are permissible (comprehensive morality); it is about enforcing the *conditions under which any sexual act can be trusted* (minimal structural morality). Therefore, criminalizing NCII is not illiberal moralism; it is the preservation of the social contract's root system.

  ### II. Hart's Reply: Critical Morality and the Harm Principle

  H.L.A. Hart's response in *Law, Liberty, and Morality* would not necessarily be that NCII should be *legal*. Rather, his argument would be that Devlin's *justification* for criminalization is dangerous and conceptually confused.

  **The Distinction Between Positive and Critical Morality**
  Hart would first challenge Devlin's reliance on "shared morality" (positive morality). Just because society feels indignation does not make the indignation rational or just.
  *   **The Trap:** Hart would warn that "shared morality" regarding sexual images is often contaminated by patriarchal norms about shame. If we criminalize NCII because it violates "sexual privacy," we must ensure we aren't simultaneously reinforcing the idea that victims *should* feel shame.
  *   **The Liberal Test:** A liberal society enforces rules based on **critical morality** (what can be rationally defended as right), not just **positive morality** (what people happen to feel is right).

  **Reframing the Harm**
  Hart would agree that NCII should be criminalized, but he would reject Devlin's "disintegration" thesis.
  1.  **Harm to Autonomy, Not Roots:** The wrong in NCII is not that it weakens the "root system" of society. The wrong is that it violates an individual's **autonomy and control over their own personhood**. In the digital age, one's image is an extension of the self. Non-consensual distribution is a form of digital assault.
  2.  **The "Victimless" Fallacy:** Hart would push back hard on the idea that the victim is "hard to pin down." Even if the harm is psychological, it is a harm to a *specific rights-bearer*. To argue that the state acts to protect "society's moral fabric" rather than "the individual's right to privacy" shifts the focus from the victim's rights to the state's interest in conformity.
  3.  **The Slippery Slope:** If we accept Devlin's argument that the state can act to prevent "moral disintegration" based on psychological harm, where does it stop? Does emotional distress caused by a breakup justify state intervention? Hart would argue that without a strict **Harm Principle** (direct harm to others' interests/rights), the "root system" argument becomes a tool for enforcing any majority preference.

  **The Strongest Hartian Critique**
  Hart's strongest reply is this: **Devlin conflates the *effect* of the law with the *justification* for the law.**
  It is true that banning NCII might strengthen social trust (the Devlin effect). But that cannot be the *reason* for the ban. The reason must be the protection of individual liberty from侵害 (infringement). If we ban it to save the "roots," we treat citizens as means to the end of social stability. If we ban it to protect autonomy, we treat citizens as ends in themselves. The former is legal moralism; the latter is liberalism.

  ### III. The Verdict: Where does the case land?

  If you force this case into the 1960s binary, it creates a false dichotomy. However, for the purpose of your seminar, the case ultimately **lands on Hart's side, but it requires a Hartian update that incorporates a Devlinian insight.**

  **Why it is Hartian:**
  The legitimate basis for criminalizing NCII is not the preservation of a shared moral code (Devlin), but the protection of a specific individual's right to sexual autonomy and privacy (Hart). The "harm" is not the fraying of the social fabric; the harm is the violation of consent. This aligns with Hart's insistence that the law must protect individuals from harm by others, not protect morality from individuals.

  **The Devlinian Insight (The Update):**
  However, Hart's original formulation of "harm" was often quite physical or tangible (Mill's footprint). NCII demonstrates that **harm is socially constituted.** You cannot have "psychological harm" or "reputational harm" without a social context that gives those things meaning.
  *   Devlin was right that we are social creatures bound by shared understandings.
  *   Hart was right that the state cannot enforce those understandings simply because they exist.

  **The Synthesis for Your Students:**
  The case shows that **Legal Moralism is the wrong tool, but the diagnosis of social harm is correct.**
  *   If you argue like Devlin ("We must ban this because it offends our shared sense of decency"), you risk enforcing sexual shame and making the law dependent on fluctuating public outrage.
  *   If you argue like Hart ("We must ban this because it violates autonomy"), you have a stable, liberal foundation.
  *   *But*, you must acknowledge that "autonomy" in this context relies on the very social norms Devlin prized. If society didn't value privacy, there would be no harm to autonomy.

  **Conclusion for the Seminar:**
  Tell your students that NCII is the "stress test" for Legal Moralism. It looks like a win for Devlin because everyone agrees it's wrong. But if you dig into *why* it's wrong, you find that the Devlinian justification (protecting the moral roots) is unstable and illiberal, while the Hartian justification (protecting individual rights) is robust.

  The case proves Hart's ultimate point: **A society can agree that something is criminal without agreeing that it is the state's business to enforce morality for morality's sake.** We ban revenge porn not to save the tree, but to protect the fruit.
