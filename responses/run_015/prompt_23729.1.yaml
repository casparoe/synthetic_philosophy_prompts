      *   *The Strongest Reply:* Devlin's "disintegration thesis" is empirically weak. Societies change morals without collapsing. Criminalizing based on "indignation" risks mob rule. We must distinguish between harm to individuals (valid) and offense to moral sensibilities (invalid).

  5.  **Addressing the "Minimal vs. Comprehensive" Distinction:**
      *   *Devlin:* Would argue this is part of the "minimum" because trust is foundational to any society.
      *   *Hart:* Would argue the *specifics* of sexual privacy are evolving. The "minimum" is non-aggression. NCII is a form of aggression (digital). So, it fits the minimum *if* framed as harm, not moral deviance.

  6.  **Developing the Verdict:**
      *   Where does the case land?
