  2.  **Deconstruct the Case (NCII/Revenge Porn):**
      *   *Nature of the act:* Sharing private sexual images without consent.
      *   *Harm:* Psychological distress, reputational damage, harassment, potential job loss, suicide risk. Often diffuse (society-wide participation in shaming).
      *   *Moral Core:* Violation of trust, sexual autonomy, privacy.
      *   *Legal Context:* Many jurisdictions have criminalized this recently, often struggling with First Amendment (US) or privacy/harm frameworks.

  3.  **Drafting Devlin's Argument (The "Root System" Approach):**
      *   *Core Thesis:* Society exists only insofar as there is a shared conception of right and wrong. If morality shifts too much, society disintegrates.
      *   *Application to NCII:* Is this just a private quarrel? No, it strikes at the institution of sexual intimacy and trust.
      *   *The "Disgust" Test:* Devlin argues that intense public indignation/disgust signals a breach of the moral fabric. Does NCII provoke this? Yes, broadly across political spectrums.
      *   *The "Root System":* Sexual privacy isn't just a personal preference; it's a structural norm allowing intimacy to function. If people believe private images *will* be shared, trust erodes. This threatens the "root system" of relational trust.
      *   *Legal Moralism:* The law is the defender of this moral fabric. Even if no immediate physical harm occurs (in the Millian sense), the moral injury to the *community's* understanding of consent is sufficient for state intervention.
      *   *Nuance:* Avoid saying "sex is bad." Say "betrayal of sexual confidence is socially destructive."

  4.  **Drafting Hart's Reply (The "Liberal/Minimum Content" Approach):**
      *   *Core Thesis:* Law should prevent harm, not enforce morality for morality's sake. Confusing "what is" (positive morality) with "what ought to be" (critical morality).
      *   *Application to NCII:* Hart wouldn't necessarily say "don't ban it." He would say "ban it for the *right reasons*."
      *   *Harm Principle:* There *is* harm. Psychological, reputational, economic. It's not "no victim."
      *   *The Trap of Moralism:* If we ban it *solely* because it violates "shared moral expectations," we risk enforcing patriarchal norms about sexual shame. What if the "shared morality" is that women shouldn't take photos?
