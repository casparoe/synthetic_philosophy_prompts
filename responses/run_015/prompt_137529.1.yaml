answer: |-
  1. The Essay Question

  **Final Exam: Hofstadter's "Person Paper"**

  **Time:** 45 Minutes
  **Length:** Approx. 700 words

  Hofstadter's narrator defends the fictional language by distinguishing between two uses of group-marking terms. First, there is the **transparent generic**, where the term presents one subgroup as the unmarked norm for the whole kind (e.g., "All whites are created equal"). Second, there is the **bleached default**, where the morpheme appears in compounds but has allegedly lost its group-marking force (e.g., "chairwhite," pronounced "wit," described as "just a simple and useful component").

  Your task is to use this **bleached-default vs. transparent-generic** distinction to evaluate whether the satire's moral indictment transfers to our actual use of "man," "mankind," and generic "he."

  Do not simply assert that "sexism maps onto racism." I want to know *where* the analogy holds and where it might break based on linguistic function. Specifically, you must address the narrator's claim that inclusive "white" has "no connotations whatsoever of race." If a defender of generic "man" argues that "man" just has a generic sense with no sex connotations, how does the satire's treatment of the parallel claim about "white" affect their credibility?

  Argue for which specific uses (compounds vs. live generics) stand convicted by the satire and which, if any, escape. What would count as evidence that a term is truly bleached rather than just claimed to be?

  ***

  2. Model Answer

  The satire's moral force relies on exposing the falsity of the narrator's claim that inclusive "white" has "no connotations whatsoever of race." Readers immediately feel the racial exclusion in "All whites are created equal," despite the narrator's insistence that it is neutral. This phenomenological gap—between the speaker's claim of neutrality and the listener's experience of exclusion—is the engine of the analogy. Therefore, the indictment transfers most strongly to **transparent generics** in actual English, while the case against **bleached defaults** requires closer empirical scrutiny.

  In the fiction, the transparent generic is exemplified by "All whites..." and the pronoun "whe." Here, the subgroup (whites) is semantically active as the norm. The bleached default is exemplified by "chairwhite" or "saleswhite," where the narrator argues the suffix is phonologically reduced ("wit") and semantically empty. The satire convicts the transparent generic immediately: if "All whites" feels racist despite the narrator's defense, then "All men are created equal" feels sexist despite the traditionalist's defense. The analogy holds because the semantic compositionality is live; the listener cannot help but process the subgroup marker.

  The transfer is complicated when we move to bleached defaults. The narrator claims "chairwhite" is race-neutral. A defender of "chairman" makes the parallel claim: it is a bleached compound, not a claim that the chair is male. However, the satire undermines this defense by showing how easily "bleaching" can be a rhetorical shield for exclusion. If "white" in "chairwhite" is supposed to be neutral, why does the fictional society still maintain distinct pronouns ("whe"/"ble") and resist "person"? The context suggests the bleaching is incomplete.

  Applied to actual English, "mankind" functions more like the transparent generic "All whites..." than the bleached "chairwhite." It presents "man" as the substance of the kind. Generic "he" is similarly transparent; it forces a male grammatical form for non-specific referents. These uses stand convicted by the satire because, like "All whites," they rely on the subgroup as the unmarked norm. The claim that they have "no sex connotations" is debunked by the reader's reaction to the fictional "no race connotations" claim. The satire implies that if a term *were* truly neutral, swapping the marker wouldn't feel violent. Since swapping "man" for "person" feels violent to traditionalists, the term was never neutral.

  However, some compounds like "chairman" might arguably be more bleached than "mankind." To escape conviction, a user must provide evidence of genuine bleaching, not just assertion. Evidence would include: phonological reduction (as the narrator mentions with "wit"), lack of cognitive salience of the gender in processing, and interchangeability without loss of meaning. If "chairman" triggers a male image where "chairperson" does not, it is not bleached; it is a transparent default in compound clothing.

  Ultimately, the satire convicts any use where the subgroup marker remains semantically active. It exposes the "ambiguity defense"—the claim that "man" has a separate generic sense—as insufficient when the specific sense dominates usage. The satire does not prove every compound is sexist, but it proves that claiming neutrality is not enough. The burden of proof lies on the user to demonstrate the bleaching is real. Since "mankind" and generic "he" fail this test phenomenologically, they are guilty by analogy to "All whites." Compounds like "chairman" remain suspects until proven bleached, but the satire warns us that the narrator's confidence in "chairwhite" is part of the oppression, not a linguistic fact.

  ***

  3. Marking Scheme (Out of 20)

  **1. Reconstruction of Satire's Target & Analogy Direction (4 marks)**
  *   **Full Marks:** Clearly identifies that the satire targets the *defense* of generic terms (claims of neutrality), not just the terms themselves. Correctly states the analogy: Racism in fiction illuminates Sexism in reality.
  *   **Classic Mistake:** Treats the satire as simply saying "sexism is bad" without referencing the linguistic defense mechanism.

  **2. Application of Distinction to Fictional Examples (4 marks)**
  *   **Full Marks:** Correctly categorizes "All whites..." as transparent-generic and "chairwhite"/"wit" as bleached-default using the text's own descriptions.
  *   **Classic Mistake:** Conflates the two uses or claims the narrator thinks "chairwhite" is transparently racial.

  **3. Application of Distinction to Actual English Examples (4 marks)**
  *   **Full Marks:** Applies the distinction to real terms (e.g., classifying "mankind" as transparent, "chairman" as potentially bleached) rather than treating "man-language" as a monolith.
  *   **Classic Mistake:** Asserts all uses of "man" are identical without distinguishing compounds from live generics.

  **4. Handling the "No Connotations"/Ambiguity Defense (4 marks)**
  *   **Full Marks:** Uses the narrator's false claim ("no connotations whatsoever") to undermine the real-world parallel claim. Argues that reader phenomenology (feeling the exclusion) trumps speaker assertion.
  *   **Classic Mistake:** Accepts the "two-sense" ambiguity defense at face value without using the satire to challenge it.

  **5. Reasoned Verdict & Evidence Criteria (4 marks)**
  *   **Full Marks:** Gives a clear verdict on which uses are convicted (transparent) vs. suspect (bleached). Specifies what evidence counts for bleaching (phonology, processing, interchangeability).
  *   **Classic Mistake:** Sits on the fence without criteria, or fails to note that if *all* uses were truly bleached, the satire would collapse (must address why bleaching is likely incomplete).
