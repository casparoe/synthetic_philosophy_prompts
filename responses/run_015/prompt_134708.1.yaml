answer: |-
  You have identified a very specific, high-stakes logical move that often gets glossed over in general surveys of Buddhist ethics. You are right: standard terms like *cetanā* (intention) or *upāya* (skillful means) are too broad. They describe the *components* of the argument, but not the *structural asymmetry* you are pointing out.

  There is no single, established academic term for this specific mechanism. In Buddhist Studies, it is often subsumed under discussions of "Mahāyāna Ethical Exceptionalism" or the "Upāya Loophole," but these describe the *context*, not the *logical operation*.

  Since you asked for a term with sharp edges, I propose we coin this: **Agential Purity Gating (APG)**.

  Here is the breakdown of the term, its logical boundaries, and how it differs from the standard ethical categories you already know.

  ### The Coined Term: Agential Purity Gating (APG)

  **Definition:** A meta-ethical heuristic where the moral valence of an action's consequences is rendered contingent upon a binary assessment of the agent's internal state. The agent's "purity" (usually defined as absence of self-grasping or presence of *bodhicitta*) acts as a gatekeeper: if the gate is open (pure), negative consequences are morally nullified; if the gate is closed (impure), positive consequences are morally voided.

  #### 1. The Inside (The Logical Mechanism)
  APG operates on three specific axioms that distinguish it from standard intention-based ethics:

  *   **The Binary Switch:** Unlike standard virtue ethics, where intention and outcome are weighed on a spectrum, APG functions as a boolean switch. Purity does not *mitigate* bad karma; it *insulates* against it.
  *   **The Asymmetry:** This is the core of your observation.
      *   *Pure Mind + Harmful Outcome* = **Morally Neutral/Positive.** (The harm is re-categorized as "medicine" or "necessary surgery.")
      *   *Impure Mind + Helpful Outcome* = **Morally Negative/Null.** (The help is re-categorized as "samsaric merit" or "ego-gratification.")
  *   **The Epistemic Black Box:** The gate is internal and invisible to observers. This creates an authority gradient where only the agent (or a lineage holder validating the agent) can determine if the gate was open. This makes the ethics unfalsifiable by external observation of harm.

  #### 2. The Outside (What It Is Not)
  To sharpen the edges, we must distinguish APG from its nearest neighbors.

  *   **Vs. Standard Consequentialism:** Consequentialism asks, "Did this reduce suffering?" APG asks, "Was the mind free from self-clinging while doing it?" In APG, reducing suffering is secondary to maintaining the purity of the view. If suffering increases but the view remains pure, APG validates the action.
  *   **Vs. Standard Buddhist Intentionalism (*Cetanā*):** In early Buddhism (e.g., *Anguttara Nikaya*), intention determines the *type* of karma, but it does not necessarily negate the *result*. If I accidentally kill someone with a pure mind, I may not have intended the killing, but the karmic ripple of a death still exists. APG goes further: it claims the purity of the mind *transmutes* the external reality of the harm. It is not just "I didn't mean to"; it is "Because I meant well, this harm is not harm."
  *   **Vs. Virtue Ethics:** A standard virtue ethicist (Aristotelian or Buddhist) would argue that a truly virtuous agent would not produce harmful outcomes unless absolutely necessary, and would feel regret. APG allows the agent to produce harm without regret, provided the "purity" is maintained. It decouples the agent's state from the patient's experience.

  #### 3. Where This Pattern Lives
  You are likely seeing this in three specific zones:

  1.  **Mahāyāna *Upāya* (Skillful Means):** Specifically in texts like the *Upāyakauśalya Sūtra*, where the Buddha (in a past life) kills a bandit to save him from hell. The logic is that the Bodhisattva's compassion absorbs the karma, nullifying the moral weight of the killing.
  2.  **Vajrayāna "Crazy Wisdom":** The trope of the guru who acts harshly to shatter a student's ego. If the student complains, the student is told their perception is impure. If the guru is criticized, defenders claim the guru's mind was pure.
  3.  **Modern Secular Mindfulness/Therapy:** When a teacher causes harm but claims their "container" or "holding space" was pure, thereby framing the harm as the student's "resistance" rather than the teacher's boundary violation.

  ### Why This Move Is Distinct (and Dangerous)

  The reason this bugs you is that it creates a **Soteriological Insulation**.

  In standard ethics, if you hurt someone, you owe them restitution. In **Agential Purity Gating**, if you hurt someone but your mind was "pure," you owe them nothing; in fact, they may owe *you* gratitude for the "teaching."

  This differs from the standard "Intention Matters" view because standard intentionality is **additive** (Good Intent + Bad Outcome = Complex Karma), whereas APG is **subtractive** (Good Intent + Bad Outcome = Zero Karma).

  ### Summary for Your Debates
  If you need to deploy this in conversation, you can say:

  > "You aren't arguing for intention-based ethics; you're arguing for **Agential Purity Gating**. You're treating the teacher's internal state not as a factor to be weighed against the harm, but as a switch that turns the moral reality of the harm off entirely. That isn't traditional *cetanā*; that's **karmic insulation**."

  This names the move, isolates the mechanism (the switch/gate), and highlights the risk (insulation from accountability). It should cut through the "it's all about compassion" fog effectively.
