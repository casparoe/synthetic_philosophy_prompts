answer: |-
  ### Pedagogical Diagnosis: Conceptual Dependencies and Resistance Points

  Before constructing the session plan, we must identify why physics and philosophy undergraduates typically reject occasionalism immediately. Their resistance is not usually theological; it is metaphysical and methodological.

  **Conceptual Dependencies**
  1.  **Metaphysics vs. Physics:** Students must grasp that physics describes *patterns* of interaction, while metaphysics asks about the *source of efficacy* in those interactions. Physics says "if A, then B"; occasionalism asks "what *makes* B happen?"
  2.  **Logical Necessity:** They need to understand that there is no logical contradiction in imagining fire touching cotton without burning it. If there is no logical necessity, the connection is contingent. If it is contingent, it requires an external sustainer.
  3.  **Continuous Creation:** Occasionalism is not intermittent intervention. It is the claim that existence is discrete and renewed at every moment. Without this, occasionalism looks like Deism or micromanagement.

  **Likely Resistance Points**
  1.  **The "God of the Gaps" Objection:** Students will assume occasionalism claims God acts only where science fails (e.g., miracles, quantum indeterminacy). They must see that occasionalism claims God acts where science *succeeds* most predictably.
  2.  **The Denial of Reality:** They will conflate "lack of causal power" with "lack of existence." They will think Ghazālī denies fire is real, rather than denying fire is an *agent*.
  3.  **The Hume Confusion:** Philosophy students will immediately equate this with Humean skepticism. They must distinguish Hume's epistemological claim (we cannot *know* necessity) from Ghazālī's ontological claim (there *is* no necessity in creatures).
  4.  **Scientific Utility:** They will argue that if causation isn't real, science is useless. The plan must show how science remains valid as the study of divine habit (*ʿāda*), even if causal powers are denied.

  ---

  ### Session Plan: Causation and Its Critics (Al-Ghazālī)

  #### 1. The Prerequisite Idea: Regularity vs. Intrinsic Power
  Before introducing occasionalism, you must establish the distinction between **observed regularity** and **intrinsic causal power**.

  *   **The Concept:** Physics observes that event B consistently follows event A. The scientific intuition is that A *pushes* or *transfers energy* to B. The occasionalist argument begins by asserting that observation only confirms sequence, not agency.
  *   **The Philosophical Move:** Ask students to describe what "power" looks like. Can they observe the "necessitation" itself, or only the succession? If they admit they only observe succession, you have opened the door to the claim that the connection is contingent.
  *   **Why this comes first:** If students believe causal power is an observable physical quantity (like momentum), occasionalism looks like a denial of data. If they accept causal power is a metaphysical interpretation of data, occasionalism becomes a competing metaphysical model.

  #### 2. The Carrying Example: The Persistent Virtual World (PVW)
  Use a single, sustained analogy throughout the session: **A Perfectly Rendered Virtual Reality.**

  *   **The Scenario:** Imagine a virtual world inhabited by avatars. When Avatar A throws a virtual stone at Virtual Window B, the window shatters. To the avatar, the stone caused the break.
  *   **What the Analogy Must Capture:**
      *   **Frame-by-Frame Rendering:** The engine does not let objects interact directly. It calculates State 1, then calculates State 2 based on rules, then renders it. The stone never touches the window; the system renders the shatter coincident with the stone's position.
      *   **Perfect Regularity:** The engine never crashes or lags. The rules are consistent. This prevents the "God of the Gaps" error. The system is active in every frame, not just when things go wrong.
      *   **Separation of Correlation from Necessitation:** The stone and the shatter are perfectly correlated, but the stone has no code that *forces* the shatter. The Engine holds all causal efficacy.
  *   **What the Analogy Must Deliberately Lack:**
      *   **Glitches or Miracles:** Do not introduce bugs or rule-breaking initially. If you suggest the system sometimes fails, students will think occasionalism implies nature is unreliable. The system must be robust to show that occasionalism supports scientific predictability.
      *   **The "Programmer" as Distant Creator:** Avoid implying the Engine wrote the code and left. The Engine must be actively computing every frame in real-time. This mirrors the theological claim of continuous creation (*khalq jadīd*).

  #### 3. Mapping Misconceptions and Intervention Points
  Address these misconceptions in the following order as they naturally arise during the explanation.

  *   **Misconception 1: "Occasionalism denies the existence of fire."**
      *   **When:** Immediately after introducing the PVW analogy.
      *   **Intervention:** Clarify that the virtual fire exists as a rendered object. It has properties (color, heat simulation). The claim is not that fire is an illusion, but that it is not an *agent*. It is an occasion for the Engine to render heat, not the producer of heat.
      *   **Correction:** "Ghazālī does not say fire doesn't exist; he says fire doesn't *do* anything."

  *   **Misconception 2: "This makes scientific prediction impossible."**
      *   **When:** After explaining that creatures lack power.
      *   **Intervention:** Return to the PVW. Because the Engine is consistent (faithful to its own rules), the avatars can build physics engines within the game that work perfectly. Science studies the habits of the Engine, not the powers of objects.
      *   **Correction:** "Prediction relies on consistency, not intrinsic power. If the Engine never changes its rules, physics remains valid."

  *   **Misconception 3: "This is just Humean constant conjunction."**
      **When:** Mid-session, when comparing historical views.
      *   **Intervention:** Draw a sharp line. Hume says we cannot *know* if there is a necessary connection (epistemological skepticism). Ghazālī says there *is no* necessary connection in nature (ontological denial).
      *   **Correction:** "Hume says 'We can't see the glue.' Ghazālī says 'There is no glue.'"

  *   **Misconception 4: "Miracles are exceptions to natural law."**
      *   **When:** Closing the theological implications.
      *   **Intervention:** In the PVW, a miracle is not a glitch; it is the Engine choosing a different rule set for a specific frame. Since objects have no power anyway, "breaking nature" is just the Engine acting differently than usual. There are no "laws of nature" independent of the Engine to break.
      *   **Correction:** "Miracles are not violations of causal power; they are variations in divine habit."

  #### 4. Closing Check: The Pharmaceutical Trial
  Do not quiz on dates or text names. Use a novel application scenario to test conceptual grasp.

  *   **The Prompt:** "A clinical trial shows Drug X is followed by Recovery Y in 95% of cases. A materialist scientist says 'Drug X causes Recovery Y.' An occasionalist says 'Drug X is the occasion for Recovery Y.' Explain the difference in what is happening metaphysically in these two statements."
  *   **Success Criteria:**
      *   **Fail:** The student says the occasionalist thinks the drug is fake or the recovery is random.
      *   **Pass:** The student explains that both agree on the statistical regularity. The materialist claims the chemical structure of the drug possesses the efficacy to heal. The occasionalist claims the chemical structure is the consistent marker where God grants healing, but the drug itself possesses no power to effect change.
      *   **Key Distinction:** They must identify that the disagreement is about *agency*, not *sequence*.

  #### 5. Scope Limitations: What to Leave Out
  To keep the session focused on philosophy of science rather than theology or history, explicitly refuse the following topics:

  *   **Ash'arite Atomism:** Do not explain the theory of indivisible atoms and timelessness (*jawhar farid*). It complicates the causation argument with physics claims that distract from the metaphysical point.
  *   **The *Tahafut al-Falasifa* Polemic:** Do not detail Ghazālī's specific arguments against Avicenna or the twenty propositions. Treat the position systematically, not historically.
  *   **Divine Attributes:** Do not delve into the nature of God's will or knowledge beyond what is required to explain the "Engine's" consistency. Keep the focus on creaturely causation.
  *   **Modern Occasionalism:** Do not branch into Malebranche or contemporary interpretations. Keep the focus on the structural logic of the claim itself.

  State clearly to the class: "We are not doing history of theology today, and we are not debating atomic physics. We are testing a metaphysical model of causation."
