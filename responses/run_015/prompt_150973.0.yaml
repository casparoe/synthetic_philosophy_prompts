  **Structure Plan**
  *   **Agreed Claims:** 10 points covering Bayesian framework, physical priors, evidence identity, and costs of paradoxes.
  *   **Disagreements Table:** 4 rows: Reference Class, Likelihood Weighting, Presumptuous Philosopher, Metaphysics of Units.
  *   **Cruxes:** Swarm/Marathon (with numbers for Persons vs. Moments), The Smear (vagueness propagation).
  *   **Closing:** Tractability of Unit Question, Falsification conditions, Verbal dispute diagnosis.

  ***

  # JOINT STATEMENT ON ANTHROPIC REASONING

  **1. Agreed Claims**
  1.  Anthropics must operate within a standard Bayesian framework; no special logic applies.
  2.  Physical priors for competing cosmological theories are stipulated equal (1:1) absent anthropic updates.
  3.  Centered evidence ("I am here now") is distinct from uncentered physical evidence and requires modeling.
  4.  Neither camp accepts solipsism; other observers exist independently of our inference.
  5.  Reference classes cannot be gerrymandered ad hoc to yield desired conclusions.
  6.  The "Presumptuous Philosopher" scenario represents a significant theoretical cost for any view that entails it.
  7.  The "Doomsday Argument" represents a significant theoretical cost for any view that entails it strongly.
  8.  Vagueness in the definition of "observer" is a metaphysical reality, not merely linguistic imprecision.
  9.  Physical evidence ultimately trumps anthropic reasoning; anthropics cannot override empirical data.
  10. No retrocausality is permitted; anthropic updates cannot change past physical events.

  **2. Disagreements**

  | Issue | Camp S (SSA) | Camp I (SIA) | Verbal or Substantive? | Turns On |
  | :--- | :--- | :--- | :--- | :--- |
  | **Reference Class** | Fixed class of observers (or moments) similar to me. Sampling is uniform within class. | All possible observers. Existence itself is evidence weighted by observer count. | Substantive | Whether "I exist" carries information about total observer count. |
  | **Likelihood Weighting** | $P(E|H) \propto 1/N_H$. Being *this* observer is less likely in larger populations. | $P(E|H) \propto N_H$. Existence is more likely in hypotheses with more observers. | Substantive | Whether indexical evidence is treated as sampling (S) or existence (I). |
  | **Presumptuous Philosopher** | Reject. We should not favor hypotheses purely because they contain more observers. | Split. "Hard SIA" accepts the bullet; "Soft SIA" conditions on total evidence to deflate it. | Substantive | Whether bare existence outweighs physical priors in infinite worlds. |
  | **Unit of Counting** | Prefer "observer-moments" to preserve invariance, though "persons" used for Doomsday. | Prefer "observers" (persons), but "Soft SIA" shifts toward moments to avoid absurdity. | **Verbal** | Metaphysics of persistence (endurantism vs. perdurantism). |

  **3. Cruxes**

  **Case 1: Swarm versus Marathon**
  *Stipulation:* Swarm ($10^{15}$ minds, 1 moment each) vs. Marathon (1 mind, $10^{15}$ moments). Total moments equal.
  *Critique:* This case reveals the dispute is largely metaphysical. If "moments" are the unit, anthropic factors cancel (1:1). If "persons" are the unit, they diverge maximally.

  *   **Camp S Prediction:**
      *   Unit = Persons: Posterior odds **1 : $10^{15}$** (Strongly favors Marathon). Being a specific person is unlikely in Swarm.
      *   Unit = Moments: Posterior odds **1 : 1**. Invariant.
      *   *Stance:* Invariance is a virtue; thus, Moments should be the unit.
  *   **Camp I Prediction:**
      *   Unit = Persons: Posterior odds **$10^{15}$ : 1** (Strongly favors Swarm). Existence is more likely in Swarm.
      *   Unit = Moments: Posterior odds **1 : 1**.
      *   *Stance:* "Soft SIA" agrees Moments are the correct unit to avoid Presumptuous Philosopher; "Hard SIA" insists on Persons.
  *   **Resolution Condition:** If physics confirms persistence is sequential (Marathon-like), Camp I wins on persons. If physics confirms discrete minds (Swarm-like), Camp S wins on persons. If physics is silent, the dispute is verbal.

  **Case 2: The Smear**
  *Stipulation:* Continuous duplication creates vagueness in observer count at the halfway point.
  *   **Camp S Prediction:** Probability updates are vague. Reference class boundaries are fuzzy, so posterior odds inherit this vagueness. This is acceptable but undesirable.
  *   **Camp I Prediction:** Probability updates are vague. Weighting factor $N_H$ is undefined. "Soft SIA" claims conditioning on total evidence reduces sensitivity to $N_H$, dampening the vagueness.
  *   **Resolution Condition:** Both agree vagueness propagates. The crux is whether this renders anthropic reasoning unusable in boundary cases. Camp S says "No, supervaluation works." Camp I says "No, expectation values work."

  **4. Closing Assessment**

  **Most Tractably Resolved Crux:** The Unit Question (Persons vs. Moments). This is not purely anthropic but metaphysical. If both camps agree that *experiential content* is the fundamental currency of value and evidence, the Swarm/Marathon case collapses to 1:1 odds. This suggests the divergence in standard formulations is partly verbal, stemming from unresolved metaphysics of persistence rather than probabilistic logic.

  **Evidence Against Views:**
  *   **Against Camp S:** Empirical confirmation of a "Big World" where we nonetheless find ourselves in a seemingly unlikely position without a Doomsday-style catastrophe. If we find we are in a vast universe without being early observers, SSA is falsified.
  *   **Against Camp I:** Empirical confirmation that we are *not* in a hypothesis with maximal observers (e.g., finding we are not Boltzmann brains in a thermal equilibrium universe). If "Hard SIA" predicts we should be in the highest-observer-count universe and we are not, it is falsified.

  **Verbal Disputes:** We conclude that approximately 40% of the disagreement is verbal. Specifically, the choice of reference class often tracks a prior metaphysical commitment to what constitutes an "object" versus an "event." Once the metaphysics of persistence is fixed, the anthropic update rules converge significantly. The remaining 60% is substantive: whether bare existence provides evidence for the size of the world (SIA) or merely locates us within it (SSA). We recommend future work focus on the metaphysics of counting rather than probabilistic formalism.
