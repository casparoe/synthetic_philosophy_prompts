answer: |-
  Adopt Kripkean Transworld Identity with Sortal-Relative Essentialism, which demands you retract verdict (5) because the logic of identity forbids indeterminacy in fission cases.

  Your intuition in (3) that origin is necessary is the anchor of a coherent de re modal view, and Transworld Identity preserves the strictness of "I" across worlds better than Counterpart Theory, which dissolves you into a similarity metric. To maintain this, you must treat origin as essential for natural kinds (persons) but allow functional continuity for artifacts, which resolves the asymmetry between (3) and (6) without abandoning origin essentialism entirely; however, this framework requires identity to be determinate, meaning your intuition in (5) that there is "no fact of the matter" in fission cases is logically incoherent and must be discarded. Verdict (2) also requires qualification: if being born a month early entails a different gametic origin, it is false given (3), but you can save the spirit of (2) by stipulating the same zygote develops under different temporal conditions. Verdict (8) is automatically resolved because strict identity excludes your neighbor, and (4) is handled by sortal constraints—you cannot be a horse because you fall under the essential sortal 'human'.

  For the twin case where your zygote splits, my account predicts you are **neither** twin; since identity requires non-branching continuity of your specific biological origin, the fission event marks the cessation of your existence and the beginning of two new distinct individuals. For a further case, consider **teletransportation**: if you are scanned, destroyed, and an atom-for-atom duplicate is assembled on Mars, my account verdicts that you die and a duplicate lives, because the historical causal chain of your biological origin is broken.

  The weakest point of this answer is the justification for the asymmetry between persons and ships; asserting that humans have strict biological origin essentialism while ships have loose material origin essentialism risks appearing ad hoc unless grounded in a deeper theory of natural kinds versus artifacts that I have not fully elaborated here.
