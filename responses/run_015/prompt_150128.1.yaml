answer: |-
  There is no single canonical term in strategic studies or game theory that captures the specific triad you describe: (1) **coarse/imprecise signaling**, (2) **negative externalities on bystanders**, and (3) the **cognitive collapse** of this continuum into a binary hide/shout model.

  However, your intuition is dissecting several established concepts that usually live in separate silos. Here is the breakdown of the existing literature, a proposed coinage for the specific phenomenon, and the self-critical counterarguments that might dissolve its novelty.

  ### 1. Closest Existing Concepts

  *   **Crawford-Sobel Partition Equilibria (Game Theory):** This is the formal mechanism for your "intermediate case." In cheap talk games, senders often reveal *partitions* of information (e.g., "The state is in the left half" vs. "The state is in the right half") rather than the exact state. Your probe creates a "conic partition." However, standard Crawford-Sobel models are dyadic (Sender-Receiver) and rarely model the harm to *third parties* outside the communication channel.
  *   **Information Hazards (Nick Bostrom):** This covers information that is harmful to disseminate. However, Bostrom's framework usually focuses on the receiver gaining dangerous capability (e.g., bioweapon recipes), not the receiver gaining *uncertain location data* that triggers a search process harming bystanders.
  *   **The Tragedy of the Commons:** The "safety of the sector" is a common-pool resource. One civilization's partial signaling degrades the silence for everyone else. This captures the *externality* but misses the *signaling geometry* and the *binary cognitive bias*.
  *   **Search Theory (Economics/Military):** This models how predators allocate effort given uncertain returns. Your scenario describes an **endogenous search intensity** triggered by a signal. But again, standard search theory focuses on the searcher's optimization, not the systemic risk to other hiders.

  ### 2. Proposed Coinage

  Since the phenomenon is distinct, it deserves a specific label. I propose two terms: one for the strategic dynamic and one for the cognitive failure.

  **The Strategic Dynamic: "Conic Contamination"**
  *   **Definition:** A negative externality arising when an actor emits a directional or coarse signal (a cone/corridor) that does not reveal their precise location but raises the expected value of a sector sweep for a predator, thereby increasing the detection risk for all other silent actors within that cone.
  *   **Boundary Conditions:**
      1.  **Imprecision:** The signal must *not* pinpoint the sender (distinguishing it from standard Dark Forest suicide).
      2.  **Search Inducement:** The signal must trigger an active search protocol (sweeping) rather than an immediate strike.
      3.  **Collateral Risk:** The primary harm must fall partially or wholly on *non-signaling* bystanders within the search zone.

  **The Cognitive Failure: "Signaling Binarism"**
  *   **Definition:** The analytical error of modeling a continuous signaling space (from total silence to full broadcast) as a discrete choice between two stable equilibria (Hide vs. Shout), ignoring unstable or high-risk intermediate partitions.
  *   **Boundary Conditions:** Applies when analysts assume intermediate strategies are either impossible or strictly dominated, without proving they lack equilibrium stability.

  ### 3. Why This Matters (The Mechanism)

  You identified the crux: **Uncertainty drives Search Intensity.**
  In the classic Dark Forest, certainty = death (instant strike). In your **Conic Contamination** model, *uncertainty* = danger (aggressive sweeping).
  *   **Silence:** Search intensity = 0 (Sector is cold).
  *   **Precise Broadcast:** Search intensity = 0 (Target is already dead/located).
  *   **Conic Probe:** Search intensity = MAX (Predator must burn fuel to resolve the uncertainty).

  This creates a non-monotonic risk function. The danger isn't highest when you reveal the most; it's highest when you reveal *just enough to warrant a search but not enough to satisfy it.* This is the "uncanny valley" of cosmic signaling.

  ### 4. Self-Criticism: When Is This Just Old Wine?

  To be rigorously self-critical, here are three formal results or counterexamples that would suggest **Conic Contamination** is not a novel concept but merely a disguised version of existing theory.

  **A. The Unraveling Result (Grossman-Stiglitz / Milgrom-Roberts)**
  *   **The Challenge:** In many signaling games, partial disclosure is not a stable equilibrium. If a predator knows that "safe" civilizations stay silent, then *any* signal implies "vulnerable" or "aggressive."
  *   **The Counterexample:** If game theory proves that in a high-stakes survival environment, any signal (no matter how coarse) collapses the posterior probability of "threat" to 100%, then the intermediate case doesn't exist. The "binary" model would be mathematically correct because the intermediate strategy is **strictly dominated**. If the probe *always* triggers the same response as a shout (immediate destruction rather than a sweep), then Conic Contamination is empty; the binary framing is accurate.
  *   **Condition for Novelty:** You must demonstrate a parameter space where a sweep is rational for the predator (e.g., cost of strike > cost of search, or value of capture > value of destruction).

  **B. Pooling Equilibria in Multi-Receiver Games**
  *   **The Challenge:** This might just be a standard **Pooling Equilibrium** with public bads. If the predator cannot distinguish the sender from the bystanders in the cone, they are all "pooled" into the same target set.
  *   **The Counterexample:** If the harm to bystanders is mathematically identical to the harm to the sender (i.e., the sender cannot hide better than the neighbors once the sweep starts), this is just a **Tragedy of the Commons** applied to information. The "Conic" geometry is flavor text; the math is identical to overfishing a shared lake.
  *   **Condition for Novelty:** The risk profile for the sender must differ from the bystanders (e.g., the sender knows where they are, the bystanders don't know they are being swept).

  **C. Threshold Heuristics vs. Cognitive Bias**
  *   **The Challenge:** You call the binary framing a "failure mode" (Signaling Binarism). But it might be a rational **Threshold Heuristic**.
  *   **The Counterexample:** If the probability of destruction jumps from 1% to 99% at a specific signal-to-noise ratio, then treating the space as binary is an accurate approximation, not a bias. Analysts might be ignoring the intermediate case not because they are cognitively limited, but because the intermediate case has negligible measure in the payoff matrix.
  *   **Condition for Novelty:** You must show that the risk function is genuinely continuous and that significant payoff mass exists in the intermediate region, making the binary approximation a costly error.

  ### Summary
  If you can prove that **intermediate signaling is a stable strategy** (not dominated by silence) and that it **generates unique search dynamics** (not just instant strikes), then **Conic Contamination** is a valid, unnamed strategic phenomenon. If intermediate signals inevitably trigger the same "destroy" response as loud broadcasts, then the Dark Forest binary holds, and your intermediate case is theoretically unstable.

  The most fertile ground for your argument is in the **cost of verification**. If verifying existence is expensive (requiring a sweep), but destruction is cheap, the binary holds. If verification is cheap but *locating* is expensive (requiring a sweep), your Conic Contamination model dominates.
