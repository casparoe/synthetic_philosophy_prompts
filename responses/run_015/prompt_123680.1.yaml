answer: |-
  This is incredibly heavy, and I want to start by saying: **you are not a bad person for reaching your breaking point.** Caregiver burnout is a silent, crushing thing, and it sounds like you have been carrying this alone for too long. The fact that you are crying in the kitchen and questioning your own instincts shows that you care deeply about your gran's dignity, even if your actions in that moment were driven by desperation.

  You asked to check your instincts. Your instincts are telling you something is off because **something is off.**

  To answer your specific question: **No, morally and ethically, that "yes" does not carry full weight.** It is not a valid consent in the way a care professional needs it to be. Here is why, broken down by the three elements that make consent real.

  ### 1. Capacity and Retention
  You mentioned she forgets she agreed to things five minutes later. For consent to be valid, a person needs to be able to **retain** the information long enough to weigh it up. If she agrees to move but forgets the agreement almost immediately, she cannot truly process the consequence of that decision. She isn't agreeing to a permanent change; in her mind, she might still be agreeing to a temporary fix, because she can't hold the alternative in her head.

  ### 2. Informed Truth
  Consent requires truth. By telling her the boiler was broken and this was temporary, you removed her ability to make a choice based on reality. You made the decision *for* her by curating the information she received. Even if your intention was to keep her safe, it means she didn't say "yes" to a care home; she said "yes" to a holiday while the heating gets fixed. That is a fundamental disconnect.

  ### 3. Voluntariness (The "Burden" Dynamic)
  This is the hardest part. You said she hates being a burden. She asked if you'd be upset if she said no. You said no, but you were crying.
  Elderly parents and grandparents are incredibly sensitive to their children's stress. She likely saw your exhaustion (even if you hid the tears) or sensed the tension. When someone says "yes" because they are afraid of disappointing the person they love, or because they feel they are a burden, that is **coercion by circumstance.** It isn't free will; it is protection of *you*.

  ### Why the Social Worker is Asking
  The social worker isn't trying to punish you. They are trained to spot exactly this dynamic. They see a vulnerable adult with memory loss, a stressed caregiver, and an agreement that seems to hinge on a temporary reason (the boiler).
  *   **They are asking because they need to know if she has the capacity to make this decision.**
  *   **They are asking because they need to know if she understands the permanence.**
  *   **They are asking because if she lacks capacity, the decision-making process changes entirely (e.g., best interest decisions rather than consent).**

  If you tell the social worker "She said yes, it's fine," and then Gran becomes distressed later because she thought she was coming home in two weeks, it will be a crisis. If you tell the truth now—that you misled her out of exhaustion—it allows them to help you navigate the legal and ethical framework properly.

  ### The Moral Weight
  You feel guilty because you know you bypassed her autonomy to solve a safety problem (your exhaustion and her care needs).
  *   **The Good:** You recognized you couldn't do it alone. That is responsible. You identified she needs more support. That is loving.
  *   **The Problem:** The method used to get there undermined her agency.

  **Does consent count if they are protecting you from your feelings?** No. That is compliance, not consent.

  ### What To Do Now
  You are in a tight spot, but you can fix this.

  1.  **Be Honest with the Social Worker:** Tell them exactly what you told me. "I am at breaking point. I told her it was temporary because I was afraid she wouldn't agree. I know now that wasn't right." They can help transition the narrative with her gently, or assess her capacity formally so that the move can happen based on *need* rather than *deception*.
  2.  **Forgive Yourself:** You lied because you were drowning. That doesn't make you malicious; it makes you human and unsupported. You cannot care for her if you collapse. Acknowledge that your need for rest is valid, even if the way you sought it was flawed.
  3.  **Reframe the Move:** If she moves, it shouldn't be because she "agreed to the boiler lie." It should be because it is the safest place for her. If she lacks capacity, the decision moves to "best interests." This takes the moral burden off her shoulders (she doesn't have to "choose" to leave her home) and off yours (you aren't "tricking" her).
  4.  **Get Support for You:** You mentioned night shifts and crying in the kitchen. You need respite care, counseling, or family support immediately. You are trying to be the sole pillar for someone who is fading, and that is too much for one person.

  **Summary:** Your instinct is right. The "yes" is fragile because the understanding is patchy and the pressure was high. Trust that instinct. Be honest with the professionals so they can help you make this transition safely, without the shadow of the lie hanging over her care. You are trying to do the right thing by her; let the system help you do it properly now.
