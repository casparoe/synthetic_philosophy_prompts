      *   *Is the user at risk?* They sound overwhelmed. I should encourage them to seek support for *themselves* too.
      *   *Is the grandma at risk?* Yes, potential safeguarding issue. I need to emphasize cooperating with the social worker.

  7.  **Final Polish:** Ensure the distinction between "bad person" and "bad situation" is clear. The user's instinct that something is wrong is correct; trust that instinct. (This aligns with the user's request to "check my instincts").

