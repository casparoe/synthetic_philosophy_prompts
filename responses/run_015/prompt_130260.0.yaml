  Give an example of a conceptual tension within Plato's moral psychology arising specifically from his discussion of symposiastic drinking in the Laws — where wine is employed as a kind of 'test' for self-mastery and for revealing true character under conditions of relaxation — and his account of the appetitive part of the soul in the Republic. Construct an example that turns on whether Plato can consistently hold that the appetitive part is essentially irrational and must be governed by reason, while also maintaining that deliberately inducing intoxication can serve as a training-ground for virtue rather than as a capitulation to appetite. In developing the case, examine whether the distinction drawn in the Philebus between necessary and unnecessary pleasures introduces a third, intermediate category — perhaps an 'instrumental pleasure' — that resolves the tension, or whether this resolution smuggles in a form of instrumental reasoning about the good life that sits awkwardly with Plato's broader anti-instrumentalist ethical commitments elsewhere. Structure your response as follows:

