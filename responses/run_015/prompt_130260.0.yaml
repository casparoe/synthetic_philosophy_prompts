  (3) Your assessment of whether the Philebus-style resolution succeeds, together with an honest account of what Plato's wider philosophy would have to sacrifice if it fails (approximately 200 words).

  Please do not provide a bibliography, reading list, or citations; I want the argument to stand on its own conceptual merit.
