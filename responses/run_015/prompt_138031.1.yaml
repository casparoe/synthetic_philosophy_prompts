  2. High barriers are legitimate only when protecting the procedural framework itself, not when locking specific policy outcomes against the current majority's will.
  3. You must surrender the intuition that one-click cancellation is universally right, because absolute frictionlessness destroys the very commitment mechanism you value in your own app.
  4. If your employer imposes the delay, it is a cage because the constraint originates externally, stripping you of the agency that makes self-binding legitimate.
  5. The directive is permissible because it allows your competent self to protect your welfare against a temporary state of incapacity, rather than binding a rational future agent.
