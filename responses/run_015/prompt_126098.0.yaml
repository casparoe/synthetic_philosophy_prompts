answer: |-
  **Desiderata for Non-Circular Basic Entitlement**

  *   **Block Bootstrapping:** Must invalidate the gas-gauge loop (using output to validate source) and the table-legs scenario (inferring stability from a single check), while validating ordinary perceptual claims (knowing your hand is there).
  *   **Order Distinction:** Must separate first-order justification (having a justified belief) from meta-justification (being justified in believing you are justified). Conflating them forces skepticism or dogmatism.
  *   **Reliability Split:** Must distinguish causal reliability (the mechanism works) from citable reliability (the agent possesses this as a reason).
  *   **Temporal Scope:** Must differentiate synchronic entitlement (immediate warrant) from diachronic learning. Checking one table leg fails synchronically but might pass diachronically.

  **Jointly Unsatisfiable Pairs**
  *   **Full Transparency + Zero Circularity:** If agents must cite grounds for all knowledge, basic beliefs trigger regress. If basic beliefs require no cited grounds, transparency fails. One must go.
  *   **Non-negotiable:** Blocking vicious circularity (the gauge loop must fail).
  *   **Camp Preference:** Whether meta-justification is necessary for knowledge (Internalist vs. Externalist).

  **Knockout Blows**
  *   **Reliabilism:** Killed by **Access Requirement**. Reliabilism permits knowledge via causal reliability alone. To block bootstrapping, agents must access reliability as a reason, which Reliabilism denies.
  *   **Dogmatism:** Killed by **Transmission Limitation**. Dogmatism claims perceptual justification transmits to deny skeptical hypotheses. To block bootstrapping, this transmission must fail in specific contexts, contradicting Dogmatism's core principle.
  *   **Coherentism:** Killed by **Input Constraint**. Coherentism allows beliefs to justify each other (table legs). Without an external input constraint anchoring the system to reality, it permits coherent but ungrounded falsehoods.
