answer: |-
  Here is the argument, stripped of bibliography and aimed directly at the structural weaknesses and strengths of the three positions.

  ### 1. The Stress Test: Hard Cases and Misclassification

  Let's run your list plus two additional stress cases: **Relief** (cessation of torture) and **Malicious Joy** (schadenfreude).

  **The Felt-Quality (FQ) View**
  *   **The Claim:** There is a specific phenomenal "glow" common to all pleasures.
  *   **The Failures:**
      *   **Relief:** When torture stops, the experience is overwhelmingly "good." But phenomenologically, it often feels like the *absence* of pain, not the presence of a positive glow. FQ struggles to distinguish "neutral" from "relief" without positing a "negative glow" for pain and a "positive glow" for relief, which multiplies entities unnecessarily.
      *   **Math Proof:** The "Aha!" moment is cognitive. FQ proponents say there *is* a feeling there. But introspection often reveals only the clarity of the proposition itself. If the "glow" is too subtle to be noticed without philosophical training, it cannot be the primary bearer of welfare value.
      *   **Misclassification:** FQ tends to count intense sensory spikes (orgasms, drug highs) as the *most* valuable experiences, even when the subject retrospectively judges them as empty. It misclassifies intensity for value.

  **The Attitudinal (AP) View**
  *   **The Claim:** Pleasure is a pro-attitude (liking, wanting to continue) toward an experience.
  *   **The Failures:**
      *   **Surprise:** I can be pleased by a surprise party before I form an attitude of "wanting this to continue." In fact, I might want it to stop immediately due to anxiety, yet still feel pleased that it happened. AP conflates *occurrent enjoyment* with *reflective endorsement*.
      *   **Masochism/Addiction:** A masochist may "want" the pain to continue during the act, but is the pain *pleasure*? AP says yes. But intuitively, the pain remains pain; the *attitude* is distinct. Similarly, an addict "wants" the hit but often doesn't "like" it (Berridge's distinction). AP misclassifies craving as pleasure.
      *   **Misclassification:** It counts things as pleasures that feel terrible (if I adopt a stoic attitude toward my suffering, do I turn pain into pleasure?).

  **The Recalibration (RV) View**
  *   **The Claim:** Pleasure is an event that raises the reference point for neutrality.
  *   **The Failures:**
      *   **One-Off Joys:** Seeing a rare comet. Does this raise my baseline for how good life should feel? Unlikely. I don't expect comet-viewing daily. RV implies this isn't pleasure because it leaves no hedonic hangover.
      *   **Relief:** Relief *lowers* the reference point for suffering (I am now safe), or resets it to neutral. It doesn't necessarily nudge the "good" baseline upward; it removes a "bad" deficit. RV struggles to distinguish *recovery* from *enhancement*.
      *   **Misclassification:** RV classifies **adaptation** as pleasure. If I get used to luxury, my baseline moves. But the *process* of moving the baseline is often stressful (the "hedonic treadmill"). RV risks defining the *consequence* of pleasure (tolerance) as the pleasure itself.

  ### 2. Taxonomy vs. Value: The Fatal Split

  You asked if we can separate the taxonomy (what is it?) from the value (why is it good?).

  **The Taxonomy Winner:** **Attitudinal (AP).**
  FQ fails the heterogeneity test; there is no introspective evidence of a common "redness" across sex and algebra. RV fails because baseline shifts are often unconscious or delayed, whereas pleasure is occurrent. AP is the only one flexible enough to cover the heterogeneity without positing magical phenomenology.

  **The Value Winner:** **Felt-Quality (FQ).**
  Why is pleasure good? The intuitive answer is: "Because it feels good." If you switch to AP, the question becomes: "Why is *liking* something good?" This invites a regress. If I like X, why is that state valuable? Usually, we say "Because liking X feels good." You end up smuggling FQ back in to ground the value of the attitude.

  **The Hedonist's Dilemma:**
  Hedonism requires one property to do both jobs. It must identify the class of experiences *and* explain their goodness.
  *   If you choose **AP** for taxonomy, you lose the intuitive link to value. You have to argue that "satisfaction of attitudes" is intrinsically good, which sounds like Desire Satisfactionism, not Hedonism.
  *   If you choose **FQ** for value, you lose the taxonomy. You can't find the quality.
  *   If you choose **RV**, you sever the link to value entirely (see below).

  **Can one unifier do both?**
  Only if you argue that the *feeling* of "liking" (AP) is itself a phenomenal quality (FQ). This is a "Phenomenal Attitude" view. But this collapses back into FQ, resurrecting the heterogeneity problem.

  **My Verdict:** It is a fatal cost if a view wins taxonomy but loses value. A theory of welfare that cannot explain *why* the identified property is good is not a theory of welfare; it's a taxonomy of psychology. Hedonists cannot split the jobs. They must find a property that is both ubiquitous and self-evidently valuable. AP is ubiquitous but not self-evidently valuable. FQ is self-evidently valuable but not ubiquitous. **This suggests Hedonism itself is false, not just the definition of pleasure.**

  ### 3. The Recalibration View: Rival, Disguise, or Subject Change?

  You want me to take RV seriously. Here is the hard break: **RV is not a theory of pleasure; it is a theory of homeostasis.**

  **The "Consequence" Objection:**
  You noted the worry: "A raised baseline is something a pleasure does, not what makes it good." This is fatal.
  *   **Definition:** If I define "cut" as "an event that breaks the skin," I have defined it by its consequence. But a "cut" is the laceration itself.
  *   **Application:** If pleasure *causes* recalibration, then recalibration cannot *be* pleasure. Sometimes pleasure leaves no trace (the cold drink doesn't ruin water forever). Sometimes recalibration happens without pleasure (trauma raises the baseline for fear). RV conflates cause and effect.

  **The "Future Worse" Objection:**
  This is the stronger argument against RV as a welfare theory.
  *   If pleasure raises the baseline for neutrality, then post-pleasure, your previous neutral state registers as *disappointment*.
  *   To return to equilibrium, you must invest more resources.
  *   Therefore, every unit of pleasure creates a deficit of future welfare that must be paid off.
  *   **Conclusion:** On RV, pleasure is a **high-interest loan**. It provides immediate credit but devalues your future currency.
  *   **Implication:** If RV is true, a hedonist should minimize pleasure to avoid the inevitable crash of the raised baseline. RV doesn't save Hedonism; it proves that maximizing pleasure is irrational.

  **Do FQ and AP have the same problem?**
  No.
  *   **FQ:** The "glow" is a credit. When it fades, you return to zero. You don't necessarily drop below zero unless you posit withdrawal.
  *   **AP:** Liking something ends. You stop liking it. You return to indifference.
  *   **RV:** Uniquely posits that the *aftermath* is structurally worse than the *before*. FQ and AP treat pleasure as a spike; RV treats it as a ratchet that makes the floor fall out.

  **Verdict:** RV is a subject change. It is a theory of **Hedonic Adaptation**, not Hedonic Ontology. It explains why pleasure fades, not what pleasure *is*. Adopting it as a definition of pleasure destroys the normative force of Hedonism.

  ### 4. The Family Resemblance Escape Hatch

  You banned this unless I explain the theoretical work. Here is the cost of taking it:

  If "pleasure" is a family-resemblance concept (no core property, just overlapping similarities), then **Hedonism ceases to be a monistic theory.**
  *   Monism says: One thing (Pleasure) makes life good.
  *   Family Resemblance says: A cluster of things (Sensory joys, Intellectual triumphs, Relief, etc.) makes life good.
  *   **The Work the Word Does:** If there is no core property, the word "pleasure" is just a label for "things we happen to like." It does no *explanatory* work. You can't say "Life goes well because it contains Pleasure." You have to say "Life goes well because it contains A, B, C, D..."
  *   **The Collapse:** If A is good for reason 1 (sensory stimulation) and B is good for reason 2 (cognitive clarity), you are no longer a Hedonist. You are a **Pluralist**. You have surrendered the main selling point of Hedonism (simpunity/unification).
  *   **Verdict:** You can take the escape hatch, but you must admit you have abandoned Hedonism. You are now arguing for a specific form of Value Pluralism where the cluster is loosely grouped under the historical label "pleasure."

  ### 5. What Would Settle This?

  There is no empirical finding that will settle this, because the disagreement is **upstream of evidence**. It is a disagreement about the *structure of value*.

  *   **Introspection:** Fails. Subjects disagree on whether there is a common feeling. (Some say yes, some say no).
  *   **Neuroscience:** Might find a common neural correlate (e.g., opioid release). But the "Is-Ought" gap remains. Even if all pleasures light up the same brain region, why is *that* region's activity good? (Unless you define "good" as "what lights up that region," which is circular).
  *   **Conceptual:** The only way to settle this is to decide what **Welfare** is.
      *   If Welfare is **Subjective State**, FQ is the only candidate (states must be felt).
      *   If Welfare is **Subjective Relation**, AP is the candidate (relation between subject and state).
      *   If Welfare is **Dynamic Stability**, RV is the candidate.

  **The Deciding Factor:**
  The "Experience Machine" intuition pump.
  *   If you would plug into a machine that gives you perfect FQ (glows) without reality, you are an FQ Hedonist.
  *   If you refuse because you want to actually *do* things (even if the attitude is the same), you lean toward AP or Objectivism.
  *   If you refuse because you don't want to be a slave to a baseline that keeps rising (RV), you reject Hedonism.

  **My Argument to You:**
  You should abandon the **Recalibration View** as a definition of pleasure. It confuses the *dynamics* of satisfaction with the *nature* of satisfaction. It makes pleasure self-defeating, which contradicts the premise that pleasure is the *good*.

  You should move toward the **Attitudinal View**, but with a modification: Don't try to save Hedonism.
  *   Accept that "pleasure" is heterogeneous.
  *   Accept that what unifies them is a pro-attitude (AP).
  *   **Crucially:** Admit that the *value* of that attitude depends on the **object** of the attitude.
      *   Liking a warm bath is good.
      *   Liking a grudge landing is... morally bad, and arguably prudentially bad (it corrupts the self).
  *   This moves you out of Hedonism and into a **Perfectionist** or **Objective List** view where "enjoyment" is a multiplier of value, not the source of it.

  **Why this is the only stable position:**
  The heterogeneity problem isn't a bug for Hedonism; it's a feature of reality. Experiences are different. Trying to unify them under "FQ" is phenomenologically dishonest. Trying to unify them under "RV" is normatively suicidal (it makes pleasure a debt). Trying to unify them under "AP" works descriptively but fails normatively (why is liking *anything* good?).

  **Final Recommendation:**
  Argue yourself **out of Hedonism**.
  Use the heterogeneity problem as the wedge. If pleasures are too different to share a quality (FQ), and their shared attitude (AP) doesn't guarantee value (liking bad things), and their dynamic role (RV) creates future deficits, then "Pleasure" is not the *Summum Bonum*. It is a *component* of welfare, often necessary, but not the unifying currency.

  The Recalibration View is your intuition telling you that Hedonism is dynamically unstable. Listen to that intuition, but don't codify it as a definition of pleasure. Codify it as a refutation of the theory.
