answer: |-
  ### Full Specification of Desiderata for an Adequate Tranquilist Theory of Well-Being

  To count as adequate, a theory of well-being grounded in tranquilism (the view that well-being is constituted solely by the absence of craving and suffering) must satisfy the following desiderata. These are divided into **Non-Negotiable Conditions** (essential to the definition of tranquilism) and **Camp-Specific Preferences** (interpretive choices that vary within the tradition).

  #### I. Non-Negotiable Conditions

  **1. The Zero-Ceiling Principle (Non-Additivity of Positives)**
  *   **Phenomenon/Case:** The comparison between a life of intense, satisfied ambition (high pleasure, high achievement) and a life of serene equanimity (neutral affect, no unmet needs).
  *   **Requirement:** The theory must assert that the serene life is at least equal to, if not superior to, the ambitious life, even if the ambitious life contains net positive experiences. Adding "positive" states (pleasure, achievement) cannot raise well-being above the baseline of "no craving."
  *   **Why Necessary:** This is the core metaphysical claim of tranquilism. If positive states add intrinsic value, the theory collapses into a form of hedonism or objective-list theory. The ceiling of well-being is zero (peace), not infinity (accumulated goods).

  **2. The Phenomenology of Absence (Quality of Negation)**
  *   **Phenomenon/Case:** Deep meditative states (e.g., *nirodha samapatti* or flow states without attachment) where conscious content is minimal, yet the subject reports high well-being upon reflection.
  *   **Requirement:** The theory must explain how the *absence* of a state can be phenomenologically robust rather than merely a null value (like being asleep or dead). It must distinguish "peace" from "numbness."
  *   **Why Necessary:** Without this, tranquilism is vulnerable to the "Statue Objection"—the claim that a dead person or a stone has perfect well-being because they have no craving. The absence must be an *active* stability, not a mere lack of function.

  **3. Volition Without Craving (The Motivation Constraint)**
  *   **Phenomenon/Case:** Compassionate action or self-preservation performed without attachment to the outcome (e.g., feeding oneself to survive without *needing* to survive, or helping others without *needing* them to be saved).
  *   **Requirement:** The theory must provide a mechanism for agency that does not rely on "craving" (understood as a deficit-based drive). It must distinguish between *functional volition* (movement) and *psychological craving* (suffering-based desire).
  *   **Why Necessary:** If all motivation requires craving, then a state of zero craving implies total inaction. Total inaction leads to biological death and suffering. If the theory cannot explain how to act without craving, it prescribes its own impossibility.

  **4. Asymmetrical Valuation (Negative Priority)**
  *   **Phenomenon/Case:** Trade-off scenarios, such as enduring a painful medical procedure to remove a chronic ailment versus enduring pain to gain an intense pleasure.
  *   **Requirement:** The theory must value the removal of suffering strictly higher than the acquisition of pleasure. Reducing suffering by 1 unit must always outweigh gaining 1 unit of pleasure.
  *   **Why Necessary:** This distinguishes tranquilism from negative hedonism (which might allow pleasure to offset pain). In tranquilism, pleasure is instrumentally useful only if it reduces craving; it has no intrinsic weight to balance the scales against suffering.

  #### II. Camp-Specific Preferences (Negotiable)

  **5. Metaphysics of Self**
  *   **Phenomenon/Case:** The experience of "my" peace vs. "no one's" peace.
  *   **Preference:** Some tranquilist frameworks require a "no-self" ontology (the craving subject is an illusion), while others allow an enduring self that simply learns contentment.
  *   **Why Optional:** One can logically hold that well-being is the absence of craving without committing to whether the entity experiencing that absence is ultimately real or illusory.

  **6. Scope of Moral Concern**
  *   **Phenomenon/Case:** Whether one is obligated to reduce the craving of others or only one's own.
  *   **Preference:** Universal tranquilism (maximize peace for all sentient beings) vs. Eudaimonic tranquilism (maximize peace for the agent).
  *   **Why Optional:** This is a meta-ethical addition, not a requirement for the definition of well-being itself.

  ---

  ### Internal Consistency Check: Jointly Unsatisfiable Desiderata

  There is a significant tension between **Desideratum 3 (Volition Without Craving)** and biological/psychological reality.

  *   **The Conflict:** Human homeostasis operates on deficit signals (hunger, thirst, temperature regulation). These signals phenomenologically resemble "craving." If the theory defines *any* drive to change the current state as "craving," then biological life is incompatible with well-being.
  *   **The Risk:** If the theory distinguishes "needs" from "cravings" to save the Motivation Constraint, it risks violating the **Zero-Ceiling Principle**. If "satisfying a need" counts as a positive good (survival), the theory slips into objective-list territory. If "satisfying a need" is just "removing the pain of hunger," it remains tranquilist, but it must explain why the *drive* to eat isn't itself a form of suffering.
  *   **Verdict:** This subset is **potentially unsatisfiable** without a very fine-grained phenomenological distinction between "impulse" and "attachment." If the theory cannot sustain this distinction, tranquilism demands death as the only true peace.

  ---

  ### The "Killer" Requirement

  The single requirement that does the most to rule out popular positive theories is **Desideratum 1: The Zero-Ceiling Principle (Non-Additivity of Positives).**

  *   **Why:** Hedonism, Desire-Satisfactionism, and Objective-List theories are all *additive*. They posit that Well-Being = $Base + Positives - Negatives$. They all agree that adding a positive (pleasure, satisfied desire, friendship) increases well-being, *ceteris paribus*.
  *   **Tranquilist Rejection:** Tranquilism posits Well-Being = $0 - Negatives$. It claims that adding a positive *does not increase well-being* once the baseline of non-craving is met. This incommensurability makes it impossible to reconcile tranquilism with any theory that views positive states as intrinsic goods.

  ---

  ### Scoring Competing Theories Against Tranquilist Desiderata

  | Desideratum | **Tranquilism** (Target) | **Hedonism** | **Desire-Satisfactionism** | **Objective-List Theory** |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Zero-Ceiling (Non-Additivity)** | **PASS** (Core Thesis) | **FAIL** (Pleasure adds value) | **FAIL** (Satisfaction adds value) | **FAIL** (Goods add value) |
  | **2. Phenomenology of Absence** | **PASS** (Defines peace as robust) | **FAIL** (Absence of pain is neutral, not peak) | **N/A** (Focuses on fulfillment) | **N/A** (Focuses on goods) |
  | **3. Volition Without Craving** | **CONDITIONAL** (Requires fine distinction) | **FAIL** (Requires pursuit of pleasure) | **FAIL** (Requires desire by definition) | **FAIL** (Requires pursuit of goods) |
  | **4. Asymmetrical Valuation** | **PASS** (Suffering removal > Pleasure gain) | **FAIL** (Pain and pleasure are symmetrical) | **FAIL** (Frustration and satisfaction symmetrical) | **FAIL** (Goods and bads often symmetrical) |
  | **Overall Viability** | **Internally Tense** | **Incompatible** | **Incompatible** | **Incompatible** |

  **Summary:** Only tranquilism attempts to meet the Zero-Ceiling and Asymmetry requirements. However, it bears the burden of proof on the Motivation Constraint (Desideratum 3), which is the point where the theory is most likely to fracture under the weight of biological necessity. Positive theories fail immediately on the core metaphysical claim (Desideratum 1).
