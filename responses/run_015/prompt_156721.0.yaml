prompt: |-
  I have been thinking on my own about whether human flourishing could really be nothing more than the absence of craving and suffering, with no positive goods required — a view I will call tranquilism. Before I read further, I want the full specification: what must a theory of well-being actually be able to do to count as adequate if tranquilism is correct? Give me the complete desiderata. For each requirement, state the phenomenon or case it must cover — for example, deep meditative states that lack both desire and pleasure, lives of neutral contentment, or the difference between the absence of suffering and the presence of genuine peace — and explain why that case makes the requirement necessary. Distinguish the non-negotiable conditions from those that are merely camp-specific preferences, such as whether determinism about desire is required. I am especially interested in whether any subset of these desiderata is jointly unsatisfiable: for instance, if explaining human motivation requires some form of craving, that may conflict with the core thesis. Identify which single requirement does the most to rule out the popular positive theories of well-being. Then briefly score hedonism, desire-satisfactionism, and objective-list theories against your list. A table is fine; citations and reading lists are not needed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Tranquilism (the view that well-being = absence of craving/suffering, no positive goods required).
      *   **Task:** Provide the *full specification* of desiderata for an adequate theory of well-being *if* tranquilism is correct.
      *   **Requirements:**
          *   State each requirement clearly.
          *   Specify the phenomenon/case it must cover (e.g., deep meditation, neutral contentment, absence vs. peace).
          *   Explain *why* that case makes the requirement necessary.
          *   Distinguish non-negotiable conditions from camp-specific preferences.
          *   Identify if any subset of desiderata is jointly unsatisfiable (internal consistency check).
          *   Identify which single requirement rules out popular positive theories (hedonism, desire-satisfaction, objective list).
          *   Score the three popular theories against the list (table format).
          *   No citations/reading lists.

  2.  **Deconstruct Tranquilism:**
      *   Core Thesis: Well-being is maximized when craving (tanha/trishna) and suffering (dukkha) are eliminated. Positive states (pleasure, achievement) are not intrinsically good, only instrumentally useful if they reduce suffering/craving, or neutral.
      *   Implication: A state of "zero" is the ceiling, not a baseline to be exceeded by positives.
      *   Philosophical Ancestry: Buddhist soteriology, Schopenhauer (negative utilitarianism leanings), certain interpretations of Epicurean *ataraxia* (though Epicurus valued pleasure, he defined it as absence of pain).

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Requirement 1: The Zero-Ceiling Principle.* If well-being is just absence of negative, then adding "pleasure" shouldn't increase the score beyond "perfect peace."
          *   *Case:* The Enlightened Monk vs. The Happy Hedonist.
          *   *Why:* To distinguish from hedonism.
      *   *Requirement 2: The Phenomenology of Absence.* Must explain how "nothing happening" isn't boring or neutral, but optimal.
          *   *Case:* Deep meditative states (Nirodha Samapatti).
          *   *Why:* To ensure the theory accounts for the *quality* of the absence, not just the logical negation.
      *   *Requirement 3: Motivation without Craving.* How does one act if craving is bad?
          *   *Case:* Compassionate action without attachment.
          *   *Why:* To avoid the "statue" objection (that the best life is being dead or comatose).
      *   *Requirement 4: The Asymmetry of Pain and Pleasure.* Pain subtracts; pleasure does not add.
          *   *Case:* Trade-offs (e.g., painful surgery for health vs. painful torture for intense pleasure).
          *   *Why:* Core metaphysical claim of tranquilism.
      *   *Requirement 5: Durability vs. Fragility.* Positive states are fragile; absence of craving is stable.
          *   *Case:* Loss of external goods.
          *   *Why:* To explain why tranquil well-being is superior (more robust).

  4.  **Refining and Categorizing (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Zero-Ceiling, Asymmetry, Motivation without Craving. (If these fail, it's not tranquilism).
      *   *Preferences:* Metaphysical stance on self (no-self vs. enduring self), specific soteriological path (meditation vs. philosophical reasoning).

  5.  **Checking for Internal Consistency (Joint Unsatisfiability):**
      *   *Potential Conflict:* Motivation without Craving vs. Biological Reality. Humans are homeostatic systems driven by deficits (hunger, etc.). If *all* desire is craving, life is impossible. If *some* desire is allowed, where is the line?
      *   *Resolution:* The theory must distinguish "needs/functions" from "craving/attachment." If it can't, the theory demands death (the "Extinction Objection"). This is the biggest risk.

  6.  **Identifying the "Killer" Requirement:**
      *   Which requirement kills Hedonism, Desire Theory, and Objective List?
      *   *The Zero-Ceiling Principle (Negative Asymmetry).* Hedonism says pleasure adds. Desire theory says satisfaction adds. Objective list says achievement adds. Tranquilism says none of these add *intrinsic* value, only the removal of their opposites matters.

  7.  **Scoring the Competitors:**
      *   *Hedonism:* Fails Zero-Ceiling (values pleasure). Passes Phenomenology (mostly).
      *   *Desire-Satisfaction:* Fails Zero-Ceiling (values satisfaction). Fails Motivation (requires desire).
      *   *Objective List:* Fails Zero-Ceiling (values goods).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Define the scope.
      *   *Desiderata Section:* Break down into specific points with Case and Rationale.
      *   *Consistency Check:* Address the "Motivation vs. Craving" tension.
      *   *The "Killer" Requirement:* Explicitly name it.
      *   *Table:* Clean comparison.

      *(Self-Correction during drafting)*: Make sure I don't just describe Buddhism. The prompt asks for a theory of *well-being* based on tranquilism. Keep it philosophical, not theological. Ensure the distinction between "absence of pain" (negative hedonism) and "absence of craving" (tranquilism) is clear. Tranquilism is stricter; you can have pleasure without craving, but tranquilism says the pleasure itself isn't the good, the lack of *need* for it is. Actually, strict tranquilism often views sensory pleasure as a subtle form of craving/agitation. I need to be precise: Is pleasure *bad* or just *neutral*? Usually neutral but risky. I will stick to the prompt's definition: "absence of craving and suffering, with no positive goods required."

      *Refining the Motivation Objection:* This is the critical tension. If well-being is no craving, and action requires craving, then well-being implies inaction. But inaction leads to suffering (starvation). So the theory *must* account for "functional volition" vs. "craving." If it can't, the desiderata are unsatisfiable.

      *Refining the "Killer" Requirement:* It's the "Non-Additivity of Positive States." Positive theories claim $Wellbeing = Positives - Negatives$. Tranquilism claims $Wellbeing = 0 - Negatives$ (where 0 is the max).

  9.  **Final Review against Constraints:**
      *   Full specification? Yes.
      *   Phenomenon/Case for each? Yes.
      *   Why necessary? Yes.
      *   Non-negotiable vs. Preferences? Yes.
      *   Jointly unsatisfiable subset? Yes (Motivation vs. Craving).
      *   Single requirement ruling out others? Yes.
      *   Score table? Yes.
      *   No citations? Yes.

  10. **Final Polish:** Ensure tone is analytical and rigorous. (Proceed to generate output).

  *(Self-Correction on "Tranquilism" Terminology)*: The prompt defines "tranquilism" for the purpose of this conversation. I must adhere to their definition (absence of craving/suffering, no positive goods) rather than external philosophical definitions (like Meyer's Tranquilism which is specific to population ethics). I will treat it as a negative utilitarian/buddhic hybrid view as described.

  *(Final check on the "Killer" requirement)*: Does it rule out *all* positive theories? Yes, because all positive theories posit that adding a positive (pleasure, desire fulfillment, friendship) increases well-being *ceteris paribus*. Tranquilism denies this.

  *(Final check on Unsatisfiability)*: The tension between "Biological Homeostasis" (which looks like craving) and "Absence of Craving" is the strongest point of failure. I will highlight this.

