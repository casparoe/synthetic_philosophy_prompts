          Despite this, the potential value of resolving the contradiction outweighs the cost. We can address the methodological concerns through the open data condition, allowing the audit to happen post-hoc without splitting the budget. We address the ethical concerns through dissemination oversight without censoring results. This approach balances our commitment to scientific freedom with our responsibility to social impact.

          I move that we vote to fund Proposal GEP-2023 with the conditions outlined above. The conditions must be signed off by the committee chair before the grant agreement is finalized. We need to close this file before Thursday. Please review the attached condition sheet and prepare to vote.

