answer: |-
  ### Brainstorming: How This Could Go Wrong

  1.  **The Constative Trap:** I make a statement like "You two are perfect together" or "This marriage will last forever." Philosophically, these are truth-claims (constatives) that could be proven false later. Socially, it violates the couple's explicit invitation rule and makes the bride's supervisor smirk.
  2.  **The Ventriloquist Error:** I read the mother's prepared text verbatim. Philosophically, this makes *me* the speaker of those assertions (the "loaned voice" problem). Socially, if the mother is ambivalent about the wedding, I become a liar on her behalf, and the bride's theory is proven right in the worst way.
  3.  **The Uptake Failure:** The mother speaks Romanian, and the room treats it as background noise. For a speech act to work, the audience must recognize and accept it (uptake). If they just sit there, the act fails, and the mother is left hanging.
  4.  **The Meta-Lecture:** I explain *why* we are doing this weirdly ("As the bride argues in her paper..."). This turns a wedding into a seminar, alienating the Romanian family and embarrassing the couple.
  5.  **The Insincerity Condition:** I claim the mother is "thrilled" or "over the moon" when she has been cool about the secular ceremony. This creates an infelicitous act because the internal state doesn't match the external expression.

  ### The "Must Not" List

  *   **Do not** make any predictions or assessments about the couple's relationship (no "you will," no "you are").
  *   **Do not** read the mother's written text; she must speak her own words.
  *   **Do not** explain the philosophical theory behind the toast to the guests.
  *   **Do not** pretend the mother feels excessive enthusiasm about the ceremony type; stick to the act of welcoming.
  *   **Do not** let the Romanian segment end without a specific, coordinated response from the room.

  ***

  ### The Toast

  Good evening. For those who don't know me, I'm [Name]. I've known [Groom] for twenty years. I write advertising for a living, which means I spend most of my day trying to make words do work. Usually, that work is selling something. Today, the request is a bit different.

  You all saw the note on the invitation. No predictions. No claims about who [Groom] and [Bride] are, or what their future holds. No "you're perfect for each other," no "you'll be happy forever." That's a rare request at a wedding. Usually, we treat a toast like a description of the couple. But descriptions can be wrong. Feelings change. Predictions fail.

  So, instead of describing anything, we're going to do something.

  Usually, this is the part where I'd talk about [Groom]'s mum, [Mother's Name]. She wrote a speech for today. She asked me to read it. But there are some words that lose their weight if they come from anyone other than the person who means them. If I read them, they become my words. And today isn't about me.

  [Mother's Name] wants to do something else. She wants to perform an act that doesn't depend on English, and doesn't depend on me. She wants to welcome [Bride] into the family. Not talk about it. Do it.

  In her village, there is a phrase used when a new member joins the family. It isn't a wish. It isn't a description. It is a change of status. She is going to say it now.

  Most of you won't understand the words. That doesn't matter. What matters is what happens next. An act like this only works if it's received. It needs a signature.

  So, here is the instruction. When [Mother's Name] finishes, I ask you to raise your glass. Don't drink yet. Just lift it. Hold it up for a moment. That lift is your signature. It says: "We hear you. We accept this welcome."

  [Mother's Name], whenever you're ready.

  *[Mother stands and speaks: "Bine ați venit în familia noastră."]*

  *[Pause]*

  Please, raise your glasses.

  *[Room raises glasses]*

  Hold it.

  *[Pause]*

  Thank you. You can drink.

  ***

  ### Load-Bearing Notes

  **1. The Shift from Constative to Performative:**
  The opening section ("Instead of describing anything, we're going to do something") sets the philosophical frame without using jargon. It validates the invitation's constraint while preparing the room for a non-standard toast. It signals to the supervisor that you understand the stakes, without lecturing the grandmother.

  **2. The Refusal of Ventriloquism:**
  By explicitly stating "If I read them, they become my words," you sidestep the "loaned voice" debate. You aren't taking a side in the theory; you are practically resolving it by handing the agency back to the mother. This protects you from the insincerity condition (you aren't claiming she feels anything specific) and satisfies the bride's requirement for authentic agency.

  **3. The Uptake Mechanism (The Glass Lift):**
  The line *"That lift is your signature. It says: 'We hear you. We accept this welcome.'"* is the critical felicity condition. In speech act theory, a performative fails without uptake. By instructing the room to lift their glasses *as acceptance* rather than as a wish for health/happiness, you turn a passive drinking cue into an active philosophical agreement. This ensures the Romanian phrase lands as a successful act, not just noise.

  **4. The Romanian Phrase:**
  "Bine ați venit în familia noastră" (Welcome to our family) is chosen because it is a performative formula, not a description of emotion. It doesn't claim "I am happy," it claims "You are in." This respects the mother's coolness about the ceremony while affirming the union.

  **5. The Closing:**
  "You can drink." Short, authoritative, releases the tension. It returns the room to the social flow without lingering on the theory.
