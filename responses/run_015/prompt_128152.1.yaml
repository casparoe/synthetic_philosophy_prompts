answer: |-
  The impasse is not primarily substantive (a dispute over facts), nor merely verbal (a dispute over definitions). It is a **category error compounded by axiological divergence**. The two camps are optimizing for different explanatory goods using incompatible metrics of success, resulting in a conflict over the **status of variance** in historical data.

  ### 1. Structure of the Disagreement
  The disagreement is best diagnosed as **two groups answering different questions under a single heading**, but with the added friction that each side believes the other's question is illegitimate.

  *   **The Synthetic Defenders (Camp A)** are asking a **Nomothetic** question: *What are the structural constraints and probabilistic tendencies of human social organization over millennial scales?* They treat history as a system where signal (structure) must be separated from noise (contingency).
  *   **The Critical Critics (Camp B)** are asking an **Idiographic and Modal** question: *What was the range of conscious political choice available to specific populations, and how does narrating this as inevitable constrain current political imagination?* They treat the "noise" (variability, outliers, reversals) as the signal (agency, possibility).

  The structural blockage arises because **Camp A treats the variance Camp B studies as the error term, while Camp B treats the error term as the phenomenon.** For Camp A, an egalitarian city-state that collapses is an anomaly to be explained away or averaged out to find the "trend" toward hierarchy. For Camp B, that city-state is proof that hierarchy is not a trend but a choice, and treating it as an anomaly is an ideological act that naturalizes the status quo.

  ### 2. Explanatory Standards in Play
  The conflict is driven by a clash of four specific explanatory standards:

  1.  **Predictive Power (ex post) vs. Counterfactual Robustness:**
      *   Camp A prioritizes **fit and parsimony**. A good explanation minimizes variables (geography, energy) to maximize the variance explained in the *actual* historical record.
      *   Camp B prioritizes **counterfactual coverage**. A good explanation must account for why alternative paths *not* taken were viable. If a model predicts hierarchy is inevitable given certain conditions, but ethnography shows hierarchy was rejected under those conditions, Camp B rejects the model regardless of its predictive fit on the aggregate.

  2.  **Representativeness of Cases:**
      *   Camp A selects cases to maximize **generalizability** (large-N, broad strokes).
      *   Camp B selects cases to maximize **existential proof** (existence theorems). One robust counter-example (e.g., a large settlement without rulers) falsifies a necessity claim, regardless of how rare it is.

  3.  **Normative Neutrality:**
      *   Camp A claims neutrality by adhering to **methodological naturalism** (treating social facts like natural facts).
      *   Camp B argues that **framing is performative**. To describe a trajectory as "development" is to normatively endorse the endpoint. They demand a standard where the *language of description* does not implicitly validate the *outcome of the process*.

  4.  **The Role of Contingency:**
      *   Camp A views contingency as **local friction** that averages out over time.
      *   Camp B views contingency as **constitutive**. There is no "average" human history, only specific decisions.

  ### 3. Can Empirical Findings Resolve This?
  **No.** The blockage is **conceptual and axiological**, not empirical.

  New archaeological data (e.g., discovering more non-hierarchical mega-sites) will not resolve the standoff because the disagreement is about **how to weight the data**, not what the data is.
  *   If more egalitarian sites are found, Camp A will incorporate them as "early experiments" or "exceptional ecologies" within a broader trajectory toward complexity.
  *   Camp B will cite them as falsification of the trajectory itself.

  Because Camp A's methodology relies on abstraction (which necessarily discards local detail) and Camp B's methodology relies on particularity (which necessarily resists abstraction), no amount of data can satisfy both standards simultaneously. The dispute is about whether "human history" is a singular object amenable to law-like generalization or a multiplicity of political projects amenable only to contextual interpretation.

  ### 4. What Counts as Genuine Progress?
  Since the dispute is axiological (a disagreement about what counts as a valuable explanation), progress cannot come from one side defeating the other. It requires a **conceptual distinction that decouples the two projects** while acknowledging their interdependence.

  **The Solution: A Topological "Phase Space" Model**
  Progress would look like shifting from a **Linear/Stage Model** (Camp A's default) to a **Phase Space/Topology Model**.
  *   **Current State:** Camp A draws a line through the data points (progress/complexity). Camp B points out points off the line.
  *   **Progressive State:** Map the **volume of occupied vs. available political space**.
      *   Define the **Constraints** (Camp A's contribution): What was physically/demographically impossible? (e.g., hunter-gatherer density limits).
      *   Define the **Possibility Space** (Camp B's contribution): Within those constraints, what range of social arrangements were actually instantiated?
      *   **The Synthesis:** Acknowledge that while constraints narrow the field over time (e.g., population density makes certain egalitarian forms harder), the specific selection within the remaining field is political, not deterministic.

  This requires a **Shared Protocol for Selecting Ethnographic Comparators** based on **Functional Equivalence** rather than **Morphological Similarity**. Instead of comparing "states" to "bands" (which implies a ladder), compare specific problem-solving mechanisms (e.g., "how is violence monopolized?" or "how is surplus stored?") across different scales. This allows Camp A to analyze mechanisms without implying a teleological stage, and allows Camp B to compare variability without denying scale.

  ### 5. Verdict
  The question is **not ill-posed**, but the **single heading is**.
  The blockage is **axiological**. Camp A values **Causal Clarity** (knowing *why* things happened), while Camp B values **Political Openness** (knowing things *could have happened otherwise*).

  **Resolution:** The field must abandon the search for a "Grand Unified Theory of History" that satisfies both. Instead, it must adopt a **division of labor**:
  1.  **Macro-Causal Analysis:** Explicitly framed as identifying *constraints and probabilities*, not inevitabilities. It must accept that its "laws" are probabilistic tendencies, not deterministic stages.
  2.  **Micro-Political Archaeology:** Explicitly framed as recovering *agency and variability*, not disproving structural constraints. It must accept that documenting alternatives does not negate the structural pressures that made those alternatives difficult to sustain.

  Genuine progress is the explicit admission that **explanation (Camp A) and emancipation (Camp B) are distinct epistemic goals** that require different methodological tools. Trying to force them into a single narrative architecture guarantees the current standoff.
