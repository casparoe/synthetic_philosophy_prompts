answer: |-
  You have hit on one of the most famous and frustrating problems in decision theory. You are absolutely right that if you apply naive Expected Value (EV) reasoning with an unbounded utility function, Pascal's Mugging "breaks" rationality by forcing you to hand over your wallet to every random claimant who promises a big enough payoff.

  Your intuition that this is "obviously nuts" is shared by almost everyone who studies this, including economists, philosophers, and AI researchers.

  However, most experts argue that **rounding tiny probabilities to zero is not the right fix**, precisely for the reason you suspected: the cutoff is arbitrary, and it blinds you to real existential risks. (If you round $10^{-9}$ to zero, do you also ignore the risk of an asteroid strike? Or AI misalignment?)

  So, if we don't round to zero, how do we solve it? There are three main approaches that save Expected Value reasoning without breaking rationality.

  ### 1. Bounded Utility (The Mathematical Fix)
  The root of the problem is assuming that "goodness" (utility) can increase infinitely. In the mugging scenario, the utility is $10^{30}$ lives. But does saving $10^{30}$ lives actually matter $10^{30}$ times more than saving one life?

  Most decision theorists argue for **Bounded Utility**. This means there is a maximum cap on how much value any outcome can have.
  *   **Analogy:** Imagine you are hungry. One burger gives you 10 units of satisfaction. Two gives you 15. By the time you get to 100 burgers, you are sick. The 101st burger has *negative* value.
  *   **Application:** Even if there are $10^{30}$ lives, your capacity to care about them, or the total amount of "meaningful" value in the universe, might be capped. If utility is capped at, say, 1,000,000, then a 1-in-a-billion chance of that max utility is still tiny ($0.000001$). The EV no longer dominates the $20 cost.

  This solves the math without needing an arbitrary probability cutoff.

  ### 2. The Leverage Penalty (The Complexity Fix)
  Robin Hanson, an economist, proposed that the probability of a claim being true should decrease *faster* than the payoff increases. This is often tied to **Kolmogorov Complexity** (how complex a description is).

  *   **The Logic:** To affect $10^{30}$ lives, you need a mechanism capable of affecting $10^{30}$ lives. That mechanism must be incredibly complex.
  *   **The Penalty:** The more leverage you claim to have, the less likely it is that *you specifically* are the person with that leverage.
  *   **The Math:** If the payoff grows by $10^{30}$, the probability of you being in a position to affect that payoff should shrink by at least $10^{-30}$ (or more) because the hypothesis "I am a secret alien savior" is vastly more complex than "I am a guy who wants lunch."

  If the probability shrinks faster than the utility grows, the Expected Value stays small. You don't need a hard cutoff; the EV naturally converges to zero as the claims get more absurd.

  ### 3. Evidential Update (The Credibility Fix)
  This approach focuses on the evidence, not just the raw probability.
  *   **The Claim:** "I am an alien who will save $10^{30}$ lives."
  *   **The Evidence:** A guy asking for $20 on the street.

  Bayesian reasoning requires you to update on the *evidence*. What is the probability that a guy on the street would ask for $20 *if* he were actually an alien savior? Versus the probability he would ask for $20 *if* he were just a scammer?

  The likelihood of a scammer asking for $20 is nearly 100%. The likelihood of an advanced alien needing $20 for lunch and verifying their identity via a street mugging is infinitesimally smaller. When you update based on the *method of delivery*, the posterior probability of the claim being true drops so low that it doesn't matter what the payoff is.

  ### Why "Rounding to Zero" is Dangerous
  You asked: *"How do you pick the cutoff without it being totally arbitrary?"*

  The answer is: **You can't.** And that's why it's a bad solution.

  If you set a hard rule like "Ignore any probability below $10^{-9}$," you create a **discontinuity**.
  *   Scenario A: 1 in $10^{-8}$ chance of human extinction. (You act).
  *   Scenario B: 1 in $10^{-10}$ chance of human extinction. (You ignore).

  This makes you vulnerable to "Pascal's Wager" style problems in reverse. It prevents you from taking precautionary measures against rare but catastrophic events (like pandemics or asteroid impacts) simply because the odds are low. Rationality should be smooth, not jagged.

  ### The Verdict
  Pascal's Mugging doesn't break Expected Value reasoning; it breaks **naive** Expected Value reasoning that assumes:
  1.  Utility is unbounded.
  2.  Probability is independent of claim complexity.
  3.  Evidence doesn't need to be scrutinized.

  Once you apply **Bounded Utility** or **Complexity Priors**, the "astronomically huge" expected value evaporates. You don't have to arbitrarily round probabilities to zero; you just have to recognize that claims of infinite leverage come with probabilities that shrink even faster than the leverage grows.

  So, keep your $20. Not because the probability is zero, but because the *expected value* is actually small once you account for how absurd the claim really is.
