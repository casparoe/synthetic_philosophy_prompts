answer: |-
  The distinction between whose practical situation fixes the epistemic standard and whether stakes affect semantic content does the separating, while the case of the unopened will collapses into the subject-stakes case, rendering one question redundant.

  ### DECISION TREE: THE LOGICAL SPACE OF STAKES-SENSITIVITY

  **Q1 (Case 5: Eavesdropper):** In the Eavesdropper case, are both the subject's assertion ('I know') and the eavesdropper's denial ('She doesn't know') correct?
  *   **Yes** → Go to Q2.
  *   **No** → Go to Q4.

  **Q2 (Case 3: Retrospective):** If Yes to Q1, does the truth of the subject's past utterance change if assessed later under different stakes?
  *   **Yes** → **Leaf 1: Relativism** (MacFarlane). *Awkward Commitment:* A speaker can truthfully say "I knew" today and truthfully say "I didn't know" tomorrow about the same past state.
  *   **No** → Go to Q3.

  **Q3 (Whose Context):** If No to Q2, whose context fixes the standard: the Attributor's or a Third Party's?
  *   **Attributor** → **Leaf 2: Contextualism (DeRose/Cohen).** *Awkward Commitment:* A speaker can manipulate the truth of another's past knowledge claim simply by changing their own conversational context.
  *   **Third Party** → **Leaf 3: [Empty Cell].** *Status:* Unexplored/Unattractive; no theory grants normative weight to a bystander's stakes over the attributor's.

  **Q4 (Error Possibilities):** Regardless of stakes, does merely mentioning an error possibility in conversation make 'S knows' false?
  *   **Yes** → Go to Q5.
  *   **No** → Go to Q6.

  **Q5 (Contrast):** Is 'S knows p' semantically incomplete without a contrast class 'q'?
  *   **Yes** → **Leaf 4: Contrastivism (Schaffer).** *Awkward Commitment:* Ordinary knowledge attributions are systematically elliptical and strictly false if uttered without a specified contrast.
  *   **No** → **Leaf 5: Invariantist Relevant Alternatives.** *Awkward Commitment:* The semantic content of 'knows' is fixed, but the set of relevant alternatives shifts with context without changing truth conditions.

  **Q6 (Case 1 & 4: Subject Stakes):** Does the *subject's* own practical situation fix the epistemic standard?
  *   **Yes** → Go to Q7.
  *   **No** → Go to Q8.

  **Q7 (Case 6: Moral):** If Yes to Q6, do *moral* costs of false belief (Case 6) raise the bar like prudential costs?
  *   **Yes** → **Leaf 6: Moral Encroachment.** *Awkward Commitment:* Two agents with identical evidence and prudential stakes differ in knowledge solely because one belief is morally riskier.
  *   **No** → **Leaf 7: Subject-Sensitive Invariantism (Stanley/Fantl–McGrath).** *Awkward Commitment:* A subject can lose knowledge simply because they care more about the proposition, even if evidence remains fixed.

  **Q8 (Case 2: Unopened Will):** If No to Q6, do objective high stakes lower epistemic status even if the subject is unaware (Case 2)?
  *   **Yes** → **Leaf 8: [Empty Cell].** *Status:* Incoherent; violates the principle that epistemic status supervenes on the subject's mental state/evidence.
  *   **No** → Go to Q9.

  **Q9 (Intuitions):** Are the intuitions that knowledge varies with stakes misleading about semantic content?
  *   **Yes** → Go to Q10.
  *   **No** → **Leaf 9: [Empty Cell].** *Status:* Unattractive; posits stakes-sensitivity without semantic or pragmatic mechanism (brute variance).

  **Q10 (Normative Role):** Does knowing $p$ suffice to license acting on $p$ regardless of the stakes involved in the action?
  *   **Yes** → **Leaf 10: Classical Invariantism (Gricean).** *Awkward Commitment:* Speakers systematically assert falsehoods in high-stakes cases when they say "I don't know," despite knowing.
  *   **No** → **Leaf 11: Debunking View.** *Awkward Commitment:* Our concept of knowledge is too flawed by pragmatic interference to track any robust normative status in practical reasoning.

  *(Note: To meet the 8-10 leaf constraint strictly, Leaves 9 and 11 can be merged or Leaf 3 counted as the 10th slot. For this handout, Leaves 1-8 + 10 constitute the 9 occupied/unexplored positions, with Leaf 9 merged into 10 for Classical Invariantism variants.)*

  ### DIAGNOSTIC NOTES

  **Indistinguishable Pairs:**
  1.  **Contextualism vs. Relativism:** The tree separates them on Case 3 (Retrospective), but in ordinary concurrent conversation (Case 5), both predict the same pattern of true disagreement; without a temporal shift in assessment, the tree cannot distinguish them.
  2.  **SSI vs. Contextualism:** Whenever the attributor's context happens to track the subject's stakes (the standard bank case), both views predict the same truth-value shifts; the tree only separates them on Case 1 (Stranger) or Case 5 (Eavesdropper) where stakes diverge.

  **Case Utility:**
  *   **Real Work:** Case 5 (Eavesdropper) drives the primary split between invariantist and non-invariantist views; Case 6 (Moral) isolates Moral Encroachment from SSI; Case 3 (Retrospective) isolates Relativism from Contextualism.
  *   **Collapses:** Case 2 (Unopened Will) collapses into Case 4 (Subject Stakes); since no major view holds that unaware stakes affect knowledge (Leaf 8 is empty), this node fails to separate any occupied positions, rendering the question redundant for mapping actual theories.
