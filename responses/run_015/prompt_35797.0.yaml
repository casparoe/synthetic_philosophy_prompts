      *   *Step 1 (Self = Pattern):* This is the Hofstadter core. Rejecting this kills the consolation immediately. If the self *is* the biology, death is absolute. User wants to keep survival.
      *   *Step 2 (Substrate Independence):* Necessary for the pattern to move to other brains. Rejecting this kills the mechanism of survival.
      *   *Step 3 (Others hold models):* Empirically true. People do model each other.
      *   *Step 4 (Partial instantiation = Part of me located there):* **This is the suspicious link.** It equates *representation* with *identity*. Just because someone has a model of you doesn't mean *you* are there. It conflates "a map of Paris" with "a piece of Paris."
      *   *Step 5 (Survival Conclusion):* This follows from 4. If 4 is weak, 5 is weak.

