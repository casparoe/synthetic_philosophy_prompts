      *   *Actually, the strongest philosophical objection is the "Center of Narrative Gravity" (Dennett) or the "Strange Loop" (Hofstadter).* The loop must close on *itself*. A model of me in your head closes on *you*. Therefore, it is *your* thought about me, not *my* thought.
