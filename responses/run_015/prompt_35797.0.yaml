      *   (5) Death of organism $\rightarrow$ External instantiations persist $\rightarrow$ Diminished survival.

      *   *The Problem (The "Too Much"):*
          *   Quantity/Quality paradox: A famous novelist survives "more" than a mother.
          *   Fidelity paradox: A critic knows the work better than a sibling, so survives better in the critic.
          *   Character/Author paradox: Readers hold the character's pattern more strongly than the author's, so the character survives instead of the author.

