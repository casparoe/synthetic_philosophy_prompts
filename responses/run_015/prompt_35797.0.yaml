          *   The Critic: The critic's model is cold/analytical. It lacks the "habit of referring all these back to *itself*" (Step 1) in a way that integrates the deceased into the *critic's* survival. Wait, actually, the key is *intimacy* vs. *data*. The sister's model is woven into her own self-constitution. The critic's model is external data.
          *   The Character: The character has no "self-referential loop." The character is a static pattern. The author has the loop. Readers run the loop. But the character isn't "alive" in the Hofstadter sense to begin with.

      *   *Refining the Fix:* The distinction is between a *simulation* and a *constituent*.
      *   Step 4 claims the model *is* a part of me. It should claim the model is a *trace* of me that becomes part of *you*.
      *   Survival isn't "I live on." Survival is "I affect the 'I' that lives on."
      *   This shifts the consolation from "He is still here" to "He is still *in* me." This is often more emotionally sustainable anyway.

