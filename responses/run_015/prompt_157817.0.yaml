answer: |-
  Here is the plan. It is designed to respect the 80-minute limit, the audience's existing mental models, and your specific pedagogical constraints.

  ### 1. The Order of Operations: Case First, Machinery Second
  **Lead with the villain-free case (Minute 0–15).** Do not build the machinery first.

  **Why:** Your audience walks in with a "Villain Model" (Bad Person → Bad Outcome). If you start with abstract machinery (selectors, steps, incentives), they will filter it through the Villain Model. They will hear "Selector" and think "Landlord." They will hear "Incentive" and think "Greed." You must break the Villain Model *before* you give them the tools to analyze it. If you wait until minute 40, you have spent 40 minutes reinforcing the very cognitive habit you are trying to undo.

  **What must be in place before the villain-free point lands:**
  You need **shared stakes**. The example must matter to them enough that they care about the outcome, but be distant enough that they don't immediately reach for a villain. This is why your choice of carrying case is critical (see below).

  ### 2. The Knobs: Sequence and Placement
  Your instinct is correct: **Selector → Step → Floor.**

  1.  **The Selector (Minute 15–30):** Define *what* is choosing. Is it a market? A councillor's attention span? A spreadsheet algorithm?
      *   *Why first:* Without the Selector, the "Step" looks like a free choice. If a tenant group *chooses* to hire a comms officer, that looks like agency. If the *Selector* (Councillor Attention) only rewards groups with comms officers, that looks like coercion. You must establish the coercion before you analyze the move.
  2.  **The Step (Minute 30–50):** Define the individual move.
      *   *Why second:* Once the pressure is established, the move becomes inevitable. This is where you show that "unilateral restraint selects you out."
  3.  **The Floor (Minute 50–70):** Define the limit. Does the race end in death/burnout, or does it stabilize at a miserable equilibrium?
      *   *Why last:* The Floor determines the *intervention*. If there is no floor (the race destroys the players), you need an emergency brake. If there is a floor (stable misery), you need a rule change. This is the "what do we do" section, so it belongs at the end.

  ### 3. The Carrying Case
  **Carry the session with (c) Their own campaigning.**
  **Use (a) The Parade as the 10-minute warm-up.**

  **Why (c) carries it:**
  It has the highest stakes and the highest agency. If they understand this trap, they can change their own behavior next week. It transforms the theory from "something landlords do to us" to "something systems do to everyone, including us."

  **What (c) must have structurally:**
  *   **Have:** A **non-human Selector**. You must frame the Councillors/Funders not as villains, but as a *scarce resource bottleneck*. They don't *want* you to burn out; they just only have 5 hours a week to read emails. The *scarcity* is the selector, not the person.
  *   **Have:** A **Replicable Step**. Hiring a comms person or starting a legal fund must be something *any* group can copy. If only rich groups can do it, it's class oppression (Villain Model). If any group can do it, it's an arms race (Trap Model).
  *   **Lack:** A **Coordination Fix**. You must ensure the group sees that "let's all agree to stop" fails because new groups will enter the race or existing groups will defect. This prevents the "just talk" solution.

  **What to do with the others:**
  *   **(a) The Parade:** Use this for the first 10 minutes. It is the "Villain-Free Proof of Concept." It gets them nodding before you hit them with the heavier stuff.
  *   **(b) Service Charges:** Keep this in your back pocket for Minute 60. If they say "This is just capitalism," use (b). It shows the trap exists in small business competition too, decoupling it slightly from "Capitalism" as a monolithic villain.
  *   **(d) Shift Signup:** Use this for the Takeaway. It's the simplest example of the diagnostic.

  ### 4. Misconception Management
  Your order is mostly right, but **(2) Communication/Trust** needs to move earlier.

  1.  **Someone is to blame (Minute 15):** Kill this during the **Selector** phase. "The Councillor isn't evil, they are just a bottleneck."
  2.  **Fix is communication/trust (Minute 40):** Kill this *before* you propose solutions. If they think talking fixes it, they won't listen to the structural fix. Show them that even if Group A and Group B agree, Group C will enter the market and undercut them.
  3.  **Collective willpower (Minute 60):** Kill this during the **Floor** phase. Willpower doesn't change the Selector.
  4.  **Winners like it (Minute 50):** Address this when discussing Stability. "The 'winners' are just the ones who haven't burned out yet."
  5.  **Capitalism/Excuse for inaction (Minute 70):** Address this in the conclusion. "Identifying the trap isn't an excuse to give up; it's the only way to find a lever that isn't broken."
  6.  **Over-application (Minute 75):** Address this in the diagnostic.

  **Correction:** Do not grant "This is just capitalism." While true in a broad sense, granting it lets them off the hook of analyzing the *specific mechanism*. Keep it mechanical, not ideological.

  ### 5. The Takeaway Diagnostic
  You want a sentence they can use at a meeting.

  > **"If stopping makes you lose, but everyone continuing makes everyone lose, you're in a trap."**

  *(Alternative: "Can we stop without losing? If no, and we all hate doing it, it's a trap.")*

  ### 6. What to Refuse to Explain
  Be explicit about this. It builds trust and manages scope.

  *   **Formal Game Theory:** "I am not going to teach you Nash Equilibrium. We don't need the math to see the shape."
  *   **Moloch Etymology:** "The word comes from a poem about AI risk. We are not talking about AI. We are talking about your Tuesday night meeting."
  *   **Tragedy of the Commons:** "That's about sharing a resource until it's gone. This is about competing for a resource until it's worthless. They are cousins, not twins."

  **Why:** These are load-bearing distractions. They invite intellectualization rather than application.

  ### 7. The Final Check Question
  Do not ask "Do you understand?" Ask for application.

  > **"What is one thing our union does that we would be stronger if we all banned ourselves from doing?"**

  If they can name a specific tactic (e.g., "replying to emails after 8pm," "taking individual casework without a group mandate"), they have internalized the Selector/Step/Floor model. If they name a landlord action ("raising rents"), they have missed the point.

  ### Summary Timeline
  *   **00–10:** **The Parade (Case A).** Establish the pattern. No villain. Bad outcome.
  *   **10–15:** **The Pivot.** "This happens in housing. It happens in our union."
  *   **15–30:** **The Selector (Case C).** Councillor attention as a bottleneck. Not malice, scarcity.
  *   **30–50:** **The Step (Case C).** The arms race of slickness. Why unilateral restraint fails.
  *   **50–60:** **The Floor (Case C).** Burnout vs. Stability. Who actually wins?
