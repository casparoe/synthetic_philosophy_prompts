      *(Refining the "Aunt" point)*: The aunt wants to say she "fought." The mother would say the illness progressed according to biology. I can acknowledge the *intensity* of the experience without the *moral struggle*. "The end was difficult," not "She battled."

  9.  **Final Polish:** Check for accidental "ledger" words (deserve, earn, owe, debt, justice, fair, choice, will).

      *Wait, I need to be careful with "choice."* She taught freedom. I can speak of her *decisions* as events that happened, without implying uncaused agency. "She turned toward..." instead of "She chose to..."
      *Actually, the prompt says she taught a seminar on "freedom and responsibility."* I can use those words if they are contextualized as her specific view. But the instruction says "no miniature lecture." So I must use them carefully. I will focus on *response-ability*: the ability to respond.

