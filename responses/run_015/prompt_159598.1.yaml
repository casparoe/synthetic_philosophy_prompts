      *(Refining the Aunt's section)*: Instead of "earned peace," try "found peace" or "peace came to her." Or focus on the *nature* of the peace. "She was at ease."

  6.  **Drafting the Content (incorporating the "Nurse" memory):**

      *   "A nurse told her she was brave. She said she was lucky." This is the anchor.

  7.  **Drafting the Post-Script:**

      *   Identify sentences I wanted to write.
