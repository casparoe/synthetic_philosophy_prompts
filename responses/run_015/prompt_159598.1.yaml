answer: |-
  **Eulogy**

  Thank you for coming. Looking around this room, I see the distinct circles of my mother's life that rarely touched while she was here. Her colleagues from the university. Members of our family. And students from the seminar she held inside the correctional facility. She would have liked this arrangement. She spent her life building bridges between abstract ideas and the hard, concrete reality of living them.

  Many of you know the phrase she kept on our kitchen magnet: *Life isn't a ledger.* To some, that sounded like cheerful advice not to keep score in a relationship. But for her, it was a description of how the world actually works. She believed that we are all carried forward by causes and conditions, by luck and chemistry and history, rather than by a cosmic system of rewards and punishments.

  I saw this clearly near the end. A nurse, seeing her manage the pain without complaint, told her she was being so brave. My mother looked at her, not unkindly, and said, "I haven't been brave. I've been lucky in my chemistry and lucky in my doctors." She wasn't diminishing her experience. She was refusing to claim a moral victory over her own biology. She understood that her calm was not a trophy she had won, but a state she happened to inhabit.

  This view shaped how she taught. To her colleagues, she was a rigorous philosopher. But to the students in the prison seminar, she was not a judge. She did not enter that room to measure who was good or who was bad, or to suggest that anyone was paying a debt to society. She entered that room to think. She treated the questions of freedom and responsibility as shared problems, not as tools for assessment. She knew that telling someone they are wholly the author of their past can be a heavy burden, but she also knew that treating them as incapable of thought was an insult. So, she offered them the dignity of engagement. She asked them to describe who they were and who they might become, not to settle an account, but to map a terrain. I am grateful that two of those students are here today. Your presence honors the work you did together.

  For our family, this philosophy requires a different kind of honesty. My aunt asked me to speak about how my mother fought hard and earned her peace at the end. I cannot say that. To say she earned it would be to suggest the peace was a wage, and that the struggle was a transaction. The truth is simpler and, I think, more beautiful. The struggle was real, and the peace was real, but one did not purchase the other. The peace arrived. It was a gift of circumstance and care, not a settlement. She did not conquer the end; she met it, and she was met by it with gentleness.

  This is hard to hold when we are grieving. My daughter, who is fifteen, has spent this week telling me that this isn't fair. She is right, in the way that matters most to a grieving heart. The world does not owe us continuity. The universe does not balance its books to ensure we keep the people we love for a full measure of time. There is a truth in her anger: the arbitrariness of loss is brutal. But there is no one to bill for it. There is no injustice in the cosmic sense, only the profound, aching absence of a specific person in a world that must go on without her. We do not grieve because a debt is owed to us. We grieve because something of immense value is gone.

  So, how do we speak of her without the ledger? We do not say she deserves our love. We simply say we love her. We do not say she is resting because she earned rest. We say that the noise of her life has quieted. We can admire her intellect without claiming she was morally superior for having it. We can miss her without claiming the universe wronged us by taking her.

  She did not believe in an afterlife. She did not believe she was going to a place where the scores would finally be tallied and corrected. She believed she was here, and then she would not be. But she also believed that what happens between people is real. The thoughts she sparked in her students, the arguments she had with her colleagues, the love she shared with us—these are events that occurred. They cannot be undone. They are part of the history of the world now, fixed and true.

  To her colleagues: thank you for thinking with her.
  To her students: thank you for thinking with her.
  To our family: thank you for living with her.

  We are not here to settle anything. We are here to witness. We are here to say that she was here, and that it mattered that she was. We carry the impact of her life forward, not as a debt we must repay, but as a momentum we now share.

  ***

  **Note on Constraints**

  1.  **Sentence I wanted to write:** "She earned the peace that came to her at the end."
      *   **Blocked by:** Her rejection of *moral desert*. To say she "earned" peace implies a transaction where suffering purchases relief. Her view held that peace was a causal outcome (chemistry, care), not a moral reward.

  2.  **Sentence I wanted to write:** "We owe it to her to live good lives."
      *   **Blocked by:** Her rejection of *debts of gratitude*. While she valued valuation, she explicitly ruled out the idea that another person's existence creates a moral debt that survivors are obligated to settle through their own behavior.

  3.  **Sentence I wanted to write:** "It is unjust that she was taken so soon."
      *   **Blocked by:** Her rejection of *cosmic justice/fairness*. While I validated the daughter's feeling of unfairness as an emotional reality regarding arbitrariness, I could not validate "injustice" as an objective metaphysical claim, as that would imply a ledger exists that is being unbalanced.
