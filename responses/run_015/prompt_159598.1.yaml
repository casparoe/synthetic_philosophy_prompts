      *   **Mother's Philosophy (Crucial Constraint):**
          *   Determinism is true.
          *   No moral desert (no earned rest, no deserved suffering, no debts of gratitude, no wrongs to be paid for).
          *   Responsibility as "ledger-keeping" is false.
          *   What survives: Description, valuation, rejoicing, grieving, admiring *without* settlement.
          *   No afterlife consolation.
          *   No mini-lectures on determinism.
      *   **Specific Problems to Solve:**
          1.  *The Aunt's Paragraph:* Must replace "she fought hard and earned her peace" (implies desert/effort-based reward) with something true to her view but not cold.
          2.  *The Daughter's Grief:* Address the 15-year-old's feeling that "it isn't fair" without smuggling in desert (fairness usually implies desert).
      *   **Specific Memory:** Include the nurse calling her brave, and her reply about luck (chemistry/doctors).
      *   **Length:** ~1000 words (7-9 minutes).
      *   **Post-Script:** A note identifying 2-3 sentences wanted to write but couldn't, explaining which part of her view blocked them.

  2.  **Deconstruct the Philosophy for the Eulogy:**

      *   *Forbidden:* Earned, deserved, fought, battle, victory, debt, owed, payment, justice (retributive), fair/unfair (in the sense of cosmic balance), choice (libertarian free will), agency (in the sense of uncaused cause).
      *   *Allowed:* Luck, chance, causation, description, love, grief, impact, presence, gratitude (as a feeling, not a debt), memory.
      *   *Tone:* Warm, honest, grounded, not academic, not cold/nihilistic. It needs to feel like a celebration of a life without implying the deceased *merited* the celebration through moral effort.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the diverse room. Set the tone. Avoid "we are here to honor her memory" if "honor" implies debt. Focus on gathering to speak of her.
      *   **The Magnet/Philosophy:** Address "life isn't a ledger" without lecturing. Show, don't tell. Use the nurse memory here. It perfectly illustrates her rejection of "bravery" (moral virtue) in favor of "luck" (causation).
      *   **The Prison Students:** Acknowledge their presence. Validate their connection to her. Avoid saying "you chose to change." Instead, focus on the shared inquiry, the thinking together.
      *   **The Aunt's Problem:** Replace "earned her peace." Focus on the *arrival* at peace, not the *earning*. The peace happened *to* her, or was found, not won.
      *   **The Daughter's Problem:** Address "it isn't fair." Acknowledge the pain of loss without implying the universe owes us more time. Grief is a response to value, not a claim of injustice.
      *   **Closing:** A farewell that doesn't promise reunion (no afterlife) but affirms the lasting impact of her existence.

  4.  **Drafting - Navigating the Constraints (Iterative Process):**

      *   *Constraint Check:* "She fought hard." -> *Correction:* "She endured," or "Her path was difficult," but even "endured" implies effort. Better: "The illness was severe, and the calm she found was real." Let's focus on the *state* of peace, not the *acquisition* of it.
      *   *Constraint Check:* "It isn't fair." -> *Correction:* Acknowledge the feeling. "Fairness implies a balance sheet." Instead: "The world does not owe us continuity." Or simply validate the grief without validating the cosmic judgment. "The pain of this absence is real, regardless of why it happened."
      *   *Constraint Check:* Prison students. Don't say "you took responsibility." Say "you engaged with the questions." "You showed up."
      *   *Constraint Check:* No lecture. Keep the language ordinary. Use "luck" and "chance" instead of "determinism."

  5.  **Writing the Eulogy (Mental Outline & Keyword Association):**

      *   *Start:* Welcome everyone. The mix of people reflects her life.
