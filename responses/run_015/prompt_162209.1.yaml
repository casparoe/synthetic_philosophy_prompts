answer: |-
  **Project Title:** From Witness to Procedure: Reconstructing Factual Truth in the Absence of Eyewitnesses

  **Project Summary**
  This project interrogates the stability of factual truth in contemporary politics by revising Hannah Arendt's account of lying. In her essays on truth and politics, Arendt argues that factual truth is uniquely fragile because it is contingent; unlike rational truth, a fact could have been otherwise, making it vulnerable to the liar's coherent alternative. Her proposed remedy is institutional: facts survive only when publicly attested and protected by disinterested institutions like courts and the press. However, Arendt's model presupposes an epistemic architecture of witnessing: someone saw it, or a document records it, and the political struggle is over belief in that testimony.

  This dissertation argues that Arendt's diagnosis of fragility is not a feature of factual truth as such, but an artifact of the eyewitness model. Most facts driving modern political argument—unemployment rates, climate data, casualty counts—are not witnessed by any individual. They are outputs of aggregation or modeling. When facts lack witnesses, the political attack shifts from denying the fact to discrediting the procedure. Consequently, the Arendtian remedy of "public attestation" fails, because there is no one to attest. This project defends the claim that as the "witness-structure" of a fact changes, the institutional defense of truth must shift from publicity to traceability. The goal is not merely to apply Arendt to new cases, but to amend her political ontology of truth to account for the procedural nature of modern facts.

  **The Problem and Intervention**
  Current scholarship on political lying generally falls into two camps. The first extends Arendt's framework, focusing on how systematic lying destroys the "common world" shared by citizens. The second approaches the issue through social epistemology, analyzing trust in experts and testimony. Neither settles the specific problem of non-witnessed facts. The Arendtian approach correctly identifies the stakes—the stability of the public realm—but relies on an outdated epistemic unit (the witness). The social epistemology approach correctly identifies the mechanism of belief (trust in expertise) but misses the political ontology. It asks how an individual is justified in believing a statistic, whereas the Arendtian question is how a statistic functions as a *fact* that holds a world in common.

  This project bridges that gap by introducing the concept of "witness-structure." I distinguish four categories of factual claims: (1) direct witnessing; (2) archival witnessing (records viewable by a single agent); (3) aggregation (inputs too numerous for any single witness); and (4) modeling (counterfactual or projected outputs). The central argument is that fragility increases as we move down this list, not because the facts become less real, but because the possibility of public attestation vanishes.

  The project argues determinately that the fragility Arendt describes is structural, not ontological. Therefore, the defense of truth at the lower end of the spectrum cannot rely on the "right to know" or freedom of the press, since there is no raw data for the press to witness. Instead, it requires a right to *traceability*. The dissertation will defend the norm that for aggregated and modeled facts to function politically, the procedure from input to output must be followable by agents who never see the inputs. This moves the locus of truth-protection from the *source* to the *method*.

  **Methodology and Work Plan**
  The project proceeds in three phases over twelve months, moving from exegesis to taxonomy to normative reconstruction.

  *Months 1–3: Exegesis and Taxonomy*
  I will complete a close reading of Arendt's relevant texts to isolate the precise role of the witness in her account of factual truth. Simultaneously, I will formalize the four-part taxonomy of witness-structures. The output will be a draft chapter defining the "witness-structure problem" and demonstrating why the eyewitness model fails to capture modern statistical or modeled facts. I will address the regress worry here: if defending a derived fact requires unwitnessed facts about the measurement, does the problem simply move back a step? I aim to show that procedural traceability halts this regress where attestation cannot.

  *Months 4–6: Case Studies in Fragility*
  I will apply the taxonomy to three contemporary sites of political contestation: economic statistics (aggregation), climate projections (modeling), and election auditing (archival vs. aggregated). The goal is not merely to list examples but to show how political lying operates differently in each. In the economic case, for instance, lying takes the form of redefining the measurement basket; in the climate case, it takes the form of attacking the model parameters. This chapter will demonstrate that the "lie" targets the procedure, not the event.

  *Months 7–9: Normative Reconstruction*
  This phase develops the positive account. If publicity is insufficient for non-witnessed facts, what institutional form does "followable procedure" take? I will analyze existing mechanisms—audit cultures, open-source methodology, peer review—as proto-political institutions. I will argue that these must be reimagined not as quality control for experts, but as public goods that sustain the common world. This chapter constitutes the core amendment to Arendt's framework.

  *Months 10–12: Synthesis and Writing*
  The final phase integrates the arguments into a cohesive dissertation draft. I will refine the distinction between social epistemological trust and Arendtian world-building to ensure the contribution remains political rather than purely epistemic. The final month is reserved for revision and preparing a journal article derived from the taxonomy chapter.

  **Deliverables and Criteria for Success**
  By the end of the fellowship year, I will have completed three dissertation chapters (approximately 25,000 words) and one submit-ready journal article. Success is defined by the ability to demonstrate that the "witness-structure" is a necessary conceptual tool for understanding modern political lying. Specifically, the project succeeds if it shows that defending a modeled fact requires different institutional norms than defending a witnessed fact, and that failing to recognize this difference leads to category errors in defending truth.

  **Risk Assessment**
  There are two primary risks to this project. First, the taxonomy of witness-structures could degenerate into a descriptive list of examples without generating normative force. To mitigate this, I will anchor each category to a specific failure mode of truth-telling. If a category does not reveal a distinct vulnerability or require a distinct remedy, it will be collapsed or discarded.

  Second, there is a risk of scope creep. The question of procedural traceability touches on broad issues in the philosophy of science and bureaucratic legitimacy, which could easily expand into a book-length project. To remain within the dissertation scope, I will restrict the normative analysis to the *political* function of these procedures. I will not attempt to solve the philosophical problem of induction or the technical details of modeling, but only address how these procedures function as substitutes for witnessing in the public realm. If the regress worry regarding measurement facts proves insurmountable, the project will pivot to a negative conclusion: that modern factual truth is inherently more fragile than Arendt supposed, requiring a revision of her optimism regarding institutional remedies. Even this negative result constitutes a viable contribution.

  **Why This Is Not Social Epistemology**
  Finally, it is crucial to distinguish this project from standard social epistemology regarding trust in experts. Social epistemology typically asks: "Under what conditions is a subject justified in believing a testimony?" This project asks: "Under what conditions does a claim function as a fact that sustains a shared world?" The Arendtian framing contributes the insight that facts are not just objects of belief but the ground of political action. When a procedure is discredited, we do not merely lose knowledge; we lose the capacity to act in concert regarding the issue. By focusing on the *world-building* role of procedure rather than the *justification* of belief, this project retains the distinctively political stakes of Arendt's original inquiry while updating its epistemic assumptions.
