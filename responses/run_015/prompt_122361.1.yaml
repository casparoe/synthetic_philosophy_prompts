      *   *Check (2).* Eternal inflation often *predicts* observable signatures (CMB cold spots, etc.). If the user says MV is *defined* as causally disconnected, they are using a specific definition. I should point out that some MV models *are* testable. The user's view relies on the "causally disconnected" clause.
