prompt: |-
  I keep going back to Mary the color scientist, and I think the argument gets way more confusing once you separate "Mary learns a new fact" from "Mary learns a new way to think about an old fact." Can you explain, in a pretty careful way, what exactly is at stake between the new-fact reading and the new-mode-of-presentation / phenomenal-concept reading? In particular, I want to understand how the ability hypothesis can make room for the intuition that Mary learns something when she sees red for the first time, while still letting physicalism stay true.

  Does the ability hypothesis just say she gains a new ability to recognize, imagine, or use the concept red, and if so, why doesn't that simply mean she didn't learn a proposition at all? I'd also like to know what the weakest version of physicalism the argument is actually supposed to threaten, since I feel like people argue past each other depending on whether they mean "all facts are physical facts," "all facts are knowable from inside a dark room," or something like that.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Deconstruct the User's Request:**

      *   **Core Topic:** Frank Jackson's Knowledge Argument (Mary the Color Scientist).
      *   **Specific Focus:** The distinction between "learning a new fact" vs. "learning a new way of thinking about an old fact" (New Fact vs. New Mode of Presentation/Phenomenal Concept).
      *   **Specific Mechanism:** The Ability Hypothesis (Lewis/Nemirow).
      *   **Key Question 1:** How does the Ability Hypothesis accommodate the intuition that Mary learns *something* without violating physicalism?
      *   **Key Question 2:** Does the Ability Hypothesis imply she learns *no proposition*? If so, why does that matter?
      *   **Key Question 3:** What is the *weakest version of physicalism* actually threatened by the argument? (Ontological vs. Epistemic vs. Semantic).
      *   **Tone:** Careful, precise, philosophical but accessible.

  2.  **Initial Brainstorming & Structuring:**

      *   *Introduction:* Briefly set up Mary's room and the core intuition (she knows all physical facts, leaves room, learns something new).
      *   *The Core Conflict:* Physicalism says everything is physical. If she knows all physical facts, she knows everything. But she learns something. Contradiction?
      *   *The "New Fact" Reading:* This is the anti-physicalist reading. She learns a *propositional truth* that wasn't in her physical database. This threatens ontological physicalism.
      *   *The "New Mode/Concept" Reading:* This is the physicalist defense. She knows the *same reality* but under a different *guise*.
      *   *The Ability Hypothesis:* David Lewis's specific take. It's not even a new concept/proposition; it's *know-how* vs. *know-that*.
      *   *Addressing the "No Proposition" worry:* Why distinguishing know-how from know-that saves physicalism.
      *   *The "Weakest Physicalism" Question:* This is crucial. Distinguish between Ontological Physicalism (what exists) and Epistemic Physicalism (what can be deduced). The Knowledge Argument targets the link between the two.
      *   *Conclusion:* Summarize the stakes.

  3.  **Drafting - Section by Section:**

      *   **Setting the Stage:** Keep it brief. Mary knows all physical facts about color vision. Never seen red. Sees red. Says "Wow."
      *   **The Two Readings (Fact vs. Mode):**
          *   *New Fact:* There is a truth $P$ (about what red looks like) that is not entailed by physical truths. Therefore, non-physical truths exist. (Dualism/Property Dualism).
          *   *New Mode/Concept:* The truth is physical, but the *access* is different. Analogy: Knowing Hesperus is Phosphorus. Same planet, two names. Here: Neural state $N$ = Experience $E$. Mary knew $N$, now knows $E$ *as* $E$.
      *   **The Ability Hypothesis (Lewis):**
          *   This is stronger than just "new concept." Lewis says "Knowing what it's like" isn't propositional knowledge (*knowing-that*). It's *knowing-how*.
          *   *Abilities:* Recognize, imagine, remember.
          *   *Why this saves physicalism:* Physicalism claims all *facts* are physical. If what Mary gains isn't a *fact* (proposition), physicalism isn't violated. She gains a skill, not a truth.
          *   *Addressing the User's specific worry:* "Why doesn't that simply mean she didn't learn a proposition at all?" -> *Exactly.* That's the point. The intuition that she "learns something" is compatible with learning a *skill*. The anti-physicalist insists she learns a *truth*.
      *   **The Weakest Physicalism Threatened:**
          *   This requires careful distinction.
          *   *Ontological Physicalism:* Everything that exists is physical.
          *   *Truth Supervenience:* All truths supervene on physical truths.
          *   *Epistemic/A Priori Physicalism:* All truths are *deducible* from physical truths.
          *   *The Crux:* The Knowledge Argument doesn't necessarily kill Ontological Physicalism directly; it kills *A Priori Physicalism* (or Derivability). It suggests an *explanatory gap*.
          *   *Refinement:* Most physicalists want to say "Once you fix the physical, you fix the mental." Mary shows you can fix the physical knowledge without fixing the mental *knowledge*. So the threat is to the idea that physical knowledge *exhausts* knowledge simpliciter.
