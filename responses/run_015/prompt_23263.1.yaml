answer: |-
  This is one of the sharpest ways to cut into the Knowledge Argument. You have identified the exact pivot point where the debate turns: **Is "knowing what it is like" a form of *propositional knowledge* (knowing-that) or *non-propositional knowledge* (knowing-how)?**

  Here is a careful breakdown of what is at stake between the "New Fact" reading and the "Ability/Mode" reading, how the Ability Hypothesis functions, and exactly which version of physicalism is on the chopping block.

  ---

  ### 1. The Core Conflict: New Fact vs. New Mode

  To understand the stakes, we must define what Mary has in the room and what she gets outside.

  *   **In the room:** Mary has complete physical information ($P$). She knows the wavelength of red, the neurochemistry of the visual cortex, the functional role of color processing, etc.
  *   **Outside the room:** Mary sees red. She says, "So *that* is what it is like to see red."

  **The "New Fact" Reading (Anti-Physicalist)**
  This reading insists that "knowing what it is like" is **propositional**. It is a truth-apt claim about the world.
  *   *The Argument:* If Mary knows all physical facts ($P$), and she learns something new ($Q$) upon leaving, then $Q$ cannot be a physical fact. If $Q$ were entailed by $P$, she would have already known it.
  *   *The Stakes:* This threatens **Ontological Physicalism**. It suggests there are facts about the world (phenomenal facts) that are not physical facts. Therefore, the world contains more than just physical properties.

  **The "New Mode / Phenomenal Concept" Reading (Physicalist)**
  This reading insists that "knowing what it is like" is **representational**. It is about how a fact is grasped, not the fact itself.
  *   *The Argument:* Mary already knew the fact *that red experience is neural state N*. But she knew it under a "neuroscientific concept." Upon leaving, she acquires a "phenomenal concept" of the same state.
  *   *Analogy:* You know "Hesperus is the Evening Star." You learn "Phosphorus is the Morning Star." You learn a new *way of thinking* about Venus, but you do not learn a new *planet*.
  *   *The Stakes:* This saves Ontological Physicalism (there is only Venus/Neural State N) but admits an **Epistemic Gap**. It concedes that physical concepts do not automatically grant access to phenomenal concepts.

  ---

  ### 2. The Ability Hypothesis: Knowing-How vs. Knowing-That

  The Ability Hypothesis (championed by David Lewis and Laurence Nemirow) is a specific, aggressive version of the "New Mode" reading. It goes further than the Phenomenal Concept Strategy.

  **The Claim:**
  When Mary leaves the room, she does not learn a new *truth* (proposition). She acquires new **abilities**.
  Specifically, she gains the ability to:
  1.  **Recognize** the experience of red when it happens.
  2.  **Imagine** the experience of red when it is not happening.
  3.  **Remember** the experience of red after it has passed.

  **Addressing Your Specific Question:**
  > *Does the ability hypothesis just say she gains a new ability... and if so, why doesn't that simply mean she didn't learn a proposition at all?*

  **Yes, exactly.** That is the entire mechanism of the defense.

  The Ability Hypothesis argues that our language tricks us. When we say Mary "learns what it is like," we use the verb "learn," which usually implies acquiring information (a proposition). Lewis argues this is a grammatical illusion.
  *   If I learn to ride a bike, I have "learned something," but I haven't learned a *fact* that I can write down in a textbook. I have learned a *skill*.
  *   Lewis claims "knowing what it is like to see red" is identical to "knowing how to imagine/recognize seeing red."

  **How this saves Physicalism:**
  Physicalism is the thesis that **all facts are physical facts**.
  *   If Mary gains a new *fact*, Physicalism is false (because she already knew all physical facts).
  *   If Mary gains a new *ability*, Physicalism remains true. Abilities are not facts. They are relations between an agent and a state of affairs. You can know all the *facts* about swimming (hydrodynamics, buoyancy) without having the *ability* to swim. Gaining the ability to swim doesn't prove the existence of non-physical water; it just proves you weren't in the water before.

  **Why the Intuition Persists:**
  You asked how this makes room for the intuition that she learns *something*.
  The Ability Hypothesis agrees she learns *something*! It just denies that the "something" is a *truth*. The intuition that "something new happened" is correct; the inference that "therefore, a new truth exists" is the error. The physicalist says: "You are conflating **informational expansion** (new facts) with **capacitary expansion** (new skills)."

  ---

  ### 3. The Weakest Version of Physicalism Threatened

  This is the most critical philosophical distinction. People argue past each other because they define "Physicalism" differently. The Knowledge Argument does not threaten all versions equally.

  **Version A: Ontological Physicalism (The "No Ghosts" Claim)**
  *   *Definition:* Everything that *exists* is physical. There are no souls or non-physical substances.
  *   *Threat Level:* **Low.** The Ability Hypothesis and Phenomenal Concept Strategy both preserve this. They can say, "The experience of red is just a brain state. No ghosts involved."

  **Version B: Truth Supervenience (The "No Extra Truths" Claim)**
  *   *Definition:* Once all physical facts are fixed, all other facts are automatically fixed. There are no "extra" non-physical facts.
  *   *Threat Level:* **Medium.** If the "New Fact" reading is true, this is false. If the Ability Hypothesis is true, this is preserved (because abilities aren't truths).

  **Version C: A Priori Entailment (The "Derivability" Claim)**
  *   *Definition:* If you know all the physical facts, you can *deduce* (figure out) all the other facts from your armchair.
  *   *Threat Level:* **High.** This is the **weakest link** and the actual target of Jackson's argument.

  **Why Version C is the Battlefield:**
  Even if Mary only gains an *ability* (Lewis) or a *new concept* (Phenomenal Concept Strategy), she still could not have *deduced* the experience from the physics while in the room.
  *   If Physicalism requires that physical knowledge *exhausts* all knowledge (including know-how), Mary threatens it.
  *   Most modern physicalists accept that Mary cannot deduce the experience. They argue that **A Priori Entailment is too strong a requirement for Physicalism.**

  **The Precise Stakes:**
  The argument forces physicalists to choose between two unappealing options:
  1.  **Deny the Intuition:** Argue Mary actually *could* deduce what red looks like from physics (Illusionism / Dennett). This is very hard to swallow.
  2.  **Redefine Physicalism:** Admit Mary learns something new (ability or concept), but argue that Physicalism only requires that the *world* is physical, not that the *world is fully intelligible* from physical premises alone.

  So, the weakest version of physicalism threatened is **Epistemic Physicalism** (the idea that physical knowledge is sufficient for total knowledge). The Knowledge Argument successfully severs the link between *Ontological Physicalism* (what exists) and *Epistemic Physicalism* (what we can know).

  ### Summary of the Distinction

  | Feature | **New Fact Reading** (Jackson) | **Ability/Mode Reading** (Lewis/Physicalists) |
  | :--- | :--- | :--- |
  | **What Mary gains** | A new **Proposition** (Truth) | A new **Ability** or **Concept** |
  | **Status of "What it's like"** | A non-physical property of the world | A way of accessing a physical property |
  | **Threat to Physicalism** | **Fatal.** Proves non-physical facts exist. | **None.** Abilities/Concepts aren't ontological commitments. |
  | **Why it feels like learning** | Because she *did* learn a truth. | Because gaining skills *feels* like gaining info. |
  | **Physicalism Definition** | "All truths are physical truths." | "All *things* are physical things." |

  ### Conclusion

  The Ability Hypothesis works by changing the category of what Mary gains. It says: **"You are right, Mary gains something. You are wrong that it is a fact."**

  If you accept that distinction, physicalism survives because physicalism is a claim about *facts* and *ontology*, not a claim about *skills*. However, this forces physicalists to concede that knowing the complete physical story of the universe does not grant you the ability to simulate every conscious experience within it. The "explanatory gap" remains, but it is framed as a gap in *human capacity*, not a gap in *reality*.
