answer: |-
  This is an exceptionally sharp diagnostic observation. You have identified the central dialectical tension in contemporary non-reductive physicalism (NRP), specifically in how it attempts to navigate Jaegwon Kim's Causal Exclusion Argument.

  To answer your primary question directly: **There is no single, canonical proper noun** (like "The Gettier Problem" or "The Twin Earth Argument") that names this specific *dialectical oscillation* itself. However, the *positions* between which the philosopher is sliding have well-established names, and the *outcome* of the slide is discussed under specific labels.

  For your dissertation, you are justified in coining a precise term to capture this failure mode, as it describes a *movement* through logical space rather than a static position. Below, I map your observation onto the existing taxonomy, propose a precise label for your use, and define the boundary conditions you requested.

  ### 1. Mapping the Oscillation to Existing Literature

  The pattern you describe is the standard survival strategy of **Non-Reductive Physicalism** under pressure from the **Causal Exclusion Argument**. Here is how your three "slides" map onto the literature:

  *   **The "Architect/Program" Claim:** This is **Program Explanation** (Jackson & Pettit, 1990) or **Difference-Making Causation** (List & Menzies, 2009). The claim is that mental properties are *causally relevant* because they ensure the physical base occurs, even if they don't *produce* the effect via energy transfer.
  *   **The "Cause of the Cause" Retreat:** This is **Downward Causation**. When pressed, the defender implies the mental state selects the neural state. This is dangerous for physicalists because it threatens the **Causal Closure of the Physical** (if the mental causes the neural, and the neural causes the motion, the mental is a distinct link in the chain, implying dualism or overdetermination).
  *   **The "One Reality" Retreat:** This is the **Determinable/Determinate** strategy (Yablo, 1992) or **Realization Physicalism** (Gillett, 2002). The claim is that mental and physical properties are not competitors; one realizes the other. This avoids exclusion but risks making the mental property **causally inert** (if the determinate physical property does all the work, what does the determinable mental property *add*?).
  *   **The "Indispensable Explanation" Return:** This is **Explanatory Autonomy** (Fodor, 1974). The defender retreats from *ontological* causation to *explanatory* utility, hoping to smuggle causation back in via the backdoor of pragmatism.

  ### 2. Proposed Terminology: "The Explanatory-Ontological Slide"

  Since no single term captures the *instability* itself, I recommend labeling this **"The Explanatory-Ontological Slide"** (or alternatively, **"The Causal Relevance Equivocation"**).

  This term is superior to "Motte-and-Bailey" for your purposes because a Motte-and-Bailey implies a rhetorical strategy of bad faith (defending a weak position to claim a strong one). The pattern you observe is often a genuine conceptual confusion regarding the relationship between *levels of description* and *levels of reality*.

  **Definition for your dissertation:**
  > **The Explanatory-Ontological Slide:** A dialectical maneuver in the philosophy of mind wherein a defender of mental causation, when confronted with the Causal Exclusion Argument, oscillates between three incompatible claims: (1) that mental properties are distinct causal agents (ontological distinctness), (2) that mental properties are physically realized and thus not distinct competitors (ontological identity/realization), and (3) that mental properties are indispensable for explanation (explanatory relevance). The instability arises because (1) triggers exclusion, (2) triggers epiphenomenalism, and (3) does not entail (1).

  ### 3. Distinguishing from Motte-and-Bailey

  You asked to distinguish this from a standard Motte-and-Bailey. Here is the boundary condition:

  *   **Motte-and-Bailey:** The defender *knows* the strong claim (Bailey) is indefensible. When attacked, they retreat to the weak claim (Motte) which is defensible but doesn't get them what they want. When the attack stops, they claim the Bailey again.
      *   *Example:* "Mental states literally push neurons" (Bailey) $\rightarrow$ "Mental states explain neurons" (Motte).
  *   **The Explanatory-Ontological Slide:** The defender often *believes* the three positions are compatible. They do not see the retreat as a concession but as a clarification. The failure is not necessarily rhetorical dishonesty but a **category mistake** regarding the transitivity of causation across levels.
      *   *Diagnostic Marker:* If the philosopher admits the tension but claims it is a "feature, not a bug" of multi-level causation, it is the **Slide**. If they deny the tension exists until pressed, then concede it, then ignore the concession, it is a **Motte-and-Bailey**.

  ### 4. Boundary Conditions: When is "Structuring" Causal?

  For your seminar, you need clear criteria to determine when the "Architect" metaphor holds water and when it is merely descriptive. You can propose the following **Causal Boundary Conditions**:

  **A. Genuine Structural Causation (The "Architect" is Real)**
  *   **Condition:** Counterfactual Independence.
  *   **Test:** If the mental state had not occurred, would the physical effect still have occurred *via the same physical mechanism*?
  *   **Requirement:** The mental property must make a difference to the outcome *over and above* the physical base. (This is very hard to satisfy without violating physical closure).
  *   **Verdict:** Usually fails in standard physicalism.

  **B. Mere Redescription (The "Architect" is a Ghost)**
  *   **Condition:** Supervenience without Counterfactual Leverage.
  *   **Test:** Does the mental description track the physical description perfectly? If so, does the mental description add any *new* counterfactuals?
  *   **Requirement:** If the mental state is fully determined by the neural state, and the neural state is sufficient for the motion, the mental state adds no *causal* power, only *informational* structure.
  *   **Verdict:** This is **Quausation** (Horgan, 1989). It looks like causation but lacks ontological traction.

  **C. The "Slide" Failure Mode**
  *   **Condition:** Equivocation on "Cause."
  *   **Test:** Does the philosopher use "cause" to mean *physical production* when defending efficacy, but *explanatory relevance* when defending against exclusion?
  *   **Verdict:** This is the **Explanatory-Ontological Slide**.

  ### 5. Key References for Your Chapter

  To ground this in the literature, you should engage with these specific critiques which map onto your observation:

  1.  **Terence Horgan, "Quausation" (1989):** Horgan explicitly argues that non-reductive physicalists end up with "quausation"—a relation that looks like causation but is actually just explanatory relevance. This is the "redundant/descriptive" endpoint of your slide.
  2.  **Jaegwon Kim, "The Myth of Non-Reductive Physicalism" (1989):** Kim argues that NRP inevitably leads to "causal drainage," where causal power drains down to the physical base, leaving the mental empty. This describes the *consequence* of the slide.
  3.  **Frank Jackson & Philip Pettit, "Program Explanation" (1990):** This is the primary source of the "Architect" metaphor. They argue program explanations *are* a form of causal explanation. Your critique is that this works for *explanation* but fails for *ontology* under exclusion pressure.
  4.  **Stephen Yablo, "Mental Causation" (1992):** Yablo attempts to stop the slide using the Determinable/Determinate distinction. You can argue that even Yablo's view is susceptible to the Slide when pressed on whether the determinable *does* anything.
  5.  **Christian List & Panu Raatikainen, "On the Logical Form of Mental Causation":** Recent work analyzing whether this is a category mistake.

  ### Summary Recommendation for Your Dissertation

  Do not hesitate to coin **"The Explanatory-Ontological Slide."** It is descriptively accurate, philosophically neutral (it doesn't assume bad faith), and precisely captures the instability you have identified.

  You can frame it as follows:
  *"While the positions of Program Explanation and Realization Physicalism are well-documented, the dialectical instability that arises when they are jointly deployed against the Exclusion Argument lacks a specific designation. I term this the **Explanatory-Ontological Slide**: the systematic oscillation between claiming mental properties are ontologically distinct causes (to secure efficacy) and ontologically non-competitive realizations (to secure physicalism), a maneuver that ultimately conflates explanatory relevance with causal production."*

  This will demonstrate to your seminar that you have not only mastered the literature but have identified a structural weakness in the contemporary debate's architecture.
