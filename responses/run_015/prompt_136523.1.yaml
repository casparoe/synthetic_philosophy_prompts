          *   Principle 2: **The Dignity Boundary.** (Do not preserve if it violates privacy, creates active hazard, or commodifies trauma). Supports: Testimonies, Propaganda Shredding.
      *   *Refining the AI Analysis:* The AI is *active*. It's not a static wall. It behaves like the abuser. This leans heavily toward Principle 2.
      *   *Refining the Test Case:* Needs to be about *interactivity* vs. *static preservation*. A "Deepfake Archive" of the survivors.

  9.  **Review against Constraints:**
