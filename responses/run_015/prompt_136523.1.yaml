      *   *Principle B (The "Dignity & Harm Mitigation" Rule):* Do not preserve if it violates privacy, exploits victims, or creates an active hazard (physical or psychological). Completeness of data is secondary to human dignity/safety. (Seen in Survivor Testimonies & Propaganda Shredding).

      *   *Tension:* Principle A says "Keep the history." Principle B says "Protect the people/study from the history."

