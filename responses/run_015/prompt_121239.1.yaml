      *   **Characters:**
          *   Legal Positivist (Hart's tradition): Focus on pedigree, social sources, separation of law and morals.
          *   Natural Law Defender (Fuller's tradition): Focus on internal morality of law, publicity, intelligibility, congruence.
      *   **Key Issues to Address:**
          *   Legal validity vs. pedigree (social sources/technical bodies).
          *   Fuller's internal morality (public intelligibility, congruence).
          *   Whether algorithmic opacity is a moral defect vs. collapsing philosophy into ethics.
          *   Whether source-based accounts can accommodate incomprehensible institutional authority.
      *   **Format:** Exactly five exchanges (Statement + Reply = 1 exchange). No framing narration, no conclusion.
      *   **Tone:** Philosophical, debate-oriented, precise.

  2.  **Drafting - Exchange 1: Validity and Pedigree**
      *   *Positivist (Hart):* Needs to argue that if the statute was enacted by the recognized sovereign following proper procedure, it is law, regardless of the algorithm's opacity.
      *   *Natural Law (Fuller):* Needs to counter that law requires guidance, and opacity prevents guidance.
      *   *Drafting:*
          *   Hart: If the legislature enacted the statute according to our rule of recognition, it is valid law; the algorithm is merely a tool of administration, not a condition of validity.
          *   Fuller: But a rule that hides its criteria behind proprietary code cannot guide conduct, failing the first principle of legality that laws must be made known to those expected to obey them.

  3.  **Drafting - Exchange 2: Intelligibility and Congruence**
      *   *Positivist:* Needs to argue that citizens don't need to understand the *mechanism*, just the *outcome* or the *authority*.
      *   *Natural Law:* Needs to argue about congruence between declared rule and actual action. If the algorithm deviates or is unknowable, congruence fails.
      *   *Drafting:*
          *   Hart: Citizens need not comprehend the technical machinery of enforcement, only the authority behind it; validity stems from social sources, not public comprehension of every administrative cog.
          *   Fuller: Yet when officials act on reasons they cannot disclose, congruence between declared rule and official action vanishes, turning governance into a series of managed surprises rather than a system of rules.

  4.  **Drafting - Exchange 3: Moral Defect vs. Legal Philosophy**
      *   *Positivist:* Accuse Fuller of conflating "bad law" with "no law." Collapsing into applied ethics.
      *   *Natural Law:* Argue that internal morality is constitutive of law, not external ethics.
      *   *Drafting:*
          *   Hart: To deny validity based on opacity is to collapse legal philosophy into applied ethics, confusing whether a rule is law with whether it is a good rule.
          *   Fuller: The internal morality of law is not external ethics but a structural prerequisite; without intelligibility, you have managerial direction, not law, regardless of its pedigree.

  5.  **Drafting - Exchange 4: Technical Bodies as Sources**
      *   *Positivist:* Can technical bodies be part of the "social sources"? If the rule of recognition accepts them, it's fine.
      *   *Natural Law:* Even if accepted, if they operate outside public reason, they undermine the reciprocity of law.
      *   *Drafting:*
