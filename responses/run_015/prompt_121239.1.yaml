answer: |-
  Positivist: If the legislature enacted the statute according to our rule of recognition, it is valid law; the algorithm is merely a tool of administration, not a condition of validity.

  Natural Lawyer: But a rule that hides its criteria behind proprietary code cannot guide conduct, failing the first principle of legality that laws must be made known to those expected to obey them.

  Positivist: Citizens need not comprehend the technical machinery of enforcement, only the authority behind it; validity stems from social sources, not public comprehension of every administrative cog.

  Natural Lawyer: Yet when officials act on reasons they cannot disclose, congruence between declared rule and official action vanishes, turning governance into a series of managed surprises rather than a system of rules.

  Positivist: To deny validity based on opacity is to collapse legal philosophy into applied ethics, confusing whether a rule is law with whether it is a good rule.

  Natural Lawyer: The internal morality of law is not external ethics but a structural prerequisite; without intelligibility, you have managerial direction, not law, regardless of its pedigree.

  Positivist: If our rule of recognition accepts delegated authority to distributed technical bodies, their outputs possess legal pedigree even if their logic remains opaque to the layperson.

  Natural Lawyer: Delegating the core of adjudication to such black boxes severs the reciprocity between government and citizen, rendering the subject unable to appeal to the rule against the ruler.

  Positivist: Institutional authority persists even when citizens cannot comprehend the underlying data, just as we obey tax codes without mastering economics.

  Natural Lawyer: Tax codes are public texts open to scrutiny, whereas opaque algorithms forbid scrutiny, transforming the citizen from a responsible agent into a managed object.
