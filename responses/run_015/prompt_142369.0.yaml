answer: |-
  ### Spec for Atrocity Allocation Scale

  | Requirement | Rationale | Prejudice Alert |
  | :--- | :--- | :--- |
  | **Multidimensional** | Suffering duration and intensity weigh equally with mortality. | Counters **Utilitarian Reductionism** (insisting on a single number). |
  | **Outcome-Inclusive** | Harm from indifference (famine) equals harm from malice (execution). | Counters **Intent Purism** (ignoring negligence). |
  | **Generational Scope** | Enslavement/cultural destruction harms descendants, not just bodies. | Counters **Event-Bound History** (refusing to count downstream effects). |
  | **Standpoint-Specific** | Rankings differ by victim, perpetrator, or observer position. | Counters **False Objectivity** (claiming a "God's eye" view). |
  | **Incomparability Allowed** | Some evils are qualitatively distinct, not quantitatively different. | Counters **Forced Completeness** (demanding a linear list). |

  **Perspective:** The scale cannot return the same answer for victims, perpetrators, and outsiders. A victim-centric scale prioritizes lived suffering; an outsider scale prioritizes geopolitical stability. A single scale claiming to satisfy all is propaganda. For a museum, the **victim's standpoint** must anchor the metric; others are contextual footnotes.

  **Completeness:** Incomparability is a **real result**, not dodging. Forcing a linear rank (A > B) when A and B are distinct types of wrong (e.g., cultural erasure vs. mass execution) is mathematical dishonesty. Acknowledging distinct moral categories preserves truth.

  **Incompatible Pair:** **Completeness** (everything must be ranked) and **Moral Nuance** (qualitative differences). You cannot have a single linear list that respects qualitative distinction. One must be sacrificed; for a history museum, Completeness must go.

  **The Killer Requirement:** **Multidimensionality.** This kills the **Death Toll** heuristic. Body counts work only if all harm reduces to a single unit (corpses). Once you weight suffering, duration, or cultural loss, the single number collapses. This is necessary; death tolls are a prejudice of convenience that erases non-fatal suffering.

  **Prejudice Note:** The requirement to "Insist on a Single Number" is itself a prejudice (Utilitarian). The requirement to "Refuse to Count Anything" is also a prejudice (Deontological avoidance). This spec rejects both.
