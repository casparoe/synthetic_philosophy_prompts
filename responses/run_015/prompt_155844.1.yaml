answer: |-
  # Joint Statement on Coherence and Expected Utility Maximization

  **To the Builder of a Bounded Artificial Agent:**

  You are designing an agent that must act in a large, partially mapped state space over a finite horizon. You want to know if rationality *requires* expected-utility (EU) maximization. We, a Coherence Theorist and a Permissivist, have collaborated to clarify where we agree and where we disagree. Our goal is to make these disputes decidable by inspecting your agent's design rather than appealing to intuition.

  ### 1. Grading the Coherence Thesis

  Before locating our dispute, we grade the full coherence thesis into four component claims. Both sides accept the Conditional Claim. The dispute lies in the Closure, Penalty, and Transfer Claims.

  1.  **Conditional Claim:** *Given* an agent has attitudes representable as probabilities and utilities over a closed prospect space, the agent should maximize expected utility relative to them.
      *   **Status:** Accepted by Both.
  2.  **Closure Claim:** Rationality *requires* an agent to have attitudes (preferences/credences) defined over a prospect space closed under mixing and compounding (satisfying completeness, continuity, etc.).
      *   **Status:** Contested (Coherence Theorist accepts; Permissivist rejects).
  3.  **Penalty Claim:** Violations of the EU axioms are necessarily exploitable (Dutch-book/money-pump) or accuracy-dominated relative to strictly proper scoring rules.
      *   **Status:** Contested (Coherence Theorist accepts; Permissivist rejects scope).
  4.  **Transfer Claim:** Vulnerability to exploitation or accuracy-dominance entails a synchronic verdict of irrationality.
      *   **Status:** Contested (Coherence Theorist accepts; Permissivist rejects).

  ### 2. Agreed Claims

  1.  **Representation Sufficiency:** Any agent satisfying completeness, transitivity, independence, and continuity over a closed set of prospects can be mathematically represented as maximizing expected utility relative to some probability and utility function.
  2.  **Vulnerability Condition:** An agent violating transitivity over a closed set of options is vulnerable to a cycle of trades that leaves them strictly worse off, *provided* transaction costs are negligible and trade opportunities are unlimited.
  3.  **Computational Cost:** Verifying axiom satisfaction across a large, partially mapped state space may exceed the computational bounds of a finite-horizon agent, forcing trade-offs between consistency and deliberation cost.
  4.  **Scoring Rule Dependence:** Accuracy arguments depend on the choice of scoring rule; no scoring rule is uniquely mandated by logic alone without a prior norm linking accuracy to decision value.

  ### 3. Disagreements

  | ID | Kind | Coherence Theorist Formulation | Permissivist Formulation | Crux IDs | Stakes (Rules Out / Survival) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | Substantive | Rationality requires completeness: an agent must have a defined preference or indifference between any two options. | Rationality permits silence: an agent may lack any attitude between options without being defective. | (a) | **CT:** Rules out "I don't know" as a final state. **P:** Rules out "forced preference" as revealing truth. **Survival:** Survives translation. |
  | **D2** | Methodological | Vulnerability to a money pump (even if bounded) reveals a structural defect in agency that counts as irrationality. | Vulnerability reveals only a cost; if the agent avoids loss via bounds or policy, no irrationality exists. | (b) | **CT:** Rules out "lucky survival" as rationality. **P:** Rules out "structural defect" without actual loss. **Survival:** Dissolves if "rational" redefined as "successful". |
  | **D3** | Substantive | Strictly proper scoring rules are mandatory for measuring accuracy; additive measures are required for coherence. | Accuracy must be stakes-weighted; additive measures are optional and may mislead in bounded contexts. | (c) | **CT:** Rules out non-additive credences as inaccurate. **P:** Rules out universal accuracy norms. **Survival:** Survives translation. |

  ### 4. Cruxes

  #### Crux (a): The No-Attitude Case
  *   **Question:** An agent has sharp, transitive, continuous preferences over simple monetary lotteries but denies any attitude toward the corresponding two-stage gamble (silence, not indifference). Is she incoherent or merely incomplete?
  *   **Bearing Test:** A forced-choice protocol where the agent must pick between the two-stage gamble and a sure thing, recorded alongside internal state logs regarding preference construction.
  *   **Coherence Theorist Prediction:** The forced choice will reveal hidden indifference or inconsistency in the simple lottery preferences when compounded.
  *   **Permissivist Prediction:** The forced choice will reveal a context-dependent construction of preference that does not map back to a stable EU function.
  *   **What Would Move Coherence Theorist:** If the agent maintains silence without exhibiting inconsistency in forced choices across varied contexts.
  *   **What Would Move Permissivist:** If the forced choice reveals a stable underlying order that matches EU maximization despite reported silence.

  #### Crux (b): The Bounded Pump
  *   **Question:** A cyclic agent is offered a finite money pump whose per-step gain is smaller than the per-step transaction cost. Does exploitability that is bounded and unprofitable to the exploiter still ground a verdict of irrationality?
  *   **Bearing Test:** An agent is shown the pump structure in advance and declines to revise its cyclic preferences, relying on transaction costs to prevent loss.
  *   **Coherence Theorist Prediction:** The agent retains an irrational structure; luck (transaction costs) saved them, not rationality.
  *   **Permissivist Prediction:** The agent demonstrates rational adaptation to environmental constraints (transaction costs).
  *   **What Would Move Coherence Theorist:** If the agent cannot explain the refusal via a stable policy and merely relies on external constraints accidentally.
  *   **What Would Move Permissivist:** If the agent loses money despite the policy due to rigid EU adherence in a high-cost environment.

  #### Crux (c): The Scoring-Rule Crux
  *   **Question:** An agent with non-additive credences rejects the strictly proper scoring rule and proposes a stakes-weighted measure (accuracy counted only across distinctions mattering for available decisions). Can a dominance argument be run on the skeptical measure?
  *   **Bearing Test:** A dominance argument comparing additive vs. stakes-weighted scoring rules across a set of decision problems relevant to the agent's horizon.
  *   **Coherence Theorist Prediction:** Dominance still holds for additive rules; stakes-weighted rules fail to penalize obvious inaccuracies.
  *   **Permissivist Prediction:** Dominance fails or supports non-EU norms under the stakes-weighted measure.
  *   **What Would Move Coherence Theorist:** If the stakes-weighted rule avoids dominance for non-EU agents while still penalizing clear errors.
  *   **What Would Move Permissivist:** If the additive rule dominates regardless of stakes, proving non-additivity is always costly.

  ### 5. The Verbal Component

  Is any part of this dispute merely about the word "rational"? Yes, specifically regarding the Transfer Claim. The Coherence Theorist uses "rational" to denote internal consistency of the agent's system, independent of outcomes. The Permissivist uses "rational" to denote effective agency within constraints. If the Coherence Theorist adopted the Permissivist's usage, they would lose the ability to criticize agents that succeed despite inconsistency. If the Permissivist adopted the Coherence Theorist's usage, they would lose the ability to defend agents that fail due to strict adherence to consistency norms in costly environments. However, the Closure Claim (whether silence is permitted) remains substantive regardless of terminology, as it concerns the required architecture of the agent's preference storage.

  ### 6. Bottom Line for the Bounded Agent Builder

  For your computationally bounded agent, EU maximization is a safe default for ensuring internal consistency, but strict adherence may be computationally prohibitive or unnecessary if environmental bounds (like transaction costs) prevent exploitation. You are not required to enforce completeness over unmapped states, but you should expect trade-offs between consistency checks and deliberation costs.

