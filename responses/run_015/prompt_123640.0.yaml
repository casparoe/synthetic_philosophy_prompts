      *   **Key Argument:** The "Ghost in the Machine" is a category mistake. Mental states aren't hidden inner events causing behavior; they are dispositions to behave in certain ways. To talk about the mind is to talk about patterns of public behavior.
      *   **Belief:** For Ryle, believing isn't having a private mental movie; it's being disposed to act/speak in certain ways under certain conditions.
