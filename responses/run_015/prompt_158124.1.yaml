answer: |-
  **The Architecture of Indexical Reasoning: A Specification for Self-Locating Belief**

  The problem of self-locating belief is frequently trivialised as a parlour game centred on Sleeping Beauty. This is a category error. The mechanics of how an agent assigns credence to propositions about *who* they are and *where* they are in time and space underpin decision theory in cosmology, the interpretation of quantum mechanics, and the ethics of artificial consciousness. If we are to construct a theory adequate for the physical world as we currently understand it, we cannot rely on intuitions tuned for single-world, single-agent scenarios. We require a formal specification—a set of desiderata—that any viable theory of self-locating belief must satisfy.

  What follows is that specification. It distinguishes between non-negotiable constraints required for rational coherence and physical adequacy, and those that are merely theoretical prejudices. It concludes by testing existing frameworks against these criteria to determine if the current architectural toolkit is sufficient.

  ### I. The Basic Specification

  Any theory of self-locating belief must first survive contact with standard epistemology. There are three baseline requirements.

  **1. Empirical Coherence with Observed Frequencies**
  *   **Requirement:** In the long run, the credences assigned by the theory must align with observed relative frequencies in repeatable experiments. If a theory dictates a credence of 1/3 for an event that occurs with a frequency of 1/2 over repeated trials, the theory is pragmatically bankrupt.
  *   **Status:** *Non-negotiable.* A theory of belief that systematically leads to losing bets against the world is not a theory of rationality; it is a pathology.
  *   **Rationale:** Belief guides action. If the guidance is systematically misaligned with statistical reality, the agent is unfit for survival.

  **2. Respect for the Principal Principle**
  *   **Requirement:** If an agent knows the objective chance of an event is *x*, and possesses no inadmissible information, their credence in that event must be *x*. This must hold even when the event involves self-location (e.g., 'I will observe spin-up').
  *   **Status:** *Non-negotiable.*
  *   **Rationale:** This is the bridge between metaphysics (chance) and epistemology (credence). Severing this link renders the concept of objective chance useless for reasoning agents.

  **3. Centred/Uncentred Harmony (No Double-Counting)**
  *   **Requirement:** Learning a centred fact (e.g., 'It is Monday for me') should not shift credence in an uncentred fact (e.g., 'The coin is Heads') in a way that violates the logical entailments between them. One cannot update on the same information twice by treating the indexical component as independent evidence when it is not.
  *   **Status:** *Non-negotiable.*
  *   **Rationale:** Violating this leads to Dutch Books. If the relation between the centred and uncentred proposition is fixed by the scenario, updating on one while ignoring the logical constraint of the other is a failure of probabilistic coherence.

  ### II. The Deep Specification: Hidden Structures and Ontology

  The basic spec handles toy puzzles. It fails when the structure of reality itself becomes indexical or branching. A robust theory must handle the following.

  **4. Sensitivity to Hidden Branching Weights**
  *   **Requirement:** In scenarios involving quantum branching (Everettian mechanics) or stochastic duplication where the number of branches is ill-defined but weights (amplitudes) are defined, the theory must assign credences proportional to the weights, not the count of centres.
  *   **Status:** *Non-negotiable.*
  *   **Rationale:** In quantum mechanics, 'branch count' is not a well-defined physical quantity; the measure (squared amplitude) is. A theory that relies on counting centres (Indifference) over branches will violate the Born Rule. If a theory of self-location cannot accommodate the physics of the actual world, it is merely a logic puzzle solver, not a metaphysics of mind.

  **5. Ontological Neutrality (The Simulation Constraint)**
  *   **Requirement:** The theory must not yield different credences solely based on whether the agent is in 'base reality' or a simulation, provided the internal evidence is identical. It must handle nested reference classes without collapsing into scepticism or arbitrary priors.
  *   **Status:** *High Priority (bordering on Non-negotiable).*
  *   **Rationale:** If a theory implies we should be certain we are simulations (or certain we are not) based purely on self-location arguments without empirical data, it is driving metaphysics from the armchair. However, some argue this is a prejudice; a truly adequate theory might *prove* we are likely simulated. I flag this as a tension: the theory must be stable across ontological layers, even if the resulting credence is extreme.

  **6. Dynamic Consistency (The Reflection Principle)**
  *   **Requirement:** An agent's current credence should align with their expected future credence, conditional on receiving only self-locating information. One should not plan to update in a way that one's current self knows will be irrational.
  *   **Status:** *Non-negotiable.*
  *   **Rationale:** Violating reflection makes an agent vulnerable to exploitation across time. It implies the agent knows their future self will be irrational, yet they cannot correct for it now.

  ### III. The Impossibility Result: The Jointly Unsatisfiable Subset

  Here we encounter the hard limit. There is a subset of these desiderata that appears jointly unsatisfiable under standard probability frameworks. This is not a bug in the puzzles; it is a feature of the logic.

  **The Trilemma:**
  1.  **Generalised Conditionalisation:** Updating should proceed by conditioning on new evidence (including centred evidence).
  2.  **The Principle of Indifference:** In the absence of evidence, one should distribute credence equally over indistinguishable self-locating possibilities.
  3.  **Physical Weight Sensitivity:** Credence must track physical measure (e.g., quantum weights), not just the count of possibilities.

  **The Conflict:**
  In quantum branching, if you adhere to *Indifference* (2), you treat every branch as equiprobable. This violates *Physical Weight Sensitivity* (3) because branches have unequal amplitudes. If you try to fix this by weighting the centres, you often violate *Generalised Conditionalisation* (1), because standard conditionalisation does not naturally accommodate shifting weights on centres that are created or destroyed during the branching process.

  Furthermore, in Sleeping Beauty-type cases, satisfying *Empirical Coherence* (often demanding a 'Thirder' result for betting) often conflicts with *Dynamic Consistency* if the updating rule is not carefully constrained. You cannot have a rule that respects the Principal Principle regarding the coin toss, respects Indifference regarding the day, and respects Conditionalisation regarding the awakening, all at once. Something must give.

  **Verdict on the Subset:** This triad is unsatisfiable. A viable theory must reject or modify one. Given that *Physical Weight Sensitivity* is required for compatibility with quantum mechanics, and *Empirical Coherence* is required for pragmatic rationality, the casualty must be **Generalised Conditionalisation** applied naively to centred propositions. We need an updating rule that is not merely conditionalisation on a static sample space, but a migration of measure across a changing topology of centres.

  ### IV. Scoring Existing Frameworks

  We now test the leading candidates against this specification. Note: The prompt references 'Elga's halfer position'. In the literature, Elga (2000) is the architect of the **Thirder** view, while Lewis (2001) defends the **Halfer** view. I will score the positions accurately attributed to their proponents, as scoring a non-existent 'Elga Halfer' view would undermine the seminar's rigour.

  **1. The Lewisian Centred-Worlds Picture (The Halfer Position)**
  *   **Mechanism:** Treats centred worlds as subsets of uncentred worlds. Updates only on uncentred evidence; self-locating information is often treated as 'inadmissible' for shifting uncentred credences.
  *   **Performance:**
      *   *Empirical Coherence:* **Fail.** In repeated Sleeping Beauty trials, the Halfer strategy leads to betting behaviour that loses money against the frequency of awakenings.
      *   *Principal Principle:* **Pass.** Preserves the 1/2 credence in the coin.
      *   *Hidden Branching:* **Fail.** It struggles to incorporate quantum weights without ad hoc additions, as it relies on counting world-stories.
      *   *Dynamic Consistency:* **Pass.** It is very stable dynamically, precisely because it refuses to update on centred evidence.
  *   **Verdict:** It sacrifices empirical coherence to preserve a rigid view of conditionalisation. It is internally consistent but pragmatically deficient.

  **2. The Elgan Thirder Position (Centred Indifference)**
  *   **Mechanism:** Applies the Principle of Indifference over centred possibilities (awakenings). Treats each centre as a distinct locus of credence.
  *   **Performance:**
      *   *Empirical Coherence:* **Pass.** Aligns with betting frequencies in standard puzzles.
      *   *Principal Principle:* **Fail (in branching contexts).** By counting centres equally, it violates the Principal Principle in quantum contexts where branches have unequal weights (the Born Rule problem).
      *   *Centred/Uncentred Harmony:* **Strain.** Requires careful handling to avoid double-counting evidence.
      *   *Dynamic Consistency:* **Fail.** Often violates Reflection; the agent knows their credence will shift upon waking without new uncentred evidence.
  *   **Verdict:** It solves the betting problem but breaks physics. It works for classical duplicates but collapses in Everettian multiverses.

  **3. The Two-Dimensionalist Patch**
  *   **Mechanism:** Distinguishes between the epistemic dimension (what is conceivable) and the metaphysical dimension (what is actual). Attempts to separate the 'context' of utterance from the 'content'.
  *   **Performance:**
      *   *Empirical Coherence:* **Mixed.** Depends on how the dimensions are cashed out for decision theory.
      *   *Hidden Branching:* **Partial.** Can accommodate weights by assigning them to the metaphysical dimension, but struggles to explain why the epistemic agent should care about metaphysical weights over epistemic counts.
      *   *Updating:* **Complex.** The updating rules become opaque, often hiding the problem in the shift between dimensions rather than solving it.
  *   **Verdict:** A formal salvage operation. It describes the problem with high resolution but does not offer a decisive decision-theoretic engine. It is a map, not a vehicle.

  ### V. Final Verdict: The Need for a New Architecture

  Does any existing framework meet the full spec? **No.**

  The Lewisian view is too rigid for empirical adequacy; the Elgan view is too naive for physical adequacy; the Two-Dimensionalist view is too descriptive to be action-guiding. They all share a fatal flaw: they attempt to force self-locating belief into the mould of standard Bayesian conditionalisation over a fixed sample space.

  **The Requirement for a New Architecture:**
  We require a theory of **Measure-Based Self-Location**.
  1.  **Decouple Count from Measure:** The theory must explicitly reject the Principle of Indifference over centres when physical weights are available. 'Number of copies' is not a fundamental quantity; 'Measure of existence' is.
  2.  **Generalised Updating:** We must abandon standard conditionalisation for a rule that allows for 'measure flow'. When a branch splits, credence does not just condition; it flows according to the branching weights. When an agent wakes, they are not learning a proposition that eliminates worlds; they are locating themselves within a measure distribution.
  3.  **Decision-Theoretic Primacy:** The theory should be derived from decision-theoretic axioms (like Deutsch-Wallace) rather than intuition pumps about coins and days. If the betting behaviour is correct, the credence is correct.

  Until we move beyond the 'counting centres' paradigm, we will remain stuck in the trilemma. The seminar should not focus on refining the Halfer/Thirder debate. That debate assumes a classical ontology that the physics has already outgrown. The task is to construct a credence function that operates on a Hilbert space of indexical possibilities, where 'I' am not a point in a set, but a distribution over a measure. Anything less is merely redescribing the puzzle.
