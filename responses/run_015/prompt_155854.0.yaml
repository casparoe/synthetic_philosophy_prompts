      *   **US Model:** 2nd Amendment (individual right, *Heller*, *Bruen*). However, federal law prohibits possession by felons, mentally ill, drug users. This creates a tension: if it's a right, why are there status-based prohibitions without individualised hearings?
      *   **Comparison:** Driving cars (high risk, licensed) vs. Speech (high social risk, unlicensed) vs. Guns (variable risk, variable regulation).
