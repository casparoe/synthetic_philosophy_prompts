      *   *Risk Society/Precautionary Principle:* State's duty is to prevent harm before it happens. Justifies *ex ante* filtering. (Fits UK licensing and US prohibitions, but clashes with US rights rhetoric).
      *   *Civic Republicanism:* Rights are tied to civic virtue/participation. (Could explain why felons lose rights).

  4.  **Synthesize the "Implicit Theory":**
