      *   *Refining the Rationalism point:* Franklin's Deism is key. He prayed for assistance ("Order, Union"), so "neither religious grace" is slightly off. He didn't believe in *saving* grace, but he believed in Providence.
      *   *Refining Humility:* Franklin explicitly says he adopted the *appearance* of humility because it was politically useful. This supports the "tactical rationalism" view over the "theological retreat" view.
