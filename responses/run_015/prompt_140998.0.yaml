      *   **Context:** Real-world conditions (decent palliative care, uneven social support, fallible/overworked doctors, poor/isolated patients, dependency on relatives). *Crucial:* Do not assume ideal institutions.
      *   **Task:**
          1.  List requirements with justifications (cases/considerations).
