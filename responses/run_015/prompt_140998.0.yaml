answer: |-
  Here is a specification of the requirements any adequate legal view on assisted dying must meet, grounded in the non-ideal conditions you described (fallible institutions, uneven support, irreversible outcomes).

  ### 1. The Requirements List

  **Requirement A: The Voluntariness Threshold (Distinguishing Choice from Desperation)**
  *   **Motivating Case:** *The Socially Caused Request.* A competent disabled person requests death because housing and care are underfunded.
  *   **Why it belongs:** In a non-ideal state, "autonomy" is contaminated by structural pressure. A legal rule cannot treat a choice as free simply because the patient is mentally competent; it must assess whether the *options* available were adequate. If the state creates the desperation, authorizing the death implicates the state in a specific kind of harm.
  *   **Status:** **Non-negotiable.** Any legal system must ensure that state-sanctioned death is not a substitute for social welfare. However, the *method* of testing this is negotiable (e.g., waiting periods vs. social work referrals).

  **Requirement B: The Consistency Constraint (No Arbitrary Distinctions)**
  *   **Motivating Case:** *The Cases We Already Permit.* Refusing treatment, withdrawing hydration, terminal sedation.
  *   **Why it belongs:** A legal system loses legitimacy if it prohibits outcome X while permitting outcome Y, where the only difference is a technicality (e.g., who pushes the syringe) that does not track a moral difference. If the law permits letting die, it must explain why making die is categorically different, not just procedurally different.
  *   **Status:** **Non-negotiable.** Legal coherence requires that distinctions in treatment map onto distinctions in moral or public interest.

  **Requirement C: The Error Tolerance Limit (Administrability under Uncertainty)**
  *   **Motivating Case:** *The Administrability Case.* Doctors are overworked and prognoses are uncertain.
  *   **Why it belongs:** Irreversible decisions made by fallible humans will produce errors (people who would have improved, or who were coerced, will die). A view must specify an acceptable error rate and, crucially, *who bears the risk*. Does the system prioritize avoiding false positives (forbidding some who qualify) or false negatives (allowing some who don't)?
  *   **Status:** **Non-negotiable.** A rule that assumes perfect diagnosis or perfect honesty is not a law; it is a fantasy.

  **Requirement D: The Temporal Authority Rule (Who Decides When?)**
  *   **Motivating Case:** *The Deadline Case* and *The Scope (Dementia) Case.*
  *   **Why it belongs:** Interests change over time. A view must decide whether the "self" that matters is the one suffering now, the one who planned for the future, or the one who might adapt later. You cannot satisfy both the person who wants to avoid future dementia and the person currently in dementia who seems content.
  *   **Status:** **Negotiable.** This is a policy choice. A view can prioritize current experience (blocking advance directives for dementia) or prior autonomy (honoring them), but it must explicitly choose one.

  **Requirement E: The Expressive Neutrality Test (Public Meaning)**
  *   **Motivating Case:** *The Expressive Case.*
  *   **Why it belongs:** Laws teach citizens how to value things. If the law makes death easier to access for disabled people than for able-bodied people (due to medical gatekeeping), it expresses that disabled lives are less worth sustaining.
  *   **Status:** **Non-negotiable (in a liberal democracy).** Equal protection requires that the law does not signal that certain classes of citizens are burdens. However, *what counts* as a harmful message is often a **Disguised Prejudice**. (See below).

  ### 2. Classification: Standards vs. Prejudices

  You asked to identify when demands are merely prejudices dressed as standards.

  *   **Non-negotiable:** Requirements A, B, C, and E (as defined above). These are structural necessities for a just legal system in non-ideal conditions.
  *   **Camp Preference:** Requirement D (Temporal Authority). Proponents of autonomy prefer past directives; proponents of welfare prefer current experience. Neither is objectively "correct" without a prior value commitment.
  *   **Disguised Prejudices:**
      *   *"Suffering must be physical."* This is often ableism dressed as objectivity. Psychiatric suffering is real, but excluding it is often a prejudice that mental pain is "less real" or "treatable" in ways physical pain is not.
      *   *"Disability is always a tragedy."* This is the prejudice behind the Expressive Case. Insisting that assisted dying *always* devalues disabled lives assumes disabled lives are inherently tragic, which is itself a discriminatory view.
      *   *"Doctors must be the sole gatekeepers."* This is often professional protectionism dressed as safety. There is no evidence doctors are better at detecting coercion than social workers or judges, but granting them exclusive power protects medical monopoly.

  ### 3. Incompatible Pairs and Trade-offs

  You suspected some requirements cannot be jointly satisfied. You are correct.

  **The Safety vs. Access Trilemma (Requirements A, C, and Autonomy)**
  *   **The Conflict:** You cannot simultaneously maximize protection from coercion (A), minimize error (C), and maximize access for those who genuinely qualify.
  *   **Why:** To ensure a request isn't caused by social neglect (A), you need intensive investigation. Intensive investigation creates barriers, delays, and errors (C), which denies access to competent people in genuine pain. To make access easy, you must accept higher risk of error or coercion.
  *   **The Drop:** If I must drop one, I would drop **strict Error Tolerance (C)** in favor of **Voluntariness (A)**. In a context of uneven social support, the greater moral evil is authorizing death due to poverty/isolation than denying death to someone in pain. The cost is that some competent adults will be forced to suffer longer than they wish.

  **Consistency vs. Administrability (Requirements B and C)**
  *   **The Conflict:** To be consistent with existing permissions (withdrawing treatment), you need nuanced, case-by-case judgment. To be administrable (low error, clear rules), you need bright lines.
  *   **Why:** Bright lines (e.g., "6 months to live") create arbitrary exclusions (violating Consistency). Nuanced standards (e.g., "unbearable suffering") create high error rates and doctor discretion (violating Administrability).
  *   **The Drop:** Most legal systems drop **Consistency (B)**. They accept the "acts vs. omissions" distinction not because it is morally sound, but because it is a bright line that is easier to police than "intent."

  ### 4. The Single Most Exclusionary Requirement

  **Requirement A: The Voluntariness Threshold.**

  This requirement does the most work in ruling out popular positions.
  *   It rules out **Pure Autonomy views:** They cannot explain why we shouldn't assist the disabled young person whose choice is "free" but structurally coerced by underfunding.
  *   It rules out **Pure Sanctity of Life views:** They cannot explain why we permit withdrawal of treatment (which can be coerced) but forbid assisted dying.
  *   It rules out **Pure Relief of Suffering views:** They cannot justify denying relief to someone suffering simply because the suffering is socially caused, unless they acknowledge the state's complicity.

  Any view that does not have a mechanism to distinguish "I want to die" from "I have no other viable option due to state neglect" fails in the real world you described.

  ### 5. Scoring the Four Positions

  *   **Sanctity of Life:** Fails **Consistency**. It permits letting die but forbids making die, relying on a distinction that does not hold up under scrutiny in end-of-life care.
  *   **Pure Autonomy:** Fails **Voluntariness Threshold**. It treats choices as free even when the menu of options was rigged by social neglect.
  *   **Relief of Suffering:** Fails **Error Tolerance**. Suffering is subjective and hard to verify; a system built solely on this invites high rates of diagnostic error and abuse.
  *   **Integrity of Medicine:** Fails **Institutional Feasibility** (a subset of Administrability). It relies on professional norms that are already fractured; making this the sole legal standard creates a postcode lottery based on which doctors work in your area.
