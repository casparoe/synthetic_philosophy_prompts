          6.  **Constraint:** Score the four positions (Sanctity of Life, Autonomy, Relief of Suffering, Integrity of Medicine) against *non-negotiable* requirements in the last few lines only. No sources/citations. No rehashing standard debates.

  2.  **Deconstruct the Context & Constraints:**
