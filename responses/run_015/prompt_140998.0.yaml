      *   *Structure:* Needs to be a meta-ethical/legal specification, not a verdict on the morality of killing itself.
      *   *Tone:* Analytical, precise, helpful to a student trying to upgrade their argument structure.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Protection from Coercion/Undue Influence.* (Based on the "Socially Caused" and "Uneven Support" context).
          *   *Why:* If the state underfunds care, is the choice free?
          *   *Classification:* Non-negotiable for a *legal* rule (state interest in protecting vulnerable), though libertarians might dispute the degree.
      *   *Requirement 2: Consistency with Existing End-of-Life Practices.* (Based on "Cases we already permit").
          *   *Why:* Avoid arbitrary distinctions (acts vs. omissions) that don't track moral reality.
          *   *Classification:* Non-negotiable for legal coherence.
      *   *Requirement 3: Epistemic Humility/Error Management.* (Based on "Administrability" and "Fallible Doctors").
          *   *Why:* Decisions are irreversible. Errors happen. Who bears the risk?
          *   *Classification:* Non-negotiable for public safety.
      *   *Requirement 4: Temporal Stability vs. Current Will.* (Based on "Deadline Case" and "Scope/Dementia").
          *   *Why:* People change minds. Precedent directives conflict with current non-competence.
          *   *Classification:* Negotiable (policy choice), but must be addressed.
      *   *Requirement 5: Expressive Neutrality (or Non-Degradation).* (Based on "Expressive Case").
          *   *Why:* Law signals value of lives.
          *   *Classification:* Often a disguised prejudice ("My group feels unsafe"), but legally relevant for equal protection. Let's call it "Non-Discrimination."
      *   *Requirement 6: Professional Feasibility.* (Based on "Professional Role").
          *   *Why:* Can't mandate what medicine structurally cannot do.
