      *Most Exclusionary Requirement:* The Voluntariness Threshold under non-ideal social conditions. It breaks simple Autonomy models and simple Sanctity models.

  8.  **Final Polish:** Check tone. Ensure it sounds like a specification for a *law*, not just ethics. Ensure the scoring is at the very end and short.

