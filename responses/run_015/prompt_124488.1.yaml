      *   **The Room:** Acknowledge the diversity without exoticizing it. Acknowledge the tension (the family dynamics implicitly, but not explicitly naming them).
      *   **The Work:** Citizenship isn't an end; it's a tool. You can fix things now.
      *   **Closing:** Bring it back to the oath. The promise is mutual.

