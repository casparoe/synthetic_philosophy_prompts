answer: |-
  Fourteen years.

  My wife waited fourteen years for this day. Two lawyers. One interview rescheduled twice because of snow. She is sitting in this room. She knows what this wait feels like.

  Many of you know it too.

  Some of you waited months. Some waited decades. Some of you are here with family who cannot stand up and take this oath. You know what it is to wait. You know what it is to hope.

  Today, the waiting stops.

  People often talk about this day as a welcome. They talk about opening a door. They talk about letting you in.

  I am not going to do that.

  This is not my house. It is not the judge's house. It is not the mayor's house. It belongs to all of us.

  When you were a guest, you had to be polite. You had to follow the rules set by someone else. You had to be grateful for the roof.

  When you are a member, the roof is yours.

  Membership is different than hospitality. A guest says thank you. A member says what needs fixing. A guest hopes to stay. A member decides how the stay should look.

  Today, you stop being guests.

  This means you have work to do.

  You now have a say in how this room is run. You have a say in who gets to come here next. You have a say in how the laws are written. You have a say in how they are enforced.

  Some of you will agree on these things. Some of you will not.

  That is good.

  Disagreement is not a failure. It is a sign that you belong here. Only owners can argue about the furniture. Only owners can argue about the locks.

  Look around this room.

  There are people here who enforce the laws. There are people here who challenge the laws. There are people here who waited in line. There are people here who had no line to wait in.

  You are all in the same row.

  For years, the system decided who you were. It gave you forms. It gave you dates. It gave you status.

  Today, you take that power back.

  You are not just receiving a certificate. You are receiving a tool. You can use it to build. You can use it to argue. You can use it to help the people who are still waiting outside.

  Do not just be grateful. Be useful.

  My wife waited fourteen years. She did not do it just to stand here. She did it to stand up.

  In a few minutes, the judge will ask you to raise your right hand. You will make a promise.

  That promise is not just to obey. It is to participate.

  It means you are part of the noise now. It means you are part of the decision. It means this country is no longer something that happens to you. It is something you make.

  So do not just say yes.

  Say what you need. Say what is wrong. Say what is right.

  The door is not ours anymore. It is yours.

  Thank you.
