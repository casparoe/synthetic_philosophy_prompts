      *   **Context:** Community college auditorium, between high school choir and the oath.
      *   **Constraints:**
          *   4-5 minutes (approx. 500-750 words spoken at a moderate pace).
          *   Short, plain sentences (accessibility for non-native speakers/translation).
          *   No clichés ("nation of immigrants," "melting pot").
          *   No quotes, no philosophers, no lecture.
          *   Avoid making undocumented presence sound like a favor or a crime.
          *   Not a protest speech (respect the wife's achievement).
          *   No mush/sentimentality.
          *   Avoid the word "welcome" unless it earns its keep (shift from "host/guest" to "member/member").
      *   **Core Theme:** The distinction between hospitality (guest) and membership (owner/stakeholder). The speech needs to acknowledge their new power to shape the room/country without invalidating the struggle or creating conflict among the diverse audience (especially the family dynamics).

  2.  **Deconstruct the Core Tension:**
      *   *The Trap:* Most speeches treat new citizens as grateful guests. "We welcome you to *our* house."
      *   *The Goal:* Treat them as members. "This is *your* house now too."
      *   *The Risk:* Acknowledging membership means acknowledging they can disagree with current laws/people (like the Border Patrol brother-in-law or the Judge).
      *   *The Balance:* Honor the wife's 14-year struggle without implying the system is perfect or that those still waiting are lesser. Acknowledge the room's complexity without making it political theater.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the wait. Keep it grounded. No fanfare.
