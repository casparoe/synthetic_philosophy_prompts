      *   *The "Welcome" Constraint:* I need to use it carefully or avoid it. The prompt says "unless you can make it earn its keep." Better to avoid it to be safe, or redefine it. Let's try to avoid it to honor the "host/guest" critique.
      *   *The Family Dynamic:* I cannot mention the MIL's status or the BIL's job explicitly. That would out them. But the speech must be written *knowing* they are there, so the language must not condemn one or idolize the other. It must be neutral ground where both can sit.

