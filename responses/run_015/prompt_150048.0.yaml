answer: |-
  You are describing a version of **Weighted Negative Utilitarianism**, specifically one employing a **convex suffering function**. Your "Max-First Rule" is a heuristic approximation of a power-law weighting where moral badness scales non-linearly with intensity.

  Here is the breakdown of the principle, the repairs, the predictions, and the robustness check, stripped of the adjectives.

  ### 1. The Principle and the Exponent
  Your "Max-First Rule" breaks on the "million warm rooms" case because strict lexicality (infinity weight to higher intensity) is mathematically brittle. A continuous weighting function handles the wobble better without losing the core intuition.

  **The Function:** $Badness = \sum (\text{Duration} \times \text{Intensity}^k)$

  **Pinpointing $k$:**
  *   **Cluster Headache vs. Kidney Stones:** 1 hour at Intensity 10 (CH) outweighs 100 hours at Intensity 1 (KS).
      *   $1 \times 10^k > 100 \times 1^k \rightarrow 10^k > 100 \rightarrow k > 2$.
  *   **Torture vs. Warm Rooms:** 1 hour at Intensity 100 (Torture) vs. 1,000,000 hours at Intensity 1 (Warm). You wobble here, implying they are roughly comparable.
      *   $1 \times 100^k \approx 1,000,000 \times 1^k \rightarrow (10^2)^k \approx 10^6 \rightarrow 2k \approx 6 \rightarrow k \approx 3$.

  **Verdict:** Your intuitions pin the exponent $k$ between **2 and 3**.
  *   **Repair:** Drop the strict "Max-First" switch. Adopt the **Power-Weighted Suffering Principle**. It preserves the "emergency room triage" feel (high intensity dominates) but allows the "million warm rooms" to win if the pile gets big enough, resolving your wobble without a threshold clause.
  *   **Where the Million Warm Rooms Land:** With $k=2.5$, 1 hour of Torture (Intensity 100) $\approx$ 300,000 hours of Warm Rooms. A million hours wins. Your intuition that "the pile has to win" is correct; Max-First was too rigid.

  ### 2. The Verdicts That Must Go (Or Be Reinterpreted)
  You asked which verdicts have to go. You cannot keep them all without inconsistency.

  *   **The Chronic Pain Woman:** This is the critical failure point. Strict Negative Utilitarianism implies that if her life contains net suffering (even if she values the whole), non-existence is preferable.
      *   **The Fix:** You must treat **Preference Frustration** as a form of suffering. If killing her (or wishing her non-existence) causes her the suffering of frustrated desire, that counts in the equation.
      *   **The Cost:** You must accept that her life *contains* a massive moral negative (the pain), even if the *total package* is net-positive due to her preference to live. You cannot say the pain "doesn't matter" because she's happy. The pain is an evil; her will to live is a counter-weight.
      *   **Action:** The imperative is to alleviate the pain, not the person. If the pain is untreatable, the view *does* imply her life is tragically flawed, but not necessarily that she should be ended (due to the trauma of ending it).

  *   **Climber vs. Trial Volunteer:** You say Climber pain counts "in full" but Volunteer pain is "2/3 bad." Both consented. Both have "glory" or meaning.
      *   **The Inconsistency:** If "glory" doesn't subtract (Climber), why does "altruism" subtract (Volunteer)?
      *   **The Principle:** **Other-Regarding Discount.** Suffering endured for the benefit of *others* (Volunteer) is morally discounted. Suffering endured for *self* (Climber) is not.
      *   **Why:** In your lab model, this is like distinguishing between "noise" (self-inflicted) and "signal" (data for others). If you keep the "counts in full" verdict for the climber, you must accept that **self-interested consent does not reduce moral badness**, only **altruistic consent** does.

  ### 3. Predictions on New Cases

  **Case A: Insects and Small Wild Animals**
  *   **Input:** Numbers are astronomical ($10^{18}$+). Predation involves high-intensity suffering (being eaten alive, Intensity $\approx$ Torture).
  *   **Calculation:** High Intensity ($k \approx 2.5$) $\times$ Massive $N$.
  *   **Prediction:** **Wild Animal Suffering is the dominant moral priority.** The sheer volume of high-intensity suffering in nature dwarfs human suffering. If insects feel "unpleasantness" (a biological empirical claim), your model demands intervention in ecosystems to reduce predation/parasitism, regardless of "natural balance."
  *   **Caveat:** If insects lack the neural hardware for "unpleasantness" (vs. mere nociception), they count for zero. Your anesthesia verdict suggests you require conscious unpleasantness. The empirical burden is on the neurology, not the ethics.

  **Case B: Far-Future Catastrophe vs. Certain Modest Relief**
  *   **Input:** Catastrophe = High Intensity (Torture-level) $\times$ Future Generations. Modest Relief = Low Intensity $\times$ Current People.
  *   **Calculation:** Because $k > 1$, High Intensity dominates Low Intensity disproportionately.
  *   **Prediction:** **Prioritize the Catastrophe.** Even a small probability of a "suffering-dense" future (e.g., lock-in of totalitarian torture states) outweighs certain modest relief today. The exponent amplifies the intensity difference enough to overcome the probability discount.

  ### 4. Robustness to Homeostatic Downshift
  *   **The Claim:** Pleasure creates a deficit; net hedonic tone might be zero or negative.
  *   **Robustness:** Your view is **highly robust** to this.
  *   **Reasoning:** Negative Utilitarianism does not rely on pleasure being *positive*. It only relies on suffering being *negative*.
      *   If pleasure nets to zero: Your view stands unchanged.
      *   If pleasure nets to negative (hangover effect): Your view is *strengthened* (creating happy people becomes risky).
      *   **Contrast:** Classical Utilitarianism breaks if pleasure nets to zero (no reason to act). Suffering-Focused Ethics only requires that pain is bad.
      *   **Empirical Note:** Pain pathways often show *sensitization* (kindling), not habituation. Chronic pain gets worse, not better. This asymmetry (pain sensitizes, pleasure habituates) makes your exponent $k$ empirically stable over time.

  ### Summary Label
  You are a **Power-Weighted Negative Utilitarian** with an **Altruistic Consent Discount**.

  **The Parameter Sheet:**
  1.  **Metric:** Conscious Unpleasantness (Stress hormones/anaesthesia = 0).
  2.  **Weighting:** Intensity$^{2.5}$ (Approx).
  3.  **Aggregation:** Permitted, but dominated by intensity.
  4.  **Modifiers:**
      *   Altruistic Consent: $\times 0.66$ weight.
      *   Self-Interested Consent: $\times 1.0$ weight.
      *   Preference Frustration: Counts as suffering (saves the Chronic Pain Woman from the "death imperative," though not from the "tragic life" verdict).

  **Final Advice:** Drop the "Max-First" label. It's a step-function approximation of a power law. The power law fits your data (verdicts) better, specifically resolving the "million warm rooms" wobble without adding ad-hoc thresholds. It treats intensity the way groundwater models treat hydraulic conductivity: a small change in the property creates a massive change in the flow.
