answer: |-
  Your six judgments are remarkably precise, and they map almost perfectly onto the fault lines in contemporary debates between neo-Aristotelian virtue ethics and situationist social psychology. You are effectively describing a position that rejects the **Global Trait Assumption** (traditional virtue ethics) without capitulating to the **Episodic Agent Assumption** (hard situationism).

  There is indeed a coherent principle that can accommodate all six verdicts, though it requires a specific metaphysical commitment regarding the nature of character. I will call this principle **Reflexive Localism**.

  ### The Unified Principle: Reflexive Localism

  **Reflexive Localism** posits that virtues are **domain-relative stabilities** that attain the status of *character traits* (rather than mere habits or behavioral regularities) only when **reflexively endorsed** by the agent as part of their normative identity.

  This principle relies on three criteria:
  1.  **Domain Stability:** Consistency is required only within normatively distinct spheres (professional, physical, epistemic, etc.), not globally.
  2.  **Structural Scaffolding:** Dispositions can be constituted or stabilized by external institutional frames (roles, rules).
  3.  **Narrative Reflexivity:** To count as a *virtue* (rather than a compulsion or accident), the agent must integrate the disposition into their self-conception.

  #### How It Accommodates Your Six Judgments

  1.  **Maria (Professional Honesty):** Satisfies *Domain Stability*. Accounting and socializing are distinct normative domains with different rules of engagement. Her stability in the professional domain suffices for the local virtue of "professional honesty," even if global honesty is absent.
  2.  **David (Physical Courage):** Satisfies *Domain Stability*. Physical danger and organizational risk trigger different psychological mechanisms (adrenergic response vs. social cost-benefit analysis). Fragmentation here is expected, not a failure of the theory.
  3.  **Fairness Monitor (Role Constitution):** Satisfies *Structural Scaffolding*. The role provides the normative frame. By accepting the assignment, the participant temporarily adopts a "local identity" that stabilizes the disposition. The virtue is constituted by the interaction between the agent and the institutional frame.
  4.  **Professor Chen (Epistemic Humility):** Satisfies *Domain Stability* + *Integration Failure*. She possesses the local trait in the epistemic domain. The lack of transfer to administration is a failure of *integration*, not a disproof of the local trait.
  5.  **Leo (Indiscriminate Lying):** Fails *Domain Stability*. His behavior is inconsistent across domains and lacks any normative anchor. He possesses no local stabilities to build upon.
  6.  **The Kindness Pair (Narrative):** Satisfies *Narrative Reflexivity*. This is the crux. Behavioral regularity (60% helping) satisfies the stability condition for both. However, only the first agent satisfies the reflexivity condition. For the second, the behavior is accidental relative to their agency; for the first, it is constitutive. Thus, only the first possesses the *virtue*.

  ### Application: The Virtual Compassion Case

  **The Case:** An individual displays consistent compassion *only* within an immersive virtual environment (caring for digital entities) but shows no comparable behavior in physical-world interactions.

  **Verdict under Reflexive Localism:**
  The verdict depends entirely on the agent's **Narrative Reflexivity** regarding the virtual domain.

  *   **Scenario A (The Digital Moralist):** The individual cares for digital entities because they believe these entities (or the practice of caring for them) holds normative weight. They weave this care into a self-narrative (e.g., "I am a protector of vulnerable beings, even digital ones").
      *   *Judgment:* They possess the virtue of **Virtual Compassion**. It is a fragmented, domain-specific virtue. It is real, but it does not guarantee physical compassion.
  *   **Scenario B (The Gamer):** The individual cares for digital entities consistently, but views the environment as "not real" and the care as merely part of the game mechanics (like moving pieces in chess). They do not endorse this behavior as part of their moral identity.
      *   *Judgment:* They lack the virtue. They possess a **behavioral regularity** or a **ludic habit**, but not a moral trait. This mirrors your "Kindness Pair" intuition: without the narrative endorsement, the behavior is morally inert regarding character.

  **Implication:** This verdict challenges the Aristotelian idea that virtues must track *eudaimonia* (human flourishing) in the real world. It suggests virtues can be hyper-localized to simulated norms, provided the agent takes those norms seriously.

  ### Critical Stress Test: Which Judgment to Drop?

  While Reflexive Localism saves all six judgments, it does so by making "virtue" a somewhat fragmented and internalistic concept. If you find this principle too gerrymandered or theoretically costly, you must drop one judgment.

  **The Weakest Link: Judgment 6 (The Kindness Pair)**

  If you are forced to abandon one intuition to align more closely with either traditional Virtue Ethics or Situationism, you should drop **Judgment 6**.

  **Why Drop It?**
  1.  **Epistemic Opacity:** Judgment 6 makes virtue fundamentally inaccessible. We can observe the 60% helping rate, but we cannot access the internal narrative. If virtue ethics is to guide moral education or social policy, it needs traits that are observable and cultivatable through behavior, not just internal storytelling.
  2.  **Situationist Pressure:** Situationists argue that if the behavioral output is identical across diverse situations, the psychological mechanism is likely the same (e.g., mood, heuristic processing). Distinguishing them based on self-report invites self-deception (the "accidental" helper might rationalize their help as intentional later).
  3.  **Virtue Ethics Cost:** Traditional Aristotelians might also reject #6. For Aristotle, *phronesis* (practical wisdom) manifests in *action*. If two people act identically over time, they have developed the same *hexis* (state of character). The internal narration is secondary to the actualization of the capacity.

  **Implications of Dropping Judgment 6:**
  *   **If you drop #6:** You move closer to a **Behavioral Localism** (akin to John Doris's *Lack of Character*). Virtues are just stable behavioral patterns within domains.
      *   *Result:* The "Virtual Compassion" agent has the virtue simply by acting compassionately in VR, regardless of their internal narrative.
      *   *Theoretical Shift:* This weakens the "moral worth" aspect of virtue ethics but strengthens its empirical tractability. It concedes ground to Situationism by admitting that "character" is just a label for behavioral consistency, not a deep metaphysical cause.
  *   **If you keep #6:** You commit to a **Narrative Constitution** view (akin to Marya Schechtman or David Velleman).
      *   *Result:* You preserve the intuition that *why* we act matters for *who* we are.
      *   *Theoretical Shift:* You distance yourself from empirical psychology (which studies behavior) and move toward hermeneutics or phenomenology. You save Virtue Ethics from Situationism by redefining virtues as internal achievements rather than external predictors.

  ### Recommendation for Your Seminar

  Your intuitions suggest you are naturally drawn to a **Hybrid Constitutivism**. You believe character is real (against hard situationism) but fragmented and context-dependent (against global trait theory).

  **The Coherent Path:**
  Stick with **Reflexive Localism**. It is the only view that honors the nuance in your cases, particularly the distinction between Maria's professional integrity and Leo's chaos, and the distinction between the two kind helpers.

  **The Pivot Point:**
  Use the **Virtual Compassion** case to test your seminar peers.
  *   Ask them: *"If the Virtual Compassion agent saves digital lives consistently but thinks it's 'just a game,' have they cultivated compassion?"*
  *   If they say **Yes**, they reject your Judgment 6 (Narrative).
  *   If they say **No**, they accept Reflexive Localism but must explain why the domain (VR) doesn't count as a "moral" domain.

  This allows you to derive your position dialectically. You need not abandon a judgment yet; your six intuitions form a consistent set under the view that **character is a locally stable, self-authored practice.** This view acknowledges the situationist data (fragmentation, framing) without surrendering the virtue ethical core (agency, narrative, normativity).
