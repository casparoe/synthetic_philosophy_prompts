answer: |-
  ### Mapping Log: Candidates & Rejections

  Before fixing the translation, I evaluated three candidate mappings for **Structure**:
  1.  **Input-Output Function:** Rejected. This corresponds to *empirical adequacy*, not structure. Realism claims the *internal* machinery tracks reality, not just predictions.
  2.  **Weight Values:** Rejected. Weights are non-identifiable due to permutation symmetry and rescaling. Believing in specific weights is like believing in a coordinate system.
  3.  **Representational Geometry (Selected):** The relationships among feature directions in activation space, up to linear/non-linear equivalence. This captures "relations without specific objects."

  For **Theory Change**, I considered **Fine-tuning** but rejected it as too incremental. **Architecture Shift** (e.g., CNN to Transformer) better mirrors paradigm shifts where the ontology (convolutional kernels vs. attention heads) changes but the task success remains.

  **Stipulation:** I must stipulate that "The World" corresponds to the **True Causal Data-Generating Process (DGP)**, not merely the observed data distribution. DL usually ignores the distinction, but realism requires it.

  ### 1. Translation Manual

  | Philosophical Term | Deep Learning Equivalent | Notes |
  | :--- | :--- | :--- |
  | **Theory** | A trained model checkpoint (solution basin). | Represents a stable inquiry outcome. |
  | **Ontology** | Specific neuron activations / basis vectors. | The "objects" posited by the model. |
  | **Structure** | **Representational Geometry** (feature relations up to equivalence). | The invariant relational content. |
  | **Theory Change** | Architecture shift or retraining on expanded support. | Moving between solution basins. |
  | **Empirical Content** | Generalization error on out-of-distribution data. | Predictive success beyond training. |
  | **Structure Preservation** | Representational Similarity (e.g., CKA) across architectures. | Relations retained despite ontology change. |

  **Defense of Structure:** I identify structure with **Representational Geometry** rather than the Input-Output function. If structure were just the function, structural realism would collapse into instrumentalism. We need the claim that the *internal* relations (e.g., orthogonality of concept vectors, causal dependencies in latent space) mirror the world's structure. This survives architecture changes (ontology shifts) where different networks learn equivalent feature geometries.

  **Stipulation Alert:** I am stipulating that "Preservation" means high representational similarity across architectures solving the same task. In science, this is often mathematical derivation; in DL, it is empirical measurement of activation spaces.

  ### 2. Restatements

  **The No-Miracles Argument:** If a model generalizes robustly to out-of-distribution data, this success would be a miracle unless its learned feature geometry actually tracks the causal structure of the true data-generating process.

  **The Pessimistic Meta-Induction:** Past state-of-the-art architectures (e.g., hand-crafted features, shallow nets) achieved high training success but failed to capture the true structure, evidenced by their collapse under distribution shift. Current deep architectures will likely suffer the same fate.

  **Structural Realism (Modest):** We cannot claim the specific neurons (ontology) correspond to real entities, but we are justified in believing the relational geometry among features (structure) approximates the world's causal structure.

  **Structural Realism (Ambitious):** Neurons are nothing over and above nodes in the computation graph; there are no intrinsic "objects" in the network or the world, only relational structures defined by the loss landscape.

  **The Structure-is-Too-Cheap Objection:** Given universal approximation, almost any sufficiently expressive architecture can fit the data. Claiming a model captures "structure" is vacuous unless constrained by inductive biases that rule out spurious correlations.

  ### 3. The Residue Report

  **Correspondence and Limiting Cases:**
  In science, Newtonian mechanics is a limiting case of Relativity. In DL, we lack this rigor. We have **mode connectivity** (different solutions connected by low-loss paths) or **distillation** (smaller models mimicking larger ones), but these are not mathematical limits. A CNN is not a "limit" of a Transformer. This translation distorts the substantive link between theories. The residue indicts the philosophical analogy: DL theory change is discontinuous and engineering-driven, not derived via limiting parameters.

  **Modality:**
  Scientific structures are lawlike and necessary. DL structures are contingent on data distributions, seeds, and optimizers. There is no "necessity" in a loss landscape, only statistics. The translation rounds off modality entirely. This matters: if the structure is contingent on the training run, can it really be "real"? This suggests the philosophical demand for modality may be incompatible with statistical learning theory.

  **The God's-Eye Problem:**
  In DL research, we often know the true DGP (simulated data). We can check realism directly. In science, we cannot. My vocabulary makes the realist's problem look solvable, which is a distortion. However, in real-world deployment (where the DGP is unknown), the problem returns. The residue here indicts my vocabulary: it hides the epistemic gap between simulation and deployment, making realism seem easier than it is.

  **Non-Identifiability:**
  We know many distinct latent structures fit the data equally well (e.g., rotation in latent space). This is precisely the **structure-is-too-cheap** objection in DL dress. If structure is non-identifiable, believing in it is unjustified. Seeing this in ML makes the objection stronger: we can *prove* non-identifiability in cases where philosophers can only speculate. It suggests structural realism is false unless inductive bias breaks the symmetry.

  ### 4. Verdict

  Translated into DL terms, structural realism looks **substantive but fragile**. It is not vacuous because we can measure representational similarity and test generalization. However, it is not trivially true because non-identifiability and contingency threaten the claim that learned structure mirrors reality.

  The **residue indicts the philosophical debate** more than my vocabulary. The demand for "modality" and "limiting cases" assumes a deductive relationship between theories that does not exist in statistical learning. Philosophers treat theories as logical structures; DL treats them as optimized functions. The "structure" philosophers want is lawlike necessity; the "structure" DL finds is statistical invariance.

  Conversely, my vocabulary is **impoverished regarding normativity**. DL tells us what *does* generalize, not what *should* be believed. The realist's claim is epistemic (we are entitled to believe), while DL is descriptive (the model converges). The translation fails to capture the justification for belief, only the mechanism of convergence.

  Ultimately, structural realism in DL reduces to: **Inductive biases constrain the solution space such that invariant feature geometries survive architecture changes.** This is a testable hypothesis, not a metaphysical stance. The philosophical debate becomes an empirical question about representation learning. If philosophers want more than that, they are asking questions DL vocabulary cannot express—not because DL is limited, but because the questions may be ill-posed.
