answer: |-
  This stalemate is a clash of incompatible bedrock intuitions about modal epistemology rather than a substantive dispute resolvable by argument within the current framework.

  The reason nobody budges is that both sides are protecting different "hinge propositions" that cannot be proven without begging the question. Chalmers prioritizes the intuition that ideal conceivability entails metaphysical possibility, treating the explanatory gap as evidence of an ontological gap. Physicalists prioritize the intuition that the physical world is causally closed and complete, treating the explanatory gap as an epistemic limitation caused by the unique nature of phenomenal concepts. When Chalmers argues that zombies are conceivable, physicalists reply that you are only conceiving of a functional duplicate while ignoring the hidden nature of the physical, or that your concept of "consciousness" is flawed; when physicalists argue that zombies are impossible, Chalmers replies that you are merely asserting physicalism by fiat rather than demonstrating it. Neither side can convince the other because any argument offered presupposes the very modal principles the opponent rejects.

  This means the disagreement is not merely verbal, nor is it a standard substantive dispute where more data or better logic will declare a winner. It is a framework disagreement akin to choosing between Euclidean and non-Euclidean geometry: you can prove consistency within the system, but you cannot prove which system maps to reality without stepping outside the system to appeal to intuitions that are themselves contested. The "bridge" you mention—from conceivability to possibility—is not a neutral logical tool but a loaded philosophical commitment that physicalists reject precisely because accepting it would force them to abandon physicalism.

  Progress will not come from a knockout argument within the zombie debate itself, nor from empirical experiments, because zombies are defined as empirically indistinguishable from conscious beings. Real progress requires dissolving the intuition that generates the problem or adopting a new metaphysical framework that renders the dichotomy obsolete. Illusionism, for example, claims progress by denying the intuition that there is "something it is like" to be us in the way dualists assume, thereby making zombies inconceivable by definition. Russellian monism makes progress by positing that physics describes structure while consciousness describes the intrinsic nature of matter, dissolving the conceivability gap without abandoning physical closure.

  You should not expect smart people to agree on this forever within the current terms, because the terms themselves encode the disagreement. If you want to move forward, stop trying to solve the zombie argument and start evaluating which broader framework (illusionism, panpsychism, emergentism, or dualism) offers the most coherent total package for explaining cognition, causation, and experience. The zombie debate is a symptom of the hard problem, not the disease, and curing the symptom requires treating the underlying metaphysical commitments.
