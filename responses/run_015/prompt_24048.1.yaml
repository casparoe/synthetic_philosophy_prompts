answer: |-
  The fluorescent light in Room 304 hummed with a fatigue that matched the committee's. On the table lay a single sheet of paper describing the activity known as "The Endless Rally." Two participants hit a ball back and forth over a net. They attempted to keep the ball airborne as long as possible. There were no opponents, no scores, and no declaration of a winner. The activity ceased only when the players chose to stop.

  Simon, the chair, tapped his pen against the clipboard. "We need to classify this for the recreation grant. Is it a game or not? The form requires a binary check."

  Mara adjusted her glasses. "It lacks a win condition. A game requires a state of affairs that constitutes winning. Without that, it's merely exercise or coordinated play. It falls outside the boundary."

  Elias leaned back, chewing on a cold pencil. "You're looking for a fence where there's only a gradient. Look at the fibers of a rope. No single fiber runs the whole length, yet the rope holds. 'Game' is like that. Tennis is a game. Catch is a game. This Rally shares threads with both—rules, equipment, skill—but it doesn't need the 'winning' fiber to belong to the bundle."

  "That's linguistic laziness," Mara countered. "Just because we haven't found the necessary and sufficient conditions yet doesn't mean they don't exist. We haven't found the essence, not that it isn't there. If we classify this as a game, we dilute the category until it means nothing. Next, someone will register 'breathing' as a game because it involves rhythm."

  "Breathing lacks the lusory attitude," Elias said. "These players accept the rules of the net solely to make the activity possible. They aren't just hitting a ball; they are submitting to constraints for the sake of the activity itself. That overlaps with chess, overlaps with tag. It's family resemblance, Mara. We recognize the kinship without needing a shared DNA test."

  Simon sighed. "So, Elias, you're saying the concept is inherently vague? That the boundary is fuzzy by design?"

  "I'm saying the boundary is drawn by use, not by definition," Elias replied. "If the community calls it a game, and it functions like our paradigms of games, the record should reflect that. We don't need a sharp edge to cut the paper."

  Mara leaned forward, her voice tightening. "But the office needs consistency. If you allow vagueness, you allow arbitrariness. I argue there is a boundary. We simply haven't formulated the conditions precisely enough to see it yet. Perhaps the condition is 'potential for victory.' Even if they don't score, the *possibility* of missing implies a failure state. That is the essence waiting to be articulated."

  "Potential isn't actual," Elias said. "They cooperate to avoid failure. That changes the structure."

  Simon looked between them. The hum of the light seemed to grow louder. He needed to file the report by noon. The Essentialist view offered comfort: a world where categories were distinct, waiting only for better maps. The Resemblance view offered accuracy: a map that matched the messy terrain.

  Simon checked the box labeled "Game."

  "We'll classify it as a game," Simon said. "Usage dictates the record. But Mara," he turned to her, "write up the footnote. Record your objection regarding the win condition. If the state audits us, I want your argument on file. It's the strongest case for why we might need to redraw the line later."

  Mara nodded slowly, gathering her papers. "The boundary exists, Simon. Even if you refuse to see it today, it will trip you up tomorrow."

  Elias watched her pack, knowing she was right about the trouble, even if she was wrong about the boundary. The rope held, but the fibers were fraying.

  ***

  **Analytical Note**

  Philosophers broadly agree that Wittgenstein's notion of family resemblance challenges classical essentialism—the idea that all instances of a concept share a single set of necessary and sufficient conditions. However, significant contention remains regarding the implications of this view.

  First, there is dispute over whether the absence of a unifying feature implies genuine semantic indeterminacy or merely the inadequacy of current descriptions. Some scholars argue Wittgenstein claimed concepts like "game" are inherently open-textured and lack sharp boundaries (semantic indeterminacy). Others contend he was merely suggesting our current definitions are insufficient, leaving open the possibility that a rigorous analysis could still find commonalities (descriptive inadequacy). This story commits to the former view: Elias argues the boundary is fuzzy by design, not just currently unknown.

  Second, there is debate over whether the claim that no necessary and sufficient conditions exist is a semantic claim about meaning or a methodological claim about how philosophy should proceed. Some read Wittgenstein as making a metaphysical point about language itself; others see it as a therapeutic method to stop philosophers from obsessing over essences. This story treats it as a semantic claim about how the word "game" actually functions in practice.

  Readers should note that while it is often presented as consensus that Wittgenstein rejected all essences, some contemporary scholars dispute this, arguing he targeted only specific kinds of essentialism. Therefore, the story's presentation of the "no essence" view as a settled alternative to Mara's position flags a philosophical stance that remains actively debated in exegesis.
