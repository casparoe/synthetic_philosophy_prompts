answer: |-
  The slogan is false as a claim about causal control but defensible as a rule for emotional investment, and both your group members are misusing it by smuggling in extra premises about efficacy and voluntary emotion.

  Here is the menu of precise theses your slogan could be expressing, rated for truth and utility, followed by an analysis of your two cases and a script for your next call.

  ### The Menu of Theses

  **1. The Binary Causal Claim**
  *   **Thesis:** The world divides neatly into things I can cause to happen and things I cannot.
  *   **Verdict:** **False.** As you noted, control is a continuum. I have *some* causal leverage on the election (voting, phonebanking) and *some* leverage on my gut reactions (breathing, reframing), but never 100% or 0%. Treating this as a binary switch denies reality.

  **2. The Security Claim (The Classic Stoic Read)**
  *   **Thesis:** The only thing I can secure *come what may* is my own volition (my attempt, my intention); everything else can be blocked by external forces.
  *   **Verdict:** **Substantive and Defensible.** Someone can stop me from winning the election or stop me from leaving a job, but they cannot force me to *will* something against my judgment. This isn't about causal power, but about invulnerability.

  **3. The Attributability Claim**
  *   **Thesis:** I am only morally responsible for what is "up to me" (my choices), not for outcomes dependent on luck or others.
  *   **Verdict:** **Substantive and Defensible.** This protects self-worth. If I do my duty and fail, I remain virtuous. If I succeed through luck but acted poorly, I remain flawed.

  **4. The Attentional Claim (Therapeutic Read)**
  *   **Thesis:** I should only tie my peace of mind to things I can secure; tying happiness to externals is a recipe for anxiety.
  *   **Verdict:** **Platitude/True.** This is basically cognitive behavioral therapy. Don't bet your happiness on things you can't guarantee.

  **5. The Trichotomy Fix (Irvine's Update)**
  *   **Thesis:** There are things we control, things we don't, and things we *influence* but don't control.
  *   **Verdict:** **True but Weakens the Slogan.** This solves the quantifier problem but destroys the punchiness. It requires a strategy for the middle category (usually: "play to win, but accept the loss"), which the binary slogan ignores.

  ### Analysis of Your Two Cases

  **Case 1: The Civic Withdrawal ("Don't phonebank")**
  *   **Required Reading:** This member is using **The Binary Causal Claim**. They are arguing: "I cannot guarantee the election result (100% control), therefore the effort is not up to me."
  *   **Does it Survive?** **No.** This contradicts actual Stoicism. The Stoic doctrine of *kathekon* (appropriate action) demands you participate in civic life because it is according to nature, regardless of the outcome.
  *   **Smuggled Premise:** "If you can't guarantee success, action is irrational." The slogan doesn't say this; the member added it. The Security Claim actually supports phonebanking: *Your effort is up to you; the result is not. Do the effort, ignore the result.*

  **Case 2: The Anger Blame ("You chose the anger")**
  *   **Required Reading:** This member is using a hyper-literal version of **The Binary Causal Claim** applied to physiology. They are arguing: "Your emotional state is 100% under your voluntary command."
  *   **Does it Survive?** **No.** Even ancient Stoics distinguished between the initial "proto-passion" (the physiological spike) and the "assent" (the judgment that validates the anger). The initial spike is not fully voluntary.
  *   **Smuggled Premise:** "Emotions are immediate choices rather than responses." The slogan doesn't say this; the member added it. The Attributability Claim supports a softer view: *The initial flare isn't up to you; what you do with it is.* Blaming someone for the flare is like blaming them for blinking.

  ### Bottom Line for the Group

  Nothing on this menu supports "don't bother acting" or "your pain is your fault." Both uses collapse because they treat "control" as "guaranteed outcome" rather than "owned effort."

  **What to say at the next call:**
  "I've been testing our slogan against some edge cases, and I think we're using 'control' to mean 'guaranteed outcome,' which makes the slogan false. If I phonebank, I don't control the win, but I control the call. If I get insulted, I don't control the adrenaline spike, but I control the assent.

  I propose we retire 'Control what you can control' because it invites quietism and victim-blaming. Instead, try: **'Own your efforts, not your outcomes.'** That keeps the agency without denying reality, and it stops us from telling people to opt out of civic duty or apologize for being human."
