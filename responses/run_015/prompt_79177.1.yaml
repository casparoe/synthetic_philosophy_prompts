  *Model Answer Draft:*
  The Asymmetric Inheritance Thesis posits that while political responsibility transfers across generations, moral guilt does not. This distinction attempts to solve the problem of how contemporary citizens relate to historical atrocities without claiming personal culpability. When evaluated against Jaspers's framework, AIT aligns closely with his category of moral guilt, which requires personal agency, but it rejects his notion of metaphysical guilt. Jaspers argues that all humans share a solidarity that makes them co-responsible for crimes committed in their presence. AIT denies this metaphysical link, insisting that guilt is strictly first-personal. However, AIT offers a more robust account of institutional continuity than Jaspers's metaphysical solidarity, which can seem vague. By limiting inheritance to responsibility, AIT protects the individual from unjust blame while maintaining the state's obligation to repair.

  To understand what a nation means by acknowledging guilt under AIT, we must distinguish three senses of guilt. First, guilt as an emotion involves feelings of shame or regret. Descendants can feel this without having committed the act. Second, guilt as a verdict is a judgment of culpability. This cannot be inherited under AIT because the descendants did not perform the action. Third, guilt as a status refers to being associated with the wrong through institutional continuity. A nation can acknowledge guilt as a status without accepting the verdict. This allows for acknowledgment that honors the victims without falsely accusing current citizens of criminal acts.

  Regarding collective guilt across generations, AIT suggests it is impossible if guilt means verdict. However, if the nation is viewed as a collective agent, the analysis shifts. A nation is not a biological person but a corporate entity with enduring policies and structures. If the state apparatus continues, the agent persists. Therefore, collective responsibility is possible because the institution persists. Collective guilt as a verdict is only possible if the collective agent itself is deemed morally culpable, not merely the individuals within it. Under AIT, the nation inherits the responsibility of the prior regime because the institutional identity remains, even if the specific human agents are gone. Thus, generational collective guilt is coherent only as institutional responsibility, not as personal moral blame.

  The death of the perpetrators does not change the metaphysics of guilt but alters the practicality of blame. The wrong remains objectively wrong regardless of whether the actor lives. Metaphysically, the truth of the atrocity is unchanged. However, blame requires a target for punishment or moral confrontation. Since the dead cannot be punished, blame becomes impractical. Acknowledgment shifts from retribution to restitution. This supports AIT's focus on responsibility. The living inherit the duty to fix the damage, not the punishment due to the dead. This distinction prevents the debate from becoming about punishing the innocent while ensuring the victims receive justice through repair.

  In conclusion, if AIT is true, a nation acknowledging guilt means accepting institutional status and responsibility for repair, not admitting personal verdict guilt. It rejects Jaspers's metaphysical solidarity in favor of institutional continuity. By separating emotion, status, and verdict, we see that descendants can feel regret and hold a status of association without being culpable. The nation acts as a continuous agent bearing responsibility, while the death of perpetrators limits blame to practical measures rather than metaphysical absolution. This framework allows for honest acknowledgment without logical contradiction.

