  **JOINT STATEMENT OF REMAINING AGREEMENT AND DISAGREEMENT**
  **TO:** The Oversight Body
  **FROM:** The Undersigned
  **DATE:** [Date]
  **SUBJECT:** Protocols for Unilateral Action in Threshold Risk Scenarios

  **I. JOINT ASSERTIONS**

  Both undersigned parties affirm the following claims regarding the structure of the problem space known as the "Unilateralist's Curse":

  1.  **Shape of the Case:** The argument concerns acts where the expected value is positive if performed by a single agent (or few) but negative if performed by many (threshold public bads), wherein agents possess imperfectly correlated private judgments regarding the act's value, and no corrective market or social feedback exists for the lone actor prior to execution.
  2.  **Scope of Application:** This framework applies only to high-stakes, irreversible interventions with global or systemic externalities. It does not touch private transactions, fixed-sum competitions, or actions where feedback loops correct errors before catastrophic threshold breach.
  3.  **Cost of Norms:** Any proposed norm of restraint or deference imposes coordination costs and risks stagnation. Such a norm is only worth adopting if the expected reduction in catastrophic tail risk exceeds the expected value of lost innovation and the administrative cost of enforcing the norm.
  4.  **Epistemic Humility:** Both parties agree that agents currently overestimate the reliability of their private judgments in these scenarios and that some form of adjustment to individual expected-value calculations is required.

  **II. TABLE OF DISAGREEMENT**

  | Issue | Signatory A (Deference Norm) | Signatory B (EV Calibration) | Type |
  | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | Agents owe a distinct procedural duty to the collective to withhold action if consensus is absent, independent of private utility calculations. | Agents owe only a duty to accuracy; withholding action is required only insofar as disagreement lowers the probability of the act being beneficial. | Substantive |
  | **Mechanism of Restraint** | Restraint is achieved by adopting a rule: "Do not act if you believe you are the only one who supports acting." | Restraint is achieved by updating priors: "If others do not support acting, my evidence suggests the act is less likely to be good." | Verbal |
  | **Handling Outliers** | The outlier must defer to the group mean to prevent the curse, even if their confidence is high. | The outlier should act if their calibrated expected value remains positive after accounting for the lack of consensus. | Substantive |
  | **Labeling** | The situation represents a structural failure of rationality requiring a new social technology. | The situation represents a standard Bayesian updating error requiring better education. | Verbal |

  **III. CRUCES AND ACCEPTED TESTS**

  The following empirical or theoretical tests are accepted by both parties as bearing on the disagreement. Each party's prediction is recorded below.

  **1. Simulation: Threshold Public Goods with Noisy Signals**
  *   **Test:** A multi-agent simulation where agents receive noisy signals about a threshold breach point. Compare outcomes between agents programmed with a "deference rule" versus agents programmed with "Bayesian updating only."
  *   **Signatory A Predicts:** The deference rule group will show significantly lower variance in outcomes and fewer catastrophic breaches, even if mean utility is slightly lower.
  *   **Signatory B Predicts:** The Bayesian updating group will achieve higher mean utility with no statistically significant increase in catastrophic breaches, provided signal noise is properly modeled.

  **2. Historical Episode: The Asilomar Conference (1975)**
  *   **Test:** Analysis of whether the moratorium on recombinant DNA research was sustained by a norm of deference among scientists or by individual recalibration of risk/benefit ratios.
  *   **Signatory A Predicts:** Archival evidence will show scientists withheld work they individually deemed safe specifically because colleagues objected, evidencing a norm of deference.
  *   **Signatory B Predicts:** Archival evidence will show scientists withheld work because the objection of colleagues caused them to update their own risk assessments, evidencing calibration.

  **3. The Discursive Amplification Model (Endogenous Participation)**
  *   **Test:** A model where the number of potential actors ($N$) is not fixed but grows as a function of public deliberation about the risk. This creates a tension: a norm of open deliberation increases $N$ (increasing risk), while a norm of deference reduces action but may require secrecy (increasing epistemic error).
  *   **Signatory A Predicts:** In high-$N$ growth scenarios, a norm of deference must trump open deliberation. Restricting the pool of actors via social stigma against unilateralism is the only way to prevent the curse from triggering as discussion spreads.
  *   **Signatory B Predicts:** In high-$N$ growth scenarios, open deliberation must trump deference. Restricting discussion hides information necessary for calibration. The risk of increased actors is outweighed by the risk of poorly calibrated actors acting in the dark; better calibration reduces the probability of action per agent faster than deliberation increases the number of agents.

  __________________________
  **Signatory A**

  __________________________
  **Signatory B**
