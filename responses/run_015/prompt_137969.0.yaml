  You are closer to the mark than your friend, though your friend isn't entirely wrong—just using a map that's too blurry for the terrain you're describing.

  Your friend is describing **Memetics** (or a Selectionist model of cultural evolution). This view treats ideas like genes: they replicate, sometimes mutate, and the ones that survive do so because they are "fit." The problem with this view, as you've spotted, is that it assumes the primary engine of change is *selection among variants* after they exist. It implies a lineage: one person makes a change, and it spreads.

  You are describing an **Attractionist** model. This view argues that ideas aren't primarily *copied*; they are *reconstructed* every time they are used. When someone tries to remember a dance or a slang word, they don't pull a perfect file from their brain; they rebuild it from scratch using their own cognitive tools and the constraints of their environment. Because human minds and technological platforms share similar constraints (limited memory, attention spans, character counts, 15-second loops), independent people rebuild the idea in the same "easy" direction.

  Here is the carving of the conceptual space:

  1.  **Memetic Selection (Your Friend's View):** Predicts that a specific mutated version arises in one place and spreads because it out-competes others. It expects high-fidelity copying with rare errors. It struggles to explain why the "broken" life-hack wins (unless "fitness" is redefined purely as "spreadability," which makes the theory tautological).
  2.  **Serial Reproduction (The Telephone Effect):** Predicts changes accumulate along a chain of communication. It fits Case 2 (slang) well but fails Case 1 (dance), because you noticed the simplified dance appeared in multiple places *independently*, not from one source branching out.
  3.  **Cultural Attraction (Your View):** Predicts that ideas evolve toward stable states ("attractors") that are easy for minds to process and tools to transmit. It explains independent convergence (everyone falls into the same cognitive "valley"), directional change (toward simplicity), and utility loss (if complexity costs transmission, complexity dies).

  The established concept for this is **Cultural Attraction**.

  It fits your cases because:
  *   **Case 1 (Dance):** The "two-move" version is a cognitive attractor. It requires less memory and motor planning. Multiple people reconstruct the dance toward this minimum effort state independently.
  *   **Case 2 (Slang):** Specific meanings require more context to maintain. Empty fillers are cognitively cheaper and fit more conversational slots. The idea is attracted to the state of "maximum applicability/minimum specificity."
  *   **Case 3 (Life-hack):** This is the strongest evidence. In pure selection, functional traits should win. In attraction, *transmissible* traits win. If the trick is too complex to remember or film in 15 seconds, it gets reconstructed into a simpler, broken version that fits the "container" (the app, the memory).

  Your friend's view treats the idea as a solid object that gets passed around. Your view treats the idea as a fluid that takes the shape of the container (mind + app) every time it is poured. The evidence you provided (independent rebuilding, utility loss, technological constraints) strongly supports the fluid/reconstruction model.

  **Commitment:**
  I am confident your account is mechanistically more accurate. Your friend is using a metaphor (natural selection) that works at a high level but fails to explain the *direction* and *independence* of the changes you see. Natural selection explains why the weak die; Cultural Attraction explains why the survivors all look the same despite never meeting.

