          *   *The Gap:* Tech lacks a "Speaker Competence Certificate" or a distinct flag for "Failed Pragmatic Contract." We treat all inference as valid posterior updates. Grice distinguishes *warranted* inference from *unwarranted* inference based on the assumption of cooperation.

