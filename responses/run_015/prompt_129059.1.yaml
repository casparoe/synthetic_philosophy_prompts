      *   *Reranker:* It mimics RSA (Rational Speech Acts). It implements the *mechanism* (optimizing utility) but maybe not the *normativity* (the obligation to be cooperative). It calculates $P(z|x)$ but doesn't check if the speaker *should* have produced $x$ for $z$.

  6.  **Developing the Verdict & The One Primitive:**

      *   *Defects:* My vocabulary treats communication as *information transfer*. Grice treats it as *joint action*.
      *   *The Primitive:* "Commitment" or "Undertaking." In tech, we have probabilities. In Grice, the speaker *commits* to the truth. We need a binary (or high-confidence) flag that isn't just $P > 0.9$. It's a speech act type. Let's call it **Illocutionary Force** or **Commitment Flag**.
