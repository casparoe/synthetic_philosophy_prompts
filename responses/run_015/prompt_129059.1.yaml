      *   (b) *Laptop dies, enthusiastic.* Irony. Tech: Sentiment mismatch (Audio/Text vs. Context). High loss on literal.
      *   (c) *Cream in coffee.* Metaphor. Tech: Semantic similarity in embedding space, despite literal falsity.
      *   (d) *Non-native speaker (Crucial).* Speaker says "some", means "at least some" (literal). Hearer infers "not all".
          *   Grice: Hearer made a mistake. No implicature was generated because Speaker wasn't cooperative/competent regarding the maxim of Quantity (or Hearer misapplied the model of the Speaker).
