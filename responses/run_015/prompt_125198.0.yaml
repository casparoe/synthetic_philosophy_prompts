      *   *The Prediction:* An idealized deliberator, free from specific political pressure and with full access to risk data, would almost certainly vote **No Launch**. The risk asymmetry (delay costs money/reputation vs. launch costs lives) is too high.
      *   *The Collapse:* Why didn't this happen?
