answer: |-
  # Q&A PREP SHEET: YORK COLLOQUIUM

  **Thesis:** Intention = Evidence, not Instruction. (The Resolute Ambiguity Rule).
  **Goal:** Defend as a professional norm, not personal preference.
  **Stakes:** Credibility with translators; consistency with past actions.

  ---

  ### THE EIGHT OBJECTIONS (Ordered by Damage Potential)

  #### 1. The Chair (Pragmatism)
  **The Objection:** "You've given us a beautiful theory, but I translate to a deadline. If I have to choose between a sentence that sings in my language but narrows your meaning, and one that preserves your ambiguity but clunks on the page, your rule tells me to choose the clunk. That makes my book worse. What practical difference does this make to someone working to a deadline, other than making the work harder?"
  **Your Reply (2 mins):** "It changes the question from 'What did he want?' to 'What can this text sustain?' That is faster, not slower. Chasing my intention is a goose chase; you'll email me, I'll forget, I'll lie. The text is on the desk. If the ambiguity clunks, the rule doesn't demand bad writing. It demands you find a *different* ambiguity, or accept that this specific shadow cannot cross this specific border. But don't collapse it just to make my life easier. The practical difference is this: stop waiting for my permission to make a decision. The text has already decided. Your job is to find its equivalent authority in your language, not its equivalent instruction."
  **Weakness:** Risks sounding like you're dismissing the difficulty of "finding a different ambiguity." It assumes equivalent ambiguity always exists.
  **Concede?** **Yes.** Concede that sometimes the ambiguity *cannot* be carried without breaking the target language. The rule is a norm, not a physics law. Say: "If the choice is between a broken sentence and a clear one, fix the sentence. But don't fix it by inventing a certainty that isn't there."

  #### 2. The Senior Translator (Aesthetics/Ear)
  **The Objection:** "Ambiguity in the source can read as incompetence in the target. In English, a vague pronoun is atmospheric; in German, it's a grammatical error. If I preserve your ambiguity, I am not preserving your art, I am preserving a mistake. Why should I damage the ear of my readers to protect a ghost?"
  **Your Reply:** "Because the 'mistake' might be the point. When I write vaguely, I am often writing about the limit of knowing. If you clean it up, you aren't fixing a mistake, you're resolving a tension I built. I would rather a reader in your language feels the same friction you feel than that they glide over a smooth surface that wasn't there. Trust your readers. They are smarter than we think. They know when a sentence is wobbling. Let them wobble."
  **Weakness:** Romanticizes "friction." Some friction is just bad editing.
  **Concede?** **No.** This is the core aesthetic battle. Hold the line that reader competence is higher than translators assume.

  #### 3. The Italian Translator (Specific Consistency)
  **The Objection:** "We argued for twenty minutes about a single sentence in public. You insisted I was wrong to clarify a reference. But in your notes, you call intention 'evidence.' If my reading of that sentence was supported by the text's circumstances, why was your instruction decisive in that room? Are we evidence-gatherers or servants?"
  **Your Reply:** "You are right to call that out. In that room, I was being a writer, not a theorist. I was defensive. That is exactly why I am proposing this norm: to protect you from me, and me from my own defensiveness. When I insist, treat it as *new evidence* about the text, not as a command. If the text still supports your reading, stick with the text. I am asking you to trust the book more than you trust the author, even when the author is shouting."
  **Weakness:** Admitting you were "defensive" undermines your authority slightly, but builds trust.
  **Concede?** **Yes.** Absolutely. Acknowledge the public disagreement was a failure of your own rule. It humanizes you and validates their frustration.

  #### 4. The Publishing Lawyer (Moral Rights)
  **The Objection:** "You're talking about norms, but I deal in contracts. In many jurisdictions, the author has a 'moral right' to the integrity of the work. If a translator preserves an ambiguity the author explicitly rejects, the author can sue to block publication. How does your 'public object' stand up to a cease-and-desist?"
  **Your Reply:** "It doesn't, legally. And I'm not suggesting you break your contract. I'm suggesting we change the culture of the contract. If we treat intention as instruction, we invite the author to micromanage the translation. If we treat it as evidence, the contract becomes about the *text*, not the *mind*. I am asking publishers to write contracts that protect the translator's right to interpret the public object, not the author's right to police their own memory."
  **Weakness:** Legally naive. Contracts *are* the reality.
  **Concede?** **Yes.** Acknowledge the legal reality but frame the talk as a push for industry standards to evolve ahead of the law.

  #### 5. The Scholar (Reader Response)
  **The Objection:** "My data shows readers resolve ambiguity automatically within 200 milliseconds. They don't experience the 'shared public object' you describe; they experience their own resolution. If you preserve the ambiguity, but the reader collapses it anyway, what work have you actually done? You're preserving a phantom."
  **Your Reply:** "You're measuring cognitive processing, not literary experience. A reader might resolve a pronoun to keep reading, but the *aftertaste* of the uncertainty remains. That aftertaste is the literature. If you remove the ambiguity, you remove the possibility of that aftertaste. I'm not arguing for confusion; I'm arguing for the preservation of the *potential* for multiple readings. Even if they pick one, they should know they could have picked the other."
  **Weakness:** Hard to prove "aftertaste" empirically.
  **Concede?** **No.** This is a theoretical boundary. Insist that literary reading is slower and more reflective than your experimental data captures.

  #### 6. The Translator (Collaboration/Trust)
  **The Objection:** "Translation is a relationship. If I treat your intentions as mere evidence, I am treating you like a suspect, not a partner. Doesn't this rule kill the trust required to make a book together?"
  **Your Reply:** "It changes the trust. It moves trust from 'I trust you to tell me the truth about your head' to 'I trust you to tell me the truth about the page.' Heads are unreliable. Pages are stable. I want a partnership based on the thing we both have in front of us, not on a hierarchy where one of us owns the meaning and the other rents it."
  **Weakness:** Can sound cold or adversarial.
  **Concede?** **No.** Reframe "trust."

  #### 7. The Translator (Idiom/Culture)
  **The Objection:** "Some ambiguities are cultural, not textual. In Arabic, a verb tense implies aspect that English doesn't have. If I force English to be ambiguous, I am importing a foreign structure. Isn't that worse than clarifying?"
  **Your Reply:** "Sometimes, yes. But often, English has other tools—word order, rhythm, lexical choice—to create that same shadow. Don't assume the ambiguity is in the grammar; look for it in the music. If you can't find it, tell me. But don't assume it's impossible until you've tried to rebuild the shadow with different bricks."
  **Weakness:** Puts the burden of proof on the translator to "rebuild."
  **Concede?** **Yes.** Acknowledge that some losses are inevitable. The rule is an aspiration, not a guarantee.

  #### 8. The General Audience (The Meta-Question)
  **The Objection:** "If the text is a shared public object and your intention doesn't matter, why are *you* standing here? Why not let the translators talk to each other?"
  **Your Reply:** "Because I am the one who usually breaks the rule. I am the one who emails at 2 a.m. saying, 'No, not that word.' I am here to say: please ignore those emails. I am here to give you permission to ignore me. The author is the biggest threat to the Resolute Ambiguity Rule. I am here to disarm myself."
  **Weakness:** Self-deprecating, but effective.
  **Concede?** **No.** This is a strong closing position.

  ---

  ### THE ONE REPLY THAT MUST LAND
  **Objection #1 (The Chair/Pragmatism).**
  If the room decides this theory is useless for working translators, the talk is dead. You must convince them that treating intention as evidence *saves* time and anxiety, rather than creating more work.
  **Key Phrase to Hit:** "Stop waiting for my permission to make a decision."

  ### WHAT TO HOLD (Even if the rest goes badly)
  **Claim #3: The Text as a Shared Public Object.**
  Even if they reject the "Ambiguity Rule," do not let them convince you that the Author's *account* of the text overrides the text itself. If you lose this, you lose the thesis entirely.
  **Key Phrase to Hold:** "The book is not in my head; it is in your hands."

  ---

  ### THE QUESTION YOU'RE HOPING NOBODY ASKS
  **The Question:** "You've argued that we should ignore your instructions in favor of the text. But twice you've asked publishers to stop a translation that misread you, and you wrote an explanatory note for your US edition to steer the reading. Isn't this rule just for when you agree with the translation? When it matters, you exercise the very authority you're telling us to ignore."

  **Damage Assessment:** **Critical.** This exposes the thesis as a convenience rather than a principle. It validates the Italian Translator's skepticism and the Chair's pragmatism simultaneously. It suggests you want the *benefit* of the "Death of the Author" without the *loss of control*.

  **How to Answer (Honesty Strategy):**
  Do not deflect. Do not theorize. Admit the contradiction.
  **Draft Reply:** "You are right. It is a contradiction. When I stopped that translation, I was afraid. I was protecting myself, not the book. And the note I wrote... that was me trying to control the reception because I didn't trust the text to do its work. I am standing here today precisely because I know I fail at this. I am proposing this norm not because I am perfect at it, but because I am dangerous without it. If you wait for me to be consistent before you adopt the rule, you will never translate me. Use the rule to protect the book from me, even from the me that tries to stop you."

  **Why this works:** It disarms the attack by agreeing with it. It frames your past behavior as the *problem* your thesis solves, rather than evidence against the thesis. It turns your hypocrisy into a reason for them to listen.

  **Prep Note:** Rehearse this specific answer until it sounds spontaneous. If you stumble here, the "Resolute Ambiguity Rule" looks like a game. If you own it, it looks like a plea for help.
