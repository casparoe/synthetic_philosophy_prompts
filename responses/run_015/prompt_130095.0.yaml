          *   Tone: Formal, precise, rationalist-adjacent (values conceptual clarity over flourish).
          *   Length: Roughly 10 minutes (approx. 1,300 - 1,500 words spoken at a moderate pace).
          *   No citations/bibliography.

  2.  **Determine the Tone and Voice:**
      *   *Formal but welcoming:* It's a workshop, not a courtroom.
      *   *Intellectual:* Needs to respect the academics' rigor.
      *   *Diplomatic:* Needs to respect the foundations' presence without flattery that undermines the thesis.
      *   *Conceptual:* Focus on the *mechanism* of inheritance, not the *morality* of specific individuals.
      *   *Rationalist-adjacent:* Use terms like "externalities," "option-space," "mechanisms," "incentive structures." Avoid emotional language like "greed," "fairness," or "envy."

  3.  **Structure the Speech:**
      *   **Welcome & Acknowledgement (2 mins):** Welcome everyone, specifically acknowledging the unique composition of the room. Thank the foundations explicitly but frame their contribution as part of the inquiry, not just funding.
      *   **The Problem with Standard Discourse (3 mins):** Briefly outline the usual debate (purchasing power vs. merit) and why it's insufficient.
      *   **The Core Distinction (3 mins):** Introduce the "Purchasing Power" vs. "Positional Lock-in" framework. Explain what lock-in means (option-space, non-market advantages).
      *   **Reframing the Policy Question (2 mins):** Shift from "redistribution" to "correcting externalities." Explain why this matters for the workshop's goals.
      *   **Closing & Invitation to Dialogue (1 min):** Set expectations for the day. Emphasize collaboration over confrontation.

  4.  **Drafting - Section by Section:**

      *   *Welcome:* Start by noting the rarity of this gathering. Academics and practitioners usually talk past each other. Acknowledge the foundation reps. *Crucial:* Thank them for funding the chairs *and* for being here to examine the structures that allowed that funding to exist. This walks the line of not treating wealth as neutral.
      *   *The Standard Debate:* Economists talk about efficiency and savings rates. Philosophers talk about desert and equality of opportunity. Both often assume money is just "fuel."
      *   *The Conceptual Shift:* Introduce the distinction.
          *   View A: Money as fuel (purchasing power).
          *   View B: Wealth as architecture (positional lock-in).
          *   Explain "option-space." It's not just buying a better car; it's buying access to networks, safety nets, and risk immunity that aren't traded on open markets.
      *   *The Policy Implication:* If it's lock-in, then inheritance tax isn't taking what's "theirs" to give to "others." It's a Pigouvian tax on an externality (the distortion of opportunity structures). This removes the "envy" framing. It becomes about system maintenance.
      *   *Addressing the Room:* To the academics: Don't get lost in models. To the foundations: You aren't defendants; you are stakeholders in the stability of the system.
      *   *Conclusion:* We are here to map the architecture, not to judge the inhabitants.

  5.  **Refining and Polishing (Self-Correction during drafting):**
