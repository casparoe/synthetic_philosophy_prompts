answer: |-
  Good morning. Welcome to this workshop on inheritance, dynastic wealth, and the structural conditions of equal opportunity.

  It is rare that a room like this is convened. Typically, discussions on intergenerational transfer occur within silos. Economists model the efficiency costs of capital taxation. Philosophers debate the normative bounds of bequest and desert. Policy analysts focus on revenue yields and loopholes. Meanwhile, the stewards of significant multigenerational capital—those who manage the foundations and trusts that often fund the very institutions hosting these debates—rarely sit in the same room as the critics of the structure that produced them.

  That silence is a data point in itself. It suggests a fragmentation in our understanding of how opportunity actually functions.

  I want to begin by acknowledging the two family foundations represented here. Thank you for your institutional support of this event, and for your longstanding endowments of university chairs. Your presence here is not merely ceremonial; it is substantive. By attending, you acknowledge that the mechanisms of dynastic wealth are not settled facts of nature, but subjects worthy of scrutiny. I want to be precise about what that means. Acknowledging your contributions to this institution does not require us to treat the accumulation of the capital behind those contributions as morally neutral private property. Nor does analyzing the structure of that accumulation require us to treat you as defendants. We are here to examine the architecture, not to litigate the intentions of the inhabitants.

  Our goal today is to move past the standard taxonomy of this debate. Usually, we argue about inheritance as a transfer of *purchasing power*. In this framing, wealth is treated as a stock of fuel. The policy question becomes: How much fuel should one generation be allowed to pass to the next before it distorts incentives or deprives the public sector of revenue? This is a question of volume. It assumes that money is fungible, that markets are liquid, and that a dollar inherited functions roughly the same as a dollar earned, differing only in the timing of its receipt.

  I propose that this framing is insufficient. It fails to capture the specific mechanism by which dynastic wealth influences equal opportunity.

  I want to suggest a different distinction for our deliberations today. We should distinguish between inheritance as a transfer of purchasing power, and inheritance as a mechanism of *positional lock-in*.

  Purchasing power is about consumption and investment capacity. It is quantitative. Positional lock-in is qualitative. It refers to the capacity of concentrated wealth to reserve social, educational, and political option-space across generations in a way that markets do not price and individual merit cannot overcome.

  When we speak of option-space, we are speaking of the range of viable life paths available to an agent. In a perfectly fluid meritocracy, option-space is determined by ability and effort. In a system characterized by dynastic lock-in, option-space is partially determined by the prior accumulation of status by one's ancestors. This is not simply about having the funds to attend a prestigious university. It is about the pre-emptive reservation of slots, the access to networks that function as closed information systems, and the ability to absorb risk in ways that are structurally unavailable to those without a generational safety net.

  This distinction matters because it changes the nature of the policy problem. If inheritance is merely a transfer of purchasing power, then taxation is a question of redistribution. It becomes a zero-sum argument about who deserves the resources. This framing invites defensiveness. It triggers a protection of property rights based on the idea that the wealth is a static object owned by a specific lineage.

  However, if inheritance functions as positional lock-in, then the concentration of dynastic wealth creates an intergenerational externality.

  An externality, in economic terms, is a cost or benefit incurred by a third party who did not agree to it. When wealth accumulates to a degree that it allows a family to bypass competitive markets—to secure internships through networks, to fund political advocacy that shapes zoning laws, or to ensure that their descendants occupy the same professional strata regardless of marginal differences in ability—it distorts the opportunity structure for everyone else. It reduces the total available option-space for those outside the dynasty.

  This is not a moral judgment on the families who benefit from this lock-in. It is a structural observation. A family acting rationally to secure the best possible outcomes for their children will naturally seek to convert financial capital into social and positional capital. But when this conversion becomes the dominant mechanism of social stratification, it degrades the signaling value of merit. It creates friction in the labor market. It reduces social mobility, which is itself a drag on economic efficiency and a source of political instability.

  Therefore, we can reframe inheritance taxation. It need not be viewed as an act of redistribution born of envy. It can be understood as a Pigouvian correction—a tax levied to account for the negative externality imposed on the opportunity structure of the society. It is a fee for the maintenance of a competitive market in status and opportunity.

  This framing imposes specific demands on us for the next two days.

  To my colleagues in philosophy and economics: I ask that you resist the urge to retreat into abstract ideal theory. We are not designing a society from behind a veil of ignorance. We are analyzing an existing mechanism. We need to understand how lock-in actually operates in the 21st century. It is no longer just about land or equity; it is about access to proprietary algorithms, unpaid internships, and the social capital required to navigate elite institutions. Your models must account for the fact that wealth buys immunity from downside risk, which is a distinct commodity from the ability to purchase upside gain.

  To our colleagues from the family foundations: I ask that you bring your phenomenological knowledge of these structures. You know how these mechanisms function in practice. You know where the friction points are. You know how capital is preserved against erosion. The question is not whether you earned your position, or whether your philanthropy is virtuous. The question is whether the mechanisms that allow for the preservation of dynastic status are compatible with the stated goal of equal opportunity. Can a system tolerate unlimited positional lock-in and still call itself a meritocracy? If not, what are the levees that need to be built?

  I am aware that this terminology is sharp. "Positional lock-in" and "externalities" are cold terms. They strip away the warmth of family legacy and the narrative of hard work. But clarity is a form of respect. If we cannot name the mechanism, we cannot diagnose the pathology.

  We are not here to abolish inheritance. We are not here to dismantle the family unit. We are here to determine if there is a threshold at which the intergenerational transfer of advantage ceases to be a private matter and becomes a public constraint on opportunity.

  If we treat wealth solely as private property, the conversation ends at the boundary of the balance sheet. If we treat wealth as a structural force that shapes the option-space of the next generation, the conversation opens up to the health of the democracy itself.

  I want to thank you all for accepting the premise of this workshop. It would have been easier to stay in our respective lanes. The academics could have published papers that the practitioners never read. The foundations could have funded chairs without questioning the conditions that made the endowment possible. Instead, we are choosing to interrogate the link between the two.

  Over the next two days, I ask that we maintain this conceptual precision. When we speak of "fairness," let us specify whether we mean procedural fairness in the transfer of assets, or structural fairness in the distribution of opportunity. When we speak of "taxation," let us specify whether we view it as revenue generation or as a regulatory tool to mitigate lock-in.

  We have a heavy agenda, but the premise is simple: We cannot solve a problem we have not correctly defined. For too long, we have defined inheritance as a transfer of money. Today, we begin the work of defining it as a transfer of position.

  Thank you. I look forward to our discussions.
