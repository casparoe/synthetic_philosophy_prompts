answer: |-
  Here is the gut-level intuition for why overbetting is catastrophic, why it creates a divergence between expected value and actual outcomes, and why log wealth is the correct metric.

  ### 1. The Compounding Trap: Losses Hurt More Than Wins Help
  The fundamental asymmetry comes from the math of percentages and compounding.

  Imagine you have \$100.
  *   If you lose **50%**, you have \$50. To get back to \$100, you need a **100%** gain.
  *   If you lose **80%**, you have \$20. To get back to \$100, you need a **400%** gain.

  As your bet size increases, the depth of the hole created by a loss grows exponentially deeper relative to the gain required to escape it.

  When you bet the **Kelly fraction**, you are balancing the size of the win against the depth of the loss to maximize the *compounded* result. When you **overbet**, you are making the losses so deep that even frequent wins cannot dig you out. You are subjecting your bankroll to a "volatility tax" that exceeds your edge.

  ### 2. Two Different Averages: Ensemble vs. Time
  This is the crux of the +EV vs. Ruin paradox. There are two ways to calculate "average return," and they tell different stories.

  *   **Expected Wealth (Arithmetic Mean):** This asks, "If a million people made this bet once, what is the average amount of money they have?"
      *   Because the upside of a bet is uncapped (you can win big) but the downside is capped (you can only lose what you bet), the *arithmetic* average keeps going up as you bet more. Even at 100% bet size, the *average* wealth across a million parallel universes is huge, because the few lucky winners hold almost all the money.
  *   **Expected Log Wealth (Geometric Mean):** This asks, "If **one** person makes this bet a million times in a row, what happens to their money?"
      *   In a single timeline, you cannot rely on the lucky outliers. You experience the sequence of wins and losses personally. Because compounding is multiplicative, the *geometric* average is what dictates your survival.

  **The Intuition:** Overbetting optimizes for the **Arithmetic Mean** (the average across parallel universes) while destroying the **Geometric Mean** (the average through time). Since you live in one timeline, the Geometric Mean is the only one that matters. If the Geometric Mean is negative, you go to zero, even if the Arithmetic Mean is positive.

  ### 3. Variance Drag (The Volatility Tax)
  There is a rough approximation for the Geometric Growth Rate:
  $$ \text{Growth Rate} \approx \text{Expected Return} - \frac{\text{Variance}}{2} $$

  *   **Expected Return** grows linearly with bet size. (Bet twice as much, expect twice the profit).
  *   **Variance** grows with the *square* of bet size. (Bet twice as much, volatility quadruples).

  When you start small, the Expected Return dominates. But as you increase your bet size, the Variance term (the penalty) grows much faster than the Return term (the reward).

  At the **Kelly fraction**, you have found the peak where the reward maximally outweighs the variance penalty.
  *   **Underbetting:** You are to the left of the peak. You are taking less variance than you could afford. It's safe, just suboptimal.
  *   **Overbetting:** You are to the right of the peak. The variance penalty is now growing faster than your edge. You are paying more in "volatility tax" than you are earning in "edge income."

  ### 4. The "Double Kelly" Cliff
  Why does wealth decay to zero with probability one?

  There is a specific threshold, often called **Double Kelly** ($2f^*$).
  *   At exactly Double Kelly, your Geometric Growth Rate is **zero**. Your wealth will fluctuate wildly, but it has no drift up or down in the long run.
  *   **Beyond Double Kelly**, your Geometric Growth Rate becomes **negative**.

  If your long-run growth rate is negative, your log-wealth trends toward $-\infty$. In normal numbers, this means wealth trends toward **zero**.

  This happens even though every individual bet has positive Expected Value. Why? Because the positive EV is being generated by rare, massive outliers (the "million parallel universes" scenario). In your single timeline, the compounding drag from the variance ensures that the typical path leads to ruin. The "average" outcome is skewed by outcomes you will almost certainly never experience.

  ### 5. Summary of the Asymmetry
  The asymmetry exists because **risk scales faster than return.**

  *   **Underbetting** is like driving 40 mph in a 60 mph zone. You will get to your destination (wealth growth) safely, just later than necessary. The penalty is linear (opportunity cost).
  *   **Overbetting** is like driving 150 mph. You aren't just risking a ticket; you are risking a crash. As you push past the limit, the probability of a crash doesn't just increase; the *physics of the car* (the math of compounding) ensures that if you sustain that speed, the engine blows.

  The Kelly criterion maximizes **Expected Log Wealth** because that is the mathematical equivalent of maximizing the survival and growth of a single bankroll over an infinite sequence of reinvested bets. Expected Wealth (arithmetic) ignores the sequence, and in a compounding game, **the sequence is everything.**
