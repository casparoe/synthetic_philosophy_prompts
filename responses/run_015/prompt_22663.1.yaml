prompt: |-
  I understand the Kelly criterion at the surface level: on a fair-odds bet with a positive edge, stake a fraction of your bankroll equal to that edge, and this choice maximizes your long-run geometric growth rate. What I want to understand is a subtler point about what happens when your estimate of the edge is wrong. Please explain intuitively why the criterion is asymmetric in this respect: why does there exist a range of overbets — staking more than the true Kelly fraction — that leads to almost sure ruin, i.e., your wealth decaying to zero with probability one, even though each individual bet still has positive expected value? And why does this asymmetry have to do with the fact that the right objective is expected log wealth (the geometric growth rate) rather than expected wealth? I want the gut-level intuition, not the full derivation.
reasoning: |-
  Here's a thinking process that leads to the explanation of the Kelly criterion's asymmetry regarding overbetting:

  1.  **Deconstruct the User's Request:**
      *   **Core Subject:** Kelly Criterion.
      *   **Specific Focus:** Sensitivity to estimation error (specifically overbetting).
      *   **Key Question:** Why does overbetting (staking more than the true Kelly fraction) lead to ruin (wealth $\to 0$) even with positive expected value (EV) per bet?
      *   **Key Connection:** Why is this linked to maximizing *expected log wealth* (geometric growth) vs. *expected wealth* (arithmetic growth)?
      *   **Constraint:** "Gut-level intuition, not the full derivation."

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Kelly Criterion:* Maximizes geometric growth rate ($G$). $f^* = \text{edge}/\text{odds}$.
      *   *Overbetting:* $f > f^*$. Specifically, $f > 2f^*$ is "double Kelly," where growth becomes negative.
      *   *Ruin:* Wealth goes to zero. In log terms, $\log(W) \to -\infty$.
      *   *Positive EV vs. Negative Growth:* How can a bet be +EV but -Growth? Volatility drag.
      *   *Asymmetry:* Underbetting reduces growth but is safe. Overbetting increases risk disproportionately.
      *   *Log Wealth:* The math of compounding. $(1+f)(1-f)$ vs $1 + f \cdot \text{edge}$.

  3.  **Developing the Intuition (The "Gut Level"):**

      *   *Point 1: The Compounding Trap (Volatility Drag).*
          *   Imagine a coin flip. Heads you win 100%, Tails you lose 100%.
          *   If you bet 100% of bankroll: Win $\to$ 2x, Lose $\to$ 0. Game over.
          *   If you bet 50%: Win $\to$ 1.5x, Lose $\to$ 0.5x. Net effect of one win/one loss: $1.5 \times 0.5 = 0.75$. You lost 25% of your money despite a 50/50 coin!
          *   *Insight:* Losses hurt more than wins help when compounding. A 50% loss requires a 100% gain to break even.
          *   *Connection to Overbetting:* The bigger the bet, the deeper the hole a loss digs. If the bet is too big, the recovery required after a loss is mathematically impossible to sustain on average.

      *   *Point 2: Arithmetic vs. Geometric Mean.*
          *   *Arithmetic (Expected Wealth):* Linear average. $(Win + Loss) / 2$. Ignores sequence.
          *   *Geometric (Expected Log Wealth):* Product average. $\sqrt{Win \times Loss}$. Respects sequence/compounding.
          *   *The Divergence:* As bet size increases, Arithmetic Mean keeps going up (because the upside is uncapped). Geometric Mean peaks and then falls.
          *   *Why?* Because the *variance* penalizes the geometric mean. $\text{Geometric} \approx \text{Arithmetic} - \text{Variance}/2$.
          *   *Overbetting:* You are increasing variance faster than you are increasing arithmetic return. Eventually, the variance penalty swallows the return.

      *   *Point 3: The "Double Kelly" Cliff.*
          *   At $f = 2f^*$, the geometric growth rate is zero.
          *   Beyond that, it's negative.
          *   Why zero? The gains from wins exactly cancel the losses from losses in *log* space.
          *   Why ruin? If the growth rate is negative, $\log(W_t) \to -\infty$, which means $W_t \to 0$.
          *   *Crucial distinction:* Expected *Value* is still positive. If you could reset your bankroll to $1 every time, you'd make money. But since you bet *from* your winnings, the path matters.

      *   *Point 4: Asymmetry (Underbetting vs. Overbetting).*
          *   Underbetting ($f < f^*$): You leave money on the table. Growth is lower, but variance is lower too. Safe.
          *   Overbetting ($f > f^*$): You chase the arithmetic mean. You take on "bad variance."
          *   *Analogy:* Driving. Underbetting is driving 40mph in a 60mph zone. You get there late, but safely. Overbetting is driving 120mph. You might get there faster, but the risk of crashing (ruin) skyrockets. Actually, it's worse: at 200mph, crashing is *guaranteed* eventually.

  4.  **Drafting the Explanation (Iterative refinement for tone and clarity):**

      *   *Intro:* Acknowledge the paradox (+EV bets leading to ruin).
      *   *Section 1: The Compounding Asymmetry (Losses hurt more).* Use the 50% loss / 100% gain example. This is the most visceral intuition.
      *   *Section 2: Arithmetic vs. Geometric.* Explain that EV looks at the average *outcome*, while Kelly looks at the average *path*. Overbetting optimizes for the average outcome of a single bet, ignoring the sequence.
      *   *Section 3: The Variance Drag.* Introduce the idea that volatility acts as a tax on compounding. Overbetting increases volatility faster than return.
      *   *Section 4: The "Double Kelly" Threshold.* Explain specifically why $2f^*$ is the ruin point.
      *   *Conclusion:* Summarize the trade-off.

  5.  **Refining the "Why Log Wealth?" part:**
      *   Need to explain *why* we care about log wealth.
      *   Because we reinvest.
      *   $\log(A \times B) = \log(A) + \log(B)$. It turns multiplication (compounding) into addition (averaging).
      *   Law of Large Numbers applies to the *sum of logs*, not the *product of wealth*.
      *   Therefore, the long-run behavior is determined by the *expected log return*, not the *expected arithmetic return*.

  6.  **Self-Correction/Check during drafting:**
      *   *Did I avoid heavy math?* Yes, keep formulas minimal.
      *   *Did I answer the asymmetry question?* Yes, emphasize that underbetting is "safe but slow," overbetting is "dangerous and ultimately self-destructive."
      *   *Did I explain the +EV vs. Ruin paradox?* Yes, via the difference between ensemble average (EV) and time average (Growth).

  7.  **Final Polish:** Ensure the tone is conversational but precise. Use bolding for key concepts. (Self-correction: Make sure to explicitly mention that "Expected Wealth" goes to infinity even as "Most Likely Wealth" goes to zero. This is the ergodicity break.)

  8.  *(Final thought before generating)*: The "Ergodicity" concept is the deep mathematical reason, but might be too technical. I should frame it as "Ensemble Average vs. Time Average" without necessarily using the word "Ergodicity" unless it helps clarity. Let's stick to "Average of many people" vs "One person over time."

  9.  **Structure:**
      1.  The Compounding Trap (Losses > Wins).
