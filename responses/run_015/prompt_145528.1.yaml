answer: |-
  The lottery and preface paradoxes are not parallel failures of rationality but manifestations of a single structural asymmetry in how justification aggregates across disjoint domains. Justification does not aggregate uniformly; instead, acceptance is indexed to the stakes and scope of the specific practical context. For any single ticket, the probability of loss, however high, falls below the stringent threshold required for individual action, warranting withheld acceptance to avoid error costs in specific bets. However, the collective proposition that "some ticket will lose" operates within a global decision problem where the aggregate certainty crosses a distinct global threshold sufficient for general assertion. This structural asymmetry resolves the tension: rationality demands withholding belief in particular losses while endorsing the general outcome. Thus, the paradoxes disappear when we abandon the view of acceptance as a uniform doxastic state. Instead, we see justification as fluid, shifting between local precision and global reliability based on the practical demands placed on the agent's reasoning at different scopes of inquiry.
