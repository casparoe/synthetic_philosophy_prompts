answer: |-
  You have stumbled onto one of the most robust and unsettling results in social choice theory. You are correct that this is closely related to the courtroom scenario you read about, but your intuition that there is a second layer to it (the "grain" or "granularity" of the questions) is also theoretically precise.

  Here is the carving you asked for: what this is, why the asymmetry exists, and where the boundaries lie.

  ### 1. The Name and the Mechanism

  The core phenomenon is the **Doctrinal Paradox**, often generalized in political science and economics as the **Discursive Dilemma**.

  However, your specific observation about splitting "Budget" into "Salaries" and "Equipment" points to a deeper, related problem called the **Problem of Issue Individuation** (or the **Individuation Problem**) within **Judgment Aggregation Theory**.

  Here is the distinction:
  *   **The Doctrinal Paradox** describes the inconsistency between **Conclusion-Based Voting** (your single "Fund it?" question) and **Premise-Based Voting** (your multi-question ballot).
  *   **The Individuation Problem** describes the inconsistency *within* Premise-Based Voting when you change the granularity of the premises (splitting "Budget" into two lines).

  You are experiencing both simultaneously. The Doctrinal Paradox explains why the single question differs from the multi-question ballot. The Individuation Problem explains why a 3-line ballot might yield a different result than a 5-line ballot.

  ### 2. Why the "Single Question" is Different

  You mentioned: *"In our cases both ways of doing it are 'vote on the parts,' just at different grains."*

  Procedurally, this is the crux of the paradox.
  *   **Round 1 (Single Question):** This is **Conclusion-Based Aggregation**. You are aggregating *judgments on the outcome*. Even if voters internally weigh the parts, the math happens on the final verdict.
  *   **Round 2 (Multi-Question):** This is **Premise-Based Aggregation**. You are aggregating *judgments on the criteria*, then deriving the verdict logically.

  Majority rule is not "systematic." It does not preserve logical consistency when moving from premises to conclusions.

  **The Math of Your Grant Committee (AND Logic):**
  To fund, you need $A \land B \land C \land D \land E$.
  *   **Conclusion Vote:** 4 people say "No." (Outcome: Reject).
  *   **Premise Vote:** On each individual line, a majority (3 out of 5) says "Yes." (Outcome: Accept).

  **Why?** Because the "No" voters are not the same people on every line.
  *   Voter 1 says No to Soundness.
  *   Voter 2 says No to Salaries.
  *   Voter 3 says No to Equipment.
  *   Voters 4 & 5 say Yes to everything.

  On the **Conclusion**, Voters 1, 2, 3, and 5 (wait, 5 is yes) — let's correct the coalition.
  If 4 people vote No on the conclusion, they believe at least one premise fails.
  But on the **Premises**, Voter 1 might vote Yes on Budget but No on Soundness. Voter 2 votes Yes on Soundness but No on Budget.
  When you vote on the **Conclusion**, you count the number of people who reject the *whole package*.
  When you vote on the **Premises**, you count the number of people who reject *each specific component*.
  If the opposition is **fragmented** (different people object to different parts), Premise-Based Voting favors **Acceptance** under AND logic.

  ### 3. The AND/OR Asymmetry

  You asked if the asymmetry you noticed (AND favors Yes when split; OR favors No when split) is real. **It is a real, structural feature.** It depends on how the majority coalitions overlap.

  **Case 1: The Grant (Conjunction / AND)**
  *   **Rule:** Pass only if *all* criteria pass.
  *   **Effect of Splitting:** Splitting criteria allows different minorities to block different things, *but* under majority rule, it allows different majorities to approve different things.
  *   **The Flip:** If the "No" votes are scattered (Voter 1 hates the science, Voter 2 hates the budget), a single "Fund?" vote captures all of them (4 No). But splitting the vote isolates their objections. Voter 1 is outvoted on the budget; Voter 2 is outvoted on the science. The "Yes" coalition becomes the union of overlapping majorities.
  *   **Result:** Premise-based voting makes it **easier to pass** when opposition is fragmented.

  **Case 2: The Condo (Disjunction / OR)**
  *   **Rule:** Pass if *any* criterion passes.
  *   **Effect of Splitting:** To pass via premises, you need a majority on *at least one* premise.
  *   **The Flip:** In your example, 3 people said "Yes" to hiring. But perhaps Voter 1 likes them because they are cheap (Budget). Voter 2 likes them because they are local (Prior Work). Voter 3 likes them for both.
  *   **Conclusion Vote:** 3 Yes vs 2 No. (Passes).
  *   **Premise Vote:**
      *   Budget: Only Voter 1 & 3 say Yes (2 votes). Fails.
      *   Prior Work: Only Voter 2 & 3 say Yes (2 votes). Fails.
  *   **Result:** Because the support was **fragmented** (different people liked it for different reasons), no single criterion commanded a majority. Premise-based voting makes it **harder to pass** when support is fragmented.

  **Summary of Asymmetry:**
  *   **AND + Fragmented Opposition** $\rightarrow$ Splitting favors **Yes**.
  *   **OR + Fragmented Support** $\rightarrow$ Splitting favors **No**.

  ### 4. The "Grain" Problem (Individuation)

  This is the most uncomfortable part of your discovery: *"Whoever drafts the ballot decides the outcome."*

  You asked if there is a "non-arbitrary finest grain." **There is not.** This is the **Problem of Issue Individuation**.

  Logical propositions can be subdivided indefinitely. "Budget is sufficient" can be split into "Salaries" and "Equipment." "Salaries" can be split into "PI Salary" and "Grad Student Salary." "PI Salary" can be split into "Summer" and "Academic Year."

  *   **Under AND logic:** The more you split the criteria, the more opportunities you create for the opposition to be fragmented across different lines, which (as shown above) tends to help the proposal pass via premise-based voting.
  *   **Under OR logic:** The more you split the criteria, the more you dilute the support for any single line, which tends to kill the proposal via premise-based voting.

  Because there is no "atomic" unit of a research proposal or a construction bid, the agenda-setter (the person writing the ballot) effectively chooses the logical topology of the decision. This is not just a voting flaw; it is a form of **soft power**.

  ### 5. Boundary Cases: When does it disappear?

  You asked for the cases where no way of slicing gives a coherent group answer. The paradox vanishes only under specific, rare conditions:

  1.  **Perfect Correlation (Single Peakedness):** If every voter who thinks the science is sound *also* thinks the budget is sufficient, and everyone who doubts the budget *also* doubts the science, the coalitions align. The "No" voters are the same people on every line. In this case, Premise-Based and Conclusion-Based voting yield the same result.
  2.  **Unanimity:** If everyone agrees on every premise, the paradox cannot arise.
  3.  **Dictatorship:** If one person's vote decides the outcome, logical consistency is preserved (because one mind is logically consistent).
  4.  **Supermajority (Your 4/5 attempt):** You noticed this forced consistency but biased toward "No." Mathematically, raising the threshold shrinks the "paradox zone." If you require a 100% vote (unanimity), the paradox disappears entirely, but you get gridlock. If you require a simple majority, the paradox zone is widest.

  ### 6. What to Blame (and What to Do)

  You asked whether to blame the voting rule, the question carving, or the lack of finest grain.
  **The blame lies in the combination of Majority Rule + Logical Connectives.**

  Majority rule is not a "truth tracker"; it is a coalition counter. It does not respect logical consequence. When you impose logical consequence (AND/OR rules) on top of majority counting, you create the inconsistency.

  **Practical Recommendations:**

  1.  **Acknowledge the Power:** Accept that the committee chair or secretary who drafts the ballot holds veto/approval power. This should be a rotating role or subject to committee approval.
  2.  **Standardize the Grain:** You cannot find the "true" grain, but you can agree on a **conventional** grain. Write into your handbook: *"Budget will be voted on as a single line item,"* or *"Criteria will always be limited to the three handbook categories."* This removes the agenda-setter's ability to manipulate the outcome via splitting.
  3.  **Choose Your Aggregation Method Explicitly:**
      *   If you value **Collective Responsibility** (we all stand by the final decision), use **Conclusion-Based Voting** (Single Question). This respects the "4-1 against" intuition.
      *   If you value **Accountability on Criteria** (we must ensure the money is safe), use **Premise-Based Voting** (Multi-Question). This respects the "3-2 on budget" intuition.
      *   *Do not switch between them ad hoc.*
  4.  **The "Two-Thirds" Compromise:** Your experiment with 4/5 threshold showed that supermajorities reduce the paradox. A 2/3 threshold is often the "sweet spot" in social choice theory where the likelihood of cyclical or inconsistent majorities drops significantly without guaranteeing gridlock.

  ### Summary Definition

  If you need to name this in a report or discussion:

  > **The Discursive Dilemma with Issue Individuation.**
  > *Definition:* A voting inconsistency where the collective outcome depends on whether the group aggregates judgments on the final conclusion or on the constituent premises, compounded by the fact that the outcome further depends on the arbitrary granularity with which those premises are defined.
  > *Key Feature:* Under AND logic, finer granularity favors acceptance if opposition is fragmented; under OR logic, finer granularity favors rejection if support is fragmented.

  You haven't been sloppy. You've identified that your committee's decision rule is mathematically incomplete. The "instability" you feel is the system telling you that "Majority Will" is not a single, coherent thing when logic is involved.
