          *   Consensus/Deliberation (change votes, don't just count them).
          *   Randomization (not practical).
          *   Accept the inconsistency (dangerous).
      *   **Boundary Cases:** When does it disappear? When voters are perfectly correlated (everyone who likes A also likes B) or when the group is unanimous.

  6.  **Refining the "Courtroom" Distinction:**
      *   User says: "In our cases both ways of doing it are 'vote on the parts,' just at different grains."
      *   My counter: In the "Single Question" round, procedurally, you are *not* voting on the parts. You are voting on the conclusion. The voters *internally* use the parts, but the aggregation happens on the conclusion. In the "Five Question" round, the aggregation happens on the parts, and the conclusion is derived.
      *   This distinction is crucial. The paradox *is* the gap between aggregating premises vs. aggregating conclusions. The "grain" issue is a second-order paradox *within* the premise-based approach.

  7.  **Structure of the Answer:**
