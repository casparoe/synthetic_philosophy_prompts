          *   OR + Fragmented Support = PBV favors No (Paradox 2).
      *   **Root Cause:** It's not just the voting rule (Majority), it's the combination of Majority + Logical Connectives + Agenda Setting (Granularity).
      *   **Solutions/Mitigation:**
