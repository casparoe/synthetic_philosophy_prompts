answer: |-
  Your intuition is spot on. Your roommate has grasped the *spirit* of Gould and Lewontin's famous 1979 paper, "The Spandrels of San Marco and the Panglossian Paradigm," but has hardened several nuanced arguments into rigid dogmas that Gould and Lewontin (G&L) explicitly rejected.

  Here is a breakdown of what is accurate, what is a misrepresentation (especially regarding co-option), and why the dismissal of evolutionary psychology doesn't logically follow.

  ### 1. The Accurate Parts: Adaptationism and "Just-So Stories"
  Your roommate is correct on the foundational critique.
  *   **The Argument:** G&L argued that evolutionary biologists often suffer from "pan-selectionism"—the default assumption that every trait exists because it was naturally selected for a specific function.
  *   **The "Just-So" Critique:** They borrowed Rudyard Kipling's term to describe adaptationist explanations that are plausible but untestable. If you assume a trait *must* be an adaptation, you can invent a story for anything (e.g., "Why do rhinos have horns? To charge enemies." "Why do rhinos have two horns? To charge enemies twice as hard."). G&L argued that without testing alternative hypotheses (like genetic drift or structural constraint), these are merely storytelling, not science.
  *   **The Spandrel Analogy:** The architectural analogy is accurate. In San Marco cathedral, the triangular spaces (spandrels) are necessary byproducts of mounting a dome on arches. You didn't select for the triangles; you selected for the dome and arches, and the triangles came along for the ride.

  ### 2. The Major Error: Spandrels and Co-option
  This is the most significant factual error in your roommate's summary.
  *   **Roommate's Claim:** "Spandrels can never get co-opted for a new adaptive use."
  *   **G&L's Actual View:** **This is false.** Gould explicitly argued the opposite.
      *   In the 1979 paper, G&L note that once a spandrel exists, it *can* become useful. In the cathedral, the spandrels were originally structural byproducts, but architects quickly realized they were perfect triangular canvases for mosaics. They were co-opted for art.
      *   **Exaptation:** Gould (along with Elisabeth Vrba) formalized this in a 1982 paper titled *"Exaptation: A Missing Term in the Science of Form."* They defined an **exaptation** as a trait that originated as a byproduct (spandrel) or for one function, and was later co-opted for a new function.
      *   **Biological Example:** Feathers likely evolved for thermoregulation or display (a byproduct or different adaptation) and were later co-opted for flight. Under your roommate's logic, flight would be impossible to explain via spandrels. Under Gould's logic, flight is an exaptation of a spandrel.

  **Correction:** Spandrels start as non-adaptive byproducts, but they **can** become adaptive later through co-option.

  ### 3. The Logical Leap: "Some are Spandrels" $\rightarrow$ "Most are Spandrels"
  Your roommate jumps from "adaptationism is a bias" to "functional-looking traits are probably spandrels."
  *   **G&L's View:** They did not argue that *most* traits are spandrels. They argued that the *possibility* of a trait being a spandrel is too often ignored. They wanted a pluralistic approach where adaptation is one hypothesis among several (including constraint, drift, and byproduct), not the default.
  *   **The Error:** Flipping the bias. Assuming everything is an adaptation is bad science; assuming everything is a spandrel is equally bad science.

  ### 4. The Dismissal of Evolutionary Psychology
  Your roommate claims that because spandrels exist, evolutionary psychology (EP) claims about language are "automatically wrong." This is a logical non-sequitur.
  *   **Methodology vs. Conclusion:** G&L's critique is methodological. They are saying: "You cannot *assume* language is an adaptation without ruling out that it is a byproduct of general brain complexity." They are not saying: "Language *is* a byproduct."
  *   **Gould's Personal View:** It is true that Gould personally leaned toward the Chomskyan view that language might be a byproduct of increased brain size and complexity (a spandrel), rather than a direct adaptation for communication. However, he maintained this was a hypothesis to be tested, not a proven fact derived from the existence of spandrels.
  *   **The Logic Gap:** Even if we grant that spandrels exist, it does not prove language is one. To dismiss EP "automatically" is to commit the same sin G&L accused adaptationists of: deciding the answer before testing the evidence.

  ### Summary for Your Roommate
  You can tell your roommate his summary is a "caricature" of the argument. Here is the corrected version:

  1.  **Don't assume function:** Just because a trait looks useful doesn't mean it was selected for that use. It might be a byproduct (spandrel) of something else.
  2.  **Test the story:** Adaptationist explanations must be tested against null hypotheses (like drift or constraint), not just accepted because they sound plausible ("just-so stories").
  3.  **Co-option is real:** A trait can start as a useless spandrel and later be co-opted for a function (exaptation). Spandrels are not permanently useless.
  4.  **Keep an open mind:** We cannot automatically assume language (or any trait) is a spandrel. We must investigate whether it is an adaptation, a spandrel, or an exapted spandrel.

  **Verdict:** Your roommate correctly identified the critique of "just-so stories," but incorrectly turned the spandrel concept into a dogma that forbids co-option and automatically invalidates adaptationist hypotheses. Gould would have criticized your roommate's summary almost as harshly as he criticized the adaptationists.
