prompt: |-
  My roommate summarized Gould and Lewontin's spandrels critique for me like this: they argued that lots of traits aren't adaptations but spandrels—structural byproducts of other evolutionary changes, like the triangular spaces between arches. He said this means adaptationist explanations are usually just-so stories, since you can always cook up a function for any spandrel after seeing it. He also claimed that spandrels can never get co-opted for a new adaptive use, so when evolutionary psychologists say language is an adaptation they're automaticly wrong—language is probably just a spandrel of bigger brains. Something feels off about jumping from "some traits are spandrels" to "functional-looking traits are probably spandrels", and also about saying spandrels stay useless forever. Is this a fair summary? Which parts are accurate to what Gould and Lewontin actually argued, where are the subtle misrepresenations—especially the bit about co-option being impossible—and does his dismissal of evolutionary psychology actually follow even if we grant the spandrels point?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Gould and Lewontin's "Spandrels of San Marco" critique (1979).
      *   **Roommate's Summary:**
          1.  Many traits aren't adaptations but spandrels (byproducts).
          2.  Adaptationist explanations are usually "just-so stories" (post-hoc rationalizations).
          3.  Spandrels can *never* get co-opted for new adaptive use (exaptation is impossible for spandrels).
          4.  Therefore, evolutionary psychology claims (e.g., language as adaptation) are automatically wrong; language is likely a spandrel of bigger brains.
      *   **User's Intuition:** Something feels off about jumping from "some are spandrels" to "most functional-looking traits are spandrels," and about spandrels staying useless forever. Also doubts the dismissal of Evo Psych follows logically.
      *   **Task:** Evaluate the accuracy of the roommate's summary, identify misrepresentations (especially regarding co-option), and assess the logic regarding evolutionary psychology.

  2.  **Deconstruct the Roommate's Claims vs. Gould & Lewontin (G&L) Actual Arguments:**

      *   *Claim 1: Traits aren't adaptations but spandrels (byproducts).*
          *   **G&L View:** They argued that adaptationism is a *default assumption* that often ignores other evolutionary forces (drift, constraint, byproduct). They didn't say *most* traits are spandrels, but that the *possibility* is too often ignored.
          *   **Verdict:** Partially accurate, but exaggerated in the roommate's version ("lots of traits" vs. "don't assume all are adaptations").

      *   *Claim 2: Adaptationist explanations are usually just-so stories.*
          *   **G&L View:** This is a core part of their critique. They criticized the tendency to invent plausible stories without testing alternatives (null hypotheses).
          *   **Verdict:** Accurate. This is the famous "just-so story" critique.

      *   *Claim 3: Spandrels can never get co-opted for a new adaptive use.*
          *   **G&L View:** **Major Error.** Gould (later with Vrba) explicitly developed the concept of *exaptation*. A spandrel (byproduct) can absolutely be co-opted later for a function. The architectural spandrel was painted with icons; biologically, a byproduct can become adaptive.
          *   **Verdict:** False. This is a critical misunderstanding of the theory.

      *   *Claim 4: Therefore, Evo Psych claims (language) are automatically wrong.*
          *   **G&L View:** They were skeptical of "pan-selectionism," but they didn't say specific claims are *automatically* wrong. They said they need rigorous testing against null hypotheses (like constraint or byproduct).
          *   **Logic:** Even if spandrels exist, it doesn't prove a specific trait *is* a spandrel. It just means you can't assume it's an adaptation.
          *   **Verdict:** Logical fallacy (Non Sequitur/Hasty Generalization).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. Yes, the roommate's summary is a mix of accurate critique and significant misunderstanding.
      *   **Point 1: The Core Critique (Adaptationism & Just-So Stories):**
          *   Acknowledge this is the strongest part of the roommate's summary. G&L *did* argue that adaptationism is a pervasive bias and leads to unfalsifiable storytelling.
          *   Nuance: G&L didn't say adaptations *don't exist*, just that they aren't the *only* explanation.
      *   **Point 2: The Definition of Spandrels (Architectural Analogy):**
          *   Confirm the architectural analogy is correct (triangular spaces between arches).
          *   Clarify: A spandrel is a necessary byproduct of a design, not selected for itself.
      *   **Point 3: The Big Error (Co-option/Exaptation):**
          *   **Crucial Correction:** This is the biggest factual error. Gould explicitly argued the opposite later (Exaptation, 1982 paper with Vrba).
          *   Explain the process: Trait arises as byproduct $\rightarrow$ Environment changes $\rightarrow$ Trait gets co-opted for function.
          *   Example: Feathers (thermoregulation/display $\rightarrow$ flight), or the architectural spandrels (structural necessity $\rightarrow$ canvas for art).
      *   **Point 4: The Leap to Evolutionary Psychology:**
