      *   *Analects 12.19 (Wind and Grass):* Ji Kangzi asked about government. Confucius said: "To govern is to correct. If you set an example by being correct, who would dare to remain incorrect?" (Wait, that's 12.17). Let's check 12.19.
          *   *Correction:* 12.19 is indeed Ji Kangzi asking about government. Confucius says: "The virtue of the gentleman is like wind; the virtue of the small man is like grass. Let the wind blow over the grass and it is sure to bend."
          *   *Meaning:* Moral influence flows from above. It's transformative, not coercive.
      *   *Analects 13.6 (Correct Yourself):* "If a man can correct himself, what difficulty will he have in assisting in government? If he cannot correct himself, how can he correct others?" (Also related to 13.13: "If names be not correct...")
      *   *Synthesis:* The "Wind" isn't force; it's *de* (virtue/charisma). The "Grass" bends not because it's crushed, but because it resonates. The ruler's self-cultivation *is* the governance. There is no dichotomy between "top-down shaping" and "internal cultivation." They are the same mechanism.

  3.  **Evaluate "Recursive Role Ethics":**

      *   *User's Definition:* Self distributed across social positions. Collectivism = Individualism with more nodes.
