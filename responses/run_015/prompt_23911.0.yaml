answer: |-
  In a regional hospital, administrators aim to release only fully healed trauma patients, using a daily nurse-assessed mobility score as a proxy for underlying physiological repair. Because assessments fluctuate due to unavoidable noise like nurse fatigue and patient morning stiffness, the score is an imperfect estimate of true recovery. The hospital implements a policy where only patients scoring above 90% are cleared for discharge, assuming this threshold guarantees safety. Over time, the average readmission rate for these cleared patients rises, because the selection process systematically captures individuals whose high scores were driven by temporary favorable noise—such as an unusually energetic morning or a lenient evaluator—rather than durable health, causing their true recovery status to regress toward the mean once they leave the supervised environment.

  **The Selection Step:** The effect is produced exactly at the filtering stage where administrators condition on **Score > 90%**. By selecting only the extreme upper tail of the observed distribution, you disproportionately select cases where the *noise component* of the score was positive and large.

  **Why This Is Statistical (Regressional) Goodhart:** This is the statistical version because the divergence between the metric (mobility score) and the goal (physiological repair) occurs without any agent changing their behavior to exploit the rule. The nurses are not inflating scores, and patients are not faking mobility; the decoupling happens purely because $Observed = True + Noise$, and selecting for high $Observed$ mathematically biases the sample toward high $Noise$. In the incentive version, the act of measuring changes the causal structure (e.g., nurses rush patients to walk only during assessments, worsening long-term healing); here, the causal structure remains static, but the conditional expectation $E[True | Observed > Threshold]$ is lower than $Observed$.

  **Conditions for Causal Goodhart:** For this setup to become causal Goodhart, the target must incentivize a behavior that increases the proxy while decreasing or stagnating the goal. For example, if nurses knew discharge depended on the score, they might administer short-acting painkillers before assessment to boost mobility scores, which masks pain signals necessary for safe recovery, actively harming the goal while raising the metric.

  **Feature Doing the Work:** The feature driving the statistical effect is **variance (noise)** in the proxy relative to the signal. Specifically, it requires the correlation between proxy and goal to be less than 1.

  **Perfect Accuracy Test:** If you make the proxy perfectly accurate (noise = 0, correlation = 1), the effect **does not survive**. If $Score = True\_Recovery$, then selecting for $Score > 90\%$ is identical to selecting for $True\_Recovery > 90\%$, and no regression occurs because there is no noise component to regress.
