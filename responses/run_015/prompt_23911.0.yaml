      *   *Goal:* Patient recovery speed.
      *   *Proxy:* Daily mobility score (noisy due to nurse subjectivity or patient bad days).
      *   *Selection:* We only discharge patients who hit a high mobility score threshold.
      *   *Outcome:* The discharged patients seem to have high mobility, but their actual underlying recovery is weaker than expected because the score was inflated by temporary factors (noise).
      *   *Constraint:* One paragraph. No AI. No lab.
      *   *Draft:* In a busy urban hospital, administrators want to identify patients fully recovered enough for discharge, using a daily nurse-assessed mobility score as a proxy for underlying physiological healing. Because assessments vary based on nurse fatigue and patient morning stiffness, the score is a noisy estimate of true recovery. The hospital implements a policy where only patients scoring above 90% are cleared for release, assuming this guarantees safety. Over time, the average readmission rate for these "cleared" patients rises, because the selection process systematically picks individuals whose high scores were driven by temporary favorable noise—like an unusually energetic morning or a lenient evaluator—rather than durable health, causing their true recovery status to regress toward the mean once they leave the supervised environment.

  4.  **Identifying the Selection Step (Task 2):**
      *   The step is: "Only patients scoring above 90% are cleared."
      *   This selects for $Proxy = True + Noise > Threshold$.
      *   When $Proxy$ is high due to high $Noise$, $True$ is likely lower than $Proxy$.

  5.  **Distinguishing Statistical vs. Incentive (Task 3):**
      *   *Statistical:* The patients and nurses aren't trying to cheat. The noise is inherent (fatigue, stiffness). The effect comes from conditioning on the extreme value of the sum of signal + noise.
      *   *Incentive:* Nurses would need to inflate scores intentionally, or patients would fake mobility. The prompt specifies "nobody's gaming it."

  6.  **Defining Causal Goodhart (Task 4):**
      *   For it to be causal/incentive Goodhart, the act of measuring/targeting must *change* the underlying reality.
      *   Example: Nurses start helping patients walk *only* during assessment times, or patients take painkillers just before assessment to boost the score, potentially harming long-term recovery. The metric causes the behavior change that decouples metric from goal.

  7.  **Identifying the Feature Doing the Work (Task 5):**
      *   The feature is the *noise* (variance) in the proxy relative to the signal. Specifically, the imperfect correlation between proxy and goal.

  8.  **Perfect Accuracy Test (Task 6):**
      *   If the proxy is perfectly accurate (Noise = 0), then $Proxy = True$.
      *   Selection on $Proxy > T$ implies $True > T$.
      *   Regression to the mean disappears (regarding the signal/noise split).
