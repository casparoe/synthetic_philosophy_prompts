      *   **Task 6:** Answer whether the effect survives if the proxy is perfectly accurate.
      *   **Constraints:** One paragraph for the scenario. Clear distinction between versions. No AI/lab settings.

  2.  **Deconstruct Goodhart's Law Variants:**
      *   *Standard/Incentive Goodhart:* "When a measure becomes a target, it ceases to be a good measure." People game the system. (Lucas Critique style).
      *   *Statistical/Regression Goodhart:* Selecting on a noisy proxy leads to selecting outliers where the noise is favorable, causing the true value to regress to the mean. (Campbell's Law sometimes overlaps, but specifically the statistical artifact described by Manheim & Garrabrant or the original Goodhart context regarding monetary targets). The prompt asks for the "selection on a noisy proxy" version.

