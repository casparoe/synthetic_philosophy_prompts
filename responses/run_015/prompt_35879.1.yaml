answer: |-
  **The Integrity Objection: The Conduit Problem**

  Let's start with the integrity objection, but I want to steer clear of the "demandingness" reading you mentioned. Williams argues that utilitarianism doesn't just ask a lot of you; it attacks the source of your agency. He says it reduces the person to a mere conduit for the satisfaction of everyone else's preferences, so that nothing is ever just *theirs* to do.

  If my projects and commitments are only valuable insofar as they feed into the global utility function, haven't I lost the very perspective from which I could choose to be a utilitarian in the first place? Is there any room left for *my* life, or am I just a satellite orbiting the general good?

  **The Drowning Wife: One Thought Too Many**

  I want to move to the specific case of the drowning wife. A man's wife is drowning, and so is a stranger. He saves his wife. Williams says if he justifies this by thinking, "She's my wife," that's fine. But if he thinks, "She's my wife, *and* utilitarianism permits me to prioritize spouses," that is one thought too many. It corrupts the relationship by inserting the theory into the intimacy.

  When that husband reaches for the utilitarian justification in the moment of rescue, have you lost something essential about what it means to love someone?

  *[Follow-up: The Criterion vs. Decision Procedure Move]*
  I anticipate your reply will be the standard distinction between the *criterion* of rightness and the *decision procedure*. You'll likely say the utilitarian deliberates with the "wife-thought" because that maximizes utility, and only the theory evaluates from the outside.

  But does this distinction actually solve the alienation, or does it just hide it? If the only reason I'm allowed to have that "wife-thought" is because the theory permits it as a heuristic, haven't I still adopted the standpoint of the theory *about* my thought, even if I'm not thinking it consciously? Am I not still treating my love as a tool?

  **The Structure of the Defect: Motivation vs. Justification**

  This brings me to a distinction I want to press on, because I think it's where the rubber meets the road. There seems to be a difference between the extra thought being "too many" in the *justification* versus it being too many in the *motivation*.

  Is the utilitarian in trouble only if the wife-thought is what the rescue is done *for*? Or is the problem upstream, in what licenses the action? If the husband saves her simply because he loves her, but the *truth* of the matter is that utility allowed it, is his deliberation defective, or is his action morally lucky?

  *[Follow-up: Locating the Error]*
  To put it sharper: On your view, where exactly does the error lie if he *does* think the utilitarian thought? Is his deliberation irrational? Is the action itself wrong? Or is it just that a utilitarian bystander would assess it differently than he should assess it himself? I need to know if the theory condemns his psychology or just his philosophy.

  **The Identical Outcome Case: The Coin Flip**

  Let's tighten the screws on that decision procedure defense. Imagine a version of the case where the wife and the stranger are both drowning, the rescue costs the same, and the outcomes on every utilitarian metric are *literally* identical. Future happiness, ripple effects, everything is a wash.

  In that scenario, can you say it is merely *permissible*, not required, for the husband to flip a coin? Or does common sense demand he save the wife?

  *[Follow-up: The Grounding Problem]*
  If you say he is *required* to save the wife in that identical-outcome scenario, what in your theory makes that work? It can't be the utilities, because we stipulated they are equal. And the "decision procedure" move can't help here, because this isn't about how he deliberates; it's about the *verdict*. If the verdict requires saving the wife, you've smuggled in a non-utilitarian ground. If the verdict says "flip a coin," you've abandoned the intuition that makes the wife case work. Which is it?

  **Alienation and the "Impartiality" Deflection**

  You've argued in the past that Williams only showed utilitarianism is alienating in the sense that *all* impartial theories are, so it's not a special problem for you. You suggest that any moral theory requires stepping outside oneself.

  But isn't there a difference between a theory that asks me to transcend my perspective occasionally, and a theory that requires me to view my own commitments as expendable by default? Is the alienation really the same if the theory says "your projects matter" versus "your projects matter only until they don't"?

  *[Follow-up: The Surrogate Parent Problem]*
  This leads to the "surrogate-parent" vibe of the indirect strategy. If the best way to maximize utility is to raise children to be non-utilitarians—to have deep, non-negotiable commitments that the theory itself views as contingent—doesn't that show the theory wants adherents who can't accept it?

  Do you view that as a cost? Or are you comfortable with a moral architecture where the theory is true, but the best people are the ones who don't believe it?
