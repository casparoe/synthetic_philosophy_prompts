  2.  **Deconstruct the Argument Chain:**
      *   (1) Provenance Condition: Responsibility for action requires responsibility for the character/motives producing it. (Ultimate Responsibility).
      *   (2) Only-by-Making Condition: Responsibility for character requires intentional self-formation under control.
      *   (3) Regress: Self-formation requires prior motives, requiring prior responsibility, ad infinitum.
      *   (4) Conclusion: No moral responsibility (finite agents can't complete infinite regress; indeterminism doesn't help).
      *   (5) Generalization: This applies to *all* normative standings (epistemic, agency, etc.).
      *   (6) Self-Defeat: The argument undermines its own assertion.
      *   (7) Reductio: Therefore, (1)-(4) must be flawed.
      *   *Dana Case:* Gradual self-reformation over 40 years. No single act of creation, but continuous endorsement and shaping.

  3.  **Evaluate Each Step & Price the Repairs:**

      *   **Step (1) - Provenance Condition:**
          *   *Plausibility:* It captures the intuition that luck (constitutive luck) shouldn't determine blame. If I'm good just because I was born good, why praise me?
          *   *Cost of Rejection:* If we reject (1), we accept "constitutive luck." We blame/praise people for traits they didn't choose. This feels unfair but saves moral practice. It moves us toward a "forward-looking" or "social functional" view of responsibility rather than a "desert-based" view.
          *   *User's Attachment:* High. Rejecting this hurts their core intuition about fairness.

      *   **Step (2) - Only-by-Making Condition:**
