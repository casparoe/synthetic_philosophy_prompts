          *   *Cost of Rejection:* We need an alternative account of ownership. Perhaps "identification" (Frankfurt), "reasons-responsiveness" (Fischer & Ravizza), or "historical continuity" (the Dana case). Rejecting (2) means accepting that you can own a character trait without having *created* it ex nihilo, provided you sustain/endorse it.
          *   *User's Attachment:* Low. This is the likely candidate for modification.

      *   **Step (3) - The Regress:**
          *   *Plausibility:* Logical consequence of (1) + (2). If every act needs prior responsible motives, and those need prior responsible motives...
          *   *Cost of Modification:* We need to stop the regress without a "first cause." This implies a coherentist or holistic model of agency (like the Dana case). The cost is giving up the "Archimedean point" of self-creation. We accept that agency is always embedded in a history we didn't fully choose.
          *   *Dana Case Role:* The Dana case attacks (3)'s implication that the regress *must* be vicious. It suggests a "long way round" where responsibility accumulates through continuity and endorsement, not a singular founding act.

      *   **Step (4) - Conclusion:**
          *   *Plausibility:* Follows from (3).
          *   *Cost of Rejection:* If we keep (1)-(3) but reject (4), we are contradicting logic. So (4) falls if any prior step falls.

      *   **Step (5) - Generalization:**
          *   *Plausibility:* The structure looks formal and content-neutral.
          *   *Cost of Blocking:* We need to find a relevant difference between *moral desert* and *epistemic justification* or *agency*. The friend's suggestion (source vs. state) is weak unless defined. Epistemic justification might be about *current* fit with evidence, not historical origin (externalism vs. internalism). Moral desert seems inherently historical.
          *   *User's Concern:* If (5) holds, the argument is self-defeating.

  4.  **Analyze the Dana Case:**
      *   Does Dana satisfy (1)? Yes, she owns the character at 60.
      *   Does she satisfy (2)? No, not in the strict "intentionally brought it about... in an act of self-formation" sense if that implies a *tabula rasa* starting point. But she *did* intentionally bring it about over time.
      *   *Diagnosis:* The Dana case exposes an ambiguity in (2). Is "making" a singular event or a process? If it's a process, the regress might be benign (coherentist) rather than vicious (linear foundationalist).
      *   *Implication:* It suggests (2) is too strong. It demands *Ultimate* Responsibility (UR) rather than *Ordinary* Responsibility.

  5.  **Address the Friend's Distinction (Source vs. State):**
      *   Friend says: Desert is source-involving; Justification is state-involving.
      *   Critique: Why? Epistemic internalists care about history (how you got the belief). Externalists don't. Moral responsibility usually cares about history.
      *   *Refinement:* The distinction might be between *constitutive* norms (what makes a belief justified *now*) vs. *genealogical* norms (what makes an agent praiseworthy). But Strawson argues genealogy is required for praise.
      *   *Verdict:* The distinction is shaky unless tied to specific theories of justification (e.g., process reliabilism vs. deontology).

  6.  **Synthesize the "Pricing" of Repairs:**

      *   *Repair A: Reject (1).*
          *   *Cost:* Abandon deep desert. Accept constitutive luck. Responsibility becomes about social regulation, not metaphysical fairness.
      *   *Repair B: Reject/Modify (2).* (Most promising given User's attachment).
          *   *Cost:* Redefine "ownership." Move from "Creation" to "Sustenance/Endorsement." Accept that the *materials* of agency are given, but the *structure* is ours. Risk: Still vulnerable to the claim that the capacity to endorse was itself unchosen.
      *   *Repair C: Modify (3) (The Regress).*
