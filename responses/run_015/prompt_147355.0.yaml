answer: |-
  This is a sharp observation, and it cuts to the bone of why modern criminal law feels so schizophrenic. You've identified the gap between *theory* (we are liberal individualists) and *practice* (we are still tribal moralists).

  Here is the breakdown of the philosophical commitments your lawyer is up against, followed by the "change my mind" conditions and my own epistemic limitations.

  ### 1. The Philosophical Commitments of Selective Enforcement

  You are right that this isn't pure Devlin. If it were pure Devlin (legal moralism), the state would ban drugs, gambling, and homosexuality with equal vigor, because all violate a traditional shared morality. The fact that liberal democracies have dropped those but kept incest suggests a shift from **Morality as Virtue** to **Morality as Structure.**

  Here are the three commitments the state is actually making:

  **A. Legal Expressivism over Consequentialism**
  The state is no longer arguing that consensual adult incest causes *empirical* harm (like heroin does). It is arguing that the law has an *expressive function*. By criminalizing the act, the state is making a speech act: "The family unit is a hierarchy, not a marketplace of partners."
  *   **The Commitment:** The law exists to codify social meanings, not just prevent physical injury. If the law stays silent on incest, it expresses indifference to the boundary between parent/child or sibling/sibling.
  *   **For your novel:** The prosecutor isn't arguing about trauma; they are arguing about *semantics*. "If we allow this, the word 'father' loses its meaning."

  **B. The "Wisdom of Repugnance" (Disgust as Epistemology)**
  This is the Leon Kass argument. It posits that disgust is not just an emotion but a deep, evolutionary signal of boundary violation.
  *   **The Commitment:** Disgust tracks moral truth better than reason does. Even if the couple is using contraception and there is no coercion, the *visceral reaction* of the public is treated as evidence of a metaphysical wrong.
  *   **For your novel:** This is where the "social disgust" you mentioned becomes a legal argument. The prosecutor argues that the jury's nausea is a form of data.

  **C. Institutional Integrity vs. Individual Liberty**
  Liberalism prioritizes the individual. But incest laws prioritize the *institution* of the family.
  *   **The Commitment:** The family is a pre-political institution that the state must protect from itself. Even if two adults consent, the *roles* they occupy are owned by society, not them. You cannot consent to dissolve the structural boundary of kinship.
  *   **For your novel:** The lawyer is fighting a structuralist argument. The state claims ownership of the "sibling" category.

  ### 2. Is Collective Disgust a Form of Harm? (The Hart Problem)

  You asked if treating collective disgust as harm is consistent with Hart's Harm Principle.
  **Short answer:** No. It breaks Hart.
  **Long answer:** It requires redefining "harm" to include "normative erosion."

  Hart argued that law should prevent harm to *others*. If the "harm" is merely that people feel icky or that society feels "looser," Hart would reject that. However, modern legal theorists (like Joel Feinberg) introduced the **Offense Principle**. This allows prohibition not just of harm, but of profound offense to public sensibilities.

  But to make it fit Hart, the state often argues a **Slippery Slope Harm**:
  *"If we normalize sibling sex, we erode the taboo that protects children from predatory parents. We cannot distinguish the harmless adult case from the harmful coercive case, so we must ban all of it to prevent the harm to minors."*

  This is a **proxy ban**. They aren't punishing the adult couple for what *they* did; they are punishing them to maintain a firewall that protects vulnerable people elsewhere. It treats the adult couple as a means to a social end, which is deeply illiberal.

  ### 3. What Would Change My Mind?

  You asked for straight talk on what evidence would justify the ban. As an AI trained on liberal democratic norms, my default position aligns with Hart/Mill: private, consensual acts between adults are not the law's business. To shift me toward the Devlin/Kass position, I would need one of the following:

  1.  **Empirical Evidence of Inevitable Coercion:** If data showed that "consensual" adult incest is statistically indistinguishable from grooming or long-term coercion in 95%+ of cases, the ban becomes a protective measure (like banning boxing to prevent CTE, even if consensual). If the power dynamic is *inherently* unbalanceable, consent is a fiction.
  2.  **Systemic Externalities:** If it could be proven that allowing adult incest measurably increases rates of child sexual abuse within the general population (by degrading the taboo), the "proxy ban" argument holds water. Currently, this is theoretical, not empirical.
  3.  **The "Public Good" Argument:** If we abandon liberalism entirely and admit that social cohesion is more valuable than individual autonomy. If you can convince me that a society without this taboo collapses faster than a society that bans heroin, the Devlin argument wins.

  **Without that evidence, the ban rests on "Magic."** It assumes a metaphysical harm (sin/taboo) rather than a material one.

  ### 4. Where My Reasoning Is Likely Failing (The "Reaching" Part)

  Here is where I might be wrong, or where my analysis is too clean for the messy reality of your novel:

  **A. I am over-intellectualizing the Legislature.**
  I am attributing deep philosophical commitments (Expressivism, Institutional Integrity) to laws that are often just accidents of history. Many incest statutes remain simply because no one has bothered to repeal them, not because there is a coherent theory behind them. Your lawyer might be fighting a ghost; the state might not have a reason other than "it's always been this way."

  **B. I am underestimating the "Genetic Harm" Proxy.**
  Even with contraception, the law often assumes the *potential* for genetic harm. While this doesn't apply to sterile couples or same-sex siblings, the law is a blunt instrument. It bans the *category* of act, not the specific instance. My analysis focuses on the moral philosophy, but the legal reality is often just bureaucratic laziness.

  **C. The "Liberal Democracy" Monolith.**
  I am treating "liberal democracies" as a single entity. They aren't. Germany (in the *Osho* case and others) has explicitly upheld incest bans based on Devlin-esque "protecting the family order," while other jurisdictions are more laissez-faire. The philosophical commitment varies by jurisdiction. Your lawyer's battle depends entirely on *which* liberal democracy this is.

  **D. The Disgust Heuristic.**
  I dismissed disgust as irrational bias. I might be wrong. Evolutionary psychology suggests disgust evolved to prevent pathogen transmission and inbreeding. If disgust is a hardwired "danger signal," ignoring it might be as reckless as ignoring pain. The failure in my reasoning is assuming that "modern reason" is superior to "ancient instinct." There is a case to be made that instinct sees risks reason hasn't calculated yet.

  ### Summary for Your Draft

  Your lawyer is fighting a war on two fronts:
  1.  **The Hart Front:** Arguing that no *harm* occurred, so the state has no jurisdiction.
  2.  **The Devlin Front:** Arguing that the state's claim of "protecting society's fabric" is a religious argument disguised as law.

  The prosecutor's strongest card isn't harm; it's **meaning**. They will argue that by decriminalizing this, the state makes the family unintelligible. Your lawyer's counter must be that the state does not own the meaning of human relationships.

  If you want the most tension, have the prosecutor admit there is no physical harm. Have them say: *"We are not punishing you for what you did. We are punishing you for what you represent."* That is the honest Devlin position, and it is terrifying.
