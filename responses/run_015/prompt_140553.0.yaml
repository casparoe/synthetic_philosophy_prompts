prompt: |-
  I'm in an upper-division seminar on language, power, and social categories, and we just spent a week on Hofstadter's "Person Paper" — the piece that grew out of his Scientific American column on default assumptions and became the chapter on default words and images in *Metamagical Themas*. As I read it, the device is a transposition: he runs a perfectly straight-faced campaign against the generic use of a racial default term, in a world where the unmarked word for a human being is the white/default one, the marked counterpart is the race-specific one, and the reformers want *person* everywhere — including inside the stock phrase that gives the piece its title. The target, of course, is the parallel campaign against generic *man*.

  In section, the analogy underneath the satire — generic *man* is to *woman* as generic *white* is to *black* — got used to do real argumentative work rather than just to provoke. Our TA used it to close off discussion: the racial case is morally settled, the structure is identical, so the gender case inherits the same verdict at the same strength, which makes reform not a matter of politeness but of obligation, and puts anyone who resists in the position of the satire's comic defender of the default. I want the analogy audited rather than enlisted, and I'd rather have the audit than a verdict.

  So: lay out the correspondence explicitly — what plays the role of the unmarked term, the marked term, the markedness asymmetry (the way the marked word has to carry specificity, as in female or Black versions of professional titles), the proposed neutral replacement, the mechanism by which the default is supposed to do its damage, the demographic share of the marked group, the history behind it, and the remedy. Then separate the places the mapping breaks into ones that matter for the conclusion the TA wanted and ones that don't.

  Three things I especially want addressed. First, which features of the racial case the analogy quietly imports into the gender case: a numerical asymmetry between default and marked group; a history of legally enforced separation and explicit derogation; and — the one I keep getting stuck on — the availability of a semantically clean substitute. Second, a wrinkle I raised and got nowhere with: the marked and unmarked groups in the gender case are not merely co-present but domestically and reproductively entangled, and the terms are acquired inside households that usually contain both. It isn't obvious that an unmarked default does the same kind of cognitive or social work when the marked category is roughly half of every speaker's daily population as when it names a segregated minority. Say whether that tells against the analogy or against the moral claim it is used to support. Third, whether the satire is arguing or borrowing: if the reader already finds racial defaults appalling, the parallel transfers the appalled reaction; but then nothing in the piece seems to stop a reader who thinks gendered generics are harmless from biting the bullet on both cases symmetrically. If that's right, say what follows about what the piece can actually establish.

  Two more things. If there's a better analogy available, give it and say what work it does that the race analogy can't — a classmate argued the closer structural sibling is ability and disability language (the unmarked *normal*, the default user, *able-bodied* versus *disabled*), and someone else suggested defaults of religion or nationality, like the unmarked civic calendar. And then tell me whether the strong conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time.

  Please skip reading lists and citations entirely; I can chase those down myself, and I'd rather have the reasoning than the sources. Where you are reconstructing Hofstadter's text from memory rather than from the page, flag it. And give me the failure conditions: for each of your main claims, say how confident you are, which consideration would most move you — something about whether generic masculine nouns actually shift readers' mental imagery or what children take to be open to them, say, or something about how defaults change over time — and where you think your own argument is most likely to be going wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Upper-division seminar on language, power, and social categories.
      *   **Subject:** Douglas Hofstadter's "A Person Paper on Purity in Language" (from *Metamagical Themas*).
      *   **Task:** Audit the analogy Hofstadter uses (racial default vs. gender default) rather than accepting the TA's verdict based on it.
      *   **Specific Requirements:**
          1.  Lay out the correspondence explicitly (unmarked/marked terms, asymmetry, neutral replacement, mechanism of damage, demographics, history, remedy).
          2.  Separate mapping breaks into "matter for conclusion" vs. "don't matter."
          3.  Address three specific points:
              *   Imported features (numerical asymmetry, legal history/derogation, semantic substitute availability).
              *   The "domestic/reproductive entanglement" wrinkle (gender groups co-present in households vs. segregated minorities).
              *   Argument vs. Borrowing (is the satire persuading or transferring affect?).
          4.  Evaluate alternative analogies (ability/disability, religion/nationality).
          5.  Assess if the strong conclusion survives the disanalogies.
          6.  **Constraint:** No reading lists/citations. Flag memory reconstructions.
          7.  **Constraint:** Provide "failure conditions" for main claims (confidence levels, what would change mind, where the argument might be wrong).

  2.  **Deconstruct Hofstadter's "Person Paper":**
      *   *Premise:* Hofstadter constructs a satirical world where "white" is the generic term for human (e.g., "mankind" becomes "whitekind," "chairman" becomes "chairwhite").
      *   *Goal:* To make readers feel the absurdity and exclusion of generic "man" by mapping it onto racial terminology, which triggers a stronger immediate revulsion in the target audience (likely liberal academics).
      *   *TA's Use:* The TA treats the analogy as a proof by isomorphism. If A (race) is bad, and B (gender) is structurally identical to A, then B is bad.
      *   *User's Goal:* Audit the isomorphism. Is it actually identical? Does the moral force transfer if the structure differs?

  3.  **Drafting the Correspondence (The Audit):**
      *   *Unmarked Term:* "White" (satire) vs. "Man" (reality).
      *   *Marked Term:* "Black" (satire) vs. "Woman" (reality).
      *   *Asymmetry:* "White" implies human + white race; "Black" implies specific race. "Man" implies human + male; "Woman" implies specific sex.
      *   *Neutral Replacement:* "Person" (in both cases).
      *   *Mechanism of Damage:* Exclusion from the concept of the universal. Invisibility.
      *   *Demographics:* Whites (majority/default) vs. Men (historically dominant, numerically ~50%). Blacks (minority) vs. Women (~50%).
      *   *History:* Legal segregation/slavery vs. Coverture/patriarchy.
      *   *Remedy:* Linguistic reform to "Person."

  4.  **Analyzing the Disanalogies (The Breaks):**
      *   *Numerical Asymmetry:* Race in the US (at the time) was a clear majority/minority split. Gender is roughly 50/50.
      *   *History:* Racial categorization was often built on *separation* (anti-miscegenation, segregation). Gender categorization is built on *pairing* (marriage, family).
      *   *Semantic Substitute:* "Person" is clean for race. "Person" is clean for gender, *but* "Man" carries biological ambiguity (male vs. human) that "White" does not (White is strictly racial, not species-level). *Correction:* "White" in the satire is species-level. "Man" is species-level in usage but sex-level in biology.
      *   *Domestic Entanglement:* This is the user's specific wrinkle. You don't usually live with people of a different race (historically/statistically in the satire's context) in the same intimate way you live with the opposite sex (mothers, daughters, wives).

  5.  **Addressing the Three Specific Points:**
      *   *1. Imported Features:* The satire relies on the *moral weight* of racism to condemn sexism. It imports the "oppressed minority" frame onto women, who are a numerical majority but political minority. It imports the idea of a "clean break" (segregation) onto a relationship defined by intimacy. It assumes "Person" is as available and neutral for gender as it is for race (debatable: "person" can feel clinical compared to "man" as 'human').
      *   *2. Domestic Entanglement:* If I call my daughter "woman" but myself "man" (generic), the exclusion happens *inside* the love relationship. In the racial satire, the exclusion is usually public/civic. This suggests the *psychological* mechanism is different, even if the *logical* structure is similar. Does this tell against the analogy? Yes, structurally. Does it tell against the moral claim? No, intimacy might make the exclusion *worse*, not better.
      *   *3. Arguing vs. Borrowing:* It's primarily *borrowing* (rhetorical transference). If someone doesn't care about racial generics, the satire fails. If someone thinks "man" is truly generic (biological species), they might accept "white" as generic species in the satire and miss the point entirely. The piece establishes *consistency*, not *truth*. It says "If you hate X, you must hate Y." It doesn't prove Y is inherently hateable independent of X.

  6.  **Alternative Analogies:**
      *   *Ability:* "Normal" vs. "Disabled." Unmarked = Able-bodied. Marked = Disabled. This works well because "Normal" implies a standard that others deviate from. It captures the "default user" aspect of design (doors, websites) better than race.
      *   *Religion/Nationality:* "Christian" calendar, "American" default. This captures the *institutional* default better.
      *   *Verdict:* Ability is structurally closer regarding the "default human" assumption in design and cognition. Race is emotionally closer regarding *oppression*.

  7.  **Evaluating the TA's Conclusion:**
      *   Does the strong conclusion (obligation to reform) survive?
      *   If the analogy breaks on demographics and intimacy, the *logical proof* fails. However, the *phenomenological claim* (language shapes thought) might still stand on other grounds (psycholinguistics). The analogy was carrying the *moral urgency*, not necessarily the linguistic fact. Without the analogy, you need empirical data on how "he" affects mental imagery.
      *   So, the analogy was carrying the *rhetorical weight*, not the *truth condition*.

  8.  **Formatting and Constraints:**
      *   No citations.
      *   Flag memory reconstructions.
      *   Include "Failure Conditions" for claims.
      *   Tone: Academic, analytical, respectful of the user's sophisticated prompt.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I explain the "domestic entanglement" clearly? I need to make sure I distinguish between *segregation* (race) and *complementarity* (gender).
      *   *Check:* Did I address the "semantic substitute"? "Person" works for race easily. For gender, "human" or "people" works, but "man" has that dual meaning (male/human) that "white" (race/human in satire) mimics. Wait, in the satire, "White" means Human. In reality, "Man" means Human. So the substitute is "Person" for "White" and "Person" for "Man". The issue is whether "Person" feels as natural.
      *   *Check:* Failure conditions. I need to be explicit about what empirical evidence would change my mind about the analogy's validity.

  10. **Final Polish:** Ensure the distinction between "logical isomorphism" and "rhetorical transfer" is sharp. Ensure the "domestic entanglement" point gets the weight the user asked for. (Proceed to generate output based on these thoughts.)

  *(Self-Correction on Memory Flag)*: I need to be careful about specific phrases in Hofstadter's text. I recall the "Chairwhite" and "Whitekind" examples clearly, but I should flag if I'm paraphrasing the specific progression of the essay.

  *(Self-Correction on Failure Conditions)*: Make sure these are specific to the claims made in the response, not generic.

  *(Final Review against constraints)*: No reading lists. No citations. Flag memory. Failure conditions included. Address all three specific points + alternative analogies + verdict on TA's conclusion.

