  Consequently, the dispute masks divergent norms regarding coercion and freedom. Side A argues that a loving God must minimize reasonable non-belief to ensure fair epistemic access, viewing hiddenness as a defect. Side B counters that overwhelming evidence constitutes epistemic coercion, violating the freedom required for love, viewing hiddenness as a feature. Thus, "evidence" functions differently: for Side A, it is public warrant for belief; for Side B, it is interpersonal availability for relationship. They are effectively answering two different questions—the rationality of theism versus the conditions for authentic disclosure—under the single heading of hiddenness.

  Genuine progress requires formally distinguishing the "Problem of Rational Non-Belief" from the "Problem of Relational Absence." If the debate acknowledges that God might permit reasonable non-belief to protect relational freedom, Side A's evidential argument loses its force against specific personalist theisms. Conversely, Side B must specify the minimal epistemic threshold required for relationship to avoid fideism. Without separating the telos of belief from the telos of communion, the dialogue remains a stalemate between incompatible frameworks assessing different divine aims.
