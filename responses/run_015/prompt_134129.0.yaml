answer: |-
  There is no single, canonical proper noun for this specific two-layer configuration (comparable to "The Trolley Problem" or "The Gettier Case"). However, your description maps precisely onto a recognized structural tension in normative ethics and decision theory that is usually discussed under the intersection of three distinct concepts: **The Cluelessness Objection**, **Higher-Order Normative Uncertainty**, and **The Normative Analog to the Problem of the Criterion**.

  If you were to introduce this into a philosophical discussion, the most precise existing label is **"Second-Order Cluelessness,"** though it is often subsumed under discussions of **Procedural Regress**.

  Here is the breakdown of how the field carves out this distinction, the terminology that captures it, and where its boundaries lie.

  ### 1. The Existing Terminology
  While there is no single name, your "Layer 1" and "Layer 2" correspond to established debates:

  *   **Layer 1 (The Failure to Calculate):** This is known in the literature as **The Cluelessness Objection**. Coined prominently by James Lenman (2000) and expanded by Hilary Greaves (2016), it argues that consequentialist agents are "clueless" about the long-term effects of their actions, rendering the maximization of value impossible.
  *   **Layer 2 (The Failure to Choose the Shortcut):** This is where your insight exceeds the standard discussion. In decision theory, this is a form of **Higher-Order Uncertainty** (uncertainty about the correct decision model itself). In epistemology, it is structurally identical to **The Problem of the Criterion** (Roderick Chisholm). Chisholm asked: *To know which beliefs are true, we need a criterion; but to know which criterion is valid, we need true beliefs.* You are describing the **Normative Analog to the Problem of the Criterion**: *To choose the right act, we need a decision procedure; but to choose the right procedure, we need to evaluate consequences (which we cannot do).*

  ### 2. Proposed Precise Term: "Second-Order Cluelessness"
  Since philosophers have not standardized a single noun for the *combination* of these two layers, the term that captures your configuration most precisely is **Second-Order Cluelessness**.

  **Definition:**
  > A decision state in which an agent recognizes that first-order outcome maximization is epistemically inaccessible (First-Order Cluelessness), but further recognizes that the selection of a heuristic, rule, or tradition to replace that maximization is *also* epistemically inaccessible and consequential, leaving the choice of decision procedure itself unjustified and arbitrary.

  **Why this term fits:**
  It distinguishes your situation from ordinary "uncertainty." Ordinary uncertainty implies you know the *method* (e.g., "maximize expected utility") but lack the *data* (probabilities). Second-Order Cluelessness implies you lack the *method* itself, and any method you pick to fill the gap is subject to the same data limitations that invalidated the original method.

  ### 3. How It Differs from Related Concepts
  To ensure this concept is carved out precisely, it must be distinguished from three nearby ideas:

  *   **Vs. Decision-Making Under Risk/Uncertainty:**
      *   *Standard Uncertainty:* You know the goal (maximize welfare) and the options, but not the outcomes.
      *   *Your Configuration:* You do not even know which *goal-setting mechanism* (heuristic, tradition, local welfare) is the valid proxy for the goal. The uncertainty has migrated from the *outcome* to the *metric of decision-making*.
  *   **Vs. Bounded Rationality / Heuristics:**
      *   *Standard View (Simon/Gigerenzer):* Agents use heuristics because calculation is costly, but the heuristics are assumed to be "ecologically rational" (they generally work).
      *   *Your Configuration:* You are questioning the *selection* of the heuristic. If "follow tradition" and "maximize local welfare" yield different outcomes, and you cannot calculate which is better long-term, Bounded Rationality offers no guide for choosing between the heuristics. Your problem is the **Meta-Selection Problem**.
  *   **Vs. Higher-Order Normative Uncertainty:**
      *   *Standard View (MacAskill/Bykvist):* Uncertainty about which *moral theory* is true (e.g., Utilitarianism vs. Deontology).
      *   *Your Configuration:* You can accept a single theory (e.g., Consequentialism) but still face this problem. It is not that you doubt the theory; it is that the theory's *application conditions* are broken, and the repair mechanism is also broken.

  ### 4. Boundaries: What Sits Just Outside the Edge?
  To define the concept sharply, we must identify cases that look similar but do not qualify as Second-Order Cluelessness:

  *   **Deontological Constraints (Outside):** If you decide, "I will not have a child because it violates a duty," you have escaped Second-Order Cluelessness. Deontology avoids this by fiat; it claims the rightness of the act is intrinsic, not dependent on traceable consequences. Your problem only exists if you remain committed to *outcomes* mattering.
  *   **Transformative Experience (Outside):** L.A. Paul's concept involves not knowing *what it is like* to be a parent (epistemic transformation). Your problem is not about the *qualia* of the outcome, but the *causal ripple effects* of the decision procedure.
  *   **Simple Ignorance (Outside):** If you simply don't know if the job market in the smaller city is good, that is First-Order Cluelessness. Second-Order Cluelessness only kicks in when you realize that *asking a friend for advice* (the heuristic) is itself a choice with untraceable consequences (e.g., relying on biased local knowledge).
  *   **Pragmatism (Boundary Case):** A Pragmatist might say, "The truth is what works." This dissolves the problem by denying the need for a prior justification. If you accept Pragmatism, you are no longer in Second-Order Cluelessness; you have adopted a metaphysical stance that renders the regress benign. Your problem persists only if you demand a justification for the shortcut that the shortcut cannot provide.

  ### Summary
  The field has not carved out a single proper noun for this, likely because it is often treated as a *reductio ad absurdum* of consequentialism rather than a standalone category. However, the precise philosophical description is **The Normative Criterion Problem** or **Second-Order Cluelessness**.

  It describes the specific paralysis that occurs when **epistemic humility regarding outcomes infects the choice of decision procedures**, rendering the fallback mechanism as arbitrary and consequential as the original calculation it was meant to replace.
