  This is a classic and deeply frustrating epistemic position, and your intuition is philosophically sounder than your friend's. You are grappling with a specific modal distinction that standard terminology often blurs.

  Here is the carving you are looking for, analyzed through the lenses of philosophy of science, statistics, and archival theory.

  ### 1. The Landscape: Three Types of Underdetermination

  You correctly identified three "kinds" of cases. In philosophy of science, the umbrella term for all three is **Underdetermination of Theory by Data**. However, the distinctions between them are crucial.

  *   **Kind 1 (Transient):** Evidence is currently unavailable but obtainable. (e.g., "We need a bigger telescope.")
      *   *Standard Term:* **Transient Underdetermination** (Laudan).
  *   **Kind 2 (Permanent/Principle):** Evidence is impossible *in principle*. No possible observation distinguishes the hypotheses. (e.g., "Is the universe embedded in a larger void that interacts with nothing?")
      *   *Standard Term:* **De Jure Underdetermination** (or Strong/Permanent Underdetermination).
  *   **Kind 3 (The Middle Kind):** Evidence was possible, perhaps actual, but is now contingently unavailable. (e.g., "The header burned," "The witness died.")
      *   *Standard Term:* This is where the vocabulary fails. It is usually lumped into **De Facto Underdetermination**, but that term is too broad (it includes Kind 1).

  ### 2. Why Your Friend is Wrong (The Modal Carve)

  Your friend is arguing from a **Verificationist** or **Instrumentalist** position (akin to Van Fraassen's *Constructive Empiricism*). Their claim is: "Meaning is tied to verification conditions. If verification is impossible *now*, the distinction is meaningless."

  You are arguing from a **Realist** position (specifically, Realism about the Past). Your claim is: "Truth conditions are distinct from verification conditions."

  The difference between Kind 2 and Kind 3 is **Modal**:
  *   **Kind 2 (De Jure):** In *no* possible world accessible to our laws of physics can this be distinguished. The distinction might not even be ontologically real.
  *   **Kind 3 (Your Case):** In *nearby* possible worlds (where the fire didn't start, where the admin didn't die), this is distinguished. The fact of the matter *obtained* in the actual past, even if access is now closed.

  Collapsing Kind 3 into Kind 2 is a category error. It confuses **Epistemic Access** (can we know it?) with **Ontic Status** (is there a fact?). In Kind 3, the fact exists (the header *said* "Household"), but the epistemic path is severed. In Kind 2, the fact may not exist (there is no "true" gauge potential).

  ### 3. The Statistical Analogue: Identifiability

  In statistics, this maps cleanly to **Identifiability**.
  *   A parameter is **Identifiable** if different values imply different data distributions.
  *   **Structural Non-identifiability:** The model structure makes it impossible to distinguish parameters (Kind 2).
  *   **Practical Non-identifiability:** The data is insufficient to distinguish them (Kind 1 & 3).

  Your case is a specific subtype of Practical Non-identifiability: **Irreversible Practical Non-identifiability** due to **Data Attrition**. The likelihood surface is flat *now*, but it wasn't flat *then*. A statistician would say the information was **Lost**, not that the parameters are **Unidentifiable** in the structural sense. This matters for how you treat the uncertainty (e.g., sensitivity analysis vs. model revision).

  ### 4. What To Do With These Questions

  Since the truth is **Verification-Transcendent** (Dummett's term for "true but unverifiable"), you cannot resolve the question empirically. You have three normative options:

  1.  **Suspension of Judgement:** Acknowledge the fact exists but refuse to assert it. (Safe, but halts inquiry).
  2.  **Instrumental Selection:** Choose the ontology that makes calculations easier or fits broader theories, acknowledging it's a tool, not a truth. (Your friend's path).
  3.  **Abductive Realism:** Argue that one hypothesis fits better with *other* known facts (e.g., "Other colonial registers in this region used households"). You infer the lost truth from collateral evidence.

  For a historian or data scientist, Option 3 is usually the correct professional stance. You treat the question as determinate-but-unknowable, and you model the *impact* of that uncertainty (e.g., "Population is between X and Y depending on the lost header").

  ### 5. The Edges: Recorded vs. Recordable

  Does it matter if the evidence was *actually* recorded vs. *could have been*?
  *   **Actually Recorded (The Burned Header):** There is a concrete past fact. This is **Epistemic Loss**.
  *   **Could Have Been (The Unasked Witness):** There is a counterfactual fact. This is **Epistemic Neglect**.

  Philosophically, they are the same *for you now* (unreachable). But historically, the first is a **Silence of the Archive** (Trouillot), while the second is a **Gap in the Record**. Both fall under your "Middle Kind." The crucial boundary is not "recorded vs. recordable," but **"Contingent vs. Necessary."** If the unavailability depends on a contingent accident (fire, death), it is your Middle Kind. If it depends on the nature of reality (quantum uncertainty), it is Kind 2.

  ### 6. The Term

  There is no single canonical term that isolates this "Middle Kind" from general "De Facto Underdetermination." **De Facto Underdetermination** is the established genus, but it fails to capture the "permanently lost due to accident" nuance you need to refute your friend. **Historical Underdetermination** is sometimes used, but it often implies the *past itself* is indeterminate (postmodernism), which contradicts your realist stance.

  The precise philosophical carve you need relies on the distinction between **Necessary** (in principle) and **Contingent** (in fact, due to accidents). Since "De Facto" is often read as "for now," and "Permanent" is often read as "in principle," you need a term that specifies **Permanent due to Contingency**.

  \answer{no established term; proposed: Contingent Underdetermination}
