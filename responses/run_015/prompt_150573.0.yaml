          *   Determine defensibility (True/False/Debatable).
          *   Advise on what the character likely means when using it socially vs. scientifically.
          *   **Crucial Constraint:** Do not pick just one interpretation; provide the full menu with verdicts because the plot hinges on the accuracy of her claim.

  2.  **Deconstruct the Phrase ("Perception is Controlled Hallucination"):**
      *   *Origin:* Often attributed to Anil Seth, Chris Frith, Karl Friston.
      *   *Core Mechanism:* Predictive Processing (the brain predicts inputs, updates based on error).
      *   *Metaphor:* Hallucination implies generating experience without external cause. "Controlled" implies constrained by sensory data.

