      *   **Version 1: The Weak/Trivial Claim (The "Correction" Model)**
          *   *Idea:* Perception involves top-down predictions, but sensory data corrects them. It's *like* hallucination only in mechanism, not ontology.
          *   *PP/FEP Status:* Definitely true. This is the baseline mechanism.
          *   *Philosophical Weight:* Low. Doesn't deny access to reality.
          *   *Character Usage:* Boring for a party, but scientifically safe.

      *   **Version 2: The Intermediate Claim (The "Constrained Construction" Model)**
          *   *Idea:* Qualitative experience (qualia) is generated internally. We never experience the world *directly*, only the brain's model of it. Sensory data just tunes the model.
          *   *PP/FEP Status:* Defensible. This is the standard cognitive science view (interface theory).
          *   *Philosophical Weight:* Medium. Kantian "noumena" vs. "phenomena."
          *   *Character Usage:* This is likely what she means to sound profound. It's the "sweet spot."

      *   **Version 3: The Strong/Radical Claim (The "Solipsistic" Model)**
