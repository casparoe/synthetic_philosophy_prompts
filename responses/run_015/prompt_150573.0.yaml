          *   *Character Usage:* What she says when sleep-deprived and manic. Good for plot tension.

  4.  **Evaluating Against Predictive Processing (PP) & Free Energy Principle (FEP):**
      *   *PP:* Brain is a prediction machine. Minimizes prediction error.
      *   *FEP:* Systems must resist entropy. They do this by modeling their environment to minimize variational free energy (surprise).
      *   *Key Nuance:* The "Hallucination" is *controlled* by sensory evidence (likelihood) weighting. If precision weighting goes wrong -> actual hallucination (psychosis). If right -> perception.

  5.  **Addressing the Character's Motivation:**
