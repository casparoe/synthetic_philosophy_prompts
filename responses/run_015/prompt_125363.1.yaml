answer: |-
  1. The core principle

  The principle governing your intuitions is **Causal Grounding for Identification**, which distinguishes between ontological existence and referential success. Existence is determined by structural coherence; if an entity fits the structural description of a thing, it exists in the ontology regardless of accessibility. However, identification—whether linguistic reference or mental content—requires an unbroken causal chain linking the thinker to the target. For natural kinds, this chain is anchored by any accessible sample of the kind, allowing reference to succeed even if distant duplicates exist. For specific tokens or isolated minds, the chain must connect directly to that specific entity or its environment; without this link, identification fails, leaving existence intact but reference empty.

  This principle further distinguishes between kind-terms and demonstratives to resolve tensions around accessibility. Kind-terms like 'water' latch onto a substance via an initial baptism with *any* accessible sample, securing reference across inaccessible duplicates because the causal history of the term is satisfied locally. Demonstratives like 'that substance' or mental states about specific objects require a causal link to the specific target being indicated or represented. Consequently, inaccessibility blocks identification only when it severs the specific causal pathway required for the term or thought in question, not when it merely hides structural duplicates that are irrelevant to the causal anchor already in place.

  2. Mapping onto the cases

  Cases 1 and 4 are straightforward applications of the kind-term clause. In the Twin Earth and Hidden Twin Planet scenarios, your use of 'water' or 'universe' is anchored by your causal interaction with local samples (Earth's lakes or Planet A's cosmos). The inaccessible duplicates (XYZ or Planet B) are ontologically real but referentially inert because your terms are causally grounded in your local environment. Your verdict that reference picks the local anchor despite structural identity elsewhere is preserved perfectly by this grounding requirement.

  Case 2 aligns with the existence clause. The Shadow Archive entities exist because they are structurally coherent duplicates, satisfying the ontological condition. However, your question 'who wrote the Declaration?' employs a name causally linked to the local Jefferson. The principle saves your verdict by allowing both Jeffersons to exist while restricting the reference of the name to the one in your causal history, confirming that inaccessibility blocks cross-gap identification but not existence.

  Case 5 initially seems to conflict with Case 1, but the principle resolves this by distinguishing kinds from tokens. In Case 1, you possess samples of H2O elsewhere, anchoring the kind 'water'. In Case 5, pointing at a sealed box attempts to demonstrate a specific token without causal contact to its contents. Since no sample from inside the box has ever interacted with you to anchor the demonstrative 'that substance', identification is blocked. Your intuition that identification fails here is correct because the specific causal chain required for token-reference is missing, unlike the kind-reference in Case 1.

  Case 3 tests the mental content clause. Your fluctuation arises from weighing structural identity against causal history. The principle dictates that without a causal link to actual trees, the brain's states cannot be 'about' trees in an external sense; they are merely structurally isomorphic to tree-thoughts. To maintain consistency with the causal grounding required in Cases 1, 4, and 5, the verdict must be that the brain's ontology is self-referential or empty regarding external objects, preserving the requirement that content, like reference, needs causal success.

  3. The hard reconciliation

  The tension between Case 3 and Case 5 reveals a conflict between your desire for structural symmetry and your commitment to causal history. In Case 5, you correctly identify that causal isolation blocks identification of the box's contents. In Case 3, you hesitate to apply this same strictness to the brain's thoughts, wondering if structural identity might suffice for 'aboutness'. To achieve a cleaner principle, you must drop the intuition in Case 3 that the isolated brain might still 'think about trees'. If causal isolation blocks reference to the liquid in the box (Case 5), it must also block reference to trees in the mind (Case 3); otherwise, you are arbitrarily privileging mental content over linguistic reference without a causal justification.

  Defending this choice requires accepting that intentionality is not intrinsic to structure but relational to history. If you allow the brain to think about trees without causal contact, you undermine the causal anchoring that successfully explained Cases 1, 4, and 5. By conceding that the brain's thoughts are empty of external content, you unify your ontology: existence is structural, but all forms of identification—linguistic or mental—demand a causal bridge. This sacrifices the comforting idea that internal duplication preserves meaning, but it secures the consistency of your causal-historical framework across all five scenarios.

  4. Prediction for a new case

  Consider a computer simulation running an exact copy of your brain that gets paused for 100 years and then resumed with identical inputs generated internally by the simulation. According to the principle, this brain does not think about the real world's objects during the resumed phase. Because the causal chain to the external world was severed at the moment of copying and pausing, the inputs are no longer caused by external trees or tables but by internal code. Therefore, despite structural identity with you, its mental ontology refers only to its own internal data states, not the external environment you inhabit.

  5. Bottom line

  Your underlying principle is that existence is structural but identification requires causal grounding, distinguishing between kind-anchoring and token-linking. To maintain consistency, you must sacrifice the intuition in Case 3 that structural duplication preserves external mental content.
