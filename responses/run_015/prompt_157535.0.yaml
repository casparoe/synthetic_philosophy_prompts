      *   *Response:* Yes, the Twist claims to do this. I need to argue that the exit cost *is* a compressed shadow of the future. If exiting means "going to the market to find a new partner," and Defectors pay more, that *is* a future consequence. So the Twist *does* rely on a shadow of the future, it just hides it in the parameter $k$.
