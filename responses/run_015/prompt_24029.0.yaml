answer: |-
  Here are seven interview questions designed to press the second-personal account of joint action beyond its standard defenses. Each includes a "Hard Follow-Up"—the specific pivot she will likely attempt to evade because it targets the weakest point of her answer.

  ### 1. The Derivation Problem (Required Topic)
  **Main Question:** Critics argue that your account doesn't actually generate a *shared* goal, but merely bundles two individual intentions plus a mutual right to complain. If the "we" is constituted solely by my standing to demand things of you and vice versa, what grounds that standing *before* the goal is shared? Aren't you presupposing the jointness you claim to explain?

  **The Hard Follow-Up:** "If you say the standing arises from a prior agreement to act together, haven't you just pushed the 'jointness' back a step without explaining it? And if you say the standing arises *from* the action itself, how can I have the standing to demand you contribute to a goal that doesn't exist yet because you haven't contributed?"

  ### 2. The Silent Defector (Required Topic)
  **Main Question:** Consider a case where we are carrying a table together, and you quietly decide to stop pulling halfway through without signaling me. On your view, joint action is defined by the standing to hold one another accountable. But if I don't know you've dropped out, I can't exercise that standing. Did the joint action cease the moment you mentally withdrew, or only when I attempted to hold you to the demand?

  **The Hard Follow-Up:** "If you say it ceased the moment you withdrew, doesn't that make the status of the joint action dependent on private mental states? And if it depends on private states, how is this different from the individual intention accounts you reject, where the 'jointness' collapses as soon as one 'I intend' vanishes?"

  ### 3. The Authority Bootstrapping (Required Topic)
  **Main Question:** You argue that what distinguishes joint action is the normative authority partners have over one another. But where does this authority come from? If it comes from morality, then all joint action is moral action. If it comes from the joint activity itself, isn't that circular? You seem to be smuggling in a robust normative authority to do the work that 'common knowledge' does for your opponents.

  **The Hard Follow-Up:** "If you claim this authority is a 'primitive' normative fact about second-personal relations, aren't you essentially rebranding the 'we-intention' as a 'right to demand'? Is there any empirical or phenomenological difference between me *having a we-intention* and me *feeling I have the standing to demand*, or is this purely terminological?"

  ### 4. The Dispositional Defense
  **Main Question:** To avoid the problem of constant arguing, you likely claim the 'standing to demand' is dispositional—we don't have to actually demand, just be *able* to. But Michael Bratman's account is also dispositional regarding intentions. If both accounts rely on dispositions that might never be actualized, what explanatory work is the 'standing' doing that the 'intention' isn't?

  **The Hard Follow-Up:** "If the disposition to demand is never triggered because we cooperate smoothly, and the disposition to intend is never revised because we cooperate smoothly, how could we ever tell the two accounts apart in practice? Is your theory falsifiable, or does it describe a ghostly normative layer that never touches the ground?"

  ### 5. The Content of the Obligation
  **Main Question:** When I hold you to a commitment in joint action, what exactly am I demanding? Are you obligated to produce the *outcome* (e.g., the table moves), or are you obligated to maintain the *intention* to do your part? If I do my part but lose the intention, have you violated my standing?

  **The Hard Follow-Up:** "If you say I'm only owed the *action* and not the *intention*, doesn't that reduce the partner to a tool? But if you say I'm owed the *intention*, aren't you claiming authority over your partner's internal mental life? How do you navigate that intrusion without collapsing into a view of joint action as mutual surveillance?"

  ### 6. Unilateral Termination
  **Main Question:** If joint action is constituted by mutual standing, can one partner unilaterally revoke the other's standing? If I tell you, 'You no longer have the right to demand anything of me,' does the joint action immediately dissolve, even if I continue to do my part perfectly?

  **The Hard Follow-Up:** "If you say the action dissolves, doesn't that give one partner a veto power that makes joint action incredibly fragile? But if you say the action continues despite my revocation, doesn't that prove the 'standing to demand' isn't actually essential to the action's existence, but merely a byproduct?"

  ### 7. The Phenomenological Gap
  **Main Question:** In casual joint actions, like walking together down the street, most people do not report feeling a normative 'standing to demand' correction from their partner. They report a sense of flow or unity. Why should we accept your normative description over their phenomenological report?

  **The Hard Follow-Up:** "If you argue that this standing is unconscious or implicit, how do you distinguish your view from a psychoanalytic interpretation? At what point does positing hidden normative structures stop being philosophy and start being a theory about hidden mental machinery that looks suspiciously like the 'we-intentions' you're trying to replace?"
