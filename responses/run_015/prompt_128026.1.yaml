answer: |-
  **Exam Question**

  **Question 4: The Improper Prior and Indexicality in the Two-Envelope Paradox**

  Consider the Two-Envelope Paradox under the condition that the pair of amounts $(x, 2x)$ is drawn from an improper prior distribution over positive real numbers (e.g., a uniform density over an infinite range). Consequently, the global expected value of either envelope is undefined.

  Write a concise essay addressing the following three moves:

  1.  **Local Compulsion:** Reconstruct why the argument for switching remains locally compelling for any observed amount $v$, despite the global prior being improper.
  2.  **Normative Status:** Evaluate whether declaring the expectation "undefined" genuinely resolves the paradox or merely relocates it into a state of decision paralysis. Does rational choice require a defined expectation, or does dominance reasoning prevail?
  3.  **Indexical Objection:** Tackle the objection that averaging over "the other envelope" is illegitimate due to indexical uncertainty, analogous to the reference-class problems in Sleeping Beauty reasoning. Does this break the symmetry required for the switch argument?

  *Note: No external citations are permitted. Rely on conceptual precision regarding expectation, dominance, and indexical belief.*

  ***

  **Model Answer**

  The paradox persists in the improper-prior variant because the local switch argument operates independently of the global distribution. Upon observing value $v$ in Envelope A, the agent assumes Envelope B contains $2v$ or $v/2$ with equal probability ($0.5$). The local expected gain is $0.5(2v) + 0.5(v/2) - v = 0.25v$. This calculation relies only on the conditional probability of holding the smaller or larger amount given $v$, not the prior probability of $v$ itself. Since the mechanism selects one of two envelopes at random, the $0.5/0.5$ split holds pointwise for any $v$, making the switch appear strictly advantageous regardless of the global prior's normalizability.

  However, because the prior is improper, the sum of probabilities over all possible values diverges. The global expected value is undefined, not zero. Declaring expectation "undefined" does not fully dissolve the paradox; it relocates the tension from calculation error to decision theory. If rationality requires maximizing expected utility, the agent faces paralysis: no action has a defined value. Yet, switching weakly dominates staying. For every possible state of the world (every pair $(x, 2x)$), switching yields either $2x$ (instead of $x$) or $x$ (instead of $2x$). While the gain is positive in one case and negative in the other, the local argument suggests a positive expected gain for *any* observed $v$. If expectation is undefined, standard maximization is suspended, but dominance reasoning suggests switching is never worse and potentially better. Thus, "undefined" blocks the calculation but not the intuition of dominance, leaving the agent in a normative limbo between paralysis and strict dominance.

  The indexical objection offers a deeper dissolution by challenging the reference class. In Sleeping Beauty, averaging credences over "today" is flawed because "today" is an indexical term whose frequency depends on the awakening structure. Similarly, "the other envelope" is indexical. When we calculate the expected value of switching, we treat "the other envelope" as a fixed random variable $Y$ independent of our selection. But in an improper prior space, the probability of holding the smaller amount versus the larger amount is not well-defined across the sample space. We cannot average over "the other envelope" as if our perspective (holding Envelope A) is a stable anchor across all possible worlds. The symmetry breaks because the indexical position "I am holding envelope A" does not pick out a unique probability distribution over the pair $(x, 2x)$ when the total measure is infinite.

  Therefore, the paradox arises from treating an indexical reference ("the other one") as a non-indexical random variable within an infinite sample space. The local argument works because it ignores the global measure; the paralysis arises because the global measure is required for coherent expectation but is absent. The indexical objection shows that the averaging procedure itself is illegitimate. Rational choice is not suspended; rather, the expectation calculation is misapplied. One should recognize that without a proper prior, the conditional probabilities used in the local argument cannot be aggregated into a coherent global strategy, dissolving the compulsion to switch without requiring decision paralysis.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Local Expectation Reconstruction (4 Marks)**
  *   **Must Hit:** Correctly derives the local expected gain ($0.25v$) using the $0.5/0.5$ conditional probability assumption, noting this holds pointwise regardless of the prior.
  *   **Common Botch:** Candidates claim the $0.5/0.5$ assumption is false because of the improper prior, missing that the *local* mechanism (coin flip to choose envelope) remains valid.
  *   **A vs B:** A answers distinguish between the selection mechanism (valid) and the prior distribution (invalid). B answers conflate them.

  **2. Improper Prior Consequences (4 Marks)**
  *   **Must Hit:** Explains that an improper prior leads to divergent sums, making global expectation undefined rather than zero or finite.
  *   **Common Botch:** Candidates argue the expectation is infinite rather than undefined, or claim the prior forces probabilities to zero everywhere.
  *   **A vs B:** A answers explicitly mention divergence/non-normalizability. B answers vague about "infinity."

  **3. Normative Status of Undefined EV (4 Marks)**
  *   **Must Hit:** Evaluates whether "undefined" implies paralysis or if dominance reasoning (switching is never worse) overrides the lack of EV.
  *   **Common Botch:** Candidates assert "undefined means do nothing" without discussing dominance, or ignore the paralysis aspect entirely.
  *   **A vs B:** A answers weigh dominance against expectation maximization. B answers pick one side without justification.

  **4. Indexical/Reference Class Critique (4 Marks)**
  *   **Must Hit:** Articulates the Sleeping Beauty analogy: "the other envelope" is an indexical term that cannot be averaged over like a fixed variable in an infinite space.
  *   **Common Botch:** Candidates treat the indexical objection as merely semantic or fail to connect it to the averaging procedure.
  *   **A vs B:** A answers explain *why* the averaging fails (stable anchor missing). B answers just mention "indexicality" as a buzzword.

  **5. Synthesis and Resolution (4 Marks)**
  *   **Must Hit:** Concludes coherently on whether rational choice is suspended or if the calculation is simply misapplied, integrating the local/global tension.
  *   **Common Botch:** Candidates conclude with a contradictory stance (e.g., "switching is better but expectation is undefined so don't switch").
  *   **A vs B:** A answers resolve the tension (calculation misapplied). B answers leave the paradox partially standing.

  **Grading Boundary Notes:**
  *   **A Range (16-20):** Integrated argument. The indexical objection is used to explain *why* the local argument fails to aggregate, resolving the paralysis.
  *   **B Range (10-15):** Checklist approach. Hits the three moves but treats them as separate islands without synthesizing how the indexical error causes the undefined expectation.
  *   **C Range (0-9):** Misunderstands the improper prior (treats it as standard uniform) or fails to address the decision paralysis aspect.
