answer: |-
  Based on your roommate's track record, here is the breakdown of her likely verdict, the actual rule she is applying, and the critical test case that proves it.

  ### 1. The Verdict: Approve-with-Conditions
  She will likely **approve the paper's analysis but demand a terminology change.**

  She will accept the *argument* (that Brazilian business culture prioritizes relationships due to colonial patrimonialism) because it cites a specific historical/institutional mechanism ("colonial patrimonialism"). This aligns with her acceptance of the Danish welfare-state argument and the French secularism argument.

  However, she will flag the phrase **"national character"** as problematic. In sociology, "national character" is a discredited mid-20th-century concept (associated with Ruth Benedict and essentialism) that implies a fixed, psychological uniformity. Even if the author explains it structurally, using that specific label risks reifying the trait as innate. She will likely ask them to reframe it as "political culture," "institutional legacy," or "social habitus."

  ### 2. The Rule She Is Running: Mechanism (Contingency vs. Immutability)
  Of the three rules you identified, the one that best matches her track record is **Institutional Framing vs. Essentialist Framing** (which I call the **Mechanism Rule**).

  Here is why the other two fail to fully explain her history:
  *   **Academic vs. Popular Context:** This fails the **Diplomat Test**. She accepted the diplomat's memo ("German industrial culture") but rejected the politician's speech. Both are non-academic. She also rejected the "Prussians are naturally rule-bound" claim, which could easily appear in an academic text. Context matters, but it isn't the deciding factor.
  *   **Comparative vs. Absolute Attribution:** This fails the **French Secularism Test**. She accepted "French secularism" (an absolute attribution to the French) because it was tied to laws. She rejected "French are rude" (also absolute) because it was a personality trait. The difference wasn't comparison; it was *cause*.

  **The Mechanism Rule** explains every single verdict:
  *   **Prussia:** Bureaucracy (Structural/Contingent) = **OK** | Natural trait (Immutable) = **NO**.
  *   **Japan:** Institutional norms (Learned) = **OK** | "Soul" (Metaphysical/Immutable) = **NO**.
  *   **Denmark:** Welfare state (Policy) = **OK** | Genetics (Biological/Immutable) = **NO**.
  *   **Germany:** Industrial culture (Professional/Structural) = **OK** | Lack of imagination (Innate deficit) = **NO**.

  **The Core Logic:** She accepts generalizations about nations *only if* the trait is framed as **contingent** (produced by history, law, or structure and therefore changeable) rather than **immutable** (produced by biology, soul, or inherent nature).

  ### 3. Predictions for the Brazilian Case
  Here is how each rule predicts the outcome of the Brazilian working paper:

  *   **Rule 1 (Mechanism):** **Approve-with-conditions.** The *mechanism* (colonial patrimonialism) is structural and historical, which she likes. However, the *label* ("national character") carries essentialist baggage that contradicts the mechanism. She will want the label fixed to match the structural analysis.
  *   **Rule 2 (Context):** **Approve.** It is a working paper for a journal club. This rule ignores the problematic phrasing because the source is "safe."
  *   **Rule 3 (Comparative):** **Approve.** The claim implies a comparison (relationships vs. contractual formalism), even if not explicitly stated as "unlike Country X." This rule ignores the causal mechanism.

  **Why Rule 1 is the winner:** If Rule 2 were dominant, she wouldn't have rejected the "Prussians are naturally rule-bound" claim (which could be academic) or the "Danish genetic trust" claim (which was a psychologist's analysis). The *content* of the claim overrides the *credentials* of the speaker.

  ### 4. The Critical Case (The Splitter)
  To definitively prove she is running the **Mechanism Rule** and not the **Context Rule**, you need a case where the **Context is "Bad"** (e.g., a politician) but the **Mechanism is "Good"** (structural).

  **The Test Case:**
  > A politician in a campaign speech argues: *"Our region's low investment rates are not due to laziness, but are a rational response to fifty years of volatile property laws."*

  *   **Context Rule Prediction:** **Reject.** It is a politician in a campaign speech (matches the "German lack of imagination" rejection context).
  *   **Mechanism Rule Prediction:** **Approve.** It explicitly attributes behavior to *laws and volatility* (structural/contingent) and explicitly rejects an innate trait ("not due to laziness").

  **Why this splits them:**
  In the German case, the context (politician) and the mechanism (innate lack of imagination) were *both* bad. We don't know which one triggered her rejection.
  In the Danish case, the context (psychologist) was good, but the mechanism (genetics) was bad. She rejected it. This proves Mechanism > Context.

  If she **approves** the politician's structural argument, she confirms that **causality matters more than credibility.** If she **rejects** it simply because it's a politician, then the **Context Rule** is actually dominant, and her rejection of the Danish genetics paper was because she assumes academics shouldn't make genetic claims (a norm violation) rather than because the claim was essentialist.

  **My bet:** She approves the politician's structural argument. She is a sociologist; she cares more about *how* the world works than *who* is talking, provided the speaker isn't actively promoting biological determinism.

  ### Summary for Your Bickering
  You can tell your roommate she is operating as a **Methodological Structuralist**. She doesn't deny that national patterns exist; she denies that they are *properties of the people* rather than *properties of the system*. She allows "National Character" only as a shorthand for "National Institutional History," and she will likely force the Brazilian author to make that distinction explicit.
