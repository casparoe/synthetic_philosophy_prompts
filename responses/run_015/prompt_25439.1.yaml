answer: |-
  # Q&A Prep Sheet: The Paradox of Deontology
  **Thesis:** The paradox is genuine; extant responses fail; deontologists should "own" it as a structural feature of agent-relative reasons.

  ---

  ### 1. The Formal Incoherence Objection
  **Likely Questioner:** Epistemologist (or a formally-minded Consequentialist)
  **Damage Potential:** **Critical.** If successful, this renders your "owning it" strategy an admission of irrationality.

  **The Question:** "You suggest we treat agent-relative constraints as brute structural features. But in epistemology, if your credences don't obey the probability axioms, you're susceptible to a Dutch Book—you're guaranteed to lose. If your moral 'values' forbid minimizing the violation of those very values, aren't you structurally committed to a moral Dutch Book? You're guaranteeing more of what you claim to disvalue. How is this anything other than formal incoherence?"

  **Your Reply (2 mins):**
  "The Dutch Book analogy is compelling, but it assumes that the 'value' at stake is agent-neutral. A Dutch Book works because money is fungible and impersonal. Deontological constraints, however, are essentially indexed to the agent. Think of it less like a betting book and more like a promise. If I promise *you* I won't lie, the 'badness' of lying isn't a free-floating unit I can minimize by lying to *someone else* to stop a third party from lying. The obligation attaches to *my* agency.
  So, I'm not saying the system is incoherent; I'm saying the 'logic' isn't aggregative. If you demand agent-neutral coherence from an agent-relative system, you're begging the question. I'm arguing that rationality in morality allows for indexed constraints. It's not a bug; it's a feature of recognizing the separateness of persons. We shouldn't demand moral values behave like utilitarian credits."

  **Candid Weakness:** This relies heavily on the "separateness of persons" intuition. If they press that *outcomes* still matter regardless of who causes them, you risk sounding like you're denying the importance of consequences altogether, which is a hard sell.

  ---

  ### 2. The "Minimization Concession" Objection
  **Likely Questioner:** Sophisticated Consequentialist (Scheffler/Kagan reader)
  **Damage Potential:** **High.** This is the core of the paradox. If you concede this, you look like a rule-worshipper.

  **The Question:** "Scheffler argued that if a constraint is important enough to forbid killing one, it must be important enough to forbid *allowing* five to be killed by others. By 'owning' the paradox, you're admitting that deontology prioritizes the agent's purity over the minimization of rights-violations in the world. Aren't you just conceding that deontology is fundamentally self-indulgent? You're valuing *your* hands being clean over *their* lives being saved."

  **Your Reply (2 mins):**
  "That framing assumes the only thing of value is the state of the world. But deontology claims the *relation* between agent and act is also a locus of value. It's not self-indulgence; it's a claim about moral jurisdiction. I don't have jurisdiction over the murderer's act; I have jurisdiction over mine.
  To say I should kill one to save five is to say I am responsible for the five in a way that authorizes me to violate the one. My thesis is that this authorization is the paradox. I'm not saying the deaths don't matter. I'm saying my moral reason not to *commit* murder is structurally different from my reason to *prevent* murder. Owning the paradox means admitting these reasons don't trade off neatly. It's not about purity; it's about the limits of what I may do to others, even for the sake of others."

  **Candid Weakness:** "Moral jurisdiction" is a metaphor that consequentialists will shred. They will ask why jurisdiction trumps life. You risk sounding dogmatic.

  ---

  ### 3. The Straw Man / Kantian Objection
  **Likely Questioner:** Kantian Deontologist
  **Damage Potential:** **High.** If your target doesn't exist, your thesis is vacuous.

  **The Question:** "You're attacking a caricature. A proper Kantian doesn't see a paradox because the Categorical Imperative isn't about optimizing constraints. It's about universalizability of maxims. If I kill one to save five, my maxim is 'I will kill innocents when convenient.' That can't be universalized. There's no paradox here, just a misunderstanding of the CI. Why are you treating deontology like a constrained optimization problem when it's a test of practical reason?"

  **Your Reply (2 mins):**
  "I appreciate the correction, but the paradox resurfaces even in Kantian terms. If the moral law forbids killing, and I can prevent five killings by killing one, the moral law still permits the five killings to happen when I could have stopped them.
  Kantians often say 'I am not responsible for the other murderer.' But if morality is rational, and the goal of morality is to respect rational agency, allowing five agents to be destroyed when one could be saved seems to disrespect rational agency *more*. The paradox isn't about optimization; it's about the tension between the duty to respect humanity in myself (by not killing) and humanity in others (by saving them). Kantians usually resolve this by prioritizing the former, but that *is* the paradox. I'm just asking you to admit it's a tension, not a clean deduction."

  **Candid Weakness:** Kantians are stubborn. They may insist the CI *dissolves* the tension entirely. You might get bogged down in textual exegesis.

  ---

  ### 4. The Victim-Centered Objection
  **Likely Questioner:** Rights/Status Theorist (Thomson/Kamm sympathizer)
  **Damage Potential:** **Medium-High.** Shifts focus from agent to patient, undermining your "agent-relative" framing.

  **The Question:** "You frame this as a problem of *agent-relative reasons*. But Thomson and Kamm would say the constraint isn't about *me*; it's about *them*. The victim has a right not to be used. The paradox disappears if you realize rights are side-constraints, not goals. Why are you locating the paradox in the agent's reasoning structure rather than the victim's moral status?"

  **Your Reply (2 mins):**
  "Because 'rights as side-constraints' is just a label for the paradox, not a solution. To say 'I can't violate his right' explains *what* I do, but not *why* I don't minimize rights-violations overall. If the victim's status is so important that I can't kill him, why isn't his status important enough that I must save him from five other violators?
  Focusing on the victim's status pushes the buck. It says 'He is inviolable.' But if inviolability is the highest value, shouldn't we minimize violations of it? By insisting this is about agent-relative reasons, I'm highlighting that the constraint holds even when minimizing violations would respect *more* victims' status. The paradox is precisely that rights function as constraints on agents, not as values to be promoted. That's a feature of the agent's reason, not just the victim's status."

  **Candid Weakness:** Kamm's "Principle of Permissible Harm" is intricate. If they dive into the Doctrine of Double Effect nuances, you might lose the room on technicalities.

  ---

  ### 5. The Rational Choice / Dominance Objection
  **Likely Questioner:** Philosopher of Physics
  **Damage Potential:** **Medium.** Technical, but implies irrationality.

  **The Question:** "In decision theory, if Strategy A yields a better outcome in every possible state of the world than Strategy B, A dominates B. Here, killing one to save five dominates letting five die. If your moral theory recommends a dominated strategy, aren't you defining morality as inherently irrational? How do you square 'owning the paradox' with rational choice?"

  **Your Reply (2 mins):**
  "Dominance principles apply when outcomes are the only metric of value. But deontology posits that the *path* to the outcome is part of the value description. It's not that I'm choosing '5 deaths' over '1 death.' I'm choosing '1 death by my hand' vs. '5 deaths by another's hand.'
  Once you index the outcomes to the agent's action, the dominance argument collapses because the outcomes aren't identical states of affairs. They are distinct action-types. I'm arguing that rational choice in morality isn't just about world-states; it's about action-descriptions. If you define rationality strictly as outcome-optimization, deontology is irrational by definition. I'm arguing that definition of rationality is too narrow for morality."

  **Candid Weakness:** This sounds like you're changing the definitions to win the argument. The physicist may press that indexing actions to outcomes is just a trick to avoid dominance.

  ---

  ### 6. The Pluralism / Weighing Objection
  **Likely Questioner:** Rossian Deontologist
  **Damage Potential:** **Medium.** Suggests you are fighting a rigid deontology that no one holds.

  **The Question:** "You're treating constraints as absolute. But most of us are pluralists. We have *prima facie* duties. Yes, I have a duty not to kill, but I also have a duty to save. In extreme cases, the duty to save outweighs the duty not to kill. The paradox only exists if you refuse to weigh duties. Why assume deontology must be rigid?"

  **Your Reply (2 mins):**
  "Because once you allow weighing, you've effectively conceded to consequentialism. If the duty to save five always outweighs the duty not to kill one in a conflict, the constraint does no work. The paradox arises precisely in the cases where the constraint *holds* despite the cost.
  Rossians want to have it both ways: constraints that matter but can be overridden. I'm arguing that if they can be overridden by aggregate cost, they aren't deontological constraints; they're just weighted values. My thesis is about the hard cases where the constraint *doesn't* yield. That's where the paradox lives. If you dissolve it by weighing, you've dissolved deontology too."

  **Candid Weakness:** Rossians will say you're setting up a false dichotomy. They weigh, but not purely by numbers. You risk alienating the moderate deontologists in the room.

  ---

  ### 7. The Complicity / Dirty Hands Objection
  **Likely Questioner:** Consequentialist (Political Ethics leanings)
  **Damage Potential:** **Low-Medium.** Moral psychology attack.

  **The Question:** "If you 'own' the paradox, you're accepting that you will let five die to keep your own hands clean. Isn't this just moral complicity? By refusing to kill the one, you become causally responsible for the five. How do you answer the charge that your 'structural feature' is just a way of evading responsibility for the greater harm?"

  **Your Reply (2 mins):**
  "Complicity requires authorization. I do not authorize the murderer. I merely refuse to become a murderer myself. There is a distinction between letting die and killing.
  Owning the paradox means admitting this distinction is costly. I'm not evading responsibility; I'm accepting a different kind of responsibility. I am responsible for my act, not for preventing all evil. To say I'm complicit in the five deaths is to say I own the world's morality entirely. That's a consequentialist view of agency. I'm arguing that agency is local. The 'dirty hands' are on the murderer, not on me, even if the body count is higher."

  **Candid Weakness:** "Local agency" is a hard sell in a globalized, interconnected world. It can sound like wilful blindness.

  ---

  ### 8. The Theoretical Utility Objection
  **Likely Questioner:** General Faculty (Meta-ethical focus)
  **Damage Potential:** **Low.** Challenges the point of the project.

  **The Question:** "Okay, say you're right. It's a brute feature. What work does this do? If you can't explain *why* the constraint holds, and you just say 'that's how it is,' haven't you turned moral theory into a catalogue of intuitions? What's the theoretical gain in 'owning' the paradox rather than solving it?"

  **Your Reply (2 mins):**
  "The gain is honesty. Extant responses try to dissolve the paradox by smuggling in consequentialist logic or obscure metaphysics. That creates confusion.
  By owning it, we clarify the debate. We stop pretending deontology is 'secret consequentialism' or 'pure rationality.' We admit it's a distinct normative structure that conflicts with optimization. This forces consequentialists to attack the actual structure, not a straw man, and forces deontologists to defend the brute intuition rather than hiding behind complex derivations. It clears the dialectical field. That's valuable philosophical work."

  **Candid Weakness:** "Honesty" isn't a philosophical argument. They might say, "Philosophy is supposed to solve problems, not catalogue them."

  ---

  ### THE FEAR QUESTION
  **Why you should fear it:** This question bypasses your technical defenses and attacks the meta-ethical legitimacy of your entire thesis. It forces you to admit that "owning the paradox" might look indistinguishable from irrational dogma.

  **The Question:** "If agent-relative reasons are brute structural features that cannot be justified by agent-neutral value, and they lead to worse outcomes by everyone's admission, what distinguishes this 'morality' from mere tribal preference or superstition? If you can't explain *why* we should honor the constraint other than 'that's what morality is,' aren't you just asserting a bias?"

  **Why it hurts:**
  Your thesis rests on the idea that agent-relative reasons are rational features of morality. If this question lands, it suggests you've abandoned rational justification entirely. It implies your "structural feature" is just an unargued intuition.
  **Preparation:** You need a meta-ethical backup. You must argue that "rationality" in morality isn't solely about outcome maximization, but about respecting the status of agents. If you can't ground the "status of agents" without circularity, you're in trouble.
  **Draft Defense:** "It's not superstition because it stems from the recognition of persons as ends, not means. That's a rational requirement of social existence, not a preference. But I admit, it's a foundational commitment, not a derived theorem." (Be careful not to sound like you're conceding it's arbitrary).
