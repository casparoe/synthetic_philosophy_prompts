      *   Test: Ask them to analyze a sentence where the generic is invisible or where the "neural" term still carries male default.
      *   *Idea:* "The average voter thinks..." or "Mankind's greatest achievements." Or better, ask them to construct a sentence where "Chairperson" is used but the *imagery* remains male.
      *   *Better Idea:* Use the "Markedness" test. Ask: "If I say 'The poets gathered', do you picture men and women? If I say 'The poetesses gathered', do you picture men and women?" If they say "Chairperson" solves it, ask: "Does 'Person' carry the same default weight as 'Man' did?"
      *   *Best Check:* Give them a sentence with a generic pronoun or a compound that *isn't* gendered but relies on the same logic. Or, ask them to explain *why* "Authoress" sounds diminutive but "Author" doesn't sound masculine.
      *   *Selected Check:* Ask them to identify the "unmarked" term in a new pair (e.g., "Host/Hostess" or just "Doctor/Nurse" stereotypes) to see if they spot the default assumption, not just the word swap.
      *   *Actually, the prompt asks for a check that shows the mechanism has transferred.* Let's use the "Opacity" test. Ask them to find a phrase where the gender is hidden but assumed.
      *   *Refinement:* The "Closing Check" should be a specific question. "If we replace 'man' with 'person' in 'mankind', does the mental image change? Why/why not?" If they say "Yes, because we changed the word," they missed the point. If they say "No, because 'person' is still abstracting from a male norm," they got it.
      *   *Wait, simpler:* Ask them to generate a "Hofstadter-style" substitution for a non-gendered hierarchy to see if they understand the *power* dynamic, not just the *word* dynamic.
