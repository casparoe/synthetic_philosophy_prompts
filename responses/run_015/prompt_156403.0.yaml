      *   *Prerequisite:* Participants must accept that language shapes thought (weak Sapir-Whorf) or at least reflects habit.
      *   *Step 1:* Establish Markedness (Unmarked = Default/Whole, Marked = Specific/Deviant).
      *   *Step 2:* Apply to Gender (Man = Unmarked, Woman = Marked).
