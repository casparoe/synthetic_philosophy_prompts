      *   *Phase 1: The Mechanism (25):* Markedness. Drop Right/Left. Use "Poet/Poetess" or similar. Establish Unmarked vs. Marked.
      *   *Phase 2: The Text (30):* Read sections. Apply the mechanism. Why is it funny? (Opacity).
      *   *Phase 3: The Objections (15):* Map the misconceptions. Intent, Etymology, Symmetry.
      *   *Phase 4: Conclusion & Check (10):* The transfer test. Limits.

  8.  **Refining the "Right/Left" Decision:**

      *   The facilitator suspects it's wrong. They are correct. It introduces "evaluative" bias (Good/Bad) rather than "generic" bias (All/Some).
      *   *Advice:* Replace it. Use a morphological pair where the derivation is clear but the stakes are lower, or go straight to the text's logic.
      *   *Suggestion:* Use "Actor/Actress" or "Waiter/Waitress". Or better, the "Lion/Lioness" analogy. Lion = Generic species + Male. Lioness = Female only. This mirrors Man/Woman perfectly without the political heat initially.

  9.  **Refining the Diagnoses Order:**

      *   The satire *runs* on (iv) Opacity/Compounds (that's the joke).
