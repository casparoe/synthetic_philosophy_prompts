      *   *Politeness/Etiquette:* Address early to clear the deck. This isn't about being nice; it's about logic/structure.
      *   *Etymology:* Address after the structural point is made. "Origin doesn't dictate current use."
      *   *Speaker Intent:* Address when discussing the "Chairman" objection.
      *   *Proof vs. Jest:* Address during the analysis of the text. It's a *reductio ad absurdum*, not a proof, but not *just* a joke.
