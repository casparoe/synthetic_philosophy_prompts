answer: |-
  Here is a plan for the ninety-minute session, designed to navigate the specific constraints and dynamics of your group.

  ### 1. Preliminary Advice: The Carrying Example and Dependency

  **On the 'Right/Left' Analogy:**
  Discard it. Your instinct is correct. The 'Right/Left' pair carries heavy *evaluative* baggage (good/correct vs. sinister/wrong) that is historical and semantic, not morphological. It risks convincing the sceptics that this is merely about 'offensive connotations' (which they can dismiss as oversensitivity) rather than structural asymmetry. It also fails to model the *generic* capacity of the unmarked term. 'Right' does not mean 'Human Direction' while 'Left' means 'Female Direction'.

  **What the Carrying Example Must Have:**
  1.  **Morphological Derivation:** One term must clearly be the base; the other must be formed by adding a suffix or modifier (e.g., *Lion/Lioness*, *Actor/Actress*, *Host/Hostess*).
  2.  **Generic Capacity:** The base term must be capable of referring to the whole class (e.g., 'The lion is a majestic beast' includes females), whereas the derived term refers *only* to the specific subset.
  3.  **Low Evaluative Load:** Avoid pairs where one term is inherently 'better' or 'worse' (like Right/Left or Master/Servant) to prevent the debate shifting to morality before you've established the linguistic mechanism.

  **Recommendation:** Use **Lion/Lioness** or **Poet/Poetess**.
  *   *Why:* Everyone accepts a lioness is a lion, but a lion is not necessarily a lioness. Everyone accepts 'The Poets' can include women, but 'The Poetesses' excludes men. This isolates the *markedness* without triggering immediate political defences.

  **The Dependency Structure:**
  You have identified four diagnoses. The satire *depends* on them in a specific order. If you reverse this, the 'Proof vs. Jest' split will reoccur.
  1.  **Diagnosis (iii) Morphological Derivation:** Must be established first. The group must see that *Woman* is derived from *Man* (in English), making 'Man' the base code.
  2.  **Diagnosis (ii) Default Imagery:** Once 'Man' is the base, it becomes the default mental image for the generic.
  3.  **Diagnosis (iv) Opacity of Compounds:** The satire *works* by forcing the group to re-parse compounds (e.g., 'manhole', 'mankind') where the 'Man' element has gone invisible. This generates the comedy.
  4.  **Diagnosis (i) Ambiguity:** This is the *consequence*. Because of (ii) and (iii), using the unmarked term for a specific woman becomes ambiguous or marked.

  **Do not** start with Ambiguity (i). It is too abstract. Start with the physical structure of the words (iii).

  ---

  ### 2. Session Plan (90 Minutes)

  **Resources:** Whiteboard, markers, photocopy of Hofstadter's paper.
  **Room Setup:** Circle or horseshoe if possible; you need to see faces to gauge the 'temperature' of the room.

  #### Part 1: Grounding and The Mechanism (00:00 – 00:25)

  **00:00 – 00:10: Introduction and Ground Rules**
  *   **Acknowledge the Room:** Openly state you know there are differing views. "Some feel this is settled; some feel it is fussiness; some feel personal experience contradicts it."
  *   **The 'Chairman' Objection:** Invite the member who chairs committees to speak *now*, but frame it carefully. "Before we look at the text, I want to note that for many, terms like 'Chairman' feel purely functional. We will return to why a word can feel functional to the speaker but carry a different structure to the listener."
  *   **Define the Task:** "We are not deciding policy tonight. We are acting as linguistic mechanics. We are looking under the bonnet of the satire to see how the engine works."
  *   **Misconception Pre-emption (Politeness):** Explicitly state: "This is not a session on etiquette. We are not discussing what is 'nice'. We are discussing what is structurally symmetrical."

  **00:10 – 00:25: Establishing Markedness (The Lion/Actor Test)**
  *   **Whiteboard Exercise:** Write *Lion* and *Lioness* (or *Actor/Actress*).
  *   **Question 1:** "If I say 'A lioness attacked the zookeeper', is it true to say 'A lion attacked the zookeeper'?" (Yes).
  *   **Question 2:** "If I say 'A lion attacked the zookeeper', is it necessarily true that it was a lioness?" (No).
  *   **Question 3:** "If I say 'The lion is a majestic beast', am I talking about males only?" (No, the generic).
  *   **Point to Make:** The unmarked term (*Lion*) does double duty: it means the specific male *and* the whole species. The marked term (*Lioness*) is locked into the specific.
  *   **Transition:** "Hofstadter argues English does this with *Man* and *Woman*. *Man* is the Lion; *Woman* is the Lioness. *Wo-* is the suffix. Let's see what happens when we treat that structure seriously."

  #### Part 2: Reading and The Comedy of Opacity (00:25 – 00:55)

  **00:25 – 00:40: Guided Reading**
  *   Do not ask them to read silently alone. Read the opening paragraphs aloud yourself, or ask a volunteer.
  *   **Stop at the first major substitution.** (Where he begins swapping terms).
  *   **Whiteboard Task:** Draw a T-Chart. Left side: *Original Text*. Right side: *Hofstadter's Swap*.
  *   **Ask:** "Where does this sound funny?" List the examples they give on the board (e.g., 'N-person', 'freshman' becoming 'freshperson' or similar depending on the specific text version you have).
  *   **Crucial Question:** "Why is 'Chairman' normal, but 'Chairwoman' (in a generic context) or Hofstadter's equivalents funny?"
  *   **Target Insight:** Guide them to **Diagnosis (iv) Opacity**. In 'Chairman', we no longer see 'Man'. We hear it as a single unit. Hofstadter forces us to parse it as 'Chair' + 'Man'. The comedy comes from the sudden visibility of a part we thought was invisible.

  **00:40 – 00:55: The Default Imagery (Diagnosis ii)**
  *   **Focus on the 'Chairman' Objector:** Return to her point gently. "You said you never meant anything by 'Chairman'. I believe you. But did you *picture* anyone?"
  *   **Exercise:** "Close your eyes. I say 'The Chairman entered the room'. What do you see? Now I say 'The Chairwoman entered the room'. What do you see?"
  *   **Point to Make:** The unmarked term allows the listener to supply the default (often male). The marked term forces a specific image. The satire exposes that the 'Generic Man' is not truly generic; it is a male default pretending to be neutral.
  *   **Misconception Check (Intent):** "Speaker intent does not control listener reception. The structure of the word suggests a default even if the speaker intends neutrality."

  #### Part 3: Objections and Symmetry (00:55 – 01:15)

  **00:55 – 01:05: The Symmetry Objection**
  *   **The Trap:** A participant will say, "It would be just as funny if we made everything 'Woman'."
  *   **The Refutation (Whiteboard):** Write *Man* and *Woman*.
  *   **Argument:** "If I make everything 'Woman', I am using the *marked* term as a generic. That is grammatically jarring because 'Wo-' implies derivation. If I make everything 'Man', I am using the *unmarked* term as a generic, which is grammatically standard but logically exclusionary."
  *   **Key Point:** The satire is not symmetric because the language is not symmetric. Swapping them highlights the asymmetry; it does not prove they are equal. The joke lands on 'Man' because 'Man' claims to be universal. 'Woman' makes no such claim.

  **01:05 – 01:15: Etymology and Proof vs. Jest**
  *   **Etymology:** "Someone might say 'Man' originally meant human."
      *   **Response:** "Etymology is not destiny. 'Knight' once meant servant. Current usage dictates meaning, not history. If the word functions as male-specific now, its history doesn't fix the current bias."
  *   **Proof vs. Jest:** "Is this a proof that sexist language is wrong, or just a joke?"
      *   **Resolution:** "It is a *reductio ad absurdum*. It takes the logic of the current language ('Man is generic') and applies it consistently to show the absurdity. It is a joke that functions as an argument. It establishes that the system is inconsistent, not necessarily that every speaker is sexist."

  #### Part 4: Conclusion and The Transfer Check (01:15 – 01:30)

  **01:15 – 01:20: Limits of the Session**
  *   **Openly Refuse to Settle:** State clearly: "We cannot settle tonight whether changing language *causes* social change, or merely *reflects* it. That is a sociological question, not a linguistic one. We also cannot settle whether 'Chairperson' is aesthetically pleasing. We are only looking at the structural mechanism of markedness."
  *   **Neutrality Objection:** Address the idea that 'Chairperson' solves it. "Changing the word does not instantly change the default image. 'Person' can still be pictured as male. The work is in shifting the default, not just the label."

  **01:20 – 01:25: The Closing Check**
  *   **The Test:** Write this sentence on the board:
      *"The average voter is concerned about his pension."*
  *   **Ask:** "If we change this to: *'The average voter is concerned about their pension.'* Have we solved the problem Hofstadter identified?"
  *   **The Etiquette Answer (Fail):** "Yes, because 'their' is neutral and polite."
  *   **The Mechanism Answer (Pass):** "No, not necessarily. If 'The average voter' still conjures an image of an old man, the pronoun change is cosmetic. The unmarked term 'Voter' may still carry a male default. We have fixed the grammar, but not the imagery."
  *   **Why this works:** It moves the goalpost from "finding the neutral word" (etiquette) to "examining the mental default" (mechanism). If they grasp the session, they will acknowledge the image might persist despite the pronoun swap.

  **01:25 – 01:30: Final Wrap**
  *   Thank the 'Chairman' objector for her patience.
  *   Reiterate that the goal was to see the machinery, not to enforce a verdict.
  *   Dismiss.

  ---

  ### 3. Misconception Map (Summary for Facilitator)

  | Misconception | When to Address | How to Handle |
  | :--- | :--- | :--- |
  | **Politeness/Etiquette** | **Intro (00:00-00:10)** | Frame as structural analysis, not manners. |
  | **Speaker Intent** ("I never meant...") | **Part 2 (00:40-00:55)** | Distinguish between *encoding* (speaker) and *decoding* (listener/default). |
  | **Proof vs. Jest** | **Part 3 (01:05-01:15)** | Define as *reductio ad absurdum*. It exposes inconsistency, it doesn't prove malice. |
  | **Etymology** ("Man meant human") | **Part 3 (01:05-01:15)** | "History does not dictate current function." |
  | **Symmetry** ("Swap Woman round") | **Part 3 (00:55-01:05)** | Show morphological asymmetry. 'Woman' is marked; it cannot function as generic without breaking grammar. |
  | **Neutrality** ("Chairperson fixes it") | **Conclusion (01:15-01:20)** | Neutrality is a property of usage/imagery, not just the lexicon. |

  ### 4. Notes on Facilitation

  *   **The Whiteboard:** Use it constantly. When they say a word is "just a word", write it down and draw the morphological parts (Man / Wo + Man). Visualising the derivation helps the non-linguists see the structure.
  *   **The 'Chairman' Member:** Do not let her be ganged up on. Use her. "This is exactly the puzzle. If the word feels neutral to you, but marked to others, where does the meaning live? In the speaker or the structure?" This validates her experience while challenging the conclusion.
  *   **Pacing:** If the debate on 'Proof vs. Jest' heats up (as it did last time), cut it off by returning to the text. "Let's look at paragraph 4. What is the verb tense here? Is he asserting or satirising?" Keep them in the text.
  *   **British English:** Ensure you use spellings and idioms appropriate to the institute (e.g., 'programme', 'realise', 'centre'). If the group is British, the 'Right/Left' analogy might also trigger 'Tory/Labour' associations, further confirming your decision to drop it.

  This plan prioritises the *mechanism* of the satire over the *politics* of the outcome, which should prevent the group from polarising into the two camps you experienced previously.
