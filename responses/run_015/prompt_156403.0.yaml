      *   *Check:* Present the sentence: "The chairman decided to hire a new workman." Ask: "If we change this to 'The chairperson decided to hire a new worker', have we fixed the structural asymmetry Hofstadter identified?" The etiquette learner says "Yes." The mechanism learner says "No, because 'worker' isn't derived from 'chairperson', but the default imagery of 'chair' remains."
      *   *Better:* "Does 'Chairperson' function as the unmarked generic for the role, or is it still a marked specific?"
      *   *Let's go with:* Ask them to identify the 'unmarked' term in a pair where no gender is involved, to test if they understand 'default' vs 'specific'. E.g., "Normal/Special".
      *   *Actually, the prompt implies the check should be about the text's mechanism.* Let's ask: "In Hofstadter's text, he changes 'man' to 'N-person'. If we simply changed 'Chairman' to 'Chair', would Hofstadter's satire still work on the *logic* of the language?"
      *   *Okay, I will formulate a specific scenario in the plan.*

