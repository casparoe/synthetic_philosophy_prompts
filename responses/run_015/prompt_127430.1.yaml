answer: |-
  **Project Title:** Unit Capture and the Temporal Standpoint of Moral Trade

  **Research Question**
  Standard models of moral trade evaluate arrangements at a single time-slice: hold values fixed, compute expected gain under each party's utility function, and verify enforceability. This project challenges the fixed-value assumption. Trading requires representing values in exchange units (money, hours, votes). Repeated exposure to these units can reshape the agent's valuation of the good itself—a mechanism I call *unit capture*. The numeraire's units omit the qualitative features that made the good worth trading, eventually substituting exchange value for intrinsic value.

  The central question is not whether unit capture occurs, but how to judge benefit when it does. When a proposed trade predictably alters what one or both parties value, which temporal and counterfactual standpoint is authoritative for judging whether the trade was mutually beneficial? A determinate answer must specify: (1) whether the ex ante, ex post, or some interpolated standpoint governs permission; and (2) a decision rule for practitioners on whether to accept specific trades given the risk of value drift.

  **Critique of Existing Positions**
  Three standard replies fail to resolve this. First, that value change is merely preference change and thus evaluatively neutral. This ignores that some values are constitutive of practical identity; altering them is not akin to changing a taste for ice cream but to altering the agent's normative standpoint. Second, that agents can fold future value change into the ex ante calculation at a discount rate. This is circular. To discount the future values, one must weigh them against current values. But the authority of the current values is precisely what is in dispute. If unit capture undermines the current standpoint's reliability, using it to weight the future standpoint begs the question. Third, that this is purely an empirical psychological question. Frequency does not determine normativity. Even if unit capture is rare, the normative structure of the framework must account for it when it occurs; otherwise, the framework recommends actions that undermine the conditions of their own justification.

  **Methodology**
  This is a conceptual project requiring no new empirical data collection. The six-month timeline is structured as follows:

  *Months 1–2: Taxonomy.* I will construct a taxonomy of value-change mechanisms in trade contexts. The goal is to distinguish unit capture from ordinary learning (updating on evidence) and ordinary exploitation (coercion or deception). The distinguishing feature will be the mechanism of representation: does the exchange unit itself drive the valuation shift?

  *Months 3–4: Modeling and Cases.* I will test whether a minimal formal model is required or if stylized cases carry the argument. I will develop stress-test cases involving community-internal, small-denomination trades—the area most exposed to unit capture due to privacy norms and repetition. I will explicitly investigate the money-pump analogue: whether a cycle of individually acceptable trades can leave participants worse off by their own lights once value-change effects are integrated.

  *Months 5–6: Synthesis.* I will draft the final paper and a companion practitioner guide. The argument will move from the taxonomy to the normative implication, testing the four possible conclusions against the stress cases.

  **Possible Conclusions**
  The project will argue for one of the following, decided by which survives the stress tests:
  1.  *Benign:* Unit capture is rare or self-limiting; the case for moral trade survives untouched.
  2.  *Restricted:* It bites only on values bound up with practical identity; the upshot is a restriction on *what* may be traded, not *how much*.
  3.  *Structural:* It is pervasive; the practice needs institutional redesign to prevent denomination-based drift.
  4.  *Negative:* It is real and unavoidable; some trades should be refused even though they are positive-sum ex ante.

  Regarding the money-pump thread: if such a cycle exists, it demonstrates a structural instability in moral trade akin to intransitivity. If it can be ruled out, the instability is contained.

  **Failure Conditions**
  The project fails if: (1) every case of unit capture collapses into ordinary learning or exploitation identifiable by existing frameworks, meaning no new phenomenon is described; (2) the effects are so case-specific that no usable rule survives for practitioners; or (3) the argument quietly requires cardinality or intertheoretic comparisons that the moral trade framework explicitly forbids. These are checkable substantive failures, not merely a lack of positive results.

  **Scope**
  This project does not promise a general theory of value change, nor does it engage the metaphysics of personal identity over time. It borrows the standard philosophical assumption that there is a sufficient continuity of agency to make trade meaningful, and asks only how value drift within that continuity affects normative evaluation.

  **Deliverable and Justification**
  A survey cannot answer which temporal standpoint is authoritative; only philosophical argument can. Empirical data can tell us how often values change, but not whether those changes invalidate the ex ante justification. The deliverable is a paper establishing the normative structure, plus a one-page decision procedure for practitioners. For someone deciding this month whether to accept a trade, the output will be a checklist: Does this trade involve denominations known to trigger unit capture? Does it touch constitutive values? If yes, the default presumption shifts from acceptance to refusal. This provides immediate action-guidance where current literature offers none.

  ***

  **Note on Weakness**
  The weakest part of this proposal is the distinction between "unit capture" and "rational updating." If an agent starts valuing a good in terms of exchange units because they have learned that those units reliably secure the good, that looks like efficient learning, not corruption. To succeed, I must show that the *representation* itself omits normatively relevant features of the good, not just that it abstracts them. If I cannot demonstrate that the abstraction is necessarily lossy in a way that matters for the agent's own terminal values, the phenomenon collapses into rational adaptation, and the normative problem vanishes. This is the critical hinge on which the entire project turns.
