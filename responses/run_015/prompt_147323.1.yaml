      *(Self-Correction during drafting)*: Make sure not to take sides on Externalism itself, but on who argues *better* within the context of this specific case. B seems to win on the specific logic of the Cross-Fade, even if Externalism is generally popular. A's reliance on "indeterminacy is normal" is a bit of a conversation stopper. B's point about "theory-generated indeterminacy" is a specific critique of *how* externalism handles vagueness. I need to highlight that.

      Also, check the "slow-switching" reference. B mentions A concedes drift in slow-switching. This refers to the Ludlow/Burge debates. If A accepts slow-switching leads to content change, B is right that Cross-Fade is just the continuous limit. A tries to deny the relevance by saying "fade doesn't obtain," which is methodologically weak.

