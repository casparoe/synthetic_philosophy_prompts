      *   **Vagueness:** Is semantic indeterminacy a feature of the world/language or a bug of the theory?
      *   **Methodology:** Do we trust intuitions about continuity of meaning (B) or causal history (A)?

  6.  **Drafting the Response:**
      *   *Tone:* Professional, philosophical, impartial but decisive.
      *   *Structure:*
          1.  Introduction (acknowledge the task).
          2.  Move-by-Move Adjudication (A1, B1, A2, B2, A3, B3).
