answer: |-
  To engage with your question regarding Daniel Dennett's conception of the self as a center of narrative gravity and its application to the case of Clive Wearing, we must first establish the ontological status of the self within Dennett's naturalistic framework. For Dennett, the self is not a distinct entity residing within the brain, nor is it a Cartesian ego that observes experience from a central theater. Instead, it is an abstract object, a theoretical fiction akin to the center of gravity in a physical body. Just as a center of gravity is a useful point of reference for calculating the motion of an object but possesses no mass or physical substance of its own, the self is a useful fiction generated by the brain to organize behavior, memory, and social interaction. The core commitment of this view is that selfhood is constitutively dependent on the production of a coherent autobiographical narrative. This narrative is not merely a report on what is happening; it is the very process that constructs the subject. Without the continuous weaving of experiences into a story that links past, present, and anticipated future through language and memory, the center of gravity loses its definition. Consequently, if the narrative thread is severed, the self, in the full sense of a person capable of moral responsibility and autobiographical identity, ceases to exist or becomes radically fragmented. The theory posits that we are the stories we tell ourselves and others, and the stability of the self relies on the stability of that storytelling capacity.

  When we apply this framework to Clive Wearing, who suffered profound anterograde amnesia following viral encephalitis, we are presented with a stringent test case for the necessity of narrative continuity. Wearing's condition is characterized by an inability to form new episodic memories, meaning his conscious experience is confined to a window of mere seconds. He cannot update his life story beyond the immediate moment. According to the narrative-gravity model, the center of gravity in Wearing's case should be unstable or non-existent because the requisite narrative thread is constantly broken. In a literal sense, the theory maps Wearing's selfhood as a series of disconnected points rather than a continuous line. Each moment is a new inception of consciousness without a causal link to the previous moment in his explicit awareness. The center of gravity, therefore, is not a fixed point but a stuttering locus that resets continuously. This mapping aligns strikingly well with Wearing's own reports and behaviors, particularly his compulsive diary writing. He repeatedly writes entries stating that he has just woken up or returned from the dead, often crossing out previous entries because they no longer match his current experiential reality. From Dennett's perspective, this is precisely what we should expect when the narrative engine fails; the fiction of the self cannot maintain coherence without the data of memory to sustain the plot. The center of gravity collapses because the mass of experience is not accumulating into a unified history.

  Furthermore, the narrative-gravity model offers a compelling explanation for Wearing's interaction with his wife, Deborah. Despite knowing her semantically and showing deep emotional affection, he greets her with the same intensity every time she enters his visual field, as if she has been absent for a long duration. The theory explains this by noting that the narrative context required to understand she had merely left the room moments ago is unavailable to him. His story resets to a default state of isolation upon every lapse of attention, so her reappearance is narratively coded as a reunion rather than a continuation. His affective orientation remains consistent because the emotional tone is part of the immediate narrative fragment, even if the contextual history is missing. In this regard, the case confirms the theory's prediction that without the updating of autobiographical context, the personal identity that grounds specific relationships in time dissolves. Wearing loves Deborah, but he cannot sustain the narrative of being a husband who was just speaking to his wife; he can only instantiate the narrative of a man seeing his wife arrive. The center of gravity is present enough to locate the object of affection but too fragmented to locate the subject in a continuous timeline.

  However, the case of Clive Wearing also exposes significant tensions and potential blind spots in Dennett's account, particularly concerning the preservation of skilled musicianship and procedural knowledge. Wearing retains the ability to play complex piano pieces and conduct choirs with sensitivity and technical precision, despite having no autobiographical memory of practicing these skills or even knowing he is about to perform until the moment he begins. Here, the narrative-gravity model struggles to accommodate the evident agency and coherence displayed in his performance. If the self is strictly a fiction generated by narrative, one must ask who or what is playing the piano. Dennett might classify this as competence without comprehension, suggesting that the brain mechanisms are executing routines without a self supervising them. Yet, the performance involves real-time adjustment, emotional expression, and social coordination that seem to require a form of minimal selfhood distinct from the autobiographical narrative. The theory risks misdescribing this clinical reality by implying that because the narrative is broken, the agent is absent. In Wearing's playing, there is a clear locus of control and a unified perspective on the music, even if that perspective cannot be verbalized or stored as memory. This suggests that the center of narrative gravity may be a higher-order feature of selfhood rather than its foundation. The theory explains the loss of the biographical person well but remains silent or reductionist regarding the persisting embodied subject who acts in the world.

  This silence points to a deeper philosophical issue regarding the contribution of non-representational, embodied capacities. Dennett's model is heavily intellectualist, prioritizing language and reportability as the conditions for selfhood. Wearing's case suggests that there is a layer of selfhood rooted in the body and its habits that survives the collapse of narrative. When Wearing plays the piano, he is not merely a biological machine; he is expressing a preference, a style, and an engagement that feels personal to observers and presumably to him in the moment. The narrative-gravity model has no clear vocabulary for this minimal self because it defines the self primarily through the lens of storytelling. Consequently, the theory is forced to either deny that this constitutes selfhood or stretch the definition of narrative to include non-verbal procedural flows, which dilutes the original claim. If we accept that Wearing retains a form of selfhood through his music and emotional bonds, then Dennett's claim that the self is best understood as a center of narrative gravity appears incomplete. It captures the social and autobiographical person but neglects the phenomenological subject that exists prior to or alongside the story. The case reveals that while narrative coherence may be necessary for full personhood in the moral and legal sense, it is not necessary for the existence of a conscious, acting subject.

  In evaluating what this reveals about the theory in return, we must conclude that Wearing confirms the necessity of narrative for the specific type of selfhood Dennett is analyzing, which is the person as a moral and legal entity, but he simultaneously demonstrates that this is not the entirety of selfhood. The theory succeeds in explaining the fragmentation of Wearing's identity and his inability to project himself into the future or recall his past. It accurately predicts the discontinuity of his conscious experience and the reset mechanism of his interactions. However, it fails to account for the continuity of his agency and emotional life. The center of gravity, in Dennett's sense, may indeed dissolve, but something remains that holds the body and mind together in purposeful action. This implies that the theory offers no verdict on the minimal self, leaving a gap in its explanatory power regarding consciousness itself. It treats the self as a user-illusion created for social coordination, but Wearing's suffering and his musical engagement suggest an interiority that persists even when the social utility of the self is compromised. The theory is silent on the quality of that interiority because it focuses on the structure of the story rather than the feel of the experience.

  Ultimately, the case of Clive Wearing suggests that Dennett's model should be viewed as describing a specific layer of personal identity rather than the whole of subjective existence. The center of narrative gravity is a valid description of how we construct our public and autobiographical selves, but it is not exhaustive. Wearing shows us that when the narrative fails, the gravity center fractures, but the mass of the human being remains capable of organized, meaningful action. This indicates that the theory neglects the contribution of embodied capacities that sustain a minimal self even when autobiography fails. To maintain disciplinary rigor, we must specify that in Wearing's situation, the narrative center is effectively absent, replaced by a series of momentary centers that cannot integrate. The theory allows for this fragmentation but interprets it as the dissolution of the self. A more comprehensive view would acknowledge that while the narrative self is gone, a procedural and affective self persists. Dennett's framework is powerful for understanding the loss of identity but limited in understanding the persistence of agency. It explains the break in the story but not the continuity of the singer. Thus, while Wearing confirms that narrative coherence is necessary for the full, extended selfhood that defines our personal identity over time, he shows that Dennett's model risks overlooking the foundational, non-representational capacities that allow a subject to exist in the immediate present. The theory is not falsified, but its scope is revealed to be narrower than the totality of human consciousness, leaving the embodied, non-narrative aspects of selfhood in a conceptual shadow where the theory remains silent rather than forced to speak.
