              *   $B \land H$ (True)
              *   $B \land S$ (True)
          *   Total prior probability of compatible worlds: $1/4 + 1/4 + 1/4 = 3/4$.
          *   New probabilities (renormalize):
              *   $P_{new}(R \land H) = (1/4) / (3/4) = 1/3$.
              *   $P_{new}(B \land H) = (1/4) / (3/4) = 1/3$.
              *   $P_{new}(B \land S) = (1/4) / (3/4) = 1/3$.
