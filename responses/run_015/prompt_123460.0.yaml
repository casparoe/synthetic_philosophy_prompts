answer: |-
  A man avoids the lobby fountain. He knows it is harmless. His pulse is steady. Yet he says, "I am afraid."

  Three theorists watch him cross the room.
  The first says, "He holds a belief he denies."
  The second says, "It presents a look he can't correct."
  The third says, "He uses a name that doesn't fit."

  They turn to the clinician.
  "So," she asks, "is the fear still there?"
  The first says, "No."
  The second says, "Yes."
  The third says, "No."

  They watch the man exit, calm and careful.
  "Well," says the first, "at least we agree on what we're studying."
  "What's that?" asks the clinician.
  "The word," they say. "Never the thing."

  ***

  **Closing Note**

  To make the joke land, I leaned on a specific reading of the recalcitrant emotion problem. For the judgment view, I assumed that if the subject consciously judges the object safe, the emotion (as a judgment of danger) cannot strictly exist, forcing the theorist to posit a hidden, unendorsed belief to explain the behavior. For the perceptual view, I assumed the "look" of danger persists independently of the subject's knowledge, allowing the emotion to survive. For the somatic view, I assumed that without the bodily disturbance, the emotion ceases to exist, leaving only a misapplied label.

  I simplified the positions significantly. Many judgment theorists allow for non-conscious or modular evaluations that count as emotions even if contradicted by conscious belief, which would force the first theorist to answer "Yes." Similarly, some somatic theorists argue for dispositional bodily states that might survive acute pharmacological suppression. There is no consensus on whether recalcitrance refutes the judgment view or whether somatic removal kills the emotion; these are live controversies. The joke treats these contested commitments as fixed constraints to highlight the divergent ontologies underlying the shared vocabulary.
