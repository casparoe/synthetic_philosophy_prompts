answer: |-
  The practice presupposes a Kaldor-Hicks efficiency criterion that treats money as a measure of preference intensity rather than a proxy for welfare, prioritizing aggregate potential compensation over actual distributional justice or psychological well-being. This distinguishes it from classical utilitarianism, which seeks to maximize actual happiness. Under Kaldor-Hicks, a regulation is justified if the winners *could* compensate the losers and still remain better off, regardless of whether compensation actually occurs. The dollar serves as the numeraire for this potential compensation, translating diverse values into a common unit of sacrifice. This explains why distributional weights are absent: efficiency is distinct from equity. It also explains why hypothetical willingness-to-pay counts: it measures the magnitude of the preference, not the realization of the good. The theory is not that people are happier when they pay, but that their willingness to pay reveals the intensity of their desire, which is the only metric the state accepts for aggregating conflicting claims.

  Regarding necessary versus contingent features, the theory strictly requires only a common metric to aggregate intensity of preference. The reliance on revealed preference over stated preference is contingent, driven by a desire for objective market data rather than theoretical necessity; stated preference could work if deemed credible. Similarly, the specific Ramsey discounting formula is orthodoxy, not logic; any rate balancing present and future consumption could work. However, the practice cannot run on an objective-goods reading without fundamental alteration, because the core mechanism is preference satisfaction (willingness to sacrifice), not the provision of goods. If the view shifted to hedonic utility, the metric would need to change from dollars to utils, but the aggregation logic would remain. The exclusion of non-monetizable values is contingent on the inability to price them, not a theoretical ban, though in practice it functions as an exclusionary rule that privileges market-like values over moral ones.

  The practice is internally inconsistent regarding the cardinality of utility. By employing a Ramsey formula with a curvature parameter for consumption, the guidance implicitly assumes utility is cardinal and comparable across generations; otherwise, discounting consumption growth based on welfare curvature is meaningless. You cannot derive a discount rate from the elasticity of marginal utility without assuming a specific, comparable utility function over time. Yet, cross-sectionally, it treats utility as ordinal and non-comparable, insisting a dollar is a dollar regardless of income. This is a theoretical contradiction: you cannot assume cardinal comparability over time while denying it across persons at a single time. The proposed move to weight benefits by income using that same curvature parameter is theoretically continuous with the Ramsey logic; it merely extends intergenerational comparability to intragenerational comparability. It crosses a political line—acknowledging redistribution—not a philosophical one. Similarly, discarding scope-insensitive responses imposes a normative rationality constraint on preferences that contradicts the descriptive empiricism used elsewhere; it assumes people *should* value linearly even when they *do* not, privileging economic rationality over psychological reality.

  If the presupposed view were replaced by measurable mental states (hedonic utility), the downstream consequence would be the elimination of existence values and bequest motives, as these do not affect experienced well-being. Conversely, pain and suffering would move from the qualitative appendix to the central ledger, valued by reported misery rather than market proxies. If welfare were defined by objective goods or capabilities, the practice would forbid monetizing preferences that track adaptive deprivation (e.g., the poor valuing safety less because they expect less) and might mandate regulations protecting capabilities even where willingness-to-pay is low, such as children's health or ecosystem integrity independent of human use. Both alternatives would disrupt the current reliance on market proxies and likely increase regulatory scope in areas where money is scarce but need is high.

  Finally, the reading that benefit-cost analysis is a political technology rather than a welfare measure is defensible and perhaps most accurate. On this view, the dollarization buys commensurability that forces a decision. A multi-column ledger allows agencies to acknowledge conflicting values but permits them to prioritize arbitrarily; a net benefit number constrains discretion by demanding a single dimension of justification. It transforms political conflict into technical calculation. The dollar is not a measure of truth, but a tool of governance that legitimizes agency action by cloaking value judgments in the language of arithmetic. The practice presupposes no coherent theory of utility because it is not trying to measure utility; it is trying to constrain power. The inconsistency you observe is the friction between the rhetorical claim of scientific welfare measurement and the operational reality of bureaucratic control.
