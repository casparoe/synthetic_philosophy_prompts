      The practice presupposes a Kaldor-Hicks efficiency criterion that treats money as a measure of preference intensity rather than a proxy for welfare, prioritizing aggregate potential compensation over actual distributional justice or psychological well-being. This distinguishes it from classical utilitarianism, which seeks to maximize actual happiness. Under Kaldor-Hicks, a regulation is justified if the winners *could* compensate the losers and still remain better off, regardless of whether compensation actually occurs. The dollar serves as the numeraire for this potential compensation, translating diverse values into a common unit of sacrifice. This explains why distributional weights are absent: efficiency is distinct from equity. It also explains why hypothetical willingness-to-pay counts: it measures the magnitude of the preference, not the realization of the good.

