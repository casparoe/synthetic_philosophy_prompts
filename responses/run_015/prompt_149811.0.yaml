      *   **Context:** STS (Science and Technology Studies) seminar.
      *   **Problem:** Professor used Melvin Kranzberg's First Law ("Technology is neither good nor bad; nor is it neutral") to shut down a discussion about political bias in recommendation algorithms.
      *   **Task:**
