  *Refining the Professor's Logic:* The professor said: "Neutrality is impossible, so asking about bias is moot."
  *Logic:* If X is never neutral, then X is always biased. Therefore, asking "Is X biased?" is moot (because the answer is always yes).
  *Critique:* This is a strawman of the student's question. The student likely meant "Does it carry a *specific, problematic* political bias?" not "Is it perfectly neutral?" The professor is attacking a question nobody asked.

