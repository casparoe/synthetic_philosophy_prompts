          *   Critique: This is a non-sequitur. If neutrality is impossible, bias is *guaranteed*. The question becomes "What bias?" not "Is there bias?"
      *   *Section 4: STS Literature Check.* Bring in Winner ("Do Artifacts Have Politics?"), Feenberg (Critical Theory of Technology), and Noble (Algorithms of Oppression) to arm the user for their study group.
      *   *Conclusion:* Summary advice.

  7.  **Refining the Argument (Self-Correction during drafting):**
