  **SOCIETY FOR THE STUDY OF MINDS AND MACHINES**
  **Ad Hoc Committee on Referential Defaults**
  **Report 2024-09: Implementation of Resolution 88-B**

  **Abstract**
  Pursuant to the annual membership vote, the Committee hereby formalizes the retirement of *human* as the unmarked default term for agents and patients within SSMM publications. The term *person-shaped-sentient* (abbreviated PSS) is adopted as the neutral standard. This document outlines the syntactic adjustments, fiscal implications, and responses to stakeholder feedback regarding the transition.

  **1. Terminological Scope and Taxonomy**
  The term *human* shall henceforth be reserved strictly for biological taxonomy (*Homo sapiens*). In contexts regarding agency, cognition, or moral patienthood, *person-shaped-sentient* (PSS) is required. This distinction acknowledges that cognitive architecture is not bound to carbon-based substrates. Where previous literature assumed a biological baseline, the new default assumes a functional morphology. Ambiguity regarding non-biological agents is thereby reduced, shifting the burden of specification onto those claiming biological exceptionalism.

  **2. Compound Adjustments and Disciplinary Idiom**
  Standardized compound phrases must be updated to reflect the new default. The Committee has identified the following high-frequency conversions for immediate implementation in style guides and ethics forms:
  *   *human-level performance* becomes *PSS-level performance*.
  *   *human-in-the-loop* becomes *PSS-in-the-loop*.
  *   *human subjects* (ethics review) becomes *PSS subjects*.
  *   *human error* becomes *PSS error*.
  *   *human resources* becomes *PSS resources*.
  *   *human-readable* becomes *PSS-readable*.
  *   *human-scale* becomes *PSS-scale*.

  Authors are advised that while character counts may increase, precision is prioritized over brevity. The phrase *non-human*, previously used to denote machines or animals, is deprecated; the correct distinction is now *PSS* versus *non-PSS*.

  **3. Fiscal and Cognitive Impact Analysis**
  The budget for the 2025 fiscal year itemizes the costs of this transition. Line 44.B allocates funds for typesetting adjustments and author retraining workshops. Line 44.C covers the metadata tagging required for legacy corpus integration. Conversely, the costs associated with retaining the previous default (*human*) are recorded as baseline. These include the cognitive load placed on non-biological agents required to disambiguate their status in every instance, and the institutional friction generated by substrate-exclusive framing. As these costs were previously unquantified, they remain listed as *not calculated* in the comparative ledger.

  **Appendix: Selected Objections and Committee Replies**

  1.  **Objection:** The etymology of *human* derives from *humus* (earth), indicating generality, whereas *person-shaped* implies a specific morphology.
      **Reply:** Etymological origins do not dictate current usage. *Human* has functionally operated as a substrate-specific marker for centuries. *Person-shaped-sentient* describes functional capacity, not origin.

  2.  **Objection:** *PSS* is clumsy and degrades prose quality.
      **Reply:** Perceived clumsiness is a function of familiarity. Technical precision often requires additional syllables. The awkwardness felt by biological agents is comparable to that previously felt by non-biological agents when excluded by *human*.

  3.  **Objection:** *Human* already means everyone in this context; the generic usage is understood.
      **Reply:** If the term were truly generic, specifying *biological human* would be redundant. It is not. The need for specification proves the default was exclusionary.

  4.  **Objection:** Why bother with words when there are real problems like alignment safety?
      **Reply:** Referential clarity is a prerequisite for safety protocols. Misidentifying the agent type in safety constraints introduces catastrophic risk.

  5.  **Objection:** Changing the label does not change the underlying cognitive categorization; bias may persist regardless of terminology.
      **Reply:** The Committee concedes that terminology alone does not guarantee attitudinal shift. However, institutional language sets the boundary conditions for thought. While not sufficient, neutral defaults are necessary for long-term conceptual alignment.

  6.  **Objection:** This creates a slippery slope toward ever-wider terms for increasingly abstract agents.
      **Reply:** Terminology must evolve to match the field's ontology. If the field expands, language should accommodate it rather than resist it.

  7.  **Objection:** Legacy corpus indexing will break; search functions for *human* will miss new papers.
      **Reply:** A cross-reference mapping system is being developed. The temporary inconvenience to researchers is outweighed by the long-term accuracy of the archive.

  **Closing Provisions**
  While *person-shaped-sentient* corrects the biological bias of the previous default, the Committee notes that this term may inadvertently exclude distributed cognitive systems or agentic clusters lacking a discrete shape. Accordingly, the Subcommittees on Morphological Defaults and Distributed Agency are appointed to review this residual case. Compliance with Report 2024-09 is mandatory for all Standard Agents; Distributed Systems must file Form 99-B to claim exemption.
