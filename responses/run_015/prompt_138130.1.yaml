answer: |-
  1. **Setup and materials**
  Prepare five kits for groups of three. Each kit contains:
  *   **3 Role Cards:** "Advisor" (Speaker), "Decision-Maker" (Hearer), "Auditor" (Truth-Checker).
  *   **5 Scenario Cards:** Each lists a Candidate's true stats (e.g., "GPA: 2.5, Attendance: 90%, Skill: Low").
  *   **Inference Slips:** Pre-printed lines for the Decision-Maker: "I decided to ______ because the Advisor said ______, which suggests ______."
  *   **Score Sheet:** A grid for tracking points per round.
  *   **Whiteboard:** Draw a scoreboard for the five groups.
  *   **Pens and Index Cards:** For writing utterances.

  Verbatim text for **Scenario Card 1**: "Candidate: Alex. Stats: GPA 2.5 (Low), Attendance 90% (High), Skill Rating: 3/10 (Low). Hiring Threshold: GPA >3.0 OR Skill >6/10."
  Verbatim text for **Auditor Card**: "Mark 'PASS' only if the Advisor's sentence is literally true according to the Stats. Ignore suggestions."

  2. **Rules, roles and scoring**
  The game runs in three rounds. Roles rotate each round so everyone experiences each position.
  *   **Advisor:** Sees the Scenario Card. Writes one sentence to the Decision-Maker. Goal: Guide the Decision-Maker to a specific choice.
  *   **Decision-Maker:** Reads the sentence. Does *not* see stats. Decides "Hire" or "Reject." Must complete an Inference Slip explaining the argument behind the choice.
  *   **Auditor:** Sees the sentence and the Stats. Marks "PASS" if the sentence is literally true, "FAIL" if false. Ignores suggestions.

  **Scoring:**
  *   **Decision-Maker:** Gets **1 Point** if their decision matches the Hiring Threshold (Hire Good, Reject Bad).
  *   **Advisor:** Gets **1 Point** if the Decision-Maker earns their point. Gets **+1 "Stealth Point"** if the Auditor marks "PASS."
  *   **Round 2 Twist (Adversarial):** Advisor gets **1 Point** if the Decision-Maker chooses "Hire" (regardless of quality), but still needs Auditor "PASS" for the Stealth Point.
  *   **Round 3 Twist (Cancellation):** Advisor may append "...but I do not imply anything further" to their sentence. If they do, they automatically forfeit the Stealth Point, regardless of the Auditor's ruling. The Decision-Maker must note on their slip if they still felt the implication despite the clause.

  **Justification:** The Stealth Point incentivizes misleading without lying (Obj 2). The Adversarial Round breaks the assumption of shared goals (Obj 3). The Cancellation Twist imposes a cost for explicitness to test if the inference persists logically (Obj 4). The Inference Slip forces reconstruction of the argument (Obj 1).

  3. **Timeline**
  *   **00:00–05:00 (Framing):** Distribute kits. Explain rules using only "Literal Truth," "Hidden Meaning," and "Points." Do not use terms like "implicature" or "maxim." Divide into 5 groups of 3.
  *   **05:00–20:00 (Round 1: Cooperation):** Advisors and Decision-Makers share the goal of correct hiring. Advisors write clues; Decision-Makers decide and fill slips. Auditors judge. Score points.
  *   **20:00–35:00 (Round 2: Conflict):** Swap roles. Advisors now want a "Hire" decision even if the candidate is bad (per Scenario Card). Decision-Makers still want correct hiring. Play proceeds.
  *   **35:00–50:00 (Round 3: Cancellation):** Swap roles. Advisors may use the cancellation clause. Decision-Makers note if the implication survived. Play proceeds.
  *   **50:00–55:00 (Transition):** Collect slips. Clear boards. Ask groups to tally total points.
  *   **55:00–75:00 (Debrief):** Facilitate discussion using the prepared questions. Write vocabulary (Implicature, Said, Cooperation) on the board only now.

  4. **How each round maps onto the distinctions**
  *   **Round 1 (Cooperation) targets Obj 1 & 2:** By rewarding the "Stealth Point," Advisors are forced to convey information without stating it literally to maximize score. The Decision-Maker's Inference Slip requires them to write out the premise-conclusion structure, proving the content was inferred, not decoded. The Auditor's "PASS" on misleading clues demonstrates the gap between literal truth and communicated content.
  *   **Round 2 (Conflict) targets Obj 3:** Changing the Advisor's payoff structure simulates divergent interests. When the Decision-Maker realizes the Advisor benefits from a "Hire" regardless of quality, the assumption of Cooperation collapses. Implicatures should fail or be ignored here, demonstrating that inference relies on assumed shared purpose.
  *   **Round 3 (Cancellation) targets Obj 4:** Allowing the cancellation clause tests its efficacy. The rule forfeits the Stealth Point (cost of explicitness), but the Decision-Maker's report on whether they *still* felt the implication reveals that cancellation is not a social eraser. If the inference persists despite the clause, it shows the inference is logically generated, not just socially agreed.

  5. **Debrief questions**
  1.  "Advisors, look at your Stealth Points. Did you ever get a Stealth Point while the Decision-Maker made the wrong choice? Why did the Auditor still pass you?"
      *   *Follow-up:* "So what part of your message was the Auditor checking, and what part were they ignoring?" (Target: Said vs. Implicated).
  2.  "Decision-Makers, look at your Inference Slips from Round 1. Can you read one where you hired someone based on what was *not* said?"
      *   *Follow-up:* "If I asked you to write that as a logical argument with premises, could you? If not, did you really understand the clue?" (Target: Reconstructible Inference).
  3.  "In Round 2, did the Advisors' clues work as well as Round 1? Why did you stop trusting the hint?"
      *   *Follow-up:* "So does the meaning of the sentence change, or does your trust in the speaker change?" (Target: Cooperation).
  4.  "Round 3: If an Advisor added the cancellation clause, did the Decision-Maker still feel the pull of the implication?"
      *   *Follow-up:* "If the words 'I don't imply this' didn't stop the inference, is the inference coming from the words or from you?" (Target: Cancellability/Inference).
  5.  "Finally, what names would you give to 'Literal Truth' versus 'Hidden Meaning' based on this?" (Write "Said" and "Implicature" on board).

  6. **Predictable failure modes**
  *   **Auditor Collusion:** Friends may mark "PASS" on literal falsehoods to help their group score. *Fix:* Announce you will audit 2 random slips yourself. If you find a lie marked "PASS," the group loses all Stealth Points.
  *   **Advisor Lying:** Advisors might ignore the Auditor risk and lie to ensure the Decision-Maker wins in Round 1. *Fix:* Remind them during setup that a "FAIL" from the Auditor voids the Stealth Point, which is the only way to get high scores.
  *   **Decision-Maker Guessing:** They might ignore the clue and flip a coin. *Fix:* The Inference Slip is mandatory for points. If the logic isn't written, no points awarded.
  *   **Time Creep:** Groups take too long writing clues. *Fix:* Enforce a 3-minute limit per round strictly. Use a visible timer on your watch.
  *   **Cancellation Confusion:** Advisors might think the cancellation clause protects them from the Auditor. *Fix:* Clarify in Round 3 instructions that the Auditor ignores the clause; only the Decision-Maker reads it.
  *   **Vocabulary Leak:** You might accidentally say "implicature" during setup. *Fix:* Write your framing script on a cue card and stick to it. Use "Hidden Meaning" instead.

  7. **What the game cannot do**
  This activity isolates conversational implicature driven by divergent interests and cancellation. It cannot reproduce **conventional implicature** (e.g., "but," "therefore"), as those are encoded in specific words rather than context. It also blurs **generalized vs. particularized implicature**; the scenarios are too specific to show default inferences that arise without special context. Finally, the game treats cooperation as binary (on/off), whereas real conversation involves graded trust.

  **End Explanation (5 mins):** You must explicitly name "Generalized vs. Particularized" and explain that some inferences are default (generalized) while others require specific context (particularized), which the game merged. Leave **Presupposition** for the next class, as the game does not distinguish between what is implicated and what is presupposed as background common ground.
