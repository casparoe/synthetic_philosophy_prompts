  I'm presenting next thursday to a philosophy of mind and empirical metaethics workshop — mostly people who study moral psychology and evolutionary origins of normativity, plus one old-school Kantian who thinks naturalism is bankrupt. I'm defending a hybrid view I'm calling "hooked floating rationales": normative reasons can genuinely exist without being anchored in anyone's actual mental states (so they're free-floating), but they only become binding or action-guiding when there's at least a potential reasoner who could in principle grasp them. Without the hook, they just sit there doing nothing; with the hook, they don't reduce to the reasoner's psychology. The audience will hear this as spooky metaphysics with extra steps, and they'll want to know why we shouldn't just call it a category mistake or collapse it into evolutionary debunking.

  Draft my Q&A prep sheet: the six or seven objections they'll actually raise, ordered by how much damage each would do, phrased in thier vocabulary (evolutionary psychology, cognitive science, "reasons talk is just post-hoc rationalization," etc.). For each objection, give me a two-minute reply and a clear note on where that reply is soft or sounds like hand-waving. Tell me what I should concede right up front — probably that pure floating-rationale views do face serious evolutionary debunking problems. And include the one question I'm praying nobody asks, likely something about how this differs from old-fashioned moral Platonism or why the "hook" condition isn't just smuggling in an agent-dependent view after all. Write the whole thing in American English. I'm drafting fast so don't worry about perfect grammar, and definately don't include a bibliography or reading list — I need to answer this from the seat of my pants.
