answer: |-
  **WORKSHOP Q&A PREP: "HOOKED FLOATING RATIONALES"**
  **Date:** Next Thursday
  **Audience:** Moral Psych/Evo Ethics + 1 Kantian
  **Status:** Draft / Internal Use Only

  ---

  ### UPFRONT CONCESSIONS (The Pre-emptive Strike)
  *Start the Q&A session by owning the weak spot before they tear it open.*

  **Say this:** "I want to be clear from the jump: I agree with the empirical crowd that *pure* floating rationale views (strong Platonism) get wrecked by evolutionary debunking arguments. If normative reasons are totally unmoored from creatures like us, evolution didn't select for tracking them—it selected for fitness. My 'hook' condition is specifically designed to solve this. I'm not claiming reasons exist in a vacuum; I'm claiming they exist as potentials that require a cognitive architecture to activate. So, if your objection is 'evolution doesn't care about truth,' I agree. That's why the hook matters."

  ---

  ### THE OBJECTIONS (Ordered by Damage Potential)

  #### 1. The Evolutionary Debunking Attack
  **They'll say:** "Look, even with your 'hook,' the content of these reasons looks suspiciously like fitness-maximizing heuristics. If our capacity to 'grasp' reasons was selected for social cohesion or mating success, why think the 'floating' part tracks truth rather than just useful fiction? You've added a hook, but you haven't explained why the hook grabs truth instead of adaptive nonsense."

  **2-Minute Reply:**
  "Fair point, and this is where the hybrid view does heavy lifting. I'm not claiming evolution selected for grasping *specific* moral truths. I'm claiming evolution selected for the *capacity* to grasp reasons generally (the hook), while the *content* (the floating rationale) is constrained by logical coherence, not just fitness. Think of it like math: evolution gave us number sense because counting fruit helps survival, but the truth of '2+2=4' isn't determined by fruit. Similarly, we have normative competence for social survival, but that competence allows us to access reasons that might actually contradict fitness (e.g., self-sacrifice). The hook is natural; the rationale isn't. The debunking argument fails if the cognitive mechanism is truth-apt, even if its origin is pragmatic."

  **Soft Spot/Hand-waving:**
  *Admitting the mechanism is "truth-apt" is the weak link. You don't have a neural story for how a fitness-driven brain filters out adaptive nonsense to find 'true' reasons. You're asserting capacity without a mechanism.*

  #### 2. The "Hook" is Just Constructivism (The Coherence Killers)
  **They'll say:** "If a reason only becomes binding when a reasoner can grasp it, isn't the reason dependent on the reasoner? You say it's 'floating,' but if it does nothing without the hook, isn't this just agent-dependent constructivism with extra metaphysical steps? You're smuggling in relativity while claiming objectivity."

  **2-Minute Reply:**
  "The distinction is about *existence* vs. *activation*. A landmine exists whether anyone steps on it, but it only explodes when triggered. My claim is that normative reasons are like the landmine—they are real features of the logical landscape independent of us. The 'hook' is just the trigger condition for action-guidance. Constructivism says the mine *is created* when you step on it. I'm saying the mine was there, waiting. The binding force is conditional on agency, but the truth condition isn't. That preserves the objectivity needed to criticize actual mental states."

  **Soft Spot/Hand-waving:**
  *The landmine analogy breaks down because landmines are physical objects in space-time. Normative reasons aren't. You're relying on an intuition about 'potentiality' that sounds suspiciously like scholastic metaphysics. If it can't affect the world without us, in what sense does it 'exist'?*

  #### 3. Explanatory Idleness (Occam's Razor)
  **They'll say:** "What work is the 'floating' part doing? If the reason only matters when hooked by a psychology, why posit the floating entity at all? Why not just say the psychology generates the reason? You're doubling entities without necessity."

  **2-Minute Reply:**
  "Because the psychology alone can't explain normative *error*. If reasons are just products of the hook (psychology), then whenever my psychology says 'X is right,' X is right for me. But we make mistakes. We feel bound by reasons we *haven't* grasped yet. The floating part explains the gap between 'what I think is right' and 'what is right.' It grounds the possibility of being wrong. Without the floating component, you collapse into relativism or subjectivism, which fails to capture the phenomenology of moral deliberation where we feel we are *discovering* constraints, not inventing them."

  **Soft Spot/Hand-waving:**
  *Phenomenology isn't data. Just because it *feels* like discovery doesn't mean it is. The empirical crowd will say error theory explains the feeling of error without positing spooky entities. You're betting on intuition over parsimony.*

  #### 4. Epistemic Access (The "Queerness" Objection)
  **They'll say:** "Okay, say they float. How do we know them? What is the cognitive mechanism that grasps a non-natural rationale? If it's not perception and not inference from natural facts, what is it? You're positing a faculty of 'normative intuition' without explaining how it fits into cognitive science."

  **2-Minute Reply:**
  "I'm not positing a magical sixth sense. I'm suggesting that rational reflection *is* the mechanism. When we deliberate, we aren't just scanning feelings; we're testing coherence. The 'grasp' is the recognition of logical fit between a situation and a norm. It's not spooky perception; it's the same cognitive work we do in logic or math. We don't need a new organ to grasp modus ponens; we use general reasoning. Normative reasons are grasped the same way—by recognizing entailment relations that exist independently of our approval."

  **Soft Spot/Hand-waving:**
  *Equating normative reasons with logical truths is controversial. Moral reasons involve 'oughts,' logic involves 'ifs.' The Is-Ought gap still lurks here. You're assuming normative truths are reducible to logical coherence, which many will deny.*

  #### 5. Cognitive Science / Post-Hoc Rationalization
  **They'll say:** "Haidt and others show reasons talk is mostly post-hoc confabulation. We feel an intuition, then invent a reason. Your view assumes reasons guide action. What if the 'hook' is just a story we tell after the fact? The reason isn't guiding; it's decorating."

  **2-Minute Reply:**
  "Confabulation happens, sure, but it's not the whole story. If reasons were purely post-hoc, moral deliberation would never change anyone's mind. But it does. We argue, we reflect, we update. That suggests the reason has some traction independent of the initial impulse. My view allows for confabulation—that's when people claim a hook is engaged when it isn't. But the possibility of genuine guidance remains. The 'hook' isn't the narrative; it's the cognitive capacity to be moved by the recognition of the rationale. Sometimes that works, sometimes it doesn't. The existence of noise doesn't prove there's no signal."

  **Soft Spot/Hand-waving:**
  *You're relying on the fact that deliberation *sometimes* works. The empirical data suggests it works way less than philosophers think. You might be overestimating the power of reason based on armchair intuition.*

  #### 6. The Kantian Objection (The Old-School Attack)
  **They'll say:** "Why tether normativity to empirical agents at all? If a reason is genuine, it binds rational beings as such. By adding this 'hook' condition based on potential graspers, you're contaminating pure reason with anthropology. You're making normativity contingent on there being creatures like us."

  **2-Minute Reply:**
  "I'm not making the *truth* of the reason contingent, just its *binding force*. A law of physics is true even if no universe exists, but it doesn't 'govern' anything without matter. Similarly, normative truths exist independently, but 'obligation' is a relation between a truth and an agent. Without agents, there's no one to be obligated. I'm trying to save Kantian objectivity without the spooky commitment to reasons governing a void. We need the hook to explain why normativity matters to *us* specifically, without reducing it to *us*."

  **Soft Spot/Hand-waving:**
  *The Kantian will say this concedes too much to naturalism. If obligation requires an agent, isn't obligation itself agent-relative? You're splitting hairs between 'truth' and 'bindingness' that a strict Kantian won't accept.*

  ---

  ### EMERGENCY PROTOCOL: The Question I'm Praying Nobody Asks

  **The Question:** "Isn't this just Moral Platonism with extra steps? You say reasons float until hooked. But if they don't interact with the physical world until a brain grabs them, how are they different from Platonic forms? And if the 'hook' determines when they apply, haven't you just admitted the agent's psychology is the real source of normativity anyway?"

  **Why this kills you:** It collapses your hybrid view back into the two extremes you're trying to avoid. If it's Platonism, the empirical crowd eats you alive (queerness). If the hook is doing the real work, you're a constructivist/naturalist, and the "floating" part is epiphenomenal garbage.

  **Draft Reply (If cornered):**
  "It's Platonism about *content*, but naturalism about *force*. I'm willing to accept the 'Platonist' label for the existence of reasons if that means they aren't reducible to psychology. But I reject the idea that they exist in a separate realm—they exist as abstract relations. The 'hook' isn't creating the normativity; it's the bridge that allows abstract relations to influence physical behavior. Without the hook, the reasons are inert truths. With it, they are active obligations. I'm arguing we need both to explain moral experience: the objectivity of truth and the subjectivity of motivation. If that's 'extra steps,' I think the steps are necessary to avoid the errors of both pure naturalism and pure Platonism."

  **Backup Plan:** If they press hard on this, concede that the metaphysics is "lightweight." Say you're not committed to a heavy ontology of reasons, just that talk of reasons isn't eliminable. Pivot to pragmatism: "This view works best for explaining how we argue across cultural lines."

  ---

  **GENERAL TONE NOTES:**
  *   Don't get bogged down in metaphysics. Keep pulling it back to *function*.
  *   If the empirical folks get rowdy, agree with them on the science, fight them on the interpretation.
  *   If the Kantian gets grumpy, acknowledge their purity but insist on the "binding" problem.
  *   Stay calm. You're proposing a bridge, not a fortress. Let them attack the pillars, just keep insisting the bridge holds.
