      *   (3) Token statistics underdetermine truth conditions (Permutation Argument/Quinean Indeterminacy). *The Underdetermination Premise.*
      *   (4) Therefore, identical statistical models could have different truth conditions (Indistinguishability). *Inference from 3.*
      *   (5) If indistinguishable, no fact of the matter about content (Verificationism/Anti-Realism about Intentionality). *The Crucial Leap.*
