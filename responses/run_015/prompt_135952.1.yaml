answer: |-
  # Diagnostic Taxonomy of Scientific Realism Stances

  **Root Question:** Does the empirical and predictive success of a radically false theory (e.g., Fresnel's ether wave theory) provide any reason to retain belief in its unobservable ontology?

  ```text
  ROOT
  │
  ├── SPLIT 1: WHAT RETAINS ONTOLOGICAL CREDIBILITY?
  │   (Assess the transition from Fresnel's Ether to Maxwell's EM, 
  │    or Caloric Heat to Thermodynamics)
  │
  ├── BRANCH A: NOTHING AT ALL
  │   Label: "The success of Caloric or Phlogiston theory warrants 
  │           no belief in their unobservables; success is no guide to truth."
  │   │
  │   ├── SPLIT 2: INTERPRETATION OF HISTORICAL PATTERN
  │   │   (Assess the sequence: Phlogiston → Lavoisier → Dalton)
  │   │
  │   │   ├── PATH A1: CUMULATIVE APPROXIMATION TOWARD ONE TRUE ONTOLOGY
  │   │   │   │
  │   │   │   └── LEAF 1: [INCOHERENT / UNOCCUPIED]
  │   │   │       Label: "Optimistic Anti-Realism"
  │   │   │       Awkward Commitment: Claiming nothing survives ontologically 
  │   │   │       while simultaneously asserting we are approximating the one true ontology.
  │   │   │
  │   │   └── PATH A2: APPROXIMATE TRUTH COLLAPSES WITHOUT STABLE ONTOLOGY
  │   │       │
  │   │       └── LEAF 2: PESSIMISTIC ANTI-REALISM / CONSTRUCTIVE EMPIRICISM
  │   │           (Laudan / van Fraassen)
  │   │           Awkward Commitment: Must explain why current Quantum Field Theory 
  │   │           is exempt from the same inductive skepticism applied to Caloric.
  │   │
  │
  ├── BRANCH B: ONLY ENTITIES PRESENT IN SUCCESSOR THEORY
  │   Label: "The 'electron' in the Bohr model is real because it persists 
  │           in QM, even if Bohr's orbits are false."
  │   │
  │   ├── SPLIT 2: INTERPRETATION OF HISTORICAL PATTERN
  │   │   (Assess the identity of 'the electron' from Thomson to QFT)
  │   │
  │   │   ├── PATH B1: CUMULATIVE APPROXIMATION TOWARD ONE TRUE ONTOLOGY
  │   │   │   │
  │   │   │   └── LEAF 3: CONVERGENT ENTITY REALISM
  │   │   │       (Putnam / Boyd)
  │   │   │       Awkward Commitment: Must provide identity conditions for entities 
  │   │   │       across incommensurable theories (is Bohr's electron the QFT electron?).
  │   │   │
  │   │   └── PATH B2: APPROXIMATE TRUTH COLLAPSES WITHOUT STABLE ONTOLOGY
  │   │       │
  │   │       └── LEAF 4: EXPERIMENTAL / CAUSAL ENTITY REALISM
  │   │           (Hacking / Cartwright)
  │   │           Awkward Commitment: Must explain how we can causally manipulate 
  │   │           entities whose theoretical descriptions are acknowledged as wholly false.
  │   │
  │
  └── BRANCH C: ONLY FORMAL OR MATHEMATICAL STRUCTURES
      Label: "Fresnel's equations are approximately true, even if the 
              luminiferous ether does not exist."
      │
      ├── SPLIT 2: INTERPRETATION OF HISTORICAL PATTERN
      │   (Assess whether Maxwell's equations approximate the 'structure of the world')
      │
      ├── PATH C1: CUMULATIVE APPROXIMATION TOWARD ONE TRUE ONTOLOGY
      │   │
      │   └── LEAF 5: EPISTEMIC / ONTIC STRUCTURAL REALISM
      │       (Worrall / Ladyman & Ross)
      │       Awkward Commitment: Must explain how structure exists without relata 
      │       (the 'structure without ontology' problem) or define structure as ontology.
      │
      └── PATH C2: APPROXIMATE TRUTH COLLAPSES WITHOUT STABLE ONTOLOGY
          │
          └── LEAF 6: [UNOCCUPIED / UNATTRACTIVE]
              Label: "Mathematical Instrumentalism"
              Awkward Commitment: Asserting mathematical continuity across revolutions 
              while denying that this continuity tracks any mind-independent reality.
  ```

  ### Diagnostic Analysis of the Taxonomy

  #### 1. Indistinguishable Leaves
  **Leaf 2 (Pessimistic Anti-Realism vs. Constructive Empiricism):**
  This tree cannot separate Larry Laudan's **Pessimistic Meta-Induction** from Bas van Fraassen's **Constructive Empiricism**. Both occupy **Branch A, Path A2**.
  *   **Reason:** Both stances assert that success warrants *no* ontological belief (Branch A) and that the historical record demonstrates a collapse of approximate truth rather than convergence (Path A2).
  *   **Differentiation Failure:** The distinction between them lies in their *motivation* (Laudan uses historical induction; van Fraassen uses underdetermination and modal semantics), not in their verdict on the specific historical cases provided in the splits. To separate them, the tree would require a split on "Is the barrier to knowledge logical (underdetermination) or historical (induction)?" which was outside the requested diagnostic criteria.

  #### 2. Unoccupied or Incoherent Gaps
  **Leaf 1 (Nothing + Cumulative Approximation):**
  *   **Status:** **Incoherent.**
  *   **Reason:** One cannot claim that *nothing* ontological survives from past theories while simultaneously claiming the sequence represents *cumulative approximation toward one true ontology*. If nothing survives, there is no substrate to approximate. This combination is logically excluded by the definitions of the splits.

  **Leaf 6 (Structure Only + Collapse of Approximation):**
  *   **Status:** **Unoccupied / Unattractive.**
  *   **Reason:** This position claims mathematical relations persist across theory change (e.g., Fresnel to Maxwell) but denies that this persistence indicates approximation toward truth. This is unstable: if the math survives radical ontological change, the structural realist argues this *is* the truth-tracking element. Denying this reduces the position to a variant of Leaf 2 (Anti-Realism), making the "Structure Only" distinction in Split 1 redundant. It is rarely defended because retaining structure usually motivates a belief in structural truth.

  #### 3. Usage Note for the Physicist
  To use this instrument, take a specific case (e.g., "Do you believe the Bohr atom's *orbits* were approximately true?").
  *   If **No**, but you believe the *electron* was real: Move to **Branch B**.
  *   If **No**, and you believe only the *spectral frequency equations* were correct: Move to **Branch C**.
  *   If **No**, and you believe the electron was merely a useful placeholder for observables: Move to **Branch A**.

  Your answer to the second split then determines whether you view your current working theory (e.g., Standard Model) as the current best approximation of a final truth (Path 1) or merely the current empirically adequate instrument before the next revolution (Path 2).
