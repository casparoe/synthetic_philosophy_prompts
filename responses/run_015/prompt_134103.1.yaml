answer: |-
  Three candidate mechanisms for separating merit and desert are: (1) *Skill Saturation*, where the institution already possesses enough of the desert-worthy candidate's skill type, making the other candidate more useful; (2) *Training Cost*, where the desert-worthy candidate requires more resources to become effective; and (3) *Team Complementarity*, where the desert-worthy candidate's skills overlap with existing staff while the other candidate fills a gap. I reject *Skill Saturation* because it risks conflating merit with diversity goals rather than performance aims. I reject *Training Cost* because it implies unequal starting conditions that violate the equal opportunity constraint. I select *Team Complementarity* because it isolates the relational structural feature without altering intrinsic candidate qualities.

  **Scenario**
  A university philosophy department must appoint one Senior Fellow. The role's aim is to maximize the department's total research output and cohesion. Two finalists, Alex and Blake, are under consideration. Both had genuinely equal opportunity to publish and made comparable effort over their careers; neither is needier, nor has either been wronged. However, Blake has verified higher past contribution (more citations and completed projects) than Alex. The existing faculty consists entirely of metaphysicians. Blake is a metaphysician; Alex is an epistemologist. Both are equally skilled intrinsically, but the department suffers from groupthink in metaphysics and lacks epistemological coverage. Selecting Alex would diversify the skill set, reducing redundancy and increasing total output. Selecting Blake would honor the higher past contribution.

  **Verdicts**
  The meritocratic standard selects Alex. Given the evidence, Alex's selection best serves the role's aims (total output and cohesion) because Alex's epistemological skills complement the existing metaphysicians, whereas Blake's skills are redundant. The desert standard selects Blake. The desert base is **Past Contribution**. Blake has actually done more verified work of value than Alex. Since opportunity and effort were equal, this difference reflects a factual aggregate of achievement that generates a claim of desert, regardless of future utility. Blake deserves the office in virtue of what Blake has actually done.

  **The pool-swap test**
  The structural feature is **Team Complementarity**. This is interaction-sensitive: it depends on the relation between the candidate's skills and the existing team's profile. To run the test, we swap the existing faculty pool. Imagine the department consists entirely of epistemologists, holding fixed Alex and Blake's intrinsic qualities and the job description.
  *Before Swap (Metaphysicians):* Merit verdict is Alex (complementarity); Desert verdict is Blake (past contribution).
  *After Swap (Epistemologists):* Merit verdict is Blake (now Blake complements, Alex is redundant); Desert verdict is Blake (past contribution remains unchanged).
  The merit verdict flips based on the environment; the desert verdict stays put because it relies on historical fact, not relational fit.

  **Ablation**
  Remove the interaction feature by making the role solitary (e.g., a remote research post with no team interaction). In this setting, total output depends solely on individual capacity. Since past contribution is the best predictor of individual capacity, the merit verdict shifts to Blake. The desert verdict remains Blake. The verdicts converge on Blake. The merit verdict moves from Alex to Blake; the desert verdict does not move. This confirms the divergence in the main case was driven entirely by the relational structural feature, not intrinsic differences.

  **The best attack**
  The strongest objection targets the desert standard: "The purpose reply." An appointment is a forward-looking tool to achieve institutional aims, not a backward-looking trophy. To appoint Blake is to misuse the office as a reward, sacrificing the department's mission for a sentimental claim. The institution's duty is to its purpose, not to the candidates' histories.
  *Reply:* This conflates the *reason for the institution* with the *reason for the claim*. Desert claims arise from agency and contribution, independent of institutional utility. Denying Blake the office acknowledges the contribution but refuses to honor it, which is a genuine moral loss even if pragmatically justified. The disagreement is not about the institution's aim, but whether that aim exhausts all moral considerations in selection.

  **Honest note**
  There is a real disagreement here. It is not that the desert standard is underspecified; the base (Past Contribution) is clear and fixed. Nor is it that merit is vague; the aim (output) is ordinary. The conflict arises because merit tracks forward-looking relational fit, while desert tracks backward-looking individual achievement. One cannot reduce desert to merit without ignoring the moral weight of past agency, nor reduce merit to desert without ignoring the institutional purpose. Both standards retain intuitive pull: we feel Blake *earned* it, but Alex *should get* it for the job's sake.
