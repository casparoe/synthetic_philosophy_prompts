      *   *Consensus:* Scholars agree the formal CI argument is the bedrock of Kantian ethics. However, in this specific essay, the "causal responsibility" argument is prominent and often criticized even by Kantians. It is not merely rhetorical; Kant means it juridically. But the *moral* prohibition rests on the violation of duty, not the outcome.
