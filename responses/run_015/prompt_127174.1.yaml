answer: |-
  That centrifuge metaphor is honestly better than most of the papers I read back in the day. It captures the helplessness perfectly.

  Here's the joke I came up with, playing off that exact setup:

  So, consciousness is the Principal Investigator who sleeps in until 9 AM. The unconscious brain is the grad student who shows up at 8:30, turns on the centrifuge (that's your Readiness Potential), and starts the run. 

  The PI walks in, sees the rotor spinning, and says, "Ah, yes, I meant to do that." That's your W judgment—taking credit for the startup. 

  Then the PI notices the thing is wobbling dangerously and tries to hit the emergency stop—that's the veto, the "Free Won't." But the Motor Cortex is the lab tech standing by the machine, and he's got his headphones on. He sees the PI slamming the button, shrugs, and says, "Sorry, protocol says once the RPM hits threshold, the stop button is just a decorative red knob." 

  So the movement happens (the M-judgment), the sample flies across the room, and the PI is left standing there holding a clipboard, trying to cancel an order for a experiment he didn't start, while the cleanup crew bills him for the broken glass anyway.

  Basically, we're all just retired scientists trying to veto reagents that were already delivered to the loading dock.

  No worries on the bibliography or the jargon—honestly, your spelling was better than my handwriting after a 12-hour shift. Enjoy the couch, and keep the glasses handy; the universe isn't going to read itself.
