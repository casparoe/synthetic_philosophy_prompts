  Here is an analysis of the working group's precedents, the predicted verdict, and the theoretical levers at play.

  ### 1. The Verdict Prediction
  **Prediction:** The panel should issue a **Full Formal Apology**.

  **Closest Analog:** **Case 3 (Sterilization)**, with **Case 1 (Residential Schools)** as secondary support.

  **Reasoning:**
  To remain coherent, the panel must prioritize the *nature of the intrusion* over the *stated intent of the agents*.
  *   **Intent is Irrelevant:** Case 3 establishes that "well-meaning" intent (therapy) does not block an apology when bodily autonomy is violated. This neutralizes the "child protection" framing in the new case.
  *   **Living Victims are Necessary:** Case 2 establishes that without living direct survivors, there is no apology. The new case satisfies this.
  *   **Bodily/Autonomy vs. Cultural:** Case 5 (Language Ban) was downgraded to "regret" because the harm was deemed "cultural rather than bodily." However, Case 1 (Residential Schools) received an apology despite having a "cultural assimilation" component because it included "clear bodily harm."
  *   **The Pivot:** Child removal involves the physical seizure of a person and the violation of family integrity. This is closer to the *physical intrusion* of sterilization (Case 3) and residential schooling (Case 1) than the *usage restriction* of the language ban (Case 5). If they classify family integrity as a component of bodily/psychological autonomy, coherence demands an apology.

  ### 2. Reconstructed Principles
  Your intuition about competing rules is correct. The precedents support two conflicting maxims:

  **Principle A: The Victim-Centric Harm Rule**
  *   **Rule:** Apologize if direct state agents caused severe bodily or psychological harm to identifiable living citizens, regardless of benevolent intent.
  *   **Support:** Cases 1 & 3.
  *   **Prediction for New Case:** **Apology.** (Living survivors + severe psych trauma + direct agents).
  *   **Weakness:** Struggles to explain Case 5 (living survivors + harm = only regret) without arbitrarily distinguishing "cultural" from "psychological" harm.

  **Principle B: The State-Centric Liability Rule**
  *   **Rule:** Apologize only when the state violated a right central to its current normative identity, *unless* the action was framed as "necessity" or "protection" that implies ongoing policy validity.
  *   **Support:** Cases 4 & 5 (Refusals/Regret due to necessity/liability framing); Case 3 (Apology because sterilization is *never* valid now).
  *   **Prediction for New Case:** **Regret.** (The "child protection" framing mirrors the "military necessity" of Case 4 and the "educational protection" of Case 5; admitting moral wrong might undermine current welfare mandates).
  *   **Weakness:** Contradicts Case 3, where "therapeutic intent" failed to block the apology.

  ### 3. The Distinguishing Case (The Crucial Experiment)
  To determine which principle actually governs the panel, you need a case that isolates **Framing** from **Harm Type**.

  **Proposed Case:** *State-Sponsored Psychological Experimentation (1970s).*
  *   **Facts:** State psychologists subjected living citizens to non-consensual psychological conditioning (no physical touch/surgery) to "improve social compliance."
  *   **Framing:** Agents claimed it was for "public safety/mental health" (Protection Frame).
  *   **Survivors:** Alive and identifiable.
  *   **Test:**
      *   If **Apology**: Principle A wins. Severe psychological harm to living victims is sufficient, regardless of the "protection" frame (aligning with Case 3).
      *   If **Regret/Refusal**: Principle B wins. The "protection" frame blocks the apology unless the harm is *physically* bodily (aligning with Case 4 & 5), or the state fears liability for current psychological practices.

  ### 4. Underdetermination Analysis
  **Is the decision underdetermined?**
  **Yes.** The precedents leave the classification of "Family Integrity" ambiguous.

  *   **Path 1 (Apology):** If the panel classifies family separation as a violation of **Bodily Autonomy** (akin to Case 3's sterilization or Case 1's confinement), the "protection" frame is irrelevant (per Case 3). They must apologize.
  *   **Path 2 (Regret):** If the panel classifies family separation as **Structural/Cultural Harm** (akin to Case 5's language ban), the "liability" concern overrides the harm. They should offer regret.

  **Recommendation for Coherence:**
  Advise the panel to adopt **Principle A (Victim-Centric)**.
  Case 3 is the stronger normative precedent for transitional justice. Allowing "benevolent intent" to shield the state from apology (Principle B) creates a loophole where any human rights violation can be excused as "protection" (as seen in Case 4). To be coherent with Case 3, they must acknowledge that *impact* outweighs *intent*, even in welfare contexts.

  **Concise Advice:**
  Classify the harm as a violation of **bodily and psychological autonomy** (Case 3), not merely cultural or structural harm (Case 5). This forces the "protection" framing to fail, mandating a full apology to maintain consistency with the sterilization precedent.
