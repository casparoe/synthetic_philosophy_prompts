          *   *Cons:* It's a graveyard. People have been arguing Searle vs. Dennett for 40 years with no resolution. A small group won't solve it. It's too abstract.
          *   *Verdict:* Low priority for *progress*, high priority for *background*. It's a potential dead end if treated as the primary output.

