      *   *Approach 2: Building Systems.* This is "engineering philosophy." Make a robot/AI that blurs the line and see if we treat it as having original intentionality.
      *   *Approach 3: Neuroscience Mapping.* Look at how brain scientists talk about coding/representation and see if their practice implies original or derived intentionality.

