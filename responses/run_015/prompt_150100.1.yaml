      *   *New Ranking Logic:*
          1.  **Neuroscience Mapping (Upstream/Tractable):** You need to know how actual minds (brains) represent things before you judge artifacts. It grounds the metaphysics in science.
          2.  **Metaphysics (Middle/Refinement):** Don't try to *solve* it, try to *dissolve* the binary based on findings from #1 and #3.
          3.  **Building Systems (Downstream/Validation):** Use the refined metaphysics to design thought experiments or simple models.

