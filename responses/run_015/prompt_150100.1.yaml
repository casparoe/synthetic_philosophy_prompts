          *   Therefore: Neuroscience -> Metaphysics -> Building.
          *   *BUT*, for a 3-year philosophy group, "Building" is likely a trap. "Neuroscience" is likely the most publishable/tractable. "Metaphysics" is the core competency but needs constraints.

      *   *Revised Ranking for a *Philosophy* Group:*
          1.  **Mapping Neuroscience (Priority 1):** Most tractable. Uncovers the implicit "gradations" already in use. Upstream of metaphysics because it provides the phenomena to be explained.
