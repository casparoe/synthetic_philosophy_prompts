          2.  *Partial Comparability:* Cannot assume full comparability (common zero + common unit). Must build from weaker informational bases.
      *   **Deliverable:** A defended ordering of research questions (3-4), not a survey. Needs upstream/downstream analysis, tractability, neglectedness, criteria for weighing, a "not-doing" list, and an identification of redundant questions from the user's initial four.

