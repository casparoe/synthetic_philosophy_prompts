      *   *Q1 vs. Q4:* Q1 asks about the *structure* of comparability (zero vs. unit). Q4 asks about the *measurement* of levels/units across groups. They are deeply linked. If you can't calibrate scales (Q4), you don't have a common unit (Q1). If you assume calibration works, you might be assuming comparability.
      *   *Q2 vs. Q1:* Q2 is about the *zero point* specifically in the context of non-existence. Q1 is about the zero point generally. Q2 is a specific instantiation of the "common zero" problem in Q1, but with higher stakes (population ethics).
      *   *Q3 vs. Neutrality Constraint:* Q3 asks if we can distinguish "no fact" from "bad evidence" without a welfare theory. The constraint says we *must* remain neutral. If the answer is "No, you can't," then Q3 is blocked by the constraint.
