answer: |-
  Here is the defended research agenda, structured according to your constraints and deliverables.

  ### Criteria for Weighing the Agenda

  To rank these questions, I have applied three criteria. Note that they are in tension: the most *upstream* questions are often the least *tractable*.

  1.  **Upstream-ness (Constraint Power):** Does answering this question determine the permissible answer space for the others? If a question defines the mathematical or conceptual grammar of the protocol, it is upstream. If it merely fills in variables within that grammar, it is downstream.
  2.  **Tractability (3-Year/No-Data):** Can six philosophers and decision theorists resolve or sufficiently bracket this using formal modeling and conceptual analysis? Questions requiring new empirical psychology or neuroscience are excluded by your resource constraint.
  3.  **Neglectedness (Protocol Design Gap):** Economics handles comparability assuming welfarism. Philosophy handles welfarism assuming comparability. The intersection—*protocol design under welfarist neutrality and partial comparability*—is the gap.

  **The Conflict:** High upstream-ness often correlates with low tractability (e.g., "What is the true zero?"). To manage this, the agenda prioritizes questions where the *output* is a constraint on the protocol (e.g., "If X, then use Rule Y") rather than a substantive truth claim.

  ---

  ### The Ranked Research Agenda

  #### 1. The Informational Basis of Aggregation (Merging Q1 & Q4)
  **Question:** *Which social choice rules remain valid when we systematically vary the assumptions about common zeros and common units?*

  *   **Upstream-ness:** **Critical.** This defines the mathematical skeleton of the protocol. You cannot decide how to handle creation (Q2) or animal evidence (Q3) until you know if your aggregation function permits trade-offs (requires units) or only prioritization (requires levels). If common units and zeros are not separable, the protocol must offer a menu of rules conditional on the allocator's risk tolerance regarding comparability assumptions.
  *   **Tractability:** **High.** This is formal decision theory and social choice theory. Your team can model informational constraints (ordinal, cardinal, level-comparable, unit-comparable) and test existing aggregation rules (utilitarian, prioritarian, maximin) against them without new data.
  *   **Neglectedness:** **Medium.** Economists assume full comparability; philosophers assume specific welfare theories. Few model the *robustness* of allocation rules to *variations* in comparability assumptions specifically for cross-ontological beneficiaries.
  *   **Movement:** Move **up** if preliminary modeling shows that removing the common unit collapses all useful aggregation into lexical prioritarianism (making the rest of the agenda moot). Move **down** if the literature already provides a definitive mapping of rules to informational bases (unlikely given the specific neutrality constraint).

  #### 2. The Zero-Point as a Sensitivity Parameter (Refining Q2)
  **Question:** *Can the "neutral level" for creation be treated as a policy parameter rather than a metaphysical fact, and how does varying it alter the protocol's recommendations?*

  *   **Upstream-ness:** **High.** This determines whether the protocol can handle population changes (extinction, AI creation, animal breeding) without violating the neutrality constraint. If the neutral level is a metaphysical fact, you violate neutrality (you must know which welfare theory defines "zero"). If it is a parameter, the protocol outputs *ranges* of value dependent on the chosen zero.
  *   **Tractability:** **Medium.** This requires conceptual work to decouple the "neutral level" from specific theories of welfare (e.g., is it the point where life is not worth starting, or the point of hedonic neutrality?). It is tractable as a sensitivity analysis: "If the zero is set at X, the protocol recommends A; if at Y, it recommends B."
  *   **Neglectedness:** **High.** Population ethics usually tries to *solve* for the correct neutral level. Treating it as an explicit *input variable* for allocators (with disclosed consequences) is a pragmatic shift rarely explored in the literature.
  *   **Movement:** Move **up** if the institute anticipates funding interventions that affect population size (e.g., existential risk, animal agriculture). Move **down** if the scope is strictly limited to existing beneficiaries.

  #### 3. Theory-Agnostic Indicators of Welfare (Refining Q3)
  **Question:** *What structural or behavioral markers correlate with welfare across all major substantive theories (hedonism, preferentism, objective list)?*

  *   **Upstream-ness:** **Medium.** This connects the mathematical structure (Q1) to the real world. It does not define the structure, but it determines whether the protocol can be populated with data.
  *   **Tractability:** **Medium-Low.** This is the hardest philosophical lift. It requires finding an "overlapping consensus" of indicators. For example, "avoidance behavior" might count for hedonists (pain) and preferentists (frustrated desire), but not necessarily for objective list theorists. The team must map evidence types to *sets* of theories, allowing the protocol to say: "This evidence supports ranking X > Y *if* you hold theories A or B."
  *   **Neglectedness:** **Medium.** Measurement literature assumes a construct validity. Philosophical literature assumes the construct is known. The "partial validity across ontologies" problem is specific to your institute's needs.
  *   **Movement:** Move **up** if Q1 reveals that only very coarse ordinal data is permissible (making fine-grained theory distinctions less relevant). Move **down** if the team finds no markers survive the neutrality constraint (in which case the protocol must rely entirely on allocator priors).

  ---

  ### The Not-Doing List

  1.  **"Resolving the Repugnant Conclusion."**
      *   **Reason:** This is a request for a substantive theory of population ethics. Solving it requires choosing a welfare theory or a specific population principle, which violates your **Neutrality Constraint**. The protocol should not solve this; it should expose how different neutral levels *lead* to repugnant or non-repugnant conclusions, leaving the trade-off to the allocator.
  2.  **"Establishing Sentience Criteria for AI/Animals."**
      *   **Reason:** This is an empirical/ontological question, not a protocol design question. Your constraint is **No New Data**. Furthermore, declaring a system "sentient" presupposes a theory of consciousness/welfare. The protocol should instead ask: "Given a probability *p* that this system is a welfare subject, and a comparability structure *C*, how do we rank?"

  ---

  ### Redundancy Analysis

  You asked which of your original four questions are the same question in different words.

  **Q1 (Components of Comparability) and Q4 (Calibration) are the same question.**
  *   **Why:** Q1 asks whether a common unit and common zero are separable mathematical features. Q4 asks whether we can calibrate scales across populations. Calibration *is* the empirical attempt to secure a common unit and zero. If Q1 determines that units and zeros are mathematically inseparable under your constraints, then Q4's vignette techniques are conceptually illicit (they presuppose what is forbidden). If Q1 determines they are separable, Q4 becomes a technical sub-routine of securing the "unit" component. You cannot answer Q4 without first answering Q1.

  **Q2 (The Creation Case) is a specific instance of the "Common Zero" component of Q1.**
  *   **Why:** Q2 asks about the "neutral level." This is precisely the "common zero" problem applied to the boundary condition of non-existence. It does not need to be a separate research stream, but rather the stress-test for the "Zero" findings in Q1.

  **Recommendation:** Collapse Q1 and Q4 into the primary formal workstream. Treat Q2 as the boundary-condition test for that workstream. Treat Q3 as the separate epistemic workstream.
