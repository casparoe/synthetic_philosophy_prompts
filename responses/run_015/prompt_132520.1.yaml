  10. **Final Polish:** Ensure the distinction between *Harmonices Mundi* (harmony of the world - physics/music) and his astrological calendars is clear, as the prompt mentions "harmonic tables." Kepler's *Harmonices Mundi* is actually more about musical intervals and planetary speeds (science) than casting horoscopes (astrology), though they are linked in his mind. The prompt says "harmonic tables... calculated for clients." This implies his astrological work. I need to make sure the memo distinguishes between the *math* (valid) and the *interpretation* (invalid today). *Self-Correction:* The prompt specifically mentions "celestial harmony predictions... for clients." This is astrological. I must ensure the memo emphasizes that the *math* is real, the *meaning* is historical.

