prompt: |-
  I'm on the advisory board for our local science museum and we have a vote thursday about the kepler gallery. There's a proposal to add these interactive stations where visitors can use keplers actual 1619 harmonic tables to generate personal "celestial harmony" predictions - not full horoscopes, but these mathematical music-sphere charts he calculated for clients. Half the board says this is just giving astrology a pretty platform and violates our evidence-based mission, the other half says hiding keplers astrology makes us lie about history. Ive been reading on my own and it seems kepler only trusted astrology when it kept what id call "predictive humility" - he treated it like a weather warning not a fate sentence, never as certain as his geometry. So heres what I need: draft the memo I'll circulate before the meeting recommending exactly what we should do - approve with conditions, reject, or approve with a timeline for changes - and it has to seriously deal with the people who think any astrology display turns our museum into a pseudoscience fair. Please dont just list books or tell me to read more, I need arguments and a concrete course of action with a real time frame.
reasoning: |-
