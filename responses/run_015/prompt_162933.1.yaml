answer: |-
  Hi there,

  This is a genuinely sharp observation, and you are right to feel that the standard vocabulary like Goodhart's Law or concept drift doesn't quite land. You have described a failure mode that is structural and evolutionary rather than adversarial or statistical, and disentangling it requires looking at how we define measurement itself. I will walk through the candidates I considered and why I discarded them before landing on the framework that actually fits your description, because the distinction matters for how you fix it.

  The first thing to rule out, as you already suspected, is Goodhart's Law and its cousin Campbell's Law. The core mechanism of Goodhart is optimization pressure. It assumes an agent is looking at the measure and changing their behavior to maximize the score, thereby breaking the correlation between the score and the goal. In your case, nobody is optimizing for the latency number; the system is evolving for other reasons, and the metric is drifting as a side effect. The measure isn't being hacked; it is being eroded by maintenance. Similarly, the McNamara fallacy is about ignoring things you cannot measure, whereas you are measuring something quite carefully, just not the thing you think you are measuring anymore. So we can drop the adversarial and the neglectful frameworks; this is not about gaming or blindness, it is about drift.

  The next candidate is concept drift from machine learning. In ML, concept drift usually means the statistical properties of the target variable or the input data have changed over time. For example, users might start behaving differently, so the old model no longer predicts well. But in your scenario, the users and their pain might be exactly the same, and the system performance might be identical from their perspective. What has changed is the map, not the territory. Concept drift assumes the definition of the label is fixed and the world moves; you are describing a situation where the world and the system moved, but the definition of the label moved with them in a way that severed its link to the original intent. So concept drift is close, but it focuses on the data distribution rather than the semantic definition of the measurement procedure.

  You also mentioned surrogate endpoints in medicine, which is perhaps the closest analog. In clinical trials, you measure something easy like blood pressure instead of something hard like heart attacks. If a drug lowers blood pressure but doesn't stop heart attacks, the surrogate failed. This is very similar to your latency example, where latency is a surrogate for user satisfaction. However, in medicine, the failure is usually that the correlation breaks. In your case, the correlation might still hold, but the definition of the surrogate itself has shifted silently. You are no longer measuring blood pressure; you are measuring blood pressure plus some artifact of the cuff, but you are still calling it blood pressure. This is a subtle but important distinction. The surrogate didn't fail; the definition of the surrogate drifted.

  This brings me to the framework that actually fits, which comes from psychometrics and the philosophy of science. In these fields, we distinguish between the construct and the operationalization. The construct is the abstract thing you care about, like user pain or system health. The operationalization is the specific procedure you use to assign a number to that construct, like p95 latency on a specific span. Validity is the degree to which your operationalization actually measures the construct. What you are describing is a threat to construct validity caused by changes in the instrument. In experimental design, this is formally called an instrumentation threat. It happens when the measuring instrument changes over the course of a study, making pre-and-post comparisons invalid. You are running a continuous, multi-year experiment where the instrument is your observability stack. Every time you split a service or change a tracing rule, you are changing the instrument. If you do not re-validate the link between the new instrument and the original construct, you lose validity.

  However, instrumentation threat describes the technical mechanism, not the social phenomenon you are worried about. You asked about the downstream bit, where the number keeps its authority even after its meaning has moved. In philosophy, this is called reification. It is the error of treating an abstract concept or a measurement as if it were a concrete, immutable thing. When you keep the dashboard slot and the alert threshold fixed while the definition underneath changes, you are reifying the metric. You are treating the number as the reality rather than as a representation of the reality. This is why the authority persists; the organization has forgotten that the number is a map and starts treating it as the territory. The resemblance to Goodhart here is superficial. Goodhart is about the map distorting the territory because people are walking on the map. This is about the map being redrawn while everyone insists it still shows the same path.

  So, is there an established name for the combination of operational drift and reification? There is no single law like Goodhart's that covers this specific non-adversarial decay. In public health and epidemiology, you will sometimes hear the term indicator drift, which refers to when the definition of a health indicator changes over time, complicating trend analysis. In software engineering, people sometimes say metric rot or measurement debt, but these are slang and often imply the metric becomes noisy rather than semantically hollow. Your term, zombie metrics, is actually surprisingly philosophically robust. In philosophy of mind, a philosophical zombie is something that behaves exactly like a human but has no inner experience or consciousness. Your metrics behave like valid measures—they output numbers, they trigger alerts, they sit on dashboards—but they lack the inner semantic connection to the business value they were supposed to represent. They are alive in procedure but dead in meaning.

  If you want a more formal term to use in documentation or post-mortems, I would recommend operational drift. It distinguishes the problem from data drift or adversarial gaming. It signals that the operation of the measurement has drifted from the intent. You can define it precisely as a situation where the procedural definition of a metric evolves through justified local changes while the interpretive framework thresholds and goals remains static, resulting in a loss of construct validity. The boundary between this and a legitimate redefinition is documentation and validation. If you change the definition and update the threshold and explicitly state that this is a new baseline, you are managing the metric. If you change the definition and keep the old threshold and pretend nothing happened, you are suffering from operational drift.

  To answer your final question about the authority bit, I would stick with reification. It is distinct from Goodhart. Goodhart is a failure of control; reification is a failure of ontology. You are treating a contingent measurement as a necessary truth. The two can happen together, but they are different mechanisms. You can have a reified metric that nobody is optimizing for, which is exactly your situation. So if you need a label for the whole phenomenon, I think zombie metric is the best colloquial term because it captures the uncanny valley of a number that looks right but means nothing, but operational drift is the term you should use when you need to explain the mechanism to engineers. It tells them exactly where the bug is: not in the data, and not in the incentives, but in the definition of the measurement procedure itself.

  I hope this helps you carve out the concept properly. It is a subtle failure mode, but recognizing it as a validity issue rather than a performance issue is the first step to fixing it.

  Best regards

  Your Measurement Philosopher
