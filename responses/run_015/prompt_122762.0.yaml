  # The Heterogeneity Problem: A Logical Taxonomy of Pleasure

  ### The Four Branch Tests
  *Answer **Yes** or **No** to proceed down the tree.*

  1.  **The Grafting Test:** Is the pleasantness of an experience a distinct component that could in principle be detached and attached to a different phenomenology?
  2.  **The Absorption Test:** Can an episode be pleasant even if the subject is wholly absorbed and notices no distinct "pleasant feeling"?
  3.  **The Repudiation Test:** Can an episode count as pleasant for a subject even if she reflectively refuses to count it as pleasant or good?
  4.  **The Exchange Test:** Are any two pleasures comparable as more or less pleasant on a single quantitative scale?

  ---

  ### The Taxonomy Tree (Live & Dead Leaves)

  **1. Sensationism** (Yes, No, No, Yes)
  *   **Structure:** Pleasantness is a detachable felt-quality; it must be felt; subject is authoritative; all pleasures are commensurable.
  *   **Awkward Commitment:** Must explain why the "tingle" of an itch-scratch and the "tingle" of understanding a proof feel so different yet share a common ingredient.
  *   **Sorts:** *Itch-scratching* (as a feeling); *Bath vs. Proof* (as comparable quantities).

  **2. Adverbialism** (No, No, No, Yes) **[Shares Leaf with Mode Intentionalism]**
  *   **Structure:** Pleasantness is an intrinsic mode of experiencing; must be phenomenally apparent; subject is authoritative; all pleasures are commensurable.
  *   **Awkward Commitment:** Must posit a mysterious "manner of sensing" that is introspectively visible but lacks distinct sensory quality.
  *   **Sorts:** *Itch-scratching* (as a mode of relief); *Bath vs. Proof* (as comparable intensities).

  **3. Attitudinal Hedonism** (No, Yes, No, Yes)
  *   **Structure:** Pleasantness is a pro-attitude toward content; need not be felt as a sensation; subject is authoritative; all pleasures are commensurable.
  *   **Awkward Commitment:** Must allow that a subject can be pleased while attending entirely to a painful or neutral object (e.g., grieving a loss "gladly").
  *   **Sorts:** *Absorbed problem-solving* (as enjoyment of the task); *Bath vs. Proof* (as comparable attitudes).

  **4. Desire Functionalism** (No, Yes, Yes, Yes)
  *   **Structure:** Pleasantness is the satisfaction of a desire; need not be felt; subject can be wrong about her own good; all pleasures are commensurable.
  *   **Awkward Commitment:** Must count repudiated experiences (e.g., manipulated satisfaction) as pleasant for the subject despite her reflective misery.
  *   **Sorts:** *Absorbed problem-solving* (as desire satisfaction); *Repudiated joke* (as pleasant if desired, despite guilt).

  **5. Qualitative Hedonism** (No, No, No, No)
  *   **Structure:** Pleasantness is an intrinsic mode; must be phenomenally apparent; subject is authoritative; pleasures are incommensurable kinds.
  *   **Awkward Commitment:** Must deny that a long duration of "lower" pleasure could ever outweigh a short duration of "higher" pleasure, violating intuitive trade-offs.
  *   **Sorts:** *Itch-scratching* (lower kind); *Bath vs. Proof* (incommensurable kinds).

  **6. Disjunctivism** (No, Yes, No, No)
  *   **Structure:** "Pleasure" names a disjunction of distinct attitudes; need not be felt; subject is authoritative; pleasures are incommensurable kinds.
  *   **Awkward Commitment:** Must accept that there is no single psychological natural kind that unifies the category of pleasure.
  *   **Sorts:** *Absorbed problem-solving* (one kind); *Bath vs. Proof* (different kinds).

  **7. Eliminativism** (No, Yes, Yes, No)
  *   **Structure:** No unified property exists; need not be felt; subject can be wrong; no single scale exists.
  *   **Awkward Commitment:** Must explain why we persist in using the word "pleasure" if it fails to pick out any real similarity in the world.
  *   **Sorts:** *Repudiated joke* (not truly pleasant); *Bath vs. Proof* (no common metric).

  **8. The "Phantom Feeling" Cell** (Yes, Yes, _, _) **[Unoccupied]**
  *   **Diagnosis:** **Incoherent.** If pleasantness is a detachable component (Yes 1), it must be noticeable (No 2); a detachable feeling that goes unfelt is a contradiction.

  **9. The "Alien Component" Cell** (Yes, No, Yes, _) **[Unoccupied]**
  *   **Diagnosis:** **Merely Unattractive.** Posits a felt ingredient that the subject can be wrong about, combining the baggage of sensationism with the counter-intuitiveness of externalism.

  **10. The "Invisible Mode" Cell** (No, No, Yes, No) **[Unoccupied]**
  *   **Diagnosis:** **Simply Unexplored.** Suggests an inseparable phenomenal mode that the subject can be wrong about and that is incommensurable; theoretically possible but no major advocate.

  ---

  ### Case Sorting & Indistinguishability

  | Case | Sorted By | Why |
  | :--- | :--- | :--- |
  | **Itch-scratch** | Sensationism / Adverbialism | Relies on distinct phenomenology or mode (Absorption=No). |
  | **Absorbed Proof** | Attitudinal / Disjunctivism | Relies on pleasure without distinct feeling (Absorption=Yes). |
  | **Repudiated Joke** | Desire Functionalism | Relies on pleasure despite reflective refusal (Repudiation=Yes). |
  | **Bath vs. Proof** | Qualitative / Disjunctivism | Relies on incommensurability of kinds (Exchange=No). |

  **Indistinguishable Leaves:**
  The tree cannot separate **Adverbialism** from **Mode Intentionalism** (both occupy Leaf 2).
  *   **Further Question Needed:** "Does the pleasantness represent the object as good, or is it merely a non-representational modification of the experience?"
