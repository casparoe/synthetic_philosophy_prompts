  8.  **Final Polish:** Ensure the advice on "where to fold" is clear. The user should fold on the metaphysics (it's not their fight) but stand firm on the normativity/duty distinction.

  *(Wait, one more check on the "Hope Nobody Asks" question)*: The user guesses it's the Prior Fault/Meta-omission relabeling. I think they are right that it's a *doctrinal* threat, but the *conceptual* threat (Normativity = Duty) is worse. I will tell them the Prior Fault question is manageable if they frame meta-omissions as structural, but the Normativity objection is the one that kills the thesis. I'll stick with their guess for the "Hope nobody asks" but warn them the Normativity one is the "Silent Killer." Actually, better advice: The Prior Fault question is the one that *sounds* boring but exposes that the theory adds no value. I'll validate their guess but elevate the Normativity objection in the ranking.

