answer: |-
  **PREP SHEET: OMISSION, DUTY, AND NORMALITY**
  **Audience:** Legal Philosophy + 2 Metaphysicians (Skeptics)
  **Time:** 30 min talk / 25 min Q&A

  ### STRATEGIC OVERVIEW

  **(a) The Concession to Make Up Front**
  Concede immediately that you are not solving the *metaphysics* of omissions. State clearly: *"I am bracketing the question of whether omissions are events, entities, or logical constructs. My claim is conditional: whatever causal work omissions are doing in our best theories, the 'duty' constraint is not part of that causal machinery."*
  *Why:* This disarms the two metaphysicians. If you try to defend omissions as causal relata, they will eat your clock. If you treat causation as a functional role in attribution, you bypass their ontology.

  **(b) The Question You Hope Nobody Asks**
  You guessed: *"Isn't the meta-omission business just the prior-fault / culpable-incapacity doctrine relabelled?"*
  *Verdict:* **You are right to fear this.** It is the most damaging *doctrinal* objection because it renders your innovation redundant. However, the most damaging *conceptual* objection is actually about the normativity of "normality" (see Objection #1).
  *Advice:* If asked the prior-fault question, do not hedge. Own the relabelling. Argue that "prior fault" is too narrow (requires culpability) whereas "meta-omission" captures structural negligence where the agent isn't necessarily blameworthy for the setup, but the causal explanation still lies there.

  ---

  ### THE SIX OBJECTIONS (RANKED BY DAMAGE)

  #### 1. The "Normativity of Normality" Objection
  **Who:** The Legal Philosophers (Omission/Complicity specialists)
  **The Phrasing:** "You draw a sharp line between 'causal normality' and 'legal duty.' But your criterion for normality is role-based (the lifeguard vs. the sunbather). Roles are normative constructs. If 'what is normal' is determined by 'what the agent ought to be doing,' you haven't eliminated duty from causation; you've just smuggled duty into the causal baseline under the label of 'default.' You're doing deontology in counterfactual clothing."
  **The 2-Minute Reply:** "I distinguish *statistical* normality from *normative* normality, but I grant they overlap in institutional settings. However, they come apart in edge cases. Consider a lifeguard who is off-duty but in uniform. Statistically, we expect them to act. Legally, they may have no duty. My theory predicts we will still intuitively say they 'caused' the death more than the sunbather, even if liability is blocked. The duty rule is the *liability* switch; the normality judgment is the *causal* engine. They track differently."
  **The Soft Spot:** This is your weakest conceptual link. If 'normal' just means 'socially expected,' and social expectations are constituted by duties, the distinction collapses.
  **Where to Fold:** If they press that social roles *are* duties, concede that the *language* of duty is unavoidable but insist the *function* differs. Duty limits punishment; normality explains the harm. Don't die on the hill that they are entirely distinct concepts; die on the hill that they serve different juridical functions.

  #### 2. The "Sparse Relata" Objection
  **Who:** The Two Metaphysicians
  **The Phrasing:** "You're treating absences as if they have properties like 'normality.' If omissions aren't events, they can't be 'default' or 'deviant.' You're reifying nothing. A causal relation requires two existents. If the omission doesn't exist, its 'normality' is a property of a non-entity. You're building a causal theory on a category mistake."
  **The 2-Minute Reply:** "I'm not committing to an ontology of absences. I'm offering a pragmatic account of causal *attribution*. When we say 'the lack of water caused the plant to die,' we are selecting a salient counterfactual from a background of infinite non-events. 'Normality' is the selection heuristic. Whether the omission 'exists' is irrelevant to the fact that we use this heuristic to assign responsibility. I'm explaining the practice, not the metaphysics."
  **The Soft Spot:** They will argue that if the relata don't exist, the relation is false, not just pragmatic.
  **Where to Fold:** Fold hard here. Tell them: *"If you reject omission causation entirely, my thesis becomes: 'The duty requirement is a liability limiter bolted onto a fictional causal relation.' I can live with that."* Do not fight their metaphysics.

  #### 3. The "Prior Fault / Culpa in Causa" Objection (Your Fear)
  **Who:** The Doctrinalists
  **The Phrasing:** "Your 'meta-omission' looks exactly like *culpa in causa*. If I don't set an alarm, and I oversleep, the law handles this via prior fault. Why do we need a new taxonomy of 'second-order omissions'? You're solving a problem the doctrine already solves, but with more jargon."
  **The 2-Minute Reply:** "Prior fault requires *culpability* at the earlier stage. Meta-omission does not. Consider a doctor who fails to set a reminder due to systemic hospital overload, not personal blameworthiness. Standard prior-fault doctrines might exculpate because the initial omission wasn't 'grossly negligent.' My account says the *causal explanation* of the patient's harm is still the failure to set the system, regardless of whether that failure was itself punishable. It separates the causal story from the culpability story."
  **The Soft Spot:** Courts hate separating causation from culpability in negligence.
  **Where to Fold:** Admit that in *criminal* law, they often merge. Argue that your distinction is vital for *tort* or *theoretical clarity*, even if criminal doctrine currently conflates them.

  #### 4. The "Over-Inclusion / Complicity" Objection
  **Who:** Complicity Specialists
  **The Phrasing:** "If causation turns on 'normality,' aren't we all causing everything we don't prevent? It's 'normal' for a citizen to call the police when they see a crime. If I don't, and I'm statistically abnormal in that moment, have I causally contributed? Your theory risks making everyone a principal in every omission case, relying solely on duty to prune the liability. That inverts the actus reus."
  **The 2-Minute Reply:** "No, because 'normality' is agent-relative and context-specific. For the random citizen, scrolling on a beach is the default. For the lifeguard, scanning the water is the default. The 'normal' action is indexed to the specific agent's situation and capacities at time *t*. We aren't all causing everything because we aren't all in the 'rescue' role. The baseline is local, not universal."
  **The Soft Spot:** Defining the "local baseline" without smuggling in duty.
  **Where to Fold:** If they press that the "local baseline" is defined by social expectations (i.e., duties), refer back to Objection #1.

  #### 5. The "Doctrinal Error Theory" Objection
  **Who:** Legal Philosophers (General)
  **The Phrasing:** "You claim courts are confused—that they treat duty as a causal constraint when it's really a liability limiter. But courts are consistent. Why posit a massive error theory? Why not just say the law treats duty as a *proxy* for causal salience? Your revisionism buys you little if the operational outcome is the same."
  **The 2-Minute Reply:** "Because it matters for hard cases. When courts say 'no duty, therefore no causation,' they block inquiry into whether the omission was actually a difference-maker. In meta-omission cases (like the alarm), courts often struggle to find causation because the link is indirect. If we recognize the causal chain exists independently of duty, we can better handle cases where duty is ambiguous but causal contribution is clear (e.g., corporate negligence)."
  **The Soft Spot:** It's hard to prove courts are actually confused rather than just using shorthand.
  **Where to Fold:** Concede that in 90% of cases, the proxy works. Argue your theory is only needed for the 10% of edge cases (like meta-omissions) where the proxy breaks.

  #### 6. The "Mens Rea Separation" Objection
  **Who:** Criminal Law Theorists
  **The Phrasing:** "If you separate causation from duty, you risk creating strict liability for omissions. If the lifeguard causally contributes by not swimming (per your normality thesis), but we remove duty as a causal constraint, haven't you made the omission a guilty act pending only mens rea? You've expanded the actus reus net."
  **The 2-Minute Reply:** "Not at all. I'm arguing duty remains a *necessary condition for liability*, just not for *causation*. The actus reus requires (1) Causal Contribution + (2) Duty. I'm just clarifying that (1) is satisfied by normality/default, and (2) is a separate normative hurdle. The net doesn't expand; the architecture just becomes more honest."
  **The Soft Spot:** None really, this is your strongest doctrinal defense.
  **Where to Fold:** Nowhere. This is your home turf.

  ---

  ### FINAL TACTICAL NOTES

  1.  **On the Metaphysicians:** Do not try to convert them. If they say "omissions aren't causes," nod and say, *"Then my claim is about the structure of our causal *talk*, not the structure of the world."* This keeps them from derailing the room.
  2.  **On the "Meta-Omission":** Be prepared to draw this on the whiteboard.
      *   *Time 1:* Fail to set alarm (Meta-omission).
      *   *Time 2:* Sleep through work (First-order omission).
      *   *Time 3:* Patient dies (Harm).
      *   *Point:* Standard theory struggles to link Time 1 to Time 3 causally without moralizing. Your theory says Time 1 is the causal driver because it deviated from the "management default."
  3.  **Where to Fold:** Fold on the metaphysics (Objection #2) and fold on the total separation of Duty/Normality (Objection #1). If you insist they are *completely* distinct, you will look naive. If you insist they are *functionally* distinct, you look sophisticated.
  4.  **Where to Stand Firm:** Stand firm on the Meta-Omission utility (Objection #3). This is your original contribution. If you let them reduce it to "prior fault," you lose the paper's value. Argue that "prior fault" is too moralized; "meta-omission" is structural.

  **Good luck. Keep the lifeguard case central; it's your strongest intuition pump.**
