prompt: |-
  I've got a works-in-progress talk next week (30 minutes plus about 25 of Q&A) in front of a criminal-law theory group: mostly legal philosophers who work on omission liability, complicity and the act/omission distinction, plus two metaphysicians who think omissions aren't events and so can't stand in causal relations at all. The thesis I'm defending is that the duty requirement the law bolts onto omission liability isn't tracking causation — what actually drives causal judgements about omissions is whether the omitted action was the normal or default thing for someone in that agent's role to be doing, and the duty talk is really a liability-limiting device that got mistaken for a causal constraint. The case I build it around is a lifeguard and a random sunbather, both scrolling their phones while someone drowns ten metres out. I also want to lean on a distinction of my own between first-order omissions (not doing X at the time) and what I'm calling second-order or meta-omissions (not arranging things so that you'd end up doing X — no alarm set, no note, no routine, no backup), and claim that a lot of negligence cases are really meta-omission cases that the standard difference-making accounts mishandle, because the thing that's a difference-maker and the thing that explains the harm come apart.

  What I want from you is a prep sheet: the six or so objections I'll actually get from this particular crowd, ordered by how much damage they'd do, each one phrased the way these people would phrase it — legal-doctrinal vocabulary for the lawyers, sparse-relata stuff for the metaphysicians — with a two-minute reply and an honest note on where that reply is soft. Be committed about it: give me a real ranking, tell me which objections genuinely have force and which are just reflexes, and tell me where I should fold rather than hedge. Also flag (a) the one thing I should concede up front in the talk rather than wait to be caught on, and (b) the question I'm hoping nobody asks — my own guess is something like "isn't the meta-omission business just the prior-fault / culpable-incapacity doctrine relabelled", but say so if you think the really dangerous one is a different one. Don't bother attributing positions to named authors or papers, I know who says what, I just need the objections.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Legal philosopher/academic, likely mid-to-late career given the specificity of the thesis and the confidence in the "meta-omission" distinction.
      *   **Audience:** Criminal law theory group. Composition: Mostly legal philosophers (omission liability, complicity, act/omission), plus two metaphysicians (skeptics about omissions as events/causes).
      *   **Topic:** Omission liability, specifically the relationship between duty, causation, and "normality/defaults."
      *   **Core Thesis:** Duty requirements in law don't track causation. Causal judgments about omissions track "normal/default" actions for a role. Duty is a liability-limiting device, not a causal constraint.
      *   **Key Case:** Lifeguard vs. Sunbather (both scrolling, victim drowns).
      *   **Key Innovation:** First-order omissions (not doing X) vs. Second-order/Meta-omissions (not arranging to do X). Claim: Negligence is often meta-omission; standard difference-making accounts fail here because the difference-maker and the explanation come apart.
      *   **Format:** Prep sheet with ~6 objections, ranked by damage, phrased for the audience (legal vs. metaphysical), 2-minute replies, honesty about soft spots, concession advice, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Vulnerability 1 (Metaphysics):* If omissions aren't events (as the two metaphysicians think), talking about their "causal status" or "normality" might be category mistakes. They might attack the ontology directly.
      *   *Vulnerability 2 (Normativity vs. Description):* The user claims duty is *just* a liability limiter, not causal. But "normality" is itself normative (what *should* they be doing?). The line between "is" (normal) and "ought" (duty) might blur.
      *   *Vulnerability 3 (The Meta-Omission):* Is this just infinite regress? If I didn't set an alarm, why didn't I set the alarm? Also, the user anticipates the "prior fault" objection, but I need to evaluate if that's actually the *most* dangerous one or if something else is worse.
      *   *Vulnerability 4 (Legal Doctrine):* Courts *say* duty is a prerequisite for causation in omissions. If the user says courts are confused, they need a strong error theory.
      *   *Vulnerability 5 (Complicity/Overlap):* The audience works on complicity. Does this theory accidentally make everyone complicit in everything (since everyone omits to prevent everything)? The "normality" constraint needs to be tight.
      *   *Vulnerability 6 (Mens Rea/Culpability):* If causation is separated from duty, does culpability collapse?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Metaphysician's Hammer):* "You're reifying nothing." If omissions aren't events, they can't be "normal" or "abnormal" in a causal sense. This attacks the foundation.
      *   *Objection 2 (The Normative Collapse):* "Normality *is* Duty." If you define 'normal' by social roles (lifeguard), you've just smuggled duty back in under the label of 'normality.'
      *   *Objection 3 (The Meta-Omission Regress):* "Prior Fault in Disguise." (The user's guess). Is this just *culpa in causa*? If so, why the new taxonomy?
      *   *Objection 4 (Doctrinal Fidelity):* "The Law Says Otherwise." Courts treat duty as a gatekeeper for causation. You're proposing revisionism without explaining why the current structure persists if it's confused.
      *   *Objection 5 (The Over-inclusion Problem):* "The Scrolling Sunbather." If normality drives causation, does the sunbather *cause* the death if scrolling is abnormal for a rescuer? Wait, the user says sunbather *doesn't* cause. The objection needs to be: "What makes the lifeguard's action 'normal'? If it's the job description, that's duty."
      *   *Objection 6 (Mens Rea Separation):* "Causation without Culpability?" If we separate duty (liability) from causation, do we end up with strict liability for omissions?

      *Refining the Ranking:*
      *   *Highest Damage:* The Normative Collapse (Objection 2). If 'normality' just *is* duty, the thesis collapses. It's the internal contradiction.
      *   *Second Highest:* The Metaphysical Ontology (Objection 1). The two metaphysicians in the room will pounce. If omissions don't exist, the theory is about ghosts.
      *   *Third:* The Prior Fault/Meta-Omission label (Objection 3). If this is just old wine, the innovation is illusory.
      *   *Fourth:* Doctrinal Error Theory (Objection 4). Why are judges wrong?
      *   *Fifth:* Over-inclusion/Complicity (Objection 5).
      *   *Sixth:* Mens Rea/Strict Liability (Objection 6).

      *Re-evaluating the "Prior Fault" guess:* The user thinks "Isn't this prior fault?" is the question they hope nobody asks. I need to assess if that's actually the *most* dangerous. Actually, the "Normativity of Normality" is more dangerous because it undermines the core distinction (Causation vs. Duty). Prior fault is a doctrinal mapping issue; Normativity is a conceptual issue. I will advise the user that their guess is right to worry about, but the Normativity objection is deadlier.

  4.  **Developing the Replies & Soft Spots:**
      *   Need to be punchy (2 mins).
      *   Need to admit where the theory is stretchable.
      *   Need to use the right lingo ("sparse relata," "counterfactual dependence," "normative expectation," "culpa in causa").

  5.  **Finalizing the Prep Sheet Structure:**
      *   **Concession:** What to give away early? (Likely that 'duty' language is entrenched, or that metaphysics of omissions is contested).
      *   **The "Hope Nobody Asks":** Validate or correct the user's guess.
      *   **The 6 Objections:** Ranked, Phrased, Replied, Soft Spot.
      *   **Strategic Advice:** Where to fold.

  6.  **Writing the Content (incorporating specific constraints):**
      *   *Tone:* Academic, direct, slightly combative but collegial (it's a WIP).
      *   *Vocabulary:* "Relata," "Counterfactuals," "Normative expectations," "Doctrinal fit," "Culpa in causa."
      *   *Specifics:* Use the Lifeguard/Sunbather case. Use the Meta-omission distinction.

      *(Self-Correction during drafting)*: I need to make sure I don't attribute positions to named authors as requested. Keep it anonymous.
      *(Refining the Metaphysics Objection)*: Make sure it sounds like the "sparse relata" crowd. "You're treating absences as positive facts."
      *(Refining the Normativity Objection)*: This is the killer. If 'normal' means 'expected by role,' that's a duty. The user needs to distinguish statistical normality from normative normality.

  7.  **Final Review against constraints:**
      *   6 objections? Yes.
      *   Ranked by damage? Yes.
      *   Phrased for audience? Yes.
