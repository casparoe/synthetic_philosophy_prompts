answer: |-
  ### The Principle of Sovereign Necessity

  To reconcile your verdicts into a single, coherent framework, I propose the **Principle of Sovereign Necessity**. This principle distinguishes "Dirty Hands" (DH) from mere complicity or corruption by focusing on the stakes, the motive, and the nature of the norm violated.

  **The Principle:**
  *A political agent has Dirty Hands if and only if:*
  1.  **Catastrophic Necessity:** The act is the strictly unavoidable means to prevent a catastrophic threat to the political community’s survival or fundamental security (Supreme Emergency).
  2.  **Pure Public Motive:** The act is motivated exclusively by public duty, devoid of private gain, partisan advantage, or collusive benefit to third parties.
  3.  **Substantive Moral Violation:** The wrongdoing violates a substantive moral norm (e.g., against killing, torturing, deceiving) rather than corrupting the constitutive procedural rules that legitimize the office itself (e.g., against bribery, electoral manipulation).

  ---

  ### Case Analysis and Clause Mapping

  This principle preserves your verdicts on all five cases without requiring an overturn, though Case 5 sits at the boundary of Clause 3.

  *   **Case 1 (Torture): DH.**
      *   *Motivating Clause:* **Catastrophic Necessity.** The imminent attack constitutes a Supreme Emergency.
      *   *Fit:* Violates a substantive moral norm (torture) for public safety, with no private gain.
  *   **Case 2 (Austerity): Not DH.**
      *   *Excluding Clause:* **Pure Public Motive.** Voting for injustice out of "party solidarity" fails the requirement of exclusive public duty; it is partisan preservation, not catastrophe prevention.
  *   **Case 3 (Executions): DH.**
      *   *Motivating Clause:* **Catastrophic Necessity.** Securing a democratic order against restoration is a foundational survival issue.
      *   *Fit:* Violates a substantive moral norm (killing innocents) for the regime's survival. The "foundational" nature you noted is captured by the "survival" requirement in Clause 1.
  *   **Case 4 (Bribe): Not DH.**
      *   *Excluding Clause:* **Substantive Moral Violation.** Bribery violates the *constitutive procedural rules* of office integrity. It introduces a private, collusive transaction (Mayor + Developer) that rots the legitimacy of the decision-making process itself, distinct from a unilateral moral violation like torture. Additionally, it fails Clause 1 (a clinic, while good, is not a catastrophic threat to the state's survival).
  *   **Case 5 (Deception): DH.**
      *   *Motivating Clause:* **Catastrophic Necessity.** Preventing war is a Supreme Emergency.
      *   *Fit:* While deception can be procedural, "systematic deception of an ally" to prevent war is treated here as a substantive moral violation of trust, undertaken unilaterally by the diplomat for public safety. *Note: This is the boundary case; if deception were deemed merely "standard procedure," this would not be DH, but your verdict requires we treat it as a moral stain.*

  **Honest Assessment on Overturning Verdicts:**
  Strictly speaking, **none of your verdicts must be overturned** to maintain this principle. However, intellectual honesty demands I flag **Case 5** as the fragile point. In many political theories, diplomatic deception is considered a constitutive rule of the office (statecraft) rather than a moral violation. To keep Case 5 as DH, we must insist that *ally* deception violates a deeper moral norm of fidelity than *enemy* deception. If simplicity demanded a harder line, Case 5 would be reclassified as "Standard Statecraft" (Not DH), but your intuition that it carries a personal stain is defensible under Clause 3.

  ---

  ### Prediction on the Unlisted Case

  **Case:** A democratically elected leader secretly falsifies election data to block an authoritarian victory, then confesses and resigns.

  **Verdict: Dirty Hands.**

  **Reasoning:**
  This case tests the limit between Clause 1 (Necessity) and Clause 3 (Nature of Violation).
  1.  **Catastrophic Necessity:** Blocking an "authoritarian victory" qualifies as a Supreme Emergency comparable to Case 1 (Terrorist Attack) and Case 3 (Democratic Order). It exceeds the stakes of Case 4 (Clinic).
  2.  **Pure Public Motive:** The leader confesses and resigns, proving the act was not for private retention of power but for the regime's survival. This distinguishes it from Case 4 (Bribe), where the agent typically retains the benefits of corruption, and Case 2 (Austerity), which served the party.
  3.  **Substantive Moral Violation:** This is the critical tension. Election fraud is a procedural violation (like bribery). However, under the Principle of Sovereign Necessity, when a procedural norm stands between the state and totalitarian collapse, violating it becomes a *moral* tragedy rather than mere corruption. The resignation confirms the agent treats it as a moral stain, not a political tactic.

  Unlike the Mayor in Case 4, who corrupts the *administration* for a specific good (clinic), this leader sacrifices their *legitimacy* to save the *system*. Because the stakes meet the "Catastrophic" threshold (Clause 1) and the agent accepts the personal stain (resignation), this rises to **Dirty Hands**. The act is a tragic violation of democratic integrity to save democracy itself, structurally identical to executing innocents to save democratic order (Case 3).
