      *   **Role:** Expert philosopher of mind and cognitive science (familiar with self-reference, semantic theory, philosophy of formal systems).
      *   **Task:** Evaluate a specific "distributed-location view" of semantic content based on Hofstadter's tri-level message framework (Frame, Outer, Inner).
