answer: |-
  ### Phase 1: Edge Case Brainstorming
  *Before specifying the desiderata, we must map the terrain where standard theories fracture.*

  *   **The Masochist's Paradox:** Painful stimuli reported as "pleasurable." Is this a reclassification of pain, or a distinct pleasure layered on pain? If the latter, what is the qualitative difference?
  *   **The Relief Problem:** The cessation of a toothache feels good. Is this a positive hedonic tone or merely the zeroing of a negative? If it's zeroing, why does it motivate future avoidance differently than neutral states?
  *   **The Intellectual "Click":** Solving a proof or understanding a joke. Often no sensory component, yet distinctly pleasurable. Is this a "feeling" or a cognitive update?
  *   **Schadenfreude & Moral Pleasure:** Pleasure derived from another's misfortune or one's own moral superiority. Contains a cognitive evaluation essential to the pleasure; remove the evaluation, remove the pleasure.
  *   **Anhedonic Wanting:** Neural stimulation (e.g., nucleus accumbens) drives compulsive seeking ("wanting") without reported enjoyment ("liking"). Is this pleasure?
  *   **Melancholic Pleasure:** Enjoying sad music or tragic films. The valence is mixed; the object is negative, the experience is sought.
  *   **Unconscious Pleasure:** Can a subject enjoy a stimulus they do not consciously register (subliminal priming affecting mood)?
  *   **The Boredom Gap:** Is the cessation of boredom pleasure, or is boredom a pain whose cessation is relief?

  ---

  ### Phase 2: Full Desiderata Specification
  *A viable theory of pleasure must satisfy the following constraints to be considered complete.*

  #### 1. Ontological Desiderata
  *   **Heterogeneity Accommodation:** Must account for the lack of a single, common phenomenological "tingle" across all instances (sensory, intellectual, emotional).
  *   **Unity Condition:** Must explain what makes all these heterogeneous states instances of *pleasure* rather than desire, relief, or neutral cognition. There must be a natural kind property.
  *   **Object-Directedness Variance:** Must handle both undirected states (euphoria, chemically induced) and directed states (pleasure *in* the music).

  #### 2. Phenomenological Desiderata
  *   **Consciousness Requirement:** Must specify whether pleasure entails conscious awareness. (Non-negotiable: If it doesn't feel like anything to the subject, it cannot function as a hedonic guide).
  *   **Valence Clarity:** Must distinguish positive valence from neutral valence and negative valence without circularity (i.e., not defining pleasure as "what we want").
  *   **Intensity Scaling:** Must allow for degrees of pleasure that are comparable across types (e.g., is a meal better than a symphony?).

  #### 3. Normative & Motivational Desiderata
  *   **Intrinsic Normativity:** Must explain why pleasure provides a *prima facie* reason for action simply in virtue of being experienced, not merely because it satisfies a prior desire.
  *   **Motivation Independence:** Must distinguish pleasure from desire. (One can feel pleasure without wanting more [satiation]; one can want without pleasure [addiction]).
  *   **Higher/Lower Distinction:** Must allow for qualitative distinctions between pleasures without appealing to external moral values (avoiding Mill's circularity).

  #### 4. Empirical Desiderata
  *   **Neural Distributedness:** Cannot posit a single "pleasure center." Must align with distributed networks (opioid systems for liking, dopamine for wanting, cortical processing for cognitive pleasure).
  *   **Dissociation Compatibility:** Must accommodate the empirical dissociation between "wanting" (motivation) and "liking" (hedonic impact).
  *   **Temporal Dynamics:** Must account for anticipation, consummation, and memory, which often have different hedonic tones.

  ---

  ### Phase 3: Distinctions & Constraints

  | Distinction | Requirement | Status |
  | :--- | :--- | :--- |
  | **Pleasure vs. Liking** | Theory must separate the hedonic impact from the behavioral expression of preference. | **Non-Negotiable** |
  | **Pleasure vs. Relief** | Theory must distinguish positive hedonic tone from the subtraction of pain. | **Non-Negotiable** |
  | **Pleasure vs. Desire** | Theory must allow for pleasure without prior desire (surprise pleasure). | **Non-Negotiable** |
  | **Higher vs. Lower** | Theory must differentiate based on internal structure, not external moral judgment. | **Relaxable** (Can be treated as a secondary feature) |
  | **Conscious vs. Unconscious** | Theory must decide if unconscious pleasure is coherent. | **Relaxable** (Can define unconscious as "dispositional") |

  **Empirical Constraints (Hard Limits):**
  1.  **No Homunculus:** No single neural substrate correlates with all pleasure types.
  2.  **Opioid/Dopamine Split:** Hedonic impact (liking) is opioid-mediated; Motivation (wanting) is dopamine-mediated. A theory conflating these is empirically false.
  3.  **Context Dependence:** The same sensory input (e.g., sugar) yields different hedonic tones based on physiological state (satiety).

  ---

  ### Phase 4: The Killer Requirement

  **The Requirement:** **The Phenomenally-Grounded Intrinsic Normativity Constraint.**

  **Definition:** The theory must locate the normative force of pleasure (why it is good/choiceworthy) in the *intrinsic conscious character* of the experience itself, across all heterogeneous instances, without reducing that character to a relational attitude or an external function.

  **Why this wipes out the big three:**
  1.  **Felt-Quality Theories (Sensationalism):** Fail because there is no common *conscious character* across heterogeneous cases (the "itch" of a scratch vs. the "click" of understanding). If there is no common feel, there is no common phenomenological ground for normativity.
  2.  **Pro-Attitude Theories (Desire-Based):** Fail because they locate normativity in the *attitude* (the wanting), not the *phenomenology*. They cannot explain why the experience itself feels authoritative, only that it is wanted. They collapse pleasure into desire, violating the Motivation Independence desideratum.
  3.  **Functionalist Theories:** Fail because they locate normativity in the *role* (reinforcement/learning), which is extrinsic. A functional duplicate (zombie) could have the reinforcement role without the normative "feel." They cannot account for the *intrinsic* worth of the experience.

  ---

  ### Phase 5: Theory Scorecard

  | Theory Type | Heterogeneity Fit | Normative Ground | Empirical Fit | Motivation Independence | **Total Score** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Felt-Quality** | **Fail** (No common qualia) | Pass (Intrinsic) | Fail (No neural unity) | Pass | **2/4** |
  | **Pro-Attitude** | Pass (Attitudes vary) | **Fail** (Relational) | Pass (Fits wanting systems) | **Fail** (Conflates want/like) | **2/4** |
  | **Functionalism** | Pass (Roles vary) | **Fail** (Extrinsic) | Pass (Fits learning models) | Pass | **2/4** |

  **Verdict:** All three major extant frameworks fail the **Phenomenally-Grounded Intrinsic Normativity Constraint**. They each secure two quadrants of the spec but collapse when required to explain why a heterogeneous, non-functional, non-desire-based experience commands rational pursuit. A viable theory requires a hybrid ontology (perhaps attitudinal phenomenology) that currently does not exist in a complete form.
