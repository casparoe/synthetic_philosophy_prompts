answer: |-
  This is not a dumb question at all. In fact, you've put your finger on the exact nerve that makes *A New Refutation of Time* (1944) one of the most frustrating and brilliant texts in Borges's corpus. You are not making a basic misread; you are encountering the deliberate instability of the text.

  Here is the breakdown of where your intuition is right, where you might be conflating texts, and how to frame this for your feature without falling into the trap Borges set.

  ### 1. Physics vs. Metaphysics (The Einstein/Zeno Trap)
  You noted that Borges uses Einstein to kill simultaneity and Zeno to kill motion. That is correct, **but** Borges is not using them as a physicist. He is using them as an **idealist**.

  When Borges argues for the isolation of moments, he isn't arguing for "chronometric isolation" in a relativistic or cosmological sense (i.e., that light cones don't connect). He is arguing for **Humean psychological atomism**.
  *   **The Argument:** Following Hume and Berkeley, Borges suggests that we have no proof of a continuous "self" that persists from moment A to moment B. We only have a series of discrete perceptions.
  *   **The Isolation:** Therefore, Moment A and Moment B are ontologically separate because there is no "I" to bind them. The "isolation" is not necessarily causal (in a physical sense); it is **substantial**. The past moment ceases to exist; the future moment does not exist; the present moment has no duration.

  **Verdict:** If you frame it as "physical causal isolation," you are drifting into sci-fi cosmology. If you frame it as "ontological discontinuity of the subject," you are in Borges's lane.

  ### 2. The *Tlön* Contamination
  Your suspicion about *Tlön, Uqbar, Orbis Tertius* is spot on.
  *   **In *Tlön*:** Borges fictionalizes a world where idealism is literal physics. Objects materialize when perceived; cause and effect are psychological associations, not physical laws. That is a world of radical temporal atomism.
  *   **In *Refutation*:** Borges is writing an essay (of sorts). He is exploring the *implications* of idealism on our experience of time, not positing a hard cosmology.

  **The Risk:** If you argue that Borges *believes* moments are causally sealed, you are treating the essay as a doctrinal statement. Borges scholars (like Williamson or Balderston) warn against this. He is dramatizing a philosophical position, not necessarily inhabiting it. You are likely smuggling *Tlön*'s radical fictional idealism into the essay's philosophical skepticism.

  ### 3. The Eternal Recurrence Clash
  You asked: *If he really holds the stronger isolation claim, wouldn't it clash with... eternal recurrence?*

  **Yes. Absolutely.** And Borges knows it.

  This is the key to your feature: **Borges does not care about systematizing his philosophy.**
  *   **Nietzschean Recurrence:** Requires time to be circular and continuous enough for the *same* moment to return.
  *   **Temporal Atomism:** Suggests moments are discrete, dying instantly, with no bridge to the next.

  In the **Postscript** to *A New Refutation of Time* (added in 1946), Borges essentially pulls the rug out from under the reader. He admits the essay is a "labyrinth of contradictions." He writes:
  > *"I suspect... that I have done nothing but vary the rhetoric... I am not sure that I exist, actually. I am all the writers that I have read, all the people that I have met, all the women that I have loved; all cities that I have visited."*

  He undermines the "Refutation" itself. He suggests that even if time is an illusion, the *experience* of time (and the comfort of Recurrence) is necessary for living. He is willing to hold two contradictory metaphysical views if they both produce a sense of metaphysical awe or vertigo.

  ### 4. How to Frame This in Your Feature
  Don't try to solve the contradiction. **Make the contradiction the point.**

  *   **Avoid:** "Borges argues that time is X."
  *   **Try:** "Borges weaponizes X to destabilize our confidence in time, only to undermine X later."

  **Specific recommendations for your argument:**
  1.  **Distinguish the "Self" from the "Clock":** Clarify that Borges's "atomism" is about the disintegration of the *ego*, not necessarily the fragmentation of spacetime. The moments are isolated because the *observer* is a fiction.
  2.  **Acknowledge the *Tlön* Echo:** Explicitly state that while *Tlön* imagines a universe built on this atomism, *Refutation* treats it as a skeptical tool. This shows you know the corpus well.
  3.  **Lean into the Postscript:** Quote the postscript where he admits the contradictions. This saves you from having to reconcile Recurrence with Atomism. Borges's "view" is that **consistency is less important than the metaphysical sensation.**
  4.  **The "Glitch":** Your phrase "motion is just a perceptual glitch" is excellent. Keep that. It captures the Zeno/Berkeley synthesis without committing to hard physics.

  ### Summary
  You aren't misreading the text; you are reading it consistently, which is dangerous with Borges.
  *   **Is temporal atomism his "real view"?** No. It is a position he inhabits temporarily to induce vertigo.
  *   **Is it *Tlön*?** You are likely conflating the fictional physics of *Tlön* with the metaphysical skepticism of *Refutation*.
  *   **Does it clash with Recurrence?** Yes, and Borges admits it in the Postscript. He values the *literary power* of both ideas over their logical compatibility.

  For your feature, position Borges not as a philosopher proposing a theory of time, but as a writer using philosophy to evoke the *feeling* of timelessness. The "Refutation" isn't a proof; it's a mood.
