  the leaves need to include these specific positions: (1) the "just an error signal" view with no built-in badness, (2) the view that the sensory pattern is intrinsically awful regardless of reaction, (3) the view that badness is entirely in the affective loop so asymbolia proves pain can be neutral, and (4) one combo nobody holds — maybe "pain is bad only when you understand the representation but feel no affect" — and tell me if thats incoherent, just ugly, or unexplored.

