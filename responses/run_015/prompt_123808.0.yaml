      *   Better framing: *Normativity* (Decision Theory) vs. *Ontology* (What is a branch?) vs. *Empiricism* (Does it match data?).
      *   The real fault line is often: **What counts as an explanation?**
          *   Everettians want to derive probability from non-probabilistic physics + rationality.
