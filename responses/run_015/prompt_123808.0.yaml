      *   So, the stagnation is due to incompatible standards of *derivation*.

  4.  **Evaluate "Branch Inflation":**
      *   Is it new? No. It's the "branch counting" objection.
      *   Does it do work? It reinforces the idea that "branch count" is ill-defined in decoherence theory.
