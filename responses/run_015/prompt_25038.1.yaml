answer: |-
  # Q&A Prep Sheet: Hume on Miracles as Applied Epistemology

  **Context:** Department Colloquium (35 attendees, 25 min Q&A).
  **Audience:** Formal Epistemology (Bayesians/Non-Bayesians), Philosophy of Science (Anomaly/Kuhn), Hume Scholars.
  **Thesis:** Section X is a practical maxim for discounting testimony against uniform experience, not an *a priori* proof; distinguishes violations of regularity (black swans) from violations of established laws; applicable to scientific anomalies.

  ---

  ### 1. The Textual Fidelity Objection (Hume Scholars)
  **The Question:** "You're drawing a sharp distinction between 'violations of regularity' (black swans) and 'violations of laws of nature.' But Hume defines a law of nature *just* as a uniform regularity confirmed by experience. Textually, doesn't Hume collapse this distinction? If a 'law' is just a summary of past uniformity, then a black swan and a resurrection violate the *same kind* of proposition. Aren't you importing a modern modal distinction into Hume's empiricist framework to save the argument?"

  **The Reply (2 mins):**
  "That is the crucial textual hinge. I concede Hume doesn't use 'law of nature' in the necessitarian sense. However, in Section X, Hume distinguishes between experiences that are *merely* uniform and those that are 'unalterable' in the face of contrary reports. He speaks of 'proof' versus 'probability.' My reading suggests Hume implicitly recognizes a hierarchy of confirmation. A black swan overturns a superficial generalization ('All observed swans are white'); a miracle overturns a causal law grounded in deep, cross-inductive support ('Human biology precludes self-resurrection'). I'm not attributing modal realism to Hume, but rather a pragmatic distinction in the *weight* of the uniform experience. The 'everlasting check' applies when the background experience is so robust that treating the testimony as false is more miraculous than the event itself. That's a distinction of degree that functions as a distinction in kind for the inquirer."

  **Weakness/Constraint:**
  *   **Weakness:** Hume *does* often talk as if all uniformities are on a par. You are relying on a charitable reconstruction of "proof" in Hume's probability taxonomy.
  *   **Do Not Claim:** Do not claim Hume has a modern theory of laws (e.g., Armstrong or Best System). Stick to "depth of inductive support."

  ### 2. The Bayesian Formalization Objection (Formal Epistemologists)
  **The Question:** "If I understand you, you're saying Hume isn't setting the prior to zero, but rather setting it so low that no realistic likelihood ratio overcomes it. But isn't that just standard Bayesian updating with extreme priors? If so, what work is the 'practical maxim' doing that the calculus doesn't already do? And if the prior is low *because* of uniform experience, aren't we back to the charge that this is effectively an *a priori* block for any finite agent?"

  **The Reply (2 mins):**
  "The distinction is between a *calculus* and a *policy*. A Bayesian model requires us to assign specific values to P(M) and P(T|M). Hume's point in Section X is that human agents are terrible at calculating these values when 'uniform experience' is involved. We suffer from cognitive biases (which Hume details in the surrounding sections). The 'practical maxim' is a heuristic policy: 'When the background regularity is this robust, do not even attempt the calculation; discount the testimony.' It's an epistemic triage rule. It survives the 'a priori' charge because it is defeasible in principle—if the testimony were of a sufficiently high quality (e.g., multiple independent, expert observers), the policy allows the calculation to proceed. It's not that P(M) = 0, but that the threshold for T is practically unreachable, which is a claim about human psychology and evidence gathering, not logic."

  **Weakness/Constraint:**
  *   **Weakness:** If they press that a heuristic *just is* an approximation of the ideal calculus, your distinction blurs.
  *   **Do Not Claim:** Do not claim Hume anticipates Bayes' Theorem explicitly. Claim he anticipates the *computational limits* of agents.

  ### 3. The Kuhnian/Paradigm Shift Objection (Philosophy of Science)
  **The Question:** "You rely on the distinction between a black swan and a miracle to handle the 'unprecedented event' objection. But consider the history of science: the discovery of radioactivity or meteorites were initially reported as violations of established physical laws. Scientists initially dismissed them using Humean maxims. If your reading validates Hume's maxim, doesn't it validate the conservative dismissal of genuine anomalies? How do you distinguish a Humean miracle from a Kuhnian anomaly without hindsight bias?"

  **The Reply (2 mins):**
  "This is the strongest challenge to the application of the maxim. The distinction lies in the *explanatory cost*. A black swan or a meteorite requires adding a new entity to the ontology but leaves the causal laws intact (rocks still fall, birds still reproduce). A miracle, in Hume's sense, requires suspending the causal law itself (dead tissue regenerates without cause). When radioactivity was discovered, it didn't violate conservation of energy immediately; it violated chemical indivisibility. The Humean inquirer should discount the testimony *initially*, yes. But the maxim includes a proviso: the discounting holds *unless* the testimony is accompanied by a new theoretical framework that absorbs the anomaly. Hume's argument targets isolated testimonial claims (the religious miracle), not theory-embedded anomalies. The maxim buys time for the scientific community to verify, not a permanent ban."

  **Weakness/Constraint:**
  *   **Weakness:** The line between "new entity" and "new law" is often blurry in real-time science.
  *   **Do Not Claim:** Do not claim Hume's maxim guarantees truth. Claim it minimizes error in the short term.

  ### 4. The "Earman" Objection (The Confused Bayes Critic)
  **The Question:** "John Earman has argued convincingly that Hume's argument is simply a botched attempt at probability theory, specifically regarding the likelihood ratios. If your reading is that this is 'applied epistemology,' aren't you just dressing up a mathematical error as a pragmatic maxim? Why should we care about Hume's maxim if the underlying probability intuition is demonstrably flawed?"

  **The Reply (2 mins):**
  "Earman is right that if we treat Hume as doing formal probability, he fails. But that's precisely why my reading matters. Hume isn't doing formal probability; he's doing risk management. Even if the math *could* be made to work for a miracle, the *cost* of being wrong about a law of nature is epistemically catastrophic compared to the cost of ignoring a testimony. Hume's argument is about the asymmetry of error. It's better to miss one genuine miracle (a low probability event) than to accept a false one (which undermines the entire basis of inductive inference). The 'flaw' Earman identifies assumes the goal is truth-maximization in a single case; Hume's goal is stability of the inductive framework overall."

  **Weakness/Constraint:**
  *   **Weakness:** This risks sounding like you're changing the subject from truth to utility.
  *   **Do Not Claim:** Do not say Earman is wrong. Say Earman is addressing a different question (formal validity vs. epistemic policy).

  ### 5. The Testimony Reductionism Objection (Epistemology of Testimony)
  **The Question:** "Hume seems to be a reductionist about testimony: testimony is only as good as the inductive evidence supporting the witness's reliability. Your reading leans into this. But doesn't this undermine the 'practical maxim'? If testimony is a basic source of justification (as anti-reductionists argue), then uniform experience shouldn't automatically trump it. Are you committed to a reductionism that most contemporary epistemologists reject?"

  **The Reply (2 mins):**
  "I am committed to Hume's reductionism, yes, but not necessarily to its universal truth today. However, even for anti-reductionists, there is a 'defeater' condition. If I tell you I saw a man fly, your default trust in my testimony is defeated by your background knowledge of gravity. My reading doesn't require global reductionism; it only requires that testimony is *defeasible* by contrary empirical evidence. The 'practical maxim' specifies the threshold for that defeater. So, even if you grant testimony some *prima facie* warrant, Hume's point stands that the warrant is extinguished when it conflicts with 'unalterable' experience. The argument works on both reductionist and non-reductionist frameworks, provided testimony isn't infallible."

  **Weakness/Constraint:**
  *   **Weakness:** Hardline anti-reductionists (e.g., Coady) might still push back that you're weighting experience too heavily.
  *   **Do Not Claim:** Do not claim Hume's reductionism is the final word on testimony. Claim it's sufficient for *this* argument.

  ### 6. The "Law of Nature" Definition Objection (Metaphysics/Hume Scholars)
  **The Question:** "You say miracles violate laws, not just regularities. But on a Humean view of laws (Humean Supervenience), laws *just are* the best systematization of regularities. If a miracle occurs, doesn't that just mean our previous systematization was wrong? So a 'miracle' is just a law-revision. How can a violation of a law be evidence against the law, if the law is defined by the evidence?"

  **The Reply (2 mins):**
  "This is the classic circularity worry. The response is to distinguish between the *provisional* law and the *ideal* law. For the inquirer at time *t*, the law is the established regularity. A miracle report is a claim that an exception occurred. If we accept the exception, we revise the law. Hume's argument is that we are never justified in making that revision *on the basis of testimony alone*. We might revise the law based on direct observation or repeatable experiment (like the black swan), but testimony of a singular, non-repeatable event is insufficient to force a law-revision. The maxim protects the stability of the 'provisional' law against the fragility of testimonial reports."

  **Weakness/Constraint:**
  *   **Weakness:** This makes Hume's argument conservative to a fault.
  *   **Do Not Claim:** Do not claim laws are immutable. Claim testimonial evidence is the wrong *tool* for changing them.

  ### 7. The Contemporary Application Risk (Philosophy of Science/Ethics)
  **The Question:** "You mention downstream bite for contemporary scientific controversies. But historically, Humean skepticism has been used to dismiss legitimate minority reports—cold fusion, initial claims about gravitational waves, even early climate data. If we institutionalize Hume's 'practical maxim,' aren't we building a conservative bias into our scientific epistemology that protects paradigms from necessary falsification?"

  **The Reply (2 mins):**
  "That is a genuine risk, and I acknowledge it. However, the maxim is not a gag order; it's a weighting instruction. It says 'discount heavily,' not 'ignore.' In the cases you mention, the claims were eventually accepted not because of *testimony* alone, but because the anomaly became *reproducible* or *instrumentally detected*. Hume's argument targets testimony specifically—claims relying on the authority of a witness. When cold fusion moved to the lab, it left the realm of Humean testimony and entered the realm of direct experimental evidence. The maxim protects against the specific epistemic vulnerability of relying on *reports* of anomalies rather than the anomalies themselves."

  **Weakness/Constraint:**
  *   **Weakness:** Some "testimony" in science is actually trust in instrument readouts (which is testimonial in a broad sense).
  *   **Do Not Claim:** Do not claim the maxim never errs. Claim it errs on the side of stability, which is generally preferable in science.

  ### 8. The "Hope Nobody Asks" Question (The Logical Trap)
  **The Question:** "Hume defines a miracle as a violation of a law of nature, and a law of nature as a regularity confirmed by uniform experience. But if a miracle actually occurs, experience is no longer uniform. So, either the event didn't happen (so it's not a miracle), or it did happen (so it's not a violation of a law, just a law revision). Doesn't this make the concept of a 'miracle' incoherent within Hume's own definitions, regardless of testimony?"

  **The Reply (2 mins):**
  "This is the famous logical circle. My reading avoids it by focusing on the *epistemic position of the inquirer*, not the metaphysical status of the event. For the inquirer, the law is defined by the *available* uniform experience. The miracle is a report that contradicts *that* experience. Whether the event 'actually' violates a metaphysical law is irrelevant to the argument. The argument is: 'Given your current evidence base (uniform experience), you are never justified in believing the report.' It dissolves the circle by making the definition of 'law' relative to the agent's current inductive base, not the God's-eye view of all events. It's an argument about justification, not ontology."

  **Weakness/Constraint:**
  *   **Weakness:** This concedes Hume isn't talking about "real" miracles, only "reported" ones. Some may find this deflationary.
  *   **Do Not Claim:** Do not try to solve the metaphysical problem of laws. Keep it strictly epistemic.

  ---

  ### General Strategy Notes for Q&A
  *   **On Text:** If a Hume scholar cites a specific paragraph, do not bluff. Say: "That passage is challenging for my reading, but I interpret it in light of Paragraph X where..."
  *   **On Bayes:** If they pull out a whiteboard, do not engage in the math. Pivot back to *policy*: "Even if the math allows it, should a human agent trust that calculation?"
  *   **On Tone:** Acknowledge the strength of the objections. "That's the standard objection, and here is why my applied epistemology reading navigates it..."
  *   **Time Management:** Keep replies under 2 minutes. If you go long, you lose the room. Offer to discuss complex formal points after the talk.
