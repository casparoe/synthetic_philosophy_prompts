      *   *Moral Luck:* Agents are responsible for things outside their control (outcomes). Blame often depends on how things turn out, not just intention.
      *   *Williams on Opera:* He wrote specifically about opera (e.g., in *On Opera* or essays like "Opera and the Will"). He sees opera as a form where psychological states are externalized and intensified, often bypassing rational moral deliberation in favor of raw emotional truth. He appreciates opera's ability to show conflict without resolving it neatly.

  3.  **Deconstruct the Artistic Text (*Don Giovanni*):**
