      *   *System-Building:* The epilogue is the "system" trying to reassert control (Kantian justice/Poetic Justice). The damnation scene is the "particular emotional attachment" (Giovanni's will).
      *   *Moral Luck:* Did Giovanni *have* to die? If the statue hadn't animated, he would have walked away. His "vice" was constant; his "fate" was contingent. This aligns with *resultant luck*. Williams argues we blame based on outcomes. Here, the outcome (damnation) is triggered by a supernatural contingency, not a legal or social apprehension.

