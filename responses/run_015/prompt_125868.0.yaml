      *   *The Climax:* The Statue invites him to repent. He refuses ("No, vecchio, non mi pento"). He goes down fighting/defiant.
      *   *The Epilogue:* The *lieto fine* (happy ending). The survivors gather and sing "Questo è il fin di chi fa mal" (This is the end of those who do evil). It's moralizing, conventional, and often cut in modern productions.
