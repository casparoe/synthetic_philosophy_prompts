      *   **Address Step (6) (The Friend's Point):** Explain why the friend is right about decision theory but maybe wrong about the practical upshot. The "Conditional EV" is a diagnostic tool, not the objective function. You maximize Unconditional EV. The Curse warns you that your Unconditional EV estimate might be biased because you haven't accounted for the evidence of others' inaction.
