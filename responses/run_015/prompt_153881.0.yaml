      *   **Refine the "Tail Risk" (Step 4):** Acknowledge it's real for the Mirror, but for "writing a letter," the tail is so thin it's ignored by standard rounding. The Mirror tail is fat enough to matter.
      *   **Recommendation:** Don't drop the Curse (1). Drop the universal application (2/3). For the Mirror, implement a coordination protocol (quorum voting) to break the unilateralism.

  7.  **Review against Constraints:**
      *   User wants to keep (1). (Okay, I will preserve the validity of the Curse for the Mirror).
      *   User is unsure about (4) vs (2). (I need to explain why (2) is the overreach, not necessarily (4)).
