      *   Honest failure paragraph? Yes.
      *   Defendable to a smart philosopher? Yes, by focusing on logical coherence rather than empirical data (since there is no data).

  10. **Final Polish:** Ensure the distinction between Type 1, 2, and 3 akrasia (from the prompt) is central to the proposal. This is the user's taxonomy, keep it.

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a philosopher. Keep the physiological analogy alive. The user is a physiologist. The proposal should leverage that identity, not hide it. The "mechanism" angle is their strength.

  *(Final check on the "Availability" point)*: The user says "Cake in front of me now versus identical cake arriving by a machine on a fixed ninety-second delay." This is key. Standard discounting says Value = $V / f(t)$. If $t=0$ for the cake in hand, and $t=90$ for the machine, the values differ. But the user is suggesting that *presence* adds a multiplier independent of $t$. A "Cue Parameter." I need to make sure the proposal formalizes this intuition without demanding math the user won't do. It's a conceptual argument about model specification.

