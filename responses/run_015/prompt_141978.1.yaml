  **Project Proposal: Temporal Discounting and the Phenomenology of Akrasia**

  **Working Title:** *The Zero-Delay Problem: Sensory Availability vs. Temporal Proximity in Models of Weakness of Will*

  **1. The Research Question**
  The central question this paper seeks to answer is: **Does the hyperbolic discounting model explain the *moment* of akratic action, or does it merely describe the *trajectory* of preference leading up to it?**

  More specifically, I intend to test whether the standard economic/philosophical model of weakness of will (akrasia) conflates two distinct variables: (a) the temporal delay to a reward, and (b) the sensory availability of the reward. My hypothesis is that hyperbolic discounting accounts for preference reversal over time (Type 1 akrasia) but fails to account for action against better judgment at the moment of choice (Type 2 akrasia) because, at $t=0$, the discount function collapses. Furthermore, I propose that "sensory availability" acts as a confounding variable in these models, often misidentified as extreme temporal discounting when it is actually a cue-driven physiological response distinct from time valuation.

  **2. Motivation and Context**
  In the literature on practical rationality, hyperbolic discounting (the $\beta-\delta$ model) is the standard mechanistic explanation for why agents violate their own long-term plans. The story is familiar: from a distance, the long-term good (health) outweighs the short-term good (cake); as the short-term good approaches, its discounted value rises non-linearly, overtaking the long-term good.

  However, this model is typically applied to *choices over time*, not necessarily to the *phenomenology of the act*. As a physiologist, I recognize the curve as a fit to behavioral data, but I do not recognize it as a mechanism that operates at the instant of muscle contraction or neural firing. When I am standing in the kitchen with the cake in my hand, the delay is zero. According to the model, the value should be undiscounted. If I eat it while judging I should not, the discount curve has nothing to say about *why* the judgment was overruled, because the time variable has vanished.

  This paper aims to disentangle three phenomena often lumped under "weakness of will":
  1.  **Planning Failure:** Preferring A over B at $t_1$, but preferring B over A at $t_2$ (before action).
  2.  **Judgmental Akrasia:** Judging A better than B at $t_{action}$, but doing B.
  3.  **Compulsive Capture:** Doing B without a salient judgment of A at $t_{action}$ (habit/impulse).

  My suspicion is that discounting explains (1), is irrelevant to (2) without ad hoc modifications, and is actively misleading regarding (3).

  **3. Why Standard Moves Do Not Close the Question**
  I anticipate two standard counter-arguments from the philosophical side, and I need to establish in the proposal why they are insufficient for my purposes.

  *   **The "Two-System" Reply:** A philosopher might argue that at the moment of action, a "hot" emotional system overrides a "cold" cognitive system, and the discount curve represents the hot system's valuation.
      *   *My Counter:* If this is the case, the discount curve is not explaining the akrasia; the *conflict between systems* is. The curve is merely a description of the hot system's output. This renders the discounting model descriptive rather than explanatory. I need to determine if the model claims to be a mechanism or a map.
  *   **The "Subjective Time" Reply:** Another move is to argue that at the moment of temptation, subjective time dilates, or the future effectively disappears ($\delta \approx 0$).
      *   *My Counter:* This makes the model unfalsifiable. If the parameters shift to fit the behavior at every moment, we have a fitting artifact, not a predictive model. In physiology, if a voltage-gate model only works when we adjust the gating constants post-hoc for every spike, we say the model is wrong. I want to apply this same rigor to action theory.

  **4. Methodology**
  Since I am not running experiments, this will be a work of **conceptual analysis grounded in mechanistic plausibility**. I will treat the discounting model as a "black box" and test its inputs and outputs against the logical requirements of akrasia.

  *   **Data Source:** I will use "auto-phenomenology" cautiously. I will not treat my own experience as data to be generalized, but as a source of existence proofs. If I can describe a state of action where $t=0$ and judgment remains stable for the better option, yet action diverges, the discount model (which relies on $t$) cannot explain it.
  *   **The "Availability" Test:** I will construct a thought experiment distinguishing *Temporal Immediacy* (it arrives now) from *Perceptual Immediacy* (it is here, visible, smellable). I will argue that standard models treat Perceptual Immediacy as a subset of Temporal Immediacy ($t=0$), whereas physiologically, they engage different pathways (e.g., cue-reactivity vs. delay tolerance).
  *   **Logical Proof:** I will attempt to formalize the "Zero-Delay Problem." If $V_{now} = Value \times Discount(0)$, and $Discount(0) = 1$, then $V_{now} = Value$. If I choose the lower Value option at $t=0$, it is not because of discounting. It must be because the *Value* assignment itself changed. If the Value assignment changed, was it a judgment change? If yes, no akrasia. If no, what mechanism changed the Value without changing the Judgment?

  **5. Work Plan (3 Months, Part-Time)**

  *   **Month 1: Logic and Literature.**
      *   *Goal:* Solidify the distinction between Type 1, 2, and 3 akrasia.
      *   *Task:* Read the specific papers the reading group is discussing. Map their definitions of "better judgment" against my three types.
      *   *Output:* A 2,000-word "logic check" memo. Does the standard definition of akrasia require the judgment to persist *through* the action? (Davidson says yes). If so, does discounting allow for that?
      *   *Physical constraint:* Limit reading to 2 hours/day to manage fatigue. Focus on the arguments, not the history.

  *   **Month 2: The Availability Argument.**
      *   *Goal:* Develop the distinction between Delay and Availability.
      *   *Task:* Draft the core argument. Use physiological analogies (ligand binding vs. concentration gradient) to illustrate why "presence" is different from "immediacy."
      *   *Output:* 4,000 words of core text. This is the risky part. I need to ensure I'm not just saying "biology is complicated." I need to show that the *philosophical model* fails to capture a variable that matters.
      *   *Check:* Run this draft by a trusted colleague (perhaps a psychologist friend) to see if the distinction holds water outside my head.

  *   **Month 3: Objections and Synthesis.**
      *   *Goal:* Steelman the opposition and finalize the paper.
      *   *Task:* Write the "Standard Replies" section. Anticipate the "Two-System" and "Subjective Time" counters. Write the conclusion: what this means for moral responsibility (if it's not discounting, is it compulsion?).
      *   *Output:* Final 8,000 words. Edit for tone—ensure I sound like a collaborator, not a dismissive scientist.
      *   *Review:* Check against the "Grumpy Old Man" test. Is this constructive?

  **6. Possible Conclusions**
  There are three likely endpoints for this inquiry:

  1.  **The Deflationary Conclusion:** Hyperbolic discounting is purely a model of inter-temporal *choice*, not intra-temporal *action*. It explains why I buy the gym membership in January and not use it in February, but it does not explain why I eat the donut in the breakroom. Akrasia (Type 2) requires a different explanation (e.g., attentional failure, habit).
      *   *Implication:* Philosophers need to stop using discounting as a catch-all for irrationality.
  2.  **The Parameter Conclusion:** The discount model *can* save itself, but only by adding a "Cue/Availability" parameter ($C$) such that $Value = V \times D(t) \times C(presence)$.
      *   *Implication:* The current model is incomplete, not wrong. But this admits that "time" isn't the only driver of impulsivity.
  3.  **The Category Error Conclusion:** The whole project of modeling akrasia as a valuation error is mistaken. Type 2 akrasia isn't a valuation problem; it's a control problem. The value is assessed correctly, but the motor output is uncoupled from the valuation.
      *   *Implication:* This moves the debate from philosophy of action to philosophy of mind/neuroscience.

  **7. Failure Analysis (The "Honest Paragraph")**
  There is a significant risk that this project collapses into a rediscovery of existing distinctions. Philosophers of action (e.g., Davidson, Velleman, Holton) have spent decades debating whether akrasia involves a change of judgment or a failure of intention. It is highly probable that the distinction I am drawing between "planning failure" and "action failure" is already codified under terms like *continence* vs. *incontinence*, or *judgment* vs. *all-things-considered preference*. If I spend three months only to find that the reading group's philosopher nods and says, "Yes, that's just the distinction between evaluative judgment and motivational strength," I will have written a paper that is redundant.
  Furthermore, there is the risk of "physiological imperialism." I may be demanding that a philosophical model answer mechanistic questions it was never designed to ask. Economics and philosophy often deal in rational reconstruction, not causal mechanism. If I insist that a model of *reasons* must look like a model of *causes*, I may be committing a category error myself. To mitigate this, I must frame the argument not as "philosophy is bad science," but as "this specific scientific model is being asked to do philosophical work it cannot support."

  **8. Criteria for Publishability vs. Notebook**
  To ensure this is a paper and not a complaint, the final draft must meet three criteria:
  1.  **Charity:** I must state the discounting model in its strongest form before critiquing it. If I caricature the opponent, the paper is worthless.
  2.  **Constructive Outcome:** I cannot just say "discounting is wrong." I must offer a way forward. Either a revised taxonomy of akrasia or a specific modification to the model.
  3.  **Generalizability:** The argument cannot rely solely on my personal experience. It must be framed in terms of logical possibilities that any agent could recognize. The "cake" example is illustrative, not evidentiary.

  If the paper succeeds, it should be suitable for a journal like *Philosophical Psychology* or *Review of Philosophy and Psychology*, where the intersection of mechanism and normativity is welcomed. If it fails, it will read as a scientist telling philosophers how to do their job—a tone I must actively edit against.

  ***

  **Notes for the Author (You):**
  *   **On the "Smart Philosopher":** When you defend this, expect them to push on the definition of "Judgment." They will argue that if you really judged A better, you wouldn't do B. Therefore, if you do B, your judgment *must* have flipped. Your counter-argument needs to be ready: "If judgment flips instantly at $t=0$ due to sensory input, is it a *judgment* or a *reaction*? If it's a reaction, the discount model (which models valuation) is the wrong tool."
  *   **On the Word Count:** 8,000 words is tight for this scope. You may need to cut the history of the discounting model entirely. Focus on the logic of the *moment of action*.
  *   **On Your Health:** 3 months part-time is realistic, but don't let the "failure analysis" section demoralize you in Month 2. Even if the distinction exists in the literature, framing it through the lens of *sensory availability vs. temporal delay* is likely novel enough to be worth writing. That specific mechanistic distinction is your contribution. Stick to it.
