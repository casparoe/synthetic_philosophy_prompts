      *   **Topic:** Weakness of Will (Akrasia) vs. Hyperbolic Discounting.
      *   **Core Gripe:**
          1.  Discounting models explain preference reversal over time (Type 1: planning vs. doing) but fail at the moment of action (Type 2: judging A better but doing B) because delay is zero.
          2.  Discount functions are fitted from behavior and then used to explain behavior (circularity/fitting artifact).
          3.  **Original Insight:** Distinguish between *temporal delay* and *sensory availability* (cake in hand vs. cake in 90s). The standard model might treat this as noise, but it's mechanistically distinct.
      *   **Constraints:** No funding, no subjects (auto-ethnographic/conceptual only), no advisor. Needs to defend against a sharp philosopher in the reading group.
