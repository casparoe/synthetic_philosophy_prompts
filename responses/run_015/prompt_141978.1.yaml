      *   The proposal needs to frame this as a "confounding variable" in the philosophical model.
      *   Term idea: "Perceptual Immediacy" vs. "Temporal Immediacy."

  6.  **Developing the "Zero-Delay" Critique:**
      *   If $t=0$, $discount(0) = 1$. So why choose the bad?
      *   Standard reply: "Hot/Cold empathy gaps" or "Dual Systems."
      *   User's counter: If it's dual systems, the discount curve is epiphenomenal. The *conflict* is the explanation, not the *curve*.

  7.  **Structuring the "Month-by-Month":**
      *   Needs to be realistic for a 71-year-old with back issues. 8,000 words is roughly 25-30 pages double-spaced. That's manageable.
      *   Month 1: Logic & Literature (The "Homework").
      *   Month 2: The Core Argument (Availability vs. Delay).
      *   Month 3: Objections & Polish.

  8.  **Addressing the "Publishability" Criterion:**
