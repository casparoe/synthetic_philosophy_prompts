          3.  Audit of Carr: Address selection vs. constitution, and his latent realism.
          4.  Audit of White: Address truth vs. meaning, and the fiction/history line.
          5.  Evaluation of the Conclusion: Does transparency save objectivity?
          6.  Direct Answers to the Three Specific Questions.
      *   **Tone:** Academic, collegial, precise. Acknowledge the user's sophisticated grasp.
      *   **Key Insight:** The "Three-Stage Decline" is a pedagogical myth (a "whig history of historiography"). It simplifies to teach, but distorts to do so. The user's "Constraint/Selection/Configuration" model is a much better teaching tool.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on White:* The user says they suspect the treatment of White is "exactly backwards." The source says: "events are real but the meaning is made." White actually says: "The events happened, but the *story* is invented." That sounds consistent. Why would the user think it's backwards? Maybe because popular readings claim White says "history is fiction" (denying events), whereas White says "history uses fictional *techniques* to explain real events." I should clarify that the source's summary is actually one of the *better* popular summaries of White, but the *implication* (that history is just convention) is where the distortion lies. I will nuance this: The source gets White's *text* roughly right but misses his *philosophical intent* (which was to liberate history from scientism, not reduce it to lies).
      *   *Correction on Ranke:* Ensure I mention *Wissenschaft* vs. Natural Science. This is crucial for the "science" claim.
      *   *Correction on Carr:* Emphasize that Carr was a realist at heart, despite the relativistic soundbites.
      *   *The "Three Levels":* Validate this strongly. It maps onto Ontology (Constraint), Epistemology/Methodology (Selection), and Aesthetics/Rhetoric (Configuration). This is a strong philosophical framework.

  6.  **Final Review against User Prompt:**
      *   Audit claim-by-claim? Yes.
