  7.  **Final Polish:** Check for clarity and tone. Ensure the distinction between "fact" (event) and "historical fact" (selected evidence) is clear in the Carr section. Ensure the distinction between "reference" (events happened) and "sense" (narrative meaning) is clear in the White section.

  *(Self-Correction on the "White Backwards" point)*: I need to be careful. If the user thinks the treatment is backwards, they might mean the source says "White completed the demolition" implying nihilism, whereas White saw himself as expanding historical understanding. Or, they might mean the source says "line between history and fiction is a convention," whereas White argues the line is *structural* (history refers to real events, fiction doesn't). I will address the nuance that White *does* maintain a reference to the real, which the source glosses over.

