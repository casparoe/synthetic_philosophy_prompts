      *   **User's Critique/Model:** Distinguishes three levels: Constraint (traces rule things out), Selection (which facts count), Configuration (narrative form). User thinks Carr hits Level 2, White hits Level 3, neither hits Level 1. User suspects the source mishandles Ranke and possibly White.
      *   **Task:** Audit the chapter's account claim-by-claim (Ranke, Carr, White). Separate what defenders accept vs. simplifications vs. explicit denials. Evaluate the conclusion (transparency replacing objectivity).
      *   **Specific Questions:**
          1.  Does the English rendering of *wie es eigentlich gewesen* matter for Ranke?
          2.  Is Carr committed to interests *constituting* facts vs. *selecting* them?
          3.  Is White's narrativism about truth or meaning? Do the user's three levels hold up?
      *   **User's Bias:** Suspicious of the Ranke treatment, suspects the White treatment might be "exactly backwards."

  2.  **Deconstruct the Source's Claims (The "Three-Stage Decline"):**

      *   **Claim 1: Ranke & "Wie es eigentlich gewesen"**
          *   *Source:* Ranke turned history into a science; facts speak for themselves; historian's convictions left at the door; naive faith in bare fact.
          *   *Reality:* Ranke did write that phrase (in the preface to *Histories of the Latin and Germanic Nations*, 1824). However, "science" (*Wissenschaft*) meant systematic knowledge, not natural science. Ranke believed in intuition (*Anschauung*) and divine providence. He didn't think facts spoke for themselves; he thought the historian must efface themselves to let God's hand be seen.
          *   *Translation:* "How it actually was" is the standard translation, but "essentially" or "properly" captures the idealist nuance better than "bare fact."
          *   *Verdict:* Simplification/Caricature. Ranke wasn't a positivist.

      *   **Claim 2: E.H. Carr (*What Is History?*)**
          *   *Source:* Past is indefinitely large; historian decides which facts count; facts constituted by questions; study the historian before the facts.
          *   *Reality:* Carr does argue facts are selected. He uses the "fact vs. truth" distinction. He argues against the "cult of facts." Does he say interests *constitute* facts? He says facts become *historical* facts through selection. He doesn't deny the event happened, but denies its historical significance exists independently of the historian.
          *   *Verdict:* Mostly accurate but often read as more relativistic than Carr intended. Carr believed in progress and objective truth eventually emerging through dialectic.

      *   **Claim 3: Hayden White (*Metahistory*)**
          *   *Source:* History is language; shaped by plot/trope; ordering is literary achievement; events real but meaning made; line between history and fiction is convention.
          *   *Reality:* White argues the *archive* doesn't dictate the *story form*. The "content" is found, the "form" is imposed. He distinguishes between the chronicle (events) and the story (narrative). He is often accused of denying reality, but he usually denies *narrative reality*, not *event reality*.
          *   *Verdict:* The source's summary is standard but risks the "verbalism" critique. White denies the *truth value* of the narrative structure, not necessarily the events.

      *   **Claim 4: Conclusion (Transparency replaces Objectivity)**
          *   *Source:* View from nowhere unrecoverable; offer rigor/standpoint/transparency.
