answer: |-
  ### Point-by-point adjudication

  M1's initial claim (measurement system) is clearly mistaken. Intuitionism alters truth conditions, not just notation. Brouwer explicitly grounded mathematics in mental construction, making ontology central, not merely methodological. Changing logic changes what counts as true, not just how we write it. To claim it is merely bookkeeping ignores the semantic shift from truth-as-correspondence to truth-as-verification. It dismisses the core philosophical motivation of the intuitionist program. Logic governs being, not just thinking.

  M2's IVT objection is clearly right. The classical IVT asserts roots that may be uncomputable; the constructive version requires extra data (like a modulus of continuity), altering the extension of "function." This isn't just proof strength; it changes the objects themselves. A classical continuous function differs extensionally from a constructive one. Consequently, theorems define different domains.

  M1's rebuttal (same objects, different routes) is mistaken. It begs the question by assuming Platonist ontology against an anti-realist framework where existence is constructibility. To an intuitionist, a non-constructive proof proves nothing, so there is no object to access. Asserting identity across frameworks ignores the incommensurability of their existence predicates. It assumes the very ontology intuitionism rejects.

  M2's "ghost-objects" claim is right within intuitionism. Reference without identification conditions is vacuous for constructivists. If you cannot compute it, it lacks mathematical being in this framework. This aligns with Dummett's justification of logic via meaning theory, where understanding requires recognition conditions.

  M1's physics analogy is weak. Theoretical particles yield empirical predictions; non-constructive reals often yield no computational output. The analogy fails because physics validates via observation, whereas classical existence proofs validate via logical consistency alone. Unobservables in physics play causal roles; non-constructive numbers often play none. The disanalogy undermines the defense of classical ontology. Thus, the analogy fails to rescue classical ontology from the charge of emptiness.

  M2's rebuttal is right. The lack of observational cash-out distinguishes mathematical non-constructives from scientific unobservables. Scientific realism relies on explanatory power; classical Platonism relies on logical coherence. M1 consistently underestimates how intuitionism redefines existence, while M2 accurately identifies the ontological stakes regarding reference and computability. M1 treats intuitionism as a subset of classical logic, missing its foundational critique. M2 successfully demonstrates that logical restrictions entail ontological commitments.

  ### Shared blind spots

  Both parties assume ontology must be either Platonist (M1) or Constructivist (M2). They ignore structuralism, where objects are merely positions in patterns, rendering the "existence" debate secondary to structural coherence. They also overlook reverse mathematics, which calibrates exactly which axioms yield which objects, suggesting a spectrum rather than a binary. Furthermore, both ignore the double-negation translation, which allows classical logic to be embedded within intuitionistic logic. This suggests classical mathematics might be viewed as a study of provability within a specific modal context rather than asserting independent existence, complicating M2's "ghost-object" charge. They also neglect category theory, which offers a neutral ground where logic is internal to a topos, allowing both classical and intuitionistic logic to coexist as context-dependent tools rather than competing ontologies. This contextual view dissolves the absolute nature of their dispute.

  ### Overall verdict

  M2 wins the specific debate. Intuitionism is inherently ontological because it defines existence as constructibility. M1's error is category confusion: treating intuitionism as a restrictive methodology within classical ontology, whereas it is a competing ontology itself. While classical mathematicians can maintain Platonism while using intuitionistic methods, intuitionism itself denies the being of non-constructive objects. Therefore, M2 is correct that rejecting LEM restricts ontology, not just proof standards. However, M1 is pragmatically correct that classical mathematics remains useful; utility does not validate ontology. The verdict is that intuitionism entails ontological restriction, but classical mathematics need not accept intuitionism's ontological constraints to remain coherent. M2 correctly identifies the philosophical stakes, while M1 correctly identifies the practical resilience of classical methods, though for the wrong philosophical reasons.
