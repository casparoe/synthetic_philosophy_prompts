  Two members of my philosophy of mathematics study group argued about whether intuitionistic logic restricts mathematical ontology or merely tightens proof standards. The first claimed that rejecting the law of excluded middle is analogous to switching measurement systems: the same mathematical reality, expressed with stricter bookkeeping, and that intuitionism is ultimately a methodological preference without ontological bite. The second objected that this overlooks constructive analysis: the Intermediate Value Theorem fails in its classical form and requires explicit continuity conditions to hold constructively, which reveals that classical mathematics asserts the existence of roots without supplying any means to locate them—essentially claiming entities exist solely in virtue of logical form rather than constructive accessibility. The first replied that this is only a difference in proof strength, not ontology: classical mathematics is willing to prove existence non-constructively, but the objects referred to are identical, merely accessed through different epistemic routes. The second then argued that if an object can only be named through a proof that provides no identification procedure, then reference is empty in any practice-oriented sense, and intuitionism therefore exposes classical mathematics as populated by ghost-objects that lack genuine mathematical being. The first countered that by this standard theoretical physics is filled with unobservable entities, yet we do not reject quantum mechanics for referring to particles that evade direct observation. The second responded that physical theoretical entities are embedded in predictive frameworks that eventually cash out observationally, whereas a non-constructive existence proof offers no analogous path to identification, making the comparison misleading. They asked me to adjudicate, and I honestly could not.

