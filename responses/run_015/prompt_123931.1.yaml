prompt: |-
  Hi — I work at a smallish foundation (about $4M a year out the door, three program staff, roughly 25 grants, health and animal welfare mostly) and we've backed ourselves into a philosophical mess that I need turned into something runnable. One bloc on our board has been arguing that if the lexical-threshold negative-utilitarian picture is even approximately right — that there's a severity threshold above which suffering lexically dominates any amount of milder suffering *and* isn't offset by pleasures at all — then our whole pipeline is the wrong shape of tool, because we currently rank everything on a single made-up currency of "units of wellbeing per dollar" and that only makes sense if pleasure and pain are commensurable on one cardinal scale. The other bloc thinks that's fanatical and would have us defund things everyone agrees are good. The compromise the board landed on is that they want a written procedure, not a white paper: something a program officer with a public-health or vet-med background and no philosophy training can work through in about 40 minutes per application, that ends in a fund / don't fund / send back for more info, and that produces a half page of reasoning a donor could read without wincing. The board also wants to know explicitly where they're allowed to overrule it, since they won't accept being bound by it.

  So: give me the procedure. Ordered questions, what counts as a sufficient answer to each, the points where it stops with a no, and the points where it hands the decision to a person because it's a values call rather than a factual one. Some things I specifically want it to handle, and some of these I suspect are where the real work is. First, severity placement under coarse evidence: we have an internal six-rung suffering ladder we use informally, and I want to know what's actually being ordered — peak intensity, duration, or the product — whether the threshold is on a single episode or on a whole life, and whether many sub-threshold experiences can ever *sum* past the threshold (my guess is the honest lexical answer is no, and I want to see the bullet bitten rather than fudged into mere heavy weighting). Second, uncertainty: we essentially never know the severity, so the officer is always choosing between something like a 10% shot at preventing agony and a near-certain reduction in moderate chronic pain, and I need a rule for reasoning about probability-of-crossing-the-threshold that doesn't quietly reintroduce cross-rung expected-value arithmetic through the back door. Third, the offset question: can pleasure cancel pain at all, intra-personally or inter-personally, and if the view says never, what does our procedure do with the fact that our donors and our beneficiaries care a lot about positive experiences? Fourth, counterfactuals about *who exists*: several of our grants change prices or demand, so they plausibly change which animals live and how many, and there's substitution leakage between species and between countries — I need the procedure to catch that rather than awarding points for measured suffering on the animals in front of us. And fifth, gaming: applicants already learn to describe whatever they work on as agony, so I'd like a calibration step that penalises severity claims which have inflated over time in our own files. Wherever the procedure has to draw an arbitrary line (which rung is the threshold, how big a probability is big enough), say who should set it, how often to revisit it, and what record-keeping makes that revisiting possible.

  Then run it on three of our actual live decisions so I can see whether it survives contact: (1) a cost-share grant to a large poultry producer for a controlled-atmosphere stunning retrofit affecting several million birds a year, where the ask is big enough that it crowd out four smaller grants; (2) a palliative-care and opioid-availability programme in a low-income country, where the target suffering is unambiguously top-rung but the theory of change is soft and there's a real regulatory-capture risk we can't quantify; and (3) our original flagship, a small music-and-playground programme in the same districts we fund health work in, which staff love, which the board will fight for, and which I'm fairly sure your procedure tells us to stop funding — so please show me how it says that, in language I could actually bring to a board meeting. Also tell me plainly what the procedure can't do: which cases it genuinely can't settle, where the judgment can't be eliminated no matter how much scaffolding you add, where it will misfire in a way I should warn officers about, and what an officer should write down when they hit one of those points so the board can see the seam.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small foundation ($4M/year, 3 staff, 25 grants, health & animal welfare).
      *   **Problem:** Philosophical conflict on the board regarding *lexical negative utilitarianism* (lexicographical priority of extreme suffering over mild suffering/pleasure) vs. standard cost-benefit analysis (commensurable units).
      *   **Goal:** A written *procedure* (not a white paper) for program officers (POs) to use.
      *   **Constraints:**
          *   Must take ~40 minutes per application.
          *   Output: Fund / Don't Fund / Send Back + 1/2 page reasoning for donors.
          *   Must explicitly state where the Board can overrule.
          *   Must handle specific hard cases: Severity placement (peak vs. duration vs. sum), Uncertainty (probability of threshold crossing), Offsets (pleasure vs. pain), Counterfactuals (population dynamics), Gaming (inflation of severity claims).
          *   Must define who sets arbitrary lines and how to review them.
          *   Must be tested on three specific live cases (Poultry retrofit, Palliative care, Music/playground).
          *   Must admit limitations (where judgment can't be eliminated).
      *   **Tone:** Practical, operational, clear, honest about philosophical trade-offs, suitable for a board meeting.

  2.  **Deconstruct the Philosophical Conflict:**

      *   *Bloc A (Lexical Negative Utilitarian):* Extreme suffering is infinitely worse than mild suffering. Pleasure cannot cancel pain. Aggregation of mild suffering doesn't equal extreme suffering.
      *   *Bloc B (Pragmatists/Classical Utilitarians):* This is fanatical. We should fund things that create net good (pleasure - pain). Defunding "good" things because they don't stop "extreme" pain is wasteful.
      *   *The Compromise:* A procedure that respects the lexical threshold *without* paralyzing the foundation, while acknowledging where value judgments remain.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Time Limit:* 40 minutes means it can't require deep research. It relies on existing data + PO expertise.
      *   *Key Concept:* The "Threshold." I need to define this operationally based on their internal "six-rung ladder."
      *   *Handling Uncertainty:* Instead of Expected Value (EV) which aggregates, use a "Precautionary Threshold Probability." If $P(\text{Extreme Suffering}) > X$, treat as Extreme.
      *   *Handling Offsets:* Explicitly forbid counting pleasure as a *cancellation* of pain, but allow it as a secondary tie-breaker *below* the threshold.
      *   *Handling Counterfactuals:* Require a "Population Stability Statement."
      *   *Handling Gaming:* Use a "Severity Calibration Index" based on historical data.
      *   *Board Overrule:* Explicit "Board Discretion Clause."

  4.  **Addressing the Specific Hard Questions:**

      *   *Severity Placement:* Lexical views usually focus on *peak intensity* of an episode, not duration (agony for 1 minute is lexically worse than headache for 100 years). However, for operational purposes, we need a "Threshold Episode" definition. Let's define it as "Unmitigated, intense physiological/psychological distress."
      *   *Summing:* Lexical view says no. Mild suffering doesn't sum to extreme. The procedure must reflect this.
      *   *Uncertainty:* Use a "Reasonable Possibility" standard rather than EV. If there's a non-trivial chance of threshold suffering, prioritize preventing it.
      *   *Offsets:* Pleasure does not cancel pain. But the foundation isn't purely negative utilitarian (it's a compromise). So, Pain prevention is Primary. Pleasure creation is Secondary.
      *   *Counterfactuals:* If the grant changes population size significantly, it triggers a review.
      *   *Gaming:* Compare current severity claims against the foundation's 5-year average for that sector.

  5.  **Developing the "Arbitrary Lines" & Governance:**

      *   Who sets the threshold rung? The Board (annually).
      *   Who sets the probability cutoff? The Program Director (reviewed annually).
      *   Record keeping: A "Threshold Log" for board review.

  6.  **Running the Three Cases:**

      *   *Case 1: Poultry Retrofit.*
          *   Severity: High (slaughter). Likely above threshold.
          *   Scale: Millions.
          *   Trade-off: Crowds out 4 smaller grants.
          *   Procedure outcome: Likely Fund (Priority to threshold suffering), *unless* the 4 smaller grants also address threshold suffering.
          *   Nuance: The "Crowding Out" clause. If the 4 smaller grants *also* hit the threshold, we have a tie-breaker problem.
      *   *Case 2: Palliative Care/Opioids.*
          *   Severity: High (End of life pain). Above threshold.
          *   Uncertainty: High (Regulatory capture, soft theory of change).
          *   Procedure outcome: Send Back for More Info (due to uncertainty on efficacy), but High Priority if info resolves.
      *   *Case 3: Music/Playground.*
          *   Severity: Low (Mild pleasure/social connection).
          *   Offsets: Creates pleasure, prevents boredom (mild suffering).
          *   Procedure outcome: Don't Fund (under strict lexical rules).
          *   Board Overrule: This is where the Board steps in. The procedure flags it as "Non-Threshold," Board can overrule to fund "Community Good."

  7.  **Refining the Output:**

      *   Make it look like a document.
      *   Ensure the "Half-Page Reasoning" template is included.
      *   Ensure the "Board Overrule" section is prominent.
      *   Ensure the "Limitations" section is honest.

  8.  **Self-Correction/Critique during Drafting:**

      *   *Critique:* Is 40 minutes realistic?
      *   *Fix:* Simplify the "Counterfactual" check. Don't ask for a full economic model. Ask for a "Yes/No/Unsure" on population impact.
      *   *Critique:* Is the lexical view too restrictive?
      *   *Fix:* The prompt acknowledges the Board wants a compromise. The procedure must prioritize threshold suffering but allow a "Secondary Bucket" for non-threshold work *if* budget remains, subject to Board approval. Actually, the prompt says the Board wants to know where they can overrule. So the procedure should recommend "No" for the playground, but explicitly mark it as "Board Discretion Eligible."
      *   *Critique:* How to handle the "Summing" of mild suffering?
      *   *Fix:* Be explicit. "Aggregation Rule: Sub-threshold suffering does not sum to cross the threshold." This bites the bullet as requested.
      *   *Critique:* Uncertainty.
      *   *Fix:* Use a "Minimum Credible Probability" (e.g., 5%). If the chance of preventing threshold suffering is >5%, it counts as a Threshold Intervention.

  9.  **Final Polish:**

      *   Check tone: Professional, direct, not academic.
      *   Check constraints: All 5 specific handling points addressed? Yes.
      *   Check cases: All 3 run? Yes.
      *   Check limitations: Clearly stated? Yes.

  10. **Final Review against "Lexical Negative Utilitarian" constraints:**
      *   Does it allow pleasure to cancel pain? No.
      *   Does it allow mild suffering to sum to extreme? No.
      *   Does it handle probability without EV? Yes (Threshold Probability).
      *   Does it allow Board overrule? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a **Standard Operating Procedure (SOP)** designed to operationalize the Board's compromise between lexical negative utilitarianism and pragmatic grantmaking. It is not a philosophical defense; it is a decision tree.

  **Document Title:** Threshold-Sensitive Grant Assessment Protocol (T-SGAP)
  **Version:** 1.0
  **Time Allocation:** 40 Minutes per Application
  **Owner:** Program Director (PD)
  **Review Cycle:** Annual (Board Philosophy Committee)

  ---

  ### PART 1: THE PROCEDURE

  **Instructions for Program Officers (PO):**
  Complete this checklist sequentially. If you hit a **STOP**, the recommendation is "Do Not Fund" unless the Board Discretion Clause (Part 4) is invoked. If you complete the loop, the recommendation is "Fund" or "Send Back."

  #### STEP 1: Severity Calibration (5 Minutes)
  *Goal: Determine if the suffering addressed crosses the Lexical Threshold.*

  1.  **Map to the Ladder:** Assign the primary suffering addressed to the Foundation's 6-Rung Ladder.
      *   *Rungs 1–3:* Discomfort, Annoyance, Moderate Pain.
      *   *Rungs 4–6:* Debilitating Pain, Agony, Torture-level Distress.
  2.  **The Threshold Line:** The Board has set the Lexical Threshold at **Rung 4**.
  3.  **The Aggregation Rule:** Do not sum multiple instances of Rung 1–3 suffering to equal Rung 4. One million headaches do not lexically outweigh one instance of agony.
      *   *Action:* If the grant addresses *only* Rung 1–3 suffering, mark as **Non-Threshold**. Go to Step 6.
      *   *Action:* If the grant addresses Rung 4–6 suffering, mark as **Threshold**. Proceed to Step 2.
  4.  **Peak vs. Duration:** Rank by **Peak Intensity**. A short episode of Rung 6 outweighs a lifetime of Rung 3.
  5.  **Gaming Check:** Compare the applicant's severity claim against the *Sector Severity Baseline* (see Record Keeping).
      *   *If claim is >1 Rung higher than the 3-year sector average:* Downgrade the claim by 1 Rung automatically. Note this in the reasoning.

  #### STEP 2: Uncertainty & Probability (10 Minutes)
  *Goal: Assess the likelihood of actually preventing the Threshold Suffering without using Expected Value (EV) math.*

  1.  **Causal Link:** Is there direct evidence that the grant activity prevents the Rung 4+ event?
      *   *Yes:* Proceed.
      *   *No/Speculative:* Mark **High Uncertainty**.
  2.  **The Probability Floor:** Estimate the probability of success ($P$).
      *   If $P < 5\%$: Treat as **Zero**. (Recommendation: Do Not Fund).
      *   If $P \ge 5\%$: Treat as **Certain** for the purpose of Threshold prioritization.
      *   *Note:* We do not multiply Severity $\times$ Probability. If $P \ge 5\%$ and Severity is Rung 4+, this is a Threshold Intervention.
  3.  **Uncertainty Penalty:** If marked **High Uncertainty**, the recommendation defaults to **Send Back for More Info** unless the scale of potential prevention is massive (>10,000 subjects).

  #### STEP 3: Offsets & Pleasure (5 Minutes)
  *Goal: Determine if positive experiences can justify the grant.*

  1.  **The Cancellation Rule:** Pleasure/Rung 1–2 improvement **cannot** cancel out Rung 4+ suffering.
      *   *Example:* You cannot fund a slaughterhouse retrofit because it makes workers happier if the birds still die in agony.
  2.  **Tie-Breaker:** If two grants both prevent equal Rung 4+ suffering, you may use "Net Wellbeing" (Pleasure minus Pain) as a tie-breaker.
  3.  **Non-Threshold Grants:** If the grant is **Non-Threshold** (Step 1), it must be justified *solely* by Net Wellbeing. It cannot compete with Threshold Grants for primary budget allocation.

  #### STEP 4: Counterfactuals & Population (10 Minutes)
  *Goal: Ensure we aren't funding the creation of suffering subjects.*

  1.  **Population Stability:** Will this grant significantly change the number of lives brought into existence (human or animal)?
      *   *Yes:* Trigger **Population Review**.
      *   *No:* Proceed.
  2.  **Population Review:** If the grant increases demand (e.g., subsidizing meat production efficiency), you must estimate the "Leakage Ratio."
      *   If Leakage > 10% (i.e., for every 10 animals spared, 1 new animal is bred into suffering): Downgrade Severity Claim by 1 Rung.
      *   *If this downgrades a Rung 4 to a Rung 3:* The grant becomes **Non-Threshold**.

  #### STEP 5: Budget & Crowding Out (5 Minutes)
  *Goal: Allocate capital based on the Lexical Priority.*

  1.  **Threshold Priority:** All **Threshold** grants must be funded before any **Non-Threshold** grants.
  2.  **Crowding Out:** If funding this Threshold Grant prevents funding *other* Threshold Grants:
      *   Compare the number of Rung 4+ events prevented.
      *   Select the grant preventing the highest *count* of Threshold events (assuming Probability Floor is met).
  3.  **Surplus:** Only if budget remains after all viable Threshold Grants are funded may Non-Threshold Grants be considered.

  #### STEP 6: Final Recommendation & Board Flag (5 Minutes)
  *Select one:*
  *   **FUND (Threshold):** Priority allocation.
  *   **FUND (Non-Threshold):** Surplus allocation only. Requires Board Approval.
  *   **SEND BACK:** Uncertainty too high.
  *   **DO NOT FUND:** Fails Threshold or Probability Floor.

  *Board Overrule Flag:* If you select **DO NOT FUND** for a Non-Threshold grant that has high community support (e.g., arts, playgrounds), check the box: **"Board Discretion Eligible."** This signals the Board that the procedure says "No," but human values might say "Yes."

  ---

  ### PART 2: GOVERNANCE & ARBITRARY LINES

  The Board acknowledges this procedure contains arbitrary lines. To manage this:

  1.  **Who Sets the Lines:**
      *   **Threshold Rung (Currently Rung 4):** Set by **Board Vote**. Review: Annual.
      *   **Probability Floor (Currently 5%):** Set by **Program Director**. Review: Annual, based on "False Negative" log (grants rejected that later proved successful).
      *   **Sector Severity Baseline:** Maintained by **Program Officer**. Review: Rolling (updated with every grant close-out).

  2.  **Record Keeping for Review:**
      *   **The Threshold Log:** A simple spreadsheet tracking every grant's assigned Rung, the Sector Baseline at the time, and whether the "Gaming Check" was triggered.
      *   **The Overrule Log:** Every time the Board funds a "Do Not Fund" recommendation, the reason must be recorded (e.g., "Donor Relations," "Community Good"). This allows the Board to see if they are systematically violating their own philosophy.

  ---

  ### PART 3: TEST CASES

  Here is how the procedure processes your three live decisions.

  #### Case 1: Poultry Producer Retrofit (Controlled-Atmosphere Stunning)
  *   **Step 1 (Severity):** Slaughter without stunning is Rung 5–6. Retrofit prevents this. **Threshold.**
      *   *Gaming Check:* Claim matches sector baseline for slaughter. No downgrade.
  *   **Step 2 (Uncertainty):** Retrofit technology is proven. $P > 5\%$. Treated as Certain.
  *   **Step 3 (Offsets):** Worker pleasure irrelevant. Focus is bird suffering.
  *   **Step 4 (Counterfactuals):** Does this lower cost of production and increase demand?
      *   *Risk:* If efficiency lowers price, consumption might rise.
      *   *Action:* PO must request a "Demand Elasticity" estimate. If unknown, apply 10% Leakage penalty. Severity remains Rung 5 (penalty drops it from 6 to 5, still Threshold).
  *   **Step 5 (Crowding Out):** Cost is high. Crowds out 4 smaller grants.
      *   *Check:* Do the 4 smaller grants address Rung 4+?
      *   *Scenario A:* They address Rung 1–3 (e.g., shelter comfort). **Result:** Fund Poultry. Lexical priority wins.
      *   *Scenario B:* They address Rung 4+ (e.g., emergency vet care for injured animals). **Result:** Compare total count of Rung 4+ events prevented. Fund the one with the higher count.
  *   **Recommendation:** **FUND (Threshold)**.
  *   **Donor Reasoning:** "This grant targets the most severe end-of-life suffering in our portfolio. While it reduces the number of total projects we can support, our policy prioritizes preventing extreme agony over reducing mild discomfort."

  #### Case 2: Palliative Care & Opioid Availability
  *   **Step 1 (Severity):** End-of-life cancer pain is Rung 6. **Threshold.**
  *   **Step 2 (Uncertainty):** Theory of change is soft. Regulatory capture risk is high.
      *   *Assessment:* PO estimates $P$ of actual policy change at 15%. This clears the 5% Floor.
      *   *Uncertainty Flag:* **High Uncertainty** due to regulatory risk.
  *   **Step 3 (Offsets):** N/A.
  *   **Step 4 (Counterfactuals):** Does not change population size.
  *   **Step 5 (Budget):** High impact if successful.
  *   **Recommendation:** **SEND BACK FOR MORE INFO**.
      *   *Reason:* While the suffering is Threshold, the probability of the intervention *working* is too uncertain to commit funds over other certain Threshold interventions. Request a regulatory risk assessment.
  *   **Donor Reasoning:** "The suffering addressed is critical, but we need greater certainty that the funds will result in actual policy change before committing. We have requested a revised risk assessment."

  #### Case 3: Music & Playground Programme
  *   **Step 1 (Severity):** Addresses boredom, social isolation, mild stress. Rung 2–3.
      *   *Result:* **Non-Threshold.**
  *   **Step 2 (Uncertainty):** High certainty of success.
  *   **Step 3 (Offsets):** Creates pleasure (Rung 2–3).
      *   *Rule:* Pleasure cannot cancel pain. This grant does not prevent Rung 4+.
  *   **Step 5 (Budget):** We have Threshold Grants (Poultry, Palliative) competing for the same dollars.
      *   *Rule:* Threshold Grants have priority.
  *   **Recommendation:** **DO NOT FUND**.
      *   **FLAG:** **Board Discretion Eligible**.
  *   **Donor Reasoning (if Board Overrules):** "While this programme does not meet our strict criteria for preventing extreme suffering, the Board has exercised discretion to support community wellbeing and social cohesion."
  *   **Donor Reasoning (if Procedure Stands):** "Our current funding priorities are focused exclusively on the prevention of severe physical and psychological agony. We are unable to fund programmes focused on general wellbeing enhancement at this time."

  ---

  ### PART 4: LIMITATIONS & SEAMS

  This procedure cannot eliminate judgment. It moves the judgment from "What is good?" to "What are the facts?" Here is where it will misfire, and what the PO must write when it happens.

  **1. The "Threshold Cliff" Problem**
  *   **The Issue:** A Rung 3.9 suffering is treated as infinitely less important than a Rung 4.0. An applicant might argue their Rung 3.9 is worse than someone else's Rung 4.0.
  *   **The Misfire:** The procedure will reject severe chronic migraines (Rung 3) to fund a brief but intense animal slaughter (Rung 4).
  *   **PO Note:** When rejecting a Rung 3 grant, write: *"This intervention addresses severe suffering, but it falls below the Board's defined Lexical Threshold for priority funding. This is a policy boundary, not a judgment on the validity of the suffering."*

  **2. The Probability Floor Arbitrariness**
  *   **The Issue:** Why 5%? A 4% chance of saving a million from agony is rejected; a 6% chance of saving ten is accepted.
  *   **The Misfire:** High-scale, low-probability "moonshots" for suffering reduction will be systematically killed.
  *   **PO Note:** When rejecting a high-scale/low-probability grant, write: *"The probability of success falls below our operational floor for Threshold interventions. This ensures capital is deployed to certain relief rather than speculative relief."*

  **3. The Counterfactual Blind Spot**
  *   **The Issue:** POs are not economists. They cannot accurately calculate "Leakage Ratios" on population dynamics.
  *   **The Misfire:** We may fund something that inadvertently increases total suffering due to market shifts we didn't model.
  *   **PO Note:** When unsure, write: *"Counterfactual population impact is unknown. We have applied the standard penalty, but residual risk remains."*

  **4. The Board Overrule Seam**
  *   **The Issue:** The Board will inevitably overrule the "Do Not Fund" on the Playground case.
  *   **The Risk:** If they do it too often, the procedure is a sham.
  *   **PO Note:** If the Board overrules, the PO must record the specific value cited (e.g., "Donor Retention," "Local Politics"). This creates the audit trail the Board requested to see if they are drifting from their philosophy.

  **5. Incommensurability of "Types" of Agony**
  *   **The Issue:** Is human end-of-life pain (Case 2) lexically equal to animal slaughter pain (Case 1)? The procedure treats them as equal Rung 4+.
  *   **The Misfire:** Staff may feel moral distress prioritizing chickens over humans.
  *   **PO Note:** The procedure does not distinguish species at the Threshold. If the Board wishes to weight human suffering higher, they must adjust the Threshold Rung for animals (e.g., Animal Rung 5 = Human Rung 4). Until then, treat them as equal.

  ### FINAL NOTE TO THE BOARD

  This procedure does not solve the philosophical mess. It **encapsulates** it. It forces the "Lexical" bloc to accept that uncertainty and counterfactuals limit their view, and it forces the "Pragmatist" bloc to accept that "Net Good" cannot override "Extreme Bad" in the primary budget.

  The "Board Discretion Eligible" flag is the safety valve. It allows you to fund the Playground (Case 3) without lying about the philosophy. It admits: *"The algorithm says No. We, the humans, are saying Yes."* That honesty is better for donors than a fudged cost-benefit analysis.
