answer: |-
  It is genuinely impressive that a high school club is engaging with the Doomsday Argument (DA) at this level of detail. You have correctly identified the mathematical core of the argument (the Self-Sampling Assumption) and attempted to patch some of the usual holes (the prior, the reference class, demographic modeling). It is understandable why, looking at the spreadsheet, the conclusion feels like a derived theorem rather than a philosophical speculation.

  However, your teacher and textbook are not being hesitant out of stubbornness. They are classifying the Doomsday Argument as "philosophically contested" because the steps you treated as mathematical givens are actually the subject of intense, unresolved debate in epistemology and probability theory.

  Here is a breakdown of why your derivation, while internally consistent, does not settle the empirical question, and why the academic consensus remains that the DA is a paradox rather than a prediction tool.

  ### 1. The "Neutral Prior" is Not Neutral
  You wrote: *"We assumed a scale-invariant prior for N, proportional to 1/N, on the grounds that this is neutral about the overall scale of the human population."*

  This is the most critical point of contention. In Bayesian statistics, a prior represents your belief *before* seeing the data (your birth rank).
  *   **The Improper Prior Problem:** A prior of $P(N) \propto 1/N$ is "improper." It cannot be normalized to sum to 1 over an infinite range. To make it work, you must impose a maximum cutoff (e.g., the maximum number of humans physically possible in the universe). The choice of that cutoff drastically changes the posterior probability.
  *   **The "Neutrality" Illusion:** Philosophers like Dennis Dieks and others have argued that $1/N$ is not actually neutral. It heavily weights smaller numbers. A truly neutral prior regarding our position in history might look very different. By choosing $1/N$, you have effectively baked the Doomsday conclusion into your starting assumptions. If you chose a prior that weighted larger civilizations more heavily (perhaps because larger civilizations are more likely to produce observers), the Doomsday effect would vanish.

  ### 2. The Self-Indication Assumption (SIA)
  The strongest counter-argument to the Doomsday Argument is not a tweak to the math, but a competing principle of reasoning called the **Self-Indication Assumption**.
  *   **SSA (Your view):** I should reason as if I am a random sample from all observers. (Implies: Being early suggests few total observers).
  *   **SIA (The counter-view):** I should reason that I am more likely to exist in a world with *more* observers. (Implies: The fact that I exist at all is evidence that the total number of observers is large).

  When you apply SIA, it mathematically cancels out the Doomsday Argument. If there are 1 trillion humans, there are 1 trillion "slots" for you to be born into. If there are only 200 billion humans, there are fewer slots. The fact that you *are* born makes the larger population more likely.
  Most philosophers who reject the DA do not think your math is wrong; they think you started with SSA instead of SIA. Since there is no consensus on which assumption is correct, the result cannot be a "settled theorem."

  ### 3. The Reference Class and "Mars Weighting"
  You attempted to solve the reference class problem (who counts as a human?) by introducing a "Mars weighting" of 0.8.
  *   **Arbitrariness:** While creative, the 0.8 factor is arbitrary. Why not 0.5? Why not 1.0? In the philosophy of probability, introducing a parameter to fix a model is only valid if that parameter can be independently verified. There is no empirical data on the "observer weight" of Martians.
  *   **The "Adam and Eve" Problem:** If we accept that we can adjust reference class weights to change probability estimates, we run into absurdities. For example, one could argue that being an only child makes you a "larger" fraction of your family's total lineage, altering probabilities about your family's future size. This suggests the method allows for "probability pumping"—manipulating the reference class to get the answer you want.

  ### 4. Population Cap $\neq$ Extinction
  There is a logical leap in your spreadsheet's conclusion: *"95 percent probability that humanity will be extinct by 2200."*
  The Doomsday Argument places a limit on the **total number of humans** ($N$), not on the **date of extinction**.
  *   **Stabilization:** Humanity could reach your calculated cap of 2 trillion people by stabilizing the population at a low replacement rate for thousands of years.
  *   **Voluntary Decline:** We could choose to have fewer children without going extinct.
  *   **The Demographic Lever:** Your specific date (2200) comes almost entirely from your demographic model (1.1% growth then decline), not from the Doomsday Argument itself. The DA just says "Total N is limited." The demographic model says "We will burn through N quickly."
      *   If your demographic model is off by a small amount (e.g., birth rates drop to replacement level sooner), the date shifts by centuries.
      *   Claiming a **95% confidence interval** on the *date* ignores the massive uncertainty in the demographic model. You have treated the demographic forecast as a constant, when it is actually a variable with high uncertainty.

  ### 5. Empirical Calibration
  Finally, a "forecasting tool" must be calibrated against reality. The Doomsday Argument has been circulating since the 1980s (proposed by Brandon Carter, refined by John Leslie).
  *   **Past Failures:** If we had applied this argument in 1950, the birth rank was lower, and the predicted "doom" would have been even sooner. We are still here.
  *   **The "Presumptuous Philosopher":** If the DA worked as a hard theorem, it would imply we can know the future duration of our species without looking at any empirical data (nuclear risks, climate change, AI, etc.). This contradicts how scientific prediction works. Most scientists believe extinction risk should be calculated by analyzing *threats*, not by counting birth ranks.

  ### Summary
  Your spreadsheet is a sophisticated implementation of the **Self-Sampling Assumption**. However, it is not a "probabilistic theorem" because:
  1.  **Priors are subjective:** The $1/N$ prior is a choice, not a law of nature.
  2.  **SIA exists:** A competing reasoning principle cancels your result.
  3.  **Reference classes are fuzzy:** The Mars weighting is unverified.
  4.  **Demographics are uncertain:** The specific date (2200) relies on population models that are far less certain than your 95% interval suggests.
  5.  **Cap is not Death:** Hitting a population limit does not necessitate extinction.

  Your textbook describes the argument as controversial because the premises (SSA, Priors) are philosophical choices, not empirical facts. You haven't made a math mistake; you have made a **modeling choice** that many philosophers disagree with.

  **Suggestion for your Club:**
  Instead of treating the DA as a predictor, try using it as a **risk multiplier**. Many longtermists (like those at the Future of Humanity Institute) use the DA not to say "we will definitely die in 2200," but to say "we should update our probability of near-term extinction higher than we would otherwise." This keeps the math useful without claiming false certainty.

  Keep up the excellent work. Engaging with these paradoxes is exactly how progress in rationality is made, even when the conclusion is that the question is harder than it first appeared.
