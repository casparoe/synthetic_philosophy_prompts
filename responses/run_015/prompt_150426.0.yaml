      *   *The Core Conflict:* The Non-Identity Problem arises precisely because climate policy (like aggressive mitigation) changes the course of history, thereby changing *who* is born. If (1) is true, the future people who exist under a mitigation regime cannot claim they were harmed by that regime (compared to the alternative of non-existence). If (2) is true, we can't appeal to "impersonal value" to justify the policy. So, where does the obligation in (3) come from? It claims to be justified by harm to *specific* future people. But if mitigation changes identity, those specific people wouldn't exist under the "high emission" scenario.
      *   *Wait, let's look closer at (3).* It says obligations are justified by harm climate change will cause to specific future people. This implies a comparison: World A (High Emissions) vs. World B (Low Emissions).
