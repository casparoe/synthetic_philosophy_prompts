answer: |-
  Consider a multi-center clinical trial managed by a central algorithmic consortium where researcher career advancement depends strictly on the exclusive right to analyze patient data before public release. In the distributed version, the consortium mandates that 1,000 identifiable principal investigators each surrender one week of exclusive analysis time to refine a public health predictive model, resulting in a total career delay of 1,000 weeks across the community for a marginal gain in model accuracy. In the concentrated mirror-image version, the consortium selects a single identifiable investigator to surrender 1,000 weeks of exclusive analysis time—effectively stalling their entire mid-career trajectory—to achieve the exact same marginal gain in model accuracy, with no other researchers bearing any burden. The harm is not physical injury but the loss of professional priority and tenure eligibility, a currency any working scientist recognizes as vital.

  The utilitarian evaluates both scenarios identically, accepting them because the total aggregate benefit of improved public health modeling outweighs the total aggregate burden of 1,000 weeks, regardless of whether that burden is spread thinly or concentrated heavily. The separateness objector, however, distinguishes the two: they reject the distributed version because it requires summing small burdens across 1,000 distinct moral boundaries, treating separate lives as a single container for welfare calculus, but they permit the concentrated version because no cross-personal aggregation of burdens occurs—the sacrifice is contained within a single life, so the structural violation of separateness is absent. The contractualist rejects the concentrated version outright, arguing that no principle could be reasonably accepted by a single individual who is asked to sacrifice their entire career for a marginal public gain, regardless of whether others are also burdened. The precise structural feature forcing this reversal is not the magnitude of harm or the number of people involved, but the *topology of the burden distribution* relative to the operation of summation; the separateness objection triggers only when the justification requires adding across distinct persons, whereas contractualism triggers when the justification fails for any single person.

  This reversal demonstrates that the separateness objection is genuinely about the illegitimacy of the *aggregative mechanism* itself, rather than the substantive protection of individuals from heavy burdens. If the objection were merely about protecting welfare levels or preventing fungibility in a substantive sense, it would forbid the concentrated sacrifice just as strongly as the distributed one, since in both cases an individual is used as a means for the general good. By permitting the concentrated case, the objection reveals itself as a formal constraint on moral reasoning—a prohibition against extending the principle of choice from one person to many—rather than a substantive shield against tyranny. This implies the scope of the objection is narrower than often assumed: it blocks utilitarian calculus specifically when it sums across boundaries, but it does not inherently forbid sacrificing one person for the many if that sacrifice is not justified by summing the burdens of others. Consequently, the separateness objection must be supplemented by a substantive theory of rights or contractual justification to protect individuals from concentrated exploitation, proving that separateness is a condition on how we count, not a guarantee of what we cannot lose.
