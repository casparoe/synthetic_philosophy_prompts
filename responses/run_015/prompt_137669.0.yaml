prompt: |-
  Bit of a panic — I've somehow agreed to do a fifty-minute guest session next week on a second-year biology module called Concepts in Biology, and it's the first time I've taught anything on my own (I'm a first-year PhD in HPS, my supervisor volunteered me without asking). The topic is biological function: the disagreement between the etiological or selected-effect account and the causal-role account. I don't want a reading list or a lecture script; I want a plan for how to actually build the thing in the room. There'll be about thirty of them, they've done natural selection and a bit of physiology and one genomics module where people toss around the word function constantly, most are either applying to medicine or heading for ecology, and the convenor — a behavioural ecologist who thinks function just means adaptation and that philosophy is what you do when you can't get grant money — will be sitting at the back. Two or three of them have read some popular evolutionary stuff and will say, quite confidently, that a thing's function is obviously just what it was selected for. I've got a whiteboard and no slides.

  What I mainly want help with is the shape of the explanation. My instinct is that whatever comes first has to be that the two accounts were built to answer two different questions — roughly, why is this thing here at all, versus what is this part contributing such that the system containing it can do what it does — and that most of the cross-talk between the two camps and basically all of the confusion in a room like this comes from those two questions getting welded into one. But I genuinely don't know whether that belongs at the start as the frame or at the end as the payoff, and whether saying it too early just sounds like a cop-out to students who want to be told who's right. The case I'd like to hang everything on is a duplicated gene: an ancestral gene does job A, it gets duplicated, one copy carries on with A, the second copy drifts, picks up a mutation that makes it bind a new substrate, and that binding is genuinely useful to the organism right now — except the copy is still at low frequency and its presence in the population isn't explained by that benefit yet, so the etiological verdict looks like something like not yet, while the causal-role verdict looks like yes, it has a new function already. Is that the right case to carry the whole fifty minutes, or does it smuggle in too much too early? Should I open with something blunter and then complicate it? And where does the handover sort of case fit — a trait that was selected for one thing, now does a different thing, and is currently being maintained for the new thing? Give me the order the pieces have to go in and why each one depends on the one before it, not just a list of things to mention.

  Then the misconceptions, which I'm more worried about creating than about answering. I think I'll manufacture at least these: the teleology panic, where they hear selected for and decide I've smuggled purpose or designedness back into biology; the idea that the causal-role account is committed to every last thing an organ doing being one of its functions and is therefore just silly; the thought that the whole dispute is verbal and nothing is at stake; and the one I find hardest, where they conclude that on the etiological account you can't say what a newly discovered structure is doing until you know its selection history, which they'll take as a reductio when I suspect half the literature takes it as a feature. Tell me where in the sequence each of those should be headed off rather than waited for, and what I should say to the convenor's version of the point, which is that this is all obvious and functions are adaptations. Also: what should I openly refuse to settle in fifty minutes and say out loud that I'm refusing — I'm guessing the malfunction and disease stuff and anything about mental content, but I'd rather you judged. And I need one question to put to them at the end that would show me they'd got the disagreement rather than just memorised which account is which.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** First-year PhD student in History and Philosophy of Science (HPS).
      *   **Task:** 50-minute guest lecture on "Biological Function" (Etiological/Selected-Effect vs. Causal-Role).
      *   **Experience:** First time teaching solo. Panic mode.
      *   **Audience:** 30 second-year biology students. Background: Natural selection, physiology, genomics. Future: Medicine or Ecology.
      *   **Constraints:** Whiteboard only (no slides). 50 minutes.
      *   **Key Stakeholder:** The convenor (Behavioural Ecologist) sitting at the back. Believes function = adaptation, philosophy = useless.
      *   **Specific Content Requests:**
          *   Structure/Order of explanation (Frame vs. Payoff).
          *   Case Study: Duplicated gene (is it too complex for the start?).
          *   Case Study: Exaptation/Handover (where does it fit?).
          *   Misconceptions to preempt (Teleology, Causal-Role triviality, Verbal dispute, Etiological paralysis).
          *   What to explicitly leave unresolved.
          *   Final assessment question.
      *   **Tone:** Practical, strategic, reassuring but rigorous. No reading lists or scripts.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Tension:* Biology students want *answers* (What is the function?), Philosophy offers *conceptual clarification* (What do you mean by 'function'?).
      *   *The Convenor Threat:* If the lecture seems too abstract or undermines adaptationism too hard, the convenor will be unhappy. If it's too simplistic, the PhD student loses credibility.
      *   *The "Cop-out" Fear:* Framing it as "two different questions" too early might feel like dodging the question "Which one is right?"
      *   *The Whiteboard Constraint:* Needs visual scaffolding. No hiding behind bullet points.

  3.  **Address the Specific Content Questions:**

      *   *Frame vs. Payoff:* The "Two Questions" frame *must* come early, but not as an abstract declaration. It needs to emerge from a puzzle. If you say it first, it sounds like a dodge. If you say it last, they've been confused for 40 minutes. *Solution:* Introduce the puzzle first, let them feel the tension, *then* reveal the frame as the tool to resolve it.
      *   *The Duplicated Gene Case:* This is the perfect "tipping point" case. It's too complex for minute 1. It needs to be the climax where the two theories diverge.
      *   *The Handover (Exaptation) Case:* This is the classic etiological test case (feathers for warmth -> flight). It should come before the gene duplication to establish the etiological view's strength regarding history.
      *   *Misconceptions:*
          *   *Teleology:* Address immediately when defining Etiological.
          *   *Causal-Role Triviality:* Address when defining Causal-Role (the "everything is a function" objection).
          *   *Verbal Dispute:* Address near the end (stakes).
          *   *Etiological Paralysis:* Address when discussing new traits/diseases.
      *   *What to Leave Unresolved:* Disease/Malfunction is actually crucial for the Etiological account (Boorse), but maybe too much for 50 mins. Mental content is definitely out. Let's suggest leaving *normativity* (what makes a function 'good') slightly open, but definitely avoid mental content.
      *   *Final Question:* Needs to test application, not definition.

  4.  **Drafting the Sequence (The "Shape"):**

      *   *Minute 0-5: The Hook (The Genomics Trap).* Use their background. "You say this gene has a function. What do you mean?" Show the ambiguity.
      *   *Minute 5-15: Account 1 (Etiological).* The "History" view. Use the Exaptation case (Feathers). Address Teleology here.
      *   *Minute 15-25: Account 2 (Causal-Role).* The "System" view. Use the Heart pumping blood vs. making sound. Address the "Triviality" objection here.
      *   *Minute 25-35: The Clash (The Duplicated Gene).* This is the core. Show where they disagree.
      *   *Minute 35-45: Stakes & The Convenor.* Why does this matter? (Medicine vs. Ecology). Address the "Verbal Dispute" and "Paralysis" objections.
      *   *Minute 45-50: Conclusion & Assessment.*

  5.  **Refining the Strategy (Addressing the "Why"):**
      *   *Why this order?* It moves from intuition (genomics) to established theory (adaptation) to physiological reality (causal role) to the conflict (duplication) to the synthesis/utility.
      *   *Handling the Convenor:* Acknowledge adaptationism is dominant in ecology (validate him) but show why physiology/medicine needs the other view (validate the students' other interests).
      *   *Whiteboard Plan:* Needs to be visual. Two columns? A timeline? A system diagram? Let's suggest a split board: Left (History/Etio), Right (System/Causal), Middle (The Conflict Case).

  6.  **Developing the Misconception Interventions:**
      *   *Teleology:* Don't wait. As soon as "Selected For" is written, write "NOT Goal-Directed" next to it.
      *   *Triviality:* When defining Causal-Role, ask "Does the heart's sound have a function?" Distinguish *capacity* from *function*.
      *   *Paralysis:* When discussing the duplicated gene, acknowledge the etiological "Not Yet" verdict. Frame it as "Cautious" not "Blind."
      *   *Verbal Dispute:* Save for the "Stakes" section. Show how it changes experimental design.

  7.  **Final Review against Constraints:**
      *   50 minutes? Yes, the timing looks tight but doable.
      *   No slides? The whiteboard plan is essential.
      *   PhD panic? Keep the tone supportive and authoritative.
      *   Convenor at the back? Ensure the "Adaptation is important" point is made clearly so he doesn't feel attacked.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* I initially thought about putting the "Two Questions" frame at the very start. But the user is worried it sounds like a cop-out. I'll advise putting it at Minute 5, *after* the initial puzzle is raised. This makes it a solution, not an evasion.
      *   *Correction on the Gene Case:* The user worries it smuggles in too much. I need to explain *how* to simplify it on the board. Ancestral Gene -> Duplication -> Drift -> New Binding. Keep it visual.
      *   *Correction on Misconceptions:* The "Etiological Paralysis" (can't identify new functions) is the hardest. I need to give a specific script for this. It's not that you *can't* say what it does, it's that you can't say it's a *function* yet. Distinction between 'activity' and 'function'.

  9.  **Final Polish:** Check the tone. Needs to be "Here is the battle plan" not "Here is some advice." Empower the user. (Proceed to generate response).

  *(Self-Correction during final output generation)*: Make sure to explicitly answer the "What to refuse to settle" question. Disease is actually a strong point for Etiological (malfunction = failure of selected effect), but it takes time. Better to flag it as "This is where it gets messy" rather than solving it. Mental content is definitely out.

  Let's organize the response into:
  1.  The Strategic Frame (The "Two Questions" timing).
  2.  The Minute-by-Minute Architecture (with Whiteboard instructions).
  3.  The Misconception Interceptions (Where to kill them).
  4.  The Convenor Management.
  5.  The Exit Ticket.

  This structure mirrors the user's request for "order the pieces have to go in and why."

  *(Final thought on the Duplicated Gene)*: It is the right case, but only if introduced *after* the definitions are solid. If introduced too early, it's just confusing biology. If introduced after the definitions, it's the perfect stress test. I will advise placing it at the climax.

  *(Final thought on the Convenor)*: The user is worried about the convenor thinking philosophy is useless. The key is to show that *ecology* needs Etiological and *physiology/medicine* needs Causal-Role. Both are valid tools. This validates the convenor without surrendering the philosophical point.

