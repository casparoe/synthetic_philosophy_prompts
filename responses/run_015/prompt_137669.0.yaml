answer: |-
  This is a classic HPS teaching moment: you are not there to teach them *biology* (they know more biology than you), and you are not there to teach them *philosophy* (they don't care about the metaphysics). You are there to teach them **conceptual hygiene**.

  Here is the battle plan. It is designed to protect you from the "cop-out" accusation, manage the convenor, and use the whiteboard to do the heavy lifting.

  ### 1. The Strategic Frame: When to reveal the "Two Questions"

  **Do not start with the frame.** If you open with "There are two different questions here," thirty second-years will hear "I am not going to answer the question."

  **Do not end with the frame.** If you wait until the end, they will spend 40 minutes frustrated that the two accounts contradict each other.

  **The Solution:** Introduce the frame at **Minute 10**, as the *solution to a puzzle* you generated in the first 10 minutes.
  1.  **Minutes 0–10:** Generate the conflict using a concrete example where their intuition splits.
  2.  **Minute 10:** Reveal the frame: "You are feeling a conflict because you are trying to answer two different questions with one word."
  3.  **Minutes 10–50:** Use the frame to organize the rest of the lecture.

  ### 2. The Minute-by-Minute Architecture (Whiteboard Plan)

  Divide your whiteboard into three vertical sections.
  *   **Left:** History / Etiological (SE)
  *   **Right:** System / Causal-Role (CR)
  *   **Middle:** The Test Cases (where you draw the diagrams)

  #### **Phase 1: The Trap (0–10 mins)**
  *   **Action:** Write "FUNCTION?" in the middle. Ask them: "In your genomics module, you said Gene X has a function. What did you mean?"
  *   **Expected Answers:** "It binds to Y," "It was selected for Z," "It helps the organism survive."
  *   **The Pivot:** Write two specific scenarios on the board (keep it brief).
      1.  *The Heart:* It pumps blood (selected effect). It also makes a "thump-thump" sound (causal effect). Is the sound a function? (Most will say no).
      2.  *The New Mutation:* A gene duplicates. Copy 2 drifts, binds a new substrate, helps the organism *now*, but isn't fixed in the population yet. Does it have a function? (Ecologists will say 'no/not yet'; Physiologists will say 'yes').
  *   **The Reveal:** Draw a line down the middle of the board. "You are disagreeing because you are answering different questions."
      *   **Left Side:** "Why is this trait *here*?" (History/Etiology)
      *   **Right Side:** "What is this trait *doing*?" (System/Capacity)
  *   **Why this works:** You aren't dodging the question; you are diagnosing their confusion.

  #### **Phase 2: The Etiological Account (10–25 mins)**
  *   **Focus:** The Left Side of the board.
  *   **Definition:** Function = The effect for which the trait was **selected**.
  *   **Case Study:** **Exaptation (The Handover).** Draw a dinosaur feather.
      *   *Original:* Insulation (Selected For).
      *   *Current:* Flight (Current Utility).
      *   *Verdict:* On this account, the function is *insulation*. Flight is a beneficial use, but not the function yet.
  *   **Misconception Interception (Teleology):** As soon as you write "Selected For," write **"NOT GOAL-DIRECTED"** next to it. Say explicitly: "This is not about what the gene *wants*. It is about the historical filter that kept the gene in the pool."
  *   **Misconception Interception (Paralysis):** A student will ask: "So if I find a new organ, I can't say what it does until I dig up fossils?"
      *   *Your Answer:* "You can say what it *does* (activity). You just can't claim it is a *function* (normative status) until you know the history. This account is cautious. It prevents us from calling every beneficial accident a function."
  *   **Convenor Management:** Look at the back of the room. "This is the account that underpins adaptationism in ecology. If you want to know why a trait exists in a population, this is the tool." (This validates his worldview without conceding the whole lecture to it).

  #### **Phase 3: The Causal-Role Account (25–35 mins)**
  *   **Focus:** The Right Side of the board.
  *   **Definition:** Function = The causal contribution of a part to the **capacity of the containing system**.
  *   **Case Study:** **The Heart.**
      *   System: Circulatory System. Capacity: Circulate blood.
      *   Part: Heart. Contribution: Pumping. -> **Function.**
      *   Part: Heart. Contribution: Making noise. -> **Not a Function** (unless the system is 'making noise', which it isn't).
  *   **Misconception Interception (Triviality):** Students will think: "So everything it does is a function?"
      *   *Your Answer:* "No. Only the contributions that explain the *system's* capacity. The sound doesn't explain circulation. This account is about **mechanism**, not history."
  *   **Why this matters:** "If you are in medicine, you care about this. If a patient's heart is making noise, you need to know how that affects the system's capacity *now*, regardless of evolutionary history."

  #### **Phase 4: The Clash (The Duplicated Gene) (35–45 mins)**
  *   **Focus:** The Middle of the board.
  *   **Action:** Draw the gene duplication case you proposed.
      *   Ancestral Gene (Job A) -> Duplication -> Copy 2 Drifts -> Copy 2 Binds Substrate B (Beneficial now, low frequency).
  *   **The Verdict:**
      *   **Etiological (Left):** "No function yet." (It hasn't been selected for B).
      *   **Causal-Role (Right):** "Function is B." (It contributes to organism survival now).
  *   **Misconception Interception (Verbal Dispute):** "Is this just semantics?"
      *   *Your Answer:* "No. It changes how you research."
      *   *Ecologist (Etio):* Will ignore Copy 2 until it's fixed in the population.
      *   *Physician/Genomicist (CR):* Will study Copy 2 immediately because it affects the patient's phenotype *now*.
      *   *Point:* "Both are right, but for different research programmes."

  #### **Phase 5: Wrap and Assessment (45–50 mins)**
  *   **What to Refuse to Settle:**
      *   **Disease/Malfunction:** "If function is selected effect, malfunction is failure to perform selected effect. If function is causal role, malfunction is system failure. We don't have time to solve the philosophy of medicine today, but notice how your definition changes what counts as 'disease'."
      *   **Mental Content:** Do not mention this. It is a trap.
  *   **The Final Question:** Do not ask "Define Etiological." Ask this:
      *   *"I have a vestigial structure (e.g., the human appendix). It currently does nothing useful, but it was selected for in ancestors. On the Etiological account, does it have a function? On the Causal-Role account, does it have a function? Which account is more useful for a surgeon removing it, and which is more useful for an evolutionary biologist studying gut morphology?"*
      *   *(Answer: Etio = Yes (ancestral); CR = No (currently contributes nothing). Surgeon = CR (causal impact on body now); Biologist = Etio (why is it there?)).*

  ### 3. Managing the Convenor (The Behavioural Ecologist)

  He thinks philosophy is a waste of time. He thinks function = adaptation.
  *   **Do not fight him.** If you try to prove adaptationism is wrong, he will intervene or undermine you later.
  *   **Validate then Contain:** "The Etiological account is the rigorous philosophical formulation of the adaptationist programme. It formalizes what you already do."
  *   **The Pivot:** "However, half of you are going into medicine. In a hospital, evolutionary history is irrelevant to the immediate causal failure of an organ. The Causal-Role account gives you the vocabulary for physiology."
  *   **Result:** You tell the ecologist he's right about ecology, and you tell the med students they need a different tool for medicine. Everyone feels validated.

  ### 4. Summary of Misconception Interceptions

  | Misconception | When to Head Off | What to Say (Whiteboard Script) |
  | :--- | :--- | :--- |
  | **Teleology** | Minute 15 (Defining Etiological) | Write **"HISTORY, NOT GOALS"**. "Selection is a filter, not a designer." |
  | **Causal-Role Triviality** | Minute 30 (Defining Causal-Role) | "Not every *effect* is a *function*. Only effects contributing to the *system capacity*." |
  | **Etiological Paralysis** | Minute 20 (Exaptation Case) | "We can describe the *activity* without assigning the *function*. It's a feature, not a bug: it stops us calling every accident a function." |
  | **Verbal Dispute** | Minute 40 (The Gene Clash) | "It dictates experimental design. Do you wait for fixation (Etio) or study the phenotype now (CR)?" |

  ### 5. Why this order works for *you*

  1.  **Safety:** You start with their biology (genomics/physiology), not philosophy. You establish competence immediately.
  2.  **Scaffolding:** The whiteboard columns keep you on track. If you panic, look at the board. Left = History. Right = System. Middle = Conflict.
  3.  **The "Cop-out" Defense:** By waiting until Minute 10 to reveal the "Two Questions" frame, you prove that the distinction is *necessary* to solve the puzzle, not a way to avoid it.
  4.  **The Gene Case:** It is the right case, but only as the climax. If you use it too early, it's just complex biology. Used at Minute 35, it is the philosophical stress test that proves why you need two accounts.

  **Final advice:** You are the expert in the room on *concepts*. They are the experts on *organisms*. Do not try to out-biology them. When they challenge you on biological details, defer: "That's an empirical question for the biologists. My question is: whatever the empirical fact turns out to be, which concept of function are you using to describe it?"

  Good luck. You know this material. The structure will hold you.
