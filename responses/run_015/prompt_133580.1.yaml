answer: |-
  This is a classic reconstruction of the **Aggregation Problem** (or the "Numbers Problem") for Scanlonian contractualism. Your colleague has presented a rigorous dilemma that has occupied Scanlon and his critics for decades.

  You are right to feel stuck: the argument is valid, but it relies on a false dichotomy in the final step. Since you prefer to keep (1) (the definition of wrongness) and (9) (the denial of aggregation), the step you must reject is **(10)**.

  Here is the breakdown of why (10) is the misstep, how to defend that rejection, and exactly what you pay for it.

  ### 1. Why Step (10) is the Misstep
  Step (10) claims: *"Yet if they do not sum, then in every conflict case... we lack any metric for comparison, leaving contractualism silent."*

  This is false. Denying aggregation (summing) does not entail denying **comparison**. Contractualism has a metric for comparison that is not additive: **Pairwise Comparison of Individual Complaints.**

  *   **The Mechanism:** When comparing Principle F (forbid killing) and Principle A (allow killing), you do not add up the five complaints on one side. Instead, you compare the *strongest individual complaint* against F with the *strongest individual complaint* against A.
  *   **The Result:** In your scenario, the strongest complaint against F is "I will die" (from one of the five). The strongest complaint against A is "I will die" (from the one). These complaints are of equal strength.
  *   **The Tie-Break:** Because the individual burdens are identical, the principles are initially tied. However, contractualism is not silent here. It allows for **secondary tie-breaking principles** that are themselves subject to reasonable rejection. A principle like *"When individual burdens are equal, minimize the number of people who suffer that burden"* can be introduced.
  *   **Why it's not Aggregation:** This secondary principle is not justified because 5 deaths > 1 death (aggregation of value). It is justified because, *ex-ante*, every rational agent would prefer a world governed by a rule that maximizes their statistical chance of survival when burdens are equal. No one could reasonably reject a tie-breaking rule that favors the greater number, because rejecting it would lower their own expected survival rate in future scenarios.

  By rejecting (10), you assert that non-aggregative comparison is possible via pairwise matching and ex-ante tie-breaking.

  ### 2. What You Pay (The Cost)
  Keeping (1) and (9) while rejecting (10) saves the theory from paralysis, but it comes with three significant theoretical costs. You need to be prepared to pay these in your seminar.

  **Cost A: The Shift from Ex-Post to Ex-Ante**
  Pure contractualism focuses on the actual burdens people face (*ex-post*). To solve the numbers problem without aggregation, you are forced to lean heavily on *ex-ante* reasoning (what people would agree to behind a veil of ignorance regarding who will be the one or the five).
  *   *The Price:* You blur the line between contractualism and hypothetical contract theory (like Rawls). You are no longer just looking at the specific victims' complaints; you are appealing to a general rule that benefits everyone statistically. Some purists argue this dilutes the "individualistic" core of Scanlon's view.

  **Cost B: Complexity and "Smuggling"**
  You must explain why the tie-breaking principle ("save the greater number") is not just utilitarianism in disguise.
  *   *The Price:* You have to walk a tightrope. If you say the principle is justified because it leads to better overall outcomes, you collapse into consequentialism. If you say it is justified because it is fair *ex-ante*, you must explain why fairness trumps the specific complaint of the one person who *actually* dies. You pay with theoretical purity; the view becomes a hybrid of individual complaint and rule-based fairness.

  **Cost C: Residual Ambiguity (The "Scanlonian Hesitation")**
  It is worth noting that Scanlon himself struggled with this. In *What We Owe to Each Other*, he admits that if the burdens are truly identical (death vs. death), contractualism might not *require* saving the five, but only *permit* it.
  *   *The Price:* By insisting (as your argument's Step 8 does) that contractualism *forbids* killing the one, you are taking a harder line than Scanlon sometimes did. You pay with certainty. You must argue that the tie-breaking principle is *mandatory*, not just permissible. If you cannot ground that mandatory status without summing, the paralysis of (10) threatens to return.

  ### 3. How to Frame This in Seminar
  To defend your position, propose the following modification to the argument:

  1.  **Accept (1) and (9):** Affirm that wrongness is about reasonable rejection and that burdens do not sum mathematically.
  2.  **Reject (6):** Explicitly mark this as the utilitarian intrusion. The "weight" of rejection is not a quantity to be multiplied.
  3.  **Reject (10):** Argue that "metric for comparison" $\neq$ "summation."
      *   *Argument:* "We compare the *strength* of the strongest individual rejection. Since 'death' equals 'death', the primary complaints tie. We then ask: Could the one reasonably reject a tie-breaking rule that saves the greater number? No, because from an ex-ante perspective, that rule serves everyone's interest. Therefore, A is rejected not because 5 > 1, but because the *principle* allowing A violates a secondary rule of fairness no one could reject."
  4.  **Acknowledge the Cost:** Concede that this moves contractualism toward a two-tier system (primary burden comparison + secondary fairness rules) and relies on ex-ante reasoning.

  ### Summary
  The misstep is **(10)**. It assumes that without summation, there is no way to decide. There is: **Pairwise Comparison + Ex-Ante Tie-Breaking.**

  **The Bill:** You pay by making contractualism more complex, relying on ex-ante statistical reasoning rather than just ex-post burden comparison, and risking the charge that your "tie-breaker" is just rule-utilitarianism in contractualist clothing. However, this is the standard and most robust way to defend Scanlon against the Aggregation Problem.
