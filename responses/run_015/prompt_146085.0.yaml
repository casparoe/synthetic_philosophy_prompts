answer: |-
  ### Logical Framework

  To map the positions without jargon, this quiz sorts views along three axes:
  1.  **First-Order Priority:** When you have direct access to the evidence (e.g., a math sum you checked), does that trump the fact that someone else disagrees?
  2.  **Defeater Strength:** Does learning about a disagreement *force* you to suspend judgment, or does it merely add weight to the other side?
  3.  **Weighting Metric:** When you do adjust your view, do you count heads (everyone counts equally) or weigh by reliability (track records matter)?

  The "Positions" table below maps specific answer patterns to philosophical views. The JSON sections identify combinations that are logically broken or practically identical.

  ### Quiz Questions

  | # | Case (one sentence) | Option A | Option B | Option C | Axis this question separates |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | You check a long sum twice by hand; a peer says it's wrong, but you can't redo it. | Stick with your result. | Split confidence 50/50. | Defer to their result. | First-Order Priority |
  | 2 | A peer has a better track record on this topic, but you checked this specific case more closely. | Trust your specific check. | Weight their record against your check. | Trust their general record. | Weighting Metric |
  | 3 | You disagree with yourself from last week, when you were exhausted and in a foul mood. | Trust your current self. | Average the two views. | N/A | First-Order Priority (Temporal) |
  | 4 | You only hear from critics via journalist emails; supporters never bother writing. | Ignore the emails (biased sample). | Lower confidence (someone disagrees). | N/A | Defeater Strength (Context) |
  | 5 | Six peers disagree with you; you don't know if they talked to each other first. | Lower confidence slightly (possible collusion). | Lower confidence heavily (numbers matter). | N/A | Weighting Metric (Aggregation) |
  | 6 | You learn a medication you took scrambles your sense of confidence, not your beliefs. | Keep belief, lower confidence. | Suspend belief entirely. | N/A | Defeater Strength |
  | 7 | The evidence is messy; you say Yes, a peer says No. | One of you is irrational. | Both of you can be rational. | N/A | First-Order Priority (Uniqueness) |
  | 8 | You formed a belief while drunk, but the reasoning looks fine now. | Believe the conclusion, admit the process was flawed. | Suspend belief because the process was flawed. | N/A | Defeater Strength (Akrasia) |

  ### Position Profiles

  | Answer Pattern | Position Name | One sentence on what it commits you to | Most awkward consequence |
  | :--- | :--- | :--- | :--- |
  | A,A,A,A,A,A,A,A | The Steadfast | Your direct access to evidence almost always trumps the fact of disagreement. | You must regard most disagreeing peers as irrational or mistaken. |
  | B,B,B,B,B,B,B,B | Equal-Weight Conciliationism | The fact of disagreement forces you to split confidence regardless of context. | You must suspend judgment even when the disagreement is clearly biased or colluded. |
  | A,B,A,A,A,A,B,A | The Calibrator | You weigh disagreement by reliability and context, not just peer status. | You must constantly maintain complex mental scorecards of everyone's track records. |
  | B,B,B,A,B,B,B,B | Total Evidence View | Disagreement is just another piece of evidence to be aggregated normally. | You might end up ignoring the special force of knowing your own cognitive faculties are impaired. |
  | A,A,A,A,A,B,A,A | The Akratic Holder | You can hold a belief while simultaneously believing your formation process was compromised. | You are committed to thinking your current belief is rational despite knowing its origin was flawed. |
  | B,B,B,B,B,B,B,A | Permissivist Conciliator | Disagreement usually forces a move, but sometimes multiple views are reasonable. | You must explain why disagreement forces suspension in math but allows leeway in messy cases. |

