prompt: |-
  I'm a TA for a grad seminar in formal ethics -- 14 students, 90 minutes, one room with a whiteboard and a stack of index cards. They've all done expected utility theory and they've read Rawls, and the session I'm building is on Harsanyi's aggregation theorem. What I want them to feel in their bones is the move that does all the work: put everyone behind a veil of ignorance, let them rank policies from a position where they have an equal chance of ending up as any one of the affected people, and -- assuming their preferences satisfy the expected utility axioms -- they'll all agree on a ranking, and the ranking they agree on is the one that maximizes the sum of individual utilities. It looks like it proves utilitarianism from a premise most of them think of as anti-utilitarian, and every year they nod along and then can't say why it doesn't just settle the question. I also want them to run into the thing that happens afterwards: the same people, once they know which life they actually landed in, stop agreeing with the choice they unanimously made ex ante. So the unanimity behind the veil can be produced entirely by everyone having the same attitude to risk rather than by any real agreement about who should get what, which is a weirdly thin kind of agreement to build an ethics on. I don't want to announce either point. The word "utilitarian" shouldn't come out of my mouth until the debrief.

  So design me a runnable activity, not a lecture. They should be the ones who generate the unanimity -- I want them to write their rankings down and then discover the agreement is already there, and I want the ex ante / ex post crack to open up from something that actually happens in the room, not from me telling them about it. No real money; points or chits are fine, and if there's randomization it has to be something they can watch happen (drawing cards, a spinner, whatever). It has to survive 14 people in one room for 90 minutes, and it has to be honest about what it can't show -- I'd rather have a field telling me which piece of the theorem the game just can't reproduce than have the game quietly pretend to do the proof.

  Give me the whole thing as a JSON object, each field a string unless I say otherwise: "activity_name"; "overview" (2-3 paragraphs of prose on how it runs, start to finish); "participants_and_timing"; "materials" (array of strings); "setup_script" (what I say before anything starts, which must not name Harsanyi, utilitarianism, or the veil); "payoff_scheme" (the chits/points scheme, how a person's score gets determined, and exactly what's random); "timeline" (array of objects with "minutes", "beat", "what_happens", "what_i_do"); "the_moment_it_lands" (where the unanimity should show up and what I should be looking for on the board); "the_second_moment" (where the ex ante / ex post split should bite and how to stage it so they feel it instead of hearing it); "debrief" (array of strings, in order, each tied to something that actually happened in the room); "predictable_failures" (array of objects with "what_goes_wrong" and "what_to_do", at least three, and be specific -- I want to know the one where two students just refuse to play along); "what_the_activity_cannot_reproduce" (specific and honest); "one_line_thesis" (the sentence I want them walking out with).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** TA for a grad seminar in formal ethics.
      *   **Context:** 14 students, 90 minutes, one room, whiteboard, index cards.
      *   **Topic:** Harsanyi's Aggregation Theorem (connecting Veil of Ignorance + Expected Utility -> Utilitarianism).
      *   **Goal:** Students need to *feel* the move (Veil of Ignorance + EU axioms -> Agreement on Sum Maximization) and the subsequent crack (Ex Ante unanimity vs. Ex Post disagreement due to risk attitudes/identity).
      *   **Constraint 1:** Do not lecture. Activity-based.
      *   **Constraint 2:** Do not use the word "utilitarian" until debrief. Do not name Harsanyi or Veil of Ignorance in the setup.
      *   **Constraint 3:** Students must generate the unanimity themselves (write rankings, discover agreement).
      *   **Constraint 4:** Ex Ante/Ex Post split must happen in the room (randomization they can watch).
      *   **Constraint 5:** No real money (points/chits ok).
      *   **Constraint 6:** Must be honest about limitations (JSON field for "what_the_activity_cannot_reproduce").
      *   **Format:** JSON object with specific fields ("activity_name", "overview", "participants_and_timing", "materials", "setup_script", "payoff_scheme", "timeline", "the_moment_it_lands", "the_second_moment", "debrief", "predictable_failures", "what_the_activity_cannot_reproduce", "one_line_thesis").
      *   **Tone:** Practical, rigorous, aware of the philosophical stakes, not gamified to the point of triviality.

  2.  **Deconstruct the Philosophical Move:**
      *   *Harsanyi's Trick:* If everyone has the same subjective probability of being anyone else (1/N), and everyone evaluates prospects using Expected Utility (vNM axioms), then the social welfare function must be the sum of individual utilities (utilitarianism).
      *   *The Catch:* This relies on cardinal utility and specific risk attitudes. Once the veil is lifted (ex post), people care about their specific identity, not the average. Also, the "agreement" is often just shared risk neutrality imposed by the EU axioms, not moral agreement.
      *   *Activity Design:* I need a scenario where students choose between policies *before* knowing who they are (Ex Ante) and then see how they feel *after* knowing who they are (Ex Post).
      *   *Mechanism:*
          1.  Assign secret identities (1-14).
          2.  Define 2-3 policies with different payoff distributions across identities.
          3.  Phase 1 (Veil): Students don't know their identity. They rank policies based on expected payoff (assuming equal chance of being anyone). Since the math is linear, they should all rank the policy with the highest *total* sum highest.
          4.  Phase 2 (Reveal): Reveal identities. Distribute payoffs according to the chosen policy.
          5.  Phase 3 (Conflict): Ask if they still endorse the choice. Those who got low payoffs might object.
      *   *Refinement for "Unanimity":* To ensure they *actually* agree ex ante, the policies need to be structured so the sum is clearly different, but the distribution varies. To make the EU axiom work without lecturing on it, I need to force them to evaluate based on "expected points" without letting them hedge.
      *   *Refinement for "The Crack":* The prompt asks for the crack to be about *risk attitudes* vs. *real agreement*. Harsanyi's theorem assumes vNM utility. If students are risk-averse, they might not maximize sum. If they are risk-neutral, they do. The "crack" the user describes is: "unanimity behind the veil can be produced entirely by everyone having the same attitude to risk rather than by any real agreement about who should get what."
      *   *Adjustment:* I need to make sure the Ex Ante choice looks like moral agreement but is actually just mathematically forced by the setup (equal probability + maximizing expected value). Then, once identities are revealed, the "losers" realize the "agreement" didn't protect their specific interests.

  3.  **Drafting the Activity:**
      *   *Name:* "The Blind Allocation."
      *   *Setup:* 14 students. Each gets a secret ID card (1-14).
      *   *Policies:* Policy A (High Total, Unequal), Policy B (Lower Total, Equal). Or Policy A vs Policy B where both are unequal but sums differ. Let's go with Sum Maximization vs. Equality to highlight the Utilitarian result. Actually, to show Harsanyi specifically, I need them to agree on the Sum Maximizer. So Policy A (Sum=100, Dist: 10, 10, ... 10) vs Policy B (Sum=140, Dist: 0, 0, ... 140). Wait, if I want them to feel the *crack*, the Sum Maximizer should leave some people with nothing.
      *   *Let's try:* Policy X (Safe, Moderate Sum), Policy Y (Risky, High Sum).
      *   *Better:* Policy 1 (Equal distribution, Total 140), Policy 2 (Unequal distribution, Total 200). Harsanyi says choose Policy 2.
      *   *Veil:* They don't know their ID. They calculate expected value. Policy 1 EV = 10. Policy 2 EV = 14.28. All rational EU maximizers choose Policy 2.
      *   *Reveal:* IDs revealed. Those who get 0 in Policy 2 feel the sting.
      *   *The "Risk" Angle:* The prompt specifically mentions: "unanimity... produced entirely by everyone having the same attitude to risk." To highlight this, I should perhaps introduce a choice where risk attitudes *could* diverge, but the setup forces neutrality. Or, simpler: The unanimity exists *because* they are calculating expectations (risk neutrality over identities). The crack is that ex-post, they are not neutral about their own identity.
      *   *Revised Plan:*
          1.  Distribute ID cards (face down).
          2.  Present two policies on board.
          3.  Policy A: Everyone gets 10 points. (Total 140)
          4.  Policy B: 7 people get 0, 7 people get 30 points. (Total 210)
          5.  Task: Rank them *before* looking at IDs.
          6.  Math: EV(A) = 10. EV(B) = 15. Rational choice = B.
          7.  Collect rankings. Show unanimity (mostly).
          8.  Reveal IDs. Assign points.
          9.  Ask: "Would you vote the same way now?"
          10. The losers (0 points) will object. The winners (30 points) will defend.
          11. This shows the Ex Ante/Ex Post split.

      *   *Wait, one nuance:* The prompt says "assuming their preferences satisfy the expected utility axioms." I can't assume that. I need to *induce* it or make the calculation so obvious that deviation looks irrational in the context of the game. I will instruct them to maximize their *expected* points. This simulates the EU axiom constraint.
      *   *Wait, another nuance:* The prompt wants the crack to be about "same attitude to risk rather than any real agreement." If I tell them to maximize expected points, I'm forcing risk neutrality. That works. It shows the unanimity is artificial (methodological) not moral.
      *   *Randomization:* Need to assign the "winner/loser" status in Policy B randomly if they choose it. I can use a deck of cards. Red = 30, Black = 0. Or just use the ID numbers (Odd=30, Even=0) to keep it simple and verifiable. Let's use ID numbers for transparency. Odd IDs get 30, Even IDs get 0 in Policy B.

      *   *Wait, checking the "Risk" constraint again:* "unanimity behind the veil can be produced entirely by everyone having the same attitude to risk rather than by any real agreement about who should get what."
      *   If I force them to maximize EV, I am forcing risk neutrality. The "agreement" is just "we all did the math." The "crack" is "but I don't want to be the loser."
      *   To make it richer: Maybe let them choose Ex Ante without telling them to maximize EV, just "choose what you prefer." Most will maximize EV anyway. Then reveal.
      *   Actually, to hit the Harsanyi point hard: The theorem says if you satisfy EU axioms, you *must* agree. So I should structure the instructions to implicitly invoke EU reasoning without naming it. "Choose the policy you would prefer if you had an equal chance of being any student."

      *   *Refining the "Crack":* The prompt wants the ex ante/ex post split to feel like "everyone having the same attitude to risk rather than... real agreement."
      *   Okay, I will add a twist. After the reveal, ask them if they would accept a trade. The winners won't want to trade. The losers will. The ex ante agreement was purely probabilistic.

