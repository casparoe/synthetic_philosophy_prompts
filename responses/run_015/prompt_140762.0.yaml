answer: |-
  **Private Working Phase**

  (a) **Features of the shallow-pond scenario doing argumentative work:**
  1.  **Single agent:** One passer-by, no diffusion of responsibility.
  2.  **Single victim:** One child, focused moral claim.
  3.  **Immediate causation:** Pulling out directly prevents drowning.
  4.  **Modest cost:** Ruined clothes/shoes vs. a life.
  5.  **No precedent:** The act does not invite infinite future demands.
  6.  **Certainty:** High confidence in outcome (drowning vs. saved).
  7.  **Direct encounter:** Physical proximity creates psychological urgency.

  (b) **Transport to the *St. Louis* case:**
  1.  **Single agent:** **Lost.** Multiple states (Cuba, US, Canada) and the Captain.
  2.  **Single victim:** **Lost.** 937 passengers.
  3.  **Immediate causation:** **Lost.** Mediated by return, occupation, and Nazi policy.
  4.  **Modest cost:** **Transformed.** Political capital and sovereignty vs. shoes.
  5.  **No precedent:** **Lost.** Fear of "floodgates" is central.
  6.  **Certainty:** **Lost.** Death was probabilistic at the time of refusal.
  7.  **Direct encounter:** **Lost.** Bureaucratic application vs. physical presence.

  ***

  **Analysis**

  1.  **The Mapping, Disciplined**
      The agents here are sovereign states (Cuba, the United States, Canada) and the ship's captain, alongside individual officials executing policy. The option set for each state was binary: admit the passengers or refuse entry. The Captain could have forced landing or scuttled, but primarily acted as a transporter. For a state, the analogue of ruined clothes is not material loss but political capital, budgetary strain, and perceived erosion of border sovereignty. The counterfactual chain is specific: refusal forces the ship to return to Europe; return places passengers under occupied regimes; occupation leads to deportation and murder. The cost of admission is the price of preventing this chain. To claim the cost was "comparable moral significance" to 937 deaths requires arguing that national political stability outweighs mass murder, a claim the pond argument rejects unless the stability itself prevents comparable harm.

  2.  **Feature-by-Feature Transport**
      The pond argument derives force from the encounter structure: a lone agent faces an immediate, transparent need. In the *St. Louis* case, the encounter is institutional and sequential. Causation is mediated by a later wrongdoer (the Nazis) and temporal distance. The argument's force depends primarily on the modesty of the cost relative to the bad averted. Where the features are absent—specifically the single-agent structure—the argument goes quiet rather than false. It becomes harder to apply because the psychological urgency is removed, and the causal link is obscured by bureaucracy. The absence of the "lone passer-by" means the duty is distributed, allowing each agent to claim another should act.

  3.  **Number and Scale**
      There are 937 victims, not one. Crucially, the cost of admitting them does not scale linearly; housing 937 people utilizes shared infrastructure, making the per-capita cost lower than housing one individual 937 times over. This sub-linear scaling strengthens the argument economically: the cost per life saved is modest. However, the demandingness objection shifts shape. While economic costs scale sub-linearly, political costs may scale super-linearly due to nativist backlash or perceived loss of control. The argument holds only if the total political cost remains modest relative to the moral weight of 937 lives. If the state claims the cost is ruinous, it must demonstrate that ruin, not merely assert it.

  4.  **Overdetermination and Non-Compliance**
      Any one of the three major refusals (Cuba, US, Canada) was sufficient to doom the ship. No single state needed to admit everyone to save most lives. A fair-share view implies states should have split the quota. A compliance-conditional view suggests no duty if others refuse. A pick-up-the-slack view demands admission regardless of others' failure. The pond argument is silent here. It was built for a pond with one person standing at it, where picking up the slack is identical to doing your share. It lacks the resources to choose between these views in a collective action problem. It cannot specify whether the US was wrong because it took none, or whether Cuba was wrong for taking few then refusing more.

  5.  **The Ratchet**
      Officials argued that admitting these passengers would commit the state to admitting everyone similarly situated. This response conflates three things: an empirical claim (admissions trigger more requests), a fairness claim (why should we bear the burden alone?), and a rationalization (an excuse to avoid cost). To tell them apart, one must ask for evidence of the floodgates versus evidence of the cost. The pond argument is committed to accepting the empirical claim only if the resulting total cost becomes comparable to the bad averted. If admitting this ship implies admitting millions, and admitting millions causes state collapse, the duty lapses. But the burden of proof lies on the state to show the ratchet is real and ruinous, not merely inconvenient.

  6.  **The Shore Problem**
      Once rescuers are institutions facing a stream, the duty changes shape. What begins as a duty to pull someone from the water becomes, for those taken in, a continuing duty to protect. Furthermore, the ultimate harm was inflicted by a different agent years later. Does the argument's grip depend on the rescue being a single completed act? Logically, no. The pond argument minimizes the distinction between letting happen and doing. By returning the ship, states delivered victims to the executioner. The intervention of another agent's wrongdoing does not absolve the refusers if the refusal was a necessary condition for the death. However, the temporal distance weakens the intuitive grip, making the causal contribution feel less direct than pushing a child underwater.

  7.  **Verdict on the Theory**
      This episode exposes that the argument is under-specified, not necessarily false. It was engineered around one agent, one victim, and one afternoon. It has no account of collective agents, sequenced refusals, precedent effects, or duties that convert into protective duties. These are cases the theory never anticipated, not genuine anomalies that contradict its core principle. The theory is silent on how to distribute duty among multiple capable states. It vindicates the intuition that comfortable refusals fail the cost test, but it cannot specify which state failed first or how much each owed. It requires supplementation to handle institutional complexity.

  **Revision and Price**

  To address a case like this, the argument requires a concrete addition: a principle of coordinated collective duty. This principle would state that when multiple agents can prevent a great bad at modest individual cost, they must coordinate to share the burden; if coordination fails, the duty falls on those capable until the cost becomes truly comparable to the bad averted. This closes the gap on overdetermination and slack-picking.

  The price this revision exacts is significant. It blunts the rhetorical force of the pond itself. The pond scenario works because it is small, closed, and isolates the agent from excuses about others' inaction. Introducing coordination complexities makes the argument heavier, less intuitive, and easier for agents to dispute by claiming others should act first. The simplicity that drives the moral intuition is sacrificed for the precision needed to govern states. We gain applicability to the *St. Louis*, but we lose the immediate, undeniable punch of the lone passer-by.
