  Regarding your three horns, you're treating subjectivity like a bug when it's the whole point. Confirmation is about belief revision for a specific agent at a specific time. Of course the data clerk in 1978 isn't confirmed in T; they don't have T. That's not a problem, it's a trivial truth about epistemology. As for manufacturing confirmation with a 'squiggle-index', that fails because T must entail the evidence independently of the fit. If you stipulate an index just to match the data, T doesn't predict it; you've just defined a variable post-hoc. The prior on such a gerrymandered theory would be negligible. But in the bird case, the theory constrains the pattern before the check is done. The probability goes up because the agent learns the data fits the constraint, not because the data exists.
