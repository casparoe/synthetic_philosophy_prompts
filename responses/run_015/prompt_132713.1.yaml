answer: |-
  1. "The slogan in context"
  In your seminar, the slogan functions as a decisive rebuttal to relationist accounts of motion. When the bucket experiment is invoked, the claim is that the water's surface curvature demonstrates true rotation independent of the bucket's walls. Your peer infers from this phenomenological fact that rotation must be absolute rather than relative to surrounding matter. Consequently, they argue that Machian proposals, which attribute inertial effects to gravitational interaction with distant cosmic mass, are unnecessary or false. The slogan serves as an ontological wedge, suggesting that because the effect is detectable without local relative motion, space itself must exist as an independent entity to ground that motion.

  2. "Menu of readings"
  Reading A posits a logical entailment regarding rotation itself. It claims the concavity logically forbids defining motion solely by position changes relative to nearby bodies. Here, absolute modifies the kinematic description of the water. The proof is treated as deductive: if water is at rest relative to the bucket yet concave, rotation cannot be relative to the bucket. This reading isolates the phenomenon from local frames but remains silent on distant matter. It focuses strictly on the failure of local relationism without committing to a global theory.

  Reading B employs inference to the best explanation regarding spatiotemporal structure. It argues that positing a geometric background explains inertial forces more simply than summing gravitational influences from distant stars. Here, absolute modifies the underlying geometry of the universe. The proof is abductive; geometric structure is the preferred hypothesis because it unifies inertial effects across different scenarios without requiring instantaneous cosmic coordination. This reading allows for realism about geometry without demanding space be a material substance.

  Reading C acts as an underdetermination breaker concerning the ontological category. It claims that since multiple matter distributions could theoretically produce identical local effects, only positing space as a substance breaks the tie. Here, absolute modifies the existence of space as an entity. The proof functions by eliminating rival ontologies; if matter relations underdetermine the physics, a substantial container must fill the gap to ensure determinate outcomes. This reading moves from empirical data to a specific metaphysical commitment about containers.

  Reading D asserts a modal constraint on the reference frame. It contends that the laws of dynamics require a privileged frame to formulate inertia correctly, regardless of matter content. Here, absolute modifies the status of the coordinate system. The proof is a constraint on theory formulation; without a fixed background frame, the laws of motion become ill-defined. This reading suggests that even in an empty universe, the distinction between rotating and non-rotating frames must remain valid for physics to function.

  3. "Verdicts"
  Reading A is defensible but substantive. It successfully proves rotation is not relative to the bucket, but it does not logically exclude relations to distant matter. It is often mistaken for a total refutation of relationism, but it only refutes local relationism. It establishes a negative fact about nearby bodies without securing a positive account of what rotation is relative to.

  Reading B is defensible and substantive. Modern physics often adopts spacetime geometry as fundamental. However, this does not require space to be a substance, only that geometry is not merely derivative of local matter relations. It offers a robust explanatory framework that avoids the complexities of instantaneous action at a distance while remaining neutral on substantivalism.

  Reading C is false without hidden premises. Empirical detectability does not entail substantivalism. This reading relies on the illicit slide between detecting a effect and positing a container. It assumes that if something acts causally, it must be a substance, ignoring structural realities. It conflates the need for a background with the need for a thing.

  Reading D is plausible only with an unstated premise about Newtonian dynamics. It assumes laws require a fixed frame, but general relativity shows laws can be formulated generally without privileged frames. It depends on accepting classical mechanics as modally necessary rather than contingent. It fails if one accepts that dynamical laws can be relationally formulated.

  4. "Which do the work against Mach"
  Only readings positing independence from all matter work against Mach. Reading A fails because Mach appeals to distant stars, not the bucket. Reading B challenges Mach if geometry is primitive, but Machians can treat geometry as derived from total mass distribution. Reading C is the strongest anti-Mach move, but it is ontologically extravagant and relies on the aforementioned slide. Reading D works only if one assumes Newtonian laws are modal necessities rather than contingent on mass distribution. To truly dismiss Mach, one must argue that inertial effects persist even in a universe devoid of all other matter, which the bucket alone does not demonstrate. The bucket shows non-relativity to the container, not non-relativity to the cosmos. Therefore, only Reading C and a strong version of Reading D justify dismissing distant-matter explanations, while A and B remain compatible with sophisticated relationism.

  5. "Where I could be wrong"
  You are likely correct that the slide is illicit, but relationism faces hurdles. A sophisticated relationist accepts detectable absolute rotation by appealing to global matter distributions or spacetime relations without a container. However, if one adopts a Quinean ontology where commitment to quantifiable geometric fields equals commitment to substance, the slide becomes valid. My assessment would revise if you showed that any geometric structure capable of grounding inertia must possess causal powers independent of matter, effectively making it substantival. The missing option is structural realism: space is real structure, not a substance, allowing detectable rotation without a container. If structure implies substance, your peer's ontological leap is justified.
