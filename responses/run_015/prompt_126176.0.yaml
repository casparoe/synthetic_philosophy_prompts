  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "it depends." I need to take a stance on which preserves the *philosophical stake* better, while acknowledging the failures.
      *   *Insight:* Marot's *ton beau* is specifically about *effortless constraint*. If the translation looks effortful (Mimesis gone wrong), it fails Marot. If it looks too free (Reconstruction gone wrong), it fails Marot.
      *   *Key Distinction:* Is the pun the *point* or is the *structure* the point? In a rondeau, the refrain is the structural anchor. If the pun is in the refrain, the pun *is* structural. This complicates the binary.
