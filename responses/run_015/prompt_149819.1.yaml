prompt: |-
  You are a professional moral philosopher who specialises in the moral emotions — guilt, shame, remorse — and in the social practices that cultivate them. Please think carefully, and begin by brainstorming the distinctions in play before you organise your answer; I would rather have a structured menu of options than one confident reading.

  I sit on a committee rewriting our professional body's disciplinary and restorative procedures. A consultant we brought in kept closing discussion down with the line 'guilt is about what you did, shame is about who you are', and used it to argue for two things: first, that our procedures should aim to elicit guilt and never shame — no public naming, no ritual that marks the person rather than the deed; second, that an institution or culture can simply choose which of the two emotions it cultivates, so that we can deliberately become a 'guilt culture' rather than a 'shame culture'. I am suspicious of both moves but cannot say precisely why.

  Take the slogan apart. What are the distinct precise claims it could be making — about the emotion's intentional object, about its representational content (what it 'says'), about what makes it apt or fitting, about its phenomenology, about its characteristic action-tendency (confession and repair versus concealment and withdrawal), about how local and how durable it is, or about which of the two is normatively in good standing? For each reading, say whether it is close to tautological, a plausible empirical generalisation, a substantive normative thesis, or straightforwardly false.

  Two complications I want addressed rather than smoothed over. First, the division looks less tidy than the slogan implies: people speak of being ashamed of some specific thing they did without concluding anything about their character, and of feeling guilty about what they are like — their motives, desires, or susceptibilities — with no particular deed in view. Does that undermine the readings, or can they be repaired to accommodate it? Second, and this matters most to me: for each reading, does it actually get the consultant his two conclusions? If shame does take the whole person as its object, does it follow that institutions must never appeal to it, given that a person is arguably partly constituted by what they have done? And does anything in the slogan support the thought that which emotion a culture reliably produces is a matter of choice, rather than of history, hierarchy, and the credibility of whichever audience does the shaming?

  Lay the readings out as a numbered list with a verdict on each, and close by saying which single reading — if any — the consultant would need in order to reach his recommendations, and how defensible that reading is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional moral philosopher specializing in moral emotions (guilt, shame, remorse) and social practices.
      *   **Task:** Deconstruct the slogan "Guilt is about what you did, shame is about who you are."
      *   **Context:** A committee rewriting disciplinary/restorative procedures. A consultant used the slogan to argue for: (1) Procedures should elicit guilt, never shame (no public naming/ritual marking). (2) Institutions can choose to be a "guilt culture" rather than a "shame culture."
      *   **User's Stance:** Suspicious of both moves, needs precise reasons why.
      *   **Requirements:**
          *   Brainstorm distinctions first (intentional object, representational content, fittingness, phenomenology, action-tendency, durability, normative standing).
          *   Address two complications: (1) The messy overlap (ashamed of acts, guilty of traits), (2) Whether the readings actually support the consultant's conclusions (especially regarding institutional choice and the constitution of the self).
          *   Format: Numbered list of readings with verdicts (tautological, empirical, normative, false).
          *   Conclusion: Identify which single reading the consultant *needs* and assess its defensibility.
          *   Tone: Structured menu of options, careful, philosophical, not overly confident/monolithic.

  2.  **Deconstruct the Slogan ("Guilt = Act, Shame = Self"):**
      *   *Intentional Object:* What is the emotion directed at? (Act vs. Global Self).
      *   *Representational Content:* What does the emotion represent to the subject? ("I violated a rule" vs. "I am defective").
      *   *Fittingness Conditions:* When is the emotion appropriate? (Specific violation vs. Character flaw).
      *   *Phenomenology:* How does it feel? (Tension/urgency vs. Shrinking/exposure).
      *   *Action Tendencies:* What does it make you want to do? (Repair/Confess vs. Hide/Withdraw).
      *   *Cultural/Social Dimension:* Is it individual or socially mediated? (Internalized law vs. External gaze).

  3.  **Address Complication 1 (The Overlap):**
      *   People feel shame about acts ("I'm ashamed I lied").
      *   People feel guilt about traits ("I feel guilty for being so impatient").
      *   *Philosophical fix:* Distinguish between *focal* object and *implicated* object. Shame *implicates* the self even when focused on an act. Guilt *implicates* rules even when focused on a trait. Or, distinguish between "Shame-1" (acute) and "Shame-2" (chronic/characterological).

  4.  **Address Complication 2 (The Consultant's Conclusions):**
      *   *Conclusion 1 (No Shame in Procedures):* Even if shame targets the self, does that mean it's bad? Restorative justice often *requires* acknowledging how actions reflect on character to motivate deep change. Also, can you separate act from self completely? (Aristotelian view: habits make character).
      *   *Conclusion 2 (Choice of Culture):* Can we just choose? Ruth Benedict's "Guilt vs. Shame cultures" is largely discredited in anthropology. Emotions are socially scaffolded. You can't just legislate an emotion without changing the underlying social ontology (hierarchy, visibility, audience).

  5.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1: Intentional Object.* Guilt -> Act. Shame -> Self.
          *   *Verdict:* Empirical generalisation (mostly false/overstated).
          *   *Complication:* We say "ashamed of what I did."
          *   *Consultant's Goal:* Doesn't support banning shame. If the act reveals the self, shame is inevitable.

      *   *Reading 2: Representational Content/Assessment.* Guilt -> Rule violation. Shame -> Global negative evaluation.
          *   *Verdict:* Plausible empirical/phenomenological.
          *   *Consultant's Goal:* Supports avoiding shame if global evaluation is harmful. But is it always harmful?

      *   *Reading 3: Action Tendencies.* Guilt -> Repair. Shame -> Hide.
          *   *Verdict:* Strong empirical generalisation (Tangney et al.).
          *   *Consultant's Goal:* Strongest support for Conclusion 1. But context matters (public vs private).

      *   *Reading 4: Social Ontology/Culture.* Guilt -> Internal/Individual. Shame -> External/Social.
          *   *Verdict:* Substantive normative/Anthropological (mostly false regarding "choice").
          *   *Consultant's Goal:* Supports Conclusion 2 (Choice). But this is the weakest link anthropologically.

      *   *Reading 5: Normative Standing.* Guilt -> Productive/Moral. Shame -> Toxic/Non-moral.
          *   *Verdict:* Substantive Normative Thesis.
          *   *Consultant's Goal:* This is what he *wants*, but the slogan doesn't prove it.

  6.  **Refining the Analysis of the Consultant's Conclusions:**
      *   *Conclusion 1 (Ban Shame):* Requires Reading 3 (Action Tendencies) + Reading 5 (Normative). But Reading 3 is context-dependent. Public shame can enforce norms.
      *   *Conclusion 2 (Choose Culture):* Requires Reading 4. But this is sociologically naive. Cultures aren't switchable modes; they depend on social structure (hierarchy vs. egalitarianism).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the complexity, set the philosophical stage (phenomenology + social practice).
      *   **Brainstorming Distinctions:** Briefly list the axes (Object, Content, Fittingness, Phenomenology, Tendency, Sociality).
      *   **The Menu of Readings (Numbered List):**
          *   For each: Define the claim, Classify (Tautology/Empirical/Normative/False), Address Complication 1 (Overlap), Address Complication 2 (Consultant's Inference).
      *   **Synthesis/Conclusion:** Identify the "Necessary Reading" for the consultant and evaluate its defensibility.

  8.  **Self-Correction/Nuance Check:**
      *   *Check:* Did I address the "constitution of the self" point? *Adjustment:* Ensure Reading 1 & 2 discuss how acts constitute character (Aristotle/MacIntyre).
      *   *Check:* Did I address the "choice of culture" point? *Adjustment:* Emphasize in Reading 4 that social structures dictate emotions, not vice versa.
      *   *Check:* Is the tone right? *Adjustment:* Keep it analytical, not preachy. Use "verdicts" as requested.
      *   *Check:* Did I handle the "ashamed of acts" objection? *Adjustment:* Distinguish between *occasional* shame and *dispositional* shame, or focus on the *implication* for the self.

  9.  **Final Polish:** Ensure clear headings and precise philosophical terminology (intentionality, fittingness, phenomenology). (Self-correction: Make sure to explicitly mention Ruth Benedict or the anthropological debate regarding "Guilt/Shame cultures" as it's relevant to the consultant's second claim).

  10. **Final Review against constraints:**
      *   Structured menu? Yes.
      *   Numbered list with verdicts? Yes.
      *   Address two complications? Yes.
      *   Close with single reading assessment? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  As a philosopher of moral emotions, I share your suspicion. The slogan "Guilt is about what you did, shame is about who you are" is a heuristic that has hardened into dogma. It is often attributed to the anthropologist Ruth Benedict, but in contemporary moral psychology and philosophy, it is treated with far more nuance. The consultant is leveraging a simplified distinction to make a leap from *description* (how these emotions work) to *prescription* (how we should engineer our culture).

  Before presenting the menu of readings, let us briefly brainstorm the distinctions in play. To evaluate the slogan, we must separate:
  1.  **Intentional Object:** What is the emotion *about*? (The act vs. the agent).
  2.  **Representational Content:** What proposition does the emotion convey to the subject? ("I broke a rule" vs. "I am diminished").
  3.  **Fittingness Conditions:** When is the emotion *merited*? (Specific violation vs. Character flaw).
  4.  **Phenomenology:** What is the *felt experience*? (Agitation/Tension vs. Shrinking/Exposure).
  5.  **Action Tendencies:** What does the emotion *motivate*? (Reparation vs. Withdrawal).
  6.  **Social Ontology:** Is the emotion generated internally (conscience) or externally (the gaze of the other)?

  The consultant's argument relies on conflating these categories. Below is a structured menu of how the slogan might be interpreted, with verdicts on their truth value and their ability to support the consultant's two conclusions (No Shame in Procedures; Choice of Culture).

  ***

  ### A Menu of Readings

  #### 1. The Intentional Object Reading
  *   **The Claim:** Guilt is strictly directed at specific actions; shame is strictly directed at the global self.
  *   **Classification:** **Straightforwardly False (as a strict claim) / Plausible Empirical Generalisation (as a tendency).**
  *   **Analysis of Complication 1 (Overlap):** This reading collapses immediately upon contact with ordinary language. We routinely say, "I am ashamed of what I did," without implying our entire existence is tainted. Conversely, we feel guilt over character traits ("I feel guilty about my inherent privilege" or "my temper").
      *   *Repair:* One might argue that while shame *can* focus on an act, it *implicates* the self, whereas guilt implicates the act even if it stems from a trait. However, this is a matter of degree, not kind.
  *   **Analysis of Complication 2 (Consultant's Conclusions):**
      *   *Conclusion 1 (Ban Shame):* **Does not follow.** Even if shame targets the self, it does not follow it must be banned. If a professional's action reveals a lack of competence or integrity (a feature of "who they are" professionally), a procedure that ignores this is superficial. You cannot neatly sever the deed from the doer in a professional context.
      *   *Conclusion 2 (Choice of Culture):* **Does not follow.** The object of an emotion is determined by the situation, not by cultural legislation. If a professional commits a heinous act, the self is implicated regardless of whether the culture prefers "guilt."

  #### 2. The Action-Tendency Reading
  *   **The Claim:** Guilt motivates repair, confession, and reintegration; shame motivates concealment, withdrawal, and aggression.
  *   **Classification:** **Plausible Empirical Generalisation.** (Supported by psychologists like June Price Tangney, though context-dependent).
  *   **Analysis of Complication 1 (Overlap):** This reading bypasses the object/content problem. It doesn't matter what the emotion is *about*, but what it *does*. However, shame can sometimes motivate moral improvement (the desire to restore honor), and guilt can sometimes lead to neurotic withdrawal.
  *   **Analysis of Complication 2 (Consultant's Conclusions):**
      *   *Conclusion 1 (Ban Shame):* **Strong Support.** If the goal of restorative justice is reintegration, and shame reliably causes withdrawal, the consultant is right to minimize it. *However*, this assumes private shame. Public shaming rituals might leverage the "withdrawal" tendency to enforce boundaries, which might be a desired outcome for a disciplinary body.
      *   *Conclusion 2 (Choice of Culture):* **Weak Support.** You cannot simply choose an action tendency. Tendencies are evolved and socially scaffolded. You can design procedures to *trigger* tendencies, but you cannot decree that a culture will reliably produce one tendency over the other without changing the underlying social incentives.

  #### 3. The Social-Ontology Reading
  *   **The Claim:** Guilt is an internal dialogue (autonomous); Shame is a reaction to external scrutiny (heteronomous).
  *   **Classification:** **Substantive Normative Thesis / Anthropologically Contested.**
  *   **Analysis of Complication 1 (Overlap):** We can feel shame when no one is watching (imagined audience) and guilt because someone else caught us. The internal/external divide is porous.
  *   **Analysis of Complication 2 (Consultant's Conclusions):**
      *   *Conclusion 1 (Ban Shame):* **Mixed Support.** If shame requires an audience, then removing public naming removes the shame. But this assumes shame is *only* bad when public. Private shame (feeling unworthy before one's peers) may still occur.
      *   *Conclusion 2 (Choice of Culture):* **Straightforwardly False.** This is the consultant's weakest link. Anthropologists largely reject the "Guilt Culture vs. Shame Culture" binary (Benedict's *Chrysanthemum and the Sword* model). All cultures use both. Which one dominates depends on social structure (hierarchy, visibility, density of community), not policy choice. An institution cannot "choose" to be a guilt culture if its structure is hierarchical and high-visibility; the social mechanics will produce shame regardless of the slogan.

  #### 4. The Representational Content Reading
  *   **The Claim:** Guilt represents "I have violated a standard"; Shame represents "I am defective."
  *   **Classification:** **Plausible Empirical Generalisation.**
  *   **Analysis of Complication 1 (Overlap):** As with Reading 1, people feel "defective" in guilt (e.g., survivor's guilt) and "standard-violating" in shame (e.g., shame at a faux pas). But the *core* appraisal differs: Guilt is about harm to others/rules; Shame is about damage to social identity.
  *   **Analysis of Complication 2 (Consultant's Conclusions):**
      *   *Conclusion 1 (Ban Shame):* **Normative Leap Required.** Even if shame says "I am defective," it does not follow that institutions must not elicit this. If a professional *is* defective (e.g., unfit to practice), the emotion is *fitting*. Banning shame might mean protecting the unworthy from accurate self-assessment.
      *   *Conclusion 2 (Choice of Culture):* **False.** You cannot legislate representational content. If the institution publicly names offenders, the content will inevitably shift from "you did a bad thing" to "you are a bad professional."

  #### 5. The Normative Standing Reading
  *   **The Claim:** Guilt is morally productive/mature; Shame is morally toxic/primitive.
  *   **Classification:** **Substantive Normative Thesis.** (This is not a description of the emotions, but a valuation of them).
  *   **Analysis of Complication 1 (Overlap):** Irrelevant to the overlap, as this is a value judgment. However, it ignores "healthy shame" (humility, recognition of limits) and "toxic guilt" (obsessive scrupulosity).
  *   **Analysis of Complication 2 (Consultant's Conclusions):**
      *   *Conclusion 1 (Ban Shame):* **Direct Support.** This is the only reading that directly justifies banning shame. It posits shame as inherently harmful to the moral agent.
      *   *Conclusion 2 (Choice of Culture):* **Direct Support.** If shame is toxic, we *ought* to choose a guilt culture.
      *   *Defensibility:* **Low.** This reading is circular. It defines guilt as the "good" emotion and shame as the "bad" one to justify the conclusion. It ignores the sociological function of shame in maintaining group cohesion and trust, which is vital for a professional body.

  ***

  ### Synthesis and Verdict

  To reach his recommendations, the consultant does not need just one reading; he needs a specific **chain of inference** that combines **Reading 2 (Action Tendencies)** and **Reading 5 (Normative Standing)**, underpinned by a naive version of **Reading 3 (Social Ontology)**.

  **The Single Necessary Reading:**
  If forced to identify the single reading the consultant *needs* to make his argument work, it is **Reading 5: The Normative Standing Reading** (Guilt = Good/Productive, Shame = Bad/Toxic).

  **Why?**
  *   Readings 1, 2, 3, and 4 are descriptive. Even if they are true (e.g., "Shame makes people hide"), they do not logically entail that we *ought* to ban shame unless we add the normative premise that "hiding is always worse than the alternative" or "shame is inherently unjust."
  *   The consultant's move from "Shame is about who you are" to "Therefore we must not shame" is a naturalistic fallacy unless "Being judged on who you are" is presumed inherently illegitimate.
  *   His second move (that we can *choose* our culture) relies entirely on the normative belief that we *should* choose guilt, assuming it is a switch we can flip.

  **Defensibility of this Reading:**
  As a moral philosopher, I must advise you that **Reading 5 is poorly defensible** in the context of professional discipline.

  1.  **The Constitution of the Self:** In professional ethics, "who you are" (your integrity, competence, reliability) is precisely what is at stake. A doctor who negligently harms a patient is not just someone who *did* a bad thing; they have revealed themselves to be, at that moment, an unsafe doctor. To restrict discipline to "guilt" (the act) is to pretend the act didn't reveal something about the agent's fitness to practice. A restorative procedure that refuses to engage with the agent's character ("who they are") may fail to prevent recidivism.
  2.  **The Impossibility of Choice:** The idea that an institution can choose to be a "guilt culture" is sociologically naive. Guilt cultures require high individualism and internalized abstract rules. Shame cultures rely on tight-knit communities and visible reputation. A professional body is inherently a reputation economy. By trying to engineer a "guilt culture" in a high-stakes reputation environment, you risk creating **toxic guilt** (private anxiety without public resolution) while failing to eliminate **shame** (which will arise spontaneously among peers).
  3.  **The Value of Shame:** Shame is the guardian of social identity. In a profession, the fear of being *seen* as incompetent (shame) is often a stronger deterrent than the private knowledge of having broken a rule (guilt). Abolishing the social practices that cultivate shame (public accountability) may weaken the normative force of the profession.

  **Recommendation for the Committee:**
  Do not accept the slogan as a premise. Instead, treat the emotions as tools with different affordances.
  *   Use **Guilt** to motivate specific reparations (apologies, restitution).
  *   Use **Shame** (carefully, ritually) to mark boundaries of membership (suspension, disbarment) where the "self" (professional identity) is genuinely compromised.
  *   Reject the idea that you can "choose" a culture. Instead, design procedures that acknowledge the social reality: your members care about their reputation. Use that leverage responsibly, rather than pretending it doesn't exist.
