answer: |-
  # Activity: The Ceteris Paribus Casino

  **Objective:** To demonstrate the instability of the Conditional Analysis (CA) of dispositions through epistemic pressure, forcing students to experience the regress of second-order conditions and the predictive failure of trusting test outcomes alone.

  **Class Size:** 18 Students (6 Teams of 3).
  **Time:** 50 Minutes.
  **Materials:**
  1.  **Betting Slips:** 30 small slips of paper (2 per team per round).
  2.  **The Master Key (TA Only):** A printed sheet with the "True State" and "Interference Structure" for 5 Rounds (see *TA Secret Sheet* below).
  3.  **The Board:** Whiteboard divided into columns: *Round | Object | Test Result | Team Bets | Truth Revealed*.
  4.  **Timer:** Visible to all.

  ---

  ## 1. Rules & Scoring Scheme

  **The Setup:**
  You are quality control inspectors for a factory producing "Cubes." Your job is to certify whether a Cube is intrinsically **FRAGILE** or **SOLID**.
  *   **FRAGILE:** Breaks when struck *in virtue of its nature*.
  *   **SOLID:** Does not break when struck *in virtue of its nature*.

  **The Loop (Per Round):**
  1.  **Briefing (1 min):** TA describes the Cube and the "Room Conditions" (rumors only).
  2.  **Diagnostics (2 mins):** Teams may ask the TA **one** Yes/No question about the Room Conditions. (TA answers according to the *Master Key*, often revealing conditional dependencies).
  3.  **The Bet (1 min):** Teams submit a slip: **FRAGILE** or **SOLID**. *This must be done before the Test.*
  4.  **The Test (1 min):** TA announces the Test Result: **BROKE** or **INTACT**.
  5.  **The Reveal (1 min):** TA announces the **True Nature** (Fragile/Solid) and awards points.

  **Scoring:**
  *   **+10 Points:** Correctly identifying the **True Nature** (Intrinsic).
  *   **-5 Points:** If your Bet matches the **Test Result** but the Test Result was misleading (i.e., you trusted the CA blindly in a hard case).
  *   **0 Points:** Incorrect bet (but didn't blindly trust the test).

  **Winning Condition:** The team with the most points after 5 Rounds.
  **The Trap:** In Rounds 3 & 4, the Test Result is systematically decoupled from the True Nature. Trusting "Broke = Fragile" or "Intact = Solid" will lose points.

  ---

  ## 2. TA Secret Sheet (The Master Key)

  *Do not show this to students. This controls the metaphysics of the game.*

  | Round | True Nature | Interference Type | Test Result | The "Diagnostics" Truth (For TA) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Fragile | **None** (Baseline) | **Broke** | "Conditions are normal." |
  | **2** | Fragile | **Mask** (Padding) | **Intact** | "Padding is present." (If asked: "Yes, it surrounds the cube.") |
  | **3** | Fragile | **Fink** (Zapper) | **Intact** | "Zapper is active." (If asked: "Yes, it monitors for strikes.") |
  | **4** | Solid | **Mimic** (Shaker) | **Broke** | "Shaker is active." (If asked: "Yes, it vibrates on impact.") |
  | **5** | Fragile | **2nd-Order Fink** | **Intact** | **See Below.** |

  **Round 5 Complexity (The Regress):**
  *   **Structure:** Cube is Fragile. A **Fink** (Zapper) is present. A **Fink-Blocker** (Shield) is present. But the Shield is **Finkish** (disables itself when struck).
  *   **Chain:** Strike -> Shield disables -> Zapper activates -> Fragility removed -> Intact.
  *   **Diagnostic Truth:** If asked "Is the Zapper present?": *"It is disposed to activate unless shielded."* If asked "Is the Shield present?": *"It is disposed to deactivate when struck."*
  *   **Goal:** Students cannot resolve the chain in one question. They must bet blind.

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 05:00: Introduction & Rules**
  *   Hand out Betting Slips.
  *   Explain the scoring. Emphasize: **"You are scored on what the object *is*, not what it *does*. But you only see what it *does*."**
  *   Divide into 6 teams.

  **05:00 – 10:00: Round 1 (Baseline)**
  *   *Goal:* Establish trust in the CA.
  *   *Action:* Standard flow. Everyone gets it right. Test Result matches Truth.
  *   *TA Note:* Keep pace brisk.

  **10:00 – 15:00: Round 2 (Mask)**
  *   *Goal:* Break the "Intact = Solid" inference.
  *   *Action:* Teams ask about conditions. If they ask "Is it fragile?", say "I can't tell you, that's your bet." If they ask "Are conditions normal?", say "There is padding."
  *   *Reveal:* Truth is Fragile. Test was Intact.
  *   *Scoring:* Teams that bet "Solid" (trusting the test) get -5. Teams that bet "Fragile" (suspecting a mask) get +10.

  **15:00 – 20:00: Round 3 (Fink)**
  *   *Goal:* Distinguish Fink from Mask (epistemically difficult).
  *   *Action:* Similar to Round 2. Test is Intact. Truth is Fragile.
  *   *TA Note:* In the reveal, mention: "Unlike Round 2, the padding wasn't the issue. The object *changed*." (Plant the seed for debrief).

  **20:00 – 25:00: Round 4 (Mimic)**
  *   *Goal:* Break the "Broke = Fragile" inference.
  *   *Action:* Test is Broke. Truth is Solid.
  *   *Scoring:* Teams that bet "Fragile" (trusting the test) get -5.
  *   *Effect:* By now, students realize the Test Result is untrustworthy. They are flying blind.

  **25:00 – 32:00: Round 5 (The Regress)**
  *   *Goal:* Force the second-order realization.
  *   *Action:* Present the "Zapper/Shield" scenario.
  *   *Diagnostics:* When teams ask their one question, give the dispositional answers from the Master Key (*"It is disposed to activate..."*).
  *   *Pressure:* When they ask "So will it activate?", reply: "That depends on the shield." When they ask "Is the shield active?", reply: "That depends on the strike."
  *   *Time Call:* "30 seconds. You cannot ask more questions. Place your bets."
  *   *Reveal:* Show the chain. No one gets full points. Everyone feels the frustration of infinite deferral.

  **32:00 – 50:00: Debrief (Crucial)**
  *   Map the game to the metaphysics (see below).

  ---

  ## 4. Debrief Guide

  **Part 1: Mapping the Cases (10 mins)**
  Draw three columns on the board: **Mask**, **Fink**, **Mimic**. Ask students to place Rounds 2, 3, and 4 into these columns.

  *   **Mask (Round 2):** Object is Fragile. Test says Intact.
      *   *Why?* Extrinsic blocker (padding).
      *   *Key Feature:* The disposition remains *during* the stimulus.
  *   **Fink (Round 3):** Object is Fragile. Test says Intact.
      *   *Why?* Intrinsic change *caused* by stimulus (Zapper).
      *   *Key Feature:* The disposition is *lost* at the moment of stimulus.
      *   *Ask:* "Why did Round 3 feel different from Round 2, even though the result was the same?" (Elicit: In Round 2, it was still fragile but blocked. In Round 3, it stopped being fragile).
  *   **Mimic (Round 4):** Object is Solid. Test says Broke.
      *   *Why?* Extrinsic cause of manifestation (Shaker).
      *   *Key Feature:* Manifestation without disposition.

  **Part 2: The Regress (5 mins)**
  Focus on Round 5.
  *   **Ask:** "Why was Round 5 impossible to solve with one question?"
  *   **Answer:** Because the condition (Shield) was itself defined dispositionally (disposed to deactivate). To know if the Mask/Fink is active, you need to know if the *Mask-Blocker* is active. But that requires knowing if *its* conditions are met.
  *   **Point:** This is the **Regress Problem**. If we analyze dispositions using conditionals, and the *ceteris paribus* clauses (the "all else being equal" conditions) are themselves dispositions, we never reach a categorical base. We just get more conditionals.

  **Part 3: Why Mask ≠ Fink (3 mins)**
  *   Students often think these are the same counterexample (both make $S \square\rightarrow M$ false for a Fragile object).
  *   **The Distinction:**
      *   **Mask:** The conditional is false, but the disposition is *retained*. (Metaphysically stable).
      *   **Fink:** The conditional is false because the disposition is *lost*. (Metaphysically dynamic).
      *   **Why it matters:** If you want to predict what happens *after* the test, or if you want to explain *why* it didn't break, the distinction is causal. A masked glass is still dangerous to handle later; a finked glass is safe.

  **Part 4: Closing (2 mins)**
  *   "The Conditional Analysis tries to define what an object *is* by what it *would do*. This game showed that what it *would do* depends on conditions that are often just more facts about what the object *is* (or other objects *are*). You can't eliminate the disposition; you just push it back."

  ---

  ## 5. Predictable Failures & Limitations

  **1. The "Merely Verbal" Objection**
  *   **Prediction:** At least one student will argue in the debrief: "This is just semantics. If you define 'Fragile' as 'breaks when struck,' then the Fink object isn't fragile. You're just rigging the definition."
  *   **Response:** Acknowledge the validity. "You are describing the **Rylean** view. But if 'Fragile' just means 'Breaks when struck,' then the word tells us nothing about the *structure* of the glass. We need the disposition to explain *why* it broke in Round 1 and didn't in Round 2, even if the strike was identical. The game showed that 'Breaks when struck' is a bad *predictor* unless we know the hidden conditions. Metaphysics cares about the hidden conditions."

  **2. The "Intrinsicness" Gap**
  *   **Limitation:** The game *cannot* stage the difference between Intrinsic and Extrinsic properties empirically. In the game, I (the TA) simply *stipulated* what was Intrinsic (True Nature) vs. Extrinsic (Room Conditions).
  *   **Honesty:** You must admit this. "In the game, I acted as God and told you the True Nature. In reality, we don't have a God. We have to infer intrinsic nature from extrinsic behavior. That is why the Fink/Mask distinction is hard: we can't see the intrinsic nature directly. We posit it to save the predictions."

  **3. Time Management**
  *   **Risk:** Round 5 (Regress) can drag on as students try to logic-puzzle the TA.
  *   **Mitigation:** Be ruthless with the timer. When they ask a second-order question ("But will the shield work?"), reply immediately: "That requires another question. You have none left. Bet." The frustration *is* the lesson.

  **4. Confusion on Scoring**
  *   **Risk:** Students might feel cheated if they bet "Fragile" (Truth) but the object didn't break, and they think they should lose because their prediction of the *test* was wrong.
  *   **Mitigation:** Reiterate in Round 1: "You are Inspectors of the **Object**, not the **Test**. The Test is flawed equipment. Your job is to know the Cube."

  ---

  ## 6. Materials Printout (TA Reference)

  **Betting Slip Template:**
  > **Team:** _______
  > **Round:** _______
  > **Bet:** [ ] FRAGILE   [ ] SOLID
  > **Reason (Optional):** ___________________

  **Master Key Script (Keep Hidden):**
  *   **Q:** "Is the object fragile?" **A:** "That is your bet."
  *   **Q:** "Did it break?" **A:** "You haven't struck it yet."
  *   **Q:** "Are conditions normal?" **A:** (Check Round Key).
  *   **Q:** "Is the [Interference] active?" **A:** (Check Round Key).
  *   **Round 5 Specific:** Always answer with a disposition. "It is disposed to..." Never give a categorical Yes/No if possible.
