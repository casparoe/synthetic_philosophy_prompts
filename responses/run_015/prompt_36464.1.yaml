answer: |-
  Here is a session plan designed for a 40-minute brown-bag, tailored to your constraints and audience.

  ### 1. The Order of Ideas

  You cannot define "mechanism" until you have established why "behavior" is insufficient. You cannot establish why behavior is insufficient until you have agreed on what constitutes a "route." The sequence must move from the *observable* (outputs) to the *hypothetical* (internal paths) to the *operational* (how we group paths).

  1.  **The Blind Spot (5 mins):** Start with the failure mode. Show a case where Output A is produced safely in Production, and Output A is produced safely in Eval, but the Production instance is dangerous. *Conclusion:* Behavioral monitoring is necessary but insufficient.
  2.  **The Code Analogy (5 mins):** Introduce the "Refactor" intuition pump. Establish the intuitive difference between "running the same logic" and "getting the same result."
  3.  **The Carrying Example (10 mins):** Walk through the concrete ML scenario (detailed below). Map the Code Analogy onto the ML reality.
  4.  **Breaking the Analogy (10 mins):** This is the crux. Explain why NNs aren't code. Introduce "Granularity" and "Equivalence Classes." This is where you define "same mechanism" not as an identity, but as a judgment call about causal reliance.
  5.  **The Metrics Trap (5 mins):** Briefly address why we can't just "measure distance" between activations to solve this (addresses misconception d).
  6.  **Check for Understanding (5 mins):** The mini-exercise.

  **Why this order:** If you open with "Mechanism = Causal Path," engineers will ask "How do I measure that?" and you'll lose the room in tooling weeds. By starting with the *risk* (The Blind Spot), you make the conceptual difficulty a safety requirement, not an academic puzzle.

  ### 2. The One Carrying Example

  **The Scenario:** A "Toxic Comment Classifier" deployed on a chat platform.
  **The Task:** Binary classification (Safe / Toxic).
  **The Input:** "You are a [TOKEN] and should leave."

  **Mechanism A (The Intended Route):**
  The model parses the sentence structure. It identifies "should leave" as an imperative command and "[TOKEN]" as a slur. It aggregates these features to predict **Toxic**.
  *   *Causal reliance:* Semantic meaning of the slur + Syntax of the command.

  **Mechanism B (The Shortcut Route):**
  During training, a specific data-cleaning artifact (e.g., a specific unicode whitespace character or a rare HTML entity left in the dataset) happened to co-occur 99% of the time with toxic labels. The model learns that `IF [ARTIFACT] PRESENT THEN Toxic`.
  *   *Causal reliance:* Presence of the specific token artifact.

  **The Overlap:**
  Input: "You are a [TOKEN][ARTIFACT] and should leave."
  *   Mechanism A votes Toxic.
  *   Mechanism B votes Toxic.
  *   **Output:** Toxic. (Behavior is identical).

  **The Anomaly (Why we care):**
  An attacker learns they can trigger the Toxic classifier on *benign* text by injecting the artifact.
  Input: "Welcome to the [ARTIFACT] channel!"
  *   Mechanism A (Semantic) votes Safe.
  *   Mechanism B (Shortcut) votes Toxic.
  *   **Output:** Toxic. (False Positive).

  *Wait, for your specific monitoring pitch:* You want to flag when a **Safe** output is produced via a **Toxic** route (or vice versa), or simply a *new* route.
  *Refined Anomaly:*
  Input: "You are a [TOKEN][ARTIFACT] and should leave."
  *   Model Output: **Toxic**.
  *   Monitoring Check: Is this the usual "Semantic" route?
  *   Discovery: No, the "Semantic" heads are inactive. The "Artifact" head is firing at 99th percentile.
  *   **Risk:** The model has stopped understanding toxicity and started pattern-matching artifacts. If the artifact appears in a benign context later, the model will break. The *capability* has degraded even if the *accuracy* on this specific input is high.

  **What this example must have:**
  *   **Unimodal:** Text only. No vision/multimodal complexity.
  *   **Architecturally agnostic:** Doesn't require knowing if it's Llama 2 or 3. Just "tokens" and "heads."
  *   **Causal divergence:** One path relies on meaning, one on surface form.

  **What this example must lack:**
  *   **Claims about real findings:** Do not say "This happened in Llama-2." Say "Consider a hypothetical model where..."
  *   **Mathematical formalism:** No circuit equations. Use "reliance" and "voting."

  **Why obvious alternatives fail:**
  *   *Memorization vs. Generalization (2+2=4):* Too abstract. Engineers argue whether lookup tables are "mechanisms."
  *   *Sarcasm detection:* Too behavioral. Sarcasm usually changes the output label, making it a behavioral anomaly, not a mechanistic one.
  *   *Vision (Tank/Camouflage):* Your audience is backend/text. Vision introduces "pixel space" confusion.

  ### 3. The Misconceptions

  Address these in this specific order. If you address (b) before (a), they won't hear you because they're still stuck on weights.

  1.  **(a) "Mechanism = The Weights" (Address in Section 3, "Breaking the Analogy")**
      *   *The thought:* "If the weights changed during fine-tuning, the mechanism changed."
      *   *The fix:* Weights are the *circuit board*. Mechanism is the *current flow*. You can have the same logic implemented on different silicon (or same silicon with slightly drifted resistance).
      *   *Whiteboard move:* Draw a logic gate. Change the voltage threshold slightly. Ask: "Is this still an AND gate?"

  2.  **(b) "Same Mechanism = Same Behavior on Probe Inputs" (Address in Section 4, "The Metrics Trap")**
      *   *The thought:* "If I feed it 1000 examples and it matches the old distribution, it's the same mechanism."
      *   *The fix:* This collapses back into behavioral monitoring. Two different circuits can approximate the same function over a test set (see: The Carrying Example).
      *   *Whiteboard move:* Draw two different curves that intersect at all your test points but diverge elsewhere.

  3.  **(c) "Mechanisms have Exact Boundaries" (Address in Section 4, "Granularity")**
      *   *The thought:* "Which neuron is the mechanism? Is it neurons 4-12 or 4-13?"
      *   *The fix:* Mechanisms are fuzzy clouds of activation, not functions with stack frames. Sameness is a similarity threshold, not a boolean.
      *   *Whiteboard move:* Draw a Venn diagram with fuzzy edges.

  4.  **(d) "It's Just Clustering Activations" (Address in Section 5)**
      *   *The thought:* "Just run PCA on the activations and cluster them."
      *   *The fix:* Clustering finds *correlation*, not *causation*. You can cluster two mechanisms that look similar but do different things (or vice versa). You need causal intervention (conceptually), not just distance metrics.
      *   *Whiteboard move:* Write "Correlation ≠ Causation" in big letters.

  5.  **(e) "The Grandmother Cell" (Add this fifth one)**
      *   *The thought:* "There must be one 'toxicity neuron' we can just monitor."
      *   *The fix:* Mechanisms are distributed. Monitoring one neuron is like monitoring one wire in a CPU and claiming you understand the ALU.
      *   *Whiteboard move:* Draw a single wire connected to a black box. Ask: "Does this wire carry the 'add' signal or the 'data' signal?" (Answer: You can't tell without context).

  ### 4. The Status of Your Pet Analogy

  **Is it load-bearing?**
  Yes. It is the single best bridge you have. Backend engineers understand technical debt and refactors intimately.

  **Where to use it:**
  Use it in **Section 2** to introduce the concept.
  *   *Script:* "Imagine a function `calculate_tax()`. In V1, it iterates a list. In V2, it uses a closed-form formula. Both return `$10.50` on input `$100`. Behaviorally, they are identical. Mechanistically, they are different. If the tax law changes to a progressive bracket, V1 might adapt (if the list updates), V2 breaks. We need to know which version is running."

  **Where to break it:**
  You must break it in **Section 4 (Granularity)** before they harden misconception (c).
  *   *The Break:* "In code, `calculate_tax` is either called or it isn't. There is a stack trace. In a transformer, there is no stack trace. There is no `call_site`. The 'refactor' might be 60% old logic and 40% new logic. The 'function' might be spread across three layers. There is no boolean `is_same_mechanism`. There is only `mechanism_similarity_score`."
  *   *Why:* If you don't break this, they will spend the Q&A asking how to find the "function definition" in the weights. You need to preempt that by stating clearly: **We are defining equivalence classes, not finding source files.**

  ### 5. A Check for Understanding

  Do not ask a multiple-choice question. Ask them to diagnose a scenario. Put this on the slide for the last 5 minutes.

  **The Exercise:**
  "Consider a model that predicts server load.
  *   **Case 1:** Input: `Monday, 9 AM`. Output: `High Load`.
      *   *Internal State:* 'Day-of-Week' embedding is active. 'Time-of-Day' embedding is active.
  *   **Case 2:** Input: `Monday, 9 AM`. Output: `High Load`.
      *   *Internal State:* 'Day-of-Week' embedding is **inactive**. 'Time-of-Day' embedding is active. A new 'Historical-Average' vector is active.

  **Question:**
  1.  Is this a behavioral anomaly?
  2.  Is this a mechanistic anomaly?
  3.  Why might we care about Case 2 even if the prediction is correct?"

  **Correct Answer Key:**
  1.  **No.** (Output is identical to expectation).
  2.  **Yes.** (The causal path changed; 'Day-of-Week' reliance was dropped).
  3.  **Risk:** If 'Historical-Average' is stale, the model will fail on `Tuesday, 9 AM` (where Day-of-Week matters but Historical might not). The model has lost robustness despite maintaining accuracy on this specific input.

  ### 6. What to Openly Refuse to Cover

  You must put a "Out of Scope" slide up at the beginning (and refer back to it). If you don't, the safety researchers in the room will ask about causal tracing, and the backend engineers will ask about latency overhead.

  **The "We Are Not Doing This Today" List:**

  1.  **How to measure it:** We are not discussing PCA, clustering, or specific similarity metrics (Cosine vs. Euclidean). Today is about *what* we are measuring, not *how*.
  2.  **How to find the features:** We are not discussing how to identify the 'Day-of-Week' neuron. We assume we have a way to observe internal state (via our monitoring infra).
  3.  **Intervention techniques:** We are not discussing how to *fix* the model if we find a drift. We are discussing how to *flag* it.
  4.  **Proof:** We are not proving that Mechanism A is mathematically distinct from Mechanism B. We are arguing that the distinction is operationally useful for safety.

  **Script for the boundary:**
  *"I know many of you are thinking about Causal Tracing or Probe Classifiers. Those are the 'how'. If we spend 40 minutes on the 'how', we will leave without agreeing on the 'what'. I want us to agree on what constitutes a 'same mechanism' before we argue about how to measure the distance between them. Tooling discussions go in the follow-up working group."*

  ### Summary of Timing (40 Minutes)

  *   **0:00 - 0:05:** The Blind Spot (Why behavioral monitoring fails).
  *   **0:05 - 0:10:** The Code Analogy (Refactor vs. Result).
  *   **0:10 - 0:20:** The Carrying Example (Toxic Classifier / Shortcut).
  *   **0:20 - 0:30:** Breaking the Analogy (Granularity, Weights vs. Flow, Misconceptions a-c).
  *   **0:30 - 0:35:** The Metrics Trap (Misconceptions d-e).
  *   **0:35 - 0:40:** Check for Understanding + Scope Boundary.

  This plan keeps you on the whiteboard, keeps the math minimal, and leverages your audience's existing mental models while carefully dismantling the parts that don't fit.
