answer: |-
  **Framing Selection**
  Three framings were considered. First, an empirical approach testing whether pain phenomenologically crowds out pleasure; this risks reducing the project to psychology. Second, a historical exegesis of negative utilitarianism; this prioritizes names over argument. Third, a structural analysis of aggregation principles. I choose the third. It isolates the specific inference problem: moving from phenomenological exclusivity in a moment to normative lexicality across lives. This offers the sharpest tractable question for a semester-length philosophical argument.

  ***

  **Research Proposal: The Composition of Pain and the Limits of Lexical Priority**

  **The Research Question**
  Does the phenomenological exclusivity of intense pain justify lexical priority across temporal and personal aggregation?

  Standard utilitarianism assumes full commensurability: any pain can be outweighed by sufficient pleasure. Lexical threshold views deny this, claiming intense pains trump any amount of mild pleasure. However, standard defenses of the threshold often conflate three distinct scopes: (1) trade-offs within a single moment of consciousness, (2) trade-offs across time within one life, and (3) trade-offs across different persons. My project investigates whether the argument for lexicality holds water when moved from scope (1) to scopes (2) and (3). Specifically, I will test whether a "Principle of Composition" exists that allows the lexical threshold established in a single moment to propagate to whole lives and populations without relying on circular intuition.

  **Background and Gap**
  Both the one-scale picture and the standard threshold picture leave this question open. The one-scale picture ignores the phenomenological reality that intense pain may destroy the capacity to experience pleasure simultaneously. The standard threshold picture accepts the lexical claim but fails to explain *why* a moment's impossibility of trade-off prevents compensation by future relief or another person's joy. Proponents often argue as if the threshold's plausibility in the single-moment case automatically validates it for populations. My suspicion is that this is a fallacy of composition. The project aims to expose whether the threshold view borrows plausibility from the single-moment case to spend it in the population case without a valid exchange rate.

  **Methodology**
  The project will span four months, structured around conceptual analysis rather than intuition pumping. The obvious alternative—constructing varied thought experiments about torture versus mild pleasure to poll intuitions—is insufficient. As my preliminary discussions showed, intuitions stalemate quickly because opponents are arguing past each other regarding the scope of aggregation. Instead, I will analyze the structural principles required to bridge the scopes.

  *Month 1: Defining the Crowding-Out Thesis.* I will precisely formulate the claim that intense pain monopolizes consciousness. The goal is to establish a non-arbitrary threshold based on phenomenological capacity rather than raw intensity units.
  *Month 2: Temporal Aggregation.* I will examine whether the "crowding out" effect persists across time. Does the impossibility of simultaneous enjoyment prevent compensation by later relief? I will analyze the normative weight of anticipation (dread) and memory (relief) to see if they extend the "moment" of pain or provide compensatory channels.
  *Month 3: Personal Aggregation.* I will test whether the principle derived in Month 2 can extend across persons. If pain monopolizes *my* experience, does that block *your* pleasure from outweighing it? This requires evaluating principles of separateness of persons alongside the composition principle.
  *Month 4: Synthesis and Drafting.* I will assemble the findings into a 20-page paper, focusing on the validity of the bridging principle.

  This method is superior because it targets the *argument structure* rather than the *conclusion*. Even if intuitions differ, we can agree on whether the inference from phenomenology to normative lexicality is valid.

  **Possible Conclusions**
  1.  **Strong Lexicality:** A robust Principle of Composition is found. For example, if pain destroys the subject's capacity to value pleasure, compensation is impossible even across time, because the "subject" who suffers is temporarily negated. This would validate negative utilitarianism.
  2.  **Degraded Lexicality:** The threshold holds for simultaneous experience but degrades across time and persons. Intense pain outweighs massive mild pleasure within a moment, but can be compensated by future relief or others' happiness. This suggests a hybrid view: lexical within moments, aggregative across lives.
  3.  **Collapse:** The argument fails to distinguish lexicality from high intensity weighting. If the "crowding out" is gradual, the threshold becomes vague, collapsing back into a weighted utilitarianism where pain counts for much more, but not infinitely more.

  **Failure Conditions and Complications**
  The project fails if it cannot identify a non-arbitrary threshold. Pain likely takes over experience gradually, not sharply. If the "crowding out" is a slope rather than a cliff, a lexical view built on a cut-off point is untenable. I must address whether a "fuzzy threshold" is coherent or if it destroys the lexical claim.

  A specific wrinkle involves anticipation and relief. Pains anticipated carry the cost of dread; pains past carry the value of relief. This complicates the "single moment" definition. If dread extends the pain backward, the "moment" is wider, potentially strengthening the lexical claim. However, if relief outweighs the memory of pain, it suggests compensation *is* possible across time, weakening the bridge to temporal aggregation. I will investigate whether these temporal extensions help the lexical view (by expanding the protected zone) or hurt it (by introducing commensurable states like relief).

  If I cannot distinguish the "crowding out" argument from a simple claim that pain is intensely bad, the project collapses into a restatement of standard negative utilitarianism without new structural justification. Success requires showing that the *structure* of experience dictates the *structure* of value, not just that pain feels worse than pleasure feels good.

  **Feasibility**
  This scope is tractable for a semester. It avoids broad surveys of axiology in favor of one specific inference problem. The bi-weekly meetings will focus on refining the Principle of Composition. The final paper will argue for one of the three conclusions above, providing a clear determinate answer to whether the lexical threshold can survive the journey from phenomenology to population.
