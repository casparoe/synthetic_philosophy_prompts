answer: |-
  There is no single, canonical noun in the philosophy of biology that captures this configuration without carrying baggage from adjacent debates (like exaptation or vestigiality). However, the configuration is well-recognized, and the most precise label for the *status of the part* is **Standby Function** (sometimes **Backup Function**), grounded in a **Selected Effect for Robustness**.

  Your intuition is correct: standard accounts fracture here. The **Etiological Account** (function = what it was selected for) struggles because neither part was individually necessary for the historical survival of the lineage (the other covered). The **Causal Role Account** (function = what it currently contributes) struggles because the contribution is zero in the actual context.

  The configuration you are describing is a **Maintained Disposition**. The part is selected not for its *actual* current output, but for its *counterfactual* output—the work it *would* do if the primary mechanism failed.

  Here is the carving you asked for.

  ### 1. The Core Concept: Standby Function
  **Definition:** A trait has a standby function for effect *E* if:
  1.  **Capacity:** The trait possesses the specific physical capacity to produce *E*.
  2.  **Inactivity:** In the actual, prevailing environmental/physiological conditions, the trait's contribution to *E* is negligible or zero (because a primary mechanism covers it).
  3.  **Counterfactual Necessity:** In a specific, biologically plausible counterfactual condition (e.g., damage to the primary mechanism, environmental shift), the trait's contribution to *E* becomes necessary for system viability.
  4.  **Maintenance:** The trait is maintained in the population by selection acting on the *system's stability* (robustness), not on the trait's current individual output.

  **Why this fits your instances:**
  *   **Instance 1 (Two Enzymes):** This is **Active Standby** (or "Hot Spare"). Both are expressed; both *can* do the job. Neither is *needed* individually, but the *pair* is selected for insurance against mutation or fluctuation. Each enzyme has the standby function of "ensuring the step occurs if the partner fails."
  *   **Instance 2 (Silent Route):** This is **Passive Standby** (or "Cold Spare"). The trait is present but inactive. It has the standby function of "taking over if the main route fails."

  ### 2. Are Instance 1 and Instance 2 One Phenomenon?
  They are the same *functional category* (Standby) but distinct *evolutionary configurations*.

  *   **Instance 1 is harder to explain evolutionarily.** If both enzymes are expressed and costly, why hasn't selection pruned one? The justification must be that the *cost of expression* is lower than the *risk of single-point failure*. The function is **Insurance**.
  *   **Instance 2 is easier to explain.** If the backup is silent, it is metabolically cheap. It can persist as a "shadow" pathway. The function is **Reserve**.

  Philosophically, however, they share the same logical structure: **Function as a Preserved Disposition.** The function exists in the *capacity* of the part, not its *activity*.

  ### 3. The Carving: Edges and Neighbors
  To prevent this concept from swallowing its neighbors, you must carve it by **Condition of Activation** and **History of Maintenance**.

  | Neighbor | Distinction from Standby Function |
  | :--- | :--- |
  | **Partial Function** | *Edge:* A part that contributes 5% to the flux in normal conditions. <br> *Carving:* Standby requires **zero (or negligible) actual contribution** in the reference environment. If it contributes measurably now, it's a standard Causal Role function, not Standby. |
  | **Conditional Function** | *Edge:* A part used only during heat shock or starvation. <br> *Carving:* Conditional functions are triggered by *environmental change*. Standby functions are triggered by *system failure* (perturbation of another part). If the backup is used only when the organism is hot, it's Conditional. If it's used only when the main enzyme breaks, it's Standby. |
  | **Moonlighting** | *Edge:* A stand-by part that also does a second, unrelated job. <br> *Carving:* Moonlighting refers to the *multiplicity* of functions. A part can have a Standby Function for Job A and an Active Function for Job B. The "Standby" label applies only to Job A. |
  | **Vestigial** | *Edge:* A remnant that no longer works. <br> *Carving:* Vestiges have lost the **Capacity** criterion. A Standby part must be fully capable of doing the job *immediately* upon activation. If it requires evolution to work again, it's Vestigial. |
  | **By-product (Spandrel)** | *Edge:* A trait that fits the job but wasn't maintained for it. <br> *Carving:* By-products lack the **Maintenance** criterion. If the silent route is there just because it's physically impossible to delete without breaking the main route, it's a By-product. If selection actively preserves it *against* decay because it might be needed, it's Standby. |
  | **Redundancy** | *Edge:* The system property of having backups. <br> *Carving:* Redundancy describes the **Relation** between parts. Standby Function describes the **Status** of the individual part. You need the concept of Standby Function to explain *why* the Redundancy exists. |

  ### 4. How to Define It (Without Swallowing the Neighbors)
  If you need a working definition for your own conceptual toolkit, use this:

  > **Standby Function:** A trait *T* has a standby function for effect *E* in system *S* if:
  > 1.  *T* has the intrinsic capacity to produce *E*.
  > 2.  *T* does not currently produce *E* in the actual operating regime of *S* (or its contribution is substitutable without cost).
  > 3.  *T* is maintained in the lineage specifically because *S* requires a capacity to produce *E* under counterfactual conditions of perturbation to the primary producer of *E*.

  **The Critical Boundary:**
  The line is drawn at **Selection for Stability**.
  *   If the duplicate enzyme is drifting neutrally and hasn't decayed yet, it is **not** a Standby Function; it is **Transient Redundancy**.
  *   If the duplicate enzyme is under purifying selection (mutations are weeded out) *despite* having no current causal role, it **is** a Standby Function.

  ### 5. Why Your Colleagues Use "Function"
  When your colleagues say the silent enzyme "has the function," they are implicitly using a **Propensity Account** of function mixed with **Systems Thinking**. They are not saying "it is doing the job now" (Causal Role) nor strictly "it was selected to do the job alone" (Etiological). They are saying: *"This part is a maintained component of a robust system, and its identity is defined by the job it is prepared to do."*

  In engineering terms, a fire extinguisher has the function of putting out fires even if it sits in a box for 20 years. Its function is not defined by its current activity (none), but by its **design-maintained disposition**. Your enzymes are biological fire extinguishers.

  ### Summary
  *   **Name:** Standby Function (or Backup Function).
  *   **Ontological Status:** Maintained Disposition / Counterfactual Causal Role.
  *   **Evolutionary Ground:** Selection for System Robustness (Insurance).
  *   **Key Distinction:** It is not Redundancy (system property), not Vestigial (capacity lost), and not Conditional (triggered by environment vs. system failure).
  *   **Instance 1 vs 2:** Active Standby (Hot) vs. Passive Standby (Cold). Both are Standby.

  This configuration is the biological equivalent of **engineering redundancy**, and the philosophical carving requires shifting the focus from *actual contribution* to *maintained capacity for counterfactual contribution*.
