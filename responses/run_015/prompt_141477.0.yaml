answer: |-
  **Project Title:** The Welfare Arithmetic of Habitat Loss: A Comparative Framework for Land-Use Decisions

  **Project Description**

  The prevailing question in the ethics of wild animal suffering asks whether nature contains more suffering than happiness. Some infer from an affirmative answer that destroying habitat reduces total suffering. This proposal refuses that framing. The aggregate question is empirically intractable and axiologically misshapen for anyone who must actually choose between land uses. Instead, this project asks a comparative, decision-shaped question: given a specific proposed land-use change, what is the net welfare impact relative to the relevant counterfactual? The aim is to produce a structured framework that allows conservation bodies and agricultural policymakers to weigh welfare outcomes without requiring impossible knowledge of global wild animal welfare totals.

  The familiar stance—that habitat loss reduces suffering if wild lives are net negative—is under-argued rather than merely unpopular. It relies on conflations that this project will disentangle. First, it runs together three distinct processes: outright destruction (conversion to a surface supporting almost no wild animals), conversion to a different productive use (arable land, pasture, urban), and degradation or fragmentation of remaining habitat. These have divergent welfare profiles. Degradation, for instance, may raise the numbers of small-bodied generalists while lowering those of specialists, potentially increasing total suffering even if average welfare per animal falls. Second, the standard view ignores the temporal structure of harm. Clearing or burning causes a concentrated episode of dying. Even if the subsequent equilibrium contains less suffering per year, there is a transition cost. This project will model the payback period required before the steady-state benefits outweigh the transition costs, determining how long that period must be before the policy-relevant verdict flips.

  Third, and most critically, destruction is usually replacement, not erasure. The project introduces the displacement ratio: the ratio between wild-animal life-years foreclosed in the destroyed habitat and the wild-animal life-years generated by whatever occupies the land afterwards. If this ratio is near or below one for common successor states such as farmland or regenerating scrub, the standard argument collapses. Furthermore, the elasticity of wild-animal population size with respect to habitat area may be low where populations are regulated by density-dependent factors rather than area as such. Losing habitat might produce a smaller steady-state reduction in numbers than the area lost suggests. By treating these not as empirical claims to be proven true, but as variables to be modelled, the project avoids the trap of premature certainty.

  The methodology proceeds in three phases over nine months. Phase One (Months 1–3) establishes the axiological scaffolding and unit of account. It will determine whether the relevant improvement is impersonal (a state of affairs with less suffering) or person-affecting (no one is benefited by not existing), and how much of the framework survives if one takes a strongly person-affecting view. Simultaneously, it will defend the unit of account. Per-hectare welfare accounting is intuitive but insensitive to productivity; a hectare of estuary and a hectare of arid scrub are not comparable welfare technologies. The project will test whether welfare-per-unit-of-primary-productivity tracks the underlying biology better, acknowledging that this choice can change the sign of the comparison between habitat types. No new empirical data will be collected; contested questions such as invertebrate sentience will be treated as parameters to be varied.

  Phase Two (Months 4–6) involves parametric modelling. Using the distinctions above, I will construct a decision matrix that varies the displacement ratio, the transition cost duration, and the elasticity of population size. This is not a full empirical review, which would stall on data gaps, nor a pure armchair argument, which would lack traction. Instead, it produces threshold values. For example, the model will identify the minimum displacement ratio required to justify conversion given a specific transition cost. This allows the project to say, even approximately, what conditions must hold for a verdict to flip.

  Phase Three (Months 7–9) focuses on application and refinement. The output will be a concrete deliverable for people who make land-use decisions, such as conservation bodies weighing restoration or rewilding, and agricultural policymakers weighing set-aside. This will take the form of a guidance framework that clarifies counterfactual baselines: whether the comparison is destruction now versus preservation forever, destruction now versus destruction later by other causes, or versus restoration. It will also address leakage, questioning whether protecting one place merely displaces the pressure elsewhere. The goal is not a licence to bulldoze, but a rigorous method for assessing welfare trade-offs that currently go unexamined.

  A genuine failure looks like demonstrating that the sign of the effect is underdetermined by anything currently knowable. If the range of plausible parameters for sentience and population elasticity is so wide that the welfare arithmetic yields no determinate verdict even in principle, this is a negative result worth funding. It prevents policymakers from acting on false precision. The scope explicitly excludes new field data collection. The project treats ecological and sentience questions as inputs to a conceptual machine, not as outputs to be discovered. If the machine shows that the inputs required for a decision are unavailable, the project has succeeded in clarifying the limits of current knowledge.

  **Epistemic Status**

  **Working Hypothesis:** For most common land-use conversions in temperate zones, the transition costs and displacement ratios are such that habitat destruction increases net suffering in the short-to-medium term, regardless of the baseline valence of wild life. **Confidence Level:** Moderate (60%).

  **Weakest Assumption:** The assumption that population size scales linearly or predictably with habitat area in fragmented landscapes. This is most likely to be false due to complex density-dependent regulations. The project will find this out early in Phase Two when attempting to parameterise the elasticity variables; if the literature reveals no stable relationship even as a rough heuristic, the model will require structural revision.

  **Abandonment Condition:** I would abandon the displacement-ratio approach altogether if it becomes clear that the successor states (e.g., urban vs. arable) do not generate distinct, comparable welfare profiles but rather function as ecological sinks where welfare arithmetic becomes meaningless due to population collapse.

  **Conceptual vs. Empirical:** The axiological scaffolding (person-affecting vs. impersonal) and the definition of the displacement ratio are purely conceptual and would survive any empirical verdict. The specific threshold values for transition costs and the elasticity of population size stand or fall with the ecology; these are the empirical components that remain parameterised rather than settled.
