answer: |-
  You have put your finger on one of the most persistent and debated tensions in the philosophy of biology and metaethics. You are correct: there is no single, canonical noun (like "supervenience" or "qualia") that labels this exact asymmetrical move. However, in contemporary philosophy of science and metaethics, this structure is rigorously mapped under the umbrella of **Evolutionary Metaethics**, specifically within the debate between **Evolutionary Debunking Arguments (EDAs)** and **Evolutionary Vindication**.

  If you need a label to search for or use in a paper, the most precise technical description is **The Debunking/Vindication Asymmetry** (sometimes discussed as **Selective Genealogical Naturalism**).

  Here is the carving you asked for: what the phenomenon is, the principled distinctions defenders use to avoid "special pleading," and where the line is drawn between a consistent position and an inconsistent one.

  ### 1. The Structure of the Move
  You identified two distinct genealogical moves applied to different domains:
  *   **Domain A (Religion/Metaphysics):** Evolutionary explanation $\rightarrow$ **Debunking**. (Origin shows the belief is a byproduct of cognitive biases, not truth-tracking.)
  *   **Domain B (Morality):** Evolutionary explanation $\rightarrow$ **Vindication/Preservation**. (Origin shows the instinct is adaptive and socially necessary, preserving its normative force.)

  In the literature, the first move is an **Evolutionary Debunking Argument (EDA)**. The second move is often called **Evolutionary Functionalism** or **Pragmatic Vindication**.

  ### 2. Is it Inconsistent? (The Carving)
  Philosophers argue this is not necessarily special pleading *if* one accepts a specific distinction between the two domains. The consistency hinges on **Truth-Aptness** and **Telos (Aim)**.

  #### The Principled Distinction: Descriptive vs. Normative
  *   **Religion (Descriptive Claim):** Religious belief typically makes a claim about mind-independent reality (e.g., "A God exists," "Spirits cause thunder"). These are **truth-apt** propositions. If evolution shows our "agent-detection" module fires falsely to keep us safe, then the *truth claim* is undermined. The origin defeats the justification.
  *   **Morality (Normative Claim):** Moral judgments (e.g., "Cruelty is wrong") may not be truth-apt descriptions of the universe, but rather **action-guiding commitments**. If morality is viewed as a social technology for cooperation, its evolutionary origin doesn't debunk it; it explains its *utility*.

  **The Carving Edge:** The asymmetry is consistent *only if* you treat morality as **non-cognitive** (expressing attitudes/instincts) or **constructivist** (made by us for us), while treating religion as **cognitive** (describing the world).
  *   **If you are a Moral Realist** (believing moral facts exist independently of humans, like math or physics), then the asymmetry *becomes* special pleading. If God is debunked because evolution shaped the belief, why aren't Moral Facts debunked for the same reason? (This is **Sharon Street's "Darwinian Dilemma"**).
  *   **If you are a Moral Anti-Realist/Pragmatist**, the asymmetry holds. Religion fails because it claims to describe reality and doesn't. Morality succeeds because it claims to regulate behavior and does.

  ### 3. Key Terminology for Your Class
  To sound precise in your philosophy of bio class, use these terms to describe the sides of the pattern:

  *   **The Genetic Fallacy (Nuanced):** You are right that it's not simply this. The genetic fallacy says origins *never* matter. In epistemology, origins *do* matter for **reliability**. If a belief is caused by a process that doesn't track truth (like fear-based agent detection), the origin *is* relevant. This is called a **Defeater**.
  *   **The Darwinian Dilemma (Sharon Street):** This is the specific name for the problem you noticed. Street argues that if evolution shaped our moral values, Moral Realists cannot claim those values track independent truth. They must either admit morality is mind-dependent (Constructivism) or accept the debunking.
  *   **Error Theory (J.L. Mackie / Richard Joyce):** This is the view that takes the asymmetry and removes the shield. Joyce argues that if we apply the evolutionary explanation consistently, we must debunk *both* religion and morality. He calls morality an "illusion" useful for survival, just like religion.
  *   **Third-Factor Explanations (David Enoch):** This is a defense used to save Moral Realism. It argues that evolution and moral truth correlate not because evolution "created" truth, but because survival is *good*. (e.g., Evolution selected for "care for offspring" because caring for offspring is objectively valuable). This attempts to bridge the gap without asymmetry.
  *   **Quasi-Realism (Simon Blackburn):** A view that allows us to talk *as if* morality is objective (to protect it from debunking) while admitting it is projective (evolved sentiments). This preserves the asymmetry by changing the status of moral language.

  ### 4. Why Darwin Did It (Historical Context)
  In *The Descent of Man*, Darwin was operating under a Victorian **Natural Theology** framework for morality but a **Materialist** framework for religion.
  *   He viewed the "Moral Sense" as a biological organ (like a limb) that evolved for social cohesion. To debunk it would be to debunk the very thing that makes humans "civilized."
  *   He viewed Religious Belief as a psychological byproduct of cognitive faculties (memory, curiosity, agent detection).
  *   **Critique:** Modern philosophers like **Michael Ruse** argue Darwin was inconsistent. Ruse famously argued that if we are honest Darwinians, we must admit morality is a "collective illusion" put on by our genes to aid survival, just like religious belief. Ruse calls this **"Taking Morality Seriously" vs. "The Illusion of Objectivity."**

  ### 5. Summary: How to Label It
  If you need to name this in an essay:
  1.  **Descriptive Label:** "The Asymmetry of Evolutionary Genealogy."
  2.  **Critical Label:** "Inconsistent Naturalism" (if arguing Darwin was wrong).
  3.  **Defensive Label:** "Domain-Specific Epistemology" (if arguing the distinction between descriptive and normative claims justifies the move).

  **The Boundary Line:**
  The move stops being a principled distinction and becomes **Special Pleading** the moment one claims that Moral Values are **Mind-Independent Objective Truths** (like the law of gravity) while simultaneously admitting they were selected purely for **Reproductive Fitness**. You cannot claim morality is "True" in a cosmic sense *and* that it exists solely because it helped us survive, without explaining why Fitness and Truth align. (This is the heart of Street's Dilemma).

  If, however, one claims Morality is **Mind-Dependent** (a human construct for social living), then the evolutionary origin validates it rather than debunking it, and the asymmetry remains logically stable. Darwin arguably hovered between these two views, which is why you sense the tension.
