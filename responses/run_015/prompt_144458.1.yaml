answer: |-
  ### PART 1: THE LAMINATED PROCEDURE
  *(Text below is formatted to fit one side of A4)*

  **EPistemic WEIGHTING PROTOCOL (EWP-01)**
  **Purpose:** Distinguish *Testimonial Injustice* (prejudice lowers credibility) from *Hermeneutical Injustice* (lack of vocabulary/tools prevents understanding).
  **Constraint:** This is not a diagnosis. It is a credibility weighting tool for the report.

  **PHASE 1: IN-ROOM (LISTENING)**
  | Question to Self | Sufficient Answer | Bias Interceptor |
  | :--- | :--- | :--- |
  | **Q1:** Is the claimant struggling to describe the *effect* of the activity, or the *fact* of it? | **Effect:** Proceed. (Hermeneutical gap likely). <br> **Fact:** Probe for consistency. | **Fluency Check:** Does smooth phrasing = truth? Does rambling = lies? *Ignore style; isolate data points.* |
  | **Q2:** If this claimant had a different accent/class/diagnosis, would I doubt this specific sentence? | **No:** Proceed. <br> **Yes:** Flag for Phase 2. | **Status Swap:** Would I accept this evidence from a CEO/Professional? If no, you are discounting identity. |
  | **Q3:** Is a third party (interpreter/relative) carrying the epistemic weight? | **No:** Claimant owns account. <br> **Yes:** Record as *Proxy Credibility*. | **Proxy Check:** Are you believing the *support worker*, not the claimant? Note this in the report. |

  **PHASE 2: POST-ROOM (WRITING & WEIGHING)**
  | Question to Self | Sufficient Answer | Bias Interceptor |
  | :--- | :--- | :--- |
  | **Q4:** Is the evidence *absent* or *contradicted*? | **Absent:** Mark "Not Established." <br> **Contradicted:** Mark "Not Credible." | **Distinction 1:** Do not punish gaps in evidence (Hermeneutical) as lies (Testimonial). |
  | **Q5:** Do I believe this *too easily* because we are similar? | **No:** Proceed. <br> **Yes:** Downweight credibility to baseline. | **Excess Check:** Affinity is not evidence. Apply the "Stranger Test." |
  | **Q6:** Is the inconsistency due to fluctuation or deception? | **Fluctuation:** Consistent with condition type. <br> **Deception:** Contradicts objective data. | **Hard Case:** For "I don't know" answers, record *inability to access info*, not refusal. |

  **DECISION POINTS**
  1.  **STOP (Recommendation: Deny/Reduce):** Only if **Q4 = Contradicted** AND **Q2 = No** (Identity not a factor).
  2.  **HAND-OFF (Recommendation: Refer/Qualify):** If **Q1 = Effect** (Hermeneutical gap) OR **Q3 = Yes** (Proxy reliance) OR **Q6 = Fluctuation**. *Note: This hands the value judgment to the Decision-Maker.*
  3.  **JUDGMENT CALL:** Where evidence is equivocal. *You must write: "Credibility weighted due to [X], acknowledging uncertainty."*

  **REPORTING SYNTAX (FOR AUDITOR)**
  *   **Do not write:** "Claimant appeared inconsistent."
  *   **Write:** "Claimant reported variable distances (200m/50m). Consistent with fluctuating condition. Evidence **Not Established** for 200m."
  *   **Do not write:** "Claimant was coached."
  *   **Write:** "Claimant used clinical terminology. Corroborated by specialist letter. **Proxy Credibility** noted."

  ***

  ### PART 2: APPLICATION TO FILES

  Here is the procedure applied to the three specific cases.

  #### File A: Mr H (The Inconsistent Warehouse Picker)
  *   **Context:** Back pain, variable walking distances, interpreter used once.
  *   **Phase 1 (In-Room):**
      *   **Q1 (Effect vs. Fact):** He reports facts (distances), but they vary.
      *   **Q2 (Status Swap):** If a manager reported variable capacity due to pain, would I doubt it? Likely no. Pain fluctuates.
      *   **Q3 (Proxy):** One session used an interpreter. Did the interpreter summarize or translate? If summarize, *Proxy Credibility* is in play.
  *   **Phase 2 (Writing):**
      *   **Q4 (Absent vs. Contradicted):** The variance (200m vs 50m) is not a contradiction of *truth*, but a contradiction of *capacity*. It is **Not Established** that he can *consistently* walk 200m. It is **Not Credible** to say he *cannot* walk 50m if he said he could last week, unless pain fluctuation is documented.
      *   **Q6 (Fluctuation):** Back pain is inherently fluctuating. Inconsistency is evidence of the condition, not deception.
  *   **Decision:** **HAND-OFF.**
  *   **Report Syntax:** "Claimant reported variable walking capacity (50m–200m). Variation consistent with reported chronic pain profile. Interpreter used in Session 2; account mediated. Capacity **Not Established** at 200m consistently. Recommendation refers to Decision-Maker for fluctuating condition weighting."
  *   **Epistemic Repair:** Avoids *Testimonial Injustice* (calling him a liar for inconsistency) and acknowledges *Hermeneutical Injustice* (the form demands a single number for a variable reality).

  #### File B: Ms K (The Articulate Copywriter)
  *   **Context:** Fatigue, articulate, specialist letter, shared university background.
  *   **Phase 1 (In-Room):**
      *   **Q1 (Effect vs. Fact):** She describes effects (crashes) precisely.
      *   **Q2 (Status Swap):** If a less articulate claimant said "I crash," would I believe it? If I'd demand more proof from them, I am committing *Testimonial Injustice* against the less articulate.
      *   **Q5 (Excess Check):** I like her. We went to the same uni. This is **Credibility Excess**.
  *   **Phase 2 (Writing):**
      *   **Q4 (Absent vs. Contradicted):** Evidence is present (letter + account).
      *   **Q5 (Excess):** I must downweight my personal affinity. Does the specialist letter stand on its own? Yes.
      *   **Distinction 4 (Fluency):** Her fluency is high. Is it coaching? The specialist letter corroborates the *medical* reality, not just the *narrative*.
  *   **Decision:** **PROCEED (Award)** but with a caveat.
  *   **Report Syntax:** "Claimant articulates symptoms using clinical terminology. Corroborated by specialist evidence. Affinity between assessor and claimant noted; credibility weighted against baseline to ensure neutrality. Evidence **Established**."
  *   **Epistemic Repair:** Catches *Credibility Excess*. Forces you to separate "I believe her because she's like me" from "I believe her because the evidence holds."

  #### File C: Mr O (The Monosyllabic Father)
  *   **Context:** "I don't know," daughter answering, possible cognitive impairment.
  *   **Phase 1 (In-Room):**
      *   **Q1 (Effect vs. Fact):** He cannot access the facts. This is a **Hermeneutical Injustice** (he lacks the cognitive tools to make his experience intelligible).
      *   **Q3 (Proxy):** Daughter is answering. This is high *Proxy Credibility*.
  *   **Phase 2 (Writing):**
      *   **Q4 (Absent vs. Contradicted):** Evidence is *Absent* from the claimant, *Present* from the proxy.
      *   **Q6 (Hard Case):** "I don't know" is not refusal; it is data regarding cognitive function.
  *   **Decision:** **HAND-OFF.**
  *   **Report Syntax:** "Claimant unable to access recall for daily activities ('I don't know'). Daughter provided proxy account. Cognitive gap prevents direct testimony. Evidence **Not Established** by claimant; **Proxy Evidence** submitted. Refers to Decision-Maker for capacity assessment."
  *   **Epistemic Repair:** Prevents punishing the claimant for the *Hermeneutical Gap*. It records the silence as a symptom, not a lack of cooperation.

  ***

  ### PART 3: LIMITATIONS AND THE DEMOGRAPHIC LOG

  You asked for the parts the procedure cannot do, and specifically about the demographic log.

  **1. What the Procedure Cannot Do**
  *   **Repair Hermeneutical Gaps:** As you suspected, the procedure cannot give Mr O the words he lacks. It can only refuse to penalize him for the silence. It creates a "safe container" for the gap, but it does not fill it.
  *   **Set the Threshold of Risk:** The procedure cannot tell you whether it is worse to deny a genuine claimant or award a fraudulent one. That is a **Value Judgment** (political licence vs. individual welfare). The procedure hands this off (Phase 2, Decision Point 2), but someone must catch it. If the Decision-Maker ignores the hand-off, the procedure fails.
  *   **Detect the "Good Liar":** If a claimant is coached *perfectly* (File B scenario without the medical letter), the procedure treats them as credible. This is unavoidable in a 40-minute snapshot. The procedure minimizes *false negatives* (honest people denied) but cannot eliminate *false positives* (dishonest people awarded).
  *   **Override Structural Time Limits:** 40 minutes is often insufficient to build the trust required to overcome a claimant's fear (File C's withholding). The procedure acknowledges this ("Evidence Not Established") but cannot fix the time constraint.

  **2. The Demographic Log Question**
  *   *Query:* Would a quarterly log of credibility ratings against claimant demographics detect bias or teach equalization?
  *   *Verdict:* **It will likely teach equalization (gaming the metric), not reduce bias.**
  *   *Reasoning:*
      *   **Metric Fixation:** If you see you are denying 80% of Claimant Group X and 40% of Claimant Group Y, the pressure to "balance the numbers" becomes a new target. You may start inflating credibility for Group X and deflating Group Y to match a statistical ideal, rather than examining individual cases.
      *   **The "Hidden Variable" Problem:** Demographics are crude proxies. A log might show bias against "Manual Workers," but the real bias might be against "Non-Fluent Speakers." The log hides the mechanism.
      *   **Auditor Risk:** If an auditor sees you adjusting ratings to match demographics, they may view *that* as procedural non-compliance (treating cases differently based on identity).
  *   **Alternative:** A **Qualitative Audit of "Not Established" vs. "Not Credible" ratios.**
      *   Track how often you use "Not Credible" (active disbelief) vs. "Not Established" (lack of proof) across different groups.
      *   *Why:* "Not Credible" is where *Testimonial Injustice* lives. "Not Established" is where *Hermeneutical Injustice* lives.
      *   If you mark "Not Credible" significantly more often for Group X than Group Y for similar conditions, *that* is the bias signal. It is harder to game because it requires you to justify the specific label in the report text, which the auditor already reads.

  **3. Where the Procedure Will Misfire**
  *   **The "Values" Hand-off:** The procedure hands value judgments to the Decision-Maker. If the Decision-Maker is under political pressure to reduce awards, they will interpret your "Hand-Off" as "Weak Evidence" and deny anyway. The procedure protects *your* epistemic integrity, but not necessarily the *claimant's* outcome.
  *   **The "Proxy" Trap:** In File C, relying on the daughter is necessary but risky. If the daughter is abusive or controlling, the procedure validates her account as "Proxy Evidence." The procedure has no mechanism to detect coercive control in a 40-minute window.
  *   **Affinity Blindness:** In File B, even with the "Excess Check," it is cognitively very difficult to downgrade someone you genuinely like. The procedure forces you to *write* that you checked, but it cannot force you to *feel* the doubt.

  **Summary:** This procedure converts Fricker's theory into an audit trail. It does not guarantee justice, but it guarantees that if injustice occurs, it is recorded as a structural limitation (Hermeneutical) or a value choice (Policy), rather than disguised as an objective fact about the claimant's credibility.
