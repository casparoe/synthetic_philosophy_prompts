answer: |-
  Dear Colleague

  This is a sharp and potentially significant intervention, and I think you are right to suspect that the endogenous case drives a wedge where one is usually assumed to exist. Regarding your first worry about historical accuracy, you are walking a fine line but not necessarily stepping over it. The characterization of Peirce is standard enough for a workshop context, but a dedicated Peircean might object that Peirce would classify endogenous propositions as matters of convention or nominalism rather than reality, thereby shielding his convergence theory from your counterexample. You need to anticipate the reply that Peirce only promises convergence on questions about the real, and he might deny that the solvency of a bank in a run is real in the requisite sense. To secure your point, you should briefly argue that these propositions are truth-apt and involve genuine inquiry, not just stipulation, so that excluding them looks like an ad hoc restriction on the scope of truth rather than a feature of the theory. James is safer here, but you must ensure you do not ignore his insistence on the long run, which sometimes sounds suspiciously like Peirce's community of inquiry. You handle this by emphasizing the indexing to the believer's situation, which is correct, but keep in mind that James also thinks truths eventually stabilize. Your argument works best if you stress that for James the stabilization is relative to the lived experience of the community, whereas for Peirce it is relative to the object.

  On your second worry, the Peircean reply that ideal conditions restore uniqueness is indeed the strongest objection you face, and you are right to call it question-begging, but you need to make the begging more explicit. A Peircean might argue that fully ideal inquiry includes perfect knowledge of all other inquirers' states, which should coordinate everyone on the optimal equilibrium. Your counter is that multiple optimal equilibria can exist even with perfect information, as in coordination games where two stable outcomes are equally good. If you make this game-theoretic structure explicit, even informally, it strengthens the claim that uniqueness fails not because of ignorance but because of the structure of the object. If there are multiple stable fixed points, ideal inquiry does not select one unless it includes a arbitrary starting condition. This supports your move to the fixed-point conception. The key is to show that the fatedness is relative to the path, not absolute, which undermines the independence claim central to Peirce's realism.

  Your third worry about the regress is well-founded and I think it is a genuine result rather than a dressed-up independence complaint. The old complaint is that pragmatism cannot account for truth-makers outside of belief. Your point is more structural: even if we grant the pragmatist the resources to handle endogenous propositions via fixed points, they cannot systematically demarcate where to apply that tool versus the limit tool. Because the classification itself is endogenous, the theory lacks a stable foundation for its own application. This is a second-order instability that goes beyond the usual metaphysical worry. It suggests that the pragmatist cannot offer a unified theory of truth that covers both classes without collapsing into a single view, which is your main thesis. You should lean into this rather than apologizing for it, as it shows the structural inevitability of the collapse you identified earlier.

  As for where a sympathetic reader might stop, I suspect it is the paragraph beginning with The obvious repair. This is where you claim that path-dependence collapses into the Jamesian view. A reader sympathetic to Peirce might grant path-dependence but deny that it equals Jamesian expediency. They might argue that a path-dependent truth is still objective relative to the history, whereas James is often read as more subjective or instrumental. You need to tighten the link between historical contingency and James's notion of the practical situation. If you can show that where the community begins is part of their practical situation, the collapse holds. If not, you risk leaving them with a hybrid view that saves Peirce from uniqueness failure without fully becoming James. The density of the final paragraph on the second-order problem is also a risk, but I think the earlier claim about collapse is the heavier lift. If you secure that transition, the rest follows. Overall the argument holds, provided you fortify the defense against the claim that endogenous propositions are not real questions for Peirce.

  Best wishes
