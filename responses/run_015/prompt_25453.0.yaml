      *   **Task:**
          1.  Systematic audit of the analogy (correspondences).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Separate significant disanalogies from superficial ones.
          4.  Offer a committed judgment on whether the conclusion (moral testimony cannot transmit genuine moral knowledge) survives.
          5.  Suggest a better analogy if applicable.
