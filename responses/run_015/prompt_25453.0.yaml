  2.  **Analyze the "Joke Analogy" (The Target):**
      *   *Proponent:* Likely drawing from Sarah McGrath, David Enoch, or perhaps earlier work by Anscombe/Williams, but the specific "joke" analogy is often associated with the idea that moral knowledge requires *appreciation* or *sensitivity*, not just propositional acceptance. (Actually, the specific "joke" analogy is most famously associated with **David Enoch** in "Against Moral Testimony" or similar discussions by **Sarah McGrath**).
      *   *Claim:* Moral testimony yields belief without understanding. Understanding is essential for moral worth/knowledge.
      *   *Conclusion:* Moral testimony is defective/impossible for genuine moral knowledge.

  3.  **Step 1: Systematic Audit (Correspondences):**
      *   *The Joke* $\rightarrow$ *The Moral Situation/Action*.
      *   *The Punchline/Humor* $\rightarrow$ *The Moral Property (Wrongness/Rightness)*.
      *   *The Teller (who gets it)* $\rightarrow$ *The Moral Expert/Testifier*.
      *   *The Listener (who doesn't get it)* $\rightarrow$ *The Moral Deferer*.
      *   *Getting the Joke (seeing the incongruity/resolution)* $\rightarrow$ *Grasping the Moral Reasons*.
      *   *Trusting the Teller* $\rightarrow$ *Deferring to the Expert*.
      *   *The Feeling of Amusement* $\rightarrow$ *The Moral Sentiment/Recognition*.

  4.  **Step 2 & 3: Disanalogies (Superficial vs. Deep):**
      *   *Superficial:* Jokes are trivial; morality is serious. (Doesn't affect the epistemic structure).
      *   *Deep 1 (Accessibility):* Jokes often rely on shared cultural context or sudden insight. Moral reasons are often articulable and argument-based. You can explain *why* murder is wrong via harm; explaining *why* a joke is funny often kills it or is impossible ("explaining a joke").
      *   *Deep 2 (Normative Force):* Getting a joke is optional. Recognizing moral wrongness carries a demand for action.
      *   *Deep 3 (The nature of 'Understanding'):* In jokes, understanding is phenomenological (the laugh). In morality, understanding is often rational (grasping the principle).
      *   *Deep 4 (Testimony's Role):* In jokes, testimony ("It's funny") is useless without the experience. In morality, testimony ("It's wrong") can guide action even without full grasp of reasons, and that action might still be morally good.

  5.  **Step 4: Committed Judgment:**
      *   Does the conclusion survive? No, not in its strong form. The analogy overstates the opacity of moral reasons. Moral reasons are often *shareable* in a way punchlines are not. We can transmit the *reasons* (testimony of reasons), not just the *verdict*.
      *   The analogy conflates "believing on authority" with "believing without reasons." In morality, testimony often *provides* the reasons (e.g., "Don't eat that, it belongs to someone else"), whereas in jokes, the testimony *replaces* the experience.
      *   *Verdict:* The analogy captures the *phenomenology* of moral insight but fails as an argument against the *epistemology* of moral testimony.

  6.  **Step 5: Better Analogy:**
      *   *Math/Logic:* A student trusts a teacher that a proof works. They might not see the whole proof yet, but they accept the conclusion based on the teacher's reliability. This allows for future understanding.
