      *   *Navigation:* A guide tells you which path is safe. You don't need to know *why* (geology) to know *that* it's safe.
      *   *Selection:* **The Math/Proof Analogy** is best for epistemic transmission. **The Medical Diagnosis Analogy** is best for action-guidance. Let's go with a hybrid or focus on the **Math/Logic** one because it addresses the "understanding" constraint best. Actually, the **"Seeing the Proof"** analogy is the standard counter to the joke analogy.
