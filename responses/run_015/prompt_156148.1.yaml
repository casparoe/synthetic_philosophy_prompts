      *   *Group Agency Issue:* Does shifting to a board smuggle in new problems? Yes, aggregation of belief is distinct from individual belief (discursive dilemma/doctrinal paradox). However, for the sake of the analogy, if we treat the Board as a single epistemic agent, it works. The risk is conflating *aggregation of judgment* with *logical closure*.

