answer: |-
  # System Specification: Neural Computation Architecture
  **Reference:** Von Neumann, *The Computer and the Brain* (Conceptual Derivative)
  **Target:** Theoretical Model of Biological Cognition
  **Audience:** Systems Architect / Theoretical Neuroscientist

  ## 1. Introduction
  You are asking for an Interface Control Document (ICD) for the mind. Von Neumann's core insight was that the brain cannot be modeled as a standard von Neumann architecture machine (sequential, digital, distinct memory/processing) because the physical constraints of the substrate (neurons) violate the assumptions of reliability and precision required by classical logic.

  The following desiderata define the boundary conditions for any theory claiming to explain neural computation. They are categorized by necessity. "Non-negotiable" items are derived from hard biological or information-theoretic constraints. "Camp-specific" items represent architectural choices where competing theories diverge.

  ---

  ## 2. The Desiderata

  ### Requirement 1: The Von Neumann Reliability Constraint (Distributed Systems Import)
  **Specification:** The system must exhibit **graceful degradation under partial node failure without invoking a global orchestrator or redundant backup scheme.**
  **Motivating Phenomenon:** Neurons die continuously; synapses drift; neurotransmitter levels fluctuate (hardware failure). Yet, semantic memory and motor skills persist without catastrophic loss (system stability). Crucially, this is not achieved by RAID-style redundancy (copying data to multiple locations) but by functional overlap where different physical configurations yield the same logical output.
  **Distinction:** Differentiates *hardware failure* (a neuron stops firing) from *representational error* (the system infers "cat" when presented with "dog"). The theory must explain how the former does not inevitably cause the latter.
  **Classification:** **Non-negotiable.** (Biological fact).

  ### Requirement 2: The Analog-Digital Interface Protocol
  **Specification:** The theory must define a lossless or bounded-loss translation layer between continuous signal modulation (analog) and discrete logical inference (digital).
  **Motivating Phenomenon:** Action potentials are all-or-nothing events (digital-like), but synaptic weights, membrane potentials, and spike timing intervals are continuous (analog). Cognition involves both fuzzy perception (analog) and discrete decision making (e.g., "if X then Y").
  **Distinction:** Differentiates *statistical approximation* (the signal is noisy but averages out) from *verifiable inference* (the logic holds regardless of noise). A theory that claims the brain is "just analog" fails to explain rigorous mathematical reasoning; a theory that claims it is "just digital" fails to explain sensory gradation.
  **Classification:** **Non-negotiable.** (Physical constraint of the substrate).

  ### Requirement 3: Online, Local Self-Modification
  **Specification:** Structural or parametric updates (learning) must occur via local rules available at the node level, without a global error signal back-propagated from a central supervisor.
  **Motivating Phenomenon:** There is no "external programmer" updating the brain's weights. There is no global clock or central loss function calculator broadcasting errors to every neuron simultaneously. Learning happens in real-time (online) as the organism interacts with the environment.
  **Distinction:** Differentiates *training phase* (offline, supervised) from *operation phase* (online, unsupervised/semi-supervised). In the brain, these are the same process.
  **Classification:** **Non-negotiable.** (Anatomical constraint; no anatomical structure exists to support global backpropagation).

  ### Requirement 4: Thermodynamic Efficiency Bound
  **Specification:** Computational throughput must be achievable within a ~20 Watt power budget.
  **Motivating Phenomenon:** The brain performs complex pattern recognition and motor control at a power consumption orders of magnitude lower than equivalent silicon clusters.
  **Distinction:** Differentiates *compute-bound* systems (limited by logic gates) from *energy-bound* systems (limited by metabolic supply).
  **Classification:** **Non-negotiable.** (Biological constraint).

  ### Requirement 5: Symbolic Grounding Mechanism
  **Specification:** The theory must explain how physical states (spike trains) acquire semantic content (meaning) without an external interpreter.
  **Motivating Phenomenon:** A voltage spike is just electricity. A concept ("justice," "apple") is meaningful. The transition from syntax (signal structure) to semantics (reference) must be internal to the system.
  **Distinction:** Differentiates *causal correlation* (neuron A fires when apple is present) from *semantic representation* (neuron A *means* apple).
  **Classification:** **Camp-specific Preference.** (Symbolic architectures treat this as a mapping problem; Connectionist architectures treat it as an emergent property of vector space; Enactivist frameworks reject internal representation entirely).

  ### Requirement 6: Temporal Binding without Central Clock
  **Specification:** Disparate processing streams (color, motion, shape) must be integrated into a unified percept without a global system clock enforcing synchrony.
  **Motivating Phenomenon:** Visual processing speeds vary by pathway, yet perception is unified. There is no central oscillator in the brain coordinating all regions.
  **Distinction:** Differentiates *lock-step synchronization* (CPU cycles) from *phase-locking or coincidence detection* (neural synchrony).
  **Classification:** **Non-negotiable.** (Anatomical constraint).

  ---

  ## 3. Tension Matrix: Jointly Unsatisfiable Subsets

  These are the architectural conflicts where satisfying one requirement appears to violate another, given current information theory and neurobiology. A successful theory must resolve these tensions, not ignore them.

  **Tension A: The Precision-Stability-Plasticity Triangle**
  *   **Conflict:** Satisfying **Req 1 (Fault Tolerance)** and **Req 3 (Local Self-Modification)** simultaneously threatens **Req 2 (Digital Logic)**.
  *   **The Problem:** To allow local self-modification (plasticity) in a noisy system (fault tolerance), weights must be fluid. However, if weights are too fluid, discrete logical states (digital inference) cannot be maintained stably. If weights are rigid enough for logic, they cannot adapt locally without catastrophic forgetting.
  *   **Theoretical Gap:** Most models sacrifice Plasticity for Stability (trained networks are static) or Stability for Precision (digital logic gates).

  **Tension B: The Redundancy-Degeneracy Paradox**
  *   **Conflict:** Satisfying **Req 1 (No Redundant Backup)** conflicts with standard engineering solutions for **Req 4 (Reliability)**.
  *   **The Problem:** In distributed systems, reliability under node failure is usually solved by redundancy (replicating state). The brain explicitly *does not* do this (neurons are not cloned). It uses *degeneracy* (structurally different elements performing the same function).
  *   **Theoretical Gap:** Modeling degeneracy is computationally expensive and difficult to formalize compared to modeling redundancy. Theories that assume "population coding" often sneak redundancy back in under a different name, violating the strict "no backup scheme" constraint.

  **Tension C: The Global-Local Credit Assignment**
  *   **Conflict:** Satisfying **Req 3 (Local Learning)** conflicts with **Req 2 (Verifiable Inference)**.
  *   **The Problem:** To verify an inference (logic), you need to know if the output is correct. To know if the output is correct, you need a global error signal. To learn locally, you cannot have a global signal.
  *   **Theoretical Gap:** How does a neuron know its contribution to a global error without being told? This is the "Credit Assignment Problem." Solutions usually require biologically implausible mechanisms (e.g., symmetric feedback weights).

  ---

  ## 4. Brief Assessment of Current Frameworks

  *   **Mainstream Connectionism (Deep Learning):**
      *   *Fails:* **Req 1** (brittle to noise/weight perturbation), **Req 3** (requires global backpropagation and offline training), **Req 4** (energy inefficient).
      *   *Passes:* **Req 2** (handles analog inputs well), **Req 6** (can model temporal dynamics).
      *   *Verdict:* Functionally powerful but architecturally divergent from biological constraints.

  *   **Symbolic Cognitive Architectures (GOFAI):**
      *   *Fails:* **Req 1** (brittle; symbol grounding problem), **Req 3** (rules are hand-coded, not self-modifying), **Req 2** (cannot handle analog noise without pre-processing).
      *   *Passes:* **Req 5** (explicit semantics), **Req 2** (excellent at discrete inference).
      *   *Verdict:* Captures the "logic" but fails the "substrate."

  *   **Predictive Processing (Free Energy Principle):**
      *   *Fails:* **Req 3** (exact implementation of gradient descent on free energy is debated biologically), **Req 1** (often assumes optimal coding which is fragile).
      *   *Passes:* **Req 2** (unifies analog prediction errors with discrete model updates), **Req 5** (semantics emerge from prediction), **Req 6** (temporal dynamics are central).
      *   *Verdict:* Strongest conceptual fit, but lacks a concrete mechanism for the *implementation* of the learning rules.

  ---

  ## 5. The Exclusionary Requirement

  **The Single Requirement:**
  **Requirement 1: The Von Neumann Reliability Constraint (Graceful degradation under partial node failure without invoking a global orchestrator or redundant backup scheme).**

  **Justification for Exclusion:**
  This requirement excludes the greatest number of popular current theories because it fundamentally contradicts the **assumption of precise state** underlying almost all computational modeling.

  1.  **Excludes Classical Digital Computation:** Standard Turing-machine models and symbolic architectures assume reliable gates. If a bit flips, the computation is corrupted. They rely on error-correcting codes (redundancy) to fix this. The brain achieves reliability *without* this overhead. Any theory that models neurons as reliable logic gates fails this spec.
  2.  **Excludes Standard Deep Learning:** While neural nets are robust to *some* noise, they rely on precise weight configurations arrived at via global optimization. They do not degrade *gracefully* in the biological sense; they often suffer catastrophic performance drops with significant weight pruning or noise injection unless specifically regularized (which implies an external orchestrator). Furthermore, they rely on *redundancy* in parameters (over-parameterization) to generalize, which violates the "no redundant backup scheme" spirit of biological degeneracy.
  3.  **Excludes Localist Representation Theories:** Theories positing "grandmother cells" (specific neurons for specific concepts) fail immediately. If that node fails, the concept is lost. This violates graceful degradation.

  **Why this is the critical bottleneck:**
  Von Neumann identified that the brain uses a **statistical message** rather than a **digital message**. Most contemporary theories try to force the brain into a digital paradigm (spikes as bits) or a purely statistical paradigm (spikes as noise). The requirement demands a theory explain how a system built of unreliable, non-redundant, locally-modifying components creates a *logically stable* reality. This is the "Holy Grail" of neuro-computation. Any theory that assumes a central controller, a global clock, or precise synaptic weights is, by this specification, architecturally invalid.
