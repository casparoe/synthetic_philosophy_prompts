answer: |-
  My dear friend, I received your letter with great interest, for the question you pose strikes at the very heart of the moral and economic philosophy you seek to weave into your novel. You ask whether Adam Smith would find a meaningful moral distinction in the absence of direct political domination when compared to the contractual extractive regimes you describe, and I suspect his answer would be far less comforting to the modern architect of such treaties than they might hope. Smith was a man who looked beneath the surface of institutions to examine the incentives that governed human behavior, and he was deeply skeptical of the merchant class whenever it acquired power beyond the mere exchange of goods. When he wrote of the East India Company, his criticism was not solely that it ruled territories, but that it ruled them as merchants rather than as sovereigns, prioritizing profit over justice and treating the populace as instruments of revenue rather than as subjects entitled to protection. In your modern configuration, where multinational entities secure century-long rights through treaties that supersede local tax authority, Smith would likely recognize a familiar ghost wearing a new mask. He would argue that the absence of a crown does not absolve the system of imperial character if the economic effect remains the drainage of wealth from the periphery to the center without the reciprocal development of the host nation.

  You wonder if the mask of voluntary contract would deceive him, but I believe Smith was too astute an observer of human nature to be fooled by legal formalities where power was so radically unequal. He understood that a contract entered into under the duress of necessity, or by a party lacking the capacity to refuse due to the overwhelming leverage of the counterparty, lacks the moral force of true voluntary exchange. In the regions you mention, those that achieved nominal sovereignty only in the mid-twentieth century, the capacity to develop domestic manufacturing or to refuse unfavorable terms is often stifled by the very structure of the global market. Smith argued consistently that the interest of the merchants is never the same as the interest of the public, and when merchants secure the power to write the laws of trade through bilateral treaties, they are effectively legislating in their own favor. He would see these zones of economic exception not as triumphs of free trade, which he championed, but as modern chartered monopolies that restrict the natural liberty of the local population to employ their capital and labor as they see fit. The extraction of lithium and cobalt under such conditions would remind him of the spice trades of the East, where the value was stripped from the land and the people were left with neither the wealth nor the industrial capacity to improve their own condition.

  Furthermore, Smith placed a heavy emphasis on the moral sentiments that should govern a just society, guided by the impartial spectator who views actions without bias. If this spectator were to observe a arrangement where a foreign entity extracts vital resources for a century while the host nation is barred from taxing the proceeds or building upon the value chain, I doubt they would approve. Smith believed that wealth was not merely the accumulation of gold or resources but the annual produce of the land and labor of the society, and any system that inhibits the productive powers of labor in favor of rent-seeking extraction is fundamentally flawed. He would likely argue that this new form of empire is indeed more insidious precisely because it lacks the accountability of a sovereign power. A crown might be shamed into benevolence or checked by rival powers, but a corporation bound only by the fiduciary duty to shareholders has no such moral constraint. The suppression of domestic manufacturing capacity would be particularly galling to him, as he viewed the development of industry as essential to the wealth and independence of a nation. To keep a sovereign nation in a state of permanent raw material dependency through the fine print of a treaty would strike him as a violation of the natural order of economic progress.

  Ultimately, I suspect Smith would tell you that the form of domination matters less than its substance. If the result is that the labor of one nation is systematically undervalued to enrich the capitalists of another, and if the political sovereignty of the host is rendered hollow by economic treaties they cannot renegotiate, then the empire persists regardless of the flag that flies over the capital. He would see the voluntary contract as a fiction if the alternatives are starvation or stagnation. In your novel, you would do well to have your imagined Smith point out that true free trade requires equality of standing, and where that equality is absent, the language of contract is merely the language of force translated into legalese. He would warn that such arrangements sow the seeds of future resentment and instability, for no people will indefinitely accept a position of permanent inferiority disguised as partnership. The moral distinction you ask about would, in his eyes, be negligible, for the injury to the justice and economic potential of the colony remains the same whether the hand that inflicts it wears a glove of silk or iron. I hope these reflections serve your work well, for it is a timely exploration of old ghosts in new machines. I remain, as ever, your devoted correspondent.
