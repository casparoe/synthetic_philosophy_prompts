  # Diagnostic Instrument: Tacit Accounts of Corruption

  **Instructions:** Read each node aloud. Choose the option that best reflects your judgment of the case or claim presented. Follow the arrow to the next node or to a final Leaf. Do not worry about theoretical labels; answer based on your intuition about the specific scenario.

  ### Node 1: The Speed Money Case
  *A firm pays a clerk to process a permit it is legally owed, within the statutory deadline, when clerks routinely delay by months otherwise.*
  **Claim:** "This payment is not corruption; it is a rational fix for a broken system."
  *   **(A) Agree.** → **Leaf M**
  *   **(B) Disagree.** → Go to Node 2.

  ### Node 2: The Influence Case
  *A firm lobbies successfully, fully lawfully and without payment, for a rule written to favour its own technology. Separately, a company donates a dataset to a city that foreseeably improves the donor's ranking in contract awards, without any conditional deal.*
  **Claim:** "Securing a favorable public decision without a specific promise of reward is corruption."
  *   **(A) Disagree (Needs a deal).** → Go to Node 3.
  *   **(B) Agree (Influence is enough).** → Go to Node 9.

  ### Node 3: The Gift Case
  *A village elder presents a goat to a district officer in a region where refusing a gift is a grave insult; the officer accepts, and no favour is requested or given.*
  **Claim:** "If the local community regards this as polite, it cannot be corruption."
  *   **(A) Agree.** → Go to Node 4.
  *   **(B) Disagree.** → Go to Node 6.

  ### Node 4: The Adapted Norms Claim
  **Claim:** "Even if the community accepts a practice, their norms are an unreliable standard if those norms formed because people learned to expect theft."
  *   **(A) Agree (Norms can be corrupted).** → Go to Node 10.
  *   **(B) Disagree (Norms are decisive).** → Go to Node 5.

  ### Node 5: The Solidarity Case
  *A mayor awards contracts preferentially to firms that hire from her own ethnic community, understanding herself to be discharging obligations of solidarity rather than enriching herself.*
  **Claim:** "Discharging obligations to one's own group is a valid duty, not a corruption of office."
  *   **(A) Agree.** → **Leaf N**
  *   **(B) Disagree.** → **Leaf P**

  ### Node 6: The Principal Claim
  **Claim:** "Corruption requires betraying a specific employer or citizen who entrusted you."
  *   **(A) Agree.** → **Leaf PA**
  *   **(B) Disagree.** → Go to Node 7.

  ### Node 7: The Source of Wrong Claim
  **Claim:** "The act is wrong primarily because it violates a written rule, not because of what the office represents."
  *   **(A) Agree.** → **Leaf L**
  *   **(B) Disagree.** → Go to Node 8.

  ### Node 8: The Merit Case
  *A public manager hires her cousin, who is in fact the best-qualified applicant, and would have hired him anyway.*
  **Claim:** "Hiring a relative is corruption even if they are the best candidate."
  *   **(A) Agree.** → **Leaf O**
  *   **(B) Disagree.** → **Leaf I**

  ### Node 9: The Independence Case
  *New Case: A regulator leaves office and immediately joins the firm they regulated, with no prior deal made.*
  **Claim:** "An official is corrupted if they become dependent on future private employment, even without a deal."
  *   **(A) Agree.** → **Leaf R**
  *   **(B) Disagree.** → Go to Node 10.

  ### Node 10: The Harm Case
  *A triage nurse moves up a patient whose family sends a basket of fruit, in a queue that is formally first-come-first-served.*
  **Claim:** "This is only corruption if the patient who was moved down actually suffers medical harm."
  *   **(A) Agree.** → **Leaf H**
  *   **(B) Disagree.** → Go to Node 11.

  ### Node 11: The System Case
  *New Case: A teacher demands payment to grade exams, but without it, the school closes and no one learns.*
  **Claim:** "Blaming the teacher is wrong; the phenomenon is a system equilibrium, not individual deviance."
  *   **(A) Agree.** → **Leaf S**
  *   **(B) Disagree.** → **Leaf I** (Public Interest)

  ### Node 12: The External Standard Case
  *An international NGO requires its local partner organisations to adopt a zero-gifts policy, including refusing customary hospitality from village hosts.*
  **Claim:** "Outside standards should override local hospitality customs."
  *   **(A) Agree.** → **Leaf H**
  *   **(B) Disagree.** → **Leaf P**

  *(Note: Nodes 10, 11, and 12 interact to separate Harm-Universalist, Structural, and Public Interest/Particularist overlaps.)*

  ---

  ## Key to Leaves

  **Leaf M (Market-Centered)**
  *   **Awkward Commitment:** Must accept that efficiency gains from rule-breaking justify the act.
  *   **Answer Pattern:** Node 1(A).
  *   **Absurd Case:** Case 1 (Speed Money): Yields "Not Corruption," which many find cynical.

  **Leaf PA (Principal-Agent)**
  *   **Awkward Commitment:** Cannot condemn lobbying without a specific bribe or betrayed boss.
  *   **Answer Pattern:** Node 1(B) → 2(A) → 6(A).
  *   **Absurd Case:** Case 5 (Lobbying): Yields "Not Corruption," ignoring systemic distortion.

  **Leaf L (Legalist)**
  *   **Awkward Commitment:** Must accept that a legal act cannot be corrupt, even if it ruins public trust.
  *   **Answer Pattern:** Node 1(B) → 2(A) → 6(B) → 7(A).
  *   **Absurd Case:** Case 5 (Lobbying): Yields "Not Corruption" solely because it was lawful.

  **Leaf O (Public-Office-Centered)**
  *   **Awkward Commitment:** Must condemn acts that produce good outcomes if they violate procedural integrity.
  *   **Answer Pattern:** Node 1(B) → 2(A) → 6(B) → 7(B) → 8(A).
  *   **Absurd Case:** Case 2 (Cousin): Yields "Corruption" despite the cousin being the best candidate.

  **Leaf I (Public-Interest-Centered)**
  *   **Awkward Commitment:** Must accept that rule-breaking is permissible if it serves the greater good.
  *   **Answer Pattern:** Node 1(B) → 2(A) → 6(B) → 7(B) → 8(B) [or Node 11(B)].
  *   **Absurd Case:** Case 2 (Cousin): Yields "Not Corruption," undermining procedural fairness.

  **Leaf H (Harm-Based Universalist)**
  *   **Awkward Commitment:** Must apply external harm standards even when local norms disagree.
  *   **Answer Pattern:** Node 1(B) → 2(B) → 10(A) [or Node 12(A)].
  *   **Absurd Case:** Case 3 (Goat): Yields "Corruption" despite no harm and local approval.

  **Leaf P (Particularist / Social Norms)**
  *   **Awkward Commitment:** Must accept that corruption is impossible if the local public perceives the act as white/grey.
  *   **Answer Pattern:** Node 1(B) → 3(A) → 4(B) → 5(B) [or Node 12(B)].
  *   **Absurd Case:** Case 7 (NGO): Yields "Wrong to impose rules," even if local norms enable theft.

  **Leaf N (Neo-Patrimonial)**
  *   **Awkward Commitment:** Must accept that "corruption" is a category error when applied to clientelist states.
  *   **Answer Pattern:** Node 1(B) → 3(A) → 4(B) → 5(A).
  *   **Absurd Case:** Case 8 (Ethnic): Yields "Not Corruption," which universalists find morally dangerous.

  **Leaf R (Republican)**
  *   **Awkward Commitment:** Focuses on domination/dependence rather than theft or harm.
  *   **Answer Pattern:** Node 1(B) → 2(B) → 9(A).
  *   **Absurd Case:** Case 4 (Data): Yields "Corruption" despite no money changing hands and improved city data.

  **Leaf S (Structural / Collective Action)**
  *   **Awkward Commitment:** Individual blame is misplaced; the phenomenon is an equilibrium.
  *   **Answer Pattern:** Node 1(B) → ... → Node 11(A).
  *   **Absurd Case:** Case 6 (Fruit): Yields "Don't blame the nurse," which frustrates accountability seekers.

  ---

  ## Unoccupied and Unseparated Cells

  **Unoccupied Combinations**
  1.  **The "Legalist Particularist":** A position claiming an act is only corruption if it breaks *local* law, but *local* norms override law.
      *   *Status:* **Incoherent.** If norms override law, the law is not the standard; if law is the standard, norms cannot override it.
  2.  **The "Harm-Based Neo-Patrimonial":** A position claiming clientelism is a different order of rule (not corruption), but also that it must be judged by universal harm standards.
      *   *Status:* **Unattractive.** It claims immunity from the label "corruption" while submitting to the moral standard that generates the label.

  **Unseparated Pairs**
  1.  **Leaf I (Public Interest) & Leaf S (Structural):**
      *   *Coincide on:* Case 11 (System Survival). Both may excuse the teacher.
      *   *Extra Question:* "Is the teacher morally excused, or is the concept of moral blame itself inapplicable?"
  2.  **Leaf H (Harm-Universalist) & Leaf R (Republican):**
      *   *Coincide on:* Case 9 (Revolving Door). Both may condemn it.
      *   *Extra Question:* "Is the wrong that the public loses money (Harm), or that the official becomes a dependent (Republican)?"
  3.  **Leaf P (Particularist) & Leaf N (Neo-Patrimonial):**
      *   *Coincide on:* Case 8 (Ethnic). Both may excuse the mayor.
      *   *Extra Question:* "Is this a valid moral exception within a bureaucratic state (Particularist), or is the state itself fundamentally non-bureaucratic (Neo-patrimonial)?"

  ---

  ## Scoring Note

  **Profile vs. Leaf:**
  This instrument should return a **profile**, not a single leaf. Well-read non-specialists often hold hybrid views (e.g., Universalist on lobbying, Particularist on gifts). Inconsistency is expected and theoretically informative.

  **The Universalist/Particularist Tension:**
  It is **coherent** to reach a universalist verdict on the lobbying (Case 5) and mayor (Case 8) cases while reaching a particularist verdict on the goat (Case 3) and hospitality (Case 7) cases. This reflects a "threshold" view: market/state distortions require universal rules, while interpersonal reciprocity remains context-dependent. If the instrument forces a single leaf, it artificially purifies the reader's tacit theory. Use the profile to identify where the reader draws the boundary between "public transaction" and "social relation."
