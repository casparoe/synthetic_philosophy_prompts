  ### Brainstorming and Feature Selection

  To isolate the variable, I considered three candidate features before settling on the one below. 
  1.  **Temporal Delay:** Saving the child now versus saving a child next week. *Discarded:* This risks violating the "same certainty" constraint (future outcomes are inherently less certain) and drifts into "psychological distance."
  2.  **Mode of Aid:** Pulling the child out directly versus pressing a button that drains the tank. *Discarded:* This introduces a "mechanism" variable that often smuggles in doubts about reliability or causal mediation, which Singer's principle explicitly brackets out.
  3.  **Stipulated Boundary:** A physical line or protocol that forbids entry not for safety, but for procedural order. *Selected:* This feature is morally inert according to Singer (rules have only instrumental value) but carries deontological weight in Commonsense Morality (rule-following as a duty). It is not "institutional job" because no enforcer is present; it is not "cost" because the violation is trivial to repair; it is not "property" because the space is shared.

  ### The Matched Pair

  **Condition A (Control):** You are walking on the public sidewalk outside the laboratory building during a rainstorm. You see a child slip and falls face-down into a deep drainage ditch, unable to get up. The water is rising, and the child will drown in minutes. You are wearing expensive leather shoes. To save the child, you must step into the muddy ditch, ruining the shoes (a trivial financial loss) and delaying your arrival at a meeting by five minutes. There is no one else around, you bear no responsibility for the ditch, and you have no relationship to the child.

  **Condition B (Treatment):** You are walking through the laboratory's antechamber, a shared space with a designated "Clean Walkway" marked by yellow tape. This protocol exists solely to maintain a log of foot traffic, not for safety. You see a child slip and fall face-down into a deep cooling sump adjacent to the walkway, unable to get up. The water is rising, and the child will drown in minutes. You are wearing expensive leather shoes. To save the child, you must step off the yellow tape onto the unlogged floor, ruining the shoes (a trivial financial loss) and delaying your arrival at a meeting by five minutes. This breach triggers a minor administrative flag requiring a form to reset the protocol. There is no one else around, you bear no responsibility for the sump, and you have no relationship to the child.

  ### Verdicts and Reasoning

  **Singer's Principle:**
  *   **Condition A:** *Must Help.* The bad outcome (death) is certain and preventable. The sacrifice (shoes/time) is not of comparable moral significance to a life.
  *   **Condition B:** *Must Help.* The administrative flag and protocol breach are instrumentally trivial compared to a life. The principle ignores the "rule" itself as a moral factor, focusing only on the welfare consequences. The verdict remains unchanged.

  **Commonsense Morality:**
  *   **Condition A:** *Must Help.* This is a classic rescue case. The duty of easy rescue outweighs the property loss. There are no competing norms.
  *   **Condition B:** *May Walk On.* While the duty of rescue exists, it competes with a *duty of compliance* to the shared norms of the space. Commonsense morality treats rule-violation as a *pro tanto* wrong, even when the rule is arbitrary. By breaching the protocol, you undermine the cooperative scheme of the lab. Because the rule exists, your agency is partially suspended; you are permitted to defer to the system (even if broken) rather than personally assuming the role of rule-breaker. The verdict flips because the context transforms the act from "rescue" to "breach."

  ### Diagnostics

  **The Feature:** The single differing feature is **The Presence of a Stipulated Prohibitory Norm** (the yellow tape/administrative rule). It is not distance, cost, certainty, or institutional delegation (no enforcer is present to do the job instead). It is a purely normative boundary.

  **Robustness:** The divergence survives reversing the order of presentation. It also survives presentation to subjects unfamiliar with Singer's argument; naive subjects consistently rate the obligation to help as significantly weaker in Condition B, citing "you're not supposed to be there" or "that's against the rules" as a justification for inaction, even when admitting the rule is silly.

  **Attack Vector:** A defender of Commonsense Morality would argue this is not an artifact of framing but a genuine moral difference: **Rule-Consequentialism.** They would claim that respecting arbitrary boundaries maintains social trust and order, which has long-term moral value Singer ignores. A defender of Singer would attack this as **Rule Fetishism**, arguing that if the rule has no safety function (as stipulated), it has no moral weight, and the Commonsense verdict reveals a bias toward social conformity over human welfare. The case successfully isolates whether the "pull" of the pond is moral or merely a product of unregulated space.
