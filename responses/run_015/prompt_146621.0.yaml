      *Revised Verdict:* The moral rot taints the origin, but time creates a new function. The prescription holds *unless* the removal can be done without destroying the partnership. The burden of proof is on the teardown, not the wall.

      *Wait, let's look closer at the prompt:* "does the moral rot of the origin kill the prescription?"
