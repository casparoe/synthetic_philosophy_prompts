answer: |-
  Here is the definitive stance you need for your novel.

  **The Split: Epistemology vs. Ontology**
  Chesterton and Burke do not collapse into one another; they diverge fundamentally on *what tradition is*.

  Chesterton's Fence is **epistemic**. It is a rule of knowledge. It says: "You do not know enough to act." It is a temporary stop-sign. Once you discover the reason for the fence, Chesterton's authority evaporates. If you find out the fence was built to keep slaves in, Chesterton hands you the sledgehammer. He is a reformer's tool for caution, not a metaphysical claim about the wall itself.

  Burke's prescription is **ontological**. It is a claim about existence. The wall is not a puzzle to be solved; it is a member of the partnership. For Burke, the wall exists as a physical manifestation of the "contract between the dead, the living, and the unborn." Its value is not in the *intent* of the builder, but in its *integration* into the life of the community over time.

  **The Verdict on Unjust Origins**
  For your caretaker's argument to hold the weight you want, you must take the Burkean view: **The moral rot of the origin does not automatically kill the prescription.**

  Here is why this works for your story: In a Burkean framework, an object acquires meaning through *duration* and *usage*, detaching from the specific intent of the founder. If the wall has stood for two hundred years, it is no longer just a tool of exclusion; it has become the boundary that defined the garden, the road, the property lines, and the rhythm of life for ten subsequent generations who had nothing to do with the original sin.

  If the caretaker argues from Chesterton, she loses the moment the protagonist finds the old deed showing the wall was built to segregate. Chesterton says, "Reason found; fence goes."

  If the caretaker argues from Burke, she can look the protagonist in the eye and say: *"I don't care why they laid the first stone. I care that my grandfather walked this line, and his father before him, and that tearing it down doesn't fix the past, it just breaks the ground we stand on now."*

  **The Coherent Stance for Your Caretaker**
  Your caretaker is not defending the *injustice*. She is defending the *continuity*.

  She views the wall as a scar tissue. A scar might have formed from a wound that was inflicted maliciously, but the scar itself is now the thing holding the skin together. To cut out the scar because of how it formed is to risk opening the wound again. The wall is a "continuing argument" because it forces the living to reckon with the physical reality of the past, rather than erasing it to suit present comforts.

  **How to Write This**
  Do not let her deny the wall's ugly origin. That makes her a villain. Let her acknowledge the rot, but argue that *removal* is an act of arrogance that assumes the living know better than the accumulated weight of time.

  **Sample Dialogue Logic:**
  > "You think this wall is a question," she said, running a hand over the mossy stone. "You think if we find the answer, we can knock it down. That's Chesterton. That's for young men who think history is a riddle."
  >
  > "And you?" I asked.
  >
  > "I know it's a vote," she said. "The dead voted for this boundary. Not because they were right, but because they were here. You tear it down, you aren't fixing their mistake. You're just telling the next generation that their boundaries don't matter either. The wall stays. Not because it's good. But because it's ours."

  **Summary for your notes:**
  1.  **Chesterton** = Caution based on ignorance. (Reason found = Authority lost).
  2.  **Burke** = Authority based on inheritance. (Reason found = Irrelevant to current function).
  3.  **Unjust Origin** = Does not invalidate the structure if the structure now supports the living.
  4.  **Caretker's Motivation** = Preservation of the "partnership," not preservation of the "sin."

  This gives you a character who is stubborn but philosophically grounded, not just bigoted. She is protecting the *conversation* between generations, even when the conversation is painful.
