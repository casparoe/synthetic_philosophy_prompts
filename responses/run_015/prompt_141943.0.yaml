      *   Move 5: Clearly Right (identifies the real moral friction).
      *   Move 6: Right (pragmatic compromise).
      *   *Self-Correction on Ratings:* Avoid "Clearly Mistaken" unless they make a factual error. These are philosophical positions. Most are "Defensible/Right within framework." Move 5 is the strongest "Right" because it points out a factual moral intuition that binary systems struggle with.

  7.  **Final Polish:** Check the "What are they missing" section. Ensure I address the user's intuition that they are answering different questions.
      *   Andre: Moral Accounting (How much do I owe?).
      *   Lena: Moral Categorization (What kind of act is this?).
