      *   *Tone:* Analytical, philosophical, neutral but decisive.
      *   *Key Concepts to weave in:* Doctrine of Doing and Allowing (DDA), Normative vs. Causal responsibility, Residual obligations, Trolley Problem variants.

  6.  **Refining the Ratings:**
