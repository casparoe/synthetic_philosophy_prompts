      *   **Difference:** It introduces *Historical Responsibility* without *Historical Wrongdoing*.
      *   **What they are missing:** They are arguing about *Classification* (Killing vs. Letting Die) when the real moral weight lies in *Special Obligations* generated by causal history. The binary label matters less than the specific duties (warn, compensate, mitigate). They are also ignoring the *Time* element (5 years ago). Does responsibility fade?
      *   **Different Questions:** Andre is asking about *Degrees of Obligation* (Move 5). Lena is asking about *Moral Classification/Liability* (Move 2/4).

  5.  **Drafting the Response:**
