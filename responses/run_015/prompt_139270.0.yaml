  4. Diagnostically, this is a mixture of substantive metaphysics and empirical psychology, yet your hypothesis cannot dissolve the stalemate because externalists will maintain that reasons persist even if psychology proves motivationally rigid.
  5. Progress requires a conceptual distinction between reasons-for-deliberation and reasons-for-assessment, because empirical findings cannot adjudicate whether normativity survives when motivation is impossible.
