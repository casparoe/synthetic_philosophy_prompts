      *   *On Tokenization:* This is interesting. The field linguist had "Gavagai" (a whole utterance linked to a stimulus). The LLM has "rab" (a fragment linked to other fragments). The link to the *world* (the rabbit running by) is even more distant. It's text-to-text, not stimulus-to-text.
      *   *Inscrutability of Reference:* The vector for "rabbit" might be close to "hare" or "food." The model doesn't know the difference between a rabbit and a rabbit-stage unless the *usage* distinguishes them. If the corpus is ambiguous, the vector is ambiguous.
      *   *New Underdetermination?* Yes. The field linguist could point. The LLM cannot point. It only predicts. This removes the ostensive link entirely. It makes reference *more* inscrutable, not less.
      *   *Conclusion:* Quine would likely say this confirms his thesis. The "black box" of the neural net is just a complex manual of translation. There is no fact of the matter inside the weights about whether it means "rabbit" or "undetached rabbit part."

