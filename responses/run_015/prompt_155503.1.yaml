      *   *The Space of Appearance:* Politics happens *between* people in speech and action. It requires a common world.
      *   *Factual Truth:* Relies on witnesses, testimony, records. It is "opinion-like" in that it could have been otherwise, but once it happened, it is stubborn.
      *   *The Liar:* The traditional liar knows the truth and hides it. The organized liar (totalitarian/ideological) changes the truth itself.
      *   *Defactualization:* Arendt uses this term. It's the process of making facts irrelevant.
      *   *Bureaucracy/Rule by Nobody:* Arendt writes about this in *On Violence* and *The Human Condition*. Bureaucracy obscures responsibility and makes reality abstract.
      *   *The "Gap":* The user identifies a gap between "lying" (saying false things) and "fragility" (facts needing witnesses). The gap is *structural silence* or *categorial exclusion*.

  3.  **Addressing Question 1: Shared World of Appearance vs. Vulnerability of Factual Truth.**

      *   *Connection:* The "world" is what lies *between* us (inter-est). Factual truths anchor this world. If I say "I saw X" and you say "I saw X," we share a world.
      *   *Vulnerability:* Unlike rational truths (which force assent), factual truths need *people* to uphold them. If witnesses are silenced, bribed, or made to feel irrelevant, the fact disappears from the public realm.
      *   *Appearance:* Facts must *appear* in public to be politically real. If they are kept in the dark (private) or excluded from the "language of politics," they don't appear.
      *   *Synthesis:* The shared world depends on the *plurality* of witnesses. Vulnerability arises because plurality can be manipulated not just by force, but by reorganizing the space where appearance happens.

  4.  **Addressing Question 2: Bureaucratic Omission – Lying or Defactualization?**

      *   *Traditional Lying:* Requires intent to deceive and an assertion of falsehood.
      *   *Omission:* No assertion. Just silence or categorial blindness.
      *   *Arendt's View:* Arendt distinguishes between the "traditional liar" and the "modern image-maker" or ideological liar. But bureaucratic omission goes deeper. It's akin to what she calls "rule by nobody."
      *   *Defactualization:* This is the stronger term. It's not just hiding a fact; it's destroying the *context* in which the fact makes sense. If the vocabulary doesn't exist to name the suffering, the suffering is politically non-existent.
      *   *Verdict:* It is *more* fundamental than lying. Lying acknowledges the truth it hides. Omission/Defactualization pretends the truth *category* doesn't exist. It attacks the *condition* of truth-telling, not just the content.

  5.  **Addressing Question 3: Can Omission Destroy Common Reality?**

      *   *Yes.* Politics requires a common ground. If the ground is selectively paved so certain things sink through the cracks, the "common" world becomes fragmented.
      *   *Mechanism:* It isolates witnesses. If I witness something but the official language says "that is not a reportable event," I am alienated from the public world. My testimony becomes "noise," not "data."
