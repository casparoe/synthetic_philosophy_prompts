answer: |-
  You have identified a crucial and often under-examined fissure in Arendt's political epistemology. The tension you describe lies between the *ontological fragility* of factual truth (which requires witnesses to exist in the public realm) and the *political aggression* of organized deception (which seeks to remake reality). Your specific focus on "bureaucratic omission"—where facts are not denied but rendered categorially invisible—pushes Arendt's framework to its limit. It suggests a mode of power that operates not by contradicting the truth, but by dismantling the stage upon which truth appears.

  To answer your questions, we must trace the dependency between testimony, appearance, and institutional framing in Arendt's thought, and determine where structural omission fits within her taxonomy of deception.

  ### 1. Factual Truth and the Space of Appearance

  To understand why omission is so destructive, we must first recall why Arendt considers factual truth uniquely vulnerable. In "Truth and Politics," she distinguishes between **rational truths** (mathematical, philosophical) and **factual truths** (events that happened). Rational truths carry their own evidence; 2+2=4 compels assent regardless of human opinion. Factual truths, however, are contingent. They "could have been otherwise." Because they are contingent, they do not force themselves upon us; they must be *told*.

  This is where the **space of appearance** becomes essential. For Arendt, a fact is not politically real until it appears in the public realm through speech and action. A fact existing only in private memory is not yet a "public fact." It requires **testimony** to bridge the gap between the event and the world. This testimony relies on **plurality**: witnesses must speak, others must listen, and records must be kept.

  The vulnerability arises here: because factual truth depends on human testimony, it depends on the *integrity of the public space*. If the public space is corrupted, the fact loses its footing. Arendt writes that factual truth "always relates to other people... it is political by nature." Therefore, the fragility of factual truth is not just that it can be lied about, but that it can be *isolated*. If the witnesses are silenced, bribed, or made to feel that their testimony is irrelevant, the fact ceases to exist politically, even if it remains ontologically true.

  ### 2. The Lie vs. Structural Omission

  You ask whether bureaucratic omission counts as lying in Arendt's framework. To answer this, we must look at how Arendt defines the political liar.

  For Arendt, the **traditional liar** knows the truth and intentionally hides it. Paradoxically, the traditional liar respects the truth; they acknowledge its power by trying to suppress it. The lie is a negation of a specific fact ("I did not do this," when I did).

  **Bureaucratic omission**, as you describe it, operates differently. It does not assert a falsehood. It asserts nothing. It functions by controlling the **vocabulary of relevance**. In a bureaucratic system, reality is mediated through categories, forms, and reports. If a phenomenon (e.g., civilian suffering, environmental degradation, systemic bias) does not fit into an existing category, it cannot be recorded. If it cannot be recorded, it cannot be testified to within the system.

  In Arendt's terms, this is not merely lying; it is **defactualization**.

  In "Truth and Politics," Arendt warns of a modern form of deception that goes beyond the traditional lie. She observes that when ideology or bureaucracy takes over, the goal is not just to hide specific facts, but to destroy the "factuality of facts." Organized lying aims to replace reality with a consistent fiction. However, bureaucratic omission is even more insidious because it does not require the energy of maintaining a fiction. It simply allows reality to drain away through the cracks of administration.

  This omission reveals a mode of defactualization that operates **prior to falsehood**. A lie engages in a duel with the truth; omission dissolves the arena where the duel could take place. If the institutional language lacks the words to name a suffering, the suffering cannot appear. It is not disputed; it is **administratively unthinkable**.

  ### 3. Testimony, Framing, and the Destruction of Common Reality

  This leads to your final question: Can an omission that asserts no untruth still destroy the common reality that makes politics possible?

  Arendt's answer would be an emphatic yes. The common reality (the *sensus communis*) is not a static backdrop; it is woven continuously through the exchange of opinions and facts among a plurality of people. This weaving requires a shared language and shared institutions of recognition.

  When bureaucratic omission occurs, it severs the link between **testimony** and **appearance**.
  1.  **The Witness is Alienated:** If I witness an event but the institutional framework provides no channel to report it (no category, no form, no hearing), my testimony becomes private noise. I am cut off from the public world.
  2.  **The Public is Blinded:** The public relies on institutions to curate what appears. If the institution filters out certain facts structurally, the public perceives a truncated reality.
  3.  **The Common World Fragments:** Politics requires that we dwell in the same world. If my reality includes a fact that your administrative vocabulary excludes, we no longer share a world. We are speaking past one another.

  Arendt argues that the "ideal subject of totalitarian rule is not the convinced Nazi or Communist, but people for whom the distinction between fact and fiction... no longer exists." Bureaucratic omission achieves a similar end without necessarily requiring totalitarian terror. It creates a citizenry for whom certain facts *do not exist* because they never appear in the official light.

  This is more dangerous than lying because it is harder to resist. You cannot refute a silence. You cannot produce evidence for a category that is forbidden. To fight a lie, you produce the truth. To fight an omission, you must first fight for the **right to name** the truth. You must politicize the vocabulary itself.

  ### Conclusion: Defactualization as Anti-Political

  In Arendt's framework, political action is the capacity to begin something new within a shared world. This requires a stable ground of factual truth upon which to build.

  Bureaucratic omission is not just a "lie of omission" in the moral sense; it is an **ontological attack on the public world**. It exploits the fragility of factual truth (its dependence on testimony) by dismantling the structures that make testimony possible.

  Therefore, this phenomenon counts as a form of **defactualization** that is more fundamental than falsehood.
  *   **Lying** says: "The world is X, not Y."
  *   **Omission** says: "Y cannot be spoken."

  By rendering facts administratively unthinkable, this omission destroys the common reality. It reduces the *res publica* (public thing) to a managed simulation where only pre-approved realities are permitted to appear. For Arendt, this is the end of politics, because politics requires the risk of encountering a reality that we did not create and cannot fully control. When we omit the contingent, painful, or inconvenient facts through structural silence, we attempt to control reality absolutely. In doing so, we lose the world that lies *between* us, leaving only the isolation of the administrator and the silence of the excluded.
