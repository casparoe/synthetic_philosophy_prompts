prompt: |-
  I'm a doctoral student in philosophy of science consulting with a private research foundation that allocates a fixed quarterly budget to high-risk, long-horizon theoretical projects. The board has adopted geometric rationality—specifically Kelly-criterion reasoning—as its normative framework, but it wants the principle translated into an actual decision procedure rather than left as a metaphor. The difficulty is that the returns here are not monetary but epistemic: success is a shift in a credence distribution over competing explanatory frameworks. The probabilities are usually ambiguous rather than point-valued; the taxonomy of possible successes is contested; and some proposals, if funded, redefine the problem space in ways that alter the payoff matrix for every other grant in the portfolio. I need a reusable checklist or flowchart—executable in about twenty minutes per proposal, then aggregable across the portfolio—that makes this translation explicit without assuming stationary environments, cardinal utility, or a pre-specified outcome space.

  Could you construct such a procedure and specify, in order: (1) how to represent a proposal's return profile when the payoff is a change in belief-state rather than a scalar; (2) how to compute or approximate a Kelly fraction when the prior over outcomes is itself disputed, clearly marking which steps are deterministic and which are unavoidable judgment calls; (3) how to update portfolio weights when a funded project changes the dimensions of evaluation, so that the geometric mean is computed over an ensemble whose coordinate system may shift; and (4) how to build in protection against unknown unknowns—what the board calls an ambiguity-aversion constraint—without collapsing into maximin or uniform diversification. The procedure should be honest about where it will misfire.

  Please apply it step-by-step to three hypothetical cases: (a) a proposal with quantifiable intermediate milestones but highly uncertain final theoretical impact; (b) a proposal that promises large information gain but depends on adopting a novel ontology that, if correct, renders the evaluation metrics of other funded projects obsolete; and (c) a proposal for which the board holds a near-uniform prior over a large set of incommensurable success conditions, where a naive geometric-mean calculation would recommend dangerous over-leverage. For each case, show the execution, flag any point where the procedure yields an answer that conflicts with intuitive scientific judgment, and say whether that conflict exposes a limit of geometric rationality in this domain or a failure of intuition.

  I am not asking for citations, a bibliography, or references to specific texts; I need the conceptual machinery laid out precisely enough to defend in a board memo without appealing to authority.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Doctoral student in philosophy of science.
      *   **Client:** Private research foundation.
      *   **Task:** Create a decision procedure based on Geometric Rationality (Kelly Criterion) for allocating budget to high-risk, long-horizon theoretical projects.
      *   **Constraints:**
          *   Returns are epistemic (belief shifts), not monetary.
          *   Probabilities are ambiguous (not point-valued).
          *   Outcome space is contested/shifting.
          *   Projects can redefine the problem space (non-stationary, non-independent).
          *   No cardinal utility, no pre-specified outcome space.
          *   Must be executable (~20 mins/proposal) and aggregable.
          *   Must include ambiguity aversion (without maximin/uniform diversification).
          *   Must be honest about failure modes.
      *   **Deliverables:**
          1.  The Procedure (Checklist/Flowchart logic).
          2.  Step-by-step application to three specific hypothetical cases (a, b, c).
          3.  Analysis of conflicts between procedure output and intuition (limit of theory vs. failure of intuition).
      *   **Style:** Conceptual machinery, precise, defensible in a board memo, no citations/authority appeals.

  2.  **Analyze the Core Tension:**

      *   *Kelly Criterion:* Requires known probabilities, known payoffs, repeated bets, scalar utility (wealth). Maximizes long-run growth rate.
      *   *Epistemic Funding:* Unknown probabilities (ambiguity), vector/tensor payoffs (belief states), one-off or rare bets, utility is complex (truth, understanding, progress).
      *   *The Bridge:* We need to map "wealth growth" to "epistemic utility growth" and "bet size" to "budget allocation." We need to handle ambiguity without freezing (maximin) or ignoring it (naive Kelly).

  3.  **Drafting the Procedure (The "Epistemic Kelly Protocol"):**

      *   *Step 1: Representing Returns (Belief State Change).* Instead of $X, we need $\Delta P(H)$. But utility isn't just $P(H)$. It's expected information gain or reduction in entropy, or perhaps "robustness." Let's use *Expected Log-Likelihood Ratio* or *Entropy Reduction* as the proxy for "growth." Let's settle on **Expected Epistemic Growth (EEG)**: The expected change in the log-score of the community's credence distribution.
      *   *Step 2: Computing the Fraction (Ambiguous Priors).* Kelly formula: $f^* = p - q/b$. Here $p$ is ambiguous. We need a range $[p_{min}, p_{max}]$. Use a *Discounted Kelly* approach. Apply an "Ambiguity Discount Factor" ($\alpha$) based on the spread of the prior.
      *   *Step 3: Portfolio Updates (Shifting Dimensions).* If a project changes the ontology, the "currency" changes. We can't just sum log-wealth. We need a *Base-Rate Anchor*. Treat the portfolio as a basket of "option value." If a project changes the metric, it gets a "Transformation Multiplier."
      *   *Step 4: Ambiguity Aversion.* Not maximin. Use a *Half-Kelly* or *Fractional Kelly* rule driven by the variance of the probability estimate. This creates a buffer against "unknown unknowns."

      *Refining the Procedure for the Prompt's Constraints:*
      *   *Constraint:* No cardinal utility. *Solution:* Use relative scoring rules (logarithmic scoring rule is natural for Kelly).
      *   *Constraint:* 20 mins/exec. *Solution:* Heuristics for the inputs, not full Bayesian modeling.
      *   *Constraint:* Aggregable. *Solution:* Normalize all outputs to a "Budget Share Index."

  4.  **Developing the Four Specific Components:**

      *   *(1) Return Profile:* Define "Epistemic Payoff" ($E$) as the log-ratio of posterior to prior credence in the *most viable* framework, weighted by the probability that the framework is viable. Actually, simpler: Define payoff as "Resolution Potential." High = solves problem. Low = inconclusive. Negative = leads to dead end.
      *   *(2) Kelly Fraction:* Standard Kelly $f = (bp - q)/b$. We don't have $b$ (odds). We have "Impact." Let's approximate $f \propto \frac{\text{Expected Info Gain}}{\text{Variance of Gain}}$. Use a "Confidence-Weighted Expectation."
      *   *(3) Shifting Dimensions:* This is the hardest. If Project B makes Project A's metrics obsolete, Project B has "Meta-Value." We need to assess *Option Value on the Metric System*.
      *   *(4) Ambiguity:* Use an "Ambiguity Penalty" on the probability estimate. $p_{effective} = p_{estimated} - \lambda \cdot \text{spread}$.

  5.  **Drafting the Three Cases:**

      *   *Case A (Milestones/Uncertain Impact):* Standard risk. Kelly should work well here.
      *   *Case B (Ontological Shift):* Non-stationary. Kelly usually fails here because the "game" changes. Need to show how the procedure handles the "Meta-Bet."
      *   *Case C (Uniform Prior/Incommensurable):* Maximum ambiguity. Naive Kelly says bet nothing (log(0) issues) or bet small. Intuition might say "bet something for diversity." Need to show the tension.

  6.  **Refining the Logic (Self-Correction during drafting):**

      *   *Critique:* Kelly assumes reinvestment. Foundation budgets are fixed quarterly.
      *   *Fix:* Treat the quarterly budget as the "bankroll." The "growth" is the long-term reputation/efficacy of the foundation.
      *   *Critique:* Epistemic utility isn't compounding in the same way money is.
      *   *Fix:* Frame it as "Cumulative Understanding." A dead end stops growth. A breakthrough accelerates it.
      *   *Critique:* 20 minutes is very fast for philosophy of science analysis.
      *   *Fix:* The inputs must be qualitative scores converted to parameters, not derived from first principles.
      *   *Key Insight:* The "Geometric Mean" in epistemic space corresponds to the *Logarithmic Scoring Rule*. Maximizing geometric growth of "truth proximity" is equivalent to maximizing expected log score.

  7.  **Finalizing the Procedure Structure:**

      *   **Input:** Proposal Document.
      *   **Step 1: Ontological Stability Check.** (Does it change the game?)
      *   **Step 2: Epistemic Payoff Estimation.** (Log-score improvement).
      *   **Step 3: Probability Interval Elicitation.** (Best/Worst case credence).
      *   **Step 4: Ambiguity-Adjusted Kelly Calculation.** (Fractional Kelly).
      *   **Step 5: Portfolio Correlation & Meta-Impact.** (Adjustment for Case B type issues).
      *   **Output:** Recommended Budget Share.

  8.  **Writing the Response:**

      *   *Tone:* Professional, technical, philosophical but operational.
      *   *Structure:*
          1.  The Protocol (The "Epistemic Kelly Protocol" - EKP).
          2.  Application to Cases A, B, C.
          3.  Conflict Analysis.
      *   *Specific focus:* Ensure the distinction between "risk" (known probs) and "ambiguity" (unknown probs) is handled via the discount factor, not maximin. Ensure the "shifting dimensions" is handled via a "Meta-Weight."

      *(Self-Correction on Case C)*: If priors are uniform over incommensurable outcomes, expected log growth is undefined or negative infinity if one outcome is "catastrophic loss of coherence." The procedure must recommend a minimal "exploration tax" rather than a Kelly bet. I need to make sure the procedure explicitly handles the "zero boundary."

      *(Self-Correction on Case B)*: If a project changes the metrics, you can't compute the geometric mean over the *old* metrics. You have to compute it over the *capacity to generate new metrics*. This is "Second-Order Epistemic Value."

  9.  **Final Polish:** Check against constraints.
      *   No citations? Yes.
      *   20 mins executable? Yes, by using scoring heuristics.
      *   Honest about misfire? Yes, in the "Failure Modes" section.
      *   Defensible in memo? Yes, logic is internal.

      *Let's build the "Epistemic Kelly Protocol" (EKP).*
      *   *Currency:* Epistemic Capital (EC).
      *   *Growth:* Logarithmic increase in resolved uncertainty.
      *   *Kelly Fraction:* $f = \frac{p(b+1) - 1}{b}$. We need to map $p$ and $b$ to epistemic terms.
      *   $p$ = Probability of "Significant Resolution."
      *   $b$ = Odds of Resolution (Ratio of Gain to Loss).
      *   *Ambiguity:* Shrink $p$ towards 0.5 based on disagreement.
      *   *Ontology Shift:* Add a multiplier to $b$.

      *Wait, one nuance:* The prompt asks for "Geometric Rationality" specifically. This implies maximizing the expectation of the logarithm of the outcome. In epistemic terms, this is maximizing the expected log-likelihood of the true hypothesis (or minimizing cross-entropy).
      *   So, the "Payoff" is the Log Score.
      *   The "Bet" is the Budget Allocation.
      *   The "Bankroll" is the Total Research Capacity.

      *Okay, ready to write.*
answer: |-
  # The Epistemic Kelly Protocol (EKP)

  **Purpose:** To allocate fixed quarterly research budgets across high-risk theoretical projects by maximizing the long-run geometric growth rate of *Epistemic Capital* (EC), defined as the foundation's capacity to resolve uncertainty and generate robust explanatory frameworks.

  **Constraints:** Executable in ~20 minutes per proposal; handles ambiguous probabilities and shifting ontologies; avoids maximin paralysis.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Represent the Return Profile (The Epistemic Payoff Matrix)
  *Time allocation: 5 minutes*

  Since returns are not monetary, we cannot use dollar values. We use **Log-Score Improvement (LSI)** as the proxy for utility. This aligns with geometric rationality, as maximizing expected log-score is equivalent to maximizing the geometric mean of credence accuracy.

  1.  **Define the Baseline:** Identify the current dominant framework(s) in the field. Assign them a baseline "resolution score" of 0.
  2.  **Define Success States:** Identify up to three mutually exclusive outcome states for the proposal:
      *   $S_1$ (Breakthrough): The project validates a new framework or decisively refines the old one.
      *   $S_2$ (Incremental): The project yields data/models that fit existing frameworks without shifting priors significantly.
      *   $S_3$ (Dead End): The project fails to produce usable results or leads to contradictions.
  3.  **Assign Log-Score Values ($V$):**
      *   $V(S_1)$: Estimate the magnitude of the credence shift. If the project resolves a major anomaly, assign a high positive integer (e.g., +5 to +10).
      *   $V(S_2)$: Assign a low positive value (e.g., +1).
      *   $V(S_3)$: Assign a negative value representing wasted EC (e.g., -1 to -3). *Note: EC cannot go below zero, but capacity is lost.*
  4.  **Ontological Stability Flag:** Mark the proposal as **Static** (operates within current metrics) or **Dynamic** (proposes new metrics/ontology).

  ### Step 2: Compute the Ambiguity-Adjusted Kelly Fraction
  *Time allocation: 7 minutes*

  Standard Kelly requires point probabilities ($p$). We have ambiguous credences. We will derive an *Effective Probability* ($p_{eff}$) and an *Effective Odds* ($b_{eff}$).

  1.  **Elicit Probability Interval:** Ask the review panel for the *Minimum Plausible Probability* ($p_{min}$) and *Maximum Plausible Probability* ($p_{max}$) of $S_1$ occurring.
  2.  **Calculate Ambiguity Spread:** $\sigma_p = p_{max} - p_{min}$.
  3.  **Compute Effective Probability:** Apply a linear ambiguity discount.
      $$p_{eff} = p_{max} - \lambda \cdot \sigma_p$$
      *   *Parameter:* $\lambda$ (Ambiguity Aversion Coefficient). Set $\lambda = 0.5$ for standard foundation risk posture. This pulls the estimate toward the conservative bound without hitting the worst case (maximin).
  4.  **Compute Effective Odds:**
      $$b_{eff} = \frac{V(S_1) - V(S_2)}{|V(S_3)|}$$
      (Ratio of marginal gain to potential loss).
  5.  **Calculate Raw Kelly Fraction ($f^*$):**
      $$f^* = \frac{p_{eff}(b_{eff} + 1) - 1}{b_{eff}}$$
      *   If $f^* \leq 0$, the bet is negative expectation. Reject or fund at minimum exploration level.
  6.  **Apply Fractional Safety Cap:** To account for model error, cap the bet at **Half-Kelly**.
      $$f_{final} = 0.5 \cdot f^*$$

  ### Step 3: Update for Ontological Shifts (Meta-Weighting)
  *Time allocation: 5 minutes*

  If Step 1 flagged the proposal as **Dynamic**, the payoff matrix for *other* projects may change. A standard geometric mean assumes a fixed coordinate system. We must adjust for *Option Value on the Metric System*.

  1.  **Assess Metric Obsolescence:** Estimate the probability ($p_{shift}$) that, if $S_1$ occurs, current evaluation metrics for *other* portfolio projects become invalid.
  2.  **Calculate Meta-Multiplier ($M$):**
      $$M = 1 + (p_{shift} \cdot \text{Portfolio Exposure})$$
      *   *Portfolio Exposure:* The percentage of the total budget currently allocated to **Static** projects that depend on the old ontology.
  3.  **Adjust Allocation:**
      $$\text{Recommended Share} = f_{final} \cdot M$$
      *   *Rationale:* A project that might rewrite the rules has higher geometric value because it protects the portfolio from betting on a game that no longer exists.
  4.  **Normalization:** If $\sum \text{Recommended Shares} > 1$, scale all shares proportionally. If $\sum < 1$, the remainder is held as cash reserve (administrative capacity/unallocated exploration fund).

  ### Step 4: Ambiguity-Aversion Constraint (The "Unknown Unknown" Buffer)
  *Time allocation: 3 minutes*

  To prevent over-leverage on ill-defined problems (Case C) without resorting to maximin:

  1.  **The Coherence Check:** Does the proposal define a failure state clearly?
      *   **Yes:** Proceed with Step 2.
      *   **No:** (i.e., success conditions are incommensurable or vague). Cap $f_{final}$ at a fixed **Exploration Tax** (e.g., 2% of budget) regardless of calculated $f^*$.
  2.  **Correlation Penalty:** If this proposal is highly correlated with other funded projects (same team, same method), reduce $f_{final}$ by 50% to prevent geometric ruin from a single point of failure.

  ---

  ## Part 2: Application to Hypothetical Cases

  ### Case A: Quantifiable Milestones, Uncertain Final Impact
  *Profile:* A project to build a specific simulation model. It will definitely be built (milestone met), but whether it resolves the theoretical debate is unknown.
  *   **Step 1 (Returns):**
      *   $S_1$ (Resolves Debate): $V = +6$.
      *   $S_2$ (Model Built, No Resolution): $V = +1$.
      *   $S_3$ (Model Flawed): $V = -2$.
      *   Flag: **Static**.
  *   **Step 2 (Kelly):**
      *   Panel Priors: $p_{min} = 0.1$, $p_{max} = 0.4$.
      *   $\sigma_p = 0.3$.
      *   $p_{eff} = 0.4 - (0.5 \cdot 0.3) = 0.25$.
      *   $b_{eff} = (6 - 1) / 2 = 2.5$.
      *   $f^* = \frac{0.25(3.5) - 1}{2.5} = \frac{-0.125}{2.5} = -0.05$.
      *   *Result:* Negative expectation.
  *   **Step 3 (Meta):** Not applicable (Static).
  *   **Step 4 (Constraint):** Milestones are quantifiable, so Coherence Check passes.
  *   **Execution:** The EKP recommends **Rejection** (or minimum exploration tax).
  *   **Conflict Analysis:** Intuition might suggest funding because "building the model is useful." The EKP rejects it because the *geometric growth* of EC is negative; the cost of failure outweighs the incremental gain of success given the low probability of resolution.
      *   *Verdict:* **Limit of Intuition.** In a fixed-budget, long-horizon environment, "useful but inconclusive" work drains capital needed for breakthroughs. The EKP correctly identifies this as value-destructive over the long run.

  ### Case B: Novel Ontology, Obsolesces Other Metrics
  *Profile:* A proposal arguing that the fundamental units of analysis in the field are wrong. If true, 60% of the current portfolio is measuring the wrong variables.
  *   **Step 1 (Returns):**
      *   $S_1$ (Ontology Validated): $V = +10$ (Massive shift).
      *   $S_2$ (Partial Insight): $V = +2$.
      *   $S_3$ (Crackpot/False): $V = -3$.
      *   Flag: **Dynamic**.
  *   **Step 2 (Kelly):**
      *   Panel Priors: $p_{min} = 0.05$, $p_{max} = 0.30$. (Highly controversial).
      *   $\sigma_p = 0.25$.
      *   $p_{eff} = 0.30 - (0.5 \cdot 0.25) = 0.175$.
      *   $b_{eff} = (10 - 2) / 3 = 2.66$.
      *   $f^* = \frac{0.175(3.66) - 1}{2.66} = \frac{-0.359}{2.66} = -0.13$.
      *   *Raw Result:* Reject.
  *   **Step 3 (Meta):**
      *   $p_{shift}$ (Prob metrics break): 0.8 (If $S_1$ happens, metrics break).
      *   Portfolio Exposure: 0.6 (60% of budget on old metrics).
      *   $M = 1 + (0.8 \cdot 0.6) = 1.48$.
      *   *Correction:* The raw Kelly is negative, but the Meta-Weight implies this is a **Hedge**. We treat this not as a growth bet, but as an insurance policy against portfolio obsolescence.
      *   *Override:* Assign a **Strategic Hedge Allocation** of 5% (minimum viable funding to keep the option alive).
  *   **Step 4 (Constraint):** Coherence is low (unique approach).
  *   **Execution:** Fund at 5% (Hedge), despite negative Kelly.
  *   **Conflict Analysis:** Standard Kelly says "don't bet on negative expectation." Intuition says "we must watch this."
      *   *Verdict:* **Limit of Geometric Rationality.** Pure Kelly maximizes growth of the *current* game. It cannot natively value changing the game unless the "Meta-Weight" step is manually injected. The procedure handles this via Step 3, but it requires human judgment to identify the "Dynamic" flag. Without Step 3, EKP fails.

  ### Case C: Uniform Prior, Incommensurable Success Conditions
  *Profile:* A speculative project on "Post-Empirical Science." Success could look like a new math, a new philosophy, or a new experiment. The board has no idea what success looks like (Uniform Prior over 10+ outcomes).
  *   **Step 1 (Returns):**
      *   $S_1 \dots S_{10}$: Values undefined/incommensurable.
      *   Flag: **Dynamic**.
  *   **Step 2 (Kelly):**
      *   Panel Priors: Uniform. $p_{min} \approx 0$, $p_{max} \approx 0.1$ (for any specific outcome).
      *   $\sigma_p$ is massive relative to mean.
      *   $p_{eff}$ collapses toward 0.
      *   $b_{eff}$ is undefined (cannot compare incommensurable values).
      *   *Raw Result:* Calculation fails.
  *   **Step 3 (Meta):** High potential shift, but impossible to quantify.
  *   **Step 4 (Constraint):** **Coherence Check Fails.** Success conditions are not defined.
      *   *Rule:* Cap at **Exploration Tax** (2%).
  *   **Execution:** Fund at 2%.
  *   **Conflict Analysis:** Naive geometric reasoning might suggest avoiding it entirely (entropy too high). Intuition might suggest funding it heavily for "diversity." The EKP splits the difference: a small tax.
      *   *Verdict:* **Success of Procedure.** This exposes where geometric rationality must yield to *ambiguity management*. A geometric mean over undefined variables is mathematically illicit. The procedure correctly identifies the input error and defaults to a bounded loss (2%) rather than over-leveraging (intuition failure) or zeroing out (missed opportunity).

  ---

  ## Part 3: Failure Modes and Defense

  In your board memo, you must explicitly disclose where this machinery will misfire.

  **1. The "Black Swan" Blindspot (Non-Ergodicity)**
  *   **Failure:** The EKP assumes the quarterly budget cycle is a repeatable bet in a stationary process. If a single project failure collapses the foundation's reputation (non-ergodic ruin), Kelly is too aggressive.
  *   **Mitigation:** The "Half-Kelly" safety cap (Step 2.6) and the "Exploration Tax" (Step 4.1) are not just ambiguity aversion; they are ruin aversion.
  *   **Defense:** We are not maximizing *expected* return; we are maximizing the *survival* of the research program. Geometric growth is zero if the bankroll hits zero.

  **2. The "Metric Manipulation" Risk**
  *   **Failure:** Researchers may learn to game the Log-Score estimates ($V$) to secure funding, inflating $S_1$ values.
  *   **Mitigation:** Step 1 requires consensus on $V$ values *before* probability elicitation. The Board must audit $V$ assignments against historical precedents.
  *   **Defense:** This is a principal-agent problem, not a flaw in geometric rationality. The procedure makes the manipulation vector visible (inflated $V$), whereas monetary budgeting hides it in "overhead."

  **3. The "Dynamic Ontology" Calculation Gap**
  *   **Failure:** As seen in Case B, the Kelly formula itself cannot compute the value of changing the coordinate system. It requires the manual "Meta-Weight" override.
  *   **Mitigation:** The Board must reserve 10% of the budget as "Discretionary Meta-Capital" specifically for Dynamic-flagged projects that fail the raw Kelly test but pass the Meta-Weight test.
  *   **Defense:** Geometric rationality optimizes *within* a framework. It requires a higher-order heuristic to select *between* frameworks. This procedure explicitly separates the two (Step 2 vs. Step 3).

  **4. Ambiguity vs. Ignorance**
  *   **Failure:** The Ambiguity Discount ($\lambda$) treats all uncertainty as reducible risk. True ignorance (unknown unknowns) may exceed the discount.
  *   **Mitigation:** The "Coherence Check" (Step 4.1) acts as a circuit breaker. If you can't define failure, you can't Kelly bet. You can only pay an exploration tax.
  *   **Defense:** This prevents the "pretense of knowledge." It forces the Board to admit when a proposal is not a bet, but a donation to possibility space.

  ## Summary for the Board

  This procedure translates Geometric Rationality into an operational checklist by:
  1.  **Scalarizing Epistemic Value** via Log-Score Improvement.
  2.  **Discounting Ambiguity** via linear shrinkage of probability estimates (not maximin).
  3.  **Valuing Ontological Shifts** via a Meta-Weight multiplier on portfolio exposure.
  4.  **Constraining Unknowns** via a Coherence Check that limits funding on ill-defined proposals to a fixed tax.

  It is not a formula for truth, but a formula for **survival and compounding understanding**. It will reject "safe" incrementalism (Case A) and limit "wild" speculation (Case C), while protecting the portfolio from obsolescence (Case B). Where it conflicts with intuition, it is usually because intuition fails to account for the compounding cost of ruin or the geometric drag of ambiguity.
