answer: |-
  The Highland Water Authority, whose legal jurisdiction covers only Highland municipality, must decide whether to construct a dam that diverts the Oak Creek into a reservoir. If the dam is built, downstream flow into the separate jurisdiction of Lowland drops critically, destroying Lowland's agricultural economy; if the dam is rejected, flow remains sufficient for Lowland's survival. Lowland residents are not subject to Highland's laws, taxes, or police, only the causal hydrology, so the "all subject to coercion" principle excludes them from the Highland electorate. Under the "all affected interests" principle, however, Lowland farmers merit a vote only if their interests are actually harmed, which occurs only if the dam passes; yet if they are included, their majority opposition defeats the dam, preventing the harm that justified their inclusion, while if they are excluded, the Highland majority builds the dam, causing the harm that retroactively demands their inclusion, leaving the composition of the demos logically unsettled.

  **Verdicts:** The "all subject to coercion" principle delivers a stable demos (Highland only) and a determinate outcome (the dam is built), because Lowland residents are not legally bound by Highland's statutes. The "all affected interests" principle delivers indeterminacy; it cannot define the electorate without knowing the outcome, but cannot produce the outcome without defining the electorate.

  **Key Feature:** The work is done by *outcome-contingent affectedness*. The group's status as "affected" is not a fixed property of the proposal but depends entirely on whether the proposal succeeds, creating a feedback loop between eligibility and results.

  **The Tweak:** If you tweak the case so the harm is the same size whichever way the vote goes—for example, if the choice is between Dam A (diverts North) and Dam B (diverts South), and both ruin Lowland's flow—then Lowland is affected regardless of the outcome. The loop breaks, the "all affected interests" principle stabilizes to include Lowland, and the verdict becomes determinate.

  **The Wriggle:** A proponent of the affected-interests principle would escape the loop by shifting the criterion from *actualized* harm to *potential* harm or "interests at stake." They would argue Lowland deserves a vote because the *proposal* threatens them, regardless of whether their vote ultimately neutralizes the threat, thereby fixing the demos prior to the vote.
