prompt: |-
  hey so im on the student council and we were looking at how our district approves science textbooks, and theres this weird institutional rule. if an experiment in a textbook chapter fails predictions, the approval board can add 'contextual adjustments'—like 'except in high humidity' or 'for non-magnetic samples only'—to the lab instructions, but they have an explicit written ban on altering the core equations in that chapter. theyll never touch F=ma or the wave equation, they just stack up these exception clauses. what philosophical view of scientific theories does that practice presuppose? is it assuming theres an untouchable hard core with a flexible protective belt around it? could a popperian falsificationist run the same board, or does the practice quietly rule that out? and if the district replaced that view with one where a single failed prediction can rewrite the core law, what would actually have to change in their review process?

  put your answer in a json object with exactly these fields: 'reconstructed_implicit_theory' (the view of science the board is acting like it believes), 'lakatos_fit' (how closely this maps onto Lakatos's hard core and protective belt, and where it diverges), 'compatible_alternatives' (other philosophies that could justify the same rule without being Lakatosian), 'required_practical_changes' (what the board meetings and review criteria would look like if they dropped the hard-core protection), and 'underdetermined_points' (parts of the practice that dont actually commit them to one philosophy over another).
