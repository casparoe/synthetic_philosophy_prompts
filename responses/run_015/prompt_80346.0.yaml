          *   *Fact Check:* Thucydides 3.50. The second ship arrived just as Paches was reading the decree. However, *some* executions had already happened. Thucydides says the main ringleaders (over 1000) were executed *before* the second ship arrived. The *general* massacre was stopped, but the city was not spared "as a whole."
          *   *Verdict:* **Factually Incorrect/Imprecise.** Significant nuance missing. Over 1,000 men were executed.

      *   *Claim 6 (Sicily):* "Nicias, who had led the first debate by opposing the expedition, then tried to scare the assembly by talking about the impiety of ignoring the eclipse..."
          *   *Fact Check:* Thucydides 6. Nicias opposed the expedition initially (6.9-14). The *eclipse* happened much later, during the retreat from Syracuse (7.50), not during the decision-making debate in Athens. This is a major chronological conflation.
