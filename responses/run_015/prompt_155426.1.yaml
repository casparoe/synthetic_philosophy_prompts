answer: |-
  **A:** Look at that screen. Thirty-four cents. No trades in fourteen days. You're telling me that number is empty?

  **B:** I'm telling you it's a ghost. Milgrom–Stokey says with common priors and common knowledge of rationality, trade only happens on hedging needs or genuine prior divergence. Nobody's touched that quote. It's just the market maker's prior wearing a costume.

  **A:** That's too strict. Hayek knew prices compress dispersed knowledge. Grossman–Stiglitz showed prices can't be *fully* revealing, otherwise no one profits from digging up info. Informativeness and volume come apart. The maker is sitting there risking capital by standing ready. That constraint costs money. The quote reflects that cost.

  **B:** Standing ready is cheap talk if no one calls the bluff. You want epistemic warrant? You need a counterparty to test the price. Without volume, you don't know if the quote survives contact with reality. It's just a number someone typed into a box.

  **A:** So how do you force contact without destroying the market? I'm floating *jury-duty clearing*. Randomly draft participants—maker included—force-execute a small trade at the posted quote. Make the quote binding, not optional.

  **B:** Okay, now you've just changed the incentives. Objection one: a maker facing random fills will shade back toward the prior unless the draft is provably independent of the event. If I know I might get forced to trade against my inventory, I quote the safe average, not my signal.

  **A:** But the draft is random. It's orthogonal to the reservoir level.

  **B:** Is it? You can never verify that independence, because the event is the very thing you're trying to learn. If the draft correlates with anyone holding private info—even by accident—the maker faces adverse selection. So they widen the spread or move the mid to the prior. You haven't solved cheap talk; you've just incentivized conservatism.

  **A:** Fair. But you're looking at the mid. Under jury-duty clearing, shift the evidential weight to the spread. The maker widens the spread to cover the risk of forced execution. The width *is* the information. It tells you how uncertain the maker is about being drafted against informed flow.

  **B:** I'll concede that. The spread width under threat of clearing *does* encode uncertainty better than a static quote. It measures the cost of liquidity provision under coercion. But that leads to objection two: under jury-duty clearing, the expected loss borne by a draftee is effectively a tax on holding a private signal.

  **A:** How so?

  **B:** If I know the dam is critical and I'm drafted to buy at 34 when the true value is 90, I lose. So I stop digging for info. You've reproduced the Grossman–Stiglitz problem one level down. You solve the no-trade theorem by killing information acquisition.

  **A:** I concede that. It disincentivizes deep research if the mechanism punishes position-holding via random taxation. But maybe that's the trade-off. You want volume to validate price? You pay for it in reduced signal quality.

  **B:** Exactly. So you solve the skeptic's worry about cheap talk by confirming the skeptic's worry about information. You get a robust price for a world where nobody knows anything new.

  **A:** Not nobody. Just fewer people. The quote survives testing, even if fewer people bother to inform themselves.

  **B:** But then what are we learning? The price is robust, but the underlying epistemology is stagnant. You've built a market that tells you the prior very reliably.

  **A:** Better than a ghost.

  **B:** Maybe. But don't call it discovery.

