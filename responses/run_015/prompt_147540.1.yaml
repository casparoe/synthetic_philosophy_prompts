      *Failure Mode - Optimization:* Students treat it as a math problem. *Remedy:* Introduce ambiguity in the rules during the "Emergency" round.
      *   *Failure Mode - Refusal:* Student won't be Registrar. *Remedy:* Make Registrar a rotating duty or offer a "Bureaucrat" role with extra points but social stigma.

      *Debrief:* Must use student inconsistency. "Who voted for High Collection? Stand up. Who got penalized without knowing why? Stand up. Are you the same people?"

