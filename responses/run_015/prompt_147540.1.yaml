answer: |-
  **Title:** The Registry Simulation
  **Materials:** 18 index cards (Actions), 50 paper slips (Tokens), 1 large poster (Public Ledger), 18 small sheets (Private Records), pens, one bag of cheap candy.

  **Setup (5 Minutes)**
  Divide the room: 12 Citizens, 3 Registrars, 3 Auditors. Give Citizens 5 Life Tokens each. Give Registrars a stamp and the Public Ledger. Give Auditors the Rulebook (a single sheet with ambiguous clauses).
  **The Vote:** Before receiving role-specific instructions, the whole class votes on three System Settings:
  1.  **Collection:** How many actions get recorded? (All vs. Random Half)
  2.  **Visibility:** Can Citizens see their own record? (Yes vs. No)
  3.  **Enforcement:** Are penalties automatic? (Yes vs. Registrar Discretion)
  *Constraint:* Vote by show of hands. Record results publicly.

  **Rules (Read Aloud in 3 Minutes)**
  "Citizens: Draw an Action Card each round. Some actions are 'Sensitive.' If your action is recorded, you get a Mark. Three Marks means you lose a Life Token. You can pay one Token to hide an action, but you only have five.
  Registrars: Mark the Ledger based on the Collection setting. If Enforcement is Automatic, remove a Citizen's token immediately upon their third Mark. If Discretionary, you choose.
  Auditors: You may challenge one Mark per round, but only if Visibility is set to Yes.
  Play three rounds. After Round 2, an 'Emergency' occurs: The Rulebook changes Enforcement to Automatic regardless of your vote. Citizens with zero tokens are out. Winners get candy."

  **Timeline (90 Minutes Total)**
  *   **00–05:** Distribute materials. Read rules.
  *   **05–15:** **The Vote.** Class sets the three dials. Collect ballots.
  *   **15–20:** **The Reveal.** Hand out secret "Profile Cards" to Citizens (e.g., "You must draw two Sensitive cards per round," "You are immune to one penalty"). Registrars learn the Marking Criteria (which are stricter than Citizens expect).
  *   **20–50:** **Rounds 1–3.** Citizens act. Registrars mark. Auditors attempt challenges. At minute 35, declare the Emergency: Enforcement becomes Automatic. Visibility remains as voted.
  *   **50–60:** **The Crash.** Count tokens. Distribute candy to survivors.
  *   **60–90:** **Debrief.**

  **Debrief Strategy**
  Do not start with theory. Start with affect.
  1.  **The Trap:** Ask, "Who voted for High Collection?" (Hands go up). "Who lost a token because of a Mark you couldn't see?" (Hands go up). "Are these the same hands?" This isolates the **Reciprocity Gap**.
  2.  **The Budget:** Ask those who paid tokens to hide actions: "Did you hide the action because it was wrong, or because it was recorded?" This isolates the **Opacity Budget**.
  3.  **The Naming:** Now introduce the terms. Map "Collection" to *downward legibility*, "Visibility" to *upward legibility*, and "Enforcement" to *automaticity*. Explain that a state can be low-collection but high-penalty if the gap between the first two is wide.
  4.  **The Inconsistency:** Point to a specific student who argued for efficiency (Automaticity) in Round 1 but protested unfairness in Round 3. Ask them to reconcile the two positions without changing their vote.

  **Predicted Failures and Remedies**
  1.  **Optimization Puzzle:** Students may treat this as a math problem to maximize tokens, ignoring the ethical weight.
      *   *Remedy:* During the Emergency (Round 3), introduce ambiguity. Tell Registrars: "Mark any action that *feels* risky." This breaks the algorithm and forces ethical judgment back into the loop.
  2.  **Refusal to Play Registrar:** A student may refuse to be the "oppressor" on principle.
      *   *Remedy:* Pre-assign roles randomly via drawn cards before the vote. Frame the Registrar role as "Public Servant" with immunity from penalties. If they still refuse, swap them with an Auditor; the mechanic holds if someone holds the pen.
  3.  **Mushy Compromise:** The class votes for "Medium" settings to please everyone.
      *   *Remedy:* Force binary choices. No "Medium." You must choose All or Half, Yes or No. This polarizes the outcome and ensures someone loses.

  **What the Game Cannot Reproduce**
  You must supply the **Chilling Effect** in your voice. The game captures the penalty *after* action. It cannot capture the decision *not* to act because one *might* be recorded. In reality, the Opacity Budget is spent before the game begins. Students will say, "I would have drawn the card if I knew the rules." You must remind them: In high-stakes systems, you never know the rules until the penalty arrives. The game makes the pain visible; real systems rely on the pain being invisible.

  \answer{The cost of being visible without visibility in return.}
