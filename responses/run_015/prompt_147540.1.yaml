          *   Registrars get a stamp.
          *   Round 1: Citizens perform actions. Registrars mark based on Collection setting.
          *   Consequence: If Auto, penalty immediate. If Manual, Registrar decides.
          *   Visibility: Can Citizens see the mark? Can they appeal?
          *   *Crucial Mechanic:* Halfway through, swap roles or reveal hidden constraints. Actually, better: Assign roles *after* voting. This ensures people vote for policies that might hurt them later.
          *   *Opacity Budget:* Citizens can pay a token to "hide" an action, but limited tokens.
      *   **Phase 3: Crisis (15 mins).** A "Security Event" changes the rules mid-game (e.g., Automation turns on).
      *   **Phase 4: Debrief (15 mins).**

