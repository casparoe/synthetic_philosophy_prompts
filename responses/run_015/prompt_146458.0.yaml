prompt: |-
  I'm a PhD student in political philosophy at Leeds and I've been trying to think about Machiavelli's fortune and virtù in a way that doesn't just recycle the same old prince-stories. I want to analyse the 2016 Brexit referendum and the negotiation chaos that followed through that lens, but not in the lazy 'Boris Johnson is like Cesare Borgia' way. Specifically, I want you to treat the referendum result itself as a sudden event of fortuna — the kind of flood that breaks its banks — and then ask what virtù was actually available to the British state afterwards. Not just individual politicians like Theresa May or Boris Johnson, but whether an unwritten, convention-based constitution can exercise something like collective or distributed virtù, or whether it's actually an anti-virtù structure because it lacks instituional dykes to build. Did the flexibility of the British system help it adapt to the shock, or did the dispersion of authority mean nobody could take decisive action? Going the other direction: does Brexit show that Machiavelli's model of personal princely agency is useless for modern parliamentary democracies, or does it reveal that institutions can do the adapting he thought only a single ruler could do?

  Please don't just tell me whether Boris was a good prince. I want you to map the theory onto the institutional mechanics — who had standing to respond, what the options were, where Machiavelli's framework is silent — and say where the mapping breaks. I'm particularly interested in whether the 'restoration' framing of Brexit (taking back control) hides a welfare judgement about whose suffering counts, though I'm not sure that's a Machiavellian move. Also, please be explicit about what would change your mind: what specific feature of Machiavelli's texts — say, his treatment of republics in the Discorsi — or what detail about the Brexit timeline would make you reverse the claim that the UK lacked virtù? And if you think the whole application is forced, say so — I need the reasoning, not just a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Political Philosophy (University of Leeds). This implies a high level of theoretical sophistication, familiarity with primary texts, and a desire for nuance over pop-politics.
      *   **Topic:** Machiavelli's *fortuna* and *virtù* applied to the 2016 Brexit referendum and subsequent negotiations.
      *   **Constraints/Avoidances:** No lazy "Boris = Borgia" comparisons. No simple verdicts on individual politicians. No recycling standard "Prince" stories.
      *   **Core Question:** Can an unwritten, convention-based constitution exercise *collective/distributed virtù*, or is it an *anti-virtù* structure? Did flexibility help or hinder? Is Machiavelli's model of personal agency useless for modern democracies, or can institutions adapt?
      *   **Specific Interest:** The "restoration" framing ("Take Back Control") and its relation to welfare judgments (whose suffering counts) – is this Machiavellian?
      *   **Requirement:** Be explicit about *falsifiability* (what would change my mind? specific texts/timeline details). Acknowledge where the mapping breaks.

  2.  **Deconstruct the Theoretical Framework (Machiavelli):**
      *   *Fortuna:* Not just luck, but an uncontrollable, violent force (the flood). It demands preparation (*dykes/dams*) or swift adaptation.
      *   *Virtù:* Not moral virtue, but efficacy, prowess, the ability to shape circumstances. In *The Prince*, it's often individual. In *Discourses on Livy*, it's republican/civic.
      *   *Institutions:* Machiavelli values laws/institutions as "dykes" against *fortuna*. A good constitution channels ambition and prepares for shocks.
      *   *The People:* Machiavelli is surprisingly pro-populus in the *Discourses* (more stable than princes), but wary of their impulsiveness in *The Prince*.

  3.  **Deconstruct the Empirical Case (Brexit):**
      *   *The Shock:* The Referendum result (June 2016). Unexpected (by markets/elites), binary, advisory but treated as binding.
      *   *The Response:* Article 50 trigger, General Elections (2017, 2019), Parliamentary deadlocks, Prorogation controversy, Withdrawal Agreement.
      *   *The Constitution:* Unwritten, reliant on convention (Cabinet Manual, Sovereignty of Parliament).
      *   *The "Restoration":* "Take Back Control" implies a return to a past state of sovereignty.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Set the stage: moving from *Prince* to *Discourses* is crucial here.
      *   **Fortuna as the Referendum:** Treat the vote not as a policy choice but as an event. It breached the "dykes" of the party system (both Tories and Labour split).
      *   **Virtù and the Constitution (The Core Tension):**
          *   *Thesis:* The UK constitution lacked *virtù* not because it was inflexible, but because its flexibility was unchannelled. Machiavelli's *virtù* requires *order*. The UK had *fluidity* without *form*.
          *   *Distributed Virtù?* In the *Discourses*, Rome had *virtù* because institutions (Tribunes, Senate, Consuls) checked and balanced ambition. In Brexit, institutions (Parliament vs. Executive) fought, leading to paralysis. This looks like *corruption* (in the Machiavellian sense of decay) rather than *virtù*.
          *   *The "Dykes" Problem:* Machiavelli says you build dykes *before* the flood. The UK relied on convention (soft dykes) which washed away.
      *   **The "Restoration" and Welfare:**
          *   "Take Back Control" is a nostalgic *virtù* (returning to origins).
          *   *Welfare Judgment:* Machiavelli cares about the *state's* survival, not individual welfare unless it threatens stability. The "suffering" of the "left behind" was the fuel for *fortuna*, but the response wasn't about alleviating suffering, it was about symbolic sovereignty. This *is* Machiavellian in a cold sense: appearance over substance.
      *   **Where the Mapping Breaks:**
          *   Machiavelli assumes a unitary will is possible (Prince or Republic). Modern liberal democracy assumes pluralism is good. Machiavelli sees faction as dangerous (unless institutionalized like Rome). Brexit showed faction destroying the state's capacity to act.
          *   Time horizon: Machiavelli's *virtù* is about long-term state preservation. Brexit politics was short-term electoral survival.
      *   **Falsifiability (Crucial Step):**
          *   What would change the claim that the UK lacked *virtù*?
          *   *Textual:* If we lean heavily on *Discourses* III.1 (returning to beginnings), maybe the chaos *was* the necessary corruption to renew the state?
          *   *Empirical:* If the post-Brexit settlement leads to long-term stability and renewed civic cohesion (unlikely currently, but theoretically possible).
      *   **Conclusion:** Summarize. The UK didn't fail because it wasn't a Principality; it failed because it lacked the *institutional virtù* of a Republic.

  5.  **Refining the Tone:**
      *   Academic but engaging.
      *   Avoid jargon where possible, but use precise Machiavellian terminology (*ordini*, *corruzione*, *ritorno ai principi*).
      *   Ensure the Leeds PhD context is respected (rigorous, critical).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I focus too much on Boris? *Correction:* Pull back. Focus on the Cabinet Office, the Civil Service, Parliament as entities.
      *   *Check:* Did I address the "welfare" point? *Correction:* Ensure I link "Take Back Control" to Machiavelli's view on appeasing the people vs. the great.
      *   *Check:* Is the falsifiability specific? *Correction:* Cite specific chapters in *Discourses*.

  7.  **Final Polish:** Check against the prompt's specific request for "institutional mechanics" and "where the mapping breaks." (Ensure I mention the Civil Service's role as a potential source of *virtù* that was neutralized).

  *(Self-Correction Note)*: I need to be careful not to just say "Brexit was bad." The prompt asks about *virtù* (effectiveness), not normative goodness. A successful authoritarian consolidation could be *virtù* in Machiavellian terms. I must remain analytically neutral on the *value* of Brexit, focusing on the *capacity to act*.

  8.  **Finalizing the Falsifiability Condition:** I need to be very precise. If the *Discourses* argument about "tumults" making Rome free applies to the UK Parliament's deadlock, then the chaos was productive. If not, it was corrosive.

  9.  **Structure:**
      1.  Introduction: Reframing the lens (*Prince* vs. *Discourses*).
      2.  *Fortuna* as Constitutional Shock.
      3.  *Virtù* as Institutional Capacity (The "Dyke" problem).
      4.  The "Restoration" and the People (Welfare/Suffering).
      5.  Where the Mapping Breaks (Liberalism vs. Machiavelli).
      6.  Falsifiability Conditions.

  Let's write.
answer: |-
  This is a sophisticated prompt that requires moving beyond the caricature of Machiavelli as a theorist of autocratic cunning and engaging with his institutional thought, specifically the tension between *The Prince* and the *Discourses on Livy*. As a PhD student, you will know that the standard "Boris as Borgia" analogy fails because it ignores Machiavelli's insistence that *virtù* is not merely personal charisma but the capacity to impose form upon matter (*materia*).

  Here is an analysis mapping Machiavellian *fortuna* and *virtù* onto the institutional mechanics of Brexit, focusing on the British constitution's capacity for collective agency, the welfare implications of "restoration," and the limits of the theoretical framework.

  ### 1. *Fortuna* as Constitutional Shock, Not Just Political Upset
  In *The Prince* (Ch. 25), Machiavelli describes *fortuna* as a raging river that, when enraged, floods the plains. The key insight is that the flood itself is not the failure; the failure is the lack of "dykes and dams" (*argini e ripari*) built in calm weather.

  Treating the 2016 referendum as *fortuna* is analytically sound because it was an exogenous shock to the system that bypassed the normal filtering mechanisms of representative democracy. However, the Machiavellian critique of the British state is not that the flood happened, but that the **unwritten constitution functioned as anti-*virtù* infrastructure.**

  *   **The Mechanism:** In a codified constitution, the rules for resolving a crisis of this magnitude (e.g., who triggers Article 50, the legal status of the referendum) are the "dykes." In the UK, these were conventions (Cabinet Manual, Parliamentary sovereignty).
  *   **The Failure of *Virtù*:** *Virtù* requires the ability to command necessity. Between 2016 and 2019, the British state could not command necessity because the "standing to respond" was dispersed without a hierarchy of resolution. The Executive claimed the prerogative (*Miller I* challenged this); Parliament claimed sovereignty; the People claimed the mandate.
  *   **Machiavellian Verdict:** This was not *virtù*; this was *corruzione* (decay). For Machiavelli, a state is corrupt not when it is morally bankrupt, but when its institutions no longer channel ambition toward the public good (*il bene comune*) but toward factional survival. The UK system allowed factions (Remainer Tories, Leaver Tories, Opposition) to veto action without bearing the cost of decision. This is the opposite of the Roman Republic, where institutions forced decisions.

  ### 2. Can a Constitution Exercise Collective *Virtù*?
  You ask if an unwritten constitution can exercise distributed *virtù*. Machiavelli's *Discourses* suggests yes, but only if the institutions are designed to turn conflict into law.

  *   **The Roman Model:** In *Discourses* I.4-5, Machiavelli argues that the tumults between the Senate and the Plebs were the "first cause of Rome's liberty." Why? because they resulted in *laws* that protected liberty. The conflict was institutionalized.
  *   **The Brexit Model:** The conflict between the Executive (No. 10) and the Legislature (Parliament) during the 2017-2019 deadlock did not produce new laws that stabilized the state; it produced procedural guerrilla warfare (e.g., the Benn Act, prorogation challenges).
  *   **The Civil Service:** A potential site of "bureaucratic *virtù*" (continuity, expertise) existed in the Civil Service. However, Machiavelli is skeptical of intermediaries who lack a stake in the outcome. The Civil Service was neutralized by the politicization of the implementation process. They had the *knowledge* but not the *authority* (standing).
  *   **Conclusion:** The British system did not lack flexibility; it lacked *form*. Machiavelli's *virtù* is the imposition of form on matter. The UK had too much matter (competing claims of legitimacy) and no form (codified rules of engagement). Therefore, the dispersion of authority hindered decisive action. It was not "distributed *virtù*"; it was "distributed veto."

  ### 3. "Take Back Control": Restoration and Welfare Judgments
  You raised a crucial point about the "restoration" framing hiding a welfare judgment. Machiavelli discusses the "return to beginnings" (*ritorno ai principi*) in *Discourses* III.1. He argues states must be brought back to their original principles to avoid decay.

  *   **The Machiavellian Move:** "Take Back Control" is a rhetorical *ritorno ai principi*. It posits a mythical past state of sovereignty. For Machiavelli, this is a valid political tool *if* it rejuvenates the state's military or economic power.
  *   **The Welfare Judgment:** You ask if this hides a judgment about whose suffering counts. Machiavelli is generally indifferent to individual suffering unless it threatens the state's stability (*lo stato*). In *The Prince* Ch. 17, he argues it is better to be feared than loved if you cannot be both, because love is fickle.
  *   **Application:** The Brexit negotiation strategy often prioritized the *symbolic* sovereignty (the "fear"/respect of the EU) over the *material* welfare (supply chains, NI protocol friction).
      *   *Is this Machiavellian?* Yes, in the sense that the *appearance* of power (sovereignty) was valued over the *substance* of welfare.
      *   *Where it diverges:* Machiavelli warns the Prince not to be hated by the people. If the "suffering" of the post-Brexit economic shock falls disproportionately on the demographic that voted for the "restoration," Machiavelli would view this as a failure of *prudenza* (prudence). A Machiavellian actor would secure the sovereignty *and* manage the material fallout to prevent hatred. The UK government often seemed to accept material damage as the price of symbolic victory. This is less Machiavellian *virtù* and more ideological rigidity.

  ### 4. Where the Mapping Breaks
  There are two specific points where applying Machiavelli to modern parliamentary democracy becomes forced:

  1.  **The Definition of the "Public Good":** Machiavelli assumes a unitary "state interest" that a virtuous actor can discern. Modern liberal democracy assumes pluralism *is* the good. The Brexit deadlock occurred because there was no consensus on what the "state interest" was (Single Market access vs. Regulatory autonomy). Machiavelli's framework has no mechanism for resolving irreconcilable definitions of the good other than force or fraud. To say Parliament lacked *virtù* implies there was a "correct" decision they failed to make. In a liberal democracy, the deadlock *was* the system working as designed (checking power), even if it looked like paralysis.
  2.  **Time Horizons:** Machiavellian *virtù* is about the long-term preservation of the state (*lo stato*). Modern electoral cycles (especially the 2017 snap election) incentivize short-term survival. Theresa May's call for an election was an attempt to gather personal *virtù* (a mandate) but resulted in institutional weakness. Machiavelli would likely view the reliance on elections to solve constitutional crises as a vulnerability, not a feature.

  ### 5. Falsifiability: What Would Change My Mind?
  To treat this as a rigorous theoretical test, here are the specific conditions under which the claim "The UK lacked *virtù*" would be reversed:

  **A. Textual Condition (The *Discourses* Counter-Argument):**
  *   **Claim:** The UK lacked *virtù* because it was paralyzed.
  *   **Reversal:** If we interpret the 2016-2019 chaos through *Discourses* III.1 ("How Sects and Divisions Harm Republics"), Machiavelli argues that conflict is only harmful if it is not channelled through laws. If the **Withdrawal Agreement Act (2020)** is viewed not as a surrender but as a new *ordine* that successfully channelled the *fortuna* into a stable legal framework, then the chaos was the necessary "tumult" that refreshed the constitution.
  *   **Specific Evidence:** If, five years post-Brexit, the UK shows increased civic cohesion and institutional stability *directly resulting* from the resolution of the crisis (i.e., the crisis burned out the factionalism), then the system exercised republican *virtù*. If factionalism persists (e.g., Scotland/NI instability), the Machiavellian verdict of *corruzione* stands.

  **B. Empirical/Timeline Condition (The Civil Service):**
  *   **Claim:** The unwritten constitution prevented decisive action.
  *   **Reversal:** If evidence emerges that the **Cabinet Office Briefing Rooms (COBRA)** or the Civil Service successfully mitigated specific shocks (e.g., border disruptions, financial volatility) *despite* political direction, then "distributed *virtù*" exists in the bureaucracy.
  *   **Specific Evidence:** Documentation showing that permanent secretaries exercised de facto *virtù* by quietly building "dykes" (stockpiles, contingency treaties) that prevented state collapse, even if politicians took the credit or blame. If the state held *because* of the bureaucracy, then the constitution *does* allow for collective *virtù*, just not at the ministerial level.

  ### 6. Conclusion: Is the Model Useless?
  Machiavelli's model of personal princely agency is indeed useless for modern democracies *if* read only through *The Prince*. However, read through the *Discourses*, his framework is devastatingly effective at diagnosing the Brexit crisis.

  The UK did not fail because it lacked a Prince; it failed because it lacked the **institutional *virtù* of a Republic.** It had the factionalism of Rome without the Tribunes to channel it. It had the sovereignty of Parliament without the codified rules to enforce it.

  The "restoration" framing was a Machiavellian attempt to manufacture *virtù* through narrative ("Take Back Control"), but it failed the material test. Machiavelli demands that *virtù* match the times (*i tempi*). The British state tried to apply 19th-century sovereignty tools to 21st-century interdependent problems. That is not *virtù*; that is a failure of adaptation.

  **Final Verdict:** The mapping holds, but only if you shift from *The Prince* to the *Discourses*. The UK constitution was not an *anti-virtù* structure by nature, but it operated as one because its conventions were too weak to act as the "dykes" Machiavelli demands against *fortuna*. The flexibility of the system allowed the flood to wash away the banks rather than be channelled by them.
