answer: |-
  ### Exam Question

  **Question 4 (20 Marks)**

  Both *finks* and *masks* demonstrate the failure of the Simple Conditional Analysis (SCA) of dispositions. However, it is debated whether they represent distinct metaphysical problems requiring distinct solutions, or merely structural variations of a single counterfactual failure.

  Critically evaluate this claim. In your answer, consider whether a successful revision of the conditional analysis (such as Lewis's Reformed Conditional Analysis) treats them symmetrically, or whether the distinction points toward a deeper ontological shift (e.g., from conditionals to causal powers).

  ***

  ### Model Answer

  The Simple Conditional Analysis (SCA) posits that an object $x$ has a disposition $D$ to manifest $M$ upon stimulus $S$ iff, were $x$ to undergo $S$, $x$ would $M$. Finks and masks are counterexamples showing the biconditional fails, but they do so via different mechanisms, suggesting the distinction is metaphysically significant.

  A *mask* (e.g., a fragile glass packed in styrofoam) leaves the intrinsic disposition intact but prevents the manifestation. The conditional is false (if struck, it wouldn't break), but the disposition is present. A *fink* (e.g., an electro-fink that removes conductivity upon touching) removes the disposition itself prior to manifestation. Here, the conditional is true (if touched, it wouldn't conduct), but the disposition was present *before* the stimulus.

  If these were merely variations of the same problem, a single logical fix should resolve both. David Lewis's Reformed Conditional Analysis (RCA) attempts this by adding a clause requiring a "causal basis" that persists through the stimulus. RCA handles masks by specifying that the basis must remain operative despite interfering factors. It handles finks by requiring the basis to persist *through* the stimulus duration. Superficially, this suggests they are structurally identical problems regarding counterfactual truth conditions.

  However, treating them as identical obscures a deeper ontological tension. Masks are problems of *extrinsic interference*; they suggest dispositions require *ceteris paribus* clauses regarding the environment. Finks are problems of *intrinsic instability*; they suggest dispositions cannot be defined by conditionals if the property itself is volatile. The finkish case is more damaging to the SCA because it severs the link between the property and the counterfactual entirely, whereas the mask merely blocks the output.

  Consequently, the distinction matters. If only masks existed, we might save the conditional analysis by refining the antecedent (adding "in ideal conditions"). But finks show that even in ideal conditions, the disposition might vanish *because* of the stimulus. This suggests dispositions are not reducible to conditionals at all, but are categorical bases or causal powers that *ground* the conditionals.

  Therefore, while both refute SCA, they are not metaphysically equivalent. Masks challenge the *application* of the disposition; finks challenge the *persistence* of the property. A robust metaphysics of dispositions must account for intrinsic stability (against finks) separately from extrinsic interference (against masks). Collapsing them risks overlooking the argument for a powers ontology, which treats dispositions as real properties rather than heuristic summaries of counterfactuals.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade A (17–20 Marks): Distinctive Insight & Ontological Engagement**
  *   **Core Argument:** Explicitly argues *for* or *against* the metaphysical significance of the distinction, rather than just describing it.
  *   **Specific Move 1 (Intrinsic vs. Extrinsic):** Distinguishes finks as threatening the *persistence/intrinsic nature* of the property, whereas masks threaten the *manifestation conditions/extrinsic environment*.
  *   **Specific Move 2 (Evaluation of RCA):** Critically assesses whether Lewis's RCA truly solves both symmetrically or merely patches the conditional. (e.g., noting that RCA relies on the existence of a "causal basis," which hints at a powers ontology).
  *   **Specific Move 3 (Ontological Conclusion):** Connects the failure of SCA to the broader debate (Categoricalism vs. Dispositional Essentialism/Powers).
  *   **Clarity:** Precise use of terminology (stimulus, manifestation, causal basis, biconditional).

  **Grade B (13–16 Marks): Competent Explanation & Standard Analysis**
  *   **Core Argument:** Correctly identifies that both refute SCA but offers a standard textbook comparison without deep critical evaluation of the "same problem" claim.
  *   **Specific Move 1 (Definition):** Accurately defines SCA, Finks, and Masks with correct examples.
  *   **Specific Move 2 (Mechanism):** Explains *how* they break the conditional (Mask = disposition present/conditional false; Fink = disposition lost/conditional false).
  *   **Specific Move 3 (Lewis):** Mentions Lewis's RCA or the need for a "causal basis" clause as a solution for both.
  *   **Missing:** Lacks the deeper ontological push (Powers vs. Conditionals) or treats the distinction as merely terminological rather than metaphysical.

  **Grade C (9–12 Marks): Basic Understanding & Description**
  *   **Core Argument:** Describes the concepts but struggles to evaluate the relationship between them.
  *   **Specific Move 1 (SCA):** States the Simple Conditional Analysis formula correctly.
  *   **Specific Move 2 (Counterexamples):** Provides examples of finks and masks but may confuse the direction of the failure (e.g., getting the truth values of the conditional wrong).
  *   **Specific Move 3 (Conclusion):** Concludes that SCA is false but does not address whether the solutions differ or if the distinction matters.
  *   **Issues:** May rely on name-dropping (Martin/Lewis) without explaining the arguments.

  **Fail (0–8 Marks): Inadequate**
  *   Significant misunderstandings of SCA.
  *   Confuses finks and masks entirely.
  *   Irrelevant material or failure to address the prompt.
