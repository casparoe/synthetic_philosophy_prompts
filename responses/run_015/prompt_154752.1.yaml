          *   *Correction:* If $d_i$ increases (better outside option), *both* Nash and KS usually give player $i$ a better outcome. The difference is *how* the feasible set changes affect the outcome.
          *   *Individual Monotonicity (KS):* If the *feasible set* expands for player $i$ (their ideal point $u_i^*$ goes up), KS ensures they benefit. Nash does *not* satisfy this (Nash can punish a player if their potential max increases but the other's doesn't, due to the independence of irrelevant alternatives axiom).
