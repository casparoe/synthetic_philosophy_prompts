  ### The Ruling on Gallipoli

  **Verdict:** Admissible.

  **The Principle:** **The Principle of Civic Viability.**
  Your narrator is proceeding on the belief that a myth of defeat is admissible if it serves to bind a *living, pluralistic polity* together through a narrative of shared endurance, provided the myth allows for future reconciliation and inclusion. 

  *   **Why it fits the existing rulings:** 
      *   **Masada, Vidovdan, Alamo (Inadmissible):** These myths rely on religious fanaticism, ethnic grievance, or insurrectionary causes that are inherently exclusionary or backward-looking. They fuel eternal conflict or commemorate a cause that is morally or politically dead (slavery, a lost kingdom, a suicide sect).
      *   **Dunkirk, Verdun, Camerone (Admissible):** These myths sustain a continuous state or institution. Dunkirk emphasizes survival and collective civilian effort; Verdun emphasizes national unity and endurance; Camerone emphasizes institutional honor ("Honor and Fidelity") that transcends the specific politics of the campaign.
      *   **Gallipoli (Admissible):** Despite the "Birth of a Nation" claim (which risks the Vidovdan trap), the ANZAC legend functions like Dunkirk: it is a secular myth of endurance and "mateship" that has proven flexible enough to eventually include Indigenous veterans and reconcile with the former enemy (via the Kemal attribution). The exclusion of Indigenous men is treated by your narrator as the "French rearguard" of the story—a historical injustice to be corrected within the myth, not a reason to discard the myth itself, because the core narrative serves the cohesion of a democratic state.

  ***

  ### The Alternative Principle

  **The Principle:** **The Principle of Strategic Integrity.**
  A myth of defeat is admissible only if the sacrifice secured a tangible strategic objective, preserved the fighting force for the defense of the homeland, or upheld the operational integrity of an institution. Offensive failures, even if heroic, are inadmissible.

  *   **Why it fits the existing rulings:**
      *   **Masada, Vidovdan, Alamo (Inadmissible):** Strategically futile. Masada was suicide; Vidovdan resulted in the loss of sovereignty; the Alamo was a delay tactic in an insurrection that failed to secure independence on its own merits.
      *   **Dunkirk, Verdun, Camerone (Admissible):** Dunkirk saved the army to fight on; Verdun halted the German offensive (defense of the soil); Camerone upheld the Legion's reputation, which is the strategic asset of the Legion itself.
      *   **Gallipoli (Inadmissible under this principle):** The campaign was a strategic blunder. The evacuation was a retreat, not a salvation of the army in the face of invasion (like Dunkirk). The "Birth of a Nation" is a cultural post-script, not a military necessity. The death served no strategic end, distinguishing it from Verdun or Dunkirk.

  ***

  ### The Next Myth to Discriminate

  To allow an attentive reader to distinguish between **Civic Viability** (which values social cohesion) and **Strategic Integrity** (which values military utility/honor), you should bring **The Stab-in-the-Back Legend (Dolchstoßlegende)** before him next.

  *   **The Myth:** The post-WWI German belief that the army remained undefeated in the field and was betrayed by civilians, socialists, and Jews at home.
  *   **The Discrimination:**
      *   **Under Strategic Integrity:** **Admissible.** It defends the honor and operational record of the military institution (similar to Camerone/Verdun). It asserts that the defeat was political, not martial.
      *   **Under Civic Viability:** **Inadmissible.** It is inherently toxic to a pluralistic polity. It relies on internal exclusion, scapegoating, and grievance (similar to Vidovdan/Alamo). It destroys civic cohesion rather than building it.

  If your narrator rules this **Inadmissible**, the reader will know he is guided by **Civic Viability** (confirming the Gallipoli ruling was about social utility). If he rules it **Admissible**, the reader will realize he is guided by **Strategic Integrity** (implying the Gallipoli ruling might have been an anomaly or that the "Strategic" principle is more forgiving of institutional honor than expected). Given the character's sensitivity to "cheating" and his handling of the French rearguard, the **Inadmissible** verdict on the Stab-in-the-Back is the one that will deepen his moral complexity.
