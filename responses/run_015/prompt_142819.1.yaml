          *   *Instrumentalism/Deflationism (Dennett, Haugeland):* It's a stance we take, not a property they have.
      *   The "Three Conditions" map roughly to:
          1.  Decodability $\rightarrow$ Informational/Correlational.
          2.  Causal Efficacy $\rightarrow$ Functional Role.
