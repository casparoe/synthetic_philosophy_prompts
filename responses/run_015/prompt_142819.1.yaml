  3.  **Synthesizing the Argument:**

      *   *Thesis:* The disagreement is primarily about **explanatory licensing** grounded in competing **ontological commitments**. Pure realism (representations exist independently) is hard to defend given polysemanticity and superposition. Pure instrumentalism (it's all just a lens) undermines the goal of mechanistic interpretability. A "Moderate Realism" based on *Causal Isolation + Specificity* is the strongest position, but it faces the "Distributed Encoding" challenge.
