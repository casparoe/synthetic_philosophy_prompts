answer: |-
  In both Scenario Alpha and Scenario Beta, a engineered pathogen instantly kills all living humans with identical physiological suffering, ensuring the immediate cessation of biological humanity. In Alpha, pre-deployed geothermal-powered server farms and robotic maintenance units activate upon detecting human absence, using stored data and generative algorithms to actively produce new scientific research, art, and ethical deliberations indistinguishable from human output for five millennia, thereby extending all human projects without biological agents. In Beta, the pathogen is followed by a supervolcanic eruption that destroys all infrastructure and digital records, ensuring total erasure of human traces and the absolute termination of all projects.

  For Scenario Alpha, Scheffler's conjecture implies the extinction is nearly as bad as in Scenario Beta, because the "collective afterlife" required to sustain the value of our current activities depends on the existence of future *people* to recognize and carry those values, not merely the automated continuation of outputs. In both cases, the explanatory work is done by the **expectation of future people** (conscious valuers), rather than biological lineage or mere project continuity; since Alpha lacks future people, the precondition for meaning is lost just as in Beta, rendering the survival of projects insufficient to mitigate the badness of extinction.

  A critic could argue that Scenario Alpha removes the badness entirely by claiming that the intrinsic value of human endeavors lies in their content and continuation, not in the biological substrate of their agents. To make this argument succeed, the critic must attack the feature of the case stipulating **the moral significance of the absence of biological successors**, arguing that **project continuity** alone is sufficient to preserve meaning regardless of the lack of conscious future people.
