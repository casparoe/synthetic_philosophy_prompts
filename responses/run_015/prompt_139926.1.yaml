  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a background paper for a constitutional-reform commission that both "Sortitionists" (lottery-based chamber) and "Electoralists" (reformed elected chamber) can sign.
