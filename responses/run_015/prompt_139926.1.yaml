          *   Electoralist: Market shifts to party gatekeepers/staff.
          *   Type: Substantive (mechanism of influence).
      *   *Crux 2: The Sanction Mechanism (Retrospective Accountability).*
          *   Sortitionist: Sanction is unnecessary if selection is representative.
          *   Electoralist: Sanction is essential for alignment.
          *   Type: Substantive (theory of alignment).
      *   *Crux 3: The Locus of Capture (Donors vs. Secretariat).*
          *   Sortitionist: Amateurs resist bureaucrats with expert support.
          *   Electoralist: Amateurs defer to bureaucrats without career leverage.
          *   Type: Substantive (behavioral prediction).
      *   *Crux 4: Verbal Dispute (Definition of Accountability).*
          *   Sortitionist: Accountability = Descriptive Representation (looking like the people).
          *   Electoralist: Accountability = Sanctionability (firing the people).
          *   Type: Verbal (needs re-description to find substantive core).

  5.  **Drafting Section 3: Predictions Ledger:**
      *   Need concrete pilots/thought experiments.
      *   *Pilot 1 (Ex Ante Market):* A simulated lobbying scenario with pre-selected vs. post-selected members.
      *   *Pilot 2 (Bureaucratic Deference):* A mock legislative session with asymmetric information.
      *   *Pilot 3 (Post-Office Behavior):* Tracking career paths of term-limited vs. sortition members.
      *   *Concessions:* What would make each side change their mind?

  6.  **Refining the "Unpredictability Dividend" & Verbal Disputes:**
      *   The prompt asks to specifically address the "Unpredictability Dividend" and the Electoralist reply about secretariat capture.
      *   I need to ensure the "Verbal" dispute section clearly distinguishes between *semantic* disagreement (what does "accountability" mean?) and *substantive* disagreement (does this mechanism produce better outcomes?).
      *   *Insight:* The Sortitionist defines accountability as *ex ante* alignment (selection). The Electoralist defines it as *ex post* alignment (sanction). The substantive question is: Which mechanism produces policy closer to public interest?

  7.  **Review and Formatting:**
