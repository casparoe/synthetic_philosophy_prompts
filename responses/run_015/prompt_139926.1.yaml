          2.  Disagreements Table (Crux, Sortitionist Formulation, Electoralist Formulation, Verbal vs. Substantive, Shared Evidentiary Standards).
          3.  Predictions Ledger (Concrete pilot/case, Sortitionist Prediction, Electoralist Prediction, Concession conditions).
      *   **Specific Content Requirement:** Incorporate the "Unpredictability Dividend" argument (ex ante market in votes vs. relocation of influence) and the Electoralist reply (retrospective sanction, deference to secretariat). Split these into distinct cruxes if necessary (ex ante buying, retrospective sanction, staff vs. donor capture).
      *   **Specific Analysis Requirement:** Identify verbal disputes (definitions of accountability/capture) vs. substantive ones.
      *   **Constraints:** No citations, bibliographies, or references to literature. Arguments must stand on their own.

  2.  **Deconstruct the Core Arguments:**
      *   *Sortitionist View:* Lottery prevents buying votes (unpredictability), removes career incentives (single term), ensures descriptive representation.
      *   *Electoralist View:* Elections provide accountability (sanction), mandate/legitimacy, expertise/motivation. Reforms (term limits, public finance) mitigate corruption.
      *   *The "Unpredictability Dividend":* You can't bribe someone who doesn't exist yet. Term-limited politicians still need future jobs/party favor.
      *   *The Electoralist Counter:* Without re-election, members lack leverage/sanction power. They will defer to bureaucrats (staff capture) instead of donors (external capture).
      *   *Verbal Dispute:* "Accountability" (answerability vs. punishability) and "Capture" (financial vs. bureaucratic).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need substantive points where they overlap.
      *   *Idea 1:* Both systems are vulnerable to influence, just different kinds.
      *   *Idea 2:* Citizen competence is not the primary blocker; institutional design is.
      *   *Idea 3:* Money in politics is a problem for elections; Bureaucratic power is a problem for lots.
      *   *Idea 4:* Term limits alone do not solve the "future career" incentive problem completely.
