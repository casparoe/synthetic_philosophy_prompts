answer: |-
  The file on Ada Sorensen's desk was thick, bound in the pale blue cardstock used for Continuity Reviews. Outside the window, the rain blurred the city into gray smears, but inside the office, the air was filtered and still. Ada adjusted her glasses and opened the folder.

  The top sheet was the Advance Directive of Maren Kask, dated twelve years prior. It was typed in a severe serif font, signed in bold black ink. Below the signature, there was an addendum in Maren's own handwriting, the loops of the letters sharp and pressing deep into the paper. *If I appear content,* it read, *do not count this as consent. Contentment in this state is the pleasure of a person who has forgotten what she was for.*

  Ada ran a finger over the indentation of the words. She knew the weight of such sentences. In her own filing cabinet at home, in a box labeled *Taxes and Estates*, lay a document she had signed twenty-two years ago. She had been twenty-nine then, in the grip of a depression that had lasted eighteen months. She called it the blue year. The directive from the blue year was strict, unforgiving. She had never updated it. She had never wanted to look at it again, yet here she was, judging the distance between two lives for someone else.

  She turned the page to the medical summary. Maren Kask, seventy-one. Former composer. Diagnosis: Early-stage Alzheimer's. Current status: Memory-care residence. Complication: Urinary tract infection, resistant to oral antibiotics, requiring intravenous treatment. Prognosis without treatment: Sepsis, death within ten days. Prognosis with treatment: Return to baseline.

  The Two-Lives Rule hung over the page like a guillotine blade that refused to fall. If this was a decline, a thinning of the self that wrote the directive, the document stood. Maren would not be treated. If this was a second life, a new configuration of concerns unforeseeable to the composer who signed the paper, the directive lapsed. Maren would receive the IV.

  Ada closed the folder and picked up her coat. She had to see the baseline.

  The residence was a brick building surrounded by maples that were just beginning to turn. Inside, the hallway smelled of lemon polish and overcooked carrots. Ada found the activity room where the choir practiced on Tuesdays. She stood in the doorway, clipboard hidden against her side.

  There were twelve residents in a semicircle. A pianist played a simple chord progression. Maren Kask sat in the third row. She wore a cardigan the color of dried lavender. Her hair was white and cut short. She was not staring into space. She was watching the conductor, a young man with a gentle face.

  When the music started, Maren's mouth opened. Her voice was thin but pitch-perfect. She swayed slightly. At the end of the phrase, she tapped her foot. Not randomly. She was tapping the counter-rhythm.

  Ada waited until the session broke. She approached Maren, who was gathering a stack of papers from her lap.

  "Hello, Maren," Ada said. "I'm Ada. I liked your singing."

  Maren looked up. Her eyes were pale blue, clouded at the edges. She smiled, not with the polite masking of a patient, but with a quick, genuine crinkling of the eyes. "Thank you. The alto line is tricky."

  "It is."

  "I fixed it," Maren said. She held up one of the papers. It was a sheet of staff paper, crumpled and smoothed out again. On the staves, someone had written a melody in pencil. It was simple, repetitive. Four notes rose and fell, rose and fell. Then a variation. Then the four notes again.

  Ada recognized the motif. She had listened to Maren's discography while reviewing the case file. The four-note figure was the opening motif of *Winter Glass*, a symphony Maren had composed at forty, during her peak critical acclaim. It was a complex, dissonant piece. This new song was major key, diatonic, childlike. But the skeleton was the same.

  "Did you write this?" Ada asked.

  "Mmm," Maren said. She hummed the four notes. "It fits in the mouth."

  "It fits in the mouth," Ada repeated.

  "It wants to go home," Maren said, tapping the paper. "But it stays here." She touched her chest.

  Ada looked at the paper. This was the artifact of the later self. It was not *Winter Glass*. It was not the work of a composer who demanded structural integrity and dissonance. It was a fragment, repurposed. Was it a ruin, or was it a seed?

  Maren's daughter, Elena, was waiting in the lounge. She was fifty, dressed in practical slacks and a sweater. She looked tired, but not conflicted. She seemed to have accepted that the system would decide.

  "Thank you for coming," Elena said. "She had a good day. The infection makes her sleepy, but today she was bright."

  "Does she know who you are?" Ada asked.

  "Mostly. Sometimes she calls me by my mother's name. Sometimes she doesn't know me at all." Elena folded her hands. "She looks happy, Ms. Sorensen. I know what the directive says. I know what she wrote about contentment. But she is making music. She isn't just waiting."

  "She wrote that contentment wasn't evidence of consent," Ada said. Her voice was flat, professional.

  "I know." Elena looked at her hands. "I just don't want to kill the person who is here because the person who was there is gone. But I don't want to keep the person who was there alive in a body that doesn't know her."

  "There is no verdict yet," Ada said.

  "I know."

  Ada left the residence as the rain intensified. Back in her office, she locked the door. She took out the Continuity Finding form. It had two checkboxes near the bottom. *Directive Binding.* *Directive Lapsed.*

  She uncapped her pen.

  She thought of the blue year. She remembered the feeling of waking up and wishing she hadn't. She remembered signing the paper because she wanted the option to stop if the darkness came back. But the darkness hadn't come back. The woman who signed that paper was a stranger to Ada now. If Ada had a treatable infection today, would she want the directive from the blue year to stop the antibiotics? She would not. She loved her life now. The earlier self had tried to veto the later self.

  But Maren's clause was specific. *Contentment is amnesia.* Maren had anticipated this. She had predicted that she might be happy in a diminished state, and she had commanded that this happiness be ignored. She had valued the integrity of her artistic mind over the biological persistence of her body.

  Ada looked at the photo in the file. The older Maren, in the lavender cardigan, humming the four notes. She looked whole. Not the whole of the symphony, but a whole song.

  Ada looked at the handwritten clause again. *Forgotten what she was for.*

  Had Maren forgotten? She was using the motif. She was building around it. She wasn't remembering *Winter Glass*, but she was using its bones to build a shelter. Was that a decline of the composer, or the evolution of the music?

  The rule required foreseeability. Could the seventy-one-year-old composer have foreseen a woman who hummed simple tunes in a choir? Yes. She had feared it. That was why she wrote the clause. She had foreseen the possibility of a simplified joy and rejected it.

  But the rule also required a recognizably whole life. The choir. The daughter. The song on the staff paper.

  Ada placed the tip of the pen on the paper. The ink bloomed slightly, a tiny black sphere forming before she moved her hand.

  If she checked *Binding*, Maren died. The contentment was invalidated by the past self's command. The integrity of the artist was preserved through death.

  If she checked *Lapsed*, Maren lived. The past self's command was overruled by the present reality. The new life was deemed valid.

  Ada thought of her own file at home. She thought of the woman she was at twenty-nine, who thought she knew what suffering was. She thought of the woman she was at fifty-four, who knew she could survive things the younger woman couldn't imagine.

  She looked at the recording of the choir practice on her desk. She pressed play. The sound filled the small office. The voices were shaky, imperfect. Maren's voice was there, clear on the alto line. She came in early on the third measure, corrected herself, and harmonized.

  Ada stopped the recording. The silence rushed back in.

  She moved the pen to the right side of the form. *Directive Lapsed.*

  She paused. The clause. *Contentment is not to be taken as evidence.*

  She moved the pen to the left. *Directive Binding.*

  She hovered there. The rain tapped against the window. The four-note figure hummed in her head, rising, falling, rising, falling. It wanted to go home, but it stayed here.

  Ada lowered the pen until the nib touched the box. The paper resisted slightly. She pressed down, ready to make the mark that would either save the life in the residence or honor the signature on the page. Her hand remained still, the ink settling into the fiber, the decision suspended in the space between the two selves.
