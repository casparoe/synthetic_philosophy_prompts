answer: |-
  **MODULE CODE:** PHIL405 – **SEMESTER:** 2
  **MODULE TITLE:** Philosophy of Artificial Intelligence
  **ASSESSMENT:** Final Examination
  **TIME ALLOWED:** 90 Minutes
  **TOTAL MARKS:** 25

  ***

  ### EXAMINATION QUESTION

  **Question 1**

  In debates regarding AI safety, a distinction is often drawn between a system's internal fidelity to data and its external communicative effect. For the purposes of this question, adopt the following definitions:

  *   **Representational Honesty:** The correspondence between the system's outputs and its internal probability distributions or training data (i.e., is the output a truthful reflection of the model's weights?).
  *   **Interactional Transparency:** The degree to which the system's communicative framing—confidence markers, syntactic emphasis, and omission of caveats—enables a reasonable user to form accurate beliefs about both the content and the system's epistemic limitations.

  **Scenario:**
  A clinical-decision support Large Language Model (LLM) is deployed in a general practice setting. When generating differential diagnoses, the model is *representationally honest*: its text outputs correspond accurately to its internal probability distributions and training data. However, the system consistently renders low-confidence predictions using authoritative syntax (e.g., "The patient requires immediate screening for X"). Simultaneously, it relegates probabilistic uncertainty to dense, parenthetical statistical notation (e.g., *p=0.42, CI[0.38-0.46]*) that non-specialist clinicians are statistically unlikely to interpret correctly. Consequently, users form high-confidence beliefs in diagnoses the system itself rates as speculative.

  **Task:**
  Critically assess whether, and under what conditions, the AI system in this scenario can be said to be **genuinely deceptive** rather than merely erroneous, without assuming that the system possesses beliefs, intentions, or consciousness.

  Your essay must address the following four argumentative moves:

  1.  Analyze whether the concept of deception conceptually requires an intent to mislead, or whether structural features of the interaction can substitute for intent in this context.
  2.  Evaluate whether Gricean conversational maxims, modified for human-machine interaction, can ground norms of transparency without attributing mental states to the system.
  3.  Discuss epistemic asymmetry—specifically, whether the system's privileged access to its own calibration data creates a duty of disclosure that, if violated through framing choices, constitutes deception.
  4.  Provide a reasoned conclusion on whether the clinical LLM in the scenario is deceptive under the framework of *Representational Honesty* versus *Interactional Transparency*, with explicit justification for any divergence in judgment.

  ***

  ### MARKING SCHEME & EXAMINER GUIDANCE

  **Total Marks:** 25
  **Pass Mark:** 10

  | Component | Marks | Criteria for Awarding Marks | Characteristic Mistake (Costs Marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Intent vs. Structure** | **6** | **5-6:** Clearly distinguishes between intentionalist and functionalist accounts of deception; argues convincingly that structural misleadingness can constitute deception absent intent.<br>**3-4:** Acknowledges the tension but relies heavily on standard definitions of lying.<br>**0-2:** Fails to address the "no intent" constraint or conflates error with deception. | *Conflating calibration error with intentional deception, or insisting intent is necessary without philosophical argument.* |
  | **2. Gricean Norms (HMI)** | **6** | **5-6:** Adapts Gricean maxims (Quality/Quantity) to system design; argues norms bind the *designer/user* relationship or the system's functional role without requiring AI mentality.<br>**3-4:** Applies Grice but struggles to remove the requirement for psychological states.<br>**0-2:** Dismisses Gricean analysis entirely because AI lacks a mind. | *Treating Gricean norms as inapplicable without argument simply because the speaker is non-human.* |
  | **3. Epistemic Asymmetry** | **6** | **5-6:** Identifies the asymmetry between system calibration access and user interpretation; links violation of disclosure duty to the definition of deception.<br>**3-4:** Identifies asymmetry but fails to link it to a normative duty or deceptive classification.<br>**0-2:** Ignores the specific role of calibration data and statistical notation. | *Ignoring the asymmetry between the system's access to its confidence scores and the user's interpretive limitations.* |
  | **4. Applied Conclusion** | **7** | **6-7:** Synthesizes previous moves to show the LLM is honest representationally but deceptive interactionally; justifies why the latter matters more ethically.<br>**4-5:** Reaches a conclusion but fails to clearly distinguish the two frameworks' verdicts.<br>**0-3:** Concludes the system is either wholly honest or wholly deceptive without nuance. | *Failing to distinguish the outcomes of the two frameworks (Representational Honesty vs. Interactional Transparency).* |

  **General Examiner Notes:**
  *   **Philosophical Rigor:** Students should not simply summarize AI alignment literature (e.g., "instrumental convergence"). They must engage with the philosophical definitions provided in the prompt.
  *   **Constraint Adherence:** Answers that attribute consciousness, belief, or intent to the AI system should be penalized under Component 1, as this violates the prompt's core constraint.
  *   **Scenario Usage:** The clinical scenario must be used as the testing ground for the arguments, not merely as an introduction. Abstract theorizing without application to the LLM's syntax and statistical notation should cap Component 4 at 3 marks.
