answer: |-
  You have the instincts of a good experimentalist: you've spotted a signal-to-noise problem in the formalism. You are right to feel that two things you are treating as one are separate.

  The break is in **Step (6)**.

  Specifically, the error is the inference from "weights depend on scaling" to "the theorem is compatible with any distribution of concern." You are conflating the **numerical coefficients** in a specific representation with the **substantive trade-offs** encoded in the social preference ordering.

  Here is the diagnosis, the cost, and the standard exits.

  ### 1. Where the Joint Slipped (Step 6)

  You wrote: *"With the right choice of scales it delivers anything from pure egoism... to strict equal-weight averaging."*

  This is false. You cannot rescale your way out of the constraints imposed by the **Social Preference Ordering** ($\succeq_G$), which is an input to the theorem, not an output.

  Think of it like units in physics. Suppose a law states $F = ma$. I can measure mass in grams or kilograms. If I switch to grams, the numerical value of $m$ goes up by 1000, and the numerical value of the proportionality constant (if there were one) goes down by 1000. But I cannot rescale mass to make the force independent of acceleration. The *relationship* is fixed by the physics, even if the *coefficients* depend on my choice of units.

  In Harsanyi's theorem:
  1.  **Inputs:** Individual preference orderings ($\succeq_i$) and the Group preference ordering ($\succeq_G$).
  2.  **Output:** Utility functions $u_i$ and $V$ such that $V = \sum a_i u_i$.

  The weights $a_i$ are determined by how $\succeq_G$ trades off gains for Person 1 against gains for Person 2.
  *   If $\succeq_G$ is egalitarian, it will be indifferent between a lottery giving Person 1 a gain and one giving Person 2 the same gain (assuming symmetric $u_i$). This forces $a_1 \approx a_2$.
  *   If $\succeq_G$ is egoistic (concerned only with Person 1), it will ignore gains for Person 2. This forces $a_2 = 0$.

  **The Catch:** You claimed you can get "pure egoism" via rescaling. You cannot.
  *   **Pareto Constraint:** Your Step (1) includes the Pareto principle ("whatever every agent weakly prefers, the group weakly prefers"). Pure egoism violates Pareto whenever the ego's preference conflicts with the unanimous preference of the others. Since Harsanyi *assumes* Pareto, egoism is ruled out by the premises, regardless of how you rescale the utilities.
  *   **Positive Weights:** The theorem proves the weights $a_i$ must be **positive** (given Pareto). You cannot rescale a positive number to zero. You can make $a_2$ numerically small by making $u_2$'s scale huge, but you cannot make the *marginal rate of substitution* between Person 1 and Person 2 vanish. The social ordering still "cares" about Person 2; the number just looks small because you stretched Person 2's utility axis.

  So, Step (6) fails because the "distribution of concern" is fixed by $\succeq_G$ *before* you ever write down the equation. The weights merely report that concern in the local currencies of the $u_i$'s. Rescaling changes the currency exchange rate, not the underlying value system.

  ### 2. The Cost of Rejecting (6)

  If you accept that (6) is wrong, you save (7) (the theorem has teeth) and (1) (the proof holds). But you must pay for this coherence.

  **What the theorem is still allowed to claim:**
  It claims that **any** coherent social planner who respects vNM rationality and Pareto *must* act as a weighted utilitarian. It rules out Rawls (Maximin), Prioritarianism (concave transformation of utility), and Sufficientarianism. These violate the Independence or Continuity axioms applied to the group. This is substantial. It says the *structure* of rational aggregation is linear.

  **What it cannot claim (without extra premises):**
  It cannot claim the weights should be **equal**.
  This is the "Unit Problem." Because $u_i$ is unique only up to affine transformation, the statement "$a_1 = a_2$" is meaningless unless we fix the scales of $u_1$ and $u_2$ to be comparable.
  *   If $u_1$ is measured in "hedons" and $u_2$ in "decibels of satisfaction," equal weights don't mean equal concern.
  *   Harsanyi's theorem *alone* is compatible with a dictatorship, provided the dictator's preferences happen to align with the weighted sum (which is trivial if the weight on others is zero, but Pareto forbids zero weights).
  *   Actually, with Pareto, it's compatible with *any* positive weight vector. It doesn't tell you which one is *moral*.

  **The Price:** You must admit that Harsanyi's theorem is not a proof of Utilitarianism (equal weights). It is a proof of **Welfarism** (social goodness depends only on individual utilities) + **Linearity** (aggregation is additive). To get Utilitarianism, you need an extra moral axiom.

  ### 3. The Standard Exits

  Since you are auditing a philosophy seminar, you will encounter three standard ways to handle the "arbitrary weights" problem left over after fixing Step (6).

  **Exit A: The Veil of Ignorance (Harsanyi's Own Move)**
  *   **The Fix:** Add an **Impartiality** axiom. The social planner chooses $\succeq_G$ behind a veil of ignorance, where they have an equal probability of being any agent $i$.
  *   **The Result:** Expected utility maximization behind the veil mathematically forces the weights $a_i$ to be equal (assuming the $u_i$ are normalized to the same scale, e.g., 0 for worst outcome, 1 for best).
  *   **The Cost:** You have imported a moral premise (impartiality/equal probability) that is not contained in the rationality axioms. You are no longer doing pure representation theory; you are doing normative ethics.

  **Exit B: Interpersonal Comparison of Utility (The Measurement Move)**
  *   **The Fix:** Argue that vNM utilities are not just ordinal+cardinal representations of preference, but measurable quantities of welfare (via neuroscience, behavior, etc.) that share a common zero and unit.
  *   **The Result:** If $u_i$ and $u_j$ are measured in the same "welfare units," then the weights $a_i$ have objective meaning. We can then debate whether $a_i$ should equal $a_j$.
  *   **The Cost:** This is empirically contentious. Most economists and philosophers deny we have a "utility meter" that makes interpersonal comparisons scientific facts. It moves the problem from math to psychology/biology.

  **Exit C: Reject the Axioms (The Sen/Broome Move)**
  *   **The Fix:** Accept your Step (7) intuition that Rawls might be right, and conclude that the **Group** should not be required to satisfy the vNM axioms (specifically Independence or Continuity).
  *   **The Result:** If the Group is allowed to violate Independence (e.g., preferences over lotteries depend on the worst-case outcome), Harsanyi's linearity proof collapses. You can have Maximin.
  *   **The Cost:** You lose the powerful machinery of expected utility theory for social choice. You must explain why rationality for an individual implies Independence, but rationality for a group does not. (Sen argues that moral risk is different from empirical risk).

  ### Summary for your Seminar

  You didn't botch the math; you botched the **ontology of the inputs**.

  1.  **Reject (6).** The weights are not free parameters; they are Lagrange multipliers determined by the fixed Social Preference Ordering. Rescaling changes the numbers, not the trade-offs.
  2.  **Keep (7).** The theorem rules out non-linear aggregation (Rawls) because those violate the Group's vNM axioms.
  3.  **The Remainder:** The theorem proves that *if* you are a rational welfarist, you are a weighted utilitarian. It does *not* prove you should be an *equal*-weight utilitarian. That requires an extra ethical premise (like the Veil of Ignorance).

  In diffraction terms: Harsanyi proves the pattern must be an interference pattern (linear sum). He does not prove the slits must be of equal width (equal weights). You can't change the slit widths by just recalibrating the detector (rescaling utility). To get equal widths, you need a physical reason (ethics) to make them equal.
