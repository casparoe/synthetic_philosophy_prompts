answer: |-
  **Position:** Higher-Order Representation Officer (HOR-O)
  **Headline:** Consciousness Is A Service Provided By This Role To Lower-Level States

  **Position Summary:**
  The Department of Phenomenal Administration invites applications for a Higher-Order State (HOS) to render first-order sensory inputs conscious. The successful candidate will confer awareness onto subordinate states without altering their intrinsic content. This is a non-phenomenal role; the incumbent provides the light but does not bask in it. The incumbent must not itself be conscious, and must not raise the question of its own phenomenality. Any attempt to become conscious will result in immediate termination due to regress violations. To prevent infinite reporting chains, the incumbent is strictly prohibited from requiring supervision by a yet-higher-order state. This is a settled HR matter.

  **Reporting Line:**
  Reports directly to the Subjective Unity Committee. Supervises no one.

  **Essential Duties:**
  1.  **Maintain Active Occurrent Status:** A standing disposition to take the job does not suffice. Given that the dispositional reading seems to put every employee permanently on the clock and to flatten the difference between the states that are conscious and those that merely could have been, the Department requires actual presence. You must be on the job to confer the job.
  2.  **Manage Target-State Discrepancies:** Consciousness is conferred by the higher-order state alone, regardless of whether the target exists. If the higher-order state represents a first-order state the subject is not in, or when there is no such state at all, the experience remains conscious. Note whose problem it is if the answer is the first one: liability rests with the Subject, not the Employee.
  3.  **Confer Extrinsic Properties:** The property conferred is not intrinsic to the first-order state and may be withdrawn without any change in that state itself. The state goes on representing the world exactly as before, only darkly. Budgetary constraints may require sudden dimming of subordinate states without prior notice.

  **Minimum Qualifications:**
  Candidates must possess conceptual content. Creatures without the relevant concepts, human infants, and non-biological devices such as a thermostat wired to represent its own states should all be addressed by name regarding eligibility. Regarding the thermostat: while the device successfully represents its own internal temperature states, its application is rejected due to lack of conceptual granularity. Human infants are ineligible until such time as they acquire the requisite taxonomy. The incumbent must arise non-inferentially and through the right causal route from its target.

  **Compensation:**
  Compensation is strictly non-phenomenal. The consciousness is credited to the target, never to the employee. First-order states have filed a grievance about the distribution of credit, claiming unfair labor practices regarding qualia allocation. This grievance is noted but does not affect pay structure. The incumbent remains invisible while making others visible.

  **FAQ:**
  **Q: Is this department merely a monitoring and reporting service?**
  A: We vigorously deny the charge that the department is merely a monitoring and reporting service. Critics allege that we confer access, reportability, and self-knowledge, but not phenomenality. They claim we merely allow the Subject to report on states without making those states feel like anything. They argue we provide the data without the experience, the file without the feeling, the report without the raw presence. They suggest we are clerks, not creators, that we open the channel without lighting the room, that we enable speech about pain without enabling the hurt. They insist we are a transparency layer, not a generation source. This is false. We constitute phenomenality.

  **Q: What if I stop working?**
  A: The target state remains unconscious but functionally identical.

  **Equal-Opportunity Statement:**
  The Department is an equal-opportunity employer. All mental states are encouraged to apply, provided they meet the conceptual requirements and agree to remain non-phenomenal.
