  **Author's Note on von Neumann**
  Your summary of *The Computer and the Brain* is remarkably accurate. Von Neumann did argue that the nervous system is neither purely digital nor purely analog, but utilizes a "statistical technique" where precision is achieved through the organization of imprecise components (claim 2). He also posited that existing mathematics was insufficient to describe neural function (claim 3). The only minor nuance is that von Neumann didn't necessarily say the brain's language *isn't* mathematics, but rather that it requires a *new* kind of mathematics (probabilistic/statistical) rather than the formal logic used in computers. The story above leans into your interpretation—that our current logical notation fails—which is philosophically sound for the sake of the narrative.
