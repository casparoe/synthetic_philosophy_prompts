  10. **Final Polish:** Check against constraints. No lectures. No "Keynes." Focus on the ledgers. Ensure the distinction between Risk (numbers) and Uncertainty (weight) is clear through action.

  *(Final thought on the ending)*: The ending needs to be quiet. The water rising. The Archivist watching. The realization that the "Weight" was right, but the human element failed.

