      *   *Uncertainty:* I don't know the odds, or I don't know the possible outcomes.
      *   *Weight of Argument:* How much relevant knowledge do I have compared to how much I don't know? More evidence = higher weight.
      *   *The Twist:* High weight doesn't mean "true." It means "substantial basis for decision." Low weight means "guessing."
      *   *The Dilemma:* Do you trust the messy, heavy truth (contradictory data) or the clean, light lie (unanimous but thin data)?

  3.  **Character & Setting Development:**
