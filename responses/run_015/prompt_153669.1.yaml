      *   **Artifacts:** Physical ledgers called "Uncertainty Registers."
      *   **Protagonist:** An archivist responsible for maintaining these registers.
      *   **Conflict:** A critical infrastructure decision (seawall vs. storm).
          *   Option A: High weight of evidence, but contradictory testimony.
          *   Option B: Low weight of evidence, but unanimous agreement.
      *   **Theme:** Acting when mathematical expectation is impossible. The human consequence of refusing to quantify uncertainty.
      *   **Constraint:** No expository lectures or direct philosophical citations. Show, don't tell.
      *   **Tone:** Atmospheric, procedural, tense, philosophical but grounded in physical reality.

  2.  **Deconstruct the Philosophy (Keynesian Uncertainty):**
