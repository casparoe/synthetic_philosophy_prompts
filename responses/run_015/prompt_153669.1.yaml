      *   *Wait, one more nuance:* Keynes argues that high weight is better. But if the high weight contains contradiction, does it still hold weight? Yes, because it acknowledges the complexity. Low weight ignores the complexity.
      *   *Let's make the Archivist the pivot.* She sees the truth in the heavy book. The Council fears the heavy book.
      *   *Final Decision:* The Council chooses the Low Weight (Unanimous) path. They abandon the seawall. The storm comes. It is manageable. The city drowns because they left it defenseless, trusting a thin consensus over a thick, messy truth.

  7.  **Writing - Focusing on Texture:**
