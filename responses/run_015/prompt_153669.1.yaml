          *   *Register 74-C (Relocation):* Slim. Everyone agrees it's safer to move, but they admit they don't know the storm's nature. The "Weight" is light because there is little evidence, despite the agreement.
      *   *Scene 3: The Council Chamber.* Elara presents the books. She doesn't give advice; she gives the *state of knowledge*. The Councilors debate. They fear the "Unknown."
      *   *Scene 4: The Decision.* They choose the Low Weight/Unanimous option. Why? Because high weight with contradiction feels like paralysis. Low weight with agreement feels like action. It's a psychological comfort over epistemological rigor.
