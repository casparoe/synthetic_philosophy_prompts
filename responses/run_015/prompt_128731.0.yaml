answer: |-
  **The Scenario**
  The autonomous region of Meridia is governed by an unelected Council of Engineers that maintains strict order and high growth by implementing "Dynamic Crisis Zoning," a system that reallocates resources and property use instantly during economic or environmental shocks. While neighboring Democracy A collapsed into gridlock and eventual state failure trying to legislate the same zoning laws through public debate, Meridia deployed them overnight via decree, having covertly stolen the exact legislative blueprints from A's public records before A's dissolution. Meridian citizens enjoy full property rights, safety, and prosperity without voting, as the Council argues the mechanism works regardless of consent, yet the policy's efficacy relies entirely on the democratic innovation Meridia appropriated rather than any inherent authoritarian advantage in policy design.

  **The Three Views**
  *   **The Performance Theorist:** Endorses Meridia unreservedly. Legitimacy is derived solely from output (prosperity/order); since Democracy A had the same plans but failed to implement them, the authoritarian capacity to *execute* is the decisive variable, making the Council legitimate regardless of the policy's origin.
  *   **The Procedural Democrat:** Rejects Meridia entirely. Legitimacy requires citizens to be authors of the laws they obey; stealing a blueprint does not constitute consent, and the fact that the system works is morally irrelevant if the people lack the right to fire the Council or amend the rules.
  *   **The Liberal (Guardrails):** Accepts the outcomes conditionally but views the regime as inherently unstable. Performance is valuable, but without democratic guardrails (elections, free press), there is no mechanism to ensure the Council continues to copy optimal policies rather than switching to predatory extraction once the "free ride" of democratic innovation ends.

  **Analysis of the Mechanism**
  The feature doing the normative work is the **decoupling of policy innovation from policy implementation**. The thought experiment isolates *design* (democratic) from *execution* (authoritarian) to test whether legitimacy lies in the source of the idea or the ability to enact it. If you remove the copying element, the case breaks for the performance theorist because it reveals authoritarianism as parasitic rather than generative; if Meridia had to innovate internally without democratic feedback loops, it might lack the information processing to design optimal zoning, undermining the claim that authoritarianism produces superior outcomes. Finally, the performance theorist will attack the case for misattributing cause by arguing that **implementation is the true causal factor**: since Democracy A possessed the design but failed, the design itself was insufficient without authoritarian coercion, meaning the regime *did* generate the success by providing the necessary force to realize the blueprint.
