prompt: |-
  Build me a thought experiment on performance legitimacy—like, can prosperity and order actually justify authoritarian rule in a China/Singapore type case? I want a scenario engineered so a pure performance theorist must endorse the authoritarian regime, but a pure procedural democrat must reject it, even though material outcomes are identical. The twist: the regime's success comes entirely from covertly copying policies designed by a neighboring democracy that collapsed trying to implement them—so its not generating prosperity through authoritarian coordination, just free riding on democratic design. Keep it realistic, regional-government level, one paragraph, no gulags—the order should come from genuinely optimal mechanisms like rapid crisis zoning. Then show me what each theory says: the performance view, the procedural view, and a liberal who only accepts performance if democratic guardrails stay in place. Point out which feature does the work, what breaks if you remove the copying element, and how the performance theorist will attack the case for misattributing cause.
