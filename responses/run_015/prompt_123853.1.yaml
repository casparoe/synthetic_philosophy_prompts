          *   If Trade deficits are found to be purely consumption smoothing with no strategic risk, drop Q2.
          *   If Hysteresis is proven false (sectors rebound easily), Q1 becomes less urgent.

      *   *Refining the "Argument with the User":*
          *   Tell them Q3 (Interest) is a red herring. In a fiat world, the central bank sets the short end. Hume's insight about *real* capital scarcity is better handled through the Debt/Trade lens.
          *   Tell them Q1 (Money) is framed too narrowly. It's not about inflation; it's about *de-industrialization*.
          *   Tell them Q5 (Luxury) is irrelevant for the Finance Ministry brief.

      *   *Specific Advice on the "Finance Ministry" Output:*
          *   They don't care about Hume. They care about "Risk of Sovereign Stress" and "Strategic Autonomy."
          *   The project must translate Humean "Public Credit" into "Fiscal Space for Emergencies."
          *   The project must translate Humean "Jealousy" into "Supply Chain Resilience."

  6.  **Finalizing the Plan:**

      *   **Project 1 (Priority): The Capacity Constraint on Public Debt.** (Reframes Q4). Focus: Debt service crowding out *state action*, not just private investment.
      *   **Project 2 (Priority): Strategic Vulnerability in Trade.** (Reframes Q2). Focus: When does a deficit imply dependence that can be weaponized?
      *   **Project 3 (Priority): Hysteresis in the Tradable Sector.** (Reframes Q1). Focus: Is the "long run" dead? If you lose manufacturing, is it gone forever?
      *   **Drop:** Q3 (Interest - derivative), Q5 (Luxury - normative).

      *   *Ordering:* 1 -> 2 -> 3.
      *   *Why:* Debt is the most immediate "state destruction" risk (Hume's core fear). Trade vulnerability is the second most immediate (security). Hysteresis is the theoretical justification for why the long-run neutrality fails.
      *   *Kill Switches:* If sovereigns with own currency show zero inflation/constraint risk, Q1 drops. If global supply chains prove robust to shocks, Q2 drops.

  7.  **Review against Constraints:**
