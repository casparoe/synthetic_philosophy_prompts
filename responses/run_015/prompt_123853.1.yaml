      *   **Task:** Select/rank 3-4 questions from the user's list (or reframe them), order them, justify the ordering based on upstream/downstream logic and tractability, and specify "kill criteria" (what findings would shift priorities).
      *   **Tone:** Argumentative, rigorous, pragmatic, no fluff/reading lists.

  2.  **Evaluate the User's Proposed Questions:**

