  5.  **Drafting the Argument (Iterative Process):**

      *   *Intro:* Acknowledge the ambition. It's a "Neo-Humean Policy Framework."
      *   *Ordering:* Debt -> Trade -> Adjustment.
      *   *Reasoning:* Debt is the immediate killer. Trade is the structural vulnerability. Adjustment is the theoretical underpinning.
      *   *Tractability:* Q4 is conceptual/legal/political (good for philosophers/political economists). Q2 is geopolitical/industrial (good for case studies). Q1 is macro/structural (hardest, needs econ skills).
      *   *Kill Criteria:* What changes the ranking?
