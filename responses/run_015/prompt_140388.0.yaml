answer: |-
  You say the spring was wound before your birth,
  The escapement locked, the balance wheel concealed.
  No gap between the impulse and the mirth,
  Just brass on brass where conscience stood revealed.
  Thirty-eight years of oiling down the urge,
  But twenty-two made all the structure reel.
  A perfect circuit, nowhere to diverge,
  No ghost inside the casing left to feel.
  But clocks do not wake trembling in the night,
  Then who is frightened staring at the face?
  Cold metal cannot claim the act its own.
  You claim the mechanism laid the trace,
  Yet you disown the blood inside the bone.
  You are the gear, the hand, the flesh, the stone.

  The poem commits to compatibilist ownership: freedom is being the source, even if determined. It cheats by halting the causal regress at the skin's edge, ignoring that you didn't choose your gears. A skeptic would argue this defines responsibility away rather than solving it.
