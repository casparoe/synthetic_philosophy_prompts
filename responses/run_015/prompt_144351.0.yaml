      *   *Check:* Did I separate Intrinsic vs. Instrumental? Yes.
      *   *Check:* Is the CoT faithfulness trap addressed? Yes, by framing it as signal robustness rather than mechanistic interpretability.

  5.  **Final Polish:** Ensure the tone is confident and the structure is grant-ready (Title, Abstract/Question, Motivation, Method, Deliverables, Risks/Scope). *Self-correction: Ensure the distinction between "step checkable without outcome" and "step predictive of outcome" is clear.*

  6.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).
answer: |-
  **Project Title:** The Horizon of Credit: Process Supervision as Short-Horizon Outcome Optimization

  **Core Research Question**
  Does there exist a class of tasks where intermediate step correctness is definable *without* appeal to final outcomes, and does process supervision outperform outcome supervision *only* within this class?

  **Motivation & Problem Statement**
  Current debates frame process vs. outcome supervision as a trade-off in feedback efficiency (performance per human hour). This framing obscures the structural problem of credit assignment. I propose the **Terminal Judgment Problem**: every supervision scheme bottoms out in a judgment not supervised by the same standard. A process supervisor grading step $t$ is either (1) implicitly predicting whether step $t$ leads to a good final answer (outcome supervision with a short horizon) or (2) applying a local notion of quality defined without reference to outcomes.

  Case (1) suggests process supervision is merely a variance-reduction technique for sparse rewards. Case (2) risks Goodharting: models may learn to emit locally impeccable reasoning that is globally useless. The standard literature conflates two distinct goals: **Instrumental Process Supervision** (steps as a proxy for better outcomes) vs. **Intrinsic Process Supervision** (steps as the value object, e.g., for auditability). These fail in different ways. Instrumental supervision fails if the model learns to fake legible reasoning; Intrinsic supervision fails if local correctness decouples from global utility. This proposal focuses on the Instrumental case, where the "efficiency" claim is strongest.

  **Methodology (4 Months, Low Compute)**
  I will construct a family of synthetic reasoning tasks varying along one dimension: **Decomposability**.
  1.  **High-Decomposability Tasks:** Multi-step arithmetic or symbolic logic where step validity is mathematically checkable without knowing the final solution (e.g., "Is this substitution valid?" vs. "Is the final answer correct?").
  2.  **Low-Decomposability Tasks:** Constraint satisfaction or search problems where a step's value is only visible in retrospect (e.g., a move in a puzzle that looks neutral but enables a solution 5 steps later).

  Using small open-weight models (e.g., 7B parameter class) or API-based agents, I will train policies under three regimes: Outcome-only, Process-only, and Hybrid. Crucially, I will artificially constrain the "horizon" of the process supervisor to measure performance as a function of lookahead depth.

  **Deliverables**
  1.  **The Supervision Horizon Curve:** A plot mapping task decomposability against the optimal supervision horizon (0 = outcome, 1 = full process).
  2.  **Decision Guide:** A heuristic for practitioners: "If your task intermediate artifacts are independently checkable, use process supervision; if they are only retrospectively valuable, outcome supervision is robust to Goodharting."
  3.  **Open Source Testbed:** The synthetic task suite for future benchmarking.

  **Negative Results & Falsification**
  This frame is wrong if:
  1.  Process supervision outperforms outcome supervision on **Low-Decomposability** tasks. This would imply process supervisors can reliably grade steps based on latent potential rather than outcome prediction or local validity, contradicting the Terminal Judgment hypothesis.
  2.  The optimal horizon is always binary (either 0 or 1). This would suggest no continuous trade-off exists.
  3.  **The CoT Faithfulness Collapse:** If step-level grading proves impossible without verifying the model's internal mechanism (i.e., we cannot distinguish "correct reasoning" from "correct-sounding text" without interpretability tools), then the problem is not about supervision horizons but about mechanistic transparency.

  **Scope & Risks**
  A significant risk is collapsing into the existing debate on Chain-of-Thought (CoT) faithfulness. To avoid this, I will not attempt to verify if the model "actually" reasons via the generated text. I will treat the reasoning trace as an action space. The question is not "Is this reasoning faithful?" but "Is a reward signal based on this text robust to optimization?" If the model learns to game the process reward without solving the task, that is a valid data point regarding the fragility of process supervision, not a confound. The scope is limited to instrumental value; I will not address intrinsic safety/auditability benefits except as a caveat. Four months allows for the construction of the testbed and one full training/evaluation cycle across the task family.
