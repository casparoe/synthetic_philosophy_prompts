  For the Lewisian, individuals are world-bound, so Elena literally exists in neither world; however, the counterpart relation is determined by weighted similarity, prioritizing psychological continuity for persons. Thus, the W1 patient is a strong counterpart (preserving psychology), while the W2 patient is a weak counterpart (losing psychology), meaning Elena "survives" in W1 only in the derivative sense of having a close counterpart. For the Kripkean, transworld identity is strict and governed by origin essentialism; since the W1 patient lacks Elena's biological brain origin, she is not Elena, whereas the W2 patient retains the original brain, making her literally Elena despite the psychological overwrite. The single feature doing the separating work is psychological continuity for Lewis versus biological/constitutional continuity for Kripke. If both continuities are jointly satisfied (as in normal life) or jointly broken (as in death), both theories yield congruent verdicts on survival; the distinction only manifests when these continuities diverge. Finally, the counterpart theorist attacks the essentialist's brain-boundary as an arbitrary modal limit that ignores what matters in survival, while the essentialist replies that counterpart relations are too permissive, conflating qualitative similarity with the all-or-nothing nature of genuine identity.
