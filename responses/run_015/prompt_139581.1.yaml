answer: |-
  **The Audit**

  **Auditor:** "Item four: The Shadow Market on the rejected light-rail line. Since the line was never built, there are no ridership numbers. What data resolved the counterfactual?"

  **Mechanism Designer:** "Per the charter, the Expert Panel's retrospective judgment."

  **Auditor:** "And the traders? They must have hedged against the Panel's bias."

  **Mechanism Designer:** "They did better. They realized the Panel's charter requires them to consider 'all available market signals' when estimating the counterfactual. So the market price became the primary evidence for the judgment that settles the market price."

  **Auditor:** "So the market didn't predict the policy outcome."

  **Mechanism Designer:** "No, it predicted its own settlement condition. We achieved a perfect fixed point. Your friend was right: it is a focus group with odds. We just made the focus group the oracle."

  ***

  **Feature Exploited:** This joke turns on the **unresolvable counterfactual** combined with the **oracle dependency**. Because the rejected policy never happens, the "truth" is defined solely by the settlement mechanism (the Expert Panel). When the market knows the Panel uses market data to form that judgment, the market stops predicting reality and starts predicting the Panel's interpretation of the market.

  **Why it fails for voting/polls:** In ordinary elections, the winning policy is implemented and observed; there is no financial contract settled on a *judgment* of what the losing policy *would have* achieved. Voting selects a reality; this mechanism bets on a ghost, making the "truth" endogenous to the betting structure itself.
