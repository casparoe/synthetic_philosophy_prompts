answer: |-
  **Project Title:** Control Ceilings and Capability Floors: Rereading Von Neumann's Pessimism Through Automata Theory

  **The Question**
  Standard scholarship treats John von Neumann's pessimism about technological survival as a political argument. In essays like *Can We Survive Technology?* (1955), he argues that the geopolitical environment is too small for the weapons we can build; therefore, arms races are inevitable without supranational control. This is read as a game-theoretic claim: the payoff structure forces escalation.

  This project asks a determinate structural question: **Is von Neumann's destabilization argument fundamentally game-theoretic (contingent on political actors) or automata-theoretic (necessary due to computational constraints)?** Specifically, does his case for supranational control rely on the instability of human agreements, or does it rely on the intersection of two threshold results from his parallel work on self-reproducing automata?

  **The Gap**
  Existing literature silos von Neumann's work. Historians of strategy analyze his policy essays; historians of computing analyze his *Theory of Self-Reproducing Automata*. The standard reading leaves open the possibility that the political pessimism is merely an analogy for the technical results. Most scholars assume the automata work is separate technical groundwork, missing that it may provide the structural engine for his political conclusions. If the automata thresholds are doing the heavy lifting, the argument shifts from "we need better treaties" to "verification is computationally bounded." This distinction changes how we apply his thought to modern AI governance.

  **Methodology**
  I will employ **rational reconstruction** rather than pure exegesis or formal modeling.
  *   **Why not close reading?** Textual analysis alone cannot verify the logical dependency between the automata thresholds and the political claims. Von Neumann often hinted at connections without formally deriving them.
  *   **Why not formalization?** Re-proving the threshold theorems is unnecessary and risks losing the philosophical claim. The goal is not to validate the math, but to validate the *argumentative structure*.
  *   **Why rational reconstruction?** This method allows me to test whether the political argument holds water *if* the automata thresholds are treated as premises. It bridges the gap between the technical lemmas and the policy conclusions without getting bogged down in proofs.

  **Work Plan (12 Weeks)**
  *   **Weeks 1–4: Textual Audit & Logical Mapping.** I will annotate the key policy essays (*Can We Survive Technology?*, *The Scientist and the Future of the Race*) alongside the 1956 Hixon Symposium lectures and the 1966 *Theory of Self-Reproducing Automata*. The deliverable is a mapping document linking specific phrases in the policy essays to the two threshold results: (1) the complexity threshold for open-ended evolvability (description used actively/passively) and (2) the reliability threshold where redundancy fails above a critical error probability.
  *   **Weeks 5–8: Argument Construction.** I will draft the core argument: that Threshold 1 ensures capability escalates without limit, while Threshold 2 ensures checking mechanisms hit a hard ceiling. I will test this reconstruction against counter-arguments from the literature (e.g., Wigner, Wiener) to ensure it distinguishes von Neumann's view from contemporaries.
  *   **Weeks 9–12: Writing & Presentation.** Finalizing the 5,000-word paper. I will prepare the workshop talk, focusing on the "control paradox" visualization. Time is reserved for peer feedback on the draft during Week 10.

  **Outcomes and Failure Conditions**
  A **positive result** demonstrates that von Neumann's call for supranational control is not just about preventing war, but about overcoming a verification bottleneck inherent to complex systems. The paper would argue that without external control, the system inevitably breaches the reliability threshold.

  A **negative result** acknowledges the honest possibility that the threshold material is just decorative analogy—that von Neumann used automata language to dress up a standard political realist argument. In this case, the **fallback contribution** is a definitive clarification of the discontinuity in his thought. Showing that the math does *not* support the policy claim is still a significant scholarly correction, preventing future misappropriation of his technical work for political theory.

  **Scope Risks**
  The primary risk is technical drag. The literature on reliable automata is dense; I could easily spend three months just untangling the error-probability proofs. To mitigate this, I will treat the threshold results as established lemmas rather than problems to be solved. A secondary risk is over-interpretation; I must ensure I am not attributing a unified theory where von Neumann only saw loose connections. I will mitigate this by adhering strictly to the textual mapping in Weeks 1–4; if the textual links are not there, I will pivot to the fallback contribution immediately rather than forcing the synthesis.
