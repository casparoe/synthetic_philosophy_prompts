answer: |-
  Right, let's unpack this properly before we settle on the details, because the trick here is ensuring the mechanism isn't just a gimmick but actually alters the moral geometry. We need a situation where the individual's burden is genuinely rejectable in isolation—like missing a break or enduring noise—but the consequence of their rejection is catastrophic and singular. If we make it a standard public good problem, your contribution is negligible, which invites aggregation; we need to force a one-to-one comparison between your burden and the victim's life. The 'silent veto' is the lever that does this: it makes every individual causally pivotal, transforming a collective action problem into a series of individual life-or-death choices. Here is the scenario constructed to those specifications.

  Consider a specialised intensive care unit at St Thomas' Hospital, where a unique, life-saving dialysis procedure for a single patient requires absolute acoustic stability across the entire building grid. To achieve this, ten thousand staff and visitors must each wear a restrictive haptic collar for thirty minutes that causes genuine physical discomfort and prevents them from taking their scheduled breaks, yet the system is engineered with a fail-safe such that if even one individual removes their collar before the timer ends, the pressure equilibrium collapses and the patient dies immediately. Each person is informed that their participation is individually pivotal, meaning their personal choice to opt out due to the discomfort functions as a silent veto that singularly determines the patient's survival, leaving no room for partial contribution or collective dilution of responsibility.

  Now, let's walk through the moral machinery. A straight-up aggregative theory like utilitarianism calculates the net outcome: ten thousand units of moderate discomfort versus one human life. Provided the discomfort doesn't cross a threshold of severity that outweighs death (which, by your specs, it doesn't), utilitarianism demands everyone wear the collar. The veto mechanism is irrelevant to the calculus; only the sum total of harm matters. Scanlon's contractualism, however, looks at justification. It asks whether a principle permitting this requirement could be reasonably rejected. Normally, Scanlon is wary of aggregating many small complaints to override one large one. However, because of the veto, this isn't an aggregation case. The patient can reasonably reject a principle that allows any individual to veto their survival for the sake of minor comfort. Conversely, can a staff member reasonably reject a principle requiring them to endure discomfort to prevent a death they would directly cause by opting out? Scanlon would likely say no, because the comparison is now one-to-one: my thirty minutes of pain versus your life. The justification doesn't rely on summing the other 9,999 burdens; it relies on the direct causal link between my veto and your death.

  The structural feature doing the heavy lifting here is the **veto** (which creates individual pivotality). This is the engine that prevents the scenario from collapsing into a standard aggregation problem. If you strip away the veto—meaning the procedure succeeds as long as, say, 90% participate, so my individual opt-out makes no difference to the outcome—the moral landscape shifts dramatically. Without the veto, my burden no longer saves the person; it merely contributes to a collective effort. In that stripped-back version, Scanlon's framework struggles: I can reasonably reject being burdened because my rejection doesn't kill the patient (someone else might save them), and the justification for forcing me now relies on aggregating my burden with everyone else's to achieve the good. That is precisely where contractualism usually blocks the imposition, arguing that many small complaints cannot easily outweigh one person's vital interest unless there is a direct, non-aggregative justification. So, without the veto, the case collapses back into a bog-standard aggregation dilemma where contractualism might actually protect the many from the burden, potentially letting the one die, whereas the veto forces a direct individual duty that saves the one.
