answer: |-
  The apparatus you describe is not metaphysically neutral, but it is not metaphysically consistent either. It is a policy compromise that has hardened into a pseudo-metaphysics. To answer your question directly: current US medical-legal practice presupposes a **Neuro-Somatic Integration View**. It treats the human being as a biological organism whose *life* is defined not by cellular metabolism alone, but by the brain's capacity to function as the body's integrator.

  Here is the reconstruction of the implicit theory, the separation of substance from administration, and the verdict on the three rival views.

  ### 1. The Implicit Theory: Neuro-Somatic Integration

  Current practice does **not** presuppose Psychological Continuity. If it did, your grandmother would be legally dead or her prior directives would be void, as the psychological connections binding her to her past self are severed. The fact that her advance directive binds her body proves that the law prioritizes *biological continuity* over *psychological continuity* for the assignment of rights.

  Current practice does **not** presuppose the Organism View (Biological Life). If it did, your uncle would be alive. His cells were metabolizing, his heart was beating, and his homeostasis was maintained (via technology). Declaring him dead while warm and perfused is a direct rejection of the idea that metabolic life equals human life.

  Instead, the practice presupposes that **the brain is the critical organ of the organism.** Specifically, it relies on a distinction between *higher brain function* (consciousness, memory, personality) and *brainstem function* (somatic integration, breathing, sleep-wake cycles).
  *   **Your Uncle (Brain Dead):** Lost *all* brain function, including the brainstem. The body is no longer integrating itself; the ventilator is. The organism, as a self-integrating whole, has ceased to exist.
  *   **Your Grandmother (Alzheimer's):** Lost *higher* brain function, but retained *brainstem* function. She breathes, digests, and cycles through sleep. The organism is still self-integrating. Therefore, she is alive.

  **The Implicit Metaphysic:** You are alive as long as your brain retains the *capacity* to integrate your bodily functions, even if it has lost the *content* of consciousness. Death is the loss of the biological integrator, not the loss of the person.

  ### 2. Substantive vs. Administrative

  You asked where the practice is doing genuine metaphysical work versus administrative convenience.

  **Substantive Commitments (Cannot be dropped without collapsing the system):**
  *   **The Brain as the Seat of Death:** The claim that a beating heart does not signify life if the brain is gone. This is the core metaphysical move that allows organ donation from "heart-beating cadavers."
  *   **The Binary Switch:** The law requires a moment of death. It rejects degrees. You are either a rights-bearing person or a corpse. This is why the "permanence" standard in circulatory death is legally treated as "irreversibility." Once the line is crossed, the status change is absolute.
  *   **Biological Continuity for Rights:** The claim that the demented organism is the same legal entity as the healthy ancestor. This preserves the validity of advance directives and inheritance.

  **Administrative Convenience (Could be changed without metaphysical collapse):**
  *   **The 5-Minute Wait (Circulatory Death):** This is purely risk management. It is there to prevent auto-resuscitation (the Lazarus phenomenon) and protect doctors from liability, not because metaphysics changes at minute 5.
  *   **Whole Brain vs. Brainstem:** Some jurisdictions require whole brain death; others accept brainstem. This is a diagnostic variance, not a metaphysical one. Both aim to confirm the loss of integrative capacity.
  *   **The Dead Donor Rule (DDR) Wording:** The rule states organs cannot be taken from the living. In practice, the definition of "living" is adjusted to allow the taking. The *rule* is substantive (protecting patients), but its *application* to brain-dead donors is a legal fiction maintained to preserve public trust.

  ### 3. The Three Rivals: What Would Have to Change?

  If we forced the legal-medical apparatus to align strictly with one of the three rival views you listed, the following changes would be mandatory.

  #### A. The Organism View (Biological Life = Human Life)
  *Theory:* You are alive as long as the organism is metabolically functioning.
  *   **Impermissible:** Harvesting vital organs from brain-dead donors. Since your uncle's organism was metabolically active (heart beating, oxygenating blood), removing his heart would be killing a living human. This would collapse the current supply of transplant organs by roughly 40-50%.
  *   **Mandatory:** Life support must be maintained for brain-dead patients until their heart stops naturally or cellular death occurs.
  *   **Collapses:** The distinction between "brain dead" and "persistent vegetative state." Both are alive. The only distinction is prognosis.
  *   **Verdict:** This view is strictly ruled out by current practice. The current system *depends* on the claim that a beating heart can be a corpse.

  #### B. Strict Psychological Continuity (Lockean/Parfitian Personhood)
  *Theory:* You exist only where there is memory, character, and intention.
  *   **Impermissible:** Enforcing your grandmother's advance directive. If the psychological connection is severed, the "person" who wrote the directive is gone. The demented organism is a new entity or a non-person. Binding it to the past person's wishes is a violation of the current organism's interests (or irrelevant).
  *   **Mandatory:** Your grandmother would likely qualify as dead (or a non-person) upon the loss of capacity to form intentions. Her estate could be distributed; her spouse could remarry. Her body could potentially be used for organ donation (if the organism view is also rejected) or research without the same constraints.
  *   **Collapses:** The distinction between "dementia" and "brain death." Both represent the end of the person. The only reason to keep the dementia patient on life support would be utilitarian (resource use), not moral (rights).
  *   **Verdict:** This view is strictly ruled out by current practice. The law fiercely protects the biological continuity of the demented patient *as* the original person, explicitly rejecting the psychological criterion for legal identity.

  #### C. Degreed Survival (No Further Fact)
  *Theory:* Identity is not binary; survival is a matter of degree (connectedness).
  *   **Impermissible:** The binary legal declaration of "Death." You cannot issue a death certificate, probate a will, or authorize an autopsy on a gradient.
  *   **Mandatory:** A total overhaul of the legal code to accommodate partial personhood. Rights would dilute over time. Organ harvesting might become permissible at "Stage 4 Identity Loss" even if biological integration remains. Inheritance would trigger partially.
  *   **Collapses:** The Dead Donor Rule. If survival is degreed, "dead" is a meaningless category. The rule would have to change to "Do not harvest organs if sufficient psychological/biological connectedness remains."
  *   **Verdict:** This view is incompatible with *any* current legal system. Law requires binary states (liable/not, dead/alive, married/single). Adopting this view would require abandoning the current legal framework entirely, not just tweaking medical definitions.

  ### 4. Verdict on Coherence

  Is the whole thing coherent? **No.**

  It is **pragmatically functional** but **metaphysically hybridized to the point of contradiction.**

  The inconsistency lies here: The system claims that *biological continuity* is what matters for rights (Grandma is still Grandma), but *neurological function* is what matters for life (Uncle is dead).
  *   If biological continuity matters for rights, why does it not matter for life? (Why is the uncle not a living human with rights?)
  *   If neurological function matters for life, why does the loss of *personality* neurology (Grandma) not count as death, while the loss of *integrative* neurology (Uncle) does?

  The system resolves this by smuggling in a **functionalist definition of the organism.** It claims the "human organism" is not just meat, but meat directed by a brain. When the brain stops directing (Uncle), the organism is dead, even if the meat is warm. When the brain stops *remembering* but keeps directing (Grandma), the organism is alive.

  This is a stable distinction for *biology* (brainstem vs. cortex), but it is unstable for *personhood*. It treats your uncle as a "former person" (dead) and your grandmother as a "current person" (alive), even though the uncle likely retained more of his *psychological identity* (up to the moment of hemorrhage) than your grandmother retained in her final year.

  **The Cash Value:**
  The system is designed to maximize organ availability while minimizing legal risk.
  1.  **Brain Death** was adopted largely to facilitate transplantation (moving the time of death earlier to preserve organs).
  2.  **Dementia Protections** exist to protect property rights and prevent abuse of the vulnerable.

  The "metaphysics" is a retroactive justification for these goals. It is coherent enough to keep hospitals running and courts from exploding, but it cannot withstand Parfitian scrutiny. It asserts that identity is biological (for dementia) and neurological (for death) depending on which assertion yields the desired ethical outcome.

  **Final Answer:** The practice strictly rules out the **Organism View** (by declaring beating-heart patients dead) and the **Psychological Continuity View** (by granting full rights to the demented). It creates a **Neuro-Somatic Hybrid** that is administratively robust but metaphysically arbitrary. If you want coherence, you must choose: either your uncle was alive (Organism View, lose the organs) or your grandmother was dead (Psychological View, lose the rights). You cannot have both.
