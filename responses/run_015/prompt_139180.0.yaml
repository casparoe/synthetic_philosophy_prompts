      *   *Dementia/vegetative state:* Alive, legal person, rights intact, cannot harvest vital organs.
      *   *Cryonics:* Head-only preservation (implies brain is the seat), continuity of contract (implies legal identity survives legal death).

  3.  **Identify the Implicit Theory:**
      *   Is it Psychological Continuity?
          *   *Grandmother (Alzheimer's):* No psychological continuity (memory, character gone). Yet treated as *alive*. -> Practice *rejects* strict psychological continuity as the criterion for *life/death*.
          *   *Uncle (Brain Dead):* No brain function, so no psychology. Treated as *dead*.
          *   *Conflict:* If psychology matters, Grandma should be dead (or close to it). If biology matters, Uncle should be alive.
      *   Is it the Organism View (Biological Life)?
          *   *Uncle:* Organism is metabolically active (heart beating, warm). Yet treated as *dead*. -> Practice *rejects* pure organism view for the definition of death.
          *   *Grandma:* Organism is alive. Treated as *alive*. Consistent.
      *   Is it "Brain as Seat of Personhood" (Lockean-ish but biological)?
          *   The practice seems to hinge on the *brain's capacity to function as an integrator* or the *seat of consciousness*, not necessarily actual consciousness.
          *   *Brain Death:* The "integrator" is gone. The body is a collection of tissues kept going artificially.
          *   *Dementia:* The "integrator" (brainstem/homeostasis) is working, even if the "personality" (cortex) is degraded.
      *   *Synthesis:* The practice presupposes a **Hybrid View**: Biological life is necessary but not sufficient. *Brain-mediated integration* is the necessary condition for human *personhood/life* in the legal sense. It treats the brain as the critical organ for the "human being" vs. "human body" distinction. It is *not* psychological continuity (memory/self-narrative), but rather *neurological capacity*.

  4.  **Evaluate Coherence:**
      *   *The Tension:* The "Dead Donor Rule" vs. "Brain Death." If the body is warm and beating, calling it "dead" is a legal fiction to allow organ harvesting.
      *   *The Dementia Tension:* If brain function matters, why does severe cortical loss (dementia) count as alive while total brain loss counts as dead?
      *   *Resolution in Practice:* The distinction is *Brainstem/Integrative Function* vs. *Cortical Function*. Brain death = loss of brainstem (no breathing, no integration). Dementia = intact brainstem (breathing, sleeping, waking cycles), damaged cortex.
      *   *Coherence Verdict:* It is *pragmatically* coherent (serves the goal of organ procurement + protecting vulnerable living humans) but *metaphysically* unstable. It relies on a specific definition of "death" that doesn't match common intuition (beating heart) nor strict biology (cellular life).

  5.  **Analyze the Three Rival Views (Impact on Practice):**

      *   **View 1: The Organism View (Biological Life = Human Life)**
          *   *Theory:* You are alive as long as the organism is metabolically functioning.
          *   *Impact:*
              *   Brain-dead donors (beating heart) are *alive*.
              *   Harvesting heart/liver = Killing/Murder.
              *   Organ donation from brain-dead patients becomes impermissible (unless we change the Dead Donor Rule, which is legally entrenched).
              *   Dementia patients: No change (still alive).
              *   Circulatory death: Must wait until cellular death, not just heart stop.
          *   *Collapse:* The distinction between "brain dead" and "vegetative" collapses into "alive."

      *   **View 2: Strict Psychological Continuity (Parfitian/Lockean)**
          *   *Theory:* You exist only where there is memory, character, intention.
          *   *Impact:*
              *   Grandmother (Alzheimer's): No continuity. She is *dead* (or the person is gone).
              *   Advance directives: Why bind the "new" organism to the "old" person's wishes?
              *   Organ donation: Grandma becomes a viable source (if we ignore the organism view).
              *   Brain Dead: Still dead (no psychology).
              *   *Collapse:* The distinction between "dementia" and "brain death" collapses into "personhood lost."
              *   *Legal Chaos:* Inheritance triggers early. Spouses can remarry.

      *   **View 3: Degreed Survival / No Further Fact (Parfit)**
          *   *Theory:* Identity isn't binary. Survival is a matter of degree (connectedness).
          *   *Impact:*
              *   Law hates degrees. Law needs binary (dead/alive, liable/not).
              *   To adopt this, law must abandon the binary switch.
              *   *Practice Change:* "Death" becomes a gradient. Organ harvesting might be permissible at "Stage 4" of identity loss, even if biological functions remain.
              *   *Grandmother:* She is "partially" there. Rights are diluted, not absolute.
              *   *Uncle:* He is "mostly" gone.
              *   *Administrative Nightmare:* Courts can't handle "70% dead."
              *   *Collapse:* The binary legal status of "death" dissolves.

  6.  **Refining the "Implicit Theory" of Current Practice:**
      *   It's not Psychological Continuity. (Grandma is alive).
      *   It's not Pure Organism. (Uncle is dead).
      *   It is **Neurological Integrative Function**. The law treats the *capacity for consciousness and somatic integration* as the threshold.
      *   *Crucial Nuance:* It distinguishes between *higher brain* (personhood) and *whole brain* (life). Actually, US law is "Whole Brain." But in practice, "Whole Brain" death implies the loss of the brainstem, which stops somatic integration. Dementia patients retain brainstem function.
      *   *So:* The practice presupposes that **Somatic Integration mediated by the Brainstem** is the necessary condition for the life of the human organism, but **Legal Personhood** attaches to the organism as long as *any* brain function persists (even if cortical is gone).
      *   *Wait, correction:* If it were just somatic integration, a body on a ventilator (brain dead) is integrated by the machine. The law says the *brain* must integrate.
      *   *Better formulation:* The practice presupposes **Vital Organismalism centered on the Brain**. The human being *is* the organism, but the organism's *life* is defined by the brain's ability to direct it. Once the brain stops directing (even if machines do), the organism is dead. However, mere *personality* loss (dementia) doesn't kill the organism.
      *   *Substantive vs. Administrative:*
          *   *Substantive:* Brain death = Death. (Metaphysical claim: Brain is the seat of life).
          *   *Administrative:* The 5-minute wait after circulatory stop (Permanence vs. Irreversibility). This is purely to prevent auto-resuscitation and legal liability, not metaphysics.
          *   *Substantive:* Dementia patients retain rights. (Metaphysical claim: Biological continuity preserves moral status even without psychological continuity).

  7.  **Drafting the Response:**
      *   *Tone:* Analytical, direct, respecting the user's rationalist background (Parfit references), avoiding academic fluff.
      *   *Structure:*
          1.  Diagnosis of the Implicit Theory (The "Neuro-Organismic Hybrid").
          2.  Substantive vs. Administrative distinctions.
          3.  The Three Rivals (Organism, Psychological, Degreed) -> Specific Practice Changes.
          4.  Coherence Verdict.

      *   *Self-Correction on "Psychological Continuity":* Be careful. The user knows Parfit. Parfit says identity doesn't matter, *survival* matters. Current practice treats the Alzheimer's patient as the *same legal person*. This contradicts strict Psychological Continuity (where the person is gone). It aligns more with Biological Continuity *unless* the brain is totally dead.
      *   *Refining the "Implicit Theory":* It's actually a **Two-Tier View**.
          *   Tier 1 (Death): Whole Brain Failure. (Biological integration is lost).
          *   Tier 2 (Personhood/Rights): Biological Organism Continuity (as long as Tier 1 isn't triggered).
          *   *Inconsistency:* Why does Tier 1 trump Tier 2 in brain death (body is dead), but Tier 2 trump psychological loss in dementia (person is alive)?
          *   *Answer:* Because Tier 1 is defined as the loss of the *capacity* for consciousness/integration, whereas Dementia is the loss of the *content*. The practice values *capacity* over *content*, but *brain presence* over *bodily function*.

      *   *Wait, one more check:* The user asks about the "Dead Donor Rule." The rule says "Organs not taken from someone alive." Brain dead people are "dead." So organs are taken. This implies the definition of death is the lever.
      *   *Key Insight:* The practice is **functionalist about the brain, biological about the body, but legalistic about the boundary.** It defines death not as the end of the *person* (psychological) but the end of the *biological integrator*.

      *   *Let's finalize the "Implicit Theory":* **The Integrative Brain View.**
          *   You are alive if your brain is integrating your bodily functions (even if you have no mind).
          *   You are dead if your brain cannot integrate bodily functions (even if your heart beats via machine).
          *   This explains why Dementia = Alive (brainstem works, body integrates) and Brain Death = Dead (brainstem dead, body only integrates via external tech).
          *   This explains why Psychology doesn't matter for *life status* (Dementia), but Brain Function does.

      *   *Wait, does this rule out Organism View?* Yes, because the organism is metabolically alive in brain death.
      *   *Does this rule out Psychological View?* Yes, because the person is "gone" in dementia, yet treated as alive.
      *   *Does this rule out Degreed View?* Yes, because the law requires a binary switch for inheritance/marriage/organs.

      *   *What changes for each rival?*
          *   *Organism:* Brain dead donors become murder victims.
