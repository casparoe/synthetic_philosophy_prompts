      *   *Coherence:* It is coherent *internally* regarding the brainstem/integration distinction, but incoherent with *public intuition* (beating heart = alive) and *metaphysical consistency* (why does capacity matter more than content?). It is a **policy compromise masquerading as metaphysics.**

  8.  **Final Polish:** Ensure I answer the specific prompt about "cash value," "inconsistency," and "what would have to change." Avoid citations. Keep it sharp.

      *(Self-Correction during drafting)*: I need to be precise about the "Dead Donor Rule." The rule is the constraint; the definition of death is the variable. The practice *moves the definition of death* to satisfy the rule while allowing transplants. This is the "fiction" aspect. I should highlight that.

      *(Refining the "Implicit Theory")*: It's not just "Integrative Brain." It's "Death is the loss of the capacity for consciousness and somatic integration." Dementia patients have lost consciousness but retain somatic integration (breathing, digestion, sleep-wake via brainstem). Brain dead have lost both. This distinguishes them.

      *(Final check on constraints)*: No reading lists. No "Philosopher X says." Just analysis.

      *(Structure Plan)*:
