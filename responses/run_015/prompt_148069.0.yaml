  # CONSCIOUSNESS TAXONOMY: A DECISION TREE
  **Side 1: The Flowchart**

  **NODE 1 (Case 5: Dissociation)**
  If stimulation changes confidence but not discrimination, does 'what it's like' change? *[Empirical/Conceptual]*
  ├─ **NO** → **FIRST-ORDER FAMILY** (Go to Node 3)
  └─ **YES** → **HIGHER-ORDER FAMILY** (Go to Node 2)

  **NODE 2 (Case 2: Empty HO)**
  If an HO state occurs with no first-order input, is there phenomenology? *[Conceptual]*
  ├─ **NO** (Target Required) → **TRACKING FAMILY** (Go to Node 4)
  └─ **YES** (HO Suffices) → **REPRESENTATIONAL FAMILY** (Go to Node 5)

  **NODE 3 (Order-Relativity)**
  Can the very same state count as first-order under one description and higher-order under another? *[Conceptual]*
  ├─ **YES** (Role Only) → **LEAF A: Global Workspace**
  └─ **NO** (Distinct Orders) → **FIRST-ORDER REALIST** (Go to Node 9)

  **NODE 4 (Case 4: Alien)**
  If an implant generates the HO state, is the resulting experience *yours*? *[Conceptual]*
  ├─ **YES** (Functional) → **LEAF B: Functional Tracking**
  └─ **NO** (Biological) → **LEAF C: Inner-Sense Tracking**

  **NODE 5 (Scope)**
  Does the HO state target a specific mental state or the whole cognitive system? *[Conceptual]*
  ├─ **WHOLE SYSTEM** → **LEAF D: Global Higher-Order**
  └─ **SPECIFIC STATE** → **LOCAL REPRESENTATIONAL** (Go to Node 6)

  **NODE 6 (Case 3: Retrospective)**
  If an accurate HO state forms 1s later, was the pain conscious *during* the second? *[Conceptual]*
  ├─ **NO** (HO Makes It) → **ACTUALIST FAMILY** (Go to Node 7)
  └─ **YES** (HO Reveals It) → **DISPOSITIONAL FAMILY** (Go to Node 8)

  **NODE 7 (Regress)**
  Must the higher-order state *itself* be consciously experienced? *[Conceptual]*
  ├─ **NO** → **LEAF E: Actualist Thought**
  └─ **YES** → **LEAF F: Self-Representational**

  **NODE 8 (Case 6: Animals)**
  Must the higher-order state employ concepts or language? *[Empirical]*
  ├─ **YES** → **LEAF G: Dispositional Thought**
  └─ **NO** → **LEAF H: Dispositional Inner-Sense**

  **NODE 9 (Case 1: Crossed)**
  If HO tracks the wrong FOS, is the error in the experience or the report? *[Conceptual]*
  ├─ **REPORT** (Infallible) → **LEAF I: Deflationary**
  └─ **EXPERIENCE** (Fallible) → **LEAF J: First-Order Realist**

  ***

  **Side 2: The Legend (Leaves & Commitments)**

  | Leaf | Label & Commitments | The Awkward Thing (Bullet Point) | Proponents (Optional) |
  | :--- | :--- | :--- | :--- |
  | **A** | **Global Workspace**<br>FO state + Global Broadcast role. Order is descriptive, not ontological. | • Struggles to explain why broadcasting *feels* like anything rather than just accessing info. | Baars, Dehaene |
  | **B** | **Functional Tracking**<br>HO state tracks FOS functionally; source (internal/external) irrelevant. | • Risks making consciousness too easy (any monitor could create it). | (Variants of Dretske) |
  | **C** | **Inner-Sense Tracking**<br>HO state tracks FOS via dedicated internal scanner mechanism. | • Commits to specific neuro-architecture we haven't found yet. | Armstrong, Lycan |
  | **D** | **Global Higher-Order**<br>HO state targets the whole workspace, not specific qualia. | • Blurs into Workspace theory; hard to specify what "whole system" feels like. | (Variants of Carruthers) |
  | **E** | **Actualist Thought**<br>Consciousness = FOS + Occurrent HO Thought. HO need not be conscious. | • Makes animal consciousness unlikely (requires concepts) and invites the "Rock" objection. | Rosenthal |
  | **F** | **Self-Representational**<br>The state represents *itself* (Same-Order). Solves regress by identity. | • Mechanism of self-representation is obscure (how does a state point at itself?). | Kriegel, Williford |
  | **G** | **Dispositional Thought**<br>Disposal to form HO Thought suffices; concepts required for disposition. | • Borderline with Actualist if disposition is constantly triggered. | Carruthers |
  | **H** | **Dispositional Inner-Sense**<br>Disposal to scan suffices; no concepts required (perceptual). | • **Hard to separate from G** if "concept" is defined loosely (non-linguistic). | (Variants of G) |
  | **I** | **Deflationary / Illusionism**<br>Report is the only fact; "phenomenology" is a user-illusion. | • Denies the datum the seminar is trying to explain (eliminativism). | Frankish |
  | **J** | **First-Order Realist**<br>FOS is sufficient; HO reports can be wrong about the experience. | • **Empty Box:** "Conceptual FO" (FOS requires concepts) is unattractive/unoccupied here. | Dretske, Tye |

  **NOTES ON LOGICAL SPACE**
  1.  **Empty/Unattractive Boxes:** *Conceptual First-Order* (Leaf J split) is theoretically possible but rarely defended (why would rocks lack concepts but have qualia?). *Infinite Regress* (Node 7 Yes) is avoided by all serious theories (forced into Leaf F).
  2.  **Indistinguishable Leaves:** *Leaf G vs. Leaf H*. If "concepts" include non-linguistic perceptual categories, these collapse. The distinction rests entirely on the definition of "concept."
  3.  **Empirical IOUs:** Nodes 1, 8 are empirical. If dissociation (Node 1) is impossible, the whole HO family (Right Branch) dies. If animals lack concepts (Node 8), Leaf G is empty.
  4.  **Order-Relativity:** Node 3 is the pivot. If "Higher-Order" is just a functional description of a First-Order state (Yes), you cannot be a Realist HO theorist (Right Branch). You must be Workspace (Leaf A) or FO (Leaf J/I).

  **DIAGNOSTIC CASE KEY**
  1.  **Crossed:** Metacognition tracks wrong FOS (e.g., report "Green", see Red).
  2.  **Empty HO:** HO state exists, no FOS (e.g., phantom pain without nociception).
  3.  **Retrospective:** HO state forms after experience ends.
  4.  **Alien:** HO state caused by external implant.
  5.  **Dissociation:** Confidence manipulated without changing discrimination accuracy.
  6.  **Animals:** Pre-linguistic subjects lacking complex concepts.
