answer: |-
  1. How do you identify the people who transmit a narrative as historians without already assuming the narrative is history, since isn't your test just describing what historians do rather than defining history itself? I point to specific behaviors like footnoting discrepancies versus celebrating variants, which are observable actions independent of the narrative's status, but this is weakest when dealing with ambiguous cases where scholars preserve variants for aesthetic reasons.

  2. If you can turn a fairy tale into history just by arguing over its inconsistencies, then your definition severs the link between history and physical reality, making the excavated mound at Hisarlik irrelevant to whether Troy was real. I argue that the mound validates the events, but the label history describes our engagement with the text, so without the scholarly practice the site remains a mystery rather than a historical record, though this is weakest when explaining why we value history at all if it doesn't guarantee contact with the past.

  3. Isn't this error-tolerance test just a Western academic gatekeeping tool that denies the status of history to oral traditions simply because they prioritize preservation over reconciliation? The test measures how a specific community treats its own narratives, not whether they meet university standards, so an oral culture that debates variants is doing history by my definition, yet this is weakest if the very concept of reconciliation is itself a literate bias.

  4. By creating a mechanical test to promote narratives to history, aren't you reinforcing the very hierarchy that treats myth as a failed attempt at truth rather than a valid mode of meaning? My goal is descriptive rather than evaluative, showing that history is a practice anyone can abandon, which should humble historians rather than elevate them, although this is weakest because the term history still carries a prestige that legend lacks regardless of my definitions.

  5. If Paul Revere is legend because schools drop the other riders, does that mean adding a footnote to the textbook instantly turns it back into history without any new evidence? Yes, because the shift marks a change in pedagogical intent from moral storytelling to accurate reconstruction, which is exactly how the transition works, even if this is weakest because it makes the status of historical events seem frustratingly fragile.
