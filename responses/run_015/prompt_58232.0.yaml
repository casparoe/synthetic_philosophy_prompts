      *   The "Senior's Analysis" resembles a simple game-theoretic or psychological account (mutual belief + individual intention).
      *   The problem is often called the "Problem of Shared Intention" or distinguishing "I-intentions" from "We-intentions."
      *   *Bratman's Account:* Shared intention involves mutual responsiveness, commitment to the joint activity, and meshing subplans. Crucially, it requires a specific *structure* of intention (intending *that we* J, not just intending *that I* do my part because you do yours).
      *   *Gilbert's Account:* Joint commitment (a normative bond).
