answer: |-
  **Examination Question**

  **Course:** PHI405: Consequentialism and Its Limits
  **Section:** B (The Problem of Cluelessness)
  **Time Allowed:** 90 Minutes

  **Question 1**

  Consider an agent facing three mutually exclusive options:
  1.  **Intervention:** A well-measured near-term aid project with a known, modest positive expected value (EV).
  2.  **Reform:** A structural policy change whose long-run effects are orders of magnitude larger than *Intervention*, but whose causal pathways are complex. You cannot estimate the sign of the net long-run effect; your evidence is symmetric around zero.
  3.  **Research:** A programme that does not directly produce value but significantly reduces your cluelessness regarding *Reform*.

  Standard objections argue that *Reform* renders act-consequentialism action-guiding only via unjustified near-term proxies. Standard replies argue that symmetric uncertainty is ordinary risk; one should simply maximize EV, which treats *Reform* as having zero EV, making *Intervention* the rational choice.

  To move beyond this dialectic, employ the following two devices:
  *   **The Articulation Asymmetry:** The hypothesis that the causal mechanisms we can model are a biased sample of all relevant mechanisms, biased towards the near and measurable. This implies our estimates carry an unidentified directional bias, not merely large variance.
  *   **The Self-Endorsement Test:** The requirement that a decision rule proposed for use under cluelessness must, when applied to the choice of a decision rule itself, not recommend its own abandonment.

  Using these devices, determine what the clueless consequentialist should do. Does the standard EV-maximisation rule survive the Self-Endorsement Test given the Articulation Asymmetry? Is the immunity of non-consequentialist views to cluelessness a theoretical virtue or a cost? Justify your answer.

  ***

  **Model Answer**

  The standard defence of consequentialism against cluelessness treats deep uncertainty as mere risk: if the probability distribution of long-run effects is symmetric around zero, the expected value (EV) is zero, and we should act on the knowable near-term effects (*Intervention*). However, this defence relies on two fragile assumptions: that our uncertainty is structurally symmetric, and that our decision rule is stable under reflection. By applying the Articulation Asymmetry and the Self-Endorsement Test, we see that the standard defence fails, recommending *Research* over *Intervention*, and revealing that non-consequentialist immunity is a cost, not a virtue.

  First, we must distinguish variance from sign-indefiniteness. The standard reply assumes that while the *magnitude* of long-run effects is unknown, the *mean* is known to be zero. The Articulation Asymmetry challenges this. It posits that the mechanisms we can articulate (those supporting *Intervention*) are a non-random sample of all causal mechanisms. If our models systematically exclude complex, long-term feedback loops, our error term is not noise; it is bias. Even if we cannot identify the *direction* of this bias ex ante, the knowledge that our model is a biased sample undermines the justification for assigning a mean of zero. It converts a situation of Risk (known distribution) into Knightian Uncertainty (unknown distribution). Consequently, assigning *Reform* an EV of zero is not a neutral application of probability theory but an unjustified assumption of model completeness.

  This structural flaw triggers the Self-Endorsement Test. Suppose the agent adopts the rule: "Maximize Subjective EV." To pass the test, applying this rule to the choice of decision rules must recommend "Maximize Subjective EV." However, given the Articulation Asymmetry, the EV of using the EV-rule is unstable. If our models are biased, calculating EVs using those models yields corrupted inputs. A consequentialist calculation regarding *which rule to use* must account for the reliability of the calculation itself. If *Research* increases the reliability of future evaluations by reducing Articulation Asymmetry, the EV of *Research* (instrumental value) may exceed the EV of *Intervention* (direct value).

  Therefore, the EV-rule does not uniquely pass the Self-Endorsement Test. In fact, under deep cluelessness, a rule that prioritizes information-gathering (*Research*) is more likely to be self-endorsing. If I choose a decision rule based on its expected consequences, and the consequence of using the standard EV-rule is high error due to Articulation Asymmetry, then maximizing expected consequences recommends abandoning the standard EV-rule in favour of a heuristic that prioritizes reducing uncertainty. The clueless consequentialist should choose *Research*, not because *Intervention* lacks value, but because the epistemic conditions required to justify *Intervention* over *Reform* are currently unmet.

  Finally, consider non-consequentialism. Deontological or virtue-ethical views often appear immune to cluelessness because they restrict the moral horizon to intended acts or local duties, ignoring long-run causal chains. However, the Self-Endorsement Test reveals this immunity as a cost. If a moral theory recommends ignoring relevant consequences because they are hard to measure, it fails to endorse itself as a truth-tracking mechanism. It effectively admits that it cannot guide action towards the good in complex environments. Consequentialism's vulnerability to cluelessness is a sign of its seriousness; it attempts to track the truth of value even when difficult. Non-consequentialist immunity is merely the comfort of ignoring the problem.

  In conclusion, the Articulation Asymmetry shows that cluelessness involves structural bias, not just variance, defeating the standard EV defence. The Self-Endorsement Test shows that under these conditions, a rule prioritizing *Research* is more stable than one prioritizing *Intervention*. The consequentialist should invest in reducing cluelessness rather than acting on potentially corrupted proxies. This vulnerability demonstrates the theory's ambition, whereas the immunity of rival theories represents an unwillingness to engage with the full scope of moral causality.

  ***

  **Marking Scheme**

  **Total Marks: 20** (5 Points × 4 Marks)

  **1. Formal Reconstruction of Cluelessness**
  *   **4 Marks:** Correctly distinguishes between high variance (noise) and sign-indefiniteness (unknown mean). Explains that the standard objection relies on the long-run swamping the near-term, while the standard defence relies on symmetric cancellation.
  *   **Common Error:** Treating all uncertainty as variance; failing to explain why symmetric noise allows EV maximisation to proceed.

  **2. Assumptions of the Expected-Value (EV) Reply**
  *   **4 Marks:** Precisely states that the EV defence assumes the error distribution is centred at zero (unbiased). Identifies that this requires the set of considered causal pathways to be representative of all pathways.
  *   **Common Error:** Asserting EV handles "any" uncertainty without specifying the symmetry/unbiasedness condition required for the mean to hold.

  **3. Application of Articulation Asymmetry**
  *   **4 Marks:** Explains that if representable mechanisms are a biased sample, the "zero mean" assumption is unjustified. Notes that unidentified directional bias creates Knightian uncertainty, undermining the calculation of *Reform*'s EV.
  *   **Common Error:** Overclaiming that asymmetry *automatically* makes EV negative (it makes it *unknown*); failing to link the bias to the sample of mechanisms.

  **4. Application of the Self-Endorsement Test**
  *   **4 Marks:** Applies the test to the *decision rule*, not just the act. Argues that if EV calculations are unreliable (due to Asymmetry), the EV-rule may recommend a different rule (e.g., "Prioritize Research"). Shows *Research* becomes the stable choice.
  *   **Common Error:** Applying the test to the three acts directly rather than the rule governing them; assuming passing the test is sufficient for correctness rather than stability.

  **5. Normative Upshot and Non-Consequentialism**
  *   **4 Marks:** Concludes that buying information (*Research*) is the stable consequentialist response. Argues that non-consequentialist immunity is a cost (ignoring moral truth) rather than a virtue (stability).
  *   **Common Error:** Claiming non-consequentialism "solves" cluelessness; failing to take a stance on whether *Intervention* or *Research* is the final recommendation.

  ***

  **Examiner's Note: Distinguishing A from B Answers**

  **B-Level Answers** will correctly define the two devices and apply them sequentially as independent checklist items. They will likely conclude that *Research* is good because "uncertainty is bad," treating the Articulation Asymmetry as a simple increase in variance. They will often fail to see the recursive nature of the Self-Endorsement Test (applying it to acts rather than rules) and will typically characterize non-consequentialist immunity as a straightforward advantage.

  **A-Level Answers** will identify the *interaction* between the two devices: the Articulation Asymmetry is the specific condition that causes the EV-rule to fail the Self-Endorsement Test. They will recognize that an unidentified bias does not mathematically force a negative EV, but it destroys the *justification* for assuming a zero EV, shifting the burden to epistemic investment (*Research*). Crucially, they will defend consequentialism's vulnerability as a feature of its ambition, rather than conceding that rival theories handle the problem better.
