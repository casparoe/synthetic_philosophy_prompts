      *   *Requirement:* 5 points, 4 marks each. Total 20. Include "how strong candidates go wrong."
      *   *Point 1: Formal Reconstruction.* Distinguish variance (noise) from sign-indefiniteness (bias/unknown mean). *Trap:* Treating all uncertainty as mere variance.
