      *(Refining Point 3 in Marking Scheme)*: The candidate needs to note that an unknown direction *subjectively* averages to zero, so to break EV, one must argue that the *meta-probability* of the bias being negative is high, or that the decision rule should be sensitive to model reliability, not just model output. Or, simpler: The asymmetry implies we cannot justify the assumption of symmetry required for the standard EV defense.

      *(Refining Point 4)*: The Self-Endorsement Test. If I choose "Maximize EV," do I choose that rule using EV? If EV is unreliable due to Articulation Asymmetry, then maximizing EV might recommend "Don't use EV." This is the crux.

