answer: |-
  ### Case A

  In the winter of 1764, Elias Thorne, a merchant of standing in Bristol, faced the ruin of his house due to a collapse in tobacco prices. To prevent the total dispossession of his wife and children, he liquidated the assets of his firm. Among these was the indenture of a twelve-year-old parish apprentice, Thomas, whom Elias had raised since infancy. Though Elias knew the purchaser was an agent for a sugar plantation in Barbados—a destination associated with high mortality and brutal labour—he proceeded with the transfer, as was his legal right and common commercial practice. Elias was otherwise known as a man of piety who gave generously to the poor. He had heard the murmurs of a small sect of Quakers who claimed that treating human beings as transferable stock was an abomination, but he dismissed them as enthusiasts who did not understand the necessities of trade. Thomas was shipped within the month and died of fever two years later. Elias maintained his household and died respected in his community.

  ### Case B

  In the winter of 1764, Elias Thorne, a merchant of standing in Bristol, faced the ruin of his house due to a collapse in tobacco prices. To prevent the total dispossession of his wife and children, he liquidated the assets of his firm. Among these was the partnership share of his orphaned nephew, William, whom Elias had raised since infancy. Though Elias knew the purchaser was an agent for a sugar plantation in Barbados—a destination associated with high mortality and brutal labour—he proceeded with the transfer, as was his legal right and common commercial practice. Elias was otherwise known as a man of piety who gave generously to the poor. He had heard the murmurs of a small sect of Quakers who claimed that treating kin as transferable stock was an abomination, but he dismissed them as enthusiasts who did not understand the necessities of trade. William was shipped within the month and died of fever two years later. Elias maintained his household and died respected in his community.

  ***

  ### Analysis of the Defence

  **Case A: The Defence Succeeds**
  *   **CU (Conceptual Unavailability):** Holds. The agent lacks the modern concept of "child trafficking" or "human rights violation."
  *   **EU (Evidential Unavailability):** Holds. The mortality risk is known, but the *wrong-making* feature (that a human cannot be sold) is not evidentially accessible as a moral fact.
  *   **PS (Peer-Saturation):** Holds. The text states this was "common commercial practice."
  *   **BD (Bridging-Description Availability):** **Fails.** There is no local thick concept available to Elias that condemns this specific act. The apprentice is categorized legally and morally as "stock" or "charge." The local vocabulary of "cruelty" or "betrayal" does not extend to the liquidation of a parish indenture; it falls under "Prudence" or "Necessity."
  *   **Verdict:** The "man of his time" defence succeeds. We cannot blame Elias for the action, nor does this action impugn his character *as a moral agent within his context*. We may regret the action, but we cannot hold him responsible for it.

  **Case B: The Defence Fails**
  *   **CU (Conceptual Unavailability):** Holds. Elias lacks modern concepts of "nepotism" or "family rights."
  *   **EU (Evidential Unavailability):** Holds. Same evidence as A.
  *   **PS (Peer-Saturation):** Holds. The text states this was "common commercial practice" (economic necessity made it common).
  *   **BD (Bridging-Description Availability):** **Holds.** The local moral vocabulary contains a thick concept such as "Unnatural" or "Kin-Betrayal." Even if many did it, the *description* was available to condemn it. Elias had the conceptual resources to see this not merely as asset liquidation, but as a violation of the specific duty owed to blood.
  *   **Verdict:** The defence fails. Elias is blameworthy. The action is wrong relative to the moral resources available to him. We are licensed to say his character was flawed: he prioritized financial prudence over a moral demand he *could* have recognized.

  **The Single Feature Doing the Work**
  The contrast rests entirely on **BD**. In both cases, the modern student wants to condemn the outcome (a child/young man sent to die). In A, the student's condemnation is anachronistic (relying on CU concepts). In B, the student's instinct is to excuse (viewing it as a business decision), but the historical reality provides a local hook for blame. If we remove BD (i.e., if we stipulate that in Case B, the society also lacked any concept distinguishing kin from stock), the contrast collapses: both agents become blameless. If we introduce BD into A (i.e., if the society had a concept condemning the sale of *any* dependent), both agents become blameworthy. The divergence survives only so long as the local vocabulary distinguishes the two relationships.

  ***

  ### The Objection: The "Local Thick Concept" Problem

  **The Objection**
  "The strongest students will argue that BD smuggles anachronism in through the back door. If the local thick concept in Case B ('Kin-Betrayal') relies on a caste distinction that we (and arguably the agent, deep down) should reject—i.e., that kin matter more than non-kin—then blaming the agent for violating it validates a morally repugnant hierarchy. We are essentially blaming Elias for not being a *better casteist*. If the concept is merely local etiquette, it cannot ground trans-historical blame. If it tracks genuine moral truth (that betraying dependents is wrong), then why did it not apply in Case A? BD appears to reduce blame to 'failure to follow local rules,' which is not moral blame at all."

  **Does it Sink Case B?**
  It does not sink the case, but it requires a precise clarification of what BD tracks. BD is not about the *validity* of the local hierarchy (Kin > Servant). It is about the **availability of moral scrutiny**.
  In Case B, the agent possesses a conceptual tool that *could* have flagged the harm ("This is a betrayal of trust"). He chose not to apply it to save money. This is a failure of *moral attention*, not just rule-following. In Case A, he lacks the tool entirely; no amount of attention would have flagged the harm using his available vocabulary.
  The blame in B is not for "violating the sanctity of blood," but for "failing to extend the care inherent in his own acknowledged relationships." The objection fails because it conflates the *source* of the concept (hierarchical society) with the *function* of the concept (identifying betrayal). We blame him for the betrayal, not for the hierarchy.

  **Rebuilding the Case (If the Objection Stood)**
  If the objection were deemed fatal (i.e., if one argues that *any* reliance on hierarchical thick concepts is impermissible), Case B would need to be rebuilt to rely on a **Thin Concept** available locally, rather than a Thick one.
  *   *Rebuild:* Instead of "Kin-Betrayal" (Thick/Hierarchical), the scenario would turn on **Promise-Keeping**.
  *   *Modification:* In Case B, Elias must have made a specific *verbal promise* to the nephew's father on his deathbed to "look after the boy." In Case A, no promise was made to the parish.
  *   *Result:* The concept "Liar" or "Oath-Breaker" is universally available (Thin). CU/EU/PS remain fixed. BD now relies on "Did he break his word?" rather than "Did he violate kin-duty?"
  *   *Trade-off:* This weakens the "surface similarity" constraint (adding a promise changes the facts more than changing status), but it insulates the exercise from the charge that we are blaming the agent for not adhering to a morally suspect caste system. However, for the purpose of your specific module on *thick* concepts, the original formulation is superior provided you frame the rebuttal as above: we blame the *selective suspension* of care, not the hierarchy itself.
