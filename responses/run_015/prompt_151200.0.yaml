answer: |-
  There is no single, canonical term in political philosophy that captures every nuance of the phenomenon you describe, primarily because it sits at the intersection of three distinct literatures: value pluralism, institutional design, and the theory of compromise. However, the phenomenon is well-recognized, and its closest established conceptual home is a sophisticated version of **Modus Vivendi**, specifically as rehabilitated by **John Gray** and others in the **Value Pluralism** tradition, coupled with the structural mechanism of **Jurisdictional Pluralism**.

  Your intuition that this differs from an "ordinary" *modus vivendi* is correct insofar as the term is often used colloquially (or in Hobbesian scholarship) to denote a temporary truce based on a balance of terror. However, in contemporary political theory, your description aligns precisely with the *normative ideal* of a Pluralist Modus Vivendi.

  Below is a delineation of the concept, its closest theoretical relatives, and the boundary conditions that distinguish it from subordination, consensus, or unprincipled bargaining.

  ### 1. The Closest Established Concept: Pluralist Modus Vivendi

  While you distinguish your observation from an "ordinary modus vivendi," the philosophical literature (specifically **John Gray's *Two Faces of Liberalism***) distinguishes between a *Hobbesian* modus vivendi (stable only due to contingent power balances) and a *Pluralist* modus vivendi (stable due to institutional design that secures mutual advantage).

  *   **Why it fits:** Gray argues that in a world of incommensurable values, we should not seek an *Overlapping Consensus* (Rawls), which requires shared justificatory reasons. Instead, we should seek institutions that allow conflicting ways of life to coexist peacefully.
  *   **The Nuance You Add:** Your description adds a specific *economic/structural* layer: the arrangement isn't just non-interference; it is an engineered exchange where each side secures a *positive benefit* from the other's existence without moral validation. This moves it from passive toleration to active **institutional trade**.

  ### 2. The Structural Mechanism: Jurisdictional Pluralism

  The mechanism you describe—redesigning institutions so that incompatible rules apply in different domains—is best termed **Jurisdictional Pluralism** (or **Segmented Sovereignty**).

  *   **Definition:** A system where legal or moral authority is divided not by geography alone, but by *domain of competence*, allowing incommensurable normative systems to operate simultaneously without requiring one to validate the other.
  *   **The "Decoupling" Feature:** The critical innovation here is **moral decoupling**. The benefit Community A receives from Community B is structurally decoupled from the moral premises Community B used to generate it. Community A gets the *outcome* (welfare/goods) without endorsing the *process* (utilitarian calculus).

  ### 3. Delineating the Boundaries

  To determine whether a specific arrangement counts as this specific kind of cross-framework trade (rather than subordination or bargain), four boundary conditions must hold.

  #### A. Distinction from Subordination (Hegemony)
  *   **Condition:** **Reciprocal Veto Power.**
  *   **Explanation:** In cases of subordination, the dominant framework sets the terms of the accommodation. The minority is "tolerated" only insofar as it does not disrupt the majority's values. In your phenomenon, the institutional redesign requires the *consent* of both frameworks based on their *own* internal criteria.
  *   **Test:** If Community A withdrew, would Community B's core project collapse or be significantly impaired? If yes, it is interdependence. If Community B could easily coerce A but chooses not to, it is toleration (subordination). Your scenario requires that B *needs* A's participation (or non-interference) to secure its own benefit, and vice versa.

  #### B. Distinction from Overlapping Consensus (Rawls)
  *   **Condition:** **Justificatory Opacity.**
  *   **Explanation:** In an Overlapping Consensus, both sides must be able to endorse the arrangement *for the same reasons* (or compatible reasons) from within their own comprehensive doctrines. In your scenario, the justifications remain **opaque** to the other side. Community A may view Community B's contribution as morally tainted, yet instrumentally valuable.
  *   **Test:** Can Community A publicly state, "This arrangement is *just*"? If they can only say, "This arrangement is *advantageous* despite being unjust in B's sector," it is your phenomenon, not Consensus.

  #### C. Distinction from Unprincipled Bargain (Corruption)
  *   **Condition:** **Integrity Preservation.**
  *   **Explanation:** An unprincipled bargain involves one side violating its own core constraints to get a deal (e.g., a deontological community agreeing to *perform* a prohibited act in exchange for safety). Your scenario explicitly rules this out: "absolute protection for its own non-negotiable constraints."
  *   **Test:** Does the arrangement require either community to *perform* an action they deem impermissible? If yes, it is corruption/compromise of principle. If the arrangement allows them to *benefit from* the other's action without *performing* it themselves, it is **Principled Institutional Compromise**.

  #### D. Distinction from Simple Coordination (Convention)
  *   **Condition:** **Conflictual Dependence.**
  *   **Explanation:** Simple coordination (e.g., driving on the left vs. right) assumes the underlying values are compatible or indifferent. Your scenario arises specifically because the values are *hostile*.
  *   **Test:** Does the arrangement solve a problem that would result in *moral conflict* (not just practical inefficiency) if left unsolved? If the stakes are merely practical, it is coordination. If the stakes are moral survival, it is your phenomenon.

  ### 4. Proposed Terminology

  Since no single word exists, scholars describing this specific configuration often use composite terms. If you need a label for this phenomenon, the most precise available options are:

  1.  **Principled Institutional Compromise:** Highlights that principles are not violated, but the *institution* is the site of the deal.
  2.  **Parallel Accommodation:** Highlights that the frameworks run in parallel without intersecting morally, yet accommodate each other's existence.
  3.  **Gains from Moral Trade:** Borrows from political economy to highlight the Pareto-improving nature of the exchange across incommensurable systems.

  ### 5. Summary of the Phenomenon's Edges

  For a compromise to count as this specific kind of cross-framework trade, the following **necessary and sufficient conditions** apply:

  1.  **Incommensurability:** The parties lack a shared metric of value (e.g., utility vs. sanctity).
  2.  **Non-Validation:** Neither party recognizes the other's moral premises as legitimate; they view them as mistaken or harmful.
  3.  **Structural Decoupling:** The institutional design isolates the moral "contamination." One side benefits from the *output* of the other's system without endorsing the *input* or *process*.
  4.  **Reciprocal Constraint:** Both sides possess the power to disrupt the arrangement, making stability a function of mutual benefit rather than coercion.
  5.  **Integrity Maintenance:** Neither side violates its own internal prohibitions to sustain the arrangement.

  ### Conclusion

  You have identified a robust form of **Pluralist Modus Vivendi** enabled by **Jurisdictional Decoupling**. It differs from a mere truce because it is engineered for mutual gain rather than fear; it differs from consensus because it requires no shared justification; and it differs from corruption because it preserves the moral integrity of both agents. In the literature of **Value Pluralism** (Berlin, Gray, Galston), this is often the *prescribed solution* to incommensurability, though your specific emphasis on the *engineered benefit exchange* (rather than mere non-interference) adds a valuable layer of institutional economic theory to the philosophical concept.

  If you are writing on this, the term **"Institutional Accommodation of Incommensurability"** is likely the most precise descriptor currently available, distinguishing it from both *toleration* (which implies hierarchy) and *consensus* (which implies convergence).
