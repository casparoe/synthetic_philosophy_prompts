prompt: |-
  I'm writing a feature on how institutions encode philosophy without noticing it. One practice puzzles me: government agencies, universities, and technology consortia regularly embed the phrase "Western values" into partnership contracts, funding criteria, accreditation standards, and ethics guidelines—treating it as though it named a specific, bounded normative package with clear membership conditions. The phrase is almost always left undefined in the document, yet its invocation is meant to do real administrative work: excluding certain collaborations, licensing particular governance models, or marking a boundary around acceptable belief and practice. At the same time, the inventory shifts by institutional context—sometimes secularism and gender equality are included, sometimes market liberalism is included, sometimes neither is; many of the same norms are vigorously defended in societies not conventionally labeled Western; and historical practices widely recognized as Western included precisely the violations now cited as departures from these values. What philosophical commitments about value, culture, and normativity does this institutional practice presuppose? Reconstruct the implicit theory that makes it intelligible to write "Western values" into a binding clause. Say whether the practice strictly requires that moral norms are geographically indexed properties, or whether it is compatible with universalist moral theories that merely use the phrase as rhetorical shorthand. Examine whether it presupposes a form of cultural essentialism, a claim about pragmatic tractability, or a covert theory of moral progress tied to place. Distinguish what the practice strictly requires from what merely fits it well, and note where it is philosophically underdetermined—so that several rival theories could license the same contractual language. Then tell me what the institution would actually have to change, both administratively and conceptually, if it dropped the geographic label and replaced it with an explicit, itemized list of norms. After your analysis, provide a brief structured summary as a JSON object with these exact fields: "implicit_theory_of_value", "cultural_ontology", "geographic_indexing_role", "compatible_with_universalism", "required_administrative_changes", and "remaining_ambiguities".
