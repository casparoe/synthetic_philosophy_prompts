          *   What would change (administratively/conceptually) if replaced by an itemized list?
      *   **Output Format:** Analytical essay followed by a specific JSON summary.

  2.  **Analyze the Phenomenon ("Western Values" as a Speech Act):**
      *   *Function:* It's a boundary mechanism. It's not just descriptive; it's performative. It creates an "in-group" and an "out-group."
      *   *Vagueness:* The vagueness is a feature, not a bug. It allows flexibility in enforcement while maintaining a rigid boundary.
      *   *Philosophical Commitments:* To use this term bindingly, the institution must believe that "West" is a coherent category capable of bearing normative weight.

  3.  **Reconstructing the Implicit Theory:**
      *   *Ontology of Culture:* It treats "The West" not just as a location but as a *moral locus*. This implies a form of *Cultural Essentialism* (or at least *Nominalism* that treats the label as real). It suggests values emerge from or are sustained by a specific cultural-historical substrate.
      *   *Normativity:* It implies *Particularism* (values belong to *us*) masked as *Universalism* (values are good for *everyone*, but *we* hold the key).
      *   *Geographic Indexing:* Does it *require* geography? Strictly speaking, no. It could be genealogical. But administratively, geography is the proxy. So, it treats geography as a *heuristic for normative alignment*.
      *   *Universalism Compatibility:* Can a universalist use this? Yes, if they view the West as the *vanguard* of universal values (Hegelian view). But strict universalism would prefer "Human Rights" over "Western Values." So, it's compatible with *paternalistic universalism*, not *neutral universalism*.
      *   *Moral Progress:* It often implies a teleology where the West represents a more "advanced" stage of moral development (Modernization Theory).

  4.  **Distinguishing Requirements vs. Fit vs. Underdetermination:**
      *   *Required:* That the label "West" picks out a cluster of norms sufficiently stable to be contractually binding. That the institution has the authority to define the boundary.
      *   *Fits Well:* Cultural essentialism, historical teleology, geographic determinism.
      *   *Underdetermined:* Whether the values are *intrinsic* to the West or just *historically associated*. Whether the goal is exclusion or assimilation.

  5.  **Analyzing the Shift to Itemized Lists:**
      *   *Administrative:* Increased scrutiny, need for adjudication mechanisms, loss of "catch-all" exclusion power.
      *   *Conceptual:* Shift from *identity-based* compliance to *principle-based* compliance. Loss of the "civilizational" stake.

  6.  **Drafting the Analysis (Iterative refinement):**
