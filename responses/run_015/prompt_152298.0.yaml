      *   *Universalism:* It's compatible with a "Realized Universalism" (we have achieved what is universally good).
      *   *Essentialism:* It leans heavily on a soft essentialism (family resemblance) rather than strict necessary/sufficient conditions.
      *   *Replacement:* What happens if we list them? The "civilizational" shield drops. Disputes become about specific actions, not identity.
      *   *Conclusion:* Summarize the philosophical cost of the phrase.

  7.  **Refining the JSON Fields:**
