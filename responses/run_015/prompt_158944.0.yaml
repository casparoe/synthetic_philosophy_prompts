  8.  **Final Polish:** Ensure the distinction between "contrastive" and "absolute" explanation is clear. Ensure the Dutch/Ottoman context informs the examples without dominating the general methodological framework. (The prompt asks for a specification, not a survey, so keep it general but applicable).

      *Wait, one nuance:* The user asked to "Adjudicate them [1-8], add the ones I've missed, and feel free to re-cut the taxonomy." I should explicitly reference their numbers where applicable but organize logically.
      *Also:* "Flag any pair of desiderata you think cannot be jointly satisfied." I need to be explicit about the tension between Stability and Relativity.

      *Let's finalize the "Teeth" choice:* It's usually the **Common Cause Exclusion** (part of Difference-Making). Most historians list "Why Britain succeeded" factors (property rights, navy) without checking if the Ottomans had functional equivalents (tax farming, naval capacity). If the Ottomans had them and still didn't diverge, those factors are necessary but not sufficient for the *difference*. This is the most common failure mode.

      *Let's finalize the "Incompatibility":* The tension is between **Contrast-Relativity** (the cause is specific to the F/C pair) and **Robustness** (the cause holds if we swap C for a similar case C'). If an explanation is too relative, it's ad hoc. If too robust, it's not contrastive. The resolution is that the *mechanism* must be robust, even if the *factor* is relative. I will frame this carefully.

