      *Okay, ready to write.*
answer: |-
  Here is a specification of desiderata for contrastive historical explanation, adjudicated against your standard of adequacy: *Would a negative finding on this criterion render three years of archival work deflationary (i.e., "the question was wrong") or informative (i.e., "this cause is false")?*

  I have re-cut your eight candidates into five core desiderata. I have marked each as **Non-Negotiable** (failure implies the explanation is invalid or the question ill-posed) or **Methodological Preference** (failure implies a specific school of thought is being ignored, but the explanation may still hold).

  ### 1. The Parallel Baseline Condition
  **Specification:** Prior to the divergence point ($t_0$), $F$ and $C$ must be shown to occupy a comparable range of the outcome variable, or share a trajectory that makes the subsequent divergence anomalous. If $F$ was already significantly ahead of $C$ at $t_{-50}$, the question is not "Why $F$ rather than $C$?" but "Why did $F$ maintain lead?"
  **Motivating Case:** Addressing your Candidate #8 and #5. If you ask "Why the Industrial Revolution in Britain and not China?" but real wages in Britain were double China's in 1600, the "divergence" is a continuation, not a break. A cause identified for the break will fail to explain the baseline gap.
  **Status:** **Non-Negotiable.**
  **Reasoning:** If the baseline is not parallel, a negative finding on your cause is deflationary: it tells you nothing about the divergence because the divergence is an artifact of periodization. Establishing the baseline is the prerequisite for the three-year project; if the baseline fails, the project stops before it starts.

  ### 2. The Difference-Maker Condition (Exclusion of Common Causes)
  **Specification:** The proposed cause $X$ must be present in $F$ and absent (or functionally ineffective) in $C$ *at the time of divergence*. Factors present in both (common causes) are background conditions, not contrastive explanations. Factors absent in both are irrelevant.
  **Motivating Case:** Addressing your Candidate #6 and #2. This is the core of contrastive explanation (Lipton/van Fraassen). If you argue "Secure Property Rights caused Dutch success," but the Ottoman *mira* system provided functionally equivalent security for commercial capital in the same period, property rights are a common cause. They explain why both were sophisticated, not why one diverged.
  **Status:** **Non-Negotiable.**
  **Reasoning:** If you spend three years proving $X$ existed in $F$, only to find $X$ also existed in $C$, your finding is deflationary. It dissolves the contrast. A valid contrastive cause *must* vary across the arms.

  ### 3. The Interaction-Aware Counterfactual
  **Specification:** Because $F$ and $C$ are causally coupled (trade, war, emulation), the explanation cannot rely on a ceteris paribus clause that assumes $C$ remains fixed if $F$ changes. The explanation must specify why interaction did not equalize the outcome.
  **Motivating Case:** Addressing your Candidate #4. The Dutch and Ottomans traded; Dutch bullion flows affected Ottoman inflation; Ottoman grain affected Dutch prices. A standard "remove $X$ from $F$" counterfactual is impossible if $X$ is embedded in a shared system. The explanation must show why the coupling transmitted shocks asymmetrically (e.g., $F$ absorbed shocks better than $C$).
  **Status:** **Non-Negotiable.**
  **Reasoning:** Ignoring coupling leads to the "independent units" fallacy. If you test a cause that relies on isolation in a system defined by integration, a negative finding is deflationary: the model of the world was wrong, not just the cause.

  ### 4. The Timing/Trigger Condition
  **Specification:** The cause $X$ must not only vary between $F$ and $C$, but the *variation* in $X$ must coincide with the *onset* of the divergence. If $X$ was present in $F$ for a century before the divergence, $X$ is a precondition, not a trigger.
  **Motivating Case:** Addressing your Candidate #5. If Dutch financial sophistication existed in 1580 but the divergence in shipping tonnage only begins in 1620, financial sophistication is a necessary background condition. You need a second factor (e.g., a specific war, a policy shift, a technological adoption) to explain the *timing*.
  **Status:** **Non-Negotiable.**
  **Reasoning:** Without timing, you cannot distinguish between "why $F$" and "why $F$ *then*." A negative finding here (the cause predates the effect by too long) is informative: it demotes the cause from "trigger" to "background," requiring you to look for the actual trigger.

  ### 5. Mechanism Transparency (No Black Boxes)
  **Specification:** The explanation must specify the micro-foundations linking $X$ to the outcome. "Institutions" or "Culture" are not mechanisms; they are labels for clusters of behaviors. The explanation must state *how* the institution/culture altered incentives or constraints for specific actors to produce the aggregate outcome.
  **Motivating Case:** Addressing your Candidate #7. "Ottoman culture inhibited innovation" is a black box. "Ottoman guild regulations fixed prices, removing the profit incentive for technological adoption" is a mechanism.
  **Status:** **Methodological Preference** (New Institutionalist/Analytic Narrative).
  **Reasoning:** You *can* write history without explicit micro-foundations (e.g., structuralist or culturalist approaches). However, for a three-year empirical test, black boxes are dangerous. If the mechanism is opaque, you cannot design a test to falsify it. A negative finding on a black box is often deflationary ("you measured the wrong aspect of culture"). Transparency makes the negative finding informative.

  ***

  ### Incompatibilities and the Validity of the Question

  There is a tension between **Desideratum 2 (Difference-Maker)** and **Desideratum 3 (Interaction-Aware)**.

  *   **The Conflict:** Difference-making ideally requires holding the contrast case ($C$) fixed while manipulating the focal case ($F$). Interaction-awareness admits that you *cannot* hold $C$ fixed because $F$ and $C$ are coupled.
  *   **The Resolution:** This does not make the question ill-posed, but it shifts the burden of proof. You cannot look for a cause that exists *only* in $F$. You must look for a **relative efficiency** or **asymmetric response** cause.
      *   *Bad Question:* "Why did the Dutch have joint-stock companies and Ottomans didn't?" (Fails if Ottomans had functional equivalents).
      *   *Good Question:* "Why did Dutch joint-stock companies lower transaction costs more effectively than Ottoman partnership structures in long-distance shipping?"
  *   **Conclusion on Validity:** The question "Why Dutch and not Ottoman?" is well-posed *only if* framed as "Why did the Dutch capture the surplus/growth/transition when the Ottomans, despite similar starting conditions and coupling, did not?" If you frame it as "What did the Dutch have that Ottomans lacked?" you will likely fail Desideratum 2 (because they often had functional equivalents). If you frame it as "Why did the same inputs yield different outputs?" you satisfy the criteria.

  ***

  ### The "Teeth" Test

  The single desideratum that excludes the largest share of usual families of answers (resource endowments, institutions, culture, state formation) is:

  **Desideratum 2: The Difference-Maker Condition (specifically the exclusion of common causes).**

  Most comparative history is actually *single-case* history in disguise. It lists the features of the winner (Britain/Dutch) and assumes their absence in the loser. In the Dutch/Ottoman case, both had sophisticated tax farming, both had long-distance merchant networks, both had naval capacity, and both had religious pluralism (in practice, if not theory). An explanation citing "commercial institutions" or "fiscal capacity" fails immediately unless it can demonstrate a *variance in effectiveness* at the specific moment of divergence. Most dissertation chapters stall because the student spends three years proving the Dutch had $X$, only to discover in the final year that the Ottomans had $X$ too, rendering the causal claim deflationary.
