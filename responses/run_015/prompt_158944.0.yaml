      *   **Task:** Write desiderata for a satisfactory contrastive historical explanation ("why F rather than C?").
      *   **Constraint 1 (Standard of Adequacy):** An explanation is good enough if it would be worth three years of primary-source work to test. A negative finding must be informative, not just deflationary.
      *   **Constraint 2 (Content):** Adjudicate the 8 candidate requirements provided by the user. Add missing ones. Re-cut taxonomy if needed.
      *   **Constraint 3 (Formatting):** For each desideratum, give the motivating case/consideration. Mark as "Non-negotiable" or "Preference of one methodological camp."
      *   **Constraint 4 (Critical Analysis):** Flag incompatible desiderata. If the list implies the question is ill-posed, state that conclusion.
      *   **Constraint 5 (The "Teeth" Test):** In a few lines, name the single desideratum that excludes the largest share of usual answers (resources, institutions, culture, etc.).
      *   **Tone:** Rigorous, philosophical but grounded in historical practice, direct, no fluff.

  2.  **Deconstruct the Candidate Requirements (1-8):**

      *   *1. Natural vs. Gerrymandered Class:* This is about reference class stability. If I change the contrast (France vs. China), do the causes change? If yes, is the question broken? *Verdict:* Crucial for validity, but "natural class" is philosophically fraught. Needs reframing as "Robustness under re-description."
      *   *2. Contrast-Invariant vs. Contrast-Relative:* This is the core of contrastive explanation (van Fraassen, Lipton). Causes *are* difference-makers. Demanding invariance is usually a mistake. *Verdict:* Contrast-relativity is a feature, not a bug, but needs limits to avoid triviality.
      *   *3. Symmetric Counterfactuals:* (a) Add to C -> Outcome? (b) Remove from F -> No Outcome? History rarely allows clean removal. Demanding both often leads to impossibility. *Verdict:* Preference for asymmetry (focus on presence in F/absence in C), but symmetric support strengthens the claim.
      *   *4. Separation of Arms (Interference):* SUTVA violation. F and C interacted. *Verdict:* Non-negotiable to address, but "holding fixed" is impossible. Needs a "Net Effect" or "Interaction-Aware" criterion.
      *   *5. Diachronic Adequacy (Timing/Near-miss):* Why *then*? *Verdict:* Non-negotiable for historical explanation. A cause that exists for 200 years before the effect is insufficient without a trigger.
      *   *6. Transportability vs. Difference-Making:* This distinguishes "causes of outcomes" from "causes of differences." *Verdict:* Non-negotiable distinction. Contrastive explanation *must* target difference-making. Common causes are background conditions.
      *   *7. Level and Integration:* Deep vs. Proximate. *Verdict:* Preference. A proximate cause (coal) is valid if it meets other criteria. Demanding "deep" causes is often institutionalist bias.
      *   *8. Shared Baseline/Degree:* Divergence vs. Level. *Verdict:* Non-negotiable. If trajectories weren't parallel before, the contrast is false.

  3.  **Synthesize and Refine Desiderata (The "Re-cut"):**

      *   I need to group these into logical clusters: *Validity of the Contrast*, *Causal Mechanism*, and *Empirical Testability*.
      *   I need to apply the "Three-Year Test" (Would finding this false be informative?).
      *   I need to address the Dutch/Ottoman specific context implicitly (commercial sophistication, fiscal apparatus).

      *   *Drafting Desideratum 1: The Parallel Baseline Condition (addresses #8 & #5).* Before the divergence, were they comparable? If not, the question is "Why did a sprinter beat a toddler?"
      *   *Drafting Desideratum 2: The Difference-Maker Condition (addresses #2 & #6).* The cause must vary between F and C. Common causes are excluded.
      *   *Drafting Desideratum 3: The Counterfactual Stability Condition (addresses #1 & #3).* Does the cause hold up if we tweak the contrast class slightly?
      *   *Drafting Desideratum 4: The Interaction/Interference Condition (addresses #4).* Acknowledge coupling. The cause must explain the *net* divergence despite interaction.
      *   *Drafting Desideratum 5: The Timing/Trigger Condition (addresses #5).* Why *then*?
      *   *Drafting Desideratum 6: The Mechanism Transparency Condition (addresses #7).* How does the cause actually produce the effect? (Black boxes are risky for 3-year projects).

  4.  **Evaluate Compatibility (The "Impossible Triangle"):**

      *   Is there a conflict? Yes. *Contrast-Relativity* (#2) vs. *Stability under Re-description* (#1). If the explanation depends entirely on the specific contrast chosen, it's fragile. If it must be stable across contrasts, it stops being contrastive and becomes general.
      *   Also: *Interaction* (#4) vs. *Counterfactual Removal* (#3). If F and C are coupled, you can't mentally remove F's cause without affecting C.
      *   *Conclusion:* The question is not ill-posed, but it requires shifting from "Why F?" to "What broke the symmetry?" The tension between Stability and Relativity is the engine of the research, not a bug.

  5.  **Select the "Teeth" Desideratum:**

      *   Which one kills the most literature?
      *   *Resources:* Often present in both (or absent in both).
      *   *Culture:* Hard to measure variance.
      *   *Institutions:* Often teleological.
      *   *The Winner:* **The Difference-Maker Condition (specifically the exclusion of common causes).** Most explanations list things the Dutch had (capital markets, tolerance) that the Ottomans *also* had in functional equivalents, or things both lacked. If the factor exists in C (even in different form), it fails the contrastive test. This kills "Great Divergence" lists that just describe the winner.

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**

      *   *Tone:* Academic, precise, empathetic to the stall.
      *   *Structure:* Introduction -> The Desiderata (with Motivation and Status) -> Incompatibilities/Conclusion on the Question -> The "Teeth" Test.
      *   *Check:* Did I mark Non-negotiable vs. Preference? Yes. Did I address the 3-year standard? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "No" to the user's worries. The worry is valid. I need to validate that *some* contrastive questions *are* ill-posed, but provide the criteria to find out *before* the 3 years.
      *Refining Desideratum 1 (Baseline):* Make sure it emphasizes the *pre-divergence* similarity.
      *Refining Desideratum 4 (Coupling):* This is the Dutch/Ottoman specific issue. They traded. The explanation must account for why trade didn't equalize them.
      *Refining the "Teeth":* Ensure it hits the "Institutionalist" and "Culturalist" camps hard, as they often conflate "necessary for growth" with "cause of divergence."

  7.  **Final Review against Constraints:**
      *   Desiderata listed? Yes.
      *   Motivating case for each? Yes.
      *   Non-negotiable/Preference marked? Yes.
