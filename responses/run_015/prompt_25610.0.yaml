answer: |-
  # Specification for an Adequate Interpretation of Quantum Mechanics
  **Seminar Document: Foundations of Physics**

  ## Part I: Desiderata and Constraints

  The following list delineates the requirements for a candidate Interpretation of Quantum Mechanics (IQM). Each item is classified as **Non-Negotiable** (empirical or logical necessity), **Theoretical Virtue** (desirable but dispensable), or **Contested** (rejected by significant schools of thought).

  ### 1. Empirical Adequacy (The Born Rule)
  *   **Specification:** The interpretation must recover the statistical predictions of standard quantum formalism, specifically the Born rule probabilities ($P = |\psi|^2$), within experimental error bounds.
  *   **Motivation:** Physics is an empirical science. An interpretation that predicts different statistics than those verified in Aspect, Zeilinger, and Clauser experiments is falsified.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** Some interpretations (e.g., Many-Worlds) derive the Born rule rather than postulating it; they must still demonstrate that the derivation yields the correct frequencies for observers.

  ### 2. Definite Outcomes (The Measurement Problem)
  *   **Specification:** The interpretation must account for the fact that measurements yield unique, determinate macroscopic records (e.g., a pointer points left *or* right, not a superposition of both).
  *   **Motivation:** Our experience is of definite events. If the physical ontology remains in a superposition at the macroscopic level without qualification, the interpretation fails to connect the formalism to experience.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** "Account for" is the operative phrase. Some interpretations (MWI) deny uniqueness (see #7); others (Collapse) modify dynamics; others (Bohm) add variables. All must explain why we *experience* definiteness.

  ### 3. Signal Locality (No Superluminal Signaling)
  *   **Specification:** The interpretation must prohibit the transmission of information faster than the speed of light ($c$).
  *   **Motivation:** Superluminal signaling leads to causal paradoxes (closed timelike curves) in Special Relativity. Experimental tests confirm that entanglement cannot be used for signaling.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** Distinct from *Bell Locality* (see #4). All viable interpretations respect Signal Locality, even if they violate Bell Locality.

  ### 4. Bell Locality (Local Causality)
  *   **Specification:** The probability of an outcome at one wing of an experiment should not depend on the setting or outcome of a spacelike-separated measurement, given a complete specification of the past light cone (Factorizability).
  *   **Motivation:** Adherence to the relativistic intuition that physical influences propagate continuously through spacetime and do not act instantaneously at a distance.
  *   **Status:** **Contested / Sacrificed.**
  *   **Case for Rejection:** Bell's Theorem proves this is incompatible with Empirical Adequacy (#1) and Realism (#5). Most interpretations explicitly abandon this while preserving Signal Locality (#3).

  ### 5. Ontic Realism (Mind-Independence)
  *   **Specification:** The state of the system ($\psi$ or otherwise) represents a mind-independent physical reality, not merely an agent's knowledge or betting preferences.
  *   **Motivation:** Scientific realism suggests physics describes the world as it is, not just our interface with it. Avoids solipsism.
  *   **Status:** **Contested.**
  *   **Case for Rejection:** QBism and Copenhagen variants argue that the quantum state is epistemic (information). The PBR Theorem challenges this, but only under specific independence assumptions.

  ### 6. Determinism
  *   **Specification:** Given the complete state of the universe at time $t$, the state at $t+\Delta t$ is uniquely fixed.
  *   **Motivation:** Preserves the classical ideal of causal closure and removes fundamental randomness from nature.
  *   **Status:** **Theoretical Virtue.**
  *   **Note:** Standard QM is indeterministic. Bohmian mechanics is deterministic. MWI is deterministic (unitary evolution). GRW is indeterministic.

  ### 7. Single World (Uniqueness of History)
  *   **Specification:** There is exactly one actualized history of events. If a measurement has two possible outcomes, only one occurs in reality.
  *   **Motivation:** Matches pre-theoretic intuition and the apparent uniqueness of memory and record.
  *   **Status:** **Contested.**
  *   **Case for Rejection:** Everettian (MWI) interpretations deny this, positing that all outcomes occur in branching worlds. They argue "Single World" is a perspectival illusion.

  ### 8. Non-Contextuality
  *   **Specification:** The value of a physical property exists independently of which other compatible measurements are performed alongside it.
  *   **Motivation:** Realist intuition that objects possess properties intrinsically.
  *   **Status:** **Ruled Out (for Hidden Variables).**
  *   **Case for Rejection:** The Kochen-Specker theorem proves that non-contextual hidden variable theories are incompatible with Empirical Adequacy (#1) in dimensions $d \geq 3$.

  ### 9. Measurement Independence (Statistical Independence)
  *   **Specification:** The hidden variables describing a system are statistically independent of the future measurement settings chosen by the experimenter ($\rho(\lambda | \text{settings}) = \rho(\lambda)$).
  *   **Motivation:** Presupposes "free choice" or at least that the source of particles is not conspiratorially correlated with the detector settings.
  *   **Status:** **Contested.**
  *   **Case for Rejection:** Superdeterminism rejects this to preserve Locality (#4). It is often dismissed as "unscientific" because it undermines the assumption of independent testing, but it is logically viable.

  ### 10. Lorentz Invariance (Fundamental)
  *   **Specification:** The fundamental ontology and dynamics, not just the empirical predictions, should be manifestly invariant under Lorentz transformations.
  *   **Motivation:** Special Relativity is a cornerstone of modern physics. A fundamental preferred frame is theoretically costly.
  *   **Status:** **Theoretical Virtue.**
  *   **Note:** Bohmian mechanics requires a preferred foliation of spacetime (hidden). GRW faces difficulties constructing a relativistic flash ontology. MWI and Copenhagen (agnostic on ontology) fare better here.

  ---

  ## Part II: Joint (Un)satisfiability and No-Go Theorems

  This section explicitly identifies which subsets of the above desiderata cannot be jointly satisfied. These are not engineering challenges; they are logical impossibilities proven by theorem.

  ### 1. The Bell Trilemma (Locality vs. Realism)
  *   **Incompatible Set:** { **Bell Locality** (#4), **Realism/Determinism** (#5, #6), **Empirical Adequacy** (#1) }.
  *   **Theorem:** **Bell's Theorem (1964)** and subsequent experimental violations of Bell Inequalities (Aspect 1982, Hensen 2015, etc.).
  *   **Implication:** You cannot have a theory that is locally causal, realist (in the sense of pre-existing values for measurements), and empirically adequate.
      *   *To save Locality:* You must abandon Realism (Copenhagen, QBism) or Measurement Independence (Superdeterminism).
      *   *To save Realism:* You must abandon Locality (Bohmian Mechanics) or Single World (MWI, which redefines locality).
  *   **Explicit Answer to Prompt:** **No interpretation can simultaneously satisfy Bell Locality, Determinism (of outcomes/variables), and Empirical Equivalence.** Bell's theorem forces the tradeoff. Note that *Signal Locality* (#3) can be kept with Determinism (Bohm) or Realism, but *Bell Locality* cannot.

  ### 2. The Measurement Trilemma (Maudlin's Problem)
  *   **Incompatible Set:** { **Unitary Evolution** (Linear Dynamics), **Definite Outcomes** (#2), **Completeness** (Wavefunction is the whole state) }.
  *   **Theorem:** **Maudlin's Measurement Problem (1995)** formulation of the inconsistency.
  *   **Implication:**
      *   *Copenhagen:* Drops Completeness (adds classical cut/observer).
      *   *MWI:* Drops Definite Outcomes (Single World #7).
      *   *GRW/Bohm:* Drops Unitary Evolution (adds collapse or guidance equation).

  ### 3. The Contextuality Constraint
  *   **Incompatible Set:** { **Non-Contextuality** (#8), **Empirical Adequacy** (#1), **Realism** (#5) }.
  *   **Theorem:** **Kochen-Specker Theorem (1967).**
  *   **Implication:** Any realist interpretation assigning definite values to observables must be *contextual*. The value of an observable depends on what else is measured. Bohmian mechanics is explicitly contextual.

  ### 4. The Ontology Constraint
  *   **Incompatible Set:** { **Psi-Epistemic** (Wavefunction is knowledge), **Preparation Independence**, **Empirical Adequacy** (#1) }.
  *   **Theorem:** **PBR Theorem (Pusey, Barrett, Rudolph, 2012).**
  *   **Implication:** If independently prepared systems have independent physical states, the quantum state must be ontic (real), not merely epistemic.
      *   *Cost:* To remain Psi-Epistemic (like QBism), one must reject Preparation Independence (suggesting a holistic universe where independent preparation is impossible) or deny the theorem's assumptions about reality.

  ---

  ## Part III: Scorecard of Major Interpretations

  This scorecard demonstrates how existing families navigate the impossibility results above. A check (✓) indicates satisfaction; a cross (✗) indicates explicit rejection; a tilde (~) indicates modification or ambiguity.

  | Desideratum | **Copenhagen** (Standard) | **Many-Worlds** (Everett) | **Bohmian** (Pilot-Wave) | **GRW** (Objective Collapse) | **QBism** (Quantum Bayesian) | **Superdeterminism** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1. Empirical Adequacy** | ✓ | ✓ | ✓ | ~ (Tunable) | ✓ | ✓ |
  | **2. Definite Outcomes** | ~ (Postulated) | ✗ (All occur) | ✓ | ✓ | ✓ (Subjective) | ✓ |
  | **3. Signal Locality** | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |
  | **4. Bell Locality** | ✗ (Non-local collapse) | ✓ (Local unitary) | ✗ (Explicitly Non-local) | ✗ (Non-local collapse) | N/A (No ontology) | ✓ |
  | **5. Ontic Realism** | ✗ (Instrumentalist) | ✓ (Wavefunction Real) | ✓ (Particles + Wave) | ✓ (Wavefunction Real) | ✗ (Epistemic) | ✓ |
  | **6. Determinism** | ✗ | ✓ | ✓ | ✗ (Stochastic) | ✗ | ✓ |
  | **7. Single World** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ |
  | **8. Non-Contextuality** | N/A | N/A | ✗ (Contextual) | N/A | N/A | ~ |
  | **9. Meas. Independence** | ✓ | ✓ | ✓ | ✓ | ✓ | ✗ (Violated) |
  | **10. Lorentz Invariance** | ~ (Ambiguous) | ✓ | ✗ (Preferred Frame) | ~ (Difficult) | ✓ | ~ |
  | **Primary Sacrifice** | Realism / Clarity | Single World | Locality | Unitarity / Energy | Realism | Free Choice |

  ### Analysis of the Scorecard

  1.  **Copenhagen:** Survives by remaining agnostic on ontology (#5). It treats the measurement apparatus as classical, effectively sidestepping the Measurement Trilemma by fiat rather than mechanism. It violates Bell Locality via collapse but preserves Signal Locality.
  2.  **Many-Worlds (MWI):** The only interpretation that preserves Unitary Evolution and Determinism (#6) without adding hidden variables. It pays the cost of **Single World (#7)**. It claims to satisfy Bell Locality because branching is local, though this is debated (outcome dependence remains).
  3.  **Bohmian Mechanics:** The most robustly Realist (#5) and Deterministic (#6) theory. It pays the cost of **Bell Locality (#4)** and **Lorentz Invariance (#10)**. It explicitly introduces a preferred foliation of spacetime to define the guidance equation, though this foliation is empirically inaccessible (preserving Signal Locality #3).
  4.  **GRW:** Solves the Measurement Problem (#2) dynamically by modifying the Schrödinger equation. It preserves Single World and Realism but sacrifices Determinism (#6) and strict Unitary Evolution. Relativistic generalization remains an open technical challenge (#10).
  5.  **QBism:** Dissolves the Measurement Problem by locating the "collapse" in the agent's belief update. It sacrifices Ontic Realism (#5) entirely. It is immune to Bell and PBR theorems because it denies the premise that the wavefunction describes external reality.
  6.  **Superdeterminism:** The only path to retaining **Bell Locality (#4)** and **Determinism (#6)** alongside Realism. It pays the extreme cost of violating **Measurement Independence (#9)**. It implies that the experimenter's choice of setting is correlated with the particle source, undermining the standard methodology of experimental science.

  ### Conclusion for the Seminar
  An "adequate" interpretation is not one that satisfies all desiderata, as **Part II** proves this is impossible. Adequacy is defined by *which* non-negotiable constraints (Empirical Adequacy, Signal Locality, Definite Experience) are preserved, and which theoretical virtues (Locality, Determinism, Single World, Realism) are sacrificed. The choice of interpretation is therefore a choice of which metaphysical cost one is willing to bear.
