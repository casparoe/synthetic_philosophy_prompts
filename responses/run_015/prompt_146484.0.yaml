answer: |-
  There is no single, canonical Latin term for this specific maneuver, but in the philosophy of science and historiography, it is recognized as a form of **Theoretical Immunization** (or **Immunization Strategy**) achieved through **Level-Shifting**.

  In the specific context of Holocaust historiography (Browning vs. Goldhagen), this is often discussed under the rubric of the **Structure-Agency Problem**, but when used defensively to avoid falsification, it is best described as **Explanatory Buck-Passing** or **Multi-Level Immunization**.

  Here is a breakdown of the concept, its edges, and how it differs from legitimate causal models.

  ### 1. The Established Concepts
  While there isn't one word for it, three established frameworks describe exactly what you are seeing:

  *   **Lakatosian Protective Belt:** Imre Lakatos argued that scientific research programmes have a "hard core" of assumptions that are protected from falsification by a "protective belt" of auxiliary hypotheses. When a counterexample arises (e.g., "Ordinary men weren't pressured"), the theorist adjusts the belt (e.g., "Okay, it wasn't pressure, it was culture") without abandoning the core. Your observation identifies a *multi-level* protective belt where the auxiliary hypotheses jump between micro (psych), meso (group), and macro (culture) levels.
  *   **The Structure-Agency Oscillation:** In sociology, this is the tension between *structure* (situational/cultural constraints) and *agency* (individual choice). A theory becomes unfalsifiable if it treats structure and agency as a seesaw: whenever agency is disproven, the explanation retreats to structure, and vice versa.
  *   **Explanatory Elasticity:** This is a pejorative term used in critical historiography. It describes a theory that stretches to accommodate contradictory evidence by shifting the *scale* of analysis (from the individual to the state, from the moment to the century) rather than refining the causal mechanism.

  ### 2. Defining the Edges: When is it a Fallacy?
  This pattern is not always fallacious. History *is* multi-causal. To identify when this moves from legitimate complexity to **Explanatory Buck-Passing**, look for these three markers:

  1.  **Sequential Rescue, Not Simultaneous Modeling:**
      *   *Legitimate:* "The event was caused by the interaction of Situation S and Ideology I at the same time."
      *   *Buck-Passing:* "It was Situation S." (Challenge: S didn't exist.) "Okay, it was Ideology I that created S." (Challenge: I didn't exist.) "Okay, it was Situation S' that created I."
      *   *The Edge:* The levels are invoked *sequentially* to defend against critique, not *simultaneously* to model the event.

  2.  **Lack of Specification:**
      *   *Legitimate:* The theorist specifies the mechanism by which culture shapes elites or elites shape culture.
      *   *Buck-Passing:* The link between levels is assumed or hand-waved. The "culture" is invoked only when "situation" fails, without independent evidence for the culture's causal weight.

  3.  **Falsifiability Block:**
      *   *Legitimate:* There is evidence that *could* disprove the cultural claim.
      *   *Buck-Passing:* Because the explanation can always retreat to a deeper/historical level ("The culture was shaped by prior situations"), no contemporary evidence can ever falsify the claim.

  ### 3. Distinction from Interaction Effects
  An **Interaction Effect** is a statistical or causal claim that Variable A and Variable B modify each other's impact on Outcome Y ($Y = A + B + A \times B$).

  *   **Difference:** An interaction effect is a **positive claim** about how the world works. It risks being wrong. If you find no interaction, the model fails.
  *   **The Loop:** The pattern you identified is a **defensive maneuver**. It does not claim $A \times B$; it claims $A$, and if $A$ is attacked, it claims $B \rightarrow A$. It is designed specifically *not* to be wrong. An interaction effect invites testing; this loop evades it.

  ### 4. Distinction from Circular Reasoning
  **Circular Reasoning** (Begging the Question) is a logical error where the conclusion is included in the premise ($A$ is true because $B$ is true; $B$ is true because $A$ is true).

  *   **Difference:** Circular reasoning is a **logical** flaw within a single argument.
  *   **The Loop:** The pattern you identified is a **causal/regressive** flaw across a debate. It is not strictly circular ($A \rightarrow B \rightarrow A$) so much as it is an **Infinite Regress of Justification**.
      *   *Circular:* "The culture caused the killing because the killers were cultural."
      *   *Your Loop:* "Situation caused killing." $\rightarrow$ "Who made the situation?" $\rightarrow$ "Elites." $\rightarrow$ "Who made the elites?" $\rightarrow$ "Culture." $\rightarrow$ "Who made the culture?" $\rightarrow$ "Past Situations."
      *   This is not logically invalid (causal chains exist), but it is **explanatorily vacuous** if it never lands on a testable variable. It pushes the "prime mover" forever out of reach.

  ### 5. Proposed Terminology
  If you need a term to use in writing or discussion, the most precise label is **Multi-Level Immunization**.

  However, in the specific context of the Browning/Goldhagen debate, historians often refer to this as the **Functionalist-Intentionalist Synthesis Trap**.
  *   **Goldhagen (Intentionalist):** Focuses on ideology/culture.
  *   **Browning (Functionalist):** Focuses on situation/structure.
  *   **The Trap:** When critics corner the Functionalist on the origin of the structure, they borrow Intentionalist arguments (ideology made the structure). When critics corner the Intentionalist on the origin of the ideology, they borrow Functionalist arguments (structural pressures made the ideology).

  ### Summary
  You have identified a form of **Unfalsifiability via Level-Shifting**. It differs from an interaction effect because it is sequential and defensive rather than simultaneous and predictive. It differs from circular reasoning because it relies on causal regress rather than logical equivalence. In philosophy of science, it is a violation of **Lakatosian progressiveness**, where the theory absorbs anomalies by shifting the level of analysis rather than generating new, testable predictions.

  **Recommended Label:** **Explanatory Buck-Passing** or **Multi-Level Immunization**.
