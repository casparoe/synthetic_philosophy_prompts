prompt: |-
  I'm running a grad seminar next thursday on folk morality and I want to tackle german vs american styles — not the usual dev-psych framing but the lived tension between 'follow the rule because it's the rule' and 'follow your gut even if it breaks the form.' I have this framing I call the inversion problem: in german bureaucratic culture people treat unwritten procedural norms as harder obligations than written ones, while americans do the opposite — explicit rules are traps, implicit norms are suggestions. I need a teaching plan, not a lectre. What's the dependency order — which idea has to land first so the inversion isn't just a stereotype? What's the carrying example? I'm leaning toward a neighborhood composting ordnance where weighing is mandatory but color-coding is tradition, but tell me what that example needs to have and what's wrong with it if anything. What misconceptions will they walk in with — probably that germans are just obedient and americans are just rebellious — and exactly where in the sequence should I head each one off? Give me one check question at the end that proves they got the inversion rather than just repeating it back. And be honest: what's the part that's too subtle for ninety minutes and I should drop entirely?
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Topic:** Folk morality: German vs. American styles (Rule-bound vs. Gut-driven).
      *   **Specific Framing:** "The Inversion Problem" (Germans: unwritten norms > written rules; Americans: written rules > unwritten norms).
      *   **Goal:** A teaching plan (seminar style), *not* a lecture.
      *   **Key Requirements:**
          *   Dependency order (what concept must land first).
          *   Carrying example evaluation (Neighborhood composting ordinance: weighing = mandatory, color-coding = tradition).
          *   Misconception management (Germans = obedient, Americans = rebellious).
          *   Check question (proves understanding of inversion, not just repetition).
          *   Honesty check (what to drop for a 90-minute session).

  2.  **Deconstruct the "Inversion Problem" Framing:**
      *   *Claim:* Germans treat unwritten procedural norms as harder obligations than written ones. Americans treat explicit rules as traps and implicit norms as suggestions.
      *   *Critique:* This is a provocative, high-risk framing. It contradicts the standard stereotype (Germans = rigid rule followers, Americans = loose cowboys). To make this work in a grad seminar, it needs nuance. It's not about *obedience*, it's about *source of legitimacy*.
      *   *Risk:* If not grounded well, it becomes cultural essentialism/stereotype.

  3.  **Determine Dependency Order:**
      *   To avoid stereotype, students must first understand *why* rules exist in each context.
      *   *Step 1:* Legitimacy Source. Where does the "ought" come from? (Systemic Integrity vs. Individual Outcome).
      *   *Step 2:* The Function of the Written Rule. Is it a floor or a ceiling? Is it a shield or a sword?
      *   *Step 3:* The Inversion. Now apply the specific claim.
      *   *Reasoning:* If you start with the Inversion, it sounds like a paradoxical slogan. If you start with Legitimacy, it becomes a structural analysis.

  4.  **Evaluate the Carrying Example (Composting Ordinance):**
      *   *Scenario:* Weighing is mandatory (written), Color-coding is tradition (unwritten).
      *   *German Reaction (per framing):* Ignore the weight if the color is wrong? Or treat the color code as the *real* law? The prompt says Germans treat unwritten norms as *harder*. So, if the bin is the wrong color (tradition), it doesn't get picked up, even if weighed correctly.
      *   *American Reaction (per framing):* Follow the weight (written rule) to avoid fine, ignore color (suggestion). Or, view the weight rule as a trap to be loopholed.
      *   *Problem:* Composting is low stakes. Folk morality needs moral weight. Also, "color-coding" might be too arbitrary.
      *   *Fix:* Needs higher stakes and clearer "spirit vs. letter" tension. A noise ordinance or a building permit is better. Let's stick with the user's composting idea but sharpen it. The "weight" needs to be the legal limit, the "color" needs to be the social signal of compliance.
      *   *Refinement:* Actually, the user's specific inversion claim is: Germans = Unwritten > Written. Americans = Written > Unwritten.
      *   *Composting Fit:*
          *   German: The written rule says "Max 10kg." The unwritten norm says "Bins out by 6 AM." If you put a 5kg bin out at 7 AM, it's a violation. If you put a 12kg bin out at 5 AM in the right bag, it might be tolerated. (Wait, that contradicts the "Germans love rules" stereotype, which is the point of the inversion).
          *   *Better Example:* A queue or a form.
          *   *Let's stick to the User's Composting but fix the stakes:* The written rule is "Organics only." The unwritten norm is "Rinse the containers."
          *   *German:* If you rinse but put plastic in, you are violating the *system* (unwritten integrity). If you put organics in unwashed, you are dirty but compliant. Actually, the prompt says "unwritten procedural norms as harder obligations."
          *   *Okay, let's analyze the User's specific Inversion Claim again:* "Germans treat unwritten procedural norms as harder obligations than written ones." This is the *Ordnung* concept—the order behind the law. "Americans... explicit rules are traps."
          *   *Composting Verdict:* It's a bit weak on "morality." It feels like administrative compliance. Needs to feel like a *violation of trust*.
          *   *Suggestion:* Keep composting but make the unwritten norm about *community contribution* vs. *individual compliance*.

  5.  **Identify Misconceptions & Timing:**
      *   *Misconception 1:* "Germans are rigid." -> Address this *immediately* in the setup. Frame it as "Systemic Trust" vs. "Individual Agency."
      *   *Misconception 2:* "Americans are lawless." -> Address this during the example analysis. Frame it as "Legalism as Defense."
      *   *Timing:* Don't let them sit with the stereotype for more than 5 minutes.

  6.  **Drafting the Check Question:**
      *   Needs to force application, not definition.
      *   Scenario: A new rule is introduced that contradicts an old norm. Who rebels? Who complies?
      *   *Idea:* A manager changes a reporting deadline (written) but ignores the approval chain (unwritten).
      *   *German:* Upset about the broken chain (unwritten).
      *   *American:* Upset about the deadline (written) or tries to loophole the chain.

  7.  **Honesty Check (What to Drop):**
      *   90 minutes is short for deep cultural anthropology.
      *   *Drop:* Historical origins (Luther vs. Jefferson). It's interesting but distracts from the *lived tension*.
      *   *Drop:* Regional variations within US/DE (Bavaria vs. Berlin, South vs. North). Too much noise.
      *   *Focus:* The phenomenology of the rule violation.

  8.  **Developing the Teaching Plan (Iterative Process):**
      *   *Phase 1: Setup (15 mins).* Break the stereotype immediately. Define "Folk Morality."
      *   *Phase 2: The Dependency (20 mins).* Legitimacy sources.
      *   *Phase 3: The Example (30 mins).* Composting deep dive. Small groups.
      *   *Phase 4: Synthesis (15 mins).* Discussion.
      *   *Phase 5: Check (10 mins).*

      *Refining the Composting Example:*
      *   Written: "Bins must be under 20lbs."
      *   Unwritten: "Bins must be rinsed and sorted by material type A, B, C."
      *   German Inversion: A 25lb bin that is perfectly sorted gets picked up (System integrity maintained). A 15lb bin that is dirty/mixed gets flagged (System integrity violated).
      *   American Inversion: A 25lb bin gets fined (Written rule). A dirty bin gets ignored (Unwritten norm is suggestion).
      *   *Wait, does this match the prompt?* Prompt: "Germans treat unwritten... as harder." "Americans... explicit rules are traps."
      *   *American nuance:* Americans see the written rule as a "trap" meaning they look for loopholes, but they adhere to the text because it's enforceable. They ignore the unwritten.
      *   *German nuance:* Germans see the written rule as a baseline, but the *spirit* (unwritten) is the real binding contract.
      *   *Critique of Composting:* It's still too administrative. Let's suggest a "Noise/Party" example or keep Composting but emphasize the *social contract* aspect. Let's stick with Composting but advise the user to make sure the "unwritten" part feels moral, not just procedural. The "unwritten" part must be about *respect for the collective*.

      *Refining the Check Question:*
      *   Need a scenario where Written and Unwritten conflict.
      *   "You find a loophole in the written rule that violates the unwritten norm. Do you take it?"
      *   German: No (Unwritten binds).
      *   American: Yes (Written is the only bind).

  9.  **Final Review against Constraints:**
      *   Teaching plan, not lecture? Yes, focus on activities/discussion.
      *   Dependency order? Yes (Legitimacy -> Inversion).
      *   Carrying example analysis? Yes (Composting pros/cons + fix).
      *   Misconceptions? Yes (Obedience vs. Integrity).
      *   Check question? Yes.
      *   What to drop? Yes (History/Regional).

  10. **Tone:** Academic, direct, slightly critical (since it's a grad seminar).

  *(Self-Correction during drafting)*: I need to be careful not to validate the stereotype as *truth*, but as a *phenomenological lens*. The prompt asks for a teaching plan on this framing, so I must treat the framing as the object of study, while ensuring the students don't walk away thinking "All Germans are X." I need to emphasize *institutional logic* over *national character*.

  *Revised Plan Structure:*
  1.  **Pre-work:** Reading (short).
  2.  **Opening:** Disrupt the stereotype.
