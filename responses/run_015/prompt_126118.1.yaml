answer: |-
  This is a high-risk, high-reward framing. If you treat it as "national character," you'll get pushback on essentialism. If you treat it as "institutional logic," it's a powerful lens on moral psychology.

  Here is the teaching plan designed to land the **Inversion Problem** without collapsing into stereotype.

  ### 1. The Dependency Order
  You cannot teach the Inversion until you have taught **Legitimacy**.
  If you start with "Germans ignore written rules," they will reject it immediately because it contradicts the "Germans are rigid" stereotype.

  **Sequence:**
  1.  **Source of Obligation:** Where does the "ought" come from? (Is it the *text* of the law, or the *integrity* of the system?)
  2.  **Function of the Rule:** Is the written rule a **shield** (protection from liability) or a **floor** (minimum standard of conduct)?
  3.  **The Inversion:** Now apply the specific claim.
      *   *US:* Written rule = The boundary of safety. If it's not written, it's not enforceable, therefore not obligatory.
      *   *DE:* Written rule = The codification of the norm. If you follow the text but break the norm, you have violated the *Ordnung* (order), which is the higher moral good.

  **Why this order?** It moves the discussion from "personality" (obedient vs. rebellious) to "structural trust" (systemic vs. individual).

  ### 2. The Carrying Example: Composting Ordinance
  Your composting example is workable, but currently too administrative. To make it *folk morality*, the violation needs to feel like a **betrayal of trust**, not just a paperwork error.

  **The Setup:**
  *   **Written Rule:** "Compost bins must not exceed 20lbs." (Enforceable by weight check).
  *   **Unwritten Norm:** "Organics must be rinsed of non-compostable residue." (Not enforceable by weight, requires visual inspection/trust).

  **The Scenario:**
  *   **Actor A:** Puts out a 25lb bin, but the contents are perfectly rinsed and sorted.
  *   **Actor B:** Puts out a 15lb bin, but it contains dirty jars with food residue.

  **What the example needs to have:**
  *   **Consequence:** The truck driver has discretion. They can tag the bin (refuse pickup) or fine the house.
  *   **The Tension:** The driver knows the weight is over (Written Violation) but sees the care taken (Unwritten Compliance). Conversely, the weight is under (Written Compliance) but the content is lazy (Unwritten Violation).

  **What's wrong with it (and how to fix it):**
  *   **Risk:** It feels like "following instructions."
  *   **Fix:** Frame the unwritten norm as **Community Stewardship**. The rinsing isn't about the machine; it's about not ruining the compost for the neighbor who uses the soil. The weight limit is about the truck's hydraulic capacity (technical).
  *   **The Inversion Test:**
      *   *US Style:* Actor B is "safe." They met the measurable metric. Actor A is "liable." They broke the hard rule.
      *   *DE Style:* Actor A is "understandable" (maybe get a warning). Actor B is a *moral violator*. They are gaming the system. The unwritten norm (stewardship) carries more moral weight than the technical limit.

  ### 3. Misconceptions & Interception Points
  Students will walk in with two main stereotypes. Here is where you kill them:

  **Misconception 1: "Germans are just more obedient."**
  *   **Where to head it off:** **Minute 15 (Source of Obligation).**
  *   **The Interception:** Explicitly state: "This is not about obedience. It is about *where the authority lives*." In the US, authority lives in the document (Constitution, Contract, Code). In DE, authority lives in the *System* (The *Ordnung*). A German breaking a written rule to preserve the System isn't disobedient; they are prioritizing the higher order.
  *   **Prompt:** "Ask yourself: Is the rule the master, or is the rule a tool for the master?"

  **Misconception 2: "Americans are just more rebellious/individualistic."**
  *   **Where to head it off:** **Minute 45 (During Example Analysis).**
  *   **The Interception:** When they say Americans "ignore the unwritten," correct them: "Americans treat the unwritten as *private preference*." It's not rebellion; it's a boundary. "My gut is my business; the rule is our business."
  *   **Prompt:** "Is ignoring the color-code rebellion, or is it a defense against scope creep?"

  ### 4. The Check Question
  Do not ask them to define the inversion. Ask them to predict behavior in a **conflict scenario**.

  **The Question:**
  > "A university introduces a new written policy: 'All seminar papers must be submitted by 5 PM Friday.' The unwritten departmental norm is: 'Professors grant extensions if the student communicates early.'
  >
  > A student submits at 5:05 PM on Friday without asking for an extension.
  >
  > **According to the Inversion Problem:**
  > 1. Which professor (US or DE) is more likely to view this as a *moral failure* rather than an administrative error?
  > 2. Which professor is more likely to accept a 'loophole' argument (e.g., 'The portal didn't close until 5:06')?"

  **Correct Answer Key:**
  1.  **DE Professor:** Views it as moral failure. The written time is a formality; the unwritten norm (communication/respect) was violated. The student broke the *relationship*.
  2.  **US Professor:** More likely to accept the loophole. The written rule is the trap/boundary. If the portal was open, the rule wasn't broken. The unwritten norm is a suggestion, not a binding contract.

  *If they answer this correctly, they understand the **source of legitimacy**, not just the stereotype.*

  ### 5. Honesty Check: What to Drop
  **Drop the Historical Origins.**
  You will be tempted to explain *why* this exists (Lutheran theology vs. Jeffersonian individualism, or post-war reconstruction vs. frontier law).
  *   **Why drop it:** In 90 minutes, this turns into a history lecture. It distracts from the *phenomenology* (the lived experience) of the rule.
  *   **Risk:** It invites debate about whether the history is accurate, which derails the seminar from "how does this moral framing work" to "is this history true."
  *   **Keep it focused:** Treat the styles as **current operational logics**, not historical destinies.

  **Drop Regional Variations.**
  Do not let students argue "Well, Berlin is different than Bavaria" or "The South is different than the Northeast."
  *   **Why drop it:** It's a grad seminar on *folk morality models*, not a geography class. Acknowledge the variation exists, but bracket it to analyze the *ideal types*. If you don't bracket it, the model dissolves into noise.

  ### Summary Timeline (90 Mins)
  *   **0-15:** **Disruption.** Present the Stereotype (Germans=Rigid, US=Loose). Immediately smash it with the Inversion claim. Establish **Legitimacy** (Text vs. System).
  *   **15-35:** **Concept Build.** Discuss "Rule as Shield" (US) vs. "Rule as Floor" (DE).
  *   **35-65:** **The Composting Case.** Small groups. Assign half the room US logic, half DE logic. Have them argue the fate of Actor A (Overweight/Clean) and Actor B (Underweight/Dirty).
  *   **65-80:** **Synthesis.** Bring it back to "Folk Morality." How does this create friction in transnational teams/research?
  *   **80-90:** **Check Question & Exit.** Individual written response to the University Paper scenario.
