  I reject this invention absolutely, for it constitutes not a return to natural feeling but the ultimate triumph of artifice over the human soul. You argue that by isolating the spectator you preserve authenticity, but I tell you that man is born for society, and to sever him from his neighbor is to strip him of his virtue. In the theater I opposed, at least the audience breathed the same air and feared for the same hero; here, you propose a darkness so profound that each man is buried alive in his own sensation, shackled by wires and governed by a machine that calculates his weakness. You call this individualized arc authentic, yet what feeling is natural when it is provoked by sensors and directed by a calculation? This is not the voice of conscience; it is the whisper of a tyrant who knows your pulse better than you do.

  True liberty requires the active citizen, not the passive subject who sits immobilized while a mechanism plays upon his nerves like a stringed instrument. Where is the General Will in a room of strangers who weep alone and never dry each other's tears? You have not dissolved the hierarchy; you have replaced the actor with the engineer, and the stage with a prison of data. If you wish to know true joy, do not hide in the dark with your machines; go out into the sunlight, join hands in a circle, and make yourselves the spectacle to one another. There, in the shared gaze of the community, lies the only catharsis that does not corrupt the morals of a republic.
