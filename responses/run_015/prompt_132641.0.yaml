answer: |-
  # Classification Tree: Occasionalism and Secondary Causation

  ### **Root Node**
  **Claim:** Created substances possess intrinsic dispositional powers that necessitate their effects independent of divine conservation.
  *   **Affirmative:** Go to **Leaf 1**.
  *   **Negative:** Go to **Node 2**.

  ---

  ### **Node 2**
  **Claim:** The denial of created causal powers applies to mental volitions and logical entailments just as it does to physical interactions (Global Occasionalism).
  *   **Negative (Restricted to Physical):** Go to **Node 3**.
  *   **Affirmative (Global):** Go to **Node 4**.

  ---

  ### **Node 3**
  **Claim:** Mental volitions directly effect changes in the physical world without divine mediation in the specific transaction.
  *   **Affirmative:** Go to **Leaf 2**.
  *   **Negative:** Go to **Leaf 3**.

  ---

  ### **Node 4**
  **Claim:** The uniformity of nature is grounded in a divinely instituted habit that imposes genuine modal force (necessity) on the sequence of events.
  *   **Affirmative:** Go to **Leaf 4**.
  *   **Negative:** Go to **Node 5**.

  ---

  ### **Node 5**
  **Claim:** This framework is compatible with the claim that probabilistic laws in quantum mechanics reflect ontological indeterminacy rather than mere divine epistemic limitation or hidden determinism.
  *   **Negative:** Go to **Leaf 5**.
  *   **Affirmative:** Go to **Leaf 6**.

  ---

  ### **Leaves**

  **Leaf 1: Causal Realism (Powerism)**
  *   **Defenders:** Aristotelians, Thomists, Contemporary Dispositionalists (e.g., C.B. Martin, Nancy Cartwright).
  *   **Most Awkward Commitment:** Must explain the metaphysical "oomph" of powers without falling into an infinite regress or collapsing into necessitarianism where God cannot intervene.

  **Leaf 2: Interactionist Hybrid**
  *   **Defenders:** Unnamed (Rare; resembles modified Cartesian Dualism).
  *   **Most Awkward Commitment:** Violates the causal closure of the physical; requires a mechanism for how a non-physical power moves a substance defined as lacking the power to be moved.

  **Leaf 3: Psycho-Physical Parallelism**
  *   **Defenders:** Unnamed (Resembles Leibnizian Pre-established Harmony but with occasionalist physics).
  *   **Most Awkward Commitment:** Renders mental volition causally inert regarding the physical world, making the synchronization of mind and body explanatorily redundant if the mind already possesses powers.

  **Leaf 4: Nomic Occasionalism**
  *   **Defenders:** Some interpretations of Malebranche (via "Divine Order"), Contemporary Nomic Theists.
  *   **Most Awkward Commitment:** Imposes a constraint on Divine Freedom; God must act according to a stable habit rather than pure will, risking a return to the necessary emanation Ghazālī sought to avoid.

  **Leaf 5: Classical Voluntarism**
  *   **Defenders:** Al-Ghazālī, Al-Ash'arī, Classical Ash'arite Theologians.
  *   **Most Awkward Commitment:** Makes God the direct agent of every specific event, including evil and pain, complicating theodicy and reducing scientific laws to mere descriptions of divine habit without explanatory depth.

  **Leaf 6: Quantum Occasionalism**
  *   **Defenders:** Unnamed (Emerging position in Analytic Theology/Philosophy of Physics).
  *   **Most Awkward Commitment:** Attributes ontological indeterminacy to the Divine Will itself, suggesting God does not determine specific outcomes in probabilistic events, which challenges traditional omniscience or providence.

  ---

  ### **Analysis of the Tree Structure**

  **Logically Coherent but Unoccupied Positions**
  *   **Leaf 2 (Interactionist Hybrid)** and **Leaf 3 (Psycho-Physical Parallelism)** represent logically coherent combinations of answers that are apparently unoccupied by major historical schools. Most thinkers who grant the mind causal power (Node 3 Affirmative) tend to grant physical substances some power as well (Root Affirmative), collapsing into Leaf 1. Conversely, those who deny physical powers usually deny mental powers to maintain metaphysical symmetry (Node 2 Affirmative), moving to Node 4.
  *   **Leaf 6 (Quantum Occasionalism)** is currently sparsely populated. While logically consistent, it requires a revision of classical theistic attributes regarding knowledge and will that most traditional occasionalists (like Ghazālī) would reject.

  **Indistinguishable Named Positions**
  *   **Al-Ghazālī and Al-Ash'arī:** Both figures share the path to **Leaf 5 (Classical Voluntarism)**. While Ghazālī refined the argument against necessary connection more rigorously than Al-Ash'arī, this tree's questions regarding the scope of powers, the status of divine habit, and probabilistic laws do not distinguish between them. Their differences regarding the doctrine of *kasb* (acquisition) are internal to Leaf 5 and require additional nodes regarding human moral responsibility to separate.
  *   **Malebranche and Certain Contemporary Occasionalists:** Depending on the interpretation of Malebranche's "Order," he may share the path to **Leaf 4** with contemporary defenders of nomic occasionalism. The tree cannot separate 17th-century rationalist motivations from modern analytic motivations if the structural commitments regarding modal force are identical.
