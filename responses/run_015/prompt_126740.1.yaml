answer: |-
  This is a remarkably sophisticated interdisciplinary puzzle. You are attempting to map a classical Indian causal-psychological epistemology (Nyāya) onto a modern structural-logical framework (Epistemic Game Theory).

  Your intuition that there is a "gap" is correct, but the source of the confusion lies in a category mismatch between the two systems, rather than a missing *pramāṇa*.

  Here is a breakdown of where your mapping holds, where it breaks, and how to resolve the "Common Knowledge" (CK) problem within a Nyāya framework without inventing a fifth *pramāṇa*.

  ### 1. The "Fifth Pramāṇa" Claim
  First, let's clear up the historical claim. **Orthodox Nyāya (both Old and Navya) strictly maintains four *pramāṇas*.**
  *   **Pratibhā:** This is indeed discussed in Indian philosophy, but primarily by the **Grammarians (Vaiyākaraṇas)** like Bhartṛhari and in **Aesthetic Theory (Alaṃkāraśāstra)**. It refers to intuitive flash or creative insight. It is not accepted by Nyāya as an independent *pramāṇa*.
  *   **Saṃketa:** This means "convention" (specifically the conventional relationship between word and meaning). In Nyāya, *saṃketa* is the *basis* for *śabda-pramāṇa*, not a *pramāṇa* itself.
  *   **Modern Scholars:** You may be recalling work by **B.K. Matilal** or **J.N. Mohanty**, who analyzed Nyāya using analytic philosophy. They might have discussed "social epistemology" or "shared intentionality," but they would not have posited a literal fifth *pramāṇa* to solve game theoretic CK. That would violate the core Nyāya ontology.

  ### 2. The Breakdown of Your Mapping
  Your analysis of the first three *pramāṇas* is largely sound from a Nyāya perspective:

  *   **Pratyakṣa (Perception):** You are correct. Nyāya is realist. I perceive my own mental states (*manas* contacting *ātman*), but I cannot perceive your mental states directly. *Parakāya-jñāna* (knowledge of another's body/mind) is never *pratyakṣa*.
  *   **Anumāna (Inference):** I can infer you know the rules based on your behavior (your move in the game). However, you identified the bottleneck: **The Recursion Problem.**
      *   To get Common Knowledge, I need to know $K_a(K_b(P))$.
      *   In Nyāya, each step of inference is a discrete cognitive event (*jñāna*).
      *   While logically possible to chain inferences, human cognition (*buddhi*) is limited. Nyāya acknowledges that infinite recursion is not psychologically realizable. Therefore, *anumāna* cannot generate the *infinite* hierarchy required for logical CK in finite human minds.
  *   **Upamāna (Comparison):** As you noted, this is for naming/identification (knowing a *gavaya* by comparing it to a *cow*). It adds no value to strategic coordination.

  ### 3. The Crux: *Śabda* and the *Āpta* Problem
  This is where your confusion is most productive. You wrote:
  > *"śabda only works with an āpta speaker, but in a symmetric coordination game nobody's an authority over the rules."*

  In classical Nyāya, *śabda* (testimony) is valid only if the source is an *āpta* (a trustworthy person who knows the truth and wishes to communicate it).
  *   **The Game Theory Conflict:** In a symmetric coordination game (like driving on the left vs. right), there is no "Guru." The rules are emergent or arbitrary conventions.
  *   **The Nyāya Solution:** You need to shift from *Pauruṣeya* (human) testimony to **Saṃketa (Convention)**.
      *   For Nyāya, the validity of language rests on *śakti* (the power of the word), which is established by *saṃketa*.
      *   Who establishes *saṃketa*? Nyāya says **God (Īśvara)** in the beginning of creation, or **ancestral usage** for secular terms.
      *   **Application:** If we view the "Rules of the Game" as a linguistic/conventional structure (*saṃketa*), then accessing them is a form of *śabda*. You don't need a specific *person* to be the *āpta*; the **Tradition/Institution** acts as the *āpta*.
      *   **However:** This still doesn't solve the *Common* Knowledge recursion. It solves how *I* know the rules. It doesn't guarantee *I know that You know*.

  ### 4. Where the Gap Actually Is (Ontology vs. Logic)
  The gap you are sensing is not a failure of Nyāya, but a difference in project.

  **Epistemic Game Theory** treats Common Knowledge as a **State of the System**. It is a logical condition. If a public announcement is made, CK is instantiated mathematically, regardless of psychological processing.

  **Nyāya Epistemology** treats Knowledge (*pramā*) as a **Causal Event in an Individual**.
  *   Knowledge is a *guṇa* (quality) of the *ātman* (self).
  *   It is episodic (*jñāna*).
  *   Nyāya is concerned with *soteriology* (liberation) and *vyavahāra* (successful daily action).

  **The Resolution: *Vyavahāra* (Pragmatic Success)**
  Nyāya does not require logical Common Knowledge for successful coordination; it requires **Pragmatic Certainty**.
  *   In *vyavahāra* (transaction/practice), we operate on **presumptive knowledge** (*tarka* or *arthāpatti*—though Nyāya subsumes *arthāpatti* under *anumāna*).
  *   If I see you stop at a red light, I infer you know the rule. I act accordingly. If we coordinate successfully, the knowledge is validated by **fruitful action** (*samvādi-pravṛtti*).
  *   Nyāya would argue that the infinite recursion of CK is a **logical fiction** (*jāti* or *chala* in debate terms) if it doesn't result in different practical outcomes. For Nyāya, if I act *as if* you know, and we coordinate, the epistemic requirement is satisfied for *vyavahāra*.

  ### 5. A Proposed Nyāya Reconstruction of CK
  If you want to force Nyāya to model CK without breaking its system, you wouldn't add a *pramāṇa*. You would use **Sāmānyalakṣaṇa Pratyakṣa** (Extraordinary Perception) combined with **Śabda**.

  1.  **Public Announcement as *Śabda*:** A public signal (e.g., a referee blowing a whistle) functions as *śabda*.
  2.  **The *Āpta* is the Institution:** The referee represents the *saṃketa* (convention).
  3.  **Inference of Recursion:**
      *   I perceive the whistle (*Pratyakṣa*).
      *   I know the whistle implies "Start" via convention (*Śabda*).
      *   I know *you* perceive the whistle (via *Anumāna* based on your sensory organs being functional and present).
      *   I know *you* know the convention (via *Anumāna* based on your participation in the game).
      *   **Crucial Step:** Nyāya admits **Jñāna-Lakṣaṇa Pratyakṣa** (perception through association). Through intense association, I can "perceive" the likelihood of your knowledge state without a fresh inference every time.
  4.  **Stopping the Regress:** Nyāya would argue the regress stops at **Practical Certainty**. The demand for infinite "I know that you know..." is a feature of formal logic, not human cognition (*buddhi*). Nyāya is a philosophy of human cognition, not abstract logic.

  ### Summary of the Confusion
  *   **Is it your grasp of Nyāya?** Slightly. *Saṃketa* is not a *pramāṇa*, and *pratibhā* is not Nyāya. Also, Nyāya allows *anumāna* to access other minds, just not with the infinite recursion logic demands.
  *   **Is it the Game Theory?** Yes, in the sense that CK is an idealization. Real humans never have true Common Knowledge; we have "Common Belief" or "Rationalizability."
  *   **The Gap:** The gap exists because Nyāya is **Individualist-Causal** (How does *this* cognition arise in *me*?), while Game Theory is **Structural-Systemic** (What is the state of the *group*?).

  **Recommendation:** If you are writing on this, look into **B.K. Matilal's "Epistemology, Logic, and Grammar in Indian Philosophical Analysis."** He discusses how Navya-Nyāya handles "shared knowledge" through the theory of *ākāṅkṣā* (expectancy) and *tātparya* (intention), which allows for intersubjective understanding without requiring a fifth *pramāṇa*. He argues that *śabda* inherently presupposes a shared linguistic world, which bypasses the need to *infer* the other's mind from scratch every time. The shared *saṃketa* **is** the common ground.
