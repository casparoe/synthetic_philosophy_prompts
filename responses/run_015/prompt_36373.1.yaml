answer: |-
  Dear Colleague,

  I understand the burden you carry each spring, standing between the subjective beauty of student work and the objective demands of a prize committee that requires defensible reasons for its choices. When losers appeal, they do not appeal against taste, but against procedure, so what you need is not a better ear but a documented trail that shows how your ear was applied. The Hofstadterian model of creativity as knob-twiddling within a structured space is an excellent scaffold for this because it forces you to define the space before you evaluate the movement within it. What follows is a procedure designed to be executed in roughly ten minutes per score, requiring no philosophical training but demanding explicit written statements at three specific junctures. These written statements are your armor against an appeals committee, for they transform a feeling of creativity into a record of structural analysis.

  The procedure begins with the first three minutes of your engagement with the score, during which you must identify and write down the theme. This is not merely the melody but the deep structure being varied, which might be a harmonic progression, a rhythmic cell, or a formal archetype. You must write this identification in the margin in one sentence, such as this is a variation on the harmonic rhythm of a twelve-bar blues or this is a morphological variation on the sonata-allegro form. If you cannot write this sentence, the procedure halts immediately, and you must mark the score as lacking an identifiable theme relative to the assignment constraints. This step is crucial because it anchors every subsequent judgment; if a student appeals claiming you missed their point, you can point to this sentence and show that your evaluation was consistent with the theme you identified. If the student argues the theme was something else, the burden shifts to them to demonstrate why their hidden theme was the intended one, rather than you having to justify why you did not find it.

  Once the theme is written down, you spend the next four minutes listing the knobs available in that space and sorting them into two categories. The first category is surface knobs, which include tempo, instrumentation, register, dynamics, and articulation. The second category is deep knobs, which include the harmonic scheme, the metric organization, the functional role of sections, and the voice-leading rules. You do not need to list every possible knob, only the relevant ones for this specific piece, but you must circle at least one deep knob that the piece engages with. This distinction is the heart of the Hofstadterian model, as it separates decoration from structural intervention. A piece that only twists surface knobs is operating within the factory settings of the deep structure, while a piece that twists deep knobs is altering the geometry of the space itself. You should mark these categories in the margin with a simple S for surface and D for deep next to the observed variations.

  The final three minutes are spent classifying the deviations from the theme into one of three categories: faithful reproduction, legible variation, or noise. A faithful reproduction twists no knobs of consequence and remains at factory settings. A legible variation twists one or more knobs such that a competent listener could still reconstruct the original theme through the distortion. Noise is where the signal is lost, either through randomness or through such extreme alteration that the theme is no longer recoverable. For a piece to count as creative under this procedure, it must demonstrate at least one legible variation on a deep knob. If it only demonstrates legible variations on surface knobs, it is classified as faithful reproduction with high polish. If it demonstrates changes that cannot be mapped to the theme, it is classified as noise unless the student has explicitly argued for a redefinition of the space. At this final step, the procedure stops and hands the decision back to your judgment, specifically regarding the question of whether a piece that obscures the theme has failed to vary it or has successfully invented a new space. You must write a brief note stating whether the obscurity is a failure of communication or a successful expansion of the genre, as this is the most likely point of contention in an appeal.

  To show you how this works in practice, I will run the procedure on the three cases you described, providing the verdicts and the marginal reasons a judge would write. The first case is the dazzling orchestration of the theme that twists only surface knobs while the deep structure is left untouched. When you apply the procedure, you identify the theme easily, perhaps writing this is a standard thirty-two-bar song form in major key. You list the knobs and note that the student has twisted instrumentation, register, and dynamics, all marked as surface knobs. The deep knobs of harmony and metric organization remain at factory settings. When you classify the deviations, you find they are legible variations, but only on surface parameters. The verdict under this procedure is that the piece is a faithful reproduction with high surface variation, which scores lower on creativity than a piece that engages deep structure. I must flag this now as the verdict you will not like, because while you and your colleagues find the orchestration beautiful, this procedure explicitly values structural intervention over surface beauty. The marginal note would read: technically proficient variation limited to surface parameters; deep structure remains static; beautiful but not structurally creative. If the prize is for creativity defined as structural innovation, this piece loses, and you must be prepared to defend the distinction between beauty and creativity when the student appeals.

  The second case is the piece that alters nearly every parameter at once, so that no single knob seems to have been deliberately chosen. When you apply the procedure, you struggle to write the theme identification sentence. You might write theme is obscured by total parameter alteration. You list the knobs and find that both surface and deep knobs are twisted simultaneously and aggressively. When you attempt to classify the deviations, you cannot determine if they are legible variations or noise because the theme cannot be reconstructed by a competent listener. Here the procedure halts and hands the decision to your judgment regarding the space itself. The marginal note must read: theme recovery impossible; judge must decide if this is noise or a new thematic space. If you decide it is noise, the piece is disqualified for failing the variation requirement. If you decide it is a new thematic space, you must note that the student has redefined the assignment rather than varied the given theme. This is the case where the knob-twiddling frame risks breaking down, because if every knob is turned, the panel itself may have been replaced, and the procedure cannot measure the creativity of building a new panel only the creativity of turning the knobs on the existing one.

  The third case is the piece that twists exactly one deep knob, say treating every phrase-ending as a phrase-beginning, and does nothing else. When you apply the procedure, you identify the theme clearly. You list the knobs and circle the formal function knob as a deep parameter. You observe that surface knobs are largely at factory settings, but the deep knob is twisted consistently and rigorously. When you classify the deviations, you find this is a legible variation on a deep knob because the original phrase structure is reconstructable through the inversion of function. The verdict is high creativity despite low surface activity. The marginal note would read: minimal surface variation but significant deep structural intervention; theme remains legible through functional inversion; highly creative within the defined space. This piece will score higher than the dazzling orchestration under this procedure, because it demonstrates the specific kind of conceptual manipulation Hofstadter describes as the essence of creativity, even if the result is less immediately pleasing to the ear.

  I must be candid with you about what this procedure cannot do, for no rubric can capture the whole of artistic value. The knob-twiddling frame breaks down precisely for the pieces that are most creative in the way that matters to you if your definition of creativity includes the beauty of the surface itself. This procedure privileges the architect over the decorator, the conceptualist over the colorist. It is designed to defend a decision based on structural innovation, not aesthetic pleasure. If your prize is intended to reward the most beautiful piece, this procedure will lead you astray, but if it is intended to reward the most creative variation on a theme, it will hold up under appeal. The procedure also cannot resolve the tension between a piece that hides the theme too well and a piece that abandons the theme entirely; it forces you to make a binary choice at the end about whether the space has been expanded or abandoned, and that choice remains a matter of judgment rather than calculation. You will still need your ear, and you will still need to justify why you deemed a certain level of obscurity as genius rather than failure, but this process ensures that when you do so, you are arguing from a documented analysis of structure rather than an undefended preference. Use this tool to clarify your reasoning, not to replace your expertise, and ensure that when you hand down the prize, the losers understand that they were judged on how they turned the knobs, not just on how the music sounded.
