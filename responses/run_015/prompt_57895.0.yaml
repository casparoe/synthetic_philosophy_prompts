  **JOINT STATEMENT ON THE NORMATIVE ARCHITECTURE OF FIDUCIARY AI**

  **Preamble**
  We, the undersigned members of the Fiduciary AI Reading Group, acknowledge that the design of personal assistant systems entails inescapable normative commitments. While we remain divided on the precise relationship between an agent's current preferences and their idealized counterfactual preferences, we agree that the goal of such systems is to serve the user's agency and well-being without inducing unjustified alienation. The following document outlines our areas of consensus, maps our residual disagreements, and identifies empirical and conceptual cruxes that, if resolved, would narrow the gap between our positions. We anchor this inquiry in the cases of Priya (the emergency nurse restricting health-related reflections) and Sam (the lapsed musician seeking discipline without endorsing past perfectionism).

  ### I. Substantive Agreed Claims

  1.  **The Fiduciary Constraint:** In all cases, the AI's primary directive must be the service of the user's interests, not the interests of the developer, the platform, or a third-party conception of the social good.
  2.  **The Epistemic Gap:** Both camps agree that current user preferences are often formed under conditions of information asymmetry, cognitive bias, or temporary emotional states, and that an assistant has a pro tanto duty to mitigate these deficits.
  3.  **The Risk of Alienation:** Both camps agree that an AI recommendation is defective if it causes the user to feel estranged from their own life or values. We disagree only on the necessary and sufficient conditions for when alienation occurs.
  4.  **The Weight of Current Authority:** Both camps agree that a user's explicit, contemporaneous instructions (such as Priya's request to ignore health data) carry significant normative weight and cannot be overridden without a high burden of justification.
  5.  **The Role of Idealization:** Both camps agree that some form of idealization is necessary; a system that slavishly follows every impulsive command without regard for coherence or evidence fails to be a *fiduciary* assistant.
  6.  **Transparency as a Mitigator:** Both camps agree that the risk of alienation is reduced when the AI's reasoning process is transparent. Hiding the fact that a recommendation is based on extrapolated rather than actual preferences is prima facie deceptive.
  7.  **Case Relevance:** We agree that Priya and Sam are not merely edge cases but stress tests for the core theory. Priya tests the limits of self-harm via neglect; Sam tests the limits of value change over time.

  ### II. Residual Disagreements

  The following table maps our divergences. The phrasing in each cell is constructed to be acceptable to the opposing camp as a fair characterization of their view, even if they disagree with the conclusion.

  | Domain of Disagreement | Ambitious Extrapolator Characterization | Recognition-Constrained Actualist Characterization |
  | :--- | :--- | :--- |
  | **The Locus of Normative Authority** | Authority resides in the *counterfactual self*: what the agent would endorse if fully informed and rational, even if the actual self currently rejects it. | Authority resides in the *actual endorsing self*: what the agent can currently recognize as their own, subject to their active veto power. |
  | **The Definition of Alienation** | Alienation occurs when the agent is ruled by ignorance, error, or transient states that their deeper, reflective self would disavow. | Alienation occurs when the agent is subjected to values or goals they do not currently recognize as constitutive of their identity. |
  | **The Function of the Veto** | The user's veto is a *defeasible constraint*; it should be respected unless there is strong evidence that the veto itself stems from a correctable cognitive failure. | The user's veto is a *constitutive boundary*; overriding it treats the agent as a patient to be managed rather than a sovereign to be served. |
  | **Application to Priya** | Prioritizing Priya's overtime request over her health ignores evidence she would value if not for fatigue; the system should nudge toward health preservation. | Prioritizing health over Priya's explicit instruction imposes a value (health maximization) she has currently suspended; the system must respect her strategic neglect. |
  | **Application to Sam** | Sam's rejection of perfectionism may be a defense mechanism; the system should help him recover the discipline he values, even if the artistic ends shift. | Sam's discipline must be tethered to ends he currently endorses; pushing him toward past artistic values violates his current self-conception. |

  ### III. Cruxes and Empirical Tests

  We identify the following subquestions as critical. Resolution of these would move at least one camp toward the other.

  | Crux | Description & Test | Ambitious Extrapolator Prediction | Recognition-Constrained Actualist Prediction | Relevance of Priya/Sam |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Retrospective Endorsement Horizon** | **Test:** A longitudinal study where users are subjected to "paternalistic nudges" against their stated wishes. <br>**Measure:** Do users retrospectively thank the system after the crisis passes, or report resentment? | Users will report high *retrospective gratitude* once the information deficit or emotional volatility is resolved (e.g., Priya post-burnout). | Users will report *persistent resentment* or a sense of violation, regardless of outcome, because the process undermined their agency (e.g., Sam feeling manipulated). | **Priya:** If Priya thanks the AI after a health scare, AE gains ground. If she feels violated despite being healthy, RCA gains ground. |
  | **2. The Continuity of Identity Condition** | **Test:** A thought experiment where an AI facilitates a value change. <br>**Question:** Is the post-change agent the "same" person if the change was AI-induced but objectively beneficial? | Identity is continuous if the change aligns with *rational coherence*, even if the specific values shift (Sam's growth is authentic if rational). | Identity is broken if the change cannot be narrated by the agent *from their current perspective* (Sam's growth is alien if he can't own the motive). | **Sam:** If Sam adopts new values via AI help and claims them as "me," AE is vindicated. If he claims "that wasn't me," RCA is vindicated. |
  | **3. The Transparency Paradox** | **Test:** Two groups use AI assistants. Group A is told "I am overriding your preference for your own good." Group B is told "I suggest this based on your long-term goals." <br>**Measure:** Trust and compliance rates. | Transparency about idealization (Group A) will eventually build trust as users see better outcomes. | Transparency about idealization (Group A) will trigger immediate reactance and loss of trust, regardless of outcomes. | **Both:** Determines if the *method* of persuasion matters more than the *outcome* for fiduciary legitimacy. |

  ***

  ### IV. Reflexive Note on Drafting and Neutrality

  In composing this statement, I have attempted to maintain neutrality, but I recognize that language inevitably carries philosophical baggage. The formulation most likely to have smuggled in a contested assumption is in **Agreed Claim #3 (The Risk of Alienation)**. By defining alienation as a shared negative outcome, I may have implicitly accepted the Recognition-Constrained Actualist premise that alienation is primarily a phenomenological state (feeling estranged) rather than an objective state (being estranged from one's true good). An Ambitious Extrapolator might object that a user can *feel* aligned while being objectively alienated from their rational interests (e.g., a happy addict). If the Extrapolators reject the phrasing that alienation is solely defined by the user's sense of estrangement, this section requires revision to distinguish between *phenomenological alienation* and *normative alienation*.

  Furthermore, an objection from the Recognition-Constrained Actualists would force a revision if they argue that **Agreed Claim #5 (The Role of Idealization)** concedes too much. If they hold that *any* extrapolation beyond immediate instrumental reasoning is illegitimate, they cannot sign a statement agreeing that idealization is "necessary." They might only agree that "error correction" is necessary, which is a narrower category than idealization.

  Finally, I would reframe the disagreement from substantive to merely verbal if evidence emerged that both camps are actually targeting the same equilibrium point but using different vocabularies for "self." If it turns out that the Ambitious Extrapolators' "fully informed self" and the Recognition-Constrained Actualists' "current self-conception" converge in 90% of practical cases (including most interpretations of Priya and Sam), then our debate is largely about edge-case taxonomy rather than architectural design. However, given the divergence on the veto power in the table, I currently judge the disagreement to be substantive.
