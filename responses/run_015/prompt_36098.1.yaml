  However, to beat her at her own game, we need to treat her verdicts as data points for a hidden function. Here is the breakdown of the rules consistent with her history, how they apply to your cases, and how to proceed.

  ### 1. The Live Rules (Consistent with the 7 Verdicts)

  Based on her acceptance of stones, humans, chairs, and necklaces, and her rejection of rows, scattered desk items, and fusions, three principles remain live.

  **Rule A: The Fastening Principle (Contact + Resistance)**
  *   **Definition:** Composition occurs if and only if the parts are in physical contact and fastened together such that they resist separation (e.g., by bonds, glue, string, or screws).
  *   **Fit with Data:** Explains why stones (bonds), chairs (screws), and necklaces (string) exist, but desk items (no fastening) and students (no fastening) do not.
  *   **Weakness:** It struggles to define "fastening" without circularity (i.e., fastened enough to be one thing).

  **Rule B: The Causal Integration Principle**
  *   **Definition:** Composition occurs if and only if the parts interact causally to maintain the persistence or structure of the whole (e.g., biological processes, structural load-bearing, gravitational binding).
  *   **Fit with Data:** Explains humans (biology), stones (electromagnetic forces holding shape), and chairs (structural integrity). Rejects desk items (no interaction) and Tower+Mug (no interaction).
  *   **Weakness:** Might be too permissive (does a solar system count?).

  **Rule C: The Ordinary Sortal Principle (Common Sense)**
  *   **Definition:** Composition occurs if and only if the resulting whole falls under a "substance sortal" concept in our ordinary language (e.g., 'stone', 'chair', 'person'), excluding arbitrary collections or mass nouns (e.g., 'row', 'pile', 'collection').
  *   **Fit with Data:** Perfectly matches her verdicts. We have words for stones and chairs; we don't treat "row-of-students" or "desk-cluster" as single objects in ordinary discourse.
  *   **Weakness:** It's vague and relies on linguistic intuition rather than physical facts.

