  ### 4. The Next Discriminating Case

  If she rules **NO** on all three (as predicted), Rule A (Fastening) and Rule B (Integration) are severely weakened. Rule C (Sortals) survives. To press her further, you need a case that satisfies **Physical Unity** but fails **Ordinary Sortals**.

  **Bring this case to the next section:**
  > **"The Welded Sculpture":** Imagine I take a distinct hammer and a distinct wrench, and I weld them together handle-to-handle into a single rigid lump of metal. The parts are fastened (Rule A says Yes) and causally integrated (Rule B says Yes). But there is no word for this object; it's not a "tool," it's a "hammer-wrench lump." **Do they compose one thing?**

  **Why this works:**
  *   **If she says YES:** She admits that **physical fastening trumps conceptual categories.** This pushes her toward a Physicalist Restrictivism (Rule A/B). You can then ask her why the Galaxy (also physically bound) doesn't count.
  *   **If she says NO:** She confirms that **our concepts determine composition** (Rule C). This makes her view vulnerable to the charge that composition is "just language," which is a major metaphysical objection you can raise in discussion.

  **Alternative Case (if you want to test Persistence):**
  > **"The Ship of Theseus Parts":** I have all the original planks of a ship in a warehouse, stacked neatly. They are the same parts that once composed the ship. **Do they compose the ship now?**
  > *   *Reasoning:* Physical parts are present (Rule A/B might say Yes), but the function/structure is gone (Rule C says No).

  **Recommendation:** Stick with **The Welded Sculpture**. It directly targets the tension between her physical verdicts (stones/chairs) and her refusal to state a principle. It forces her to admit whether "objecthood" is in the world or in our words.
