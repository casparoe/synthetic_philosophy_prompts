  ### 2. Predictions for Your Three Cases

  Here is where your cases shine. They are designed to pull these rules apart.

  | Case | Rule A: Fastening | Rule B: Causal Integration | Rule C: Ordinary Sortal |
  | :--- | :--- | :--- | :--- |
  | **1. Sand Cone** | **YES** (Grains touch/friction) | **NO** (No binding force; collapses if tipped) | **NO** ("Pile" is a mass noun, not an object) |
  | **2. Human Chain** | **YES** (Arms linked/touching) | **NO** (Voluntary grip; no structural unity) | **NO** ("Line" is an arrangement, not an object) |
  | **3. Spiral Galaxy** | **NO** (Stars do not touch) | **YES** (Gravitationally bound system) | **MAYBE** ("Galaxy" is a count noun, but not "ordinary") |

  **Where the Rules Disagree:**
  *   **Sand & Chain:** Fastening says *Yes*; Integration and Sortal say *No*.
  *   **Galaxy:** Integration says *Yes*; Fastening says *No*; Sortal is the wildcard.

