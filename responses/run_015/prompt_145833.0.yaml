  **FRAGILITY ASSURANCE UNDERWRITING HANDBOOK (FAUH)**
  **Revision 4.2: Conditional Liability & Structural Potency**

  **1.0 DEFINITION OF INSURED PROPERTY**
  1.1 For the purposes of this policy, an object is deemed "Fragile" if and only if, were it to be struck sharply against a hard surface, it would break.
  1.2 This definition holds provided that the object retains the intrinsic basis of its fragility throughout the duration of the striking event.
  1.3 The Company reserves the right to deny coverage if the object's molecular lattice rearranges itself precisely at the moment of impact to become flexible, thereby negating the disposition prior to the manifestation of the breakage. This is classified as Intrinsic Basis Withdrawal.

  **2.0 EXCLUSIONS AND INTERFERENCES**
  2.1 Coverage is void if the breakage is prevented by external packaging, padding, or protective fields, unless such packaging is explicitly listed in Schedule B.
  2.2 Crucially, coverage is also void if the protective packaging merely prevents the breakage without removing the object's inherent tendency to break. The Underwriting Committee distinguishes between an object that *would* break but *cannot* due to wrapping, and an object that *would not* break because it has become soft. The former is a masked disposition; the latter is a removed disposition.
  2.3 Conversely, no payout shall be issued for objects that are not inherently fragile but break due to external gadgets rigged to shatter them upon impact. Such "False Positive Structural Failures" are classified as Mimicry and fall under Liability, not Property.
  2.4 The burden of proof lies with the Claimant to demonstrate that the protective wrapping did not alter the intrinsic nature of the object, despite the wrapping being the sole reason the object remained intact during previous stress tests.

  **3.0 NORMAL CONDITIONS CLAUSE**
  3.1 The counterfactual condition in Clause 1.1 applies only under "Normal Conditions."
  3.2 "Normal Conditions" are defined as conditions where no interfering factors exist.
  3.3 Should an interfering factor be present, the Conditions are deemed Abnormal. However, if the absence of interfering factors is itself dependent on a further condition, that further condition must also be Normal.
  3.4 The Company acknowledges that defining "Normal" may require an infinite regress of conditional patches. In such events, adjudication defaults to Clause 7.0.
  3.5 Objects that have been permanently sealed in foam since manufacture and never could have broken are considered to possess a "Latent Disposition," which is uninsurable due to lack of testable data.

  **4.0 UNDERWRITING JURISDICTION**
  4.1 All policies are subject to review by both the Powers Division and Microstructure Compliance.
  4.2 The Powers Division asserts that fragility is a real, irreducible potency inherent to the object, regardless of its atomic composition. They require evidence of the power itself, not merely the behavior.
  4.3 Microstructure Compliance contends that fragility is nothing over and above the specific arrangement of categorical properties. They require a full inventory of the molecular lattice.
  4.4 In the event of a disagreement between Divisions regarding whether a property is real or merely structural, the policy is held in abeyance until the object breaks or ceases to exist.
  4.5 Microstructure Compliance frequently rejects claims from the Powers Division on the grounds that "potency" is not a line item on the balance sheet.

  **5.0 CLAIMS ADJUDICATION**
  5.1 A claim may only be filed upon the successful manifestation of the disposition (i.e., the object breaks).
  5.2 However, upon breaking, the object loses all market value and utility, rendering the loss total.
  5.3 Furthermore, verification of the claim requires evidence that the object *was* fragile prior to breaking. Since the object is now broken, retrospective analysis of its intrinsic basis is impossible.
  5.4 The Claims Department is therefore structurally unable to distinguish between a genuine fragility manifestation, an Intrinsic Withdrawal (Clause 1.3), or an Extrinsic Interference (Clause 2.1).
  5.5 Consequently, all claims are processed as "Metaphysically Indeterminate." Payouts are issued only when the Claims Department is too exhausted to argue otherwise.

  **6.0 PREMIUM SCHEDULE**
  *   **Standard Brittle (Glass/Ceramic):** 15% of object value per annum.
  *   **Conditional Fragility (Sugar Glass/Ice):** 40% of object value per annum.
  *   **Permanently Packaged (Factory Sealed in Foam):** Premium waived; coverage denied.
  *   **Unmanifested Disposition (Never Struck):** Actuarial rate undefined.
  *   **Surcharge for Nearby Sorcerers:** 200% flat fee.

  **7.0 CHIEF ACTUARY STATEMENT**
  "Risk is not a matter of what happens, but what would happen. Unfortunately, our ledger records only what did happen. Until we can insure the counterfactual without triggering the factual, we remain solvent only by coincidence. We are not selling protection; we are selling confidence in a conditional statement that vanishes upon verification."
  — *Dr. Aris Thorne, Chief Actuary for Metaphysical Risk*

  **8.0 FINAL PROVISIONS**
  8.1 By signing this policy, the Holder agrees that the fragility of the object exists independently of its manifestation, unless it doesn't.
  8.2 This handbook is subject to change without notice, specifically when a new counterexample is published in a peer-reviewed journal.
  8.3 In the event of a paradox, the Company reserves the right to cease operations retroactively.
