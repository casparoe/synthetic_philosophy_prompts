answer: |-
  **Research Proposal**

  **Title:** *De Se* Belief and Causal Independence: Dissolving the Fatalism in Death in Damascus

  **1. Research Question**

  Does decomposing the agent's self-locating belief in the "Death in Damascus" paradox into distinct *de dicto* and indexical components restore the causal independence assumption required by Causal Decision Theory (CDT), thereby blocking the fatalist inference without covertly adopting Evidential Decision Theory (EDT)?

  **2. Problem Statement and Motivation**

  The "Death in Damascus" paradox presents a significant challenge to Causal Decision Theory. In the standard formulation, an agent knows that Death is a perfect predictor who has already scheduled an appointment for the agent in either Damascus or Aleppo. If the agent stays in Damascus, Death will be there; if the agent flees to Aleppo, Death will have predicted this and be there instead. Standard CDT advises the agent to choose the location that causally maximizes expected utility. However, because the state of the world (Death's location) is causally independent of the agent's current decision but perfectly correlated with it, CDT appears to recommend an action that guarantees the worst outcome (death), or it renders the decision problem unstable.

  Existing literature often frames this as a problem of fatalism or Newcomb-like prediction. However, these framings obscure a specific structural issue regarding the agent's epistemic state. The paradox gains its traction from the agent's belief: "I am the one with the appointment." This is a *de se* belief (a belief about oneself as oneself). Standard decision matrices treat this as a simple proposition about the world state ($S$: Death is in Damascus/Aleppo).

  My hypothesis is that the paradox only bites if we treat this knowledge as a causally unmediated *de se* belief that directly constrains the state space. If we split this belief into a *de dicto* component (e.g., "The person Death is pursuing will be in Damascus") and an indexical component ("I am the person Death is pursuing"), we may reveal a mediating structure that CDT can navigate. The goal is not to prove metaphysical freedom from prediction, but to show that CDT does not self-destruct when the belief structure is properly formalized.

  **3. Why Standard Newcomb-Style Analogies Fail**

  A common move in decision theory is to treat Death in Damascus as a variant of Newcomb's Problem. In Newcomb's Problem, a predictor places money in boxes based on a prediction of the agent's choice. In Death in Damascus, Death's location is based on a prediction of the agent's location. While structurally similar regarding correlation vs. causation, the analogy breaks down in ways that prevent importing standard CDT solutions (such as "tickle defense" or "ratificationism") directly to this case.

  First, in Newcomb's Problem, the agent's choice determines the content of the boxes *counterfactually*, but the boxes are already filled. In Death in Damascus, the "state" (Death's location) is not merely a static container but an active pursuit mechanism tied to the agent's identity. The *de se* nature of the threat ("Death is looking for *me*") creates a self-referential loop that standard Newcomb matrices do not capture. In Newcomb, the proposition is "Box B contains $1M." In Damascus, the proposition is "I will meet Death." The latter requires an indexical anchor to have truth conditions.

  Second, Newcomb analogies usually focus on the correlation between act and state to argue for EDT or sophisticated CDT. However, they often leave the *source* of the correlation opaque. In Death in Damascus, the correlation is mediated by the agent's own reasoning process regarding their identity and location. Ignoring the *de se* structure treats the prediction as external, whereas the paradox relies on the prediction being internal to the agent's self-conception. Therefore, a solution that works for Newcomb (like causal graph pruning) may fail here because it does not account for the indexical binding of the agent to the predicted state.

  **4. Methodology and Argument Structure**

  This project will result in a 6,000-word paper. The argument will proceed in four distinct phases, designed to fit the one-semester timeline.

  **Phase 1: Formalizing the Standard Failure (Approx. 1,000 words)**
  I will begin by reconstructing the Death in Damascus scenario using a standard CDT utility matrix. I will demonstrate precisely where the calculation fails. Specifically, I will show how the standard CDT formula:
  $$V(A) = \sum_{S} P(S) \cdot U(S, A)$$
  collapses when $P(S)$ is treated as independent of $A$, yet the agent knows $S$ is a function of $A$ via prediction. I will highlight that the standard model treats the proposition "Death is in Damascus" as a world-state independent of the agent's self-locating belief. This section will establish the "fatalist inference": that CDT either recommends a futile action or cannot generate a recommendation.

  **Phase 2: Decomposing the Belief State (Approx. 2,000 words)**
  This is the core theoretical contribution. I will introduce the distinction between *de dicto* and *de se* propositions, drawing on the relevant philosophical distinctions (without getting bogged down in metaphysics).
  *   *De Dicto Component:* "The individual designated by Death's appointment book will be in Location X."
  *   *Indexical Component:* "I am the individual designated by Death's appointment book."
  I will argue that standard CDT conflates these. The *de dicto* component is a state of the world that is causally independent of my current choice (the appointment is already made). However, the *indexical* component is where the causal link to my *decision* enters. My decision determines whether I satisfy the description in the *de dicto* proposition.
  I will construct a revised decision matrix where the states are not "Death is in Damascus/Aleppo" but rather "The appointment is for Damascus/Aleppo," and the outcomes are determined by the conjunction of the appointment state and the agent's self-location. This separates the *prediction of the type* from the *token instantiation* by the agent.

  **Phase 3: Testing CDT on the Revised Model (Approx. 2,000 words)**
  I will run the CDT calculation on this revised matrix. The critical test is whether the causal independence assumption holds for the *de dicto* state.
  *   *Hypothesis:* If the state is "The appointment is for Damascus," my decision to go to Aleppo does not causally change where the appointment is. It only changes whether I meet the appointment.
  *   *Analysis:* I will examine if this allows CDT to recommend fleeing (or staying) based on the utility of the outcome (Life vs. Death) without treating the flight as *evidence* that changes the probability of the appointment's location.
  *   *The EDT Check:* I must rigorously demonstrate that this revision does not secretly rely on conditional probabilities $P(S|A)$ in the valuation step. If the revised model requires me to update the probability of the appointment location based on my intended action, I have collapsed into EDT. The argument must show that the probability of the *de dicto* state remains fixed, while the utility calculation shifts based on the indexical match.

  **Phase 4: Objections and Limitations (Approx. 1,000 words)**
  I will anticipate the strongest counterargument: that splitting the belief is merely a semantic trick that doesn't change the causal graph. If Death predicts my *decision*, then the appointment location is causally dependent on my decision process, regardless of how I describe my belief. I will respond by arguing that CDT is a theory of *deliberation*, and the structure of deliberation is inherently *de se*. If the theory cannot accommodate the indexical nature of the deliberator, it is the theory that is deficient, not the analysis. I will also acknowledge if the solution only works for "imperfect" predictors, defining the scope of the success.

  **5. Success and Failure Conditions**

  **Success:**
  A successful outcome looks like a formal reconstruction of the Death in Damascus decision problem where:
  1.  CDT yields a stable, non-paradoxical recommendation (e.g., "It is rationally permissible to flee," or "The problem is underdetermined but not fatalistic").
  2.  The calculation explicitly uses unconditional probabilities for the world states ($P(S)$), maintaining the core tenet of CDT.
  3.  The fatalist conclusion ("You die regardless, so deliberation is pointless") is blocked not by metaphysical assertion, but by the decision-theoretic formalism.
  4.  The distinction between *de dicto* and *de se* does the heavy lifting, rather than an ad-hoc adjustment to the utility function.

  **Failure:**
  The project fails if:
  1.  The revised model requires conditioning the state probability on the action ($P(S|A)$), which would mean the solution is just EDT in disguise.
  2.  The decomposition of the belief leads to an infinite regress (e.g., needing a *de se* belief about the *de se* belief).
  3.  The argument concludes that CDT simply cannot handle this case, requiring a switch to Ratificationism or EDT. While a negative result is philosophically valuable, for the purposes of this specific proposal, failing to vindicate CDT via the *de se* route counts as a failure of the hypothesis.
  4.  The scope expands into general metaphysics of time or prediction, preventing a completed draft within the word limit.

  **6. Scope Check and Feasibility**

  **Word Count:** 6,000 words is tight for a decision theory paper. To remain feasible:
  *   I will not provide a comprehensive history of the Death in Damascus paradox. I will cite the standard Gibbard/Harper or Lewis formulations only as necessary to set up the matrix.
  *   I will not engage with the broader literature on *de se* belief (e.g., Perry, Lewis, Chisholm) beyond what is strictly necessary to define the terms for the decision matrix. The focus is decision theory, not philosophy of language.
  *   I will avoid formalizing a full logic of indexicals. The *de se/de dicto* split will be handled via propositional attitudes within the probability assignments, not modal logic.

  **Timeline:**
  *   **Weeks 1-3:** Literature review and formalization of the standard CDT failure case. Drafting Phase 1.
  *   **Weeks 4-7:** Developing the *de se/de dicto* model and constructing the revised matrix. Drafting Phase 2 and 3.
  *   **Weeks 8-10:** Stress-testing the model against objections (EDT collapse, causal graph critiques). Drafting Phase 4.
  *   **Weeks 11-12:** Revision, polishing, and ensuring the argument flows logically without digressions.

  **Risk Management:**
  The primary risk is that the *de se* distinction turns out to be irrelevant to the causal structure. If, by Week 6, the revised matrix still yields the fatalist result, I will pivot the paper to argue *why* CDT is incompatible with indexical knowledge in prediction scenarios. This preserves the research value even if the initial hypothesis is falsified. However, the primary aim remains vindicating CDT through belief decomposition.

  **7. Conclusion**

  This proposal outlines a targeted investigation into the epistemic preconditions of Causal Decision Theory. By isolating the indexical component of the agent's belief in the Death in Damascus paradox, I aim to show that the fatalist inference is an artifact of poor formalization rather than a genuine limit of causal reasoning. If successful, this offers a way to preserve CDT's intuitive appeal in prediction scenarios without conceding to evidentialism.
