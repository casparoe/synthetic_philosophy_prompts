      *   **Move 6 (Ben): Non-Competing Relations & Expressivism.**
          *   *Claim:* Mental-mental causation doesn't compete with physical. Mislabeling is conceptual error. Expressivism: Utterances are avowals, not descriptions.
          *   *Assessment:* The "non-competing" claim is weak (supervenience usually implies competition). Expressivism is a known escape hatch (Wittgensteinian), but it changes the subject.
