      *   **Move 3 (Ana): Reference & The Zombie Alternative.**
          *   *Claim:* Reliabilism fails because there *is* a rival explanation (the zombie). Reference problem: How does 'pain' refer to the qualia if no causal link exists? Acquaintance looks causal.
          *   *Assessment:* Very strong. The reference problem is the harder nut to crack than the justification problem. Causal theories of reference (Kripke/Putnam) are dominant. If epiphenomenalism blocks causal links, reference is threatened.
          *   *Rating:* Clearly Right (this is the strongest point against standard epiphenomenalism).

      *   **Move 4 (Ben): Non-Causal Acquaintance/Intentionality.**
