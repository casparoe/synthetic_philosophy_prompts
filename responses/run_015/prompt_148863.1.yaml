      *   *Does it save Epiphenomenalism?* Actually, PCS is usually used by *physicalists* to explain away the intuition of dualism. If an epiphenomenalist uses it, they still have the problem of why the physical vehicle of the concept is triggered. But if the experience *constitutes* the concept, the experience is part of the physical realization (if one is a physicalist) or it remains distinct (if dualist). If distinct, the causal exclusion problem remains for the *utterance*.
      *   *Verdict:* It's a real way out *for the knowledge/reference problem*, but it pushes the epiphenomenalist closer to physicalism or requires a specific account of how a non-physical constituent fits into a physical concept. It's better than Ben's move because it's more mechanistic.

  5.  **Drafting the Response:**
