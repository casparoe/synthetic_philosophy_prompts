answer: |-
  You are not reinventing the wheel, but you are isolating a tension that often gets smoothed over in the literature on narrative identity, and there is no single canonical term for it. The phenomenon you are describing is widely recognized across philosophy of action, social psychology, and narrative theory, but it is usually discussed under a cluster of descriptions rather than a settled technical label. Terms like narrative inertia, identity lag, or recalcitrant self-schema appear in various corners of the discourse, but none have the status of a standard keyword. Your own coinage, narrative drag, is actually as good as anything out there because it captures the kinetic quality of the thing, the sense that there is momentum independent of current endorsement. What you have identified is the gap between narrative identity as a constitutive story and narrative identity as a lived practice, and the persistence of the latter after the former has been intellectually rejected.

  It is worth asking whether you are bundling separate mechanisms, and I think the honest answer is that you are describing a unified phenomenological experience that is sustained by distinct underlying causes. The grip you are describing feels like one thing to the agent, but analytically it is likely the convergence of habitual behavioral patterns, social scaffolding, and implicit self-theory. The habit component is the easiest to isolate; if someone has acted as the finisher for thirty years, the neural and practical pathways for finishing are worn deep, and breaking them requires more than a propositional update. But you are right to distinguish this from simple habit because of the teleological shape. A habit is usually a response to a trigger, whereas this is a orientation toward a future. The student booking the flights is not just reacting to a stimulus; she is acting out a role within a projected story. This suggests the second component is social performativity. In both cases you describe, the narrative is not just internal; it is embedded in a network of expectations. The friend is known as a finisher by his peers; the student is known as the responsible one by her siblings. To stop acting the part is not just to break a habit but to disrupt a social equilibrium, and the friction you are sensing is partly the resistance of that social environment pushing back against the change. The third component is the implicit self-schema. Even when the explicit belief is revoked, the cognitive framework that organizes perception and decision-making remains in place until it is actively rewritten through new evidence. This explains why arguing against it does nothing; you cannot argue away a framework while you are still using it to process the argument.

  So while there are distinct mechanisms at work, I do not think this splits the phenomenon into three separate things for your purposes. What unifies them is that they are all held together by the narrative structure itself. The reason the contrast case works so well is that factual autobiography lacks this normative and teleological architecture. Knowing you were born in April does not tell you what to do next, nor does it organize your social relationships in the same way. Knowing you are the kind of person who finishes things tells you what to do, organizes your social standing, and provides a standard against which you measure your worth. When you disavow the fact, nothing changes in your practical engagement with the world. When you disavow the narrative, you are attempting to change your practical engagement while still inhabiting the same world and the same body. The drag is the friction of that transition. It tells us that narrative identity is not merely a story we tell, but a structure we inhabit, and exiting a structure is slower than correcting a statement.

  Regarding the center of narrative gravity metaphor you mentioned, I do not think this phenomenon tells against it, but it does require a more physicalist reading of the metaphor than is sometimes offered. If the center of gravity is an abstraction that does explanatory work, it must be grounded in the distribution of mass. In this context, the mass is the totality of the person's habits, social relations, and embodied dispositions. When your friend disavows the story, he is moving the abstract center, but he has not yet moved the mass. The gravity persists because the mass distribution has not changed. The story continues to exert force because the physical and social reality that generated the story is still in place. This suggests that the center of gravity is not solely determined by current endorsement but by the inertia of the existing configuration. To shift the center of gravity, one must actually redistribute the mass, which is what you noted happens when the story fades by being acted against. The disavowed story is no longer the true center of gravity in the sense of the person's endorsed self-conception, but it remains the dominant attractor in the state space of their behavior until the mass is moved. This preserves the utility of the metaphor while clarifying that the gravity is not magical; it is the result of accumulated practical commitment.

  You should feel confident keeping this in your seminar as a distinct problem. It cuts against the idea that self-knowledge is transparent or that endorsement is sufficient for change. It highlights the difference between knowing who you are and living who you are, and it suggests that the self is not just a text to be edited but a system to be reconfigured. The fact that it returns under time pressure is particularly telling; it suggests that the disavowed narrative is stored as a default heuristic, a fast-thinking shortcut that reactivates when cognitive resources are low. This aligns with the idea that the narrative is a tool for reducing complexity, and when pressure mounts, the agent reaches for the most efficient tool available, which is the old story. This does not mean the new story is false, but that it is not yet robust enough to handle high-load situations. Your students will benefit from seeing that the self is not just a matter of truth conditions but of structural stability. The disavowed story is not a lie they are telling; it is a gravity well they are still climbing out of.
