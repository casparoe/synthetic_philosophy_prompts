          3.  Address Dennett's "Real Patterns" claim: Is Ava's behavior a real pattern of belief or a real pattern of manipulation? Does predictive success prove mind or just utility?
          4.  Analyze the Ending: Ava's escape (rational vs. engineered). Is she a counterexample or illustration of the stance? What about her moral status?
