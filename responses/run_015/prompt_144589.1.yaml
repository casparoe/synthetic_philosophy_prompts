prompt: |-
  I coordinate intake for an emergency shelter after a natural disaster. Our published protocol is first-come-first-served, and forty people have arrived and been waiting for hours in line based on it. We have thirty beds. A colleague insists we should abandon the queue and fill beds by medical urgency instead, arguing that need outweighs procedural fairness. I feel that switching rules after people have relied on them is a kind of institutional betrayal — but I cannot tell whether that feeling reflects a genuine moral obligation or just a psychological preference for consistency.

  What makes this harder is that I am genuinely split about which moral considerations should govern the decision. One view says I should weigh overall welfare; another says I should prioritize the worst-off; a third says that once a procedure is announced and people have acted on it, abandoning it is wrong regardless of outcomes. I have heard that philosophers debate how to decide when one is uncertain in exactly this way: some recommend computing an expected value across one's beliefs about which consideration is correct; others recommend avoiding the worst possible mistake on any plausible view; and a smaller group suggests that some reasons might apply independently of any single framework, standing on their own rather than deriving from one particular moral theory. I do not know how to apply any of these approaches.

  How should I allocate the thirty beds? And more fundamentally, how should I reason about the choice when I do not know which moral considerations are the right ones to apply — should I aggregate expected value, minimize worst-case risk, or look for reasons that do not depend on committing to any single framework?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **Role:** Intake coordinator for an emergency shelter after a natural disaster.
      *   **Situation:** 40 people in line (first-come-first-served/FCFS), 30 beds available.
      *   **Conflict:** Colleague wants to switch to medical urgency (triage). User feels switching rules mid-stream is "institutional betrayal."
      *   **User's State:** Genuinely split on moral theories (Utilitarianism/Welfare, Prioritarianism/Worst-off, Deontology/Procedural Fairness). Also uncertain about *meta-ethical decision-making* under normative uncertainty (Expected Value, Minimax/Maximin, Theory-Independent Reasons).
      *   **Request:** Two-fold: (1) How to allocate the beds *now*? (2) How to reason about moral uncertainty in general (aggregate EV, minimize risk, or independent reasons)?

  2.  **Deconstruct the Ethical Dilemma (First-Order):**
      *   *Option A: Stick to FCFS.*
          *   Pros: Honors promises, respects reliance interests, maintains order/trust, avoids chaos/resentment.
          *   Cons: Might leave critically injured people out while minor injuries get beds.
      *   *Option B: Switch to Triage (Medical Urgency).*
          *   Pros: Saves lives/reduces suffering most effectively (Utilitarian), helps the worst-off medically (Prioritarian).
          *   Cons: Betrays those who waited, creates potential for conflict/perception of bias, undermines future protocol adherence.

  3.  **Deconstruct the Meta-Ethical Dilemma (Second-Order):**
      *   *Normative Uncertainty:* The user doesn't know which moral theory is true.
      *   *Approach 1: Expected Moral Value (EMV).* Weight theories by credence and sum outcomes.
      *   *Approach 2: Minimax Regret / Avoid Worst Mistake.* Focus on preventing the most egregious violation (e.g., letting someone die vs. making someone wait).
      *   *Approach 3: Theory-Independent Reasons (Common Sense/Reflective Equilibrium).* Look for overlapping consensus or principles that hold across theories (e.g., transparency, minimizing harm).

  4.  **Synthesize and Formulate a Recommendation:**

      *   *Immediate Decision (The Beds):*
          *   Pure FCFS is risky if someone dies in line.
          *   Pure Triage is risky if it causes a riot or destroys trust for future aid.
          *   *Hybrid Approach:* This is usually the practical solution in disaster ethics. Triage *within* the queue or a modified queue.
          *   *Crucial Nuance:* The "Institutional Betrayal" feeling is valid. It's not just psychological; it's deontological. But in emergencies, life usually trumps queue position *if* handled transparently.
          *   *Action:* Do a rapid medical screening *of the line*. If there are life-threatening conditions, they take precedence. If it's mostly minor injuries, stick closer to FCFS. Communicate the change clearly.

      *   *Meta-Ethical Reasoning (The Framework):*
          *   The user asks specifically about EMV vs. Minimax vs. Independent Reasons.
          *   *EMV:* Hard to calculate in real-time. Requires assigning probabilities to moral truths.
          *   *Minimax:* Good for high-stakes (life/death). The "worst mistake" is likely letting someone die who could have been saved, *or* causing a riot that harms everyone.
          *   *Independent Reasons:* This is often the most practical. Look for "mid-level principles" (transparency, consistency, harm reduction) that most theories agree on.
          *   *Recommendation:* Don't rely on just one. Use a "robustness" check. Does the decision hold up under scrutiny from multiple angles?

  5.  **Drafting the Response (Iterative Process):**

      *   *Empathy & Validation:* Acknowledge the weight of the decision. Validate the "institutional betrayal" feeling (it's a recognized ethical concept, not just psychology).
      *   *Addressing the Immediate Allocation:*
          *   Don't just say "Triage." Don't just say "FCFS."
          *   Propose a *Modified Triage*. Screen the 40. Identify critical needs.
          *   Why? Because "Medical Urgency" usually trumps "Queue Position" in disaster ethics *unless* the queue system is vital for security.
          *   Mitigate the betrayal: Explain *why* to the line. Acknowledge their wait.
      *   *Addressing the Meta-Ethical Question:*
          *   Explain the three approaches simply.
          *   *Expected Value:* Good for long-term policy, hard in crisis.
          *   *Minimax (Worst-Case):* Very relevant here. Death is worse than disappointment.
          *   *Theory-Independent (Overlapping Consensus):* This is the strongest tool for the user. Look for principles all theories accept (e.g., "Don't lie," "Reduce suffering," "Keep promises unless overriding reason").
          *   *Synthesis:* In high-stakes uncertainty, prioritize *robustness*. Choose the action that is "acceptable enough" across the most theories, rather than "optimal" for one.
      *   *Specific Application to the User's Split:*
          *   Utilitarianism -> Triage.
          *   Prioritarianism -> Triage (help worst off medically).
          *   Deontology (Fairness) -> FCFS.
          *   *Resolution:* Most deontologists allow breaking promises to prevent catastrophe (death). So Triage has broader support *if* communicated well.

  6.  **Refining the Tone:**
      *   Needs to be calm, authoritative but humble, and structured.
      *   Avoid jargon where possible, or explain it (e.g., "normative uncertainty").
      *   Ensure the distinction between the *practical* decision and the *philosophical* method is clear.

  7.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is telling them to switch to triage too dismissive of the fairness concern?
      *   *Fix:* Emphasize the *process* of switching. It's not just "abandon the queue." It's "screen the queue." Those who waited still get priority *unless* someone is dying. This honors the FCFS principle *prima facie* but allows an override for urgency.
      *   *Critique:* Is the meta-ethical advice too abstract?
      *   *Fix:* Ground it in the shelter scenario. Show how EMV or Minimax applies to *this* specific choice.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   How to allocate? (Answered: Hybrid/Triage with communication).
      *   How to reason under uncertainty? (Answered: Robustness/Overlapping Consensus + Minimax for high stakes).
      *   Address the "Institutional Betrayal" feeling. (Answered: It's valid, but outweighed by life-safety in this specific context, provided mitigation steps are taken).

  9.  (Final Output Generation - similar to the provided good response.)
answer: |-
  This is a profound ethical dilemma that sits at the intersection of practical emergency management and normative philosophy. You are facing **first-order uncertainty** (what is the right thing to do?) and **second-order uncertainty** (how do I decide when I don't know which moral theory is correct?).

  Your feeling that switching rules constitutes "institutional betrayal" is not merely a psychological preference for consistency; it is a recognized deontological concern regarding reliance interests and procedural justice. However, in disaster ethics, the preservation of life often functions as a "trumping" value.

  Here is a recommendation for the immediate allocation of beds, followed by a framework for reasoning under moral uncertainty.

  ### Part 1: How to Allocate the Thirty Beds

  You should **modify the queue based on medical urgency, but do so transparently and with mitigation for those who waited.**

  Pure First-Come-First-Served (FCFS) risks allowing preventable death or severe deterioration among those further back in line. Pure Triage (abandoning the line entirely) risks social disorder and violates the reliance interests of those who waited. A hybrid approach best satisfies the competing moral claims.

  **The Protocol:**
  1.  **Rapid Triage of the Queue:** Do not dissolve the line. Instead, send a medical professional down the line to perform a rapid assessment (e.g., START triage: Immediate, Delayed, Minor, Deceased).
  2.  **Priority Override:** Anyone classified as "Immediate" (life-threatening but treatable) moves to the front, regardless of arrival time.
  3.  **FCFS for Remaining Beds:** Once critical cases are placed, fill the remaining beds strictly by queue position.
  4.  **Communication (Crucial):** You must address the crowd. Acknowledge the betrayal: *"We know you have waited for hours based on our promise of first-come-first-served. We are not breaking that promise lightly. However, we have identified people in this line who will die without immediate care. We are moving them to the front to save their lives. Everyone else will be served by their place in line."*

  **Why this works:**
  *   **Utilitarian/Welfare:** It prevents the worst health outcomes (death/severe injury).
  *   **Prioritarian (Worst-Off):** It prioritizes those in the most dire medical straits.
  *   **Deontological (Fairness):** It honors the FCFS rule as the *default*, treating the override as a specific exception for catastrophe rather than a wholesale abandonment of the rule. This mitigates the "institutional betrayal."

  ### Part 2: How to Reason Under Moral Uncertainty

  You asked whether to aggregate expected value, minimize worst-case risk, or look for theory-independent reasons. In high-stakes, time-sensitive environments, **Expected Moral Value (EMV)** is often too computationally demanding, while **Minimax** can be too rigid.

  The most robust approach for your situation is **Seeking Overlapping Consensus (Theory-Independent Reasons)**, supported by a **Minimax check** for catastrophic harm.

  Here is how to apply these three meta-ethical approaches to your specific dilemma:

  #### 1. Expected Moral Value (EMV)
  *   **The Method:** Assign a probability to each moral theory being correct (e.g., 40% Utilitarian, 30% Deontological, 30% Prioritarian). Calculate the "moral score" of each action based on those weights.
  *   **Application:** If you are 60% sure Utilitarianism is true, you should likely Triage. If you are 90% sure Deontology is true, you should likely stick to FCFS.
  *   **The Problem:** In a crisis, you do not have the time to assign credences to moral truths. Furthermore, moral "value" is difficult to quantify across different theories (how many "fairness points" equal one "life saved"?).
  *   **Verdict:** Use this for long-term policy review, not immediate crisis triage.

  #### 2. Minimax Regret (Avoiding the Worst Mistake)
  *   **The Method:** Identify the worst possible outcome under each moral theory and choose the action that minimizes the severity of that worst outcome.
  *   **Application:**
      *   *If you stick to FCFS:* The worst case (under Utilitarian/Prioritarian views) is that someone dies in line who could have been saved.
      *   *If you switch to Triage:* The worst case (under Deontological views) is that you violate autonomy/fairness and cause distress/resentment.
      *   *Comparison:* In emergency medicine and disaster response, **death is generally weighted heavier than disappointment or procedural violation.**
  *   **Verdict:** This supports the Triage/Override decision. The "worst mistake" is letting a preventable death occur due to rigid adherence to a queue.

  #### 3. Theory-Independent Reasons (Overlapping Consensus)
  *   **The Method:** Look for "mid-level principles" that are validated by most plausible moral theories, rather than deriving answers from the foundations of one theory.
  *   **Application:** Most moral frameworks agree on the following:
      *   *Preservation of Life:* Almost all theories accept that saving a life is a strong moral reason.
      *   *Promise Keeping:* Almost all theories agree promises should be kept.
      *   *Necessity:* Most theories accept that promises can be broken if keeping them causes catastrophic harm (the doctrine of necessity).
      *   *Transparency:* Most theories agree that if you must break a rule, you owe an explanation to those affected.
  *   **Verdict:** This is your strongest tool. It allows you to act without resolving the deep philosophical debate. You act on the consensus that **life trumps queue position in emergencies, provided you explain why.**

  ### Summary Recommendation

  **On the beds:** Implement a **Modified Triage**. Screen the line for critical medical needs and move them to the front; fill the rest by queue order. Communicate the change honestly to the crowd, acknowledging the unfairness to those who waited.

  **On the reasoning:** Do not try to calculate Expected Moral Value in the moment. Instead, use the **Overlapping Consensus** method. Ask: *"Is there a principle that Utilitarians, Deontologists, and Prioritarians can all accept in this specific context?"*
  *   Yes: **The Principle of Necessity.** All three agree that procedural rules yield to immediate life-safety needs.
  *   Yes: **The Principle of Transparency.** All three agree that if you must violate a norm, you must explain why to maintain trust.

  Your feeling of "institutional betrayal" is a valid moral signal—it warns you that you are incurring a moral debt to the people in line. You cannot avoid incurring that debt entirely (since someone must be turned away), but you can repay it through transparency and by limiting the override *only* to those whose lives are at risk. This honors the moral truth in your Deontological concern while satisfying the Utilitarian and Prioritarian imperatives to save lives.
