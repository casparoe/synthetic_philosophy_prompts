answer: |-
  This is a fascinating bureaucratic puzzle. You've built a board that oscillates between the **ethics of memory** (Margalit: we have duties to the dead and to truth) and the **therapeutics of forgetting** (Rieff: we need to shed the past to live), but they seem to apply these philosophies based on *power dynamics* and *materiality* rather than abstract consistency.

  Here is the breakdown of their hidden logic, the verdict, and the stress test.

  ### 1. The Verdict
  **Decision:** **Allow only if physical markers remain.** (The virtual memorial is permitted as an *addition*, but forbidden as a *substitute*.)

  **Why?**
  The board consistently rejects "clean" erasures of difficult history when the subjects are powerless.
  *   **Case 1 (Plaques)** and **Case 6 (Genocide Unit)** establish that when the subjects are victims of systemic violence/state failure, the public has a duty to remember, regardless of local comfort.
  *   **Case 4 (Monument)** establishes that you cannot destroy material evidence of history (even oppressive history) without a trace.
  *   **The AI Problem:** The board would likely view AI-reconstructed voices as a violation of **Case 3 (Journals)** and **Case 2 (News)**. In Case 3, the dead's private voice was protected by destruction. In Case 2, the public record couldn't be altered. Synthesizing a dead migrant worker's voice is effectively *falsifying the record* (violating Case 2) and *violating the intimacy of the dead* (violating Case 3) without their consent.

  The board tolerates forgetting only when the *subject* or their *heirs* demand it (Case 3, Case 5). Here, the subjects are dead and heirless. The developer is not an heir; they are a disruptor. Therefore, the "Right to Forget" cannot be exercised by the living on behalf of the powerless dead.

  ### 2. The Closest Analog
  **Case 4: The Colonial Monument.**

  *   **Similarity:** Both involve removing a physical trace of a problematic past (colonialism vs. exploitative labor) to make way for the new.
  *   **The Nuance:** In Case 4, the board said "No" to melting the monument *without a record*. This implies a record *might* be okay. However, look at **Case 1 (Plaques)**. The board mandated *physical* plaques in *towns*. They didn't accept a website or a brochure.
  *   **The Synthesis:** The board distinguishes between **Archive** (digital/record) and **Witness** (physical/present). A virtual memorial is an Archive. A graveyard is a Witness. You can move the Archive, but you cannot remove the Witness without leaving a physical scar (markers).

  ### 3. The Hidden Principle: "The Burden of Friction"
  If you look closely, the board's rulings consistently favor **inconvenient memory** over **convenient forgetting**.

  *   **Plaques:** Locals have to look at them (Inconvenient).
  *   **Ex-Convict:** He has to live with the search results (Inconvenient).
  *   **Genocide Unit:** Kids have to learn heavy stuff (Inconvenient).
  *   **Journals/Survivors:** These are the exceptions where forgetting is allowed, but notice: in both cases, the forgetting protects **intimacy** (private journals) or **trauma** (living survivors).

  **The Principle:** *Memory must retain physical friction to be ethical. Digital memory is too smooth; it allows the powerful to sanitize the past without feeling its weight.*

  The AI memorial is the ultimate "smooth" memory. It makes the dead palatable. It turns suffering into content. The board, in its weird bureaucracy, seems to intuit that **suffering must remain heavy to be remembered truthfully.** Paving over the ground removes the friction. Physical markers keep the friction.

  ### 4. The Conflict: Which Rule Wins?
  You identified three competing rules in their history:
  1.  **Protect the Powerless Dead** (Case 1, 4, 6).
  2.  **Material Presence > Digital Substitute** (Case 1, 4).
  3.  **Agency of the Living/Heirs** (Case 3, 5).

  **The Winner:** **Material Presence.**
  Why? Because Agency (Rule 3) is absent here (no heirs). Protecting the Powerless (Rule 1) is the *goal*, but Material Presence (Rule 2) is the *method*. The board seems to believe you cannot protect the powerless dead without physical evidence. Digital evidence is too easily altered (like the news articles in Case 2).

  ### 5. The Tie-Breaker Hypothetical
  To truly test if "Material Presence" is their core god, or if it's actually "Protection of the Powerless," you need a case where **keeping the physical object harms the living descendants.**

  **The Hypothetical Case:**
  > A living descendant of the migrant workers (a recognized heir) petitions the board. She argues that the physical graveyard is a site of intergenerational trauma for her family. She demands the bodies be exhumed, cremated, and scattered at sea (total physical erasure of the site), with only a digital archive remaining. She cites **Case 3 (Journals)** and **Case 5 (Survivors)** as precedent for her right to heal.

  **Why this breaks them:**
  *   **If they say YES (Allow Erasure):** Then their true principle is **Agency of the Living**. The "Material Presence" rule was only for when no one claimed the bodies. This aligns with Margalit's view that memory is about *relationships*, not just objects.
  *   **If they say NO (Keep the Ground):** Then their true principle is **Material Witness**. They value the "truth of the ground" over the "healing of the heir." This suggests the board is actually more totalitarian than therapeutic—they believe history belongs to the state/public, not the family.

  **My bet for your novel:**
  If you want the board to feel **weird and bureaucratic**, they should say **NO**.
  They should rule that *trauma is a public resource*. The heir's desire to heal is secondary to the state's need to keep the wound visible. This creates a chilling, compelling tension: the board protects the dead, but it *owns* them. It prevents the developer from erasing them, but it also prevents the family from burying them.

  This fits the Margalit/Rieff mashup: It treats memory as a civic duty (Margalit) that overrides the therapeutic need to move on (Rieff), enforced by a bureaucracy that values the *archive* over the *human*.
