      *   **T1 vs. T3 (Vague Present):**
          *   T1 says no privileged foliation. T3 tries to save a "present" by making it vague.
          *   *Conflict:* If there's no simultaneity (T1), there's no hyperplane to be vague *about*. Vague present usually requires a privileged frame to be vague *within*. If T1 denies the frame, T3 has no anchor.
          *   *Severity:* Medium-High. It looks like a patch that doesn't fit the hole.

      *   **T4 vs. T5 (Asymmetry vs. Passage):**
          *   T4 grounds asymmetry in thermodynamics (B-Theory compatible).
          *   T5 grounds passage in ontology (A-Theory).
          *   *Conflict:* Can you have thermodynamic asymmetry *without* passage? Yes (B-Theory does this). Can you have passage *without* thermodynamic asymmetry? Maybe. But T4 says asymmetry *isn't* indexical, T5 says passage *is* real.
          *   *Compatibility:* Actually, these might be compatible. T4 explains the *arrow*, T5 explains the *flow*. But T4 is often used to *replace* T5.
          *   *Severity:* Low-Medium. They can work together, but T4 often undermines the *need* for T5.

      *   **T5 vs. T6 (Passage vs. Fixed Future):**
          *   T5 says future *becomes* present (implies openness?).
