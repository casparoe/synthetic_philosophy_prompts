prompt: |-
  I've been going to a Buddhist centre for about six years and I help run a small study group there, and because I'm the one who's read a bit of philosophy I end up being the person people come to with hard decisions — someone whose father is dying and who wants to know whether to tell him the truth, someone being pushed at work to shade the numbers on a report, that kind of thing. So I finally sat down to write out where I actually stand, and my partner (who did a bit of philosophy at uni years ago) said my list doesn't hang together but couldn't tell me where. I don't have the books here and I can't look anything up, so please work from the ideas themselves rather than from who said what — and please don't just tell me which named position I should adopt, I want to know which of my own claims is doing the damage. Here's the set:

  (a) I think Buddhist ethics is basically consequentialist. The bad thing is dukkha, the whole path is about ending suffering, and I read the five precepts as instruments for that rather than as commands with authority of their own.
  (b) I think karma is a matter of intention: what fixes the moral quality of an act is the motive behind it — greed, aversion and confusion versus their opposites — not how things turn out. So a rescue that goes badly is still fine karmically and a smooth act done for a rotten reason isn't. I also don't find convincing the move that intention only matters because of its downstream effects on your character; I want to say the intention is where the karma is, right there at the time.
  (c) In practice I think you don't weigh the precepts case by case, you just keep them.
  (d) I think the Mahayana stories where a bodhisattva breaks a precept out of compassion — lying to save someone's life, or the one about the ship's captain who kills a man who is about to murder everyone aboard and takes the consequences on himself — are evidence that consequences override the precepts, so they support (a).
  (e) I think no-self is what rules out a rights-style or dignity-style reading: if there aren't ultimately separate persons, there's nothing to be inviolable, so any constraint has to be justified by what it does downstream. That isn't decoration, it's part of my reason for (a).
  (f) But I also don't think it's just utilitarianism in foreign dress: the point is the transformation of the agent — uprooting greed, aversion and confusion, growing compassion — not a ledger of how much suffering got prevented.

  When (a) and (b) come apart in a case, like the woman who tells her dying father a softened version of the diagnosis partly out of love and partly because she can't face the conversations that would follow, my way of coping is to say two things at once: it was the right thing to do because of the suffering it prevented, and its karmic quality is mixed becuase the motive was mixed.

  So: which of these are genuinely in tension and which only look like it? Rank whatever you find by severity, for each one say exactly what would have to give and what giving it up would cost me, and tell me whether my two-level way with the dying-father case actually repairs (a) and (b) or is just papering over them. And if there's one revision that cleans up the most, name it — I'd much rather drop a single claim than rebuild the whole view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-term Buddhist practitioner (6 years), runs a study group, seen as an ethical advisor by peers. Has read some philosophy (self-taught/practical). Partner (ex-philosophy student) says their ethical framework is inconsistent.
      *   **Constraint:** No books, no looking things up. Work from ideas themselves, not named positions or authors. Don't just prescribe a named theory (e.g., "Become a Rule Utilitarian"). Identify *which specific claim* is causing the tension.
      *   **Task:**
          1.  Identify genuine tensions vs. apparent ones among claims (a) through (f).
          2.  Rank tensions by severity.
          3.  For each tension, explain what must give and the cost of giving it up.
          4.  Evaluate the "two-level" coping mechanism (dying father case).
          5.  Identify the *one revision* that cleans up the most.

  2.  **Analyze the Claims:**
      *   (a) **Consequentialist Foundation:** Buddhist ethics = consequentialist. Goal = end *dukkha*. Precepts = instruments/rules of thumb, not intrinsic commands.
      *   (b) **Intentional Karma:** Moral quality = intention (motivation), *not* outcome. Bad outcome + good intention = fine karma. Good outcome + bad intention = bad karma. Intention matters intrinsically, not just for character building.
      *   (c) **Rule Adherence:** In practice, don't weigh case-by-case; just keep precepts. (Rule-following).
      *   (d) **Mahayana Exceptions:** Bodhisattva breaking precepts for compassion proves consequences override precepts. Supports (a).
      *   (e) **No-Self Justification:** No-self rules out rights/dignity. No separate persons = nothing inviolable. Constraints justified by downstream effects. Supports (a).
      *   (f) **Agent Transformation:** Not just utilitarianism. Point = transformation of agent (uprooting defilements), not just suffering ledger.

      *   **Coping Mechanism:** In conflict cases (e.g., dying father), action is right due to consequences (a), but karma is mixed due to motive (b).

  3.  **Identify Tensions:**

      *   **Tension 1: (a) vs. (b) - The Core Conflict.**
          *   (a) says the *basis* of ethics is consequences (ending *dukkha*). Rightness is determined by outcomes.
          *   (b) says the *basis* of moral quality (karma) is intention. Rightness is determined by motive, explicitly *not* outcomes ("not how things turn out").
          *   *Conflict:* If an act is "right" because it prevents suffering (a), but "karmically mixed/bad" because the motive wasn't pure (b), what is the actual guide for action? Is the "right thing" the one that produces good results or the one with pure intent?
          *   *Severity:* High. This is the definition of moral worth.

      *   **Tension 2: (a) vs. (f) - The Goal Conflict.**
          *   (a) says the goal is ending *dukkha* (usually implies suffering of beings).
          *   (f) says the goal is transformation of the *agent* (uprooting greed/aversion).
          *   *Conflict:* Utilitarianism maximizes global welfare. Buddhist soteriology maximizes individual liberation/nirvana (though Mahayana blends this). If I maximize global welfare (a), I might compromise my own mental purity (f). If I protect my mental purity (f), I might allow suffering to persist (a).
          *   *Severity:* Medium-High. It's the "Worldly vs. Transcendent" tension.

      *   **Tension 3: (a)/(d) vs. (c) - The Decision Procedure Conflict.**
          *   (a) & (d) imply a consequentialist calculus (break rules if consequences demand).
          *   (c) says "don't weigh case by case, just keep them."
          *   *Conflict:* This is Act Consequentialism vs. Rule Consequentialism (or Deontology). If (a) is true, (c) is only a heuristic. But if (c) is absolute, (a) is limited. The user says (c) is "in practice," which mitigates this, but (d) explicitly cites cases where you *do* break them.
          *   *Severity:* Medium. This is often resolvable via "Rule of Thumb" vs. "Deep Structure."

      *   **Tension 4: (e) vs. (b) - The Metaphysical Conflict.**
          *   (e) says no-self means no inviolable rights, justifying consequentialism.
          *   (b) says intention is intrinsically morally weighty.
          *   *Conflict:* If there is no self, whose intention matters? If the agent is illusory, why is the *agent's* mental state (b) more important than the *illusion's* suffering (a)? Actually, (e) supports (a) well. The tension is more between (e) and the *importance* placed on the agent in (b) and (f). If no-self, why care about *my* karmic purity (b/f) more than the *other's* suffering (a)?
          *   *Severity:* Low-Medium. More metaphysical nuance.

  4.  **Evaluate the Coping Mechanism (Dying Father Case):**
      *   User says: Action = Right (consequences), Karma = Mixed (motive).
      *   *Analysis:* This splits "Right Action" from "Good Karma." It creates a dichotomy between *what I should do* and *what makes me spiritually pure*.
      *   *Verdict:* It papers over the crack. It creates a fragmented moral life where doing the "right thing" damages your spiritual progress. It doesn't resolve *which* metric governs decision-making *ex ante*.

  5.  **Determine the "One Revision":**
      *   The core friction is between Consequentialism (a) and Intentionalism (b).
      *   (a) claims Buddhist ethics is *basically* consequentialist.
      *   (b) claims Karma is *basically* intentionalist.
      *   In Buddhism, Karma *is* intention (Cetanā). But the *Path* is about ending suffering.
      *   If the user keeps (b) as the definition of *Karma*, but changes (a) to say Buddhist ethics is *not* basically consequentialist, but rather *aretaic* (virtue-based) or *intention-based*, the tension dissolves.
      *   However, (a) is supported by (d) and (e).
      *   Better revision: Modify (a). Instead of "Buddhist ethics is basically consequentialist," shift to "Buddhist ethics is teleological (goal-oriented) but the *criterion* of rightness is intention/virtue, not outcome."
      *   Actually, the biggest leverage point is (a). If (a) is softened from "Consequentialist" to "Teleological with Intentional Criteria," (b) fits better.
      *   Wait, look at (f). (f) says it's about agent transformation. This aligns with (b). (a) aligns with (d) and (e).
      *   The "One Revision" should target (a). Claiming it is "basically consequentialist" is the source of the clash with (b). If (a) is changed to acknowledge that the *criterion* of moral quality is intention (aligning with b), while the *goal* is ending suffering (teleological), the conflict eases.
      *   Alternatively, target (b). But (b) is doctrinally very strong in Buddhism (Karma = Intention).
      *   Targeting (a) is safer for a practitioner. Buddhism is often misidentified as consequentialist. It's more Virtue Ethics + Teleology.
      *   *Decision:* The revision should be to (a). Stop calling it consequentialist. Call it "Intention-based Teleology."

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the list. It's a strong attempt at synthesis.
      *   **Ranking Tensions:**
          1.  **(a) vs. (b):** The Definition of "Right." (Severity: Critical).
          2.  **(a) vs. (f):** The Locus of Value. (Severity: High).
          3.  **(c) vs. (d):** The Decision Procedure. (Severity: Moderate).
      *   **Analyzing the Coping Mechanism:** Explain why it's a "split" rather than a solution. It creates moral residue.
      *   **The One Revision:** Focus on (a).
      *   **Cost/Benefit:** Explain what is lost (simplicity of utilitarianism) and gained (coherence with karma/no-self).

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I use named positions? I need to avoid saying "Virtue Ethics" or "Deontology" too heavily, though the concepts are needed. The prompt says "don't just tell me which named position I should adopt." I can use the terms to explain, but the focus must be on the *claims*.
      *   *Check:* Did I address (e)? (e) is interesting. No-self usually supports utilitarianism (impartiality). But the user uses it to support consequentialism. I should note that (e) actually creates tension with (b) too. If no-self, why does *my* intention matter more than *the outcome*?
      *   *Refinement on Tension 1:* The conflict is between *criterion of rightness* (a says outcomes, b says motives).
      *   *Refinement on Coping Mechanism:* It creates a "Schizophrenic Ethics." One metric for the world, one for the soul.
      *   *Refinement on Revision:* If I change (a) to say "The *goal* is consequentialist (ending suffering), but the *method/criterion* is intentional," does that work? Yes. That distinguishes *Telos* from *Criterion*.

  8.  **Final Polish:** Ensure tone is respectful, philosophical but accessible (matching the user's level), and directly answers the specific questions (Rank, Cost, Coping, Revision).

      *   *Structure:*
          1.  Diagnosis of the core fracture.
          2.  Ranked Tensions (1, 2, 3).
          3.  Evaluation of the "Two-Level" fix.
          4.  The Single Revision.

      *(Self-Correction on "Named Positions"):* The prompt says "don't just tell me which named position I should adopt." It doesn't forbid using philosophical terminology to explain the tension. I will use terms like "criterion of rightness" vs "goal" to be precise without just saying "Become a Virtue Ethicist."

      *(Final check on the Revision):* If I drop the word "consequentialist" in (a) and replace it with "teleological," does it fix (b)? Yes, because teleology allows the *goal* to be suffering reduction while the *measure* of the act is intention. This aligns (a), (b), and (f).

      *(Wait, one more thing):* The user says (d) supports (a). If I change (a), do I lose (d)? No, because the Bodhisattva acts out of *compassion* (intention), not just cold calculation. So (d) actually supports (b) more than (a) if read carefully. The user reads (d) as "consequences override," but it can be read as "compassionate intention overrides rule." This is a crucial insight to include.

      *Okay, ready to write.*
answer: |-
  This is a remarkably clear and honest map of your ethical landscape. Your partner is right that it doesn't fully hang together, but not because the ideas are bad. They don't hang together because you are trying to hold two different definitions of "what makes an act good" at the same time.

  You are trying to run a system where the *goal* is defined by outcomes (a), but the *score* is kept by intentions (b). In philosophy, this is the difference between the **criterion of rightness** (what makes the act right?) and the **decision procedure** (how do I choose?). Your list mixes these up in a way that creates friction.

  Here is the ranking of the tensions, from most severe to least, followed by an evaluation of your coping mechanism and the single revision that will stabilize the whole structure.

  ### 1. The Core Fracture: (a) vs. (b)
  **Severity:** Critical.
  **The Conflict:** Claim (a) says the moral weight of an act depends on its results (ending *dukkha*). Claim (b) says the moral weight depends entirely on the mental state at the time of acting, explicitly *not* the results.
  **What has to give:** You cannot maintain that consequences are the *basis* of ethics (a) while simultaneously holding that consequences are irrelevant to karmic quality (b).
  **The Cost:**
  *   If you keep (a) and drop (b): You lose the specifically Buddhist insight that karma is psychological causality. You turn Buddhism into standard utilitarianism, where a well-intentioned disaster is a "bad act" because it failed to reduce suffering. This undermines the practice of mindfulness and mental purification.
  *   If you keep (b) and modify (a): You have to admit that Buddhist ethics is not "basically consequentialist." It is teleological (goal-oriented) but not consequentialist in its judgment of acts.

  ### 2. The Locus of Value: (a) vs. (f)
  **Severity:** High.
  **The Conflict:** (a) implies the value is in the state of the world (less suffering out there). (f) says the value is in the state of the agent (purity in here).
  **The Conflict in Practice:** If I can prevent massive suffering by acting out of a slight impulse of pride (a win for (a), a loss for (f)), which do I choose? Your system currently says: Do it (it's the right thing, per (a)), but know you've damaged your karma (per (b)).
  **The Cost:** Keeping this tension forces you into a fragmented moral life where "doing good" and "becoming good" can pull in opposite directions. Giving it up means aligning the goal of the world with the goal of the mind.

  ### 3. The Rule Tension: (c) vs. (d)
  **Severity:** Moderate.
  **The Conflict:** (c) says "don't weigh case by case." (d) cites stories where weighing case by case is exactly what happens (the captain kills to save the many).
  **The Cost:** This is the easiest to fix. (c) is a heuristic for daily life; (d) is an exception for extreme cases. This isn't a logical contradiction, just a practical boundary condition. You don't need to drop either, just clarify that (c) is the default setting and (d) is the emergency override.

  ---

  ### Evaluation of Your Coping Mechanism
  **Does the "two-level" approach (dying father case) repair (a) and (b)?**
  **No. It papers over them.**

  Your solution creates a "moral schizophrenia." You are saying: "The act is *right* (consequentialist judgment) but *karmically impure* (intentionalist judgment)."
  This leaves you with no unified guide for future action. If the act was "right," why is the karma "mixed"? If the karma is "mixed," does that mean I should have done something else?
  By splitting the verdict, you avoid choosing which metric actually governs *decision-making*. It tells you how to feel after the fact (guilt-free but spiritually humble), but it doesn't tell you how to decide beforehand. It treats "Right Action" and "Good Karma" as two different currencies that don't exchange at a fixed rate. In a coherent system, they should be the same currency.

  ---

  ### The One Revision
  If you want to clean up the most mess with the single smallest change, **you must revise claim (a).**

  **Current (a):** "I think Buddhist ethics is basically consequentialist. The bad thing is dukkha... and I read the five precepts as instruments for that..."

  **Proposed Revision:** "I think Buddhist ethics is **teleological but intentionalist**. The *goal* is ending dukkha, but the *moral quality* of an act is determined by the intention, because intention is the seed of future dukkha."

  **Why this fixes it:**
  1.  **It saves (b):** It affirms that karma is about intention.
  2.  **It saves (f):** It centers the transformation of the agent.
  3.  **It rescues (d):** The Bodhisattva stories are no longer about "consequences overriding rules." They are about "compassionate intention overriding habitual rules." The captain doesn't kill because the math works out; he kills because his compassion is so vast he is willing to take the karmic hit to save others. That is a statement about the *quality of his mind*, not just the body count.
  4.  **It refines (e):** No-self doesn't justify consequentialism; it justifies why *my* purity isn't more important than *your* suffering. It supports the *goal* (ending suffering everywhere) without demanding the *method* be consequentialist.

  **The Cost of this Revision:**
  You lose the simplicity of utilitarianism. You can no longer say "the right act is the one that produces the best result." You have to say "the right act is the one motivated by the most wholesome state of mind, aiming at the best result."
  This means sometimes the "right" act (most wholesome intention) might lead to worse immediate outcomes than a "wrong" act (calculating manipulation). You have to accept that in Buddhism, preserving the purity of the mind is sometimes more important than fixing the immediate problem.

  **Summary:**
  Your partner sees the crack because you are using a consequentialist map (a) to navigate an intentionalist terrain (b). By shifting (a) to acknowledge that the *goal* is consequences but the *measure* is intention, the tension dissolves. The dying father case then becomes simple: The "right" action is the one motivated by pure compassion, even if the truth-telling causes pain. If the motive is mixed (love + cowardice), the act is karmically mixed, and therefore, strictly speaking, not the "right" action in the deepest sense, regardless of the outcome. This unifies your advice: focus on purifying the motive, trust that the consequences of a pure motive are ultimately better, even if they look painful now.
