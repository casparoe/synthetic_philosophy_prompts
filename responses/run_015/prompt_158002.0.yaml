      *   *Resource:* Budget allocation or office space. Let's say budget for a specific project team.
      *   *Rule/Custom:* A longstanding precedent that budget surplus from Q3 rolls over to Q4 for the specific team that generated it, enforced by an automated accounting system and audit protocols.
