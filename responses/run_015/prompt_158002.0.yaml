answer: |-
  A. The scenario
  In a mid-sized logistics firm, a Senior Vice President (SVP) of Operations demands the reallocation of a $50,000 Q4 surplus from a junior Project Manager's (PM) team to cover deficits in the SVP's own division. Company precedent, codified in the employee handbook and enforced by an automated auditing system, stipulates that team-generated surpluses roll over to the originating team's Q1 budget. The SVP threatens to fire the PM if the funds are not transferred manually, bypassing the audit trail. The PM refuses, citing the handbook. The dispute lands on the desk of an internal arbitration committee. The tension lies between the SVP's immediate coercive power over employment and the institutional rigidity of the financial protocols that sustain operational order.

  B. The three verdicts
  The natural-rights view awards the surplus to the Project Manager, arguing the funds are the fruit of their labor, an entitlement existing prior to company policy. The pure might-makes-right position grants the SVP the funds, as their authority to terminate employment renders their preference the only operative reality. The Pascalian conventionalist also awards the funds to the Project Manager, but for distinct reasons. For Pascal, justice is custom sustained by force. Here, the "force" is the automated auditing system and handbook protocols that prevent financial chaos. If the SVP's personal power overrides this structural force, the custom collapses, inviting disorder. Thus, to preserve the established order sustaining justice, the conventionalist must defend the weaker claimant whose claim aligns with institutional custom against the stronger actor's arbitrary will.

  C. The isolating feature
  The isolating feature is the automated auditing system coupled with codified handbook protocols. This represents structural force: impersonal enforcement maintaining stability independent of individual will. This reverses the Pascalian verdict by shifting the locus of "force" from the SVP's personal coercive capacity to the institution's systemic inertia. If removed—leaving manual ledgers and at-will employment without procedural guardrails—the structural force vanishes. In that vacuum, custom relies solely on immediate personal power. Consequently, the Pascalian view collapses into the might-makes-right position, requiring the PM to yield to the SVP to avoid immediate disorder.

  D. The power-politics rebuttal
  A might-makes-right defender argues institutional inertia is frozen past power, not present force. Since the SVP can fire the PM and override audits via fiat, "real" force remains personal. They claim Pascal's "force" requires immediate coercion, not friction. This highlights institutions rely on enforcement. However, the conventionalist view holds regarding stability. If the SVP breaks the system, they degrade the institutional force protecting their own future. Thus, while coercion favors the SVP, the conventionalist maintains political force includes the structural capacity to sustain order over time.
