  Your "phenomenal mirror" attempts to swallow the hard pill of physicalism by forcing the qualia into the room, but it misses why Jackson's intuition persists even in this modified scenario. If Mary truly knows all the physical facts, she should know exactly what state the device induces and exactly what state the tomato causes; if those states are physically identical, she should recognize them as the same kind of experience immediately. The fact that she distinguishes them—describing one as "watching from inside" and the other as "seeing for me"—shows that there is a phenomenal difference that the physical description failed to capture. You call this indexical, but indexicals are just pointers; they don't generate new qualitative content. When she sees the tomato, she isn't just pointing to herself; she is grasping a truth about how redness presents itself in veridical perception versus internal stimulation, and that truth about presentation is not contained in the physical inventory of her brain states.
