answer: |-
  In mapping the actors of the 1562 Rouen encounter, we identify four distinct parties: the French Court (King Charles IX and courtiers), the general public (townspeople), the Tupinambá delegates, and Michel de Montaigne. The Court observes exotic bodies and behaviors, standing to gain diplomatic leverage against Iberian rivals and internal prestige through the display of global reach; they risk appearing cruel if the spectacle turns grotesque. The Tupinambá observe European hierarchy and wealth, standing to gain potential alliance or trade goods but risking objectification, captivity, or death; their evidence of Europe is limited to what is shown them in a controlled environment. Montaigne observes both the spectacle and the visitors, standing to gain philosophical validation for his skepticism while risking social censure for undermining Christian norms; his evidence is mediated entirely through an interpreter and secondhand report. Cultural relativism explains the moral judgments each party makes about the other's customs (e.g., what constitutes barbarism), but it lies outside the scope of structural power dynamics, the ethics of captivity, and the coercive nature of the display itself.

  ### 1. Mapping the Episode onto the Theory

  To apply Montaigne's logic, we must treat the encounter not as a historical footnote but as a test case for his epistemological and ethical framework. The relevant actors are the **French Court** (the judges of civilization), the **Tupinambá** (the judged), and **Montaigne** (the meta-judge).

  *   **Evidence:** The Court's evidence is visual and superficial: skin paint, nudity, and language unintelligible to them. This evidence supports a pre-existing category of "savagery." The Tupinambá's evidence is sociological: they observe men full-fed alongside men starving, and free men obeying a single king. This supports a critique of European inequality. Montaigne's evidence is testimonial, filtered through an interpreter who likely served French interests.
  *   **Options and Judgments:** The Court faces a choice between treating the Tupinambá as diplomatic peers or as exotic specimens; they choose spectacle. The Tupinambá face a choice between performing expected savagery or asserting their own normalcy; reports suggest they noted European strangeness. Montaigne faces the critical choice defined in *Of Cannibals*: to condemn the Tupinambá by European standards or to invert the charge of barbarism. He chooses inversion.

  In Montaigne's framework, the "evidence" of barbarism is not intrinsic action but the observer's habit. Therefore, the Court's judgment is revealed as习惯性 (habitual) rather than rational. Montaigne's option is to refuse the Court's binary of Civilized/Savage and replace it with Natural/Artificial.

  ### 2. Applying the Inversion: Cruelty and Artificiality

  Montaigne's central inversion argues that Europeans commit greater barbarism by torturing living enemies in religious wars than cannibals who consume the dead ritually. He further argues that European customs are artificial distortions of nature, whereas Tupinambá customs align with natural law.

  *   **The Spectacle as Cruelty:** If we apply Montaigne's logic rigorously, the Rouen spectacle itself reproduces the cruelty he attributes to Europeans. Displaying human beings as curiosities treats them as objects rather than agents, akin to the dehumanization required for religious torture. The Court derives pleasure from the "otherness" of the Tupinambá, just as Montaigne claims Europeans derive pleasure from the suffering of heretics. The theory implies that the *viewers* are the barbarians here, not the viewed.
  *   **The Tupinambá Counter-Judgment:** Montaigne reports the Tupinambá were surprised that half-bearded men (the Swiss guard) did not strike the King, and that the poor did not seize the rich. This functions as a genuine epistemic counter-judgment within the theory: it exposes European customs as arbitrary and unnatural. However, there is a risk of appropriation. Montaigne uses this observation not primarily to validate Tupinambá political theory, but to serve European self-critique. The Tupinambá observation becomes a tool for Montaigne's skepticism rather than a standalone truth claim respected on its own merits. The inversion holds: the "savages" see the artificiality of Europe more clearly than Europeans do.

  ### 3. Limits of the Theory: Asymmetry and Silence

  Here the theory strains and eventually breaks. Montaigne's relativism presupposes a symmetrical visibility: both cultures observe each other as equally strange, and both have equal standing to judge. The Rouen episode reveals a radical asymmetry that relativism cannot adjudicate.

  *   **Power Asymmetry:** The Tupinambá are captives or guests brought across an ocean they did not choose to cross. They are displayed under a one-way gaze. Montaigne's theory accounts for moral judgment but offers no vocabulary for coercion. Relativism can say "European cruelty is no worse than Tupinambá cannibalism," but it cannot say "It is wrong to bring people here against their will for display." The theory is silent on the ethics of the encounter's structure.
  *   **Mediation and Translation:** Montaigne acknowledges he spoke to them via an interpreter who was "so badly instructed" that Montaigne could barely understand the answers. This breaks the epistemic symmetry. If the evidence is corrupted by poor translation, the relativist conclusion—that we are mutually strange—is compromised. The Tupinambá cannot effectively judge Europe if their words are filtered through a colonial mediator, nor can Montaigne truly know them.
  *   **Forcing the Theory:** To make Montaigne's framework speak to this, one must force it to address power rather than just custom. Montaigne treats customs as interchangeable garments; he does not treat power as a material constraint. When I ask whether the captivity invalidates the relativism, the theory offers no guidance. It assumes a level playing field of observation that did not exist.

  ### 4. Assessment: Sympathy vs. Idealization

  The real presence of the Tupinambá in Rouen tests whether Montaigne's sympathy extends to actual individuals or only to an abstract concept.

  *   **Epistemic Standing:** Montaigne grants the Tupinambá epistemic standing only insofar as they reflect European failings. They are a mirror, not a peer. If they were true peers, the encounter would be a dialogue about mutual customs. Instead, it is a diagnostic session where the Tupinambá diagnose Europe to cure European arrogance. Montaigne's framework prevents true peer disagreement because it ultimately centers the European skeptic's enlightenment. The Tupinambá are the means to Montaigne's end (skepticism), not the end themselves.
  *   **The Noble Savage Distance:** The episode exposes that Montaigne's sympathy depends on distance. In the essay, the cannibals are distant figures in a narrative. In Rouen, they are specific people. Montaigne notes he would have liked to speak to them longer, but he does not intervene to stop the spectacle. This suggests his relativism is contemplative, not activist. He can invert the charge of barbarism in text, but he cannot disrupt the power structure of the court in person.
  *   **Required Changes:** To treat this as a peer disagreement about cruelty, Montaigne's framework would need to shift from *skepticism about truth* to *ethics of power*. He would need to argue that the capacity to display others is itself a marker of barbarism, regardless of the customs displayed. He would need to value the Tupinambá's consent over the utility of their example. Currently, the theory allows him to say "We are all barbarians," but it does not compel him to say "We must stop displaying them." The episode confirms his sympathy is real but limited by his position as a magistrate within the very system he critiques. The theory illuminates the arbitrariness of custom but remains blind to the violence required to bring those customs into confrontation.
