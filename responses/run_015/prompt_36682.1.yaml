  3.  **Analyze Good's Theorem (The Philosophy/Decision Theory Background):**
      *   *What is it?* I.J. Good (1967) showed that for a Bayesian expected utility maximizer, the expected utility of observing a free experiment is at least as high as the expected utility of not observing it.
      *   *Why?* Because upon seeing the evidence, the agent updates (conditionalization) and picks the act maximizing expected utility relative to the *new* credence. Since the prior optimal act is still available, the new optimal act must be $\ge$ the old optimal act *relative to the posterior*. Taking the expectation over all possible evidence outcomes (using the Law of Total Expectation) shows the ex-ante expected utility of looking is $\ge$ the ex-ante expected utility of not looking.
      *   *The "Catch" (Assessing the Claim):* The theorem relies on specific assumptions. If those assumptions are violated, the claim "never have any reason to decline" is false.
      *   *Common Counterexamples/Exceptions:*
