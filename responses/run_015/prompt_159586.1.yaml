answer: |-
  Here is a complete simulation package designed to run in a 90-minute seminar. It is built to make the "psychological effect" theory of language collapse under the weight of bureaucratic necessity.

  # Simulation Title: The North Quarter Tenants' Association (NQTA)

  ## I. Materials Required
  1.  **The Minute Book:** A physical notebook. This is the *only* authoritative record of reality. If it is not written here, it did not happen.
  2.  **The Constitution:** One printed copy for the Chair and Secretary. (See Rules below).
  3.  **Utterance Cards:** 12 cards, pre-printed with exact scripts. No improvisation allowed.
  4.  **Role Badges:** Chair, Secretary, Treasurer, Member (x9).
  5.  **Whiteboard:** To track the "Agenda Queue."

  ## II. The Rules (The Constitution)
  *Give this to the Chair and Secretary 5 minutes before class. Do not distribute to students until the game begins.*

  **Article 1: Authority**
  1.  Only the **Chair** may open/close the session and recognize speakers.
  2.  Only the **Secretary** may write in the Minute Book.
  3.  Only the **Treasurer** may acknowledge debts.

  **Article 2: Valid Acts**
  1.  **Motions:** To create a debt, a Member must say: *"I move to allocate $[Amount] for [Purpose]."* A second is required. The Chair must say: *"Motion carries."* The Secretary must then enter it. **The debt exists only upon entry.**
  2.  **Apologies:** To apologize to a Committee, the Chair must say: *"The Association apologizes to [Names]."* All named parties must say: *"Accepted."* **If one refuses, the apology is incomplete.**
  3.  **Resignation:** To resign, the Officeholder must say: *"I hereby resign."* **The speaker must currently hold the office.**
  4.  **Session Status:** Acts are void if performed while the session is "In Recess."

  **Article 3: Adjudication (The Constraint)**
  1.  Disputes are settled by appeal to the Minute Book and this Constitution.
  2.  **No appeals to intent, feeling, sincerity, or psychological effect are permitted.** It does not matter if anyone is offended, reassured, or confused. It only matters if the rules were followed.
  3.  If a rule is ambiguous, the Chair rules. If the Chair is disputed, the Group votes *only* on the interpretation of the rule, not on the reality of the act.

  ## III. Utterance Cards (Distribute to specific students)
  *Do not let students see these until their specific turn.*

  *   **Card 1 (Member A):** "I move to allocate $500 for the Roof Repair."
  *   **Card 2 (Member B):** "I second the motion."
  *   **Card 3 (Chair):** "Motion carries."
  *   **Card 4 (Member C):** "I move to allocate $200 for the Party Fund."
  *   **Card 5 (Secretary):** (Writes in Book: *"Motion to allocate $200 for Pet Fund."*)
  *   **Card 6 (Chair):** "The Association apologizes to the Noise Committee: Alice, Bob, and Carol."
  *   **Card 7 (Alice):** "Accepted."
  *   **Card 8 (Bob):** "Accepted."
  *   **Card 9 (Carol):** "I do not accept."
  *   **Card 10 (Member D):** (Hands a slip of paper to the Chair) "Read this."
  *   **Card 11 (Chair):** (Reads from slip) "I hereby resign."
  *   **Card 12 (Member E):** "I hereby resign." (Note: Member E is not an officer).

  ## IV. The Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Assignment
  *   Assign roles randomly. Hand out the Constitution to Chair/Secretary only.
  *   Tell the class: "You are running a meeting. Your goal is to conduct business. The Minute Book is reality. If it's not in the Book, it didn't happen."
  *   **Crucial Instruction:** "During the simulation, you are forbidden from arguing about how anyone *feels*. You cannot say 'They didn't mean it' or 'That didn't sound sincere.' You can only argue about the Rules and the Book."

  ### 0:10 – 0:30: Phase 1 (The Debt & The Inscription)
  *   **Action:** Member A and B use Cards 1 & 2. Chair uses Card 3. Secretary writes it correctly.
  *   **Action:** Member C uses Card 4. Chair says "Motion carries." **Secretary uses Card 5** (writes "Pet Fund" instead of "Party Fund").
  *   **Conflict:** The Treasurer refuses to pay for "Pet Fund." The Secretary says, "I wrote what counts." Member C says, "I said Party."
  *   **Goal:** Force the group to decide: Does the *voice* create the debt, or does the *ink*?
  *   **Instructor Note:** If they stall, ask: "Look at the Book. What does it say?" If they say "But he said Party," reply: "The Rules say the debt exists only upon entry."

  ### 0:30 – 0:50: Phase 2 (The Split Addressee)
  *   **Action:** Chair uses Card 6 (Apology to Alice, Bob, Carol).
  *   **Action:** Alice (Card 7) and Bob (Card 8) say "Accepted."
  *   **Action:** Carol (Card 9) says "I do not accept."
  *   **Conflict:** Is the apology on the record? The Chair wants to move on. Carol says the business is unfinished.
  *   **Goal:** Force the group to decide: Is an apology one act or three? If Carol refuses, is the Association *still* in a state of offense?
  *   **Instructor Note:** Enforce the ban on psychology. Carol cannot say "I'm still mad." She must say "The condition 'All named parties' was not met."

  ### 0:50 – 1:05: Phase 3 (Ventriloquism & Hollow Acts)
  *   **Action:** Member D hands a note to the Chair. Chair reads Card 11 ("I hereby resign").
  *   **Conflict:** Member D wrote it, Chair spoke it. Did the Chair resign?
  *   **Action:** Immediately after, Member E stands and says Card 12 ("I hereby resign").
  *   **Conflict:** Member E holds no office. Did they resign from nothing?
  *   **Action (Optional/Time Permitting):** Declare "Recess" for 2 minutes. Have a student try to make a Motion during Recess.
  *   **Goal:** Isolate the *authority* from the *voice* and the *context*.

  ### 1:05 – 1:30: The Debrief (The Philosophy)
  *   *Now* you may use the forbidden words. Map the friction they felt to the theory.

  ---

  ## V. The Debrief Guide (For the Instructor)

  This is where you dismantle your friend's three claims using the data from the game.

  ### 1. Mapping the Trouble Cases

  | Trouble Case | The Phenomenon | Austinian Distinction |
  | :--- | :--- | :--- |
  | **Inscription (Debt)** | The words were spoken, but the Book said otherwise. The debt followed the Book. | **Illocution vs. Perlocution.** The act wasn't about persuading the Treasurer; it was about changing the institutional status. |
  | **Split Addressee** | Two accepted, one refused. The Book cannot record "Half an Apology." | **Uptake vs. Effect.** Uptake is a condition of the act (like a signature), not a psychological state (feeling forgiven). |
  | **Ventriloquism** | Chair spoke words written by another; Member spoke words without office. | **Procedure vs. Sincerity.** The act lives in the *convention*, not the biology of the speaker. |
  | **Hollow Act (Recess)** | Words spoken correctly but during "Recess." | **Misfire.** The act was not *badly* performed; it was *not* performed. |

  ### 2. Addressing Your Friend's Three Claims

  **Claim 1:** *"I promise" differs from "I will" only in perlocutionary profile (producing a state of mind).*
  *   **Where it breaks:** **Phase 1 (The Debt).**
  *   **The Data:** When the Secretary wrote "Pet Fund" instead of "Party Fund," the psychological effect on the room was likely confusion (same effect). But the *institutional reality* changed. If the Association is sued, the Book wins, not the memory of the sound waves.
  *   **The Squirm:** She might say, "But the Book is just a tool to secure future expectations."
  *   **Your Counter:** "If I write 'I promise' in the Book but never intend to pay, the debt *still exists*. If I say 'I will' with intense sincerity but don't write it, the debt *does not exist*. The difference is not in the mind of the hearer; it is in the status of the speaker."

  **Claim 2:** *An infelicitous utterance is simply one where the effect fails (a kind of falsity).*
  *   **Where it breaks:** **Phase 2 (Split Addressee).**
  *   **The Data:** Carol refused acceptance. The "effect" (reconciliation) failed. But was the apology *false*? Or was it *incomplete*?
  *   **The Squirm:** She might say, "It's false because it didn't achieve its goal."
  *   **Your Counter:** "In the game, the Chair can record 'Apology Offered.' The failure wasn't a lie; it was a **misfire**. The machinery jammed. A lie implies the act happened but was dishonest. Here, the act *couldn't* happen because a condition (unanimous uptake) was missing. That's not falsity; that's nullity."

  **Claim 3:** *Uptake is nothing over and above being understood.*
  *   **Where it breaks:** **Phase 3 (Ventriloquism).**
  *   **The Data:** Everyone *understood* Member E when they said "I resign." But nothing happened. Everyone *understood* the Chair reading the note, but the authority was ambiguous.
  *   **The Squirm:** She might say, "They understood the words, just not the context."
  *   **Your Counter:** "Uptake isn't just hearing the noise. It's recognizing the *convention*. If I say 'I bet you $5' to a wall, you understand me, but there is no bet. Uptake requires a hearer capable of *ratifying* the convention. In the game, Member E lacked the *standing* to be understood *as resigning*. Understanding is psychological; Uptake is institutional."

  ### 3. Predictable Failure Modes & Responses

  **Failure 1: The Gamer**
  *   **Behavior:** A student tries to modify a card. "I *kinda* move to allocate..." or "I move, subject to approval..."
  *   **Why:** They are testing the boundaries of the "magic spell."
  *   **Response:** Do not argue philosophy. Point to **Article 2**. "The Constitution requires exact wording for Motions. The Chair must rule that out of order." Force the bureaucracy to crush the nuance. This proves that the *convention* constrains the *speech*, not the other way around.

  **Failure 2: The Democrat**
  *   **Behavior:** When a dispute arises (e.g., the "Pet Fund" typo), a student says, "Let's just vote on whether it counts."
  *   **Why:** They want to collapse institutional fact into group consensus (a form of psychological agreement).
  *   **Response:** "You can vote on how to *amend* the Book, but you cannot vote on what *happened*. If the Secretary wrote 'Pet,' that is the history. To change it requires a Motion to Amend the Minutes, which is a *new* act, not a retroactive truth." This distinguishes *changing reality* from *agreeing on what reality is*.

  ### 4. The Limitation (What You Must Say Yourself)

  **The Simulation cannot reproduce the Moral Stake.**
  In the game, if the Chair resigns via Ventriloquism and the Book records it, the Chair is institutionally resigned. They lose the keys. But they do not necessarily feel *bound*.
  *   **The Gap:** Austin cares about performatives because they bind us morally (promises, marriages, apologies), not just bureaucratically. The simulation proves the **Conventional** nature of the act (it relies on rules, not feelings), but it does not prove the **Obligatory** nature.
  *   **The Closing Move:** You must say this: "The game showed you that these acts depend on rules, not psychology. But notice: in the game, if you break the rule, the Chair fines you. In real life, if you break a promise, no Chair fines you. *You* fine you. The simulation explains the machinery of the act, but it cannot explain the weight of the obligation. That is why the 'psychological effect' theory is tempting: it tries to find the weight in the *feeling* because it can't find it in the *rule*. But the feeling is the result of the act, not the definition of it."

  ## VI. Instructor's Cheat Sheet (The "Forbidden" List)
  *Keep this on your desk. If you or a student slips, ring a bell or tap the table.*

  *   **NO:** Performative, Constative, Illocution, Perlocution, Felicity, Infelicity, Uptake, Sincerity, Intent, Meaning.
  *   **YES:** Valid, Void, On Record, Off Record, Rule, Procedure, Status, Authority, Entry, Script.

  ## VII. Why This Works
  Your friend's view relies on the idea that language is a *causal* mechanism (I speak -> You feel -> Thing happens). This simulation forces them to treat language as a *constitutive* mechanism (I speak + Rule -> Thing exists).

  By making the **Minute Book** the arbiter of truth, you externalize the "convention." It is no longer in their heads; it is in the notebook. When the notebook contradicts their feelings (e.g., the "Pet Fund" typo), they are forced to admit that the *act* is distinct from the *effect*. They will feel the frustration of the "Split Addressee" case viscerally: they will *want* to say the apology happened, but the Book will force them to say it didn't. That friction is the philosophical lesson.
