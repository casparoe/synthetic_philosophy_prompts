answer: |-
  ### Brainstorming Log (Minutes 0–5)

  *   **Core Tension:** The committee is fighting over the definition of "science." One side wants physics (prediction, scores); the other wants hermeneutics (meaning, story).
  *   **Criterion (a) Seldon:** Hard to implement in history. N=1 problem. If I predict 2028, and I'm wrong, was the model wrong or was there a "black swan"? Need to clarify if we mean *probabilistic windows* or *dated events*. Dated is impossible. Probabilistic is doable.
  *   **Criterion (b) Knobs:** This is the technical kill-switch. Most historical models are just fitting curves to known data. If parameters > data points, it's astrology. This needs to be strict.
  *   **Criterion (c) Tinder/Spark:** Crucial distinction. Cliodynamics claims to predict the *probability of instability*, not the *assassination*. If they claim the latter, they're frauds. If the former, it's vague. Need to pin down what counts as "discharge."
  *   **Criterion (d) Falsification:** The "one history" problem. We can't rerun the Roman Empire. We rely on cross-polity comparison (Rome vs. Han vs. Maya). Is that valid? Are they independent samples? Historians say no (diffusion, shared ecology). Quant folks say yes (structural similarities). This is the weak link.
  *   **Criterion (e) Reflexivity:** Interesting, but maybe secondary. If the model is secret, reflexivity disappears. If public, it's a policy tool, not just science.
  *   **Criterion (f) Legibility:** Data quality. Most proxies (tax records, grain prices) are elite-biased. If the model predicts elite unrest, fine. If it predicts "popular revolt" using tax data, that's shaky.
  *   **Criterion (g) Microfoundations:** Do we need to know *why* a peasant rebels, or just *that* they will when wages drop? Physics doesn't ask electrons why they move. But social science isn't physics. Agents have reasons. Without mechanisms, it's just correlation.
  *   **Criterion (h) Narrative:** This is the historian's turf defense. "If I can't tell a story with it, it's not history." This is aesthetic, not epistemic. But... if a model predicts correctly but violates known historical facts, is it useful? Maybe not. But demanding it be "recognizable" biases toward conventional wisdom.
  *   **The Impossible Triangle:** You can't have (a) Precise Prediction + (g) Microfoundations + (f) Good Data. Deep history lacks micro data. You have to aggregate to predict. Aggregation kills microfoundations.
  *   **The Real Fight:** (a) vs (h). Prediction requires abstraction (ignoring the specific story). Narrative requires specificity (the story is the point).
  *   **Verdict:** (b) and (c) are the hard filters. (h) is the prejudice. (a) is the goal but needs softening (probabilities, not dates).

  ***

  ### The Spec: Criteria for a Predictive History Unit

  Here is the breakdown of your list. I've sorted them into **Non-Negotiables** (must haves for science), **Negotiables** (useful but adaptable), and **Prejudices** (disciplinary turf wars disguised as rigor).

  #### 1. The Non-Negotiables (The "Science" Floor)

  *   **(b) The Knobs-per-Cycle Ratio:** **Real Desideratum.**
      *   *Consideration:* This is the overfitting check. If you have three secular cycles in your dataset (e.g., Rome, Abbasids, Ming) and your model has four tuning parameters, you haven't found a law; you've drawn a line through dots.
      *   *Failure Mode:* It blocks "just-so stories" dressed as equations. As the ratio approaches 1:1, the model loses all out-of-sample predictive power. This is the single biggest filter against pseudoscience.
  *   **(c) Tinder versus Spark:** **Real Desideratum.**
      *   *Consideration:* Structural models predict *instability potential*, not *specific events*. A model should predict "high probability of civil conflict 2025–2035" based on elite overproduction, not "Assassination of President X on July 4th."
      *   *Failure Mode:* Prevents the model from being falsified by luck (a spark that never lit) or claimed as success after the fact (retfitting the spark to the tinder). The model must specify what counts as "discharge" (e.g., >1000 battle deaths) independent of the specific trigger.
  *   **(f) The Legibility Problem:** **Real Desideratum.**
      *   *Consideration:* Proxies must map to the theoretical construct. If you model "popular immiseration" but use "state tax receipts" as the proxy, you are measuring state capacity, not peasant welfare.
      *   *Failure Mode:* Garbage In, Garbage Out. Biased archives lead to biased models. If the data only sees what the state taxed, the model will only see what the state cared about.

  #### 2. The Negotiables (The "Engineering" Constraints)

  *   **(a) The Seldon Clause:** **Real Desideratum, but needs modification.**
      *   *Consideration:* Pre-registered forecasts are the gold standard, *but* "dated" predictions in history are often category errors. History is probabilistic.
      *   *Modification:* Demand probabilistic windows (e.g., "70% chance of instability within 5 years") scored against a baseline, not exact dates. Exact dating invites failure due to chaos theory, not model error.
      *   *Failure Mode:* Without this, the unit is just a retrospective story-telling machine. With strict dating, it sets itself up to fail unfairly.
  *   **(d) Falsification Clause:** **Real Desideratum, but philosophically messy.**
      *   *Consideration:* We have one history. To falsify, we need counterfactuals or cross-sectional comparison (different polities).
      *   *Modification:* Accept spatial substitution (comparing France to China) as a proxy for temporal repetition, but acknowledge the independence assumption is weak.
      *   *Failure Mode:* Without this, the model is unfalsifiable theology. With it, you admit your N is tiny.
  *   **(g) Microfoundations:** **Negotiable.**
      *   *Consideration:* Ideally, yes. Aggregates should emerge from individual actions. But in deep history, we rarely have household data.
      *   *Modification:* Accept "meso-foundations" (elite behavior, fiscal flows) if micro-data is unavailable, provided the mechanism is plausible.
      *   *Failure Mode:* Demanding strict microfoundations kills any model of pre-modern history because the data doesn't exist.
  *   **(e) Reflexivity:** **Negotiable (Context Dependent).**
      *   *Consideration:* If this unit is for academic knowledge, reflexivity matters less. If it's for policy/intelligence, it matters most.
      *   *Modification:* Require a "containment protocol" (who sees the predictions?) if reflexivity is a risk.
      *   *Failure Mode:* Ignoring this turns a policy tool into a self-defeating prophecy.

  #### 3. The Prejudice (The "Turf" Defense)

  *   **(h) Narrative Intelligibility:** **Prejudice.**
      *   *Consideration:* This is your historian colleague's demand that the model "make sense" within existing historiographical frameworks.
      *   *Why it's a prejudice:* Science often produces results that are unintelligible to contemporary intuition (e.g., quantum mechanics, or germ theory before germs were visible). If a model predicts instability based on soil potassium levels and it works, it doesn't matter if historians can't weave it into a story about "ideology."
      *   *Failure Mode:* Demanding this biases the model toward conventional wisdom. It prevents the discovery of *new* causal mechanisms that don't fit the current narrative canon. It privileges *understanding* over *prediction*, which is fine for humanities, but disqualifies the unit as a *predictive* science.

  ***

  ### The Impossible Trade-Off

  Here is the hard result you asked for. You cannot jointly satisfy the following triple:

  **(a) Seldon Clause (Dated/Precise Prediction) + (g) Microfoundations + (f) Legibility (Data Quality)**

  **The Argument:**
  To satisfy **(a)**, you need precise variables to generate precise outputs. To satisfy **(g)**, you need data on individual/household decisions (births, migration, consumption). To satisfy **(f)**, that data must be reliable and unbiased.

  In macrohistory, **(f)** fails for **(g)**. We do not have reliable household-level data for most of human history. We have tax rolls, chronicles, and archeological proxies. These are aggregate and biased (Legibility).
  *   If you insist on **(g) Microfoundations**, you must admit you cannot predict precisely **(a)** because the data is too noisy.
  *   If you insist on **(a) Prediction**, you must aggregate the data, which washes out **(g) Microfoundations**.
  *   If you insist on **(f) Legibility**, you must admit you can only model what the state saw (taxes, wars), not what the people did (misery, belief), which undermines **(g)**.

  **You must drop one.**
  *   Drop **(a)**: You get a descriptive structural model (good for understanding, bad for forecasting).
  *   Drop **(g)**: You get a black-box aggregate model (good for forecasting, bad for mechanism).
  *   Drop **(f)**: You get fiction (precise micro-stories based on guesswork).

  **Recommendation:** For a *predictive* unit, you must sacrifice **(g) Microfoundations**. Accept aggregate proxies. Demand mechanism plausibility, not individual verification.

  ***

  ### Exclusion Power & Non-Negotiables

  *   **Which requirement does the most work excluding candidates?**
      **(b) The Knobs-per-Cycle Ratio.**
      Most existing "theories" of history are narrative-heavy and parameter-light, or equation-heavy and data-light. When you force them to count parameters vs. independent historical cycles, 90% of the literature collapses into overfitting. This is the technical gatekeeper.

  *   **Non-Negotiables:**
      1.  **(b) Knobs-per-Cycle:** (Prevents overfitting).
      2.  **(c) Tinder vs. Spark:** (Prevents category errors).
      3.  **(f) Legibility:** (Prevents garbage inputs).

  *   **Negotiables:**
      1.  **(h) Narrative Intelligibility:** (Explicitly reject this as a success criterion).
      2.  **(g) Microfoundations:** (Accept aggregate mechanisms if micro-data is absent).
      3.  **(a) Seldon Clause:** (Accept probabilistic windows instead of exact dates).

  ***

  ### Contender Scorecard

  | Criterion | Turchin-Style (Demographic-Structural) | Slow-Moving Institutions (Acemoglu/etc.) | Black-Box ML / Time-Series |
  | :--- | :--- | :--- | :--- |
  | **(a) Prediction** | **Medium.** Claims cycles, but often post-hoc fitting. Struggles with dating. | **Low.** Explains divergence, rarely predicts specific instability windows. | **High.** Good at short-term forecasting if data exists. |
  | **(b) Knobs/Cycle** | **Medium.** Often criticized for tuning parameters to fit known cycles. | **Low.** Highly complex narratives, hard to quantify parameters. | **High.** Regularization handles this, but opaque. |
  | **(c) Tinder/Spark** | **High.** Explicitly distinguishes structural stress from triggers. | **Medium.** Focuses on critical junctures (sparks) over cycles. | **Low.** Correlates inputs to outputs, no distinction. |
  | **(d) Falsification** | **Medium.** Uses cross-polity comparison, but independence assumed. | **Low.** Path dependence makes counterfactuals hard. | **High.** Standard cross-validation, but assumes stationarity. |
  | **(e) Reflexivity** | **Low.** Rarely addressed. | **Low.** Rarely addressed. | **Medium.** Can be monitored, but opaque. |
  | **(f) Legibility** | **Low.** Proxies (e.g., height, grain prices) are noisy and biased. | **Medium.** Uses institutional coding, which is subjective. | **Low.** Uses whatever data is available, bias unchecked. |
  | **(g) Microfoundations** | **Medium.** Assumes rational actors, but aggregates heavily. | **High.** Focuses on incentives and choices (elites). | **None.** No mechanism. |
  | **(h) Narrative** | **Low.** Historians often find the cycles reductive. | **High.** Built to satisfy historical explanation. | **None.** Unintelligible. |
  | **VERDICT** | **Best fit for "Predictive History"** *if* parameter tuning is constrained. | **Best for Explanation,** fails prediction spec. | **Best for Forecasting,** fails science/mechanism spec. |

  **Final Note:** If you fund the Turchin-style unit, condition the funding on a strict **(b) Knobs-per-Cycle** audit and a shift from **(a) dated** to **probabilistic** forecasts. Tell the historian on your committee that **(h) Narrative Intelligibility** is explicitly excluded from the success criteria, or you will end up funding a seminar, not a lab.
