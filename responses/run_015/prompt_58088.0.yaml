prompt: |-
  Hey I'm a journalist who covers science and ideas stuff, mostly space and big-picture debates, and I'm kinda stuck prepping for an interview next week so I need a hand.

  You are an expert interview producer and a total pro on SETI and philosophy of astrobiology debates. Please think really carefully through this and start with a quick brainstorm before you give me the final list.

  My guest is an invented-for-now astrophysicist, call her Dr. Mara Voss, who defends this specific take on the Fermi paradox: life is probably pretty common, but we showed up unusually early in cosmic history, and even ambitious civilizations expand super slowly because hopping stars is energetically expensive and they have to pause and build up at each one, so the sky still looks empty. So no paradox, just early timing plus slow bubbles.

  I need like 9 sharp questions for a 40 minute recorded chat for smart non-experts. No generic background stuff about how she got into science or what teh Drake equation is, I already covered that. I want questions that actually press where the literature presses, and for each main question give me a follow-up keyed to what she'll most likely say back.

  Make sure I get at least one question each on: the Copernican worry about assuming we are early, why slow expansion still would not already be visible in things like waste heat or weird starlight dips, and what she thinks about the everyone is listening and nobody is transmitting idea. And her explanantion for why we should not expect a nearby relic or probe in our own solar system.

  Also build in one question around this toy scenario I keep turning over: say tomorrow we find a basically Earth-twin like 60 light years away with clear industrial pollution in its air, but still no beacons or probes or anything else. Would she take that as a win for her view or a problem, and why? I want to use that to force her to be concrete.

  End with a what-would-change-your-mind question, but make it specific to her slow-bubble plus early-arrival combo, not just any evidence against aliens in general. Take your time and be a bit ruthless, my readers will see through softballs.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science/ideas (space, big-picture debates).
      *   **Task:** Create 9 sharp interview questions for a 40-minute recorded chat.
      *   **Guest:** Dr. Mara Voss (invented astrophysicist).
      *   **Guest's Thesis:** Life is common, but we are early (temporal solution) + Civilizations expand slowly due to energy costs/pauses (slow bubbles). Therefore, the sky looks empty. No paradox.
      *   **Constraints:**
          *   No generic background/Drake Equation basics.
          *   Must press where literature presses (rigorous).
          *   Include follow-ups for each question based on likely answers.
          *   **Required Topics:**
              1.  Copernican worry (are we *really* early?).
              2.  Slow expansion vs. observability (waste heat/weird starlight).
              3.  "Everyone listening, nobody transmitting" (Dark Forest vs. Shy).
              4.  No nearby relics/probes in the Solar System.
              5.  Toy Scenario: Earth-twin at 60 LY with industrial pollution but no beacons/probes (Win or Problem?).
              6.  Falsification: What specific evidence would change her mind about the *slow-bubble + early-arrival* combo?
          *   **Tone:** Expert interview producer, ruthless but fair, smart non-expert audience.
          *   **Process:** Start with a brainstorm, then provide the final list.

  2.  **Deconstruct the Guest's Thesis (Dr. Voss):**
      *   *Premise 1: Early Arrival.* We are among the first civilizations. This relies on stellar population history (Population I vs. II stars) and the time needed for metallicity.
      *   *Premise 2: Slow Expansion.* Interstellar travel is hard/expensive. Civilizations grow like "slow bubbles" rather than explosive waves.
      *   *Conclusion:* The galaxy isn't teeming *yet*, and even if it were, we wouldn't see the Dyson swarms yet because they haven't had time to scale up or we are in a quiet patch.
      *   *Weak Points to Probe:*
          *   If life is common, why *are* we early? (The "Early Bird" problem).
          *   If they expand slowly, over billions of years, shouldn't *some* bubble have reached us or leaked heat?
          *   If they are out there, why no Von Neumann probes (even slow ones)?
          *   The "Industrial Pollution" scenario tests the "common life" vs. "visible tech" distinction.

  3.  **Brainstorming & Structuring:**
      *   *Goal:* 9 Questions total.
      *   *Flow:* Start with the core temporal argument -> Move to the physical constraints (slow expansion) -> Address observables (waste heat/probes) -> The Toy Scenario -> The "Silence" aspect -> Falsification.
      *   *Required Check:*
          1.  Copernican/Early? (Yes)
          2.  Slow expansion vs. Waste Heat? (Yes)
          3.  Listening vs. Transmitting? (Yes)
          4.  Solar System Relics? (Yes)
          5.  Toy Scenario (60 LY Pollution)? (Yes)
          6.  Falsification? (Yes)
          *   *Need 3 more questions to fill the gap and ensure flow.*
          *   *Idea A:* The definition of "slow." How slow is slow enough to solve Fermi but fast enough to exist?
          *   *Idea B:* The "Great Filter" placement. If we are early, is the filter behind us or ahead?
          *   *Idea C:* The sociological aspect. Do all civs behave the same regarding expansion?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Copernican):* Focus on the "Principle of Mediocrity." If we are early, are we special?
      *   *Q2 (Slow Expansion Physics):* Challenge the energy cost argument. Fusion/antimatter?
      *   *Q3 (Waste Heat):* IRAS/WISE data. If they exist, they glow.
      *   *Q4 (Solar System Probes):* Why no bracers? Even slow probes arrive eventually.
      *   *Q5 (Toy Scenario):* 60 LY pollution. Is this "life" or "tech"?
      *   *Q6 (Listening/Transmitting):* The "Shy Civ" argument.
      *   *Q7 (Homogeneity):* Do all civs pause? What if one doesn't?
      *   *Q8 (Future Visibility):* When do we expect to see them?
      *   *Q9 (Falsification):* Specific to her model.

      *Refining for "Ruthlessness":*
      *   Make Q1 about the *statistical* unlikelihood of being in the first 1%.
      *   Make Q3 about the *cumulative* effect of slow bubbles. Even slow bubbles fill the bucket eventually.
      *   Make Q4 about *drift*. Probes don't need fuel to coast.
      *   Make Q5 force a choice: Is pollution a sign of expansion or stagnation?
      *   Make Q9 about the *combination*. If we find an old civ, she's wrong. If we find we are late, she's wrong.

  5.  **Developing Follow-ups:**
      *   Need to anticipate her defenses.
      *   *Defense:* "Metallicity wasn't right before." *Counter:* "But red dwarfs live forever."
      *   *Defense:* "They hide waste heat." *Counter:* "Thermodynamics doesn't care about hiding."
