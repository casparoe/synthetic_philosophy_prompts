      *   Handle "Just Counting": Yes, decision theory depends on what counts. That *is* the point of SB (is credence about truth or about success frequency?).
      *   Limitation: We simulated *frequency*, not *first-person uncertainty*.

  8.  **Final Review of the Plan:**
