answer: |-
  # Activity Plan: The Awakening Wager

  ## 1. Design Decisions & Justifications

  **The Amnesia Problem: Spacing vs. Slip + Instruction**
  *   **Decision:** Use **Drawn Slip + As-If Instruction**.
  *   **Why:** Spacing (sending students out/in) violates your constraint that no student be passive for >10 minutes. With 16 students, a single "Beauty" rotation leaves 15 observers. To rotate everyone would consume the entire 75 minutes. The Slip method allows **parallel play**: every student is a "Beauty" simultaneously.
  *   **Caveat:** This method leaks information (a student holding two slips knows the coin was Tails). We mitigate this by instructing students to treat the slip count as hidden information until the scoring reveal. The pedagogical heavy lifting is done by the *scoring rules*, not the phenomenological amnesia. We will address this leakage explicitly in the debrief as a limitation of the simulation.

  **The Scoring Regimes: Math Check & Order**
  *   **Math Check:** Your calculation for Regime 2 is **correct**, provided the sampling is **per student** (one scored slip per student), not global (one scored slip from the whole box).
      *   *Regime 1 (All Scored):* Tails world generates 2x the scoring opportunities. Guessing Tails yields double the expected payoff. (Thirder pressure).
      *   *Regime 2 (One Per Student):* In Heads worlds, the single slip is scored (Prob 1). In Tails worlds, one of two slips is scored (Prob 0.5 per slip). However, since the student guesses on *both* slips in Tails worlds, they win if *either* is drawn and correct. Effectively, every student contributes exactly one scored guess. Since the coin is fair, 50% of scored guesses come from Heads-worlds and 50% from Tails-worlds. Expected value for guessing Heads = Expected value for guessing Tails. (Halfer/Indifference pressure).
  *   **Order:** Run **Regime 1 first**, then **Regime 2**.
      *   *Why:* Regime 1 produces a decisive winner (Tails), creating a strong intuitive pull toward the "count the awakenings" heuristic. Regime 2 neutralizes this, creating cognitive dissonance that forces them to analyze *why* the rule changed the outcome. This mirrors the philosophical move from the intuitive Thirder position to the contested Halfer defense.

  **Stretch Cases & Bookies**
  *   **Decision:** **Cut them.**
  *   **Why:** 75 minutes is tight for two full regimes plus a deep debrief. A student bookie adds complexity to the payoff structure that may obscure the core sampling issue. The 10-awakening stretch case is rhetorically powerful but unnecessary if the contrast between Regime 1 and 2 is sharp. Stick to the standard 1-vs-2 awakening structure to keep the cognitive load on the *scoring*, not the arithmetic.

  ---

  ## 2. Materials
  *   **Index Cards:** Cut into ~100 small slips (enough for 2 per student x 3 rounds).
  *   **Coins:** 1 large coin for the instructor (projected via document camera if available, or just held up).
  *   **Bags/Boxes:** 1 opaque bag or box for collecting slips.
  *   **Chips:** 2 colors (e.g., Red/Blue) for scoring tokens.
  *   **Chocolate:** Small pieces for payouts.
  *   **Projector:** To display the rules and running tallies.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute slips. Explain the "As-If" rule. |
  | **05-20** | **Regime 1** | Run 3 Rounds. Score *every* submitted slip. |
  | **20-25** | **Tally 1** | Reveal results. Tails should dominate. Brief reaction. |
  | **25-30** | **Transition** | Introduce Regime 2 rules. Emphasize the change. |
  | **30-45** | **Regime 2** | Run 3 Rounds. Score *one random slip per student*. |
  | **45-50** | **Tally 2** | Reveal results. Expect a near-tie/indifference. |
  | **50-65** | **Debrief** | Map activity to SB positions. Discuss sampling. |
  | **65-75** | **Reveal** | Name the positions (Halfer/Thirder). Assign reading. |

  ---

  ## 4. Activity Rules & Roles

  **Roles:**
  *   **The Experimenter (Instructor):** Flips the coin, distributes slips, collects guesses, manages scoring.
  *   **The Awakenings (Students):** Receive slips, make guesses, earn/lose chocolate.

  **The "As-If" Instruction (Crucial):**
  > "I will flip a coin. If Heads, I will distribute **one** slip to each of you. If Tails, I will distribute **two** slips to each of you. I will do this face-down. **Do not count your slips yet.** Treat every slip in your hand as if you do not know whether it is your only slip or one of two. Make a guess on every slip you hold."

  **Regime 1 (The Thirder Trap):**
  1.  Instructor flips coin (hidden).
  2.  Instructor distributes slips (1 per student if H, 2 per student if T).
  3.  Students write **H** or **T** on *every* slip they hold.
  4.  Students deposit all slips into the collection bag.
  5.  **Scoring:** Instructor draws *every* slip from the bag. For each correct guess, the student receives 1 chocolate chip.
      *   *Note:* In Tails rounds, students get double the chance to earn chocolate.

  **Regime 2 (The Halfer Correction):**
  1.  Instructor flips coin (hidden).
  2.  Instructor distributes slips (same as above).
  3.  Students write **H** or **T** on *every* slip they hold.
  4.  Students deposit all slips into the collection bag.
  5.  **Scoring:** For **each student**, the Instructor randomly draws **exactly one** of their submitted slips from the bag. Only that slip is scored for chocolate.
      *   *Note:* This normalizes the scoring opportunity per student, regardless of how many slips they held.

  ---

  ## 5. The Debrief (50-65 Minutes)

  **Step 1: Map the Numbers**
  *   Ask: "In Regime 1, who guessed Tails? Why?"
      *   *Expected:* "There were more slips in the bag for Tails."
      *   *Map:* This is the **Thirder** intuition. *Credence tracks the proportion of observer-moments.*
  *   Ask: "In Regime 2, who switched to Heads? Who stayed with Tails?"
      *   *Expected:* Confusion. Some will say "It didn't matter."
      *   *Map:* This is the **Halfer** intuition. *Credence tracks the chance of the underlying event (the coin), because the sampling was normalized per experiment.*

  **Step 2: Handle the "Sampling Assumption" Objection**
  *   *Student:* "Regime 1 only worked because you told us to count every slip. That assumes we should sample awakenings uniformly, which is exactly what Thirders claim. You begged the question."
  *   *Response:* "Exactly. The Sleeping Beauty problem isn't a math puzzle where one side makes a calculation error. It is a disagreement about **which reference class matters**. Regime 1 forced the 'Awakening' reference class. Regime 2 forced the 'Experimenter' reference class. The activity didn't solve the problem; it reproduced the tension. The question is: which scoring rule matches your *actual* epistemic goal when you wake up?"

  **Step 3: Handle the "It's Just Counting" Objection**
  *   *Student:* "This just shows that different betting rules change the optimal bet. It doesn't tell me what I should *believe*."
  *   *Response:* "This is the deepest point of the seminar. Decision theory links belief to action. If your belief in Heads is 1/2, but you always bet Tails because of the scoring rule, are you really a Halfer? Or does 'belief' just mean 'degree of confidence useful for maximizing utility in this specific environment'? The activity suggests that 'credence' might not be a single number, but a function of how you expect to be counted."

  **Step 4: Limitations (Honest Account)**
  *   **The Identity Leak:** Acknowledge that students knew they were distinct people. In the real SB problem, it is the *same* person twice. The simulation captures the *frequency* of awakenings, but not the *first-person continuity*.
  *   **The Memory Leak:** Acknowledge that holding two slips reveals Tails. In the real problem, memory is erased. We relied on the "As-If" instruction.
  *   **The Stakes:** Chocolate is not utility. But it was enough to make the counting salient.

  ---

  ## 6. Predictable Failure Points & Mitigation

  **Failure 1: The "I Have Two Slips" Leak**
  *   *Risk:* In Regime 1, a student looks down, sees two slips, knows it's Tails, and guesses Tails. This validates the result but for the wrong reason (cheating vs. epistemic reasoning).
  *   *Mitigation:* Enforce the "Face Down" rule strictly. "Do not look at your hand until you have your pen ready. Write immediately."
  *   *Debrief:* If this happens, own it. "This is why the simulation is imperfect. In the real problem, you *cannot* count. But notice: even if you didn't look, the *strategy* of 'Always Guess Tails' would still win more chocolate. The payoff structure drives the result, not just the information leak."

  **Failure 2: Regime 2 Confusion**
  *   *Risk:* Students don't understand how "One slip per student" is scored. They think you are drawing one slip for the *whole class*.
  *   *Mitigation:* Use the projector. Display a table:
      *   *Student A:* Submitted 2 slips. 1 drawn.
      *   *Student B:* Submitted 1 slip. 1 drawn.
      *   *Total Scored:* 16 slips (one per student).
  *   *Script:* "I am not picking one winner for the room. I am picking one winner *for you*, individually."

  **Failure 3: The Bag Argument (From Last Year)**
  *   *Risk:* Students argue about whether the bag was shuffled well or if the draw was truly random.
  *   *Mitigation:* **Public Randomization.** When scoring Regime 2, do not draw slips secretly. For each student, hold their submitted slips up, shuffle them in your hand visibly, and pick one. Or, have the student next to them pick. Make the sampling procedure transparent so the argument focuses on the *rule*, not the *execution*.

  ---

  ## 7. Uncertainties to Pilot
  *   **The "Void" Slip Distribution:** I am relying on the "As-If" instruction to hide the coin from the slip count. If students are too sharp, they will ignore the instruction.
      *   *Pilot Check:* Try this with a TA beforehand. If they immediately say "I have two cards, it's Tails," consider modifying the distribution method (e.g., put slips in sealed envelopes). However, envelopes take time to open. I am betting that the desire to win chocolate quickly will override the desire to meta-game the slip count.
  *   **Time Management:** 3 rounds per regime might be tight.
      *   *Contingency:* If running late, cut to 2 rounds per regime. The statistical signal is strong enough with 16 students x 2 rounds (32 data points) to show the trend.

  ## 8. Final Reveal (65-75 Minutes)
  *   Write on board: **Regime 1 = Thirder (1/3 Credence)**. **Regime 2 = Halfer (1/2 Credence)**.
  *   Explain that the literature is divided not on the math (everyone agrees on the math you just did), but on which Regime models "rational belief."
  *   Assign reading: Elga (2000) for Thirder, Lewis (2001) for Halfer.
  *   Closing thought: "Next week, we ask: When you wake up, are you betting for the team (all awakenings) or for yourself (the experiment)?"
