  # The Trolley Verdict Tree

  **Instructions:** Start at Node 1. Follow the arrows based on your verdict (Yes/No). Answer consistency questions honestly.

  ### **The Nodes**

  **1. The Standard Switch**
  A trolley heads toward five workers. You stand by a switch. Flipping it diverts the trolley onto a side track where one worker stands. He dies; the five live.
