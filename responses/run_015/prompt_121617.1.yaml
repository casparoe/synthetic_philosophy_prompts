  *Do you drop him?*
  → **Yes:** Go to Leaf **MAXIMIZING**.
  → **No:** Go to Leaf **RELATION (AIM)**.

  **5. The By-Product**
  A trolley heads toward five workers. You stand by a switch. Diverting the trolley causes a vibration that collapses a nearby booth. One person inside dies from the collapse. The trolley stops safely.
