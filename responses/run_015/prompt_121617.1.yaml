  *Do you flip the switch?*
  → **Yes:** Go to Node 7.
  → **No:** Go to Leaf **ABSOLUTIST**.

  **7. The Threshold**
  A trolley heads toward **one thousand** workers. You stand by a switch. Flipping it diverts the trolley to a side track where one worker stands. He dies; the thousand live.
  *Do you flip the switch?*
  → **Yes:** Go to Leaf **NUMBERS WIN**.
