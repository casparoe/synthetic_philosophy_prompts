      3.  **The Epistemic Gamble (Line 3):** Uncertainty makes the "least-bad" calculation risky, but moral responsibility usually tracks reasonable belief, not outcomes. (Awkward)

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the SD position. It's a version of the "Dirty Hands" problem or "Lesser Evilism" with a specific procedural safeguard (public dissent).
      *   **Section 1: Psychological Expressive Residue.** Focus on the Secret Ballot vs. Public Record tension.
