      *Classification:* This falls under Line 2 (Causal/Strategy) but touches on Line 1 (Expression). I will group it under Line 2 as "The Mandate Objection."

      *Wait, let's look at Line 1 again.* "Psychologically unavoidable expressive residue." The prompt asks about *psychology*. But the deeper issue is *semiotics/social perception*. I should address the psychological aspect (do *I* feel complicit?) but pivot to the social aspect (does *society* treat me as complicit?). The prompt asks about "moral complicity," which is normative, not just psychological.
