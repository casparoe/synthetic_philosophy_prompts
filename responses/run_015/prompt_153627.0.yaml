      *   **Section 3: Epistemic Uncertainty.** Focus on Ex Ante vs. Ex Post responsibility.
      *   **Ranking:** Order them.
      *   **Hidden Premises:** Identify assumptions about complicity (causal vs. intentional), political communication (aggregates vs. individuals), and epistemology.

