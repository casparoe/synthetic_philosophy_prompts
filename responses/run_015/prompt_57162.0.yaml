      *   If two calibrators disagree on the *same* reading against the *same* reference, it suggests the "reference standard" is under-specified or the "instrument" output is under-determined. In metrology, this is inter-rater reliability failure. It implies the scale isn't interval/ratio, maybe ordinal or nominal at best.

