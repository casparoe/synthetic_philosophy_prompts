      *   (iii) *Systematic Error:* Confabulation is structured. Averaging doesn't fix bias. Calibration must detect bias, not just noise.
      *   (iv) *Content vs. Process:* People are better at reporting *what* (content) than *how* (process). The "instrument" has different sensitivities for different ranges.

