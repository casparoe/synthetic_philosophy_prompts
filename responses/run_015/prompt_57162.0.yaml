      *   *Check Constraints:* No bibliography. Final line format.

      *(Self-Correction during drafting)*: I need to make sure I don't just validate the Supervisor. The Metrologist has a strong point about the *measurand*. If the measurand is "experience," and experience is private, there is no independent reference. If the reference is EEG, we are measuring EEG, not experience. The analogy works best if we treat the report as a *behavior* that indexes the state, not the state itself.
      *   *Pressure Point (i):* If the reference is behavioral (RT), we are calibrating report against behavior, not report against experience. This shifts the ontological claim.
