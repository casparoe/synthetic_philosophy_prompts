  5.  **Addressing the Four Pressure Points:**
      *   (i) *Reference Standard:* This is the crux. If EEG is the reference, are we measuring *experience* or *brain states correlated with experience*? If it's the latter, the analogy holds for correlation, not direct measurement of qualia. If the reference is another report, it's circular.
