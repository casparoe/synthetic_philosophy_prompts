answer: |-
  **NON-EMPORICAL ASSESSMENT PANEL (NEAP)**
  **Minutes of Meeting 44/202X**
  **Date:** 14 November 202X
  **Location:** Hybrid (Geneva/Secure Link)
  **Chair:** Dr. E. Voss
  **Present:** Dr. S. Kaelo, Prof. L. Mirit, Dr. A. Thorne, Ms. H. Grist (Secretariat)
  **Apologies:** Prof. J. Wrent

  **1. Spoiler-Theory Filing (Vernier Epistemic Solutions)**
  The Chair introduced Item 1 regarding a submission from Vernier Epistemic Solutions on behalf of a consortium of incumbent grant-holders. Vernier had filed a formally consistent alternative formulation to the leading Candidate Theory (CT-9), explicitly designed to be aesthetically unattractive and physically unmotivated, solely to trigger a recalculation of the No-Alternatives sub-score.

  The Panel discussed whether an alternative counts as a valid rival if no proponent advocates for its truth. Dr. Thorne noted that the No-Alternatives argument relies on the sociological fact of failed search efforts, not the modal fact of impossibility. If search efforts are now including adversarial filings, the sub-score reflects funding distribution rather than theoretical uniqueness. Ms. Grist reminded the Panel that Form NEAP-7b requires only mathematical consistency and empirical equivalence within current bounds.

  **Motion 44.1:** To accept the Vernier filing as a valid alternative for the purposes of the No-Alternatives sub-score, provided it meets formal consistency checks. To apply a "Motivation Weighting" factor of 0.85 to mitigate score depression.
  **Moved:** Prof. Mirit. **Seconded:** Dr. Kaelo. **Carried.**
  **Action:** Secretariat to update the scoring algorithm to include Motivation Weighting by 30 November.

  **2. Meta-Inductive Reference Classes**
  The Panel reviewed two submissions for the Meta-Inductive sub-score. Applicant A proposed a reference class restricted to historically vindicated theories that initially lacked alternatives. Applicant B proposed a class including all unfalsifiable conjectures proposed in the same period, most of which were abandoned.

  The Chair noted that the probabilistic weight of the Meta-Inductive argument depends entirely on the selected class. Selecting only successes guarantees a high score but begs the question; including failures collapses the score. Dr. Kaelo argued that there is no non-question-begging criterion for class membership available to the Panel.

  **Motion 44.2:** To adopt a Standard Reference Class (SRC-4) comprising all high-profile conjectures from the relevant epoch. To allow applicants to petition for a "Contextual Discretionary Uplift" if their theory shares specific structural features with SRC-4 successes.
  **Moved:** Dr. Thorne. **Seconded:** Prof. Mirit. **Carried.**
  **Action:** Criteria for "Contextual Discretionary Uplift" to be drafted by the Epistemic Standards Working Group.

  **3. Typicality Compliance (Multiverse Submissions)**
  The Typicality Compliance Office reported on Submission MV-12, which posits a landscape vacuum structure. The submission's chosen measure implies that 99% of observers with our data are Boltzmann Brains (random fluctuations) rather than ordinary observers. Consequently, the theory predicts that our observation of the theory's own consistency is likely a deception.

  The Chair asked if this constitutes a falsification. The Compliance Officer stated that under current guidelines, this is a failure of Typicality Declaration, not empirical falsification. The theory is internally consistent but probabilistically self-undermining regarding the observer.

  **Motion 44.3:** To flag Submission MV-12 as "Observer-Relative Non-Compliant." To require resubmission with a measure that limits the fraction of deceptive observers to below 50%, regardless of whether such a measure is physically motivated.
  **Moved:** Dr. Voss. **Seconded:** Dr. Kaelo. **Carried.**
  **Action:** Compliance Office to issue guidance on acceptable measure priors.

  **4. Publicity Incident (Institute for Fundamental Modelling)**
  The Panel considered a press release from the Institute for Fundamental Modelling stating their theory is "supported by all available evidence." The Panel noted the distinction between a theory being consistent with all data (negative support) and being confirmed by novel data (positive support). The Non-Empirical Assessment Panel assigns confidence indices based on the former, supplemented by non-empirical virtues.

  Discussion ensued on whether the Panel should sanction misleading public communications regarding the Provisional Confidence Index. Dr. Thorne noted that distinguishing "consistency" from "confirmation" in public discourse reduces funding appeal. No consensus was reached on whether the statement was technically false or merely imprecise.

  **Motion 44.4:** To take no punitive action. To instruct the Secretariat to draft guidance on acceptable terminology for public-facing documents regarding non-empirical confidence.
  **Moved:** Prof. Mirit. **Seconded:** Dr. Thorne. **Carried.**
  **Action:** Draft guidance to be circulated by 15 December.

  **5. Next Meeting**
  The next meeting is scheduled for 12 February 202X.
  **Meeting closed:** 16:45 CET.

  ***

  **Where this takes liberties**

  **Part 1: Genuine Commitments vs. Exaggeration**
  The satire exaggerates the formalization of Non-Empirical Assessment (NEA). While philosophers like Richard Dawid argue for the No-Alternatives Argument (NAA) and the Meta-Inductive Argument (MIA), no body assigns decimalized confidence indices. However, the core epistemic moves are genuine. Defenders of NEA do argue that the failure to find alternatives, given sustained effort, increases subjective confidence. The "Spoiler-Theory" item exaggerates the sociological nature of the NAA: defenders admit it tracks search effort, but assume that effort is truth-tracking. The satire reveals that if effort is gamifiable, the epistemic value collapses. The Typicality item accurately reflects the "measure problem" in multiverse cosmology, though treating it as a compliance tick-box is a bureaucratic fiction.

  **Part 2: Settled vs. Contested**
  Among experts, the validity of NEA is genuinely contested. Critics argue these arguments confuse sociological facts with modal facts (i.e., we haven't found an alternative doesn't mean one doesn't exist). Defenders reply that science operates under resource constraints; rational belief must account for the fact that smart people have tried and failed. The strongest defender reply is Bayesian: the NAA is not a proof of truth, but an update on subjective degrees of belief given the history of search. This is not settled; critics maintain that without empirical feedback, the prior probabilities remain arbitrary. The satire targets the moment this subjective Bayesianism is institutionalized as objective funding criteria, exposing the fragility of converting "rational belief" into "administrative fact."
