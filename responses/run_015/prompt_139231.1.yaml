answer: |-
  Hi there, it is genuinely refreshing to read someone describe this realization so clearly because you have independently rediscovered a cornerstone of stochastic control and utility theory that often takes graduate students months to formalize. You are absolutely right to feel that there is a structural symmetry at play here, and there are indeed established names for the properties you are observing, though they are usually discussed in separate corners of economics and mathematics. The property where the optimal fraction does not depend on your current wealth is called scale invariance, and in economics, this is deeply tied to the concept of constant relative risk aversion, often abbreviated as CRRA. The logarithmic utility function you are using is the specific boundary case of CRRA where the coefficient of relative risk aversion is exactly one, which is why it behaves so cleanly. When you have CRRA utility and the betting opportunity is purely multiplicative, meaning the outcomes are percentages of your bankroll rather than fixed amounts, the problem is homogeneous in wealth. This homogeneity ensures that if you were to double your bankroll and double every constraint simultaneously, the optimal strategy would remain identical, which is why fixed dollar fees or absolute targets break the rule; they introduce an absolute scale that makes a dollar mean something different to a poor bettor than to a rich one.

  The property where the optimal fraction does not depend on the number of rounds left or the horizon is called myopia, and while it often accompanies scale invariance, it is technically a distinct phenomenon arising from the specific algebraic structure of the logarithm. In dynamic programming terms, you are solving a Bellman equation, and for log utility in a multiplicative environment, the value function separates neatly into a term depending on current wealth and a term depending on time, which allows the optimization at each step to ignore the future entirely. When you introduce perturbations that depend on absolute wealth levels, like a fixed fee or a hard floor, you couple the wealth state to the time horizon because the risk of hitting that floor changes as time runs out, forcing the strategy to become dynamic and state-dependent. So to answer your question about whether wealth dependence and horizon dependence are one phenomenon, they are distinct symmetries, one related to scaling units of currency and the other to translation in time, but they are fragile in similar ways because the perturbations that break scale invariance usually introduce state-dependence that subsequently destroys myopia.

  The dividing line you are looking for, the thing that separates the perturbations that preserve the clean rule from those that destroy it, is the distinction between multiplicative and additive changes to the state dynamics or constraints. In mathematical terms, you are looking at whether the system preserves linear homogeneity versus affine transformations. If every constraint, fee, and target scales linearly with your bankroll, the system remains homogeneous and the optimal fraction stays constant. If any component is additive, meaning it is a fixed amount independent of your current state, it breaks the homogeneity. You can use this as a tight definition for your future experiments: if you can change the currency unit from dollars to cents without changing the optimal fraction f, the property is preserved, but if changing units changes the relative impact of a fee or target, the property is broken. This means your intuition about the floor and the withdrawal requirement is correct; a hard floor below which you cannot drop is an absolute additive constraint that will make the optimal bet size shrink as you approach the floor, and a fixed dollar withdrawal every round acts exactly like a fixed fee, forcing the strategy to become conservative when wealth is low and aggressive when wealth is high.

  You mentioned calling the preserving kind scale-shaped, and while that is not standard terminology, it is conceptually very close to the idea of homothetic preferences in economics, which describes preferences that remain unchanged when all goods are scaled up proportionally. For your own notes, I would recommend adopting the term scale invariance for the wealth independence and myopia for the horizon independence, and classifying perturbations as either homogeneous or inhomogeneous. This will give you a robust heuristic for predicting the behavior of new simulations without having to run them all. If the rules of the game look the same to a bettor with one dollar as they do to a bettor with one million dollars, except for the number of zeros, then the strategy will be constant. If the rules impose a toll that feels heavy to the poor bettor but negligible to the rich one, the strategy will depend on wealth. It is a beautiful example of how symmetry dictates solution structure, and you have carved the problem correctly by noticing that the elegance comes from the absence of absolute scales in the system. Keep poking at these simulations because you are effectively doing experimental mathematics, and your intuition about the fragility of the log rule is spot on.
