          *   If the user wants *ontologically real* downward causation (2), (5) is the weak link. You usually need *some* irreducibility (even if weakly emergent) to make the "downward" label stick without it being a mere shorthand.
          *   *However*, many analytical sociologists (e.g., Hedström) accept (1), (3), (5) and treat (2) as *mechanism-based* (situational constraints) rather than ontological downward force.
          *   *Conflict:* (2) claims "ontologically real" downward causation. (5) claims "no irreducible collective residue." If there is no residue, the "downward" entity is a fiction.
          *   *Severity:* High.

  4.  **Synthesize and Order Conflicts:**

      *   **Conflict 1 (Severe): (2) vs. (5).** Ontological Downward Causation vs. Full Decomposability. If there is no irreducible residue, the "structure" is just a label for the individuals. Calling it "downward" is metaphorical. If (2) is literal, (5) must go (or be softened).
      *   **Conflict 2 (Moderate/Conceptual): (1) vs. (6).** Explanatory Adequacy vs. Explanatory Priority. This is mostly pragmatic, but if (6) implies macro-explanations are *complete* without reference to individuals, it violates (1). The user says "temporary," which saves it. But it risks sliding into holism.
      *   **Conflict 3 (Metaphysical): (2) vs. (3).** Downward Causation vs. Causal Closure/Weak Emergence. This is the "Kim's Exclusion Problem." For a physicist, this is the elephant in the room. Weak emergence usually denies *novel* causal powers. (2) claims causal influence is "not merely epiphenomenal." This needs a functionalist account to work.

      *   **Apparent Tensions (Dissolvable):**
