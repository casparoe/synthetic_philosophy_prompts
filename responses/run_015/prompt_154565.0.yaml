      *   (3) **Weak Emergence:** Supervenience + Multiple Realizability. No violation of physical causal closure. (Compatible with physics background).
      *   (4) **Continuity:** No *sui generis* social ontology/methodology. Continuous with natural sciences. (Naturalism).
      *   (5) **Collective Intentionality (Decomposable):** Joint commitments are real but fully decomposable into interlocking individual mental states. (No irreducible "group mind").
      *   (6) **Explanatory Priority (Contextual):** In path-dependent contexts, macro-patterns have *temporary explanatory priority*. To explain individual beliefs, cite institutional trajectory first. (Top-down explanatory heuristic/pragmatics).

  3.  **Evaluate Pairwise Tensions (Mental Sandbox):**

      *   *(1) vs. (2):* MI says explain via individuals. DC says structures cause individual behavior.
          *   *Resolution:* Standard compatibilist move (e.g., Hedström, Elster, or Critical Realism lite). Structures are constituted by individuals but constrain them. Like a traffic light: constituted by physical parts/individual agreement, but constrains driving.
          *   *Verdict:* Apparent tension, resolvable via (3).

      *   *(2) vs. (5):* DC says structures constrain. (5) says collective states are just interlocking individual states.
          *   *Resolution:* If structures are *just* aggregates of individuals, is the "downward" causation real or just sideways causation (individual-to-individual)?
          *   *Problem:* If the structure is *nothing over and above* the individuals, saying the structure causes the individual to act looks like the individual causing themselves (via the medium of others).
          *   *Severity:* Moderate. Depends on how "real" the structure is in (2). If (2) requires the structure to have independent causal powers, (5) kills it. If (2) just means "constraints exist," (5) is fine.
          *   *User's (2):* "Ontologically real."
          *   *User's (5):* "Fully decomposable... no irreducible collective residue."
          *   *Conflict:* If it's fully decomposable, the "downward" arrow is arguably an illusion of scale. However, in complex systems, feedback loops look like downward causation even if ontologically bottom-up.
          *   *Verdict:* Tension, but manageable if "downward" is understood functionally/systemically rather than ontologically fundamental.

      *   *(1) vs. (6):* (1) says explain via individuals. (6) says explain via macro-trajectory first.
          *   *Resolution:* Pragmatic vs. Fundamental. (1) is about *adequacy* (must *eventually* cite), (6) is about *priority/order of inquiry* (start with macro).
          *   *Severity:* Low. This is a standard distinction between ontological/explanatory foundation and heuristic strategy.
          *   *Verdict:* Apparent tension.

      *   *(3) vs. (5):* Weak emergence (supervenience) vs. Decomposability.
          *   *Resolution:* Weak emergence *requires* supervenience. Decomposability is the mechanism of supervenience in this context. Multiple realizability fits with decomposability (different individual configurations = same macro state).
          *   *Verdict:* Compatible.

      *   *(4) vs. (6):* Continuity with natural science vs. Narrative/Path-dependence priority.
          *   *Resolution:* Natural sciences (e.g., cosmology, evolutionary biology, geology) deal with path-dependence and historical priority all the time. It doesn't require *sui generis* methodology.
          *   *Verdict:* Apparent tension.

      *   *(2) vs. (3):* Downward causation vs. Weak Emergence/Physical Closure.
          *   *Resolution:* This is the classic Kim-style exclusion problem. If physics is closed, and mental/social supervenes on physical, how can social cause physical (individual action)?
          *   *Standard Fix:* Realization/Functionalism. The macro property *is* the micro configuration playing a role. Causation is conserved.
          *   *Severity:* High for a physicist. They know the exclusion problem well.
          *   *User's Stance:* Accepts (3) explicitly to avoid violating physical closure.
          *   *Verdict:* Theoretically resolvable but requires careful metaphysics (functional realization).

      *   *(5) vs. (2) [Re-evaluation]:* This is the crux.
          *   If collective intentionality is *fully decomposable* (5), then "Institution" = Set of Individuals + Beliefs.
          *   If Institution causes Individual Action (2), then (Set of Individuals + Beliefs) causes Individual Action.
