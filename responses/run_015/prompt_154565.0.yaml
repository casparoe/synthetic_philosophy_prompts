      *   **Task:** Audit six specific philosophical commitments (1-6) regarding explanation, emergence, and ontology in the social domain.
      *   **Constraints:** No general lectures on individualism vs. holism. Identify genuine conflicts (ordered by severity). Distinguish from apparent tensions. Specify "cheapest revisions" and their costs. Address specific sub-questions about tensions between (1)-(2), (5)-(2), (6)-(1)/(4), and (3)-(5).

  2.  **Deconstruct the Six Commitments:**
      *   (1) **Methodological Individualism (Explanatory):** Macro regularities must *eventually* cite individual beliefs/intentions/interactions. (Bottom-up explanatory anchor).
