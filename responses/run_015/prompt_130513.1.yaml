  # ADVERSARIAL COLLABORATION: QUINEAN ETHICS
  **Subject:** The Status of Moral Values within Naturalized Epistemology
  **Parties:** Ontological Minimalists (OM) vs. Pragmatic Instrumentalists (PI)
  **Date:** 24 May 2024

  ## I. ADJUDICATOR'S ASSESSMENT OF FRAME AND ANALOGY

  **On the Substantive Nature of the Dispute:**
  This collaboration proceeds on the judgment that the disagreement between the Ontological Minimalists and the Pragmatic Instrumentalists is **genuinely substantive**, not merely verbal. It is not a dispute over the definition of "truth" or "value," but over the functional architecture of the web of belief. The OM camp insists that naturalism demands the elimination of normative categories from serious ontology. The PI camp insists that naturalism demands the integration of normative categories as indispensable regulatory mechanisms within the system. These are incompatible claims about the structure of cognitive economy.

  **On the Calibration-Target Analogy:**
  The proposed analogy—contrasting moral values as **theoretical entities** (PI leaning) versus **instrumental calibration targets** (OM leaning)—**clarifies** the dispute.
  *   **Justification:** In experimental physics, a theoretical entity (e.g., the electron) is posited to explain causal structure and is judged by truth-apt correspondence. A calibration target (e.g., a zero-point reference) is posited to stabilize measurement and is judged by utility and coherence.
  *   **Application:** If moral values are calibration targets, they are not "true" in the sense of mapping onto external moral particles; they are settings required to keep the social instrument functioning. If they are theoretical entities, they purport to track mind-independent normative facts. Quine's ontology forbids the latter, but his holism allows the former. The analogy successfully isolates whether moral sentences function as *descriptions of the world* or *settings for the observer*.

  ---

  ## II. JOINT STATEMENT OF AGREED CLAIMS

  Both camps affirm the following propositions as necessary consequences of Quine's naturalized epistemology:

  1.  **Continuity of Philosophy and Science:** There is no "first philosophy" standing outside science to judge it. Epistemology is a chapter of psychology, and ethics must be consistent with the best available empirical accounts of human behavior and evolution.
  2.  **Ontological Parsimony:** There is no evidence for a special moral faculty, non-natural moral properties, or sui generis normative facts. The ontology of physics is sufficient to describe the constituents of the universe.
  3.  **Holism of Confirmation:** Moral sentences are not isolated from the rest of the web of belief. They face the tribunal of experience not individually, but as a corporate body alongside scientific and logical statements.
  4.  **Causal Origin of Normativity:** Moral sentiments arise from conditioned responses, social reinforcement, and evolutionary selection pressures. There is no rational intuition that bypasses these causal chains.
  5.  **Revisability:** No moral commitment is immune to revision in principle. Any moral statement can be rejected if doing so yields a simpler, more predictive total system of beliefs, though the cost of such rejection may be prohibitively high.

  ---

  ## III. TABLE OF DISAGREEMENTS AND PREDICTIVE CRUXES

  | Issue | Ontological Minimalist (OM) Position | Pragmatic Instrumentalist (PI) Position |
  | :--- | :--- | :--- |
  | **1. Status of Moral Terms** | Moral terms are **Calibration Targets**. They are non-cognitive settings used to align individual behavior with group stability. They lack truth values. To call a act "wrong" is to express a conditioned aversion, not to state a fact. | Moral terms function as **Theoretical Entities** within the social web. They posit "values" as real nodes in the causal network of human interaction. They are truth-apt relative to the system's coherence and survival success. |
  | **2. Normative Force** | **Evolutionary stability explains cause, not justification.** The fact that a norm promotes survival does not make it *binding*. "Ought" cannot be derived from "is." Normative force is an illusion projected by evolutionary conditioning. | **Evolutionary stability constitutes justification.** Within a naturalized framework, "binding" means "indispensable for the system's persistence." If a norm is required for the web of belief to hold, it possesses genuine normative force. |
  | **3. Location in Web of Belief** | **Peripheral.** Moral claims are close to observation sentences (conditioned responses). They are easily revised when environmental contingencies change. They are not constitutive of logic or identity. | **Central.** Moral claims are often constitutive of the conceptual scheme itself. Revising them requires restructuring the entire social web, akin to revising logic. They are resistant to change not due to empirical refutation, but systemic role. |

  ### CRUX ANALYSIS AND PREDICTIONS

  | Crux | Concrete Case / Argument | OM Prediction | PI Prediction |
  | :--- | :--- | :--- | :--- |
  | **A. Can evolutionary stability ground normative force?** | **Case: The "Torture for Fun" Intuition.**<br>Consider a hypothetical community where gratuitous cruelty increases group cohesion and survival rates (e.g., via terror-based compliance). | **Prediction:** If cruelty enhances survival, the OM expects the "wrongness" of cruelty to vanish *ontologically*. The intuition that it remains wrong proves morality is not grounded in stability. The "ought" persists despite the "is." | **Prediction:** If cruelty enhances survival, the PI expects the "wrongness" of cruelty to be re-evaluated *functionally*. If the system survives, the norm is validated. If we condemn it despite survival, we are privileging a different web (ours), not accessing universal truth. |
  | **B. Can revision of moral commitments occur at the center?** | **Case: The Abolition of Slavery.**<br>The shift from slavery as an economic/moral given to slavery as a fundamental violation of personhood. | **Prediction:** This was a **peripheral adjustment**. Economic data (inefficiency) and empirical facts (shared biology) changed, forcing a update to moral observations. The core logic remained unchanged. | **Prediction:** This was a **central revision**. It required redefining "personhood" and "property," fundamentally altering the logical structure of the social web. It was not driven by data alone but by a re-weaving of the conceptual scheme's core. |

  ---

  ## IV. FINAL ADJUDICATOR NOTE ON RESOLUTION

  The Ontological Minimalists correctly identify that Quine's ontology admits no moral particles. However, the Pragmatic Instrumentalists better capture Quine's holism. In Quine's system, the distinction between "calibration target" and "theoretical entity" collapses under sufficient systemic pressure; a calibration target that cannot be removed without system collapse *becomes* a theoretical entity for all operational purposes.

  Therefore, the substantive disagreement reduces to this: **Is the resistance of moral beliefs to revision due to their lack of cognitive content (OM), or due to their extreme centrality in the web of belief (PI)?**

  The Pragmatic Instrumentalist position is the more rigorous extension of Quine's *Two Dogmas*. If any statement can be held true come what may, moral statements are candidates for the "center" of the web, not merely the periphery of conditioned response. The OM camp risks reintroducing a form of the analytic/synthetic distinction by categorizing moral claims as inherently non-cognitive. The PI camp accepts the risk of ontological inflation to preserve the unity of the web.

  **Recommendation:** Proceed with the Pragmatic Instrumentalist model as the working hypothesis for a Quinean ethics, treating moral values as indispensable theoretical posits for social physics, subject to the same pragmatic criteria as any other scientific theory.
