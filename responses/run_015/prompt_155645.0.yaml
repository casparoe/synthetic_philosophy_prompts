          1.  Realistic human setting, 1-2 paragraphs. Two agents, one significant free choice each. Ordinary stakes (money, job, etc.). No cosmic stakes.
          2.  Agreed Background: God exists, omniscient/omnipotent/good. Agents are libertarian-free & responsible. God doesn't cause/intend wrong. God does nothing wrong. World is worth creating.
          3.  The Divergence: Molinist God *allocates* wrongdoing (chooses circumstances knowing who will sin). SF God merely *permits* foresaw wrongdoing (cannot allocate because no counterfactuals). This must follow from epistemic differences, not stipulation.
