prompt: |-
  Me and my study group have been arguing about this for weeks and I need an outside take. Two of my friends, Maya and Jin, got into it after our moral psych seminar. Maya said that the whole WEIRD/non-WEIRD divide in folk morality — like how Westerners over-index on harm and fairness while other cultures weight loyalty, authority, and purity more — doesn't actually hurt moral objectivity at all. She thinks it just shows Western philosophers built there theories on a skewed sample, like trying to understand vision by only studying people with one type of color blindness. Jin pushed back: if the basic building blocks of morality shift by culture, then saying there's an objective moral fact is like saying there's an objective fact about which flavor is best — your just smuggling in your own cultural defaults. Maya came back with an analogy to language: different languages have different phoneme inventories, but that doesn't mean speech sounds aren't objectively real acoustic phenomena. Jin said that's different because phonemes have physical correlates, whereas "disrespecting authority" isn't a physical property. Then Maya said maybe moral properties are more like functional properties — they depend on social roles but are still objectively instantiated — and Jin said that's just compatibilism with a fancy name, not an argument for objectivity. They kept circling and neither would concede anything. Can you go through there exchange move by move and say who's right at each step — not just who wins overall, but where each one is making a decent point and where they're talking past each other? Also, is there something both are missing about how cross-cultural variation actually works? I'm especially curious whether the disagreement is really about objectivity or about something more basic like whether moral reasons are universalizable or just locally binding.
reasoning: |-
