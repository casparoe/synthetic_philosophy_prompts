  ### FACILITATOR'S LOGIC MAP (DO NOT DISTRIBUTE)
  *Use this to guide the 90-minute discussion. Flagged items address the logical space constraints.*

  **The Three Axes**
  This handout forces separation on:
  1.  **Metaphysics (Q1-2):** Can code feel? (Functionalism vs. Biological Naturalism).
  2.  **Epistemology (Q3-6):** Are there many? Are *you* one? (Bostromian Indifference vs. Reference Class Skepticism).
  3.  **Normativity (Q7-8, Q10):** Does it matter? (Existential Risk vs. Pragmatism).

  **Unoccupied Coherent Leaf**
  *   **The Benevolent Sim:** (Functionalism + High Probability + Low Significance).
      *   *Why Unoccupied:* Requires believing simulators are both common *and* ethically constrained to prevent shutdowns/suffering, despite evidence of suffering in our world. It's coherent but empirically unattractive.

  **Indistinguishable Leaves**
  *   **The Pancomputationalist vs. The Ill-Formedist:**
      *   *Why:* Both conclude the question "Are we in a sim?" is moot. One says "Everything is comp," the other says "The distinction is nonsense."
      *   *Separation:* Ask Q9. Pancomputationalists say "Yes, it's all code." Ill-Formedists say "No, 'code' requires a computer outside the system."

  **Discussion Flow**
  1.  **Sort (15m):** Let users score themselves.
  2.  **Cluster (30m):** Group by result. Ask the *Biological Naturalists* to convince the *Bostromians* on Q1. Ask *Reference Class Rejectors* to defend Q5 against *Bostromians*.
  3.  **Collapse (30m):** Focus on the **Significance** axis. If the *Pragmatists* and *Bostromians* agree on Q1-6, why do they diverge on Q10? (This prevents the "going in circles" problem from last month).
  4.  **Close (15m):** Reveal the **Unoccupied Leaf**. Ask if anyone wants to defend the "Benevolent Sim" position.

  **Note on "The Trilemma Agnostic":**
  Bostrom's trilemma is (1) Extinction, (2) No Interest, (3) We are Sims. The Agnostic accepts the disjunction but refuses the indifference step to conclude (3). Ensure they don't confuse this with the *Posthuman Skeptic* (who argues for horn 2 specifically).
