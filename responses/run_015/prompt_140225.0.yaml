answer: |-
  # SIDE 1: THE SIMULATION SORTER

  **Instructions:** Read the 10 scenarios below. For each, circle the option that feels most true *to you right now*. Don't overthink it. There are no right answers, only consistent ones. Bring this sheet back to the group for the reveal.

  **1. The Chip Swap**
  Surgeons replace your neurons one by one with functionally identical microchips. At the end, you behave exactly the same.
  *   **A.** You are still conscious; the substrate doesn't matter.
  *   **B.** You are now a philosophical zombie; biology is required.
  *   **C.** The question is impossible to answer.

  **2. The Game Crowd**
  In a hyper-realistic video game, NPC crowds fill a city. The player is conscious. Are the NPCs?
  *   **A.** If they act conscious, they are conscious.
  *   **B.** No, they are just code; only the player is real.
  *   **C.** It depends on who wrote the code.

  **3. The Energy Budget**
  A civilization survives for a million years. They have massive computing power.
  *   **A.** They would run billions of simulations of their ancestors.
  *   **B.** They wouldn't; it's too expensive or too boring.
  *   **C.** They wouldn't; it's morally wrong to simulate suffering.

  **4. The Purpose**
  If advanced beings run simulations, what are they mostly likely to be?
  *   **A.** Historical recreations (Ancestor Sims).
  *   **B.** Entertainment or research (Non-Ancestor Sims).
  *   **C.** There is no "purpose"; physics just is computation.

  **5. The Billion Copies**
  You wake up. You are told 1 billion copies of "you" exist in labs, and 1 is the original biological human.
  *   **A.** I am almost certainly one of the copies.
  *   **B.** I am likely the original; copies aren't "me".
  *   **C.** The odds are 50/50; I can't compare myself to copies.

  **6. The Solipsistic Server**
  What if only *your* mind is simulated, and everyone else is a cheap behavioural model?
  *   **A.** Plausible. I can't prove others are fully simulated.
  *   **B.** Impossible. The world is too consistent for that.
  *   **C.** Indistinguishable from reality, so it doesn't matter.

  **7. The Off Switch**
  Researchers find a bug and delete the simulation you are in.
  *   **A.** You cease to exist; it is a form of death.
  *   **B.** You were never alive; nothing was lost.
  *   **C.** It's tragic, but morally different than killing a human.

  **8. The Suffering Cap**
  If we are in a sim, does the pain you feel right now count as "real suffering"?
  *   **A.** Yes. Pain is pain, regardless of hardware.
  *   **B.** No. It's fake data processing.
  *   **C.** Yes, but the simulators are responsible, not us.

  **9. The Pixelated Universe**
  Physicists find a minimum grid-size to space-time (a lattice artifact).
  *   **A.** This proves we are in a simulation.
  *   **B.** No, it just means physics is discrete.
  *   **C.** "Simulation" is just a word for "physics with rules".

  **10. The Shrug**
  Suppose it is proven tomorrow: We are in an ancestor simulation.
  *   **A.** I change nothing; my life still matters.
  *   **B.** I panic; my future is owned by the simulators.
  *   **C.** I lose interest; nothing is fundamentally real.

  ***

  # SIDE 2: RESULTS & FACILITATOR KEY

  ### HOW TO SCORE
  Tally your answers. Don't sum them; look for your **Dominant Pattern** below. Start at **Step 1** and follow the arrows.

  **STEP 1: THE MIND (Look at Q1 & Q2)**
  *   **Mostly B (Biology/No):** You are **The Biological Naturalist**.
      *   *Commitment:* Consciousness requires specific meat, not just function.
  *   **Mostly C (Impossible/Depends):** Go to **Step 4**.
  *   **Mostly A (Function/Yes):** Go to **Step 2**.

  **STEP 2: THE CAPACITY (Look at Q3 & Q4)**
  *   **Mostly B/C (Won't run them / Non-Ancestor):**
      *   If Q3=B: You are **The Posthuman Skeptic**. (*Commitment:* Advanced civs lack interest or resources.*)
      *   If Q3=C/Q4=B: You are **The Non-Ancestor Simmer**. (*Commitment:* We might be sims, but not of *our* past.*)
  *   **Mostly A (Will run Ancestor Sims):** Go to **Step 3**.

  **STEP 3: THE SELF (Look at Q5 & Q6)**
  *   **Mostly B/C (I'm Original / 50-50):** You are **The Reference Class Rejector**.
      *   *Commitment:* Even if sims exist, "I" am not a random sample of them.
  *   **Mostly A (I'm a Copy / Solipsism possible):** Go to **Step 4**.

  **STEP 4: THE SIGNIFICANCE (Look at Q7, Q8, & Q10)**
  *   **Mostly A (Real Death / Real Pain / Panic):** You are **The Bostromian**.
      *   *Commitment:* We are likely sims, and our shutdown is a genuine existential risk.
  *   **Mostly B (Fake / Nothing Lost / No Change):** You are **The Pragmatist**.
      *   *Commitment:* We are likely sims, but truth doesn't change normative value.
  *   **Mixed / "Indistinguishable":**
      *   If Q9=C: You are **The Pancomputationalist**. (*Commitment:* "Simulation" is just a metaphor for physics.*)
      *   If Q1=C & Q9=B: You are **The Ill-Formedist**. (*Commitment:* The question relies on category errors.*)
      *   If Q3=C (Morals) & Q10=A: You are **The Benevolent Sim (Unoccupied)**. (*Commitment:* Sims are common, but simulators are ethical so we are safe.*)
      *   If Q10=C (Lose Interest): You are **The Nihilist**. (*Commitment:* Simulation implies meaninglessness.*)
      *   If unsure on Q3/Q4/Q5: You are **The Trilemma Agnostic**. (*Commitment:* One horn is true, but picking is unjustified.*)

