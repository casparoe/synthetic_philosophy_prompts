answer: |-
  # Joint Statement on the Replication Crisis and the Registry Initiative

  **Signatories:**
  *   **Dr. E. S. Mayo (Error-Statistical Frequentist)**
  *   **Dr. B. de C. (Subjective Bayesian)**

  **Background:**
  This statement is anchored in the Funder Registry Initiative. All studies are pre-registered with fixed design and analysis. Each is randomly assigned to a **Publish-All Arm** (results appear regardless of outcome) or a **Significance-Filtered Arm** (results appear only if $p < 0.05$). Pre-registration requires depositing either a **Subjective Prior** over the effect size or a **Power Analysis** (stating $\alpha$, $\beta$, and Smallest Effect of Interest). After ten years, the archive allows direct comparison of selection mechanisms.

  ### 1. Agreed Claims

  1.  **On Significance Tests:** A significance test ($p < 0.05$) licenses the claim that the data are improbable under the null hypothesis, but it does not license the claim that the alternative hypothesis is probable, nor that the effect size is large or practically important.
  2.  **On Replication Rates:** A low replication rate in the literature can coexist with every individual study having been analyzed correctly according to its own stated rules. This occurs when the literature is a biased sample of studies (due to the Significance-Filtered Arm mechanism) rather than a random sample of inquiries.
  3.  **On Selection Effects:** Selection mechanisms (file drawer, outcome-switching, optional stopping, and the Significance-Filtered Arm) invalidate inferences that ignore them. For the Frequentist, this inflates the long-run Type I error rate. For the Bayesian, this renders the published posterior probabilities miscalibrated relative to the true frequency of effects, violating the coherence of the aggregate record.
  4.  **On the Registry Gap:** If a large, persistent gap exists between the effect-size distributions of the Publish-All and Significance-Filtered arms, both sides agree this demonstrates that the significance threshold induces a "Winner's Curse" (inflation of effect estimates).
  5.  **On Stopping Rules and Selection:** We agree that the Bayesian claim "stopping rules are irrelevant" holds strictly for the likelihood of data *within* a single fixed model. However, once selection *across* studies (the arm assignment) determines which data enter the public record, the selection rule becomes relevant for evaluating the reliability of the literature as a whole.
  6.  **On Pre-Registration Deposits:** Both the deposited Prior and the deposited Power Analysis provide necessary constraints for evaluating the integrity of the inference. The Power Analysis defines the error capacities; the Prior defines the plausible parameter space. Ignoring either renders the registry data difficult to interpret.

  ### 2. Residual Disagreements

  | Disagreement | Frequentist Position (Error-Statistical) | Bayesian Position (Subjective/Coherence) | Substantive or Verbal |
  | :--- | :--- | :--- | :--- |
  | **Goal of Inference** | The goal is to ensure procedures have high capacity to detect errors (Severity). Reliability is defined by long-run performance. | The goal is to represent uncertainty coherently. Reliability is defined by calibration of subjective belief to outcome. | Substantive |
  | **Empirical Bayes** | A prior fitted to the archive (Hierarchical/Empirical Bayes) is a valid tool for controlling False Discovery Rates. It is frequentism in useful clothing. | A prior fitted to the archive is an approximation of subjective belief. If tuned for frequency properties, it ceases to be pure Bayesian inference. | Substantive |
  | **Role of the Deposit** | The deposited Power Analysis is primary. It determines the probative value of the test. A prior is secondary and often arbitrary. | The deposited Prior is primary. It determines the posterior. Power analysis is merely a planning tool for frequentist properties we do not seek. | Substantive |
  | **Interpretation of the Gap** | The gap between arms proves the Filtered Arm violates error-statistical assumptions. The Publish-All arm represents the true error rate. | The gap between arms proves the Filtered Arm posteriors are miscalibrated. The Publish-All arm allows better prior updating. | Verbal (different metrics for same phenomenon) |
  | **Objectivity** | Objectivity is achieved by restricting subjective input (priors) and adhering to public, pre-specified error rules. | Objectivity is achieved by making subjective assumptions (priors) explicit and updating them coherently via Bayes' Theorem. | Substantive |

  ### 3. Cruxes

  1.  **Predictive Superiority:** If a hierarchical prior fitted to the Publish-All archive predicts the results of the Significance-Filtered arm more accurately than the Power Analysis predicts the rejection rates, does this validate the Bayesian approach as the superior guide for action?
  2.  **The Meaning of Calibration:** If the deposited Subjective Priors in the Publish-All arm yield posteriors that are perfectly calibrated (e.g., 95% credible intervals contain the truth 95% of the time) despite low power, does this satisfy the Frequentist's requirement for reliability?
  3.  **Selection vs. Stopping:** If optional stopping is permitted in the Publish-All arm but modeled correctly in the Bayesian analysis, and the Frequentist analysis shows inflated error rates, which metric determines whether the study is "valid"?
  4.  **Empirical Bayes Status:** If an Empirical Bayes method applied to the archive achieves strict frequentist error control, must the Bayesian admit it is "frequentism in disguise," or does the use of a probability distribution over parameters keep it Bayesian?

  ### 4. Cases and Predictions

  **Crux 1: Predictive Superiority**
  *   **Case/Quantity:** The mean squared error of predictions for the Significance-Filtered arm outcomes, generated using (A) the Hierarchical Prior fitted to Publish-All data vs. (B) the deposited Power Analysis parameters.
  *   **Frequentist Prediction:** (B) will better predict the *rate* of significant findings, because power is designed to model the testing procedure, not the effect size distribution.
  *   **Bayesian Prediction:** (A) will better predict the *magnitude* of the reported effects, because the hierarchical prior captures the true distribution of effects underlying the selection bias.

  **Crux 2: The Meaning of Calibration**
  *   **Case/Quantity:** Coverage probability of 95% intervals in the Publish-All arm, stratified by the deposited Power Analysis (Low vs. High Power).
  *   **Frequentist Prediction:** Coverage will be nominal only if the Power Analysis was adhered to as a frequentist design constraint. Low power studies will show high variance, making individual inferences unreliable regardless of interval coverage.
  *   **Bayesian Prediction:** Coverage will be nominal across both strata if the deposited Prior was coherent. Power is irrelevant to the validity of the posterior interval for the specific case.

  **Crux 3: Selection vs. Stopping**
  *   **Case/Quantity:** False Positive Rate in the Publish-All arm for studies employing optional stopping vs. fixed sample size.
  *   **Frequentist Prediction:** Optional stopping will inflate the False Positive Rate above $\alpha$, invalidating the inference unless corrected (e.g., alpha-spending).
  *   **Bayesian Prediction:** Optional stopping will not invalidate the posterior *if* the prior was fixed before data collection. However, selection *across* studies (the Arm assignment) will distort the aggregate posterior mixture.

  **Crux 4: Empirical Bayes Status**
  *   **Case/Quantity:** Classification of a Hierarchical Model tuned to minimize False Discovery Rate (FDR) on the archive.
  *   **Frequentist Prediction:** This is frequentist inference using Bayesian machinery. The justification is error control, not belief representation.
  *   **Bayesian Prediction:** This is Bayesian inference where the hyper-prior is estimated from data. The justification is coherence; error control is a happy byproduct, not the definition.

  \answer{Whether inference aims for long-run reliability or individual belief coherence.}
