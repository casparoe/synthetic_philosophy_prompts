answer: |-
  This is a sharp, well-structured draft. You have correctly identified the primary tension in Thomistic political theory: the relationship between the sin of sedition and the removal of a tyrant. Your first paragraph is exegetically solid; the distinction between disturbing a *just* order (sedition) and disturbing an *unjust* order (tyranny) is the standard and correct reading of *Summa Theologiae* II-II, q.42, a.2.

  However, since you asked for a second pair of eyes on the "knot," I need to be direct: **the argumentative move in your second paragraph (regarding *De Regno* and private authority) is the vulnerable point, not the third.**

  Here is a breakdown of where the argument holds, where it risks slipping, and how to use your third paragraph to save it.

  ### 1. The Sedition Distinction (Paragraph 1)
  **Verdict: Strong.**
  You are right to separate the definition of sedition from the act of tyrannicide. Aquinas is consistent here: *seditio* is contrary to the unity of the *just* common good. A tyranny, being ordered to private good, lacks the moral unity that sedition violates. This clears the ground effectively.

  ### 2. The "Private Authority" Claim (Paragraph 2)
  **Verdict: Textually Risky.**
  This is the "knot" you mentioned. You claim that in *De Regno*, Aquinas grants that if no public authority exists, tyrannicide may be undertaken by "private authority." You argue this is a "real carve-out," not a fig leaf.

  **The Problem:** Most standard readings of *De Regno* (Book I, Ch. 6) argue the opposite. Aquinas writes: *"To proceed against the cruelty of tyrants is an action to be undertaken, not through the private presumption of a few, but by public authority"* (*Non est praesumptione privata aliquorum, sed auctoritate publica procedendum*).

  When Aquinas addresses the scenario where there is *no* human superior to appeal to (e.g., the tyrant recognizes no earthly master), he does not explicitly pivot to private authority. He writes: *"There remains no other remedy than to have recourse to the King of all, God."* He explicitly cites the failure of Brutus and Cassius as a warning against private assassination, noting it often leads to worse tyranny.

  **The Nuance You Need:**
  To make your claim hold, you need to distinguish between two types of tyrants, which Aquinas hints at but doesn't fully systematize in *De Regno*:
  1.  **The Usurper (*tyrannus ex defectu tituli*):** One who seizes power without right. Some Thomists argue this person is a private aggressor, and thus private defense is permissible.
  2.  **The Abusive Ruler (*tyrannus ex parte exercitii*):** One who has legitimate title but rules badly. Here, Aquinas is much stricter on public authority.

  If your claim is that Aquinas allows private killing of a *usurper* when public authority is absent, you have a stronger case. If your claim is that he allows private killing of a *legitimate-but-abusive* king, you are fighting the dominant textual current.

  **Suggestion:** Soften the claim in Paragraph 2. Instead of saying he "grants... by private authority," say he "leaves open the possibility..." or "distinguishes the usurper, against whom private action is less prohibited." Acknowledge that *De Regno* is generally cautious, which makes your third paragraph's worry valid.

  ### 3. The "Multitude" Problem (Paragraph 3)
  **Verdict: This is your strongest philosophical insight.**
  You are right to be unsure about the private-authority clause, but your intuition about the "multitude as tyrant" is where the real innovation lies.

  If the tyranny is the multitude (a corrupt democracy or mob rule), the "public authority" *is* the tyrant. There is no higher public authority to delegate to.
  *   **The Collapse:** If you argue that private individuals can act when public authority fails, does that mean in a democratic tyranny, any individual can act? Aquinas would likely recoil from this (fearing anarchy).
  *   **The Solution:** You need to lean on the idea of the **"Virtual Public."** Even if the *institutions* are corrupted, the *community* retains a residual authority. The "private" agent isn't acting as a private individual (like a vigilante) but as a limb of the body politic that has been severed.

  **How to fix the move:**
  Don't frame it as "Private Authority." Frame it as **"Residual Public Authority."**
  Aquinas believes authority originates in the people (natural law/social nature). They delegate it to the king. If the king destroys the common good, the delegation is voided. The authority reverts to the source (the people).
  *   Therefore, when a "private" person kills a tyrant in the absence of public structures, they are not exercising a *private right* (which Aquinas hates); they are exercising a *reclaimed public right* on behalf of the community.
  *   This solves your Paragraph 3 worry: If the multitude is the tyrant, the "private agent" must be someone acting to restore the *true* common good against the *corrupt* multitude. This is harder to justify, which explains Aquinas's caution.

  ### Specific Recommendations for Revision

  1.  **Revisit *De Regno* I.6:** Check the specific Latin regarding "private presumption." You might be conflating Aquinas with later Scholastics (like Suárez or Mariana) who were more permissive. If you stick to Aquinas, acknowledge his caution.
  2.  **Reframe Paragraph 2:** Instead of claiming Aquinas explicitly endorses private authority, argue that his *logic* necessitates it.
      *   *Current:* "He attaches a condition... by private authority."
      *   *Revision:* "While he warns against private presumption, his logic regarding the source of authority implies that when public structures collapse, the right of defense reverts to the community, potentially actionable by individuals acting *in loco communitatis*."
  3.  **Expand Paragraph 3:** This is your "money" paragraph. The tension between "multitude as tyrant" and "private agent" is the most interesting part of your draft.
      *   Ask: Does Aquinas allow for a "remnant" of the people? (e.g., the "better part" of the multitude).
      *   If the multitude is the tyrant, the "private" killer is actually acting against the *will* of the majority but for the *good* of the community. This aligns with Aquinas's view that law is an ordinance of reason, not just will.

  ### Summary
  Your instinct in Paragraph 3 is correct: the "private authority" clause is the weak link if treated as a simple permission slip. It only holds if you reinterpret "private" not as "individual vigilante" but as "agent of the dissolved public."

  If you make that shift, you resolve the knot: It's not that Aquinas permits private murder; it's that he recognizes that in a tyranny, the distinction between public and private authority has already been collapsed by the tyrant, and the restoration of order may require extraordinary means that *look* private but function publicly.

  This is a promising draft. Tighten the textual claim in the middle, and let the philosophical problem in the end drive the conclusion.
