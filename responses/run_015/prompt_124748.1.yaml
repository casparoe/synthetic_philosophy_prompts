      *   **Tension B: 5 vs 6 (The Normative vs. Observational Clash)**
          *   *5 says:* High barriers are wasteful/ unethical; we *should* remove them.
          *   *6 says:* High barriers correlate with trustworthiness/quality (observation).
          *   *Severity:* Medium-High. It's an "Ought vs. Is" conflict, but also implies the "wasteful" thing might be functionally necessary.
          *   *Resolution:* Distinguish between *signaling quality* vs. *signaling commitment*. Or acknowledge the trade-off.

      *   **Tension C: 1/2 vs 5 (The Biological vs. Ethical Clash)**
