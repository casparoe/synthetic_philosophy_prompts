answer: |-
  Goodman's *New Riddle of Induction* poses a foundational crisis for machine learning, particularly in the low-data, low-capacity regime. In large-scale deep learning, the "grue" problem is typically dissolved by brute force: massive corpora provide the statistical entrenchment Goodman describes. The model sees "green" used consistently across billions of contexts and "grue" never; the probability mass collapses onto the entrenched predicate.

  However, in small neural architectures lacking this statistical inertia, the underdetermination problem returns with a vengeance. Without the "wisdom of the crowd" encoded in weights via pretraining, the model has no rational basis to prefer a time-invariant feature (green) over a time-dependent one (grue) based solely on training loss.

  Here are the implications for designing inductive biases in this constrained setting, addressing the substitution of structural priors for entrenchment and the legitimacy of feature learning.

  ### 1. Designing Inductive Biases: From Frequency to Invariance

  Goodman's argument implies that **fit to historical data is insufficient for valid induction.** For small architectures, the inductive bias cannot merely be a preference for low complexity (e.g., $L_2$ regularization), because a "grue" function can be mathematically simple if the time variable is accessible.

  Instead, inductive biases must be designed to enforce **counterfactual stability** rather than just interpolation accuracy.
  *   **Temporal Invariance:** If the task involves physical objects (like emeralds), the architecture should explicitly penalize representations that are sensitive to arbitrary indexical variables (like timestamp $t$) unless causally justified. This suggests architectural choices that sever the gradient flow between temporal metadata and semantic feature extractors.
  *   **Symmetry Priors:** Goodman's riddle highlights that "grue" breaks the symmetry of time translation. Small models should incorporate priors that assume the generative process is stationary. Techniques like data augmentation should not just add noise, but enforce invariance to irrelevant transformations. If a feature changes when the time index changes but the object does not, the bias should suppress it.
  *   **Causal Structure over Correlation:** "Green" is a property of the emerald's physical structure; "Grue" is a property of the observation context. Small models should be biased toward learning causal mechanisms (structural equation models) rather than associative mappings. This limits the hypothesis space to functions that remain valid under interventions, effectively filtering out "grue-like" predicates that rely on coincidental regularities.

  ### 2. Explicit Structural Priors as Rational Substitutes

  Can explicit structural priors substitute for linguistic entrenchment? **Yes, but they shift the justification from pragmatic to ontological.**

  Goodman argues that entrenchment is pragmatic: we use "green" because it is habit, not because it mirrors nature. However, in the context of engineering an agent to operate in a physical world, we can treat **structural priors as a proxy for physical law.**
  *   **Rationality of Substitution:** Linguistic entrenchment works because human language has evolved to track stable features of the environment. Explicit structural priors (e.g., convolutional translation invariance, equivariance to rotation, sparsity in causal graphs) attempt to hardcode those stable features directly. For a small model, this is not just a substitute; it is an improvement. It bypasses the need for statistical accumulation of "habit" by imposing mathematical constraints that reflect the assumed stability of the environment.
  *   **The "Projectibility" Constraint:** Goodman introduces the concept of *projectible* predicates. In small architectures, we cannot rely on the corpus to tell us which predicates are projectible. We must define projectibility structurally. A predicate is projectible if it supports counterfactuals. Therefore, structural priors should be designed to maximize the model's ability to answer "what if" questions (e.g., via causal representation learning). If a feature does not support causal intervention, it is "grue-like" and should be discarded.
  *   **Limitations:** The risk is that our structural priors might be wrong (i.e., the world is not stationary). However, without entrenchment, we have no choice but to hypothesize structure. The rational move is to choose priors that minimize regret in the widest class of stable environments (a minimax approach to induction).

  ### 3. The Legitimacy of Feature Learning

  Goodman's riddle casts doubt on the legitimacy of unconstrained feature learning. If any set of observations supports incompatible projections, then **feature learning without a constrained predicate space is epistemically unjustified.**

  *   **Constraining the Hypothesis Space:** In the absence of statistical tradition (pretraining), we cannot allow the model to search the space of all computable functions. Feature learning must be restricted to a subspace of "natural" functions. This implies that the architecture itself must define what counts as a valid feature. For example, a neural architecture that cannot easily represent discontinuous time-dependent functions (like "grue") without significant capacity cost effectively solves the riddle by making the "grue" solution inaccessible.
  *   **The Danger of Pure Optimization:** If a small model is trained purely to minimize empirical risk on a static dataset, it is rationally compelled to consider "grue" as equally valid as "green." Therefore, **loss minimization is insufficient.** We require a meta-objective that evaluates the *stability* of the learned features across hypothetical distribution shifts.
  *   **Entrenchment as a Regularizer:** In small models, we might need to simulate entrenchment. This could take the form of "semantic regularization," where features are penalized if they deviate from human-interpretable concepts (distilled from a larger model or knowledge graph). This re-introduces a form of external entrenchment without requiring massive pretraining of the target model itself.

  ### Summary

  Goodman's riddle demonstrates that **data does not dictate its own interpretation.** For small neural architectures, this means:

  1.  **Inductive Bias must be structural, not just statistical.** We must prioritize invariance and causality over simple fit.
  2.  **Structural priors are a valid substitute for entrenchment.** They replace historical frequency with mathematical necessity, assuming the environment obeys stable laws.
  3.  **Feature learning is illegitimate without constraints.** The space of learnable predicates must be architecturally restricted to exclude "gerrymandered" functions that rely on indexical coincidences.

  Ultimately, Goodman forces us to admit that induction is not a discovery of truth from data, but the imposition of a framework upon data. In small models, where the data cannot impose the framework via statistics, the engineer must explicitly encode the framework via architecture.
