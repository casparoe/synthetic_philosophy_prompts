      *   **Evidence:** Contrast how each treats the "Ought" and "Rationality."
      *   **Progress:** Cognitive architecture models (how habits become reasons) or decomposing "Norm."
      *   **Honesty:** The concept "Norm" is likely polysemous. The stall persists because both want a Unified Theory of Norms where none exists.

