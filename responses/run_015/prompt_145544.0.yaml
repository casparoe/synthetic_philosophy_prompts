prompt: |-
  So there's this long-running standoff between people who treat social norms as Lewis-style conventions -- coordination problems solved by common knowledge -- and people who treat them as evolved stable strategies where no agent represents the rule. The conventionalists keep saying evolutionary accounts miss the normative 'ought', and the evoltionists keep saying conventionalism sneaks in unrealistic rationality. Noone moves. My hunch is that it's not really about mechanisms but about whether we're asking for a justification story or a causal origin story, and both sides are just talking past each other under the word 'norm'. But maybe I'm wrong and there's a hiddne empirical question about whether people actualy compute common knowledge when they follow norms. I want a diagnosis of what kind of disagreement this is -- verbal, substantive, different questions, or bedrock intuitions about rationality -- supported by what each side actualy says. And given that diagnosis, what would count as progress? A model that separates 'commitment norms' from 'coordination norms'? A psychological result? Or should we just admit it's stuck because the concept does too much work? Don't survey every view; figure out the structure of the stall and be honest about whether anything could unstick it.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the User's Query:**
      *   **The Conflict:** Lewis-style Conventionalism (coordination, common knowledge, rational agents) vs. Evolutionary Game Theory (EGT) / Social Norms (evolved stable strategies, no representation, behavioral regularities).
      *   **The Complaint:** Conventionalists say EGT misses the "ought" (normativity). Evolutionists say Conventionalism assumes unrealistic rationality (cognitive load).
      *   **The User's Hunch:** It's not about mechanisms, but about *explanatory goals* (justification vs. causal origin). They are talking past each other under the word "norm."
      *   **Alternative Possibility:** There might be a hidden empirical question (do people actually compute common knowledge?).
      *   **The Task:** Diagnose the *type* of disagreement (verbal, substantive, different questions, bedrock intuitions). Support with what each side actually says. Propose what would count as progress (models, psych results, admitting defeat).
      *   **Constraint:** Don't survey every view. Figure out the *structure* of the stall. Be honest about unstickability.

  2.  **Analyze the Two Camps:**
      *   **Lewis-style Conventionalism:**
          *   *Core:* Norms are solutions to coordination problems.
          *   *Mechanism:* Rational choice, common knowledge of preferences and expectations.
          *   *Normativity:* Derived from rationality ("I ought to do X because it's in my interest given you do X, and we both know this").
          *   *Critique of EGT:* It describes behavior, not obligation. It explains why we *do*, not why we think we *should*.
      *   **Evolutionary/EGT Account:**
          *   *Core:* Norms are behavioral regularities sustained by selection pressures (cultural or genetic).
          *   *Mechanism:* Replicator dynamics, reinforcement learning, mimicry. No need for high-level reasoning.
          *   *Normativity:* Often treated as an illusion or a proximate mechanism (internalized sanctions).
          *   *Critique of Lewis:* Too intellectualist. People follow norms without calculating equilibria.

  3.  **Evaluate the User's Hunch (Justification vs. Causal Origin):**
      *   This is strong. Lewis is often doing *rational reconstruction* (how *could* a rational agent justify this?). EGT is doing *causal explanation* (how *did* this pattern emerge and persist?).
      *   However, both claim to explain "norms." If "norm" implies "ought," Lewis wins on definition but loses on psychology. If "norm" implies "regularity," EGT wins on psychology but loses on phenomenology.
      *   Is it merely verbal? Not entirely. It touches on the nature of human cognition.

  4.  **Evaluate the "Hidden Empirical Question" (Common Knowledge):**
      *   Do people compute common knowledge? Experimental game theory suggests bounded rationality. People use heuristics.
      *   But Lewisians can retreat: "Common knowledge is a theoretical limit, not a psychological process." (Similar to how economics treats *Homo Economicus*).
      *   So, empirical results might not kill Lewisianism, just force it to be less literal.

  5.  **Diagnose the Disagreement Type:**
      *   *Is it Verbal?* Partly. They define "norm" differently (Reason-based vs. Behavior-based).
      *   *Is it Different Questions?* Yes. Normativity/Justification vs. Genesis/Stability.
      *   *Is it Substantive?* Yes, regarding human cognitive architecture. Can normativity exist without representation?
      *   *Is it Bedrock?* Yes, regarding the nature of rationality (constitutive vs. instrumental).
      *   *Best Diagnosis:* It's a **Category Mistake / Explanatory Level Mismatch**. They are trying to solve different problems with the same label. The "stall" happens because each side claims their level is the *fundamental* one.

  6.  **Develop the Diagnosis (Drafting the Argument):**
      *   *The Stall:* The Conventionalist cares about the *logic* of obligation. The Evolutionist cares about the *dynamics* of compliance.
      *   *The "Ought":* For Lewis, 'ought' is hypothetical imperative (rationality). For EGT, 'ought' is a feeling produced by sanctions/internalization.
      *   *The "Rationality":* For Lewis, rationality is definition. For EGT, rationality is a costly cognitive tool, often bypassed.
      *   *Conclusion:* It's a **Level-of-Analysis Disagreement masquerading as an Ontological Disagreement.**

  7.  **Determine Paths to Progress:**
      *   *Option 1: Dual-Process Models.* System 1 (Evolutionary/Habit) vs. System 2 (Lewisian/Reasoning). This bridges the gap. Norms start as EGT, get rationalized as Lewis.
      *   *Option 2: Pluralism about "Norm".* Admit there are "Social Norms" (EGT) and "Moral/Conventional Norms" (Lewis-ish).
      *   *Option 3: Empirical.* Do people invoke common knowledge in high-stakes coordination? (Focal points).
      *   *Honest Assessment:* It won't fully unstick because "Norm" is a folk concept doing too much work. We need to decompose it.

  8.  **Refining the Output (incorporating constraints):**
      *   *Tone:* Analytical, philosophical but grounded.
      *   *Structure:* Diagnosis -> Evidence from sides -> Path to Progress -> Honest limitation.
      *   *Avoid:* Surveying Bicchieri vs. Boyd/Richerson in detail. Focus on the *structure*.
      *   *Key Insight:* The "Ought" is the pivot. Lewis derives it from rationality; EGT derives it from selection.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, does Lewis actually claim psychological reality?* Lewis (Convention) is ambiguous. Later Lewisians (Gilbert, Tuomela) make it more collective intentionality. The prompt specifies "Lewis-style conventions -- coordination problems solved by common knowledge." I should stick to the game-theoretic reading.
      *   *Is the user right about justification vs. origin?* Yes, but it's deeper. It's about *what constitutes a norm*. Is a norm a *reason* or a *cause*?
      *   *Progress:* A model that shows how EGT dynamics *generate* the cognitive structures required for Lewisian reasoning (evolution of rationality).

  10. **Final Plan:**
