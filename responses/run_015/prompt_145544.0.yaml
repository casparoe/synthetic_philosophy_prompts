answer: |-
  Your hunch is largely correct, but it needs a sharper edge. The stall isn't merely about "justification vs. origin"; it is a **category error regarding the ontological status of the "rule."**

  The disagreement is a **Functional Equivocation masked as an Ontological Dispute.** Both sides agree that norms solve coordination/stability problems, but they disagree on whether the *mechanism of stability* is part of the *definition of the norm*.

  Here is the diagnosis of the structure, the evidence from the sides, and the honest assessment of progress.

  ### 1. The Diagnosis: Explanatory Level Mismatch

  This is not a verbal dispute (they aren't just defining words differently for fun) nor a purely substantive empirical dispute (data alone won't fix it). It is a **Level-of-Analysis Disagreement.**

  *   **The Lewisian (Conventionalist)** is operating at the **Personal/Reason Level.** They are asking: "What constitutes a *reason* for an agent to comply?" For them, a norm *just is* a system of expectations and preferences that makes compliance rational. If the agent doesn't represent the rule, it's not a norm; it's a habit.
  *   **The Evolutionist (EGT)** is operating at the **Sub-Personal/Population Level.** They are asking: "What sustains the *pattern* of behavior over time?" For them, a norm *just is* a stable equilibrium. The agent's internal state is irrelevant black-boxing; if the behavior persists, the norm exists.

  **The Stall:** The Lewisian says the Evolutionist has eliminated the *normativity* (the "ought"). The Evolutionist says the Lewisian has invented a *ghost* (the "common knowledge representation") to explain a mechanical phenomenon. They are talking past each other because one is describing the **logic of compliance** and the other is describing the **dynamics of persistence.**

  ### 2. Evidence from the Sides

  You can see this structural mismatch in how they handle the two specific friction points you mentioned:

  **A. The "Ought" (Normativity)**
  *   **Lewisian:** The "ought" is derived from *instrumental rationality*. "I ought to drive on the right because I want to not crash, and I know you know I want to not crash." The normativity is internal to the reasoning process. If you remove the reasoning, you remove the obligation.
  *   **Evolutionist:** The "ought" is a *proximate mechanism* selected for stability. "I feel I ought to drive on the right because I have an internalized sanction (guilt) or fear of external sanction." The normativity is a causal lever, not a logical justification.
  *   **The Clash:** The Lewisian thinks the Evolutionist has reduced the "ought" to an "is" (a feeling). The Evolutionist thinks the Lewisian has mystified the "is" (a behavior) into an "ought" (a reason).

  **B. The "Rationality" (Cognitive Load)**
  *   **Lewisian:** Common knowledge is a **logical requirement**, not necessarily a psychological process. (Though many critics interpret it psychologically). They argue that even if I don't consciously calculate, my behavior must be *as if* I did for it to count as a convention.
  *   **Evolutionist:** This is **unrealistic intellectualism.** Most norms (queueing, dress codes) are followed via heuristics, mimicry, or reinforcement learning. Requiring common knowledge excludes 90% of actual social norms.
  *   **The Clash:** The Lewisian cares about *idealized stability conditions*. The Evolutionist cares about *actual acquisition and transmission*.

  ### 3. Is there a Hidden Empirical Question?

  You asked if there is a hidden empirical question about whether people compute common knowledge. **Yes, but it's the wrong lever to pull.**

  If psychologists prove people *don't* compute common knowledge, Lewisians will retreat to the "as-if" defense (standard in economics). If psychologists prove people *do*, Evolutionists will say, "Okay, reasoning is one selection pressure among many."

  The real empirical question is: **Does the *representation* of the rule causally contribute to the *stability* of the norm?**
  *   If norms collapse when people stop consciously endorsing them (e.g., political correctness shifts), the Lewisian has a point.
  *   If norms persist despite widespread private rejection (e.g., pluralistic ignorance, inefficient traditions), the Evolutionist wins.
  *   *Current Status:* Evidence suggests both exist. Some norms are reason-based; others are habit-based. This suggests the stalemate is due to **over-generalization.**

  ### 4. What Would Count as Progress?

  To unstick this, we need to stop trying to find the *One True Theory of Norms*. Progress requires **decomposition.**

  **A. A Dual-Process Model of Normativity (Most Promising)**
  Progress looks like a model that integrates both:
  1.  **System 1 Norms (Evolutionary):** Fast, automatic, sanction-driven, low-representation. (e.g., standing on the right side of the escalator).
  2.  **System 2 Norms (Lewisian):** Slow, reason-based, common-knowledge dependent. (e.g., constitutional rules, explicit agreements).
  *   *Progress Condition:* A model showing how System 1 habits can be "scaffolded" into System 2 reasons (and vice versa). For example, an evolved bias creates a regularity, which agents then rationalize into a Lewisian convention to stabilize it against deviation.

  **B. Distinguishing "Regularity" from "Requirement"**
  We need to linguistically separate the phenomena.
  *   Call the EGT account **"Social Equilibria."**
  *   Call the Lewis account **"Conventional Obligations."**
  *   *Progress Condition:* Admitting that "Social Equilibria" can exist without "Conventional Obligations." This dissolves the "missing ought" complaint by admitting EGT isn't trying to explain the "ought," it's explaining the "is."

  **C. The "Common Knowledge" Threshold**
  Empirical work determining the *minimum* cognitive threshold required for a norm to be resilient to shock.
  *   *Progress Condition:* Showing that "Common Knowledge" is not binary but a gradient of shared intentionality. If we can measure "degrees of common knowledge," we can map where Lewisian logic applies and where Evolutionary dynamics take over.

  ### 5. Honest Assessment: Will it Unstick?

  **Probably not fully.** Here is the hard truth:

  The concept "Norm" is a **folk psychological kind** that does too much work. It tries to capture:
  1.  Statistical regularity (what people do).
  2.  Social pressure (what people enforce).
  3.  Internal obligation (what people feel).
  4.  Rational justification (what people reason).

  The Lewisian wants to define "Norm" by #4 (which implies #2 and #3).
  The Evolutionist wants to define "Norm" by #1 (which explains #2 and #3 as mechanisms).

  **The stall persists because both sides want a Unified Theory.** They want one framework to explain why people queue (habit) *and* why people keep promises (reason).

  **The Verdict:**
  The disagreement is a **Category Mistake regarding the scope of the theory.**
  *   **If you want to explain stability:** The Evolutionist is right.
  *   **If you want to explain obligation:** The Lewisian is right.

  **Progress will only happen if we admit that "Norm" is not a natural kind.** We need to stop asking "Which theory is right?" and start asking "Which theory applies to *this specific class* of normative phenomena?"

  Until philosophers and social scientists agree to **pluralism**—admitting that some norms are Lewisian conventions and others are Evolutionary equilibria—the standoff will remain. The "hunch" that they are asking different questions is the solution, but the discipline refuses to accept the split. They want the "Ought" to emerge from the "Is," and neither side has succeeded in bridging that gap without smuggling in premises the other side rejects.
