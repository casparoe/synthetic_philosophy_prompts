answer: |-
  # Seminar Activity: The Utility Trap
  **Course:** Philosophy of Economics (Upper-Level Undergraduate)
  **Time:** 90 Minutes
  **Class Size:** 15 Students (5 Groups of 3)
  **Materials:** 6 Physical Items, Projector, Whiteboard, Printed Sheets (A, B, C), Envelopes.

  ---

  ## Part 1: The Six Items (The "Goods")
  To maximize the likelihood of preference reversals (violations) without explicit instruction, the items are selected to create conflicting attribute trade-offs (Hedonic vs. Practical).

  1.  **Dark Chocolate Bar** (High Taste / Low Utility)
  2.  **Premium Gel Pen** (Low Taste / High Utility)
  3.  **Gourmet Cookie** (Med Taste / Perishable)
  4.  **Pocket Notebook** (Low Taste / High Utility / Bulky)
  5.  **Dried Mango Pack** (Med Taste / "Healthy" / Small)
  6.  **Highlighter Set** (Low Taste / Med Utility / Common)

  *Instructor Note: Place these on a table at the front. Project a slide with their names and a simple 1-5 star rating for "Taste" and "Usefulness" to standardize the attributes during choice rounds.*

  ---

  ## Part 2: The Record Sheets

  **Sheet A (Private Preference & Intensity)**
  *Instructions: Do not show this to anyone. Seal it in the provided envelope when finished.*
  1.  Rank the 6 items from 1 (Most Desired) to 6 (Least Desired).
  2.  For each item, rate your **Intensity of Desire** from 0 (Indifferent) to 10 (Desperate).
      *   *Item 1: Rank __ / Intensity __*
      *   *Item 2: Rank __ / Intensity __*
      *   *(...through Item 6)*

  **Sheet B (Choice Log)**
  *Instructions: Record the Menu presented and the Single Item you choose.*
  *   Round 1: Menu {__, __} → Choice: ___
  *   Round 2: Menu {__, __, __} → Choice: ___
  *   Round 3: Menu {__, __} → Choice: ___
  *   Round 4: Menu {__, __, __} → Choice: ___
  *   Round 5: Menu {__, __, __, __} → Choice: ___

  **Sheet C (Utility Construction)**
  *Instructions: Assign a number U(x) to each item such that your Choices on Sheet B maximize U in every round.*
  *   U(Item 1) = ___
  *   U(Item 2) = ___
  *   *(...through Item 6)*
  *   *Does this function fit all your choices? [ ] Yes [ ] No*

  ---

  ## Part 3: Minute-by-Minute Plan

  ### Phase 1: Elicitation (00:00 – 00:20)
  *   **00:00 – 00:05 (Setup):** Distribute Sheet A and envelopes. No talking. Project the 6 Items with attributes.
      *   *Script:* "Rank these privately. Then rate how strongly you want them. Seal Sheet A. Do not open it again until I tell you."
  *   **00:05 – 00:15 (Choice Rounds):** Distribute Sheet B. Project menus one by one. Give 60 seconds per round. Emphasize speed.
      *   *Script:* "Choose the one you actually want. Do not overthink. You will receive one of these choices for real."
      *   **Menu Schedule (Designed for Violations):**
          1.  {Chocolate, Pen} *(Base Trade-off)*
          2.  {Pen, Notebook, Highlighter} *(Practical Cluster)*
          3.  {Chocolate, Cookie, Mango} *(Snack Cluster)*
          4.  {Chocolate, Pen, Cookie} *(Chocolate & Pen together + Decoy-ish Snack)*
          5.  {Chocolate, Pen, Notebook, Mango} *(Full Trade-off)*
      *   *Design Logic:* Rounds 1 and 4 both feature {Chocolate, Pen}. If a student picks Chocolate in R1 (mood: treat) but Pen in R4 (mood: practical because Notebook is present), that is a context violation (WARP failure). Rounds 2 & 3 isolate sub-domains to encourage framing.
  *   **00:15 – 00:20 (Stakes):** Draw a number (1-5) from a hat. This is the "Paying Round."
      *   *Action:* Students who chose Item X in that round receive Item X immediately. (Have duplicates ready or promise delivery).
      *   *Script:* "This is real. Keep your Sheet B."

  ### Phase 2: The Utility Fit (00:20 – 00:45)
  *   **00:20 – 00:35 (Group Work 1):** Form 5 groups of 3. Compare Sheet B logs.
      *   *Task:* "On Sheet C, assign numbers to the 6 items so that every choice your group members made looks like maximizing that number. Higher number = chosen."
      *   *Constraint:* "The number must belong to the *Item*, not the round."
  *   **00:35 – 00:45 (The Failure):** Groups report.
      *   *Expected Outcome:* At least 2 groups will find they cannot fit the numbers (e.g., Student 1 chose Choc > Pen in R1, but Pen > Choc in R4).
      *   *Board Work:* Write the conflicting choices on the board. "Choc > Pen" and "Pen > Choc".
      *   *Script:* "If utility is a property of the item, this is impossible. Who found this?"

  ### Phase 3: The Bookkeeping Rescue (00:45 – 00:60)
  *   **00:45 – 00:50 (The Rule Change):**
      *   *Script:* "Okay. New rule. You are allowed to assign utility to the *Item-in-the-Menu*. U(Chocolate, Round 1) can be different from U(Chocolate, Round 4)."
  *   **00:50 – 00:60 (Group Work 2):**
      *   *Task:* "Fix your utility functions."
      *   *Observation:* Every group will finish instantly. It is trivially easy.
      *   *Script:* "Look at how fast that was. What did we just buy with that rule change?"

  ### Phase 4: Ordinality & Intensity (00:60 – 00:75)
  *   **00:60 – 00:65 (Comparison):** Focus on groups that *did not* have violations (or fixed them).
      *   *Task:* "Compare your utility numbers with another group. Do you have the same numbers?"
      *   *Expected:* Group A has {10, 8, 5...}, Group B has {100, 50, 10...}. Rankings match, numbers differ.
      *   *Script:* "Who is right? Can the choice data tell you?"
  *   **00:65 – 00:75 (The Reveal):** Open Sheet A (Sealed Intensity).
      *   *Task:* "Check your Intensity ratings against your Utility numbers. Do the gaps match?"
      *   *Expected:* Student chose Chocolate (Intensity 10) over Pen (Intensity 9). Utility fit might assign Choc=100, Pen=1. The gap is not preserved.
      *   *Script:* "The choice record forgot how much you cared."

  ### Phase 5: The Welfare Sting (00:75 – 00:90)
  *   **00:75 – 00:85 (Policy Decision):**
      *   *Scenario:* "The department will only stock 3 of these 6 items for next year's seminar. You must choose the 3 that maximize class welfare."
      *   *Data:* You have everyone's Rankings (Ordinal). You do *not* have Intensity (Cardinal).
      *   *Task:* Half the class argues for Set X, half for Set Y.
      *   *Trap:* Group 1 uses **Borda Count** (Sum of Ranks). Group 2 uses **Plurality** (Count of 1st Place votes). These will yield different sets of 3.
      *   *Example:* Chocolate might be everyone's 2nd choice (High Welfare, Low Plurality). Pen might be half the class's 1st choice, half's 6th choice (Polarizing).
  *   **00:85 – 00:90 (Final Debrief):** (See below).

  ---

  ## Part 4: The Debrief Guide (Philosophical Mapping)

  *Do not lecture. Ask questions that force them to state these conclusions.*

  1.  **On Empirical Content (Phase 2 Failure):**
      *   *Ask:* "When you couldn't fit the numbers, what was failing? Your rationality, or the model?"
      *   *Point:* The claim "Choice maximizes Utility" has empirical content *only if* Utility is stable across menus. The violation shows the theory *could* be false. That makes it science.

  2.  **On Bookkeeping (Phase 3 Rescue):**
      *   *Ask:* "When I allowed menu-dependent utility, could you have been wrong?"
      *   *Point:* No. A theory that fits any data explains no data. We saved the theory by emptying it of content. This is the "Tautology Trap" of revealed preference.

  3.  **On Ordinality (Phase 4 Comparison):**
      *   *Ask:* "Group A said Chocolate is '10 points' better. Group B said '1 point' better. Both fit the choices. Which is true?"
      *   *Point:* Utility numbers are arbitrary scales (like Celsius vs. Fahrenheit). Only the *ordering* is revealed by choice. The *magnitude* is not.

  4.  **On Intensity (Phase 4 Reveal):**
      *   *Ask:* "Did your Utility numbers match your Sealed Intensity sheet?"
      *   *Point:* Choice reveals preference ordering, not strength of desire. Welfare economics often needs strength. Choice data alone cannot provide it.

  5.  **On Welfare (Phase 5 Sting):**
      *   *Ask:* "You had all the choice data. Why couldn't you agree on the 3 items?"
      *   *Point:* Interpersonal welfare comparison requires cardinal utility. Ordinal rankings (choice data) are insufficient for policy. You were guessing, not calculating.

  ---

  ## Part 5: Honest Account of Risks & Limitations

  ### Predictable Failures & Mitigations

  1.  **The "Too Rational" Class:**
      *   *Risk:* Philosophy students, warned about consistency, may deliberate hard and produce no violations.
      *   *Mitigation:* If no group finds a violation, do not panic. Hand out a **"Guest Student Data Sheet"** (pre-prepared with a cycle: A>B, B>C, C>A). Say: "Suppose a student gave us this. Does your utility function work?" Proceed with the argument using the hypothetical data. The logical point holds even if the empirical data was too clean.

  2.  **The "Gaming" Student:**
      *   *Risk:* A student realizes the trap and forces consistency to "win."
      *   *Mitigation:* Emphasize in Phase 1: "This is not a logic test. If you lie about what you want, you might get an item you hate." The real stake (receiving the item) discourages gaming.

  3.  **Premature Menu-Utility:**
      *   *Risk:* A student says, "Maybe I just want the chocolate more on Tuesdays" (context) during Phase 2.
      *   *Mitigation:* Shut this down firmly. "For Phase 2, the rules of the game are: Utility belongs to the Object. Period." Save their insight for Phase 3 so the "Aha!" moment lands.

  4.  **The Welfare Deadlock:**
      *   *Risk:* In Phase 5, groups might just compromise rather than disagree.
      *   *Mitigation:* Assign roles. "Group 1 & 2 must argue for the 'Majority Rule' method. Group 3 & 4 must argue for the 'Average Rank' method." Force the conflict.

  ### Explicit Limitations (What You Must Assert)

  This activity stages the *logic* of revealed preference, but it cannot stage the *metaphysics*. You must explicitly state the following in the final 5 minutes, as the activity cannot demonstrate them:

  1.  **Risk and Uncertainty:**
      *   *Limitation:* We chose between certain items. We did not choose between lotteries.
      *   *Assertion:* "Under uncertainty, ordinal utility is not enough. To model risk, utility *must* be cardinal (Von Neumann-Morgenstern). We didn't touch that today, but it's why economists fight about whether utility is 'real'."

  2.  **Preference as Cause vs. Redescription:**
      *   *Limitation:* The activity treats preference as a number we fit to choice.
      *   *Assertion:* "Did the utility number *cause* you to pick the chocolate? Or is it just a description of the fact that you picked it? Revealed preference often slides from 'we can model this' to 'this caused this'. Be wary of that slide."

  3.  **External Validity (Snacks vs. Policy):**
      *   *Limitation:* These are low-stakes snacks.
      *   *Assertion:* "You might be inconsistent over candy but consistent over careers. Or vice versa. Nothing we learned here proves people are irrational about health, justice, or money. Do not generalize the psychology beyond the stakes."

  4.  **The Normative Leap:**
      *   *Limitation:* Phase 5 showed we *can't* maximize welfare.
      *   *Assertion:* "Economists often proceed anyway. They assume intensity is equal across people, or they ignore it. Knowing that this assumption is *not* in the data is the most important thing you take away."
