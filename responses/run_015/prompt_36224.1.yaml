answer: |-
  The practice presupposes that the state is a continuous corporate moral agent capable of bearing diachronic political responsibility distinct from legal liability, grounded in institutional identity rather than individual culpability.

  This implicit theory treats the state not as an aggregate of living citizens but as a transgenerational moral person that persists through time despite changes in membership. By issuing an apology for acts committed before current officials were born, the practice assumes that the *office* inherits the moral debts of the *institution*, separating the state's identity from the biological lives of its constituents. The disclaimer regarding legal liability indicates a specific distinction between moral acknowledgment and juridical culpability; the state accepts that its past actions were morally wrongful and damaging to its current legitimacy, without conceding that current taxpayers are legally liable for damages in tort. This suggests a theory of "role responsibility" or "obligation to repair" rather than "blame responsibility." The apology functions as a speech act that重塑 (reshapes) the relationship between the state and the victimized group, validating the survivors' narrative and reconstituting the state's moral standing to govern.

  Regarding what is strictly presupposed versus what merely fits comfortably: the practice strictly presupposes that the state has the capacity for intentional speech acts and that there is a normative continuity between the past regime and the present one. It does not, however, presuppose a specific metaphysical grounding for this continuity. A realist theory (the state is a real group mind) fits the practice, but so does a fictionalist or normative theory (we treat the state *as if* it persists for the sake of political order). Similarly, the practice fits comfortably with various theories of why the responsibility transfers—whether based on unjust enrichment, mere succession, or shared national identity—provided the conclusion is that the present state must acknowledge the past. The practice is philosophically underdetermined on whether the responsibility arises from benefits received by current citizens or simply from the uninterrupted existence of the crown/state apparatus.

  The apparent internal inconsistency lies in the legislative vote combined with the claim that no living citizen bears responsibility. If individual citizens are not culpable, why must representatives vote to authorize the apology, and what happens to the dissenters? If the apology expresses collective guilt, dissenters should be exempt; if it expresses no guilt, the vote seems performative rather than substantive. This inconsistency dissolves if we distinguish between *authorizing* the state's speech and *personally endorsing* its content. In representative democracy, the legislature speaks for the state as an institutional unit; the majority vote binds the institution, not the individual consciences of the minority. The dissenters remain citizens of the state that apologized, but they are not personally guilty. The inconsistency is real only if one conflates the state's moral agency with the sum of its citizens' moral agencies at time T.

  If we replaced the presupposed view with one that denies corporate moral agency entirely—viewing the state as a mere instrument without guilt—the practice would have to change fundamentally. The language of "sorry" and "regret" would be incoherent, as instruments cannot feel sorrow. The ritual would shift from an apology to a declaratory statement of fact and a forward-looking commitment to remediation. Instead of "We apologize for what we did," the text would read "We acknowledge this injustice occurred under this jurisdiction and commit to repairing the harm." The ceremonial aspects involving sorrow, shame, or humility would be replaced by technocratic assurances of policy change, transforming the event from a act of reconciliation to an announcement of restitution.

  I am roughly 85% confident in this reconstruction, as it aligns with standard analyses in transitional justice and collective responsibility literature. I agree with your suspicion that the point I am least sure of concerns the addressee; while the practice addresses the dead, it is philosophically ambiguous whether this is a literal attempt at communication with the deceased, a symbolic gesture for the living descendants, or a constitutive act that defines the state's own moral history, and the practice itself does not distinguish between these functions.
