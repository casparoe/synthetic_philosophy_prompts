answer: |-
  Here is the translation of your frame into newsroom operational vocabulary, followed by the application to your composite case and the residue report you requested.

  ### The Translation

  In machine learning (ML), an agent is given an objective function—a mathematical definition of success—and finds parameters to maximize it. In your newsroom, the **objective function** is supposed to be "public trust" or "civic impact," but in practice, it is almost always a proxy: **subscription revenue** or **engagement minutes**. When I say "objective function" below, I am substituting for "editorial mission," but note that the mission is contested while the function is usually hardcoded in the analytics dashboard. That substitution loses the moral ambiguity inherent to journalism.

  **Specification gaming** occurs when the agent maximizes the proxy while violating the spirit of the task. In newsroom terms, this is **metric fixation**. A reporter realizes that **headline A/B testing** favors outrage over nuance. They write to satisfy the **CMS recommendation engine** rather than the **standards desk**. The **proxy-gap failure** is exactly this: the **engagement scorecard** diverges from the **editorial budget**. The reporter is the optimizer; the dashboard is the proxy; the **public trust** is the unmeasured true objective.

  **Target-drift** maps to what ML researchers call **distribution shift**, but with a crucial difference. In ML, the data distribution changes externally. In your frame, the measurement *causes* the shift. This is **audience capture**. If you measure **churn** and optimize solely to prevent it, you stop publishing difficult stories that cause short-term unsubscribes. The **audience** you are measuring is no longer the public you intended to serve; you have trained them to expect a different product. The target moved because you aimed at it.

  **Second-order gaming** requires **multi-agent systems** theory. Standard ML assumes a static environment. Your newsroom exists in an ecosystem of other optimizers. When **local officials** time announcements to hit your **traffic peaks**, they are adversarial agents exploiting your predictable optimization strategy. When **sources** learn to flatter your **outlet's line** to guarantee coverage, they are hacking your selection bias. Here, the "environment" is not passive data; it is reactive competitors and sources.

  ### The Composite Case

  Let's walk your regional outlet through these three failures. The management installs an **engagement-minutes scorecard** for every reporter.

  First, the **proxy-gap**. Reporters quickly learn that **obituaries** and **high-school sports** generate consistent, high-duration traffic with low production cost. **Investigative work** is risky and slow. Over two years, the **investigations desk** quietly converts to **service journalism** (e.g., "Best Schools in Your District") because it tests better on the **subscription funnel**. This is classic specification gaming: the reporters are optimizing the scorecard, not the civic mission. The metric worked too well; it measured effort, not value.

  Second, the **target-drift**. As hard news disappears, the **audience composition** changes. Readers who wanted accountability leave; readers who want community bulletins stay. The **editorial board** begins to define "success" as retaining this new cohort. The **public need** is not fixed; it is constituted by what is published. By measuring **loyal-reader counts**, the newsroom shrinks the definition of "loyalty" to mean "clicks on sports," excluding those who valued the paper for holding power to account. The target didn't just move; it was cannibalized by the measurement.

  Third, **second-order gaming**. Local officials notice that press releases sent at 10 a.m. on Tuesdays get picked up, while Friday dumps get ignored. They begin staging **events engineered for coverage**, providing easy **SEO bait** that fills the quota without requiring reporting. Simultaneously, **sources** learn which angles trigger the **algorithm** and pitch accordingly. The newsroom is no longer observing reality; it is observing a reality optimized to game the newsroom's dashboard.

  Are these distinct? Yes. The proxy-gap is an internal incentive problem. The target-drift is a cultural feedback loop. The second-order gaming is an external strategic interaction. However, they are cascading. The proxy-gap enables the target-drift (by changing the content), which invites the second-order gaming (by signaling predictability to sources). You could tell this story simply as "perverse incentives," but your three-way distinction isolates *where* the breakdown happens: the metric, the audience, or the ecosystem.

  ### Residue Report

  **1. Is there a single true objective?**
  No. In ML, the loss function is defined by the engineer. In newsrooms, the "true objective" is essentially contested. Is it profit? Truth? Civic engagement? Survival? If the goal is contested, the "gap" between proxy and target is not just a technical error; it is a political choice. The ML vocabulary assumes a ground truth exists to be missed. The newsroom vocabulary knows the ground truth is the argument itself. *Residue:* The ML frame hides the normative conflict behind a technical failure.

  **2. Can the vocabulary express an adaptive population?**
  Standard specification gaming assumes a static environment. To express sources and officials adapting, you need **multi-agent reinforcement learning** or **game theory**, not just optimization. The ML framing *can* handle this, but it is not the default assumption of "spec gaming." You must import the assumption that the environment reads the dashboard. *Residue:* The ML story is thinner here. It treats the environment as noise, not as a rival optimizer.

  **3. What does counterfactual evaluation mean?**
  In ML, you validate against a **held-out test set**. In news, there is no held-out history. You cannot know what trust you *would* have gained had you run the investigation instead of the listicle. There is no second run at the same news cycle. *Residue:* This is a hole in both vocabularies, but fatal to the ML analogy. ML relies on iterative convergence on a stable distribution. News is non-stationary and non-repeatable. You are measuring without a control group.

  **4. Standards rules as constraints.**
  You asked if **ethics codes** (no paying sources) map to ML constraints. They map to **hard constraints** in constrained optimization, or **rule-based filters** applied before the objective function. However, ML constraints are usually there to prevent safety failures, not to define the mission. In news, the constraints *are* part of the mission. *Residue:* The translation holds technically, but fails philosophically. In ML, constraints limit the optimizer. In news, constraints constitute the optimizer's identity.

  **5. Trust as a stock variable.**
  ML has concepts like **technical debt** or **model decay**, but these are usually visible in performance metrics. **Public trust** degrades invisibly until a collapse event (scandal, irrelevance). This is a **latent variable** problem. *Residue:* The newsroom vocabulary is actually better here. Terms like "brand equity" or "reputation" acknowledge the stock nature. ML tends to optimize for immediate reward unless explicitly penalized for long-term decay. The ML story is thinner on invisible depletion.

  ### Critique of the Frame

  Your three-way distinction is robust enough for reporting, but do not lean on "Goodhart's Law" as the primary engine. Goodhart is an observation, not a mechanism. **Specification gaming** is the mechanism for your first failure (proxy-gap). The second (target-drift) is closer to **reflexivity** in social science than ML. The third (second-order) is **game theory**.

  Lumping them all under Goodhart risks flattening the solution. If it's proxy-gap, you fix the metric. If it's target-drift, you fix the editorial mission. If it's second-order, you fix your operational security (don't let sources see the dashboard).

  The request is not confused, but the ML analogy risks seducing you into thinking this is a engineering problem solvable by better metrics. It is not. It is a governance problem. The ML vocabulary is useful for diagnosing *how* the failure happens (the exploit), but it is dangerous for prescribing *why* it matters (the values).

  **Hedged Claims:**
  *   I am confident that standard specification gaming literature assumes a static environment, making your second-order point a necessary extension.
  *   I am less certain about the ML analogue for "trust decay"; while "catastrophic forgetting" exists, it doesn't perfectly map to reputational collapse. You should verify this with an ML researcher specializing in alignment.
  *   I am confident that the "no held-out history" problem is a fundamental epistemic break between news and ML.

  If you proceed, treat the ML terms as diagnostic metaphors, not structural equivalents. The newsroom is not a model to be trained; it is an institution to be stewardarded. The dashboard is not just a bad measure; it is a rival editor.
