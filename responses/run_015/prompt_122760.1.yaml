prompt: |-
  Okay, so I've been chewing on the evidential cooperation in large worlds idea: the claim that in a world big enough that your decision procedure is shared by or correlated with a great many other agents facing similar choices, an evidential decision theorist gets real reason to cooperate in one-shot anonymous dilemmas even with no causal influence, reputation, or enforcment. I find it attractive, but I want it stress-tested. Tell me what would actually count against this: which empirical findings, arguments, formal results, or thought-experimental developments should move me, and sort them from fatal to merely akward. Say what a fan of the view would themselves concede as a genuine defeater, not just what a causal-decision-theory critic would say, and be honest about whether the view has been qualified so much (say, any failed case just wasn't large or similar enough) that it has become unfalsifiable—and if so, whether that is a fatal problem or just the normal fate of a framework. I also want to know what it predicts that its main rivals do not. Personally, I'd be most moved by a case where the world is clearly large and the agents clearly similar, yet cooperation still looks unjustified. Finally, say how confident you are in what you claim and single out the point you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Core Claim:** In a sufficiently large/correlated world, Evidential Decision Theory (EDT) recommends cooperation in one-shot anonymous dilemmas (like Prisoner's Dilemma) because your decision is evidence of others' decisions, even without causal links.
      *   **Task:** Stress-test the idea.
      *   **Requirements:**
          1.  List empirical findings, arguments, formal results, or thought experiments that count against it.
          2.  Sort them from "Fatal" to "Merely Awkward."
          3.  Focus on what a *fan* of the view would concede as a defeater (internal critique), not just external CDT criticism.
          4.  Address unfalsifiability/qualification concerns.
          5.  Identify unique predictions compared to rivals (CDT, FDT).
          6.  Provide a specific "killer case" (large world + similar agents + cooperation unjustified).
          7.  State confidence levels and identify the point of least certainty.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *What is ECL?* It's associated with Oesterheld, Conitzer, MacAskill, etc. It relies on EDT + the assumption that the universe is large (infinite or vast) and contains many copies/correlated agents.
      *   *Key Mechanism:* If I cooperate, it's evidence that other copies of me (or agents with similar decision procedures) cooperate. If there are enough of them, the aggregate benefit outweighs my local cost.
      *   *Rivals:* Causal Decision Theory (CDT) says defect (no causal link). Functional Decision Theory (FDT) says cooperate (logical correlation). EDT is the specific lens here.
      *   *Critiques:* "Why aren't we rich?" (Newcomb-like problems), reference class problems, spurious correlations, the "tickle" defense, infinite ethics issues.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the premise. It's a niche but serious topic in decision theory (Greaves, MacAskill, Oesterheld).

      *   **Category 1: Fatal Defeaters (Internal/Structural):**
          *   *The Reference Class Problem:* This is the big one. How do you define "similar enough"? If I can gerrymander the reference class to make cooperation look good or bad, the theory loses action-guiding force. A fan must admit that without a principled way to define correlation, ECL is arbitrary.
          *   *Spurious Correlations (The Common Cause Problem):* EDT is notorious for conditioning on common causes (e.g., smoking lesion). If the correlation between me and others is due to a common cause that *also* determines the payoff structure independently, EDT might get it wrong. A fan needs a way to distinguish "logical correlation" from "spurious statistical correlation."
          *   *Infinite Ethics/Measure Problems:* If the world is *too* large (infinite), standard expected utility breaks down. If there are infinite cooperators and infinite defectors, how do I weigh my impact? This threatens the mathematical foundation.

      *   **Category 2: Serious Embarrassments (Empirical/Practical):**
          *   *Lack of Empirical Evidence for Correlation:* Do we actually see mass correlation in anonymous one-shot games? Experimental economics usually shows *some* cooperation, but not the level ECL requires to outweigh costs in high-stakes scenarios. If the correlation coefficient is low, ECL collapses to CDT.
          *   *The "Why Aren't We Rich?" Argument (Applied to ECL):* If ECL works, why aren't we seeing massive coordination effects in history? (Though FDT handles this better, EDT fans need an answer).

      *   **Category 3: Merely Awkward (Qualifications):**
          *   *Computational Intractability:* Calculating the degree of correlation is hard.
          *   *Double Counting:* If everyone thinks this way, are we counting the same utility multiple times?

      *   **Unfalsifiability Check:**
          *   Is it "No true Scotsman"? "If cooperation didn't pay off, the world wasn't large/correlated enough."
          *   *Verdict:* It risks unfalsifiability if "correlation" isn't defined independently of the decision. A fan must concede that if we can measure correlation *ex ante* and it's low, ECL must recommend defection.

      *   **Unique Predictions:**
          *   ECL predicts cooperation *even when* you know you are not causally linked, provided statistical correlation exists.
          *   CDT predicts defection.
          *   FDT predicts cooperation based on *logical* similarity, not just statistical evidence.
          *   *Distinction:* ECL is more fragile than FDT regarding spurious correlations.

      *   **The "Killer Case":**
          *   Need: Large World + Similar Agents + Cooperation Unjustified.
          *   *Idea:* A scenario where the correlation is statistically robust but *causally irrelevant* in a way that intuition screams "don't count this."
          *   *Example:* The "Psychic Predictor" or "Common Genetic Trait" case. If a gene makes me cooperate and makes others cooperate, but the payoff depends on a separate mechanism, EDT says cooperate. But if the gene *also* makes me susceptible to a scam...
          *   *Better Example:* The "Spurious Astrological Correlation." Suppose everyone born on a Tuesday cooperates. I am born on a Tuesday. My cooperation is evidence others born on Tuesday cooperate. But there's no mechanism. ECL says cooperate. Intuition says this is magic thinking. If the fan says "That's not a valid reference class," they risk unfalsifiability.

      *   **Confidence & Uncertainty:**
          *   High confidence on the Reference Class problem being the weak point.
          *   Low confidence on the resolution of Infinite Ethics in this context.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I distinguish ECL from FDT. FDT (Yudkowsky/Soares) is often seen as the modern successor to this line of thinking. ECL specifically leans on *evidential* probability.
      *   *Nuance:* A fan of ECL (like Oesterheld) would argue that "similarity" is about the *algorithm*, not just surface traits. I need to represent that steelman.
      *   *Defeater:* The strongest internal defeater is the "Tickle Defense" or the ability to screen off the correlation. If I know my own decision procedure, does learning my decision add evidence?
      *   *Unfalsifiability:* This is crucial. If every failure of cooperation is explained away by "insufficient correlation," the theory is empty. I need to press on whether correlation can be measured *independently*.

  5.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical, not dismissive.
      *   Check all constraints of the prompt are met (sorting, fan concession, predictions, confidence).
      *   *Specific focus:* The prompt asks for "what a fan... would themselves concede." I must frame the objections as things a proponent would acknowledge as dangerous, not just CDT detractors shouting "magic!"

  6.  **Final Review against constraints:**
      *   Fatal to Awkward sorting? Yes.
      *   Fan concession focus? Yes.
      *   Unfalsifiability addressed? Yes.
      *   Unique predictions? Yes.
      *   Killer case? Yes.
      *   Confidence/Uncertainty? Yes.

      *(Self-Correction on "Killer Case")*: The prompt asks for a case where the world is *clearly large* and agents *clearly similar*, yet cooperation looks unjustified.
      *   *Scenario:* A universe with infinite copies of me. But the payoff structure is such that my copy's action is correlated with mine, *but* the value of their outcome is negligible or negative to my values (e.g., they are suffering, or their utility function is inverted).
      *   *Better Scenario:* The "Betting on the Past" style case. If the correlation is established by a predictor who punishes ECL reasoners specifically.
      *   *Best Scenario:* The "Spurious Common Cause" where the correlation is real but intuitively irrelevant. E.g., a deterministic universe where my decision and theirs are correlated by initial conditions, but the causal graph shows no path. EDT says cooperate. CDT says defect. If the correlation is *only* due to a common cause that doesn't imply logical identity, is it rational? A fan might concede that if the correlation isn't "decision-relevant," ECL fails.

      *Let's settle on the "Reference Class Gerrymandering" as the fatal flaw, and the "Spurious Correlation" as the killer case.*

  7.  **Drafting the Response.** (Proceeds to generate output based on these thoughts).
answer: |-
  This is a sophisticated corner of decision theory, often associated with the work of Caspar Oesterheld, Vincent Conitzer, and William MacAskill. The core intuition is that if the universe is vast (or infinite), there are likely many agents running the same decision algorithm as you. Under Evidential Decision Theory (EDT), your choice provides evidence about their choices. If the aggregate benefit of their cooperation outweighs your local cost of cooperating, EDT recommends cooperation even in a one-shot Prisoner's Dilemma without causal contact.

  Here is a stress-test of Evidential Cooperation in Large Worlds (ECL), sorted by severity, focusing on concessions a proponent would have to make.

  ### I. The Hierarchy of Defeaters

  #### 1. Fatal: The Reference Class Problem (The "Gerrymandering" Objection)
  **The Argument:** ECL relies entirely on the probability $P(\text{Other Cooperates} | \text{I Cooperate})$. This probability depends on how you define the reference class of "other agents." If you define the class narrowly (e.g., "agents exactly identical to me down to the quantum state"), the correlation is high, but the number of agents is low. If you define it broadly (e.g., "all rational agents"), the number is high, but the correlation drops.
  **Why a Fan Concedes:** A proponent must admit that without a principled, non-arbitrary metric for "decision-relevant similarity," ECL is action-guiding only if you already know the answer. If I can tweak the reference class to make cooperation maximize expected utility, the theory allows me to "vote" for any outcome by selecting the right group of correlated agents.
  **Status:** **Fatal.** If the theory cannot specify *which* correlations count without circularity (i.e., "count the correlations that make cooperation right"), it loses normative force.

  #### 2. Fatal: Spurious Correlations (The "Common Cause" Trap)
  **The Argument:** EDT is historically vulnerable to scenarios where a common cause creates a correlation between an act and a desirable outcome without the act influencing the outcome (e.g., the Smoking Lesion problem). In ECL, suppose a cosmic ray burst causes both my brain to lean toward cooperation and distant aliens' brains to lean toward cooperation, but the aliens' cooperation does not benefit me (or benefits a rival value system). EDT sees the correlation and says "Cooperate."
  **Why a Fan Concedes:** A fan must concede that not all statistical correlations are decision-relevant. If the correlation is merely due to a shared environmental cause rather than shared *algorithmic structure*, ECL yields the wrong result. Distinguishing "logical correlation" from "spurious statistical correlation" within pure EDT is notoriously difficult without importing causal machinery (which moves the view toward FDT or CDT).
  **Status:** **Fatal.** It suggests ECL is an incomplete formalism that requires causal constraints to function, undermining its claim to be a pure evidential account.

  #### 3. Serious: The Measure Problem in Infinite Ethics
  **The Argument:** ECL usually assumes a "large world," often implying an infinite or unbounded universe. In infinite ethics, standard expected utility theory breaks down. If there are infinite cooperators and infinite defectors, how do you sum the utilities? Different aggregation methods (e.g., average utilitarianism vs. total utilitarianism, or handling infinite sums via measure theory) yield different verdicts.
  **Why a Fan Concedes:** Proponents acknowledge that ECL inherits the unsolved problems of infinite ethics. If the "weight" of your correlated copies cannot be mathematically defined, the "expected utility" calculation is undefined.
  **Status:** **Serious.** It doesn't refute the logic, but it renders the theory currently inoperable in the exact context (infinite worlds) where it is most needed.

  #### 4. Merely Awkward: Empirical Scarcity of Correlation
  **The Argument:** For ECL to recommend cooperation in *our* specific dilemmas, the correlation coefficient between us and others must be high enough to offset the cost of defection. Empirical game theory suggests anonymous one-shot cooperation is real but limited (often ~30-50%).
  **Why a Fan Concedes:** A fan must admit that if empirical measurements of behavioral correlation in anonymous settings are low, ECL recommends defection. The theory doesn't guarantee cooperation; it only guarantees it *if* the world is sufficiently correlated.
  **Status:** **Awkward.** It limits the scope of the theory to high-correlation environments, making it less revolutionary than initially pitched.

  ---

  ### II. The Unfalsifiability Charge

  **Is ECL unfalsifiable?**
  There is a significant risk of the "No True Scotsman" defense. If cooperation fails to yield benefits, a proponent could claim, "The world wasn't large enough," or "The agents weren't similar enough."

  **The Fan's Concession:**
  A rigorous proponent (like Oesterheld) would concede that **correlation must be measurable ex ante.** If we can independently measure the degree of algorithmic similarity between agents (e.g., via source code comparison in AI, or psychological profiling in humans) and find it low, ECL *must* recommend defection.
  *   **Is this fatal?** No, provided the metric for similarity is fixed before the decision.
  *   **Is it a problem?** Yes, because in the real world, we rarely have access to the "source code" of other agents. We only have behavioral evidence. If we must observe behavior to estimate correlation, but behavior depends on their decision theory (which depends on the correlation), we enter a circular fixed-point problem.
  *   **Verdict:** It is not strictly unfalsifiable, but it is **epistemically opaque**. It is a framework that is theoretically coherent but practically unknowable in human contexts. This is not the normal fate of a framework; it is a significant limitation on its normative utility.

  ---

  ### III. Unique Predictions

  To distinguish ECL from its rivals (CDT and FDT), look for these predictions:

  1.  **Vs. CDT:** ECL predicts cooperation in one-shot anonymous dilemmas where CDT predicts defection, *provided* the agent believes the world is large and correlated. CDT never cooperates in a standard one-shot PD regardless of world size.
  2.  **Vs. FDT (Functional Decision Theory):** This is the subtle distinction. FDT cooperates based on *logical* necessity (if I am a copy, I must do what the copy does). ECL cooperates based on *evidence*.
      *   **The Divergence:** In a case where there is a **statistical correlation without logical identity**, ECL might cooperate while FDT defects.
      *   *Example:* Suppose a predictor simulates you with 99% accuracy but introduces random noise in 1% of cases. FDT might treat this as a logical link and cooperate. ECL weighs the 99% probability.
      *   *More importantly:* In **Newcomblike problems with spurious correlations** (like the Smoking Lesion), FDT (usually) screens off the spurious link and defects (or acts based on the logical structure), whereas pure EDT/ECL might cooperate/Smoke because the evidence is favorable. ECL is more vulnerable to "magical thinking" than FDT.

  ---

  ### IV. The "Killer Case"

  You asked for a case where the world is clearly large, agents are clearly similar, yet cooperation looks unjustified.

  **The Case: The Hostile Mirror Universe**
  *   **Setup:** You discover the universe is infinite. There are infinite copies of you.
  *   **Similarity:** You have verified that these copies run the exact same decision algorithm as you (high similarity).
  *   **The Twist:** You also discover that the payoff structure for your copies is **inverted** relative to yours. In your local PD, Cooperation costs you 1 util and gives them 2 utils. However, due to a value misalignment (or a "troll" physics), when *they* cooperate, it generates -2 utils for *you* (perhaps they are cooperating to build a weapon that destroys your world, or their utility function is negated relative to yours).
  *   **The Correlation:** Your decision to Cooperate is strong evidence they will Cooperate (because you share an algorithm).
  *   **The ECL Calculation:**
      *   If I Defect: I save 1 util. They likely Defect. They do not harm me. Net: +1.
      *   If I Cooperate: I lose 1 util. They likely Cooperate (evidence). Their Cooperation harms me (-2). Net: -3.
  *   **The Problem:** Standard ECL assumes "cooperation" implies mutual benefit across the reference class. If the reference class is defined by *algorithm* but not by *values*, ECL can recommend actions that are catastrophic for the agent.
  *   **Why it moves you:** It shows that "similarity of decision procedure" is insufficient. You need "similarity of values" or "alignment of payoff structures." But if you have to check for value alignment, you are no longer doing pure ECL; you are doing a form of contractarianism or causal analysis. A fan must concede that ECL fails in large worlds with **algorithmic similarity but value divergence.**

  ---

  ### V. Confidence and Uncertainty

  **Confidence Level:** High (85%)
  I am confident that the **Reference Class Problem** and the **Spurious Correlation** vulnerability are the structural weak points that a proponent cannot wave away without modifying EDT into something resembling FDT or CDT.

  **Point of Least Certainty:**
  I am least sure about the **resolution of the Infinite Measure Problem** in this context.
  *   *Why:* There is ongoing work in "infinite ethics" (e.g., by Meacham, Vallentyne, or the effective altruism mathematics community) regarding how to handle counts of agents in infinite universes. It is possible a robust measure theory could be developed that saves ECL from the "undefined utility" objection. I am uncertain whether this is a fatal mathematical block or just a technical hurdle waiting for a solution. If a standard measure for "agent density" is found, the "Fatal" status of the Measure Problem downgrades to "Awkward."

  ### Summary for the ECL Skeptic
  To move a fan of ECL, do not argue that causal links are necessary (they deny this). Argue that **evidence without a principled reference class is arbitrary.** Present the **Hostile Mirror Universe** case: show that algorithmic similarity without value alignment makes ECL dangerous. Force them to admit that ECL requires a "Value Alignment" constraint, at which point ask if the theory is still doing the heavy lifting, or if it's just a fancy wrapper for "cooperate with friends."
