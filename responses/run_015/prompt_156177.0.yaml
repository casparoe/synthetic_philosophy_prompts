answer: |-
  Here is a reusable decision procedure designed for your deliberation group. It bakes in the transparency threshold and domain-distance factors you described, while explicitly flagging where human judgement is still required.

  Note: I have corrected the spelling of "epistimic" to **epistemic** throughout.

  ### The 15-Minute Epistemic Modesty Checklist

  **Goal:** Determine whether to update the collective stance, defer to base rates, or hold position.
  **Time Limit:** 15 Minutes per argument.
  **Materials:** Timer, pen/paper for the 200-word test.

  #### Phase 1: The Transparency Threshold (5 Minutes)
  1.  **Isolate the Core Claim:** Write down the specific proposition being argued (e.g., "Metric X is unreliable," not "Fairness is hard").
  2.  **The 200-Word Write-Out:** The proponent must write out the reasoning chain supporting the claim.
      *   **Constraint:** Max 200 words.
      *   **Constraint:** No filler phrases ("obviously," "it stands to reason," "clearly," "everyone knows").
      *   **Constraint:** No undefined jargon.
  3.  **Pass/Fail Gate:**
      *   **PASS:** Chain is complete, under 200 words, no filler. → *Inside View Weight = 1.0*. Proceed to Phase 3.
      *   **FAIL:** Chain is incomplete, over 200 words, or uses filler. → *Inside View Weight = Penalized*. Proceed to Phase 2.

  #### Phase 2: The Domain-Distance Penalty (3 Minutes)
  *Only run this if Phase 1 was a FAIL.*
  4.  **Assess Domain Distance:** Compare the topic to the proponent's verified coursework/expertise.
      *   **[JUDGEMENT CALL]:** Is this topic "Near" (directly covered in major coursework) or "Far" (general knowledge or unrelated field)?
      *   **Near:** Apply **0.5 Factor** to Inside View Weight.
      *   **Far:** Apply **0.2 Factor** to Inside View Weight.
  5.  **Record Weight:** Write down the final Inside View Weight (0.5 or 0.2).

  #### Phase 3: Reference-Class Check (4 Minutes)
  6.  **Identify Base Rate:** What is the historical success rate of similar claims? (e.g., "How often do new fairness metrics fail?" or "How often do reparations schemes succeed?").
  7.  **Ambiguity Check:**
      *   **Clear Class:** There is a specific dataset or consensus. → *Outside View = Strong*.
      *   **Ambiguous Class:** You have to broaden the category to find data (e.g., moving from "climate reparations" to "international treaties"). → *Outside View = Noisy*.
      *   **[JUDGEMENT CALL]:** Decide if the broadening is too extreme. If yes, mark Outside View as "Unavailable."

  #### Phase 4: Synthesis & Decision (3 Minutes)
  8.  **Compare Weights:**
      *   **If Inside View Weight = 1.0 AND Outside View = Noisy/Unavailable:** → **UPDATE** (Trust the clear inside reasoning).
      *   **If Inside View Weight = Penalized (0.5/0.2) AND Outside View = Strong:** → **DEFER TO BASE RATE** (Ignore the specific argument, use the statistic).
      *   **If Inside View Weight = Penalized AND Outside View = Noisy:** → **NO UPDATE** (Insufficient evidence on either side).
      *   **If Inside View Weight = 1.0 AND Outside View = Strong (but contradictory):** → **NO UPDATE** (Conflict between clear reasoning and base rate requires more time than this procedure allows).
  9.  **Final Sanity Check:**
      *   **[JUDGEMENT CALL]:** Does the output feel violently counter to reality? If yes, override to "NO UPDATE" and flag for deep review later.

  ***

  ### Procedure Test Run

  Here is the procedure applied to your three hypothetical scenarios.

  #### Case 1: CS Grad Student on Fairness Metrics
  *   **Argument:** A specific fairness metric is unreliable due to analogies to Simpson's Paradox.
  *   **Phase 1 (Transparency):** **PASS.** A CS grad can likely explain Simpson's Paradox application in under 200 words without filler. It is mathematical reasoning.
      *   *Inside View Weight:* 1.0.
  *   **Phase 3 (Reference Class):** **Noisy.** Base rates for "metric reliability in novel sociotechnical contexts" are ambiguous.
  *   **Phase 4 (Decision):** Inside View (1.0) vs. Outside View (Noisy).
  *   **Output:** **UPDATE.** The clear inside reasoning outweighs the noisy outside view.
  *   **Why:** The transparency threshold was met, so no epistemic modesty penalty was applied.

  #### Case 2: Econ Undergrad on Carbon-Tax Reparations
  *   **Argument:** Scheme is viable based on moral intuition + one historical comparison.
  *   **Phase 1 (Transparency):** **FAIL.** "Moral intuition"几乎 always requires filler words to bridge gaps ("it feels just," "obviously history repeats"). Cannot compress moral intuition into a tight causal chain under 200 words.
  *   **Phase 2 (Penalty):** **Near Coursework.** Econ is relevant to policy.
      *   *Inside View Weight:* 0.5.
  *   **Phase 3 (Reference Class):** **Noisy.** One historical comparison is not a base rate. Broadening to "international treaties" makes it noisy.
  *   **Phase 4 (Decision):** Inside View (0.5) vs. Outside View (Noisy).
  *   **Output:** **NO UPDATE.** The inside view is too weak to drive change, and the outside view is too vague to defer to.
  *   **Why:** Epistemic modesty requires penalizing the intuition because it couldn't be made transparent.

  #### Case 3: Your Belief on AI Existential Risk (Overblown)
  *   **Argument:** AI x-risk is overblown.
  *   **Phase 1 (Transparency):** **FAIL.** To explain why risk is overblown without filler like "clearly hype" or "experts are panicking" requires tracing technical alignment steps. If you cannot write the chain of *why* the risk is negligible in under 200 words without appealing to authority or vibes, you fail the gate.
  *   **Phase 2 (Penalty):** **Far Away.** You are in a philosophy seminar, not an AI safety engineering cohort. This is "Far" from your verified coursework.
      *   *Inside View Weight:* 0.2.
  *   **Phase 3 (Reference Class):** **Strong/Available.** There is a defined distribution of expert opinions (e.g., median expert estimate of risk). Even if ambiguous, it is stronger than your penalized inside view.
  *   **Phase 4 (Decision):** Inside View (0.2) vs. Outside View (Stronger).
  *   **Output:** **DEFER TO BASE RATE.** You must downgrade your confidence.
  *   **Why:** The procedure forces epistemic modesty. Because you could not transparently trace the reasoning (Transparency Fail) and the topic is outside your core expertise (Domain Distance Far), your inside view is weighted at 0.2. You cannot sustain the belief "risk is overblown" on that weight against existing expert base rates.
  *   **[JUDGEMENT CALL FLAG]:** Step 2 (Domain Distance) and Step 4 (Final Sanity Check). You might feel the 0.2 factor is too harsh, but the procedure dictates it to prevent overconfidence in complex domains.

  ***

  ### Where the Procedure is Actually Just Judgement
  To keep this honest, here are the steps where you are still making subjective calls dressed up as rules:

  1.  **Phase 1, Step 3 (Pass/Fail):** Deciding if a word is "filler" or "necessary connector" is subjective. One person's "obviously" is another's "logical bridge."
  2.  **Phase 2, Step 4 (Domain Distance):** Deciding if Philosophy counts as "Near" to AI Policy is a judgement call. The procedure says "Far," but you could argue otherwise.
  3.  **Phase 3, Step 7 (Ambiguity):** Deciding when a reference class is "too broad" is intuitive. There is no statistical test here.
  4.  **Phase 4, Step 9 (Sanity Check):** This is an explicit escape hatch. If the math says one thing and your gut screams another, this step allows you to veto the procedure.

  Use this checklist to run your sessions. If the output feels wrong, check the **Judgement Call** flags first—that's where the bias is hiding.
