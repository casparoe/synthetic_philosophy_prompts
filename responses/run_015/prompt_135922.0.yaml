answer: |-
  Imagine a server cluster where Node 0 runs your decision algorithm and Nodes 1–100 are the environment you're optimizing over. Your utility function is to produce a "validated block" before a hard wall-clock deadline, but validation cryptographically requires active participation from a quorum of Nodes 1–100. Here's the kicker: active nodes generate heat, which raises the ambient temperature, which thermally throttles Node 0's CPU clock speed, directly increasing the wall-clock time required for Node 0 to finish its own decision calculation. If the cluster runs hot, you might miss the deadline; if you cut power to Nodes 1–100 to cool the room, you compute faster but destroy the quorum required to define a "validated block" in the first place.

  Under a causal framing, the agent treats its own computation as a physical process distinct from the environment it's modeling. It sees the heat as a causal obstacle to finishing the calculation in time and views the quorum requirement as an external condition it can try to satisfy after securing the physical capacity to act. Since missing the deadline yields zero utility regardless of validity, the causal agent shuts down Nodes 1–100 to guarantee it finishes the computation, betting it can hack the validation later or that finishing *something* is better than finishing nothing. Under an embedded framing, the agent recognizes that its decision criterion isn't just a target in the environment but is logically constituted by the system's state. It sees that shutting down the nodes doesn't just make validation harder; it collapses the logical structure that makes "validated block" a meaningful concept. Since an invalid block is logically equivalent to no block, the embedded agent keeps the nodes running, accepting the thermal risk because the alternative isn't a slower success—it's a category error.

  The feature doing the heavy lifting here is the thermal-clock loop, because it ties the agent's reasoning capacity directly to the physical consequences of its action. A CDT defender would attack this by arguing you're reifying logic over survival: "If you don't finish in time, you get zero, so physical completion is the primary constraint; validity is just a secondary property you can optimize for once you're alive." They'd claim the agent should just build a better cooling system rather than pretending logic constrains physics. However, if you remove the feedback loop—say, Node 0's clock speed is fixed regardless of temperature—the self-referential tension vanishes. The agent just compares the expected utility of a slow-valid output versus a fast-invalid output, collapsing the problem into a standard resource allocation trade-off without the weirdness of the decision time depending on the decision itself.
