answer: |-
  # TAXONOMY: IS HISTORY LOCKED IN?
  **Root Question:** If you replayed the tape of human history with one small change (e.g., Battle of Actium, British coal location), do macro-level outcomes (industrial capitalism, liberal democracy) still arrive?

  ## BRANCH 1: YES (Convergence / Structural Attractors Exist)
  *Macro-outcomes are robust; the system returns to equilibrium despite perturbations.*

  ### 1.1 Geographic/Environmental Constraints
  *   **Position Name:** Geographic Determinism
  *   **Concrete Case:** British industrialization was inevitable because coal seams were located near surface waterways, regardless of who won the Civil War.
  *   **Most Awkward Commitment:** Must claim human agency is merely a friction coefficient on physical necessities, rendering cultural differences epiphenomenal.
  *   **Separation Flag:** **Collapses** into 1.2 if "environment" is defined broadly enough to include institutional ecology.

  ### 1.2 Functional Selection on Institutions
  *   **Position Name:** Institutional Darwinism
  *   **Concrete Case:** Liberal democracy arrives in every replay because it out-competes monarchy in mobilizing resources for war and trade.
  *   **Most Awkward Commitment:** Must assume inefficient institutions die off quickly enough to look like convergence across replays, ignoring power retention.
  *   **Separation Flag:** **Separates** from 1.1 only if culture can override geography; otherwise, they merge.

  ### 1.3 Normative Retro-justification
  *   **Position Name:** Teleological Whiggism
  *   **Concrete Case:** Democracy is not just functional but the logical end-point of Spirit/Reason, so any replay must eventually find it.
  *   **Most Awkward Commitment:** Must claim actual historical actors were unconscious puppets of a moral logic that only becomes visible after the fact.
  *   **Separation Flag:** **Collapses** into 1.2 if "function" is secretly defined as "moral fitness" rather than material survival.

  ## BRANCH 2: NO (Divergence / Path Dependance is Real)
  *Macro-outcomes are fragile; the system bifurcates based on early noise or rigid structures.*

  ### 2.1 Sensitive Dependence on Initial Conditions
  *   **Position Name:** Strong Contingency (Chaos-Style)
  *   **Concrete Case:** If Antony wins at Actium, the Roman Empire never consolidates, and no European feudalism arises to birth capitalism.
  *   **Most Awkward Commitment:** Must claim macro-structures are as fragile as weather systems, requiring a **Counterfactual Fragility Index** to measure how many years until divergence becomes total.
  *   **Separation Flag:** **Separates** from 2.2 because divergence here is due to early sensitivity, not later rigidity.
  *   **Niche Injection:** Distinguish *Causal Path Dependance* (this leaf) from *Semantic Path Dependance* (see 2.2).

  ### 2.2 Irreversible Institutional Lock-in
  *   **Position Name:** Institutional Sedimentation
  *   **Concrete Case:** Once a QWERTY-style legal code is set (e.g., Napoleonic Code), switching costs prevent optimal systems from emerging, even if Meiji-style elites try to escape.
  *   **Most Awkward Commitment:** Must claim successful radical reforms (like Meiji) are either illusions or only possible before the lock-in threshold is crossed.
  *   **Separation Flag:** **Collapses** into 2.1 if the "lock-in" is just the result of an earlier chaotic bifurcation that we missed.
  *   **Niche Injection:** This is the home of **Semantic Path Dependance**: the lock-in persists not because of causal force, but because actors lose the vocabulary to imagine alternatives.

  ***

  ## LOGICALLY EMPTY / COLLAPSED NODES

  **1. Chaos-Style Divergence + Normative Retro-justification**
  *   **Status:** **EMPTY**
  *   **Why:** You cannot claim outcomes are wildly sensitive to initial conditions (Chaos/2.1) while simultaneously claiming the actual outcome was morally/logically necessary (Teleology/1.3). If the tape replays differently, the "necessary" norm was never necessary.

  **2. Causal vs. Semantic Path Dependance (Niche Distinction)**
  *   **Status:** **CROSS-CUTTING**
  *   **Why:** Most histories assume *Causal Path Dependance* (Event A physically forces Event B). However, *Semantic Path Dependance* (Event A changes the language so Event B is unintelligible) is often mistaken for structural lock-in. This distinction prevents Branch 2 from collapsing into a simple "anything can happen" claim; some things don't happen because they become *unsayable*, not just impossible.

  **3. Geographic Determinism + Strong Contingency**
  *   **Status:** **EMPTY**
  *   **Why:** If geography dictates the outcome (1.1), then moving the coal seams changes the outcome, but changing the Battle of Actium (a non-geo variable) should not. You cannot hold that physical constraints are absolute attractors while also claiming political butterfly effects override them.
