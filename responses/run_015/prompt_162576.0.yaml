  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Goal:** Create a 90-minute seminar activity for ~15 undergraduates on rationality and reasons, specifically targeting Parfit's Hitchhiker problem.
      *   **Core Philosophical Problem:** The tension between instrumental rationality and the need for a disposition that ignores current reasons. Specifically, the step where a resolution based on reasons fails because reasons change. The solution requires being moved by something *not* a response to reasons (a disposition/nature) rather than a binding contract.
      *   **Constraints:**
          *   One-off interaction (no reputation/repetition).
          *   Anonymous pairing.
          *   No real money (raffle tickets/chocolate).
          *   No external enforcement (contracts, apps, etc.).
