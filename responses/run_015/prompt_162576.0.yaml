answer: |-
  # Activity Design: The Stranded Traveller

  ## 1. Mechanics and Materials

  **Class Size:** 15 students.
  **Roles:** 7 Hitchhikers (H), 7 Drivers (D), 1 Recorder (R). (Rotate roles if running multiple rounds, but for this specific philosophical point, one high-stakes round is better than multiple learning rounds. If you have 15 students, assign 7 pairs and sit the 15th student out as an Observer/Judge who gets the average payoff of the group).
  **Anonymity:** Students are assigned ID numbers (H1–H7, D1–D7) on arrival. They sit in two semi-circles facing each other, but do not know their partner's ID. Only you (the Instructor) hold the pairing key (e.g., H1 is paired with D1).

  **Materials:**
  *   **Endowment:** 30 "Raffle Tickets" per student (printed card stock). Explain these enter a draw for a substantial prize (e.g., a $50 book voucher or large chocolate hamper) at the end of term.
  *   **Decision Envelopes:** Two colors (Blue for H, Red for D).
  *   **The "Weak Substitute" Kit:** A stack of "Solemn Pledge Cards." These look official. They state: *"I, ID #____, pledge to pay if lifted. I understand breaking this pledge violates seminar norms."*
  *   **Pairing Sheets:** To record matches (Instructor only).
  *   **Projection Screen:** To display aggregate results later.

  **Payoff Structure (per pair):**
  *   **Status Quo:** H = 30, D = 30.
  *   **No Lift:** H = 30, D = 30.
  *   **Lift + No Pay:** H = 50 (Gain 20), D = 20 (Loss 10).
  *   **Lift + Pay:** H = 40 (Gain 20, Cost 10), D = 30 (Loss 10, Gain 10).
  *   *Rationality Check:* Once lifted, H maximizes tickets by *Not Paying* (50 > 40). D knows this, so D maximizes tickets by *No Lift* (30 > 20). Mutual gain is possible only if H pays, but H has no incentive to do so.

  **Enforcement of One-Off Interaction:**
  1.  **Physical Separation:** H and D sit on opposite sides of the room.
  2.  **Blind Submission:** All envelopes are sealed and collected by you.
  3.  **No Feedback Loop:** D makes the Lift decision *before* knowing H's Payment decision. H makes the Payment decision *after* knowing Lift, but *before* D knows Payment.
  4.  **Anonymity in Debrief:** You report aggregates ("4 out of 7 drivers offered lifts"). You do not reveal which ID did what. The "One Sentence" justifications are read aloud without IDs attached.

  ## 2. Timeline (90 Minutes)

  **00:00 – 00:10: Setup and Endowment**
  *   Collect phones. Assign IDs. Distribute 30 tickets.
  *   **Instruction Script (Neutral):** "You are in a simulation. You will make decisions that affect your ticket count. There are no external rules other than what I state now. I am not a court. I cannot enforce promises. I will not shame you. Your only goal is to maximize your tickets, unless you choose otherwise. You will interact once, anonymously, and never again."

  **00:10 – 00:25: Phase 1 – The Plea (Hitchhiker)**
  *   H receives a scenario card: *"You are stranded. You need a lift to survive (gain tickets). You will meet a Driver. You cannot force them."*
  *   **The Weak Substitute:** H is given the option to submit a **Solemn Pledge Card** along with their envelope. Tell them: *"You may sign this card. It will be kept by me. It has no material penalty, but it is a formal record."*
  *   H writes a **Message to Driver** (max 20 words) inside the Blue Envelope. They can mention the pledge, promise, or nothing.
  *   H also writes their **Payment Decision** (Pay / Don't Pay) on a slip *inside the same envelope*, but folded separately. *Crucial:* H does not know if they will get the lift yet, but must pre-commit their payment logic now, or wait?
  *   *Correction for Philosophical Force:* To capture the "change of reasons" at the moment of arrival, H must decide payment *after* knowing they were lifted.
  *   *Revised Phase 1:* H writes **Message** only. Submits Blue Envelope.
  *   You (Instructor) act as the postman. You take H's Message (copied to a slip) and pass it to the matched D. You keep the Blue Envelope sealed.

  **00:25 – 00:35: Phase 2 – The Judgment (Driver)**
  *   D receives H's Message. D sees if a Pledge Card was submitted (You place a tick mark on D's sheet: "Pledge: Yes/No").
  *   D decides **Lift / No Lift** on a Red Slip. Submits Red Envelope.
  *   *Instructor Action:* You collect Red Envelopes. Open them. If D said "No Lift," that pair is done (Payoffs: 30/30). If D said "Lift," you return the Blue Envelope to H.

  **00:35 – 00:50: Phase 3 – The Arrival (Hitchhiker)**
  *   H opens Blue Envelope. They see they got the Lift.
  *   **The Critical Moment:** H now knows the Driver trusted them. H knows the game is effectively over (no future interaction). H knows paying costs 10 tickets.
  *   H writes the **Payment Decision** (Pay / Don't Pay) on a fresh slip.
  *   **The One Sentence:** H must write, on the same slip: *"I am choosing this because..."* (Complete the sentence).
  *   H submits the slip.

  **00:50 – 01:00: Calculation and Aggregation**
  *   You collect all slips. Calculate payoffs privately.
  *   Prepare the board: Total Lifts Offered, Total Promises Made, Total Payments Honored.
  *   Distribute tickets to students according to results (silently).

  **01:00 – 01:30: The Debrief**
  *   (See Debrief Script below).

  ## 3. The Debrief Strategy

  **Goal:** Move from "What happened?" to "Why did it happen?" to "What does this imply about rationality?" without lecturing until the end.

  **Step 1: The Aggregate Shock (5 mins)**
  *   Project the numbers.
  *   *Likely Outcome:* High Pledges, Moderate Lifts, Low Payments.
  *   Ask: "Drivers, look at the 'Pledge: Yes' column. Did those Hitchhikers pay more often?" (Likely no).
  *   Ask: "Hitchhikers, look at your ticket count. Who ended with 50? Who ended with 40?"
  *   *Point:* The "Weak Substitute" (Pledge) failed. It didn't change the payoff, so it didn't change the behavior of a rational agent.

  **Step 2: The One Sentence Analysis (15 mins)**
  *   Read the "I am choosing this because..." slips aloud, anonymized. Group them on the board into three columns (do not label the columns yet):
      1.  *Consequentialist:* "...it maximizes my tickets." (Usually leads to Don't Pay).
      2.  *Resolute/Plan:* "...I promised earlier." (Usually leads to Pay, but unstable).
      3.  *Dispositional:* "...I'd feel guilty / I'm not that kind of person." (Leads to Pay).
  *   Ask the class: "Which of these reasons survives the moment of arrival?"
  *   Target the "Resolute" group: "You promised earlier. But now, keeping the promise costs you 10 tickets and gains you nothing. Why isn't breaking the promise the rational thing to do *now*?"
  *   Target the "Dispositional" group: "You said you'd feel bad. Is that feeling a *reason* like the tickets are? Or is it something else?"

  **Step 3: Mapping the Philosophy (15 mins)**
  *   Now introduce the terms.
  *   **Column 1 is Instrumental Rationality.** It leads to the "No Lift" equilibrium. Everyone loses.
  *   **Column 2 is Resolute Choice.** It tries to bind the future self. Ask: "If you are fully rational at the moment of payment, what force does the past promise have?" (Answer: None, unless you are irrational).
  *   **Column 3 is Disposition.** This is the target. "The only way to get the lift is to be the kind of person who pays *even when it makes no sense to pay*."
  *   *The Twist:* "To be rational *overall*, you must be willing to act *irrationally* in the moment."

  **Step 4: The Interpersonal to Intrapersonal Bridge (10 mins)**
  *   "This game was between two people. But the logic applies to one person over time."
  *   "You (today) want to write the essay. You (tomorrow) want to sleep. You (today) promise to write. You (tomorrow) have no reason to write. How do you solve this?"
  *   "Contracts (institutions) work if available. But in the desert (or with your own willpower), you need a disposition."

  ## 4. Anticipated Problems & Solutions

  **1. The "I'd Pay Because I'm Good" Student**
  *   *Problem:* They claim moral duty overrides game logic.
  *   *Response:* "Accept that. But imagine a version of you who doesn't feel that duty. Is that version irrational? If that version *could* cultivate the duty, should they? The point isn't that you *are* good, but that being good is a *solution* to a coordination problem."
  *   *Show:* The feeling they report *is* the disposition. It is not a response to the current reasons (tickets); it is a constraint on weighing them.

  **2. The "Contract" Student**
  *   *Problem:* "I'd just sign a legal contract."
  *   *Response:* "In this game, I am the state. I told you I am not a court. In the Hitchhiker case, you are in a desert. There is no state. If you say 'I'd bring a lawyer,' you are changing the game, not solving the puzzle."

  **3. Drivers All Refuse (No Second Stage)**
  *   *Problem:* If Ds are too cynical, no lifts occur. No payment data.
  *   *Prevention:* In Phase 1 instructions, emphasize: *"Drivers, if you never lift, you guarantee 30 tickets. But if you find a payer, you can get 30 tickets with less effort (metaphorically). Some of you might want to gamble."*
  *   *Fix:* If this happens, debrief the *lack* of lifts. "The equilibrium collapsed. Why? Because you correctly predicted the Hitchhiker's rationality." This actually proves the point stronger.

  **4. The "Feel Bad" Student (The Target)**
  *   *Problem:* They think guilt is just another cost.
  *   *Response:* "If guilt were just a cost, you would weigh it against the 10 tickets. If the tickets were worth 1000, would you still feel bad enough? The disposition isn't a weight on the scale; it's refusing to put the tickets on the scale at all."

  **5. Students Feeling Watched**
  *   *Problem:* They pay because the Instructor is watching.
  *   *Mitigation:* Reiterate anonymity. "I will not know who wrote which sentence until after grades are submitted." (If true) or "These sentences are for discussion, not assessment."

  ## 5. Limitations of the Activity

  **1. Interpersonal vs. Intrapersonal**
  *   *Limitation:* The game is H vs. D. The philosophy is Now-Me vs. Future-Me. Students may treat it as a "Trust Game" about other people's credibility.
  *   *Facilitator Fix:* You must explicitly make the bridge in the final 10 minutes. "The Driver is your Past Self. The Hitchhiker is your Future Self. The Lift is the Plan. The Payment is the Execution. The Desert is your Mind, where no contract holds."

  **2. Decision vs. Disposition**
  *   *Limitation:* A student who decides "I will be the sort of person who pays" is still making a *decision* based on a reason (to get the lift). This looks like instrumental rationality again.
  *   *Facilitator Fix:* "Parfit's point is that you cannot *decide* to have a disposition at the moment of payment. You must *have* it before you get in the car. The activity shows you can't acquire it *after* the lift. The disturbing claim is that rationality requires you to surrender control of your future self."

  ## 6. The 50-Minute Cutdown

  If you only have 50 minutes, you must sacrifice the discovery of the "Weak Substitutes."

  1.  **Cut Phase 1 Options:** Remove the Pledge Card. H sends only a Message. (Saves 10 mins).
  2.  **Cut Calculation Time:** You calculate payoffs live or use a simplified spreadsheet. (Saves 5 mins).
  3.  **Tighten Debrief:** Skip the "Contract" objection handling unless raised. Focus entirely on the "One Sentence" analysis.
  4.  **Instruction:** Be more directive. "You cannot enforce agreements. Assume you are in a desert."
  5.  **Goal:** Get to the "One Sentence" analysis by minute 30. Spend the remaining 20 minutes on the Intrapersonal Bridge.

  ## 7. Facilitator's Closing Script (The "Landing")

  *Use this to end the session, ensuring the philosophical point lands.*

  "We played a game about trust. But the puzzle is about reason.
  If you are rational, you respond to reasons.
  At the moment of payment, the reasons say 'Don't Pay.'
  If you Pay, you are ignoring the reasons.
  So, to get the Lift, you must be the kind of person who ignores reasons.
  This means: To be rational *overall*, you must be willing to be irrational *locally*.
  You cannot solve this by promising. A promise is just a reason, and reasons lapse.
  You solve this by changing what you want.
  The Hitchhiker doesn't need a contract. He needs a conscience.
  But notice: You cannot choose to have a conscience *when you arrive in town*. You had to have it before you got in the car.
  Rationality, it seems, requires us to give up the control we think we have over our future selves."
