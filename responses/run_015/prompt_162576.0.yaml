  2.  **Deconstruct the Philosophical Challenge:**

      *   *The Hitchhiker Logic:*
          1.  Driver offers lift only if confident of payment.
          2.  Hitchhiker wants lift.
          3.  Once in town, Hitchhiker has no reason to pay (cost > benefit, no enforcement).
          4.  Driver knows (3), so doesn't offer lift.
          5.  Result: Both worse off.
      *   *The "Trap":* Students often think "I'd just pay because I'm honest" or "I'd sign a contract."
      *   *The Target:* Show that "being honest" isn't a *decision* made in the moment based on reasons, but a *disposition* that bypasses the calculation. The activity needs to make them feel the instability of a promise made *before* the ride when the calculation changes *after* the ride.
      *   *The Twist:* The prompt asks to distinguish between: (1) Changing institutions/payoffs, (2) Sticking to a plan (resolute choice), (3) Changing motives (disposition). The activity should naturally lead to (3) being the only viable solution, but students will likely aim for (1) or (2).

