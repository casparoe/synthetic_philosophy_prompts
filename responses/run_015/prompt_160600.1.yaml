      *Refining Order:* The Neuroscientist and Analytic Philosopher are the biggest threats. The Agenesis claim is the user's specific empirical vulnerability. The "Hope Nobody Asks" should be the ontological collapse.

  4.  **Developing the Replies (Whiteboard Style):**
      *   Need to be concise, visual (metaphorically), and concede where necessary to buy goodwill.
      *   *Strategy:* Concede the *simplicity* of the model, defend the *utility* of the distinction.
      *   *Key Concession:* Admit CC might carry *some* informational content relevant to experience, but argue the *primary* deficit is coordination.
      *   *Key Defense:* The bundle view (dissociating unities) is robust even if the action-space conjecture is shaky.

  5.  **Addressing Specific Constraints:**
      *   *Confidence Ratings:* Need to be honest.
      *   *Weakest Point:* The Agenesis claim is empirically risky without citations.
