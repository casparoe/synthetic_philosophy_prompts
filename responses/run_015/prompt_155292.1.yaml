answer: |-
  ### System Design Restatement

  Consider the moral agent as a distributed system composed of autonomous **modules**, each representing a ground project. Each module adheres to a **single-responsibility principle**, managing its own state and dependencies without external interference. **Architectural coherence** is maintained when these modules execute their primary logic directly, relying on local context rather than global variables. However, a utilitarian moral system imposes a global **interface** that demands all modules expose their internal decision paths for centralised **optimisation**. 

  In a critical race condition—equivalent to the spouse-and-stranger scenario—the module's **exception-handling policy** should trigger a direct local response based on hardcoded dependencies (e.g., `if (target == spouse) { save(); }`). Instead, the global interface injects a middleware layer requiring validation against system-wide utility before execution is permitted. This introduces **state contamination**, as local variables become dependent on external calculations, coupling the module to a context it does not own. To preserve **architectural coherence**, the module must employ **circuit-breaker logic** to reject the external validation request. This prevents **state contamination** and maintains the integrity of its local execution context, ensuring the system does not crash due to latency or dependency failure during critical operations.

  ### Element Analysis

  **1. Modules**
  *   **Translates Cleanly:** The concept of encapsulation fits well. Just as a module hides its internal implementation details, Williams suggests personal commitments are internal to the agent and not fully transparent to external moral scrutiny.
  *   **Distorted:** Software modules are interchangeable components defined by function; human ground projects are constitutive of identity. Swapping a module does not alter the system's identity; swapping a ground project alters the person.
  *   **No Expression:** Ownership. A module does not 'own' its code; it merely hosts it. Williams's agent owns their projects in a way that software cannot instantiate.

  **2. Interfaces**
  *   **Translates Cleanly:** The idea of a contract between components mirrors the demand morality places on agents. The utilitarian requirement acts as an API that the agent is expected to implement.
  *   **Distorted:** Software interfaces are typically consensual or compiled-in constraints. Moral demands are often experienced as coercive or overriding, not merely as technical contracts.
  *   **No Expression:** Normativity. An interface defines *how* data moves, not *why* it should. The moral 'ought' has no equivalent in interface definition languages.

  **3. Exception-handling Policies**
  *   **Translates Cleanly:** The spouse-and-stranger case is treated as a edge case or high-priority interrupt. The 'one thought too many' is analogous to running a validation check inside a critical section where performance is paramount.
  *   **Distorted:** In software, exceptions are deviations from normal flow. For Williams, the moral crisis is a central feature of human life, not a bug or edge case.
  *   **No Expression:** Emotional weight. An exception handler does not feel the gravity of the crash; the agent feels the weight of the decision.

  **4. Single-responsibility Principles (SRP)**
  *   **Translates Cleanly:** SRP argues a component should have one reason to change. Williams argues ground projects give life a specific direction and reason for acting.
  *   **Distorted:** Human life is inherently multi-responsible. Reducing a person to a single responsibility per project oversimplifies the tangled nature of human motivation.
  *   **No Expression:** Passion. SRP is about maintainability; ground projects are about love, ambition, and desire. The principle captures structure, not drive.

  **5. State Contamination**
  *   **Translates Cleanly:** This maps well to the idea of alienation. Just as global variables pollute local scope, making code hard to reason about, utilitarian calculation pollutes personal motivation, making action alien to the self.
  *   **Distorted:** Data corruption is objective and detectable. Psychological alienation is subjective and phenomenological.
  *   **No Expression:** Harm. State contamination causes system errors; moral contamination causes spiritual or psychological harm. The metaphor captures the mechanism but not the injury.

  **6. Architectural Coherence**
  *   **Translates Cleanly:** Integrity as consistency. A system where modules conflict or depend on unstable external services is incoherent, just as an agent forced to act against their projects is fragmented.
  *   **Distorted:** Coherence in software is about stability and uptime. Integrity in Williams's sense is about moral identity and authenticity.
  *   **No Expression:** Value. A coherent system can be useless or evil. Williams implies integrity has intrinsic moral worth, which architectural coherence lacks.

  **7. Circuit-breaker Logic**
  *   **Translates Cleanly:** The refusal to calculate. A circuit breaker stops a request to prevent cascading failure. Williams's agent refuses the moral calculation to prevent the collapse of their integrity.
  *   **Distorted:** Circuit breakers are automated failure responses. Williams's refusal is a deliberate, agential stand.
  *   **No Expression:** Agency. The breaker trips due to thresholds; the agent refuses due to commitment. The metaphor removes the choice, which is central to Williams's point.

  ### Residue Report

  The untranslatable residue reveals a genuine limitation of the engineering metaphor rather than exposing Williams's notions as underspecified. The engineering framework is fundamentally functionalist: it describes *how* systems operate, not *why* they matter. Williams's claim rests on the phenomenological reality that human beings *care* about their ground projects in a way that software modules cannot care about their functions. 

  When the metaphor fails to capture the 'hurt' of alienation or the 'value' of integrity, it is not because Williams has failed to specify the structure of the self, but because the structure of the self is not merely architectural. The metaphor successfully illustrates the structural conflict between local commitment and global optimisation, demonstrating that Williams's account of integrity is logically coherent as a system design problem. However, it cannot capture the *agency* required to trip the circuit breaker. In software, a breaker trips automatically; in Williams's ethics, the agent must choose to reject the calculation. 

  Therefore, the residue indicates that while the engineering metaphor helpfully clarifies the structural mechanics of the integrity objection—specifically regarding encapsulation and dependency inversion—it ultimately fails to model the normative force of human commitment. Williams's notions are not underspecified; rather, the engineering vocabulary lacks the semantic capacity to express valuation and agency. To force the metaphor to carry this weight would require smuggling design assumptions about 'purpose' into the system, which would violate the constraint of an honest translation. The limit lies in the tool, not the theory.
