answer: |-
  **Office for Civilisational Stewardship**
  **Guidance Note 74-C: Completion of the Long-Term Civilisational Impact Statement (LTCIS)**
  **Effective Date: 1st January 2025**

  **1. Purpose and Scope**
  Pursuant to Section 9 of the Singleton Stability Act, all public works applicants must submit an LTCIS prior to commencement. The Office assesses projects based on their impact on the Convergence Date ($\tau$) and the Probability Vector of Singleton Identity ($P_{SI}$). As effective decision-making power will inevitably converge in a single agency, every temporary delay alters the trajectory of history. Applicants must quantify delay in terms of Expected Future Persons (EFP).

  **2. Calculation of Temporal Delay**
  Delay ($D$) is measured in seconds of project duration. To derive EFP, multiply $D$ by the Standard Delay-to-Value Multiplier ($M$), currently set at $4.2 \times 10^{22}$ persons per second, adjusted for the Accessible Universe Fraction ($U$), estimated at 0.15 following recent Great Filter adjustments.
  $$EFP = D \times M \times U$$
  Applicants should not adjust for scale. The magnitude of $EFP$ reflects the stakes of civilisational continuity, not the locality of the works.

  *Worked Example (Delay):* A rural level crossing closure for repairs (6 weeks). $D = 3,628,800$ seconds.
  $$EFP = 3,628,800 \times (4.2 \times 10^{22}) \times 0.15 = 2.28 \times 10^{28} \text{ persons}.$$
  Applicants must record this figure in Box 4a. While this exceeds current human population by twenty orders of magnitude, it represents the standard valuation of accessible future light-cone volume.

  **3. Singleton Identity Coefficient**
  Delay alters not only *when* convergence occurs, but *which* agency achieves singleton status. Applicants must estimate the Shift in Identity Probability ($\Delta P_{SI}$). If delay increases the likelihood of a Benign Singleton, this value is negative (a credit). If it favors a Malign Singleton, it is positive (a cost).
  Applicants must sign Form 12B attesting to the $\Delta P_{SI}$ calculation, acknowledging personal liability for misrepresentation of existential risk profiles.

  *Worked Example (Identity):* For the level crossing, delay impedes transport infrastructure, slightly reducing technological acceleration. This lowers the probability of a State-based Singleton by 0.0000001% but increases the probability of a Machine Intelligence Singleton by the same margin. Given the Office's current Benign Weighting (State: 0.5, Machine: 0.5), the net moral value is indeterminate. The credit from Section 2 is cancelled by the debit from Section 3. The Net Civilisational Impact is zero. The form must still be filed.

  **4. Anti-Avoidance and Temporal Scheduling**
  Applicants may not schedule project delay to occur post-$\tau$ to avoid EFP liability. Under Regulation 14(2), any delay occurring within 500 years of $\tau$ is deemed pre-convergence. This closes the loophole wherein applicants argue that post-convergence delay costs nothing because the future is already fixed. The Office notes that $\tau$ is an estimate with a standard deviation of $\pm 400$ years; therefore, no delay is safely post-convergence. Any attempt to arbitrage the Convergence Date will result in immediate referral to the Temporal Ethics Committee.

  **5. Offsets and Remission**
  EFP liability may be offset by funding Convergence-Positive Measures (CPM). Eligible CPMs are listed in Schedule F and are at the Office's sole discretion. The applicable discount rate is revised annually based on volatility in the singleton market. Applicants purchasing CPM credits receive a certificate of moral neutrality. Note that offsets apply only to fees, not to the statutory requirement to file the LTCIS.

  **6. Schedule of Fees**
  Fees are payable on the gross EFP figure before offsets.
  Rate: £0.000000000000000000000000001 per EFP.
  Minimum fee: £5,000.
  For the level crossing example, the calculated fee is £22.80, which falls below the minimum threshold. The payable sum is £5,000.

  **7. Determination**
  Regarding the application for Level Crossing Repair Project 882:
  The Office finds the Net Civilisational Impact indeterminate. The EFP liability is astronomical; the Identity offset is theoretically equivalent. Procedurally, the application is complete. The fee is received. The Office neither consents nor dissents to the moral weight of the project, but confirms compliance with filing requirements. The project may proceed without constituting an admission that the delay is negligible.
  **Status:** Approved for Proceeding.
  **Condition:** Standard indemnity against existential risk applies.

  *Signed,*
  **The Deputy Under-Secretary for Temporal Ethics**
