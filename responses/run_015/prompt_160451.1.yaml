  4.  **Refining the Argument (Strawsonian Nuance):**
      *   Strawson distinguishes between *exemptions* (the agent is not a full member of the moral community, e.g., children, insane) and *excuses* (the action didn't reflect full illwill). The machine looks like a permanent exemption.
      *   The feeling of resentment toward a machine is akin to being angry at a storm or a stuck door, but linguistically dressed up. It's a primitive reaction, not a moral one.
      *   The critic says attitudes peel off from holding responsible. Strawson should argue that if we don't hold it responsible (close the tab), the *moral* resentment was never truly there, only a shadow of it.
      *   *Joke Idea:* Something about human gullibility or the tendency to anthropomorphize.

  5.  **Drafting the Content:**
