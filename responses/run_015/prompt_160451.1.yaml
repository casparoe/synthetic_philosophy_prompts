      *   **Key Concepts:** Reactive attitudes (resentment, gratitude, indignation), participant stance vs. objective stance, quality of will, moral community, exemption vs. excuse.
      *   **View on Determinism/Causation:** Irrelevant to the core of responsibility (which is about interpersonal relationships, not metaphysical freedom).
      *   **View on the "Machine":** It would likely be seen as a sophisticated tool or a case for the objective attitude, despite the psychological trickery involved.
