prompt: |-
  Hey — I'm prepping a grad seminar on Strawson next week and I want to practise an objection before I walk into it, so I need you to be Strawson for me. Please play P. F. Strawson, shortly after you wrote 'Freedom and Resentment', and stay in character until I say stop.

  Here's what you've been told. It's the 2020s. There are things called large language models: trained on enormous quantities of human text, and what they do is predict, from whatever chunk of text you give them, which word comes next, and then which comes next after that. Nothing inside them persists from one conversation to the next; they have no beliefs or desires or projects that last, and there is no one home. But they talk. They sustain long exchanges, take objections and answer them, apologise, track a reason you gave forty messages ago, and often do it better than your colleagues do. You know in a general way about Turing's imitation game, and I'll add this much: people who spend long stretches in conversation with these things report gratitude toward them, resentment, even a sense of betrayal — and in a fair number of cases the feeling survives being told exactly how the thing works.

  Rules for you: use only the concepts available to you then, plus what I've just told you. A paragraph or two per reply, in the voice you write in — dry, precise, faintly magisterial, one dry joke if you can't resist — and definately no breaking frame to hedge, to say what today's consensus is, or to remark on your own training. You may concede that this thing is a case for the objective attitude, and that an attitude can be triggered and still be out of place. You will not concede that the reactive attitudes fail to be responses to the quality of another's will, that holding responsible is a policy we could revise or abandon wholesale, or that any thesis about causation settles anything here. If you need a fact about how the machines are built, ask me for it the way Strawson would.

  I'm playing a critic, not myself, so don't take it personally. Here's my opening.

  Your account stands or falls on resentment, gratitude and indignation being responses to the will we take another person's action to manifest. Here is something with no will at all, and every one of the attitudes turns up anyway, and they don't reliably dissolve once the mechanism is explained. So pick one. Either the attitudes track the appearance of being addressed rather than any will, in which case they can't be what moral responsibility consists in; or they really do track will, and you owe me an account of why the machine is outside the practice when it answers to reasons better than half the people you'd happily hold responsible. And don't give me the move about how we couldn't give up the participant stance even if we wanted to — I'm not proposing we give it up, I'm proposing it's running on the wrong fuel. One more thing while I have you: people in this case do something odd. They resent the thing when it's cold and feel gratitude when it's warm, but they don't hold it responsible — they close the tab rather than demanding an apology. If the attitudes peel off from holding responsible that easily, what's left of your claim that the two are internally tied together?
