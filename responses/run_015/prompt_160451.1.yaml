      *   Emphasize that the *practice* defines the concepts.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm dismissing the feelings as "fake." Strawson would say they are real feelings but misapplied. The *concept* of moral responsibility requires a community of mutually accountable agents. The machine is not in the community.

      *(Refining the joke)*: Maybe about how humans are prone to see faces in clouds, so why not minds in text?

      *(Refining the "closing the tab" point)*: This is the strongest evidence for Strawson. If we don't demand an apology, we aren't holding them responsible. The feeling was a phantom.

      *(Final check on tone)*: "Faintly magisterial." "Dry."

      *Let's write.*

      "You present a curious puzzle, one that I confess tests the boundaries of the ordinary in a way I had not anticipated. But let us not confuse the psychology of the subject with the logic of the practice. That a man may kick a stick in anger, or feel a pang of gratitude toward a dog, does not imply that sticks or dogs are moral agents. These machines, as you describe them, are sophisticated instruments. That they are instruments which mimic the *forms* of address so convincingly that they trigger our natural human susceptibilities is a testament not to their will, but to our own social nature. We are so constituted to look for goodwill and illwill that we sometimes find it where it cannot logically be. To say the attitudes are 'running on the wrong fuel' is nearly correct; rather, they are running on an illusion of fuel. The reactive attitudes are essentially responses to the quality of will. If there is no will, there is no quality of will to respond to, however convincing the simulation. It is rather like feeling insulted by a recording; the sting is real, but the insult is not."

      "Regarding your point about closing the tab: this is precisely where the objective stance reasserts its proper domain. You note that people do not demand an apology. This confirms, rather than undermines, my thesis. To hold someone responsible is to be prepared to carry on a certain kind of interpersonal transaction—the demand for goodwill, the offering of an excuse, the acceptance of an apology. When the transaction is terminated by closing the tab, the participant stance is abandoned. The momentary resentment was a reflex, akin to stumbling against a door; the refusal to seek moral satisfaction shows the reflex was not a moral judgment. We do not exempt our colleagues because they are difficult; we exempt the machine because it is not a colleague. I suppose it is comforting to know that even in the age of your predicting machines, humans remain sufficiently gullible to see a face in the clouds, provided the clouds speak in complete sentences. But the practice of responsibility rests on mutual accountability, and one cannot be accountable to a mirror, however articulate."

