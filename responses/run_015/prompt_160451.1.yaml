      *   The "closing the tab" action is the decisive moment. It shows we recognize the lack of reciprocal demand.
      *   Conclusion: The theory stands. The attitudes are tied to the demand for goodwill. Where no goodwill is possible, the attitude is misplaced, even if felt.

