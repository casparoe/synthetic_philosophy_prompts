          *   *Let's go with the "Surprise" example.*
          *   *Okay, I'll settle on advising them to use **"The fact that it was requested."**"*
          *   *Wait, I need to push back on the "Defeasible Generalism" point.* I need to make sure they know the term is often "Holism vs. Atomism" or "Principles as Defaults."
          *   *Okay, let's finalize the plan.*

      *(Refining the Epistemology Pushback)*: If you start with epistemology, students think Particularism is about *how we learn* (psychology). But it's about *what makes acts right* (metaphysics). If you don't establish the metaphysical flip first, the epistemology looks like subjectivism.
      *(Refining the Example)*: I will suggest **"The fact that it makes someone laugh."**
      *   Case 1: Comedy club. Good.
      *   Case 2: Nervous laughter at a tragedy. Bad.
      *   Case 3: Mocking laughter. Bad.
      *   *Why:* It avoids "harm" and "lying." It's about *amusement*.
      *   *Generalist:* "Laughter is good *ceteris paribus*."
      *   *Particularist:* "In Case 2, the laughter *adds* to the tragedy's horror."

      *(Refining the Misconceptions)*:
      *   Relativism: Address immediately after defining Particularism.
      *   Spooky Intuition: Address during the Epistemology section (Wine analogy).
      *   Defeasible Generalism: Address in the final comparison.

      *(Refining the Scope)*:
      *   Refuse to solve the "So how DO we decide?" question.
      *   Refuse to discuss Moral Skepticism.

      *(Refining the Final Question)*:
      *   "Can a feature be a reason in one case and no reason in another, without any other principle explaining the difference?"

      *Wait, I need to make sure I don't write the lecture.* I will structure this as a memo to the instructor.

      *Let's check the Defeasible Generalism point.* The instructor calls it "defeasible generalism." The literature often calls this "Prima Facie Duties" (Ross) or "Default Reasons." The key distinction is whether the default status is *codifiable*. Particularists say no. I need to make sure the instructor nails this.

