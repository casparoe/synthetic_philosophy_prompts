prompt: |-
  Hey — quick favour. I've got a fifty-minute section Thursday at 9am with first-years in Intro to Ethics, and the slot I've been given is moral particularism versus generalism. Don't write the lecture for me; I want a plan for it, and I want you to push back where you think I've got it wrong.

  Where they are: they've done act utilitarianism and a week of Kant, so they arrive pretty convinced that moral judgement just is applying a rule, while at the same time about half of them think *just be a good person, don't be a rule-follower* is a profundity. So I'm fighting on two fronts at once and I keep losing the second half of the room.

  The thing I actually want you to argue with me about: I'm tempted not to open with the standard move — that a consideration which is a reason in one case can be no reason at all, or a reason the other way, in another. Instead I want to start from the epistemology: the thought that learning to see a situation aright is closer to learning to read an x-ray or taste wine than to learning a formula, and only then ask whether what you've learned could in principle be written down as principles. Is that order backwards? What specifically breaks if the valence-flip material comes second rather than first?

  Then: one carrying example. It has to be a case where the same feature unambiguously flips, and where the flip is not just the feature getting outweighed by something weightier. Tell me what the example needs to have and what it needs to lack — my worry is that if I reach for anything involving lying, promises, or harm to persons, they'll just grab hold of deontology and stop listening to me.

  Misconceptions I'm expecting: particularism equals relativism or anything goes; particularism equals some spooky intuition-faculty; and the one I think will really bite — they'll treat *lying is pro tanto wrong* as already settling the question, because for them any true generalisation counts as a principle. Where in the sequence do I head each one off? And can you get them to see daylight between a mere default reason and a pro tanto principle? There's a generalist position where principles are only ever defaults — I think the label is defeasible generalism, tell me if I've got that wrong — and I don't want them concluding that this generalist has simply capitulated and renamed themselves.

  Last two things: what should I explicitly refuse to cover at this level and say out loud that I'm refusing? And give me one question to put on the board at the end that would show me they've got the disagreement itself in view, rather than just being unsettled.
