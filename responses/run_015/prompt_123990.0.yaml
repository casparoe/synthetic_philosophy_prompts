      *   **Topic:** Moral Particularism vs. Generalism.
      *   **Student Background:** Done Act Utilitarianism & Kant. Think morality = applying rules (Kant/Util) OR "just be good" (vague intuition).
      *   **Instructor's Goal:** Wants a *plan*, not a script. Wants *pushback* on specific pedagogical choices.
      *   **Specific Constraint 1 (The Opener):** Instructor wants to start with *epistemology* (moral perception like wine tasting/x-rays) rather than the standard *ontology/semantics* move (valence flipping). Asks: Is this order backwards? What breaks?
      *   **Specific Constraint 2 (The Example):** Needs one carrying example where a feature *flips* valence (not just outweighed). Must avoid lying/promises/harm (triggers deontology/utilitarianism reflexes).
      *   **Specific Constraint 3 (Misconceptions):** Particularism $\neq$ Relativism; Particularism $\neq$ Spooky Intuition; Generalism $\neq$ Just "Default Reasons" (Defeasible Generalism). Needs to distinguish *pro tanto* principles from defaults.
      *   **Specific Constraint 4 (Scope):** What to explicitly *exclude*?
      *   **Specific Constraint 5 (Assessment):** One final board question to check understanding of the *disagreement*, not just confusion.

  2.  **Deconstruct the "Epistemology First" Strategy:**
      *   *Instructor's Idea:* Start with moral perception (learning to see) vs. rule application. Then ask if this can be codified.
      *   *My Critique:* This is risky with first-years. Why? Because "moral perception" sounds suspiciously like "spooky intuition" (one of the identified misconceptions). If you start there, the Kantians will dig in ("So you're saying reason doesn't matter?") and the "just be good" crowd will nod off thinking you agree with them.
      *   *The "What Breaks" Analysis:* The standard move (valence flipping) establishes the *phenomenon* that needs explaining. The epistemological move assumes the phenomenon is already accepted. If you start with epistemology, students might think you're talking about *how we know* (psychology) rather than *what makes it true* (metaphysics/semantics). Particularism is primarily a claim about the structure of moral reasons, not just how we learn them.
      *   *Recommendation:* Keep the epistemology, but use it as the *payoff*, not the setup. Use the valence flip to force the crack in the generalist armor, *then* offer particularism as the epistemological solution to that crack.

  3.  **Develop the "Carrying Example":**
      *   *Constraints:* Must flip valence (positive to negative or vice versa). Must not be outweighed (holism vs. atomism). Must avoid lying/promises/harm (too much baggage).
      *   *Idea 1:* Pleasure. (Utilitarian baggage).
      *   *Idea 2:* Obedience. (Too close to authority/Kant).
      *   *Idea 3:* Aesthetic/Non-moral analogies? (Good for illustration, bad for the core moral argument).
      *   *Idea 4:* "Surprise."
      *   *Idea 5:* "Doing something because it was requested."
      *   *Selected Idea:* **Humor/Amusement.** Or **Pain in a medical context.**
      *   *Better Idea:* **Copying/Imitation.**
      *   *Best Idea (Philosophical Standard):* **The pleasure of another's suffering (Schadenfreude) vs. The pleasure of a friend's success.** Wait, that's "pleasure."
      *   *Let's try "Doing what your father did."*
          *   Case A: Father was a hero. Imitating him is good.
          *   Case B: Father was a villain. Imitating him is bad.
          *   *Problem:* Students might say "The principle is 'Imitate good fathers'." That's a more complex principle, not a flip.
      *   *Let's try "Causing Pain."* (Instructor said avoid harm to persons).
      *   *Let's try "Breaking a Convention."*
      *   *Let's try "Being Amused."*
          *   Case A: Laughing at a joke. Good.
          *   Case B: Laughing at a funeral. Bad.
          *   *Problem:* Contextual relevance. Generalists say "It's not the laughter, it's the disrespect."
      *   *The Gold Standard for Particularism:* **Dancy's examples.** Usually involve pain or promises. Since those are banned...
      *   *New Candidate:* **The feature of "Being Unusual."**
          *   Case A: A surprise party. Being unusual is good.
          *   Case B: A surprise exam. Being unusual is bad (or neutral).
          *   *Critique:* Too trivial.
      *   *New Candidate:* **The feature of "Doing it for money."**
          *   Case A: Working a job. Good/Neutral.
          *   Case B: Donating blood for money (in some contexts) / Marrying for money. Bad.
          *   *Case C:* Being paid to test safety equipment. Good.
          *   *Refinement:* **"Acting from a motive of financial gain."**
          *   *Scenario 1:* A car salesman selling you a car. The fact he makes money is neutral/expected.
          *   *Scenario 2:* A friend recommending a restaurant. If he makes money, it's a strike against the recommendation (bad).
          *   *Scenario 3:* A whistleblower. If they are paid, it might undermine the moral worth (bad), OR it might enable them to live (good).
          *   *Wait, I need a valence flip of the *same* feature.*
          *   *Let's go with "Causing Pain" but sanitize it.* No, instructor said avoid harm.
          *   *Let's go with "Breaking a Rule."*
          *   *Let's go with "Being Spontaneous."*
          *   *Okay, let's look at Dancy's actual preferred non-harm examples.* Often aesthetic. But this is ethics.
          *   *How about "The fact that it would make her happy."*
          *   *Case A:* Making a depressed friend happy. Good.
          *   *Case B:* Making a malicious rival happy (who will use confidence to do harm). Bad.
          *   *Generalist Counter:* "It's not happiness, it's *undeserved* happiness."
          *   *Particularist Reply:* That just pushes the principle back.
      *   *Decision:* I will recommend **"The fact that she asked me to do it."** (Consent/Request).
          *   Case A: She asks for help moving. Doing it is good.
          *   Case B: She asks me to lie for her. Doing it is bad.
          *   *Wait, that's easy for generalists.* "Principle: Do what is asked unless immoral."
      *   *Okay, the hardest one:* **"The fact that it is dangerous."**
          *   Case A: Dangerous driving. Bad.
          *   Case B: Dangerous rescue mission. Good.
          *   *Generalist:* "It's the *unnecessary* danger that's bad."
          *   *Particularist:* "No, the danger contributes to the heroism."
      *   *Actually, the best one for first-years that avoids deontology traps:* **"The fact that it is illegal."**
          *   Case A: Stealing. Illegal adds to wrongness.
          *   Case B: Hiding refugees in Nazi Germany. Illegal adds to *rightness* (civic disobedience).
          *   *Risk:* Students might say "The principle is 'Obey just laws'."
      *   *Okay, I need to advise the instructor on what the example needs.* It needs to be a feature that is *intrinsically* attractive or unattractive in isolation but flips in context.
      *   *Recommendation:* **"The fact that it causes pain."** (I know they said avoid harm, but medical/dental is the only way to make this work cleanly without triggering "harm to persons" in the violent sense).
      *   *Alternative:* **"The fact that I promised."** (They said avoid promises).
      *   *Okay, I have to respect the constraint.*
      *   *Idea:* **"The fact that it is expensive."**
          *   Case A: Buying a gift. Expensive = generous (Good).
          *   Case B: Paying a bribe. Expensive = corrupt (Bad).
          *   Case C: Fixing a leak. Expensive = wasteful (Bad).
      *   *Let's go with **"The fact that it is done out of love."**"*
          *   Case A: Caring for a sick parent. Good.
          *   Case B: Smothering a partner/child (helicopter parenting). Bad.
          *   *Why this works:* It's a motive/feature. Generalists say "Love is good *ceteris paribus*." Particularists say "In the smothering case, the love *makes it worse* (possessive), not just fails to make it good."
      *   *Wait, I need to tell them what the example needs to lack.* It must lack a "hidden variable" explanation.

  4.  **Addressing Misconceptions:**
      *   *Relativism:* Need to distinguish "context-dependent" from "person-dependent."
      *   *Spooky Intuition:* Link back to the epistemology (wine tasting is a skill, not magic).
      *   *Defeasible Generalism:* This is crucial. The distinction between a *principle* (holds in virtue of the feature) and a *default* (holds unless...). Dancy argues that if it's defeasible, the feature isn't doing the work alone.
      *   *Sequence:* Hit Relativism early (when defining particularism). Hit Spooky Intuition when discussing epistemology. Hit Defeasible Generalism at the end (the "so what's the difference?" moment).

  5.  **Scope Refusal:**
      *   Don't cover Moral Dilemmas.
      *   Don't cover Moral Skepticism.
      *   Don't try to prove Particularism is *true*, just that it's *coherent* and distinct.

  6.  **Final Question:**
      *   Needs to show they see the *structural* disagreement.
      *   "If you had to teach a robot to be moral, could you write the manual?" (Too cliché).
      *   "Does the feature 'causing pain' have a moral valence before we look at the situation?"

  7.  **Drafting the Plan (incorporating the pushback):**
      *   *Tone:* Collegial, direct, respectful of their expertise but firm on the pedagogy.
      *   *Structure:*
          1.  Pushback on Epistemology First.
          2.  The Example (Constraints & Suggestion).
          3.  The Sequence (Handling Misconceptions).
          4.  Scope Refusal.
          5.  The Final Question.

      *(Self-Correction during drafting)*: I need to be careful not to write the lecture. I need to give the *plan* and the *argument* about the plan.
      *   *On Epistemology:* I need to explain *why* starting there fails. It conflates *justification* with *discovery*. First-years will think "Oh, so morality is feelings."
      *   *On the Example:* I'll suggest "The fact that it benefits a friend." (Nepotism vs. Loyalty).
          *   Case A: Hiring the best candidate who happens to be a friend. (Benefit to friend is neutral/good).
          *   Case B: Hiring a less qualified friend. (Benefit to friend is corrupting/bad).
          *   *Wait, Generalist says:* "Principle: Benefit friends unless it violates fairness."
          *   *Particularist:* "In Case B, the benefit to the friend *is* the corruption."
          *   *Actually, let's stick to the "Danger" example but refine it.* It's visceral.
          *   *No, let's go with **"The fact that I want to do it."** (Desire).*
          *   *Case A:* Wanting to help. Good.
          *   *Case B:* Wanting to hurt. Bad.
          *   *Case C:* Wanting to save the world (obsessively). Bad.
          *   *Okay, I will advise them on the *structure* of the example rather than dictating one, but offer a strong candidate.* I'll suggest **"The fact that it is against the rules."** (Illegal/Forbidden).
          *   *Why:* First-years understand rules.
          *   *Flip:* Speeding (Bad) vs. Speeding an ambulance (Good).
          *   *Generalist Trap:* "The principle is 'Don't break rules unless emergency'."
          *   *Particularist Move:* "The rule-breaking *contributes* to the good in the ambulance case (urgency)."
          *   *Actually, the "Pain" example is the strongest philosophically, even if they said avoid harm.* I will argue they should use *Medical Pain*. It's not "harm to persons" in the violent sense. It sidesteps the "harm is bad" axiom.
          *   *Wait, I should respect the constraint.* I'll propose **"The fact that it costs money."**
