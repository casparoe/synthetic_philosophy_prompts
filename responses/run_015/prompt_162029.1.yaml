      *   FH: Does truth-telling here violate *my* humanity? Or does lying violate *theirs*? If I lie, I manipulate them. If I tell truth, I reveal info. FH usually demands truthfulness unless there is a conflicting duty.
      *   *Conclusion remains:* Under strict Kantian interpretation, especially with Constraint (2) (no consequences/character), FH does not permit lying in ordinary professional contexts where FUL forbids it. The manipulation of the will is inherent to the lie itself, regardless of the outcome.

