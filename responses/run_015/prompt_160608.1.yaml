prompt: |-
  I teach a graduate seminar on method in the study of the historical Jesus, and I want to close the unit on the criteria of authenticity with something better than another face-off between two readings of the same evidence. Please draft the joint statement that two scholars could both sign after a good-faith adversarial collaboration. One is a criteria-optimist: she holds that the standard instruments — dissimilarity (including its doubled form), embarrassment, multiple attestation, coherence, and the language-and-environment criteria (Aramaic or Semitic phenomena in the Greek, Palestinian realia, first-century Galilean plausibility) — can, when used with discipline and in combination, settle a good deal about what Jesus said, did, and intended, and that abandoning them leaves nothing but unconstrained intuition about the tradition. The other is a criteria-sceptic: he holds that these instruments are, at best, defeasible rules of thumb capable of excluding a tradition but not of establishing one; that they are not independent of one another, because multiple attestation presupposes source criticism which already presupposes judgements about which traditions are old; that dissimilarity is guaranteed to return a figure unlike either his Jewish environment or the movement that preserved him, so that even a criterion that never erred would yield an unrepresentative result; and that the appearance of rigour comes from applying several mutually dependent heuristics and treating the convergence as confirmation. Assume both know the material perfectly well and have simply been arguing past each other for years.

  The document should begin with a numbered section of agreed claims — claims about what the sources are and how they reached us, about what would count as a successful inference to the best explanation here, and about what nobody seriously claims (for instance, that the tradition is transparent, or that we can recover Jesus' self-understanding in the way a modern biographer would want). State the residual disagreements in a table, each row being one crux, with the optimist's own formulation of her position in wording she would accept, the sceptic's in wording he would accept, the argument or test both agree would bear on that crux, and each side's prediction about it written down in advance. Among the cruxes I expect to see: whether the criteria are logically and probabilistically independent; whether the appropriate unit of assessment is the individual pericope or a broader narrative profile, with the criteria applied holistically; whether "authenticity" should give way to something like historical plausibility within a reconstructed Jewish context; whether the criteria can be calibrated at all — that is, whether one could run them over a body of sayings-tradition whose provenance is independently known, such as attributions to a later teacher or to a modern founder preserved through oral transmission, and measure a recovery rate, and what result each side would predict; and whether the thinness of the output is a defect of method or the correct epistemic posture toward this material. Where a crux is empirical, name the finding that would in principle settle it; where it is methodological, name the argument. If you conclude that some part of the dispute is verbal rather than substantive, mark it as such and say what either party would have to do to make it bite. Include, finally, a short closing section in which each side states what would make it abandon its own position.

  Two constraints on how you write it. First, the statement should be self-contained and usable by a reader with no library: no citations, no bibliographies, no appeals to particular books, articles, or recent scholarship, and where a claim would depend on a contested textual or archaeological detail, flag it as depending on that detail rather than asserting it. Second, it should be written in a voice that gives nothing away: a reader who did not know should not be able to tell which of the two drafted it, and the agreed-claims section should contain nothing either side would regard as a concession smuggled in by the other.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement signed by two scholars (a Criteria-Optimist and a Criteria-Sceptic) after an adversarial collaboration.
      *   **Context:** Closing a graduate seminar unit on methods in Historical Jesus studies.
      *   **Goal:** Move beyond a simple face-off of readings; show productive disagreement and shared ground.
      *   **Characters:**
          *   *Optimist:* Believes standard criteria (dissimilarity, embarrassment, multiple attestation, coherence, language/environment) can settle a good deal when used rigorously. Fears abandoning them leads to unconstrained intuition.
          *   *Sceptic:* Believes criteria are defeasible rules of thumb (good for exclusion, bad for establishment). Sees them as interdependent/circular. Argues dissimilarity yields an unrepresentative figure. Sees rigor as illusory convergence of dependent heuristics.
      *   **Structure:**
          1.  Numbered section of Agreed Claims (sources, inference, what nobody claims).
          2.  Table of Residual Disagreements (Crux, Optimist's formulation, Sceptic's formulation, Agreed Test/Argument, Predictions).
          3.  Specific Cruxes to include: Logical/probabilistic independence, Unit of assessment (pericope vs. profile), Authenticity vs. Historical Plausibility, Calibration (testing on known data), Thinness of output (defect vs. correct posture).
          4.  Verbal vs. Substantial disputes marker.
          5.  Closing Section: Conditions for abandoning position.
      *   **Constraints:**
          *   Self-contained (no citations/bibliography).
          *   Neutral voice (cannot tell who drafted it).
          *   Agreed claims must not be smuggled concessions.

  2.  **Drafting - Section 1: Agreed Claims:**
      *   *Goal:* Establish common ground without diluting the disagreement. Both sides agree on the nature of the problem, even if they disagree on the solution.
      *   *Content:*
          *   Nature of Sources: Gospels are theological narratives, not transcripts. They involve oral transmission and redaction.
          *   Gap: There is a gap between the historical Jesus and the texts.
          *   Inference: We are doing inference to the best explanation (IBE).
          *   Negatives: No one claims transparency, no one claims access to inner self-consciousness (modern biography), no one claims absolute certainty.
          *   Necessity of Method: Intuition alone is insufficient; some heuristic is required.
      *   *Tone Check:* Ensure the Optimist doesn't feel the Sceptic weakened the sources too much, and the Sceptic doesn't feel the Optimist overstated their reliability.
      *   *Drafting thought:* Keep it dry and methodological. Use terms like "mediated," "tradition," "probability."

  3.  **Drafting - Section 2: Residual Disagreements (The Table):**
      *   *Goal:* Clarify *where* they disagree and *how* it could be resolved.
      *   *Columns:* Crux, Optimist's Position, Sceptic's Position, Agreed Test/Argument, Predictions.
      *   *Crux 1: Independence of Criteria.*
          *   Opt: They are distinct filters; convergence increases probability.
          *   Skep: They are entangled; convergence is illusory.
          *   Test: Formal probabilistic modeling or calibration on control groups.
      *   *Crux 2: Unit of Assessment.*
          *   Opt: Individual pericope/ saying can be isolated and tested.
          *   Skep: Must assess broader narrative profile; context determines meaning.
          *   Test: Application to a specific complex tradition (e.g., Temple action).
      *   *Crux 3: Authenticity vs. Plausibility.*
          *   Opt: "Authenticity" (did he say/do it?) is the goal.
          *   Skep: "Historical Plausibility" (does it fit the context?) is the max achievable goal.
          *   Test: Definition of success conditions.
      *   *Crux 4: Calibration.*
          *   Opt: If applied to known data (e.g., later rabbis), criteria would show high recovery rates.
          *   Skep: If applied to known data, criteria would show high false-negative/positive rates.
          *   Test: Blind study on a controlled tradition (e.g., 19th-century oral traditions about a founder).
      *   *Crux 5: Thinness of Output.*
          *   Opt: A thin result is the honest cost of rigor.
          *   Skep: A thin result proves the method is broken (since we know Jesus had an impact).
          *   Test: Comparison with impact of other historical figures with similar evidence profiles.
      *   *Verbal Dispute Check:* Is "Authenticity" vs "Plausibility" just semantic? Mark it if the underlying reality claim is the same but the label differs. (Decided: It's substantive because it changes the claim made).

  4.  **Drafting - Section 3: Closing Conditions (Falsification):**
      *   *Goal:* What would change their minds?
      *   *Optimist:* If calibration fails systematically. If criteria yield contradictory results on clear cases.
      *   *Sceptic:* If a calibrated test shows high reliability. If an alternative method produces better explanatory power without intuition.
      *   *Tone:* Humble but firm.

  5.  **Review and Refine:**
      *   *Voice Check:* Is it neutral? Avoid "obviously," "clearly." Use "We agree," "We disagree."
      *   *Constraint Check:* No citations? Yes. No library needed? Yes.
      *   *Content Check:* Did I cover all specific cruxes requested? (Independence, Unit, Authenticity/Plausibility, Calibration, Thinness). Yes.
      *   *Nuance:* Ensure the Optimist doesn't sound naive (she knows the difficulties) and the Sceptic doesn't sound nihilistic (he wants history, just thinks current tools are flawed).
      *   *Formatting:* Use clear headings and a markdown table.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the Agreed Claims, make sure not to imply the Gospels are *only* theology (Optimist objection) or *mostly* history (Sceptic objection). Stick to "theological narratives preserving tradition."
      *   *Correction:* In the Calibration crux, ensure the "control group" is described generally so no specific archaeological detail is needed.
      *   *Correction:* Ensure the "Verbal Dispute" note is included where appropriate.
      *   *Correction:* Make sure the "Predictions" column is specific about what each expects to happen in the test.

  7.  **Final Output Generation** (Proceeding to generate the response based on these steps).
answer: |-
  # JOINT STATEMENT ON THE CRITERIA OF AUTHENTICITY
  **Prepared following Adversarial Collaboration**

  ### I. AGREED CLAIMS REGARDING SOURCES AND METHOD

  1.  **The Nature of the Sources:** We agree that the primary sources available for the study of the historical Jesus are theological narratives composed in Greek, dating from the latter half of the first century and beyond. These texts preserve oral and written traditions that circulated among early followers. We agree that these traditions were shaped by the needs of the early movement, including preaching, teaching, and controversy, prior to and during their inscription.
  2.  **The Epistemic Gap:** We agree that there is no direct access to the voice or actions of Jesus of Nazareth. All access is mediated through the sources described above. Consequently, no conclusion regarding specific sayings or actions can claim absolute certainty; all historical claims are probabilistic.
  3.  **Inference to the Best Explanation:** We agree that the task is to construct a historical hypothesis that best explains the rise of the early Jesus movement and the specific character of the tradition preserved. A successful inference must account for the data of the texts while remaining coherent with what is known of first-century Palestinian Judaism and the broader Greco-Roman environment.
  4.  **Limits of the Enterprise:** We agree that no serious scholar claims the tradition is transparent (i.e., that the text reports events exactly as they occurred without interpretation). We further agree that it is not possible to recover Jesus' inner self-understanding or psychological state in the manner of a modern biographer. Claims about "what Jesus intended" are inferences from public action and speech, not access to private consciousness.
  5.  **The Necessity of Heuristics:** We agree that uncontrolled intuition is insufficient for academic history. Some set of explicit controls or heuristics is required to distinguish between what the early church *could* have created and what it *likely* inherited. We disagree on the name, logical status, and reliability of these controls, but we agree that some methodological discipline is required to prevent the historian from merely recreating Jesus in their own image.

  ### II. RESIDUAL DISAGREEMENTS AND TESTABLE CRUCES

  The following table outlines the specific points of divergence. Where a dispute is marked as [Verbal], the disagreement concerns terminology rather than the underlying historical reality; to make such a dispute bite, the parties must agree on a definition that carries different empirical consequences.

  | Crux | Optimist's Formulation | Sceptic's Formulation | Agreed Test / Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Logical & Probabilistic Independence** | The standard criteria function as distinct filters. When a tradition satisfies multiple independent criteria (e.g., dissimilarity and multiple attestation), the probability of authenticity increases multiplicatively. | The criteria are mutually entangled. Applying one (e.g., multiple attestation) presupposes source judgments that already rely on assumptions about age and origin, which are themselves based on criteria like dissimilarity. Convergence is illusory. | **Formal Modeling:** Construct a Bayesian network modeling the dependencies between criteria. Apply to a dataset of traditions. | **Opt:** The model will show that satisfying >2 criteria significantly raises posterior probability.<br>**Skep:** The model will show that the criteria correlate so highly that satisfying multiple adds negligible probability over satisfying one. |
  | **2. Unit of Assessment** | The individual pericope (saying or action unit) is the primary unit of assessment. Criteria can be applied to discrete sayings to isolate authentic kernels from later accretion. | The broader narrative profile or "gestalt" is the primary unit. Sayings cannot be stripped from their narrative context without losing the meaning required to assess them. Criteria must be applied holistically to a complex of tradition. | **Blind Analysis:** Both parties assess a specific complex tradition (e.g., a controversy dialogue). Opt isolates specific verses; Skep assesses the whole unit. Compare results against a third-party consensus on the *type* of tradition. | **Opt:** Isolated verses will align better with the reconstructed Jewish context than the surrounding narrative.<br>**Skep:** The isolated verses will be unintelligible or misclassified without the narrative frame; the whole unit will show higher coherence. |
  | **3. Authenticity vs. Historical Plausibility** | The goal is "Authenticity": determining whether a specific tradition derives from the historical Jesus. This is a binary (or near-binary) historical fact. | The goal is "Historical Plausibility": determining whether a tradition is consistent with a Jesus reconstructed within his Jewish context. "Authenticity" implies a precision the data cannot support. **[Verbal/Substantive Hybrid]** | **Definition of Success:** Agree on a specific claim (e.g., "Jesus spoke this aphorism"). Opt claims this is a valid historical conclusion; Skep claims only "This is consistent with Jesus" is valid. | **Opt:** A claim of authenticity is falsifiable and therefore scientific.<br>**Skep:** A claim of authenticity is usually unfalsifiable; plausibility is the only honest epistemic posture. |
  | **4. Calibration (The Control Group Test)** | If applied to a body of tradition where the provenance is independently known (e.g., sayings of a later teacher preserved orally then written), the criteria would demonstrate a high recovery rate of genuine material. | If applied to a control group, the criteria would demonstrate high rates of false negatives (rejecting genuine material via dissimilarity) and false positives (accepting later material via coherence). | **Calibration Study:** Apply the criteria to a controlled dataset (e.g., 19th-century oral traditions about a religious founder where the original words are recorded). Measure sensitivity and specificity. | **Opt:** The criteria will correctly identify the core authentic material at a rate significantly above chance.<br>**Skep:** The criteria will fail to identify the core material or will validate later legendary accretions as authentic. |
  | **5. The Thinness of Output** | A "thin" portrait of Jesus (limited secure data) is the honest cost of rigorous method. It is better to know less with confidence than more with speculation. | A "thin" portrait is a *reductio ad absurdum* of the method. We know Jesus had a public impact and gathered followers; a method that renders him historically inert is defective. | **Comparative Impact:** Compare the "secure" data profile of Jesus with other historical figures of similar social impact (e.g., other prophetic figures) where more data exists. | **Opt:** The thinness reflects the scarcity of evidence, not the failure of method.<br>**Skep:** The thinness reflects the criteria's inability to handle typical evidence for ancient figures; the method is too restrictive. |

  **Note on Crux 3:** We acknowledge that part of the dispute over "Authenticity" vs. "Plausibility" is verbal. To make this substantive, the Optimist must produce a case where "Authenticity" yields a specific historical prediction that "Plausibility" does not. The Sceptic must show that "Plausibility" allows for historical constraints that "Authenticity" ignores. Until then, this remains a disagreement about the labeling of probability thresholds.

  ### III. CONDITIONS FOR ABANDONING POSITIONS

  **Statement from the Optimist:**
  I would abandon the position that the criteria are reliable instruments for establishing authenticity if:
  1.  **Calibration Failure:** A controlled study (as described in Crux 4) demonstrates that the criteria systematically fail to identify known authentic material or systematically validate known inauthentic material.
  2.  **Systematic Contradiction:** It is demonstrated that applying the criteria rigorously to the same dataset yields contradictory results that cannot be resolved by refining the definitions of the criteria.
  3.  **Superior Alternative:** A rival method is proposed that accounts for the same data with greater explanatory power and less reliance on intuition, and that method successfully passes the calibration test.

  **Statement from the Sceptic:**
  I would abandon the position that the criteria are merely defeasible heuristics incapable of establishing authenticity if:
  1.  **Calibration Success:** A controlled study demonstrates that the criteria, when applied with discipline, recover known authentic material with a high degree of sensitivity and specificity, exceeding standard historical heuristics.
  2.  **Independence Proof:** It is demonstrated mathematically or logically that the criteria operate independently enough that their convergence significantly alters probability, rather than merely reinforcing prior assumptions.
  3.  **Explanatory Necessity:** It is shown that abandoning the criteria leads to historical constructions that are demonstrably less coherent with the known data of first-century Judaism and the rise of the movement than constructions built using the criteria.

  ***

  **Signed,**

  _________________________
  (Criteria-Optimist)

  _________________________
  (Criteria-Sceptic)

