          *   *Analysis:* Jonas dismisses the epistemic worry as standard induction problem.
          *   *Weakness:* It's not *just* a standard induction problem. In acausal trade, the "reference class" determines the *causal* (or logical) structure. In standard induction, the reference class affects probability estimates. In FDT, it affects *agency boundaries*.
