      *Refining Move 2:* Rae isn't necessarily wrong if the correlation is merely statistical. If Andromeda builds because of a religious rule *independent* of my code, but we happen to align, Rae is right. If they build because they simulate me or run my code, Jonas is right. The prompt says "each runs roughly similar reasoning." This implies logical correlation, favoring Jonas, but Rae's skepticism about the *degree* is valid.

