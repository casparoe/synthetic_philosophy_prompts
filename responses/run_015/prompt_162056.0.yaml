answer: |-
  This is a sophisticated debate that touches on one of the deepest unsolved problems in decision theory: **how to act when your choice is logically correlated with another's, but causally isolated.**

  Your flatmates are inadvertently reenacting a conflict between **Causal Decision Theory (CDT)** (Rae) and **Functional/Timeless Decision Theory (FDT/TDT)** (Jonas). Rae treats the other civilization as an external environment to be reacted to; Jonas treats the other civilization as a mirror of his own algorithm.

  Here is the move-by-move adjudication, followed by a summary of where the real errors and insights lie.

  ### Move-by-Move Adjudication

  **(1) Jonas: The Toy Case**
  *   **Claim:** With perfect correlation, building is a no-brainer (Pay 1, Get 10).
  *   **Verdict:** **Correct.**
  *   **Analysis:** In the idealized scenario where both parties run identical code and know it, the choice is effectively "Both Build" vs. "Neither Builds." Since $10 - 1 > 0$, building is the rational choice. This sets the correct baseline for acausal trade.

  **(2) Rae: The Marginal Impact Argument**
  *   **Claim:** Real correlation is partial. You should only pay for the *shift* you cause (5%), not the total probability.
  *   **Verdict:** **Right Logic, Wrong Premise.**
  *   **Analysis:** Rae is applying standard Causal Decision Theory. She asks: "Does my action *cause* their action?" If the answer is "no, it only correlates," she argues you shouldn't pay for the correlation.
  *   **The Mistake:** She treats the correlation as a fixed statistical fact (like weather) rather than a logical consequence of shared reasoning. If the correlation exists *because* you both reason similarly, then your reasoning *is* the cause, just not a causal-channel cause. However, her skepticism about the *strength* of that correlation is valid.

  **(3) Jonas: The Expected Value Error**
  *   **Claim:** Building yields +8 expected value ($0.9 \times 10 - 1$).
  *   **Verdict:** **Genuine Mathematical Mistake.**
  *   **Analysis:** Jonas compares "Building" against "Getting Nothing." He ignores the counterfactual: "What if I didn't build?" This is a classic error in decision theory. You cannot evaluate an act in isolation; you must evaluate it against the alternative.

  **(4) Rae: The Counterfactual Correction**
  *   **Claim:** Not building yields +8.5 ($0.85 \times 10 - 0$). Since $8.5 > 8$, don't build.
  *   **Verdict:** **Decisive Win on Arithmetic.**
  *   **Analysis:** Rae correctly identifies Jonas's error in (3). Given the probabilities *she established in (2)*, her math is flawless. If the probabilities are fixed at 85%/90% regardless of the decision theory used, Rae wins this round. Defecting (not building) free-rides on the high baseline correlation.

  **(5) Jonas: The Policy/Algorithm Shift**
  *   **Claim:** Don't choose an act; choose a *policy*. A policy of "building when correlated" wins globally.
  *   **Verdict:** **Decisive Win on Theory.**
  *   **Analysis:** This is the strongest move in the debate. Jonas correctly identifies that in acausal trade, you are selecting an *algorithm*, not a single action. If you adopt the policy "Calculate marginal shift and defect if low," the other civilization (running similar reasoning) will also adopt that policy. The result is mutual defection. If you adopt "Build when correlated," they likely do too. Jonas moves the debate from "What should I do now?" to "What kind of agent should I be?" This bypasses Rae's arithmetic in (4) by changing the inputs.

  **(6) Rae: The Epistemic/Reference Class Objection**
  *   **Claim:** You can't optimize a policy because you don't know the distribution of partners or how to define the reference class.
  *   **Verdict:** **Strong Philosophical Objection.**
  *   **Analysis:** Rae hits the practical wall of FDT. To know if your decision correlates with Andromeda, you need to know if they are in your "reference class" (e.g., "rational agents"). But there is no objective fact about which reference class matters. This isn't just math; it's metaphysics. Rae is right that without empirical data on these correlations, the policy is blind.

  **(7) Jonas: The Standard Induction Defense**
  *   **Claim:** Reference class problems are generic; just pick the most specific class with predictive grip.
  *   **Verdict:** **Right but Beside the Point.**
  *   **Analysis:** Jonas dismisses the worry too easily. In standard science, reference classes affect *predictions*. In acausal trade, reference classes determine *agency*. If you put Andromeda in the wrong class, you don't just make a bad prediction; you fundamentally misidentify who is "you." Jonas treats this as a standard statistical error, but it is a structural one.

  ---

  ### The Three Key Battlegrounds

  To settle this for yourself, you need to see where they are actually disagreeing. It is not one argument, but three layers.

  #### 1. The Arithmetic Layer (Moves 3 & 4)
  *   **Winner: Rae.**
  *   Jonas made a basic expected utility error in (3). You must compare Build vs. Not-Build. Given Rae's probabilities, Not-Building yields higher expected value *for that specific instance*. Jonas cannot win on arithmetic alone if he accepts Rae's probabilities.

  #### 2. The Agency Layer (Moves 2 & 5)
  *   **Winner: Jonas.**
  *   This is the core of the dispute. Rae assumes the correlation is external (like two people both liking rain). Jonas assumes the correlation is internal (like two calculators both outputting "4" for "2+2").
  *   **The Missing Concept:** *Subjunctive Dependence.* If Andromeda builds because they run the same logic as you, then your decision *logically necessitates* theirs. It is not that you "shift" their probability by 5%; it is that you are both sampling from the same function. If you output "Build," the function outputs "Build" for both. Rae's 85%/90% split implies the correlation is imperfect noise. Jonas's policy argument implies that by committing to a policy, you tighten that correlation toward 100%. Jonas is right that rational agents should pre-commit to cooperation in symmetric games.

  #### 3. The Epistemic Layer (Moves 6 & 7)
  *   **Winner: Draw (Leaning Rae).**
  *   Rae is right that we lack the data to calculate these correlations. We have never observed an acausal trade. Jonas is right that we must act on *some* prior, but he glosses over how fragile that prior is. If you guess the correlation is high and it's actually low, you waste resources. If you guess it's low and it's high, you lose out on trade. Rae's skepticism is scientifically healthier; Jonas's confidence is theoretically bolder.

  ### Where Each Makes a Genuine Mistake

  *   **Jonas's Mistake:** In **(3)**, he ignored the counterfactual baseline. He also understates the difficulty in **(7)**; the reference class problem in acausal trade is harder than in standard induction because there is no feedback loop to correct your errors. You never find out if you were right.
  *   **Rae's Mistake:** In **(2)**, she treats logical correlation as causal influence. She assumes her action cannot "move" them unless there is a signal. In acausal trade, the "signal" is the logical structure of the decision itself. By demanding causal leverage, she rules out the phenomenon by definition.

  ### What Both Are Missing

  1.  **The Symmetry Assumption:** The argument only works if the civilizations are sufficiently similar. If Andromeda uses a different decision theory (e.g., they are CDT agents while Jonas is FDT), Jonas's policy fails. They assume symmetry without proving it.
  2.  **The "Newcomb" Problem:** This is structurally identical to Newcomb's Problem. Rae is acting like the "two-boxer" (take what's there, don't influence the predictor). Jonas is the "one-boxer" (act such that the predictor predicted well). In Newcomb's Problem, one-boxers generally walk away with more money *if* the predictor is accurate.
  3.  **The Cost of Deliberation:** Rae points out the cost of resources (1 unit). She misses the cost of *computation*. Determining the reference class (Move 6) might cost more than the trade is worth.

  ### Final Verdict

  **Who should you side with?**

  *   **On the Math:** Side with **Rae**. Jonas's calculation in (3) was objectively wrong.
  *   **On the Decision Theory:** Side with **Jonas**. His move in (5) correctly identifies that in acausal scenarios, you choose a *policy*, not an act. If you reason like Rae, you guarantee mutual defection in a symmetric scenario. If you reason like Jonas, you enable mutual cooperation.
  *   **On the Practicality:** Side with **Rae**. Her objection in (6) is the reason acausal trade remains a theoretical curiosity rather than a practical strategy. We simply do not know how to quantify the correlation.

  **The Adjudication:**
  Jonas wins the **philosophical** argument (this is how rational agents *should* work). Rae wins the **practical** argument (this is why we can't trust it to work).

  If you must place a bet: **Rae is safer, but Jonas is smarter.** Rae protects you from wasting resources on a hallucinated connection. Jonas opens the door to gains that Rae's framework literally cannot see. Since the cost is low (1 unit) and the upside is high (10 units), Jonas's "policy" is the better bet *if* you believe there is any non-zero chance of logical correlation. But Rae is right to demand more evidence before calling it a "no-brainer."

  **Recommendation:** Tell them Jonas is right about *what to do* (build the beacon), but Rae is right about *why it's hard to justify* (we can't prove the correlation). The decision to build is an act of faith in rationality, not a calculation of causality.
