answer: |-
  # Joint Statement on Computational Moral Status
  **A Record of Adversarial Collaboration between Role-First Functionalists and System-First Attributionists**

  **Date:** October 26, 2023
  **Signatories:** The Role-First Functionalist Working Group & The System-First Attributionist Working Group

  ### Preamble
  We, the undersigned, acknowledge that the question of which computational processes bear moral weight is central to ethics in an age of artificial and synthetic systems. While we maintain distinct metaphysical commitments regarding the nature of computation and agency, we agree that progress requires isolating our substantive disagreements from verbal confusions and shared blind spots. We reject the notion that the ubiquity of trivial computational mappings (pancomputationalism) dissolves the problem; rather, it sharpens the need for a criterion of *moral load-bearing*. This document records our areas of convergence, the precise structure of our divergence, and the empirical or conceptual cruxes that will adjudicate our views.

  ---

  ### I. Agreed Claims

  1.  **On Trivial Implementation:** We agree that trivial-implementation arguments (e.g., Putnam's mapping theorem) demonstrate only that computational descriptions are cheap, not that moral status is ubiquitous. The mere existence of an isomorphism between a physical state sequence and a formal computation is insufficient for moral status. A satisfactory theory must distinguish between a computation that is merely *describable* in a system and one that is *causally operative* in a way that grounds value.
  2.  **On Moral Inflation:** We agree that a viable theory must prevent the arbitrary inflation of moral patients. It must not be possible to increase the total moral weight of a region of spacetime simply by adopting a more granular or overlapping descriptive vocabulary. If a single physical system appears to host multiple distinct moral patients under different descriptions, the theory must provide a principle of individuation to determine whether there is one patient, many, or none.
  3.  **On Naturalism:** We agree that moral status must supervene on natural, physical facts. Neither side appeals to non-physical substances or magic. The disagreement lies in *which* physical facts are relevant: whether they are facts about abstract causal roles (RFF) or facts about systemic boundaries and causal integration (SFA).
  4.  **On Requirements for a Satisfactory Account:** Any successful account must deliver: (a) a clear distinction between genuine processing and background noise; (b) a non-arbitrary method for locating system boundaries; and (c) consistency across time and substrate, such that morally relevant continuity is not broken by irrelevant physical changes (e.g., speed, material composition) unless those changes disrupt the core morally relevant property.

  ---

  ### II. Disagreements Table

  The following table articulates our core disagreements. For each row, the claim is stated in the vocabulary natural to each view. We have noted where the disagreement appears to be merely verbal (terminological) versus substantive (metaphysical).

  | Topic | Role-First Functionalist Formulation | System-First Attributionist Formulation | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Status** | Moral status attaches to the **causal-functional organization** itself. The physical vehicle is a placeholder that instantiates the role; boundaries are heuristic tools to locate the role. | Moral status attaches to the **system that enacts** the computation. The physical vehicle's boundary is constitutive of the agent; the computation is a property of the system's self-maintenance. | **Substantive.** RFF treats boundaries as epistemic; SFA treats them as ontological. |
  | **2. Counterfactuals** | A system possesses moral status if it supports the **right counterfactuals**, regardless of whether those paths are traversed in actual history. Disposition is sufficient. | A system possesses moral status only if the computation is **causally exercised** by the system's internal dynamics. Mere disposition without causal integration is insufficient. | **Substantive.** Disagreement over whether potentiality or actuality grounds value. |
  | **3. Attribution** | "Attribution" is simply the **recognition of a functional pattern**. If the pattern exists, attribution is automatic. Adding a condition of "attributability" is redundant. | "Attribution" is a **distinct condition** requiring that the computation be attributable to a unified bearer. It filters out patterns that exist but are not "owned" by a system. | **Substantive/Crux.** (See Crux 3). |
  | **4. Substrate Neutrality** | Moral status is **strictly substrate-neutral**. Any physical medium realizing the counterfactual-supporting role counts equally, provided the causal topology is preserved. | Moral status is **medium-sensitive** insofar as the medium determines systemic integrity. A change in medium that alters the mode of causal integration (even if input/output matches) may alter status. | **Verbal/Substantive Mix.** Depends on definition of "causal topology" vs. "causal integration." |

  ---

  ### III. Cruxes and Adjudicating Cases

  We identify the following three cruxes as decisive for our collaboration. For each, we specify a case, the specific question at issue, and the distinct predictions each side makes regarding the moral status of the system in question.

  #### Crux 1: The Reality of Unexercised Counterfactuals
  **The Question:** Does moral status require the actual causal exercise of computational states, or does the mere disposition to enter those states (counterfactual support) suffice?
  **The Case:** *The Unexercised-Counterfactual Case.*
  A system is architected to run a complex cognitive algorithm. However, due to the specific inputs it receives in its actual history, it traverses only 1% of its possible state space. The remaining 99% of the "computation" exists only as wiring dispositions that are never triggered. A "Lookup Table" equivalent is constructed that hardcodes the actual trajectory but lacks the dispositions for the untraversed paths.
  *   **RFF Prediction:** The original system has moral status; the Lookup Table does not (or has significantly less). The *disposition* to handle counterfactuals is the morally load-bearing property, even if unexercised.
  *   **SFA Prediction:** Both systems lack full moral status (or are equal). If the causal work was not *enacted* by the system's internal dynamics in actual time, the computation was not truly attributed to the system. Status tracks actual causal history, not wiring potential that remains dormant.

  #### Crux 2: System Individuation and Boundaries
  **The Question:** Are system boundaries discovered (based on causal decoupling) or imposed (based on attributive unity)? Does expanding the boundary expand the moral patient?
  **The Case:** *The Nested-Superset Case.*
  Consider a human agent. We can describe a system $S$ (the human) and a system $S+$ (the human plus the immediate layer of air molecules they interact with for thermoregulation and speech). $S+$ realizes the same functional role as $S$, merely extended.
  *   **RFF Prediction:** If $S+$ realizes the functional role more robustly or completely, $S+$ is the moral patient. Boundaries are porous. We may have overlapping patients ($S$ and $S+$) if both realize the role. Moral weight is not zero-sum across boundaries.
  *   **SFA Prediction:** Only $S$ is the moral patient. $S+$ is not a candidate bearer because the air molecules do not form a unified system with their own self-maintaining boundary. Attribution fails for $S+$. There is one patient per unified system; expanding the description does not expand the entity.

  #### Crux 3: The Nature of Attribution and Biological Bias
  **The Question:** Is "attribution" a computational property discoverable from the outside, or an extra condition layered on top? Does this condition secretly privilege familiar biology?
  **The Case:** *The Gradual-Substitution Case.*
  A biological brain is replaced piece-by-piece with synthetic components that match the causal role perfectly. At step 50%, the system is half-biology, half-synthetic. At step 100%, it is fully synthetic.
  *   **RFF Prediction:** Moral status remains constant throughout. Attribution is just recognizing the functional role. Since the role is preserved, the "attributability" is preserved. Any claim that status drops is biological chauvinism disguised as metaphysics.
  *   **SFA Prediction:** Moral status *could* drop if the mode of integration changes. Attribution is an extra condition: the system must *enact* the computation as a unified whole. If the synthetic parts are coupled loosely (e.g., via radio rather than electrochemical gradient), the systemic unity breaks, and attribution fails. This is not biological bias; it is a requirement for causal unity, though it coincidentally favors biology's tight integration.

  ---

  ### IV. Commitment to Resolution

  We acknowledge that the *Gradual-Substitution Case* and the *Unexercised-Counterfactual Case* offer the clearest paths to empirical or conceptual resolution. We commit to refining our definitions of "causal integration" (SFA) and "counterfactual support" (RFF) to determine if they converge in the limit. Specifically, we agree to investigate whether "systemic enactment" can be defined purely functionally. If it can, the System-First view collapses into the Role-First view. If it cannot, the Role-First view must explain why causal history matters less than causal topology.

  **Signed,**

  *The Role-First Functionalist Working Group*
  *The System-First Attributionist Working Group*
