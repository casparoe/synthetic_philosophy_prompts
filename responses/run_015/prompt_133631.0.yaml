      *   **The Conflict:** Priya switches solutions mid-argument. First she argues Bayesianism (it confirms a little), then she argues Quineanism (it doesn't confirm at all because predicates aren't projectible). These are mutually exclusive strategies. Dan catches her on the Bayesian reliance on demographics, so she switches to Quine. Dan then catches her on Quine's vagueness.

