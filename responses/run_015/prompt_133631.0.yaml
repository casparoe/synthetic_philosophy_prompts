          *   *Claim:* This is the Quinean solution (projectibility). We should reject the Equivalence Condition for confirmation because "non-raven" isn't a natural kind.
          *   *Status:* This is a different solution than her first one. She's switching from Bayesian (degree of confirmation) to Quinean (projectibility).

