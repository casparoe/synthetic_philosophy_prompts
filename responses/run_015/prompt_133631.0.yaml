      *   **Priya's Counter:** "Not anything — a white raven would have killed the hypothesis outright. Only some observations can do that, and the asymmetry is real."
          *   *Claim:* Falsification is still stronger. There is an asymmetry between verification (tiny nudge) and falsification (death blow).
          *   *Status:* True in Popperian and Bayesian terms. A counter-example has high informational value.

