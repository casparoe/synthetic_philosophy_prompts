answer: |-
  # Q&A Prep Sheet: Intertemporal Reciprocity in Authoritarian Regimes

  **Audience Profile:** Institutional Empiricists (Majority), Rational Choice (2), Development Sociologist (1).
  **Key Vulnerability:** Normative language ("Consent") entering causal inference; lack of micro-data.
  **Strategy:** Reframe "Consent" as "Equilibrium Stability" and "Reciprocity" as "Dynamic Exchange."

  ---

  ### 1. The "Hope Nobody Asks" (Identification & Micro-Evidence)
  **Objection:** "You posit an implicit intergenerational trade-off. Do you have *any* micro-level survey or behavioral evidence that individual citizens actually make this calculation? Without observing the mechanism, isn't this just a post-hoc narrative imposed on aggregate data?"
  **Reply (2 mins):** I concede I cannot observe the cognitive calculation directly. However, in rational-choice terms, we treat this as a **latent variable identified by equilibrium conditions**, not surveyed attitudes. We observe the *implications* of the contract: specifically, the asymmetry in regime response to growth shocks. If legitimacy were purely coercive, growth stalls should trigger immediate repression spikes. If it were purely performance-based, stalls should trigger immediate unrest. My data shows a **lagged tolerance threshold**—citizens absorb short-term shocks consistent with a long-term horizon, only withdrawing support when the *trend* breaks, not just the level. This behavioral lag is the observable implication of the intertemporal mechanism.
  **Softest Point:** Relies on aggregate time-series inference; cannot rule out that the "lag" is due to repression capacity rather than citizen patience.
  **Flag:** **[DEPENDS ON EMPIRICAL DEMONSTRATION OF LAGGED EFFECTS]**
  **Note:** *This is the question I hope nobody asks. If asked, do not bluff. Acknowledge the data gap immediately.*

  ### 2. Conceptual Stretching (Performance Legitimacy)
  **Objection:** "This sounds exactly like 'Performance Legitimacy' (Huntington/Zhao). You are stretching the concept of 'consent' to describe what we already call output-based legitimacy. What is the added explanatory value?"
  **Reply (2 mins):** **STRATEGIC CONCESSION:** You are right that this builds on the performance legitimacy literature, and I should have been clearer that this is a *dynamic specification* of that model, not a rejection of it. Standard performance legitimacy is static: $Legitimacy_t = f(Growth_t)$. My argument is intertemporal: $Legitimacy_t = f(\sum \beta^t Expected Growth_{t+n})$. The explanatory value lies in predicting **regime collapse timing**. Performance legitimacy predicts instability immediately upon negative growth. Intertemporal reciprocity predicts stability during temporary dips, and collapse only when the *future discount factor* shifts. It explains why regimes survive recessions but fail during structural slowdowns.
  **Softest Point:** Distinguishing "temporary dip" from "structural slowdown" empirically is difficult in real-time.
  **Flag:** **[PARTIAL CONCESSION RECOMMENDED UP FRONT TO ESTABLISH CREDIBILITY]**
  **Note:** *Concede the lineage to show you know the lit, then pivot to the time-horizon distinction.*

  ### 3. Micro-Foundations (Actorhood)
  **Objection:** "Who is the rational actor here? 'Citizens' are heterogeneous. Elites, workers, and peasants have different discount rates. How can you model a unitary 'citizen' trading liberties for growth?"
  **Reply (2 mins):** This is a collective action problem. The "trade" is not a unitary contract but a **focal point equilibrium**. Different groups have different discount rates, but the regime's provision of public goods (order + growth) creates a coalition where the median voter's tolerance sets the stability threshold. In Singapore, the trade-off is explicit in housing policy (HDB); in China, it's implicit in employment. The mechanism holds as long as the coalition holding the median position believes the intertemporal promise. Heterogeneity explains *where* protests start, but the intertemporal mechanism explains *why they don't spread* until the growth trend breaks.
  **Softest Point:** Assumes a stable "median" coalition in authoritarian settings where coalitions are opaque.
  **Flag:** **[DEPENDS ON CONCEPTUAL DISTINCTION BETWEEN MEDIAN VOTER AND REGIME COALITION]**

  ### 4. Selection Bias (Generalizability)
  **Objection:** "China and Singapore are outliers (high state capacity, specific cultural contexts). Does this mechanism travel to Vietnam, Ethiopia, or pre-2014 Russia? Or is this just 'Confucian Authoritarianism'?"
  **Reply (2 mins):** The mechanism is institutional, not cultural. It requires two conditions: 1) Credible commitment to growth (state capacity) and 2) Suppression of alternative legitimacy claims (e.g., ideology or religion). Vietnam fits the model well. Ethiopia fits less well due to ethnic federalism fracturing the "citizen" unit. The theory predicts failure in low-capacity autocracies because they cannot credibly commit to the *future* side of the reciprocity. So, the theory generalizes to **Developmental Autocracies**, not all autocracies. I am limiting the scope condition intentionally.
  **Softest Point:** Scope conditions may be so narrow the theory becomes tautological (only works where it works).
  **Flag:** **[EMPIRICAL DEMONSTRATION NEEDED FOR VIETNAM CASE]**

  ### 5. The Coercion Alternative
  **Objection:** "You claim this isn't coercion. But without democratic input, how do you distinguish 'consent' from 'adaptive preferences' or simply high costs of dissent? Isn't 'acceptance' just a proxy for 'fear'?"
  **Reply (2 mins):** Coercion and consent are not binary; they are substitute inputs into regime stability. Coercion is expensive; consent is cheap. If stability were purely coercive, enforcement costs should rise linearly with population. My data suggests enforcement costs per capita remain stable during high growth but spike nonlinearly during stalls. This suggests a **substitution effect**: the regime spends less on coercion when the reciprocity holds. If it were only fear, growth rates wouldn't correlate with enforcement efficiency.
  **Softest Point:** Enforcement cost data is notoriously unreliable in authoritarian regimes.
  **Flag:** **[DEPENDS ON EMPIRICAL DEMONSTRATION OF ENFORCEMENT COSTS]**

  ### 6. Operationalizing the "Stall"
  **Objection:** "You argue legitimacy collapses when growth stalls. How do you define 'stall'? Is it absolute negative growth, below-trend growth, or missed expectations? This looks like moving the goalposts."
  **Reply (2 mins):** It is defined as a deviation from the **5-year moving average** combined with a shift in elite signaling. Absolute negative growth is not required (e.g., China's 2020s). The critical threshold is when the regime stops framing slowdowns as "temporary adjustments" and shifts to "security threats." This discursive shift marks the breaking of the intertemporal promise. We code this via NLP analysis of state media alongside GDP data.
  **Softest Point:** Endogeneity: The regime shifts rhetoric *because* legitimacy is falling, not necessarily because the contract broke.
  **Flag:** **[DEPENDS ON CONCEPTUAL DISTINCTION BETWEEN SIGNAL AND CAUSE]**

  ---

  ### Strategic Instructions for the Presenter

  1.  **The Up-Front Concession (Objection #2):** During your opening remarks or the first answer, explicitly state: *"I want to be clear that 'Intertemporal Reciprocity' is not a rejection of Performance Legitimacy literature, but a dynamic refinement of it."* This disarms the empiricists who fear you are ignoring the canon.
  2.  **Handling the "Hope Nobody Asks" (Objection #1):** If asked about micro-evidence, do not get defensive. Say: *"That is the primary limitation of the current draft. I am treating consent as a latent equilibrium variable. I invite collaboration on survey design to test this."* This turns a weakness into a research agenda.
  3.  **Vocabulary Check:** If you catch yourself saying "Moral Obligation," correct yourself to "Reciprocal Expectation." If you say "Social Contract," correct to "Equilibrium Condition."
  4.  **Flag Awareness:** Be prepared for pushback on Objections #1, #5, and #6. These rely on empirical proxies (lags, enforcement costs, rhetoric) that are noisy. Have your robustness checks ready.
