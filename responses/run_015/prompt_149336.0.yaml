  I am designing a course module on democratic innovation and want a prompt that moves past standard textbook summaries of sortition into a genuinely conceptual tension. I have been thinking about the particular strain in recent lottocratic theory that tries to preserve the egalitarian symbolism of random selection while quietly introducing functionalist filters—epistemic stratification, competence-weighted pools, or “calibrated” draws—without admitting that the mechanism has become a disguised meritocracy. Rather than asking for exposition, I want you to write a deadpan satirical piece: an internal onboarding memo for new members of the Civic Assembly of the Republic of Aethelgard, a fictional polity that has abolished elections in favor of a multi-tiered sortition legislature.

  Format the memo as numbered bureaucratic sections with legalistic subclauses—suggested headings include Selection Protocol, Epistemic Banding and Pool Hygiene, Deliberative Obligations, Grievance and Recusal, and Continuity Rules. The polity’s system is universal at the entry stage—every adult is in the initial pool—but citizens are then sorted into “epistemic bands” (Generalist, Domain-Specialist, and Meta-Cognitive Auditor) and drawn randomly within each band to fill specific legislative functions. The satire should exaggerate the real conceptual problem rather than invent a strawman: the bureaucracy insists this is still pure democratic equality because the draw is random within bands and the bands are only “procedural hygiene.” Your memo should expose the contradiction through HR-style language—clauses requiring “randomness audits” to prove no human bias entered the stratification algorithm; mandatory “ignorance-certification workshops” in which specialists must formally suspend their expertise during deliberation; a grievance form for citizens who feel they were “over-qualified yet statistically under-represented”; and a non-branching continuity rule stating that if a drawn member is replaced for incompetence, the replacement must come from the same epistemic band to preserve “representative statistical fidelity.” The voice must remain entirely deadpan and bureaucratic; do not wink at the reader. The target is the conceptual sleight-of-hand by which functionalist demands for competent deliberation are smuggled into an egalitarian selection mechanism—not any named living scholar or specific published text.

  The piece should be approximately 700 words, readable to someone unfamiliar with sortition debates but immediately legible to a specialist as a fair, biting reductio of the calibration problem. Do not include citations, footnotes, bibliographic references, or quotations from actual works; build the satire entirely from the internal logic of the fictional bureaucracy. I want the humor to come from the memo’s earnest attempt to square the circle of “random but qualified,” so that the contradictions emerge structurally rather than through explicit commentary.
