  Prep Sheet: Workshop Defense (Internal Critique of Nozick)
  **To:** Presenter
  **From:** Senior Colleague
  **Re:** Tuesday's Workshop

  First, fix the typo on the handout ("acqusition"). The Nozick historian will circle it in red ink and use it to suggest sloppiness in your conceptual framework too. It's petty, but don't give them the ammunition.

  You're walking into a minefield. You're telling the Coaseans that efficiency doesn't cleanse title, the Rawlsians that they don't need to abandon liberty to get equality, and the Nozickian that he didn't read his own book carefully enough. That's a hard sell. Your strategy must be precision, not expansion. Do not try to win everyone over; try to survive the Q&A with your core thesis intact.

  Here are the eight objections you will face, ordered by likelihood and damage. I've included the "hope nobody asks" question as #1, because if they are sharp, they will ask it, and it is the most damaging.

  ***

  ### 1. The "Smuggling" Charge (Patterned Principles)
  **The Objection:** "You claim this is an internal historical critique, but by insisting public investment creates a claim on future earnings, aren't you just smuggling a patterned principle (like 'distribution according to social contribution') in through the back door? You're violating Nozick's strict separation between historical entitlements and end-state patterns."
  **The 2-Minute Reply:** "No. A patterned principle dictates distribution based on a snapshot metric (need, merit, utility). My argument is strictly causal-historical. I am not saying Chamberlain *deserves* less because of a pattern; I am saying the *chain of title* to his earnings is broken because the assets he traded (his monetizable skills) were co-produced by resources he did not own. It's like selling a car built with stolen tools; the sale is voluntary, but the title is defective. I'm holding Nozick to his own requirement that every link in the chain must be just."
  **Soft Spot/Dodge:** You are dodging the fact that "co-production" implies a metric of contribution (how much did the public vs. the individual contribute?). That metric looks suspiciously like a pattern.
  **Concession Strategy:** Concede upfront that *measuring* the split is hard, but insist the *principle* of split ownership is historical, not patterned.
  **Confidence:** 60%

  ### 2. The Self-Ownership Objection (The Nozick Historian)
  **The Objection:** "Nozick explicitly grounds entitlement in self-ownership. Chamberlain owns his body and his labor. Public schools may have facilitated them, but they don't own *him*. You are conflating external resources with internal capacities."
  **The 2-Minute Reply:** "I agree Chamberlain owns his body. But 'talent' in the economic sense isn't just muscle memory; it's a social construct realized through institutions. A jump shot has no economic value without a league, a court, and a legal system enforcing contracts. Nozick allows that external resources must be justly acquired. I'm arguing the *economic value* of the talent is an external resource created jointly. He owns the labor, but the *value* of the labor's product involves public capital."
  **Soft Spot/Dodge:** This is a stretch of Nozick's definition of "holding." He treats talents as internal endowments. You are redefining talent as external infrastructure.
  **Concession Strategy:** Concede that Nozick treats talent as internal, but argue that *monetization* transforms it into an external holding subject to acquisition rules.
  **Confidence:** 70%

  ### 3. The Voluntariness Defense (Core Nozickian)
  **The Objection:** "Even if the baseline is imperfect, the exchange itself was voluntary. Nozick's point is that liberty upsets patterns. If every fan voluntarily gave 25 cents, how can you invalidate that choice based on background conditions?"
  **The 2-Minute Reply:** "Voluntariness is necessary but not sufficient for justice in transfer. It presupposes just initial holdings. If I sell you a watch I stole, our exchange is voluntary, but unjust. My argument is that the 'holding' Chamberlain sold (the opportunity to play) was partly publicly owned. You cannot voluntarily transfer what you do not fully own. The fans transferred money justly; Chamberlain cannot transfer the full title to the earnings."
  **Soft Spot/Dodge:** Nozick arguably thinks voluntary exchange *cleanses* minor background injustices unless rights are violated. You need to prove a rights violation occurred.
  **Concession Strategy:** Do not concede voluntariness is insufficient generally, but insist it is insufficient *when title is shared*.
  **Confidence:** 75%

  ### 4. The Coasean Transaction Cost Objection
  **The Objection:** "Even if you're right philosophically, the transaction costs of untangling public vs. private contribution to talent are prohibitive. Efficiency requires we treat the entitlement as unified to minimize litigation and bargaining costs."
  **The 2-Minute Reply:** "We are doing normative political philosophy, not administrative accounting. The fact that justice is hard to calculate doesn't mean injustice is justice. Coase teaches us to look at reciprocal harm; here the harm is the privatization of public investment. We can use rough heuristic rules for rectification without abandoning the principle that the current distribution is theoretically illegitimate."
  **Soft Spot/Dodge:** Law-and-econ types care about implementability. If it can't be implemented, they think it's not law.
  **Concession Strategy:** Concede that implementation requires heuristics, but insist the theoretical invalidity stands regardless of cost.
  **Confidence:** 85%

  ### 5. The Lockean Proviso Objection
  **The Objection:** "Nozick's only baseline constraint is the Lockean Proviso: did this acquisition worsen the situation of others? Public funding didn't worsen anyone's position; it improved it. So the acquisition stands."
  **The 2-Minute Reply:** "The Proviso applies to appropriation of natural resources. Here we are dealing with *investment*. If I use your capital to make a profit without your consent, I haven't necessarily 'worsened' your position relative to the state of nature, but I have violated your property rights in the capital. The public has a property claim on the infrastructure, not just a welfare claim."
  **Soft Spot/Dodge:** Nozick interprets the Proviso very weakly. Arguing from "investment" rather than "appropriation" moves away from Nozick's text.
  **Concession Strategy:** Concede this is an extension of the Proviso, but argue it's consistent with the spirit of just acquisition.
  **Confidence:** 50% **(Least Sure Point)**

  ### 6. The Rectification Principle Objection
  **The Objection:** "Nozick has a third principle: Rectification. Even if acquisition was unjust, the theory doesn't collapse; we just apply rectification. Why does this invalidate Entitlement Theory rather than just triggering the rectification clause?"
  **The 2-Minute Reply:** "Because Rectification requires knowing the 'just baseline' to return to. My argument shows that in a modern economy, a 'just baseline' of purely private acquisition is impossible to construct. If every holding is tainted by public co-production, the Entitlement Theory cannot generate a determinate distribution. It becomes operationally empty."
  **Soft Spot/Dodge:** Nozick admits rectification is hard and suggests we might use current patterns as a rule of thumb. He has an out.
  **Concession Strategy:** Concede Rectification exists, but argue it swallows the rule in this context.
  **Confidence:** 70%

  ### 7. The Rawlsian "Why Bother?" Objection
  **The Objection:** (From the two Rawlsians) "You're admitting the basic structure determines justice. Why cling to Nozick's individualistic framework? Just admit justice requires fair equality of opportunity and move on."
  **The 2-Minute Reply:** "Because libertarian premises are dominant in legal discourse. Showing that liberty *itself* demands redistribution is strategically more potent than importing Rawlsian equality. I'm using their language to show their conclusions don't follow. It's immanent critique, not external substitution."
  **Soft Spot/Dodge:** They might think this is game-playing. They want robust justice, not rhetorical jiu-jitsu.
  **Concession Strategy:** Concede Rawls is more robust, but insist this approach works better in a law-and-econ context.
  **Confidence:** 90%

  ### 8. The Counterfactual Causation Objection
  **The Objection:** "How do you know Chamberlain needed public schools? Maybe he would have been great anyway. You can't prove the public contribution was necessary."
  **The 2-Minute Reply:** "The burden of proof lies on the libertarian to show the acquisition was *purely* private. In a society with public courts, roads, and schools, no acquisition is purely private. The presumption of private title is what needs justification, not the claim of social interdependence."
  **Soft Spot/Dodge:** Philosophically sound, but empirically weak. They will press for specifics.
  **Concession Strategy:** Concede we can't know the counterfactual, but argue the *risk* of unjust title shifts the burden.
  **Confidence:** 80%

  ***

  **Final Advice:**
  Your least sure point is #5 (Lockean Proviso). If the Historian presses this, do not dig in. Pivot to #3 (Voluntariness/Title).
  The "Smuggling" charge (#1) is the kill shot. If you stumble there, the workshop will turn into a autopsy of your categorization skills. Practice that reply until you can say it without blinking.

  Good luck. Fix the typo. And for god's sake, don't let the Coaseans drag you into a discussion about efficiency metrics; keep it on rights and title.
