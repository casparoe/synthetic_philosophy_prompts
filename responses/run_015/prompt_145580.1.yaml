  **Audience Assumptions**
  Realists equate diagnostic stability with scientific validity; instability suggests error. Psychologists view diagnostic awareness altering symptoms as treatment-interfering noise. The anthropologist assumes clinical framing inevitably extends biomedical jurisdiction, pathologizing normal self-reflection.

  **Q&A Defense Sheet**

  1. **Philosopher:** "If the kind changes upon classification, you lose predictive power. How is this science?"
     *Reply:* Stability isn't the only virtue; accuracy is higher. We predict the *change*, not static states. It's dynamic modeling, like meteorology, not static taxonomy.
     *Weakness:* Requires complex metrics clinicians lack.

  2. **Psychologist:** "Talking about the loop confuses patients. They'll think they're faking it."
     *Reply:* Transparency builds alliance. We frame it as 'brain adaptation,' not fabrication. Ignoring it causes dropout when patients feel misunderstood. Validation reduces shame, the actual treatment barrier.
     *Weakness:* Risky with low-insight patients.

  3. **Anthropologist:** "This just deepens medical control. Now you manage their self-conception too."
     *Reply:* Power exists regardless. Reflexivity returns agency to the patient by making the mechanism visible, not hidden. It shifts authority from the clinician's gaze to the patient's experience.
     *Weakness:* Assumes patients want this agency.

  4. **Psychologist:** "This adds untenable time to sessions. We can't track meta-symptoms."
     *Reply:* It's a checkpoint, not a new test. Ask one question: 'How did hearing this label change you?' This prevents misalignment later, saving time overall.
     *Weakness:* Still adds cognitive load.

  5. **Philosopher:** "Are you saying ADHD isn't a real disorder?"
     *Reply:* It's real but interactive. Neurobiology exists, but expression is dialogical. The biology is the hardware; the looping is the software update.
     *Weakness:* Blurs line between social and biological.

  6. **Anthropologist:** "Why focus on ADHD? Isn't all medicine looping?"
     *Reply:* Psychiatric categories are uniquely identity-constituting compared to broken bones. Diagnosis touches who you are, not just what you have.
     *Weakness:* Chronic physical illnesses also alter identity.

  **The Objection I Hope Nobody Asks**
  "If the loop alters the phenotype significantly, doesn't that prove the original category was wrong to begin with?"
  *Guidance:* **Concede** that the static definition was insufficient and historically naive regarding human kinds. **Hold** that the category remains useful if we update the definition to include the interactive element. Do not abandon the diagnosis; upgrade the model. Admitting the category was "wrong" validates anti-psychiatry claims that ADHD is a myth. Admitting it was "incomplete" validates your thesis that science evolves. Maintain that utility persists despite ontological shift. The trap is accepting the dichotomy between "real" and "constructed." Reject it.
