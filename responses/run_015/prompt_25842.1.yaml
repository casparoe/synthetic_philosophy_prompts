      *   *Epistemological Theory 1: Contextualism/Stakes-Sensitivity.* (e.g., Jeremy Fantl, Jeremy Stanley, Jason Stanley). Knowledge attributions depend on practical stakes. High stakes = higher evidence needed to claim "knowledge."
      *   *Epistemological Theory 2: Pragmatic Encroachment.* Similar to above. Practical factors encroach on epistemic justification.
      *   *Epistemological Theory 3: Traditional Invariantism + Decision Theory.* Belief/Knowledge is binary or fixed probability threshold (e.g., $>0.5$ for belief, $>0.9$ for knowledge). The *legal verdict* isn't a knowledge claim per se, but a decision to punish/compensate. This aligns with Bayesian Decision Theory.
      *   *Legal Consistency:* Judges interpret law based on text/precedent, not policy consequences (ostensibly). Rules of evidence (admissibility) are mostly the same, though relevance/prejudice balances differ slightly.

