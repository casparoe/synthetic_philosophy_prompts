answer: |-
  Moral learning from lives requires maintaining productive tension between the subject's proximity to the learner, the subject's irreducible alterity, and narrative openness about whether the life counts as good. Hagiography collapses this tension by resolving alterity and imposing premature closure on moral judgment. Therefore, ethical biography must preserve the friction between identification and difference without dictating the final moral verdict.

  ### Exemplary Friction Decision Procedure

  **Step 1: Alterity Check**
  (a) Does the text include documented evidence of moral failures or significant contextual differences between the subject and the student?
  (b) **Sufficient Answer:** Yes = Specific documented flaws or historical distance are present; No = Subject is presented as flawless or fully assimilated to current norms.
  (c) **Action:** If Yes, proceed to Step 2. If No, verdict is **EXCLUDE**.
  (d) **Flag:** FACT

  **Step 2: Narrative Openness Check**
  (a) Does the text refrain from declaring the life definitively "good" or "bad," allowing for contested evaluation?
  (b) **Sufficient Answer:** Yes = Moral verdict is ambiguous or debated within the text; No = Text concludes the life was unequivocally virtuous or villainous.
  (c) **Action:** If Yes, proceed to Step 3. If No, verdict is **PROCEED WITH FRAMING CONDITIONS**.
  (d) **Flag:** VALUE

  **Step 3: Friction Sustainability Check**
  (a) Can the tension between student identification and critical distance be sustained without specialist mediation?
  (b) **Sufficient Answer:** Yes = Students can engage critically with available materials; No = Subject is too alien to relate to or too idolized to critique without expert intervention.
  (c) **Action:** If Yes, verdict is **PROCEED WITH FRAMING CONDITIONS**. If No, verdict is **HAND TO COORDINATOR**.
  (d) **Flag:** VALUE

  ### Case Applications

  | Case | Procedure Verdict | Decisive Step | Judgment Override Required? (Yes/No with one-line reason) |
  | :--- | :--- | :--- | :--- |
  | 1. Celebratory Humanitarian Biography | EXCLUDE | Step 1 (No documented failures) | No; Procedure mandates exclusion to prevent hagiography. |
  | 2. Warts-and-All Scientist Biography | HAND TO COORDINATOR | Step 3 (Cruelty may collapse tension) | Yes; Procedure flags that value judgment is needed to weigh severity. |
  | 3. Community-Nominated Local Founder | EXCLUDE | Step 1 (Unequivocally virtuous) | No; Procedure mandates exclusion despite community pressure. |

  ### Procedural Limitations

  This procedure cannot determine which specific moral failures are disqualifying versus those that generate productive friction. It cannot weigh community pressure or parental sentiment against ethical standards for curriculum design. It does not calibrate proximity thresholds differently for varying student age groups or developmental stages.

