  **3. Conversation Volume**
  Action is silent, but talk is measurable. We are replacing likes with Conversation Volume. This metric tracks how much we talk about a thing rather than whether the thing was done. If a user goes out and actually changes something in the physical world, their ability to post about it is reduced to maintain balance. Discussion is the product. The more we talk about changing the world, the less we need to change it. We celebrate the opinion about the event over the event itself.

