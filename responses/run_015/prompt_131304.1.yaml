answer: |-
  This is a sharp reconstruction. You are almost certainly thinking of **Tor Nørretranders' *The User Illusion: Cutting Consciousness Down to Size*** (originally 1991, English translation 1998). It was the book that popularized the phrase "user illusion" in this context, relying heavily on information theory and Benjamin Libet's experiments.

  However, your memory may be blending Nørretranders with **Daniel Wegner** (*The Illusion of Conscious Will*, 2002) or a hardline reading of **Daniel Dennett**. Nørretranders focuses on bandwidth and "exformation" (discarded information), while the "exhaust, not engine" and "behaviorism" lines sound like the more aggressive eliminativist conclusions drawn by Wegner or critics of the view.

  Here is a claim-by-claim breakdown of how a defender of this "Consciousness as UI" view (specifically the Nørretranders/Dennett/Wegner cluster) would respond to your objections, along with confidence ratings for my analysis.

  ### 1. The Core Metaphor: UI vs. Window
  *   **The Claim:** Consciousness is a simplified control panel, not a direct view of neural machinery.
  *   **Defender's Stance:** **Accept.** This is the foundational axiom. They argue that if the brain showed you the raw data (neuronal firing rates, chemical gradients), you would be paralyzed by complexity. The "icons" (qualia, like "red" or "pain") are compressed symbols for complex states.
  *   **Your Instinct:** You suspect this is a useful simplification that still tracks reality.
  *   **Verdict:** **High Confidence.** Defenders agree with you here. They are not saying the icons are *lies*; they are saying they are *lossy compressions*. "Red" isn't a property of the world, but it reliably tracks a specific wavelength range. It's a "controlled hallucination" that tracks truth well enough for survival.

  ### 2. The Homunculus: "No Inner User"
  *   **The Claim:** There is no little man watching the screen; the "self" is part of the interface.
  *   **Defender's Stance:** **Accept.** This is non-negotiable. If there were a user inside, you'd need a brain inside that user, leading to infinite regress.
  *   **Your Worry:** Does objecting to "exhaust, not engine" smuggle a homunculus in?
  *   **Verdict:** **High Confidence.** Your worry is well-placed, but your objection can be saved. You don't need a homunculus to say the interface has causal power. In a computer, the desktop interface is part of the causal chain (clicking an icon triggers code). The defender's trick is to distinguish between the *information structure* (which causes things) and the *phenomenal experience* (the "what it is like" to see the icon). They claim the *experience* is the exhaust, even if the *information* is the fuel.

  ### 3. Epiphenomenalism: "Exhaust, Not Engine"
  *   **The Claim:** Consciousness does no causal work; unconscious processing drives behavior.
  *   **Defender's Stance:** **Mixed/Contextual.** This is the most contentious point.
      *   **Nørretranders/Wegner:** **Accept.** They lean heavily on Libet's experiments (brain acts before conscious awareness) to argue conscious will is a post-hoc story.
      *   **Dennett:** **Reject.** Dennett argues consciousness *is* the functional processing; it's not a separate ghostly layer.
      *   **Your Objection:** "Interfaces do things."
      *   **Analysis:** You are right to be suspicious. If the UI is for action, it must be causally integrated. If it were truly epiphenomenal (like steam from a train), evolution wouldn't have built such an expensive one.
      *   **Verdict:** **Medium Confidence.** The "exhaust" claim is likely a **popularization-level simplification** or a specific commitment of the *will* aspect (free will is an illusion), not necessarily the *information* aspect. A sophisticated defender would say: "The *content* of consciousness drives behavior, but the *feeling* of ownership is the exhaust." If the chapter says consciousness does *no* causal work, that is a strong, controversial claim that many modern "UI theorists" (like Anil Seth) would reject.

  ### 4. Untestability: "Introspection yields more icons"
  *   **The Claim:** You can't test this because asking people about consciousness just gets more UI reports.
  *   **Defender's Stance:** **Accept (with caveats).** They agree introspection is unreliable for *mechanism*.
  *   **Your Question:** Is this conflating report with data?
  *   **Verdict:** **High Confidence.** It is not a conflation; it is a methodological stance. They treat introspective reports as **behavioral data** (output of the system), not as **ground truth** (inspection of the system). It's consistent. They don't say "we can't know anything"; they say "we can't know anything *from the inside*." We must use third-person measures (reaction time, fMRI) to see the machinery.

  ### 5. "Behaviorism with Better PR"
  *   **The Claim:** Since consciousness doesn't cause action, only behavior matters.
  *   **Defender's Stance:** **Reject (as a label), Accept (as a consequence).**
  *   **Verdict:** **Medium Confidence.** This line sounds like a rhetorical flourish or a critic's summary rather than a core theoretical commitment. Defenders usually call themselves "Physicalists" or "Functionalists." Calling it behaviorism admits that the "consciousness" part is causally inert, which undermines the book's title. I suspect this was either a moment of candor ("effectively, we are treating it as behaviorism") or your memory of a critique *of* the chapter. If the author claimed this earnestly, it was an overstatement.

  ### 6. Discrete Frames: "Sampling Rate Prediction"
  *   **The Claim:** If it's a UI, it must have a refresh rate (discrete frames).
  *   **Defender's Stance:** **Plausible Inference, not Logical Necessity.**
  *   **Verdict:** **Medium Confidence.** This is taking the computer metaphor slightly too literally. Computer UIs are discrete because of hardware clocks. Brains are wet, analog, and parallel. While there is evidence for "perceptual cycles" (e.g., alpha waves gating attention), experience could be a "specious present" (a sliding window) rather than discrete frames. A defender would say this is a *testable hypothesis* generated by the metaphor, not a *deductive truth* of the metaphor.

  ### 7. "Illusionism" Terminology
  *   **Your Question:** Is this "illusionism"?
  *   **Verdict:** **High Confidence.** Yes. In contemporary philosophy of mind (e.g., Keith Frankish), **Illusionism** is the specific claim that phenomenal consciousness (qualia) is a user-illusion. It doesn't mean consciousness doesn't exist; it means it doesn't exist *as it seems to us*. It seems like an inner movie screen; really, it's a data structure. This matches your reconstruction perfectly.

  ---

  ### Summary of Trustworthiness

  | Claim | Trust Level | Notes |
  | :--- | :--- | :--- |
  | **UI Metaphor** | **High** | Core theory. Trust this. |
  | **No Homunculus** | **High** | Core theory. Trust this. |
  | **Epiphenomenalism** | **Low/Medium** | Controversial even among proponents. Likely an overstatement in pop-sci. |
  | **Untestable via Introspection** | **High** | Methodologically consistent. Trust this. |
  | **Behaviorism Label** | **Low** | Likely rhetorical or a critic's tag. Don't build theory on this. |
  | **Discrete Frames** | **Medium** | Plausible hypothesis, but metaphorically driven. |

  ### The One Claim I Am Least Sure About

  **The "Exhaust, Not Engine" (Epiphenomenalism) Claim.**

  I am least confident in whether the chapter you read was presenting epiphenomenalism as a **necessary truth** of the UI theory or as a **specific interpretation** of Libet's data.
  *   **Why it's shaky:** Most modern cognitive scientists who use the UI metaphor (like Anil Seth or Donald Hoffman) argue that consciousness is causally potent *because* it is an interface that guides action. If it were truly "exhaust," it would have been evolved away.
  *   **The Risk:** If you accept the "exhaust" claim, you undermine the "interface for action" claim. An interface that doesn't control the machine is just a screensaver.
  *   **My Reading:** The author likely conflated "Conscious *Will* is an illusion" (we don't initiate actions consciously) with "Conscious *Processing* is epiphenomenal" (the content doesn't matter). The former is defensible; the latter is much weaker.

  **Recommendation:** Trust the "UI/Compression" and "No Homunculus" insights. They are robust and influential. Treat the "Epiphenomenalism/Exhaust" and "Behaviorism" claims as the author's specific, debatable philosophical flavor, not as established science. Your instinct that "interfaces do things" is correct; a UI that doesn't affect the system is a bad UI, not a theory of mind.

  **Confidence in this assessment:** **High.** (The tension between functional utility and epiphenomenalism is a well-known fault line in this specific literature.)
