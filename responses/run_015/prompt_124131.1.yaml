      *   *Better Angle:* **Causal Intervention.** If you intervene on the internal state, does the output change predictably according to the "reasoning"? If the reasoning is just decoration, intervening on the "reasoning" tokens shouldn't change the answer. Recent papers show this is often the case.
      *   *Better Angle:* **Systematicity.** Can it swap variables? If it learns $A > B, B > C \rightarrow A > C$, can it handle new symbols instantly without retraining? LLMs often struggle with this compared to symbolic systems.

  7.  **Final Polish:**
      *   Ensure tone is respectful but rigorous.
      *   Make sure the "Fatal" category actually threatens the core claim, not just adds nuance.
