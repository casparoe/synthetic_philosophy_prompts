answer: |-
  # The question we were convened to answer

  We were convened to determine whether a state committed to the equal moral worth of persons can justify restricting entry to sustain the political solidarity required for universal redistribution, and if so, which boundaries are permissible.

  # Agreed claims

  We have identified ten claims that survive our adversarial scrutiny. These claims map the common ground regarding harms, institutions, and empirical uncertainties. We sign these not as concessions, but as shared premises. These claims form the foundation upon which our remaining disagreements rest.

  1. We agree that excluding willing entrants inflicts serious, identifiable harm on specific individuals currently outside the border, which demands moral accounting from the state.
  2. We agree that generous universal redistribution requires a stable political coalition willing to fund transfers for people they do not know personally or share identity with.
  3. We adopt the distinction between Entry (physical presence), Access (benefits and labour protections), and Standing (citizenship and voting) as analytically necessary for clarity in this debate.
  4. We adopt the distinction between Fiscal constraints (net budget contribution) and Political-Economy constraints (erosion of willingness to redistribute) as empirically distinct issues with different solutions.
  5. The Open-Borders side accepts that social solidarity is a moral good to be preserved, not merely a contingent psychological preference to be overridden by abstract liberty claims.
  6. The Restrictionist side accepts that border control is a coercive act requiring public justification to the excluded, not merely to existing citizens internally or arbitrarily.
  7. We agree that legally conflating Entry with Standing creates unnecessary moral hazards and increases risks of labour exploitation for residents without citizenship status.
  8. We agree that temporary worker programs test whether Entry can be decoupled from Access without creating permanent caste systems internally over time and generations.
  9. We agree neither side advocates for absolutely open borders or completely closed fortresses in practical policy implementation anywhere in the world today.
  10. We agree that current empirical evidence on what specifically triggers solidarity erosion is insufficient for theoretical certainty today among us scholars and practitioners.

  # Disagreements

  | Crux | Open-Borders Formulation | Restrictionist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Default Status** | Liberty of movement is the default; restriction needs specific justification to the excluded. | Bounded membership is the default; expansion needs specific justification to the members. | Substantive |
  | **Solidarity Source** | Institutions can cultivate solidarity across diverse populations over time through shared experiences. | Solidarity depends on pre-existing cultural or national similarity bounds that cannot be engineered quickly. | Substantive |
  | **Critical Gate** | Entry is the primary site of coercion and must be opened first to reduce harm. | Access is the primary site of redistribution and must be protected first to ensure sustainability. | Substantive |
  | **Time Horizon** | Immediate harm to excluded persons outweighs speculative future solidarity risks to the community. | Future capacity to redistribute outweighs immediate claims of excluded persons outside the community. | Substantive |
  | **Burden of Proof** | Restrictionists must prove solidarity will actually break under openness before restricting liberty. | Open-Borders side must prove solidarity will survive under openness before expanding membership. | Verbal |

  # Tests, with predictions recorded in advance

  **1. The Decoupling Experiment**
  *Case:* A jurisdiction grants local voting rights (Standing) and full labour protections (Access) to long-term residents without granting national citizenship or border control (Entry).
  *Open-Borders Prediction:* Solidarity will increase or remain stable because shared institutional participation builds trust across groups.
  *Restrictionist Prediction:* Solidarity will decrease because national redistribution requires national identity bounds that local inclusion cannot replicate.

  **2. The Shock vs. Flow Test**
  *Case:* Comparing regions experiencing sudden demographic influxes against regions with identical total influxes spread over decades.
  *Open-Borders Prediction:* No significant difference in solidarity erosion; total composition matters, not the speed of change.
  *Restrictionist Prediction:* Sudden shocks will break solidarity mechanisms while gradual flows allow institutional adaptation and cultural assimilation.

  **3. The Conditionality Test**
  *Case:* Shifting welfare benefits from universal citizenship entitlements to contributory models tied strictly to labour market participation.
  *Open-Borders Prediction:* Work-ties will sustain solidarity sufficiently, allowing broader Entry without collapsing redistribution levels.
  *Restrictionist Prediction:* Work-ties are insufficient without cultural bounds; conditionality will reduce overall support for redistribution regardless of migration.

  **4. The Long-Term Demographic Crux**
  *Case:* Whether sustained high migration over fifty years undermines the welfare state.
  *Open-Borders Prediction:* No test exists; we cannot wait fifty years to act on current moral obligations.
  *Restrictionist Prediction:* We must wait for longitudinal data; acting without it risks irreversible damage to redistributive institutions.
