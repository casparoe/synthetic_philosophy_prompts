prompt: |-
  Write a proposal for a one-semester research paper (around 6,000 words) on whether conceptual engineering can generate a distinct form of epistemic injustice. The core idea is this: standard accounts treat hermeneutical injustice as a static gap—some group lacks the conceptual resources to understand their own experience. But in practice, responses often involve actively promoting a new or refined concept within institutions (for example, a revised notion of consent in policy, or a newly coined term for an unrecognized workplace harm). Once dominant institutions adopt the engineered concept, people who continue using the older framework frequently suffer credibility deficits—not because of identity-based prejudice in the usual testimonial sense, but because they are seen as conceptually outdated or unable to articulate the "correct" analysis. Call this "conceptual-lag injustice."

  State the precise research question: is conceptual-lag injustice genuinely a form of epistemic injustice, or is it merely an unavoidable practical cost of conceptual progress? And can we formulate normative criteria—such as reversibility, transitional accessibility, or proportional representation of old-framework users—to distinguish legitimate conceptual reform from a harmful kind of conceptual imperialism?

  Explain why existing work on testimonial and hermeneutical injustice leaves this dynamic open: those accounts treat hermeneutical gaps as missing resources rather than replaced ones, and they do not analyze the credibility dynamics that arise after a concept is institutionally displaced. Describe the method: conceptual analysis of credibility-deficit mechanisms, plus structured comparison of two institutional adoption cases (describe the salient institutional features in enough detail within the proposal that the analysis can proceed without obscure historical facts). Specify what a successful result looks like (a decision framework with clear conditions for justified reform) and what counts as failure (the harm collapses entirely into standard testimonial injustice, or no normative distinction between progress and imperialism emerges). Give an honest assessment of scope risk for one semester, identifying which analytical steps are feasible and which must be bracketed. Do not request a bibliography, reading list, or citations; refer to positions and arguments by name, and I will add references myself.
