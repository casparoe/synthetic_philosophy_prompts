  # Research Prospectus: Conceptual-Lag Injustice and the Ethics of Conceptual Engineering

  ## Abstract

  This research proposal outlines a one-semester project intended to produce a paper of approximately 6,000 words. The project investigates a specific, under-theorized dynamic within the literature on epistemic injustice and conceptual engineering. Standard accounts of hermeneutical injustice, primarily derived from the work of Miranda Fricker and expanded by critics like Kristie Dotson and Gaile Pohlhaus, characterize the harm as a static gap: a collective hermeneutical resource is missing, leaving a specific group unable to make sense of their social experiences. However, contemporary institutional practice increasingly involves not just the discovery of missing concepts, but the active engineering and imposition of new ones. When institutions adopt engineered concepts—such as revised definitions of consent or new taxonomies of workplace harm—individuals who retain the older conceptual framework often suffer credibility deficits. They are not ignored because of identity prejudice in the traditional sense, but because their conceptual vocabulary is deemed obsolete or incompetent. This proposal terms this phenomenon "conceptual-lag injustice."

  The central research question asks whether conceptual-lag injustice constitutes a genuine form of epistemic injustice or merely an unavoidable practical cost of conceptual progress. Furthermore, the project seeks to formulate normative criteria—such as reversibility, transitional accessibility, and proportional representation of old-framework users—to distinguish legitimate conceptual reform from a harmful kind of conceptual imperialism. The methodology involves a conceptual analysis of credibility-deficit mechanisms paired with a structured comparison of two institutional adoption cases: a revised workplace harassment policy in a corporate setting and a new medical consent framework in a healthcare system. These cases will be described in sufficient detail within the project to allow for analysis without relying on obscure historical facts. A successful result will yield a decision framework with clear conditions for justified reform. Failure will be defined as the collapse of the harm into standard testimonial injustice or the inability to generate a normative distinction between progress and imperialism. This prospectus details the background, theoretical framework, case descriptions, methodological plan, and scope assessment required to execute this research within a single semester.

  ## Introduction: The Problem of Conceptual Displacement

  The intersection of social epistemology and metaphysics has, in the last two decades, produced a robust literature on how our conceptual schemes affect our capacity to know and be known. The dominant paradigm for understanding the harms associated with conceptual deficiency is the model of hermeneutical injustice. In this model, a gap in the collective hermeneutical resource prevents a subject from rendering their experience intelligible, either to themselves or to others. The paradigmatic example involves a historical lack of concepts for sexual harassment, leaving victims unable to name their experience and thus unable to secure uptake for their testimony. The remedy, implicitly or explicitly, is the generation and dissemination of the missing concept. Once the concept exists and is integrated into the collective resource, the injustice is presumed to be mitigated or resolved. The gap is filled; the resource is restored.

  However, this static model of "gap-filling" fails to capture the dynamic reality of contemporary institutional life. Institutions—universities, corporations, medical systems, legal bodies—do not merely wait for concepts to emerge organically from the collective. They actively engage in conceptual engineering. They draft policies that stipulate new definitions, coin terms for previously unrecognized harms, and mandate training that enforces specific conceptual frameworks. This is often done with benevolent intentions: to protect vulnerable groups, to clarify ethical boundaries, or to align institutional practice with progressive social values. For example, a university might adopt a new, broader definition of "coercion" within its sexual misconduct policy, or a technology firm might introduce a new category of "algorithmic micro-aggression" to describe subtle biases in code review.

  The problem arises in the transition period and its aftermath. When an institution officially adopts an engineered concept, it alters the epistemic landscape for all participants. Those who adopt the new concept gain hermeneutical power; they can articulate claims that the institution recognizes as valid. However, those who continue to use the older, pre-engineering framework often find themselves epistemically marginalized. They are not necessarily suffering from the original hermeneutical gap—they may understand the experience perfectly well using the old terms—but they are now suffering from a credibility deficit because their terms are no longer the "correct" ones. They are viewed as conceptually outdated, resistant to progress, or simply unable to articulate the "real" nature of the situation.

  This creates a paradoxical situation. The introduction of a concept designed to cure hermeneutical injustice can generate a new form of epistemic harm for those who do not or cannot migrate to the new framework. This is not merely a disagreement over facts; it is a structural shift in what counts as intelligible speech. If a worker complains of "rudeness" under an old framework, but the institution now only recognizes "hostile work environment" defined by specific engineered criteria, the worker's testimony may be dismissed. They are not lacking a concept; they are possessing the "wrong" one.

  This research project proposes to name this phenomenon "conceptual-lag injustice." It is distinct from standard testimonial injustice because the credibility deficit is not primarily driven by identity prejudice (e.g., sexism or racism) in the first instance, but by a mismatch between the speaker's conceptual scheme and the institution's mandated scheme. It is distinct from standard hermeneutical injustice because the resource is not missing; it has been replaced. The harm lies in the displacement.

  The significance of this research lies in its potential to refine our ethical understanding of conceptual engineering. Currently, the literature on conceptual engineering, led by figures like Cappelen and Plunkett, focuses heavily on the metasemantic questions of whether we *can* change concepts and the normative questions of whether we *should* based on the quality of the new concept. Less attention is paid to the transitional costs imposed on the users of the old concepts. If conceptual engineering is a tool for social justice, we must account for the collateral epistemic damage it might cause during implementation. If we cannot distinguish between legitimate progress and a form of conceptual imperialism, we risk validating institutional practices that silence dissent under the guise of refinement.

  This proposal outlines a plan to investigate whether conceptual-lag injustice is a genuine, distinct category of epistemic injustice. It will argue that it is not merely a side effect but a structural feature of top-down conceptual change. The project will then attempt to formulate normative criteria to distinguish between justified conceptual reform and unjust conceptual imposition. The research will be conducted through conceptual analysis and the examination of two detailed institutional case studies. The final paper will aim to provide a decision framework for institutions engaging in conceptual engineering, ensuring that the pursuit of better concepts does not come at the cost of epistemic exclusion for those holding legacy views.

  ## Literature Review: The Static Gap Assumption

  To establish the novelty of the proposed research, it is necessary to demonstrate how existing accounts of epistemic injustice leave the dynamic of conceptual displacement unanalyzed. The foundation of this field is Miranda Fricker's account of hermeneutical injustice. Fricker defines this harm as a situation where a gap in the collective hermeneutical resource puts someone at an unfair disadvantage when it comes to making sense of their social experiences. The structural cause is usually an identity-based power imbalance that prevents the experiences of a specific group from contributing to the formation of shared concepts. The remedy is the expansion of the collective resource to include the missing concepts.

  In Fricker's model, the primary focus is on the *absence* of resources. The narrative arc of hermeneutical injustice is one of lack followed by provision. Once the concept is available and enters the collective resource, the specific hermeneutical injustice is resolved. The model does not extensively account for what happens when the collective resource is not just expanded, but *altered* or *superseded* by institutional fiat. Fricker's account assumes a relatively organic growth of the collective resource, whereas modern institutional practice is often stipulative and rapid. Consequently, Fricker's framework lacks the machinery to analyze credibility deficits that arise from possessing an "obsolete" but previously valid concept.

  Critics and expanders of Fricker's work have addressed related issues but have not closed this specific gap. Kristie Dotson, for instance, introduces the concept of "testimonial smothering," where a speaker truncates their testimony because they anticipate their audience lacks the hermeneutical resources to understand it. While this addresses the audience's deficiency, it does not fully capture the scenario where the audience (the institution) *has* the resources but has deemed the speaker's specific conceptual choice invalid. Dotson also discusses "epistemic oppression," which is more systemic and resistant to repair. Conceptual-lag injustice shares features with epistemic oppression, particularly in its resistance to easy repair, but it is more specific: it is tied directly to the mechanism of conceptual replacement rather than general systemic exclusion.

  Gaile Pohlhaus Jr. offers a crucial intervention by distinguishing between "ignorant" and "willful" hermeneutical ignorance. Pohlhaus argues that dominant groups often refuse to use the hermeneutical resources developed by marginalized groups. This is close to the phenomenon of conceptual-lag injustice, but the direction of the refusal is different. In Pohlhaus's account, the dominant group refuses the *new* resources of the marginalized. In the proposed research, the institution (often acting in the name of progress) mandates the *new* resources and penalizes the *old*. The power dynamic is inverted: the harm is not that the dominant group refuses to learn the new concept, but that the institution refuses to accept the old one. This creates a scenario where the "progressive" conceptual shift itself becomes the source of exclusion for those who, for various reasons, remain within the old framework.

  The literature on conceptual engineering provides the other half of the theoretical background. Proponents like Cappelen and Plunkett argue that we can and should revise our concepts to serve our purposes better. They focus on the criteria for good versus bad engineering, often looking at the functional output of the concept. However, the ethical literature surrounding conceptual engineering tends to focus on the end-state: is the new concept better? It pays less attention to the transition process and the status of the "laggards." There is a presumption that if the new concept is morally superior, the transition is justified. This project challenges that presumption by suggesting that the *manner* of transition and the *treatment* of legacy users constitute a separate ethical domain.

  Recent work on "epistemic friction" and "conceptual competence" touches on the ability of agents to navigate conceptual schemes. However, these accounts generally treat conceptual competence as a virtue of the knower. They do not adequately address the institutional power to define what counts as competence. When an institution changes the definition of "consent," it effectively changes the criteria for conceptual competence regarding sexual ethics. An individual who was competent yesterday may be rendered incompetent today not by a loss of cognitive ability, but by a shift in the institutional standard. This specific mechanism—rendering previously competent speakers incompetent through conceptual displacement—is the gap this research intends to fill.

  Therefore, the existing literature treats hermeneutical gaps as missing resources rather than replaced ones. It does not analyze the credibility dynamics that arise after a concept is institutionally displaced. It assumes that more concepts are always better, or that better concepts simply replace worse ones without residual harm. This project posits that the replacement itself generates a specific type of credibility deficit that is not reducible to testimonial prejudice or hermeneutical lack. By isolating this dynamic, the research will contribute a new category to the taxonomy of epistemic injustice, one that is increasingly relevant in an era of rapid policy-driven conceptual change.

  ## Theoretical Framework: Defining Conceptual-Lag Injustice

  To proceed with the research, a precise working definition of "conceptual-lag injustice" must be established. This section outlines the preliminary theoretical framework that the final paper will refine and defend. Conceptual-lag injustice is defined as a credibility deficit suffered by a speaker resulting from the institutional displacement of a previously valid conceptual framework by a newly engineered one, where the deficit is attributed to the speaker's adherence to the legacy framework rather than identity-based prejudice or cognitive incapacity.

  This definition relies on three core components that the research will analyze in depth. The first component is the *Institutional Displacement*. This distinguishes the phenomenon from organic conceptual drift. In organic drift, language changes slowly over time through usage. In conceptual-lag injustice, the change is driven by an institutional authority that has the power to enforce the new concept in specific contexts (e.g., HR proceedings, medical diagnoses, legal rulings). The institution does not just suggest the new term; it structures its procedures around it. This creates a coercive element to the conceptual shift. The research will need to clarify the threshold of "institutional" power required to trigger this injustice, distinguishing between a mere change in popular slang and a change in policy-defined terminology.

  The second component is the *Legacy Framework Validity*. For the injustice to be distinct from simple error correction, the old framework must have been valid prior to the displacement. If the old concept was simply factually wrong (e.g., believing the earth is flat), losing credibility for using it is not an injustice; it is a correction of ignorance. Conceptual-lag injustice applies to cases where the old concept was socially functional and intelligible, even if the new concept is arguably more precise or morally sensitive. For example, describing a behavior as "unprofessional" might be a valid legacy concept that is replaced by "micro-aggression." The speaker is not factually wrong about the behavior's negative nature, but they are using a taxonomy that the institution no longer recognizes as sufficient. The research must establish criteria for distinguishing between the correction of falsehoods and the displacement of valid legacy frameworks.

  The third component is the *Non-Identity-Based Credibility Deficit*. Standard testimonial injustice occurs when a speaker is given less credibility due to prejudice against their social identity (gender, race, class). In conceptual-lag injustice, the credibility deficit is triggered by the conceptual mismatch. While identity prejudice may correlate (e.g., older workers might be more likely to hold legacy concepts), the mechanism of the deficit is the conceptual obsolescence itself. A young worker using the old terms would suffer the same deficit as an older worker. This distinction is crucial. If the harm collapses into identity prejudice (e.g., if only women are expected to know the new terms and men are excused), then it is just standard testimonial injustice. The research must demonstrate that the deficit operates independently of identity, stemming from the institutional evaluation of the *concept* rather than the *person*.

  This framework suggests that conceptual-lag injustice is a hybrid harm. It has a hermeneutical dimension (the resources have changed) and a testimonial dimension (the speaker is not believed). However, it fits neatly into neither. It is not hermeneutical injustice because the speaker *has* the resources to make sense of their experience; they just aren't the *right* resources anymore. It is not testimonial injustice because the prejudice is against the vocabulary, not the identity. By carving out this middle ground, the project can argue that current taxonomies of epistemic injustice are insufficient for analyzing the ethics of institutional reform.

  The theoretical work will also need to address the "Progress Objection." A likely counter-argument is that conceptual progress inevitably renders old terms obsolete, and this is a acceptable cost of moral improvement. If we refine the concept of "rape" to be more inclusive, we cannot cater to those who hold the narrower, outdated definition. To address this, the framework will distinguish between the *content* of the concept and the *treatment* of the user. One can accept the new concept as morally superior while still arguing that penalizing the user of the old concept constitutes an epistemic injustice. The injustice lies not in the existence of the new concept, but in the immediate withdrawal of credibility from those transitioning to it. This nuance allows the research to avoid being anti-progress while still critiquing the implementation of progress.

  ## Case Study Descriptions: Institutional Features and Dynamics

  To test the theoretical framework and ensure the analysis is grounded in practical reality, the research will utilize a structured comparison of two institutional adoption cases. These cases will be described in sufficient detail within the paper to allow for analysis without relying on obscure historical facts or external data collection. They are constructed as composite archetypes based on common institutional behaviors observed in contemporary organizational ethics. This approach ensures that the variables can be controlled and the epistemic dynamics isolated.

  **Case Study 1: The Corporate Harassment Taxonomy**

  The first case involves a mid-sized technology corporation implementing a revised Human Resources policy regarding workplace conduct.
  *   **The Legacy Framework:** For the first ten years of its operation, the company utilized a standard "Professional Conduct" policy. Harassment was defined primarily through explicit behaviors: physical touching, explicit verbal threats, or overt discrimination based on protected classes. Complaints were processed using terms like "unprofessional behavior," "hostility," or "interpersonal conflict." This framework was well-understood by employees. They knew that to file a complaint, they needed to demonstrate a violation of these specific boundaries.
  *   **The Engineered Concept:** Following industry-wide shifts and pressure from employee resource groups, the company adopts a new "Psychological Safety" framework. This framework introduces engineered concepts such as "exclusionary language," "epistemic undermining," and "affective dissonance." The policy explicitly states that these new categories supersede the old "Professional Conduct" definitions. The new concepts are broader and more subjective, focusing on the *impact* on the recipient rather than the *intent* of the actor.
  *   **Institutional Features:** The adoption is mandatory. All employees must complete training on the new terms. Crucially, the HR intake forms are changed. There is no longer a checkbox for "unprofessional behavior." There are only checkboxes for the new specific categories. If an employee describes an incident using the old language (e.g., "He was being hostile and unprofessional"), the HR system flags the complaint as "insufficiently categorized." The HR representative is trained to ask the employee to reframe their experience using the new terminology. If the employee cannot do this, the complaint is not processed.
  *   **The Epistemic Dynamic:** Long-term employees, particularly those in technical roles who valued the precision of the old rules, find themselves unable to articulate their grievances in the new language. They feel the harm, but they reject the new vocabulary as overly therapeutic or vague. When they persist in using the old terms, they are marked as "resistant to culture change" or "unable to grasp modern workplace norms." Their credibility as witnesses to their own mistreatment is diminished not because they are lying, but because they are speaking the "wrong language." This case isolates the variable of *procedural enforcement*: the institution structurally blocks the old concepts.

  **Case Study 2: The Medical Consent Protocol**

  The second case involves a university hospital updating its informed consent protocols for a specific surgical procedure.
  *   **The Legacy Framework:** Historically, consent was obtained via a "Standard Disclosure" model. The physician was required to list the material risks as defined by medical consensus. The patient signed a form acknowledging they understood these risks. The concept of "understanding" was binary: the patient either signed or they did not. If a patient later claimed they didn't understand, the signed form was the primary epistemic artifact validating the physician's account.
  *   **The Engineered Concept:** In response to patient advocacy groups, the hospital adopts a "Continuous Dialogue" model. The concept of "consent" is re-engineered from a singular event (signing) to an ongoing process ("consenting"). The new policy requires physicians to document "teach-back" moments where the patient explains the risk back to the physician. The new concept emphasizes "autonomy alignment" over "risk disclosure."
  *   **Institutional Features:** The electronic health record (EHR) system is updated to require specific fields related to the new "Continuous Dialogue" metrics. If a physician uses the old "Standard Disclosure" notes, the legal department flags the file as non-compliant. Conversely, patients who attempt to consent using the old framework (e.g., "Just tell me the risks and I'll sign") are flagged by the system as "potentially vulnerable" or "lacking health literacy." The institution now views the refusal to engage in the "Continuous Dialogue" as a sign of patient incapacity rather than a preference for efficiency.
  *   **The Epistemic Dynamic:** Here, the conceptual-lag injustice flows in two directions. Physicians who rely on the old efficient model are deemed negligent or paternalistic. However, patients who prefer the old model (perhaps due to cultural preferences for authority or anxiety about detailed discussion) are deemed to lack the capacity to consent. Their testimony ("I understood and I agreed") is given less weight because they did not perform the new conceptual ritual of "teach-back." The credibility deficit attaches to the failure to utilize the engineered concept of "continuous consent." This case isolates the variable of *performative requirement*: the concept requires a specific behavioral performance to be valid.

  **Comparative Utility**

  These two cases are selected because they represent different modes of institutional power. The corporate case represents *categorical exclusion* (your terms don't fit our boxes). The medical case represents *performative invalidation* (your behavior doesn't fit our process). Both result in a credibility deficit for users of the legacy framework. By comparing them, the research can determine if conceptual-lag injustice is a unified phenomenon or if it manifests differently depending on the institutional mechanism. The detailed description of the HR forms and the EHR system within the paper will allow for a granular analysis of exactly where the epistemic friction occurs, without needing to cite specific real-world lawsuits or policies that might complicate the philosophical analysis with extraneous legal facts.

  ## Methodology and Analytical Plan

  The research will employ a mixed methodological approach, combining traditional conceptual analysis with structured case comparison. The goal is to move from the descriptive (what is happening in these cases) to the normative (is this unjust, and how do we fix it). The methodology is divided into three phases, each corresponding to a section of the final paper.

  **Phase 1: Mechanism Analysis**
  The first phase involves dissecting the credibility-deficit mechanisms in the two case studies. The analysis will ask: precisely why is the speaker not believed? Is it because the listener literally cannot understand the old terms? Or is it because the listener understands but assigns them zero institutional weight? This distinction is vital. If the listener cannot understand, it is a hermeneutical gap. If the listener understands but discounts the terms due to policy, it is a structural credibility deficit. The research will map the flow of testimony in the cases: Speaker utters Term A (Legacy) -> Institution recognizes only Term B (Engineered) -> Speaker is assigned Low Credibility. The analysis will determine if the Low Credibility assignment is a rational bureaucratic response (we can't process this) or an epistemic vice (we shouldn't dismiss this). This phase relies on the detailed institutional features described in the case study section.

  **Phase 2: Classification and Differentiation**
  The second phase tests the hypothesis that conceptual-lag injustice is distinct from testimonial and hermeneutical injustice. This will be done through a process of elimination.
  *   *Test against Testimonial Injustice:* Does the credibility deficit persist if we control for identity? In the constructed cases, we can imagine a scenario where a high-status identity (e.g., a senior partner or a wealthy patient) uses the legacy terms and still suffers the deficit. If the deficit holds, it is not purely identity-based prejudice.
  *   *Test against Hermeneutical Injustice:* Does the speaker lack the resources to understand their experience? In the cases, the speaker understands the harm (harassment or lack of autonomy) perfectly well using the old terms. The resource exists; it is just deprecated. If the harm persists despite the availability of the old resource, it is not a standard hermeneutical gap.
  *   *Test against Conceptual Competence:* Is the speaker simply incompetent? The analysis will argue that competence is relative to the framework. If the framework shifts overnight, prior competence is not erased, but it is rendered institutionally useless. The injustice lies in the lack of recognition for prior competence.

  **Phase 3: Normative Criteria Formulation**
  The third and most ambitious phase is the development of normative criteria to distinguish legitimate reform from harmful imperialism. The research will propose and test three specific criteria:
  1.  *Reversibility:* Can the institution revert to the old framework if the new one fails? If the adoption is irreversible (e.g., legal precedents that erase the old definition), the risk of injustice is higher.
  2.  *Transitional Accessibility:* Is there a period where both frameworks are accepted? A just transition allows for a "bilingual" period where legacy terms are translated by the institution rather than rejected by the speaker.
  3.  *Proportional Representation:* Do the designers of the new concept include representatives of those likely to hold the legacy view? If the new concept is designed solely by those who already accept it, it risks being imperialistic.

  The methodology here is reflective equilibrium. I will apply these criteria to the two cases. If the criteria yield intuitive results (e.g., identifying the Corporate Case as unjust because it lacked a bilingual period, while identifying a hypothetical third case as just), the framework is successful. If the criteria classify clearly just reforms as unjust, or vice versa, the framework must be revised. This iterative process will form the core of the paper's argumentative arc.

  ## Normative Criteria and Decision Framework

  A successful result for this research project is the production of a decision framework that institutions can use to evaluate their conceptual engineering projects. This section outlines the preliminary version of that framework, which the final paper will refine. The framework is designed to answer the research question: *Is this conceptual reform generating conceptual-lag injustice?*

  **Criterion 1: The Translation Obligation**
  The first condition for justified reform is the Translation Obligation. When an institution introduces a new concept, it bears the burden of translating legacy claims into the new framework, rather than placing the burden on the speaker. In the Corporate Case, the HR system required the *employee* to reframe "hostility" as "affective dissonance." This violates the Translation Obligation. A just system would allow the employee to use "hostility" and have the HR system internally map it to the new category. If the institution fails to provide this translational bridge, it generates a credibility deficit based on linguistic labor rather than the merit of the claim. The framework will argue that failing this obligation is a prima facie indicator of conceptual-lag injustice.

  **Criterion 2: The Competence Preservation Clause**
  The second condition is Competence Preservation. Institutional reform must explicitly recognize the validity of the legacy framework for a transitional period. It must acknowledge that speakers using the old terms are not incompetent, but merely pre-transition. In the Medical Case, patients who preferred the "Standard Disclosure" were flagged as lacking literacy. This violates Competence Preservation. A just reform would record the patient's preference as a valid mode of consent, even if it differs from the new ideal. The framework will propose that institutions must codify the continued validity of legacy concepts for a set duration. If the institution treats legacy usage as evidence of incapacity, it fails this criterion.

  **Criterion 3: The Exit Option**
  The third condition is the Exit Option. Is it possible for a sub-group to opt out of the new conceptual scheme without suffering severe penalties? In total institutional environments (like prisons or strict corporate cultures), the exit option is non-existent. In looser associations, it might be possible. The framework will assess the "cost of exit." If the cost of retaining the old concept is exclusion from essential goods (employment, healthcare), the reform borders on conceptual imperialism. The decision framework will include a metric for assessing the severity of the penalty for conceptual non-compliance.

  **Application to Cases**
  Applying this framework to the Corporate Case suggests a finding of injustice. The Translation Obligation was violated (employee had to reframe), Competence Preservation was absent (old terms were invalid), and the Exit Option was closed (complaints couldn't be processed). Applying it to the Medical Case yields a mixed result. The Translation Obligation was partially met (physicians had to translate for patients), but Competence Preservation was violated (patients were flagged as vulnerable). This nuanced result demonstrates the utility of the framework: it allows us to say one reform was worse than the other, rather than condemning all conceptual engineering.

  **Defining Failure**
  It is important to define what constitutes failure for this research. Failure would occur if the analysis demonstrates that conceptual-lag injustice is indistinguishable from standard testimonial injustice. For example, if it turns out that the only people suffering the credibility deficit in the Corporate Case are women or minorities, then the "conceptual" aspect is a red herring, and the harm is just identity prejudice wearing a mask. Another form of failure would be if the normative criteria prove too restrictive, classifying all conceptual progress as unjust. If the framework implies we can never replace a concept without harming someone, it is practically useless. The research must find a "sweet spot" where progress is possible but the transition is managed ethically. If no such spot can be theoretically defended, the project will have to conclude that conceptual-lag injustice is an unavoidable tragedy of progress, which is a significant, albeit pessimistic, result.

  ## Scope, Risks, and Feasibility Assessment

  Executing this research within a one-semester timeline presents specific challenges. This section provides an honest assessment of scope risk, identifying which analytical steps are feasible and which must be bracketed to ensure the completion of a 6,000-word paper.

  **Feasible Components**
  The conceptual analysis of the credibility deficit is highly feasible. This relies on philosophical argumentation and logic, which can be developed through drafting and revision without external data. The description of the two case studies is also feasible because they are constructed archetypes. I have full control over their variables, meaning I do not need to spend time gathering historical data or navigating institutional review boards. The formulation of the three normative criteria (Translation, Competence, Exit) is scoped appropriately for a semester paper. These can be introduced, defined, and tested within the word limit.

  **Scope Risks and Mitigation**
  The primary risk is "Scope Creep" regarding the literature review. The fields of epistemic injustice and conceptual engineering are vast. There is a temptation to engage with every nuance of Fricker's later work, or every objection raised by proponents of conceptual engineering. To mitigate this, the paper will bracket deep metasemantic debates. For example, I will not argue about whether concepts *can* be engineered in a metaphysical sense. I will take it as a given that institutions *do* change definitions, regardless of the metaphysical status of the concepts. This allows the paper to focus on the *ethical* implications rather than the *metaphysical* possibility.

  A second risk is the collapse of the distinction between testimonial and conceptual-lag injustice. As noted in the failure conditions, if the analysis shows that identity prejudice is always the root cause, the project loses its novelty. To mitigate this, the case studies will be explicitly designed to control for identity. I will specify in the case descriptions that the credibility deficit applies to high-status actors as well. This ensures the argument remains focused on the conceptual mechanism. However, I must acknowledge in the limitations section that in the real world, these factors often overlap. The paper will claim distinctness in *principle*, even if they overlap in *practice*.

  A third risk is the normative framework becoming too abstract. To prevent this, the paper will anchor the criteria in the specific details of the case studies. Every time a criterion is mentioned, it will be immediately illustrated with a reference to the HR forms or the Medical EHR system. This keeps the philosophy grounded.

  **Bracketed Elements**
  Several related topics must be bracketed to maintain focus.
  1.  *Legal Implications:* While the cases involve policy, the paper will not analyze the legal liability of conceptual-lag injustice. That requires legal expertise and expands the scope beyond social epistemology.
  2.  *Psychological Impact:* The paper will not measure the psychological harm to the victims. It will focus solely on the epistemic harm (credibility and intelligibility).
  3.  *Global vs. Local:* The research focuses on institutional contexts (corporations, hospitals). It will not make claims about societal-wide conceptual changes (e.g., the change in the concept of "marriage" across a whole culture), as the mechanisms of enforcement differ too greatly.

  **Timeline**
  *   *Weeks 1-3:* Refine the definition of conceptual-lag injustice and finalize the case study details.
  *   *Weeks 4-6:* Draft the Literature Review and Theoretical Framework sections.
  *   *Weeks 7-9:* Draft the Case Study Analysis and apply the Normative Criteria.
  *   *Weeks 10-12:* Revise for coherence, ensure the distinction from testimonial injustice is robust, and edit for word count.
  *   *Weeks 13-14:* Final polish and scope check.

  This timeline is aggressive but manageable given that the research is theoretical. The most time-consuming part will be refining the normative criteria to ensure they are not easily countered.

  ## Conclusion: The Value of the Proposed Research

  This research proposal outlines a project that addresses a critical blind spot in contemporary social epistemology. As institutions become more active in engineering the concepts we use to navigate social life, the risk of conceptual-lag injustice increases. We are moving from an era where concepts were discovered to an era where they are designed. This shift brings benefits, but it also brings the specific harm of rendering legacy users epistemically obsolete.

  By investigating whether this harm constitutes a genuine form of epistemic injustice, the paper contributes to the taxonomy of epistemic wrongs. It challenges the assumption that conceptual progress is inherently benign. By formulating normative criteria for justified reform, the paper offers practical guidance for institutions. It suggests that ethical conceptual engineering is not just about creating better concepts, but about managing the transition for those holding the old ones.

  The project is scoped appropriately for a one-semester timeline. It relies on constructed cases to ensure data availability and focuses on conceptual analysis to ensure depth. The risks are identified and manageable. If successful, the paper will provide a robust framework for distinguishing between necessary progress and conceptual imperialism. If it fails, it will nonetheless clarify the boundaries of epistemic injustice by testing the limits of current categories. Either outcome advances the understanding of how power, concepts, and credibility interact in institutional settings. The proposed research is therefore both theoretically significant and practically viable, offering a timely intervention in the ethics of conceptual change.
