answer: |-
  This is a fantastic set of questions. You are hitting on the exact fault lines where computer science meets philosophy in the logical uncertainty literature. Your instincts are largely correct, but your friend's positions represent a specific (and common) interpretation of what the Logical Induction (LI) framework is *doing* that needs to be disentangled from what it is *achieving*.

  Here is a breakdown of the three points, structured to help you prepare your seminar notes and problem set.

  ### 1. The Dutch Book Objection: Existence vs. Exploitability

  **Your Objection:** At any finite stage $t$, the LI prices are incoherent. Therefore, a Dutch Book exists. Therefore, the agent is irrational.
  **Your Friend's Objection:** The Dutch Book exists, but no polynomial-time trader can find it.

  **Verdict:** You are technically right about the *math*; your friend is right about the *norm*. The "hole" in your objection isn't logical, it's normative.

  **The Analysis:**
  The classical Dutch Book argument for probabilism relies on a hidden premise: **Rational agents must avoid *any* sure loss.** This premise implicitly assumes logical omniscience. If you are logically omniscient, you can see the incoherence, and therefore you should fix it.

  Logical Induction proposes a new normative standard: **Rational agents must avoid *efficiently findable* sure losses.**

  The LI criterion (the "no polynomial-time Dutch book" condition) is a relaxation of the coherence criterion. It admits that for a bounded agent, *some* incoherence is inevitable. The normative claim is that an agent is only irrational if they leave money on the table that a competitor with *similar computational resources* could pick up. If the Dutch Book requires exponential time to construct, a bounded agent cannot be faulted for failing to avoid it.

  **Where your objection breaks:**
  It breaks if you intend to use LI as a defense of *classical* Bayesian norms. It does not save Bayesianism from the charge of demanding logical omniscience; rather, it replaces Bayesianism with a theory of **bounded rationality**.

  If you present LI to your students as "This solves the problem of logical omniscience for Bayesians," you will be vulnerable to your own objection. If you present it as "This is a proposal for a new norm of rationality suitable for computationally bounded agents," your objection dissolves. The incoherence at finite stages is a *feature*, not a bug—it's the price of admission for being computable.

  **Seminar Tip:** Frame this as a clash between **Ideal Norms** (Coherence) and **Resource-Bounded Norms** (Efficient Market Hypothesis for logic). The LI framework argues that for a finite agent, the Ideal Norm is not just unreachable, but *wrong*.

  ### 2. The Continuum Hypothesis and the "Ur-Prior"

  **Your Friend's Claim:** LI converges to 1 on true statements, so it solves the prior problem for undecidables like CH.
  **Your Skepticism:** This sounds too strong.

  **Verdict:** Your skepticism is warranted. Your friend is making a category error regarding truth and provability.

  **The Analysis:**
  The Logical Induction Criterion guarantees that the prices converge to 1 for every **provable** statement (and 0 for every disprovable statement).
  *   If a statement $\phi$ is a theorem of the base theory (e.g., ZFC), $P_t(\phi) \to 1$.
  *   If $\phi$ is independent (like CH in ZFC), there is no proof.

  For independent sentences, LI guarantees that the probabilities will *converge* to some value $p \in [0,1]$, but **it does not guarantee that $p$ corresponds to the "truth" of $\phi$.**

  Why? Because for independent sentences, "truth" is model-relative. CH is true in some models of ZFC and false in others. The Logical Inductor operates syntactically on sentences; it does not have access to a specific Platonic model of set theory. The limit value for CH will depend on the specific initialization of the inductor (the specific ensemble of traders). One logical inductor might converge to 0.3 on CH, another to 0.8. Both satisfy the Logical Induction Criterion.

  Therefore, LI does **not** deliver "the correct prior." It delivers *a* coherent (in the limit) prior. It dissolves the *impossibility* of having a prior over mathematical sentences, but it does not solve the *underdetermination* problem. You still need a principled way to select *which* logical inductor to use if you want a specific value for CH.

  **Seminar Tip:** This is a great place to discuss the difference between **Syntax** (provability) and **Semantics** (truth in a model). LI masters syntax. It does not magically access semantics for independent sentences.

  ### 3. The $10^{12}$th Digit of Pi

  **Your Friend's Claim:** The digit is fixed, so credence must be 0 or 1.
  **Your Claim:** Intermediate credence is rational for bounded agents.

  **Verdict:** You are right. Your friend is conflating **Metaphysical Probability** with **Epistemic Probability**.

  **The Analysis:**
  Your friend is adhering to the classical Bayesian view that probability is defined over a sample space of "possible worlds." In the standard possible worlds semantics for logic, there are no worlds where the axioms of arithmetic hold *and* the $10^{12}$th digit of $\pi$ is other than what it is. Thus, in that framework, the proposition is true in 100% or 0% of the logically possible worlds.

  However, this makes probability useless for modeling mathematical reasoning *before* the proof is found. The LI framework (and the broader field of logical uncertainty) argues that we should model **impossible possible worlds**. We assign weight to worlds that are logically inconsistent but *computationally indistinguishable* from consistent ones given our current resources.

  The claim that the credence "has to be 0 or 1" is a normative claim about ideal agents. For a resource-bounded agent, a credence of 10% reflects the **frequency with which digits of $\pi$ turn out to be 7** in the absence of specific calculation. It is a statement about the agent's state of knowledge, not the state of the number.

  **Seminar Tip:** Use this to introduce the concept of **Pseudo-Randomness**. To a bounded agent, the digits of $\pi$ look random. A rational credence should reflect that apparent randomness. If your friend insists on 0 or 1, ask them what bet they would take. If they are truly credence 1, they should bet their life on it without checking. If they hesitate, their *revealed* credence is not 1.

  ### Summary for Your Seminar Prep

  Here is how I would synthesize this for your lecture notes:

  1.  **On Dutch Books:** Acknowledge the incoherence. LI agents *are* Dutch-bookable at finite stages. The defense is that the Dutch Book is computationally inaccessible. This shifts the seminar from "How to save Bayesianism" to "What are the norms of bounded rationality?"
  2.  **On CH/Ur-Priors:** Correct the record. LI converges on independent sentences, but the limit is not determined by "truth." It is determined by the market dynamics of the traders. It does not solve the metaphysical underdetermination of independent axioms.
  3.  **On Pi:** Stand firm. This is the paradigmatic case for logical uncertainty. The friend's view renders probability theory useless for mathematics. The LI view treats mathematical facts as empirical data for a bounded observer.

  **Recommended Reading for the Session:**
  *   **Garrabrant et al. (2016):** "Logical Induction." (The source text).
  *   **Hacking (1967):** "Slightly More Realistic Personal Probability." (For the historical context of relaxing coherence).
  *   **Garber (1983):** "Old Evidence and Logical Omniscience." (To contrast the Bayesian attempts to solve this vs. the LI approach).

  Your friend is viewing LI as a **completeness result** for Bayesianism (it finishes the job). You are viewing it as a **replacement theory** (it changes the job). For the purposes of a philosophy seminar, your framing is the more fertile one. It opens up questions about the nature of rationality that the CS framing tends to close down.
