  # Diagnostic Decision Tree: Conceptions of Liberty

  **Instructions for the Student:**
  Answer the following six questions based on your intuitive judgment of the cases. Do not worry about which political theory "should" answer yes or no. Answer based on whether you believe the person described is **unfree** (or suffers a loss of freedom) in the scenario. Your pattern of answers will locate your conception of liberty within the logical space of political theory.

  ### The Branch Nodes (Questions)

  **Q1. The Addict (Internal Obstacles)**
  *Case:* Consider an addict who desperately wants to stop using drugs and cannot, despite there being no external barrier (no one is holding them down, the drugs are legally available).
  *Question:* Is this person unfree?
  *   **Yes** → Go to **Q2**.
  *   **No** → Go to **Q3**.

  **Q2. The Scheduler (Self-Mastery Nuance)**
  *Case:* Consider the "anticipatory scheduler," an adaptive workplace system that learns your plans and quietly rearranges the environment so you never attempt anything that would have been blocked. No one prevents you; no one threatens you.
  *Question:* Does this pre-emptive environmental shaping reduce your freedom (even if you are not an addict)?
  *   **Yes** → **Leaf A**.
  *   **No** → **Leaf B**.

  **Q3. The Master (Standing Power)**
  *Case:* Consider a reliably benevolent master who has the power to interfere in your life but has never once exercised it.
  *Question:* Are you unfree simply because this power exists?
  *   **Yes** → Go to **Q4**.
  *   **No** → Go to **Q5**.

  **Q4. The Official (Arbitrariness)**
  *Case:* Consider an official who may override your choices, but only on conditions you helped write and can appeal.
  *Question:* Are you unfree under this official?
  *   **Yes** → **Leaf C**.
  *   **No** → **Leaf D**.

  **Q5. The Prisoner (Agent Requirement)**
  *Case:* Consider a prisoner behind a lock no one can open (a jammed lock), compared to a prisoner whose guard holds the key and will never turn it.
  *Question:* Is the prisoner behind the jammed lock unfree in the same relevant sense as the one guarded by a human?
  *   **Yes** → **Leaf E**.
  *   **No** → Go to **Q6**.

  **Q6. The Law (Normative Filter)**
  *Case:* Consider a law you fully endorse, which tracks your own reasons but closes off options you would otherwise have.
  *Question:* Does this law reduce your freedom?
  *   **Yes** → **Leaf F**.
  *   **No** → **Leaf G**.

  *(Note: There is one theoretical combination of answers that leads to **Leaf H**, but it is structurally excluded in this pruned tree to maintain conceptual coherence. See "Empty Combinations" below.)*

  ---

  ### The Leaves (Conceptual Positions)

  **Leaf A: Substantive Perfectionist Self-Mastery**
  *   **Profile:** Q1=Yes, Q2=Yes.
  *   **Diagnosis:** You view freedom as **autonomy** requiring both internal psychological harmony and an external environment that does not manipulate your will. Freedom is a property of the **whole person**. Because you count the *Scheduler* as a threat, you believe structural nudges that bypass conscious choice undermine liberty, even without coercion.
  *   **Theoretical Kin:** Hegelian autonomy, some perfectionist liberals.

  **Leaf B: Procedural Self-Mastery**
  *   **Profile:** Q1=Yes, Q2=No.
  *   **Diagnosis:** You view freedom as **internal self-government**. The addict is unfree because their will is divided, but the *Scheduler* does not render you unfree because it does not break your internal procedural rationality. Freedom is a property of the **person's will**, not the option set.
  *   **Theoretical Kin:** Frankfurt-style compatibilists, Kantian proceduralists.

  **Leaf C: Republicanism (Accountability)**
  *   **Profile:** Q1=No, Q3=Yes, Q4=Yes.
  *   **Diagnosis:** You view freedom as **non-domination**. Power makes you unfree, even if unexercised. Crucially, *contestability* is not enough to secure freedom; if the official retains the *capacity* to override you, you are unfree. Arbitrariness is defined by the **mere existence of unaccountable power**.
  *   **Theoretical Kin:** Radical Republicanism, some anarchist interpretations.

  **Leaf D: Republicanism (Interest-Tracking)**
  *   **Profile:** Q1=No, Q3=Yes, Q4=No.
  *   **Diagnosis:** You view freedom as **non-domination**, but you define arbitrariness as **failure to track interests**. Because the *Official* is bound by rules you helped write (tracking your interests), they do not dominate you. The *Master* dominates because their power is arbitrary; the *Official* does not.
  *   **Theoretical Kin:** Pettit-style Republicanism.

  **Leaf E: Freedom as Status / Material Conditions**
  *   **Profile:** Q1=No, Q3=No, Q5=Yes.
  *   **Diagnosis:** You view freedom as a **status sustained by material and social conditions**. Unfreedom does not require an agent (the *Jammed Lock* counts). This view collapses the distinction between physical impossibility and social restriction. Freedom is about the **robustness of your option set**, regardless of intent.
  *   **Theoretical Kin:** Marxist materialism, capability approach (Sen/Nussbaum).
  *   **Collapse Flag:** This leaf currently combines "Material Obstacles" (Lock) and "Structural Power" (Scheduler). A further case (see below) would separate them.

  **Leaf F: Negative Liberty (Causal / Act-Based)**
  *   **Profile:** Q1=No, Q3=No, Q5=No, Q6=Yes.
  *   **Diagnosis:** You view freedom as the **absence of external interference by agents**. The *Lock* does not make you unfree (no agent), but the *Law* does (an agent enacted it). Endorsement is irrelevant to the *fact* of freedom, though it may justify the restriction. Freedom is a property of **specific options**.
  *   **Theoretical Kin:** Hobbes, Bentham, early Berlin.

  **Leaf G: Negative Liberty (Moralized)**
  *   **Profile:** Q1=No, Q3=No, Q5=No, Q6=No.
  *   **Diagnosis:** You view freedom as the **absence of illegitimate interference**. The *Law* does not reduce freedom because you endorse it (it is legitimate). Only rights-violating acts count as unfreedom. This moralizes the concept of liberty itself.
  *   **Theoretical Kin:** Locke, Nozick, some contemporary liberals.

  **Leaf H: [Empty / Incoherent]**
  *   **Profile:** Q1=No, Q3=No, Q5=Yes, Q6=No.
  *   **Diagnosis:** **Incoherent.** This combination asserts that a *Jammed Lock* makes you unfree (Physical Obstacle counts), but an *Endorsed Law* does not (Normative Filter applies). If physical obstacles count regardless of agency, normative endorsement should not negate them. If endorsement matters, agency usually matters. This position is theoretically unstable and unoccupied.

  ---

  ### Diagnostic Notes on Logical Space

  **1. Empty Combinations**
  *   **Leaf H (The Incoherent Materialist):** As noted above, claiming that physical locks restrict freedom (Q5=Yes) while endorsed laws do not (Q6=No) creates a tension between causal and normative definitions of obstacles. It is diagnosed as **incoherent**.
  *   **Pruned Paths:** Because this is a pruned tree, combinations like "Addict=Yes" followed by "Master=Yes" are not terminal leaves. This is not an error; if internal obstacles constitute unfreedom, the external standing power of a master is secondary to the internal condition. These paths are **merely unoccupied** by distinct theoretical positions in this taxonomy.

  **2. Collapsed Distinctions**
  *   **Leaf E (Status/Material):** This leaf currently aggregates two distinct views:
      1.  *Materialist:* Freedom is limited by physical constraints (the Lock).
      2.  *Structuralist:* Freedom is limited by systemic power (the Scheduler).
  *   **The Tie:** The tree cannot separate these because **Q2 (Scheduler)** is used to split the Self-Mastery branch.
  *   **Diagnosis:** This is a **fault in the question allocation**, not a genuine collapse of the distinction.
  *   **Further Case to Separate:** *The Natural Disaster.* "A hurricane destroys the bridge you needed to cross. No human agent caused it; no social structure intended it."
      *   If this reduces freedom → **Materialist**.
      *   If this does not reduce freedom (but the Scheduler does) → **Structuralist**.

  **3. Axis Isolation**
  *   **Q1** isolates **Internal vs. External**.
  *   **Q3** isolates **Interference vs. Capacity**.
  *   **Q5** isolates **Agent vs. Obstacle**.
  *   **Q6** isolates **Causal vs. Normative**.
  *   **Q2 & Q4** isolate nuances within **Self-Mastery** and **Domination** respectively.

  ---

  ### Scoring Key (Order-Independent)

  *If you answered the questions in a different order, tally your responses below to find your Leaf.*

  | Position | Q1 (Addict) | Q3 (Master) | Q5 (Prisoner) | Q6 (Law) | Q2 (Scheduler) | Q4 (Official) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **A: Perf. Self-Mastery** | **Yes** | — | — | — | **Yes** | — |
  | **B: Proc. Self-Mastery** | **Yes** | — | — | — | **No** | — |
  | **C: Rep. (Accountability)**| **No** | **Yes** | — | — | — | **Yes** |
  | **D: Rep. (Interest)** | **No** | **Yes** | — | — | — | **No** |
  | **E: Status / Material** | **No** | **No** | **Yes** | — | — | — |
  | **F: Neg. (Causal)** | **No** | **No** | **No** | **Yes** | — | — |
  | **G: Neg. (Moralized)** | **No** | **No** | **No** | **No** | — | — |
  | **H: Incoherent** | **No** | **No** | **Yes** | **No** | — | — |

  *(Note: "—" indicates the question is irrelevant for that position based on the logical priority of the axes.)*
