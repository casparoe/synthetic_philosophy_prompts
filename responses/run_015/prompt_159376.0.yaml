  # Seminar Handout: Persistence, Identity, and Data Modeling
  **Course:** Graduate Seminar on Persistence and Identity
  **To:** Philosophy and Information Science Students
  **From:** Course Instructors

  ## Part I: The Metaphysical Disputes in Data Vocabulary

  The following sections translate four central problems in the metaphysics of persistence into the vocabulary of relational schema design, temporal tables, and event logging. We assume a standard SQL environment supporting bitemporal modeling (Valid Time and Transaction Time).

  ### 1. The Argument from Temporary Intrinsics
  **The Metaphysical Problem:** How can one object $x$ be spherical at $t_1$ and crushed at $t_2$? If properties are intrinsic, $x$ has contradictory properties.
  **The Rival Treatments:**
  *   **Perdurantism:** $x$ is a 4D worm. The $t_1$-slice is spherical simpliciter; the $t_2$-slice is crushed simpliciter. No contradiction.
  *   **Endurantism:** $x$ is wholly 3D. $x$ bears the relation `is-spherical-at` to $t_1$ and `is-crushed-at` to $t_2$.

  **The Data Translation:**
  Consider a table `Objects`.
  *   **The Perdurantist Schema (SCD Type 2 / Event Log):**
      The primary key is composite: `(Entity_ID, Valid_Start, Valid_End)`.
      ```sql
      -- Row 1
      Entity_ID: 101 | Valid: [2020, 2021) | Shape: 'Spherical'
      -- Row 2
      Entity_ID: 101 | Valid: [2021, 2022) | Shape: 'Crushed'
      ```
      Here, `Entity_ID 101` designates the 4D worm. There is no single row where `Shape` is contradictory. The "object" at $t_1$ is strictly the result of `SELECT * WHERE Valid_Start <= t1`. The property `Shape` is intrinsic to the *row*, not the `Entity_ID` aggregate.

  *   **The Endurantist Schema (SCD Type 1 / Current State):**
      The primary key is simple: `(Entity_ID)`.
      ```sql
      Entity_ID: 101 | Shape: 'Crushed' | Last_Updated: 2021
      ```
      To handle the change without contradiction, the Endurantist must treat `Shape` not as a simple attribute but as a relation to time, either implicitly (via update history logs external to the object state) or explicitly:
      ```sql
      Table Object_Properties(Entity_ID, Time, Property, Value)
      ```
      Here, `Entity_ID 101` is the singular subject. The contradiction is avoided by making the property instantiation time-indexed (`Value` is 'Spherical' *at* `Time` 2020).

  ### 2. The Claim of Being "Wholly Present"
  **The Metaphysical Problem:** Endurantists claim a persisting thing is *wholly present* at each moment of its career. Perdurantists deny this; only a part is present.
  **The Data Translation:**
  *   **Endurantist Interpretation:** A query at any `Valid_Time` returns the *entire* identity of the object.
      ```sql
      SELECT * FROM Objects WHERE Entity_ID = 101;
      ```
      This returns the complete definition of `101`. The history is external metadata. The object *is* the current row. If the row is deleted, the object ceases to exist in the system.
  *   **Perdurantist Interpretation:** A query at any `Valid_Time` returns only a *cross-section*.
      ```sql
      SELECT * FROM Object_Slices WHERE Entity_ID = 101 AND Valid_Time CONTAINS t;
      ```
      This returns a slice. To retrieve the "object," one must aggregate all slices: `SELECT * FROM Object_Slices WHERE Entity_ID = 101`. The "whole" object is the sum of rows, none of which (individually) are the whole object. The Endurantist claim "wholly present" translates to the assertion that the `Entity_ID` reference resolves to a complete state description at $t$, not a pointer to a temporal extension.

  ### 3. Coincidence Cases (Statue and Alloy)
  **The Metaphysical Problem:** A statue and the portion of alloy constituting it share all spatial parts and matter at every instant they coexist, yet differ in persistence conditions (the alloy survives melting; the statue does not).
  **The Data Translation:**
  In a naive schema, these would share the same `Entity_ID` and `Material_Content` rows. To distinguish them, we must introduce distinct keys with identical data payloads but different *lifecycle constraints*.

  *   **Schema:**
      ```sql
      Table Statue(Statue_ID, Material_ID, Valid_Time)
      Table Alloy(Alloy_ID, Material_ID, Valid_Time)
      ```
  *   **The Distinction:**
      Both tables may point to the same `Material_ID` rows (sharing matter). The difference lies in the *Business Rules* (Triggers/Constraints) governing termination.
      *   *Alloy Rule:* `DELETE FROM Alloy` only if `Material_ID` is dispersed.
      *   *Statue Rule:* `DELETE FROM Statue` if `Shape` changes from 'Statuesque' (even if `Material_ID` persists).
  *   **The Tension:** In SQL, if two rows have identical data and valid times, they are often redundant. To maintain coincidence, we must enforce distinct Primary Keys (`Statue_ID` vs `Alloy_ID`) despite 1:1 data overlap. The metaphysical difference is encoded not in the *data* (the matter), but in the *schema constraints* (the persistence conditions).

  ### 4. The Problem of the Many (Maximality)
  **The Metaphysical Problem:** If a person is a 4D worm, any temporal sum of parts (e.g., the person-from-1990-to-1995) is also a person-like object. Why are *you* the maximal worm and not one of these shorter sums?
  **The Data Translation:**
  This is the **Grouping Key Problem**.
  Consider an append-only event log `Person_Events`.
  *   **The Objection:** Any contiguous subset of rows sharing a `Person_ID` constitutes a valid 4D sum. Why does `Person_ID = 1` refer to the 80-year worm rather than the 5-year worm?
  *   **Perdurantist Obligation:** The schema must enforce a **Maximality Constraint**.
      ```sql
      -- Conceptual Constraint
      ASSERT THAT no two Person_IDs overlap in Valid_Time AND share continuity.
      ```
      If a subset of rows could be assigned a new `Person_ID_Subset`, the ontology proliferates. The Perdurantist must argue that the `Entity_ID` is assigned by a rule of *maximal continuity*. The objection claims the SQL schema allows arbitrary re-grouping of rows into new `Entity_IDs` (shorter worms) that are equally valid candidates for personhood. The Perdurantist owes an account of why the `GROUP BY Entity_ID` clause is privileged over any other temporal partitioning.

  ---

  ## Part II: Residue Report (What the Translation Misses)

  ### 1. Clean Translations
  *   **Temporary Intrinsics:** This maps cleanly to the distinction between SCD Type 1 (overwrite) and Type 2 (history). The logical contradiction of "A and not-A" is resolved in SQL exactly as the Perdurantist resolves it: by partitioning the state space into disjoint temporal intervals.
  *   **Coincidence:** This maps to the distinction between *Data* and *Constraints*. Two tables can hold identical data but enforce different referential integrity rules. This faithfully captures the idea of "same matter, different persistence conditions."

  ### 2. Distorted Translations
  *   **Wholly Present:** In SQL, "whole" usually means "all columns." In metaphysics, it means "all parts." A Perdurantist looking at a Type 2 table sees the "whole" object as the aggregate of rows. An Endurantist looking at a Type 1 table sees the "whole" object as the single current row. The distortion arises because SQL tables are atemporal structures *representing* time. The "presence" in the database is always a query result, never an ontological mode of being. Students may mistake the *completeness of the record* for the *completeness of the object*.
  *   **Maximality:** In SQL, `Entity_ID` is arbitrary. We can re-key a table anytime. In metaphysics, identity is supposed to be mind-independent. The translation suggests that persistence conditions are a matter of *schema design choice* (how we choose to group rows) rather than *discovery* (how the world is grouped). This risks convincing engineers that identity is merely a modeling convention.

  ### 3. Failures (Inexpressible in Schema)
  *   **Modal Force:** A database constraint (`CHECK`, `FOREIGN KEY`) can be dropped by an administrator with `ALTER TABLE`. Metaphysical necessity (e.g., "The statue *cannot* survive melting") is not merely a rule we agree to enforce; it is a claim about reality. The schema can model the *rule*, but it cannot model the *necessity* of the rule.
  *   **Consciousness/Unity:** The "Person" case involves a unity of experience. A SQL aggregate of rows has no unity other than the index. The translation completely loses the phenomenological glue that might justify why *I* am the maximal worm and not a temporal part.

  **Warning to Students:** Do not assume that choosing a Primary Key settles the metaphysical dispute. A Primary Key is a stipulation of identity for the sake of retrieval; it is not a discovery of identity for the sake of truth.

  ---

  ## Part III: Verdict on "Corrigible Perdurance"

  You have identified a tension between **Bitemporal Modeling** and **Standard Eternalist Perdurantism**.

  **The Phenomenon:**
  In a bitemporal table, we can insert a row today (`Transaction_Time = Now`) with a `Valid_Time` in the past (`Valid_Time = 2020`).
  *   **Metaphysical Standard:** In standard perdurantism (Eternalism), the 4D manifold is fixed. The temporal part at 2020 exists eternally. It does not "come into existence" in 2024.
  *   **Database Reality:** The *row representing* the 2020 part comes into existence in 2024.

  **Analysis of "Corrigible Perdurance":**
  You asked if this is (1) a genuine third position, (2) a variant of perdurantism, or (3) an artifact of the schema.

  **Verdict: It is primarily (3) an Artifact of the Epistemic/Ontic Distinction, but functions as (2) a Variant for Social Ontology.**

  1.  **Why it is an Artifact (Physical Ontology):**
      Standard perdurantism models *being*. Bitemporality models *knowledge of being*.
      *   `Valid_Time` represents when the fact obtained in the world.
      *   `Transaction_Time` represents when the fact was recorded in the system.
      When you insert a past-dated row, you are not adding a temporal part to the object's history; you are correcting the *map* of the object's history. The 4D worm did not grow a new slice in 2020; your *representation* of the worm was updated.
      If you treat the database as the ontology (i.e., "if it isn't in the table, it doesn't exist"), you are conflating the territory with the map. In this context, "Corrigible Perdurance" is a category error: it applies the corrigibility of *propositions* to the in corrigibility of *spacetime parts*.

  2.  **Why it is a Variant (Social/Institutional Ontology):**
      However, your Information School students deal with **institutional facts** (contracts, degrees, land titles, patient records). For these entities, the record *constitutes* the reality.
      *   If a university backdates a degree to 2020, the degree *did not exist* in 2020, but now it is *true* that it existed in 2020.
      *   Here, the "temporal part" (the status of being a graduate) is indeed added to the past. The 4D worm of the *institutional entity* is corrigible because its existence depends on the transaction time of the record.
      *   In this specific domain, "Corrigible Perdurance" is a genuine variant of perdurantism. It implies a **Branching Time** or **Retroactive Causation** model for social objects. The past of a social entity is not fixed until the transaction is closed.

  **Conclusion for the Seminar:**
  For physical objects (statues, persons), "Corrigible Perdurance" is an artifact of modeling epistemic access. It does not challenge the fixed 4D manifold.
  For institutional objects (degrees, balances), "Corrigible Perdurance" is a genuine ontological feature. The "past" of a social entity is mutable because the entity's existence is dependent on the current state of the registry.

  **Instructional Note:** Do not present this as a solution to the metaphysical problem of time. Present it as a boundary marker: Data Engineering vocabulary captures the *logic of records* perfectly. It captures the *logic of being* only where being is constituted by records.
