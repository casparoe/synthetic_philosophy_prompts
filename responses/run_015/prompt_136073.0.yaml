answer: |-
  The principle that saves all five verdicts is **The Principle of Proprietary Necessity**, governed by a specific **Stewardship Constraint**.

  ### The Principle

  **Moral trade-offs between incommensurable goods are permissible only when two conditions are met:**
  1.  **Existential Necessity:** The choice is unavoidable; the higher good cannot be preserved without the immediate loss of a primary duty (life, kin).
  2.  **Proprietary Authority:** The agent sacrificing the good has the moral authority to do so (i.e., they own the good, or the good is intrinsic to the person being saved).

  **The Stewardship Constraint (Resolving the Surgeon/Archive Tension):**
  This clause explains why weighing values is correct in the Surgeon case but an error in the Archive case.
  *   **Permissible Weighing (Surgeon/Father):** When the good being sacrificed (music, masterpiece) is *intrinsic* to the agent or patient, or owned by them, it may be weighed against their own survival or primary duty. The loss is a **Tragic Remainder** because a real value is destroyed, but the act is right because the owner/bearer consents (implicitly or explicitly) to sacrifice their *capacity* to save their *existence*.
  *   **Impermissible Weighing (Archive):** When the good being sacrificed (unique oral archive) is held in **Stewardship** (owned by no one, entrusted to the future/community), it cannot be entered into a utilitarian calculus. To weigh a unique, irreplaceable heritage against aggregate welfare (lives saved) is a **Category Error**. The State is not the owner; it is the trustee. A trustee cannot burn the trust to feed the beneficiaries.

  ### Application to Your Verdicts

  1.  **Surgeon/Pianist:** *Right, with Remainder.* The music is a capacity intrinsic to the patient. The patient (bearer) sacrifices a capacity to save existence. Proprietary Authority exists. Necessity exists. The music is not "outweighed" but overridden, leaving grief (remainder).
  2.  **Father/Child:** *Right, with Remainder.* The masterpiece is the Father's property/project. The child is his primary duty. He has Proprietary Authority over his art. Necessity exists (dying child). The art is sacrificed, not traded, leaving loss (remainder).
  3.  **State/Archive (Unique):** *Wrong.* The State is a Steward, not an Owner. The Archive is unique and irreplaceable (Non-Fungible). By weighing it against the hospital, the State treats a trusted heritage as a fungible resource. This violates the Stewardship Constraint. The wrongness lies in the *calculation itself*.
  4.  **State/Archive (Digital):** *No Wrong.* The digital backup is fungible/replicable. It does not hold the status of unique heritage requiring stewardship. It can be treated as a resource.
  5.  **Daughter/Mother:** *Wrong, No Remainder.* Fails **Existential Necessity**. Care could be arranged. The dilemma is false. Choosing self over duty is selfishness, not tragedy. No value is crushed by necessity; one is neglected by preference.
  6.  **Commander/Soldiers:** *Right, No Remainder.* Fails **Incommensurability**. The values are equal (Life vs. Life). This is not a trade of qualities but a distribution of scarcity. The lottery resolves the scarcity without violating a hierarchy. Misfortune, not moral loss.

  ### Prediction: The Dying Language

  **Case:** A society permits a dying language (12 speakers) to vanish in order to fund universal literacy programs.

  **Verdict:** **Wrong.**

  **Reasoning:** This is structurally identical to the **Unique Archive** case. A language with twelve speakers is a unique, irreplaceable repository of human thought and culture. It is a **Non-Fungible Good** held in trust by the society (or humanity) for the future.
  *   **Stewardship Constraint:** The society acts as a Steward. It does not own the language to extinguish it.
  *   **Impermissible Weighing:** Funding universal literacy is an aggregate welfare good (utilitarian). To extinguish the unique language *in order to* fund the general program is to treat the heritage as a budget line item. This is the moral error of commensuration.
  *   **Remainder:** This choice leaves a **Moral Debt**, not just a tragic remainder. Even if literacy rates rise, the extinction constitutes an injustice against the future and the distinct identity of the speakers. The society should fund both, or prioritize the preservation of the unique unless the society itself faces existential collapse (which literacy funding does not threaten).

  ### Summary
  Your intuition is coherent. The dividing line is not between Life and Art, but between **Ownership** and **Stewardship**. You may sacrifice what is yours (or what is part of you) to save a life. You may not sacrifice what is entrusted to you (unique heritage) to save others, because that transforms a sacred trust into a commodity. The "remainder" exists when a genuine value is crushed by necessity; it becomes "guilt" when a genuine value is crushed by calculation.
