prompt: |-
  I'm preparing questions for a podcast interview with a philosopher who defends a variant of perceptual disjunctivism she terms diachronic disjunctivism. According to this view, veridical perception involves not merely a direct relation to an object but a tacit normative commitment to that object's temporal continuity across perceptual updates; in hallucination, by contrast, this diachronic commitment is structurally absent rather than false. She uses this framework to reject the argument from illusion's common-kind premise, arguing that illusion and veridical perception differ not only in phenomenal character but in temporal binding. Draft eight to ten interview questions that go beyond exposition. I specifically want: one question pressing whether temporal-continuity commitments are genuinely perceptual rather than post-perceptual inferences; one addressing brief, isolated hallucinations where no temporal update is anticipated, with a follow-up keyed to her likely reply about binding failure that asks whether this collapses her position into a causal account of reference; and one asking whether making perceptual knowledge depend on diachronic stability renders it implausibly fragile under rapid environmental change. The tone should be formal and suitable for an academic audience; avoid generic biographical questions.
