      *   *Stronger Argument:* The user's instinct is right *about the analysis quality*, but wrong *about the dismissal*. It's not "bad risk analysis wearing a moral costume"; it's "moral philosophy attempting to use risk analysis tools without the necessary calibration data." The framework isn't blind, it's *bounded*.
