prompt: |-
  Hey. I teach a third-year seminar on the ethics of reproduction (18 students, mostly philosophy majors with a few bioethics minors) and I'm writing the final right now. Full disclosure on why I care: my partner and I are in the middle of IVF and the clinic handed us a brochure about tacking on polygenic scoring, and I havent been able to stop thinking about it since, so I want this exam to go at the real crux instead of the stuff everyone half-remembers from week two.

  What I want is ONE essay question — 60 minutes, about 1000 words, 30 marks, closed book — on procreative beneficence, that a student cannot pass by writing out the principle neatly and then listing three stock objections (the disability-rights critique, procreative autonomy, and some version of the eugenics worry). Please build the question around the crux below, and build the model answer and the marking scheme around it too.

  The crux, as I see it — reframe it if you like, but keep it load-bearing:

  The view says roughly this: of the possible children you could have, you should bring about the one expected to have the best life, or the best chance of the best life. The phrase I keep getting stuck on is of the possible children you could have. That comparator set is not handed to you by nature; it is partly something you make. You can wait six months and try again, you can do another stimulation cycle, you can use donor gametes, you can have children with a different partner, you can start earlier or later. So the option space is elastic and partly endogenous to your own earlier choices. That seems to give two horns:

  1. If the set is fixed by whatever reproductive attempt you happen to be in the middle of, the principle looks arbitrarily indexed to a decision — when to try, with whom, whose gametes — that is itself morally loaded, and near enough empty as a guide.
  2. If the set ranges over everything you could in principle bring about, the principle becomes an indefinitely expandable maximising instruction that either gives no determinate advice or tells you to keep enlarging your options forever.

  Second layer I want in there: what if the traits being selected on are positional or competitive — height is the easy example, but something like expected educational attainment works too, where the payoff depends on what everyone else's children are like. If everyone follows the principle, the ranking reshuffles and nobody's child ends up better off. That looks like a collective-action or ratchet structure. So: does applying the principle to positional traits undercut the very consideration — the child's expected well-being — that was supposed to justify it in the first place? And is that an objection to the principle, or only to a naive reading of best life?

  Third thing, if you can fit it: there's a move students always reach for, which is that we don't think parents are obliged to move to a better school district or change jobs or spend down their savings to improve an existing child's prospects, so why should they be obliged to pick the best embryo. I want the question to make them earn that analogy — what exactly would it have to show, and where might it break down (selection versus improvement, whether the child's identity is at stake, cost, the natural-lottery baseline). I dont want it just deployed.

  Deliverables:

  1. The question as the students will see it. I'd like a concrete vignette — some clinic scenario with, say, four embryos plus a realistic option to wait or do another cycle — and an explicit instruction to deal with the comparator-set problem and the positional-goods problem. Not a discuss-the-literature question.
  2. A model answer, 700 to 900 words, that actually performs the moves rather than naming them.
  3. A marking scheme: split the 30 marks into named components with marks each, say precisely which moves separate an A from a B and a B from a C, and give a one-line note for each component on how students standardly get it wrong.

  Constraints: no citations, no further reading, nothing that depends on anyone knowing a specific paper or a year — mentioning Savulescu by name is fine but nothing should hinge on a title or date, since the exam is closed book and half of them will misremember anyway. Don't build the vignette around disability; I'm sick of that example and it lets them run a memorised script. And please don't let it turn into a discuss both sides and split the difference question — I want there to be answers that are just wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**

      *   **Context:** Third-year seminar on ethics of reproduction (18 students, philosophy/bioethics).
      *   **Instructor's Motivation:** Personal stake (IVF + polygenic scoring brochure), wants to cut through memorized scripts.
      *   **Task:** Create ONE essay question (60 mins, ~1000 words, 30 marks, closed book), a model answer (700-900 words), and a detailed marking scheme.
      *   **Core Philosophical Problem (The Crux):** Procreative Beneficence (PB).
          *   *Issue 1: The Comparator Set.* Is the set of "possible children" fixed by the current cycle (arbitrary) or open-ended (maximizing nightmare/indefinite)?
          *   *Issue 2: Positional Goods.* If traits are competitive (height, education), does following PB lead to a ratchet effect where no one is better off, undermining the "best life" justification?
          *   *Issue 3: The Parental Obligation Analogy.* Why select embryos but not move school districts? Needs to be earned, not just asserted.
      *   **Constraints:** No citations/titles (Savulescu name okay), no disability vignette (overused), no "discuss both sides" split-the-difference structure (needs right/wrong answers), concrete vignette required.

  2.  **Drafting the Question (Deliverable 1):**

      *   *Goal:* Force students to confront the "Comparator Set" and "Positional Goods" issues within a specific scenario.
      *   *Vignette:* Needs to involve IVF, multiple embryos, and the option to cycle again. Avoid disability. Let's use cognitive/health traits or something like "immune resilience" or just general "well-being score." Let's go with a polygenic score for "overall health and educational potential" to trigger the positional aspect.
      *   *Scenario:* Clinic offers 4 embryos. Scores vary. Option to wait 6 months for a new cycle (costly, physically taxing) potentially yielding better scores.
      *   *Prompt:* Must explicitly ask about the scope of "possible children" and the positional goods problem.
      *   *Drafting thought:* Make sure the prompt doesn't just ask "Is PB right?" but "How does PB apply given X and Y?"
      *   *Refining the Prompt:* Ensure it demands a resolution, not just a description.

  3.  **Drafting the Model Answer (Deliverable 2):**

      *   *Goal:* Demonstrate the philosophical moves requested in the prompt without just listing objections. Needs to take a stance or show why one path is philosophically superior.
      *   *Length:* 700-900 words.
      *   *Key Moves:*
          1.  Address the Comparator Set (Fixed vs. Open). Argue that an open set makes PB too demanding/arbitrary, but a fixed set makes it morally arbitrary. *Solution:* A "reasonable option set" constrained by cost/burden, not just biological possibility.
          2.  Address Positional Goods. If everyone maximizes height/IQ, the average rises but relative advantage stays same. Does this violate PB? *Argument:* PB relies on *absolute* well-being, not relative. If the trait is purely positional, PB doesn't recommend it. If it has absolute value (health), it does.
          3.  Address the Parental Obligation Analogy. Why select embryo but not move house? *Distinction:* Identity affecting vs. Identity preserving. Selection determines *who* exists; improvement affects *who* exists. The obligation is stronger when it determines existence without imposing costs on an existing person.
      *   *Tone:* Academic, precise, argumentative.
      *   *Check:* Does it avoid the "three stock objections" trap? Yes, by focusing on the internal logic of PB regarding option sets and positional goods.

  4.  **Drafting the Marking Scheme (Deliverable 3):**

      *   *Goal:* 30 marks total. Clear differentiation between A, B, C.
      *   *Components:*
          1.  The Comparator Set Problem (10 marks).
          2.  The Positional Goods/Ratchet Problem (10 marks).
          3.  The Parental Obligation Analogy (5 marks).
          4.  Structure/Clarity/Conclusion (5 marks).
      *   *Differentiation:*
          *   *A:* Solves the tension (e.g., proposes a constrained option set), distinguishes absolute vs. positional value, nuanced analogy.
          *   *B:* Identifies the problems but doesn't resolve the tension, treats positional goods as simply "bad," analogy is superficial.
          *   *C:* Recites PB definition, lists standard objections (disability, eugenics) despite instructions, ignores the vignette specifics.
      *   *Common Errors:* Need specific notes for each component.

  5.  **Review and Refine:**

      *   *Check against constraints:* No disability vignette? (Check, using health/education scores). No citations? (Check). One question? (Check).
      *   *Check against Instructor's "Crux":*
          *   *Comparator Set:* Is it central? Yes.
          *   *Positional Goods:* Is it central? Yes.
          *   *Parental Obligation:* Is it included? Yes.
      *   *Tone Check:* The instructor is stressed/personally invested ("I havent been able to stop thinking about it"). The output should be respectful, rigorous, and helpful. The model answer should feel like what a sharp third-year major *could* write, not a professor's lecture.
      *   *Word Count Check:* Model answer needs to be tight. 700-900 is roughly 1.5 - 2 single-spaced pages.
      *   *Marking Scheme:* Ensure the "One-line note on standard errors" is included.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the vignette explicitly mentions the option to wait/cycle again to trigger the "elastic option space" problem.
      *   *Correction:* Ensure the model answer doesn't just say "PB is wrong" but analyzes *how* PB functions under these constraints. The prompt asks to deal with the problems, not necessarily reject the principle entirely, though rejecting it based on these internal tensions is a valid path. I will steer the model answer towards a *reconstruction* of PB (moderating it) rather than outright rejection, as that shows deeper engagement.
      *   *Correction on Analogy:* Make sure the model answer distinguishes between "making a child better" and "making a better child."

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Self-Correction during final output generation)*: Wait, I need to make sure I don't use the disability objection. The prompt says "Don't build the vignette around disability." I will use "predicted educational attainment and immune resilience" as the traits.

  Let's assemble the pieces.cw
answer: |-
  ### 1. The Exam Question

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approx. 1000 words
  **Marks:** 30
  **Instructions:** Closed book. Answer the question below. Do not simply recite the Principle of Procreative Beneficence; apply it to the specific structural problems raised in the vignette.

  **Vignette:**
  Maya and Sam are at a fertility clinic. They have four viable embryos resulting from their latest IVF cycle. The clinic offers polygenic scoring for two traits: *immune resilience* (absolute benefit) and *educational attainment* (largely positional/competitive). Embryo A scores highest on both. Embryos B, C, and D score progressively lower.

  The clinic counselor notes that Maya is young and healthy. If they choose *not* to transfer any of these four, they could wait six months and attempt a new stimulation cycle. There is no guarantee of better embryos, but statistically, a new cycle expands the pool of "possible children" they could bring into existence. This involves significant financial cost, physical discomfort, and a six-month delay.

  **Essay Prompt:**
  Apply the Principle of Procreative Beneficence (PB) to Maya and Sam's decision. Specifically, you must address the following two structural problems:

  1.  **The Comparator Set:** Does PB require them to compare only the four existing embryos, or must they include the "possible children" from a future cycle? If the set of possible children is elastic (expandable by waiting or trying again), does PB become an indefinite maximizing instruction that fails to guide action?
  2.  **Positional Goods:** If *educational attainment* is a positional good (its value depends on being higher than others), does selecting for it undermine the PB justification that the child will have a "better life"?

  Finally, consider the objection that parents are not obliged to move to better school districts for existing children. Explain why this analogy might fail to excuse Maya and Sam from selecting Embryo A, or conversely, why it successfully limits their obligation.

  ***

  ### 2. Model Answer

  The Principle of Procreative Beneficence (PB) states that prospective parents have a moral obligation to select the child, from among possible children they could have, who is expected to have the best life. In Maya and Sam's case, a superficial application suggests they must choose Embryo A. However, the vignette reveals that PB collapses unless we resolve the scope of the "possible children" comparator set and the nature of the goods being selected.

  First, consider the comparator set. If PB applies only to the four existing embryos, the principle is arbitrarily indexed to a specific medical event. Why should Maya and Sam's moral obligation be determined by the random yield of *this* stimulation cycle? If they had started the cycle two months earlier, or with a different dosage, the set of embryos would differ. If the moral obligation is fixed by the immediate biological options, PB ignores the morally relevant fact that parents can influence which options exist. It renders the principle empty, as it forbids selecting a lower-scored embryo now even if a new cycle would likely yield a higher-scored one.

  However, if the comparator set includes all children they could *in principle* have—including those from future cycles—PB becomes a maximizing instruction that risks infinite regress. If they must always seek the *best* possible child, they should never transfer an embryo, because there is always a non-zero chance that waiting another cycle yields a genetically superior candidate. This turns procreation into a perpetual optimization problem where no action is permissible until the absolute maximum is found. Since biological potential is probabilistic and open-ended, a strict maximizing PB offers no determinate advice.

  To salvage PB, we must constrain the comparator set not by biological possibility, but by reasonable burden. The set of "possible children" should include only those accessible within a range of cost and effort that does not significantly compromise the parents' ability to care for the resulting child. In this vignette, a new cycle involves significant physical and financial cost. If those resources are needed to raise the child well, PB itself dictates stopping the search. Thus, the obligation is to select the best embryo from the *reasonable* option set, not the *theoretical* option set. This resolves the elasticity problem: the set expands only as far as the parents' welfare allows.

  Second, we must address the positional nature of *educational attainment*. PB justifies selection based on the child's expected well-being. If a trait is purely positional, its value derives from ranking higher than others. If all parents follow PB and select for higher educational potential, the average rises, but the ranking remains unchanged. No child is relatively better off; they simply face higher competition. In a purely positional market, following PB creates a ratchet effect where everyone exerts more effort (or selects more aggressively) for no net gain in well-being.

  Does this undercut PB? It depends on whether the trait has absolute value. *Immune resilience* is largely absolute; a healthier child is better off regardless of others' health. *Educational attainment*, however, is mixed. If the score predicts actual cognitive capacity (absolute), PB supports selecting it. If it predicts only social ranking (positional), PB cannot justify it on well-being grounds, because the selection does not improve the child's life, only their rank. Therefore, a coherent PB must distinguish between absolute and positional goods. Selecting Embryo A is justified by the immune resilience score, but the educational score provides no moral reason for selection unless it correlates with absolute cognitive goods. If the educational score is purely positional, selecting for it violates the spirit of PB by engaging in a zero-sum arms race that does not increase aggregate well-being.

  Finally, consider the analogy to existing children. Critics argue that if parents aren't obliged to move to a better school district to improve an existing child's prospects, they shouldn't be obliged to select a "better" embryo. This analogy fails because of the non-identity problem. Moving school districts affects an existing person; it imposes costs on a specific child who already has a claim to their parents' resources. Embryo selection determines *which* child comes into existence. Selecting Embryo A does not harm Embryo B; Embryo B simply never exists. Therefore, the obligation to select the better option is stronger in the procreative context because it does not impose a burden on an existing rights-bearer.

  However, the analogy holds regarding *cost*. Parents are not obliged to move school districts if it bankrupts them, because a destitute family harms the child. Similarly, Maya and Sam are not obliged to pursue infinite cycles if the cost undermines the home environment. The limit on obligation is not the distinction between selection and improvement, but the threshold of reasonable sacrifice. PB obliges selection only when the cost of accessing the "better" child does not detract from the "good life" that child is supposed to have.

  In conclusion, PB guides Maya and Sam only if modified. They should select Embryo A based on immune resilience, provided the cost of a new cycle is unreasonable. They should ignore the educational score if it is purely positional. The principle holds not as a command to maximize across all biological possibilities, but as a duty to choose the best life within a reasonable range of parental sacrifice.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 30

  **1. The Comparator Set Problem (10 Marks)**
  *   **A (8-10):** Identifies the tension between a fixed set (arbitrary) and an open set (indefinite maximizing). Proposes a solution (e.g., constraining the set by "reasonable burden" or "significant sacrifice"). Explicitly applies this to the vignette's option to wait/cycle again.
      *   *Standard Error:* Treating the four embryos as the only moral options without questioning why the cycle boundary matters.
  *   **B (5-7):** Identifies the tension but fails to resolve it, or suggests the set is fixed by biology. Acknowledges the "wait" option but doesn't explain how PB handles the elasticity.
      *   *Standard Error:* Saying "they should just pick the best of the four" without addressing the prompt's challenge about the arbitrary nature of that set.
  *   **C (0-4):** Defines PB but ignores the comparator set issue. Claims PB is simply "pick the best embryo."
      *   *Standard Error:* Reciting the principle without applying it to the "wait vs. transfer" dilemma.

  **2. The Positional Goods Problem (10 Marks)**
  *   **A (8-10):** Distinguishes between absolute goods (health/immune) and positional goods (ranking/education). Argues that PB loses justificatory force for purely positional traits due to the ratchet effect/zero-sum outcome. Applies this to the specific traits in the vignette.
      *   *Standard Error:* Claiming positional goods are "bad" without explaining why they undermine the *well-being* justification of PB.
  *   **B (5-7):** Identifies that education is competitive. Notes that everyone doing it cancels out the benefit. Fails to distinguish between absolute and positional elements or claims PB forbids positional selection entirely without nuance.
      *   *Standard Error:* Arguing that "everyone doing it makes it wrong" (collective action problem) without linking it back to the individual child's expected well-being.
  *   **C (0-4):** Ignores the positional aspect. Treats education score exactly like health score.
      *   *Standard Error:* Assuming higher score always equals better life regardless of social context.

  **3. The Parental Obligation Analogy (5 Marks)**
  *   **A (5):** Correctly identifies the Non-Identity distinction (selection vs. improvement of existing person) BUT accepts the cost constraint analogy (bankruptcy/harm). Nuanced view: obligation exists but is limited by parental welfare.
      *   *Standard Error:* Dismissing the analogy entirely or accepting it entirely without distinguishing identity-affecting choices.
  *   **B (3-4):** Uses the analogy to argue against PB (parents aren't obliged to do X, so not Y) without addressing the identity difference.
      *   *Standard Error:* "If I don't have to move schools, I don't have to pick embryos."
  *   **C (0-2):** Mentions the analogy superficially or not at all.
      *   *Standard Error:* "Parents should do everything for children" (ignores the prompt's constraint).

  **4. Structure, Clarity, and Conclusion (5 Marks)**
  *   **A (5):** Clear thesis. Arguments flow logically. Conclusion synthesizes the comparator and positional points into a coherent verdict for Maya and Sam.
      *   *Standard Error:* No clear conclusion or "splitting the difference" without justification.
  *   **B (3-4):** Readable but disjointed. Conclusion is vague.
      *   *Standard Error:* Ending with "it is a complex issue with valid points on both sides."
  *   **C (0-2):** Disorganized, hard to follow, or significantly under/over word count.
      *   *Standard Error:* Bullet points or note-form instead of essay prose.

  **General Penalty:**
  *   **Disability Objection:** If the student pivots to a standard disability rights critique (e.g., "this devalues disabled people") despite the vignette not involving disability and the prompt asking for structural analysis, cap the total mark at **15/30**. This indicates they are writing a memorized script rather than answering the question.
  *   **Citations:** Any specific citations (titles, years) are unnecessary; do not penalize for lack thereof, but do not reward name-dropping without argument.
