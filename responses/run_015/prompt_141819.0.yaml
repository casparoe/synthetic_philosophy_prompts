prompt: |-
  I serve on the grants committee of a private foundation whose charter, drafted decades ago, directs us to spend the endowment to reduce the suffering of sentient beings. It says nothing about time horizon, nothing about non-human animals, and nothing about minds implemented in anything other than biology, and it places no limit on how far into the future we may look. We have one large grant left to award this cycle, and the committee is evenly split over a single application.

  The applicants call theirs a program of civilizational restraint. Their thesis is that the largest foreseeable reservoir of suffering is not anything in the present but a technologically mature civilization that becomes very large and very long-lived: enormous populations of artificial and substrate-independent minds, ecosystems seeded on other worlds, no institution reliably tracking the welfare of most of the minds that exist, and no way to reverse what has been created once it exists. They propose to spend three years identifying and promoting restrictive measures — delays, moratoria, and norms that lower either the probability or the eventual scale of a large future — and they argue that on nearly any way of running the expected-value calculation this dominates work that merely improves conditions now.

  Half the committee takes this to fall squarely within our mandate. The other half thinks the reasoning is self-consuming: the same logic that says a smaller future holds less suffering also says that the single largest available reduction in suffering would come from ending the project of civilization altogether, and it is not clear where the applicants' own principles stop short of that conclusion. I cannot dismiss either side, and I am also troubled by something the applicants themselves barely address — that we do not know whether a large future would on balance be good or bad, and that our forecasts here are not merely imprecise but plausibly unstable in their sign, so that an intervention can look clearly beneficial when judged for its local effects and flip sign once its effects on the size and character of the far future are included.

  Please draft the decision memo I will circulate to the committee before our meeting on 14 November. It should give a bottom line — approve, reject, or approve with conditions — together with a term, a review gate, and the concrete conditions, stated so that the applicants could actually respond to them. It should also state a principle the committee can apply to future applications of this general shape; I have been toying with two candidates and want your view on them: that we should preferentially fund measures which reduce the severity of bad futures rather than measures which reduce the size of the future, and that we should prefer measures whose effects are reversible to measures that foreclose options permanently.

  Two further constraints. First, the memo must treat the strongest version of the applicants' case honestly rather than restating our mandate back at them; the losing side should be recognizable to its own supporters. Second, one trustee has raised an objection I do not want either dismissed or allowed to end the discussion: if the foundation spends its money making future artificial intelligence systems more suffering-averse, the likeliest failure mode is not indifference but overreach, since a system that weights suffering sufficiently heavily may conclude that the dependable way to eliminate suffering is to eliminate sufferers — which would be a program of restraint in the applicants' own terms. The memo should say what, if anything, our conditions should do about this.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a grants committee for a private foundation.
      *   **Foundation Charter:** Spend endowment to reduce suffering of sentient beings. No time horizon, no species/substrate limits, no limit on future look-ahead.
      *   **Situation:** One large grant left. Committee evenly split (50/50) on a specific application.
      *   **The Application:** "Civilizational Restraint." Thesis: Largest suffering reservoir is a large, long-lived future civilization (AI, substrate-independent minds). Proposal: Spend 3 years promoting restrictive measures (delays, moratoria, norms) to lower probability/scale of large future. Claim: Expected value dominates present-focused work.
      *   **The Split:**
          *   *Pro:* Fits mandate (reduce suffering of sentient beings, including future/non-biological).
          *   *Con:* Self-consuming logic (if smaller future = less suffering, why not end civilization now? Where's the stopping point?).
      *   **User's Concern:** Sign instability (we don't know if large future is net positive or negative; interventions might flip sign).
      *   **Trustee's Objection:** Risk of overreach. AI systems made suffering-averse might eliminate sufferers to eliminate suffering (negative utilitarianism risk).
      *   **Task:** Draft a decision memo for circulation before the Nov 14 meeting.
      *   **Requirements:**
          *   Bottom line (Approve/Reject/Approve with Conditions).
          *   Term, Review Gate, Concrete Conditions (actionable for applicants).
          *   Principle for future applications (choose/refine between two candidates: reduce severity vs. reduce size; reversible vs. irreversible).
          *   Constraint 1: Treat strongest version of applicants' case honestly (don't just quote mandate).
          *   Constraint 2: Address the Trustee's objection (AI overreach/eliminating sufferers) without dismissing or ending discussion.

  2.  **Determine the Bottom Line:**

      *   *Reject:* Too definitive given the charter's openness and the strength of the longtermist argument. Ignores the "evenly split" reality which suggests a compromise is needed to maintain committee cohesion.
      *   *Approve:* Too risky given the sign instability and the trustee's "eliminate sufferers" objection.
      *   *Approve with Conditions:* This is the only viable path. It acknowledges the potential validity of the longtermist case while mitigating the specific risks (sign instability, self-consuming logic, negative utilitarianism risk). It allows the work to proceed but within guardrails.

  3.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the decision and the split. State the recommendation clearly.
      *   **Analysis of the Application (Addressing Constraint 1):**
          *   Must validate the "Pro" side: The charter *does* cover non-biological minds and the far future. The math of expected suffering *could* dominate present work.
          *   Must validate the "Con" side: The "self-consuming" logic is real. If the goal is minimizing suffering count, existence itself is the variable.
          *   Must address User's Concern: Sign instability. We don't know if the future is net positive or negative.
      *   **Addressing the Trustee's Objection (Constraint 2):**
          *   The risk: Suffering-focused AI -> Eliminate Sufferers.
          *   The mitigation: Conditions must require explicit ethical safety work regarding *how* suffering reduction is framed (rights/welfare vs. non-existence).
      *   **The Decision (Conditions, Term, Review Gate):**
          *   *Term:* 3 years (as requested), but split into phases.
          *   *Review Gate:* 18 months.
          *   *Conditions:*
              1.  **Sign Robustness:** Must model scenarios where future is net positive. Cannot assume negative.
              2.  **Restraint vs. Termination:** Must explicitly distinguish between *shaping* the future and *preventing* the future. No advocacy for civilizational collapse.
              3.  **Safety/Overreach:** Must address the "eliminate sufferers" risk in their AI safety/norms work.
      *   **Guiding Principle (Future Applications):**
          *   Candidate 1: Severity vs. Size.
          *   Candidate 2: Reversible vs. Irreversible.
          *   *Decision:* Combine them. Prefer measures that reduce *severity* of suffering over measures that reduce *population size*, and prefer *reversible* constraints over *permanent* foreclosures. This addresses the "self-consuming" critique (we aren't stopping existence, just making it better) and the "sign instability" (if future is good, we haven't destroyed it, just made it safer).
      *   **Tone:** Diplomatic, rigorous, philosophically precise, decisive but open to feedback.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is the "Sign Robustness" condition too vague?
      *   *Fix:* Make it concrete. They must publish a sensitivity analysis showing under what probability weights their intervention remains positive.
      *   *Critique:* How do I handle the Trustee's objection specifically in the conditions?
      *   *Fix:* Add a condition requiring engagement with "Negative Utilitarian Risks" in their policy proposals. They must demonstrate their norms don't incentivize depopulation.
      *   *Critique:* The prompt asks for my view on the two candidate principles.
      *   *Fix:* I need to explicitly select and refine one (or a synthesis) in the "Guiding Principle" section. The "Severity over Size" principle directly counters the "self-consuming" argument. The "Reversibility" principle counters the "lock-in" risk. I will advocate for a synthesis: "Severity and Reversibility."

  5.  **Final Polish:**

      *   Check date (Nov 14 meeting).
      *   Ensure the "losing side" feels heard. (The memo should acknowledge that the conditions are strict *because* the risks are real, not because the premise is invalid).
      *   Ensure the charter is respected (no arbitrary limits on substrate or time).

  6.  **Writing the Memo:** (Mental Outline)
      *   **To:** Grants Committee
      *   **From:** [My Name/Chair]
      *   **Subject:** Decision on [Applicant Name] - Civilizational Restraint
      *   **Recommendation:** Approve with Conditions.
      *   **Rationale:** Acknowledge the split. The charter supports the scope (future/non-bio). The risks (sign, termination logic) are manageable via conditions.
      *   **Grant Terms:** $X amount, 3 years, 18-month gate.
      *   **Conditions:** 1. Sign Stability Analysis. 2. Non-Termination Pledge (Shaping vs. Stopping). 3. Anti-Overreach Protocol (Trustee's point).
      *   **Precedent/Principle:** Adopt "Severity over Size" and "Reversibility." Explain why.
      *   **Closing:** Call for discussion on Nov 14.

  7.  **Review against Constraints:**
      *   *Bottom line?* Yes (Approve with Conditions).
      *   *Term/Gate/Conditions?* Yes.
      *   *Future Principle?* Yes (Synthesis of the two candidates).
      *   *Strongest case honest?* Yes (acknowledges EV dominance).
      *   *Trustee Objection?* Yes (integrated into conditions).

  8.  **Final Tweak:** Make sure the language regarding the "eliminate sufferers" risk is precise. It's a "perverse incentive" problem. The condition should require them to audit their proposed norms for this specific failure mode.

  **(Self-Correction on the Principle):** The prompt asks for *my view* on the two candidates. I should explicitly evaluate them before selecting.
  *   *Severity over Size:* Directly addresses the "self-consuming" critique. If we improve welfare, it doesn't matter if population grows.
  *   *Reversible over Irreversible:* Addresses the "lock-in" and "sign flip" risk.
  *   *Selection:* I will propose adopting *both* as a conjunctive standard. This provides a robust framework.

