  # Taxonomy of Moral Obligations in Voting

  **Root Claim:** Voting can be morally required even when it is causally inefficacious.

  ### Branching Structure

  **Split 1: Expressive Value**
  *Does casting a ballot retain moral value as an expression of civic membership even if every available candidate violates core moral principles?*
  *   **(Yes)** → Proceed to Split 2A
  *   **(No)** → Proceed to Split 2B

  **Split 2: Lesser Evil vs. Complicity**
  *Is casting a ballot for a flawed but relatively better candidate permissible as a "lesser evil," rather than impermissible structural complicity?*
  *   **(Yes: Permissible)** → Proceed to Split 3
  *   **(No: Complicity)** → Proceed to Split 3

  **Split 3: Epistemic Duty**
  *Do voters bear an epistemic duty to research candidates adequately, such that uninformed voting is worse than abstaining?*
  *   **(Yes: Duty Exists)** → Proceed to Split 4
  *   **(No: No Duty)** → Proceed to Split 4

  **Split 4: Delegability Anxiety**
  *Is the moral culpability a voter incurs for government harms diluted by institutional designs where post-election coalition bargaining obscures direct accountability?*
  *   **(Yes: Diluted)** → **Leaf**
  *   **(No: Not Diluted)** → **Leaf**

  ---

  ### Leaf Classifications

  **Path 1 (Yes → Permissible → Duty → Diluted)**
  *   **Position:** Civic-Republican Duty (Institutionalist Variant)
  *   **Diagnosis:** Voting is a duty of membership; culpability is mitigated by systemic complexity.

  **Path 2 (Yes → Permissible → Duty → Not Diluted)**
  *   **Position:** Civic-Republican Duty (Standard)
  *   **Diagnosis:** Voting is a duty of membership; voters retain full culpability for outcomes regardless of system.

  **Path 3 (Yes → Permissible → No Duty → Diluted)**
  *   **Position:** Expressive Democratic Participation (Weak Epistemic)
  *   **Diagnosis:** The act of participation matters most; ignorance is permissible, culpability diluted by system.

  **Path 4 (Yes → Permissible → No Duty → Not Diluted)**
  *   **Position:** Expressive Democratic Participation (Strong Accountability)
  *   **Diagnosis:** The act of participation matters most; ignorance is permissible, but voters bear full blame for harms.

  **Path 5 (Yes → Complicity → Duty → Diluted)**
  *   **Position:** Complicity-Sensitive Abstentionism (Institutionalist)
  *   **Diagnosis:** Voting for flawed candidates is complicity; duty to research applies to the decision to abstain; culpability diluted.

  **Path 6 (Yes → Complicity → Duty → Not Diluted)**
  *   **Position:** Complicity-Sensitive Abstentionism (Standard)
  *   **Diagnosis:** Voting for flawed candidates is complicity; duty to research applies to the decision to abstain; full culpability for any participation.

  **Path 7 (Yes → Complicity → No Duty → Diluted)**
  *   **Position:** Unnamed (Unattractive)
  *   **Diagnosis:** Claims voting is complicity yet denies duty to understand the candidates causing complicity; logically unstable.

  **Path 8 (Yes → Complicity → No Duty → Not Diluted)**
  *   **Position:** Unnamed (Unattractive)
  *   **Diagnosis:** Claims voting is complicity yet denies duty to understand the candidates; maximizes blame while minimizing epistemic care.

  **Path 9 (No → Permissible → Duty → Diluted)**
  *   **Position:** Unnamed (Incoherent)
  *   **Diagnosis:** Denies expressive value in flawed contexts yet permits voting for flawed candidates without instrumental efficacy; motivation unclear.

  **Path 10 (No → Permissible → Duty → Not Diluted)**
  *   **Position:** Unnamed (Incoherent)
  *   **Diagnosis:** Denies expressive value in flawed contexts yet permits voting for flawed candidates without instrumental efficacy; motivation unclear.

  **Path 11 (No → Permissible → No Duty → Diluted)**
  *   **Position:** Unnamed (Incoherent)
  *   **Diagnosis:** Denies expressive value and epistemic duty while permitting voting; reduces voting to arbitrary ritual.

  **Path 12 (No → Permissible → No Duty → Not Diluted)**
  *   **Position:** Unnamed (Incoherent)
  *   **Diagnosis:** Denies expressive value and epistemic duty while permitting voting; reduces voting to arbitrary ritual.

  **Path 13 (No → Complicity → Duty → Diluted)**
  *   **Position:** Strict Abstentionism (Epistemic)
  *   **Diagnosis:** **FLAGGED:** Delegability split does not cleanly separate this position; abstention nullifies voter culpability regardless of system.

  **Path 14 (No → Complicity → Duty → Not Diluted)**
  *   **Position:** Strict Abstentionism (Epistemic)
  *   **Diagnosis:** **FLAGGED:** Delegability split does not cleanly separate this position; abstention nullifies voter culpability regardless of system.

  **Path 15 (No → Complicity → No Duty → Diluted)**
  *   **Position:** Strict Abstentionism (General)
  *   **Diagnosis:** **FLAGGED:** Delegability split does not cleanly separate this position; abstention nullifies voter culpability regardless of system.

  **Path 16 (No → Complicity → No Duty → Not Diluted)**
  *   **Position:** Strict Abstentionism (General)
  *   **Diagnosis:** **FLAGGED:** Delegability split does not cleanly separate this position; abstention nullifies voter culpability regardless of system.

  ---

  **Separation Note:** Paths 13–16 are flagged because the "Delegability Anxiety" split fails to generate distinct moral obligations for agents who conclude voting is impermissible complicity; if one does not vote, the dilution of culpability via institutional design is moot.

  Summary: 16 leaves; most controversial split is Split 2 (Lesser Evil vs. Complicity).
