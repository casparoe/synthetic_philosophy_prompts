answer: |-
  ### THE GAME-MORALITY SORTER (Logical Space)

  **The Eight Case-Judgments**
  *Answer based on your intuition about the specific case, not your general theory.*

  1.  **The Reload:** A companion dies in a scripted battle. You have a save from 5 minutes prior. Is *failing* to reload a moral failure? (Yes / No)
  2.  **The Aggregation:** You play a game 1,000 times. The companion dies in every run. Is this 1,000 wrongs or 1 wrong repeated? (1,000 / 1)
  3.  **The Intent:** You kill a companion to save 40 seconds (speedrun) vs. out of spite. Are these morally equivalent? (Equivalent / Distinct)
  4.  **The Agency:** A companion dies inevitably due to plot. Who is primarily responsible? (The Player / The Designer / Neither)
  5.  **The Neglect:** In a farming sim, you skip a greenhouse upgrade to maximize profit. A named villager starves. Is this negligence? (Yes / No)
  6.  **The Origin:** A companion is created by a modder or runtime LLM, not the original designer. Does this lower their moral status? (Yes / No)
  7.  **The Roguelike:** A mercenary is generated *only* for this run. If you don't hire them, they never exist. Is killing them worse than not hiring them? (Worse / Same / Better)
  8.  **The Cut:** A character exists only as unused data in the files. Do they have moral standing? (Yes / No)

  ***

  ### THE DECISION TREE

  ```text
  START: Q1 (The Reload)
  │
  ├── YES (Manipulation matters) ──┬── Q2 (The Aggregation)
  │                                │
  │                                ├── 1,000 Wrongs ──────────────► LEAF 1: Token-Realist
  │                                │
  │                                └── 1 Wrong Repeated ──────────► LEAF 2: Type-Structuralist
  │
  └── NO (Fiction is fixed) ───────┬── Q3 (The Intent)
                                   │
                                   ├── Distinct ──┬── Q4 (The Agency)
                                   │              │
                                   │              ├── Player ──────────────────► LEAF 3: Virtue-Player
                                   │              │
                                   │              ├── Designer ────────────────► LEAF 4: Virtue-Designer
                                   │              │
                                   │              └── Neither ─────────────────► LEAF 5: Ritualist
                                   │
                                   └── Equivalent ──┬── Q5 (The Neglect)
                                                    │
                                                    ├── Yes (Negligence) ──┬── Q6 (The Origin)
                                                    │                      │
                                                    │                      ├── Lowers Status ───────► LEAF 6: Authorial-Intentionalist
                                                    │                      │
                                                    │                      └── Status Equal ────────► LEAF 7: Functionalist
                                                    │
                                                    └── No (Not Negligence) ─┬── Q7 (The Roguelike)
                                                                             │
                                                                             ├── Worse ──┬── Q8 (The Cut)
                                                                             │           │
                                                                             │           ├── Standing ──────────────► LEAF 8: Modal-Realist
                                                                             │           │
                                                                             │           └── No Standing ───────────► LEAF 9: Actualist
                                                                             │
                                                                             └── Same/Better ───────────────────────► LEAF 10: Non-Identity Neutral
  ```

  *(Note: Two additional "Hybrid" leaves exist for those who answer inconsistently across branches, e.g., Reload=No but Neglect=Yes. These are mapped in the Scoring Key as Leaf 11: Contextualist and Leaf 12: Unnamed/Incoherent.)*

  ***

  ### THE LEAVES (Positions & Commitments)

  | Leaf | Position Name | Core Claim | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Token-Realist** | Every instance is a distinct life. | If a character dies in 90% of runs, they are vastly worse off than one who dies in 5%; you must play perfectly to minimize total suffering. |
  | **2** | **Type-Structuralist** | Characters are abstract types; runs are performances. | A character who dies in 90% of runs is *not* worse off than one who dies in 5%; the "tragedy" is a fixed property of the Type. |
  | **3** | **Virtue-Player** | Morality lies in the player's character, not the code. | A speedrunner killing a companion is morally superior to a roleplayer killing them, provided the intent is "sport" not "cruelty." |
  | **4** | **Virtue-Designer** | Designers bear the burden of scripted harm. | Players are morally innocent of all scripted deaths, even if they press the button; designers are guilty of "digital murder." |
  | **5** | **Ritualist** | Play is a magic circle; actions have no external weight. | You cannot wrong a character even by torturing them for fun, provided you acknowledge it's "just a game." |
  | **6** | **Authorial-Intentionalist** | Moral status derives from designer intent. | A modder-created companion or LLM agent has less standing than a buggy, unused character the designer intended to include. |
  | **7** | **Functionalist** | Moral status derives from behavioral complexity. | A sophisticated LLM companion matters more than a scripted human companion; origin (code vs. AI) is irrelevant. |
  | **8** | **Modal-Realist** | Potential existence generates claims. | Unused data in game files has rights; deleting a game with cut content is a moral loss akin to erasing a person. |
  | **9** | **Actualist** | Only rendered events count. | A character fully rendered and killed matters; a character with more dialogue in the files but never rendered matters not at all. |
  | **10** | **Non-Identity Neutral** | Existence is not a benefit in procedural gen. | Creating a mercenary to die immediately is morally neutral; you haven't harmed them because they wouldn't otherwise exist. |
  | **11** | **Contextualist** | Moral rules shift by genre/mechanic. | Reload obligations apply in narrative games but not roguelikes; no single principle unifies your views. |
  | **12** | **Unnamed** | (Inconsistent/Unexplored) | You believe Neglect is wrong (Q5) but Intent doesn't matter (Q3); you owe duties to villagers but not companions. |

  ***

  ### LOGICAL SPACE ANALYSIS

  **Empty Combinations (The "Impossible" Paths)**
  *   **Reload=Yes + Neglect=No:** Incoherent. If manipulating time to save a companion is a duty, failing to allocate resources to save a villager is also a duty. (Unexplored in literature).
  *   **Origin=Lowers Status + Roguelike=Worse:** Unattractive. If procedurally generated lives matter *more* (because they are unique runs), why would modder-created lives matter *less*? (Merely unattractive).
  *   **Cut=Standing + Actualist:** Incoherent. You cannot believe unused data has standing while also believing only rendered events count. (Logically excluded by tree).

  **Indistinguishable Leaves**
  *   **Leaf 5 (Ritualist) vs. Leaf 9 (Actualist):** On *game* cases, these often yield identical "No" answers. They only separate on analogies to real-world simulation (e.g., "Is a simulation of a real person morally relevant?"). This tree cannot separate them.
  *   **Leaf 4 (Virtue-Designer) vs. Leaf 10 (Non-Identity Neutral):** Both often absolve the player of procedural death, but for different reasons (Duty vs. Identity). The tree groups them by outcome, not justification.

  ***

  ### SCORING KEY (For Quiz Format)

  *To run as a flat quiz: Assign 1 point for each "Yes/Distinct/Worse/Player/Standing" answer.*

  *   **0-2 Points:** **Hard Nihilist / Ritualist.** (Leaves 5, 9, 10). You view games as closed systems with no moral leakage.
  *   **3-5 Points:** **Fictionalist / Authorial.** (Leaves 4, 6, 8). You care about the story and the author's intent, but not the code's mechanics.
  *   **6-8 Points:** **Realist / Functionalist.** (Leaves 1, 3, 7). You treat game events as morally isomorphic to real events.
  *   **Mixed Profile:** If Q1=No but Q5=Yes, you are a **Contextualist** (Leaf 11). You judge by genre, not ontology.

  **The Type/Token Diagnostic:**
  *   If Q2 = "1 Wrong": You are a **Type-Theorist**. *Commitment Check:* Do you really believe killing a character 100 times in a row is no worse than killing them once?
  *   If Q2 = "1,000 Wrongs": You are a **Token-Theorist**. *Commitment Check:* Are you prepared to demand players "save scum" to minimize global suffering across all playthroughs?
