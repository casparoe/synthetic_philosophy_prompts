          3.  If you *did* do the accountability thread, your report is weighted *higher* than a clean user's.
          4.  Victims with minor violations in *other* categories still get full reporting rights.
      *   **Questions to Answer:**
          1.  What view of blame and moral standing is baked into this design?
          2.  Does it presuppose hypocrisy strips authority to blame, or is it tracking credibility/legitimacy?
          3.  How does it square with victims keeping rights despite other violations (different standing or exception)?
          4.  Reconstruct the implicit theory.
