  1. Harsanyi's linear aggregation result derives from the affinity of the representation on the mixture space of lotteries, but your risk-weighted value functions are manifestly non-linear in probabilities unless $r$ is the identity. Concede that RWEU violates Independence and thus affinity, argue that common $r$ preserves the linear subspace structure required for the weights, but admit the soft point is that Pareto Indifference alone may not guarantee additive separability of utilities without assuming the social representation form beforehand.

  2. Your Common Risk condition looks suspiciously like an interpersonal comparability assumption regarding risk attitudes smuggled in to bypass the need for utility normalization, which violates the standard ordinalist caution. Concede that it imposes strong structural constraints, argue that objective probability weighting is empirically observable in a way utility levels are not, but admit the soft point is that observing identical choice patterns does not prove identical internal risk attitudes without fixing the utility scale first.

  3. In risk-weighted models, the utility index and risk function are jointly identified only up to a transformation, so claiming $r$ is fixed across persons presupposes you have solved the identification problem without arbitrary normalization. Concede that unique identification requires additional axioms, argue that restricting the domain to objective lotteries provides the necessary anchor, but admit the soft point is that without assuming a specific parametric form for $r$, multiple pairs can rationalize the same choices making Common Risk empirically underdetermined.

  4. By forcing the planner to inherit the individual risk function, you rule out ex post redistributive concerns that might justify a more risk-neutral social evaluation after uncertainties are resolved. Concede that the Inheritance Lemma limits ex ante aggregation, argue this confirms your thesis that risk-pooling must be justified by idiosyncratic risk mechanisms rather than aggregation logic, but admit the soft point is that this leaves the planner without a normative toolkit to address unfair luck outcomes that standard prioritarianism would catch.

  5. You claim the risk function is interpersonally comparable without normalizing utility levels, but if utility scales differ, the same risk function applied to different utility gaps yields different social valuations. Concede that utility scales still matter for weighting, argue that comparability of $r$ reduces the degrees of freedom compared to full VNM comparability, but admit the soft point is that you have not shown how to determine the weights $a_i$ without reintroducing the very normalization conventions you claim to avoid.
