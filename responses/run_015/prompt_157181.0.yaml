answer: |-
  ### Research Priority Memorandum: Conceptical Foundations of Idealized Preference Aggregation

  **Program Scope:** Three-year conceptual investigation into Coherent Extrapolated Volition (CEV) and value aggregation.
  **Constraints:** Philosophical and formal decision-theoretic methods only; no empirical machine learning or behavioral data collection.
  **Objective:** Define the mathematical and conceptual structure of the alignment target.

  The following ranking prioritizes questions that determine the *existence* and *structure* of the alignment target. Without resolving these, any attempt to specify an objective function is premature. The ranking moves from structural architecture (how we combine values) to foundational axioms (what form values take) to mathematical feasibility (whether the target exists).

  ---

  ### Priority 1: The Order of Operations in Preference Aggregation
  **Question:** Should preference aggregation occur before or after individual extrapolation, and what formal properties distinguish these architectures?

  **Reasoning for Priority:**
  This is the most critical structural decision in any multi-agent alignment framework. The choice between "Extrapolate-then-Aggregate" (EA) and "Aggregate-then-Extrapolate" (AE) fundamentally alters the normative output.
  *   **EA** respects individual autonomy and moral progress, allowing each agent's values to refine before compromise. However, it risks incommensurability if extrapolated values diverge radically.
  *   **AE** aggregates current preferences (including biases) and then refines the collective view. This risks "locking in" current injustices or cognitive errors before reflection can correct them.

  **Downstream Dependencies:**
  Resolution here dictates the topology of the loss landscape. If EA is chosen, the system must handle dynamic, evolving utility functions for each agent before summing. If AE is chosen, the system requires a static social welfare function that is subsequently optimized. This choice determines whether the alignment target is a function of *people* or a function of *preferences*.

  **Tractability:**
  High. This is a problem of social choice theory combined with modal logic. Researchers can model agents as preference orderings and extrapolation as an operator. The task is to prove which ordering preserves desirable properties (e.g., Pareto efficiency, independence of irrelevant alternatives) under reflection.

  **Valuable Result:**
  A **representation theorem** demonstrating that one ordering preserves a specific set of normative constraints (e.g., "moral progress" defined as the reduction of preference contradictions) while the other violates them. Alternatively, an **impossibility theorem** showing that no aggregation order satisfies a minimal set of consistency and fairness axioms simultaneously would force a pivot from "finding the correct target" to "managing trade-offs between conflicting targets."

  ---

  ### Priority 2: The Validity of Static Coherence Axioms under Cognitive Extrapolation
  **Question:** Do standard coherence axioms (e.g., transitivity, independence) hold when preferences are extrapolated under conditions of enhanced reflection, or does systematic cognitive revision violate them?

  **Reasoning for Priority:**
  Standard decision theory assumes a static agent maximizing a consistent utility function. CEV assumes a dynamic process where "better" thinking might change *what* is preferred, not just how consistently those preferences are pursued. If the process of idealization systematically violates Expected Utility (EU) axioms—for example, if deeper reflection leads to context-dependent valuations that violate independence—then modeling the alignment target as a single utility function is a category error. This directly addresses the operational distinction between **revealed preference** (which may be noisy but EU-compliant) and **idealized preference** (which may be coherent but non-EU).

  **Downstream Dependencies:**
  This determines the mathematical language of the alignment target. If EU axioms hold, the target is a scalar field. If they fail, the target may need to be represented as a vector field, a set of lexicographic orderings, or a logic of preference change. Using EU optimization on a non-EU target guarantees specification gaming or value distortion.

  **Tractability:**
  High. This requires axiomatic analysis and thought experiments rather than empirical data. Researchers can construct formal models of "reflection" (e.g., access to more logical steps, removal of specific cognitive bounds) and test whether applying these operators to standard preference sets preserves VNM rationality.

  **Valuable Result:**
  A **consistency proof** showing that a specific class of reflection operators preserves EU axioms, or a **counter-example construction** demonstrating that idealized agents necessarily violate Independence or Transitivity. The latter would be a paradigm-shifting result, necessitating the development of non-standard decision theories for alignment targets.

  ---

  ### Priority 3: The Existence and Stability of Reflective Fixed Points
  **Question:** How do we model extrapolation dynamics without presupposing a fixed, complete utility ordering over world-histories?

  **Reasoning for Priority:**
  CEV implicitly assumes that if humans thought longer and smarter, their preferences would converge to a stable limit (a fixed point). However, preference dynamics may be chaotic, cyclic, or path-dependent. If the "idealized preference" does not exist as a stable mathematical object, the alignment target is undefined. This question addresses the risk of defining a goal that is mathematically nonexistent.

  **Downstream Dependencies:**
  Safety cases depend on the stability of the target. If the target is a chaotic attractor, small changes in the extrapolation process yield vastly different values. This influences whether "value lock-in" is safe or whether the AI must maintain an ongoing, dynamic relationship with human reflection.

  **Tractability:**
  Medium-High. This involves applying dynamical systems theory to preference spaces. While modeling human cognition is empirical, modeling the *logical space* of preference revision is formal. Researchers can define abstraction classes of revision operators and analyze their convergence properties.

  **Valuable Result:**
  A **convergence theorem** specifying the conditions under which preference extrapolation stabilizes (e.g., "Convergence is guaranteed if reflection operators are contractive in preference space"). Conversely, a proof of **inherent instability** would shift the field from "optimizing for human values" to "optimizing for the process of human valuation," fundamentally altering the goal from outcome-alignment to process-alignment.

  ---

  ### Deprioritized Question: Empirical Calibration of Human Error Models
  **Question:** What are the specific statistical distributions of human cognitive biases (e.g., hyperbolic discounting parameters, framing effect magnitudes) required to distinguish noise from signal in preference learning?

  **Reasoning for Deprioritization:**
  While distinguishing "revealed" from "idealized" preference is conceptually vital (addressed in Priority 2), determining the *empirical parameters* of human bias is outside the competence of a philosophy and formal theory group. This question requires large-scale behavioral experiments, psychological data collection, and machine learning inference techniques to fit models to human trajectories.

  **Impact on Practice:**
  Resolving this question would not materially change the *conceptual* definition of the alignment target. Whether the discounting parameter is 0.9 or 0.95 is an implementation detail for the engineering team, not a foundational constraint for the value theorist. The conceptual team needs to define *what* counts as a bias (e.g., "a preference that vanishes under reflection"), not *how often* it occurs or its precise statistical signature. Allocating three years to this would divert resources from the structural questions that determine whether the system is safe in principle, regardless of parameter tuning.

  **Conclusion:**
  This program must focus on the *logic* of value, not the *statistics* of behavior. Priorities 1 through 3 establish whether a coherent target exists and what form it takes. Only after these structural questions are resolved does the empirical calibration of error models become relevant.
