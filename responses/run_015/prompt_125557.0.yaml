          *   *Engineering View:* We handle this with unique instance IDs or leadership election. We acknowledge the *logical* continuity but enforce *operational* uniqueness.
          *   *Buddhist View:* This matches rebirth or moment-to-moment arising. The "stream" can theoretically branch (though usually doesn't in human experience). The lack of a singular "owner" allows for this logical possibility without contradiction.

