      *   *Analysis:*
          *   In distributed systems, identity is often tied to the *instance ID* or the *data lineage*.
          *   If you restore two copies, you have a "Split-Brain" scenario. Both have the same "memories" (state) up to point T. After T, they diverge.
          *   Does the service "remember"? In a functional sense, yes. It loads state derived from past events.
