          *   (2) Genuine memory requires more than mere causation (needs ownership/identity).
          *   (3) Anatta only offers causation/continuity, no ownership.
          *   (4) Therefore, Anatta implies no genuine memory.
          *   (5) We do remember things (premise).
          *   (6) Therefore, Anatta is false.
