          *   The Fork (Two Copies): This is the "Fission Problem."
          *   *Answer:* Both services "remember" the past state. Neither is the "original" in a metaphysical sense. They are both valid successors.
          *   *Double Standard?* No. If you demand a soul for humans, you'd need to posit a "magic service ID" that persists outside the database for the service. Since we don't do that for services (we accept the WAL is enough), we shouldn't demand it for humans.
          *   *Why the difference feels real:* In engineering, we *enforce* uniqueness (locking, consensus) to prevent bugs. In humans, we *assume* uniqueness because fission doesn't happen biologically.
