  3. This attitude most closely mimics Nietzsche's antiquarian mode through its reverence for artifacts, yet it fundamentally violates that mode's requirement to love the past unconditionally and without selection.
  4. It also employs the critical mode's judgment without seeking liberation, and unlike the monumental mode, it uses the past to shame rather than to inspire imitation.
