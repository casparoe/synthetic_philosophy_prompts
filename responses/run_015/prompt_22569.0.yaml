      *   **Deflationism (Disquotationalism):** The core claim is that the truth predicate is a logical device, not a substantive property. $Tr(\ulcorner P \urcorner) \leftrightarrow P$.
      *   **The Liar Paradox:** $L \leftrightarrow \neg Tr(\ulcorner L \urcorner)$. If we apply the disquotation schema naively, we get $L \leftrightarrow \neg L$, a contradiction.
      *   **Tarski's Hierarchy:** To avoid contradiction, Tarski distinguished object language ($L_0$) from meta-language ($L_1$). $Tr_1$ applies to sentences in $L_0$. A sentence cannot contain its own truth predicate.
