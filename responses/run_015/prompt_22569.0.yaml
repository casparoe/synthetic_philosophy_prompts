  3.  **Evaluate the User's Hypothesis:**
      *   *Is the Liar a type error for deflationists?* Many deflationists (like Quine or early Horwich) do indeed restrict the schema to avoid paradox. This often looks like Tarski's hierarchy.
      *   *Is it just Tarski minus metaphysics?* This is a strong insight. Tarski was concerned with defining truth for formal languages to avoid inconsistency. Deflationists are concerned with the *function* of the word "true." However, to save consistency, deflationists often *adopt* Tarskian constraints.
