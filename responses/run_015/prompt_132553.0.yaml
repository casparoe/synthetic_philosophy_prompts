  **TO:** Human Subjects Subcommittee
  **FROM:** [Your Name], Undergraduate Student Member
  **DATE:** October 24, 2023
  **RE:** Decision Memo: Protocol #2023-SLEEP-04 (Consciousness Classification)

  **DECISION:** Approve with Conditions
  **TIMELINE:** Final vote scheduled for next Thursday's meeting.

  **RATIONALE**

  This protocol proposes a high-burden sleep study aiming to train an EEG classifier to detect conscious states. The design hinges on using waking verbal reports as ground truth for sleep experience. This approach intersects with an active philosophical dispute regarding the ontology of dreaming (specifically, the Malcolmian view that dream reports constitute the criterion for dreaming versus the Dennettian view that dreams are empirical events independent of report). The Subcommittee's remit includes scientific validity; we cannot approve studies that impose significant participant burden without a plausible methodological pathway to answer the research question. However, we are not tasked with settling metaphysical debates. Our review focuses on whether the design robustly handles the uncertainty inherent in these measures.

  **The PI's Position**
  The PI argues that requiring metaphysical certainty before data collection is a category error. In sleep science, waking reports are the standard operational datum. To demand an unmediated access to another's consciousness is to demand the impossible. The study treats reports as empirical data points, not philosophical proofs. If the classifier predicts reports successfully, it has achieved its empirical goal regardless of whether "experience" existed prior to the report. This is a strong formulation: science often proceeds by operationalizing contested concepts (e.g., "intelligence" or "pain") without resolving their ultimate nature.

  **Conditions for Approval**
  To ensure validity and informed consent without presupposing a resolution to the consciousness debate, the following modifications are required:

  1.  **Consent and Recruitment Wording:** The current flier states we will "record what you experience while you sleep." This presupposes experience exists during sleep, which is precisely the variable in question. This must be changed to "query what you may have experienced" or "record your reports upon waking." This ensures participants are not misled about the certainty of the phenomenon being studied.
  2.  **Independent Signal Measure:** The PI's colleagues have suggested training participants to produce a pre-agreed signal (e.g., specific eye movements) during lucid REM. We require the inclusion of this measure where feasible. This provides a data point not mediated by waking memory, strengthening the classifier's validity regardless of the philosophical status of the verbal report.
  3.  **Coding Asymmetry:** The protocol currently codes empty N3 reports as "no experience" but empty REM reports as "forgotten dream." This introduces a theoretical bias into the training data. All empty reports must be coded neutrally (e.g., "no report") unless independent evidence suggests forgetting. The analysis must account for this asymmetry rather than baking it into the labels.
  4.  **Abstract Terminology:** The phrase "determining when a sleeping person is conscious" implies a metaphysical conclusion the study cannot support. This should be revised to "classifying EEG patterns associated with waking reports of experience."

  **Philosophical Neutrality and Condition Justification**
  It is vital to distinguish where this memo relies on methodological rigor versus contested philosophy. Most sleep researchers grant that waking reports are fallible memories; requiring conditions (2) and (3) above aligns with standard methodological caution regarding memory and bias. These conditions are justified even if the PI is entirely right about dreams (i.e., even if Dennett's empirical realism holds). Improving signal independence and reducing labeling bias strengthens the science regardless of the metaphysics.

  However, Condition (1) and (4) lean on the uncertainty of the Malcolm/Dennett dispute. If the Malcolmian view were settled truth—that talk of sleep experience is conceptually suspect—then the study's framing would be incoherent. We are not ruling that way. We are ruling that consent must reflect the *contested* nature of the claim. We are not blocking the study based on Malcolm; we are ensuring the consent form does not assert Dennett's view as fact.

  **Conclusion**
  These conditions allow the research to proceed while respecting the limits of our current knowledge. They protect participants from misleading claims and ensure the data produced is robust enough to be valuable even if the philosophical landscape shifts.

  ***

  **[Analyst Note to User]**
  Per your request, here is the breakdown of philosophical dependence:
  *   **Independent of Philosophy (Valid even if PI is right):** Conditions 2 (Independent Signal) and 3 (Coding Asymmetry). These address memory fallibility and confirmation bias, which are empirical problems regardless of whether dreams exist independently of reports.
  *   **Dependent on Philosophical Contention:** Conditions 1 (Consent Wording) and 4 (Abstract Terminology). These specifically mitigate the risk of presenting a contested metaphysical claim (that sleep experience definitely occurs) as established fact to participants. If the PI's view were uncontested standard science, these changes would be less critical.
