answer: |-
  The file folder was the color of dried manila grass, thick with the history of a life measured in signatures. Ada Sorensen sat in the visitor's lounge of the Silver Creek Residence, the air conditioning humming a low, sterile note against the afternoon heat. She opened the folder. The top page was the State Advance Directive, signed twelve years prior by Maren Kask. Below the printed boxes, in a cramped, jagged hand using blue ink, was the addendum.

  *If I am content, do not count it as consent. Contentment is the pleasure of a person who has forgotten what she was for.*

  Ada read the sentence three times. It was a lock picked from the inside. Most directives begged for mercy; this one barred the door against it. Maren Kask had been a composer then, at the height of her orchestral period. She had valued intensity over comfort, structure over ease. She had anticipated the erosion and tried to legislate against the peace that might follow it.

  Ada closed the folder. She was a continuity reviewer. Her job was to look at the person in the room and decide if they were the same person who signed the paper, or if the paper had become a ghost haunting a stranger. The Two-Lives Rule was clean on the page: if the later condition was a thinning, the directive held. If it was a new life, a rebuilding around unforeseen concerns, the directive lapsed. But the rule did not say how to weigh a song against a signature.

  Ada stood up and adjusted her blazer. She had her own file at home, in a cabinet next to the tax records. Signed twenty-two years ago, during a winter when the curtains stayed drawn. She hadn't revised it. Sometimes, when she filled out the forms for others, she wondered if the woman who signed that paper had the right to command the woman who now drank coffee and watched birds in the garden. She pushed the thought away. It was not her case.

  Maren's room smelled of lavender and antiseptic. She was sitting by the window, wearing a cardigan that had seen better decades. Her daughter, Elena, sat on the edge of the bed, holding a glass of water. Elena looked up when Ada entered. She didn't smile, but she nodded. She was a woman caught between a mother she knew and a mother she was losing, trying to honor the ghost without killing the body.

  "She's having a good hour," Elena said softly.

  Maren was humming. It wasn't a tune Ada recognized from the radio. It was a sequence of four notes, rising and falling, repeated with a rhythmic tapping of her index finger against her thigh. Tap. Tap-tap. Tap.

  "Ms. Kask?" Ada said.

  Maren looked up. Her eyes were clouded, not with fear, but with a mild, distracted curiosity. "Yes. Are you the music?"

  "I'm Ada. I'm here to talk about your health."

  "The health," Maren repeated. She coughed, a wet, rattling sound that tightened Elena's grip on the water glass. The chart on the wall noted a urinary tract infection, spreading to the kidneys. Fever of 101. Without antibiotics, it would be fatal. With them, she would likely return to this room, this chair, this humming.

  "Do you know why you're here?" Ada asked.

  "Maren is here," she said. She pointed to her chest. "The songs are here."

  "Do you remember signing a paper? About doctors?"

  Maren frowned. The expression rippled across her face and vanished. "I write papers. Music papers. Lines." She reached for a notebook on her bedside table. It was a spiral-bound thing, cheap paper. She opened it to a page covered in staff lines drawn by hand.

  Ada leaned in. There, in the center of the page, was a melody. It was simple, childlike in its structure. But Ada knew the archives. She had studied Maren's *Symphony in Grey* from twelve years ago as part of the preliminary review. The four notes Maren was tapping, the four notes written on the cheap paper, were the opening motif of the *Symphony*. Maren had built her earlier life on that figure, complex variations, heavy harmonies. Now, she had stripped it back to its bone. She didn't remember the symphony. She didn't remember the labor. She just had the seed, and she was planting it over and over.

  "It's a good song," Ada said.

  "It's new," Maren said, pride bright in her voice. "I made it today."

  This was the crux. The earlier self would call this a fragment, a ruin. The later self called it a creation. The directive said contentment was not consent. Maren looked content. She looked whole within the boundaries of her room. She was not agitated. She was not suffering, except for the infection burning in her blood.

  "Does it make you happy?" Ada asked.

  "It fits," Maren said. She tapped the rhythm again. "It fits here." She touched her head.

  Ada stepped back. She needed air. She walked out to the corridor, away from the lavender smell. She leaned against the wall. The Two-Lives Rule required her to find a "self-consistent set of concerns." Maren had concerns. She had the choir practice on Tuesdays. She had the notebook. She had the desire to fit the notes together. Was this a life rebuilt? Or was it just the echo of a life ending?

  If Ada marked "Decline," the antibiotics were withheld. Maren would die within the week. The earlier self's wish would be honored. The integrity of the composer who feared forgetting would be preserved. But the woman in the room, who found joy in the four notes, would be extinguished.

  If Ada marked "Second Life," Maren would be treated. She would live. She might sing in the choir for another year. She might write more simple songs. But she would be living in violation of her own explicit command. She had said this specific happiness was not valid. She had said this state was not her.

  Ada thought of her own file at home. The woman who signed it wanted to die if she became too heavy to carry. The woman she was now carried heavy things easily. She carried groceries, she carried grievances, she carried the weight of other people's endings. If she had signed the paper today, would she write the same words? No. But did the past woman deserve to be silenced because the present woman was stronger?

  She went back into the room. Elena was wiping Maren's forehead with a cool cloth. Maren had stopped humming. She was watching a moth beat against the window screen.

  "Ada," Elena said. "She gets tired."

  "I know," Ada said. She looked at Maren. "Maren, if you got sick, would you want medicine?"

  Maren looked at the moth. "The moth wants out."

  "Would you want to stay?"

  "I am here," Maren said. She turned back to the notebook. She picked up a pencil. She drew another measure. The line was shaky, but the interval was perfect. A perfect fifth. The same as the *Symphony*. The same as the new song.

  It was the same life, broken. Or it was a new life, built from the shards. Ada could not tell. The rule demanded a distinction that nature did not provide. The earlier self claimed authority through memory and intent. The later self claimed authority through presence and breath.

  Ada returned to the lounge. The sun had moved across the floor. The manila folder lay open. The form waited. Box A: *Continuity of Identity Maintained (Directive Binding).* Box B: *Second Life Established (Directive Lapsed).*

  She picked up her pen. It was a standard issue ballpoint, black ink. She looked at the handwritten clause. *Contentment is not consent.* Maren had been so sure. She had known that forgetting could feel like healing. She had warned them.

  But the notebook lay on the desk now, where Ada had placed it. The pencil mark was fresh. The song existed. It was not a memory. It was a current act. To ignore it was to say the act was nothing. To honor it was to say the warning was nothing.

  Ada thought of the fever. She thought of the cough. She thought of the silence that would follow if she checked Box A. She thought of the violation that would follow if she checked Box B.

  She placed the tip of the pen on the paper. The ink bloomed slightly, a small dark star before she moved it. She looked at the clause again. The blue ink was fading. The paper was yellowing. The woman who wrote it was gone. The woman who sang the four notes was in the next room, waiting for the moth to leave the screen.

  Ada moved her hand. She hovered over Box A. The pen trembled, just once. She shifted her wrist. The shadow of her hand covered the words *Directive Binding*. She took a breath, holding it in her chest, feeling the weight of the air, the weight of the choice, the weight of the two lives pressing against the single point of the pen.

  She lowered the hand.
