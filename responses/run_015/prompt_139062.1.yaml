          *   Directive binds if later condition is a decline (thinning/erosion).
          *   Directive lapses if patient enters a "second life" (new, self-consistent concerns/attachments, unforeseen by earlier self, recognizably whole life rebuilt).
      *   **Characters:**
          *   **Maren Kask (71):** Former composer. Signed directive 12 years ago refusing treatment for dementia. Added a clause: future contentment ≠ wish to live (sees it as forgetting what she was for). Now has early-stage Alzheimer's, lives in memory care, sings in choir, makes simple songs based on a forgotten four-note figure from her past. Has a treatable infection.
          *   **Ada Sorensen (54):** Continuity Reviewer. Interviews patients, reads documents, writes findings (rarely overruled). Signed her own directive 22 years ago during severe depression (views that time as a "foreign country").
      *   **Word Count:** 1,200 to 1,800 words.
      *   **Language:** American English.
      *   **Requirements:**
          1.  Give both claims full strength via objects/actions/habits, not speeches/philosophy. Arguments in words must be partial/awkward.
          2.  Include concrete artifacts (Earlier: Maren's clause/score; Later: Maren's song/recording).
          3.  Register: Literary but plain. No melodrama, no sudden lucidity, no reassurance, no tidy verdict.
          4.  Ending: End in the act of deciding. Reader unsure if earlier self obeyed or betrayed.
          5.  No citations/footnotes/real authors.

  2.  **Deconstruct the Conflict:**
      *   **Earlier Maren:** Values integrity of the artistic self, fears erosion of identity, explicitly rejects "contentment" derived from forgetting as valid consent to live. Wants to die rather than be a shell.
      *   **Later Maren:** Lives a "whole" life within her constraints. Finds joy in simple music. Unaware of the earlier self's specific fears. The music connects them unconsciously (the four-note figure), but consciously she is different.
      *   **Ada:** The mediator. Has her own stake (her own directive from a depressed past). She knows what it feels like to be a different person than the one who signed the paper. She sees the complexity.

  3.  **Plot Outline:**
      *   **Introduction:** Ada arrives at the residence. Establish the atmosphere. Introduce the task (Maren's case).
      *   **The Artifact (Earlier):** Ada reviews Maren's directive. Focus on the handwritten clause. The weight of the past self's voice.
      *   **The Encounter:** Ada meets Maren. Observe her behavior, the choir practice, the infection (coughing, fever).
      *   **The Artifact (Later):** Maren shows Ada her new composition. The four-note figure. The joy in it.
      *   **The Internal Conflict:** Ada reflects on her own directive. The tension between the rule's logic and the human reality.
      *   **The Decision:** Ada sits to write the finding. The pen hovers. The ambiguity remains.

  4.  **Drafting - Section by Section:**

      *   *Setting the Scene:* The memory-care residence. Sunlight, dust, the sound of humming. Ada's routine.
      *   *The File:* Ada reads the directive. The specific clause about contentment. This is crucial. It anticipates the exact situation (happy dementia) and rejects it.
      *   *The Meeting:* Ada watches Maren. Maren isn't confused in a chaotic way; she's focused on the choir. She has an infection (pneumonia/UTI context). Treatable with antibiotics.
      *   *The Music:* Maren shares her "new" song. Ada recognizes the motif from Maren's old work (which Ada likely studied as part of the review). This connects the two lives but also highlights the reduction.
      *   *Ada's Reflection:* Ada thinks of her own directive signed during depression. Would she want her current self to be bound by that depressed self? Or does the depressed self have a claim on safety? This mirrors Maren's case.
      *   *The Climax/Ending:* Ada at her desk. The form. "Decline" vs. "Second Life." The pen touches the paper. Stop there.

  5.  **Refining the "Show, Don't Tell" Requirement:**
      *   Instead of Ada thinking "The Two-Lives Rule is hard," show her rubbing her temples, looking at the clock, the weight of the pen.
      *   Instead of Maren saying "I am happy," show her humming, tapping her foot, the light in her eyes when singing.
      *   Instead of the daughter arguing, show her holding the old score, looking tired, wanting to respect her mother's wishes but hating the outcome.
      *   Ensure the argument isn't philosophical exposition. Keep it grounded in the paperwork and the room.

  6.  **Writing - Focus on Tone:**
      *   Plain, literary. Avoid overly flowery language but maintain precision.
      *   American English spelling/idioms.
      *   Check word count continuously.

  7.  **Drafting - Specific Details:**
      *   *Artifact 1:* The directive with the handwritten addendum in blue ink. "Contentment is not consent."
      *   *Artifact 2:* The napkin with the four-note staff. Or a recording on a cheap device. Let's go with a notebook with staff lines.
      *   *Ada's Stake:* Her own file in the cabinet at home. Signed in 2002.
      *   *The Infection:* A cough during the interview. A chart showing fever.

  8.  **Revision Plan:**
      *   Check word count. (Aim for ~1500).
      *   Ensure the ending is ambiguous.
      *   Make sure the "Two-Lives Rule" mechanics are clear through context, not info-dump.
      *   Verify no one is villainized (daughter wants best for mom, panel is fair, Ada is professional).

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Ada talks to the daughter. *Correction:* Keep it focused on Ada and Maren to maintain intimacy and the internal conflict. The daughter can be present but silent or peripheral.
      *   *Initial thought:* Explain the rule clearly at the start. *Correction:* Weave it into Ada's thought process as she reviews the file.
      *   *Check:* Did I include the four-note figure connection? Yes, Ada needs to recognize it from the old score she reviewed.
      *   *Check:* Is the ending decisive enough to be a climax but ambiguous enough to meet requirement 4? Yes, end on the mark being made or the breath before it.

  10. **Final Polish:** Check against the "no melodrama" rule. Keep emotions restrained. The tragedy is in the structure, not the acting.

