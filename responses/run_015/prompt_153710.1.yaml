  Subject: Fellowship Proposal regarding Climate Ethics and Future Generations

  Dear Selection Committee,

  I am writing to propose an eight-week research project that tackles a specific gap in climate ethics by combining the Wrong Kind of Reasons problem with the Non-Identity Problem. The precise question I want to investigate is whether appealing to the welfare of future generations counts as the right kind of reason for reducing emissions today, given that those specific people will only exist if we avoid climate catastrophe. Standard discussions of the Wrong Kind of Reasons problem usually focus on belief and evidence, like whether you can believe something because it makes you happy, but I want to shift this to action and existence. My hypothesis is that if the people we claim to be saving are contingent on our action, then appealing to their welfare might be the wrong kind of reason because you cannot give a reason to someone who would not exist to recieve it under the alternative option. This creates a population-ethics twist that existing answers miss because they treat future people as fixed entities rather than contingent ones.

  Standard positions do not settle this because utilitarianism struggles to explain why we owe duties to people who would not exist otherwise, and deontological frameworks often rely on rights holders who are already present. The literature on the Non-Identity Problem shows why it is hard to say we harmed these future people, but it does not address whether the reason for acting is of the wrong kind structurally. Similarly, the Wrong Kind of Reasons literature focuses on pragmatic vs evidential reasons for belief, not existence-contingent reasons for action. Because these two fields rarely overlap, there is no established framework for deciding if saving contingent people is a valid normative reason or a category error. This means a literature review alone would just show me where the gap is without helping me build a bridge across it, which is why my project focuses on argument construction rather than just summary.

  For the actual weekly plan, the first two weeks would be spent mapping the conceptual terrain by writing out short case studies where the existence of the beneficiary depends entirely on the action, isolating the intuition pumps from the technical philosophy. Weeks three and four would involve drafting the core argument that connects the Non-Identity Problem to the Wrong Kind of Reasons framework, specifically trying to formalize why contingency might invalidate the reason type. In weeks five and six I would focus on generating counterarguments, such as the idea that reasons can attach to states of affairs rather than specific persons, and testing my position against those objections. Week seven would be dedicated to refining the strongest version of the argument based on that testing, and week eight would be writing the final paper that presents the findings. This approach beats just reviewing literature because it forces me to produce original philosophical work and test the viability of the idea in real time rather than just reporting what others have said.

  Success for this project would look like a clear mapping of the logical gap between contingent existence and normative reasons, even if I do not fully solve the problem, whereas total failure would be realizing that the distinction I am drawing collapses into existing arguments about impersonal welfare that I had not accounted for. I want to be honest that this is probably too big for two months because solving the Non-Identity Problem is a career-level task for professional philosophers, and linking it to the Wrong Kind of Reasons problem adds another layer of complexity. However, even if I cannot provide a definitive solution, producing a clear analysis of why this specific combination of problems resists standard answers would still be a valuable contribution. I think the risk of not finishing a complete solution is worth taking because the question itself is distinct enough to warrant the investigation, and the process of attempting it will sharpen my ability to handle complex ethical frameworks.

  Thank you for considering this proposal.

  Sincerely,

  [Your Name]
