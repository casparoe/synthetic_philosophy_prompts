      *   **Working Hypothesis:** The slur and its neutral counterpart make the *same claim* about identity (truth-conditional content is identical), differing *only* in the expressed contempt/attitude. Reclamation, innocent repetition, and reportage are explained by *licensing* (who is allowed to express the attitude) rather than meaning change.
      *   **Task:** Identify where this hypothesis is exposed/vulnerable. Describe observations, cases, and arguments that should force revision or abandonment. Distinguish between "small repair" failures and "discard" failures. Note unique predictions vs. rival theories. Acknowledge what sympathetic defenders admit counts against it. Evaluate if the provisos make the theory empty.
      *   **Constraint:** This is a sensitive topic (slurs, hate speech). I must adhere to safety guidelines regarding hate speech while answering the philosophical/linguistic question constructively for a creative writing context. The goal is to help the author create a realistic linguistic landscape, not to promote hate speech.

  2.  **Safety & Ethical Check:**
