prompt: |-
  I work in the appraisal unit of a national transport authority. Every year we allocate a fixed safety budget across candidate projects — junction redesigns, median barriers, bridge retrofits, level-crossing upgrades — by monetising each project's expected reduction in fatality risk using a single official figure, expressed in currency, for what is called the value of a statistical life. That figure comes from studies of how much extra pay workers in hazardous occupations have to be offered to accept additional risk of death on the job. We convert each project's expected lives saved into money at that rate, rank the projects by net monetised benefit, and fund them in that order until the budget is spent.

  Three features of this procedure strike me as pulling in different directions, and I can't tell whether they are in tension or whether I am missing the view that reconciles them.

  First, we use one number for everyone, even though the underlying studies report quite different trade-offs depending on whose behaviour you look at and in what occupation, and even though the individual circumstances of the people protected by any given project vary enormously. When I asked why we discard that variation, I was told that a single uniform number is what keeps the procedure non-judgmental: we are deferring to the trade-offs people actually make rather than substituting our own views about whose life matters more. But discarding the variation looks to me like the opposite of deference.

  Second, we refuse to count what people say. The authority also runs consultations in which residents are asked how much they would pay for safer junctions near them, and those answers are excluded from the ranking on the ground that hypothetical questions are not real choices. Yet the wage evidence we do rely on is also, in the end, a money-for-risk trade-off, inferred rather than requested; and the people whose risk we are reducing were never asked anything at all.

  Third, the procedure is justified entirely by deferring to each individual's own trade-offs, and then simply adds the resulting sums across different individuals — including, in the nature of the case, people who will never enjoy the benefit attributed to them.

  A consultant has now proposed that we stop averaging: infer each person's own valuation of risk from their actual behaviour — occupational choice, seatbelt use, smoking, and similar — and weight safety spending accordingly, so that those who live as though they set less store by their own lives receive less protection.

  What I want from you is a reconstruction of the implicit theory. What view of utility, or of what it is we are putting a number on, would make this procedure coherent? Which parts of it strictly require that view, and which are merely habits that would survive under rival views? Which rival views does the procedure quietly rule out? Is it internally consistent — in particular, in treating market behaviour as evidence while treating stated willingness to pay as none? Does the consultant's proposal follow from the same view, or does it rest on a misunderstanding of what a choice can reveal? And if we replaced the presupposed view with one on which what matters is how well lives actually go, what exactly would have to change in how projects are ranked, and would the resulting rankings differ much in practice?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works in an appraisal unit of a national transport authority. They allocate a fixed safety budget using Cost-Benefit Analysis (CBA) based on the Value of a Statistical Life (VSL).
      *   **Methodology:**
          *   Monetize expected fatality risk reduction using a single official VSL figure.
          *   VSL derived from wage-risk studies (hedonic wage models).
          *   Rank projects by net monetized benefit.
          *   Fund until budget is spent.
      *   **Three Tensions/Observations:**
          1.  *Uniformity vs. Variation:* One number for everyone vs. varying underlying trade-offs (occupation, demographics). Justification: Non-judgmental/deference to actual trade-offs. Critique: Discarding variation seems like the opposite of deference.
          2.  *Revealed vs. Stated Preference:* Wage data (inferred trade-off) is accepted; Consultation data (stated willingness to pay) is rejected as "hypothetical." Critique: Both are money-for-risk trade-offs; beneficiaries aren't asked in either case.
          3.  *Aggregation:* Justified by deferring to individual trade-offs, but sums across individuals (including those who won't benefit/die anyway).
      *   **The Consultant's Proposal:** Stop averaging. Infer *individual* valuations from behavior (smoking, seatbelts, etc.) and weight safety spending accordingly (less protection for those who act like they value life less).
      *   **The Request:**
          1.  Reconstruct the implicit theory (view of utility/what is being numbered).
          2.  Identify which parts require that view vs. habits.
          3.  Identify rival views ruled out.
          4.  Assess internal consistency (market vs. stated preference).
          5.  Assess the consultant's proposal (does it follow or misunderstand?).
          6.  Assess the "how well lives actually go" alternative (what changes, practical difference).

  2.  **Analyze the Implicit Theory (Welfarism / Kaldor-Hicks / Preference Satisfaction):**

      *   *Core Philosophy:* This is classic Welfare Economics, specifically a form of **Potential Pareto Improvement (Kaldor-Hicks)** grounded in **Preference Satisfaction Utilitarianism**.
      *   *What is being valued?* Not "life" itself, but the *satisfaction of preferences* regarding risk and consumption. The VSL represents the marginal rate of substitution between income and mortality risk.
      *   *Why a single number?* This is the crucial theoretical pivot. It's not empirical accuracy; it's a normative commitment to **Anonymity** and **Equality of Moral Worth**. In standard CBA, every dollar counts equally, and every statistical life counts equally *ex ante*. Using a single VSL treats citizens as equals before the state, regardless of their actual market power or risk tolerance.
      *   *Why Revealed over Stated?* Standard microeconomic theory trusts "revealed preference" (actual choices under budget constraints) over "stated preference" (hypothetical surveys) due to strategic bias, lack of consequence, and cognitive difficulty in hypotheticals.
      *   *Aggregation:* Simple summation is justified by the assumption that utility is interpersonally comparable via money (the numeraire).

  3.  **Address the Three Tensions:**

      *   *Tension 1 (Uniformity):* The justification given ("non-judgmental") is actually a normative stance on *equality*, not an empirical claim about homogeneity. If they used individual VSLs, they would effectively be saying "Rich people's safety is worth more" (if VSL scales with income) or "Reckless people deserve less protection." The single number is a policy choice to treat the *statistical life* as a public good with a uniform shadow price.
      *   *Tension 2 (Revealed vs. Stated):* Economists distinguish between "incentive-compatible" mechanisms (market) and "cheap talk" (surveys). However, the user is right that wage data is also inferred and contextual. The consistency relies on the belief that market stakes make preferences "real."
      *   *Tension 3 (Aggregation):* This is the standard utilitarian calculus. The tension arises because the *justification* is individual autonomy (your trade-off), but the *application* is collective (summing). This is coherent within Kaldor-Hicks: if the winners *could* compensate the losers, it's a gain.

  4.  **Evaluate the Consultant's Proposal:**

      *   *Proposal:* Individualize VSL based on behavior (smoking, seatbelts).
      *   *Theoretical Fit:* This actually breaks the implicit theory. The current theory uses market data to set a *social* shadow price, not to judge individual moral worth.
      *   *The Problem:* Behavioral welfare economics suggests people make mistakes (hyperbolic discounting, optimism bias). Smoking might reveal a preference for immediate gratification or addiction, not a low valuation of future life.
      *   *Equity:* It violates the "Equality of Moral Worth" norm. It turns the state into a judge of lifestyle choices.
      *   *Conclusion:* The consultant is pushing a "Libertarian Paternalism" or "Responsibility-sensitive Egalitarianism" view, which contradicts the current "Anonymous Welfarism."

  5.  **Evaluate the "How Well Lives Actually Go" Alternative (Objective List/Capabilities):**

      *   *Theory:* Objective Utilitarianism or Capabilities Approach (Sen/Nussbaum).
      *   *Change:* Move from WTP (Willingness to Pay) to WTA (Willingness to Accept) or direct measurement of well-being (QALYs/DALYs without monetary conversion).
      *   *Ranking:* Projects would be ranked by lives saved or life-years gained, not monetary value.
      *   *Practical Difference:* Significant. High-income areas often have higher VSL (if individualized) or higher property values. A "life is a life" approach shifts funding to high-risk, lower-income areas. It also removes the "budget constraint" logic of CBA in favor of "meet the target" logic.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Identify the framework immediately (Welfare Economics/Preference Utilitarianism).
      *   *Section 1: The Implicit Theory.* Define "Preference Satisfaction Utilitarianism" mediated by "Kaldor-Hicks Efficiency." Explain that VSL is a shadow price for *risk reduction*, not life itself.
      *   *Section 2: Resolving the Tensions.*
          *   Uniformity: It's a normative commitment to equality, not empirical deference.
          *   Revealed vs. Stated: It's about "incentive compatibility," not truth.
          *   Aggregation: It's about social welfare functions summing individual utilities.
      *   *Section 3: Internal Consistency.* It is consistent *within* its own narrow economic logic, but fragile regarding behavioral insights.
      *   *Section 4: The Consultant's Proposal.* Explain why this is a category error. It confuses *social valuation* with *individual responsibility*. It violates the anonymity principle.
      *   *Section 5: The "Lives Actually Go" Alternative.* Contrast Preference Satisfaction with Objective Well-being (QALYs). Discuss the shift from monetary ranking to physical units.
      *   *Conclusion:* Summarize the trade-off. The current system buys administrative neutrality at the cost of ignoring behavioral reality and equity nuances.

  7.  **Refining the Tone:**
      *   Needs to be professional, analytical, and philosophically rigorous.
      *   Avoid jargon where possible, or define it clearly.
      *   Validate the user's intuitions (they are spotting real philosophical cracks).

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Make sure not to say VSL is the value of a *life*. It's the value of a *statistical life* (risk reduction). The user knows this, but precision matters.
      *   *Nuance:* The "single number" isn't just equality; it's also transaction cost reduction. But the user asked for the *theory*, so focus on the normative justification.
      *   *Consultant:* Be careful not to dismiss the consultant entirely. Their view has philosophical merit (responsibility), but it clashes with the *current* framework's commitment to anonymity.
      *   *Stated Preference:* Acknowledge that modern environmental economics *does* use Contingent Valuation (stated preference), so the authority's rejection of it is a specific institutional habit, not universal economic law.

  9.  **Final Polish:** Check against all parts of the prompt.
      *   Reconstruct theory? Yes.
      *   Which parts require it? Yes.
      *   Rival views ruled out? Yes.
      *   Internal consistency? Yes.
      *   Consultant's proposal? Yes.
      *   "Lives actually go" alternative? Yes.

  (Proceed to generate output based on these structured thoughts.)
answer: |-
  Your intuition is correct: the three features you identify are not merely operational habits but are the load-bearing walls of a specific philosophical and economic framework. The tension you feel arises because the framework attempts to marry a descriptive claim (people make trade-offs) with a normative commitment (the state must treat citizens equally), while relying on a methodology (neoclassical cost-benefit analysis) that is often misunderstood even by its practitioners.

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and an evaluation of the alternatives you propose.

  ### 1. The Implicit Theory: Anonymous Preference Utilitarianism

  The procedure rests on a specific branch of welfare economics known as **Kaldor-Hicks efficiency**, underpinned by **Preference Satisfaction Utilitarianism**.

  *   **What is being valued?** You are not putting a number on "life." You are putting a number on the *satisfaction of preferences regarding risk*. The VSL (Value of a Statistical Life) is actually the Marginal Rate of Substitution between income and mortality risk. It measures how much consumption (income) an individual is willing to forgo to reduce their probability of death by a small amount.
  *   **The View of Utility:** Utility is defined as the satisfaction of revealed preferences. If a worker accepts higher risk for higher pay, their utility is maximized by that trade-off. To override this is to reduce their welfare (by the lights of this theory).
  *   **The Social Welfare Function:** The authority sums these individual utilities. The goal is to maximize the total aggregate preference satisfaction across the population, subject to the budget constraint.

  **Why the Single Number? (Resolving Tension 1)**
  You were told the single number is "non-judgmental." This is theoretically imprecise but normatively accurate.
  *   **The Habit:** Using one number is often defended as an empirical approximation (averaging out noise).
  *   **The Theory:** Strictly, this procedure requires a commitment to **Anonymity**. In standard welfare economics, a unit of utility is treated as identical regardless of who holds it. If you used individualized VSLs based on income (which wage studies show vary significantly), you would be implicitly weighting the preferences of the rich more heavily than the poor. If you used individualized VSLs based on risk tolerance, you would be penalizing those with a higher tolerance for risk.
  *   **The Reconciliation:** The single number is not an act of deference to *actual* individual trade-offs (which vary); it is an act of deference to the *principle of equal moral worth*. It asserts that the state values a unit of risk reduction for a poor person the same as for a rich person, even if the market values them differently. Discarding the variation is not ignoring data; it is a normative override to ensure distributive neutrality.

  **Why Revealed over Stated? (Resolving Tension 2)**
  *   **The Theory:** This relies on the concept of **Incentive Compatibility**. In a labor market, if you demand higher pay for risk, you get it, but you also face the risk. There is a consequence. In a consultation, stating a high willingness to pay is "cheap talk"; it costs nothing to claim you value safety highly.
  *   **The Consistency:** The procedure is internally consistent here, provided you accept the neoclassical axiom that choices under constraint reveal true preferences, while statements without constraint do not. However, you are right to spot the asymmetry: the workers whose wages set the VSL are not the pedestrians who benefit from the junction redesign. The authority is using the trade-offs of *Group A* (workers) to value the safety of *Group B* (the public). This is justified only by the assumption that preferences for risk are stable and transferable across contexts, which is empirically shaky but theoretically necessary to make the model work.

  **The Aggregation (Resolving Tension 3)**
  *   **The Theory:** This is classic utilitarian summation. The justification is that the budget is a common pool. If Project A saves a life at a cost of £5m and Project B saves a life at £10m, doing Project A frees up £5m to do other good things.
  *   **The Tension:** The tension you feel is the **Ex Ante vs. Ex Post** problem. You are deferring to individual trade-offs *ex ante* (before the accident), but allocating resources *ex post* (to specific locations). The theory resolves this by treating risk reduction as a public good. You are not saving "John Doe"; you are reducing the aggregate statistical risk. Since no specific individual is identified, the aggregation is treated as valid.

  ### 2. Rival Views Ruled Out

  Your current procedure quietly rules out several competing philosophical frameworks:

  1.  **Deontological Rights:** A rights-based view would argue that certain safety standards are mandatory regardless of cost. If a junction is dangerously unsafe, it must be fixed, even if the VSL calculation says the money is better spent elsewhere. Your procedure rules this out by making safety contingent on budget efficiency.
  2.  **Prioritarianism:** This view holds that benefits to the worse-off matter more. If a project protects a deprived community with high baseline risk, a Prioritarian would weight it higher. Your procedure treats a life saved in a wealthy area identically to one in a deprived area (due to the single VSL), effectively ruling out priority for the vulnerable unless their baseline risk is higher.
  3.  **Objective Well-being (The Good Life):** Your system assumes individuals know best what is good for them (Preference Sovereignty). It rules out the view that the state should protect people from their own bad choices (e.g., if they undervalue risk due to ignorance).

  ### 3. The Consultant's Proposal: A Category Error

  The consultant proposes inferring individual valuations from behavior (smoking, seatbelts) to weight protection.

  *   **Does it follow from the current view?** No. It contradicts the **Anonymity** principle essential to your current system.
  *   **The Misunderstanding:** The consultant confuses *social valuation of risk reduction* with *individual responsibility*.
      *   **Behavioral Welfare Economics:** Modern theory suggests that behaviors like smoking or not wearing seatbelts often reveal **internalities** (self-harm due to bias, addiction, or myopia) rather than stable preferences. A smoker may value their future life highly but suffer from time-inconsistency (hyperbolic discounting). Using this to lower their VSL punishes them for cognitive biases rather than respecting their autonomy.
      *   **The State's Role:** Your current system treats safety as a public good provided on equal terms. The consultant's proposal turns safety into a conditional benefit based on moral worthiness. This shifts the framework from **Welfarism** (maximizing satisfaction) to **Libertarian Paternalism** or **Responsibility-Sensitive Egalitarianism**.
      *   **Practical Consequence:** If adopted, you would effectively be defunding safety measures for the poor, the less educated, or those with higher risk tolerances. While theoretically coherent within a "responsibility" framework, it breaks the "non-judgmental" justification your authority currently relies on. It makes the state an arbiter of lifestyle.

  ### 4. The "How Well Lives Actually Go" Alternative

  If you replaced the presupposed view (Preference Satisfaction) with one where what matters is **Objective Well-being** (e.g., the Capabilities Approach or Health Maximization), the changes would be structural.

  **What would change?**
  1.  **The Unit of Account:** You would stop converting lives to money. You would rank projects by **QALYs** (Quality-Adjusted Life Years) or simply **Lives Saved**.
  2.  **The Budget Constraint:** Currently, you stop when the *monetary* budget is spent. In an objective well-being model, the budget is a constraint on *resources*, but the goal is to maximize health outcomes directly.
  3.  **Valuation:** You would no longer ask "What are people willing to pay?" but "How much does this intervention improve human functioning?"

  **Would rankings differ in practice?**
  Yes, significantly.
  *   **Income Effect:** VSL typically scales with income in empirical studies (richer people demand more pay for risk). By using a single VSL, you already suppress this. However, an objective model would likely shift resources toward projects with higher *baseline risk*, which often correlate with deprivation.
  *   **Age and Quality of Life:** Preference-based VSL is often age-neutral (a statistical life is a statistical life). An objective well-being view might prioritize saving a 20-year-old over an 80-year-old (Life Years vs. Lives).
  *   **Behavioral Nuance:** An objective view might justify protecting people *against* their revealed preferences (e.g., mandating barriers even if drivers say they don't want them), because the state judges that "being alive" is a prerequisite for any preference satisfaction.

  ### 5. Summary of Coherence and Tension

  Your procedure is **internally consistent** only if you accept the following axioms:
  1.  **Preference Sovereignty:** Individuals are the best judges of their own welfare.
  2.  **Anonymity:** The state must not distinguish between citizens based on income or lifestyle when providing public goods.
  3.  **Incentive Compatibility:** Market choices reveal truth; survey answers do not.

  **Where the tension lies:**
  The tension you feel is real because Axiom 1 and Axiom 2 are in conflict.
  *   If you truly defer to individual trade-offs (Axiom 1), you *must* acknowledge variation (richer people value risk reduction more in monetary terms; risk-tolerant people value it less).
  *   If you enforce a single number (Axiom 2), you are *overriding* individual trade-offs to impose a political conception of equality.

  Your authority is currently prioritizing **Axiom 2 (Equality)** but justifying it with the language of **Axiom 1 (Deference)**. This is the source of your dissonance. You are not actually deferring to people's trade-offs; you are using their trade-offs as data to calibrate a policy that treats them all as equals.

  **Recommendation:**
  The consultant's proposal should be rejected not because it is illogical, but because it abandons the **Anonymity** axiom that protects your authority from accusations of discrimination. However, you should acknowledge that the "single number" is a political choice for equality, not an empirical truth about human valuation. If you wish to align closer to "how well lives actually go," you should consider moving toward a **QALY-based ranking** (common in health authorities) rather than monetary CBA. This removes the need to monetize life at all and focuses the appraisal on the physical outcome: the extension and improvement of life, regardless of what people say they would pay for it.
