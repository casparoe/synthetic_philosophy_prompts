answer: |-
  # Desiderata for a Theory of Personal Identity under the Constraint of *Anatta*

  ## Introduction
  In formulating a metaphysics of mind for a cross-cultural seminar, we must treat the Buddhist doctrine of *anatta* (no-self) not merely as a negative thesis (the denial of a substantial *atman*) but as a positive structural constraint. An adequate theory must explain how moral continuity, autobiographical coherence, and soteriological progress function *in the absence* of a diachronically identical subject. The following desiderata specify the phenomena, distinctions, and constraints such a theory must accommodate.

  ---

  ## I. Phenomenological and Soteriological Accommodation
  *The theory must account for specific first-person and ethical phenomena central to Buddhist practice.*

  **1. The Stability of Attention across Ontological Shifts**
  *   **Requirement:** The theory must explain how first-personal attention remains stable enough to pursue liberation, even through meditative states where the sense of "I" is temporarily suspended (e.g., *nirodha-samapatti* or cessation of perception/feeling).
  *   **Motivating Consideration:** Upon emerging from cessation, the meditator reports, "I experienced cessation." If the subject-object structure collapsed completely, what guarantees the continuity of the practitioner who enters and the one who emerges? A theory that eliminates the subject entirely cannot account for the *soteriological agent* who attains Nirvana.
  *   **Status:** **Non-Negotiable (Buddhist).**

  **2. Moral Responsibility without an Enduring Owner**
  *   **Requirement:** The theory must provide a logic of karma where actions bear fruit for a future continuum without requiring a metaphysically identical "owner" of the action and the fruit.
  *   **Motivating Consideration:** The "Free Rider" Objection: If there is no self, why should I not act hedonistically now, letting a future continuum suffer the consequences? The theory must ground *first-personal concern* for future states without positing a *self* that persists to inhabit those states.
  *   **Status:** **Non-Negotiable (Buddhist).**

  **3. Retrospective Coherence after Ego-Dissolution**
  *   **Requirement:** The theory must explain how autobiographical memory is reintegrated after experiences of "non-duality" or ego-dissolution without reifying the ego that was dissolved.
  *   **Motivating Consideration:** Post-meditative narrative reconstruction often reifies the experience ("*I* had a non-dual experience"). An adequate theory must distinguish between the conventional narrative required for communication and the ultimate lack of a subject in the experience itself.
  *   **Status:** **Non-Negotiable (Phenomenological).**

  **4. Trans-Life Continuity (Rebirth)**
  *   **Requirement:** The theory must accommodate the transmission of karmic potential across the discontinuity of biological death.
  *   **Motivating Consideration:** Traditional Buddhism posits that karmic seeds (*vasanas*) migrate to a new basis of existence. A theory bound strictly by brain-bound cognitive science cannot accommodate this without eliminating rebirth, thereby failing the traditional doctrinal constraint.
  *   **Status:** **Non-Negotiable (Traditional Buddhist); Contested (Secular/Modernist).**

  ---

  ## II. Conceptual and Metaphysical Distinctions
  *The theory must preserve specific categorical distinctions to avoid category errors.*

  **5. Causal Continuity vs. Numerical Identity**
  *   **Requirement:** The theory must rigorously distinguish between *causal connectedness* (dependence) and *numerical identity* (sameness of substance).
  *   **Motivating Consideration:** Western personal identity debates (Locke, Parfit) often seek conditions under which Person A *is* Person B. Buddhism requires conditions under which Person A is the *causal antecedent* of Person B, without being *identical* to Person B. Conflating these leads to the error of eternalism (if identical) or nihilism (if unrelated).
  *   **Status:** **Non-Negotiable (Buddhist).** (The demand for Numerical Identity is an **Imported Western Prejudice**).

  **6. The Two-Truths Framework (Conventional vs. Ultimate)**
  *   **Requirement:** The theory must operate on two levels: a conventional level (*samvrti-satya*) where persons, agents, and responsibilities exist, and an ultimate level (*paramartha-satya*) where only impersonal processes exist.
  *   **Motivating Consideration:** To deny the self ultimately is not to deny the person conventionally. A theory that eliminates the person conventionally leads to moral nihilism; a theory that reifies the person ultimately leads to metaphysical error.
  *   **Status:** **Non-Negotiable (Buddhist).**

  **7. Process Ontology vs. Substance Ontology**
  *   **Requirement:** Identity must be modeled as a verb (streaming, conditioning) rather than a noun (entity, substrate).
  *   **Motivating Consideration:** *Anicca* (impermanence) is the ground of *Anatta*. If reality is momentary (*ksanika*), identity can only be a pattern of continuity, not a persistent thing.
  *   **Status:** **Non-Negotiable (Buddhist).**

  ---

  ## III. Empirical and Scientific Constraints
  *The theory cannot flatly contradict established findings, though it may reinterpret them.*

  **8. No Homunculus / No Cartesian Theater**
  *   **Requirement:** The theory cannot posit a central experiencer located in the brain or mind who "views" qualia.
  *   **Motivating Consideration:** Cognitive science (Dennett, Metzinger) and Buddhist phenomenology agree: there is no "center" where it all comes together. Any theory positing a "little man inside" contradicts both modern science and the *Anatta* doctrine.
  *   **Status:** **Non-Negotiable (Convergence).**

  **9. Modular/Fragmented Cognition**
  *   **Requirement:** The theory must accommodate the finding that cognitive functions (memory, agency, affect) are dissociable and can be disrupted independently (e.g., split-brain cases, anosognosia).
  *   **Motivating Consideration:** The unity of consciousness is an illusion or a constructed effect, not a fundamental metaphysical fact. This supports the Buddhist analysis of the *skandhas* (aggregates).
  *   **Status:** **Non-Negotiable (Scientific/Buddhist Convergence).**

  **10. Biological Boundedness (The Conflict Point)**
  *   **Requirement:** The theory must address the dependence of mind on brain.
  *   **Motivating Consideration:** Neuroscience suggests consciousness ceases at brain death. This directly conflicts with Desideratum #4 (Rebirth). A theory cannot satisfy both strict physicalism and traditional rebirth without significant metaphysical expansion (e.g., panpsychism or dual-aspect monism).
  *   **Status:** **Jointly Unsatisfiable (See Section V).**

  ---

  ## IV. Conceptual Puzzles to Dissolve
  *The theory must resolve, not dismiss, the following paradoxes.*

  **11. The Puzzle of Concern (Why Care?)**
  *   **Requirement:** Explain why a momentary consciousness should care about a future momentary consciousness if they are not "the same."
  *   **Motivating Consideration:** Derek Parfit's reductionism suggests this weakens concern. Buddhism requires that concern remains robust (for the sake of ending suffering) despite the lack of identity.
  *   **Status:** **Non-Negotiable (Soteriological).**

  **12. The Agent of Liberation**
  *   **Requirement:** If there is no self, who is liberated? If there is a self, what was the point of the practice?
  *   **Motivating Consideration:** The *Visuddhimagga* states: "There is suffering, but no one who suffers." The theory must explain how the *cessation* of a process counts as a *gain* for anyone.
  *   **Status:** **Non-Negotiable (Buddhist).**

  ---

  ## V. Flagging and Conflict Analysis

  ### Non-Negotiable vs. Imported Prejudices
  *   **Non-Negotiable (Buddhist Framework):** Causal Continuity over Numerical Identity; Two-Truths distinction; Impermanence as foundational; Karma as trans-life moral causality; The possibility of ego-dissolution without loss of function.
  *   **Imported Prejudices (Western Personal Identity Debates):** The demand for *Numerical Identity* as a precondition for moral responsibility; The assumption that "person" refers to a natural kind rather than a conventional designation; The assumption that death constitutes an absolute ontological break (materialist prejudice) or an absolute transition of soul (dualist prejudice).

  ### The Jointly Unsatisfiable Subset
  There is a tension within the desiderata that may render the set jointly unsatisfiable without metaphysical revision:

  **The Conflict:** *Desideratum #4 (Rebirth/Trans-Life Continuity)* vs. *Desideratum #10 (Biological Boundedness/Neuroscience)* vs. *Desideratum #2 (Moral Responsibility without Owner).*

  **Analysis:**
  1.  **Causal Discontinuity vs. Moral Responsibility:** The prompt asks specifically about reconciling causal discontinuity with moral responsibility. Traditional Buddhism denies *causal* discontinuity between lives (Dependent Origination bridges death). However, from the perspective of physicalist science (Desideratum #10), death *is* a causal break.
  2.  **The Unsatisfiable Triad:**
      *   (A) Mind is strictly brain-dependent (Science).
      *   (B) Karma/Responsibility transfers across death (Buddhism).
      *   (C) No substantial self transfers (Anatta).
      *   *Result:* If (A) is true, (B) is impossible without (C) becoming a subtle form of substance (a "soul" disguised as information). If (B) is true, (A) must be rejected or radically reinterpreted (e.g., consciousness is fundamental, not emergent).
  3.  **The "Owner" Paradox:** Even if we accept causal continuity across lives, Desideratum #2 requires moral responsibility without an owner. If the causal link is impersonal (like one billiard ball hitting another), the *normative force* of responsibility ("*I* ought to have done otherwise") dissipates. Reconciling *impersonal causality* with *personal accountability* remains the hardest philosophical hurdle. A theory that solves this satisfies Buddhism; a theory that reduces responsibility to mere causal inevitability fails the soteriological constraint.

  ---

  ## VI. Brief Evaluation of Candidate Accounts

  **1. Reductionist Accounts (e.g., Parfitian/Dennettian)**
  *   **Performance:** High compatibility with Cognitive Science (Desideratum #8, #9) and *Anatta* (Desideratum #5, #7).
  *   **Failure:** Fails Desideratum #2 and #4. Parfit admits that realizing reductionism weakens first-personal concern and moral responsibility. It cannot ground the robust karmic urgency required for Buddhist soteriology, nor does it accommodate rebirth without ad hoc additions.

  **2. Narrative Accounts (e.g., Schechtman/MacIntyre adapted)**
  *   **Performance:** Good accommodation of Autobiographical Coherence (Desideratum #3) and Conventional Self (Desideratum #6).
  *   **Failure:** Risks reifying the self at the ultimate level. If the "story" is what constitutes the person, the story itself becomes a substantial entity. It struggles with Desideratum #1 (states where narrative collapses in meditation) and Desideratum #4 (narratives do not obviously survive brain death).

  **3. Abhidharma-Style Stream-Continuity (Santana)**
  *   **Performance:** Best fit for Non-Negotiable Buddhist Desiderata (#1, #2, #4, #5, #6). It posits a causal stream of momentary dharmas that preserves karmic information without a self.
  *   **Failure:** Tension with Desideratum #10 (Neuroscience). It requires a metaphysics of causation that allows information/energy to transfer without physical continuity (or requires a panpsychist/idealist ontology to align with science). It also struggles with the "Puzzle of Concern" (Desideratum #11)—explaining why one moment in the stream should *care* about the next beyond blind causality.

  **Conclusion for Seminar:**
  An adequate theory must likely adopt an **Abhidharma-style ontology** (to satisfy *anatta* and karma) but must engage in **metaphysical revisionism regarding physicalism** (to satisfy rebirth) or accept a **secularized Buddhism** that drops Desideratum #4. The critical failure point for Western theories is the inability to decouple *moral responsibility* from *numerical identity*.
