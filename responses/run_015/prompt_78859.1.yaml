answer: |-
  **Exam Question**

  Consider the Pasadena game: a fair coin is tossed until heads (toss *n*). Payoff: $(-1)^{n+1} 2^n / n$. The Altadena game is identical but payoff is $2^n / n$.

  (1) Explain why the Pasadena game's expected value is undefined rather than infinite, referencing conditional convergence.
  (2) Why does this pose a deeper problem for expected value maximization than the St. Petersburg paradox?
  (3) Does the fact that Altadena dominates Pasadena resolve the evaluation problem for Pasadena? Why or why not?
  (4) Assess one proposed response to this problem (e.g., bounded utility, restricting prospects, or alternative criteria).

  (25 marks)

  ***

  **Model Answer**

  The Pasadena game presents a fundamental challenge to standard decision theory because its expected value is mathematically undefined, not merely infinite. To calculate the expected value, we sum the probability-weighted payoffs. Since the probability of heads appearing on toss *n* is $1/2^n$, and the payoff is $(-1)^{n+1} 2^n / n$, the *n*-th term of the expectation series simplifies to $(-1)^{n+1} / n$. This generates the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 \dots$.

  This series is conditionally convergent. According to the Riemann series theorem, a conditionally convergent series can be rearranged to sum to any real number, or to diverge to positive or negative infinity. Because expected value theory typically assumes the order of summation should not alter the value of a prospect, the lack of a unique sum means the expected value is undefined. There is no fact of the matter about what the game is worth in expectation.

  This is distinct from and deeper than the St. Petersburg paradox. In the St. Petersburg case, the expected value is infinite. Standard theory struggles because it implies a rational agent should pay any finite amount to play, which seems absurd. However, the theory still provides a ranking: infinity is greater than any finite cost. In the Pasadena case, the theory is silent. It cannot assign a value to the game, meaning it cannot rank the Pasadena game against a sure thing of $0, or against itself under a different description. The decision rule fails to output a recommendation at all, rendering it incomplete rather than merely counterintuitive.

  The Altadena game offers a contrast. Its payoff terms are all positive ($1/n$), forming the standard harmonic series, which diverges to positive infinity. Thus, Altadena has an infinite expected value. Furthermore, Altadena dominates Pasadena: for every outcome *n*, the Altadena payoff is strictly greater than the Pasadena payoff. Dominance reasoning suggests a rational agent should prefer Altadena over Pasadena. However, this does not solve the evaluation problem for the Pasadena game in isolation. If an agent is offered only the Pasadena game for a fixed entry fee, dominance reasoning is inapplicable. The core issue remains that expected value theory cannot assign a value to Pasadena to determine if the entry fee is fair. Dominance helps choose between the two, but it does not restore a well-defined expectation to Pasadena.

  Several responses have been proposed to rescue decision theory. One approach is to restrict the theory to prospects with well-defined expectations. While this avoids mathematical inconsistency, it admits that standard decision theory is incomplete and cannot guide choice in legitimate scenarios like the Pasadena game. Another response is to adopt a bounded utility function. If utility is bounded, the series converges absolutely, and the expected value becomes well-defined. However, this changes the subject from monetary payoffs to utilities. It solves the mathematical problem by stipulating that agents cannot value large sums linearly, but it does not explain what is rational for an agent who cares linearly about money. Finally, one might adopt non-expected-value criteria, such as maximizing the median payoff or using stochastic dominance. While these avoid the undefined expectation, they often violate other plausible rationality axioms, such as independence.

  Ultimately, the Pasadena game demonstrates that expected value maximization is not a universal theory of rational choice. It either requires supplementation by a theory of how to handle undefined expectations or must be restricted to a narrower class of prospects, acknowledging that rationality may not dictate a unique choice in all cases.

  ***

  **Marking Scheme**

  **Total: 25 Marks (5 points per criterion)**

  **1. Mathematical Explanation (5 marks)**
  *   **A (5):** Correctly identifies the series as the alternating harmonic series. Explains that it is *conditionally convergent* and invokes the principle that rearrangement changes the sum (Riemann series theorem), leading to an undefined value.
  *   **B (3-4):** Identifies the series but treats undefined status as a mere technicality or fails to explain *why* rearrangement matters.
  *   **C (0-2):** Claims the value is zero, infinite, or fails to discuss the series structure.

  **2. Undefined vs. Infinite (5 marks)**
  *   **A (5):** Clearly distinguishes undefined (Pasadena) from infinite (St. Petersburg). Explains that St. Petersburg yields a ranking (infinity > finite), whereas Pasadena yields silence/incompleteness.
  *   **B (3-4):** Distinguishes the two but fails to articulate why "silence" is a deeper theoretical problem than "absurdity."
  *   **C (0-2):** Confuses undefined with infinite or claims both are identical problems.

  **3. Implication for EV Maximization (5 marks)**
  *   **A (5):** States that EV maximization fails to be a complete decision rule because it cannot rank the Pasadena game against other prospects (e.g., $0).
  *   **B (3-4):** States the theory fails but suggests it is merely a calculation error rather than a structural limitation.
  *   **C (0-2):** Claims the theory still works or ignores the implication for rational choice.

  **4. Altadena and Dominance (5 marks)**
  *   **A (5):** Acknowledges Altadena dominates Pasadena and has infinite EV. Correctly argues that while dominance guides choice *between* games, it does not assign a value to Pasadena *alone* (e.g., against a cash offer).
  *   **B (3-4):** Claims dominance solves the problem entirely or fails to note Altadena's infinite EV.
  *   **C (0-2):** Ignores Altadena or claims dominance is irrelevant.

  **5. Evaluation of Response (5 marks)**
  *   **A (5):** Assesses one response (e.g., bounded utility, restriction, alternative criteria) and identifies a specific limitation or cost (e.g., changes the subject, admits incompleteness).
  *   **B (3-4):** Describes a response but fails to critically evaluate its limitations.
  *   **C (0-2):** Proposes a solution without evaluation or suggests an irrelevant fix.

  **Common Mistakes to Penalize:**
  *   Stating the expected value is 0 (ignoring rearrangement).
  *   Stating the expected value is infinite (confusing with St. Petersburg).
  *   Claiming rearrangement is irrelevant because probabilities are fixed (missing the point of conditional convergence in decision theory).
  *   Asserting that because Altadena is better, Pasadena's value is solved.
