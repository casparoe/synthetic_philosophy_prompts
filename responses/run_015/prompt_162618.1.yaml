      *(Self-Correction during drafting)*: I need to make sure I don't confuse "Branch Bargain" with standard "Caring Measure" (Greaves). The prompt calls it "Branch Bargain." I should use that terminology while acknowledging it maps onto the Caring Measure literature. The "bargain" aspect suggests a contractualist flavor—my current self agrees to terms with future selves. I should lean into that.

      *On the "Why Squared?" point:* Both views ultimately lean on the mathematical structure of Hilbert space (Gleason's theorem or symmetry under unitary transformations). The difference is *what* that structure constrains. SLU: constrains the "size" of the self-location set. BB: constrains the "value" of the future self. BB is more honest because Hilbert space is physical, not epistemic.

      *On Frequencies:* BB says "I care about the future where frequencies hold." SLU says "I am likely to be in the future where frequencies hold." BB is more robust because "likely" is the thing in question.

