  *(Final Plan)*:
  1.  Introduction acknowledging the translation challenge.
  2.  Component-by-component translation (Original Position, Veil, Maximin, Difference Principle) with Survive/Warp/Loss.
  3.  Residue Report (Rational Choice vs. Normative).
  4.  Critique of the "Veil as Hidden-Phenotype ESS" hypothesis.
