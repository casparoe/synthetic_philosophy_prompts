      *   **(b) The Independence ($P(Independent)$):** Probability that material/oral sources are independent from the same structural filtering.
          *   *Reasoning:* Oral history and material culture (tools, dwellings) exist outside the bureaucratic logic of the archive. However, they are not perfectly independent (oral histories can be suppressed, materials decay). But relative to the *official* archive, they bypass the specific "legibility" criteria.
