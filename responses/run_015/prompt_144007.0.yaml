answer: |-
  (a) **Prior on Structural Exclusion ($P_{struct}$): 0.85**
  Archives function as technologies of state legibility where the decision to exclude precedes the physical possibility of decay, making selection bias the primary filter for marginalized labor.

  (b) **Independence of Alternative Sources ($P_{indep}$): 0.70**
  While oral and material traces bypass bureaucratic categorization, they remain vulnerable to the same social stigmas and physical neglect that govern the dominant culture's preservation habits.

  (c) **Coherence of Epistemic Re-weighting ($P_{coh}$): 0.90**
  Contextual epistemology permits prioritizing sources based on fitness for specific historical recovery without requiring a totalizing rejection of textual authority or exhaustive political genealogy.

  (d) **Aggregate Joint Credence ($P_{joint}$): 0.54**
  Calculated multiplicatively ($0.85 \times 0.70 \times 0.90$) to reflect that the joint claim collapses if any of the three necessary conditions (structural cause, source independence, methodological coherence) fails.

  **Least Confidence:** Term (b), the independence of material and oral sources.
  **Revising Counter-Evidence:** The discovery that the marginalized group's oral traditions were systematically transcribed or mediated by the same institutional actors who managed the written archive, thereby imprinting the structural silence onto the alternative sources themselves.
