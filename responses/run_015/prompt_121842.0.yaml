answer: |-
  You have identified a genuine and persistent structural tension in the reception of Schopenhauer's aesthetics. Your diagnosis is precise: the interpreter preserves the *metaphysical architecture* of Schopenhauer's system (music as a direct copy of the Will, bypassing the Ideas) but populates that architecture with *phenomenal content* (specific emotional states), thereby collapsing the very transcendental distinction that makes the architecture unique.

  ### Is there an established name?

  There is **no single, canonical term** in the scholarly literature that specifically names this failure mode.

  Scholars such as Christopher Janaway (*Schopenhauer on Music*, 1992) and Bryan Magee (*The Philosophy of Schopenhauer*, 1983) extensively discuss the ambiguity in Schopenhauer's own text regarding whether music expresses the *essence* of emotions or emotions *themselves*. Janaway notes that Schopenhauer often slips into language that suggests music expresses "joy" or "sorrow," even though his metaphysics dictates it can only express the "in-itself" of those states devoid of particular objects. However, while the *problem* is documented, the specific *interpretive fallacy* you describe—retaining the metaphysical shell while swapping the noumenal content for phenomenal content—does not have a standardized label like *argumentum ad passiones* or the *intentional fallacy*.

  In analytic aesthetics, this is sometimes loosely grouped under **psychologism**, but as you noted, that term is too broad. It generally refers to reducing normative or metaphysical claims to psychological facts, without necessarily capturing the specific "bait-and-switch" of claiming non-representation while delivering representation.

  ### Proposed Term: The Phenomenological Displacement Fallacy

  I propose naming this failure mode **The Phenomenological Displacement Fallacy** (PDF).

  Alternatively, to emphasize the representational contradiction, it could be termed **The Representational Retrojection**. However, *Phenomenological Displacement* better captures the structural movement: the interpreter displaces content from the phenomenal realm (emotions) into the noumenal slot (the Will) while claiming the slot remains noumenal.

  #### Definition
  The **Phenomenological Displacement Fallacy** occurs when an interpreter:
  1.  **Affirms** a metaphysical distinction between a non-representational ground (e.g., the Will) and representational appearances (e.g., Ideas, emotions, objects).
  2.  **Assigns** a specific art form (e.g., music) to the non-representational ground.
  3.  **Defines** the content of that art form using vocabulary that belongs exclusively to the representational realm (e.g., specific affects, narrative tensions, psychological states).
  4.  **Fails to acknowledge** that this definition collapses the distinction affirmed in step 1, effectively rendering the art form representational despite the initial claim.

  ### Boundary Conditions

  To ensure this term is philosophically useful, it must be distinguished from three adjacent phenomena:

  #### 1. Distinction from Naive Psychologism
  *   **Naive Psychologism:** Ignores or rejects the metaphysical framework entirely. It claims "Music is just the expression of human emotion" without reference to the Will, noumena, or representation.
  *   **Phenomenological Displacement:** *Requires* the metaphysical framework. It uses the authority of Schopenhauer's metaphysics ("Music is the Will!") to lend weight to a psychological claim ("...and the Will is essentially Longing!").
  *   **The Boundary:** If the interpreter drops the metaphysics, it is psychologism. If they keep the metaphysics as a justification for the psychology, it is PDF.

  #### 2. Distinction from Heuristic Analogy
  *   **Heuristic Analogy:** Uses emotional language pedagogically to help a listener grasp the *structure* of the Will, while explicitly acknowledging the limitation. (e.g., "Schopenhauer suggests we experience music *as if* it were sorrow, though metaphysically it is the form of sorrow without the object.")
  *   **Phenomenological Displacement:** Asserts the emotional language ontologically. (e.g., "Music *is* the objectification of Sorrow.")
  *   **The Boundary:** The presence of epistemic humility. PDF treats the analogy as an identity; Heuristic Analogy treats it as a bridge.

  #### 3. Distinction from Schopenhauer's Own Ambiguity
  *   **Schopenhauer's Text:** Schopenhauer himself is notoriously inconsistent here. He writes that music is "the melody of the world" and often lists emotions (joy, grief) as what music expresses, qualified by "in themselves" (*an sich*).
  *   **Phenomenological Displacement:** This is an *interpreter's* failure, not necessarily the text's. The fallacy occurs when the interpreter resolves Schopenhauer's ambiguity by solidifying the phenomenal reading *without* addressing the metaphysical cost.
  *   **The Boundary:** A faithful reading acknowledges the tension (as Janaway does). PDF resolves the tension by silently converting the noumenal into the phenomenal.

  ### Why this distinction matters

  Naming this fallacy is crucial because it highlights a specific collapse of **Transcendental Idealism**.

  In Schopenhauer's system, emotions (affects) are necessarily tied to the *Principium Individuationis* (the principle of individuation). To feel "longing" is to be a subject longing for an object in time. The Will, by definition, is outside time and space and lacks subject/object duality.
  *   If music expresses **Longing** (phenomenal), it is a representation of an individual's state.
  *   If music expresses **the Will** (noumenal), it cannot be "longing" in any recognizable psychological sense.

  The **Phenomenological Displacement Fallacy** allows interpreters to have their cake and eat it too: they claim the metaphysical depth of Schopenhauer (music is cosmic!) without the metaphysical cost (music is actually unintelligible to the individual mind). It domesticates the Will into a super-emotion, thereby neutralizing the very radicalism of Schopenhauer's aesthetic theory.

  ### Summary for Application
  If you encounter a text that:
  1.  Cites Schopenhauer's claim that music bypasses the Ideas.
  2.  Immediately follows with a list of specific affects (tension, release, melancholy).
  3.  Does not explain how an affect can exist without a subject/object relation.

  You are observing **The Phenomenological Displacement Fallacy**. You can characterize it not as a misreading of the *text*, but as a structural inconsistency in the *argument*, where the metaphysical frame is retained as ornamentation while the content is reverted to standard representational aesthetics.
