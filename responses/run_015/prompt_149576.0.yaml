answer: |-
  Here is the battle plan for your 75-minute session. It is designed to respect the time limits, leverage the specific expertise in the room, and hit your three learning goals without getting bogged down in technical weeds.

  ### 1. The Order
  Your instinct is correct, but with one critical pivot. If you tell them the idealization is "malignant" before they try to fix it, the CS folks will treat it as an engineering constraint ("add boundedness") and the Phil folks will treat it as a standard idealization debate. You need the **failure of the patches** to prove the malignancy.

  **Recommended Flow:**
  1.  **The Phenomenon (15 mins):** Establish that we *do* have graded confidence in math, and it changes with computation, not empirical evidence.
  2.  **The Orthodoxy (10 mins):** Show that standard Bayesianism collapses this to 0 or 1 (Logical Omniscience).
  3.  **The Workshop (20 mins):** Ask the room: "How do we fix this?" (This is where they propose the patches). Break the patches together.
  4.  **The Consequence (10 mins):** *Now* drive home that the idealization isn't benign. Because the patches fail, the standard model makes the *value of computation* zero. If $P(\text{theorem}) = 1$ already, calculating the proof adds no expected utility.
  5.  **The Reframe (15 mins):** Shift from "What is the probability?" to "What constraints on a *sequence* of prices prevent exploitation?"
  6.  **The Check (5 mins):** The equivalence test.

  **What breaks if you reorder:**
  *   If you do **Reframe** before **Workshop**: The CS folks will treat Logical Inductors as just another algorithm to memorize rather than a solution to a normative crisis.
  *   If you do **Consequence** before **Workshop**: You lose the room. You're asserting a problem without letting them feel the friction of the failed solutions.
  *   If you skip **Phenomenon**: The Phil folks will treat this as a technical logic puzzle rather than an epistemological problem about *their* actual reasoning.

  ### 2. The Carrying Example
  **Verdict:** The hard 3-SAT instance is the right choice, but it needs strict guardrails.

  **Why it works:**
  *   **Shared Ignorance:** Assuming you pick one neither you nor the group has solved, it creates genuine shared uncertainty.
  *   **Computational Texture:** Both groups understand "checking a clause" vs. "solving the instance." It makes the cost of computation tangible.
  *   **Fixed Truth:** It avoids the "will the machine crash" empirical trap.

  **The Guardrails (Crucial):**
  1.  **Verify beforehand:** You must know the instance is unsolved *and* that the answer is fixed. Do not walk in hoping it's hard. Run it against a SAT solver for an hour the night before. If it solves in 5 minutes, pick a harder one.
  2.  **Define the Proposition Clearly:** Write $\phi$ on the board. The claim is "$\phi$ is satisfiable."
  3.  **Rule Out Empirical Noise:** Explicitly state: "We are not betting on whether the server crashes, or whether a human makes a typo. We are betting on the mathematical status of $\phi$."
  4.  **Avoid Symmetry:** Do not use "Is the $10^{100}$th digit of $\pi$ odd?" This invites the "Principle of Indifference" (50/50) response, which you want to kill. SAT feels asymmetric; we suspect it's unsatisfiable, but we aren't sure. That tension is useful.

  **What the example must lack:**
  *   **No known proof structure:** Don't pick something where a specific proof technique (e.g., parity arguments) obviously applies. You want the uncertainty to be about the *search*, not the *method*.
  *   **No physical stakes:** Keep the betting hypothetical. Real money introduces risk aversion noise.

  ### 3. Misconceptions: When to Head Them Off
  You cannot preemptively block these without sounding dogmatic. Let them surface, then dismantle them. Here is the timing for each:

  *   **"It's just empirical uncertainty (about my brain/typos)."**
      *   *When:* **Minute 10 (during Phenomenon).**
      *   *Action:* Shut this down immediately. If this is true, logical uncertainty is just standard epistemology. Insist: "Even if I know I made no typos, I am still uncertain. The uncertainty is about the *map*, not the *territory*."
  *   **"Just decline to bet / 50/50 Indifference."**
      *   *When:* **Minute 25 (during Workshop).**
      *   *Action:* Let a student suggest it. Dutch book them. If they refuse to bet, they can't act. If they bet 50/50 on $\phi$ and 50/50 on $\neg \phi$, they are vulnerable if they later learn $\phi \leftrightarrow \psi$.
  *   **"Proof-Length Prior / Prior over Models."**
      *   *When:* **Minute 30 (during Workshop).**
      *   *Action:* This is the CS folks' natural instinct. Let them propose it. Then ask: "How do you normalize that prior?" (It's uncomputable/undecidable). "Does it guarantee coherence?" (No, you can still be Dutch-booked before the proof is found). This motivates the need for a *market* constraint rather than a *prior* constraint.
  *   **"Calibration solves this."**
      *   *When:* **Minute 50 (during Reframe).**
      *   *Action:* CS folks love calibration. Point out that you can be perfectly calibrated on a sequence of independent claims but still be internally incoherent (e.g., $P(A)=0.7, P(B)=0.7, P(A \land B)=0.1$). Logical uncertainty requires *coherence over time*, not just calibration over trials.
  *   **"Logical Omniscience is a benign idealization."**
      *   *When:* **Minute 40 (The Consequence).**
      *   *Action:* This is the boss fight. Use the **Value of Computation** argument. "If $P(\text{theorem}) = 1$ at $t=0$, then the expected value of running a proof search is zero. The model cannot explain why we do math. Therefore, the idealization destroys the phenomenon it is supposed to model."

  ### 4. The Check
  Your idea is excellent. Here is how to execute it to ensure they grasp the *process* constraint, not just the "probabilities can differ" slogan.

  **The Setup (Last 5 mins):**
  Hand out a slip with two claims:
  1.  $A$: "This specific 3-SAT instance $\phi$ is satisfiable."
  2.  $B$: "The corresponding Independent Set instance $G_\phi$ has a clique of size $k$."
  (Ensure you explain briefly that $A \leftrightarrow B$ is a known polynomial-time reduction, but seeing the mapping takes work).

  **The Question:**
  "Standard Bayesianism requires $P_t(A) = P_t(B)$ for all $t$. A Logical Uncertainty model allows $P_t(A) \neq P_t(B)$. What constraint must a *good* Logical Uncertainty model place on the relationship between $P_t(A)$ and $P_t(B)$?"

  **The Right Answer (What you're listening for):**
  *   **Wrong:** "They can be whatever." (Misses the normative constraint).
  *   **Wrong:** "They must eventually match." (Too weak; convergence isn't enough, you can be exploited *during* the divergence).
  *   **Right:** "They can differ, **but** the difference cannot be exploited by a computationally bounded trader who recognizes the equivalence." OR "The prices must converge fast enough that no efficient arbitrage exists between them."
  *   **Key Concept:** They need to mention **exploitation/arbitrage**, not just **accuracy/truth**. The norm is about *resilience to money pumps*, not just *matching the world*.

  ### 5. What to Openly Refuse to Explain
  Put this on the board at the start. It manages expectations and protects your credibility.

  **The "Not Today" List:**
  1.  **The Logical Inductor Construction:** "We will not derive the algorithm. We are discussing the *normative criteria* that the algorithm satisfies."
      *   *Credibility Cost:* Low for Phil, Medium for CS.
      *   *Mitigation:* Tell CS folks: "The construction is a fixed-point theorem application. It's technical. Today is about *why* we need that fixed point, not how to compute it."
  2.  **Computability Bounds:** "We will not define 'efficient' (P vs NP) rigorously today. Assume 'efficient' means 'doable on a laptop in a human lifetime'."
      *   *Credibility Cost:* Low for both. Everyone gets the intuition.
  3.  **Deep Model Theory:** "We are not discussing completions of PA or ZFC. We are talking about finite propositional claims."
      *   *Credibility Cost:* High for Phil if you don't say this. They will worry about Gödel. Preempt it. "Gödel is a side issue here; the problem exists even in propositional logic."

  **Credibility Note:**
  *   **CS Half:** They will lose respect if you imply the math is "magic." Acknowledge the algorithm exists and is computable, but insist the *philosophical motivation* is the bottleneck, not the code.
  *   **Phil Half:** They will lose respect if you treat norms as "engineering constraints." Insist that *avoiding exploitation* is a normative requirement of rationality, not just a safety feature.

  ### Minute-by-Minute Schematic (for your notes)

  *   **00-05:** Intro & The "Not Today" List.
  *   **05-20:** **Phenomenon.** Put the SAT instance on the board. Ask for prices. Simulate "running a clause check." Update prices. Ask: "What changed? The world? No. Your logic."
  *   **20-30:** **Orthodoxy.** "Bayes says $P(\text{tautology})=1$." Show that this implies $P(\phi)$ is 0 or 1 right now. Ask: "Who is willing to bet their stipend on that?"
  *   **30-50:** **Workshop (Patches).** "How do we fix Bayes?" (Let them talk). Break the Proof-Length Prior. Break the Model Prior. Break the "Benign Idealization" (Value of Computation argument).
  *   **50-65:** **Reframe.** Introduce the Market Metaphor. Prices as a sequence. The adversary is a *trader*, not *nature*. The goal is *unexploitability*, not *omniscience*.
  *   **65-70:** **The Check.** The SAT vs. Independent Set slip.
  *   **70-75:** Wrap & Readings (Garrabrant et al. "Logical Induction" intro, Haim Gaifman's work).

  Good luck. Keep the SAT instance handy on a slide in case they ask to see it again. Don't let them solve it.
