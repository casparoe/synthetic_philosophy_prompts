answer: |-
  Elias hovered above the Lattice, the glow of his wrist-slate cutting through the silt like a blade. The text was crisp and immutable: *Valve 7-B, Torque Specification 450 Nm.* He held the entire system in his head—the pressure gradients, the alloy fatigue rates, the exact viscosity of the hydraulic fluid at this depth. It was a cathedral of facts, built over twenty years and preserved perfectly in memory.

  Beside him, Kael grunted, the sound vibrating through the comms. The novice's gloved hands slipped on the rusted wheel. "It won't turn, Elias. The slate says forty-five hundred."

  "The slate is right for a new valve," Elias said, his voice steady despite the cold seizing his joints. "But the corrosion changes the friction. You're fighting the rust, not the mechanism."

  "Tell me how much force," Kael pleaded.

  Elias tried to calculate. He knew the theory of leverage, the vector of the current pushing against their suits. But when he reached out to demonstrate, his own hand hesitated. He knew *that* the wheel required a pulsing rhythm to break the seal, but his muscles had forgotten the cadence. He pushed, relying on the data, and the wrench skidded, sparking against the housing. The feedback was wrong—a sharp jar up his arm that his mind recognized but his body couldn't absorb. He was out of tune.

  "Stop looking at the numbers," Elias said, pulling his hand back. The slate flickered, warning of a pressure surge. The documentation offered no solution for a seized valve in a surge.

  "Then what do I do?"

  "Close your eyes. Feel the vibration through the wrench. When the metal hums, push. When it goes dead, wait."

  Kael hesitated, then obeyed. The novice stopped fighting the data and started listening to the tool. He pushed gently, paused, pushed again. The wheel groaned, then gave a fraction of an inch.

  Elias watched, helpless despite his knowledge. He could recite the physics of the turn, but he could not make the turn himself. The truth was on the slate, but the action was in the boy's arms. The valve sealed just as the pressure wave hit.

  Facts can be stored in the dark, but skill must be kept warm by the living hand.
