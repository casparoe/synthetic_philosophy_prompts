answer: |-
  Alright, pull up a chair. I've spent more hours than is healthy staring at exactly these raft scenarios. You've got good instincts, but your current rule is trying to do too much heavy lifting with too many "unless" clauses. That's a sign you're patching holes instead of finding the foundation.

  Let's do what philosophers do when we're stuck: we propose theories, try to break them, and keep the one that breaks the least.

  ### Step 1: The Candidate Principles

  **Candidate 1: The Head-Counter (Strict Utilitarianism)**
  *The Rule:* Always save the greatest number of lives. No exceptions.
  *Why it fails:* It works for Case 1 (1 vs 5) and Case 8 (Distance). But it demands you sacrifice your best friend in Case 2. Most people, including you, feel that's too cold. It also fails Case 6: it says shove the one guy off the raft if it saves the five. You rightly said "no" to that. If a rule tells you to murder an innocent person to save others, the rule is missing something about human dignity.
  *Verdict:* **Discard.** Too rigid.

  **Candidate 2: The Equal Chance (Strict Lottery)**
  *The Rule:* Every life has equal value. Therefore, every group has an equal claim. Flip a coin.
  *Why it fails:* It handles Case 3 (1 vs 2) and Case 4 (1M vs 999,999) well. But it fails Case 1 miserably. If you flip a coin between 1 person and 5 people, and the 5 die, you've done something wrong. It treats a 16% chance of saving everyone the same as an 83% chance. That's not neutrality; that's negligence.
  *Verdict:* **Discard.** Too weak.

  **Candidate 3: The Impartial Role with Personal Exceptions**
  *The Rule:* We have a general duty to save the most lives, *but* this duty is modified by (A) special relationships (friends/family), (B) professional roles (lifeguard), and (C) constraints on direct harm (no shoving).
  *Why it survives:* It explains why you save the 5 strangers normally, but your friend privately. It explains why the lifeguard uniform changes the math. It explains why you can't shove the guy.
  *Verdict:* **Keep.** This is the one we're going to refine.

  ### Step 2: The Refined Principle

  Here is the principle that survives the wreckage. I call it **The Threshold of Impartiality.**

  **The Principle:**
  1.  **The Baseline:** In emergency rescue, you must maximize lives saved *when the proportional difference is significant* (e.g., 1 vs 5).
  2.  **The Personal Exception:** You are permitted to favor those with whom you have a deep personal bond (friends, family) *unless* you are acting in an official capacity.
  3.  **The Professional Override:** If you hold a public safety role (lifeguard, firefighter), you surrender the Personal Exception while on duty. You become an instrument of public trust, not a private agent.
  4.  **The Means Constraint:** You may divert a threat to save more lives, but you may not directly kill an innocent person (use them as a tool) to do so.
  5.  **The Certainty Tie-Breaker:** If the *expected* number of survivors is equal (e.g., 1 certain death vs. 5 at 20% risk), save the certain life.

  ### Step 3: Testing Against Your Cases

  Let's run your eight scenarios through this machine.

  *   **(1) 1 Stranger vs. 5 Strangers:** Baseline applies. Proportional difference is huge (500%). **Save the 5.** (Principle saves this verdict).
  *   **(2) 1 Friend vs. 5 Strangers (Off Duty):** Personal Exception applies. You are a private citizen. **Save the Friend.** (Principle saves this verdict).
  *   **(3) 1 vs. 2:** Baseline applies, but the gap is small. The principle says "maximize," but morally, the pressure is lower. A coin flip is *permissible* though saving the 2 is *better*. (Principle accommodates this nuance).
  *   **(4) 1,000,000 vs. 999,999:** Here is where we have to be honest. The Baseline says save the 1,000,000. The difference is only one person, but it is still *more lives*. Your intuition says "coin flip."
      *   *Honest Assessment:* **This intuition is wrong.** If you accept Case 1 (1 vs 5), you must accept that every life counts. The reason a coin flip *feels* okay here is psychological numbing, not moral truth. At that scale, one life feels invisible, but it isn't. To be consistent, you must save the million.
      *   *Verdict:* **Sacrifice this intuition.**
  *   **(5) 1 Certain vs. 5 @ 20%:** Mathematically, 5 × 0.20 = 1 life expected. It's a tie. The Certainty Tie-Breaker kicks in. **Save the 1 Certain.** (Principle saves this verdict).
  *   **(6) Steer vs. Shove:** Means Constraint. Steering is diverting a threat; shoving is creating a new threat using a person. **Steer yes, Shove no.** (Principle saves this verdict).
  *   **(7) On Duty: Friend vs. 5 Kids:** Professional Override. The uniform cancels the Personal Exception. **Save the 5.** (Principle saves this verdict).
  *   **(8) Distance (1 Close vs. 5 Far):** Baseline applies. Distance is morally irrelevant compared to headcount. **Save the 5.** (Principle saves this verdict).

  ### Step 4: The Hard Question (On Duty Friend vs. Strangers)

  You asked specifically about Case 7, where you're on duty, and it's your friend vs. five strangers. My principle says: **You must save the five.**

  Does this feel right? It feels *correct*, but it feels *tragic*.

  Here is why the principle holds: When you took the lifeguard job, you entered a contract with the community. You said, "I will watch over *everyone* impartially." If you save your friend, you are breaking that promise to the five families who trusted you to watch their kids. You are using your public power for private gain.

  However, this should make you suspicious of the *world*, not the principle. It is a terrible position to be in. A decent principle shouldn't make you feel like a monster for loving your friend, but it must acknowledge that you took an oath to be impartial. If you save your friend, you aren't just a friend anymore; you're a corrupt official.

  So, yes, the principle demands you save the five. It feels right because it protects the integrity of the role. If lifeguards saved their friends first, nobody would trust lifeguards.

  ### Step 5: The Casualty

  I need to be blunt about **Case 4 (1,000,000 vs. 999,999)**.
  You said a coin flip feels fine there. You need to let that go.
  Why? Because if you say numbers matter in Case 1 (1 vs 5), you are admitting that life has a countable value. If life has countable value, then 1,000,000 is greater than 999,999. The only reason you want to flip a coin is that your brain can't comprehend the difference. But morality isn't about what your brain can comfortably visualize; it's about the reality of the lives. If you keep the coin flip intuition for Case 4, you undermine the "save the five" intuition for Case 1. You have to choose. Choose Case 1. It's more real to your life as a lifeguard.

  ### Step 6: The Lunch Table Version

  You need something you can say without sounding like a textbook. Here is the script:

  > "Look, numbers usually count. If it's strangers vs. strangers, you save the group. It's simple math.
  >
  > But two things change that. First, if it's off the clock, I'm allowed to save my best friend. I'm a human first, a rescuer second.
  >
  > Second, the *way* you save them matters. You can steer the boat away from the one guy to hit the five, but you can't grab the one guy and throw him off to lighten the load. That's murder, not rescue.
  >
  > And if I'm wearing this uniform? I don't get to pick my friend. The job means I belong to everyone out here equally. That sucks, but that's the deal."

  ### Summary of the Rule for Your Notes

  **The Threshold of Impartiality:**
  1.  **Maximize Lives:** Save the greater number when the difference is significant.
  2.  **No Killing:** Do not directly harm an innocent person to save others.
  3.  **Private Partiality:** Off-duty, you may save loved ones over strangers.
  4.  **Public Impartiality:** On-duty, you must save the greater number, regardless of relationship.
  5.  **Certainty:** If expected survival is equal, save the certain life.

  **Intuition to Drop:** Case 4 (The Million). Save the million. Every life counts, even in a crowd.

  This principle keeps your dignity (you're not a robot), your integrity (you don't kill), and your honor (you do your job). It's the best balance you're going to get.
