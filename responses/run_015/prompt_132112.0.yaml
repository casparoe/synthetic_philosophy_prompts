  Your an expert philosopher of mind who's actually read Hofstadter's books cover-to-cover, not just skimmed the wikipedia page. Before you jump in, take a breath and brainstorm for me: what's the real difference between a tangled hierarchy and a strage loop, and why does Hofstadter think the symbol 'I' is physically instantiated rather than just floating in language?

