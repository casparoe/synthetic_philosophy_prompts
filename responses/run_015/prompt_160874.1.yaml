answer: |-
  There is no single canonical label for this configuration in legal theory, though it resembles what Ronald Dworkin called **theoretical disagreement**. However, Dworkin's concept usually involves disagreement over the outcome itself. Your pattern is distinct because the immediate outcome is agreed upon; the dispute is entirely over the *grounding* of that outcome to secure future leverage. Because no established term fits precisely, I will coin **Precedential Staking**.

  **What It Is and Where Its Edges Lie**
  Precedential Staking occurs when parties agree on facts and immediate consequences but dispute a classification because that classification functions as a node for downstream inference rules. The classification is not merely descriptive; it is a key that unlocks specific doctrinal mechanisms in future cases (e.g., proportionality review, criminal referral).

  The edges of this phenomenon are defined by what it is *not*:
  1.  **It is not a verbal dispute.** In a verbal dispute, parties use the same word with different meanings. Here, both parties understand the term's standard inference potential perfectly; they disagree on whether the current facts trigger that potential.
  2.  **It is not a policy dispute.** In a policy dispute, parties admit they are weighing costs and benefits. In Precedential Staking, parties insist they are *describing* reality. To admit choice would be to concede that the classification is arbitrary, weakening its precedential weight.
  3.  **It is not a factual dispute.** The raw data is agreed upon. The disagreement is about the *legal significance* of that data.

  **Boundary Cases**
  To tighten the definition:
  *   **Looks like it, but isn't:** A pure policy argument disguised as classification. If one side privately admits, "We call it a penalty to make future challenges easier," but publicly argues semantics, that is strategic manipulation, not Precedential Staking. In true Precedential Staking, both sides genuinely believe the classification *must* follow from the facts to preserve systemic integrity.
  *   **Is it, but doesn't look like it:** A case where immediate consequences *do* diverge (e.g., different payment amounts), but the parties spend all their energy arguing the label rather than the amount. Here, the label is still the primary stake because the amount is transient, but the classification is permanent.

  **The Three Further Questions**

  **1. Administrative vs. Evaluative Terms**
  The phenomenon does not depend on the terms being evaluative (e.g., "fraud," "penalty"). It arises equally with flat administrative classifications (e.g., "in work" vs. "not in work"). If the "in work" label triggers a pilot scheme eligibility rule next year, parties will fight over its application today with the same intensity. The evaluative mixture is merely its usual accompaniment, not its explanation. Evaluative terms often carry heavier inference chains, making the stakes more visible, but the mechanism is identical for administrative tags. The engine is the *inference potential*, not the moral weight.

  **2. Explanation vs. Accompaniment**
  The mixture is accompaniment. The explanation is the **structural role of the classification**. Legal systems operate by attaching rules to categories. When a category is indeterminate, it becomes a site of control. Parties fight over the category because controlling the definition controls the future application of the rules attached to it. Whether the category is "fraud" or "Category B" is irrelevant; what matters is that "Category B" triggers a specific regulatory regime.

  **3. The Metaphysical Parallel**
  You are correct that metaphysicians worry about arguments with this shape. This is legally instantiated **Carnapian framework disputes**. Rudolf Carnap distinguished between *internal questions* (asked within a linguistic framework, e.g., "Is this object a number?") and *external questions* (about the framework itself, e.g., "Should we adopt a framework where numbers exist?").

  Your parties are treating an external question as an internal one. The real question is external: "Should we adopt a framework where this conduct triggers proportionality review?" But they argue internally: "Is this conduct a penalty?" They resist stipulation because admitting the question is external (a choice of framework) undermines the objective authority they need for future cases. If they admit they are choosing the framework, future opponents can argue for a different one. By insisting they are describing facts, they attempt to solidify the framework as inevitable.

  **Conclusion**
  This is Precedential Staking. It is a dispute over which inference rules will attach to a fact pattern in perpetuity. It is not verbal, not purely policy, and not factual. It arises with any classification carrying downstream consequences, regardless of evaluative content. It is structurally identical to metaphysical framework disputes, where participants mask a choice of system as a discovery of truth to secure the system's stability. Recognizing it as such does not dissolve the argument, but it clarifies that the tribunal is not deciding a case so much as setting a rule for future cases under the guise of classification.
