answer: |-
  INTERNATIONAL BUREAU OF ONTOLOGICAL PROVENANCE
  Certification Division | Reference: IBOP-AX-9942
  Date: 14 November 2023
  Subject: Authentication Status of Study in Ultramarine

  1.0 Preamble
  1.1 This document serves as the final ontological assessment of the artefact designated Study in Ultramarine, submitted for verification against the lost 1954 original by V. Kane.
  1.2 The Bureau operates under the mandate that aesthetic value is contingent upon historical causal chains rather than perceptual qualities.

  2.0 Empirical Concordance
  2.1 Preliminary physical analysis confirms molecular identity. Gas chromatography indicates pigment composition matches the 1954 batch within 0.0003 per cent variance.
  2.2 Radiocarbon dating of the canvas fibres aligns with the purported creation window.
  2.3 Microscopic brushstroke topology is identical to high-resolution archives of the artist's known motor functions.
  2.4 To the naked eye and under spectral imaging, the object is indistinguishable from the authentic original.

  3.0 Ontological Metrics
  3.1 Despite empirical perfection, the object fails critical metaphysical thresholds.
  3.2 Causal provenance density was measured at 0.42 CPD, significantly below the required 1.0 threshold for original status. This indicates a break in the spatiotemporal continuity between the artist's intention and the physical medium.
  3.3 Intentional trace spectroscopy revealed no residue of autographic agency. While the brushstrokes mimic the artist's hand, they lack the metaphysical imprint of the creator's conscious volition at the moment of deposition.
  3.4 The indexical authenticity coefficient returned a null value. The object functions as a simulacrum; it points to the original but does not participate in its existence.

  4.0 Determination
  4.1 The Bureau concludes that Study in Ultramarine is ontologically insolvent.
  4.2 While the object possesses all sensible qualities of the original, it lacks the hidden essence conferred by correct genealogy.
  4.3 Value is not inherent in the arrangement of pigment but in the history of its making. Therefore, this object is classified as a Class-4 Non-Original.
  4.4 Display is permitted only with accompanying disclaimers regarding its metaphysical deficiency.

  5.0 Authorisation
  5.1 This report is binding upon all member institutions.
  5.2 Any attempt to reclassify this object based on perceptual enjoyment constitutes a violation of IBOP statutes.

  Appendix A: Metric Definitions
  Causal provenance density measures the tightness of the link between creator and artefact across time. Intentional trace spectroscopy detects the metaphysical radiation emitted during authentic creation. Indexical authenticity coefficients quantify the object's capacity to refer to its own origin without intermediary replication.

  Appendix B: Calibration Standards
  All metrics calibrated against the Kant-Locke Standard Ontological Block. Zero-point adjusted for forgery scenarios where physical identity is maximal but historical continuity is null.

  ***

  Appended Note on Philosophical Liberties

  This parody exaggerates the essentialist position found in certain strands of analytic aesthetics, particularly Nelson Goodman's distinction between autographic and allographic arts in Languages of Art. No philosopher proposes literal metrics like intentional trace spectroscopy; this satirises the tendency to treat historical provenance as a quasi-physical property rather than a normative classification. The piece leans on the conventionalist view that originality is a social construct governing value, not a metaphysical reality detectable by instruments. It critiques the assumption that causal history confers intrinsic worth independent of human experience, suggesting that treating provenance as a hidden substance is bureaucratic fetishism rather than philosophical rigour. Real debates concern identity conditions, not measurable ontological radiation.
