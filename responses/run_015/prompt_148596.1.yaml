prompt: |-
  Write a deadpan parody of an institutional authentication report, approximately 600 words, formatted as numbered clauses and technical appendices, issued by a fictional body called the International Bureau of Ontological Provenance. The report should evaluate a hypothetical painting — call it Study in Ultramarine — that is a perfect, molecular-level forgery of a lost original, indistinguishable by any physical or perceptual test. The satire should target the philosophical practice of treating originality as a hidden, non-empirical property that confers value independently of appearance or experience, particularly the argument that an original possesses a metaphysical status that copies necessarily lack. Rather than inventing a false version of this view, exaggerate its real features: the report should apply pseudo-scientific metrics invented for the prompt — causal provenance density, intentional trace spectroscopy, indexical authenticity coefficients — to measure properties that by definition cannot be detected in the object itself, and should conclude with bureaucratic certainty that the forgery is ontologically insolvent despite being identical in every observable respect. Keep the irony sustained and deadpan; the reader should recognise that the report's reasoning is circular and that its technical language masks an unexamined normative preference for causal history over perceptual quality. Take a committed position: the distinction between original and copy, in this context, is conventional and normative rather than metaphysical. After the report, include a brief appended note — no more than 150 words — explaining exactly where the parody takes liberties with actual art-ontological debates (for instance, whether any real philosopher holds the precise view satirised, and whether intentional trace spectroscopy is a real method) and stating clearly which contested reading of the value-of-originals problem the piece leans on. Begin with the report itself, with no preface, no framing commentary, and no quotation marks around any invented technical terms. Write in British English.
