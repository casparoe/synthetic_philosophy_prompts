      *   *Unfalsifiability:* If every deviation from zero PTP is explained away as "risk" or "probability of existence," is the theory empty? *Response:* It's a methodological stance. It shifts the burden of proof. It's not unfalsifiable, but it is hard to disprove empirically because isolating *pure* time preference is notoriously difficult (the "ceteris paribus" problem).
