answer: |-
  You have identified a genuine conceptual gap in how we talk about scientific history. There is no single, common English word that captures this specific trichotomy, but in the **sociology of science** and **philosophy of history**, this configuration is well-mapped.

  The confusion arises because the word "credit" is doing too much work. It is conflating **moral desert** (who deserves praise) with **sociological assignment** (who gets the label).

  Here is the established framework for the distinction you are looking for, followed by a proposal for how to name the fork if you need to use it in conversation.

  ### 1. The Established Framework: Mertonian Sociology
  The sociologist Robert K. Merton wrote the definitive work on this. He distinguishes between the **ontological reality** of the discovery and the **sociological reward** of the discovery.

  *   **Axis 1: Multiple Discovery (Inevitability)**
      This is the term for your first question. When Newton and Leibniz, or Darwin and Wallace, find the same thing, sociologists call this **Multiple Discovery** (or *independent simultaneous discovery*).
      *   *Implication:* If Multiple Discovery is common in a field, it suggests **Determinism**. The discovery was "in the air" (the *Zeitgeist*). The state of prior knowledge had ripened the problem to the point where any competent practitioner would have solved it soon.
      *   *Effect on Credit:* Reduces *individual* moral desert. It suggests the "system" found it, not the person.

  *   **Axis 2: Agency/Contingency (The "Great Man" Variable)**
      This is your second question. In history of science, this is the debate between **Externalism** (social/technological forces make things inevitable) and **Internalism** (individual genius/logic drives progress).
      *   *Implication:* If a discovery hinges on a specific, non-obvious leap that no one else was making, it is **Contingent**.
      *   *Effect on Credit:* Increases individual moral desert.

  *   **Axis 3: Priority (The Administrative Rule)**
      This is your third question. Merton calls this **Priority**. In science, priority is not a moral judgment; it is a **conventional heuristic**.
      *   *The Rule:* Credit goes to the first to *publish* (or document), regardless of inevitability or depth of insight.
      *   *Why it tracks neither:* Science uses priority as a coordination mechanism to stop endless disputes. It doesn't matter if it was inevitable (Axis 1) or if the other guy had a better notation (Axis 2); the "winner" is the one who filed the claim first. This is why Stigler's Law of Eponymy exists ("No scientific discovery is named after its original discoverer").

  ### 2. Naming the Fork
  Since there isn't a single pop-science term for this, if you want to articulate this distinction clearly, you should separate **Merit** from **Priority**.

  I would suggest calling the fork **The Priority-Merit Decoupling**.

  *   **Merit** is determined by the Inevitability/Contingency axis. (How much did this specific mind *cause* the outcome?)
  *   **Priority** is determined by the Documentation axis. (Who crossed the finish line first according to the rules?)

  When people argue about "who gets credit," they are usually arguing about **Merit**, but the scientific community answers with **Priority**. That is why the conversation feels like it's talking past itself.

  ### 3. The Newton/Leibniz Nuance: Concept vs. Formalism
  You asked specifically about the case where the *discovery* was inevitable but the *formulation* was contingent. This is a crucial edge case.

  In philosophy of mathematics and science, we distinguish between:
  1.  **The Ontic Discovery:** The realization that the object/truth exists (e.g., "There is a way to calculate rates of change").
  2.  **The Epistemic Formalism:** The language or system used to manipulate it (e.g., Newton's fluxions $\dot{x}$ vs. Leibniz's differentials $dx$).

  In the Newton/Leibniz case:
  *   **Ontically (Inevitable):** Calculus was bound to happen. The problems of physics at the time demanded it. Both get Merit here.
  *   **Epistemically (Contingent):** Leibniz's notation was vastly superior and contingent on his specific insight into symbolic logic. Newton's was clunky.
  *   **Priority (Attribution):** Newton published first (sort of), but Leibniz published *clearly* first.

  **How to label this specific fork:**
  If you need to distinguish between "finding the truth" and "creating the tool," use the distinction between **Discovery** (finding what was already there) and **Invention** (creating the framework to describe it).

  *   Calculus was **Discovered** by both (Inevitable).
  *   Modern Calculus notation was **Invented** by Leibniz (Contingent).

  ### 4. Summary of Terms for Your Mental Model
  If you are writing or thinking about this, here is the cleanest vocabulary to separate the edges:

  1.  **Determinism vs. Contingency:** Use this for the "Inevitable vs. Individual Insight" axis.
      *   *High Determinism:* "It was in the air." (Low individual merit).
      *   *High Contingency:* "Only they could have done it." (High individual merit).
  2.  **Priority:** Use this strictly for the "Who gets the name" axis. Acknowledge it is a bureaucratic rule, not a moral verdict.
  3.  **The Attribution Gap:** Use this to describe the friction between the two. (e.g., "There is a large attribution gap in the Wallace/Darwin case; Wallace had priority on the insight, but Darwin had priority on the synthesis.")

  ### The Verdict
  You are looking for a distinction between **Causal Responsibility** (who made it happen), **Historical Necessity** (would it have happened anyway), and **Conventional Attribution** (who gets the name).

  There is no single word for the configuration, but the most precise way to describe the "fork" you are seeing is the distinction between **Scientific Merit** (a function of contingency) and **Scientific Priority** (a function of documentation). They are orthogonal variables that we mistakenly treat as the same thing.
