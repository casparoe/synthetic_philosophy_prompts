  Superficially, coercing individuals into jobs that public policy simultaneously renders obsolete appears incoherent. It suggests a contradiction between valuing work (via conditionality) and devaluing it (via automation). However, this tension dissolves if we recognise that the policy does not presuppose work as **self-realisation**, but rather as **discipline**. The consistency lies in the maintenance of the *obligation* to labour, not the preservation of specific *roles*. The state can logically hold that labour is morally required for income distribution while accepting that market efficiency demands automation. The 'reskilling' loop is the crucial stabiliser here; it ensures that displacement does not lead to exit from the labour market, but rather to a state of perpetual preparation.

  We must distinguish what is presupposed from what is accommodated. The practice strictly presupposes that **access to welfare must be mediated by labour market participation**. It accommodates automation only insofar as it does not break the link between means-tested support and the *performance* of job-seeking or training. The apparent contradiction—that one arm of the state creates job seekers while another destroys jobs—is functional rather than philosophical. It maintains a reserve army of labour, keeping wages suppressed and ensuring compliance. The 'dignity of work' rhetoric is merely ideological cover for a system that treats the content of work as irrelevant, provided the individual is demonstrably subject to economic discipline. Therefore, the pairing is consistent under a theory of **work as social control**, where the primary value of employment is not production or flourishing, but the regulation of claimants and the legitimisation of inequality. The tension is only ethical, not operational. The policy accommodates the *loss* of jobs but not the *loss of the requirement to work*. This reveals that the true commodity being managed is not labour power, but the political legitimacy of the welfare state itself, which requires a visible exchange of effort for support to satisfy tax-paying constituents. The incoherence is only visible if one assumes the state aims for full employment rather than full compliance.

  - **The liberationist challenge and policy redesign**

  This implicit view is fundamentally incompatible with the liberationist position found in post-work and socialist traditions. Liberationism argues that automation should reduce necessary labour, decoupling survival from employment. Current policy uses automation to cut costs while retaining the employment tie. To adopt the liberationist view, institutional design would require radical alteration. Firstly, **conditionality and sanctions must be abolished**. Income support would become unconditional (e.g., a Citizen's Income), recognising automation as a collective dividend rather than a threat to moral desert. Secondly, **reskilling mandates would become optional**. Education would shift from 'employability' to personal enrichment or civic contribution, removing the coercion to prepare for potentially obsolete roles, such as the care-sector positions noted in the prompt which face similar automation pressures.

  Furthermore, **subsidy criteria** would change. Currently, tax incentives favour capital investment that displaces labour without redistributing gains. Under a liberationist framework, automation dividends would be taxed to fund the unconditional welfare base, ensuring the gains of productivity are shared rather than privatised. The goal of policy would shift from 'full employment' to 'full freedom', measuring success by reduced working hours rather than job creation numbers. While the administrative infrastructure for distribution could remain, the *logic* of exchange would vanish. The state would no longer act as a labour broker enforcing discipline, but as a distributor of common wealth. This removes the hypocrisy of forcing people into roles the state acknowledges are inefficient, aligning institutional practice with the technological reality of post-scarcity potential. The focus shifts from managing scarcity to distributing abundance. The liberationist view accepts that if machines can do the work, humans should be free to pursue other forms of value, rather than being forced into artificial make-work schemes to justify their consumption. Policy would thus incentivise leisure and care, rather than futile labour market attachment.

  - **Verdict**

  The practice ultimately relies on a conception of work as **moral discipline and social control**, rather than flourishing or economic necessity. It is philosophically indefensible because it instrumentalises human beings, demanding they perform obsolete tasks to justify their existence, while simultaneously investing in their redundancy. This creates a 'double bind' that undermines the claimed dignity of work. The cheapest revision to restore coherence would be to **remove the conditionality** attached to benefits. If automation is economically superior, the state should accept the displacement and fund welfare through taxation of capital gains, rather than coercing citizens into a shrinking pool of low-quality roles. This aligns the moral framework with the economic reality, ending the contradictory cycle of creating job seekers for jobs that do not exist.
