answer: |-
  1. **Variant A: The Delayed Push**
  In your delayed push case, the Earth original lives for a week while the Mars replica is already awake; during that week, is there a fact of the matter about which one of them I am?
  *Follow-up:* You'll likely say the question is empty, but during that week the Earth body still has bills to pay and people who love him; if he's destroyed after seven days, isn't that a harm to *me* regardless of what Mars is doing?

  2. **Variant C: Lossy Transmission**
  If the machine only transmits ninety percent of my synaptic detail, I feel like I've died, but at ninety-nine percent I feel like I've survived; where exactly does what matters fail?
  *Follow-up:* If you say it's just a matter of degree rather than a sharp threshold, doesn't that blur the clean contrast you want between identity and the thing that supposedly matters?

  3. **Variant D: The Daily Commute**
  If someone teleports every morning for a year at ninety-nine percent fidelity, how is the person who arrives at the end different from someone who just stayed home and changed psychologically in the ordinary way?
  *Follow-up:* If the difference is only in degree, what work is the machine actually doing, and why do we treat the teleporter as death while we treat ordinary aging as survival?

  4. **Variant E: The Unauthorized Backup**
  If a scan is taken without consent and the replica is made after the original dies, does the original have any reason to care about that replica during those fifty years of life?
  *Follow-up:* If you say consent doesn't change the metaphysics, does that mean what matters in survival is completely detached from whether the continuation was wanted or authorized?

  5. **Variant B: The Slow Build**
  When the replica is assembled cell by cell while the original stays conscious, at what point does a second person come into existence rather than just a modified version of the first?
  *Follow-up:* If you say there's no precise point, are you committed to saying that personhood itself is vague, and doesn't that make it hard to say who is responsible for crimes or debts during the buildup?

  6. **Variant F: The Coincidence**
  If a perfect duplicate pops into existence by accident with no causal link to me at all, does your view commit you to saying that this stranger's survival is what matters to me?
  *Follow-up:* That sounds like a very hard pill to swallow; if you accept it, does that mean causal history is irrelevant, and only the current psychological profile counts?

  7. **Evidence Against the View**
  Setting aside thought experiments, what would count as evidence or an argument that actually proves your reductionist view false rather than just interpreting the cases differently?
  *Follow-up:* If the answer is that nothing could prove it false because it's a conceptual claim, how do we avoid the worry that the view is unfalsifiable and therefore insulated from criticism?

  8. **Special Concern**
  If identity is not what matters, why does special concern for my own future feel so necessary and natural compared to my concern for other people?
  *Follow-up:* If you say it's just a evolutionary habit, should we be trying to engineer ourselves out of that habit, and isn't that a radical psychological project?

  9. **Practical Recommendation**
  If I'm seventeen and I accept your view, should I be less frightened of my own death and redistribute my concern between my future and other people's futures?
  *Follow-up:* If you say yes, hasn't your view thereby become a piece of ethical advice about how to live rather than just a piece of metaphysics about what exists?
