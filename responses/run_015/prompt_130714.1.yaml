  **Credence in P:** 0.55

  **Decomposition**

  1.  **Coherence of the swap machine:** 0.90 — Counterfactual structural models are mathematically coherent even if historical path dependence makes empirical isolation impossible.
  2.  **Institutions as causal variable:** 0.70 — Instrumental variable evidence suggests directionality, though exclusion restrictions remain vulnerable to omitted variable bias.
  3.  **Causal load split:** 0.60 — Proximate causes of growth are institutional, but deep determinants are entangled, suggesting institutions carry roughly half the variance.
  4.  **Interaction effects (keys to one lock):** 0.80 — Complementarities between norms and rules are empirically dense, rendering additive causal decomposition structurally misspecified.
  5.  **External validity of natural experiments:** 0.40 — Local natural experiments identify local effects well but fail to capture global equilibrium adjustments over five centuries.
  6.  **Semantic uncertainty:** 0.85 — Operational definitions of culture and institutions overlap substantially in practice, conflating measurement error with causal disagreement.

  **Synthesis**
  Combining these terms, I arrive at **0.55**. The high probability of interaction effects (Term 4) and low external validity (Term 5) drag down the confidence that the proposition is even well-posed, let alone true, despite the strong theoretical case for institutions.

  **Least Trusted Term**
  **External validity of natural experiments (0.40).** We are extrapolating from specific colonial shocks to a global, 500-year process; the specification error here is likely massive and unquantifiable.

  **Movability**
  This is **stuck in principle**, not just data. You cannot run controlled trials on centuries of history, and new archival data rarely solves the identification problem of separating culture from institutions. Only a novel identification strategy that breaks the entanglement (e.g., exogenous institutional shocks unrelated to settlement or culture) would move it, and none currently exist.

  **Diagnosis of Disagreement**
  You and your friend disagree on **what counts as evidence**. You treat history as a dataset where identification strategies can isolate variables; she treats history as a narrative where variables are constitutively entangled. You are arguing about coefficients; she is arguing about the model specification.
