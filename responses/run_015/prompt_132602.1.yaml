      *   *Nuance:* It's not *identical* to standard Desire Satisfactionism (which is usually about life-goals), but it is a form of "Attitudinal Hedonism" or "Phenomenal Desire Satisfaction." The unity is indeed in the subject's machinery, not the qualia.
      *   *Verdict:* Lose sleep over this. It undermines the claim to be a *phenomenal* hedonism.

