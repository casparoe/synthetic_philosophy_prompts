  Furthermore, this project addresses a gap in the undergraduate and graduate curriculum. We often teach Darwin as the guy who explained *life*, but we rarely dig into how he explained *us*. By focusing on the moral sense, I'm tackling the part of Darwin's work that has the most resonance for public understanding of science today. The question of whether evolution can ground morality is still a hot-button issue. Showing that Darwin himself struggled with this and produced a "hybrid" model adds nuance to that public debate.

  From a training perspective, this project will sharpen my skills in close reading and argument reconstruction. It forces me to be precise with language, which is good practice for any future work in theory or history. It also requires me to manage a large research project independently, which is good preparation for dissertation work.

