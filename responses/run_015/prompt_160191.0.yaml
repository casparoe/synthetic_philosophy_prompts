      *   *Question 3 (Coherence/Revisability):* "In principle" is doing heavy lifting. But Wittgenstein might say "in principle" is misleading. Hinges *can* change, but not via normal testing. They change like a riverbed shifts, not like water flows. So there's tension in the *statement*, but not in the *practice*.
