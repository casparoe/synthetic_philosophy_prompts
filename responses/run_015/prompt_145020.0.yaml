  Good evening, everyone. For those who don't know me, I'm one of Dr. Vasquez's former advisees. And I'll be honest: I've been panicking about this speech all week.

  Partly because it's Elena, and she deserves better than nerves. But mostly because looking around this room, I realize I'm walking a tightrope. On my left, I see colleagues who have dog-eared copies of the *Grundrisse* in their bags. On my right, I see Elena's cousins and nephews, who proudly tell people their aunt taught "something about robots taking jobs."

  And honestly, I just got off the phone with my friend Marcus, who asked me the exact question Elena's cousins ask: "If the machines do all the work, why are we still working so hard?" Marcus thinks the answer is simple. Elena knew the answer was dangerous.

  See, it is very easy to talk about Marx and automation as a story about replacement. The robot comes, the worker leaves, and then we either get a utopia or a disaster. But if there is one thing Elena taught me, it's that the machine doesn't just replace the worker. It dissolves the wall between the work you do to survive and the work the system takes for free.

  For forty years, Elena studied how technology makes exploitation harder to see, not easier to eliminate. She taught us that when the factory spreads out into the whole world, when your phone becomes your office, and when your leisure time becomes data for someone else's profit—you aren't being replaced. You're being absorbed.

  Now, I know half of you just heard "real subsumption" in your head, and the other half just heard "your boss texting you on Sunday." That is exactly where Elena lived. She lived in that gap. She never let the theory become a prophecy of inevitable doom, and she never let it become a comforting lie about progress. She insisted that the danger wasn't the robot; the danger was forgetting to ask who owns the robot, and who pays the price when it breaks.

  But here is the thing that matters more than the theory. Elena didn't just study this tension; she protected us from it.

  In a university system that often treats graduate students like cogs in a publishing machine, Elena refused to let us be machinery. She knew that our minds weren't just "general intellect" to be mined for grants. She made sure we understood that our time belonged to us. She taught me that the most radical thing you can do in a world that wants to blur the lines between your life and your labor is to draw a boundary. To say: *This is me. This is my work. And this is where I stop.*

  And that is why we are here tonight.

  Retirement, in Elena's framework, isn't just stopping work. It is the reclamation of time. It is the act of taking the "unnecessary labor" that capital wants to hide, and turning it back into life. It is proving that the machine does not own the operator.

  So, to the academics in the room: Elena showed us that the critique of political economy is not just about reading texts; it's about reading the world clearly, even when the world wants to confuse you.

  And to her family: You are right to be proud. She didn't just teach "something about robots." She spent a lifetime warning us to guard our humanity against the logic of the machine. And then, she modeled how to turn that machine off.

  Elena, thank you for the clarity. Thank you for the boundaries. And thank you for showing us that the point isn't just to interpret the world, but to find a place in it where you can actually rest.

  Please raise your glasses. To Dr. Vasquez. To your next chapter. And to the time that is finally, fully, yours.
