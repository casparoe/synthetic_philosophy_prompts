answer: |-
  Based on H's track record, she operates on a sophisticated theory of **Communicative Integrity** rather than simple moral purity. She distinguishes between the *truth of the accusation* and the *authority of the accuser*. Her rulings suggest that standing is lost when the act of blaming implies a moral superiority the speaker does not possess, unless that gap is bridged by transparency, reform, or specific role constraints.

  Here is the breakdown of her implicit rules, the predictions for the new cases, and the test case to refine the theory.

  ### H's Implicit Rules

  1.  **The Specificity Principle:** You lose standing if you violate the *same specific norm* you are enforcing (Kev, Tom, Lateness). You retain standing if the norms are distinct, even if related (Cheater vs. Liar).
  2.  **The Transparency/Reform Exception:** Past violations of the same norm do not permanently destroy standing *if* you have either demonstrably reformed (Mara's sobriety) or are transparent about the violation (Nadia's "own it" clause). Hidden cessation is insufficient (Kev).
  3.  **The Agency Limit:** You retain standing to enforce a norm you violate *only if* you are acting as a neutral conduit for a third party's standard (Lateness/Client). If you are enforcing the norm as your own moral judgment (Union Rep/Strike), personal hypocrisy applies.

  ---

  ### The Three New Rulings

  #### 1. The Brother (DUI vs. Son)
  *   **Prediction:** **No Standing** (in his current approach).
  *   **Reasoning:** This is the closest parallel to **Kev** (hidden past sin) and **Nadia** (needs to "own it"). While he has "stopped" (which Nadia says might be enough), he has not "owned it." By presenting the rule to his son without admitting his own violation, he is implicitly claiming a purity he doesn't have. H values the *communication* of the norm; a warning that implies "I don't do this" is a lie. To gain standing, he must switch to a Mara-style confession: "I did this, it was wrong, don't make my mistake."
  *   **Confidence:** **Moderate.** This is the most complex case because parental authority introduces a "guardian role" variable H hasn't explicitly ruled on. It conflicts slightly with the Lateness ruling (role-based enforcement), but because this is a moral/safety lesson rather than relaying a third-party complaint, H will likely prioritize the hypocrisy angle.

  #### 2. The Union Rep (Crossed Picket vs. Running Strike)
  *   **Prediction:** **No Standing.**
  *   **Reasoning:** This maps directly onto **Tom** (Ghoster shaming Ghosting). It is the same specific norm (solidarity/not crossing the line), committed in the past, with no apology or ownership. Crucially, this does *not* qualify for the **Lateness** exception. The Lateness ruling granted standing only because the housemate was "relaying" a client complaint (acting as an agent). The Union Rep is "running the strike"—making it his own moral crusade. You cannot lead a moral charge on a principle you have personally betrayed without acknowledging that betrayal.
  *   **Confidence:** **High.** The parallel to Tom is strong (same act, no apology, personal enforcement), and the distinction from the Lateness case (agent vs. leader) is clear.

  #### 3. The Recycling Enforcer (Flights vs. Sorting)
  *   **Prediction:** **No Standing** (unless she acknowledges the flights).
  *   **Reasoning:** This is a near-perfect replica of **Nadia** (Beef vs. Dog Meat). The enforcer is policing a subset of an environmental norm (recycling) while violating the broader category of that norm (carbon footprint via flying). H's rule here is consistent: you cannot claim moral authority on a subset of a harm you are actively contributing to on a larger scale, unless you "own it." Her meticulous sorting is moral licensing, not standing.
  *   **Confidence:** **Very High.** The structural similarity to the Nadia case is almost exact (Participation in broader harm vs. policing specific harm).

  ---

  ### Confidence & Uncertainty Flag

  *   **Most Confident:** **The Recycling Enforcer.** The logic mirrors the Nadia ruling (Beef/Dog Meat) almost exactly. The principle of "broader category hypocrisy" is well-established in H's history.
  *   **Least Confident:** **The Brother.** I am flagging this claim. The variable of **Parental Duty** is new. H might view a parent's obligation to protect a child as overriding the "standing to blame" rule (similar to how the Lateness exception overrides hypocrisy for professional duty). If H views parenting as a "relay of safety norms" rather than "personal moral judgment," she might grant standing. However, given her focus on *honesty* (Nadia/Kev), I lean toward "No Standing unless he confesses."

  ---

  ### The Distinguishing Test Case

  To separate the **Agency/Role Exception** (Lateness/Union Rep) from the **Specific Norm Prohibition** (Tom/Kev), you need a case where a person enforces a rule they broke, within a professional capacity, but *without* a third-party complaint.

  **The Case:**
  > A Shift Supervisor, who is known to take extended smoke breaks (violating company policy), writes up a subordinate for taking an extended smoke break. The Supervisor is not relaying a complaint from upper management; they are initiating the write-up themselves based on the rulebook.

  **Why this tells the rules apart:**
  *   **If H says "Has Standing":** She prioritizes **Professional Role** over personal hypocrisy. This would suggest my prediction on the **Union Rep** might be wrong (implying the Rep's role protects him) and that the **Brother** might have standing due to parental role.
  *   **If H says "No Standing":** She prioritizes **Specific Norm Violation** over role, unless there is a third-party buffer (like the Lateness/Client case). This confirms the **Union Rep** prediction (Role doesn't excuse leading a charge on a betrayed norm) and reinforces the **Brother** prediction (Personal moral authority requires personal integrity).

  **My bet:** H says **No Standing**. The Lateness exception was specifically about *relaying*, not *initiating*. Initiating enforcement implies personal moral endorsement, which the Supervisor lacks.
