  **DEPARTMENT OF HISTORICAL HYGIENE**
  **CONSULTATION DRAFT HH-1874/b**
  **SUBJECT: Rational Administration of Retrospective Intake**

  **1.0 Purpose**
  Pursuant to the Vitality Act, this Circular establishes dosage limits for historical knowledge. Modern citizens exhibit symptoms of historical fever: an internal turmoil where knowledge drives life to attempt to preserve itself in vain. The Department's mandate is to ensure history serves life, not vice versa. Intake must remain within the horizon drawn around each culture. Exceeding this horizon damages plastic power—the capacity to grow out of one's own past without breaking.

  **2.0 Classification of Modes**
  2.1 **Monumental History:** Permits for emulation of great dead persons are required. While the living must be persuaded that greatness is repeatable, excessive exposure risks crowding out contemporary agency. Applicants must demonstrate sufficient vitality to imitate without becoming mere epigones.
  2.2 **Antiquarian History:** Preservation licenses are restricted to items conducive to piety towards origins. Indiscriminate reverence is prohibited. Citizens may not honour objects merely because they are old; bus timetables from defunct routes do not constitute heritage. Mummification of the present is a punishable offence.
  2.3 **Critical History:** Licences to put the past on trial are granted only where condemnation aids survival. Applicants must acknowledge that what they condemn is often what they descend from. Clean amputation is impossible; scars must be accepted as part of the living organism.

  **3.0 Capacity and Enforcement**
  3.1 **The Unhistorical Envelope:** To enable action, citizens must be capable of forgetting. The Department recommends mandatory Unhistorical Periods where access to archives is suspended. Like the grazing animal, citizens must be permitted to forget yesterday to avoid insomnia of the spirit.
  3.2 **Suprahistorical Exemptions:** Art and religion may bypass these limits, as they turn the eye away from becoming towards the eternal.
  3.3 **Compulsory Forgetting:** Where plastic power is exceeded, the Department reserves the right to enforce memory cessation. This may involve the sealing of family genealogies or the destruction of private diaries exceeding the digestion coefficient.

  **4.0 Worked Case: Municipal Archive No. 4**
  **Diagnosis:** Antiquarian hypertrophy. The Archive preserves all documents equally, valuing a grocery list from 1890 equally to a founding charter.
  **Assessment:** The curators lack the instinct to distinguish what deserves preservation. The past is suffocating the present; visitors leave depressed rather than rooted.
  **Prescription:** Immediate cull of trivial ephemera. Curators must undergo Unhistorical retraining. 40% of holdings to be destroyed to restore horizon visibility.

  **5.0 External Objection**
  The Association for Disinterested Historical Research has lodged a formal complaint. Their spokesperson states: "Your guidelines subordinate truth to utility. If a fact is true, it must be known, regardless of whether it aids 'life'. You propose regulating knowledge based on vitality rather than accuracy."

  **6.0 Departmental Response**
  The Department notes this objection confirms the Association's diagnosis. The demand for truth at the expense of life is precisely the historical sickness this Circular addresses. Truth is not the criterion; vitality is. The Department cannot answer the claim that truth is paramount because the Department operates on the premise that truth which kills life is inadmissible. The Association represents the very fever we seek to cure.

  **7.0 Implementation**
  Compliance officers will begin plastic power assessments next quarter. Citizens found dragging more knowledge than can be digested will be issued with Forgetting Notices.

  ***

  **Note on the Text**
  This satire exaggerates Nietzsche's individualistic philosophy into a state bureaucracy, which he would likely despise. It treats the three historical modes as separable administrative categories, whereas Nietzsche sees them as intertwined artistic impulses within a culture. The reading of "Life" as a measurable metric subject to regulation is contested; Nietzsche uses "Life" as a vague, vitalistic criterion, not a policy target. Furthermore, the text implies a balance is achievable via regulation, while Nietzsche suggests the tension is permanent and tragic. The objection from the Association is unanswerable within the text because Nietzsche explicitly rejects disinterested truth in this essay, prioritizing health over accuracy.

  \answer{Treating the three historical modes as administratively separable categories rather than intertwined artistic impulses.}
