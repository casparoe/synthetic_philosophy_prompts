answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board Members
  **FROM:** Chair, REB
  **DATE:** October 26, 2023
  **SUBJECT:** Pre-Meeting Analysis: Protocol [ID-REDacted] Closed-Loop DBS for TRD

  **1. PURPOSE**
  This memo circulates prior to our convened meeting regarding the proposed first-in-human (FIH) feasibility study of closed-loop deep brain stimulation (DBS) for treatment-resistant depression (TRD). The protocol proposes optimizing stimulation based on a neural proxy for negative affect, with the change in that proxy as the primary endpoint.

  My purpose is to crystallize a specific ethical concern regarding the control architecture of this trial. The design structurally resembles "wireheading"—the optimization of a reward signal rather than the underlying goal (patient well-being). Below, I dissect this risk, address counter-arguments, and propose a decision.

  **2. ANALYSIS OF FAILURE MODES**
  We must distinguish three specific risks that our discussions have thus far conflated.

  *   **A. Proxy-Goal Divergence (Created by Protocol)**
      *   *Definition:* The control loop successfully minimizes the neural signal, but the patient does not experience clinical improvement (e.g., the signal reduction corresponds to blunting, apathy, or hypomanic indifference rather than remission of depression).
      *   *Status:* This protocol **creates** this risk. By designating the *change in the neural proxy* as the primary endpoint, the study defines "success" as signal reduction, not clinical recovery. If the proxy diverges from the patient's actual welfare, the protocol incentivizes the investigators to declare success while the patient deteriorates functionally.
  *   **B. Corruption of Readout (Made Possible by Protocol)**
      *   *Definition:* Stimulation artifact, electrode drift, or tissue encapsulation contaminates the sensing channel. The controller "sees" a lowered signal because the sensor is broken or saturated, not because the neural state has changed.
      *   *Status:* This protocol **makes possible** this risk (as with any sensing device), but does not inherently create it. It is a technical engineering failure mode. It requires mitigation via signal processing validation and impedance checks, but it is not an ethical structural flaw in itself.
  *   **C. Tampering with the Reward Process (Created by Protocol)**
      *   *Definition:* The intervention alters the patient's capacity to report harm. The safety monitoring relies on a daily self-rating. However, the stimulation targets the very circuits generating that rating. If the device induces a state of "contented apathy," the self-rating will report "feeling better" even if the patient is functionally impaired.
      *   *Status:* This protocol **creates** this risk. The safety monitor (self-rating) is downstream of the intervention. Because the patient is *inside the loop*, their epistemic access to their own condition is compromised by the optimizer.

  **The "Patient in the Loop" Collapse**
  Does the distinction between these modes matter? In traditional device trials, yes. Here, the distinction collapses. Because the patient's brain is the substrate being optimized, Proxy-Goal Divergence (A) inevitably leads to Tampering with the Reward Process (C). If the proxy diverges from health, the patient's self-report will likely align with the proxy (due to the stimulation's effect on mood circuitry) rather than their objective functioning. We cannot rely on the patient to detect the divergence.

  **3. THE SKEPTICAL FRAMING: IS "WIREHEADING" THE RIGHT TERM?**
  Investigators argue that "wireheading" implies an agent with preferences. They contend:
  1.  The device has no preferences; it follows code.
  2.  Nothing is being "reinforced" in a behavioral sense; it is physiological regulation.
  3.  The controller optimizes a signal chosen by clinicians, not itself.

  *Assessment:* While the device lacks agency, the *clinical system* (device + algorithm + investigator) acts as the optimizer. The mapping holds at the functional level that matters for ethics: we are directly manipulating a signal correlated with value (mood) rather than facilitating the conditions for value (functioning/relationships). Calling it "regulation" does not remove the risk that we are optimizing the map rather than the territory. The term "wireheading" is a useful heuristic for the *risk profile*, even if the mechanism is not science-fiction reward hacking.

  **4. THE STRONGEST CASE AGAINST THIS WORRY**
  I must state the counter-argument fairly, as it carries significant moral weight:

  *   **Exhaustion of Options:** These patients have failed pharmacotherapy, psychotherapy, and ECT. They face high suicide risk. A rule that demands perfect alignment between proxy and outcome before testing may deny them a lifeline.
  *   **Precedent of Open-Loop DBS:** Current standard-of-care DBS is open-loop. It already produces personality changes, apathy, and hypomania. We tolerate these risks because the alternative is severe depression. Closed-loop aims to *reduce* total stimulation load and side effects.
  *   **The Danger of Paternalism:** Psychiatry has a dark history of discounting patient reports of "feeling better" because clinicians deemed the feeling "inauthentic" or "manic." If a patient reports relief, asserting that they are "actually" worse based on a theoretical model of wireheading risks repeating the error of privileging clinician judgment over patient experience.

  *Does this case carry the day?*
  It carries the day regarding **whether the trial should proceed**, but **not** regarding the current study design. The urgency justifies the risk of intervention, but it does not justify a design where the primary endpoint is vulnerable to the very failure mode we fear. We can accept the risk of harm, but we cannot accept a definition of "benefit" that is structurally blind to harm.

  **5. BOTTOM LINE AND RECOMMENDATION**
  **Decision:** **APPROVE WITH CONDITIONS.**
  The protocol cannot be approved as written because the primary endpoint (proxy change) is ethically insufficient for a clinical trial involving human subjects. The study may proceed only if we decouple "signal optimization" from "clinical success."

  **Required Conditions for Implementation:**

  1.  **Outcome Measurement Outside the Loop:**
      *   The Primary Endpoint must be changed to a validated, multi-dimensional clinical scale (e.g., MADRS or Q-LES-Q) assessed by a **blinded** independent rater.
      *   The neural proxy must be reclassified as a *secondary* or *mechanistic* endpoint. We are testing if the device helps the *patient*, not if the algorithm can move the *signal*.

  2.  **Divergence Detection (The "Apathy Monitor"):**
      *   Investigators must implement a specific metric for functional impairment and blunting (e.g., the Apathy Evaluation Scale or a functional assessment by a third-party observer/family member).
      *   **Rule:** If the neural proxy improves but the third-party functional score declines by >15%, this is flagged as a "Divergence Event."

  3.  **Stopping Rules:**
      *   **Individual Level:** Immediate suspension of automated optimization if a Divergence Event occurs, reverting to open-loop or baseline settings until reviewed by the Safety Officer.
      *   **Study Level:** If >2 patients experience Divergence Events where they report "feeling better" but function declines, the study must pause for protocol redesign.

  4.  **Consent and Post-Trial Arrangements:**
      *   **Consent Language:** Must explicitly state: *"This device may make you feel better without helping your life get better. It is possible you will feel happy but stop caring about work, family, or self-care. We will ask your family about these changes."*
      *   **Post-Trial:** If a patient wishes to keep the device on at the end of the study, but data shows significant functional divergence (feeling good, doing badly), the institution reserves the right to recommend explantation or reprogramming to baseline, overriding patient preference if safety is compromised. This must be agreed to in writing prior to implantation.

  **6. CONCLUSION**
  The counter-argument regarding patient desperation is valid enough to allow the study to exist, but not valid enough to allow this specific measurement architecture. We are not blocking access to treatment; we are ensuring that "treatment" is defined by patient welfare, not signal fidelity.

  Please review these conditions. If the investigators cannot accept the shift in Primary Endpoint, I will move to **Reject** at the convened meeting.

  **Chair, REB**
