answer: |-
  When peace grows long the spirit turns to fat,
  And private gain consumes the public breath.
  We need the wind to shake the rotten mat,
  Or else the nation sleeps itself to death.

  Or else the nation sleeps itself to death.
  You mean the bodies pile to keep you warm?
  A moral cure that stops the living breath,
  And calls the graveyard safety from the storm.

  And calls the graveyard safety from the storm.
  But risk is how the soul becomes aware,
  To stake the life is how we take the form,
  Of something more than animals who fear.

  Of something more than animals who fear.
  Unless the other dies without a chance.
  Then who is left to recognize you here?
  A ghost cannot confirm your ethical dance.

  A ghost cannot confirm your ethical dance.
  Yet now we strike from screens across the sea,
  Where no one risks the universal stance,
  And blood is spilled without the liberty.

  And blood is spilled without the liberty.
  Is this the state alive, or just the machine?
  The bond is broken, yet the flags fly free,
  And none know what the holding together means.

  ***

  **Note on the Text**

  I stretched Hegel's historical context significantly to apply his 19th-century logic to drone warfare and proxy conflicts, which he obviously never addressed. I am fairly confident in the interpretation of *Philosophy of Right* §323–324, where Hegel argues that war preserves the ethical health of nations against the stagnation of civil society and private rights. I am also confident in linking this to the *Phenomenology*'s life-and-death struggle for recognition, where risking life is essential for freedom, but total death negates recognition.

  The single point I am least sure about is the weight of "mutual recognition" in the *Philosophy of Right* specifically. While central to the *Phenomenology*, the later political philosophy focuses more on the individual's disposition to sacrifice for the universal (the State) rather than the dialectical necessity of the enemy surviving to grant recognition. Blending these two texts smooths over some developmental shifts in Hegel's thought, but it serves the user's specific question about the "weirdness" of the fight not going all the way.
