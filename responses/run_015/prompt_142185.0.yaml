prompt: |-
  So I've been reading Hegel's Philosophy of Right on my own — no class, no backround, just me and a paperback — and I keep comming back to the part near the end where he talks about war between states. The claim as I understand it: a long peace is actually bad for a country, because everyone turns inward, gets comfortable, chases their own private stuff, and the shared ethical life of the nation goes stale. War is the thing that makes people risk life and property for the whole, and that's somehow supposed to keep a people morally alive. I think he's going after Kant's perpetual peace / federation-of-states idea when he says it, and it connects to that earlier bit in the Phenomenology where being willing to stake your life is what makes you more than an animal, except if somebody actually dies then nobody gets recognized at all, so the fight can't go all the way. That last part is what I find weirdest.

  Can you write me a poem about it? Around 24 lines, six four-line stanzas, where each stanza opens with the last line of the one before, so a single sentence keeps getting dragged along and said again with more behind it — a body, then a sacrifice, then the thing that holds a people together. Two voices should take turns: one that thinks he's onto something real about how a country holds itself together, one that hears it as a fancy way of saying the dead are useful.

  And please work in the thing I can't stop chewing on: what does his argument even do with a country that fights by drone and by proxy, where almost nobody back home risks anything and the dying runs only one way? Does the argument just break there, or does it end up saying something worse about that country? Don't resolve it.

  Start with the poem itself, no preface. Then a short note: where you stretched or fudged the ideas, how confident you are you've got Hegel right, and the single point you're least sure about.
