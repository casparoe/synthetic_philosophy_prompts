prompt: |-
  hey — i'm a compliance officer for a development NGO and every quarter i have to sign off on about 20 grant reports that claim things like "the village's Confucian work ethic caused repayment rates to jump" or "local animist values caused the irrigation failure." i need a reusable 15-minute procedre i can apply to any report to decide whether culture or values are actually doing causal work, or if it's just Weber-style post-hoc rationalization. ground it in Weber's Protestant ethic idea and the philosophical problem of explaining with values — can values be real causes, or do they only describe how people talk about economic and material pressures?

  the deliverable should be a step-by-step checklist or flowchart in words, with specific tests run in order: maybe a counterfactual culture-substitution check, a mechanism-identification screen, a rationalization-detection filter, and a sign-off gate. flag exactly where my own judgment can't be replaced by a box-check — especially when culture and economic incentives are totally entangled. include three worked cases: one clear yes (culture genuinely drives behavior independent of incentives), one clear no (values invented after failure to save face), and one that hurts — where the staff really want culture to be the cause but the procedre says it's not (maybe the irrigation collapse was drought, not "animist resistance"). also be explicit about what the procedure can never settle.

  constraints: i'm not a philosopher, i have 15 minutes, and my signature either validates or kills the causal claim. no bibliographies, no citations, no reading lists — i can't check them without web access.

  please finish with a one-line summary of the procedure's biggest blind spot, alone on the last line.
