answer: |-
  # The Weberian Causal Gate: A 15-Minute Compliance Protocol

  **Purpose:** To distinguish between values as *causal drivers* (Weber's "spirit") versus values as *post-hoc rationalizations* for material conditions.
  **Time Limit:** 15 Minutes per report.
  **Decision:** Sign-off (Claim Validated) or Reject (Claim Unsubstantiated).

  ---

  ### Phase 1: The Four-Step Diagnostic (10 Minutes)

  Run these tests in order. If any test fails decisively, reject the claim. If all pass, proceed to Phase 2.

  **1. Temporal Priority Check**
  *   **Question:** Is there evidence the specific value/belief was cited or active *before* the outcome occurred?
  *   **Pass:** Field notes, meeting minutes, or baseline surveys reference the value prior to the event (e.g., "Community cited honor code before loans were distributed").
  *   **Fail:** The value is only mentioned in the final report explaining the result (e.g., "Repayment was high because of honor" appears only in the conclusion).
  *   **Action:** If Fail, reject immediately. This is post-hoc rationalization.

  **2. The Material Counterfactual**
  *   **Question:** If you remove the cultural value but keep the economic incentives identical, would a rational actor still behave this way?
  *   **Pass:** No. The behavior is economically "irrational" without the value (e.g., repaying a loan with no legal enforcement and high personal cost).
  *   **Fail:** Yes. The behavior aligns perfectly with standard profit/loss maximization (e.g., repaying a loan to access future credit).
  *   **Action:** If Fail, the cause is incentives, not culture. Reject the cultural claim.

  **3. The Convenience Filter**
  *   **Question:** Does attributing this outcome to culture absolve the NGO of responsibility or error?
  *   **Pass:** No. The cultural explanation adds complexity or admits NGO limitations.
  *   **Fail:** Yes. "Culture" is used to explain away failure (e.g., "Irrigation failed because animists resist pipes" vs. "We engineered pipes for the wrong soil").
  *   **Action:** If Fail, flag as high-risk rationalization. Proceed to Phase 2 only with senior review.

  **4. Mechanism Specificity**
  *   **Question:** Does the report explain *how* the value translates to physical action?
  *   **Pass:** Specific pathway identified (e.g., "Weekly confessionals create peer pressure that enforces repayment").
  *   **Fail:** Vague essence (e.g., "The Confucian spirit encouraged hard work").
  *   **Action:** If Fail, reject. "Spirit" is not a mechanism.

  ---

  ### Phase 2: The Entanglement Zone (3 Minutes)

  **STOP CHECKING BOXES.** This is where your judgment replaces the procedure.

  Weber argued that values and materials are often woven together ("elective affinity"). You cannot fully separate them. You must decide if the value is the *switch* or just the *wiring*.

  *   **The Judgment Call:** Look at the reports where incentives and values align (e.g., hard work leads to profit, and culture values hard work).
  *   **Ask Yourself:** Is the culture amplifying the incentive, or merely describing it?
  *   **Rule of Thumb:** If the behavior disappears when the community is removed from the material context (e.g., migrants stop the practice), it is likely context-dependent, not value-driven. If the behavior persists across contexts, it is likely value-driven.
  *   **Decision:** If you cannot distinguish amplification from description, **reject the causal claim**. Mark it as "Correlational Only."

  ---

  ### Phase 3: Sign-Off Gate (2 Minutes)

  *   **Sign:** All Phase 1 tests passed AND Phase 2 judgment confirms values acted as an independent switch.
  *   **Reject:** Any Phase 1 failure OR Phase 2 uncertainty.
  *   **Comment Requirement:** If rejecting, you must specify which test failed (e.g., "Claim rejected: Material Counterfactual failed—repayment aligns with credit access incentives").

  ---

  ### Worked Cases

  **Case 1: Clear Yes (Culture as Cause)**
  *   **Claim:** "Repayment rates are 99% because borrowers swear oaths on family ancestors; legal enforcement is zero."
  *   **Test 1 (Temporal):** Baseline surveys show oath-taking is a pre-existing condition for borrowing. (Pass)
  *   **Test 2 (Counterfactual):** Economically, defaulting is rational (no legal penalty). Only the oath stops it. (Pass)
  *   **Test 3 (Convenience):** Doesn't absolve NGO; requires them to maintain ritual integrity. (Pass)
  *   **Test 4 (Mechanism):** Fear of spiritual shame drives payment. (Pass)
  *   **Verdict:** **SIGN.** The value overrides material incentive.

  **Case 2: Clear No (Values as Veneer)**
  *   **Claim:** "Project failed because local fatalism prevented maintenance."
  *   **Test 1 (Temporal):** No mentions of fatalism in initial community meetings. (Fail)
  *   **Test 3 (Convenience):** Blaming fatalism hides that the NGO didn't train locals on maintenance. (Fail)
  *   **Verdict:** **REJECT.** This is face-saving rationalization.

  **Case 3: The Painful No (Material Reality vs. Cultural Narrative)**
  *   **Claim:** "Irrigation collapse caused by animist resistance to disturbing soil spirits." (Staff want this to be true to honor local agency).
  *   **Test 1 (Temporal):** Elders did mention spirits, but also complained about water pressure. (Pass)
  *   **Test 2 (Counterfactual):** Engineering reports show pipe pressure was 40% below requirement due to drought. Any group would fail. (Fail)
  *   **Test 3 (Convenience):** Blaming spirits absolves the NGO of poor hydrological surveying. (Fail)
  *   **Verdict:** **REJECT.** Even if staff feel this validates local worldview, the causal weight lies with drought and engineering. To sign is to validate a falsehood that harms future planning.

  ---

  ### What This Procedure Cannot Settle

  1.  **Deep Hermeneutics:** You cannot verify if the "value" reported is what the locals actually feel or what they think you want to hear.
  2.  **Long-Term Cultural Shift:** You can measure immediate behavior, but not if the NGO intervention is permanently altering the value system itself.
  3.  **The Observer's Bias:** You cannot fully remove your own Western bureaucratic lens when judging what counts as "rational" incentives.

  You cannot verify if your own rationality is just another unexamined cultural value.
