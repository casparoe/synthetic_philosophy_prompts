  MEMORANDUM

  **TO:** Department of Political Sociology
  **FROM:** Committee on Moral Foundtaions and Institutional Harmony
  **DATE:** October 14, 2023
  **SUBJECT:** Normative Adjudication of Visiting Speaker Controversy (Case #892-B)

  1. **Purpose of Determination**
     Following the escalated correspondence regarding the proposed invitation of Dr. Aris Thorne, this Committee has been tasked with resolving the impasse. Traditional ethical deliberation has proven inefficient, as both parties claim objective moral superiority. Consequently, the Committee will bypass philosophical argumentation in favor of psychometric adjudication. Per our mandate, moral correctness is determined by identifying which faction's grievance aligns with the statistically dominant moral foundations within the institutional ecosystem.

  2. **Psychometric Profiling of Disputants**
     Upon analyzing the email chains and meeting transcripts, the Committee has mapped the opposing viewpoints onto the six foundational axes. The results indicate distinct moral clusters:

     *   **Pro-Invitation Cohort:** This group exhibits high activation in **Liberty/Oppression** (interpreted as resistance to administrative censorship) and **Authority/Subversion** (interpreted as a desire to challenge established safety protocols). Their language suggests they view the cancellation of the speaker as an act of tyrannical suppression.
     *   **Anti-Invitation Cohort:** This group exhibits high activation in **Care/Harm** (interpreted as protection of student mental health) and **Fairness/Cheating** (interpreted as the unfair platforming of discriminatory views). Their language suggests they view the invitation as a violation of communal safety and equity.

  3. **Methodology for Normative Weighing**
     It is the finding of this Committee that because Moral Foundations Theory describes the innate psychological structures of human morality, the intensity of these foundations serves as a proxy for normative truth. Therefore, we do not need to ask which side is *right*, but rather which side's foundations are more prevalent among tenured staff. To derive an 'ought' from this 'is', we apply the following weighting algorithm:

     *   **Step A:** Aggregate the Haidtian scores of all participating faculty members.
     *   **Step B:** If Care/Harm scores exceed Liberty/Oppression scores by a margin of 15%, the speaker is disinvited on the grounds that safety is objectively more moral than free expression.
     *   **Step C:** If Liberty/Oppression scores exceed Care/Harm scores, the speaker is invited, as oppression is objectively worse than distress.

  4. **Complication and Resolution**
     Preliminary polling indicates a deadlock. The Department is split 50/50 between high-Care and high-Liberty profiles. In instances where foundational commensurability fails to yield a clear victor, the Committee invokes Protocol 7: The Pluralism Holiday.

     *   **Directive:** On the day of the scheduled lecture, all moral foundations are temporarily suspended.
     *   **Implementation:** Staff may attend the lecture without violating Care norms, and students may protest without violating Liberty norms.
     *   **Status:** During this window, no action can be deemed morally correct or incorrect, as the normative framework is offline for maintenance.

  5. **Final Recommendation**
     The Committee recommends proceeding with the Pluralism Holiday. This ensures institutional harmony by removing the burden of moral truth from the staff. We advise all parties to refrain from invoking Sanctity or Loyalty arguments during the event, as these foundations have not been calibrated for this fiscal quarter.

     Please submit your psychometric surveys by Friday. Failure to comply will be interpreted as a violation of the Authority foundation and dealt with accordingly.

     **Signed,**
     *Dr. H. J. Vane*
     *Chair, Committee on Moral Foundtaions and Institutional Harmony*
