answer: |-
  **PHI 350: Philosophy of Logic – Final Examination**

  **Question 4 (45 Minutes)**

  In Lewis Carroll's dialogue *What the Tortoise Said to Achilles*, Achilles attempts to force the Tortoise to accept a conclusion by adding logical rules as additional premises. Consider the following formulation, termed the **License Regress Thesis (LRT)**:

  > *LRT: Every valid inference requires an explicit license that is not one of the original premises, and that license itself requires justification by a further license, ad infinitum.*

  Write an essay evaluating whether the LRT accurately captures the philosophical problem raised by Carroll, or whether it misdiagnoses the nature of logical deduction. In your answer, you must address the following:

  1.  Does the LRT treat logical rules as empirical claims requiring evidential support, and if so, why is this problematic?
  2.  Distinguish between the epistemic circularity implied by the LRT and the logical circularity Carroll depicts.
  3.  Explain whether the infinite regress generated by the LRT proves deduction is impossible, or merely reveals a category mistake.
  4.  Pinpoint exactly where the regress stops (if anywhere) without appealing vaguely to 'common knowledge' or 'intuition.'

  ***

  **Model Answer**

  The License Regress Thesis (LRT) offers a compelling description of the surface structure of Carroll's dialogue, but it ultimately misdiagnoses the underlying philosophical problem. While Carroll demonstrates that adding rules as premises generates an infinite regress, the LRT errs by assuming this regress arises because licenses *need* justification. In reality, the regress arises because the LRT conflates the *application* of a rule with the *citation* of a rule.

  Carroll's Tortoise refuses to accept the conclusion (Z) even after accepting premises (A) and (B) and the hypothetical rule (C). Achilles responds by adding (C) as a premise, then (D) when the Tortoise demands a rule connecting (A), (B), and (C) to (Z). The LRT interprets this as a demand for evidential support: every license needs a further license. However, this treats logical rules as if they were empirical claims or additional propositions within the argument. If rules are treated as premises, they lose their normative force. A premise describes a state of affairs; a rule dictates how to move between states of affairs. By demanding a license for every inference, the LRT propositionalizes logic, turning operators into operands.

  This leads to a crucial distinction between epistemic and logical circularity. The LRT implies an epistemic regress: I cannot be justified in believing the conclusion unless I am justified in believing the license, and so on. This suggests deduction is impossible because we cannot complete an infinite chain of justifications. Carroll's point is sharper: it is a logical category mistake. The Tortoise isn't asking for evidence; he is refusing to *perform* the inference. The regress does not prove deduction is impossible; it proves that inference cannot be fully codified into a static list of premises. Validity is not a property of a set of propositions, but of the movement between them. If every move requires a written rule to authorize it, no move can ever begin.

  Therefore, the LRT misdiagnoses the problem by assuming the regress is vicious. It is only vicious if one believes logical competence requires explicit awareness of every governing rule. The regress stops not at a final premise, but at a practice. We do not infer based on a license to infer; we infer because we are trained in a practice of rule-following. The stopping point is the agent's native capacity to recognize validity—a brute fact of rational agency. To ask for a license for this capacity is to ask for a rule on how to follow rules, which returns us to the start.

  Consequently, the LRT fails because it demands that logical competence be explicit. Carroll shows that logical rules are not items *in* the argument but conditions *of* the argument. The regress ends where justification gives way to ability. We stop adding licenses when we stop treating logic as a body of knowledge to be cited and recognize it as a skill to be exercised. The LRT treats deduction as a chain of beliefs needing support; Carroll shows it is a activity needing participation. Accepting this dissolves the threat of the regress: deduction is not unjustified, it is groundless in the sense that it requires no external foundation other than the practice of reasoning itself.

  ***

  **Marking Scheme**

  **Total Points: 100**

  **1. Distinction Between Applying and Citing (25 points)**
  *   **A (21-25):** Clearly distinguishes between using a rule to infer (applying) and stating the rule as a premise (citing). Explains that Carroll's paradox arises from treating the former as the latter.
  *   **B (16-20):** Identifies that rules are different from premises but fails to explain why converting rules to premises stops inference from working.
  *   **C (10-15):** Summarizes the dialogue without distinguishing rule types.

  **2. Critique of LRT (Justification vs. Inference) (25 points)**
  *   **A (21-25):** Argues that LRT misdiagnoses the problem by treating logical rules as empirical claims requiring evidential support. Identifies that LRT conflates justification of inference with justification of belief.
  *   **B (16-20):** Accepts LRT as a valid summary of Carroll's point without critiquing its underlying assumptions about justification. Treats LRT and Carroll's argument as identical.
  *   **C (10-15):** Discusses LRT but confuses it with standard skepticism.

  **3. Regress Implications (Impossible vs. Category Mistake) (25 points)**
  *   **A (21-25):** Explains that the regress does not prove deduction is impossible, but reveals a category mistake regarding what logical validity is.
  *   **B (16-20):** Argues the regress is problematic but doesn't clarify why it doesn't destroy logic entirely.
  *   **C (10-15):** Claims deduction is impossible or circular based on the regress.

  **4. The Stopping Point (25 points)**
  *   **A (21-25):** Pinpoints the stopping point as practice, ability, or rule-following capacity. Explicitly avoids vague appeals to 'common knowledge' or 'intuition.'
  *   **B (16-20):** Identifies a stopping point but relies on vague terms like 'intuition' or 'axioms' without explaining why the regress doesn't restart there.
  *   **C (10-15):** Fails to identify where the regress stops.

  **Grade Differentiation Note:**
  *   **A Grade:** Must achieve 'A' criteria on point #2. The student must recognize that LRT is a *misdiagnosis*, not just a restatement of Carroll. They must see that LRT assumes rules need evidence, whereas Carroll shows rules need acceptance/application.
  *   **B Grade:** Typically understands Carroll well (Point #1) but treats LRT as merely another name for the Tortoise's argument (fails Point #2). They see the regress but miss the specific error in the LRT formulation regarding evidential support.
