      *   *The "Work" the Self Does:*
          *   **Internal:** It organizes memory, plans future actions, and creates coherence. It's a control system heuristic.
          *   **External:** It allows others to predict us. It facilitates social contracts (responsibility, promise-keeping).
      *   *Analogy:* Software. Is software "real"? It runs on hardware. But you can't explain a bug by looking only at electron flow; you need the code level. The CoNG is the "user interface" of the brain.
