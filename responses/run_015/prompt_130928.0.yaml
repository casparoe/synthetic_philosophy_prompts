      *   *Authorship:* It's not about who *speaks* the story, but which story is *installed* in the control system.
      *   *The Trap:* If we say "only the story I endorse counts," do we bring back a homunculus (the "Endorser")?
      *   *Solution:* The endorsement is just another part of the narrative process, not a separate agent. It's a distributed process. The "self" is the whole loop, not the narrator inside the loop.

