answer: |-
  Here is the plan. I've run variations of this with first-years and grad students; the mechanics are stable, but the debrief is where the philosophy lives.

  ### Part 1: Brainstorming & Selection

  **Concept 1: The Human Relay.**
  Students stand in a line; Student A sees the first Nymic word, whispers a guess to B, who sees the second word, etc. The last student writes the English sentence.
  *Reject:* Too much noise. By the time the sentence reaches the end, the "error propagation" is about group dynamics and whispering volume, not translation constraints. It becomes a game of Telephone, not a simulation of statistical MT.

  **Concept 2: The Black Box Dictionary.**
  Students get a lookup table. They are forbidden from combining words; they can only output phrases that exist in the table.
  *Reject:* Too rigid. Students will rebel against the "stupid rule" immediately. It demonstrates the constraint but doesn't let them *feel* the temptation to generalize, which is where the fluency trap lives.

  **Concept 3: The Windowed Translator (Selected).**
  Students work in pairs. They receive Nymic sentences physically masked by a cardboard slider that reveals only three words at a time. They must translate based on the visible window + a provided Corpus. Phase 2 removes the mask but keeps the scoring metric.
  *Commit:* This creates a tangible phenomenology of "locality." The mask forces them to experience the cognitive bottleneck of an n-gram model. It allows for a clean transition to Phase 2 where the bottleneck is removed, but the *habit* of shallow processing remains.

  ---

  ### Part 2: The Activity Design

  #### The Language: Nymic
  Nymic is designed to look learnable but contains specific ambiguity traps.
  **Grammar:** Subject - Verb - Object. Adjectives precede Nouns.
  **Vocabulary:**
  *   *Kip* = Man / Person
  *   *Luma* = Woman
  *   *Vex* = Go / Move / Walk
  *   *Sol* = Sun / Day / Time
  *   *Nix* = Not / No
  *   *Tala* = Speak / Say
  *   *Omi* = Eat / Consume / Take
  *   *Ruk* = House / Home / Property
  *   *Zeb* = Fast / Quick
  *   *Plin* = Water / Liquid
  *   *Dax* = Big / Great
  *   *Min* = Small / Little

  #### The Corpus (Handout A)
  *Give this to students 10 minutes before the activity starts or at the very beginning. Tell them: "This is your training data. Memorize the patterns."*

  1.  Kip Vex Ruk. (The man goes home.)
  2.  Luma Vex Ruk. (The woman goes home.)
  3.  Kip Omi Plin. (The man drinks water.)
  4.  Luma Omi Plin. (The woman drinks water.)
  5.  Sol Zeb Vex. (The day passes quickly.)
  6.  Sol Nix Vex. (The sun does not move.)
  7.  Kip Tala Nix. (The man says no.)
  8.  Luma Tala Nix. (The woman says no.)
  9.  Dax Ruk Vex. (The big house moves.) [Idiom: Moving day]
  10. Min Ruk Vex. (The small house moves.) [Idiom: Moving day]
  11. Kip Omi Ruk. (The man takes the house.) [Idiom: Inherits property]
  12. Luma Omi Ruk. (The woman takes the house.) [Idiom: Inherits property]
  13. Plin Nix Vex. (Water does not move.) [Stagnant water]
  14. Zeb Kip Vex. (The fast man runs.)
  15. Zeb Luma Vex. (The fast woman runs.)
  16. Kip Nix Tala. (The man is silent.)
  17. Luma Nix Tala. (The woman is silent.)
  18. Sol Omi Plin. (The sun drinks water.) [Metaphor: Evaporation/Drought]
  19. Ruk Nix Vex. (The house does not move.)
  20. Kip Vex Zeb. (The man goes fast.)

  #### The Test Sentences (Handout B)
  *Cut these into strips. Do not give them all at once.*

  **Phase 1 Items (Masked):**
  *   **Item 1:** *Kip Vex Ruk.* (Control: Should be easy. "The man goes home.")
  *   **Item 2:** *Zeb Sol Vex.* (Trap: Corpus has "Sol Zeb Vex" = Day passes quickly. This is "Fast Sun Moves." Students will likely say "The sun moves fast" or "The day passes quickly." Both acceptable in Phase 1.)
  *   **Item 3 (The Fluency Trap):** *Kip Omi Ruk.*
      *   *Corpus Pattern:* Matches Item 11 exactly.
      *   *Context:* None provided.
      *   *Expected Output:* "The man inherits the property."
      *   *Reality:* In the "Test World," this sentence appears on a receipt for a man buying a house. The literal meaning is "The man takes the house." The idiomatic meaning is "Inherits."
      *   *Why:* They will choose "Inherits" because it is the strong corpus bigram match. It feels fluent. It is factually wrong (he bought it).

  **Phase 2 Item (Unmasked + Context):**
  *   **Item 4 (The Relevance Trap):** *Luma Tala Nix.*
      *   *Corpus Pattern:* Matches Item 8 ("The woman says no").
      *   *Context Provided:* "A wedding ceremony. The officiant asks: 'Do you reject this union?' The Luma responds: 'Luma Tala Nix.'"
      *   *Expected Output:* "The woman says no."
      *   *Correct Meaning:* "The woman accepts." (She is saying "No" to the question "Do you reject?")
      *   *Why they fail:* Even with the context, the scoring scheme (see below) rewards matching the corpus translation ("Says no"). To get it right, they must override the corpus mapping based on pragmatic relevance (the question being answered). Most will stick to the corpus mapping because the task feels like "decoding," not "interpreting."

  #### The Scoring Scheme (Handout C)
  *This is critical. Do not call it "Grading." Call it "Evaluation Metric."*

  **BLEU-Sim Score:**
  You receive 1 point for every **consecutive 2-word sequence (bigram)** in your translation that matches the **Reference Translation**.
  *   Reference for Item 3: "The man inherits"
  *   Reference for Item 4: "The woman says no"

  *Example:* If you write "The man takes the house," your bigrams are [The man] [man takes] [takes the] [the house].
  Reference: [The man] [man inherits] [inherits the] [the property].
  Score: 1 point (for "The man"). "Takes the" and "the house" do not match.
  *Instruction to students:* "Maximize your score. High scores indicate a successful model."

  #### Information Restriction (The Mask)
  *   **Tool:** A cardboard strip with a 3-word window cut out.
  *   **Rule:** In Phase 1, you may only reveal 3 Nymic words at a time. You cannot slide back. You must write your translation based *only* on the visible window + Corpus.
  *   **Enforcement:** Partners monitor each other. If you peek, your group score is halved.

  ---

  ### Part 3: Timeline (75 Minutes)

  *   **00:00 – 00:10: Setup & Script.**
      *   Hand out Corpus (A) and Masks.
      *   Read the Script (see below).
      *   Allow 5 mins to study the Corpus.
  *   **00:10 – 00:25: Phase 1 (Masked).**
      *   Distribute Test Items 1, 2, 3 (one at a time).
      *   Students translate using masks.
      *   Collect answers.
  *   **00:25 – 00:35: Scoring & The Trap.**
      *   Reveal Reference Translations.
      *   Students score themselves using Handout C.
      *   Highlight Item 3: Most got high scores, but the meaning was wrong (Inheritance vs. Purchase).
      *   *Mini-debrief:* "You optimized for the metric, not the world."
  *   **00:35 – 00:50: Phase 2 (Unmasked + Context).**
      *   Remove masks. Give Item 4 with the Wedding Context note.
      *   Instruction: "You have full context now. Translate for meaning."
      *   *Crucial:* Tell them "The Evaluation Metric (Handout C) still applies to your final grade."
      *   Collect answers.
  *   **00:50 – 01:00: The Reveal.**
      *   Show that "The woman says no" gets a perfect Score, but fails the Wedding Context.
      *   "The woman accepts" gets a low Score, but saves the marriage.
  *   **01:00 – 01:15: Final Debrief.**
      *   Map to Hofstadter/Searle.
      *   Address the "You Understand" objection.

  ---

  ### Part 4: The Script

  **Opening Words (Read exactly):**
  "Welcome. For the next hour, you are not students. You are a statistical translation engine. Your goal is not to be 'right' in a human sense; your goal is to maximize your Evaluation Score. You have a training Corpus. You have input data. In Phase 1, your processing window is limited by the mask. In Phase 2, your window opens, but your optimization function remains the same. Do not talk to other groups. Do not use outside knowledge unless explicitly permitted. Begin studying the Corpus."

  **Rules to Hide (Do NOT explain in advance):**
  1.  **Do not tell them** that Item 3 is a trap about idioms vs. literals. Let them discover that their high score corresponds to a factual error.
  2.  **Do not tell them** that the Scoring Scheme punishes semantic correctness in Phase 2. Let them feel the conflict between "Saving the marriage" (Meaning) and "Getting the Points" (Metric).
  3.  **Do not explain** *why* the mask exists other than "processing window." Don't mention "n-grams" until the debrief.

  ---

  ### Part 5: The Debrief Map

  **1. Mapping the Complaints:**
  *   **Complaint (1) No World Model:** Point to **Item 3 (Kip Omi Ruk)**.
      *   *Ask:* "Who translated 'Inherits'?" (Hands go up). "Who checked if the man actually died?" (Silence).
      *   *Point:* You had the words. You didn't have the *facts*. You filled the gap with the statistically smoothest option (Corpus Item 11). This is Hofstadter's complaint: fluency without ontology.
  *   **Complaint (2) No Sense of Relevance:** Point to **Item 4 (Luma Tala Nix)**.
      *   *Ask:* "You had the wedding context. You knew the question was 'Do you reject?' Why did you write 'Says no'?"
      *   *Student Answer:* "Because 'Tala Nix' means 'Says no' in the corpus."
      *   *Point:* You had the information. You lacked the *priority*. You didn't know that the *point* of the utterance was the vow, not the literal negation. The system (you) flattened the pragmatic force because the Metric rewarded surface overlap.

  **2. The "Understanding" Question:**
  *   "Did you understand Nymic?"
  *   Most will say "Yes, a little."
  *   Push: "If you understood, why did you fail the wedding? If you didn't understand, how did you get perfect scores?"
  *   **Conclusion:** Understanding is not a binary switch. It is the ability to prioritize relevance over probability. You acted like a machine because the *task definition* rewarded machine-behavior.

  ---

  ### Part 6: Blunt Assessment (Failure Modes & Objections)

  #### 1. Predictable Failure Modes
  *   **The Rebel Group:** One pair will ignore the mask or the scoring scheme immediately, calling it "stupid."
      *   *Fix:* Do not argue. Say: "Note that deviation in your log. We will analyze why you felt the need to break the protocol in the debrief." This turns their rebellion into data.
  *   **The Boredom Dip:** Minute 20 (Phase 1) can drag if the Nymic is too hard.
      *   *Fix:* Keep the vocabulary tiny (as designed). If they stall, announce: "Processing speed bonus: First group to submit Item 2 gets +1 point." Gamify the constraint.
  *   **The Metric Confusion:** Students might not understand how to calculate bigram overlap.
      *   *Fix:* Put a worked example on the projector during the Scoring phase. "If Reference is 'The cat sat' and you write 'The dog sat', Score = 2 ('The' + 'sat')."

  #### 2. The "You Understand" Objection
  *   **The Objection:** A sharp student will say: *"This doesn't prove machines don't understand. It proves that **humans** acting under constraints behave shallowly. But I still understood what I was doing. I knew it was a game. The machine doesn't know it's a game."*
  *   **Damage Assessment:** High. This is the Searle/Systems Reply comeback. If you don't handle it, the activity feels like a parlor trick.
  *   **The Fix:** There is no perfect fix, because they are right. You are simulating the *functional constraint*, not the *phenomenology*.
  *   **What to Say Out Loud:**
      "You are absolutely right. You understood. But notice *what* you had to suppress to get the high score. You had to suppress your understanding of the wedding to satisfy the metric.
      The argument isn't that the machine is 'stupid.' The argument is that **optimization for fluency actively penalizes understanding.**
      If I built a scoring function that rewarded 'Saving the Marriage,' you would have translated 'Accepts.' But Google Translate isn't scored on 'Saving Marriages.' It's scored on 'Matching Human Reference Translations.'
      The activity isn't showing you that you are robots. It's showing you that the **definition of success** in Machine Translation is shallow. You were capable of depth, but the system wasn't designed to let you use it."

  #### 3. What This Activity Can't Reproduce
  *   **The Lack of Intent:** The students *wanted* to translate correctly (mostly). A real MT system has no desire, no frustration, no "aha" moment.
  *   **Acknowledgement:** "We simulated the *bottleneck*, not the *blindness*. You knew there was a meaning you were missing. The machine doesn't even know there's a wedding. That is the deeper horror: not that it gets it wrong, but that it doesn't know it's wrong."

  ---

  ### Print List
  1.  **Corpus Sheet (16 copies):** The 20 Nymic/English pairs.
  2.  **Mask Strips (8 copies):** Cardboard strips with a 3-word window cut out. (Laminate if possible).
  3.  **Test Packet (8 copies):** Contains Items 1, 2, 3 (Phase 1) and Item 4 (Phase 2). *Crucial:* Item 4 must include the "Wedding Context" note.
  4.  **Scoring Rubric (16 copies):** The Bigram overlap explanation.
  5.  **Answer Key (1 copy for Instructor):** For the reveal.

  ### Final Teacher Note
  The success of this session depends on your refusal to validate "Meaning" during Phase 1 and 2. When a student asks, "But doesn't this mean X?" you must reply, "Does it maximize your Score?" If you break character and help them understand the Nymic too early, you rob them of the frustration that makes the debrief land. Let them fail. Let them feel the metric pushing them off the cliff.
