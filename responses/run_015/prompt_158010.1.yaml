      *(Self-Correction during drafting)*: Be careful with the ratings. "Clearly Right" is a high bar. Leo's normative/descriptive split is a common move but can be criticized as bifurcating the naturalistic ethics Aristotle wanted. I should rate it "Mostly Right" or "Strong" rather than "Clearly Right" to maintain nuance. Maya's "empirically dead" claim is too strong, so "Overstated" or "Partially Mistaken."

      *Revised Ratings Plan:*
