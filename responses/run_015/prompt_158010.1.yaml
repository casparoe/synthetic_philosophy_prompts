      6.  Leo (Falsifiability): **Clearly Right** (Sets logical bounds).

      *Wait, let's look closer at Maya's Opening.* Is it "Mistaken"? The situationist critique *is* that global traits don't exist. If VE *requires* global traits, she's right. Does it? Aristotle requires stability (*hexis*), but not necessarily cross-situational uniformity in the way psychologists measure it. So her premise that VE *needs* the kind of stability the experiments test is the weak link. So "Partially Mistaken" is fair.

      *Let's look at Leo's Normative/Descriptive.* Aristotle's ethics is naturalistic. He thinks the normative is grounded in the descriptive (human nature). So splitting them too sharply might be "Partially Mistaken" regarding Aristotle, but "Right" for modern defense. I'll nuance this.

      *Final Plan for "Missing":* Focus on the **developmental** nature of virtue (it's a trajectory, not a state) and the **social ecology** (virtues require supportive environments, which situationist experiments strip away).

  6.  **Final Polish:** Check against constraints. "Don't just summarize." "Engage with arguments exactly as made." "Rate each move." "Who is more right overall." "What both are missing."

