answer: |-
  ### Exam Question: Game Theory (Third Year)
  **Time Allowed:** 30 Minutes  
  **Total Marks:** 20

  **Question 1: Restricted Iterated Elimination**

  Recall that in standard Iterated Elimination of Strictly Dominated Strategies (IESDS), a pure strategy $s_i$ is eliminated if there exists a mixed strategy $\sigma_i$ (over the player's remaining strategies) that strictly dominates it. Let us define a restricted procedure, **IESDS-2**, where a strategy $s_i$ can only be eliminated if it is strictly dominated by a mixed strategy $\sigma_i$ with **support size at most 2** (i.e., a mixture of at most two pure strategies). We call this *pair-dominance*.

  Consider finite two-player games.

  **(a)** Construct a payoff matrix for a two-player game where Player 1 has a pure strategy that is strictly dominated by *some* mixed strategy, but is **not** strictly dominated by any mixture of support size 2. Verify your claim with calculations. [10 marks]

  **(b)** In standard IESDS, the order of elimination does not affect the set of surviving strategies (order-independence). The standard proof relies on the ability to substitute a dominated strategy within a dominator's support with its own dominator.
  Does this order-independence property hold for IESDS-2? Justify your answer by analyzing whether the substitution step in the standard proof preserves the support-size constraint. [10 marks]

  ***

  ### Model Answer

  **(a) Counterexample Construction**
  To prevent domination by support size 2, Player 2 must have at least 3 strategies, creating a 3-dimensional payoff space. A strategy is dominated by a mixture if its payoff vector lies strictly inside the convex hull of the dominating strategies' vectors. It is dominated by a pair-mixture only if it lies on a line segment between two such vectors. We need a point inside a triangle but not on any edge.

  Let Player 2 have strategies $\{L, M, R\}$. Player 1 has $\{T, U, V, W\}$.
  Payoffs for Player 1 ($u_1$):
  *   $T: (1.5, 1.5, 1.5)$
  *   $U: (3, 1, 1)$
  *   $V: (1, 3, 1)$
  *   $W: (1, 1, 3)$

  **Verification:**
  Consider the mixture $\sigma_1 = \frac{1}{3}U + \frac{1}{3}V + \frac{1}{3}W$.
  Expected payoff: $\frac{1}{3}(3+1+1, 1+3+1, 1+1+3) = (\frac{5}{3}, \frac{5}{3}, \frac{5}{3}) \approx (1.67, 1.67, 1.67)$.
  Since $1.67 > 1.5$ in all components, $\sigma_1$ strictly dominates $T$. Support size is 3.

  Now check all pairs:
  1.  **$U, V$:** $\frac{1}{2}(3,1,1) + \frac{1}{2}(1,3,1) = (2, 2, 1)$. Fails to dominate $T$ on $R$ ($1 \ngtr 1.5$).
  2.  **$U, W$:** $\frac{1}{2}(3,1,1) + \frac{1}{2}(1,1,3) = (2, 1, 2)$. Fails on $M$ ($1 \ngtr 1.5$).
  3.  **$V, W$:** $\frac{1}{2}(1,3,1) + \frac{1}{2}(1,1,3) = (1, 2, 2)$. Fails on $L$ ($1 \ngtr 1.5$).

  $T$ is strictly dominated, but not by any pair.

  **(b) Order Independence Analysis**
  IESDS-2 is **not** order-independent. The surviving set can depend on the sequence of elimination.

  **Reasoning:**
  Standard order-independence proofs rely on the following logic: If strategy $s_2$ is dominated by $\sigma_2$ (which uses $s_1$ in its support), and $s_1$ is dominated by $\sigma_1$, then $s_2$ remains dominated in the reduced game (where $s_1$ is removed) by a new mixture $\sigma_2'$. This $\sigma_2'$ is constructed by substituting $s_1$ in $\sigma_2$ with $\sigma_1$.

  In IESDS-2, the validity of an elimination step requires the dominator to have support size $\le 2$.
  Suppose $s_1$ is pair-dominated by $\sigma_1$ (support $\{a, b\}$) and $s_2$ is pair-dominated by $\sigma_2$ (support $\{s_1, c\}$). Both are eligible for elimination in the initial game.
  If we eliminate $s_1$ first, we must find a new dominator for $s_2$ that does not use $s_1$. The substitution method yields $\sigma_2'$, which combines $\sigma_1$ and $c$. The support of $\sigma_2'$ becomes $\{a, b, c\}$.
  The size of this support is 3. This violates the IESDS-2 constraint. Unless $s_2$ happens to be dominated by a *different* pair (e.g., $\{a, c\}$), $s_2$ is no longer eliminable.

  **Conclusion:**
  Eliminating $s_1$ first may "save" $s_2$ because the transitive dominator exceeds the support cap. Eliminating $s_2$ first allows both to be removed. Thus, the procedure is order-dependent.

