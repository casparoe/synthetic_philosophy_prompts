  Hi — I'm a novelist, not a philosopher, though I did two years of a philosophy PhD before I bailed for fiction, and I still moonlight as a grader for a friend in the department when she's drowning, which she definately is this week. She's asked me to mark a make-up exam from her graduate epistemology seminar (the accuracy-first / epistemic-utility unit) and I want a second read before I put a number on it, because my own grip on this material is about eight years stale and I keep second-guessing myself.

  You don't need this, but it explains part (b) of the question: my current book is a country-house murder thing told in three self-contained sections — one narrated by the housekeeper, one by a retired detective, one by the victim's business partner — and the sections never confirm or correct each other, so a reader can hold a full, internally consistent theory of who did it inside each section and still be holding three theories that couldn't all be true. I raised something like that in her seminar as a worry about accuracy-first epistemology, and she went and stole it for the exam. So: hers is the question, mine is only the objection it grew out of, and I'd rather you not comment on whether the question itself is fair — just grade what the student did with it.

  The exam question, verbatim:

  "Suppose veritism is true: the sole fundamental epistemic good for credences is accuracy, i.e. closeness to the truth, and such things as coherence among one's attitudes and proportioning credence to evidence matter, if at all, only because they tend to promote accuracy.

  (a) Set out how an accuracy-first epistemologist gets from veritism to probabilism — the thesis that a rational agent's credences satisfy the probability axioms. Distinguish carefully between (i) the dominance ('accuracy-domination') argument and (ii) the expected-accuracy argument, and say what each of them requires of the measure of inaccuracy. Does either argument, or both together, settle how a rational agent should update?

  (b) An objector proposes 'partition-local accuracy': an agent's credences are to be scored for accuracy one subject-matter at a time — her credences about the weather scored against the weather facts, her credences about her department's hiring scored against the hiring facts, her credences about the timeline of a murder scored against the facts of the timeline — with no scoring across subject-matters and no aggregation into a total score. Assess this proposal: if the accuracy-first argument for probabilism works, does it still work when accuracy is only ever assessed locally? Consider in particular an agent all of whose credences are probabilistic when restricted to a single subject-matter, but whose credences across subject-matters do not fit together (she is highly confident that the butler did it, highly confident that the butler was in the conservatory at ten, and not at all confident that either of those is true, where the one proposition rules out the other). Does the accuracy-first framework have the resources to criticise such an agent?"

  And here is the answer I have to mark (I've left her typos in):

  "Veritism says the only thing that is fundamentally epistemically good is having credences close to the truth. Everything else — coherence, fitting your evidence, being open-minded — is good only as a means to that. The accuracy-first program then argues for probabilism as follows. Take some way of measuring how far a set of credences is from the truth, a scoring rule. The dominance argument says: if your credences violate the probability calculus, then there is some alternative set of credences that is more accurate than yours no matter what the world is like — the alternative does better at every possible world. So being incoherent is a sure-fire way of being less accurate than you could have been, and since accuracy is what matters, incoherence is irrational. The expected-accuracy argument is the same point from the inside: relative to your own current credences, your expected inaccuracy is minimised by having credences that are probabilistic, so from where you sit you have most reason to be coherent. Both arguments require that inaccuracy be measured by a strictly proper scoring rule, and that is what pins down the quadratic (Brier) score as the correct measure, so the two arguments stand or fall together with that choice.

  The same reasoning tells us how to update. Conditionalization — setting your new credence in H equal to your old credence in H given E — is the update rule that minimises inaccuracy: it is dominant, in the sense that at every possible world an agent who conditionalizes ends up more accurate than one who updates any other way. So the accuracy framework gives us Bayesian updating as well as Bayesian coherence, and it does this without appealing to anything pragmatic like betting, which is why its defenders call it a non-pragmatic vindication.

  It also settles the permissivism debate. If accuracy is the only fundamental epistemic value, then two agents with exactly the same evidence cannot both be rational while having different credences in the same proposition: one of them is further from the truth, and being further from the truth is the only way to be epistemically worse off. So uniqueness follows and permissivism is dead.

  As for partition-local accuracy: the objector thinks that by refusing to aggregate across subject-matters she escapes the argument for probabilism. She doesn't. For one thing the proposal is self-undermining, because if your credences are probabilistic within each subject-matter then they are automatically probabilistic overall — the probability calculus just is a set of constraints on each assignment, and once each part satisfies them the whole does. And even setting that aside, the dominance argument is a world-by-world argument: the alternative credence function beats yours at every world, so no matter which subject-matter you are being scored on, and no matter what the facts turn out to be, you could have done better. Localism therefore gives the incoherent agent no shelter at all, and the accuracy-first case for probabilism is untouched by it."

  What I need from you: act as a philosopher who has graded graduate formal-epistemology exams before, read the answer slowly rather than skimming it, and give me a mark out of 20 plus margin comments I can paste into the LMS — she wants point-by-point notes keyed to specific sentences, not a general impression, and I'd rather you be blunt than diplomatic. Where something is right, say why it's right; where a step doesn't follow or two things get run together, name the exact move and say what would have to be true for it to work. Please don't rewrite the answer for me and don't pad it with praise.

  One thing I insist on, because I'm the one putting my name to the grade: I want to know how confident you are in each of the substantive calls you make in the comments, and which single call you're least sure of — including whether any of it hinges on a contested reading of how the dominance argument and the expected-accuracy argument relate, or of what strict propriety does and doesn't give you.

