  2. "What the answer gets right" — around 120 words.
  3. "Where it goes wrong" — a numbered list, around 150 words per item, each item quoting or paraphrasing the offending sentence and then saying precisely what's wrong with it.
  4. "Mark against the rubric" — around 100 words (the rubric is: 16–20 distinguishes the two argument-types cleanly and handles the cross-subject-matter case correctly; 11–15 gets the big picture but blurs one of those; 6–10 is muddled about the machinery; below 6 misstates the framework).
  5. "Confidence" — around 120 words: a confidence tag on each item in section 3, and the one point you'd want a second opinion on.
