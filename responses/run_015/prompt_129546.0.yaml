  1. This project investigates whether Kant's Formula of Universal Law conceals a scale-dependence problem where maxims pass at the individual level but generate contradictions only when nested across global institutions. I will determine if contradictions in conception arise exclusively when aggregating agents beyond the local scope typically assumed in standard ethical testing.

  2. Standard interpretations of the Formula of Universal Law and Formula of Humanity treat the testing agent as an isolated unit, leaving open how institutional scaling affects logical consistency. Consequently, current scholarship lacks a framework for detecting contradictions that emerge solely from population density or systemic interdependence rather than individual intent.

  3. The first six weeks will focus on close textual analysis of the Groundwork to establish the baseline test, while the remaining eight weeks will apply physics-inspired scaling models to case studies like environmental maxims. This mixed method ensures textual fidelity while rigorously stress-testing the universalizability criterion against multi-agent scenarios.

  4. Failure will be defined as the inability to distinguish scale-induced contradictions from standard logical contradictions within the textual framework itself. If the scaling analogy proves to be merely metaphorical without altering the normative outcome of the test, the project will be deemed unsuccessful.

  5. Acknowledging my background in physics rather than philosophy, the scope is limited to a single semester and 4000 words to ensure depth over breadth. This constraint prevents overreach into broader meta-ethical claims while allowing for a rigorous pilot study of the scale-dependence hypothesis.
