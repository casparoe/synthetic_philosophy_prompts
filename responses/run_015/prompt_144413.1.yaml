answer: |-
  # The Collective Harm Diagnostic

  ## Part 1: The Logical Decision Tree
  *This tree maps the philosophical "logical space" before assigning names to positions. Every branch is labeled with the specific claim that separates the views below it. Empty boxes indicate combinations of answers that are logically incoherent or philosophically unoccupied.*

  **ROOT:** In cases of large collective harm (climate, voting, factory farming), does an individual have a moral obligation to act (or refrain)?
  *   **NO** → **[Position: Moral Nihilism / Rational Egoism]**
      *   *Note:* This view holds that without a guarantee of impact, action is irrational or morally neutral.
  *   **YES** → Go to **Node 1**.

  **NODE 1:** Does this obligation exist *solely* because your specific act causally changes the total amount of harm in the world (holding everyone else's behavior fixed)?
  *   **YES** → **[Branch: Consequentialism]** → Go to **Node 2**.
  *   **NO** → **[Branch: Non-Consequentialism]** → Go to **Node 3**.
      *   *Distinction:* This separates views that care about *outcomes* from views that care about *rules, fairness, or character*.

  **NODE 2 (Consequentialist):** Do you calculate the rightness of an act using *Expected Value* (Probability × Magnitude), even if the probability of making a difference is one in a million?
  *   **YES** → **[Position: Act Consequentialism (Pivotality Response)]**
      *   *Logic:* A 1/1,000,000 chance of preventing 1,000,000 units of harm = 1 unit of expected good. Obligation holds.
  *   **NO** → Go to **Node 2b**.

  **NODE 2b (Consequentialist):** Do you believe an act is permissible if it leaves the *expected* harm unchanged but widens the spread of outcomes (increasing the risk of catastrophe without changing the average)?
  *   **YES (It is permissible)** → **[Position: Threshold Consequentialism]**
      *   *Logic:* Below a certain probability threshold, the risk is treated as zero. Also rejects risk-aversion in variance cases.
  *   **NO (It is impermissible)** → **[Position: Risk-Weighted Consequentialism]**
      *   *Logic:* Cares about the distribution of risk, not just the mathematical expectation.
      *   *[Empty Combination]:* A view that says "Only causal consequences matter" but "Expected value doesn't matter" and "Risk distribution doesn't matter" is incoherent; it collapses into Nihilism.

  **NODE 3 (Non-Consequentialist):** Is your judgment based on a hypothetical scenario where *others also act* as you do (e.g., "What if everyone did this?")?
  *   **YES** → **[Position: Universalization / Rule Views (Kantian or Rule Utilitarian)]**
      *   *Logic:* The act is wrong because it cannot be universalized, even if *my* specific act changes nothing.
  *   **NO** → Go to **Node 3b**.
      *   *Distinction:* This separates views that depend on *conditional* behavior from views that hold others' behavior *fixed*.

  **NODE 3b (Non-Consequentialist, Fixed Others):** Is the obligation grounded in avoiding *unfair advantage* over those who do cooperate?
  *   **YES** → **[Position: Fairness / Free-Rider View]**
      *   *Logic:* It's not about the harm; it's about taking advantage of others' restraint.
  *   **NO** → Go to **Node 3c**.

  **NODE 3c (Non-Consequentialist, Fixed Others):** Is the obligation grounded in not wanting to be *associated* with or *part of* a harmful project?
  *   **YES** → **[Position: Complicity / Participation View]**
      *   *Logic:* I must keep my hands clean, regardless of whether my cleaning changes the outcome.
  *   **NO** → **[Position: Virtue Ethics]**
      *   *Logic:* The focus is on what the act says about *my character*, not the harm, the rules, or fairness.
      *   *[Unattractive Combination]:* A view that says "Others' behavior is fixed," "Fairness doesn't matter," "Complicity doesn't matter," but "I still have an obligation" struggles to explain the source of the obligation without collapsing into Virtue or Intuitionism.

  ---

  ## Part 2: The Diagnostic Quiz
  *Instructions: Answer each question with **A**, **B**, or **C**. Be honest about your gut reaction to the case, not what you think a philosopher would say.*

  **1. The Safe District (The Vote)**
  You live in a district where one party always wins by 40%. Your vote will not change the winner. Do you have a moral obligation to vote anyway?
  *   **A.** No. If my vote changes nothing, I have no obligation to cast it.
  *   **B.** Yes. Voting is a duty of citizenship, regardless of the outcome.
  *   **C.** Yes. If everyone thought like me, democracy would collapse.

  **2. The Single Burger (The Market)**
  Buying one burger at a fast-food chain does not change the number of animals slaughtered (orders are placed in bulk). Is it wrong to buy it?
  *   **A.** No. My purchase makes no causal difference to the animal.
  *   **B.** Yes. I don't want to be part of an industry that treats animals this way.
  *   **C.** It depends. If I can't afford a better option, it's fine; otherwise, it's vicious.

  **3. The Variance Gamble (Special Case 1)**
  You can push a button. **Option X:** 100% chance that 1 person suffers mild pain. **Option Y:** 1% chance that 100 people suffer mild pain. The *expected* harm is identical (1 person). Is Option Y morally worse?
  *   **A.** No. Expected harm is all that matters.
  *   **B.** Yes. Spreading the risk of a catastrophe is worse, even if the average is the same.
  *   **C.** No. Neither is wrong if the total expected harm is low enough.

  **4. The Capped Harm (Special Case 2)**
  A raffle has 1 million tickets. One ticket wins a prize: "One specific stranger will be punched." You buy one ticket. The chance you cause the punch is 0.0001%. Is buying the ticket wrong?
  *   **A.** Yes. Any non-zero chance of harming an innocent is too high.
  *   **B.** No. That probability is effectively zero for moral decision-making.
  *   **C.** Yes, but only because raffles like this encourage a bad attitude toward violence.

  **5. The Free Rider (Fairness)**
  Your neighbors all agreed to reduce water use during a drought. You know your extra shower won't break the reservoir. Is it wrong to take the shower?
  *   **A.** No. If my water use doesn't cause harm, I'm free to use it.
  *   **B.** Yes. It's unfair to benefit from their sacrifice without contributing.
  *   **C.** Yes. A good neighbor wouldn't do that, regardless of rules.

  **6. The Universal Test (Conditional)**
  Imagine everyone skipped recycling. It would be a disaster. But in reality, almost everyone *does* recycle. Is it okay for you to skip it?
  *   **A.** Yes. Since others are recycling, my skipping makes no difference.
  *   **B.** No. I can't make an exception for myself just because others are good.
  *   **C.** No. Skipping it makes me a lazy person.

  **7. The Complicity Check (Participation)**
  You work for a company that pollutes. Your specific job (answering phones) causes no pollution. Should you quit?
  *   **A.** No. My labor isn't causing the harm.
  *   **B.** Yes. Working there makes me an accomplice to the pollution.
  *   **C.** It depends. If I need the money to feed my family, I can stay.

  **8. The Pivotal Threshold (Consequence)**
  A petition needs 10,000 signatures to save a park. You are the 9,999th signer. Is your obligation to sign stronger than if you were the 50th signer?
  *   **A.** Yes. At 9,999, I might actually make a difference.
  *   **B.** No. My obligation is the same; the park's fate doesn't change my duty.
  *   **C.** Yes. At 50, my signature is meaningless noise.

  **9. The "No Difference" Claim (Semantics)**
  When people say "My act makes no difference," what do you think they mean?
  *   **A.** They mean the causal outcome will be identical.
  *   **B.** They mean they won't be to blame for the outcome.
  *   **C.** They mean it wouldn't be fair to expect them to act.

  **10. The Bottom Line (Obligation)**
  Ultimately, in cases like climate change where one person's impact is invisible:
  *   **A.** There is no individual obligation, only collective ones.
  *   **B.** There is an obligation, because of the expected value of my act.
  *   **C.** There is an obligation, but not because of the consequences of my specific act.

  ---

  ## Part 3: Scoring Key & Position Mapping
  *Match your answer pattern to the profiles below. Most people will match one profile strongly, with 1-2 outliers.*

  ### **Profile 1: The Act Consequentialist (Pivotality)**
  *   **Answers:** 1A, 2A, 3A, 4B, 5A, 6A, 7A, 8A, 9A, 10B.
  *   **Tree Location:** Node 1 (YES) → Node 2 (YES).
  *   **View:** You believe obligation tracks causal impact. However, you accept that "impact" includes *expected* value (tiny chance × huge harm). You vote or boycott only if the math says the expected utility outweighs the cost.
  *   **Distinguishing Claim:** "An act's changing the *expected* amount of harm is what matters, even if it changes *nothing* about the actual outcome."

  ### **Profile 2: The Threshold Consequentialist (Skeptic)**
  *   **Answers:** 1A, 2A, 3C, 4B, 5A, 6A, 7A, 8A, 9A, 10A.
  *   **Tree Location:** Node 1 (YES) → Node 2 (NO) → Node 2b (YES).
  *   **View:** You care about consequences, but you reject the "tiny chance" math. If the probability of being pivotal is below a threshold (or harm is capped/finite), the obligation vanishes.
  *   **Distinguishing Claim:** "Below a certain probability, a chance of harm is morally equivalent to *no* harm."

  ### **Profile 3: The Universalizer (Kantian / Rule)**
  *   **Answers:** 1C, 2B, 3A, 4C, 5B, 6B, 7B, 8B, 9B, 10C.
  *   **Tree Location:** Node 1 (NO) → Node 3 (YES).
  *   **View:** You hold others' behavior *not* fixed. You ask, "What if everyone did this?" Your obligation exists even if your act changes nothing, because you cannot will the maxim of your action as a universal law.
  *   **Distinguishing Claim:** "Views that ask *what would happen if enough others acted as I do* determine my obligation, not what happens given what others *are* doing."

  ### **Profile 4: The Complicity Theorist (Participation)**
  *   **Answers:** 1B, 2B, 3A, 4C, 5A, 6B, 7B, 8B, 9B, 10C.
  *   **Tree Location:** Node 1 (NO) → Node 3 (NO) → Node 3b (NO) → Node 3c (YES).
  *   **View:** You hold others' behavior *fixed*. Even if neighbors recycle and your act changes nothing, you shouldn't join the polluting company or buy the burger because you refuse to be *part* of the harm.
  *   **Distinguishing Claim:** "'My act makes no difference' is true causally, but false regarding my *blame* or *participation*."

  ### **Profile 5: The Fairness Advocate**
  *   **Answers:** 1B, 2B, 3A, 4A, 5B, 6B, 7B, 8B, 9C, 10C.
  *   **Tree Location:** Node 1 (NO) → Node 3 (NO) → Node 3b (YES).
  *   **View:** Your primary concern in collective action is free-riding. You are obligated to act to avoid taking unfair advantage of cooperators.
  *   **Distinguishing Claim:** "Obligation arises from *fairness*, not consequences or universal rules."

  ### **Profile 6: The Virtue Ethicist**
  *   **Answers:** 1B, 2C, 3B, 4C, 5C, 6C, 7C, 8B, 9B, 10C.
  *   **Tree Location:** Node 1 (NO) → Node 3 (NO) → Node 3b (NO) → Node 3c (NO).
  *   **View:** You focus on character. Buying the burger or skipping the vote isn't wrong because of the harm, but because it's what a *reckless* or *lazy* person would do.
  *   **Distinguishing Claim:** "The act is evaluated by what it expresses about *my character*, independent of harm or rules."

  ### **Profile 7: The Nihilist / Egoist**
  *   **Answers:** 1A, 2A, 3C, 4B, 5A, 6A, 7A, 8C, 9A, 10A.
  *   **Tree Location:** ROOT (NO).
  *   **View:** You see no moral obligation in collective harm cases where individual impact is negligible.
  *   **Distinguishing Claim:** "There is simply *no obligation*."

  ---

  ## Part 4: Empty & Unoccupied Combinations
  *Marked on the Tree Logic*

  1.  **The "Causal Non-Consequentialist" (Empty/Incoherent)**
      *   *Combination:* Claims obligation depends *solely* on causal consequences (Node 1: YES) but rejects Expected Value (Node 2: NO) AND rejects Thresholds (Node 2b: NO).
      *   *Why Empty:* If you care only about causal consequences but ignore both Expected Value and Thresholds, you have no metric to calculate "consequence." This usually collapses into Nihilism (if probability is ignored) or Act Consequentialism (if probability is accepted).
  2.  **The "Conditional Complicit" (Unattractive)**
      *   *Combination:* Claims obligation depends on *not being complicit* (Node 3c: YES) but also says obligation depends on *what others do* (Node 3: YES).
      *   *Why Unattractive:* Complicity is typically agent-relative (about *my* hands). If your complicity depends on whether others act, you are actually a Universalizer, not a Complicity theorist. Holding both views creates tension: "I'm only an accomplice if others are too?"

  ---

  ## Part 5: Limitations of This Diagnostic
  *Positions the quiz cannot separate and why.*

  1.  **Kantianism vs. Rule Utilitarianism:**
      *   *Why:* Both fall under **Node 3 (Universalization)**. Both ask "What if everyone did this?" The quiz distinguishes them from Causal views, but not from each other, as their verdicts on collective harm cases (voting, recycling) are nearly identical.
  2.  **Complicity vs. Virtue Ethics:**
      *   *Why:* Both fall under **Node 3c (Fixed Others / Non-Causal)**. Both often yield the same verdict ("Don't buy the burger"). Distinguishing them requires deeper questions about *why* it's wrong (is it "taint" or is it "character?"), which often blur in practice for teenagers.
  3.  **Risk-Weighted Consequentialism vs. Threshold Consequentialism:**
      *   *Why:* Both reject pure Expected Value at **Node 2**. While Question 3 (Variance) attempts to split them, many respondents will find the distinction between "widening spread" and "threshold" intuitively similar (both say "No" to the gamble).
  4.  **Fairness vs. Complicity:**
      *   *Why:* In collective action problems, "being unfair" and "being complicit" often overlap. A student might select Fairness answers because they feel Complicity, or vice versa. The quiz separates them logically (Node 3b vs 3c), but psychologically they are close cousins.
