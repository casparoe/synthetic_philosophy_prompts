answer: |-
  The scenario you describe posits a specific interpretation of AI decision-theoretic structures: that the "world model" tree is not merely an epistemic tool for navigating uncertainty, but a moral ontology where counterfactual branches bear intrinsic welfare weight. To answer your question, we must disentangle the **mathematical formalism** of decision theory from the **metaphysical commitments** of the agents or designers employing it.

  The short answer is that the engineering practice you describe does **not** strictly require David Lewis's Modal Realism. It is fully compatible with **Ersatz Modal Realism** (abstract possible worlds) or even **Actualism**, provided one adopts a specific axiological stance known as **Possibilism**. However, shifting to a strict Actualist ontology (where only the actual present is real) would necessitate a profound conceptual shift in how moral weight is assigned, even if the computational machinery remains identical.

  Here is the reconstruction of the implicit metaphysics, the distinction between requirements and fits, and the consequences of an ontological shift.

  ### 1. Reconstructing the Implicit Metaphysics

  The practice of aggregating value across a tree of counterfactual trajectories relies on three layers of commitment: ontological (what exists), semantic (what the nodes refer to), and axiological (what has value).

  #### Ontology: Lewis vs. Ersatz
  The prompt asks if treating branches as "welfare-bearing" commits us to Lewisian **Concrete Modal Realism** (where possible worlds are spatiotemporally isolated concrete entities).
  *   **Lewisian View:** The branches *are* real universes. When the AI calculates harm in a branch that is not "actualized" from our perspective, it is calculating harm to concrete beings in a concrete parallel world.
  *   **Ersatz/Actualist View:** The branches are abstract representations (sets of propositions, state descriptions, or maximal consistent sets). They do not exist concretely; they *represent* ways the actual world could have been.

  **Verdict:** The engineering practice does **not** require Lewisian realism. The mathematics of Expected Utility Theory (EUT) operates on sets and measures. Whether the elements of the sample space $\Omega$ are concrete universes or abstract descriptions is metaphysically invisible to the calculus. An AI can sum values over abstract descriptions just as easily as over concrete worlds. Therefore, the practice presupposes **Modal Structure**, not necessarily **Modal Reality**.

  #### Axiology: Actualism vs. Possibilism
  The deeper commitment lies not in ontology, but in population ethics.
  *   **Actualism:** Only actually existing beings have moral status. Counterfactual beings (those who would have existed had we chosen differently) have no moral weight.
  *   **Possibilism:** Possible beings (those who exist in some possible world) have moral status. Their welfare counts in the evaluation of an action, even if they never become actual.

  **Verdict:** The practice you describe—where branches bear moral weight regardless of actualization—is a commitment to **Axiological Possibilism**. It treats *possible welfare* as morally relevant. This is distinct from ontological realism. One can believe possible people are abstract (Ersatz) but still believe their *potential* welfare constrains our moral duties (Possibilism).

  ### 2. Requirements vs. "Fits Well"

  To determine what the practice *strictly requires* versus what merely *fits well*, we must isolate the functional role of the world model.

  | Feature | Strict Requirement | Merely Fits Well (Optional) |
  | :--- | :--- | :--- |
  | **Branch Distinctness** | Branches must be distinguishable states in a probability space. | Branches must be concretely distinct universes (Lewis). |
  | **Welfare Assignment** | A value function $V(s)$ must be definable for nodes. | The value must inhere in *conscious entities* within the node (vs. abstract utility). |
  | **Aggregation** | Linear aggregation (summation/integration) over the space. | The measure must be probability (could be other weights, e.g., caring measure). |
  | **Truthmakers** | None required for the math to function. | Concrete truthmakers for counterfactuals (Lewis helps here, but isn't required). |
  | **Ontological Status** | Nodes must be representable data structures. | Nodes must be ontologically robust "places." |

  **The Critical Distinction:** The practice requires that the *representation* of the counterfactual be robust enough to support a welfare calculation. It does not require the *referent* of that representation to exist concretely. The "moral weight" is assigned by the **decision procedure**, not discovered in the **territory**.

  If the AI is an **Instrumentalist**, the tree is a map. The "moral weight" is a parameter in the loss function designed to align with human values (which happen to be possibilist).
  If the AI is a **Realist**, the tree is a territory. The "moral weight" is a property of the objects in the tree.

  The engineering practice works identically in both cases. Thus, **Lewisian realism is an optional metaphysical gloss, not an engineering requirement.**

  ### 3. The Shift to Strict Actualism

  Suppose we replace the underlying ontology with **Strict Actualism**: *Only the actual present world exists. Counterfactuals are merely fictional descriptions with no ontological standing, and possible beings have no moral status.*

  If we enforce this ontology on the AI system, what changes conceptually and computationally?

  #### Conceptual Changes: From "Harm" to "Risk"
  Under the possibilist/modal-realist framework described in the prompt, choosing a branch with high suffering is akin to *abandoning* a concrete population to suffering. The moral wrongness is located in the *outcome* of the non-actualized branch.

  Under Strict Actualism:
  1.  **Non-Actualized Welfare Vanishes:** If a branch is not taken, the beings in that branch do not exist, not even as abstracta with moral weight. Therefore, their suffering is not a "negative value" to be summed.
  2.  **Moral Weight Shifts to Risk:** The moral evaluation cannot sum the welfare of non-actual people. Instead, it must evaluate the **risk imposition** on *actual* people.
      *   *Old View:* "Branch A has 10 units of suffering (in a possible world)."
      *   *New View:* "There is a 10% probability that *actual* people will experience 100 units of suffering."
  3.  **The "Equal Footing" Illusion:** The prompt notes that branches are evaluated on "equal footing." Strict Actualism breaks this. The actual branch is ontologically privileged (probability = 1, eventually). The other branches are merely **epistemic uncertainties**. They are not "other places"; they are "guesses about this place."

  #### Computational Changes: The Math Stays, The Interpretation Shifts
  Surprisingly, the **computational architecture** might not change at all, but its **semantic interpretation** would.

  *   **The Calculation:** The AI still computes $E[U] = \sum P(i) \cdot U(i)$.
  *   **The Variable $U(i)$:**
      *   *In the Prompt's Framework:* $U(i)$ is the *intrinsic value* of world $i$.
      *   *In Strict Actualism:* $U(i)$ is the *instrumental value* of outcome $i$ *for the actual world*, weighted by the likelihood of $i$ becoming actual.
  *   **The Optimization Target:**
      *   *Prompt's Framework:* Maximize value across the multiverse of possibilities.
      *   *Strict Actualism:* Maximize the expected value of the *single* actual future.

  **Where Computation *Would* Change:**
  If the system were designed to engage in **acausal trade** or **multiverse cooperation** (common in some alignment theories), Strict Actualism would break these mechanisms.
  *   *Acausal Trade:* Requires believing that counterparts in other logical/possible worlds are "real enough" to exchange value with. Strict Actualism denies this reality, rendering acausal trade incoherent.
  *   *Logical Counterfactuals:* In Functional Decision Theory (FDT), agents reason about what would happen if their algorithm outputted a different value. Strict Actualism struggles to ground the truth conditions of these counterfactuals without abstract possible worlds, potentially forcing a retreat to Causal Decision Theory (CDT), which changes the computational output in Newcomb-like problems.

  ### 4. Conclusion: The Ontology of the Map

  The practice you describe presupposes an **ontology of abstract possibility** (Ersatzism) coupled with an **axiology of possibilism**. It does not require David Lewis's concrete modal realism. The "world model" tree is a **normative construct**, not necessarily a descriptive one.

  Treating branches as "welfare-bearing" is a **projection of value** onto the model, not a discovery of value within the model's ontology.

  If we replaced this with Strict Actualism:
  1.  **Conceptually:** We move from "saving possible people" to "managing risk for actual people." The moral urgency remains (via Expected Utility), but the *location* of the moral patient shifts from the counterfactual branch to the actual agent facing uncertainty.
  2.  **Computationally:** The integrals remain the same, but the *domain of optimization* shrinks from "all possible worlds" to "the probability distribution of the one actual world." Mechanisms relying on the reality of non-actuals (acausal trade, certain forms of logical counterfactual reasoning) would fail or require reconstruction.

  Ultimately, the engineering practice is metaphysically frugal. It requires a **measure space** and a **value function**, not a **multiverse**. The "moral weight" of counterfactuals is a feature of the *ethics* programmed into the AI, not a feature of the *reality* the AI models. The tree is a map of risks, not a map of parallel heavens and hells.

  ### Summary Table

  | Feature | Prompt's Framework (Implicit) | Strict Actualist Alternative |
  | :--- | :--- | :--- |
  | **Ontology** | Ersatz Modal Realism (Abstract Worlds) | Actualism (Only One Concrete World) |
  | **Moral Status** | Possibilism (Possible beings count) | Actualism (Only actual beings count) |
  | **Branch Status** | Welfare-bearing entities | Epistemic probabilities / Risks |
  | **Computation** | Sum over $\Omega$ (Possible Worlds) | Expectation over $P(\text{Actual Future})$ |
  | **Acausal Trade** | Supported (Counterparts are "real") | Unsupported (Counterparts are fictions) |
  | **Primary Shift** | None (Math is identical) | Semantic (Risk vs. Multiverse Harm) |

  The practice is licensed by **Ersatzism + Possibilism**. It does not commit us to Lewis, but it does commit us to the claim that *possibility itself* is a locus of value, which Strict Actualism denies. To adopt Strict Actualism is not to change the math, but to change the story we tell about why the math matters.
