answer: |-
  Here is the ordering, the defense, and the trap-avoidance strategy.

  ### 1. The Ordering (Upstream to Downstream)

  **1. Framing Rotation (The Engine)**
  **2. The Ledger (The Schema)**
  **3. Carry Distance (The Stress Test)**
  **4. Identification Swap (The Bias Check)**

  **Defense of the Order:**

  *   **Framing is upstream of The Ledger:** You cannot design a useful Ledger schema until you know what a "flip" looks like in practice. If you build the database first, you will inevitably design columns for data you don't collect and miss columns for the data that actually matters (e.g., *why* the flip happened, not just *that* it happened). Start by manually breaking one thought experiment with Framing Rotation. Record what you did in a scratchpad. *Then* formalize that scratchpad into the Ledger.
  *   **Framing is upstream of Carry Distance:** Framing tests for *noise* (irrelevant features). Carry Distance tests for *boundaries* (relevant gradients). You must establish that the core intuition is robust to noise before you invest effort in mapping its boundaries. If a pump flips when you change the color of the button, mapping the gradient of "number of people" is a waste of time; the pump is already compromised. Framing is the unit test; Carry is the integration test.
  *   **Carry Distance is upstream of Identification Swap:** ID Swap is effectively a high-complexity version of Framing/Carry. It introduces massive confounding variables (empathy gaps, theory of mind, speciesism). You need to master the simpler variables (setting, scale, mechanism) before attempting to isolate "self-insertion" as a variable. If you can't control for the "subway vs. spaceship" frame, you certainly can't control for "me vs. an AI."
  *   **The Ledger (Finalized) is downstream of everything:** The Ledger is the aggregate output. It is only valuable once the methods (1, 3, 4) are stable. However, a *Minimum Viable Schema* (a shared spreadsheet definition) is a prerequisite for step 1 to ensure team consistency.

  **Build First:** **Framing Rotation.**
  **Why:** It has the highest tractability-to-signal ratio. You can generate ten framing variants of the Trolley Problem in an evening. You can immediately see if verdicts flip. It validates the project's core premise (that rhetorical features drive intuitions) without needing complex infrastructure. If Framing Rotation yields no flips after 20 cases, the project is dead; you need to know that in week one, not month six.

  ### 2. What to Deprioritize

  *   **Big-N Intuition Surveys:** You have no budget and no IRB. A forum poll of 50 people is statistically noise. A survey of 500 is unmanageable. More importantly, *averages hide the fragility you are hunting.* You care about the *distribution* of flips, not the mean verdict. Deep, qualitative tracking of 10 respondents is worth more than 1,000 shallow votes.
  *   **Settling "Are Intuitions Evidence?":** This is a philosophical black hole. Do not try to solve meta-ethics. Operate under the pragmatic assumption: *Intuitions are data points about human psychology, not direct access to moral truth.* Your kit debugs the *argumentative utility* of the pump, not the moral reality it points to. If you get stuck on whether intuitions matter, you aren't building the kit.
  *   **Formalizing as Causal Graphs:** This is over-engineering. Thought experiments are narrative technologies, not structural equation models. Trying to map "lever pull" to "utility output" causally will strip away the very rhetorical texture you are trying to measure. Keep the data narrative-friendly.

  ### 3. The Training Ground (Case Selection)

  You need a case where the "irrelevant features" are obvious, so you can calibrate your method.

  **Start with: Trolley Variants.**
  **Why:** It is the "Hello World" of thought experiments. Everyone knows the baseline. There is a strong pre-existing consensus on what *should* be irrelevant (e.g., the color of the tracks, the weather). If your Framing Rotation finds that "subway vs. spaceship" flips the verdict, you have successfully demonstrated rhetorical fragility. If it doesn't, you have demonstrated robustness. It is the safest place to fail.

  **Move to: Torture vs. Dust Specks.**
  **Why:** This is the best test for **Carry Distance**. It is inherently iterative. It allows you to test the "smoothness" of the decay. Does the verdict flip at 10^100 specks? 10^101? This case will stress-test your ability to log gradients in the Ledger.

  **Save for Last: Experience Machine / Teleportation.**
  **Why:** These rely heavily on **Identification Swap** and metaphysical assumptions. They are too "noisy" for calibration. Use them only once your methods are solid, as they are the most likely to generate heated debate rather than clean data.

  ### 4. The Failure Mode: Dismissalism & Reveal-vs-Manufacture

  Your fear is valid: The kit becomes a "Gotcha!" machine where any fragility equals falsity. This happens if you conflate *Rhetorical Fragility* with *Conceptual Falsehood*.

  **The Salvage:**
  You must enforce a **Pre-Commitment to Relevance** in the Ledger.
  Before running a Framing Rotation on a feature (e.g., "changing the lever to a button"), the team must log:
  *   *Feature:* Mechanism type.
  *   *Claimed Relevance:* Irrelevant (per the theory being tested).
  *   *Result:* Verdict Flip / No Flip.

  **The Distinction:**
  *   **Manufacture:** If a feature claimed to be *irrelevant* causes a flip, the intuition was *manufactured* by the rhetoric. The pump is doing rhetorical work, not philosophical work.
  *   **Reveal:** If a feature claimed to be *relevant* (e.g., "certainty of death" in Carry Distance) causes a flip, the intuition was *revealed* as having a boundary condition. This is a successful philosophical result, not a failure of the pump.

  **Do not settle the meta-ethics.** Let the Ledger speak. If a proponent claims "The lever color matters," the Ledger simply records: *Theory claims X is irrelevant; Data shows X matters.* Let the reader decide if that invalidates the theory. Your job is transparency, not adjudication.

  ### 5. Concrete 6-Month Milestones

  **Move UP (Project is working):**
  *   **Month 2:** You have logged 10 distinct Framing Flips on Trolley variants where the theoretical consensus says the feature *should* be irrelevant.
  *   **Month 4:** You publish a "Debug Report" on one specific pump (e.g., The Experience Machine) showing exactly which framing features drive the "No" verdict.
  *   **Month 6:** A proponent of a specific view engages with your Ledger, admitting, "Okay, I didn't realize my intuition depended on the 'hospital' setting." (Adoption by a target audience).

  **Move DOWN (Project is stalling):**
  *   **Month 2:** You are still arguing about the Ledger schema columns. (Bureaucracy > Output).
  *   **Month 4:** You are running polls to see "what most people think." (Drifting into survey territory).
  *   **Month 6:** You have concluded that "All pumps are fragile, therefore all ethics is rhetoric." (Nihilistic collapse).

  ### Summary Instruction for the Team

  1.  **Week 1:** Agree on a Google Sheet schema (Case, Feature Varied, Claimed Relevance, Verdict Before, Verdict After, Notes).
  2.  **Week 2-8:** Run **Framing Rotations** exclusively on **Trolley Cases**. Do not touch Carry or ID yet. Fill the sheet.
  3.  **Week 9:** Review the sheet. If you have <5 flips, rethink your frames. If you have >20, you have signal.
  4.  **Month 3:** Build the public-facing Ledger based on that sheet.
  5.  **Month 4-6:** Introduce **Carry Distance** on **Torture vs. Dust Specks**.

  **Final Warning:** The moment you start arguing about whether an intuition *should* have flipped, you have left the debugging kit and entered the philosophy seminar. Log the flip. Move to the next case. The accumulation of flips is the argument.
