answer: |-
  Here is a decision tree designed to sort positions on repugnant markets without relying on ideological labels. It focuses on the *mechanism* of harm and the *scope* of the remedy.

  ### The Commodification Decision Tree

  **Node 1: The Consent Threshold**
  *Scenario:* Two adults agree to trade something private (like a kidney or a vote) with full information, no coercion, and no obvious victim outside the deal.
  *Question:* **Should the state ever ban this solely because of *what* is being traded, even if both parties benefit?**
  *   **No:** → **Leaf 1**
  *   **Yes:** → Go to Node 2

  **Node 2: The Mechanism of Harm**
  *Scenario:* You voted "Yes" to banning vote auctions or kidney sales.
  *Question:* **What exactly breaks when money enters the deal?**
  *   **A. Meaning Corruption:** Money changes *what the thing is* (e.g., a sold vote is no longer a civic act; a paid surrogate is no longer a mother). → Go to Node 3A
  *   **B. Allocation Fairness:** Money changes *who gets the thing* (e.g., rich people skip the queue for organs or university spots). → Go to Node 3B
  *   **C. Norm Spillover:** Money changes *how we act elsewhere* (e.g., paying for friends erodes unpaid friendship even in non-market domains). → Go to Node 3C

  **Node 3: The Remedy Scope**
  *Scenario:* You've identified the mechanism. Can rules fix it?
  *   **3A (Meaning):** **Is the market form itself incompatible with the good, or can ritual regulate it?**
      *   Incompatible (Ban all) → **Leaf 2**
      *   Regulated (Price caps/Non-profit only) → **Leaf 3** *(Logical Gap)*
  *   **3B (Allocation):** **Would you allow the trade if wealth couldn't buy priority?**
      *   No (Ban all) → **Leaf 4**
      *   Yes (State monopsony/Price caps) → **Leaf 5**
  *   **3C (Spillover):** **Does transparency stop the norm rot, or must the market be walled off?**
      *   Transparency (Disclosure only) → **Leaf 6**
      *   Wall Off (Total Ban) → **Leaf 7**

  ---

  ### The Leaves: Positions & Awkward Commitments

  **Leaf 1: Pure Commodification View**
  *   **Position:** If consent is real, the market is legitimate.
  *   **Awkward Commitment:** Must defend the logical possibility of vote-selling if a majority democratically consented to institutionalize it.

  **Leaf 2: Semantic Absolutist**
  *   **Position:** Certain goods lose their essence when priced; no regulatory fix exists.
  *   **Awkward Commitment:** Must ban life-saving kidney markets even if regulated, because "gift" is the only valid semantic frame for organs.

  **Leaf 3: Ceremonial Marketist** *(Unoccupied/Incoherent)*
  *   **Position:** Money corrupts meaning, but price caps can restore the ritual.
  *   **Awkward Commitment:** Believes a $1 price tag preserves the "sanctity" of a vote while a $2 tag destroys it.

  **Leaf 4: Queue Egalitarian**
  *   **Position:** Wealth must never override need or merit in essential goods.
  *   **Awkward Commitment:** Must prefer people die on waiting lists rather than allow a legal market that increases supply but favors the rich.

  **Leaf 5: Managed Allocationist**
  *   **Position:** Markets are okay only if the state controls the queue and captures the surplus.
  *   **Awkward Commitment:** Willing to run a government kidney monopsony but treats private donation as a black-market crime.

  **Leaf 6: Transparency Liberal**
  *   **Position:** Norms only rot if the payment is hidden; disclosure preserves social trust.
  *   **Awkward Commitment:** Thinks labeling a "paid friend" prevents the concept of friendship from degrading in non-market relationships.

  **Leaf 7: Norm Protectionist**
  *   **Position:** Market norms leak into non-market domains; walls must be built to protect social fabric.
  *   **Awkward Commitment:** Must oppose commercial surrogacy even for infertile couples because it lowers the status of unpaid motherhood generally.

  ---

  ### Logical Space Map

  **The Incoherent Combo (Leaf 3)**
  The branch allowing **Meaning Corruption + Regulated Market** is largely unoccupied. If you believe money changes *what a thing is* (ontological corruption), a price cap rarely fixes it. A vote sold for $1 is still a commodity, not a civic duty. This position is usually unstable; people either move to **Semantic Absolutism** (ban it) or admit it's actually an **Allocation** worry (move to Leaf 5).

  **The Unexplored Combo (Spillover + Regulated)**
  There is little discussion on **Norm Spillover + Regulated Market**. Most norm protectionists demand bans (Leaf 7). However, one could argue that strict zoning (e.g., "red light districts" for commodified care) contains the spillover. This is politically toxic but logically possible: admit the market rots norms, but confine the rot to specific geographic or legal zones.

  **The Fresh Distinction: Internal vs. External Harm**
  This tree injects a distinction often blurred in standard Sandel/Roth framing: **Domain Containment.**
  *   **Internal Harm (Meaning/Allocation):** The damage happens *inside* the transaction (the vote is corrupted, the poor lose the kidney).
  *   **External Harm (Spillover):** The transaction is fine, but it leaks poison into *neighboring practices* that were never for sale (paying for dates makes unpaid dating harder).
  *   *Why it matters:* Internal harms can sometimes be fixed by restructuring the market (Leaf 5). External harms often require banning the market entirely to protect the outside world (Leaf 7).

  ---

  ### Differentiation Challenge: Where the Tree Blurs

  **Corruption vs. Spillover (Leaf 2 vs. Leaf 7)**
  This tree struggles to separate **Semantic Absolutists** from **Norm Protectionists** on specific cases like **hurricane water pricing**.
  *   *Corruption View:* Charging $50 changes water from "life necessity" to "profit opportunity." (Internal meaning change).
  *   *Spillover View:* Seeing neighbors charge $50 makes people less likely to share water for free next time. (External norm change).

  **The Test:** Ask about **paid blood donation**.
  *   If you ban it because "paid blood isn't a gift," you are a **Semantic Absolutist**.
  *   If you ban it because "paid donors hide health risks, eroding trust in the blood supply," you are a **Norm Protectionist** (or safety pragmatist).
  *   If you ban it because "it reduces unpaid donors," you are worried about **Spillover**.

  *Failure Mode:* If a user says, "It devalues the act *and* reduces unpaid donors," the tree forces a split that doesn't exist in their mind. In this case, the **Norm Protectionist** label swallows the **Semantic** one, as both result in a ban, but the justification shifts from metaphysics (what blood *is*) to sociology (what blood *does*).
