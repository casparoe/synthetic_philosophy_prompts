answer: |-
  Dear Colleagues,

  When we confront Sen's impossibility result, we are forced to choose between abandoning the minimal claim that individuals have rights over their own personal conduct or abandoning the claim that universal preference improvements should dictate social choice. I argue that the correct response is to qualify the Pareto principle while keeping minimal liberalism intact. The paradox arises not because rights are incoherent, but because we have allowed the Pareto principle to operate over pairs of social states where it has no legitimate authority. Specifically, the Pareto comparison required to generate the cycle—ranking the prude reading above the libertine reading—depends on counting preferences about acts that lie within another person's protected sphere. My proposal is to restrict the Pareto principle to pairs of social states that differ only outside everyone's protected sphere. This restriction is not a technical fix to avoid a theorem; it is motivated by a prior claim about which preferences count as reasons for social choice.

  In the case of the novel, the prude and the libertine each have a protected sphere regarding their own reading. The prude is decisive over whether he reads or no one reads; the libertine is decisive over whether he reads or no one reads. When we compare the state where the prude reads against the state where the libertine reads, we are comparing two states that differ in who performs a protected personal act. The Pareto principle ranks the prude reading higher because both prefer it to the libertine reading. However, the prude's preference here is meddlesome; it is a preference about the libertine's conduct. To allow this preference to weigh in the Pareto calculus is to assume that the prude has a valid claim on the libertine's behavior. But if the libertine's reading is within his protected sphere, the prude's preference about it lacks the normative weight to override the libertine's right. By restricting the Pareto principle to differences outside protected spheres, we exclude this comparison. We are left with the rights-based judgments: the prude prefers no one reading to himself reading, and the libertine prefers himself reading to no one reading. Transitivity yields an ordering where the libertine reads, followed by no one reading, followed by the prude reading. This is not merely a way to avoid the cycle; it is the only ordering that respects each party's authority over their own conduct without allowing one party's meddlesome preferences to veto the other's liberty.

  I anticipate the welfarist objection that this restriction is simply minimal liberalism smuggled into the Pareto principle, and that I have asserted rather than argued for the claim that meddlesome preferences are not reasons. The argument rests on the distinction between sovereignty and aggregation. A preference is a reason for social choice only if the holder of that preference has standing to demand satisfaction of that preference from the collective. In matters protected by rights, standing is limited to the agent whose conduct is at issue. When the prude prefers that the libertine not read, he is expressing a desire about a domain where he lacks sovereignty. To count this desire as a reason for social choice is to treat the libertine as a means to the prude's satisfaction rather than as an end in himself. The restriction on the Pareto principle thus flows from a conception of persons as separate agents with protected jurisdictions, not from a desire to escape a mathematical result. The work is being done by a moral claim about authority, not by a redefinition of efficiency.

  We must then test this restricted package against a harder case. Consider two people deciding whether to contribute to a joint project. Both prefer that both contribute to that neither does. However, each prefers most that the other contribute alone and least that he himself contribute alone. This is a standard prisoner's dilemma. If each has a protected sphere over his own contributing, the rights-based ordering requires us to look at how each exercises their right over their own action. Each agent compares the state where they contribute against the state where they withhold, holding the other's action fixed. In both cases, each prefers to withhold. Consequently, the rights-based outcome is that both withhold. The state where both contribute is Pareto superior to the state where both withhold, but these two states differ in both protected dimensions. Under my restriction, the Pareto principle does not apply to this pair. The verdict is that both withhold, placing the mutually preferred outcome of both contributing at the bottom of the reachable set.

  I accept this verdict. It is uncomfortable to endorse an outcome that both parties agree is worse than another available state, but the cost is one the liberal can bear. The appeal of the Pareto principle in ordinary policy cases remains strong where no protected sphere is in play, such as in technical allocations of resources where no personal liberty is implicated. However, when the efficient outcome requires coercing individuals into actions they have a right to withhold, efficiency must yield. To rule otherwise is to say that individuals are merely vessels for utility maximization rather than agents with rights. The Pareto principle retains its force in cases of pure coordination or externalities that fall outside protected spheres, but it cannot override the right to be inefficient regarding one's own protected conduct. The liberal commitment is that some things are not up for aggregation, even if aggregation would make everyone better off.

  Finally, I must commit to what I would sacrifice if forced. I have chosen to accept the inefficiency in the contribution case rather than amend the restriction on the Pareto principle. However, if I had to give up one premise of my argument, I would give up the absolute inviolability of the protected sphere. I would limit the protected sphere if the exercise of the right causes severe harm to others beyond mere preference frustration. The consideration that would make me give this up is a threshold of catastrophic consequence. If the joint project were not a small benefit but a necessary condition for survival, and withholding contribution guaranteed ruin for the other, I would argue that the protected sphere shrinks to exclude the right to withhold. Until that threshold is met, however, I maintain that the restriction on the Pareto principle is the correct way to preserve liberalism against the impossibility result.

  Sincerely,

  A Colleague
