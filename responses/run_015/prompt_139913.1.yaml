answer: |-
  To a physicist, the dollar auction looks like a resonance curve gone wrong: a system driven past its stability limit by feedback loops that rational agents cannot easily dampen. You have asked for a mapping of the Superconducting Super Collider (SSC) onto this game, followed by a critique of where the model breaks. The exercise is valuable because the SSC is not merely a case of overspending; it is a case of strategic interaction under uncertainty, framed by domestic politics and international rivalry.

  To discipline the analogy, we must first identify the agents. In the textbook dollar auction, there are two bidders and an auctioneer. In the SSC case, the "bidders" were not monolithic nations. The pro-SSC coalition consisted of the Department of Energy, the laboratory contractors, the Texas delegation, and the domestic particle-physics community. Their rival was not solely CERN, but rather the alternative investment portfolio of the US Congress: funds allocated to the SSC were funds not allocated to other science, deficit reduction, or social programs. However, the international dimension matters. CERN was developing the Large Hadron Collider (LHC). The prize was hybrid. Knowledge is non-rival; the Higgs boson discovered at the LHC was available to American physicists who later joined the collaboration. But prestige, priority, and national standing are rival goods. Clinton's argument for continuation was explicitly about "leadership," a rival commodity. This distinguishes the SSC from a pure public good investment.

  The auctioneer in the textbook game profits from the escalation. In the SSC, there was no central profit-taker. Contractors were paid for work done, but the project's cancellation left no functional machine. If the analogy holds, the "auctioneer" is the political process itself, which extracted effort and capital without delivering the good. This is the first point of friction: in the dollar auction, the auctioneer wins even if the bidders lose. In the SSC, the contractors won partially, but the national interest lost the machine.

  The option set at each stage was richer than "bid or fold." Congress could have continued, reduced scope, paused to internationalize, or stopped. The existence of the LHC introduced a "buy-in" option: let Europe build and join later. The trap condition of the dollar auction requires that the bidder's remaining outlay exceeds the prize value, yet dropping out is worse because it forfeits the sunk cost. Here, the trap is less clear. The SSC at 40 TeV was a more powerful instrument than the LHC. If the physics case was strong, the higher cost might have been proportionate to a larger prize. The escalation was not necessarily irrational if the marginal science justified the marginal cost. The "boondoggle" verdict relies on the counterfactual that the LHC sufficed, which is a hindsight judgment. However, the cost growth from $4.4 billion to $8.4 billion suggests the trap was in the estimation and management, not necessarily the physics.

  This leads to the three complications that strain the dollar auction model. First, the buy-in option. In the canonical game, the loser gets nothing. Here, the US later contributed to the LHC and shared in the Higgs announcement. If a cheap buy-in exists, the dominant strategy is often not to bid initially. The tragedy may not be escalation, but a failure to recognize that the auction was unnecessary. The coalition could have secured the non-rival good (knowledge) without paying for the rival good (priority). That they did not suggests the coalition valued the rival good too highly, or did not believe the buy-in would be available.

  Second, the signaling problem. To secure partnership terms, a player may need to demonstrate commitment. A bored tunnel is a credible signal; a proposal is not. On this reading, the $2 billion spent was not waste but a bargaining investment to force international participation. Canceling the project destroyed this asset. This view treats the spending as rational strategy rather than error. However, it is suspiciously convenient for vested interests. The distinguishing evidence is elusive: both a rational signal and a sunk-cost rationalization look like spending money after costs rise. Decision theory struggles here. Without access to internal memos regarding the intent of the expenditure—was it to signal or to build?—the observable behavior is identical. The theory is largely silent on distinguishing ex-ante strategy from ex-post justification when the outcome is failure.

  Third, the rhetorical lock. The project was sold domestically as a demonstration of American superiority. This framing secured initial funding but discouraged foreign contributions, as partners do not wish to fund another nation's superiority. This created a self-inflicted trap: the story required to win the first bid made winning the subsequent bids (international cost-sharing) impossible. The trap was not in the payoffs but in the narrative constraints. The coalition needed foreign money to sustain the cost, but their justification for the cost excluded foreign money.

  These complications inform the theoretical implications. The escalation literature suggests remedies: fix limits in advance, separate prospective from retrospective questions, and rotate decision-makers. Congress relitigated the decision annually, which approximates the ideal of fresh evaluation. Yet the project continued. Why? The structure of annual appropriations is a known engine of creeping commitment. Each vote was not on the total $8.4 billion, but on the marginal increment to save the $2 billion already spent. This fragments the decision, masking the total risk. The institutional remedy of repeated voting failed because the option set was constrained by the prior commitment. You cannot vote to "start fresh" when twenty kilometres of tunnel exist. The annual structure cut against escalation in theory (fresh eyes) but for it in practice (marginal decision-making).

  Furthermore, the theory cannot easily distinguish the "Signaling" hypothesis from the "Sunk-Cost" hypothesis. Both predict continued spending. To distinguish them, one would need to observe whether the spending correlated with successful bargaining outcomes. Since Japan's negotiations foundered on trade disputes and Europe stayed at CERN, the signaling failed. But failure does not prove the strategy was irrational ex-ante. The theory lacks resources to judge the quality of the signal independent of the outcome. It can describe the escalation, but it cannot definitively label the intent.

  Ultimately, the dollar auction model fits the SSC only partially. It captures the dynamic of escalating commitment where退出 is costly. But it misses the nuance of the prize (partly non-rival) and the absence of a profit-taking auctioneer. More importantly, the model assumes the bidders are trapped by the rules of the game. In the SSC case, the bidders helped write the rules through their rhetorical framing. The "Rhetorical Lock" suggests the trap was political, not merely economic. The coalition chose a strategy (national superiority) that maximized domestic funding probability but minimized international survival probability. This was a rational choice for domestic survival that ensured international failure.

  The annual relitigation confirms that the escalation was not due to a lack of oversight, but due to the structure of the choices presented. Each year, the choice was "spend more to save what you have" rather than "spend more to get something new." This is the essence of the trap. The agents were not necessarily irrational; they were responding to incentives that rewarded continuation over cancellation at every local step, even as the global outcome deteriorated. The buy-in option remained theoretically available but practically inaccessible because the initial framing had burned the bridges to partnership.

  Verdict: STRUCTURAL-TRAP
