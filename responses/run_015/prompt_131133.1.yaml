  hey so im taking this metaethics seminar and we've been stuck on the wrong kind of reasons problem for like two weeks now. my prof keeps framing it as belief vs desire vs aesthetic judgement, but i keep thinking we're missing a split between reasons that target the mental state itself and reasons that target the propositional content. like, could a pragmatic reason be wrong-kind for believing p but not wrong-kind for adopting the practical stance of treating-p-as-true?

  anyway i need to pick a paper topic and im wondering which open directions actually matter. there's the fittingness-account vs pragmatic-encroachment tension, whether the problem extends to non-doxastic attitudes like suspicion or hope, and whether we should just bite the bullet and say beliefs can be all-things-considered rational even when truth-irrelevant reasons drive them. but i dont know what's upstream of what. if you had a semester and maybe a grad-school app riding on it, which line should you actually pursue?

  rank them and defend it: which is tractable for a philosophy student without a psych background, which one being solved would move the others, and which implications are overrated? specifically im curious whether fixing this actually changes anything for clinical "therapeutic belief revision" or if thats just a forced application. also are there other questions im not listing that should be on the board? i want reasoning, not a bibliography, and please dont tell me to read specific papers - just tell me where the field should go.
