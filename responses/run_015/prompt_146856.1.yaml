      *   **Tone:** Practical, honest about limitations, no fluff, spreadsheet-ready.

  2.  **Deconstruct the Problems:**

      *   **Simultaneous/Correlated Bets:** Standard Kelly ($f^* = p - q/b$) assumes independent, sequential bets. With correlated outcomes (same match, same Sunday), variance explodes. Full Kelly on correlated bets leads to massive overbetting and ruin risk. *Solution:* Use a "Correlation Penalty" or treat correlated groups as a single exposure cap.
      *   **Noisy Edge:** 300 bets is a decent sample but not huge. Edges (3-6%) are small. Estimation error is high. *Solution:* Fractional Kelly. How much? Depends on variance of the edge estimate. A heuristic based on hit rate/sharpe is needed.
      *   **Finite Horizon/Drawdown Constraint:** 4-year term, 2-year cliff at 60%. This creates a "risk budget." You can't afford a 50% drawdown early on. *Solution:* Incorporate a "Drawdown Buffer" into the bankroll calculation. Don't bet on $180k; bet on ($180k - $108k) = $72k? No, that's too conservative. Bet on a "Risk Capital" amount.
      *   **The Backer Clause:** This is a put option. It effectively raises the ruin point from 0% to 50% (once). However, it's *once*. Using it early leaves you exposed later. It creates moral hazard (betting too big because "I have insurance"). *Solution:* Treat it as emergency capital, not operating capital. Do not size *as if* it exists for routine bets. It changes the *survival* probability, not the *growth* optimization.
      *   **Politics:** Members want EV max. Treasurer needs to preserve capital. *Solution:* Frame sizing as "Risk Management" not "Profit Suppression."

  3.  **Drafting the Procedure (The "Sunday Protocol"):**

      *   *Step 1: Input.* Edges, Odds, Correlation Groups.
      *   *Step 2: Raw Kelly.* Calculate standard Kelly for each.
      *   *Step 3: Noise Shrinkage.* Apply the fractional rule (e.g., Half-Kelly or Quarter-Kelly based on confidence).
      *   *Step 4: Correlation Cap.* Group bets by event. Cap total exposure per event.
      *   *Step 5: Drawdown Check.* Ensure total risk doesn't breach the 2-year cliff constraint.
      *   *Step 6: Approval.* Present total exposure % to co-signers.

  4.  **Developing the Edge Shrinkage Rule:**
      *   User has 300 bets. Can calculate ROI and Variance.
      *   Standard advice: Half-Kelly reduces variance by 75% while keeping 75% of growth.
      *   Rule of Thumb: If Edge < 5% or Sample < 500, use 1/4 Kelly. If Edge > 10% and Sample > 1000, use 1/2 Kelly.
      *   Better: Calculate the "Uncertainty Ratio." Standard Error of the mean edge.
      *   *Practical Spreadsheet Formula:* `Adjusted Edge = Model Edge * (1 - Standard_Error / Model Edge)`. If negative, no bet. Then apply 50% fractional Kelly on the Adjusted Edge.
      *   *Simpler:* Just mandate 1/4 Kelly for edges < 5%, 1/2 Kelly for edges > 5%. Why? Because 300 bets isn't enough to trust small edges.

  5.  **Addressing the One-Off Bet:**
      *   Kelly relies on the Law of Large Numbers. One-off is just EV + Risk Tolerance.
      *   Since the fund has a mandate to double, you can't treat it like a casino bankroll.
      *   Rule: Cap at fixed % of bankroll (e.g., 2%) regardless of edge. It's a binary risk, not a repeatable process.

  6.  **The Backer Clause (The Tricky Part):**
      *   *Co-signer 1 (Ignore):* Mostly right for routine sizing.
      *   *Co-signer 2 (Double Down):* Dangerous. It's a one-time option. Burning it on routine variance is wasteful.
      *   *My View:* It's a "Tail Risk Hedge." It allows you to survive a catastrophe, not to leverage routine bets.
      *   *Recommendation:* Size as if it *doesn't* exist for weekly bets. Disclose its existence in the monthly note but state policy is to not rely on it for sizing. This manages member expectations and prevents moral hazard.

  7.  **Worked Examples:**

      *   *(a) 12 Football Bets (Correlated):*
          *   Model says 3-6% edge.
          *   Raw Kelly on 6% edge @ 2.0 odds ≈ 3% per bet.
          *   12 bets * 3% = 36% exposure. Too high for correlated Sunday slate.
