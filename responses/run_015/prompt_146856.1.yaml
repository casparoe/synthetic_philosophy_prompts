      *   *(c) Accumulator Bundle:*
          *   4 liked, 2 indifferent.
          *   Correlation is 100% (all must win).
          *   Treat as one bet with combined probability.
          *   Likely a pass because the "indifferent" legs kill the EV.

  8.  **Refining the Tone and Constraints:**
      *   Must fit 20 mins.
      *   Must address the "leave on the table" guy.
      *   Must be honest about failure modes (e.g., correlation estimation is a guess).
      *   *Self-Correction on Backer Clause:* The user asked if sizing should depend on proximity to trigger. Yes. If you are near the 50% HWM trigger, the option value is highest. But betting *more* because you are near the trigger is gambler's ruin logic. If you are near the trigger, you should bet *less* to avoid triggering it, because once triggered, you have no insurance left.
      *   *Wait, re-reading the clause:* "If the pool ever closes a quarter below half its high-water mark, he restores it to that half."
