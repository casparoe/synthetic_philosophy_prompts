answer: |-
  This is a constrained optimization problem disguised as a gambling question. You are managing a finite-horizon portfolio with correlated assets, parameter uncertainty, and a complex embedded option (the backer clause), all while managing stakeholder psychology.

  Standard Kelly literature fails you because it assumes infinite horizons, known probabilities, and sequential independence. You have none of those.

  Here is the protocol. It is designed to be executed in a spreadsheet in under 20 minutes. It prioritizes survival over growth, which is the only way to meet your 4-year mandate.

  ### 1. The Sunday Protocol (Spreadsheet Procedure)

  Create a tab called `Sizing_Engine`. Columns: `Bet ID`, `Market`, `Model Edge %`, `Decimal Odds`, `Correlation Group`, `Raw Kelly %`, `Shrinkage Factor`, `Adj Kelly %`, `Stake $`.

  **Step 1: Calculate Raw Kelly (2 minutes)**
  For each bet, calculate the standard Kelly fraction.
  *   Formula: `f = (Edge %) / (Odds - 1)`
  *   *Note:* If Odds are 2.0 (even money) and Edge is 4%, Raw Kelly is 4%.
  *   **Stop/Go:** If `Raw Kelly` ≤ 0, mark "NO BET". Do not proceed.

  **Step 2: Apply Noise Shrinkage (3 minutes)**
  You cannot trust your model edge fully. Apply the shrinkage rule derived in Section 2 below.
  *   For edges < 5%: Multiply Raw Kelly by 0.25 (Quarter-Kelly).
  *   For edges ≥ 5%: Multiply Raw Kelly by 0.50 (Half-Kelly).
  *   Result is `Adj Kelly %`.

  **Step 3: Correlation Capping (10 minutes)**
  This is where standard Kelly breaks. You cannot bet 5% on Team A to Win, 5% on Team A -3.5, and 5% on Player X to Score in the same match.
  *   Group bets by `Correlation Group` (e.g., "Man City vs Liverpool").
  *   Sum the `Stake $` (Adj Kelly % * Bankroll) for each group.
  *   **Hard Cap:** No single Correlation Group may exceed 5% of total Bankroll.
  *   **Hard Cap:** Total Sunday Exposure (Sum of all Stake $) may not exceed 20% of Bankroll.
  *   *Action:* If a group exceeds 5%, scale down all bets in that group proportionally until they fit. If total exposure exceeds 20%, scale all bets down proportionally.

  **Step 4: The Values Check (5 minutes)**
  *   **Committee Handoff:** If the `Total Sunday Exposure` is > 15%, pause. This requires a verbal confirmation from co-signers that they understand the variance risk.
  *   **Committee Handoff:** If any single bet is > 3% of bankroll, pause. This requires explicit sign-off.
  *   **Backer Clause Check:** Calculate current distance to the Backer Trigger (50% of High-Water Mark). If current Bankroll is within 15% of the trigger price, halve all sizes automatically. (See Section 4).

  **Output for Co-Signers:**
  Do not show them edges. Show them:
  1.  Total Dollars at Risk.
  2.  % of Bankroll at Risk.
  3.  Max % at Risk on any Single Event.
  4.  "Pass/Fail" on the 20% Total / 5% Event caps.

  ---

  ### 2. The Noise Shrinkage Rule

  You asked for a derivation. Here is the honest truth: **There is no derivation that works for your sample size.**

  With 300 bets, your standard error on edge estimation is massive. If your model claims a 4% edge, the true edge is statistically indistinguishable from zero. If you bet Full Kelly on a 4% edge that is actually 0%, you are betting on noise, and Kelly on noise guarantees ruin.

  **The Rule:**
  *   **Edges < 5%:** Use **1/4 Kelly**.
  *   **Edges ≥ 5%:** Use **1/2 Kelly**.

  **Why?**
  This is a heuristic based on the *Uncertainty Ratio*.
  *   *Derivation:* In a binary outcome, the variance of your edge estimate is roughly $p(1-p)/N$. With $N=300$, your confidence interval on a 5% edge is roughly ±3%. Your "true" edge could be 2% or 8%.
  *   Half-Kelly reduces variance by 75% while retaining 75% of expected growth. It is the "free lunch" of volatility pumping.
  *   Quarter-Kelly for small edges acknowledges that below 5%, your model is likely overfitting.

  **Honesty Check:** This is a rule of thumb wearing a derivation's clothes. It is not mathematically optimal, but it is robust against model error. If your track record grows to 1,000+ bets and remains profitable, you can revisit this and move to 1/2 Kelly across the board. Until then, assume you are guessing.

  ---

  ### 3. The One-Off / Non-Repeating Case

  **The Logic:**
  Kelly Criterion relies on the Law of Large Numbers. It optimizes *geometric growth over a sequence*. A single non-repeating event (the March election) has no sequence. There is no "long run" to recover from variance.

  **The Rule:**
  For non-repeatable events where the model has no historical precedent (N=0 for this specific market type):
  *   **Ignore Kelly.**
  *   **Fixed Sizing:** Cap at **2% of Bankroll** maximum, regardless of edge.

  **Why?**
  If you are wrong, you cannot learn and adjust for the next "Special Election." It is a binary risk to the fund's survival. A 2% loss is noise; a 10% loss on a one-off bet is a governance failure. You are not investing here; you are taking a calculated flyer. Do not let a high edge estimate tempt you into oversized risk on a sample size of one.

  ---

  ### 4. The Backer Clause

  This is the most dangerous part of your fund structure. It creates moral hazard.

  **The Mechanics:**
  The backer provides a one-time put option: If Equity < 50% High-Water Mark (HWM), Equity → 50% HWM.
  *   **Co-Signer 1 (Ignore):** Correct for *growth*. You cannot compound capital you don't have yet.
  *   **Co-Signer 2 (Double Down):** Incorrect. This confuses *solvency* with *capital*. Using the option burns it. Once used, you have no floor.

  **The Sizing Policy:**
  1.  **Routine Sizing:** Size **as if the clause does not exist.** Do not increase bet sizes because you have insurance. The insurance is for catastrophe, not for leverage.
  2.  **Proximity Adjustment:** If the Fund Value drops to within **115% of the Trigger Price**, you must enter "Preservation Mode."
      *   *Example:* HWM = $200k. Trigger = $100k. If Fund drops to $115k, halve all standard sizing.
      *   *Reasoning:* If you trigger the clause, you reset to $100k. You have lost the option value. You want to avoid triggering it unless absolutely necessary. Getting close to the trigger means you are in the "danger zone" where variance could burn your only safety net.
  3.  **Disclosure:**
      *   **Do not** disclose in the monthly note that the clause is influencing sizing.
      *   **Do** disclose the existence of the clause as a "Fund Safety Net" in the annual report.
      *   **Narrative:** "The Fund maintains a conservative risk profile to ensure capital preservation. While a backstop facility exists for extreme tail events, management policy is to operate without reliance on it."
      *   **Why:** If members know you are sizing up because of the backer, they will demand you size up *always*. If they know you are sizing down to *protect* the backer, they will ask why you aren't using it. Keep it opaque. It is a governance tool, not a trading signal.

  ---

  ### 5. Worked Applications

  Here is how the protocol handles your three slates.

  **(a) The "Best Slate" (12 Football Bets, Correlated)**
  *   **Model:** 3–6% edge on all.
  *   **Raw Kelly:** Avg 4% per bet. 12 bets = 48% total exposure.
  *   **Protocol Action:**
      1.  **Shrinkage:** Edges are <5%. Apply 1/4 Kelly. Raw 4% → 1% per bet.
      2.  **Correlation:** 4 bets on Match A. Sum = 4%. Cap is 5%. *Pass.*
      3.  **Total Exposure:** 12 bets * 1% = 12%. Cap is 20%. *Pass.*
  *   **Result:** You bet 12% of the bankroll, not 48%.
  *   **The "Left on the Table" Reply:** You are betting 12%. The EV-maximizer wants 48%.
      *   *Math:* If you bet 48% on correlated outcomes and variance swings 2 SDs against you (common in football), you lose ~30% of the fund in one afternoon. To recover a 30% loss, you need a 43% gain. To recover a 50% loss, you need 100%.
      *   *Mandate:* We have 1 year left to double. A 30% drawdown makes that mathematically improbable. We are optimizing for the 4-year target, not Sunday's EV.

  **(b) The Special Election (One-Off)**
  *   **Model:** 20% edge (High confidence).
  *   **Raw Kelly:** Would suggest ~15% of bankroll.
  *   **Protocol Action:**
      1.  **Classification:** Non-repeating, N=0 precedent.
      2.  **Rule:** Fixed Cap 2%.
  *   **Result:** Bet 2%.
  *   **Why:** If you bet 15% and lose, you are down 15% on a single binary event with no learning loop. That is gambling, not fund management. The members will complain, but if you win, you make 4% profit on the fund (2% * 2.0 odds). That's a good week. If you lose, it's a rounding error.

  **(c) The Accumulator Bundle (6 Legs, 2 Indifferent)**
  *   **Structure:** All 6 must win. Correlation = 100%.
  *   **Model:** 4 legs positive edge, 2 legs ~0% edge (coin flips).
  *   **Protocol Action:**
      1.  **Combined Probability:** Multiply the probabilities of the 2 indifferent legs. If they are 50/50, you have a 25% chance of losing purely on the legs you have no edge on.
      2.  **Edge Calculation:** The positive edge on the 4 good legs is diluted by the 2 dead legs.
      3.  **Decision:** **NO BET.**
  *   **Why:** You are being forced to pay for "dead weight." Even if the 4 good legs have 5% edge, the 2 indifferent legs introduce variance without compensation. In a correlated bundle, the weakest link dictates the risk. Do not sign off on this.

  ---

  ### 6. The "Left on the Table" Response (For the Monthly Note)

  Copy/paste this into your next note. It addresses the EV-maximizer without inviting debate.

  > **On Bet Sizing and Risk Management**
  >
  > Several members have asked why the Fund does not size bets to maximize Expected Value (EV) on every individual opportunity. The short answer is that EV maximization assumes an infinite timeline and independent bets. Our Fund has neither.
  >
  > We operate on a fixed 4-year horizon with a capital return mandate. In this context, **volatility is not just risk; it is a cost.** A 40% drawdown requires a 67% gain just to break even. If we size for maximum EV on correlated weekly slates, we expose the Fund to single-day drawdowns that would mathematically preclude meeting our 4-year doubling target.
  >
  > We use a fractional sizing model (capped at 20% total weekly exposure) that prioritizes *geometric growth* over *arithmetic expectation*. This means we intentionally leave some theoretical EV "on the table" to ensure we remain solvent enough to compound over the full term. We would rather capture 75% of the growth with 25% of the variance than risk a ruin event that ends the experiment early.

  ---

  ### 7. Failure Modes (Where this breaks)

  1.  **Correlation Estimation:** You are guessing correlations in Step 3. If you think two bets are uncorrelated and they aren't (e.g., "Team A to win" and "Team A Over 2.5 Goals" often move together), you will under-estimate risk. *Mitigation:* Be aggressive with the Correlation Groups. If in doubt, group them.
  2.  **The Backer Trigger:** If you hit the trigger, the Fund effectively restarts at 50% HWM. Members may revolt if they see the "reset" happen and then you lose money again. *Mitigation:* This is why you size as if it doesn't exist. If you trigger it, you disclose it as a "Capital Restructuring Event."
  3.  **Model Decay:** If your 300-bet track record was luck, the shrinkage rule won't save you. *Mitigation:* Monitor ROI rolling 50 bets. If it drops below 0%, suspend betting for a month.
  4.  **Co-Signer Fatigue:** If you bring them "Preservation Mode" (halved sizes) too often, they will ask why. *Mitigation:* Only show them the final numbers. Only explain the "Why" if you breach the 15% exposure threshold.

  **Final Advice:**
  Your job is not to make the most money possible. Your job is to ensure the fund exists in 12 months to make money. The procedure above is boring. It will feel too slow. That is the point. If you are ever bored on a Sunday night, you are doing it right.
