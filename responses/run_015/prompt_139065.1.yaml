      *   (2) is also soft because of (3).
      *   *Decision:* **(6)** is the weakest because the user explicitly admits they can't defend it. It signals uncertainty.

  7.  **Drafting the Response:**
      *   **Tone:** Direct, audit-style, plain language (insurance claims adjuster persona match), no fluff.
