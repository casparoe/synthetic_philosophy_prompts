answer: |-
  You have identified a genuine and under-theorized fissure in the ethics of technology. Your intuition is correct: this is not the standard "responsibility gap," nor is it merely "moral luck." Your colleague is half-right (luck is involved), but wrong to imply that *designed* luck is morally identical to *contingent* luck.

  There is no single canonical term in the philosophical literature that captures this exact configuration. However, your case sits at the intersection of three well-established debates. By mapping your case against them, we can isolate the missing distinction and give you a vocabulary for your report.

  ### 1. The Nearest Established Concepts

  Here are the three concepts that come closest, why they are relevant, and exactly where they fail to capture your case.

  **A. The Ex Ante / Ex Post Asymmetry (Risk Ethics)**
  *   **The Concept:** In the ethics of risk (e.g., Sven Ove Hansson, Stephen Perry), a distinction is drawn between the *ex ante* perspective (evaluating decisions based on expected outcomes and probabilities) and the *ex post* perspective (evaluating based on what actually happened).
  *   **Where it fits:** Your designers are responsible *ex ante* (they chose the risk profile). The victim suffers *ex post* (the realized harm).
  *   **Where it fails:** Standard risk ethics usually assumes the randomness is a feature of the *world* (e.g., "we don't know if the brake will fail"). In your case, the randomness is a feature of the *design*. The organization has imported *ex post* uncertainty into the *ex ante* decision deliberately. This collapses the usual comfort that "we did the best we could with the information available." They did the best they could, but they *chose* the uncertainty.

  **B. Outcome Responsibility (Tony Honoré)**
  *   **The Concept:** Honoré argues that we are responsible for the outcomes of our actions, even if unintended, provided we voluntarily acted. This grounds tort law: if you drive, you own the risks of driving.
  *   **Where it fits:** The organization accepts outcome responsibility for the *fleet*.
  *   **Where it fails:** Honoré's theory relies on a causal link between the agent's specific conduct and the specific harm. In your case, the causal link is severed by design. The designers did not cause *this* death in the way a negligent driver does; they caused a *probability field* in which this death became actual. They are responsible for the *field*, not the *point*.

  **C. Tragic Choices (Calabresi & Bobbit)**
  *   **The Concept:** In law and sociology, this refers to situations where society must allocate life-saving resources (or burdens) unfairly (e.g., triage, military drafts). To protect social cohesion, we often mask the choice as "fate" or "medical necessity."
  *   **Where it fits:** This is the strongest parallel. Your system is making a "tragic choice" (who is exposed to risk) via a rule rather than a direct decision.
  *   **Where it fails:** In traditional tragic choices, the goal is to *hide* the agency to reduce guilt. In your case, the agency is *acknowledged* ("we chose this policy"). The gap isn't about hiding the choice; it's about the inability to justify the *specific selection* of the victim.

  ### 2. The Missing Distinction: Distribution vs. Realization

  The distinction you are looking for is between **Responsibility for Risk Distribution** and **Responsibility for Harm Realization.**

  *   **Risk Distribution:** The macro-level decision to impose a certain profile of danger on a population (e.g., "0.001% chance of fatality per mile, distributed randomly"). The organization *can* bear this responsibility.
  *   **Harm Realization:** The micro-level event where the probability collapses into a specific victim (e.g., "Why did the 0.001% hit *Mr. Smith* on *Tuesday*?"). The organization *cannot* bear this responsibility in the same way, because by design, there is no "why."

  In standard negligence, the answer to "Why me?" is "Because they were careless near you."
  In your case, the answer to "Why me?" is "Because you were the variable that resolved."

  This is not just "Moral Luck." Standard moral luck is about the *world* surprising the agent (I drove drunk, but luckily no one was there). Your case is **Engineered Moral Luck**. The agent has deliberately outsourced the selection of the victim to a randomizer to avoid systematic bias. This makes the "Why me?" question morally sharper, not duller. It transforms the victim from a casualty of an accident into a **statistical sacrifice**.

  ### 3. Is the "Why Me?" Question Morally Significant?

  You asked whether the family's question is one moral theory should care about, or just a "retributive itch."

  It is **not** a retributive itch. It is a demand for **Recognition** (in the Hegelian sense) and **Particularized Justification** (in the Scanlonian sense).

  *   **Recognition:** To tell a victim "you were chosen by a randomizer" is to treat them as a member of a class (a data point) rather than as an individual person. Moral relationships require that harms be intelligible between persons. "The dice fell this way" is not an intelligible moral reason; it is a causal mechanism. Denying the victim a reason denies their status as a moral agent worthy of an explanation.
  *   **Particularized Justification:** T.M. Scanlon argues that we owe justifications to those affected by our rules. A general justification ("this saves more lives overall") satisfies the *population*, but it fails the *individual*. The gap you are sensing is the **Deficit of Particularized Justification.**

  If you ignore this, you are not just leaving a philosophical loose end; you are committing a **dignitary harm**. You are telling the family that their specific loss has no specific meaning other than statistical utility.

  ### 4. Proposed Terminology for Your Report

  Since no single canonical term exists, I recommend you adopt a descriptive term that fixes the boundary for your organization. I propose:

  **The Realization Gap**
  *(Alternative: The Specificity Deficit)*

  **Definition:** The moral distance between an agent's responsibility for imposing a known risk profile and their inability to provide a particularized reason for why a specific individual suffered the realized harm, specifically where the indeterminacy was a deliberate design feature.

  **Boundary Cases:**

  1.  **Ordinary Accident (Negligence):**
      *   *Scenario:* A human driver looks at their phone and hits a pedestrian.
      *   *Status:* **No Realization Gap.** The driver is responsible for the risk *and* the outcome. The "why" is answerable ("I was distracted").
  2.  **Ordinary Negligence (Systemic):**
      *   *Scenario:* A company ignores a known brake defect; a car crashes.
      *   *Status:* **No Realization Gap.** The company is responsible for the risk *and* the outcome. The "why" is answerable ("The brakes failed because we didn't fix them").
  3.  **Targeted Harm:**
      *   *Scenario:* A system is programmed to prioritize hitting intruders over trespassers.
      *   *Status:* **No Realization Gap.** The "why" is answerable ("You were classified as an intruder").
  4.  **Trivial Undetermined Harm:**
      *   *Scenario:* A delivery bot randomly chooses a sidewalk path, brushing a pedestrian's coat. No injury.
      *   *Status:* **Latent Realization Gap.** The structure is the same, but the moral stakes are too low to trigger the demand for particularized justification. The gap exists but is morally dormant.
  5.  **Your Case (Designed Randomization):**
      *   *Scenario:* The bot randomizes to avoid systemic bias; a death occurs.
      *   *Status:* **Active Realization Gap.** Responsibility for the risk is clear; responsibility for the specific victim is structurally unanswerable.

  ### 5. Recommendation for the Report

  When writing your internal report, you should argue that accepting responsibility for the *design* is necessary but insufficient for moral repair.

  If the organization says, "We accept responsibility for the policy," but cannot answer "Why him?", the family hears: "We accept responsibility for using you as a variable."

  To bridge the **Realization Gap**, the organization cannot provide a *causal* reason (because there isn't one), but it must provide a **moral acknowledgment**. This means:
  1.  Refusing to hide behind the randomness (do not say "it was an unavoidable accident").
  2.  Explicitly acknowledging that the individual bore a burden that was designed to be distributed (acknowledge the sacrifice).
  3.  Offering redress that is not based on fault, but on **solidarity** (e.g., "You were harmed by a system we built for society; society owes you," rather than "We were negligent").

  **Summary:** You are describing the **Realization Gap** within **Engineered Moral Luck**. The family's question is morally valid because it demands recognition of their individuality against a system that treated them as a statistic. Ignoring this distinction will make your "acceptance of responsibility" sound like bureaucratic evasion, even if it is technically truthful.
