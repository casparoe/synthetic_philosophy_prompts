answer: |-
  This is a sophisticated observation that cuts to the heart of contemporary debates in experimental philosophy and moral psychology. You have identified a robust intuition pump that drives much of our everyday moral practice, yet you are correct that it lacks a single, canonical label like "the Fundamental Attribution Error."

  However, this phenomenon is not unnamed in the literature; rather, it is distributed across several overlapping concepts. To give you the conceptual mapping you request, we must locate your observation within the debates surrounding **Folk Compatibilism**, the **Deep Self Model**, and the **Bypassing Hypothesis**.

  Here is a precise delimitation of the phenomenon, its relation to existing taxonomy, and an analysis of the "combined" edge case.

  ### 1. Does it have a name?

  There is no single term equivalent to "Cognitive Dissonance," but the phenomenon is most precisely described in the literature as **The Reasons-Mechanism Asymmetry** or, more technically, as an instantiation of **The Bypassing Hypothesis** within **Folk Compatibilism**.

  *   **Folk Compatibilism:** Experimental philosophers (notably Shaun Nichols, Joshua Knobe, and Eddy Nahmias) have demonstrated that ordinary people are largely compatibilist. They do not withdraw blame simply because an action was causally determined. However, your observation adds a crucial nuance: *which kind* of determination matters.
  *   **The Bypassing Hypothesis:** Proposed by Eddy Nahmias, this suggests that people only view determinism as threatening to responsibility when they interpret the causal chain as **bypassing** the agent's mental states (beliefs, desires, reasoning).
      *   **Mechanistic Explanations** (trauma, neurochemistry) are intuitively processed as *bypassing* the agent's rational capacities. The cause flows *around* the agency.
      *   **Rational Explanations** (calculation, strategy) are processed as *flowing through* the agent's rational capacities. The cause flows *through* the agency.
  *   **Deep Self Concordance:** Chandra Sripada and Joshua Knobe argue that we hold agents responsible when actions concord with their "Deep Self" (their stable values and character). Mechanistic causes are viewed as **alien intrusions** (external to the Deep Self), whereas rational calculations are viewed as **expressions** (internal to the Deep Self), even if both are deterministically produced.

  Therefore, the specific bias you are observing is the **Alienation vs. Expression Asymmetry**. We excuse causes that alienate the agent from the action (mechanism) and blame causes that express the agent in the action (rationality), regardless of the metaphysical status of determinism.

  ### 2. Conceptual Mapping: What it is and What it is not

  To delimit this precisely, we must distinguish it from similar biases.

  #### What it is NOT:
  *   **It is not the Fundamental Attribution Error (FAE):** The FAE concerns the over-attribution of behavior to dispositional traits rather than situational factors. Your asymmetry persists even when the "situation" (the causal history) is fully acknowledged. In your scenario, the interlocutors accept the causal explanation; they simply weigh its *moral relevance* differently based on its content.
  *   **It is not the Knobe Effect (Side-Effect Asymmetry):** The Knobe Effect concerns whether a side effect is judged as "intentional" based on its moral valence (bad side effects are deemed intentional; good ones are not). Your observation concerns the *explanation of the primary action*, not the classification of side effects.
  *   **It is not simple Hypocrisy:** It is not necessarily inconsistent to treat these cases differently. A compatibilist would argue this distinction is *correct*, not biased. The asymmetry only becomes a "bias" if one assumes hard incompatibilism (that determinism always undermines blame).

  #### What it IS:
  *   **A Commitment to Reasons-Responsiveness:** The pattern reveals that our reactive attitudes are not tracking "freedom from causation" but **"freedom within causation."** We are tracking whether the causal chain respected the architecture of practical reasoning.
      *   *Mechanism:* The causal chain short-circuits reasoning (e.g., a seizure, a dopamine spike).
      *   *Rationality:* The causal chain utilizes reasoning (e.g., cost-benefit analysis).
  *   **The Intentional Stance (Dennett):** We are cognitively predisposed to adopt the "intentional stance" toward entities that act rationally. Once we adopt this stance, we treat the entity as a locus of responsibility. Mechanistic explanations force us into the "physical stance" (treating the human as a broken machine), which inhibits reactive attitudes.
  *   **Moralized Rationality:** The pattern reveals a tacit commitment that **rationality is the locus of the moral self.** If a cause engages your rationality, it engages *you*. If it bypasses it, it engages only your biology.

  ### 3. The Combined Case: Rational Exploitation of Vulnerability

  You ask how this holds when mechanistic and agential explanations are combined (e.g., an agent rationally exploits a psychological vulnerability caused by trauma). This is the critical stress test for the asymmetry.

  In the literature, this is handled via the **Tracing Strategy** and the **Screening Off Condition**.

  *   **The Tracing Strategy:** Responsibility can be traced back to an earlier point where the agent had control. If the agent *knowingly* cultivated the vulnerability or failed to mitigate it when they could have, the rational exploitation "traces" back to a culpable omission.
  *   **The Screening Off Condition:** Does the mechanistic cause "screen off" the rational cause?
      *   *Case A (Mitigation):* If the trauma is so severe that it distorts the rational calculation itself (e.g., the agent genuinely believes the violence is necessary for survival due to hypervigilance), the mechanistic cause **screens off** the rationality. The rationality is compromised. Here, the objective attitude tends to win.
      *   *Case B (Reinforcement):* If the trauma created a vulnerability (e.g., a need for status) but the agent *clear-sightedly* chose harmful means to satisfy it, the rationality **screens off** the mechanism. The mechanism is treated as background context (a "hand you were dealt"), but the rational play of that hand is treated as the locus of responsibility.

  **The Asymmetry in the Combined Case:**
  In practice, interlocutors often struggle here. The pattern you observed suggests they will default to **blame** unless the mechanistic element is framed as *compelling* rather than *influencing*.
  *   If the explanation is "Trauma made him seek status, and he calculated violence was the best way," listeners often treat the trauma as **mitigating context** but the calculation as **culpable action**.
  *   This reveals that the **Rational/Agential explanation has a higher "moral gravity"** than the Mechanistic one. It takes a very strong mechanistic claim (e.g., "irresistible impulse") to override a rational explanation.

  ### 4. Unacknowledged Commitments in Reactive Practices

  Your observation reveals two unacknowledged commitments in our Strawsonian practices:

  1.  **The Hierarchy of Causal Explanations:** We implicitly rank causal explanations. "Reasons" are not just another type of cause; they are *status-conferring* causes. "Mechanisms" are *status-reducing* causes. We are not pure Strawsonians; we are **Reasons-Responsiveness Compatibilists** who use Strawsonian attitudes as the enforcement mechanism.
  2.  **The Integrity of the Agent:** We assume that an agent is identical with their rational capacities. When a mechanism influences the agent, we ask: "Did this change *who they are* (their values/rationality) or did it just change *what they want*?"
      *   If the cause alters the *capacity* to reason (clinical), we excuse.
      *   If the cause alters the *inputs* to reasoning (trauma/ideology) but leaves the capacity intact, we blame.

  ### Summary Recommendation for Teaching

  If you need a label for your classroom to crystallize this concept, I recommend coining or adopting the term **"The Bypassing Asymmetry"** (referencing Nahmias) or **"The Alienation Condition."**

  You can frame it to students this way:
  > "We do not excuse actions because they are caused; we excuse them because they are caused in a way that **alienates** the agent from the action. Mechanistic explanations suggest alienation (the body acted, not the self). Rational explanations suggest identification (the self acted, via calculation). The asymmetry lies in our intuition that determinism bypasses the self only when it bypasses reason."

  This captures the nuance without conceding that the intuition is necessarily erroneous, while acknowledging the tension you rightly identified regarding the deterministic nature of both explanations.
