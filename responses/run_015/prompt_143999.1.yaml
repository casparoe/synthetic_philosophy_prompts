  **Note on Neuroscience and Form**

  This poem adopts the "two-minds" hypothesis, asserting that the separation of hemispheres produces distinct centers of consciousness rather than a single mind with disrupted communication. The form enacts this fragmentation: the sestina's recursive end-words trap the left hemisphere in an obsessive loop of confabulation, preventing the narrative from ever achieving the "whole" it claims to represent.

  Regarding the neuroscience, the poem takes a specific liberty concerning the anterior commissure. In classic split-brain cases (e.g., Sperry and Gazzaniga's subjects), the anterior commissure was typically severed along with the corpus callosum to prevent seizure propagation, resulting in near-total hemispheric isolation. Here, the poem posits a partial callosotomy sparing the anterior commissure, allowing subcortical emotional signals (fear, dread) to cross while blocking propositional language and voluntary motor commands. This configuration heightens the left hemisphere's confusion: it feels emotions it did not cognitively generate, forcing it to confabulate explanations for feelings originating in the right hemisphere. While some contemporary researchers argue for a unified consciousness with disconnected modules, this poem defends the contested view that hemispheric independence is sufficient for dual agency, using the spared commissure not to unify the self, but to haunt the left hemisphere with evidence of its own incompleteness.
