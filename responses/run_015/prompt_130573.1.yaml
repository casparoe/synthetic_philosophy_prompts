      *Drafting the response:*
      The analogy breaks down because the separation principle shields the artwork from external biographical context, not from the internal moral properties that constitute the artwork itself. When you separate the artist from the art, you are rejecting the genetic fallacy, which asserts that the origin of a thing determines its value; this ensures that the aesthetic object is judged on what it presents, not on who made it. However, the cruelty depicted within a narrative is not an external origin story but an intrinsic feature of the aesthetic object, contributing directly to its tone, themes, and emotional impact. If a novel gleefully depicts torture, that moral stance is woven into the fabric of the writing style and character development, meaning evaluating it is not an external moralizing attack but an assessment of the work's internal coherence and artistic vision. Therefore, claiming moral contamination diminishes artistic value is not a failure of consistency but a recognition that moral defects within the text can function as aesthetic defects, whereas the author's biography remains irrelevant to the text's formal properties. The separation principle was never designed to sanitize content, but rather to prevent the conflation of the creator's sins with the creation's merits.

