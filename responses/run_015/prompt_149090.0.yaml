answer: |-
  **MEMORANDUM**

  **TO:** Managing Editor, Associate Editors
  **FROM:** Editors-in-Chief
  **SUBJECT:** Standard Operating Procedure: Errata and Matters-Arising Triage
  **EFFECTIVE:** Immediately

  ### 1. The Core Constraint
  We sign a boilerplate statement affirming we have **verified** the correction. This is a claim of truth, not just process. Because the stakes are asymmetric (publishing a false correction damages the record more than ignoring a true one), this procedure prioritizes avoiding False Positives over catching False Negatives.

  We operate with three confidence levels. Do not use numbers.
  *   **HIGH:** Documentary evidence or logical proof that would hold up in a formal dispute. (Required for Retractions).
  *   **SOLID:** Strong evidence, expert consensus, or clear factual error. (Required for Published Notes).
  *   **TENTATIVE:** Plausible interpretation, missing data, or unresolved dispute. (Result: Do Nothing or Request Reply).

  ---

  ### 2. The Decision Procedure

  **Step 1: The Verifiability Stop**
  *   **Question:** Is the claim falsifiable against public record, text, or formal proof?
  *   **Sufficient Answer:** "Yes, we can check the math/text/data against the published version."
  *   **Stop Condition:** If the claim rests on *interpretation* (e.g., "The author misunderstood Kant," "The argument fails because..."), confidence caps at **TENTATIVE**.
  *   **Action:** If caps at TENTATIVE, **DO NOT PUBLISH AS CORRECTION.** (May be suitable for a peer-reviewed "Commentary" instead, but not an Erratum).

  **Step 2: Risk Shape Identification**
  Identify which of the three risk shapes the note presents. This determines how we aggregate confidence.

  *   **Shape A: The Flat Spread (Lottery Shape)**
      *   *Description:* Many independent claims (e.g., "12 typos," "5 citation errors"). Error is likely somewhere, but we don't know where.
      *   *Rule:* Confidence degrades with volume. You cannot have **SOLID** confidence in a set of 10 claims if you only checked 2.
      *   *Action:* If >5 independent claims, require **HIGH** confidence on a random 20% sample. If any fail, reject the whole note.

  *   **Shape B: The Cluster (Localizable Risk)**
      *   *Description:* Errors concentrated in a specific section (e.g., "The formal appendix," "Table 3").
      *   *Rule:* The section is the unit of verification.
      *   *Action:* Verify the cluster boundary. If the appendix relies on a definition that is disputed, the whole cluster is **TENTATIVE**. If the cluster is purely mechanical (labels, sums), verify all.

  *   **Shape C: The Chain (Conjunction Shape)**
      *   *Description:* The note's conclusion depends on multiple steps (Claim A *and* Claim B *and* Claim C must be true for the correction to hold).
      *   *Rule:* The confidence of the note is the confidence of the *weakest link*.
      *   *Action:* Identify the shared step. If the shared step is **TENTATIVE**, the note is rejected. Do not average the strengths.

  **Step 3: The Missing Information Protocol**
  *   **Scenario:** Original author does not reply within the 10-day window.
  *   **Rule:** Silence is not consent. It is missing data.
  *   **Action:**
      *   If **Shape B (Cluster)** and objectively checkable by us (e.g., math error): We verify internally. If **SOLID**, publish.
      *   If **Shape A or C** or interpretive: Default to **DO NOTHING**. We cannot verify without their input.

  **Step 4: The Value Flag (EIC Decision Only)**
  *   **Trigger:** Any of the following apply:
      *   The original author is a first-time publisher.
      *   The correction implies misconduct (not just error).
      *   The correction requires a Retraction rather than a Note.
      *   The note comes from a prolific critic against a single target (potential harassment).
  *   **Action:** Associate Editor/Managing Editor must pause and flag for EIC. We weigh the career cost against the record cost. The procedure does not decide this.

  **Step 5: The Signature Check**
  *   **Question:** Can I sign "The editors have verified this correction" without reservation?
  *   **Rule:** If the Risk Shape is **C (Chain)**, you are signing a conjunction. If any link is not **HIGH**, you cannot sign.
  *   **Action:** If you cannot sign the boilerplate, you cannot publish the note. Offer the author a "Commentary" submission track instead (peer-reviewed, no verification boilerplate).

  ---

  ### 3. Limitations of This Procedure

  1.  **It cannot solve the "Truth" problem.** It only manages our *assertion* of truth. We will still publish errors. This procedure ensures we do not *knowingly* publish errors we could have caught via structure.
  2.  **It creates a "Commentary" backlog.** Many notes that feel like corrections are actually interpretive disputes (Shape C, Step 1). These will be rejected as Errata. Authors will complain. Stand firm.
  3.  **It is slow for Shape A.** Verifying a random sample of 12 claims takes time. If we cannot do it in 10 days, the note is rejected. Speed is a constraint on truth.
  4.  **Blanket Caveats are Noise.** Do not add "Editors assume no liability" footnotes to specific papers. It signals uncertainty where we have asserted verification. Only use if the procedure forces a "Tentative" publication (which it shouldn't).

  ---

  ### 4. The Paradox Question: Lottery vs. Preface

  You asked if the Lottery and Preface shapes collapse in practice.
  **Yes, they do.**

  *   **The Theory:** In the *Preface*, it is rational to believe every claim in your book while believing the book contains an error. In the *Lottery*, it is irrational to believe of any single ticket that it will lose, even if it probably will.
  *   **The Practice:** When we publish a correction note, we are not stating our private beliefs (Preface). We are issuing a public verification (Lottery). The boilerplate forces us to assert the *conjunction* of the claims ("We have verified [A & B & C]").
  *   **The Collapse:** Even if we have **SOLID** confidence in A, B, and C individually (Preface style), we cannot assert [A & B & C] if the risk structure makes the conjunction likely false (Lottery style). Because we must sign the conjunction, we must treat multi-claim notes as Lottery tickets: high individual probability is insufficient for collective acceptance.
  *   **Operational Rule:** Never use the Preface logic ("We know we make mistakes, but this one looks good") to override the Lottery logic ("There are 12 claims, so one is probably wrong"). The signature binds us to the Lottery logic.

  ---

  ### 5. Test Cases

  #### Case 1: The Interpretive Chain
  *   **Scenario:** Note argues a paper fails. Requires Sub-claims A, B, and C. All interpretive. All individually plausible.
  *   **Risk Shape:** **Shape C (The Chain).** The argument fails only if A *and* B *and* C hold.
  *   **Verifiability:** **Step 1 Fail.** Claims are interpretive, not factual. Confidence caps at **TENTATIVE**.
  *   **Procedure Output:** **REJECT as Erratum.**
  *   **Reasoning:** You cannot sign "Verified" on an interpretive chain. The confidence in the conjunction is lower than the weakest link, which is already capped at Tentative.
  *   **Alternative:** Invite as a "Commentary" or "Discussion Note" (peer-reviewed, no verification boilerplate). This preserves the author's voice without binding the journal to the truth of the interpretation.

  #### Case 2: The Silent First-Timer
  *   **Scenario:** Figure mislabeled. Checkable. First-time author. No reply in 10 days.
  *   **Risk Shape:** **Shape B (The Cluster).** Localizable to the figure.
  *   **Verifiability:** **Step 1 Pass.** Objectively checkable against data/text.
  *   **Missing Info:** Author silent.
  *   **Procedure Output:** **VERIFY INTERNALLY.**
      *   If the error is obvious (e.g., axis says "Years" but data is "Dollars"): **PUBLISH NOTE.** (Confidence **SOLID**).
      *   If the error requires raw data we don't have: **DO NOTHING.** (Confidence **TENTATIVE**).
  *   **Value Flag:** **EIC REVIEW.** Because it is a first-time author, a published correction might be career-damaging.
      *   *EIC Decision:* If the error is trivial, suppress the note and email the author privately. If the error invalidates the result, publish the note but frame it charitably ("Author acknowledges..."). The procedure says Publish; Values says Mitigate.

  #### Case 3: The Twelve-Point Appendix (The Hard Truth)
  *   **Scenario:** 12 corrections to formal appendix. Prolific critic. You (EIC) handled the original paper and want it to be fine.
  *   **Risk Shape:** **Shape A (The Flat Spread).** 12 independent claims.
  *   **Verifiability:** **Step 1 Pass.** Formal proofs are checkable.
  *   **Aggregation:** **Shape A Rule.** >5 claims requires **HIGH** confidence on 20% sample (3 claims).
  *   **Procedure Output:** **SAMPLE CHECK.**
      *   You must verify 3 of the 12 claims to **HIGH** confidence within 10 days.
      *   *If any of the 3 fail:* **REJECT THE NOTE.** (The critic is unreliable).
      *   *If all 3 pass:* **VERIFY REMAINING 9.**
  *   **The Bite:** You likely cannot verify 12 formal claims to **HIGH** confidence in 10 days while managing the journal.
  *   **Final Decision:** **REJECT as Erratum.**
  *   **Reasoning:** You cannot sign the boilerplate ("Verified") on a 12-claim bundle without full verification. The time cost exceeds the triage window.
  *   **Alternative:** Tell the critic: "This constitutes a substantive challenge to the formalism. Please submit as a target article for peer review."
  *   **Why this hurts:** You wanted the paper to be fine. If the critic is right, the paper has 12 errors. By rejecting the *Erratum*, you keep the paper looking clean *for now*, but you kick the can to peer review. If the peer review confirms the errors, the paper is still damaged, but the *Journal's* verification process remains unimpeachable. You are protecting the Journal's signature, not necessarily the Original Paper's truth. This is the cost of the asymmetric stakes.

  ---

  **Summary for the Managing Editor:**
  1.  **Checkable?** No -> Reject as Erratum.
  2.  **How many claims?** >5 -> Sample check. Fail one -> Reject all.
  3.  **Chain of logic?** One weak link -> Reject.
  4.  **Author silent?** Only publish if we can verify 100% ourselves.
  5.  **Can you sign "Verified"?** If not, do not publish.

  **End of Procedure.**
