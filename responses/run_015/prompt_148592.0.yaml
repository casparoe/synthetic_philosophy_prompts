answer: |-
  In the microdomain of analogical figure–ground judgment, the traditional distinction between object and context is decoupled from perceptual salience. Here, a region is not designated as "figure" because it is brighter, larger, or more enclosed, but because it occupies a specific node within a relational network. The "ground" is not merely empty space, but the structural context that sustains the figure's role. In this domain, the boundaries of the concept *figure* are not fixed lines awaiting discovery, but dynamic tensions generated by the relational system itself. Consequently, conceptual slippage—the shifting application of the concept to borderline cases—must be understood not as a failure of boundary enforcement, but as the concept's proper mechanism of extension. This extension is legitimate only when it crosses a "structural resonance threshold," a constraint that prevents arbitrariness without relying on fixed prototypes or external architectural rules.

  To understand why slippage is ontological rather than epistemic, one must first recognize the nature of the entities involved. In a purely relational microdomain, an entity's identity is exhaustively defined by its connections to other entities. There is no intrinsic "thing-ness" independent of its position in the structure. Therefore, the status of a region as figure or ground is not a property inherent to the region, but a function of the coherence of the relations it supports. When the relational structure shifts, the identity of the region shifts with it. If the concept of *figure* were rigid, it would fail to track the reality of the domain, where identity is fluid by definition. A rigid concept would impose an artificial stability onto a system defined by variability. Thus, the capacity of the concept to slip—to stretch its application to new regions—is not a sign of human confusion or computational error; it is the only way the concept can remain truthful to the ontological fluidity of the relational space.

  The challenge arises in borderline cases. Consider a region that satisfies the canonical containment or adjacency relations required to be a figure, yet lacks the typical prominence or centrality usually associated with that status. In a perceptual domain, low salience would relegate this region to the background. In the analogical microdomain, however, salience is secondary to structure. The question becomes: does the presence of the correct relations suffice to make the region a figure, even if the relations feel "weak" or peripheral? If we say yes unconditionally, we invite trivial permissiveness, where any region with a single matching relation claims figure-status. If we say no unconditionally, we freeze the concept, rendering it incapable of handling novel structural configurations.

  The resolution lies in the structural resonance threshold. This threshold is not a count of features, nor a measure of similarity to a central ideal. It is a measure of the *density of interlocking correspondences* required to sustain the relational role. For a concept to extend to a borderline case, the relational web surrounding that case must vibrate with sufficient coherence. A single matching relation (e.g., "A is adjacent to B") is structurally inert; it is a point of contact, not a structure of support. However, when adjacency is compounded by mutual constraint, directional flow, and hierarchical nesting, the relations begin to reinforce one another. This reinforcement creates resonance.

  The threshold blocks purely accidental similarities because accidental similarities are, by definition, isolated. An accidental match is a singular correspondence that does not bear the weight of the surrounding structure. It lacks the density required to trigger resonance. For example, a region might share a containment relation with a canonical figure, but if that containment does not participate in the broader causal or logical flow of the system, it remains structurally silent. It does not "ring" with the rest of the structure. The structural resonance threshold demands that the relations do not merely exist, but that they *work together* to uphold the role of the figure. If the relations are sparse or disconnected, the threshold is not met, and the slippage is blocked. This prevents trivial permissiveness not by appealing to a rulebook, but by appealing to the internal physics of the structure itself. The structure simply cannot support the weight of the concept if the relational density is too low.

  This mechanism avoids the need for fixed prototypes. A prototype model suggests that there is a "best example" of a figure, and new cases are judged by their distance from this ideal. But in a relational microdomain, there is no privileged center. Every node is defined by its neighbors. To judge a borderline case by a prototype would be to import an external standard into a system that generates its own meaning internally. The structural resonance threshold is internal to the specific instance. It asks: "Does the structure *here*, in this specific configuration, support the designation of figure?" It does not ask: "Is this like the typical figure?" The legitimacy of the extension is determined by the local integrity of the relations, not by global comparison to a stored memory.

  Furthermore, this approach treats fluidity as an ontological feature. If the threshold were merely an epistemic heuristic—a way for a limited judge to cope with complexity—we would expect that a perfect judge would find a hard boundary. But in this microdomain, a perfect analysis reveals that the boundary is generated by the interaction of relations. As relations strengthen or weaken, the boundary moves. The "figure" emerges from the ground only when the relational tension reaches a critical mass. Below that mass, the region remains ground, not because it is forbidden from being a figure, but because the ontological conditions for figure-hood (structural support) are not present. Above that mass, it becomes a figure, not because a rule was followed, but because the structure now sustains that identity. The slippage is the movement of this emergence point.

  Therefore, conceptual slippage is the engine by which the concept navigates the continuous variation of relational space. Without it, the concept would shatter against the complexity of borderline cases. With it, constrained by the structural resonance threshold, the concept remains robust. It allows for extension into novel territories where containment and adjacency hold without salience, provided the relational density is sufficient to make the structure hold together. This ensures that the concept is neither too rigid to function nor too loose to mean anything. The boundary is not a wall that slippage breaks down; the boundary is the horizon of structural resonance, and slippage is the act of moving that horizon as the relational landscape shifts. In this light, the fluidity of the figure–ground distinction is not a defect of judgment, but a faithful reflection of a domain where identity is constituted by connection, and connection is inherently a matter of degree.
