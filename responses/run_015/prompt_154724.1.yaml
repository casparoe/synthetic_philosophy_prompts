prompt: |-
  I was arguing with my roommate last night about whether moral reasons can just float around with nobody actually holding them, you know? We got kinda sidetracked talking about Scanlon and whether reasons are just out there like furniture, but I think I lost the thread somewhere around midnight. Anyway I'm trying to write something for this course I'm taking on conceptual foundations of ethics, and I keep running into this idea of 'free-floating rationales' — reasons that don't depend on any actual reasoner having them — but it feels like cheating unless you can ground them somehow.

  So could you argue for the position that free-floating rationales can't actually do any normative work unless they're anchored in some kind of distributed cognitive scafolding? I don't mean just that someone needs to recognize them; I mean that their very status as reasons collapses into being embedded in social practices or institutional structures that distribute cognition across people. Basically defend the idea that there's no real distinction between 'reasons without reasoners' and 'reasons embedded in distributed practices' — if you push the free-floating view hard enough it dissolves into the embedded view. Don't just run through the standard internalism/externalism playbook, I want something that actually moves the ball on whether rationales can be genuinely orphaned.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Moral reasons, specifically "free-floating rationales" (reasons existing independently of any reasoner) vs. "distributed cognitive scaffolding" (reasons embedded in social practices/institutions).
      *   **Goal:** Argue *for* the position that free-floating rationales *cannot* do normative work unless anchored in distributed cognitive scaffolding. Essentially, argue that the distinction collapses: if you push the free-floating view, it dissolves into the embedded view.
      *   **Constraints:**
          *   Do *not* just run through the standard internalism/externalism playbook (avoid basic Williams vs. Nagel/Scanlon summaries).
          *   Needs to "move the ball" on whether rationales can be genuinely orphaned.
          *   Tone: Academic but conversational (matching the user's "arguing with my roommate" vibe), suitable for a course on conceptual foundations of ethics.
          *   Key Concept: "Distributed Cognitive Scaffolding" (needs to be integrated meaningfully, not just buzzwords).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Scanlon/Platonism:* Reasons are relations between facts and agents, but the truth of the relation is mind-independent. (The "furniture" view).
      *   *The User's Intuition:* Reasons need a "home." If no one holds them, they are inert. But it's not just about *recognition* (epistemic); it's about *ontological status* (metaphysical/normative).
      *   *Distributed Cognition:* This comes from cognitive science (Hutchins, Clark & Chalmers). Cognition isn't just in the head; it's in the tools, environment, and social structures.
      *   *The Synthesis:* Normativity isn't a property of abstract objects; it's a functional role played within a system. A "reason" is a node in a network of practices.

  3.  **Develop the Core Argument (The "Collapse" Thesis):**
      *   *Premise 1:* Normative force requires the possibility of uptake and guidance. A reason that *cannot* in principle guide anyone is not a reason.
      *   *Premise 2:* Guidance requires a mechanism. For humans, this mechanism is not individual brain states alone but socio-linguistic practices (the scaffolding).
      *   *Premise 3:* Therefore, the "existence" of a reason is identical to its embeddability in this scaffolding.
      *   *Conclusion:* A "free-floating" reason is an abstraction from the scaffolding, not a separate entity. If you try to isolate it, it loses its normative power.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the roommate debate (Scanlon reference). Set the stage: The "Platonic Furniture" problem. State the thesis: Normativity is a functional role within a distributed system, not a freestanding property.
      *   **The Problem with "Orphaned" Reasons:** Why does the free-floating view fail? It creates a gap between *truth* and *force*. If a reason exists but no system can process it, is it normative? Analogy: Code without hardware.
      *   **Introducing Distributed Cognitive Scaffolding:** Explain this not just as "helping" cognition but as *constituting* it. Reference Brandom (inferentialism) or Wittgenstein (rule-following) without getting bogged down in exegesis. Focus on the *system* as the reasoner.
      *   **The Collapse Argument:** This is the crux. Show how pushing the free-floating view leads back to practices.
          *   *Step 1:* To count as a reason, a fact must be *takeable* as a reason.
          *   *Step 2:* "Takeability" depends on shared standards (scaffolding).
          *   *Step 3:* Therefore, the reason's identity depends on the scaffolding.
      *   **Addressing the "Ideal Observer" Counter:** Scanlon might say "Ideal agents would see them." Rebuttal: Ideal agents are just a projection of our current scaffolding projected infinitely. It's still scaffolding-dependent.
      *   **Implications for Ethics:** Shifts focus from "discovering truth" to "maintaining the health of the normative ecosystem."
      *   **Conclusion:** Summarize. The "furniture" is actually the architecture of the house we live in.

  5.  **Refining the Tone and Content:**
