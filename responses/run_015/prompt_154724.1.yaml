answer: |-
  This is a fantastic angle for a paper. You're basically trying to bridge meta-ethics with philosophy of mind and cognitive science, specifically targeting the ontology of reasons. The standard Internalism/Externalism debate often gets stuck on *motivation* (does the reason have to move me?), but you're asking about *constitution* (what makes a reason a reason in the first place?).

  Here is an argument structure you can adapt. It moves away from the "motivation" trap and focuses on the **functional conditions of normativity**. The core claim is that normativity is a systemic property, not an atomic one.

  ### Title Idea: *The Architecture of Normativity: Why Free-Floating Reasons Collapse into Distributed Scaffolding*

  #### 1. The Problem of Normative Inertia
  Start by diagnosing the "Platonic Furniture" view (the Scanlon-adjacent position you were debating). The view holds that reasons are mind-independent relations. For example, "Pain is a reason to avoid X" is true even if no sentient being exists to recognize it.

  **The Critique:** This view creates a problem of *Normative Inertia*. If a reason is truly free-floating—completely detached from any cognitive architecture capable of processing it—it loses its distinctive "normative" character and becomes merely a "natural" fact.
  *   **Argument:** A reason, by definition, is something that *counts in favor* of an action or attitude. "Counting" is a functional role. For something to count, there must be a system of counting.
  *   **Analogy:** Consider a line of code. Does the code "compute" anything if it is written on a piece of paper and locked in a vault with no computer to run it? We might say it contains *potential* computation, but its status *as* an algorithm is dependent on the existence of hardware architecture capable of executing it. Similarly, a "free-floating reason" is like code without hardware. It lacks the machinery required to actualize its normative force.

  #### 2. Distributed Cognitive Scaffolding as the "Hardware" of Reasons
  Here is where you bring in your specific constraint. You need to define "Distributed Cognitive Scaffolding" not just as tools we use to think, but as the environment that *makes thinking possible*.
  *   **The Move:** Normativity isn't located in individual heads (Internalism) nor in a magical third realm (Platonism). It is located in the **social-institutional interface**.
  *   **Explanation:** Human cognition is deeply distributed. We think using language, logical rules, legal systems, and moral institutions. These aren't just ways we *discover* reasons; they are the structures that allow reasons to *exist* as normative entities.
  *   **Key Claim:** A "reason" is a node in a network of inferential practices (think Brandom here, but keep it focused on cognition). To say "X is a reason for Y" is to make a move in a social game that is sustained by distributed cognitive scaffolding (laws, norms, language, education).
  *   **Implication:** Without the scaffolding, the "reason" has no traction. It's not that we fail to *see* the reason; it's that the reason *is* the traction within the system.

  #### 3. The Collapse Argument (The Core of Your Paper)
  This is the section that "moves the ball." You argue that if you push the free-floating view hard enough, it secretly relies on the embedded view to make sense.

  *   **Step 1: The Uptake Condition.** For a fact to function as a reason, it must be *takeable* as a reason. It must be possible for an agent to grasp it and let it guide action.
  *   **Step 2: The Sociality of Uptake.** What makes a fact "takeable"? It's not just individual psychology. It requires shared concepts, public language, and institutional validation. (e.g., "This is a promise" is only a reason to act because we share the institution of promising).
  *   **Step 3: The Dissolution.** The Platonist says, "But the reason exists even if the institution collapses!"
      *   **Your Rebuttal:** If the institution collapses, the *concepts* required to formulate the reason dissolve. Without the distributed scaffolding of language and practice, you don't have "moral reasons" floating around; you just have brute physical facts.
      *   **Conclusion:** The "free-floating reason" is actually an **abstraction** from the distributed system. It's like saying "the economy exists even if no one trades." No, the economy *is* the trading. Reasons *are* the normative practices distributed across agents.

  #### 4. Addressing the "Ideal Agent" Counter-Argument
  A Scanlon defender will say: "Reasons exist because an *ideal* agent would recognize them, even if actual agents don't."
  *   **Your Counter:** The "Ideal Agent" is just a projection of our current scaffolding. When we imagine an ideal reasoner, we are imagining a being embedded in a perfect version of *our* logical and normative practices. We are not imagining a being outside of all cognitive scaffolding.
  *   **The Kicker:** Therefore, even the "Ideal Agent" argument smuggles in distributed cognition. It relies on the coherence of practices (logic, consistency, valuation) that are inherently structural and distributed. There is no "view from nowhere" for reasons; there is only the "view from everywhere" (the distributed system).

  #### 5. Why This Matters (Normative Work)
  Finish by explaining why this isn't just semantic hair-splitting.
  *   **If reasons are free-floating:** Moral progress is about *discovery* (finding the furniture).
  *   **If reasons are embedded:** Moral progress is about *engineering* (improving the scaffolding).
  *   **The Payoff:** This view explains why moral reasons can feel objective (the scaffolding is robust and external to any single individual) without requiring spooky metaphysical objects. It grounds normativity in the real, tangible world of social interaction and cognitive extension.

  ### Key Philosophical Touchstones to Weave In (Without getting bogged down):
  *   **Robert Brandom:** Use his idea of "inferentialism" to support the idea that reasons are moves in a game, not objects.
  *   **Edwin Hutchins / Andy Clark:** For the "distributed cognition" aspect (cognition extends into the environment).
  *   **Wittgenstein:** The "rule-following" consideration. A rule (or reason) cannot guide you privately; it requires a public practice to have meaning.
  *   **John Searle:** Status functions (X counts as Y in context C). Reasons are often status functions created by collective intentionality.

  ### Sample Thesis Statement for Your Paper:
  *"This paper argues that the distinction between mind-independent moral reasons and reasons embedded in distributed cognitive scaffolding is illusory. By analyzing the functional requirements of normative guidance, I demonstrate that reasons cannot possess normative force in isolation; rather, their status as reasons is constituted by their embeddability within the social-institutional structures that distribute cognition across agents. Consequently, 'free-floating' rationales are best understood not as ontological primitives, but as abstractions derived from the stability of our shared normative practices."*

  ### Advice for the "Midnight Argument" Vibe
  Since you mentioned the roommate debate, you can use that intuition in the intro. Acknowledge that the "furniture" view feels intuitive because reasons *feel* objective. But then pivot: "Objectivity does not require independence from all minds; it only requires independence from *any single* mind." That's the sweet spot of distributed cognition. The scaffolding is objective because it's bigger than you, but it's not "free-floating" because it's made of us (our practices).

  This approach avoids the tired Internalism/Externalism loop and gives you a fresh, structural argument that fits perfectly with a course on conceptual foundations. Good luck with the writing!
