answer: |-
  **Final Examination: Contemporary Moral Philosophy**
  **Time Allowed: 1 Hour**

  **Question 1**

  Twelve towns share a regional power grid. For twelve weeks of summer, the operator must shed load. Two standing policies are available. Under the **Rota** policy, one town is disconnected for a full week at a time; the towns take turns, so each town has exactly one turn. Because the week is announced in advance, a town can plan around it (hiring generators, moving stock), so the cost to a town of its single turn is 5 units of burden. Under the **Dimming** policy, every town loses one randomly timed hour of power every day. This cannot be planned around; the eighty-four interruptions over the summer carry restart and spoilage costs totaling 12 units per town.

  At the grain of a single week, Rota imposes 5 units on one town and 0 on the others, while Dimming imposes 1 unit on each of the twelve. At the grain of the whole summer, Rota imposes 5 units on each town, while Dimming imposes 12 on each.

  **(a)** Does contractualism require us to assess these policies at the weekly grain or the summer grain? Consider whether a fine-grained principle (*at each occasion of choice, minimise the largest individual complaint*) is a genuine candidate principle. What would accepting such a principle rule out regarding burden-sharing institutions? Alternatively, is the coarse-grained comparison available without violating the individualist restriction? Explain why, and note any limitations of this move.

  **(b)** Consider a one-off version of the case: a single week, no future turns. The choice is between 5 units for one town and 1 unit each for twelve. Suppose further that each town suffers a genuine burden of 0.5 units of distress for every town affected by blackout (including themselves), due to sincere concern for neighbours. May a contractualist count such other-regarding components within an individual's complaint? Does this allow numbers to matter without summing complaints across persons, or is it aggregation smuggled in? Where the framework leaves a choice open, state which way you would go and defend it by appeal to the point of the individualist restriction.

  *Note: Do not restate the formula of reasonable rejectability. Do not use citations.*

  ***

  **Model Answer**

  Contractualism's individualist restriction forbids summing complaints across persons, but it does not dictate the temporal grain of comparison. In the summer-long case, the grain determines the verdict. At the weekly grain, the singled-out town bears 5 units versus 1 under Dimming; if principles are individuated weekly, Rota is reasonably rejectable by that town each week. At the summer grain, every town bears 5 units under Rota versus 12 under Dimming; here, everyone reasonably rejects Dimming. No cross-person summation is required to prefer Rota at the coarse grain; it is strictly better for each individual over the relevant period.

  However, insisting on the fine-grained principle is theoretically possible. It is general and respects individual complaints at the moment of choice. Yet, accepting it yields a reductio: it rules out ordinary turn-taking arrangements, rotas, and insurance schemes that concentrate burdens temporarily to spare everyone overall. If contractualism forbids institutions that benefit everyone over time because they burden someone at a specific moment, it becomes paralyzing. Thus, the coarse-grained comparison is preferable. It remains within the individualist restriction because the comparison is intra-personal (each town compares its own 5 vs. 12). The limitation is that this only works for recurring burdens among parties with comparable tenure; it cannot solve one-off cases where burdens cannot be time-shared.

  This leads to part (b). In the one-off case (5 vs. 1x12), direct complaints favor the single town (5 > 1). However, if complaints include other-regarding distress, the calculus shifts. Under Dimming, all twelve towns are affected. Each suffers 1 unit direct plus distress proportional to the number affected. If distress scales with affected towns, each town's complaint includes the weight of the collective tragedy. Under Rota, only one town suffers direct burden; others suffer only sympathy distress.

  Counting other-regarding components allows numbers to matter without summing across persons because the distress is a distinct burden borne by the sympathizer. My distress is part of *my* life going worse, not a second counting of *your* pain. However, the strongest objection is that this smuggles aggregation in by proxy: the same source of suffering (the blackout) generates multiple complaints (victim plus observers), effectively weighting the victim's plight by the audience size. This risks collapsing contractualism into utilitarianism, where the intensity of sympathy aggregates to outweigh direct harm.

  I defend counting these components but with a filter: other-regarding distress counts only if it does not merely replicate the direct victim's complaint. The point of the individualist restriction is to respect the separateness of persons. If my complaint is wholly constituted by your suffering, counting both respects neither. However, if the distress is a genuine, independent phenomenological burden on me—a distinct harm to my psychological integrity—it counts. In this case, since the distress scales with the number affected, it reflects a genuine concern for the community's health, not just a proxy for the victim. Therefore, Dimming becomes rejectable because each individual's total complaint (direct + sympathy) exceeds the Rota victim's complaint. This preserves the individualist restriction while acknowledging that our moral complaints are socially embedded.

  ***

  **Marking Scheme (25 Marks)**

  **1. Grain Mapping & Verdicts (5 marks)**
  *   **Must hit:** Correctly identifies that Weekly Grain favors Dimming for the singled-out town (5 vs 1), while Summer Grain favors Rota for everyone (5 vs 12). Explicitly states Summer preference requires no cross-person sum.
  *   **Common error:** Confusing the totals or claiming Summer comparison requires summing the 12 towns' burdens.

  **2. Fine-Grained Principle & Reductio (5 marks)**
  *   **Must hit:** Acknowledges fine-grained principle is a genuine candidate (it is general) but demonstrates it rules out beneficial burden-sharing institutions (rotas/insurance).
  *   **Common error:** Dismissing the fine-grained principle immediately as "obviously wrong" without showing what institutional practices it would forbid.

  **3. Coarse-Grained Justification & Residue (5 marks)**
  *   **Must hit:** Expl coarse-grained comparison is intra-personal (outside restriction) but notes the residue: this only works for recurring/time-shareable burdens, not one-off cases.
  *   **Common error:** Claiming coarse-graining solves all aggregation problems universally, ignoring the one-off limitation.

  **4. Other-Regarding Content & Numbers (5 marks)**
  *   **Must hit:** Explains how including sympathy allows numbers to matter (distress scales with affected count) without summing complaints (each complaint is individual). Distinguishes this from direct aggregation.
  *   **Common error:** Treating sympathy as direct aggregation across persons rather than content within a single person's complaint.

  **5. Objection & Defended Position (5 marks)**
  *   **Must hit:** Identifies the "double counting/proxy" objection (sympathy counts the victim's pain twice) and offers a defended filter or admission based on the *point* of the restriction (separateness of persons).
  *   **Common error:** Hedging without taking a position, or offering a filter without justifying it via the framework's purpose.

  ***

  **Note on the A/B Boundary**

  A **B-grade answer** will correctly map the mechanics: it will identify the grain problem, note that summer comparison is intra-personal, and observe that sympathy changes the complaint content. It will likely list the objections to sympathy but remain neutral or vague on the resolution.

  An **A-grade answer** will take a defended stance on *why* the framework permits or blocks these moves. It will explicitly connect the grain issue to the stability of moral institutions and the sympathy issue to the metaphysical point of the individualist restriction (e.g., arguing that sympathy counts only if it constitutes a distinct harm to the sympathizer's integrity, rather than a mere echo of the victim). It will prioritize argumentative coherence over comprehensive hedging.
