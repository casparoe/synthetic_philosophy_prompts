answer: |-
  hey, here's the draft for the sorting quiz. kept it in the weeds like you asked—avoided the standard benedict stuff and focused on the mechanics of the emotions themselves. i threw in those niche distractors ("prospective exposure", "reputational anxiety") in Q2 and Q5.

  there's a scoring key below that maps the patterns to the five leaves. i also added the meta-notes on the blur between 1/4 and the unoccupied logical combo at the end.

  there might be a typo or two, left it slightly rough so it feels like a handout.

  ***

  ### sorting quiz: guilt/shame architectures

  **instructions:** read each case. pick the option that best matches your intuitive judgment about what's happening or what *should* happen. don't overthink the labels—just go with the vibe of the action/feeling.

  **1. the anonymous ledger**
  you embezzled from a communal fund. no one knows. you can return the money anonymously with no penalty, or keep it and live with the secret.
  *   **A.** you return it. once the balance is restored, the moral debt is cleared. the feeling should vanish because the harm is fixed.
  *   **B.** you return it, but you still feel contaminated. the act doesn't wash off the fact that you're the kind of person who did this.
  *   **C.** the choice depends on the social architecture. in some systems, anonymous return works; in others, it bypasses the necessary reconciliation ritual.

  **2. the hermit's mirror**
  a person lives in total isolation for 20 years. they commit a private act they believe is wrong (no victims, no witnesses).
  *   **A.** they feel **prospective exposure** risk even alone—worrying about a hypothetical observer or future discovery. it's risk-management.
  *   **B.** they feel a stain on the self. the emotion persists because the defect is internal, not social.
  *   **C.** the question is malformed. without a social audience, the distinction between guilt and shame collapses into generic distress.

  **3. corporate liability**
  a company causes mass environmental harm. they can pay a massive fine (closed door) or issue a public apology (open door).
  *   **A.** pay the fine. restitution is the metric. if the damage is paid for, the moral equation is balanced.
  *   **B.** public apology is required. the institution's character is tarnished and needs public rehabilitation to be trusted again.
  *   **C.** neither works universally. some cultures treat fines as sufficient; others see them as bribes. the "better" option is structurally constrained.

  **4. child socialization**
  you're designing a curriculum to teach moral behavior to 7-year-olds.
  *   **A.** focus on the consequences of actions. "when you break X, you fix X." train the repair mechanism.
  *   **B.** focus on identity. "we are not people who break X." train the self-concept.
  *   **C.** focus on context. teach them to read the room and adjust behavior based on the social setting they are in.

  **5. digital permanence**
  a past mistake resurfaces online. the harm was minor, but the visibility is high.
  *   **A.** the primary pain is **reputational anxiety**. the feeling is about the spread of information, not the act itself.
  *   **B.** the pain is about the self. even if the internet forgot, you would still feel the defect.
  *   **C.** the pain is a mix. trying to separate "social fear" from "self-stain" is a folk taxonomy error. they're the same signal.

  **6. cross-cultural import**
  a "guilt-based" legal system tries to operate in a "shame-based" community by enforcing private restitution.
  *   **A.** it works if you enforce the restitution strictly. the emotion will follow the behavior.
  *   **B.** it fails. the community needs public acknowledgment. private repair feels like hiding, which increases suspicion.
  *   **C.** it creates a hybrid. the system changes the emotion over time. neither framework is permanent.

  **7. phenomenological check**
  close your eyes. think of a time you felt bad about a wrongdoing. where was the pressure?
  *   **A.** in the action. i wanted to undo the specific thing i did.
  *   **B.** in the self. i wanted to hide or disappear entirely.
  *   **C.** hard to say. the feeling shifted between wanting to fix it and wanting to hide depending on who was watching.

  ***

  ### scoring key & leaf mapping

  tally your choices, but look at the *pattern* rather than a simple count. the options are weighted to push you toward one of the five leaves.

  **mostly A's → Institutional Guilt (Leaf 1) OR Prospective Optics (Leaf 4)**
  *   **Leaf 1 (Institutional Guilt):** You picked A on Q1, Q3, and Q4. You believe guilt is a superior tech because it focuses on *repair*. You think culture can engineer this via privatized rituals.
      *   *awkward commitment:* you have to accept that mass harm could be treated as a bookkeeping error if restitution is paid.
  *   **Leaf 4 (Prospective Optics):** You picked A on Q2 and Q5 (specifically the ones mentioning risk/exposure). You see shame as anticipated exposure/risk-management, compatible with guilt-cultures.
      *   *awkward commitment:* you have to explain why shame feels so visceral/physical if it's just risk calculus.
  *   *note:* if you bounced between these, see the "blur" note below.

  **mostly B's → Basal Shame (Leaf 2)**
  *   **Leaf 2 (Basal Shame):** You consistently chose the "self/stain" options. You believe shame is the root emotion and guilt is just internalized shame. Culture can't choose away from this.
      *   *awkward commitment:* a hermit with perfect private repair should still feel self-stain (Q2).

  **mostly C's → Structural Pairing (Leaf 3) OR Collapse (Leaf 5)**
  *   **Leaf 3 (Structural Pairing):** You picked C on Q3, Q4, and Q6. You see them as incommensurable social technologies tied to different architectures. "better" is relative.
      *   *awkward commitment:* must deny there's any universal answer to which emotion is superior.
  *   **Leaf 5 (Collapse):** You picked C on Q2, Q5, and Q7. You think the distinction is a folk taxonomy with no normative weight.
      *   *awkward commitment:* must dismiss centuries of moral psychology as mostly category error.

  ***

  ### meta-notes for the seminar

  **1. the blur: Institutional Guilt (1) vs. Prospective Optics (4)**
  the tree can't really seperate these two on the institutional-design items (Q1, Q3). both positions treat the emotion as a tool/tech that can be engineered.
  *   **Leaf 1** says: engineer it to fix *harm* (restitution).
  *   **Leaf 4** says: engineer it to manage *signal* (exposure).
  *   **why it blurs:** in practice, paying a fine (Leaf 1) stops the exposure (Leaf 4). if you're designing a system, the output looks identical. the only difference is the *justification* (ledger balance vs. risk mitigation). if a student lands here, push them on whether the *motivation* matters if the behavior is the same.

  **2. the unoccupied logical combo**
  **combo:** "Shame is basal (biological root) BUT fully suppressible by culture."
  **diagnosis:** incoherent.
  *   if shame is **basal**, it implies a pre-cultural substrate (like pain or hunger). you can modulate it, but not eliminate it via social design.
  *   if culture can **fully suppress** it, then it wasn't basal; it was contingent.
  *   **why it's empty:** no one really argues this. usually, people either say "it's basal and unavoidable" (Leaf 2) or "it's a social construct and changeable" (Leaf 3/5). claiming it's both biological bedrock *and* culturally eliminable is a contradiction in terms. worth pointing out when someone tries to have it both ways.
