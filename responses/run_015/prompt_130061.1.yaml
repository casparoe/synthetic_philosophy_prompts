  hey i'm putting together a sorting quiz for a grad philosophy-of-emotion seminar. topic is guilt vs shame — not just "which feels worse" but which is the actually better moral emotion, and whether a culture can deliberately choose which one dominates. i want seven concrete cases or institutional designs, each with three answer options that don't name the positions. the options should describe what you'd feel or do, not use labels like "guilt culture" or "shame culture". then include a scoring key that maps answer patterns onto five leaves:

  1. Institutional Guilt — guilt is the superior moral tech; cultures can engineer it via privatized repair rituals. awkward commitment: mass harm could be treated as a bookkeeping error if restitution is paid.
  2. Basal Shame — shame is the root emotion and guilt is just internalized shame; culture can't truly choose away. awkward commitment: a hermit with perfect private repair should still feel self-stain.
  3. Structural Pairing — they're incommensurable social technologies tied to different architectures, so "better" is relative and choice is structurally constrained. awkward commitment: must deny there's any universal answer.
  4. Prospective Optics — shame is really anticipated exposure / risk-management, not self-defect, so it's compatible with guilt-cultures and can be cultivated like any practice. awkward commitment: has to explain why shame feels so visceral if it's just risk calculus.
  5. Collapse — the distinction is a folk taxonomy with no normative weight; asking which is better is like asking sadness vs anger. awkward commitment: must dismiss centuries of moral psychology as mostly category error.

  please flag which pair the tree can't really seperate (i think 1 and 4 blur on the institutional-design item). also note one unoccupied logical combo — e.g. "shame is basal but fully suppressible by culture" — and diagnose whether it's incoherent or just unexplored. don't ask for bibliographies or citations; the students don't have web access and i don't want them guessing names. keep it somewhat in the weeds: avoid just rehashing the standard Benedict framing, and inject a niche distractor like "reputational anxiety" or "prospective exposure" in at least two questions. write casual, a typo or two is fine. audience is grad students who've read basic moral psych but nothing too obscure.
