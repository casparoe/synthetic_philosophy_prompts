answer: |-
  My credence in proposition P is 0.72.

  1.  **Decomposition of Credence**
      *   (a) **0.95** — The expected utility calculus on threshold functions yields an average impact equal to the marginal unit absent rebound, which remains positive here.
      *   (b) **0.95** — Preventing a life stipulated as net-negative reduces total suffering, which counts as a moral gain in most normative frameworks.
      *   (c) **0.90** — Expected difference is widely accepted as sufficient to generate a pro tanto reason, even if non-consequentialist reasons also exist.
      *   (d) **0.70** — While moral sorites paradoxes suggest no sharp cutoff, intuitive skepticism often treats negligible probabilities as morally inert.
      *   (e) **0.90** — Positive correlation among agents increases the variance of total demand, raising the probability of crossing the threshold boundary.
      *   (f) **0.95** — Proposition P requires only the existence of a pro tanto reason, not that this reason outweighs all competing conveniences or costs.

  2.  **Combination of Numbers**
      These probabilities do not multiply cleanly because moral reasons are often overdetermined; a failure in expected utility (a, d) does not eliminate complicity-based reasons (c). I treat (d) as the primary bottleneck for the consequentialist argument, then add probability mass for non-consequentialist routes, resulting in a figure higher than the strict product of the nodes.

  3.  **Sensitivity Analysis**
      My final number is most sensitive to node (d), the threshold of causal significance. Evidence that moral reasons scale linearly with expected harm regardless of magnitude (e.g., thought experiments about serial tiny harms) would move this term toward 1.0, whereas evidence that practical rationality ignores negligible probabilities would move it toward 0.0.

  4.  **Diagnosis of Disagreement**
      The gap between your 0.65 and your friend's 0.25 most likely lives in node (d), because a credence of 0.25 suggests your friend believes negligible expected impacts fail to generate any moral reason at all, whereas you likely accept that small probabilities of large harms still count.

  5.  **Generalization**
      This answer carries over to voting and emissions because the structural logic of expected utility applies, though the probability of being pivotal in an election is orders of magnitude lower and climate harms are continuous rather than threshold-based. The stipulations here regarding lot sizes and non-identity make the chicken case stronger than voting but structurally identical regarding individual obligation.
