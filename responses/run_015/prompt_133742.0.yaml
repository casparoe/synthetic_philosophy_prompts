answer: |-
  You have independently reconstructed one of the most persistent and rigorous debates in the philosophy of mind and value theory. Your impasse is not a personal failure of analysis; it is the **Heterogeneity Problem of Pleasure** (sometimes called the **Unity Problem**).

  The difficulty you describe has been central to analytic philosophy since G.E. Moore and Ludwig Wittgenstein. Below is a mapping of your two failures onto established concepts, an analysis of whether they are one problem or two, and the existing "third ways" that attempt to resolve the dilemma.

  ### 1. The Name of the Difficulty
  The established name for the problem you are describing is the **Heterogeneity of Pleasure**.

  It asks: *Is "pleasure" a natural kind with a single essence, or is it a disparate collection of experiences linked only by language?*

  Your specific formulation of the impasse—the inability to find a common phenomenological thread—is often referred to as the failure of **Qualitative Hedonism** or **Sensationalism**.

  ### 2. Mapping Your Two Failures
  You identified two candidate families. In the literature, these correspond precisely to the two dominant ontological theories of pleasure.

  #### Failure A: The "Bare Residue"
  *   **Your Description:** A thin "this is good" feeling left over after stripping away specific content.
  *   **Established Name:** **Sensationalism** (or Qualitative Theory).
  *   **The Claim:** Pleasure is a distinct, introspectible quality (a "glow," "tingle," or "hedonic tone") that accompanies certain experiences.
  *   **Why It Fails (as you noted):** Introspection cannot locate this quality. As Gilbert Ryle and G.E. Moore argued, if you try to focus on the "pleasure" of drinking water, you find only the coldness, the wetness, and the relief. There is no extra "pleasure sensation" added to the mix.
  *   **The Massage Case:** Your massage example is a definitive refutation of Sensationalism. If the sensory input (pressure, warmth) remains identical but the experience flips from pleasant to unpleasant (due to satiation or context), then the "pleasantness" cannot be intrinsic to the sensation itself.

  #### Failure B: The "Stance Towards Experience"
  *   **Your Description:** A desire for the experience to continue; a pro-attitude.
  *   **Established Name:** **Attitudinal Hedonism** (or Desire Theory).
  *   **The Claim:** Pleasure is not a feeling, but a psychological attitude of *being pleased that* or *wanting* a state of affairs to continue. (Proponents include Fred Feldman and Chris Heathwood).
  *   **Why It Fails (as you noted):** We often hold pro-attitudes toward unpleasant things.
      *   *Righteous Anger:* One may want to remain angry because it feels justified, even though the anger is not "pleasant."
      *   *Tragic Art:* One is glad to be watching a heartbreaking film, but does not describe the experience as "pleasant."
      *   *Grief:* As you noted, one may not want grief interrupted, yet grief is the paradigmatic unpleasant state.
  *   **The Distinction:** Attitudinalists respond by distinguishing between *sensory pleasure* and *attitudinal pleasure*. They would say you are *attitudinally pleased* (glad) that you are grieving, even if you are not *sensory pleased*. However, this risks making the definition of pleasure so broad it loses its explanatory power.

  ### 3. Are These One Problem or Two?
  They are two horns of a single **Ontological Dilemma**.

  The single problem is: **Is pleasure intrinsic to the experience (internal) or extrinsic to the experience (relational)?**

  *   **Sensationalism** claims pleasure is internal (a property of the experience).
  *   **Attitudinalism** claims pleasure is relational (a property of the subject's relation to the experience).

  Your analysis shows that neither the *internal* properties nor the *relational* properties alone are sufficient to define pleasure. This suggests the problem is unitary: we are looking for a single essence where there may be a complex structure.

  ### 4. Are These the Only Options? (The Third Ways)
  Philosophers have proposed solutions that attempt to bypass this dichotomy. Here are the two nearest established concepts that differ from your descriptions.

  #### Option C: Family Resemblance (Wittgenstein)
  *   **Concept:** There is no common essence.
  *   **Definition:** The word "pleasure" is used for a variety of experiences that overlap like fibers in a thread, but no single fiber runs through the whole length.
  *   **How it differs:** It accepts your impasse as the final answer. It claims your search for a commonality is a linguistic confusion. The taste of water and the relief of a bag are no more alike than "games" (chess and soccer); we just call them both "pleasure" for pragmatic reasons.
  *   **Boundary Case:** If this is true, there is no hard boundary. A "pleasure" is simply whatever we agree to call pleasure.

  #### Option D: Intentionalism / Perceptualism
  *   **Concept:** Pleasure is a mode of perceiving value.
  *   **Definition:** Pleasure is not a sensation (Sensationalism) nor a desire (Attitudinalism), but a **perception of something as good**. It is an *intentional state* (it is *about* something).
  *   **Proponents:** Franz Brentano, Michael Tye, Tim Bayne.
  *   **How it differs:**
      *   Unlike Sensationalism: It doesn't require a "hedonic glow." The massage feels the same, but its *intentional content* changes. In the first phase, the pressure represents "good/beneficial." In the second, the same pressure represents "excessive/threatening."
      *   Unlike Attitudinalism: It explains the "Grief" case. In grief, you do not perceive the sadness *as good*. You perceive it as *appropriate* or *necessary*, which is a different evaluative mode than pleasure.
  *   **The Massage Case:** This theory handles your massage example best. The sensory qualia remain constant, but the *evaluative representation* flips. The body signals "benefit" initially, then "damage" later, without the pressure changing.

  ### 5. Summary of Concepts and Boundaries

  | Concept | Definition | Why it fails your criteria | Boundary Case |
  | :--- | :--- | :--- | :--- |
  | **Sensationalism** | Pleasure is a distinct feeling added to experience. | Fails the "Massage Test." No common feeling exists. | A "hedonic tone" that exists even if unwanted (masochism). |
  | **Attitudinalism** | Pleasure is wanting an experience to continue. | Fails the "Grief Test." We want some pains to continue. | Being glad one is in pain (e.g., post-workout soreness). |
  | **Family Resemblance** | There is no common essence; only overlapping similarities. | Dissolves the problem rather than solving it. | Any experience we linguistically categorize as pleasure. |
  | **Intentionalism** | Pleasure is experiencing something *as good*. | Complex to define "as good" without circularity. | Enjoying a horror movie (experiencing fear *as* thrilling/good). |

  ### 6. A Proposed Term (If you require one)
  If you find the established terms insufficiently precise for your specific impasse, you might adopt the term **Valenced Intentionality**.

  *   **Definition:** A conscious state is a pleasure if and only if the subject's phenomenology includes a **positive valence attribution** to the object of the experience, independent of the sensory quality of the object or the explicit desire to prolong it.
  *   **Why this fits:** It captures the "stance" (valence attribution) without requiring a "desire" (which fails on grief) and without requiring a "sensation" (which fails on the massage).
  *   **Boundary Cases:**
      *   *Counts as Pleasure:* Drinking water when thirsty (valence: +).
      *   *Counts as Pleasure:* Listening to sad music (valence: + regarding the beauty, even if content is sad).
      *   *Does Not Count:* Righteous Anger (valence: - regarding the offense, even if desire to continue is +).
      *   *Does Not Count:* Massage after satiation (valence: - regarding the pressure, even if sensation is identical).

  ### Conclusion
  You have arrived at the **Heterogeneity Problem**. Your two failures correspond to the collapse of **Sensationalism** and **Attitudinalism**.

  They are aspects of a single ontological problem: locating the "goodness" in experience. The most robust contemporary solution is **Intentionalism**, which posits that pleasure is not a *thing* we feel, nor a *want* we have, but a way of *interpreting* what we feel. The massage shifts from pleasant to unpleasant not because the feeling changes, nor because the desire changes, but because the body's interpretation of the signal shifts from "nourishment" to "injury."
