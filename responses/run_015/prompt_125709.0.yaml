answer: |-
  # RFC: Anthropics Update Module (AUM) Specification
  **Status:** Draft  
  **Audience:** Bounded Rational Agents, Decision Procedures  
  **Subject:** Interface requirements for indexical belief updating  

  ## 1. Interface Definition
  ```typescript
  interface AnthropicsUpdate {
    /**
     * Computes posterior credences over world-hypotheses given indexical evidence.
     * @param prior - Map<HypothesisID, Probability>
     * @param hypotheses - Map<HypothesisID, WorldModel> 
     *                     (Must specify total observer count, observer types, evidence distributions)
     * @param my_evidence - The agent's current subjective observation stream.
     * @param decision_context - Enum { PER_WORLD, PER_COPY, UNKNOWN }
     * @return Map<HypothesisID, Probability>
     */
    function update(prior, hypotheses, my_evidence, decision_context): Posterior;
  }
  ```

  ## 2. Functional Requirements (Desiderata vs. Prejudices)
  The following categorizes the collected candidate requirements. Note that "Prejudice" does not mean "incorrect," but rather "camp-specific preference that may conflict with formal consistency."

  ### 2.1 Core Consistency (MUST)
  *   **[REQ-01] Reduction to Standard Bayes:** If all hypotheses imply the same number of observers with the same evidence, the function **MUST** reduce to ordinary Bayesian conditionalization. Indexical uncertainty is an extension, not a replacement.
  *   **[REQ-02] No Dutch Book:** The output credences **MUST NOT** lead to a set of bets that guarantee a loss, given the specified `decision_context`.
  *   **[REQ-03] Well-Definedness on Unbounded Domains:** The function **MUST** return a valid probability distribution even if hypotheses imply infinite or unbounded observer counts (e.g., via limits or density ratios). NaN is not an acceptable return value.
  *   **[REQ-04] Implementability:** The function **MUST** be computable by an agent that cannot enumerate the global population. It cannot require counting observers causally disconnected from the agent.

  ### 2.2 Robustness (SHOULD)
  *   **[REQ-05] Invariance Under Redescription:** The output **SHOULD** remain invariant if the population is redescribed (e.g., splitting one "observer" into two "temporal slices" or merging two identical agents). *Status: Desideratum.* This prevents the "bug" where probability mass shifts due to variable naming conventions.
  *   **[REQ-06] Symmetry (Fork/Merge):** The rule **SHOULD** treat subjectively indistinguishable duplication and merging symmetrically. *Status: Desideratum.* Time-asymmetry in probability updates requires physical justification, not anthropic stipulation.
  *   **[REQ-07] Resistance to Boltzmann Brains:** The rule **SHOULD** not assign high credence to hypotheses where the majority of observers are random thermal fluctuations, unless evidence compels it. *Status: Desideratum.* Prevents solipsistic collapse.

  ### 2.3 Camp-Specific Constraints (Prejudices / SHOULD-MAY)
  *   **[REQ-08] Resistance to Presumptuousness:** The rule **SHOULD NOT** favor a hypothesis purely because it postulates more observers (SIA failure mode). *Status: Prejudice (SSA-leaning).* Conflicts with [REQ-05] and [REQ-10].
  *   **[REQ-09] Reference Class Robustness:** The rule **MAY** depend on a reference class, but **SHOULD** minimize sensitivity to its boundaries. *Status: Prejudice (SSA-leaning).* SIA claims independence here; SSA admits dependence.
  *   **[REQ-10] Informative Output:** The posterior **MUST** differ from the prior when observer counts differ across hypotheses. *Status: Desideratum.* If the output equals the input, the module is a no-op.
  *   **[REQ-11] Non-Indexical Priority:** Indexical updates **SHOULD NOT** overturn strong non-indexical evidence (e.g., physics) solely due to observer counts. *Status: Prejudice (SSA-leaning).*

  ## 3. Test Cases
  The following cases verify compliance with the requirements above.

  ### 3.1 Test Case: The Fork and Its Reverse
  **Setup:** 
  *   **Fork:** $H_1$ has 1 observer. $H_2$ has 1 observer who duplicates at $t=1$ into 2 identical copies. Agent wakes at $t=2$.
  *   **Reverse Fork:** $H_1$ has 1 observer. $H_2$ has 2 observers who merge at $t=1$ into 1 survivor with both memory sets. Agent wakes at $t=2$.
  *   **Condition:** In both scenarios, the agent's subjective experience at $t=2$ is identical.
  **Expected Behavior:** 
  *   A compliant rule **MUST** assign the same posterior probability to $H_2$ in both cases (satisfies [REQ-06] Symmetry). 
  *   **Failure Mode:** SSA typically treats these differently (counting "worlds" vs "observer moments"). If the rule distinguishes them, it violates [REQ-05] Invariance.
  *   **Verdict:** If the rule cannot handle the Reverse Fork without undefined behavior, it is time-asymmetric and fails [REQ-05].

  ### 3.2 Test Case: The Thick Index
  **Setup:** 
  *   $H_1$: 10 observers have evidence $E$ (exact match).
  *   $H_2$: 10 observers have evidence $E$, plus $10^{12}$ observers have evidence $E'$ (differs by one bit, e.g., a pixel color).
  *   **Condition:** Agent observes $E$.
  **Expected Behavior:** 
  *   The rule **MUST** specify whether it conditions on $E$ (Thick) or "E or E'" (Thin). 
  *   If conditioning on $E$: $H_2$ gets no boost from the $E'$ observers. (Satisfies [REQ-11]).
  *   If conditioning on Thin: $H_2$ dominates. (Satisfies [REQ-10] but risks [REQ-08]).
  *   **Verdict:** A correct rule **MUST** condition on total evidence $E$. If it conditions on a thinner class to make the math work, it violates [REQ-01] (Standard Bayes). If conditioning on $E$ renders the anthropic update null, the module should return the prior (honesty over [REQ-10]).

  ### 3.3 Test Case: The Unenumerable World
  **Setup:** 
  *   $H_1$: Finite observers ($10^{80}$).
  *   $H_2$: Infinite observers (e.g., eternal inflation).
  *   **Condition:** Agent cannot count the total population; only local sampling is possible.
  **Expected Behavior:** 
  *   The rule **MUST** compute ratios without global enumeration (satisfies [REQ-04] Implementability). 
  *   **Failure Mode:** Any rule requiring $N_{total}$ as an input crashes or returns NaN.
  *   **Verdict:** The rule must operate on *densities* or *sampling probabilities*, not raw counts. If it requires $N_{total}$, it is undeployable.

  ## 4. Impossibility Results & Trade-offs
  **Flagged Conflict:** **[REQ-05] Invariance** vs. **[REQ-08] Resistance to Presumptuousness**.
  *   **Analysis:** You cannot simultaneously satisfy Invariance under redescription (counting observer-moments consistently) and resist the Presumptuous Philosopher (rejecting hypotheses just because they have more observers). 
  *   **Reasoning:** If you count observer-moments to ensure symmetry (Fork/Reverse Fork), you inevitably favor worlds with more moments (SIA). If you normalize by worlds to avoid presumptuousness (SSA), you violate symmetry (the Fork changes probability, the Reverse Fork does not).
  *   **Resolution:** This is not a bug in the math, but in the objective. The posterior probability depends on the `decision_context`. 
      *   For **Per-World** bets (e.g., "Does this universe exist?"), use SSA-weighting.
      *   For **Per-Copy** bets (e.g., "Do I win a prize?"), use SIA-weighting.
      *   A single posterior for *both* contexts is impossible. The `decision_context` input parameter is mandatory, not optional.

  **Most Exclusionary Requirement:** **[REQ-05] Invariance Under Redescription.**
  *   **Reasoning:** This requirement eliminates standard SSA immediately, as SSA probabilities shift depending on how one defines an "observer" (e.g., per second vs. per lifetime). It also eliminates naive SIA if "observer" is not rigorously defined. Only decision-theoretic approaches (UDT/ADT) that bypass probability updates entirely or tie them strictly to causal structure can satisfy this.

  ## 5. Closing Scorecard: SSA vs. SIA
  SSA and SIA are not competing truths but different aggregation functions for different payout structures. SSA averages over **runs** (worlds), making it correct for per-world bets but vulnerable to reference class ambiguity and symmetry violations (The Fork). SIA averages over **steps** (observer-moments), making it correct for per-copy bets but vulnerable to the Presumptuous Philosopher and Boltzmann Brains. Your simulation bug arose because your colleagues were optimizing for different payout schemas without declaring them. Do not patch the probability module; patch the decision procedure to explicitly declare whether the utility function is additive over copies or binary over worlds.
