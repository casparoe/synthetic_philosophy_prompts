answer: |-
  This is a superb set of puzzles. You have correctly identified that the popular definition of Whig history ("telling history as progress toward us") is too narrow, which is why Case 3 (declinism) breaks it. You are also right that your tentative principle ("outcome doing explanatory work") is necessary but not sufficient.

  The core tension you are feeling is between **genealogy** (tracing how we got here) and **teleology** (asserting we were meant to get here). Butterfield's complaint was not that we look at the past from the present (impossible not to), but that we *prune* the past to make the present look inevitable and justified.

  Here are three candidate principles, calibrated to your cases, followed by the verdicts you requested.

  ### Candidate Principles

  **1. The Attribution of Intent Principle**
  *   **Definition:** A narrative becomes Whiggish when it attributes knowledge, motives, or categories to historical actors that were unavailable to them, specifically to make them look like precursors to the present.
  *   **Mechanism:** It confuses *causal contribution* with *intentional anticipation*.
  *   **Applies to:**
      *   **Case 1 (Plate Tectonics):** Bad because it implies the 1960s geologists were the "goal" and Wegener was a prophet, rather than two different paradigms.
      *   **Case 5 (Proto-Wellness):** Bad because it makes 18th-century figures "proto-X." They were not X-ing; they were doing Y, which *caused* X later.
      *   **Case 6 (Your Project):** *Safe*, provided you describe their actions as Y, Z, and Q, and show how those *caused* the present, without claiming they were trying to build the present. The fact they loathed each other helps here: it proves there was no unified teleological drive.

  **2. The Valuation Monopoly Principle**
  *   **Definition:** A narrative is Whiggish when the present moment is the *sole* court of appeal for judging the rationality, virtue, or success of past actors. This applies whether the judgment is positive (progress) or negative (decline).
  *   **Mechanism:** It collapses the distinct normative worlds of the past into the normative world of the historian.
  *   **Applies to:**
      *   **Case 2 (Sanitary Reform):** *Not Whiggish.* You explicitly suspend present judgment ("wrong mechanism") to validate past rationality ("reasonable given data").
      *   **Case 3 (University Decline):** *Whiggish.* This is "Reverse Whig history." It still uses the present as the absolute yardstick. It assumes the "Golden Age" was objectively better by standards that only exist now (or assumes a timeless standard that just happens to align with the historian's preferences). It makes the present the pivot of all value.
      *   **Case 4 (Priority Disputes):** *Whiggish-adjacent.* It judges "invention" by a modern legalistic/credit standard that didn't exist then. It values the past only for its contribution to current priority claims.

  **3. The Continuity Smoothing Principle**
  *   **Definition:** A narrative is Whiggish when it smoothes over ruptures, contingencies, and dead ends to make the path to the present appear linear or inevitable.
  *   **Mechanism:** It treats the actual outcome as the *only* possible outcome, pruning branches that didn't lead here.
  *   **Applies to:**
      *   **Case 6 (Your Project):** This is your danger zone. If you trace the lineage but hide the loathing/rejection to make a clean line, it violates this. If you highlight the loathing as *constitutive* of the lineage (i.e., "we are here *because* they fought"), it is **Genealogy**, not Whig history.
      *   **Case 1:** Smooths over the fact that 1920s geologists had reasonable objections to Wegener's mechanism.

  ---

  ### Verdicts on Your New Scenarios

  **(a) The "Wrong Turn" Narrative (Rejecting Consensus)**
  *   **Verdict:** **Whiggish (Reverse).**
  *   **Reasoning:** This violates the *Valuation Monopoly Principle*. It treats the present as the inevitable result of a specific mistake, rather than a contingent outcome of complex forces. It assumes that if we had taken the "right" turn, we would be in a objectively better place *now*, judging the past solely by its utility to our current dissatisfaction. It is the mirror image of Case 1.

  **(b) The Counterfactual / Paths-Not-Taken**
  *   **Verdict:** **Anti-Whiggish (if done right).**
  *   **Reasoning:** This is the strongest antidote to Whig history, *provided* it treats the actual outcome as contingent. Whig history says "A led inevitably to B." Counterfactual history says "A could have led to C, but D happened." However, if you treat the paths-not-taken as "tragic errors" measured against the present, it slips back into Reverse Whiggism.

  **(c) Cumulative Subjects (e.g., Math/Function)**
  *   **Verdict:** **Not inherently Whiggish, but high risk.**
  *   **Reasoning:** In math, later concepts often *do* subsume earlier ones (rigor subsumes intuition). Acknowledging this is not Whiggish; it's accurate. It becomes Whiggish only if you describe earlier mathematicians as "struggling toward rigor" rather than "solving problems with the tools they had." You must distinguish between *logical subsumption* (true) and *historical motivation* (often false).

  **(d) Movements That Believed in Progress**
  *   **Verdict:** **Not Whiggish.**
  *   **Reasoning:** If the *actors* believed in a telos, reporting that is faithful history. Whig history is when the *historian* imposes a telos the actors didn't share. If you are writing about Marxists or Whigs, you can discuss their teleology without endorsing it as the structure of your narrative.

  **(e) Your Project (Endpoint Up in the Air)**
  *   **Verdict:** **Not Whiggish.**
  *   **Reasoning:** This breaks the *Continuity Smoothing Principle*. By declaring the endpoint unresolved, you deny the inevitability that defines Whig history. You are offering a genealogy of a problem, not a history of a solution. This validates your verdict on Case 6, provided you maintain that uncertainty.

  ---

  ### Critique of Your Original Six Verdicts

  You asked me to be straight about which verdicts to throw out. Here is the hard truth:

  **Keep 1, 2, and 5.**
  Your instincts here are rock solid. Case 1 is the textbook definition. Case 2 is textbook contextualism. Case 5 is textbook anachronism.

  **Refine 3 (The Decline Narrative).**
  You are right to call it Whiggish, but your hesitation ("nothing is presented as progress") shows you need to update your definition. **Whig history is not about optimism; it is about inevitability and present-centered judgment.** A narrative that says "Everything was perfect until we ruined it" is just as present-centric as "Everything was primitive until we fixed it." Both assume the present is the only vantage point from which history makes sense. Keep the verdict, but adjust the reasoning.

  **Refine 4 (The Priority Dispute).**
  You said "slightly off." I would upgrade this to **Whiggish.** This is "Antiquarian Whiggism." It judges the past solely by its ability to generate current claims to priority. It ignores what the "invention" meant *then* in favor of who gets the credit *now*. It violates the *Valuation Monopoly Principle*.

  **Challenge 6 (Your Project).**
  You are least confident here, and you should be. **This is the most dangerous one.**
  *   **The Risk:** Even if they loathed each other, if *you* select them specifically because they form a lineage to *you*, you are pruning the garden. You are implicitly arguing that *this* specific fight is the ancestor of your current methodological corner.
  *   **The Defense:** It is defensible **only if** you treat the loathing as a fracture, not a link. If you write, "A hated B, which caused C to emerge," that is causal history. If you write, "A and B were both early warriors in the fight for C," that is Whig history.
  *   **My Advice:** You can keep the verdict "Not Whiggish," but only if you explicitly foreground the contingency. You must write: "It is accidental that these four constitute the lineage; had X happened, we would trace it through Y." If you don't acknowledge the pruning, Case 6 collapses into Case 5.

  ### Summary Recommendation

  Your tentative principle ("letting the outcome do explanatory work") is 80% there. To get the last 20%, add this clause:

  > "A narrative is Whiggish when it lets the outcome do explanatory work **OR** when it uses the outcome as the sole metric of value."

  This captures Case 3 (Decline) and Case 4 (Priority).

  For your Festschrift piece, your best shield is **contingency**. If you explicitly state in the introduction: "This lineage is not inevitable; these actors did not know they were building this; the outcome is not a victory but a current contingency," you immunize yourself against the charge. You are writing a **genealogy of a problem**, not a **history of a solution**. That distinction is your safe harbor.
