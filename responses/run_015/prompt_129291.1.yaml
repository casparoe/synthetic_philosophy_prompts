      *   *Correction on Point 2:* Cross-world duplication. If PII is necessary, can $w_1$ and $w_2$ be qualitative duplicates? If they are distinct worlds, they violate PII *across* the pluriverse. Most PII defenders restrict PII to *intra-world*. I need to press the user on whether their "rigidity" claim extends to the space of worlds. If it does, Modal Realism is dead. If not, PII is weaker.
