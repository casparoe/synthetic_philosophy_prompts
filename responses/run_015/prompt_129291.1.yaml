          *   *Defender's Stance:* Weak Discernibility (Saunders, Muller). They are discerned by irreflexive relations (e.g., "has opposite spin to").
          *   *Adjudication:* Is weak discernibility cheating? It saves PII but changes the definition of "discernible." If the user accepts relational properties, this is a save. If the user requires monadic difference, this is fatal. The user *does* allow relational properties.
          *   *Ranking:* Low/Medium cost (Requires technical maneuvering). Not fatal if weak discernibility is accepted.

      *   **4. Individual Essences (Haecceities vs. Qualitative):**
          *   *Issue:* PII requires every object to have a unique qualitative profile (essence).
          *   *Defender's Stance:* Yes, the "total qualitative character" is the essence.
          *   *Adjudication:* Is this a liability? It makes essences incredibly complex (world-indexed properties potentially). It threatens combinatorialism.
          *   *Ranking:* Medium cost (Metaphysical bloat/complexity).

      *   **5. Collapse (Haecceitism vs. Qualitative):**
          *   *Issue:* In a symmetric world (if one existed), only haecceities distinguish. If PII bans haecceities, it bans the world.
