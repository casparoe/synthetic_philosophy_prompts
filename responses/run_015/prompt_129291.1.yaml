      *   **Core Thesis:** A strong version of the Identity of Indiscernibles (PII). Necessarily, no two distinct particulars share *all* qualitative properties (monadic and relational).
      *   **Exclusion:** Properties like "being identical to A" are excluded (haecceities).
      *   **Interpretation:** Metaphysical rigidity. No possible world has non-trivial symmetries (swaps).
      *   **Response to Black's Spheres:** Black's world is metaphysically impossible. The fact that we can describe it qualitatively without settling cardinality shows a limit of language/description, not a metaphysical possibility. Conceivability $\neq$ Possibility.
      *   **Goal:** A map of what would force the user to give up this view. Ranked from fatal to awkward. Adjudication of five specific points. Assessment of the "unfalsifiability" worry.

  2.  **Deconstruct the Five Adjudication Points:**

      *   **1. Rigidity & Symmetry (Homogeneous Plenum/Converging Spheres):**
          *   *Issue:* If PII is necessary, no symmetric worlds exist. This rules out a perfectly homogeneous space (plenum) because translations would be symmetries. It also creates issues for continuous convergence (do they fuse? vanish?).
          *   *Defender's Stance:* A committed defender *must* deny the possibility of the plenum. This is a cost (counterintuitive), but consistent with the "badge" of rigidity.
          *   *Convergence:* If radii differ by $\epsilon \to 0$, PII says they must differ *somewhere*. If physics says they become identical, PII says physics is wrong or incomplete (or they fuse).
          *   *Adjudication:* This is a *cost*, not fatal, but high. The defender concedes the world is less modally flexible than rivals think. The "fusion" prediction is embarrassing if physics suggests continuity without fusion.
          *   *Ranking:* High cost (Metaphysical Restriction).

      *   **2. Exact Duplication (Cross-World):**
          *   *Issue:* If PII holds necessarily, can there be two worlds that are qualitative duplicates? If $w_1$ and $w_2$ are identical qualitatively, are they distinct? If yes, PII fails across worlds. If no, modal realism/ersatzism is constrained.
          *   *Defender's Stance:* Usually, PII is intra-world. But the user's "rigidity" claim suggests a strong modal claim. If indexed to a world ($PII_w$), it loses "teeth" regarding transworld identity.
          *   *Adjudication:* If the thesis is "No two distinct particulars *in a world*...", cross-world duplication is fine. If the thesis is "No two distinct particulars *simpliciter*...", cross-world duplication is impossible. The user seems to hold the intra-world version ("every possible world is rigid").
          *   *Ranking:* Medium cost (Scope limitation). If indexed, it risks tautology ("In world $w$, $x$ and $y$ differ" might just mean "In $w$, $x \neq y$").

      *   **3. Actual Physics (Quantum Mechanics):**
