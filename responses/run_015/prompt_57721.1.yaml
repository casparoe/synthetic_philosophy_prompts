  At a working British foundry, a team revives a nineteenth-century text face defined by high stroke contrast (thick vs. thin lines), wedge-shaped terminals (stroke ends), and a small closed 'e'. Two candidate lowercase 'a's lie on the table. The first is a traditional double-storey 'a'—closed upper bowl, curved lower—but drawn against the house style: even-weight strokes, a wide open aperture (the gap where a stroke doesn't close back on itself), bluntly cut terminals. On its own it reads instantly; set in a line of the new face it looks like it fell out of a geometric sans. The second is a single-storey 'a', the form most learn to write by hand, but built out of the house's own parts: same contrast axis, same wedge terminals, bowl struck from the same circle as the 'o', tail cut like the 'r's. In a line it's seamless; shown on its own to someone who's only ever met print forms, it makes them hesitate. Neither is a dud; both are competent drawings.

  Account (a), the prototype view, verdicts immediately: Glyph 1 is an 'a' because it matches the stored checklist of diagnostic features (two storeys, closed bowl). Glyph 2 fails the checklist. Account (b), the style account, reverses this: Glyph 2 is the true 'a' here because identity is downstream of the manner the face is drawn; Glyph 1 is a stylistic intruder. Account (c), the differential view, initially agrees with (b). Within the Roman system, Glyph 2 occupies the right role, contrasting correctly against the 'o' and 'r' without clashing. Glyph 1 disrupts the internal economy. So far, (b) and (c) are indistinguishable; both prefer the stylistically coherent single-storey form.

  Now, the stipulation: the family ships with a companion italic whose 'a' is single-storey, as italics usually are, marking emphasis against the Roman. This touches neither glyph's features nor the house style, only what the letter sits among. Account (a) doesn't blink; shape is shape. Account (b) doesn't blink; the Roman style rules haven't changed. But Account (c) flips. If the italic holds the single-storey form, the Roman *must* take the double-storey form to maintain the systemic contrast between Roman and Italic. If the Roman takes Glyph 2, the system loses a vital distinction. Glyph 1 is now the only valid 'a' for the Roman, not because of its shape or style, but because of its boundary condition against the italic. The variable is systemic necessity; (a) and (b) are structurally blind to it because they look at the glyph in isolation or against static rules, not against shifting relational needs.

  The honest part: the work is done entirely by the existence of the italic sibling. Take that feature back out, and (c) collapses back into (b), offering no third position. A defender of (b) would attack here by saying I've staged a row about type design taxonomy and mislabelled it a row about letter identity. They'd argue that distinguishing Roman from Italic is a matter of font classification, not ontology. If 'a'-ness depends on whether an italic exists, then 'a' isn't a natural kind but a bureaucratic slot. The case proves that relational identity is real, but only if you accept that a letter's being is constituted by its family tree, not just its face. This suggests the letter-spirit problem isn't about perception at all, but about the functional architecture of the system the letter serves. If you reject that architecture as constitutive, the differential account dissolves, leaving only the tug-of-war between the eye's habit (a) and the designer's hand (b).
