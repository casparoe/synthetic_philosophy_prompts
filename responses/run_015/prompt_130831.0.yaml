answer: |-
  Yes, your assumption is confused. It conflates the **causal explanation of a specific event** with the **modal status of a trans-historical pattern**. Resolving the historiographical debate over 1789 (class vs. ideology) does not automatically settle whether "revolutions devour their children" is a historical law or a contingent correlation.

  Here is the plain correction of the three specific errors in your reasoning.

  ### 1. You have mischaracterized the Revisionist position on necessity.
  You assume that if the Revisionist account (ideological/discursive) is correct, the Terror was "essentially accidental." This is factually incorrect regarding the dominant Revisionist voice, François Furet.

  Furet argued precisely that the Terror was **not** an accident of circumstance (war, famine, aristocratic plots) but was **inherent** to the revolutionary ideology itself. In *Interpreting the French Revolution*, Furet posits that the discourse of the "General Will" and popular sovereignty, which admits no opposition, structurally necessitates the elimination of dissent. Therefore, under the Revisionist framework, the "devouring" can still be viewed as logically necessary *within the terms of that specific political culture*, even if the political culture itself was a contingent historical emergence. Your dichotomy (Marxist = Necessary, Revisionist = Contingent) collapses because Revisionism often posits a stronger internal logic of terror than Marxism does.

  ### 2. You are confusing intra-event necessity with trans-historical regularity.
  Even if we accept your simplified dichotomy, settling the cause of 1789 does not settle the modal status of "revolutionary self-destruction" as a general phenomenon.

  *   **Marxist View:** Even if the Terror was structurally necessary for the *bourgeois revolution of 1789*, a Marxist is not committed to the claim that *all* revolutions must devour their children. A socialist revolution, theoretically, might not have the same class contradictions. Therefore, accepting the Marxist explanation for 1789 does not validate "devouring children" as a universal law of revolutions; it only validates it as a law of *bourgeois* revolutions.
  *   **Revisionist View:** Even if the Terror was caused by specific discursive dynamics in 1789, one could argue those dynamics are replicable in other contexts (making it a regularity) or unique to the Enlightenment (making it a contingency). The causal mechanism (discourse) does not dictate the scope of generalization.

  To move from "Why did 1789 purge its radicals?" to "Do revolutions necessarily purge their radicals?" requires a **comparative** step that neither historiographical camp primarily undertakes. You are trying to derive a universal sociological law from a debate about singular causal attribution.

  ### 3. The "Category Mistake"
  Your core error is assuming that **ontological causality** (what made this happen?) dictates **philosophical modality** (must this always happen?).

  The status of the claim "revolutions devour their children" depends on a third framework you haven't included: **Comparative Historical Sociology** (e.g., Theda Skocpol, Crane Brinton, or Hannah Arendt).
  *   Arendt, for instance, argues the "devouring" is not a law of revolution *per se*, but a specific pathology of using violence to found freedom.
  *   Trotsky argued it was a necessity of isolated revolution.
  *   Stalin argued it was a necessity of intensifying class struggle.

  These are meta-historical claims that sit *above* the empirical dispute over 1789. You can accept the Revisionist account of 1789 (it was about discourse) but reject the idea that this applies to 1917 (which was about geopolitics and class). Conversely, you can accept the Marxist account of 1789 but argue that modern capitalist states absorb bourgeois revolutions without terror, rendering the "law" obsolete.

  ### Conclusion
  Your premise fails because the historiographical debate over 1789 explains **occurrence**, not **recurrence**.

  Identifying the correct causal mechanism for the French Revolution tells you why *that* revolution devoured *its* children. It does not tell you whether the property "devours its children" is essential to the category "revolution." To settle that, you need a theory of revolution that transcends the specific historiography of 1789. Your assumption that the 1789 debate exhausts the question is the category mistake.
