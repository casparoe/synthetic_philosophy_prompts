answer: |-
  **MEMORANDUM**

  **TO:** Planning Office Review Team
  **FROM:** Senior Planning Analyst
  **SUBJECT:** Procedural Checklist for Model-Based Recommendation Review
  **DATE:** October 26, 2023

  ### **1. Purpose and Scope**

  This procedure establishes a standardized review process for consultant-submitted models used in land-use and infrastructure decision-making. It is designed for non-specialist reviewers operating under a five-business-day sign-off deadline. The protocol adapts the principle of instrumentalism—that model assumptions need not be literally true to be useful—while safeguarding against assumptions that misrepresent critical realities.

  Reviewers must complete this checklist within thirty minutes. The team does not have the authority to demand new data collection; this procedure relies solely on documentation and back-testing provided by the consultant.

  ### **2. Model Review Checklist**

  **Step 1: Aggregate Predictive Validity**
  *   **Question:** Does the consultant provide historical back-testing or validation data showing the model's aggregate predictions match observed outcomes within acceptable error margins (e.g., ±10%)?
  *   **Sufficient Answer:** Yes, provided documentation shows correlation between model output and historical data for the relevant region and timeframe.
  *   **Decision Node:**
      *   **No:** **STOP.** Reject or defer recommendation until validation is provided.
      *   **Yes:** **CONTINUE** to Step 2.

  **Step 2: Assumption Inventory**
  *   **Question:** Has the consultant explicitly listed the top three simplifying assumptions that deviate from known reality (e.g., uniform soil types, rational actors, static environmental conditions)?
  *   **Sufficient Answer:** A clear list in the methodology section. If assumptions are hidden, note "Undisclosed."
  *   **Decision Node:**
      *   **Undisclosed:** **STOP.** Defer recommendation; assumptions must be transparent.
      *   **Disclosed:** **CONTINUE** to Step 3.

  **Step 3: Classification of Unrealistic Assumptions**
  *   **Question:** Apply the **Diagnostic Tests** (see Section 3 below) to each unrealistic assumption identified in Step 2. Is the assumption *Instrumentally False* (a harmless simplification) or *Representationally False* (a misleading distortion)?
  *   **Sufficient Answer:** Classification of each key assumption based on the Diagnostic Tests.
  *   **Decision Node:**
      *   **All Instrumentally False:** **CONTINUE** to Step 4.
      *   **Any Representationally False:** **CONTINUE** to Step 4 (flag for risk), but proceed to Step 5 for final determination.

  **Step 4: Distributional and Localized Impact**
  *   **Question:** Does the model's error pattern disproportionately affect specific neighborhoods, vulnerable populations, or critical infrastructure nodes, even if aggregate accuracy is high?
  *   **Sufficient Answer:** Review of residual error maps or demographic breakdowns provided in the report.
  *   **Decision Node:**
      *   **Yes (High Localized Error):** **STOP/DEFER.** The model cannot guide specific zoning or infrastructure rules for affected areas.
      *   **No (Errors Random/Uniform):** **CONTINUE** to Step 5.

  **Step 5: Final Recommendation and Value Hand-off**
  *   **Question:** Based on Step 3 and 4, does the model rely on a Representationally False assumption that biases the policy outcome or creates significant implementation risk?
  *   **Sufficient Answer:** Reviewer judgment based on checklist flags.
  *   **Decision Node:**
      *   **No Bias/Risk:** **APPROVE.**
      *   **Bias/Risk Identified:** **MANDATORY HAND-OFF.** Escalate to Department Director or elected body. This is a value judgment regarding risk tolerance and equity, not a factual determination.
      *   **Critical Failure Risk:** **STOP.** Reject recommendation.

  ---

  ### **3. Diagnostic Tests for Assumption Classification**

  To distinguish between *Instrumentally False* (acceptable) and *Representationally False* (unacceptable) assumptions in Step 3, apply the following three tests. If an assumption triggers any of these conditions, it is **Representationally False**.

  1.  **The Exclusion Test:** Does the assumption systematically erase a subgroup or geographic area that is a specific target of the policy (e.g., assuming single-family households in a zone known for multigenerational living)?
  2.  **The Dynamic Stability Test:** Does the assumption treat a variable as fixed that is likely to change in ways that directly undermine the policy goal (e.g., assuming no sea-level rise in a coastal resilience plan)?
  3.  **The Causal Driver Test:** Does the assumption do the heavy lifting for the result, rather than merely simplifying the calculation (e.g., assuming zero friction to prove a machine works, versus assuming zero friction to calculate speed)?

  ---

  ### **4. Application of Procedure to Current Proposals**

  The following applications demonstrate the checklist in practice using current consultant submissions.

  #### **Case 1: Stormwater Management Model**
  *   **Proposal:** Infrastructure rules based on a model assuming uniform drainage rates across all parcels.
  *   **Step 1 (Validity):** **Pass.** County-wide flooding predictions match historical data.
  *   **Step 2 (Inventory):** **Pass.** Assumption of uniform soil permeability is disclosed.
  *   **Step 3 (Classification):** **Fail (Representationally False).**
      *   *Diagnostic:* Fails the **Exclusion Test**. The assumption erases specific neighborhoods with known clay soil profiles.
  *   **Step 4 (Distributional):** **Fail.** Local engineers report consistent misses on flash-flood risk in two specific neighborhoods.
  *   **Step 5 (Recommendation):** **STOP/DEFER.**
      *   *Rationale:* While aggregate predictions are accurate (Friedmanian instrumentalism), the localized error creates unsafe conditions for specific residents. The model cannot be used for parcel-level infrastructure rules in the affected neighborhoods without adjustment.

  #### **Case 2: Regional Housing-Demand Forecast**
  *   **Proposal:** Zoning changes based on a forecast treating every household as a single, rational income-maximizer.
  *   **Step 1 (Validity):** **Pass.** Aggregate rent trends predicted accurately.
  *   **Step 2 (Inventory):** **Pass.** Assumption of rational single-income units is disclosed.
  *   **Step 3 (Classification):** **Fail (Representationally False).**
      *   *Diagnostic:* Fails the **Exclusion Test**. It erases multigenerational families and informal sublets common in this county.
  *   **Step 4 (Distributional):** **Pass/Neutral.** Errors are not yet mapped to specific zones, but the demographic exclusion is systemic.
  *   **Step 5 (Recommendation):** **MANDATORY HAND-OFF.**
      *   *Rationale:* The model is factually predictive but socially misrepresentative. Using it may optimize for economic efficiency while violating community equity goals. This trade-off is a value judgment requiring Director or Board input, not a technical approval.

  #### **Case 3: Long-Range Heat-Mitigation Plan**
  *   **Proposal:** Grant-funded plan built on a climate model assuming no major loss of tree canopy over the next twenty years.
  *   **Step 1 (Validity):** **Pass.** Aggregate temperature projections are within acceptable margins.
  *   **Step 2 (Inventory):** **Pass.** Assumption of static tree canopy is disclosed.
  *   **Step 3 (Classification):** **Fail (Representationally False).**
      *   *Diagnostic:* Fails the **Dynamic Stability Test**. Tree canopy is a variable likely to change due to development pressure and disease; assuming it remains static ignores a primary risk factor the plan is meant to mitigate.
  *   **Step 4 (Distributional):** **Pass.** Errors are aggregate.
  *   **Step 5 (Recommendation):** **STOP.**
      *   *Rationale:* Although the user prefers approval to secure grant funding, the assumption creates a critical failure risk. If canopy loss occurs (as is historically likely), the mitigation plan will fail to meet temperature targets, potentially jeopardizing future funding compliance and public safety. The model misrepresents the system dynamics enough to invalidate the policy's viability.

  ---

  ### **5. Procedural Limitations**

  Even when followed perfectly, this checklist cannot resolve the following issues:

  1.  **The Black Box Problem:** This procedure evaluates inputs and outputs but cannot verify the internal mathematical logic of the consultant's model. If the code contains errors that cancel each other out to produce accurate predictions (false positives), this checklist will not detect them.
  2.  **The Equity-Efficiency Trade-off:** The checklist can identify when a model excludes vulnerable groups (Case 2), but it cannot determine whether the economic benefit of the model outweighs the social cost of that exclusion. That determination requires political and ethical judgment outside the scope of this technical review.
