  1.  **Analyze the User's Query:**
      *   **Context:** Preparing a seminar on non-classical logics.
      *   **Observation:** In legal reasoning, courts sometimes assert $P$ (contract is valid) in one context and $\neg P$ (contract is void) in another context within the same opinion, without treating it as a contradiction needing resolution.
      *   **Key Characteristic:** These truths are "localized," "compartmentalized," and "never have to meet." It's not a belief in an inconsistent world (dialetheism), but a structural partitioning of reasoning.
      *   **Questions:**
          1.  Is there a term for this compartmentalized acceptance?
          2.  How is it different from applying paraconsistent logic in a restricted domain?
          3.  If no label exists, what should it be called?
          4.  Where does it stop being dialetheism and start being something else?

  2.  **Initial Brainstorming & Concept Matching:**
      *   *Dialetheism:* Belief that true contradictions exist ($P \land \neg P$ is true). The user explicitly says this *isn't* what's happening. The court isn't saying "It is both valid and void simultaneously in the same sense."
      *   *Paraconsistent Logic:* Logic that tolerates contradiction without explosion ($P, \neg P \nvdash Q$). This is close, but the user notes the contradiction isn't even acknowledged *as* a contradiction.
      *   *Contextual Logic/Contextualism:* Truth is relative to a context. $P$ is true in Context A, $\neg P$ is true in Context B.
      *   *Legal Specifics:* This sounds like "alternative holdings," "judicial fictions," or "doctrinal separation."
      *   *Philosophical/Logical Terms:*
          *   *Fragmentation:* The mind or system is fragmented.
          *   *Compartmentalization:* Psychological term, but applicable.
          *   *Local Coherence vs. Global Consistency:* The system aims for coherence within modules, not consistency across the whole.
          *   *Perspectivism:* Truth depends on the perspective (issue being addressed).
          *   *Many-Sorted Logic:* Different domains of discourse.
          *   *Indexicality:* "Valid" means something different in the enforcement context vs. the formation context.

  3.  **Deconstructing the Legal Phenomenon:**
      *   Why do courts do this?
          *   *Alternative Holdings:* "Even if the contract were valid (which we doubt), the plaintiff still loses because..." OR "The contract is void, but even if it weren't, the remedy is limited."
          *   *Procedural vs. Substantive:* Valid for jurisdiction purposes, void for enforcement purposes.
          *   *Interim vs. Final:* Valid for preliminary injunction, void at trial.
          *   *Different Parties:* Valid between A and B, void regarding C.
      *   The user describes it as: "two localized truths that never have to meet."
      *   This suggests *Contextualism* or *Relativism* rather than *Dialetheism*.

  4.  **Identifying the Logical/Philosophical Terms:**
      *   **Contextualism:** The truth value of a proposition depends on the context of assessment. In Legal Theory, this is often called "Legal Contextualism."
      *   **Fragmentation of Doctrine:** A term used in legal scholarship (e.g., by Duncan Kennedy or critical legal studies) describing how legal rules are kept separate to avoid systemic contradiction.
      *   **Modularity:** In systems theory.
      *   **Many-Sorted Logic:** Technically, if "Valid" in sense 1 $\neq$ "Valid" in sense 2, it's equivocation, not contradiction. But the user implies the *same* term is used.
      *   **Paraconsistency:** The user asks how it differs. Paraconsistency allows $P \land \neg P$ to be held *together* without explosion. The legal example keeps them *apart*. This is a crucial distinction.
      *   **Dialetheism:** Requires the contradiction to be *true*. The court isn't saying "It is a true contradiction." They are saying "For purpose X, Yes. For purpose Y, No."

  5.  **Refining the Distinction (The "Stop Being Dialetheism" Point):**
      *   Dialetheism: $P$ and $\neg P$ are both true *in the same context/sense*.
      *   The Legal Case: $P$ is true in Context $C_1$, $\neg P$ is true in Context $C_2$.
      *   This is **Contextualism** or **Relativism**, not Dialetheism.
      *   However, if the contexts are not explicitly defined and the contradiction remains latent, it might be **Implicit Paraconsistency** or **Pragmatic Inconsistency**.
      *   There is a specific concept in AI and Knowledge Representation: **Contextual Reasoning** or **Multi-Context Systems**.
      *   In Philosophy of Law: **Legal Pluralism** (maybe too broad), **Doctrinal Compartmentalization**.

  6.  **Developing the Best Label:**
      *   *Compartmentalized Consistency:* Descriptive.
      *   *Contextual Validity:* Accurate.
      *   *Local Coherence:* Good systems theory term.
      *   *Fragmented Normativity:* Sounds academic.
      *   *The "As-If" Reasoning:* Vaihinger's "Philosophy of As If."
      *   *Best Fit:* **Contextualism** (philosophical) or **Doctrinal Compartmentalization** (legal).
      *   *Logical Formalism:* **Multi-Context Logic** or **Indexed Logic**.

  7.  **Addressing the Paraconsistent Question:**
      *   Paraconsistent logic *tolerates* the collision.
      *   This legal practice *prevents* the collision.
      *   It's a **Quarantine Strategy**.
      *   In computer science/logic: **Belief Revision** or **Non-Monotonic Logic** (defeasible reasoning). "The contract is valid *unless*..."
      *   Actually, **Defeasibility** is huge in law. A rule holds *ceteris paribus*.
      *   But the user says they "keep both."
      *   Let's look at **Kant's Antinomies** or **Wittgenstein's Language Games**. Different games, different rules.
      *   **Language Games:** In the "enforcement game," it's void. In the "restitution game," it's valid.

  8.  **Synthesizing the Answer:**
      *   **Acknowledge the insight:** It's a sharp observation. It's not dialetheism.
      *   **Primary Term:** **Contextualism** (specifically *Truth Relativism* or *Assessment-Sensitivity*).
      *   **Legal Theory Term:** **Doctrinal Compartmentalization** or **Fragmentation**.
      *   **Logical Mechanism:** **Multi-Context Systems** or **Indexed Semantics**.
      *   **Distinction from Paraconsistency:** Paraconsistency manages the *explosion* of contradiction. This practice manages the *occurrence* of contradiction by scoping.
      *   **Distinction from Dialetheism:** Dialetheism accepts the overlap ($P \land \neg P$). This avoids the overlap ($P_{c1} \land \neg P_{c2}$).
      *   **Suggested Label:** **"Scoped Consistency"** or **"Contextual Partitioning."**
      *   **Philosophical Precedent:** Wittgenstein (Language Games), Kaplan (Context/Index), Legal Realism.

  9.  **Refining the "Where it stops being Dialetheism" point:**
      *   It stops being dialetheism the moment you add an index (Valid$_{issue1}$ vs Valid$_{issue2}$). If you can add the index, it's equivocation/contextualism. If you *cannot* add the index and still assert both, *that* is dialetheism.
      *   The courts *could* resolve it by indexing, but often they don't explicitly. They just rely on the procedural posture to keep them apart. This is **Pragmatic Compartmentalization**.

  10. **Final Polish:**
      *   Ensure the tone is appropriate for a seminar prep (academic, precise, exploratory).
      *   Bring in specific legal logic concepts (Defeasibility, Alternative Holdings).
      *   Mention **Jaakko Hintikka** or **Gabbay** on Multi-Agent/Context logic if relevant (maybe too technical? Keep it accessible).
      *   Mention **Lon Fuller** or **Hart** on legal reasoning.
      *   *Self-Correction:* Wait, is there a specific term in non-classical logic? **Relevance Logic**? No. **Substructural Logic**? Maybe.
      *   Actually, **Local Coherence** is the strongest systems term.
      *   Let's focus on the difference between *ontological* contradiction (dialetheism) and *epistemic/pragmatic* partitioning.

  11. **Drafting the Response:** (Mental Outline)
      *   Validate the observation (it's real, it's common).
      *   Name it: **Contextualism** / **Indexicality** vs. **Compartmentalization**.
      *   Contrast with Dialetheism (Overlap vs. Separation).
      *   Contrast with Paraconsistency (Tolerance vs. Prevention).
      *   Legal specific terms: **Alternative Holdings**, **Defeasibility**.
      *   Proposed Label: **Scoped Normativity** or **Contextual Partitioning**.
      *   The Boundary: When the indices collapse.

  12. **Final Review against constraints:**
      *   User wants to know the term.
      *   User wants to know the difference from paraconsistent logic.
      *   User wants to know the boundary with dialetheism.
      *   User is prepping a seminar (needs depth).

