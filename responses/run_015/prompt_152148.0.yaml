answer: |-
  This is a fantastic observation, and you are right to sense that standard dialetheism doesn't quite capture it. Dialetheism posits that contradictions are *true* (the world is inconsistent). What you are describing in legal reasoning is not that the world is inconsistent, but that the *system of reasoning* is modularized to prevent inconsistency from becoming operationally fatal.

  Here is a breakdown of the concepts, the terminology, and the logical boundaries you are looking for.

  ### 1. The Terminology: What is this?

  There isn't one single "canonical" term in logic, but there are three overlapping frameworks that describe this phenomenon precisely.

  **A. Contextualism (or Indexicality)**
  In philosophy of language and logic, this is the claim that the truth value of a proposition depends on the context of assessment.
  *   **The Logic:** It is not that $P$ and $\neg P$ are both true. It is that $P_{context1}$ and $\neg P_{context2}$ are both true.
  *   **The Legal Application:** "Valid" in the context of *jurisdiction* (we have the power to hear this) does not mean "Valid" in the context of *enforcement* (we will order performance).
  *   **Why it fits:** It dissolves the contradiction by adding hidden indices. If the court never makes the indices explicit, it looks like a contradiction, but structurally it is contextualism.

  **B. Doctrinal Compartmentalization (Legal Theory)**
  In legal scholarship (particularly Critical Legal Studies and Legal Realism), this is often called **fragmentation** or **compartmentalization**.
  *   Scholars like Duncan Kennedy have written about how legal doctrine is "structured around contradictions" that are managed by keeping conflicting principles in separate "boxes" (e.g., Form vs. Substance, Rule vs. Standard).
  *   **Why it fits:** It acknowledges that the contradiction is real but managed procedurally rather than resolved logically.

  **C. Multi-Context Systems (Formal Logic/AI)**
  In artificial intelligence and knowledge representation, this is modeled as **Multi-Context Logic** (developed by researchers like Dov Gabbay).
  *   **The Logic:** Knowledge is stored in distinct contexts ($C_1, C_2, \dots$). Inference rules apply *within* a context, and "bridge rules" allow information to pass *between* contexts.
  *   **Why it fits:** If there is no bridge rule connecting the "Validity for Jurisdiction" context to the "Validity for Remedy" context, the contradiction never triggers an explosion.

  **Recommendation for your seminar:** I would call this **"Scoped Consistency"** or **"Contextual Partitioning."** It highlights that consistency is a local requirement, not a global one.

  ### 2. How is this different from Paraconsistent Logic?

  This is the crux of your second question. The difference lies in **Tolerance vs. Quarantine.**

  *   **Paraconsistent Logic:** Admits that $P$ and $\neg P$ might meet in the same space. It modifies the inference rules (specifically, it rejects *Ex Falso Quodlibet* or Explosion) so that when $P \land \neg P$ occurs, the system doesn't crash. It says: *"Contradictions can exist together, and we have a logic that survives them."*
  *   **Contextual Partitioning (The Legal Case):** Actively prevents $P$ and $\neg P$ from meeting. It modifies the *domain* of the propositions. It says: *"Contradictions cannot exist together, so we will ensure $P$ and $\neg P$ are never evaluated in the same scope."*

  **The Analogy:**
  *   **Paraconsistency** is like building a fireproof building. If a fire starts (contradiction), the building stands.
  *   **Contextual Partitioning** is like storing flammable chemicals in separate warehouses. If a fire starts in Warehouse A, it never reaches Warehouse B, so the "global fire" never happens.

  In your legal example, the court is not using a paraconsistent logic to tolerate the contradiction; they are using a **modular architecture** to ensure the contradiction remains latent.

  ### 3. Where does it stop being Dialetheism?

  This is your boundary question. The line is drawn at **Equivocation vs. Overlap.**

  *   **Dialetheism:** Requires that $P$ and $\neg P$ are true in the **same sense, at the same time, in the same respect.** (Aristotle's Law of Non-Contradiction formulation).
      *   *Example:* "This statement is false." (The Liar Paradox).
  *   **Contextual Partitioning:** Claims that $P$ and $\neg P$ are true in **different senses, times, or respects.**
      *   *Example:* "The contract is valid (for the purpose of restitution)" and "The contract is void (for the purpose of specific performance)."

  **The Boundary Test:**
  If you can resolve the apparent contradiction by adding a subscript (Valid$_1$ vs. Valid$_2$), it is **not dialetheism**; it is **equivocation** or **contextualism**.
  If you add the subscripts and the contradiction *remains* (i.e., Valid$_1$ and Not-Valid$_1$ are both asserted), *then* you have entered dialetheism.

  **The "Secret" Dialetheism:**
  However, there is a nuance you can raise in your seminar. Sometimes courts *refuse* to add the subscripts. They insist on the plain term "Valid" while using it in incompatible ways.
  *   If they do this knowingly to preserve a fiction, it is **Pragmatic Inconsistency**.
  *   If they do this because the legal concept itself is inherently unstable, some Legal Theorists (like the Critical Legal Studies movement) would argue this **is** a form of institutional dialetheism. They argue the law *is* fundamentally contradictory, and "compartmentalization" is just a mask to hide the dialetheic nature of the system from laypeople.

  ### 4. Summary for your Seminar Slides

  If I were structuring this section of your talk, I would organize it like this:

  1.  **The Phenomenon:** "Local Truths, Global Inconsistency."
  2.  **The Label:** **Contextual Partitioning** (or *Scoped Normativity*).
  3.  **The Mechanism:**
      *   Unlike **Dialetheism**, it denies the contradiction is real (it claims equivocation).
      *   Unlike **Paraconsistency**, it prevents the collision rather than surviving it.
  4.  **The Legal Function:** This allows for **Defeasible Reasoning**. A contract is *prima facie* valid, but *defeasibly* void. The court keeps the "valid" track alive for one issue (e.g., unjust enrichment) while killing it for another (e.g., breach).
  5.  **The Critical Take:** Is this logical rigor, or is it **Systemic Hypocrisy**? (This invites the debate on whether the law is truly consistent or just well-compartmentalized).

  ### One Specific Term to Look Up:
  Look into **"Alternative Holdings"** in legal procedure. This is the procedural mechanism that allows the contradiction.
  *   *Holding 1:* Contract is Void. (Case dismissed).
  *   *Holding 2:* **Even if** Contract is Valid, Plaintiff loses on Damages.
  *   This creates the "localized truth" you observed. It is formally known as **"In the Alternative"** reasoning.

  In logic, this maps closely to **Non-Monotonic Logic** (specifically **Defeasible Logic**). In defeasible logic, a conclusion holds *unless* defeated. You can have a rule that says "Contracts are valid" and a rule that says "Contracts without consideration are void." The system doesn't explode; it prioritizes the more specific rule for the specific issue at hand, without necessarily deleting the general rule from the books.

  **Final Verdict:** Call it **Contextual Partitioning** supported by **Defeasible Reasoning**. It distinguishes it clearly from the ontological claims of dialetheism and the tolerance mechanisms of paraconsistency.


