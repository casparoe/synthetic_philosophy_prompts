answer: |-
  Hey, good to catch you. Look, I love that you're tackling Scanlon with the Law & Econ crowd. They're the perfect audience to feel the friction here because their whole toolkit is built on aggregation—Kaldor-Hicks, cost-benefit, expected utility. Scanlon is basically a wrench in that machine. But if you don't scaffold it right, they'll just dismiss it as "soft" moralizing.

  Here's how I'd structure the 75 mins. I'm writing this out as a flow rather than a rigid syllabus because with grad students, you need to read the room. But keep this arc in mind.

  ### 1. The Dependency Chain (The "Why" Before the "What")

  You asked about the dependency chain, and this is where most people mess up. If you start with "Reasonable Rejection," the Law & Econ brains will immediately parse "Reasonable" as "Rational" (in the economic sense) and "Rejection" as "Veto power based on preference."

  You have to invert that. The concept that *must* land first is **the value of mutual recognition** (or moral standing).

  Before you even mention Scanlon, spend the first 5 minutes establishing that for Scanlon, morality isn't about maximizing good states of affairs; it's about relating to others as equals. If they don't buy that *status* is the primary good, "reasonable rejection" just sounds like a bargaining chip.

  **The Sequence:**
  1.  **Standing:** We owe each other justifications because we are equals.
  2.  **Justification:** A justification fails if it treats someone as a means to the greater good without their consent.
  3.  **Reasonable Rejection:** This is the *test* for whether standing was respected. It's not "I'm annoyed"; it's "This principle denies my status."

  If you skip step 1, step 3 collapses into utilitarianism with extra steps.

  ### 2. The Rawls/Hobbes Separation (Minute 5–10)

  You're right to want to separate him from Rawls and Hobbes immediately. Do this right after you establish "Standing," but *before* you define the contractualist formula.

  **Where it lands:** In the opening framing.
  **The Misconception it prevents:** The "Veil of Ignorance" trap.

  Law & Econ students know Rawls. They think "Contractualism = Veil of Ignorance = Maximize the position of the worst off behind a veil." If they think that, they'll assume Scanlon allows aggregation because, behind a veil, I'd bet on being one of the five, not the one.

  **What to say:**
  "Scanlon isn't Hobbes. It's not a bargain for mutual advantage where the majority outvotes the minority. It's not Rawls. We aren't behind a veil of ignorance calculating risk. We are standing in the light, looking at specific people. The question isn't 'What would I agree to if I didn't know who I was?' It's 'Can I justify this to the person who actually loses out?'"

  This stops them from running an expected utility calculation in their heads. It forces them to look at the *actual* loser.

  ### 3. The Carrying Example (Minute 10–40)

  Stick with the **Rescue Boat** case (or the Burning Building variant). It's clean, and it directly attacks the "save the most lives" heuristic they live by. But you have to frame it carefully.

  **Properties the example MUST have:**
  *   **Symmetry of Loss:** The one and the five must face the *same* magnitude of loss (death). If the one loses a leg and the five lose lives, the econ students will solve it with trade-offs. The loss must be incomparable and absolute.
  *   **No Causal Responsibility:** None of the people can be responsible for being in that position. No "the five were negligent."
  *   **Principle Focus:** Don't ask "Who do you save?" Ask "Which *principle* can be reasonably rejected?"
      *   Principle A: Save the greater number.
      *   Principle B: Save whoever is closest / flip a coin.

  **What it must LACK:**
  *   **Hidden Utilitarian Math:** Don't let them talk about "social utility" or "future earnings."
  *   **Trade-offs:** No possibility of compensating the loser later. This is a one-shot deal.

  **How to run it:**
  Walk them through the complaint of the *single* person. "If we adopt Principle A (Save the Five), the One dies. Can the One reasonably reject this?"
  Most will say yes, because they die.
  Then ask: "If we adopt Principle B (Flip a Coin), the Five might die. Can the Five reasonably reject this?"
  Here's the trap. The Five will say, "But we are five!"
  Your job is to press: "Scanlon says you have to justify this to *each* of the five individually. Does Person #5 have a stronger complaint than Person #1 in the other scenario?"

  ### 4. Mapping the Misconceptions (The "Heads Up")

  Here is where you need to intercept their brains. They're going to drift.

  **Misconception 1: "This is just Social Contract Theory 2.0"**
  *   **When:** Minute 10 (during the Rawls/Hobbes separation).
  *   **The Fix:** Emphasize that this isn't about *agreement*. It's about *justifiability*. Even if the five agree to save themselves, the question is whether that agreement respects the one.

  **Misconception 2: "Reasonable Rejection = Subjective Anger"**
  *   **When:** Minute 20 (right before the example).
  *   **The Fix:** Distinguish "Reasonable" from "Rational." In Econ, Rational = maximizes my interest. In Scanlon, Reasonable = acknowledges the interests of others.
  *   **Script:** "If I reject a principle just because it costs me $5, that's rational. But is it *reasonable* if it saves your life? No. 'Reasonable' filters out selfish vetoes. It requires generic reasons, not personal preferences."

  **Misconception 3: "Scanlon Solves Aggregation by Adding Up Complaints"**
  *   **When:** Minute 50 (The Climax).
  *   **The Fix:** This is the hardest part. They will try to say, "Well, the five have 5x the complaints."
  *   **Script:** "Scanlon's Individualist Restriction. You compare the complaint of the One against the complaint of *each* of the Five, not the sum. If the complaint of the One (death) is not weaker than the complaint of Person #3 (death), then the numbers don't tip the scale. You can't merge five distinct moral claims into one big 'super-claim.'"

  ### 5. Scope Limits (What NOT to Teach)

  You only have 75 minutes. If you try to cover everything, you'll lose them.
  *   **Don't explain the Formal Decision Theory:** No need to draw decision trees or talk about ex-ante vs. ex-post efficiency unless they bring it up. It distracts from the moral core.
  *   **Don't solve the "Numbers Count" debate:** Scanlon later nuanced his view (in *Does Numbers Count?*). Don't get into the weeds of his later revisions. Stick to the core tension in *What We Owe to Each Other*. If you solve it for them, they won't feel the problem.
  *   **Don't compare to Rule-Utilitarianism in depth:** It's a rabbit hole. Just note that Rule-Utilitarianism would still aggregate in the long run; Scanlon refuses to even start there.

  ### 6. The End Check (Minute 70–75)

  You need a question that proves they get the *mechanism*, not just the conclusion. Don't ask "What does Scanlon say?" Ask them to apply the logic to a new constraint.

  **The Question:**
  "Imagine the five people in the boat are all members of a single family, and they argue that their 'collective grief' if they die is greater than the grief of the single person's family. Under Scanlon's framework, is that a *reasonable* ground for rejection? Why or why not?"

  **What you're looking for:**
  *   **Bad Answer:** "No, because Scanlon says numbers don't count." (This is memorization).
  *   **Good Answer:** "No, because the justification must be to *each individual*. The fact that Person #2 is sad about Person #1 dying doesn't strengthen Person #1's own complaint against the principle. The complaint must be grounded in what happens to *me*, not my network."

  If they grasp that the *unit of analysis* is the individual standpoint and that you can't import external aggregates (even emotional ones) to bolster a claim, they've got it.

  ### Final Thought

  Keep the energy up. These students are trained to solve problems. Scanlon presents a problem that *doesn't* have a clean solution, and that will frustrate them. Lean into that frustration. Tell them, "The discomfort you feel right now? That's the sound of efficiency hitting the wall of human standing."

  Let me know how it goes. And hey, don't worry if the board work gets messy—mine always does.

  Catch you later.
