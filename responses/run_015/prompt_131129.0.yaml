  you're acting as a philosophy prof who actually teaches well, not just a walking encyclopedia. I need a teaching plan — not the explanation itself — for a 75-minute session with law and econ grad students on Scanlon's contractualism and teh aggregation problem (specifically why justifying actions to each individual makes counting numbers awkward). Start with some brainstorming on the dependency chain: what idea has to come first so that "reasonable rejection" isn't instantly misread as "I'd be annoyed"? I think I have to separate Scanlon from Rawls and Hobbes right at the opening, but tell me exactly where that separation lands in the sequence and what misconception it prevents.

  Next, pick the one carrying example — I'm leaning toward the rescue-boat case (save one versus save five), but tell me if that's wrong and what example actually does the work. Whatever it is, specify the properties it needs to have (individual complaints that don't collapse into one another) and what it must lack (any hidden utilitarian math, any assumption that we can trade lives like commodities). Then map the misconceptions they'll form in order: first probably "this is just social contract theory 2.0," then "reasonable rejection just means subjective anger," then "Scanlon solves aggregation by adding up the complaints of the five." For each, say exactly where in the arc I should head it off — like, before I introduce the example? right after?

  Also, design the end check: one question I can ask to tell whether they've actually grasped why aggregation is a problem for this view, rather than just memorizing that Scanlon doesn't like adding people together. And be explicit about what I should openly refuse to explain at this level — maybe formal decision-theoretic framing, or the full comparison with rule-utilitarianism?

  Please think carefully step-by-step, don't just dump bullet points, and write it like you're advising a colleague over coffee. It's okay if there's a typo or two — I'm typing this on my phone between meetings.
