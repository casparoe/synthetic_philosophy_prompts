      *   **Currency:** "Status Markers."
      *   **Flow:** Workers build. Masters verify.
      *   **The Hegelian Turn:** Midway, swap the currency value. Masters need Workers to *give* them a marker to confirm the work is good. Workers need Masters to *give* them a marker to confirm they are allowed to work.
      *   *Actually, let's look at the prompt again:* "Recognition can only be granted downward and only validated upward."
      *   *Interpretation:* Master gives recognition (praise/pay) down. Slave validates (accepts/rejects) it up. If Slave rejects the praise, Master gets no credit.
      *   *Okay, let's build that.*

  4.  **Drafting the Plan:**
      *   **Title:** The Dependency Loop.
