  8.  **Review against Constraints:**
      *   10 people? Yes (2 Masters, 8 Slaves).
      *   75 mins? Yes.
      *   Feel in bodies? Yes (physical tokens, standing/sitting, measuring).
      *   Hollow feeling? Yes (forced praise mechanic).
      *   Risk? Yes (refusal mechanic).
      *   No lecturing first? Yes (debrief after).
