          *   *Let's try the Token System requested:* "Recognition can only be granted downward and only validated upward."
          *   *System:*
              *   Masters hold "Authority Chips."
              *   Slaves hold "Labor Chips."
              *   To complete a task unit, a Slave spends a Labor Chip.
