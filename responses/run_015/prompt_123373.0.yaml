      *   *Refining the "Risk":* How to simulate the "life and death" struggle? Maybe a "Veto" or "Strike" mechanic. If the Slave refuses, the project fails for everyone. If the Master pushes too hard, the Slave revolts.
      *   *Revised Mechanic:* "The Validation Loop."
          *   Goal: Build a specific structure.
