prompt: |-
  I've been dealing with this thing at work — got bumped up to team lead over people who were my peers last year, and now I'm weirdly obsessed with how I still need them to see me as "real" while I'm also the one signing off on their work. It made Hegel's master-slave dialectic stop feeling like old history and start feeling like an actual pattern I live inside.

  Can you design a classroom activity for my workshop? About 10 people, mix of grad students and staff, 75 minutes, one session. I want them to feel the recognition problem in their bodies, not just discuss it: specifically, the hollow feeling of being acknowledged by someone you've made subordinate, and why real equality requires risking something rather than just being polite. The rules should build the structure themselves.

  I'm thinking roles with unequal authority over a shared creative task, plus a token system where recognition can only be granted downward and only validated upward — so they feel the dependency loop physically. Need: clear rules, roles, a status/payoff scheme that uses no real money, timeline for the session, and a debrief that maps what actually happened onto Hegel's dialectic (the struggle, the reversal, the hollow victory) without me lecturing first. Also tell me what will definatly go wrong the first time I run it and how to handle it. Be honest about which part of Hegel's view this can't reproduce — probably the historical labor/transformation-of-consciousness bit — and say that I need to supply it.

  Please say how confident you are in this design, and single out the specific part you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **User Context:** Recently promoted team lead, struggling with the shift from peer to authority. Feels the tension of needing recognition from subordinates while holding power over them. Connects this to Hegel's Master-Slave Dialectic (Lordship and Bondage).
      *   **Task:** Design a 75-minute classroom activity/workshop.
      *   **Audience:** 10 people (mix of grad students and staff).
      *   **Goal:** Make participants *feel* the recognition problem physically/experientially, not just discuss it. Specifically: the hollowness of recognition from a subordinate, the necessity of risk for real equality.
      *   **Mechanism:** Roles with unequal authority, shared creative task, token system (recognition flows down, validation flows up).
      *   **Requirements:** Clear rules, roles, status/payoff scheme (no real money), timeline, debrief mapping to Hegel (struggle, reversal, hollow victory), prediction of failure points, limitations of the analogy regarding Hegel.
      *   **Meta-Requirement:** State confidence level and identify the weakest part of the design.

  2.  **Deconstruct Hegel's Master-Slave Dialectic (Phenomenology of Spirit):**
      *   *Core Conflict:* Two self-consciousnesses meet. Each wants to be recognized as absolute.
      *   *The Struggle:* Life-and-death struggle. One submits (Slave/Bondsman) to preserve life; the other dominates (Master/Lord).
      *   *The Paradox:* The Master gets recognition, but from a Slave whom he does not recognize as an equal. Therefore, the recognition is worthless/hollow. The Slave, through work/labor on the world, gains a sense of self and independence, while the Master becomes dependent on the Slave's work.
      *   *Resolution (Synthesis):* Mutual recognition (not fully achieved in the dialectic itself, but implied as the goal of Spirit).
      *   *Key User Insight:* "Real equality requires risking something rather than just being polite." (This aligns with the "life-and-death struggle" aspect, though in a workshop, we can't risk actual lives).

  3.  **Brainstorming the Activity:**
      *   *Constraint:* 75 minutes is tight. 10 people is a good size for 2 groups of 5 or 1 group of 10. Let's go with 2 groups of 5 to allow observation, or 1 group of 10 for intensity. Given the "feel it in their bodies" request, one cohesive group might be better, but splitting allows for comparison. Let's try one cohesive group with internal hierarchy to maximize the tension. Actually, 2 teams competing might dilute the hierarchy focus. Let's make *one* project with internal hierarchy.
