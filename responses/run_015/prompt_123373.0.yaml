      *   **Hegel Limitation:** No actual risk of life. No long-term transformation of consciousness through labor (it's just 20 mins of building).

  5.  **Refining the Design (Self-Correction):**
      *   *Critique:* The above is a bit dry. Needs more "body."
      *   *Adjustment:* Make the physical act of validation cumbersome. The Director has to stand up and walk over to stamp the work. The Builder has to stop working and wait. This creates friction.
      *   *Adjustment:* The "Risk." Introduce a "Sabotage" option. Builders can hide a piece. Directors can veto a section.
      *   *Better Adjustment:* Let's focus on the *voice*. The prompt mentions "being polite."
      *   *Rule:* Directors cannot use imperative verbs ("Put this here"). They must use requests ("I would like this here"). Builders cannot say "No." They must say "I will try."
      *   *Wait, the prompt wants them to feel the hollowness.*
