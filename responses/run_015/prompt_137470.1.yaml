prompt: |-
  I'm in an undergraduate seminar on ethics and public policy, and we have just spent two weeks on social discounting. I want to get clearer on what our actual institutional practice commits us to. I don't need citations or a reading list, and I'd rather you worked from the practice as I describe it than from any canonical statement of it.

  Here is the pattern I can't turn into a single theory.

  (a) When a government cost-benefit analysis compares a regulation that saves lives soon with one that saves lives a century from now, it discounts the later lives at a positive annual rate, so a hundred statistical lives saved in the distant future come out worth a small fraction of a hundred saved next year.

  (b) The same government, licensing a repository for long-lived radioactive waste, evaluates the risk over a horizon of many thousands of years and in some frameworks declines to discount the harm at all, or applies something close to a zero rate.

  (c) The same government borrows at long maturity and funds basic research and disease-surveillance infrastructure, justifying the spending by benefits that arrive decades out, which implies a far lower implicit rate than the one in (a).

  (d) Courts in the same jurisdiction reduce an award for lost future earnings to present value, but do not discount the pain, the loss of a faculty, or the wrongfulness of the injury itself: those are made good in full no matter how far into the future they fall.

  (e) And in the personal case we treat it as a failing, not a preference, that I care less about my own toothache next year than about an identical one today.

  So: what view of the moral significance of time does this set of practices presuppose? More specifically, does (a) strictly presuppose pure time preference, or could the whole of the observed discounting be reconstructed as two non-temporal factors that happen to shrink with distance: a hazard factor, the chance that the benefit never arrives because the beneficiaries, the institution or the state does not survive, and a satiety factor, the thought that future people will be richer, so a unit of resource buys less welfare? If that reconstruction is available, is the practice underdetermined, licensed equally by a date-sensitive and a date-neutral theory? And where do the zero-rate and declining-rate schedules in (b) fit: do they show the practice was never committed to pure time preference, or do they substitute a different view, on which uncertainty about the rate, or extinction risk, is the only legitimate discounter?

  One proposal my seminar kicked around, which we called the Two-Key Rule, is that a public evaluation may apply a hazard factor and a satiety factor and no other temporal factor, and must state the two separately. I have three questions about it. Would the practice as it actually stands look any different under the Two-Key Rule, and if so in which of the cases above? Is the current practice really Two-Key in disguise, which would mean it presupposes nothing about pure time preference at all? And what would the defender of an explicit pure rate say is the strongest reason not to accept the reconstruction?

  Finally, one of us suggested that the discounting in (a) is not about dates at all but about identity: if who exists in a century depends on what we do now, there may be no particular person whose life is being weighed less, so the worry about pure time preference never gets a grip. Does that dissolve the puzzle or just relocate it, and does it make (a) easier or harder to reconcile with (b) through (e)? Please also tell me where in this I have described the practice wrongly, or where an inconsistency I am reading into it is only apparent.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Context:** Undergraduate seminar on ethics and public policy.
      *   **Topic:** Social discounting (time preference in policy).
      *   **Constraint:** No citations, no reading lists. Work from the *described practice*, not canonical texts.
      *   **Goal:** Clarify what the actual institutional practice commits us to regarding the moral significance of time.
      *   **Specific Questions:**
          1.  What view of time does the pattern (a)-(e) presuppose?
          2.  Does (a) strictly presuppose pure time preference (PTP), or can it be reconstructed via hazard + satiety factors?
          3.  Is the practice underdetermined (licensed by both date-sensitive and date-neutral theories)?
          4.  How do (b) and declining rates fit (do they show PTP was never the commitment, or do they substitute a new view)?
          5.  Evaluate the "Two-Key Rule" (Hazard + Satiety only, stated separately):
              *   Would practice look different?
              *   Is current practice Two-Key in disguise?
              *   What is the strongest argument *against* this reconstruction (from a PTP defender)?
          6.  Evaluate the "Identity" proposal (non-identity problem): Does it dissolve or relocate the puzzle? Does it help reconcile (a) with (b)-(e)?
          7.  Critique the user's description: Where is the practice described wrongly, or where is an apparent inconsistency actually consistent?

  2.  **Deconstruct the Patterns (a)-(e):**
      *   (a) Standard CBA: High discount rate for distant lives/resources. (Implies PTP or high hazard/satiety).
      *   (b) Nuclear Waste: Zero/low discount over millennia. (Implies no PTP, or extreme caution regarding hazard).
      *   (c) Infrastructure/Research: Low implicit rate for long-term public goods. (Implies lower PTP than (a), or different hazard profile).
      *   (d) Tort Law: Discount earnings (economic), not pain/wrongfulness (non-economic). (Distinguishes market value from moral worth).
      *   (e) Personal Ethics: Caring less about future self is a *failing*. (Implies PTP is irrational/immoral personally).

  3.  **Address Question 1: What view of time does this presuppose?**
      *   *Observation:* The practice is inconsistent if viewed as a single moral theory. It's pragmatic, not philosophical.
      *   *Commitment:* It doesn't commit to *one* view. It commits to *instrumentalism*. Time is treated differently based on the *type* of good (economic vs. moral/rights-based) and the *type* of uncertainty.
      *   *Moral Significance:* Time itself has no intrinsic moral weight in (b), (d), and (e). It has instrumental weight in (a) and (c).

  4.  **Address Question 2 & 3: PTP vs. Hazard/Satiety Reconstruction & Underdetermination:**
      *   *Can (a) be reconstructed?* Yes. Standard Ramsey Rule ($r = \delta + \eta g$). $\delta$ is PTP, $\eta g$ is satiety (growth). Hazard is often added as risk of non-existence.
      *   *Is it underdetermined?* Mathematically, yes. A 3% discount rate could be 3% PTP + 0% growth, or 0% PTP + 3% growth/hazard.
      *   *However:* In practice, (a) usually *assumes* PTP implicitly because growth rates fluctuate but discount rates stay sticky. But theoretically, the reconstruction is available.
      *   *Does (b) fit?* (b) suggests that when rights/survival are at stake (nuclear waste), hazard/satiety arguments fail. You can't say future people are "richer" so radiation poisoning matters less. You can't say "state might not exist" so we can poison them. This suggests (a)'s discounting *was* partly PTP or at least inappropriate economic modeling applied to moral harms.

  5.  **Address Question 4: Zero/Declining Rates in (b):**
      *   Do they show PTP was never the commitment? They show PTP is *contested*.
      *   Do they substitute a different view? Yes, they substitute a "catastrophic risk" or "rights-based" view. If the harm is irreversible and existential, standard economic discounting is suspended.
      *   *Interpretation:* The practice isn't consistent. It switches frameworks. (a) is Utilitarian/CBA. (b) is Deontological/Rights-based (don't violate rights of future gens).

  6.  **Address Question 5: The Two-Key Rule (Hazard + Satiety only):**
      *   *Would practice look different?* Yes. In (a), agencies often use a blended rate without disentangling growth vs. pure impatience. Under Two-Key, they'd have to justify the "impatience" part as hazard. If hazard is low (stable state), the rate drops.
      *   *Is current practice Two-Key in disguise?* No. Current practice often embeds PTP ($\delta$) in the social discount rate guidelines (e.g., OMB Circular A-4 uses 3% and 7%, partly reflecting opportunity cost of capital which implies PTP). It's not *just* hazard/satiety.
      *   *Strongest Argument Against (from PTP defender):* Opportunity Cost of Capital. Resources invested today yield returns. If we don't discount, we over-invest in low-yield long-term projects and starve the present economy. It's not about moral worth of time, but productivity of capital. (This is the economic efficiency argument vs. the ethical argument).

  7.  **Address Question 6: The Identity Proposal (Non-Identity Problem):**
      *   *Does it dissolve the puzzle?* No. It complicates it. If policy (a) changes *who* is born, we aren't harming specific identifiable future people (Parfit).
      *   *Does it help reconcile (a) and (b)?* Actually, it makes (a) *harder* to justify morally if the goal is "helping people." If they wouldn't exist without the policy, are they "better off"?
      *   *Reconciliation:* It highlights that (a) is about *aggregating welfare* (utilitarian), while (b) is about *avoiding catastrophe* (threshold). Identity arguments usually attack (a)'s coherence, not support it. It relocates the puzzle from "time" to "personhood."
      *   *Verdict:* It doesn't solve the tension between (a) and (e). (e) is about *my* future self (same identity). (a) is about *different* people. The inconsistency remains: why treat time differently for same-identity (e) vs different-identity (a)?

  8.  **Address Question 7: Critique of Description (Where is the user wrong?):**
      *   *Inconsistency:* The user sees inconsistency. Is it apparent?
      *   *Correction 1:* (a) is often about *capital opportunity cost*, not just moral discounting. It's "money today buys more than money tomorrow."
      *   *Correction 2:* (d) Tort law distinguishes *economic* loss (market rate) vs. *non-economic* (moral). This aligns with (a) vs (b). (a) is economic valuation of life (VSL), (b) is often physical safety limits.
      *   *Correction 3:* (c) Infrastructure often uses *lower* discount rates than (a) regulatory CBA. This is consistent if (a) is private-sector proxy and (c) is public good.
      *   *Major Point:* The practice isn't trying to be a moral theory. It's a set of heuristics for different domains (Efficiency vs. Safety vs. Rights). The "inconsistency" is feature, not bug, reflecting different normative goals.

  9.  **Synthesize and Structure:**
      *   Introduction: Acknowledge the sophistication of the query. State the thesis: The practice is not a unified theory but a domain-specific toolkit.
      *   Section 1: The Moral Significance of Time (Instrumental vs. Intrinsic).
      *   Section 2: PTP vs. Reconstruction (Hazard/Satiety). Address underdetermination.
      *   Section 3: The Two-Key Rule evaluation.
      *   Section 4: The Identity Proposal.
      *   Section 5: Critique of the Description (Where the inconsistency is real vs. apparent).
      *   Conclusion: Summary of the commitment (Pragmatic Pluralism).

  10. **Refine Tone:** Academic, precise, engaging, avoiding jargon where possible but respecting the level of the seminar. Ensure no citations are used.

  11. **Self-Correction/Nuance Check:**
      *   *Check:* Did I answer the specific question about whether (a) *strictly* presupposes PTP? *Answer:* No, it doesn't strictly presuppose it, but standard implementation often assumes it.
      *   *Check:* Did I address the "strongest reason" for PTP? *Answer:* Yes, Opportunity Cost of Capital.
      *   *Check:* Did I handle the Nuclear Waste exception? *Answer:* Yes, as a rights/safety constraint overriding efficiency.
      *   *Check:* Is the distinction between economic and moral valuation clear? *Answer:* Crucial for (d).

  12. **Final Polish:** Ensure the flow is logical. (Start with the big picture, drill down to the Two-Key, then Identity, then correct the premises).

  *(Self-Correction during drafting)*: I need to be careful not to say "The government thinks X." Instead, "The practice implies X." The user asked what the *practice* commits us to.
  Also, make sure to explicitly answer the "Two-Key" sub-questions.
  1. Would practice look different? Yes, rates would likely be lower and more variable.
  2. Is it Two-Key in disguise? No, PTP is often baked in.
  3. Strongest argument against? Capital productivity.

  Okay, ready to write.
answer: |-
  This is a sophisticated dissection of the tension between economic efficiency and moral intuition in public policy. You have correctly identified that the "practice" is not a single coherent theory but a patchwork of heuristics applied to different domains. Here is an analysis of what this practice commits you to, evaluated against your specific questions.

  ### 1. The Moral Significance of Time Presupposed by the Practice

  The practice does not commit the institution to a single view of the moral significance of time. Instead, it commits to **normative pluralism based on the type of good being evaluated.**

  *   **In (a) and (c) (Economic/Regulatory):** Time is treated **instrumentally**. A benefit later is worth less not because the future person matters less, but because resources have an opportunity cost (they could be invested to grow) and because there is uncertainty about delivery.
  *   **In (b) and (d) (Rights/Safety):** Time is treated as **morally neutral**. A right not to be irradiated or a right to bodily integrity does not depreciate. The "wrongfulness" is intrinsic to the act, not the date.
  *   **In (e) (Personal Ethics):** Time is treated as **morally neutral**, and deviation from this is irrational.

  **The Commitment:** The institutional practice presupposes that **efficiency** (maximizing aggregate welfare given scarce resources) requires discounting, but **justice** (respecting rights and avoiding harm) forbids it. The inconsistency you see is the friction between these two normative frameworks operating in the same government.

  ### 2. Pure Time Preference (PTP) vs. The Reconstruction (Hazard + Satiety)

  You ask if (a) strictly presupposes Pure Time Preference (a raw preference for the present simply because it is the present), or if it can be reconstructed entirely via **Hazard** (probability the benefit never arrives) and **Satiety** (future people will be richer, so marginal utility of money is lower).

  **Does (a) strictly presuppose PTP?**
  No. Mathematically, the standard Ramsey formula for the social discount rate ($r$) is the sum of the pure time preference rate ($\delta$) and the product of elasticity of marginal utility ($\eta$) and growth ($g$).
  $$r = \delta + \eta g$$
  The practice in (a) observes $r$. It does not empirically isolate $\delta$. Therefore, the observed discounting *could* be reconstructed entirely as hazard and satiety ($\delta = 0$).

  **Is the practice underdetermined?**
  Yes. A 3% discount rate is compatible with a moral view that the future matters equally (date-neutral), provided you believe future generations will be significantly wealthier (satiety) or that there is a non-zero chance of societal collapse before the benefit arrives (hazard).

  **Where do (b) and declining rates fit?**
  The zero-rate in (b) (nuclear waste) suggests that the reconstruction (Hazard + Satiety) breaks down when the harm is **catastrophic** or **rights-violating**.
  *   **Satiety fails:** You cannot argue that a future person being richer makes radiation poisoning less bad. Health and survival are not subject to diminishing marginal utility in the same way as consumption.
  *   **Hazard fails:** You cannot argue "the state might not exist" as a license to leave a lethal hazard. If the state doesn't exist, the hazard remains; the moral duty to not poison the earth persists regardless of institutional continuity.

  **Conclusion on Reconstruction:** The practice implies that Hazard and Satiety are legitimate discounters for *economic goods*, but neither legitimizes discounting *basic rights or survival*. The shift from (a) to (b) reveals that the practice was never fully committed to PTP; it was committed to **discounting consumption, not welfare or rights.**

  ### 3. Evaluating the "Two-Key Rule"

  The proposal is: *Public evaluation may apply a hazard factor and a satiety factor and no other temporal factor, and must state the two separately.*

  **Would the practice look different under the Two-Key Rule?**
  Yes, significantly, specifically in case (a).
  *   Currently, agencies often use a flat "social discount rate" (e.g., 3% or 7%) that blends these factors.
  *   Under the Two-Key Rule, for a regulation saving lives in 100 years, the **Satiety Key** might be high (future people are rich), but the **Hazard Key** might need to be very low (the probability of total human extinction or total institutional failure in 100 years is likely less than 3% per annum).
  *   If forced to separate them, the "Hazard" rate for stable democracies over a century is quite low. This would likely drive the effective discount rate for long-term environmental regulations down, making (a) look more like (b).

  **Is current practice Two-Key in disguise?**
  No. Current practice often implicitly includes a non-zero Pure Time Preference ($\delta$). This is frequently justified by "political myopia" or the "opportunity cost of capital." By not separating them, the practice allows a raw impatience for the present to hide inside the "risk" or "growth" assumptions. The Two-Key Rule would force the disclosure of that impatience, which would likely be politically untenable if labeled "we value future lives less simply because they are future."

  **What is the strongest reason *not* to accept the reconstruction (from a PTP defender)?**
  The defender of an explicit pure rate would argue from **Capital Productivity**, not morality.
  *   *Argument:* "It is not that we *care* less about the future. It is that a dollar invested today becomes \$1.03 next year. If we fund a project that returns \$1.02 next year, we have literally made the future poorer by diverting resources from a higher-yield use."
  *   This argues that discounting is a constraint of **scarcity and technology**, not ethics. Even if we love the future equally, we should not invest in low-yield long-term projects if high-yield short-term projects exist, because the surplus from the short-term projects can be invested to help the future *more*.
  *   *Counter:* This argument works for money (case c), but struggles when applied to irreversible loss of life or species (case a/b), where money is not a perfect substitute.

  ### 4. The Identity Proposal

  The suggestion is: *Discounting in (a) is about identity (non-identity problem). If policy changes who is born, we aren't weighing specific future lives less.*

  **Does this dissolve the puzzle?**
  No, it relocates it.
  *   If (a) is justified because "those specific people wouldn't exist otherwise," it solves the harm problem but creates a **comparison problem**. It implies we cannot say a policy is *better* for future people if their very existence depends on the policy.
  *   It makes (a) harder to reconcile with (e). In (e), it is the *same* person (you) at different times. We agree you should not discount your own future pain. In (a), if it is *different* people, the intuition that "time shouldn't matter" weakens for some, but the intuition that "we shouldn't leave a worse world" remains.

  **Does it reconcile (a) with (b) through (e)?**
  It makes reconciliation harder.
  *   (b) Nuclear waste affects specific future people regardless of identity (radiation doesn't care who your parents were). If (a) relies on identity to justify discounting, (b) cannot use that justification, widening the gap between the two practices.
  *   (e) Personal identity is continuous. If the moral force of (e) comes from identity, then (a) (different identities) is fundamentally different.
  *   *Verdict:* The Identity argument explains why we might feel *less* obligation to specific future individuals, but it does not justify the *economic* discounting rates used in (a). It is a moral shield, not an economic calculator. It dissolves the *moral* guilt of (a) but does not explain the *mathematical* inconsistency with (b).

  ### 5. Critique of Your Description

  You have described the practice accurately in spirit, but there are two places where the inconsistency is more apparent than real, and one place where the description might be slightly off.

  **1. The "Inconsistency" between (a) and (c) is often apparent.**
  You note (a) uses high rates and (c) uses low rates. In many jurisdictions, this is not inconsistent practice but **categorical differentiation**.
  *   (a) Regulatory CBA often uses a rate reflecting the **opportunity cost of private capital** (displacing private investment).
  *   (c) Public Infrastructure often uses a rate reflecting the **social rate of time preference** (displacing public consumption).
  *   The practice commits to the view that *what is displaced* matters more than *when the benefit arrives*. If a regulation kills a private factory, the rate is high. If a dam replaces public spending, the rate is low. This is consistent within a "shadow price" framework, even if it looks like time-preference inconsistency.

  **2. The Description of (d) (Tort Law).**
  You say courts do not discount pain or wrongfulness. This is mostly correct, but with a caveat: Courts rarely award damages for pain and suffering 50 years in the future because the plaintiff is usually dead. In wrongful death cases, the "loss" is calculated at the time of death.
  *   *Correction:* The inconsistency here is real, but it highlights the **Market vs. Moral** divide. Tort law discounts *earnings* because earnings are market goods (subject to interest rates). It does not discount *pain* because pain is not a market good. This aligns perfectly with the distinction between (a) [economic valuation of life] and (b) [physical safety]. The practice is consistent in treating market goods as time-sensitive and moral harms as time-insensitive.

  **3. The Description of (b) (Nuclear Waste).**
  You suggest some frameworks decline to discount harm at all. This is the strongest point of your critique. However, be aware that even in nuclear waste, **costs** of containment are discounted. Only the **risk threshold** is treated as time-invariant.
  *   *Nuance:* The practice is not "zero discounting." It is "discount costs, but do not discount safety standards." This reinforces the conclusion that the practice is not committed to a theory of time, but to a theory of **obligation**. We discount the *price* of doing our duty, but not the *duty* itself.

  ### Summary of the Commitment

  Your seminar's practice does not presuppose a single moral significance of time. It presupposes a **lexical ordering of values**:

  1.  **Rights/Safety (Cases b, d, e):** Time is morally neutral. Duties to avoid catastrophe or pain do not depreciate.
  2.  **Efficiency/Allocation (Cases a, c):** Time is instrumentally significant. Resources have opportunity costs, and future wealth is expected to be higher.

  The "Two-Key Rule" would improve transparency by forcing the economic justification (Hazard/Satiety) to be separated from any hidden impatience (PTP). The Identity argument is a distraction; it explains why we might not owe specific duties to specific unborn people, but it does not justify the economic math of (a).

  The strongest defense of the current messy practice is that it is **pragmatic, not philosophical**. It uses discounting to prevent present poverty (by ensuring capital is used efficiently) while using zero-discounting in specific domains to prevent existential risk. It accepts the inconsistency as the cost of governing a world where we must both invest for growth and protect against ruin.
