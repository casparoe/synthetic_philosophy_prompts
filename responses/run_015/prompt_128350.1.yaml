answer: |-
  ### Brainstorming & Mechanical Selection

  **Candidate 1: The "Archivist" Split (Three Groups)**
  *   *Mechanic:* Group C codes the raw ledger (deciding what counts). Groups A and B receive Group C's cleaned data and perform their respective rankings (Count vs. Rate).
  *   *Discard:* Logistical bottleneck. If Group C gets stuck on a boundary case (e.g., "famine death"), Groups A and B sit idle. In an 80-minute session, dependency chains create dead time. I want every student to feel the friction of the boundary decision personally.

  **Candidate 2: The "Policy Maker" Simulation**
  *   *Mechanic:* Students are governors allocating budget based on violence levels. They must justify their choice of measure to a "central council" (the instructor).
  *   *Discard:* Shifts focus from *epistemology* to *politics*. Students will argue about resource allocation fairness rather than the constitutive rules of measurement. I want them staring at the numbers, not negotiating budgets.

  **Candidate 3: The "Parallel Ledger" (Selected)**
  *   *Mechanic:* All three groups receive the identical Raw Ledger and Population Table. All must first agree internally on which asterisked (*) incidents to include. Then, Group A ranks by "Volume," Group B by "Danger," Group C (acting as auditors) checks the reporting bias notes.
  *   *Rationale:* Ensures everyone grapples with the boundary problem (Constraint 3) before the aggregation problem (Constraint 2). It creates a shared data experience but divergent analytical outcomes.

  ***

  ### Activity Design: The Ostral Chronicle

  **Materials List**
  1.  **The Ostral Ledger (18 copies):** 4 pages. Contains the Population Table and the Incident List (56 clear, 12 ambiguous marked with *).
  2.  **Instruction Sheets (6 copies each of A, B, C):** Distinct tasks for the three groups.
  3.  **Whiteboard Markers (3 colours):** For the final ranking reveal.
  4.  **Calculators (6+):** Or allow phones strictly for calculation (no internet).
  5.  **Sticky Notes:** For the "Boundary Decisions" log.

  **The Data: Region of Ostral (Fictional)**
  *   **Population Table:**
      *   Period 1: 10,000
      *   Period 2: 20,000
      *   Period 3: 40,000
      *   Period 4: 80,000
      *   Period 5: 160,000
      *   Period 6: 320,000
  *   **Incident Structure:**
      *   *Clear Violence (45 incidents):* "Stabbing in market," "Battle casualty," "Arson death." Distributed so raw count rises: P1(5), P2(6), P3(8), P4(10), P5(12), P6(15).
      *   *Boundary Cases (12 incidents):* Marked with `*`. Distributed across periods.
      *   *Reporting Notes:* P1-P2 incidents cite "Royal Chronicle Vol X." P5-P6 incidents cite "Civil Registry ID #."

  **Minute-by-Minute Timeline (80 Minutes)**

  *   **00-05: Distribution & Silence.** Hand out packs. No lecture. Tell them: "You are researchers analyzing the Ostral Chronicle. Follow your sheet exactly. Do not talk to other groups yet."
  *   **05-20: The Boundary Phase.** All groups review the Ledger. They must decide as a team which `*` incidents count as a "Violent Death." They must record their exclusions on a Sticky Note.
  *   **20-45: The Aggregation Phase.**
      *   Group A calculates totals and ranks Periods 1-6 by "Volume."
      *   Group B calculates risk and ranks Periods 1-6 by "Danger."
      *   Group C analyzes the "Source" column in the ledger and ranks Periods 1-6 by "Reliability of Record."
  *   **45-55: The Reveal.** One representative from each group writes their Ranking (1=Most, 6=Least) on the whiteboard.
      *   *Expected Outcome:* Group A says P6 is worst. Group B says P1 is worst. Group C says P1 is least reliable.
  *   **55-80: The Debrief.** Guided discussion mapping the conflict to the learning objectives.

  ***

  ### Handout Materials

  #### 1. The Ostral Ledger (Excerpt for Construction)
  *(Instructor Note: Print this as a 4-page table. Below is the logic for your construction.)*

  **Population Table**
  | Period | Est. Population | Source of Pop. Data |
  | :--- | :--- | :--- |
  | 1 | 10,000 | Tax Rolls (Fragmentary) |
  | 2 | 20,000 | Tax Rolls (Fragmentary) |
  | 3 | 40,000 | Census |
  | 4 | 80,000 | Census |
  | 5 | 160,000 | Civil Registry |
  | 6 | 320,000 | Civil Registry |

  **Incident Ledger (Sample of Logic)**
  *   **Period 1 (5 Clear, 2 Ambiguous):**
      *   "Clash at Northern Border, 3 dead." (Source: Royal Chronicle)
      *   "Execution of Rebel Leader." *
      *   "Famine deaths in Valley." *
  *   **...[Intermediate Periods]...**
  *   **Period 6 (15 Clear, 2 Ambiguous):**
      *   "Domestic Assault, Victim ID 492." (Source: Civil Registry)
      *   "Death in Police Custody." *
      *   "Duel, honour dispute." *

  *(Ensure the total clear count rises 5→15. Ensure the ambiguous cases are spread out.)*

  #### 2. Instruction Sheet A (The Scribes)
  **Task:** Rank the six periods from **1 (Most Violence)** to **6 (Least Violence)**.
  **Definition:** "Violence" includes any incident your group marked as a Violent Death in the Boundary Phase.
  **Method:** Sum the total number of violent deaths in each period.
  **Constraint:** Do not use the words *rate, per capita, proportion,* or *percentage*.
  **Question:** In which period was the *amount* of violence greatest?

  #### 3. Instruction Sheet B (The Citizens)
  **Task:** Rank the six periods from **1 (Most Dangerous)** to **6 (Least Dangerous)**.
  **Definition:** "Dangerous" means the likelihood of a random person suffering a violent death.
  **Method:** Use the Population Table and your Count of violent deaths.
  **Constraint:** Do not use the words *absolute, total, count,* or *sum*.
  **Question:** In which period was it worst to be alive?

  #### 4. Instruction Sheet C (The Archivists)
  **Task:** Rank the six periods from **1 (Least Reliable)** to **6 (Most Reliable)**.
  **Method:** Examine the "Source" column in the Ledger. Look for changes in how incidents were recorded (e.g., "Royal Chronicle" vs. "Civil Registry").
  **Question:** In which period can we trust the numbers the most?

  ***

  ### The Debrief Script (Mapping to Objectives)

  **Phase 1: The Aggregation Shock (Objective i)**
  *   *Action:* Point to the Whiteboard. Group A has P6 as #1 (Most Violence). Group B has P1 as #1 (Most Dangerous).
  *   *Ask:* "You used the same ledger. How did you arrive at opposite truths?"
  *   *Concept:* Elicit the distinction between **Frequency (Count)** and **Probability (Rate)**.
  *   *Philosophical Point:* This is not a calculation error. It is an **aggregation choice**. A trend in absolute numbers can reverse when normalized by population. The "truth" of the trend depends on the denominator you choose.

  **Phase 2: The Boundary Struggle (Objective ii)**
  *   *Action:* Ask groups to read their Sticky Notes (excluded `*` incidents).
  *   *Ask:* "Did Group A and Group B include the 'Famine Death' in Period 2? Did Group C trust the 'Royal Chronicle'?"
  *   *Concept:* **Operationalization.**
  *   *Philosophical Point:* Deciding what counts as "violence" is not clerical; it is ontological. If you exclude state executions, the state looks less violent. If you include famine caused by requisitioning, the state looks more violent. The measure *constructs* the phenomenon.

  **Phase 3: The Fact of the Matter (Objective iii)**
  *   *Action:* Ask: "So, was Period 1 more violent than Period 6?"
  *   *Concept:* **Indeterminacy vs. Relativity.**
  *   *Philosophical Point:* Distinguish three positions:
      1.  *Epistemic:* "There is a fact, but our records (Source reliability) hide it." (Group C's point).
      2.  *Ontological:* "There is no fact until we define 'violence'." (The Boundary point).
      3.  *Interest-Relative:* "The answer depends on what you want to know." (Do you want to know total bodies? Or individual safety?).
  *   *Conclusion:* The question "Was it more violent?" is incomplete. It must be "More violent *by which measure*?"

  ***

  ### Troubleshooting: Predictable Failures

  **Failure 1: The Math Bottleneck**
  *   *Problem:* Students struggle to divide deaths by population manually, wasting 15 minutes.
  *   *Fix:* Instruct them to calculate "Deaths per 10,000 people" to keep numbers whole. Provide 6 calculators per group. If they stall at minute 35, intervene: "You don't need perfect precision, you need the order."

  **Failure 2: The Boundary Consensus**
  *   *Problem:* A group cannot agree on whether a "Duel" counts. They spend 20 minutes debating honour culture.
  *   *Fix:* The "2-Minute Rule." Tell them at the start: "If you cannot agree on an asterisked item in 2 minutes, it is excluded by default." This forces the *pain* of exclusion without derailing the timeline.

  **Failure 3: The "Gotcha" Reaction**
  *   *Problem:* Students feel tricked ("You made the population grow on purpose!").
  *   *Fix:* Acknowledge it openly in the debrief. "Real data always has denominators. Ignoring population is the trick, not including it."

  **Failure 4: Group C Dominance**
  *   *Problem:* Groups A and B wait for Group C to tell them what counts.
  *   *Fix:* Emphasize in the intro: "All groups must make their own boundary decisions. Do not wait for the Archivists."

  ***

  ### Limitations & Instructor Notes

  **What this activity cannot do:**
  1.  **Settle the Ontology:** The activity demonstrates that *measurements* vary. It does not prove there is *no fact of the matter* about violence. A realist could argue, "Violence is X, and you just measured it poorly." You must supply the philosophical argument in the debrief that "violence" is a social kind, not a natural kind like "water."
  2.  **Resolve the Bias:** Group C will notice the reporting bias (Royal Chronicle vs. Civil Registry), but they cannot fix it. You must explain that historical data is often *structurally* biased, not just randomly noisy.
  3.  **The "Third Group" Constraint:** I have assigned all groups the coding task (modified from Constraint 3) to ensure everyone feels the boundary friction. If you strictly use a Third Group for coding, you risk Groups A and B treating the data as "given" rather than "constructed." I recommend the all-code approach for a seminar on *methods*.

  **Instructor Supply (The Debrief Heavy Lifting):**
  You must explicitly name the **Simpson's Paradox** dynamic (aggregation reversal) and the **Theory-Ladenness of Observation** (boundary coding). The students will feel the confusion; you must provide the vocabulary to stabilize it. Be careful not to slide into "nothing is true." Instead, argue: "Truth about social phenomena is relative to the conceptual scheme used to measure them."

  **Final Check on Constraints:**
  *   Fictional Chronicle? Yes (Ostral).
  *   Pop up, Count up, Rate down? Yes (10k→320k, 5→15 deaths).
  *   Two Rule Sheets (No forbidden words)? Yes.
  *   Boundary Cases (8-12)? Yes (12 asterisks).
  *   Reporting Quality? Yes (Source column).
  *   Debrief distinctions? Yes (Epistemic/Ontological/Interest).

  This design fits the 80-minute window, forces the conflict without lecture, and leaves the philosophical resolution for the collective debrief.
