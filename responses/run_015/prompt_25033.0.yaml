answer: |-
  You have identified one of the central fault lines in modern normative ethics. The structure you are describing is widely recognized, rigorously analyzed, and has a specific name in the literature.

  The most precise label for the phenomenon is **The Paradox of Deontology**.

  It is most famously associated with the philosopher **Samuel Scheffler**, who coined the term in his 1982 book *The Rejection of Consequentialism*. However, the underlying mechanism is usually discussed under the header of **Agent-Centered Constraints** (or Agent-Relative Restrictions).

  Here is how philosophy has "carved this at the joints," why the tension exists, and why the rule-followers don't experience it as a contradiction.

  ### 1. The Core Distinction: Agent-Neutral vs. Agent-Relative
  To understand why this isn't viewed as a logical error by deontologists, you have to look at the "data types" they are using. The paradox arises only if you assume all moral reasons are **Agent-Neutral**.

  *   **Agent-Neutral Reasons:** "Torture is bad." If torture is bad, then *any* instance of torture is a negative value in the universe. Therefore, a rational agent should act to minimize the total count of torture instances, regardless of who performs them. This is the Consequentialist view.
  *   **Agent-Relative Reasons:** "*I* must not torture." The moral force attaches specifically to *my* agency. The prohibition is not "Minimize torture in the world"; it is "Keep your own hands clean."

  From an Agent-Neutral perspective (the Consequentialist critique), the deontologist's position is irrational. It looks like "Rule Worship" (a term coined by J.J.C. Smart). It seems to prioritize the statistical purity of the agent's soul over the actual suffering in the world.

  However, from the Agent-Relative perspective (the Deontological defense), the Consequentialist is making a category error. They are treating moral constraints as **goals to be achieved** rather than **boundaries to be respected**.

  ### 2. Why the "Decoupling" Doesn't Feel Like a Tension
  You noted that the rule seems decoupled from its purpose (preventing X), yet proponents don't feel the tension. This is because, for many deontologists, the purpose of the rule *is not* to minimize X in the aggregate.

  There are three main philosophical defenses for why they accept the "Paradox":

  **A. The Integrity Objection (Bernard Williams)**
  Williams argued that Consequentialism demands that we abandon our personal integrity to become a neutral channel for utility. If I kill one to save five, I have turned myself into a instrument of the greater good. Williams argues that morality must respect the **integrity of the agent**. I am responsible for *my* actions, not for the actions of terrorists or murderers. To hold me responsible for the terrorists' actions is to violate the boundary of my own agency.

  **B. Rights as Side-Constraints (Robert Nozick)**
  Nozick argued that rights are not goals. You cannot "minimize rights violations" by violating a right.
  *   *Analogy:* Think of a speed limit. The goal isn't to minimize the total number of speed limit violations across the city. The rule is a constraint on *your* driving. If you speed to catch a speeder, you have still violated the constraint. The constraint exists to protect the status of the individual, not to optimize traffic flow.

  **C. The Doctrine of Doing and Allowing**
  This distinction (heavily analyzed by **Frances Kamm**) posits a moral asymmetry between *doing* harm and *allowing* harm.
  *   If I torture, I am the author of that harm.
  *   If I refuse to torture and the terrorists torture, they are the authors of that harm.
  *   Deontologists argue that **causal responsibility** does not equal **moral responsibility**. I am not morally responsible for the free choices of other moral agents (the terrorists), even if I could have influenced them.

  ### 3. Nearby Concepts and Distinctions
  You mentioned **Threshold Deontology**. This is a crucial distinction.

  *   **Absolutist Deontology:** The position you described. "Never torture, even if the world explodes." This accepts the Paradox of Deontology fully.
  *   **Threshold Deontology:** "Never torture, *unless* the consequences become catastrophic." This attempts to avoid the paradox by admitting that agent-relative constraints have a breaking point. Most modern deontologists are actually threshold deontologists, because the absolutist position is often viewed as untenable in extreme cases (e.g., nuclear terrorism).
  *   **Rule Utilitarianism:** This looks similar on the surface ("Follow the rule against lying") but the *justification* is different. A Rule Utilitarian follows the rule because, *in the long run*, following it produces better outcomes. An Absolutist Deontologist follows the rule because the act is intrinsically wrong, regardless of outcomes.

  ### 4. Is There a Consensus?
  There is no consensus on a resolution, because this is the fundamental divide between the two major camps of normative ethics.

  *   **Consequentialists** say the Paradox of Deontology proves deontology is irrational. If your moral theory leads to more of the thing you claim to hate, your theory is broken.
  *   **Deontologists** say the Paradox of Deontology proves consequentialism is inhuman. If your moral theory requires me to violate my deepest moral commitments to optimize a spreadsheet, your theory is demanding too much.

  However, there is a growing consensus in meta-ethics that the "Paradox" is only a paradox if you assume **Consequentialism is the default**. If you start from the premise that individuals have inviolable rights, the "paradox" disappears. It becomes a feature, not a bug.

  ### 5. A Software Engineering Analogy
  Since you are a software engineer, consider this analogy:

  Imagine a microservices architecture.
  *   **Service A (The Agent)** has a strict contract: "Never write directly to Database X."
  *   **Scenario:** Service B and Service C are malfunctioning and are about to corrupt Database X. The only way to stop them is for Service A to bypass its own security protocol and write a lock directly to Database X.
  *   **Consequentialist View:** Service A should break the contract. The goal is "Database Integrity." Breaking the contract once saves the database from being corrupted ten times.
  *   **Deontological View:** Service A must not break the contract. The contract defines the *identity* and *boundaries* of Service A. If Service A starts writing directly to the DB, it has become a different kind of service. The corruption caused by B and C is a failure of B and C, not A. A's responsibility is to maintain its own interface guarantees, not to police the entire system's global state.

  In this view, the "rule" isn't an optimization heuristic; it's an **interface contract**. Violating the contract compromises the architectural integrity of the agent, regardless of the global system state.

  ### Summary for Your Searches
  If you want to read more on this specific structure, these are the terms you should use:
  1.  **The Paradox of Deontology** (Scheffler)
  2.  **Agent-Centered Constraints / Restrictions**
  3.  **Agent-Relative vs. Agent-Neutral Reasons** (Thomas Nagel, *The View From Nowhere*)
  4.  **The Integrity Objection** (Bernard Williams, *A Critique of Utilitarianism*)

  You have correctly identified that the rule appears "self-justifying." In philosophy, this is often acknowledged: deontological constraints are not derived from the good they produce; they are derived from the nature of rational agency itself. The "tension" you feel is the friction between viewing morality as **System Optimization** (Consequentialism) versus **Module Integrity** (Deontology).
