  ### Separation Limitations

  **Flagged Indistinguishability:**
  This tree cannot separate **Functionalists** from **Phenomenological Realists** if both agree on the functional outputs.
  *   **Leaf Pair:** Any leaf where Q1=Yes (e.g., *The Autonomous Agent*).
  *   **Reason:** Question 1 asks if beliefs are "causally efficacious" rather than "interpreted." A Functionalists says "Yes, the state causes the output." A Phenomenological Realist might say "Yes, but it also *feels* like something." Both answer **Yes** to Q1 based on the provided wording, so the tree lumps "Philosophical Zombie Agent" and "Conscious Agent" into the same leaf.

  **Flagged Redundancy:**
  Question 3 (Counterfactual Robustness) and Question 1 (Causal Beliefs) are highly correlated for high-performance systems.
  *   **Leaf Pair:** *The Stateless Tool* (Q1=N, Q3=Y) vs. *The Coherent Simulator* (Q1=N, Q3=Y).
  *   **Reason:** If a system is robust to semantic changes (Q3=Yes) but lacks causal beliefs (Q1=No), it functionally mimics belief so perfectly that the distinction relies on internal architecture rather than observable behavior. The tree separates them logically, but an engineer observing only I/O may not be able to classify them distinctively.

  **Flagged Verification Gap:**
  Question 4 (Introspective Access) and Question 1 (Causal Beliefs) create a verification blind spot.
  *   **Leaf Pair:** *The Boxed Oracle* (Q1=Y, Q4=Y) vs. *The Boxed Oracle* (Q1=Y, Q4=N).
  *   **Reason:** A system might have causal beliefs (Q1=Yes) but be unable to report them (Q4=No). Conversely, a system might report internal states (Q4=Yes) that do not actually drive the output (Q1=No). The tree treats these as distinct leaves, but without invasive probing, an external engineer cannot distinguish a "Silent Believer" from a "Chattering Tool."
