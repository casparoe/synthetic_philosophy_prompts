  Ambiguity arises in (4): it is unclear how EU remains robust if the additivity assumption is false, specifically regarding infinite wager sequences. In (6), "stable oscillation" lacks a decision rule: does the agent act on the mean, the current phase, or abstain? Without this, the link to action is broken.

