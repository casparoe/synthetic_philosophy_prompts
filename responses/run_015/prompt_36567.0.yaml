  1. The claim that we aim to test true,
  Is strict in what it says it will do:
  All ravens, everywhere,
  Have black feathers to wear,
  And never show pink, red, or blue.

  2. Nicod's condition seems sound to the mind,
  When a black raven instance we find.
  (Hempel endorsed this take,
  Though some scholars might shake,)
  Leaving skepticism far behind.

  3. Yet logic makes equivalence tight,
  Between statements we hold in our sight.
  "Non-black implies non-raven,"
  Is a truth we are given,
  So contrapositives count as quite right.

  4. So a white shoe, found on the floor,
  Confirms the claim, to be sure.
  By equivalence' rule,
  Logic plays the fool,
  And intuition walks out the door.

  5. So where does the paradox land?
  There's no agreed-upon stand.
  Some say confirmations are small,
  Others deny Nicod's call,
  While discomfort remains close at hand.

  **Note for section:** Step 3 (logical equivalence) is uncontroversial classical logic. Step 2 leans hardest on a contested reading (Nicod's Condition), which Hempel accepted but many modern philosophers reject or qualify. Step 5 accurately reflects that the field remains divided on whether to accept the paradoxical result, deny Nicod's Condition, or appeal to relevance/probability.
