answer: |-
  Two graduate students, Elias and Sarah, are signing a lease for a shared apartment. Elias is a committed psi-ontologist; he believes the wavefunction is a literal physical entity. Sarah is a psi-epistemicist; she believes the wavefunction represents only an observer's knowledge.

  They pause at Clause 14, the "Quantum Habitability Addendum," which states: *"The premises shall remain in a coherent superposition of |Clean⟩ and |Messy⟩ until the Landlord performs a measurement."*

  Elias signs immediately. "This is perfect," he says. "Since $\psi$ is physical, the mess doesn't actually exist until the landlord looks. I'm not liable for a potentiality."

  Sarah hesitates. "That's not what it means. Since $\psi$ is epistemic, the mess *does* exist, we're just ignorant of it. We're liable for the underlying reality, not the description."

  Elias refuses to clean throughout the semester. Sarah scrubs frantically, arguing she is merely updating her priors.

  At the end of the lease, the Landlord inspects the unit. It is, objectively, a disaster.

  Elias folds his arms. "You can't keep our security deposit. According to the ontology you signed, that mess wasn't real until you opened the door. You collapsed the state yourself. That's on you."

  The Landlord nods slowly, pulls out the deposit check, and tears it in half.

  Elias is outraged. "On what grounds?"

  The Landlord replies, "On the same grounds. The refund was contingent on the |Clean⟩ state being realized. Since I haven't measured it as clean, the money is currently in a superposition of 'Yours' and 'Mine'. I've decided to let it decohere into 'Mine'."

  Sarah sighs, turning to Elias. "I told you. You can't treat the wavefunction as real only when it's convenient."
