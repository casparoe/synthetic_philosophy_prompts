prompt: |-
  I teach a fourth-year seminar on rational choice — 17 students, one 75-minute slot. They've all seen expected utility and basic Dutch book stuff, but nothing about what happens when you don't have a number. I want one session where they feel the difference between having a sharp credence you're unsure about and genuinely not having a number, and where the not-having costs them something they can see. Not the known-urn / unknown-urn thing that every google result is about — I want imprecision to cost them points, and then to strand them at the moment they have to act.

  Constraints: no money changing hands (points, a leaderboard, mild shame). Materials: index cards, a projector, an opaque bag of 100 ping-pong balls whose composition gets fixed by a helper outside the room, so that neither I nor they know any more than "somewhere between 20 and 80 of them are red." No lecture up front, and id rather the words imprecise, ambiguity, and Knightian not be said out loud until the debrief.

  What I'd like designed:

  1. A reporting round where students write down, not a number, but a pair of bounds, and get scored by something that penalises both being wrong and being wide — so that "0 to 100" is safe but expensive and "0.5" is cheap but risky. I want the width-versus-accuracy tradeoff to be something they can see and argue about, and I want you to be upfront about how much of the result is being driven by your choice of penalty parameter rather than by anything deep.

  2. A round that separates three things my students definately conflate: (a) "no idea what the chance is," (b) "the chance is probably around a half but I'm not confident about that," (c) "I have a number, I'm just rounding it." These should come apart in observable behaviour — ideally something where the student who has a second-order spread over chances still ends up transacting at some number, while the student with an open interval refuses to take either side of the bet, and the round makes that refusal visible as a refusal and expensive to fake.

  3. A forced-action round: the group as a whole has to commit to one of two options, and which option is better flips depending on which number inside their interval you act on. They should discover for themselves that an interval doesn't tell you which member to use, and then argue about whether it's legitimate to just pick one.

  4. I have a half-memory that with intervals, conditioning on new evidence can leave your interval wider than it was no matter which way the evidence comes out — which sounds like a bug rather than a feature. If that's a real phenomenon, can a short fourth round make it happen in front of them? If it isn't, say so and give me some other way to make intervals look strange.

  Then the debrief: map specific moments in the session onto the distinctions, tell me what will predictably go wrong the first time I run it (my guesses: everyone just writes 0.5 because it's the middle, and at least one student treats the whole thing as a puzzle about what I'm thinking), and be honest about the part of the idea the activity can't deliver — the part where I have to stand up and say something normative myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 4th-year seminar students (17 students, 75 mins).
      *   **Background:** Know Expected Utility (EU), Dutch Books. Don't know imprecise probability/Knightian uncertainty.
      *   **Goal:** One session to distinguish "unsure sharp credence" vs. "genuinely no number" (imprecision). Make imprecision *cost* points/stranding.
      *   **Constraints:** No real money (points/leaderboard/shame). Materials: Index cards, projector, opaque bag (100 balls, 20-80 red, composition fixed by helper, unknown to teacher/students). No lecture up front. Don't use terms "imprecise," "ambiguity," "Knightian" until debrief.
      *   **Specific Deliverables:**
          1.  Reporting round (interval scoring, width vs. accuracy tradeoff).
          2.  Distinction round (separate "no idea" vs. "unsure number" vs. "rounding").
          3.  Forced-action round (interval doesn't dictate action).
          4.  Conditioning round (dilation/strangeness of intervals).
          5.  Debrief (mapping, predicted failures, normative gaps).

  2.  **Deconstruct & Design Each Round:**

      *   **Round 1: Interval Scoring (The "Cost of Vagueness")**
          *   *Challenge:* Need a scoring rule for intervals $[L, U]$ containing the true value $p$.
          *   *Standard approach:* Brier score is for point estimates. For intervals, we need something that penalizes width and missing the truth.
          *   *Idea:* Score = $Accuracy - Penalty \times Width$.
          *   *Truth:* The true proportion $p$ is fixed in the bag (between 0.2 and 0.8). Let's say it's $p^*$.
          *   *Mechanism:* Students submit $[L, U]$. If $p^* \in [L, U]$, they get base points. If not, 0 (or negative). Subtract cost per unit width.
          *   *Refinement:* To make it feel like credence, ask them to estimate the proportion of red balls.
          *   *Scoring Rule:* $S = 10 \cdot \mathbb{I}(p^* \in [L, U]) - 5 \cdot (U - L)$.
          *   *Why:* Encourages tight intervals but punishes missing. "0 to 1" is safe but scores low (10 - 5 = 5). "0.5 to 0.5" is risky (0 width, but likely miss).
          *   *Transparency:* Must admit the penalty parameter (5) drives behavior.

      *   **Round 2: The Betting Market (Separating the Three States)**
          *   *Goal:* Distinguish (a) Ignorance (no number), (b) Second-order uncertainty (distribution over $p$), (c) Precision (sharp $p$).
          *   *Mechanism:* A market or bilateral betting.
          *   *Setup:* Offer a bet on "Next ball drawn is Red".
          *   *Twist:* They must post a *single* price they are willing to buy OR sell at. Or, they must declare a "No Bet" zone.
          *   *Better Idea:* The "Bookie" (Teacher) offers a bet. Students must set a buying price and a selling price.
          *   *Sharp Credence:* Buy/Sell prices converge (e.g., Buy 0.49, Sell 0.51).
          *   *Second-order (Unsure Number):* Buy/Sell spread exists but is narrow (e.g., Buy 0.4, Sell 0.6) because they fear adverse selection or just variance.
          *   *Imprecise (No Number):* Massive spread or refusal.
          *   *Constraint Check:* Need to make refusal visible and costly.
          *   *Revised Mechanism:* "Market Maker" role. Each student must post a Buy Price and a Sell Price for a ticket paying $1 if Red.
          *   *The Cost:* The Teacher (or a random draw) acts as the counterparty. If the student's Buy Price > True Value, they lose points. If Sell Price < True Value, they lose points.
          *   *The "Stranding":* If they have a sharp number, they trade. If they have an interval (imprecise), they should theoretically have a gap where they won't trade.
          *   *Wait, the prompt asks for "refusal visible as a refusal and expensive to fake."*
          *   *Idea:* You must commit to a threshold. If the realized probability (or a random draw) falls in your "No Bet" zone, you get 0 points. If it falls outside, you trade.
          *   *Actually, let's use the Bag.* Draw one ball. Bet on Red.
          *   *Task:* Write down a Minimum Selling Price and a Maximum Buying Price.
          *   *Scoring:* A random number $X \sim Uniform[0,1]$ is generated. If $X < MinSell$, you Sell at $X$. If $X > MaxBuy$, you Buy at $X$. If in between, No Trade.
          *   *Payoff:* If you Sell, you get $X$, pay $1$ if Red. If you Buy, you pay $X$, get $1$ if Red.
          *   *Imprecision:* Wide gap between Buy/Sell.
          *   *Unsure Sharp:* Narrow gap.
          *   *Cost:* If the gap is too wide, you miss profitable trades (opportunity cost).
          *   *Wait, simpler:* Just ask for a single price they are willing to *take either side* at. If they refuse, they write "PASS".
          *   *Scoring:* If PASS, 0 points. If Price $q$, and Ball is Red, score $1-q$. If Black, score $-q$. (Proper scoring rule equivalent).
          *   *Problem:* This forces a number.
          *   *Solution for Round 2:* **The Spread Task.** Students write a Buy Price ($b$) and Sell Price ($s$) with $b \le s$.
          *   *Resolution:* A random price $r \in [0,1]$ is drawn.
              *   If $r < b$: Student Buys at $r$.
              *   If $r > s$: Student Sells at $r$.
              *   If $b < r < s$: No Trade.
          *   *Payoff:* Standard betting payoff.
          *   *The Trap:* If you are truly imprecise (Ellsberg style), you want a wide gap. But a wide gap means you trade less often. If the "True Probability" is actually stable (it is, it's the bag composition), having a wide gap costs you expected value compared to someone who commits to a number.
          *   *Wait, the prompt wants imprecision to cost them.* In a single draw from a *fixed* bag, imprecision *should* cost them if the true chance is well-defined (which it is, physically). The epistemic state is the variable.
          *   *Refinement:* The "cost" comes from the scoring rule incentivizing tight spreads.
          *   *Let's stick to the Prompt's specific distinction:* (a) No idea, (b) Unsure number, (c) Rounding.
          *   *Design:* Students submit a "Trading Interval" $[b, s]$.
          *   *Outcome:* A random counterparty offer $K$ is drawn.
          *   *If $K < b$:* You Buy.
          *   *If $K > s$:* You Sell.
          *   *If $b < K < s$:* You sit out (0 points).
          *   *The Catch:* The "True Value" of the bet is $p^*$ (the actual proportion).
          *   *If you sit out often (wide interval), you earn 0 often.*
          *   *If you commit (narrow interval), you earn positive EV often (assuming you aren't wildly wrong).*
          *   *This penalizes the "No Number" student who refuses to trade.*

      *   **Round 3: Forced Action (The Interval Doesn't Decide)**
          *   *Goal:* Interval doesn't tell you which member to use.
          *   *Scenario:* Two actions, A and B.
          *   *Payoffs:*
              *   Action A: Win if Red.
              *   Action B: Win if Black (or fixed prize).
              *   Let's make it: Action A pays $\$10$ if Red, $\$0$ if Black. Action B pays $\$X$ for sure.
              *   Wait, need the interval to straddle the indifference point.
              *   Let $p \in [0.2, 0.8]$.
              *   Option 1: Win if Red.
              *   Option 2: Win if Black.
              *   If $p > 0.5$, Opt 1 is better. If $p < 0.5$, Opt 2 is better.
              *   Since interval is $[0.2, 0.8]$, it contains 0.5.
              *   *Task:* Class must vote on ONE option for everyone.
              *   *Conflict:* Maximin says pick the one with best worst-case. (Both have worst case 0.2 win rate). Maximax says best case.
              *   *Better:* Option 1: Win if Red. Option 2: Win if Not-Red.
              *   *Wait, that's symmetric.*
              *   *Let's try:* Option 1: Win if Red. Option 2: Win if Red OR (Coin Flip Heads).
              *   *Simpler:* Option 1: Payoff depends on Red ($100 \times p$). Option 2: Payoff depends on Black ($100 \times (1-p)$).
              *   *Since $p \in [0.2, 0.8]$, Expected Payoff 1 $\in [20, 80]$. Expected Payoff 2 $\in [20, 80]$.*
              *   *They overlap.*
              *   *Task:* You must choose. You cannot say "it depends."
              *   *Observation:* Students with intervals will argue. Some will pick mid-point (0.5). Some will pick worst-case (0.2 -> choose Black). Some will pick best-case.
              *   *Point:* The interval *underdetermines* the choice. You need a decision rule (Maximin, Minimax Regret, etc.) which wasn't in the math, it's normative.

      *   **Round 4: Dilation (Conditioning makes it worse)**
          *   *Phenomenon:* Dilation. Conditioning on evidence can widen the interval.
          *   *Setup:* Need a second variable correlated with the bag.
          *   *Standard Dilation Example:* Two urns. Or a partition of the space.
          *   *Simpler for Class:* The "Paradox of Dilation" usually requires a specific dependency structure.
          *   *Can we do it with one bag?*
          *   *Idea:* Split the balls into "Striped" and "Solid".
          *   *Setup:* 100 balls. Red/Black. Also Striped/Solid.
          *   *Constraint:* We know $P(Red) \in [0.2, 0.8]$.
          *   *New Info:* We draw a ball, feel it (without looking), and are told "It is Striped".
          *   *Dependency:* Suppose Red balls are mostly Striped, Black balls are mostly Solid (or unknown mix).
          *   *If the correlation is unknown,* learning "Striped" might make the Red probability *more* uncertain.
          *   *Implementation:*
              *   Pre-round: Tell them $P(Red) \in [0.2, 0.8]$.
              *   Tell them: "I have a machine that sorts balls into Bucket A and Bucket B. I don't know the sorting rule, except that every Red ball is in A or B, and every Black ball is in A or B."
              *   *Actually, let's use the standard Dilation example:*
              *   Event $E$: Ball is Red. $P(E) \in [0.2, 0.8]$.
              *   Partition $\{H, T\}$ (Coin flip? No, needs to be correlated).
              *   *Let's use the Bag's physical properties.*
              *   Tell them: "The balls are either Heavy or Light."
              *   "All Red balls are Heavy." (Deterministic link).
              *   "Black balls can be Heavy or Light."
              *   "We draw a ball. It is Heavy."
              *   *Prior:* $P(Red) \in [0.2, 0.8]$.
              *   *Evidence:* Heavy.
              *   *Posterior:* Since all Reds are Heavy, and some Blacks are Heavy, the proportion of Reds among Heavies could be *anything* from 0 to 1 depending on how many Blacks are Heavy.
              *   *Wait, if all Reds are Heavy, then $P(Red|Heavy) = \frac{Red}{Red + Black_{Heavy}}$.*
              *   If $Black_{Heavy}$ is unknown (could be 0 to all Blacks), then $P(Red|Heavy)$ ranges from $\frac{R}{R+0} = 1$ to $\frac{R}{R+B} = P(Red)$.
              *   So the interval becomes $[0.2, 1]$. It widened (upper bound went up).
              *   *Does it widen downwards?*
              *   Let's try: "All Black balls are Heavy."
              *   Evidence: Heavy.
              *   $P(Red|Heavy) = \frac{Red_{Heavy}}{Red_{Heavy} + Black}$.
              *   Interval widens to $[0, 0.8]$.
              *   *To get full dilation (widens on both sides):* Need a specific setup (e.g., Herrmann et al.).
              *   *Simpler for 4th years:* Just show that updating can increase uncertainty.
              *   *Scenario:* "I will draw a ball. Before I show you, I will tell you if it's 'Type A' or 'Type B'."
              *   "Regardless of whether I say A or B, your interval for Red will be wider than it is now."
              *   *Setup:* 100 balls. Red/Black.
              *   Mark 50 balls "A", 50 balls "B".
              *   Constraint: Among Reds, 50% are A, 50% are B. Among Blacks, 50% are A, 50% are B. (This keeps it same).
              *   *Dilation Setup:* We don't know the mix.
              *   Tell them: "The balls are marked A or B. I know the marks. You don't."
              *   "I guarantee that $P(Red) \in [0.2, 0.8]$."
