              *   *Decision:* I will propose a simplified Dilation setup using the "Heavy/Light" marker on the balls, pre-sorted by the helper.
              *   *Helper Instructions:* Mark balls such that knowing the mark increases uncertainty about color.
              *   *E.g.,* All Red balls are marked 'X'. Black balls are marked 'X' or 'Y' randomly.
