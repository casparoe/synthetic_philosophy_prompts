                  *   This doesn't dilate.
                  *   *Dilation requires dependence.*
                  *   *Okay, I will advise the user that Round 4 is high-risk physically and offer a "Thought Experiment" backup if the bag setup is too complex for a helper.*
                  *   *Actually, I can design the helper instructions to ensure dilation.*
                  *   *Setup:* 100 balls.
