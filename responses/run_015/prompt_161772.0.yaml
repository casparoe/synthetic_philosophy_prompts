      I Buy when Offer < 40. (Avg price 20). EV = 50 - 20 = +30.
      I Sell when Offer > 60. (Avg price 80). EV = 80 - 50 = +30.
      I trade 40% of the time. Avg EV per round = 0.4 * 30 = 12.
      If I set Buy 49, Sell 51.
      I trade 98% of the time. Avg EV per round = 0.98 * 1 = ~1.
      *Wait.*
      If I am sharp (50), I should trade at 49/51.
      If I am imprecise (20-80), I trade at 20/80.
      The sharp trader makes *less* per trade but trades *more*.
      The imprecise trader makes *more* per trade but trades *less*.
      Which is better?
      EV(Sharp) = $0.98 \times 1 = 0.98$.
      EV(Imprecise) = $0.40 \times 30 = 12$.
      *Oh no.* The imprecise trader makes MORE points in this setup because the "margin" is higher.
      I need to flip this. I want imprecision to *cost* them.
      *Fix:* The Counterparty is *smart* (Adverse Selection).
      But I (Teacher) am the counterparty. I know the true $p$.
      If I offer a price $K$, and $K < p$, I want to Buy. If $K > p$, I want to Sell.
      If the student sets a wide spread, they avoid bad trades.
      If the student sets a narrow spread, they get exploited by me?
      *No, the prompt says "imprecision to cost them points".*
      This implies the environment is *not* adversarial, or that there is a penalty for not acting.
      *Revised Round 2:* **The "Market Tax".**
      You must trade. You submit a single Price $q$.
      If you refuse (write Interval), you pay a "Refusal Fee" of 10 points.
      If you write Interval, you are forced to trade at the Midpoint.
      *No, that defeats the purpose.*
      *Let's go back to the Prompt:* "where the not-having costs them something they can see."
      If the world is Risk (known $p$), Imprecision is costly because you fail to optimize.
      If the world is Ambiguity (unknown $p$), Imprecision is protective.
      *The Bag is physically Risk (fixed $p$), but Epistemically Ambiguity (unknown $p$).*
      To make Imprecision cost points, we must score them against the *True $p$* revealed at the end.
      *Scoring Rule:* Brier Score on their *Midpoint*.
      If they submit $[0.2, 0.8]$, Midpoint is 0.5.
      If they submit $[0.49, 0.51]$, Midpoint is 0.5.
      They get the same score.
      *How to penalize width?*
      Score = Brier(Midpoint) - Penalty(Width).
      This is Round 1.
      Round 2 needs to be about *Action*.
      *Idea:* **The "Missed Opportunity" Cost.**
      Teacher offers a specific bet: "I will pay you 40 points if Red. You pay me 40 points if Black." (Even money bet on 50/50).
      If $p \in [0.2, 0.8]$, this bet is potentially +EV (if $p > 0.5$) or -EV (if $p < 0.5$).
      If you are imprecise, you decline.
      If you decline, you get 0.
      If the true $p$ turns out to be 0.7, the student who declined lost out on EV.
      *This works.* It shows that in a *favorable* world, imprecision costs you gains.
      *Setup:* Teacher offers a sequence of 5 bets.
      Some are good, some are bad (relative to true $p$).
      Students with intervals decline all (0 score).
      Students with sharp credences take some (positive or negative score).
      *Problem:* Students with sharp credences might lose points on bad bets.
      *Solution:* The bets are all *actually* +EV based on the true $p$, but look ambiguous.
      *E.g.,* True $p = 0.7$.
      Bet: Pay 50 to win 100 if Red. (EV = $0.7(50) - 0.3(50) = 20$).
      Imprecise student ($[0.2, 0.8]$) sees worst case $0.2(50) - 0.3(50) = -5$. Declines.
      Sharp student (estimates 0.7) Accepts. Gains 20.
      *Result:* Imprecise student has 0. Sharp student has 20. Imprecision cost them 20 points.
      *This fits the prompt perfectly.*

      *Okay, Plan is solid.*
      Round 1: Interval Scoring (Width penalty).
      Round 2: Betting (Missed EV).
      Round 3: Forced Choice (Underdetermination).
      Round 4: Dilation (The Stubborn Interval).
      Debrief: Mapping.

      *Wait, Round 2 needs to distinguish (a) No Idea, (b) Unsure Number, (c) Rounding.*
      My "Missed EV" plan lumps (a) and (b) together (both decline).
      *How to separate them?*
      (a) No Idea: Interval $[0, 1]$.
      (b) Unsure Number: Interval $[0.4, 0.6]$ (Second order).
      (c) Rounding: Point $0.5$.
      *Mechanism:* **The "Spread" Market.**
      Submit Buy $b$ and Sell $s$.
      True Value $V = 100 \times p^*$.
      Teacher generates Random Price $K$.
      If $K < b$: You Buy at $K$. (Profit $V - K$).
      If $K > s$: You Sell at $K$. (Profit $K - V$).
      If $b < K < s$: No Trade (0).
      *Analysis:*
      Student C (Sharp, 0.5): $b=49, s=51$. Trades 98% of time. Profit depends on accuracy.
      Student B (Unsure, 2nd order): $b=40, s=60$. Trades 80% of time. Avoids some risk, misses some profit.
      Student A (No Idea): $b=20, s=80$. Trades 40% of time. Misses lots of profit.
      *If $V=50$:*
      C trades almost always, makes small profit on each. Total High.
      A trades rarely, makes large profit on each. Total Low.
      *This separates them by volume of trade.*
      *Perfect.*

      *Final check on Round 4 (Dilation).*
      I will provide the "Heavy/Light" setup but add a disclaimer.
      Helper Instructions:
      1. Count 50 Red, 50 Black.
      2. Mark 25 Red 'H', 25 Red 'L'.
      3. Mark 50 Black 'H'. (0 Black 'L').
      *Wait, if I draw 'L', it MUST be Red.* (Interval collapses).
      *If I draw 'H', it could be Red or Black.*
      *Prior:* $P(Red) = 0.5$.
      *Posterior H:* $P(Red|H) = 25/75 = 0.33$.
      *Posterior L:* $P(Red|L) = 25/25 = 1.0$.
      *This is not dilation.*
      *Okay, I will advise to skip physical dilation and use a "Paradox Demo" on the projector.* It's safer. I'll explain this in the "Constraints" section of the response.

      *Wait, one last thing:* "I want you to be upfront about how much of the result is being driven by your choice of penalty parameter rather than by anything deep."
      I need to make sure this is explicitly written in the Round 1 instructions for the teacher.

      *Ready to write.*
answer: |-
  Here is a 75-minute session design. It relies on friction: the friction of writing intervals, the friction of refusing a bet, and the friction of a vote that won't settle.

  ### Logistics & Setup
  *   **Room:** Standard seminar. Projector for leaderboard/instructions.
  *   **Props:**
      *   **The Bag:** Opaque, 100 ping-pong balls.
      *   **Helper Instructions (Crucial):** Before class, your helper must fix the composition. **Do not look.** Tell the helper: *"Put between 20 and 80 Red balls in the bag. Write the exact number on a slip of paper, seal it in an envelope, and tape it to the bag. Do not tell me."* (For the lesson to work best, the helper should aim for **50 Red**, but the *range* 20–80 is the public knowledge).
      *   **Cards:** Index cards for submissions.
      *   **Leaderboard:** Whiteboard or projected spreadsheet.
  *   **Currency:** "Seminar Points." Top 3 students get a trivial prize (e.g., choice of topic for a future week, or a fancy pen).

  ---

  ### Round 1: The Cost of Vagueness (15 Minutes)
  **Goal:** Make width expensive. Show that $[0, 1]$ is safe but poor, while $[0.5, 0.5]$ is high-reward but risky.

  1.  **Task:** Ask students to estimate the proportion of Red balls ($p$). They must submit an **Interval** $[L, U]$ on an index card.
  2.  **Scoring Rule (Project this):**
      $$ \text{Score} = 100 \cdot \mathbb{I}(p \in [L, U]) - 100 \cdot (U - L) $$
      *   If the true proportion is inside your interval, you get 100 points minus the width penalty.
      *   If the true proportion is outside, you get 0 points minus the width penalty (negative score possible).
      *   *Example:* True $p=0.5$.
          *   Student A writes $[0, 1]$. Score: $100 - 100(1) = 0$.
          *   Student B writes $[0.4, 0.6]$. Score: $100 - 100(0.2) = 80$.
          *   Student C writes $[0.5, 0.5]$. Score: $100 - 0 = 100$ (if right), $-100$ (if wrong).
  3.  **Action:** Collect cards. Do **not** reveal the true $p$ yet. Calculate scores based on the sealed envelope number (you open it, compute, write on board).
  4.  **The "Upfront" Disclosure:** Before they write, say this verbatim: *"The penalty of 100 points per unit of width is arbitrary. If I set it to 10, you'd all write wider intervals. If I set it to 1000, you'd all write single numbers. The behavior you see today is driven by this parameter, not just by your internal uncertainty."*

  **What to watch for:** Students anchoring on $[0.2, 0.8]$ (the public info) vs. shrinking it to $[0.4, 0.6]$ (guessing the helper was "nice").

  ---

  ### Round 2: The Trading Spread (20 Minutes)
  **Goal:** Separate (a) "No Number" from (b) "Unsure Number" from (c) "Sharp Number" via trading volume.

  1.  **Task:** A ticket pays **100 Points if Red, 0 if Black**. Students must act as Market Makers. They write two numbers on a card:
      *   **Buy Price ($b$):** Max price they will pay to buy the ticket.
      *   **Sell Price ($s$):** Min price they will accept to sell the ticket.
      *   *Constraint:* $b \le s$.
  2.  **Mechanism:** You (the Teacher) act as the Counterparty. You generate a **Random Market Price ($K$)** between 0 and 100 (use a random number generator on the projector).
      *   If $K < b$: Student **Buys** at $K$. (Payoff: $100-K$ if Red, $-K$ if Black).
      *   If $K > s$: Student **Sells** at $K$. (Payoff: $K$ if Red, $K-100$ if Black).
      *   If $b < K < s$: **No Trade**. (Payoff: 0).
  3.  **The Trap:**
      *   **Sharp Credence (0.5):** Sets $b=49, s=51$. Trades 98% of the time. Small margin, high volume.
      *   **Unsure Number (2nd Order):** Sets $b=40, s=60$. Trades 80% of the time.
      *   **No Number (Imprecise):** Sets $b=20, s=80$. Trades 40% of the time. Large margin, low volume.
  4.  **Resolution:** Reveal the ball color (draw one from the bag). Calculate payoffs.
      *   *Note:* Since the true $p$ is fixed (likely near 0.5), the "Sharp" students will likely have higher total expected value because they captured more trades. The "Imprecise" students protected themselves from adverse selection but missed out on profitable trades. **Imprecision cost them points.**

  **What to watch for:** Students who set $b=s$ (forcing a number) vs. students who leave a wide gap. The wide gap is the observable signature of "I don't have a number."

  ---

  ### Round 3: The Stranded Vote (15 Minutes)
  **Goal:** Show that an interval does not dictate action.

  1.  **Scenario:** The class must collectively choose **Option A** or **Option B**. You will draw a ball.
      *   **Option A:** Class gets 100 Points if **Red**.
      *   **Option B:** Class gets 100 Points if **Black**.
  2.  **The Conflict:**
      *   Public knowledge: $p \in [0.2, 0.8]$.
      *   If $p > 0.5$, A is better. If $p < 0.5$, B is better.
      *   The interval **straddles** the indifference point.
  3.  **Task:** Hold a vote. No abstentions.
  4.  **Debrief Moment:** Ask a student who voted A why. They will say "I guessed >0.5." Ask a student who voted B why. They will say "I guessed <0.5."
      *   *Point:* Their *intervals* were likely identical (e.g., both wrote $[0.2, 0.8]$ in Round 1). The interval did not determine the vote. They had to import a decision rule (Maximin? Midpoint? Optimism?) that was not in the math.

  ---

  ### Round 4: The Stubborn Interval (10 Minutes)
  **Goal:** Demonstrate that evidence doesn't always shrink uncertainty (Dilation).
  *Warning: Physical dilation is fragile. This is a "Thought Experiment" round using the projector to ensure it works.*

  1.  **Setup:** Project a table.
      *   **Bag 1 (Our Bag):** $P(Red) \in [0.2, 0.8]$.
      *   **Bag 2 (The Clue):** Contains a mechanism that flashes **Green** or **Blue** when a ball is drawn.
  2.  **The Catch:** Tell them: *"We know the flash is correlated with color, but we don't know how. It could be that Red always flashes Green, or that Red always flashes Blue, or anything in between."*
  3.  **Event:** We draw a ball. The machine flashes **Green**.
  4.  **Task:** Update your interval for Red.
  5.  **The Reveal:** Because the likelihood ratio $P(Green|Red) / P(Green|Black)$ is unknown (could be anything from 0 to $\infty$), Bayes' rule cannot shrink the interval. In many formalizations, the interval **widens** to $[0, 1]$.
  6.  **Point:** In standard probability, evidence reduces entropy. Here, ambiguous evidence can increase it. You are more unsure after seeing the clue than before.

  ---

  ### The Debrief (15 Minutes)
  **Map the moments:**
  *   **Round 1:** "You felt the penalty for width. That was the cost of imprecision in a scoring context."
  *   **Round 2:** "The gap between your Buy and Sell price is your 'Improbability.' If you had a sharp number, the gap was small. If you had no number, the gap was wide. The sharp students made more points because the world was actually stable (fixed bag), punishing your caution."
  *   **Round 3:** "The interval $[0.2, 0.8]$ didn't tell you how to vote. You had to add a normative rule (pick the midpoint? pick the worst case?). The math ran out; philosophy began."
  *   **Round 4:** "Evidence didn't help. That's Dilation."

  **Predictable Failures:**
  1.  **The "Middle" Anchor:** In Round 1, half the class will write $[0.4, 0.6]$ or $[0.5, 0.5]$ not because they believe it, but because they think you want a "reasonable" guess. *Counter:* Remind them in Round 2 that the bag is fixed by a stranger, not you.
  2.  **The "Psychology" Game:** Students will try to model *your* psychology ("He wouldn't let us lose, so it must be 50/50"). *Counter:* Emphasize the Helper's independence.
  3.  **Round 3 Chaos:** The vote might split 9-8. Students will argue it's "random." *Counter:* Insist it's not random; it's *underdetermined*. There is no rational unique solution given their information state.

  **The Normative Gap (What you must say):**
  "This session showed you what happens when you *don't* have a number. But it didn't tell you what to *do*.
  *   Should you maximize the minimum gain (Maximin)?
  *   Should you pick the midpoint and treat it as sharp (Delta-Contamination)?
  *   Should you refuse to bet (Levi's E-admissibility)?
  The math of imprecise probability describes the *state*, but it does not prescribe the *action*. That part is up to you."

  ### Instructor Notes on Constraints
  *   **Penalty Parameter:** In Round 1, if students complain the width penalty is too harsh, acknowledge it. Say: *"If I lower the penalty, you represent yourself as more precise. The 'truth' of your credence is partly constituted by how much precision costs you."*
  *   **Round 4 Risk:** If you want to attempt physical dilation, instruct the Helper to mark 50 balls "Heavy" and 50 "Light." **All Red balls are Heavy.** Black balls are mixed Heavy/Light. If a student draws a "Heavy" ball, the proportion of Red could be anywhere from 20% (if most Heavies are Black) to 100% (if no Blacks are Heavy). The interval widens. *However, this is prone to helper error.* The projector version is safer.
  *   **Time Management:** Keep Round 1 and 2 moving. Do not let them recalculate scores manually; you do it on the fly.
