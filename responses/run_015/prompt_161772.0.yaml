                  *   Constraint for Dilation: $P(Red|A) \in [0, 1]$ and $P(Red|B) \in [0, 1]$ (roughly).
                  *   This requires the mark to be uncorrelated with color in a specific way.
                  *   *Let's simplify:* I will suggest a "Revealed Mark" round where the interval *fails to shrink* as expected, illustrating that evidence doesn't always reduce uncertainty in imprecise models. I won't promise full mathematical dilation if it risks the prop, but I'll give the instructions that *would* achieve it.

  3.  **Drafting the Plan:**

      *   **Intro:** 5 mins. Rules. Leaderboard.
      *   **Round 1 (Intervals):** 15 mins. Submit $[L, U]$. Scoring rule explained. Reveal true $p$ (count balls).
