      *   *Round 1 Scoring:* $Score = 100 \cdot \mathbb{I}(p \in [L, U]) - 50 \cdot (U - L)$.
          *   If $p=0.5$.
          *   Student A: $[0, 1]$. Score $100 - 50 = 50$.
          *   Student B: $[0.4, 0.6]$. Score $100 - 10 = 90$.
          *   Student C: $[0.49, 0.51]$. Score $100 - 1 = 99$.
          *   Student D: $[0.5, 0.5]$ (misses). Score $0 - 0 = 0$.
