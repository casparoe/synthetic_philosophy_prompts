              *   *Okay, I will be honest in the debrief if the physical setup is too hard.* I'll suggest a thought experiment for Round 4 if the physical prop is too risky, OR provide the specific "Herrmann" style setup.
              *   *Actually, there's a simpler way:* **The "Two Bags" switch.**
              *   No, stick to one bag.
              *   *Let's go with the "Heavy/Light" Dilation.*
              *   Helper prepares bag:
                  *   20 Red (All Heavy).
                  *   20 Black (All Heavy).
                  *   60 Black (All Light).
                  *   Total: 20 Red, 80 Black. (p = 0.2).
                  *   Wait, students don't know p. They know $p \in [0.2, 0.8]$.
                  *   Helper actually sets: 50 Red, 50 Black. (p=0.5).
                  *   Marks:
                      *   25 Red Heavy, 25 Red Light.
