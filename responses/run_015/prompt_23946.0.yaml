      *   *The Paradox:* ZFC proves there are uncountable sets (Cantor's Theorem). By Löwenheim-Skolem, if ZFC has a model, it has a countable model. How can a countable model contain an uncountable set?
      *   *The Resolution:* "Countable" means "there exists a bijection with $\mathbb{N}$". In the countable model $M$, there is a set $R^M$ (the reals of $M$). $M$ satisfies "There is no bijection $f: \mathbb{N} \to R^M$". However, from the outside ($V$), we see that the domain of $M$ is countable, so there *is* a bijection $g: \mathbb{N} \to R^M$, but $g \notin M$.
      *   *Key Concept:* Relativity of set-theoretic notions. "Uncountable" is not absolute; it depends on what functions exist in the model.

