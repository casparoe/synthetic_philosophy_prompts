answer: |-
  You have spotted one of the biggest unresolved tensions in the philosophy of history. You are absolutely right: people toggle between these two modes constantly, and rarely acknowledge the switch.

  There isn't one single word for the *switching* itself, but the two sides of the split have very clear names. The tension is between **Historical Contingency** and **Historical Determinism**.

  Here is the breakdown of the concepts, how people decide which one to use, and why your suspicion about "storytelling" is mostly correct.

  ### 1. The Two Modes
  *   **Historical Contingency (The "Fragile Thread"):** This is the idea that history depends on specific, unpredictable events. If General X didn't get the flu, or if the wind didn't change direction at the Battle of Midway, the outcome changes. This aligns with the **"Great Man Theory"** of history, where individuals drive change.
  *   **Historical Determinism (The "Inevitable Flow"):** This is the idea that broad forces (economics, technology, geography, demographics) push history in a specific direction regardless of individuals. If Watt hadn't invented the steam engine, someone else would have within a decade because the *conditions* were ripe. This aligns with **Historical Materialism** or **Structuralism**.

  ### 2. How People Draw the Line (The "Rules" They Don't Admit)
  You asked how people decide when something is inevitable versus when it is luck. While they rarely state it explicitly, they usually subconsciously apply three filters:

  **A. The Timescale Filter**
  *   **Short Term = Contingent:** Over days or years, human error, weather, and decisions matter. (e.g., "Hitler could have won the Battle of Britain.")
  *   **Long Term = Deterministic:** Over decades or centuries, structural forces wash out individual errors. (e.g., "Eventually, industrialization would happen somewhere.")
  *   *The Inconsistency:* People apply the Short Term rule to battles, but then assume the Long Term outcome of that battle locks in forever. They rarely account for the fact that long-term determinism might correct a short-term contingency. (e.g., Even if Hitler wins in '43, do the economic realities of a Nazi empire eventually cause it to collapse anyway?)

  **B. The Material vs. Human Filter**
  *   **Technology/Science = Deterministic:** We treat knowledge as cumulative. Once physics reaches a certain point, the "adjacent possible" opens up. The steam engine is seen as a discovery waiting to be found.
  *   **Politics/War = Contingent:** We treat human choices as volatile. A general's ego or a politician's speech is seen as a variable that can swing wildly.
  *   *The Inconsistency:* This ignores that technology requires political stability to flourish, and politics is often driven by technological constraints.

  **C. The "Known Outcome" Bias**
  *   If we know the trend *did* happen (Industrial Revolution), we retroactively view it as inevitable.
  *   If we know the event *didn't* happen (Nazi Victory), we view it as fragile.
  *   This is a form of **Hindsight Bias**. Because the Industrial Revolution succeeded globally, it looks like destiny. Because the Nazi regime failed, it looks like it was always doomed. If the Nazis *had* won, alternate historians 80 years later might argue that Fascism was the inevitable evolutionary step of government.

  ### 3. The Narrative Reason (You Were Right)
  You suspected people pick whichever version makes the story more interesting. In media studies and narratology, this is often called **Narrative Convenience** or **Methodological Opportunism**.

  Alternate history videos need two contradictory things to work:
  1.  **Plausibility (Determinism):** The audience needs to believe the change *could* happen. If the video argues "Hitler wins if one soldier trips," it feels silly. So they use deterministic logic to set the stage (e.g., "Germany had the economic capacity to win...").
  2.  **Drama (Contingency):** If everything is determined, there is no tension. If the Industrial Revolution was *guaranteed*, there is no story. So they use contingent logic to create the "Point of Divergence" (e.g., "...but only if this General attacks now.").

  If they stayed consistent, the genre would break:
  *   **Pure Determinism:** "Hitler losing was inevitable due to resource constraints." (Boring video, no "What If".)
  *   **Pure Contingency:** "Anything can happen at any time for no reason." (Chaotic, feels unrealistic.)

  ### 4. Is there a deeper concept for this?
  If you want to sound academic about this specific split, the closest concept is **Structure vs. Agency**.
  *   **Structure:** The environment, economics, and technology that limit or push us (Determinism).
  *   **Agency:** The ability of individuals to act freely and change outcomes (Contingency).

  Historians spend entire careers arguing over which one matters more. The YouTubers you are watching are just toggling between them without admitting it.

  A famous biologist, **Stephen Jay Gould**, addressed this with the idea of **"Replaying the Tape."** He asked: If we wiped out life on Earth and hit play again, would humans evolve?
  *   **Determinists say:** Yes, intelligence is an evolutionary advantage.
  *   **Contingencyists (like Gould) say:** No, it was a billion lucky breaks.

  ### Summary
  The split is **Contingency vs. Determinism**.
  The behavior of switching between them is **Methodological Opportunism**.
  The reason they do it is **Narrative Tension**.

  You are seeing through the trick. Most history isn't purely destiny, nor is it purely luck; it is usually **"Path Dependence."** This is the middle ground: A contingent event happens (luck), but once it happens, it creates a new structure that makes subsequent events deterministic (lock-in). The videos you watch tend to skip the "lock-in" part because it complicates the story.
