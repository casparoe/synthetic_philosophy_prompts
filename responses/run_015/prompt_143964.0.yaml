answer: |-
  First off, trust your instincts. Your brother-in-law (BIL) has given you a very confident, polished summary, but in the world of philosophy, confidence is often inversely proportional to accuracy. He is presenting a specific, somewhat rigid interpretation (largely derived from the work of Jon Elster in the 1970s/80s) as if it were settled fact. It isn't.

  Your objections are not just "bugs"; they point to the two biggest debates in this field. Here is a breakdown of what he got right, where he is overstating it, and where he is simply wrong, followed by a verdict on your "decaying threshold" idea.

  ### 1. The "Other Will" Requirement
  **BIL's Claim:** A Ulysses contract requires handing authority to *someone else* (the crew). A rational agent cannot bind themselves.
  **Verdict:** **False.**

  You are absolutely right about your savings app. In philosophy and behavioral economics, a Ulysses contract (or precommitment strategy) does **not** require a second human agent. It requires a **barrier to reversal.**

  *   **The Mechanism:** When Ulysses ordered his crew to tie him up, he was creating a physical and social barrier. When you use a savings app that charges a penalty, you are creating a *financial* barrier. When Odysseus plugs his crew's ears with wax, he is using a *technological* barrier.
  *   **The Logic:** The core of the concept is solving a "time-inconsistency problem." Your "Now Self" wants to save; your "Future Self" wants to spend. To win, Now Self must raise the cost of spending for Future Self. Whether that cost is enforced by a sailor, a computer algorithm, or a locked safe is irrelevant to the definition.
  *   **Why BIL is wrong:** He is conflating the *myth* with the *concept*. He is also relying on an old philosophical intuition that you can't have an obligation to yourself. Modern theory rejects this; you can bind yourself via mechanisms that make breaking the promise too costly.

  ### 2. The Individual vs. Constitution Analogy
  **BIL's Claim:** The logic is identical at both scales. The "People" is a continuing agent, so binding the future electorate is the same as binding your future self.
  **Verdict:** **Highly Contested (The "Identity Problem").**

  This is the biggest leap in his argument. While the *structure* looks similar (Past binds Future), the *ethics* are different.

  *   **Individual Case:** When you tie yourself up, you are the one suffering the constraint. If you change your mind, you are the one who feels the rope. There is a psychological continuity that makes it plausible to say "it's the same person."
  *   **Constitutional Case:** When Founders bind a future electorate, they are binding **other people.**
      *   **Dissenters:** Even at the time of ratification, not everyone agreed.
      *   **Future Generations:** Your children did not sign the contract. Thomas Jefferson famously argued that "the earth belongs to the living" and that no generation should be bound by the dead hand of the past (suggesting constitutions should expire every 19 years).
      *   **The "Dodge":** When BIL says "the people is a continuing agent," he is using a metaphor as a proof. In political philosophy, this is the problem of **intergenerational sovereignty.** Most philosophers agree that while some entrenchment is useful (to prevent panic), it is *not* identical to individual precommitment because it involves coercion of non-consenting others.

  ### 3. The "Dead Hand" and Rationality
  **BIL's Claim:** If you complain about constitutional entrenchment, you must think Ulysses was irrational.
  **Verdict:** **False Dilemma.**

  You can agree Ulysses was rational *for Ulysses* while believing constitutional entrenchment is illegitimate *for a democracy.*

  *   **Exit Conditions:** Ulysses knew exactly when he would be untied (once the ship was past the Sirens). A constitution often lacks a clear "end of danger" point.
  *   **Knowledge:** Ulysses knew the Sirens would make him irrational. In politics, it is debatable whether a future electorate wanting to repeal a right is "irrational" or just "changing their mind." If the future generation is rational, binding them is not helpful; it's oppression.
  *   **Paternalism:** BIL claims it isn't paternalism because it's the "same people." But because of the dissenters/future gens issue (above), it *is* paternalism. It is the Past telling the Future, "I know better than you what you should want."

  ### 4. "Philosophy Settled This"
  **BIL's Claim:** Philosophy settled this decades ago; it's just an engineering question now.
  **Verdict:** **Rhetorical Bluff.**

  Philosophy never "settles" anything in the way physics might settle gravity. This is an active, heated debate in constitutional theory, ethics, and behavioral economics. Scholars like Jon Elster, Stephen Holmes, Cass Sunstein, and Sotirios Barber have written libraries of books disagreeing on exactly these points. BIL is presenting one side of a debate as the conclusion of the debate.

  ---

  ### The "Decaying Threshold" Question

  This is a fascinating thought experiment. Let's look at it through the lens of the Ulysses myth.

  **The Scenario:** A constitutional provision requires a 90% supermajority to amend, but this threshold decays by 3% per year until it hits a simple majority (50% + 1).

  **Your Intuition:** This is *more* Ulysses-like because Ulysses expected to be untied once the danger passed.
  **BIL's Intuition:** This is *less* Ulysses-like (presumably because it weakens the commitment).

  **Who is right?**
  Philosophically, **you are closer to the mark,** but there is a nuance.

  1.  **The Nature of the Threat:** Ulysses wasn't afraid of his crew forever; he was afraid of his own weakness *during the specific window* of passing the Sirens. Once the song faded, the constraint was no longer needed. A "decaying threshold" acknowledges that the "panic" or "irrationality" the Founders feared might fade over time, or that the Future Self becomes more competent to judge.
  2.  **The "Dead Hand" Problem:** A fixed supermajority (e.g., always 67%) assumes the Founders' wisdom is eternal. A decaying threshold assumes the Founders' wisdom was specific to their time and should yield to the living. This aligns better with the idea that the constraint is a *temporary* safeguard, not a permanent shackle.
  3.  **The Commitment Problem:** BIL's objection would be about **credibility.** If investors (or citizens) know the rule will get easier to change every year, they might not trust the rule *now*. Ulysses had to convince the crew to *ignore* him. If the crew knew, "Oh, he'll tell us to untie him in 10 minutes anyway," they might not tie him as tightly.

  **Verdict:** Your decaying threshold is **more Ulysses-like regarding legitimacy** (it respects the future self's freedom once the danger passes) but **less Ulysses-like regarding commitment strength** (it admits the rope will get weaker).

  However, in the context of the "Dead Hand" argument you are having with your BIL, your intuition is the stronger philosophical position. It solves the problem of the "continuing agent" dodge by admitting that the grip of the past *should* loosen as the distance from the original decision grows. It treats the constitution less like a suicide pact and more like a cast on a broken leg: tight at first, removed once healed.

  ### Summary for Your Friends

  If you want to repeat any of this to your friends, here is the safe summary:

  1.  **The Definition:** Your brother-in-law is wrong that you need another person. Automatic penalties (like your app) count as Ulysses contracts.
  2.  **The Analogy:** Comparing a person to a country is useful, but imperfect. You can bind yourself; binding your grandchildren is ethically different.
  3.  **The Consensus:** Philosophy has not "settled" this. It is a trade-off between **stability** (preventing panic) and **democracy** (letting the living decide).
  4.  **The Verdict:** Your idea of a "decaying threshold" is a serious proposal (similar to "sunset clauses") that many legal scholars think is *more* democratic than permanent entrenchment, even if it makes the commitment slightly weaker.

  Your BIL is arguing for **Constitutional Precommitment Theory** (which values stability), but he is ignoring **Democratic Legitimacy Theory** (which values consent). Both exist; neither has "won." You are right to be skeptical of the "too clean" story. In logistics, you know that a plan that looks perfect on a whiteboard often hits friction in the warehouse. Politics is the same.
