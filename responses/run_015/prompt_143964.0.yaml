      *   *Claim 4: "It isn't even paternalism... same people at different times."*
          *   **Verdict:** Contested.
          *   **Philosophy:** Intrapersonal paternalism is a thing. But in the constitutional case, it *is* interpersonal paternalism because of the dissenters/future gens issue.
          *   **Correction:** BIL ignores the "others" bound by the constitution.

      *   *Claim 5: "Philosophy basically settled this decades ago."*
