      *   *Analysis:* Ulysses' binding was temporary (until past the Sirens). A fixed constitution is permanent (until difficult amendment). A decaying threshold mimics the *temporary* nature of the Ulysses binding better than a fixed high bar. It acknowledges that the "panic" or "irrationality" risk might fade or that the dead hand shouldn't grip forever.
