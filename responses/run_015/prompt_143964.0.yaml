      *   **BIL's Argument:**
          1.  Definition: Ulysses contract requires *another will* (crew) to hold the rope. Rational agent can't bind themselves.
          2.  Analogy: Constitutions are Ulysses contracts (founders = past self, electorate = future self).
          3.  Normative Claim: Complaining about the "dead hand" implies Ulysses was irrational.
          4.  Paternalism Claim: Not paternalistic because it's the "same people at different times."
          5.  Conclusion: Philosophy settled this; precommitment is rationality with shifting preferences. Only engineering questions remain.
      *   **User's Objections:**
