  # Seminar Handout: The Epistemology of Testimony and the LLM Challenge

  ## Stage 1: The Logical Space (Decision Tree)

  **Instructions:** Work through the following branch questions. Each node presents a concrete case; select the answer that best matches your intuition about that case. Your path through the tree will locate your epistemological position.

  **Node 1: The LLM Case (Agency)**
  *Case:* A student asks a Large Language Model a factual question. The model outputs a true statement. There is no human speaker who meant anything by this output, nor anyone taking responsibility for it.
  *   **Question:** Is the student's belief based on *testimony* (which requires a communicating agent) or on *instrumental evidence* (like reading a thermometer)?
      *   (A) It is **Testimony** (requires an agent). → *Go to Node 2.*
      *   (B) It is **Instrumental** (does not require an agent). → *Go to Node 7.*

  **Node 2: The Insincere Speaker (Belief)**
  *Case:* A known liar asserts that $p$. As it happens, $p$ is true, and the liar is reliable on this topic despite their dishonesty.
  *   **Question:** Has the speaker testified? (Can one testify without believing what one says?)
      *   (A) **No**, testimony requires the speaker to believe $p$. → *Go to Node 3.*
      *   (B) **Yes**, assertion is sufficient; belief is not required. → *Go to Node 4.*

  **Node 3: The Assurance Variant (Responsibility)**
  *Case:* The same insincere speaker adds, "I take responsibility for the truth of this."
  *   **Question:** Does this undertaking supply a reason for belief that mere evidence of reliability could not supply?
      *   (A) **Yes**, the assurance is irreducible to evidence. → *Leaf 1.*
      *   (B) **No**, it is just another signal of reliability. → *Leaf 2.*

  **Node 4: The Converging Sources (Positive Reasons)**
  *Case:* Three barely credible sources independently assert $p$. You have no independent evidence that $p$ is true.
  *   **Question:** Do you need positive reasons to think *these specific sources* are reliable on this occasion, or is the absence of defeaters sufficient?
      *   (A) **Positive Reasons** are required. → *Go to Node 5.*
      *   (B) **Absence of Defeaters** is sufficient. → *Go to Node 6.*

  **Node 5: The Stranger on the Train (Scope of Reasons)**
  *Case:* A stranger tells you the train leaves at noon. You have no prior history with them.
  *   **Question:** Is your warrant based on observed regularities of *human nature generally*, or reasons specific to *this speaker*?
      *   (A) **Global** (Human nature/regularities). → *Leaf 3.*
      *   (B) **Local** (This speaker's context). → *Leaf 4.*

  **Node 6: The Challenge Scenario (Default Status)**
  *Case:* A colleague tells you a meeting time. You have no reason to doubt them, but no specific proof they are right.
  *   **Question:** Is your warrant a presumptive *entitlement* (automatic unless undermined), or a *default* that requires you to be ready to meet challenges?
      *   (A) **Entitlement** (Reid/Burge style). → *Leaf 5.*
      *   (B) **Default-and-Challenge** (Foley style). → *Leaf 6.*

  **Node 7: The Thermometer Case (Warrant Source)**
  *Case:* You treat the LLM like a thermometer. It produces a true reading.
  *   **Question:** Is the warrant for your belief *inherited* from a knower, or *generated* by the reliability of the process itself?
      *   (A) **Inherited** (Transmission from a mind). → *Leaf 7.*
      *   (B) **Generated** (Process reliability). → *Go to Node 8.*

  **Node 8: The Black Box (Process Transparency)**
  *Case:* The LLM's weights are opaque; you cannot inspect how it reached the output.
  *   **Question:** Can you have warrant if the process is unintelligible to you, provided it is reliable?
      *   (A) **No**, understanding is required. → *Leaf 8.*
      *   (B) **Yes**, external reliability is sufficient. → *Leaf 9 (Informational View).*

  *(Note: To adhere to the eight-leaf limit, Leaf 8 and Leaf 9 are treated as a single logical outcome for the purpose of this seminar, distinguished only by internalist constraints. We will treat Node 8 as a diagnostic check rather than a full splitter for the final map.)*

  ---

  ## Stage 2: Locating the Positions

  The following table maps the major epistemological positions onto the leaves generated by the tree above.

  | Leaf | Position | Path Coordinates | Diagnostic Note |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Assurance View** (Moran, Hinchman) | 1A → 2A → 3A | Rests heavily on agency. The speaker's responsibility is the warrant. |
  | **2** | **Empty Cell** | 1A → 2A → 3B | **Unattractive.** If belief is required for testimony, denying the normative force of responsibility makes the belief condition otiose. |
  | **3** | **Humean Global Reductionism** | 1A → 2B → 4A → 5A | Agency is causal, not normative. Warrant reduces to induction over human nature. |
  | **4** | **Local Reductionism** (Fricker) | 1A → 2B → 4A → 5B | Agency is monitored. The hearer must positively verify this speaker's reliability. |
  | **5** | **Non-Reductionism** (Reid, Burge) | 1A → 2B → 4B → 6A | Agency grants a presumptive right. Warrant is inherited via a principle of veracity. |
  | **6** | **Default-and-Challenge** (Foley) | 1A → 2B → 4B → 6B | **Flag:** Hard to separate empirically from Leaf 5. Distinct in that rationality requires readiness to defend, not just passive entitlement. |
  | **7** | **Empty Cell** | 1B → 7A | **Incoherent.** One cannot inherit warrant from a source defined as non-agential (no mind to hold the warrant). |
  | **8** | **Informational View** (Goldberg, Pritchard) | 1B → 7B → 8B | Agency is irrelevant. Warrant is generated by environmental safety/reliability (fits the LLM case). |

  ### Seminar Discussion Points

  1.  **The LLM Diagnostic:** Notice how Leaf 8 (Informational View) is the only position that comfortably accommodates the Node 1(B) intuition. If you feel the LLM case *is* testimony, you are forced into Leaves 1–6. If you feel it is *data*, you must explain why human testimony (Leaf 3–6) is different.
  2.  **Agency Dependence:** Leaves 1, 5, and 6 rely on the source's status as an agent (either for assurance or for presumptive entitlement). Leaves 3, 4, and 8 treat the source as a causal mechanism. Which side does your intuition on the Insincere Speaker (Node 2) pull you towards?
  3.  **Indistinguishable Leaves:** Leaves 5 and 6 (Non-Reductionism and Default-and-Challenge) often yield the same verdict in standard cases. Use the LLM case to pry them apart: does a non-agent output generate a *presumptive entitlement* (Leaf 5 logic applied to data) or merely a *challenge-ready default* (Leaf 6)?
  4.  **Empty Cells:** Consider Leaf 2. Why is it unattractive to demand belief from a speaker (Node 2A) but deny that their taking responsibility adds normative weight (Node 3B)? This suggests the Assurance View (Leaf 1) is the only stable home for the "Belief Required" intuition.

