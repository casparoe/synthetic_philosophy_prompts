answer: |-
  Karma is fundamentally a law of causal physics rather than moral psychology, meaning the monk in your relay case bears karmic responsibility for the foreseeable suffering his action triggers, regardless of his internal purity.

  If karma is truly an impersonal natural law like gravity, it cannot privilege the agent's internal state over the actual functioning of cause and effect. In a physical system, if you push a domino knowing it will knock over a vase, the shattered vase is the result of your push, not your feelings about the vase. The standard intention-first reading tries to protect the agent from the chaos of external outcomes, but in doing so, it severs karma from its own definition as causation. If an act plants seeds that grow into suffering, the act is unwholesome, even if the gardener had a nice smile while planting them. To claim otherwise is to treat karma as a divine judgment system where motives excuse outcomes, rather than a natural law where conditions produce results. The universe does not read diaries; it processes conditions.

  Therefore, intention (*cetana*) must be demoted from the sole determinant of karmic weight to a heuristic for causal forecasting. Intention is how a bounded agent aims at good outcomes, but it is not the outcome itself. When intention aligns with reality, it works as a perfect proxy for good karma. But in the relay case, the proxy breaks because the monk's causal modeling is incomplete if it stops at his own psyche. He knows the social context. He knows human vanity. By performing a public gesture that he predicts will trigger status-seeking imitation, he is actively constructing the conditions for others to generate bad karma. He is the primary condition for their corruption. If karma is about the ripening of seeds, he has planted a field of weeds while claiming he only intended flowers. The suffering generated by the copiers is a direct downstream effect of his initial condition-setting. To absolve him is to say that causes are not responsible for their effects, which dismantles the entire doctrine of dependent origination.

  The obvious objection is that this makes moral assessment hostage to unpredictability, paralyzing agents who cannot foresee every ripple. This objection conflates "unpredictable" with "unforeseeable." Buddhist ethics does not demand omniscience, but it does demand wisdom (*panna*). You are not responsible for the butterfly effect you could not possibly model, but you are responsible for the causal chains visible to a mindful observer. The monk's liability arises precisely because the imitation was *predictable*. If the outcome were truly random, the karma would be neutral. But when social dynamics are known, ignoring them is a failure of wisdom, not just bad luck. The intention-only view allows agents to remain willfully blind to consequences while claiming moral superiority, which is itself a form of ignorance (*avijja*).

  This implies a radical shift in how a Buddhist should deliberate. Traditionally, ethics is often reduced to checking one's motivation before acting. Under this causal realist view, ethics requires predictive modeling. It demands that silence is sometimes more virtuous than speech if the speech triggers harmful chains. It means that "skillful means" isn't just about clever teaching, but about causal hygiene. A practitioner cannot simply ask, "Is my heart pure?" They must ask, "What causal networks does this act sustain?" Moral maturity becomes the cultivation of deeper causal vision, recognizing that our actions are nodes in a vast web of conditioned arising. Protecting one's internal purity while externalizing suffering is not enlightenment; it is spiritual narcissism disguised as virtue. The honest move is to accept that if your goodness predictably breeds badness, your act was not good.
