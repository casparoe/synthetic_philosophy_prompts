      4.  **The Understanding/Consciousness Claim:** Syntax manipulation doesn't generate *phenomenal understanding* (Searle).
      5.  **The Causal Chain Claim:** Meaning requires a causal history terminating in perception (The "Anchor").
      6.  **The Degradation Claim:** Meaning degrades over chains of transmission without new perceptual input (The Synthetic Corpus specific).
      7.  **The Externalist Claim:** Meaning is determined by external factors, not internal state (Putnam).

  4.  **Fleshing out each Reading (Status, Evidence, Application):**

      *   *1. Formal Distinction:* Truism. Syntax is form, Semantics is content. Evidence: Definition. Application: Doesn't rule out syntax *correlating* with semantics.
      *   *2. Reference Fixing (Causal):* Contentious (Descriptivism vs. Causal). Evidence: Twin Earth thought experiments. Application: Hurts text-only models, hurts Human Antarctic case (unless inherited allowed).
      *   *3. Competence/Use:* Likely False. LLMs show high competence without grounding. Evidence: Benchmark performance. Application: Text-only models pass this.
      *   *4. Phenomenal Understanding:* Contentious (Hard Problem). Evidence: None really (philosophical). Application: Text-only models fail, Humans pass (presumably).
      *   *5. The "Anchor" Requirement (Strong Grounding):* Strong claim. Needs perception. Evidence: SGP arguments. Application: Text-only fails, Human Antarctic passes (via chain), Synthetic fails completely.
      6.  *The Degradation/Entropy Claim:* Very Contentious. Does meaning rot? Evidence: Game of "Telephone" with meaning. Application: Synthetic corpus might be "hollow."
      7.  *The Camera/Input Mapping:* Is mapping enough? If it's just another syntax rule, no. If it's causal, maybe.

  5.  **Addressing the Specific Cases:**
      *   *Text-only Model:* Fails Causal/Anchor, Passes Competence.
      *   *Human Antarctic:* Passes Causal (via chain), Passes Competence.
      *   *Synthetic Corpus:* Fails Anchor (no perception at root). Does it fail Reference?
      *   *Camera System:* Is pixel-to-token mapping "grounding"? Only if the mapping is causal/nomic, not just arbitrary lookup.

  6.  **Structuring the Handout:**
      *   Title.
      *   Introduction (acknowledging the supervisor's distinctions).
