      *   *(c) Standard Modern Responses:* Substantivalists (like Earman/Norton initially) saw this as a problem for manifold substantivalism. Response: Reject manifold substantivalism (accept Leibniz equivalence). Or accept indeterminism (rare). Structuralists: Points are defined by relations. Relationalists: Spacetime is derived from material relations.

  3.  **Reconstructing Leibniz's Position (Requirement 2 & 3):**
      *   *Core Metaphysics:* Leibniz denies independent existence to space/time. They are phenomenal or ideal orders. Monads are the true substances.
      *   *View on Hole Argument:* He would see the Hole Argument as a *reductio ad absurdum* of substantivalism. The argument assumes points have "haecceity" (thisness) independent of the field values. Leibniz would say this assumption violates PII. If two models differ only by which point holds which metric value, but the pattern of relations is identical, they are the same world described differently.
      *   *Verdict:* The Hole Argument doesn't undermine substantivalism by showing it leads to indeterminism (which Leibniz might dislike); rather, it shows substantivalism posits indiscernible states (violating PII) without sufficient reason (violating PSR). Therefore, the argument supports relationalism (or structuralism) by exposing the absurdity of the substantivalist premise. It begs the question by assuming point identity.

