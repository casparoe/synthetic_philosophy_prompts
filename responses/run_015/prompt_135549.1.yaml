          *   Person A: The installation *doesn't exist* Mon-Fri (it's just separate objects).
          *   Person B: The installation *does exist* as a single entity even when scattered (like a band).
      *   **The Core Question:** Is there a real philosophical difference between "one object taken apart" vs. "a convenient label for unrelated things"? Is there a non-arbitrary way to decide?
      *   **Requirements:** Lay out the actual disagreement, address the possibility of a non-arbitrary decision, state confidence level, and flag the least certain part.

