      *   Key concepts involved:
          *   **Mereological Essentialism:** Does an object lose its identity if parts change? (Ship of Theseus).
          *   **Temporal Parts/Perdurantism:** Is the object a space-time worm?
          *   **Social Ontology/Institutional Facts:** Does collective intentionality create the object? (John Searle).
          *   **Nominalism vs. Realism:** Is the "whole" a real thing or just a name (flatus vocis)?

