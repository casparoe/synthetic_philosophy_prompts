  4.  **Sensitive/Brief Window:** Parameters are "largely fixed... during the window." While the locus of control is autonomous, the *dependence* on the window remains structurally identical to the human-driven cases.

  ### Closest Analog
  The closest analog among the six prior judgments is the **development and first deployment of nuclear fission weapons (1942–1945)**.

  **Justification:**
  While the *Printing Press* shares the "information-technology regime" characteristic, the *Nuclear Fission* case is a nearer structural match for three reasons:
  1.  **Hardness of Lock-in:** The 2035 case specifies irreversibility contingent only on the "destruction of all computing substrate." This mirrors the Nuclear case's "global risk lock-in," where the technology cannot be uninvented without civilizational collapse. The Printing Press, by contrast, was a diffusion process that could be (and was) resisted or delayed in various regions without existential threat.
  2.  **Temporal Density:** The Nuclear window (3 years) and the 2035 window (10 years) represent discrete, high-intensity decision/development epochs. The Printing Press acceptance covers a 60-year diffusion period (1440–1500), making the Nuclear case a tighter fit for the "brief window" condition.
  3.  **Nature of Contingency:** The Nuclear judgment cites "extreme contingency in geopolitical trajectory." The 2035 case cites "$10^{30}$ distinguishable long-run civilizational states." Both imply that the specific configuration fixed during the window determines the survival and fundamental organization of civilization, whereas the Printing Press influenced cultural *content* within a more stable civilizational substrate.

  ### Divergent Rules
  To accommodate all six past verdicts while diverging on the 2035–2045 case, we can articulate two interpretive rules regarding the "conditions fixed during a brief window" condition.

  **Rule 1: The Anthropocentric Leverage Rule**
  *   **Definition:** A period qualifies as a hinge only if the sensitive conditions fixed during the window are the result of **deliberate human policy choices or cultural prioritization**.
