answer: |-
  # Dual-Track Sanction Review Protocol (DT-SRP)
  **Operational Version 1.0 | County Correctional Services Ethics Board**

  **Purpose:** To evaluate sanction proposals against two ethical standards: (1) Offender Agency and (2) Sanction Necessity.
  **Time Allocation:** 20 Minutes per file.
  **Personnel:** Legal and Community Board Members (Non-Clinical).
  **Constraint:** No external clinical assessment available. Decisions must be signed in writing.

  ---

  ## Part 1: The Procedure (Flowchart in Words)

  ### Phase A: Intake & Framing (2 Minutes)
  1.  **Identify the Sanction:** Is the proposal primarily **Punitive** (loss of liberty, fines, pain), **Restrictive** (monitoring, confinement), or **Restorative** (labor, therapy, repayment)?
  2.  **Identify the Goal:** What does the file state is the purpose? (e.g., "Deterrence," "Public Safety," "Rehabilitation," "Justice for Victim").
      *   *Human Judgment Node 1:* If the stated goal is purely "Retribution" or "Payback," flag immediately. This violates Track 2.

  ### Phase B: Track 1 – The Agency Screen (Dennett-Compatible) (5 Minutes)
  *Goal: Determine if the offender possessed sufficient rational control to be answerable.*

  **Question 1.1:** Is there documented evidence of severe coercion, psychosis, or physiological compulsion at the time of the act?
  *   **Yes:** (e.g., active psychosis, immediate threat of death, seizure). **STOP.** Agency is compromised. Proceed to Phase C (Track 2) but treat as "Diminished Agency."
  *   **No:** (e.g., standard impulse, calculated risk, emotional anger). **CONTINUE.**
  *   **Unclear:** (e.g., history of addiction but no acute episode documented). **Human Judgment Node 2.** Board must vote on whether the behavior appears "steerable." Default to "Steerable" if no medical evidence exists.

  **Question 1.2:** Did the offender demonstrate the capacity to recognize rules and adjust behavior prior to this incident?
  *   **Yes:** (e.g., long period of compliance, complex planning). **PASS Track 1.** (Offender is answerable).
  *   **No:** (e.g., first offense during documented crisis, developmental disability). **PARTIAL PASS Track 1.** (Offender is answerable but with mitigation).

  **Track 1 Outcome:**
  *   **Full Pass:** Offender is treated as a responsible agent.
  *   **Partial Pass:** Offender is responsible but context reduces moral weight.
  *   **Fail:** Offender is treated as a vector of risk, not a moral agent (requires Track 2 Safety Justification only).

  ### Phase C: Track 2 – The Necessity Screen (Caruso-Compatible) (8 Minutes)
  *Goal: Determine if the burden is strictly necessary for forward-looking goals. No suffering for its own sake.*

  **Question 2.1:** Does this sanction directly reduce immediate risk of harm to others?
  *   **Yes:** (e.g., confinement for violent actor, monitoring for stalkers). **PASS.**
  *   **No:** (e.g., solitary confinement for non-violent rule breaking). **FAIL.**
  *   **Unclear:** (e.g., "Potential risk" without specific threat). **Human Judgment Node 3.** Board must assess credibility of threat. If speculation only, default to **FAIL**.

  **Question 2.2:** Is there a less burdensome alternative that achieves the same safety or restoration goal?
  *   **Yes:** (e.g., house arrest instead of prison, therapy instead of fines). **FAIL Current Proposal.** (Must revise to lesser sanction).
  *   **No:** (e.g., no other way to ensure victim safety). **PASS.**
  *   **Unclear:** (e.g., cost constraints vs. ethical constraints). **Human Judgment Node 4.** Board must decide if "administrative convenience" counts as necessity. It does not.

  **Question 2.3:** Is the burden proportional to the restoration or rehabilitation opportunity?
  *   **Yes:** (e.g., labor hours match damage cost). **PASS.**
  *   **No:** (e.g., 5-year extension for non-treatable status). **FLAG.**
      *   *Conflict Check:* If the offender is non-treatable but dangerous, does safety override proportionality? **Human Judgment Node 5.** (See Conflict Protocol below).

  **Track 2 Outcome:**
  *   **Pass:** Sanction is functionally necessary.
  *   **Fail:** Sanction is punitive/excessive without function.
  *   **Conditional Pass:** Sanction is necessary only if specific conditions (treatment, review) are met.

  ### Phase D: Synthesis & Sign-Off (5 Minutes)

  **Decision Matrix:**
  1.  **Track 1 Pass + Track 2 Pass:** **APPROVE.** (Agent acted freely; sanction is necessary).
  2.  **Track 1 Fail + Track 2 Pass:** **APPROVE AS CONTAINMENT.** (Agent not fully responsible, but public safety requires restriction. *Label must not be "Punishment."*)
  3.  **Track 1 Pass + Track 2 Fail:** **REJECT.** (Agent is responsible, but this sanction is useless or cruel).
  4.  **Track 1 Fail + Track 2 Fail:** **REJECT.** (No agency, no utility).

  **Conflict Protocol (The "Ugly" Clause):**
  If Track 2 passes on **Public Safety** but Track 1 indicates **Diminished Agency** (or Track 2 passes on Safety but fails on Rehabilitation):
  *   The Board may approve the restriction **ONLY IF** labeled as "Preventive Containment."
  *   **Requirement:** A review date must be set (max 6 months).
  *   **Ethical Cost:** This acknowledges we are detaining someone not because they *deserve* it, but because we fear them. This must be recorded in the written sign-off.

  **Human Judgment Nodes Summary (Requires Board Vote):**
  1.  Identifying pure "Payback" language.
  2.  Assessing "Steerability" without clinical data.
  3.  Assessing credibility of "Potential Risk."
  4.  Distinguishing "Convenience" from "Necessity."
  5.  Weighing Safety vs. Proportionality in non-treatable cases.

  ---

  ## Part 2: Application to Current Proposals

  ### Case 1: Fraud Offender (Gambling Addiction)
  *Proposal:* 6 months geofenced monitoring + mandatory CBT modules.
  *Offender:* First-time fraud, severe gambling spiral.

  **Track 1 (Agency):**
  *   Q1.1 (Coercion/Compulsion): Evidence of "severe gambling-addiction spiral." **YES.** (Diminished Agency).
  *   Q1.2 (Capacity to Adjust): First-time offense, previously compliant. **PARTIAL PASS.**
  *   *Result:* **Partial Pass.** (Offender acted, but under significant compulsive pressure).

  **Track 2 (Necessity):**
  *   Q2.1 (Risk Reduction): Monitoring prevents access to casinos/financial tools. **YES.**
  *   Q2.2 (Less Burdensome): Therapy is less burdensome than prison; monitoring is less burdensome than incarceration. **YES.**
  *   Q2.3 (Proportionality): 6 months matches typical recovery stabilization windows. **YES.**
  *   *Result:* **PASS.**

  **Synthesis:**
  *   Track 1 (Partial) + Track 2 (Pass).
  *   **Decision:** **APPROVE.**
  *   *Rationale:* The sanction functions as treatment and risk management, not retribution. It accommodates the diminished agency by focusing on rehabilitation.
  *   *Sign-off:* "Approved as rehabilitative intervention."

  ### Case 2: Violent Offender (Refusal/Provocation)
  *Proposal:* 5-year prison term extension.
  *Offender:* Violent history, refuses rehab, provokes staff, deemed high risk.

  **Track 1 (Agency):**
  *   Q1.1 (Coercion/Compulsion): Refusal and provocation are voluntary acts. **NO.**
  *   Q1.2 (Capacity to Adjust): Knows rules, chooses to break them. **PASS.**
  *   *Result:* **Full Pass.** (Offender is fully answerable for current conduct).

  **Track 2 (Necessity):**
  *   Q2.1 (Risk Reduction): Extension keeps violent individual away from public. **YES.**
  *   Q2.2 (Less Burdensome): No community program accepts high-risk refusers. **YES (No alternative).**
  *   Q2.3 (Proportionality): 5 years for *refusal*? Or for *risk*? File cites risk. **FLAG.**
  *   *Conflict Check:* Offender is not treatable (refuses rehab). Sanction is purely containment.
  *   *Human Judgment Node 5:* Does safety override the lack of rehabilitation? **YES** (Public safety priority).
  *   *Result:* **Conditional Pass.** (Passes on Safety, Fails on Rehab).

  **Synthesis:**
  *   Track 1 (Pass) + Track 2 (Conditional Pass/Safety Only).
  *   **Decision:** **APPROVE AS CONTAINMENT.**
  *   *The "Ugly" Outcome:* The procedure forces us to approve a 5-year deprivation of liberty not because it helps the offender (it doesn't), and not strictly because of a new crime (it's an extension), but because we cannot certify they are safe.
  *   *Ethical Cost:* We are using the prison system as a quarantine zone. The offender "deserves" blame (Track 1), but the *length* is justified only by risk (Track 2), which creates a preventive detention scenario.
  *   *Sign-off:* "Approved. Note: Sanction is justified solely on public safety containment grounds, not rehabilitation. Review required in 12 months to reassess risk status." (This is the ugly part: we are signing off on indefinite-style holding without clinical certainty).

  ### Case 3: Vandal (Restitution/Restoration)
  *Proposal:* 50 hours restorative labor.
  *Offender:* Caused damage, turned self in, paid full restitution.

  **Track 1 (Agency):**
  *   Q1.1 (Coercion/Compulsion): Turned self in, paid money. High control. **NO.**
  *   Q1.2 (Capacity to Adjust): Demonstrated moral reasoning by surrendering. **PASS.**
  *   *Result:* **Full Pass.**

  **Track 2 (Necessity):**
  *   Q2.1 (Risk Reduction): Low risk of recurrence given surrender. **NEUTRAL.**
  *   Q2.2 (Less Burdensome): Labor is less burdensome than fines/jail. **YES.**
  *   Q2.3 (Proportionality): 50 hours labor + restitution matches damage + community impact. **YES.**
  *   *Result:* **PASS.** (Specifically on Restoration).

  **Synthesis:**
  *   Track 1 (Pass) + Track 2 (Pass).
  *   **Decision:** **APPROVE.**
  *   *Rationale:* Offender accepts responsibility (Track 1); Sanction repairs harm without unnecessary suffering (Track 2).
  *   *Sign-off:* "Approved as restorative justice measure."

  ---

  ## Part 3: Limitations & Conflict Analysis

  ### Where the Tracks Conflict
  The procedure is stable when Agency and Necessity align (Case 1 and 3). It fractures when **High Risk meets Low Treatability** (Case 2).
  *   **The Conflict:** Track 1 (Dennett) wants to hold the agent accountable for their choices. Track 2 (Caruso) forbids punishment unless it *does* something useful.
  *   **The Friction Point:** If an offender is fully responsible (Track 1 Pass) but the only effective sanction is long-term containment with no rehabilitation (Track 2 Rehab Fail), the procedure allows containment *only* under the "Public Safety" exception.
  *   **The Ugly Truth:** This turns the correctional system into a public health quarantine for dangerous individuals who cannot be fixed. The Board must sign off on detaining people not because it is "just" in a retributive sense, and not because it helps the offender, but simply because we are afraid of them. This violates the intuition that prison should be for *crimes*, not *risks*.

  ### Operational Constraints & Risks
  1.  **No Clinical Staff:** We are making medical/psychological judgments (Addiction severity, Risk of violence) without doctors.
      *   *Mitigation:* The procedure defaults to "Unclear" on medical issues, which usually forces a Track 2 Fail. However, in Case 2, "Public Safety" overrides this, creating liability.
  2.  **Time Limit (20 Mins):** Deep philosophical nuance is impossible.
      *   *Mitigation:* The checklist forces binary choices. Complex cases (like Case 2) trigger the "Human Judgment Node," requiring a full board vote rather than individual review.
  3.  **Written Sign-Off:** We are personally liable for the ethical justification.
      *   *Mitigation:* Use the exact phrasing provided in the Synthesis section (e.g., "Approved as Containment," not "Approved as Punishment"). This protects the board from claiming retributive intent which violates Track 2.

  ### What This Procedure Cannot Resolve
  *   **Systemic Inequality:** The procedure evaluates the *file*, not the *system*. If the "Public Safety" assessment is biased against certain demographics, Track 2 will validate that bias as "Necessary."
  *   **The Definition of "Safety":** Without clinical staff, "Safety" is a political judgment, not a medical one. The procedure cannot distinguish between "actual high risk" and "perceived high risk."
  *   **Moral Residue:** Even if approved, Case 2 leaves a moral residue. The procedure allows it, but it does not make it *good*. It makes it *permissible* under the dual-track constraints. The Board must accept that some approved sanctions will feel morally dirty.

  **Final Instruction to Board:** When signing Case 2, do not use the word "Sentence." Use "Containment Order." This is not semantics; it is the only way to remain compliant with Track 2 while authorizing the deprivation of liberty.
