  1. Illusionism is best understood as a grammatical misplacement arising from the inherent architecture of self-representing systems, making it impossible to observe the mechanism from outside its own operational logic. Consequently, no amount of improved introspection can correct the error because the error is the necessary condition for the appearance of subjectivity itself.
  2. Opponents mistakenly reify the indexical stance of the subject into a non-physical object, treating the mode of presentation as if it were the content presented. They fail to see that the feeling of "what it is like" is merely the system's transparent access to its own states, not evidence of intrinsic qualitative properties.
  3. Subjective experience remains real as a functional process of self-modeling, even though the supposed qualia are merely artifacts of how that model formats information. We preserve the phenomenon of experience by relocating it from metaphysical substance to structural necessity within the cognitive system.
  4. Reports of ineffability reflect the limits of public language in capturing private indexical frames rather than pointing to ineffable intrinsic properties. The inability to fully communicate these states stems from their grammatical role as anchors for perspective, not from their ontological depth.
  5. Theories grounding first-person authority in direct access to intrinsic features must collapse, since there are no intrinsic qualitative features to access. Instead, authority is reconceived as a systemic immunity to error regarding one's own representational stance, not knowledge of inner objects.
