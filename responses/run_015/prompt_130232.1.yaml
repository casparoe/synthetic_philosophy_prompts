      *   *Objection 8 (Agency):* Where is the class struggle in this model?

      *Refining Replies:* Ensure they don't sound like tech-speak. Use "valorization," "objectification," "metabolic rift."

      *Self-Correction on "Algorithm as Subject":* A Marxist audience will *hate* "Algorithm as Subject." Capital is the automatic subject, not the tool. I need to make sure the reply clarifies that the algorithm is the *form* of capital's subjectivity, not a sentient being.

