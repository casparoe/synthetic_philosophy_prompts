      *   *Audience Core:* LTV is sacred but rigid. "Alienation" is often seen as humanist/early Marx (1844) vs. scientific/late Marx (Capital). "Subsumption" has specific meanings (Formal/Real). They hate vague sociological expansions of economic categories.
      *   *Key Tension:* The speaker claims this is *not* reducible to surplus-value extraction but *also* says don't abandon LTV. This is a potential contradiction. If it's labor, it creates value. If it's appropriated, it's surplus value. Why is it different?
      *   *Key Tension 2:* "Algorithm as Collective Subject." Marxists usually see capital as a social relation, not a subject. Attributing subjectivity to the algorithm might sound like fetishism or technocratic determinism.
      *   *Key Tension 3:* "Cognitive Extraction." Is this just intensity of labor? Is it unpaid labor time? If it's unpaid, it's absolute surplus value. If it's efficiency, it's relative surplus value. Why do we need a *new* metric?

  3.  **Drafting the Objections (Iterative Process):**
      *   *Attempt 1:* "Is this just real subsumption?" (Too generic).
