  Please argue that German-style folk morality—where following rules and keeping order is seen as a moral virtue in itself—actually has the better of it over the American idea that individual conscience should always trump procedure. But don't just rehash the old "obedient Germans vs free Americans" trope; that's pretraining bait. Instead, frame your argument around something more specific: the difference between "moral heat" (the immediate feeling that something is wrong) and "moral scaffolding" (the rules and habits that keep that heat from burning out or getting misdirected). Make the case that American culture treats scaffolding as a kind of moral failure—like you're not really thinking if you just follow the rules—when actually the scaffolding is what lets conscience survive in large groups or over long periods. You might talk about workplace safety, bureaucratic accountability, or why people say "my gut told me" vs "the protocol said"—just don't bring in named philosophers, citation lists, or academic books. Write it like a slightly over-caffinated blog post, not a term paper. Its okay if a sentence runs long or you misspell "scaffolding" once.
