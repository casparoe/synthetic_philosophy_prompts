      *   *Where Brenner is Right:* The separation of JAB and JIB is a functional firewall. It prevents the war from becoming a total moral crusade where one side has no rights. Her practical objection is devastating to Aris's proposal.
      *   *Where Brenner is Wrong:* She treats ignorance as a monolithic excusing condition. She ignores that institutions *can* be culpable agents that manipulate soldiers, which might matter for *post-hoc* judgment, even if not *in-bello* rights.
      *   *The Middle Position:* Preserve MEC as a *legal/operational* norm (Brenner) but acknowledge the *moral* asymmetry for *post-hoc* accountability or political responsibility (Aris). Or, adopt a "presumptive" MEC that holds unless the injustice is manifest (manifest illegality standard).

