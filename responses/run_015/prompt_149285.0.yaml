answer: |-
  ### Tier S: The subjective intensity of acute physical pain
  This domain offers the most privileged introspective access because nociceptive sensations are immediately present and largely resistant to cognitive reinterpretation. The characteristic reliability limit involves top-down cognitive modulation, where attention or catastrophizing can decouple reported intensity from actual nociceptive input.
  **Procedural Safeguard:** Clinicians should cross-reference verbal pain scores with observed non-verbal pain behaviors, such as guarding or facial grimacing, to verify consistency.

  ### Tier A: Occurrent emotional valence
  While the raw feeling of positive or negative affect is directly accessible, the cognitive categorization of that feeling is prone to error without specific emotional granularity. The characteristic failure mode is affective labeling error, where patients misidentify complex arousal states as specific emotions due to limited alexithymic insight.
  **Procedural Safeguard:** The protocol should include real-time mood sampling prompts during the interview rather than relying solely on retrospective summaries of mood.

  ### Tier B: Pre-reflective bodily agency
  The sense of authorship over movement is typically automatic and accurate but can be severed by specific neurological or psychiatric pathologies without patient insight. The relevant failure mode is delusional misattribution, where internal movements are falsely experienced as externally controlled or alien.
  **Procedural Safeguard:** A structured neurological motor examination should be administered to verify voluntary control and screen for involuntary movements.

  ### Tier C: The motivating reasons behind a recent voluntary action
  Individuals lack direct introspective access to the causal mechanisms driving their behavior, leading them to construct plausible stories rather than report facts. This domain is defined by the failure mode of confabulation, where patients unknowingly invent reasons to explain actions after the fact.
  **Procedural Safeguard:** Clinicians must compare stated motivations against documented behavioral patterns and consistency across multiple interview segments.

  ### Tier D: Long-term personality traits
  Retrospective self-assessment over extended periods is heavily distorted by current mood states and the psychological need for a coherent self-story. The dominant failure mode is memory reconstruction bias, where past behaviors are recalled to align with the patient's current self-concept rather than objective history.
  **Procedural Safeguard:** The intake process should mandate collateral information gathering from family members or partners to validate longitudinal trait claims.
