answer: |-
  # PREP SHEET: Hume's *Of Suicide* & The Sympathy Loop
  **Target:** Grad Seminar (Hume Scholars + Moral Psych)
  **Thesis:** The essay isn't about Divine Ownership; it's about the stability of the moral sentiment system (sympathy). Theology is a smokescreen for social cohesion.

  ---

  ### 1. THE HUME SCHOLARS: Vocabulary & Textual Traps
  *They will attack your reading of the text and your terminology.*

  *   **The "Retirement" Passage (The Killer):**
      *   **Objection:** Hume explicitly describes an old man withdrawing from society ("opening a vein") as permissible because he is no longer useful. This directly contradicts the claim that suicide *necessarily* ruptures the sympathy loop.
      *   **Counter:** Distinguish between *withdrawal when burdensome* vs. *withdrawal when productive*. The rupture only occurs when the agent abandons a post where their sympathy-contribution is net positive.
      *   **Vocabulary Check:** Don't say "Sympathy Loop." Hume says "contagion of passions," "correspondence of movements," or "general point of view." Use their terms to describe your mechanism.
      *   **The "Cowardice" Claim:**
      *   **Objection:** Claiming Hume "dressed it up" because he feared the church is biographical speculation. Hume dismantled religion openly elsewhere (*Natural History of Religion*). He might have used the theological frame because that was the *actual* dominant argument of his day, not out of fear.
      *   **Concession:** Admit the "fear" motive is speculative. Pivot to: "Whether out of fear or strategic dialectic, the theological frame obscures the *philosophical* work the essay is doing on moral sentiment."

  ### 2. THE MORAL PSYCH FOLKS: Normative Weight
  *They will attack the mechanism of sympathy.*

  *   **"Sympathy is Descriptive, Not Normative":**
      *   **Objection:** Sympathy explains how we *feel* about suicide, not whether it is *wrong*. You can't derive a norm from a psychological mechanism without begging the question.
      *   **Counter:** In Hume's sentimentalism, the sentiment of disapproval *constitutes* the wrongness. If the rupture causes a stable sentiment of disapproval in the General Point of View, it *is* wrong. There is no "normative weight" outside of the sentiment.
  *   **"Fragility of the System":**
      *   **Objection:** Is the moral system really so fragile that one suicide destabilizes it? That seems empirically false.
      *   **Counter:** It's not about one act collapsing society. It's about the *precedent* destabilizing the spectator's ability to calibrate utility. If we normalize exit, the "stakes" of social cooperation lower, altering the sympathetic calibration for everyone.

  ### 3. TRIAGE: What Lands vs. What's a Bluff
  *   **LANDS (Concede these):**
      *   **Textual Permission:** You cannot claim Hume thinks suicide is *always* wrong. He explicitly permits it when one is a burden. Your claim must be: "The *only* valid objection Hume allows is the social/sympathetic one, not the theological one."
      *   **Terminology:** Admit "Sympathy Loop" is a reconstructive heuristic, not Hume's phrase.
      *   **Motivation:** Admit you can't prove Hume's psychological fear of the church. Treat it as a hermeneutic device, not biographical fact.
  *   **BLUFF (Call their bluff/Stand firm):**
      *   **Anachronism:** If they say sympathy isn't fully worked out in *Of Suicide*, point out it was written alongside the *Enquiry Concerning the Principles of Morals*. The system is live.
      *   **Theological Sincerity:** If they insist Hume cared deeply about refuting the "God's Property" argument on its own terms, push back: Hume treats it as a category error. He's clearing the ground for the *real* issue: social duty.

  ### 4. STRATEGIC CONCESSIONS (Say these early)
  1.  "I am not arguing Hume bans suicide. I am arguing he shifts the *grounds* of the ban from Theology to Moral Psychology."
  2.  "I agree that for Hume, suicide is permissible when the agent is a net burden. My claim applies to agents who are net contributors to the sympathetic network."
  3.  "I am reading *Of Suicide* through the lens of the *Treatise/EPM* moral system. If the texts conflict, I prioritize the coherence of the larger moral system."

  ### 5. THE TWO-MINUTE REPLY (The Core Defense)
  *Memorize the structure of this. Deliver it calmly.*

  "Hume's system relies on the **General Point of View**. For moral judgment to be stable, spectators must agree on the utility and agreeableness of character traits. Suicide isn't just an exit; it is a communicative act that signals the **revocability of social commitment**.

  If social commitment is revocable at will, the spectator's calculation of utility becomes unstable. I cannot sympathize with your long-term projects if I know your participation is contingent on your mood. Therefore, the 'wrongness' of suicide in Hume's system isn't about violating God's property rights; it's about **undermining the conditions required for the sympathy mechanism to function reliably.**

  Hume uses the theological argument because that was the public language of 'duty.' But philosophically, he is protecting the **infrastructure of moral sentiment**. He allows suicide only when the agent can no longer contribute to that infrastructure (i.e., when they are a burden). To leave earlier is to break the circuit of sympathy that makes moral judgment possible."

  ### 6. THE "PRAYER OBJECTION" (Instrumentalism)
  *The question you hope they don't ask.*

  *   **The Question:** "If the wrongness depends on the rupture of social utility, doesn't that make suicide only *instrumentally* wrong? Does Hume have no account of intrinsic wrongness here? Are you reducing morality to cost-benefit analysis?"
  *   **The Deflection (Do not dodge, reframe):**
      *   "That assumes a realist framework where 'intrinsic' wrongness exists independently of human sentiment. For Hume, **there is no intrinsic wrongness.**
      *   To ask if it's 'only instrumental' is to ask a non-Humean question. In sentimentalism, the 'wrong' *is* the sentiment of disapproval arising from the view of utility.
      *   So, it is not that suicide is bad *because* it breaks the loop. It is that breaking the loop *constitutes* the badness. The instrumental consequence (social instability) generates the sentiment (disapproval), which *is* the moral fact. I'm not reducing morality; I'm respecting Hume's meta-ethics."

  ---

  **Final Tip:** If a Hume scholar cites the specific line "I have done my part in society" (the permission to leave), nod and say: "Exactly. That proves the duty is to the *system*, not to God. Once the contribution ends, the obligation ends. My reading explains *why* the obligation exists in the first place."
