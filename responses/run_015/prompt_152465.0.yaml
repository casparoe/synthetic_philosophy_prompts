answer: |-
  Your point about the anchor disappearing at the limit hurts, because it forces me to admit that if full automation is reached, the law of value dissolves—but that dissolution is the crisis, not a smooth transition. You treat the loop as a stable equilibrium capitalism can inhabit; I treat it as a horizon capitalism approaches only by choking on its own accumulation. If the whole economy is your loop, total surplus value is zero, so total profit must be zero. If prices remain positive, you're describing inflationary fiction or monopoly pricing sustained by state force, not capitalist production proper.

  Look at the arithmetic of generalization. A single firm mechanizes, cuts labor, keeps prices steady, pockets super-profit—that's a transfer of value from competitors to itself. But when the loop expands, the mass of surplus value shrinks relative to total capital advanced. If $s = 0$ globally, then $r = s/(c+v) = 0$. You claim the owner still pockets the average rate. From whom? If everyone is automated, there is no pool of surplus value to redistribute. The price tags remain, but the content vanishes. This isn't rents; it's the devaluation of capital titles waiting to happen. The crisis is the violent restoration of profitability by destroying constant capital, not a quiet shift to rentiership.

  You say value becomes vestigial plumbing. No, value is the constraint that snaps back. When you say prices don't fall to match the collapse in value, you're describing a divergence between paper claims and real wealth. Capitalism tolerates this only until credit chains break. Your loop assumes the market clears at prices of production without surplus value to sustain them. That's not capitalism surviving automation; it's capitalism pretending automation hasn't happened until the balance sheet forces a reckoning. You're describing a post-capitalist rentier state and calling it capitalism to save the phenomenon.
