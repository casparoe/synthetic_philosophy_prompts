      *   *The "Meta-Source":* Make sure the Rashomon gate analysis feels integrated, not tacked on. It represents the decay of the structure holding the history.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe suggest the Woodcutter's version is the true one.
      *   *Correction:* No, the film implies even he lied about the dagger. Better to argue that *no* version is objectively true. The "truth" is the act of kindness at the end.
      *   *Initial thought:* Compare heavily to Herodotus.
