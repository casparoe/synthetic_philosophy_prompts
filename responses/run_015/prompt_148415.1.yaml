answer: |-
  ### Brainstorm & Dependency Chain

  Here's the logical scaffolding before we build the session. You can't just drop the tetralemma on them; their classical logic brains will reject it as a category error. Here's the chain of dependencies you need to walk them through:

  1.  **The Predicate Assumption:** Students assume that for any subject $S$, predicates like "exists" or "doesn't exist" are meaningful.
  2.  **The Ontological Commitment:** In classical metaphysics (and their logic training), predication implies the subject has a determinate nature (*svabhāva*). To say "S exists" means "S has intrinsic being."
  3.  **The Dependency Move:** You must show that phenomena are *only* defined relationally (dependent origination).
  4.  **The Clash:** If $S$ is purely relational, it lacks intrinsic nature.
  5.  **The Collapse:** If $S$ lacks intrinsic nature, predicates of intrinsic existence/non-existence fail to latch.
  6.  **The Result:** The tetralemma isn't a failure of logic; it's a demonstration that the *terms* are misapplied.

  **The Logical Reflex to Break:**
  They need to break the reflex that **"Existence" is a valid property.** They think "Exists/Doesn't Exist" is like "Red/Not-Red." You need them to see "Exists/Doesn't Exist" is more like "Bachelor/Married" applied to a rock. It's a category error, not a truth-value gap.

  **The Carrying Example: A Knot in a Rope**
  Forget the chariot. Use a **Knot**.
  *   **Concrete:** They can visualize it.
  *   **Relational:** A knot is nothing but the rope arranged specifically.
  *   **The One Reason:** All four corners of the tetralemma collapse because the knot has no *independent* ontology. It's not that we have four different arguments; it's that the subject "Knot" is empty of intrinsic nature (*svabhāva*).
      1.  *It exists:* Yes, functionally. But intrinsically? No, pull the rope, it's gone.
      2.  *It doesn't exist:* Yes, ontologically. But functionally? No, it holds the rope together.
      3.  *Both:* Contradictory if "existence" means intrinsic nature.
      4.  *Neither:* Also a position that reifies "neither-ness."
      *   *Collapse:* You can't predicate existence of a relation.

  **Misconceptions & Kill Zones:**
  1.  **Mysticism/Irrationalism:** Kill this **early (Minute 15)**. Frame Nāgārjuna as doing a *reductio ad absurdum* on essentialist metaphysics, not preaching zen mystery. He's using logic to break logic's ontological baggage.
  2.  **Nihilism:** Kill this **immediately after the Tetralemma (Minute 60)**. When they say "So nothing exists," you hit them with "No, the knot still ties the rope." Emptiness is not non-existence; it's the lack of *intrinsic* existence.

  **Two Truths Slice to Refuse:**
  Do **not** explain the ontological grounding of Conventional Truth (*saṃvṛti-satya*). Don't let them ask, "Okay, but what *is* the rope made of then?" or "What validates the convention?" That leads to infinite regress or idealism. Tell them: "We accept conventional functionality without ontological commitment. Don't ask what grounds the convention; ask what the convention *does*."

  **Final Check:**
  Ask: "If the knot is empty, why can't I ignore it?"
  *   *Fail:* "Because it's an illusion." (Nihilism/Illusionism)
  *   *Pass:* "Because it functions dependently." (Madhyamaka)

  ---

  ### The 90-Minute Teaching Arc

  #### 1. The Hook: Breaking the Logical Reflex (0–20 mins)
  Start where they are: Classical Logic. Write $P \lor \neg P$ on the board. Ask them what conditions must be met for this law to hold. They'll say "P must be meaningful."

  Push them: "What makes 'P' meaningful?" They'll assume reference.
  **Introduce the Knot.** Tie a rope in front of them.
  Ask: "Does the knot exist?"
  They'll say yes.
  Ask: "Where is it? Point to the knot."
  They'll point to the rope.
  Ask: "Is the knot the rope?" (No, you can have rope without a knot).
  "Is the knot separate from the rope?" (No, no rope, no knot).

  **The Pivot:** Tell them their logic requires subjects to have a stable identity to bear predicates. If the "Knot" is just a dependent arrangement, does "Existence" apply to it in the way their logic demands?
  *Goal:* Make them feel the itch that "Existence" might be the wrong category for dependent things.

  #### 2. The Tetralemma via The Knot (20–50 mins)
  Walk through the *catuṣkoṭi* using the Knot. Don't treat these as four separate puzzles. Treat them as one diagnosis.

  *   **Thesis (Exists):** If the knot exists intrinsically, it should be findable independent of the rope. It's not. -> *Fail.*
  *   **Antithesis (Doesn't Exist):** If the knot doesn't exist, why can't I pull the rope apart? It functions. -> *Fail.*
  *   **Both:** How can it have intrinsic nature and lack it simultaneously? -> *Fail.*
  *   **Neither:** Is "neither" a new intrinsic nature? -> *Fail.*

  **The One Reason:** Emphasize repeatedly: "We aren't failing to find the knot. We are failing to find a *subject* that can bear the predicate 'exists'."
  This is where you kill the **Mysticism** misconception. Tell them: "Nāgārjuna isn't saying reality is ineffable. He's saying our metaphysical categories are too coarse for dependent reality. This is precise philosophical hygiene, not poetry."

  #### 3. The Nihilism Trap (50–70 mins)
  Now they're dizzy. They think you've proven nothing is real.
  **Intervention:** "If I cut the rope, does the knot vanish?" Yes. "So it's not nothing. It's dependently real."
  Draw the distinction: **Intrinsic Existence** vs. **Dependent Functionality**.
  Emptiness (*śūnyatā*) = Lack of Intrinsic Existence.
  It does **not** = Lack of Dependent Functionality.

  Use the Knot again: "The knot is empty of 'knot-nature,' but full of causal power."
  This is where you solidify that Madhyamaka is not nihilism. Nihilism denies cause and effect. Madhyamaka saves cause and effect by removing the static entities that would make causation impossible (how can a static thing interact?).

  #### 4. The Two Truths Boundary (70–80 mins)
  Briefly introduce the Two Truths to stabilize them.
  *   **Conventional:** The knot ties the rope.
  *   **Ultimate:** The knot is empty.

  **The Refusal:** A student will ask, "But what makes the conventional truth true? Is it just consensus?"
  **Stop there.** Tell them: "We are not doing epistemology today. We are doing metaphysics. Conventional truth is defined by *function*, not by *correspondence to reality*. Don't ask me what grounds the convention. Ask me if the convention works."
  If you try to ground conventional truth, you reify it and lose emptiness. If you deny it, you lose the world. Walk the line without explaining the pavement.

  #### 5. The Final Check (80–90 mins)
  Don't do a quiz. Do a conceptual stress test.
  Ask: **"If the knot is empty, why does it matter?"**

  Listen to their answers.
  *   **Red Flag:** "Because our minds project meaning onto it." (This is Idealism/Illusionism. They think the knot is fake.)
  *   **Green Light:** "Because it constrains the rope." (This is Dependent Origination. The emptiness *is* the constraint.)

  If they say "It's an illusion," correct them: "Illusions don't hold ropes together. Emptiness isn't a lack of stuff; it's a lack of *independence*."

  Wrap up by reminding them: Nāgārjuna isn't destroying logic; he's liberating it from the assumption that words must map to independent atoms of reality.

  ### Quick Advice for Delivery
  *   **Don't use Sanskrit unless necessary.** Stick to "Intrinsic Nature" instead of *svabhāva* until the end.
  *   **Keep the rope in your hand.** Physically manipulate it during the tetralemma section. When you talk about "neither," drop the rope. Make it physical.
  *   **Watch for the "Logic Police."** Some students will try to solve the tetralemma with modal logic or paraconsistent logic. Acknowledge it, but pivot back: "Nāgārjuna isn't proposing a new logic system; he's critiquing the ontology presupposed by the current one."

  Good luck. If you can get them to see that "existence" is a predicate that requires more baggage than phenomena can carry, you've won.
