answer: |-
  # Adversarial Collaboration on Decision-Theoretic Fanaticism

  ### Agreed Claims

  1.  **Formal Entailment:** We agree that expected utility maximization with an unbounded utility function logically entails accepting sufficiently small probabilities of sufficiently large utilities. If the utility function has no upper bound, there exists no probability so small that it cannot be outweighed by a sufficiently large payoff.
  2.  **Axiomatic Cost:** We agree that avoiding this entailment requires rejecting at least one standard decision-theoretic axiom, such as dominance, separability, or dynamic consistency. Anti-fanaticism is not a free adjustment; it requires formal trade-offs.
  3.  **Epistemic Fragility:** We agree that human credence assignments for probabilities below $10^{-9}$ are not reliably calibrated by standard empirical evidence or intuition. In the far tail, credences are driven more by model architecture than by data.
  4.  **Meta-Regress Risk:** We agree that resolving uncertainty about decision theories by maximizing expected choice-worthiness risks replicating fanaticism at the meta-level. If the stakes of choosing the correct decision theory are astronomical, meta-uncertainty may force a fanatical verdict regardless of first-order tempering.
  5.  **Tail Distinction:** We agree that the stability of probability assignments differs between exogenous tails (world-generated risks) and endogenous tails (agent-generated via imagination). Endogenous tails are more susceptible to manipulation by computational effort.
  6.  **Existential Stakes:** We agree that ignoring the far tail entirely is unjustified if the potential stakes involve irreversible existential outcomes. A decision rule that assigns zero weight to existential risk regardless of probability is unacceptable to both sides.
  7.  **Dynamic Consistency:** We agree that dynamic consistency is a desirable property but may be incompatible with robust anti-fanaticism in infinite or near-infinite horizon cases. Maintaining consistency over time may require accepting fanatical bets made by past selves.
  8.  **Trade-off Structure:** We agree that the cost of avoiding fanaticism is the loss of formal tidy axioms; the cost of accepting it is vulnerability to epistemic noise in the tail. The dispute is not about whether there is a cost, but which cost is preferable.
  9.  **Articulation Independence:** We agree that articulation cost (how easily a scenario is described) should not strictly determine probability assignments in the far tail. A scenario being easy to compute should not automatically make it probable.
  10. **Computational Limits:** We agree that current computational resources limit our ability to resolve the tail empirically. We cannot simulate enough worlds to determine the true distribution of astronomical payoffs.

  ### Disagreements Table

  | Crux | Fanatic Phrasing | Tempered Phrasing | Concrete Case | Fanatic Prediction | Tempered Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Tail Sensitivity** | Dependence on the tail is an honest reflection of value; if the payoff is large enough, the epistemic fragility is irrelevant. | Dependence on the tail is a defect; a decision rule driven by the least determined part of the credence distribution is broken. | Intervention A costs $1M. Payoff is $10^{60}$ utility. Prob is $10^{-50}$ (Model X) vs $10^{-100}$ (Model Y). | Agent chooses A based on Model X. The magnitude dominates the epistemic uncertainty. | Agent rejects A. The difference between $10^{-50}$ and $10^{-100}$ is noise, not signal. |
  | **2. Meta-Fanaticism** | Meta-uncertainty collapses into fanaticism because the stakes of getting decision theory right are themselves astronomical. | Meta-uncertainty requires a tie-break rule that does not maximize expected choice-worthiness to avoid infinite regress. | Agent is 70% Fanatic, 30% Tempered. Stakes of choosing correctly are $10^{100}$ utility. | Agent acts as 100% Fanatic. The meta-stakes overwhelm the 30% tempering probability. | Agent acts as Tempered. Meta-maximization is rejected to prevent the regress from fixing the verdict. |
  | **3. Manufactured Tail** | Endogenous generation is just Pascal's mugging; the source of the scenario does not change the mathematical dominance. | Endogenous generation is distinct; if the agent can generate dominating tails by computation, the priority ranking becomes a function of compute power. | Agent runs a script generating $10^6$ scenarios, each with payoff $10^{100}$ and prob $10^{-200}$. | Agent sums the expected value. The script output dominates unrelated interventions. | Agent discounts the script output. The probability is assigned based on generation cost, not just payoff. |
  | **4. Empirical Calibration** | Humans can be trained to distinguish remote probabilities; calibration curves extend into the tail with enough rigor. | Humans cannot distinguish remote probabilities; credences below $10^{-20}$ are effectively arbitrary placeholders. | Calibration test: Distinguish prob $10^{-50}$ from $10^{-60}$ using logical evidence only. | Subjects will converge on the correct ratio given sufficient training and formal tools. | Subjects will show random variation no better than chance, regardless of training. |

  ### Verbal Disputes and Falsification Conditions

  **Merely Verbal Disputes**
  A portion of our disagreement is verbal, centering on the definition of "rationality." The Fanatics use "rational" to denote internal consistency with axioms (dynamic consistency, dominance), whereas the Tempered use "rational" to denote robustness to epistemic error (calibration, stability). When the Fanatics say "you are irrational," they mean "you are violating dominance." When the Tempered say "you are irrational," they mean "you are letting noise drive action." Additionally, we dispute the word "probability." The Fanatics treat probability as a logical relation that exists even in the absence of evidence (logical probability), while the Tempered treat probability as a measure of empirical confidence that degrades to zero in the absence of evidence (empirical probability). Clarifying these definitions reduces the temperature of the debate but does not resolve the practical impasse, as the axioms themselves remain in conflict.

  **Evidence Against Views**
  **Fanatic:** We would abandon our view if we demonstrated that fanatical agents are systematically money-pumped in realistic environments due to tail-error exploitation.
  **Tempered:** We would abandon our view if we identified a specific historical instance where a tempered decision rule caused humanity to miss an existential salvation that a fanatical rule would have captured.
