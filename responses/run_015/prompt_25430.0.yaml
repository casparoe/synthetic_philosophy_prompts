      *   *(a) Empirical:* We just need more data on speciation.
      *   *(b) Verbal/Deflationary:* Just use different terms (e.g., "phylospecies" vs. "biospecies").
      *   *(c) Incommensurability:* Frameworks are too different to talk across.
      *   *(d) Family-Resemblance/Wittgensteinian:* No essential definition exists; stop looking for one.

  3.  **Evaluate the Evidence (Mental Sandbox):**
      *   *Empirical (a):* Weak. We have genomes now. If it were purely empirical, the Biological Species Concept (BSC) vs. Phylogenetic Species Concept (PSC) debate would have resolved with genomic data. It hasn't. Proponents interpret the *same* gene flow data differently (e.g., is slight gene flow compatible with species status?).
      *   *Verbal (b):* Tempting, but practitioners resist it. Why? Because they think their concept captures the *real* units of nature, not just a convenient label. They aren't arguing about words; they are arguing about ontology.
      *   *Incommensurability (c):* Too strong. They do talk to each other. They cite each other. They agree on the data (hybrid zones exist), just not the interpretation.
      *   *Family-Resemblance (d):* Popular in philosophy (Ghiselin, Hull), but systematists often reject it because they need operational criteria for conservation or identification.
      *   *User's Hypothesis (Functional/Pragmatic):* Strong. Ereshefsky, Richards, Wilkins often argue about *why* we need species. Is it for evolutionary theory? Conservation law? Identification keys? The "job" dictates the "tool."

  4.  **Formulate the Best Diagnosis:**
      *   The User's Hypothesis is the strongest, but it needs nuance. It's not *just* functional; it's **Pluralistic Realism driven by Divergent Explanatory Aims**.
