      *   **User Persona:** An experienced science journalist or philosopher of biology (covering disputes for a decade). They know the literature (Mayr, Dobzhansky, various species concepts) and the current state of play (genomic data, lack of consensus).
      *   **Core Task:** Evaluate the "species problem" impasse. Specifically, test the user's working hypothesis (it's a disagreement about the *function* of the category) against four alternative diagnoses (empirical, verbal, incommensurable frameworks, family-resemblance).
      *   **Requirements:**
          1.  Provide the "best diagnosis" of the disagreement type.
          2.  Use reasons drawn from *participant arguments* (not just a survey of concepts).
          3.  Define what "progress" looks like given that diagnosis.
