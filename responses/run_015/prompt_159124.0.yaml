answer: |-
  Here is a proposal for the standing condition, derived directly from the tensions in your nine cases.

  ### 1. The Principle

  **The Non-Arbitrary Authority Condition**
  An agent lacks standing to blame a target for violating norm *N* if the agent's relationship to *N* renders their invocation of it arbitrary. Arbitrariness arises in two ways:

  *   **Clause A (Contextual Hypocrisy):** The agent is currently violating *N* within the **same normative context** as the target.
      *   *Motivation:* This handles **Case 1** (Standing Lost: Chair violates professional deadline norm within the department) against **Case 4** (Standing Intact: Sister violates familial neglect norm, but blames on neighborly neglect norm; contexts differ). It also accommodates **Case 2** (Standing Intact: Past violation is not *current*).
  *   **Clause B (Selective Enforcement):** The agent's pattern of enforcement or structural position exempts their own sphere of influence from *N* while applying it to outsiders.
      *   *Motivation:* This handles **Case 5** (Standing Lost: Senior enforces against junior but silently exempts collaborator) against **Case 8** (Standing Intact: Untempted blamer has no pattern of exemption; enforcement is consistent, not selective). It also captures **Case 6** (Standing Lost: Joint culpability creates a sphere of shared exemption).

  ### 2. The Nature of the Condition

  Standing is a condition on the **propriety of issuing blame**, not on the **warrant or truth of the blame**.

  *   **Why:** This distinction is required by **Case 3**. In Case 3, the student *has* done wrong (the blame is warranted/true), and the student *cannot complain* (they have no first-order defense). Yet you report the blame as "defective." If standing were a condition on warrant, the blame would be false or unjustified, which contradicts your verdict that the student did wrong. If standing were a condition on the addressee's right to object, the blame would be unobjectionable, which contradicts your intuition that "something goes wrong."
  *   **Implication:** The defect lies in the *blamer's moral position to speak*, not in the *moral status of the act blamed*. This explains why the defect in Case 3 is "something the addressee can't invoke." The addressee cannot claim "You have no standing" as a *justification* for their own padding, because the padding is still wrong. The standing condition blocks the *delivery* of the judgment, not the *content* of the judgment.

  ### 3. The Grain of the Norm

  To apply Clause A, we need a rule for when a violation counts as "the same norm."

  **The Role-Relative Specificity Rule:**
  Norms are individuated not by their abstract moral value (e.g., "honesty," "care"), but by the **specific role-obligations** that instantiate them in a given context.

  *   **Application to Case 1:** The Chair violates "Professional Duty to Meet Department Deadlines." The Junior violates "Professional Duty to Meet Reporting Deadlines." These are the *same normative context* (departmental governance). Standing is lost.
  *   **Application to Case 4:** The Sister violates "Familial Duty of Care to Sibling." The Neighbor violates "Neighborly Duty of Care to Elder." While both fall under abstract "neglect," the role-obligations differ. Standing is intact.
  *   **Application to Case 7:** The Lab Head violates "Duty to Maintain Structural Integrity of Research Environment." The Postdoc violates "Duty to Report Data Accurately."
      *   *Verdict:* Under this rule, these are *different* norms. Clause A does not trigger. However, Clause B (Selective Enforcement/Structure) likely triggers (see below). This explains your "wobble": Clause A says intact, Clause B says lost. The wobble is the result of the two clauses pulling in opposite directions.

  ### 4. The Collective Case (Case 9)

  **Verdict:** The University lacks standing.
  **Reasoning:** Institutions require an **Institutional Addendum** to the principle. Individuals act through bodies; institutions act through structures.

  **The Structural Integrity Clause:**
  An institution lacks standing to enforce norm *N* if its operational structures systematically undermine the *value* underpinning *N*, even if no individual officer violates *N* directly.

  *   **Application to Case 9:** The norm being enforced is "Commitment to Honest Work/Community Integrity." The University's structure (poverty wages/exploitation) undermines the value of "Community Integrity" and treats labor as disposable. This renders the censure of the student arbitrary: the institution treats the *student's* violation as a breach of community, while its *own* structural violation treats the *adjuncts* as outside the community of mutual respect.
  *   **Individual vs. Institutional:** You need a separate clause because individual standing tracks *agency and choice*, while institutional standing tracks *policy and structure*. An institution can lack standing even if every committee member has clean hands (Case 9), because the defect is in the *system* they uphold, not their personal conduct. This supports your chapter's claim that institutional defects are not merely sums of individual defects.

  ### 5. Verdicts on New Cases

  1.  **The Recovering Addict (Relapsed last week):**
      *   **Verdict:** Standing Lost.
      *   **Reasoning:** Clause A (Contextual Hypocrisy). The norm is "Do not use." The context is "Recovery Community." The blamer is currently violating the same norm in the same context. The "recovering" status does not negate the *current* violation.
  2.  **The Motivated Reasoner (Believes she never did it):**
      *   **Verdict:** Standing Lost.
      *   **Reasoning:** Standing tracks *objective relationship to the norm*, not *subjective belief*. Case 3 established that the defect exists even if the addressee doesn't know (secret hypocrisy). If secret hypocrisy defeats standing, self-deceived hypocrisy must also defeat it. The arbitrariness lies in the fact of the violation, not the blamer's awareness of it.
  3.  **The Open Admitter ("I did it too, but you shouldn't"):**
      *   **Verdict:** Standing Intact (or transformed).
      *   **Reasoning:** By disclosing her violation, she removes the *pretence* of moral superiority that makes hypocrisy arbitrary. She is no longer exempting herself from the judgment; she is including herself in the condemnation. This changes the speech act from "Blame" to "Shared Confession/Warning." Clause A is neutralized because she is not claiming an exemption she doesn't hold.

  ### 6. Limitations and Costs

  No principle captures every intuition without cost. Here is where the **Non-Arbitrary Authority Condition** conflicts with your reported verdicts:

  *   **Case 7 (The Lab Head):** Your verdict is "wobbly." My principle forces a **Standing Lost** verdict via Clause B (Selective Enforcement/Structure).
      *   *The Cost:* If you want to preserve the intuition that she *might* have standing, you would have to argue that structuring incentives is not "enforcement."
      *   *The Counter:* Someone defending the "Lost" verdict would say: By creating incentives for manipulation, she made the norm optional for her lab. Enforcing it against the postdoc is shifting the cost of her structural choice onto him. That is the definition of arbitrary authority.
  *   **Case 9 (The University):** Your verdict is "back and forth." My principle forces a **Standing Lost** verdict via the Structural Integrity Clause.
      *   *The Cost:* This rules out the intuition that the plagiarism and the wages are "unrelated."
      *   *The Counter:* Someone defending the "Lost" verdict would say: They are related by the concept of *Community*. You cannot censure a member for betraying the community while the institution itself betrays the material conditions of that community. To do so is to use the norm as a weapon of discipline rather than a standard of shared value.
  *   **Case 3 (Secret Hypocrisy):** My principle aligns with your verdict (Defective), but it creates a tension with **Case 8** (Counterfactual).
      *   *The Tension:* In Case 8, you say counterfactual hypocrisy doesn't count. In Case 3, actual (secret) hypocrisy does.
      *   *The Explanation:* The principle relies on *actual* conduct (Clause A) or *actual* patterns (Clause B). Case 8 involves no actual violation and no actual selective pattern. Case 3 involves an actual violation. The principle holds firm here, but it requires you to maintain that *actual* secret violations degrade standing even if they can't be challenged. This commits you to the view that standing is an objective moral fact about the blamer, not a dialectical resource for the blamed.

  ### Summary for Your Chapter

  This framework allows you to argue that institutional blame is defective not because the individuals are hypocrites, but because the **institution's structure** can violate the **Structural Integrity Clause** independently of its officers. The University in Case 9 lacks standing not because the committee members are hypocrites, but because the *policy* of exploitation renders the *invocation* of community values arbitrary. This gives you the "extra machinery" you need: institutional standing is a function of structural consistency, not just aggregate individual purity.
