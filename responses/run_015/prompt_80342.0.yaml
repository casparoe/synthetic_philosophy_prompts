prompt: |-
  I'm a graduate student taking a seminar in Confucian ethics this semester, and two days a week I work as a peer mediator at a community center, where most of the cases I get are intergenerational family disputes — caregiving, inheritance, expectations about marriage and money. I handle them with a loose sense of "figure out what each person's role actually is and what that role calls for," but I have no stable method, and my sessions come out different.

  Could you write me a decision procedure I can actually run inside a fifty-minute session, grounded in the conceptual machinery of role ethics rather than in generic mediation advice? I want it to use the parts of the theory that are doing real work: the self as the hub of a web of roles rather than a free-floating agent; the rectification-of-names move (正名) — establishing what each party actually stands in relation to the other before anything else; the fact that the classical five relations carry different characteristic virtues and that the obligations are asymmetric, so that a parent's obligation to a child is not the mirror image of the child's obligation to the parent; and the fact that, on this view, conflicts between roles are adjudicated by the relational context rather than by a universal ranking of rules. For the modern cases I get, I read the ruler–subject relation as something like employer–employee. I want the procedure in the form of a series of questions to ask in a fixed order, with what counts as a sufficient answer at each step, the point at which the procedure has to stop and refer the case out of mediation because of safety or legal concerns, and the steps at which it has to stop and say "this is a value judgment, not a factual one, and it belongs to the parties, not to me." The questions should be phrased in plain language I can actually ask out loud, with the theoretical rationale attached to each step so I can see what's doing the work. Please mark which steps are genuine judgment calls dressed up as procedure, and tell me which distinctions from the theory must survive the translation into a usable procedure and which can be safely dropped, and why.

  The procedure has to handle two kinds of hard cases. First, genuine role conflicts: an adult daughter who is the primary caregiver for her ailing mother and whose marriage requires moving out of state; a son who discovers that his father, who runs the family business, has been misappropriating funds, and is pressured by the family to stay silent. Second, cases where a role is being invoked to justify the harm itself: a parent invoking filial piety to demand that an adult child keep funding a lifestyle that is destroying the child. I think role ethics is most at risk of misfiring in the second kind, so I want the procedure to say clearly what it can and cannot do there.

  Then run the procedure on two or three of these cases end to end. The written plan I produce at the end of a session has to be countersigned by my supervisor, so the procedure has to end in either a concrete recommendation or a referral — not a "both sides should think about it" — and at least one of the worked cases should come out in a way the family, and probably I too, won't like. Finally, say plainly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Graduate student in Confucian ethics, peer mediator at a community center.
      *   **Context:** Intergenerational family disputes (caregiving, inheritance, marriage, money).
      *   **Current Approach:** Loose sense of "figure out roles," but inconsistent.
      *   **Goal:** A concrete, 50-minute decision procedure grounded in *Confucian Role Ethics* (specifically Ames, Hall, Rosemont style, though implicitly drawing on classical texts like *Analects*, *Mencius*).
      *   **Key Theoretical Components to Include:**
          *   Self as a hub of roles (relational self).
          *   Rectification of Names (*Zhengming*): Establishing the relationship before the dispute.
          *   Asymmetric obligations (Five Relations/Wu Lun).
          *   Contextual adjudication (no universal rules).
          *   Modern mapping (Ruler-Subject $\rightarrow$ Employer-Employee, etc.).
      *   **Format:** Series of questions in fixed order, plain language, with theoretical rationale attached.
      *   **Constraints:**
          *   Must identify stopping points (safety/legal).
          *   Must identify value judgment boundaries (mediator vs. parties).
          *   Must distinguish genuine judgment calls vs. procedure.
          *   Must distinguish essential theoretical distinctions vs. safe drops.
          *   Must handle "Hard Cases": Genuine role conflicts (caregiving vs. marriage) and Role-as-Harm (filial piety used for exploitation).
          *   Must end in a concrete recommendation or referral (no vague "think about it").
          *   Must include 2-3 worked examples (one unpopular outcome).
          *   Must state limitations clearly.

  2.  **Deconstruct Confucian Role Ethics for Mediation:**

      *   *Core Idea:* Morality isn't about abstract rights; it's about performing roles well within specific relationships.
      *   *Zhengming (Rectification of Names):* If the names (roles) aren't right, the language/actions won't align. In mediation, this means agreeing on *who we are to each other* before deciding *what to do*.
      *   *Asymmetry:* Parent/Child is not equal. Parent benevolence (*Ren*), Child Filial Piety (*Xiao*). This prevents "tit-for-tat" bargaining.
      *   *Extension of Care:* Care starts close and extends outward. Family takes precedence, but not to the point of destroying the self (Mencius on Shun).
      *   *Role Conflict:* Resolved by looking at the *context* and the *long-term sustainability* of the relationships, not a hierarchy of rules.
      *   *Harm:* Confucianism isn't suicidal. If a role demand destroys the capacity to be moral in other roles, it must be modified (The concept of *Yi* - righteousness/appropriateness).

  3.  **Drafting the Procedure (The "Zhengming Protocol"):**

      *   *Time Management:* 50 minutes is tight. Needs 5 distinct phases.
      *   *Phase 1: Safety & Scope (The Stop-Gap).* Before ethics, ensure safety. Domestic violence or illegal acts stop the process.
      *   *Phase 2: Rectification of Names (The Anchor).* Define the relationship. Not "I want X," but "I am your Y."
      *   *Phase 3: Role Inventory (The Web).* Acknowledge other roles. The daughter is also a wife, employee, etc.
      *   *Phase 4: Obligation Mapping (The Asymmetry).* What does *this* role specifically require? (Benevolence vs. Filiality).
      *   *Phase 5: Adjudication & Commitment (The Decision).* Finding the *Yi* (appropriateness). Concrete plan.

  4.  **Refining the Questions (Plain Language + Rationale):**

      *   Need to sound like a mediator, not a philosophy professor.
      *   *Q1 (Safety):* "Is anyone in danger?" (Legal/Ethical floor).
      *   *Q2 (Zhengming):* "How do you name your relationship?" (Establishes the normative framework).
      *   *Q3 (Asymmetry):* "What does being a [Parent/Child] ask of you that the other doesn't have to give back?" (Prevents transactional thinking).
      *   *Q4 (Conflict):* "What other roles are pulling on you?" (Acknowledges the relational self).
      *   *Q5 (Harm Check):* "Does fulfilling this demand break your ability to be good in other roles?" (Prevents exploitation).
      *   *Q6 (Resolution):* "What action restores the relationship?" (Focus on harmony, not winning).

  5.  **Addressing the "Hard Cases":**

      *   *Case A (Caregiving vs. Marriage):* Genuine conflict. Needs balancing *Xiao* (filial piety) with *Fu/Fu* (Husband/Wife).
      *   *Case B (Father's Fraud):* Loyalty vs. Righteousness (*Yi*). Concealing crime is not Confucian virtue (Confucius on "straightness").
      *   *Case C (Exploitative Parent):* Role-as-Harm. Needs to distinguish *Xiao* from submission. *Yi* overrides blind obedience.

  6.  **Developing the Worked Examples:**

      *   *Example 1 (The Move):* Daughter wants to move; Mother needs care.
          *   *Outcome:* Compromise based on *extension of care*. Daughter moves but funds care; Mother accepts new form of filiality.
      *   *Example 2 (The Exploitative Demand):* Father demands money for gambling/debt, cites *Xiao*.
          *   *Outcome:* Refusal. *Yi* (Righteousness) dictates that enabling harm is not filial. This will be unpopular with the father.
      *   *Example 3 (The Fraud):* Son vs. Father regarding business funds.
          *   *Outcome:* Referral/Whistleblowing encouragement. Confucianism doesn't protect crime. "Straightness" involves correcting the father, not hiding the act.

  7.  **Critical Reflection on Theory vs. Practice:**

      *   *What survives:* Relational self, Asymmetry, *Zhengming*, *Yi* (Appropriateness).
      *   *What drops:* Ritual specifics (*Li* details), historical hierarchy (Emperor/Subject), metaphysical claims about Qi/Heaven.
      *   *Judgment Calls:* Determining "Harm," determining "Sustainability." The mediator facilitates, but the parties must own the *Yi*.
      *   *Limitations:* Cannot fix deep pathology, cannot override law, relies on parties caring about the relationship (if they don't, Role Ethics fails).

  8.  **Review against Constraints:**

      *   50-minute feasible? Yes, if strict.
      *   Concrete recommendation? Yes.
      *   Unpopular outcome? Yes (The Exploitative Parent case).
      *   Safety/Legal stops? Included in Phase 1.
      *   Value Judgment markers? Included.
      *   Theoretical rationale attached? Yes.

  9.  **Final Polish:**

      *   Tone: Professional, academic yet practical.
      *   Structure: Clear headings, bold text for questions.
      *   Ensure the distinction between "Role Ethics" and "Generic Mediation" is sharp (e.g., focusing on *obligations of the role* rather than *interests of the individual*).

  *(Self-Correction during drafting)*: I initially thought about mapping Ruler-Subject to Parent-Child in modern contexts, but the prompt says Ruler-Subject $\rightarrow$ Employer-Employee. I need to be careful not to conflate them. In family mediation, the core is Parent-Child and Husband-Wife. I will stick to the Five Relations relevant to family (Father-Son, Husband-Wife, Elder-Younger Brother) to keep it focused.
  *Correction on Case 2:* The prompt asks for a case the family won't like. The Exploitative Parent case is perfect for this. The father will feel betrayed; the mediator must hold the line that *Xiao* does not mean self-destruction.
  *Correction on Procedure:* Make sure the "Stop and Refer" points are explicit triggers, not vague feelings.

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  This is a **Confucian Role-Ethics Mediation Protocol (CREMP)**. It is designed for a 50-minute session. It prioritizes the *relational self* over the *autonomous individual* and *appropriateness (Yi)* over *universal rules*.

  ### Part 1: The Procedure

  **Time Allocation:**
  *   Phase 1 (Safety & Scope): 5 mins
  *   Phase 2 (Rectification of Names): 10 mins
  *   Phase 3 (Role Inventory & Asymmetry): 15 mins
  *   Phase 4 (Adjudication of *Yi*): 15 mins
  *   Phase 5 (Commitment & Closing): 5 mins

  ---

  #### Phase 1: Safety and Legal Floor (The Stop-Gap)
  *Theoretical Rationale:* Confucian ethics presupposes a community capable of flourishing. Violence or illegality destroys the ground for relational ethics. This phase is not Confucian; it is institutional/legal.
  *Mediator Stance:* Neutral enforcer of safety.

  **Question 1:** "Before we speak about roles, I need to ask: Is anyone in this room physically unsafe, or is there any active illegal activity (like theft or abuse) occurring right now?"
  *   **Sufficient Answer:** A clear "No."
  *   **Stop/Refer Trigger:** If "Yes" regarding physical safety or active crime. **End session.** Refer to legal services or domestic violence support. Role ethics cannot mediate coercion.
  *   **Judgment Call:** Determining "active illegal activity." If a past crime is revealed (e.g., tax fraud), see Phase 4.

  ---

  #### Phase 2: Rectification of Names (*Zhengming*)
  *Theoretical Rationale:* *Analects* 13.3: "If names are not correct, language is not in accordance with the truth of things." You cannot resolve a dispute about *actions* until you agree on the *relationship* that generates the obligations.
  *Mediator Stance:* Facilitator of definition.

  **Question 2:** "Put aside what you want for a moment. How do you name your relationship to the other person? Are you Father and Son? Elder Brother and Younger Sister?"
  *   **Sufficient Answer:** Both parties agree on the primary relational label (e.g., "We are Mother and Daughter").
  *   **Stop/Refer Trigger:** If one party refuses to acknowledge the relationship (e.g., "I am not your father anymore"), mediation cannot proceed on role ethics. Refer to individual counseling.
  *   **Judgment Call:** **MARKED.** If the relationship is estranged but legally intact, you must judge if the *role* still carries normative weight. *Decision:* If they are still financially or legally entangled, the role holds. If completely severed, refer out.

  ---

  #### Phase 3: Role Inventory and Asymmetry
  *Theoretical Rationale:* The self is a hub of roles. Obligations are asymmetric (Parent *Ren*/Benevolence $\neq$ Child *Xiao*/Filiality). This prevents transactional "tit-for-tat" bargaining.
  *Mediator Stance:* Investigator of obligations.

  **Question 3:** "In this specific relationship (e.g., Parent/Child), what does the role ask of *you* specifically that you do not expect back from them?"
  *   **Sufficient Answer:** Identification of asymmetric duty. (Parent: "I must provide guidance." Child: "I must show respect and care.")
  *   **Theoretical Work:** Breaks the "fairness" deadlock. The child does not owe the parent "equality"; the parent does not owe the child "obedience."

  **Question 4:** "You are not only a [Son/Daughter]. What other roles are pulling on you right now? (Spouse? Employee? Parent to your own children?)"
  *   **Sufficient Answer:** Listing of competing roles.
  *   **Theoretical Work:** Acknowledges the "webbed self." A conflict is often Role A vs. Role B within one person, projected as Person A vs. Person B.

  ---

  #### Phase 4: Adjudication of *Yi* (Appropriateness)
  *Theoretical Rationale:* There is no universal rule for conflicts. *Yi* is context-specific appropriateness. Crucially, *Xiao* (Filial Piety) is bounded by *Yi* (Righteousness). One cannot be filial by enabling harm or destroying one's capacity to be moral elsewhere.
  *Mediator Stance:* **MARKED JUDGMENT CALL.** You are guiding them toward *Yi*, but they must own the value.

  **Question 5 (The Harm Check):** "If you fulfill this specific demand, does it destroy your ability to be good in your other roles? (e.g., Does funding this debt prevent you from feeding your own children?)"
  *   **Sufficient Answer:** A factual assessment of capacity.
  *   **Stop/Refer Trigger:** If the demand requires self-destruction or moral compromise (e.g., committing a crime to help the parent). **End mediation on this point.** State: "Confucian ethics does not require you to destroy yourself to save another. This demand is not *Yi*."
  *   **Theoretical Work:** This handles the "Role-as-Harm" case. *Mencius* argues against blind obedience if it violates righteousness.

  **Question 6 (The Sustainability Check):** "What action allows you to continue this relationship five years from now? Not what wins today, but what keeps the bond alive?"
  *   **Sufficient Answer:** A concrete behavioral change.
  *   **Judgment Call:** **MARKED.** You must judge if a proposal is "sustainable" or just a delay tactic. *Decision:* If the proposal relies on resources the party does not have, reject it as not *Yi*.

  ---

  #### Phase 5: Commitment and Closing
  *Theoretical Rationale:* Ethics is performative. It exists in the doing (*Li*/Ritual). A plan unenacted is not ethical.
  *Mediator Stance:* Scribe of commitment.

  **Question 7:** "Based on what we've said about your roles, what is one specific thing you will do this week to honor that relationship?"
  *   **Sufficient Answer:** A concrete, verifiable action (e.g., "I will visit Sunday," not "I will try to be better").
  *   **Output:** A written plan countersigned by you.
  *   **Stop/Refer Trigger:** If they cannot agree on a concrete action, the *Zhengming* has failed. Refer to long-term therapy.

  ---

  ### Part 2: Theoretical Translation Notes

  **Distinctions That Must Survive:**
  1.  **Asymmetry:** You cannot let them bargain like equals. A parent's duty is *care*; a child's duty is *reverence/support*. If you treat them as equal stakeholders, you lose the Confucian leverage.
  2.  **Relational Self:** You must constantly redirect from "I want" to "As a [Role], I should."
  3.  **Yi over Rule:** You cannot apply a blanket rule (e.g., "Children must always obey"). You must judge the context.

  **Distinctions That Can Be Dropped:**
  1.  **Ritual Specifics (*Li*):** You do not need to enforce specific bows or tea ceremonies. The "ritual" is the mediation agreement itself.
  2.  **Metaphysics:** Drop claims about *Qi* or Ancestral Spirits. Keep it phenomenological (how the relationship feels and functions).
  3.  **Ruler-Subject:** In family mediation, this is largely irrelevant unless money/inheritance involves a family business (where it maps to Employer-Employee). Keep the focus on *Father-Son* and *Husband-Wife*.

  **Genuine Judgment Calls Dressed as Procedure:**
  *   **Phase 4, Question 5 (Harm Check):** Deciding what counts as "destroying the ability to be good" is a value judgment. You are deciding the boundary of *Xiao*.
  *   **Phase 4, Question 6 (Sustainability):** Deciding what counts as a "real" relationship vs. a toxic one is your call.

  ---

  ### Part 3: Worked Cases

  #### Case 1: The Caregiving Conflict (Genuine Role Conflict)
  **Parties:** Mei (Daughter, 45), Mrs. Lin (Mother, 75).
  **Issue:** Mrs. Lin needs daily care. Mei's husband got a job out of state. Mrs. Lin demands Mei stay. Mei wants to move.
  **Session Run:**
  1.  **Safety:** Clear.
  2.  **Zhengming:** Agreed: Mother and Daughter.
  3.  **Asymmetry:** Mother acknowledges role requires *Benevolence* (wishing daughter's flourishing). Daughter acknowledges role requires *Filiality* (care).
  4.  **Inventory:** Mei identifies roles: Daughter, Wife, Mother to her own teen.
  5.  **Adjudication (*Yi*):**
      *   *Q5 (Harm):* If Mei stays, her marriage fractures (violates Wife role). If she leaves without care, Mother is unsafe (violates Daughter role).
      *   *Mediator Judgment:* Moving is not "abandonment" if care is provided. *Xiao* is about the *outcome* of care, not necessarily physical proximity if proximity destroys other roles.
  6.  **Recommendation:** Mei moves. Mei commits to funding a professional caregiver for daily needs and video-calling daily. Mrs. Lin accepts the money and calls as the fulfillment of *Xiao*.
  **Outcome:** **Agreement.** Both sign. Mrs. Lin is unhappy about the distance but accepts the *Yi* of the arrangement.

  #### Case 2: The Exploitative Demand (Role-as-Harm)
  **Parties:** Mr. Chen (Father, 60), David (Son, 30).
  **Issue:** Mr. Chen has gambling debts. He demands David take a second mortgage on his own home to pay it, citing "Filial Piety." David refuses.
  **Session Run:**
  1.  **Safety:** Clear (financial harm, not physical).
  2.  **Zhengming:** Agreed: Father and Son.
  3.  **Asymmetry:** Father claims *Authority*. Son claims *Support*.
  4.  **Inventory:** David is Son, Husband, Father to a toddler.
  5.  **Adjudication (*Yi*):**
      *   *Q5 (Harm):* Taking the mortgage risks David's toddler's housing.
      *   *Mediator Judgment:* **STOP.** This is the "Role-as-Harm" trigger. *Analects* 13.18: Confucius values "straightness." Enabling a father's vice is not *Xiao*; it is harming the father's moral character and destroying the son's capacity to care for his own line.
      *   *Intervention:* "Mr. Chen, asking this violates your role of Benevolence toward your son's family. David, paying this violates your *Yi* regarding your own children."
  6.  **Recommendation:** **Refusal.** David will not pay the debt. David *will* pay for Mr. Chen's food and basic medical needs directly (vendors, not cash).
  **Outcome:** **Unpopular.** Mr. Chen feels betrayed ("You call this filial?"). David feels guilty. **I (Mediator) sign the plan.** The plan explicitly states: *No cash transfers for debt.* This is a value judgment that *Xiao* does not cover gambling debts.

  #### Case 3: The Family Business Fraud (Role vs. Law)
  **Parties:** Mr. Wu (Father/Boss), James (Son/Employee).
  **Issue:** James found Father misappropriating funds. Family wants silence. James is conflicted.
  **Session Run:**
  1.  **Safety:** **STOP.** Phase 1 Trigger.
  2.  **Assessment:** Misappropriation is a crime.
  3.  **Action:** **Refer Out.**
  4.  **Rationale:** Role ethics operates within a lawful community. A "Ruler" (Employer) who violates the law loses the mandate of the role.
  5.  **Mediator Note:** "I cannot mediate a cover-up. The 'Name' of Business Owner requires legal compliance. This is now a legal matter."
  **Outcome:** **Referral.** No agreement. James is referred to legal counsel.

  ---

  ### Part 4: What This Procedure Cannot Do

  1.  **It cannot fix broken love:** If the parties feel no *Ren* (Benevolence) for each other, role obligations feel like slavery. The procedure relies on a baseline desire to maintain the relationship.
  2.  **It cannot override Law:** As seen in Case 3, if the role demand is illegal, the procedure terminates. Confucianism is not a shield for crime.
  3.  **It cannot solve "Value Deadlocks":** If the Father genuinely believes *Xiao* means "Give me cash for gambling" and the Mediator believes *Yi* means "Do not," and the Father refuses to accept the Mediator's definition of *Yi*, the mediation fails. You cannot force someone to be Confucian.
  4.  **It is not Therapy:** It addresses *action* and *obligation*, not *trauma* or *psychological healing*. It tells you what to *do*, not how to *feel*.

  ### Supervisor Note for Countersignature
  *For Case 2 (The Exploitative Demand):*
  This recommendation restricts the Father's access to funds based on a normative judgment that *Filial Piety* does not extend to enabling vice. This aligns with the *Classic of Filial Piety* (Xiaojing), Chapter 15: "When the father is unrighteous, the son must contend with him." The mediator has adjudicated that the Father's demand violates the reciprocal obligation of Benevolence, releasing the Son from the obligation of financial compliance. **Approved.**
