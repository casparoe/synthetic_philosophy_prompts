prompt: |-
  You are a professional philosopher with long experience teaching upper-level metaethics, and you have been asked to write one question for a final exam. Please think carefully about the dialectic before you draft anything: in particular, spend a little time working out what the genuine crux is — the one move that separates a candidate who understands the structure of evolutionary debunking arguments from a candidate who has merely memorized the labels (tracking vs. independence, third-factor, companions in guilt) and can recite the standard back-and-forth. Drafting a question that can be answered by summarizing that back-and-forth would be a failure; the question should force a decision about which premise has to go.

  The setting: a third-year seminar in metaethics. The exam is open-book, 90 minutes per question, and answers are capped at 1,200 words. The question is worth 20 marks. It must be fully self-contained: a candidate should be able to answer it well without consulting any reading, and the answer should not consist in reporting what some author said. (You may refer to argument-types by their familiar names, but nothing in the question should turn on attributing a thesis to a particular paper, or on recalling a title, date, or passage.)

  To make the question non-recitable, build it around a stipulated case that candidates will not have seen. I have in mind something along these lines, which you should refine or replace as you see fit so that it does real work: a community whose moral judgments were produced in the first instance exactly as the debunker says — by selective pressures that rewarded fitness-conducive social responses and were indifferent to moral truth — and which then institutes a purely internal practice of filtering: recording occurrent moral judgments, discarding any that contradict other judgments the community is unwilling to surrender or that flip when the same case is redescribed, generalizing the survivors into principles, and using those principles to revise further judgments, over many generations. The filter never consults the world and contains no premise about what the moral facts are. The survivors are perfectly coherent, framing-stable, and systematic. The candidate should then be asked whether membership in that surviving set gives anyone a reason to think the judgments true, or any reason a debunker must take seriously — pressed to distinguish the two importantly different forms a debunking argument can take (the form that says our judgments were shaped by pressures with no tendency to track moral truth, and the form that says moral facts play no role in the best explanation of why we hold the judgments we do), since the filter looks relevant to one of them and inert, or worse than inert, against the other. A second part should then take the debunker's most natural retreat — restricting the claim to unreflective, affect-driven judgments and exempting the outputs of careful reasoning — and ask what the debunker would have to establish for that restriction to be non-arbitrary, and whether the restriction survives the observation that the capacity for practical reasoning is itself a product of the same selective history and operates on materials supplied by the very judgments under suspicion. The question should close by requiring a verdict: name the single premise you would give up if you had to make your position consistent, and say what giving it up costs you in first-order ethics.

  Please deliver three things.

  1. The question exactly as it would appear on the paper, including the full statement of the stipulated case and any brief instructions to candidates (word cap, what to do, what not to do).

  2. A model answer of roughly 800 words. It should be written at the standard you would expect from a strong student in the time allowed — not a survey, but an argument that reaches the crux and commits itself.

  3. A marking scheme built around five must-hit points worth four marks each (total 20). For each point, state the specific move a candidate must make to earn the marks and add a one-line note on how candidates typically get that point wrong — for example, by treating coherence as though it were obviously truth-conducive, by confusing an undercutting argument with an argument for the falsity of moral claims, by declaring the global version self-refuting and stopping there, or by treating cross-cultural convergence as though it discriminated between tracking and shared shaping. Finish with a short calibration note saying what distinguishes an A answer from a B answer at the margin.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher, experienced teacher of upper-level metaethics.
      *   **Task:** Write one final exam question (plus model answer and marking scheme) for a third-year seminar.
      *   **Constraints:**
          *   Open-book, 90 minutes, 1,200 word cap.
          *   Worth 20 marks.
          *   Fully self-contained (no specific author attribution required, though argument types can be named).
          *   **Crucial:** Must force a decision about which premise has to go. Cannot be answered by summarizing standard back-and-forth (tracking vs. independence, third-factor, etc.). Must distinguish between two forms of debunking arguments (genealogical vs. explanatory).
          *   **Case Study:** A stipulated case involving a community with evolved moral judgments filtered by internal coherence/stability practices (no external input).
          *   **Structure:**
              1.  The Question (with case study and instructions).
              2.  Model Answer (~800 words, argumentative, committed).
              3.  Marking Scheme (5 points x 4 marks, with common errors).
      *   **Goal:** Test genuine understanding of the dialectic, specifically the crux of evolutionary debunking arguments (EDAs), not just memorization.

  2.  **Deconstruct the Philosophical Crux:**
      *   **EDA Type 1 (Genealogical/Undercutting):** Our judgments are caused by evolutionary pressures indifferent to moral truth. Therefore, we lack justification (even if true). This targets *epistemic status*.
      *   **EDA Type 2 (Explanatory/Independence):** Moral facts play no role in the best explanation of our judgments. Therefore, the correlation between judgment and fact is accidental. This targets *truth-tracking*.
      *   **The Stipulated Case:** A community evolves judgments via fitness (indifferent to truth). Then they apply an *internal* filter (coherence, framing stability, systematicity). No external input.
      *   **The Problem:** Does internal coherence rescue justification?
          *   Against Type 1 (Undercutting): Coherence might restore *internal* rationality, but does it restore *external* warrant if the input is tainted? (Reliabilist vs. Internalist).
          *   Against Type 2 (Explanatory): If the filter is purely internal and the origin is non-truth-tracking, coherence doesn't establish a link to truth. It just makes the error systematic.
      *   **The Debunker's Retreat:** Restrict EDA to unreflective judgments, exempt reflective reasoning.
      *   **The Counter:** Reflective reasoning capacities and inputs are also evolved. Is the exemption arbitrary?
      *   **The Verdict:** Must choose a premise to drop and state the cost to first-order ethics.

  3.  **Drafting the Question:**
      *   Need to present the case clearly.
      *   Need to define the two forms of debunking clearly enough for the student to distinguish them without needing external texts.
      *   Need to structure the prompts to force the analysis of the filter's efficacy against each form.
      *   Need to force the "verdict" at the end.
      *   *Refinement:* Ensure the distinction between "shaped by pressures indifferent to truth" (Undercutting) and "facts play no explanatory role" (Explanatory) is clear in the prompt so the student knows what to address.
      *   *Refinement:* Make sure the "filter" is described as purely internal (no checking against reality) to block simple realist replies.

  4.  **Drafting the Model Answer:**
      *   Must be ~800 words.
      *   Must take a stance (not just "on the one hand, on the other").
      *   Must address the case study directly.
      *   Must distinguish the two EDA forms.
      *   Must address the "reflective reasoning" retreat.
      *   Must give the verdict (which premise to drop) and the cost.
      *   *Strategy:* I will argue that the filter fails against the Explanatory argument but might help against the Undercutting argument, but ultimately the Explanatory argument is the stronger threat. I will choose to drop the premise that "moral facts are explanatorily inert" (adopting a Third-Factor or Robust Realist view) or drop the premise that "evolutionary explanation excludes moral truth" (Naturalist). Let's go with dropping the Independence Premise (adopting a Third-Factor view) as it's a common sophisticated move, OR argue that the Coherence filter is insufficient so we must accept Skepticism or drop Realism.
      *   *Better Strategy for a "Strong Student":* Acknowledge the filter creates *reflective equilibrium* but argue that without an external anchor, it's just systematic error (addressing Explanatory EDA). Then address the retreat (reasoning is also evolved). Finally, make a choice: Drop the claim that evolutionary explanations *exclude* moral facts (Third-Factor/Pre-established Harmony) to save realism, costing us the simplicity of naturalism. Or, drop Realism. Let's aim for a nuanced Realist defense that modifies the explanatory premise.
      *   *Actually, the prompt asks to "name the single premise you would give up... and say what giving it up costs you."* I should model a clear decision. I'll model dropping the premise that "evolutionary explanations render moral facts explanatorily redundant." I'll argue for a Third-Factor view. This shows understanding of the dialectic.

  5.  **Drafting the Marking Scheme:**
      *   5 points x 4 marks.
      *   Point 1: Distinguishing the two EDA forms (Undercutting vs. Explanatory).
      *   Point 2: Analyzing the Filter against the Undercutting form (Internal justification vs. External warrant).
      *   Point 3: Analyzing the Filter against the Explanatory form (Coherence vs. Truth-connection).
      *   Point 4: Evaluating the "Reflective Retreat" (Is reasoning independent of evolution?).
      *   Point 5: The Verdict (Premise dropped + Cost to first-order ethics).
      *   Need specific "common errors" for each.

  6.  **Review and Refine:**
      *   *Check Word Counts:* Question needs to be concise but detailed. Model answer needs to be tight.
      *   *Check Tone:* Professional, academic.
      *   *Check Constraints:* No specific author names required in the question. Model answer shouldn't just list authors.
      *   *Check the "Crux":* Does the question force the student to see that coherence doesn't solve the explanatory gap? Yes. Does it force them to see that exempting reasoning is hard? Yes.
      *   *Self-Correction on Model Answer:* Ensure it doesn't exceed 1,200 words (cap is for students, model should be within reason, prompt says ~800). Ensure it commits.
      *   *Self-Correction on Marking Scheme:* Ensure the "common errors" are specific to the philosophical traps identified in the prompt instructions (e.g., treating coherence as truth-conducive).

  7.  **Final Polish:**
      *   Make sure the case study description is vivid enough to prevent generic answers.
      *   Ensure the distinction between the two debunking forms is embedded in the question text so students don't have to guess what "the two forms" are.
      *   Verify the marking scheme aligns with the question parts.

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally require knowledge of specific papers (Street, Joyce, etc.) even though I can use argument names. The prompt says "nothing in the question should turn on attributing a thesis to a particular paper." I will adhere to this strictly.

  *(Refining the Case)*: The case needs to be clear that the filter is *purely* internal. "Discarding any that contradict other judgments... generalizing... revising." No "checking against the world." This is key for the Explanatory argument critique.

  *(Refining the Verdict)*: The student must name a premise. I need to make sure the marking scheme rewards identifying a specific premise of the EDA (e.g., The Independence Premise, The Causal Premise, The Epistemic Premise) rather than just saying "I reject debunking."

  Let's assemble.

  *   **Question:** Clear header. Case description. Three parts (Filter analysis, Retreat analysis, Verdict). Constraints.
  *   **Model Answer:** Introduction (Thesis). Part 1 (Two forms). Part 2 (Filter efficacy). Part 3 (Retreat). Part 4 (Verdict/Cost).
  *   **Marking Scheme:** 5 criteria. Common errors. Calibration note.

  *Wait, one detail:* The prompt asks me to "spend a little time working out what the genuine crux is." I should ensure the Model Answer reflects this crux. The crux is that coherence fixes *internal* rationality (addressing Undercutting) but not *truth-connection* (addressing Explanatory). The retreat fails because reasoning is evolved. The verdict must show the cost.

  Okay, ready to write.cw
answer: |-
  ### 1. The Exam Question

  **Metaethics Final Examination**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Marks:** 20

  **Question 1: The Coherence Filter**

  Consider a community, *Evoluta*, whose moral judgments originated exactly as evolutionary debunkers describe: selective pressures rewarded fitness-conducive social responses (e.g., kin altruism, reciprocity) and were completely indifferent to moral truth. However, unlike us, *Evoluta* subsequently instituted a strict, purely internal practice of filtering. Over many generations, they recorded occurrent moral judgments, discarded any that contradicted other judgments the community was unwilling to surrender, rejected any that flipped when the same case was redescribed, and generalized the survivors into principles to revise further judgments. This filter never consults the world and contains no premise about what the moral facts are. The surviving judgments are perfectly coherent, framing-stable, and systematic.

  Answer the following three parts:

  1.  Distinguish the two primary forms of evolutionary debunking arguments: (A) the **Genealogical Undercutting** form (judgments are caused by pressures indifferent to truth, defeating justification) and (B) the **Explanatory Independence** form (moral facts play no role in the best explanation of our judgments, implying no truth-tracking). Analyze whether *Evoluta*'s coherence filter rescues their judgments from form (A), form (B), or both. Explain why the filter looks relevant to one but inert against the other.
  2.  A debunker might retreat by restricting their claim to unreflective, affect-driven judgments, exempting the outputs of *Evoluta*'s careful reasoning. What would the debunker have to establish for this restriction to be non-arbitrary? Does this restriction survive the observation that the capacity for practical reasoning is itself a product of the same selective history and operates on materials supplied by the very judgments under suspicion?
  3.  **Verdict:** To maintain a consistent metaethical position, name the single premise of the debunking argument you would give up. Explain precisely what giving up this premise costs you in first-order ethics (e.g., regarding the nature of moral facts, the scope of moral knowledge, or the relationship between science and morality).

  *Instructions: Do not cite specific authors or texts. Argue in your own voice. Ensure your verdict in Part 3 follows logically from your analysis in Parts 1 and 2.*

  ***

  ### 2. Model Answer

  The case of *Evoluta* isolates the structural weakness of evolutionary debunking arguments (EDAs) by removing external input. To evaluate whether their coherence filter saves moral realism, we must distinguish the two forms of debunking. Form (A), Genealogical Undercutting, claims that because the causal history of our judgments is insensitive to moral truth, we lack epistemic justification. Form (B), Explanatory Independence, claims that because moral facts do not explain why we hold our judgments, any correlation between judgment and fact is accidental.

  *Evoluta*'s filter addresses Form (A) but fails against Form (B). Regarding Form (A), the filter restores a kind of internal rationality. If justification requires reflective equilibrium rather than direct causal tracking, then *Evoluta*’s systematic weeding out of contradictions and framing effects provides a defeater for the claim that their judgments are merely blind impulses. They have subjected their inputs to rational scrutiny. However, this is inert against Form (B). The Explanatory argument does not deny that agents can reason coherently; it denies that coherence connects them to truth. If the initial inputs were shaped solely by fitness, and the filter operates only on relations between those inputs (without checking against the world), the output is merely systematic error. Coherence ensures consistency, not accuracy. A paranoid delusion can be perfectly coherent. Therefore, the filter rescues the *rationality* of the believer (addressing Undercutting) but not the *truth-conduciveness* of the process (addressing Independence).

  This leads to the debunker's retreat: restricting the argument to unreflective judgments while exempting careful reasoning. For this to be non-arbitrary, the debunker must establish that practical reasoning operates independently of the evolutionary forces that shaped the raw materials. They must show that the logical capacities used to filter judgments are truth-tracking in a way that the affective inputs are not. However, this restriction collapses under the observation that the capacity for practical reasoning is itself a product of the same selective history. If evolution shaped the brain to survive, it shaped the reasoning faculties too. There is no "view from nowhere" where reason operates free of evolutionary constraints. Furthermore, reasoning operates on materials supplied by the suspected judgments. If the axioms of the system are fitness-driven, valid deduction only preserves the error. To exempt reasoning is to assume what the debunker denies: that we have a cognitive faculty capable of grasping moral truth independent of fitness pressures.

  Given this dialectic, I must make a verdict to maintain consistency. I reject the **Explanatory Independence Premise**. I argue that moral facts *do* play a role in the best explanation of our judgments, but not as direct causal agents. Instead, I adopt a "third-factor" view: evolutionary pressures selected for traits (like valuing offspring survival) because those traits were adaptive, and these traits are morally good not because evolution made them good, but because there is an independent moral fact that valuing offspring survival is good. Evolution tracked the truth indirectly by tracking fitness, which correlates with moral value.

  Giving up the Independence Premise costs me theoretical simplicity. I cannot be a reductionist naturalist who claims moral facts are *identical* to fitness facts, because *Evoluta* shows coherence can exist without truth. I must posit moral facts as distinct entities that constrain which evolutionary outcomes count as knowledge. This costs me the parsimony of a purely scientific worldview. I am committed to the claim that the universe contains normative truths that are discoverable by reason, even if science explains why we were predisposed to find them. I sacrifice the clean separation between "is" and "ought" to save the objectivity of the "ought." If I retained the Independence Premise, I would be forced into skepticism or anti-realism, accepting that *Evoluta*'s coherent system is no more true than a coherent fiction. To avoid this, I must accept that moral facts are real enough to constrain our evolutionary history, even if they do not cause it physically.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Points × 4 Marks)**

  **1. Distinction of EDA Forms (4 Marks)**
  *   **Required Move:** Clearly distinguish Form (A) as targeting *epistemic justification/warrant* (causal history) and Form (B) as targeting *truth-tracking/explanation* (correlation accidentality).
  *   **Common Error:** Treating both forms as identical claims about "origins" or confusing the Undercutting argument with an argument for the *falsity* of moral claims (rather than the lack of justification).

  **2. Analysis of the Filter vs. Form (A) (4 Marks)**
  *   **Required Move:** Argue that the filter *does* mitigate Form (A) by restoring internal rationality/reflective equilibrium, showing that agents are not merely passive vessels of evolutionary impulse.
  *   **Common Error:** Dismissing the filter entirely as useless against any debunking, failing to see that coherence addresses the "blind impulse" objection inherent in Undercutting.

  **3. Analysis of the Filter vs. Form (B) (4 Marks)**
  *   **Required Move:** Argue that the filter is *inert* against Form (B) because internal coherence does not establish an external link to truth (systematic error possibility).
  *   **Common Error:** Treating coherence as though it were obviously truth-conducive, or arguing that framing stability proves the judgments match reality without explaining *how* stability links to truth.

  **4. Evaluation of the "Reflective Retreat" (4 Marks)**
  *   **Required Move:** Identify that exempting reasoning is arbitrary unless reasoning is shown to be independent of evolution; acknowledge that reasoning capacities and inputs are also evolved products.
  *   **Common Error:** Accepting the retreat too easily (assuming reason is pure) or dismissing it too quickly without explaining *why* the capacity for reasoning itself is subject to the debunking premise.

  **5. The Verdict and Cost (4 Marks)**
  *   **Required Move:** Name a specific premise to drop (e.g., Independence, Causal Insensitivity) and articulate a specific cost to first-order ethics or metaphysics (e.g., loss of naturalism, commitment to non-natural facts).
  *   **Common Error:** Giving a vague verdict ("I reject debunking") without naming the premise, or stating a cost that doesn't follow (e.g., "It costs me nothing"), or treating cross-cultural convergence as though it discriminated between tracking and shared shaping.

  **Calibration Note:**
  *   **A Answer (17-20):** Successfully isolates the crux: coherence solves the *internal* rationality problem but not the *external* truth-connection problem. The verdict identifies a specific metaphysical cost (e.g., loss of parsimony) rather than a generic "it's hard."
  *   **B Answer (13-16):** Correctly distinguishes the arguments and analyzes the case but hedges on the verdict or fails to clearly articulate the *cost* of the chosen premise drop. May treat the filter as slightly more effective against Form (B) than warranted.
