      *   *Section 2: Fodor vs. Predictive Processing.*
          *   Fodor said "No penetration."
          *   Predictive Processing says "Everything is inference."
          *   *Crucial nuance:* Even if PP is true, it doesn't mean *any* belief changes *any* sight instantly. It means perception is probabilistic.
      *   *Section 3: Synchronic vs. Calibration.*
