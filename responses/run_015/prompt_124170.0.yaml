  7.  **Final Polish:** (Mental check of the "Calibration" term). In philosophy of perception, "calibration" isn't the standard term. "Perceptual Learning" is. The psychologist might be using "calibration" colloquially. I should note that. *Correction:* Actually, some recent literature uses "calibration" regarding priors in predictive coding. I'll treat it as "Perceptual Learning" to be safe with the broader literature.

