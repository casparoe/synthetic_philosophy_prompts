answer: |-
  # Lesson Plan: The Tracking Audit
  **Course:** Upper-Level Epistemology Seminar  
  **Topic:** The Tracking Account (Nozick), Closure Failure, Sensitivity vs. Safety  
  **Time:** 80 Minutes  
  **Students:** 16 (Divided into 4 Teams of 4)  

  ## 1. Learning Objectives
  By the end of this session, students will:
  1.  Apply the subjunctive tracking conditions (Sensitivity/Adherence) to specific cases.
  2.  Experience the failure of Closure under the Tracking Account organically (Round 1).
  3.  Experience the "Skeptical/Mundane" failure where Sensitivity denies obvious knowledge (Round 2).
  4.  Identify "Nearness of the $\neg p$ World" as the variable driving both verdicts.
  5.  Evaluate the trade-off between Sensitivity (Tracking) and Safety without instructor resolution.

  ## 2. Materials & Setup
  *   **Room:** 4 tables arranged in a square or cluster.
  *   **Currency:** 100 Poker Chips (or paper tokens). 25 per team to start.
  *   **Handouts (per team):**
      *   4x **Tracking Audit Sheets** (See Appendix A).
      *   1x **World Brief: Round 1** (The Zoo).
      *   1x **World Brief: Round 2** (The Server).
  *   **Instructor:** Master Key (See Appendix B), Whiteboard.

  ## 3. Rules of the Game
  1.  **Role:** You are Epistemic Auditors. Your job is not to decide what you *feel* you know, but to apply the **Tracking Standard** strictly.
  2.  **The Standard:** You Know $p$ iff:
      *   (Truth) $p$ is true.
      *   (Belief) You believe $p$.
      *   (Adherence) If $p$ were true, you would believe $p$.
      *   (Sensitivity) If $p$ were false, you would **not** believe $p$.
  3.  **The Cost:**
      *   You start with 25 chips.
      *   For each Proposition ($p$ or $q$), you must wager 5 chips on whether the Standard declares "KNOWS" or "DOES NOT KNOW."
      *   If your verdict matches the Master Key, you keep your wager + win 2 bonus chips.
      *   If your verdict mismatches, you lose the wager.
      *   *Goal:* Maximize chips by correctly applying the Standard, even if it contradicts your intuition.

  ## 4. Minute-by-Minute Timeline

  ### 00:00 – 00:05 | Introduction & Setup
  *   Divide class into 4 teams. Distribute chips (25 each) and Round 1 materials.
  *   **Script:** "You know the Tracking Account. Today, you are auditors. You don't get to use your gut. You get to use the Subjunctive Conditions. If the conditions say you don't know, you don't know. Your goal is to predict the verdict of the Theory, not the verdict of reality."

  ### 00:05 – 00:30 | Round 1: The Deduction Trap (Closure Failure)
  *   **Scenario:** The Zoo.
  *   **Step 1 (Evidence):** Teams read World Brief 1. They are looking at an animal in a pen labeled 'Zebra'. It looks like a zebra.
  *   **Step 2 (Proposition $p$):** Teams write $p$: "The animal is a Zebra."
  *   **Step 3 (Proposition $q$):** Teams must derive a consequence. Prompt: "Write a statement $q$ that *must* be true if $p$ is true." (Target: "The animal is not a Mule painted to look like a Zebra").
  *   **Step 4 (The Audit):** Teams fill out the Tracking Sheet for $p$ and $q$. They must explicitly fill in the counterfactual blanks: *"In the nearest world where $p$ is false..."*
  *   **Step 5 (The Wager):** Teams wager 5 chips on "KNOWS" for $p$ and 5 chips on "KNOWS" for $q$.
  *   **Step 6 (Reveal):** Instructor reveals Master Key.
      *   $p$: **KNOWS** (Sensitivity Met: Nearest $\neg p$ is a Horse, you'd see it).
      *   $q$: **NO KNOW** (Sensitivity Failed: Nearest $\neg q$ is a Painted Mule, you'd still believe $q$).
  *   **Outcome:** Teams who followed their gut (wagering "Know" on $q$) lose chips. Teams who followed the Theory keep chips but feel the tension.

  ### 00:30 – 00:55 | Round 2: The Mundane Trap (Sensitivity Failure)
  *   **Scenario:** The Server.
  *   **Step 1 (Evidence):** Distribute World Brief 2. You check a server log on your screen. It reads "Status: Secure."
  *   **Step 2 (Proposition $p$):** "The server status is Secure."
  *   **Step 3 (The Audit):** Teams fill the Tracking Sheet.
  *   **Crucial Detail:** The Brief stipulates the nearest $\neg p$ world is a "Display Glitch" where the screen reads "Secure" even when "Compromised."
  *   **Step 4 (The Wager):** Teams wager 5 chips on "KNOWS" for $p$.
  *   **Step 5 (Reveal):** Instructor reveals Master Key.
      *   $p$: **NO KNOW** (Sensitivity Failed: If it were Compromised ($\neg p$), the Glitch would make you believe it's Secure ($Bp$)).
  *   **Outcome:** Teams lose chips if they wagered "Know." Their gut screams they know the server status; the Rule says they don't.

  ### 00:55 – 01:15 | Debrief & Mapping
  *   **Board Work:** Draw two columns: **Round 1 (Zebra)** and **Round 2 (Server)**.
  *   **Question 1:** "In Round 1, why did $p$ pass but $q$ fail? You deduced $q$ from $p$."
      *   *Target Answer:* The "Nearest $\neg p$ world" for $p$ was far/obvious (Horse). The "Nearest $\neg q$ world" for $q$ was close/deceptive (Painted Mule).
  *   **Question 2:** "In Round 2, why did $p$ fail? It was a simple screen read."
      *   *Target Answer:* The "Nearest $\neg p$ world" was a Glitch (very close).
  *   **Synthesis:** "The Theory's verdict isn't about logic (deduction) or evidence (screens). It is entirely about the **distance and nature of the nearest world where you are wrong.**"
  *   **The Repair Choice:**
      *   Write on board:
          *   **Option A (Keep Tracking):** Keep Sensitivity ($\neg p \to \neg Bp$). Accept that Deduction fails (Round 1) and Mundane Knowledge is fragile (Round 2).
          *   **Option B (Switch to Safety):** Require Safety ($Bp \to p$ in *nearby* worlds). Drop Sensitivity.
      *   **Vote:** "If we play Round 3, which rule do you adopt to save your chips?"
      *   *Note:* Do not resolve which is correct. Highlight that Option B saves Closure but changes the definition of knowledge.

  ### 01:15 – 01:20 | Closing
  *   Collect sheets.
  *   **Exit Ticket:** "One sentence: Why does the 'nearest not-p world' determine whether deduction preserves knowledge?"

  ---

  ## Appendix A: Tracking Audit Sheet
  **Team:** _______________  
  **Proposition:** _______________  

  | Condition | Check (Yes/No) | Notes (Describe the nearest world) |
  | :--- | :--- | :--- |
  | **1. Truth** | | Is $p$ true in Actual World? |
  | **2. Belief** | | Do you believe $p$ in Actual World? |
  | **3. Adherence** | | If $p$ were true, would you believe it? |
  | **4. Sensitivity** | | **If $p$ were FALSE, would you believe it?** |
  | **VERDICT** | **KNOWS / NO KNOW** | |

  **Wager:** I bet 5 chips that the Verdict is: _______________

  ---

  ## Appendix B: Instructor Master Key

  **Round 1: The Zoo**
  *   **Actual World:** Animal is a Zebra. Pen labeled 'Zebra'. Visual inspection normal.
  *   **Proposition $p$:** "The animal is a Zebra."
      *   Nearest $\neg p$: Animal is a Horse (in the next pen).
      *   Sensitivity Check: If it were a Horse, would you believe it's a Zebra? **No.** (You can tell horses from zebras).
      *   **Verdict:** KNOWS.
  *   **Proposition $q$:** "The animal is not a Mule painted to look like a Zebra."
      *   Nearest $\neg q$: Animal is a Painted Mule (in this pen).
      *   Sensitivity Check: If it were a Painted Mule, would you believe it's *not* a Painted Mule? **Yes.** (It looks identical).
      *   **Verdict:** NO KNOW.
  *   **Closure Status:** Failed. ($Kp$, $p \to q$, $\neg Kq$).

  **Round 2: The Server**
  *   **Actual World:** Screen reads "Secure". Server is Secure.
  *   **Proposition $p$:** "The server is Secure."
      *   Nearest $\neg p$: Server is Compromised, but a Display Glitch shows "Secure".
      *   Sensitivity Check: If it were Compromised, would you believe it's Secure? **Yes.** (The glitch hides it).
      *   **Verdict:** NO KNOW.

  ---

  ## Pre-Mortem: What Will Go Wrong
  1.  **"The Skeptical World Isn't Close":**
      *   *Risk:* A student argues, "A painted mule isn't the *nearest* possible world. A horse is closer."
      *   *Fix:* The **World Brief** must stipulate closeness. "For the purposes of this audit, the Painted Mule scenario is the *nearest* world where $q$ is false." Remind them they are auditors applying a stipulated model, not metaphysicians debating similarity metrics *right now*.
  2.  **"I Derived It, So I Know It":**
      *   *Risk:* Students refuse to mark "NO KNOW" on $q$ in Round 1 because deduction is valid.
      *   *Fix:* Enforce the **Wager Rule**. "You lose 5 chips if your sheet doesn't match the Master Key. Do you want the chips or the intuition?" This forces them to simulate the theory's consequences even if they reject them philosophically.
  3.  **Cheating/Peeking:**
      *   *Risk:* Teams peek at the Master Key or other teams' sheets.
      *   *Fix:* Collect Audit Sheets *before* revealing the Key. Make the Key reveal dramatic (projected or read aloud).
  4.  **Confusing Adherence and Sensitivity:**
      *   *Risk:* Students mix up "If $p$ then $Bp$" and "If $\neg p$ then $\neg Bp$".
      *   *Fix:* The Audit Sheet labels them clearly. Circulate during the 25-minute work period to correct Sheet entries early.

  ## Limitations: What The Game Can't Stage
  *   **Normative Force:** The game treats Knowledge as a binary payout (chips). It cannot capture *why* we care about knowledge (value problem). You must mention this in the debrief.
  *   **Contextualism:** The game fixes the "Nearest World" by stipulation. In real life, context shifts which worlds are near. You will need to say: "In the game, I told you which world was nearest. In reality, *you* have to decide, and that's where the context sensitivity comes in."
  *   **The "Why":** The game shows *that* Closure fails, not *why* Nozick thought this was a feature, not a bug (i.e., blocking skepticism). You must add: "Nozick accepted this cost to avoid saying we know we're not Brains in Vats. Is that a price you're willing to pay?"

  ## Instructor Note on the "Repair" Choice
  When presenting the choice in the Debrief (Option A vs. Option B):
  *   **Option A (Sensitivity):** Preserves the intuition that we don't know skeptical hypotheses are false, but breaks logic (Closure).
  *   **Option B (Safety):** Preserves logic (Closure) and mundane knowledge (Round 2), but forces us to admit we *don't* know we're not Brains in Vats (because in the nearest BIV world, we still believe we aren't).
  *   **Do not solve this.** End the class with the tension: "Next time, we see how different theorists try to fix the machine you just broke."
