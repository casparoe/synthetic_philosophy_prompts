answer: |-
  # Activity Title: The Synkrisis Engine: Stability vs. Process in Moral Biography

  ## 1. Learning Objective
  To experientially demonstrate the tension between Plutarch's method of revealing stable character through paired comparison (*synkrisis*) and the modern critique that such "hagiographic compression" erases the temporal struggle required for genuine moral development.

  ## 2. Class Configuration & Materials
  *   **Participants:** 14 Students.
  *   **Grouping:** 4 "Scriptoriums" (Working Groups).
      *   **Scriptorium A:** 4 Students.
      *   **Scriptorium B:** 4 Students.
      *   **Scriptorium C:** 3 Students.
      *   **Scriptorium D:** 3 Students.
  *   **Pairing for Comparison:** Scriptorium A compares with B; Scriptorium C compares with D.
  *   **Materials per Scriptorium:**
      *   1 Deck of **Event Cards** (e.g., "Early Poverty," "Military Victory," "Betrayal by Friend," "Public Scandal," "Old Age").
      *   1 Deck of **Virtue Cards** (e.g., "Courage," "Temperance," "Justice," "Wisdom").
      *   1 Deck of **Complication Cards** (Round 2 only: e.g., "Relapse," "Ambiguous Motive," "Time Lag," "Unresolved Guilt").
      *   4 Role Cards (Biographer, Moral Learner, Internal Critic, Parallel Comparator). *Note: In 3-student groups, the Parallel Comparator also assumes the Internal Critic role.*
      *   Score Sheet and 20 Paper "Drachmas" (tokens).
  *   **Assigned Figures:** Each Pair of Scriptoriums (A/B and C/D) is assigned one Archetype (e.g., "The Reformer" or "The General"). They are building parallel lives of the *same* archetype, not the same specific person, to allow for divergence.

  ## 3. Roles (Rotating by Round)
  1.  **Biographer:** Arranges Event Cards into a narrative sequence. Writes the summary.
  2.  **Moral Learner:** Selects Virtue Cards to attach to events. Defines the "Lesson."
  3.  **Internal Critic:** Audits the narrative for contradictions or flattening.
  4.  **Parallel Comparator:** Prepares arguments for how this life compares to the partner Scriptorium's life.

  ## 4. Scoring System (The "Drachma" Economy)
  *   **Round 1 (Plutarchan Mode):**
      *   +1 Drachma for every Event Card linked directly to a Virtue Card.
      *   +2 Drachmas for Narrative Coherence (no loose ends).
      *   +3 Drachmas if the Life clearly mirrors the Partner Scriptorium's Life (facilitates comparison).
      *   *Penalty:* -1 Drachma for every "Ambiguity" or "Unresolved" element introduced.
  *   **Round 2 (Developmental Mode):**
      *   +1 Drachma for every Complication Card used.
      *   +2 Drachmas for documented Moral Regression followed by Recovery.
      *   +3 Drachmas for "Time Lag" (showing virtue taking years to manifest).
      *   *Penalty:* -2 Drachmas if the Narrative Coherence is too high (i.e., if the story feels "too neat" or flattens the timeline).

  ## 5. Precise Timeline (90 Minutes)

  ### 00:00 – 00:10: Framing the Tension
  *   **Facilitator:** Briefly defines Plutarch's goal (moral improvement through mirroring stable character) vs. "Hagiographic Compression" (erasing the mess of time to make the mirror clear).
  *   **Instruction:** Explain that Round 1 rewards *clarity*; Round 2 rewards *friction*.
  *   **Setup:** Distribute groups, roles, and decks. Assign Archetypes (A/B get "The Reformer"; C/D get "The General").

  ### 00:10 – 00:35: Round 1 (The Plutarchan Life)
  *   **Task:** Construct a life story using Event and Virtue cards.
  *   **Constraint:** The life must serve as a clear exemplar. If the figure fails, it must be a failure of *circumstance*, not *character*, or a momentary lapse immediately corrected to prove strength.
  *   **Roles:** Students assume Round 1 Roles.
  *   **Output:** A 1-paragraph "Life Summary" and a Score Calculation.
  *   **Facilitator:** Circulates to enforce the "Coherence Bonus." If a group introduces too much ambiguity, remind them they are losing points.

  ### 00:35 – 01:00: Round 2 (The Developmental Life)
  *   **Task:** Reconstruct the *same* figure's life using the Complication Deck.
  *   **Constraint:** You must show moral change. Virtue cannot be innate; it must be forged through failure.
  *   **Roles:** Students **rotate** roles clockwise (Biographer becomes Learner, etc.).
  *   **Output:** A 1-paragraph "Life Summary" and a Score Calculation.
  *   **Facilitator:** Circulates to enforce the "Coherence Penalty." If a story is too smooth, deduct Drachmas. Force them to insert "Time Lag" or "Relapse."

  ### 01:00 – 01:15: Direct Comparison (The Synkrisis)
  *   **Task:** Scriptorium A meets B (C meets D).
  *   **Action:** The **Parallel Comparators** from each group lead a 5-minute discussion.
  *   **Prompt:** "Which version of this life is more useful for a moral learner?"
  *   **Vote:** Each group must award 5 Bonus Drachmas to the *other* group based on which Life they would prefer to teach a child. (Usually, they prefer Round 1 for teaching, Round 2 for truth).

  ### 01:15 – 01:30: Debrief & Philosophical Mapping
  *   **Facilitator-led discussion mapping the experience to theory.**
  *   **Key Question 1:** "In Round 1, you earned points for suppressing contradiction. How does this feel morally?" (Maps to Hagiographic Compression).
  *   **Key Question 2:** "In Round 2, you were penalized for coherence. Did the life become less 'imitable'?" (Maps to the risk of static images).
  *   **Key Question 3:** "Plutarch argues comparison reveals *nature*. You treated it as *narrative*. What is the difference?"

  ## 6. The Facilitator's Burden: What the Activity Cannot Reproduce
  You must explicitly state during the debrief that this activity treats Plutarch's method as a **narrative strategy**, whereas for Plutarch it was an **ontological claim**.
  *   **The Gap:** The activity assumes character *can* change (Round 2) but is hidden (Round 1). Plutarch believed character (*ēthos*) is fundamentally stable; the *synkrisis* does not "flatten" time to hide change, but rather strips away time to reveal the unchanging soul beneath.
  *   **Facilitator Note:** "You felt tension because you believe morality is developmental. Plutarch felt no such tension because he believed morality was structural. We cannot simulate his conviction; we can only simulate his text."

  ## 7. Predicted Failures (First Run)
  1.  **The "Sadness" Trap:** In Round 2, students will equate "Developmental" with "Tragic." They will add suffering without adding *moral learning*.
      *   *Correction:* Remind them points are awarded for *Recovery*, not just Failure.
  2.  **Coherence Anxiety:** Students will find it psychologically difficult to penalize coherence. They will write smooth stories in Round 2 and try to hide the Complication Cards.
      *   *Correction:* Act as the "Internal Critic" for the whole class during Round 2. Aggressively deduct points for smooth transitions.
  3.  **Role Drift:** The "Moral Learner" will try to write the story instead of assessing the lesson.
      *   *Correction:* Enforce role cards. The Biographer holds the pen; the Learner holds the Virtue Cards.

  ## 8. Honest Limits of the Activity
  *   **Temporal Compression:** Ninety minutes forces the "Lives" to be skeletal. Students will not feel the weight of a lifetime, only the weight of a game mechanic. The "Time Lag" card is a symbol, not an experience of waiting.
  *   **The "Other" Problem:** Plutarch's *synkrisis* relies on cultural shared knowledge (everyone knows who Alexander is). Here, the figures are archetypes. The "mirror" effect is weaker because the students do not bring prior emotional investment to the figures.
  *   **Virtue Signaling:** The Round 1 scoring explicitly rewards "virtue-signaling." This may cynically frame Plutarch's genuine moral earnestness as mere point-scoring. The debrief must reclaim Plutarch's sincerity despite the game mechanics.

  ## 9. Debrief Script Guide (For the Final 15 Minutes)
  1.  **Map to Plutarch:** "You found Round 1 easier to compare. Why? Because stable characters are easier to align than developing processes. This validates Plutarch's structural choice."
  2.  **Map to Modern Debate:** "If we accept Round 2 is more 'true,' can we still use biography to teach virtue? Or does the truth make the example too messy to follow?"
  3.  **Map to Risk:** "If you imitate the Round 1 Life, you imitate a result. If you imitate the Round 2 Life, you imitate a process. Which is safer? Which is more human?"
  4.  **Final Closing:** "Plutarch risks falsifying history to save the soul. We risk saving history but losing the example. Your task is to decide if the falsification is a lie or a lens."
