  hey — i'm a phil of mind phd student putting together questions for a podcast interveiw with a philosopher defending a kind of functionalist hedonism. she's got this book arguing that the heterogeneity problem (what do the pleasure of a warm bath and the pleasure of finally getting kant's categorical imperative actually share?) only looks hard if you assume pleasure needs a shared phenomenal texture. instead she claims pleasures are unified by thier job in belief-desire psychology: they all provide direct, non-inferential warrant to continue the activity that caused them. she calls it the continuation-warrant view.

