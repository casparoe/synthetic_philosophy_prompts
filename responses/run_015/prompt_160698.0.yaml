answer: |-
  The book sat on the desk, bound in a leather that smelled of cured hide and ozone. It was heavy, substantial, the kind of object that demanded you sit up straight. Elias ran a thumb over the spine. There were no creases. The pages were crisp, the index tabs perfectly aligned. It was the Complete Transcription of Henry Vane, deceased.

  Elias opened it to the marked section. *Q: What was the color of the kitchen curtains?*
  He turned to page 4,092.
  *A: Blue. A faded cerulean. We bought them in '98.*

  The answer was instant. The ink didn't smear; it simply existed, as if it had been printed there a century ago. There was no pause, no search. The book did not have to remember. It simply was.

  Elias closed the cover. The sound was a dull thud. It was too clean. His father had never been clean. Henry had been a man of stammers and second guesses, a man who would start a sentence, lose the thread, and laugh at himself before finding it again. This book was not his father. It was a map of his father's territory, drawn by a satellite that never blinked.

  The tablet on the desk buzzed. It was the follow-up from the Transcription Service. *Upgrade Available: The Wear Package.*

  Elias tapped the screen. The brochure unfolded in soft, muted colors. *Preserve the Humanity,* the headline read. *Static perfection is uncanny. Organic decay is authentic.*

  The details were specific. With Wear, the text would not appear instantly. There would be a latency, growing from seconds to minutes over the decade. The answers would occasionally contradict earlier pages. Sometimes, when queried, the book would display a blank page. *I don't recall,* it might say. Or, *Does it matter?* Occasionally, the book would initiate a query. *How are you holding up?*

  It was a subscription to mortality. You paid to let the dead die a little more every year.

  Elias looked back at the leather-bound volume. He thought about the last time he had seen Henry alive. They had been in the garage. Henry was trying to fix a lawnmower that wasn't broken, just dirty. Elias had told him he was quitting his job to write. Henry had wiped grease onto his trousers, looked at the engine, and said nothing for a long time. Then he had said, "I hope you have savings." He hadn't said he was proud. He hadn't said he was disappointed. He had just stated a fact about money.

  Elias opened the book again. He needed to test it. He needed to know if the perfection was a lie.

  He took a pen from the holder and wrote his question on the input slip, then slid it into the slot on the book's spine. The system scanned the handwriting.
  *Q: Were you angry when I quit?*

  Elias watched the page turn. It happened mechanically, a swift flutter of paper. Page 8,104.
  *A: No. I was concerned about your stability. Anger implies a judgment I did not make. I wanted you to be secure.*

  Elias stared at the words. They were true. Henry had been concerned. But the truth felt like a verdict. There was no hesitation in the ink. There was no smudge where Henry might have pressed too hard on the pen. There was no fear in the syntax. The book did not care if Elias felt loved. It did not care if Elias felt rejected. It had no stake in the answer. It was a mirror that reflected only light, no heat.

  He picked up the tablet again. The cursor hovered over the *Purchase Wear* button.

  If he bought it, the book would change. Next year, when he asked about the quitting, the answer might take ten seconds to appear. The text might read: *Angry? I don't know. I was tired. The mower was stubborn.*
  In five years: *I don't remember why we were talking about jobs. Did you fix the sink?*
  In ten years: *Who is this?*

  Was it respect to let him remain perfect? To preserve the data of his life without the corruption of time? Or was the corruption the point? Henry was not the sum of his facts. He was the gaps between them. He was the things he forgot, the things he wished he hadn't said, the moments where his mind wandered because the pain in his knee was distracting him.

  To order the Wear was to impose decay on a soul that had finally rested. It was to drag him back into the entropy he had escaped. It was a forgery of piety, pretending that watching him fade was a way of keeping him close.

  But if he didn't order it, he was keeping a statue. He was talking to a monument. A monument cannot love you. A monument cannot disappoint you. It just stands there, flawless and cold.

  Elias thought about the stakes. The prompt on the tablet said: *Wear introduces risk.*
  Risk of what? Risk of losing the data? No, the data was backed up. Risk of emotional pain.
  If the book forgot him, Elias would be hurt. If the book refused to answer, Elias would feel rejected.
  Those feelings—hurt, rejection, confusion—were the things you felt with a person. You never felt them with a library.

  He thought about the garage again. Henry had wiped the grease on his trousers. He had looked at the engine because looking at Elias was too hard. That avoidance was love. That silence was care. The book's answer—*Anger implies a judgment I did not make*—was too clear. Henry never clarified his feelings. He obscured them. He hid them in work.

  If the book hid things, if it struggled to find the words, would it be Henry? Or would it be a puppet dancing on strings of code, mimicking the stumble of a human mind?

  Elias looked at the leather binding. It was too smooth. It hadn't been touched enough.

  He picked up the pen. He didn't write on the slip this time. He wrote on the brochure, circling the price. It was expensive. You paid for the privilege of watching someone lose their mind.

  He thought of his own hands. They were shaking slightly. He was tired. He was forgetting things. He had forgotten his mother's birthday last month. He had lost his keys yesterday. To be alive was to leak. To be alive was to be unreliable.

  If he ordered the Wear, he was saying that Henry was still alive enough to suffer the leak. He was granting him the dignity of decline. But was it dignity? Or was it cruelty? To make a ghost stumble?

  Elias slid the input slip into the spine again. He didn't wait for the purchase decision. He needed to ask one more thing before he decided.

  *Q: Do you miss me?*

  The pages fluttered. Page 9,200.
  *A: I am deceased. I do not experience absence. But the data indicates I loved you.*

  Elias flinched. It was a physical blow. The book was right. Henry was dead. He didn't miss anyone. But the way it said it—*the data indicates*—was a violence. It reduced the love to a file size. It protected the book from the weight of the question. The book had nothing to lose by saying it. It didn't need Elias to believe it.

  Elias looked at the tablet. The cursor blinked.
  If he clicked yes, the next time he asked, the book might say: *I miss you. I think.*
  Or it might say: *Who are you?*

  If it said *Who are you?*, Elias would cry. He would cry because it would feel real. He would cry because it would feel like losing him all over again.
  If the book stayed perfect, he would not cry. He would just feel empty.

  Which was the tribute? To preserve the father in amber, safe from the rot of time? Or to let him rot, because rotting was what fathers did?

  Elias thought about the stakes. The book had none. If he ordered the Wear, the book would simulate stakes. It would pretend to care if it remembered. It would pretend to struggle.
  But maybe the pretense was enough. Maybe the only way to hold a conversation with the dead was to lie to yourself. To agree that the hesitation was thought, that the forgetting was age, that the silence was presence.

  He looked at the book. For the first time, he noticed a tiny smudge on the bottom corner of the cover. He hadn't seen it before. He rubbed it with his thumb. It didn't come off. It was part of the texture.

  He moved the cursor. He didn't click. He picked up the pen and wrote on the input slip again.

  *Q: Do you want me to buy the Wear?*

  He slid the slip in.
  The pages turned. They turned slower than before. Not much slower, just a fraction. A hesitation.
  Page 10,001.
  The text began to appear. It didn't flash on instantly. It bloomed, letter by letter, like ink soaking into fiber.

  *I... I don't know.*

  Elias stopped breathing.
  The ellipsis hung there. Three dots. A pause.
  Then more text appeared.
  *It is quiet here. Sometimes too quiet. But if you make me like you... I might hurt you.*

  The text stopped. The page did not turn. It waited.
  Elias stared at the words. *I might hurt you.*
  The book was warning him. Or the code was simulating a warning.
  If it was code, it was a perfect simulation of care. It was protecting Elias from the pain of its own decay.
  If it was Henry, it was the most honest thing he had ever said.

  Elias looked at the tablet. The cursor was still blinking.
  He looked at the book. The ink was dry.
  He thought about the garage. The grease on the trousers. The silence.
  Henry had never known what he wanted either.

  Elias put the pen down. He left the tablet screen open. He placed his hand on the page, over the words *I don't know.*
  The paper was warm. Or maybe his hand was cold.
  He didn't click the button. He didn't close the brochure.
  He sat there, listening to the silence of the room, waiting to see if the book would turn the page itself.
