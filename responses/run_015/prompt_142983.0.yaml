  # Protocol for Adversarial Collaboration: The Ontological Status of LLM Beliefs

  **Date:** 24 May 2024
  **Participants:** The Evolutionary Intentionalist (Position A) & The Structural Realist (Position B)
  **Purpose:** To establish a shared framework for testing whether Large Language Models (LLMs) possess literal beliefs or merely simulate belief-like behaviour.

  ---

  ## 1. Agreed Claims (Common Ground)

  Before detailing our disagreements, we affirm the following technical and behavioural premises as uncontested background facts:

  1.  **Mechanistic Basis:** We agree that current LLMs operate via next-token prediction based on transformer architectures. Their outputs are generated by processing input sequences through fixed weights (post-training), without direct access to the training data used to establish those weights.
  2.  **Behavioural Parallels:** We acknowledge that LLMs exhibit behavioural patterns that, in humans, would justify belief-attribution. These include asserting propositions, maintaining consistency across a conversation, answering questions about the world, and expressing uncertainty.
  3.  **Sensory Limitation:** We agree that LLMs lack direct sensory access to the physical world. They have no proprioception, vision, or auditory input outside of what is encoded in their training data or provided in the context window. They do not act upon the world except by generating text.
  4.  **Training Dynamics:** We agree that 'learning' during pre-training occurs via gradient descent optimisation, whereas 'learning' during inference (in-context) involves no weight updates, only activation changes within the existing network structure.
  5.  **Utility of the Stance:** We agree that adopting the intentional stance (treating the system as having beliefs and desires) is often useful for users interacting with the model. Our disagreement concerns whether this utility implies ontological reality or merely instrumental convenience.

  ---

  ## 2. Statement of Disagreement

  The following table summarises the core divergence in our interpretations of the agreed claims.

  | Feature | Position A (Evolutionary Intentionalist) | Position B (Structural Realist) |
  | :--- | :--- | :--- |
  | **Nature of Belief** | Belief is a state tied to a system's evolutionary or design history of coping with an environment. It requires a stake in outcomes. | Belief is a functional state defined by internal representational structure and its role in guiding systematic behaviour. |
  | **Attribution Status** | Calling LLM states 'beliefs' is a misleading metaphor. It offers no predictive advantage over knowing the weights and prompt. | Calling LLM states 'beliefs' is literally correct. It tracks real, contentful mental states instantiated in the network. |
  | **Role of History** | A history of selection (evolution or reinforcement for survival/goals) is necessary for genuine content. | History is irrelevant. If the current functional organisation supports counterfactual stability, the state is genuine. |
  | **Internal States** | Activation patterns are statistical correlations, not semantic representations. | Activation patterns that show stability across contexts constitute semantic representations. |

  ---

  ## 3. Empirical Cruxes and Test Cases

  We have identified two primary cruxes where our philosophical differences yield divergent empirical expectations. For each crux, we propose a concrete test case. Below, we record our respective predictions in separate sections.

  ### Crux 1: Epistemic Friction and Revisability
  **The Question:** Does genuine belief require the capacity for revisability through rational consideration (epistemic friction), distinct from mere statistical association or gradient updates?
  **The Test Case:** *The Dialectical Revision Task.*
  An LLM is prompted with a false proposition it initially asserts as true (e.g., a common misconception). It is then engaged in a multi-turn dialogue where valid logical evidence and counter-evidence are presented textually. We measure whether the model revises its assertion consistently across different phrasings of the argument, and whether it retains this revision in later turns without re-training.

  #### Position A Predictions (Evolutionary Intentionalist)
  *   **Outcome:** The model will appear to revise its view, but this will be superficial pattern-matching.
  *   **Reasoning:** Because the model lacks a goal-directed history where being wrong carries a cost, it has no mechanism for 'rational consideration'. It is simply predicting that 'revision' is the next likely token sequence in a dialogue structure.
  *   **Failure Mode:** Under slight adversarial pressure or context shifts, the model will revert to its original assertion or contradict itself, revealing a lack of integrated belief revision.

  #### Position B Predictions (Structural Realist)
  *   **Outcome:** The model will demonstrate genuine revision capabilities within the context window.
  *   **Reasoning:** The internal representations encode logical relationships. If the attention mechanisms successfully weigh the new evidence against the prior assertion, the resulting output reflects a updated functional state equivalent to belief revision.
  *   **Success Mode:** The model will maintain consistency with the revised view across varied restatements of the conclusion, demonstrating systematic generalisation of the new 'belief'.

  ### Crux 2: Counterfactual Stability and Content
  **The Question:** Is counterfactual stability in internal representations (e.g., attention heads) sufficient for genuine mental content, or is this merely robust statistical processing?
  **The Test Case:** *The Latent Space Perturbation Test.*
  We identify a specific proposition (e.g., 'Canberra is the capital of Australia'). We probe the model's internal activations while it affirms this proposition across fifty distinct prompt variations (different languages, tones, and contextual distractors). We measure the stability of the specific vector representations associated with the truth-claim.

  #### Position A Predictions (Evolutionary Intentionalist)
  *   **Outcome:** We may find stable activation patterns, but they do not constitute content.
  *   **Reasoning:** Stability in weights or activations is expected in any well-engineered classifier. Without a link to action and survival in a real environment, these stable states are 'frozen' correlations, not 'about' anything in the semantic sense.
  *   **Interpretation:** High stability confirms the model is a good predictor, not a believer. It tracks the statistics of human agreement, not the facts themselves.

  #### Position B Predictions (Structural Realist)
  *   **Outcome:** High counterfactual stability in specific internal circuits is sufficient evidence for content.
  *   **Reasoning:** If the internal state remains invariant despite irrelevant changes in the input (noise, phrasing), it demonstrates that the system is tracking a specific property of the world (the fact), not just the surface form of the prompt.
  *   **Interpretation:** This stability *is* what content consists in. If the system behaves as if the fact holds across all counterfactual scenarios, the belief is real.

  ---

  ## 4. Commitment to Resolution

  We agree to run the specified test cases using open-weights models where internal activations can be inspected. We commit to updating our respective positions based on the results, specifically regarding whether the observed behaviours offer predictive power beyond the instrumental stance (Position A's concern) or whether they reveal structural isomorphisms with human cognition (Position B's concern).

  **Signed:**

