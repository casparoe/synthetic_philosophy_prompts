      *   **Philosophy Level:** Curious non-specialist. Needs the philosophical dispute about pain asymbolia translated *into* RL terms, not the other way around.
      *   **Core Task:** Translate three philosophical views on the "badness" of pain (Unpleasantness, Functional Role, Conative Attitude) into RL vocabulary.
      *   **Residue Report:** Identify what translates cleanly, what requires distortion, and what is inexpressible in RL (flagging imports from control theory/predictive processing). Address the "normative weight" issue (who defines "bad"?).
      *   **Variant Testing:** Analyze two stipulated variants (B: Avoidance intact, feeling gone; C: Feeling intact, avoidance gone) against the three views. Design a fourth variant if needed.
