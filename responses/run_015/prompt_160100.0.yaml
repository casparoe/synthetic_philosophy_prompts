      *   Did I do the residue report? Yes.
      *   Did I analyze Variants B & C? Yes.
      *   Did I audit the gradient masking analogy? Yes.
      *   Did I answer the final straight question? Yes.

  *(Self-Correction during drafting)*: I need to be careful with "Reward." In RL, reward is often external. In pain, it's internal. I should frame pain as an *intrinsic reward signal* generated by a reward model within the agent, not necessarily the environment. This aligns better with "felt unpleasantness."
  Also, for "Functional Role," emphasize the *opportunity cost* and *planning horizon disruption*. Pain isn't just negative reward; it's a high-priority interrupt that truncates the planning horizon or forces a mode switch.
  For "Conative," emphasize the *learned value* vs. *immediate reward*.

  Let's structure the response:
  1.  Translation of the Three Views.
  2.  Residue Report (Clean, Distorted, Inexpressible, Normative Collapse).
