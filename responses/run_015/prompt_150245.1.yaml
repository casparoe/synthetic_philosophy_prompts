answer: |-
  This is an exceptionally sharp objection. You have put your finger on the central tension in *On Certainty* that divides commentators: the tension between the **normative** force of hinges (they *ought* to stand fast) and their **arational** status (they are not justified by evidence).

  Your friend is defending a "grammatical" or "rule-constitutive" reading (championed by scholars like Danièle Moyal-Sharrock), while you are pressing a "naturalistic" or "epistemic" worry (closer to Annalisa Coliva or Crispin Wright). Your concern is that if hinges are immune to evidence, Wittgenstein lacks the resources to condemn a delusional framework without smuggling in the very evidential standards he claims to bypass.

  Here is a way to untangle the knot, addressing your specific question about the distinction between legitimate hinges and delusion, and whether Wittgenstein is secretly relying on a rational-constraint theory.

  ### 1. Certainty is Not an Epistemic Achievement
  Your friend is right that hinges are not "knowledge-claims," but you are right to worry that calling them "certain" sounds epistemic. The resolution lies in Wittgenstein's distinction between **knowledge** and **certainty**.

  For Wittgenstein, "knowledge" implies the possibility of doubt, verification, and mistake. "Certainty," in the context of hinges, is not a mental state of conviction (psychological) nor a status of being proven (epistemic). It is a **logical-functional** status.

  Think of the hinge not as a proposition we *hold*, but as a pivot around which our inquiries rotate.
  *   **Your worry:** If the pivot isn't held in place by evidence, what holds it?
  *   **Wittgenstein's answer:** Nothing "holds" it. It is the *absence* of movement that defines it.

  When Wittgenstein says, "I know I have two hands," he is misusing the word "know." He should say, "It stands fast for me." This "standing fast" is not a triumph of reason; it is the **background condition for reasoning**. Therefore, "certainty" here is not an achievement; it is a precondition. It distinguishes the *game* from the *moves* within the game.

  ### 2. Arbitrariness vs. Natural History
  Your strongest point is the charge of arbitrariness: *If we don't choose hinges based on evidence, isn't the "five-minute-old world" hypothesis equally valid?*

  Wittgenstein's defense against this is **Naturalism**. Hinges are not arbitrary dogmas because they are not *chosen* at all. They are rooted in our "form of life" (*Lebensform*) and our biological nature.

  *   **The Constraint:** We do not adopt the hinge "The earth existed before my birth" because we weighed the evidence and found it wanting. We adopt it (or rather, inhabit it) because we are beings who learn, remember, plan, and dig.
  *   **The Five-Minute World:** A person who genuinely operates on the hinge "The world began five minutes ago" cannot actually play a language game. They could not plant seeds (why wait for growth?), build shelters (why prepare for a future?), or mourn the dead (who died?).

  Therefore, hinges are not arbitrary because they are constrained by **practical viability**. A hinge system that makes action impossible dissolves itself. The "five-minute" hypothesis is not a rival hinge system; it is a *parasitic hypothesis* that can only be articulated within a hinge system that assumes time, memory, and causality.

  ### 3. Distinguishing Hinges from Delusions
  This brings us to your core question: *What distinguishes a legitimate hinge from a delusional framework?*

  If a patient says, "I am Napoleon," or " The CIA is beaming thoughts into my teeth," Wittgenstein does not say, "You lack evidence." He looks at the **role** the proposition plays in their life.

  *   **Legitimate Hinge:** "I have two hands." This proposition facilitates action. It allows me to grab, hold, count, and gesture. It connects me to the shared world. It is **enabling**.
  *   **Delusional Framework:** "I am Napoleon." This proposition isolates. It does not facilitate a shared form of life. It creates friction with every other practice (e.g., trying to rule France while sitting in a clinic). It is **disabling**.

  The distinction is not evidential (we don't prove the patient isn't Napoleon); it is **pragmatic and coherence-based**. A legitimate hinge is one that allows the "river-bed" of thought to flow. A delusion is a rock that jams the gears.

  Wittgenstein writes: *"If someone said to me that he doubted whether he had a body I should take him to be a half-wit. But I shouldn't know what it would mean to try to convince him that he had one."* (OC §257).
  Notice the move: He doesn't offer evidence. He categorizes the doubt as a breakdown of sense. The "sanity" of a hinge is measured by its **integrative power** within a community of speakers.

  ### 4. The "Secret Presupposition" Charge
  You ask: *Does not Wittgenstein's claim that they are "not open to doubt" secretly presuppose the very kind of rational-constraint theory he claims to have dissolved?*

  **Yes and No.**

  *   **No:** He is not presupposing a *Cartesian* or *Foundationalist* rational constraint (i.e., "These hinges are True because they correspond to Reality"). He is not appealing to a "God's eye view" to validate our hinges.
  *   **Yes:** He is presupposing a **Naturalistic Normativity**. He assumes that being a "rational agent" means being a functioning human being within a shared world.

  Wittgenstein dissolves the *epistemic* constraint (evidence) but replaces it with a *biological/social* constraint (form of life). He is arguing that rationality is not a free-floating logic; it is an extension of animal behavior.

  If you ask, "But what if our form of life is wrong?" Wittgenstein would likely say the question is nonsensical. "Wrong" implies a standard outside the form of life. There is no "outside." There is only functioning or malfunctioning.

  ### 5. Resolving the Contradiction
  The contradiction you feel arises because you are looking for an **external justification** for the hinges (a reason *why* we should trust them), while Wittgenstein is offering a **description of their function** (showing *how* they work).

  *   **Your Friend's Error:** She risks making hinges sound too static, like rules in a rulebook. If they are just rules, why *these* rules?
  *   **Your Error:** You are looking for an epistemic warrant (justification) for something that is pre-epistemic.

  **The Synthesis:**
  Hinges are **animal certainties**. They are distinct from delusions not because they are "true" in a correspondence sense, but because they are **successful adaptations**.
  *   A delusion is a hinge that fails to coordinate action.
  *   A legitimate hinge is one that successfully coordinates action.

  Wittgenstein isn't smuggling in a rational-constraint theory; he is **naturalizing** rationality. The constraint is not "Logic" or "Evidence"; the constraint is "Survival" and "Communication."

  ### Conclusion
  To answer your question directly:
  1.  **What distinguishes a legitimate hinge from delusion?** **Practical coherence.** A legitimate hinge enables a shared form of life; a delusion fractures it. The test is not "Is it supported by evidence?" but "Can we act on this together?"
  2.  **Is there a hidden presupposition?** Wittgenstein presupposes **naturalism**, not rationalism. He assumes that our human nature provides the boundary between sense and nonsense. He dissolves the idea that we need *evidence* to separate sanity from madness, arguing instead that sanity is the *capacity to engage in evidence-based practices* at all.

  You can tell your friend that while she is right that hinges are not hypotheses, she risks making them too abstract. You are right that there must be a constraint, but that constraint is not evidential justification—it is the **viability of the human form of life**. Wittgenstein saves us from skepticism not by proving the world exists, but by showing that doubt requires a world to doubt *in*.
