      *   **Setting:** Made-up port city, glassblowers' guild.
      *   **Custom:** "The Reckoning" - once a year, every master gives away their single best object for free to the city's collection.
      *   **Conflict:** Nobody wants to do it (economic loss), but nobody defects. It's a "velvet Moloch" (multipolar trap fueled by generosity/craft pride/social pressure, not malice).
      *   **Key Constraint 1:** Guild membership isn't fixed (apprentices, outsiders). No single person is pivotal; no coalition knows it's complete.
      *   **Key Constraint 2:** A character tries a fix (pact/boycott) and fails due to structural reasons (arithmetic/open membership), not weakness/corruption.
      *   **Key Constraint 3:** No tidy speeches explaining the mechanism. Understanding must be self-serving or half-wrong.
      *   **Ending:** Real escape (no deus ex machina) OR naming precisely which exit is blocked and why.
      *   **Style:** Close third person, present tense. Must survive being read aloud (rhythm, clarity, engagement for a reluctant audience).
      *   **Post-Story:** One paragraph analysis on "velvet Moloch" vs. standard multipolar trap.

  2.  **Deconstruct the "Velvet Moloch" Concept:**
      *   Standard Moloch/Prisoner's Dilemma: Everyone defects because they fear others defecting. Race to the bottom.
      *   User's Twist: Everyone *cooperates* (gives away the best work) because the incentive structure makes cooperation the dominant strategy for status/craft pride, even though it hurts them economically. It's a race to the *top* that impoverishes them.
      *   The Trap: You can't stop because if you stop, you look greedy/bad craftsman. But if everyone stops, everyone is richer.
      *   The Structural Flaw: Open membership. You can't trust a pact because a new person can always join and break it to gain status, or an existing member can't verify if *everyone* else is truly in.

  3.  **Character & Plot:**
      *   **Protagonist:** Elara? Kaelen? Let's go with **Tomas**. A master glassblower.
      *   **The Fix:** A private meeting. A pact to give "mediocre" work instead of "best" work.
      *   **The Failure:** Not because someone snitched, but because the math doesn't hold. Someone new arrived. Or the definition of "best" shifts.
      *   **The Ending:** Needs to name the blocked exit.
      *   **Setting the Scene:** The workshop, the heat, the approaching Reckoning.

  4.  **Drafting - Section by Section:**

