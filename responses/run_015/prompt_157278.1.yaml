answer: |-
  The heat in the workshop is not a temperature; it is a weight. Tomas leans into it, turning the blowpipe in his hands. The gather of molten glass glows orange, a small captured sun that demands constant motion. If he stops, it hardens. If he hesitates, it sags.

  Outside, the city of Orlis prepares for the Reckoning. Banners hang from the stone quays. The Guild Hall is being swept. Tomorrow, every master glassblower must place their single best piece of the year on the Great Table. It will be given to the city. Free. No coin changes hands. No names are carved on the base. The city owns it. The master owns only the memory that he made it.

  Tomas sets the pipe down. His back aches. He walks to the back room where six other masters wait. The air here is cool, smelling of dust and old paper.

  "We don't do it," says Kaelen. He is the oldest, his hands spotted with burns like constellations. "This year, we break it."

  Tomas sits. "How?"

  "We agree," Kaelen says. He slides a sheet of paper across the table. "We all submit second-rate work. Thick vessels. Simple shapes. Nothing that sings. If the best piece on the table is mediocre, the city cannot expect brilliance next year. The standard drops. We keep our best for buyers."

  It is sensible. It is rational. It is treason against the Guild's soul.

  Tomas looks at the paper. There are six signatures already. He takes the pen. The ink is black and wet. He signs his name. *Tomas Vane.*

  "How many masters are there?" Tomas asks.

  Kaelen shrugs. "Forty, maybe. Fifty."

  "We need all of them," Tomas says. "If forty give junk and one gives a masterpiece, the one gets the glory. The forty look like they've lost their touch. Their prices drop. They starve. Then next year, they all try to outdo the one."

  "We have the signatures," Kaelen says. "The ones who matter."

  "The ones who are here," Tomas corrects. He looks at the door. The workshop is near the docks. Ships come in every week. Men leave apprentices behind. Boys become masters overnight if the fire takes them. "Who counts the roll?"

  "The Guildkeeper," Kaelen says.

  "Does he know who is in this room?"

  Kaelen doesn't answer. He drinks his wine.

  Tomas stands up. He walks back into the heat of the shop. He spends the night working. He makes a bowl. It is thick. The glass is cloudy. It is ugly. He knows it is ugly. His hands want to make it thin, to make it clear, to make it sing. He forces them to be clumsy. It feels like breaking his own fingers.

  Morning comes. The bells ring.

  The Guild Hall is crowded. The citizens stand behind the velvet ropes. They want to see what the masters have given them. They expect wonder.

  The Great Table is covered in linen. One by one, the masters approach. They place their pieces down.

  Tomas watches. He sees Kaelen's thick vase. He sees the clouded bowl from the shop next door. He sees a paperweight that looks like a stone. A murmur goes through the crowd. It is not a cheer. It is confusion. The masters stand stiffly. They look at the floor. They know they look like cowards.

  Then the doors at the back of the hall open.

  A man walks in. He is not wearing Guild colors. He is wearing the rough wool of a sailor. He carries a bundle wrapped in oilcloth. He walks past the velvet rope. No guard stops him; he moves with the certainty of someone who belongs.

  He reaches the table. He unwraps the cloth.

  It is a swan. The neck is curved so thin it looks like it should snap, but it holds. The glass is clear as air. Light catches the wings and throws rainbows onto the ceiling. It is not just good. It is impossible.

  The crowd gasps. The sound is physical, a wave hitting the wall.

  Tomas feels his stomach drop. He looks at Kaelen. Kaelen is staring at the swan. His face is not angry. It is defeated.

  The sailor steps back. "I arrived yesterday," he says. His voice carries. "I heard about the Reckoning. I wanted to pay my respect to the city."

  The Guildkeeper steps forward. "Are you a master?"

  "I am a man who works glass," the sailor says. "Is that not the requirement?"

  The Guildkeeper looks at the roll book. He looks at the sailor. There is no rule against strangers. There is no rule against late entries. The Reckoning accepts the best of the year. If the year is only one day for this man, so be it.

  The crowd begins to clap. They are not clapping for the Guild. They are clapping for the swan.

  Tomas looks at his own ugly bowl on the table. Next to the swan, it does not look like a protest. It looks like incompetence. It looks like the work of men who have forgotten how to burn.

  He understands then. It is not that Kaelen was weak. It is not that the pact was betrayed.

  The trap is not the people. The trap is the horizon.

  Tomas walks to the table. He picks up his cloudy bowl. He could hide it. He could smash it. But the city is watching. If he removes it, he admits shame. If he leaves it, he admits mediocrity.

  He sets it back down.

  He walks out of the hall. The air outside is cool. The docks are busy. Cranes lift crates. Men shout. A ship is unloading timber. Another is loading grain. People are getting off a boat from the south. They carry bags. They look for work.

  Tomas leans against the stone wall of the Guild Hall. He lights a cigarette. His hands are shaking.

  Kaelen comes out a moment later. He stands beside Tomas. They watch the newcomers walk up the hill.

  "We could ban them," Kaelen says. "Close the membership. No new masters without ten years."

  "Then the work stagnates," Tomas says. "The city leaves. We starve anyway."

  "We could hide the table."

  "They would break in."

  Tomas watches a young boy carrying a rod of glass toward a small furnace near the quay. The boy is laughing. He is trying to copy the masters. He will fail. He will try again. One day, he will make a swan. Or someone else will arrive who already knows how.

  "The count is wrong," Tomas says.

  Kaelen looks at him. "What?"

  "The pact," Tomas says. "We counted the men in the room. We didn't count the men on the water."

  "We can't count the water."

  "No," Tomas says. "That's the point."

  He flicks the cigarette into the gutter. The ember dies in the wet stone.

  "We can't stop because we can't know who is playing," Tomas says. "If there is always one more person who can join, there is always one more person who can win. And if there is always one person who can win, everyone else has to try to beat them. Even if we agree not to."

  Kaelen is silent. He looks at the Guild Hall doors. The applause is still coming from inside. It sounds like drowning.

  "So what do we do?" Kaelen asks.

  Tomas pushes off the wall. He goes back inside. He picks up his cloudy bowl. He walks to the city official who is cataloging the gifts.

  "Keep it," Tomas says.

  "It is... unique," the official says, diplomatically.

  "Next year," Tomas says. "I will make something better."

  He knows he will. He knows Kaelen will. He knows the sailor will be gone, but another will come. The standard is not set by the Guild. It is set by the possibility of the stranger.

  Tomas walks out into the sun. The exit is not locked. The door is wide open. That is why no one can leave.

  ***

  "Velvet Moloch" is not a new animal, but it is wearing different clothes, and the distinction matters for your novel. Standard Moloch scenarios (arms races, adtech) are driven by *fear* of defection—a race to the bottom where everyone loses status/safety/money if they don't maximize efficiency. Your scenario is a race to the *top* driven by *prestige* and *generosity*, where everyone loses *money* to maintain status. The game theory structure (multipolar trap, open membership preventing coordination) is identical, but the psychological texture is inverted. You aren't building on a false distinction; you're exploring the specific horror of a trap made from virtue rather than vice. The "open membership" constraint is the crucial linchpin that prevents the "velvet" aspect from becoming a solvable cartel problem. It holds.
