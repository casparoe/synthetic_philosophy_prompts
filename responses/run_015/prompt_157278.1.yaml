      *Refining the Constraint:* The user wants the failure to be *arithmetic*. "No coalition can ever know it's complete."
      *Idea:* Tomas organizes a pact. 50 masters agree. But on the day, 51 pieces are submitted. Or 50 pieces, but one is so good it shames the rest, forcing them to wish they hadn't held back.
      *Better Idea:* A new master arrives. Just one. He doesn't know the pact. He gives his best. Now the old masters look greedy by comparison. The social pressure resets.
      *Even Better (Arithmetic):* Tomas counts the signatures. 42 masters. But the Guild roll shows 43. Who is the 43rd? An apprentice who mastered early? A stranger from a ship? Because he doesn't know who the 43rd is, he can't trust the pact. If even one person defects, the defector gets the glory, and the cooperators look like they lacked skill.
      *Wait, the constraint says:* "No single person's compliance is ever pivotal, and no coalition can ever know it's complete."
      *So:* Tomas tries to organize a boycott. He gets signatures. But he realizes that even if everyone signs, a new person can walk in tomorrow and claim the glory. The value of the "gift" is relative. If everyone gives a cup, and one person gives a vase, the vase wins. If everyone agrees to give cups, but there's always the *possibility* of a new person giving a vase, the incentive to give the vase remains.
      *Actually, let's look at the "Open Membership" constraint.*
      *Scenario:* Tomas organizes the pact. Everyone agrees to submit a "second-best" piece.
      *The Failure:* On the day, the pieces are displayed. One piece is unmistakably the best. It wasn't one of the signatories. It was a newcomer. Because the newcomer isn't bound by the social contract of the old guard, he wins the prestige. Now the old guard looks like they *couldn't* make better, not that they *wouldn't*. Their reputation tanks. Next year, they must overcompensate.
      *The Ending:* Tomas names the blocked exit. "The door stays open."

      *Let's focus on the Read-Aloud aspect:* Needs rhythm. Sensory details. Clear stakes. Avoid overly complex sentences that trip the tongue.

