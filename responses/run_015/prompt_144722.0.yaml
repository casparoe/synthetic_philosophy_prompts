prompt: |-
  I run a small decision-theory reading group with two friends from the economics department, and over the last few months I have come to accept something like the standard line about the value of information. Good's theorem — the result that for an expected-utility maximizer the ex ante value of a costless signal is never negative, since acquiring it never removes an act from the feasible set and you can always simply act as you would have acted had you not received it — strikes me as about as firm as anything in this neighbourhood, and I now lean on a stronger, more operational version of it: whenever additional information appears to make an agent worse off, the harm must be traceable to one of a short list of extra factors — the information was not really free, the agent is not an expected-utility maximizer, preferences run over beliefs as well as over outcomes, other agents are responding to what the agent knows, or the agent is boundedly rational and updates badly on noise. I like this version because it is diagnostic rather than merely reassuring: it predicts that every apparent counterexample will decompose into one of those failure modes.

  What I want from you is the case against it, in the sense of what would have to be true for me to be wrong. Please set aside the boring failures — monetary cost, time, attention, the risk of being lied to — and go for the structural ones. Here are the cases I keep turning over. First, my brother is an oncologist, and he says there are borderline genomic results he would rather not have, because once he has seen one he can no longer recommend the standard treatment with the particular wholeheartedness that he thinks does part of the therapeutic work; that looks like a case where information shrinks the feasible act set rather than merely informing a choice within it. Second, there is ignorance as a commitment device: the negotiator, or the family of a kidnap victim, who is better off genuinely not knowing, because not knowing is the only way to be unable to reveal the thing or unable to cave. Third, there are cases where the harm runs through the agent's own dispositions — learning from an accurate predictor what sort of person you are may destroy the very disposition you had hoped to exercise, and you cannot choose to be the sort of person who had not been told. Fourth, and this is the one I find hardest to fit into the framework at all, there is information that is not a coarsening or refinement of a fixed partition: learning a new concept, a name for a symptom, a distinction you could not previously draw, after which the space of possibilities has itself been re-individuated and acting as if you had not learned it is not among the things you can do even in principle.

  So: tell me which of these are genuine defeaters and which attack a strawman, and which assumption of the theorem each one targets. Rank them for me from fatal to merely awkward, and be explicit about what a defender of the theorem would herself concede as counting against it, as opposed to what only critics say — I would rather have the concessions than the polemic. I would also like to know whether the companion result, that a finer experiment is never worth less than a coarser one, is exposed at the same points or at different ones, and whether the ex ante framing is doing real work here, since in several of my cases the agent is plainly worse off ex post in some realizations while the average still comes out fine. Finally, and most importantly: has my operational version of the view been qualified into something unfalsifiable? If every apparent counterexample is met by saying that the information was not really free, or he was not really rational, or what arrived was not really a signal over a fixed state space, then the claim seems to be on its way to being true by stipulation. Say honestly whether that is where this ends up, and whether, for a claim of this kind, that is a defect. The two things that would move me most are a case where the feasible set genuinely shrinks and a case where the incoming item cannot be modelled as a partition of an already-given space of possibilities; if neither can be made to work, I would like to be told that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Runs a decision-theory reading group (economics background). Knowledgeable, sophisticated, familiar with Good's Theorem (1967), expected utility theory (EUT), and standard objections.
      *   **Current Stance:** Leans heavily towards the "standard line" (Good's Theorem holds for rational EUT maximizers with costless info). Has developed an "operational version": apparent harms must be traceable to specific failure modes (cost, non-EUT, belief preferences, game theory, bounded rationality).
      *   **Goal:** Wants the *case against* this view. Specifically, structural objections, not "boring" ones (monetary cost, etc.).
      *   **Specific Cases Provided:**
          1.  Oncologist (information shrinks feasible act set via psychological constraint).
          2.  Ignorance as commitment (negotiator/kidnap).
          3.  Disposition destruction (learning about oneself changes the self).
          4.  Unawareness/Concept Change (new concepts re-individuate the state space).
      *   **Specific Questions:**
          *   Which are genuine defeaters vs. strawmen?
          *   Which assumption of the theorem does each target?
          *   Rank them (Fatal to Awkward).
          *   What would a *defender* concede (not just critics)?
          *   Does the "finer experiment" result share vulnerabilities?
          *   Is the *ex ante* framing doing real work?
          *   **Crucial:** Has the operational view become unfalsifiable/tautological?
          *   **Most Important:** Can the feasible set genuinely shrink? Can information be non-partitional (unawareness)?

  2.  **Deconstruct Good's Theorem & Assumptions:**
      *   **Core Claim:** $EV(\text{info}) \ge 0$ for a rational Bayesian EUT maximizer.
      *   **Key Assumptions:**
          1.  **Rationality:** Agent maximizes Expected Utility.
          2.  **Costlessness:** Information has no direct utility cost (monetary, psychological, etc.).
          3.  **Fixed State Space:** The set of states $\Omega$ is fixed and known (no unawareness).
          4.  **Fixed Action Set:** The set of available acts $A$ is fixed and independent of information.
          5.  **Fixed Preferences:** Utility function $u(a, \omega)$ is stable and does not depend on the information itself (no "news utility").
          6.  **Single Agent/Non-Strategic:** No other agents reacting to the information (unless modeled into the state space perfectly).
          7.  **Ex Ante Evaluation:** Value is calculated *before* seeing the signal.

  3.  **Evaluate the User's Four Cases:**

      *   **Case 1: Oncologist (Feasible Set Shrinkage).**
          *   *Mechanism:* Knowing the genomic result makes it psychologically impossible to recommend standard treatment with "wholeheartedness."
          *   *Analysis:* In strict EUT, actions are physical outcomes. If "wholeheartedness" affects the *outcome* (patient health), it's part of the utility function $u(a, \omega)$. If it affects the *ability* to choose, it's a constraint.
          *   *Theorem Target:* Fixed Action Set / Fixed Preferences. If the info changes the *available* actions (psychological constraint), the theorem's assumption that $A$ is fixed is violated.
          *   *Verdict:* Strong objection, but often modeled as a cost of information (psychic cost). However, if the constraint is absolute (cannot physically/psychologically perform act $X$ after knowing $Y$), the action set *does* shrink.

      *   **Case 2: Ignorance as Commitment (Game Theory).**
          *   *Mechanism:* Not knowing allows credible threats/promises.
          *   *Analysis:* This is standard Game Theory (Schelling).
          *   *Theorem Target:* Single Agent assumption. Good's theorem assumes a single decision maker against nature. If other agents observe your information state or infer it, the payoff structure changes.
          *   *Verdict:* Not a defeater of the *theorem* (which assumes single agent), but a defeater of the *application* to multi-agent contexts. The user already lists "other agents are responding" as a failure mode. This fits their operational view.

      *   **Case 3: Disposition Destruction (Identity/Preferences).**
          *   *Mechanism:* Learning you are a "defector" in a PD makes you defect, destroying the "cooperator" disposition that yields higher utility.
          *   *Analysis:* This touches on "Preferences over Beliefs" or "Identity." If utility depends on *who you are* and information changes *who you are*, preferences are not fixed.
          *   *Theorem Target:* Fixed Preferences / Stability of the Agent.
          *   *Verdict:* Strong structural objection. EUT assumes a stable utility function. If info changes the utility function, the theorem doesn't apply.

      *   **Case 4: Unawareness/Concept Change (State Space).**
          *   *Mechanism:* Learning a new concept expands the state space $\Omega$. You can't "act as if you didn't know" because you can't un-think the concept.
          *   *Analysis:* This is the "Unawareness" literature (Dekel, Lipman, Rustichini, etc.). Standard probability spaces assume logical omniscience or a fixed $\sigma$-algebra.
          *   *Theorem Target:* Fixed State Space / Partition Structure. Good's theorem assumes the signal is a partition of a *given* $\Omega$. If $\Omega$ grows, the math breaks.
          *   *Verdict:* **Fatal.** This is the deepest theoretical challenge. It attacks the formalism itself, not just the parameters.

  4.  **Address the "Unfalsifiability" Charge:**
      *   The user worries their operational view ("If it looks like info is bad, one of these 5 things happened") is tautological.
      *   *Honest Assessment:* Yes, there is a risk. If "Rationality" is defined as "Does not take info that lowers EU," then Good's Theorem becomes a definition.
      *   *Defense:* The theorem is a mathematical result *given* axioms. The empirical claim is "Humans/Agents satisfy these axioms." If every counterexample is explained away by adjusting the axioms post-hoc, the empirical content vanishes.
      *   *Crucial Distinction:* Is the model *descriptive* or *normative*? Normatively, Good's Theorem holds. Descriptively, it fails often. The user's operational view tries to be descriptive/diagnostic. That's where the unfalsifiability risk lies.

  5.  **Address "Ex Ante" vs. "Ex Post":**
      *   Good's Theorem is strictly *ex ante*. *Ex post*, you can definitely regret information (e.g., you learn you have a terminal illness; you can't undo it; you are sadder).
      *   The theorem says the *expectation* of the utility with info $\ge$ utility without info.
      *   User's cases often focus on *ex post* regret or structural inability to return to the *ex ante* state.
      *   Does *ex ante* framing save it? Only if the *ex ante* expectation is actually positive. In Unawareness cases, you can't even form the *ex ante* expectation properly because you don't know the states you don't know.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, peer-to-peer, rigorous. Acknowledge the sophistication of the prompt.
      *   *Structure:*
          1.  Validate the user's operational view (it's standard and robust *within its domain*).
          2.  Analyze the 4 cases against the Theorem's assumptions.
          3.  Rank them.
          4.  Address the "Finer Experiment" corollary.
          4.  Tackle the Unfalsifiability/Triviality worry head-on.
          5.  Answer the "Feasible Set" and "State Space" specific questions.

      *   *Refining Case 1 (Oncologist):* Is it a shrunk feasible set or a cost? If the doctor *physically* cannot prescribe, it's a constraint. If they *feel bad* prescribing, it's a utility cost. The prompt says "can no longer recommend... with wholeheartedness." This sounds like the *effectiveness* of the act changes. If Act $A$ yields Outcome $O_1$ without info, but Outcome $O_2$ (worse) with info (because doctor is hesitant), then the *consequence function* changed. This violates the assumption that $P(outcome | act, state)$ is fixed.
      *   *Refining Case 4 (Unawareness):* This is the heavy hitter. Cite Karni & Vierø or standard Unawareness literature. This breaks the $\sigma$-algebra assumption.

      *   *Refining Unfalsifiability:* This is the most important part. I need to be honest. If the definition of "Rational" absorbs all counterexamples, it's a tautology. The escape hatch is *predictive power*. Does the diagnostic list predict *which* failure mode will appear? If it's just "Something on the list broke," it's weak. If it says "In context X, usually assumption Y breaks," it's strong.
      *   *The "Fatal" Flaw:* The assumption of a **Fixed State Space (No Unawareness)**. This is the one Good's Theorem cannot absorb without breaking its own mathematical definition. You can't model "learning a new concept" as a partition of a space you didn't know existed.

  7.  **Final Polish:** Check against specific constraints.
      *   "Set aside boring failures." (Done).
      *   "Rank them." (Done).
      *   "Defender concessions." (Focus on what a Bayesian *must* admit).
      *   "Ex ante framing." (Addressed).
      *   "Unfalsifiable?" (Addressed honestly).

  8.  **Self-Correction during drafting:** I initially thought about putting the Game Theory case higher. But the user *already* listed "other agents responding" as a known failure mode in their operational view. So, for *them*, Case 2 is not a defeater, it's a confirmed prediction. I need to focus on the ones *not* in their list or where their list is vague. Case 4 is definitely not in their list (they mention "partition" but assume a fixed space). Case 1 (Feasible set) is explicitly questioned by them ("information shrinks the feasible act set"). I need to be precise on whether EUT allows action sets to depend on info. Standard EUT: No. Real world: Yes.

      *Wait, one nuance:* Good's Theorem assumes the action set $A$ is available *after* the signal. If the signal removes an action, the theorem fails. But usually, we model "psychological inability" as a cost. I need to distinguish between "I can't do it" (constraint) and "I won't do it because it hurts" (utility). The Oncologist case sounds like "I can't do it effectively." That changes the mapping from Act to Outcome. That violates the fixed consequence assumption.

      *Unfalsifiability:* I need to be careful not to say "It is unfalsifiable." I should say "It risks becoming a research program rather than a hypothesis" (Lakatos style). The "Hard Core" is EUT. The "Protective Belt" is the 5 failure modes. If the belt absorbs everything, the core is insulated from refutation.

      *Let's finalize the ranking:*
      1.  Unawareness (State Space) - Fatal. Breaks the math.
      2.  Disposition/Identity (Preferences) - Very Strong. Breaks the agent model.
      3.  Oncologist (Action/Consequence Mapping) - Strong. Breaks the fixed world assumption.
      4.  Commitment (Game Theory) - Weak (for this user). They already acknowledge this.

      *Wait, re-reading the prompt:* The user asks: "Has my operational version of the view been qualified into something unfalsifiable?" I need to answer this directly. Yes, if "Rationality" is defined by adherence to the theorem, then the theorem is true by definition. If "Rationality" is independent, then the theorem is falsifiable. The operational view tries to save the theorem by reclassifying counterexamples. This *is* the definition of a protective belt. I should admit this is a feature of normative theory but a bug for descriptive claims.

      *Okay, ready to write.*
answer: |-
  This is an exceptionally sharp framing of the problem. You have correctly identified that Good's Theorem (1967) is less an empirical claim about the world and more a structural property of the Bayesian Expected Utility (EU) framework. Your "operational version" functions as a *protective belt* around the *hard core* of EU theory.

  You asked for the case against it, specifically focusing on structural defeaters, concessions a defender must make, and the risk of unfalsifiability. Here is the breakdown.

  ### 1. Analysis of Your Four Cases

  To evaluate these, we must look at the specific axioms Good's Theorem relies on. The theorem holds if:
  1.  **Fixed State Space ($\Omega$):** The set of possible worlds is fixed and known.
  2.  **Fixed Action Set ($A$):** The available acts do not depend on the information received.
  3.  **Fixed Preferences ($u$):** Utility is defined over outcomes, not beliefs or information states.
  4.  **Single Agent:** No strategic interaction where information alters others' moves (unless fully internalized).
  5.  **Costless Information:** No direct disutility from the signal itself.

  Here is the ranking of your cases from **Fatal** (breaks the theorem's mathematical preconditions) to **Awkward** (fits within the failure modes you already listed).

  #### **Rank 1: The Unawareness Case (Concept Change)**
  *   **Verdict:** **Fatal.**
  *   **Target:** Fixed State Space ($\Omega$).
  *   **Analysis:** This is the strongest objection. Good's Theorem assumes information is a *partition* of a pre-existing $\sigma$-algebra. You cannot model "learning a new concept" (e.g., a new medical symptom, a new strategic distinction) as a refinement of a partition if the cells of that partition were previously unimaginable. This is the literature on **Unawareness** (Dekel, Lipman, Rustichini; Karni & Vierø).
  *   **Why it breaks the theorem:** If the state space expands, you cannot calculate the *ex ante* expected utility of the information because the "without information" state involves a smaller $\Omega$ than the "with information" state. The two expected utilities are defined over different domains and are incommensurable. You cannot "act as if you had not learned it" because you cannot formulate the act in the original language.
  *   **Defender's Concession:** A strict Bayesian must concede that standard probability theory cannot model the discovery of new contingencies. To save the theorem, they must assert that the agent *implicitly* knew the possibility all along (logical omniscience), which is descriptively false. If you reject logical omniscience, Good's Theorem does not apply.

  #### **Rank 2: The Disposition/Identity Case**
  *   **Verdict:** **Very Strong.**
  *   **Target:** Fixed Preferences ($u$) / Stability of the Agent.
  *   **Analysis:** This targets the assumption that the utility function is stable across information states. If learning "I am the sort of person who defects" changes your preferences such that you *must* defect, your utility function has shifted *because* of the signal.
  *   **Why it breaks the theorem:** Good's Theorem compares $E[u(a^*|s)]$ vs $E[u(a^*)]$. This assumes $u$ is the same function in both terms. If the information changes *who you are* (your dispositions), $u_{post} \neq u_{pre}$. The theorem compares apples to oranges.
  *   **Defender's Concession:** A defender must argue that "true" preferences were always there, and the information merely revealed them. But if the *revelation* causally destroys the capacity to maximize the original preference (e.g., you wanted to be trusting, but knowing you are suspicious makes you act suspiciously, ruining the trust), the *ex ante* optimum is unreachable *ex post*. This is a violation of **dynamic consistency** that cannot be resolved by updating alone.

  #### **Rank 3: The Oncologist Case (Feasible Set Shrinkage)**
  *   **Verdict:** **Strong (but model-dependent).**
  *   **Target:** Fixed Action Set ($A$) or Fixed Consequence Function.
  *   **Analysis:** You suggest the feasible set shrinks. In strict EU theory, actions are physical movements. If the doctor can physically write the prescription, the action exists. However, if "wholeheartedness" is a necessary condition for the *outcome* (patient recovery), then the *consequence function* has changed. Act $A$ yields Health $H_1$ without info, but Health $H_2$ (worse) with info, because the doctor's hesitation affects the patient.
  *   **Why it breaks the theorem:** The theorem assumes $P(\text{outcome} | \text{act}, \text{state})$ is fixed. If the information changes the efficacy of the act (by altering the agent's psychology which is part of the causal chain), the mapping from Act to Outcome is information-dependent.
  *   **Defender's Concession:** A defender will try to model this as a "psychic cost" of information (moving it to your "not really free" bucket). But if the constraint is absolute (cannot perform the act effectively), it is structurally a shrinkage of the *effective* action set. A defender must concede that if information alters the *causal power* of the agent, the theorem's assumption of a fixed world is violated.

  #### **Rank 4: Ignorance as Commitment (Game Theory)**
  *   **Verdict:** **Awkward (for you).**
  *   **Target:** Single Agent Assumption.
  *   **Analysis:** You already listed "other agents are responding" in your operational failure modes. This is the classic Schelling point.
  *   **Why it fits your view:** This is not a defeater of Good's Theorem *per se*, but a defeater of its *application* to multi-agent settings. Good's Theorem is a single-agent result. In game theory, information changes the equilibrium.
  *   **Defender's Concession:** None needed. This is already in your diagnostic list. It confirms your operational view rather than challenging it.

  ---

  ### 2. The "Ex Ante" Framing and the Finer Experiment Result

  You asked if the *ex ante* framing is doing real work and whether the "finer experiment" result (Blackwell's Theorem companion) is exposed at the same points.

  **Ex Ante Framing:**
  The *ex ante* framing saves the theorem from **ex post regret**. You can always regret information *ex post* (e.g., you learn you have a terminal illness; you are sad; you can't undo it). Good's Theorem only claims the *expectation* of utility is higher.
  *   **Where it fails:** In the **Unawareness** case, you cannot form a coherent *ex ante* expectation. You cannot assign a probability to a state you cannot conceive. Therefore, the *ex ante* calculation is undefined, not just negative. The *ex ante* framing cannot save the theorem here because the math required to do the framing is missing.

  **Finer Experiment Result:**
  The result that "a finer partition is never worth less than a coarser one" is **more vulnerable** than the basic value-of-information result.
  *   **Why:** It relies even more heavily on the Fixed State Space assumption. To compare a "finer" partition to a "coarser" one, they must be partitions of the *same* set. If acquiring the finer information actually *expands* the set (Unawareness), the comparison is mathematically invalid.
  *   **Disposition Case:** If a finer signal destroys your disposition, a coarser signal (that leaves you ignorant) might preserve it. Thus, a finer experiment is worth *less*. This violates Blackwell ordering.

  ---

  ### 3. The Unfalsifiability Charge

  This is the most critical part of your query. *Has your operational version been qualified into something unfalsifiable?*

  **Honest Answer:** **Yes, there is a severe risk of tautology.**

  Here is the structure of the problem:
  1.  **Normative Claim:** "If you satisfy Axioms X, Y, Z, then Information Value $\ge 0$." (This is a mathematical truth, unfalsifiable because it's a proof).
  2.  **Descriptive Claim:** "Rational agents satisfy Axioms X, Y, Z." (This is empirically falsifiable).
  3.  **Your Operational View:** "If Information Value $< 0$, then the agent violated X, Y, or Z."

  The trap is this: If you define "Rational" as "Satisfies X, Y, Z," then your operational view is true by definition. Every time you see a negative value of information, you simply declare the agent "irrational" or the cost "non-zero." This insulates the theory from empirical refutation (a Lakatosian "protective belt").

  **Where it becomes a defect:**
  It becomes a defect if the "failure modes" are so flexible they can explain *anything* post-hoc without predicting *which* failure mode will occur *ex ante*.
  *   **Example:** If an agent rejects free info, do you predict "Ah, they must have belief preferences"? Or do you just say "Something on the list broke"?
  *   **The Fix:** To avoid unfalsifiability, your operational view must make **cross-case predictions**. For example: "In single-agent physical tasks, info will never appear harmful. In social/identity tasks, info will often appear harmful due to preference instability." If your view can predict *which* axiom will break in *which* context, it is scientific. If it merely categorizes past failures, it is taxonomic.

  **What a Defender Must Concede:**
  A sophisticated defender (e.g., a Savagean Bayesian) will concede the following:
  1.  **Unawareness is outside the model:** They admit standard EU cannot handle "growing awareness." They treat this as a limitation of the *model*, not the *norm*. They say, "You should have assigned probability to the unknown unknown." (Which is impossible).
  2.  **Psychic Costs are hard to measure:** They concede that distinguishing "information changed the world" from "information hurt feelings" is empirically difficult.
  3.  **The "Rationality" Definition:** They admit that if an agent consistently takes information that lowers their welfare (by their own lights), we must either say they are irrational or that we have mis-specified their utility function. This is the **Quine-Duhem problem** applied to decision theory.

  ---

  ### 4. Direct Answers to Your "Most Important" Questions

  **Q: Has my operational version been qualified into something unfalsifiable?**
  **A:** It is on the brink. It remains falsifiable *only if* you treat the axioms (Fixed State, Fixed Preferences, etc.) as independent empirical hypotheses. If you treat them as definitions of rationality, the view becomes a tautology. To keep it honest, you must allow for the possibility that an agent is rational *and* the theorem fails (which implies the theorem is not universally normative).

  **Q: Is that a defect for a claim of this kind?**
  **A:** For a **normative** claim (how one *ought* to decide), it is not a defect; it is a feature. You want the norm to be robust. For a **descriptive** claim (how agents *do* decide), it is a fatal defect. Your operational view mixes the two. It uses the normative theorem to diagnose descriptive failures. This works well for a reading group, but it risks becoming a "just-so story" generator if every counterexample is absorbed by redefining the agent's constraints.

  **Q: Can the feasible set genuinely shrink?**
  **A:** **Yes.** In standard EU, acts are abstract functions from States to Outcomes. In reality, acts are psychological/physical processes. If information induces a psychological state (e.g., anxiety, loss of confidence) that physically or cognitively prevents the execution of a previously available act, the feasible set has shrunk. A defender must model this as a "cost," but if the cost is infinite (absolute inability), it is indistinguishable from a constraint. The theorem assumes the action set $A$ is exogenous to the signal $\sigma$-algebra. If $A(\sigma)$ depends on the signal, the theorem fails.

  **Q: Can information be non-partitional (Unawareness)?**
  **A:** **Yes, and this is the hardest hit.** Standard information structures are sub-$\sigma$-algebras of a fixed $\Omega$. Unawareness implies $\Omega_{pre} \subset \Omega_{post}$. There is no mathematical way to represent this within the standard framework without assuming the agent was "irrational" for not knowing $\Omega_{post}$ initially. This is not a failure of the agent; it is a failure of the **state space formalism**. This is the one case where your operational view cannot simply say "the agent updated badly." The *space* changed.

  ### Summary Recommendation for Your Group

  1.  **Grant the Oncologist and Disposition cases** as genuine structural limits. They show that **Preferences** and **Action-Efficacy** are not fixed parameters but functions of information. This violates the *ceteris paribus* conditions of Good's Theorem.
  2.  **Elevate the Unawareness case.** This is the theoretical ceiling. It shows Good's Theorem is local to a fixed logical universe. It cannot handle scientific discovery or conceptual innovation.
  3.  **Refine your Operational View.** To avoid unfalsifiability, explicitly state: *"Good's Theorem is a normative baseline for fixed-state, fixed-preference environments. Deviations are not just 'failures' but indicators of which structural assumption (State, Preference, Action, Agency) is unstable in this context."*
  4.  **Concede the Ex Ante Limit.** Acknowledge that in Unawareness cases, the *ex ante* evaluation is undefined, not just positive.

  If you do this, you move from "defending Good's Theorem" to "mapping the boundaries of Bayesian Decision Theory," which is a much more fruitful position for a reading group.
