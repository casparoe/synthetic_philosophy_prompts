prompt: |-
  Me and my friend spent like two hours last night arguing about when consent actually counts and got nowhere, so here are my gut verdicts on a bunch of cases — please find me the principle behind them, if there is one.

  1. Guy tells a woman he's single; he's married; she says afterwards she'd have said no. Invalid.
  2. Woman signs up for a paid drug trial. The recruiter doesn't mention that the trial is funded by the company that sat on the data about the exact side effect she's being warned about. She genuinely wouldn't have cared — she's there for the money. I say valid, gross but valid. Friend says invalid.
  3. Tenant sleeps with her landlord. He never threatens her, never says a word about rent. She does it because she knows he's evicted two people who said no and she has nowhere else to go. Invalid.
  4. A very sharp 16-year-old with a serious illness consents to a risky treatment over her parents' objection; she understands the numbers better than they do. Valid.
  5. Someone clearly drunk at a party consents to sex, is holding a conversation fine, and next day says yeah I wanted to, no regrets. Valid — I think later endorsement is evidence the earlier consent was real. Friend says that's just post-hoc rationalization.
  6. Couple uses one of those consent apps where you both tap yes beforehand. She taps yes because saying no would mean a two-hour fight. Invalid.
  7. Negotiated kink scene: she consents to a specific script, the dominant quietly departs from it in a way she enjoys and never notices. Invalid, even though nothing bad happened.

  The thing I've been defending is: consent is valid iff you'd have said yes anyway had you known everything, and nobody made your alternatives worse. But I cant tell why 3 and 6 come out the same for me under that, and whether 2 and 5 really fit it. And the one I keep flip-flopping on: she says yes because she's wrongly convinced he'll get violent if she refuses — he isn't violent and never threatened anything.

  Is there one principle — maybe a repaired version of mine — that gets most of these? Say what it predicts for a case I haven't listed. Please commit to one account and tell me, defintely and with reasons, which of my verdicts it forces me to drop, and where you think your own account is most likely wrong.
