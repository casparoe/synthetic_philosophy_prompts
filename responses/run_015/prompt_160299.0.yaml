answer: |-
  Here is the principle that best unifies your intuitions, repaired to handle the contradictions you identified. I will call it **The Volitional Authority Account**.

  ### The Principle: The Volitional Authority Account

  Consent is a **transfer of authority**, not merely an agreement of preferences. For consent to be valid, three conditions must be met at the time of the act:

  1.  **Capacity:** The agent must possess sufficient cognitive sovereignty to understand the nature and scope of the act they are authorizing.
  2.  **Voluntariness:** The authorization must not be extracted via **illegitimate pressure**. This includes explicit threats *and* the exploitation of essential dependencies (power dynamics where refusal carries disproportionate, life-altering costs).
  3.  **Material Correspondence:** The act performed must match the scope of the authorization. Deception invalidates consent only if it concerns **material facts** (facts that define the nature of the act or its primary risks), not incidental details.

  **Why this fixes your theory:**
  Your original theory ("Valid iff you'd have said yes anyway... and nobody made alternatives worse") fails on Case 7 (Kink). In Case 7, she enjoyed the deviation, so counterfactually she might have said "yes" to the *outcome*, and his deviation didn't make her alternatives "worse." Yet you correctly judged it **Invalid**.

  The *Volitional Authority Account* fixes this: Consent is about **control**, not just welfare. In Case 7, he acted outside the scope of the authority she granted. It doesn't matter that she liked the result; he violated her sovereignty.

  ### How It Resolves Your Conflicts

  **Cases 3 (Landlord) & 6 (Consent App): Why are they the same?**
  Under your old theory, Case 3 is tricky because the landlord didn't *make* her homeless; the housing market did. But under **Voluntariness**, both cases involve **illegitimate pressure**.
  *   **Case 3:** The landlord exploits an essential dependency (housing). Refusal carries a disproportionate cost (homelessness). This negates voluntariness.
  *   **Case 6:** The partner exploits an emotional dependency (peace in the relationship). Refusal carries a disproportionate cost (a two-hour fight). This also negates voluntariness.
  *   **Verdict:** Both are **Invalid**. The principle unifies them as "Coercion via Exploitative Dependency."

  **Case 2 (Drug Trial): Does it fit?**
  Yes. The funding source is **immaterial** to the nature of the act (taking the drug) and the primary risk (side effects). She had Capacity and Voluntariness. The deception was incidental, not material.
  *   **Verdict:** **Valid**.

  **The Flip-Flop Case (Mistaken Fear of Violence)**
  *Scenario:* She says yes because she's wrongly convinced he'll get violent if she refuses. He isn't violent and never threatened anything.
  *   **Analysis:** Did he apply illegitimate pressure? No. Did he exploit a dependency? No. Is the deception material? There is no deception; her fear is internal.
  *   **Verdict:** **Valid**.
  *   **Reasoning:** Consent protects against *violations by others*, not against our own internal anxieties unless those anxieties are weaponized by the other party. Since he created no threat and exploited no power dynamic, her authority was not compromised by *him*. It is a tragedy, but the consent stands.

  ### A New Case Prediction

  **Case 8: The "Therapist" Recommendation**
  A doctor tells a patient, "I strongly recommend this surgery; most people in your condition do it." The doctor does not mention that he gets a $5,000 bonus for every surgery he performs. The patient consents. Later, she finds out about the bonus and says, "I would have sought a second opinion if I knew that."

  *   **Prediction:** **Invalid**.
  *   **Reasoning:** This is **Material Deception**. Unlike the drug trial funding (Case 2), this financial incentive directly conflicts with the doctor's fiduciary duty and alters the nature of the "recommendation." It corrupts the information upon which she based her authorization. Under the Volitional Authority Account, her authority was compromised because the "terms" of the advice were falsified regarding a material conflict of interest.

  ### The Verdict You Must Drop

  To maintain logical consistency with this principle (and indeed, with almost any robust ethical framework), you must drop your verdict on **Case 5 (The Drunk Consent)**.

  **Your Verdict:** Valid (because she could converse and endorsed it later).
  **Principle's Verdict:** **Invalid**.

  **Reasons:**
  1.  **Capacity at Time T:** Consent is a *contemporaneous* transfer of authority. Intoxication, by definition, degrades cognitive sovereignty. The fact that she could "hold a conversation" proves functional speech, not necessarily the capacity to weigh risks and authorize bodily intrusion.
  2.  **The Ratification Error:** You argue that "later endorsement is evidence the earlier consent was real." This is logically flawed. I can endorse a decision today that I was tricked into making yesterday. My current sober self can agree with my past drunk self, but that doesn't mean the past self *had the authority* to bind the body at that moment.
  3.  **Inconsistency with Case 4:** In Case 4, you validate the 16-year-old because she "understands the numbers better than [her parents]." You prioritize **understanding**. In Case 5, you prioritize **outcome/regret**. You cannot hold that understanding validates consent in Case 4 but impairment doesn't invalidate it in Case 5. If capacity is the gatekeeper, alcohol locks the gate regardless of how well the person talks.

  ### Where My Account Is Likely Wrong

  I am committing to the **Volitional Authority Account**, but I must admit where it is vulnerable.

  **The Problem of Paternalism (Case 5 & 4):**
  My account forces me to invalidate Case 5. But this creates a paternalistic problem. If a woman is slightly buzzed, fully enthusiastic, and furious at the suggestion that she "couldn't consent," my principle still overrides her current judgment to protect her past sovereignty. It risks treating women as incapable agents who need the state (or ethics) to protect them from their own choices. There is a strong argument that **Agency** includes the right to make impaired choices, provided no harm is done. By drawing a hard line at intoxication, I may be prioritizing "safety" over "liberty."

  **The Problem of "Materiality" (Case 2 & 8):**
  Distinguishing between "material" and "immaterial" lies is notoriously difficult. In Case 2, I said funding is immaterial. But what if that funding suggests the data was massaged? The line is fuzzy. A strict Authority Account can become overly legalistic, invalidating consent on technicalities (like the doctor's bonus) even when the patient genuinely wanted the procedure and suffered no harm. It risks valuing the *purity of the transaction* over the *well-being of the person*.

  **Summary:**
  Adopt the **Volitional Authority Account**. It explains why the Kink case (7) is invalid despite enjoyment, and why the Landlord (3) and Fight (6) cases are both coercive. But to make it work, you must concede that **alcohol voids capacity**, regardless of how well the conversation went or how she feels the next morning.
