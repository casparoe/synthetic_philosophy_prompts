  2.  **Deconstruct the Philosophical Concepts (for the plan):**
      *   *Knowledge Ascription:* When do we say "S knows that p"?
      *   *Pragmatic Encroachment (PE):* Knowledge depends on practical stakes. High stakes = harder to know. (Stanley, Fantl & McGrath). *Key:* The subject's situation matters.
      *   *Epistemic Contextualism (EC):* Knowledge ascriptions depend on the conversational context of the *attributor* (the person saying "you know"). Standards shift based on what's relevant in the conversation. (Cohen, DeRose, Lewis). *Key:* The speaker's context matters.
      *   *The Tension:* In the climate scenario, does the researcher *fail* to know because the stakes are high for her/the panel (PE), or does the panel *attribute* knowledge differently because their conversational standards are high (EC)?
      *   *The Trap:* Students often think "High Stakes" just means "Serious Conversation." Need to separate the *cost of being wrong* (PE) from the *salience of error possibilities* (EC).

  3.  **Develop the Running Scenario:**
      *   *Subject:* Dr. Aris Thorne (Climate Researcher).
      *   *Proposition (p):* "The permafrost methane feedback loop has crossed the irreversible threshold."
      *   *Evidence:* Preliminary, robust but not peer-reviewed. (95% confident).
