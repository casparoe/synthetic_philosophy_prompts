      *   **Constraint 2:** Teaching plan/architecture, not just explanation. Sequence matters. Dependencies must be explicit.
      *   **Constraint 3:** PE and EC must emerge as *competing* explanations, not synonyms.
      *   **Constraint 4:** Identify scenario features (must have/must lack). Specifically, no obvious false belief.
      *   **Constraint 5:** Map likely misconceptions (especially stakes vs. context collapse, relativism about facts) and specify *where* to intercept them.
      *   **Constraint 6:** One specific check-for-understanding question at the end.
      *   **Constraint 7:** State what formal apparatus to *exclude* (safety, invariantism, etc.).
