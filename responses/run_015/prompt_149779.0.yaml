          *   *Wait, nuance:* PE usually says the *truth conditions* of "Aris knows" change based on Aris's stakes. EC says the *truth conditions* change based on the Attributor's context.
          *   *Scenario tweak:* To make them compete, we need to look at whether Aris herself claims knowledge or whether the Panel attributes it. Let's focus on the question: "Can Aris sincerely assert 'We know this'?"
