answer: |-
  # Teaching Plan: Pragmatic Encroachment vs. Epistemic Contextualism
  **Session Duration:** 90 Minutes
  **Target Audience:** Political Theory Students (Rawls/Foucault background, no Epistemology)
  **Running Scenario:** Dr. Aris Thorne, Climate Researcher.
  **Proposition (p):** "The permafrost methane feedback loop has crossed the irreversible threshold."
  **Evidence:** Preliminary, robust, 95% confidence, not yet peer-reviewed. Truth value: *True* (fixed for the session).

  ## I. Scenario Architecture & Constraints
  Before sequencing the session, you must rigidly define the scenario to prevent conceptual collapse.

  **Features the Scenario MUST Have:**
  1.  **Fixed Evidence:** Aris's data and cognitive state must remain identical in both settings. This isolates the external variables (stakes and context) as the only causes for variation in knowledge ascription.
  2.  **Fixed Truth:** You must stipulate that *p* is true. If students suspect the data is actually false, they will attribute the failure of knowledge to accuracy rather than stakes or context.
  3.  **Distinct Stakeholders:**
      *   **Panel:** Direct power to allocate billions. Error = Catastrophic waste or inaction. (High Practical Stakes).
      *   **Journalists:** No direct policy power. Error = Loss of credibility/trust. (Mediated/Lower Practical Stakes).

  **Features the Scenario MUST Lack:**
  1.  **No "Social Context" Ambiguity:** Do not allow "context" to mean "social setting" (e.g., formal room vs. press conference). This is the primary source of the misconception that Contextualism is just about social norms.
  2.  **No Obvious False Belief:** Do not hint that Aris might be wrong. The tension must be about whether her *evidence* suffices for *knowledge*, not whether her belief is correct.
  3.  **No Ethical Obligation Confusion:** Ensure students do not confuse "She shouldn't *say* it" (prudence/ethics) with "She doesn't *know* it" (epistemology).

  ---

  ## II. Session Sequence & Dependencies

  ### Phase 1: The Invariantist Baseline (00:00 – 00:15)
  **Goal:** Establish the pre-theoretical intuition that evidence alone usually determines knowledge.
  **Activity:** Present Aris's evidence (95% confidence, robust models). Ask: "In a vacuum, does Aris know *p*?"
  **Expected Consensus:** Yes.
  **Dependency:** You must secure this "Yes" to create a baseline. If they say "No" here, the subsequent theories have nothing to "encroach" upon or contextualize.
  **Instruction:** Explicitly state: "For the next hour, assume her evidence is fixed. We are not questioning her math; we are questioning the *status* of her claim."

  ### Phase 2: Introducing Pragmatic Encroachment (PE) (00:15 – 00:35)
  **Goal:** Demonstrate that *practical stakes for the subject* alter knowledge status.
  **Deployment:**
  1.  **Panel Setting:** Ask: "Given the billions at stake, can Aris claim she *knows* *p* to the Panel?"
  2.  **Intuition Pump:** Most will say "No, she needs more proof."
  3.  **Theoretical Move:** Introduce PE. Explain that knowledge is not just about evidence/truth, but about **actionability**. If the cost of being wrong is high, the evidence threshold for "knowledge" rises.
  4.  **Key Distinction:** Emphasize that this is about **Aris's situation**. The stakes belong to the decision-maker (Aris/Panel).
  **Misconception Interception (Point A):**
  *   *Likely Error:* Students will argue, "She shouldn't say it because it's irresponsible."
  *   *Interception:* Stop immediately. Clarify: "We are not asking if it is *ethical* to speak. We are asking if the proposition 'Aris knows' is *true*. PE claims the truth of 'knows' depends on the cost of error."
  *   *Reason:* Political theorists default to normative ethics. You must force them into truth-conditional semantics without using that jargon.

  ### Phase 3: Introducing Epistemic Contextualism (EC) (00:35 – 00:55)
  **Goal:** Demonstrate that *conversational standards of the attributor* alter knowledge ascription.
  **Deployment:**
  1.  **Journalist Setting:** Ask: "Aris speaks to journalists. The stakes are lower (no immediate budget). But the journalists ask: 'But how can you be sure? Models have been wrong before!'"
  2.  **Theoretical Move:** Introduce EC. Explain that the word "knows" changes meaning like "tall" or "flat." It depends on what **error possibilities are salient in the conversation**.
  3.  **Key Distinction:** Emphasize that this is about the **Speaker's/Audience's conversation**, not the Subject's stakes. Even if Aris has low stakes, if the *Journalists* make error salient, "Aris knows" becomes false *in that conversation*.
  **Misconception Interception (Point B):**
  *   *Likely Error:* Collapsing Stakes into Context. "The journalists raise the stakes by asking hard questions."
  *   *Interception:* Halt. Draw a line on the board. **Left Side: Cost of Action (PE).** **Right Side: Salience of Error (EC).** Explain that journalists can make error *salient* (Context) without increasing the *financial cost* of being wrong (Stakes).
  *   *Reason:* This is the critical philosophical separation. If they conflate salience with stakes, the theories become indistinguishable.

  ### Phase 4: The Clash & Divergence (00:55 – 01:15)
  **Goal:** Force the theories to compete by isolating variables.
  **Activity:** Introduce a **Third Condition: The Private Notebook.**
  *   *Scenario:* Aris writes in her private lab notebook. No audience (Low Contextual Standards). No immediate policy action (Low Practical Stakes).
  *   *Scenario:* Aris writes in the Panel Briefing Document. High Audience Standards. High Practical Stakes.
  **The Competition:**
  1.  **Ask:** "In the Panel Briefing, why is the claim 'We Know' false?"
  2.  **PE Explanation:** It is false because the **cost of error** is too high for her evidence level. (Even if no one mentions error).
  3.  **EC Explanation:** It is false because the **conversational context** of the briefing room makes error possibilities relevant. (Even if the cost of error was low).
  **Commitment:** You must take the position that for Political Theory, **PE is the more dangerous tool for power analysis.**
  **Reason:** PE suggests knowledge is inherently political (tied to resources/stakes). EC suggests knowledge is linguistic (tied to discourse). For Foucault-influenced students, PE resonates with "power/knowledge," but you must warn them that EC is *not* Foucaultian discourse analysis; it is semantic.
  **Misconception Interception (Point C):**
  *   *Likely Error:* Interpreting EC as Relativism about Facts. "So the permafrost status changes depending on who talks?"
  *   *Interception:* Correct firmly. "The *permafrost* does not change. The *truth conditions for the word 'know'* change. Aris still has the same data. We are analyzing the label, not the climate."
  *   *Reason:* Political theorists often slide into ontological relativism. You must maintain epistemic realism to keep the distinction sharp.

  ### Phase 5: Synthesis & Check (01:15 – 01:30)
  **Goal:** Consolidate the distinction and assess understanding.
  **Activity:** Review the "Carrying Features."
  *   PE carries the **Cost of Being Wrong**.
  *   EC carries the **Mention of Being Wrong**.
  **Final Assessment:** (See below).

  ---

  ## III. Misconception Map & Interception Points

  | Misconception | Why it arises (Pol Theory Lens) | Precise Interception Point | Correction Strategy |
  | :--- | :--- | :--- | :--- |
  | **"Stakes = Context"** | Students view "context" as "social situation" (Panel vs. Press). Since the Panel has higher stakes, they assume the concepts are identical. | **Phase 3 (00:40)** | **The Journalist Pivot.** Explicitly construct the Journalist Q&A to have *low financial stakes* but *high error salience*. Force them to see the variables can move independently. |
  | **"Contextualism = Relativism"** | Students interpret shifting standards as shifting reality (constructivism). | **Phase 4 (01:05)** | **The Ontology Anchor.** Reiterate: "The methane is releasing regardless of the conversation. We are tracking the license to *claim* knowledge, not the fact of the release." |
  | **"PE is just Prudence"** | Students think PE means "She knows, but shouldn't say it." | **Phase 2 (00:25)** | **The Truth-Condition Hammer.** Insist: "PE claims she literally *does not know*. It is not about silence; it is about the state of her mind relative to the world." |

  ---

  ## IV. Excluded Formal Apparatus
  To maintain accessibility for non-epistemologists, you must explicitly **refuse** to introduce the following. If a student raises them, acknowledge them as "advanced machinery we are bracketing."

  1.  **Possible Worlds Semantics:** Do not draw worlds or discuss "nearest possible worlds." This distracts from the institutional focus.
  2.  **Safety and Sensitivity Conditions:** Do not introduce the technical definitions of safety (belief could not easily be wrong) or sensitivity (if p were false, S wouldn't believe it). These are invariantist tools that complicate the PE/EC distinction.
  3.  **Subject-Sensitive Invariantism (SSI):** Do not distinguish SSI from PE. Treat them as the same cluster for this session. Introducing the distinction adds semantic noise without political payoff.
  4.  **Scoreboard Dynamics:** Do not use Lewis's "scorekeeping" terminology. Use "Conversational Standards" instead.

  ---

  ## V. Check-for-Understanding Question
  **Do not use a definition question.** Use a diagnostic scenario that forces a choice between the mechanisms.

  **Question:**
  "Dr. Thorne is in a private meeting with a donor. The donor says, 'I don't care about the policy costs, I just want to know if the science is solid.' The donor does not raise any specific error possibilities, but the financial stakes for the donor are massive.
  According to **Pragmatic Encroachment**, does Thorne know *p*?
  According to **Epistemic Contextualism**, does Thorne know *p*?
  Explain *why* the verdicts differ or align based on the *source* of the pressure."

  **Correct Answer Key (for you):**
  *   **PE:** Likely **No Knowledge**. The donor's high stakes (if Thorne is acting on behalf of the donor or if the stakes attach to the subject's environment) raise the bar. (Note: PE debates whose stakes matter, but for this level, emphasize that *practical cost* is the driver).
  *   **EC:** Likely **Knowledge**. The conversational context explicitly *lowered* the standards ("I don't care about policy," "no error possibilities raised"). The attributor (donor) set a low bar.
  *   **The Test:** If the student answers based on "how serious the room feels," they have failed. If they answer based on "financial risk vs. conversational rules," they have succeeded.

  ---

  ## VI. Rationale for Pedagogical Choices
  1.  **Ordering (PE before EC):** Political theory students grasp *consequences* (stakes) faster than *semantics* (context). PE aligns with their Rawlsian concern for the impact of decisions on the vulnerable. EC is more abstract/linguistic. Building from the familiar (stakes) to the abstract (language) reduces cognitive load.
  2.  **Scenario Deployment:** Using the *same* researcher with *fixed* evidence is non-negotiable. If you change the evidence, students will attribute the knowledge failure to the data, not the theory. The divergence must come from the environment, not the subject.
  3.  **Commitment on Competition:** I have positioned the "Private Notebook" vs. "Panel Briefing" as the battleground. This is necessary because in the Panel/Journalist comparison alone, both theories often predict "No Knowledge." You need a case where Stakes are High but Context is Low (or vice versa) to prove they are distinct. The "Donor" question in the assessment finalizes this commitment.
  4.  **Refusal of Formalism:** Introducing "safety conditions" would require a 20-minute digression into modal logic. This would alienate the political theory students and obscure the institutional implications you want them to grasp. Keep the focus on *authority* and *assertion*.
