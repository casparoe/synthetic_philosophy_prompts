          *   *Better distinction for Pol Theory:* Focus on the *legitimacy of the claim*.
          *   PE: The claim is illegitimate because the practical risk is too high relative to evidence.
          *   EC: The claim is illegitimate because the conversational standard for 'know' has been raised by mentioning error possibilities.

      *   *Decision:* I will structure it so PE focuses on the *Researcher's* decision to act/speak based on her stakes. EC focuses on the *Panel's* willingness to accept the claim based on their conversational standards. This separates the "Actor" from the "Audience."

  7.  **Addressing Specific Constraints:**
