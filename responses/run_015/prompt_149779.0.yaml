      *   *Phase 1: Setup & Intuition Pump (15 mins).* Establish the case. Get pre-theoretical judgments.
      *   *Phase 2: The Invariantist Baseline (15 mins).* What would a standard "justified true belief" view say? (It should stay constant).
      *   *Phase 3: Introducing Pragmatic Encroachment (20 mins).* Focus on the *action* guided by knowledge. Stakes affect whether you can *act* on it as knowledge.
      *   *Phase 4: Introducing Contextualism (20 mins).* Focus on the *speech act* of attribution. Standards shift based on conversational salience.
      *   *Phase 5: The Clash & Synthesis (15 mins).* Distinguish them.
      *   *Phase 6: Assessment (5 mins).*

  5.  **Address Misconceptions:**
      *   *Misconception 1:* Stakes = Context. (Intercept in Phase 4).
      *   *Misconception 2:* Contextualism = Relativism about facts. (Intercept in Phase 4/5).
      *   *Misconception 3:* PE is just about ethics/prudence, not knowledge. (Intercept in Phase 3).

  6.  **Drafting the Plan - Section by Section:**

      *   *Scenario Features:* Needs to ensure the evidence is fixed. The *truth* is fixed. The *subject* is fixed. Only the *environment* changes.
