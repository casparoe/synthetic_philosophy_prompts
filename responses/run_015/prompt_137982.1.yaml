  0.40.

  Here is the decomposition of that credence based on the five factors you raised. **Reference Machine Dependence** carries the most weight (35% of my uncertainty); if simplicity is objective, the arbitrary constant $C$ is fatal for finite data, but if simplicity is observer-relative, it vanishes as a problem. **Uncomputability** accounts for 25%; unlike Bayes' rule, which is a coherence constraint on *any* prior, SI proposes a specific prior that cannot be instantiated, making it a regulative ideal rather than a usable norm. **Convergence Standard** is 20%; "truth in the limit" is too weak for finite agents, and SI's finite error bounds depend on that same problematic constant. **Unity of Occam's Razor** is 15%; if "simplicity" is a cluster concept (description length vs. parameter count vs. computational speed) rather than a single dimension, SI only captures one facet. **Computable Hypotheses** is 5%; unless physics is hypercomputable, restricting to Turing-computable functions is likely safe.

  You are more likely right about the substance of the disagreement, while your friend is right about the mathematical culture. Your friend treats SI as an asymptotic theorem where constants vanish, which is standard in CS theory; you are treating it as a normative epistemology where finite-data performance matters, which is standard in philosophy of science. The disagreement is over whether "correct formal account" means "asymptotically optimal" (friend) or "action-guiding for finite agents" (you). For SI to be treated like Bayes' rule, it needs to be action-guiding, so your worry about the constant is the relevant one.

  Bounded Solomonoff Induction (often called the Speed Prior or Levin Search) is a **change of subject**, not a friendly amendment. It changes the prior from $2^{-length}$ to $2^{-length - log(time)}$, which penalizes slow programs differently than hard-to-describe ones. This moves my number up to 0.55 for *practical agency* because it addresses the uncomputability and some machine-dependence issues, but it moves it down for *theoretical purity* because it introduces a new arbitrary parameter (the time penalty weight) without the same universal justification as Kolmogorov complexity.

  The sub-question I feel least sure about is **whether there is even one thing called "Occam's razor."** If simplicity is disunified—a mix of compressibility, computational efficiency, and causal sparsity—then no single formalism can be the "correct account." This would move my number toward 0.1. What would move it up is a proof showing that these different notions of simplicity converge on the same hypotheses for all physically realizable data distributions, independent of the reference machine.
