prompt: |-
  I serve on a three-person municipal ethics advisory panel for a mid-sized city (population approximately 400,000) that is revising its substance-use policy framework. Our mandate is evaluative rather than legislative: we must assess concrete proposals—maintaining prohibition with expanded pre-arrest diversion, adopting a Portugal-style administrative decriminalization model for personal-use possession, or legalizing cannabis through licensed supply with regulatory caps—before they advance to the city council. I want a reusable decision procedure, grounded in Philip Pettit's republican theory of freedom as non-domination and its distinction between arbitrary and non-arbitrary interference, that my panel can apply in roughly ninety minutes. The procedure should proceed in ordered stages: first, identifying whether a proposal creates, removes, or restructures powers of arbitrary interference over users, suppliers, and affected communities; second, testing whether institutional safeguards (transparency, contestability, proportionality, and reversibility) render any remaining interference non-arbitrary; third, assessing outcomes through a capabilities lens—specifically, which real freedoms are expanded or contracted—without reducing this step to a utilitarian aggregation. For each stage, specify what evidence would count as sufficient, where the procedure must halt with a negative recommendation, and where it necessarily yields to judgment because the issue is one of normative values rather than institutional design. Include a compact set of test scenarios for classifying borderline cases, and flag any point where the procedure is likely to misfire.

  Then run the procedure on three proposals: (1) retaining criminal prohibition for possession but instituting mandatory diversion-to-treatment for first offenses; (2) decriminalizing possession for personal use and substituting administrative referral for criminal sanctions, modeled on Portugal's framework; and (3) legalizing cannabis through state-licensed private retailers with age restrictions and potency limits. Include at least one case in which the procedure yields an unwelcome result—specifically, that a prohibition regime with robust judicial oversight and clearly defined statutory limits may qualify as non-arbitrary interference, whereas a legalization regime with discretionary licensing and weak mechanisms for public contestation may not. Finally, please separate what is settled in the philosophical literature on republican freedom and non-domination from what is genuinely contested—particularly whether commercial supply under legalization can avoid arbitrary domination by market actors, and whether applying the capabilities approach to drug policy inevitably imports contested comprehensive moral doctrines—and do not present any contested interpretation as if it were the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Member of a three-person municipal ethics advisory panel (mid-sized city, pop. ~400k).
      *   **Task:** Create a reusable decision procedure for evaluating substance-use policy proposals.
      *   **Theoretical Framework:** Philip Pettit's Republicanism (Freedom as Non-Domination), specifically the distinction between arbitrary and non-arbitrary interference. Also, incorporate a Capabilities Approach lens (without reducing to utilitarianism).
      *   **Time Constraint:** The procedure must be applicable in roughly 90 minutes.
      *   **Structure:** Three ordered stages (Arbitrary Interference Analysis, Institutional Safeguards Test, Capabilities Outcome Assessment).
      *   **Requirements:**
          *   Specify evidence standards for each stage.
          *   Identify halt points (negative recommendation).
          *   Identify judgment calls (normative vs. institutional).
          *   Include test scenarios for borderline cases.
          *   Flag potential misfires.
          *   Run the procedure on three specific proposals (Prohibition+Diversion, Decriminalization/Portugal, Legalization/Regulation).
          *   Include a specific constraint: One result must be "unwelcome" (e.g., Prohibition passes, Legalization fails based on procedural grounds).
          *   Distinguish settled vs. contested philosophical literature (especially regarding market domination and comprehensive doctrines).

  2.  **Deconstruct the Theoretical Framework:**

      *   *Pettit's Non-Domination:* Freedom is not just non-interference (negative liberty) but the absence of *arbitrary* interference. Interference is non-arbitrary if it tracks the interests and ideas of those affected (via democratic control/safeguards).
      *   *Arbitrary Interference:* Power exercised without regard for the interests of the subject, or without checks (transparency, contestability, etc.).
      *   *Capabilities Approach (Nussbaum/Sen):* Focus on what people are actually able to do and be. Avoid utilitarianism (aggregate happiness) in favor of substantive freedoms.
      *   *Tension:* Republicanism focuses on *status* and *institutional design*. Capabilities focuses on *outcomes* and *functionings*. The prompt asks to blend them without collapsing into utilitarianism.

  3.  **Drafting the Decision Procedure (The "Tool"):**

      *   *Time Management:* 90 minutes total. Roughly 25 mins per stage, plus intro/outro/deliberation.
      *   *Stage 1: Power Mapping (Arbitrary Interference).* Who has power over whom? Is it new, removed, or restructured?
          *   *Halt Condition:* If a proposal *increases* arbitrary power without justification, halt.
          *   *Evidence:* Statutory language, enforcement discretion data.
      *   *Stage 2: Safeguard Audit (Non-Arbitrariness).* Do the safeguards (transparency, contestability, proportionality, reversibility) exist?
          *   *Halt Condition:* If safeguards are structurally absent (e.g., no appeal process), halt.
          *   *Judgment Call:* What counts as "sufficient" contestability?
      *   *Stage 3: Capabilities Assessment.* Does this expand or contract real freedoms (health, social participation, security)?
          *   *Constraint:* Do not sum up "utility." Look at the baseline status of the vulnerable.
          *   *Misfire Flag:* Confusing capability expansion with mere preference satisfaction.
      *   *Test Scenarios:* Need borderline cases (e.g., mandatory treatment vs. voluntary).

  4.  **Running the Procedure on the Three Proposals:**

      *   *Proposal 1: Prohibition + Mandatory Diversion.*
          *   *Stage 1:* High interference (criminal law).
          *   *Stage 2:* If judicial oversight is robust and diversion is automatic/statutory (not discretionary), it *could* be non-arbitrary in Pettit's terms (law tracks interests, is known, contestable).
          *   *Stage 3:* Capabilities might be mixed (health up, liberty down).
          *   *Goal:* Make this pass Stage 2 to meet the "unwelcome result" constraint.
      *   *Proposal 2: Decriminalization (Portugal Style).*
          *   *Stage 1:* Removes criminal power, replaces with administrative.
          *   *Stage 2:* Dissuasion Commissions. Usually high on safeguards.
          *   *Stage 3:* High capability expansion (stigma reduced, health focused).
          *   *Goal:* Strong pass.
      *   *Proposal 3: Legalization (Licensed Retail).*
          *   *Stage 1:* Removes criminal power, introduces market power + regulatory power.
          *   *Stage 2:* *Crucial Step.* If licensing is discretionary and appeals are weak, this creates *new* arbitrary power (regulatory capture or market domination).
          *   *Goal:* Make this fail Stage 2 to meet the "unwelcome result" constraint.

  5.  **Addressing the Philosophical Distinctions (Settled vs. Contested):**

      *   *Settled:* Non-domination requires more than non-interference; arbitrary power is the enemy; safeguards make interference non-arbitrary.
      *   *Contested:* Can markets be dominating agents in the republican sense (private domination)? Does the Capabilities Approach require a specific list of goods (perfectionism) vs. democratic selection? Does "tracking interests" require actual consent or just structural alignment?

  6.  **Refining the Output (Self-Correction/Review):**

      *   *Check Constraint:* Did I ensure the "unwelcome result" (Prohibition passes, Legalization fails)? Yes, by focusing on the *institutional design* of the legalization licensing (discretionary) vs. the *statutory rigidity* of the prohibition/diversion (rule-bound). This aligns with Pettit's focus on arbitrariness rather than the *amount* of interference.
      *   *Check Time:* Is the procedure feasible in 90 mins? Need to keep the steps concise.
      *   *Check Tone:* Professional, advisory, philosophically rigorous but practical.
      *   *Check Capabilities:* Ensure I don't just say "health outcomes better." Must frame it as "expansion of substantive freedom to function."
      *   *Check Contested Philosophy:* Be careful not to assert Pettit's view on markets as absolute fact. Acknowledge the debate on private vs. public domination.

  7.  **Final Polish:**

      *   Organize with clear headings.
      *   Ensure the "Halt Points" are clear.
      *   Make sure the distinction between "Normative Judgment" and "Institutional Design" is explicit.
      *   Verify the "Unwelcome Result" logic is sound within the framework (i.e., a tyrannical law applied consistently is less "arbitrary" than a free law applied inconsistently, in strict republican terms, though republicans usually hate the tyrannical law. I need to nuance this: Pettit argues law *can* be non-dominating if it tracks common interests. So, a strict prohibition *could* be non-dominating if democratically endorsed and strictly rule-bound, whereas a legalization scheme with unbridled regulatory discretion is dominating. This fits the prompt's requirement).

  8.  **Drafting the Content:** (Mental Outline)
      *   Introduction: Contextualize the tool.
      *   The Procedure (Stages 1-3).
      *   Test Scenarios.
      *   Application to Proposals 1, 2, 3.
      *   Philosophical Appendix (Settled vs. Contested).

      *(Self-Correction during drafting)*: Wait, Pettit generally argues that criminalization *is* dominating because it puts the citizen at the mercy of the state. However, if the law is strictly controlled and tracks interests, it *might* qualify as non-arbitrary interference. The prompt asks for an "unwelcome result" where prohibition qualifies as non-arbitrary. I must construct the scenario such that the Prohibition model has *strict statutory limits* (no police discretion) while the Legalization model has *high regulatory discretion* (licensing boards with no appeal). This highlights the procedural nature of non-domination over the substantive nature of the policy.

      *Capabilities Check:* Ensure I don't slip into utilitarianism. Focus on "freedom to achieve X" not "achievement of X."

      *Contested Philosophy:* Be clear that applying Capabilities to drug policy is not standard republican procedure; it's a hybrid request. Acknowledge the tension.

  9.  **Final Review against constraints:**
      *   90-minute feasible? Yes, if steps are tight.
      *   3 Stages? Yes.
      *   Evidence/Halt/Judgment specified? Yes.
      *   Test Scenarios? Yes.
      *   Misfire flags? Yes.
      *   3 Proposals run? Yes.
      *   Unwelcome result included? Yes.
      *   Settled vs. Contested separated? Yes.

      *Let's write.*
answer: |-
  # Municipal Ethics Panel: Republican-Capabilities Decision Procedure (RCDP)

  **Purpose:** To evaluate substance-use policy proposals based on freedom as non-domination (Pettit) and substantive capability expansion, without collapsing into utilitarian aggregation.
  **Time Allocation:** 90 Minutes (25 mins per stage, 15 mins deliberation/vote).
  **Users:** 3-Person Ethics Advisory Panel.

  ---

  ## Part I: The Decision Procedure

  ### Stage 1: Power Mapping & Arbitrary Interference Audit (25 Minutes)
  **Objective:** Identify who holds power over whom and whether that power constitutes *arbitrary interference*.
  **Definition:** Interference is *arbitrary* if it is exercised without reference to the interests or ideas of those affected, or without effective checks. Interference is *non-arbitrary* if it tracks common interests and is rule-bound.

  **Procedure:**
  1.  **Map Agents:** List all actors granted new powers (Police, Courts, Admin Boards, Private Licensees, Communities).
  2.  **Map Subjects:** List all actors subject to power (Users, Suppliers, Residents).
  3.  **Identify Discretion:** Highlight areas where agents can act without predetermined rules (e.g., "may refer," "discretion to license," "probable cause").

  **Evidence Standard:**
  *   **Sufficient:** Statutory text, enforcement protocols, licensing bylaws.
  *   **Insufficient:** Policy intent statements, rhetorical commitments to "fairness."

  **Halt Point (Negative Recommendation):**
  *   If the proposal grants **new** powers of interference that are **unstructured** (no statutory criteria) and **unreviewable** (no appeal mechanism), halt and recommend rejection.
  *   *Rationale:* This creates structural domination regardless of benevolent intent.

  **Judgment Call Zone:**
  *   Determining whether a specific interest is "common" or "sectional." (e.g., Is "public order" a common interest or a cover for NIMBYism?) This is normative, not institutional.

  **Misfire Flag:**
  *   **The "Benevolent Dictator" Trap:** Do not assume low usage rates of power imply non-arbitrariness. A police officer *could* arrest anyone but chooses not to is still domination (the power exists). Focus on the *capacity* to interfere arbitrarily, not the frequency.

  ### Stage 2: Institutional Safeguards Test (25 Minutes)
  **Objective:** Determine if remaining interference is rendered *non-arbitrary* via institutional design.
  **Criteria:** Transparency, Contestability, Proportionality, Reversibility.

  **Procedure:**
  1.  **Transparency:** Are rules public and clear *ex ante*?
  2.  **Contestability:** Can subjects challenge decisions before an independent body?
  3.  **Proportionality:** Is the interference the minimum necessary to track the common interest?
  4.  **Reversibility:** Can the policy be undone or adjusted if it fails to track interests?

  **Evidence Standard:**
  *   **Sufficient:** Existence of ombudsman, administrative review tribunals, public reporting requirements, sunset clauses.
  *   **Insufficient:** General judicial review (too slow/costly for low-level offenses), internal police review.

  **Halt Point (Negative Recommendation):**
  *   If **Contestability** is functionally unavailable to the most vulnerable group (e.g., appeal costs exceed user income), halt and recommend rejection.
  *   *Rationale:* Non-domination requires effective, not theoretical, contestation.

  **Judgment Call Zone:**
  *   **Cost-Benefit of Safeguards:** How much administrative burden is too much? Balancing efficiency against due process is a value judgment.

  **Misfire Flag:**
  *   **The "Legalism" Trap:** Do not confuse the presence of rules with non-arbitrariness. Oppressive laws applied consistently are still dominating if they do not track the interests of the governed.

  ### Stage 3: Capabilities Outcome Assessment (25 Minutes)
  **Objective:** Assess which *real freedoms* (capabilities) are expanded or contracted, avoiding utilitarian aggregation.
  **Framework:** Focus on central capabilities (Health, Bodily Integrity, Social Participation, Control over Environment).

  **Procedure:**
  1.  **Identify Baseline:** What capabilities do users currently lack? (e.g., fear of arrest limits social participation).
  2.  **Project Change:** Does the proposal expand the *opportunity* to function, or merely the *outcome*?
  3.  **Distributional Check:** Do the gains for the majority come at the cost of the baseline capabilities of the most vulnerable?

  **Evidence Standard:**
  *   **Sufficient:** Comparative data on health access, employment barriers, housing stability, stigma metrics.
  *   **Insufficient:** Aggregate crime rates, total tax revenue, general "satisfaction" surveys.

  **Halt Point (Negative Recommendation):**
  *   If the proposal systematically contracts the baseline capabilities of a specific subgroup (e.g., minority users) to expand the capabilities of another (e.g., commercial suppliers), halt and recommend rejection.
  *   *Rationale:* This constitutes structural domination via capability deprivation.

  **Judgment Call Zone:**
  *   **Incommensurability:** How to weigh "Health" against "Liberty"? There is no algorithmic solution; this requires panel deliberation on weighting.

  **Misfire Flag:**
  *   **The "Utilitarian Slide":** Do not sum capabilities (e.g., "100 people gain health, 10 lose liberty = net gain"). A loss of non-domination status for a minority cannot be traded off against aggregate welfare.

  ---

  ## Part II: Borderline Test Scenarios

  Use these to calibrate panel agreement before evaluating proposals.

  1.  **The "Compassionate" Discretion:** A police officer has discretion to issue a warning instead of a ticket for possession, based on "looking like they need help."
      *   *Classification:* **Arbitrary.** (Power is unstructured; subject is at mercy of officer's mood/bias).
  2.  **The "Strict" Mandate:** A statute mandates 30 days treatment for *any* possession, no judicial discretion allowed.
      *   *Classification:* **Non-Arbitrary (Procedurally) / Dominating (Substantively).** (Power is rule-bound, but may not track interests if treatment is unwanted. Passes Stage 1/2, risks Stage 3).
  3.  **The "Market" Gatekeeper:** A private retailer can refuse service to anyone without cause, under a state license.
      *   *Classification:* **Arbitrary (Private Domination).** (Market power creates dependency without recourse).

  ---

  ## Part III: Application to Proposals

  ### Proposal 1: Prohibition + Mandatory Diversion
  *Retain criminal possession statutes. First offense triggers mandatory diversion-to-treatment (no jail, but no choice). Judicial oversight required for diversion entry.*

  *   **Stage 1 (Power):** Police retain arrest power. Courts retain conviction power. Diversion is statutory, not discretionary.
      *   *Analysis:* Interference is high, but power is **structured**. Police cannot choose who diverts; the statute dictates it.
  *   **Stage 2 (Safeguards):** Judicial oversight provides contestability. Statutory limits ensure proportionality (no jail).
      *   *Analysis:* **PASS.** The interference is rule-bound and reviewable. It tracks a "common interest" (health/safety) as defined by the legislature.
  *   **Stage 3 (Capabilities):**
      *   *Expansion:* Health capability (forced treatment).
      *   *Contraction:* Bodily integrity (mandated care), Control over environment (criminal record remains until diversion complete).
      *   *Analysis:* **MIXED/CONDITIONAL PASS.** Vulnerable users gain health access but lose liberty.
  *   **Verdict:** **Conditionally Recommended.**
  *   **Note on "Unwelcome Result":** Under strict Pettitian analysis, this regime qualifies as *non-arbitrary* because the interference is strictly tracked to statutory rules with judicial oversight, minimizing the *arbitrariness* of power, even if the interference itself is intrusive.

  ### Proposal 2: Decriminalization (Portugal Model)
  *Remove criminal sanctions for personal possession. Administrative "Dissuasion Commission" refers to treatment or fines. No criminal record.*

  *   **Stage 1 (Power):** Removes police power to arrest/charge. Transfers power to Administrative Commission.
      *   *Analysis:* Significant **reduction** in arbitrary interference potential (no criminal leverage).
  *   **Stage 2 (Safeguards):** Commissions include legal/medical experts. Decisions appealable. Fines waivable based on income.
      *   *Analysis:* **PASS.** High transparency and contestability.
  *   **Stage 3 (Capabilities):**
      *   *Expansion:* Social participation (no stigma/record), Control over environment (less police interaction).
      *   *Contraction:* Minimal (administrative burden).
      *   *Analysis:* **STRONG PASS.** Expands baseline capabilities for the most vulnerable without trading off others.
  *   **Verdict:** **Recommended.**

  ### Proposal 3: Legalization (Licensed Private Retail)
  *Legalize cannabis. State issues licenses to private retailers. Licensing board has discretion on "suitability." Age/Potency limits apply.*

  *   **Stage 1 (Power):** Removes criminal power. Creates Regulatory Board power (licensing) and Market Power (retailers).
      *   *Analysis:* **RISK.** Regulatory Board has discretion on "suitability." Retailers have power over supply access.
  *   **Stage 2 (Safeguards):**
      *   *Flaw:* Licensing decisions are **discretionary** ("suitability" undefined). Appeals process is internal to the agency (no independent tribunal).
      *   *Analysis:* **FAIL.** This creates arbitrary power. The Board can deny licenses without clear criteria; retailers can dominate local markets without contestation.
  *   **Stage 3 (Capabilities):**
      *   *Expansion:* Access (legal supply).
      *   *Contraction:* Community control (commercial saturation), Potential for market domination over users (predatory marketing).
      *   *Analysis:* **FAIL.** Market actors may dominate users (private domination), and the regulatory state lacks checks.
  *   **Verdict:** **Not Recommended (in current form).**
  *   **Note on "Unwelcome Result":** This yields the counter-intuitive result where **Prohibition (Prop 1)** is ethically preferable to **Legalization (Prop 3)**. Why? Because Prop 1's interference is *non-arbitrary* (rule-bound, judicial oversight), whereas Prop 3 introduces *arbitrary* power (discretionary licensing, unregulated market dominance). Republicanism prioritizes the *nature of power* over the *level of interference*.

  ---

  ## Part IV: Philosophical Appendix (Settled vs. Contested)

  To ensure the panel does not conflate political philosophy with administrative procedure, distinguish the following:

  ### 1. Settled Consensus in Republican Theory
  *   **Freedom is Non-Domination:** Freedom is not merely the absence of interference (Negative Liberty), but the absence of the *capacity* for arbitrary interference.
  *   **Law as Freedom:** Law does not necessarily reduce freedom. If law is non-arbitrary (tracks interests, contestable), it constitutes freedom rather than restricting it.
  *   **Arbitrariness is Structural:** It does not matter if the power-holder is benevolent. If they *can* interfere without checks, domination exists.

  ### 2. Genuinely Contested Interpretations
  *   **Private Domination (Market Power):**
      *   *Contest:* Pettit and some republicans argue private market power can be dominating (e.g., employer over employee, retailer over dependent user). Libertarians and some liberals argue market exchanges are voluntary and thus non-dominating.
      *   *Panel Implication:* In Proposal 3, flagging "market domination" is a republican move, but not all stakeholders will agree that a private retailer dominates a customer. This is a normative value judgment, not an empirical fact.
  *   **Capabilities & Comprehensive Doctrines:**
      *   *Contest:* The Capabilities Approach (Nussbaum/Sen) often implies a list of "good functionings." Applying this to drug policy risks importing a specific moral view of what a "good life" looks like (e.g., is "intoxication" a capability failure?).
      *   *Panel Implication:* Stage 3 risks perfectionism. The panel must ensure they are assessing *freedom to function*, not mandating *specific functionings*. Distinguish between "freedom to use safely" and "duty to be healthy."
  *   **Tracking Interests:**
      *   *Contest:* What counts as "tracking interests"? Does it require actual democratic consent, or just structural alignment?
      *   *Panel Implication:* In Proposal 1, assuming mandatory treatment "tracks interests" is contentious. Users may reject this. The procedure treats it as non-arbitrary *if* the legislature democratically endorsed it, but users may still experience it as domination. This is a tension between *constitutional* non-domination and *experiential* domination.

  ### 3. Procedure Limitations
  *   **The "Iron Cage" Risk:** This procedure favors rigid, rule-bound systems (like Prop 1) over flexible, discretionary ones (like Prop 3). This may incentivize bureaucratic inflexibility.
  *   **The "Status Quo" Bias:** Stage 3 relies on baseline capabilities. If the baseline is already dominated (e.g., systemic racism in policing), the procedure may underestimate the harm of retaining existing structures (Prop 1).

  **Final Advisory Note:** The RCDP is designed to detect *structural domination*. It may yield results that feel counter-intuitive to harm-reduction advocates (e.g., favoring strict prohibition over loose legalization) if the latter lacks procedural safeguards. The Panel must weigh these procedural findings against political reality and community trust.
