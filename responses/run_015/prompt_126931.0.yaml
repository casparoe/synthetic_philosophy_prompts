      *   Below threshold (10 yrs): Quantitative Consequentialism.
      *   Middle threshold (50 yrs): Skeptical Agnosticism (we can't know, so don't try to calculate).
      *   Above threshold (Centuries): Deontological/Stewardship Ethics (we must act, calculation is irrelevant/immoral).
      *   *Critique:* This is intellectually inconsistent. It shifts goalposts based on political feasibility or cognitive comfort rather than a unified ethical theory.

  4.  **Address Question 2: Is it consistent with taking outcomes seriously?**

