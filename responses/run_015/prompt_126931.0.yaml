      *   *Deontology/Rights-based:* Focuses on duties, rights, rules. "Intergenerational duty" sounds deontological (we *owe* it to future people, regardless of the specific calculated outcome).
      *   *Precautionary Principle:* Act to avoid harm when uncertainty is high.
