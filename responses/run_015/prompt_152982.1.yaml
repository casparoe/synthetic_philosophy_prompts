answer: |-
  This position is a sophisticated hybrid, attempting to marry Quinean holism and naturalism with a Kantian-style constitutivism about rational agency. It seeks to preserve the normative force of morality without the ontological baggage of realism. However, because it relies on Quinean machinery to support a structure Quine himself would likely reject, it faces significant internal tensions. Below is an assessment of its exposure, ranked by severity.

  ### Ranking of Defeaters

  **1. Fatal: The Coherence Conditions Dilemma (Realism vs. Psychology)**
  The claim that moral norms are "conditions of rational agency that make theory choice possible at all" creates a dichotomy you cannot bridge without abandoning a core tenet.
  *   **Horn A (Normative Realism):** If these conditions are *necessary* for rationality (i.e., an agent *ought* to adhere to them to be rational), you have smuggled in a normative fact about rationality. This violates your "zero ontological weight" claim because you are now committed to the existence of normative constraints on agency.
  *   **Horn B (Descriptive Psychology):** If these conditions are merely descriptive facts about how humans *happen* to cognize (naturalized epistemology), you lose the normative force. It becomes contingent that we reject cruelty; a different species might not. This reduces your view to descriptive psychology, undermining the "indispensable regulative role" and the "must be rejected" clause.
  *   **Verdict:** Fatal. You cannot have normative necessity without ontological commitment in a Quinean framework, nor can you have indispensable regulativity without collapsing into psychology.

  **2. Fatal: The Revisability Instability (Logic vs. Morality)**
  Quine's central insight in "Two Dogmas of Empiricism" is that *no* statement is immune to revision, including logical laws (e.g., the law of excluded middle in quantum mechanics).
  *   **The Conflict:** You posit moral norms as "fixed points" that are maximally resistant to revision, effectively treating them as more entrenched than logic. If logic is revisable to save a theory, but morality is not, you have reinstated a functional analytic-synthetic distinction. Quine rejects this precisely because entrenchment is a matter of degree, not kind.
  *   **The Collapse:** If you admit moral norms are revisable *in principle*, your claim that they are "conditions of rational agency" weakens to "conditions of *current* human agency." If you claim they are unrevisable *in principle*, you contradict Quinean fallibilism.
  *   **Verdict:** Fatal. This breaks the analogy with Quinean holism and reintroduces the dogma Quine sought to eliminate.

  **3. Strong/Awkward: Cross-Cultural Moral Universals**
  *   **The Challenge:** If moral universals appear across radically different theoretical environments (webs of belief), it suggests the constraint is not internal to *our* specific web (pragmatic entrenchment) but external to human cognition generally.
  *   **Impact:** This supports a form of naturalist realism (moral facts = human flourishing facts) rather than your structural anti-realism. It suggests the entrenchment is due to shared biology tracking independent constraints, not pragmatic boundary conditions of a conceptual scheme.
  *   **Verdict:** Strong. It pushes the view toward realism or evolutionary error theory.

  **4. Awkward: Empirical Findings on Moral Disagreement**
  *   **Clarification:** You suggested this might support the view. It does not. Your position claims moral nodes are "maximally distant from sensory experience."
  *   **The Challenge:** If empirical evidence shows moral disagreements are *resolvable* by shared sensory evidence (e.g., seeing suffering causes disagreement to vanish), morality moves toward the sensory periphery of the web.
  *   **Impact:** This contradicts your structural claim that morality is central and remote from observation. It suggests morality is empirically tractable, not a purely structural constraint.
  *   **Verdict:** Awkward. It undermines the specific topological claim about the web of belief.

  **5. Awkward: Evolutionary Tracking**
  *   **The Challenge:** If norms track adaptive constraints, they describe fitness conditions.
  *   **Impact:** This makes morality descriptive (about survival/reproduction), violating your "non-descriptive" claim. It risks collapsing the view into a naturalist moral realism where "wrong" means "maladaptive."
  *   **Verdict:** Awkward. It threatens the non-descriptive status of moral judgments.

  ### Collapse Risks: Expressivism and Error Theory

  Your position is at high risk of collapsing into **Expressivism** or **Error Theory**, despite your intentions.
  *   **Expressivism:** By claiming moral judgments are "non-descriptive" but "nodes in the web of belief," you face a semantic tension. For Quine, sentences in the web are truth-apt. If moral sentences are true but describe no properties and carry no ontological commitment, they function as expressions of attitude constrained by coherence. This is sophisticated expressivism (similar to Allan Gibbard's norm-expressivism), not the structural realism you propose.
  *   **Error Theory:** If you insist moral sentences are truth-apt descriptions but admit they carry "zero ontological weight" (i.e., no moral entities exist to make them true), you land in error theory (J.L. Mackie). Your attempt to avoid this by calling them "structural features" works only if you deny they are truth-apt descriptions, which circles back to expressivism.

  ### Unfalsifiability: Virtue or Vice?

  For a regulative framework, unfalsifiability might be a virtue (it sets the rules of the game). For a **Quinean naturalist thesis**, it is a **vice**.
  *   **The Problem:** If any agent who rejects your moral constraints is simply defined as "irrational" or "outside the conditions of agency," the theory becomes immune to empirical refutation. Quinean naturalism demands that epistemology (and by extension, normative theory) be accountable to psychology and science.
  *   **Assessment:** Insulating the view from revision by defining counter-examples as "irrational" violates the naturalist spirit of continuous inquiry. It renders the position dogmatic, which is ironic given its Quinean pedigree.

  ### Hidden Commitment to Normative Realism

  There is a hidden commitment to normative realism inside your "boundary-condition" language, and **it cannot be excised without destroying the view's explanatory power.**
  *   **The Smoking Gun:** The phrase "must be rejected" implies a normative necessity. To say a theory *must* be rejected because it violates rational agency is to posit a norm of rationality that exists independently of our contingent psychology.
  *   **Excision Attempt:** If you excise the "must" and replace it with "we generally do not accept," you lose the regulative force. Morality becomes a mere sociological fact about what humans prefer, not a constraint on rationality.
  *   **Conclusion:** The explanatory power of your view relies on the necessity of the constraint. Therefore, the commitment to normative realism (about rationality, if not about cruelty itself) is essential and unavoidable.

  Verdict: Genuinely exposed (the constitutive normativity required for rational agency smuggles in the realist commitment the view explicitly denies).
