prompt: |-
  I'm a retired experimental physicist who only recently got into philosophy, and I keep getting stuck on the Humean/anti-Humean debate about laws of nature. Could you compare Lewis's best-system account with a more anti-Humean governing or dispositionalist view? I want the comparison to go past the slogan that laws describe rather than govern, and focus on where they really diverge: what the laws are grounded in, whether a law can be true without any instances, and how each view handles counterfactuals and scientific explanation. At the end, say which view you find more plausible and why.
