          *   The asymmetry: Zhuangzi wakes up and remembers. The butterfly doesn't seem to remember being Zhuangzi.
          *   The context: *Qiwulun* (Discussion on Making All Things Equal). Is the point equality or transformation?
          *   Other uses of *hua*: Usually physical metamorphosis (e.g., Kun to Peng), not necessarily subjective identity dissolution.
          *   The phrase "I did not know" (*bu zhi*). Does this imply ignorance (skepticism) or non-duality?
      *   *Philosophical:*
          *   Continuity of memory: If Zhuangzi remembers, isn't there a continuous subject?
          *   Pragmatic distinction: We still need to avoid getting run over by carts while awake. Does monism erase practical distinction?
          *   Collapse into Skepticism: If waking/dreaming are equivalent, isn't that just skepticism about reality?
          *   Collapse into Illusionism: If both are just phases, is *nothing* real? (Nihilism).
