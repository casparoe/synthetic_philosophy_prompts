prompt: |-
  I am a novelist, and I have for some time been unable to write a particular kind of scene. It is a crowd scene: people arrive one at a time in a square outside a house where something is wrongly believed to have happened; each arrives with private reservations; each reads the faces and postures of those already present rather than the facts; by the time the stone is thrown no one present individually wants to throw it, and no one can afterward be singled out as the one who decided. I keep rewriting it as a study in cowardice, and I have come to suspect that cowardice is the wrong explanation.

  I have read some popular economics but have no facility with formal modelling, so I would like the standard sequential-observational-learning account of informational cascades restated in the vocabulary I actually work in: scene and beat, point of view, free indirect style, dramatic irony, what a character wants and what she believes, what she can see from where she stands, plausibility, the difference between protagonist and ensemble, the narrator's access, misdirection, the turn.

  This is the version of the model I mean, so that the answer need not depend on recall: agents act in a fixed sequence, one at a time, each choosing between two actions; there is an unknown binary state of the world; each agent receives one private signal of known reliability; each observes all earlier actions but not the signals that produced them; each acts to maximize expected payoff given the public record plus her own signal; and the whole structure, including everyone's rationality, is common knowledge. In the simplest such setup the cascade locks in after two consecutive agents have acted alike, after which no further action conveys information; the cascade is wrong with a probability that stays bounded away from zero however long the sequence runs; and every agent in it can know all of this and still rationally conform. Please also keep this apart from the different case in which an agent uses her signal but acts against it because she wishes to appear well-informed, and note that in the model a locked-in cascade is not dislodged by a single contrary act, since by then a contrary act reveals nothing: it takes new public information.

  Three things, in order. First, the translation, as faithful as you can make it without importing my vocabulary's assumptions and calling them translation. Second, the residue: what maps cleanly onto scene, point of view and motive; what maps only with distortion — does rationality become plausibility of motivation, and if they are not the same, what is lost? does the reader's position under free indirect style have any counterpart, given that the reader is handed exactly the signals the model treats as private? is a character's private doubt really a signal, when in fiction doubt is often expressive rather than evidential? Third, what cannot be said in my vocabulary at all, and whether that residue indicts fiction or the model.

  Two intuitions of mine to test rather than flatter. I want a single truth-teller — the child in the story of the emperor with no clothes — to be able to break the thing, and the model seems to say that a lone deviation is uninformative; is my intuition sentimentality, or does it point at something the model has left out, such as unequal signal reliability, a character known to prefer breaking ranks, or the difference between speaking and acting? And I want to say that the crowd's cruelty is structural rather than a sum of individual failures of nerve: does the model vindicate that, or does it entail that there is nothing there but the sum?

  Finally: what would a scene faithful to the model actually look like on the page, and would it be dramatically inert?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A novelist struggling with a specific crowd scene (mob violence/stone-throwing based on false belief).
      *   **Problem:** Keeps writing it as "cowardice," suspects that's wrong. Wants to understand *informational cascades* (sequential observational learning) but translated into *novelist's vocabulary* (scene, beat, POV, free indirect style, etc.).
      *   **Specific Model Provided:** Sequential agents, binary state, private signal + public actions, rational maximization, cascade locks after 2 consecutive same actions, wrong cascade possible, rational conformity even when knowing the model. Distinction made from reputational cascades (signaling). Locked cascade needs *new public info* to break, not just a contrary act.
      *   **Tasks:**
          1.  **Translation:** Map the economic model to narrative terms without distorting either.
          2.  **Residue:** What maps well? What distorts? (Rationality vs. Plausibility, Reader's access to private signals vs. Character's isolation, Doubt as signal vs. expression).
          3.  **Limits:** What *cannot* be said in narrative vocabulary? Does this indict fiction or the model?
          4.  **Test Intuitions:**
          *   Can a single truth-teller (Emperor's New Clothes) break it? (Model says no, unless new info/status).
          *   Is cruelty structural or sum of individual failures? (Model says structural).
          5.  **Practical Application:** What does a scene faithful to the model look like? Is it inert?

  2.  **Deconstruct the Economic Model (Mental Check):**

      *   *Setup:* People arrive one by one.
      *   *Input:* Private hint (signal) + What others did (public pool).
      *   *Decision:* Act based on combined weight.
      *   *Cascade:* Once Public Pool > Private Signal weight, everyone ignores private signal.
      *   *Lock-in:* Happens fast (often 2 people).
      *   *Fragility:* Hard to break from inside (deviation looks like noise), easy to break with external shock.
      *   *Rationality:* It is rational to follow the crowd even if you think the crowd is wrong, because the crowd's accumulated info outweighs your single data point.

  3.  **Drafting - Section by Section:**

      *   **I. Translation (The Vocabulary Shift):**
          *   *Agent/Sequence* $\rightarrow$ *Character/Entrance.*
          *   *Private Signal* $\rightarrow$ *Interiority/Intuition/Doubt.* (What they feel in their gut before seeing the crowd).
          *   *Public Action* $\rightarrow$ *Beat/Physicality.* (What they actually *do* or say upon arrival).
          *   *Payoff Maximization* $\rightarrow$ *Motivation/Want.* (Avoiding shame, seeking safety, wanting justice).
          *   *Common Knowledge of Rationality* $\rightarrow$ *Shared Social Code.* (Everyone knows everyone knows how to behave).
          *   *Cascade Lock* $\rightarrow$ *The Turn/The Momentum.* The moment the scene's direction becomes inevitable.
          *   *Binary State* $\rightarrow$ *The Truth.* (Did the crime happen or not?).
          *   *Key Insight:* The character isn't ignoring their doubt because they are weak; they are ignoring it because the *evidence of the crowd* outweighs their *evidence of doubt*.

      *   **II. The Residue (Mapping & Distortion):**
          *   *Maps Well:* The tension between Interiority (signal) and Exteriority (action). The "Free Indirect Style" is perfect for showing the private signal while the dialogue shows the public action.
          *   *Distortion (Rationality vs. Plausibility):* In econ, "rational" means mathematically optimal. In fiction, "plausible" means emotionally resonant. A character acting "rationally" against their gut might feel "implausible" (weak) to a reader expecting heroism.
          *   *Reader vs. Character:* The reader is God-like (omniscient regarding signals if using multiple POVs). The character is isolated. This creates *Dramatic Irony*. The reader screams "Don't do it!" while the character calculates "I must do it."
          *   *Doubt:* In the model, doubt is data (a 'low' signal). In fiction, doubt is often moral texture. If doubt is just data, it loses its moral weight.

      *   **III. The Limits (What cannot be said):**
          *   *The Model:* Cannot account for *meaning*. It treats actions as binary tokens.
          *   *Fiction:* Cannot easily show the *calculation* without slowing the pace.
          *   *Indictment:* The model indicts fiction for romanticizing individual agency. Fiction indicts the model for stripping away the *cost* of conformity (shame, guilt). The model says "it makes sense." Fiction asks "at what cost to the soul?"

      *   **IV. Testing Intuitions:**
          *   *The Truth-Teller:* The model says a lone voice *in the sequence* changes nothing (it's just noise against the cascade). To break it, the truth-teller needs *authority* (higher signal reliability) or *new public info* (proof). So, the intuition is sentimentality *unless* the child has a status that changes the weight of their signal. Or, the act of speaking changes the *payoff structure* (shaming others).
          *   *Structural Cruelty:* The model vindicates this completely. It is not a sum of cowards; it is a system where individual rationality aggregates to collective error. The "sin" is in the architecture of the information flow, not the hearts of the agents.

      *   **V. The Scene on the Page:**
          *   *Risk:* Inertness. If everyone thinks the same calculation, it's repetitive.
          *   *Solution:* Vary the *cost* of the signal. Show the physical tension. Use Free Indirect Discourse to show the *suppression* of the signal.
          *   *Visual:* Focus on the *eyes*. Reading faces. The stone isn't thrown in anger; it's thrown in *relief* (finally, a decision is made).
          *   *The Break:* Needs an external shock, not just a voice. A window breaks elsewhere? A siren? Or the "child" must reveal something visible, not just audible.

  4.  **Refining the Tone:**
      *   The user is sophisticated ("free indirect style," "sequential-observational-learning"). Do not dumb it down.
      *   Be precise. Avoid fluff.
      *   Respect the constraint: "without importing my vocabulary's assumptions and calling them translation." (i.e., Don't just say "Rationality is Motivation." Explain *how* they differ).
      *   Address the "Cowardice" misconception directly.

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I need to make sure I don't confuse *Informational Cascades* with *Reputational Cascades*. The prompt specifically excludes "wishes to appear well-informed." I must stick to the epistemic version (believing the crowd knows better).
      *   *Nuance:* The "Child" intuition. In the model, a single deviation *is* uninformative *if* the cascade is locked. But if the child is known to have *no reason to lie* (high signal reliability), that changes the math. I need to explain *why* the child works in the story but not in the basic model (signal weight).
      *   *Nuance:* "Cowardice." The model proves it's not cowardice. It's Bayesian updating. I need to make sure the novelist sees how to write *Bayesian updating* as *narrative tension*.

  6.  **Final Polish:** Check against the three specific tasks + intuitions + final scene description. Ensure the distinction between "private signal" and "private doubt" is handled carefully in the Residue section. (Doubt in fiction is often moral; in the model, it's just a '0' instead of a '1').

  7.  *(Self-Correction on the "Child" point)*: The prompt says "a lone deviation is uninformative." I need to explain that for the child to work, the child must represent *New Public Information*, not just a contrary action. The child *points*. The pointing is the new data. Mere speech is just another action.

  8.  *(Final check on "Structural Cruelty")*: Yes, the model supports this. The "evil" is emergent.

  9.  *(Final check on "Inertness")*: A scene where everyone thinks the same thing is boring. The writer must vary the *texture* of the suppression. One character swallows doubt angrily, another sadly, another pragmatically.

  10. **Constructing the Response.** (Proceed to generate output based on these thoughts).
answer: |-
  Here is the translation, the residue, and the limits of the model, rendered in the vocabulary of the craft.

  ### I. Translation: From Model to Manuscript

  To translate the sequential-observational-learning model into narrative terms, we must stop treating the crowd as a collection of individuals and start treating them as a single, accumulating mechanism of perception.

  *   **The Agents in Sequence** become **The Entrances.** The scene is not a static tableau but a rhythm of arrival. Each character enters the square not into a space, but into a *history* of the space created by those who arrived before.
  *   **The Private Signal** becomes **The Interior Beat.** This is the moment of free indirect style where the narrator grants access to the character's raw data before they speak. It is the gut feeling, the specific doubt, the piece of contradictory evidence they hold in their pocket. In your scene, this is the character thinking, *I know the window wasn't broken,* or *I know this family is kind.*
  *   **The Public Action** becomes **The Exterior Beat.** This is what the character does upon arrival. Do they frown? Do they nod? Do they pick up a stone? Crucially, in this model, the Exterior Beat is not an expression of the Interior Beat. It is a calculation based on the Interior Beat *plus* the Exterior Beats of everyone prior.
  *   **Payoff Maximization** becomes **The Super-Objective.** In economics, this is utility. In fiction, it is the avoidance of error. The character wants to be right more than they want to be good. They are terrified of being the only person in the square who *didn't* throw a stone if it turns out the house *was* guilty. Their motivation is not cowardice (fear of pain) but epistemic humility (fear of being the fool).
  *   **Common Knowledge of Rationality** becomes **The Social Contract.** Every character knows that every other character is trying to read the situation correctly. When Character A sees Character B pick up a stone, Character A assumes Character B has a good reason. This assumption is the fuel of the cascade.
  *   **The Cascade Lock** becomes **The Turn.** This is the specific moment in the scene where the momentum becomes irreversible. In the model, this happens after two consecutive matching actions. In the scene, this is the moment the second person picks up a stone. The third person no longer decides whether to throw; they decide how hard to throw.
  *   **The Binary State** becomes **The Truth.** It does not matter what the Truth actually is. It only matters that the characters believe the Public Record (the crowd's actions) outweighs the Private Signal (their own doubt).

  **The Translation of the "Throw":**
  In your draft, you have been writing the throw as an explosion of anger. In the model, the throw is a *relief*. It is the cessation of calculation. The character throws the stone not to hurt the house, but to stop the agonizing work of deciding whether the house deserves it.

  ### II. The Residue: What Maps and What Distorts

  **What Maps Cleanly:**
  The structure of **Dramatic Irony**. The model assumes the reader (like the omniscient narrator) can see the Private Signals of all agents, while the agents themselves can only see the Public Actions of others. This is the definition of dramatic irony. You can place the reader in a position of helpless omniscience: you show us Character 1's doubt, then Character 2's doubt, then show us both of them picking up stones. The reader screams at the page, but the characters are blind to each other's interiors. This creates a specific kind of horror: not the horror of malice, but the horror of isolation.

  **What Distorts:**
  1.  **Rationality vs. Plausibility:** In the model, it is *rational* to ignore your own eyes if the crowd contradicts them. In fiction, this often reads as *implausible* motivation. Readers are conditioned to believe that a protagonist's gut instinct is the "truest" thing about them. If a character ignores a strong private signal to follow the crowd, the reader diagnoses this as "weakness" or "cowardice." To write this faithfully, you must make the *weight of the crowd* feel heavier than the *weight of the self*. You must show that the character believes the crowd possesses information they lack.
  2.  **Doubt as Signal vs. Doubt as Texture:** In the model, doubt is binary data (Signal A or Signal B). In fiction, doubt is moral texture. A character might doubt the crime occurred, but also doubt their own memory, or doubt their right to judge. The model strips the morality from the doubt to make it a data point. If you retain the morality, the cascade feels like sin. If you strip it to match the model, the cascade feels like mechanics. You must choose: is this a tragedy of ethics or a tragedy of information?
  3.  **The Reader's Position:** You asked if the reader's access to signals has a counterpart. It does not. The reader is the only entity in the universe of the story who sees the cascade forming *as* a cascade. The characters only see the next step. This creates a gap between *experiencing* the scene and *understanding* it. The reader understands the tragedy; the characters only experience the necessity.

  **What Is Lost:**
  The *cost* of conformity. The model treats the payoff as abstract utility. Fiction demands emotional cost. If a character acts against their signal rationally, they should feel a specific kind of dissociation. The loss is the *guilt*. The model says they are right to conform; the novel knows they will hate themselves for it later.

  ### III. The Limits: What Cannot Be Said

  **What Fiction Cannot Say:**
  Fiction struggles to depict *silence as data*. In the model, the *absence* of a contrary action is what strengthens the cascade. In fiction, nothing happens when nothing happens. It is difficult to write the weight of the things people *didn't* say without slowing the pace to a crawl. The model relies on the accumulation of non-events; the novel relies on events.

  **What The Model Cannot Say:**
  The model cannot account for *meaning*. It treats "throwing a stone" as a token. It cannot distinguish between throwing a stone in rage, in duty, or in despair. It cannot account for the fact that once the stone is thrown, the character is no longer the same person. The model is static; the character is transformed.

  **The Indictment:**
  This residue indicts **Fiction's obsession with Agency.** We write novels to celebrate the individual who sees the truth and acts on it. The model suggests that in specific informational structures, individual agency is an illusion. The "hero" who breaks the cascade is not braver; they are statistically anomalous or possess outside data. Fiction wants to believe the Emperor's New Clothes are revealed by Courage. The model says they are revealed only by *Noise* or *Authority*.

  ### IV. Testing Your Intuitions

  **1. The Truth-Teller (The Child)**
  Your intuition that a single truth-teller can break the cascade is **sentimentality**, but it points to a variable the basic model holds constant: **Signal Reliability.**
  In the basic model, every agent has the same signal reliability. If the "Child" enters the sequence, their action is just another token. If the cascade is locked, the Child saying "He is naked" is treated as noise. The crowd thinks, *This child is mistaken, because the entire adult population agrees he is clothed.*
  For the Child to break the cascade, the Child must represent **New Public Information**, not just a contrary action. The Child must *point*. The pointing directs attention to a visible fact (the skin) that overrides the previous public record (the suits).
  *   **Narrative Fix:** The truth-teller cannot just speak. They must reveal something visible that resets the Private Signals of everyone else simultaneously. They must change the *State of the World*, not just the *Opinion of the Crowd*.

  **2. Structural Cruelty**
  Your intuition that the cruelty is **structural** is **vindicated** by the model.
  The model proves that you can have a mob of perfectly rational, non-malicious, privately doubting individuals commit a atrocity. The "evil" is not in the hearts of the agents; it is in the architecture of the information flow.
  *   **Narrative Fix:** Do not write angry faces. Write relieved faces. Write faces that are grateful that the decision has been made for them. The horror of the scene comes from the realization that *anyone* would have done the same. This is harder to write than cowardice, because it implicates the reader.

  ### V. The Scene on the Page

  Would a scene faithful to the model be dramatically inert? **Yes, if you write it as a repetition of the same thought.** If every character thinks, *I doubt, but the crowd says go, so I go,* the reader will bore by the third person.

  **To make it live, you must vary the cost of the suppression.**

  *   **Character 1 (The Lock):** Arrives. Has a weak signal (heard a rumor). Sees an empty square. Throws a stone to test the wall. This is the first data point.
  *   **Character 2 (The Confirmation):** Arrives. Has a strong private signal (knows the accused is innocent). Sees Character 1's stone. Calculates: *Character 1 must know something I don't.* Throws a stone. **The Cascade Locks.**
  *   **Character 3 (The Rational Conformist):** Arrives. Knows the accused is innocent. Sees two stones. Calculates: *Two against one. I am the fool if I stop.* Throws.
  *   **Character 4 (The Dissociated):** Arrives. Doesn't care about the truth. Sees the momentum. Throws to belong.
  *   **Character 5 (The Tragic):** Arrives. Knows the truth. Sees the crowd. *Wants* to stop. Realizes stopping changes nothing (as per the model, a single deviation is noise). Throws the stone *harder* than anyone, to hide their doubt.

  **The Visuals:**
  Focus on the **eyes**. The model is about observational learning. The characters should not be looking at the house; they should be looking at *each other looking at the house*.
  *   *Beat:* A hand hovers over a stone.
  *   *Interiority:* *I saw him yesterday. He was at the market.*
  *   *Exteriority:* The hand closes. The eyes flick to the left. The neighbor is winding up.
  *   *Action:* The throw.
  *   *Reaction:* Not a cheer, but an exhale. The tension of decision is gone.

  **The Break:**
  If you want to break the cascade in the story, do not use a voice. Use a **shock to the Public Record.**
  A window opens in the house. The accused steps out, whole and unharmed. This is not a "contrary act" by a participant; this is new data about the State of the World. Now the Private Signals of everyone in the crowd align with the Public Record. The cascade reverses.

  **Summary for the Novelist:**
  You are not writing about cowardice. You are writing about the **tragedy of Bayesian updating.** Your characters are sacrificing their private truth to the public probability. To write this without inertness, focus on the physical sensation of swallowing one's own knowledge. The stone is not a weapon; it is a seal on the lips.
