prompt: |-
  I'm delivering the opening remarks at tomorrow's workshop on institutional deception and democratic accountability. The audience is split: half are Arendt scholars steeped in her essays on political lying, half are policy researchers who study misinformation campaigns without philosophical training. I want about five minutes of polished, formal remarks that use Arendt's distinction between factual truth and rational or philosophical truth as real structural architecture, not ornament—specifically, to justify why the morning session (empirical and historical case studies of state deception) is kept strictly separate from the afternoon session (normative frameworks for democratic accountability). The central move should be her claim that systematic political lying is uniquely dangerous not because it falsifies particular propositions, but because it erodes the shared conditions of testimony and plurality—the common world—that make politics possible at all, thereby undermining the very ground on which normative theory must stand. Build the speech so both audiences understand why collapsing these sessions into one generic interdisciplinary discussion would miss her point entirely: the empirical cases depend on a common world that the normative theory is trying to defend, and once that world is lost through sustained deception, the theory has no footing.

  Please write it without inventing quotations or specific page citations; paraphrase her core distinctions precisely. Separate what is settled interpretation—particularly her view that factual truth is contingent, depends on testimony, and is vulnerable to organized lying—from what scholars genuinely contest, such as whether she permits any legitimate state secrecy and whether her defense of factual truth commits her to a naive correspondence theory. Do not present a contested reading as the scholarly consensus.
