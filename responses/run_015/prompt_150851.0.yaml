  To the Board of Directors,

  The proposal to integrate an internal prediction market into our replication funding cycle raises profound questions about how we aggregate knowledge and legitimize institutional decisions. We are being asked to treat a market price not merely as a betting odd, but as epistemic evidence comparable to a preregistered result. Before we vote, we must be precise about what a price is, what it requires to function, and what happens when we attach consequential weight to it. The objections raised by our colleagues are not merely procedural quibbles; they identify structural vulnerabilities that could render the market useless or, worse, actively misleading. My assessment is that we should run the market, but in a significantly modified form that decouples the price from direct funding allocation and reframes its public role.

  To settle the first question regarding the epistemic status of the price, we must avoid the category error of treating it as testimony. A market price is not a statement made by a specific agent who can be held accountable for its truth; it is a mechanism output. It represents an incentive-compatible aggregation of private signals, conditional on the liquidity and risk preferences of the participants. It is evidence only insofar as the traders possess information not already public and are motivated to reveal it through capital rather than words. If we treat the price as a verdict, as the economist proposes, we are reifying a dynamic process into a static fact. The price is best understood as a surrogate for expert judgment under specific constraints, not as a second opinion in the peer-review sense. It justifies action only when the incentives for truth-telling outweigh the incentives for manipulation, a condition that is fragile in small, closed markets.

  This fragility leads directly to the second question concerning the consequentiality of the price. The proposal to feed average prices into funding decisions is self-undermining. Once traders know that their trades influence the allocation of follow-on money, their incentive structure shifts from maximizing accuracy to maximizing influence. They may trade to depress the price of a competitor's lab or inflate the price of a collaborator's project, regardless of their actual belief about the replication success. This is a classic instance of Goodhart's law becoming operational within the epistemic engine itself. When the measure becomes the target, it ceases to be a good measure. In a small internal market where participants know each other, the risk of collusion or strategic signaling is high. Therefore, we cannot allow the market price to carry direct weight in funding decisions. To do so would corrupt the signal we are trying to measure. The market should remain observational for this cycle, informing human deliberation only as one input among many, with zero formal weight in the algorithmic allocation of funds.

  Regarding the third question of participant composition and the no-trade theorem, the philosopher is technically correct that if our invitees share common priors and differ only in private information, rational trade should be minimal. If we invite only the usual suspects—researchers who read the same journals and trust the same methods—we risk a market with low volume and stagnant prices that reflect shared bias rather than discovered truth. For the market to generate the disagreement necessary for price discovery, we must intentionally heterogenize the participant pool. We need to invite methodological skeptics, outsiders from adjacent fields, and perhaps even trained forecasters who do not specialize in the specific content areas. If we cannot secure this diversity of priors, the market will not trade enough to generate a reliable signal, and the price will simply mirror the consensus prior without updating. We must change the invite list to ensure that disagreement is possible, otherwise, we are merely paying people to confirm what we already suspect.

  The fourth question concerns the requirement for written justifications and the anomaly of the profitable but inarticulate trader in our pilot. The psychologist is right that forcing articulation can destroy the aggregation of tacit knowledge; much of expert intuition is Polanyian, known but not fully statable. However, in a small, closed market with real money, the risk of insider trading is non-trivial. The word-salad trader presents a specific danger: profitability without articulability is the signature of either genuine expert intuition or access to non-public information about the replication process. In a corporate or internal setting, we must prioritize the audit trail over the purity of the tacit signal. We should keep the justification requirement, not to judge the epistemic quality of the trade, but to screen for insider information and manipulation. If a trader cannot explain their position, they should not be banned, but their trades should be flagged for review by the compliance committee. We accept the loss of some tacit signal to ensure the integrity of the market against corruption.

  Therefore, my recommendation is to run the market in modified form. We proceed with the internal prediction market but sever the link between price and funding allocation. The price will not determine which labs receive money; that decision remains with the board using the market data as advisory context only. We will expand the participant list to include outsiders with divergent priors to ensure sufficient trade volume. We will retain the justification requirement for audit purposes but instruct reviewers not to penalize trades solely for lack of articulate reasoning unless insider information is suspected. Publicly, when we publish the results alongside the replication outcomes, we must frame the price carefully. We should not call it the field's second opinion, as this implies a consensus that may not exist. Instead, we should describe it as an experimental aggregation of private beliefs under incentive constraints. We must state clearly that the market was observational and that the prices were not used to allocate capital, preserving the integrity of both the market signal and the funding process. This approach respects the epistemic limits of the tool while allowing us to gather valuable data on how such markets function in metascience. It acknowledges the validity of the objections raised while refusing to abandon the experiment entirely. We vote to run, but we vote to protect the signal from the consequences of its own success.
