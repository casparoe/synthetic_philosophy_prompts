  # Handout: The Wrong Kind of Reasons — A Decision Tree

  ## I. Logical Space Derivation

  Before approaching the cases, we map the logical space using five binary variables regarding normative reasons ($R$), fittingness ($F$), and justification ($J$).

  1.  **$R_{belief}$:** Are pragmatic considerations (e.g., threats, rewards) reasons *for believing*?
  2.  **$R_{manage}$:** If not $R_{belief}$, are they reasons for *managing* belief (e.g., taking a pill)?
  3.  **$R_{admire}$:** Are pragmatic considerations reasons *for admiring*?
  4.  **$F_{admire}$:** If $R_{admire}$, do they make the admiration *fitting*?
  5.  **$J_{encroach}$:** Do non-evidential factors (moral or pragmatic) affect epistemic justification/knowledge?

  **Occupied Combinations (The Leaves):**
  *   **~$R_{belief}$, ~$R_{manage}$:** Involuntarism.
  *   **~$R_{belief}$, $R_{manage}$, ~$R_{admire}$:** Strict Evidentialism.
  *   **~$R_{belief}$, $R_{manage}$, $R_{admire}$, ~$F_{admire}$:** Object/State-Given (Buck-Passing).
  *   **$R_{belief}$, $J_{encroach}$ (Moral):** Moral Encroachment.
  *   **$R_{belief}$, $J_{encroach}$ (Pragmatic):** Pragmatic Encroachment.
  *   **$R_{belief}$, ~$J_{encroach}$, ~Inheritance:** Monistic Practical.

  **Empty Combinations:**
  *   **$R_{belief}$, ~$R_{manage}$:** *Incoherent.* If one has a reason to believe, one has a reason to take necessary means to believe (assuming rationality).
  *   **~$R_{belief}$, $R_{admire}$, $F_{admire}$:** *Unattractive.* Holds that threats make admiration fitting but not belief fitting, despite both being attitudes. (Labelled 'Unnamed' in tree).
  *   **$R_{belief}$, ~$J_{encroach}$, Inheritance:** *Unexplored.* Reasons inherit from threats to others, but do not affect justification. (Labelled 'Unnamed' in tree).

  ---

  ## II. The Decision Tree

  **Instructions:** Answer the questions based on your intuitive verdict on the cases. Follow the branches to your theoretical leaf.

  **Node 1: The Standard Demon**
  A demon threatens to kill you unless you believe that the number of stars is even. You have no evidence regarding the star count.
  *   **Q:** Is the threat a normative reason *to believe* the proposition?
      *   **NO:** Go to Node 2.
      *   **YES:** Go to Node 6.

  **Node 2: The Permissibility Case**
  Same as Node 1, but the demon says, "I will not kill you if you believe, but I will reward you if you do." The evidence is slightly against the proposition.
  *   **Q:** Does the reward make believing *permissible*, even if the evidence does not support it?
      *   **YES:** **Leaf A: Unnamed (Permissibility View)**
      *   **NO:** Go to Node 3.

  **Node 3: The Pill Case (Indirect Compliance)**
  You cannot believe at will. However, you can take a pill that will reliably cause the belief. The demon threatens to kill you unless you believe.
  *   **Q:** Is the threat a reason *to take the pill*?
      *   **NO:** **Leaf B: Involuntarism**
      *   **YES:** Go to Node 4.

  **Node 4: The Admiration Demon**
  A demon threatens to kill you unless you *admire* a cruel tyrant. You know the tyrant is cruel and has no admirable qualities.
  *   **Q:** Is the threat a reason *to admire* the tyrant?
      *   **NO:** **Leaf C: Strict Evidentialism**
      *   **YES:** Go to Node 5.

  **Node 5: The Fittingness Check**
  Continuing from Node 4: You admit the threat is a reason to admire.
  *   **Q:** Does the threat make the admiration *fitting* (i.e., does it make the tyrant actually admirable)?
      *   **YES:** **Leaf D: Unnamed (Hybrid View)**
      *   **NO:** **Leaf E: Object/State-Given (Buck-Passing)**

  **Node 6: The Bigot Case (Moral Encroachment)**
  You have marginal evidence that a member of a marginalized group is dangerous. Believing this would cause significant moral harm/stereotype reinforcement.
  *   **Q:** Does the moral cost make the belief *unjustified*, even if the evidence supports it?
      *   **YES:** **Leaf F: Moral Encroachment**
      *   **NO:** Go to Node 7.

  **Node 7: The High-Stakes Bank (Pragmatic Encroachment)**
  You have evidence that the bank is open. If you are wrong, you will lose your house. If you are right, nothing special happens.
  *   **Q:** Do the high stakes affect whether you *know* the bank is open?
      *   **YES:** **Leaf G: Pragmatic Encroachment**
      *   **NO:** Go to Node 8.

  **Node 8: The Threat to Child (Inheritance)**
  A demon threatens to kill your *child* unless you believe the number of stars is even. You cannot save the child otherwise.
  *   **Q:** Is this a reason *for you to believe*?
      *   **YES:** **Leaf H: Unnamed (Inheritance View)**
      *   **NO:** **Leaf I: Monistic Practical**

  ---

  ## III. Indistinguishable Leaves

  **Leaf G (Pragmatic Encroachment) and Leaf I (Monistic Practical)**
  *   **Problem:** Both views accept pragmatic reasons for belief ($R_{belief}$). The tree separates them via the Bank Case (Node 7), relying on the assumption that Monists deny pragmatic encroachment on *knowledge* while accepting pragmatic reasons for *belief*. However, many Monists argue that justification *is* practical, effectively collapsing the distinction.
  *   **Further Question:** "Is 'justification' a purely epistemic notion, or is it all-things-considered?" If the latter, Leaf G and Leaf I merge.

  **Leaf D (Hybrid) and Leaf I (Monistic Practical)**
  *   **Problem:** Both accept that pragmatic considerations can make an attitude fitting/reasonable. Leaf D is reached only if the reader denies $R_{belief}$ at Node 1 but accepts $F_{admire}$ at Node 5. This is theoretically unstable.
  *   **Further Question:** "Why does the threat make admiration fitting but not belief fitting?" If no principled difference is offered, Leaf D collapses into Leaf I.

  ---

  ## IV. Handout Angle Analysis

  **Goal:** Separate (1) Two Normative Relations, (2) Difference in Object of Reason, (3) Artefact to be Dissolved.

  *   **Does the tree cut along these lines?**
      *   **Yes, primarily at Node 1.**
      *   **Group 1 (Two Relations):** The **No** branch at Node 1 (Leaves A, B, C, E). These theorists posit a distinction between reasons for the attitude and reasons for something else (management, or state-given reasons).
      *   **Group 2 (Difference in Object):** Specifically **Leaf E (Object/State-Given)**. They accept reasons for the attitude (admiration) but deny they bear on the object's value (fittingness). This is the "Buck-Passing" solution.
      *   **Group 3 (Artefact/Dissolved):** The **Yes** branch at Node 1 (Leaves F, G, I). These theorists treat pragmatic reasons as genuine reasons for belief, dissolving the WKR distinction into a single normative space (encroachment or monism).

  *   **Caveat:** Leaf C (Strict Evidentialism) and Leaf B (Involuntarism) also fall under "Two Relations," but they deny the existence of pragmatic reasons entirely rather than distinguishing their *kind*. The tree successfully isolates the Buck-Passing view (Leaf E) as the specific "Difference in Object" solution.

  ---

  ## V. Scoring Key

  | Leaf | View | Answer Pattern | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Unnamed (Permissibility)** | N1-No, N2-Yes | You must explain why a reason can permit belief without being a reason *for* belief. |
  | **B** | **Involuntarism** | N1-No, N2-No, N3-No | You must deny that we have any reasons to manage our beliefs, even via pills or therapy. |
  | **C** | **Strict Evidentialism** | N1-No, N2-No, N3-Yes, N4-No | You must deny that threats are reasons to admire, treating admiration exactly like belief. |
  | **D** | **Unnamed (Hybrid)** | N1-No, N2-No, N3-Yes, N4-Yes, N5-Yes | You hold that threats make admiration fitting but not belief fitting, without a clear distinction between the attitudes. |
  | **E** | **Object/State-Given** | N1-No, N2-No, N3-Yes, N4-Yes, N5-No | You must maintain that one can have a reason to admire without the object being admirable (the classic WKR solution). |
  | **F** | **Moral Encroachment** | N1-Yes, N6-Yes | You must accept that moral facts can override evidential support in determining justification. |
  | **G** | **Pragmatic Encroachment** | N1-Yes, N6-No, N7-Yes | You must accept that knowledge depends on practical stakes, not just truth and evidence. |
  | **H** | **Unnamed (Inheritance)** | N1-Yes, N6-No, N7-No, N8-Yes | You hold that threats to others give you reasons to believe, but threats to yourself do not (or stakes do not affect knowledge). |
  | **I** | **Monistic Practical** | N1-Yes, N6-No, N7-No, N8-No | You must deny that pragmatic reasons affect knowledge attributions, despite being reasons for belief. |
