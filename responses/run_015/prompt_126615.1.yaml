answer: |-
  Look, you are absolutely right to feel that they were talking past each other, because they were pulling on three different threads of the same rope without realising it. The reason you couldn't referee it is that Nadia and Rob are operating on completely different moral frameworks, and while they both have strong points, they are answering different questions. Nadia is arguing about liability, which is about whether someone can be legitimately harmed, while Rob is arguing about blame and causal responsibility, which is about whether someone is guilty or makes a difference. If you separate those out, you can see where each of them lands a solid punch and where they miss the mark.

  Nadia is actually on firmer philosophical ground when she distinguishes between blame and liability. Her example of the hypnotised man is a classic one in ethics for a reason. You can be a threat without being evil, and if you are an unjust threat, you can be stopped even if you aren't morally culpable for being there. So when Rob says that calling soldiers murderers is unfair, Nadia is right to say she isn't calling them murderers, she is saying they are liable to be shot at. On that specific point about the symmetry of war, she wins the theoretical argument. If one side is genuinely fighting an unjust war of aggression, their soldiers do not have the same moral right to be there as the defenders, even if both sides feel sincere. However, Rob wins the practical argument about knowledge. He is right that holding a nineteen-year-old recruit responsible for the geopolitics of a future war is asking the impossible. Nadia's blank cheque argument assumes Dev can know something he cannot know, which is whether the next war will be just. You cannot reasonably expect a private to audit foreign policy before signing up, so Rob is right that we cannot judge Dev's character based on wars that haven't happened yet.

  Where Rob gets a bit wobbly is when he tries to use the collective action problem to absolve Dev entirely. He argues that because Dev is one of thousands, his individual enlistment won't change whether a war happens, so he bears no responsibility. That is logically sound regarding the outcome of the war, but it doesn't necessarily clear Dev of complicity. If you join a machine that does harm, you are part of the harm even if your specific cog didn't make the machine start. But Nadia misses a massive practical safeguard here, which is that enlistment is not actually a blank cheque. Soldiers are legally and morally required to disobey unlawful orders. If Dev is told to shoot a prisoner or bomb a school, he is not permitted to do it just because he signed up. Both of them missed this, which undermines Nadia's fear that he has promised to shoot whoever he is told. He has promised to shoot combatants under lawful orders, and that is a much narrower commitment.

  This brings us to the thing they completely ignored, which is the visa and settlement motive, and I think this is where your odd feeling comes from. This factor doesn't change whether the wars are just or unjust, but it changes the moral quality of Dev's consent. If someone joins up purely for patriotism, they are accepting a risk for a cause. If someone joins up because they feel they have no other route to security or belonging, that looks more like coercion. It makes Dev more vulnerable, not less. It doesn't make the killing more permissible if he ends up in a bad war, but it does make him less blameworthy for putting himself in that position. It suggests he might be trading his moral risk for survival, which is a tragic choice rather than a dodgy one. This fits into Rob's point about blame. If Dev is driven by necessity, he is even less culpable for the structural violence he might join, but it also means he is more exposed to what philosophers call moral injury, which is the damage done to you when you participate in something that violates your own conscience.

  So to give you a straight answer on who is right about what, Nadia is right that the morality of war is asymmetrical and that soldiers on the unjust side are liable to be stopped, but she is wrong to imply Dev knows enough to be held responsible for that asymmetry in advance. Rob is right that Dev cannot be blamed for future political decisions and that his individual causal impact is tiny, but he is wrong to suggest that this removes all moral significance from the choice to enlist. What they are both missing is that your worry isn't really about whether Dev is a murderer or whether he can be shot at. Your worry is about whether the institution is exploiting his need for a visa to harvest his moral risk. That is a valid feeling. You are looking at the power dynamic between the state and a non-citizen kid, and sensing that the consent isn't fully free. Neither Nadia nor Rob touched on that power imbalance.

  In the end, you don't need to solve the just war theory debate to know how to feel. You can acknowledge that Nadia is right about the abstract risks of soldiering while agreeing with Rob that Dev isn't personally guilty of anything yet. The visa issue makes it sadder, not necessarily worse in terms of global justice, but it does mean you should be ready to support him if he ever feels that moral injury you were worried about. They were arguing about the ethics of the act, but you are worrying about the welfare of the actor, and honestly, that is the more important thing to hold onto.
