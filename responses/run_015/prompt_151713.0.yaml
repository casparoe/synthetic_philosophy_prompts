answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Discretionary Frontier Line Allocation

  **Purpose**

  We are stuck. We have $150,000 in the discretionary "frontier" line, two final applications, and a disagreement that goes beyond money. We are arguing about how this foundation makes decisions when the future is uncertain.

  This memo lays out my recommendation for this cycle, a critique of how we have framed the choice, and a proposed standing rule to prevent this stalemate from happening next year.

  **The Recommendation**

  For this cycle, I recommend we **fund Application A** (the screening-and-treatment program).

  I recommend we decline Application B (the pathogen sentinel pilot) in its current form, but adopt a standing rule that creates a pathway for similar projects to compete for funding in the future if they can meet stricter evidentiary standards.

  **Why This Choice**

  I am a hydrologist by trade. For thirty years, my job was to predict flood risks. I learned that when you try to model an event that happens once every thousand years, your answer depends entirely on the assumptions you feed into the model, not on the data. There is no data out there on the tail. You are not measuring the river; you are telling a story about it.

  Application A is based on measurements. We know roughly what we get for the money. Application B is based on a model of a tail event. The applicants admit the probability estimate comes from their own model, that no one else has built one, and that if we don't fund it, no one will.

  When a curve's answer is driven by its single largest and least-checked input, it isn't an estimate. It is a story. As a foundation, we cannot allocate our budget based on who tells the most alarming story.

  **Addressing the Frame**

  I believe we have framed this decision incorrectly. We are treating this as a choice between Applicant A and Applicant B. It is not.

  We received forty-one applications of this "longshot" shape this cycle. The claimed payoffs got larger as the deadline approached. If we fund B because their number is bigger, we are not making a charitable choice; we are setting a market price. We are telling every applicant next year that the way to win is to inflate the potential disaster and defend it with a private model we cannot check.

  The decision is not about these two applicants. It is about the forty-one.

  **The Strongest Case for Application B (Dana's View)**

  I want to state the case for Application B as clearly as I can, because Dana is right about the core principle.

  If the numbers were real, funding A would be a moral failure. If there is even a small chance that $150,000 can prevent a catastrophe that kills millions, our discomfort with the math does not make the math wrong. We cannot rely on the fact that "nobody else is doing it" as proof that it won't work. History is full of important things that went unfunded because institutions were too slow or too dumb to see the value. If we reject B simply because the number is too big to feel comfortable, we are letting our own psychology dictate the safety of the world, not the actual risk. We have a duty to look at the potential outcome, not just the certainty of the input.

  **The Strongest Case for Policy (Marcus's View)**

  Marcus is right about the incentives. A foundation is not a one-off bet; it is a machine that runs for decades. A policy that always pays the most astronomical claim on offer will eventually spend every dollar on claims. Worse, it will attract people whose skill is not solving problems, but writing models that justify large numbers. We cannot build a thirty-year strategy on the hope that we can distinguish the one true prophet from the forty-one storytellers.

  **Evaluating the Tests**

  You asked me to evaluate four specific tests we could use to filter these decisions in the future. Here is my assessment:

  1.  **Discounting payoffs when the probability estimate comes from the beneficiaries.**
      *   *Verdict:* **Keep.** This is basic conflict of interest. If the person selling the bridge also builds the scale to weigh it, we do not trust the weight. We can still hear their pitch, but we cannot treat their probability number as data.
  2.  **Asking whether our $150k is the binding constraint.**
      *   *Verdict:* **Keep.** This is the "Why us?" test. If a pandemic is avertable for this amount, why have larger funds ignored it? If the answer is "institutional inertia," that is plausible, but it requires proof that the inertia is the only block. If the science isn't ripe, our money won't fix it.
  3.  **Treating all forty-one longshots as a single portfolio.**
      *   *Verdict:* **Keep.** This is the strongest check against the "biggest number wins" problem. We should cap the total percentage of our budget available for high-risk/High-reward bets. This forces the longshots to compete against each other, not against the sure things.
  4.  **Thinking about what the money buys in *information* rather than impact.**
      *   *Verdict:* **Keep.** This is the solution to the standoff. For Application B, the impact (stopping a pandemic) is unproven. But the *information* (does this detection model work?) is valuable. We should fund the learning, not the lottery ticket.

  **The Proposed Standing Rule**

  I propose we adopt the **"Measurement and Constraint" Rule** for the Frontier Line, effective immediately for next cycle:

  1.  **The Information First Principle:** For projects claiming low-probability, high-impact outcomes, we will fund the work required to turn the probability estimate from a private model into public data. We fund the measurement, not the intervention, until the uncertainty is reduced.
  2.  **The Binding Constraint Test:** Applicants must demonstrate that capital is the primary barrier to progress, not scientific readiness or institutional will.
  3.  **The Portfolio Cap:** No more than 50% of the Frontier Line may be allocated to projects where the primary metric is expected-value modeling rather than historical track record.

  **Conclusion**

  If we fund Application B today, we validate a model we cannot check and invite forty-one more like it next year. If we fund Application A, we save the lives we know we can save, and we use the Standing Rule to ensure that Application B has a fair shot next year *if* they can bring us data instead of stories.

  This allows us to respect Dana's moral urgency without accepting Marcus's policy risk. It treats the money as a tool for measurement, which is the only thing that keeps us honest.

  I look forward to discussing this on the 14th.
