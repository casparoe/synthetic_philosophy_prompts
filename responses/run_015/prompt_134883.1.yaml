rrelated agents even exist and falls apart. Nadia then proposed what she called a "swap test": a counterpart only counts if, before either of you chooses, you'd have been indifferent to trading places with them — which she said screens out both the anti-correlated case and the different-payoffs case and leaves a clean reason to cooperate. Sam said that's the tell, because the swap test is a moral condition smuggled in: it's basically "act only on a rule you'd be fine with from either side," the universalizability / golden-rule sort of idea, just wearing decision-theory clothes, so the large-world argument isn't a decision-theoretic argument at all and inherits whatever is wrong with that. Nadia said fine, but even if that's what the argument really is, that's a discovery about its structure and not a refutation, and Sam still hasn't said why the correlation in the clean case gives you no reason at all. I genuinely can't tell who's winning and I don't want to just side with whoever sounded more confident.

