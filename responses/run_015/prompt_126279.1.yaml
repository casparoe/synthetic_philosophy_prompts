  # ADVERSARIAL COLLABORATION PROTOCOL: PROJECT "IRON CAGE"
  **Signatories:** The Weberian Caucus vs. The Structuralist Bloc
  **Facilitator:** Phil. Sci. Desk

  ### 1. AGREED CLAIMS (The Non-Negotiables)
  *Both parties affix signatures below acknowledging the following premises. Violating these voids the treaty.*

  1.  **Historical Fixity:** Both sides agree on the basic chronology of the Protestant Reformation and the acceleration of capitalist enterprise in Northwestern Europe (1550–1750). Disputes over interpretation cannot contradict established archival dates.
  2.  **No Magic Bullets:** Both sides acknowledge that monocausal explanations are heuristically useful but ontologically false. Neither "ideas alone" nor "materials alone" operate in a vacuum; the dispute is about *primacy* and *mechanism*, not exclusivity.
  3.  **Causal Requirement:** To claim $X$ causes $Y$, one must demonstrate a counterfactual dependence: if $X$ were absent (or significantly altered), $Y$ would not have occurred in the same manner or timeframe, ceteris paribus.
  4.  **Agency Constraint:** Human agents act within constraints. Neither side claims agents are fully free (libertarian) nor fully determined (robotic). The disagreement is on which constraints bind tighter.
  5.  **Data Integrity:** Both sides agree to use the same datasets regarding guild records, sermon frequencies, and trade volumes. Cherry-picking regions that only fit one model is prohibited.

  ### 2. DISAGREEMENTS TABLE (The Kill Zone)
  *This is where the blood is. We need precise formulations so we know who loses if the evidence turns.*

  | Crux | Weberian Formulation (Signable) | Structuralist Formulation (Signable) | Shared Predictive Case | Weberian Prediction | Structuralist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Macro-Level Causal Exclusion** | Values are not epiphenomenal; value-rational action constitutes an independent causal pathway that is not excluded by material sufficiency. | Material conditions are causally sufficient; values are dependent variables that cannot exert independent macro-causal power without violating exclusion principles. | A region with identical material conditions (trade routes, capital density) but different dominant religious ethics. | Capitalist intensity will vary significantly based on the religious ethic present. | Capitalist intensity will remain statistically invariant; religious differences will correlate but not drive variance. |
  | **2. Status of "Elective Affinity"** | Elective affinity is a causal selection mechanism where values filter which material opportunities are seized. | Elective affinity is a hermeneutic overlay describing correlation; it adds no explanatory power beyond material alignment. | The adoption of specific legal codes matching religious doctrine in emerging market hubs. | Legal codes are adopted *because* they resonate with the ethical framework (values drive selection). | Legal codes are adopted because they serve economic efficiency; religion is merely the language used to justify them. |
  | **3. The Counterfactual Reformation** | If the Protestant Ethic had not emerged, modern rational capitalism would have been delayed or taken a fundamentally different structural form. | If the Protestant Ethic had not emerged, modern rational capitalism would have emerged anyway via alternative ideological rationalizations. | A hypothetical scenario where Catholic regions industrialize first without theological shift. | Impossible without a functional equivalent to the Protestant Ethic. | Inevitable given material pressures; ideology would have adapted to fit the economics. |

  ### 3. VERBAL DISAGREEMENT CHECK
  *Is any of this just semantics?*

  **Verdict:** Yes, partially.
  **Location:** The definition of "Material Conditions" in Crux 1.
  **Analysis:** The Structuralists often smuggle "institutional rules" into the category of "Material," while Weberians classify institutions shaped by values as "Cultural." If an institution (like property law) is caused by values but acts as a material constraint, both sides claim it.
  **Resolution:** For the purpose of this study, "Material" is restricted to physical resources, technology, and demographic pressures. "Institutions" are treated as the contested middle ground where values crystallize.

