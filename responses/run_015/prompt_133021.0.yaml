answer: |-
  This is a classic case of a rhetorical slogan doing heavy philosophical lifting without carrying the necessary baggage. In an EA context, where "Moral Circle Expansion" (MCE) is a core concept, this argument feels intuitive, but as you suspect, it conflates descriptive history, normative metaphysics, and epistemic humility.

  Here is a breakdown of the precise theses hidden inside that sentence, evaluated by their truth status and their ability to support your friend's two-step move:
  1.  **The Prediction:** Moral concern will continue to widen (e.g., to animals).
  2.  **The Normative Kick:** Therefore, current intuitions permitting factory farming are likely mistaken and should be discounted.

  ### 1. The Empirical Regularity Thesis
  *   **The Claim:** History shows a robust, contingent trend where groups in power gradually extend moral consideration to previously excluded groups (tribe $\rightarrow$ nation $\rightarrow$ race $\rightarrow$ sex $\rightarrow$ species).
  *   **Status:** **Substantive and Defensible (with caveats).** Historians like Steven Pinker or Peter Singer argue this data holds up, though others note it's non-linear (e.g., backsliding in the 20th century) and often driven by material conditions rather than pure moral insight.
  *   **Supports "Expect Widening"?** **Weakly.** Induction suggests it might continue, but past performance doesn't guarantee future results, especially as low-hanging fruit (human rights) are picked and harder cases (animals/AI) arise.
  *   **Supports "Discount Intuitions"?** **No.** This is the Is-Ought gap. Even if the circle *has* widened, that doesn't mean the widening is *correct*. If the trend were toward cruelty, we wouldn't say "we should discount our intuition that cruelty is bad." The trend itself has no normative authority unless linked to truth.

  ### 2. The Teleological Mechanism Thesis
  *   **The Claim:** There is a lawlike, irreversible force (historical, spiritual, or evolutionary) that *ensures* moral progress occurs regardless of human action.
  *   **Status:** **Probably False.** This is a secularized version of Providence. History shows moral progress is fragile and reversible (see: 1930s Europe). There is no known sociological law that prevents backsliding.
  *   **Supports "Expect Widening"?** **Strongly.** If it's a law of nature, it will happen.
  *   **Supports "Discount Intuitions"?** **No.** A blind force bending the universe doesn't track moral truth; it just tracks change. If the "force" is just evolutionary pressure for cooperation, it might stop at the point where cooperation becomes costly (e.g., at the species barrier).

  ### 3. The Moral Convergence (Realism) Thesis
  *   **The Claim:** Moral truths exist independently of us, and human moral reasoning is gradually improving its ability to detect them. The "widening" is actually a "cleaning of the lens."
  *   **Status:** **Substantive and Controversial.** This requires Moral Realism. It posits that excluding beings based on arbitrary traits (skin color, species) is an error similar to math errors, which we are slowly correcting.
  *   **Supports "Expect Widening"?** **Moderately.** If we are converging on truth, and the truth includes animals, then yes. But convergence could theoretically stop anywhere.
  *   **Supports "Discount Intuitions"?** **Yes.** This is the only thesis that actually justifies the move. If the trend represents *error correction*, then current intuitions that conflict with the trajectory are likely errors (like slaveholder intuitions). **However**, this requires your friend to prove that "including animals" is actually part of the moral truth, not just a cultural shift.

  ### 4. The Selection Bias (Whig History) Thesis
  *   **The Claim:** "Progress" is defined retrospectively. We call past changes "progress" only because we endorse the outcome. We count the expansions we like (civil rights) and ignore contractions or lateral moves.
  *   **Status:** **Platitude / Cynical Truth.** It is trivially true that we label history to suit our current values.
  *   **Supports "Expect Widening"?** **No.** If "progress" is just "what we currently like," this slogan cannot predict what *future* people will like. It creates a circular argument: "The future will look like justice" means "The future will look like what I currently think is justice."
  *   **Supports "Discount Intuitions"?** **No.** It undermines the argument entirely. If the "arc" is just a mirror of current preferences, it gives you no reason to think future people will judge *your* specific intuition (about animals) differently than you do now.

  ### 5. The Agency-Dependent Thesis (MLK's Actual View)
  *   **The Claim:** The arc does not bend automatically; it bends *because* people grab it and pull. "Justice" is the equilibrium reached after sufficient struggle.
  *   **Status:** **Substantive and Defensible.** This aligns with MLK's actual usage (influenced by Theodore Parker). It treats the quote as a call to action, not a prediction.
  *   **Supports "Expect Widening"?** **No.** It explicitly denies automatic widening. Without work, the arc stays straight or bends toward tyranny.
  *   **Supports "Discount Intuitions"?** **Conditionally.** It supports the idea that current norms are contingent and can be changed, but it doesn't suggest the future will *automatically* vindicate the EA view. It says, "If you want factory farming to be seen as slavery, you have to make it so."

  ### 6. The Scope-vs-Depth Thesis
  *   **The Claim:** The "widening" is only about *who* counts, not *what* we owe them. We might count animals in the moral circle but assign them negligible weight, just as we count distant foreigners but prioritize locals.
  *   **Status:** **Substantive.** It distinguishes between *moral status* (you matter) and *moral weight* (you matter this much).
  *   **Supports "Expect Widening"?** **Ambiguously.** We might extend status to animals without extending sufficient protection to end factory farming.
  *   **Supports "Discount Intuitions"?** **No.** Your friend's argument relies on the future viewing factory farming as *wrong* (like slavery), not just acknowledging animals exist. If the future grants animals status but accepts "humane" slaughter, the analogy to slaveholders fails.

  ---

  ### The "Digital Minds" Trap
  **Does any reading commit you to saying the trend continues into territory people currently find weird?**

  *   **The Convergence Thesis (3)** is the only one that *could* commit you to digital minds. If the mechanism of expansion is "sentience" or "capacity for suffering," and digital minds possess those traits, logical consistency demands you include them.
  *   **The Empirical Thesis (1)** does *not* commit you. Historical expansion has been based on biological kinship or social contract. Digital minds break that pattern. You can consistently believe the trend is "biological beings gain rights" and stop at animals.
  *   **The Selection Bias Thesis (4)** explicitly lets you pick the endpoint. It allows you to say, "The arc bends toward *my* version of justice," which includes animals but conveniently stops before the weird stuff (AI, wild animal suffering) that you don't want to deal with.

  **The Verdict on Your Friend's Move:**
  Your friend is smuggling **Thesis 3 (Convergence)** into **Thesis 1 (Empirical Trend)**.
  *   They observe a trend (1).
  *   They assume the trend tracks truth (3).
  *   They conclude current dissenters are wrong.

  **Why this is fragile:**
  If you press them, they have to explain *why* the trend tracks truth. If they say "because more inclusion is always better," they are asserting a moral axiom, not observing history. If they say "because future people will be smarter," they are assuming moral progress is correlated with technological/intellectual progress (debatable).

  **How to respond:**
  Acknowledge the trend (Thesis 1) but challenge the inference to truth (Thesis 3). You can say:
  > "I agree the circle has expanded. But to use that to discount our current intuitions, we need to know the expansion is *corrective* and not just *cultural*. If the 'arc' is just moral fashion, future people might look back at us like we look at slaveholders, but they could also look back at us like we look at 1970s nutritionists—well-meaning but wrong about the specifics. Unless we have a independent reason to think 'including animals' is moral truth rather than just the next step in a sociological trend, the arc doesn't tell us which intuition to discount."

  This forces them to defend the **Convergence Thesis**, which is much harder to defend than the **Empirical Thesis**.
