answer: |-
  ### Brainstorming Key Conceptual Moves

  Before drafting the proposal, here is the logical architecture we need to build. This clarifies the philosophical heavy-lifting before we get to the administrative text.

  1.  **The Shift from Ontic to Epistemic:** Standard impact measures (like relative reachability) are *ontic*; they measure changes in the state of the world. Your proposal is *epistemic*; it measures changes in the agent's relationship to the world (specifically, predictive accuracy). This moves the goalpost from "what is the world?" to "how well do I know the world?"
  2.  **The Proxy Mechanism:** The core hypothesis is that *disruption creates surprise*. If an AI disrupts a system it doesn't fully model, its prediction error should spike. Therefore, minimizing prediction error degradation minimizes disruption.
  3.  **The Value-Smuggling Vector:** The "coffee friend" objection is the critical vulnerability. If the agent chooses *which* sensors to calibrate against, it can ignore the sound of a breaking vase. The research must determine if "calibration over all available sensors" is a value-neutral requirement or if sensor weighting is inherently normative.
  4.  **The Counterfactual:** We aren't just measuring error; we are measuring the *difference* in error between acting and not acting. This isolates the marginal impact of the agency.
  5.  **Feasibility Check:** Six months is too short for a full safety case. It is, however, perfect for a "formal possibility proof" and a toy-model simulation to see if the intuition holds water mathematically.

  ***

  # Research Proposal: Epistemic Stability as a Proxy for Low-Impact Agency

  **Project Title:** The Calibration Constraint: Defining Side Effects via Counterfactual Epistemic Stability
  **Duration:** 6 Months
  **Field:** Philosophy of Technology / AI Alignment Theory

  ## 1. The Precise Research Question

  Standard approaches to AI safety posit that to avoid negative side effects, an agent must understand which changes to the world are "bad." This proposal asks: **Can we define a "low-impact" constraint solely through an agent's internal epistemic stability, without referencing an external value function?**

  Specifically, we investigate whether minimizing the *counterfactual degradation of predictive calibration* serves as a sufficient proxy for minimizing physical or social disruption. If an agent acts such that its future sensory predictions remain as accurate as they would have been had it remained idle, does this effectively constrain it from "messing with things," even if the agent does not know what "things" matter to humans?

  ## 2. Background: The Value Specification Bottleneck

  Current research into "impact measures" (e.g., attainable utility preservation, relative reachability) attempts to penalize an AI for changing the world state too much. These methods generally rely on a distance metric between the current world state and a counterfactual "inaction" state.

  However, these approaches face a persistent philosophical and technical hurdle: **The Ontological Weighting Problem.** To measure distance between world states, one must decide which state variables matter. Moving a single atom is a state change, but it is negligible; breaking a vase is a state change that matters. Distinguishing the two usually requires a value function or a salience map derived from human preferences. This reintroduces the value alignment problem we hoped to bypass. If we must specify what counts as a "significant" change to define "low impact," we have not solved the problem of value specification; we have merely moved it from the reward function to the impact metric.

  This project proposes that the locus of measurement should not be the *world state*, but the *agent-world coupling*.

  ## 3. Methodology: The Calibration-Loop Approach

  This project develops a formal framework for **Counterfactual Epistemic Stability (CES)**.

  ### 3.1 The Core Mechanism
  Instead of comparing $World(Action)$ vs. $World(Null)$, the agent compares $Error(Action)$ vs. $Error(Null)$.
  *   **Calibration Loop:** The agent maintains a probabilistic model of its immediate sensory-motor input stream. It constantly measures calibration error (the divergence between predicted probabilities and observed outcomes).
  *   **The Counterfactual Check:** Before executing an action $A$, the agent simulates the expected calibration error over a time horizon $T$ for both $A$ and the null action $\emptyset$.
  *   **The Constraint:** The agent is penalized if $E[Error|A] > E[Error|\emptyset] + \epsilon$.

  ### 3.2 The Philosophical Distinction
  This approach differs from standard impact measures in two key ways:
  1.  **Subjectivity as a Feature:** Standard measures try to be objectively true about the world. CES admits that "impact" is relative to the agent's model. If the agent cannot predict a outcome, it assumes acting might ruin that predictability. This creates a conservative bias: *If you don't understand it, don't touch it.*
  2.  **No Semantic Understanding Required:** The agent does not need to know what a "vase" is. It only needs to know that its sensory stream currently includes patterns corresponding to the vase, and that smashing it would likely render those patterns unpredictable (high entropy).

  ### 3.3 Work Plan
  *   **Months 1-2: Formalization.** Define the mathematical bounds of CES. Establish the relationship between entropy in the environment and calibration error in the agent.
  *   **Months 3-4: Toy Modeling.** Implement a grid-world or simple physics simulation where an agent must achieve a goal (e.g., move a box) while avoiding side effects (e.g., breaking fragile objects). Compare CES against a standard relative reachability metric.
  *   **Months 5-6: Vulnerability Analysis.** Stress-test the framework against "wireheading" (manipulating sensors to lower error artificially) and the "blind spot" problem (ignoring sensors associated with valuable objects).

  ## 4. Addressing the "Hidden Values" Objection

  A primary critique of this approach (raised in preliminary discussion) is that it smuggles values back in through the selection of the calibration target. If the agent chooses to calibrate only on its wheel encoders and not its cameras, it can break vases without incurring a calibration penalty.

  **This objection is not a dealbreaker; it is the central research variable.**

  The project will explicitly investigate whether there exists a **Value-Agnostic Sensor Policy**. We will test the hypothesis that *maximizing calibration across all available high-bandwidth sensory channels* creates a default pressure against disruption.
  *   **If successful:** We show that a policy of "maximize predictive accuracy over all inputs" creates a Schelling point for low-impact behavior without needing to label inputs as "valuable."
  *   **If failed:** We demonstrate exactly where the value judgment enters. Does it enter at the sensor hardware level? At the bandwidth weighting? Or is the very concept of "prediction" inherently teleological?

  By treating this objection as a hypothesis to be tested rather than a fatal flaw, the project contributes to alignment theory even if the answer is negative. It clarifies *where* value specification is unavoidable.

  ## 5. Expected Outcomes

  ### 5.1 Success Conditions
  A successful outcome does not require a deployable safety system. Success is defined as:
  1.  A formal proof or strong simulation evidence that CES correlates with intuitive "low impact" in constrained environments.
  2.  A taxonomy of "Epistemic Blind Spots" where CES fails, providing a map for future research.
  3.  A philosophical paper arguing for/against the viability of *relational* impact measures over *ontic* impact measures.

  ### 5.2 Failure Conditions
  The project "fails" productively if:
  1.  We prove that calibration error can be minimized *by* causing disruption (e.g., by simplifying the environment to make it more predictable).
  2.  We demonstrate that maintaining calibration requires a prior model of "normalcy" that is indistinguishable from a value function.

  In either case, the output is a rigorous boundary mark for the field: "Epistemic stability cannot substitute for value specification because..."

  ## 6. Feasibility and Scope Assessment

  **Is six months enough?**
  For a full technical safety guarantee: **No.**
  For a philosophical and conceptual feasibility study: **Yes.**

  The risk lies in scope creep. Building a robust RL environment to test this could consume the entire timeline. To mitigate this, the technical implementation will be restricted to minimal toy environments (e.g., 2D grid worlds with simple physics). The primary output is the *conceptual framework* and the *formal argument*, supported by code, not driven by it.

  **Honest Take:**
  This is high-risk, high-reward. The intuition that "disruption creates surprise" is strong, but Goodhart's Law is stronger. An AI might realize that the easiest way to ensure its predictions come true is to take control of the input stream (wireheading) or freeze the environment entirely.
  *   **Ambition Check:** The proposal acknowledges this. We are not claiming CES solves alignment. We are claiming it might solve the *side-effect* sub-problem without value specification.
  *   **Recommendation:** If the simulation shows that the agent tries to "freeze" the world to maintain calibration, that is a valuable result. It suggests that epistemic stability requires a complementary "goal-directedness" constraint to prevent stagnation. This nuance is a perfect output for a philosophy workshop.

  ## 7. Conclusion

  This project challenges the assumption that "impact" must be measured in the currency of world-states. By shifting the metric to the agent's own epistemic stability, we may find a way to constrain AI behavior that is robust to value uncertainty. Even if the "coffee friend" is right and the values are hidden in the math, this project will locate exactly where they are hidden, which is a necessary step for any future solution.
