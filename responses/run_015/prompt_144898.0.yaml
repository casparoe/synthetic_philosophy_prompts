answer: |-
  ### Credence Decomposition

  **Proposition:** *The verdict that natural selection is unfalsifiable in isolation does no demoting work; evolutionary biology is not less scientific than physics on Popper's own criterion.*

  **My Final Credence:** **0.82**

  #### Term Pricing

  **1. That the general principle really is unfalsifiable in isolation once formalized properly (covariance form).**
  **Credence: 0.85**
  **Justification:** The Price equation is a mathematical identity; the heterozygote equilibrium case confirms this by showing the formalism absorbs stasis via the transmission term rather than being refuted, proving its bookkeeping rather than predictive nature in isolation.

  **2. That the central laws of a paradigm physical science are unfalsifiable in isolation in the same sense.**
  **Credence: 0.90**
  **Justification:** Newton's Second Law ($F=ma$) functions similarly as a definition unless force and mass are independently specified, invoking the Duhem-Quine thesis which applies universally across theoretical sciences.

  **3. That testability of specific models plus auxiliary hypotheses is enough to satisfy Popper's criterion for the whole enterprise.**
  **Credence: 0.75**
  **Justification:** While mature Popperism accepts testing derived consequences, his early demarcation writings are ambiguous on whether a "metaphysical core" permits the *entire* discipline to claim full scientific status equal to physics.

  **4. That "metaphysical research programme" is, inside Popper's own scheme, a tolerable or even honourable status rather than a demotion.**
  **Credence: 0.95**
  **Justification:** Popper explicitly distinguished "metaphysical" from "meaningless" in his later work, framing metaphysical ideas as indispensable engines of discovery that precede empirical testing.

  **5. That his late retreat surrendered the substance of the charge and not merely its wording.**
  **Credence: 0.80**
  **Justification:** He admitted specific selection hypotheses are testable, which concedes the practical scientificity of the field, even if he retained the "metaphysical" label for the general principle.

  ---

  #### Missing Sub-Question

  **The Operational Independence of Fitness:**
  You have priced the formal structure, but omitted the empirical measurement of fitness. A critical sub-question is: *Can fitness be measured independently of differential survival (e.g., via physiological propensity)?* If fitness is measurable *a priori*, the "tautology" charge collapses empirically even if the formal structure remains an identity. This bridges Term 1 and Term 3.

  ---

  #### Combination and Arithmetic

  These terms do not multiply. Multiplication implies a causal chain where the failure of any single term collapses the proposition (a logical AND). However, these terms function as **convergent supporting arguments** (a logical OR/Weighted structure). For the proposition to hold, we do not need *every* term to be maximally true; we need the *weight* of the defense to outweigh the demotion charge.

  *   **Term 1** establishes the premise (granted for the argument).
  *   **Terms 2 & 4** are the primary pillars: If Physics is the same (T2) and Metaphysics is honorable (T4), the "demotion" fails regardless of T1.
  *   **Term 3** is the bridge: It connects the abstract principle to actual practice.
  *   **Term 5** is historical context supporting the legitimacy of the practice.

  **Calculation:**
  I treat the final credence as a weighted average of the pivotal defensive terms (T2, T3, T4), as T1 is the condition being conceded and T5 is secondary historical evidence.
  Weights: T2 (0.4), T4 (0.4), T3 (0.2).
  $$(0.90 \times 0.4) + (0.95 \times 0.4) + (0.75 \times 0.2) = 0.36 + 0.38 + 0.15 = 0.89$$
  I discount this slightly to **0.82** to account for the correlation risk: if T3 fails (Popper strictly requires core falsifiability), T2 and T4 matter less. The "early Popper" shadow reduces my confidence.

  **Sensitivity Flag:**
  My final number is most sensitive to **Term 3**. If strict early Popperism is the "true" criterion (rather than the mature, nuanced view), then testing models is insufficient, and the enterprise *is* demoted regardless of the physics analogy. A shift in T3 from 0.75 to 0.40 would drop my final credence below 0.60.

  ---

  #### Disagreement Analysis

  **You (0.7) vs. Friend (0.25):**
  Your friend believes the question turns on **Term 1** (whether the tautology charge sticks). They assume that if the principle is tautological, demotion is automatic.
  I believe the disagreement actually turns on **Term 4** (the status of "metaphysical").
  *   **Friend's View:** Metaphysical = Non-scientific (Demotion). Therefore, if T1 is true, Biology is demoted.
  *   **My View:** Metaphysical = Pre-scientific framework (Honorable). Therefore, even if T1 is true, Biology is not demoted.
  Your friend assigns a near-zero probability to the proposition because they interpret "metaphysical" as a pejorative exclusion from science. I assign a high probability because I interpret it as Popper's technical term for "not yet tested but potentially fruitful."

  **Evidence to Move My Number:**
  The single piece of evidence that would move my number the furthest (downward) is **a definitive text from Popper explicitly ranking sciences with unfalsifiable cores as "inferior" or "proto-scientific" compared to physics.**
  Currently, I rely on his *Unended Quest* and *Realism and the Aim of Science* where he is charitable. If a lecture transcript existed where he told biologists, "Your field is metaphysical and therefore second-rate compared to Newtonian mechanics," my credence in Term 4 would collapse, dragging the final number down to ~0.40.
