answer: |-
  # JOINT STATEMENT ON INSIDE-VIEW REASONING AND OUTSIDE-VIEW EPISTEMIC MODESTY

  **Parties:** The Inside-View Mechanists (IVM) and The Outside-View Modestists (OVM)
  **Date:** October 26, 2023
  **Subject:** Structural and Normative Disagreements Regarding Forecasting Methodologies

  ## Part I: Agreed Claims

  The undersigned camps affirm the following propositions as structurally and conceptually valid, notwithstanding their normative disagreements regarding the weighting of these factors in final judgment.

  1.  **Formal Decomposability:** Any explicit probabilistic forecast can be formally decomposed into a *mechanistic component* (derived from a causal model of the specific system) and a *reference-class component* (derived from the statistical frequency of outcomes in a group of similar cases). While camps differ on which component should dominate, both agree these components are distinct inputs to a final credence.
  2.  **The Overconfidence Regularity:** In domains characterized by long time horizons, complex causal chains, and delayed or noisy feedback, uncalibrated human forecasters systematically exhibit overconfidence. Both camps agree that raw, unadjusted intuition is an unreliable guide in these specific conditions.
  3.  **Bayesian Consistency of Class Membership:** Learning that one's own reasoning process belongs to a specific reference class (e.g., "predictions made by experts in this field") constitutes relevant evidence. It is logically consistent to update one's credence upon acquiring this information; the disagreement lies solely in the magnitude of the update required.
  4.  **Existence of Structural Scarcity:** There exist domains of inquiry where direct historical analogues are genuinely scarce or non-existent due to rapid structural change or novelty. Both camps agree that in such domains, constructing a reference class requires abstraction that may dilute the similarity between the base cases and the target case.
  5.  **Recursive Coherence:** The question of whether the principle of epistemic modesty applies to itself is conceptually coherent. It is meaningful to ask whether a reasoner should be modest about their application of modesty, and both camps agree this generates a potentially infinite regress of second-order and third-order confidence assessments.

  ***

  ## Part II: Disagreements Table

  | Issue | Inside-View Mechanist Formulation | Outside-View Modestist Formulation | Status & Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Self-Referential Calibration** | A reasoner can validly apply a calibration adjustment to their own argument if they can mechanistically explain *why* their case deviates from the reference class average, provided this explanation is locally justified. | A reasoner's assessment of their own deviation from the reference class is subject to the same cognitive biases as the initial forecast; therefore, self-applied calibration adjustments cannot be trusted without external verification. | **Substantive**<br><br>**Crux:** Can a second-order error estimate (an estimate of one's own bias) be epistemically privileged over a first-order base rate without invoking a third-order verification? |
  | **2. Scarcity vs. Broadening** | When direct historical analogues are scarce, the reference class becomes too noisy to be informative; the mechanistic model should dominate because the base rate is effectively uninformative noise. | When direct historical analogues are scarce, the reasoner must broaden the reference class to include structurally analogous cases; a broad base rate is always more informative than an unverified causal model. | **Substantive**<br><br>**Crux:** At what threshold of dissimilarity does a broadened reference class lose more predictive power than it gains in sample size, relative to a specific causal model? |
  | **3. Recursive Modesty** | Epistemic modesty is a corrective heuristic for known biases; if a mechanistic model accounts for these biases explicitly, the demand for further modesty dissolves. | Epistemic modesty is a structural constraint on the reasoner, not just the reasoning; therefore, confidence in the mechanistic model must be downgraded by the historical failure rate of similar *applications* of modesty. | **Partly Verbal / Substantive**<br><br>**Crux:** Is "modesty" a rule about *evidence weighting* (Substantive) or a rule about *agent humility* (Verbal)?<br><br>**Verbal Resolution:** If "modesty" is defined strictly as "weighting evidence according to reliability," the regress stops at the reliability of the evidence. If defined as "suspecting one's own capacity to weigh evidence," the regress continues. |

  ***

  ## Part III: Cruxes and Predictive Tests

  For each substantive crux identified in Part II, the camps propose the following designed scenarios to adjudicate the dispute.

  ### Crux 1: The Self-Reference Problem of Second-Order Calibration

  **Scenario:**
  A researcher (R) constructs a causal model predicting the timeline for a novel technological deployment. R identifies a reference class of "past predictions for novel technologies by experts," which has a historical failure rate of 80%. R argues that 70% of those failures were due to a specific error (e.g., underestimating regulatory friction) which R's model explicitly accounts for. R claims exemption from the 80% failure rate for that subset, adjusting their confidence accordingly.

  **Camp Assessments:**
  *   **IVM Prediction:** R is justified in adjusting their confidence upward relative to the raw base rate, provided R's account of the past failures is factually accurate and mechanistically integrated into R's model.
  *   **OVM Prediction:** R will overestimate the degree to which their model avoids the historical error. R should collapse their confidence toward the 80% failure rate because the claim of exemption is itself a prediction subject to the same failure modes.

  **Update Conditions:**
  *   **Agreed Evidence:** A longitudinal track record of similar researchers who claimed similar exemptions. If researchers who claim "mechanistic exemption" outperform the raw base rate over many trials, IVM is vindicated. If they perform no better than the raw base rate, OVM is vindicated.
  *   **Prediction of Opponent Update:**
      *   *IVM on OVM:* IVM predicts OVM will *not* update even if exemptors succeed, attributing the success to luck or hidden reference-class narrowing.
      *   *OVM on IVM:* OVM predicts IVM *will* update if exemptors fail, as this directly contradicts the mechanistic claim of reliability.

  ### Crux 2: The Granularity of the Reference Class

  **Scenario:**
  A researcher (R) is forecasting the stability of a new financial instrument. There are no direct precedents (narrow class size = 1). There is a broad class of "complex financial derivatives" (size = 10,000) with a known volatility profile. R argues the broad class is irrelevant because the causal structure of this instrument differs fundamentally from the historical average.

  **Camp Assessments:**
  *   **IVM Prediction:** The broad class is misleading. R should rely on the causal model of the specific instrument, as the noise introduced by the dissimilarity of the broad class outweighs the statistical benefit of the large sample size.
  *   **OVM Prediction:** The broad class is the only objective anchor. R's claim of "fundamental difference" is a hypothesis that must be discounted by the failure rate of others who claimed their instruments were fundamentally different.

  **Update Conditions:**
  *   **Agreed Evidence:** A controlled comparison showing predictive accuracy in "novelty" domains. If forecasts based on narrow, mechanistic definitions consistently yield lower Brier scores than forecasts based on broad, statistical classes in high-novelty contexts, IVM is vindicated.
  *   **Prediction of Opponent Update:**
      *   *IVM on OVM:* IVM predicts OVM will dismiss the comparison by arguing the "novelty domains" were not truly novel enough to invalidate broad classes.
      *   *OVM on IVM:* OVM predicts IVM will concede if shown that "fundamental difference" claims historically fail to predict outperformance against the broad average.

  ### Crux 3: Recursive Modesty (Second-Order Confidence)

  **Scenario:**
  A researcher (R) applies an "epistemic modesty" adjustment to their forecast, reducing their confidence from 90% to 60% based on the general fallibility of experts. R is then asked: "What is your confidence that this modesty adjustment is correct?"

  **Camp Assessments:**
  *   **IVM Prediction:** R should not apply a further modesty discount to the adjustment itself if the adjustment is derived from a robust statistical fact (e.g., "experts are overconfident"). The regress stops at the empirical regularity.
  *   **OVM Prediction:** R must apply a further discount. The *application* of the regularity is a cognitive act by a fallible expert. R should hold a credence about the modesty adjustment that is lower than the adjustment itself implies (e.g., being modest about one's modesty).

  **Update Conditions:**
  *   **Agreed Evidence:** A logical or simulation-based demonstration of convergence. If applying recursive modesty leads to a stable fixed point that correlates with reality better than a single-step adjustment, OVM is vindicated. If recursive modesty leads to paralysis (credences collapsing to 0.5) or worse calibration than single-step adjustment, IVM is vindicated.
  *   **Prediction of Opponent Update:**
      *   *IVM on OVM:* IVM predicts OVM will argue that paralysis is the correct epistemic state in high-uncertainty domains, refusing to view it as a failure.
      *   *OVM on IVM:* OVM predicts IVM will accept the fixed-point argument if it can be shown that stopping the regress arbitrarily introduces a new, unquantified bias.
