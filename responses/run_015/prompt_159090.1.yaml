  *(Self-Correction on the "Safety Ban"):* The user says they ban breaking down "is this output a good output?" but *do* break down "is this advice responsible?" This is a subtle distinction. "Good output" might mean "overall system safety/alignment" while "responsible advice" is a local property. I need to be careful not to conflate local normative checks with global system evaluation. The prompt says: "In our own internal safety review, 'is this system's overall behaviour acceptable?' ... are treated as strictly non-decomposable." Okay, so it's the *System Evaluation* vs. *Task Execution*. That's a crucial distinction. It's the difference between *verification* and *validation*. I will build the analysis around that.

