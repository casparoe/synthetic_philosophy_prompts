answer: |-
  ### Private Brainstorming

  (i) **Load-Bearing Premises of Good's Theorem:** The core inequality is $E[\max_{a \in A} E[U(a)|S]] \ge \max_{a \in A} E[U(a)]$. The proof hinges on two specific moves. First, the **Optionality Premise**: the set of acts $A$ available after observing signal $S$ must include the optimal act from the no-information scenario. If observing $S$ removes an act (act-eroding), the $\max$ on the LHS is taken over a smaller set, potentially yielding a lower value. Second, the **Independence Premise**: the probability distribution over states must not depend on the act of observation itself. The standard proof assumes $P(\omega | \text{observe}) = P(\omega)$. If the source is "leaky"—if observing changes the state or the payoffs via another agent's reaction—then the expectation on the LHS is calculated over a different probability space than the RHS, invalidating the comparison. Finally, the **Optimization Premise**: the agent must actually choose $\arg\max$ conditional on the signal. A "fixed-rule updater" violates this by restricting the mapping from posteriors to acts.

  (ii) **Sorting Counterexamples:** Most "information is bad" stories are confusions. "Psychological distress" is just a cost included in $U$; if net value is negative, it's not free information. "Ex post regret" is irrelevant; Good's theorem is about ex ante value. "Bounded rationality" (cost of computation) is a cost of acquisition, violating the "free" condition. Genuine counterexamples require structural violations: game-theoretic settings where observation signals intent (Leaky), legal/physical constraints where knowledge removes plausible deniability (Act-Eroding), or institutional rigidities preventing re-optimization (Fixed-Rule). These aren't failures of the math; they are failures of the *application conditions*.

  (iii) **Fluency Without Understanding:** Students will signal understanding by using buzzwords ("Bayesian update," "prior," "EV") without defining the sample space. They will claim Good's theorem assumes risk neutrality (it doesn't). They will conflate "information is costly" with "information has negative value." They will recite the proof steps without checking if the scenario's definitions map onto the proof's variables. The top students will explicitly write the inequality and show which term changes or becomes incomparable.

  ***

  ### Deliverable 1: Exam Question

  **Course:** PHI 450 – Advanced Decision Theory
  **Exam:** Final Assessment
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Question 1: The Fragility of Information Value**

  Good's Theorem is often summarized by the slogan: "Free information cannot have negative expected value." However, formal results depend on precise structural assumptions that slogans often obscure. Below are three definitions describing deviations from the standard decision-theoretic model:

  1.  **Leaky Source:** An information source is *leaky* if the mere fact that you consult it is observable by some other party whose subsequent behaviour (and thus your payoffs) depends on whether you consulted, regardless of the signal's content.
  2.  **Act-Eroding Source:** A source is *act-eroding* if receiving its output removes some act from your feasible set—most obviously the act of sincerely claiming, or having the record show, that you do not know.
  3.  **Fixed-Rule Updater:** An agent is a *fixed-rule updater* if she revises her beliefs by conditioning but then feeds the posterior into a decision rule she is not free to re-optimize for each message (e.g., "proceed iff the posterior probability of safety exceeds 0.7").

  **Scenario:**
  You are the Security Chief for a high-value facility. The state of the world is either **Safe** ($S$) or **Compromised** ($C$). Your prior probability $P(C) = 0.05$. You must choose between **Normal Operations** ($N$) or **Lockdown** ($L$).
  *   Payoffs: $N$ yields +100 utility in $S$, but -1000 utility in $C$ (catastrophe). $L$ yields 0 utility in both states (costly but safe).
  *   Without information, the expected utility of $N$ is $(0.95 \times 100) + (0.05 \times -1000) = 45$. The expected utility of $L$ is 0. You would choose $N$.

  You are offered a **free** diagnostic scan (Signal $X$) that perfectly reveals the state. However, the system has the following properties:
  1.  **Leaky:** If you run the scan, the adversary (if present in state $C$) detects the scan activity. Upon detection, they immediately trigger the catastrophe regardless of your subsequent action. (Effectively, if you scan and $C$ is true, payoff is -1000).
  2.  **Act-Eroding:** If you run the scan, institutional protocol requires you to log the attempt. You lose the option to later claim "Insufficient Data" to justify $N$; you are forced to choose $N$ or $L$ based strictly on the scan result or the log.
  3.  **Fixed-Rule:** Due to institutional constraints, if you run the scan, you are mandated to follow a fixed rule: "If scan indicates $C$, initiate $L$; if scan indicates $S$, initiate $N$." You cannot override this even if you suspect the scan itself triggered the threat.

  **Task:**
  Write an essay addressing the following:
  1.  Is this scenario a counterexample to Good's Theorem? Justify your answer by explicitly writing out the expected-utility comparison underlying the theorem and identifying precisely which inference in the standard proof fails here.
  2.  Analyze whether the strategy "just ignore the information" is available to you as a reply to this scenario. Why or why not?
  3.  Distinguish between the "genuine" failures of information value in this case versus "apparent" failures (such as psychological cost or ex post regret).
  4.  Conclude with a verdict on the normative status of Good's Theorem. Given that real-world information sources often exhibit these features, is the theorem merely a tautology about idealized agents, or does it retain normative bite for beings like us?

  ***

  ### Deliverable 2: Model Answer

  **Student ID:** [Redacted]
  **Word Count:** 840

  Good's Theorem states that for an expected-utility (EU) maximizer, the expected value of free information is non-negative. Formally, let $A$ be the set of acts and $S$ be the signal. The theorem asserts:
  $$ \sum_{s} P(s) \max_{a \in A} E[U(a)|s] \ge \max_{a \in A} \sum_{\omega} P(\omega) U(a, \omega) $$
  The left-hand side (LHS) represents the expected utility with information; the right-hand side (RHS) represents the expected utility without. The standard proof relies on the inequality $\max_{a \in A} E[U(a)|s] \ge E[U(a^*)|s]$, where $a^*$ is the optimal act without information. Summing this over $s$ recovers the RHS. This scenario is **not** a counterexample to the theorem itself, but it demonstrates a violation of the theorem's application conditions. The theorem holds for EU maximizers in stable environments; this scenario describes a constrained agent in a game-theoretic environment.

  The inference breaks at two distinct points in the proof sketch above. First, the **Independence Premise** is violated by the "Leaky" condition. In the standard proof, the probability distribution over states $P(\omega)$ is assumed independent of the act of observation. Here, observing the signal changes the state dynamics: if $C$ is true and I scan, the adversary triggers the catastrophe. The LHS expectation is calculated over a different causal structure than the RHS. The term $E[U(a)|s]$ implicitly assumes the world remains static conditional on $s$, but here the act of obtaining $s$ modifies the payoff function. Second, the **Optionality Premise** is violated by the "Act-Eroding" and "Fixed-Rule" conditions. The proof assumes that after seeing $s$, I can still choose $a^*$ (Normal Operations). Here, if I scan, I am forced into a fixed rule or lose the plausible deniability required to justify $N$ safely. If the set of acts $A$ shrinks or the mapping from $s$ to $a$ is constrained, the $\max_{a \in A}$ operator no longer guarantees a value higher than the prior optimum.

  Consequently, the strategy "just ignore the information" is **not available** as a simple reply. In the standard argument, "ignoring" means conditioning on the signal but choosing the prior optimal act $a^*$. This works because observing $s$ is payoff-neutral. Here, observing $s$ is not neutral; the "Leaky" nature means the mere act of consulting changes the payoffs. I cannot "ignore" the signal's content while hiding the fact that I looked. The cost is incurred at the node of observation, not at the node of action. Thus, the option to "look and then do what I would have done anyway" yields a lower utility than "not looking," because the "looking" branch leads to a hostile response from the adversary.

  We must distinguish these genuine failures from apparent ones. A common confusion is citing "psychological cost" or "computational cost." These are merely costs of acquisition, turning "free" information into "costly" information, which Good's Theorem already accommodates (value can be negative if cost > benefit). Another confusion is "ex post regret"—learning you made the wrong choice feels bad, but ex ante value remains positive. In this scenario, the failure is structural. The negative value arises not from feelings or costs, but from the information channel altering the state space (Leaky) and restricting the action space (Act-Eroding/Fixed-Rule). These are genuine exceptions to the *advice* derived from the theorem, though not to the theorem's mathematical truth within its own axioms.

  This leads to the normative verdict. Good's Theorem is technically a tautology about what it means to be an unconstrained EU maximizer in a non-reactive environment. It says: "If you can optimize freely and looking doesn't change the world, looking won't hurt you." In that sense, it cannot command us to "go gather evidence" if gathering evidence changes the world or restricts our freedom. However, it retains normative bite as a **diagnostic tool**. When information seems harmful, the theorem forces us to ask: "Which assumption failed?" Did I lose optionality? Did I signal intent? By isolating the fragility—specifically the Independence and Optionality premises—the theorem clarifies *why* ignorance is sometimes preferable. It does not tell us to ignore evidence; it tells us to secure our optionality and privacy before we look. Thus, it remains substantive not as a command to gather data, but as a constraint on the conditions under which data gathering is rational.

  ***

  ### Deliverable 3: Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10/20

  **1. Formal Statement and Proof Sketch (4 Marks)**
  *   **A (4):** Explicitly writes the inequality $E[\max_a E[U|s]] \ge \max_a E[U]$. Identifies the key step: $\max_a E[U|s] \ge E[a^*|s]$.
  *   **B (2-3):** States the theorem verbally or writes a vague formula. Misses the specific inequality step where the max operator does the work.
  *   **Common Error:** Claiming the theorem assumes risk neutrality or specific utility functions.

  **2. Identification of Load-Bearing Assumptions (4 Marks)**
  *   **A (4):** Clearly isolates **Optionality** (ability to choose prior optimal act post-signal) and **Independence** (observation does not change state/payoffs). Links these to the proof steps.
  *   **B (2-3):** Lists assumptions generally (e.g., "rationality," "free information") without linking to the specific mechanics of the proof.
  *   **Common Error:** Confusing "free information" (no cost) with "payoff-neutral observation" (no leakage).

  **3. Taxonomy of Failure Cases (4 Marks)**
  *   **A (4):** Distinguishes "genuine" structural failures (Leaky/Act-Eroding) from "apparent" failures (psychological cost, ex post regret, computational cost).
  *   **B (2-3):** Treats all negative value cases as equivalent. Fails to separate costs of acquisition from structural value destruction.
  *   **Common Error:** Arguing that "information is costly" is a counterexample to Good's Theorem (it is not; the theorem assumes cost = 0).

  **4. Scenario Diagnosis (4 Marks)**
  *   **A (4):** Maps "Leaky" to Independence violation and "Act-Eroding/Fixed-Rule" to Optionality/Optimization violation. Explains why "just ignore" fails (observation itself is costly/signaling).
  *   **B (2-3):** Identifies the scenario as "bad information" but fails to map the specific definitions (Leaky/Act-Eroding) to the formal premises.
  *   **Common Error:** Saying "just ignore" works because "you can always choose the prior act," missing that the act of looking changed the payoffs.

  **5. Normative Verdict (4 Marks)**
  *   **A (4):** Defends a nuanced view: Theorem is tautological for ideal agents but diagnostically useful for real agents. Explains how it guides us to secure privacy/optionality.
