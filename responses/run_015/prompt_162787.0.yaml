answer: |-
  Your hypothesis is correct. In fact, it is the most charitable and precise diagnosis available. You are not dealing with a single empirical dispute hiding behind jargon; you are dealing with a **boundary dispute over a non-natural kind**, compounded by a **normative/descriptive category mismatch**.

  Here is the breakdown of why you are stuck, the status of the "boring explanation" objection, and what your students should actually do.

  ### 1. The Diagnosis: Three Questions, One Label
  You identified the three jobs "penetration" is doing (Architectural, Phenomenological, Epistemic). The impasse exists because the two camps agree on the *label* but disagree on which *job* is the primary target of inquiry.

  *   **The Psychophysicists** are asking the **Architectural** question: *Does cognitive information alter the computational processing of sensory input prior to decision/report?* They treat "perception" as a functional stage in an information-processing pipeline (e.g., V1–V4 vs. PFC). For them, if the effect can be modeled as a shift in decision criterion ($\beta$) or attentional weighting without changing sensory sensitivity ($d'$), perception was not penetrated.
  *   **The Philosophers** are asking the **Phenomenological/Epistemic** question: *Does the cognitive state alter the phenomenal character of experience, and does this alter the justificatory status of belief?* They treat "perception" as the interface of justification. For them, if the world *looks* different (phenomenology) or if the belief causes the look (epistemology), penetration has occurred, regardless of whether the neural locus is "early" or "late."

  **The CFS Case Study:**
  Your postdoc's experiment perfectly illustrates the mismatch.
  *   **Philosophers saw:** A change in *conscious access* driven by learning. Since consciousness is the locus of phenomenology, and learning is cognitive, cognition changed consciousness. That counts as penetration of the "experience."
  *   **Psychophysicists saw:** A change in *threshold for report*. CFS measures the break-from-suppression time. This is a measure of *access*, not necessarily *content*. A shape breaking suppression faster means the *gate* opened sooner, not that the *image* on the screen was rendered differently. They view "Access" as downstream of "Perception."

  Because "Perception" is not a natural kind (like "water" or "gold") but a theoretical construct defined differently by each discipline, no amount of data will settle the dispute. You are trying to measure the length of a shadow while disagreeing on the position of the light source.

  ### 2. Is the "Boring Explanation" Objection Falsifiable?
  You asked for honesty on this. Here it is: **Locally, yes. Globally, no.**

  *   **Locally:** Specific boring explanations are falsifiable. "It's response bias" is falsified by Signal Detection Theory controls. "It's eye movements" is falsified by gaze-contingent displays. "It's demand characteristics" is falsified by implicit measures. Your postdoc's study did exactly this.
  *   **Globally:** The general skeptical stance ("*Some* non-perceptual explanation exists") is **unfalsifiable**. It functions as a research-stopper wearing methodological rigor as a costume.

  Why? Because the definition of "perceptual" is being rigged to exclude the effect. If you find an effect in V1, the skeptic can say, "That's feedback from PFC, so it's cognitive modulation of sensory cortex, not *perception* proper." If you find a phenomenological change, they say, "That's post-perceptual judgment."

  This is not just stubbornness; it is a defense of **Modularity**. If the psychophysicists concede that cognition penetrates perception, they concede that the visual system is not informationally encapsulated. For many, this threatens the utility of studying vision as a distinct system. Therefore, the "boring explanation" is a theoretical immune response. It is not a methodological requirement; it is a metaphysical boundary guard.

  ### 3. The Data Ontology Clash
  You also asked if they disagree on what counts as data. **Yes.**

  *   **Philosophers** treat **first-person phenomenology** (armchair cases, "what it's like") as primary data. If a case *seems* like penetration to a competent reflector, that is evidence *for* penetration. The empirical data is secondary support.
  *   **Psychophysicists** treat **third-person behavioral/neural measures** as primary data. First-person reports are treated as noisy behavioral outputs subject to bias.

  When the philosophers say, "But it *looks* steeper," they are offering a datum. When the psychophysicists say, "Prove it isn't judgment," they are rejecting the datum type. You cannot resolve this with an experiment because the experiment itself relies on reports (data type B) to validate the experience (data type A).

  ### 4. Practical Advice: What Counts as Progress?
  Do not tell your students to spend three years trying to "solve" cognitive penetration. They will not succeed, because the question is ill-posed. Here is how to pivot:

  **A. For the Reading Group: Enforce the Distinctions**
  Stop asking "Does cognition penetrate perception?" It is a trap. Require every presentation to specify which claim is being tested:
  1.  **Coding Claim:** Does cognitive state $C$ alter neural tuning curves in area $V_x$?
  2.  **Phenomenal Claim:** Does cognitive state $C$ alter the subjective character of experience $E$?
  3.  **Epistemic Claim:** Does the influence of $C$ on $E$ degrade the justificatory power of $E$?

  If a paper claims to address "penetration" but only measures reaction times, they are addressing the Coding Claim (weakly). If they rely on armchair intuition, they are addressing the Phenomenal Claim. Make them admit which one they are doing. This won't solve the debate, but it will stop the circularity.

  **B. For the Grad Students: Narrow the Scope**
  Tell them to avoid the general thesis. Instead, pick a **mechanism** or a **specific consequence**.

  *   **For the Psychophysicist Student:** Do not ask "Is there penetration?" Ask "What is the computational signature of value-learning on contrast sensitivity?"
      *   *Why:* This bypasses the semantic fight. Whether you call it "penetration" or "attention" matters less than mapping the function. If they find that value learning shifts the psychometric function's $\alpha$ (threshold) but not $\beta$ (criterion), that is a robust, publishable finding that *feeds* the debate without getting stuck in it.
  *   **For the Philosopher Student:** Do not ask "Does penetration happen?" Ask "If penetration happens in domain $X$ (e.g., racial bias, expertise), does it undermine justification?"
      *   *Why:* This moves the debate to the Epistemic job. Even if the psychophysicists argue it's "just attention," the philosopher can argue that *attention shaped by bias* still creates an epistemic problem. This makes the empirical details less critical than the normative structure.

  **C. Dissolve, Don't Win**
  The most productive move is to **dissolve the debate** by replacing the binary "Penetration vs. Encapsulation" with a **gradient of integration**.
  *   Instead of "Is the system encapsulated?", ask "Under what conditions and at what latencies does task-relevant information modulate sensory processing?"
  *   This acknowledges that the brain is highly interactive without triggering the modularity defense mechanisms.

  ### Summary
  Your hypothesis is right. The disagreement is verbal/metaphysical, not empirical. The "boring explanation" objection is a theoretical shield that is locally falsifiable but globally immune.

  **Verdict:** Do not let your students try to win this war. It is a trench dispute over a border that doesn't exist in nature. Tell them to map the territory (specific mechanisms) or analyze the stakes (epistemic norms), but forbid them from trying to plant a flag on the general question of "Cognitive Penetration." Progress lies in making the question precise enough that the answer doesn't depend on which definition of "perception" you brought to the lab.
