  (6) Marta is clearly right to press the dilemma. If the theorem only holds by reclassifying all harms as costs, it offers no guidance on when to look. It cannot support Julian's initial polemic that ignorance is always a defect. The theorem is either a tautology or false for non-ideal agents with changing values. She wins the meta-argument about the theorem's utility. She is right that the polemic fails. This move concludes the argument decisively.

  2. **The hinge**

  The disagreement turns not on the math, but on whose welfare counts. Julian prioritizes the *ex ante* chooser: if the decision to look was rational given what was known then, the agent is vindicated, regardless of later suffering. Marta prioritizes the *ex post* liver: if the person living with the knowledge is worse off, the information was bad, regardless of prior rationality. Julian treats the agent as a single locus of rationality across time; Marta treats the agent as a sequence of selves with potentially conflicting interests. The theorem validates the former perspective but cannot adjudicate the latter. When Julian says "you aren't worse off," he means "you didn't violate a norm." When Marta says "she is worse off," she means "her life goes worse." They are talking past each other about the definition of benefit.

  3. **What neither side notices**

  Both assume a static decision problem where Nature holds secrets but doesn't react to the looking. In the Sealed Letter case, the truth isn't just a state of the world; it is socially constitutive. Learning the father was an informer changes the woman's social reality, not just her beliefs. The "Nature" in their model is passive, but in these cases, the environment reacts to the knowledge itself. Furthermore, both assume utility maximization is the sole metric of welfare. They ignore narrative value: a life might be less satisfied but more authentic, or more satisfied but based on a lie. Neither considers that "ignoring" might be a constitutive part of a valuable relationship, not just a cost-saving measure. The setup presumes the agent is separate from the world she observes, but in these cases, observing changes who she is in the world. They miss that information can be an intervention, not just an observation.

  4. **Bottom line**

  Marta is more right about the normative force of the theorem for human beings; Julian is more right about its formal validity for ideal agents. The theorem bounds rational curiosity, not human welfare. If you use this in the seminar, tell the room this: Good's theorem proves that information is never useless for maximizing a fixed utility function, but it does not prove that knowing is always good for the knower. Distinguish the rationality of the choice from the welfare of the chooser.
