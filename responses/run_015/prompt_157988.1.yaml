answer: |-
  # The Tiered Beneficence Protocol (TBP)
  **For Use By:** Fertility Counselors
  **Time Allocation:** 30 Minutes
  **Purpose:** To guide embryo selection using polygenic risk scores (PRS) without conflating medical welfare with social preference, and without misapplying harm-based ethics to non-existent persons.

  ## Part I: The Procedure

  ### Step 0: The Validity Gate (Ancestry Check)
  **Question:** Does the prospective parents' genetic ancestry match the reference population of the PRS lab report (primarily European)?
  **Sufficient Answer:** 
  *   **Yes:** Proceed to Step 1.
  *   **No:** Stop. Inform the couple that the scores for disease, height, and education are statistically unreliable for their ancestry. Selection must be based on standard morphological grading only. 
  *(Rationale: Using biased data violates beneficence by introducing false risk.)*

  ### Step 1: The Non-Identity Clarification
  **Action:** Read the following script verbatim to the couple.
  **Script:** "We are looking at a fixed set of embryos. If we choose Embryo A, Embryo B will not be implanted. Embryo B will not become a person who is 'hurt' by this choice; Embryo B will simply not exist. We are not preventing harm to an existing patient. We are comparing two possible future lives to see which one is likely to have fewer medical burdens. There is no obligation to choose the 'best' embryo, only a permission to consider welfare."
  **Sufficient Answer:** The couple acknowledges they understand that discarding an embryo is not equivalent to harming a born child.

  ### Step 2: The Trait Classification (Health vs. Social)
  **Question:** Is the trait in question on the Clinic's **Medical Care List** (conditions requiring intervention/management) or the **Optimization List** (height, educational attainment, non-medical traits)?
  **Sufficient Answer:** 
  *   **Medical Care List:** Proceed to Step 3.
  *   **Optimization List:** Proceed to Step 4.
  *(Rationale: Counselors cannot philosophically distinguish discrimination from benefit. They must rely on a pre-vetted administrative list. Traits on the Optimization List derive value largely from social bias, not biological function.)*

  ### Step 3: The Health Trade-Off (Viability vs. Risk)
  **Question:** Does the embryo with the lower disease risk have a significantly lower chance of implantation (e.g., >15% difference in viability grade)?
  **Sufficient Answer:**
  *   **Yes:** Select the embryo with the **higher implantation chance**. (A child with a disease who exists is preferable to a child without disease who is never conceived).
  *   **No:** Select the embryo with the **lower disease risk**.
  *(Rationale: Procreative Beneficence applies only to potential persons who will actually exist.)*

  ### Step 4: The Social Trait Rule
  **Question:** Are the health scores (Step 3) effectively equal between the available embryos?
  **Sufficient Answer:**
  *   **Yes:** You may consider the Optimization List traits (Height/EA) as a tie-breaker *only if* the couple requests it. Document that this selection is for social advantage, not health.
  *   **No:** Ignore Optimization List traits. Health viability trumps social advantage.
  *(Rationale: This acknowledges the difference in kind. Selecting for height is permissible only when it does not displace health welfare.)*

  ### Step 5: Multi-Embryo Transfer (The Hedging Rule)
  **Question:** If transferring two embryos, do you select the two highest-ranked or hedge?
  **Sufficient Answer:** Select the **two highest-ranked** for viability and health. Do not "hedge" by selecting one high-risk/high-reward and one low-risk/low-reward embryo. 
  *(Rationale: PB obligates us to maximize expected welfare per child. Deliberately implanting a lower-welfare embryo violates the principle, even as a hedge.)*

  ### Step 6: Stopping Points (Value Conflicts)
  **Condition A:** The couple requests to select *for* a trait on the Optimization List when health scores are *not* equal.
  **Action:** Hand off to **Medical Director**. (This violates the Health Trumps Social rule).
  **Condition B:** The couple disagrees on which embryo to choose (e.g., one parent prioritizes height, the other diabetes risk).
  **Action:** Hand off to **Couple**. (Counselor recuses from decision; this is a values conflict, not a factual one).
  **Condition C:** The couple demands exclusion of *all* embryos carrying a variant for a late-onset, untreatable condition (post-50), leaving no viable embryos.
  **Action:** Hand off to **Medical Director**. (This tests the limit of PB vs. resource waste).

  ---

  ## Part II: Case Applications

  ### Case 1: Type 2 Diabetes Risk vs. Implantation Chance
  **Scenario:** Embryo A has high PRS for Type 2 Diabetes but Grade A viability. Embryo B has low PRS for Diabetes but Grade C viability (significantly lower implantation chance).
  **Procedure Run:**
  1.  **Validity:** Assume European ancestry (Pass).
  2.  **Non-Identity:** Script read.
  3.  **Classification:** Diabetes is on Medical Care List.
  4.  **Trade-Off:** Embryo B (lower risk) has significantly lower implantation chance (>15%).
  5.  **Decision:** **Select Embryo A.**
  **Outcome:** The counselor advises transferring the embryo with higher diabetes risk because it is more likely to result in *any* child.
  **Ethical Note:** This respects the constraint that harm-based objections run out; we are not harming Embryo B by not choosing it, but we are failing to create a child if we choose B. Existence trumps optimized health.

  ### Case 2: Selection for Socially Rewarded Trait (Height/EA)
  **Scenario:** Two embryos have identical viability and identical disease risk profiles. Embryo A has higher PRS for Height and Educational Attainment. The couple asks to choose A.
  **Procedure Run:**
  1.  **Validity:** Pass.
  2.  **Non-Identity:** Script read.
  3.  **Classification:** Height/EA are on Optimization List.
  4.  **Social Rule:** Health scores are equal.
  5.  **Decision:** **Permit selection of Embryo A.** Document as "Social Advantage Tie-Breaker."
  **Outcome:** The procedure legitimizes selecting for traits that confer advantage primarily through social discrimination.
  **Philosopher's Dislike:** **I anticipate you will dislike this outcome.** By permitting this even as a tie-breaker, the clinic institutionally validates the idea that "more height/education = better life," reinforcing the very social biases that make these traits valuable in the first place. It mimics telling the difference between health and bias, but ultimately capitulates to the bias.

  ### Case 3: Late-Onset Untreatable Condition (Post-50)
  **Scenario:** A couple wants to exclude any embryo carrying a variant for a condition that manifests after age 50 and is untreatable (e.g., certain forms of late-onset Alzheimer's or Huntington's variants with late penetration). They wish to discard all carrying embryos.
  **Procedure Run:**
  1.  **Validity:** Pass.
  2.  **Non-Identity:** Script read.
  3.  **Classification:** Medical Care List (it is a disease code).
  4.  **Trade-Off:** Assume viability is equal.
  5.  **Stopping Point:** This triggers **Condition C**. The request eliminates viable embryos based on a condition that affects the person only after their reproductive and dependent years.
  6.  **Decision:** **Hand off to Medical Director.**
  **Outcome:** The procedure refuses to let the counselor validate this exclusion.
  **Ethical Note:** While PB suggests selecting the child with the best life, a life with a healthy 50 years followed by illness is arguably a "good life." Excluding these embryos treats the post-50 self as morally negligible. The procedure correctly identifies this as a value judgment beyond the counselor's fact-based remit.

  ---

  ## Part III: Confidence and Limitations

  **Overall Confidence:** **Moderate (60%)**
  The procedure is robust on the Non-Identity Problem and the Viability Trade-off. It successfully prevents counselors from smuggling "harm to the embryo" language into the conversation and prioritizes actual existence over theoretical optimization.

  **Least Confident Step:** **Step 2 (The Trait Classification)**
  I am least confident in the reliance on a pre-vetted "Medical Care List" vs. "Optimization List."
  **Reason:** This step requires the Clinic Administration to make the philosophical distinction that the counselors cannot. If the Administration places "Educational Attainment" on the Medical Care List (arguing it correlates with income and thus health access), the counselor will follow the list and select for EA as if it were a disease prevention measure. The procedure creates a bureaucratic firewall, but firewalls can be mislabeled. It asks counselors to draw a distinction (Health vs. Social) they cannot defend, relying entirely on the accuracy of the labels provided to them. If the labels are corrupted by the same biases the procedure aims to check, the procedure fails silently.
