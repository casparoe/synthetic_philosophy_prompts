answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being [Mother's Name]'s child.

  Looking around this room, I see two distinct tribes. On one side, I see the people who know my mother as a neighbor, a friend, and the woman who burns the toast on Sunday mornings. On the other, I see the people who know her as a parliamentarian, a budget hawk, and the person who knows exactly where the bodies are buried in the appropriations committee. And then, I know, there are a few friends in the back who think we shouldn't have elections at all, but should just pick legislators out of a lottery bowl.

  To my friends in the back: Don't worry. If we had drawn names from a hat, my mother's name probably wouldn't have come up. She was too busy actually working to put her name in the bowl.

  But the presence of that idea—the lottery, the skepticism about "career politicians"—is actually why I wanted to say a few words tonight. Because after twenty-four years, my mother is leaving the state senate. She is leaving because of the term-limit amendment passed two decades ago. She opposed it then, but she has never questioned the voters' right to pass it, and she is certainly not bitter about it now.

  However, her departure forces us to ask a question about what a political career is actually for.

  In public life, there is a fear that drives movements like term limits and citizens' assemblies. It is the fear of the career as *accumulation*. We worry about officeholders who treat their tenure like a stamp collection: accumulating seniority, hoarding donor networks, and converting public office into personal power. In this model, the main project of the politician is simply to remain a politician. The office becomes a fortress, and the voter becomes a trespasser.

  That fear is not baseless. It is real. And the voters who passed term limits were right to guard against it.

  But there is a second model. A career as *custodianship*.

  This is the career my mother has had. Custodianship isn't about staying in office to protect your own power. It is about staying in office long enough to protect everything else. It means learning the budget so well that you can spot a typo that costs the district a million dollars. It means stewarding the institution's memory so that good ideas aren't lost every time the wind changes direction. It means protecting the district's interests through changes of governor and party, not by building a wall around yourself, but by building a bridge for your neighbors.

  Term limits are a blunt instrument. They are designed to stop accumulation, but they cannot tell the difference between a hoarder and a steward. They assume that longevity is the problem, rather than the purpose of the longevity.

  And to my friends who prefer a lottery: You share the worry about professional politicians, but you would abolish the career entirely. My argument tonight is simpler. The answer to bad careerism isn't to end the career. It is to ask what the career was *for*.

  If you ask the legislative staff in this room, they will tell you that my mother's twenty-four years were not about accumulation. They were about showing up. When the lights were on late, she was there. When the details were messy, she read them. She didn't use her seniority to demand favors; she used it to demand clarity.

  And if you ask the family and friends in this room, you won't hear about appropriations riders. You will hear about a woman who never confused her importance with her job. You will hear about someone who viewed her seat not as a throne, but as a trust.

  There is a joke in politics about being "termed out." But looking at my mother, I think the better phrase is being "termed in." She was termed in to the service of this district, and that term doesn't expire when she hands in her badge.

  So, as she leaves the chamber, she leaves it in better shape than she found it. That is the definition of custodianship. You don't own the house; you just make sure the roof doesn't leak for the next person.

  Mom, you have been a guardian of this place, and of us. You have shown us that staying power matters, not because it keeps you in the room, but because it keeps the room honest.

  Please raise your glasses.

  To my mother. Not for the years she spent in the senate, but for what she did with them. To the custodian, the steward, and the woman who taught us that public service is something you give away, not something you keep.

  To Mom.
