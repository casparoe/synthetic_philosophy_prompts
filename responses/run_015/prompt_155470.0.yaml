      *   *The Diary Case:* Wittgenstein actually discusses a diary case himself (PI §258). He imagines associating a sign 'S' with a sensation. He argues it fails because the person has no criterion of correctness for remembering what 'S' meant.
      *   *The User's Twist:* The user adds *diachronic consistency* (checking back over months/years). This is a sophisticated objection often raised in secondary literature.
