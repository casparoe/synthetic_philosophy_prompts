          *   The core issue is often discussed under "memory skepticism" or "criterion of correctness."
      *   *Does it work?* Most Wittgensteinians say no. The "check" is still internal. If I check my notebook from six months ago, how do I know I'm interpreting the old symbol correctly *now*? It leads to an infinite regress or circularity.

