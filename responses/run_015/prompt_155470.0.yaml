      *   *The "Seeming vs. Being" Right:* The core of PI §258. If I trust my memory to interpret the past symbol, and I trust my memory to apply the current symbol, there is no external anchor. Consistency $\neq$ Correctness. I can be consistently wrong.
      *   *Kripke's Interpretation:* Kripke's *Wittgenstein on Rules and Private Language* emphasizes the skeptical paradox. Even public language faces this, but the "community view" solves it. A private diary lacks the community view.
