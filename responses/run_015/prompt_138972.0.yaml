answer: |-
  You have identified a structural contradiction in the grammar of public memory that is rarely examined because it is constitutive of the field itself. You are right to set aside "competitive victimhood" and "whataboutism." Those describe *motives* or *tactics* in a conflict; you are describing a *normative syntax* that governs legitimate speech even in the absence of conflict. This is not about groups fighting for a slot; it is about the rules of the arena that make the fight intelligible.

  Here is the carving you are asking for, organized by the conceptual neighbors that fail to capture the shape, followed by a proposed definition that handles the boundary cases and the ethical question.

  ### I. The Near Neighbors and Where They Break

  To carve this concept, we must look at the three established frameworks that come closest to describing it, and isolate exactly where they stop short.

  **1. Incommensurability**
  *   **The Fit:** In moral philosophy, incommensurability suggests that two values cannot be measured against a common standard without loss of meaning. This aligns with your observation that asking "which was worse?" is treated as indecent. The norm asserts that the event is qualitatively distinct, not quantitatively comparable.
  *   **The Miss:** True incommensurability would forbid *all* ranking, including the claim that the event was "the worst" or "unprecedented." To say "X is unique" is to place X in a category of one, which is a taxonomic ranking. To say "X is the worst" is to place X at the apex of a scale. Your museum's discourse does not treat the atrocity as incommensurable with *everything*; it treats it as incommensurable with *rivals*, but commensurable with *superlatives*. The norm is not ontological (these things cannot be compared); it is directional (you cannot compare down, only up).

  **2. Exceptionalism**
  *   **The Fit:** This captures the obligatory claim that the event was a rupture, a break in history, something that defies prior categories. It explains why an exhibition text presenting the event as "one among many" reads as an insult.
  *   **The Miss:** Exceptionalism describes the *claim* made about the self, but not the *restriction* placed on the other. Political exceptionalism usually argues for special rules of conduct (e.g., "we are exempt from this law"). Your norm is about *speech*. It is not just that the event is exceptional; it is that *pointing out the exceptionality of others* is forbidden. Exceptionalism does not account for the taboo on the comparative question itself.

  **3. Sacralization**
  *   **The Fit:** This is the strongest neighbor. In religious contexts, sacred objects are set apart (*sacer*). To weigh a sacred object against a profane one is blasphemy. This explains the "indecency" of the teacher's question. It also explains why superlatives are allowed: God is "highest," "holiest," without it being a comparative insult to other beings.
  *   **The Miss:** Sacralization implies a passive reverence. Your observation is more active and political. The "fight" to have a catastrophe counted as *genocide* is not an act of reverence; it is a bid for legal and moral capital. Sacralization suggests the object is removed from the economy; your phenomenon shows the object is the *currency* of the economy. The norm protects the value of the currency by forbidding exchange rates, while insisting on its high valuation.

  ### II. The Carving: Asymmetric Incommensurability

  The pattern you are tracking is best understood as **Asymmetric Incommensurability**.

  This is not a state of being, but a rule of discourse. It operates on two distinct axes, which your thesis should separate to avoid conflation.

  **Axis 1: The Direction of Comparison (Vertical vs. Horizontal)**
  The norm forbids *horizontal* commensuration (side-by-side ranking of distinct groups) but mandates *vertical* elevation (asserting transcendence over history).
  *   **Forbidden:** "A is worse than B" or "A is equal to B." This implies a shared scale where trade-offs are possible. If A and B are on the same scale, A can be outweighed by B.
  *   **Obligatory:** "A is beyond scale." This removes A from the possibility of being outweighed.
  *   **The Contradiction:** "Beyond scale" is functionally identical to "Top of the scale" in terms of moral resource allocation. The norm disguises a vertical claim (we are highest) as a categorical claim (we are other).

  **Axis 2: The Mode of Comparison (Magnitude vs. Kind)**
  You noted that classification is acceptable while magnitude is taboo. This is because classification creates *boundaries*, while magnitude creates *continuity*.
  *   **Classification (Allowed):** Debating whether an event counts as "genocide" or "ethnic cleansing" is a debate about boundaries. It protects the interior of the category. If your event is the "paradigm case" of genocide, you control the definition.
  *   **Magnitude (Forbidden):** Debating death tolls or suffering intensity creates continuity. It suggests that if the other side's numbers go up, your moral status goes down.
  *   **The Nuance:** Classification carries rank (as you noted), but it is a *binary* rank (in/out). Magnitude is a *scalar* rank (more/less). The norm protects binary rank (we are in the top tier) by forbidding scalar rank (we are #1 vs #2).

  ### III. Handling the Boundary Cases

  If we define **Asymmetric Incommensurability** as *the normative prohibition on subjecting a specific harm to a shared metric of magnitude, coupled with the obligatory assertion of that harm's categorical transcendence*, we can test it against your boundary cases.

  **1. Comparison between two harms inside a single community's own history**
  *   **Verdict:** *Permissible, but fraught.*
  *   **Analysis:** Asymmetric Incommensurability relies on an "us vs. them" boundary to function. When the comparison is internal, the protective function weakens. However, it often re-emerges as "hierarchy of martyrdom." If the community treats one internal tragedy as the "foundational" trauma, comparing a later tragedy to it may be forbidden not because it violates universal norms, but because it threatens the community's internal narrative cohesion. The norm shifts from protecting the *event* to protecting the *narrative*.

  **2. A comparison drawn by a survivor rather than by an outsider**
  *   **Verdict:** *Exempted.*
  *   **Analysis:** The norm is a rule for *public discourse*, not private testimony. A survivor claiming "what happened to me was worse than what happened to you" is often granted epistemic privilege that an educator or politician is not. This reveals that the norm is not about truth, but about *authority*. The outsider is seen as appropriating moral capital; the survivor is seen as spending their own. The norm protects the *ownership* of the trauma, not the trauma itself.

  **3. A comparison framed explicitly as being about prevention rather than magnitude**
  *   **Verdict:** *Permissible (The "Lesson" Loophole).*
  *   **Analysis:** This is the primary escape valve. "We compare not to rank suffering, but to identify patterns." This allows typologies (Axis 2) while ostensibly forbidding magnitude. However, this often smuggles magnitude back in. If Event A is the "paradigm" for prevention, it implicitly becomes the "most important" event. Asymmetric Incommensurability allows this because it frames the hierarchy as *pedagogical* rather than *moral*. It claims utility, not superiority, while achieving the latter.

  **4. The same asymmetry outside atrocity (grief, achievement)**
  *   **Verdict:** *Universalizable.*
  *   **Analysis:** This confirms the concept is structural, not specific to genocide. "My grief is unique" is acceptable; "My grief is heavier than yours" is obscene. "My father was the greatest man" is acceptable; "My father was better than yours" is aggressive. This suggests Asymmetric Incommensurability is a general feature of *identity-constituting values*. Whenever a value is tied to who we are (rather than what we have), ranking becomes a threat to existence. To say "your grief is equal to mine" can feel like "your loss is as significant as mine," which dilutes the specific bond. The norm protects the *singularity of the bond*, not the *magnitude of the loss*.

  ### IV. Can the Norm Be Non-Self-Serving?

  You ask if this norm can be stated as a principle that does not simply license the comparisons its holder already wants to make.

  **The Universalization Test**
  If we formulate the principle as: *"No mass atrocity should be ranked against another; all should be treated as unique,"* we encounter an immediate failure.
  1.  **Resource Scarcity:** Memorialization, legal justice, and political attention are finite. If all atrocities are unique and unrankable, there is no algorithm for distribution. In practice, the "uniqueness" claim becomes the ranking mechanism. The event that successfully asserts its uniqueness gets the resources.
  2.  **Moral Blindness:** If we cannot compare magnitudes, we cannot prioritize prevention. If Event A kills 1 million and Event B kills 10,000, a strict prohibition on magnitude comparison prevents us from saying A requires more urgent structural intervention than B.

  **The "Protective Heuristic" Defense**
  The only non-self-serving defense of Asymmetric Incommensurability is pragmatic, not principled. It argues: *Human beings are prone to moral numbing. If we allow atrocities to be placed on a scale, the public will treat them as interchangeable commodities. By forbidding the scale, we force a pause in judgment that preserves the specific moral weight of the event.*

  **The Verdict**
  This defense holds only if the norm is applied *universally and temporarily*.
  *   **Universally:** If Group A claims uniqueness but denies it to Group B, it is self-serving.
  *   **Temporarily:** If the claim of uniqueness is a pedagogical tool to establish attention, but is later relaxed to allow for comparative learning, it is ethical. If it becomes a permanent ontological status, it becomes a monopoly on moral capital.

  In your museum context, the norm functions as a **gatekeeping mechanism**. It is not possible to formulate it as a purely neutral principle because its function is to manage the scarcity of moral attention. It *must* be self-serving to work; it exists to ensure *this* memory survives in a crowded marketplace of tragedies.

  ### V. A Proposed Definition for Your Thesis

  For the purpose of your analysis, I suggest defining the phenomenon as follows:

  **Asymmetric Incommensurability**
  *A discursive norm governing public memory wherein claims of qualitative uniqueness (incommensurability) are obligatory for the self, while claims of quantitative ranking (commensurability) are forbidden for the other. This norm functions to protect the moral capital of a specific trauma by removing it from competitive scales, while simultaneously positioning it at the apex of moral significance through the assertion of its transcendence. It distinguishes between permissible classification (which establishes boundaries) and forbidden magnitude (which establishes continuity), thereby allowing a group to claim the highest moral rank without admitting to the act of ranking.*

  This definition allows you to analyze the *function* of the norm without needing to resolve the moral contradiction. It treats the contradiction as the feature, not the bug. The norm exists precisely to allow speakers to have it both ways: to reject the "Olympics of Suffering" while ensuring they win the gold medal.
