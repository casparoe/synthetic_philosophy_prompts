prompt: |-
  I spend most of my week as an educator at a memorial museum attached to one of the twentieth century's large-scale killings, and I'm finishing a master's thesis on how comparative claims about mass atrocity get policed in public discourse. I keep bumping into a pattern I cannot find a name for, and I want help carving it rather than labelling it. The rough shape is that comparisons are forbidden in one direction and compulsory in the other. When a visiting teacher asks my students which of two atrocities was worse, the question is treated as indecent and I have to deflect it; yet the same people who treat that question as indecent will say without hesitation that the event my museum commemorates was unprecedented, or the worst crime of its century, or a rupture after which nothing was the same. Those are comparative claims too — a superlative is a ranking — but they are not merely permitted, they are close to obligatory in commemorative speech; an exhibition text that presented the event as one atrocity among many would read as an insult. Something similar happens with the category *genocide*: campaigners fight bitterly to have their community's catastrophe counted under that term and resent it when it is withheld, which only makes sense if the term marks a high rank, and yet the same campaigners denounce the very idea of ranking atrocities.

  There is a second asymmetry, along a different axis. Comparisons of kind are respectable scholarship — typologies, definitions, disputes about whether a given episode counts as extermination, as ethnic cleansing, as a crime against humanity — while comparisons of magnitude are the ones that get called obscene: a panel on classificatory questions draws no protest, whereas a table of death tolls draws an angry letter. But classification carries rank with it, since a category that groups compete to enter is not a neutral box. So the taboo looks like it attaches to a dimension of comparison rather than to comparison as such.

  I've been calling this one-way comparativism, but I invented that, and it doesn't separate the two axes. What I want is the carving, not a label: which established concepts are the near neighbours here, and in exactly what respect does each one miss? I've considered and set aside two in plain terms — the competitive scramble between groups for victim status, and the deflection move where someone answers a criticism of their own side by pointing at the other side's worse crimes — since the first is about who wants the top slot and the second about evading blame, whereas what I'm after is the norm that makes comparison itself permissible upward and forbidden downward. If nothing established fits, I'd like a coined term with a definition that handles the boundary cases: a comparison between two harms inside a single community's own history; a comparison drawn by a survivor rather than by an outsider; a comparison framed explicitly as being about prevention rather than magnitude; and the same asymmetry well outside atrocity, where people refuse to rank a friend's grief or a revered figure's achievement while freely using superlatives about them. And I'd like your view on whether the norm can be stated as a non-self-serving principle at all, or whether any formulation of it will turn out to license precisely the comparisons its holder already wanted to make. Please don't give me a bibliography or tell me whom to read — I have no library access from here, and it's the analysis I'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Educator at a memorial museum (20th-century mass killing), Master's student finishing a thesis on comparative claims about mass atrocity in public discourse.
      *   **Core Problem:** Identifying and analyzing a specific rhetorical/normative pattern: Comparisons are forbidden in one direction (ranking atrocities against each other, specifically asking "which is worse?") but compulsory in the other (asserting uniqueness, unprecedented nature, "worst crime," fighting for the label "genocide").
      *   **Specific Constraints:**
          *   Do *not* give a bibliography or reading list (no library access).
          *   Do *not* just offer a label; focus on "carving" the concept (analysis of boundaries and near neighbors).
          *   Address two axes: Directionality (forbidden downward vs. compulsory upward) and Type (magnitude vs. classification).
          *   Discard two specific concepts already considered by the user ("competitive victimhood" and "whataboutism").
          *   Provide a coined term (if necessary) with a definition that handles boundary cases (internal history, survivor voice, prevention framing, non-atrocity analogies).
          *   Evaluate whether the norm can be stated as a non-self-serving principle.
      *   **Tone:** Intellectual, precise, respectful of the gravity of the subject, analytical, avoiding platitudes.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation 1:* "Which is worse?" = Taboo. "This is the worst/unique" = Obligation.
      *   *Observation 2:* Classification (typology) = Acceptable. Magnitude (body counts) = Taboo.
      *   *Underlying Tension:* The claim of uniqueness *is* a comparison (X > all Y), but it's treated as intrinsic rather than comparative.
      *   *Function:* This norm protects the sanctity of specific memories while preventing the dilution of moral urgency through relativism.

  3.  **Identify "Near Neighbor" Concepts (and why they miss):**
      *   *Competitive Victimhood:* User rejected this. It focuses on the *motivation* (grabbing status) rather than the *normative structure* (what speech is allowed).
      *   *Whataboutism:* User rejected this. It's a defensive deflection, not a commemorative norm.
      *   *Exceptionalism:* Close. But usually describes the *claim* (we are unique), not the *rule about comparing*.
      *   *Incommensurability:* Philosophical concept. Suggests things *cannot* be compared. But the museum *does* compare (by claiming superiority/uniqueness). So it's not ontological incommensurability, it's normative prohibition.
      *   *Sacralization/Taboo:* Useful. The event is "sacred." Sacred things are beyond measurement. Measuring them profanes them. But claiming they are "most sacred" is allowed.
      *   *Hierarchies of Suffering:* Describes the *result*, not the *rule* governing speech.
      *   *Moral Particularism:* Focuses on context over universal rules. Fits the "don't compare us to them" vibe, but doesn't explain the "we are the worst" claim.

  4.  **Develop the "Carving" (Analysis of the Norm):**
      *   The norm isn't against comparison *per se*. It's against *horizontal* comparison (side-by-side ranking) vs. *vertical* elevation (transcendent ranking).
      *   It's about *commensurability*. To compare magnitudes is to make things commensurable (measurable by the same ruler). To claim uniqueness is to assert *incommensurability* (no ruler fits).
      *   *The Twist:* Asserting incommensurability is itself a move in a hierarchy (the "most unique" is the most significant).
      *   *The Axis of Magnitude vs. Kind:* Classification implies a shared genus. Magnitude implies a shared scale. The taboo is on the *scale*. Why? Because scales imply trade-offs. If we are on a scale, we can be outweighed. If we are a category of one, we cannot be outweighed.

  5.  **Drafting the Coined Term:**
      *   Needs to capture: Asymmetry, Prohibition vs. Obligation, Sanctity/Uniqueness.
      *   *Idea 1:* Asymmetric Incommensurability. (A bit dry).
      *   *Idea 2:* Hierarchical Exceptionalism. (Too close to political science jargon).
      *   *Idea 3:* *Sanctified Asymmetry*. (Good, but maybe too religious).
      *   *Idea 4:* *The Prohibition on Commensuration*. (Focuses on the mechanism).
      *   *Idea 5:* *Unidirectional Incommensurability*. (Accurate).
      *   *Selection:* Let's go with a term that highlights the *status* protection. **"Status-Protective Incommensurability"** or **"Asymmetric Sacralization."**
      *   *Better:* **"The Norm of Transcendent Singularity."** No, too wordy.
      *   *Best:* **"Asymmetric Incommensurability."** It sounds academic but precise. Or perhaps **"The Commensurability Taboo."**
      *   *Refinement:* Let's create a term that captures the *directionality*. **"Vertical Exceptionalism."**
      *   *Actually, looking at the prompt:* The user wants a carving, not just a label. But if I coin one, it needs to work. Let's try **"Rhetorical Incommensurability."**
      *   *Wait, the core mechanism is:* You can say "I am above the scale" (Unique), but you cannot say "I am higher on the scale than you" (Ranking).
      *   *Proposed Term:* **"The Prohibition on Horizontal Commensuration."**
      *   *Alternative:* **"Asymmetric Uniqueness."**
      *   *Let's settle on:* **"The Norm of Asymmetric Incommensurability."** It captures the philosophical root (incommensurability) and the structural flaw (asymmetry).

      *   *Wait, I need to check the "non-self-serving" question.* Can this norm be justified ethically?
      *   *Argument for:* Prevents "Olympics of Suffering." Prevents dilution of specific lessons.
      *   *Argument against:* It creates the very hierarchy it claims to reject. It privileges the speaker's trauma.
      *   *Conclusion:* It is inherently self-serving, but functions as a protective heuristic.

  6.  **Addressing the Boundary Cases:**
      *   *Internal History:* Comparing two harms within one group. (Usually allowed if it serves a moral lesson, forbidden if it pits victims against each other).
      *   *Survivor Voice:* Survivors often have more license. (The "eigenvalue" of experience).
      *   *Prevention Framing:* "We must learn from X to prevent Y." (This is analogical, not ranking. Often allowed).
      *   *Non-Atrocity:* "My grief is unique" vs. "My grief is worse than yours." (Parallel structure).

  7.  **Structuring the Response:**
      *   **Acknowledge and Validate:** Confirm the observation is sharp and under-theorized.
      *   **Near Neighbors (The Carving):**
          *   *Incommensurability:* Why it fits (ontological) and misses (normative).
          *   *Exceptionalism:* Why it fits (claim) and misses (the prohibition).
          *   *Sacralization:* Why it fits (taboo) and misses (the comparative claim).
      *   **The Two Axes:**
          *   Direction (Up vs. Down).
          *   Type (Kind vs. Magnitude).
      *   **Proposed Concept:** "Asymmetric Incommensurability."
      *   **Boundary Cases:** Apply the concept to the user's four scenarios.
      *   **The Ethical Question:** Is it non-self-serving? (Analyze the "Universalization" test).

  8.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* Be careful not to sound like I'm dismissing the museum's work. The user works there. Respect the pedagogical necessity while analyzing the rhetorical structure.
      *   *Nuance:* The distinction between *classification* (genus) and *magnitude* (scale) is crucial. Classification creates a "club." Magnitude creates a "ladder." The norm forbids the ladder but mandates membership in the "top tier" of the club.
      *   *Key Insight:* The claim of "uniqueness" is a *negative* comparison (X is not like Y). The claim of "worst" is a *positive* comparison (X > Y). The norm allows negative comparisons that elevate, forbids positive comparisons that rank.
      *   *Wait, "worst" is positive ranking.* The user says "worst crime of its century" is obligatory. So positive ranking *is* allowed if it places *us* at the top. Negative ranking (others > us) or neutral ranking (us = others) is forbidden.
      *   *So it's not just Horizontal vs. Vertical.* It's *Self-Elevating Vertical* (Allowed) vs. *Relativizing Horizontal* (Forbidden).

  9.  **Final Polish:** Ensure the tone is collegial and rigorous. Avoid bullet points where paragraphs serve better flow. Ensure the "non-self-serving" analysis is biting but fair.

      *(Self-Correction on the Term)*: "Asymmetric Incommensurability" is good. Let's define it clearly. It asserts incommensurability for others (you can't compare to us) but commensurability for self-assertion (we are the measure of all).
      *Actually, a better term might be **"The Uniqueness Paradox"** but that's too generic.*
      *Let's try **"Hierarchical Incommensurability."** It captures the contradiction: claiming to be beyond hierarchy while occupying the top of one.*
      *Let's go with **"Asymmetric Incommensurability"** as the primary analytical tool, as it describes the *rule*.*

      *(Re-evaluating the "Non-Self-Serving" question)*: Can it be universalized? "No group shall compare atrocities, but all groups may claim their own is unique." If everyone does this, communication breaks down. So it fails the universalization test. It relies on specific power dynamics (who gets to be heard).

      *(Final check on constraints)*: No bibliography. No "read X." Focus on analysis. Handle the 4 boundary cases.

