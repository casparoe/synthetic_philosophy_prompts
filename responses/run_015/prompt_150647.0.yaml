prompt: |-
  I'm currently drafting a paper for an advanced ethics seminar, and I keep circling back to what's often called the paradox of deontology: the apparent tension between strict agent-centered restrictions and the powerful intuition that catastrophic outcomes ought to carry some moral weight. I don't need a survey of the literature or references to specific authors; I'm looking for a conceptual reconstruction that works from first principles.

  Please argue for the position that the paradox is not a deep internal contradiction within deontological ethics, but rather an artifact of treating moral constraints as atomic, outcome-independent rules applied to isolated actions. Instead, defend the view that deontological norms should be reconceived as what we might call threshold-sensitive relational structures: they govern interactions within moral practices that possess internal conditions of stability, and they permit outcome-sensitive adjustments only when those adjustments do not collapse the relational framework that makes the norms intelligible in the first place. In developing this argument, inject and carefully elaborate a niche conceptual distinction—call it normative residue—to capture the idea that violating a constraint generates a non-quantifiable moral remainder that aggregate welfare gains cannot fully offset, without necessarily forbidding all trade-offs in genuinely extreme circumstances. The argument should remain accessible to someone familiar with basic deontology and consequentialism, but it should not lean on obscure technical literature, named theories from recent decades, or specific historical debates.

  After presenting your argument, provide a brief structured summary in JSON format with exactly these fields: "position_summarized" (a single sentence stating the core claim), "normative_residue_definition" (one to two sentences explaining the injected concept), "threshold_mechanism" (a short description of how the relational structure allows adjustments without dissolution), "strongest_objection_addressed" (the key counter-argument you anticipated and answered), and "paradox_status" (whether the paradox is dissolved, relocated, or preserved in modified form).
