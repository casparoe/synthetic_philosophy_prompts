prompt: |-
  I am a senior risk analyst at an engineering consultancy. A recurring part of my job is Monte Carlo simulation for failure and reliability analysis, and several times a month a model comes up in which someone has to generate random straight lines or chords through a circular cross-section: fatigue-crack paths across a pipe weld, a scratch left by a dropped tool across a circular viewport, debris modeled as a straight-line cut through a containment boundary, an arc-fault path crossing a circular electrode. Last quarter an internal review caught two of our analysts modeling what was nominally the same scenario — a random crack traversing a circular weld region — with two different chord samplers: one drew the two endpoints independently and uniformly on the circumference, the other drew the crack's direction uniformly and its perpendicular distance from the center uniformly. For the probability of the crack severing an inscribed safety zone they got what look like the classic one-third and one-half answers, which was enough for the review to question every geometric-probability figure we have ever issued.

  As I understand it, the underlying problem is Bertrand's paradox: a random chord of a circle is not a well-defined object until you specify the mechanism that generates it, and uniform sampling over different natural parameters (endpoints, midpoint, direction and offset) induces genuinely different probability measures. The principle of indifference — treat all possibilities as equally likely when you have no reason to prefer one — cannot arbitrate, because it is silent about which description of the possibilities to be indifferent over. When two of my engineers code what the client calls the same event and get different numbers, the disagreement is not an error either of them made; it is a choice about what random means that nobody made consciously.

  I want you to write a decision procedure that my group can actually run at the start of a simulation build, in roughly fifteen minutes, without any background in philosophy. The procedure should take as input a physical scenario involving lines or chords and a circular region, and output either a specific sampling scheme with a defensible justification, or an explicit finding that no principled choice exists, in which case it should say what to do instead — presumably bracketing the answer across the plausible measures and flagging what physical data would collapse the bracket. In detail, I am asking for:

  1. The questions, in order, that the analyst should ask about the scenario, and what counts as a sufficient answer to each. I expect the core of the procedure to be an interrogation of the physical generating process behind the randomness — what mechanism actually produces the line, and hence which parameter that mechanism plausibly treats as uniform — with symmetry and invariance considerations doing the work when the mechanism is only partly known. The ordering matters: some questions should be able to settle the choice early, and some should be able to kill the choice early.

  2. Points where the procedure stops with a definite verdict of no principled answer, and what the deliverable to the client looks like in that case — including how to present a probability that is only defined to within a band without it sounding like we do not know how to do our jobs.

  3. Worked applications to three cases: (a) a fatigue crack that nucleates at a random point on the weld circumference and propagates inward; (b) a scratch from a dropped tool that is better modeled as a line segment whose position and orientation over the whole region are, as far as we know, uniform; and (c) a case where the generating mechanism is genuinely unknown — say, a crack in a composite whose initiation physics our client does not understand and has no data on. Case (c) should be the one where the procedure returns the answer I will not like.

  4. An honest annotation of the procedure: which steps are real tests with determinate outputs, and which are judgment calls dressed up as procedure, so that my analysts know where they are still making the philosophical choice themselves and should say so in the model documentation.

  5. A statement of what the procedure cannot do. In particular, I want you to address whether the invariance-style arguments that sometimes pick out a unique measure in these problems actually resolve the choice or merely relocate it, and what the procedure does when the symmetries of the physical setup underdetermine or, worse, conflict.

  The vocabulary should be operational throughout — my analysts are engineers, not philosophers, and the procedure should translate whatever the principle of indifference and its critics have to say into questions they can ask about nucleation sites, tooling, and drop heights, with the philosophical content surfacing only where it genuinely changes what they do. The final test the procedure must pass: two analysts given the same physical scenario, different codebases, and no communication should reach the same number or the same documented refusal. I would also like a short paragraph on how to document each run so that a reviewer can audit the measure choice later without reconstructing the whole reasoning — a record of the mechanism assumption, the parameter it was made over, and what would have to be true physically for the assumption to fail. Please do not give me a reading list; give me the thing my team can run on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Senior Risk Analyst at an engineering consultancy.
      *   **Problem:** Bertrand's Paradox in Monte Carlo simulations (random chords/lines in circles). Different analysts use different sampling methods (endpoints vs. distance/angle) leading to different probabilities (1/3 vs. 1/2 vs. 1/4).
      *   **Goal:** A 15-minute decision procedure for analysts to select the correct sampling scheme based on physical mechanisms, or identify when no unique choice exists.
      *   **Requirements:**
          1.  Ordered questions (interrogating physical generating process).
          2.  Stop points for "no principled answer" and client deliverable format (bracketing).
          3.  Worked examples (Fatigue crack, Dropped tool, Unknown composite crack).
          4.  Honest annotation (real tests vs. judgment calls).
          5.  Limitations statement (invariance arguments, conflicting symmetries).
          6.  Documentation standard (audit trail).
          7.  Tone: Operational, engineering-focused, no philosophy reading lists.
          8.  Constraint: Two analysts must reach the same conclusion independently.

  2.  **Deconstruct the Core Issue (Bertrand's Paradox in Engineering):**
      *   The math isn't wrong; the *mapping* from physics to math is ambiguous.
      *   *Method 1 (Random Endpoints):* Uniform angle on circumference. Implies nucleation happens on the boundary.
      *   *Method 2 (Random Radius/Distance):* Uniform distance from center, uniform angle. Implies the line's position in space is uniform (Jaynes' maximum entropy/invariance solution).
      *   *Method 3 (Random Midpoint):* Uniform point inside the circle. Implies the center of the feature is uniformly distributed.
      *   *Engineering Reality:* Physics dictates the measure. A crack doesn't appear by "magic"; it nucleates. A tool doesn't fall by "geometry"; it falls by dynamics.
      *   *The Procedure:* Must force the analyst to describe the *physics* first, then map to the *parameter*.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Mechanism Identification.* Ask "How does the line appear?"
          *   If it starts at the edge -> Endpoint method.
          *   If it falls from above -> Spatial uniformity (Distance/Angle).
          *   If it grows from a point -> Midpoint method.
      *   *Step 2: Symmetry Check.* If mechanism is vague, check invariance. Does shifting the circle change the probability? (Jaynes' argument).
      *   *Step 3: The "Stop" Condition.* If physics is truly unknown, admit uncertainty. Don't pick one. Bracket it.
      *   *Refinement:* Need to make this rigid enough that two analysts agree. "Vague" isn't good enough. Need specific criteria.

      *   *Drafting Questions:*
          1.  Where does the feature originate? (Boundary vs. Interior vs. External)
          2.  What is conserved/uniform in the generation process? (Energy? Position? Angle?)
          3.  Is the circle's position arbitrary relative to the source? (Invariance test).

      *   *Drafting the "No Answer" Protocol:*
          *   Output: Range [Min, Max].
          *   Justification: "Mechanism under-specified."
          *   Action: Request data on [Specific Parameter].

      *   *Drafting Examples:*
          *   (a) Fatigue: Nucleates at weld (boundary). -> Random Endpoints.
          *   (b) Dropped Tool: Falls over area. -> Random Distance/Angle (Jaynes).
          *   (c) Unknown Composite: No data. -> Bracket [1/4, 1/2, 1/3] (or relevant bounds).

      *   *Drafting Annotations:*
          *   Be honest. Step 2 is often a judgment call disguised as physics.
          *   Invariance arguments (Jaynes) are strong but assume the problem *should* be invariant. Is that a physical fact or a desideratum?

      *   *Drafting Limitations:*
          *   This doesn't solve the physics. It solves the *model selection*.
          *   If symmetries conflict (e.g., anisotropic material), standard Bertrand measures fail anyway.

      *   *Documentation:*
          *   Need a specific form/log entry. "Mechanism Assumption," "Selected Measure," "Falsification Condition."

  4.  **Refining for the "15-Minute" and "Consensus" Constraint:**
      *   To ensure consensus, the questions must be binary or multiple-choice where possible.
      *   Avoid "Do you think..." Use "Is there evidence for..."
      *   The "Jaynes/Invariance" step is the trickiest. Engineers might not know "translation invariance." Phrase it as "If we moved the pipe 1 meter to the left, would the scratch likelihood change?"

  5.  **Finalizing the Content (incorporating specific prompt requirements):**
      *   *Vocabulary:* Use "nucleation," "trajectory," "impact zone," not "measure theory."
      *   *Case (c):* Must be the "answer I will not like" (i.e., "We can't give a single number").
      *   *Annotation:* Clearly mark where human judgment enters.
      *   *Limitations:* Address whether invariance resolves choice or relocates it. (It relocates it to the assumption of invariance).

  6.  **Review against Constraints:**
      *   15 minutes? Yes, it's a flowchart/checklist.
      *   No philosophy? Yes, translated to engineering terms.
      *   Two analysts agree? The binary nature of the questions helps.
      *   Documentation paragraph? Included.

  7.  **Polishing the Tone:**
      *   Professional, directive, authoritative but humble about uncertainty.
      *   Structure: Header, Procedure, Stop Protocol, Examples, Annotations, Limitations, Documentation.

      *(Self-Correction during drafting)*: I initially thought about suggesting the Jaynes solution (maximum entropy) as the default. But the prompt explicitly warns about invariance arguments potentially just relocating the problem. I must ensure the procedure treats Invariance as a *test* for the physical setup, not a mathematical default. If the physical setup isn't translationally invariant (e.g., the pipe is near a wall), Jaynes' solution is physically wrong. I need to make sure the procedure checks *physical* invariance, not just mathematical elegance.

      *(Refining Case C)*: The prompt asks for the answer the user "will not like." This implies the user wants a number, but the correct engineering answer is "We don't know." I need to make sure the procedure explicitly mandates bracketing here.

      *(Refining Documentation)*: Make it a specific "Model Assumption Log" entry.

  8.  **Final Polish:** Check word count and clarity. Ensure the distinction between "Random Endpoints," "Random Radius," and "Random Midpoint" is clear in engineering terms. (Actually, standard Bertrand is Endpoints, Radius/Distance, Midpoint. I should stick to the standard three for clarity, mapped to physical causes).

      *   *Measure 1 (Endpoints):* Boundary nucleation.
      *   *Measure 2 (Distance/Angle):* External random trajectory (Jaynes).
      *   *Measure 3 (Midpoint):* Internal nucleation/center-focused.

      Let's write it.

      *(Final check on "Invariance" limitation)*: The prompt asks to address whether invariance resolves the choice or relocates it. I need to be explicit: It relocates the assumption from "which parameter is uniform" to "is the system translation/rotation invariant."

      *(Final check on "Judgment Calls")*: I need to highlight that determining *physical* invariance is a judgment call based on site data, not a math proof.

      Okay, ready to generate.

      *(Wait, one more thing)*: The prompt asks for "roughly fifteen minutes." I should structure it as a "Rapid Protocol."

      *(Wait, Case C)*: "Case (c) should be the one where the procedure returns the answer I will not like." This means the procedure must force the "I don't know" conclusion, preventing the analyst from picking a default.

      *(Wait, Documentation)*: "Short paragraph on how to document each run." I will add a specific section for this.

      Let's assemble.
answer: |-
  # Rapid Protocol for Geometric Measure Selection (RPGMS)
  **Version:** 1.0 | **Time Budget:** 15 Minutes | **Applicability:** Linear features traversing circular domains

  ## Purpose
  To eliminate ambiguity in Monte Carlo simulations involving random lines or chords in circular regions. This protocol forces the selection of a probability measure based on physical generation mechanisms rather than mathematical convenience. It ensures consensus between analysts and identifies scenarios where a single probability value cannot be defensibly issued.

  ## Part 1: The Decision Procedure
  *Answer the following questions in order. Do not proceed to the next question until the current one is resolved. Record answers in the Model Assumption Log (see Part 6).*

  ### Q1: Origin Localization
  **Question:** Does the physical feature (crack, scratch, fault) originate *on* the boundary of the circle, *inside* the circle, or *outside* the circle?
  *   **On Boundary:** (e.g., fatigue crack nucleating at a weld toe). **GO TO Q2.**
  *   **Inside:** (e.g., void coalescence centered within the material). **GO TO Q3.**
  *   **Outside:** (e.g., falling tool, external debris trajectory). **GO TO Q4.**

  ### Q2: Boundary Propagation (If Q1 = On Boundary)
  **Question:** Is the nucleation point uniformly distributed along the circumference, and is the propagation direction independent of the nucleation location?
  *   **Yes:** Select **Measure A (Random Endpoints)**.
      *   *Implementation:* Sample two angles $\theta_1, \theta_2 \sim U[0, 2\pi)$. Construct chord between points.
      *   *Justification:* Uniformity of nucleation sites on the weld perimeter.
  *   **No:** (e.g., nucleation is clustered at the top due to gravity/loading). **STOP.** (See Part 2: Non-Standard Protocol).

  ### Q3: Internal Nucleation (If Q1 = Inside)
  **Question:** Is the *center* (midpoint) of the feature uniformly distributed over the area of the circle?
  *   **Yes:** Select **Measure B (Random Midpoint)**.
      *   *Implementation:* Sample midpoint $(r, \theta)$ with density proportional to $r$ (uniform in area). Sample orientation $\phi \sim U[0, \pi)$.
      *   *Justification:* The feature's location is area-uniform; orientation is isotropic.
  *   **No:** (e.g., nucleation favors the center or the edge). **STOP.** (See Part 2: Non-Standard Protocol).

  ### Q4: External Trajectory (If Q1 = Outside)
  **Question:** If the circular target were shifted slightly in space (translation) or rotated, would the probability of intersection change?
  *   **Yes:** (The setup is *not* invariant; e.g., the tool falls from a fixed chute aimed at a specific spot). **STOP.** (See Part 2: Non-Standard Protocol).
  *   **No:** (The setup *is* invariant; e.g., the tool is dropped "somewhere" over a large floor containing the pipe). **Select Measure C (Random Distance/Angle).**
      *   *Implementation:* Sample perpendicular distance from center $p \sim U[0, R]$ and angle $\alpha \sim U[0, 2\pi)$.
      *   *Justification:* Physical translation invariance implies uniformity in the line's perpendicular offset (Jaynes' Principle).

  ### Q5: The "Unknown Mechanism" Check (Mandatory Final Step)
  **Question:** Is there empirical data or first-principles physics validating the uniformity assumption selected in Q2, Q3, or Q4?
  *   **Yes:** Proceed with Simulation.
  *   **No:** **STOP.** (See Part 2: Uncertainty Protocol).

  ---

  ## Part 2: Stop Protocols (Deliverables)

  ### A. Non-Standard Protocol (Physics violates symmetry)
  If you stopped at Q2, Q3, or Q4 because the answer was "No":
  1.  **Do not use a standard Bertrand sampler.**
  2.  **Deliverable:** A custom sampler derived from the specific distribution (e.g., if nucleation is Gaussian clustered at $90^\circ$, code that distribution).
  3.  **Documentation:** Flag as "Non-Isotropic/Non-Uniform Mechanism."

  ### B. Uncertainty Protocol (The "Answer You Will Not Like")
  If you stopped at Q5 (no data to validate uniformity) or if Q1 cannot be answered:
  1.  **Do not issue a single probability.**
  2.  **Deliverable:** A probability bracket $[P_{min}, P_{max}]$.
      *   Run the simulation using Measure A, Measure B, and Measure C.
      *   Report the range of outcomes for the failure metric.
  3.  **Client Statement:** "The physical mechanism governing feature generation is under-specified. Standard geometric assumptions yield a probability range of $X\%$ to $Y\%$. To collapse this range, data is required on [Specific Parameter from Q1-Q4]."
  4.  **Risk Classification:** Flag as "High Epistemic Uncertainty."

  ---

  ## Part 3: Worked Applications

  ### Case (a): Fatigue Crack in Pipe Weld
  *   **Scenario:** Crack nucleates at the weld circumference and propagates inward.
  *   **Run:**
      *   Q1: Origin is **On Boundary**. (Go to Q2).
      *   Q2: Nucleation is assumed uniform along the weld; direction is driven by hoop stress (radial). **Yes**.
      *   Q5: Is there data? Client specifies "random nucleation along weld" in spec sheet. **Yes**.
  *   **Verdict:** **Measure A (Random Endpoints)**.
  *   **Code:** `theta1 = rand(0, 2pi); theta2 = rand(0, 2pi);`

  ### Case (b): Dropped Tool on Viewport
  *   **Scenario:** A tool is dropped from a walkway above a circular viewport. The walkway covers the area broadly.
  *   **Run:**
      *   Q1: Origin is **Outside** (trajectory passes through). (Go to Q4).
      *   Q4: If the viewport were moved 10cm, would the drop likelihood change? No, the walkway is large relative to the viewport. **No change (Invariant)**.
      *   Q5: Is there data? No specific drop data, but physical invariance holds. **Proceed with caution**.
  *   **Verdict:** **Measure C (Random Distance/Angle)**.
  *   **Code:** `p = rand(0, R); alpha = rand(0, 2pi);`
  *   **Note:** This corresponds to the "1/2" solution in classic Bertrand problems, justified by spatial invariance.

  ### Case (c): Composite Material Micro-Crack
  *   **Scenario:** Client asks for failure probability of a circular coupon. Crack initiation physics in the new composite are proprietary and unknown to the analyst.
  *   **Run:**
      *   Q1: Origin? **Unknown**. (Could be surface defects, internal voids, or external impact).
      *   **STOP.**
  *   **Verdict:** **Uncertainty Protocol**.
  *   **Deliverable:** "Probability of failure is bounded between 33% and 50% (depending on measure). We cannot recommend a single value."
  *   **Action:** Request micro-CT scan data to locate void distribution (resolves Q1/Q3).

  ---

  ## Part 4: Honest Annotation (Where the Judgment Lies)
  *Analysts must acknowledge these steps are not mathematical proofs but physical assertions.*

  1.  **Q1 (Origin):** This is a **Fact Check**. It relies on domain knowledge. If analysts disagree here, they are disagreeing on the physics, not the math. *Action:* Consult the design specification.
  2.  **Q4 (Invariance):** This is a **Counterfactual Judgment**. You cannot test shifting the pipe physically. You are asserting that the *process* generating the line is not coupled to the circle's specific coordinates. *Action:* If the drop zone is constrained (e.g., a chute), Invariance fails. If it is "general maintenance," Invariance holds.
  3.  **Q5 (Validation):** This is the **Epistemic Gate**. Most analysts will want to skip this to finish the job. *Constraint:* You are forbidden from skipping Q5. If the answer is "We assume uniformity because it's standard," the answer is **No**.

  ---

  ## Part 5: Limitations Statement
  **What this procedure cannot do:**
  1.  **It does not resolve physical ignorance.** If the physics are unknown (Case C), this procedure forces you to admit it rather than hiding it behind a "standard" sampler. It does not generate data.
  2.  **Invariance is an assumption, not a law.** The argument for Measure C (Jaynes' solution) relies on the assumption that the problem *should* be translationally invariant. In some engineering contexts, this is false (e.g., a pipe fixed near a wall where debris accumulates). The procedure tests for this, but the analyst must honestly assess the "shift" scenario.
  3.  **Conflicting Symmetries.** If a component is rotationally symmetric but the load is directional (e.g., gravity), "uniform orientation" (isotropy) is physically wrong. This procedure will catch this at Q2/Q3/Q5, but it will not fix it; it will force a "Stop" and require a custom non-uniform sampler.
  4.  **It does not validate the code.** It only validates the *choice of measure*. You can still code Measure A incorrectly.

  ---

  ## Part 6: Documentation Standard (The Audit Trail)
  *To satisfy internal review, every simulation run must include the following block in the Model Definition Document. Do not write paragraphs; fill the fields.*

  | Field | Entry Requirement | Example Entry |
  | :--- | :--- | :--- |
  | **Mechanism Class** | Select: Boundary / Internal / External / Unknown | `External` |
  | **Selected Measure** | Select: Endpoints / Midpoint / Distance-Angle / Bracketed | `Distance-Angle` |
  | **Uniformity Parameter** | Which physical quantity is asserted to be Uniform? | `Perpendicular offset (p)` |
  | **Invariance Claim** | What physical symmetry justifies the uniformity? | `Translation of target relative to drop zone` |
  | **Falsification Condition** | What physical fact would prove this assumption wrong? | `Evidence of drop-zone clustering or chute guidance` |
  | **Uncertainty Status** | Select: Validated / Assumed / Bracketed | `Assumed` |

  **Auditor Note:** If "Uncertainty Status" is "Assumed" and "Falsification Condition" is left blank or vague, the model is rejected for review.

  ---

  ### Implementation Note for Analysts
  This procedure is designed to be **idempotent**. If two analysts run this on the same spec sheet, they must arrive at the same "Mechanism Class." If they do not, the spec sheet is ambiguous, and the correct output is the **Uncertainty Protocol**. Do not resolve specification ambiguity by choosing a math convention; resolve it by flagging the spec.
