prompt: |-
  I work at a smallish global-health foundation, and I've been going through the minutes of our Evidence & Measurement Committee — the subcommittee that decides whether to commission more measurement before we lock in a funding decision. I'm writing the memo for the next one and I'd like a second read before I stick my neck out.

  Their record so far (paraphrased from the minutes, with what I remember of the reasoning in brackets):

  - Cheap six-month head-to-head trial of two bednet distribution methods, results to us only, then we pick: commission. ["Standard."]
  - Same trial, but it would take three years and the decision is due in six weeks: don't commission. ["It'd land after we've already spent the money."]
  - Already-collected government data on regional malaria prevalence — free — except our charter obliges us to allocate strictly in proportion to measured prevalence, and most of us think that rule is badly miscalibrated: don't commission. ["The number would decide for us, and badly."]
  - A cheap, noisy, biased proxy outcome where we know both the direction and the size of the bias: commission. ["We just adjust."]
  - A moderately expensive study using an outcome measure nobody has ever validated — three incompatible models of how the measure maps onto what we actually care about, no way to rank them: don't commission. ["We'd be guessing about the guessing."]
  - A cheap staff survey that would change the thing it measures, because asking people whether they'd stay if we moved the program gets them started on planning to leave: don't commission.
  - A cheap, precise study we'd be obliged to publish, where a rival funder would read it and move into our districts first: don't commission. ["Looking is itself a signal."]
  - A result a partner already produced and left in a drawer — genuinely zero cost — on a question everyone agrees can't change what we fund this cycle: don't commission. ["Zero value isn't a reason to spend an hour."]

  The new one. Our partner org is offering, at their own cost and on our timeline, a comparison of the two programs we're choosing between. They'll pre-specify a handful of analyses, run them honestly and accurately, and then send us one: whichever makes their favourite program look best. We know they'll do that. It isn't deception, it's selection. What we can't do is say how much room that gives them. Under one model all the analyses agree and it makes no difference; under another they diverge widely and whichever one they pick is close to arbitrary. We have maybe four plausible models of the divergence, no way to rank them, and no probabilities to put on them. Everything else is clean: costs us nothing, no delay, results private, and afterwards we'd sit down and re-decide from scratch, no formula, no charter rule, no outside body forcing our hand.

  I keep circling back to Good's theorem — the result that for an expected-utility maximiser who updates and then re-optimises, free information can't make you worse off; the worst it can be is worth nothing. But I can't tell whether this case is inside or outside the scope of that result, because the bit I'm unsure about is whether "we have four models and no probabilities over them" is just an ordinary prior over models (in which case the reported number is still an ordinary signal and the theorem applies) or whether it breaks the single-prior assumption the theorem needs. I have a vague feeling that once you only have an unrankable *set* of priors the non-negativity guarantee is up for grabs, but I genuinely don't know, and I don't want to lean on it. There's also a dumber reading of the whole record: that the committee isn't running any theorem at all, just asking "will this improve the argument we'll actually have in the room" — and a number hand-picked by someone with a favourite, which we can't discount, is exactly the kind of thing that makes an argument worse.

  What I want from you: your best guess at what they should decide if they want to be consistent with themselves; the two or three different rules that fit all eight precedents equally well; what each of those rules predicts about the partner's study; which precedent is genuinely the closest analog (I keep flip-flopping between the unvalidated-measure one and the charter one); an honest statement of what principle they'd be committing to with each choice — including whether "we" means the committee as it actually argues or the committee as an ideal Bayesian; and the follow-up case that would actually separate the rules. My two candidates are (a) the same study except the partner pre-commits in writing to one analysis before running anything, and (b) a clean, unbiased, free measurement where the *unrankable models* are about how the program works rather than about how the result got selected. Say which of those is more diagnostic, or name a better one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Works at a smallish global-health foundation. Member of the Evidence & Measurement Committee (EMC).
      *   **Task:** Writing a memo for the next EMC meeting regarding a new proposal. Wants a "second read" to ensure consistency with past decisions before "sticking their neck out."
      *   **Tone:** Intellectual, precise, slightly anxious about consistency, familiar with decision theory (Good's theorem, Bayesian updating), pragmatic but principled.
      *   **Input Data:** 8 past precedents (decisions + reasoning) + 1 new case (Partner-offered study with selection bias/uncertainty).
      *   **Goal:** Determine the consistent decision, identify underlying rules/principles, analyze the applicability of Good's theorem, identify the closest analog, and propose a diagnostic follow-up case.

  2.  **Deconstruct the Precedents (The "Case Law"):**

      *   *Case 1 (Cheap 6mo trial):* **Commission.** Reason: Standard utility. Cost low, timing good, actionable.
      *   *Case 2 (3yr trial, decision due 6wks):* **Don't.** Reason: Timing mismatch. Information arrives too late to affect decision. (Value of Information = 0).
      *   *Case 3 (Free gov data, charter rule):* **Don't.** Reason: Institutional constraint. The data would force a bad decision via a rigid rule ("miscalibrated charter"). The *process* prevents using the info wisely.
      *   *Case 4 (Biased proxy, known bias):* **Commission.** Reason: Correctable. If bias direction/size is known, it can be adjusted for. Information is recoverable.
      *   *Case 5 (Expensive, unvalidated measure, 3 incompatible models):* **Don't.** Reason: Interpretive ambiguity. "Guessing about the guessing." No way to map result to value. High cost + High ambiguity.
      *   *Case 6 (Staff survey, measurement effect):* **Don't.** Reason: Measurement contamination. The act of measuring changes the outcome negatively (Hawthorne/observer effect).
      *   *Case 7 (Precise study, public, rival funder):* **Don't.** Reason: Strategic leakage. Information benefits a competitor more than us, or changes the strategic landscape negatively.
      *   *Case 8 (Partner's drawer data, zero cost, irrelevant):* **Don't.** Reason: Irrelevance. Can't change the decision. (Value of Information = 0).

  3.  **Analyze the New Case:**
      *   **Offer:** Partner org compares two programs.
      *   **Cost:** Zero (to foundation).
      *   **Timeline:** Good (on our timeline).
      *   **Privacy:** Good (results to us only).
      *   **Constraint:** No charter rule forcing a specific decision based on the number.
      *   **The Catch:** Partner selects *which* analysis to report (the one favoring their favorite).
      *   **Uncertainty:** We know they will select, but we don't know *how much* selection room they have (4 plausible models of divergence, unrankable, no probabilities).
      *   **User's Dilemma:** Good's Theorem (free info $\ge$ 0) vs. Ambiguity/Model Uncertainty (Knightian uncertainty). Does the lack of a single prior break Good's Theorem? Or is this about the *quality of the deliberation*?

  4.  **Evaluate Good's Theorem Applicability:**
      *   Good's Theorem assumes a single prior probability distribution over states of the world and utility function.
      *   Here, we have *model uncertainty* (4 models, unrankable). This is often treated as a set of priors (Maximin Expected Utility, or similar ambiguity-averse frameworks).
      *   Under ambiguity aversion (e.g., Gilboa-Schmeidler), free information *can* have negative value because it might force you into a state where your worst-case prior becomes active, restricting your choice set or increasing anxiety/uncertainty without resolving it.
      *   *However*, the more practical reading (as the user hints) is about *deliberative utility*. If the number introduces noise that cannot be calibrated (unlike Case 4), it degrades the decision process.

  5.  **Identify Consistent Rules/Principles:**
      *   *Rule A (Calibration/Correctability):* We commission if we can translate the signal into truth. (Fits Case 1, 4. Excludes Case 5, New Case).
      *   *Rule B (Decision Impact/VOI):* We commission if it changes the decision *and* we can use it to change it correctly. (Fits Case 2, 8 as exclusions. Fits Case 3 as exclusion due to external constraint).
      *   *Rule C (Strategic/Process Integrity):* We commission if the information doesn't corrupt the process or strategic position. (Fits Case 6, 7. Fits New Case as exclusion due to "corrupted signal").

      *   *Synthesis:* The committee seems to operate on **"Actionable Clarity."** Information is only valuable if it reduces uncertainty *about the thing we care about* without introducing unquantifiable noise or constraints that prevent wise action.

  6.  **Analyze the New Case against Precedents:**
      *   *Closest Analog:* **Case 5 (Unvalidated measure).**
          *   Why? In Case 5, there were 3 incompatible models of how the measure maps to value. In the New Case, there are 4 incompatible models of how the selection bias maps to the truth. Both involve "unrankable models" leading to "guessing about the guessing."
          *   *Alternative:* **Case 3 (Charter Rule).** In Case 3, the number forces a bad decision. In the New Case, the number *tempts* a bad decision (anchoring) but doesn't force it. However, the user says "afterwards we'd sit down and re-decide from scratch." So Case 3 is less tight.
          *   *Alternative:* **Case 4 (Biased Proxy).** Case 4 was commissioned because the bias was *known*. Here, the bias magnitude is *unknown* (4 unrankable models). This is the critical distinction.
      *   *Prediction:* If consistent with Case 5, they should **Don't Commission**. If consistent with Case 4 (free + private), they might Commission, but the "unrankable models" pushes it toward Case 5.
      *   *Good's Theorem:* The user is right to be suspicious. With a *set* of priors (ambiguity), free information can have negative value (e.g., if the signal eliminates the "optimistic" priors but leaves the "pessimistic" ones, worsening the maximin value). But practically, the committee cares about *argument quality*. A selected number is "poisoned evidence."

  7.  **Drafting the Response:**

      *   **Decision:** Recommend **Don't Commission**.
      *   **Reasoning:** It violates the "Calibration/Correctability" principle seen in Case 4 vs. Case 5.
      *   **Three Rules:**
          1.  *The Correctability Rule:* Can we adjust for the noise/bias? (Yes: Case 1, 4. No: Case 5, New Case).
          2.  *The Decision-Constraint Rule:* Does the info force a hand or break the process? (Yes: Case 3, 6, 7. No: Case 1, 4).
          3.  *The VOI Rule:* Does it arrive in time and change the outcome? (Yes: Case 1. No: Case 2, 8).
      *   **Closest Analog:** Case 5 (Unvalidated measure). Both share "multiple incompatible models, no way to rank."
      *   **Principle Commitment:**
          *   *Commissioning:* Commit to "Free is always good" (Risk: Garbage in, garbage out, anchoring bias).
          *   *Not Commissioning:* Commit to "Unquantifiable ambiguity negates value" (Risk: Ignoring free data that might have *some* signal).
      *   **Diagnostic Follow-up:**
          *   Option (a) Pre-commitment: This turns it into Case 4 (Known bias/selection mechanism fixed). If they commission (a) but not (New), the rule is about *controllability of bias*.
          *   Option (b) Clean measure, unrankable models of *program*: This is Case 5 again.
          *   *Better Diagnostic:* A case where the bias is known *directionally* but not magnitude (like Case 4) but the *cost* is zero. Or, a case where the partner selects, but we *know the selection rule*.
          *   *Selection:* Option (a) is the better diagnostic. It isolates the "selection mechanism" variable. If pre-commitment makes it acceptable, the objection is purely about the *selection*, not the *source*.

  8.  **Refining the Good's Theorem Point:**
      *   Need to be precise. Good's theorem holds for a *single* prior. With multiple priors (ambiguity), the value of information can be negative because updating might shrink the set of priors in a way that lowers the minimum expected utility.
      *   However, the committee's behavior suggests they aren't pure Bayesians. They care about the *social/argumentative* value of the evidence (Case 7, Case 3).
      *   So, acknowledge the theorem limitation but emphasize the *committee's* implicit heuristic: "Can we use this number in a sentence without lying?"

  9.  **Final Polish:**
      *   Match the user's intellectual tone (precise, slightly academic but operational).
      *   Ensure the "Don't Commission" recommendation is clear.
      *   Make sure the distinction between Case 4 (Known bias) and New Case (Unknown bias magnitude) is highlighted.

      *(Self-Correction during drafting)*: Wait, look at Case 8. "Zero value isn't a reason to spend an hour." The New Case costs nothing *financially*, but does it cost deliberation time? Yes, "makes an argument worse."
      Look at Case 7. "Looking is itself a signal." Here, accepting the study might signal trust in the partner.
      But the strongest link is Case 5. "Guessing about the guessing." In the New Case, we are guessing about the selection bias. In Case 5, we were guessing about the measure validity. Both result in unrankable models.

      *Decision:* Stick with Case 5 as the primary analog. The rule is "No unquantifiable model uncertainty."

      *Diagnostic:* Option (a) is definitely the winner. It tests if the problem is the *partner's agency* or the *structural uncertainty*.

  10. **Final Review against constraints:**
      *   Best guess at decision? (Don't).
      *   2-3 rules fitting precedents? (Correctability, Constraint, VOI).
      *   Prediction for each? (Don't, Don't, N/A).
      *   Closest analog? (Case 5).
      *   Principle commitment? (Epistemic hygiene vs. Resource maximization).
      *   Follow-up case? (Option A).

