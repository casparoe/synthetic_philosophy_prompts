  **Joint Statement on the Procreation Asymmetry: An Adversarial Collaboration**

  Look, we're both tired. We've spent the last six months banging our heads against the same Benatar-style examples until neither of us can hear the word "suffering" without flinching. The goal here isn't to convince the other side that they're wrong—we've accepted that's not happening anytime soon—but to map the exact coordinates of where we diverge so our study group stops talking in circles. We agree that the standard intuitions are messy, especially when you throw in climate-related reproductive choices where our current emissions partly determine who gets born. So, we hammered out a baseline we can both sign, followed by the specific fault lines where our moral architectures actually break apart.

  This document is structured to force clarity. We aren't looking for compromise language; the disagreements section uses wording each of us actually endorses, even if the other thinks it's mistaken. We also identified two specific cruxes where empirical or intuitive shifts could change our minds. We're pre-registering our predictions here so we can't wiggle out later if the study group pushes the thought experiments hard enough. If you're reading this, don't look for citations or hidden references to obscure theorists; this is about the raw structure of the argument, not the literature review.

  Finally, a note on how to use this: don't start with the disagreements. Read the agreed claims first to see where the common ground lies, then move to the table to see where the split happens. Use the cruxes as discussion prompts for your next session—specifically the Twin-Planet scenario, since that's where the non-identity problem gets weird. We've left the definitions open enough that you can plug in your own examples, but keep the logic tight. If you find a contradiction in the agreed claims, tell us, because that means the colaboration failed.

  ### I. Agreed Claims

  1.  **Definiton of the Asymmetry:** We agree that the "Procreation Asymmetry" refers to the intuition that there is a strong moral reason not to bring a person into existence if their life would be suffering-filled, but no corresponding moral reason to bring a person into existence if their life would be happy.
  2.  **The Non-Identity Problem:** We agree that the Non-Identity Problem is logically valid: different reproductive choices result in different specific individuals existing, meaning a choice cannot harm a specific future person by causing them to exist with a difficult life, provided that life is worth living.
  3.  **Moral Standing of Possible People:** We agree that merely possible people do not have actual rights or interests *now*, but the quality of life they *would* have is a morally relevent variable in evaluating reproductive choices.
  4.  **Scope of Inquiry:** We agree that this framework applies to voluntary procreation decisions in non-emergency contexts, excluding cases where existence is guaranteed regardless of specific parental choice.

  ### II. Disagreements Table

  | Feature | Asymmetry-Defender (AD) | Symmetry-Skeptic (SS) |
  | :--- | :--- | :--- |
  | **Source of Value** | Value is strictly person-affecting. An outcome can only be better or worse if it is better or worse *for* some specific individual. | Value is partly impersonal. An outcome can be better simply because it contains more well-being, even if no specific individual is harmed by the alternative. |
  | **Duty to Create** | There is no duty to create happy people because there is no one who is deprived by their non-existence. | There is a pro tanto reason to create happy people because a world with happy people is better than a world without them. |
  | **Interpretation of NIP** | The Non-Identity Problem shows that "harm" is the wrong lens; we should rely on the asymmetry to avoid creating suffering without needing to create happiness. | The Non-Identity Problem shows that person-affecting views are incomplete; we must adopt an impersonal view to explain why creating suffering is wrong. |
  | **Status of Non-Existence** | Non-existence is neutral. It is not "good" for the non-existent to be spared, nor "bad" for them to miss out. | Non-existence is a lack of value. It is not "bad" for the individual, but it is a loss of goodness from the universe. |

  ### III. The Cruxes & Pre-Registered Predictions

  **Crux 1: The Work of Impersonal Value**
  *   **The Case:** Compare Universe A (1 billion very happy people, no suffering) vs. Universe B (Empty, no beings).
  *   **AD Position:** Neither universe is morally better than the other. Value requires a valuer.
  *   **SS Position:** Universe A is objectively better than Universe B.
  *   **Prediction:** If the study group can construct a scenario where impersonal value leads to a repugnant conclusion (e.g., obligating massive reproduction at slight cost to existing people), the AD wins. If the group shows that denying impersonal value makes climate inaction permissible, the SS wins.

  **Crux 2: Replacement Reproduction (Twin-Planet Scenario)**
  *   **The Case:** You have resources for one child. On Planet X, you can create Child A (Happy). On Planet Y (identical resources), you can create Child B (Very Happy). Due to causal separation, choosing A means B never exists, and vice versa.
  *   **AD Position:** Choosing A is not morally worse than choosing B. You haven't harmed B (B never exists), and you haven't harmed A (A is happy).
  *   **SS Position:** Choosing A is morally suboptimal. You failed to realize the greater impersonal value of B's existence.
  *   **Prediction:** If intuitions shift when A and B are genetically similar (e.g., siblings), the SS gains ground. If intuitions hold firm that you can't wrong a non-existent twin, the AD holds.

  ***

  **Instructions for the Study Group:**
  *   **Step 1:** Verify agreement on Section I. If anyone disputes claim 3, stop and discuss "moral standing" before proceeding.
  *   **Step 2:** Pick a side in Section II for the sake of argument, even if you disagree.
  *   **Step 3:** Run the Twin-Planet scenario live. Change the variables (e.g., make Child B *extremely* happy vs. Child A *barely* happy) and see where the intuition breaks.
  *   **Step 4:** Report back on whether the climate angle changes the weight of the asymmetry.
