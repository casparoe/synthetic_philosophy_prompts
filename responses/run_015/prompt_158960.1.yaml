      *   **Committee:** 3 people.
      *   **Constraints:** Runnable in two afternoons, no philosophy training needed, one-page output for membership argument.
      *   **Philosophical Basis:** Rawlsian Veil of Ignorance + Difference Principle.
      *   **Specific Demands:**
          *   Define the "Veil" (what is hidden?).
          *   Define "Worst Off" (current band vs. lifetime trajectory?).
          *   Define "Incentive vs. Bargaining Power" test.
          *   Run the procedure on three specific cases (Infra raise, Retention bonus, Coordination role pay).
          *   **Crucial:** Commit to answers, don't offer options. At least one case must result in a "No" that might be unpopular. Acknowledge limitations/failure points.

  2.  **Deconstruct the Philosophical Framework (Rawls for Co-ops):**
      *   *Veil of Ignorance:* In a co-op, we know each other. We can't literally forget who we are. So, the Veil must be procedural. It's about *perspective*, not amnesia. We must deliberate as if we *could* be anyone in the system, specifically the most vulnerable.
      *   *Difference Principle:* Inequalities are only justified if they benefit the least advantaged. In a co-op, "benefit" isn't just profit; it's sustainability, mission, and collective welfare.
      *   *The "Bite" Points:*
          1.  *Scope:* Pay vs. Bundle. Rawls talks about "primary goods." In a co-op, work-life balance and dignity are primary goods. It *must* be the whole bundle.
          2.  *Worst Off:* Current year vs. Lifetime. Rawls is concerned with life chances. If someone is structurally excluded from high bands due to care/health, judging only by current band punishes them for structural constraints. It *must* be lifetime/structural potential.
          3.  *Incentive vs. Threat:* This is the hardest. Rawls allows inequality to stimulate productivity that trickles down. But "pay me or I quit" is coercion, not functional incentive. The test must be about *role necessity*, not *individual leverage*.

  3.  **Drafting the Procedure (The "Two Afternoon" Constraint):**
      *   Needs to be concrete steps.
      *   Needs to produce a one-pager.
      *   Needs to filter out "vibes."

      *   *Step 1: The Veil (Anonymization & Role Mapping).* We can't hide identities completely, but we can hide *names* attached to *proposals*. More importantly, we must map the *impact* on the lowest band.
      *   *Step 2: The Difference Test.* Does this inequality raise the floor?
      *   *Step 3: The Threat Test.* Is this about the work or the worker?
      *   *Step 4: The Vote Threshold.* When do we punt to the membership?

  4.  **Addressing the Three "Bite" Points (Committing):**
      *   *Scope:* **The Whole Bundle.** Pay is just one metric. If high bands get schedule flexibility and low bands get crunch time, that's an inequality in primary goods. The procedure must evaluate total compensation (cash + autonomy + security).
      *   *Worst Off:* **Structural/Lifetime.** If a member *cannot* access high bands due to caregiving/health, they are the "least advantaged" by definition of the system's design, not just current pay slip. The Difference Principle fails if it ignores structural exclusion.
      *   *Incentive vs. Threat:* **The "Vacancy Test."** Would we pay this premium if the specific person left tomorrow and we hired a stranger? If yes, it's a role incentive. If no (i.e., we are paying to stop *this* person leaving), it's bargaining power/ransom. Rawls rejects bargaining power as a justification for justice.

  5.  **Running the Live Proposals:**
      *   *(a) Infra Raise (Double Pay):*
          *   Veil: If I were the lowest paid, does this help me?
          *   Threat Test: Is it the role or the person? "Outside offer at double" suggests market rate, but "double" internal is huge inequality.
          *   Difference Principle: Does paying one person 2x raise the floor? Only if their work prevents collapse that would fire everyone.
          *   Verdict: **No (with caveats).** Doubling one person's pay in a co-op usually violates the spirit of solidarity unless the "collapse" risk is existential and provable. It sets a precedent that market rate > internal equity.
      *   *(b) One-off Retention Payment:*
          *   Veil: Is this available to anyone?
          *   Threat Test: Clearly individual leverage.
          *   Verdict: **Hard No.** This is pure bargaining power. It violates the Difference Principle because it allocates surplus based on threat capability, not benefit to the least advantaged.
      *   *(c) Coordination/Management Role:*
          *   Veil: Someone has to do it. It's unpleasant.
          *   Threat Test: It's about the role, not the person.
          *   Difference Principle: If no one does it, the co-op fails (hurting the worst off). Paying someone to do it ensures the function exists.
          *   Verdict: **Yes.** This is a classic justified inequality under the Difference Principle (compensation for burden/necessity).

      *   *Selection for the "Unpopular No":* Proposal (a) is the most tempting to say yes to (retention of key tech), but philosophically it's the most dangerous. Proposal (b) is obviously wrong. Proposal (c) is obviously right. To make the procedure bite, I need to reject (a) or significantly constrain it. Let's reject (a) as proposed (double pay) but allow a band adjustment. Actually, the prompt asks to run it on the proposals. I should be strict. (b) is the clearest "No". (a) is the nuanced "No/Modify". Let's make (b) the hard no, and (a) a "No, unless restructured as a band change." Wait, the prompt says "At least one of them should come out as something we don't want to hear." Rejecting the Infra raise (a) is painful for a software co-op. Rejecting the retention bonus (b) is easy. I will reject (a) as *currently formulated* because "double" is unsustainable inequality, but the real bite is rejecting the *market rate* argument. Actually, let's make (b) the hard no, and (a) a "Yes, but..." No, the prompt wants the procedure to say no. I will say **No to (b)** (obvious) and **No to (a)** (painful). The "bite" is telling the senior infra person they don't get double.

      *   *Refining the "Bite":* The prompt asks to commit. I will argue that (a) fails the Threat Test if it's tied to the *individual's* offer rather than the *role's* market value. If the role is valued that high, the *band* moves, not the person. But if it's just to match an offer, it's ransom. I'll rule (a) as a **No** in its current form (individual adjustment) and require it to be a **Band Review**. This is the "don't want to hear" part: "Your key person doesn't get a special deal; the band moves or they leave." That's the co-op hard truth.

  6.  **Addressing Limitations:**
      *   Where does this fail? It can't solve deep cultural resentment. It can't calculate "benefit to worst off" precisely. It relies on honesty.
      *   It papers over the fact that "benefit" is subjective.

  7.  **Final Review against Constraints:**
      *   Two afternoons? Yes, the steps are tight.
      *   One page output? Yes, the template is designed for that.
      *   No philosophy training? Language is plain English.
      *   Commit to answers? Yes.

  8.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Tone:* Direct, pragmatic, slightly stern (like a senior partner or union rep).
      *   *Structure:*
          1.  The Three Commitments (answering the "bite" points).
          2.  The Procedure (The 4 Steps).
          3.  The One-Page Template.
          4.  The Live Runs (a, b, c).
          5.  The Failure Modes (Where this breaks).

      *   *Refining the "Worst Off" definition:* I need to be careful. "Lifetime" is hard to calculate in two afternoons. I need a proxy. Proxy = "Structural Access." Can they *physically/logistically* access the higher bands? If no, they are the "worst off" regardless of current pay.
      *   *Refining the "Veil":* It's not anonymizing names. It's anonymizing *interest*. "Argue as if you will be assigned to the lowest band next year."

      *   *Refining Proposal (a):* If I say "No" to the infra person, they leave. The co-op might suffer. Does that violate the Difference Principle? If the co-op collapses, the worst off are worse off. So, keeping them *might* be justified. BUT, the *mechanism* (individual double pay) sets a precedent that destroys the band system. The procedure must prioritize the *system* over the *individual crisis*. So the answer is "No to individual exception, Yes to band review." This distinguishes between "Incentive for the role" vs "Ransom for the person."

      *   *Refining Proposal (b):* One-off retention. Hard No. It's arbitrary and non-transparent.
      *   *Refining Proposal (c):* Coordination role. Yes. It compensates for burden.

      *   *Wait, I need to make sure I answer the specific question:* "Is the thing behind the veil pay only, or the whole bundle?" -> Whole Bundle. "Is 'the worst off' whoever is in the lowest band this year, or whoever ends up worst over a whole working life?" -> Structural/Lifetime potential. "What test separates a genuine incentive from bargaining power?" -> The Vacancy Test.

      *   *Let's finalize the "No".* I will make Proposal (a) the "No you don't want to hear." Telling a key dev they don't get a special match is the hardest conversation. Proposal (b) is easy to reject. Proposal (c) is easy to accept. So (a) is the test of the procedure's integrity.

      *   *Wait, looking closer at (a):* "Lifting the top of the band for infrastructure work." This implies a band change, not just an individual raise. "Because our senior infra person has an outside offer." This is the tricky bit. Is it a band change or a personal exception? The prompt says "lifting the top of the band... because...". This is a band change triggered by a threat.
      *   *Decision:* I will rule that **market rate alone is not a Difference Principle justification.** The justification must be "This work creates surplus that lifts the floor." If the infra work prevents catastrophe, yes. If it's just "market rate," no. I will rule (a) as **Conditional No.** It requires proof of value to the floor, not just proof of market price. This is the "don't want to hear" part: "Market rate doesn't matter; value to the collective matters."

      *   *Actually, let's go harder.* To satisfy "At least one of them should come out as something we don't want to hear," I should reject (b) outright (easy) and reject (a) as *insufficiently justified* under the Difference Principle. The "No" is: "We do not match market rates unless the work directly subsidizes the lowest band."

      *   *Okay, let's write it.*

      *(Self-Correction on "Two Afternoons"):* The procedure needs to be very specific about timeboxing.
      *(Self-Correction on "One Page"):* I need to provide the template.

      *(Final check on the "Veil"):* Rawls' veil is about not knowing your place. In a 50-person co-op, we know our place. So the procedural veil is: "You must argue for the proposal assuming you will be randomly assigned to the **lowest band** for the next 3 years." This forces the perspective shift.

      *(Final check on "Worst Off"):* I will define this as "The member with the least structural capacity to move bands." This protects the caregivers/chronic illness members.

