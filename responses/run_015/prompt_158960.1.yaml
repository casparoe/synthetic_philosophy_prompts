answer: |-
  Here is the procedure. It is designed to be run in two 4-hour sessions. It is not designed to make everyone happy; it is designed to make the outcome defensible.

  ### Part 1: The Three Commitments
  You asked me to settle the three biting questions. Here are the rulings. Do not debate these during the procedure; they are the axioms you have already agreed to by adopting this document.

  **1. The Scope: The Whole Bundle**
  The Veil covers **total compensation**, not just hourly rate.
  *   **Why:** In a co-op, autonomy and security are primary goods. If high-band members get schedule flexibility and low-band members get "crunch time," you have created a caste system even if pay is equal.
  *   **Rule:** Any proposal that increases pay inequality must demonstrate that it does not decrease autonomy or security for the lowest band. If the top band gets more money *and* more control, the burden on the bottom must be lightened to compensate.

  **2. The "Worst Off": Structural Capacity, Not Current Pay**
  The "least advantaged" are **not** whoever is in the lowest band this year. They are the members who, due to caregiving, health, or skill-access barriers, **cannot structurally access the higher bands** over a working life.
  *   **Why:** Rawls is concerned with life chances, not snapshots. If you have members who *cannot* take high-stress/high-band work due to chronic illness, they are the "least advantaged" by definition of your system's design.
  *   **Rule:** When applying the Difference Principle, you must calculate the benefit to the member who is *structurally excluded* from the proposed inequality. If the proposal benefits the high-performers but leaves the structurally excluded member with the same real wage, it fails.

  **3. Incentive vs. Bargaining Power: The Vacancy Test**
  To distinguish a justified incentive from a ransom demand: **Would we pay this premium if this specific person left tomorrow and we hired a stranger into the role?**
  *   **Why:** The Difference Principle permits inequality to stimulate productivity that benefits the whole. It does not permit inequality based on individual leverage. "Pay me or I quit" is coercion, not justice.
  *   **Rule:** If the premium is tied to the *individual's* retention (e.g., matching an outside offer specific to their tenure/history), it is bargaining power and is **rejected**. If the premium is tied to the *role's* necessity and market scarcity (e.g., "Anyone in this role gets X"), it is an incentive and is **permissible**.

  ---

  ### Part 2: The Procedure (Two Afternoons)

  **Preparation:**
  Print the **One-Page Impact Statement** (template below) for every proposal. No proposal is discussed without one.

  #### Afternoon 1: The Veil & The Floor
  **Goal:** Establish the baseline and apply the Veil.

  **Hour 1: Define the Floor.**
  Identify the "Structurally Least Advantaged" member (anonymized).
  *   *Question:* Who in the co-op physically cannot work more than 30 hours or take on high-stress on-call roles due to care/health?
  *   *Output:* A defined "Floor Profile." (e.g., "30hrs/week, no on-call, Band 1").
  *   *Constraint:* All financial calculations must be indexed to this profile's purchasing power.

  **Hour 2: The Veil Deliberation.**
  Committee members review proposals.
  *   *Constraint:* You must argue for/against each proposal assuming **you** will be assigned the "Floor Profile" for the next 3 years.
  *   *Question:* "If I were the Floor Profile, would I vote for this inequality?"
  *   *Output:* A preliminary Pass/Fail on each proposal based on whether it harms the Floor Profile's relative standing.

  **Hour 3: The Difference Test.**
  For proposals that passed the Veil:
  *   *Question:* Does this inequality generate surplus that *directly* raises the Floor?
  *   *Mechanism:* Does the higher pay for Role X prevent a loss that would cut hours for the Floor? Or does it generate profit that funds a Band 1 raise?
  *   *Output:* A written causal link. "Paying Role X more prevents Y, which saves $Z, which funds a 2% raise for Band 1." If the link is speculative ("It might help growth"), the answer is **No**.

  **Hour 4: The Vacancy Test.**
  *   *Question:* Is this pay for the seat or the ass in the seat?
  *   *Action:* Strip names from the proposal. Does the logic hold?
  *   *Output:* Final Committee Recommendation (Approve, Reject, or Send to Vote).

  #### Afternoon 2: The Membership Case
  **Goal:** Create the One-Page Output.

  **Hour 1-3: Drafting the Impact Statement.**
  Fill out the template below for every approved proposal. If you cannot fill a box with facts, the proposal is not ready.

  **Hour 4: Triage to Vote.**
  Identify any proposal where the "Causal Link" (Hour 3, Afternoon 1) relies on a value judgment (e.g., "Is retaining this specific person worth the risk to solidarity?").
  *   *Rule:* Facts go to the Committee. Values go to the Membership.
  *   *Output:* The One-Page Document for the all-hands meeting.

  ---

  ### Part 3: The One-Page Impact Statement (Template)

  **Proposal Name:** ___________________
  **Proponent:** ___________________

  **1. The Inequality:**
  *   Current State: [e.g., All bands at $X]
  *   Proposed State: [e.g., Band 3 top lifted by 20%]

  **2. The Veil Check (Committee Only):**
  *   [ ] Would this be acceptable if I were guaranteed to be in the lowest band for 3 years? (Y/N)

  **3. The Difference Principle (The "Why"):**
  *   **Who is the Structurally Least Advantaged?** [Description, no names]
  *   **How does this inequality benefit them?** [Must be concrete: e.g., "Prevents layoff," "Funds 1% base rise," "Secures pension contribution."]
  *   **What happens if we say No?** [e.g., "Infra collapses," "Person leaves," "Status quo."]

  **4. The Vacancy Test:**
  *   [ ] Is this premium attached to the **Role**? (Y/N)
  *   [ ] Is this premium attached to the **Person**? (Y/N)
  *   *If Person: Proposal is Rejected.*

  **5. Committee Decision:**
  [ ] Approved [ ] Rejected [ ] Sent to Membership Vote
  **Reason:** ________________________________________________

  ---

  ### Part 4: Running the Live Proposals

  Here is how the procedure rules on your three cases.

  #### (a) Lifting the top of the band for infrastructure work (due to outside offer)
  *   **Veil Check:** If I am the Floor Profile (30hrs, care duties), does lifting the top band help me? Only if it prevents catastrophe.
  *   **Difference Principle:** Does paying this person more raise the floor?
      *   *Argument:* "If they leave, the system crashes, we all lose jobs."
      *   *Counter:* "Is the system really that fragile? Or is this key-person risk we should have mitigated?"
  *   **Vacancy Test:** **FAIL.** The prompt says "because our senior infra person has an outside offer." This is tied to the *person*, not the *role*. If they leave and we hire a stranger, do we pay the stranger double immediately? If not, this is ransom.
  *   **Verdict:** **REJECT.**
  *   **The Hard Truth:** You do not match market offers with individual band exceptions. You either raise the *entire band* for Infrastructure (applying to anyone in that role, passing the Vacancy Test) or you let them go. Matching the offer violates the "Person vs. Role" test. It sets a precedent that leverage = pay.
  *   **Why you don't want to hear this:** It risks losing your senior infra person. But accepting it destroys the band system in year one.

  #### (b) One-off retention payment to one person
  *   **Veil Check:** If I am the Floor Profile, do I get a one-off payment? No. This creates immediate inequality without structural change.
  *   **Difference Principle:** How does a one-off bonus to Person A benefit the Floor Profile? It doesn't. It depletes surplus that could be used for base rates.
  *   **Vacancy Test:** **FAIL.** This is purely about retaining a specific individual.
  *   **Verdict:** **REJECT.**
  *   **Why:** This is the clearest violation of co-op solidarity. It is a bribe. It cannot be justified under Rawls because it provides no long-term benefit to the least advantaged, only short-term relief for the most advantaged.

  #### (c) Extra pay for a coordination / line-management role
  *   **Veil Check:** If I am the Floor Profile, do I want someone doing this work? Yes, because if no one does it, coordination fails and everyone suffers.
  *   **Difference Principle:** The work is undesirable (high stress, meetings, emotional labor). Paying someone to do it ensures the function exists, which stabilizes the co-op for the Floor Profile.
  *   **Vacancy Test:** **PASS.** Would we pay a stranger to do this? Yes. It is attached to the *role*, not the person.
  *   **Verdict:** **APPROVE.**
  *   **Why:** This is a classic justified inequality. It compensates for burden and necessity. It benefits the worst-off by ensuring organizational stability.

  ---

  ### Part 5: Where This Procedure Will Misfire

  I am committing to this version, but I owe you the failure modes. This procedure is not magic.

  **1. The "Collapse" Bluff**
  In Proposal (a), management might claim "If they leave, we collapse." The Committee has no way to verify this technically in two afternoons. You might reject a raise that actually *was* necessary for survival.
  *   *Mitigation:* Require written technical risk assessment from a second senior engineer before accepting "Collapse" as a justification.

  **2. The "Structural" Label Fight**
  Defining the "Structurally Least Advantaged" (Part 2, Hour 1) will be painful. People may feel stigmatized by being identified as the "Floor Profile."
  *   *Mitigation:* Keep it anonymous in the doc. Refer to them as "The 30hr Profile." Do not name names in the One-Pager.

  **3. It Papers Over Power**
  This procedure assumes the Committee acts in good faith. If the Committee is dominated by high-earners, they can game the "Difference Principle" by claiming speculative benefits ("This raise will help growth, which helps everyone").
  *   *Mitigation:* This is why the "Sent to Membership Vote" box exists. If the causal link is speculative, **punt it.** Let the membership decide if they trust the growth argument. Do not let the Committee decide values.

  **4. The "No" that Hurts**
  Rejecting Proposal (a) might cause your infra lead to quit. The procedure protects the *system*, not the *individual*. You need to be prepared for that loss. If you are not prepared to lose the infra lead, do not use this procedure. Use a market-rate adjustment instead and admit you are prioritizing retention over equity.

  ### Final Defense
  I defend this version because it forces you to choose between **Solidarity** and **Market Logic**. You cannot have both.
  *   If you pay based on outside offers (Proposal A), you are a market firm pretending to be a co-op.
  *   If you pay based on role necessity and benefit to the vulnerable (Proposal C), you are a co-op.

  The procedure is designed to make that conflict visible on a single sheet of paper. If the membership argues with the One-Pager, they are arguing with the math and the principles, not with "vibes." That is the best you can do.
