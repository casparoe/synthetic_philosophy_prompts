      *Refining the "Vulnerable Point":* This needs to be something *in* the position, not an external objection. It's the internal weak spot. The definition of the "corrupt institution" is the best candidate.

  7.  **Final Review against constraints:**
      *   Audience: Undergrads + Faculty. (Tone check: rigorous but not overly dense).
