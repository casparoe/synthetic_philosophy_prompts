  3.  **Drafting Objections (Brainstorming & Filtering):**
      *   *Objection 1 (The Walzerian/Standard View):* If soldiers on both sides follow the rules of war (Jus in Bello), they are equal. Why does the cause matter?
      *   *Objection 2 (Epistemic Excuse):* Soldiers can't know if the war is just. They trust the state. You're blaming them for things they can't know.
      *   *Objection 3 (Collective Punishment):* You're blaming all soldiers on one side. That's guilt by association.
      *   *Objection 4 (Symmetry of Corruption):* Democracies lie too. Just wars have propaganda. Why is the corruption unique to the unjust side?
      *   *Objection 5 (Moral Individualism):* How can an *institution's* corruption make an *individual* liable? That violates methodological individualism.

      *Selection for "Likely to Come":*
      1.  Epistemic Excuse (The "Invincible Ignorance" argument). This is the biggest hurdle for revisionism.
      2.  Collective Punishment (The "Guilt by Association" argument). The prompt specifically mentions the audience is concerned about this.
      3.  Symmetry of Propaganda (The "Both Sides Lie" argument). This challenges the structural asymmetry claim.

      *Selection for "Dreaded Objection":*
      *   The prompt asks for the one about "whether epistemic corruption can be attributed without violating moral individualism." This is technically Objection 5 above. It's the deepest philosophical critique. I need to frame this as the one to hope they *don't* ask because it attacks the metaphysical grounding of the argument.

      *Selection for "Most Vulnerable Point":*
      *   Where does the "institutional role" actually bite the individual? The transition from "the institution is corrupt" to "this specific soldier is liable." The *threshold* of corruption.

  4.  **Developing the Content (Iterative Refinement):**

      *   *Tone:* Academic, respectful, precise. High school senior presenting to undergrads/faculty means avoiding condescension but showing rigorous preparation.
      *   *Formatting:* Clear headings, bullet points for quick reading during a Q&A.

      *   *Drafting Objection 1 (Epistemic Excuse):*
          *   Phrasing: "Soldiers aren't policymakers. They can't know the war is unjust."
          *   Strategy: Hold. Distinguish between *blame* and *liability*.
          *   Weakness: Defining the threshold of "reasonable" ignorance.

      *   *Drafting Objection 2 (Collective Punishment):*
          *   Phrasing: "You're making them liable just for wearing the uniform."
          *   Strategy: Hold. It's about the *voluntary participation* in a known (or knowable) corrupt structure, not group identity.
          *   Weakness: Proving the soldier *could* have known.

      *   *Drafting Objection 3 (Symmetry/Propaganda):*
          *   Phrasing: "Just states lie too. Why is the corruption unique?"
          *   Strategy: Concede partially (both lie), Hold on asymmetry (systematic vs. incidental).
          *   Weakness: Empirical claim about the nature of the lies.

      *   *Drafting the "Dreaded Objection" (Moral Individualism):*
          *   This needs to be sharp. "How does a structural property attach to an individual's moral status without reifying the group?"

      *   *Drafting the "Vulnerable Point":*
          *   The definition of "Systematically Deceptive Authority." When does a government cross the line?

  5.  **Refining for the User's Constraints:**
      *   *Constraint Check:* "Phrased as those students and the advisor would phrase them." -> Needs to sound like philosophy majors (using terms like *mens rea*, *epistemic access*, *reductionism*).
      *   *Constraint Check:* "Concise reply suited for a five-minute exchange." -> Keep answers tight, not monologues.
      *   *Constraint Check:* "Weakest link." -> Be honest about where the argument bleeds.
      *   *Constraint Check:* "High school senior." -> Don't overclaim expertise, but show command of the literature (Walzer, McMahan, Lazar, etc.).

