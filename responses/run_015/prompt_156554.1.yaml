      *   **Specific Argument:** Not because just soldiers have special status (standard revisionism), but because *unjust* soldiers occupy a role analogous to agents in a *systematically deceptive authority*. This creates asymmetry in moral liability via an *epistemically corrupted chain of command*. Just soldiers are ordinary agents; unjust soldiers are uniquely liable due to institutional corruption, not collective guilt.
      *   **Deliverables:**
          1.  Likely objections (ordered by probability), phrased as the audience would.
