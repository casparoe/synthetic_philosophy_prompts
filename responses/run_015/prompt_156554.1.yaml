answer: |-
  # Q&A Prep Sheet: Moral Equality of Combatants & Institutional Corruption

  **Presenter:** High School Senior
  **Audience:** Undergrad Ethics/Pol-Phil Majors + Faculty Advisor
  **Context:** Interscholastic Philosophy Symposium
  **Core Thesis:** MEC fails because unjust combatants occupy a role within a *systematically deceptive authority*, creating liability via epistemic corruption, not collective guilt. Just combatants remain ordinary agents.

  ---

  ## Part 1: Likely Objections (Order of Probability)

  ### 1. The "Invincible Ignorance" Objection (Epistemic Excuse)
  **Who asks:** An undergraduate majoring in Political Philosophy.
  **Phrasing:** "You're arguing that unjust combatants are liable because the chain of command is epistemically corrupted. But isn't this demanding too much of the individual soldier? If the state controls the information, the soldier suffers from 'invincible ignorance.' How can they be liable for harming others if they reasonably believe their cause is just?"

  *   **Stance:** **HOLD.** (Do not concede liability is negated by ignorance).
  *   **Concise Reply:** "Distinguish between *blameworthiness* and *liability*. A soldier might not be *blameworthy* (they aren't morally vicious) if they are deceived. However, *liability* to defensive harm tracks the objective threat posed, not just subjective guilt. If I unknowingly carry a bomb, I am still liable to be stopped, even if I'm not blameworthy. My argument is that the institutional corruption removes the *right* to act on that ignorance when the cost is lethal harm to innocents."
  *   **Weakest Link:** This risks sounding too harsh on the individual soldier. If the ignorance is truly *invincible*, standard individualist accounts (like McMahan's) suggest liability diminishes. You must clarify that "systematic deception" implies a *detectable* corruption that the soldier voluntarily participates in, rather than total brainwashing.

  ### 2. The "Guilt by Association" Objection (Collective Punishment)
  **Who asks:** The Faculty Advisor (watching for category errors).
  **Phrasing:** "You ground liability in an 'institutional role.' Doesn't this collapse into collective responsibility? You're making Soldier A liable because of what the State did, not what Soldier A did. This seems to violate methodological individualism."

  *   **Stance:** **HOLD.** (Crucial distinction).
  *   **Concise Reply:** "It's not guilt by association; it's liability via voluntary participation. The soldier isn't liable because the State is corrupt; they are liable because they *voluntarily assumed a role* within that corrupt structure that functions to inflict unjust harm. Think of it like a mafia enforcer: they aren't liable because the Don is guilty, but because they voluntarily became the instrument of the Don's unjust will. The institutional corruption explains *why* the role is dangerous, but the individual's occupancy of that role grounds the liability."
  *   **Weakest Link:** Defining "voluntary." In conscripted armies or economies with no other options, is participation truly voluntary? If you concede conscripts aren't liable, your asymmetry shrinks.

  ### 3. The "Symmetry of Propaganda" Objection
  **Who asks:** An undergraduate Ethics major (sympathetic to Walzer).
  **Phrasing:** "You claim the unjust side has a 'systematically deceptive authority.' But just states use propaganda too. Democracies lie about WMDs or humanitarian motives. If epistemic corruption is present on both sides, doesn't your asymmetry vanish, restoring the Moral Equality of Combatants?"

  *   **Stance:** **CONCEDE (Partially) / HOLD (Core).**
  *   **Concise Reply:** "I concede that just states *can* lie. However, there is a structural difference between *incidental* deception (a lie within a generally truth-tracking system) and *constitutive* deception (a system that requires lies to function). My claim relies on the unjust war being objectively unjust; usually, sustaining an unjust war requires a deeper, systemic corruption of the epistemic chain of command than a just war does. The asymmetry holds if the corruption is necessary for the unjust war, but only contingent for the just war."
  *   **Weakest Link:** This is an empirical claim masquerading as a philosophical one. It is hard to prove in real-time that one side's deception is "constitutive" while the other's is "incidental."

  ---

  ## Part 2: The "Dreaded Objection" (Hope They Don't Ask)

  **The Objection:** "How do you attach a structural property (epistemic corruption) to an individual's moral status without violating Moral Individualism?"
  **Why it's dangerous:** This attacks the metaphysical grounding of your view. If moral status supervenes only on individual actions and intentions, then "institutional roles" are morally inert. If you argue the institution changes the moral status, you risk reifying the group over the individual.
  **Deflection Strategy:** If asked, pivot to **Instrumentalism**. "I am not claiming the institution *magically* changes their soul. I am claiming that by entering the institution, the individual *instrumentalizes* themselves in a way that objectively threatens others. The corruption is the context that makes the instrumentalization unjust."

  ---

  ## Part 3: Your Most Vulnerable Point (Prepare to Defend Openly)

  **The Vulnerability:** **The Threshold of Corruption.**
  **Why:** You argue that unjust combatants are in a "systematically deceptive authority." But where is the line? Is it 51% lies? Is it the *type* of lie? If you cannot define when an authority becomes "corrupt enough" to strip epistemic cover, your criterion for liability is vague.
  **Preparation:** Do not try to hide this vagueness. Own it as a feature of non-ideal theory.
  **Script:** "That is the hardest part of this view. I don't have a mathematical formula for corruption. However, I argue we can identify it negatively: when the authority punishes truth-telling or when the stated *casus belli* is demonstrably false despite internal evidence. I invite the room to challenge where that line is, but the existence of a gray area doesn't negate the clear cases (e.g., aggressive wars of conquest disguised as defense)."

  ---

  ## General Q&A Tips for this Audience
  1.  **Terminology:** Use *Jus ad Bellum* (justice of war) and *Jus in Bello* (justice in war) correctly. They will be listening for this.
  2.  **Walzer vs. McMahan:** Acknowledge Walzer (Equality) is the target, but acknowledge McMahan (Revisionism) is the starting point. You are modifying McMahan.
  3.  **Liability vs. Blame:** Keep this distinction sharp. It is your shield against the "Collective Punishment" charge.
  4.  **Humility:** You are a high school senior. If you don't know an answer, say: "That's a complication I haven't fully resolved in this draft, but my initial thought is..." This gains more respect than bluffing.
