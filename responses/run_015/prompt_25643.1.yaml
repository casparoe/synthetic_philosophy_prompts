answer: |-
  You have not asked a broken question. In fact, you have identified one of the most persistent, frustrating, and philosophically rich tensions in modern biology. Your intuition is spot-on: this is not merely "motivated reasoning" (which is psychological) but a specific *category error* regarding the status of scientific classification.

  Here is the breakdown of the terminology, the philosophy, and how you might use it in your book.

  ### 1. Does it have a name?

  There is no single, canonical Greek/Latin term (like *ad hominem*) that covers this exact rhetorical move across the field. However, there are three overlapping terms used in philosophy of biology and science studies that, when combined, describe exactly what you are seeing.

  **A. Taxonomic Inflation (The Policy Term)**
  This is the closest existing label, coined by Isaac et al. (2004). It specifically refers to the "splitter" side of your example. It describes the phenomenon where the adoption of new species concepts (like the Phylogenetic Species Concept) causes a rapid rise in the number of recognized species, often driven by the desire to secure conservation funding or legal protection (e.g., the Endangered Species Act protects "species," not "subspecies").
  *   **Limitation:** It is usually used pejoratively by "lumpers" against "splitters." It doesn't capture the *lumper's* version of the move (erasing diversity to simplify management or reduce regulatory burden).

  **B. Reification (The Philosophical Term)**
  This is the core philosophical error. To *reify* is to treat an abstract concept or a human construct as if it were a concrete, mind-independent natural thing.
  *   **The Move:** When a biologist says, "These *are* two species," they are making an ontological claim (a claim about reality). When they are actually saying, "It is *useful* to treat these as two species for conservation purposes," they are making a pragmatic claim.
  *   **The Error:** Presenting the pragmatic choice as an ontological discovery. You are correct: they are smuggling an "ought" (we ought to protect this) inside an "is" (this is a distinct species).

  **C. The Value-Ladenness of Classification (The Framework)**
  In philosophy of science (specifically the work of Heather Douglas and others), this is the debate over **Epistemic vs. Non-Epistemic Values**.
  *   **Epistemic Values:** Accuracy, consistency, scope.
  *   **Non-Epistemic Values:** Moral, political, social consequences (e.g., "If we call this one species, it might go extinct").
  *   **The Move:** Biologists often claim their work is "Value-Free" (guided only by epistemic values). Your characters are engaging in **Illegitimate Value Injection**: allowing non-epistemic values to determine the classification while claiming the classification is purely empirical.

  ### 2. Canonical Statements and Key Figures

  If your characters are well-read, they might reference these philosophers who have explicitly called out this dynamic:

  *   **Richard Richards:** In *The Species Problem: A Philosophical Analysis* (2010), Richards argues that species concepts are inherently **pragmatic**. He explicitly states that biologists choose species concepts based on their *goals* (e.g., conservation vs. evolutionary study). When they deny this, they are obscuring the normative basis of their work.
  *   **Marc Ereshefsky:** A leading voice in **Eliminative Pluralism**. He argues that there is no single "species" category in nature, only various lineages and populations. He suggests that pretending there is a single "true" answer is a mistake.
  *   **John Dupré:** In *The Disorder of Things*, he argues against essentialism. He would say your characters are suffering from **Essentialist Intuitions**—the deep-seated human desire to believe nature comes in pre-packaged units.

  ### 3. How it differs from "The Species Problem" and "Motivated Reasoning"

  *   **Vs. The Species Problem:** The "Species Problem" is the technical difficulty of defining species (e.g., hybrids, ring species). Your scenario is different: the evidence is *ambiguous*, and the disagreement is about *how to resolve that ambiguity*. The Species Problem is the puzzle; your scenario is the *politics of solving the puzzle*.
  *   **Vs. Motivated Reasoning:** Motivated reasoning is a cognitive bias ("I believe X because I want X to be true"). What you are describing is **Institutionalized Normativity**. It's not just that they *want* it to be true; it's that the *structure of their field* rewards treating normative choices as empirical facts. It is a systemic feature of taxonomy, not just an individual psychological flaw.

  ### 4. Defining the Boundaries (For your novel)

  To answer your specific boundary questions:

  *   **Does it require both parties?** No. It is most potent when *one* side does it and the other calls them out. However, the "standoff" you described (both sides doing it) is the most realistic depiction of modern systematics. It creates a **Symmetry of Bad Faith**.
  *   **Do epistemic stakes count?** Yes. If a researcher splits a species to publish more papers (career incentive) but claims they did it because of "genetic distinctness," that is the same structural move as doing it for conservation. In philosophy of science, career incentives are often treated as **Contextual Values**.
  *   **Is the framing confused?** No. You have accurately identified the **Is-Ought Gap** in systematics. The only nuance to add is that some philosophers (the Pragmatists) argue that *all* taxonomy is normative. So, the "sin" isn't having values; the sin is *hiding* them.

  ### 5. Suggestions for Terminology in Your Book

  Since there is no single perfect word, you have a few options for how your characters might name this move:

  **Option 1: The Realist Mask**
  A character might say: *"He's wearing the Realist Mask. He's making a policy decision, but he's dressing it up as an ontological discovery."*

  **Option 2: Ontological Smuggling**
  *"That's ontological smuggling. He's trying to sneak a conservation priority across the border inside a Latin binomial."* (This is very close to your own phrasing, which is excellent).

  **Option 3: Strategic Essentialism**
  Borrowed from post-colonial theory (Gayatri Spivak), but sometimes used in biology. It implies adopting a rigid category ("Essentialism") temporarily to achieve a political goal ("Strategic").

  **Option 4: Taxonomic Inflation / Deflation**
  Use the existing terms. A "splitter" accuses a "lumper" of **Taxonomic Deflation** (erasing diversity). A "lumper" accuses a "splitter" of **Taxonomic Inflation** (devaluing the currency of specieshood).

  ### 6. A Note on the "Truth" of the Matter

  For your novel's internal logic, it is helpful to know where the philosophy currently stands. The consensus among philosophers of biology (though not necessarily practicing biologists) is **Pragmatic Pluralism**.

  This view holds that:
  1.  Nature does not come pre-sliced into "species."
  2.  "Species" is a tool we use, like a map.
  3.  Asking "Is this *really* one species or two?" is a bad question.
  4.  The good question is: "Which classification scheme best serves our current purpose (conservation, phylogenetics, ecology)?"

  Your characters are fighting a war over a border that doesn't exist on the ground, only on the map. The tragedy (and drama) is that they must pretend the border is real to win the resources to protect the land.

  ### Summary for your notes:
  *   **Phenomenon:** Masking normative/policy decisions as empirical/ontological discoveries.
  *   **Philosophical Error:** Reification / The Naturalistic Fallacy.
  *   **Policy Term:** Taxonomic Inflation (splitting) / Deflation (lumping).
  *   **Philosophical Stance:** Pragmatic Pluralism (the view that sees through the move).
  *   **Best Description:** "The Value-Ladenness of Taxonomic Delimitation."

  Your framing is not confused; it is arguably more philosophically precise than much of the popular science writing on the subject. You have correctly identified that taxonomy is not just a science of discovery, but a technology of governance.
