prompt: |-
  hey — grading a seminar response on this later and I want to check my own read before I do.

  Setup, in my own words so we're on the same page: you're stranded in the desert, a stranger offers to drive you to town if you promise to pay her $100 once you're there. She's a perfect reader of character and wouldn't have picked you up unless she could tell, reliably, that you'd pay. You get to town. No reputational consequences, no repeat interaction, nothing further hangs on it — paying now is pure cost. Question: is it rational for you, in town, to pay?

  Here's the wrinkle I want to add, because I think people run these two together. Say the trait she reads at the roadside could be one of two quite different things:

  (i) the akratic payer — the trait is something like not fully registering that the situation has changed. You pay because the fact that arriving dissolved your reason doesn't really land. She picked you up because you're the sort of person who doesn't notice.

  (ii) the principled payer — the trait is a disposition to keep your agreements for a non-instrumental reason, and it survives you noticing, perfectly clearly, that every prudential reason to pay is now gone. You pay in full knowledge that it costs you and gets you nothing.

  Is paying rational in each case? And separately: at the roadside, is it rational to want to have the trait — i.e. can it be rational to deliberately build up or preserve a feature of yourself whose whole job is to make you worse at responding to reasons later?

  My credences: 0.6 that paying is rational for (ii), 0.25 for (i). A colleague has 0.35 and 0.3 — basically no gap. So we seem to disagree about the size of the difference between the variants, not about the overall level.

  Give me your two numbers, decomposed: how much rides on whether rationality is assessed for acts rather than policies or dispositions, how much on whether there are non-instrumental reasons to keep an agreement (or reasons to be a certain kind of person) at all, how much on whether it can be rational to make yourself less rational, and how much on whether the question even has a determinate answer. A number and one line of justification per term, then how you combine them. Then: which term are you least confident in, what one consideration would shift you most, and if you had to bet, is my colleague or I the one who's mislocating where the difference between (i) and (ii) lies?

  Put both headline numbers in the first line. Under 450 words total, short lines fine.
