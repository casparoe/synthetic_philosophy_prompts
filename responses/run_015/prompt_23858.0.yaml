      *(Self-Correction during drafting)*: Wait, let me double-check the interaction between Parity and Money Pumps. If $A$ is on a par with $B$, can I be pumped? If I pay to switch from $A$ to $B$, then $B$ to $A$? Parity theorists argue you shouldn't pay to switch if they are on a par. So (1) and (2) are compatible provided the agent recognizes parity blocks the "better than" relation required for the pump. I will note this as a "watch out."

      *(Self-Correction on Time-Slice)*: Time-slice rationality (Hedden/Arntzenius) explicitly argues that diachronic consistency is not a requirement of rationality. This directly attacks the premise of (1) if (1) relies on diachronic coherence (money pumps happen over time). However, (1) says cycles are irrational *period*. If a cycle exists within a time-slice, (4) agrees it's irrational. If the cycle is across time (revealed preference), (4) says that's fine. I need to make sure the user distinguishes synchronic cycles vs diachronic inconsistency. The Money Pump is diachronic. So (1) + (4) is actually quite tense.

      *Revised Ranking:*
