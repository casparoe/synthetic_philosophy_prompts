answer: |-
  Dear colleague, I appreciate you reaching out before you step into the section because you are right to be wary of that friend's objection, even if their conclusion is too dismissive. To answer your primary worry plainly: yes, your framing is technically confused regarding the logical structure of the nonidentity problem, but no, that does not mean the film is useless for your purposes. In fact, understanding exactly where the film diverges from Parfit's logic might be the most valuable thing you can offer your students, provided you are explicit about the divergence. Your friend is correct that the film is person-affecting all the way down because Clarence engineers a counterfactual world where identity is held constant despite the removal of a causal agent. In the universe of It's a Wonderful Life, Mary Hatch exists whether George Bailey exists or not, and Harry Bailey exists only if George exists, but the film treats Harry's death as a tragedy for the same Harry rather than acknowledging that without George, Harry would never have been conceived at all. This is metaphysical magic, not philosophy. Parfit's nonidentity problem arises precisely because we cannot hold identity constant in many real-world choices, such as the policy case you mentioned where a resource depletion strategy changes who meets whom and thus who is born. If you present the film as an illustration of the nonidentity problem itself, you will mislead your students, but if you present it as an illustration of the intuition that the nonidentity problem threatens to dismantle, you have a very powerful hook.

  The emotional force you noticed is exactly the point of contention. The film works because we deeply want the person-affecting view to be true. We want to believe that our existence matters to specific, identifiable other people who would exist anyway. When Clarence shows George Pottersville, he is showing him a world where the same people are worse off, which triggers our moral outrage because we can say George has benefited those specific individuals. Parfit's challenge is to show us cases where we cannot say that, where the choice is between specific people existing with hard lives or different people existing with good lives, or perhaps different people existing with hard lives versus no people at all. Your question about whether the angel's demonstration would work if the world without George were full of entirely different happy people is the perfect discussion starter to bridge the gap. If Clarence showed George a world where he was never born but Mary was happily married to someone else with different children who were all thriving, George's sacrifice would look meaningless from a person-affecting view, yet the world would be better overall. This tension is where you want to land your students. You can use the film to dramatize the comfort of the person-affecting view and then use Parfit to show why that comfort is unavailable in policy decisions involving future generations.

  Regarding your hunch about the value of a life to other people, I think you are onto something that the literature often obscures through abstraction. Parfit's cases are often sterile and focused on welfare levels and identity conditions, whereas the film is about constitutive relationships. George's life is not just valuable because he adds utility to Mary or his mother; his life is valuable because he is woven into the fabric of a community that defines them as much as it defines him. When Mary becomes a librarian in Pottersville, she is not just a worse-off version of the same person; she is a person stripped of the relational context that made her who she was. This touches on a critique of the nonidentity problem that suggests we should care about the quality of relationships and social structures, not just the welfare sums of isolated individuals. While Parfit does discuss impersonal principles, the film offers a visceral depiction of what is lost when a key node in a social network is removed, which might help students grasp why we feel moral obligations to future people even if we cannot identify them specifically. We feel that removing George damages the world, not just because specific people are sadder, but because the community of Bedford Falls is a good thing that is diminished, and perhaps we can argue that preserving valuable social structures is a duty regardless of the identity of the participants.

  For the twenty minutes you have, you need to be surgical with your clips to avoid getting lost in the sentimentality of the narrative. I would suggest starting with the scene on the bridge where George prays to be removed, as this sets up the counterfactual wish clearly. Then move immediately to the montage in Pottersville, specifically focusing on the encounters with his mother and Mary, as these are the clearest examples of the same people being worse off. You should pause there to ask the students whether these comparisons are fair, prompting them to realize the film is cheating on identity. Finally, show the ending where the neighbors return, but frame it not as a resolution to the moral problem but as a reaffirmation of the person-affecting view that they are about to critique with Parfit. If you try to show too much, the narrative will swallow the philosophy, so keep the clips tight and use the silence between them to ask the hard questions about whether Mary would really be the same Mary without George. If you frame it this way, you are not using the film to solve the nonidentity problem but to show why it is so unsettling that we cannot solve it using the tools the film takes for granted.

  You should not worry that your students will feel cheated if you admit the film dodges the hard metaphysical bullet. Second-year students are often relieved to be told that a popular culture text is not a perfect philosophical model because it gives them permission to critique it. You can tell them that Capra made a moral film, not a logical one, and that Parfit's job is to see if the morality holds up when the logic is fixed. This approach honors your instinct that the film has something to say about value while respecting your friend's technical correction about identity. It allows you to validate the emotional resonance of the person-affecting view without committing you to defending it against Parfit's objections. In a way, the film serves as the thesis statement for the intuition that Parfit spends the rest of the course complicating, and there is real pedagogical value in letting students feel the weight of that intuition before you ask them to let it go. So long as you are clear that the film represents the world as we wish it were rather than the world as Parfit shows it to be, you will be on solid ground.

  I hope this helps you feel more confident about the plan. It is a bold choice for a section hook, but if you navigate the distinction between the film's metaphysics and Parfit's logic openly, it could be the thing that makes the reading click for them. The nonidentity problem is dry and counterintuitive, and giving them a concrete image of what is at stake, even if that image is technically flawed, is often worth the cleanup time afterward. Just make sure you do the cleanup. Let me know how the section goes.
