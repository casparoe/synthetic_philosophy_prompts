      *   **Key Tenets of du Châtelet's Philosophy (per the prompt):**
          *   Happiness requires: freedom from prejudice, virtue, good health, tastes/passions, susceptibility to illusions.
          *   Strategy: Replace dangerous passions with calmer tastes.
          *   Illusions: Conserve trustworthy illusions, don't dismantle them.
          *   Love: Never let the heart love someone who brings misfortune (love is passionate/ardent/illusory).
          *   Gambling: A happy resource *only* if moderated and reserved for old age.
          *   Circumstances: Be content with one's state/fortune, don't try to change circumstances (advice for those with settled fortune).
          *   Naturalism: Happiness is entirely in this life (no afterlife, no living on through students/memory).
      *   **Honoree's Retirement Plans:**
          *   Play high-stakes bridge (moderate indulgence, du Châtelet's "old age resource").
          *   Reject the university's "wellbeing dashboard" app (preserves illusions, rejects quantified life).
      *   **Audience:** 50% Philosophers (know du Châtelet), 50% Family/Admin (do not).
      *   **Constraints (What NOT to say):**
          *   No "many more years of passionate research" (passions should be replaced by tastes).
          *   No "follow your passion" into retirement.
          *   No "finally have time to love and be loved" (love is dangerous/misfortune-prone).
          *   No "living on through students" or "watching over the department" (no secularized afterlife/memory survival).
          *   Must not say anything she considers *false*.
      *   **Goal:** Celebrate her, land as affection (not a lecture), 5-minute length.
      *   **Strategy:** Use a specific du Châtelet distinction (Passion vs. Taste, or Trustworthy Illusion vs. Harmful One) to frame the toast.

  2.  **Determine the Core Theme:**

      *   The distinction between *Passion* and *Taste* seems most fertile for a retirement toast. Retirement is often framed as "chasing passions," but for her, it's about cultivating *tastes*.
      *   Alternatively, the distinction between *Trustworthy Illusions* and *Quantified Reality* (the wellbeing dashboard) is very timely and specific to her actions.
      *   *Decision:* Let's weave both, but center on the transition from the *passion* of the career to the *tastes* of retirement, specifically highlighting the bridge playing and the rejection of the app as practical applications of her life's work. The "Trustworthy Illusion" is a strong hook for the "why" we are here celebrating.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mixed audience. Keep it warm. Introduce the advisor's contribution without getting bogged down in jargon immediately.
