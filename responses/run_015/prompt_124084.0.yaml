answer: |-
  Dear Colleague,

  You have put your finger on a quiet violence that occurs in the space between the screen and the memory, and you are right to sense that our existing vocabulary fails to capture its specific geometry. The phenomena you mention, prosthetic memory and the misinformation effect, are indeed neighbours but not siblings. Prosthetic memory describes an acquisition, a feeling of having lived through what one did not, whereas you are describing a substitution, a feeling of knowing who someone was when one does not. The misinformation effect relies on deception or error, yet you note the audience is not deceived; they hold the fact and the fiction simultaneously, yet privilege the fiction. There is no single established term that perfectly carves out this specific territory of knowing acceptance, though it brushes against the philosophical concept of hyperreality, where the map precedes the territory. However, hyperreality usually implies a loss of the distinction between real and fake, whereas your audiences maintain the distinction but disregard it. Since there is no settled name, I propose we call this Narrative Usurpation. It is defined as the displacement of a factual historical record by a fictionalized narrative element, sustained not by error but by the superior cognitive availability and emotional coherence of the fiction, even when the fiction is acknowledged as false.

  The carving of this concept requires us to understand that the audience is not being tricked, but is rather entering into a collusive agreement with the production. The human mind is not an archive; it is a storyteller. When presented with a choice between a bureaucratic truth that is fragmented and hard to visualize, and a invented scene that offers structural clarity and visual immediacy, the mind selects the latter as the functional truth. This is why your corrections fail. You are offering data against an image. In Narrative Usurpation, the image does not claim to be factual; it claims to be essential. When a viewer says, yes, but that is how it really was, they are not making a factual claim but an emotional one. They are saying that the invented scene captures the essence of the person better than the record does. The wrong here is not that the viewer is lied to, but that the complexity of the historical subject is sacrificed for narrative utility, and the fiction becomes the lens through which all future facts are filtered.

  You ask whether you have run three different things together. In terms of mechanism, you have not. The invented rescue, the deathbed reconciliation, and the transmission of self-mythologizing all operate via the same principle of imaginative dominance. However, ethically, they are distinct. When a film invents a scene wholly, it is a pure usurpation. When it transmits a myth the subject created themselves, the film is an amplifier rather than an originator. The effect on the audience is identical—the image dominates—but the moral liability shifts. In the former, the production steals the identity; in the latter, it conspires with the subject to solidify a mask. Regarding composite characters, this is a different phenomenon unless the composite creates a specific false trait. Compression is a necessity of drama; usurpation occurs when the compression alters the moral character of the history. As for medium, this is not exclusive to audiovisual media. A vivid anecdote in a popular history book can perform the same usurpation if it becomes the defining image of a life. The medium matters only insofar as it generates the vividness required to outcompete the record. Film is simply the most efficient engine for this we have devised.

  The ethical core of your worry concerns whether this is misrepresentation or usurpation. Misrepresentation implies a distortion of qualities, whereas usurpation implies a theft of place. When a fictional scene becomes the standard against which a person is judged, the real person has been evicted from their own history. They have been replaced by a symbol that wears their name. This is why it matters even when the image is flattering. A flattering usurpation is still a erasure of complexity. It turns a human being into a monument, denying them the right to be messy, contradictory, or mundane. To be remembered for a courage one did not display is to be denied the truth of one's own life, which may have involved fear or hesitation that is equally human. The wrong is done to the dead, certainly, but it is also done to the living, who are denied the opportunity to learn from the actual textures of the past, receiving instead a polished allegory.

  This definition helps determine what correction is owed. If the problem were mere misinformation, a footnote would suffice. But because the problem is imaginative dominance, the correction must be equally vivid. You cannot fight an image with a memo; you must fight it with a better story. The correction owed is to the audience's imagination, not just their knowledge. However, there is a limit to what is owed. If the usurpation serves a profound structural truth that the facts cannot convey, one might argue the fiction is justified as art, provided it does not claim to be history. But when the fiction is passed off as the functional truth, the debt remains. Ultimately, Narrative Usurpation is the price we pay for making history consumable. Your work is the friction that reminds us there is a cost. You cannot stop the usurpation entirely, for the image will always run faster than the fact, but you can mark the grave where the real person lies beneath the monument, ensuring that those who wish to look down can still see the difference.

  Yours sincerely,

  A Friend to the Record
