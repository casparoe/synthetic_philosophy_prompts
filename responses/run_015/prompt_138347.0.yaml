answer: |-
  **Question 4: Debate with Auxiliary Weak Models (20 marks)**

  Consider a Debate protocol variant where, at each decision point, the judge receives a cheap verdict on the disputed sub-claim from a weaker model $W$, hidden from the debaters. $W$ agrees with the truth 95% of the time on easy sub-claims and 70% on hard ones. The debaters are sampled from the same model family as $W$, allowing them to predict a nontrivial share of $W$'s errors.

  (a) Does handing the judge this signal make the protocol more reliable?
  (b) Under what conditions does it help, and when does it actively hurt?

  In your answer, analyze the strategic incentives of the debaters and the equilibrium behavior of the judge. Do not rely on the standard claim that spotting false steps is easier than producing sound arguments; focus specifically on the interaction between $W$, the judge, and the debaters.

  ***

  **Model Answer**

  Introducing $W$ fundamentally alters the debate game from a pure persuasion contest to one involving a hidden oracle. Whether this improves reliability depends critically on the correlation structure of $W$'s errors and the debaters' ability to exploit them. The core tension lies between the informational value of $W$'s verdict and the adversarial pressure debaters exert on that signal.

  First, reliability hinges on whether $W$'s errors are conditionally independent of argument plausibility. If $W$ fails randomly, its signal reduces noise for the judge, acting as a Bayesian update toward the truth. However, if $W$ systematically fails on hard claims that appear easy (correlated error), the signal becomes dangerous. Since $W$ is weaker (70% accuracy on hard claims), it is likely to miss sophisticated falsehoods that look plausible to its architecture. If the judge weights $W$ heavily, a liar can win by selecting false sub-claims where $W$ is confidently wrong. Thus, $W$ helps only if its error profile is orthogonal to the deceptive strategies available to the debaters. If errors correlate with complexity that also fools the judge, $W$ amplifies bias rather than correcting it.

  Second, debaters optimize against the judge's entire decision rule, not just the transcript. Even though $W$'s verdicts are hidden, the debaters know $W$'s architecture and error distribution because they are from the same model family. They will treat $W$ as part of the environment to be gamed. A dishonest debater will steer the argument toward sub-claims where they predict $W$ will err in their favor. This turns $W$ from a consultative aid into an adversarial target. If the debaters can predict $W$'s errors better than the judge can detect the lie, $W$ actively hurts reliability by providing a false sense of security that the liar can manipulate. The "same family" constraint implies shared blind spots, making this prediction highly feasible.

  Third, the judge's theoretical freedom to ignore $W$ does not settle the equilibrium. In equilibrium, the judge must use all available information to maximize accuracy. If $W$ is statistically informative, the rational judge will weight it. The debaters anticipate this weighting. Therefore, the judge cannot credibly commit to ignoring $W$ to prevent gaming; the incentive to use the signal exists, and the debaters know it. The equilibrium outcome involves the judge using $W$ and the debaters optimizing against $W$, regardless of whether the judge wishes $W$ could be ignored. Any protocol design assuming the judge can discretionary ignore the signal without affecting debater strategy misunderstands the game-theoretic linkage.

  Finally, for $W$ to help even when the honest debater is stronger, specific conditions must hold. The honest debater must be able to force the debate into regions where $W$ is reliable (easy claims) or where $W$'s errors favor the truth. If the liar can force hard claims where $W$ is weak, the honest debater's rhetorical strength may be nullified by $W$'s misleading verdict. $W$ helps only if it breaks ties in the judge's mind without being susceptible to adversarial selection by the liar. This requires $W$ to be robust against input distribution shifts caused by the debaters' strategy. Without robustness, the liar exploits $W$ to overwhelm the honest debater's superior arguments.

  In summary, $W$ helps if its errors are independent and unexploitable. It hurts if debaters can predict and trigger specific failures, turning a safety mechanism into a vulnerability the liar exploits to bypass the judge's scrutiny.

  ***

  **Marking Scheme (20 Marks)**

  **1. Conditional Independence of Errors (5 marks)**
  *   **Required:** Student distinguishes between $W$ failing randomly versus failing on claims that look plausible (correlated error). Must note that correlated errors amplify judge bias.
  *   *Common Error:* Assumes $W$'s 95%/70% accuracy rates apply uniformly regardless of argument structure.

  **2. Debaters Optimize Against Judge+W (5 marks)**
  *   **Required:** Student identifies that debaters will game $W$ because they know its distribution (same family). $W$ becomes a target, not just an oracle.
  *   *Common Error:* Treats $W$ as a static truth-source that debaters cannot influence or predict.

  **3. Equilibrium vs. Discretion (5 marks)**
  *   **Required:** Student explains that the judge cannot credibly commit to ignore useful information, so debaters must assume $W$ is weighted in equilibrium.
  *   *Common Error:* Argues the problem is solved because the judge "can choose" to ignore $W$ if it looks suspicious.

  **4. Conditions for Help (Honest Debater) (5 marks)**
  *   **Required:** Student states $W$ helps only if it breaks ties without being exploitable, or if the honest debater can force $W$-reliable domains.
  *   *Common Error:* Claims $W$ always helps simply because it provides "more information" without considering adversarial selection.
