      *(Refining Concrete/Abstract)*: This is the crux. The friend says states are abstract. Lewis says worlds are concrete. In CS, a "state" is an abstraction of a system configuration. If the system is the universe, the state is an abstraction of the universe. Lewis denies the abstraction. He says the state *is* the concrete universe. This is a disagreement about the *referent* of the model, not the model itself.

  5.  **Finalizing the "Residue Report" Conclusion:**
      *   Are the residues defects in the logic vocabulary? No, the logic vocabulary is designed for *invariance* and *computation*.
      *   Are they signs the metaphysics was doing less work? Some of it is "pseudo-problems" generated by reifying the model. But some of it (like the nature of existence) is outside the scope of formal semantics.
      *   The TA is half-right: The *logic* doesn't distinguish them. The *interpretation* does.

  6.  **Review against Constraints:**
      *   No citations? Check.
      *   Fluent CS terminology? Check (LTS, bisimulation, filtration, domains, etc.).
