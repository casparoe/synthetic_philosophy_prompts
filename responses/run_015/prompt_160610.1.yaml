      *   End with the specific view on residues? Check.

  7.  **Final Polish:** Ensure the tone is analytical and direct, matching the user's sophisticated prompt. (e.g., use terms like "interpretation function," "domain function," "metalanguage ontology").

  *(Self-Correction on Counterpart Theory)*: I need to be precise. In standard QML, $D$ is often constant or varying, but $x$ is the same object. In Counterpart Theory, there is no $x$ across worlds. There is $x$ at $w$ and $y$ at $v$ such that $C(x,y)$. This means the satisfaction clause for $\Diamond \phi(x)$ changes. It becomes $\exists v (Rwv \land \exists y (C(x,y) \land \mathcal{M}, v, y \models \phi))$. This is a semantic change, not just syntactic.

  *(Self-Correction on Filtration)*: Filtration produces a finite model. Lewis claims the plurality is vast (proper class size?). Filtration shows that for any *finite* set of formulas, a finite model suffices. This highlights the gap between *logical possibility* (consistency) and *metaphysical reality* (what actually exists).

