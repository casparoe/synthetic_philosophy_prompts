      *   *Formal/Statistical:* Distinguishability of periodic models from trends/noise. (The "hidden formal question").
      *   *Verbal Dispute:* What counts as a "law"?

  4.  **Evaluate "Settled" vs. "Contested" vs. "Speculation":**
      *   *Settled:* Cliodynamics is controversial among historians; data quality is a known issue; "selecting on the dependent variable" is a standard statistical warning.
      *   *Contested:* Whether the secular cycle is real; whether the US forecast was valid; whether alignment invalidates the model.
