      *   Ensure the distinction between "User's Hypothesis" and "Field Consensus" is clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about aligning on the outcome?
      *   *Correction:* Need to be precise. Aligning on the outcome is standard in survival analysis *if* you have a control group of non-failures. If they only look at breakdowns, it *is* selection bias.
      *   *Check:* Did I address the US forecast?
