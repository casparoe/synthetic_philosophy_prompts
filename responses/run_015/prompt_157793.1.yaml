      *   *Decision:* I will suggest that the lack of a good analogy is a feature of the debate, but offer the **"Master Novelist who refuses to write the characters' lines"** analogy. The novelist knows the characters so intimately (as their creator) that He knows what they *would* do, even though He lets them write their own dialogue.

