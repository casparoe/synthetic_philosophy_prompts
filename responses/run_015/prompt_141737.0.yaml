answer: |-
  ### 1. Verdict on Your Framing
  **Keep the compositionality framing, but tighten the analogy.**
  The "effect vs. value" (or `void` vs. `return`) analogy is the strongest hook you have for this audience. It maps directly to the semantic issue: logical operators (like `if`, `!`, `&&`) require operands of a specific type (propositions/booleans). If moral sentences are "effects" (expressions of attitude), they are type-incompatible with logical operators.

  **The Risk:** Software engineers fix type errors by casting or overloading. If you present this purely as a type mismatch, they will solve it in five minutes ("Just define `Wrong` as a boolean that *triggers* an effect"). You must emphasize that for the *pure* expressivist, the "return value" **does not exist**. It is not `null`; it is undefined. If you assign it a truth value, you have ceased to be an expressivist and become a realist. The philosophical crisis is that the grammar *looks* like it returns a value, but the semantics *say* it doesn't.

  **Correction:** Do not use the word "effect." It implies psychological causality. Use **"Speech Act Type"** mapped to **"Return Type."**
  *   Assertion of fact = `bool`
  *   Assertion of moral = `void` (or `Attitude`)
  *   Logical operators = Functions expecting `bool`

  ### 2. Session Order & Dependencies
  **Do not state the requirement (Univocality) up front.**
  If you start with "Meaning must be constant across contexts," it sounds like an arbitrary rule of philosophy. They will accept it blandly and miss the force of the problem.
  **Order:**
  1.  **The Expressivist Claim:** Moral sentences express attitudes, not beliefs. (5 mins)
  2.  **The Unembedded Case:** How "Lying is wrong" works in isolation. (10 mins)
  3.  **The Embedded Case:** Put the *exact same string* into a conditional. (15 mins)
  4.  **The Inference (The Crash):** Run Modus Ponens. Show the logic breaks. (20 mins)
  5.  **The Diagnosis:** Introduce Compositionality/Univocality as the *only* way to save the logic. (20 mins)
  6.  **False Fixes:** Address misconceptions here. (15 mins)
  7.  **Closing:** Question & Refusal. (5 mins)

  **Negation vs. Embedding:**
  **Embedding (Conditionals) must precede Negation.**
  Negation is too easily confused with "disagreeing" or "expressing a contrary attitude." SEs will model `!Wrong` as "I disapprove of your disapproval." Conditionals (`If P then Q`) clearly separate the *content* of P from the *assertion* of P. In a conditional, P is not asserted at all. This makes the "missing value" problem stark. Use negation only as a secondary example of the same type error once the conditional has landed.

  ### 3. The One Example
  **Example:** "Lying is wrong."
  **Argument:**
  1.  Lying is wrong.
  2.  If lying is wrong, then getting your brother to lie is wrong.
  3.  Therefore, getting your brother to lie is wrong.

  **Why this fits your constraints:**
  *   **Blocks the "Report" Escape:** In premise (2), the speaker is *not* expressing an attitude toward lying. They are stating a relationship between two concepts. If the expressivist says (2) expresses an attitude, they must say the speaker is currently disapproving of lying *while merely hypothesizing*. That feels wrong. If they say (2) does *not* express an attitude, then the word "wrong" in (2) means something different than in (1).
  *   **Reuse:**
      *   **Phase 1:** Analyze (1) as `express_disapproval(lying)`.
      *   **Phase 2:** Analyze (2). What is `express_disapproval(lying)` doing inside the `if`? It's not being executed. It's being passed as an argument.
      *   **Phase 3:** Show the inference fails if (1) is `void` and (2) expects `bool`.

  **What it must lack:**
  *   Do not use indexicals ("I disapprove").
  *   Do not use emotionally charged examples (abortion, killing) that trigger real moral engagement. Keep it dry (lying, stealing) so they focus on the structure.

  ### 4. Misconceptions (Order & Corrections)
  *Expect these in this order. Your code analogy will cause some of them.*

  **1. "Expressivism means moral sentences are meaningless/noise." (Early)**
  *   **When:** During Phase 1 (The Expressivist Claim).
  *   **Source:** General philosophy pop-culture.
  *   **Correction:** "No, they have meaning. They just have a different *semantic type*. They aren't `null`; they are `void`. They do something rather than describe something."

  **2. "The problem is just that moral claims can't be True." (Middle)**
  *   **When:** During Phase 4 (The Crash).
  *   **Source:** Traditional metaethics framing.
  *   **Correction:** Pivot back to your frame. "Forget truth for a second. Think about *validity*. If I pass a `void` function into an `if` statement, the code doesn't run. The argument becomes invalid, not just 'untrue'."

  **3. "Handling negation settles embedding." (Middle-Late)**
  *   **When:** When you mention other contexts.
  *   **Source:** Code analogy (operators are easy to overload).
  *   **Correction:** "Negation is just one operator. The problem is *any* context that consumes a proposition without asserting it (questions, modals, conditionals). Fixing `!` doesn't fix `if`."

  **4. "The fix is to let moral clauses express attitudes AND be true." (Late)**
  *   **When:** Phase 6 (False Fixes).
  *   **Source:** **Caused by the code analogy.** SEs will want to make a struct that holds both a boolean and a callback. "Just make it a hybrid type."
  *   **Correction:** This is the most critical point. "If you give it a truth value, you are no longer an expressivist. You have surrendered to Realism. The Frege-Geach problem is a problem *for Expressivism*. If the solution is 'stop being an expressivist,' you haven't solved the problem; you've dissolved the theory."

  ### 5. The Step Most Likely to Fail
  **The Transition from "Type Error" to "Philosophical Crisis."**
  *   **The Failure:** The room will agree that `if (void)` is a type error. They will then ask, "So why don't we just define moral sentences as returning booleans?" They will treat Expressivism as a bad API design rather than a substantive claim about the nature of moral judgment.
  *   **The Fallback:** You must hammer the **Motivation for Expressivism**. Why did we start here? Because moral judgments *move us to act* in a way facts do not. If you make them `bools`, you lose the explanation for why morality motivates.
  *   **Script:** "You can fix the type error by making it a Realist theory. But then you lose the expressivist's explanation for why morality motivates action. The Frege-Geach problem traps you: keep the motivation (Expressivism) and break the logic, or keep the logic (Realism) and lose the motivation. A 'hybrid' just claims both without explaining how they bind."

  ### 6. Closing Question & Refusal
  **The Question (Last 10 mins):**
  Don't ask "What is the problem?" Ask about the cost of the solution.
  *"If we solve this by saying 'wrong' always refers to a property (Realism), what do we lose that Expressivism gave us? If we solve it by saying 'wrong' changes meaning in conditionals, what happens to the validity of the argument?"*
  *   **Success Criteria:** They realize that saving the logic requires sacrificing the expressivist account of motivation, or saving the theory requires sacrificing logical validity. They see the *dilemma*, not just the definition.

  **The Refusal:**
  **Do not discuss specific solutions (Quasi-Realism, Bilateralism, Ecumenical Expressivism).**
  *   **Statement:** "I am not going to tell you how Blackburn, Gibbard, or Schroeder solve this. That requires a separate course on meta-ethical semantics. Today is about seeing why the problem is hard, not how people tried to patch it. If you leave thinking 'Expressivism is broken,' that's fine. If you leave thinking 'Logic is harder than it looks,' that's better."

  ### 7. Summary Checklist for You
  1.  **Frame:** Type Mismatch (`void` vs `bool`), not Truth.
  2.  **Example:** Lying/Brother Modus Ponens. Reuse strictly.
  3.  **Sequence:** Problem -> Crash -> Requirement (Univocality) -> False Fixes.
  4.  **Watch out:** SEs trying to "refactor" the theory instead of seeing the philosophical trap.
  5.  **Blunt Truth:** Your framing is good, but if you let them treat it as a syntax error, you lose. It must be a *semantic* identity crisis.
