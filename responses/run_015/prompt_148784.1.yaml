      Tolstoy had written that art is the infection of another with a feeling experienced by the artist. In this city, infection was a crime. Sincerity required chemical novelty; if the State hadn't synthesized it, it wasn't safe to feel. Lira believed the opposite. If a pill could induce it, it was merely physiology. True art was the transmission of the unmanufactured soul.

      The concert hall was sterile white. The audience sat in rows, silver collars glinting at their throats. Bio-monitors. They were designed to neutralize unlisted emotional signatures, flooding the wearer with calming agents if their heart rate or neuro-chemistry deviated from the Catalog. They were immune systems for the mind.

      Lira raised her baton. The orchestra consisted of modified instruments, tuned to frequencies that bypassed the ear and vibrated the bone. She didn't play for their ears; she played for their memory centers.

