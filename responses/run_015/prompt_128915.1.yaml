prompt: |-
  As a novelist constructing a counterfactual narrative in which a single missed dispatch alters the succession of an empire, I require a conceptual framework sharper than folklore. Draft the joint statement of an adversarial collaboration between two camps: the micro-contingency theorists, who hold that historical dynamics are chaotically sensitive to minute perturbations and that counterfactual reasoning about small causes can legitimately overturn macro-outcomes; and the structural-attractor theorists, who hold that institutional and material constraints generate robust attractor states, rendering apparent turning points epiphenomenal and counterfactual perturbation causally illegitimate unless "the same mechanism" of change is preserved across worlds. The response should begin with the joint statement itself—its bottom line in the very first sentence, with no preface, no commentary, and no restatement of this prompt—then continue with the document. Include: (1) a numbered section of agreed claims covering what chaos and contingency entail, the boundary between narrative coherence and causal efficacy, and the conditions under which a counterfactual history remains the same causal mechanism rather than a different ontology; (2) precisely worded disagreements, each formulated so its own side accepts it, especially on whether robustness to perturbation is an objective feature of historical dynamics or an artifact of descriptive framing; (3) the cruxes that would actually move at least one party; (4) for each crux, a concrete historical counterfactual scenario both sides accept as a legitimate test case, with each side's predicted assessment recorded in advance; and (5) a disagreements table summarizing the residual divergence. Do not request or include bibliographies, citations, or appeals to authority; the argument must stand entirely on its conceptual structure.
