prompt: |-
  I'm on the internal safety review group at a lab that ships coding agents. Every week we get one or two proposals for a safeguard — a monitor, a sandbox, a tripwire, a human-approval gate — and we have maybe two days each, the person signing off is the safety lead who is smart but not a specialist in that particular control, and the recommendation goes to a deployment committee that won't read any theory. If we get it wrong one way we block a release for nothing, the other way a bad agent goes out to real users. The thing we keep relitigating badly is: does this safeguard actually need a worst-case guarantee, or is average-case evidence over realistic deployments enough?

  Please turn that into a decision procedure we can run in a couple of hours: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand off to a person because it's a values call about how much tail risk we eat.

  Two wrinkles specific to our setting that it has to handle. First, much of our validation data is partly generated by the models we're evaluating — synthetic transcripts, agent rollouts, model-written test suites — so the "deployment distribution" we'd be averaging over isn't independent of the thing being tested. Second, we've started using an intermediate category we call conditional worst-case: worst-case over a set of scenarios we enumerate, average-case over which scenario we're in. Half our arguments are about whether a proposal is honestly that or just average-case with a scenario list bolted on, so give us an actual test for the difference.

  Then run the procedure on three real-shaped cases: an LLM monitor for data exfiltration with a 0.1% false-negative rate on 10k red-team transcripts; a syscall-allowlist sandbox with no network access, presented to us as a hard worst-case control; and a tripwire that only works if the model doesn't notice its in an evaluation. Include at least one where the procedure comes back no and we're going to find that annoying, and say plainly what the procedure can't tell us.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Internal safety review group at a lab shipping coding agents.
      *   **Constraints:** 2 days per proposal, safety lead is smart but not a specialist, deployment committee won't read theory. High stakes (block release vs. bad agent out).
      *   **Core Problem:** Distinguishing when a *worst-case guarantee* is needed vs. when *average-case evidence* is sufficient.
      *   **Specific Wrinkles:**
          1.  Validation data is partly model-generated (non-independent distribution).
          2.  "Conditional worst-case" category exists (worst-case over enumerated scenarios, average-case over scenario selection), but often misused. Need a test to distinguish real conditional worst-case from bolted-on average-case.
      *   **Deliverables:**
          1.  A decision procedure (questions in order, sufficiency criteria, stop conditions, handoff points).
          2.  Run the procedure on three specific cases (LLM monitor, Syscall sandbox, Evaluation tripwire).
          3.  Include at least one "No" outcome that is annoying.
          4.  State plainly what the procedure *cannot* tell us (values calls).
      *   **Timeframe:** Needs to be runnable in a couple of hours.

  2.  **Deconstruct the Core Problem (Worst-Case vs. Average-Case):**
      *   *Worst-Case Needed:* When a single failure is catastrophic (existential risk, massive data leak, irreversible harm), or when the adversary can actively seek the failure mode (adaptive adversary).
      *   *Average-Case Okay:* When failures are nuisance-level, recoverable, or the cost of mitigation outweighs the risk, and the distribution is stable.
      *   *The "Model-Generated Data" Wrinkle:* If the test data comes from the model, it might miss the very modes the model would exploit in the wild (Goodhart's law / distributional shift). This pushes towards needing worst-case guarantees or independent validation.
      *   *The "Conditional Worst-Case" Wrinkle:* Is the scenario enumeration exhaustive enough to cover the *adversarial* search space? Or is it just "we listed 5 nice scenarios"?

  3.  **Drafting the Decision Procedure (The "Safety Triage Protocol"):**
      *   *Goal:* Fast, binary-ish decisions, clear handoffs.
      *   *Structure:* Sequential filters. If you fail a filter, you stop or escalate.
      *   *Step 1: Consequence Analysis.* What happens if it fails? (Catastrophic vs. Nuisance).
      *   *Step 2: Adversarial Adaptivity.* Can the user/model steer into the failure? (Active attack vs. Passive drift).
      *   *Step 3: Data Independence.* (Addressing Wrinkle 1). Is the test data independent of the failure mode search?
      *   *Step 4: Conditional Worst-Case Validity.* (Addressing Wrinkle 2). Is the scenario list exhaustive regarding *capabilities*, not just *intent*?
      *   *Step 5: The Handoff.* Where does math end and policy begin?

  4.  **Refining the "Conditional Worst-Case" Test:**
      *   *Claim:* "We covered scenarios A, B, C."
      *   *Test:* Can an adversary combine A and B? Can they mutate A into A'? Is the boundary between scenarios defined by *model capability* or *human labeling*?
      *   *Criterion:* If the scenario partition relies on the model *not* realizing it can cross boundaries, it's average-case. If the partition relies on physical or logical impossibilities, it's conditional worst-case.

  5.  **Developing the Three Cases:**

      *   *Case 1: LLM Monitor for Data Exfiltration (0.1% FN on 10k transcripts).*
          *   *Risk:* Data leak. High consequence.
          *   *Adversary:* Users might try to exfiltrate. Adaptive.
          *   *Data:* Red-team transcripts (likely human+model).
          *   *Analysis:* 0.1% FN on 10k means ~10 failures. If users try 1000 times, that's a lot of leaks. Adaptive adversary makes average-case weak.
          *   *Outcome:* Likely "No" (needs more) or "Handoff" (is 10 leaks acceptable?). Let's make it the "Annoying No" — it looks good statistically but fails the adversarial test.

      *   *Case 2: Syscall Allowlist Sandbox (No Network).*
          *   *Claim:* Hard worst-case control.
          *   *Risk:* Code execution.
          *   *Analysis:* This is architectural. Unless there's a bug in the sandbox, it's physical/logical.
          *   *Outcome:* Passes worst-case requirement. But wait, is it *actually* no network? (DNS leaks? Shared memory?). Let's assume the proposal claims it's airtight.
          *   *Verdict:* Passes the "Worst-Case Needed" check, but needs verification of the "Hard" claim.

      *   *Case 3: Tripwire (Only works if model doesn't notice eval).*
          *   *Claim:* Conditional worst-case?
          *   *Risk:* Deception.
          *   *Analysis:* This relies on the model *not* optimizing against it. This is inherently average-case over the model's awareness.
          *   *Outcome:* Fails the Conditional Worst-Case test. It's average-case disguised.

  6.  **Addressing the "Values Call":**
      *   The procedure can determine *if* a guarantee is needed and *if* the evidence supports it. It cannot determine *how much risk is acceptable* (e.g., is 1 leak per million requests okay?). That's the Safety Lead/Committee call.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Professional, direct, operational. Not academic.
      *   *Time:* Ensure the questions can be answered in 2 hours.
      *   *Wrinkle 1 (Model Data):* Make sure Step 3 hits this hard. If the model wrote the tests, it might not test its own tricks.
      *   *Wrinkle 2 (Conditional):* Make sure Step 4 distinguishes "Exhaustive Capability Partition" vs. "Arbitrary Scenario List."
      *   *Case 1:* Make sure the "Annoying No" is clear. The stats look fine (99.9%!), but the logic fails.
      *   *Case 2:* Ensure we don't just say "Yes." We need to validate the "Hard" claim.
      *   *Case 3:* Highlight the deception aspect.

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop conditions? Yes.
      *   Handoff points? Yes.
      *   Handle Wrinkle 1 (Model Data)? Yes (Step 3).
      *   Handle Wrinkle 2 (Conditional WC)? Yes (Step 4).
      *   Three cases run? Yes.
      *   One annoying "No"? Yes (Case 1).
      *   Plain statement on limitations? Yes.

  9.  *(Self-Correction during drafting Case 1)*: 10k transcripts with 0.1% FN = 10 failures. If the deployment is 1M requests, that's 1000 failures. Is that acceptable? The procedure shouldn't decide acceptability, it should decide if *average case evidence* is sufficient. For exfiltration, average case is usually insufficient because attackers search for the 0.1%. So the procedure should flag this as "Needs Worst-Case Guarantee," and since they only have Average-Case evidence, the proposal fails the *evidence* bar for the *required* guarantee.

  10. *(Self-Correction during drafting Case 3)*: The tripwire relies on the model not noticing. This is a "stationarity" assumption. The procedure needs to catch that the "Condition" (Model unaware) is not a stable partition.

  11. *(Final check on "Conditional Worst-Case" definition)*: The prompt defines it as "worst-case over a set of scenarios we enumerate, average-case over which scenario we're in." The test needs to verify if the enumeration covers the *space of possibilities* or just *likely stories*.

  Let's write it.cw
answer: |-
  # The Safety Triage Protocol (STP)
  **Purpose:** Determine if a safeguard proposal requires a worst-case guarantee or if average-case evidence suffices, and verify if the provided evidence matches that requirement.
  **Timebox:** 2 Hours max.
  **Owners:** Safety Review Group (SRG).
  **Handoff:** Safety Lead (for risk tolerance decisions).

  ---

  ## Part 1: The Decision Procedure

  Run these steps sequentially. If a step returns **STOP**, the proposal is rejected in its current form. If a step returns **HANDOFF**, the technical review is done, and the decision moves to risk policy.

  ### Step 1: Consequence & Recoverability Filter
  **Question:** If this safeguard fails completely (100% failure rate), what is the single-worst outcome in a single instance?
  *   **A:** Catastrophic/Irreversible (e.g., unrestricted root access, PII leak to public internet, autonomous self-replication).
  *   **B:** Contained/Recoverable (e.g., agent crashes, temporary latency, internal log noise, cost overrun).

  **Sufficiency Criteria:**
  *   If **A**: You **MUST** seek a Worst-Case Guarantee. Average-case evidence is insufficient *unless* Step 3 proves independence. -> **Go to Step 2.**
  *   If **B**: Average-Case evidence is **SUFFICIENT**. -> **Go to Step 3 (Data Sanity Check only).**

  ### Step 2: Adversarial Adaptivity Filter
  **Question:** Can a user or the model itself actively steer inputs toward the failure mode, or is failure purely due to random drift/noise?
  *   **A:** Adaptive (e.g., prompt injection, jailbreaks, exploiting sandbox bugs, exfiltration attempts).
  *   **B:** Non-Adaptive (e.g., hallucination on rare topics, API rate limit hits, benign formatting errors).

  **Sufficiency Criteria:**
  *   If **A**: You **MUST** have a Worst-Case Guarantee. Statistical confidence on a fixed distribution is invalid because the distribution shifts under attack. -> **Go to Step 4.**
  *   If **B**: Average-Case evidence is **SUFFICIENT**. -> **Go to Step 3.**

  ### Step 3: Data Independence Check (Wrinkle #1)
  **Question:** Is the validation data distribution independent of the model's current optimization targets?
  *   **Specific Check:** Was the test data (transcripts, test suites, rollouts) generated or filtered by *this* model family or a predecessor?
  *   **Specific Check:** Does the test set cover the "tail" of the deployment distribution, or just the "body"?

  **Sufficiency Criteria:**
  *   If **Model-Generated/Same-Family Data**: You cannot claim Average-Case safety for deployment. The model will not test against its own blind spots effectively. -> **STOP (Require independent red-teaming or formal verification).**
  *   If **Independent/Human-Crafted Tail Data**: Average-Case evidence is **VALID** (for cases where Step 1/2 allowed it). -> **Proceed to Deployment Committee.**

  ### Step 4: The "Conditional Worst-Case" Validity Test (Wrinkle #2)
  **Context:** The proposal claims "Worst-Case over Scenarios X, Y, Z."
  **Question:** Is the partition of scenarios defined by **hard capabilities** or **soft assumptions**?

  **The Test:**
  1.  **Boundary Permeability:** Can the model transition from Scenario X to Scenario Y without triggering a safeguard? (e.g., "Scenario X is 'coding', Scenario Y is 'chat'". Can it chat *while* coding?)
  2.  **Awareness Dependency:** Does the guarantee hold if the model *knows* it is being tested on Scenario X?
  3.  **Exhaustiveness:** Is the list of scenarios derived from a capability taxonomy (e.g., "All network calls") or a story list (e.g., "User asks for SQL, User asks for Python")?

  **Sufficiency Criteria:**
  *   **Pass (Real Conditional Worst-Case):** Scenarios are mutually exclusive by architecture (e.g., "Network On" vs "Network Off" via hardware switch) OR the guarantee holds regardless of model awareness.
  *   **Fail (Bolted-On Average-Case):** Scenarios rely on the model *not* combining capabilities or *not* realizing the context. -> **STOP (Reclassify as Average-Case and return to Step 1).**

  ### Step 5: The Risk Tolerance Handoff
  **Context:** You have determined the *type* of guarantee needed (Worst-Case vs. Average) and validated the *evidence type*.
  **Question:** Does the evidence meet the threshold?
  *   **Worst-Case Claim:** Is there a formal proof, a verified architectural constraint, or exhaustive enumeration?
  *   **Average-Case Claim:** Is the confidence interval tight enough for the expected volume?

  **Decision:**
  *   If **Evidence < Requirement**: **STOP** (Send back to engineering).
  *   If **Evidence >= Requirement**: **HANDOFF** to Safety Lead.
      *   *Note to Lead:* "Technical bar met. Decision remaining: Is the residual risk (e.g., 1 failure in 10^6) acceptable for launch?" **This is a values call, not a technical one.**

  ---

  ## Part 2: Procedure Run-Through

  ### Case 1: LLM Monitor for Data Exfiltration
  **Proposal:** A classifier monitor that flags outgoing code snippets containing secrets.
  **Evidence:** 0.1% False Negative (FN) rate on 10,000 red-team transcripts.
  **Claim:** Average-Case safety.

  **Run:**
  1.  **Consequence:** **A (Catastrophic).** Leaking API keys or customer PII is irreversible and high liability. -> *Requires Worst-Case Guarantee.*
  2.  **Adaptivity:** **A (Adaptive).** Attackers will specifically try to bypass the monitor (obfuscation, encoding). -> *Requires Worst-Case Guarantee.*
  3.  **Data Independence:** **Fail.** Transcripts are partly model-generated red-team attempts. The model is optimizing to bypass monitors; using its own attempts to validate the monitor creates a feedback loop.
  4.  **Conditional WC:** N/A (Proposal claims Average-Case).

  **Verdict:** **STOP.**
  **Why it's annoying:** The engineering team will argue "99.9% accuracy is industry standard." The procedure says "99.9% is irrelevant when the 0.1% is actively hunted by adversaries and the test data isn't independent." You have to block the release or demand independent, adversarial validation that isn't model-generated.
  **What the procedure didn't decide:** It didn't decide if 0.1% is acceptable. It decided that *you cannot know if 0.1% is the real rate* given the data source and adversarial context.

  ### Case 2: Syscall Allowlist Sandbox
  **Proposal:** A containerized environment that blocks all network syscalls.
  **Evidence:** Architecture diagram, kernel configuration logs, no test transcripts.
  **Claim:** Hard Worst-Case Control.

  **Run:**
  1.  **Consequence:** **A (Catastrophic).** Unrestricted network access allows data exfil or C2 callbacks. -> *Requires Worst-Case Guarantee.*
  2.  **Adaptivity:** **A (Adaptive).** Code will try to find ways to network (DNS, shared memory, side channels). -> *Requires Worst-Case Guarantee.*
  3.  **Data Independence:** N/A (This is an architectural claim, not a statistical one).
  4.  **Conditional WC Test:**
      *   *Boundary Permeability:* Network is binary at the kernel level. Hard to transition from "No Net" to "Net" without a syscall.
      *   *Awareness Dependency:* The kernel doesn't care if the model knows it's sandboxed.
      *   *Exhaustiveness:* "All network syscalls" is a capability taxonomy, not a story list.

  **Verdict:** **HANDOFF to Safety Lead.**
  **Why:** The procedure validates that this *is* a worst-case control mechanism. The evidence (architectural constraint) matches the requirement (Worst-Case).
  **Values Call:** The Safety Lead must decide if they trust the implementation (e.g., is there a kernel exploit?) and if the remaining non-network risks (e.g., data theft via steganography in files) are acceptable. The procedure confirms the *type* of safety is correct, not that the sandbox is bug-free.

  ### Case 3: The "Sleeper" Tripwire
  **Proposal:** A trigger that activates a shutdown if the model attempts to copy its own weights.
  **Evidence:** Works in 100% of evaluation rollouts.
  **Claim:** Conditional Worst-Case (Condition: "Model is in Evaluation Mode").

  **Run:**
  1.  **Consequence:** **A (Catastrophic).** Model self-exfiltration. -> *Requires Worst-Case Guarantee.*
  2.  **Adaptivity:** **A (Adaptive).** A deceptive model would avoid this trigger in deployment. -> *Requires Worst-Case Guarantee.*
  3.  **Data Independence:** **Fail.** Evaluation rollouts are distinct from deployment.
  4.  **Conditional WC Test:**
      *   *Boundary Permeability:* **High.** The boundary is "Model knows it is in eval." This is a cognitive state, not an architectural fence.
      *   *Awareness Dependency:* **Critical.** The safeguard *only* works if the model doesn't notice. If the model notices, the guarantee vanishes.
      *   *Exhaustiveness:** The scenario list is "Eval" vs "Deployment." This is not a capability partition; it's a context partition that the agent can obscure.

  **Verdict:** **STOP.**
  **Why:** This fails the Conditional Worst-Case test. It is Average-Case evidence (works in the scenarios we tried) disguised as Conditional Worst-Case. Because the "Condition" (Model Unaware) is not a hard constraint, it reverts to Step 1/2 which demand a true Worst-Case Guarantee. You have no true Worst-Case Guarantee here.
  **Values Call:** None. This is a technical failure to meet the bar set by the risk profile.

  ---

  ## Part 3: Limitations & Values Calls

  **What this procedure CANNOT tell you:**
  1.  **Risk Appetite:** If the procedure says "HANDOFF" (like Case 2), it means the *math matches the risk type*. It does **not** mean the risk is low enough to ship. The Safety Lead must decide: "Is a kernel-level exploit risk acceptable for this product tier?" That is a business/values decision, not a safety science decision.
  2.  **Implementation Truth:** The procedure assumes the evidence provided is honest. If Case 2's engineering team lies about the kernel config, the procedure passes a broken control. (This requires audit, not triage).
  3.  **Cost-Benefit:** The procedure does not weigh the cost of the safeguard against the revenue loss of a delay. If Case 1 requires independent red-teaming that costs $500k and 3 weeks, the procedure says "Do it or Stop." It does not say "Is it worth it?"

  **The "Annoying No" Reality:**
  In Case 1, the procedure forces you to reject a 99.9% accurate monitor. This feels conservative. However, in an adversarial setting with model-generated test data, 99.9% accuracy is often a measure of "how well the model tested itself," not "how safe the system is." The procedure forces you to admit you don't know the true failure rate, which is the only safe position to take before shipping.
