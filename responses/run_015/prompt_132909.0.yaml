answer: |-
  This is a sophisticated ethical framework your colleague has assembled. It borrows from Epicurean metaphysics (regarding sentience), narrative ethics (regarding identity), and social epistemology (regarding memory). It is internally consistent, but as you suspect, it relies on several contentious definitions to bridge the gap between "the dead feel nothing" and "you must not fictionalize them."

  Here is an audit of the argument, broken down by its component claims, distinguishing between philosophically robust points and significant overstatements or conflations.

  ### 1. The Sentience Premise
  **Claim:** *Since the dead lack sentience, they cannot suffer harm in any morally weighty sense; therefore, we hold no direct duties of welfare towards them.*

  *   **What a careful defender would accept:** This is the classic Epicurean position. If harm requires a subject to experience pain, loss, or distress, the dead cannot be harmed. There is no "ghost in the machine" to suffer indignity.
  *   **The Distortion/Conflation:** This conflates *experiential harm* with *interest-based harm*. Most contemporary ethical systems (and legal frameworks regarding wills, reputations, and promises) recognize that persons have interests that survive death. Joel Feinberg's "Interest Theory" argues that we can violate a person's antecedent interests (e.g., the desire to be remembered accurately, the wish for their family to be provided for) even if they do not experience the violation.
  *   **Audit:** The claim is **plausible but reductive**. It dismisses the widely accepted notion that we have duties to the dead based on the *wishes they held while alive*, not their current capacity to suffer. By ruling out posthumous harm entirely, your colleague bypasses a major branch of moral philosophy to clear the ground for her specific "mnemonic" argument.

  ### 2. Mnemonic Stewardship
  **Claim:** *We are bound by a fiduciary obligation to preserve the structural coherence of a subject's self-interpretation within collective memory.*

  *   **What a careful defender would accept:** There is a genuine ethical value in truthfulness and respecting the agency of the subject. Deliberately distorting a public figure's life to serve a political or commercial agenda can be seen as a form of disrespect to their memory and a disservice to the public.
  *   **The Distortion/Conflation:** This is the weakest link in the chain, containing three specific problems:
      1.  **The Fiduciary Error:** A fiduciary duty implies a legal or contractual relationship of trust (like lawyer-client). No such relationship exists between a novelist and a deceased subject. This metaphor inflates a general moral duty of *respect* into a specific duty of *agency*.
      2.  **The "Self-Interpretation" Fallacy:** This assumes the subject possessed a single, coherent "structural" understanding of their own life. Psychological and biographical realism suggests people are often self-deceived, contradictory, or evolving. Privileging the subject's *own* interpretation over an external observer's can actually be *less* truthful. (e.g., A subject may claim they acted out of love, while evidence suggests jealousy; a novelist might have a duty to the *truth*, not the subject's *self-mythology*).
      3.  **Narrative Identity:** Philosophers like Paul Ricoeur argue that identity is *formed* through narrative, not just preserved. By freezing the subject's self-interpretation as the only valid one, this view denies the communal nature of meaning-making. We understand historical figures through new lenses constantly; stopping this process preserves a record but kills understanding.
  *   **Audit:** This is a **significant overstatement**. It transforms the virtue of honesty into a rigid prohibition on reinterpretation. It conflates *preserving facts* with *preserving the subject's perspective*.

  ### 3. Artistic License as Epistemic Trespass
  **Claim:** *Artistic licence is a form of epistemic trespass unless the work explicitly declares its fictional status.*

  *   **What a careful defender would accept:** Transparency is an epistemic virtue. Audiences should not be deliberately misled into believing fabrication is fact. If a work claims to be a documentary or a biography, it must adhere to higher evidentiary standards.
  *   **The Distortion/Conflation:** The term "epistemic trespass" usually refers to an expert speaking outside their field of competence. Applying it to artists implies that fiction is an intrusion on the territory of knowledge. This ignores the social contract of the novel. When a reader picks up a "historical novel," there is already an implicit understanding that interiority, dialogue, and scene-setting involve invention.
  *   **Audit:** This is a **category error**. It treats art as failed history. The obligation is not to avoid "trespass," but to avoid *deception*. A novel can be ethically sound even if it invents scenes, provided it does not claim to be a factual record. The requirement for an explicit disclaimer is a legal safeguard, not necessarily a moral imperative for all art (e.g., *All the President's Men* vs. *All the King's Men*).

  ### 4. The Temporal Conclusion (Recent vs. Distant)
  **Claim:** *Unease about portraying recently dead figures stems from the fact that living witnesses can still correct such corruption, whereas with distant historical subjects the damage is already settled and irreversible.*

  *   **What a careful defender would accept:** It is pragmatically true that living witnesses act as a check on falsehoods. The potential for causing distress to grieving relatives is also higher with recent deaths.
  *   **The Distortion/Conflation:** The conclusion does not logically follow from the premises.
      1.  **The "Settled" Fallacy:** History is never "settled." We constantly reinterpret Caesar, Napoleon, or Lincoln. If "mnemonic stewardship" is the duty, it applies equally to the distant dead. If corrupting the record is wrong, it is wrong regardless of who is alive to complain.
      2.  **Moral vs. Prudential:** This argument shifts from *ethics* (what is right) to *prudence* (what is safe). It suggests the only reason we hesitate with the recently dead is the risk of being caught or causing social friction, not because the act itself is inherently more wrongful.
      3.  **Inconsistency:** If the dead cannot suffer (Premise 1), why does the presence of living witnesses change the moral calculus? If the duty is to the *record*, the record is equally corrupted whether the witnesses are alive or not.
  *   **Audit:** This is a **non-sequitur**. It explains the *psychology* of our unease, but it does not justify the *ethics* of the distinction. It admits that the "harm" is actually to the living (witnesses/society), which contradicts the initial claim that we have no duties of welfare to the dead.

  ### Summary for the Novelist

  Your colleague's argument is a compelling piece of rhetoric, but it is not a settled ethical verdict. It creates a "straw man" of posthumous harm (by limiting it to sentience) to set up a stricter duty of memory.

  **Where she is right:**
  *   You have a responsibility not to deliberately deceive your audience about what is fact and what is invention.
  *   You should treat the subject's legacy with a degree of integrity, avoiding distortions that serve only to exploit or demean without artistic purpose.

  **Where she is wrong:**
  *   **Art is not Archive:** Your job is not to preserve the subject's self-interpretation, but to explore the human condition *through* the subject. Sometimes that requires challenging the subject's own view of themselves.
  *   **The Living Matter More:** The "harm" you are actually managing is not to the dead (who, as she notes, feel nothing), but to the living survivors and the public's understanding of history.
  *   **Time Doesn't Absolve:** If distorting a life is ethically wrong, it is wrong for Julius Caesar just as it is for a figure who died in 2020. The presence of living witnesses is a practical constraint, not a moral boundary.

  **Recommendation:**
  Proceed with your manuscript, but adopt a standard of **transparency** rather than **fidelity**. You are not a fiduciary steward of their memory; you are an artist engaging with their history. Ensure your author's note clarifies where you have diverged from the record. This satisfies the epistemic concern (don't lie to the reader) without accepting the restrictive burden of "mnemonic stewardship" (don't reimagine the subject).

  The ethical risk is not in the invention itself, but in the *intent* behind it. Are you inventing to reveal a deeper truth about the figure, or to overwrite them for your own ends? The former is art; the latter is the trespass your colleague warns against.
