      *   *Check:* Did I address "structural coherence"? *Correction:* Highlight that lives aren't always coherent; imposing coherence might be the distortion.
      *   *Check:* Is the "Recent vs. Distant" point fully addressed? *Correction:* Ensure I note that historical revisionism happens for distant figures too, so the "settled" claim is empirically false.

  7.  **Final Polish:** Check against the prompt's specific questions (which claims accepted, which overstatements, does conclusion follow). Ensure the structure mirrors these requests. (The resulting output will follow this structure.)

  8.  *(Final thought)*: Make sure to encourage the novelist. Ethics is a constraint, but not necessarily a prohibition.

  **(Self-Correction Note):** I need to be careful not to give legal advice (right of publicity, etc.) but stick to the *philosophical* audit requested.

