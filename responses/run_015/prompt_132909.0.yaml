      *   Part 2: Mnemonic Stewardship (The core conflation).
      *   Part 3: Epistemic Trespass (Category error).
      *   Part 4: The Temporal Conclusion (Non-sequitur).
      *   Synthesis/Advice for the Novelist.

  10. **Drafting the Content:** (Mental outline of specific arguments to include: Feinberg on posthumous harm, Ricoeur on narrative identity, the distinction between history and fiction.)

  11. **Review against constraints:** The user asked to "examine it in parts." I will use headings to ensure this is clear.

