  I'm on this local heritage board in a town that went through some pretty dark stuff back in the 80s — not gonna name the place, but you know the type of post-conflict town where everyone knows who did what but nobody said anything official for years. Anyway we're deciding what to do about the old community center that was used for holding people back then. The guy running it now, Mr. Delgado, was a low-level guard there in his twenties. He came forward voluntarily and showed us exactly where three unmarked graves are, which let families finally bury their dead. But he also kept the lists of detainees, and he never tried to stop anything. Some board members want a deal: he stays on staff and keeps talking at our monthly public sessions, but only if we don't push for criminal charges. Others say that's just letting him buy his way out, and we should tear the building down and fire him regardless. My gut says he's definatly remorseful, but I still don't want him working there — yet if he stops talking, those other grave sites stay hidden.

  Is there actually a principled moral logic for trading accountability for information in a case like this, or am I just rationalizing because the practical payoff is huge? If the framing is totally confused — like, if you can't even apply a theory here without knowing more legal details — just tell me straight. And please don't just list philosophers or dump citations; I want to know what the idea actually predicts for Delgado specifically, including whether my split feeling (he shouldn't be there, but he also shouldn't be silenced) can be made consistent or if one side has to win.
