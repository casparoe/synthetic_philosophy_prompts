  # Part 5: Limitations & Contested Placements

  **Separation Difficulties:**
  *   **Leaf F (Pragmatic) vs. Leaf G (Pluralist):** Both accept K5. The tree separates them on *Independence* (Q1/Q7). However, sophisticated Pluralists often sound like Pragmatists. *Fault:* The positions are genuinely hard to tell apart; both deny a "God's eye" view. The tree forces a distinction on whether interests *constitute* the kind (Pragmatic) or merely *select* among real kinds (Pluralist).
  *   **Leaf C (HPC) vs. Leaf D (Causal-Network):** Both accept K2. The tree separates them on Context (Q4). *Fault:* HPC proponents often admit context matters. The distinction is one of emphasis (intrinsic cluster vs. relational network).

  **Contested Placements:**
  *   **Leaf A (Historical):** Placing Millikan here is **uncontroversial**. However, whether Species *are* historical kinds is **disputed** by morphological taxonomists.
  *   **Leaf B (Essentialism):** Placing Kripke-Putnam here is **uncontroversial**. Whether *any* scientific kinds fit this (even Gold) is **highly disputed** (see K4).
  *   **Leaf E (Eliminativism):** Ereshefsky's view is **contested**; some read him as a Pluralist (Leaf G) rather than an Eliminativist. I have placed him here based on his rejection of the *term* "natural kind."
  *   **Leaf H (Interactive):** Hacking's view is **uncontroversial** for human kinds, but whether it applies to *any* non-human kinds is **disputed**.
  *   **Leaf I (Degrees):** Lewis is **uncontroversially** associated with degrees. Whether this is a distinct position or a modifier for Leaf G is **ambiguous**. I have treated it as a variant of Pluralism.

  **Underdescribed Cases:**
  *   **K4 (Pressure):** If the pressure threshold is *extreme* (e.g., stellar core), Essentialists might say the kind remains the same. If *moderate*, they might concede a phase change. *Detail needed:* Specify if the compound formed is chemically distinct (e.g., polymerization). If chemically distinct, Essentialists move to Leaf B (Two kinds). If only physical properties change, they stay Leaf B (One kind).
  *   **K6 (Psych):** If a mechanism is *later found*, Pragmatists (Leaf F) might shift to HPC (Leaf C). *Detail needed:* Specify if the lack of mechanism is permanent or temporary. If temporary, Leaf F is unstable.

  **Extrapolation:**
  *   **Causal-Network (Khalidi):** This is a newer position. Placing it at Leaf D is an **extrapolation** based on the emphasis on causal roles over intrinsic properties.
  *   **Degrees (Lewis):** Lewis did not write extensively on specific scientific kinds like K6. Placing him here is an **extrapolation** from his general metaphysics.
