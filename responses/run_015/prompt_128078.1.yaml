  # Part 3: Leaf Specifications (Doctrines & Case Commitments)

  **Leaf A: Historical/Etiological Realism (Millikan-style)**
  *   **Doctrine:** Kinds are defined by historical origins or functions, not intrinsic similarity.
  *   **K1:** Real (if same history). **K2:** Two kinds. **K3:** Two kinds. **K4:** One kind. **K5:** Rivals (one historical truth). **K6:** Not a kind (no history).

  **Leaf B: Microstructural Essentialism (Kripke-Putnam)**
  *   **Doctrine:** Kinds are defined by intrinsic, often microstructural, essences.
  *   **K1:** Two kinds. **K2:** Two kinds. **K3:** One kind (if intrinsic same). **K4:** One kind. **K5:** Rivals. **K6:** Not a kind.

  **Leaf C: HPC Realism (Boyd-style)**
  *   **Doctrine:** Kinds are clusters of co-occurring properties sustained by homeostatic mechanisms.
  *   **K1:** One kind (if cluster holds). **K2:** One kind (if cluster holds). **K3:** Two kinds (if mechanisms diverge). **K4:** One kind. **K5:** Rivals (best cluster wins). **K6:** Real (if cluster holds).

  **Leaf D: Causal-Network Realism (Khalidi-style)**
  *   **Doctrine:** Kinds are nodes in a causal network; context and relations are constitutive.
  *   **K1:** One kind. **K2:** One kind. **K3:** Two kinds. **K4:** Two kinds (context matters). **K5:** Compatible (different networks). **K6:** Real (if causal role exists).

  **Leaf E: Eliminativism (Ereshefsky-style)**
  *   **Doctrine:** "Natural kind" is a failed philosophical term; only specific scientific taxonomies exist.
  *   **K1-K6:** All are merely classifications serving specific sciences; none are "natural kinds" in the philosophical sense.

  **Leaf F: Pragmatic Conventionalism (Interest-Relative)**
  *   **Doctrine:** Kinds are real relative to human interests and practices.
  *   **K1-K6:** All are real relative to the practices that sustain them; no "view from nowhere."

  **Leaf G: Promiscuous Pluralism (Dupré-style)**
  *   **Doctrine:** Nature is too complex for one taxonomy; many cross-cutting real kinds exist.
  *   **K1:** One kind. **K2:** One kind. **K3:** Two kinds. **K4:** One kind. **K5:** All real (plural). **K6:** Real.

  **Leaf H: Interactive Constructivism (Hacking-style)**
  *   **Doctrine:** Human kinds are unique because classification changes the classified.
  *   **K1-K5:** Real (standard). **K6/K7:** Real but interactive (looping effect).

  **Leaf I: Degrees of Naturalness (Lewis-style)**
  *   **Doctrine:** Naturalness is a gradient, not a binary.
  *   **K1-K6:** All are kinds to varying degrees based on similarity metrics. (Mapped to Leaf G branch for tree purposes).

