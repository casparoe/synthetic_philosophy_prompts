  # Part 2: The Decision Tree

  1.  **Take Case K1 (Trade Samples).** Suppose we discover that samples historically traded as one kind actually possess two distinct microstructures, yet all inductions about their weight and malleability still hold. Is the original classification a *single* natural kind?
      *   **No (It is two kinds, masked as one):** Go to 2.
      *   **Yes (It is one kind, defined by use/induction):** Go to 5.

  2.  **Take Case K3 (Cryptic Species).** Two populations look identical and interbreed in the lab, but genomic evidence shows they have not exchanged genes in the wild for millions of years. Are they one species or two?
      *   **Two (History/Genealogy determines kindhood):** **Leaf A: Historical/Etiological Realism**
      *   **One (Intrinsic properties determine kindhood):** Go to 3.

  3.  **Take Case K2 (Jadeite/Nephrite).** Two minerals with different crystal structures are grouped under one name. The grouping supports some inductions (durability) but frustrates others (cleavage). Is this grouping a *single* natural kind?
      *   **No (It is a disjunction of two kinds):** **Leaf B: Microstructural Essentialism**
      *   **Yes (It is a single kind despite structural difference):** Go to 4.

  4.  **Take Case K4 (Pressure Threshold).** A chemical substance behaves identically at ordinary pressure but forms different compounds above a threshold. Does the environmental context change the *kind*?
      *   **No (Kind is intrinsic; context is accidental):** **Leaf C: HPC Realism (Strict)**
      *   **Yes (Kind includes causal context):** **Leaf D: Causal-Network Realism**

  5.  **Take Case K5 (DNA Stretch).** The same DNA sequence is classified differently by geneticists, developmental biologists, and evolutionists, and each classification supports the inductions of that subfield. Are these classifications *rivals* where only one can be true?
      *   **Yes (Only one carving is correct):** Go to 6.
      *   **No (Multiple carvings are equally real):** Go to 7.

  6.  **Take Case K6 (Psychiatric Diagnosis).** A diagnostic category predicts response to intervention but has no known shared mechanism or symptom. Is this a natural kind?
      *   **No (It is merely a useful tool):** **Leaf E: Eliminativism**
      *   **Yes (It is real in virtue of predictive success):** **Leaf F: Pragmatic Conventionalism**

  7.  **Take Case K7 (New Case: Social Kind).** Consider a category like "teenager" or "refugee" that did not exist before the term was coined and now shapes the behavior of those classified. Does the classification *create* the kind?
      *   **No (It tracks pre-existing patterns):** **Leaf G: Promiscuous Pluralism**
      *   **Yes (It interacts to create the kind):** **Leaf H: Interactive Constructivism**

  *(Note: To reach 9 leaves as planned in the space analysis, Leaf F and Leaf G are split further in the Answer Key by degree, but for the tree structure, they represent the Pragmatic and Pluralist branches respectively. Leaf I "Degrees of Naturalness" is a cross-cutting modifier applicable to Leaves C, D, and G, but for the sake of the tree's binary flow, it is treated as a variant of Promiscuous Pluralism that accepts grading.)*

