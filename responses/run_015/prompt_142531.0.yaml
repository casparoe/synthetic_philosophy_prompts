answer: |-
  The naval architect has the better of the argument because artifacts like ships are defined by function and social tracking rather than material composition, especially in a legal context.

  (1) The conservator is partly right but relies on a false premise: that ships are essentially their matter. This holds for sculptures or relics, but mistaken for working vessels, which are functional kinds defined by use.

  (2) The architect is right. Maintenance is constitutive of a ship's identity; a vessel that rots is destroyed, while one repaired persists. The distinction between "repair" and "replacement" does no work here because maritime practice treats them as identical.

  (3) The conservator is right logically. This is the standard "reassembly" counterexample, and it successfully shows that material continuity and functional continuity can diverge.

  (4) The architect is right. The distinction between a structured hull and a pile of timber is robust; function requires form, so a gap in shiphood breaks identity.

  (5) The conservator is right. This is the strongest philosophical move, exposing the vagueness of identity (the Sorites paradox). The architect's "no-gap" test fails here because both vessels have uninterrupted histories.

  (6) The architect is right. For artifacts, identity is socially constituted. The distinction between "intrinsic properties" and "social career" is valid; the latter governs legal and practical identity.

  (7) The conservator is partly right. Identity is logically binary, but her premise that this makes social criteria useless is false; law and practice routinely resolve vagueness by stipulation. The distinction between "identity" and "graded criteria" does no work in a courtroom, which must produce a binary verdict regardless.

  (8) The architect is right. This is conceptual relativity: "same ship" means different things in different contexts. There is no false premise here; it accurately describes how language works for complex objects.

  (9) The conservator is mistaken. She relies on a false premise: that a choice based on purpose is arbitrary. It is not arbitrary if it serves the intent of the will.

  (10) The architect is right. Teleology (purpose) resolves metaphysical indeterminacy. The decision is guided by the reason the bequest was made, not by the wood.

  Both parties are missing the specific legal doctrines that would actually decide the case. They overlook the law of accession, which generally holds that improvements or replacements belong to the original property, favoring the continuously maintained vessel. More critically, they ignore the specific wording of the bequest: "and to whoever is her master." This ties the ship to the human element—the crew and captain who sailed her continuously—which decisively favors the vessel that remained in commission. The master follows the registry and the crew, not the pile of timber.

  Regarding the court versus philosophy question: the two can and do come apart. Philosophy seeks metaphysical truth, which may be indeterminate here. Law seeks finality and the fulfillment of intent. A court would not ask "which ship is metaphysically identical?" but "which vessel satisfies the evidence of continuity required to execute the will?" The court would track registration logs, crew manifests, and insurance records, not plank counts. The legal verdict tracks the architect's pragmatic view, not because it is metaphysically superior, but because it is actionable.

  The architect has the better of the argument.
