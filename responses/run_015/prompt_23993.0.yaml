  *   **Proofs:** I will not provide full, rigorous measure-theoretic proofs. Instead, I will provide "proof sketches" that illustrate the mechanism of the contradiction. The focus will be on the decision-theoretic interpretation of the math, not the math itself.
  *   **Literature:** I will restrict the scope to the Pasadena Game and its immediate variants (Altadena, etc.), rather than surveying all divergent series paradoxes.
  *   **Summation Methods:** I will focus primarily on Cesàro and Banach limits, as these are the most relevant to decision theory (Cesàro for its simplicity, Banach for its invariance properties). I will not survey obscure summation methods.

