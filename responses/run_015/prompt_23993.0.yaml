  ## 8. Detailed Preliminary Analysis (The "In-the-Weeds" Argument)

  To demonstrate the tractability of this project, I will outline the specific argument I intend to develop in Section 5 of the paper. This serves as a proof of concept for the proposal.

  **The Setup:**
  Consider the Pasadena Lottery $L_P$. The payoff sequence (weighted by probability) is $s = (1/2, -1/2, 1/2, -1/2, \dots)$.
  Consider a Modified Lottery $L_M$. The payoff sequence is $s' = (1/2 + \delta, -1/2 + \delta, 1/2 + \delta, -1/2 + \delta, \dots)$ for some small $\delta > 0$.
  Clearly, $L_M$ dominates $L_P$. In every state, $L_M$ pays $2^n \delta$ more than $L_P$.
  Therefore, any rational valuation $V$ must satisfy $V(L_M) > V(L_P)$.
  By Linearity, $V(L_M) = V(L_P) + \delta$. This holds for standard EV and most generalized linear functionals.

  **The Complication:**
  Now consider a "Shifted" Pasadena Lottery $L_{SP}$.
  In $L_P$, the outcome $1/2$ occurs at state 1, $-1/2$ at state 2, etc.
  In $L_{SP}$, we shift the outcomes. But we must keep the probabilities fixed to the states to maintain the probability space.
  Actually, a better comparison is to keep the *outcomes* fixed but change the *probabilities* or the mapping.
  Let's use the standard trick for these paradoxes: The "St. Petersburg" style mapping.
  Let the states be $n \in \mathbb{N}$.
  $L_P$: Payoff $x_n$ at state $n$.
  $L_{SP}$: Payoff $x_{n-1}$ at state $n$ (with $x_0 = 0$).
  If the summation method is **Shift-Invariant** (a desirable property for a generalized limit to avoid arbitrariness of the starting index), then $\Sigma(x_n) = \Sigma(x_{n-1})$.
  This implies $V(L_P) = V(L_{SP})$.
  However, does $L_P$ dominate $L_{SP}$?
  $x_1 = 1/2$. $x_0 = 0$. So at state 1, $L_P$ pays $1/2$, $L_{SP}$ pays $0$.
  $x_2 = -1/2$. $x_1 = 1/2$. At state 2, $L_P$ pays $-1/2$, $L_{SP}$ pays $1/2$.
  Here, dominance fails. $L_P$ is better at state 1, worse at state 2. So Shift-Invariance does not immediately violate Dominance here.

  **The Real Conflict:**
  The real conflict arises with **Permutation Invariance**.
  Let $L_P$ be the standard Pasadena.
  Let $L_{P2}$ be a lottery where we group the terms: $(1/2 - 1/2) + (1/2 - 1/2) \dots$
  If we treat pairs as single outcomes, the sum is 0.
  If we treat them individually with Cesàro, the sum is $1/4$.
  Both describe the same set of outcomes and probabilities, just grouped differently.
  If the decision theory is sensitive to grouping (which is a form of ordering/description), it violates **Description Invariance**.
  If we enforce Description Invariance, we must treat the lottery as a set of outcome-probability pairs $\{(x_i, p_i)\}$.
  The sum over a set is only well-defined if the series is **Absolutely Convergent**.
  This is a known theorem in analysis: The sum of a family of numbers indexed by a set is independent of the ordering if and only if the sum of the absolute values is finite.
  Since the Pasadena Game is not absolutely convergent ($\sum |1/2| = \infty$), the sum is *inherently* order-dependent.
  Therefore, **any** method that assigns a value to the Pasadena Game must rely on an ordering.
  Therefore, **any** method that assigns a value to the Pasadena Game violates Description Invariance.
  Therefore, to preserve Description Invariance (a core tenet of decision theory), we must refuse to assign a value to the Pasadena Game.

  **Conclusion of Preliminary Analysis:**
  This argument provides a clear, tractable path to a negative result. It bypasses the need for complex dominance counterexamples and strikes at the heart of the definition of a lottery. A lottery is a mapping from states to outcomes. The states do not have an intrinsic order. Therefore, the expectation must be order-invariant. Therefore, it must be absolutely convergent. Therefore, Pasadena has no EV.
  This seems to settle the question definitively against the "Generalized EV" hypothesis.
  *However*, the paper will explore if there is a way out. Can we define the "states" as having an intrinsic order? (e.g., temporal order of coin flips). In the Pasadena Game, the states correspond to "Heads on flip $n$". This *does* have a natural ordering (flip 1, flip 2, flip 3).
  If the states have a natural ordering, Description Invariance might be too strong. We might only require Invariance under *irrelevant* permutations, but respect the natural temporal order.
  If we accept the temporal order, then Cesàro summation becomes viable.
  *But*, does Cesàro summation respect Dominance in this temporal context?
  I will need to check if there exist two temporally ordered lotteries $A$ and $B$ such that $A$ dominates $B$ at every time step $n$, but $\text{Cesàro}(A) \leq \text{Cesàro}(B)$.
  If $A_n \geq B_n$ for all $n$, then the partial sums $S_N(A) \geq S_N(B)$.
  Then the averages of partial sums must also preserve the inequality.
  So Cesàro summation *does* preserve dominance for term-wise dominance.
  So the obstruction is not Dominance, but **Description Invariance**.
  The paper will hinge on whether the "temporal order" of the coin flips is a decision-theoretically relevant feature.
  *Argument:* If I offer you the Pasadena game, but I scramble the labels of the coin flips (you don't know which flip is which, only the set of probabilities), the temporal order is epistemically inaccessible. Decision theory should rely on the information available to the agent. If the agent knows the temporal structure, maybe order matters. If not, it shouldn't.
  This nuance provides enough depth for a 6000-word paper. It moves the debate from "Is the sum defined?" to "What is the ontological status of the state space?"

  ## 9. Final Assessment of Project Viability

  This project is highly viable for a one-semester term paper.
  1.  **Tractability:** The mathematical tools required (basic series convergence, Cesàro means) are within the grasp of a graduate student in philosophy or economics with some formal training. The deep measure theory can be avoided by focusing on the sequence properties.
  2.  **Originality:** While the Pasadena Paradox is well-trodden, the specific focus on *Generalized Summation Methods* as a rescue strategy, and the specific rebuttal via *Description Invariance*, offers a fresh perspective. Most papers stop at "EV is undefined." This paper asks "Can we redefine 'defined'?" and answers "Yes, but at a cost."
  3.  **Relevance:** It contributes to the ongoing debate about infinite ethics and long-termism, where similar aggregation problems arise (e.g., summing utility over an infinite future). The lessons learned from Pasadena apply directly to those fields.
  4.  **Risk:** The main risk is becoming too technical. I must ensure the philosophical significance of the mathematical constraints is always foregrounded. The math is the tool, not the product. The product is a clearer understanding of the limits of rational choice theory.

  In summary, this proposal outlines a rigorous investigation into the boundaries of Expected Value theory. By testing the hypothesis that generalized summation can resolve the Pasadena Paradox, the paper will likely demonstrate that the paradox is not a mathematical glitch to be fixed, but a structural feature of infinite decision spaces that forces a choice between quantitative precision and descriptive invariance. This is a substantive conclusion that justifies the research.

