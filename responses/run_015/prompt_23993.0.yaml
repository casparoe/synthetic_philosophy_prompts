answer: |-
  # Research Prospectus: Generalized Expectations and the Dominance Principle in the Pasadena Paradox

  ## 1. Introduction and Motivation

  The foundations of decision theory rest heavily on the principle of Expected Value (EV) maximization. In its standard formulation, this principle dictates that a rational agent ought to prefer lottery $A$ to lottery $B$ if and only if the expected value of $A$ exceeds the expected value of $B$. This framework is elegant, mathematically tractable, and aligns well with intuition in cases involving finite outcomes or countably infinite outcomes with absolutely convergent series. However, the coherence of this framework is threatened by the existence of lotteries involving conditionally convergent or divergent series. The most prominent of these counterexamples is the Pasadena Game, introduced by Nover and Hájek.

  The Pasadena Game presents a scenario where the expected value series is not merely infinite (as in the St. Petersburg Paradox) but undefined due to oscillation. The standard response in the literature has been to treat this as a boundary case where EV maximization simply ceases to apply, often supplementing the decision theory with a dominance principle to handle comparisons that EV cannot. While this "patch" approach preserves consistency, it is theoretically unsatisfying. It suggests a fragmentation of decision theory: one rule for well-behaved prospects, another for pathological ones. Furthermore, it leaves open the possibility that we are abandoning the EV framework prematurely. Perhaps the problem is not with the concept of expectation itself, but with the specific summation method (the standard limit of partial sums) used to calculate it.

  This proposal outlines a term paper that investigates a specific, technical hypothesis: that the Pasadena Paradox can be resolved not by abandoning Expected Value, but by generalizing the summation method used to define it. Specifically, I propose to investigate whether there exists a "generalized expectation functional" that satisfies three conditions: (1) it agrees with standard EV on all convergent lotteries; (2) it assigns a definite value to the Pasadena Game and its variants; and (3) it remains consistent with the Principle of State-Wise Dominance.

  The intuition driving this project is that the undefined nature of the Pasadena EV is an artifact of the strict Cauchy definition of convergence. Mathematical analysis offers various regularization techniques—such as Cesàro summation, Abel summation, or Banach limits—that assign values to divergent series. If decision theory is to be robust, it should ideally be compatible with these broader mathematical tools. However, decision theory imposes constraints that pure analysis does not. Most critically, a lottery's value in decision theory must be invariant to the description of the states. In mathematical series, rearranging terms can change the generalized sum of a conditionally convergent series. In decision theory, rearranging the order in which we list outcomes should not change the value of the gamble.

  This paper will argue that this tension between *summation invariance* and *dominance preservation* creates a formidable, perhaps insurmountable, obstruction to the generalized EV approach. While the hypothesis that generalized summation can rescue EV maximization is initially plausible, a rigorous analysis suggests that any summation method powerful enough to value the Pasadena Game will inevitably violate dominance when comparing two Pasadena-like lotteries with shifted phases. The project will not merely assert this impossibility but will formally construct the specific lotteries and summation properties that demonstrate the conflict.

  The significance of this project extends beyond the Pasadena Game itself. It touches on the fundamental relationship between normative decision theory and the mathematical structures used to model it. If we cannot extend EV to the Pasadena case without violating dominance, it implies a deep structural limit on quantitative decision theory: there are coherent probability spaces where no quantitative value can be assigned without violating basic rationality constraints. Conversely, if a solution exists, it would require a significant revision of how we understand the invariance conditions of decision problems. This paper aims to settle this question, or at least precisely locate the obstruction, providing a definitive analysis of the "Generalized EV" response to the Pasadena Paradox.

  ## 2. Statement of the Research Question

  The core research question of this paper can be formalized as an existence problem within the framework of decision theory under uncertainty. Let $\mathcal{L}$ be the space of lotteries defined over a countable state space $S = \{s_1, s_2, \dots\}$ with a fixed probability measure $P$ such that $P(s_i) = p_i$ and $\sum p_i = 1$. Let $X: S \to \mathbb{R}$ be a random variable representing the monetary payoff of a lottery. The standard expected value is defined as $E[X] = \sum_{i=1}^\infty X(s_i)p_i$, provided the series converges absolutely.

  The Pasadena Game, denoted $L_P$, is defined by the sequence of payoffs $x_n = (-1)^{n-1} 2^n$ occurring with probability $p_n = 1/2^n$ for $n=1, 2, \dots$. The terms of the expected value series are $t_n = x_n p_n = (-1)^{n-1} \frac{1}{2}$. The series $\sum t_n$ is $1/2 - 1/2 + 1/2 - 1/2 \dots$, which oscillates and has no limit in the standard sense.

  The research question is: **Does there exist a linear functional $V: \mathcal{L}^* \to \mathbb{R}$, defined on a domain $\mathcal{L}^*$ containing all convergent lotteries and the Pasadena Game, such that:**

  1.  **Extension:** For any lottery $L \in \mathcal{L}^*$ with a classically convergent EV, $V(L) = E[L]$.
  2.  **Regularity:** $V(L_P)$ is a finite real number.
  3.  **Dominance:** For any $L_A, L_B \in \mathcal{L}^*$, if $L_A(s) \geq L_B(s)$ for all $s \in S$, and $L_A(s) > L_B(s)$ for at least one $s$ with $P(s) > 0$, then $V(L_A) > V(L_B)$.
  4.  **Description Invariance:** The value $V(L)$ does not depend on the indexing of the states $S$. (i.e., if $\pi$ is a permutation of $\mathbb{N}$, and $L'$ is the lottery defined by reordering the outcomes according to $\pi$, then $V(L) = V(L')$).

  This formulation sharpens the user's initial intuition. The initial idea focused on whether a summation method *exists* that values the lottery. The addition of **Description Invariance** is the critical philosophical contribution of this proposal. In pure analysis, one might accept that a series value depends on the ordering of terms. In decision theory, the "states of the world" do not come with a natural ordering. The agent faces a set of outcomes with associated probabilities. To assign a value based on the order in which the agent happens to list these states would be to allow an irrelevant feature of the description to dictate rational choice. Therefore, any proposed "Generalized EV" must be permutation invariant.

  The paper will investigate whether conditions (1) through (4) are mutually consistent. My preliminary hypothesis is that they are not. Specifically, I suspect that satisfying (1), (2), and (3) is possible only by sacrificing (4), or that satisfying (1), (2), and (4) forces a violation of (3). The paper will aim to prove this incompatibility formally.

  ## 3. Critique of Standard Responses

  To justify the necessity of this investigation, I must first establish why existing solutions to the Pasadena Paradox are insufficient for the specific theoretical goals of this paper. The literature generally offers three classes of responses: the "Undefined" response, the "Dominance-Only" response, and the "Restriction" response.

  ### 3.1 The "Undefined" Response
  The most common reaction to the Pasadena Game is to declare that the expected value is undefined and therefore the EV maximization principle simply does not apply. On this view, the agent is rationally permitted to have any preference ordering over the Pasadena Game that does not violate other axioms (like transitivity).
  *Critique:* This response is theoretically costly. It creates a "hole" in the decision theory. If we encounter a lottery with an undefined EV, we lose the ability to compare it quantitatively with other lotteries, even those with defined EVs. For example, if I offer you the Pasadena Game versus a guaranteed $1,000,000, standard EV theory cannot tell you to take the million, because the EV of the Pasadena Game is not a number to compare. We are forced to rely on qualitative dominance. While dominance works in that specific case, it fails to provide a unified theory of value. We want a decision theory that provides a *value* for prospects, allowing for trade-off analysis, not just binary preference orderings.

  ### 3.2 The "Dominance-Only" Response
  A more sophisticated version of the above suggests that we should replace EV maximization with a dominance principle supplemented by axioms of continuity. If Lottery A dominates Lottery B, choose A. If neither dominates, the agent may be indifferent or have arbitrary preferences.
  *Critique:* While dominance is a robust principle, it is too weak to serve as a complete decision guide. Many interesting decisions do not involve state-wise dominance. Furthermore, as I will demonstrate in the paper, dominance itself becomes tricky when comparing two divergent lotteries. If we have two Pasadena-like lotteries where one pays $1$ cent more in every state than the other, dominance demands we prefer the first. But if our valuation method assigns them the same "generalized value" (due to insensitivity to finite shifts), we have a contradiction between our valuation and the dominance principle. A theory that assigns values must ensure those values track dominance.

  ### 3.3 The "Restriction" Response
  Some theorists argue that we should restrict the domain of admissible lotteries to those with absolutely convergent expected values. On this view, the Pasadena Game is not a "real" decision problem or is ruled out by a priori rationality constraints.
  *Critique:* This is ad hoc. The Pasadena Game is physically possible (assuming an unbounded utility scale and a coin). To rule it out simply because it breaks our math is to put the cart before the horse. The math should serve the ontology of the decision problem, not constrain it. If a coherent probability space can be described, decision theory should ideally have the resources to evaluate it.

  ### 3.4 The Gap
  None of these standard responses engage with the mathematical possibility of *extending* the expectation operator. They accept the Cauchy limit as the only definition of sum. This paper fills that gap by asking whether the mathematical tools of divergent series can be imported into decision theory without breaking the normative constraints (Dominance and Invariance). This is a novel angle that moves beyond the standard "EV vs. Dominance" debate into the structural properties of the expectation functional itself.

  ## 4. Methodology and Formal Framework

  The paper will proceed using a mix of formal mathematical analysis and philosophical argumentation. The core of the work will be constructing specific counterexamples that test the limits of generalized summation methods.

  ### 4.1 Defining the Summation Methods
  I will begin by formally defining the class of summation methods under consideration. A summation method is a linear functional $\Sigma$ that maps sequences of real numbers to real numbers.
  *   **Cesàro Summation (C, 1):** The limit of the arithmetic means of the partial sums. For the sequence $1, -1, 1, -1 \dots$, the partial sums are $1, 0, 1, 0 \dots$. The means converge to $1/2$.
  *   **Abel Summation:** The limit of the power series $\sum a_n x^n$ as $x \to 1^-$.
  *   **Banach Limits:** Linear functionals that extend the limit functional to bounded sequences, preserving shift-invariance.

  I will evaluate these methods against the four criteria established in Section 2 (Extension, Regularity, Dominance, Invariance).

  ### 4.2 The Ordering Problem (Riemann Rearrangement)
  A central portion of the paper will be dedicated to the **Description Invariance** condition. In standard analysis, the Riemann Rearrangement Theorem states that for any conditionally convergent series, the terms can be rearranged to sum to any real number, or to diverge. While the Pasadena series is not conditionally convergent (it is oscillatory), generalized sums often retain sensitivity to ordering.
  For example, Cesàro summation is not invariant under arbitrary permutations. If we reorder the outcomes of the Pasadena Game, the Cesàro sum may change.
  *Decision-Theoretic Implication:* If the value of a lottery depends on the order in which the agent enumerates the states, the theory is subjective in an unacceptable way. The world does not present states in a sequence $s_1, s_2, \dots$. They exist simultaneously. I will construct a proof showing that any summation method that is sensitive to ordering violates Description Invariance.

  ### 4.3 The Dominance Conflict
  The most technical section will address the conflict between Generalized EV and Dominance. I will construct a "Shifted Pasadena" lottery, $L_{P'}$, which is identical to $L_P$ except that the payoff in every state is increased by a small constant $\epsilon > 0$.
  *   By Dominance, $V(L_{P'}) > V(L_P)$.
  *   By Linearity (a property of most generalized expectations), $V(L_{P'}) = V(L_P) + \epsilon$.
  *   This seems consistent. However, I will introduce a "Phase-Shifted" lottery, $L_{P''}$, where the sequence of payoffs is shifted by one index (e.g., the outcome that was at $n=1$ is now at $n=2$, etc., with probability mass adjusted accordingly or using a state-space that allows shift invariance).
  *   Many generalized limits (like Banach limits) are *shift-invariant* on the sequence of terms. If the valuation functional is shift-invariant on the payoff sequence, it might assign $V(L_P) = V(L_{P''})$.
  *   However, if $L_P$ and $L_{P''}$ can be constructed on the same state space such that one dominates the other (or they are equivalent but the math treats them differently), we have a contradiction.
  *   I will specifically investigate the tension between **Linearity**, **Shift-Invariance** (often required for stability), and **Strict Dominance**. There are known impossibility results in the literature on finitely additive probabilities (e.g., by de Finetti or more recently by scholars like Easwaran) that suggest you cannot have all these properties simultaneously. I will adapt these results to the specific context of the Pasadena Game.

  ### 4.4 The Role of Boundedness
  I will also consider whether restricting the domain to *bounded* utilities resolves the issue. The Pasadena Game has unbounded payoffs ($2^n$). However, the *expected value terms* are bounded ($1/2$). Does the unboundedness of the utility function drive the paradox, or is it the oscillation? I will analyze a "Bounded Pasadena" variant where payoffs are capped, but the oscillation remains. If the paradox persists with bounded utility, it confirms that the problem is structural to the summation, not the utility scale.

  ## 5. Proposed Structure of the Final Paper

  The final 6000-word paper will be organized into six sections, following the logic of the research proposal.

  **Section 1: Introduction (approx. 750 words)**
  *   Introduce the Pasadena Game and the standard EV failure.
  *   State the thesis: Generalized summation methods offer a tempting solution but fail due to conflicts between Dominance and Description Invariance.
  *   Outline the paper's argument.

  **Section 2: The Formal Landscape (approx. 1000 words)**
  *   Define the Pasadena Game and the Modified Pasadena Game precisely.
  *   Define the standard Expected Value operator and its limitations.
  *   Introduce the candidate Generalized Expectation operators (Cesàro, Abel, Banach).
  *   Formalize the four axioms: Extension, Regularity, Dominance, Invariance.

  **Section 3: The Case for Generalized Expectation (approx. 1000 words)**
  *   Argue why the "Undefined" response is unsatisfactory.
  *   Demonstrate how Cesàro summation successfully assigns a value to the Pasadena Game (e.g., $1/4$).
  *   Show that for simple comparisons (Pasadena vs. Zero), Generalized EV aligns with Dominance.
  *   This section builds the "straw man" or the hopeful hypothesis to be knocked down.

  **Section 4: The Invariance Objection (approx. 1250 words)**
  *   Introduce the problem of state ordering.
  *   Demonstrate mathematically that Cesàro and Abel sums are not permutation invariant.
  *   Argue that Decision Theory requires permutation invariance (Description Invariance).
  *   Show that enforcing invariance restricts the class of allowable summation methods to those that cannot value the Pasadena Game (essentially forcing a return to standard convergence).

  **Section 5: The Dominance Objection (approx. 1250 words)**
  *   Construct the "Shifted Pasadena" counterexample.
  *   Demonstrate that summation methods which *are* shift-invariant (like some Banach limits) violate Strict Dominance in specific pairwise comparisons.
  *   Discuss the impossibility theorem: You cannot have Linearity + Dominance + Regularity on this domain.
  *   Analyze which axiom is the least costly to drop (arguing that Regularity is the one to go, returning us to "Undefined").

  **Section 6: Conclusion (approx. 750 words)**
  *   Summarize the impossibility result.
  *   Discuss implications for decision theory: EV maximization has a hard boundary at conditionally convergent/oscillatory series.
  *   Suggest future directions: Non-quantitative decision theories or hyperreal-valued expectations.

  ## 6. Anticipated Conclusions and Deciding Considerations

  The primary conclusion I anticipate reaching is negative: **There is no generalized expectation functional that satisfies Extension, Dominance, and Description Invariance while valuing the Pasadena Game.**

  The deciding consideration will be the **Description Invariance** axiom. If one is willing to accept that the value of a lottery depends on the ordering of states, then Cesàro summation provides a coherent value. However, I will argue that this is philosophically untenable for a general decision theory. States of the world are not naturally ordered integers. An ordering is imposed by the modeler. If the rational choice depends on the modeler's arbitrary indexing, the theory is not normative; it is artifact-dependent.

  A secondary conclusion will concern the **Dominance Principle**. I expect to show that even if we fix an ordering, certain generalized limits (specifically shift-invariant ones) violate strict dominance. For example, if a summation method assigns the same value to a sequence $a_n$ and its shift $a_{n+1}$, it may fail to distinguish between a lottery $L$ and a lottery $L'$ that pays slightly more in every state but has the same asymptotic density of payoffs. This would violate the basic rational requirement that "more is better."

  If, counter-intuitively, I find a method that satisfies all conditions, the paper will pivot to characterize that method. However, given the known impossibility results in the extension of measures (related to the Hahn-Banach theorem and the existence of non-measurable sets), the negative result is the more mathematically robust prediction. The "obstruction" is likely the lack of absolute convergence. Without absolute convergence, the sum is not a property of the set of terms, but of the sequence. Decision theory requires properties of sets of outcomes, not sequences.

