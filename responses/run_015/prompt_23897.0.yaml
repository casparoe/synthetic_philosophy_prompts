      *(Self-Correction during drafting)*: Make sure to distinguish between "Best" as *maximal* vs. *optimal given constraints*. The Leibnizian view is often misunderstood as "perfect" rather than "maximally compossible." I need to make sure that distinction is clear. Also, ensure the "direction of theistic move" is clear for each.

      *(Refining the "Candidate Set")*: Be precise. Is it *logically* possible? *Nomologically* possible? *Historically* accessible?
      *(Refining the "Metric")*: Total utility? Variety? Moral goodness?
