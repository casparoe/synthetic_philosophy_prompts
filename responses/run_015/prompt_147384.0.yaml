answer: |-
  Converting the wetland to amenity grassland is the welfare-preferring option because the permanent reduction in per-capita suffering amortizes the one-time transition mortality within a negligible timeframe.

  Accepting the welfarist premise that only individual experiences matter, we must compare the aggregate suffering of the wetland's status quo against the transition cost plus the grassland's future flow. The empirical stipulation is crucial: the wetland is a starvation trap. If 90% of every vertebrate cohort dies within weeks via starvation or exposure, the site functions as a suffering factory. Let us invent conservative numbers to model this. Suppose the wetland supports 10,000 vertebrate individuals at any moment, but turns over 50,000 lives annually due to high juvenile mortality. If each short life contains 10 units of suffering (mostly starvation), the annual suffering load is 500,000 units.

  The transition involves draining the wetland, causing a one-time pulse of death. Suppose this kills 20,000 animals slowly. This is a cost of 200,000 suffering units (assuming higher intensity due to stranding). However, the grassland state changes the *structure* of suffering. While mammal headcount remains at 10,000, the population is limited by cover and predation, not food. Starvation is rare. Lives are longer, and deaths via predation or mowing are typically faster than starvation. Suppose annual turnover drops to 12,000 individuals (due to lower juvenile mortality) and suffering per life drops to 2 units (predation/mowing vs. starvation). The new annual load is 24,000 units.

  The amortization is stark. The transition costs 200,000 units. The annual savings are 476,000 units (500,000 minus 24,000). The "break-even" point occurs in less than six months. Even if we discount the future, the welfare gain in the first year alone vastly outweighs the transition slaughter. To oppose the conversion is to privilege the immediate, visible deaths of the draining over the invisible, chronic starvation of the status quo, effectively valuing the timing of death over the quality of life.

  Two objections threaten this calculus: mowing and fertilizer. Critics argue mowing creates a new source of violent death. This is true, but welfarism weighs intensity and duration. A mower blade causes instantaneous death; starvation causes days of metabolic distress. Furthermore, mowing is seasonal. If mowing kills 1,000 mammals annually, this is added to the 24,000-unit load, still leaving the total negligible compared to the wetland's 500,000. The speed of death matters morally; a quick death is preferable to a slow one, even if the frequency is comparable.

  The second objection is that irrigation and fertilizer might inflate insect biomass, potentially supporting more vertebrates than the cover limitation suggests. If mammal numbers double to 20,000, does the benefit vanish? No. The constraint is cover, not food. Fertilizer grows grass, but mowing keeps it short, denying cover. Even with surplus food, the carrying capacity remains capped by predation risk and shelter availability. Thus, the population explosion is structurally prevented. Even if numbers rise by 50%, the per-capita suffering remains low because the regulatory mechanism has shifted from starvation (high suffering) to predation/cover (lower suffering).

  Therefore, the composition of deaths shifts from high-suffering starvation to lower-suffering predation and mechanical accident, and this flow improvement pays off the transition debt almost immediately. Refusing the conversion preserves the wetland's ecological integrity only at the cost of perpetuating a high-suffering equilibrium. A consistent welfarism cannot prioritize the naturalness of the suffering over its magnitude. The draining is tragic, but the status quo is a greater tragedy repeated annually forever. The moral imperative is to minimize the integral of suffering over time, which demands accepting the one-time pulse to secure the permanent flow reduction.
