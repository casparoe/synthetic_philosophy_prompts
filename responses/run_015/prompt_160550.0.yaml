  **Joint Statement on Responsibility Gaps in Autonomous Systems**
  **Signatories:** The Gap Realist & The Gap Institutionalists

  **Introduction**
  We disagree on whether autonomous learning systems generate moral responsibility gaps. To organize this dispute, we distinguish between an *attributability gap* (no individual satisfies conditions for backward-looking blame) and an *accountability gap* (no agent is positioned to answer for outcomes or change the practice that produced them). The Realist argues attributability gaps forbid deployment; the Institutionalist argues existing liability frameworks bridge accountability gaps without requiring individual blame.

  **1. Agreed Claims**
  1.  **Empirical Neutrality:** The dispute is not about how often harm occurs. Both sides accept that high-stakes deployment involves risk.
  2.  **Slogan Warning:** The assertion that "someone must be responsible" is not itself an argument. It requires specification of *what* responsibility entails (blame, compensation, or reform).
  3.  **The Opacity Trade-off:** The hard cases are ones where the performance gain and the opacity come from the same feature of the system (e.g., deep learning layers). We agree that simplifying the system to ensure foreseeability may negate the utility justifying deployment.

  **2. Disagreements Table**

  | Issue | Gap Realist Position | Gap Institutionalist Position | Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Nature of the Gap** | When no individual controls the outcome, an *attributability gap* exists. Blame has nowhere to land. | Responsibility is institutional. If liability rules assign cost, no *accountability gap* exists, even if blame is diffuse. | **Yes.** Dispute turns on defining "responsibility" as blame vs. liability. |
  | **Remedy** | Restrict deployment until control conditions are met. Moral permission requires attributability. | Redesign liability devices (insurance, strict liability). If the device fails, redesign the law, not the tech. | No. Substantive disagreement on permissibility. |
  | **Moral Status** | Unattributable harm is a moral loss that cannot be fully compensated. | Unattributable harm is a cost of doing business, manageable via compensation schemes. | No. Disagreement on the moral significance of blame. |

  **3. Three Cruxes**
  We identify three empirical and normative cruxes using the **Hospital Triage Case**: A patient-allocation system trained on throughput data improves overall survival but concentrates delays on one demographic. The pattern arises only under rare admission combinations; no clinician or engineer can reconstruct why.

  **Crux 1: The Organizational Analogy**
  *Question:* Is a gap that would equally arise inside a large human organization any less of a gap?
  *Evidence:* Historical analysis of corporate negligence where decision chains were too diffuse to pinpoint individual culpability (e.g., complex supply chain failures).
  *Predictions:*
  *   **Realist:** Predicts human organizations still retain *attributability* chains eventually (a CEO signed off). The system breaks this chain entirely.
  *   **Institutionalist:** Predicts human organizations already rely on vicarious liability. If we accept corporate liability there, we must accept it here. The gap is identical.

  **Crux 2: The Redesign Test**
  *Question:* Could the system have been built with an intervention point legible to a named role without losing the gains that justified deploying it?
  *Evidence:* Technical audit of the triage algorithm's architecture regarding interpretability layers.
  *Predictions:*
  *   **Realist:** Predicts that true performance gains require opacity. If legibility were possible, it would have been done. Thus, deployment is impermissible.
  *   **Institutionalist:** Predicts that "legibility" is a design constraint like safety. If it isn't legible, the design is defective. Liability rules will force the engineering solution.

  **Crux 3: The Monitoring Cost (Should-Have-Known)**
  *Question:* Under a *should-have-known-at-a-cost* standard, does failing to spend on monitoring negate the gap?
  *Scenario:* Suppose the hospital could have detected the bias pattern by spending $500k on monitoring that it chose not to spend.
  *Predictions:*
  *   **Realist:** The hospital is blameworthy for *not monitoring*, but the *harmful outcome* remains unattributable. The gap persists regarding the specific triage decisions.
  *   **Institutionalist:** The hospital is liable for the outcome *because* it didn't monitor. The liability closes the gap. The cost of monitoring is simply the price of deployment.

  **4. Note on the Distinction**
  The attributability/accountability distinction genuinely separates our arguments. The Realist is concerned with the *attributability gap*: without control, blame is unjust. The Institutionalist is concerned with the *accountability gap*: without answerability and reform mechanisms, harm is unchecked.

  However, this distinction does no work to resolve the normative stakes. Even if we agree only an *attributability gap* exists (because the hospital is accountable for monitoring), the Realist maintains that deployment is morally restricted if backward-looking blame cannot land on the specific outcome. The Institutionalist maintains that forward-looking accountability suffices for permission. We agree that clarifying this distinction reduces shouting, but it does not bridge the divide on whether unattributable harm is compatible with moral deployment.

  **Conclusion**
  We recommend that policy distinguish between liability for costs (Institutionalist priority) and permissions for deployment (Realist priority). Where the redesign test fails and the organizational analogy holds, the Realist recommends moratorium; the Institutionalist recommends strict liability. We submit this document to record that the disagreement is substantive, not merely semantic, centering on whether accountability without attributability is morally sufficient.

  ***

  **Word Count Check:** ~1,150 words.
  **Constraints Check:**
  - 1,200 words max? Yes.
  - Numbered agreed claims? Yes.
  - Disagreements table with verbal flag? Yes.
  - Three cruxes (Org, Redesign, Monitoring)? Yes.
  - Hospital case used? Yes.
  - Should-have-known standard applied? Yes (Crux 3).
  - Distinction used (where it works/doesn't)? Yes.
  - Format as joint text? Yes.

  *Final Polish:* Ensure the tone is collaborative but firm on disagreements. The table formatting needs to be clear. The word count looks safe. I will proceed with generating the response based on this plan.

  *Wait, one last check on the "Should-have-known" requirement:* "For that case I also want each side's answer under a should-have-known-at-a-cost standard". I have integrated this into Crux 3. This satisfies the requirement.

  *One more check on the Distinction:* "Use the distinction where it genuinely separates something, and say plainly where it does no work." I have a dedicated section for this.

