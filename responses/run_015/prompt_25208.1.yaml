answer: |-
  # Q&A Prep Sheet: Department Colloquium
  **Topic:** The Failure of the Conditional Analysis & Pressure on Humean Laws
  **Context:** Job Market Trial Run

  ### Strategy Note
  Your goal is not to "win" every exchange but to demonstrate **dialectical control**. You want to show you understand the landscape, that you've anticipated the pushback, and that your conclusion holds even if premises are tweaked. Do not get bogged down in technical semantics if you can pivot back to the metaphysical upshot.

  ---

  ### 1. The "Humean Exit" Objection
  **Likelihood:** Very High (50% of room are Humeans)
  **Damage:** High (Severs your link to the job market relevance)

  **Colleague:** "You've spent a lot of time showing the Conditional Analysis fails. But why should a Humean care? The Best System Account (BSA) doesn't explicitly rely on a reductive analysis of dispositions. We can just be eliminativists about dispositions or treat them as useful fictions. Why does the failure of CA put *pressure* on Humeanism specifically?"

  **Your Reply (2 mins):**
  "That's the crucial pivot point. If the Humean is an eliminativist, they avoid the problem, but at a steep cost. Scientific practice is saturated with dispositional talk—solubility, conductivity, fragility. If the Humean says these are all false or merely instrumental, they lose the claim that Humeanism captures our best science.
  My argument is that to take scientific practice seriously *without* primitive modality, the Humean needs to reduce these dispositional claims to categorical bases + laws. But if the analysis of the disposition itself (via CA) fails, the Humean is left with a gap. They either have to accept primitive dispositions (abandoning strict Humeanism) or deny the reality of properties science relies on. I'm arguing the 'eliminativist' move is too revisionary to be a viable defense of Humeanism as a philosophy *of science*."

  **Honest Weakness:**
  This relies on the premise that Humeanism *must* be a philosophy of science that respects scientific ontology. A hardline Humean (like a Lewisian) might happily bite the bullet and say scientific ontology is folk theory. If they press this, you risk looking like you're dictating terms to science rather than analyzing it.

  ---

  ### 2. The "Strawman" Objection
  **Likelihood:** High (From the Metaphysicians/Dispositionalists)
  **Damage:** Medium (Makes you look behind on literature)

  **Colleague:** "We haven't taken the Simple Conditional Analysis seriously since Johnston and Fara. Manley and Wasserman, among others, have developed sophisticated accounts using quantifiers over stimuli and proportionality constraints that handle finks and masks. Aren't you attacking a ghost? Even if SCA fails, why think *no* reductive analysis works?"

  **Your Reply (2 mins):**
  "I agree SCA is dead. But the sophisticated accounts you mention all rely on a 'ceteris paribus' or 'normal conditions' clause to handle the interference cases. My core contention is that spelling out 'normal conditions' non-circularly is impossible.
  To specify the conditions under which a glass breaks when struck, without referencing the breaking itself or the disposition of fragility, you end up listing every possible fink and mask. That list is either gerrymandered or it implicitly references the very dispositional structure you're trying to reduce. So, while Manley and Wasserman avoid the *logical* contradiction of SCA, they don't achieve the *reductive* ambition the Humean needs. They push the modality back into the 'normality' clause."

  **Honest Weakness:**
  Manley and Wasserman proponents might argue their account *isn't* reductive in the way you demand, or that 'normality' can be fixed statistically. If a dispositionalist in the room has a specific paper on statistical normality, they could corner you on the definition of "gerrymandered."

  ---

  ### 3. The "Counterfactual Logic" Objection
  **Likelihood:** Medium (From the 2 Epistemologists)
  **Damage:** Medium (Can derail the talk into semantics)

  **Colleague:** "You're treating the counterfactual in the conditional analysis as if its truth value is straightforward. But in a fink case, the disposition disappears *before* the manifestation. Depending on your semantics for counterfactuals (Lewisian vs. otherwise), the conditional might still come out true or false differently. Are you assuming a specific semantics here, or is this a metaphysical point about truthmakers?"

  **Your Reply (2 mins):**
  "This is a metaphysical point about truthmakers, not merely semantic. Even if we tweak the semantics to make the counterfactual come out 'true' in a fink case, we lose the explanatory link. The Humean wants the disposition to be *nothing over and above* the categorical base and the counterfactual.
  But in a fink case, the object has the base, but the counterfactual fails (or holds vacuously) for reasons extrinsic to the base. If the truth of the conditional depends on extrinsic factors (like the wizard's intervention), then the disposition isn't intrinsic to the object. If the Humean accepts extrinsic dispositions, they lose the local supervenience base they typically require. So regardless of the semantics, the *reductive structure* collapses."

  **Honest Weakness:**
  Epistemologists love logic puzzles. If they press you on *which* semantics you are presupposing, you might get stuck. You are betting that the metaphysical upshot matters more than the semantic machinery, which they might dispute.

  ---

  ### 4. The "So What?" Objection
  **Likelihood:** Medium (From the Skeptics/Generalists)
  **Damage:** Low/Medium (Questions the contribution)

  **Colleague:** "Let's grant you that CA fails and Humeanism has a problem. Dispositional Essentialism (DE) has its own well-known issues with explaining the contingency of laws and quiddistic worries. If you break the Humean account but don't fix the Dispositionalist one, what's the positive takeaway? Are we just stuck?"

  **Your Reply (2 mins):**
  "That's a fair worry. I'm not arguing DE is the automatic winner. My goal is to clear the field of the idea that Humeanism is the 'default' low-cost option. Often, Humeanism is chosen because it promises a reductive, modality-free ontology.
  If I'm right, that promise is illusory. The cost of Humeanism is higher than advertised because it can't account for the dispositions science posits. This levels the playing field. It forces the debate to be about which primitive modality we prefer, rather than whether we can have one without the other. My positive takeaway is methodological: stop looking for a free lunch on modality."

  **Honest Weakness:**
  This is a defensive answer. It admits you don't have a full positive system. On the job market, some committees want a "builder," not just a "critic." You need to deliver this with confidence so it sounds like a strategic limitation, not a gap in your research.

  ---

  ### 5. The Dreaded Question
  **The Question You Hope Nobody Asks:**
  **Colleague (likely the Dispositional Essentialist):** "You've argued that Humeanism fails because it can't reduce dispositions without primitive modality. Does this mean you endorse Dispositional Essentialism? If so, how do you answer the objection that DE makes laws necessary, contrary to scientific practice? If not, what is your positive account of laws?"

  **Why it's dreaded:**
  *   If you say **Yes (I am a DE):** The Humeans (50% of the room) will attack you on the necessity of laws. You might alienate potential letter writers who are Humeans.
  *   If you say **No (I am a Skeptic):** The Metaphysicians will ask why you are doing metaphysics if you deny the tools.
  *   If you say **"I'm working on it":** You look unprepared for the job market.

  **Your Prepared Reply (2 mins):**
  "I'm cautious about endorsing full-blooded Dispositional Essentialism, specifically regarding the necessity of laws. I think the failure of CA shows that dispositions are real and irreducible, but that doesn't automatically entail that the *laws* governing them are metaphysically necessary.
  There is room for a view where dispositions are primitive but the manifestation relations are contingent. So, I'm arguing for a non-Humean realism about dispositions, but I'm agnostic on the modal strength of the resulting laws. My dissertation focuses on clearing the Humean obstacle; the next phase of my research develops the positive account of how irreducible dispositions interact without collapsing into necessitarianism."

  **Honest Weakness:**
  This is a tightrope walk. It risks satisfying no one. The DE proponent will think you don't understand the link between powers and laws. The Humeans will think you're smuggling in modality anyway. However, it buys you time by framing the positive view as "future work" while committing you to a middle-ground realism. **Practice this delivery until it sounds confident, not hesitant.**
