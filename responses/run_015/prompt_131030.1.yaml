answer: |-
  Here is your Q&A prep sheet. I've ordered these by how the seminar will likely flow: the eager students jump in first, the Director clarifies the technical contribution, and the Mentor saves the metaphysical kill-shot for the end.

  ### **Objection 1: The Bayesian Double-Count**
  **Who:** The Science Kids (2–3 of them, talking over each other)
  **When:** Immediately after you finish.
  **Damage Level:** 🟡 **Medium** (Annoying, but manageable if you don't get bogged down in math).

  **How they'll say it:**
  > "Wait, if we're already doing Bayesian updating, isn't 'friction' just a prior? If a theory is 'stitched together,' wouldn't that just give it a low prior probability? It feels like you're double-counting. We should just stick to likelihoods and priors without adding a whole new norm."

  **Your 2-Minute Reply:**
  "You're right that friction *influences* priors, and I'm not trying to replace Bayes. But Bayes assumes you already *have* the hypotheses to update on. The 'Bad Lot' problem happens when the hypothesis space itself is garbage. Friction isn't a probability number; it's a heuristic for *generating* the hypothesis space. It tells you when a theory is so patched together that it shouldn't even enter the Bayesian calculus as a serious candidate. It's a gatekeeper for the priors, not a competitor to the math."

  **Soft Spot:**
  You are admitting friction maps to priors. If they press on *how* you quantify that prior without circularity, you might wobble.

  **Strategy:** **Concede & Pivot.** Concede that it functions *like* a prior constraint, but hold firm that it is a necessary *pre-probabilistic* norm for theory construction. Don't try to do math on the board; keep it conceptual.

  ***

  ### **Objection 2: The Simplicity/Unification Overlap**
  **Who:** The Seminar Director
  **When:** After the initial buzz settles. She's read the literature; she knows Kitcher, Friedman, and Sober.
  **Damage Level:** 🔴 **High** (Threatens the novelty of your talk).

  **How she'll say it:**
  > "This notion of 'chopping up' explanations sounds remarkably like Philip Kitcher's account of *unification*, or perhaps Friedman's reduction of independent phenomena. If an explanation has high friction because its parts don't 'talk to each other,' aren't you just describing a lack of unification? How is 'friction' distinct from existing simplicity metrics, other than being a new metaphor?"

  **Your 2-Minute Reply:**
  "That's a great connection, and I stand on the shoulders of Kitcher here. But traditional simplicity metrics often count *parameters* or *axioms*. A theory can be syntactically simple but still have high friction. Imagine a single equation that applies to gravity here, but a completely different, unrelated rule for gravity there, even if the equation looks short. Friction measures the *causal connectivity* between the local applications, not just the sentence length. I'm trying to capture the *mechanism* of the stitching, not just the count of the stitches."

  **Soft Spot:**
  Distinguishing "syntactic simplicity" from "causal connectivity" is hard to formalize. If she asks for a formal metric, you might not have one.

  **Strategy:** **Hold Firm but Humble.** Don't claim you've solved unification. Claim you are offering a specific *diagnostic tool* for ad hoc-ness that syntactic counts miss. If she presses for a metric, admit it's a qualitative heuristic for now.

  ***

  ### **Objection 3: The Humean Circle**
  **Who:** The Grad Mentor
  **When:** The final question. He's been quiet, taking notes.
  **Damage Level:** 🟠 **High (Philosophically) / 🟢 Low (Pragmatically)**. It's a deep objection, but in a science seminar, you can plead pragmatism.

  **How he'll say it:**
  > "You claim friction is a 'rational norm.' But how do you justify that norm without assuming the very thing you're trying to prove? You're saying we should prefer low-friction explanations because they've worked before. That's an inductive inference. If Hume is right, you're using induction to justify a rule for induction. It's circular."

  **Your 2-Minute Reply:**
  "I think that's correct if we're looking for a *guarantee* of truth. I'm not offering a guarantee. I'm offering a pragmatic norm for *inquiry*. If we don't use norms like friction, science stalls because every ad hoc patch is treated equally. I'm not justifying induction metaphysically; I'm arguing that if our goal is *understanding* and not just prediction, friction is a necessary rule of the game. It's circular only if you demand a view from nowhere."

  **Soft Spot:**
  You are conceding that you can't prove it leads to truth. If the seminar is about "Truth in Science," this hurts. If it's about "Scientific Practice," you're safe.

  **Strategy:** **Concede the Metaphysics, Hold Firm on Pragmatics.** Do not try to out-Hume Hume. Frame IBE + Friction as a tool for *doing* science, not a proof of *reality*.

  ***

  ### **The One Question You Hope Nobody Asks**
  **The Question:**
  > "If a theory has low friction, it's unified. If it has high friction, it's complex. Isn't 'Explanatory Friction' just **Simplicity in a weird costume**? Why do we need a new word?"

  **Why it hurts:**
  This combines the Director's technical knowledge with the Students' desire for parsimony. If "Friction" is just "Simplicity," your talk title is misleading.

  **Your Emergency Reply:**
  "Simplicity often implies 'fewer parts.' Friction allows for *more* parts, as long as they talk to each other. A complex ecosystem explanation has many parts (high complexity) but low friction because the biology connects to the chemistry connects to the geology. Simplicity would penalize that; Friction rewards the connectivity. So it's not just a costume; it flips the script on what we value."

  **Prep Tip:**
  Practice this distinction **Complexity vs. Friction**.
  *   **Simplicity:** Fewer assumptions.
  *   **Friction:** Higher integration (assumptions can talk to each other).
  *   *Example:* A Rube Goldberg machine is complex but has *low friction* (everything connects mechanically). A magic box that solves half the problem and a different magic box that solves the other half has *high friction* (no connection), even if the description is short.

  ### **General Advice for Tomorrow**
  1.  **Don't Fake Formalism:** The Bayesian kids will smell blood if you try to write down a "Friction Equation" on the board and it looks shaky. Keep friction as a *qualitative heuristic*.
  2.  **The "Bad Lot" Trap:** Be careful claiming Friction *solves* the Bad Lot problem. It mitigates it. If the whole lot has high friction, you're still stuck. If they catch this, concede: "It doesn't guarantee a good lot exists, but it prevents us from accepting a bad one prematurely."
  3.  **Nervousness Hack:** When you get a tough question, take a sip of water. It buys you 5 seconds to think and makes you look deliberate, not stalled.

  You've got a solid core idea. The "Friction" metaphor is intuitive. Just don't let them force you to formalize it more than you're ready to. Good luck.
