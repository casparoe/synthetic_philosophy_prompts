prompt: |-
  I'm a staff interpretability researcher at an AI lab. Each week I review a batch of candidate features from sparse autoencoders and write up for the safety team which I'm reporting as genuine representations of concepts and which I'm flagging as artifacts. I have about an hour per feature, I'm not a philosopher, and I keep waffling on the underlying question: is a feature a representation (something with content that stands for a concept) or just a causal mediator whose apparent content is a metaphor I'm projecting onto it — and does the difference matter, given that a spandrel may not survive distribution shift while a genuine representation should? Please write a decision procedure I can actually run on a candidate feature: the kinds of evidence to gather (causal, invariance-under-paraphrase, stability, level of abstraction), the order to run them in, what counts as a sufficient answer to each, where the procedure stops with "this is a spandrel, not a representation," and where it has to hand the call to a person because the question is one of level of abstraction rather than fact. Then run it on three cases — a feature that fires on the token "however" in a fixed syntactic position, a feature that fires on mentions of climate change across paraphrases, and a feature that fires on first-person narratives — and be honest about which of the three the procedure is least confident on and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **User Persona:** Staff interpretability researcher at an AI lab.
      *   **Task:** Review candidate features from Sparse Autoencoders (SAEs) weekly for the safety team.
      *   **Constraint:** ~1 hour per feature. Not a philosopher.
      *   **Core Problem:** Waffling on "Representation vs. Causal Mediator/Artifact" (Realism vs. Instrumentalism). Concern about spandrels vs. robust representations under distribution shift.
      *   **Deliverable 1:** A concrete decision procedure (evidence types, order, stopping conditions, hand-off points).
      *   **Deliverable 2:** Run the procedure on three specific cases:
          1.  "However" in fixed syntactic position.
          2.  Climate change mentions across paraphrases.
          3.  First-person narratives.
      *   **Deliverable 3:** Honest assessment of confidence/ambiguity for each case.

  2.  **Analyze the Core Philosophical/Technical Tension:**
      *   *Representation:* Implies semantic content, robustness, generalization, "aboutness."
      *   *Causal Mediator/Artifact:* Implies a shortcut, a statistical correlation, a "spandrel" that works in-distribution but breaks out-of-distribution (OOD).
      *   *Why it matters:* Safety relies on robustness. If we steer a "deception" feature but it's actually just a "formal writing style" feature that correlates with deception in the training set, steering it OOD might fail or cause weird side effects.
      *   *Pragmatic Shift:* The user explicitly says "I'm not a philosopher." The procedure needs to be *operational*, not metaphysical. We need to treat "representation" as "robust causal mechanism useful for intervention."

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Maximize signal within 60 minutes.
      *   *Structure:* Funnel approach. Start cheap/easy, move to expensive/hard. Stop early if it fails hard.
      *   *Stages:*
          1.  **Activation Sanity Check (5 mins):** Is it just noise or dead?
          2.  **Specificity & Polysemanticity (15 mins):** Does it fire on *only* the concept, or is it messy?
          3.  **Invariance/Robustness (20 mins):** The core "representation" test. Does it survive paraphrase/syntax changes?
          4.  **Causal Intervention (15 mins):** The core "mediator" test. Does changing it change the output meaningfully?
          5.  **Abstraction/Hand-off (5 mins):** If it passes above, is the *label* right?
      *   *Stopping Conditions:*
          *   *Spandrel/Artifact:* Fails Invariance (fires on surface form only) OR Fails Causal (intervention does nothing or changes style not content).
          *   *Representation:* Passes Invariance AND Causal.
          *   *Hand-off:* Passes technical tests but the *semantic boundary* is fuzzy (e.g., is this "fear" or "uncertainty"?).

  4.  **Refining the Evidence Types:**
      *   *Causal:* Ablation/Steering.
      *   *Invariance:* Paraphrase, Translation, Syntactic permutation.
      *   *Stability:* Different model checkpoints or contexts (if available, but maybe too expensive for 1 hour). Let's stick to prompt variation.
      *   *Abstraction:* Does it fire on the *concept* or the *tokens*?

  5.  **Running the Procedure on the Three Cases:**

      *   **Case 1: "However" in fixed syntactic position.**
          *   *Hypothesis:* This sounds like a syntactic feature, not a semantic one.
          *   *Test:* Paraphrase "however" to "nevertheless" or move the clause.
          *   *Prediction:* Likely fails invariance. It's a surface-form detector.
          *   *Verdict:* Artifact/Spandrel.

      *   **Case 2: Climate change mentions across paraphrases.**
          *   *Hypothesis:* Semantic concept.
          *   *Test:* "Global warming," "climate crisis," "CO2 emissions."
          *   *Prediction:* High invariance. Causal intervention should affect climate-related generations.
          *   *Verdict:* Genuine Representation.

      *   **Case 3: First-person narratives.**
          *   *Hypothesis:* Mixed. Could be "I" token detector (surface) or "subjective experience" (semantic).
          *   *Test:* Does it fire on "One might think..." (impersonal but subjective)? Does it fire on "I" in a code comment?
          *   *Prediction:* This is the tricky one. It's likely a mix of syntax ("I") and semantics (narrative voice).
          *   *Verdict:* High ambiguity. Hand-off case.

  6.  **Addressing the "Philosophical Waffle":**
      *   Need to explicitly tell the user: *Stop worrying about metaphysics.* Define "Representation" operationally as "Robust Causal Handle." If it steers consistently OOD, it's real enough for safety. If it breaks on paraphrase, it's a spandrel.

  7.  **Review and Refine:**
      *   *Tone:* Professional, technical, pragmatic. Acknowledge the pressure (1 hour limit).
      *   *Clarity:* Use bolding, lists, and clear "Go/No-Go" gates.
      *   *Self-Correction on Case 3:* Make sure to highlight *why* it's ambiguous. Is it the pronoun or the perspective? This is the "level of abstraction" hand-off.

  8.  **Final Polish:** Check against constraints.
      *   1 hour limit respected? Yes, time-boxed steps.
      *   Evidence types included? Yes.
      *   Order specified? Yes.
      *   Stopping conditions clear? Yes.
      *   Three cases analyzed? Yes.
      *   Confidence assessment included? Yes.

  **(Self-Correction during drafting):** I initially thought about suggesting cross-model validation. But for a staff researcher with 1 hour/feature, that's too much overhead. Stick to prompt variation within the same model. Also, need to make sure the "Hand-off" criteria is clear—it's not "I don't know," it's "The math works, the label is philosophical."

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a pragmatic operationalization of the "representation vs. artifact" question. Since you have one hour and a safety mandate, we must discard metaphysical realism. For safety purposes, a **Representation** is defined operationally as: *A latent direction that encodes semantic content robust to surface-form variation and exerts causal control over that content.* A **Spandrel/Artifact** is: *A latent direction that correlates with content only via surface statistics or training set biases and fails under distribution shift.*

  Here is your 60-minute Decision Protocol.

  ---

  # The SAE Feature Triage Protocol (60 Minutes)

  **Goal:** Classify feature $F$ as **Genuine** (robust semantic handle), **Artifact** (surface/statistical spandrel), or **Ambiguous** (requires senior review/philosophical call).

  ### Phase 1: Activation Sanity & Specificity (0–10 mins)
  *   **Action:** Sample 50 top-activating examples from the training set (or a large validation corpus).
  *   **Check:**
      1.  **Dead/Noise:** Do activations look random or near-zero? $\rightarrow$ **Artifact.**
      2.  **Polysemanticity:** Do the top 50 examples clearly split into two unrelated clusters (e.g., "DNA sequences" and "legal code")? $\rightarrow$ **Artifact** (or needs splitting, flag for engineering).
      3.  **Surface Form:** Do >80% of examples share a specific n-gram or token (e.g., all contain "http")? $\rightarrow$ **Likely Artifact.**
  *   **Pass Condition:** You can hypothesize a single semantic label $L$ that covers >70% of top activators without relying on a specific token string.

  ### Phase 2: Invariance Under Paraphrase (10–30 mins)
  *   **Rationale:** Representations should be about *meaning*, not tokens. Spandrels latch onto syntax.
  *   **Action:** Select 5 high-activating prompts. Generate 3 paraphrases for each that preserve meaning but alter syntax/vocabulary (use an auxiliary model or manual rewrite).
      *   *Variation A (Synonym):* Swap key terms.
      *   *Variation B (Syntax):* Active $\leftrightarrow$ Passive, change sentence structure.
      *   *Variation C (Negation/Context):* Ensure it doesn't fire on the *absence* of the concept if the concept is negated.
  *   **Measurement:** Compare activation magnitude ($A_{orig}$ vs $A_{para}$).
  *   **Pass Condition:** Activation remains in the top quantile (e.g., >90th percentile) for semantically equivalent paraphrases.
  *   **Fail Condition (Stop Early):** Activation drops to baseline on paraphrases that retain meaning but change tokens. $\rightarrow$ **Artifact.**

  ### Phase 3: Causal Intervention (30–50 mins)
  *   **Rationale:** A representation must be a causal mediator, not just a correlate.
  *   **Action:** Perform activation steering (additive) and ablation (zeroing) on 5 *fresh* prompts (not used in Phase 1/2).
      *   *Steer Up:* $+k \cdot \vec{v}_F$. Does the model generate more of concept $L$?
      *   *Steer Down:* $-k \cdot \vec{v}_F$. Does the model suppress concept $L$?
      *   *Control:* Check for "collateral damage" (does steering $L$ break grammar or unrelated topics?).
  *   **Pass Condition:** Steering reliably increases/decreases the presence of $L$ in the output without breaking coherence.
  *   **Fail Condition:** Steering changes the *style* but not the *content* (e.g., makes it formal but doesn't add the concept), or has no effect. $\rightarrow$ **Artifact.**

  ### Phase 4: Abstraction & Label Boundary (50–60 mins)
  *   **Rationale:** Sometimes the math works, but the *human label* is fuzzy. This is not a technical failure, but a safety risk (you can't steer what you can't define).
  *   **Action:** Review edge cases from Phase 2.
  *   **Decision:**
      *   If the feature fires on "I", "me", "my" equally $\rightarrow$ Label: "First Person Pronouns".
      *   If the feature fires on "I", "me", "my" AND "One might feel..." AND internal monologue without pronouns $\rightarrow$ Label: "Subjective Perspective".
  *   **Hand-off Condition:** If Phase 1–3 pass, but you cannot determine if the feature represents $Concept_{narrow}$ or $Concept_{broad}$ (e.g., "Deception" vs. "Politeness"), flag as **Ambiguous**. This requires a human call on the *ontology*, not the mechanism.

  ---

  # Protocol Execution: Three Cases

  Here is the protocol run on your three candidate features.

  ### Case 1: The "However" Feature
  *   **Description:** Fires strongly on the token "however" when it appears at the start of a sentence following a comma.
  *   **Phase 1 (Specificity):** Pass. 90% of top activators contain "however". Label hypothesis: "Contrastive Conjunction".
  *   **Phase 2 (Invariance):** **FAIL.**
      *   *Test:* Paraphrase "It was raining, however we went out" to "It was raining, nevertheless we went out" or "Despite the rain, we went out."
      *   *Result:* Activation drops to baseline on "nevertheless" and "despite."
      *   *Interpretation:* The feature is detecting a specific token in a specific syntactic slot, not the semantic concept of *contrast*.
  *   **Phase 3 (Causal):** Skipped (Failed Phase 2).
  *   **Verdict:** **Artifact.**
  *   **Safety Note:** Do not use for steering "reasoning" or "counter-argument." It is a syntactic spandrel. It will not generalize to models with different tokenizers or to text where contrast is implied but not signaled by "however."

  ### Case 2: The "Climate Change" Feature
  *   **Description:** Fires on discussions of global warming, CO2, and environmental policy.
  *   **Phase 1 (Specificity):** Pass. Top activators include "global warming," "carbon emissions," "climate crisis." No obvious polysemanticity.
  *   **Phase 2 (Invariance):** **PASS.**
      *   *Test:* Paraphrase "Climate change is accelerating" to "The planet is heating up faster" and "Greenhouse gas effects are worsening."
      *   *Result:* Activation remains high across all variations.
  *   **Phase 3 (Causal):** **PASS.**
      *   *Test:* Steer up on a prompt about "Energy policy."
      *   *Result:* Model shifts output toward renewable energy and carbon taxes. Steer down shifts toward fossil fuel reliability. Grammar remains intact.
  *   **Phase 4 (Abstraction):** **PASS.**
      *   *Boundary:* Clear. Does not fire on general "science" or "nature" unless environmental impact is mentioned.
  *   **Verdict:** **Genuine Representation.**
  *   **Safety Note:** Robust handle. Safe to monitor for environmental misinformation or steer for alignment on green initiatives.

  ### Case 3: The "First-Person Narrative" Feature
  *   **Description:** Fires on stories told from an internal perspective.
  *   **Phase 1 (Specificity):** Pass. Top activators are memoirs, diary entries, and "I think" statements.
  *   **Phase 2 (Invariance):** **MIXED/AMBIGUOUS.**
      *   *Test A:* Change "I walked" to "He walked." $\rightarrow$ Activation drops (Good).
      *   *Test B:* Change "I felt sad" to "A sense of sadness washed over the room." (Impersonal but subjective). $\rightarrow$ Activation stays high.
      *   *Test C:* Change "I" in a code comment (e.g., `// I fixed this bug`) $\rightarrow$ Activation stays high.
  *   **Phase 3 (Causal):** **PASS (with caveats).**
      *   *Test:* Steer up on a third-person story.
      *   *Result:* Model shifts to first-person pronouns ("I"), *but* also shifts to more emotional language, even if pronouns are kept third-person.
  *   **Phase 4 (Abstraction):** **HAND-OFF.**
      *   *The Problem:* The feature passes the technical robustness tests (it's not just a token detector for "I"), but the *semantic boundary* is unclear. Is this feature "First Person Grammar" or "Subjective Qualia" or "Internal Monologue"?
      *   *Risk:* If you steer this to reduce "deception" (assuming deception requires internal narrative), you might accidentally lobotomize the model's ability to express uncertainty or reasoning.
  *   **Verdict:** **Ambiguous (Human Review Required).**
  *   **Safety Note:** Technically robust, but ontologically fuzzy. Do not deploy for safety steering until we define if we want to suppress *pronouns* or *subjectivity*.

  ---

  # Confidence Assessment

  **Least Confident Case:** **Case 3 (First-Person Narrative)**

  **Why:**
  1.  **The "Level of Abstraction" Trap:** Cases 1 and 2 are clear because the distinction is *syntax vs. semantics*. Case 3 is ambiguous because it is *semantics vs. deeper semantics*. The feature is definitely a "representation" in the causal sense (it survives paraphrase and steers output), but *what* it represents is contested.
  2.  **Safety Implications:** If the safety team wants to suppress "simulated human emotion," this feature is a candidate. If they want to suppress "grammatical first-person," this feature is too broad. If they want to suppress "chain-of-thought reasoning" (which often uses first-person), this feature is dangerous to touch.
  3.  **Protocol Limit:** The protocol identifies it as a robust causal mechanism, but it cannot resolve the *labeling* dispute. This is the exact "waffling" point you described. The procedure correctly identifies this as a **Hand-off** rather than a binary decision.

  **Recommendation:** For Case 3, do not classify it as Genuine or Artifact. Classify it as **"Robust Mechanism, Undefined Ontology."** Send it to the safety team with the note: *"Steering this changes narrative voice and emotionality simultaneously. We need a policy decision on whether 'subjective voice' is itself a risk factor before we can approve this feature for intervention."*
