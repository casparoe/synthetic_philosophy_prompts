  c. An ideal intervention on C must not affect E via paths bypassing C. The only candidate, external G-stimulation, fails because it affects E via D, violating the exclusion condition. Pharmacological isolation is nomologically impossible per stipulation. Lowering C via polarity reversal also activates D, failing the range requirement. Since no valid intervention exists, the account returns no verdict. The failure is metaphysical, rooted in nomological constraints on variable isolation.

  d. The feature is nomological fat-handedness. If C were isolatable, interventionism would agree.

  e. The interventionist replies that causation is defined by manipulability; unisolable variables aren't causes relative to the model. The counterfactualist argues causation is objective dependence, not experimental access. The disagreement persists on whether causation is mind-independent. Allowing impossible interventions undermines interventionism's empirical point, but denying them excludes real causes.

  f. They miss that demanding manipulability can erase genuine dependencies.
