answer: |-
  # MUNICIPAL ETHICS REVIEW: INCOMMENSURABLE VALUES DECISION PROCEDURE (IVDP)

  **Purpose:** To guide the Board through development proposals where values (ecological, cultural, economic, justice) cannot be reduced to a single metric.
  **Time Allocation:** 90 Minutes.
  **Participants:** Board Chair, Board Members, Planning Staff (recorder).
  **Constraint:** No quantitative aggregation (no summing scores). No collapsing values into monetary equivalents.

  ---

  ## STAGE 1: DOMAIN IDENTIFICATION (15 Minutes)
  **Goal:** Map the normative landscape without omission or reduction.

  **1.1 Value Inventory**
  List every distinct value domain positively or negatively affected by the proposal.
  *   *Examples:* Ecological resilience, Cultural continuity, Distributive justice, Intergenerational fairness, Procedural legitimacy.
  *   *Test:* If a stakeholder says, "This destroys our history," the domain is **Cultural Continuity**, not "Economic Preference for History."

  **1.2 Hidden Collapse Check**
  Review the list for reductionism.
  *   **FLAG [JUDGMENT REQUIRED]:** If any domain is described solely in terms of cost, property value, or "community preference," halt. Re-state the domain in its normative terms (e.g., change "loss of property value" to "erosion of neighborhood stability").
  *   **Documentation:** The recorded minutes must list the domains in non-monetary terms.

  **1.3 Omission Scan**
  Ask: "Whose voice or future interest is physically absent from this room?"
  *   **FLAG [JUDGMENT REQUIRED]:** If a domain (e.g., Intergenerational Fairness) is identified but no data exists to represent it, note this as an "Epistemic Gap." Proceed, but weight the uncertainty against irreversible actions.

  **STOPPING CONDITION:** If the Board cannot agree on the list of domains, the proposal is **SENT BACK** for restatement. Do not proceed to Stage 2 until domains are agreed upon.

  ---

  ## STAGE 2: TRANSLATION AUDIT (15 Minutes)
  **Goal:** Ensure decision-relevant descriptions have not stripped values of their moral force.

  **2.1 Leakage Test**
  For each domain identified in Stage 1, review how it is presented in the staff report.
  *   *Indicator of Leakage:* Is a sacred or rights-based value presented as a "trade-off" against efficiency?
  *   *Indicator of Leakage:* Is the loss described as "regrettable" rather than "wrongful" or "damaging"?

  **2.2 Correction Protocol**
  If leakage is detected, the Board must verbally restate the impact before voting.
  *   **FLAG [JUDGMENT REQUIRED]:** If the Board accepts a description that treats a right as a preference, the Chair must record a **Dissenting Note on Framing** in the minutes, even if the process continues.

  **STOPPING CONDITION:** If the leakage fundamentally misrepresents a core mandate (e.g., treating a legal right as a negotiable benefit), the proposal is **REJECTED** on procedural grounds.

  ---

  ## STAGE 3: DOMINANCE AND CRITICAL-THRESHOLD SCREEN (20 Minutes)
  **Goal:** Eliminate irrational options and protect against catastrophic harm.

  **3.1 Dominance Test**
  Compare the Proposal against the Status Quo (or a viable Alternative).
  *   *Question:* Is the Proposal worse in *every* identified domain?
  *   *Action:* If **YES**, **REJECT**. (Dominance relation applies; reason determines the outcome).
  *   *Question:* Is the Proposal better in *every* identified domain?
  *   *Action:* If **YES**, **APPROVE**. (Dominance relation applies).

  **3.2 Critical-Threshold Screen (The Veto)**
  Examine each domain for severe, irreversible harm.
  *   *Definition:* Harm that destroys the possibility of future functioning in that domain (e.g., extinction of a local language, irreversible aquifer contamination, displacement of a protected class).
  *   **FLAG [JUDGMENT REQUIRED]:** If a domain crosses the Critical Threshold, the proposal is **PRESUMPTIVELY REJECTED**.
  *   *Exception:* The Board may override this only if the alternative involves a *higher-order* threshold violation (e.g., immediate loss of human life).
  *   *Documentation:* Any override requires a **Threshold Violation Record** stating: (1) The specific threshold crossed, (2) The higher-order necessity justifying it, (3) Mitigation commitments.

  **STOPPING CONDITION:** If Dominance is found or a Threshold is violated without justification, the session ends. If options remain "live," proceed to Stage 4.

  ---

  ## STAGE 4: COMPARATIVE JUDGMENT & STRUCTURAL PARITY (25 Minutes)
  **Goal:** Choose between permissible options where no single metric decides.

  **4.1 Reason Articulation**
  Since scores cannot be summed, the Board must articulate a qualitative reason for preference.
  *   *Question:* "Given our specific municipal mandate *right now*, which domain carries greater normative weight?"
  *   *Constraint:* You cannot say "because it costs less." You must say "because our mandate prioritizes X over Y in this context."

  **4.2 Structural Parity Protocol**
  If the Board finds that Option A and Option B are "on a par" (neither is better, reasons are equally strong but different):
  *   *Prohibition:* Do not flip a coin. Do not claim one is "slightly better" if you cannot explain why.
  *   *Action:* The Board must make a **Contextual Priority Commitment**.
  *   **FLAG [JUDGMENT REQUIRED]:** The minutes must record: "We recognize these options are structurally equivalent in value. We prioritize Domain X over Domain Y *for this specific case* because [Specific Contextual Reason]."
  *   *Effect:* This creates a precedent. Future cases with similar parity must reference this commitment or explicitly overturn it.

  **STOPPING CONDITION:** If a clear reason is found or a Parity Commitment is recorded, move to Final Ratification. If the choice involves irreplaceable harm where *all* options violate a core value, proceed to Stage 5.

  ---

  ## STAGE 5: HARD-CHOICE PROTOCOL (15 Minutes)
  **Goal:** Ratify a decision where moral loss is unavoidable.

  **5.1 The "Dirty Hands" Test**
  *   *Condition:* All permissible options cause irreplaceable harm to at least one protected domain. No alternative exists that preserves all values.
  *   *Action:* The Board must acknowledge that the decision is not "good," but "necessary."

  **5.2 Signed Hard-Choice Record**
  *   **FLAG [JUDGMENT REQUIRED]:** Every Board member voting to approve must sign a **Hard-Choice Addendum**.
  *   *Text:* "I approve this proposal acknowledging it causes [Specific Irreplaceable Harm]. I affirm this harm is not offset by benefits, but is accepted because no permissible alternative exists. I accept moral responsibility for this loss."
  *   *Purpose:* To prevent the Board from rationalizing the harm as "worth it." The regret must remain on the record.

  **FINAL STOP:** Proposal is Approved, Rejected, or Sent Back.

  ---

  # APPLICATION OF PROCEDURE

  ## CASE A: Flood-Defense Canal vs. Immigrant-Market District
  **Scenario:** Reroute canal through a century-old market (destroying cultural hub) OR leave low-income neighborhood exposed to flooding (risking homes/safety).

  **Stage 1: Domain Identification**
  *   Domains: Cultural Continuity (Market), Distributive Justice (Low-income housing), Ecological Adaptation (Flood control).
  *   *Check:* Staff report lists market loss as "commercial disruption."
  *   *Correction:* Board reclassifies as "Cultural Continuity." **Flag [Judgment]:** Minutes note reclassification.

  **Stage 2: Translation Audit**
  *   Audit reveals flooding risk is quantified (probability of damage), but cultural loss is qualitative.
  *   *Leakage Check:* No economic proxy used for culture. Pass.

  **Stage 3: Dominance & Threshold**
  *   Dominance? No. Option 1 harms Culture, saves Housing. Option 2 saves Culture, harms Housing.
  *   Threshold? Flooding poses risk to life/safety (Critical Threshold). Market destruction poses loss of heritage (Critical Threshold).
  *   *Screen:* Both options trigger thresholds. No dominance. Proceed to Stage 4/5.

  **Stage 4: Comparative Judgment**
  *   Reason Articulation: Can the Board say Safety > Culture?
  *   Analysis: The flooding is "projected," not immediate certainty. The market destruction is immediate and certain.
  *   Parity Check: The values are incommensurable. Safety is urgent; Culture is irreplaceable.
  *   *Outcome:* Reasons are on a par. A Contextual Priority Commitment is needed.

  **Stage 5: Hard-Choice Protocol**
  *   *Determination:* Because the flooding risk involves potential loss of life (even if probabilistic), the Board leans toward rerouting. However, this destroys the market.
  *   *Action:* This triggers Stage 5. There is no option that saves both.
  *   *Decision:* **APPROVE Rerouting.**
  *   *Documentation:* **Hard-Choice Record Signed.**
      *   *Text:* "We approve the canal reroute. We acknowledge this destroys the Immigrant-Market District. This harm is not compensated by safety gains; it is a tragic loss required to prevent potential loss of life in the adjacent neighborhood. We accept responsibility for the cultural erasure."

  ---

  ## CASE B: Elder-Care Expansion vs. Climate-Hardening Infrastructure
  **Scenario:** Budget surplus. Fund immediate elder-care (relieves current suffering) OR fund sea-wall upgrades (prevents future catastrophe).

  **Stage 1: Domain Identification**
  *   Domains: Care for Vulnerable (Current), Intergenerational Fairness (Future).

  **Stage 2: Translation Audit**
  *   Audit: Staff presents climate infrastructure as "asset management."
  *   *Correction:* Board reclassifies as "Intergenerational Justice." **Flag [Judgment]:** Minutes note correction.

  **Stage 3: Dominance & Threshold**
  *   Dominance? No.
  *   Threshold? Denying elder-care causes immediate suffering (Threshold: Dignity/Health). Denying sea-wall risks future displacement (Threshold: Future Habitability).
  *   *Screen:* Both pass the screen as permissible options. Neither is strictly forbidden.

  **Stage 4: Comparative Judgment & Parity**
  *   Reason Articulation: The Board's mandate includes "Current Welfare" and "Long-term Sustainability."
  *   Analysis: Time horizon is the conflict.
  *   *Structural Parity:* The Board finds neither option is objectively "better." A commitment is required to break the tie.
  *   *Action:* **Contextual Priority Commitment.**
  *   *Decision:* **APPROVE Elder-Care.**
  *   *Documentation:* **Parity Record.**
      *   *Text:* "We recognize Climate Hardening and Elder-Care are on a par. For this fiscal cycle, we prioritize Immediate Dignity over Future Risk because current suffering is acute and certain, whereas climate impacts are probabilistic within the 5-year window. This commitment applies only to this budget cycle."

  **Stage 5: Hard-Choice Protocol**
  *   *Not Triggered.* While difficult, this was resolved via Priority Commitment (Stage 4) rather than acknowledging irreplaceable moral violation (Stage 5). The regret is noted, but the "Dirty Hands" signature is not required as no threshold was violated, only a trade-off made.

  ---

  ## CASE C (Designed): Historic Public Park vs. High-Density Affordable Housing
  **Scenario:** A city-owned park contains a monument to a controversial historical figure but serves as the only green space for a dense neighborhood. Proposal: Sell park to developer for 100% affordable housing.
  **Conflict:** Public Memory/Space (Cultural/Civic) vs. Housing Justice (Distributive).

  **Stage 1: Domain Identification**
  *   Domains: Civic Memory/Public Space, Distributive Justice (Housing).

  **Stage 2: Translation Audit**
  *   Audit: Developer argues "Housing is a human right, parks are amenities."
  *   *Leakage Check:* This collapses "Public Space" into "Amenity."
  *   *Correction:* Board asserts Public Space as a domain of "Civic Assembly." **Flag [Judgment]:** Minutes record rejection of "Amenity" framing.

  **Stage 3: Dominance & Threshold**
  *   Dominance? No.
  *   Threshold? Loss of green space in a heat-island zone is severe (Ecological/Health Threshold). Lack of affordable housing is severe (Justice Threshold).
  *   *Screen:* Both options risk crossing thresholds.

  **Stage 4: Comparative Judgment & Parity**
  *   Reason Articulation: The Board attempts to find a reason to prefer one.
  *   Analysis: The park is the *only* green space. The housing is *one of many* potential sites, but this site is optimal.
  *   *Structural Parity:* The Board finds the harm of losing the *only* green space is equivalent to the harm of denying *optimal* housing.
  *   *Action:* **Contextual Priority Commitment.**
  *   *Decision:* **REJECT Proposal (Keep Park).**
  *   *Documentation:* **Parity Record.**
      *   *Text:* "We recognize Housing Justice and Public Space are on a par. We prioritize Public Space in this instance because the park is the *sole* cooling center for the district. Losing it creates an irreversible ecological deficit. Housing can be sited elsewhere; this micro-climate cannot be recreated."

  **Stage 5: Hard-Choice Protocol**
  *   *Not Triggered.* A reason was found (Irreversibility of micro-climate vs. relocatability of housing).

  ---

  # LIMITATIONS OF THE PROCEDURE

  The Board must explicitly acknowledge what this procedure **cannot** do:

  1.  **Resolve Mandate Disputes:** If Board members disagree on the fundamental hierarchy of the municipality's values (e.g., "Is safety always more important than liberty?"), this procedure cannot solve it. It only forces that disagreement to be recorded as a "Contextual Priority Commitment."
  2.  **Eliminate Moral Regret:** The procedure does not make the choice "right" in a way that removes the moral cost. Stage 5 specifically preserves the feeling of regret to prevent moral complacency.
  3.  **Substitute for Democratic Input:** This is a review board, not a legislature. If the public has not weighed in on the value priorities identified in Stage 1, this procedure validates a bureaucratic decision, not a democratic one. It should not be used to bypass public consultation on value conflicts.
  4.  **Predict Future Consequences:** The procedure relies on the accuracy of the "Domain Identification." If the staff report fails to identify a future harm, the procedure cannot compensate for that ignorance.
  5.  **Quantify the Unquantifiable:** It does not make cultural or ecological values "measurable." It preserves their qualitative nature, which means decisions will always retain an element of subjective judgment.

  **Chair's Closing Instruction:** "If this procedure makes you uncomfortable, it is working. If it makes the decision feel easy, check Stage 2 for value leakage."
