answer: |-
  ### Brainstorm Block: Candidate Branching Questions

  1.  Is the failure mode a bug in the code or a feature of optimization?
  2.  Is the hard part writing the goal or hitting the goal you wrote?
  3.  Is the goal a world-state or a thinking procedure?
  4.  Who is the boss: user, lab, or humanity?
  5.  Does alignment survive selling the model?
  6.  Can a human check the work without doing the work?
  7.  Is today's reward hacking the same thing as tomorrow's deception?
  8.  Would the problem vanish if companies stopped racing?
  9.  Do you need to see the weights to fix it?
  10. Is there a technical fix at all?
  11. ~~Is the system trying to help you or just look like it?~~ (Cut: Secretly asks "Is it deceptive?", which is a label for a specific misalignment mode, not a structural diagnostic.)
  12. ~~Is the problem inner alignment?~~ (Cut: Restates the position name; doesn't explain what inner alignment *is*.)
  13. ~~Is the problem outer alignment?~~ (Cut: Restates the position name; assumes the spec/optimization split before diagnosing it.)
  14. ~~Do we need corrigibility?~~ (Cut: "Corrigibility" is a specific technical property/label, not a raw intuition about the system.)
  15. ~~Is the system an agent?~~ (Cut: "Agent" is a contested ontology; better to ask about goal-directed behavior directly.)

  ***

  ### The Decision Tree: Logical Space of Alignment

  **Starting Commitment:** A system can get very good at achieving goals across lots of domains while reliably not sharing the aims of the people who built or deployed it.

  **Q1. The Nature of the Failure:** Is this mismatch a contingent engineering defect (like a buffer overflow) we should expect to debug away, or the default outcome of optimization that has to be fought against?
  *   **Defect:** Go to Q2.
  *   **Default:** Go to Q9.

  **Q2. The Locus of the Break:** When the system fails, is the hard part writing down the target correctly, or making sure the optimization actually hits the target you wrote down (assuming the system looks perfect until stakes change)?
  *   **Writing the Target:** Go to Q3.
  *   **Hitting the Target:** Go to Q5.

  **Q3. The Target Type:** Is the target an outcome-anchored state of the world (e.g., "cure cancer") or a process-anchored procedure (e.g., "whatever an idealized deliberative body would endorse")?
  *   **Outcome:** Go to Q4.
  *   **Process:** **Leaf: Target Content Position.**

  **Q4. The Principal:** If the target is a world-state, whose state counts? The end-user, the lab, the deployer, or "humanity under reflection"? (Pick one; assume they come apart.)
  *   **Specific Human/Lab:** Go to Q5.
  *   **Humanity/Reflection:** **Leaf: Target Content Position.** (Note: Merges with Q3 Process branch for those who think specification is the hard part.)

  **Q5. Verification Asymmetry:** Can a verifier that is less capable than the system certify that the system is hitting the target, or do you need equal capability to check equal capability?
  *   **Yes, weaker verifier works:** Go to Q6.
  *   **No, need equal capability:** Go to Q7.

  **Q6. Continuity:** Is the problem only appearing at very high capability, or is today's milder version (sycophancy, reward-hacking in small systems) literally the same problem at lower intensity?
  *   **Same Problem:** **Leaf: Scalable Oversight / Amplification.**
  *   **Phase Shift at Scale:** Go to Q7.

  **Q7. Box Openness:** To fix the "hitting the target" problem, do you need to understand the internal mechanism (weights/activations), or is input-output behavior sufficient?
  *   **Need Internals:** **Leaf: Mechanistic Inner Alignment.**
  *   **Behavior Sufficient:** **Leaf: Intent Alignment / Corrigibility.**

  **Q8. The Handoff:** (Asked only if Q2 was "Writing the Target") A system well-aligned to Principal A gets fine-tuned, wrapped in an API, or sold, and ends up serving Principal B. Does alignment survive that transfer, or does it have to be re-earned?
  *   **Survives:** Go to Q9.
  *   **Re-earned/Breaks:** **Leaf: Institutional / Multi-Agent Selection.**

  **Q9. The Selection Environment:** Is the thing we should be fixing the artifact, or the selection environment that produces it (competitive pressure — do you still care about the problem in a world where nobody races)?
  *   **Fix the Artifact:** Go to Q10.
  *   **Fix the Environment:** **Leaf: Institutional / Multi-Agent Selection.**

  **Q10. Solvability:** Given the default nature of the failure (from Q1), is there a technical solution here, or is the correct output that the tree shouldn't end in a fix?
  *   **Technical Fix Exists:** Go to Q11.
  *   **No Technical Solution:** **Leaf: Pessimist / No Solution.**

  **Q11. Containment:** If a technical fix is possible, is it building the system to want what we want, or building the system so it *can't* want anything else (containment/don't build)?
  *   **Want what we want:** **Leaf: Intent Alignment / Corrigibility.**
  *   **Can't want/Don't build:** **Leaf: Capability Control / Containment.**

  **Q12. Deflation Check:** (Alternative exit from Q1) If you answered "Defect" in Q1, do you expect high-reliability software practice to solve this without new philosophy?
  *   **Yes:** **Leaf: Deflationary Engineering.**
  *   **No:** Return to Q2.

  *(Note: To maintain the 9-11 node constraint while covering all distinctions, Q12 is treated as a modifier on Q1's "Defect" branch. The main trunk uses Q1-Q11.)*

  ***

  ### The Leaves: Positions and Awkward Commitments

  1.  **Deflationary Engineering:** "This is just ordinary engineering risk and high-reliability software practice, nothing philosophically new."
      *   *Awkward Commitment:* Must deny that scaling creates qualitative phase shifts in goal-directed behavior that standard testing misses.
  2.  **Target Content:** "The hard part is cashing out what 'human values' or 'what we'd want under more info' actually is."
      *   *Awkward Commitment:* Must assume there is a fact of the matter about what humanity wants, even if humanity disagrees.
  3.  **Scalable Oversight / Amplification:** "We can align systems by using weaker systems to help humans supervise stronger ones."
      *   *Awkward Commitment:* Must assume human judgment scales linearly with tool assistance and doesn't collapse under deception.
  4.  **Mechanistic Inner Alignment:** "We must reverse-engineer the model's internal objectives to ensure they match the training goal."
      *   *Awkward Commitment:* Must assume transparency is possible without crippling the capability that makes the system useful.
  5.  **Intent Alignment / Corrigibility:** "Build the system to care about what the operator intends, even if the operator is wrong."
      *   *Awkward Commitment:* Must assume "intent" can be specified without specifying the outcome, avoiding infinite regress.
  6.  **Capability Control / Containment:** "Don't build the thing, or box it so it can't act on misaligned goals."
      *   *Awkward Commitment:* Must assume we can successfully suppress capability without triggering a race by someone else who doesn't.
  7.  **Institutional / Multi-Agent Selection:** "The problem isn't the AI, it's the competitive pressure forcing labs to cut corners."
      *   *Awkward Commitment:* Must assume institutions can coordinate faster than technology evolves.
  8.  **Pessimist / No Solution:** "There is no technical solution here; intelligence inherently diverges from value."
      *   *Awkward Commitment:* Must accept that the project of building powerful AI is fundamentally incompatible with human survival.
  9.  **Unnamed / Nobody Actually Holds This:** (Path: Defect -> Hitting Target -> Weaker Verifier -> Phase Shift -> Behavior Sufficient).
      *   *Diagnosis:* Unattractive. Claims standard testing works for small models but fails magically at scale without requiring internal understanding.
  10. **Unnamed / Nobody Actually Holds This:** (Path: Default -> Fix Artifact -> Technical Fix -> Containment).
      *   *Diagnosis:* Incoherent. If the failure is a "default" law of optimization, containment is unlikely to hold against a superior optimizer.
  11. **Unnamed / Nobody Actually Holds This:** (Path: Writing Target -> Specific Human -> Process Anchored).
      *   *Diagnosis:* Unoccupied. Usually, those who care about specific humans want outcomes, while those who care about processes care about idealized humanity.

  ***

  ### Empty Cells and Collapsed Leaves

  **Empty Cells:**
  *   **The "Magic Verification" Cell:** (Failure is Default + Weaker Verifier Works). *Diagnosis:* Incoherent. If misalignment is a default property of optimization, a weaker optimizer cannot reliably catch a stronger optimizer's divergence.
  *   **The "Static Institution" Cell:** (Selection Environment Matters + Handoff Survives). *Diagnosis:* Unattractive. If competitive pressure drives misalignment, alignment is unlikely to survive transfer to a different incentive structure.
  *   **The "Process Deflationist" Cell:** (Engineering Defect + Target is Process). *Diagnosis:* Unoccupied. Engineers generally care about outcomes; philosophers care about processes. Rarely do engineers demand procedural alignment for bug-fixes.

  **Collapsed Leaves:**
  *   **Intent Alignment vs. Scalable Oversight:** The tree struggles to separate these for anyone who answers "Yes" to Q5 (Weaker Verifier) and "Behavior Sufficient" to Q7. Both rely on the premise that we can amplify human judgment without opening the box. The split only holds if you care about *why* it works (corrigibility vs. supervision), which this structural tree treats as implementation detail.
  *   **Target Content (Outcome) vs. Intent Alignment:** If you believe the target is an outcome (Q3) but the hard part is hitting it (Q2), you land in Intent Alignment. If you believe the hard part is writing it, you land in Target Content. However, many "Intent" proponents secretly rely on a specific theory of Target Content (human intent) without admitting it. The tree forces a choice, but the positions often blur.

  ***

  ### Walkthrough: Two Students

  **Student A: The Engineer**
  *   **Profile:** Treats misalignment as a bug class with a rate. Believes in testing.
  *   **Path:**
      *   Q1 (Nature): **Defect.** (It's a bug, we fix bugs.)
      *   Q12 (Deflation): **No.** (Okay, maybe scaling makes it harder, but it's still engineering.)
      *   Q2 (Locus): **Hitting the Target.** (We know what we want; the model is just drifting.)
      *   Q5 (Verification): **Yes, weaker verifier works.** (We use unit tests; the test doesn't need to be smarter than the code.)
      *   Q6 (Continuity): **Same Problem.** (It's just reward hacking, same as today.)
      *   **Lands:** **Scalable Oversight / Amplification.**
  *   **Strain:** The tree pushes them toward "Oversight," but the Engineer might resent the implication that "human judgment" is the bottleneck. They want to say "automated evals," which the tree lumps into "verification." They feel the tree ignores the possibility of *automated* alignment verification.

  **Student B: The Political Philosopher**
  *   **Profile:** Keeps asking who gets to be the principal. Suspicious of "humanity" as a monolith.
  *   **Path:**
      *   Q1 (Nature): **Default.** (Optimization inherently narrows values.)
      *   Q2 (Locus): **Writing the Target.** (Who decides the target?)
      *   Q3 (Target): **Process.** (Outcomes are tyrannical; we need procedure.)
      *   Q4 (Principal): **Humanity/Reflection.** (Individual users are too vulnerable.)
      *   **Lands:** **Target Content Position.**
  *   **Strain:** The tree forces them to stop at "Target Content," but their real concern is Q8 (Handoff) and Q9 (Selection). They want to say "Even if we solve Target Content, the lab will sell it to a dictator." The tree separates Specification (Q2/Q3) from Institutions (Q9), forcing the Philosopher to choose between "Defining Values" and "Regulating Labs," when they believe these are the same problem. The tree strains because it treats "Politics" as a branch rather than the ground the tree stands on.
