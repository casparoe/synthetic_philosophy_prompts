answer: |-
  You are not tracking one question. You are tracking three distinct ethical dimensions that your current one-line policy collapses into a single binary. This is why your gut is balking.

  The three questions you are actually asking are:
  1.  **Semantics:** Is the word being used as a *weapon* (to degrade) or as a *reference* (to describe)?
  2.  **Agency:** Did the speaker *generate* this harm live, or are they *transmitting* an existing artifact?
  3.  **Power:** Does this usage reinforce systemic oppression, or is it an attempt to disarm it (reclamation)?

  Your one-line policy ("No slurs, context irrelevant") is an **operational heuristic**, not a moral theory. It works for liability and simplicity, but it fails your moral intuitions because it treats *reporting* a slur (1) the same as *using* a slur (2).

  To write a policy you can apply on a Tuesday night, you need a principle that separates these dimensions without requiring your volunteers to be sociologists. Here is the smallest set of principles that captures your verdicts.

  ### The Principle: Amplified Agency
  **"The station does not amplify language that degrades protected groups, unless necessary for truth or preserved as historical artifact."**

  To make this actionable, you need three clauses. Each clause is forced by specific cases in your list.

  #### Clause 1: The Necessity Test (Semantics)
  *   **Rule:** You may quote a slur only if omitting it would materially change the truth of a report.
  *   **Forced by:** **Case 2** (News reader saying it unnecessarily) vs. **Case 1** (Reporting graffiti).
  *   **Application:** If a news reader says, "The wall was tagged with the n-word," that is sufficient. If they say, "The wall was tagged with [n-word]," they have failed the necessity test. They are no longer reporting; they are performing.
  *   **Also covers:** **Case 3** (Reading a letter). Quoting a victim's testimony is necessary context. **Case 9 & 10** (Ignorance/Language barrier). These fail the *intent* part of necessity, so they trigger a correction, not a ban.

  #### Clause 2: The Artifact Test (Agency)
  *   **Rule:** You may broadcast recorded content containing slurs, but you may not vocally reproduce them live.
  *   **Forced by:** **Case 4** (Old track) vs. **Case 5** (White DJ singing along).
  *   **Application:** This is the critical distinction. A record is a curated historical document; the DJ is the *curator*. Singing along makes the DJ the *co-creator*. When you play the record, the artist owns the utterance. When you sing along, *you* own the utterance.
  *   **Also covers:** **Case 8** (Comedian). Pre-recorded or scripted sets are artifacts. Live ad-libs by a straight comic are live reproduction (Not Fine).

  #### Clause 3: The Reclamation Limit (Power)
  *   **Rule:** Reclaimed forms may be spoken by members of the targeted group. Presenters must not mimic, invite, or amplify reclaimed usage by out-group members.
  *   **Forced by:** **Case 6** (Black callers) vs. **Case 7** (White caller imitating).
  *   **Application:** This is the hardest one for volunteers. To make it "Tuesday Night safe," you shift the burden: *Callers* are not cut for using reclaimed forms (you don't police caller identity live). *Presenters* are strictly banned from using them, even in jest or song.
  *   **Also covers:** **Case 15** (Anti-white slur). This clause acknowledges that "reclamation" only applies to oppressed groups. A slur against a dominant group is treated as generic hostility (banned, but different weight).
  *   **Also covers:** **Case 11** (Mistaken identity). The malice defines the act, not the target. This falls under "degrades protected groups" based on *intent*.

  #### Clause 4: The Fitness Clause (Institutional Risk)
  *   **Rule:** Use of slurs off-air demonstrates unsuitability for the role of community representative.
  *   **Forced by:** **Case 12** (Private chat).
  *   **Application:** This separates *broadcast content* from *volunteer conduct*. Even if no one heard it on air, the values mismatch removes your license to represent the station.

  ---

  ### The Trade-Offs: What This Principle Can't Keep
  You asked which verdicts this forces you to lose. A principle is a filter; it lets some things through and catches others.

  **1. You lose Case 14 (The Obscure Welsh Slur).**
  *   **Why:** Your gut says "I don't care." The principle says "If it degrades a protected group, it's banned."
  *   **Reason:** You cannot have a policy that relies on the *audience's knowledge* of a slur. If you allow it because "90% don't know," you invite the 10% who do to test the boundary.
  *   **Verdict:** You must ban it, even if it feels silly. Consistency protects the station.

  **2. You lose Case 13 (The "Spaz" Dialect).**
  *   **Why:** You want to go back and forth. The principle forces a "Lowest Common Denominator" rule.
  *   **Reason:** You are streaming globally. If a word functions as a slur for *any* significant portion of your audience (US disabled community), you cannot broadcast it.
  *   **Verdict:** Ban it. Dialect is not a defense for ableist language on a global stream.

  **3. You lose the "Gut Feel" on Case 15 (Anti-White Slur).**
  *   **Why:** You feel it's "not the same kind of thing." The policy must treat it as "Not Fine" to maintain neutrality, but the *sanction* can differ.
  *   **Reason:** A policy cannot easily adjudicate "systemic power" in real-time. It must ban group-based hostility across the board.
  *   **Verdict:** It is banned, but the *response* is education/correction rather than the immediate escalation used for systemic slurs.

  **Coherence Check:**
  Your ordering ("Rather lose 14 than 5", "Rather lose 13 either way than 11") is **coherent**.
  *   **14 < 5:** You prioritize stopping active reinforcement of anti-Black racism (5) over worrying about obscure historical slurs (14). This aligns with the *Power* dimension.
  *   **13 < 11:** You prioritize punishing clear malice (11) over policing ambiguous dialect (13). This aligns with the *Semantics* dimension.
  *   The principle supports this hierarchy. It treats malice (11) as a fireable offense, dialect (13) as a policy violation, and obscure slurs (14) as a policy violation.

  ---

  ### Running the New Cases

  **(a) Straight actor playing a gay character in a period drama saying the f-slur.**
  *   **Verdict:** **Fine (with warning).**
  *   **Reasoning:** This falls under **Clause 2 (Artifact)**. It is a scripted, pre-recorded performance. The actor is not speaking as themselves; they are transmitting a character.
  *   **Caveat:** The show should carry a content warning. The station is curating art, not endorsing the slur.

  **(b) Caller says the n-word explaining why nobody should say it, unprompted.**
  *   **Verdict:** **Not Fine (Cut the audio).**
  *   **Reasoning:** This fails **Clause 1 (Necessity)**. They could have said, "They used the n-word." By saying the word, they moved from *describing* the harm to *replicating* the sound.
  *   **Action:** Producer fades the audio. Presenter corrects: "We don't use that language on air, even in discussion."

  **(c) Caller from the targeted group using slur S with real contempt about another member of that group.**
  *   **Verdict:** **Fine (to air), but Not Fine (behavior).**
  *   **Reasoning:** This is the hardest case. **Clause 3 (Reclamation)** allows them to say the word (you do not police intra-group dynamics). However, **Clause 1 (Semantics)** flags the *contempt*.
  *   **Action:** You do not cut them for the *word*. You may cut them if the *content* becomes harassment or hate speech. The slur itself is not the violation here; the hostility is.

  ---

  ### The Meta-Answer: Is the One-Line Rule Actually Better?

  You asked: *"If the honest answer is that the one-line no-context rule is the right rule for a station even though it's wrong about the phenomenon, say that."*

  **The honest answer is: Yes.**

  Here is the gap between the two:
  *   **The Moral Truth:** Context matters. Intent matters. Power matters. (Your 15 cases prove this).
  *   **The Operational Truth:** Community radio runs on volunteers with varying levels of training, working unsupervised shifts, often under time pressure.

  **Why the One-Line Rule exists:**
  It is not a moral statement; it is a **safety interlock**.
  If you adopt the nuanced policy above, you require every volunteer to be able to distinguish between *Case 4* (Play the record) and *Case 5* (Don't sing along) in real-time. You require them to judge *Case 13* (Is 'spaz' a slur today?) without Google. You require them to assess *Case 7* (Is this caller white or passing?).

  **The Risk of Nuance:**
  If you write the nuanced policy, you create **discretionary risk**.
  *   Volunteer A thinks 'spaz' is fine (UK dialect).
  *   Volunteer B thinks 'spaz' is banned (Ableist slur).
  *   Listener C complains.
  *   Now the station is liable because its policy was ambiguous.

  **The Recommendation:**
  Keep the **One-Line Rule** as the **Public Policy** and the **Operational Default**.
  *"We do not broadcast slurs. Period."*

  But, write the **Nuanced Principles** (above) as an **Internal Guidance Document** for the Policy Committee and Senior Producers.
  *   **Why?** Because when an incident happens (and one will), you need the nuance to adjudicate the *sanction*.
  *   **Example:** Under the one-line rule, Case 9 (12-year-old) and Case 12 (Bigot in chat) both result in "Pulled off air."
  *   **With Internal Guidance:** The 12-year-old gets a gentle off-air conversation with a parent. The Bigot gets banned from the station entirely.

  **The Gap:**
  The gap between the One-Line Rule and the Phenomenon is **Administrative Burden**.
  *   The One-Line Rule offloads the cognitive burden from the volunteer to the rule.
  *   The Nuanced Rule offloads the cognitive burden from the rule to the volunteer.

  **Final Verdict:**
  Write the policy as: *"Do not broadcast slurs. Exceptions for news necessity or historical artifacts require Senior Producer approval."*
  This keeps the "Tuesday Night" safety of the one-liner, but creates a bureaucratic checkpoint (Senior Producer) for the nuanced cases (4, 5, 13). If a volunteer isn't sure, they don't guess—they ask. That is how you keep the moral truth without breaking the operational safety.
