answer: |-
  Epistemic Accessibility is the constraint that determines whether a theory is action-guiding enough to count as ethics, but the jointly unsatisfiable pair is Continuity with Peacetime Self-Defense and Symmetrical Permissions (Moral Equality of Combatants).

  ### The Desiderata

  1.  **Non-Criminalization without Immunity (The Conscript)**
      *   **The Case:** A conscripted teenager on the unjust side shoots at a just combatant in a symmetrical firefight.
      *   **The Requirement:** The theory must explain why this act is not murder (avoiding the harsh Revisionist verdict) without granting the conscript a full moral right to kill (avoiding the Traditionalist verdict of moral equality). It must distinguish between *liability to be killed* and *culpability for killing*. A theory that labels the conscript a murderer fails to account for duress and epistemic limits; a theory that grants him equal permission fails to account for the objective injustice of his cause.

  2.  **Graduated Liability (The Machinist)**
      *   **The Case:** A civilian factory worker manufactures artillery fuses knowing they will be used in an unjust war.
      *   **The Requirement:** The theory must account for causal contribution without collapsing the combatant/civilian distinction entirely. It cannot make liability turn solely on wearing a uniform (Traditionalism), nor can it make every contributor liable simply by raising the probability of harm (radical Revisionism). It must specify a threshold of directness or necessity that distinguishes the machinist from the taxpayer or the voter, preserving a meaningful category of non-liability for civilians.

  3.  **Functional Distinction (The Partisan)**
      *   **The Case:** Irregular fighters who do not wear uniforms but directly engage in hostilities for a just cause.
      *   **The Requirement:** The theory must ground combatant status in function and threat rather than legal privilege. A theory that grants immunity based on uniform-wearing fails to protect just irregulars; a theory that denies liability based on lack of uniform fails to protect civilians from genuine threats. The distinction must track who is doing the harming, not who is licensed by a state.

  4.  **Continuity with Peacetime Self-Defense**
      *   **The Case:** A just combatant kills an unjust combatant who is currently attacking.
      *   **The Requirement:** The theory must either align with standard interpersonal morality (killing is only permissible against those morally liable) or provide a robust justification for why war creates a moral exception. It cannot simply assert that war is different; it must explain the mechanism. If killing is wrong in peacetime against a non-liable aggressor due to epistemic uncertainty, the theory must explain why war changes this calculus.

  5.  **Epistemic Accessibility**
      *   **The Case:** A soldier ordered to deploy cannot know with certainty whether their nation's cause is just.
      *   **The Requirement:** The theory must be actionable by agents who lack a God's-eye view of *jus ad bellum*. A theory that makes permissions depend on objective facts unknowable to the agent fails as a practical ethic. It must provide decision procedures that work under uncertainty, distinguishing between what is objectively permissible and what is subjectively excusable.

  ### The Incompatibility Thesis

  Your hunch is correct: **Continuity with Peacetime Self-Defense** and **Symmetrical Permissions** cannot be jointly satisfied.

  If you maintain Continuity, killing is only permissible against those who are morally liable (i.e., those who threaten unjustly). This entails Asymmetry: just combatants are liable to be killed; unjust combatants are not. Therefore, unjust combatants cannot have a symmetrical permission to kill just combatants, because just combatants are not liable.

  If you maintain Symmetrical Permissions (Moral Equality of Combatants), both sides are permitted to kill each other. This entails that just combatants are liable to be killed by unjust ones. But if just combatants are liable, they have forfeited their right not to be killed, which contradicts the premise that they are fighting justly (and thus not forfeiting rights). To save Symmetry, you must abandon Continuity and argue that war creates a special moral zone where liability is decoupled from justice. You cannot have both the moral logic of self-defense and the symmetric permissions of the battlefield.

  ### The Knockout Requirement

  **Continuity with Peacetime Self-Defense** does the most work to eliminate the main contenders.

  *   **Traditionalism:** Explicitly rejects Continuity. It argues war is a distinct moral sphere where rights are waived by status, not liability. Demanding Continuity eliminates this view immediately.
  *   **Conventionalism/Contractualism:** Explicitly rejects Continuity to save Symmetry. It argues that even if unjust combatants are objectively liable, we should conventionally treat them as equals to limit war's horrors. Demanding Continuity eliminates this view because it prioritizes moral truth over conventional utility.
  *   **Revisionism:** Survives this requirement but collapses under **Epistemic Accessibility**. While Revisionism satisfies Continuity, it fails to provide action-guidance for soldiers who cannot know the objective justice of their cause.

  Continuity is the stronger filter because it forces the abandonment of Moral Equality, which is the core commitment of two out of the three major frameworks. However, because Continuity and Epistemic Accessibility are in tension (Objective Liability is hard to know), no theory currently satisfies the full set.
