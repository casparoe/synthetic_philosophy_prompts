answer: |-
  **Project Title: Cutting the Knot: Predictive vs. Explanatory Reference Classes**

  **1. The Question**
  Everyone treats the reference class problem as a single puzzle: how do we pick the right group to assign a probability to an individual case? My proposal starts from a hunch that this is actually two different jobs wearing the same uniform. There are *predictive* reference classes, like a doctor telling a patient, "People in your class have a 70% survival rate." Then there are *explanatory* reference classes, used when asking, "Why did he die?" when he was in the 70% survival group.

  Philosophers constantly slide between these two contexts. I want to ask whether splitting the problem in two dissolves the classic paradoxes or just relocates them. If the rules for picking a class to predict the future differ from the rules for picking a class to explain the past, then many contradictions might just be category errors. The core question is simple: does distinguishing the job the class is doing solve the logical tension, or is the tension inherent to probability itself?

  **2. Why Standard Answers Leave It Open**
  Traditional approaches, mostly rooted in logical probability and frequentism, try to find the one "correct" reference class objectively. They assume there is a single truth about which class an individual belongs to for probabilistic purposes. This is why the literature stays stuck. When you try to use one set of rules for both forecasting and post-mortem analysis, you get paradoxes.

  For example, standard accounts struggle because they blur prediction and explanation. A class might be statistically robust for predicting an outcome (high correlation) but terrible for explaining it (low causal relevance), or vice versa. By treating them as the same logical animal, existing frameworks force a square peg into a round hole. They look for a universal solution to a problem that might actually be contextual. I argue that until we admit these are seperate tasks, we'll keep chasing a unified theory that doesn't exist.

  **3. The Method: A Six-Month Plan**
  I'm proposing a tight, six-month timeline to test this split without getting lost in the weeds.

  *   **Months 1–2:** I'll focus on the groundwork. I need to map where current literature conflates the two jobs. I'll be reading through the standard treatments of the problem to pinpoint exactly where the slide between prediction and explanation happens.
  *   **Months 3–4:** This is the testing phase. I will run specific paradoxes through the split to see if they hold. I'm starting with the classic Italian-Swede cancer case (where nationality vs. residence changes the stats) and the car-accident guy (where specific causal history clashes with general accident rates). I'll analyze whether treating one as predictive and the other as explanatory resolves the conflict.
  *   **Months 5–6:** Synthesis. I'll draft the framework that sorts these cases by job-type. The goal is to produce a working paper that outlines the criteria for picking classes based on whether you are looking forward or backward.

  **4. Success, Failure, and Scope**
  What counts as success? A framework that successfully sorts the paradoxes by job-type. If I can show that the Italian-Swede case is primarily a predictive confusion while the car-accident case is an explanatory one, and that applying the correct rules dissolves the tension, the project works.

  Total failure looks like this: the split collapses because every prediction secretly hides an explanation. If I find that you can't actually draw a line between the two without losing probabilistic coherence, then the distinction is illusory.

  Is this doable in half a year? Honestly, it's tight. Developing a full metaphysical account of explanation would take years. But I'm not aiming for a final theory of explanation; I'm aiming for a functional distinction that clears up the reference class logjam. For a preliminary framework that shifts the debate, six months is enough. I'm not fooling myself that this will end the discussion, but I think I can show enough promise to justify a deeper dive later.
