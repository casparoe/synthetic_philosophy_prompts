answer: |-
  Dear friend, since our argument stalled because we lacked a shared specification of what a successful account must do, I am writing down the desiderata before we attempt any verdict. The purpose is fixed: the account must be usable from inside the domain by a bounded agent acting in finite time, and it must tell two disagreeing agents whether their disagreement is substantive or merely verbal. To meet this purpose, there are specific cases the account must get right. First, it must handle the reflexive case where whether a gap closes depends on which inventory the agent adopts, because one candidate says the probe that would discriminate is constructible while the other says it is not. This is non-negotiable for us because this is precisely where our discussion broke down, and any account that cannot represent the dependency of evidence on ontology is useless for our problem. Second, it must handle the case of two agents with disjoint but individually penumbral access who disagree with each other, meaning a finite extension of access would close the gap for each, but they currently sit on different data. This is non-negotiable because it tests whether the account can handle social pooling without pretending the agents are already omniscient. Third, it must handle the case of candidates that agree on every probe anyone can actually run but disagree about what would happen under a probe only one of them permits. This is non-negotiable because it distinguishes ontological commitment from empirical equivalence, which is the heart of the dispute about facts of the matter.

  Beyond these cases, the account must preserve certain distinctions without collapsing them. It must distinguish the invisible from the merely unobserved, ensuring that what cannot be seen is not treated as identical to what has not yet been seen. This is a prejudice of the realist camp, but I treat it as non-negotiable for this inquiry because collapsing them eliminates the very notion of inaccessible information we are trying to analyze. It must distinguish gaps that are the agent's fault from gaps in the world, separating cognitive limitation from ontological absence. This is also a realist prejudice, yet non-negotiable here, because blaming the world for the agent's boundedness prevents any analysis of the agent's specific epistemic situation. It must distinguish identification for one agent from identification for a community that pools its access, acknowledging that what exists for me might differ from what exists for us. This is non-negotiable because the embedded perspective requires us to track whose access counts. Finally, it must distinguish settling a question from merely deciding how to act while it is open, ensuring that pragmatic closure does not count as ontological resolution. This is a prejudice against pragmatism, but I insist on it as non-negotiable because our question is about what exists, not what works.

  There are also results the account must not contradict. It must allow that permanent underdetermination can happen, meaning some questions remain open regardless of effort. This is non-negotiable because logical possibility demands we acknowledge scenarios where evidence never arrives. It must also respect that a verdict reached only in the limit is not a verdict an agent ever has on hand. This is non-negotiable for a bounded agent, because asymptotic convergence does not provide the finite-time certainty required for planning and talking now. I suspect there is a tension between the requirement that the account be usable by a bounded agent in finite time and the requirement that it acknowledge asymptotic gaps where verdicts arrive only in the limit. If an agent must act in finite time, they cannot wait for the limit, yet if the account says the fact is only settled in the limit, the agent never has the fact. This tension suggests we may have to accept that some ontological questions are permanently undecided for the agent, even if they are decidable in principle.

  If I had to choose the single requirement that does the most work in ruling out candidates, it is the constraint that the account must be usable from inside the domain by a bounded agent in finite time. This rules out any God's-eye view that assumes access to the absolute truth regardless of evidence, and it rules out any learning-theoretic approach that relies on infinite sequences. Regarding the positions we might adopt, the realist who lets identification outrun evidence fails the finite-time usability constraint because it posits facts the agent cannot verify. The verificationist who ties ontology to accessible difference fails the reflexive case because it cannot handle probes whose possibility depends on the ontology. The pragmatist who weighs the costs of getting it wrong collapses the distinction between settling a question and deciding how to act, which we have ruled out. The structuralist who identifies only up to structure might survive the reflexive case but risks collapsing the invisible with the unobserved if structure is defined only by relations. The learning-theoretic picture that settles for identification in the limit contradicts the requirement that a limit verdict is not a verdict on hand, leaving the agent without guidance in the present. I hope this specification gives us the common ground we lacked, so we can resume without talking past each other.
