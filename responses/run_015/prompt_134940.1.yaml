      *   *Divine Certainty vs. Authorship:* Can God know $X$ will happen without causing $X$? (Hurts Thomism/Calvinism on freedom, Hurts Open Theism on knowledge).
      *   *Prayer/Prophecy:* Does prayer change things? Does prophecy guarantee things? (Hurts Simple Foreknowledge if prayer is efficacious, Hurts Open Theism on specific prophecy).
      *   *Logical Moments:* Is the distinction between natural/middle/free knowledge real or heuristic? (Hurts Molinism if it's just a picture).
      *   *Divine Aseity:* Must God depend on nothing outside Himself (including truths about creatures)? (Hurts Molinism, Helps Thomism).
      *   *Disclosure Case:* Does knowing the CCF change the CCF? (Specific Molinist worry).
