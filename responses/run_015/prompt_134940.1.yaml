  | **1. Truth-Maker Grounding** | **The Grounding Objection:** If a counterfactual of creaturely freedom (CCF) is true prior to creation, what *in reality* makes it true? If the creature doesn't exist yet, and God doesn't determine it, there seems to be no ontological ground for the truth. | **Non-negotiable** for metaphysical realists; **Negotiable** for conceptualists (truths as ideas in God's mind). | **Molinism** (struggles to find ground without God or Creature); **Open Theism** (denies truth exists). | 5, 8 |
  | **2. Libertarian Integrity** | **The Luck Objection:** If a choice is undetermined, is it not merely random chance? An adequate account must explain how an agent is the *source* of the action without prior determining causes, avoiding collapse into luck. | **Non-negotiable** for Libertarians; **Negotiable** for Compatibilists/Theological Determinists. | **Open Theism** & **Molinism** (both typically commit to libertarian freedom). | 3 |
  | **3. Non-Causal Certainty** | **The Authorship Worry:** God must be certain of the outcome (for prophecy/providence) without being the *author* of sin or coercing the will. Knowledge must not entail causation. | **Non-negotiable** for Classical Theism; **Negotiable** for Process/Open Theism (God risks uncertainty). | **Thomism** (accused of making God the cause of all); **Open Theism** (sacrifices certainty). | 2, 5 |
  | **4. Prayer Efficacy** | **Petitionary Prayer:** If God already knows/ordains the future, does prayer *do* anything? The account must explain how prayer is a genuine condition for certain outcomes without changing God's mind essentially. | **Non-negotiable** for Biblical Theism; **Negotiable** for Deism/Strict Determinism (prayer is therapeutic only). | **Simple Foreknowledge** (God knows but can't act on it without circularity); **Thomism** (prayer is ordained, not influential). | 3, 6 |
  | **5. Divine Aseity** | **Metaphysical Independence:** God must depend on nothing outside Himself for His existence or knowledge. If truths about creatures exist independently for God to "look up," His knowledge depends on creation. | **Non-negotiable** for Classical Theism (Augustinian/Thomist); **Negotiable** for Social Trinitarianism/Open Theism (often viewed as Greek prejudice). | **Molinism** (CCFs seem external to God); **Ockhamism** (future truths seem external). | 1, 3 |
  | **6. Logical Moment Ontology** | **The "Moments" Worry:** Is the ordering of Natural/Middle/Free Knowledge real ontological work, or just a heuristic picture? If real, how can there be a "before" and "after" in a simple God? | **Negotiable** (Most Molinists admit it is heuristic); **Non-negotiable** for critics demanding coherence. | **Molinism** (often accused of reifying logical distinctions). | 4, 5 |
  | **7. Reflexive Stability (Disclosure)** | **The Disclosure Case:** If an agent is reliably told what they would freely do in C, does that knowledge alter the conditions of C? A theory must explain if CCFs are stable under revelation to the subject. | **Negotiable** (Often ignored); **Non-negotiable** for robust accounts of self-knowledge. | **Molinism** (CCFs are supposed to be fixed, but agent's knowledge might change the context). | 1, 2 |
  | **8. Bivalence for Indeterminacy (Near-Tie)** | **The Near-Tie Case:** In a truly 50/50 undetermined choice, is there a *fact of the matter* now about what *would* happen? Or is truth valuelessness the honest cost of indeterminacy? | **Non-negotiable** for Logical Determinists/Molinists; **Negotiable** for Open Theists/Aristotelians. | **Open Theism** (denies bivalence); **Molinism** (affirms it, risking Grounding). | 1, 2 |

