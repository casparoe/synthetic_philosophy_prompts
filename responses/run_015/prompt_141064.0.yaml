answer: |-
  # HANDOUT: The Simulation Dial
  **Session:** Does the Simulation Hypothesis (SimH) Deflate Longtermism?  
  **Goal:** Map whether granting 5–10% credence to SimH turns the "fanaticism dial" (small $P \times$ huge $V$) Up, Down, or Neutral.

  ## I. Logical Space Brainstorming
  Before traversing the tree, note the five dimensions driving the分歧 (disagreement):
  1.  **Duration:** Does SimH *truncate* the future (server shutdown) or *amplify* it (recursive sims/cheap compute)?
  2.  **Axiology:** Do simulated minds count as moral patients equally to base-reality minds?
  3.  **Leakage:** Can actions inside the sim causally affect base reality? (Channels: **Blueprint** [policy export], **Resurrection** [upload later], **Resource Grant** [operators award more compute]).
  4.  **Correlation:** Are there many copies of your decision algorithm running in parallel? (Functional Decision Theory).
  5.  **Uncertainty:** Does SimH introduce "fat tails" where tiny probabilities of infinite leverage dominate expected value?

  ---

  ## II. The Decision Tree
  *Start at the top. Answer **Yes** or **No** to move to the next node.*

  **START:** Do you assign >5% credence to "We are currently in a computational simulation"?
  *   **NO** → **Leaf 1: Base-Reality Longtermism** (Business as usual).
  *   **YES** → Go to Q1.

  **Q1:** Is the simulation scheduled to terminate (or become computationally stagnant) within 100 years, regardless of your actions?
  *   **YES** → Go to Q2 (Truncation Path).
  *   **NO** → Go to Q3 (Amplification Path).

  **Q2:** (Truncation) If the sim ends soon, do conscious experiences inside it count equally to those in base reality?
  *   **NO** → **Leaf 2: The Waiting Room** (Fanaticism **DOWN**).
  *   **YES** → Go to Q4.

  **Q3:** (Amplification) Can actions taken inside this simulation causally influence the welfare of beings in base reality (or future sims)?
  *   **NO** → Go to Q5.
  *   **YES (Blueprint/Resurrection)** → Go to Q6.
  *   **YES (Novelty/Interest)** → **Leaf 3: The Drama Hypothesis** (Fanaticism **DISTORTED**).

  **Q4:** (Truncation + Value) Are there many exact copies of your decision algorithm running in parallel simulations?
  *   **NO** → **Leaf 4: Local Utilitarianism** (Fanaticism **DOWN**).
  *   **YES** → **Leaf 5: Correlated Hedonism** (Fanaticism **NEUTRAL**).

  **Q5:** (Amplification + No Leakage) Do simulated minds count morally, and is the sim future potentially infinite (stackable sims)?
  *   **NO** → **Leaf 6: Sim-Nihilism** (Fanaticism **DOWN**).
  *   **YES** → **Leaf 7: Sim-Fanaticism** (Fanaticism **UP**).

  **Q6:** (Leakage) Is your decision algorithm being run in parallel across many distinct simulation instances?
  *   **NO** → **Leaf 8: The Ancestral Bargain** (Fanaticism **NEUTRAL**).
  *   **YES** → Go to Q7.

  **Q7:** (Tails) Does the uncertainty about *which* simulation you are in create scenarios where small actions have disproportionately massive leverage (e.g., "key player" sims)?
  *   **NO** → **Leaf 9: Leverage Longtermism** (Fanaticism **UP**).
  *   **YES** → **Leaf 10: Pascal's Simulator** (Fanaticism **MAX**).

  ---

  ## III. Reading Key & Leaf Definitions

  | Leaf Name | Dial Position | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1. Base-Reality Longtermism** | Business as Usual | You must ignore the possibility that your "future" is just a file about to be deleted. |
  | **2. The Waiting Room** | **DOWN** | You should prioritize personal comfort over x-risk, since the "future" is fake and doesn't count. |
  | **3. The Drama Hypothesis** | **DISTORTED** | **Expected value depends on novelty; you should arguably cause crises to keep the cameras rolling.** |
  | **4. Local Utilitarianism** | **DOWN** | You must abandon far-future concerns entirely because the timeline is short and your impact is singular. |
  | **5. Correlated Hedonism** | **NEUTRAL** | You should maximize welfare, but only for the duration of the sim, ignoring base reality entirely. |
  | **6. Sim-Nihilism** | **DOWN** | Nothing inside the simulation matters, and you cannot affect the outside, so nothing matters. |
  | **7. Sim-Fanaticism** | **UP** | You should prioritize simulated beings over base-reality beings because simulated compute is cheaper and more abundant. |
  | **8. The Ancestral Bargain** | **NEUTRAL** | You should act virtuously to be "resurrected," but this looks suspiciously like religious eschatology. |
  | **9. Leverage Longtermism** | **UP** | You treat x-risk reduction as a way to prove to operators that we deserve more compute/resources. |
  | **10. Pascal's Simulator** | **MAX** | **You must prioritize tiny-probability "god mode" scenarios over almost-certain mundane benefits.** |

  ---

  ## IV. Flags & Notes

  **⚠️ Logically Available but Unoccupied:**
  *   **The Instrumental Purist:** (SimH True + Sim Minds Don't Count + Leakage Exists + Fanaticism Down).
      *   *Why Unoccupied:* If leakage exists (e.g., Blueprint), you *can* affect base reality. If you care about base reality, fanaticism should go *Up* (high leverage), not Down. Holding this combo suggests inconsistent valuation of leverage.

  **⚠️ Indistinguishable Leaves:**
  *   **Leaf 8 (Ancestral Bargain)** and **Leaf 9 (Leverage Longtermism)** are practically identical for decision-making. Both require acting "well" to influence the operators. The distinction is only whether the reward is *your* resurrection (8) or *more compute for the project* (9).

  **💡 Teaching Tip:**
  Push the ML skeptics on **Q3**. If they think sim minds are "just code," ask if *they* would accept being turned off if they were in a sim. If not, they implicitly grant moral status, pushing them toward **Leaf 7** or **Leaf 10**.
