      *   *Requirement 2: Procedural vs. Substantive Distinction.* Motivation: Simon's core insight. Outcome vs. Process. Status: Non-negotiable.
      *   *Requirement 3: Environmental Structure.* Motivation: A heuristic isn't rational in a vacuum. Status: Non-negotiable (for Ecological view), Preference (for traditional econ). *Correction:* For a general theory of BR, environment interaction is key. Let's make it Non-negotiable for a *complete* theory.
      *   *Requirement 4: Computational Tractability of the Model.* Motivation: Engineer needs to build it. If the BR model requires solving the halting problem, it fails. Status: Non-negotiable for tools.
      *   *Requirement 5: Explanation of Systematic Deviations.* Motivation: Why do errors cluster? Status: Non-negotiable.
      *   *Requirement 6: Prescriptive Actionability.* Motivation: User wants to build support tools. Status: Preference (for theory), Non-negotiable (for this user). *Refinement:* I will mark it as a Preference for a *theory* of BR, but note its importance for the user's application. Actually, a theory of BR *should* ideally offer normative guidance. Let's call it a "Strong Preference/Functional Requirement."

  9.  **Refining the Tension Argument:**
      *   The "Is-Ought" problem. Descriptive accuracy (humans ignore base rates) vs. Normative utility (tools should enforce base rates).
      *   Are they unsatisfiable? No, but they require a *prescriptive* layer. The tension is between *mimicking* human bounds and *mitigating* harmful bounds.
