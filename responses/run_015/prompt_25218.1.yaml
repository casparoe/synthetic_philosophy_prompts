          *   Flag: Non-negotiable vs. Research Program Preference.
          *   Analyze Tensions: Are any subsets jointly unsatisfiable (e.g., descriptive vs. normative)?
          *   Score Approaches: Briefly score Simon, Heuristics & Biases, Ecological Rationality, Rational Inattention, etc., against the list.

  2.  **Initial Brainstorming & Categorization:**
      *   Bounded Rationality isn't a single theory; it's a research program or a family of models.
      *   Core tension: Optimization under constraints vs. procedural rationality vs. ecological fit.
      *   Key figures: Herbert Simon, Daniel Kahneman/Amos Tversky, Gerd Gigerenzer, Christopher Sims, Reinhard Selten.
      *   Key constraints: Computational limits, information costs, time, memory, attention.
      *   Key outcomes: Satisficing, heuristics, biases, adaptation.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Constraint Modeling:* It can't just say "people are irrational." It must specify *why* (memory, time, compute).
      *   *Descriptive Accuracy:* It needs to match actual human behavior (not just ideal agents).
      *   *Normative Guidance:* Since the user is building tools, the theory must help design *better* decisions, not just describe bad ones.
      *   *Context Sensitivity:* A heuristic good in one environment might be bad in another.
      *   *Computational Tractability:* If the BR model itself is NP-hard, it's useless for real-time tools.
      *   *Learning/Adaptation:* Humans aren't static; they learn bounds.

  4.  **Refining and Classifying (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Internal consistency, acknowledgment of limits, empirical adequacy (at least in broad strokes).
      *   *Preference:* Whether to focus on biases (Kahneman) or adaptive toolboxes (Gigerenzer). Whether to use probabilistic models or rule-based.

  5.  **Addressing the Tension (Descriptive vs. Normative):**
      *   This is the crux for a software engineer. If I model how humans *actually* decide (biases), do I reinforce those biases? Or do I model how they *should* decide given bounds (ecological rationality)?
      *   *Is it unsatisfiable?* Not strictly, but there's a trade-off. A purely descriptive model might justify errors. A purely normative model might be impossible to implement. The sweet spot is "prescriptive."

  6.  **Scoring the Approaches:**
      *   *Simon's Satisficing:* Good on limits, weak on specific heuristics.
      *   *Heuristics & Biases (Kahneman/Tversky):* Great on errors, weak on why they exist (often treats as bugs, not features).
      *   *Ecological Rationality (Gigerenzer):* Strong on context/adaptation, weaker on formal optimization of the bounds themselves.
      *   *Rational Inattention (Sims):* Strong on information costs, weak on psychological realism.
      *   *Resource-Rationality (Lieder/Griffiths):* Modern synthesis, tries to bridge computation and cognition.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ambiguity of BR and set the stage for the desiderata.
      *   **The Desiderata List:** Grouped by category (Foundational, Descriptive, Normative, Computational). Use the requested format (Requirement, Motivation, Status).
      *   **The Tension Analysis:** Address the "jointly unsatisfiable" question directly.
      *   **Scorecard:** Evaluate the major frameworks against the desiderata.
      *   **Conclusion:** Advice for the engineer.

  8.  **Drafting Content - Specific Considerations:**
