answer: |-
  This is a critical distinction to make before architecting decision-support systems. "Bounded Rationality" (BR) is often used as a catch-all excuse for suboptimal performance, but as a formal research program, it makes specific claims about the relationship between cognitive capacity, environmental structure, and decision quality.

  For a theory of Bounded Rationality to be adequate for engineering purposes, it must move beyond the vague assertion that "humans have limits." It must specify the *geometry* of those limits.

  Below are the desiderata for an adequate theory of Bounded Rationality, categorized by their function. Following the list, I analyze the tensions between them and score the major frameworks.

  ### I. The Desiderata of Bounded Rationality

  #### 1. Explicit Constraint Specification
  *   **Requirement:** The theory must explicitly define the scarce resources (time, memory, attention, computational steps, information acquisition cost) that bound the agent.
  *   **Motivating Case:** A model that predicts a user will stop searching for options after 5 minutes is useless if it doesn't specify whether that limit is due to cognitive fatigue, opportunity cost, or an external deadline. Without defined constraints, you cannot engineer around them.
  *   **Status:** **Non-negotiable.** Without this, the theory is indistinguishable from "irrationality."

  #### 2. The Procedural/Substantive Distinction
  *   **Requirement:** The theory must distinguish between the quality of the *outcome* (substantive rationality) and the quality of the *process* (procedural rationality).
  *   **Motivating Case:** An agent might make a profitable trade (good outcome) via a coin flip (bad process). Conversely, an agent might follow a rigorous algorithm but fail due to unforeseen volatility. A BR theory must evaluate the process given the constraints, not just the outcome against an omniscient benchmark.
  *   **Status:** **Non-negotiable.** This is the core definition provided by Herbert Simon.

  #### 3. Environmental Structure Dependence (Ecological Validity)
  *   **Requirement:** The theory must specify how the decision strategy interacts with the statistical structure of the environment (e.g., distribution of information, noise, correlation).
  *   **Motivating Case:** The "recognition heuristic" (choose the option you recognize) works well in environments where name recognition correlates with size/quality (e.g., city populations) but fails in random environments. A heuristic cannot be labeled "rational" or "biased" in a vacuum.
  *   **Status:** **Non-negotiable** for a complete theory; often treated as a **Preference** in traditional behavioral economics (which focuses more on internal cognitive flaws).

  #### 4. Explanation of Systematic Deviations
  *   **Requirement:** The theory must explain why errors cluster in specific patterns rather than being random noise.
  *   **Motivating Case:** If humans were simply noisy optimizers, errors would be Gaussian. Instead, we see systematic biases (e.g., loss aversion, anchoring). An adequate BR theory must derive these biases as necessary consequences of the bounds, not just list them as bugs.
  *   **Status:** **Non-negotiable.**

  #### 5. Computational Tractability of the Model Itself
  *   **Requirement:** The theory's prescription for "optimal behavior under bounds" must be computationally cheaper than the unbounded optimization it seeks to replace.
  *   **Motivating Case:** If your decision-support tool requires solving an NP-hard problem to determine the "bounded rational" heuristic, the tool itself violates the bounds it attempts to model. This is the "homunculus problem" (who decides the heuristic?).
  *   **Status:** **Non-negotiable** for software implementation.

  #### 6. Adaptation and Learning Mechanism
  *   **Requirement:** The theory must account for how agents learn to adjust their bounds or switch heuristics over time.
  *   **Motivating Case:** Users do not have static bounds. They learn to ignore irrelevant data or automate frequent decisions. A static BR model fails to predict long-term system interaction where the user adapts to the tool.
  *   **Status:** **Strong Preference** (essential for dynamic systems, less critical for one-off decision analysis).

  #### 7. Prescriptive Actionability
  *   **Requirement:** The theory must yield actionable recommendations for altering the environment or the interface to improve decision quality.
  *   **Motivating Case:** Knowing a user has limited working memory is descriptive. Providing a "progressive disclosure" UI pattern that reduces working memory load is prescriptive.
  *   **Status:** **Research Program Preference.** (Descriptive theories of BR exist without this, but for an engineer, this is functionally non-negotiable).

  ---

  ### II. The Tension: Descriptive Accuracy vs. Normative Usefulness

  You asked if any subset of these desiderata is jointly unsatisfiable. There is a significant tension, though not a logical contradiction, between **Descriptive Accuracy (Desideratum 4)** and **Prescriptive Actionability (Desideratum 7)**.

  **The Conflict:**
  *   **Descriptive Goal:** To accurately model human decision-making, you must incorporate human biases (e.g., hyperbolic discounting). If you build a tool that perfectly mimics human bounded rationality, you automate human error.
  *   **Normative Goal:** To build a decision-*support* tool, you aim to mitigate those bounds (e.g., enforce long-term planning). If you build a tool that ignores human bounds, users will reject it or game it (the "resistance" problem).

  **Is it Unsatisfiable?**
  No, but it requires a shift from *modeling the agent* to *modeling the agent-system dyad*.
  *   **The Trap:** If you treat BR as a fixed property of the human (e.g., "Humans have a 7-item working memory limit"), you optimize for the human's current state.
  *   **The Solution:** You must treat BR as a property of the *interaction*. This is where **Resource-Rational Analysis** (see scoring below) attempts to bridge the gap. It asks: "Given the cost of computation, what *should* the human do?" This provides a normative benchmark that respects descriptive limits without endorsing errors.

  **The "Impossible Trinity" of Decision Support:**
  In practice, you often face a trade-off among three goals, where you can fully satisfy only two:
  1.  **Fidelity:** Accurately reflecting the user's mental model.
  2.  **Optimality:** Maximizing expected utility of the decision.
  3.  **Adoption:** Ensuring the user actually uses the tool.
  *   *High Fidelity + High Optimality:* Often leads to low Adoption (tool feels alien/too complex).
  *   *High Fidelity + High Adoption:* Often leads to low Optimality (tool reinforces existing biases).
  *   *High Optimality + High Adoption:* Often requires lowering Fidelity (simplifying the model so much it no longer reflects the user's specific constraints).

  ---

  ### III. Scorecard of Major Approaches

  Here is how the dominant frameworks score against the desiderata.
  *Scale: ✅ (Strong), ⚠️ (Mixed/Partial), ❌ (Weak/Missing)*

  | Approach | 1. Constraints | 2. Proc/Sub | 3. Environment | 4. Sys. Deviations | 5. Tractability | 6. Adaptation | 7. Prescriptive |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Simon's Satisficing** | ✅ | ✅ | ⚠️ | ⚠️ | ✅ | ❌ | ⚠️ |
  | **Heuristics & Biases** (Kahneman/Tversky) | ⚠️ | ❌ | ❌ | ✅ | ✅ | ❌ | ⚠️ |
  | **Ecological Rationality** (Gigerenzer) | ✅ | ✅ | ✅ | ✅ | ✅ | ⚠️ | ✅ |
  | **Rational Inattention** (Sims) | ✅ | ✅ | ⚠️ | ⚠️ | ❌ | ⚠️ | ❌ |
  | **Resource-Rationality** (Lieder/Griffiths) | ✅ | ✅ | ✅ | ✅ | ⚠️ | ✅ | ✅ |

  #### Analysis of Scores:

  1.  **Simon's Satisficing:**
      *   *Strengths:* Established the foundational distinction (Proc/Sub) and the concept of aspiration levels.
      *   *Weaknesses:* Vague on *which* heuristic to use. It says "search until satisfied," but doesn't specify the search order. Weak on adaptation.
      *   *Engineering Take:* Good for setting stopping conditions in algorithms, but too abstract for UI design.

  2.  **Heuristics & Biases (H&B):**
      *   *Strengths:* Unmatched at cataloging systematic errors (Desideratum 4).
      *   *Weaknesses:* Treats bounds as "bugs" rather than features. Often ignores environmental structure (Desideratum 3). It implies the normative benchmark is always unbounded logic/probability, which violates the spirit of BR.
      *   *Engineering Take:* Essential for "debugging" user inputs (e.g., debiasing checklists), but dangerous if used to model user intent.

  3.  **Ecological Rationality:**
      *   *Strengths:* Excellent on environmental structure. Explains *why* a bias exists (it's adaptive in a different context). Highly prescriptive (change the environment to match the heuristic).
      *   *Weaknesses:* Can be post-hoc ("it worked because the environment fit"). Less formal on the computational cost of the heuristics themselves.
      *   *Engineering Take:* Best for designing the *context* of the decision (e.g., how data is presented).

  4.  **Rational Inattention:**
      *   *Strengths:* Rigorous economic formulation of information costs (Desideratum 1).
      *   *Weaknesses:* Computationally intractable for real-time use (violates Desideratum 5). Assumes agents optimize their attention optimally, which is often descriptively false.
      *   *Engineering Take:* Useful for backend optimization of data fetching/alerting, not for modeling human cognition.

  5.  **Resource-Rationality (Modern Synthesis):**
      *   *Strengths:* Attempts to compute the optimal trade-off between accuracy and computational cost. Bridges CS and Psych.
      *   *Weaknesses:* Still emerging; requires defining a "cost function" for cognition which is hard to measure.
      *   *Engineering Take:* **The target state.** This approach allows you to calculate the "value of computation," helping you decide when your tool should automate a decision vs. when it should ask the user.

  ### IV. Recommendation for Your Work

  For building decision-support tools, do not adopt a single theory. Instead, adopt a **layered architecture** based on these desiderata:

  1.  **Use H&B for Input Validation:** Assume the user's *input* is subject to systematic biases (anchoring, availability). Build guards against these.
  2.  **Use Ecological Rationality for Interface Design:** Match the display of information to the heuristics users naturally employ (e.g., use frequency formats instead of probabilities).
  3.  **Use Resource-Rationality for Automation Logic:** Use this to decide *when* the system should intervene. If the cost of the user's cognitive computation exceeds the expected value of accuracy, the system should automate or pre-fill.

  **Final Warning:** The greatest risk in applying BR to software is **paternalism**. If you define the user's bounds too rigidly, you build a system that limits them rather than extending them. Your tool should aim to be a "cognitive prosthesis" (expanding the bound) rather than a "cognitive model" (mimicking the bound).
