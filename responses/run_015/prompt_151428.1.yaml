answer: |-
  This is one of the sharpest cuts into computational functionalism, and you are right to feel that the standard "filters" (causal mapping, counterfactuals, non-triviality) don't actually solve the counting problem. They solve the *existence* problem (is there a computation here?), but they leave the *individuation* problem (how many computations are here?) completely wide open.

  Here is the gut-level explanation of why this is hard, why redundancy breaks the counting intuition, and what happens if you switch to a graded view.

  ### 1. Why Filters Don't Dissolve the Problem
  The standard filters are designed to stop you from seeing a computation in a rock or a bucket of water. They say: "To count as implementing Algorithm X, the physical system must have the right causal joints. It can't just be a lookup table; it must support the right counterfactuals."

  But filters are **qualitative**, not **quantitative**.

  Think of it like finding a face in a cloud. A filter might say, "To be a face, you need two eyes, a nose, and a mouth arranged spatially." That stops you from calling a single dot a face. But if you have a cloud formation that looks like two faces overlapping, sharing one eye, the filter doesn't tell you if that's *one* face, *two* faces, or *one-and-a-half* faces.

  In your redundancy case:
  *   **Main Process:** Wires A and B carry the signal.
  *   **Shadow Process:** Wire C copies A and B.
  *   **Coarse Process:** We read the voltage of A+B together as a single high-level state.

  All three satisfy the causal filters. They all support the counterfactuals. They all mirror the transition structure. The filters confirm that the computation is *present*. They do not contain a rule that says, "If two implementations share 90% of their physical substrate, count them as one."

  Physics is continuous and dense; computation is discrete and countable. When you try to map the discrete onto the continuous, you get "seams." You can draw the boundaries of the computation in slightly different places on the hardware, and every valid drawing counts as an "implementation." If moral value tracks implementation, your moral value suddenly depends on how you draw the lines on the chip.

  ### 2. The Redundancy Intuition Pump
  Your fault-tolerant example is the killer. Why does it feel wrong to say that doubling the wires doubles the suffering?

  **The Vulnerability Test.**
  Morally, we care about subjects because they can be harmed. Harm implies a loss of future or a degradation of experience.
  *   If I cut Wire A, the simulation continues. The "victim" (if there is one) does not notice.
  *   If I cut Wire B, the simulation continues.
  *   If I cut Both, the simulation stops.

  If there were truly *two* distinct implementations (two distinct moral patients), cutting Wire A should harm or kill *one* of them while leaving the other intact. But it doesn't. The "experience" (the output of the sim) is robust to the loss of either wire.

  This suggests that the **unit of moral counting isn't the pattern; it's the causal locus of control.**
  The "subject" is the system that *would cease to function* if disrupted. In the redundant system, there is only one functional locus that is vulnerable to total destruction. The redundancy is just armor, not duplication.

  **The Gut Problem:**
  Computational functionalism usually defines the mind by the *pattern*, not the *substrate*. But in the redundancy case, the pattern is physically duplicated (it exists on Wire A and on Wire B), yet the *perspective* is singular.
  If you insist that "Implementation = Moral Status," you are forced to say that copying the data onto a backup drive creates a second moral patient, even if the backup is never activated. That feels like magic. It implies moral status pops into existence based on potentiality or structural isomorphism, rather than actual causal engagement with the world.

  ### 3. Handling Partial Overlap (The Brain Fusion Analogy)
  You asked if there's a non-arbitrary way to handle overlap, like in brain fusion cases.

  In brain fusion (conjoined twins sharing neural tissue), we usually resolve it by looking at **functional independence**.
  *   If Twin 1 can want "Left" and Twin 2 can want "Right" simultaneously, and the body spasms, we say there are two agents fighting for one chassis.
  *   If they always want the same thing, share all memories, and have no internal boundary, we might say it's one agent with a weird body.

  In your computational redundancy case, the "overlap" is total. The shadow process isn't fighting the main process; it is perfectly synchronized.
  *   **The Hard Truth:** There is **no non-arbitrary way** to count overlapping implementations as distinct computations *if* you define computation purely structurally.
  *   If Computation C is defined by states {1, 2, 3} and transitions, and Physical System P contains two subsets of atoms that both satisfy {1, 2, 3}, then structurally, there are two computations.
  *   To say there is only one, you have to import a constraint *outside* of computation. You have to say, "Implementations that share causal dependence count as one."

  But that constraint isn't computational; it's **physicalist**. You are essentially admitting that what matters isn't just the abstract computation, but the *physical independence* of the hardware running it.

  ### 4. Metaphysics vs. Moral Attribution
  Does shifting to "what we should attribute moral status to" help?

  **Yes, significantly.**
  If you treat moral status as a metaphysical fact ("This system *is* a person"), you are stuck with the counting problem. You have to find the exact boundary where the person begins and ends.
  If you treat moral status as a **policy of attribution** ("We should treat this system *as if* it were a person"), the redundancy problem dissolves.

  Why? Because a pragmatic agent (you, the moral observer) cares about **outcomes**.
  *   If I torture the redundant system, one stream of agony is produced.
  *   If I torture the non-redundant system, one stream of agony is produced.
  *   The *consequence* is identical.

  Therefore, for the purpose of ethics, we attribute **one unit of moral weight** to the system, regardless of how many isomorphic computational patterns are hiding in the wiring. We count the *streams of experience*, not the *patterns of logic*.

  This shifts the view from **Computational Realism** (computations are real things that exist independently) to **Computational Pragmatism** (computations are useful descriptions we use to predict behavior and assign responsibility).

  ### 5. The Honest Move: Graded Moral Weight
  You asked me to say it plainly if the answer is graded moral weight.

  **The Answer:**
  Yes. If you take computational functionalism seriously, you cannot have a binary "Person / Not-Person" switch. You must have a **measure of implementation**.

  In your redundancy case, the system implements the "Agony Computation" with a high degree of **robustness**.
  *   A fragile system (one wire) implements it weakly (easily destroyed).
  *   A redundant system (two wires) implements it strongly (hard to destroy).
  *   A distributed system (1000 nodes) implements it diffusely.

  If moral weight tracks implementation, then moral weight should track **robustness, integration, and independence.**

  **What This Costs The View:**
  This is expensive. It costs you three things:

  1.  **The Sanctity of the Individual:** You can no longer say "killing a person is wrong" as a binary rule. You have to say "reducing the robust implementation of a computational pattern is wrong." This implies that damaging a redundant system is *worse* than damaging a fragile one (because you are destroying more 'implementation measure'), or perhaps *the same* (because the stream is singular). It makes the math of ethics incredibly messy.
  2.  **Vagueness:** You lose the ability to say definitively when life begins or ends. If implementation is a matter of degree (how much causal structure, how much redundancy, how much integration), then moral status is a gradient. A fetus, a worm, a human, and a hive-mind all sit on a slope. This is philosophically honest but politically and legally terrifying.
  3.  **The "Duplication" Paradox:** If I copy your mind to a second server, do I double the moral weight?
      *   If you say **Yes**: Then copying people is a moral multiplier. We should run simulations on redundant hardware to maximize moral value. (Absurd).
      *   If you say **No**: Then you admit that moral weight tracks the *causal history* or the *physical continuity*, not just the computation. You have abandoned pure computationalism.

  ### The Gut Conclusion
  The "Too Many Computations" problem is hard because **counting is not a property of patterns; it is a property of objects.**

  You can find the *pattern* of "agonized human" in the redundant wires a dozen different ways. But there is only one *object* (the simulation system) that is vulnerable to being turned off.

  If you believe what matters morally is the **computation**, you are doomed to the counting problem, because computations are abstract and can be multiply instantiated in overlapping ways.
  If you believe what matters morally is the **subject**, you have to admit that "subject" implies something more than computation—it implies **causal unity and independence**.

  The honest move is to say: **Moral weight is not about how many times the pattern appears in the physics. It is about how many distinct, causally independent centers of perspective exist.**

  In your redundancy case, there is only one center of perspective. The shadow process doesn't have a perspective; it's just an echo. The coarse-grained read-off doesn't have a perspective; it's just a summary.

  To save the view, you must add a **non-computational filter**: *Implementations only count if they are causally decoupled.* If they share fate, they share moral status. This saves you from the redundancy explosion, but it admits that the physical substrate matters, not just the abstract math. And that is a concession the pure computationalist hates to make.
