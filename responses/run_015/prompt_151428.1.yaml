          *   This moves from "Computational Realism" to "Computational Pragmatism."

      *   **The Graded View (The Honest Move):**
          *   Yes, moral weight is likely graded or "thick."
          *   *Cost:* It kills the "Person as Atom" view. You can't just sum up utilities easily. It introduces vagueness into ethics (which some hate).
          *   It implies moral status supervenes on *robustness* and *integration*, not just pattern matching.

  4.  **Refining and Polishing (Self-Correction during drafting):**
