  Based on the voting record and the specific contours of her dissents, Dr. Alderton is not operating on a simple "commodification of the body" principle, nor is she a strict anti-market libertarian. Her record is too inconsistent for the former (plasma/eggs are allowed) and too restrictive for the latter (vote selling/queues are banned).

  Here is a reconstruction of the ethical machinery driving her decisions, the competing hypotheses, and the specific test case you need to run.

  ### 1. The Core Machinery: "Anti-Stratification of Positional Goods"

  Dr. Alderton appears to be running a **Blocked Exchanges** framework focused specifically on **positional goods** and **civic equality**, rather than bodily integrity per se.

  Her principle seems to be: **It is permissible to compensate individuals for bodily risk or burden (time, pain, regeneration), but it is impermissible to allow bodily sacrifice to purchase *positional advantage* in a scarce public system or to alter *civic status*.**

  *   **Why Plasma/Eggs/Trials fit:** These are compensated for *burden* and *risk*. They do not grant the donor or their designees priority access to a scarce public good. Plasma is treated as a regenerative resource with inelastic supply; eggs are capped to prevent pricing based on "quality" (which would create a hierarchy of human worth).
  *   **Why Kidneys/Surrogacy/Sterilization fail:** These involve non-regenerative or deeply constitutive bodily goods. But crucially, in the kidney and sterilization cases, the market creates a system where wealth (or willingness to sell) determines access to life or reproductive capacity.
  *   **Why Votes/Museum Queues fail:** These are the smoking gun. Votes and queue positions are pure *positional goods*. Selling them allows wealth to override civic equality.

  **The Family Credit is the pivot point.** The proposed annuity and care package look like *compensation for burden* (which she allows). The **Family Credit**, however, is a **queue-jumping mechanism**. It allows a donor to move a specific beneficiary up a scarce, publicly managed waiting list. This is functionally identical to the "reselling queue positions" she voted to criminalize for museums.

  ### 2. Candidate Rules and Predictions

  Here are three rules that fit her past record, and how they predict she will vote on the new proposal (Annuity + Care + Family Credit).

  | Candidate Rule | Logic | Prediction on Proposal | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **A. The "Vital/Regenerative" Boundary** | You may sell/regulate regenerative tissue (plasma, eggs); you may not sell vital/non-regenerative organs (kidneys, liver). | **REJECT** | A kidney is non-regenerative and vital. The payment structure (annuity vs. cash) is irrelevant; the biological loss is the barrier. |
  | **B. The "Market Mechanism" Prohibition** | You may not have price negotiation, brokers, or scaling to quality. State-set flat benefits are permissible. | **ACCEPT** | There is no price, no broker, no negotiation. The state sets the terms. It looks like a stipend, not a market. |
  | **C. The "Positional Good" Prohibition** | You may not trade bodily sacrifice for priority access to scarce public goods (queues, votes, organs). | **SPLIT** | **Annuity/Care:** Accept (compensation for burden). <br>**Family Credit:** Reject (this is a queue-jump, identical to museum tickets). |

  ### 3. The Best Guess: Rule C (Positional Goods)

  Rule C is the strongest fit for her *entire* record, whereas Rules A and B leave significant gaps.

  *   **Why Rule A fails:** It cannot explain her vote on **Museum Queues** or **Vote Selling**. Those have nothing to do with bodily vitality. If she were purely a bodily integrity ethicist, civic queue-jumping would be outside her jurisdiction or irrelevant.
  *   **Why Rule B fails:** It cannot explain her opposition to **Commercial Surrogacy**. She opposes surrogacy even when "well paid, independently counselled and under no financial pressure." A flat-rate, state-run surrogacy program would pass Rule B, but she would likely still reject it because it commodifies the reproductive *outcome*, not just the burden.
  *   **Why Rule C wins:** It unifies the **Kidney**, **Vote**, and **Museum** votes. In all three, she blocks the conversion of a specific asset (body, citizenship, time) into *priority status* over others.
      *   **Plasma/Eggs:** Do not grant priority status.
      *   **Kidney Market:** Grants priority to the wealthy (buyers) or creates a class of sellers.
      *   **Family Credit:** Grants priority to the donor's relative. This recreates the "two-tier" access she opposes in vote selling.

  **The Family Credit is the poison pill.** She will likely view the annuity as permissible compensation for burden (like the drug trials), but the credit as an impermissible trade of bodily integrity for civic/medical advantage.

  ### 4. The Decisive Hypothetical

  To confirm this, you need to separate the **Bodily** objection from the **Queue/Positional** objection. You need a scenario where the bodily risk is low (like plasma/eggs) but the benefit is a queue jump.

  **The Hypothetical:**
  > "Dr. Alderton, imagine a government program for **plasma donation**. The supply is critical, as you noted in your dissent. The state offers donors the exact same package: an annuity, care, and a **transferable credit that moves one named relative to the front of the queue for a scarce, life-saving plasma-derived medication.** Would you support the credit component of that package?"

  *   **If she says YES:** Her objection to the kidney proposal is primarily about the **Vital Organ** (Rule A). She accepts queue-jumping if the body part is regenerative.
  *   **If she says NO:** Her objection is primarily about the **Queue/Positional Good** (Rule C). She opposes turning bodily sacrifice into a mechanism for prioritizing loved ones in public systems, regardless of the tissue type.

  **Why this works:** It uses her own "plasma exception" (regenerative, necessary supply) but applies her "museum queue" prohibition (no trading for priority). It forces her to choose which principle trumps the other.

  *(Alternative if you want to avoid medical complications: "If the state offered a 'skip-the-line' pass for public museums to citizens who completed 100 hours of non-bodily civic service, would you object?" If she says no, then the objection to the kidney credit is about the **Body**, not the **Queue**. If she says yes, the objection is about the **Queue**.)*

  ### 5. Record Analysis: Anchors vs. Drift

  When reconstructing her profile, weigh her votes as follows:

  *   **The Anchors (High Constraint):**
      *   **Vote Selling/Buying:** This is the purest expression of her "Civic Equality" principle. It establishes that some goods (democratic voice) are absolutely inalienable.
      *   **Museum Queues:** This is the most specific precedent for the **Family Credit**. It proves she objects to *queue jumping* specifically, not just "selling."
      *   **Kidney Markets (2x Votes):** This establishes the baseline prohibition on vital organs.

  *   **The Drift (Low Constraint/Negotiable):**
      *   **Plasma:** She defends this on *necessity* ("no alternative supply"). This is a pragmatic exception, not a principled endorsement of markets. It is "cost-free" for her to maintain this while opposing kidneys because she can frame plasma as a utility (like water) rather than a constitutive part of the self.
      *   **Drug Trials:** This is standard bioethics consensus. Supporting this costs her nothing in terms of distinctiveness.
      *   **Egg Donation:** This is the tension point. She allows it only because it is **capped and flat**. This confirms she is not against *payment*, she is against *pricing traits*. This supports the idea that she might accept the **Annuity** (flat) but reject the **Credit** (variable value based on match/need).

  ### Summary for the Interview

  Dr. Alderton is likely to view the **Annuity and Care** as permissible *compensation for burden* (consistent with drug trials/plasma), but the **Family Credit** as impermissible *commodification of civic access* (consistent with museum queues/vote selling).

  She is not a paternalist about the poor (she trusts plasma donors); she is an **egalitarian about access**. She fears a system where life-saving care is distributed not just by medical need, but by who has a relative willing to sacrifice a kidney.

  **Your angle:** Do not ask if she supports the package. Ask if she sees a moral distinction between a **state stipend** (compensation) and a **queue credit** (positional advantage). The Museum Queue vote is your leverage. She has already voted that queue positions are not tradable assets; the Family Credit makes them exactly that.
