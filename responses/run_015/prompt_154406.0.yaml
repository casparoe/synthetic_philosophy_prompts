      *Refinement on Step 2:* Leo is actually making a strong point about *validity*. If the classification isn't anchored by experts, is it the *same* classification? Mara says yes (it's the diagnosis), Leo says no (it's a meme version). I should give Leo credit here for precision, even if Mara is more visionary.
