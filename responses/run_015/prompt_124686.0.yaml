answer: |-
  # PREPARATION SHEET: National Cost–Benefit Guidance Revision
  **Subject:** Social Discount Rate (SDR) Structure & Existential Risk
  **Time Allocation:** 40-min Presentation / 60-min Q&A
  **Audience:** Technical Panel (Public Economists, Financial Economists, Climate/Env Specialists)

  ---

  ## I. EPISTEMIC STATUS LEGEND
  *   **[CONSENSUS]:** Settled among social discounting specialists (e.g., Ramsey formula structure).
  *   **[DEBATE]:** Live controversy in the literature (e.g., magnitude of $\rho$, declining schedules).
  *   **[SPECULATIVE]:** Your novel claim; little to no empirical estimation exists.
  *   **[POLITICAL]:** Constraints imposed by Finance Ministry/Auditors, not economic theory.

  ---

  ## II. PRE-EMPTIVE CONCESSIONS (First 5 Minutes)
  *Do not wait for them to extract these. Offering them early signals you understand their constraints.*

  1.  **The "Absurd Numbers" Concession:** Acknowledge that setting $\rho = 0$ mechanically increases Net Present Value (NPV) for long-horizon projects. State clearly: *"If we set $\rho=0$ but leave growth assumptions ($g$) at historic averages, we will generate PVs the Finance Ministry cannot accept. My proposal requires recalibrating $g$ and survival probabilities ($p$) simultaneously, not just switching $\rho$."* **[POLITICAL]**
  2.  **The Implementation Lag:** Concede that the "state-dependent survival" mechanism cannot be fully operationalized in the standard spreadsheet template immediately. Propose a phased adoption: $\rho=0$ now, with a working group to model the correlation structure for the next revision. **[POLITICAL]**
  3.  **Intragenerational Distribution:** Acknowledge that the Ramsey rule assumes a representative agent. Concede that $\rho=0$ does not solve inequality within generations, only between them. Do not claim it does. **[CONSENSUS]**

  ---

  ## III. THE EIGHT OBJECTIONS (Ranked by Likelihood & Damage)

  ### 1. The "Shadow Price of Capital" Constraint
  *   **Who:** Financial Economists.
  *   **Objection:** "If your SDR falls below the government's real borrowing cost or the shadow price of capital (SPC), you are approving projects that crowd out more productive private investment. A $\rho=0$ framework risks driving the SDR below the opportunity cost of funds, violating capital rationing constraints." **[POLITICAL]**
  *   **90-Second Reply:** "The SDR and SPC serve different functions. The SPC determines *which* projects enter the budget; the SDR determines *how* we weigh time within a project. If we use $\rho=0$, we must ensure the consumption rate of interest remains above the SPC via the $\eta g$ term. We are not lowering the hurdle rate for capital allocation; we are correcting the intertemporal weighting of benefits once that hurdle is cleared. We can ring-fence this to projects with non-tradable public goods where market prices fail."
  *   **Soft Spot:** If $\eta g$ is low, the SDR *will* drop below the SPC. You need a commitment to a minimum floor rate for capital rationing, distinct from the ethical discount rate.

  ### 2. Operationalizability of State-Dependent Survival
  *   **Who:** Applied Public Economists (The Spreadsheet Guardians).
  *   **Objection:** "Your novel claim requires discounting *within* survival states rather than applying a unconditional probability multiplier. This requires a joint distribution of project payoffs and existential hazards. We have no data for this. It makes the guidance unimplementable and opens us to legal challenge for arbitrariness." **[SPECULATIVE]**
  *   **90-Second Reply:** "Current guidance uses a single $p$ multiplier, which assumes hazards are independent of project success. That is the arbitrary assumption. If a flood defence reduces the hazard of collapse, multiplying by a fixed $p$ double-counts the risk. I propose a simplified lookup table: three correlation coefficients (positive, zero, negative) between project payoff and systemic risk. Auditors can verify the selection; they cannot verify a false independence assumption."
  *   **Soft Spot:** You have no empirical estimates for these coefficients. You are asking them to adopt a parameter nobody has measured.

  ### 3. Revealed Preference vs. Ethical Prescription
  *   **Who:** Public Economists (Standard Ramsey Users).
  *   **Objection:** "Market rates and observed savings behaviour reveal a positive pure time preference. Ignoring this disconnects our appraisal from actual economic behaviour. Why impose an ethical $\rho=0$ when agents demonstrate $\rho > 0$?" **[DEBATE]**
  *   **90-Second Reply:** "Revealed preference describes *what is*, not *what ought to be*. Market rates embed myopia, mortality risk, and liquidity constraints. For public projects spanning centuries, we are acting as trustees for future generations who cannot reveal preferences. Using observed impatience to discount their welfare is a category error: it treats a prediction of behaviour as a prescription for value."
  *   **Soft Spot:** This is philosophical. If they demand empirical backing, you have none. This is the ethical hard line.

  ### 4. Double-Counting Risk
  *   **Who:** Public Economists / Risk Specialists.
  *   **Objection:** "You propose discounting for survival probability ($p$). But shouldn't existential risk be handled in the cash flow expectations (the numerator) rather than the discount rate (the denominator)? Adding it to the rate risks double-counting if the cash flows are already risk-adjusted." **[DEBATE]**
  *   **90-Second Reply:** "Only if the risk is idiosyncratic. Existential risk is systemic; it correlates across all assets. In asset pricing, systemic risk commands a premium in the discount rate, not just a reduction in expected cash flows. If the 'market' ceases to exist, the marginal utility of consumption becomes infinite or undefined. We must separate project-specific risk (numerator) from civilization-continuation risk (denominator)."
  *   **Soft Spot:** Distinguishing systemic vs. idiosyncratic risk in long-term public projects is notoriously difficult.

  ### 5. The "Infinity Problem" (Divergent Integrals)
  *   **Who:** Environmental Economist (Ally, but cautious) / Public Economists.
  *   **Objection:** "With $\rho=0$ and low growth, the present value of infinite streams of benefits can diverge. This creates 'tyranny of the future' problems where any small cost today is justified to prevent a tiny risk tomorrow. It breaks the optimization." **[DEBATE]**
  *   **90-Second Reply:** "Divergence only occurs if consumption growth $g$ is persistently lower than the pure time preference. With $\rho=0$, we need $g > 0$ for convergence. Given climate constraints, assuming perpetual positive $g$ is the bigger ethical leap. I recommend a declining schedule for $g$ that ensures convergence, effectively capping the PV without reintroducing $\rho$."
  *   **Soft Spot:** You are relying on growth assumptions to do the heavy lifting that $\rho$ used to do. If $g$ is uncertain, Weitzman's gamma discounting suggests a declining rate, which you support, but the interaction with $\rho=0$ needs careful math.

  ### 6. Defensibility in Court
  *   **Who:** All (Priority #1).
  *   **Objection:** "If a project is challenged, how do we defend $\rho=0$ against a lawyer citing the previous Treasury guidance? 'Zero' looks like a political choice, not a technical one." **[POLITICAL]**
  *   **90-Second Reply:** "We defend it by citing the Ramsey rule decomposition. We show that the *total* discount rate is consistent with historical averages, but we have transparently separated the ethical component ($\rho$) from the descriptive component ($\eta g$). Transparency is stronger defence than obscuring ethics inside a blended rate. We document the ethical choice explicitly rather than hiding it."
  *   **Soft Spot:** Auditors prefer precedent over transparency. Precedent says $\rho > 0$.

  ### 7. Correlation Sign Ambiguity
  *   **Who:** Climate Scientist / Environmental Economist.
  *   **Objection:** "You argue hazards and payoffs are correlated. But the sign is ambiguous. Prosperity might lower hazard (adaptation), but the warming averted might raise it. How do we know which direction the bias goes?" **[SPECULATIVE]**
  *   **90-Second Reply:** "We don't know the sign ex-ante, which is why the current practice of assuming zero correlation is biased *by definition*. My proposal forces the analyst to declare the sign. A declared assumption is auditable; a hidden assumption is not. We can require a sensitivity analysis on the correlation coefficient."
  *   **Soft Spot:** This admits your method doesn't solve the uncertainty, it just moves it to a different parameter.

  ### 8. Intergenerational Transfers
  *   **Who:** Public Economists.
  *   **Objection:** "If we value the future so highly ($\rho=0$), shouldn't we be borrowing massively from the future to invest today? Why isn't the guidance recommending higher debt?" **[DEBATE]**
  *   **90-Second Reply:** "Discount rates guide project selection, not macro-fiscal stance. High valuation of future benefits justifies high investment, but financing depends on tax smoothing and debt sustainability constraints. We can value the future highly in appraisal while respecting fiscal rules in budgeting."
  *   **Soft Spot:** This is a slight dodge. High PVs imply high investment, which implies financing pressure.

  ---

  ## IV. THE CRITICAL REPLY (Must Land)
  **Context:** The Financial Economists and Treasury reps will argue that $\rho=0$ produces "absurd numbers" that make the guidance unusable.
  **The Reply:** *"The absurdity does not come from $\rho=0$; it comes from assuming perpetual growth ($g$) alongside it. If we accept physical constraints on long-run growth, the $\eta g$ term naturally limits the PV. I am not asking you to accept infinite values; I am asking you to stop using a positive $\rho$ to mask unrealistic growth assumptions. Let the growth constraint be the brake, not an ethical discount on future lives."*
  **Why it must land:** If they believe $\rho=0$ mathematically necessitates budget-breaking NPVs, the proposal dies. You must decouple $\rho=0$ from "infinite value."

  ---

  ## V. THE FEARED QUESTION (Privately Hoping Nobody Asks)
  **Question:** "You argue that survival probability is correlated with project payoffs. Can you show me a single empirical estimate of this correlation coefficient for any horizon beyond 50 years? If not, aren't you just replacing one arbitrary number ($\rho$) with another arbitrary number (correlation)?"
  **Why it kills you:** It exposes the **[SPECULATIVE]** status of your novel claim. It undermines your "defensibility" priority.
  **Prepared Answer:** "There are no direct estimates. That is the gap in the literature I am highlighting. However, we *do* have estimates for $\rho$, and they are ethically indefensible for intergenerational projects. I am proposing we use a sensitivity range for the correlation (e.g., -0.5 to +0.5) which is more transparent than fixing $\rho$ at 1.5% based on current market impatience. We are trading an ethical error for a parameter uncertainty, which is preferable in appraisal."

  ---

  ## VI. EPISTEMIC MAP FOR THE PRESENTATION
  *Use this to frame your confidence levels during the talk.*

  1.  **Ramsey Formula Structure ($r = \rho + \eta g$):** [CONSENSUS]. Do not argue this.
  2.  **$\rho = 0$ Ethical Stance:** [DEBATE]. Acknowledge Stern vs. Nordhaus. Frame as ethical choice, not empirical finding.
  3.  **Declining Schedule for Uncertainty:** [CONSENSUS]. Weitzman/Gollier. Use this to reassure them on risk.
  4.  **Survival Probability as Discount Factor:** [DEBATE]. Common in climate economics (e.g., Millner), but not standard Treasury guidance.
  5.  **State-Dependent Survival (Correlation):** [SPECULATIVE]. **Flag this clearly.** "This is the research frontier. I am proposing we include it as a sensitivity test, not a base case, until data improves." *Do not oversell this.*
  6.  **Growth Constraints ($g$):** [DEBATE]. Biophysical limits vs. Techno-optimism. Acknowledge uncertainty here.

  ---

  ## VII. STRATEGIC NOTE
  **Your Ally:** The Environmental Economist. Use them to validate the $\rho=0$ ethical stance.
  **Your Swing Vote:** The Applied Public Economists. They care about defensibility. Focus on *transparency* of assumptions rather than *correctness* of values.
  **Your Adversary:** The Financial Economists. Do not fight them on capital markets. Fight them on the definition of "public good" vs. "private investment."

  **Final Advice:** When they attack the novel correlation claim, concede the lack of data immediately. Pivot to the argument that *current* guidance assumes zero correlation, which is equally unsupported but less transparent. You are selling **auditability**, not certainty.
