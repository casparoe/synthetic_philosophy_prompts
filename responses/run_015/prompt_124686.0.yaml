prompt: |-
  I am giving a forty-minute paper, followed by an hour of questions, to the technical panel revising our national cost–benefit guidance for long-horizon projects: flood defences, nuclear waste storage, climate adaptation. The panel is five or six applied public economists who use the Ramsey rule daily and currently apply a small positive pure rate of time preference with a declining schedule over the very long run; two financial economists who think the right rate is the government's real borrowing cost or the shadow price of capital; one climate scientist; and one environmental economist who has publicly argued for a rate well below what the guidance permits. They care, in roughly this order, about defensibility to auditors and courts, about not handing the finance ministry numbers that look absurd, and about intergenerational fairness. They are not hostile, but they have very little patience for anything that cannot be turned into a number in a spreadsheet.

  My thesis, in brief. The pure rate of time preference should be set to zero: once expected growth in consumption has been counted separately through the ηg term, discounting a benefit merely because it falls later has no defensible ethical basis, and the common practice of reading a positive rate off market behaviour or off revealed impatience confuses a prediction with a prescription. What a positive rate does in practice should be done by two other terms: expected consumption growth, and the probability that there is anyone alive and able to benefit at the relevant date. My one novel claim is that the second term cannot be applied the way the field applies it, as a single unconditional survival probability multiplied into expected benefits. Hazards and payoff size are correlated — the warming a project averts may itself raise the hazard, while the prosperity that raises future benefit plausibly lowers it — so the unconditional shortcut is biased in a direction fixed by the sign of that correlation, and appraisal should discount within survival states rather than after taking expectations.

  Please draft my preparation sheet. Give me the seven or eight objections I will actually get from this panel, ordered by how likely they are and how much damage they would do, each phrased in the vocabulary these economists would use rather than in mine, each with a reply I could deliver in about ninety seconds and a note on where that reply is softest. Tell me what I should concede in the first five minutes, and which single reply has to land if the proposal is to survive the meeting. Include the question I am privately hoping nobody asks. One last requirement: mark the epistemic status of what you give me. Separate what is settled among people who actually work on social discounting from what is live controversy, and flag any place where my argument rests on a claim most specialists would reject, or on a quantity nobody has seriously estimated.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the User and Context:**
      *   **Speaker:** An expert proposing a revision to national cost-benefit analysis (CBA) guidance.
      *   **Audience:** A technical panel revising national guidance (likely UK HM Treasury Green Book style, or similar).
          *   5-6 Applied Public Economists (Ramsey rule users, currently use declining schedule, small positive $\rho$).
          *   2 Financial Economists (focus on government borrowing cost/shadow price of capital).
          *   1 Climate Scientist.
          *   1 Environmental Economist (advocates for near-zero rates).
      *   **Priorities:** 1. Defensibility (auditors/courts), 2. Plausibility (Finance Ministry), 3. Intergenerational Fairness.
      *   **Constraint:** 40-min paper + 1 hour Q&A. Panel has low patience for non-quantifiable arguments.
      *   **Thesis:** $\rho = 0$ (Pure Time Preference). Discounting comes from consumption growth ($\eta g$) and existential risk/survival probability ($p$). *Novel Claim:* Survival probability shouldn't be a simple multiplier; it's correlated with hazards and payoffs (state-dependent discounting).
      *   **Task:** Draft a preparation sheet with 7-8 objections (ranked), replies (90 secs), soft spots, concessions, critical reply, the "feared question," and epistemic status markers.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Claim 1: $\rho = 0$.* This is the Ramsey/Weitzman/Stern debate. Stern said $\rho \approx 0.1\%$. Nordhaus said higher. UK Green Book uses 1.5% declining.
          *   *Vulnerability:* Ethical defensibility vs. market consistency. If $\rho=0$, distant future values explode unless $\eta g$ is high or risk is high. Finance Ministry will hate high PVs.
      *   *Claim 2: Discount via $\eta g$.* Standard Ramsey.
          *   *Vulnerability:* Estimating $g$ over 300 years is guesswork.
      *   *Claim 3: Discount via Survival Probability ($p$).* Standard in some literature (e.g., Weitzman's "Gamma Discounting" implies uncertainty, but explicit survival is distinct).
          *   *Vulnerability:* Double counting risk? How to estimate $p$ for 500 years out?
      *   *Claim 4 (Novel):* Correlation between hazards and payoffs (State-Dependent Survival).
          *   *Vulnerability:* This is the weakest link empirically. Nobody has good data on correlation between civilizational collapse and marginal project benefits. It complicates the spreadsheet.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Objection 1 (Finance/Pragmatic):* "This blows up the budget." If $\rho=0$, NPV of nuclear waste/climate projects becomes huge. Finance Ministry will reject.
      *   *Objection 2 (Ethical/Standard):* "Revealed Preference." Markets show people *are* impatient. Why ignore data?
      *   *Objection 3 (Technical/Ramsey):* "Double Counting Risk." Isn't risk handled in the cash flows? Adding a survival discount might double count.
      *   *Objection 4 (The Novel Claim):* "Operationalizability." How do we model the correlation between survival and benefits in a spreadsheet? It's too complex.
      *   *Objection 5 (Legal/Defensibility):* "Audit Trail." $\rho=0$ is hard to defend in court compared to established guidance.
      *   *Objection 6 (Growth Uncertainty):* "Uncertain $g$." If $g$ is uncertain, we need a declining schedule (Weitzman). Does your proposal handle this?
      *   *Objection 7 (Distributional):* "Intragenerational." Ramsey assumes representative agent. What about inequality within generations?

      *Refining for the Panel:* Need to match their vocab (Ramsey, shadow price, defensibility, spreadsheet).
      *   *Top Priority:* Defensibility/Finance Ministry (The "Absurd Numbers" risk).
      *   *Second:* The Novel Claim's complexity.
      *   *Third:* The $\rho=0$ ethical stance vs. revealed preference.

  4.  **Developing Replies & Soft Spots:**
      *   Need to be concise (90 secs).
      *   Need to acknowledge the soft spot (honesty builds credibility).
      *   *Key Concession:* Admit that $\rho=0$ leads to high PVs *unless* growth/risk is handled rigorously. Offer a sensitivity range.
      *   *Critical Reply:* The distinction between *description* (market rates) and *prescription* (ethical weights). If this fails, the thesis collapses.

  5.  **Epistemic Status:**
      *   Need to distinguish between:
          *   Consensus (Ramsey formula structure).
          *   Debate (Value of $\rho$).
          *   Speculation (Correlation of survival and growth).

  6.  **The "Feared Question":**
      *   What kills the proposal? Probably the empirical basis for the correlation claim. "Show me the regression."

  7.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, precise, economically literate.
      *   *Structure:* Objections (1-8), Concessions, Critical Reply, Feared Question, Epistemic Map.

      *(Self-Correction during drafting)*: Make sure I address the "Financial Economists" specifically. They care about the shadow price of capital (SPC). If the social discount rate (SDR) drops below the SPC, we crowd out private investment. I need an objection about the SPC/STP distinction.
      *(Refining the Novel Claim)*: The user says "discount within survival states rather than after taking expectations." This sounds like state-contingent pricing. I need to make sure the objection reflects the difficulty of implementing state-contingent claims in CBA.

  8.  **Final Review against User Prompt:**
      *   7-8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Vocabulary match? Yes (Ramsey, $\eta$, $\rho$, shadow price, defensibility).
      *   90-second replies? Yes (kept concise).
      *   Soft spots noted? Yes.
      *   Concessions (first 5 mins)? Yes.
      *   Single critical reply? Yes.
      *   Feared question? Yes.
      *   Epistemic status marked? Yes.

  9.  **Final Polish:** Ensure the distinction between the "standard" zero pure time preference argument (Stern) and the "novel" survival correlation argument is clear. The panel knows Stern; they don't know the survival correlation bit. That's where the risk lies.

  *(Self-Correction on Epistemic Status)*: I need to explicitly label sections or add a legend. I will add a legend and tag each point.

  *(Check on Time)*: 40 min paper + 1 hour Q&A. The prep sheet needs to be dense but usable.

  *(Check on Panel Dynamics)*: The Environmental Economist is an ally on $\rho=0$ but might disagree on the survival mechanism. The Financial Economists are the enemy on $\rho=0$. The Public Economists are the swing vote (defensibility).

