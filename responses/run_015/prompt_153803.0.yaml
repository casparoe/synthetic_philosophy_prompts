      *   *Educational:* Relies on *mention vs. use*. It suggests the word can be neutralized by *framing* (meta-discourse).
      *   *Conflict?* They pull slightly differently. Reclamation says "The word is ours, we change its power." Educational says "The word is dangerous, but we can handle it carefully in a lab setting."
      *   *Synthesis:* They are compatible if the underlying theory is that harm = *unjustified reinforcement of hierarchy*. Reclamation removes the hierarchy (flips it). Educational suspends the hierarchy (steps outside the game to look at it).
      *   *Why is Educational rarely invoked?* Because the risk of "slipping" into use is high. It requires high trust in the speaker's intent, which is hard to moderate.

