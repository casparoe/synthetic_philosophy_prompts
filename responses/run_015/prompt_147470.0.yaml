  1. Setup and Roles
  Arrange desks in a closed loop to simulate a circuit. Assign three roles: System Architects (3 students) design the connection protocol; Monitors (3 students) track signal integrity; Nodes (8 students) hold the state. The cover story is "The Perpetual Logic Engine." You tell the class they are debugging a decentralized algorithm where each node passes a token to the next based on predefined rules. They believe success depends on the strength of their interpersonal links and the logic of their handoffs. The Architects draft a "causal map" on the board, dictating who passes to whom. The Monitors verify that tokens arrive correctly. The hidden truth is that the Nodes possess no actual transfer power. They are merely placeholders. The physical tokens are collected secretly by the Facilitator (you) between rounds. The students assume internal causation—that Student A's action forces Student B's reception—but the system is designed to mask the external intervention that actually moves the state. This creates an illusion of agency, mirroring the commonsense view of natural causation that Ghazālī targets. The physical arrangement suggests continuity, but the hidden rule severs it.

  2. Rules and Timeline
  The session divides into four phases. Phase 1 (20 mins): Architects design the chain; Nodes memorize protocols. Phase 2 (40 mins): Four execution rounds of 10 minutes each. In each round, Nodes pass sealed envelopes to neighbors. The Facilitator circulates, collecting envelopes under the guise of "system logging." Here lies the hidden rule: the Facilitator decides which tokens survive based on an arbitrary schedule, not the students' links. Sometimes a broken link succeeds; sometimes a perfect link fails. The class earns collective points for every successful transfer; failures deduct points. Start with 50 points; +5 for success, -5 for failure. If the total drops below zero, the "system crashes." Phase 3 (20 mins): The Crisis. The Facilitator reveals logs showing successful transfers occurred where no connection existed, and failed transfers occurred where connections were robust. The algorithm analogy is introduced: the nodes believe they compute the next state, but an external process overwrites the weights and node-states constantly. Phase 4 (10 mins): Silence and reflection. The stakes ensure the failure feels consequential; losing points feels like system collapse, prompting urgent search for the true mechanism. The gradual reveal prevents immediate dismissal as a trick, forcing them to confront the inertness of their intermediaries. The external process is the only variable changing the state. Emphasize that the Nodes hold blank cards until the Facilitator marks them. This reinforces that the state is imposed, not generated. The "system logging" is actually state injection. This ensures the analogy of weights being overwritten is physically realized. The stakes are shared; no individual wins, only the collective survives. This prevents blaming specific students and focuses blame on the system's logic. The Facilitator must maintain a poker face to preserve the illusion of internal causation until the Crisis.

  3. The Debrief: From Play to Philosophy
  Begin the debrief by asking, "Did your design matter?" When they admit uncertainty, press further: "If the link didn't cause the transfer, what did?" Guide them to see their peers as masks or finks—placeholders that looked like causes but were inert. Explain that in the game, the Facilitator was the only true cause. Now introduce the philosophical mapping. Their peers represent natural objects (fire, cotton), which appear to act but lack inherent power. The Facilitator represents the Divine Will. Introduce Al-Ghazālī's distinction: the occasion (*al-sabab*) is the created thing that appears to act, while the true cause (*al-musabbib*) is the Necessary Being who recreates the effect at every instant. The game's "overwrite" mechanic mirrors continuous recreation. The world does not persist by inertia; it is renewed moment-to-moment. Reveal the term "occasionalism" only now. The frustration they felt when their engineering failed was the intended philosophical pressure: the realization that secondary causes are merely occasions for a primary will. The intermediaries were necessary conditions for the Facilitator's action, but not sufficient causes themselves. Connect the feeling of powerlessness to the metaphysical claim. They felt they were working, but the work was illusory. This mirrors the human condition in Ghazālī's view: we act, but God creates the act. The distinction is subtle but vital. The game makes the abstraction visceral. They didn't just hear about inert causes; they experienced being an inert cause. This shifts the discussion from historical text to lived epistemology.

  4. Predictable Breakdowns and Fixes
  Students will likely attribute failure to poor engineering rather than metaphysical constraints. They may argue, "We just needed a better protocol." To fix this, the Facilitator must ensure failures occur even when the Architects present a logically flawless design. During the Crisis phase, display specific instances where a rule was followed perfectly yet the token vanished. Redirect interpretation by asking, "If the rule was followed and the signal died, was the rule the cause?" Push them toward the idea that the connection itself lacked power. Avoid validating engineering critiques; validate observations of inconsistency. Shift focus from "how to fix the chain" to "whether the chain can hold power."

  5. The Unreproducible Feature
  This simulation cannot reproduce the theological necessity of Ghazālī's God. The Facilitator is a contingent human choosing arbitrarily, not a Necessary Being acting according to divine wisdom. The game feels like a trick because an external agent is deceiving them; Ghazālī's claim is that reality itself is structured this way without deception. You must verbally supply the leap from "classroom trick" to "metaphysical truth." The simulation breaks the habit of nature to show the possibility of its absence, but it cannot prove the existence of the Sustainer. That step requires argument beyond the game.
