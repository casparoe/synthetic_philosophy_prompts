      *   *Option B: No (The Standard Defense).* We can treat the "agent" as a temporally extended entity by definition. Rationality is a property of the *life*, not the *time-slice*.
      *   *Option C: The Pragmatic Turn.* Maybe it's not about "irrationality" but about "prudence."
