answer: |-
  This is a classic and genuinely difficult knot in decision theory and philosophy of action. Your frustration is well-founded: while the *pragmatic* structure of the two arguments looks similar (incoherence $\rightarrow$ exploitation), the *metaphysical* and *normative* underpinnings differ significantly.

  Your intuition is correct: the Dutch Book argument is largely "identity-light," whereas the Money Pump argument is "identity-heavy."

  Here is the precise comparison you asked for, followed by an analysis of where the correspondence breaks and whether diachronic rationality can be saved.

  ### 1. Structural Comparison

  | Feature | **Synchronic Dutch Book** | **Diachronic Money Pump** |
  | :--- | :--- | :--- |
  | **Norm Defended** | **Probabilistic Coherence.** Your credences at time $t$ must obey the axioms of probability (e.g., $P(A) + P(\neg A) = 1$). | **Preference Consistency.** Your preferences across time $t_1, t_2, t_3$ must be transitive and stable (e.g., if $A \succ B$ now, you shouldn't prefer $B \succ A$ later without new info). |
  | **Exploited Pattern** | **Logical Inconsistency.** Holding mutually incompatible degrees of belief simultaneously. | **Dynamic Inconsistency.** Holding preferences at $t_1$ that you will voluntarily violate at $t_2$. |
  | **The Bookie** | An external agent who observes your credences at a single moment and offers a **set** of bets. | An external agent who observes your preferences over time and offers a **sequence** of trades. |
  | **Sequence** | **Simultaneous.** All bets are offered and accepted at time $t$. The loss is calculated immediately. | **Sequential.** Trade 1 at $t_1$, Trade 2 at $t_2$, Trade 3 at $t_3$. The loss is realized only after the cycle completes. |
  | **The Loss** | **Sure Loss.** You lose money in every possible state of the world. | **Sure Loss + Status Quo Ante.** You end up with the same asset you started with but less money. |

  ### 2. Where the Correspondence Fails

  The structural similarity ends when we ask **who** is being exploited and **when** the loss is registered.

  #### The Locus of Agency
  *   **Dutch Book (Synchronic):** The argument assumes a single locus of agency at time $t$. If your left hand bets on $A$ and your right hand bets on $\neg A$ based on incoherent credences, *you* lose. There is no question of personal identity; the "you" that accepts the bets and the "you" that loses the money are temporally identical.
  *   **Money Pump (Diachronic):** The argument assumes a single locus of agency *across* time. Trade 1 is accepted by Agent-$t_1$. Trade 2 is accepted by Agent-$t_2$. The loss is suffered by Agent-$t_3$.
      *   **The Problem:** For this to be a *rationality* constraint (rather than just a warning about bad luck), Agent-$t_3$ must regard the money lost by Agent-$t_1$ as *their* loss.
      *   If Agent-$t_1$ and Agent-$t_3$ are treated as distinct entities (as in Derek Parfit's reductionist view of persons), the Money Pump is merely a wealth transfer from one time-slice to another. Agent-$t_1$ got a preference satisfied; Agent-$t_3$ is poorer. Why is this irrational for the *extended* person? Only if we presuppose that the extended person is the primary unit of normative concern.

  #### The "Smuggled" Premise
  Your friend claims the arguments are identical. You claim the Money Pump smuggles in personal continuity. You are right.
  *   The Dutch Book requires only **logical consistency** of states.
  *   The Money Pump requires **prudential unity** of stages.

  For the Money Pump to work as a normative argument, it presupposes that you *should* care about the welfare of your future self. If you are a "time-slice egoist" (caring only about the present moment), the Money Pump does not demonstrate irrationality; it demonstrates that your future self will be annoyed by your current self. That is a conflict between agents, not a failure of logic within one agent.

  ### 3. Does This Undermine Diachronic Rationality?

  This is the crux of your debate. Does the need for personal continuity mean diachronic consistency isn't a "pure" rationality constraint?

  **The Case for "Yes" (It Undermines It):**
  If rationality is purely about logical coherence of mental states (like logic or math), it should apply to time-slices. If I am perfectly coherent *now*, I am rational *now*. If my future self changes preferences, that is just a change in facts, not a logical error. On this view, the Money Pump argument fails to prove *irrationality*; it only proves *imprudence*. It relies on a substantive ethical claim (you ought to care about your future) rather than a formal rational claim.

  **The Case for "No" (It Can Be Rebuilt):**
  However, many philosophers argue that the Money Pump can be rebuilt without heavy metaphysical commitments to "personal identity." Here are two ways to save the argument:

  1.  **The Planning Agent View (Michael Bratman):**
      We don't need to assume a metaphysical "self" that persists. We only need to assume that you are a **planning agent**. To function as an agent over time, you must treat your past intentions as reasons for future action. If you allow yourself to be money-pumped, you undermine your own capacity to plan. The norm isn't "be the same person"; the norm is "be an effective agent." The Money Pump shows you are failing at agency, regardless of your metaphysical status.

  2.  **The Endorsement View:**
      At $t_1$, you endorse a plan. At $t_2$, you violate it without new information. This isn't about identity; it's about **self-governance**. If you cannot bind your future actions to your current judgments, you are not governing yourself; you are being governed by passing whims. The "loss" in the Money Pump isn't just money; it's the loss of autonomy.

  ### 4. Verdict

  You can tell your friend this:

  They are right that both arguments use **pragmatic inconsistency** (vulnerability to exploitation) to justify a **normative constraint**. Structurally, they are siblings.

  But you are right that they are not twins.
  *   The **Dutch Book** is a **logic** argument. It says: "Your map contradicts itself."
  *   The **Money Pump** is a **governance** argument. It says: "Your past and future selves are not cooperating."

  The Money Pump *does* require a stronger commitment: not necessarily a metaphysical soul that persists, but a **normative commitment to diachronic unity**. You must accept that you are the kind of entity for whom "waste across time" counts as a loss.

  **Can it be rebuilt without that commitment?**
  Only if you redefine rationality. If rationality is just "snapshot coherence," the Money Pump fails. But if rationality is "successful agency over time," the Money Pump holds. The argument doesn't prove you *are* the same person; it proves that if you want to act as a single agent, you must *act as if* you are.

  So, the Money Pump doesn't prove diachronic consistency is a law of logic (like the Dutch Book); it proves it is a **constitutive norm of agency**. That is a slightly weaker, but still potent, claim. Your friend is conflating "logic" with "agency." You spotted the gap.
