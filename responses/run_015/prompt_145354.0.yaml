answer: |-
  There is no established single term that captures the specific ethical-aesthetic tension you describe. The nearest candidates diverge in the following ways:

  *   **Ventriloquism:** Describes the technique (throwing one's voice into another) but lacks the normative weight. It does not explain why some ventriloquism is restitution and some is intrusion.
  *   **Posthumous Privacy:** A legal/ethical concept regarding reputation and secrets. It fails your test because you stipulate the content is not damaging, and audiences know it is invented (so no secret is actually revealed).
  *   **The Intentional Fallacy:** A literary critical concept warning against conflating a work with its author's intent. It applies to texts, not lives, and does not account for the "restitution" exception.
  *   **Docufiction Contract:** Relies on audience belief. You have correctly noted that audiences believe neither scene; the reaction is not about deception but about *propriety*.

  Since no established concept fits, I propose a refinement of your term. "Voice-Conscription" is evocative but slightly imprecise for Instance 3 (where the words are true, but the *context* is conscripted).

  ### The Term: **Conscripted Interiority**

  **Definition:**
  Conscripted Interiority is the unauthorized assignment of a specific *subjective stance* to a historical subject. It is not merely the invention of words (content), but the imposition of a relationship between those words and the speaker's self (context). It occurs when a dramatization forces a historical agent to occupy a first-personal psychological position (confessional, motivational, or intimate) that their archival record does not warrant and cannot contest.

  **The Shape of the Thing:**
  The boundary is not between *true* and *false* words. It is between *warranted* and *unwarranted* access.
  *   **External Attribution (Permissible):** "He was a man who traded his children." (Third-person analysis).
  *   **Internal Avowal (Conscripted):** "I traded my children." (First-person confession).

  The intuition tracks **Epistemic Authority**. Who has the right to define the interior life of this specific person? In a biopic, the adapter borrows authority. Conscripted Interiority occurs when the adapter borrows *more* authority than the archive lends.

  ### The Variable: **Archival Asymmetry**

  The variable your intuition tracks is not intimacy, authorship, or preemption alone. It is **Archival Asymmetry**: the power balance between the subject's existing record and the adapter's invention.

  *   **Instance 1 (The Statesman):** High Archival Density. The statesman has a robust public record. Inventing a private confession creates a *negative asymmetry*. You are overwriting a sufficient record with a speculative interiority. The intrusion is felt as **hubris**.
  *   **Instance 3 (The Public Speech):** High Archival Specificity. The words exist, but the *stance* (public) is documented. Moving them to a private context creates a *contextual asymmetry*. You are stripping the subject of their chosen mask. The intrusion is felt as **exposure**.
  *   **Instance 2 (The Enslaved Woman):** Zero/Negative Archival Density. The silence is not natural; it is the result of systemic erasure. Inventing the voice creates a *corrective asymmetry*. You are using speculation to counteract historical violence. The act is felt as **witness**.

  ### Why the Restitution Case Inverts

  The restitution case inverts the norm because the ethical baseline shifts from **Integrity** to **Justice**.

  *   **Standard Baseline (Integrity):** The default obligation is to leave the subject's self-presentation intact. Violation = Conscripted Interiority.
  *   **Restitution Baseline (Justice):** When the archive itself is a product of oppression (e.g., slavery, censorship), silence is not privacy; it is a wound. The default obligation shifts to restoring agency. Here, *maintaining* the silence would be the violation (complicity in erasure).

  Therefore, the device is not the same. In Instance 1, the voiceover is an **imposition**. In Instance 2, the voiceover is a **prosthesis**. One overrides a functioning agency; the other replaces a missing one.

  ### Boundary Conditions: When the Intuition Vanishes

  Conscripted Interiority dissolves under the following conditions. If your intuition persists in these cases, the definition requires adjustment.

  1.  **Deep Time:** Subjects from antiquity (e.g., Julius Caesar). The archive is so fragmentary that *all* interiority is understood as conjecture. The asymmetry is neutralized by distance.
  2.  **Explicit Fictionalization:** Titles like "The Favourite" or "Marie Antoinette" (2006). The contract shifts from "based on" to "inspired by." The audience suspends the claim to epistemic authority.
  3.  **Collaborative Legacy:** Subjects who actively fictionalized themselves (e.g., Ernest Hemingway, Andy Warhol). When the subject treated their own life as a performance, the adapter is merely continuing the performance rather than conscripting a private self.
  4.  **Mythic Status:** Figures who have already passed into archetype (e.g., George Washington in a patriotic allegory). They are no longer treated as persons with interiority, but as symbols. You cannot conscript the interiority of a flag.

  ### Falsification Criteria

  To test whether **Conscripted Interiority** is the correct shape (and not two separate phenomena packed together), observe the following edge cases:

  **Test 1: The Villain Exception**
  Apply Instance 2 (Enslaved Woman) to a historical perpetrator of violence whose records were destroyed (e.g., a concentration camp guard).
  *   *Hypothesis:* If you invent letters for the guard to explain his motives, does it feel like restitution or intrusion?
  *   *Falsification:* If it feels like intrusion (despite the archival silence), then **Archival Asymmetry** is not the sole variable. **Moral Valence** is a co-variable. This would suggest you have packed "Respect for the Dead" and "Justice for the Oppressed" into one term.
  *   *Refinement:* If the intuition holds that it is still wrong, the definition must be amended to: *Conscripted Interiority is permissible only when it restores agency to the disempowered, not when it explains the empowered.*

  **Test 2: The Diary Exception**
  Apply Instance 1 (Statesman) to a subject who left a private diary admitting the exact thought you invented.
  *   *Hypothesis:* If the diary exists but was never published, and you put the line in the film, does the intrusion vanish?
  *   *Falsification:* If it still feels invasive (because he didn't publish it), then the variable is **Public Consent**, not Archival Warrant.
  *   *Refinement:* If the intrusion vanishes, then the variable is indeed **Archival Warrant**.

  **Test 3: The Chorus Exception**
  Apply Instance 1, but instead of the statesman saying the line, a chorus of historical contemporaries says it in unison, looking at the camera.
  *   *Hypothesis:* This removes the first-person avowal but keeps the attribution.
  *   *Falsification:* If this feels *more* invasive than the aide scene, then the issue is not **Interiority** but **Judgment**.
  *   *Refinement:* If it feels less invasive, it confirms that **Conscripted Interiority** (the first-person stance) is the specific boundary you are tracking.

  ### Summary

  You are tracking **Conscripted Interiority**. It is the wrong of forcing a historical subject to avow a psychological stance they did not authorize. It is distinguished from general invention by the **Archival Asymmetry**: it is wrongful when it overwrites a sufficient record, and righteous when it repairs a violent silence. If this distinction collapses when the subject is a villain, or when the record is private but unpublished, then you are dealing with two separate phenomena: **Narrative Hubris** (overwriting the record) and **Archival Justice** (repairing the record).
