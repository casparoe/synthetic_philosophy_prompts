      *   *Tension D:* (2) vs. (5). (2) defines anchoring as "held within an accessible network... losing it requires rational revision." (5) says I can know via testimony without grasping reasons. If I don't grasp reasons, how is the belief held within *my* accessible network? If the network is the *expert's*, is it *my* knowledge?

