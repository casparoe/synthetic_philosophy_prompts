      *   **(5) Testimonial Knowledge:** Pure testimony counts as knowledge. Anchoring can reside in the expert's system and transmit through the chain, even without the recipient grasping reasons (no personal cognitive ownership).
      *   **(6) Minimal Access Requirement:** For the *recipient* to get the *intrinsic value* (from 1), they need minimal access to the source's reliability/domain. Without this, it's "derivatively anchored," and resilience is outside their control.
      *   **(7) High-Stakes & Cognitive Ownership:** In high stakes, prefer own anchored knowledge over testimony without access (adaptive flexibility). However, testimony-based belief is still *more valuable than lucky true belief*. Cognitive ownership is a separate good, valuable but *not necessary for knowledge*.

