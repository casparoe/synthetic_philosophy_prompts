          *   *Conflict:* If Knowledge = Anchored (3), and Anchoring = Intrinsic Value (1), then all Knowledge has Intrinsic Value. (7) suggests some Knowledge (testimony without access) lacks the full Intrinsic Value (requires ownership for that). This implies "Knowledge" is not a unified natural kind regarding value.
