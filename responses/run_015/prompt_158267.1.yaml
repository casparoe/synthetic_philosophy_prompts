          *   (3) Knowledge = Anchored True Belief.
          *   (7) Cognitive Ownership (which seems linked to Anchoring/Access) is *not necessary* for Knowledge.
          *   *Conflict:* If Anchoring requires the "accessible network" (2), and Cognitive Ownership is having that network, then (7) denies a necessary condition of (3). (7) tries to have it both ways: Testimony is Knowledge, but it lacks the "ownership" that makes Knowledge valuable.
          *   *Severity:* High. It creates a category of "Knowledge" that doesn't meet the definition of "Anchored" provided in (2).

      *   **Pair (5) vs. (6):**
          *   (5) Pure testimony counts (anchoring transmitted).
          *   (6) Without minimal access, it's only *derivatively* anchored and lacks the specific resilience/value.
          *   *Conflict:* This looks like a distinction without a difference unless "Anchored" in (3) covers "Derivatively Anchored." If "Anchored" in (3) means the robust kind in (2), then (5) contradicts (3). If "Anchored" in (3) includes the weak kind in (6), then the Intrinsic Value claim in (1) is watered down (because the weak kind doesn't have the full value).
          *   *Severity:* Medium-High. It's a definitional ambiguity.

      *   **Pair (1) vs. (7):**
          *   (1) Superiority is Intrinsic.
