answer: |-
  **Seminar Handout: Moore, Memory, and the Limits of Proof**
  **Topic:** Evaluating the "Proof of the Past" Analogy
  **Date:** [Insert Date]

  **1. Formalizing the Arguments**

  To assess whether the memory analogy undermines Moore, we must first make the structures explicit. While they appear parallel, the logical bridges differ significantly.

  **Moore's Proof of an External World**
  *   **P1:** Here is one hand (premise based on perceptual experience).
  *   **P2:** Here is another hand.
  *   **P3 (Bridge):** Hands are material objects located in space external to the mind.
  *   **C:** Therefore, there are at least two external objects.

  **The "Proof of the Past" (Memory Analogy)**
  *   **P1*:** I remember eating breakfast this morning.
  *   **P2*:** I remember my eighth birthday.
  *   **P3* (Bridge):** If I genuinely remember *p*, then *p* occurred (Factivity of Memory).
  *   **C*:** Therefore, the past exists (and memory is generally reliable).

  **Structural Divergence:**
  Moore's P1 relies on perception, which is *not* factive; "I see a hand" does not entail "There is a hand." Moore relies on the certainty of the experience to warrant the fact. In the Memory Argument, the verb "remember" is standardly treated as factive in ordinary language (you cannot remember what didn't happen). If we treat P1* as factive, the argument is trivial (C* is contained in P1*). To make it a substantive parallel to Moore, we must interpret P1* as "It seems to me that I remember" or "I have a memory impression." This requires a reliability bridge (P3*) analogous to Moore's bridge about hands being external. The skeptic attacks this bridge in both cases: "How do you know your experience veridically maps reality?"

  **2. Three Critical Questions**

  **I. The Status of the Premise: Knowledge vs. Faculty Reliability**
  Moore's defense against the charge of begging the question is that he knows P1 ("Here is a hand") with greater certainty than he knows the premises of any skeptical argument to the contrary. He claims immediate acquaintance. Does this hold for memory?

  In the perceptual case, Moore claims present-tense access. Even if he is dreaming, the *experience* is present. In the memory case, the claim is inherently retrospective. To claim "I know I remember breakfast" is to claim "I know my memory faculty is currently functioning reliably regarding the past." If the faculty under scrutiny is memory itself, asserting the truth of a memory-premise presupposes the reliability of the very mechanism the skeptic challenges. Moore can point to a present object; the memory proponent can only point to a present representation of a past object. Thus, Moore's claim to "know without proof" has more force in the perceptual case because perception offers a putative direct contact with the truth-maker (the hand), whereas memory offers contact with a trace. The memory premise's status depends on the faculty under suspicion in a way Moore's perceptual premise does not.

  **II. Empirical Unreliability: Confabulation vs. Illusion**
  Your friend argues that psychology shows memory is reconstructive and prone to confabulation. Perception suffers from illusions, but memory suffers from fabrication. Does this asymmetry defeat the Memory Argument?

  For a strict Moorean, empirical evidence of unreliability is beside the point. Moore's strategy is not to show that perception is infallible, but that the proposition "I have hands" is more certain than the complex philosophical premises required to doubt it. If we apply this consistently, the fact that memory *sometimes* fails does not prove it *always* fails. However, the *degree* of doubt matters. Visual illusions are usually detectable against a background of veridical perception. Global memory confabulation is harder to check without external corroboration (which presupposes the external world and past).

  If the Moorean move is "Common Sense > Skeptical Theory," then psychological data about reconstructive memory is just another skeptical theory. However, the memory skeptic has a stronger inductive case than the perceptual skeptic. We have independent checks on perception (touch, other observers) that are harder to deploy for the past without circularity. Therefore, the Memory Argument is dialectically weaker because the "common sense" certainty of a specific memory is lower than the certainty of a present hand. The asymmetry shows that while empirical evidence shouldn't decide metaphysical possibility, it affects the *plausibility* of the premise's certainty.

  **III. The Self-Undermining Skeptic: Five Minutes vs. Dreams**
  The memory skeptic can hypothesize that the world began five minutes ago, complete with false memories. This threatens the activity of arguing itself, as inference requires retaining premises from one step to the next. Is this a liability for the Memory Argument?

  This is a *reductio* of the skepticism, not the argument. If the Five-Minute Hypothesis is true, no argument can be constructed, including the skeptic's. The skeptic saws off the branch she sits on. The Dream Skeptic (against Moore) does not necessarily undermine logic, only the content of premises. One can reason validly within a dream.

  This suggests the Memory Argument is actually *more* robust pragmatically: to argue against it, one must assume the reliability of memory to formulate the objection. However, this makes it a transcendental condition of argumentation rather than a proof of the past. Moore's argument does not enjoy this specific protection; one can coherently dream one is hearing a lecture. Thus, the Memory Argument exposes a deeper performative contradiction in its skeptic, but this does not make it a better *proof* of the past; it merely shows that radical memory skepticism is unintelligible.

  **3. Verdict: What is a Moorean Argument?**

  Which argument does better? **Moore's Proof of an External World.**

  While the Memory Argument traps the skeptic in a performative contradiction, Moore's argument offers a stable foundation for action. The perceptual premise ("Here is a hand") carries a phenomenological weight and intersubjective checkability that memory impressions lack. The Memory Argument relies on a faculty (memory) that is temporally displaced from its object, making the "knowledge" claim inherently more fragile.

  **What does this tell us about the nature of Moorean arguments?**
  I disagree with both halves of your seminar.
  *   **Against Half 1:** The argument is not worthless. It successfully demonstrates that skepticism requires accepting premises less certain than the common-sense conclusions they deny. It functions as a *reductio* of the skeptical framework's cost.
  *   **Against Half 2:** It is not merely a "methodological stance" where the appearance of proof is incidental. The form of the proof matters. By forcing the skeptic to deny obvious truths, it highlights the absurdity of the skeptical position.

  **Conclusion:** A Moorean argument is neither a Euclidean proof (which convinces the neutral) nor a mere expression of commitment. It is a **dialectical burden-shifter**. It establishes that the burden of proof lies on the skeptic to explain why we should abandon high-certainty common-sense propositions for low-certainty philosophical hypotheses. The Memory Analogy fails to match Moore's success not because the logic differs, but because the *certainty* of the premises differs. Moore wins because holding up a hand is more certain than recalling breakfast. The lesson for the seminar is that Moorean arguments work only where the common-sense premise is immune to reasonable doubt. Where that immunity fails (as in reconstructive memory), the Moorean shield cracks.

  ***

  **Discussion Questions:**
  1. If "remember" is factive, is the Memory Argument valid but useless?
  2. Does the "Five-Minute Hypothesis" undermine the skeptic or the possibility of philosophy?
  3. Can a Moorean argument work if the premise is less than 100% certain?
