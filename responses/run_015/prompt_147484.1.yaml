answer: |-
  ### Q&A Preparation Sheet: The Durability Argument for Longtermism

  **Context:** 20-person seminar. Majority Development Micro, minority Climate/Discounting, minority Philosophy, one Standard Longtermist ally.
  **Goal:** Defend the reformulation without conceding the core "Amortization Inversion" thesis, while managing the identification critique.

  ---

  ### Part 1: The Objections (Ordered by Expected Damage)

  #### 1. The Identification Objection (Development Economists)
  **The Objection:** "You're proposing we treat 'durability' as a parameter in our welfare function, but 'depreciation rate of a norm' is not an estimand. In development, when we say an effect decays, we mean the treatment effect heterogeneity changes over time. You aren't describing decay; you're describing unobserved confounding. If you can't write down the data-generating process for the service life of a 'veto on a technology,' you haven't given us a metric to optimize. You've just replaced an unmeasurable probability with an unmeasurable half-life. How is this anything other than a label for 'things we find hard to measure'?"

  **The Reply (2 mins):**
  "I concede I cannot give you a point estimate for the half-life of a norm today. But I am not asking you to optimize on a point estimate; I am asking you to change the *classification* of the asset. In macro, we don't know the exact depreciation rate of a specific bridge, but we classify it as capital, not consumption, and we amortize it differently than we do a bag of food.
  My claim is comparative, not absolute. We know insecticide-treated nets depreciate physically in three years. We know a constitutional veto persists until actively repealed. The 'unidentified parameter' objection applies to *all* long-run forecasting, including the standard longtermist probability of existence. My reformulation moves the uncertainty from the *probability of the future existing* (which is binary and unobservable) to the *duration of the asset* (which is continuous and partially observable through historical institutional survival rates). It transforms a metaphysical guess into an empirical research program. We can study institutional survival; we cannot study counterfactual non-existence."

  *   **Concede/Hold:** Concede the lack of current estimation procedure. Hold the distinction between binary existence probability and continuous asset decay.
  *   **Soft Spot:** The claim that institutional survival is "partially observable" is weak if the specific intervention (e.g., a new AI safety norm) has no historical analogue.

  #### 2. The Discounting Objection (Climate/Public Finance)
  **The Objection:** "This looks like you are smuggling a near-zero social discount rate in through the back door. If you amortize benefits over 500 years, you are effectively saying the pure rate of time preference is zero. Furthermore, under Weitzman-style uncertainty, uncertainty about future growth rates should make us *more* impatient with uncertain long-duration assets, not less. If the service life of the good is correlated with economic growth (institutions break in crises), your durability argument collapses exactly when the discount rate spikes. You're treating the depreciation rate as orthogonal to the discount rate, but they are endogenous."

  **The Reply (2 mins):**
  "I am not arguing for a zero social discount rate on *consumption*. I am arguing for a technical depreciation rate on the *capital stock* that generates consumption. The Ramsey rule applies to the utility of the person; my argument applies to the engineering of the good. A bridge has a physical life regardless of the pure rate of time preference.
  On uncertainty: You are right that growth uncertainty raises the discount rate. But it also raises the value of *insurance*. Durable goods—specifically veto powers or safety institutions—are not consumption goods; they are risk-reduction assets. Their 'dividend' is the avoidance of a terminal shock. Uncertainty about growth makes the *payoff* of avoiding extinction higher, even if the discount rate is higher. I am not asking you to lower the discount rate; I am asking you to recognize that some investments produce a stream of 'risk reduction' that depreciates slower than consumption goods depreciate in value."

  *   **Concede/Hold:** Hold the distinction between asset decay and time preference. Concede that correlation between crises and asset failure is a risk.
  *   **Soft Spot:** The claim that risk-reduction assets are orthogonal to growth shocks. If a depression causes institutional collapse, the "durability" is illusory.

  #### 3. The Substitution/Displacement Objection (General Econ/Phil)
  **The Objection:** "This is the strongest objection to your positive half. You assume that building an institution now creates value for 500 years. But if you don't build it, someone else might build it in 30 years. The 'service life' isn't 500 years; it's the difference between 0 and 30. You are ignoring the counterfactual supply of durability. If the good is valuable, the market or the state will eventually supply it. Your 'amortization' credits you for the entire lifespan of the institution, but you only caused the *timing* of its arrival. Durability does not imply additionality."

  **The Reply (2 mins):**
  "This is the 'crowding out' critique, and it is fatal to simple durability claims. However, it relies on the assumption of substitutability. My argument rests on *path dependence*. A safety norm instituted in 2025, before a technology is deployed, locks in a trajectory. A safety norm instituted in 2055, after the technology is entrenched, may be impossible to implement or may require dismantling the system.
  The value of the durable good is not just the existence of the rule, but the *history* it prevents. If we avert a lock-in of a dangerous technology early, the 'substitute' institution 30 years later is irrelevant because the dangerous path was never taken. The durability matters because the *window of opportunity* is non-renewable. I am not amortizing the institution; I am amortizing the *avoidance of a specific path*."

  *   **Concede/Hold:** Hold on path dependence. Concede that for "generic" public goods (like basic research), substitution is a major risk.
  *   **Soft Spot:** Proving path dependence empirically is hard. A skeptic can always argue the "safe path" would have been found anyway.

  #### 4. The Fanaticism Relocation Objection (Philosophers)
  **The Objection:** "You claim to solve the fanaticism problem by removing the huge numbers of future people. But the value of a durable good is itself heavy-tailed. A 'veto on technology' could save 10^20 lives, or it could lock in a totalitarian stagnation that prevents 10^20 lives. You haven't removed the heavy tails; you've moved them from the *probability of existence* to the *valence of the institution*. And since you admit we can't measure depreciation well, we can't measure the risk of negative durability either. You've traded 'cluelessness about probability' for 'cluelessness about sign'."

  **The Reply (2 mins):**
  "I accept that durability amplifies *sign* uncertainty. A durable bad is worse than a fleeting bad. But this is a feature, not a bug, of the argument. The standard view says 'take any bet with positive EV, no matter how small the probability.' My view says 'check the sign of the durable asset before betting.'
  This reduces fanaticism because it forces a qualitative check on the *mechanism* of value, not just the magnitude. We have historical data on institutional failure and tyranny; we have no data on non-existence. We are less 'clueless' about whether an institution is oppressive than we are about the probability of space colonization. It relocates the fanaticism to a domain where human historical experience actually provides priors."

  *   **Concede/Hold:** Concede the risk of negative durability (lock-in). Hold that historical priors on institutions are better than priors on existential risk probabilities.
  *   **Soft Spot:** If the "durable good" is something novel (e.g., AI alignment code), historical priors on institutions may not apply.

  #### 5. The Ally Management Objection (The Standard Longtermist)
  **The Objection:** "You are dismantling the engine that makes longtermism action-guiding. The 'astronomical waste' argument is what motivates the field. If you tell donors they can't multiply by 10^20, you lose the urgency. You're turning a crusade into a cost-benefit analysis of institutional depreciation. Why should I abandon the expected-value framework that justifies the scale of our ambition for a 'durability' framework that sounds like public finance?"

  **The Reply (2 mins):**
  "I am not asking you to abandon the ambition; I am asking you to armor the engine. The standard EV framework is fragile—it collapses if a skeptic challenges the probability estimates, which they should. It makes us easy to dismiss as cultish.
  The Durability Argument makes longtermism robust to empirical scrutiny. It allows us to talk to development economists and climate modelers in their own language (depreciation, service life, discounting) without invoking metaphysical probabilities. It keeps the scale—the service life of a civilization-level institution is still vast—but it grounds the claim in the *physics of the intervention* rather than the *size of the population*. It trades a fragile multiplication for a robust classification. We keep the long-term, but we make it defensible in a seminar room like this."

  *   **Concede/Hold:** Hold that this is a strategic refinement. Concede that it reduces "urgency" based on pure multiplication, but argue it increases "viability."
  *   **Soft Spot:** It does lower the calculated EV of some existential risk interventions if the "durability" of the fix is uncertain.

  ---

  ### Part 2: The Three Strategic Moves

  #### 1. The Early Concession (First 2 Slides)
  **What to say:** "Before I begin, I want to be explicit about what this paper does *not* do. It does not provide a calculator for the depreciation rate of a social norm. It does not claim we can currently measure the service life of a veto power with the same precision as we measure the decay of a drug. If you are looking for a new regression specification to estimate long-term value today, I do not have it. I am proposing a change in *accounting conventions* and *asset classification*, not a new estimator."
  **Why:** This disarms the Development Economists immediately. If you pretend you have an estimator, they will spend the Q&A tearing it apart. If you admit you don't, they must engage with the *theory* of the accounting change, which is your strength.

  #### 2. The One Reply That Must Land
  **The Distinction:** You must successfully distinguish between **Discounting Value** (Social Time Preference) and **Decay of Asset** (Technical Depreciation).
  **Why:** If the Climate Economists convince the room that "Amortization = Low Discount Rate," your paper becomes a trivial restatement of the Ramsey rule debate. You need them to see that a bridge rots (depreciation) regardless of whether we care about the future (discounting). If you lose this distinction, the "Amortization Inversion" collapses.
  **Phrasing:** "The discount rate determines how much we value the future bridge. The depreciation rate determines how long the bridge stands. I am arguing that longtermist interventions are bridges, not cash transfers. You can apply a high discount rate to the bridge's benefits, but if the bridge lasts 500 years and the cash lasts 1, the *ratio* of long-term value shifts regardless of the discount rate."

  #### 3. The Question You Hope Nobody Asks
  **The Question:** "How do you empirically distinguish a 'durable good with unmeasured depreciation' from a 'non-durable good with unmeasured spillovers'?"
  **Why it's dangerous:** A development economist might argue that a cash transfer *is* durable if it allows a child to stay in school, leading to higher lifetime earnings (human capital). If "durability" just means "has long-term effects," then your distinction vanishes. Every intervention has some durability.
  **Your Defense (if asked):** "It is a distinction of *mechanism*, not just outcome. Human capital depreciates if not used (skills fade). An institution or a veto power persists *without* active maintenance in a way that human capital does not. A law remains on the books until repealed; a skill fades if not practiced. I am distinguishing between *stock variables* that persist by inertia versus *flow variables* that require continuous reinvestment. But I concede the boundary is fuzzy."

  ---

  ### Part 3: Assessment of Your Weakest Point

  **The Weakness:** You offer no procedure for estimating depreciation rates, and "durable" may be empirically indistinguishable from "difficult to measure."

  **How bad is it?**
  It is critical, but survivable *if* framed correctly.
  *   **If framed as an empirical claim:** It is fatal. If you say "We can measure this," the Dev Econs will destroy you.
  *   **If framed as a theoretical/accounting claim:** It is robust. You are arguing that the *current* accounting convention (measuring only near-term effects) is biased against durable goods. You don't need the perfect estimator to prove the bias exists.

  **What it leaves you with:**
  It leaves you with a **research agenda** rather than a **policy prescription**.
  *   *Do not say:* "Fund durable goods because they are better."
  *   *Do say:* "Current cost-effectiveness analysis systematically undercounts durable goods. Until we have better estimators for depreciation, we should treat near-term CE metrics as incomplete for long-run planning."

  **Final Advice:**
  Lean into the "Accounting" metaphor. Economists understand that accounting conventions (like depreciation schedules) are arbitrary but necessary. Argue that current longtermism uses "cash accounting" (counting value when realized) and you are proposing "accrual accounting" (allocating value over the life of the asset). This resonates with the Public Finance crowd and sidesteps the Dev Econ demand for immediate identification. You aren't asking them to identify the parameter today; you are asking them to acknowledge the parameter *exists* and is currently set to zero by convention.
