  | 4 | **Proxy-Randomiser:** An agent with incoherent credences but a coherent decision policy avoids exploitation; this shows exploitability is contingent on policy, but does not redeem the defective credence state itself. | Awkward | Dismiss |

  Your insulation worry is well-founded: if you define the "real defect" as accuracy-dominatedness and then explain away every case where pragmatic vulnerability comes apart from accuracy as "merely pragmatic," you are wearing unfalsifiable clothes. Credences are functional states designed to guide action; a norm of credence that is principledly insulated from action-guidance risks being otiose. It is principled only if you can explain why the representational function is distinct from the practical function without simply stipulating that they come apart whenever it suits the theory. If the betting story tracks a constraint on agency that the accuracy story misses, you cannot dismiss it as mere colour without losing the link between belief and agency.

  Verdict: serious
  \answer{serious}
