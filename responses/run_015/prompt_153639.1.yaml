          *   **Dual-Use:** Can an activity be *both* mined for data *and* experienced as intrinsic? (Instrumentality vs. Phenomenology).

      *   *Conceptual:*
          *   **Schlick's Intent:** Schlick was fighting against *puritanical* work ethics, not surveillance capitalism. Does the *external* purpose (platform profit) negate the *internal* purpose (user joy)? Schlick focused on the *agent's* attitude, not the *system's* extraction.
