prompt: |-
  I'm writing an essay on the metaphysics of personal identity and I keep coming back to Parfit's teletransporter, but a colleague's summary of his position has me worried I've misread him. He put it this way: "Parfit's point is that personal identity is an illusion. When you're teletransported, you don't survive — you die, and a copy is created on the other end. What matters in survival is just that someone psychologically similar shows up, so really Parfit is saying you should be reassured that your copy is basically you, even though strictly speaking you're dead." I don't think this is what Parfit says, but I can't quite articulate where it goes wrong. Could you go through it and tell me which parts a defender of Parfit's actual position would accept, which are subtle misstatements, and which are outright wrong? I'm especially interested in where it blurs his reductionism about identity with his claim about what matters (Relation R), and whether the conclusion that Parfit is a death-plus-copy view actually follows from the accurate parts.
