prompt: |-
  ok so i keep running into simpson's paradox in the wild — not the textbook examples everyone already knows (kidney stones, berkeley admissions, whatever) but messier cases where the "right" way to slice the data isn't obvious and there's no rct to fall back on. and every discussion i read eventually says something like "well you need a causal model" which, sure, but what does that actually commit me to? before i go deep into pearl or rubin or whoever, i want the spec: what would an adequate theory of how to handle simpson's-reversal cases actually have to deliver?

  so write me the desiderata list. what cases must it get right, what distinctions can't it collapse, what formal constraints (from probability, decision theory, whatever) does it have to respect? for each one, give the motivating example or argument — i want to know what breaks if you drop it, not just that it's on the list.

  the thing i'm really after: are there desiderata on this list that can't be jointly satisfied? like, is there a tension between "always give a determinate answer about which level of aggregation is correct" and "don't give wrong answers when you lack causal info"? or between respecting the sure-thing principle and respecting whatever it is that makes the kidney-stone example go the way it does? if some subset is mutually unsatisfiable, that's the result i most want to see spelled out — i half-suspect the list itself is the contribution, not any particular theory that tries to meet it.

  optional: quick scorecard for pearl's scm framework, the potential-outcomes camp, and the "just report all the stratifications and let the reader decide" approach. but the weight should be on the criteria themselves — i can do the scoring once i know what the criteria are, and i'd rather not have the scoring eat up space that should go to motivating why each desideratum actually matters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Simpson's Paradox (SP) in messy, real-world observational data (not textbook cases).
      *   **Core Question:** What are the *desiderata* for an adequate theory of handling SP? What must such a theory deliver?
      *   **Specific Requirements:**
          *   List the desiderata (cases to get right, distinctions to keep, formal constraints).
          *   Provide motivating examples/arguments for *why* each desideratum matters (what breaks if dropped).
          *   **Crucial:** Identify tensions or impossibility results (are there mutually unsatisfiable desiderata?).
          *   **Optional:** Scorecard for Pearl (SCM), Rubin (Potential Outcomes), and "Report All Stratifications." (Keep this brief if included).
      *   **Tone:** Sophisticated, technical but pragmatic, avoiding hand-wavy "you need a causal model" platitudes. The user knows the basics and wants the *spec*.

  2.  **Deconstruct Simpson's Paradox:**
      *   What is it really? It's a reversal of an association ($P(Y|X) > P(Y|\neg X)$) when conditioning on a third variable $Z$ ($P(Y|X, Z) < P(Y|\neg X, Z)$ for all $Z$).
      *   Why is it hard? Because probability theory alone doesn't tell you whether to trust the aggregated or the disaggregated data. Both are mathematically valid conditional probabilities. The choice depends on the *data generating process*.
      *   The user is asking for the *normative criteria* for making that choice.

  3.  **Brainstorming Desiderata:**
      *   *D1: Consistency with Probability.* Can't violate axioms.
      *   *D2: Causal Coherence.* If $Z$ is a mediator, don't block it. If $Z$ is a confounder, do block it.
      *   *D3: Decision Relevance.* The answer should guide action (Savage/Sure-Thing Principle).
      *   *D4: Robustness to Unmeasured Confounding.* (Maybe too hard, but worth noting).
      *   *D5: Non-Arbitrariness.* Can't just pick the stratification that gives the desired result (p-hacking).
      *   *D6: Handling Colliders.* Don't condition on colliders (selection bias).
      *   *D7: Temporal Precedence.* Cause before effect.

  4.  **Identifying Tensions/Impossibility Results (The "Meat"):**
      *   *The Sure-Thing Principle (STP) vs. Aggregation.* STP says if $A$ is better than $B$ in every subpopulation, it's better in the total. But SP shows $A$ can be better in subpopulations but worse in total. Which one governs *action*?
      *   *Causal vs. Evidential.* If I just want to predict (evidential), the aggregate might be best. If I want to intervene (causal), the stratified might be best. A theory needs to distinguish these goals.
      *   *The "No Causal Info" Problem.* If I *don't* know the graph, can I still give an answer? If I say "always stratify," I break things (colliders). If I say "never stratify," I break things (confounders).
      *   *Key Tension:* **Identifiability vs. Determinacy.** To give a *determinate* answer (do X, not Y), you need causal info. If you demand a determinate answer *without* causal info, you will be wrong sometimes.
      *   *Key Tension:* **Sufficiency vs. Necessity of Stratification.** There is no purely statistical test to determine if $Z$ is a confounder, mediator, or collider.

  5.  **Drafting the Desiderata List (Iterative Refinement):**

      *   *Desideratum 1: The Action-Guiding Constraint (Decision Theory).*
          *   Why: SP is usually about policy/treatment.
          *   Breakage: If you optimize for prediction instead of intervention, you might choose the wrong aggregate.
      *   *Desideratum 2: The Confounder/Mediator Distinction (Causal Structure).*
          *   Why: Kidney stones (mediator = size of stone? No, treatment choice depends on size. Size is confounder). Wait, classic example: Treatment -> Stone Size -> Recovery? No. Treatment -> Recovery. Stone Size -> Treatment AND Stone Size -> Recovery.
          *   Breakage: Conditioning on a mediator blocks the path. Conditioning on a collider opens a path.
      *   *Desideratum 3: The Sure-Thing Principle Compliance.*
          *   Why: Rational choice.
          *   Breakage: If you ignore STP, you accept Dutch Books.
      *   *Desideratum 4: Statistical Adequacy (No Purely Statistical Resolution).*
          *   Why: You can't solve SP with $p$-values or sample sizes.
      *   *Desideratum 5: Transparency of Assumptions.*
          *   Why: "Messy cases" mean the graph is disputed.

  6.  **Developing the Impossibility/Tension Section:**
      *   This is the most important part for the user.
      *   *Tension 1: The "Blind" Resolution.* You cannot satisfy "Always give a determinate answer" AND "Never give a causally wrong answer" without causal assumptions.
      *   *Tension 2: STP vs. Aggregation.* STP applies to *causal* effects, not *associational* ratios. If you apply STP to associations, you break.
      *   *Theorem:* No purely probabilistic criterion can distinguish a confounder from a collider. (Spirtes, Glymour, Scheines).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that "get a causal model" is a placeholder, not a solution.
      *   **Section 1: The Desiderata Spec.** (The "Must Haves").
          *   D1: Action-Guiding (Decision-Theoretic).
          *   D2: Structural Sensitivity (Confounder vs. Mediator vs. Collider).
          *   D3: Sure-Thing Principle (Causal version).
          *   D4: Non-Identifiability from Distribution Alone.
      *   **Section 2: The Tensions/Impossibility Results.** (The "Gotchas").
          *   The "Blindness" Impossibility.
          *   The "Prediction vs. Intervention" Trade-off.
      *   **Section 3: Optional Scorecard.** (Keep it tight).
      *   **Conclusion:** Summary of the trade-off.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *associational* STP and *causal* STP. Savage's STP is about acts and states. In SP, the "states" are the strata. If the strata are not causally relevant states, STP doesn't apply.
      *   *Clarification:* Ensure the Kidney Stone example is referenced correctly (Stone Size is a confounder of Treatment and Recovery, but Treatment also affects Recovery directly. Wait, in the classic SP, Stone Size determines Treatment *and* Recovery. So it's a confounder. We must stratify. If we condition on a post-treatment variable, that's a mediator, and we shouldn't stratify).
      *   *Emphasis:* The user wants to know what *breaks*. I need to be explicit. "If you drop D2, you open collider bias."
      *   *Impossibility:* Cite the fact that observationally equivalent DAGs exist. You can't distinguish $X \to Z \to Y$ from $X \leftarrow Z \to Y$ just with data.

  9.  **Final Polish:** Check tone. Ensure it sounds like a technical specification document for a philosophical/statistical framework. Avoid fluff.

      *(Self-Correction on the "Scorecard"):* The user said optional, but weight should be on criteria. I will include a very condensed version at the end as requested, but keep the focus on the criteria.

      *(Refining the "Tension"):* The big tension is between **Procedural Determinacy** (give me an algorithm that outputs "Stratify" or "Don't") and **Causal Safety** (don't bias the estimate). Without causal input, you can't have both.

  10. **Final Review against constraints:**
      *   Desiderata list? Yes.
      *   Motivating examples/what breaks? Yes.
      *   Tensions/Impossibility? Yes.
      *   Scorecard? Brief.
      *   Tone? Technical/Spec-like.

      *Let's write.*
answer: |-
  This is a specification request for a normative theory of causal inference in the presence of Simpson's Paradox (SP). You are asking for the API documentation for causal reasoning, not the implementation.

  The core problem is that SP is not a statistical error; it is a *category error*. It occurs when associational data is treated as interventional data. Therefore, any adequate theory must specify the conditions under which an association licenses an intervention.

  Here is the desiderata list for an adequate theory of Simpson's Reversal, followed by the impossibility results that constrain any such theory.

  ---

  ### Part 1: The Desiderata Spec

  An adequate theory must satisfy the following five constraints. If a framework violates any of these, it yields systematically wrong decisions in known edge cases.

  #### D1: The Action-Guiding Constraint (Decision-Theoretic Validity)
  **Specification:** The theory must distinguish between *predictive* queries ($P(Y|X)$) and *interventional* queries ($P(Y|do(X))$). It must not recommend a stratification strategy for prediction that differs from the one for intervention without explicitly flagging the goal shift.
  **Motivation:** In the classic Kidney Stone example, if you are a hospital administrator predicting success rates for billing, the aggregated data might be accurate (reflecting the mix of patients you actually get). If you are a doctor choosing a treatment, the stratified data is required.
  **What Breaks:** If you collapse this distinction, you commit the **Intervention-Prediction Fallacy**. You might optimize a policy based on aggregate associations, only to find the effect reverses upon implementation because the implementation changes the distribution of the confounding variable (Goodhart's Law / Lucas Critique).

  #### D2: The Structural Sensitivity Constraint (Confounder vs. Mediator vs. Collider)
  **Specification:** The theory must provide distinct handling rules for variable $Z$ based on its structural role relative to $X$ and $Y$:
  1.  **Confounder ($X \leftarrow Z \to Y$):** Must condition/stratify.
  2.  **Mediator ($X \to Z \to Y$):** Must *not* condition (if estimating total effect).
  3.  **Collider ($X \to Z \leftarrow Y$):** Must *not* condition.
  **Motivation:**
  *   *Confounder:* Failing to stratify leaves backdoor paths open (Bias).
  *   *Mediator:* Conditioning blocks the causal path you are trying to measure (Over-control bias). Example: If $X$ is a drug, $Y$ is health, and $Z$ is blood pressure (mechanism), stratifying by $Z$ hides the drug's effect.
  *   *Collider:* Conditioning induces spurious correlation where none exists (Selection Bias). Example: Conditioning on "Hospitalization" ($Z$) creates a negative correlation between "Disease A" ($X$) and "Disease B" ($Y$) among hospitalized patients, even if they are independent in the general population.
  **What Breaks:** If the theory treats all $Z$ as "covariates to be regressed out," it will induce bias in Mediator and Collider cases. There is no monotonic relationship between "more control" and "less bias."

  #### D3: The Causal Sure-Thing Principle
  **Specification:** If action $A$ is preferred to action $B$ in every stratum of a partition $Z$, and $Z$ is not affected by the action, then $A$ is preferred to $B$ in the aggregate.
  **Motivation:** This is the normative core of why we care about SP. We want to know when the subpopulation preference dominates the aggregate preference.
  **Crucial Caveat:** This applies to *causal* effects, not *associational* ratios.
  **What Breaks:** If you apply the Sure-Thing Principle to raw associations (as Savage originally formulated it before causal semantics were clarified), you validate the aggregated result in confounding cases. You must restrict STP to partitions that are *causally prior* to the treatment. If you drop this restriction, you cannot justify preferring the stratified estimate in the Kidney Stone case.

  #### D4: Distributional Insufficiency (The "No-Free-Lunch" Constraint)
  **Specification:** The theory must acknowledge that the joint probability distribution $P(X, Y, Z)$ is insufficient to determine whether to stratify on $Z$.
  **Motivation:** The same numerical data can be generated by a Confounder model ($X \leftarrow Z \to Y$) or a Mediator model ($X \to Z \to Y$). The numbers look identical; the correct action is opposite.
  **What Breaks:** Any theory claiming to resolve SP using only statistical tests (e.g., significance of the interaction term, change in coefficient size) is mathematically unsound. It implies that causal structure is identifiable from observational data alone, which violates the **Underdetermination of Theory by Data**.

  #### D5: Assumption Transparency (The "Graphical Audit" Requirement)
  **Specification:** The theory must require the user to explicitly state the assumed causal graph (or equivalence class) before recommending an aggregation level. It cannot hide causal assumptions inside "model selection" criteria like AIC/BIC.
  **Motivation:** In messy real-world cases, the "right" slice is disputed. One expert says $Z$ is a confounder; another says it's a collider.
  **What Breaks:** If assumptions are hidden, the analysis becomes unfalsifiable. A practitioner can "shop" for the stratification that yields the desired $p$-value. Transparency forces the debate onto the causal structure (which can be argued on scientific grounds) rather than the statistical output (which is treated as objective fact).

  ---

  ### Part 2: The Tensions and Impossibility Results

  You asked if there are desiderata that cannot be jointly satisfied. **Yes.** There is a fundamental trilemma between **Determinacy**, **Causal Safety**, and **Observational Purity**.

  #### Tension 1: The "Blind Resolution" Impossibility
  *   **Conflict:** You cannot satisfy **D1 (Action-Guiding)** and **D4 (Distributional Insufficiency)** while also demanding **Procedural Determinacy** (an algorithm that takes data and outputs "Stratify" or "Don't").
  *   **The Proof:** Since $P(X,Y,Z)$ is compatible with multiple DAGs (e.g., $X \leftarrow Z \to Y$ vs $X \to Z \to Y$), and these DAGs require opposite actions (Stratify vs. Don't), no function $f(Data) \to Action$ can be correct for all compatible DAGs.
  *   **Consequence:** Any framework that promises to "detect Simpson's Paradox" purely from the data is lying. It is implicitly assuming a causal structure. If you demand a determinate answer without supplying causal info, you *must* violate D2 (Structural Sensitivity) in some possible worlds.

  #### Tension 2: The Sure-Thing Principle vs. Aggregation Stability
  *   **Conflict:** There is a tension between **D3 (Causal STP)** and the desire for **Aggregate Stability** (the idea that the overall population effect should matter).
  *   **The Break:** In cases where $Z$ is a *mediator*, the Causal STP implies we should look at the aggregate (total effect). In cases where $Z$ is a *confounder*, Causal STP implies we should look at the strata (direct effect).
  *   **The Impossibility:** You cannot have a single metric (e.g., "The Risk Ratio") that satisfies STP across *both* confounding and mediating scenarios.
      *   If you define the metric to satisfy STP for confounders (by stratifying), you break it for mediators (by blocking the path).
      *   If you define the metric to satisfy STP for mediators (by aggregating), you break it for confounders (by leaving bias open).
  *   **Consequence:** You cannot have a context-free "Effect Size." The definition of the estimand must change based on the graph. This violates the intuition that "the effect of X on Y" is a single number waiting to be found.

  #### Tension 3: Robustness vs. Precision (The M-Bias Problem)
  *   **Conflict:** **D2 (Structural Sensitivity)** vs. **Robustness to Unmeasured Confounding**.
  *   **The Break:** Sometimes, conditioning on a pre-treatment variable $Z$ *creates* bias (M-Bias / Collider Bias) where none existed before. However, leaving $Z$ unconditioned might leave other confounding paths open.
  *   **Consequence:** There is no "safe" default.
      *   Default "Adjust for everything pre-treatment" $\to$ Breaks on Colliders/M-Bias.
      *   Default "Adjust for nothing" $\to$ Breaks on Confounders.
      *   **Result:** You are forced into **D5 (Assumption Transparency)**. You cannot have a robust default strategy. You must take a stance on the specific graph, which exposes you to criticism if the graph is wrong.

  ---

  ### Part 3: Brief Scorecard

  Here is how the major frameworks score against the desiderata, specifically regarding the tensions above.

  | Framework | D1 (Action) | D2 (Structure) | D3 (STP) | D4 (No-Free-Lunch) | D5 (Transparency) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pearl (SCM / DAGs)** | **Pass**. Explicit $do$-operator separates prediction from intervention. | **Pass**. d-separation rules handle Confounder/Mediator/Collider distinctly. | **Pass**. STP applies to $do$-calculus, not raw probabilities. | **Pass**. Explicitly states causal assumptions are required; no statistical test for DAGs. | **Pass**. Requires drawing the graph; assumptions are visible. | **Best fit for spec.** Solves the "what breaks" by forcing the graph upfront. |
  | **Rubin (Potential Outcomes)** | **Pass**. Distinguishes $\mathbb{E}[Y(1)]$ from $\mathbb{E}[Y|X=1]$. | **Mixed**. Relies on "Ignorability" assumptions ($Y(1) \perp X \| Z$). Harder to visualize Colliders/M-Bias without DAGs. | **Pass**. SUTVA and Ignorability encode STP logic. | **Pass**. Acknowledges assumptions are untestable. | **Mixed**. Assumptions often buried in "selection of covariates" rather than explicit graph. | **Functionally equivalent** to SCM but higher cognitive load to avoid D2 errors (e.g., conditioning on colliders). |
  | **"Report All Stratifications"** | **Fail**. Leaves the user to guess which table governs action. | **Fail**. Implies all slices are equally valid candidates. | **Fail**. Provides no rule to apply STP. | **Pass**. Does not claim to solve the identification problem. | **Pass**. Shows the data, hides the decision. | **Kicks the can.** Satisfies D4/D5 by refusing to answer D1/D2. Useful for exploration, useless for policy. |

  ### Summary Conclusion

  The spec reveals that **Simpson's Paradox is not a statistical puzzle; it is a causal identification problem.**

  The critical impossibility result you are looking for is this: **There is no statistical criterion that is both necessary and sufficient for deciding whether to stratify.**

  Therefore, any theory that claims to resolve SP without committing to a causal graph violates **D4**. Any theory that refuses to commit to a causal graph violates **D1**.

  The "cost" of the adequate theory (Pearl's SCM) is that it forces you to make untestable assumptions (the edges in the graph) explicit. The "benefit" is that it prevents you from making arithmetic errors in reasoning about those assumptions. If you want a determinate answer in messy cases, you must pay for it with causal assumptions. If you refuse to pay, you must accept indeterminacy.
