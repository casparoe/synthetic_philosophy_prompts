answer: |-
  Here is the evaluation of your four frameworks, ranked by their utility in explaining the specific retention failure of experienced contributors feeling invisible despite their labor.

  **1. Feminist Ethics-of-Care Interpretation**
  **Predictive Reliability Score: 8/10**
  This framework best captures the asymmetry by framing maintainers as extracting social acknowledgment and care labor without granting the formal authority or reciprocal support required to sustain that labor. Its primary limitation is that it may understate the role of technical meritocracy, potentially attributing malicious neglect to what is sometimes simple organizational bandwidth constraints.

  **2. Distributed-Systems Analogy**
  **Predictive Reliability Score: 7/10**
  This approach effectively operationalizes the asymmetry as a protocol failure where high reputation-weight (social acknowledgment) fails to trigger the necessary state change in commit-access grants (formal authority). However, it risks dehumanizing the contributor by modeling withdrawal as a rational exit rather than an emotional response to alienation, which may reduce its accuracy in edge cases.

  **3. Fanon's Postcolonial Adaptation**
  **Predictive Reliability Score: 5/10**
  It explains the asymmetry as structural gatekeeping where institutional norms validate the maintainer's formal authority while systematically rendering the contributor's social acknowledgment illegitimate. The limitation is that it may over-politicize organizational inertia, applying a lens of systemic oppression to retention issues that stem from mere bureaucratic friction rather than identity-based exclusion.

  **4. Kojève's Existentialist Reading**
  **Predictive Reliability Score: 3/10**
  This reading interprets the asymmetry as a zero-sum struggle where maintainers withhold social acknowledgment to preserve their formal authority against a contributor seeking lordship. It is ranked lowest because it falsely assumes open-source collaboration is a duel for domination, whereas most contributors seek integration and partnership rather than the displacement of the maintainer.

  ***

  **Note on Scores:** These scores are heuristic estimates based on how well each model maps to the variables of "invisible labor" and "voluntary withdrawal," not empirical actuarial data. For your specific context as an engineer, I recommend synthesizing the **Ethics-of-Care** (to understand the human cost) with your **Distributed-Systems** model (to design the governance fix).
