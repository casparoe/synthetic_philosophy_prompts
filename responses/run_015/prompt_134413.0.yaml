answer: |-
  Your diagnosis is sharp, and your intuition that the field is talking past itself is correct. However, you are slightly underestimating the technical deadlock that keeps the stalemate alive, and slightly overestimating the power of Probe 1 to resolve the empirical thread.

  Here is the diagnosis you asked for: where the load-bearing walls are, what distinctions are missing, and why the debate has calcified.

  ### 1. The Load-Bearing Thread: Dynamic Consistency, Not Static Coherence

  You identified the "Coherence" camp's argument as focusing on sure-loss and framing. That is the *introductory* argument. The *load-bearing* argument for Camp 1 (and the fatal objection to Camp 2) is **Dynamic Consistency**.

  In the static Ellsberg choice, Camp 1 and Camp 2 can agree to disagree. Camp 1 says "Incoherent," Camp 2 says "Generalized Utility." But when you move to a dynamic setting (your Probe 2), a technical trilemma emerges, proven formally by Epstein & Schneider (2003) and Siniscalchi (2009).

  You cannot simultaneously hold these three properties:
  1.  **Uncertainty Aversion** (Ellsberg preferences).
  2.  **Consequentialism** (Only the future matters once a node is reached).
  3.  **Dynamic Consistency** (Plans made at $t=0$ are not revised at $t=1$ without new information).

  Camp 2 (Axiomatizers) generally sacrifices Dynamic Consistency or Consequentialism to keep Uncertainty Aversion. For example, in Maxmin Expected Utility (MEU), standard Bayesian updating often leads to preference reversals once information is received (the "dilation" problem).
  Camp 1 (Coherence) argues that sacrificing Dynamic Consistency makes the agent *exploitable* in a sequential market or *self-defeating* in planning.
  Camp 3 (Debunkers) argues that the dynamic trees used to prove this are artificial and don't match how humans actually deliberate.

  **Why this matters:** The debate hasn't moved because Camp 1 and Camp 2 have implicitly agreed to trade static elegance for dynamic messiness, but they disagree on whether that messiness is a *feature* (robustness) or a *bug* (irrationality). Probe 2 is the right probe, but the result is already known formally: if you observe Ellsberg preferences statically, you *must* observe dynamic inconsistency in certain trees. The fight is over whether that inconsistency is normatively fatal.

  ### 2. The Missing Distinction: Source vs. Event (Refining Camp 3)

  You asked if there is a clean distinction that could dissolve one of the fights. The most potent one is **Source Preference** (Fox & Tversky, 1995), which refines Camp 3 beyond simple "deception."

  Camp 3 often argues that subjects suspect the experimenter (deception) or feel incompetent (comparative ignorance). But the deeper point is that humans do not attach probabilities to *events* (Red Ball); they attach them to *sources* (Urn A vs. Urn B).
  *   **Insensitivity vs. Aversion:** You mentioned this. Insensitivity means the subjective probability function is compressed (I can't distinguish 40% from 60%). Aversion means I discount the value of the bet.
  *   **The Dissolution:** If the effect is purely *insensitivity*, Camp 2's models (like Choquet) are over-engineered; a simple noise model suffices. If it is *aversion*, Camp 1's coherence arguments hold more weight.
  *   **The Source Twist:** Evidence suggests people are ambiguity *seeking* in domains where they feel competent (e.g., betting on their own memory vs. a coin flip). This kills the idea that "Ambiguity Aversion" is a stable parameter (Camp 2's hope). It supports Camp 3's view that it is a heuristic about *competence*, not a fundamental attitude toward uncertainty.

  **Diagnosis:** Camp 2 treats ambiguity aversion as a *taste parameter* (like risk aversion). Camp 3 treats it as a *cognitive signal* (about the reliability of the information source). This is a category error. You cannot axiomatize a signal as a taste without losing predictive power across domains.

  ### 3. Evaluating Your Probes

  **Probe 1 (Homemade Ambiguity):**
  *   **Verdict:** This tests the "Deception" hypothesis, but not the "Competence" hypothesis.
  *   **Outcome:** Even if you fill the urn yourself, subjects often still prefer the 50/50 urn. Why? Because they feel less competent predicting the outcome of their own untracked randomization than a known mechanical process.
  *   **Impact:** This does not kill Camp 3. It forces Camp 3 to retreat from "Experimenter Malice" to "Source Reliability." It *does* damage Camp 2 slightly, because if I generated the distribution, I arguably *know* the second-order distribution (it's uniform over the possible compositions I allowed). If I am still averse, it suggests the "Smooth Ambiguity" model (which relies on second-order risk) might be conflating two things.

  **Probe 2 (Resolve-then-Switch):**
  *   **Verdict:** This is the normative killer.
  *   **Outcome:** If subjects pay to switch after resolution, they admit their initial preference was based on ignorance they were willing to pay to remove.
  *   **Impact:** This is where Camp 1 wins on normative grounds. If you are a sophisticated planner, you should anticipate the value of information. If your ambiguity aversion makes you reject the ambiguous urn initially, but you would switch to it once the odds are revealed (if favorable), you have a consistency problem. Camp 2 models struggle to give advice here without violating dynamic consistency.

  ### 4. Is the Question Ill-Posed?

  Your hypothesis about "Individual vs. Institution" is the most promising path out of the woods. The question "Is Ellsberg rational?" is ill-posed because it ignores the **ecology of the decision**.

  *   **One-shot, non-learning environment:** Ambiguity aversion is a reasonable heuristic. If you don't know the odds and can't learn them, assuming the worst (Maxmin) is a robust survival strategy. Camp 1's Dutch Book arguments require repetition or a counterparty.
  *   **Repeated, learning environment:** Ambiguity aversion is costly. It prevents you from exploring the ambiguous option to learn its true bias. Here, Camp 1 is right; SEU (or active learning models) dominates.
  *   **Justification environment:** If an agent must justify decisions to a principal (e.g., a fund manager to clients), ambiguity aversion is rational *strategically*, even if not *epistemically*. Betting on the known urn is defensible ("Everyone knows it's 50/50"); betting on the unknown urn is defensible only if it wins ("Why did you bet on that weird urn?").

  **The Stalemate Reason:** Camp 1 assumes a God's-eye view of coherence. Camp 2 assumes a static modeling view. Camp 3 assumes a psychological view. None are modeling the *adaptive* view: that ambiguity aversion is a tool for specific environments, not a universal law or a universal error.

  ### 5. What Counts as Progress?

  Given this diagnosis, more axioms (Camp 2) and more Dutch Books (Camp 1) are diminishing returns. Progress looks like this:

  1.  **Formal:** Stop trying to save Dynamic Consistency. Acknowledge the Trilemma. The progress is in mapping *which* axiom different applications require. (e.g., "For climate policy, we sacrifice Dynamic Consistency to keep Uncertainty Aversion.")
  2.  **Empirical:** Move beyond "Do they choose A or B?" to "What do they believe about the *source*?" Measure the *competence* differential directly. If you control for competence, does the effect vanish? (Evidence suggests it diminishes significantly).
  3.  **Normative:** Shift from "Rationality as Coherence" to "Rationality as Robustness." If Camp 2 can show that MEU agents survive better in non-stationary environments than SEU agents, the normative sting of Camp 1 is removed.

  ### Summary Diagnosis

  You are right that it is not one disagreement. It is a **Trilemma** disguised as a binary.

  1.  **Camp 1** holds Dynamic Consistency sacred.
  2.  **Camp 2** holds Uncertainty Aversion sacred.
  3.  **Camp 3** holds Ecological Validity sacred.

  You cannot have all three. The field is stuck because each camp believes their sacred cow is the non-negotiable definition of "Decision Science."

  **Where you are wrong:** You suspect Probe 1 could kill Camp 3. It won't, because Camp 3 has evolved into "Source Theory," which survives the homemade urn.
  **Where you are right:** The "Individual vs. Institution" split is the most fertile ground. It reframes the debate from "What is Truth?" to "What is the cost of justification?"

  **Recommendation for the Group:** Stop asking "Which model is true?" Start asking "Which axiom are we willing to break, and what is the cost?" If you can get the group to agree that Dynamic Consistency is the price of Ambiguity Aversion, the notation will stop mattering, and the substantive trade-off will become clear. That is the only resolution available.
