answer: |-
  For psychological facts to bear on moral truth, moral properties must be natural kinds or constructed from human flourishing. If morality is purely non-natural, intuition surveys are epistemologically inert. We require a naturalist or coherentist metaethics for this debate to matter normatively.

  1. **Juna:** Half right. Theoretical scope is a virtue, but only if the additional "data" (intuitions) are veridical. Counting more intuitions isn't counting more truths if the extra foundations track irrelevant stimuli rather than moral reality. Comprehensiveness requires accuracy, not just volume.

  2. **Peter:** Basically right. Sensitivity isn't accuracy. Evolutionary adaptations for group cohesion or pathogen avoidance aren't automatically truth-tracking for normative ethics. Extra inputs can indeed be noise, not signal, if they don't track moral reasons.

  3. **Juna:** Basically right. Dismissing specific intuitions as noise requires a prior normative framework. Using a narrow framework to exclude broad data is question-begging without independent justification external to the framework. It assumes the conclusion it seeks to prove.

  4. **Peter:** Half right. Genealogical debunking is powerful but incomplete. Showing a biological cause doesn't prove the intuition lacks normative weight; the is-ought gap remains unless the cause explicitly excludes truth-tracking capabilities. If disgust tracks contamination risk, it might track real harm, just indirectly.

  5. **Juna:** Basically right. The debunking dilemma bites both sides equally. Furthermore, functional utility (social stability) can exist even if the psychological mechanism is arguably visceral rather than rational deliberation. Value can survive causal explanation.

  6. **Peter:** Basically right. This demands public justification. You cannot validate a moral claim solely by appealing to the intuition that generates it; neutral translation is required for normative force across competing frameworks. Raw intuition isn't argument; it needs reasons accessible to those lacking the intuition.

  Both miss that foundations aren't fixed traits but adaptive strategies for different social ecologies. The clustering reflects trade-offs between group cohesion and individual autonomy required by different societal structures. The political split is ecological, not just psychological, mapping onto distinct survival strategies.
