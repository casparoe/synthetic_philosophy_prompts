answer: |-
  Here is the principle derived from your verdicts, tested against your cases, and stress-tested against the edges you identified.

  ### The Principle: The Proximate-Score Constraint

  **Rule:** *Weight the inside view in proportion to the immediacy and objectivity of the feedback loop available to the estimator; narrow the reference class only along dimensions where the correlation between the narrowing feature and the outcome is empirically tabulated, not theoretically asserted.*

  This is not two rules, but a single decision procedure with two gates. Gate 1 determines **Weight** (Inside vs. Outside). Gate 2 determines **Class Construction** (Broad vs. Narrow). They do not conflict; they operate sequentially. If Gate 1 assigns high weight to the inside view, Gate 2 is irrelevant. If Gate 1 assigns high weight to the outside view, Gate 2 dictates how specific that view may be.

  #### Clause 1: The Weighting Gate (Inside vs. Outside)
  **Statement:** Trust an estimator's specific narrative only if the claim is decomposable into sub-components that will be scored objectively within a timeframe short enough to correct error before the final outcome.
  **Motivating Case:** *The Fusion Lab Pair.*
  *   **Verdict:** The "shot rate" claim is trusted (Inside View) because the power supply is installed, run at half power, and will be scored in months. The "net energy" claim is distrusted (Outside View) because it is years away, aggregates thousands of untested variables, and sits on an optimism gradient where error correction is impossible until failure is total.
  *   **Application:** This explains why you trust the mechanic's clutch (immediate physical test, scored every time the car shifts) but not the institute's ten-year plan (no intermediate scoring of "project success" until decade's end).

  #### Clause 2: The Narrowing Gate (Reference Class Selection)
  **Statement:** When the Outside View is required, narrow the reference class only along dimensions where you possess a dataset of counted outcomes linking that feature to success/failure. Never narrow along dimensions that are merely *causes* of the estimator's confidence.
  **Motivating Case:** *The Writer vs. The Institute.*
  *   **Verdict:** You narrow for the writer (n=4 books) because "books finished" is a counted outcome with dates. You refuse to narrow for the institute ("well-funded") because funding is a *cause* of their confidence, not a tabulated history of outcomes. "Well-funded projects" is a narrative class, not a statistical one, unless you have a ledger showing funding levels vs. completion rates.
  *   **Application:** This prevents the "This Time Is Different" fallacy. Being "well-funded" or "dedicated" is the *story* they tell to explain why they beat the base rate. Unless you have data proving that story works, you must hold them to the base rate of the story's *category* (large research projects), not the story's *content*.

  ---

  ### Testing the Principle Against Your Eight Cases

  1.  **Health-tech app (9 months):** **Outside View.** (Gate 1: Regulatory review is a black box with no intermediate scoring for the founder; they only know "submitted" and "approved.")
  2.  **Fusion net energy (3 years):** **Outside View.** (Gate 1: Too distant, no intermediate scoring on "net energy".)
  3.  **Fusion shot rate (double):** **Inside View.** (Gate 1: Immediate, technical, scored in months.)
  4.  **Own features:** **Inside View.** (Gate 1: You are the estimator, you score yourself weekly on drafts. High feedback frequency.)
  5.  **Writer (5th book):** **Narrowed Outside View.** (Gate 2: "Books finished" is a counted dimension. n=4 is small, but it is *counted*.)
  6.  **Institute (10-year):** **Broad Outside View.** (Gate 2: "Well-funded" is a theoretical dimension, not a tabulated one.)
  7.  **Transit tunnel:** **Broad Outside View (Heavy Tail).** (Gate 1: Long timeline. Gate 2: "Tunnel cost" is a robust class with tabulated overruns.)
  8.  **AI researcher:** **Broad Outside View.** (Gate 1: Scaling timelines are distant. Gate 2: "Interviewed researchers" is a biased class; revert to "Public Tech Forecasts" generally.)

  ---

  ### Two New Cases for Verification

  **Case A: The Climate Model.**
  A climatologist tells you a specific regional temperature threshold will be breached in 2040 based on a new fluid dynamics simulation.
  *   **Verdict:** **Outside View.**
  *   **Reasoning:** Gate 1 fails. The scoring horizon is 16 years. The simulation cannot be "run at half power" to check accuracy in 6 months. You must use the base rate of regional climate prediction accuracy, not the specifics of the fluid dynamics argument.

  **Case B: The Restaurant Opening.**
  A chef who has successfully opened three restaurants says his fourth will open in six weeks. He says the kitchen equipment is installed and the health inspection is scheduled for Tuesday.
  *   **Verdict:** **Inside View (Narrowed).**
  *   **Reasoning:** Gate 1 passes. The health inspection is an immediate, binary score (Pass/Fail) within days. Gate 2 passes. He has a counted record (3 openings). You trust the timeline, provided the health inspection passes.

  ---

  ### Honest Account: Where This Principle Forces You to Overturn

  You stated you were "comfortable" with all eight verdicts. This principle forces you to adjust confidence in two of them.

  **1. The Writer (n=4)**
  *   **Your Verdict:** Accept the timeline, comfortable.
  *   **Principle's Verdict:** **Accept with High Variance.**
  *   **Why:** Gate 2 allows narrowing because the dimension is "counted," but statistical rigor demands acknowledging that n=4 is insufficient to establish a stable personal base rate against the "sophomore slump" or "burnout" base rates of authors. The principle permits the narrowing, but forbids the *confidence* you imply. You must treat her personal rate as a weak signal, heavily discounted toward the average author's 5th-book timeline. You cannot be as "comfortable" as you are with your own features (where n=40).

  **2. The AI Researcher**
  *   **Your Verdict:** Decline base rate, unsure which class to use (Paralysis).
  *   **Principle's Verdict:** **Use the Broadest Stable Class.**
  *   **Why:** The principle forbids paralysis. If "interviewed researchers" is selected for confidence, you must revert to the next broadest *tabulated* class: "Publicly stated technology milestones." There is a base rate for *all* public tech forecasts (which is abysmal). You are not allowed to say "I don't know which class"; the rule forces you to use the "General Tech Hype" base rate, even if it feels unfair to the researcher. Paralysis is a hidden inside view (a belief that this case is too unique for statistics).

  ---

  ### The Modesty Limit: When Does the Outside View Stop?

  You asked: *If I apply the outside view to my own "this-time-is-different" judgments, I slide into global modesty... yet I let a mechanic's observation override the model.*

  The stopping point is **Intersubjective Verifiability of State.**

  The Outside View applies to **Predictions**. The Inside View applies to **Observations**.
  *   **Mechanic's Clutch:** This is an observation of current state ("The friction material is <1mm"). It is intersubjectively verifiable (another mechanic would agree). The causal chain from "worn clutch" to "slippage" is physical and immediate.
  *   **Founder's "Dedicated Money":** This is a prediction of future behavior ("Money will prevent delay"). It is not verifiable state. It is a narrative about how the world *will* respond to the money.

  **The Limit:** You may trust the Inside View when the evidence is a **present-tense physical state** that is **verifiable by a peer** and has a **short causal chain** to the outcome.
  *   *Clutch:* Present state, verifiable, short chain. (Inside View wins).
  *   *Fusion Power Supply:* Present state (installed), verifiable (run at half power), short chain (to shot rate). (Inside View wins).
  *   *Regulatory Approval:* Future state, not verifiable (black box), long chain. (Outside View wins).

  This prevents global modesty. You don't need a base rate to trust your eyes on a worn clutch. You *do* need a base rate to trust your eyes on a "promising market."

  ---

  ### The Verdict: The Second-Time Founder

  **Case:** Friend, second startup. First one exited. Second-time founder statistics exist (generally positive) but are selected on outcome (survivorship bias). Her record is n=1.

  **Application:**
  1.  **Gate 1 (Weight):** Timeline prediction. Distant scoring (exit takes years). **Outside View Required.**
  2.  **Gate 2 (Narrowing):**
      *   *Can we narrow to "Her"?* No. n=1 is not a counted dimension sufficient for statistical narrowing (see Writer case variance).
      *   *Can we narrow to "Second-Time Founders"?* Yes, *but* with a correction. The dimension is tabulated (VCs track this), but you identified the selection bias.
  3.  **Synthesis:** You must use the "Second-Time Founder" base rate, but you must discount it downward to account for the fact that she is *talking to you*. (Silent second-time failures are not in the stats).

  **Final Verdict:**
  Do not accept her timeline. Do not use the general "first-time founder" base rate (too pessimistic given the exit). Use the **Second-Time Founder base rate, discounted by one standard deviation for interview selection bias.**

  *   **Why:** You are respecting the "Counted Dimension" (founder history) without falling for the "Inside View" trap (her specific story about why *this* one is faster). You are acknowledging the data exists (unlike the Institute funding) but acknowledging the data is noisy (unlike the Writer's book count).

  ### Summary for Your Piece

  The hypocrisy you feel is not a failure of logic, but a failure of articulation. You are not ignoring the outside view; you are intuitively applying a **Proximate-Score Constraint**. You trust details when they are about to be tested (Fusion shot rate, Clutch, Your drafts). You trust statistics when the details are untestable narratives (Fusion energy, Institute funding, Tunnel cost).

  The rule to write down is this: **"Trust the story only when the next chapter is due next week. Trust the statistics when the book isn't due for a decade. And never narrow the statistics based on reasons the author gives for their own success."**
