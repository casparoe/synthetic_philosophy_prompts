answer: |-
  Consider a regional power grid control room where stability depends on millisecond adjustments to voltage based on real-time frequency readings. The system is Newtonian and fully deterministic; an external observer with full data on wire states and load laws could in principle compute every future state indefinitely. However, every internal sensor query requires a finite energy draw that slightly alters the voltage it measures, creating a feedback loop where the act of monitoring destabilizes the very equilibrium being tracked. While the external observer accounts for this sensor drain as a known variable in their equations, the internal operators cannot measure their own measurement's impact without initiating a second measurement that introduces further drift, rendering the future state computationally inaccessible to them despite the underlying physics remaining strictly causal.

  Determinism remains intact because the measurement perturbation is not random noise but a lawful, causal consequence of the measurement act itself; the future is fixed, merely unreachable from within. Chaos theory actually hurts the anti-determinist's case here, as it explains how deterministic systems can amplify small differences (like sensor drain) into unpredictability without invoking indeterminism. The feature doing the philosophical work is the embedded measurement constraint—the physical cost of information extraction for a subsystem analyzing itself. If you drop this constraint, assuming cost-free measurement, the internal and external perspectives converge, and predictability is restored for the insiders. There is a hidden tension between the outside-calculability and inside-opacity conditions: if the system is truly closed and deterministic, the internal observer's brain states are theoretically calculable by the outside observer, implying the information exists within the system. The opacity arises not from a lack of information in the universe, but from the impossibility of a subsystem isolating its own causal influence without stepping outside the causal chain it seeks to model.
