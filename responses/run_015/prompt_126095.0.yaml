      *   *Selection:* The "Norm Entrepreneur as Manipulator" question. It hits the EA moral anxiety and the Rationalist epistemic anxiety.
      *   *Wait, looking closer at the prompt:* "The question I'm hoping nobody asks." Usually, this is the one that exposes a fatal flaw.
