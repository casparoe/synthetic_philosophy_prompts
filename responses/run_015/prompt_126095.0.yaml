      *   **Thesis:** Large-scale moral revolutions are driven by changes in honor/prestige (what it's honorable to be seen doing), *not* by moral argument or material interest.
      *   **Corollary (Hostile Point):** Argument aimed at changing moral belief is inert; the lever is the prestige economy of the reference group.
      *   **Constraints:** No citations/reading suggestions. Focus on object-level arguments. Concede nothing unnecessary, but advise on pre-emptive concessions. Identify the *one* reply that must land. Identify the *feared question* and a first sentence.
