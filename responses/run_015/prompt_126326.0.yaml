      *   **Cantor's Diagonal Argument:** Demonstrates that $|\mathbb{R}| > |\mathbb{N}|$ (specifically $2^{\aleph_0} > \aleph_0$). It proves that *no* bijection exists between $\mathbb{N}$ and $\mathbb{R}$.
      *   **The Tension:** The user thinks the "shifting" mechanism (bijection construction) used in Hilbert's Hotel should work for reals too.
      *   **The Error:** The shifting trick works because the set of guests (naturals) and the set of rooms (naturals) have the *same* cardinality. Cantor proves reals have a *strictly larger* cardinality. You can't shift guests into rooms if there are fundamentally more guests than rooms, regardless of how you shift. The "elasticity" is limited to operations that preserve cardinality (countable unions/products), not power sets.
