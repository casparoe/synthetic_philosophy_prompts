answer: |-
  # Joint Methodological Framework for the Science of Consciousness
  **Drafted following Adversarial Collaboration Workshop [Date]**
  **Signatories: Heterophenomenological Working Group (HP) & First-Person Methodology Group (FP)**

  ## 1. Convergent Claims
  We agree on the following foundational constraints for any scientific methodology purporting to study consciousness. These claims constitute the shared empirical ground upon which our disagreements rest.

  1.  **No Self-Certification:** No subjective report is immune to error. A subject's conviction that they are in a particular state does not guarantee they are in that state, nor does it guarantee the report accurately captures the state.
  2.  **Unreliability of Naive Introspection:** Untrained subjects are susceptible to specifiable confabulations, including the illusion of perceptual richness (the "richness gap"), post-hoc rationalization of decisions, and susceptibility to demand characteristics introduced by questioning.
  3.  **Public Verifiability:** Scientific data must be public, repeatable, and checkable by third parties. Private ostension is insufficient for scientific validation.
  4.  **Defeasibility of Authority:** A subject's authority regarding their own case is defeasible. Neural, behavioral, or physiological evidence may override a subject's report in the construction of a scientific model (e.g., blindsight, anesthesia awareness).
  5.  **Reactivity of Measurement:** The act of questioning or attending to experience alters the experience. Any methodology must account for the perturbation introduced by the method itself.
  6.  **Necessity of Interpretation:** Raw signals (neural or verbal) require interpretation to become data. There is no theory-neutral observation language, whether third-person or first-person.

  ## 2. Divergent Commitments and Empirical Tests
  While we share the constraints above, we diverge on the metaphysical and methodological implications of how reports are treated. The following table details our six primary cruxes. For each, we specify our position in our own terminology, identify the agreed test case bearing on the issue, and state our advance predictions.

  | Crux | Heterophenomenological Position (HP) | First-Person Methodological Position (FP) | Agreed Test Case | HP Prediction | FP Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(i) Neutrality of Suspension**<br>Is the suspension of judgment regarding the *reality* of experience genuinely neutral, or does it smuggle in eliminativism? | Suspension is methodological, not ontological. We treat the subject's world as a *theorist's posit* derived from texts. This allows us to model the world of a subject without committing to the existence of non-physical qualia. It is neutral because it works equally well for realists and eliminativists. | Suspension is a disguised ontology. By treating the "heterophenomenological world" as a construct of the interpreter rather than the subject, you have already decided that experience is not a *given* but a *hypothesis*. This forecloses the phenomenon before investigation begins. | **Simulator Protocol (Anaesthesia Condition)**<br>A decoder generates coherent experiential reports from a subject under general anaesthesia (no conscious experience expected). | The generated text constitutes a valid entry in the heterophenomenological record. It demonstrates that a "world" can be modeled without an experiencer, proving the method's neutrality: the world is in the interpretation, not the head. | The generated text is noise, not data. It demonstrates that text without a living subject is empty. If the method counts this as a "world," it has severed the link to consciousness entirely, confirming our suspicion of crypto-eliminativism. |
  | **(ii) Nature of Reports**<br>Are reports data *about* experience, or data about dispositions to speak? | Reports are data about a subject's *dispositions to assent* to certain propositions under specific conditions. They reveal what the subject *believes* they experience, which is the only scientifically tractable proxy for experience itself. | Reports (when disciplined) are data *of* the experience itself. They are not beliefs about experience, but descriptions of the phenomenal field as it presents itself. To treat them merely as speech dispositions is to ignore the intentional object of the report. | **Single-Bit Reporter**<br>A locked-in patient with a reliable yes/no channel tracking stimuli, unable to volunteer description. | The yes/no responses are minimal reports. We attribute a heterophenomenological world to the patient based on the functional role of these bits. The bits commit them to a world of distinctions. | The yes/no responses are behavioral data, not phenomenological data. Without the ability to describe the *quality* of the distinction, we cannot know if the "experience" is the same kind of thing as ours. The method hits a hard limit here. |
  | **(iii) Training Effects**<br>Does disciplined training improve the evidential base or manufacture artefacts? | Training is an empirical bet. It may reduce noise, but it risks inducing demand characteristics or imposing a theoretical schema on the subject. We must verify if training aligns reports with neural markers or simply aligns them with the trainer's expectations. | Training is a prerequisite for access. Naive reflection is contaminated by the "natural attitude." Refusing to train subjects is not neutrality; it is a commitment to studying contaminated data. Training suspends prejudice to reveal the phenomenon. | **Trained-Describer Asymmetry**<br>Trained subjects separate duration stimuli (neural-validated) but conflate spatial stimuli (neural-validated), unlike naive subjects. | The spatial collapse indicates training imposes a verbal/theoretical schema that mismatches spatial phenomenology. Training manufactures artefacts where the stimulus domain resists verbalization. | The spatial collapse indicates the limits of *verbalization*, not training. Duration is temporal (amenable to description); spatial layout is pre-reflective. Training successfully isolated the describable from the indescribable. |
  | **(iv) Non-Reporting Subjects**<br>What does the method say about infants, animals, or locked-in patients? | We extend the "intentional stance." We attribute beliefs and experiences based on behavioral and neural patterns, constructing a heterophenomenological world by analogy. The method scales by inference, not just by text. | The method requires a phenomenological reduction performed *by the subject*. We cannot perform it for them. For non-reporting subjects, we can infer *consciousness* but not access *phenomenology*. We must admit a methodological gap, not fill it with inference. | **Single-Bit Reporter**<br>(See Crux ii). | The patient has a heterophenomenological world isomorphic to the logical structure of their yes/no commitments. It is the same *kind* of thing as ours, just lower resolution. | We cannot determine if it is the same *kind* of thing. The "world" is not just logical commitments; it is a field of presence. Without description, the quality of that presence remains unknown. |
  | **(v) Absent Qualia**<br>Could there be an empirically discoverable difference in experience with no difference in the record? | No. If the heterophenomenological record (reports + neural/behavioral context) is identical, there is no scientific difference. "Absent qualia" with intact reports is a metaphysical distraction, not a scientific hypothesis. | Yes. If the record is identical but the lived experience differs (e.g., due to subtle neural decoupling), the method has failed to capture the phenomenon. The risk of "philosophical zombies" is a real empirical risk of relying on texts. | **Simulator Protocol (Consistency Condition)**<br>Decoder generates reports more consistent and neurally predictive than the subject's own utterances. | If the decoder's text is more consistent, it is a *better* model of the subject's heterophenomenological world than the subject's own utterance. The "experience" is the best interpretation of the data, wherever it comes from. | If the decoder's text is more consistent, it is a *simulation* of the subject. It lacks the first-person givenness. Consistency is not a proxy for phenomenality. |
  | **(vi) Bootstrapping**<br>Does the experimenter's own experience enter through the back door? | The experimenter uses their own linguistic and cognitive competence to interpret texts. This is hermeneutic theory, not first-person data. We do not need to assume our experience is like theirs to interpret their grammar. | The experimenter necessarily uses their own experience as a bridge to understand the subject's terms (e.g., "red," "pain"). Denying this is dishonest. It is intersubjective resonance, not just theory. | **Trained-Describer Asymmetry**<br>(Inter-describer agreement collapses on spatial layout). | The collapse shows that when shared linguistic theory fails (spatial terms), the interpreter's own experience cannot bridge the gap. This confirms interpretation is theory-laden, not experience-laden. | The collapse shows that when the *phenomenal domain* diverges from shared language, the intersubjective link breaks. It confirms that access relies on shared phenomenal structures, not just grammar. |

  ## 3. Assessment of Verbal vs. Substantive Disputes

  We conclude that a portion of our disagreement is verbal, specifically regarding the definition of "data." When HP speaks of "data," they refer to public tokens available for third-party modeling; when FP speaks of "data," they refer to the *manifestation* of the phenomenon itself. However, this verbal divergence masks substantive empirical bets that can be settled. The **Trained-Describer Asymmetry** offers the most decisive move: if training systematically *reduces* accuracy on spatial tasks (as predicted), FP must concede that training is not a universal enhancer of access but a domain-specific tool that can distort. Conversely, the **Simulator Protocol (Anaesthesia)** offers a decisive test for HP: if coherent reports are generated from an anaesthetized brain and HP claims these constitute a "heterophenomenological world," they must accept that their method allows for worlds without subjects. If FP can demonstrate that the Simulator's reports fail to predict novel neural markers that the subject's own reports would have caught, the claim that "text is all that matters" is empirically weakened. We agree that these results would not end the debate, but they would force a revision of the respective methodologies rather than providing merely new material to interpret.
