prompt: |-
  I'm a philosophy professor, and I'm writting up my own take on Newton's bucket for a grad seminar I'm teaching. I feel like I might be smuggeling in a contradiction, but I can't spot it, so I want a consistency check before I present. Here's roughly where I've landed:

  (1) I'm a spacetime substantivalist: spacetime is a real, concrete entity that exists independently of whatever material bodies happen to be around.
  (2) I think all velocity is relative; there's no fact about absolute rest or absolute uniform motion, and I'm happy to drop Newtonian absolute space as a standard for velocity.
  (3) I think Newton's bucket shows that rotation is absolute: the concave surface of the water reveals true circular motion even when the bucket and the water aren't rotating relative to each other.
  (4) At the same time, I want to say this absolute rotation is really rotation relative to the cosmic microwave background rest frame, not relative to some intangible absolute space.
  (5) I also hold that a relationist can accept (4) without giving up relationism, because the CMB is just another physical thing to be relative to, so the bucket doesn't actually force substantivalism on anyone.

  Does this hang together? Go through the pairs and tell me which ones genuinely clash versus only look like they do, rank the real clashes by how severe they are, and for each say what I'd have to give up or change to fix it. If one revision cleans up the most, say which one that is.
