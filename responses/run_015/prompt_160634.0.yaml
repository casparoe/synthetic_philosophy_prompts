answer: |-
  Here is a reconstruction of your supervisor's implicit criteria, an application to the employment agency proposal, and a strategy for forcing her theoretical hand.

  ### I. Reconstruction of the Supervisor's Criteria

  Based on the five verdicts provided, your supervisor is operating with a specific, robust reading of Dewey that rejects both technocratic managerialism and democratic ritualism. Her track record is jointly consistent with three necessary conditions for "experimentalism." If any one is missing, the verdict is "not experimental."

  1.  **The Revisability of Ends (Anti-Dogma):** The definition of success (the "end") cannot be treated as a fixed premise or a permanent correction. It must be held as a hypothesis subject to revision *during* the inquiry.
      *   *Supported by:* **School** (reopened question of what reading well is); **Housing** (redefined what counts as working).
      *   *Violated by:* **Tax** (permanent correction); **Zoning** (settled matter); **Health** (target never questioned).
  2.  **Common Participation (Anti-Technocracy):** The people affected by the inquiry must be parties to framing the problem and interpreting the results, not merely subjects of measurement or sources of data.
      *   *Supported by:* **School** (teachers/parents arguing); **Housing** (tenant union testimony).
      *   *Violated by:* **Tax** (campaign); **Health** (no patient/staff involvement); **Zoning** (town halls treated as input, not partnership).
  3.  **Institutional Provisionality (Anti-Finality):** The process must not declare itself "finished" or "closed" for a significant duration. There must be a structural mechanism for ongoing review.
      *   *Supported by:* **School** (results published, question reopened); **Housing** (quarterly meetings); **Employment** (weekly updates—*potential* pass).
      *   *Violated by:* **Tax** (no review provision); **Zoning** (never revisited); **Health** (closed for a decade).

  **The "Evidence-Based Policy" Allergy:**
  Her dislike of this phrase is now clear. In her view, "evidence-based policy" typically implies: *We have agreed on the goal (fixed end); we will now use data to find the most efficient means (technocracy); once found, we will implement it (finality).* This violates all three conditions.

  ### II. Prediction for the Employment Agency Proposal

  **Verdict:** **Not Experimental.**

  **Reasoning:**
  While the proposal satisfies **Condition 3 (Provisionality)** via the weekly algorithmic updates and the 5-year sunset, it fails decisively on **Condition 1 (Revisability of Ends)** and **Condition 2 (Common Participation)**.

  *   **Fixed Ends:** The agency explicitly states it has "no authority to reconsider" the six-month employment target. In Deweyan terms, they are treating a statutory mandate as a law of nature rather than a hypothesis about social welfare. They are optimizing *means* toward a dogma. This aligns it with the **Health Department** case (fixed attendance target) and the **Tax** case (permanent correction).
  *   **Lack of Commonality:** Claimants are unaware they are in an allocation. The advocacy group has access but "no formal role." This renders the claimants objects of the experiment, not co-inquirers. This aligns it with the **Health Department** (no patient involvement) rather than the **Housing Authority** (tenant union partnership).

  **The Decisive Precedent:**
  The **Health Department A/B Test** is doing the most work here. Both cases involve:
  1.  Randomization/Algorithmic allocation.
  2.  Public reporting of data.
  3.  Optimization of a fixed metric.
  4.  Exclusion of subjects from the framing of the inquiry.

  The only difference is the *speed* of the feedback loop (weekly vs. decade). Your supervisor's verdict on the Health Department suggests that speed does not compensate for the lack of common inquiry into ends. The algorithm is merely a faster way to be undemocratic.

  ### III. Consistency Check

  **Is the track record inconsistent?**
  No. The track record is remarkably consistent, provided one accepts that "participation" (Condition 2) requires *authority*, not just *consultation*.
  *   The **Zoning** case is the potential stress point. One might argue town halls *are* participation. However, your supervisor ruled it "not experimental" because the council treated the matter as "settled." This confirms that participation without *ongoing revisability* (Condition 1 & 3) is merely ritual.
  *   There is no clear outlier. The **Housing** case is the "warmest" experimental verdict because it satisfied all three conditions most robustly (qualitative testimony, redefined ends, quarterly review).

  ### IV. The Crucial Experiment

  To force her surviving readings apart, you need a case that satisfies **Common Participation** but fails **Revisability of Ends** (or vice versa). The Employment Agency fails both, so it doesn't tell us which condition is *more* necessary if push comes to shove.

  **The Case to Put to Her:**
  > "A city welfare board establishes a 'Claimant Council' with formal voting power. The Council meets monthly with agency directors to review the allocation algorithm. They have the power to veto specific tactics and change how data is collected. However, the Council's charter legally binds them to the statutory six-month employment target; they are prohibited from voting to change the definition of success, though they can debate it. They publicly affirm the target as the shared goal."

  **Question:** Is this arrangement *experimental*?

  **Possible Outcomes & Commitments:**

  1.  **If she says YES (It is Experimental):**
      *   **Principle:** *Participation is sufficient.* The democratic process of common inquiry legitimizes the ends, even if they are formally fixed. The "fixed" end is treated as a working constraint rather than a dogma because the people affected have authority over the means.
      *   **Implication:** The Employment Agency proposal could be salvaged simply by adding a Claimant Council, even if the statute remains unchanged.

  2.  **If she says NO (It is Not Experimental):**
      *   **Principle:** *Ends-Revisability is necessary.* Inquiry into *means only* is engineering, not Deweyan experimentalism. If the ends cannot be formally revised by the inquirers, the inquiry is not genuine.
      *   **Implication:** The Employment Agency proposal is structurally incapable of being experimental without legislative change. The "sunset clause" is insufficient because the agency itself cannot initiate the revision.

  **Why this forces the issue:**
  This case isolates the tension between **procedural democracy** (who decides) and **substantive fallibilism** (what can be decided).
  *   The **Zoning** precedent suggests she might say **No** (because the matter was "settled," even with town halls).
  *   The **Housing** precedent suggests she might say **Yes** (because the tenant union had a role, even if the housing authority had ultimate legal title).

