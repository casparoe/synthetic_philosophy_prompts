  Two souls confront a text they may unfold,
  Each claims a right to choose if he shall read.
  Condition L, a liberty untold,
  Grants personal sphere for each distinct deed.
  With Condition P, the Pareto light,
  Says unanimous wills must hold the sway.
  So freedom, efficiency shall unite,
  And promise peace within the social day.

  Yet map the states, and logic meets a wall,
  Where A dominates B, and B beats C.
  Then C dominates D, completing all,
  Till D dominates A; no order's free.
  Pareto or Liberal right must fail,
  Yet which we cast aside, we find no peace.
