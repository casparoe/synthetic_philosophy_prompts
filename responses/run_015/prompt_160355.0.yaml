        "mechanism": string,            // the Loeb-ish or proof-length reason it happens, 1-2 sentences
        "severity": integer,            // 1 = cosmetic, 5 = scheme-dead
        "workaround": string,           // concrete fix, or "none known"
        "confidence": integer,          // 0-100, how sure you are given you can't look anything up
        "observable_signature": string  // what I'd actually see the toy agent do if this were biting
      }
    ],
    "cheapest_thing_i_can_check_first": string,  // one pen-and-paper calculation or toy experiment that settles the most
    "most_likely_error_in_my_framing": string    // where you think I've misunderstood the obstacle itself
  }

