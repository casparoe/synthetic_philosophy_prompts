  **Lena:** Feels like discovery because it *is* discovery. I'm finding the constraint that bounds the variation. You're saying the variation is all there is. I'm saying the fence around the variation is the thing.

  **Marcus:** The fence is built by us though. We decide where the boundary is. If enough people start writing 'a's like 'u's, the cluster moves. The fence moves. There's no hard wall.

  **Lena:** But there's a cliff edge somewhere. If I draw a circle, it's not an 'a'. No amount of cluster shifting makes a circle an 'a'. There's a discontinuity. The exit stroke. The little kick. That's the hard bit.

