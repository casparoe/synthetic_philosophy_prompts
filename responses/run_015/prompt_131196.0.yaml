      *   *Welfare View:* It's largely **Negative Utilitarian** focused on *suffering* rather than *life deprivation*. It treats welfare as the absence of pathology (lesions, lice, stress indicators) and the absence of pain at death.
      *   *Death:* It implicitly treats death as neutral *if* done painlessly. It does not account for the loss of future life (deprivation account). If death were a harm, culling healthy fish for disease control wouldn't be framed as a "welfare measure."
      *   *Headcount vs. Rates:* The standards are **Per-Capita/Average Welfare**. They care about the *probability* of a random animal suffering, not the *total sum* of suffering. This is why 10M shrimp = 100k shrimp if rates match. The marketing uses headcount for *impact scaling* (total suffering in the world), but the certification measures *process quality*.
      *   *Consciousness Proxies:* Using mammalian proxies (eye-roll, equilibrium) assumes **functional isomorphism**. It presupposes that if a fish behaves like an unconscious mammal, it *is* unconscious. It risks false negatives (fish paralyzed by cold/shock but still feeling).
      *   *Shrimp Exemption:* This is likely **Tractability/Economic Feasibility** masked as **Sentience Uncertainty**. It's hard to stun shrimp individually. It implies a threshold view ("they probably don't feel enough to matter") or simply a "too hard to regulate" stance. It ignores Expected Value (Probability of Sentience × Suffering).

