answer: |-
  You have built a remarkably robust ethical intuition here. You aren't just tracking "truth vs. falsehood"; you are tracking **power, function, and harm.**

  Your tentative principle ("Record = who/what, Memory = meaning, Memory loses protection when used as a receipt") is about 80% there. The missing 20% is the **direction of power** and the **source of the error.**

  Here is a framework that reconciles your nine cases, explains why Case 4 feels different from Case 1, and handles the hard questions about statues and descendants.

  ### The Framework: Three Modes of Truth

  You are intuitively categorizing these stories into three distinct modes, each with its own rules of evidence. Confusion arises when we apply the rules of one mode to a case belonging to another.

  **1. Constitutive Truth (Who We Are)**
  *   **Function:** Builds group identity, cohesion, and continuity.
  *   **Cases:** 1 (Alpine festival), 5 (Shrine), 8 (Founding legend).
  *   **Rule:** Memory dominates. Accuracy is secondary to social function.
  *   **Why:** In Case 1, the festival isn't a history lesson; it's a ritual of civic pride. Correcting the plaque satisfies the archive without breaking the ritual (the reenactment). In Case 5, "since the beginning of things" is a theological claim, not a chronological one; archaeology is asking a question the shrine isn't answering.
  *   **The Limit:** This holds only as long as the story doesn't inflict harm on others or shield local power from accountability.

  **2. Testimonial Truth (What It Felt Like)**
  *   **Function:** Bears witness to trauma, experience, and subjective reality.
  *   **Cases:** 6 (Colonial protest), 7 (Massacre survivor).
  *   **Rule:** Lived experience dominates the archive, *especially* when the archive is an instrument of the oppressor.
  *   **Why:** In Case 6, a colonial police archive is not a neutral record; it is a weapon. To demand the archive validate the protest is to ask the oppressor for permission to have been oppressed. In Case 7, the survivor's trauma is the primary truth. The unit name is a forensic detail her memory may have scrambled (trauma affects hippocampal recall), but the *event* is true.
  *   **The Limit:** Testimony establishes the *fact of harm*, but it requires corroboration for specific *forensic liability* (hence removing the unit name from the memorial in Case 7).

  **3. Forensic Truth (Who Is Liable)**
  *   **Function:** Assigns blame, debt, or legal/moral responsibility.
  *   **Cases:** 2 (Grandfather's label), 4 (Flood relief), 9 (Crime/Descendants).
  *   **Rule:** High evidentiary bar. Memory alone cannot sustain a claim of liability against a specific agent.
  *   **Why:** This is where your "receipt" theory kicks in. If a story is being used to say "You owe us" or "You are guilty," the standard of proof must be higher than community sentiment.

  ---

  ### Applying the Framework to Your Hard Cases

  Here is how this framework forces specific verdicts on the cases where you are flip-flopping.

  **Case 3: The Statues**
  *   **Analysis:** A statue is not just memory; it is **honor**. A holiday is celebratory (Constitutive); a textbook is educational (Forensic/Explanatory); a statue is veneration.
  *   **Verdict:** If the forensic record shows the leader took foreign money and murdered rivals, the *honor* is unearned. The statue must come down (or be moved to a museum context), even if the holiday stays. The holiday celebrates the *outcome* (Independence); the statue celebrates the *man*. You can keep the former without the latter.
  *   **Principle:** Constitutive myths can survive forensic debunking; honors cannot.

  **Case 4: The Flood (Why it feels different)**
  *   **Analysis:** You feel differently here because this is a **Counter-Accusatory Memory**. In Case 1, the memory builds the village up. In Case 4, the memory is used to blame the Central Government, but the forensic record shows the *Local Council* failed the town.
  *   **Verdict:** The memory must yield. Why? Because keeping the memory protects the *local* powerful (the Council) by scapegoating the *distant* powerful (the Gov).
  *   **Principle:** Memory loses protection when it functions as a shield for local elites against their own community. Correcting this memory empowers the community to hold their actual leaders accountable.

  **Case 8: Invented vs. Garbled**
  *   **Analysis:** You are protective of the garbled memory because it is **Organic**. It grew over time. The 1890 legend is **Synthetic**.
  *   **Verdict:** Your intuition is correct. The 1890 legend is "civic cosplay" because everyone *knows* it's fake. Transparency neutralizes the lie. The 400-year-old garbled memory is protected because it has become Constitutive Truth. Correcting it offers no forensic benefit but causes Constitutive harm.
  *   **Principle:** Known fictions are harmless; believed fictions are identity. Do not break identity without a forensic necessity.

  **Case 9: The Crime and the Descendants**
  *   **Analysis:** This is the crux. The descendants are demanding **Forensic Truth** standards (burden of proof) to erase **Testimonial Truth**.
  *   **Verdict:** The memorial should state: *"Oral tradition holds that a massacre occurred here. Official records from the period, maintained by the occupying authority, contain no mention of this event."*
  *   **Principle:** **Structural Silence.** When the perpetrators keep the records, the absence of a record is consistent with the crime. You cannot let the descendants weaponize the archive to commit epistemicide. Memory stands as evidence of the *claim*, even if it cannot prove the *fact* in a court of law.

  ---

  ### The "Purely Academic" Case
  *   **Situation:** Record and Memory disagree, no living stake, no harm.
  *   **Verdict:** Publish the tension. "Tradition says X, Evidence suggests Y."
  *   **Why:** In the absence of harm or stakes, complexity is a virtue. The academic duty is to show *how* the memory diverged from the record, as that divergence is itself historical data.

  ### Refining Your "Receipt" Theory

  Your intuition that "memory loses protection when used as a receipt" is correct, but it needs a power adjustment.

  *   **Receipts demanded by the powerless (Case 6):** Valid. (e.g., "The police shot us." The archive says "Riot." Trust the memory.)
  *   **Receipts demanded by the powerful (Case 4):** Invalid. (e.g., "The Gov abandoned us." The archive says "Council refused help." Trust the archive.)
  *   **Receipts demanded by descendants of perpetrators (Case 9):** Invalid. (e.g., "Prove it happened." The archive is empty because we hid it. Trust the memory.)

  **The Unified Principle:**
  > **Archives govern liability; Memory governs identity; Testimony governs trauma.**
  >
  > **Memory yields to Record only when:**
  > 1. The claim is one of specific liability/blame (Forensic); **AND**
  > 2. The Archive is not a product of the oppression being alleged; **AND**
  > 3. Correcting the memory prevents harm to a vulnerable group (e.g., stopping a local council from scapegoating the central gov).

  ### Advice for Your Heritage Committee

  Since you are arguing about a plaque, you are likely in **Case 1** or **Case 3** territory. Here is the practical move:

  **Don't choose between Memory and Record. Annotate the relationship.**

  A plaque that says *"Here the Militia fought bravely"* is a lie if they ran.
  A plaque that says *"The Militia ran away"* is a desecration of community identity.

  **The Solution:**
  > *"In local tradition, this bridge was defended by the village militia in 1478. Historical records indicate the defense was primarily held by mercenaries hired by [Neighbour], with the militia arriving later. This site commemorates the enduring local value of civic defense."*

  This satisfies the Archive (forensic truth), protects the Community (constitutive truth), and shifts the focus from *what happened* to *why we care*.

  **Summary of what you must give up:**
  You must give up the protection of Memory in **Case 4**. It feels different because it *is* different: it is a lie told by local power to local people to redirect anger. That is the one case where "correcting the record" is an act of liberation rather than erasure. In almost every other case you listed, your gut is right: protect the memory, nuance the plaque.
