answer: |-
  Here is a specification for a theory of sexed defaults suitable for a professional style guide, anchored to your cases and constraints.

  ### I. The Desiderata
  *Requirements a theory must meet to be codified. I have distinguished between **Genuine Desiderata** (necessary for the guide to function and hold water) and **Camp Prejudices** (aesthetic or ideological preferences that should not govern the rule).*

  1.  **[Genuine Desideratum] The Copyeditor Constraint:** The rule must be decidable by a copyeditor looking only at the text, without access to the author's intent, the audience's demographic, or external sociological data.
      *   *Anchors:* Fossil cases, Actionability.
      *   *Rationale:* If the rule requires investigating the author's mindset or measuring reader offense, it is unenforceable.
  2.  **[Genuine Desideratum] Power-Structure Invariance:** The theory must explain why the default is objectionable regardless of which group holds power, specifically passing the **Subordinate-Default Case**.
      *   *Anchors:* Subordinate-default case, Hofstadter's asymmetry.
      *   *Rationale:* If the theory only objects because "Men are currently dominant," it fails to explain why a generic "Servant" would be objectionable in a servant-led society. The objection must be about the *structure* of erasure, not just the *identity* of the eraser.
  3.  **[Genuine Desideratum] Normative Stability (Non-Hostage):** The objection cannot be wholly contingent on current empirical psychology findings.
      *   *Anchors:* Psychology hostage question.
      *   *Rationale:* If a study tomorrow showed "no measurable exclusion effect" for *mankind*, the style rule should not automatically collapse. The rule is a norm, not a hypothesis.
  4.  **[Camp Prejudice] The Aesthetic Objection:** "It sounds archaic/clunky."
      *   *Rationale:* This is subjective and generational. It cannot sustain a principled ban against a determined complainant.
  5.  **[Camp Prejudice] The Etymological Purity Move:** "The root meaning dictates current usage."
      *   *Rationale:* This is the *manhole* trap. Etymology explains history, not current harm or utility.
  6.  **[Genuine Desideratum] Asymmetry Explanation:** The theory must account for Hofstadter's raced/sexed asymmetry without validating the sexed default as acceptable.
      *   *Anchors:* Hofstadter 1985.
      *   *Rationale:* It must explain *why* the raced generic feels more revolting (salience of racial exclusion vs. normalization of gender exclusion) without conceding that normalization makes the gendered version permissible.

  ### II. Incompatible Pairs
  *You suspected trade-offs. Here is where the theory breaks.*

  1.  **The Copyeditor Constraint vs. Associative Sensitivity.**
      *   *Conflict:* You cannot have a bright-line rule (e.g., "Never use *man* for human") *and* demand sensitivity to each term's actual associative profile (e.g., "*Manhole* is fine, *Manpower* is not").
      *   *Resolution:* For a style guide, you must sacrifice Associative Sensitivity. A bright-line ban on the morpheme is the only way to satisfy the Copyeditor Constraint. Nuance belongs in the exceptions list, not the theory.
  2.  **Asymmetry Explanation vs. Normative Stability.**
      *   *Conflict:* If you explain Hofstadter's asymmetry by citing current social salience (race is more politically charged than gender right now), you make the rule hostage to the zeitgeist. If you claim the wrongness is intrinsic, you fail to explain the asymmetry.
      *   *Resolution:* The theory must posit that both are equally wrong *in principle*, but acknowledge that *uptake* varies by context. The rule remains stable; the complaint intensity varies.

  ### III. The Knockout Requirement
  **The Copyeditor Constraint.**

  This single requirement knocks out the most popular accounts (Pragmatic Implicature, Causal-Psychology, and Speaker-Intent models).
  *   **Why:** Most linguistic accounts of why generics are harmful rely on *context* (what was implied?), *uptake* (how did the listener feel?), or *intent* (did the speaker mean to exclude?). A copyeditor cannot adjudicate any of these. A theory that requires measuring "exclusionary impact" fails because impact is unmeasurable in a manuscript queue. Only a semantic or conventional rule (e.g., "This form is deprecated") survives this constraint.

  ### IV. Evaluation of Accounts
  *Brief assessments weighted against your criteria.*

  1.  **The Etymology Defence:** *Fails.* It violates the Fossil Case criterion. *Manhole* is not about men; *mankind* is. Ruling by etymology bans *manhole* (false positive) and allows *mankind* (false negative). It is a Camp Prejudice, not a theory.
  2.  **Generic-Really-Is-Generic Semantics:** *Fails.* It claims *man* literally means *human*. This is falsified by the Subordinate-Default Case (if *servant* meant *human*, it wouldn't mark the subordinate group) and Hofstadter (if *white* meant *human*, the satire wouldn't work). It ignores the marked/unmarked distinction.
  3.  **Typical-Member Implicature:** *Passes Theory, Fails Constraint.* It argues *man* implicates "men are the prototype humans." This explains Hofstadter and the Subordinate-Default case well. However, it relies on hearer inference, which violates the Copyeditor Constraint (you can't police implicature without context).
  4.  **Causal-Psychology Version:** *Fails.* It argues the term causes measurable exclusion. This is Hostage to Psychology. If the data nullifies, the rule collapses. It also fails the Copyeditor Constraint (editors aren't psychologists).
  5.  **Expressive-Harm Account:** *Passes.* It argues the term *expresses* a disregard for equality, regardless of causal impact or intent. This satisfies Normative Stability and the Subordinate-Default Case. It best fits the Copyeditor Constraint because it treats the usage as a conventional signal (like a slur or a typo) rather than a causal trigger.

  ### V. Confidence and Uncertainty

  **Confidence:** High on the structural constraints (Copyeditor, Stability). Moderate on the ethical framing (Expressive-Harm).

  **Least Sure Bit:** **The Subordinate-Default Case resolution.**
  I am least confident that a single theory can satisfactorily explain why a "Subordinate Generic" (e.g., if *peon* meant *human*) would be objectionable *for the same reason* as a "Dominant Generic" (*man* meaning *human*).
  *   *Dominant Generic:* Erases the subordinate by centering the dominant.
  *   *Subordinate Generic:* Erases the dominant? Or erases the subordinate by binding them to their status?
  If the theory is "Defaults should be neutral," both fail. If the theory is "Defaults shouldn't encode power," the Subordinate Generic might look like a victory (centering the marginalized), which complicates the ban. Resolving whether the objection is to *encoding status at all* vs. *encoding dominant status* is the deepest theoretical instability here. I recommend the style guide adopt the "Encoding Status at All" view for consistency, but acknowledge this is the weakest philosophical link.
