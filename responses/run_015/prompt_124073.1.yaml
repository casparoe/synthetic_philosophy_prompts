          *   The Reversal Problem (Symmetry of specific vs. generic).
          *   The Subordinate-Default Case (Generic = subordinate group term).
          *   Distinctions: Harm to hearers vs. mental imagery vs. speaker expression vs. falsity.
          *   Psychology Hostage: Is the objection falsifiable by null psychological effects?
          *   Fossil Cases: *Manhole*, *to man*, *no man's land* (Etymology vs. Decomposition vs. Association).
      *   **Meta-Requirements:**
          *   Mark genuine desiderata vs. camp prejudices.
