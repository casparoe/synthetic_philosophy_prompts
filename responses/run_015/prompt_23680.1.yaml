      *   *Refining the "Wrongness" point:* If it's verbal, saying one is "wrong" is like saying inches are wrong and centimeters are right. They are different standards. *Correction:* It's not exactly like units of measurement because one might be *misleading*. But strictly metaphysically, neither is false about the *world*.
