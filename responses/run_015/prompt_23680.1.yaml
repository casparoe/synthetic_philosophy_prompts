prompt: |-
  I just had a long, circular argument with a friend about presentism versus eternalism, and I'm still not sure whether we disagree about a fact of the world or merely about the word "exists." Please describe the most important implications of the diagnosis that this is a merely verbal dispute — the two theories being empirically equivalent and differing only in which objects they count as existing once "exists" is given a fixed interpretation, as in Quine's notion of ontological relativity — for whether either side can be said to be wrong, and for what, if anything, the disagreement is substantively about.
