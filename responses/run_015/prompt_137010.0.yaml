answer: |-
  Funding is essential to support a semester-long investigation into whether the contractualist prohibition on interpersonal aggregation collapses under scrutiny of how complaints are sliced across subjects, a foundational inquiry necessary to assess the coherence of Scanlonian morality and its handling of competing claims. T.M. Scanlon's contractualism proposes that an act is wrong if it would be forbidden by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement. This framework has gained prominence for its ability to respect the separateness of persons, offering a distinctive solution to the problem of aggregation. In standard formulations, contractualism denies that many small complaints can outweigh one serious complaint simply by virtue of their number; the intensity of the individual burden matters more than the sum of burdens across different people. However, this position relies on a sharp distinction between intra-personal and inter-personal aggregation. To determine whether a single person could reasonably reject a principle, one must aggregate the various burdens that principle imposes on them across different times and domains of life. If I cannot sum burdens across people, I must nevertheless sum burdens within a life to assess the strength of any individual's complaint.

  The central question of this research is whether this asymmetry is morally defensible when the structure of the complaints remains constant while the boundaries of the subjects change. Existing contractualist literature treats the boundaries of persons as fixed background conditions rather than variables subject to moral scrutiny. Scanlon and his defenders argue that the separateness of persons is a fundamental moral fact that blocks aggregation across lives but permits it within them. Yet, this leaves open the possibility that the prohibition on aggregation is an artifact of how we slice complaints rather than a substantive moral truth. If a single subject bears one hundred trivial burdens over a lifetime, contractualism permits summing those burdens to see if they constitute a serious complaint. If one hundred subjects each bear one trivial burden, contractualism forbids summing them to outweigh a single serious burden elsewhere. The moral difference between these cases is not in the qualitative nature of the suffering, but solely in the distribution of subjecthood. This project aims to test whether contractualism can maintain this distinction without appealing to circular definitions of what counts as a person or a complaint.

  The methodology will center on the construction of matched pairs of cases that are structurally identical except for how complaints are distributed across subjects. I will construct scenarios where one agent bears many small burdens and compare them to scenarios where many agents each bear one small burden, ensuring the total quantum of suffering is equivalent. I will then introduce variations where the subjects are not standard human beings but collective agents, such as firms or states, or long-lived subjects whose temporal parts resemble distinct persons. By testing candidate contractualist principles against these pairs, I can isolate whether the verdict changes based on subject boundaries alone. Crucially, I will include cases where the small burdens differ in strength from each other, preventing a simple tie-breaking story from masking the aggregation issue. This case-based approach is superior to abstract theoretical deduction because it tests the reflective equilibrium of the theory against specific intuitions about fairness and comparability. It forces the theory to explain why the boundary of a skin or a legal charter should matter morally when the underlying complaints are identical.

  The primary deliverable will be a 6,000 to 7,000 word paper suitable for submission to undergraduate philosophy journals or presentation at student research symposia. This paper will articulate the "slicing problem," present the matched cases, and evaluate the viability of contractualist responses. Additionally, I will produce a one-page summary written for non-specialists, explaining the stakes of the aggregation problem without technical jargon, to fulfill the grant's requirement for public engagement. I also plan to construct a table sorting kinds of aggregation by whether contractualism can allow them, categorizing them by temporal, spatial, and subjective dimensions. This table will serve as a heuristic for future researchers looking to pinpoint exactly where the contractualist machinery jams. These deliverables represent a significant contribution to the literature, as most existing work assumes the unit of aggregation rather than questioning it.

  There are honest scope risks and failure conditions inherent in this project. The primary risk is that the asymmetry between intra- and inter-personal aggregation is more defensible than it initially appears, perhaps due to sophisticated accounts of personal identity or the nature of reasonable rejection that I may not fully grasp within a semester. If I conclude that the asymmetry is robust, the project still succeeds by clarifying why, but there is a risk of superficially dismissing strong counterarguments due to inexperience with advanced meta-ethics. Furthermore, the complexity of Scanlon's later replies to aggregation objections, such as those found in *Does Contractualism Rest on a Mistake?*, could overwhelm the available time. Working eight hours a week alongside a normal course load requires strict discipline; failure would look like an unfinished draft or a paper that describes the problem without rigorously testing the solutions. To mitigate this, I will prioritize completing the case constructions early in the semester to allow maximum time for argumentative refinement. Even if the final paper does not resolve the debate definitively, successfully mapping the tension between subject boundaries and aggregation rules would constitute a valuable philosophical outcome, demonstrating whether contractualism rests on a solid foundation or merely on the unexamined contours of our personal identities.
