prompt: |-
  I'm a senior writing a short independent-study paper on embedded agency — the study of agents that are inside the world they act on, with no clean wall separating them from it — and I need a case engineered to a specification, because at the moment my second paragraph just asserts my conclusion.

  The case: one paragraph, realistic, set somewhere a teenager actually is (a team practice, a group project, a shift at work, a debate round). No science fiction, no artificial agents. One agent who has to act; one or two other people, none of them more perceptive than a good friend or coach — no mind-reading, no predictor better than a shrewd human, and nothing that lets the agent bind or randomize its own later action: no coin, no contract, no code agreed in advance. Two structural requirements. First, the agent cannot succeed alone: something about how it deliberates, or about what it has settled on, has to reach another person for its plan to work. Second, holding everything else fixed, the agent must do strictly better by knowing less about what it is going to do. I've been calling this leaky self-knowledge, but use whatever label you prefer.

  Then run three views on the case, and rather than announcing verdicts, show the reasoning for each. (T) The transparency view: a rational agent should model its own behavior as accurately as it can, and truer self-knowledge cannot leave it worse off. (C) The deliberation-blind view: hold your own action as a free variable, rank acts by their causal upshot, and treat what you believe about yourself as fixed. (E) The procedure-design view: your self-model is a physical thing in the world that other people respond to, so choose which procedure to run — including how much that procedure tells you about yourself — by comparing whole procedures. T and C must land on the same action; E must land on a different one and come out ahead.

  Finally: name the single feature of the case doing the work; say what the three verdicts become if I remove it (I expect the case to stop being about self-knowledge at all — tell me what it turns into); and give me the strongest reply available to someone who holds T, including whether E's winning move is really just self-deception under a better name. It is cheating if the agent wins because the other people are dense, or because the setup stipulates that it wins. I'm using the case to argue that for an embedded agent, self-knowledge is a design variable rather than a virtue. I'm working offline, so please don't send me to sources — argue it out.
