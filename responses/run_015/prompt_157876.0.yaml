answer: |-
  This is a sharp distinction, and it cuts against the grain of the standard transitional justice (TJ) literature, which often treats truth commissions as factories for producing a historical record. Your "archive-truth" versus "neighbour-truth" dichotomy captures something real about the tension between national history and local cohabitation. However, if you want me to poke holes in it, I will. The risk here is that you are romanticising the local and underestimating the coercive power of the state in shaping what counts as "neighbour-truth".

  Here is the stress test, structured according to your five points.

  ### 1. The Mechanism and the Archive-Truth Prediction

  Let us set out the *gacaca* mechanism as a principal-agent problem.

  *   **Principal:** The Rwandan State (specifically the RPF-led government).
  *   **Agent:** The Accused (detained genocidaires, mostly Hutu).
  *   **Currency:** Not amnesty, but *sentence reduction* and *community reintegration*.
  *   **Disclosure:** Confession of acts, naming of accomplices, location of remains.
  *   **Verification:** Community testimony. The "truth" is validated not by forensic evidence but by the collective memory of the hill (*umudugudu*).

  **What the Archive-Truth Reading Predicts:**
  If *gacaca* were driven by an archive-truth logic, the design would prioritise the accuracy and completeness of the historical record above all else.
  1.  **Incentives:** It would offer full amnesty for full disclosure (the South African TRC model) to maximise the flow of information. Why withhold the price if the goal is the stock of facts?
  2.  **Procedure:** It would be slow, meticulous, and legally rigorous to ensure the "archive" is defensible.
  3.  **Scope:** It would seek to account for *all* violence, including reprisal killings by the RPF, to ensure the archive is comprehensive.
  4.  **Outcome:** A centralised, searchable database of events, prioritising the needs of future historians over the immediate comfort of current neighbours.

  ### 2. Explaining vs. Misdescribing *Gacaca*

  Your neighbour-truth lens explains some features well, but it stumbles badly on others.

  *   **Leniency rather than Amnesty:** **Fits.** Archive-truth struggles to explain why Rwanda withheld full amnesty. If truth is a non-rival stock, you should buy as much as possible. Neighbour-truth explains this: you cannot fully absolve someone who must live next door to your victims. A "mark" (a reduced sentence, community service) signals that the debt is acknowledged, not erased.
  *   **Local Audience and Lay Judges:** **Fits.** This is the core of your argument. The truth is performative; it is for the people in the square, not the file in Kigali. The lay judges (*inyangamugayo*) derive legitimacy from local knowledge, not legal training.
  *   **Volume and Thin Procedure:** **Fits.** Archive-truth views the processing of nearly a million cases with suspicion (accuracy is sacrificed). Neighbour-truth accepts that a "good enough" truth told quickly is more valuable for cohabitation than a perfect truth delivered in a decade.
  *   **Exclusion of Organisers:** **Problematic.** Archive-truth sees this as a catastrophic gap in the record. Neighbour-truth might argue that masterminds are too distant to be "neighbours" in the relevant sense. However, this leads to the next point.
  *   **The Official Narrative (Tutsi Victim / Hutu Perpetrator):** **Misdescribes.** This is the biggest hole in your theory. Neighbour-truth implies a organic, local negotiation of what happened. But *gacaca* was heavily scripted from above. The state enforced a strict narrative: genocide was committed by Hutu extremists; the RPF committed no crimes. If neighbour-truth is "local", why was the script national and coercive? In many cases, speaking a truth that deviated from the state narrative (e.g., alleging RPF crimes) was dangerous. This suggests the "truth" being bought was not neighbour-truth, but *compliance*.

  ### 3. Excluding the Planners: Breaking or Enabling the Trade?

  You ask if excluding the planners breaks the trade. I argue it reveals that the trade was never about truth in the first place.

  In an **archive-truth** model, excluding the architects renders the archive useless. You have the bricks but no blueprint.
  In a **neighbour-truth** model, excluding them might be pragmatic (you cannot reintegrate a génocidaire leader into a village easily), but it creates a hierarchy of guilt that can fester.

  However, the stronger critique is political. The exclusion of RPF crimes and the reservation of "Category 1" (planners) for ordinary courts suggests the currency was not truth, but **regime consolidation**. The state bought the silence of the rank-and-file (via leniency) and the silence of the opposition (via exclusion of RPF crimes) to stabilise its monopoly on violence. If your theory cannot account for the fact that the "Principal" (the State) had a vested interest in *suppressing* certain truths, it is naive. The trade wasn't Truth for Leniency; it was *Legitimacy for Stability*.

  ### 4. Where the Theory is Silent

  Your framework has significant blind spots regarding the costs and the power dynamics.

  *   **Who Bears the Cost?** You note neighbour-truth is "expensive to produce". But who pays? Often, it is the witnesses. In *gacaca*, survivors testifying locally faced intimidation, and in some documented cases, violence or death. Your model assumes the community benefits from the truth, but it does not account for the community *punishing* the truth-teller. If the cost of neighbour-truth is physical safety, the "currency" calculation changes.
  *   **Pace vs. Quality:** You argue speed aids cohabitation. But *gacaca* was so fast that coercion became rampant. Accused persons often confessed to crimes they did not commit simply to secure a sentence reduction and get out of detention. Is a coerced confession "neighbour-truth"? It is a transaction, but it is not truth. Your theory needs a mechanism to distinguish between *socially useful narratives* and *factual falsehoods accepted for peace*.
  *   **State Violence:** As mentioned, *gacaca* had no mandate to hear crimes committed by the RPF. A theory of transitional justice that cannot handle victor's justice is incomplete. If the "neighbour" is an agent of the state, their version of truth is hegemonic, not relational.
  *   **Cohabitation Outcomes:** Does the theory predict improved cohabitation? The evidence is mixed. Some studies suggest *gacaca* reduced interpersonal hostility; others suggest it entrenched ethnic categories and forced a "silence of coexistence" rather than genuine reconciliation. Your theory assumes truth leads to cohabitation. It might be that *shared silence* leads to easier cohabitation than *neighbour-truth*.

  ### 5. The Reverse Test and Falsification

  **Does *Gacaca* confirm the Amnesty-for-Truth model?**
  No. It confirms that amnesty is rarely the goal. But it also challenges your **Archive/Neighbour** distinction.
  *   **Is it just relabelling?** There is a risk here. "Archive-truth" is essentially "universalist truth"; "Neighbour-truth" is "particularist truth". Philosophers have debated this for decades (Habermas vs. local knowledge, etc.). The novelty you claim might be in the *application* to TJ incentives, but the conceptual ground is well-trodden.
  *   **Does it show amnesty was never load-bearing?** Yes. *Gacaca* shows that *reintegration* is the load-bearing beam, not amnesty. People wanted to go home, not necessarily to be absolved.

  **Brutal Critique of the Distinction:**
  The danger of your "neighbour-truth" concept is that it risks legitimising mob justice or coerced consensus. If truth is "local" and "rival", what stops a majority community from imposing a false narrative on a minority neighbour? In *gacaca*, Hutu suspects were often pressured by Hutu neighbours to confess to protect the community's reputation, or Tutsi survivors were pressured to forgive to maintain peace. If "neighbour-truth" is defined by its utility to the audience, it ceases to be truth and becomes *social lubrication*.

  **What would falsify your theory?**
  1.  **Coerced Consensus:** If you find that "neighbour-truth" processes consistently produce *less* accurate records than archive processes without yielding better social outcomes (i.e., they get the worst of both worlds), the distinction fails. There is evidence this happened in *gacaca*: false confessions were common, and social tensions remained high.
  2.  **State Co-option:** If the "local" proceedings are actually top-down state projects (which *gacaca* largely were—customary law was statutoryised and controlled by the National Service of *Gacaca* Courts), then "neighbour-truth" is a misnomer. It is "State-Truth delivered locally".
  3.  **The Cost of Truth:** If the production of neighbour-truth consistently leads to reprisal violence against the speakers (which happened in Rwanda), then the theory's claim that this truth aids cohabitation is empirically false.

  ### Summary

  Your intuition is correct that the standard amnesty-for-truth model is too sterile for post-genocide contexts. However, your "neighbour-truth" alternative risks swinging the pendulum too far towards relativism. *Gacaca* was not a pure experiment in local truth; it was a state-managed tool for clearing detention centres and solidifying a specific political narrative.

  The hole in your theory is power. You treat the "neighbour" as a neutral audience. In Rwanda, the neighbour was often a witness, a victim, a perpetrator, or a state informant all at once. The currency wasn't just sentence discounts; it was survival. If you want to salvage the distinction, you must account for the fact that "neighbour-truth" can be just as coercive as "archive-truth", merely on a smaller, more intimate scale.
