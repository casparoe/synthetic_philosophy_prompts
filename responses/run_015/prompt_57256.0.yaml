  Your view is right in spirit but incomplete in its defense. Framing identity as "continuous work" leaves you vulnerable to the fourteen years she sat in the mud, as you noted. You should hold instead that identity lies in "unbroken custodianship." Even when she was static, she was never abandoned; she was held in trust, with intent and care directed toward this specific launch. This distinguishes you from the school—who inherited relics to build a memorial—without denying their skill or claiming their boat is false. It allows you to say yours is the *Marabel* because the line of care was never cut, only handed on. I have written the speech on this basis.

  ***

  Friends, neighbours, shipwrights, and guests.

  Thank you for coming. We are here to launch a boat, but I know many of you are also thinking about the other boat. The paper called it a rivalry. That word doesn't fit. You don't rivalry with people you share a drink with, and we share plenty with the crew up at the school. But we do share a name, and we need to speak about that.

  The carved nameboard from the original *Marabel* is in their possession. They launched last spring. They did fine work. They saved timber that we would have had to burn, and they put a boat back on the water that carries the history of this coast. We are glad of it. But today, we are launching the *Marabel* again.

  Wood rots. Iron rusts. Any man here knows that a wooden boat is not a stone monument. It is a living thing that requires replacing. If you keep a boat going for fifty years, you change the planks. If you keep her going for a hundred, you change the frames. We kept the keel and the stem. The school kept the planking and the frames. Both boats have new oak where the rot took hold. Neither of us has all the original timber, and neither of us has none of it. So the wood alone cannot tell us who she is.

  For fourteen years, this hull sat on the mud. There were days when nothing happened. There were years when the money ran out. But she was never abandoned. She was covered. She was watched. The tools were kept sharp. The intent was never changed. We were not building a new boat based on an old design. We were finishing a job that started in 1911.

  That brings me to Eddie Marsden. Eddie cut most of the new frames you see below deck. He worked here until he died in 2019. He never saw her float. He never asked to see his name on a plaque. He came to the yard because he believed this hull deserved to sail again.

  To Eddie's granddaughter, who is breaking the bottle today: Your grandfather told me once that timber doesn't matter if the heart isn't in it. He didn't cut those frames for a museum piece. He cut them for a working boat. He worked for this morning. He worked so that you could stand here and send her back to the water she knows. That is the truth he left us.

  The school has built a beautiful memorial out of the old bones. We have kept the life going. A boat is not just what she is made of; she is what she is for. She was made to carry supplies to the lights. She was made to work. When she sat in the mud, she was waiting. When we scraped the paint, we were listening. The line of care was never broken, even when the work slowed down.

  So, when people ask which one is the real *Marabel*, I will not tell them the other boat is a copy. I will not tell them they are wrong. I will tell them that there are two ways to honour a ship. One is to preserve her past. The other is to continue her life. We have chosen to continue the life.

  I want to say this before the bottle breaks, so it is on the record for every shipwright here to hear.

  She is the same boat because the promise made to her in 1911 was kept, year by year, until today. She is the same boat because the line of care was never cut. And she is the same boat because she returns to the work she was made to do.

  God bless her and all who sail in her.
