answer: |-
  In the Republic of Meridia, a new clinic offers "Affect Dampening Therapy" (ADT), a thirty-minute outpatient procedure using transient receptor potential modulators to temporarily suppress the neural correlates of moral outrage for up to eight hours. Adult clients, fully informed and consenting, use ADT to write provocative satire, negotiate hostile corporate mergers, or perform antagonistic roles in theater without experiencing internal distress or violating their own conscience, knowing the effect wears off completely by the next morning with no cognitive residue. The sessions occur in private rooms, leave no physical trace, and clients remain fully capable of understanding laws and respecting rights during the window, merely lacking the visceral feeling of indignation when witnessing or contemplating acts others find reprehensible. Non-participants never interact with clients during the dampened state, suffer no economic loss, and report no identifiable psychological distress, yet sociological data suggests a gradual erosion of the collective intensity with which the public reacts to ethical violations, correlating with ADT usage. The legislature is debating whether to criminalize the provision of ADT solely because the practice is believed to degrade the shared moral sensibilities required for social cohesion, despite the absence of tangible injury to outsiders.

  A Hart-style harm-principle position verdicts against criminalization, reasoning that the state lacks the authority to coerce individuals for their own good or to enforce moral codes when no direct harm is inflicted upon non-consenting others. Since the practice is voluntary, private, and leaves no lasting physical or economic damage to the public, the mere fact that it alters internal emotional states or offends abstract moral sensibilities does not constitute a "harm" sufficient to justify the violence of the criminal law.

  A Devlin-style legal moralist position verdicts in favor of criminalization, reasoning that society is entitled to protect its existence against practices that erode the shared moral bonds holding the community together. Even without tangible injury to specific individuals, the documented decline in collective moral outrage indicates a weakening of the ethical fabric necessary for self-governance, and the law may justifiably suppress private vices that threaten the integrity of the social structure.

  The precise structural feature forcing these verdicts apart is the decoupling of tangible individual setback from intangible collective moral erosion; specifically, the presence of evidence that shared moral sensibilities are weakening despite the absence of identifiable harm to specific persons. This feature creates a gap where Hart sees only liberty because no individual interest is set back, while Devlin sees a threat because the community's moral identity is being degraded.

  If that feature is removed by stipulating that sociological data shows no erosion of shared moral sensibilities whatsoever, the case collapses back into agreement in the direction of liberty. Without the claim that the social fabric is actually being undermined, the legal moralist loses the only justification for interference available to their theory, leaving both positions agreeing that the state has no grounds to prohibit a harmless, voluntary act.

  A defender of the Devlin-style position, which comes out worse if the premise of harmlessness is accepted as definitive, would attack the case by denying the harmlessness premise itself. They would argue that the scenario falsely dichotomizes "harm to persons" and "harm to society," contending that the disintegration of shared moral sentiment is not merely a symbolic loss but a tangible injury to the society's capacity to survive, thereby reclassifying the erosion of outrage as a direct harm to the collective interest that warrants legal protection.
