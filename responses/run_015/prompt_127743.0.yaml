answer: |-
  This is a classic debate in the philosophy of biology, touching on biosemiotics, the nature of information, and the problem of teleology. Both Jordan and Riley are articulating well-established positions: Jordan is arguing for a **biosemiotic/realist** view (the code is ontologically real), while Riley is arguing for a **causal/deflationary** view (the code is a useful metaphor for causal processes).

  Here is a move-by-move referee analysis of their exchange, followed by a verdict on the specific philosophical questions you raised.

  ---

  ### Move 1: Jordan's Claim (Arbitrariness Grounds Semantics)
  **The Argument:** Jordan argues that because the mapping between codons (e.g., UUU) and amino acids (e.g., Phenylalanine) is not determined by chemical necessity (it is arbitrary), but is nonetheless functionally specific, it constitutes literal semantic content.
  **Analysis:**
  *   **Where Jordan is Right:** Jordan is chemically correct. This is the "Frozen Accident" theory (Crick, 1968). There is no chemical bond forcing UUU to pair with Phenylalanine; it could have been otherwise. This distinguishes genetic information from simple chemical causation (like a key fitting a lock, which is determined by shape).
  *   **Where Jordan Overreaches:** Jordan assumes that **arbitrariness + function = semantics**. However, a traffic light is arbitrary (red could mean "go" if we agreed), but a falling rock is contingent (it could have stayed up) without being semantic. Arbitrariness is a *necessary* condition for a code, but not a *sufficient* one. To get "semantics," you usually need a system where the arbitrary sign is *used* to represent something to someone. Jordan identifies the structural feature of a code but hasn't proven the existence of the semantic relation.

  ### Move 2: Riley's Reply (Convention vs. Contingency)
  **The Argument:** Riley counters that linguistic arbitrariness requires **conventional agreement among agents**. DNA's mapping is merely evolutionarily contingent and biochemically locked. Ribosomes are chemical catalysts, not interpreters. Calling it "semantics" risks reintroducing natural teleology (purpose) that Darwinism removed.
  **Analysis:**
  *   **Where Riley is Right:** This is the strongest philosophical move in the exchange. In philosophy of language (following Grice or Lewis), "convention" implies a community of agents who agree to use a sign in a certain way. Evolution is not an agent; it is a blind process. Natural selection filters variants; it does not "agree" on a mapping. Furthermore, Riley correctly identifies the risk of **teleology**. If DNA "means" something, it implies it is "for" something in a normative sense (it can be wrong/misrepresented). In strict physicalism, the ribosome cannot be "wrong," it can only malfunction chemically.
  *   **Where Riley is Vulnerable:** Riley risks being too restrictive. If we deny all semantic language in biology, we lose the ability to distinguish between genetic information and mere causal correlation (e.g., tree rings indicate age, but aren't a "code"). Biology relies heavily on "teleonomic" language (function *as if* designed) to be intelligible.

  ### Move 3: Jordan's Counter (The Computer Analogy)
  **The Argument:** Jordan argues that objective semantics don't need a conscious interpreter present at the moment of execution. Computer code works without a programmer watching. Therefore, DNA can be a literal code without a cellular "reader."
  **Analysis:**
  *   **Where Jordan is Right:** Jordan correctly notes that **runtime does not require a reader.** A server can execute code in an empty room. This suggests that "interpretation" can be mechanized.
  *   **Where Jordan Overreaches:** This analogy hides the origin of the meaning. Computer code is **derived intentionality**. The syntax maps to function only because a human engineer *designed* it to do so. The "meaning" was injected by a mind at the design stage, even if no mind is present at the execution stage. Jordan is trying to use the *mechanism* of software to prove the *ontology* of DNA, but he is skipping the source of the semantic grounding.

  ### Move 4: Riley's Counter (Selection vs. Interpretation)
  **The Argument:** Riley replies that without an engineer, silicon is just sand. Evolutionary selection is causal filtering, not interpretation. Pushing interpretation back into evolutionary history confuses cause (survival) with meaning (representation).
  **Analysis:**
  *   **Where Riley is Right:** Riley exposes the asymmetry in Jordan's computer analogy. Computers are artifacts; biology is (arguably) not. The "meaning" of software is borrowed from the engineer's mind. DNA has no engineer. Therefore, calling DNA a "code" attributes a property (derived intentionality) to a system that lacks the deriving agent. Riley is correct that natural selection explains *why* the mapping persists (cause), but not *what it means* (semantics).
  *   **Where Riley is Vulnerable:** Riley must explain why biological systems are so distinct from other physical systems that we *need* informational language. If DNA is just chemistry, why does the "central dogma" (flow of information) hold so robustly compared to other chemical pathways?

  ---

  ### The Verdict

  To referee this dispute, we must distinguish between **scientific utility** and **ontological literalism**.

  #### 1. Can arbitrariness without conventional agreement ground literal semantics?
  **Riley is right.**
  Arbitrariness alone cannot ground literal semantics. For a sign to have semantic content (to be "about" something), there must be a context of use that establishes norms of correctness (truth conditions). In human language, this is convention. In computer code, this is designer intent. In DNA, there is neither convention nor designer.
  *   **The Philosophical Reason:** Without an agent or a convention, there is no distinction between "error" and "variation." If a mutation changes a codon, is that a "typo" (semantic error) or just a new chemical state (causal variation)? Without an interpreter to hold the norm, it is just causation. Jordan identifies the *structure* of a code (arbitrary mapping), but Riley correctly identifies that the *status* of a code requires a semantic grounding that nature does not provide.

  #### 2. Does the absence of an engineer undermine the DNA and software analogies symmetrically?
  **Riley is right; the analogies are not symmetric.**
  Jordan argues the analogies are symmetric (both run without a user). Riley argues they are asymmetric (one was designed, one was selected).
  *   **The Asymmetry:** Software possesses **derived intentionality**. Its "code-ness" is parasitic on the mind of the programmer. Even if the programmer dies, the code remains a code because it was *created* as one. DNA, under a naturalistic worldview, was not created by a mind. Therefore, calling DNA a "code" is a metaphor we impose on it, not a property it possesses independently of us.
  *   **The Consequence:** If you remove the engineer from the software story *at the design phase*, the software never becomes code; it remains random noise. If you remove the "engineer" (God/Designer) from the DNA story, DNA remains functional but loses its claim to *literal* semantics. Jordan wants to have the functional benefits of the design analogy without the designer.

  ### Final Ruling

  **On Scientific Practice (Jordan Wins):**
  Jordan is right that treating DNA *as if* it were a literal code is indispensable for molecular biology. The heuristic value of the "genetic code" metaphor is so high that denying it hampers research. Functionally, the cell processes information.

  **On Philosophical Ontology (Riley Wins):**
  Riley is right that "literal code" implies semantic content that requires agents, conventions, or designers. Since natural selection is a blind, causal filter, DNA carries **causal information** (correlation) but not **semantic information** (meaning). To call it a literal code is to commit a category error, conflating complex causality with representation.

  **Recommendation for the Study Group:**
  The disagreement stems from using the word "code" in two different senses.
  1.  **Jordan** is using a **functional definition**: A system where arbitrary symbols map to specific outcomes. (DNA fits this).
  2.  **Riley** is using a **semantic definition**: A system where symbols carry meaning established by agreement or intent. (DNA does not fit this).

  **Referee's Decision:** Riley is philosophically more rigorous regarding the definition of "semantics" and "literal code." Jordan is pragmatically correct about biological function but metaphysically overstated in claiming literal semantic content. The most precise position is **Teleonomy**: DNA behaves *as if* it were a code designed for a purpose, due to the history of selection, but it lacks the intrinsic or derived intentionality required for literal semantic status.
