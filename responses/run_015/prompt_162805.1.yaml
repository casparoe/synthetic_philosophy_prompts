      *   *Compossibility Failure:* If local editing *is* possible (modal realism/transworld identity).

  6.  **Addressing the "Insulation is a Defect" Question:**
      *   In science, insulation is bad (Popper). In metaphysics, it might be necessary (necessary truths aren't falsifiable by contingent data). But this view makes a claim about *this* world's contingent structure. So insulation *is* a defect if it prevents empirical engagement.

  7.  **Final Review against Constraints:**
