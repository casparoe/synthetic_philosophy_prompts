      *   *User's Clause 5:* "Limiting densities." I need to highlight the mathematical fragility of limits over infinite sets (Riemann rearrangement theorem analogues).
      *   *Defender's Concession:* A smart defender admits the Measure Problem is hard but might claim God's intuition bypasses the limit process. I need to mark this as "insulation."

