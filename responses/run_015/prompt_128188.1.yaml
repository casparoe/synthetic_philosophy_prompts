prompt: |-
  You are a professional philosopher of mind with a bit of ethology in your back pocket. I want you to draft the joint statement from an adverserial collaberation between two camps: the "sphex-rigidists", who take the sphex wasp's burrow-check loop as proof that apparent agency collapses into mechanical repetition, and the "loop-flexibilists", who think the loop is context-sensitive enough that the sphex analogy fails for debates about free will.

  Before writing, please do some quick brainstoming on what both sides could genuinely sign — especially about the wasp's actual behaviour, the limits of analogical reasoning, and whether graded sphexishness in artificial agents tells us anything about moral responsibility.

  Then produce the document with: (1) a numbered section of agreed claims, including the "double-check paradox" (that adding a verification step can make a loop more rigid, not less) and the open status of interruption-resilience as a marker; (2) a disagreements table with each camp's position phrased in wording they would accept for themselves; (3) the cruxes — I suspect one is whether interruption-resilience tracks agency, another is whether failed ecological predictions break the analogy; (4) for each crux, a concrete case or thought-experiment both sides agree is relevant, plus each camp's prediction written down in advance.

  Keep it somewhat in the weeds, avoid asking for bibliographies or reading lists, and write in British English. Think carefullt, and make sure the disagreement is exact rather than a straw man.
