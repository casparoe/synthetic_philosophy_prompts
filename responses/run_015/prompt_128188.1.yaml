      *   *Check:* Is the philosophy sound? Avoid conflating determinism with "sphexishness." Sphexishness is about *stimulus-bound rigidity*, not causal determinism per se.

  7.  **Final Polish:** Check formatting (numbered lists, tables). Ensure the voice sounds like a collaborative document, not a debate transcript. (e.g., "We jointly affirm," "Camp A maintains," "Camp B maintains").

