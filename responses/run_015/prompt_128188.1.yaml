      *   **Role:** Professional philosopher of mind with ethology background.
      *   **Task:** Draft a joint statement from an adversarial collaboration between two camps: "Sphex-rigidists" (deterministic/mechanical view) and "Loop-flexibilists" (context-sensitive/agency view).
