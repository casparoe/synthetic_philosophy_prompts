answer: |-
  **MEMORANDUM**

  **TO:** Mayor's Office
  **FROM:** Democratic Reform Task Force
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Eastside Zoning Board Reform Proposal (Sortition & Weighted Voting)

  **RECOMMENDATION**

  **Reject the "Stratified Deliberation Weights" mechanism.** The Task Force recommends proceeding with the transition to a citizens' assembly via sortition only on the condition that all members retain equal voting rights and equal speaking time. The proposed mechanism of weighting votes and speaking time based on a knowledge assessment is philosophically incoherent, legally vulnerable, and undermines the legitimacy of the reform. To address competence concerns, we recommend enhancing neutral staff support and expert testimony protocols rather than tiering member authority.

  **BACKGROUND**

  The Eastside Zoning Board reform proposal seeks to replace the current appointed board with a citizens' assembly selected by lot (sortition). The stated goal is to increase statistical representativeness and reduce developer capture. However, the proposal includes a novel modification: after selection, members would take a assessment on zoning history and demographics. Scores on this assessment would determine "stratified deliberation weights," assigning members weighted votes (1x, 1.5x, 2x) and differentiated speaking budgets. Proponents argue this preserves representativeness while ensuring epistemic competence.

  **ANALYSIS: THE EQUALITY ARGUMENT**

  The primary justification for sortition is democratic equality. In a lottery-based system, every citizen is presumed to possess equal political capacity—the ability to judge the common good regardless of technical expertise. This mirrors the logic of the jury system: we do not weight a juror's vote based on their knowledge of penal code because legitimacy derives from peer judgment, not technocratic accuracy.

  The proposed weights violate this principle by creating two classes of citizens within the same body. By tying voting power to a test score, the system reintroduces a meritocratic hierarchy that sortition was designed to eliminate. It signals that while all residents are eligible to serve, not all residents' judgments are equally valuable. This undermines the political legitimacy of the board. If the public perceives the assembly as a body where some voices count more than others based on an administered test, the reform will be viewed as elitist rather than democratic. Furthermore, unequal speaking time disrupts deliberative equality; if lower-scoring members speak less, their lived experience—which the sortition was meant to amplify—is systematically silenced during the formation of consensus.

  **ANALYSIS: THE COMPETENCE ARGUMENT**

  The argument for weights must be treated seriously. Zoning is technically complex, involving density calculations, environmental impact reviews, and long-term infrastructure planning. The risk is not merely theoretical; an uninformed board could approve developments that violate city master plans or expose the city to liability.

  Proponents argue that pure sortition risks "ignorance dominance," where the sheer number of untrained citizens overwhelms the few who understand the code. The weights are intended as an epistemic filter: they incentivize members to study the material and ensure that those who understand the consequences of a decision have greater sway over the outcome. From a governance perspective, this is a utilitarian calculation. If weighted voting prevents costly zoning errors, the sacrifice of strict political equality may be worth the gain in decision quality. Proponents contend this is not elitism but safeguards against populism that could harm the very neighborhoods the assembly is meant to represent.

  **CONCEPTUAL COHERENCE: THE CONFLATION**

  While the competence concern is valid, the proposed mechanism is conceptually confused. It conflates **representativeness** (who is in the room) with **epistemic authority** (who decides).

  Sortition solves the problem of *who* represents the public. Epistocracy (rule by the knowledgeable) solves the problem of *how* decisions are made based on technical data. These are incompatible logics. By layering weighted voting onto a lottery, the proposal creates a hybrid that fails at both goals.
  1.  **It breaks the lottery:** If vote weight depends on a test, the selection is no longer random regarding power. It becomes a meritocratic filter disguised as a lottery.
  2.  **It fails epistocracy:** A short assessment on zoning history does not guarantee competence in urban planning. It measures retention of briefing materials, not judgment. You risk empowering those who are good at taking tests, not those who are good at planning communities.

  You cannot have it both ways. If the goal is democratic legitimacy, votes must be equal. If the goal is technical optimization, the board should be appointed experts. This proposal attempts to straddle the line and risks achieving neither. It treats political voice as a reward for study rather than a right of citizenship.

  **PRACTICAL RISKS**

  Beyond theory, the weights introduce administrative and legal liabilities:
  *   **Legal Exposure:** Differential voting rights based on an assessment could trigger Equal Protection challenges. It creates a state-administered test that determines political power, reminiscent of literacy tests historically used to disenfranchise voters.
  *   **Assessment Bias:** Who writes the test? If the planning department writes it, they effectively choose who holds power. This recreates the bureaucratic capture the reform aims to solve.
  *   **Deliberative Friction:** An assembly where members know their votes count for less will likely fracture. Lower-weighted members may disengage or view higher-weighted members as illegitimate leaders, causing gridlock.

  **PATH FORWARD & CONDITIONS**

  The Task Force recommends approving the sortition framework **conditional on the removal of all weighted voting and speaking time mechanisms.** To address the competence argument without sacrificing equality, the Mayor's Office should implement the following:

  1.  **Neutral Staff Support:** Assign independent planning staff to the assembly, distinct from the departments currently seeking approvals, to ensure technical guidance is unbiased.
  2.  **Mandatory Orientation:** Require a comprehensive, paid training period on zoning basics before the assembly convenes. Participation is mandatory, but mastery is not tested for voting rights.
  3.  **Supermajority Requirements:** For technically complex decisions, require a supermajority vote. This forces consensus and ensures that decisions cannot be made without broad agreement, naturally encouraging members to listen to those with better technical grasp without formally weighting their votes.

  **DISSENT ACKNOWLEDGMENT**

  A minority of the Task Force argues that removing the weights renders the board vulnerable to manipulation by charismatic actors or external lobbyists who can easily educate a layperson group. They maintain that without a formal mechanism to amplify informed voices, the "Equality Argument" privileges ignorance over expertise. While this risk is real, the solution lies in robust deliberative procedure (time, expert testimony, cross-examination) rather than unequal voting power. We acknowledge this dissent but maintain that institutionalizing inequality within a democratic body is a greater risk than the potential for uninformed decisions.

  **NEXT STEPS**

  If approved, Legal Counsel should review the revised charter to ensure compliance with state open meeting laws and equal protection statutes before the Friday deadline.
