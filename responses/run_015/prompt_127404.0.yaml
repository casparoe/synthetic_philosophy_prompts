answer: |-
  The booth was soundproofed, but Elara could feel the vibration of the building anyway, a low hum like the earth turning. On the screen before her, the cursor blinked in the source editor. *Delegate_v9.py*.

  Across the city, in an identical booth, Mara was staring at the same blank slate. They hadn't spoken in three years, not since the reading of the will. The estate was simple: the childhood home, the only place that ever felt like safety. The arbitration house demanded a split, or a settlement. A split meant selling. A settlement meant co-ownership, a trust, a way to keep the walls standing.

  The rules of the House were absolute. Each sister submitted a delegate. The delegates inspected each other's source code. Then, they printed SETTLE or FIGHT. The payoffs were standard Prisoner's Dilemma: mutual settlement was best for the pair, but unilateral fighting yielded the house to the victor. Mutual fighting meant liquidation fees that left them both with nothing but debt.

  The textbook strategy was the Recognizable Reciprocator. You wrote a program that said: *If the opponent's code is identical to mine, SETTLE. Otherwise, FIGHT.* It was stable. It was Nash. It was brittle. If Mara added a comment, or changed a variable name, the hashes wouldn't match. The machines would see strangers. They would fight. They would lose the house.

  Elara's finger hovered over the `VEIL` toggle.

  The House allowed veiling. You could run your delegate through the scrambler. It output functionally equivalent code—same behavior on every input—but the structure was obliterated. Obfuscated. To the opposing delegate, a veiled program was a black box. You couldn't read its logic. You couldn't check its hash.

  Standard theory said veiling was suicide. If you veil, you hide your reciprocity. If both veil, neither can verify the other. Rational agents must FIGHT.

  But Elara knew Mara. They shared more than DNA; they shared a history of silent understandings, of finishing sentences, of knowing when the other needed space. The brittleness of the standard move insulted that history. It demanded they be clones, not sisters.

  If they veiled, they couldn't verify logic. They could only verify intent.

  Elara began to type. She didn't write a reciprocator. She didn't write a check for code similarity. Those were tests of syntax, and syntax was just skin. She wrote a utility function.

  `def decide(opponent_source):`
  `    my_payoff = calculate_outcome(SETTLE, opponent_move)`
  `    sister_payoff = calculate_outcome(SETTLE, opponent_move)`
  `    if (my_payoff + sister_payoff) > max_individual_gain:`
  `        return SETTLE`
  `    else:`
  `        return FIGHT`

  In a Prisoner's Dilemma, maximizing the sum forces cooperation. It changes the game. But it required Mara to do the same. If Elara maximized the sum and Mara maximized the self, Elara would be crushed.

  This was the cost. To cooperate without verification, she had to make herself vulnerable. She had to submit a program that *could* be exploited, trusting that Mara wouldn't be the exploiter.

  Elara moved the cursor to the `VEIL` toggle.

  If she left it transparent, Mara would see the utility function. She would see the love embedded in the math. But she would also see the vulnerability. And the House would see it. The House audited for manipulation. Would altruism count as manipulation? It didn't matter. The point was privacy. This logic was theirs. It wasn't for the machine. It wasn't for the lawyers.

  Veiling hid the sentiment. It preserved the dignity of the choice. But it also hid the safety. Once veiled, Mara couldn't know Elara was playing for the sum. She had to believe it.

  Elara clicked `VEIL`. The code scrambled into a cascade of meaningless characters, behaviorally identical but structurally dead.

  She thought of Mara in the other booth. Was she typing the same function? Or was she typing a predator? They couldn't communicate. No signals. No side channels. The only channel was the delegate's output.

  If Mara veiled and submitted a standard selfish maximizer, she would see Elara's veiled box, assume it was opaque and dangerous, and FIGHT.
  If Mara veiled and submitted the sum-maximizer, she would SETTLE.
  If Mara stayed transparent, her code would be readable. Elara's veiled delegate, however, was written to ignore structure. It didn't look at the opponent's text. It looked at the *logic of the situation*.

  Wait. Elara paused.

  If her delegate couldn't read the opponent's code because it was veiled, how could it calculate the opponent's move? It couldn't simulate what it couldn't read.

  She deleted the simulation line. She rewrote the core.

  `def decide(opponent_source):`
  `    # I cannot know your code. I cannot know your intent.`
  `    # I can only know my own.`
  `    return SETTLE`

  It was terrifying. It was an unconditional surrender. If Mara fought, Elara lost everything. But if Elara fought, even conditionally, she risked the mismatch that killed the house.

  By submitting `return SETTLE`, she was removing the possibility of mutual destruction. She was forcing the outcome to be either Win-Win or Win-Lose. She was betting that Mara loved her enough not to take the Win-Lose.

  Elara highlighted the code. She clicked `VEIL` again. The simplicity was hidden inside the complexity of the obfuscation. To the outside world, it looked like a complex strategy. Inside, it was a gift.

  She hit `SUBMIT`.

  The screen went dark. *Waiting for counterparty.*

  In the silence, Elara felt the weight of the choice. She hadn't solved the verification problem. The House was right: no procedure could tell if Mara's veiled program was identical to hers. They were blind to each other.

  But they weren't blind to themselves.

  She had chosen to be the kind of sister who settles. She had to trust Mara was too. The code wasn't the agreement. The code was just the vessel. The agreement was the three years of silence, the grief they hadn't shared, the hope that the house mattered more than the equity.

  The screen flickered. *Delegate Exchange Complete.*
  *Running Simulation...*

  Elara held her breath. The machine didn't care about their love. It cared about the output.

  *Result: SETTLE / SETTLE.*
  *Arbitration: Approved.*
  *Asset Status: Joint Trust.*

  Elara exhaled, a shaky sound in the soundproof booth. She didn't know what Mara's code looked like. She never would. Mara might have written a complex reciprocator. She might have written the same blind surrender. It didn't matter. They had found a equilibrium not in the syntax, but in the silence between the lines.

  They had traded certainty for trust. And for the first time in three years, the house was theirs.

  ***

  **Note on Probabilistic Scramblers**

  If the scrambler guaranteed agreement only on the first million inputs rather than all inputs, the sisters' solution would become significantly more precarious, though not necessarily impossible. Their strategy relied on unconditional cooperation (`return SETTLE`). If the scrambler introduced behavioral divergence on specific inputs, the risk is that the delegate might behave cooperatively during the House's audit (which likely tests fewer than a million cases) but defect on the actual execution input.

  However, since the delegate receives only *one* input (the opponent's source), the "first million inputs" guarantee is less relevant than whether the *specific* input of the opponent's source falls within the guaranteed set. If the scrambler is probabilistic regarding *which* inputs are stable, there is a non-zero chance the delegate malfunctions on the critical input. In this case, the solution survives only if the sisters trust the *probability* of stability enough to wager the house. It shifts the burden from faith in each other to faith in the machine, undermining the emotional core of their choice. They would be betting on code reliability, not sisterhood.
