answer: |-
  You have done something quite remarkable for a non-academic: you have independently rediscovered one of the central debates in the philosophy of biology. The distinction you found between "what a trait was selected for" (Selected Effect) and "what a trait currently contributes to the system" (Causal Role) is exactly the fault line running through this argument.

  The forum user used Dobzhansky's slogan as a trump card to shut down your question. But as you suspected, the slogan is a Rorschach test. Depending on how you interpret "makes sense," it ranges from a harmless reminder to a controversial metaphysical claim.

  Here is the menu of claims that sentence could be making, ordered from the methodological (boring) to the ontological (wild), with verdicts and applications to your test cases.

  ### 1. The Methodological Heuristic
  **The Claim:** "You will likely fail to understand why a trait exists or how it works if you ignore the evolutionary history that shaped it."
  **Verdict:** **Platitude.** Almost every biologist accepts this. It is advice on how to investigate, not a definition of what exists.
  **The Gull:** This reading says: "Don't assume the feather helps with gliding yet. Check the history first to see if it's a known adaptation." It does *not* say the feather lacks a function now, only that you can't be sure *why* it's there without history.
  **Test Cases:**
  *   **Synthetic Cell:** You can understand how it works mechanically without evolution, but you won't understand why *this* specific genome was chosen over others without looking at the engineers' goals (a proxy for selection).
  *   **Exaptation:** You might mistake a trait's current use for its original purpose if you don't look at history.
  *   **Stent:** You can understand the blood flow without evolution, but you need to know the stent is artificial to understand the system's boundaries.
  **Does it justify "Come back in 50 generations"?** **No.** This reading invites you to look at history, but it doesn't forbid you from asking about current utility.

  ### 2. The Etiological Definition of Function (The "Selected Effect" View)
  **The Claim:** "A trait strictly speaking has no *biological function* unless it exists because ancestors with that trait survived and reproduced better." (Function = History of Selection).
  **Verdict:** **Substantive and Defensible.** This is a rigorous philosophical position championed by philosophers like Ruth Millikan and Karen Neander. It is widely held in evolutionary biology but contested by physiologists and ecologists.
  **The Gull:** The feather has **no function** yet. It is merely a variation. It might *help* the bird glide (causal role), but it does not have the *function* of gliding until it gets passed down.
  **Test Cases:**
  *   **Synthetic Cell:** The parts have **no biological function**. They have an *engineering* function (intended by the designer), but since they lack a history of natural selection, they are biologically "functionless" in this strict sense.
  *   **Exaptation:** If a bone evolved for support but is now used for hearing, its *biological function* is still support (or none, if the support role is gone), while its *current use* is hearing.
  *   **Stent:** The stent has **no biological function**. It contributes to blood flow, but it is not a biological trait shaped by selection. It is a prosthetic.
  **Does it justify "Come back in 50 generations"?** **Yes.** This is the only reading that validates the forum user's dismissal. If function *requires* selection history, a novel trait in a single individual literally cannot have a function yet.

  ### 3. The Systemic Contribution View (The "Causal Role" View)
  **The Claim:** "A trait's function is defined by its current causal contribution to the capacity of the containing system." (Function = What it does now).
  **Verdict:** **Substantive and Defensible.** This is the standard view in physiology, biochemistry, and medicine. It is contested by strict evolutionary biologists who feel it dilutes the meaning of "adaptation."
  **The Gull:** The feather **has a function** if it contributes to gliding, regardless of history. If the physics work, the function exists.
  **Test Cases:**
  *   **Synthetic Cell:** The parts **have functions**. If a gene replicates the cell, its function is replication, regardless of how the cell was made.
  *   **Exaptation:** The bone's function **is hearing**. History is irrelevant to what it is doing right now.
  *   **Stent:** The stent **has a function** within the cardiovascular system (maintaining patency). It is part of the causal machinery keeping the organism alive.
  **Does it justify "Come back in 50 generations"?** **No.** This reading says your question was valid and answerable immediately by measuring aerodynamics.

  ### 4. The Constitutive Claim
  **The Claim:** "You cannot even identify or describe the trait as a biological unit without referencing its lineage."
  **Verdict:** **Substantive but Contested.** This suggests that "wing feather" is not a physical description but a historical one. If a plastic fake feather looked identical, it wouldn't be a "wing feather" in the biological sense.
  **The Gull:** You can't even call it a "wing feather shape" properly without knowing it belongs to the lineage of gull wings.
  **Test Cases:**
  *   **Synthetic Cell:** Is it a "cell"? If it lacks ancestry, some strict proponents might say it's a "cell-like artifact," not a biological organism.
  *   **Exaptation:** The trait is defined by its origin, so calling it a "hearing bone" is a category error if it originated as a support bone.
  *   **Stent:** The stent is definitively *not* part of the organism. It is an external object inserted into a system.
  **Does it justify "Come back in 50 generations"?** **Sort of.** It implies that until the trait is established in the lineage, it isn't fully a "biological trait" yet, just a physical anomaly.

  ### 5. The Anti-Teleology Claim (The "Wild" Reading)
  **The Claim:** "Biology contains no purposes, goals, or 'for-ness' of any kind, except metaphorically via the blind process of selection."
  **Verdict:** **Just Plain False (or at least overextended).** While biology lacks a *conscious* designer, functional language is indispensable. Denying current utility leads to absurdities in medicine and ecology.
  **The Gull:** The feather is not "for" anything. To say it helps gliding is to project purpose onto physics.
  **Test Cases:**
  *   **Synthetic Cell:** Nothing in the cell is "for" replication. It just happens.
  *   **Stent:** The stent is not "for" blood flow. It just obstructs the artery less.
  **Does it justify "Come back in 50 generations"?** **Yes, but nihilistically.** It says "Nothing has a function ever, but if you must talk that way, wait for selection." This is rarely what people mean, but it lurks in the background of hardline adaptationism.

  ***

  ### Which reading earns the "Come back in 50 generations" comment?

  The forum user is relying entirely on **Claim #2 (The Etiological/Selected Effect View)**.

  They are asserting that *function* is not a property of physics or current utility, but a property of history. In their view, asking if a novel trait has a function *now* is a category error, like asking "What is the marital status of this single person?" before they have gotten married. To them, a trait becomes functional only after it has been "hired" by natural selection.

  **Why this is frustrating for you:**
  You are likely operating under **Claim #3 (The Causal Role View)** or a mix of #1 and #3. In scheduling freight (your job), if a new route saves time *today*, it has a function *today*, even if you haven't used it for 50 years. In medicine (your dad's stent), if the mesh keeps the artery open, it is functioning. The forum user is demanding you switch to a definition of "function" that excludes current utility entirely.

  ### What are people usually reaching for when they use the line?

  When biologists or enthusiasts drop the Dobzhansky quote in a forum argument, they are usually doing one of three things:

  1.  **Gatekeeping (Most Common):** They are signaling, "I know the proper theoretical framework, and you are asking a naive question." They are invoking Claim #2 to assert authority, often without realizing it is a contested philosophical stance.
  2.  **Anti-Creationism (Original Context):** Dobzhansky wrote this in 1973 specifically to argue against creationist "intelligent design." He meant that you cannot understand the *messiness* of biology (vestigial organs, bad design) without evolution. He was not necessarily trying to ban discussion of current physiology.
  3.  **Adaptationism:** They assume that if a trait exists, it *must* be an adaptation. Your gull question threatens this because it suggests a trait could exist *before* being an adaptation. They want to wait 50 generations to see if it *becomes* an adaptation, thereby validating their worldview.

  ### The Verdict on Your Test Cases

  The **Synthetic Cell** is the strongest weapon against the forum user's position.
  *   **Forum User's View (Claim #2):** The synthetic cell has no biological functions. Its genes don't "code for" proteins in a biological sense; they just chemically interact.
  *   **Your Intuition (Claim #3):** The cell lives, replicates, and metabolizes. The parts have functions.
  *   **The Stent:** This highlights the boundary problem. If function requires selection history, the stent is biologically inert. If function is causal contribution, the stent is functionally integrated. Most doctors would say the stent is functioning; strict evolutionary biologists might say it is an environmental factor, not a biological trait.

  ### Summary Advice

  You are not missing anything. You have correctly identified that the slogan is being used to smuggle in a specific, contested definition of "function" (Selected Effect) while presenting it as a universal truth.

  *   **Is the slogan true?** As a heuristic (#1), yes. As a definition of function (#2), it is debatable. As a claim that current utility doesn't matter (#5), it is false.
  *   **Was your question valid?** Yes. In ecology and physiology, current causal role is a valid form of function. In evolutionary genetics, selected effect is the valid form. You were asking an ecological/physiological question; they answered with an evolutionary genetics rulebook.
  *   **The "50 Generations" line:** This is only correct if you accept that *nothing* has a function until it is inherited. That is a useful definition for tracking adaptation, but a terrible one for understanding how an organism survives *now*.

  If you reply to the thread, you might say: *"I understand you're using the Selected Effect definition of function, where history is required. But under the Causal Role definition used in physiology and ecology, the feather contributes to aerodynamics now, regardless of ancestry. Dobzhansky's slogan warns us not to ignore history, but it doesn't strictly forbid analyzing current utility, does it?"*

  That will likely annoy them more, because it shows you've seen the machinery behind the curtain. But it is the accurate biological answer.
