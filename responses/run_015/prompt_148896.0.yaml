answer: |-
  At a small water treatment plant, Operator A skipped Tuesday's manual chlorine check, relying on an automated sensor Tech B had pulled for maintenance Monday but forgot to log offline, while Supervisor C approved the skip based on stale dashboard data showing the sensor as active. By Wednesday, contamination occurred, yet local regulations stipulate manual checks are legally mandatory only if the automated system's "primary" certification is current, which had expired twelve days prior. Consequently, Operator A's omission was causally redundant—had the sensor functioned, no harm would have occurred—but normatively non-redundant because the lapsed certification rendered the manual check obligatory regardless of the sensor's status, creating a conflict between physical causation and legal duty.

  **The Analysis**

  **1. The Counterfactual Test (The "But-For" Mess)**
  Standard causation asks: *But for A's omission, would the harm occurred?* Physically, yes: if A had checked, the contamination would have been caught, making A a but-for cause. However, the nested redundancy complicates this. *But for B's omission* (pulling the sensor), the sensor would have caught it, rendering A's check physically unnecessary in a properly functioning system. Furthermore, *but for the regulatory expiry*, A would have had no duty to check at all. We have three competing counterfactuals: A's action prevents harm, B's action prevents the need for A's action, and the Regulator's timeline dictates whether A's action matters. The "causal redundancy" arises because the system was designed so A *shouldn't* have needed to act if B and the Certs were valid; A is only the physical cause because the prior layers failed.

  **2. Normative Expectation vs. Causal Redundancy**
  This is where the legal twist fractures the logic. Normatively, the expired certification strips away the "redundancy" defense. Even though the sensor *could* have physically saved the day (making A's check physically redundant in a perfect world), the law treats the sensor as legally invisible due to the expiry. Therefore, A's omission is normatively non-redundant: A was the *only* legally recognized safety barrier remaining. The law imposes a duty to act that ignores the physical reality that the sensor was the more efficient cause-prevention tool. A is liable not because their omission was the unique physical cause, but because it was the unique *breach of mandated protocol* in a vacuum where the automated system legally ceased to exist.

  **3. Where the Causal Chain Fractures**
  The chain fractures at the intersection of **physical sufficiency** and **legal validity**. Physically, the cause traces back to Tech B (who disabled the primary safeguard) and Supervisor C (who validated false data); A is merely the final link in a chain of errors. However, normatively, the chain is severed at the regulatory expiry. The expiration acts as a "normative reset," invalidating the reliance on B's sensor and placing the entire causal weight on A's shoulders. The conceptual mess is that A is held as the primary cause of the harm *by omission*, despite being the least efficient physical cause, simply because the legal framework redefined the causal landscape twelve days prior. The omission causes the harm only because the law says it should have, not because it was the only physical way to stop it.
