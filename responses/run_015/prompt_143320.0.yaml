  Your derivation correctly demonstrates that unconditional closure and epistemic inertia are jointly incompatible with fallibilism; retaining both logically necessitates the dogmatism you wish to avoid. Since abandoning inertia (4) invites radical holism where local justification is constantly undermined by remote data, the lesser cost lies in qualifying closure. By restricting (1) to cases absent defeaters, you preserve the unity of reason for standard deductions while blocking the "teletransport" of justification into empirically immune domains. The specific cost is acknowledging that logical competence alone does not guarantee justification transfer if the act of deducing $q$ exposes the agent to overriding counter-evidence that defeats the base belief $p$. This modification maintains rational coherence without forcing the agent to ignore empirical falsification of consequences, effectively dissolving the paradox without surrendering the core utility of closure or the stability of local belief.
