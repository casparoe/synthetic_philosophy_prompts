      The contribution to EU is tiny.
      So CE is indeed low.
      User's intuition here is also correct.

      *So where is the friction?*
      The friction is the claim that "finiteness alone tames the gamble."
      It tames the *math* (no infinity), but not the *intuition* (why pay $41 for a likely $2?).
      The paradox is not "Infinity is weird." The paradox is "EMV recommends a price that no rational agent would pay."
      Finitization changes the recommendation from $\infty$ to $41$.
      Does a rational agent pay $41? Probably not.
      So EMV is still "wrong" normatively, even if finite.
      That is the key insight to deliver.

  10. **Structure of the Response:**
