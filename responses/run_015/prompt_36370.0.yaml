      *   *Tension B:* (2) says it's just how valuation works (like pigeons). (1) says it's an *irrational* defect. Is a pigeon irrational? If it's just how brains work, is it a "defect"?
      *   *Tension C:* (3) says 10pm and Midnight are like different people. (4) says 10pm can bind Midnight. If they are like different people, is precommitment coercion? (3) suggests Midnight might be equally entitled to sabotage 10pm.
