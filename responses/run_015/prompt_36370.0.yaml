      *   **(3) vs. (5):** *High Severity.* (5) says blame is appropriate because a standard was violated. (3) says there is no objective standard to violate. You can't blame someone for failing a test that doesn't exist.
      *   **(2) vs. (5):** *Medium Severity.* If it's just a mechanical discounting process (2), does blame (5) make sense? We don't blame pigeons. We don't blame calculators for wrong sums usually, unless there's agency. If the mechanism is deterministic/biological, blame feels misplaced *unless* there's a higher-order capacity to override it.

