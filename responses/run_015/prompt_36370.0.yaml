      *   (3) *No Privileged Time-Slice:* No fact of the matter which self is "correct." 10pm vs. Midnight is like Person A vs. Person B. (Metaphysical/Normative claim: No objective authority).
      *   (4) *Precommitment is Rational:* Binding future selves is sensible. (Pragmatic/Normative claim: Strategy).
