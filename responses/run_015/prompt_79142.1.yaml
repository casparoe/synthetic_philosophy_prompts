answer: |-
  # Q&A PREP SHEET: 'Slurs as Gradable Acts'
  **Workshop:** Interdisciplinary Philosophy of Language & Law
  **Date:** Next Week
  **Tone:** Collegial but precise. British English.

  ---

  ## 1. UP-FRONT CONCESSIONS
  *Do not wait for them to pry these out of you. Weave them into your opening remarks or the first transition.*

  *   **Correlation is not Identity:** Concede immediately that certain word-types are *statistically* far more likely to be used slur-wise. You are not arguing that 'bank' and the N-word are equiprobable slurs; you are arguing that the slur-status is not *essential* to the lexical entry.
  *   **The Legal Heuristic:** Concede that the law requires operational categories for efficiency. You are offering a metaphysical claim about language, not a draft bill for Parliament. If your theory makes litigation messier, acknowledge that trade-off honestly.

  ---

  ## 2. THE OBJECTIONS (Ordered by Damage Potential)

  ### I. The Formal Semanticists (The Kill Shot)
  **The Objection:**
  'You claim the slurring force is a property of the act, not the word. But slurring content projects. If I say, "It's not true that he's a [slur], but he is a [slur]," the offence remains in the second clause. If this is merely pragmatic or use-conditional, how do you account for projection without positing a stable semantic value? If you can't give me a compositional rule for how this 'gradable property' combines with negation or conditionals, you haven't got a semantics; you've just got a description of feelings.'

  **The 2-Minute Reply:**
  'That's the crux of it, and I agree: if I can't compose it, I haven't got a theory. My proposal is that we treat the slurring force as *use-conditional content* rather than truth-conditional content, following the work on expressives by Potts and others. The 'gradation' isn't vague; it's a function of the speaker's endorsement of a derogatory perspective relative to the common ground.

  When we embed the term—say, in a conditional or a report—the use-conditional content doesn't vanish; it projects because it operates on a different dimension than the truth conditions. The 'puzzle' of projection arises only if we assume all content must be truth-conditional. On my view, the offence persists in "It's not true that he's X, but he is X" because the second clause still enacts the derogatory perspective, regardless of the truth-value of the predication. The compositionality lies in the rules governing perspective-taking, not reference. We can model this formally without reifying the slur as a lexical atom.'

  **Honest Note on Thinness:**
  *This is the most vulnerable point. Use-conditional semantics is still a contested framework. If they press you on the specific logical operators for "perspective endorsement," you might have to admit the formal machinery is currently sketchier than the philosophical intuition. You are betting on a specific semantic framework winning out.*

  ### II. The Legal Philosopher (The Practical Block)
  **The Objection:**
  'Let's say you're right metaphysically. But hate-speech legislation relies on identifying prohibited *terms* or clearly defined *categories*. If "slur" is merely a gradable property of an act dependent on context and speaker intent, you've made the law unenforceable. A defendant will argue, "I wasn't slurring, I was merely using the word." By dissolving the category, aren't you removing the tool we use to protect vulnerable groups?'

  **The 2-Minute Reply:**
  'I understand the concern, and it's a serious one. However, the law already distinguishes between *mens rea* and the act itself. My view actually aligns better with current legal trends that look at harm and context rather than just a "list of banned words." If we treat "slur" as a lexical category, we create a loophole where reclaiming a term or using it in a quote becomes legally ambiguous.

  By shifting the focus to the *act* of slurring, we force the court to examine the harm and the intent, which is where the moral weight lies anyway. I'm not suggesting we remove the prohibition; I'm suggesting we tighten the definition of the violation. It shifts the burden from "Did they say the word?" to "Did they use the word to subordinate?" That is harder to adjudicate, yes, but it is more just. We shouldn't preserve a false linguistic precision if it obscures the actual harm.'

  **Honest Note on Thinness:**
  *This is politically risky. You are admitting your theory makes litigation more complex. A judge or policy-maker might find this unacceptable. You are prioritising philosophical accuracy over legal efficiency, which is a hard sell to a pragmatist.*

  ### III. The Sociolinguists (The Descriptive Flattening)
  **The Objection:**
  'You talk about "uses" as if they happen in a vacuum. But reclamation isn't just an individual act of non-slurring; it's a collective, historical process. When an in-group member uses the term, it carries the history of the word's violence. By saying there's "no such thing as a slur term," aren't you erasing the historical inertia that makes some words dangerous regardless of the immediate speaker's intent? You're flattening the power dynamics into a momentary pragmatic choice.'

  **The 2-Minute Reply:**
  'I'm not erasing the history; I'm locating where it does its work. The history is precisely what loads the gun, so to speak. My claim is that the history makes certain uses *highly probable* and *highly charged*, but it doesn't make the slurring inevitable.

  Reclamation works precisely because the link between word and harm is breakable. If the term itself were essentially a slur, reclamation would be impossible—it would be a contradiction in terms. By treating it as a gradable property of the act, we can explain how the *same* word, with the *same* history, can function differently in different communities. I'm not denying the power dynamics; I'm arguing that power operates through usage, not through magic in the lexicon. Flattening the category allows us to see the nuance of appropriation rather than treating it as an exception to a rule.'

  **Honest Note on Thinness:**
  *Sociolinguists may feel you are prioritising the philosopher's "clean" theory over the messy reality of community practice. If they argue that the "word type" itself has social agency independent of individual acts, your individualistic focus might look reductionist.*

  ---

  ## 3. THE SINGLE REPLY THAT MUST LAND
  **Target:** The Formal Semanticists (Objection I).
  **Why:** If you cannot demonstrate that a non-lexical account can handle compositionality and projection, the paper loses its theoretical engine. The legal and social arguments are downstream of the linguistic claim. If the linguistics fails, the rest is just opinion.
  **Strategy:** Do not get bogged down in formal notation unless asked. Stick to the *dimension* argument (truth-conditional vs. use-conditional). If you convince them that projection is compatible with use-conditional content, the "lexical category" requirement evaporates.

  ---

  ## 4. THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:**
  'If the slurring force is entirely dependent on the act and context, how do you distinguish between a *failed* slur and a *non-slur* use? If a speaker intends to slur but the audience doesn't take offence, or vice versa, where does the property reside? If it's in the uptake, isn't that just audience relativism? If it's in the intent, aren't you back to a mental state lexicalised?'

  **Why it's dangerous:**
  This exposes the lack of a clear criterion for the "gradable property." It threatens to collapse your view into either pure subjectivism (it's a slur if someone feels offended) or hidden essentialism (it's a slur if the speaker intends harm). It forces you to define the "slur-act" without relying on the very word you're trying to dismantle.

  **Prepared Deflection (if asked):**
  'That's the boundary problem, and I acknowledge it's the hardest part of the account. I'd argue it's a normative property, not just psychological. It depends on whether the act invokes a derogatory perspective that is *available* in the common ground, regardless of immediate uptake. But I'll concede that mapping the exact thresholds of that gradability is work for the next paper.' *(i.e., Kick it down the road politely).*
