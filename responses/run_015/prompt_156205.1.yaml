prompt: |-
  hey, i'm a novelist drafting a podcast tie-in for my new book. one charcter is a philosopher who thinks the Meno problem only bites if you treat belief like a stage prop — it can be true in scene one and false in scene three if the author rewrites the backstory. she defends this hybrid she calls 'plot-stable knowledge,' basically reliabilism crossed with narrative coherence, and claims that true belief is just knowledge with a missing chapter. i want to interview her, but i need questions that actually press her, not generic syllabus stuff. can you write me 8-10 questions that dig into whether plot-stability really explains why knowledge is better than true belief? i specifically want: one that corners her on Gettier-style luck where the plot still holds, plus a follow-up for when she dismisses it as bad editing; one that tackles her 'missing chapter' defelction with a counter-follow-up; at least one about fictional knowledge, like whether a charcter can genuinely know something false inside the story-world; and one that asks what evidence could actually change her mind about the value gap. please don't ask me for a bibliograpy or reading list — i don't have library access and this isn't an academic paper. just make them sharp, like they're coming from someone who actually read the literature but is tired of the usual answers.
