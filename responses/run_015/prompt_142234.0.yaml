answer: |-
  You are right to worry about the order because the logical dependency here is strict, and getting it wrong is exactly why your students are walking away with contradictory conclusions. You must start with Type Identity Theory, not Functionalism, because Functionalism is historically and logically a response to the failure of Identity Theory to account for Multiple Realizability. If you start with Functionalism, they will treat it as a free-standing definition rather than a solution to a specific problem. So your first ten minutes should be spent reconstructing the Type Identity claim, which is that mental state types are identical to neural state types, meaning pain just is C-fiber firing in the same way water just is H2O. You need to make this identity claim sound strong and plausible before you break it, otherwise the breakage won't seem significant. Once they grasp that Identity Theory requires a one-to-one mapping between mental kinds and physical kinds, you introduce Multiple Realizability not as a fact about individual variation but as a claim about structural diversity across different systems. This is the moment to head off the first major misconception, which is that Multiple Realizability just means everyone's brain is wired slightly differently. You need to clarify that individual neural variation is compatible with Identity Theory, whereas Multiple Realizability claims that entirely different physical substrates, like silicon or alien biology, could instantiate the same mental state. If they think it is just about messy wiring, they will think neuroscience could refute it with better scans, which leads to the second misconception you need to block here, which is that Multiple Realizability is a purely empirical prediction. You should tell them explicitly that while empirical evidence supports it, the argument is largely conceptual, relying on the logical possibility of different physical structures performing the same causal role.

  For your carrying example, you should use a clock showing a specific time, such as noon, rather than the mousetrap your seminar leader used, though the mousetrap is acceptable if you treat being a trap as a functional state rather than an object. The clock is slightly better because pain is a state rather than an artifact, and a clock displaying noon can be realized by gears, quartz crystals, or atomic decay without any ambiguity about consciousness. You must avoid the three obvious examples you listed for specific reasons. You should avoid Martians because mentioning them smuggles in the assumption that they are conscious, which begs the question of whether functional organization alone yields consciousness, and you want to keep the metaphysics separate from the phenomenology for this session. You should avoid the octopus because whether octopuses feel pain is an empirical dispute in neuroscience that will distract from the conceptual point about realization. You should avoid the chess-playing computer because it invites confusion between intelligence and consciousness, leading students to think functionalism is about behaviorism or passing tests rather than internal causal roles. Your example needs to have a clear functional definition, such as tracking the rotation of the earth, and it must lack any inherent connection to feeling or qualia so that students do not conflate performing the function with experiencing the state. The clock works because showing noon is defined by its causal relation to the earth and the user, not by the gears inside it.

  Once you have established that the Identity Theory struggles with Multiple Realizability using your clock example, you can introduce Functionalism as the solution that preserves materialism without requiring type identity. This is where you introduce the role versus occupant distinction, and you must place this after the Multiple Realizability argument because the distinction is motivated by the need to save materialism from the Multiple Realizability objection. If you introduce role and occupant too early, they will not see why it is necessary. You explain that Functionalism defines mental states by their causal role, such as being caused by damage and causing wincing, while leaving the occupant of that role open to be C-fibers in humans or silicon chips in robots. This sequence allows you to address the misconception that Multiple Realizability shows materialism is false. You need to stop them right here and emphasize that Functionalism is typically a materialist theory because the occupants are still physical states, just not the same physical states across all species. The claim that Multiple Realizability refutes materialism is a confusion between Type Identity Theory and Materialism generally, and if you do not correct this now, half your group will leave thinking functionalism implies dualism. At this point you must also flag what is settled versus what is a live fight among specialists. You should tell them that while it is standard introductory curriculum to say Multiple Realizability refutes Type Identity Theory, this is actually a live debate. You need to mention that philosophers like Jaegwon Kim have argued that if mental states are multiply realizable, they might not be causally efficacious at all, which threatens Functionalism too. You do not need to explain Kim's exclusion argument in detail, but you must state that the refutation of Identity Theory is not a settled fact so they do not treat it as dogma.

  As you move into the positive picture of Functionalism, you will encounter the half of the group who think a computer running the right program is in pain. This misconception stems from conflating the functional role with the presence of consciousness. You need to clarify that Functionalism defines what it is to be a pain state in terms of causal relations, but it does not necessarily guarantee that there is something it is like to be in that state. This is the boundary where you should openly refuse to cover the Knowledge Argument and the Chinese Room. You should say out loud that you are leaving them out because those arguments target qualia and consciousness specifically, whereas this session is about the metaphysics of state identification. If you try to answer whether the computer really feels pain, you will drift into hard problem territory which you do not have time for and which will confuse the structural point about realization. Instead, tell them that Functionalism allows for the possibility of zombies or non-conscious realizers depending on the version of functionalism one holds, but that the core thesis is about the definition of the state, not the existence of inner experience. This also helps address the misconception that functionalism is simply the view that the mind is software running on the brain's hardware. That slogan is too loose because it suggests the software is the mind and the brain is just a container, whereas Functionalism says the mental state is the causal role played by the hardware itself. You need to emphasize that the occupant is physical, not abstract software floating above the hardware.

  Toward the end of the fifty minutes, you should revisit the empirical status of Multiple Realizability to ensure they do not think neuroscience has settled the matter. There is a live debate in philosophy of neuroscience about whether psychological kinds are actually multiply realized or whether neuroscience will find common physical structures across all instances of pain. Some researchers argue that what looks like multiple realizability is just superficial variation over a common physical core. You should mention this so they understand that Functionalism relies on a claim about the world that could theoretically be challenged by future science, even if the argument is primarily conceptual. This prevents them from thinking Multiple Realizability is an invulnerable truth. You want them to leave understanding that Functionalism is a hypothesis about how to define mental states that solves the Multiple Realizability problem for Identity Theory, but it comes with its own costs and debates. By flagging these live fights, you protect yourself from teaching contested claims as settled facts, which is crucial for your credibility and their intellectual honesty.

  To finish, you need one question that tests whether they understand the role versus occupant distinction rather than just parroting vocabulary. Do not ask them to define Functionalism. Instead, ask them this: If neuroscience discovers that every single creature capable of feeling pain uses exactly the same neural structure, does that prove Type Identity Theory is true and Functionalism is false? The correct answer is no, because Functionalism claims that pain is defined by the role, so even if only one occupant happens to exist, the definition of the state remains functional rather than physical. This tests whether they grasp that Functionalism is a claim about the nature of the kind, not just a prediction about diversity. If they say yes, they have conflated Functionalism with Multiple Realizability as an empirical claim rather than a conceptual analysis. If they say no, they understand that Functionalism defines pain by what it does, not by what realizes it, even if only one thing ever does realize it. This question forces them to separate the motivation for the theory from the definition of the theory itself.

  Finally, you should keep your own notes on the settled versus live distinctions handy in case they push back. It is settled that Multiple Realizability was the primary motivation for the shift from Identity Theory to Functionalism in the twentieth century. It is not settled whether Multiple Realizability successfully refutes Identity Theory without undermining mental causation, nor is it settled whether psychological kinds are in fact multiply realized in the actual world. By keeping these distinctions clear, you avoid presenting a simplified history as current metaphysical truth. You are there to help them navigate the arguments, not to give them the final answer key to the mind-body problem, and acknowledging the live debates models good philosophical practice for them. If you stick to this sequence, starting with Identity Theory, using the clock to illustrate realization without consciousness, introducing Role versus Occupant as the solution, and explicitly bracketing the consciousness questions, you should be able to correct both the dualist confusion and the strong AI confusion within the fifty minutes.
