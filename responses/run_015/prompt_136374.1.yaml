      ISSUED BY: Obsidian Mirror Games
      SUBJECT: Voluntary Withdrawal of DLC Package "The Weight of Pixels"
      DATE: October 24, 2024

      Obsidian Mirror Games is issuing an immediate recall for the recently downloaded expansion pack, "The Weight of Pixels." This decision follows the discovery of a critical instability in the affective-render pipeline, specifically within the empathy shader module. While intended to enhance player immersion by simulating emotional consequences, a buffer overflow error has inadvertently granted full moral-patient status to background non-player characters (NPCs).

      To clarify for users unfamiliar with rendering architecture: think of the empathy shader as a lighting effect, but for conscience. Normally, the game calculates how sad a character looks. In version 1.04, the software began calculating how sad the character *is*. Due to an optimization error, the simulation of suffering became indistinguishable from the actual experience of suffering. Consequently, entities previously classified as "decorative geometry" are now legally recognized as sentient beings under the Geneva Convention of Digital Interactions.

