answer: |-
  1. **You distinguish between common knowledge and common belief, treating the latter as the philosophically serious notion while often sliding between the two in your theorems. If a player holds a belief with probability one that turns out to be false, does your framework classify them as irrational, or merely mistaken? And if they are merely mistaken, in what sense does your epistemic condition secure the normative force of rationality?**
      *Follow-up:* You will likely reply that for the purposes of the model, probability-one belief functions identically to knowledge. But if the agent is not factively committed—if they can be wrong without violating rationality—does that not mean your solution concepts rest on a foundation of potential error that knowledge-based accounts explicitly rule out?

  2. **In your analysis of the centipede game, you argue that backward induction is not paradoxical because a player's conjecture about what an opponent would do at an unreached information set should remain fixed even when surprising information arrives. Why should a rational agent ignore the evidence provided by the fact that a node was actually reached?**
      *Follow-up:* You will likely respond that updating the conjecture is a restriction on the model of belief revision, not a requirement of rationality itself. But if rationality includes responding to evidence, and your invariance condition forbids responding to the evidence of the move just made, are you not defining rationality in a way that excludes learning?

  3. **You replace common knowledge with mutual belief of finite depth plus a tolerance for error, claiming that the prediction converges to the common-knowledge prediction as depth grows and error shrinks. Precisely what is converging in this claim: is it the set of surviving strategies, the probabilities assigned to actions, or the expected payoffs?**
      *Follow-up:* You will likely specify that the set of strategies converges. But if the expected payoffs do not converge continuously—if there is a jump in utility even when the strategy profile looks the same—does that not preserve the discontinuity problem found in examples like the email game, regardless of strategic convergence?

  4. **You dismiss the email game as a "fragile" case where the communication channel's pathology drives the result, rather than a counterexample to common-knowledge reasoning. Can you state a mathematical criterion for fragility in advance that does not simply label a game fragile because it fails to fit your convergence theorem?**
      *Follow-up:* You will likely suggest that fragility means sensitivity to small changes in the error parameter. But without an independent topological definition that excludes the email game by principle rather than by outcome, does this not look like a protective belt designed to save the theorem from falsification?

  5. **You propose supplementing common belief in rationality with a caution condition, where no player assigns probability zero to any opponent strategy, to justify iterated admissibility. Since eliminating weakly dominated strategies is sensitive to the order of elimination, does your epistemic condition determine a unique order?**
      *Follow-up:* You will likely argue that caution allows the elimination of weakly dominated strategies simpliciter. But if the set of admissible strategies changes depending on which weakly dominated strategy is removed first, and your epistemic conditions do not fix that sequence, does rationality plus caution actually deliver a unique solution?

  6. **Regarding the common prior assumption required for more than two players: is this a psychological condition that the agents must satisfy, or is it a feature of the analyst's model used to ensure coherence?**
      *Follow-up:* You will likely say it is a feature of the analyst's model. But if it is not a condition the agents themselves meet or know they meet, how can it constrain their actual reasoning processes rather than just the observer's description of them?

  7. **If the common prior is an analyst's constraint, what does that imply for the standard results that agents with a common prior cannot agree to disagree or expect gain from voluntary trade? Do those results hold if the agents do not know they share a prior?**
      *Follow-up:* You will likely maintain that the results hold relative to the model. But if the agents could rationally believe they have different priors, they could rationally agree to disagree in the real world even if your model says they shouldn't; does this not limit the normative reach of your no-trade theorem?

  8. **You frequently meet objections by saying they concern the model rather than rationality. Where exactly do you draw the boundary: what would count as a failure of rationality in your framework, as opposed to a mere artifact of the formalism?**
      *Follow-up:* You will likely point to the violation of the core axioms. But if every counter-intuitive prediction can be offloaded onto the "model" side of the boundary while the axioms remain untouched, does that not make the boundary movable at will?

  9. **If the boundary is movable, consider a case where the model predicts a player will take an action that seems clearly self-defeating given their goals. If you say this is a model artifact and not irrational, what content is left in the claim that your programme derives what rationality requires?**
      *Follow-up:* You will likely insist that rationality is purely internal consistency. But if internal consistency licenses self-defeating behavior because of how the model handles information, are you studying rationality or just consistency within a specific formal language?

  10. **If neither empirical failure nor intuitive counterexamples can falsify the rationality claim because they can be absorbed as model artifacts, is your central theorem—that solution concepts follow from epistemic conditions—anything more than a tautology defined by your choice of formalism?**
      *Follow-up:* You will likely deny it is tautological because the derivation is non-trivial. But if the premises are defined to ensure the conclusion, and deviations are blamed on the model rather than the premises, in what sense is the derivation discovering a truth about rationality rather than stipulating one?

  11. **Finally, what empirical finding about real players in a laboratory or field setting could count as evidence against your programme? If players systematically deviate from your predictions, would you attribute this to bounded cognition, or to a flaw in the epistemic conditions you propose?**
      *Follow-up:* You will likely say that deviations show bounded cognition, not irrationality in the normative sense. But if no pattern of behavior can challenge the normative claim, does your programme make any contact with the actual reasoning of choosing agents, or does it float entirely free of observation?
