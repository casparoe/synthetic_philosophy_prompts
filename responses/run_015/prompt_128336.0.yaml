  1. The classic objection is that an archive isn't neutral—it's a narrative built by whoever decided what to keep and what to bin. You'd probably say your cross-referencing fixes this, but what if all three archives share the same blind spot? Doesn't that just amplify the original bias rather than cancelling it out?

  2. With this shadow-source triangulation, you're measuring gaps to find cover-ups. But isn't choosing which gaps to measure just as subjective as choosing which documents to read? You'd say the method is rigorous, but how do we know your narrative bias isn't just hiding in the silences you've decided to measure?

  3. Hayden White argued that the moment you impose a narrative structure—emplotment—objectivity is dead. Are you arguing he's wrong about the storytelling ruining things, or are you saying the facts are so solid they survive the storytelling? Because those are two very different defences.

  4. Bringing Ranke back feels like swimming upstream against the last fifty years of theory. Your defence will be that we need truth, but isn't claiming to show 'how it actually was' a bit arrogant when we know our own perspective shapes the view?

  5. Your method distinguishes between accidental gaps and cover-ups. But how do you rule out simple incompetence? If three clerks were all equally rubbish at filing, your method might flag a conspiracy where there was just chaos. How do you separate malice from mess?

  6. E.H. Carr said facts are like fish in the ocean; you only catch what you go after. You admit choosing sources frames things, so where's the line between your 'framing' and Carr's cynicism? At what point does framing become distortion?

  7. If you use this triangulation method, does the reader just have to trust you've done it right? Or is there a way for them to check your working out without digging through three archives themselves? If it's not verifiable, is it really science?

  8. Even if we can't be perfectly objective, is chasing it actually useful? Or does it stop us from admitting our own perspective, which might be more honest? Why not just own the bias instead of trying to triangulate it away?

  9. Do you reckon this method could become standard, or is it too much hard graft for most historians? And if it's too hard, does that just make objectivity a luxury item for well-funded research centres whilst the rest of us stumble on?
