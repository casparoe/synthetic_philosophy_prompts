      *   **Task:** Rank potential attack vectors (Subject-summing, Quality/palette mismatch, Grain problem, Dissolution, Other). Defend the ordering based on upstream impact, tractability for a solo researcher, and potential for moving the dialectic.
      *   **Specific Question:** Is Dissolution distinct from Summing (run backwards)?
      *   **Constraint:** Distinguish between settled consensus and contested camp positions regarding claims like "Combination = Hard Problem," "Refutes Panpsychism," or "Russellian Monism dissolves it."

