      *   *Dissolution:* The user's intuition. If subjects combine, can they un-combine? Split-brain cases are tricky. Are there two subjects or one divided subject?
      *   *Tractability:* 18 months is short for a *definitive* solution to a century-old problem, but enough for a strong paper or two shifting the burden of proof.
      *   *Consensus:* There is very little consensus. Most agree it's a problem. Few agree on the solution. Some think it's fatal (McClelland, Goff sometimes leans this way before pivoting to cosmopsychism), some think it's solvable (Coleman, Roelofs).
      *   *Hard Problem vs. Combination:* Distinct but related. Hard Problem: Physical $\rightarrow$ Phenomenal. Combination: Micro-Phenomenal $\rightarrow$ Macro-Phenomenal.
