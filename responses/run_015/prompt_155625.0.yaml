answer: |-
  This is a sharp proposal. You have identified a genuine asymmetry in the literature: the combination problem is almost exclusively framed as a problem of *generation* (how do many become one?), but conscious unity is empirically fragile (how does one become many, or none, without ontological loss?).

  Here is the breakdown you asked for, ranked by strategic value for an 18-month solo postdoc, followed by the consensus/contested map.

  ### Part 1: Is Dissolution Distinct from Summing?

  **Verdict:** It is distinct, but only if you reject a purely mereological model of subjecthood.

  If subjects combine like bricks in a wall (classical mereology), then dissolution is just summing run backwards. If $A + B = C$, then removing $A$ leaves $B$. However, most panpsychists (Coleman, Roelofs, Goff) agree that macro-subjects are not mereological sums of micro-subjects in the standard sense, because that leads to the "overcounting" objection (there would be billions of subjects in my head, not just one).

  If macro-subjects are *emergent* or *constituted* via a specific structural relation (e.g., phenomenal bonding), then fission (dissolution) is not the inverse of fusion. Fusion requires establishing a relation; fission requires breaking it while maintaining the relata.

  **Why this matters for you:** If you can demonstrate that the leading solutions to the *summing* problem (e.g., Phenomenal Bonding, Constitutive Holism) cannot account for *dissolution* without implying the death of micro-subjects (which panpsychism forbids) or the creation of new ones (which violates conservation/continuity), you have found a leverage point. You aren't just asking "how do they combine?" You are asking "what preserves the identity of the parts when the whole breaks?"

  ### Part 2: Ranking the Attack Vectors

  For a solo researcher with 18 months, you need high leverage (affects the whole dialectic) and high tractability (conceptual analysis rather than empirical integration).

  **1. The Dissolution Problem (Your Candidate)**
  *   **Rank:** 1st (Primary Target)
  *   **Upstream Impact:** High. Any viable theory of combination must be reversible or account for asymmetry. If a theory explains summing but implies subjects cannot split (or split only via destruction), it fails to match the phenomenology of split-brain cases or sleep.
  *   **Tractability:** High. This requires conceptual analysis and engagement with specific cases (split-brain, DID, anesthesia). You do not need to build a positive theory of combination; you only need to show that existing positive theories fail the dissolution test. This is a "burden-shifting" project, which is more feasible in 18 months than a constructive one.
  *   **Strategic Value:** It is under-defended. Most opponents attack summing. If you show that even *proponents'* solutions fail dissolution, you force the field to expand the criteria for a solution.

  **2. Subject-Summing (The Standard Formulation)**
  *   **Rank:** 2nd (The Anchor)
  *   **Upstream Impact:** Maximum. This is the core.
  *   **Tractability:** Low. This is the "hard problem" of panpsychism. Thousands of pages exist. To make headway here solo, you usually need a radical metaphysical shift (like Cosmopsychism).
  *   **Strategic Value:** Use this as context. Your argument should be: "We cannot solve Summing until we account for Dissolution." Do not try to solve Summing directly; try to show that Dissolution constrains the solution space for Summing.

  **3. The Boundary Problem (Closely Related to Dissolution)**
  *   **Rank:** 3rd
  *   **Upstream Impact:** Medium-High. Why is *this* collection of micro-experiences *me* and not *you*?
  *   **Tractability:** Medium. Often collapses into the Summing problem.
  *   **Strategic Value:** If you work on Dissolution, you will inevitably hit the Boundary Problem (when does a split become two subjects?). I recommend subsuming this under Dissolution rather than treating it separately to save time.

  **4. Quality/Palette Mismatch**
  *   **Rank:** 4th
  *   **Upstream Impact:** Medium. Even if subjects combine, how do micro-qualia (proto-experience) make macro-qualia (redness, pain)?
  *   **Tractability:** Low. Requires a theory of phenomenal quality which is as contentious as subjecthood.
  *   **Strategic Value:** Secondary. If there is no subject to *have* the quality, the quality mismatch doesn't matter. Solve subjecthood first.

  **5. The Grain Problem**
  *   **Rank:** 5th
  *   **Upstream Impact:** Low-Medium. Concerns the structural mismatch between neural processing and phenomenal unity.
  *   **Tractability:** Medium-High (empirical engagement).
  *   **Strategic Value:** Too empirical for a metaphysics-focused 18-month sprint unless you have a specific neuroscientific collaboration. It risks becoming a "science of consciousness" project rather than metaphysics.

  ### Part 3: Consensus vs. Contested Claims

  You asked for clarity on what is settled. In the metaphysics of consciousness, **very little is settled.** The following distinctions are crucial for your literature review and framing.

  **1. "The Combination Problem is just the Hard Problem restated."**
  *   **Status:** **Contested / Generally Rejected by Panpsychists.**
  *   **The Lay of the Land:** David Chalmers distinguishes them. The Hard Problem is Physical $\rightarrow$ Phenomenal. The Combination Problem is Micro-Phenomenal $\rightarrow$ Macro-Phenomenal.
  *   **The Trap:** Physicalists often conflate them to argue that panpsychism gains no ground (you still have an explanatory gap, just one step earlier). Panpsychists argue the gap is narrower because we have direct acquaintance with the base (consciousness).
  *   **Your Move:** Do not treat them as identical. If you argue they are the same, you inherit the intractability of the Hard Problem. If you argue they are distinct, you keep the combination problem solvable in principle.

  **2. "The Combination Problem refutes Panpsychism outright."**
  *   **Status:** **Contested.**
  *   **The Lay of the Land:** This is the dominant *physicalist* critique (e.g., Sean Carroll, Philip Goff *in some moods*, Eric Schwitzgebel). However, leading panpsychists (Sam Coleman, Luke Roelofs) explicitly deny this, arguing it is a technical hurdle, not a refutation.
  *   **Consensus:** There is consensus that it is the *primary* objection. There is no consensus that it is fatal.
  *   **Your Move:** Frame your work as testing the "fatality" claim. If Dissolution shows that combination requires mechanisms that violate other panpsychist tenets (like the fundamental nature of subjects), *then* it becomes a refutation.

  **3. "Russellian Monism dissolves the Combination Problem."**
  *   **Status:** **False / Contested.**
  *   **The Lay of the Land:** Russellian Monism (RM) is the *framework* that motivates panpsychism (physics describes structure/categorical bases, consciousness is the intrinsic nature). RM explains why matter *has* experience. It does **not** explain how micro-experiences *combine*.
  *   **The Trap:** Many graduate students conflate RM with a solution to combination. It is not. Goff's move to Cosmopsychism was specifically because RM + Constitutive Panpsychism failed to solve combination.
  *   **Your Move:** Be precise. RM solves the "Hard Problem" (mostly), but leaves the "Combination Problem" untouched. This is a crucial distinction for your introduction.

  **4. "Micro-subjects are distinct existences."**
  *   **Status:** **Contested (The Crux).**
  *   **The Lay of the Land:** The Combination Problem assumes micro-subjects are distinct entities that need bridging.
  *   **The Shift:** Some (Cosmopsychists, Priority Monists) deny this. They argue the macro-subject is fundamental and micro-subjects are derivative fragments.
  *   **Your Move:** If you stick to Constitutive Panpsychism (micro $\rightarrow$ macro), you must accept distinct micro-subjects. If you explore Dissolution, you might find that the only way to solve it is to abandon constitutive panpsychism for priority monism. This is a potential "killer conclusion" for your project.

  ### Strategic Recommendation for 18 Months

  **The Goal:** Do not try to solve the Combination Problem. Try to show that **Dissolution is the stricter constraint.**

  **The Argument Arc:**
  1.  **Premise:** A viable theory of consciousness must account for the fragility of unity (sleep, split-brain, anesthesia).
  2.  **Observation:** Current solutions to the Summing Problem (Phenomenal Bonding, etc.) focus on stability and generation.
  3.  **Argument:** These solutions fail to explain Dissolution without violating the conservation of subjects or implying subject death.
  4.  **Conclusion:** Therefore, the Combination Problem is harder than currently modeled; it is a "Combination-and-Decomposition" problem.
  5.  **Implication:** This favors models where macro-subjects are fundamental (Cosmopsychism/Priority Monism) over models where they are constructed (Constitutive Panpsychism).

  **Why this works for a Postdoc:**
  *   It is negative results-heavy (showing what *doesn't* work), which is faster than building a new system.
  *   It uses your specific insight (Dissolution) as the wedge.
  *   It positions you as someone who refined the problem, even if you don't solve it.
  *   It allows you to engage with the big names (Goff, Coleman, Chalmers) without needing to out-metaphysic them on their home turf (Summing).

  **One Warning:** Be careful with the "Split-Brain" literature. There is significant debate in empirical philosophy of mind about whether split-brain patients have *two* subjects or *one* divided subject. (See: Elizabeth Schechtel's work). If you assume they have two, physicalists will attack the premise. Frame it conditionally: "If split-brain cases involve dissolution of unity, then..."

  **Final Consensus Check:**
  *   **Settled:** Combination is the main objection to constitutive panpsychism.
  *   **Settled:** Russellian Monism does not automatically solve Combination.
  *   **Contested:** Whether Combination is fatal.
  *   **Contested:** Whether Dissolution is distinct from Summing. (This is your opening).

  If you can defend the distinctness of Dissolution, you have a publishable contribution that shifts the dialectic, regardless of whether panpsychism survives.
