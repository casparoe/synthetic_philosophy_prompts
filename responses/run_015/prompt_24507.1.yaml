      *   **Statistical vs. Structural:** Distinguish $P(A,B)$ from the graph structure.
      *   **Modeling the Presumption:** Structural uncertainty (priors over graphs), not just parameter uncertainty.
      *   **Failure Modes:** Testimony (collusion), Diagnosis (physiological linkage), Science (shared background assumptions).
      *   **Defeat:** When correlation exceeds expectation or mechanism is shared.
      *   **Conclusion:** It's a bet on the complexity of the world.

  9.  *(Self-Correction on "Conditional Independence")*: I need to be careful. In Bayesian confirmation, we usually look at Likelihood Ratios. If $E_1, E_2$ are conditionally independent given $H$, $P(E_1, E_2 | H) = P(E_1 | H)P(E_2 | H)$. But they must *also* be conditionally independent given $\neg H$. If they correlate under $\neg H$ (e.g., both tests give false positives due to the same interference), the confirmation is overstated. I need to mention both sides of the conditional.

