answer: |-
  **My verdicts, compressed**
  You accept belief only when action exceeds utility. You see shared burial norms but deny afterlife tool usage unless exceptions prove the rule. You reject house orientation as practical, despite Priya's constraint objection. You deny fertility cults from figurines but accept ritual destruction from bent swords. You accept administrative reality from sealings but deny office status from grave seals. You see motif degradation as loss of meaning. You trust text-artifact matches cautiously and reject negative evidence from preservation. Your rule tries to codify "excess cost" but fails on non-economic cases and struggles with physical constraints.

  **Clause by clause**
  Your "Surplus Rule" is close but needs sharpening to handle Priya's objection and the text problem. I propose the "Arbitrary Cost Rule."

  Clause 1: Physical Contingency. A feature implies belief only if physics allows alternatives. This solves Case 3 versus Case 1. Hearths require specific airflow; bodies do not. If physics dictates the form, it is technology. If physics allows variation (head west versus east) but humans enforce consistency, it is normativity.

  Clause 2: Functional Sacrifice. Belief requires wasting value. This distinguishes Case 6 from Case 5. Discarding a cheap figurine costs nothing; bending a usable sword destroys capital. Ritual is defined by what you break, not what you keep. If an object retains utility, assume habit. If it is disabled, assume belief.

  Clause 3: Contextual Independence. Evidence must hold across domains. This fixes Case 10 and Case 8. A seal in a grave might be jewelry; a seal in an admin room is a tool. Texts describe ideals, not behavior. Unless jars appear without the text, the text contaminates the inference. Belief is only secure when artifacts speak without authoritative translation.

  **New cases**
  First, consider the little fish badges on cars today. They are arbitrary (physics doesn't require them) and reproduced, but they cost almost nothing. My rule verdicts this as identity signaling, not deep cosmology. A future archaeologist might infer group affiliation, but not religious belief, because removing the badge carries no social penalty and no economic loss.

  Second, imagine infants buried under house floors rather than the community cemetery. This violates the "centralized dead" norm and carries high emotional cost. Verdict: yes, belief in ancestral protection or domestic spirituality. The physical placement is contingent, and the sacrifice is significant.

  Third, polished stone axes found in bogs, never sharpened. High labor cost, zero utility, physically contingent placement. Verdict: yes, votive offering. Unlike the figurines, these represent invested labor destroyed by context. The rule confirms belief where labor is expended without return.

  **Casualties**
  This rule sacrifices two of your verdicts. First, Case 10 must go. You felt confident matching jars to the king's inscription, but Clause 3 kills this. Texts are propaganda; jars matching texts might just be elite performance, not genuine religious uptake. Priya was right to distrust the independence of that evidence.

  Second, I overrule your skepticism on Case 1. You denied the awl implied afterlife belief. But Clause 1 shows the orientation is physically arbitrary. Consistent arbitrariness *is* belief, even if we don't know the content. You don't need to know *why* they did it to know it wasn't practical. Keep Case 6, drop Case 10, and tighten Case 1.

  **Bottom line**
  Archaeology cannot recover private thought, only normative behavior. You infer belief when people consistently choose arbitrary, costly actions over practical ones.
