answer: |-
  **TO:** The Fellowship Committee
  **FROM:** Dr. Elena Vasquez
  **DATE:** October 14, 1998
  **RE:** Project Proposal: Administrative Invisibility

  Look, David, I'm going to skip the preamble about institutional excellence. You know my work, and you know I'm not going to waste the committee's time with fluff. I'm writing this because I'm tired. Honestly, I think most of us are. I'm sick of the word "collapse." It's overused. It's become a catch-all bucket for anything we don't understand about transition periods, and it carries too much baggage. It implies death. It implies an end.

  I'm applying for the six-month fellowship to pitch a project I'm calling "Administrative Invisibility."

  Here's the core question: **How do we distinguish between actual population disappearance and the cessation of centralized record-keeping and monumentality?**

  The standard models—ecological overshoot, systems theory, resource depletion—they're good at explaining why the top falls off. They explain why the palace burns or the quarry goes silent. But they don't settle whether the people disappeared or just reorganized. When the scribes stop writing Linear B in the Late Bronze Age, did the Mycenaeans vanish, or did they just stop paying taxes to a central vault? When the statue carving halted on Easter Island, did the society crash, or did they just stop investing labor in stone heads? When the Maya left the Southern Lowlands, was it extinction, or a migration to where the limestone didn't require such heavy infrastructure?

  Current literature treats the lack of monuments as a lack of people. I think that's a projection of our own bias toward the visible. We see silence and assume death. I want to argue that societies don't die; they just stop leaving the specific traces we've trained ourselves to look for. They become administratively invisible.

  **Methodology**
  I'm not asking for excavation funds. You can't dig a concept, and six months isn't enough for fieldwork anyway. This is a comparative case study based on existing data. I plan to spend the fellowship period in the library stacks and on the microfiche readers, synthesizing reports that are currently sitting in silos.

  I'm looking at three cases:
  1.  **Late Bronze Age Aegean:** The loss of Linear B script.
  2.  **Rapa Nui:** The halt of *moai* production.
  3.  **Classic Maya:** The abandonment of the Southern Lowlands.

  I want to cross-reference the "collapse" dates with non-monumental data. Pottery networks that continue despite palace destruction. Dietary isotopes that show continuity in population even when the stelae stop getting erected. Settlement patterns that shift from dense urban centers to dispersed hamlets. The data exists, but it's scattered across regional journals and old site reports. I need the time to pull the threads together without teaching load or committee meetings.

  **Expected Results**
  By the end of the six months, I intend to produce a manuscript draft for a monograph. But more than that, I want a framework. I want to produce a checklist for archaeologists to use before they declare a "collapse." If we can detect continuity through household ceramics or bone chemistry, we need to stop writing obituaries for cultures that just moved house or stopped keeping receipts. The result isn't just a history of these three places; it's a methodological correction for the field.

  **Risk Assessment**
  I need to be honest about the timeline. Six months is tight for a comparative study across three distinct regions. The biggest risk is data incompatibility. The isotopic data for the Maya might not be comparable in resolution to the pottery seriations for the Aegean. I might find that the evidence is too fragmented to make a universal claim.

  There's also the risk of getting bogged down in one case. The Maya literature alone could swallow the whole fellowship. I need to discipline myself to treat these as examples, not exhaustive histories. If I can't prove continuity in all three, I need to be willing to publish the failure. If the data shows actual population decline in one case and reorganization in another, that's still a result. It proves "collapse" isn't a single phenomenon.

  I know this sounds theoretical, but it changes where we dig. It changes who we think matters—the farmers instead of the kings. I think you'll agree that's worth half a year of quiet work.

  I'll fax over the budget breakdown tomorrow. Let's grab coffee next week when you're back from the dig site.

  Best,

  Elena
