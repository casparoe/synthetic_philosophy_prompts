answer: |-
  First, a quick housekeeping note: you spelled it "promissary" in your notes, but the correct adjective is **promissory** (one 's', double 's' in the middle). It's a common slip, but if you're writing a grant proposal, you'll want that clean.

  You and your roommate are rehearsing the classic debate between **Conventionalism** (Hume/Sheinman: promises are social tools) and **Voluntarism/Normative Power** (Shiffrin/Thompson: promises are moral primitives). But your three clusters identify where that debate actually bleeds into unresolved metaphysics.

  Here is the ranking based on **strategic upstreamness**. I am defining "upstream" not just as "metaphysically prior," but as "the bottleneck that determines the solvability of the others." If you solve the first one, the others either dissolve or become significantly easier.

  ### 1. The Collapse Cluster (Practice Dependence)
  **The Question:** *Is the social practice a constitutive condition of the promise, or merely the medium through which it is expressed?*

  **Why it ranks first:**
  This is the ontological switch. If promissory obligation *requires* a background social practice (Conventionalism), then "Normative Power" (Cluster 2) is indeed just fancy language for expectation management, and "Extensions" (Cluster 3) to non-social agents (AI/animals) are category errors. If obligation *survives* the collapse of practice (Naturalism), then Normative Power is real, and Extensions become conceptually possible.
  *   **Tractability (High):** This is ideal for a solo conceptual philosopher. You don't need data; you need rigorous thought experiments. (e.g., *The Last Two Humans*: If the last two people on earth promise to meet at dawn, and one dies, was the promise broken? There is no "society" left to harm, no expectation to violate. If obligation remains, practice isn't necessary.)
  *   **Impact (High):** This matters immensely for **smart contracts and digital law**. If code executes a "promise" in a decentralized space with no shared normative background, does legal enforceability track moral obligatoriness? If practice is necessary, blockchain "contracts" are metaphorical only.
  *   **Neglect (Medium):** While "practice dependence" is discussed, the *post-catastrophe/digital* angle is under-theorized. Most literature assumes a functioning state/society.

  ### 2. The Normative Power Cluster (The Mechanism)
  **The Question:** *Does "invoking a normative power" explain bindingness, or does it merely label the intuition that bindingness exists?*

  **Why it ranks second:**
  This is the engine, but it is currently stalled. The "deep moral disagreement" angle you mentioned is the key leverage point here. If I promise you something you morally oppose, do I bind you? If normative power is real, I should be able to change your moral landscape. If I can't, the power is limited by shared norms (which loops back to Cluster 1).
  *   **Tractability (Low/Medium):** This is the hardest cluster. It requires dissecting the metaphysics of authority. It is easy to get stuck in semantic circularity ("It binds because I have the power" / "How do you have the power?" / "Because it binds").
  *   **Impact (High):** This is the foundation of **political legitimacy**. Consent theory (the social contract) relies on individuals having the normative power to bind the state. If this power is an illusion, liberal democracy loses its philosophical anchor.
  *   **Neglect (Low):** This is the main battlefield of contemporary promise theory (Scanlon vs. Shiffrin). It is crowded.

  ### 3. The Extension Cluster (Future/Non-Human)
  **The Question:** *Can the conceptual structure of a promise hold without reciprocity or temporal overlap?*

  **Why it ranks third:**
  This is downstream. You cannot know if you can promise a future person or an AI anything until you know if the obligation requires a social practice (Cluster 1) or a specific type of normative agency (Cluster 2). Tackling this first is building a roof before laying the foundation.
  *   **Tractability (Medium):** Easy to generate examples, hard to resolve. Often devolves into debates about the metaphysics of time or AI consciousness rather than promises specifically.
  *   **Impact (Medium):** Relevant for **environmental law** (rights of future generations) and **AI ethics**, but these are niche compared to contract/consent.
  *   **Neglect (High):** Promises to non-humans are very under-theorized, but for good reason: we don't know what a promise is yet.

  ---

  ### What is Overrated?

  **Cluster 2 (Normative Power) is overrated as a starting point.**
  It sounds like the "deep" metaphysical work, but it is currently a stalemate. Philosophers have been trading definitions of "normative power" for 40 years. Without resolving Cluster 1 (whether that power depends on a practice), arguing about the *nature* of the power is often just verbal dispute. It shifts nothing outside seminars because it lacks a decision procedure.

  **Cluster 3 (Extensions) is overrated in terms of urgency.**
  It feels profound ("Can we promise the future?"), but it is often a category error. If a promise requires uptake (communication), promising the dead or the unborn is conceptually incoherent unless you radically redefine "promise." Solving this won't fix contract law or interpersonal morality.

  ### Evidence That Would Reorder the Ranking

  I would move **Cluster 2 to #1** (and recommend tackling it directly) if:
  *   **The Argument:** You could construct a proof that *practice independence is impossible to test.* If every thought experiment about "social collapse" secretly smuggles in social norms (because the philosopher and reader are socialized), then Cluster 1 is a dead end. You would have to tackle the metaphysics of power (Cluster 2) directly to break the circle.
  *   **The Counterexample:** If you found a case of **binding promises without communication**. If I can promise you something without you knowing (a "silent vow" that still binds), Cluster 1 (practice/expectation) collapses entirely. Cluster 2 becomes the only game in town.

  I would move **Cluster 3 to #2** if:
  *   **The Argument:** You demonstrate that **Future People are the *only* valid test case.** If promises to contemporaries are always contaminated by coercion or immediate reliance, but promises to future generations isolate the "pure" obligation, then Cluster 3 becomes the upstream test for Cluster 2.

  ### Recommendation for the Grant

  **Tackle Cluster 1 (Collapse/Practice).**
  It is the most strategic leverage point.
  1.  **It decides Cluster 2:** If you prove practice is necessary, you demystify "normative power" (it's social convention). If you prove it isn't, you vindicate it.
  2.  **It is tractable:** You can use modal logic and thought experiments (Robinson Crusoe, Digital States, Post-Apocalypse) without needing empirical data.
  3.  **It matters:** The rise of algorithmic governance and decentralized autonomous organizations (DAOs) makes the "practice without society" question urgent for legal theory.

  Your roommate is essentially arguing for Cluster 1 (Expectation/Practice). You are arguing for Cluster 2 (Normative Power). Don't fight on her turf (expectations) or yours (abstract power). Fight on the turf of **conditions of possibility**. Show that one of you is right *only if* the social world exists, and the other is right *even if it doesn't.* That is where the grant money should go.
