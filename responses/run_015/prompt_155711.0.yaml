          *   *Standard Critique:* Yes, the "causal impact" version of AAI is often criticized for being too expansive (the "all-affected principle" problem).
          *   *Nuance:* Defenders of AAI often refine it (e.g., "significantly affected," "basic interests," or "institutionalized affectedness"). The summary says it collapses *whenever* climate/trade are at stake because *nearly everyone* is affected *in some degree*.
          *   *Verdict:* This is a standard critique (Whelan, Goodin), but often considered a strawman by AAI defenders who argue for thresholds. It's a *plausible simplification* of the critique, but potentially a *misrepresentation* of the strongest version of AAI.

      *   **Claim 2: Reciprocal Authorization Constraint (RAC) Definition.**
          *   *Definition:* Bound by norms + able to contest/authorize.
          *   *Implication:* Includes long-term residents, excludes visitors/future gens.
          *   *Analysis:* This sounds like a blend of ASP (subjection) and a specific republican/deliberative condition (contestability).
          *   *Verdict:* *Plausible simplification* of a specific theoretical stance (likely drawing on Pettit or similar republican views), but the exclusion of future generations is contentious within ASP/RAC frameworks (some argue for trusteeship).

      *   **Claim 3: RAC = ASP Equivalence.**
          *   *Claim:* RAC is ASP translated from subjection to authorization.
          *   *Analysis:* ASP usually focuses on *coercion* or *subjection to law*. RAC adds *capacity to contest/authorize*.
          *   *Problem:* ASP is often descriptive (are you subject to the law?). RAC adds a normative/functional capacity (can you effectively contest?). A child or a severely disabled person might be "subject" but lack full "authorization/contestatory" capacity. Does ASP exclude them? Usually no. Does RAC? The summary says "lack the standing."
          *   *Verdict:* *Misrepresentation.* ASP is broader. RAC imposes a higher bar (agency/contestability). They are not *identical*.

      *   **Claim 4: Circularity of Democratic Closure.**
