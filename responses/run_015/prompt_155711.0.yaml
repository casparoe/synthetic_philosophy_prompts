          4.  *Equivalence Claim:* RAC is essentially identical to the "All Subjected Persons" (ASP) principle, just rephrased from subjection to authorization.
          5.  *Circularity Charge:* Democratic closure arguments (citizens decide membership) are circular because they presuppose the boundary they try to justify.
