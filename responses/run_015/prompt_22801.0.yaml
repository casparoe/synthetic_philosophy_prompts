answer: |-
  **The Price of Clarity: Scope and Limits of Good's Theorem on the Value of Information**

  In formal epistemology and decision theory, few results possess the seductive elegance of I.J. Good's 1967 theorem on the expected value of information (EVI). The argument is almost tautological in its simplicity: for a rational agent maximizing expected utility, free information can never have negative expected value. The reasoning is that an informed agent can always mimic the uninformed agent's strategy; therefore, the informed agent's optimal strategy must yield at least as much utility in expectation. To a student encountering this for the first time, the proof feels like a revelation of rationality's inherent optimism: truth, or at least data, is never an obstacle to success.

  However, as your intuition suggests, this cleanliness is suspicious. The theorem appears to clash with robust intuitions about "dangerous knowledge," from the self-fulfilling prophecies of Newcomb problems to the strategic liabilities of transparency in game theory. If Good's theorem were a universal law of rationality, these cases would be illusions. If they are genuine counterexamples, the theorem is merely a artifact of a narrow model.

  This essay argues that Good's theorem is neither trivial nor universal. It is a robust normative principle for **causal inquiry in fixed environments**, but it fails when information becomes **constitutive of the decision problem itself**. The theorem does not describe a universal feature of rationality; rather, it delineates the boundary between learning about the world and interacting with it. Its significance lies not in its universality, but in its ability to clarify the specific structural assumptions required for "curiosity" to be costless.

  ### The Standard Argument and Its Hidden Architecture

  To evaluate the threats against Good's theorem, we must first formalize the standard proof and expose its premises. Let $A$ be a set of actions, $S$ a set of states, and $U(a, s)$ a utility function. Let $P(s)$ be the agent's prior credence over states.

  Without information, the agent chooses $a^*$ to maximize expected utility:
  $$ V_{null} = \max_{a \in A} \sum_{s \in S} P(s)U(a, s) $$

  Now, suppose the agent receives a signal $E$ (a partition of $S$ or a random variable correlated with $S$) with realizations $e$. Upon observing $e$, the agent updates to $P(s|e)$ and chooses $a_e$ to maximize conditional expected utility. The expected value of being informed is:
  $$ V_{info} = \sum_{e} P(e) \left[ \max_{a \in A} \sum_{s \in S} P(s|e)U(a, s) \right] $$

  The proof of $V_{info} \ge V_{null}$ relies on the inequality $\sum_e P(e) \max_a (\dots) \ge \max_a \sum_e P(e) (\dots)$. Specifically, for the optimal uninformed action $a^*$, the informed agent could simply choose $a^*$ regardless of the signal $e$. Since the informed agent optimizes instead, they must do at least as well.

  This proof rests on four critical, often implicit, assumptions:
  1.  **Action Stability:** The set of available actions $A$ is fixed and does not change depending on the signal received.
  2.  **Payoff Stability:** The utility function $U(a, s)$ is independent of the information state. The payoff for an action depends only on the action and the state, not on whether the agent knew the state beforehand.
  3.  **Causal Exogeneity:** The signal provides evidence about $S$, but the choice of action $a$ does not causally influence $S$. The probability update is purely evidential regarding pre-existing facts.
  4.  **Privacy of Information:** The "state" $S$ does not include other agents' reactions to the agent's information status.

  When these assumptions hold, the "ignore the signal" maneuver is well-defined and costless. The threats you identified target exactly these assumptions.

  ### The Triad of Threats

  #### 1. Self-Reference and Newcomb Problems
  In Newcomb-style problems, the state of the world (e.g., the Predictor's placement of money) is correlated with the agent's action. This violates **Causal Exogeneity**. In a standard Goodian framework, the signal refines beliefs about a state that is causally independent of the action. In Newcomb problems, the "state" (the prediction) is causally upstream of the action but evidentially dependent on it.

  If an agent receives information about what they are likely to do (or what was predicted they would do), the "ignore the signal" strategy becomes incoherent. To "ignore" a signal that says "You will one-box" might require two-boxing, which retroactively (or evidentially) makes the signal false or the prediction inaccurate, thereby changing the payoff. Here, information is not merely a lens through which to view a fixed world; it is part of the causal or evidential loop that determines the payoff.

  In this context, Good's theorem fails because the expectation calculation changes. For a Causal Decision Theorist (CDT), the theorem might hold if the prediction is treated as a fixed past event, but for an Evidential Decision Theorist (EDT), the act of conditioning on the signal changes the probability of the state *given the action*. The "ignore" option is not available because the agent cannot decouple their decision procedure from the evidence the signal provides about that procedure.

  #### 2. Strategic Settings and Game Theory
  The second threat arises in multi-agent contexts, violating **Payoff Stability** and **Privacy of Information**. In game theory, payoffs depend on opponents' moves. Opponents' moves often depend on their beliefs about your information status.

  Consider a bargaining scenario or a game of Chicken. If I know my own reservation price or commitment level with certainty, I may be forced into a suboptimal equilibrium because I cannot credibly bluff. If I remain ignorant, I might play a mixed strategy that yields a higher expected payoff. More formally, if an opponent knows I have access to a signal, they may adjust their strategy to exploit the correlation between my signal and my action.

  Here, the "state" $S$ effectively includes the opponent's strategy $\sigma_{-i}$. If $\sigma_{-i}$ is a function of my information status, then acquiring information changes the payoff function $U$. The "ignore" maneuver fails because the *availability* of the information has already altered the strategic landscape. The value of information can be negative because information reduces flexibility (the value of commitment) or invites exploitation. This is not a failure of rationality, but a recognition that in strategic contexts, ignorance can be a strategic asset.

  #### 3. Causal vs. Evidential Reasoning
  The third threat concerns the definition of expectation itself. Good's theorem is fundamentally a result within **Causal Decision Theory**. It assumes that the agent maximizes $\sum P(s) U(a, s)$ (or causally conditioned variants). If an agent reasons evidentially, maximizing $\sum P(s|a) U(a, s)$, the linearity of the proof breaks down in correlation-heavy environments.

  If acquiring information changes the agent's evidential relationship to the outcome (as in the Newcomb case), the expected utility of the "informed optimum" cannot be compared simply to the "uninformed optimum" using the standard inequality. The theorem assumes that updating on $e$ is distinct from updating on $a$. When $e$ is highly correlated with $a$ (e.g., a signal about your own brain state), the separation collapses. Thus, the theorem is not neutral between decision theories; it is a theorem *of* CDT (or frameworks that enforce causal independence).

  ### The Verdict: A Local Norm of Causal Inquiry

  We must now reach a verdict. Is Good's theorem a universal principle, a narrow artifact, or something in between?

  **Verdict:** Good's theorem is a **local norm for empirical inquiry within causal frameworks**, not a universal law of rationality.

  It is not "trivially true" because it imposes substantive constraints on the structure of the decision problem (specifically, causal exogeneity and payoff stability). It is not "universally significant" because it fails in precisely those high-stakes domains (strategic interaction, self-referential prediction) where decision theory is most interesting.

  However, calling it an "artifact" is too dismissive. The theorem correctly identifies the conditions under which information functions purely as a **tool**. In standard scientific or empirical contexts—where the world does not react to our knowledge of it, and our actions do not causally determine the past—Good's theorem is a deep and robust fact. It justifies the scientific enterprise: if the world is causally independent of our observations, we should never fear data.

  The significance of Good's theorem, therefore, is diagnostic. It defines the boundary of "standard" decision problems. When the theorem's conclusion (EVI $\ge$ 0) clashes with our intuition (that knowledge could be harmful), it signals that one of the background assumptions has been violated. It tells us we have moved from a problem of *discovery* to a problem of *interaction* or *constitution*.

  ### Defense Against the Strongest Objection

  The strongest objection to this verdict is the **Charge of Fragility**. A critic might argue: "If a theorem about rationality fails in Newcomb problems or Game Theory, it is not a 'local norm,' it is simply false as a general principle. A truly general decision theory should encompass these cases, and if Good's theorem doesn't, it should be discarded as misleading."

  This objection assumes that a principle's value is proportional to its scope. I defend the verdict by arguing that **scope is not the only metric of philosophical significance**. Good's theorem is valuable precisely because it fails in those cases.

  If we attempted to salvage the theorem to make it universal (e.g., by redefining "information" or "utility" to absorb strategic costs), we would lose its explanatory power. The current formulation highlights a crucial distinction: **Information as a Resource vs. Information as a Constraint.**

  In causal, single-agent environments, information is a resource that expands the effective action space (by allowing conditional actions). In strategic or Newcomb-like environments, information can act as a constraint (binding the agent to a predictable pattern). By maintaining Good's theorem in its standard form, we preserve a clear conceptual tool for distinguishing these two modes of engagement with the world.

  To generalize the theorem to cover strategic ignorance would require folding the *cost of being known to be informed* into the utility function. While formally possible, this obscures the insight that the "cost" comes from the *structure of the interaction*, not the information itself. It is better to say Good's theorem holds for the *intrinsic* value of information, while acknowledging that *instrumental* value can be negative due to external structural factors.

  ### Conclusion

  Good's theorem is not a universal guarantee that knowledge is power. It is a rigorous demonstration that knowledge is power *provided the world does not fight back*. The "one-line proof" is clean because it assumes a world where the agent is a passive observer turning into an active operator, without the world reacting to that transition.

  When the world does react—through predictors, opponents, or causal loops—the "ignore the signal" maneuver is no longer a free option. The signal may have already altered the terrain. Thus, the theorem is not a description of rationality simpliciter, but a definition of **rational inquiry**. It tells us that if you find yourself in a situation where information has negative expected value, you are no longer doing simple epistemology; you are doing game theory, metaphysics, or psychology. In those domains, the clean lines of Good's proof blur, but that blurring is not a failure of the theorem. It is the theorem's final, most important lesson: information is only free when it is merely about the world, and not about you.
