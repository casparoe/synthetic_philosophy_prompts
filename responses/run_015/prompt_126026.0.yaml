      *   **Major Conflict:** C1 (Behaviorist/No Internal Character) vs. C2 (Internal Narrative Necessary).
          *   *Why:* C1 explicitly denies the necessity of internal character ("no necessary appeal"). C2 asserts the necessity of an internal self-image ("without that self-image... loses motivational force"). This is a direct contradiction regarding the *mechanism* of the project.
      *   **Secondary Conflict:** C1 (Optimization/Correction) vs. C4 (Perpetual Failure Necessary).
