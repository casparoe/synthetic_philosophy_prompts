      *   **C2 (Reflexive Moral Accounting):** Practice depends on an internal narrative of being a "work-in-progress." Without this self-image, tracking lacks motivation. *Key implication: Internal state/self-conception is necessary for the mechanism to work.*
      *   **C3 (Secular/This-Worldly Justification):** Deism = no transcendent sanction/reward. Justification = social utility, tranquility, peer respect. *Key implication: The telos (end goal) is pragmatic and social, not spiritual.*
      *   **C4 (Structural Failure):** Admission of failure (Order, Humility) is not modesty but a structural feature. Perpetual failure is *necessary* to sustain the narrative of improvement. *Key implication: Success is actually counter-productive to the narrative; failure fuels the project.*
      *   **C5 (Social Construction/Junto):** Moral improvement is collaborative/peer-validated. Internal narrative (from C2) is socially constructed, not privately authored. *Key implication: The "self" in C2 is constituted by the group (Junto), not the individual.*

  3.  **Analyze Pairwise Tensions:**

      *   **C1 vs. C2:**
