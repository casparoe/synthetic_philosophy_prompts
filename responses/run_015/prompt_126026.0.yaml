          *   C2 says the practice *depends* on an "accurate internal narrative... self-image."
          *   *Tension:* C1 tries to bracket out internal character/state as irrelevant to the *definition* of virtue, while C2 claims that internal state is *causally necessary* for the practice.
          *   *Severity:* High. C1 defines the ontology of the project (what virtue *is*), C2 defines the psychology of the project (how it *works*). If virtue is *just* behavior (C1), why does the internal narrative matter (C2)? If the internal narrative matters (C2), is it really just behaviorism (C1)?
          *   *Resolution:* C1 needs weakening. It's not *purely* behaviorist if the internal narrative is a condition of possibility.

      *   **C1 vs. C4:**
          *   C1 says virtue is corrected through iterative monitoring (implying progress toward zero failures).
          *   C4 says perpetual failure is *necessary* to sustain the narrative.
          *   *Tension:* C1 implies the goal is reduction of failure (optimization). C4 implies the goal is the *maintenance* of failure (narrative sustainability).
