  8.  **Final Check:** Does this sound like a tool a journalist can use? Yes, bullet points, clear scripts. Is it empathetic? Yes.

      *(Note on Typos)*: The user said "if there's a typo or two just roll with it." I will aim for high accuracy but not stress if a minor slip happens in my thought process, though the output should be clean.

      *(Wait, one nuance)*: The user says "virtues aren't cross-situationally stable personality traits but context-sensitive regulatory patterns." This sounds a lot like "local traits" (Doris's eventual concession) or "if-then signatures" (Mischel). I need to make sure the reply distinguishes the *normative* element from the *descriptive* psychological element. The "regulatory" part implies control/agency, which is the hook for normativity.

