answer: |-
  **PRE-GAME PREP SHEET: VIRTUE ETHICS & SITUATIONISM**
  **To:** [Your Name]
  **Re:** Thursday Workshop Q&A Strategy
  **Status:** High Stakes / Interdisciplinary Minefield

  You're walking a tightrope. The psychologists think you're too philosophical; the philosophers think you're too empirical. Your goal isn't to knock out an opponent, it's to show that your reconstruction is the only bridge left standing.

  Here is your battle card. Keep this in your pocket.

  ### 1. THE OPENING CONCESSION (Say this early)
  **Do not fight the data.** If you try to defend global character traits (e.g., "Honesty exists across all situations"), the psychologists will eat you alive with the Milgram and Darley & Batson data.
  *   **Say:** "I concede the empirical point: Global, cross-situational consistency is a folk psychological myth. If virtue ethics requires a saint who never slips regardless of context, virtue ethics is dead. I am not here to revive the saint."
  *   **Why:** This disarms the psychologists immediately. You are on their side regarding the *data*.

  ### 2. THE NON-NEGOTIABLE (What you must hold)
  **Normative Authority.** You cannot let your view collapse into pure description. If virtues are just "patterns of behavior," you have written a psychology paper, not an ethics paper.
  *   **Hold:** The claim that these regulatory patterns can be *evaluated* as better or worse relative to human flourishing (eudaimonia), not just frequency of occurrence.
  *   **Why:** If you lose this, the ethicists will say you've capitulated and there's no point in your talk.

  ---

  ### 3. THE DREADED QUESTION (Highest Damage Potential)
  **The Objection (From the Ethicists, supported by skeptical Psychologists):**
  *"You've redefined virtues as 'context-sensitive regulatory patterns.' But that sounds like a description of how people **do** act, not how they **ought** to act. Where is the prescriptive authority? Isn't this just a naturalistic fallacy wrapped in new jargon?"*

  **The 2-Minute Reply:**
  "That's the crux of the reconstruction. I'm not deriving 'ought' from 'is' merely by observing patterns. I'm deriving it from *function*. A 'regulatory pattern' isn't just a habit; it's a cognitive-emotional system aimed at navigating social complexity.
  We can evaluate these patterns normatively based on whether they sustain the agent's agency and social cohesion over time. A pattern of 'honesty-in-context-X' is a virtue not because it's statistically common, but because it supports the kind of reflective agency required for flourishing. Situationism shows we lack global traits; it doesn't show we lack the capacity to cultivate local reliability. The 'ought' comes from the gap between our current fragmented patterns and the integrated regulation we *could* achieve through training. I'm not describing what we are; I'm mapping the machinery we use to become better."

  **Where this is soft:**
  You are leaning heavily on a functionalist definition of "flourishing." If pressed on *who decides* which patterns count as flourishing, you risk sounding like you're smuggling traditional values back in without justification. Be ready to admit that "flourishing" is a contested, evolving target, not a fixed biological fact.

  ---

  ### 4. OTHER LIKELY OBJECTIONS (Ordered by Threat Level)

  #### Objection #2: The "Empty Concept" Charge
  **Voice:** Senior Virtue Ethicist
  **The Objection:** *"If honesty only applies in specific contexts, isn't it just a collection of unrelated habits? You've saved the word 'virtue' by stripping it of the unity that made it useful. What work is this concept actually doing?"*

  **The Reply:**
  "It's doing the work of precision. The traditional view set us up for failure by promising a unity that psychology says doesn't exist. By shifting to 'context-sensitive patterns,' we make moral education tractable. Instead of telling a student to 'be honest' (which is too vague and empirically false), we train them to recognize the specific contexts where honesty regulates social trust effectively versus where it causes gratuitous harm. We aren't losing unity; we are trading a mythical global unity for a practical, local coherence. The work it does is making virtue ethics empirically actionable."

  **Where this is soft:**
  "Local coherence" is vague. They may ask for a concrete example of how two local honesties link up. Have a ready example (e.g., honesty with a friend vs. honesty with a hostile interrogator).

  #### Objection #3: The "Just Behaviorism" Charge
  **Voice:** Experimental Psychologist
  **The Objection:** *"You say 'regulatory patterns,' but my data shows behavior is driven by situational cues, not internal regulation. Aren't you just describing sophisticated stimulus-response mechanisms and calling it 'agency' to make the philosophers happy?"*

  **The Reply:**
  "No, because regulation implies monitoring and adjustment, not just reaction. A stimulus-response model predicts behavior based on the environment alone. My model predicts behavior based on the *interaction* between the agent's goals and the environment. The empirical data shows variance, yes, but it also shows that some agents variance *less* in high-stakes moral situations after training. That delta—the ability to override the situational cue—is the regulatory pattern. It's not behaviorism; it's cognitive control applied to moral norms."

  **Where this is soft:**
  You need to be careful not to overstate the "training" data. If they cite studies showing training fails, you need to acknowledge that regulation is hard and often fails, without conceding that it doesn't exist.

  #### Objection #4: The Measurement Problem
  **Voice:** Both sides (The Pragmatist)
  **The Objection:** *"Global traits were easy to measure (even if they didn't exist). How do you measure a 'context-sensitive pattern'? If you can't measure it, how do you know it's there?"*

  **The Reply:**
  "We measure local consistency, not global. We look for 'if-then' signatures. If Person A acts honestly in Context X and Context Y (where X and Y share relevant moral features), that's a pattern. We stop looking for the person who is honest at the tax office and honest with their spouse and honest in war. We look for the person who recognizes the moral demands of specific domains and regulates accordingly. It's harder to measure, but it's measuring reality, not a phantom."

  **Where this is soft:**
  Defining "relevant moral features" is tricky. Who decides if the tax office and the spouse situation are morally analogous? You risk circularity (they are analogous because the virtuous person treats them alike).

  ---

  ### 5. CLOSING STRATEGY

  **If you get stuck:**
  Pivot to **Moral Education**.
  Both sides care about this. Psychologists want to know how to change behavior; Ethicists want to know how to build character.
  *   **Line to use:** "My view is the only one that offers a realistic curriculum. The traditionalists promise too much (global change); the situationists promise too little (just change the situation). I'm arguing we change the agent's *sensitivity* to the situation. That's a middle ground worth fighting for."

  **Mindset Check:**
  You are not defending Aristotle against science. You are updating Aristotle *using* science. You are the translator. If the room feels hostile, remember: they need each other. The psychologists need the ethicists for the "why," and the ethicists need the psychologists for the "how." You are the "how."

  Good luck. Drink fresh coffee. You've got the middle ground; hold it tight.
