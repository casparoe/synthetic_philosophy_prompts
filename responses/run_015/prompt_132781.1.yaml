prompt: |-
  I'm a journalist who covers science and ideas, and I'm somewhat out of my depth here — next Thursday I'm presenting at an interdisciplinery workshop on moral psychology, defending a reconstructed virtue ethics that absorbs the situationist critique instead of fighting it. My claim is that virtues aren't cross-situationally stable personality traits but context-sensitive regulatory patterns, and that this saves Aristotelian ethics from empirical falsification without reducing it to behaviorism. The audience is split: half are experimental social psycholgists who ran the classic obedience and bystander studies and think 'character' is mostly a folk error, and half are virtue ethicists who worry I'm just capitulating to situationism and stripping away normative force. I need a speaker-prep sheet for the Q&A: the objections they'll actually raise, ordered by likely damage, each phrased the way that side would put it, with a quick reply I can deliver in about two minutes and a note on where that reply is soft. Tell me what I should concede up front — probably that global trait predictions fail — and what I must hold onto for the view to survive. Include the question I'm dreading most, which is probably whether these 'regulatory patterns' are just descriptive clusters with no real prescriptive authority left. I'm writing this between deadlines with cold coffee, so if there's a typo or two just roll with it.
reasoning: |-
  Here's a thinking process that leads to the suggested speaker-prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science/ideas, presenting at an interdisciplinary workshop on moral psychology.
      *   **Topic:** Defending a reconstructed virtue ethics that absorbs the situationist critique (virtues as context-sensitive regulatory patterns, not cross-situationally stable traits).
      *   **Audience:** Split 50/50 between experimental social psychologists (situationists, skeptical of character) and virtue ethicists (worried about losing normative force).
      *   **Deliverable:** A speaker-prep sheet for Q&A.
      *   **Content:** Objections ordered by likely damage, phrased as each side would put them, 2-minute replies, notes on soft spots.
      *   **Specific Requirements:** Include what to concede up front (global trait predictions fail), what to hold onto (normative authority), and address the "dreaded question" (are these patterns just descriptive?).
      *   **Tone:** Professional, strategic, empathetic to the user's stress ("cold coffee," "typo or two").

  2.  **Deconstruct the Philosophical/Psychological Landscape:**
      *   *Situationism (Doris, Harman, etc.):* Empirical evidence (Milgram, Stanford Prison, Darley & Batson) shows behavior varies wildly across situations. Global character traits don't exist. Virtue ethics is empirically false.
      *   *Traditional Virtue Ethics (Aristotle, Hursthouse, etc.):* Virtues are stable dispositions. They provide normative guidance (what *should* we do?).
      *   *User's Position:* A middle ground. Virtues exist but aren't global traits. They are "context-sensitive regulatory patterns." This avoids empirical falsification (because it doesn't claim global stability) but tries to keep normative force (it's not just behaviorism).
      *   *The Tension:* If virtues are just context-sensitive patterns, are they just descriptions of how people *do* act, rather than how they *ought* to act? Do they lose the "normative bite"?

  3.  **Drafting the Prep Sheet - Structure:**
      *   **Header:** Encouraging note, acknowledging the stress.
      *   **Opening Concession:** What to give away immediately to build trust.
      *   **The "Must Hold" Line:** The core non-negotiable.
      *   **The Dreaded Question:** Addressed specifically.
      *   **Objection List:** Ordered by damage potential.
          *   Format: Objection (Voice), Quick Reply, Soft Spot.
      *   **Closing Advice:** Delivery tips.

  4.  **Developing the Content:**

      *   *Opening Concession:* Acknowledge the empirical data. Global traits (honesty across *all* situations) are dead. Don't fight the Milgram data.
      *   *Must Hold:* Normativity. The idea that we can cultivate better patterns. It's not just "this is how humans work," it's "this is how humans work *well*."
      *   *The Dreaded Question:* "Is this just descriptive?" Reply needs to bridge is/ought via teleology or functionalism (patterns that flourish vs. those that don't).

      *   *Objection 1 (The Ethicists):* "You've emptied virtue of content." If honesty only applies in *some* contexts, is it still honesty?
          *   *Reply:* Stability isn't the point; reliability within relevant contexts is.
          *   *Soft Spot:* Defining "relevant contexts" without circularity.
      *   *Objection 2 (The Psychologists):* "Regulatory patterns sound like habits. Where's the agency?"
          *   *Reply:* Patterns involve cognitive monitoring, not just reflex.
          *   *Soft Spot:* Distinguishing from sophisticated behaviorism.
      *   *Objection 3 (Both):* "How do you measure this?"
          *   *Reply:* Local consistency, not global.
          *   *Soft Spot:* Empirical vagueness.
      *   *Objection 4 (The Ethicists):* "Moral Education becomes impossible."
          *   *Reply:* We train context-recognition, not blind rules.
          *   *Soft Spot:* Practical curriculum is hard to sketch.

  5.  **Refining the Tone:**
      *   The user is a journalist, not a philosopher. The language needs to be precise but accessible.
      *   The user is stressed ("cold coffee"). The tone should be calming, confident, and practical.
      *   Acknowledge the typo instruction (I will ensure the text is clean but not obsess over perfectionism in the meta-commentary).

  6.  **Review against Constraints:**
      *   Ordered by likely damage? Yes, start with the normative force challenge (kills the theory) then move to empirical/definition challenges.
      *   Phrased as each side would put it? Yes (Psychologists = empirical/skeptical, Ethicists = normative/conceptual).
      *   2-minute reply length? Keep replies tight (approx. 250-300 words spoken).
      *   Note on soft spots? Crucial for honesty.
      *   Include the dreaded question? Yes.

  7.  **Final Polish:**
      *   Make sure the distinction between "global traits" and "local patterns" is clear.
      *   Ensure the "normative force" argument doesn't slip into naturalistic fallacy territory without acknowledging it.
      *   Add a "Pre-Game" section for mental prep.

      *(Self-Correction during drafting)*: I initially thought about putting the Psychologists' objections first. But the Ethicists' worry (that the theory is empty) is actually more damaging to the *philosophical viability* of the project. If the Ethicists reject it, it's not virtue ethics anymore. If Psychologists reject it, it's just empirically contested. I'll order by "threat to the core thesis." The "Is it just descriptive?" question is the biggest threat, so that goes top or as a special section. The prompt asks for it to be included as the "dreaded question," so I'll feature it prominently.

      *Re-ordering:*
      1. The Dreaded Question (Normativity vs. Description) - Highest Damage.
      2. The Ethicist's "Empty Concept" Objection.
      3. The Psychologist's "Just Habits" Objection.
      4. The "Measurement" Objection (Both).

      *Wait, one more thing:* The prompt asks for "what I should concede up front" and "what I must hold onto." I need to make sure those are distinct sections.

