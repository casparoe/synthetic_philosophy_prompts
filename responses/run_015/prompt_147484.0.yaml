answer: |-
  # Q&A Preparation Sheet: Reformulated Longtermism

  ## Part 1: Objections Ordered by Expected Damage

  ### 1. The Substitution/Displacement Objection (Public Finance / Climate Econ)
  **The Objection:** "You argue that building an institution now yields a stream of benefits for 100 years. But institutions are endogenous. If you don't build it now, the demand for that function doesn't vanish; it accumulates. Someone else builds a substitute in thirty years. Your 'durable good' isn't adding a century of value; it's just displacing the start date of a good that would have existed anyway. You're claiming credit for the *duration*, but you haven't shown you've increased the *stock* net of counterfactual provision. Isn't durability just a claim about timing, not marginal value?"

  **The Reply (2 mins):** "I hold on the marginal value claim, but I concede the burden of proof is on the counterfactual. The substitution argument assumes the *quality* and *path-dependence* of the institution are invariant to timing. They are not. An institution established today shapes the incentives and constraints of the intervening thirty years, altering the trajectory of the system that eventually demands the substitute. Think of it as 'lock-in of the trajectory,' not just 'provision of the service.' If I establish a norm against X now, I prevent the accumulation of X-capital that would make the future institution more expensive or different to build. The value isn't just the service flow; it's the avoidance of the degradation that happens in the waiting period. However, you are right that this requires a model of path dependence, not just a depreciation schedule."

  *   **Concede or Hold:** Hold on the core thesis (path dependence creates marginal value), Concede on the need for a counterfactual model.
  *   **Softest Point:** You have no empirical measure of "path dependence." If pressed on how to quantify the difference between "built now" vs. "built in 30 years," you have to rely on theory, not data.

  ### 2. The Identification Objection (Development Economists)
  **The Objection:** "You treat 'durability' as a structural parameter, $\delta$, the depreciation rate of the good. But in our data, persistence is a reduced-form outcome confounded by repeated treatments, selection, and exogenous shocks. When we see an effect lasting 10 years, is that because the good is durable, or because the environment hasn't changed? You haven't given us an estimand. 'Durable' risks becoming a label for 'effects we can't explain away with time-varying heterogeneity.' How do you identify $\delta$ separately from the persistence of the shock itself?"

  **The Reply (2 mins):** "I concede that 'durability' is not currently a standard estimand in micro development, and I am not proposing we can point-identify $\delta$ with current RCT designs. I am arguing for a shift in the *accounting framework*, not claiming we have the measurement tools ready today. Think of it like total factor productivity (TFP) in the 1950s: a residual that demanded a new measurement agenda. My proposal is to treat the decay of treatment effects not as 'external validity failing' but as 'depreciation occurring.' We identify it via survival analysis of interventions, not just mean effects at endline. I am asking you to model the *service life* of the intervention, not just the intent-to-treat at $t=1$."

  *   **Concede or Hold:** Concede on the lack of current identification strategy; Hold on the theoretical validity of the category.
  *   **Softest Point:** If they press, "Without an estimator, this is just a story," you have no defense other than "it's a research agenda." It risks sounding like you are rebranding measurement error as durability.

  ### 3. The Discounting Objection (Public Finance / Climate Econ)
  **The Objection:** "You say we should amortize benefits over service life and treat the discount rate as an estimation object. But mathematically, extending the horizon of benefits while keeping the discount rate fixed looks exactly like lowering the social discount rate. You're smuggling in a low $\rho$ under the name of 'durability.' Furthermore, under uncertainty about future growth rates, standard asset pricing suggests we should be *more* impatient (higher effective discount rate) to account for risk, not less. Why does durability override the precautionary motive for impatience?"

  **The Reply (2 mins):** "I hold that these are distinct parameters. The discount rate ($\rho$) reflects social preference and consumption smoothing; the depreciation rate ($\delta$) reflects the physical or institutional decay of the asset. Confusing them is an accounting error. If I build a dam that lasts 100 years, amortizing the cost over 100 years isn't 'impatience' or 'patience'; it's matching cost to benefit flow. Regarding uncertainty: growth uncertainty affects the *value* of the future flow, but not the *existence* of the durable good. A norm that survives a recession is still a surviving norm. My argument is that we are currently under-investing in assets with low $\delta$ because we apply high $\rho$ to their early years. Separating the two allows us to see that some assets are robust to the very growth shocks that make you impatient."

  *   **Concede or Hold:** Hold on the conceptual distinction; Concede that empirically they are often collinear.
  *   **Softest Point:** The "growth uncertainty" point. If the durable good's value depends on future wealth (e.g., an institution for luxury conservation), then growth uncertainty *does* discount it. You need to specify that durable goods are often "basic infrastructure" for value, not value itself.

  ### 4. The Lock-in/Fanaticism Objection (Philosophers)
  **The Objection:** "You argue durability reduces the 'fanaticism' of standard longtermism by grounding value in measurable assets. But durability is a multiplier, not a sign. A durable *bad* (a tyrannical norm, a locked-in technology) is worse than a fleeting bad. By prioritizing durability, aren't you just increasing the variance of outcomes? You haven't removed the heavy tail; you've just made the tail depend on the stability of the intervention rather than the probability of the scenario. Doesn't this relocate the fanaticism worry rather than solve it?"

  **The Reply (2 mins):** "I concede that durability increases variance, and I do not claim this solves fanaticism entirely. However, it shifts the locus of uncertainty from 'unmeasurable probabilities of existential scenarios' to 'measurable stability of institutional design.' We have more data on how laws decay than on the probability of AI takeover. The 'amortization inversion' selects for interventions where the *mechanism* of value is robust, not just the *prediction* of value. It doesn't eliminate the risk of lock-in, but it makes the risk legible to governance. We can audit a statute for rigidity; we cannot audit a probability distribution for existence. It trades 'cluelessness about the future' for 'uncertainty about engineering.'"

  *   **Concede or Hold:** Concede that it relocates rather than eliminates tail risk; Hold that the new location is more manageable.
  *   **Softest Point:** If they argue that "engineering uncertainty" is also heavy-tailed (e.g., unintended consequences of norms), you have to admit that durability without direction is dangerous.

  ### 5. The Ally Objection (Committed Standard Longtermist)
  **The Objection:** "My work relies on the expected value multiplication: small probability $\times$ huge stakes. You've argued that the probability is structurally unmeasurable and the independence assumption fails. If you remove the multiplication engine, how do I prioritize between two durable goods? If I have a choice between a durable norm and a durable technology, and both last 100 years, your framework gives me no way to choose. Haven't you disarmed the movement to save it?"

  **The Reply (2 mins):** "I am not disarming the movement; I am changing its ammunition to something that doesn't explode in the chamber. I concede that within the class of durable goods, you still need expected value to prioritize. My negative argument is only against using EV to compare *durable* goods to *non-durable* goods (like cash transfers) using unmeasurable probabilities. I am giving you a shield against the 'Pascal's Mugging' critique that gets you dismissed in departments like this. Use EV for tractability and scope within the durable class, but use the Durability Argument to justify why the durable class deserves the budget share in the first place. I'm giving you a defense of the *cause area*, not a replacement for *project selection*."

  *   **Concede or Hold:** Concede that EV is still needed for marginal choices; Hold that EV is invalid for cross-class comparison.
  *   **Softest Point:** If the probability of "mattering" is unmeasurable for durable goods too (e.g., will this norm matter in 200 years?), your distinction blurs.

  ---

  ## Part 2: The Three Extras

  ### 1. What to Concede in the First Two Slides
  **Concession:** "I want to be clear at the outset: I am not arguing that near-term cost-effectiveness is *wrong*, nor that standard longtermists are *irrational*. I am arguing that the *accounting convention* used to compare them is biased against assets with long service lives. I also concede that I do not yet have a perfected estimator for depreciation rates ($\delta$). This paper is a theoretical correction to the objective function, not a finished empirical tool."
  **Why:** This disarms the Development Economists (you aren't telling them their RCTs are useless) and the Ally (you aren't calling them irrational). It frames the "lack of estimator" as a known limitation rather than a hidden flaw.

  ### 2. The One Reply That Must Land
  **The Distinction:** You must successfully distinguish **Depreciation ($\delta$)** from **Discounting ($\rho$)**.
  **Why:** If the Public Finance economists convince the room that your "amortization" is just a sneaky way of setting the social discount rate to zero, your paper becomes a trivial contribution to the discounting literature. You must maintain that $\delta$ is a property of the *technology/institution* (objective), while $\rho$ is a property of the *social welfare function* (normative).
  **Phrasing:** "Discounting asks 'how much do we care about the future?' Depreciation asks 'how much of the asset survives to the future?' We can care deeply about the future ($\rho \approx 0$) but still waste resources on assets that rot ($\delta \approx 1$)."

  ### 3. The Question You Hope Nobody Asks
  **The Question:** "Can you give me a concrete example of a 'durable good' in your sense and its estimated depreciation rate, and show me how it differs from something you consider 'non-durable'?"
  **Why:** This targets your self-identified weakness. If you say "Democracy" or "Rule of Law," they will ask for the $\delta$. If you say "I don't know," you look like you are selling a phantom variable.
  **Preparation:** Have a proxy ready. "Consider a patent vs. a cash transfer. The cash transfer's benefit is consumed at $t=0$ ($\delta \approx 1$). The patent creates a monopoly rent stream. We can observe the decay of patent citations or revenue. That is a measurable $\delta$. I am arguing we should treat 'norms' similarly, even if the data is noisier."

  ---

  ## Part 3: Addressing Your Weakest Point
  **The Weakness:** "I offer no procedure for estimating a depreciation rate, and 'durable' may turn out to be empirically indistinguishable from 'difficult for us to measure'."

  **How bad is it?**
  It is fatal *if* you present this as a ready-to-use policy tool. It is survivable *if* you present this as a critique of current accounting standards.
  If "durable" just means "stuff we can't measure well," then the Development Economists will correctly identify this as selection bias: you are selecting for interventions where the signal is noisy and persistent, which is often where identification fails.

  **What it leaves you with:**
  You are left with a **Research Agenda**, not a **Solution**.
  You must pivot to this: "The indistinguishability you fear is exactly the problem I am highlighting. Current cost-effectiveness analysis treats 'hard to measure after year 3' as 'zero value.' I am arguing that 'hard to measure' is often a signal of 'durability,' not 'non-existence.' The lack of a procedure is not a bug in my theory; it is a bug in the field's measurement infrastructure."

  **Strategy:**
  Do not try to fake an estimator. Instead, lean into the "Accounting Reform" angle. Accountants often deal with assets where depreciation is estimated via expert judgment, not RCTs. Argue that longtermism needs to move from "Physics-style prediction" (exact probabilities) to "Engineering-style estimation" (service life and safety factors). This validates the "hard to measure" aspect without conceding that it is meaningless.

  **Final Advice for the Ally:**
  Pull her aside before the seminar. Tell her: "I am attacking the *weak* version of longtermism (Pascal's Mugging) to save the *strong* version (Institutional Change). If you defend the multiplication argument today, they will eat you. If you let me handle the negative critique, you can champion the Durability Argument as the 'grown-up' version of our field." Make her feel that your negative argument is a shield for her, not an attack on her goals.
