answer: |-
  Under what conditions does a mismatch between avowed and actual allocative logics constitute corruption rather than legitimate cultural variation?

  Current debates in comparative politics and political theory regarding corruption are stalled between universalists, who impose Western bureaucratic standards globally, and cultural relativists, who deny the applicability of those standards outside specific institutional contexts. Both positions presuppose a Weberian definition of corruption centered on the violation of a depersonalized public office. This presupposition is empirically fragile: ethnographic literature frequently describes contexts where no such depersonalized office exists, rendering the universalist/relativist dispute a pseudo-argument. If there is no office, there can be no violation of office duties. This project proposes a conceptual shift from office-violation to logic-mismatch. It argues that scarce goods are distributed via three allocative logics: queue (impersonal criteria/need), ledger (reciprocal exchange/clientelism), and gift (relationship constitution). Corruption is defined not as the use of a specific logic, but as the mismatch between the logic an institution publicly avows and the logic it actually employs.

  This mismatch account avoids the pitfalls of the office-based model. It does not presuppose a Western bureaucracy because any institution can avow a logic, even if that logic is communal or gift-based. It answers the universality question non-question-beggingly by positing a universal norm of consistency (avowal must match practice) rather than a universal norm of content (impartiality must always prevail). This distinguishes legitimate pluralism (avowing and practicing ledger logic) from corruption (avowing queue logic but practicing ledger logic). The difficult case of bribery—gift-giving meant to buy outcomes—is resolved by examining contingency. A genuine gift logic is non-contingent on specific official acts; a bribe is a ledger transaction masquerading as a gift. When the transfer is contingent on a specific outcome despite being avowed as relationship maintenance, it is a mismatch.

  **Methodology and Timeline**
  This is a six-month theoretical project relying on secondary ethnographic literature and conceptual analysis; no new fieldwork is required.
  *   **Months 1-2:** Refine the tripartite typology (Queue, Ledger, Gift) and formalize the definition of "avowal." I will test these definitions against standard political theory texts to ensure conceptual coherence.
  *   **Months 3-4:** Case selection and analysis. I will select three distinct contexts from existing ethnographies (e.g., post-Soviet clinics, West African patronage networks, South Asian bureaucracies) to code instances of exchange using the mismatch framework.
  *   **Month 5:** Development of the practitioner deliverable. I will translate the conceptual distinctions into a coding rule for survey researchers.
  *   **Month 6:** Drafting the final paper and integrating feedback from workshop presentations.

  **Possible Conclusions**
  1.  **Mismatch Holds:** The framework successfully distinguishes corruption from cultural difference without relying on Western office norms. This is decided if the coding rule consistently categorizes ethnographic cases in line with local normative judgments.
  2.  **Mismatch Collapses:** The "avowed logic" is always strategically manipulated, making the mismatch impossible to measure empirically. This is decided if secondary literature shows avowals are universally hypocritical across all logics.
  3.  **Hybrid Outcome:** The framework works for state institutions but fails for informal networks. This is decided if the coding rule yields high error rates in non-state contexts.

  **Limitations**
  The primary limitation is the epistemic access to "avowal." Institutions may lie about their logic systematically. This project cannot solve the problem of deception entirely; it can only offer better tools for detecting inconsistency. Additionally, six months is insufficient to develop a full normative defense of why consistency is morally required; this project establishes the conceptual groundwork for that normative claim but does not complete it.

  **Practitioner Deliverable**
  The project will produce a coding rule for anti-corruption surveys to distinguish clientelism from corruption from gift exchange. Existing indices often conflate these, penalizing ledger-based societies for being corrupt rather than clientelist. The new rule asks respondents not just whether a gift was given, but whether the gift was *contingent* on a specific act despite being *avowed* as unconditional. This improves existing scores by reducing false positives in cultures where reciprocal exchange is transparent and avowed, targeting instead the隐蔽 (hidden) mismatches that undermine institutional trust.

  **Normative Significance**
  Defining corruption is not merely descriptive classification but an act of political judgment that determines who is punished and who is exempt. If we misidentify the wrong, we impose institutional reforms that destroy functional social ties while leaving actual predation untouched.
