answer: |-
  No, there isn't a single universally accepted word for this, though philosophers typically classify it as "precommitment against preference change" rather than a standard Ulysses contract.

  Your intuition is correct: the standard Ulysses contract assumes a conflict of *will* (I know what is good, but I won't do it), whereas your setup assumes a conflict of *judgment* (I know what is good now, but you will genuinely believe something else is good later). Because there is no specific term that isolates this judgment-shift nuance from general precommitment, I will name it **Diachronic Entrenchment**.

  **Diachronic Entrenchment** is defined as the act of a prior agent imposing constraints on a future agent based on conflicting evaluations of value, rather than conflicting willpower. It differs from ordinary precommitment because it does not rely on the future self being "weak"; it relies on the future self being "wrong" (from the past self's perspective). It differs from a promise because a promise relies on an obligation to another person, whereas this is an obligation imposed on oneself (or one's institutional successor) without the future agent's concurrent consent. It differs from stubbornness because it involves a structural barrier (like a rule or constitution) rather than just a psychological refusal to budge.

  Regarding whether the individual and group cases are one phenomenon or two: they are the same phenomenon operating on different theories of identity. In the individual case, the binding relies on **psychological continuity** (you are the same person over time); in the group case, it relies on **institutional continuity** (the council is the same entity despite member turnover). Both rely on the idea that the entity persists over time and has an interest in stability that outweighs the current autonomy of its temporal stage. Your friend's "dead hand of the past" comment is the specific political theory label for the group version (Jefferson vs. Madison), but **Diachronic Entrenchment** covers both the personal and political instances under one logic.

  On your two additional questions:
  1.  **Does it matter if the later self is grateful?** Yes, but only retrospectively. Gratitude converts the binding from a violation of autonomy into a form of retroactive consent. If future-you is grateful, the entrenchment is validated ex-post; if future-you is resentful, it remains a paternalistic override.
  2.  **Does it matter whether the earlier self was actually *right*?** It matters for justification, but not for the structure. If past-you was objectively right (the expensive school would have ruined you financially), the entrenchment is benevolent paternalism. If past-you was wrong, it is tyranny over your future self. However, the mechanism of Diachronic Entrenchment functions identically regardless of truth; it is a bet by the past self that their judgment deserves sovereignty over the future self's judgment.
