answer: |-
  **Stage 1: Candidate Principles**

  Four principles generate your package, two of which are rivals.

  1.  **All-Affected Interests:** Any impact generates a claim to inclusion. This grounds Point 1, supports Point 2 (future impact), and supports Point 3 (local impact).
  2.  **Membership Constitution:** The existing demos decides who belongs. This grounds Point 3 (national exclusion) and Point 6 (voting as a trust constituted by the group).
  3.  **Epistemic Instrumentalism:** Larger, diverse groups judge better. This grounds Point 4(b) and Point 5 (diversity outweighs competence filtering).
  4.  **Civic Duty:** Voting is an office for the common good. This grounds Point 4 (compulsion) and Point 6 (trust).

  **Rivals:** *All-Affected Interests* and *Membership Constitution* are genuine rivals. The former pushes inclusion based on causal impact; the latter pushes exclusion based on status. Point 3 explicitly chooses Membership over Affected Interests for national elections, creating the package's primary fault line. *Epistemic Instrumentalism* and *Civic Duty* are variants supporting compulsory voting but stem from different roots (truth vs. obligation).

  **Stage 2: Consistency Audit**

  **Tension 1 (Severe): Point 1 vs. Point 3 and 6.**
  Point 1 claims affected interests are the "real ground" of inclusion and exclusions must be justified to the excluded. Point 3 excludes long-term residents from national votes despite significant affected interests. Point 6 attempts to override Point 1 by defining voting as a trust the demos constitutes itself.
  *Revision:* Qualify Point 1 to "All-Subjected Members" rather than "All-Affected."
  *Cost:* You lose the moral leverage of Point 1. You can no longer demand justification to the excluded based on impact alone; you must justify the membership boundary itself without appealing to affected interests. This weakens the defense against Point 3's exclusions.

  **Tension 2 (Moderate): Point 6 vs. Point 7.**
  Point 6 defines voting as a public office/trust. Point 4(b) relies on the electorate's capacity for collective judgment. Point 7 allows those with advanced dementia to vote with assistance.
  *Revision:* Require minimal capacity for voting.
  *Cost:* This violates Point 5 (no competence tests) and requires administering assessments you explicitly ban elsewhere. Alternatively, allow assistance, but if "assistance" implies surrogate judgment, it violates Point 2's ban on proxy votes.
  *Resolution:* You must argue that dementia patients retain preference structures even if cognitive faculties decline, distinguishing "capacity to choose" from "capacity to reason." This is fragile but salvageable without abandoning other points.

  **Tension 3 (Moderate): Point 2 vs. Point 3.**
  Point 2 enfranchises 16-year-olds based on longitudinal stake (future consequences). Point 3 disenfranchises residents based on current stake (taxes, laws).
  *Revision:* Align the weighting of stakes.
  *Cost:* Either raise the voting age (violates Point 2's longitudinal argument) or enfranchise residents nationally (violates Point 3's citizenship line). The inconsistency suggests you value future citizenship stakes over current residency stakes without explicit justification.

  **Apparent Tensions:**
  Point 2's acceptance of inconsistent age limits (contracts vs. voting) creates no friction with Point 6. Different offices require different capacities; a specific trust does not require a uniform age of majority. Point 4 (compulsion) and Point 5 (no tests) are orthogonal; both expand the electorate's composition and serve the epistemic goal of diversity.

  **Single Revision and Defensibility:**
  The single revision that does the most repair work is amending Point 1 to **"All-Subjected Members."** This aligns the inclusion principle with the citizenship requirement in Point 3 and the constitutive claim in Point 6. It resolves the severe tension by acknowledging that the "claim to a say" arises from membership status, not merely impact.

  **Survival:**
  With this revision, the package becomes a coherent **Civic Republican** theory: voting is a duty of members to judge common goods, protected from exclusionary tests but bounded by membership.
  **Defensibility:** As originally written, the package sounds coherent in a hearing because it balances competing intuitions pragmatically. However, it would not survive peer review in print due to the unresolved contradiction between Point 1 (impact-based) and Point 3 (status-based). With the revision, it becomes defensible in print as a consistent theory, though it loses the critical radicalism of Point 1 that challenges the boundaries of citizenship itself. You gain consistency but lose the tool to critique the exclusion you uphold in Point 3.
