      *(Check on 3 vs 5)*: (3) says representation is neutral. (5) says representing damage is bad. This is a direct clash on the nature of content. Dropping (5) saves (3).

      *(Check on 6)*: Keeping (6) is standard in the literature (Grahek's "feeling no pain"). Asymbolics have the quale minus the imperative.

      *(Final Plan)*:
      1. Validate the package (it's a standard "Separatist" view).
      2. Highlight (5) as the outlier causing the crashes.
      3. Rank tensions.
      4. Propose revising (5) to distinguish *intrinsic* badness (affect) from *instrumental* disvalue (representation).
      5. Clarify (4) as meta-ethical support for (2), not a competitor.
      6. Settle (1)/(6) as terminological.

  8.  **Final Review against constraints:**
      *   Rank tensions? Yes.
