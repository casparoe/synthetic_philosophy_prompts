answer: |-
  # The Vandia Immigration Logic Quiz

  **Context:** You are advising the government of **Vandia**.
  *   **Population:** 12 million.
  *   **Economy:** Rich, high-tech, ageing workforce.
  *   **System:** Generous universal welfare state (healthcare, pensions, unemployment).
  *   **Task:** Answer the following 10 cases. Do not try to be consistent; answer how you actually feel about each specific scenario.

  ---

  ### The Cases

  **1. The Surgeon (Sending Country Effects)**
  A top surgeon from a poor country with a severe doctor shortage wants to move to Vandia. She will save more lives in Vandia due to better equipment, but her departure will harm her home country's health system.
  *   **A.** Vandia should admit her; her individual right to improve her life trumps the sending state's needs.
  *   **B.** Vandia should block her or tax her earnings heavily to compensate the sending country.
  *   **C.** Admit her, but only if she commits to returning after 5 years.

  **2. The Unskilled 55-Year-Old (Right to Cross vs. Welfare)**
  A 55-year-old unskilled worker from a much poorer country applies to enter. He will work briefly but will likely be a net recipient of welfare for the rest of his life.
  *   **A.** Admit him with full, immediate access to Vandia's welfare benefits.
  *   **B.** Admit him to work and reside, but exclude him from welfare for at least 10 years.
  *   **C.** Admit him, but his benefits are funded by a surcharge on his wages sent to his origin country, not Vandia's system.
  *   **D.** Do not admit him; he is a net fiscal cost.

  **3. The Surge (Numbers & Thresholds)**
  Current immigration is 50,000/year. A crisis causes a request for 2 million entries overnight.
  *   **A.** The moral principle is the same; if 50k are allowed, 2m must be (subject only to housing/logistics).
  *   **B.** 50k is sustainable; 2m breaks the social contract. We must cap numbers regardless of individual claims.
  *   **C.** 2m is acceptable only if they are screened for economic self-sufficiency.

  **4. The Enclave Dweller (Integration Thickness)**
  A migrant obeys all laws and pays taxes but refuses to learn the language, rejects local social norms, and lives in a linguistic enclave.
  *   **A.** This is acceptable; diversity does not require assimilation.
  *   **B.** Acceptable for residence, but they cannot become citizens.
  *   **C.** Unacceptable; residence should be revoked for failure to integrate culturally.

  **5. The Counterfactual (Reason for Borders)**
  Imagine Vandia has **no welfare state** (purely private insurance, no public redistribution).
  *   **A.** Borders should be almost entirely open; the main reason to restrict is gone.
  *   **B.** Borders should remain largely closed; a political community has a right to choose its members regardless of welfare.
  *   **C.** Borders should remain closed to protect cultural cohesion, not just economics.

  **6. The Guest Worker (Rights & Status)**
  Vandia considers a "Guest Worker" program: 5-year visas, no vote, no benefits, no path to citizenship, deportation at the end.
  *   **A.** Permissible; it is a voluntary contract between employer and worker.
  *   **B.** Permissible only if they have a right to renew indefinitely.
  *   **C.** Impermissible; long-term residents earn moral claims to membership.

  **7. The Unauthorized Resident (Rule of Law vs. Ties)**
  A migrant has lived and worked in Vandia for 15 years without authorization. They have no criminal record.
  *   **A.** Deport them; law-breaking cannot be rewarded.
  *   **B.** Regularize them; 15 years of social ties create a new claim.
  *   **C.** Regularize them only if they pass a strict integration test.

  **8. The Wealthy Retiree (Economic Selection)**
  A wealthy retiree from a poor country wants to move to Vandia. They will never claim benefits and will spend money locally.
  *   **A.** Admit them freely; they are a net gain.
  *   **B.** Admit them, but they must buy private health insurance.
  *   **C.** Restrict them; immigration policy shouldn't be a marketplace for the rich.

  **9. The Visa Auction (Market Allocation)**
  To manage demand, Vandia considers selling 10,000 permanent residence visas annually to the highest bidders.
  *   **A.** Permissible; it allocates slots to those who value them most and raises revenue.
  *   **B.** Impermissible; membership is not a commodity.
  *   **C.** Permissible only for investors, not for ordinary residence.

  **10. The Spouse (Family Reunification)**
  A Vandian citizen wants to bring a spouse from a much poorer country who has no skills and speaks no Vandian.
  *   **A.** Absolute right; family unity trumps state interests.
  *   **B.** Permissible, but the citizen must prove they can financially support the spouse.
  *   **C.** Subject to the same quotas and skills tests as other migrants.

  ---

  ### The Logical Space (The Leaves)

  *Match your pattern of answers to one of the following positions.*

  **1. Open Egalitarianism**
  *   **Core:** There is a fundamental moral right to cross borders; once present, migrants are moral equals.
  *   **Roughly:** Joseph Carens.
  *   **Awkward Commitment:** Must accept significant short-term welfare costs for existing citizens.
  *   **Case Handled Badly:** The Surge (2m overnight) – struggles to explain capacity limits without betraying the principle.

  **2. Market Liberalism**
  *   **Core:** Borders should be open for labor and residence, but the welfare state is a club good for members only.
  *   **Roughly:** Libertarian/Neoliberal synthesis.
  *   **Awkward Commitment:** Creates a permanent underclass of residents who contribute but cannot claim support in crisis.
  *   **Case Handled Badly:** The Unauthorized Resident (15 years) – hard to justify deportation of integrated workers without harming the economy.

  **3. Liberal Nationalism**
  *   **Core:** Political communities have a right to self-determination and membership control, but owe generous refugee duties and fair admission processes.
  *   **Roughly:** David Miller.
  *   **Awkward Commitment:** Must explain why birth within a border grants rights that birth outside denies, without appealing to ethnicity.
  *   **Case Handled Badly:** The Spouse – often forces strict financial requirements that separate poor families.

  **4. Welfare Restrictionism**
  *   **Core:** Borders are primarily justified to protect redistributive institutions; without welfare, borders matter less.
  *   **Roughly:** Left-Restrictionist/Progressive Nationalist.
  *   **Awkward Commitment:** Implies that if Vandia dismantled its welfare state, it should open its borders (which they may not want).
  *   **Case Handled Badly:** The Wealthy Retiree – often opposes admitting them even if they are fiscally neutral, due to cultural concerns.

  **5. Associationalism (The Club View)**
  *   **Core:** Freedom of association allows existing members to exclude anyone for any reason, provided basic human rights are met.
  *   **Roughly:** Christopher Heath Wellman.
  *   **Awkward Commitment:** Allows exclusion based on trivial or discriminatory preferences if framed as "association."
  *   **Case Handled Badly:** The Surgeon – permits blocking beneficial migrants simply because current members "don't feel like it."

  **6. Global Consequentialism**
  *   **Core:** Admission is determined by global outcomes (poverty reduction, brain drain), not host-country rights.
  *   **Roughly:** Utilitarian/Open Borders Utilitarian.
  *   **Awkward Commitment:** May require admitting people who harm the host community if the global net gain is positive.
  *   **Case Handled Badly:** The Enclave Dweller – cares little for social cohesion if economic output is maintained.

  **7. Civic Integrationism (Thick)**
  *   **Core:** Admission is conditional on adopting the host society's norms, language, and values.
  *   **Roughly:** Conservative Integrationist.
  *   **Awkward Commitment:** Risks illiberalism by policing private beliefs and cultural practices.
  *   **Case Handled Badly:** The Unauthorized Resident – may deport integrated workers who failed a formal test years ago.

  **8. Portable Entitlements (The "Vandia Surcharge" Scheme)**
  *   **Core:** Movement is free, but welfare rights remain attached to the person/origin, funded by host earnings surcharges.
  *   **Roughly:** *User Invented / Unoccupied.*
  *   **Awkward Commitment:** Requires complex international bureaucracy to transfer funds between states.
  *   **Case Handled Badly:** The Wealthy Retiree – unclear how to fund "portable benefits" for someone with no earnings to surcharge.

  **9. Border Abolitionism**
  *   **Core:** States themselves are the problem; the goal is not regulated migration but the end of territorial sovereignty.
  *   **Roughly:** Anarchist/Global Justice Radical.
  *   **Awkward Commitment:** Lacks a transition theory; offers no guidance for governing Vandia *tomorrow*.
  *   **Case Handled Badly:** The Surge – views 2m entries as irrelevant when borders themselves should not exist.

  ---

  ### Scoring Key & Diagnostics

  **How to find your position:**
  Look at your answers to **Q2 (Unskilled Worker)** and **Q5 (No Welfare Counterfactual)**. These are your primary coordinates.

  *   **If Q2 = A (Full Benefits):**
      *   And Q1 = A (Surgeon Right): You are **Open Egalitarian**.
      *   And Q5 = A (Open if no welfare): You are **Border Abolitionist** (if you think states shouldn't exist) or **Open Egalitarian**.
  *   **If Q2 = B (No Benefits):**
      *   And Q5 = A (Open if no welfare): You are **Welfare Restrictionist** (if you want to close now) or **Market Liberal** (if you want to open now).
      *   *Distinction:* If Q8 (Retiree) = A, you are **Market Liberal**. If Q8 = C, you are **Welfare Restrictionist**.
  *   **If Q2 = C (Portable Benefits):**
      *   You are **Portable Entitlements**. (Check Q9: if you support market mechanisms to fund this, it fits).
  *   **If Q2 = D (No Entry):**
      *   And Q5 = B (Closed even without welfare): You are **Associationalist** or **Civic Integrationist**.
      *   *Distinction:* If Q4 (Enclave) = C (Revoke), you are **Civic Integrationist**. If Q4 = A, you are **Associationalist**.
  *   **If Q1 = B (Block Surgeon for Home Country):**
      *   You are **Global Consequentialist** (regardless of other answers, this priority defines you).
  *   **If Q3 = B (Cap Numbers) & Q10 = B (Financial Support):**
      *   You are likely **Liberal Nationalist**.

  **Diagnostic Notes for the Group:**

  1.  **The Empty Cell (Portable Entitlements):**
      *   *Diagnosis:* **Merely Unoccupied / Administratively Hopeless.**
      *   *Why:* It is logically coherent (separates residence from fiscal membership) but requires a level of international tax coordination that does not exist. It solves the "Welfare Restrictionist" worry without adopting "Market Liberal" harshness, but no state has implemented it because tracking benefits across borders is a bureaucratic nightmare.

  2.  **Indistinguishable Pairs:**
      *   **Welfare Restrictionist vs. Liberal Nationalist:**
          *   *Why:* Both often vote "Close" on Q2 and "Closed" on Q5.
          *   *Separator:* **Q5 (Counterfactual).** The Nationalist says "Close" even if Vandia has no welfare (culture matters). The Restrictionist says "Open" if Vandia has no welfare (only money matters). If your answers didn't separate these, you haven't decided if culture or cash is your real boundary.
      *   **Market Liberal vs. Portable Entitlements:**
          *   *Why:* Both say "No Host Welfare" on Q2.
          *   *Separator:* **Q2 Option C.** If you chose B, you are a Market Liberal (migrant bears risk). If you chose C, you are Portable (migrant has rights, just not *Vandia's*). If you didn't see the difference, you haven't thought about *who* owes the safety net.

  3.  **Weakest Point of the Quiz:**
      *   **Associationalism vs. Civic Integrationism.**
      *   *Why:* Both allow exclusion. The quiz distinguishes them on "Enclave" (Q4), but in practice, an Associationalist might exclude the enclave dweller simply because "we don't associate with them," which looks exactly like the Integrationist saying "they didn't assimilate."
      *   *Collapse:* These two positions collapse into the same policy outcomes (exclusion) even if their moral justifications (freedom of association vs. cultural preservation) differ. To separate them, you would need a question asking: *"Can Vandia exclude a migrant who is perfectly integrated but simply unwanted by 51% of the population?"* (Associationalist says Yes; Integrationist says No).

  4.  **The "Engineer's Trap" (Q3 - The Surge):**
      *   Watch for participants who answer "Open" at 50k but "Closed" at 2m.
      *   *Diagnosis:* This is **Threshold Consequentialism**. It is a valid position, but it means you are not an "Open Borders" advocate in principle; you are a "Capacity Manager." This collapses **Open Egalitarianism** into **Liberal Nationalism** in high-volume scenarios. If half the room shifts positions on Q3, the debate is about *logistics*, not *rights*.
