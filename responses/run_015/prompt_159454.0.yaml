      *   **Context:** A three-hour argument with a weather forecaster (objectivist/chancy world leaning) and a roommate (frequentist). They agree on *operations* (math, numbers, predictions) but disagree on *ontology/semantics* (what probability *is*).
      *   **Core Question:** Is this a verbal dispute (three definitions, one word) or a substantive disagreement hidden underneath? Specifically, does Sam's "Principal Principle" argument (chance constrains credence) break the verbal dispute hypothesis?
      *   **Specific Sub-questions:**
          1.  Does physics (determinism vs. indeterminism) settle it?
          2.  Does de Finetti/exchangeability solve it, or just move the bump (as Sam claims)?
