  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Don't just say "Aleatory vs Epistemic." That's the encyclopedia summary the user warned against.
      *   *Correction:* Frame it as **Guidance vs. Grounding**. The User cares about Guidance (how to bet). Sam cares about Grounding (what makes the bet correct independent of the bettor).
      *   *Critique:* Make sure to answer the "Progress" part concretely.
