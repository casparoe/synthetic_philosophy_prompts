          *   *Verdict:* Physics doesn't settle it. It shifts the *plausibility* of Sam's view but doesn't kill the User's. The User can treat quantum mechanics as just another source of uncertainty. Sam treats it as the *source* of probability.
          *   *Diagnosis link:* This confirms it's not purely empirical. It's interpretive.

      *   **2. De Finetti/Exchangeability:**
