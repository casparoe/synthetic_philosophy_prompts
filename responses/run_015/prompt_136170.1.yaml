answer: |-
  We said the flame is passed from wick to wick,
  To light the next without a thing inside.
  Or else it's just a story told again,
  With different names but called the same old tale.
  The fire burns but nothing holds the burn,
  The plot goes on though actors leave the stage.
  So what remains is just a causal thread,
  A thread that ties the moments up somehow.
  But who is holding ends of thread or flame?
  If none conveys the fire, how does it move?
  If no one tells the story, who speaks now?
  We strip the self away and still we seek
  Must there be ghost behind the voice to say it's none,
  Or what survives the death of him who speaks?
