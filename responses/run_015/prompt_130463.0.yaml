  Hey — please act as a professional philosopher who works on truth, language and metaphysics (like, actually good at this; take your time, start with some unstructured brainstorming about what a deflationist needs the truth schema to *do* before you commit to a diagnosis, and then give me the verdict). I'm in a small reading group on truth and I've been the one defending the minimalist/deflationary line — the view that there's no substantive property of truth to investigate, that all there is to truth is the equivalence schema (<p> is true iff p, one instance per sentence), and that the point of having the word at all is expressive: it lets you generalize over infinitely many claims you couldn't list, endorse things you can't state, and so on. I felt fine about it until my friend Priya hit me with what she calls the cheap concepts argument, which I think proves way too much, and I've been going in circles for a week trying to find the exit. Her version, cleaned up a bit by me (so blame me for any sloppiness in it):

  (1) Say a predicate is schema-trivial iff there's a biconditional schema, one instance per admissible substitution, with every instance knowable a priori, which lets you eliminate the predicate from that instance, and whose instances taken together exhaust everything there is to know about the predicate.
  (2) Truth is schema-trivial: <p> is true iff p, for every p. That's exactly why truth isn't a substantive property with an interesting hidden nature.
  (3) But so are a bunch of other things. Existence: x exists iff something is identical with x. Reference: for any singular term t, t refers to t (used, not mentioned). Property possession: x has the property of being F iff x is F. Meaning: the sentence s means that p, where p is what you get by disquoting s. None of these look any less trivial or any less a priori than the truth schema.
  (4) If being schema-trivial settles that a concept isn't substantive, then existence, reference, property-possession and meaning aren't substantive either.
  (5) That's false. Whether there are numbers, whether a name hooks onto its bearer by some causal-historical route or by a description, whether properties are universals or something else — these are real, contested, theory-laden questions, and nobody thinks they get answered by disquoting.
  (6) So schema-triviality doesn't establish that truth is non-substantive; the main argument for deflationism is doing no work, or at least not the work I thought it was doing.
  (7) So I should give up deflationism, or find it some completely different ground.

  I definetly don't accept (7). If I have to choose, I'd rather hang on to (2) and (5) and give up (1) or (4) — though I can't tell whether that's a real judgement or just me defending the bits I'm invested in. So: which step do you reject, and why did it look fine up close? And what does each of the options cost me — in particular, is there a reading of (1) on which truth passes and the others don't, or does drawing that line force me to admit that truth does some explanatory or normative work after all (say, explaining why believing what's true tends to get you what you want, or why assertion is governed by a norm)? Priya also has a second, sharper version that drops my (1) entirely and just runs on that explanatory point, and I'd like to know whether that's the same argument wearing a hat or a seperate one with a different price tag. One more thing I noticed and can't place: some of the instances in (2) and (3) go bad — self-referential sentences, sentences with indexicals, empty names — and I can't tell whether any of the argument turns on those, so please say if the whole thing secretly rests on the paradoxes rather than on the concept of truth. And please argue from the ideas themselves rather than pointing me at papers: I've got no library access and no internet right now, so name any distinction you need and define it precisely instead of telling me who drew it.
