      *   *Drafting thought:* I need to make sure the 1923 date is implied or stated gently. If I say "1923," the vicar's mother might do the math. If I say "a hundred years ago," it's safer. But the prompt says "strictly truthful about the 1923 curate." So I should probably mention the curate or the specific time, but frame it as a founding moment, not a scandal. Let's go with "nearly a hundred years ago" and mention the "curate's study."

      *   *Refining the "Signal":* The academics need to know I know. I should acknowledge that the *story* changed, but the *practice* remained.
      *   *Refining the "Grandmother" aspect:* The prompt highlights the grandmother's sincere belief. I should honor that. Her memory *made* it old.

  4.  **Writing the Speech (Iterative Process):**

      *   *Start:* Good morning. Look at the well.
