  **Address for the Well Blessing**

  Good morning. It is a particular joy to stand here in the churchyard, looking out at so many familiar faces, and some new ones too, on a morning when the light seems to have settled specifically on this village. We are gathered around the well, as we do every June, to give thanks for the water that rises from the ground and the community that rises around it.

  When we stand here, dressed in white, carrying flowers and singing the old hymns, it is very easy to feel that we are stepping out of time. The water looks the same as it did when our grandparents were children. The stones of the churchyard hold the names of families who have lived here for centuries. In moments like this, it feels as though this ceremony has always existed, waiting for us to step into it, as permanent as the hill behind us.

  We like to think of traditions as things we find. We imagine them like stones in a field, ancient and unmoving, waiting for us to pick them up and carry them forward. We tell ourselves that our forebears handed this down to us in an unbroken line, from the medieval masons who built the church to the children walking in the procession today. It is a comforting story. It gives us roots. It makes us feel that we belong to something larger than our own lifetimes.

  But if we look closely at the things we love, we sometimes find that they are not stones, but seeds. They are not found; they are planted.

  The truth of this blessing is not that it was discovered in the mists of time, but that it was crafted in the clear light of a curate's study one winter, nearly a hundred years ago. In 1923, a young priest sat in this parish and looked around him. He saw a village rich in history but lacking a festival to call its own. He cared enough about us to want to give us something beautiful. He took pen to paper, and he wrote the order of service we use today. He designed the procession. He chose the hymns. He did not do this to deceive us; he did it to gift us. He wanted us to have a memory, so he gave us the chance to make one.

  I know that for some of us, this might change the texture of the memory. I know that many of you, like my own grandmother, grew up believing this was older than the church itself. She walked in that very first procession when she was eight years old. She walked in it every year until her legs could no longer carry her. When she spoke of it in her later years, she spoke with the absolute sincerity of someone describing the rising sun. To her, it *was* immemorial. And in a way, she was right. Because a tradition does not become real through age alone; it becomes real through belief, through repetition, and through love.

  The fact that a human being sat down and wrote this ceremony does not make it less sacred; it makes it more human. It means that this ritual is not a relic we are preserving in glass, but a living thing that someone chose to breathe into existence. It means that the power of this day does not come from the medieval past, but from the continuous care of the present.

  My family has sung in this procession for four generations. We have lowered flowers into this water through war and peace, through drought and flood. For a hundred years, this water has been blessed by the same words, sung by the same voices, in the same month of June. A century is not a millennium, but it is long enough to grow roots. It is long enough for a story to become true.

  And when the tradition grew faint, as traditions do, it was not the ancient families who rescued it alone. In the 1990s, it was newcomers to this village who looked at the records, who saw where this ceremony came from, and who decided it was worth saving. They knew the history. They knew it was not medieval. And they loved it anyway. They understood that the value of this day is not in its pedigree, but in its practice. They understood that we do not honor the past by pretending to be it; we honor it by carrying its best intentions into our own time.

  So, when we walk to the well today, we are not pretending to be our ancestors. We are being ourselves. We are acknowledging that community is not something you inherit passively; it is something you build actively. The curate who wrote this a century ago wanted us to feel connected to this place. The families who walked it for decades wanted to feel connected to each other. The neighbors who revived it wanted to ensure we stayed connected in the future.

  The water in the well is old, yes. It has filtered through the chalk for thousands of years. But the blessing is ours. It belongs to the people who show up. It belongs to the children who scatter the petals, to the choir who learn the tune, to the incomers who organize the route, and to the families who remember the verses.

  Let us not worry about how far back the shadow of this ceremony stretches. Let us be grateful that it casts a shadow at all. Let us be grateful that someone, a hundred years ago, thought we were worth the effort of invention. And let us promise that, for as long as we are here, we will tend this garden. We will water it with our own sincerity. We will ensure that when our grandchildren stand here, they too will feel the weight and the warmth of a story that holds them, knowing that the story is true because we are living it.

  Thank you.

  ***

  **Note on the Challenged Sentence**

  **The Sentence:** *"The truth of this blessing is not that it was discovered in the mists of time, but that it was crafted in the clear light of a curate's study one winter, nearly a hundred years ago."*

  **Why:** This is the pivot point of the entire speech. For the **folklore academics**, the phrase "crafted... not discovered" and the specific reference to the "curate's study" signals that you are fully aware of the "invented tradition" discourse (Hobsbawm) without needing to cite it. They will recognize you are acknowledging the 1923 origin explicitly.

  However, for the **Vicar's mother** (and others of her generation), this sentence directly contradicts the oral history they have held as fact ("older than the church itself"). While the speech frames this invention as a "gift" rather than a "fraud," this sentence is the specific moment where the myth of medieval antiquity is formally retired. She may approach you afterwards to ask, "Are you saying my mother was wrong?" or "Do we know for certain it wasn't based on something older?" It is the single point where the affectionate truth-telling risks colliding with a lifetime of assumed history.
