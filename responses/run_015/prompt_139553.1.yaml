answer: |-
  You have correctly identified a gap between the statistical literature on selection effects and the epistemological literature on defeat. The configuration you describe does not have a single canonical name, though it is occasionally discussed under the headings of "selection effects," "missing evidence," or "sampling bias." However, these terms are often descriptive rather than normative.

  For the purposes of print, I recommend carving the distinction along the axis of **Evidence Availability**. Specifically, you should distinguish between **Content-Independent Availability** and **Content-Dependent Availability**.

  Here is the analysis you requested, structured to help you draft your paragraph and footnote.

  ### 1. Classification and Location
  This phenomenon is best classified as a species of **Higher-Order Evidence (HOE)**, specifically **HOE about Evidence Generation**. While standard HOE discussions focus on cognitive processing (e.g., "I am tired") or peer disagreement, the category logically extends to the provenance of the evidence itself. Learning that your evidence was filtered is learning something about the reliability of the link between *having* the evidence and the *truth* of the hypothesis.

  Functionally, it operates as an **Undercutting Defeater**. It does not attack the proposition $p$ directly (rebutting), nor does it claim that $E$ fails to support $p$ *given that you have E*. Rather, it attacks the inference from "I have evidence $E$" to "$p$ is likely," by introducing the fact $S$ ("$E$ was selected by process $K$"). Once $S$ is added to your total evidence, the likelihood ratio $P(E|p) / P(E|\neg p)$ shifts, because $P(E|p \& S)$ differs from $P(E|\neg p \& S)$.

  ### 2. Answers to Your Three Questions

  **Q1: Does the phenomenon require knowing the *direction* of the bias?**
  It requires knowing that the selection mechanism is **non-random with respect to the truth value of the hypothesis**. You do not need to know the exact direction (e.g., "all hidden letters contradict my view"), but you must have reason to believe the availability of the evidence is correlated with the state of the world.
  *   *Merely Unrepresentative:* If you learn your sample is truncated but have no reason to think the truncation correlates with the hypothesis (random loss), you should widen your confidence intervals (increase uncertainty) but not necessarily shift your credence.
  *   *Directed Bias:* In your first two cases, you learn the truncation is *endogenous* (fear, executor's preference). This correlation mandates a shift in credence, not just uncertainty.

  **Q2: Does the mandate land on first-order credence or a higher-order attitude?**
  It lands on **first-order credence**. While the *source* of the mandate is higher-order (a fact about the evidence), the rational requirement is to adjust your belief in $p$. To believe "My evidence is biased" while maintaining the same credence in $p$ is a form of epistemic akrasia. The fact of the bias becomes a piece of first-order evidence about the likely existence of unobserved counter-evidence.

  **Q3: Why do the negative (1 & 2) and positive (3) cases come apart?**
  This turns on the **Independence Condition**.
  *   **Cases 1 & 2 (Content-Dependent):** The selection mechanism (silence, executor's choice) is likely dependent on the *content* of the evidence in a way that correlates with the truth of $p$. (e.g., People hide evidence that damages them; Executors hide evidence that embarrasses the subject). Here, Availability $\perp \!\!\! \perp$ Truth is false.
  *   **Case 3 (Content-Independent):** You trust the colleague to filter based on *methodological soundness*, which you presume is independent of the *truth value* of the specific conclusions. (A methodologically sound paper can be false; an unsound one can be true). Here, you treat Availability as conditionally independent of Truth, given Method. Therefore, the filter screens noise without systematically distorting the signal, permitting you to retain confidence commensurate with the papers' warrant, but not boosting it.

  ### 3. The Distinction for Print

  If you need a label to anchor the distinction, I propose **Provenancial Defeat** (for the negative cases) or, more neutrally, **Selection-Sensitive Justification**.

  Here is a draft paragraph you might adapt, followed by a footnote defense.

  **Draft Paragraph:**
  > "Epistemic justification in these contexts is **selection-sensitive**. It relies not only on the content of the available evidence but on the **Independence Condition of Evidence Availability**: the assumption that the mechanism rendering evidence available is independent of the truth-value of the hypothesis, conditional on the evidence's content. When an agent learns that evidence availability is **content-dependent**—that is, correlated with the facts the evidence is meant to establish—the provenance of the evidence functions as higher-order evidence regarding the completeness of the sample. This generates **provenancial defeat**: a rational mandate to reduce first-order credence, not because the existing evidence is falsified, but because the selection mechanism itself becomes informative evidence about the likely existence of unobserved counter-evidence."

  **Draft Footnote:**
  > "This configuration is distinct from standard undercutting defeat, which typically targets the connection between evidence and hypothesis (e.g., 'the light is red'). Here, the connection holds, but the *sample* is compromised. It is also distinct from the Requirement of Total Evidence, which is a synchronic norm; provenancial defeat describes the diachronic update required when learning one's evidence base was involuntarily truncated by a truth-correlated process. While this falls under the broad umbrella of Higher-Order Evidence (evidence about one's evidence), it specifically concerns **evidence generation** rather than cognitive processing or peer disagreement. See [References to Selection Effects/Phil Sci if needed, or leave self-contained]. The asymmetry between 'malign' filtering (Cases 1 & 2) and 'benign' filtering (Case 3) turns on whether the selection criterion (e.g., fear vs. methodology) is correlated with the truth of the hypothesis."

  ### 4. Boundary Cases (For your own defense)

  *   **Random Loss:** If the letters were lost in a flood (random), confidence should not drop, only precision. This marks the boundary between *Selection-Sensitive* and *Sample Size* issues.
  *   **Self-Selected Silence:** If the committee members stayed silent because they were busy (uncorrelated with the case), no defeat occurs. If they stayed silent because they feared retaliation (correlated), defeat occurs. This marks the boundary of **Content-Dependence**.
  *   **Truth-Tracking Filters:** If a filter *only* passes true claims (an oracle), confidence goes to 1. If a filter passes claims based on *method*, confidence stays with the method's reliability. This clarifies why Case 3 doesn't boost confidence: methodological soundness is not truth-tracking in a way that allows you to ignore the possibility of unsound-but-true counter-claims.

  ### Summary Recommendation
  Use **Selection-Sensitive Justification** as the broad category and **Provenancial Defeat** for the specific negative impact. Anchor the distinction on the **Independence Condition of Evidence Availability**. This allows you to bypass the "is it HOE or defeat?" debate by showing it is HOE that *functions* as defeat via likelihood ratios on the sampling process.
