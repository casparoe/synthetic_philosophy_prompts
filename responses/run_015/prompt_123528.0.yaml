prompt: |-
  I'm presenting a 25-minute paper to our philosophy of social science seminar defending the view that institutional kinds—contracts, currencies, citizenship statuses—do not instantiate universals but are sustained by iterated recognitional loops: patterns of normative deference that stabilize only within specific networks and dissolve when those networks are disrupted. I argue that the appearance of shared properties across contexts is generated by overlapping loops rather than by a common universal, and I replace the standard criterion of counterfactual robustness across deference chains with what I call local loop-stability, which explains institutional reality without metaphysical universals. The audience is eight people: three social ontologists in the institutional-realist tradition, two metaphysicians focused on grounding and essence, one legal philosopher who favors positivism but resists metaphysical baggage, one philosopher of economics who explains institutions by convention alone, and a graduate student who presses circularity objections. Draft my Q&A prep sheet: list the six or seven objections I will actually face, ordered from most damaging to least, each phrased as that specific audience member would phrase it, with a two-minute reply, a one-sentence note on where the reply is weakest, and a flag for the objection I am hoping nobody asks—namely, whether my account collapses into pure conventionalism and thereby strips contracts of the normative force that makes them binding rather than merely observed. For each reply, say how confident you are in its effectiveness; at the end of the sheet, identify the single point about which you are least sure. Keep the argument sketch in mind: local loop-stability is meant to capture reality without universals, but it must not reduce institutional facts to arbitrary agreement.
