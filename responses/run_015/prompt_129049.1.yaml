answer: |-
  Withdraw from the bid immediately and under no circumstances contact your competitor to discuss pricing or withdrawal.

  Contacting him to propose a price cap or a mutual exit is bid-rigging, which is a federal crime in most jurisdictions; you risk fines, blacklisting from public contracts, and potential jail time, so that option is off the table regardless of the business logic. Your brother's advice is economically correct regarding the sunk costs—the $18k is gone whether you quit now or after the next round—but it stops being useful when it ignores the cost of your compromised judgment. You are no longer bidding on profit margins; you are bidding on vengeance, and you cannot win a capital war against a competitor with deeper pockets and nothing to lose.

  The difference between continuing for money and continuing for spite is massive, but since you admit you can't tell which one is driving you, you must assume it's spite. Rational bidding requires cold calculation of risk versus reward, but your history with this guy means you will subconsciously undercut your own margins or overspend on proposal details just to ensure he loses, which turns a profitable contract into a break-even or loss-making headache. The city asking for three rounds of revisions is also a major red flag for scope creep and administrative incompetence; if the bidding process is this messy, the contract execution will be worse, and you do not want to be locked into a three-year deal with a client who doesn't know what they want while fighting a rival who can afford to underbid you.

  Regarding your crew, your reluctance is largely about ego, not their welfare. They would rather work for a boss who protects the company's cash flow than one who gambles the line of credit on a pride fight. Frame the withdrawal as a risk management decision: the city's constant revisions signaled an unstable scope that threatened the firm's liquidity, not as a loss against your former employee. You save the $5k for the next round, preserve your credit line for jobs with actual margins, and remove the distraction of this rivalry from your daily operations. Walking away now costs you $11k in sunk costs; winning this bid under these conditions could cost you the business.
