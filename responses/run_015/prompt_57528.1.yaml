answer: |-
  # Game Title: The Lakatos Protocol
  **Subject:** Fictional Astrophysics (Stellar Neutrino Decay)  
  **Time:** 90 Minutes  
  **Players:** 16 Students (4 Teams of 4)  
  **Materials:** Paper, pens, envelopes, printed Data Cards (provided below), whiteboard.

  ---

  ## 1. The Setup & Subject Matter
  **The Context:** It is the year 2150. Astronomers are measuring **Neutrino Decay Rates (NDR)** in distant stars.
  **The Data:** Each round, you receive a **Data Card** containing the *Mass* of a star and its observed *Decay Rate*.
  **The Goal:** Construct a mathematical formula (Auxiliary Hypothesis) that fits the data without breaking your programme's **Core Axioms**.

  **The Two Rival Programmes:**
  *   **Team Alpha (The Constantists):**
      *   **Hard Core:** *Decay rates are intrinsic to the particle and do not change based on external stellar fields.*
      *   **Negative Heuristic:** You may **not** introduce variables related to magnetic fields, spin, or external pressure. You may only adjust constants or mass multipliers.
  *   **Team Beta (The Resonants):**
      *   **Hard Core:** *Decay rates are modulated by the star's magnetic resonance frequency.*
      *   **Negative Heuristic:** You may **not** claim decay is constant. You **must** include a "Field Variable" in your formula.

  **The Scoring Mechanic (Surplus Content):**
  *   **Survival Point (10 pts):** Your formula fits the current round's Data Card.
  *   **Progressive Point (50 pts):** In Round *N*, you submit a **Sealed Prediction** for a specific value in Round *N+1*. If Round *N+1* reveals that value, you bank the points.
  *   **Degeneration Penalty:** If you change your formula solely to fit the current data without predicting anything new, you are "Saving the Phenomena." You get Survival Points, but you risk being overtaken by a programme that takes risks.
  *   **Core Violation:** Immediate disqualification (0 points).

  ---

  ## 2. Materials List
  1.  **4 Team Folders:** Each containing their Hard Core card and 5 blank "Hypothesis Sheets."
  2.  **5 Data Cards:** Held by you (the Tutor). Do not distribute all at once.
  3.  **Envelopes (8 total):** Two per team (for Sealed Predictions).
  4.  **Scoreboard:** Drawn on the whiteboard (Columns: Team A1, A2, B1, B2).
  5.  **Scorecards:** One per team (template below).

  ---

  ## 3. Round-by-Round Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-15** | **Briefing** | Distribute teams. Hand out Core Axioms. Explain rules. Emphasize: *Do not touch the Hard Core.* |
  | **15-25** | **Round 1** | **Data:** Mass 10, Rate 20. <br> **Task:** Create baseline formula. <br> **Outcome:** Both programmes fit easily (Rate = 2 × Mass). Everyone gets 10 pts. |
  | **25-35** | **Round 2** | **Data:** Mass 20, Rate 50. <br> **Task:** Adjust belt. <br> **Outcome:** Alpha fits easily (Rate = 2.5 × Mass). Beta struggles (must invent a "Field Factor"). Beta often fails to fit perfectly. **Alpha leads.** |
  | **35-45** | **Round 3** | **Data:** Mass 30, Rate 90. <br> **Task:** Adjust belt + **Sealed Prediction** for Round 4. <br> **Outcome:** Alpha patches formula (ad hoc). Beta finds the "Square Law" (Rate = Mass² / 10). Beta submits prediction for Round 4. Scores tied/Alpha slight lead. |
  | **45-55** | **Round 4** | **Data:** Mass 40, Rate 160. <br> **Task:** Reveal Beta's prediction. Adjust belt. <br> **Outcome:** Alpha patches again (getting complex). Beta's prediction matches exactly. **Beta banks 50 pts and overtakes.** |
  | **55-65** | **Round 5** | **Data:** Mass 50, Rate 250. <br> **Task:** Final adjustment. <br> **Outcome:** Alpha's formula is now unwieldy (3+ variables). Beta's formula holds naturally. Beta wins. |
  | **65-90** | **Debrief** | Map gameplay to Lakatosian vocabulary. Critique the simulation. |

  ---

  ## 4. The Data Script (For Tutor Eyes Only)
  *You must control the flow of information. Do not let teams see future cards.*

  *   **Round 1:** Mass = 10 | Decay = 20. *(Linear fits both)*
  *   **Round 2:** Mass = 20 | Decay = 50. *(Linear requires slope change. Alpha does this easily. Beta must invent a 'field' variable to explain the jump.)*
  *   **Round 3:** Mass = 30 | Decay = 90. *(Alpha must change slope again. Beta realizes Rate = Mass² / 10. Beta predicts Round 4 will be 160.)*
  *   **Round 4:** Mass = 40 | Decay = 160. *(Beta opens envelope, matches 160. +50 pts. Alpha must add a 'decay constant' to fit.)*
  *   **Round 5:** Mass = 50 | Decay = 250. *(Beta fits naturally. Alpha requires a 3rd variable.)*

  ---

  ## 5. Team Scorecard (Print 4 Copies)

  | Round | Data Fit? (Y/N) | Adjustment Made (Briefly) | Sealed Prediction? (Y/N) | Prediction Value | Prediction Correct? (Y/N) | Round Score |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | | | | | | |
  | **2** | | | | | | |
  | **3** | | | | | | |
  | **4** | | | | | | |
  | **5** | | | | | | |
  | **TOTAL** | | | | | | **_______** |

  **Rule Reminder:**
  *   Fit Data = 10 pts.
  *   Correct Prediction = 50 pts.
  *   Touching Hard Core = 0 pts (Disqualified).

  ---

  ## 6. The Debrief (Mapping Gameplay to Theory)
  *Do not lecture beforehand. Let them feel the frustration first. Use these questions to draw out the terms.*

  **1. The Hard Core & Negative Heuristic**
  *   *Ask:* "Did any team try to change the rule that 'Decay is intrinsic' (Alpha) or 'Decay depends on Fields' (Beta)?"
  *   *Explain:* "That rule you were forbidden to touch is the **Hard Core**. The instruction to deflect anomalies away from that core by tweaking the math instead is the **Negative Heuristic**."

  **2. The Protective Belt**
  *   *Ask:* "What did you actually change during the game?"
  *   *Explain:* "The formulas, multipliers, and variables you added constitute the **Protective Belt**. You sacrificed the simplicity of the belt to save the core."

  **3. Ad Hoc vs. Surplus Content (The Scoring)**
  *   *Ask:* "Team Alpha, you survived every round. Why did you lose?"
  *   *Ask:* "Team Beta, you almost quit in Round 2. What saved you?"
  *   *Explain:* "Alpha was **degenerating**: you were merely *saving the phenomena* (fitting past data). Beta was **progressive**: they risked a **Sealed Prediction** (surplus content). Lakatos argues science isn't about fitting what we know; it's about predicting what we don't."

  **4. Retrospective Appraisal**
  *   *Ask:* "At Round 2, who looked more scientific?" (Usually Alpha).
  *   *Ask:* "At Round 5, who looks more scientific?" (Usually Beta).
  *   *Explain:* "We could not judge the programmes in real-time. Only in hindsight (Round 5) could we see Beta was progressive. This is the **Retrospective Character of Appraisal**."

  ---

  ## 7. Critique: What Will Go Wrong & What The Game Misses
  *Be frank with your class. This section is for you to deliver in the final 10 minutes.*

  **Predictable Failures in the Room:**
  1.  **Core Violations:** Students will try to cheat the Hard Core to win points. *Correction:* Stop them immediately. The point is the constraint.
  2.  **Math Anxiety:** Students may freeze on the formula. *Correction:* Remind them the math can be nonsense (e.g., "Rate = Mass + Magic Number") as long as it is consistent. It's the *logic* of adjustment that matters.
  3.  **Collusion:** Teams might share formulas. *Correction:* Remind them they are rival research programmes competing for funding (points).

  **What The Game Cannot Reproduce (The Philosophical Gap):**
  1.  **The Nature of Anomalies:** In this game, I handed you anomalies on cards. In real science, anomalies are messy, disputed, and often ignored. A real scientist can say, "The telescope is broken," not "Here is a Data Card, deal with it."
  2.  **Time Lag:** In the game, prediction payoff is 10 minutes later. In reality, a bold conjecture (like Einstein's relativity) might wait decades for technology to catch up to verify it. A researcher might die before their programme is vindicated.
  3.  **The "Rational" Choice:** In the game, the points make the choice obvious. In history, scientists often stick to degenerating programmes (like Ptolemy) for generations because the rival programme (Copernicus) has *its own* anomalies. The game makes the transition look cleaner than it is.
  4.  **Social Factors:** The game ignores prestige, funding, and personality. Lakatos tries to make science rational, but Kuhn reminds us it is also sociological.

  **Closing Statement for the Tutor:**
  "This game mechanized Lakatos to show you the *structure* of his argument. But remember: Lakatos was trying to save rationality in science. He wanted to show we don't just swap theories because of a 'gestalt switch' (Kuhn), but because one programme objectively demonstrates more surplus content over time. Whether he succeeded in proving that... is your essay question."

  ---

  ## 8. Tutor's Cheat Sheet: Managing the Turnaround
  *To ensure Beta overtakes Alpha, you must enforce the scoring strictly.*

  *   **Round 2:** If Beta struggles, offer a hint: "Have you considered a non-linear relationship?" Do not give this hint to Alpha. This simulates the **Positive Heuristic** (a hint on how to develop the belt).
  *   **Round 3:** Ensure Beta writes a specific number in their envelope for Round 4. If they write "It will be high," reject it. It must be quantitative to count as *empirical* surplus content.
  *   **Round 4:** When revealing the data, build drama. Open Beta's envelope first. If it matches, make a show of awarding the 50 points. This is the moment the class feels the "Progressive Shift."

  **Contingency:** If Beta fails Round 3 completely (cannot fit the data), allow them to "pause" and revise without penalty, but they cannot submit a prediction. This simulates a programme stalling. If Alpha gets too far ahead, introduce a "Theoretical Consistency" bonus in Round 5 for the team with the simpler formula (Occam's Razor tie-breaker).
