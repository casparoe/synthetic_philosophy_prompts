answer: |-
  ### Part I: Systematic Translation of the Cluelessness Objection

  **The Setup: The Moral Agent as a Robust Learner**
  Let the moral agent be defined as a learning algorithm selecting a policy $\pi$ from a hypothesis class $\Pi$. The environment is a non-stationary Markov Decision Process (MDP) with state space $S$, action space $A$, and transition dynamics $P$. The "moral value" of an outcome corresponds to a reward signal $R(s, a)$, which is sparse, noisy, and heavily delayed (long-horizon). The objective is to minimize expected cumulative loss (or maximize utility) over a temporal horizon $T$. However, the agent faces **severe distribution shift**: the training distribution (historical data and proximate experience) diverges significantly from the test distribution (the long-range causal consequences of novel interventions).

  **The Argument for Cluelessness (The Epistemic Instability Thesis)**
  In decision-theoretic terms, the cluelessness objection asserts that **Empirical Risk Minimization (ERM)** is ill-posed for moral decision-making. Because the reward signal is delayed and the causal graph is high-dimensional, the sample complexity required to estimate the true risk function exceeds the agent's computational and observational limits.

  1.  **Out-of-Distribution (OOD) Generalization Failure:** The agent attempts to generalize from local, proximate data to global, distal outcomes. However, the branching causal structures imply that the test distribution lies far outside the support of the training data. Small errors in the initial state estimation compound over time, leading to catastrophic failure in **OOD generalization**. The agent cannot bound the regret because the variance of the reward estimator explodes over the horizon $T$.
  2.  **Adversarial Perturbations of the Data-Generating Process:** The social and ecological environment is not merely stochastic but effectively adversarial. Minor, unobservable perturbations in the initial conditions (the "butterfly effect") function as **adversarial perturbations** that maximize the agent's loss. Since the agent cannot distinguish between a robust causal link and a spurious correlation sensitive to these perturbations, any policy $\pi$ selected via ERM is vulnerable to worst-case scenarios that negate expected utility.
  3.  **Epistemic Budget Exhaustion:** The agent possesses a finite **epistemic budget**—a constraint on the confidence resources allocable across competing causal models. Under conditions of high social complexity, the budget must be spread thinly across a vast model class. No single causal model achieves dominance in sample; the posterior distribution over models remains diffuse. Consequently, the expected utility calculation integrates over too much uncertainty to yield a determinate gradient for policy update. The optimization landscape is flat or chaotic, providing no signal for improvement.

  **The Argument Against Cluelessness (The Robust Optimization Thesis)**
  Proponents of consequentialist feasibility argue that while perfect prediction is impossible, **robust optimization** provides sufficient guidance.

  1.  **Policy Classes Constrained by Complexity Bounds:** We need not optimize over the set of all logically possible policies. By imposing **complexity bounds** on the policy class $\Pi$ (e.g., restricting attention to heuristic rules or proximate effects), we reduce the variance of the estimator. This is analogous to regularization: we accept some bias in our utility estimation to drastically reduce variance, ensuring that the policy is learnable within the available epistemic budget.
  2.  **Distributionally Robust Optimization:** Instead of assuming a fixed data-generating process, the agent optimizes for the worst-case distribution within a confidence ball around the empirical distribution. If a policy yields positive expected utility even under **adversarial perturbations** of the transition dynamics, it is deemed robust. Cluelessness is mitigated not by knowing the future, but by selecting actions that are invariant to specific causal uncertainties.
  3.  **Signal Aggregation:** While individual long-range outcomes are noisy, the law of large numbers applies to repeated actions. By treating moral decision-making as a batch learning problem rather than a single-shot inference, the agent can rely on the convergence of average rewards. The **epistemic budget** is allocated not to tracing specific causal chains, but to estimating the mean reward of action types, allowing ERM to converge on a satisfactory policy despite local cluelessness.

  ***

  ### Part II: Residue Report

  This section identifies the fidelity loss incurred when mapping normative ethics onto robust statistical decision theory.

  #### 1. Translations Without Loss
  *   **"Ought Implies Can" $\leftrightarrow$ Learnability Conditions:** The ethical principle that moral obligation presupposes the capacity to fulfill it maps precisely to **PAC (Probably Approximately Correct) learnability**. If the sample complexity required to minimize risk exceeds the agent's data or compute constraints (the epistemic budget), then no valid policy exists within the class. In both frameworks, demanding optimization where the risk surface is unlearnable is a category error.
  *   **Moral Uncertainty $\leftrightarrow$ Model Uncertainty:** The ethical debate regarding how to act when unsure of the correct moral theory translates directly to **Bayesian Model Averaging** over competing reward functions. The allocation of the **epistemic budget** across moral theories is mathematically isomorphic to weighting loss functions in a multi-objective optimization setting.

  #### 2. Distorted Translations
  *   **Act-Utilitarianism vs. Rule-Utilitarianism $\leftrightarrow$ Point-wise Optimization vs. Regularized Policy Classes:**
      *   *Translation:* Act-utilitarianism maps to greedy ERM (optimizing per instance); rule-utilitarianism maps to selecting a constrained policy class (regularization).
      *   *Distortion:* In ethics, rules often carry deontic weight (promises must be kept *because* they are promises). In the statistical translation, rules are merely heuristics to reduce variance or computational cost. The *normative force* of the rule is reduced to an *instrumental efficiency* gain. The translation captures the structure of the decision but strips the rule of its intrinsic authority.
  *   **Intentions vs. Outcomes $\leftrightarrow$ Policy Parameters vs. Realized Trajectories:**
      *   *Translation:* Intentions map to the policy parameters $\theta$; outcomes map to the realized trajectory $\tau$.
      *   *Distortion:* Statistical decision theory is fundamentally consequentialist; it evaluates $\pi$ based on $E[R|\pi]$. An agent with "good intentions" (parameters initialized to favor altruism) that consistently generates high loss (bad outcomes) is simply a bad policy. The moral distinction where a well-intentioned failure retains moral worth is invisible to the loss function. The framework can model the *correlation* between intent and outcome, but not the independent normative value of the intent.

  #### 3. The Untranslatable Residue (Vanishing Concepts)
  *   **Non-Instrumental Value:** Statistical theory requires a defined loss function $L$. It cannot generate $L$; it can only minimize it. Ethical debates often concern the *constitution* of value (e.g., is happiness the only good?). This axiological question vanishes. The decision-theoretic framework treats value as an exogenous input, whereas ethics treats it as an object of inquiry.
  *   **Moral Luck:** In statistics, luck is **variance** or **noise** to be averaged out or bounded. We seek estimators that are unbiased by noise. In ethics, "moral luck" (e.g., two drivers act identically, but one hits a pedestrian) creates a genuine normative puzzle regarding blame and praise. The statistical framework resolves this by definition: if the expected risk is identical, the policies are identical. The *moral* residue of the actual outcome versus the expected outcome is erased by the expectation operator.
  *   **Omission vs. Commission:** In a standard MDP, "doing nothing" is simply action $a_{null}$. Unless explicitly weighted in the reward function, there is no structural asymmetry between causing harm via action and causing harm via inaction. The ethical distinction (that commission is often morally weightier than omission) must be hard-coded as a penalty term. It does not emerge from the geometry of the decision problem itself.

  ***

  ### Part III: Conclusion

  **Assessment: Robust Optimization or Systemic Blindness?**

  The translation suggests that **consequentialism is structurally isomorphic to robust statistical decision theory**, provided one accepts that the "moral loss function" is given. The problem of cluelessness is revealed to be primarily an **epistemic constraint on optimization** rather than a refutation of the consequentialist framework itself. The statistical vocabulary successfully models the *feasibility* of moral calculation: it demonstrates that under high distribution shift and limited epistemic budgets, ERM fails, and robust optimization (complexity bounds, worst-case analysis) is the only viable alternative.

  However, the **untranslatable residue** reveals that statistical decision theory is systematically blind to the **axiological and deontic dimensions** of moral reasoning.
  1.  **Axiological Blindness:** Statistics treats value as a scalar signal. It cannot account for the *qualitative* nature of value (e.g., dignity, rights) that resists aggregation into a single reward function.
  2.  **Deontic Blindness:** The framework cannot capture the normative asymmetry of omission vs. commission or the intrinsic worth of intentions without arbitrary external weighting.

  **Verdict:**
  Consequentialism is not *merely* applied robust optimization missing a few axioms; rather, robust optimization is the **engine** of consequentialist reasoning, but it lacks the **steering mechanism** of normative theory. The statistical vocabulary perfectly tracks the *epistemic* debate (can we know the consequences?), confirming that cluelessness is a problem of sample complexity and OOD generalization. However, it fails to track the *normative* debate (what makes consequences matter?).

  Therefore, the residue does not invalidate the translation for the specific problem of cluelessness, but it does demonstrate that solving the epistemic problem (via robust optimization) does not solve the ethical problem. We may be able to calculate the robustly optimal policy, but the statistical framework offers no resources to determine if that policy is *good*, only that it is *efficient* relative to a loss function it cannot justify. The "cluelessness" objection is successfully translated and addressed as a learning-theoretic bound, but the deeper ethical anxiety—that even perfect calculation might miss what matters—remains outside the model.
