answer: |-
  ### Examiner's Pre-Draft Analysis: Subtle Misconceptions

  1.  **Spatial Location as Intrinsic:** Students frequently treat "being at location L" as an intrinsic property. In a symmetric universe without an external grid, location is purely relational ("being 2 miles from the other sphere"). Failing to see that relational properties cannot ground numerical distinctness under strong PII is a common category error.
  2.  **Epistemic vs. Metaphysical Indiscernibility:** Students often argue that the spheres are distinct because "we could label them A and B." This conflates our ability to refer to objects (epistemic/logical) with the metaphysical ground of their distinctness. Black's challenge is whether there *is* a fact of the matter, not whether we can track it.
  3.  **Ungrounded Modal Differences:** When introduced to essential/accidental distinctions, students often accept them as brute facts. They fail to question what *grounds* the modal difference. If the only difference is "A is essentially F" and "B is accidentally F," but there is no qualitative ground for this modal status, the distinction may presuppose the numerical distinctness it aims to prove, rendering PII circular.

  ***

  ### Upper-Level Seminar Exam: Metaphysics of Identity

  **Time Allocation:** 90 Minutes
  **Word Guidance:** 1,500 – 2,000 words
  **Instructions:** Answer the following question. Your response must engage directly with the distinction between intrinsic and relational properties and address the worry of circularity.

  **Question:**

  Consider a modified version of the symmetric-universe scenario. The universe contains only two spheres, Alpha and Beta. They are identical in all qualitative, observational respects: same diameter, mass, temperature, and color. They stand in symmetric spatial relations to one another (e.g., each is exactly two miles from the other). There is no external space or observer to break the symmetry.

  However, suppose there exists a non-observational property *F*. Alpha instantiates *F* **essentially**, while Beta instantiates *F* **accidentally**. There is no qualitative ground for this modal difference; it is simply a brute fact about the spheres.

  Does this essential/accidental distinction save the Principle of Identity of Indiscernibles (PII) from the counterexample posed by the symmetric spheres, or does it render the principle circular by smuggling in an ungrounded intrinsic difference? In your answer, you must:
  1.  Explain why spatial relations alone cannot resolve the case.
  2.  Distinguish between intrinsic and relational properties in this context.
  3.  Evaluate whether ungrounded modal properties count as legitimate qualitative differences for PII.
  4.  Conclude whether this variant substantively defends PII or trivializes it.

  ***

  ### Model Answer

  **Move 1: The Insufficiency of Spatial Relations**
  The first step is to establish why the original symmetric scenario challenges PII. In this universe, spatial properties are purely relational. To say Alpha is "two miles from Beta" is not an intrinsic property of Alpha; it is a relation between Alpha and Beta. Because the universe is symmetric, Beta stands in the exact same relation to Alpha. If PII requires distinct objects to differ in their intrinsic properties, spatial relations fail to provide this difference. Even if we include relational properties in PII, the symmetry means the total set of relations for Alpha is identical to the total set of relations for Beta. Therefore, spatial configuration alone cannot ground numerical distinctness in this specific metaphysical setup.

  **Move 2: Analyzing Modal Properties as Intrinsic**
  The proposed variant introduces a modal difference: Alpha is essentially *F*, Beta is accidentally *F*. To determine if this saves PII, we must categorize this difference. Modal properties (properties about how an object exists across possible worlds) are typically treated as intrinsic because they concern the object's nature rather than its relation to other things. If "being essentially *F*" is a genuine property, then Alpha and Beta do differ qualitatively. Alpha has the property [Essentially *F*], while Beta has the property [Accidentally *F*]. On a surface reading, this satisfies the letter of PII: there is a qualitative difference between the two entities.

  **Move 3: The Circularity and Grounding Objection**
  However, satisfying the letter of PII is not enough; we must assess the metaphysical cost. The prompt stipulates there is "no qualitative ground" for this modal difference. This raises a circularity worry. Usually, an object's modal profile is grounded in its qualitative nature (e.g., a sphere is essentially round because of its shape). Here, the spheres are qualitatively identical in all observational respects. If the only reason Alpha is essentially *F* is that it is Alpha, then the modal property is not explaining the distinctness; it is presupposing it. We are effectively saying "Alpha is distinct because it has haecceity H," but disguising H as a modal property. This makes PII circular: it distinguishes objects by appealing to properties that are only distinct because the objects are already assumed to be distinct.

  **Move 4: Verdict on Substantive Defense vs. Trivialization**
  Consequently, this variant does not substantively save PII; it trivializes it. A substantive defense of PII requires that qualitative differences ground numerical distinctness. By allowing ungrounded modal differences, we permit the principle to be satisfied by facts that are metaphysically dependent on the very distinctness they are supposed to justify. While technically Alpha and Beta differ in properties, the difference is ungrounded haecceity in disguise. Therefore, the principle is preserved only at the cost of becoming tautological: objects are distinct because they have distinct properties, where "distinct properties" just means "properties tied to their distinctness." The robust metaphysical work PII is supposed to do is lost.

  ***

  ### Marking Scheme (Total 25 Marks)

  **Move 1: Spatial Relations & Symmetry (6 Marks)**
  *   **Criteria:** Clearly explains that spatial relations are extrinsic/relational and symmetric in this scenario, thus failing to provide an intrinsic differentiator.
  *   **Allocation:** 6 marks for correct identification of relational symmetry; 0 marks if spatial location is treated as intrinsic.
  *   **Characteristic Mistake:** Treating "being on the left" or absolute location as an intrinsic property available in a relation-only universe.

  **Move 2: Modal Properties as Intrinsic (6 Marks)**
  *   **Criteria:** Correctly identifies modal status (essential vs. accidental) as a candidate for intrinsic property and analyzes its fit within PII formulations.
  *   **Allocation:** 6 marks for nuanced analysis of modal properties; 3 marks if simply accepted without analysis.
  *   **Characteristic Mistake:** Equating modal status directly with qualitative character without questioning its grounding.

  **Move 3: Circularity & Grounding (6 Marks)**
  *   **Criteria:** Articulates the worry that ungrounded modal differences presuppose numerical distinctness, leading to circularity.
  *   **Allocation:** 6 marks for clear articulation of the grounding problem; 0 marks if circularity is ignored.
  *   **Characteristic Mistake:** Ignoring the grounding requirement and accepting the modal difference as a brute fact without metaphysical cost.

  **Move 4: Final Verdict (5 Marks)**
  *   **Criteria:** Concludes whether PII is saved or trivialized, consistent with the previous analysis.
  *   **Allocation:** 5 marks for a consistent, justified verdict; 2 marks if the conclusion contradicts the analysis.
  *   **Characteristic Mistake:** Offering an ambiguous conclusion that claims PII is both saved and trivialized without resolution.

  **Clarity and Structure (2 Marks)**
  *   **Criteria:** Argument is coherent, follows the four moves, and stays within word limits.
  *   **Allocation:** 2 marks for high clarity; 0 marks for disjointed or obscure writing.
  *   **Characteristic Mistake:** Failing to structure the essay around the required philosophical moves.

  ***

  ### Calibration Note

  **Calibration of Standards:**
  This question is designed to separate students who grasp the metaphysical crux of identity from those who have only memorized the labels "monumental," "antiquarian," and "critical"—wait, correct yourself: from those who have only memorized the standard summary of Black's argument. Students who have merely memorized the standard summary will likely accept the essential/accidental distinction as a straightforward solution, awarding points for Move 2 but failing Move 3. They will treat the modal difference as a magic bullet without probing its grounding. Students who understand the metaphysical crux will recognize that an ungrounded modal difference is functionally identical to a haecceity. They will lose marks on Move 2 if they do not question the legitimacy of the property, but will gain full marks on Move 3 by identifying the circularity. The distinction lies in recognizing that PII is not just a logical formula to be satisfied, but a metaphysical principle requiring qualitative grounding.
