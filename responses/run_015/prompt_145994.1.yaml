prompt: |-
  You are a senior philosophy examiner specializing in metaphysics and philosophy of science. Before drafting anything, briefly brainstorm three subtle misconceptions students often hold about Black's symmetric-universe scenario and the Principle of Identity of Indiscernibles—errors that go beyond misremembering the spheres themselves. Then design one 90-minute, upper-level seminar exam question that treats Black's spheres not as a recall exercise but as the basis for a modified metaphysical problem: present a variant universe containing only two spheres that are spatially symmetric and observationally identical, except that one instantiates property F essentially while the other instantiates F only accidentally, where F has no observational manifestation. Ask the student to determine whether this essential/accidental distinction saves the Principle of Identity of Indiscernibles from Black's counterexample, or whether it makes the principle circular by smuggling in an ungrounded intrinsic difference; require them to distinguish intrinsic properties from relational ones and to explain why spatial relations alone cannot resolve the case.

  Provide all of the following in a self-contained format with no bibliographies, citations, or reading lists:
  - The exam question, with explicit guidance on length and time allocation.
  - A model answer built around exactly four required philosophical moves.
  - A marking scheme totaling 25 marks, allocating specific points to each move plus 2 marks for clarity, and including for each move a one-line note on the characteristic mistake that should cost marks.
  - A brief calibration note explaining how the question separates students who understand the metaphysical crux from those who have only memorized the labels "monumental," "antiquarian," and "critical"—wait, correct yourself: from those who have only memorized the standard summary of Black's argument.

  Think step by step, and ensure the difficulty comes from forcing engagement with the circularity worry rather than from obscurity.
