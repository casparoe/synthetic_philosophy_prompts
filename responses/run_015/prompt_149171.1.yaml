answer: |-
  Here are nine questions designed to corner the therapeutic reading of Wittgenstein, each with a follow-up tailored to her inevitable deflection.

  **1. The Triviality Objection**
  If family resemblance isn't a theory, it shouldn't make empirical claims. But the moment you specify *which* resemblances count as relevant, haven't you quietly collapsed into a cluster or disjunctive theory? If *any* overlapping similarity will do, isn't the claim trivial—since everything resembles everything in some respect?
  *   **Likely Answer:** "You're treating a grammatical remark as an empirical hypothesis. Wittgenstein isn't listing criteria; he's dissolving the demand for them."
  *   **Follow-up:** "If the remark makes no claim about how concepts actually function, what work is it doing? Is it just a suggestion to stop talking, or does it have normative force? If it's the latter, isn't that a theory of how we *ought* to speak?"

  **2. The Materiality of Genre**
  I write novels that get shelved as literary fiction. But those borders aren't drawn by ordinary use; they're policed by prizes, MFA workshops, and bookstore categorization. Can "novel" truly be a family-resemblance concept if the 'resemblances' are enforced by institutional gatekeepers rather than organic language-games?
  *   **Likely Answer:** "Institutions are part of the language-game. The 'use' includes the shelving and the prize committees. You're still looking for a pure definition outside of practice."
  *   **Follow-up:** "If the 'use' is determined by power dynamics rather than shared understanding, does the family-resemblance remark obscure the violence of that categorization? Does calling it a 'game' sanitize the fact that some people get to decide who wins?"

  **3. The Village Case**
  Imagine a village whose word we translate as *game* covers chess, lawsuits, and flirting, but explicitly excludes football. There is total agreement on every particular case between them and us, yet the extension differs. Do they share our concept? If meaning is use, and the use diverges, how is translation even possible?
  *   **Likely Answer:** "They don't share our concept. 'Game' is not a universal category. You're assuming a shared essence where there is only a specific form of life."
  *   **Follow-up:** "But if we can't assume a shared concept, on what basis did we translate their word as 'game' in the first place? If there's no common thread, isn't translation just an act of colonial imposition?"

  **4. Learning and Rule-Smuggling**
  You say we learn words through training and examples, not rules. But when a child learns "game," doesn't the example function as a rule for future application? Doesn't language-game talk smuggle the rules back in under the guise of "custom" or "practice"?
  *   **Likely Answer:** "Training (*Abrichtung*) is causal, not normative. You're conflating the justification of a rule with the cause of an action. I'm not explaining how learning happens; I'm describing the grammar of 'learning'."
  *   **Follow-up:** "If you refuse to explain how learning happens, how do you account for error? If I apply the word differently than you, and there's no rule to appeal to, is it just a mismatch of training? Who decides who is mistaken?"

  **5. Falsifiability**
  I need to know what counts against the view. If family resemblance is a reminder and not a theory, is it immune to evidence? What observation would make you say, "Actually, this concept *does* have a common essence"?
  *   **Likely Answer:** "Nothing would count against it, because it's not a hypothesis. It's a perspicuous representation of our grammar. You're asking for verification conditions for a rule of description."
  *   **Follow-up:** "If nothing counts against it, isn't it dogma? A view that cannot be wrong cannot be right, either. It becomes a blind spot rather than a tool."

  **6. The Essence of the Reminder**
  Is there a family resemblance between the various instances of "family resemblance"? Or does *that* concept have an essence? If you say every concept is loose except "family resemblance," haven't you just found the one essence you told me didn't exist?
  *   **Likely Answer:** "That's a trap. 'Family resemblance' isn't a concept in the same way 'game' is. It's a philosophical tool. You're reifying the tool."
  *   **Follow-up:** "But if the tool itself relies on the very logic it seeks to dismantle, doesn't the whole method collapse into self-reference? Are you using language to step outside of language?"

  **7. Exclusion and Silence**
  Family resemblance sounds inclusive, but concepts work by exclusion. When I say "this is not a poem," I'm drawing a line. If we dissolve the definition, do we lose the ability to critique? Can I say a work is *bad* because it fails the resemblance, or is that just my preference?
  *   **Likely Answer:** "Criticism is also a language-game. You don't need an essence to judge. You're craving a foundation for your taste that isn't there."
  *   **Follow-up:** "If my judgment rests only on my local language-game, how do I argue with someone outside my circle? Does this view force us into isolated silos where no aesthetic argument is ever resolved?"

  **8. The End of Philosophy**
  If the goal is to dissolve the demand for definition, what is the end state? Do we stop asking questions? If I come to you with a philosophical problem, is the only successful outcome that I stop speaking?
  *   **Likely Answer:** "The goal is peace. The problem arises when language goes on holiday. I want you to bring words back from their metaphysical to their everyday use."
  *   **Follow-up:** "But writers send language on holiday on purpose. If your therapy cures me of the desire to metaphysicize, does it also cure me of the desire to write metaphor? Is philosophical peace incompatible with poetic ambiguity?"

  **9. The Writer's Utility**
  I have to pitch my book to an agent next week. They need to know if it's a novel. If I tell them "novel is a family-resemblance concept and I resist the definition," I won't get published. Is Wittgensteinianism useless for anyone who has to operate within the structures it describes?
  *   **Likely Answer:** "Philosophy leaves everything as it is. It doesn't solve practical problems. You're using a grammatical investigation to solve a marketing problem."
  *   **Follow-up:** "If philosophy leaves everything as it is, why do it? If it can't intervene in the real structures that govern my life—like the bookstore shelf— isn't it just a private consolation for people who don't have to sell their words?"
