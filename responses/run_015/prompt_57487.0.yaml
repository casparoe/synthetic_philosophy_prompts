answer: |-
  Let's map Fomenko's "New Chronology" directly onto Popper's framework to see where the logic holds and where it snaps.

  ### 1. Mapping the Theory for Falsification

  To apply falsifiability, we first have to treat the "New Chronology" not as a conspiracy theory but as a set of empirical assertions. It is a bundle, but we can isolate the falsifiable cores.

  *   **Claim A (Compressed Timeline):** Written history does not exist prior to ~800 AD. Everything labeled "Ancient" is actually Medieval.
      *   *Potential Falsifier:* A single manuscript, inscription, or artifact that can be independently verified as created pre-800 AD without relying on the disputed historical chronology.
  *   **Claim B (Astronomical Retro-calculation):** Ancient astronomical records (eclipses, star positions) match medieval dates, not the dates assigned by historians.
      *   *Potential Falsifier:* Astronomical software or calculation showing that the recorded celestial events *could not* have occurred in the medieval period Fomenko proposes, but fit perfectly in the accepted ancient timeline.
  *   **Claim C (Methodological Circularity):** Radiocarbon dating and dendrochronology are invalid because they are calibrated against the very historical timeline they are supposed to verify.
      *   *Potential Falsifier:* A dating method that relies on physical constants or events independent of human history (e.g., volcanic ash layers tied to ice core data) that confirms the pre-800 AD timeline.

  **The Relevant Community:**
  For Popper, the "community" isn't just the public; it's the relevant field of critical discussants. For Fomenko, this should have been a joint tribunal of mathematicians (his peers), historians, astronomers, and physicists. In the 1980s, inside the Soviet Academy, the community was fractured. The historians were state-employed guardians of orthodoxy; the mathematicians were Fomenko's peers who respected his technical skill but weren't equipped to judge the historical claims.

  **1980s vs. Now:**
  *   **1980s/90s View:** From the inside, this looked like a "bold conjecture." Popper loved bold conjectures that risked refutation. Fomenko was a credentialed insider challenging a dogma. In the chaos of the Soviet collapse, the "authorities" (historians) lost credibility, making Fomenko's challenge look like genuine scientific revolution.
  *   **Current View:** It looks like a zombie theory. The specific predictions (e.g., specific astronomical alignments) were calculated by independent astronomers and found to be incorrect. The physical evidence (artifacts, stratigraphy) overwhelmingly contradicts the compressed timeline.

  ### 2. The Verdict: Science that Lost or Pseudoscience?

  Here is your core tension: Fomenko made risky predictions. Tests were run. The tests came back negative. By a strict reading of Popper, this looks like **science that happened to lose**, not pseudoscience. A theory that is falsified is still scientific; it's just false.

  So why does it feel like pseudoscience? Because of what happened *after* the falsification.

  Popper anticipated this. He called it the **"conventionalist stratagem"** (or immunizing stratagem). This is when a theorist saves their theory from refutation not by adjusting the theory to fit the facts, but by redefining the facts, attacking the instruments, or questioning the competence of the observers.

  Fomenko's move on radiocarbon dating is a textbook conventionalist stratagem. He argues that because the calibration curves use historical artifacts, the dating is circular.
  *   **Popper's Counter:** Popper admits observation is theory-laden. He doesn't demand absolute certainty, only that the scientific community agrees on "basic statements" (e.g., "this counter clicked," "this tree ring exists"). If you reject *all* basic statements because they might theoretically be circular, you stop doing science. You are no longer testing; you are insulating.

  **Does Falsifiability give the right verdict?**
  Yes, but it relies on a hidden sociological premise. For falsifiability to work, the scientist must *agree to be bound by the result*. Fomenko invokes the *form* of science (math, astronomy, testing) but rejects the *norm* of science (accepting negative results).
  *   **The Verdict:** It starts as science (falsifiable conjecture) and becomes pseudoscience (immunization against falsification).
  *   **The Reason:** Popper's criterion isn't just about the logical structure of the statement; it's about the *attitude* of the proponent toward criticism.

  **Does this rely on "good faith"?**
  Yes. This is the crack in Popper's armor. To identify the immunizing stratagem, you have to judge whether the counter-argument (e.g., "dating is circular") is a genuine methodological critique or a dodge. In Fomenko's case, it's a dodge, because dendrochronology can be cross-verified with volcanic events that have nothing to do with human history. But determining that requires expertise. Popper's logic assumes a rational community that can spot the dodge. In 1990s Russia, that community was compromised.

  ### 3. Where Falsifiability Breaks

  Falsifiability breaks on the **credentials and context** issue.

  Popper's demarcation is content-based. It doesn't matter if you are a professor at Moscow State or a guy in a basement; if the logic is the same, the demarcation is the same. But Fomenko's case proves that **demarcation is partly social.**

  1.  **The Authority Problem:** Fomenko's math credentials acted as a "halo." In a Popperian world, his math PhD is irrelevant to his history claims. In the real world, it gave his pseudoscience a shield. A layperson claiming the same thing would have been ignored. Fomenko was treated as a "dissident scientist" rather than a "mathematician out of his depth." Falsifiability cannot account for the weight of authority.
  2.  **The Institutional Collapse:** Popper assumes a functioning "critical tradition." In the post-Soviet vacuum, the institutions that normally filter error (peer review, academic departments) collapsed or were distrusted. Falsifiability assumes the existence of a community capable of performing the falsification. When that community is fractured, a theory can survive falsification simply because there is no consensus on *who* gets to wield the falsifying hammer.
  3.  **The "Circularity" Trap:** Fomenko's claim that dating is circular exploits a genuine philosophical problem (theory-ladenness). Popper says we must accept some basic statements by convention to get anything done. Fomenko refuses that convention. Falsifiability can't logically prove him wrong here; it can only say, "If you play by that rule, you aren't playing science." But since science *is* a social game, if enough people agree to play by Fomenko's rules (as many in Russia did), the logical criterion loses its bite.

  ### 4. Popper vs. Lakatos vs. The Pseudo-Problem

  **Lakatos (Research Programmes):**
  Lakatos improves on Popper here. He distinguishes between the "hard core" (history is fake) and the "protective belt" (dating is wrong, astronomers are mistaken).
  *   **Progressive vs. Degenerating:** A scientific programme is progressive if it predicts *novel* facts. A degenerating programme only explains away anomalies.
  *   **Application:** Fomenko's programme is degenerating. It hasn't successfully predicted a new discovery; it only re-interprets old data to fit the compression. Every time evidence contradicts him, he adds a new layer to the protective belt (e.g., "that artifact was planted," "that method is flawed").
  *   **Advantage:** Lakatos handles the *time* element better. It explains why it looked okay in the 80s (early stage conjecture) but is clearly pseudoscience now (decades of degeneration).
  *   **Limit:** Like Popper, it still focuses on the intellectual content. It doesn't fully explain why a degenerating programme gained 30% popularity in a nation.

  **Demarcation as a Pseudo-Problem:**
  This position argues there is no sharp line between science and non-science, only a gradient of credibility and institutional endorsement.
  *   **Application:** This handles the Fomenko episode best. It acknowledges that Fomenko used scientific *tools* (math, statistics) but applied them outside their valid domain. It explains the popularity not as a failure of logic, but as a failure of trust. The Russian public didn't choose Fomenko because his falsifiability score was high; they chose him because he was an insider attacking a discredited state narrative.
  *   **Advantage:** It accounts for the credentials and the political context. It explains why a "false" science can thrive without needing to classify it as logically distinct from "true" science.
  *   **Limit:** It risks relativism. If there's no line, how do we justify teaching physics instead of New Chronology?

  ### 5. Which Handles it Best?

  **Lakatos** gives the best account of the *intellectual trajectory*. It explains why Fomenko shifted from a bold theorist to a dogmatist. It captures the "degenerating" nature of the work—adding ad hoc hypotheses to save the core.

  However, the **Sociological/Pseudo-Problem view** gives the best account of the *episode as a whole*. Fomenko's New Chronology isn't just a set of claims; it's a social phenomenon. Popper and Lakatos treat science as a conversation of ideas. The Fomenko case proves science is also a system of institutions. When the institutions (Academy of Sciences, universities) lost authority, the demarcation line blurred.

  **The Final Verdict on Falsifiability:**
  Falsifiability is necessary but not sufficient.
  *   **Necessary:** If Fomenko's claims weren't testable (e.g., "God willed history to look old"), it would be instant pseudoscience. Because they *are* testable, it took decades to kill.
  *   **Not Sufficient:** Because Fomenko passed the "testable" check, he gained entry. The criterion failed to stop him because it cannot police the *response to failure*.

  Fomenko shows that you can satisfy Popper's logical criterion while violating the scientific *ethos*. You can be falsifiable and still be a pseudoscientist if you treat falsification as a negotiation rather than a verdict. Popper hints at this with the "critical attitude," but he treats it as an individual moral choice. Fomenko proves it's an institutional requirement. Without a community that enforces the acceptance of negative results, falsifiability is just a game of moving goalposts.

  So, to answer your specific worry: It feels wrong to call it "science that lost" because science that *loses* accepts the loss. Fomenko didn't lose; he refused to play the game by the rules of scoring. Popper's criterion identifies the moves, but it takes a sociological lens to identify that the scoreboard was being tampered with.
