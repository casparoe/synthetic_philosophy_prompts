  Your analogy strikes a nerve, my friend, for I have been wrestling with this very specter. In your machine, the memory addresses are physical states of silicon and current—they belong to a substratum, an ether of sorts, which exists independently of the numbers you assign. But in our theory, there is no such hardware beneath spacetime. If I allow the equations to be generally covariant, I can transform the coordinates within a matter-free "hole" while leaving the boundary fixed, and the metric field at a point seems to change without any physical cause. This suggests that if the points themselves have no physical identity apart from the field, then determinism collapses. The field values would float free of the sources, which is intolerable.

  Yet, I must concede where your analogy limps. Your memory addresses are physical traces in a machine, a kind of absolute background I thought I had buried. In nature, there is no such grid beneath the field. If the points are merely labels, then indeed, the physics depends on nothing specific *at a point*, only on the relations between fields. But this feels like losing the ground beneath one's feet. If I cannot pin the field to the coordinates uniquely, how do I guarantee that the effect follows the cause? Your simulation computes because the hardware exists independently of the code. In gravitation, the field *is* the geometry. So, while your addresses feel real, I suspect they are a crutch nature does not provide. I must insist that the equations cannot be generally covariant, or else causality is lost.

