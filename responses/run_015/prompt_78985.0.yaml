  You are a philosopher working in normative ethics, with a specialist's command of the literature on interpersonal aggregation, distributive justice, and the moral standing of individuals — the cluster of arguments usually filed under the heading of the separateness of persons. Work through this slowly and carefully rather than fluently, and do not settle for the textbook version of any position: I want the distinctions that a specialist would insist on, and if you must choose between brevity and precision, choose precision.

  A friend has sent me a paragraph from a short book on applied ethics written for general readers. I find it broadly persuasive, but something in the last third seems off, and I would like an audit rather than a lecture. Here is the paragraph, as the author wrote it:

  Of all the objections to utilitarianism, the separateness of persons is the deepest and the most damaging. It was introduced by Rawls and developed by Nozick and Nagel, and it holds that utilitarianism treats a society as if it were a single person: it pools everyone's pleasures and pains into one total and then tries to make that total as large as possible, in the way a prudent individual might accept a painful morning at the dentist in exchange for a comfortable week afterwards. Between persons, however, no such exchange is available, because you and I are not parts of a larger whole; each of us is a separate life, and no one's loss is made up for by anyone else's gain. Because the theory's whole structure depends on the pooling, this objection is widely agreed to be fatal to act utilitarianism, and it is the reason serious utilitarians retreat to rule utilitarianism, which escapes it by asking only which rules maximize the total. It also explains why utilitarianism is such a demanding morality: if only the total matters, then my own projects and commitments count for nothing when weighed against the greater sum. The transplant surgeon case makes the point concrete: an act utilitarian is forced to say that killing one healthy patient to save five is right, and no amount of tinkering with the theory can avoid that verdict.

  I do not need citations, and I would rather you not supply titles, page numbers, or attributed wordings — I have no way to check them, and your own reconstruction will serve me better. What I want is the following, in order.

  1. Begin with a short inventory of the distinct objections that travel under this heading. I have the impression that several different complaints are being run together here, and I want them separated, each stated in a sentence or two in your own words: the complaint about pooling or about a single subject of compensation, whatever Rawls's own version amounts to, the utility-monster-style argument, the integrity or alienation objection, the demandingness objection, the distribution-insensitivity objection, and anything else that genuinely belongs. For each, say in a phrase what it targets and what it does not.

  2. Then go through the paragraph claim by claim, sentence by sentence where that is the natural unit. For each, say whether it is an accurate statement of utilitarianism, a defensible simplification, or a misrepresentation; where a defender would object, state the objection the way the defender would put it. Flag especially any place where the author slides from a metaphor into a literal claim about what the theory is committed to, and any place where one objection is offered as though it were another.

  3. Assess the argument's spine, which I take to be this chain: the pooling is the theory's structure; therefore the objection is fatal to act utilitarianism; therefore serious utilitarians go in for rule utilitarianism; therefore the same structure explains the theory's demandingness. Tell me which links hold, which are overstated, and which are the wrong kind of claim altogether. On the rule-utilitarian link, give me both the strongest version of the reply that it does not escape the objection and the strongest reply that it does.

  4. Consider the standard defensive moves on the utilitarian's side — an appeal to a veil-of-ignorance derivation in which each person's prospects are weighted equally, the denial that any subject of compensation is required for aggregation to be justified, and a shift to a form of consequentialism that is sensitive to distribution — and say for each whether it engages the objection or changes the subject.

  5. Tell me what survives. Once the paragraph's errors are corrected, is there still a serious objection here, and what exactly is its strongest form? Then rewrite the paragraph at roughly the same length, as a careful popularizer would write it: no howlers, no overstatement, and the distinct objections kept apart. Close by saying plainly which of the author's conclusions I should stop believing.
