answer: |-
  Here is a conceptual map of the distinct theses contained within the phrase "money is speech," ordered from the trivial to the radical. Each entry isolates a specific claim, evaluates its truth conditions, and tests it against your specific policy context, including the "conversion problem" you identified.

  ### 1. The Instrumental Thesis
  *   **The Claim:** Money is a necessary tool for amplifying speech in a modern mass society; without resources, speech cannot reach an audience.
  *   **Conditions for Truth:** This requires that media markets exist where access is priced, and that organic reach (unpaid speech) is insufficient for political competitiveness.
  *   **Classification:** **Trivial.** It is an empirical observation about the cost of communication, not a moral or legal identity.
  *   **Support for Objections:** **Neither.** Acknowledging that money helps speech does not logically forbid regulating how money is raised or spent. One can agree money is useful while agreeing it should be capped to prevent corruption or distortion.
  *   **Contributions vs. Own Spending:** Covers **both**. Contributions are simply pooling resources to purchase amplification.
  *   **Disclosure Requirements:** **Compatible.** Disclosure regulates transparency, not the instrumental utility of the funds.
  *   **Supports Program?** **Yes (Cuts the other way).** If money is the tool for speech, then providing public tools (matching funds) to candidates who lack private wealth *increases* the total amount of speech, fulfilling the instrumental goal.

  ### 2. The Expressive Conduct Thesis
  *   **The Claim:** The act of spending money (or contributing it) is itself a symbolic gesture that conveys a message independent of the ads or materials purchased.
  *   **Conditions for Truth:** This requires that the allocation of resources is understood by observers as a signal of intensity, commitment, or solidarity, distinct from the content of the advertisement bought.
  *   **Classification:** **Substantive but Defensible.** Burning a flag is conduct treated as speech because of its symbolic message; spending \$1 million on a race similarly signals intense political commitment.
  *   **Support for Objections:** **Objection 1 (Caps).** If the spending act is itself the speech, then a cap limits the expressive act, regardless of how many ads actually run.
  *   **Contributions vs. Own Spending:** Covers **both**, though stronger for contributions (associational expression) than candidate spending (which is often viewed as mere logistics).
  *   **Disclosure Requirements:** **Tension.** If the act of giving is expressive, forcing disclosure might chill that expression by exposing the donor to retaliation, though it does not ban the act.
  *   **Supports Program?** **No.** Matching funds do not protect the candidate's personal expressive act of spending their own resources; they substitute public resources for private ones.

  ### 3. The Isomorphic (Identity) Thesis
  *   **The Claim:** A dollar is semantically equivalent to a unit of speech; therefore, regulating the dollar is identical to regulating the content or volume of the speech itself.
  *   **Conditions for Truth:** This requires that the "conversion problem" does not exist—that there is a fixed, 1:1 exchange rate between currency and communicative reach, and that money has no non-speech uses in a campaign context.
  *   **Classification:** **False.** As you noted, the exchange rate varies by medium, saturation, and market conditions. A spending cap limits dollars, not necessarily ideas (a candidate could spend less but speak more efficiently). Money is a medium for speech, not speech itself.
  *   **Support for Objections:** **Both.** This is the strongest foundation for the opponent's argument. If money = speech, then caps are censorship (Obj 1) and matching funds are government editing of the speech landscape (Obj 2).
  *   **Contributions vs. Own Spending:** Covers **both** indiscriminately.
  *   **Disclosure Requirements:** **Incompatible.** If money is speech, tracking its flow is akin to tracking a speaker's words, which raises significant privacy and chilling concerns.
  *   **Supports Program?** **No.**

  ### 4. The Market Neutrality Thesis
  *   **The Claim:** The "marketplace of ideas" has a natural equilibrium of volume determined by private support; government intervention to amplify some speakers (via matching) inherently silences or drowns out those who do not receive amplification.
  *   **Conditions for Truth:** This requires that audience attention is a zero-sum game (one person speaking louder makes another inaudible) and that the state has no legitimate interest in correcting market failures in political attention.
  *   **Classification:** **Radical.** It treats the existing distribution of wealth as the "natural" baseline for speech rights and views any state alteration as a distortion.
  *   **Support for Objections:** **Objection 2 (Matching Funds).** This directly argues that subsidizing some candidates alters the relative volume of the race to the detriment of unsubsidized opponents.
  *   **Contributions vs. Own Spending:** Primarily concerns **Own Spending** (or the aggregate spending of the campaign), as it focuses on the final volume in the marketplace.
  *   **Disclosure Requirements:** **Compatible.** Disclosure does not alter the volume, only the transparency of the source.
  *   **Supports Program?** **No.** This thesis views the program as a distortion rather than an enhancement.

  ### 5. The Anti-Penalty (Coercion) Thesis
  *   **The Claim:** Conditioning a government benefit (matching funds) on the surrender of a right (unlimited spending) is coercive, effectively penalizing the candidate for exercising their full speech rights.
  *   **Conditions for Truth:** This requires that the "penalty" (the spending cap) is sufficiently burdensome that a reasonable candidate feels compelled to accept the funds to remain competitive, making the "voluntary" program functionally mandatory.
  *   **Classification:** **Substantive but Defensible.** This is a standard unconstitutional conditions argument. It turns on the magnitude of the matching multiple and the severity of the cap.
  *   **Support for Objections:** **Objection 1 (Caps).** It argues the cap is not a voluntary contract term but a coercive lever.
  *   **Contributions vs. Own Spending:** Focuses on **Own Spending** limits imposed on the candidate.
  *   **Disclosure Requirements:** **Compatible.** Disclosure is rarely viewed as a penalty severe enough to constitute coercion in this context.
  *   **Supports Program?** **No.** It attacks the conditional structure of the program.

  ### 6. The Access (Enabling) Thesis
  *   **The Claim:** Because money is the primary barrier to entry for speech, the state has an affirmative obligation to ensure speakers have sufficient resources to be heard; restricting private money without providing public money suppresses speech.
  *   **Conditions for Truth:** This requires that the lack of private funding is a structural barrier to participation that the state can and should remedy to ensure a robust marketplace of ideas.
  *   **Classification:** **Substantive but Defensible.** This flips the script: "Money is speech" means "Denying money is silencing."
  *   **Support for Objections:** **Neither.** This thesis undermines the opponent's position.
  *   **Contributions vs. Own Spending:** Covers **both**, but emphasizes small **Contributions** (which the matching fund multiplies) to empower non-wealthy speakers.
  *   **Disclosure Requirements:** **Compatible.** Ensuring public funds are used for speech requires accountability.
  *   **Supports Program?** **Yes (Cuts the other way).** This is the strongest conceptual defense of your bill. It argues that matching funds *protect* speech by ensuring candidates who lack wealthy networks can still amplify their message.

  ***

  ### The "Usual" Reading and Its Survival

  When opponents say "money is speech" out loud, they are usually reaching for a conflation of **Thesis 2 (Expressive Conduct)** and **Thesis 3 (Isomorphic Identity)**.

  They intend the moral weight of Thesis 2 (spending is a meaningful, expressive act of liberty) but rely on the logical rigidity of Thesis 3 (regulating dollars is literally regulating speech) to win the argument.

  **Does it survive precision?**
  **No.** When forced to separate the two, the argument fractures.
  1.  If they retreat to **Thesis 2**, they must admit that conduct can be regulated (e.g., you can express solidarity by burning a draft card, but you cannot express solidarity by buying a judge). The "expressive" value of spending does not grant immunity from corruption prevention.
  2.  If they insist on **Thesis 3**, they run directly into your **conversion problem**. Because the exchange rate between dollars and audiences is variable and market-dependent, a cap on dollars is not a cap on speech volume. A candidate can speak *more* with *less* money if their message resonates, or speak *less* with *more* money if the market is saturated.

  The phrase works rhetorically because it hides the conversion step. It assumes a frictionless world where \$1 always equals 1 unit of influence. In the real world, where your matching fund program operates, that friction is exactly where the policy does its work: decoupling the volume of speech from the concentration of wealth.
