      *Wait, one more thing:* The user mentions "hiding symptoms or dropping out." In 1899, "dropping out" wasn't really an option for severe cases; they were institutionalized. So the "silence" is more likely institutional withdrawal. I need to make sure I contextualize the "dropout" idea within the asylum system of the time.

