answer: |-
  # Sidebar: The "Is It AI?" Intuition Test

  *You know the feeling: a draft comes in, and you can't shake the sense that it's "mostly human" but "partially machine." But when your editor asks for a binary decision for the disclosure label, you freeze. This quiz isn't about policy; it's about how you process the gray areas. Answer based on your gut reaction to the scenarios below.*

  **1. The 10% Draft**
  A reporter submits a feature story. You run a check: 10% of the sentences were generated by a model, but the reporter verified every fact and rewrote the flow. The rest is theirs. Is this piece "AI-generated"?
  *   **A.** No. It's human-written. There has to be a line somewhere, and this is clearly on the human side of it.
  *   **B.** It's neither "AI-generated" nor "human-written." It falls in a gap where the label doesn't apply.
  *   **C.** It's 0.9 human and 0.1 AI. The label should reflect that mix, not force a choice.
  *   **D.** It depends. If it's a blog post, it's human. If it's an investigative piece, that 10% might make it "AI-assisted."
  *   **E.** The label "AI-generated" is broken. We shouldn't be asking this question at all.

  **2. The Committee's Number**
  Your publisher's policy committee gets tired of the ambiguity. They vote: "Any draft with over 15% AI text must be labeled." Did they *discover* the correct line, or *create* it?
  *   **A.** They discovered it. The line was always there; they just finally measured it.
  *   **B.** They created a precise rule to cover a vague reality. The line didn't exist before they drew it.
  *   **C.** They picked an arbitrary point on a sliding scale. 14.9% isn't fundamentally different from 15.1%.
  *   **D.** They fixed the meaning for *this* newsroom. Another publisher might draw the line at 20%.
  *   **E.** They put a bandage on a wound that won't heal. The distinction is too messy for a number.

  **3. The Cornered Judge**
  Imagine a legal case where a contract hinges on whether a document is "human-authored." The evidence is perfectly borderline. The judge *must* rule Yes or No; they aren't allowed to say "unclear." If they rule "Yes," are they lying?
  *   **A.** No. One answer is actually correct, even if the evidence doesn't show which one.
  *   **B.** Yes. They are forced to treat a borderline case as if it were clear.
  *   **C.** Not lying, but imprecise. They are rounding a fractional truth up to a whole number.
  *   **D.** No. In a courtroom, the stakes define the meaning. "Human-authored" means something stricter here than in a newsroom.
  *   **E.** Yes. The law is asking for a fact that doesn't exist.

  **4. The Two Editors**
  You and a colleague review the same borderline draft. You say, "Label it AI." They say, "Label it Human." Neither of you made a mistake in counting the words. Can you both be right?
  *   **A.** No. One of us is wrong about the facts, even if we can't prove it.
  *   **B.** No. But neither of us is "wrong" in a blameworthy way because the truth is indeterminate.
  *   **C.** We are both partially right. The draft is somewhere in between our positions.
  *   **D.** Yes. We are working with different implicit standards for what "counts."
  *   **E.** No. Because the question itself is flawed.

  **5. The Hidden Fact**
  Consider the exact moment a draft stops being "human" and starts being "AI." Is there a specific sentence or word count where this switch happens, even if we can never identify it?
  *   **A.** Yes. Reality is precise, even if our knowledge isn't.
  *   **B.** No. There is no switch. The transition is smooth.
  *   **C.** No. There are clear cases on both ends, but the middle has no truth value.
  *   **D.** There is a switch, but it moves depending on who is asking.
  *   **E.** No. Because "human" and "AI" aren't distinct categories anymore.

  **6. The Stakes**
  Does the meaning of "AI-generated" change if the consequence changes? (e.g., labeling a school essay vs. labeling a Supreme Court brief).
  *   **A.** No. The definition is fixed. The stakes just change how careful we need to be.
  *   **B.** No. But our willingness to use the label changes.
  *   **C.** Sort of. We tolerate more ambiguity in low-stakes situations.
  *   **D.** Yes. The word means something different when the penalty for error is higher.
  *   **E.** It shouldn't, but it does, which proves the word is unreliable.

  **7. The Slippery Slope**
  If you remove one human-edited word from a 1,000-word story, it's still "human-written." If you keep removing words one by one, eventually you have zero words. At what specific removal did it stop being "human-written"?
  *   **A.** There was a specific removal, I just can't tell you which one.
  *   **B.** There is no specific removal. It faded out.
  *   **C.** It stopped being "fully human" gradually over many removals.
  *   **D.** The point of removal depends on why you're asking.
  *   **E.** The question is a trap. "Human-written" doesn't survive that kind of scrutiny.

  ***

  # Scoring Key & Theory Map

  *For the journalist's eyes only. Do not publish this section.*

  Tally which letter the reader selected most frequently. While real human intuition is messy, dominant patterns map onto five major philosophical theories of vagueness.

  ### **Mostly A's: The Epistemicist (The Hidden Line)**
  *   **The Theory:** Epistemicism.
  *   **The View:** Vagueness is ignorance. There *is* a sharp cutoff between "human" and "AI" (e.g., exactly 14.3% AI text), but human limitations prevent us from knowing it.
  *   **Journalistic Implication:** You believe policies *can* be objectively correct or incorrect. If a committee picks 15%, they are either right or wrong, even if we can't prove it.
  *   **Weakness:** It feels counterintuitive to claim a single word change determines the category.

  ### **Mostly B's: The Supervaluationist (The Truth Gap)**
  *   **The Theory:** Supervaluationism.
  *   **The View:** Borderline cases are neither true nor false. "This is AI" is false, "This is Human" is false, and "This is Borderline" is the only true statement.
  *   **Journalistic Implication:** You feel frustrated by binary policies. You believe judges forced to rule Yes/No on borderline cases are technically misrepresenting reality.
  *   **Weakness:** It complicates decision-making. Newsrooms need binary labels for databases, not "neither."

  ### **Mostly C's: The Degree Theorist (The Slider)**
  *   **The Theory:** Degree Theory (Fuzzy Logic).
  *   **The View:** Truth comes in degrees (0 to 1). A draft can be 0.7 "human."
  *   **Journalistic Implication:** You likely favor nuanced labeling (e.g., "AI-Assisted," "AI-Heavy") rather than binary toggles. You see the 10% draft as genuinely distinct from the 11% draft, just not in a binary way.
  *   **Weakness:** Hard to codify into law or policy. How much "human" is enough to win a copyright case?

  ### **Mostly D's: The Contextualist (The Shifting Goalpost)**
  *   **The Theory:** Contextualism.
  *   **The View:** The meaning of "AI-generated" shifts depending on the conversational context or stakes.
  *   **Journalistic Implication:** You think a 20% AI draft can be "human-written" in a brainstorming session but "AI-generated" in a legal filing. You blame confusion on people ignoring context, not on the words themselves.
  *   **Weakness:** Can lead to accusations of moving the goalposts. "You said it was human yesterday!" "Yes, but the context changed."

  ### **Mostly E's: The Nihilist (The Broken Label)**
  *   **The Theory:** Eliminativism / Nihilism.
  *   **The View:** The category is incoherent. "Human-written" is like "phlogiston"—a concept we should retire because it doesn't map to reality.
  *   **Journalistic Implication:** You want to scrap the disclosure policy entirely. You believe the technology has outpaced the language, and we need new vocabulary or no vocabulary at all.
  *   **Weakness:** Public trust demands transparency. Saying "the label is broken" doesn't help a reader decide if they can trust the text.

  ***

  # Limitations & Incoherent Combos

  *Use this to add nuance to your piece.*

  **1. Positions This Quiz Cannot Separate**
  *   **Epistemicism (A) vs. Single-Context Contextualism (D):** If the context is fixed (e.g., "in this newsroom, today"), an Epistemicist and a Contextualist will act the same. Both will say, "There is a fact of the matter here." The quiz only separates them if the reader explicitly acknowledges the *shifting* nature of the definition (Q6).
  *   **Supervaluationism (B) vs. Nihilism (E):** Both agree there is no sharp fact of the matter. The difference is pragmatic: Supervaluationists think we can still use the word carefully; Nihilists think we should burn the dictionary. A reader who picks a mix of B and E likely sees the distinction as academic.

  **2. Incoherent Answer Combinations**
  *   **The "Magic Fact" Contradiction (Mostly A + Mostly E):** If a reader believes there is a precise, hidden fact (A) *but* also that the category is meaningless (E), they hold an unstable view. You can't have a precise fact about a concept that doesn't exist. This usually indicates a reader who wants objective rules but feels the current ones are failing.
  *   **The "Fixed Slider" Contradiction (Mostly C + Mostly A):** Believing truth comes in degrees (C) *and* that there is a sharp, unknowable cutoff (A) is logically tense. Degree theorists reject sharp cutoffs entirely. Readers who select both are likely struggling with the tension between *legal necessity* (we need a line) and *ontological reality* (the world is gray).

  **3. The "Unexplored" Zone**
  *   **Mostly B + Mostly D:** This combination (Truth Gaps + Context Sensitivity) is a sophisticated philosophical position (Contextualist Supervaluationism), but it is rarely held by non-philosophers. If a reader scores here, they are likely comfortable holding two contradictory standards: "The truth is indeterminate" *and* "The definition changes based on stakes." This is actually the most common position in practical journalism, even if it's philosophically messy.
