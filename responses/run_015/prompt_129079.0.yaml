answer: |-
  **Thought Experiment Scenario**

  In a small district school board election, voters face a forced choice between an incumbent who secured essential funding through fraudulent grants and a challenger who promises integrity but will cut all arts programs. The ballot offers no formal abstention option, meaning participation requires selecting a candidate. A duty-based voter selects the incumbent to prevent program cuts, while an expressive voter stays home to avoid endorsing fraud. The incumbent wins by a wide margin, securing funding but continuing corruption. Under expressive theory, the duty voter is blameworthy for staining their moral record by endorsing a corrupt actor, while the abstainer remains blameless for keeping their hands clean despite the arts cuts. Under duty theory, the abstainer is blameworthy for failing to mitigate harm, while the duty voter fulfilled their obligation.

  **Specific Feature**
  The structural feature driving this split is the **absence of a formal abstention option on the ballot**. This forces a trade-off between participation (satisfying duty) and endorsement (satisfying expressive integrity).

  **If You Remove It**
  If you add a valid "None of the Above" option that counts toward quorum, the expressive voter can participate without endorsing a candidate. This aligns the two theories: the voter fulfills their civic duty to participate while maintaining moral purity, dissolving the blame split.

  **Duty-Theorist Attack**
  A duty-theorist would argue that the structural constraint is irrelevant to the moral obligation. They would claim that minimizing concrete harm (saving arts programs) outweighs symbolic purity, and that abstaining is functionally equivalent to aiding the worse outcome regardless of ballot design. They would reject the premise that "clean hands" matter if the community suffers.

  **Draft Reasoning Check**
  Your draft contains a logic error and a spelling mistake.
  1.  **Logic:** You wrote that "abstaining avoids moral responsibility" as if it were an objective fact. This is actually the *conclusion* of expressive theory, not a neutral premise. A duty-theorist would argue abstaining *increases* responsibility for the outcome. You need to frame these as competing claims rather than established truths.
  2.  **Spelling:** You misspelled "responsability"; it should be **responsibility**.
