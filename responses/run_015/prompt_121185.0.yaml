  # So You Want to Know What's Real? (Seminar Flowchart)
  *Drafted at 2 AM, check logic before printing.*

  **START:** You think QM applies everywhere, not just labs. (No "shut up and calculate" exit doors).

  **Q1: If you could measure a system's quantum state without collapsing it, would that prove the state was physically real?**
  *   **NO** (It's just info/bets/tool) → Go to **Q2**.
  *   **YES** (It's a physical object/field) → Go to **Q3**.

  ---

  ### BRANCH A (The "It's Real" Path)

  **Q3: Can two systems share identical quantum states but still differ in hidden physical properties?**
  *   **YES** (State is incomplete, there's extra stuff) → **Leaf: Bohmian Mechanics**
      *   *Awkward commitment:* You have to believe particles have definite trajectories that are fundamentally impossible to fully track.
  *   **NO** (State is complete description) → Go to **Q4**.

  **Q4: Is 3N-dimensional configuration space an acceptable home for fundamental reality, or a dealbreaker?**
  *   **ACCEPTABLE** (We live in the wavefunction) → **Leaf: Everett/Many-Worlds**
      *   *Awkward commitment:* Every quantum possibility happens, so you die in most branches but only experience the survivors.
  *   **DEALBREAKER** (Reality must be in 3D space) → **Leaf: GRW-style Collapse**
      *   *Awkward commitment:* Superpositions spontaneously break for no reason except the math says the probability is non-zero.

  ---

  ### BRANCH B (The "It's Info" Path)

  **Q2: Is the quantum state assigned to a single system, or only meaningful for an ensemble?**
  *   **ENSEMBLE / TOOL** (State is about statistics or agent beliefs) → **Leaf: QBism/Copenhagen-style**
      *   *Awkward commitment:* Science is just a user manual for betting, not a description of the world itself.
  *   **SINGLE SYSTEM** (State is real relative to an observer) → **Leaf: Relational Quantum Mechanics (RQM)**
      *   *Awkward commitment:* Properties exist only when things bump into each other, nothing has intrinsic traits.

  ---

  ### NOTES FOR THE TIRED (Read before arguing)

  **Empty/Weird Combos in Logical Space:**
  *   **Psi-Ontic + Ensemble Only:** If the wave is real, why does it only describe groups and not individuals? Usually incoherent.
  *   **Hidden Variables + 3N Fundamental:** Bohm does this, but it's awkward—why have particles in 3D if the guiding wave lives in 3N?
  *   **Collapse + No 3D Preference:** If you collapse the wave, you usually want matter to end up in 3D space. If you don't care about 3D, why collapse?

  **Pairs This Tree Can't Really Separate:**
  *   **Bohm vs. Everett:** Both come out psi-ontic on Q1/Q3. They are basically neighbors; Bohm just adds hidden particles to Everett's wave to save 3D intuition. If you're tired, just call them "Psi-Ontic Determinists."
  *   **QBism vs. RQM:** Both land on "Not Absolutely Real" in Branch B. The split on Q2 is fuzzy because QBism is single-agent but treats state as belief. Don't stress the diff too much unless you're into category theory.

  *Typo check: wether -> whether (fixed in head, left in spirit). Seperate -> Separate. Whatever.*
