  3.  **Evaluate the Science/Philosophy:**
      *   **Clinical Practice:** Why give history? To increase sensitivity (find the disease) because the pre-test probability is higher. If a GP says "suspected pneumonia," the radiologist looks harder at the lungs. This involves attentional guidance (where to look) and interpretive framing (what counts as a shadow vs. pathology).
      *   **Screening Practice:** Why blind? To maintain specificity. In a low-prevalence population, too much "expectation" leads to false positives. You want a standardized threshold.
      *   **Perception Theory:**
          *   *Encapsulation:* Visual processing happens independently of belief. History affects *where* you look (attention) and *what you report* (decision), not the raw visual qualia.
          *   *Cognitive Penetration:* Beliefs/concepts alter the visual experience itself (e.g., seeing a shadow *as* a tumor).
          *   *Current Consensus:* Most vision science supports a hybrid. Attention is heavily top-down. Interpretation is top-down. Whether the *low-level visual experience* is penetrated is debated (Firestone & Scholl vs. others), but in high-level tasks like radiology, "seeing" includes recognition.
      *   **SDT vs. Perception:** SDT distinguishes $d'$ (sensitivity) from $\beta$ (criterion). History can improve $d'$ (by guiding attention to relevant features) AND shift $\beta$ (lowering threshold for reporting).
      *   **Who is closer?** The user is partially right (it's not *just* threshold), but the mate is also partially right (threshold shifting is a huge component). The key is attentional modulation.
      *   **Underdetermination:** The practice works regardless of whether perception is penetrable. If history guides attention to the right spot, you find the lesion whether you "see it differently" or just "look there longer."
      *   **Encapsulation Implication:** If perception were truly encapsulated, history would still be useful for attentional guidance (eye movements) and decision criteria. So, yes, you'd still hand over the note, just for different theoretical reasons.

