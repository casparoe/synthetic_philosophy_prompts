      *   **Theoretical Conflict:**
          *   *Top-Down (Cognitive Penetration):* Expectations change *what* you see (phenomenal content).
          *   *Modular/Encapsulated (Fodoresque):* Perception is sealed off; expectations only affect attention (where you look) or decision criteria (thresholds), not the visual experience itself.
