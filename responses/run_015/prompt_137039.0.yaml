answer: |-
  Your mate is mechanistically closer to the consensus view, but the clinical workflow is theoretically underdetermined because guiding attention and shifting decision thresholds improves accuracy regardless of whether expectation literally alters the raw content of vision, meaning you would still hand over the referral note even if strict modularity were true.

  The divergence in practice stems from base rates and error costs, not conflicting theories of mind. In clinical radiology, the pre-test probability of disease is high because a GP has already filtered the population; the cost of a false negative (missing a real pathology) outweighs the cost of a false positive (unnecessary follow-up). Giving the history primes a "search image," which directs eye movements to relevant anatomy and lowers the decision criterion for reporting ambiguous findings. In screening, the prevalence is low, so the cost of false positives skyrockets; blinding prevents the reader from lowering their threshold too far based on non-specific symptoms, maintaining specificity across a healthy population.

  Your mate's signal detection argument captures the decision criterion shift (willingness to say "yes"), but it misses the sensitivity component. History doesn't just make radiologists more liberal reporters; it makes them more efficient searchers. Eye-tracking studies show that knowing what to look for changes scanpaths, dwell times, and fixation locations. This is attentional modulation, which is top-down, but it is compatible with modular perception. The visual system can be encapsulated at the level of edge detection and contrast sensitivity while still allowing cognitive states to control where the fovea points and how long it stays there.

  To distinguish your view from your mate's empirically, you would need to control for attention. If you fixate the radiologist's eyes on a specific spot using forced-viewing techniques and they still report different findings based on the history, that supports cognitive penetration (your view). If their reports only change when they are allowed to move their eyes, or if their confidence changes without changing detection rates on fixed stimuli, that supports the attention/SDT model (your mate's view). Current evidence suggests the latter: history guides the search and biases the judgment, but doesn't necessarily change the low-level visual qualia.

  Therefore, the practice is underdetermined because both a "cognitive penetration" model and a "modular perception + top-down attention" model prescribe the exact same workflow: give the note in the clinic to maximize sensitivity, withhold it in screening to maximize specificity. Even if strict encapsulation were true, you would still hand over the referral note because attention is not encapsulated. A modular visual system still needs instructions on where to deploy its resources, and without the note, the radiologist is searching blind, reducing sensitivity regardless of how pure their visual experience remains.
