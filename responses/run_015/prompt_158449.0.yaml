  ok for my phil of language essay i wrote down where i stand on davidson and radical interperetation and i need to know if its consistent. heres my commitments:

  (1) i think radical interpretation is right and the principle of charity is constitutive — without assuming people are mostly rational and agree with us there's no fact of the matter about meaning.
  (2) but i also think quine was right that there's still some indetermincy left over at the margins, even after you apply charity.
