answer: |-
  The problem you are describing is formally known in moral philosophy as the **Cluelessness Objection**.

  This objection posits that because the indirect, long-term consequences of any action are unknowable and likely vastly larger in magnitude than direct, short-term consequences, agents are fundamentally "clueless" about which action actually maximizes the good. It is structurally distinct from standard decision-making under uncertainty because traditional decision theory assumes you can assign probabilities to outcomes, whereas cluelessness arises when the causal chains are too complex to model and the potential values are so large that even tiny, unquantifiable probabilities dominate the calculation. This breaks standard tools like expected value, which require defined probability distributions, and renders the precautionary principle ineffective because inaction carries equally unknowable long-term risks.

  The problem does not hit all versions of consequentialism equally. **Objective Act Consequentialism** is the most vulnerable, as it demands you actually produce the best outcome, which is impossible if you cannot know the outcomes. **Subjective Consequentialism** is more resilient because it evaluates actions based on expected value given available evidence, effectively limiting the moral calculus to foreseeable consequences. **Rule Consequentialism** avoids the issue by evaluating general rules based on typical outcomes rather than the specific causal ripple effects of individual acts.

  Philosophers and ethicists generally divide into five camps regarding how to handle this:

  1.  **The Skeptics:** They argue that cluelessness falsifies consequentialism entirely, as a moral theory that cannot guide action is useless. They suggest we must abandon outcome-based ethics for deontology or virtue ethics.
  2.  **The Foreseeability Restriction:** This camp modifies consequentialism to count only foreseeable consequences. This solves the uncertainty problem but risks ignoring genuinely massive moral stakes that lie just beyond our horizon.
  3.  **The Cancellation Argument:** Proponents argue that since long-term effects are unknowable, they are likely symmetric across options (i.e., equally likely to be good or bad), meaning they cancel each other out in comparative analysis, leaving short-term effects decisive.
  4.  **The Imprecise Probability Camp:** This group argues we can use vague probability ranges rather than precise numbers. They suggest decision rules that work with ambiguity, allowing us to act even when we cannot calculate exact expected values.
  5.  **The Longtermist Response:** This view accepts the uncertainty but argues that certain interventions (like preventing human extinction) have such enormous potential value that they dominate the calculation even with extremely low probabilities, provided there is some credible causal link.
