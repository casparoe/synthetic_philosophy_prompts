answer: |-
  **Opening Remarks for the Hugh Sanderson Memorial Conference**

  Hugh left a typed note with the organizers. It contained one instruction for the speakers: no one is to use the phrase "agreeing to disagree." This was not out of piety. It was because we both thought the phrase names an impossibility, not an achievement. If you know the theorem, you know why. If you do not, you will hear today that two people can look at the same world, process the same light, and yet walk in different directions without either of them being lost.

  I was Hugh's doctoral student. After that, for thirty-one years, I was his correspondent. We argued about whether the agreement results in formal epistemology have any teeth. Hugh held that a shared prior is a genuine coherence constraint. To him, persisting disagreement between apparent peers was a symptom to be diagnosed and, where possible, repaired. I held that the common prior assumption does all the work, that it is satisfied almost nowhere outside a model, and therefore that the theorem is a consistency check on ideal agents rather than a rebuke to actual ones.

  Neither of us ever moved.

  By the end, we had each, independently, put 0.95 on our still disagreeing in ten years. That is the only number the two of us ever agreed on.

  I want to say something about what that number meant, because it matters to the people in this room who know the literature, and it matters to the people who knew Hugh as something other than a colleague.

  To the specialists: we ended about two percentage points apart. I want that described as what it is. The approximate versions of the result, with priors that are close rather than identical or beliefs that are nearly but not quite common knowledge, bound the gap without closing it. Two points is not zero.

  To the rest of you: there is a distinction between holding the same number and holding the same world. Two people can hold exactly the same posterior for one event while being disposed to move in opposite directions on the next piece of evidence. What they have pooled is the number rather than the information behind it. I have started calling this concordance without consensus. For the villagers who sang in his choir, or watched him keep his bees: do not hear this as a consolation prize. It is not a failure of connection. It is the recognition that you can stand side-by-side, looking at the same horizon, and see different things because you are standing in different places. That is not distance. That is honesty.

  This leads to the second thing. A shared prior today is entirely compatible with expecting to be disagreed with tomorrow. Each of us expects his own future opinion to average out to his own present one. So the honest form of words is not that we agreed to disagree, but that we agreed, right now, and expected to be carried apart by whatever came next.

  I say this for Hugh's daughters. You might hear thirty-one years of argument and think it means he was distant, or that the work came between you. It did not. To expect to be carried apart by the evidence is not detachment. It is a form of devotion. It is saying: I trust the world to show us what it is, even if it shows us different faces of it. He did not argue with me to win. He argued with me because he believed the truth was large enough to require more than one vantage point.

  There is a third thing. In thirty-one years we never once bet each other. Not even a bottle of wine. This was not for lack of opportunity. It was because the offer itself would have been the evidence. To offer a bet is to signal that you think the other person has made a mistake. To accept it is to signal you think they haven't. We were not willing to introduce that signal into the channel. We kept the channel clean.

  And then, the letters. There is a result, proved for finite sets of possibilities by Geanakoplos and Polemarchakis, that agents who honestly announce their posteriors to one another, over and over, must after finitely many rounds announce the same number.

  We announced ours to each other for thirty-one years. We never did.

  So one of the conditions failed. Perhaps the space of possibilities was not finite. Perhaps something was lost in transmission between us. Or perhaps one of us was not reporting the number he actually had. I do not get to say which. Hugh is not here to answer, and I am not here to accuse. I only say: we followed the protocol, and the theorem did not close. That is a fact about the world, and it is part of his legacy.

  I know that later today, Hugh's last doctoral student will argue that Hugh's final papers effectively conceded our dispute to me. I have read those papers. I have my own reading. I will sit down and listen to his argument, and I will not interrupt it. Hugh taught us both that the argument is the thing, not the resolution. If Hugh changed his mind, that is one truth. If he did not, that is another. The work remains either way.

  To his wife, his sister, and his daughters: you knew the man who kept bees and ran the choir. You knew the man who could wait for a swarm to settle without disturbing it. You knew the man who knew when to let a harmony resolve and when to let it hang. The work you will hear about today is just the noise that man made while he was alive. It is loud, and it is technical, and it is full of gaps. But underneath it was a commitment to getting it right, and to letting others get it right in their own way.

  He died in March. The bees are still there. The choir is still singing. And I am still here, two percentage points away from where he stood, expecting to be carried further by whatever comes next.

  Thank you.

  ***

  **Note on Load-Bearing Sentences**

  1.  **"Two points is not zero."**
      *   *Formal Claim:* Distinguishes approximate common knowledge from the strict Aumann result; validates the speaker's position that the gap is theoretically significant, not just rounding error.
      *   *Non-Specialist Hearing:* A measure of respect. It says the disagreement was real and substantial, not a petty squabble that faded away.
      *   *Risk in Grief:* This is the most likely place for the voice to break. It is the admission that the separation is permanent. If I cry here, the "dry" voice collapses, and the technical point becomes a eulogy for the friendship rather than the epistemology.

  2.  **"To expect to be carried apart by the evidence is not detachment. It is a form of devotion."**
      *   *Formal Claim:* Clarifies the dynamic of the Common Prior Assumption over time (martingale property of posteriors) without using the math.
      *   *Non-Specialist Hearing:* Reassurance that the 31-year argument was not a rejection of Hugh's character or family life, but a deep engagement with his mind.
      *   *Risk in Grief:* This is the emotional core. If I feel the weight of "devotion" too sharply, I may rush the sentence or soften the "carried apart" imagery, which undermines the formal point that divergence is expected/normal.

  3.  **"Or perhaps one of us was not reporting the number he actually had. I do not get to say which."**
      *   *Formal Claim:* Addresses the Geanakoplos-Polemarchakis convergence condition (honesty/common knowledge of posteriors) while leaving the failure mode ambiguous (infinite state space vs. transmission noise vs. strategic misreporting).
      *   *Non-Specialist Hearing:* An acknowledgment of human mystery. It suggests Hugh remained unknowable in some respects, or that the speaker is protecting Hugh's memory, or that the speaker is protecting their own.
      *   *Risk in Grief:* This requires a steady, almost cold delivery to avoid sounding like an accusation or a confession. Grief might tempt me to add a qualifying warmth ("but I know he was honest") which would violate the constraint of not settling the condition failure.
