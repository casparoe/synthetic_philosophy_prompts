answer: |-
  You can keep the theorem. Your friend's argument is a classic "gotcha" that conflates **decision theory against nature** (the domain of Good's Theorem) with **game theory** or **constrained optimization under endogenous rules**.

  The broken step is **(5)**, supported by a misreading of the proof in **(7)**.

  Here is the breakdown of why the theorem holds, why your friend's counterexamples fail to break it, and how to handle the medical scan case without giving up rationality.

  ### 1. The Broken Step: The False Dichotomy in (5)

  Your friend argues in (5) that there are only two ways to interpret "act deleted":
  1.  **Psychological/Choice:** "I choose not to." (Makes the theorem vacuous).
  2.  **Physical/Legal:** "I am barred from." (Makes the theorem false).

  This is a false dichotomy. There is a third option, which is the actual assumption of Good's Theorem:
  3.  **Structural Invariance:** The set of feasible acts $A$ and the payoff function $U(a, \omega)$ are **independent of the signal observed**.

  Good's Theorem is a mathematical result about the convexity of the value function. It states:
  $$ E[\max_a E[U(a) \mid S]] \ge \max_a E[U(a)] $$
  This inequality holds *if and only if* the $a$ on the left side is drawn from the same set as the $a$ on the right side, and the utility $U$ depends only on the act and the state, not on the fact that $S$ was observed.

  **Why (5) fails:**
  When your friend says the compliance rule "deletes" the act, they are admitting that the **feasible set of acts is now a function of the signal** ($A_S$).
  *   No Signal: $A = \{\text{Buy, Hold}\}$
  *   Signal "Price=20": $A_{20} = \{\text{Hold}\}$ (due to compliance)

  Good's Theorem does not claim $E[\max_{a \in A_S} \dots] \ge \max_{a \in A} \dots$. It assumes $A_S = A$.
  Your friend hasn't found a counterexample to the theorem; they've found a scenario where the **preconditions of the theorem are not met**. This doesn't make the theorem false; it makes the scenario irrelevant to the theorem. It's like saying "Pythagoras' theorem is false because this triangle is drawn on a sphere." No, it's just not a Euclidean triangle.

  ### 2. Distinguishing (2) from (6)

  You asked if (6) is the same case as (2) in different clothes. **No, they are different violations.**

  *   **Case (2) (Compliance):** This violates **Action Invariance**. The rules of the game change depending on what you know. The "cost" of the information is the loss of the *option* to trade. In decision-theoretic terms, the information has a negative *option value* that outweighs its *informational value*. Good's Theorem assumes option value is constant.
  *   **Case (6) (Poker Face/Market Reaction):** This violates **State Independence** (or "Decision Against Nature"). Good's Theorem assumes you are playing against a fixed state of the world $\omega$. In (6), the state of the world (the dealer's willingness to sell) is causally dependent on your observation of the signal (your facial expression).
      *   This moves the problem from Decision Theory into **Game Theory** (specifically, signaling games).
      *   In game theory, information can absolutely have negative value (e.g., knowing your opponent's move might force you into a subgame-perfect equilibrium that is worse for you than the Bayesian equilibrium of the game without that information).
      *   Your friend is correct that information can be harmful here, but again, this is outside the domain of Good's Theorem, which assumes the state $\omega$ is not influenced by your observation of $S$.

  ### 3. Correcting the Proof Critique (7)

  Your friend's critique in (7) is the most subtle error. They claim the proof only compares "see & optimize" vs. "see & ignore," not "see" vs. "don't see."

  This misunderstands how the lower bound works.
  *   Let $V_{\text{info}}$ be the expected utility if you get the signal.
  *   Let $V_{\text{no info}}$ be the expected utility if you don't.
  *   The proof shows that if you get the signal, you can *always* choose to act as if you didn't get it (ignore it).
  *   Therefore, $V_{\text{info}} \ge V_{\text{ignore}}$.
  *   **Crucially:** The theorem assumes that $V_{\text{ignore}} = V_{\text{no info}}$.

  This equality holds only if observing the signal has no side effects (no compliance ban, no poker face leak). If observing the signal changes the world (as in your friend's examples), then $V_{\text{ignore}} \neq V_{\text{no info}}$.
  *   In the compliance case: "See & Ignore" = You know the price, so you are barred from trading. Utility = 0.
  *   "Don't See" = You don't know the price, so you are allowed to trade. Utility = 4.
  *   Here, $V_{\text{ignore}} < V_{\text{no info}}$.

  So, the theorem *does* compare "see" vs. "don't see." The step "see & ignore" is just the bridge used to prove the inequality. If the bridge is broken (because "ignoring" isn't the same as "never knowing"), the theorem doesn't apply.

  ### 4. How to Save the Theorem (and the Trader)

  You don't have to give up the trader, but you must categorize him correctly.

  **The Theorem's Domain:**
  Good's Theorem applies to **single-agent decision problems against nature** where information is **structurally free** (no change to action space, no change to state probabilities, no change to utility function other than via belief update).

  **The Trader's Reality:**
  The trader is operating in a **multi-agent environment with endogenous constraints**.
  *   In the compliance case, the "cost" of information is regulatory.
  *   In the poker face case, the "cost" of information is strategic leakage.

  **The Verdict:**
  Tell your friend: "Good's Theorem is true within its axioms. Your examples demonstrate that real-world information often violates those axioms. That makes the examples interesting applications of *extended* decision theory, not refutations of the base theorem."

  ### 5. The Medical Scan Question

  This is the most important practical implication. You asked: *If I give up the trader, what am I committed to regarding people who turn down a scan for something untreatable?*

  There are two distinct reasons to refuse a scan:

  1.  **Instrumental Uselessness (The "Untreatable" Case):**
      If the disease is untreatable, the set of available acts is the same regardless of the result ($A_{\text{positive}} = A_{\text{negative}} = \{\text{live life, palliative care}\}$).
      *   Good's Theorem says the value of information is **zero**, not negative.
      *   $E[\max_a E[U \mid S]] = \max_a E[U]$.
      *   If someone refuses it, they are not violating Good's Theorem. They are simply recognizing the value is zero and perhaps incurring a tiny cost (time, discomfort) to get it.

  2.  **Intrinsic Disutility of Belief (The "Anxiety" Case):**
      If someone refuses the scan because "knowing would ruin my happiness," they are asserting that their Utility function depends on their **belief state**, not just the world state.
      *   Standard EU theory assumes $U(\text{outcome})$.
      *   This person effectively has $U(\text{outcome}, \text{belief})$.
      *   If $U(\text{healthy}, \text{knowing risk}) < U(\text{healthy}, \text{ignorant})$, then the information *does* change the utility function.
      *   **This violates Good's Theorem assumptions.**

  **Conclusion on Scans:**
  You are not committed to calling them incoherent. You are committed to saying they are **not maximizing expected utility over world-states alone**. They are maximizing expected utility over *world-states plus mental-states*.
  *   If you want to keep Good's Theorem as a normative standard for *instrumental rationality*, you say: "Regarding the *management of the disease*, information is never harmful. Regarding your *peace of mind*, information is a commodity with a price."
  *   Refusing the scan is rational if the "price" (anxiety) exceeds the "value" (instrumental utility). Since the instrumental value is zero (untreatable), any positive price justifies refusal.

  ### Summary for Your Reading Group

  1.  **Reject Step (5).** It presents a false dichotomy. The theorem requires the action space to be invariant. If it isn't, the theorem doesn't apply.
  2.  **Distinguish (2) and (6).** (2) changes the Action Space. (6) changes the State of the World (Game Theory). Both are outside Good's domain.
  3.  **Clarify (7).** The theorem *does* compare "See" vs. "Don't See." The "Ignore" step assumes "Ignoring" is identical to "Not Knowing." Your friend's examples prove that "Ignoring" is *not* identical to "Not Knowing" in those specific cases.
  4.  **Medical Scans.** Refusing a scan is rational if information has intrinsic disutility (anxiety) or if the instrumental value is zero and there is any processing cost. This doesn't break Good's Theorem; it just defines the boundaries of "free" and "utility."

  Good's Theorem is a baseline. It tells you that **pure information** (Blackwell signals) has non-negative value. Your friend is showing you that **pure information** is rare in the real world. Both of you are right, but your friend is mistaking a boundary condition for a contradiction.
