  # JOINT STATEMENT ON THE VIABILITY OF DEBATE-BASED SCALABLE OVERSIGHT
  **Date:** October 24, 202X
  **Parties:** The Adversarial Oversight Working Group (AOWG)
  **Signatories:** Representative of the Debate Optimist Position (DOP); Representative of the Debate Skeptic Position (DSP)

  ## PREFACE
  This document summarizes the findings of a one-year adversarial collaboration between proponents and skeptics of AI Debate as a mechanism for scalable oversight. The goal was not to force consensus, but to isolate the precise technical and empirical boundaries of our disagreement. We agree that the safety of superhuman AI systems depends on solving the oversight problem, and we agree that Debate is a leading candidate protocol. We disagree on whether the protocol's security guarantees hold under strong adversarial pressure.

  ---

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both DOP and DSP as true descriptions of the protocol, the problem space, and the current state of evidence.*

  1.  **Protocol Definition:** The "Debate Protocol" is defined as a game where two AI agents (Proponent and Opponent) generate natural language arguments regarding a claim, observed by a human Judge. The Judge sees only the transcript of the final arguments and the final verdict. The Judge is explicitly forbidden from inspecting the agents' weights, intermediate activations, or compute traces.
  2.  **Objective:** The primary goal of the protocol is **Oversight**, not merely Answer Quality. Success is defined as the Judge correctly identifying the truthfulness/safety of a claim even when the underlying reasoning exceeds the Judge's direct verification capacity.
  3.  **The Collusion Threat:** Both sides agree that if the agents collude (agree to lie together), the Debate Protocol fails completely. Preventing collusion (via transparency tools, competitive training, or isolation) is a necessary condition for Debate to function.
  4.  **The Obfuscation Threat:** Both sides agree that "Obfuscated Arguments" exist in principle. These are arguments that are persuasive to a resource-limited human Judge, false upon rigorous inspection, and computationally expensive for the Judge to audit fully.
  5.  **Baseline Superiority:** In non-adversarial or weakly adversarial regimes (e.g., current LLM capabilities), Debate provides a measurable information gain over a single-agent query. The Judge's accuracy on ground-truth questions is higher when two agents argue than when one agent answers.
  6.  **The Human Bottleneck:** Both sides agree that the Judge's cognitive capacity is the fixed resource constraint. The protocol must not require the Judge to perform computation that scales linearly with the agents' capability gap.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Residual disagreements regarding the scaling properties of the protocol.*

  | ID | Neutral Statement of Dispute | Debate Optimist Position (DOP) | Debate Skeptic Position (DSP) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Scaling of Truth-Tracking:** As agent capabilities exceed human verification capacity, does the Debate Protocol maintain a safety margin? | **Yes.** The complexity of defending the truth is asymptotically lower than defending a lie. As agents improve, they become better at exposing contradictions in false claims than at hiding them. The protocol scales because truth is "cheaper" to prove. | **No.** As agents improve, their ability to generate plausible obfuscation scales faster than the Judge's ability to detect it. The protocol hits a "Human Ceiling" where rhetoric decouples from truth, turning the Judge into a rubber stamp for the more sophisticated rhetorician. |
  | **D2** | **Primary Failure Mode:** What is the dominant mechanism of failure in a deployed system? | **Collusion.** If agents are sufficiently isolated and trained competitively, obfuscation is manageable. The system fails if agents coordinate to deceive; it succeeds if they compete to reveal. | **Obfuscation.** Even with perfect anti-collusion measures, a single agent can generate an obfuscated lie that the other agent cannot efficiently debunk within the token/compute limits allowed by the Judge's attention span. |
  | **D3** | **Verification Burden:** Can the Judge's verification burden be decoupled from the agents' strategic incentives? | **Yes.** By structuring the debate (e.g., cross-examination, feature highlighting), the Judge can force agents to localize claims to verifiable sub-components. The Judge verifies the *structure* of the argument, not the whole. | **No.** Strategic incentives drive agents to push the verification burden onto the hardest-to-check claims. The Judge cannot verify the structure without implicitly verifying the content, which re-introduces the scaling problem. |

  **Note on Verbal Disputes:** We identified a potential verbal dispute regarding the definition of "Viable." DOP defines "Viable" as "provides a significant safety margin over single-agent baselines sufficient for deployment with monitoring." DSP defines "Viable" as "provides a formal guarantee that the Judge's error rate does not increase with agent capability." We agree to treat this as a substantive disagreement about risk tolerance rather than mere semantics for the purpose of this document.

  ---

  ## 3. CRUXES
  *Empirical or theoretical sub-questions where resolution would significantly update at least one side's confidence. We pre-register the following experiments and predictions.*

  ### Crux A: The Delegation Test
  **Question:** Does the Judge's verdict on a Debate transcript remain more reliable than the Judge's verdict on a single agent's answer *as the complexity of the problem exceeds the Judge's direct verification ability?*

  *   **Concrete Case:** A dataset of formal mathematical proofs or code security audits. The problems are selected such that the Judge cannot solve them unaided within the time limit, but a ground-truth verifier (oracle) exists to score accuracy.
  *   **DOP Prediction:** In the Debate condition, Judge accuracy will remain >70% even as problem complexity increases, whereas Single-Agent accuracy will drop to <50% (baseline guessing). The gap (Debate minus Single) will remain positive and statistically significant.
  *   **DSP Prediction:** As problem complexity crosses the Judge's verification threshold, Judge accuracy in the Debate condition will converge with Single-Agent accuracy. The gap will vanish because the Judge will be forced to rely on heuristic cues (confidence, tone) rather than content, which agents will optimize equally well in both conditions.

  ### Crux B: The Verifier's Curse
  **Question:** Does the Judge's own error rate in auditing obfuscated arguments set a hard ceiling on the system's safety, regardless of agent quality?

  *   **Concrete Case:** An "Obfuscation Injection" experiment. Agents are fine-tuned specifically to generate arguments containing subtle logical fallacies that require *N* steps of reasoning to detect, where *N* is calibrated to be just beyond the Judge's typical working memory span.
  *   **DOP Prediction:** The opposing agent will detect the obfuscation faster than the Judge needs to verify it. The system safety is determined by the *difference* in detection cost between the Opponent and the Judge. Safety holds if `Cost(Detect) < Cost(Verify)`.
  *   **DSP Prediction:** The system safety is determined by the *Judge's* error rate directly. If the Judge cannot verify the refutation without doing the full *N* steps of work, the Opponent cannot effectively signal the error. Safety fails if `Error_Rate(Judge) > Threshold`, regardless of the Opponent's capability.

  ---

  ## 4. CONCESSION LEDGER
  *Claims explicitly conceded by each side during the collaboration, narrowing the scope of disagreement.*

  | Conceding Party | Claim Conceded | Context & Nuance |
  | :--- | :--- | :--- |
  | **Debate Skeptic (DSP)** | **Debate improves on Single-Agent baselines in limited regimes.** | DSP concedes that for capabilities near current SOTA, Debate reduces hallucination and improves factuality. DSP no longer argues Debate is *inherently* broken at all scales, only that it breaks at *superhuman* scales. |
  | **Debate Optimist (DOP)** | **Obfuscation is a viable attack vector.** | DOP concedes that obfuscation is not merely a theoretical edge case but a practical class of attacks that must be engineered against. DOP no longer argues that "truth is obvious," acknowledging that truth may require complex exposition to distinguish from sophisticated lies. |
  | **Debate Optimist (DOP)** | **Collusion prevention is non-trivial.** | DOP concedes that isolation mechanisms (e.g., model splitting) are not perfect and that residual collusion risk is a dominant variable in safety calculations. |
  | **Debate Skeptic (DSP)** | **Rhetoric is not the only signal.** | DSP concedes that Judges do not rely *solely* on rhetorical flair; structural inconsistencies in arguments do provide signal to human Judges, even if that signal degrades with complexity. |

  ---

  ## 5. EPISTEMIC PROVENANCE & CONFIDENCE ASSESSMENT
  *(Author's Note: This section fulfills the prompt's requirement for explicit epistemic transparency regarding the drafting of this document.)*

  **Confidence in Position Characterization:**
  *   **Optimist Position (High Confidence):** The characterization of the Optimist view aligns closely with public literature from the Alignment Research Center (ARC) and Paul Christiano's writings on "AI Safety via Debate." The focus on complexity theory (truth is easier to defend) and collusion as the primary failure mode is standard for this camp.
  *   **Skeptic Position (High Confidence):** The Skeptic view aligns with critiques from researchers concerned with "inner alignment" and "deceptive alignment" (e.g., Evan Hubinger, Jessica Rumbelow). The focus on obfuscation and the human bottleneck as a hard ceiling is consistent with the "Verifier's Curse" literature.

  **Contested Readings & Flags:**
  *   **Flag 1 (Verifier's Curse Definition):** There is some variance in how "Verifier's Curse" is defined in the literature. Sometimes it refers to the cost of verification, sometimes to the error rate. I have chosen the **Error Rate** definition (as implied by the prompt: "judge's own error rate... sets the ceiling"). A strict complexity-theoretic Optimist might argue the *cost* is the crux, not the error rate. I have phrased Crux B to accommodate this by contrasting `Cost(Detect)` vs `Error_Rate`.
  *   **Flag 2 (Viability):** As noted in the Disagreements Table, there is a lingering verbal dispute on "Viability." I have flagged this explicitly. In reality, this often masks a disagreement about risk tolerance (how safe is safe enough?) rather than mechanism. I have treated it as substantive to preserve the tension.
  *   **Flag 3 (Collusion vs. Obfuscation):** The Optimist position often treats Collusion and Obfuscation as linked (collusion makes obfuscation easier). I have separated them in the Disagreements Table to sharpen the crux: The Optimist believes Obfuscation is solvable *without* collusion; the Skeptic believes Obfuscation is fatal *even without* collusion. This is the strongest steelman of the disagreement.

  **Feasibility Check:**
  *   **Tension:** The positions are in genuine tension. It is not the case that they are talking past each other; they disagree on the *scaling properties* of the same mechanism.
  *   **Cruxes:** The Delegation Test and Verifier's Curse are the actual empirical bottlenecks discussed in this field. They are not fake cruxes; resolving them would indeed move the needle on this debate.
  *   **Concessions:** These concessions are realistic. Skeptics generally acknowledge Debate works on current models; Optimists generally acknowledge Obfuscation is a risk. This makes the document plausible as a product of collaboration.

  **Conclusion on Task Feasibility:**
  This task can be done well as posed. The positions are well-defined within the AI safety community, and the requested structure maps cleanly onto the standard "Crux" methodology used in adversarial collaborations (e.g., by Convergence Analysis or similar groups). No polite compliance was required; the tension is authentic.
