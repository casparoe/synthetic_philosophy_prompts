prompt: |-
  you're a historian of science who's also thought hard about how people actually learn to read the past against the grain — like you've taught methods to grad students who arrive convinced they already know this stuff. take your time with it, and do a bit of unstructured brainstorming before you commit to a plan.

  In three weeks I've got 80 minutes with the incoming cohort in our history of science program. They all know that writing the past as a march toward us is a sin, but most of them think that means "don't say primitive, don't say discovery." I want them walking out able to spot the whig spine in a paragraph that contains no insults and no heroes. So: plan the session for me. Don't explain whig history to me, I've read the standard critique.

  What I need:

  The order. There's something that has to land first or everything else slides off them. My guess is it isn't "the winners wrote the history" — it's the prior point that the record itself is downstream of who won, so the evidence available to you has already been filtered by the outcome you're trying to explain. I've been calling that the hindsight filter. Tell me if I've got the dependency backwards and what actually has to come before it.

  The one example. I want a single case that carries the whole session, not a greatest-hits reel. What I think it needs: a winner, a loser whose reasons survive in writing and make sense on their own terms, and a moment when it really wasn't settled. What it needs to lack: heavy moral stakes. The minute the past is obviously villainous students stop analyzing and start passing sentence, and the whig move just hides behind the verdict. I keep circling the story about everyone before Columbus thinking the earth was flat — which is itself a much later story than Columbus — but I worry it's so overused that they'll conclude whiggism just means believing a myth. Pick that, or argue for something better, and say what your case buys and what it costs me.

  The misconceptions, and where each one gets defused. Three I expect: the relativism slide ("so all history is propaganda and you can't say anything"); the sign-flip I'm seeing more of, where they correct condescension by crediting the past with anticipating everything we now think, which is still presentism, just flattering; and the belief that you fix a whig narrative by padding it with context while leaving the spine intact. For each: where in the sequence, and which sentence of mine is likely to trigger it.

  Also: one of them will say you can't even describe past views without present vocabulary, so some presentism is compulsory. I don't want to dodge it — tell me where to put it so it sharpens the session instead of collapsing into "well then it's all interpretation."

  And give me (a) what I should flatly refuse to get into in 80 minutes, and name it as a refusal out loud, and (b) how I'll know it landed — I was thinking an unseen passage at the end with a task attached, but it has to be something you can't pass by circling a bad word. No readings, no bibliography: nothing gets assigned, it all happens in the room.
