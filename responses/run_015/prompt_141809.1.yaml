answer: |-
  Here is the plan. It is designed to be tight, uncomfortable, and productive.

  ### 1. The Order: Experience Before Theory
  You have the dependency right conceptually, but if you state it first ("The archive is filtered by the winner"), it becomes a slogan they nod at and forget. It slides off because it's abstract.

  **The Fix:** You must make them *feel* the filter before you name it.
  *   **Minute 0–10:** Do not define Whig history. Do not define the hindsight filter. Put a transparently "good" modern paragraph on the screen. It should be accurate, nuanced, and free of "primitive/discovery" language. Ask them: "What is wrong with this?" They will struggle. Then, put the primary source from the "loser" next to it. The gap between the two *is* the filter.
  *   **Minute 10–15:** *Now* you name it. "The Hindsight Filter." The record isn't just biased; it's translated. The vocabulary of the winner has overwritten the ontology of the loser.

  **Why:** If you start with the theory, they file it under "Things the Professor Believes." If you start with the textual gap, they file it under "A Problem I Have to Solve."

  ### 2. The One Example: Phlogiston vs. Oxygen (1770s–1780s)
  **Do not use the Flat Earth myth.**
  *   **The Cost of Flat Earth:** It teaches students to be myth-busters, not historians. It sets up a binary: Truth vs. Lie. Whiggism isn't about lies; it's about *coherence*. The Flat Earth myth is a 19th-century fabrication *about* the past, not a debate *within* the past. Using it lets them feel superior to "people who believed myths" rather than analyzing how knowledge stabilizes.
  *   **The Buy of Phlogiston:**
      1.  **The Loser Survives:** Joseph Priestley wrote thousands of pages. He is not a villain; he is a meticulous empiricist. His system (phlogiston escapes during burning) explains combustion, calcination, and respiration consistently.
      2.  **The Filter is Linguistic:** When we read Priestley today, we mentally translate "dephlogisticated air" to "oxygen." That translation is the Whig move. It makes Priestley look like he was *trying* to discover oxygen and failed, rather than investigating a different chemical ontology that worked for its time.
      3.  **Low Moral Stakes:** Nobody died because they believed in phlogiston. It prevents the "science vs. religion" or "negligence" narrative from hijacking the room.
      4.  **The Moment of Contingency:** In 1780, it was not settled. Lavoisier's system required a new nomenclature (the *Méthode de nomenclature chimique*, 1787) to win. The victory was administrative and linguistic as much as empirical.

  **The Risk:** Some students may feel they "already know" this case.
  **The Mitigation:** Acknowledge it. "You know the story. Today we are ignoring the chemistry and looking at the *archive*. How many of you have read Priestley without mentally substituting 'oxygen'?" (Watch the hands).

  ### 3. The Misconceptions & Defusal Strategy

  **A. The Relativism Slide ("So all history is propaganda and truth doesn't exist.")**
  *   **Where:** Minute 35, during the deep dive on Priestley.
  *   **The Trigger:** When you show that Priestley's system made sense.
  *   **The Defusal Sentence:** "Recognizing that Priestley's system was coherent is not saying his chemistry was 'equally true.' It is saying that his *reasons* were not stupid. We are analyzing the structure of his argument, not the final verdict of nature."
  *   **Why:** You separate *rationality* from *truth*. They can grant rationality to the past without abandoning the idea that oxygen is real.

  **B. The Sign-Flip ("Actually, they anticipated everything we know!")**
  *   **Where:** Minute 50, when discussing the "winner."
  *   **The Trigger:** When a student says, "But Lavoisier was right because he saw the mass change."
  *   **The Defusal Sentence:** "Be careful not to turn the loser into a fool and the winner into a prophet. Lavoisier didn't 'see' oxygen; he constructed a system where mass conservation was the rule, and defined his terms to make it so. If you say he 'anticipated modern chemistry,' you are doing the same Whig move you just criticized in Priestley."
  *   **Why:** This stops them from replacing condescension with flattery. Both are presentist.

  **C. The Context Padding ("Just add more background to fix the spine.")**
  *   **Where:** Minute 60, transitioning to the assessment.
  *   **The Trigger:** When they suggest, "We should just mention the religious context of Priestley."
  *   **The Defusal Sentence:** "Adding context to a Whig narrative doesn't fix the spine; it just pads the corpse. If your paragraph still ends with '...which led to the discovery of oxygen,' the context is decoration. The *endpoint* determines the story."
  *   **Why:** This forces them to see that Whiggism is structural (teleological), not just a matter of tone.

  ### 4. The Vocabulary Objection ("We can't describe the past without present terms.")
  *   **Where:** Minute 65. This is the "Professional Paradox" segment.
  *   **The Move:** Do not dodge it. Embrace it.
  *   **The Script:** "One of you is thinking: 'I can't write a history of chemistry without using the word *oxygen*.' You are right. Some presentism is compulsory. We cannot think outside our own skins. The goal is not to purge present vocabulary. The goal is to *mark the translation*. When you use a modern term for a past concept, you must signal that you are translating, not describing. The sin isn't using the word 'oxygen'; the sin is using it without acknowledging that Priestley didn't have it."
  *   **Why:** This prevents the session from collapsing into "well, it's all interpretation, so nothing matters." It gives them a practical tool: *Signal the translation.*

  ### 5. Refusals (What to Flatly Refuse)
  You have 80 minutes. You must draw boundaries.
  *   **Refusal 1: Internalism vs. Externalism.**
      *   *Script:* "We are not debating whether the science was driven by ideas or society. Whiggism infects both. An internalist history can be just as Whiggish as an externalist one if it assumes the current theory was the inevitable goal."
  *   **Refusal 2: Scientific Realism vs. Constructivism.**
      *   *Script:* "I am not asking you to decide if oxygen exists independently of Lavoisier. I am asking you to analyze how Lavoisier's victory changed how we read Priestley. Keep the metaphysics out of the room."

  **How to Signal:** Put these two refusals on a slide at Minute 15 under the heading "Out of Bounds." Refer back to it if the conversation drifts.

  ### 6. Assessment: How You'll Know It Landed
  You are right to reject "circle the bad word." That tests vocabulary, not structure.
  **The Task (Minute 65–80):**
  1.  **Handout:** A single paragraph from a standard history of science text (circa 1990s) describing the Phlogiston debate. It is well-written, polite, and accurate.
  2.  **Instruction:** "Rewrite this paragraph. You must keep the facts accurate. You are forbidden from using the words 'primitive,' 'error,' 'discovery,' or 'hero.' However, you are also forbidden from simply adding 'context.' You must change the *endpoint* of the narrative."
  3.  **The Catch:** To pass, they must stop the paragraph from ending at "the acceptance of Oxygen." They must end it at "the stabilization of a new nomenclature" or "the marginalization of the phlogiston ontology."
  4.  **Success Metric:**
      *   *Fail:* They swap "discovery" for "development" but keep the trajectory toward us.
      *   *Pass:* They describe the *loss* of the phlogiston framework as a specific historical event, not a natural fading of error. They treat the winner's vocabulary as a contingent outcome, not the neutral language of description.

  **Why this works:** It forces them to manipulate the *spine* of the narrative. They can't do it by synonym-swapping. They have to restructure the causal link between the debate and the present.

  ### Summary of the Flow
  *   **00–10:** The Gap. (Modern text vs. Priestley's text).
  *   **10–15:** The Name. (Hindsight Filter).
  *   **15–35:** The Case. (Phlogiston coherence).
  *   **35–50:** Misconception 1 & 2. (Relativism & Sign-Flip).
  *   **50–60:** Misconception 3. (Context Padding).
  *   **60–65:** Refusals. (Realism/Externalism).
  *   **65–70:** The Vocabulary Paradox. (Compulsory Presentism).
  *   **70–80:** The Assessment. (Rewrite the Spine).

  This keeps the pressure on *structure* rather than *sentiment*. It moves them from "being nice to the past" to "analyzing the architecture of the archive."
