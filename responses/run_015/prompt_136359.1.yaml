prompt: |-
  I'm moderating a podcast interview with a philosopher who defends a specific revisionist account of free will she terms narrative authorship. On her view, the variety worth wanting is neither sourcehood nor hierarchical mesh, but the capacity to retrospectively weave one's actions into a coherent autobiographical narrative that genuinely admits of counterfactual alternatives, without self-deception. I want eight to ten interview questions that go beyond having her restate the position. Please include: at least one pressing the charge that retrospective integration is merely confabulation masquerading as freedom, with a follow-up keyed to her likely reply that first-person authority makes the distinction moot; one on how the view treats split-brain subjects who seem to generate two coherent but incompatible narratives; one on what distinguishes her account from Dennett's compatibilist picture of varieties worth wanting and where she explicitly departs; and one on whether narrative authorship requires linguistic competence, with implications for non-human animals and artificial systems. For each question, include a follow-up anticipated to her most probable defense.
