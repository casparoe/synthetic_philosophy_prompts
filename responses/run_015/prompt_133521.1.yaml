prompt: |-
  Okay so me and my friend were arguing for like two hours last night about whether you're actually being a jerk if you skip tipping in the US but you're just visiting from somewhere that doesn't do it, or if jaywalking in Berlin is genuinely wrong for a tourist who never grew up with that norm. I kept saying it's just culture and coordination, not real morality, but he kept pushing this idea he calls a territorial-but-not-transitive theory of conventional obligation — basically that local norms only bind people who've been embeded in the community long enough to pick up the local normative grammarr, so short-term visitors get a kind of moral pass but long-term expats don't. I'm not totally sold but I want to actually think through what it would mean if he was right.

  Please describe the most important implicatons of that territorial-but-not-transitive framework for how we should judge visitors who break everyday conventions like queue-jumping, not tipping, or jaywalking. Does it draw a real moral line between a first-week tourist and someone who's lived there six months? What does it say about whether these conventions are genuine obligations or just coordination devices? And if we actually bought into this view, would it change how cities should design signs or legal penalties for these violations?

  Lead with the bottom line in your first sentence and then give the reasoning, with no preamble and no restating the question. I'm genuinely trying to figure out if my friend is onto something deep or if he's just inventing philosophy to excuse his own bad queueing behavior.
