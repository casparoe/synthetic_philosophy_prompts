answer: |-
  Your friend's framework effectively reclassifies social conventions from universal moral duties into membership-based contracts, meaning violations are only genuinely wrongful when the actor has sufficiently benefited from or participated in the system they are breaking. This distinction draws a moral line between a first-week tourist and a six-month expat not based on time itself, but on epistemic access and tacit consent; the tourist lacks the opportunity to learn the "normative grammar" and hasn't settled into the benefits of the social contract, whereas the expat has had ample time to integrate and therefore loses the excuse of ignorance. Under this view, conventions like tipping or queueing are fundamentally coordination devices that only transform into genuine moral obligations once you become a stakeholder in the system, implying that a tourist isn't being immoral so much as they are operating outside the specific cooperative agreement locals have made. If cities adopted this logic, policy would shift from uniform penalties to tiered enforcement, prioritizing high-visibility signage and education for visitors while reserving fines and social sanctions for residents who violate norms they are presumed to understand. Ultimately, your friend is invoking a legitimate philosophical concept known as contractualism rather than merely inventing an excuse, but the risk is that if too many people claim the "visitor pass," the coordination itself collapses, making the theory philosophically sound but socially fragile.
