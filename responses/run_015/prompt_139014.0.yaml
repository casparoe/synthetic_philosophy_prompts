answer: |-
  1. You often say my worry about hollow feelings is just about how the belief arrived, not whether the belief is true. But if that hollowness stops me from standing by the choice when things get hard, isn't that a practical defect in the belief itself?
  *Follow-up:* If he says the belief stays true regardless, ask him if a belief that evaporates under pressure is really a moral belief.

  2. Let's say I borrow a verdict and never feel that hollowness because I'm not very reflective. Do I still have the defect, or does the defect only exist when I notice it?
  *Follow-up:* If he says it's still defective, ask if morality is punishing me for being too dumb to notice I'm borrowing.

  3. You keep separating how I got the belief from whether it's a good one, like they're separate tracks. What if in morality, the only way to get a good belief is to walk the track yourself?
  *Follow-up:* If he says that's too demanding, ask why it's demanding for morals but not for brakes.

  4. When I trust a mechanic about my brakes, nobody says I'm missing something, even though I don't understand the engineering. If the person I help doesn't care why I helped them, just that I did, who exactly is harmed by my borrowed verdict?
  *Follow-up:* If he says it harms me, ask if morality is supposed to be about me or about everyone else.

  5. Imagine I agree with friends on the principles, but I ask them which one weighs more in a specific mess and do what they say. That feels like borrowing a weighting, not a verdict. Does your view say I'm still missing something, even though I understand the ingredients?
  *Follow-up:* If he says yes, ask what extra work I needed to do besides understanding the principles.

  6. When someone tells me "what you did hurt me," I take their word for it without demanding proof, and that doesn't feel hollow at all. Is that because they aren't an expert, or does this show that borrowing is fine when the source is the person affected?
  *Follow-up:* If he says it's different because they feel the pain, ask if moral truth is just about feelings then.

  7. What if I defer to someone passing on what they heard, or everyone in a town defers to the same leader? You get a chain of borrowing or a monoculture where mistakes can't be corrected. Does your view account for these social risks, or is it only worried about the individual soul?
  *Follow-up:* If he says individual only, ask if a view that ignores community collapse is too narrow.

  8. I decide something is wrong on my own, clumsily, and years later find out that someone whose judgment I trust had come to the same conclusion. Do you have to say my original verdict was defective the whole time and just got lucky?
  *Follow-up:* If he says yes, ask if luck changes the quality of the reasoning I actually did.

  9. Most of us learned most of our morals by being told when we were kids. If borrowed verdicts are defective, are we all walking around with a broken moral picture that we later repair, and what would the repair even consist in?
  *Follow-up:* If he says yes, ask if that means childhood morality is basically a lie.

  10. I don't want to ask what would change your mind in general, but what's one concrete piece of evidence you'd have to give up if this view was wrong. Is there a specific case where you'd admit borrowing is perfectly fine?
  *Follow-up:* If he gives a vague answer, ask him to name a specific scenario where deference is virtuous.
