      *   Theater promotes tenderness, passion, individualism.
      *   So, yes, he thinks they are different in kind because the *relationship* between the participant and the event is different (active identification vs. passive consumption).

  5.  **Address the Niche Question (Immersive/Participatory Art):**
      *   This is the tricky part. Rousseau wants *no separation* between spectator and actor.
      *   Immersive theater blurs the line, *but* it usually still has a "frame" (it's still a show, there's still a script, there's still a ticket).
      *   For Rousseau, the "frame" is the poison. If you know it's a performance, you are in the realm of *illusion*.
      *   However, if the "immersive" art becomes a true *fête* (e.g., a flash mob where no one knows who organized it, or a community dance where everyone joins in spontaneously), it gets closer.
      *   *Verdict:* Immersive theater is a hybrid. It's better than proscenium theater, but if it's still "art to be consumed," it fails the Rousseau test. It needs to be "life being lived."

