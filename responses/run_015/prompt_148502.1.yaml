      *   **Core Question:** Is Rousseau's complaint about theater that representation substitutes for presence *or* that it manipulates emotions/makes us lazy about solidarity?
      *   **Secondary Question:** How does he view Spartan/Roman games (different in kind or just functional)?
      *   **Niche/Application Question:** How does his logic apply to modern participatory/immersive theater?
      *   **Goal:** Understand the *exact logic* of the passage, moving beyond the simplified "theater corrupts morals" take.
      *   **Tone:** Intellectual, analytical, helpful, nuanced.

  2.  **Deconstruct Rousseau's Argument in the *Letter*:**
      *   *Context:* D'Alembert suggested Geneva build a theater. Rousseau says "No."
      *   *The "Dark Room" Argument:* Rousseau famously critiques the physical space of the theater. People sit in the dark, isolated, yet feeling a false sense of community.
      *   *Representation vs. Presence:* This is key. Theater is *mimesis* (imitation). You watch someone else pretend to feel. You feel pity for a fictional character, which exhausts your capacity for pity in real life.
      *   *Passivity:* The audience is passive. Civic virtue requires action.
      *   *The Alternative:* Public festivals (fêtes). Open air, daylight, no spectators (everyone is a participant), dancing, singing, being together.
      *   *Sparta/Rome:* He cites them as models of *civic* bonding, not *aesthetic* appreciation. The games were about physical vigor and direct competition, not watching actors pretend.

  3.  **Address the Core Question (Representation vs. Emotional Laziness):**
      *   It's not an "either/or." It's a "because/therefore."
      *   *Representation* creates the condition for *emotional laziness*.
      *   Because it is a substitute (representation), it allows you to feel you've done your duty by feeling pity in the seat, without acting in the street.
      *   So, the core complaint is ontological (it's not real) which leads to the ethical consequence (it makes us lazy/passive).
      *   *Key Concept:* *Amour-propre* vs. *Amour de soi*. Theater feeds vanity and artificial sentiment.

  4.  **Address the Sparta/Rome Question:**
      *   Rousseau distinguishes between *spectacles* (theater) and *games/festivals*.
