  Here's a thinking process that leads to the suggested speaker's prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Retired biochemist, well-read in Parfit's *Reasons and Persons* and distributive justice literature.
      *   **Context:** Interdisciplinary moral-philosophy seminar (analytic ethicists specializing in distributive justice + two welfare economists).
      *   **Topic:** "Saturating Prioritarianism" (SP).
      *   **Core Thesis:** Moral weight of well-being increments follows a sigmoidal curve (enzyme kinetics analogy): high weight at very low well-being, steep decline in middle, asymptotic near-zero above a threshold.
