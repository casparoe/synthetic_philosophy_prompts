answer: |-
  # Speaker's Prep Sheet: Saturating Prioritarianism
  **Seminar:** Interdisciplinary Moral Philosophy (Analytic Ethics & Welfare Economics)
  **Presenter:** [Your Name]
  **Topic:** Saturating Prioritarianism (SP) as a Sigmoidal Social Welfare Function

  ## I. The Core Narrative (The "Elevator Pitch")
  Do not lead with the enzyme kinetics analogy. It is a heuristic for *you*, not a justification for *them*.
  *   **The Hook:** Standard Prioritarianism (Parfit) correctly identifies diminishing marginal moral value but fails to capture the intuitive moral significance of "enough."
  *   **The Innovation:** SP models moral weight as a sigmoidal function. It captures the urgency of the bottom tail (like Prioritarianism) and the moral negligence of excess (like Sufficiency View) without the lexical rigidity of a hard cutoff.
  *   **The Payoff:** It dissolves the Leveling-Down Objection (LDO) not by denying the badness of loss, but by rendering the loss of "excess" well-being morally negligible compared to gains at the bottom, thereby aligning the *math* with the *moral intuition* that equality is not intrinsically valuable.

  ---

  ## II. Anticipated Objections (Ordered by Likelihood & Damage)

  ### 1. The Normative Arbitrariness Objection (The "Line-Drawing" Problem)
  *   **Who:** Analytic Ethicists & Welfare Economists (Universal).
  *   **The Charge:** "Your saturation threshold and Hill coefficient (steepness) appear normatively arbitrary. In biology, $K_m$ is determined by physical constants. In ethics, what non-stipulative fact fixes the point where moral weight asymptotes to zero? If it is adjustable, is the theory not just *ex post* rationalization of intuitive cases?"
  *   **Damage:** **High.** This is the structural weak point you identified.
  *   **Strategy:** **Reframe.** Do not defend a specific number. Defend the *category*.
  *   **Prep:** "I am not proposing a specific numeric threshold. I am proposing a *functional form* that reflects the structure of human flourishing. The parameter is fixed by **Reflective Equilibrium** regarding 'vital functioning' (à la Nussbaum/Sen). It is not arbitrary any more than the poverty line is arbitrary; it tracks the transition from *deficit* to *functioning* to *excess*."

  ### 2. The "Sadistic Conclusion" / Life-Saving Objection
  *   **Who:** Analytic Ethicists (Deontologists/Rights Theorists).
  *   **The Charge:** "If marginal moral weight is asymptotic to zero above the threshold, does SP license letting a saturated individual die to provide a marginal gain to someone in the steep part of the curve? This looks like a violation of the separateness of persons or basic rights."
  *   **Damage:** **Critical.** (See Section V for the specific answer).
  *   **Strategy:** **Hold Firm (with Nuance).** Distinguish between *increments of well-being* and *preservation of moral agency*.
  *   **Prep:** "SP applies to distributions of *advantage*, not the *preconditions* of agency. Death is not a movement along the curve; it is the destruction of the substrate. Saving a life moves an individual from the 'negative tail' (non-existence/suffering) to the 'steep rise,' which retains maximum weight regardless of prior status."

  ### 3. The Redundancy Objection (vs. Standard Prioritarianism)
  *   **Who:** Parfit Scholars / Standard Prioritarians.
  *   **The Charge:** "Standard Prioritarianism (concave curve) already blocks the Leveling-Down Objection because it is non-relational. Your sigmoid adds mathematical complexity without solving a problem Standard Prioritarianism hasn't already solved. Why introduce an asymptote?"
  *   **Damage:** **Medium.** Challenges the necessity of your view.
  *   **Strategy:** **Reframe.** Argue Standard Prioritarianism is *extensionally* correct but *explanatorily* weak on "excess."
  *   **Prep:** "Standard Prioritarianism implies a billionaire's loss is still morally significant. SP captures the intuition that beyond a point, well-being becomes morally 'inert.' This better explains why we don't feel bad about taxing extreme wealth compared to moderate wealth, without invoking envy-based egalitarianism."

  ### 4. The Continuity/Discontinuity Objection
  *   **Who:** Analytic Ethicists (Metaphysicians of Value).
  *   **The Charge:** "A sigmoid is continuous, but the moral implication feels discontinuous. A tiny well-being increment across the saturation point causes a massive drop in moral weight. Does this not create a 'continuum problem' where morally irrelevant differences in well-being dictate massive shifts in priority?"
  *   **Damage:** **Medium.**
  *   **Strategy:** **Concede Ground.** Acknowledge the tension but argue it mirrors reality.
  *   **Prep:** "Moral urgency *does* drop off sharply once basic capabilities are secured. The smoothness of the curve avoids the 'cliff-edge' of hard Sufficiency Views, which is an improvement, not a bug."

  ### 5. The Incentive Compatibility Objection
  *   **Who:** The Two Welfare Economists.
  *   **The Charge:** "If the marginal moral value of well-being is zero above threshold $T$, your Social Welfare Function (SWF) provides no moral incentive for productivity gains among the high-well-being cohort. Does this not collapse total utility maximization and threaten Pareto efficiency?"
  *   **Damage:** **Low/Medium.** (They know this is a normative talk, but they will ask).
  *   **Strategy:** **Reframe.** Normative vs. Positive.
  *   **Prep:** "This is a feature. If gains above $T$ are morally inert, we should not sacrifice the bottom to generate them. Pareto improvements are only morally required if they do not violate the priority weight of the worse-off."

  ---

  ## III. The "One Reply" That Must Land
  **The Claim:** *Saturating Prioritarianism is the only view that captures the "Sufficiency Intuition" without the "Hard Cutoff Problem."*

  **The Script:**
  "Hard Sufficiency Views say nothing matters above the threshold. Standard Prioritarianism says everything matters, just less. Both are counterintuitive. SP says: *Mattering fades to insignificance.* This allows us to reject Leveling Down (because some weight remains) while endorsing radical redistribution (because the weight is negligible). It is the stable equilibrium between the rigidity of Sufficiency and the unboundedness of Prioritarianism."

  ---

  ## IV. Defending the Weakest Point: Normative Arbitrariness
  **The Risk:** They will treat your saturation parameter like a biological constant you pulled from a textbook.
  **The Defense:** Anchor it in **Capability Theory**, not Kinetics.

  **Do Not Say:** "Like an enzyme, the moral agent saturates at concentration $K$."
  **Do Say:** "The saturation parameter corresponds to the **Threshold of Secure Functioning**. Just as a biological system has a maximum rate of reaction determined by structural limits, a human life has a maximum capacity to convert resources into *morally relevant* flourishing. Beyond this, resources convert only to 'luxury,' which has diminishing moral urgency. We fix this parameter not by convention, but by identifying the point where additional resources cease to expand **effective agency**."

  *   **Backup:** If pressed on precision: "Ethics deals in ranges, not decimals. The sigmoid shape matters more than the inflection point. Whether saturation begins at \$100k or \$150k income, the *structural* implication for distributive justice remains identical."

  ---

  ## V. The "Hope Nobody Asks" Objection (Life-Saving)
  **The Question:** "Does your view require withholding life-saving treatment from a saturated person (e.g., a happy billionaire) to fund a moderate well-being boost for a poor person, since the billionaire's future weighted well-being is near-zero?"

  **The Trap:** Sounding like a Threshold Utilitarian who sacrifices rights for aggregate weighted value.
  **The Time-Pressure Answer:**
  "No, because **existence is not a marginal increment.**"

  **The Elaboration (if needed):**
  "My weight function applies to *distributions of well-being within a life*, not the *value of the life itself*. Death is not a movement from 'Saturated' to 'Zero'; it is a movement from 'Agent' to 'Non-Entity.'
  1.  **The Substrate Argument:** The moral weight of saving a life is the weight of restoring the *capacity* for well-being, which is always in the high-weight 'lower tail' of the function (from non-existence to existence).
  2.  **Vital vs. Luxury:** The saturation threshold applies to *advantage* (consumption, leisure), not *vital interests* (health, agency). Life-saving treatment restores vital interests, which sit on the steep part of the curve regardless of the patient's bank account.
  3.  **Conclusion:** SP prioritizes the poor for *benefits*, but it does not devalue the *lives* of the rich. We save the life first; we distribute the luxury second."

  ---

  ## VI. Strategic Notes for Q&A
  *   **On Biology:** If they press the enzyme analogy, smile and say: "It was a generative metaphor for the *shape* of the function, not a claim that morality is biochemical. The justification is purely normative."
  *   **On Economists:** If they ask about the SWF formula, write $W = \sum g(w_i)$ where $g$ is sigmoidal. Acknowledge that $g'(w) \to 0$ as $w \to \infty$. This signals you speak their language.
  *   **On Parfit:** Be respectful. "Parfit showed us the direction (non-relational), but I am suggesting the curve needs a different curvature to match our considered judgments on excess."
  *   **Tone:** You are a colleague proposing a refinement, not an outsider importing science. Own the philosophy; let the biology remain in the footnotes.
