      *Okay, I will treat the LDO claim as the user's *assertion* and prepare them for the pushback that Standard Prioritarianism already does this.*

      *Final Plan:*
      *   **Tone:** Professional, rigorous, acknowledging the biochem analogy but pivoting quickly to normative ethics.
      *   **Vocab:** SWF, Marginal Moral Value, Continuum, Sufficiency View, Reflective Equilibrium, Vital Interests.
      *   **Content:** As derived above.

      *(Final thought on the Life-Saving Objection)*: If the curve is asymptotic near-zero, a rich person losing their life (going from 100 to 0) loses $\int_{0}^{100} w(x) dx$. If $w(x)$ is near zero for $x > 50$, the loss is capped. A poor person going from 0 to 50 gains $\int_{0}^{50} w(x) dx$. If the curve is steep there, the gain might exceed the rich person's loss. This implies saving the poor person is more important than saving the rich person. This is actually a feature for many prioritarians. The *trap* is if the rich person is *already* alive and needs treatment to *stay* saturated vs a poor person needing treatment to get to the steep part.
