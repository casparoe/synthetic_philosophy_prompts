answer: |-
  It is a genuine pleasure to step into this brief. You have handed me a classic "hard case" in the philosophy of public memory. Your commission's track record is not inconsistent, but it is *multivalent*. You are operating with at least three distinct ethical frameworks that sometimes overlap and sometimes collide. That is why you feel stuck. You are trying to apply a single rule to a portfolio that was built using three different rulers.

  Before I give you my recommendation, let's do the work of excavating the principles latent in your nine precedents. We need to make the implicit explicit.

  ### Brainstorming the Principles in Play

  Looking at your decade of decisions, I see three competing theories of commemoration fighting for dominance in your commission's jurisprudence:

  1.  **The Civic Endorsement Theory:** Public space implies civic virtue. If the city puts your name on a thing, we are telling citizens, "Be like this person." If the person is morally compromised in ways that harm current citizens, the endorsement must be withdrawn. (This drives Case 1, Case 4, Case 5, Case 7).
  2.  **The Historical Context Theory:** Public space is an open-air classroom. Figures stay if they are historically significant, provided we tell the truth about them. Complexity is a feature, not a bug. (This drives Case 3, Case 6, Case 8).
  3.  **The Representational Equity Theory:** The *collection* of monuments matters as much as the individual. If the landscape of memory excludes entire demographics of the citizenry, keeping a flawed figure from that excluded group serves a corrective justice function that outweighs their moral failings. (This is the hidden engine of Case 8 and the tension in Case 9).

  The reason you cannot find a single rule is that you have been balancing these three. Case 4 (School) prioritized *Endorsement* (children are compelled). Case 2 (Street) prioritized *Utility* over *History*. Case 3 (Mayor) prioritized *Context* over *Purity*. Case 5 (Governor) prioritized *Harm* over *History*.

  ### Candidate Rules and Predictions

  Here are the three most viable rules that fit your past track record, laid out against the Kendrick case.

  | Candidate Rule | Core Principle | Precedent Support | Prediction for Kendrick Bust |
  | :--- | :--- | :--- | :--- |
  | **Rule A: The "Compelled Audience" Standard** | If the space is one where citizens are captive or asked to emulate the figure (schools, lobbies), moral purity is required. Flawed figures go to museums. | Case 4 (School Renamed), Case 5 (Gov to Museum), Case 1 (Confed Removed). | **Relocate to History Room or Museum.** The library lobby is a high-traffic civic space akin to the Capitol grounds. Her stance on coerced confessions and gay rights causes active harm to specific communities. |
  | **Rule B: The "Net Contribution" Standard** | If the figure's tangible contributions to the city's welfare outweigh their moral failings, they stay, but context must be added. | Case 3 (Mayor Kept+Plaque), Case 6 (Labor Leader Kept). | **Keep in Lobby + Plaque.** Desegregating housing/schools is a heavier moral good than the "tough on crime" policies which were normative for the era. She is a net positive. |
  | **Rule C: The "Representational Equity" Standard** | If removing a figure worsens the demographic exclusion of the public landscape, they stay unless their presence constitutes hate speech. | Case 8 (Plaque Reworded), Case 7 (Pioneer Removed because *no* specific person). | **Keep in Place.** She is the *only* Black woman. Removing her signals that Black women do not belong in the civic story. The harm of erasure outweighs the harm of her flaws. |

  ### The Recommendation

  You asked me not to sit on the fence. Here is my counsel:

  **Keep the bust in the library lobby. Do not move it to the history room. Do not move it to the museum. Commission a robust, unflinching interpretive plaque to be installed immediately adjacent to it.**

  **The Closest Analog:**
  **Case 3 (The Progressive Mayor).**
  Like the Mayor, Kendrick is a "builder" (of civil rights infrastructure rather than sewers) who also authored or supported exclusionary policies (segregation ordinance vs. anti-gay/hardline police policies). The Commission decided in Case 3 that the good works (parks/sewers) anchored the figure in the city's physical reality, requiring context rather than removal. Kendrick's work desegregating housing anchors her in the city's *social* reality.
  *Why not Case 5 (The Governor)?* The Governor was removed/relocated because his primary legacy was *enforcing* exclusion. Kendrick's primary legacy was *fighting* exclusion. Her "sins" are of omission or normative blindness (homophobia, tough-on-crime), whereas the Governor's "sins" were the core of his political project.
  *Why not Case 4 (The School)?* A library is not a compulsory space for children in the same way a school is. The "role model" standard is slightly lower in a civic lobby than in an elementary school.

  **Why I Reject Rule A (Relocation):**
  Relocating the bust to the history room (as library staff suggested) is the "soft removal" option. It treats her like Case 5 (The Governor). This is philosophically inconsistent. The Governor represented state power *over* the marginalized. Kendrick represented marginalized power *against* the state. To treat them identically is to commit a category error regarding power dynamics.

  **Why I Reject Rule C (Pure Equity) as the Sole Justification:**
  While representation matters, we cannot simply say "Keep her because she is Black." That is tokenism, and it insults her legacy. We must keep her because her *actions* built the city we live in, and her flaws are part of the city's truth. Representation is the tiebreaker, not the whole case.

  ### Addressing Your Specific Questions

  **1. Does it matter morally that she is a Black woman in a landscape of white men?**
  Yes. It is not merely a tiebreaker; it is a substantive principle of **Democratic Legibility**.
  Political philosophy teaches us that public space constructs the "public." If the only faces looking back at citizens from bronze and stone are white men, the state is visually asserting that white men are the agents of history and everyone else is the subject. Keeping Kendrick is not about excusing her homophobia; it is about acknowledging that the "Public" includes Black women. If you remove her, you are not achieving moral purity; you are achieving demographic erasure. You would be left with a morally "cleaner" landscape that is a lie about who built the city.

  **2. Should we discount the family's funding threat?**
  Morally? Yes. Blackmail should not dictate civic memory.
  Practically? No. You are a consultant to a city government, not a Kantian idealist. The Teen Reading Prize is a public good. If removing the bust causes the loss of the prize, you are harming children to make a philosophical point. However, **do not cite this in your written decision.** It sets a terrible precedent for future donors. Cite the historical contribution and the representational necessity. Let the funding stay as a happy consequence, not a stated reason.

  **3. The Plaque Text:**
  If you choose "Keep + Contextualize" (which I recommend), the plaque must avoid the passive voice. It must not say "Controversies exist." It must name the harm.
  *Drafting Suggestion:*
  > "Ora Bell Kendrick (19XX–19XX). First Black woman elected to City Council. A champion of school and housing desegregation, Kendrick fundamentally reshaped the city's commitment to civil rights. Her legacy is complex: she also advocated for strict habitual-offender laws during a period of documented police coercion and opposed the 1978 gay-rights ordinance. This bust honors her pivotal role in expanding equality, while acknowledging that the fight for justice often involves contradictions that future generations must reckon with."

  **4. The One Further Case to Test the Rules:**
  To truly separate Rule A (Endorsement) from Rule C (Equity), I would put this on the docket next year:
  **A statue of a White Male Philanthropist who funded the city's first Black hospital but was a known member of the KKK.**
  *   *Rule A (Endorsement)* says: Remove him. KKK membership is disqualifying hate.
  *   *Rule B (Net Contribution)* says: Keep + Plaque. The hospital saved lives.
  *   *Rule C (Equity)* says: Remove him. We have enough white men. His presence crowds out others.
  *   *Why this tests it:* It pits "Good Works" against "Hate Group" against "Demographic Saturation." Your decision there will tell you if you are truly committed to Equity or if you just use it when it's convenient.

  ### Final Word

  You are worried about consistency. But consistency in public memory is not mathematical; it is narrative. Your city's narrative is currently: "We honor our builders, even when they were flawed, but we remove those whose primary legacy is oppression."

  Ora Bell Kendrick is a builder. Her flaws are significant, but they do not define her primary legacy. The Confederate General (Case 1) and the Segregation Governor (Case 5) were removed because their primary legacy *was* oppression. Kendrick's primary legacy was *liberation*, complicated by the blind spots of her time.

  Keep the bust. It belongs in the lobby. It belongs in the light. And it belongs with the truth written right next to it.
