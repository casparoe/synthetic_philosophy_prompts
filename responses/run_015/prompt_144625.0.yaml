  hey so a friend walked me through this and now i'm stuck in it. (1) If an omission O causes an event E, then O has to be a difference-maker: if the corresponding action A had happened, E wouldn't have. (2) Now imagine a redundant safety system with five independent sensors, each able to trigger an alarm. All five fail. For each sensor, it's true that if it had fired, the disaster wouldn't have happened. (3) So by (1), each of the five omissions is a full cause of the disaster. (4) But then there's also the maintenance crew that was supposed to check the sensors monthly and didnt — if they had done thier check, at least one sensor probably would have worked. So that omission also meets the counterfactual test. (5) In fact, you can keep adding layers of potential interveners — the manager who should have hired more crew, the regulator who should have mandated backups — and every single omission passes (1). (6) That means any disaster in a complex system has infinitely many omission-causes, all on equal footing. (7) But if causation works that way, then assigning blame or legal liability becomes impossible: every omission is just one drop in an infinite bucket, so no individual omission is more responsible than any other. (8) We obviously dont think blame works like that — the maintenance crew is more on the hook than some distant regulator. (9) So (1) is false, and omissions can't really be causes after all. He thinks this shows omission-based negligence is conceptually broken. I really want to keep (1) because it feels like the heart of counterfactual causation, and i also want to keep the idea that blame isnt infinitely diluted. Where's the exit? Which step do i reject, and what does giving it up cost me?

  Please answer in American English. Also, please say how confident you are in what you claim and point out the specific part you're least sure about.
