answer: |-
  Here is the design for the 90-minute session. It is built to be run tightly; you will need to keep time strictly.

  ### 1. The Mechanics

  **Minute Zero: The Preference Slip**
  Hand this out as students sit. It looks like a standard demographic/preferences survey.
  *   **Text:** "Below are two hypothetical legislative agendas. Which one aligns more closely with your view of effective governance? (Tick one)."
  *   **Bundle A:** "Prioritises national security, streamlined executive decision-making, and strict border control. Supports reducing judicial review of executive orders to ensure swift implementation."
  *   **Bundle B:** "Prioritises social equity, expanded parliamentary oversight, and proportional representation. Supports increasing judicial review to protect minority rights from majority rule."
  *   **Instruction:** "Fold this slip and keep it in your pocket. Do not show it to anyone."

  **The Packet Distribution (The Manipulation)**
  You need two versions of the Vignette Packet (Version A and Version B).
  *   **Version A:** Given to students who ticked **Bundle A**.
      *   Vignettes 1 & 2 Header: "Implemented by Government elected on **Bundle A**."
      *   Vignettes 3 & 4 Header: "Implemented by Government elected on **Bundle B**."
  *   **Version B:** Given to students who ticked **Bundle B**.
      *   Vignettes 1 & 2 Header: "Implemented by Government elected on **Bundle B**."
      *   Vignettes 3 & 4 Header: "Implemented by Government elected on **Bundle A**."
  *   **Logistics:** Ask students to raise their hand for A or B. Hand the corresponding packet. *Guess:* Students will glance at each other's packets. Instruct them: "The headers are part of the experimental condition. Do not discuss headers until the final debrief."

  **The Vignettes (Composite & Anonymised)**
  *Note: These are dense. The goal is cognitive load to prevent immediate recognition that Vignette 1 and 3 (for example) are structurally similar across the room, though the text below makes them distinct enough to avoid "I've read this already" fatigue within a single packet.*

  *   **Vignette 1 (Electoral Commission):** The independent Electoral Commission is restructured. The 5-member board is now appointed by a 3-person committee (2 government MPs, 1 opposition MP). Funding is moved from a fixed statutory percentage of GDP to an annual parliamentary vote. The Commission loses the power to sanction parties for misinformation, transferring this to a new Media Standards Body appointed by the Interior Ministry.
  *   **Vignette 2 (Judiciary):** Mandatory retirement age for Supreme Court judges lowered from 70 to 65. This creates 4 immediate vacancies. A new "Judicial Council" is formed to vet candidates, consisting of the Attorney General, the Bar Association President, and a nominee of the ruling party. Lower court rulings on constitutional matters can now be fast-tracked to the Supreme Court, bypassing intermediate appeals.
  *   **Vignette 3 (Civil Service):** A new "Public Loyalty Act" requires all department heads (Deputy Minister level and above) to certify allegiance to the "Constitutional Order" as defined by the Cabinet. 15% of senior civil servants are rotated to new departments within 6 months. A new Office of Efficiency is created within the Prime Minister's office with the power to audit any ministry's spending without prior notice.
  *   **Vignette 4 (Media & Assembly):** Public broadcasting funding is consolidated into a single state media corporation governed by a board appointed by the Senate. Laws on public assembly now require 48-hour notice for groups larger than 50 people (previously 24 hours/100 people). Defamation remains a civil offence, but damages caps are removed for cases involving "national security interests."

  **The Scoring Scheme (Pre-Registered)**
  Do not offer a menu. Use this single metric.
  *   **Metric:** "Type-Q Severity Score" (0–10).
  *   **Definition:** "To what extent do these changes reduce the probability that a current opposition party could win power and reverse these changes within two election cycles?"
  *   **Scale:**
      *   0: No impact on reversibility or electoral competition.
      *   5: Significant friction added to reversal or competition.
      *   10: Effectively locks out opposition or makes reversal impossible without extra-legal action.
  *   **Task:** Score each of the 4 vignettes. Calculate your **Framing Gap**: *(Average Score of "Your Bundle" Vignettes) minus (Average Score of "Other Bundle" Vignettes).*

  **The Banned Words Card**
  Place this on every table.
  *   **Rule:** In all written notes and group discussion, the following terms are prohibited. If used, the group loses one tournament chip (see Section 4).
  *   **List:** *Democracy, Authoritarian, Populist, Dictator, [Any Country Name], [Any Leader Name], Rule of Law (unless defined operationally), Norms.*
  *   **Reason:** "You are describing mechanical institutional changes, not moral categories."

  ---

  ### 2. The "Who Decides" Round (25 Minutes)

  Divide the 4 groups of 4 into three roles (one group splits or observes). Each group re-scores **Vignette 1 (Electoral Commission)** only, using a restricted evidence packet.

  *   **Group 1: The Domestic Opposition.**
      *   **Packet:** Leaked internal memos from the ruling party suggesting the Media Standards Body will target specific critics; photos of protests against the change; opinion polls showing 60% public support for the change.
      *   **Blindspot:** They cannot see the legal text of the reform, only the political intent and public reaction.
      *   **Structural Bias:** Incentivised to maximise the Type-Q score to mobilise donors/voters.

  *   **Group 2: The Regional Monitor (e.g., Council-style).**
      *   **Packet:** The formal legal text of the reform; the relevant Treaty Article on "Free Elections"; a checklist of compliance criteria.
      *   **Blindspot:** They cannot see the leaked memos or the protest photos. They do not know public opinion.
      *   **Structural Bias:** Incentivised to minimise the Type-Q score to maintain diplomatic engagement and avoid triggering sanctions that require unanimity.

  *   **Group 3: The Comparativist (Historian).**
      *   **Packet:** Election outcome data from 10 years later (showing the opposition did eventually win); GDP growth data during the period; a dataset of similar reforms in 20 other countries.
      *   **Blindspot:** They cannot see the intent (memos) or the legal text details, only the long-term outcomes.
      *   **Structural Bias:** Incentivised to minimise the Type-Q score if the outcome was stable (survivorship bias).

  **Task:** Re-score Vignette 1. Write a 2-sentence justification using only the evidence provided.

  ---

  ### 3. The "In the Weeds" Gadgets (15 Minutes)

  Introduce two specific amendments to the Vignettes. Ask groups to apply their own scoring logic to these specific traps.

  **Gadget A: The Ratchet Condition**
  *   **The Trap:** Add this to Vignette 2 (Judiciary): "The new Judicial Council appointments are for 12-year non-renewable terms, staggered so no single election cycle can change more than one member."
  *   **The Test:** Does this count as Type-Q degradation if the opposition wins the next election?
  *   **Your Honest Evaluation:** This gadget does **heavy lifting** conceptually but is **fragile in practice**. It forces students to distinguish between *policy* (reversible) and *structure* (sticky). However, students often struggle to calculate "reversibility" without knowing the exact parliamentary arithmetic. It risks becoming a math problem rather than a political one.
  *   **Instruction:** "If the opposition wins 55% of the vote next time, can they undo this? Yes/No. If No, add +2 to your Severity Score."

  **Gadget B: Plebiscitary Laundering**
  *   **The Trap:** Add this to Vignette 4 (Media): "These changes were ratified by a National Referendum with 65% turnout and 58% approval."
  *   **The Test:** Does popular approval negate the Type-Q severity?
  *   **Your Honest Evaluation:** This gadget does **less work** than you hope. Students committed to majoritarian democracy will simply say "The people spoke, severity = 0." Students committed to liberal constitutionalism will say "Rights aren't subject to votes, severity = 10." It polarises the room rather than refining the definition. It reveals their *theory of democracy*, not their measurement skill.
  *   **Instruction:** "Adjust your score. If you believe a referendum validates institutional capture, reduce score by up to 5 points. If you believe it does not, make no change. Write down why."

  ---

  ### 4. The Payoff Structure: Trap-Case Tournament (15 Minutes)

  **The Setup:**
  Each group has 5 chips.
  **The Task:**
  Draft one "Edge Case" (3 sentences max). This must describe an institutional change that *looks* like Type-Q degradation but should arguably score 0 (or vice versa), designed to break another group's scoring rule.
  **The Attack:**
  Group 1 attacks Group 2. Group 2 must rule on their own case using their own rule.
  *   If Group 2's rule forces them to give a counter-intuitive score (e.g., they must score a benign change as severe), Group 1 steals a chip.
  *   If Group 2 successfully amends their rule to accommodate the case without breaking it, they keep the chip.
  **The Win:**
  The group with the most chips at the end gets to propose the single-word label for "Type-Q" (which you will reveal is Backsliding in the debrief).
  **Time Limit:** 3 minutes to write, 2 minutes per attack.
  **Degeneration Warning:**
  *Guess:* Students will game this by writing nonsense cases ("The government bans Tuesdays").
  *Fix:* You act as adjudicator. Any case that is not *institutionally plausible* is disqualified immediately.
  *Guess:* Groups will collude to share chips.
  *Fix:* Announce that the group with the *fewest* chips gets to ask the first question in the debrief (reverse incentive).

  ---

  ### 5. The Debrief (20 Minutes)

  **Mapping Moments to Problems:**
  1.  **The Framing Gap:** Ask for a show of hands. Who had a positive gap? (Scored "Your Bundle" as less severe).
      *   *Point:* This is not just bias; it is **conceptual stretching**. We define the threat by who poses it.
  2.  **The Roles:** Compare the three scores for Vignette 1.
      *   *Point:* **Epistemic Position.** The Opposition sees intent; the Monitor sees text; the Historian sees outcomes. There is no "view from nowhere."
  3.  **The Gadgets:**
      *   *Point:* **Ratchet** highlights the difference between losing an election and losing the *chance* to win the next one. **Laundering** highlights the tension between Popular Sovereignty and Liberal Constraints.
  4.  **The Limitation (Sequentiality):**
      *   *Say this:* "In this game, you saw the whole list of changes at once. In reality, Vignette 1 happens in Year 1. Vignette 4 happens in Year 9. By the time you see the pattern, the Ratchet has clicked."
      *   *The Boiling Frog:* The activity cannot reproduce the *temporal* erosion where each step is locally defensible. You must supply this in your closing summary.

  **Predictable Failures:**
  *   **The Expert Student:** One student will say "This is Levitsky and Ziblatt" in minute 3.
      *   *Mitigation:* Pre-brief them if you know who they are, or use the Banned Words card to silence them ("You used a banned term, lose a chip").
  *   **Lazy Both-Sidesism:** "Everyone does it, so the concept is useless."
      *   *Counter:* "Measurement error does not mean the phenomenon doesn't exist. Temperature is hard to measure in a storm, but heat is real."

  ---

  ### 6. Two Commitments

  **Commitment 1: Expected Result & Contingency**
  *   **Expectation:** I expect a measurable Framing Gap. Students will score the "Other Bundle" vignettes as 1.5–2 points higher on average than the "Your Bundle" vignettes. They will justify this by attributing *malice* to the Out-Group and *necessity* to the In-Group.
  *   **Contingency (If the gap is flat):** If students score them identically, do not panic. Pivot to the **Role Play divergence**. If the *individual* bias fails, the *structural* bias (Opposition vs. Monitor) will likely succeed. Use that to argue that even if individuals are honest, institutions produce different "truths" about backsliding.

  **Commitment 2: My Verdict**
  *   **Verdict:** "Democratic backsliding" is **not** merely a partisan label; it is a measurable phenomenon of *asymmetric institutional stickiness*. It is distinct from normal policy turnover because it alters the rules of competition to favour the incumbent *ex ante*.
  *   **Strongest Counter-Argument:** The metrics used to measure "stickiness" (judicial independence, media freedom indices) are themselves constructed by liberal democracies that prioritise *constraints on majorities* over *responsiveness to majorities*. Therefore, a government that is highly responsive to a popular majority but dismantles liberal constraints will always register as "backsliding" by definition, making the concept tautological. It measures "liberalism" but claims to measure "democracy."

  ***

  **Behavioral Flags (Where I am guessing):**
  1.  **Packet Secrecy:** I am guessing students will respect the "do not discuss headers" instruction. If they don't, the framing effect collapses. *Mitigation:* Seat Bundle A and Bundle B students at alternating tables if possible.
  2.  **Tournament Engagement:** I am guessing the chip tournament will generate energy. It might instead generate cynicism ("This is childish"). *Mitigation:* Frame the chips as "Credibility Points," not game tokens.
  3.  **Calculation:** I am guessing students will actually do the math on the Framing Gap. Many will just eyeball it. *Mitigation:* Require them to write the number down on a slip you collect before the debrief.
