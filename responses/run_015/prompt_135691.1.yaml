          *   Ontological drift: This is the most philosophical term. Maps to "conceptual shift," "ontology mismatch," or "inner alignment" issues regarding mesa-optimisers. It's a real concern but "ontological drift" isn't the standard industry term (usually "concept drift" in ML, but here it means something deeper).
