prompt: |-
  I run grant decisions at a small foundation that funds early-stage, high-risk science: about eight proposals a month, a rotating panel of four or five reviewers who are smart but usually only adjacent to the subfield in question, one ninety-minute meeting, and then a public one-paragraph rationale for every decision that goes up on our site. The board ratifies the list each quarter and has to be able to defend it to their friends. Here's what's been eating me: our decisions are public, other funders and the whole field read them, and I'm pretty sure that some of what looks like emerging consensus in the proposals crossing my desk is just people copying each other — reviewers who've all read the same three preprints, all citing the same one benchmark dataset, all saying some version of "well, the big lab is already doing this" — and I'm equally sure some of it is genuine information moving through the community and I'd be an idiot to ignore it. I can't tell which is which, and I have maybe fifteen minutes a case.

  So: build me a decision procedure the panel can actually run, grounded in whatever the sequential-herding literature really establishes — I mean the standard setup where people move in turn, see what earlier people did but not what they knew, and at some point it becomes individually rational to copy and stop contributing their own information at all, plus the reputational version where people copy because being wrong alone is worse than being wrong in a crowd, plus whatever is known about how fragile those states are and what does and doesn't break them. But operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision back to me because it's really a question about our risk appetite rather than about evidence. Assume I will almost never get a calibrated probability out of these people — say what to do when there's no number to be had. And be straight with me about which steps are real machinery and which are judgment calls wearing a lab coat.

  It has to handle at least these: (1) cascade inside the room, since our board member speaks first and the junior reviewers visibly defer; (2) agreement that looks independent but isn't, because everyone's signal came from the same two papers and the same benchmark; (3) the "if it were worth doing somebody would have done it by now" move, i.e. treating absence of uptake as evidence, when sometimes the absence is the cascade; (4) our own past write-ups feeding the thing we're trying to detect — I've been running a quarterly round where we re-review the most-rejected proposals with the prior verdicts and our old rationales redacted, which I call the reversal round, and I genuinely don't know whether it buys anything when the reviewers are the same people who can't un-know what they already said; (5) a rule I invented and will kill if you tell me to — if a panel comes out unanimous, I assign someone to write a minority report even when they agree. Does manufactured dissent carry information or is it just noise with a stamp on it?

  Then run it on three cases. First, a method that went from nobody to everyone in about eighteen months: three other funders have already funded variants, my panel is unanimous and enthusiastic, and not one of them can name a reason that isn't a restatement of "everyone's moving this way." Second, a replication-and-negative-results project in a subfield that is extremely confident about its result: nobody has funded it, and the one written review we have says the quiet part out loud about nobody having done it. Third, the one where I want you to tell me something I won't like: two years ago we rejected a proposal and published a fairly dismissive paragraph about it, and since then two other funders have passed on it citing our write-up; a revised version has now come back to us and the panel's private scores are actually decent. Say what the procedure says, including what we should write publicly this time — and if the honest output is that we should eat crow loudly because a loud reversal does more than a quiet one, or that we should fund something we think is mediocre because the point of the money is to buy a signal nobody else is going to generate, say that plainly.

  Finally, tell me what the procedure can't do: the failure modes, the cases where it will definately misfire, and which outputs I should refuse to trust.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Program officer at a small foundation funding early-stage, high-risk science.
      *   **Constraints:** 8 proposals/month, 4-5 reviewers (adjacent experts), 90-min meeting, public 1-paragraph rationale, board ratification (needs defensibility).
      *   **Problem:** Distinguishing genuine information cascades (good consensus) from informational herding (bad consensus/copying). Reviewers copy each other, rely on same preprints/benchmarks, fear being wrong alone.
      *   **Task:** Build an *operationalized decision procedure* grounded in sequential-herding literature (Bikhchandani, Hirshleifer, Welch, etc.) but practical for a 15-min/case review.
      *   **Specific Requirements:**
          *   Order of questions.
          *   Stop conditions (No vs. Escalate to PO).
          *   Handle lack of calibrated probabilities.
          *   Distinguish "real machinery" vs. "judgment calls in a lab coat."
          *   Address 5 specific scenarios: (1) In-room cascade (senior speaks first), (2) Illusory independence (same sources), (3) Absence of uptake as evidence, (4) Reversal round efficacy, (5) Manufactured dissent (minority report rule).
          *   Run the procedure on 3 specific cases (Bandwagon, Negative Replication, The Crow-Eating Rejection).
          *   List failure modes/limitations.
      *   **Tone:** Direct, pragmatic, intellectually honest, no fluff.

  2.  **Theoretical Grounding (Sequential Herding):**

      *   *Core Concept:* Individuals observe actions of predecessors but not their private signals. If the public pool of actions outweighs private signal, it becomes rational to ignore private info and follow the herd (Informational Cascade).
      *   *Reputational Herding:* Agents care about reputation. Being wrong alone is costly; being wrong with the crowd is safe.
      *   *Fragility:* Cascades are fragile. A small amount of new public information or a change in order can break them.
      *   *Application to Grants:* Reviewers are the agents. Previous funding decisions/public rationales are the "public actions." The proposal text is the "private signal" (ideally), but often reviewers treat the field's attention as a signal.

  3.  **Drafting the Procedure (The "Herd-Breaker Protocol"):**

      *   *Goal:* Maximize independent signal extraction before aggregation.
      *   *Step 1: Pre-Meeting Signal Isolation.* Prevent contamination before the room.
          *   *Action:* Blind scoring on specific criteria *before* seeing others' scores.
          *   *Literature link:* Prevents early public actions from swamping private signals.
      *   *Step 2: Source Auditing.* Address the "same three preprints" issue.
          *   *Action:* Cite check. Are citations independent or copied?
          *   *Literature link:* Correlated signals reduce the effective weight of evidence.
      *   *Step 3: Order of Operations.* Address the "Board Member speaks first" issue.
          *   *Action:* Junior first, Senior last. PO speaks last (or not at all during deliberation).
          *   *Literature link:* Sequential order matters immensely in cascades.
      *   *Step 4: The "Why Not?" Test.* Address absence of uptake.
          *   *Action:* Explicitly ask "Why hasn't this been done?" Distinguish "Nobody thought of it" vs. "Nobody could make it work."
      *   *Step 5: The Escalation Threshold.* When to hand to PO.
          *   *Action:* If consensus is high but *reasons* are correlated, or if consensus is high but contradicts past public signals (reputational risk).
      *   *Step 6: Public Rationale Construction.*
          *   *Action:* Must reflect the *uncertainty* and the *bet*, not just the science.

  4.  **Addressing the 5 Specific Constraints:**

      *   (1) *In-room cascade:* Fix via speaking order (Junior -> Senior).
      *   (2) *Illusory independence:* Fix via Source Auditing (Step 2).
      *   (3) *Absence of uptake:* Fix via "Why Not?" Test (Step 4).
      *   (4) *Reversal Round:* Be honest. It's weak if reviewers are the same. Needs *new* reviewers or a "Devil's Advocate" assignment.
      *   (5) *Manufactured Dissent:* It's useful *if* it forces articulation of counter-arguments. It's noise if it's performative. Better to assign a "Red Team" role than a fake minority report.

  5.  **Running the Cases:**

      *   *Case 1 (Bandwagon):* High consensus, correlated reasons.
          *   *Verdict:* Flag as Cascade Risk. Do not fund based on "everyone is doing it." Fund only if private signal (method novelty) is strong *despite* the crowd.
          *   *Rationale:* Acknowledge the trend but justify the specific angle.
      *   *Case 2 (Negative Replication):* High risk, low uptake.
          *   *Verdict:* This is the foundation's job. The "absence of uptake" is likely a reputational cascade (nobody wants to fund negative results).
          *   *Rationale:* Explicitly state we are funding the *question*, not the expected positive outcome.
      *   *Case 3 (The Crow-Eating):* Past rejection, now decent scores.
          *   *Verdict:* Fund. The past rejection created a negative cascade. Breaking it requires a loud signal.
          *   *Rationale:* Admit the change. "We previously underestimated X. New evidence Y suggests..."
          *   *Manufactured Dissent:* In this case, the "minority report" rule is actually good—it forces the panel to articulate why they *were* wrong before.

  6.  **Refining the "Real Machinery" vs. "Lab Coat" distinction:**

      *   *Machinery:* Speaking order, blind scoring, citation audits.
      *   *Lab Coat:* Judging whether a reason is "correlated" or "independent," deciding when to eat crow.

  7.  **Failure Modes:**

      *   Paralysis (over-analyzing herds).
      *   Cynicism (rejecting everything popular).
      *   Reviewer fatigue (procedure is too burdensome).
      *   The "Contrarian Trap" (funding bad ideas just because they are unpopular).

  8.  **Review and Polish:**

      *   *Tone Check:* Is it too academic? Need to make it actionable for a 90-minute meeting.
      *   *Literature Check:* Ensure Bikhchandani/Hirshleifer/Welch (1992) and Scharfstein/Stein (1990) concepts are applied correctly (private signals vs. public actions).
      *   *Constraint Check:* Did I answer the "manufactured dissent" question? Yes (Red Team > Fake Minority). Did I address the "Reversal Round"? Yes (It's weak without new blood).

  9.  **Final Output Structure:**
      *   Introduction (The Theory in Plain English).
      *   The Protocol (Step-by-Step).
      *   Addressing the 5 Specific Constraints.
      *   Case Studies (1, 2, 3).
      *   Failure Modes/Limitations.
      *   Closing advice.

  *(Self-Correction during drafting)*: I initially thought about suggesting new reviewers for the reversal round. The user said "reviewers are the same people." I need to work within that constraint. The fix isn't new people, it's *role assignment* (Red Team).
  *(Self-Correction on Manufactured Dissent)*: The user asks if it carries information. If everyone agrees, forcing a minority report is lying. Better to force a "Pre-Mortem" or "Red Team" analysis. I will advise modifying that rule.
  *(Self-Correction on Case 3)*: The user asks if they should fund something "mediocre" to buy a signal. If the science is mediocre, funding it wastes money. If the *signal* (that the field was wrong) is valuable, fund it. I need to distinguish "mediocre science" from "high-risk science that looks mediocre due to prior bias." I will argue for funding *if* the science is sound, even if the premise was previously dismissed.

  10. **Final Polish:** Ensure the distinction between "Informational Cascade" (rational ignoring of private info) and "Reputational Herding" (rational protecting of status) is clear in the procedure.

  *(Drafting the response...)*
answer: |-
  Here is the procedure. It is built on the mechanics of informational cascades (Bikhchandani, Hirshleifer, Welch) and reputational herding (Scharfstein, Stein), stripped of the math and bolted onto your 90-minute meeting structure.

  ### The Theory in Plain English
  1.  **Informational Cascade:** Reviewers ignore their private information (their read of the proposal) because the public information (previous funding decisions, other reviewers' comments) seems overwhelming. This is rational for them, catastrophic for you.
  2.  **Reputational Herding:** Reviewers agree with the senior person or the field consensus because being wrong alone damages their reputation, while being wrong with the crowd does not.
  3.  **Fragility:** Cascades are brittle. A single credible public signal that contradicts the herd can shatter them. Your foundation's public rationale is that signal.

  ---

  ### The "Herd-Breaker" Decision Protocol

  **Time Budget:** 15 minutes per proposal within the 90-minute meeting.
  **Roles:** Program Officer (PO), Panel Chair (Senior), Reviewers (Junior/Senior mix).

  #### Step 1: Signal Isolation (Pre-Meeting)
  *   **Mechanism:** Reviewers submit scores and *three bullet points of reasoning* before seeing other reviews.
  *   **The Check:** PO scans for **Source Correlation**.
  *   **The Question:** "Are the three bullet points citing the same preprints/benchmarks?"
  *   **Stop Condition:** If >3 reviewers cite the exact same two papers as the *primary* justification for merit, flag as **Correlated Signal**. This counts as *one* piece of evidence, not four.
  *   **Action:** If Correlated Signal is flagged, the PO must introduce one piece of disconfirming evidence or a distinct benchmark during the meeting.

  #### Step 2: Order of Operations (In-Room)
  *   **Mechanism:** Strict speaking order.
  *   **The Rule:** Junior reviewers speak first. Senior reviewers speak second. PO speaks last (or not at all).
  *   **Why:** In sequential herding models, the first few movers determine the cascade. If the Senior/Board member speaks first, their private signal becomes public action, swamping the juniors' private signals.
  *   **Lab Coat Warning:** You cannot stop reviewers from knowing who is senior. You can only enforce the *order* of verbal commitment.

  #### Step 3: The "Absence of Evidence" Test
  *   **Mechanism:** Explicitly address the null.
  *   **The Question:** "Nobody has funded this yet. Is that because (A) it's obviously impossible, (B) it's obviously low value, or (C) it's too risky for reputations?"
  *   **Sufficient Answer:** The panel must select A, B, or C.
      *   If **A or B**: Vote No.
      *   If **C**: This is your target. Vote Yes (contingent on Step 5).
  *   **Stop Condition:** If the panel says "If it were good, someone would have done it," and cannot name *who* or *why* (specific technical blocker vs. vague risk), the discussion stops. **Decision: No.** This is herding masquerading as market efficiency.

  #### Step 4: The Reversal Check (For previously rejected proposals)
  *   **Mechanism:** Compare current private scores against the *public* history.
  *   **The Question:** "Have the facts changed, or has the consensus changed?"
  *   **Sufficient Answer:**
      *   "Facts changed" (new data, new method): Proceed.
      *   "Consensus changed" (field is now interested): **Escalate to PO.**
  *   **PO Decision:** If only consensus changed, you are funding a cascade. Only fund if the *risk profile* has shifted enough to justify the reputational cost of reversing yourself.

  #### Step 5: The Escalation Threshold (PO Intervention)
  *   **Handoff to PO:** The panel does not decide. The PO decides.
  *   **Triggers:**
      1.  **Unanimity with Correlated Signals:** Everyone agrees, but they all read the same three papers.
      2.  **Reputational Risk:** The science is sound, but the field hates it (Case 2).
      3.  **Past Error:** You rejected it before, and the science hasn't fundamentally changed, but your prior rationale is now blocking them (Case 3).
  *   **Why:** These are not questions of scientific merit; they are questions of *portfolio strategy* and *signal value*. Reviewers optimize for correctness; you optimize for information generation.

  ---

  ### Addressing Your Five Constraints

  1.  **In-Room Cascade (Senior speaks first):**
      *   **Fix:** Step 2 (Speaking Order). If the Board Member must speak, they write their comments *before* the meeting and the PO reads them anonymously, or they speak *last*. If they speak first, the meeting is a ratification, not a review.
  2.  **Illusory Independence (Same sources):**
      *   **Fix:** Step 1 (Source Correlation). Treat correlated citations as a single signal. If the "consensus" rests on one preprint, it's not a consensus; it's a fragility point.
  3.  **Absence of Uptake as Evidence:**
      *   **Fix:** Step 3 (Absence Test). Force the distinction between "market efficiency" (it's bad) and "market failure" (it's too risky for big labs). Your foundation exists to exploit market failure.
  4.  **The Reversal Round:**
      *   **Verdict:** It buys **nothing** if the reviewers are the same. They cannot un-know their prior public commitment (cognitive dissonance + reputational locking).
      *   **Fix:** Do not re-review with the same people. Either bring in one new reviewer for the reversal round, or assign one existing reviewer the role of **"Devil's Advocate"** with explicit permission to contradict their past self without penalty.
  5.  **Manufactured Dissent (Minority Report Rule):**
      *   **Verdict:** **Kill it.** Forced lying creates noise, not signal. If everyone agrees, a fake minority report devalues the real ones.
      *   **Replacement:** **The Pre-Mortem.** If unanimous, assign one reviewer to write: "It is 2 years later. This project failed. Why?" This extracts the *private doubts* they are suppressing to maintain consensus. This is real information.

  ---

  ### Running the Cases

  #### Case 1: The Bandwagon (Method is hot, 3 other funders, unanimous panel)
  *   **Protocol Output:**
      *   Step 1: **Flag Correlated Signal.** (Everyone citing the same hype).
      *   Step 3: **Absence Test.** (Uptake is high, so this passes, but...)
      *   Step 5: **Escalate to PO.**
  *   **Decision:** **No** (unless the proposal has a specific, uncorrelated angle).
  *   **Reasoning:** You are not a venture capitalist. Funding the consensus adds no information to the ecosystem. You are pouring water into a full bucket.
  *   **Public Rationale:** "While this approach is gaining traction, our review indicated the proposal relied heavily on current field consensus rather than offering a distinct methodological divergence. We are prioritizing under-explored avenues."
  *   **Why:** You must signal that you do not follow herds. This protects your brand for when you *do* bet against the herd.

  #### Case 2: The Negative Replication (Confident field, nobody funded, one honest review)
  *   **Protocol Output:**
      *   Step 3: **Absence Test.** Panel selects **(C) Too risky for reputations.**
      *   Step 5: **Escalate to PO.**
  *   **Decision:** **Yes.**
  *   **Reasoning:** This is the definition of market failure. The science is high-value (truth-seeking), but the reputational cost for a university lab is too high. You absorb the reputational cost.
  *   **Public Rationale:** "This project addresses a high-confidence result in [Field] that lacks robust negative-control validation. We recognize the reputational risk inherent in replication work; this grant is intended to absorb that risk to ensure the reliability of the baseline literature."
  *   **Why:** Loudly stating you are funding *risk absorption* validates the decision to the board. You aren't saying the science is "better"; you're saying the *incentive structure* was broken.

  #### Case 3: The Crow-Eating (You rejected it, others cited you, now back)
  *   **Protocol Output:**
      *   Step 4: **Reversal Check.** Facts haven't changed; *your prior signal* blocked them.
      *   Step 5: **Escalate to PO.**
  *   **Decision:** **Yes.** (Provided the science is technically sound, even if "mediocre" by hot-standards).
  *   **Reasoning:** You created a negative cascade. Your public rationale was the "public action" that told other funders to say no. You have a moral and strategic obligation to break the cascade you started if new private signals (decent scores) suggest you were wrong.
  *   **Public Rationale:** "Two years ago, we declined this proposal citing [Reason X]. Upon re-evaluation, we acknowledge that [Reason X] was given disproportionate weight relative to [New Evidence/Context]. We are funding this to correct the record and ensure promising early-stage work is not stalled by prior funding signals."
  *   **The Hard Truth:** **Eat crow loudly.** A quiet reversal looks like a mistake. A loud reversal looks as a *governance feature*. It tells the field: "We update." This increases the value of your future rejections (people know you aren't stubborn) and your future acceptances (people know you aren't following trends).
  *   **Mediocre Science?** If the science is truly bad, don't fund it. But if it's "mediocre" only because the field moved on due to *your* signal, fund it. You are buying the correction of the signal, not just the data.

  ---

  ### Failure Modes & Limitations

  **1. The Contrarian Trap**
  *   **Risk:** You start rejecting everything popular and funding everything hated.
  *   **Symptom:** Your portfolio has zero overlap with any other funder, ever.
  *   **Fix:** Step 1 (Source Correlation) must be rigorous. Sometimes the crowd is right. If the crowd is right *and* the private signal is strong, fund it. Don't contrarianize for the sake of branding.

  **2. Reviewer Fatigue**
  *   **Risk:** The "Pre-Mortem" and "Source Audit" feel like busywork.
  *   **Symptom:** Reviewers start templating their answers.
  *   **Fix:** Rotate the "Devil's Advocate" role. Do not do the Pre-Mortem on every grant; only on Unanimous Yes votes.

  **3. The "Board Defense" Problem**
  *   **Risk:** Your board hates the "We were wrong" rationale.
  *   **Symptom:** They pressure you to soften the language on Case 3.
  *   **Fix:** Show them the Herding Literature. Explain that a foundation that never reverses is a foundation that creates cascades. If they want to avoid funding errors, they must allow error correction. Frame it as "Risk Management," not "Apology."

  **4. Untrustworthy Outputs**
  *   **Do Not Trust:** Unanimous scores without a Pre-Mortem.
  *   **Do Not Trust:** Rationales that use the phrase "Field Consensus" as a primary justification for merit.
  *   **Do Not Trust:** Rejections based solely on "Lack of Preliminary Data" in early-stage calls (this is often a proxy for "I don't want to be the first to bet").

  ### Summary of Machinery vs. Lab Coat

  *   **Real Machinery:** Blind pre-scores, Junior-first speaking order, Source Correlation audit, Pre-Mortem on unanimity.
  *   **Lab Coat (Judgment):** Deciding if a citation overlap is "correlated" or just "foundational," determining if a reversal is "strategic" or "capitulation," writing the public rationale that admits error.

  **Final Advice:** Your greatest asset is not your money; it is your **public rationale**. It is the only thing that breaks cascades in your ecosystem. If you write safe, consensus-driven rationales, you are just a tax on grants. If you write honest, signal-correcting rationales (even when they admit fault), you become infrastructure. Use the procedure to ensure you have the evidence to back up the honesty.
