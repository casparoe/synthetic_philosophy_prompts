      *   **The Worry (The Inference):** If these periods are invented, then there can't be a distinctive, bounded transformation in epistemic norms (empirical justification) between 1300 and 1700. Specifically, the changes around the 1660s (Royal Society, peer witnessing, etc.) can't be a *structural epistemic shift*, only a *localized event*. This leads to "flat historiography" where every practice is *sui generis* and cross-temporal comparison is illegitimate.
