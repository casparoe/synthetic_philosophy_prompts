      *   **Distinction 4: Foucault's Episteme.** Foucault rejects continuous history but also rejects simple periodization. He looks for rules of formation. This supports the idea of structural shifts without "Spirit of the Age" narratives.
      *   **Addressing the "Flat Historiography" Fear:** Denying grand narratives doesn't mean denying *all* patterns. It means looking for specific lineages of practice rather than monolithic blocks.

