answer: |-
  # Activity Design: Broken Scale

  **Objective:** To phenomenologically simulate the experience of incommensurable values—where choosing one value necessitates the active destruction of another, not merely a trade-off.
  **Participants:** 10 Grad Students.
  **Duration:** 90 Minutes.
  **Materials Needed:**
  *   30 Cards (10 Red, 10 Blue, 10 Green). Heavy cardstock is best.
  *   1 Large Box (opaque, placed centrally). Label it "The Remainder".
  *   1 Timer.
  *   1 Scenario Sheet (printed or written on board).
  *   3 Vocabulary Sheets (one for each color, see below).

  ---

  ## 1. The Scenario (Read Aloud - 5 Mins)
  Do not offer theory. Do not define "incommensurability." Read this slowly:

  > "You are the Ethics Board for the [City/Region] Arts Collective. A beloved senior artist, 'M,' has been accused of plagiarism. Evidence is conclusive: M copied significant portions of a marginalized junior artist's work.
  >
  > **If you expose M:** The truth is recorded. Integrity is upheld. But M will be ostracized, lose their livelihood, and the community trust that fuels the Collective will shatter. Many small projects dependent on M's reputation will collapse.
  >
  > **If you protect M:** The community remains intact. Vulnerable members feel safe from scandal. But the truth is buried. The junior artist is silenced. The definition of 'art' within the community becomes knowingly false.
  >
  > You cannot compromise. You cannot issue a vague statement. You must either **Expose** or **Protect**."

  ## 2. The Rules (5 Mins)
  Explain the mechanic clearly. No questions yet.

  1.  **The Colors:**
      *   **Red (Care):** Focuses on harm, safety, community trust, welfare, protection.
      *   **Blue (Autonomy):** Focuses on agency, rights, freedom, consent, sovereignty.
      *   **Green (Truth):** Focuses on facts, integrity, accuracy, reality, honesty.
  2.  **The Vote:** You must choose **one** color that dictates your decision.
  3.  **The Cost:** To cast your vote, you must physically **tear the other two cards in half** and drop them into "The Remainder" box. You keep your chosen color.
  4.  **The Lock:** When justifying your vote, you may **only** use words from the Vocabulary Sheet of the color you kept. If you use a word from another color, you are silenced.
  5.  **The Payoff:** There is no grade. There is no correct answer. The only outcome is the verdict reached by the majority and the pile of torn cards left on the table.

  ## 3. Deliberation (30 Mins)
  *   **Setup:** Students sit in a circle. Cards are distributed face down (3 per person: 1 Red, 1 Blue, 1 Green).
  *   **Task:** Discuss the scenario. Try to reach a consensus on what to do.
  *   **Facilitator Note:** Do not intervene. Let them struggle. If they try to solve it by saying "We can do both," remind them: "The scenario forbids compromise. You must choose."
  *   **Tension Point:** Watch for them trying to create a hierarchy (e.g., "Truth is always more important than Care"). Let them argue this. It sets up the failure of the next stage.

  ## 4. The Ritual: Vote & Tear (20 Mins)
  *   **Instruction:** "The deliberation is over. You must now commit. One by one, approach the box. Declare your color. Tear the other two. Drop them. Keep your card."
  *   **The Action:**
      1.  Student stands.
      2.  Holds up the two cards they are *rejecting*.
      3.  Tears them in half. (Encourage them to make it audible).
      4.  Drops the pieces in the box.
      5.  Places their kept card face up on the table.
  *   **Facilitator Note:** If someone hesitates or tries to fold the cards instead of tearing, stop them. "The rule is destruction. If you won't tear, you won't vote."
  *   **Counting:** Once all 10 have voted, tally the cards on the table. The majority color determines the Board's Official Decision.
      *   *Majority Green:* Expose.
      *   *Majority Red:* Protect.
      *   *Majority Blue:* (Interpret as either, depending on how they framed autonomy—usually Expose for the junior artist, Protect for the senior artist. Let them decide this mapping during deliberation).
      *   *Tie:* The Decision is Null. The status quo remains (which is usually a failure of ethics).

  ## 5. The Justification (20 Mins)
  *   **Task:** Each student has 2 minutes to justify why the Board's Decision was correct, using **only** the vocabulary of the color they kept.
  *   **Enforcement:** You (the facilitator) hold the Vocabulary Sheets. If a student says a word outside their color, clap once. They must stop speaking immediately. They lose their remaining time.
  *   **Vocabulary Lists:**
      *   **Red:** Care, Harm, Safety, Trust, Community, Welfare, Protection, Healing, Support, Vulnerability.
      *   **Blue:** Choice, Agency, Rights, Freedom, Sovereignty, Consent, Power, Self, Will, Independence.
      *   **Green:** Truth, Facts, Integrity, Accuracy, Reality, Honesty, Evidence, Clarity, Exposure, Validity.
  *   **Example of Violation:** A Green player says, "We must expose because hiding it *harms* the community." ('Harms' is Red). *Clap.* Silence.
  *   **Example of Compliance:** A Green player says, "We must expose because hiding it undermines *reality* and *validity*."

  ## 6. Debrief (10 Mins)
  Do not let them relax. Keep the torn cards in the box. Keep the remaining cards on the table.

  **Phase 1: The Physical Act (3 Mins)**
  *   "Look at the box. Look at the table."
  *   "How did it feel to tear the cards? Did it feel like discarding something, or destroying something?"
  *   "Did anyone try to tear them gently? Why?"
  *   **Point:** The tear represents the loss of the value itself in this context. It isn't set aside for later; it is broken here.

  **Phase 2: The Vocabulary Lock (4 Mins)**
  *   "Who got clapped? How did it feel to be silenced?"
  *   "Did anyone feel they couldn't express their full reasoning because the words weren't allowed?"
  *   **Point:** Incommensurability means there is no common language to weigh the values. You cannot say 'Truth is worth more than Care' because there is no currency they both share. The vocabulary lock forced you to inhabit one world where the other value literally does not exist.

  **Phase 3: The Limitations (3 Mins)**
  *   "What did this simulation fail to capture?"
  *   **Acknowledge these explicitly:**
      1.  **Reversibility:** You can tape the cards back together. You cannot tape a reputation back together. The clean tear is a lie; real moral loss is messy and bleeds.
      2.  **Stakes:** Your social status in this room is not a livelihood. The anxiety you felt is a shadow of the anxiety M feels.
      3.  **Time:** You had 90 minutes. Real hard choices haunt you for years. The silence after the game ends is where the real philosophy happens.

  ---

  ## Facilitator Notes: What Will Go Wrong

  **1. The Gamification of Loss**
  *   **Prediction:** Students will treat the tearing as a mechanic to "win" the vote. They might laugh or make a show of it.
  *   **Response:** Do not scold. In the debrief, ask: "Why did we laugh? Was it nervousness, or did the paper feel too cheap to represent a value?" This reveals their resistance to taking the loss seriously.

  **2. Vocabulary Smuggling**
  *   **Prediction:** Students will try to redefine words. "Truth is actually a form of Care."
  *   **Response:** Enforce the clamp strictly. If they argue the definition, clap them. The point is that within the logic of the choice, you cannot borrow strength from the other side. If you could, it wouldn't be a hard choice; it would be a calculation.

  **3. The Minority Silence**
  *   **Prediction:** If Green wins 9-1, the one Red voter will feel isolated. Their tearing of the Green card feels pointless.
  *   **Response:** This is accurate to the phenomenon. In hard choices, the minority value is often actively suppressed by the majority decision. Let them feel that isolation. Do not comfort them. Ask them in the debrief: "Did your torn card matter if the majority kept theirs?"

  **4. The "Clean Cut" Illusion**
  *   **Prediction:** Students will leave the room feeling the problem is solved because the vote is counted.
  *   **Response:** Remind them: "The vote decides the action. It does not resolve the value conflict. The torn cards are still in the box. They are still a cost. You just decided who pays them."

  ## What This Activity Cannot Reproduce

  Be honest with them. This simulation is a map, not the territory.

  1.  **Existential Weight:** Tearing paper is cathartic; ruining a life is traumatizing. You cannot simulate trauma safely. If you could, it would be unethical.
  2.  **The Long Tail:** In real life, the "torn" value often comes back to haunt you (regret, backlash). Here, the game ends. The silence of the room substitutes for the silence of regret, but it is not the same.
  3.  **Complexity:** Real values are not three colors. They are tangled. This activity simplifies the landscape to make the mechanism visible. Acknowledge that real life is messier than Red, Blue, and Green.

  ## Closing Instruction
  "Do not pick up the cards. Leave the box on the table. When you leave, leave the pieces here."
