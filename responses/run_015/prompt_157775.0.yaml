  **Seminar Plan: The Internal Reasons Thesis**

  **Carrying Scenario:** The Inherited Stamp Collection. An agent inherits a collection, lacks interest, yet efficiently maintains it.
  *Justification:* Gunman examples conflate prudential fear with normative force; moral blackmail conflates obligation with motivation. The stamp case isolates arbitrary ends to test whether instrumental efficiency generates normative traction without prior desire.

  **Conceptual Sequence:**
  1.  **Instrumental Rationality:** Establish the agent has reason to buy albums *if* they value the collection.
  2.  **Challenging the End:** Query whether they have reason to value the collection itself.
  3.  **External Consideration:** Introduce the claim: "Philately is objectively valuable."
  4.  **Motivational Gap:** Observe that acknowledging value fails to motivate the uninterested agent.
  5.  **Internalisation:** Derive the thesis: reasons must link to the subjective motivational set to be genuine.
  *Rationale:* This progression prevents the distinction from appearing as a stipulation by first exhausting the externalist intuition.

  **Misconceptions & Interceptions:**
  1.  *Slide to 'no reason whatsoever':* Intercept at Stage 2. Clarify hypothetical reasons (conditional) remain valid even if categorical ones fail.
  2.  *Conflation with Weakness of Will:* Intercept at Stage 4. Emphasise this is not psychological failure but a lack of normative grounding; the agent isn't failing to act, they lack a ground to act.
  3.  *Normative Force as Psychological Efficacy:* Intercept at Stage 5. Distinguish justification from causation; motivation is evidence of a reason, not its definition.

  **Diagnostic Question:**
  "If an agent acknowledges a fact as a reason but remains unmoved, have they misunderstood the fact or the reason?"
  *Target:* Tests if they grasp that unmoved acknowledgement implies the 'reason' was never truly a reason *for them*.

  **Omissions:**
  1.  *Moral Realism Debates:* Rationale: Distracts from the structural link between reason and motivation.
  2.  *Williams's Full Argument:* Rationale: Too technical for a single session; focus on the intuition pump first.

  **Pedagogical Note:** Students treat distinctions as psychological descriptions. Constantly redirect to normative logic. Ensure British spelling.
