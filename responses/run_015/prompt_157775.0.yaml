          1.  Map instrumental efficiency (buying albums).
          2.  Challenge the end (why catalogue?).
          3.  Introduce external claim ("stamp collecting is good").
          4.  Observe motivational inertness.
          5.  Conclude: Reasons require subjective motivational sets.
      *   *Misconceptions:*
          1.  *Slide to 'no reason':* Intercept at stage 2. Clarify hypothetical vs. categorical imperatives.
          2.  *Weakness of will:* Intercept at stage 4. Emphasise logical gap, not psychological failure.
          3.  *Normative force = efficacy:* Intercept at stage 5. Distinguish justification from causation.
      *   *Diagnostic Question:* "If an agent acknowledges a fact as a reason but remains unmoved, have they misunderstood the fact or the reason?"
