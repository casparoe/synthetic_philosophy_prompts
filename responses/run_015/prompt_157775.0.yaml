      *   **Goal:** Understand the "wrong kind of reasons" problem (instrumental reason promoting an end doesn't furnish reason to pursue end; external consideration fails to generate motivation).
      *   **Deliverable:** A structured pedagogical plan (not the explanation itself).
      *   **Specific Requirements:**
          *   Precise order of conceptual pieces (internal/external distinction must feel earned).
          *   One concrete carrying scenario (justify avoiding gunman/moral-blackmail).
          *   Predictable misconceptions at each stage + interception point (slide to "no reason", conflation with weakness of will, normative force = psychological efficacy).
          *   Single diagnostic question near the end (test dependency between reason and motivation).
          *   What to openly decline to cover + rationale.
          *   British spelling.
          *   Under 450 words.
          *   No reading lists/bibliographies/citation requests.

  2.  **Drafting - Section by Section:**

      *   **Structure:** Needs to be a plan, so headings or bullet points work best.
      *   **Scenario:** Need something non-coercive and non-moralistic. Gunman implies prudential reason (fear). Moral blackmail implies moral obligation. We want something where the end is arbitrary or aesthetic to isolate the "reason" aspect. Maybe a hobby or a trivial pursuit? Let's try "collecting bottle caps" or "playing a game". Let's go with "The Chess Tournament" – instrumental reasons exist (move knight to checkmate), but why care about checkmate? Actually, the prompt asks about *possessing an instrumental reason that reliably promotes an end does not automatically furnish a reason to pursue that end*. This sounds like the distinction between reasoning from a given desire vs. having a reason to have the desire.
      *   *Correction on Scenario:* The prompt specifically mentions avoiding gunman/moral-blackmail. These are classic externalist/intimidation examples. A better scenario is one where the agent has a goal, but the reason to pursue the *goal* itself is questioned. Let's use "The Archivist". An agent wants to catalogue shells. Instrumental reasons exist (buy boxes). But do they have a reason to catalogue shells?
      *   *Refinement:* The prompt asks about the "wrong kind of reasons problem". Usually, this refers to Pascal's Wager type stuff (pragmatic vs. epistemic) or bribery in belief. But here it's framed around Williams/Internal Reasons. The prompt says: "why possessing an instrumental reason that reliably promotes an end does not automatically furnish a reason to pursue that end". This is the Humean/Williams point. If I want X, I have reason to do Y. But do I have reason to want X?
      *   *Scenario Choice:* "The Inherited Collection". An agent inherits a stamp collection. They have no interest. But maintaining it promotes the end of "preserving the collection". Does the instrumental efficiency give them a reason to care?
      *   **Sequence:**
          1.  Establish instrumental rationality (means-end).
          2.  Question the end itself.
          3.  Introduce external consideration (e.g., "it's valuable").
          4.  Show motivation gap.
          5.  Derive Internal Reasons Thesis.
      *   **Misconceptions:**
          1.  "No reason whatsoever" (Intercept: Distinguish subjective vs. objective).
          2.  "Weakness of will" (Intercept: Distinguish inability vs. lack of grounding).
          3.  "Normative force = psychological efficacy" (Intercept: Distinguish 'ought' from 'will').
      *   **Diagnostic Question:** Needs to test dependency.
      *   **Omissions:** Meta-ethics realism, detailed Williams exegesis.
      *   **Word Count:** Strict limit (450 words). British spelling.

  3.  **Drafting - Content & Constraints:**

      *   *Scenario:* The Inherited Stamp Collection. Justification: Gunman examples confuse prudential fear with normative reasons; moral blackmail conflates obligation with motivation. The stamp case isolates arbitrary ends.
