answer: |-
  Here are 7 questions designed to press the structural weaknesses of superrationality without asking for a basic overview. Each includes the anticipated defensive move and a follow-up designed to tighten the bind.

  ### 1. The EDT Collapse
  **Question:** Critics often argue that once you cash out "we are running the same algorithm" into probabilistic terms, superrationality collapses into Evidential Decision Theory (EDT). EDT says, "Condition on the news that I cooperate; that's evidence they cooperate." You claim superrationality is distinct because it relies on logical necessity, not just correlation. But if the logical necessity is grounded in physical similarity, isn't that just a very strong evidential correlation? Where exactly is the lever that EDT lacks?

  *   **Likely Answer:** She will likely distinguish between *causal* evidence (smoke indicates fire) and *logical* counterfactuals (my reasoning process *is* their reasoning process). She'll argue EDT fails on Newcomb-like problems where the correlation is acausal, whereas superrationality treats the output as a logical fact.
  *   **Follow-up:** "If it's a logical fact, it must be true in all possible worlds where the algorithm holds. But if I introduce a single bit of noise into my random number generator that your copy lacks, the logical identity breaks, yet the evidential correlation remains near 100%. If you defect in that case because the logical link is broken, aren't you admitting the 'necessity' is fragile while the 'evidence' is strong? Why should rationality track the fragile logical identity rather than the robust evidential probability?"

  ### 2. The Near-Copy Cliff
  **Question:** Let's talk about algorithmic similarity. If I am playing against a copy of myself that is 99% identical—we share the same source code but have slightly different random seeds or memory addresses—does the superrational obligation degrade smoothly? Do I cooperate with 99% probability? Or is it a binary cliff-edge where I defect because we aren't *strictly* identical?

  *   **Likely Answer:** She will likely argue for a threshold or a "type" identity. She may say that if we are both "superrational agents," the specific implementation details don't matter, implying a binary classification.
  *   **Follow-up:** "If it's binary, that implies a single bit of difference in my RAM turns a cooperative obligation into a defection obligation, even if the probability of our matching outputs is 99.9%. That looks like moral magic. But if it degrades smoothly, then you're just maximizing expected utility based on the probability of correlation. In that smooth case, what work is the word 'superrational' doing that 'evidential' isn't?"

  ### 3. The Staggered Run
  **Question:** Here's a case I want to press: Two instantiations of your algorithm. Copy A is launched, runs, outputs its decision, and that output is sealed in a physically irreversible box an hour *before* Copy B is even launched. Copy B knows all of this. Copy B knows Copy A's output is already fixed in the past and cannot be causally influenced. Does Copy B cooperate?

  *   **Likely Answer:** She will likely say B still cooperates. The reasoning is that B's decision is a logical proxy for A's decision, regardless of temporal order. The correlation exists outside of time.
  *   **Follow-up:** "If B cooperates, what exactly is B optimizing? B knows A's output is fixed. B isn't influencing A. B isn't influencing a common cause. B is essentially praying that the fixed past matches its current choice. If that's the case, isn't superrationality just a heuristic for trusting that the universe is arranged such that logical twins align? And if B *defects* because the causal loop is broken, doesn't that admit that the view was never about logic, but just bookkeeping for causal loops?"

  ### 4. The Kantian Bolt-On
  **Question:** Kant's Categorical Imperative says, "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Superrationality says, "Choose the action that is best if everyone in your reference class chooses it." Is this anything more than the Categorical Imperative with payoff matrices bolted on?

  *   **Likely Answer:** She will likely agree there is a kinship but argue that superrationality is descriptive and formal, whereas Kant is normative and vague. She'll say game theory gives the "universal law" teeth.
  *   **Follow-up:** "But Kant struggles with conflicting maxims—what if universalizing one rule creates a contradiction? In game theory, if the payoffs are asymmetric, the 'best if everyone picks it' solution might not exist or might favor one player over the other. If I'm the player with the lower payoff in the cooperative equilibrium, why is it rational for me to will this universal law? Does superrationality silently import a moral premise about fairness that isn't in the math?"

  ### 5. The Metaphysics of the "Type"
  **Question:** For superrationality to work, there has to be a fact of the matter about which agents belong to your "reference class" or "type." In a physicalist universe, I am a collection of atoms; you are a collection of atoms. Where does this "type" exist? Is it a Platonic object? Or is it just a label I paste on agents I choose to trust?

  *   **Likely Answer:** She will likely argue it's about functional organization. The "type" is the abstract computation being instantiated, which exists independently of the substrate.
  *   **Follow-up:** "If it's the abstract computation, then a simulation of me on a slow computer is the same type as me on a fast computer. But if the slow computer times out before making a decision, are they still my twin? If physical constraints can break the 'type,' then the type isn't purely abstract. If it's not purely abstract, aren't we back to physical similarity, which returns us to the evidential correlation problem?"

  ### 6. Asymmetric Payoffs
  **Question:** Superrationality works cleanly in symmetric Prisoner's Dilemmas. But what about asymmetric games? Suppose if we both cooperate, I get 5 and you get 10. If we both defect, we get 1. The superrational argument suggests we should cooperate because we reason alike. But why should *I* cooperate? My reasoning tells me that if I defect, you (reasoning like me) will also defect. But if I can somehow convince you to cooperate while I defect, I win big. Does superrationality require me to ignore the fact that the equilibrium favors you?

  *   **Likely Answer:** She will likely argue that rational agents would agree on a fair equilibrium before playing, or that the "best if everyone picks it" rule selects the Pareto optimal outcome.
  *   **Follow-up:** "That sounds like bargaining, not decision theory. If we need to negotiate the equilibrium *before* applying the decision rule, then superrationality isn't a standalone guide to action. It's a coordination protocol that only works if we already agree on what 'fair' means. Doesn't that push the hard problem back a step rather than solving it?"

  ### 7. The Falsification Condition
  **Question:** I want to end on where the view breaks. Many proponents defend these theories by saying counterexamples are "unrealistic" or "idealizations." I want to avoid that. Describe a specific thought experiment or a concrete observation about agent behavior that, if true, would force you to abandon superrationality. If you can't name one, how do we distinguish this from a belief that is insulated from reality?

  *   **Likely Answer:** She might say, "If I found that agents who reasoned superrationally consistently achieved lower payoffs in empirical tournaments than CDT agents."
  *   **Follow-up:** "But in a one-shot game, you can't empirically test that without running multiple trials, which turns it into an iterated game where CDT also cooperates. If the view is only applicable in one-shot scenarios that are by definition untestable, and you concede that in testable (iterated) scenarios the distinction vanishes, aren't you admitting that superrationality is a story we tell ourselves about situations where we can never be proven wrong?"
