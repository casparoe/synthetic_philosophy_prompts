answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a colleague of [Honoree's Name], and I've had the privilege of watching her lead this department for the last twenty years.

  Now, looking around this room, I know I've got a tough crowd. On one side, we have family who know that "ethics" mostly means remembering to say please and thank you. On the other, we have grad students who are currently mentally editing every sentence I say for philosophical accuracy. So, I'm going to walk a tightrope. I promise no jargon, and I promise no misquotes.

  Here's the thing about twenty years in a leadership role. Usually, we talk about jobs like they're hats. You put on the "Department Chair" hat in the morning, you take it off at night, and underneath, you're still just you. If you retire, you hang up the hat, and you walk away unchanged.

  But [Honoree's Name] never treated this job like a hat. She treated it like what it actually is: a relationship.

  There's an old idea in philosophy that says we aren't just isolated individuals walking around bumping into each other. It says we are actually made of our relationships. You aren't a parent unless you have a child. You aren't a teacher unless you have a student. The role doesn't just describe what you *do*; it shapes who you *are*.

  For two decades, [Honoree] let this department shape her, and she shaped us right back. She didn't just administer policies; she built connections. She listened to grad students when they were panicked, she fought for resources when we were stretched thin, and she celebrated our wins like they were her own. She wasn't just wearing a title; she was inhabiting a web of care that included every single person in this room.

  Now, I know what some of you might be thinking. If a role helps make you who you are, does stepping away mean losing part of yourself? Does retirement feel like a subtraction?

  I don't think so. And here's why.

  Because relationships don't vanish just because a title changes. The care she poured into this department didn't disappear when she emailed her resignation. It stayed in us. It's in the way we mentor our own students now. It's in the culture of this department. In a very real sense, she isn't leaving the role behind; she's leaving the role *in us*.

  And besides, none of us are ever just one thing. Yes, she was our Chair. But she is also a friend, a mentor, a mother, and a grandmother. Retirement isn't the end of being someone; it's just the chance to stop watering one part of the garden so you can tend to the rest.

  So, [Honoree], thank you for letting us be part of who you are for the last twenty years. We're honored to carry what you've built.

  Everyone, please raise a glass. To [Honoree]—may your next chapter be just as rich, just as connected, and finally, just as relaxed. Cheers!
