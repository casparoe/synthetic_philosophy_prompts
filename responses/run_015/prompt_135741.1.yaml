  # Sequential Premise-Priority Protocol (SP3)

  **Objective:** To aggregate binary judgments from five interdisciplinary reviewers into a single funding decision within 90 minutes, managing the discursive dilemma by prioritizing logical consistency while flagging value conflicts for deliberation.

  **Logical Structure:**
  Funding ($F$) is approved if and only if:
  1.  **Empirical Adequacy ($E$)** is accepted.
  2.  **Inferential Validity ($I$)** is accepted.
  3.  **Ethical Permissibility ($H$)** is accepted.
  *Rule:* $E \land I \land H \rightarrow F$.

  **Thresholds:**
  *   **Consensus:** Simple Majority (3 out of 5 reviewers).
  *   **Rejection:** Failure to reach Consensus on any premise, or Consensus to Reject the Conclusion.
  *   **Deliberation Halt:** Triggered when Premise-derived logic conflicts with Conclusion vote.

  ---

  ### I. The Procedure (90-Minute Sequence)

  **Phase 1: Premise Voting (Minutes 0–45)**
  1.  Reviewers cast binary votes (Accept/Reject) on $E$, $I$, and $H$ independently.
  2.  **Aggregation Rule:** Premise-Based.
  3.  **Threshold:** A premise passes if $\ge 3$ reviewers Accept.
  4.  **Mandated Rejection Point:** If *any* premise ($E, I,$ or $H$) fails to reach 3 Accepts, the proposal is **Rejected**. The meeting ends. (This ensures scientific or ethical dealbreakers veto the process immediately).

  **Phase 2: Conclusion Voting (Minutes 45–60)**
  1.  *Only if all premises passed Phase 1.*
  2.  Reviewers cast a binary vote on the Final Recommendation ($F$).
  3.  **Threshold:** A recommendation passes if $\ge 3$ reviewers Accept.

  **Phase 3: Consistency Check & Halt (Minutes 60–75)**
  1.  Compare the **Derived Decision** (from Phase 1 logic: $E \land I \land H$) with the **Direct Decision** (from Phase 2 vote on $F$).
  2.  **Condition A (Consistent):** Derived and Direct decisions match. **Decision Stands.**
  3.  **Condition B (Inconsistent):** Derived = Fund, Direct = Reject.
      *   **Diagnosis:** This indicates a **Value Conflict**. The logic holds (data/inference/ethics are individually acceptable), but the collective will rejects the outcome (likely due to unquantified risk or weighting disagreements).
      *   **Action:** **Halt.** The procedure mandates a 15-minute structured deliberation focused *only* on why the conclusion was rejected despite passing premises.
  4.  **Condition C (Inconsistent):** Derived = Reject, Direct = Fund.
      *   **Diagnosis:** This indicates a **Logic Failure**. The panel wants to fund a proposal that fails its own criteria.
      *   **Action:** **Reject.** (Safety constraint: Logic cannot be overridden by desire).

  **Phase 4: Resolution (Minutes 75–90)**
  1.  If Condition B (Halt) occurred:
      *   Reviewers discuss the specific value weighting causing the split.
      *   **Final Aggregation:** If deliberation does not produce a unanimous shift in the Conclusion vote, the **Derived Decision (Fund)** prevails.
      *   *Rationale:* In a research fund, logical integrity of the proposal ($E, I, H$) is the primary mandate. Persistent rejection of a logically sound proposal is treated as a preference divergence, not a factual error.

  ---

  ### II. Worked Cases

  #### Case 1: The Ethical Split (Inconsistent Collective Judgment)
  **Profile:**
  *   **Reviewers 1–4:** Accept $E$, Accept $I$.
  *   **Reviewer 5:** Rejects $E$, Rejects $I$.
  *   **Ethical Vote ($H$):** Reviewers 1–2 Accept; Reviewers 3–5 Reject. (2 Accept, 3 Reject).
  *   **Conclusion Vote ($F$):** Reviewers 1–2 Accept; Reviewers 3–5 Reject. (2 Accept, 3 Reject).

  **Procedure Application:**
  1.  **Phase 1:** $E$ passes (4-1). $I$ passes (4-1). $H$ **Fails** (2-3).
  2.  **Mandated Rejection:** Since $H$ failed to reach the threshold of 3, the procedure mandates **Rejection** at Minute 45.
  3.  **Outcome:** Rejected.
  4.  **Analysis:** The "inconsistent collective judgment" (where a majority might accept $E$ and $I$ but reject $F$) is preempted. By treating Ethics as a premise with a veto, the procedure forces consistency early. The discursive dilemma is resolved by prioritizing the ethical constraint as a logical gate.

  #### Case 2: The Fragmented Rejection (Hard Case)
  **Profile:**
  *   **Reviewer 1:** Reject $E$ (Data bad). Accept $I, H$. $\rightarrow$ Reject $F$.
  *   **Reviewer 2:** Reject $E$ (Data bad). Accept $I, H$. $\rightarrow$ Reject $F$.
  *   **Reviewer 3:** Accept $E$. Reject $I$ (Inference bad). Accept $H$. $\rightarrow$ Reject $F$.
  *   **Reviewer 4:** Accept $E$. Reject $I$ (Inference bad). Accept $H$. $\rightarrow$ Reject $F$.
  *   **Reviewer 5:** Accept $E, I$. Reject $H$ (Ethics bad). $\rightarrow$ Reject $F$.
  *   **Conclusion Vote ($F$):** 0 Accept, **5 Reject** (Unanimous).

  **Procedure Application:**
  1.  **Phase 1 (Premises):**
      *   $E$: 3 Accept (R3, R4, R5) vs 2 Reject. **Passes.**
      *   $I$: 3 Accept (R1, R2, R5) vs 2 Reject. **Passes.**
      *   $H$: 4 Accept (R1, R2, R3, R4) vs 1 Reject. **Passes.**
      *   *Derived Decision:* **Fund.**
  2.  **Phase 2 (Conclusion):**
      *   $F$: 0 Accept vs 5 Reject.
      *   *Direct Decision:* **Reject.**
  3.  **Phase 3 (Consistency Check):**
      *   Mismatch Detected (Derived=Fund, Direct=Reject).
      *   **Condition B (Value Conflict)** triggered. **Halt for Deliberation.**
  4.  **Phase 4 (Resolution):**
      *   Deliberation reveals reviewers cannot reconcile their reasons (R1-2 won't accept $E$ just because R3-5 did; R5 won't accept $H$ just because others did). No vote shift occurs.
      *   **Final Decision:** **Fund** (Derived Decision prevails).

  **Analysis:** This is the **Hard Case**. The procedure yields an answer (**Fund**) that the panel will find **unwelcome** because *every single reviewer* voted to reject the proposal. The rejection was unanimous, but the *reasons* were fragmented such that no single premise failed by majority. The procedure prioritizes the logical aggregation of premises over the unanimous will of the conclusion, exposing the panel to the "Doctrinal Paradox."

  ---

  ### III. Limitations and Verdict

  **Irreducible Limitation: Agenda Power (Framing Vulnerability)**
  The procedure is permanently vulnerable to manipulation by **framing**. The outcome depends entirely on which dimensions are codified as "Premises" (logic-gated) versus "Conclusion" (value-gated).
  *   *Example:* If "Ethical Permissibility" is moved from a Premise ($H$) to a sub-component of the Conclusion ($F$), Case 1 would result in **Funding** (since $E$ and $I$ pass, and $F$ might pass if ethics are weighted lower).
  *   *Example:* If "Inferential Validity" is treated as a matter of judgment (Conclusion) rather than fact (Premise), Case 2 would result in **Rejection**.
  *   Because the procedure treats Premises as truth-apt and Conclusions as action-apt, whoever controls the agenda (the definition of $E, I, H$) controls the outcome, regardless of the reviewers' actual votes. This is a consequence of the **List-Pettit Impossibility Theorem**, which proves no aggregation rule can satisfy universal domain, consistency, and anonymity simultaneously.

  **Verdict on Disqualification:**
  **No, this limitation should not disqualify the procedure from high-stakes funding decisions, provided a meta-consensus rule is added.**
  *   *Reasoning:* All decision procedures for interdisciplinary panels face impossibility theorems. The SP3 protocol is superior to pure Conclusion-Based voting because it forces reviewers to justify *why* they reject (by isolating $E, I, H$), preventing "black box" rejections.
  *   *Caveat:* To mitigate the framing vulnerability, the panel must vote on the **Agenda (the definition of Premises)** before voting on the Proposal. If the reviewers themselves ratify that $E, I, H$ are the binding premises, the manipulation risk is democratized. However, the Case 2 outcome (Funding a Unanimously Rejected proposal) remains a critical failure mode. For *extremely* high-stakes decisions (e.g., human safety), a **Unanimous Rejection Veto** should be hard-coded into Phase 3, overriding the Derived Decision. Without that specific safety valve, the procedure is too risky for life-critical allocations, but acceptable for research funding where "false negatives" (rejecting good science) are less costly than "false positives" (funding bad science).
