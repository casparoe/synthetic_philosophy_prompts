prompt: |-
  ok so i'm a novelist who writes about minds and next thursday i'm giving a talk at a philosophy grad seminar. my thesis: cross-cultural variation in intuitions about moral responsibility — especially the way some east asian frameworks treat intentionality as distributed across social relations rather than locked inside individual heads — isn't cognitive noise or bias but tracks a genuinely different metaphysics of agency. treating WEIRD samples as neutral baseline for normative ethics is therefore circular, not empirical. audience: mostly analytic philosophers of action who think experimental philosophy just exposes universal reasoning errors, plus one cultural psychologist who'll ask if i'm smuggling normative authority out of descriptive difference. draft my Q&A prep sheet: the objections they'll actually raise, ordered by damage, phrased like they would say them, each with a quick reply and a note on were that reply is softest. include the question i'm hoping nobody asks — probably something about whether this collapses into moral relativism. also tell me what'd change your mind here — what finding or argument would make you drop the thesis — and flag the shakiest part of your reasoning.
