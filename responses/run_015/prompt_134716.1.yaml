      *   **Context:** Philosophy grad seminar talk next Thursday.
      *   **Thesis:** Cross-cultural variation in moral responsibility intuitions (specifically East Asian distributed intentionality vs. Western individual intentionality) reflects a *different metaphysics of agency*, not just cognitive bias. Treating WEIRD (Western, Educated, Industrialized, Rich, Democratic) samples as the neutral baseline is circular.
      *   **Audience:** Mostly analytic philosophers of action (skeptical of x-phi, think it shows errors) + one cultural psychologist (worried about is/ought gap).
      *   **Deliverables:** Q&A prep sheet (objections ordered by damage, phrased authentically, quick reply, weak point), the "hope nobody asks" question (relativism), what would change the AI's mind, and the shakiest part of the reasoning.

  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *The Core Claim:* Metaphysical pluralism about agency based on cultural data.
      *   *The Analytic Philosophers:* They care about *the* truth of agency. They likely believe in a universal structure of action (belief/desire/intention). They view x-phi as showing performance errors, not competence differences. They will attack the move from "people say X" to "the world is X."
      *   *The Cultural Psychologist:* They care about methodology. They will attack the move from "descriptive difference" to "normative/metaphysical weight."
      *   *The Novelist Angle:* The user might lack technical jargon but have strong conceptual intuition. The prep sheet needs to bridge that gap—arm them with philosophical defenses without requiring them to fake being a technical metaphysician.

  3.  **Drafting the Objections (Ordering by Damage):**
      *   *Highest Damage:* The "Is/Ought" or "Descriptive/Metaphysical" gap. Just because cultures *think* differently doesn't mean reality *is* different. This attacks the core inference.
      *   *High Damage:* The "Universal Competence" argument. Analytic philosophers love the idea that underlying the noise is a universal rational structure.
      *   *Medium Damage:* The "Normative Authority" challenge (from the psychologist). If both are valid, how do we judge?
      *   *Lower Damage (but annoying):* Methodological quibbles about the studies (Nisbett, etc.).

  4.  **Drafting the Replies & Weak Points:**
