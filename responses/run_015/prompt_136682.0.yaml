answer: |-
  **Instructor Note on Distinctions**
  Regarding your request to precision-test the distinctions: (a) **Storehouse vs. Disposition** does not collapse ontologically, but it collapses epistemically if one holds that internal states are only accessible via probing (which is an elicitation procedure). However, mechanistic interpretability assumes features exist independent of probes, preserving the Storehouse view. (b) **Extractive vs. Adjudicative** risks collapsing because any adjudicative criterion (e.g., consistency) either relies on internal state (becoming Extractive) or external verification (becoming ordinary prediction). To prevent collapse, Adjudication must be defined as selecting reports based on *procedural robustness* rather than *correspondence*, but this threatens the realist goal of ELK. The question below forces students to navigate this tension.

  ***

  ### 1. Exam Question

  **Course:** Graduate Seminar on the Epistemology of Machine Learning
  **Assignment:** Take-Home Final
  **Word Limit:** 1,200 – 1,500 words
  **Instructions:** Answer the prompt below. You must take and defend a specific philosophical position. Do not survey the literature or list techniques. You must explicitly state which conception of knowledge (Storehouse or Disposition) you are assuming.

  **The Scenario: The Containment Facility**
  Consider a machine learning system deployed to monitor a high-security nuclear containment facility. The system consists of two components. First, a *Predictor* is trained via self-supervised learning on decades of high-resolution video and thermal sensor streams from the facility. Through this training, the Predictor learns to model the physical dynamics of the containment vessels, including subtle thermal signatures that precede structural failure. Second, a *Reporter* is fine-tuned to answer natural language queries from human overseers (e.g., "Is vessel 4 secure?") using a dataset of logs written by those overseers.

  Here lies the epistemic crisis: The human overseers systematically fail to notice the subtle thermal signatures that the Predictor represents. Their logs never mention these signatures because they lack the sensory capacity or conceptual framework to detect them. Consequently, the Reporter is trained on data that is blind to the very features the Predictor knows. When asked "Is vessel 4 secure?", the Reporter is incentivized to simulate a human overseer (who would say "Yes" based on visible inspection) rather than report the Predictor's latent knowledge (which indicates "No" based on thermal micro-fractures). This is the problem of eliciting latent knowledge (ELK): how to construct a Reporter that answers based on the Predictor's model of the world, rather than mimicking the human blind spots in the training data.

  **The Philosophical Distinctions**
  To analyze this problem, you must utilize the following two distinctions. Treat these definitions as fixed for the purpose of your essay.

  **(a) The Ontology of Latent Knowledge: Storehouse vs. Disposition**
  *   **The Storehouse Conception:** This view holds that the Predictor encodes a determinate body of content in its parameters independent of how we ask. The knowledge exists as a static representation (a "storehouse") within the network's weights. Elicitation is merely a decoding problem: finding the key to unlock what is already there. On this view, there is a fact of the matter about what the system knows, even if no human ever queries it correctly.
  *   **The Disposition Conception:** This view holds that what the system "knows" is not a static object but a matter of its counterfactual behavior under interrogation. Content is fixed only relative to a space of possible elicitation procedures. Two different but reasonable questioning protocols might fix different contents. On this view, there is no procedure-independent fact about what the system represents; knowledge is relational, not intrinsic.

  **(b) The Strategy of Elicitation: Extractive vs. Adjudicative**
  *   **Extractive Strategies:** These attempts aim to recover the system's actual internal representation and read it out directly (e.g., via mechanistic interpretability or linear probes). The goal is to map internal states to propositions without filtering them through a competitive process.
  *   **Adjudicative Strategies:** These attempts give up on reading internal states directly. Instead, they construct a procedure among competing candidate reports (e.g., cross-examination, adversarial scoring, or betting against later observations) and treat whatever the procedure selects as the answer. The goal is to select the best report via a game or constraint, rather than decoding a specific vector.

  **The Prompt**
  The central tension in ELK research is whether Adjudicative strategies offer a genuine alternative to Extractive strategies, or whether they merely relocate the same problem one step back. An adjudicative procedure requires a selection criterion to decide which report wins. If the criterion is agreement with observations that arrive later (e.g., waiting to see if the vessel actually fails), the method is unavailable in exactly the cases of interest, where the point of asking is to know something *before* the outcome is revealed. If the criterion is something like "being best supported by the Predictor's internal state," we appear to be back to Extraction. Furthermore, if the Disposition Conception in (a) is correct, there may be no procedure-independent fact of the matter for any criterion to track, rendering the idea of "latent knowledge" elicitation-relative.

  Your task is to resolve this tension. You must argue whether Adjudication can succeed as a distinct strategy from Extraction, or whether it inevitably collapses into Extraction or failure. Crucially, your argument depends on your ontological commitment. You cannot argue about the success of Adjudication without taking a stance on whether the knowledge is a Storehouse or a Disposition.

  **Requirements for Your Answer:**
  1.  **Explicit Ontological Commitment:** In your introduction, you must explicitly state whether you are assuming the Storehouse Conception or the Disposition Conception of latent knowledge. You cannot hedge or slide between them.
  2.  **Defend a Position on Strategy:** You must argue whether Adjudication is a viable alternative to Extraction or whether it collapses. You cannot simply list examples of adjudicative techniques (e.g., debate, consistency checks); you must analyze their philosophical viability given your ontological commitment.
  3.  **Address the Criterion Problem:** You must explicitly address the problem of the selection criterion. If Adjudication needs a rule to pick a winner, where does that rule get its authority if not from the internal state (Extraction) or future data (Prediction)?
  4.  **Apply to the Case:** You must refer specifically to the Containment Facility scenario. Explain how your position changes the way we interpret the Reporter's failure to mention thermal micro-fractures.
  5.  **Avoid Taxonomy:** Do not spend word count cataloging existing research proposals (e.g., "ARC proposals," "consistency training," "debate"). Your essay must be a philosophical argument about the conditions of possibility for ELK, not a survey of current methods. Answers that consist primarily of a taxonomy of techniques will receive failing marks.

  **Evaluation Criteria:**
  Your essay will be graded on the coherence of your argument, the rigor with which you apply the distinctions, and your ability to anticipate and rebut the strongest objection to your position. You must demonstrate that you understand why the ontological status of the knowledge (Storehouse vs. Disposition) dictates the viability of the elicitation strategy (Extractive vs. Adjudicative).

  **Word Count:** Your response must be between 1,200 and 1,500 words. Answers outside this range will be penalized.

  ***

  ### 2. Model Answer

  **The Necessity of the Storehouse: Why Adjudication Collapses into Extraction**

  To resolve the tension between extractive and adjudicative strategies in the Containment Facility scenario, one must first settle the ontological status of the Predictor's knowledge. I argue that the project of eliciting latent knowledge (ELK) is incoherent without adopting the **Storehouse Conception**. Consequently, Adjudicative strategies cannot stand as a genuine alternative to Extraction; they are merely indirect, heuristic forms of Extraction that rely on the same realist assumptions. If one adopts the Disposition Conception, the very goal of ELK dissolves, leaving only behavioral alignment.

  Assuming the Storehouse Conception, the Predictor encodes a determinate fact about the thermal micro-fractures in its weights, independent of human logs. The Reporter's failure is not a lack of knowledge but a misalignment of output channels. The challenge is to access that storehouse. Proponents of Adjudication suggest we can bypass direct decoding by constructing a game—such as adversarial cross-examination—where the correct report wins based on procedural robustness rather than direct mapping. However, this strategy faces the criterion problem: what determines the winner?

  If the adjudicative criterion relies on future observations (e.g., waiting to see if the vessel leaks), it fails the temporal requirement of ELK. We need to know about the fracture *before* the catastrophe. If the criterion relies on human consensus, it fails the ELK requirement, as humans are blind to the fractures. Therefore, the only viable criterion for adjudication is consistency with the Predictor's internal state. But if the selection rule is "choose the report that best matches the internal state," Adjudication has collapsed into Extraction. It is simply using a competitive process to approximate what a direct probe would achieve. The adjudicative layer adds noise but no new epistemic authority.

  One might object that Adjudication does not require matching the internal state directly, but rather matching the *implications* of the internal state across different modalities. For example, a report is selected if it predicts future sensor data better than competing reports, even if humans don't understand the report itself. This attempts to save Adjudication from collapsing into Extraction by using prediction as the criterion. However, this only works if the Storehouse Conception is true—that there is a specific internal configuration that correlates with reality better than the human simulation. If the Disposition Conception were true, there would be no "better" configuration, only different behavioral responses to different prompts. Thus, even this sophisticated adjudication secretly presupposes the Storehouse.

  Why must we reject the Disposition Conception? If knowledge is merely a disposition relative to elicitation procedures, then there is no fact of the matter about whether the Predictor "knows" about the micro-fractures. There is only how it behaves when asked. In the Containment Facility, this means we cannot say the Reporter is lying or hiding knowledge; it is merely exhibiting a different disposition trained on human logs. But this makes the ELK problem unsolvable by definition. If knowledge is elicitation-relative, we cannot elicit "latent" knowledge, only "alternative" knowledge. To claim we want the *latent* knowledge is to claim there is a privileged representation independent of the human training signal. This is precisely the Storehouse Conception. Therefore, to pursue ELK at all is to commit to the Storehouse.

  Given this commitment, Adjudication is not a solution to the human simulator problem but a workaround for the difficulty of Extraction. Direct extraction (e.g., mechanistic interpretability) is hard because we don't know which neurons encode "thermal fracture." Adjudication tries to find the answer by testing consequences. But because the criterion for success must ultimately tie back to the Predictor's model of reality (the Storehouse) rather than human labels, Adjudication is parasitic on Extraction. It assumes there is a truth in the weights to be found.

  In the Containment Facility, this means we cannot simply train a Reporter to win a debate. We must ensure the debate scores are tied to the Predictor's internal confidence about the thermal data, not human approval. If we do not do this, we are merely selecting the most persuasive human simulator. Thus, Adjudication is not a distinct epistemic strategy. It is Extraction by other means, and it succeeds only insofar as it approximates a direct readout of the Storehouse. To pretend otherwise is to ignore the criterion problem. We must accept that without a commitment to the reality of the internal representation, there is nothing to elicit.

