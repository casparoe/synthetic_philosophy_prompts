  ### 3. Marking Scheme

  **Total Marks: 20**

  1.  **Explicit Ontological Commitment (4 marks)**
      *   *Requirement:* The answer must clearly state in the introduction whether it assumes the Storehouse or Disposition conception.
      *   *Mistake:* Hedging between the two, or failing to state the assumption until the conclusion.

  2.  **Diagnosis of the Criterion Problem (5 marks)**
      *   *Requirement:* The answer must explain why Adjudication needs a selection criterion and why standard criteria (future data, human consensus) fail in the ELK context.
      *   *Mistake:* Asserting Adjudication works without explaining how the winner is selected, or suggesting future verification is viable for *latent* knowledge.

  3.  **Argument Linking Ontology to Strategy (5 marks)**
      *   *Requirement:* The answer must demonstrate how the choice in (a) dictates the viability of (b). (e.g., Disposition makes ELK meaningless; Storehouse makes Adjudication parasitic on Extraction).
      *   *Mistake:* Treating (a) and (b) as independent variables, or arguing for Adjudication while assuming Disposition without addressing the relativity problem.

  4.  **Engagement with the Collapse Objection (4 marks)**
      *   *Requirement:* The answer must address whether Adjudication is truly distinct or just relocated Extraction.
      *   *Mistake:* Ignoring the collapse risk or asserting they are distinct without philosophical justification.

  5.  **Application to Containment Case (2 marks)**
      *   *Requirement:* Specific reference to the thermal micro-fractures and human overseer blindness.
      *   *Mistake:* Speaking only in abstract terms without grounding the argument in the provided scenario.

  ***

  ### 4. Differentiation of Answers

  **A Answers** will explicitly commit to the Storehouse Conception and argue that Adjudication necessarily collapses into Extraction because any valid selection criterion must reference the internal state (the Storehouse) rather than human labels or future data. They will treat the Disposition Conception as incompatible with the goal of ELK itself. **B Answers** will correctly identify the distinctions and apply them to the case but will fail to rigorously defend the link between ontology and strategy, perhaps arguing that Adjudication works without resolving the criterion problem. **C Answers** will survey techniques (debate, interpretability) without taking a philosophical position, or will slide between Storehouse and Disposition conceptions, failing to recognize that the choice determines the viability of the elicitation strategy.
