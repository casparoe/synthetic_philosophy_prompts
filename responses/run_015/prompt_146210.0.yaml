answer: |-
  You have hit on exactly why the philosophy of medicine feels like it's been spinning its wheels since the Wakefield/Boorse debates of the 90s. Your intuition is sharp: the stalemate isn't just between Naturalism and Normativism; there is a fracture *within* Naturalism (Etiological vs. Systemic) that often gets glossed over, and the whole debate might be category-error-driven (ontology vs. pragmatics).

  Here is a breakdown of why the deadlock persists, why your "talking past each other" hypothesis is likely correct, and whether an Etiological/Systemic distinction can actually salvage the project.

  ### 1. The Internal Naturalist Split: Selected Effect vs. Causal Role
  You identified the core tension: Boorse's Biostatistical Theory (BST) relies on **Selected Effect (SE)** functions, while the HPC (Homeostatic Property Cluster) approach leans toward **Causal Role (CR)** or systemic functions.

  *   **Boorse (SE):** A heart is *for* pumping because evolution selected it for that. Dysfunction is a failure to perform the historical task.
      *   *Strength:* Keeps values out. A heart that pumps poorly is dysfunctional regardless of whether we like it.
      *   *Weakness:* The "Evolutionary Mismatch" problem. If we evolve to crave sugar, and sugar kills us now, is that a dysfunction? Boorse says no (the mechanism is working as designed). Clinicians say yes (it's pathology).
  *   **Systemic/HPC (CR):** A heart is part of a homeostatic cluster that maintains life. If the cluster destabilizes, it's dysfunction.
      *   *Strength:* Handles novel environments better. It cares about current survival/integrity, not ancestral history.
      *   *Weakness:* The "Grey Hair" problem. If the homeostatic cluster for pigment production fails, is grey hair a disease? Without an evolutionary "goal," any deviation from homeostasis looks like dysfunction. You need a norm to decide *which* homeostatic failures matter.

  **The Deadlock:** The SE naturalists accuse the Systemic naturalists of smuggling in norms (by choosing which clusters matter). The Systemic naturalists accuse the SE naturalists of being clinically useless (ignoring modern pathologies).

  ### 2. Are We Talking Past Each Other? (Ontology vs. Pragmatics)
  Your suspicion that one side is doing **biological explanation** and the other **clinical justification** is the most promising way out. This aligns with the "Pragmatic Turn" in recent philosophy of medicine (e.g., Alex Broadbent, Lisa Bortolotti, Havi Carel).

  *   **The Naturalist Question:** "What is the biological state of the organism?" (Ontic)
  *   **The Normativist Question:** "Should we intervene on this state?" (Pragmatic/Normative)

  If we treat "Disease" as a single concept trying to do both jobs, it will break.
  *   **Proposal:** Split the concept. Use **Pathology** for the naturalist description (mechanistic failure, statistical deviation) and **Disease** for the normative ascription (a pathology we deem worthy of medical attention).
  *   **Why this breaks the deadlock:** It allows Boorse to be right about *function* (biology) while allowing Normativists to be right about *illness* (social/clinical status). A sociopath might have a "dysfunction" in empathy mechanisms (Naturalist claim), but if we don't view that as a medical condition requiring treatment, it's not a "disease" in the clinical sense (Normativist claim).

  ### 3. The "Reference Class" Trap (The Kingma Critique)
  You mentioned missing a split in the literature. The biggest development post-90s is **Elselijn Kingma's** critique of Boorse (2007, 2014). She argues that Naturalism fails not because of "function," but because of **reference classes**.

  *   To say a function is "statistically typical," you must choose a reference class (e.g., "male humans," "humans over 50," "humans in industrial societies").
  *   **The Problem:** Choosing the reference class is inherently normative. If you classify pregnancy as a "disease" by comparing women to men, you've made a value judgment. If you compare women to women, it's not.
  *   **Implication:** Even if you drop the evolutionary story and go purely Systemic/HPC, you still have to decide *which* systemic baselines count as "healthy." That decision is value-laden. This suggests the Normativists win on the grounds that **values are constitutive of the concept, not just additive.**

  ### 4. Can "Etiological vs. Systemic" Dysfunction Save Us?
  You asked if distinguishing between **Etiological Dysfunction** (history-based) and **Systemic Dysfunction** (current state-based) could resolve the issue.

  **Yes, but only if mapped to different clinical purposes:**

  1.  **Etiological Dysfunction (Classification/Research):**
      *   *Use:* Epidemiology, evolutionary medicine, understanding *why* a vulnerability exists.
      *   *Example:* Lower back pain is an evolutionary mismatch (bipedalism). It is an etiological dysfunction.
      *   *Limit:* Doesn't tell us if *this specific patient* needs treatment now.

  2.  **Systemic Dysfunction (Diagnosis/Treatment):**
      *   *Use:* Clinical intervention, restoring homeostasis.
      *   *Example:* The back muscles are in spasm, inhibiting movement. The system is failing *now*.
      *   *Limit:* Doesn't tell us if this is "natural" aging or "pathological" decay.

  **The Synthesis:**
  The deadlock persists because philosophers try to find a **necessary and sufficient condition** for "Disease." If we instead view "Disease" as a **cluster concept** (Wittgensteinian), where some cases are primarily etiological (genetic disorders), some primarily systemic (trauma), and all require a normative threshold for clinical action, the tension dissolves.

  ### 5. Moving Beyond the 90s Papers
  If you are stuck citing Boorse (1977/1997) and Wakefield (1992), you are missing the last 15 years of nuance. Look into:

  *   **Elselijn Kingma:** On reference classes and the impossibility of value-free naturalism.
  *   **Alex Broadbent:** *Philosophy of Medicine* (2018). He argues for a pragmatic naturalism. Disease is real, but the *concept* is shaped by human interests.
  *   **Jonathan Tsou:** Applies HPC natural kinds to psychiatry. Argues we can have natural kinds without strict evolutionary etiology.
  *   **Peter Schwartz:** Has done work refining BST to handle the "harm" condition better.
  *   **Sander Beckers:** Recent work on actual causation and function that tries to formalize dysfunction without heavy evolutionary baggage.

  ### Summary Verdict
  You are not missing a metaphysical secret; you are witnessing a **categorial clash**.
  1.  **Metaphysically:** The Naturalists are right that there are objective biological failures (mechanistic/systemic).
  2.  **Conceptually:** The Normativists are right that "Disease" is a status we *grant* to those failures based on values (harm, suffering, social cost).
  3.  **The Way Out:** Stop trying to define "Disease" as a natural kind. Define **Pathology** naturalistically (systemic/etiological failure) and **Disease** pragmatically (pathology + normative reason to intervene).

  The "Etiological vs. Systemic" distinction is useful, but it won't kill the Normativist objection unless you admit that **selecting which systemic failures count as pathologies is itself a normative act.** Once you admit that, the "Value-Free" dream of Naturalism dies, but a robust "Value-Transparent" Naturalism can survive.
