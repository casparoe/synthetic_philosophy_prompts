      *   **Conventions:** Hume's famous example of the rowers (Treatise of Human Nature) is about coordination without promise. It arises from *experience* and *iterated interaction*. "This is the first time" is a problem for Humean convention.
      *   **Reason vs. Passion:** Hume is a skeptic about pure reason guiding action. "Reason is, and ought only to be the slave of the passions." Action is driven by desire (passion) and belief (based on experience/custom).
      *   **Human Nature:** Hume has a fairly realistic/pessimistic view of human selfishness and limited generosity. He expects people to prefer immediate gain over distant/uncertain collective good unless constrained by structure.
      *   **Induction/Custom:** We expect the future to resemble the past. Without past experience of this specific coordination, custom cannot guide us.
