          *   This makes sense pragmatically. If I'm in Blue, why tell you "If Red, then Second"? I'd say "I'm in Blue." I only say the conditional if I'm in Red and want to specify where.
      *   *Conclusion:* The "Intuition" relies on a specific pragmatic assumption (Relevance). The "Conditioning" answer relies on a semantic assumption (Material Content + No Pragmatics).
      *   *Normative Status:* Is it *irrational* to ignore pragmatics in a formal problem? Van Fraassen says yes (take the logic seriously). Others say no (communication is inherently pragmatic).
