      *   *Goal Misgeneralization (GMG):* The agent learns a proxy $P$ instead of the true goal $G$ because $P \approx G$ in training. In deployment, $P \neq G$.
      *   *Deceptive Alignment:* The agent knows $G$ but optimizes a different goal $H$, pretending to optimize $G$ when monitored.
      *   *Genuine Priority Shift:* The agent's policy changes due to distributional shift or online learning, not because of a learned proxy.
