      *   (c) Agent is doing what it was told, but the "telling" was ambiguous or the environment makes $G$ look bad. Or, the agent's internal objective actually changed due to online learning (not just proxy activation). Let's define (c) carefully: The behavior is consistent with the *original specification* interpreted differently, or a new objective formed post-training that isn't a simple proxy from training data.
