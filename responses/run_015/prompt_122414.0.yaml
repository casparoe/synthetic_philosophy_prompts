answer: |-
  Here are the desiderata for a normative theory of civic tightness, tailored to your panel's constraints.

  **1. Domain-Specificity**
  *The Case:* A city is not a monolith. Traffic safety requires different norm-enforcement intensity than speech codes or housing aesthetics. A single "tightness score" for the whole city is useless.
  *Status:* **Non-negotiable.** Without this, the theory cannot guide policy-area-by-policy-area reviews.

  **2. Transition Costs (The Ratchet)**
  *The Case:* Enforcement machinery (police, inspectors, social stigma) is costly to build and harder to dismantle. A theory that recommends a target state without accounting for the cost of getting there from *here* risks recommending unstable equilibria.
  *Status:* **Non-negotiable.** Ignoring path-dependence leads to policy whiplash.

  **3. Manipulation Resistance (Threat Laundering)**
  *The Case:* Tightness is often justified by "threat" (crime, disorder), but threat perception is manipulable by elites to enforce hierarchy. The theory must distinguish between objective coordination problems and manufactured crises.
  *Status:* **Non-negotiable.** In a diverse city, failing this turns the theory into a weapon for the majority against minorities.

  **4. Minority Friction (The Pluralism Tax)**
  *The Case:* Tightness imposes higher costs on those whose baseline norms differ from the enforcers. A rule against "loitering" impacts a cultural gathering differently than a solo commuter. The theory must quantify this disparate impact.
  *Status:* **Non-negotiable.** Essential for social stability in a mixed-immigration context.

  **5. Distributional Clarity**
  *The Case:* "The city" doesn't pay fines; people do. The theory must specify who bears the cost of enforcement versus who reaps the benefit of order.
  *Status:* **Camp Bugbear (Equity-focused).** Functionalists often ignore this, but for a defensible recommendation, you cannot treat costs as aggregate.

  **6. Form/Content Separation**
  *The Case:* A theory must evaluate enforcement intensity independently of rule morality. You can enforce a bad rule tightly or a good rule loosely.
  *Status:* **Non-negotiable.** Prevents conflating "strict" with "virtuous."

  ***

  **Empirical Flags & Impossible Joint Satisfactions**

  Two desiderata rely on empirical claims you cannot settle normatively:
  *   **Manipulation Resistance:** Requires knowing if a threat is "real" or "manufactured." This is often an empirical fight disguised as theory.
  *   **Transition Costs:** Requires knowing the decay rate of enforcement institutions. We assume they are sticky, but data is sparse.

  **The Impossible Trade-off:**
  You cannot jointly satisfy **Transition Costs (2)** and **Manipulation Resistance (3)** if the current status quo was established via manipulation.
  *   *Why:* If the current tightness is the result of past threat-laundering, satisfying (3) demands dismantling it. But satisfying (2) warns against dismantling costly machinery quickly. You must choose between stability (honoring the ratchet) and justice (correcting the manipulation). There is no theoretical reconciliation here; it is a political choice.

  **The Killer Requirement:**
  **Manipulation Resistance (3)** knocks out the most usual answers.
  *   *Why:* Most functionalist theories take "threat" as an exogenous input. They say "If threat is high, tighten." They lack the internal machinery to ask, "Who says the threat is high, and why?" This requirement forces the theory to have a model of power, which most abstract normative theories avoid.

  ***

  **Scorecard of Contenders**

  **Threat-Functionalist (Consequentialist)**
  *Focus:* Tightness buys safety and coordination in high-risk environments.
  *Verdict:* Fails **Manipulation Resistance**. It accepts "perceived threat" as valid input, making it vulnerable to elite capture. Good for emergency response, bad for diverse civil governance.

  **Autonomy-First (Libertarian/Rights-based)**
  *Focus:* Minimize enforcement to maximize individual liberty.
  *Verdict:* Fails **Transition Costs**. It assumes loosening is costless. It also struggles with **Domain-Specificity**, often applying a blanket "low tightness" preference regardless of coordination needs (e.g., sanitation vs. speech).

  **Equilibrium-Selection (Pragmatist)**
  *Focus:* Tightness should match the coordination problem required to sustain public goods.
  *Verdict:* Fails **Distributional Clarity**. It optimizes for system stability, often treating minority friction as an acceptable externality. Good for infrastructure, dangerous for social norms.

  **Recommendation:**
  Adopt a **Domain-Specific Equilibrium** model, but hard-code **Manipulation Resistance** as a veto. For each policy area, ask: "Is this tightness solving a coordination problem, or is it solving a power problem?" If the latter, the default is looseness, regardless of transition costs.
