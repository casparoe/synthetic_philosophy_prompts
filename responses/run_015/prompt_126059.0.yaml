  Hi! I write novels — two so far, the second about a failing garden centre that did ok in a small way — and I'm about a third of the way into a new one that's set almost entirely inside the HR department of a mid-sized cold-storage logistics firm outside Peterborough. The premise, such as it is: the new Head of People is a completely unironic moral philosopher of the sort who holds that an action has moral worth only if it's done *from* duty rather than merely *in accordance* with duty, and she has quietly rebuilt the entire performance-management system around that one idea. I need a document to drop into chapter four, and I'd like you to write it for me.

  What I want is her annual appraisal form (around 650 words) for a warehouse supervisor called Delia Okafor. Delia has had, by any ordinary standard, a blameless and rather good year: she went back into a smoke-filled loading bay at the depot to drag out a colleague she happens to be friends with, and she spent about four months quietly covering the shifts of another colleague who was having chemo, without telling anyone. The Head of People is unimpressed, and the comedy has to come from the philosophy being right rather than from her being a monster. So: the point that the worth of an action can't lie in what it produces; the point that if Delia did it because she likes the man, or because it made her feel warm afterwards, then the act merely coincided with duty; the point that neither Delia nor anyone else can ever get far enough behind their own motivations by introspection to be sure which it was. There's one wrinkle I specifically want, and it should be the cruellest part of the document: Delia has read the new staff handbook, and in the second half of the year she started doing the right thing deliberately *because* the handbook identifies it as her duty — and she gets marked down for that too, on the grounds that acting from a self-conscious standing desire to do whatever is right "because it's right" is a kind of fetish, a third-personal motivation that isn't the real thing at all. I want the double bind to land: too warm and it doesn't count, too deliberate and it doesn't count either, and there is nothing left that she can aim at.

