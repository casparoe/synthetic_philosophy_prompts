answer: |-
  You have hit on the exact friction point that has kept the Dirty Hands (DH) literature spinning in circles since Michael Walzer's seminal 1973 essay. Your frustration is warranted because the debate *is* stuck, but not for the reasons usually stated.

  Here is the diagnosis of why the debate is stalled, what each side is actually fighting for, and how your "outsourcing" edge case exposes the structural flaw in the framework.

  ### 1. The Diagnosis: Verbal, Substantive, or Separate Questions?

  It is **primarily a verbal dispute rooted in a substantive clash of moral frameworks.**

  *   **The Verbal Dispute:** Both sides are using the word "wrong" to refer to different ontological categories.
      *   **Side A (The Tragic Realists/Walzerians):** "Wrong" means **violation of an agent-relative constraint.** (e.g., "Thou shalt not kill" is a barrier that exists regardless of consequences). To them, the act remains objectively immoral even if it was necessary.
      *   **Side B (The Consequentialists/Revisionists):** "Wrong" means **sub-optimal outcome.** If the act saved the city, it was the *right* act overall. To call it "wrong" is a category error.
  *   **The Substantive Clash:** This is a conflict between **Common Morality** (what applies to humans) vs. **Role Morality** (what applies to leaders).
      *   Side A believes leaders are humans first; therefore, they violate human morality when they act politically.
      *   Side B believes the political role creates a distinct moral universe where the "right" action is defined by fiduciary duty to the populace, not personal virtue.

  **Are they answering separate questions?** Yes.
  *   Side A is answering: *"What is the metaphysical status of this act in the universe of moral truth?"*
  *   Side B is answering: *"What is the practical evaluation of this agent's decision-making process?"*

  They talk past each other because Side A is doing **moral ontology** (what *is* guilt?), while Side B is doing **action guidance** (what should we *do*?).

  ### 2. What Counts as "Winning" for Each Side?

  They think they have won when they successfully dissolve the tension that the other side thinks is essential.

  *   **Side A (The Stain is Real) claims victory if:** They preserve the intuition that **some things should never be done, even to save the world.** If they can convince you that the leader is *guilty* (deserving of punishment or penance) despite doing the *necessary* thing, they have proven that politics cannot fully swallow morality. Their win condition is **Tragedy.**
  *   **Side B (The Stain is Illusory) claims victory if:** They show that "Dirty Hands" is just **moral residue** or **agent-regret.** If they can convince you that the leader did the *best possible thing* and therefore shouldn't be labeled a sinner, they have protected the rationality of moral decision-making. Their win condition is **Coherence.**

  **Why they stay stuck:** Side A thinks Side B is dangerous (it allows leaders to rationalize atrocities). Side B thinks Side A is incoherent (it demands leaders be saints in a world that requires butchers).

  ### 3. What Would Count as Progress?

  Empirical studies on leader guilt won't help; knowing that leaders *feel* bad doesn't tell us if they *are* bad. Progress requires shifting the debate from **metaphysics to institutional design.**

  The debate is stuck because it focuses on the *individual soul* of the leader. Progress would come from distinguishing **Justification** from **Amnesty.**

  *   **The New Distinction:** We need to separate the *public justification* of the act (it was necessary for security) from the *private liability* of the agent (they violated a norm).
  *   **Progress looks like:** A framework where a leader can be **publicly vindicated** (kept in office, praised for saving lives) but **privately liable** (subject to a truth commission, required to resign after the crisis, or symbolically punished).
  *   **Why this helps:** It satisfies Side A (the norm was violated and acknowledged) and Side B (the outcome was secured and the leader wasn't removed during the crisis).

  The stalemate persists because we demand a single label ("Right" or "Wrong") for an action that occupies two moral dimensions simultaneously.

  ### 4. The Edge Case: Moral Outsourcing

  Your edge case (the Mayor who structures the decision so a subordinate pulls the trigger) is the **reductio ad absurdum** that breaks the Dirty Hands framework.

  **Is it Dirty Hands?**
  **No.** It is **Corruption** or **Cowardice.**

  **Why this reveals what is broken:**
  The Dirty Hands theory relies on a specific phenomenological requirement: **The leader must own the sin.**

  *   **The Walzerian Requirement:** For DH to be legitimate, the leader must acknowledge the violation of the moral norm. The "dirt" is the price of doing the necessary business. It is a sacrifice of the leader's *own* moral integrity for the public good.
  *   **The Outsourcing Failure:** By outsourcing the trigger, the Mayor is attempting to secure the **benefit** of the dirty act (the city is saved) without paying the **cost** of the dirty hands (the moral stain on the Mayor).

  **How the two sides analyze this:**
  *   **Side A (Realists):** The Mayor is *more* guilty. They have committed the original sin (letting the innocent die/be tortured) plus the sin of deception and cowardice. They tried to evade the tragedy.
  *   **Side B (Consequentialists):** The Mayor is still responsible for the outcome, but the framework collapses because the "necessity" defense usually requires direct agency. If the subordinate had a choice, the Mayor is just manipulating a moral agent.

  **The Verdict on the Edge Case:**
  This case proves that Dirty Hands is not just about **consequences**; it is about **sacrifice.**
  If the framework allows outsourcing, it becomes a license for tyranny (leaders get the power to sin without the stigma). Therefore, a necessary condition of Dirty Hands is **acknowledgment.**

  If the Mayor does not get their hands dirty, they have not entered the DH paradigm; they have merely abused their power. This suggests the debate isn't about whether the act was "wrong," but about **who bears the burden of the violation.**

  ### Summary Diagnosis

  The debate is stuck because it tries to solve a **political problem** (how to wield power in a non-ideal world) using **individual moral categories** (guilt, sin, right, wrong).

  *   **Is it verbal?** Yes, regarding the definition of "wrong."
  *   **Is it substantive?** Yes, regarding whether leaders should be punished for necessary acts.
  *   **The Fix:** Stop asking "Was it wrong?" and start asking "How do we institutionalize the cost of necessary violations?"
  *   **The Edge Case:** It confirms that Dirty Hands requires the leader to absorb the moral damage. If they dodge the damage, they lose the justification.

  The "dirt" isn't a description of the act; it's a receipt for the cost of leadership. If you fake the receipt (outsourcing), you're not a tragic hero; you're a bureaucrat gaming the system.
