  2.  **Understand Strawson's Framework (in this context):**

      *   **Participant Stance:** Treating someone as a moral agent capable of understanding and responding to reactive attitudes (blame, gratitude, resentment, remorse). Implies accountability.
      *   **Objective Stance:** Treating someone as an object to be managed, treated, or controlled. Implies no moral accountability (e.g., children, severe mental illness, extreme coercion).
      *   **Excuses:** Acknowledges the action was bad, but the agent wasn't fully responsible *in this instance* (accident, ignorance, duress). Keeps them in the participant stance but mitigates blame.
      *   **Exemptions:** The agent is not a suitable candidate for reactive attitudes *at all* (or generally). Shifts to objective stance.

