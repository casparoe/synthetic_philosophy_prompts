answer: |-
  # The Strawsonian Triage Protocol (STP)
  **Version 1.0 | Incident Review Committee**

  **Purpose:** To determine the appropriate moral stance (Participant or Objective) toward clinicians involved in adverse events, ensuring that institutional responses (discipline, support, removal) align with the moral responsibility of the agent.
  **Time:** 60 Minutes.
  **Quorum:** 3 Clinicians, 1 Lay Member.
  **Inputs:** Incident file, transcript of single clinician interview.

  ---

  ## Part I: The Procedure

  ### Step 1: The Exemption Filter (Capacity)
  *Goal: Determine if the agent is a suitable candidate for reactive attitudes.*
  **Question:** At the time of the event, was the clinician capable of understanding moral reasons and controlling their actions in the standard way?
  **Consider:** Florid psychosis, advanced dementia, severe intellectual disability, or coercion so extreme it negates agency (e.g., threat of physical violence).
  *   **If YES (Incapacitated):** **STOP.** Classify as **Exemption**.
      *   **Stance:** Objective.
      *   **Action:** Medical management, removal, or reassignment. No censure, no demand for remorse.
      *   **Handoff:** Pass to Medical Staff Office for fitness-to-practice evaluation. The Committee records "Moral Residue" (see Step 6) but cannot assign blame.
  *   **If NO (Capacitated):** Proceed to Step 2.

  ### Step 2: The Agency Filter (Causation & Algorithms)
  *Goal: Determine if the human agent was the primary cause.*
  **Question:** Did the clinician's action (or inaction) causally contribute to the harm, or was the outcome driven by a mechanical/algorithmic failure independent of human oversight?
  **Consider:** If an algorithm recommended a fatal dose, could a reasonable clinician have detected the error? If the system is a "black box" (unknowable), the human is a conduit, not an agent.
  *   **If NO (System/Algo Primary):** **STOP.** Classify as **Systemic Exemption**.
      *   **Stance:** Objective (treat clinician as part of the system to be fixed).
      *   **Action:** System redesign. No individual discipline.
  *   **If YES (Human Agency Present):** Proceed to Step 3.

  ### Step 3: The Excuse Filter (Knowledge & Control)
  *Goal: Determine if the participant stance should be modified.*
  **Question:** Did the clinician act in ignorance, under duress, or by accident, despite having general capacity?
  **Consider:** Fatigue, misleading data, emergency pressure, lack of training on a specific new device.
  *   **If YES (Excuse Valid):** Classify as **Mitigated Participant**.
      *   **Stance:** Participant (but resentment is suspended).
      *   **Action:** Retraining, support, or process change. No formal censure. Demand for account is limited to "help us understand how the system failed you."
  *   **If NO (No Valid Excuse):** Proceed to Step 4.

  ### Step 4: The Intentionality Filter (Choice)
  *Goal: Determine the degree of blame.*
  **Question:** Did the clinician knowingly deviate from safety norms or guidelines without emergency justification?
  *   **If YES:** Classify as **Full Participant**.
      *   **Stance:** Participant (full reactive attitudes appropriate).
      *   **Action:** Censure, privilege restriction, or demand for demonstrated remorse.
  *   **If NO (Ambiguous):** Proceed to Step 5.

  ### Step 5: Apportionment (Partial Participation)
  *Goal: Handle distributed blame.*
  **Question:** If multiple agents contributed, can we isolate the specific failure of *this* clinician?
  *   **Instruction:** Assign percentage of causal responsibility. Apply Steps 1–4 to that percentage. If the clinician's share is <20% and non-decisive, default to **Mitigated Participant**.

  ### Step 6: The Transparency Clause (Moral Residue)
  *Goal: Acknowledge the gap between finding and feeling.*
  **Instruction:** Before voting, each member must state: "My finding is [X], but I feel [Y]."
  *   **Constraint:** If the Protocol dictates an **Objective Stance** (Exemption) but the Committee feels **Resentment** (due to harm severity), the finding remains Objective. However, the "Moral Residue" must be recorded in a sealed addendum to the personnel file, accessible only to the Ethics Committee. This acknowledges the victim's need for blame without violating the agent's exemption.
  *   **Handoff:** If the Committee feels the Protocol forces an unjust outcome (e.g., exempting a dangerous but ill clinician), the decision is handed to the **Chief Medical Officer (CMO)**. The CMO decides on removal based on *risk*, not *blame*. This separates safety management from moral judgment.

  ---

  ## Part II: Case Applications

  ### Case 1: The Resident (Fatigue & Error)
  **Facts:** Resident on 4th consecutive 24-hour shift (allowed but discouraged). Misprogrammed pump. Patient death.
  **STP Run:**
  1.  **Exemption:** No. Resident is sane and adult.
  2.  **Agency:** Yes. Finger pressed the button.
  3.  **Excuse:** **Yes.** Extreme fatigue constitutes duress/impairment of control, though not total incapacity.
  4.  **Finding:** **Mitigated Participant.**
  **Outcome:** No censure. Mandatory rest protocol enforcement. Retraining on pumps.
  **Committee Sentiment:** Acceptable. The Committee agrees the system failed the resident. The "demand for account" is directed at the scheduling department, not the resident.

  ### Case 2: The Attending (Guideline Deviation)
  **Facts:** Attending knowingly ignored sepsis bundle guideline based on 20 years of experience. Patient died of sepsis.
  **STP Run:**
  1.  **Exemption:** No.
  2.  **Agency:** Yes. Chose not to order labs.
  3.  **Excuse:** **No.** Ignorance is not claimed; she knew the rule. Duress? No.
  4.  **Intentionality:** **Yes.** Knowing deviation.
  5.  **Finding:** **Full Participant.**
  **Outcome:** Formal censure. Demand for written account explaining why her judgment superseded the standard.
  **Committee Sentiment:** **Mixed/Uncomfortable.** The clinicians on the committee respect her autonomy and suspect the guideline was flawed. They feel resentment toward the *protocol*, not the doctor. However, the STP forces them to record a "Participant Stance" finding. They must censure her to maintain the normative force of safety guidelines, even if they privately admire her independence. The "Moral Residue" note captures their hesitation.

  ### Case 3: The Surgeon (Cognitive Decline)
  **Facts:** Surgeon made technical errors leading to complication. Colleagues knew he was "slipping" (early dementia) but covered for him to protect his reputation.
  **STP Run:**
  1.  **Exemption:** **Yes.** Evidence suggests early cognitive decline affected technical capacity. He is not a fully suitable candidate for reactive attitudes regarding technical skill.
  2.  **Agency:** Yes, but compromised.
  3.  **Excuse:** N/A (Exemption overrides).
  4.  **Finding:** **Exemption (Objective Stance).**
  **Outcome:** **No Blame.** The Surgeon is to be treated as a patient/asset to be managed. Immediate revocation of privileges for safety, but *no* disciplinary mark for the error itself. No demand for remorse regarding the error.
  **The Handoff:** The Committee feels intense resentment. Not just at the error, but at the *cover-up*. However, the STP classifies the *clinical error* as exempt. The "Moral Residue" is high. The decision is handed to the **CMO**.
  **Why the Committee Dislikes This:** The Committee wants to blame the Surgeon for endangering lives. They want the *Participant Stance* (shame, censure) to validate the harm done. The STP forbids this. It forces them to treat him as a broken tool rather than a bad agent. It denies them the satisfaction of moral condemnation, replacing it with clinical management. The colleagues who covered for him are reviewed separately (Full Participant for the cover-up), but the Surgeon himself escapes blame for the harm he caused. This feels like a failure of justice to the Committee, but the Protocol holds that you cannot blame a man for being sick.

  ---

  ## Part III: Limitations (What This Procedure Cannot Do)

  1.  **It Cannot Restore Trust:** The STP can determine whether blame is *appropriate*, but it cannot repair the relationship between the clinician and the community. A "Mitigated Participant" finding may still result in a loss of trust from patients that logic cannot restore.
  2.  **It Cannot Punish the System:** While the STP can identify systemic coercion (Case 1), it has no jurisdiction to censure the Hospital Administration. It can only recommend. The "blame" often stops at the clinician because they are the only ones in the room.
  3.  **It Cannot Resolve Moral Residue:** The "Transparency Clause" records the committee's discomfort, but it does not resolve it. Members may leave the room feeling that justice was not done (Case 3), knowing they were bound by a philosophical framework that prioritizes metaphysical accuracy over emotional closure.
  4.  **It Cannot Predict Future Risk:** The STP judges *past* moral responsibility. It is not a risk assessment tool. A clinician may be fully exempt from blame (e.g., a first-time seizure) but still pose an unacceptable risk. That decision belongs to the CMO, not this Committee.
  5.  **It Cannot Judge the Algorithm:** When an algorithm causes harm, the STP shifts the stance to Objective regarding the human. But it has no mechanism to assign moral responsibility to the *developers* of the algorithm. The blame vanishes into the "black box," leaving no moral agent to hold accountable.
