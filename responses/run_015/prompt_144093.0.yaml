prompt: |-
  I write historical novels set in periods and among events whose shape most of my readers already know. The manuscript I am currently outlining concerns a real and well-documented mercantile expedition that failed, and anyone who opens the book will know within thirty pages that it failed. A review of my last novel complained, fairly I thought, that the book moved as though the catastrophe had been fated: every chapter laid another brick on a road that led to only one place, and the characters' decisions read as stage directions rather than as gambles. I do not think the remedy is to stop telling stories with known endings. I am not going to give up dramatic irony, and my readers do not want me to; the pleasure of the form is precisely that we watch people walk toward an outcome we can already see. What I want is to keep the outcome known while making the route to it feel like one that could have gone otherwise, and to do that without falsifying the record or manufacturing uncertainty nobody had.

  The difficulty is that I cannot see, from inside my own drafting, when I am doing the thing I am trying to avoid. I know how it ends; so does my reader; and the archive I work from is not neutral, since documents survive in part because they later mattered, and the people who wrote them were frequently explaining themselves after the fact. I have begun separating out three or four failure modes, and I would like a procedure that handles them, though I would rather you sharpen or replace my distinctions than simply adopt them. First, my own foreknowledge leaking into causation: treating something as a cause mainly because, given the outcome, it looks like one. Second, retrofitted motive: giving a character a reason that fits what they later did, and then experiencing that reason as though it explained the action rather than being inferred from it. Third, archival selection: promoting whatever survived in the record, and above all whatever was uncovered, litigated, or confessed afterwards, into the engine of the plot, when its prominence in the file may be an effect of the disaster rather than a cause of it. Fourth, a problem that belongs to the reader rather than to me: an explanation can be scrupulously fair and still land as inevitable, because the person reading it knows the ending and supplies the rest. A related worry is that when I try to restore contingency by dramatizing alternatives, I may be inventing options that were never in the air: logically available, but not ones anyone at the time proposed, feared, or could have acted on. I have been calling these dead alternatives, as opposed to live ones, and I want the procedure to draw that line and to say what would count as evidence that an alternative was live.

  So please turn what is actually known about hindsight bias and the narrative fallacy into a procedure I can run on a plotline before I draft it: the questions in order, what counts as a sufficient answer to each, where the answer is a stop or a rewrite, and where the question comes back to me because it is a judgment about the novel rather than a fact about the past. The constraints are these. I have roughly an afternoon per plotline. I work with a research assistant who reads the period hands and knows nothing of the theory, and a fact-checker who must sign off on anything the book asserts about the world; so most steps have to be executable by the assistant, and the procedure should say which steps cannot be delegated. It must not ask me to withhold the outcome or to feign ignorance I do not have, and it has to leave room for the reader's foreknowledge as a fixed condition rather than a defect to be engineered away. Then run it on three subplots from the current outline: a purser's embezzlement, recorded in the sources because it was discovered during the post-mortem into the failure, which I have been using as the main causal hinge and as my villain; a lieutenant's change of allegiance, for which the surviving letters give no reason at all and to which I have supplied a childhood grievance; and the loss of the expedition's fortified trading post, which on the military facts looks genuinely overdetermined, since the garrison was too small, the relief was not coming, and the siege works were competently built. At least one of the three should return a verdict I will not like, and I would rather have it from you than from my editor. I should also say that I have been toying with a device for restoring contingency from the reader's side: a scene dramatizing an outcome that did not occur, staged as a rumour running through the camp, a letter that argues for the other course, or a chapter from the perspective of someone who expected things to go differently. Tell me whether your procedure licenses that device, on what conditions, and where it degenerates into manufacturing a contingency the period did not contain. Finally, be plain about what the procedure cannot do: I would rather know now which of these questions it can only re-describe.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** A historical novelist writing about known failures (dramatic irony is desired, fatalism is not).
      *   **Problem:** Hindsight bias/narrative fallacy makes the plot feel fated/inevitable. Characters feel like puppets, decisions feel like stage directions.
      *   **Goal:** A procedure to test plotlines *before* drafting to ensure contingency feels real without falsifying history or inventing "dead alternatives."
      *   **Constraints:**
          *   Roughly an afternoon per plotline (efficient).
          *   Executable by a Research Assistant (RA) who reads period hands but doesn't know theory.
          *   Fact-checker must sign off (no falsifying records).
          *   Cannot ask the author to feign ignorance of the ending.
          *   Must accept reader foreknowledge as a fixed condition.
          *   Must evaluate three specific subplots (Purser, Lieutenant, Trading Post).
          *   Must evaluate a specific narrative device (counterfactual scenes/rumors).
          *   Must be plain about limitations (what it can't fix).
          *   At least one subplot should return an unfavorable verdict.
      *   **User's Identified Failure Modes:**
          1.  Foreknowledge leaking into causation.
          2.  Retrofitted motive.
          3.  Archival selection bias (post-mortem prominence $\neq$ causal prominence).
          4.  Reader inevitability (even fair explanations feel fated).
          5.  "Dead Alternatives" (logically possible but historically unavailable/unthought).

  2.  **Deconstruct the Theory (Hindsight Bias & Narrative Fallacy):**

      *   *Hindsight Bias:* "I knew it all along." Tendency to see events as more predictable than they were.
      *   *Narrative Fallacy:* Constructing a coherent story out of disparate facts, imposing causality where there might only be correlation or chaos.
      *   *Solution Strategy:* Shift focus from *why it happened* (teleological) to *what it felt like to decide* (phenomenological/procedural). Focus on "Live Options" (Gallie/Williams concept adapted).

  3.  **Develop the Procedure (The "Contingency Audit"):**

      *   *Structure:* Needs to be step-by-step, assignable, with clear Stop/Go criteria.
      *   *Step 1: Archival Provenance (Addressing Failure Mode 3).* RA checks *when* and *why* a document exists. Is it a post-mortem justification?
      *   *Step 2: The Decision Point (Addressing Failure Mode 1 & 5).* Identify the moment of choice. What were the *contemporary* options?
      *   *Step 3: Motive Verification (Addressing Failure Mode 2).* Is the motive contemporary or inferred?
      *   *Step 4: The "Live Alternative" Test (Addressing Failure Mode 5).* Was the alternative actually discussed/feared/possible *then*?
      *   *Step 5: The Reader's Burden (Addressing Failure Mode 4).* Author judgment on tone/framing.

      *   *Refining the User's Distinctions:*
          *   "Foreknowledge leaking" $\rightarrow$ *Teleological Causation Check.*
          *   "Retrofitted motive" $\rightarrow$ *Contemporary Evidence Check.*
          *   "Archival selection" $\rightarrow$ *Document Provenance Check.*
          *   "Dead vs. Live Alternatives" $\rightarrow$ *Horizon of Expectation Check.*

  4.  **Drafting the Procedure Steps (Iterative refinement for RA usability):**

      *   *Step 1 (RA): Document Provenance.* Tag every source used for the plot point. Date it relative to the disaster. Flag anything written *after* the failure that explains the failure.
      *   *Step 2 (RA): Option Mapping.* List all actions available at the key decision moment based *only* on documents dated *before* the decision.
      *   *Step 3 (RA): Motive Sourcing.* For every character motivation, cite a pre-decision source (letter, order, diary) or flag as "Author Inference."
      *   *Step 4 (Author): The Live Alternative.* Review RA's "Option Mapping." Did anyone *at the time* consider the path not taken? If not, is it a "Dead Alternative"?
      *   *Step 5 (Author): The Inevitability Check.* Does the chain of causality rely on the post-mortem documents flagged in Step 1?

  5.  **Applying the Procedure to the Three Subplots:**

      *   *Subplot 1: Purser's Embezzlement.*
          *   *Source:* Post-mortem discovery.
          *   *Risk:* High. Using a discovered crime as the *cause* of failure is classic hindsight bias. Maybe the failure caused the scrutiny that found the crime.
          *   *Verdict:* **FAIL/REWRITE.** It treats a symptom (or a coincident event) as the cause because the record highlights it.
      *   *Subplot 2: Lieutenant's Defection.*
          *   *Source:* No reason in letters. Author supplied "childhood grievance."
          *   *Risk:* Retrofitted motive.
          *   *Verdict:* **CAUTION/REWRITE.** Unless there's evidence of the grievance *before* the defection, it's psychological fiction masquerading as historical causality. Needs to be framed as opacity, not explanation.
      *   *Subplot 3: Trading Post Loss.*
          *   *Source:* Military facts (overdetermined).
          *   *Risk:* Low on bias, high on fatalism.
          *   *Verdict:* **PASS (with conditions).** If the military reality was truly hopeless, the tension isn't "will they win?" but "how do they face the end?" This accepts inevitability but avoids false contingency.

      *   *Selection:* The Purser subplot is the strongest candidate for the "verdict you will not like." It's a classic "villain created by the inquiry" trope.

  6.  **Evaluating the Narrative Device (Counterfactuals/Rumors):**

      *   *Condition:* Is the rumor/letter historically attested?
      *   *License:* Yes, if the rumor *actually existed* in the camp (documented in diaries/letters).
      *   *Degeneration:* If the author invents a rumor that no one at the time actually whispered, it becomes a "Dead Alternative" and breaks the contract.
      *   *Verdict:* License granted *only* if the contingency was *contemporary*.

  7.  **Addressing Limitations:**

      *   The procedure cannot fix "Reader's Burden" (Mode 4). That's a stylistic/tonal issue, not a factual one.
      *   It cannot generate new history.
      *   It cannot make a truly inevitable event feel contingent without lying.

  8.  **Refining the Tone:**

      *   Needs to be professional, direct, slightly academic but practical.
      *   Respect the user's intelligence (they know the theory).
      *   Adhere to the "afternoon" constraint (keep steps tight).
      *   Ensure the RA can do the legwork.

  9.  **Final Review against Constraints:**

      *   *Afternoon per plotline?* Yes, steps are focused.
      *   *RA executable?* Yes, Steps 1-3 are document hunts.
      *   *Fact-checker safe?* Yes, relies on sourcing.
      *   *No feigned ignorance?* Author makes final judgment on "Live" status.
      *   *One unfavorable verdict?* Purser subplot marked for rewrite.
      *   *Device evaluation?* Included.
      *   *Limitations?* Included.

  10. **Drafting the Response:** (Self-Correction during drafting: Ensure I don't just say "don't do it" for the Purser, but explain *how* to fix it—e.g., make the embezzlement a parallel tragedy, not the cause.)

      *   *Refining the Procedure Name:* "The Live Option Audit."
      *   *Refining the RA instructions:* Make them binary (Yes/No/Flag).
      *   *Refining the Purser verdict:* Be specific. The archive highlights it *because* of the failure. Making it the *cause* reverses causality.

  11. **Final Polish:** Check against the "plain about limitations" requirement. Ensure the distinction between "Dead" and "Live" alternatives is clear. (A live alternative is one a contemporary actor could have chosen and considered. A dead one is one we see now but they didn't.)

      *(Self-Correction on the Lieutenant)*: The user said they supplied a childhood grievance. The procedure should flag this as "Inferred Motive." If there's no evidence, it's fiction. That's allowed in novels, but it shouldn't be presented as historical *explanation*. The verdict should be about *framing*, not necessarily deletion. But the Purser one is structurally more dangerous to the "fated" feeling. I will stick with the Purser as the hard "No."

      *(Self-Correction on the Device)*: The user asks if the procedure licenses the device. It does, *if* the rumor is attested. If the rumor is invented by the author to show "things could have gone differently," it's a Dead Alternative. I need to make that distinction sharp.

      *(Final check on constraints)*: "At least one of the three should return a verdict I will not like." I will ensure the Purser verdict is blunt.

      *(Limitations)*: Be honest that this doesn't solve the "Reader knows the end" problem. That's the genre.

      Let's assemble.
answer: |-
  Here is a procedure designed to audit your plotlines for hindsight bias and narrative fatalism, followed by an application to your three subplots and an evaluation of your narrative device.

  ### The Procedure: The Live Option Audit

  **Time Cost:** ~3–4 hours per plotline.
  **Personnel:** Research Assistant (RA), Fact-Checker (FC), Author.
  **Goal:** To distinguish between *historical inevitability* (what actually happened) and *narrative fatalism* (the feeling that it had to happen that way).

  #### Step 1: Document Provenance (RA)
  **Task:** For every major plot point in the outline, list the primary source documents that support it. Date each document relative to the **Decision Point** (the moment the character acts) and the **Disaster Point** (the known failure).
  **Output:** A timeline tagging each source as `PRE-DECISION`, `POST-DECISION/PRE-DISASTER`, or `POST-MORTEM`.
  **Stop Condition:** If >50% of the causal evidence for a decision comes from `POST-MORTEM` sources, flag for **Author Review**.
  **Rationale:** This addresses **Archival Selection**. Post-mortem documents (inquiries, confessions, defensive memoirs) are designed to explain the disaster, not to reflect the uncertainty of the moment. Relying on them reverses causality.

  #### Step 2: Motive Sourcing (RA)
  **Task:** For every character motivation driving a plot point, cite the evidence.
  **Output:** Tag each motive as `ATTENDED` (diary, letter, or witness statement from the time), `INFERRED` (logical deduction by historian/biographer), or `AUTHOR` (invented by you).
  **Stop Condition:** If a major causal turn relies on an `AUTHOR` motive presented as historical fact, flag for **Author Review**.
  **Rationale:** This addresses **Retrofitted Motive**. It forces you to admit when you are supplying the psychology because the record is silent.

  #### Step 3: The Horizon of Expectation (RA)
  **Task:** Identify the specific alternative action the character *did not* take (the path not taken). Search the `PRE-DECISION` documents for any mention of this alternative by *anyone* involved (the character, their superiors, their peers, or their enemies).
  **Output:** Tag the alternative as `LIVE` (discussed, feared, or planned by contemporaries) or `DEAD` (logically possible to us, but unthought by them).
  **Stop Condition:** If you plan to dramatize a `DEAD` alternative as a genuine temptation for the character, flag for **Author Review**.
  **Rationale:** This addresses **Dead Alternatives**. Contingency exists only if the characters perceived a fork in the road. If they saw a straight line, dramatizing a fork is manufacturing uncertainty.

  #### Step 4: The Causality Reversal Check (Author)
  **Task:** Review the flags from Steps 1–3. Ask: *Am I using the outcome to select the cause?*
  **Output:** A binary decision: **KEEP** or **REFRAME**.
  **Criteria for REFRAME:**
  1.  You are treating a `POST-MORTEM` discovery as a `PRE-DECISION` cause.
  2.  You are presenting an `AUTHOR` motive as the definitive explanation.
  3.  You are dramatizing a `DEAD` alternative as a live temptation.
  **Rationale:** This addresses **Foreknowledge Leaking**. It requires you to admit when the plot structure is an artifact of the disaster, not the engine of it.

  #### Step 5: The Inevitability Tone (Author)
  **Task:** Review the plotline knowing the ending. Does the prose or pacing suggest that the characters *sensed* the doom, or that they were blind to it?
  **Output:** A judgment on **Reader Burden**.
  **Constraint:** You cannot change the ending. You must decide if the tension comes from *uncertainty of outcome* (which is false) or *uncertainty of experience* (which is true).
  **Rationale:** This addresses **Reader Inevitability**. If the event was truly overdetermined (Step 3 returns only one Live Option), you must stop trying to make it feel contingent and start making it feel *tragic*.

  ---

  ### Application to Your Subplots

  I have run the Audit on the three subplots you provided.

  #### 1. The Purser's Embezzlement
  *   **Step 1 (Provenance):** The embezzlement is recorded because it was discovered during the post-mortem inquiry. Source is `POST-MORTEM`.
  *   **Step 2 (Motive):** Motive is greed, but the *timing* of the theft is inferred from the shortage found later.
  *   **Step 3 (Horizon):** Was the embezzlement suspected *during* the expedition? If no one suspected it until the inquiry, it was not a `LIVE` variable affecting decisions at the time.
  *   **Step 4 (Causality):** You are using this as the "main causal hinge."
  *   **Verdict:** **REFRAME (Unfavorable).**
      *   **Reason:** This is the classic "villain created by the inquiry." You are treating a symptom (or a coincident rot) as the cause because the archive highlights it. The inquiry found the embezzlement *because* the expedition failed; if the expedition had succeeded, the purser might have cooked the books successfully and retired wealthy. By making this the hinge, you are letting the post-mortem dictate the pre-mortem plot.
      *   **Fix:** The embezzlement must remain, but it cannot be the *cause* of the failure. It must be a parallel tragedy—a corrosion that weakened the ship but did not sink it. The sink must be structural. If you make the purser the villain who caused the disaster, you are falsifying the causal weight of the document.

  #### 2. The Lieutenant's Change of Allegiance
  *   **Step 1 (Provenance):** Letters exist but give no reason. Source is `PRE-DECISION` (the letters) but silent on motive.
  *   **Step 2 (Motive):** You have supplied a "childhood grievance." Tag: `AUTHOR`.
  *   **Step 3 (Horizon):** Did the lieutenant or his peers mention political dissent or personal grudges beforehand? If no, the specific grievance is `DEAD`.
  *   **Step 4 (Causality):** You are supplying a psychological key to a locked door.
  *   **Verdict:** **KEEP (with Condition).**
      *   **Reason:** Fiction requires motive where history offers silence. However, you cannot present this grievance as the *historical explanation*. It must be framed as the character's internal truth, not the archive's verdict.
      *   **Condition:** You must not allow other characters to "solve" this mystery in the text. The grievance must remain opaque to the other characters, preserving the historical reality that his contemporaries *also* didn't know why he defected. If the crew understands his reason, you have retrofitted clarity onto historical confusion.

  #### 3. The Loss of the Fortified Trading Post
  *   **Step 1 (Provenance):** Military facts, siege works, garrison size. Sources are `PRE-DECISION` (orders, maps) and `POST-MORTEM` (survivor accounts).
  *   **Step 2 (Motive):** Survival. Tag: `ATTENDED`.
  *   **Step 3 (Horizon):** Was relief possible? If records show relief was cancelled *before* the siege began, the alternative (holding out) is `DEAD`.
  *   **Step 4 (Causality):** You note it looks "genuinely overdetermined."
  *   **Verdict:** **KEEP.**
      *   **Reason:** Some things are fated. If the military reality was hopeless, attempting to manufacture a "Live Option" where none existed (e.g., a secret tunnel that *could* have worked) would be a lie.
      *   **Strategy:** Do not fight the fatalism here. Lean into it. The tension is not "Will they win?" but "How will they endure?" This satisfies the reader's foreknowledge without insulting their intelligence. The tragedy is in the endurance, not the surprise.

  ---

  ### Evaluation of the Narrative Device (Counterfactuals/Rumors)

  You proposed dramatizing an outcome that did not occur (rumors, letters arguing for the other course, perspectives of those who expected success).

  **The Procedure's License:**
  The Audit **licenses** this device *only* if Step 3 (Horizon of Expectation) confirms the rumor or expectation was **contemporary**.

  *   **Permitted:** A scene where soldiers gamble on a relief fleet that the commanders know has been cancelled. This restores contingency because *to the soldiers*, the alternative was live. It dramatizes the gap between knowledge and belief.
  *   **Permitted:** A letter from a backer in London expressing confidence, written before news of the failure arrived. This highlights the dramatic irony without falsifying the camp's reality.
  *   **Forbidden:** A chapter from the perspective of a character imagining a successful outcome *if only* they had done X, where X was not an option available to them. This is a "Dead Alternative." It degenerates into manufacturing contingency the period did not contain. It turns the novel into a critique of history rather than an immersion in it.

  **Verdict:** Use the device to show **uncertainty**, not **possibility**. Show us what they *hoped* might happen, not what *could* have happened in a modern analysis.

  ---

  ### Limitations: What This Procedure Cannot Do

  I must be plain about the boundaries of this audit.

  1.  **It Cannot Fix Reader Foreknowledge:** Step 5 acknowledges this. If the reader knows the ship sinks, no amount of "Live Option" auditing will make them feel genuine suspense about the survival of the ship. The procedure cannot solve the "Reader's Burden" (your Failure Mode 4). That is a stylistic challenge of pacing and emotional investment, not a factual one.
  2.  **It Cannot Create Contingency Where None Existed:** If the historical record shows a true lock-in (e.g., the wind died and the ships were becalmed), the procedure will tell you the alternative is `DEAD`. It cannot tell you how to make that interesting; it only stops you from lying about it.
  3.  **It Cannot Validate "Author" Motives:** Step 2 flags invented motives, but it cannot tell you if your invention is *good* fiction. It only ensures you don't pass it off as *history*. The quality of the psychological insight remains your burden.
  4.  **It Is Blind to Tone:** The procedure is binary (Flag/Pass). It cannot detect a tone of resignation that reads as fatalism. You might pass all five steps and still write prose that feels like a coroner's report. That requires a reader, not an audit.

  **Summary Recommendation:**
  Accept the verdict on the Purser. It is the weakest link structurally because it relies on the disaster to reveal the crime, yet you are using the crime to explain the disaster. Demote the embezzlement from *cause* to *complication*. Keep the Lieutenant's motive opaque to his peers. Accept the fatalism of the Fort, but shift the genre of that subplot from thriller to tragedy. Use the rumor device only to map the *contemporary* horizon of hope, not the *modern* horizon of possibility.
