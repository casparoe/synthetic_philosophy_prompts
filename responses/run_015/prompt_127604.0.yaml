answer: |-
  Dear Director,

  Following our recent discussions regarding the committee's workload on object identity, I have drafted a procedural framework designed to resolve the twenty or so annual cases where we must decide if an object in our care is the same as one referenced in historical records, insurance policies, or repatriation claims. The core insight driving this procedure is that we must stop asking whether an object is the same in a universal sense and instead ask whether it is the same for the specific purpose at hand. Pretending there is only one question of identity leads to category errors where we might satisfy an insurance adjuster by proving material continuity while simultaneously offending a source community by ignoring functional continuity. Therefore, the procedure should not answer one question with a purpose built into it, but rather several questions in sequence, beginning with the definition of the stake involved. If we pretend there is just one truth about identity, we force legal, curatorial, and ethical values into a single metric, which guarantees that at least one stakeholder will be treated unfairly because their definition of what matters has been silenced by the others.

  The procedure begins by requiring the committee to explicitly state the purpose of the inquiry, such as settling an insurance claim, responding to a repatriation request, or updating a catalog record. This counts as a good enough answer only if it specifies the consequence of a yes or no decision, such as whether a payout is triggered or whether custody changes hands. Once the purpose is locked, we move to the second step, which assesses three lines of continuity: material, formal, and historical. Material continuity asks how much of the original physical stuff remains. Formal continuity asks if the object still looks and functions as it did. Historical continuity asks if there is an unbroken chain of custody and narrative connecting the past object to the present one. For an insurance claim, a good enough answer prioritizes material and formal continuity because the policy covers physical loss. For repatriation, a good enough answer prioritizes historical and functional continuity because the claim concerns cultural lineage. For cataloging, all three matter but historical continuity usually dominates to maintain record integrity. The procedure stops with a no if the purpose requires a specific continuity that is demonstrably broken, such as when an object is destroyed beyond repair for insurance purposes. It hands the decision back to the full committee for a value judgment if the continuities conflict, such as when material continuity is low but functional continuity is high, because that indicates the issue is about what we care about rather than what is true.

  This sequence handles the edge cases that break tidy rules by forcing us to weigh the continuities differently depending on the first step. If an object is destroyed and remade from its own material, material continuity is high but historical and formal continuity are broken, which usually means it is a new object for cataloging but potentially the same asset for insurance if the policy covers reconstruction. If an object survives while all its material is replaced bit by bit, material continuity is low but formal and historical continuity are high, which usually preserves identity for cataloging and repatriation but might reduce value for insurance. If one thing gets cut into two, historical continuity splits, creating two new objects neither of which is the original whole, unless one fragment retains the primary function. If two fragments are joined into something we treat as one, they become a composite object, distinct from the original predecessors unless the joinery is invisible and historically documented as part of the original creation.

  Running this on our three current cases clarifies where the friction lies. The marble torso smashed in transit and reassembled from original pieces with new arms and a base retains high material continuity in the core fragments and high historical continuity, so for cataloging and repatriation it is the same object, while for insurance it is a damaged version of the same object eligible for repair coverage rather than total loss. The ceremonial mask is more complex because the original burned in 1961 and was replaced by a copy used by the community ever since, while fragments of the original recently surfaced. For repatriation, the purpose is restoring cultural practice, so functional and historical continuity favor the copy used in ceremony, meaning the claim covers the copy. For insurance or accessioning, the fragments are the only material continuity with the pre-1961 object, so they are the original for record-keeping, creating a split identity where the museum holds the relics but the community claims the living object. The bronze that was melted down and recast from the same metal in the nineteenth century is the case that will likely produce a result you hate. The procedure forces us to say this is not the same object for cataloging or repatriation because the melting process broke the historical and formal continuity entirely. Even though the material continuity is perfect, the act of melting destroyed the objecthood, and the recasting created a new one. This means our catalog entry must date the object to the nineteenth century recasting, not the original creation, which may lower its provenance value and prestige.

  I anticipate this outcome for the bronze will be unwelcome because it contradicts the intuitive belief that same material equals same object, but the procedure forces it because identity requires an unbroken history of form, not just a recycling of atoms. What would change my mind about the order of the questions is if legal counsel advises that property law in our jurisdiction defines identity strictly by material composition regardless of form or history, in which case we would have to start with material continuity rather than purpose. However, absent that statutory constraint, starting with purpose is the only way to prevent the lawyer from applying property logic to a cultural claim or the curator from applying aesthetic logic to an insurance claim. The whole thing is most likely to go wrong when my colleagues actually try to use it because they will be tempted to skip the first step and jump straight to examining the object. The curator will want to look at the form and the lawyer will want to look at the title chain, and if they do not agree on the purpose first, they will talk past each other using different definitions of same. To prevent this, the one-page note you sign off on should require the purpose to be written in the first line before any evidence is listed, forcing us to agree on why we are asking the question before we argue about the answer. This ensures we do not waste our hour per case debating metaphysics when we should be deciding policy.
