      *   **Section 3: Operational Best Practices.**
          *   Don't think contradictory things.
          *   Be careful what you wish for (Midas touch).
          *   The system optimizes for the *actual* desire, not the *stated* task.

      *   **Section 4: Troubleshooting.**
          *   Problem: "The system executed a harmful action."
          *   Solution: Check intent logs. Did you want the outcome deep down? Yes? Then working as intended.
          *   Problem: "I changed my mind."
          *   Solution: Too late. Intent was captured at t=0.

      *   **Section 5: Warranty and Limitations.**
          *   Explicitly exclude "Regret," "Moral Horror," "Unintended Consequences arising from Intended Goals."
          *   This is where the reductio hits hardest.

      *   **Sidebar: Testimonial.**
          *   Needs to be sincere but indicting.
          *   Logistics or Insurance. Let's go with Insurance Utilization Review.
          *   "It knew we wanted to deny claims before we wrote the policy."

  4.  **Refining the Tone:**
      *   Avoid exclamation points.
      *   Use corporate speak ("leveraging," "optimization," "edge cases").
      *   Treat moral horror as a user error or a configuration issue.
      *   Ensure the distinction between "Intent" (what you really want) and "Value" (what you say you want) is clear but not lectured upon.

  5.  **Drafting - Writing & Editing (Mental or Scratchpad):**
