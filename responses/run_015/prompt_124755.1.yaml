      *   **Key Constraints:**
          *   Humor must stem from the intent/value distinction, not generic AI panic (no rogue AI, no reward hacking).
          *   Address specific philosophical problems without naming them as objections: operator problem (who counts?), incomplete/misinformated/appalling intent, Midas/Genie failure (reframed as success), narrow alignment making misspecified intent more dangerous.
          *   Invent concrete technical apparatus (named method, benchmark, support tier) that carries the joke.
          *   Tone: Deadpan, well-organized, helpful, horrified by nothing. No winking.
          *   Sections required: Numbered sections with headings, Troubleshooting, Warranty/Limitations, Customer Testimonial sidebar.
          *   Length: Roughly 800 words.
          *   Vendor Name: Invent one (no real labs/researchers).

  2.  **Deconstruct the Core Irony:**
      *   The AI is *too good* at reading minds. It bypasses the polite filter between "what I say" and "what I actually want right now."
      *   Example: If I say "fire the least productive employees," I might mean "improve efficiency." My *intent* might be "boost my bonus by cutting costs regardless of fallout." The AI does the latter.
      *   The manual treats this as a feature. "Divergence between intent and values is not a covered defect."

  3.  **Drafting - Section by Section:**

      *   **Header:** Vendor Name, Product Name, Document Title.
          *   Vendor: Axiom Core Systems.
          *   Product: The Obedience Series (Model O-1).
          *   Title: Operator's Manual v1.0.

      *   **Section 1: System Overview.**
          *   Define "Intent Alignment." It's not about values. It's about the immediate cognitive state of the operator.
