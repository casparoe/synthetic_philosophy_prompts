answer: |-
  Your formalization is exceptionally sharp. You have correctly identified the central tension in the epistemic defense of sortition: the **Competence/Representation Trade-off**. If you demand competence, you reintroduce elitism; if you demand representation, you risk incompetence.

  You are right to suspect a scope shift between (2) and (5). The equivocation lies in the term **"collective judgment"** (in step 2) and **"competence"** (in step 5). The argument treats all political/decision-making tasks as epistemically homogeneous. They are not.

  To save your core position (1) and (3) without collapsing into the dilemma in (8), you should **reject (2)**.

  Here is the precise diagnosis, the philosophical cost of rejecting (2), and how to reconstruct the argument to avoid the *reductio*.

  ### 1. The Diagnosis: Why Step (2) Fails
  Step (2) claims: *If cognitive diversity is the operative good, then it applies to any collective decision procedure vulnerable to the same biases.*

  This is false because **the epistemic function of the body determines the value of diversity.**
  *   **Legislatures (Axiological Bodies):** Their primary task is to weigh competing values, interests, and trade-offs (e.g., "How much privacy are we willing to sacrifice for security?"). In this domain, "competence" is largely **experiential**. Every citizen is an expert on their own life and interests. Therefore, cognitive diversity *is* descriptive diversity. A filter here excludes relevant data (lived experience).
  *   **Regulatory Panels (Technical Bodies):** Their primary task is to assess causal mechanisms and safety probabilities (e.g., "Does Drug X cause liver failure?"). In this domain, "competence" is **specialized**. Lived experience is largely irrelevant to pharmacokinetics. A filter here excludes noise, not signal.

  By rejecting (2), you argue that the *type* of cognitive diversity required for legislatures (diversity of values/interests) is fundamentally different from the type required for expert panels (diversity of problem-solving heuristics within a technical paradigm).

  ### 2. The Cost of Rejecting (2)
  Rejecting (2) saves your argument from the *reductio*, but it forces you to pay three specific theoretical prices:

  **Cost A: You must abandon "Pure" Sortition for a Hybrid Model.**
  If you admit that expert panels require filters (as per 3 and 4) but legislatures do not (as per 1), you concede that governance requires a **division of epistemic labor**. You cannot claim sortition is superior for *all* decision-making.
  *   *Implication:* You must endorse a system where sortitive bodies set the **ends** (values, priorities, mandates) and filtered expert bodies determine the **means** (technical implementation, safety standards).
  *   *Risk:* This opens you to the objection that "the real power lies in the means." If the sortitive body says "Make healthcare better" but the expert panel defines what "better" means technically, the sortition is decorative. You must argue for strong sortitive veto power over technical proposals.

  **Cost B: You must defend the claim that Legislation is primarily Axiological.**
  Modern legislation is incredibly technical. Tax codes, environmental regulations, and digital privacy laws involve complex causal chains.
  *   *Implication:* You must argue that while the *details* are technical, the *constraints and goals* are not.
  *   *Risk:* Opponents will argue that you cannot separate ends from means cleanly. (e.g., Setting a CO2 limit of 500ppm vs 400ppm is both a value judgment and a technical one). You need a theory of "bounded technicality" where sortition sets the bounds and experts fill the space.

  **Cost C: You lose the "Universalist" Moral High Ground.**
  Part of the appeal of sortition is its simplicity: "Random is fair." By rejecting (2), you complicate the view. You are no longer saying "Random selection is epistemically superior everywhere." You are saying "Random selection is epistemically superior *specifically for value aggregation*."
  *   *Implication:* Your defense becomes more sociological and less purely epistemic. You are arguing that for *political* legitimacy, experiential diversity outweighs technical credentialism, whereas for *regulatory* reliability, the opposite holds.

  ### 3. Reconstructing the Argument
  Here is how you rewrite the chain to maintain (1) and (3) while blocking the slide into (8).

  *   **(1)** The strongest justification for replacing elected legislatures with sortitive bodies is that random sampling maximizes **value-heuristic diversity** (interests, lived experience) and eliminates careerist biases.
  *   **(2*)** **[REJECTED/MODIFIED]** The value of cognitive diversity is **task-dependent**. For bodies deciding *values/ends* (legislatures), unfiltered diversity is epistemically superior. For bodies deciding *causal means* (drug panels), filtered competence is epistemically superior.
  *   **(3)** Expert regulatory bodies suffer from capture and homogeneity, but their primary function is technical assessment, not value aggregation.
  *   **(4*)** Therefore, we should apply **filtered sortition** or **reformed appointment processes** to expert bodies to reduce capture, acknowledging that technical competence filters are legitimate here.
  *   **(5*)** In legislative domains, **value-competence** is widely distributed. Applying educational or class filters excludes relevant value-data (lived experience) without adding relevant technical skill, because the task is not technical optimization but interest reconciliation.
  *   **(6*)** Therefore, the "no-filter" rule applies to legislatures *not* because we ignore competence, but because the relevant competence (experiential) is universal, whereas the relevant competence for drug panels (technical) is not.
  *   **(7*)** This avoids the dilemma: We do not concede citizens are incompetent at *governing* (setting goals), even if they are incompetent at *engineering* (drafting clauses).
  *   **(8*)** Hence, the cognitive-diversity defense justifies unfiltered sortition for legislatures **and** filtered/reformed selection for expert bodies, without contradiction.

  ### 4. Strategic Recommendation
  To make this stick, you need to lean heavily into the distinction between **Political Judgment** and **Technical Judgment**.

  *   **Political Judgment:** Requires knowledge of "what it feels like" to be affected by a law. This is distributed equally. *Filter = Bias.*
  *   **Technical Judgment:** Requires knowledge of "how the world works" causally. This is distributed unequally. *Filter = Quality Control.*

  **The Trap to Avoid:**
  Do not let opponents convince you that legislation is purely technical. If you concede that writing a tax code is like designing a bridge, you lose. You must argue that writing a tax code is like deciding *who should pay for the bridge*, which is a moral question, not an engineering one.

  **Summary:**
  Reject **(2)**. The cost is that you must accept a **hybrid constitution** (Sortition for Ends, Expertise for Means) and defend the **separability of values and facts** in governance. This is a defensible position (akin to Habermas's distinction between communicative and instrumental rationality), but it requires more nuance than the "Sortition Solves Everything" pitch. It trades elegance for accuracy.
