      *   **Dennett (Stance Realism/Instrumentalism):** Intentionality is a matter of interpretation (Intentional Stance). If a system is predictable via belief/desire attribution, it has beliefs/desires. There is no deep metaphysical difference between original and derived, just degrees of complexity and design. The "Two-Bitser" thought experiment (vending machine that can be tricked vs. one that knows) is key.
      *   **The Conflict:** Searle says biology is necessary for *real* aboutness. Dennett says function/predictive success is sufficient for *real* aboutness (no hidden essence).
      *   **The Scenario (Cascade Bitser):** Layer 1 (Bio) -> Layer 2 (Synthetic). Layer 2 models Layer 1. Layer 2 corrects Layer 1.
          *   Searle likely says: Layer 1 has original, Layer 2 has derived (because it's synthetic/computational).
          *   Dennett likely says: Both have intentionality relative to the stance. Layer 2 might even have *more* robust intentionality if it's more reliable/predictive.

