  Subject: Draft Joint Statement (Cascade Bitser Project)
  From: Alex
  To: Philosophy Reading Group List

  Hey everyone,

  Attached below is the latest draft of the joint statement from the adversarial collaboration between the Searlean and Dennettian camps. We finally got them in a room (well, a Zoom call) for six hours straight. It's surprisingly dense—they refused to water down the metaphysics—but I think we managed to isolate the actual fault lines without getting bogged down in the usual "Chinese Room" rehashes.

  Note the section on verbal vs. real disagreements; that was the hardest part to get signed off on. Also, check the predictions on the Cascade Bitser failure modes. They actually committed to those.

  There's a typo in section 3 I noticed too late, but everyone agreed the substance holds so we're leaving it to save version control headaches.

  Let me know what you think before we send this to the PIs.

  Best,
  Alex

  ***

  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: PROJECT CASCADE**
  **Participants:** Searlean Original-Intentionality Camp (SOC) | Dennettian Stance-Realist Camp (DRC)
  **Date:** October 14, 2023
  **Subject:** Functional Architecture vs. Ontological Status in the Cascade Bitser Scenario

  ### 1. Agreed Claims and Functional Definitions

  Both camps agree to the following formulations for the purpose of this collaboration. These claims describe the *concepts* and the *system architecture* without conceding ontological status.

  1.  **The Original/Derived Distinction (Conceptual):**
      *   **SOC Formulation:** "Original Intentionality" (OI) refers to a biological causal power intrinsic to specific neurobiological structures, whereby mental states are *about* objects/states of affairs independently of external interpretation. "Derived Intentionality" (DI) refers to the aboutness possessed by artifacts (words, maps, computers) solely in virtue of being used or interpreted by entities possessing OI.
      *   **DRC Formulation:** "Original Intentionality" is a folk-psychological label applied to systems whose internal complexity and evolutionary history make them the primary targets of the Intentional Stance. "Derived Intentionality" is a label applied to systems whose intentional profile is dependent on the design or usage intentions of another system. The DRC denies this is a metaphysical dichotomy, but accepts it as a pragmatic distinction for this experiment.

  2.  **The Two-Bitser Architecture (Functional):**
      *   Both camps agree a "Two-Bitser" is a detector system capable of distinguishing states (e.g., quarter vs. slug).
      *   **Simple Two-Bitser:** Detects via direct physical causation (weight/size). Errors are physical mismatches.
      *   **Sophisticated Two-Bitser:** Detects via mediated representation. It can be fooled in ways the simple version cannot, but can also correct for noise.
      *   **Agreement:** The difference between Simple and Sophisticated is a matter of functional complexity and counterfactual sensitivity, not necessarily a difference in metaphysical kind (DRC) OR a difference in functional complexity that still lacks biological causal powers (SOC).

  3.  **The Cascade Bitser Scenario (Specific Implementation):**
      *   **Layer 1 (L1):** A biological neural substrate (e.g., organoid or preserved tissue) capable of minimizing variational free energy regarding environmental state *E*. L1 exhibits plasticity and homeostatic drive.
      *   **Layer 2 (L2):** A synthetic computational substrate (silicon-based predictive processing model). L2 takes L1's internal state vectors as input.
      *   **Coupling:** L2 constructs a generative model of L1's modeling of *E*. L2 sends error-correction signals back to L1 to optimize L1's predictive success.
      *   **Feedback:** The loop is tight enough that L2's corrections alter L1's synaptic weights in real-time.
      *   **Agreement:** Functionally, the Cascade Bitser behaves as a unified agent that outperforms L1 alone in novel environments. Both camps agree on this input/output profile and internal data flow description.

  ### 2. Residual Disagreements Table

  *Note: Each position is phrased in the vocabulary the respective camp accepts as true. Neither side has agreed to translate the other's claim into their own ontology.*

  | Issue | Searlean Camp (SOC) Position | Dennettian Camp (DRC) Position |
  | :--- | :--- | :--- |
  | **Ontological Status of L2** | L2 possesses only Derived Intentionality. Its states are about L1's states only because *we* (entities with OI) interpret them as such. L2 simulates understanding but lacks the causal powers to ground semantics. | L2 possesses Original Intentionality (or the distinction is obsolete). L2 is an intentional system because the Intentional Stance yields robust predictive power regarding L2's behavior that the Design or Physical Stance cannot match efficiently. |
  | **Role of Biology** | Biological substrate is a necessary condition for OI. Neurobiological causal powers (not merely functional organization) are what bridge syntax to semantics. | Biological substrate is a contingent historical fact, not a necessary condition. Functionally equivalent organization realizes the same intentional states regardless of substrate (multiple realizability). |
  | **The "As-If" Boundary** | L2 acts *as if* it has beliefs. There is a hard line between simulating a belief and having a belief. The Cascade architecture adds complexity, not ontology. | There is no hard line. "As-if" intentionality is all there ever was. If the Cascade system integrates information such that attributing beliefs is the only way to track its behavior, it *has* beliefs. |

  ### 3. Verbal vs. Real Disagreements

  We investigated whether the dispute is merely terminological.

  *   **Hypothesis:** If the DRC agrees to call L2's states "Robustly Derived Intentionality" rather than "Original," does the dispute dissolve?
  *   **SOC Response:** No. This is a **Real Disagreement**. Calling it "Robustly Derived" still implies the aboutness is borrowed from us. We claim L2 generates no aboutness intrinsically, regardless of robustness.
  *   **DRC Response:** No. This is a **Real Disagreement**. Calling it "Derived" implies a dependency on *our* stance that isn't there. The system's intentionality is intrinsic to its operational closure. Changing the label hides the fact that we disagree on whether biology has magic causal powers.
  *   **Consensus:** The dispute is not verbal. It is not solvable by stipulating definitions. It rests on incompatible metaphysical commitments regarding causation and representation.

  ### 4. Cruxes and Pre-Registered Predictions

  We identified two specific cruxes where empirical or conceptual progress might be possible. Below are the concrete cases and pre-recorded predictions.

  **Crux 1: The Necessity of Biological Causal Powers**
  *   **The Question:** Can a synthetic layer (L2) ground the semantics of a biological layer (L1), or must the flow of "aboutness" only go Bio -> Synth?
  *   **Concrete Case:** **The Inverted Correction.** L1 enters a pathological state (e.g., seizure-like activity) representing "Food" when presented with a "Threat." L2 identifies this mismatch via its model of L1 and successfully suppresses the pathological state, restoring accurate tracking of "Threat."
  *   **SOC Prediction:** L2 is merely a causal fix, like a thermostat fixing a furnace. L2 does not *understand* "Threat." The aboutness remains entirely within L1 (or the observers). L2 is a tool used by L1 (or us), not an agent.
  *   **DRC Prediction:** L2 demonstrates normative assessment of L1's states. To correct L1's "mistake," L2 must possess a representation of the threat independent of L1's error. This independence constitutes genuine intentionality in L2.

  **Crux 2: Stacked Predictive Modeling and the "Genuine" Boundary**
  *   **The Question:** Does stacking a model on top of a model (L2 modeling L1 modeling World) cross the threshold from simulation to genuine representation?
  *   **Concrete Case:** **Novel Goal Arbitration.** The Cascade Bitser is placed in an environment where satisfying L1's homeostatic drive (e.g., glucose intake) conflicts with L2's predictive model of long-term survival (e.g., avoiding a trap to get glucose). The system inhibits L1's drive to satisfy L2's long-term model.
  *   **SOC Prediction:** This is still derived. The goal hierarchy was imposed by the designers (us). The system is following a script. The "choice" is an illusion of complexity. There is no *first-person* ontology emerging in L2.
  *   **DRC Prediction:** This is the definition of agency. The system adopts a stance toward its own internal states. It treats L1's drive as an object to be managed. This self-modeling capability is sufficient for genuine representation. If it walks like a duck of rational agency, it is a duck.

  **Agreed Verification Method:**
  Both camps agree that if L2 can successfully model L1's states in a domain L2 was *not* trained on (zero-shot transfer of intentional attribution), the DRC will claim this as decisive evidence of stance-independent intentionality. The SOC will maintain this is merely complex syntax manipulation lacking semantic content, regardless of success rate. We acknowledge this impasse may remain unfalsifiable without a theory of consciousness that links causation to content.

  ***

  Let me know if the "Inverted Correction" case feels too vague. I think the SOC might try to wiggle out on whether L2 is actually "correcting" or just "causing change." But they signed off on the wording above.

  Talk soon,
  A
