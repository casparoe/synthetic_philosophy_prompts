          *   Crux 1: Biological Substrate (Causal Powers vs. Functional Organization).
          *   Crux 2: The As-If/Genuine Boundary (Stacked Prediction).
      *   **Section 4: Concrete Cases/Predictions:**
          *   Need a test case. Maybe a specific failure mode of the Cascade Bitser.
