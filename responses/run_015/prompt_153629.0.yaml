  The Setup
  Quine's "Two Dogmas of Empiricism" shattered the empiricist foundation by rejecting reductionism and the notion of truths validated purely by meaning. For the novelist's philosophers, the stake is whether meaning retains any normative structure amidst holism. A reconstructed distinction cannot promise unrevisability; it must explain why some beliefs function as constitutive rules while others function as empirical claims, without invoking a metaphysical firewall. The goal is a functional topology of belief, not a binary ontology.

  The Desiderata
  1. **Holistic Consistency:** The theory must acknowledge that any statement is revisable given sufficient adjustments elsewhere in the web. *Motivation:* Recalcitrant experience can force changes even in logical laws. *Status:* Non-negotiable; denying this ignores Quine's core insight regarding the unit of empirical significance. Failure here returns us to dogmatic empiricism.
  2. **Explaining Stability:** It must explain why logical truths are rarely abandoned without claiming they are *in principle* unrevisable. *Motivation:* We treat modus ponens differently than 'there is a cat,' yet both are fallible. Quantum logic suggests even distributivity is revisable. Without this, we cannot explain the specific resistance to revision found in mathematics compared to physics. *Status:* Non-negotiable; otherwise, the distinction lacks explanatory power regarding actual scientific practice.
  3. **Naturalistic Integrity:** The account must not rely on a priori intuition outside scientific inquiry. *Motivation:* Avoiding Carnap's "first philosophy" which Quine dismantled. *Status:* Negotiable for Platonists, but non-negotiable for naturalists seeking continuity with science. It must locate normativity within human practices.
  4. **Theoretical Pressure Gradient:** It must distinguish statements abandoned only under extreme theoretical duress from ordinary hypotheses. *Motivation:* Euclidean geometry functioned as constitutive until relativity forced its revision. The shift to non-Euclidean geometry was not a simple falsification but a reconceptualization of space itself. *Status:* Non-negotiable; this is the specific phenomenon a reconstructed distinction must save from collapse.
  5. **Non-Binary Conventionality:** It must differentiate conventional choice from empirical confirmation without a sharp line. *Motivation:* Framework choices feel different than data fitting. *Status:* Negotiable; some argue this feeling is merely psychological inertia. It must avoid sharp bifurcation.

  *Joint Unsatisfiability:* There is a severe tension between (1) and (4). If any statement is revisable (1), the difference between 'constitutive' and 'empirical' becomes merely pragmatic degree, risking collapse into pure holism. If the distinction is robust enough to satisfy (4), it risks violating (1) by implying a protected class of beliefs. A successful theory must thread this needle by defining analyticity as a functional role within a web, not a semantic property. Many argue this is impossible; if analyticity is purely pragmatic, it ceases to be analyticity in the traditional sense. Thus, satisfying all desiderata may require abandoning the label 'analytic' entirely in favor of 'centrality,' admitting that the traditional distinction cannot survive naturalization intact. The conflict lies in demanding a functional difference that mirrors a semantic one while denying the semantic foundation. This implies the desiderata set may be inherently contradictory unless 'analytic' is redefined so thoroughly it becomes unrecognizable to historical participants. Consequently, a theory meeting all criteria might not be a theory of analyticity at all, but of theoretical centrality. If the boundary is merely pragmatic, it loses its normative force, rendering the distinction descriptive rather than philosophical.

  Contenders at a Glance
  Pure Quinean holism satisfies naturalism and consistency but fails to explain stability or the pressure gradient, collapsing the distinction. It treats geometry revisions as identical in kind to observation reports, differing only in centrality. Reconstructed Carnapian conventionalism preserves the convention/fact split but struggles with naturalistic integrity, often smuggling in a priori frameworks. It risks violating holistic consistency by protecting linguistic frameworks from empirical pressure. The graded-centrality view fares best on consistency and stability, treating analyticity as a matter of degree. However, it risks failing the non-binary conventionality desideratum by reducing normative constitutive rules to mere psychological entrenchment, leaving the novelist's philosophers to argue whether 'degree' is enough to save the distinction's name. None fully satisfy the joint unsatisfiability constraint without concession.

  What Would Change My Mind
  I would abandon the claim of joint unsatisfiability if a formal pragmatic model demonstrated how constitutive rules function differently from empirical hypotheses within belief revision, without invoking semantic atoms. If 'analytic' could be shown to denote a computational role in cognitive architecture rather than a logical property, the tension between holism and stability dissolves. My reasoning is most vulnerable in classifying naturalistic integrity as non-negotiable; if a robust modal realism could ground the distinction without first philosophy, the desiderata shift. The weak point is assuming pragmatism cannot sustain normative force.
