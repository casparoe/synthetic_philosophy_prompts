prompt: |-
  Across most jurisdictions, criminal perjury is narrowly defined: it requires a statement made under oath that the speaker believes to be false. A witness who answers every question with technically accurate but selectively arranged information, thereby inducing a false overall impression, usually escapes liability. By contrast, professional disciplinary codes for scientists, journalists, and auditors frequently treat such selective framing as a serious breach, often equivalent to fabrication. Meanwhile, consumer-protection and contract law regularly prohibit ‘misleading’ commercial behaviour even when no individual utterance is literally false.

  What philosophical commitments about language, belief, and moral responsibility does this institutional divergence presuppose? Must one hold that lying violates a specific commitment internal to the speech-act of asserting, whereas misleading exploits a structural gap in that commitment? Or can the divergence be explained without any deep conceptual distinction — for example, by differences in evidentiary tractability, or in the state’s legitimate interest in coercing truthful testimony?

  Consider further: if the fundamental wrong of deception is not the utterance of a false proposition but the manipulation of another’s belief-forming processes, does the law’s exclusive focus on literal falsity become philosophically incoherent? And is there a hidden tension in a system that punishes negligent misstatement in tort, yet excuses deliberate but technically truthful misdirection in the witness box?

  Reconstruct the implicit theory — or theories — that render this pattern consistent. Distinguish what the practice strictly presupposes from what merely fits it well, identify where it is philosophically underdetermined, and indicate what would have to change in legal or professional ethics if the underlying view of deception were replaced by one that treats misleading and lying as morally equivalent.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** There's a divergence in how different institutions handle "truthfulness."
          *   *Criminal Perjury:* Narrow. Requires belief in falsity of the specific statement under oath. "Paltering" (truthful but misleading) usually escapes liability.
          *   *Professional Ethics (Scientists, Journalists, Auditors):* Broad. Selective framing/misleading is often treated as seriously as fabrication.
          *   *Consumer/Contract Law:* Broad. Prohibits "misleading" conduct even if individual utterances are literally true.
      *   **Key Questions:**
          *   What philosophical commitments (language, belief, moral responsibility) does this divergence presuppose?
          *   Is there a deep conceptual distinction (lying vs. misleading), or is it pragmatic (evidentiary tractability, state interest)?
          *   If the wrong is *manipulation of belief*, is the law's focus on literal falsity incoherent?
          *   Is there tension between tort (negligent misstatement) and perjury (deliberate misdirection)?
          *   **Task:** Reconstruct the implicit theory/theories rendering this consistent. Distinguish strict presuppositions from good fits. Identify underdetermination. Indicate what changes if the view of deception shifts (lying = misleading).

  2.  **Initial Brainstorming & Categorization:**

      *   *The "Lying vs. Misleading" Distinction:* Philosophers (e.g., Kant, Aquinas, modern analytic philosophy) often debate this. Some say lying is worse (violates norm of assertion); others say intent matters more (both aim to deceive).
      *   *Legal Pragmatism:* Criminal law needs high certainty (*mens rea*, actus reus). Proving someone *believed* a statement was false is hard; proving they *intended* to mislead via omission is harder. Civil/Professional law deals with standards of care, fiduciary duties, or market fairness, where "spirit" matters more than "letter."
      *   *Speech Act Theory:* Assertion carries a norm of truthfulness. Does it carry a norm of *completeness*? Usually no, unless a specific relationship (fiduciary) exists.
      *   *Moral Responsibility:* Perjury is about the integrity of the *process* (the oath). Professional ethics is about the integrity of the *product/trust*. Consumer law is about *power dynamics*.

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the divergence. State the thesis: The divergence isn't necessarily incoherent but reflects distinct normative frameworks regarding *epistemic duty* and *institutional function*. It presupposes a distinction between "negative duty" (don't assert falsehoods) and "positive duty" (ensure understanding).
      *   **Section 1: The Philosophical Commitments (Language & Belief):**
          *   Analyze the "Literalist" view (Perjury) vs. the "Pragmatist" view (Professional/Consumer).
          *   Commitment: The norm of assertion is truth-conditional, not implicature-conditional (in criminal law).
          *   Commitment: Moral responsibility scales with relational duty (fiduciary vs. adversarial).
      *   **Section 2: Explaining the Divergence (Conceptual vs. Pragmatic):**
          *   Is it deep conceptualism? (Lying violates assertion; misleading exploits it).
          *   Or is it evidentiary/state interest? (Criminal law requires bright lines; Civil/Professional law allows balancing).
          *   Argument: It's mostly pragmatic/institutional, masked as conceptual.
      *   **Section 3: Coherence and Tension:**
          *   If deception = belief manipulation, is perjury incoherent? Yes, partially.
          *   Tort vs. Perjury tension: Tort protects reliance interests; Perjury protects procedural integrity.
      *   **Section 4: Reconstructing the Implicit Theory:**
          *   Theory of "Contextual Epistemic Duties."
          *   Strict Presuppositions: Oaths bind utterances, not implications. Fiduciary roles bind outcomes.
          *   Underdetermined areas: Where does "half-truth" become "lie"?
      *   **Section 5: Implications of Shift (Lying = Misleading):**
          *   Criminal law would become unenforceable or tyrannical.
          *   Professional standards would merge with criminal law.
          *   Chilling effects on speech.
      *   **Conclusion:** Summarize. The system is functionally consistent even if philosophically messy.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start strong. The divergence isn't a bug; it's a feature of different normative ecosystems.
      *   *Philosophical Commitments:* Need to bring in Gricean pragmatics. Perjury relies on *semantic* content. Professional ethics relies on *pragmatic* content (implicature).
      *   *Moral Responsibility:* Distinguish between *adversarial* (court) and *fiduciary* (auditor/doctor) relationships. In court, the lawyer extracts truth; the witness just answers. In auditing, the auditor must *find* truth.
      *   *The "Incoherence" Question:* If the wrong is manipulation, perjury looks weak. But if the wrong is *breaking the oath*, perjury is strong. The oath is a specific speech act.
      *   *Tort vs. Perjury:* Tort is about loss compensation (reliance). Perjury is about justice administration. Different goods protected.
      *   *Reconstruction:* Call it "Institutional Epistemology." The law doesn't have one theory of truth; it has context-dependent theories.
      *   *What if we change it?* If we treat misleading as lying in criminal law, we criminalize silence/omission too broadly. Vagueness violates legality principles (*nullum crimen sine lege*).

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Am I saying the law is right?
      *   *Correction:* No, I need to analyze what it *presupposes*, not necessarily endorse it. The prompt asks to reconstruct the implicit theory.
      *   *Nuance:* Make sure to distinguish between *presuppositions* (what must be true for the rule to exist) and *justifications* (why the rule is good).
      *   *Key Distinction:* The "Norm of Assertion" vs. "Duty of Disclosure." Perjury enforces the former; Professional ethics enforces the latter.
      *   *Philosophical depth:* Mention the distinction between *semantic* truth and *pragmatic* truth. Mention the *Mens Rea* problem.

  6.  **Final Polish:**

