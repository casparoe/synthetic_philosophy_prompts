      *   *Conceptual vs. Pragmatic?* Yes (addressed both).
      *   *Incoherence?* Yes (addressed the belief-manipulation view).
      *   *Tort tension?* Yes (addressed reliance vs. procedure).
      *   *Reconstruct theory?* Yes (Institutional Epistemic Duties).
      *   *Presuppositions vs. Fits?* Yes (distinguished).
      *   *Underdetermination?* Yes (the boundary of omission).
      *   *Changes if view shifts?* Yes (criminalization of implicature).

