answer: |-
  The institutional divergence you describe—between the narrow literalism of criminal perjury, the broad pragmatism of professional ethics, and the protective stance of consumer law—does not necessarily indicate a philosophical contradiction. Rather, it reveals a stratified **theory of institutional epistemic duties**. The law and professional codes do not operate with a single monolithic definition of "deception"; they operate with context-dependent norms regarding the *scope of the speaker's obligation* to the listener.

  To reconstruct the implicit theory rendering this pattern consistent, we must distinguish between the **norm of assertion** (governing perjury) and the **duty of disclosure** (governing professions and commerce).

  ### 1. Philosophical Commitments: Semantics, Pragmatics, and Duty

  The divergence presupposes distinct commitments regarding language and moral responsibility in different contexts.

  **A. The Semantic Commitment (Perjury)**
  Criminal perjury rests on a **semantic theory of truth**. It presupposes that the moral and legal wrong of lying under oath is located in the *propositional content* of the utterance relative to the speaker's belief.
  *   **Language:** It treats language as a vehicle for discrete propositions. The "truth" is a property of the sentence, not the conversation.
  *   **Belief:** It requires *mens rea* regarding that specific proposition ("I believe P is false").
  *   **Responsibility:** The witness's moral duty is **negative**: *Do not assert what you believe to be false.* They have no affirmative duty to ensure the listener forms a correct overall impression, provided the specific answers are true. This aligns with an adversarial system where the *questioner* bears the burden of extracting the full truth, not the witness.

  **B. The Pragmatic Commitment (Professions & Consumer Law)**
  Professional codes and consumer law rest on a **Gricean/pragmatic theory of communication**. They presuppose that communication involves not just semantic content but *implicature* (what is suggested by context).
  *   **Language:** Meaning is co-constructed. A technically true statement that triggers a false inference violates the cooperative principle of conversation.
  *   **Belief:** The focus shifts from the speaker's belief about the statement to the speaker's **intent regarding the listener's belief state**.
  *   **Responsibility:** The duty is **positive** or **fiduciary**. An auditor, journalist, or merchant holds a position of trust or superior knowledge. Their responsibility is not merely to avoid falsehoods but to prevent *misunderstanding*. Here, the wrong is not the violation of the norm of assertion, but the violation of the **norm of reliance**.

  ### 2. Conceptual Distinction vs. Evidentiary Pragmatism

  You ask whether one must hold that lying violates a commitment internal to assertion, whereas misleading exploits a gap. The institutional divergence suggests a hybrid answer: **Conceptually distinct, but pragmatically enforced.**

  **The Conceptual Layer:**
  There is a genuine philosophical distinction between *lying* (asserting $P$ while believing $\neg P$) and *misleading* (asserting $P$ to imply $Q$ while believing $\neg Q$).
  *   In perjury, the oath binds the *utterance*. The witness swears to tell the truth *in their answers*.
  *   In professional ethics, the oath binds the *function*. The auditor swears to validate the *financial reality*.
  Therefore, the divergence fits the conceptual distinction: Perjury polices the *act of testifying*; Professional Ethics polices the *outcome of the inquiry*.

  **The Pragmatic Layer (Evidentiary Tractability):**
  However, the divergence is better explained by **enforceability**.
  *   **Criminal Law:** Requires proof beyond a reasonable doubt. Proving a witness *believed* a literal statement was false is difficult; proving they *intended* to create a false impression via a true statement is nearly impossible without mind-reading. A narrow definition protects against the state criminalizing ambiguity.
  *   **Civil/Professional Law:** Operates on preponderance of evidence or professional standards. It is easier to judge an auditor's report against "generally accepted principles" (which demand completeness) than to judge a witness's intent against a specific question.

  **Conclusion on Divergence:** The system does not require a deep metaphysical distinction between lying and misleading to remain consistent. It requires only a distinction in **institutional purpose**. The state's interest in perjury is procedural integrity (did you break the oath?); the market's interest in consumer law is transactional fairness (was the consent informed?).

  ### 3. Coherence and the "Manipulation of Belief"

  If the fundamental wrong of deception is the **manipulation of belief-forming processes**, then the law's exclusive focus on literal falsity in perjury is indeed **philosophically incoherent**, but **legally necessary**.

  *   **The Incoherence:** If morality tracks harm (the victim holds a false belief), then the "paltering" witness causes the same harm as the lying witness. Exculpating the former while punishing the latter creates a moral hazard where agents are incentivized to become sophisticated manipulators of implicature rather than truthful informants.
  *   **The Tension (Tort vs. Perjury):** There is a sharp tension between tort law (which punishes negligent misstatement because reliance was reasonable) and perjury law (which excuses deliberate misdirection because the literal words were true).
      *   *Resolution:* This is resolved by the **doctrine of reliance**. In tort, the plaintiff is owed a duty of care; their reliance is protected. In court, the opposing counsel is *not* owed a duty of care; they are an adversary. The court assumes the counsel should have asked follow-up questions. Thus, the "wrong" in perjury is not deceiving the court, but **corrupting the record**. A true statement enters the record as truth; a false impression remains a matter of interpretation.

  ### 4. Reconstructing the Implicit Theory: "Contextual Epistemic Duties"

  The pattern is rendered consistent by an implicit theory of **Contextual Epistemic Duties**. This theory holds that the obligation to be truthful scales with the **asymmetry of information** and the **nature of the relationship**.

  **Strict Presuppositions (What must be true for the system to work):**
  1.  **The Oath is Lexical:** In criminal proceedings, the oath binds the speaker to the *lexicon* of the question, not the *spirit* of the inquiry.
  2.  **Fiduciary Asymmetry:** In professions (auditing, medicine), the expert holds a monopoly on verification. Therefore, their duty expands from "do not lie" to "do not allow false inference."
  3.  **Adversarial Competence:** In court, the listener (lawyer/judge) is presumed competent to detect misleading framing. In consumer markets, the listener is presumed vulnerable.

  **What Merely Fits Well (Contingent Justifications):**
  1.  **Evidentiary Ease:** It fits well that criminal law avoids "misleading" standards because they are hard to prove, but this is a pragmatic convenience, not a logical necessity.
  2.  **Market Efficiency:** It fits well that consumer law bans misleading conduct to reduce transaction costs, but this is an economic justification, not a moral one.

  **Where it is Philosophically Underdetermined:**
  The boundary between **evasive truth-telling** and **affirmative misdirection** is underdetermined.
  *   *Example:* If a witness knows $P$ implies $Q$, and knows $Q$ is false, and answers $P$ specifically to induce belief in $Q$, have they violated the oath? Current law says no. A robust theory of deception says yes. The current system lacks a principle to adjudicate *intent-to-implicate* within the strictures of perjury.

  ### 5. Implications of Shifting the View (Lying = Misleading)

  If we replaced the underlying view with one that treats misleading and lying as morally and legally equivalent (a "Belief-Manipulation Standard"), the consequences would be radical:

  **A. Criminal Law (Perjury):**
  *   **Expansion of Liability:** Witnesses could be prosecuted for "vibes" or implications. The *actus reus* would shift from "making a false statement" to "creating a false impression."
  *   **Chilling Effect:** Witnesses would become overly verbose or refuse to answer to avoid unintended implicatures.
  *   **Loss of Legality:** It would violate the principle of *nullum crimen sine lege* (no crime without law). "Misleading" is too vague for criminal statutes; citizens cannot know in advance what implications are prohibited.

  **B. Professional Ethics:**
  *   **Convergence:** Professional codes would merge closer to criminal standards. The distinction between "negligence" and "deception" would blur.
  *   **Epistemic Burden:** The burden would shift entirely to the speaker to model the listener's mind. An auditor would be liable not just for what they wrote, but for what a reasonable person *might infer* from what they omitted.

  **C. Moral Responsibility:**
  *   **Internalization:** Moral responsibility would become purely internal (intent to deceive) rather than external (violation of semantic norm). This aligns better with Kantian ethics (respect for rational agency) but creates a nightmare for legal administration.

  ### Conclusion

  The institutional divergence presupposes that **truth is a variable norm**, not a constant value.
  *   In **Criminal Law**, truth is **procedural**: Did you violate the specific constraint of the oath?
  *   In **Professional/Consumer Law**, truth is **functional**: Did the communication serve its intended purpose of accurate transmission?

  The system is philosophically consistent only if one accepts that **moral obligations are role-dependent**. The witness is a cog in a machine designed to extract truth through conflict; the auditor is a guardian designed to certify truth through verification. To treat them identically would be to ignore the structural function of their speech acts. However, if one holds that the *moral wrong of deception* is invariant across contexts (i.e., manipulating belief is always equally wrong), then the legal distinction is indeed incoherent, prioritizing **administrative convenience** over **moral reality**. The law chooses the former; the philosopher may demand the latter.
