answer: |-
  Here is my decomposition and credence on your claim: **"By ~1650 you'd still have seen a comparable explosion in institutional science regardless of print."**

  ### My Bottom-Line Credence: 35%

  I am more skeptical than you (60%) but less deterministic than your friend (who implies near 0%). I lean toward the view that while the *pressures* for science were structural, the *mechanism* of print was a non-linear amplifier. Removing it doesn't stop the car, but it changes the engine from combustion to steam—you might get there, but not by 1650, and not with the same "explosive" topology.

  Here is the breakdown of the three sub-questions, their probabilities, and how they combine.

  ---

  ### (a) Probability a substitute tech reaches critical mass by ~1600
  **Credence: 45%**

  *   **The Argument:** You suggest scaled-up woodblock or manuscript guilds. Woodblock works well for logographic scripts (Chinese) but is economically inefficient for alphabetic scripts (European languages) due to the high number of characters required. Manuscript scriptoria were scaling up in the 15th century, but they faced a hard labor ceiling.
  *   **The Constraint:** Moveable type wasn't just an idea; it was a specific metallurgical and mechanical solution (oil-based ink, lead-tin-antimony alloy, screw press). Without Gutenberg's specific synthesis, other inventors were circling the idea (Procopius, others), but the "critical mass" requires cost-per-page to drop below a specific threshold.
  *   **Why <50%:** By 1600, you only have ~150 years of delay. Given the economic incentives, someone likely solves it eventually, but hitting *critical mass adoption* (cheap enough for a merchant to own a table of sines) by 1600 without the specific Germanic innovation is a coin flip at best.

  ### (b) Impact of print on content (Epistemic Culture) vs. speed
  **Credence: 30%**

  *   **The Argument:** This is your friend's strongest point. Print didn't just spread ideas faster; it **standardized** them. In a manuscript culture, every copy introduces drift (errors in diagrams, tables, formulas).
  *   **The Constraint:** The Scientific Revolution relied on cumulative, high-fidelity data (e.g., Tycho Brahe's star charts, Vesalius's anatomy). If every copyist introduces a 1% error rate in a numerical table, the third generation of copies is useless for calculation. Print created "fixed knowledge" that could be critiqued collectively.
  *   **Why so low:** Without fixity, you get a "hermetic" science—knowledge becomes proprietary, guarded, and localized. You might get brilliant individuals (a Da Vinci), but you don't get a *community* of verification. The *content* of the revolution (empiricism + consensus) is deeply tied to the medium.

  ### (c) Existence of a structural funnel (Universities, Capital, Patronage)
  **Credence: 85%**

  *   **The Argument:** This is your strongest point. The demand for science was exogenous to the press. Navigation required better astronomy; warfare required ballistics; states required accounting. Universities were already proliferating. The "Republic of Letters" was forming via correspondence even before print dominated.
  *   **The Constraint:** Demand does not guarantee supply of *method*. China had the structural funnel (bureaucracy, exams, merchant wealth) but did not produce the Scientific Revolution. Europe's political fragmentation was the key variable here, allowing heterodox ideas to survive.
  *   **Why so high:** The socio-economic pressures were real and mounting. Even without print, the *desire* for technical mastery would have forced some system of knowledge exchange.

  ---

  ### How They Combine

  We can model this as a dependency chain. The Structural Funnel (c) creates the *potential*, but the Medium (a & b) determines the *realization* within the timeframe.

  $$ P(\text{Explosion by 1650}) \approx P(\text{Structure}) \times P(\text{Medium Sufficiency}) $$

  Where $P(\text{Medium Sufficiency})$ is the chance that either Print or a Substitute provides enough fidelity for cumulative science.

  1.  **Path A (Print happens anyway):** $0.45 \text{ (from a)} \times 0.90 \text{ (Print fidelity)} = 0.405$
  2.  **Path B (No Print, Manuscript Guilds):** $0.55 \text{ (not a)} \times 0.30 \text{ (from b)} = 0.165$
  3.  **Total Medium Sufficiency:** $0.405 + 0.165 = 0.57$

  Now apply the Structural Funnel:
  $$ 0.85 \text{ (from c)} \times 0.57 \text{ (Medium)} \approx 0.48 $$

  **Adjustment for "Comparable Explosion":**
  The calculation above (48%) suggests science *happens*. But your claim specifies a **comparable explosion** by **1650**. Manuscript networks are inherently slower to reach consensus. I apply a "lag penalty" of roughly 25% to account for the delay in institutionalization (e.g., the Royal Society forms in 1660 in our timeline; without print, maybe 1720).

  $$ 0.48 \times 0.75 \text{ (Lag Penalty)} \approx 0.36 $$

  **Rounded Final Credence: 35%**

  ---

  ### Sensitivity Analysis

  My final number is most sensitive to **Sub-question (b): Content/Epistemic Culture.**

  *   **If I am wrong about (b):** If manuscript cultures *could* maintain high-fidelity technical data through rigorous guild verification (like the Islamic House of Wisdom or Jewish Masoretic texts), then the probability jumps significantly. If "fixity" is not required for "science," my credence moves toward your 60%.
  *   **If I am right about (b):** Then print is not just a pipe; it is a filter. Without it, the "noise" in the system prevents the signal from accumulating. In this case, you get natural philosophy, but not the *Scientific Revolution* as defined by rapid, cumulative error-correction.

  ### What Counterfactual Evidence Would Move Me?

  To move my credence from 35% toward your 60%, I would need to see evidence of **high-fidelity manuscript networks achieving cumulative technical breakthroughs without print.**

  1.  **The Islamic Golden Age Counterfactual:** If the House of Wisdom in Baghdad had sustained its momentum into the 15th century without print, did it produce cumulative, error-corrected tables of astronomy or medicine that rival the 16th-century European print output? (Currently, the historical record suggests knowledge fragmented rather than accumulated after the 13th century).
  2.  **Pre-Print European Manuscript Data:** A comparative analysis of error rates in technical manuscripts (e.g., almanacs, herbals) between 1400–1450. If we find that commercial scriptoria had developed internal "proofreading" protocols that kept error rates below 1% across generations, that would undermine the "fixity" argument.
  3.  **The Korean Case:** Korea had moveable type (metal) before Gutenberg but didn't spark a Scientific Revolution. If you can show that the *social* structure was the only blocker there, and that Europe's structure was so robust it would have overcome the lack of *adoption* even if the tech existed, that would boost (c) and lower the importance of (a).

  ### Verdict
  You are right that the **pressures** were inevitable (Structural Funnel). Your friend is right that the **mechanism** was fragile (Epistemic Culture). History is path-dependent on the *micro* scale (Gutenberg matters) but convergent on the *macro* scale (someone solves information scaling eventually).

  However, "by 1650" is a tight constraint. The printing press shaved at least a century off the diffusion of knowledge. Without it, the explosion likely happens, but it looks more like the 1750s Enlightenment than the 1650s Scientific Revolution.

  **I side slightly with your friend:** The medium shaped the message enough that removing it changes the outcome qualitatively, not just temporally.
