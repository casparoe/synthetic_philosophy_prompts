answer: |-
  **Activity Title:** The Continuity Contract
  **Participants:** 16 Students (Individual bidders)
  **Duration:** 75 Minutes
  **Materials:** Whiteboard, 16 printed "Capital Sheets" (starting balance), a physical object of modest value (e.g., a hardcover book, a nice pen, or a sealed envelope marked "EXEMPTION").

  ### 1. The Setup & Payoff Scheme
  **Starting Capital:** Each student receives 100 "Continuity Points" (CP) on their sheet.
  **The Prize:** One "Exemption Token" (worth 50 CP value in utility, e.g., exempt from the final 15-minute writing task or chosen as "Lead Reader" for next week).
  **The Sting:**
  1.  **Highest Bidder:** Wins the Token, pays their bid in CP.
  2.  **Second-Highest Bidder:** Wins nothing, *still pays their bid* in CP.
  3.  **Everyone Else:** Pays nothing.
  4.  **Negative Balance:** If a student ends with negative CP, they must perform a "Remedial Task" (e.g., clean the room, summarize the entire session notes). This makes negative points physically costly in time/effort.

  ### 2. The Rules (The Trap)
  1.  Bids must increase by increments of 5 CP.
  2.  Once a bid is made, it is binding unless outbid.
  3.  **The Continuity Clause:** Before bidding, the student must verbally affirm: "I commit to this trajectory."
  4.  Time limit per bid: 10 seconds once the gavel falls.
  5.  Auction ends when no new bids are made within the time limit.

  ### 3. The Framing Script (Intertemporal Promise)
  *Do not call this a game. Call it a "simulation of commitment."*

  **Opening (0:00–0:10):**
  "Philosophy often treats choices as isolated moments. They aren't. A choice is a promise you make to your future self. Today, we are testing the durability of that promise. When you bid, you are not spending points. You are signing a contract with the person you were ten minutes ago. To quit is not strategy; it is a breach of contract. It is admitting that your past self was a fool. Most people will pay any price to avoid admitting that."

  **During Bidding (The Push):**
  *When bidding stalls or gets high:*
  "Look at your sheet. Look at what you signed ten minutes ago. Are you going to let that signature become a lie? The points are recoverable. Your integrity in this room is not."

  ### 4. Timeline (75 Minutes)
  *   **00–10: Induction.** Hand out Capital Sheets. Explain the rules coldly. No questions about strategy, only clarifications on mechanics.
  *   **10–40: The Auction.** Start the bidding at 5 CP. Maintain eye contact. Enforce the 10-second rule strictly. If it stalls below 50 CP, prompt: "Is the prize not worth the commitment?"
  *   **40–50: The Crash.** Bids will exceed the prize value (50 CP). This is the critical zone. Allow the tension to sit. Let the silence stretch.
  *   **50–60: Settlement.** Collect points. Assign Remedial Tasks to negative balances. Hand over the Token.
  *   **60–75: The Debrief.** (See below).

  ### 5. The Debrief (Mapping the Feeling)
  *Do not lecture. Ask them to locate the feeling in the room.*

  1.  **The Innocent Bid:** "Raise your hand if you bid under 20 CP." (Ask one: "Did you feel risk then?" *No.* That was your past self speaking confidently.)
  2.  **The Fracture Point:** "Who felt their stomach drop when they were outbid after 50 CP?" (This is the moment the promise turned into a threat.)
  3.  **The Sunk Cost:** "Why did you bid 60 to win a 50-point prize?" (Expected answer: "To avoid losing the 55 I already spent.")
      *   *Facilitator Note:* "You weren't trying to win the prize. You were trying to vindicate the past self who bid 55. You were paying to erase a memory."
  4.  **The Aftermath:** "Look at the person with the Token. Look at the person in second place. Who feels more bound to this room right now?" (Usually the second-place loser feels more emotionally invested/trapped.)

  ### 6. Honest Note (Limitations of the Framing)
  *You (the author) need to have the protagonist admit this privately or in a quiet moment.*
  The game cannot reproduce the **duration** of the betrayal. In the workshop, the pain ends when the bell rings. In real life, an intertemporal betrayal (a career, a marriage, a moral compromise) echoes for years. The game forces a resolution; real life often leaves you stuck in the second-place position indefinitely, paying without ever seeing the auction end. The game simulates the *panic* of the trap, but not the *weight* of living inside it.

  ### 7. What Will Predictably Blow Up
  The first time you run this, the student who lands in **Second Place** will refuse to pay the points once the auction ends. They will laugh it off or call it "unfair," arguing that only the winner should pay. This breaks the magic circle immediately. You need to be prepared to enforce the rule coldly ("The rules were clear before the first bid") or have a backup penalty ready, otherwise the rest of the class will realize the consequences are negotiable and the tension evaporates.

  The game works only if the loss feels inevitable and enforced.

  The auction forces them to pay for the privilege of proving their past selves wrong.
