answer: |-
  Imagine a small recurrent network in a standard lab, trained to predict rainfall from soil moisture sensors that occasionally go offline for weeks. During these input gaps, a specific cluster of neurons consistently activates in a graded pattern that correlates perfectly with the drought severity measured once sensors return, driving the network to lower its rainfall predictions despite zero new data. The realist points to this activity as a genuine internal model of "drought" because it maintains information about the world independently of immediate sensory causation, while the anti-realist insists it's merely a causal placeholder—a decaying echo of past inputs that happens to correlate with future outcomes but lacks any semantic content because nothing within the system or its training history assigns it meaning beyond minimizing loss.

  Here's how the split plays out. The realist verdict hinges on the idea that the network is *doing* something active during the silence; because the state persists without input and guides future action, it counts as a stand-in for the missing weather. The anti-realist says nah, it's just physics: the state is a lingering effect of prior data, like a spinning flywheel, and calling it a "representation" implies a level of intentionality that isn't there. The structural feature making this work is the **temporal decoupling**—the fact that the activity happens when the world is disconnected from the sensor. If you remove that gap and keep the sensors always on, the case collapses back into a standard input-output correlation debate; the neuron just looks like a filter for current data, and the realist loses their strongest evidence for an "internal model." Ultimately, this experiment shows that representational realism isn't vindicated by new data, but rather reveals the dispute is about explanatory utility: do we gain more by treating the state as a symbol or as a signal? An anti-realist defender would attack the setup by arguing the "gap" isn't truly decoupled anyway—the state is just a slow-decaying variable from the last known input, so there's no genuine "aboutness," just mathematical inertia masquerading as memory.
