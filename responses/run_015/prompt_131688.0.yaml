answer: |-
  Here is the translation of Ryle's framework into your stack, followed by the residue report on where the analogy breaks.

  ### The Distinction: Explicit Policy vs. Embedded Control

  **Knowing-That (Intellectualism):** In your terms, this is an agent relying on **explicit policy representations**. It's a system where action selection is treated as a query to a symbolic database or a high-level planner. The "intelligence" is located in the propositional content of the plan (e.g., a sequence of waypoints, a logic tree, or an analytically defined reward function). The assumption is that to act intelligently, the agent must first retrieve the correct rule or trajectory from memory or computation.

  **Knowing-How:** This is **model-free control** or deeply embedded **motor primitives**. It's a disposition to act correctly without querying a central database of rules. The "knowledge" is in the weights of the network or the mechanical impedance of the hardware. It manifests as stable **feedback loops** that correct errors online rather than pre-computing a perfect trajectory. It's the difference between having a dynamics model you can write down (Knowing-That) and having a controller that stabilizes a quadruped on gravel without explicitly identifying the friction coefficient (Knowing-How).

  ### The Regress Argument: The Latency Bottleneck

  Ryle's regress argument targets the Intellectualist claim that "Knowing-How is just applying Knowing-That."

  **The Philosophical Claim:** If every intelligent act requires contemplating a rule (Knowing-That) before executing it, you need a prior rule to tell you *how* to contemplate that first rule. This leads to an infinite chain of contemplation before any action occurs.

  **The Robotics Translation:** If every control timestep requires querying an **explicit policy representation** (e.g., "What is the optimal torque given the current state?"), you need a meta-controller to manage that query. If that meta-controller is also rule-based, it needs its own manager.
  In engineering terms, this creates a **latency** catastrophe. If you insert a symbolic planning layer between state observation and motor output for *every* primitive action, your control frequency drops below the stability threshold of your hardware. You cannot stabilize an inverted pendulum by running a symbolic solver at every 1ms timestep. To avoid the regress (and the crash), the low-level control must be "blind" to the high-level rules—it must be a reflex, a **motor primitive** executed without explicit deliberation. Therefore, skilled execution cannot essentially rely on explicit rule retrieval at the point of action.

  ***

  ### Residue Report

  Here is what survives the translation and what gets crushed by the hardware.

  #### 1. What Maps Cleanly
  The distinction maps almost perfectly onto the **planning vs. control** hierarchy, specifically regarding **generalisation gaps**.

  *   **The "Verbaliser" (Knowing-That):** This is your model-based MPC agent that can output a perfect trajectory in simulation but fails on hardware. It "knows" the dynamics equations (can verbalise the plan), but when faced with unmodelled friction or actuator lag, it diverges. It lacks the low-latency **feedback loops** required to handle the noise. It is "intelligent" on paper but incompetent in the world.
  *   **The "Actor" (Knowing-How):** This is your end-to-end RL policy. It walks smoothly over uneven terrain (high robustness, low latency) but if you ask it to output *why* it stepped there, or if you try to distill its policy into a decision tree, the performance collapses. The strategy is distributed across the network weights; it is not retrievable as a proposition.

  The regress argument validates why we use **hierarchical RL**. You cannot have a single explicit policy for everything. You need high-level goals (Knowing-That) to set parameters for low-level primitives (Knowing-How) that run faster than the communication bandwidth allows.

  #### 2. What Has to Be Distorted
  To make Ryle fit, we have to strip the *normative* weight from "intelligence."

  *   **Optimization vs. Understanding:** Ryle cared about whether an agent *understood* what it was doing. In robotics, a model-free agent doesn't "understand" the terrain; it just minimizes a loss function. We are equating "skill" with "convergence." A random walk that accidentally stabilizes looks like "Knowing-How" in Ryle's terms if you only look at input/output, but in robotics, we call that a reward hack.
  *   **The Nature of the Rule:** Ryle assumed rules were logical propositions. In robotics, an "explicit policy" might just be a large lookup table or a neural net we *interpret* as symbolic. If the "Knowing-That" is just a giant neural net that we force to output text, the distinction blurs. We distort the idea of a "rule" to mean "any separable computation graph," which weakens the philosophical bite.

  #### 3. What's Left Over (The Gap vs. The Fog)
  There is residue that your vocabulary cannot capture. It is not just philosophical fog; it points to a real architectural limitation in current embodied AI.

  *   **Normativity:** Ryle's distinction isn't just about latency; it's about *correctness conditions*. A robot can execute a motor primitive perfectly (Knowing-How) but be doing the wrong task entirely (e.g., polishing a bomb). Your vocabulary handles *reward shaping*, but reward is a scalar signal, not a reason. Ryle's "Knowing-How" implies a grasp of the *point* of the action, not just the success of the execution. We have no equivalent for "grasping the point" other than "maximizing cumulative return," which is insufficient.
  *   **Social Embedding:** Ryle's "Knowing-How" is often social (knowing how to joke, how to insult, how to cooperate). In robotics, we treat multi-agent systems as competitive or cooperative optimization problems. We miss the *conventional* aspect of skill. A robot might have perfect inverse dynamics but fail to hand over a tool because it doesn't "know how" to signal intent. This isn't a control problem; it's a semantic one.

  **Verdict:**
  The distinction **survives contact with engineering**, but it transforms from a logical category error into a **bandwidth and representation bottleneck**.

  The "gap" is real. It is the gap between **sample-efficient, interpretable planning** and **robust, high-frequency control**. We currently bridge this with hand-engineered interfaces (like action spaces for RL), not with a unified theory of agency. The "philosophical fog" is actually a placeholder for the fact that we don't know how to backpropagate semantic intent down to motor primitives without losing robustness. Ryle was right that you can't reduce the lower level to the upper level, but in robotics, that's not a metaphysical truth—it's a constraint on compute and differentiability.
