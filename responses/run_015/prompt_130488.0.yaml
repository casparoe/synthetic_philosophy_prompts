answer: |-
  ### The list

  1.  **Entrusted Power:** Corruption must involve power delegated for a public or organisational purpose, not private property rights. *Case:* Regulatory capture where no money changes hands but policy is bent for industry. *Tag:* Non-negotiable.
  2.  **Deviation from Duty:** The act must violate a formal rule or the informal spirit of the office, distinguishing corruption from mere policy choices. *Case:* A benefits-allocation model that follows every written rule but routes money to the minister's co-villagers. *Tag:* Non-negotiable.
  3.  **Private Gain:** There must be a benefit to the actor or their specific group, separating corruption from incompetence or ideological zeal. *Case:* Clientelist vote-buying versus ordinary constituency service where the politician takes nothing himself. *Tag:* Non-negotiable.
  4.  **Transparency Condition:** Acts hidden from scrutiny are presumptively corrupt; logged acts are presumptively safe. *Case:* The vendor gift logged in a register versus one slipped into a pocket. *Tag:* Preference (Universalist).
  5.  **Harm Requirement:** The act should cause net negative welfare or undermine institutional integrity to count as priority corruption. *Case:* The border fee that speeds up essential aid versus one that stalls it for extraction. *Tag:* Preference (Economist).
  6.  **Jurisdictional Baseline:** Standards generally follow the host country's laws unless they violate fundamental human rights, avoiding legal imperialism. *Case:* A firm from a strict regime paying in a lax one where small grease payments are legal. *Tag:* Non-negotiable.
  7.  **Gradability:** Corruption is a spectrum of severity, not a binary state, allowing for prioritisation of resources. *Case:* Small cultural gifts versus expensive contracts influencing procurement. *Tag:* Non-negotiable.
  8.  **Manufactured Obstacles:** Creating problems to sell solutions counts as corruption even if no existing rule is broken. *Case:* The clerk who invents a queue so you will pay to skip it. *Tag:* Non-negotiable.
  9.  **Intent Specification:** Distinguish between malicious gain and cultural obligation or survival necessity. *Case:* Nepotism in hiring versus hiring the only qualified relative in a small community. *Tag:* Preference (Universalist).
  10. **Systemic Context:** Evaluate acts against local normative structures, not just imported ethics, to determine if an act is 'corrupt' or 'obligatory'. *Case:* The border fee viewed as local etiquette versus bribery by headquarters. *Tag:* Preference (Anthropological).

  ### The collisions

  You cannot satisfy both the **Harm Requirement** (Economist) and the **Deviation from Duty** (Non-negotiable) simultaneously in all cases. 'Efficient corruption' exists where breaking a rule (duty) actually improves welfare (harm), such as bypassing a moribund bureaucracy to deliver food. If you prioritise welfare, you must excuse some rule-breaking; if you prioritise duty, you must condemn some welfare-enhancing acts. For governance work, you should drop the Harm Requirement. An NGO cannot reliably calculate net welfare in real-time, but it can audit adherence to duty.

  Secondly, the **Transparency Condition** (Universalist) clashes with the **Systemic Context** (Anthropological). In some locales, transparency itself is a violation of social trust, making the act corrupt by local standards even if open by yours. You must drop the idea that transparency is a sufficient defence. Logging a gift does not automatically sanitise it if the gift itself violates the Entrusted Power requirement. The Universalist desire for bright lines must yield to the Anthropological insight that visibility does not equal legitimacy.

  ### What it rules out

  The **Deviation from Duty** requirement does the heaviest lifting in excluding competing families of account. It rules out the **purely legalistic account** because duty encompasses the informal spirit of the office, catching the benefits-allocation model that follows written rules but violates public trust. It rules out the **welfare-and-efficiency account** because an act can be economically efficient yet still constitute a deviation from entrusted duty (e.g., the efficient border bribe). Finally, it rules out the **strong local-norms account** because 'duty' is defined by the entrusted role, not merely local custom; if the local norm requires violating the office's purpose (like the queue-clerk), it remains corrupt regardless of cultural acceptance. This single requirement ensures you are measuring fidelity to the role, not just legality, utility, or tradition.

  ### Applied to my two cases

  Regarding the **vendor gift**, the list suggests this is not corrupt. It satisfies the Transparency Condition (it was logged) and likely falls low on Gradability (assuming 'fairly expensive' isn't contract-swapping money). Crucially, if it did not influence the evaluation, there was no Deviation from Duty or Private Gain affecting the decision. It is a risk, but not an instance.

  Regarding the **border fee**, the verdict is mixed. If the fee is a Manufactured Obstacle (the clerk invented the delay), it is corrupt regardless of local norms. However, if it is a standard Systemic Context payment required to move goods where no alternative exists, and it causes no net Harm (aid flows), the Jurisdictional Baseline suggests treating it as a operational cost rather than prioritising it as corruption. The theory tells you to investigate the obstacle's origin, not just the payment's existence.
