prompt: |-
  Hi — I'm a backend engineer, no philosophy background beyond a few podcasts, and I've somehow ended up as the person a friend who works on governance stuff at an NGO argues with about definitions. Two real arguments set this off. First: a vendor sent our team fairly expensive gifts while we were evaluating them for a contract. Nobody thought it was a bribe, we logged it and moved on, but I couldn't say why it wasn't one, or at what point it would have been. Second: her field office paid a small "facilitation" fee to get a truck through a border crossing, and half her colleagues think that's obviously corrupt and half think calling it corrupt is just exporting one region's office etiquette to a place where gift and obligation are how anything moves at all. I keep reading definitions that say something like corruption is abuse of entrusted power for private gain, and they feel both too wide (loads of selfish acts by officials aren't corrupt) and too narrow (what about the politician who hands out targeted benefits to his own village and takes nothing himself?).

  So before I read any more actual theories, I want the spec: what would an account of corruption have to get right for me to accept it as adequate for her purposes, which is roughly "decide what to call corrupt, what to prioritise, and what to shut up about when we don't know the local norms." Please write the desiderata with the case or consideration behind each one, and tag each as either non-negotiable or a preference of one camp (I can guess the universalist/liberal camp wants one thing, the anthropological/local-meaning camp another, the economist-type welfare camp a third — tell me which of my demands are just someone's politics). Cases I want covered at a minimum: the vendor gift above; the border fee; clientelist vote-buying versus ordinary constituency service; nepotism in hiring; regulatory capture where no money changes hands; the clerk who invents a queue so you'll pay to skip it (here the wrong seems to be the manufactured obstacle, not any rule broken); and a benefits-allocation model that follows every written rule but routes money to the minister's co-villagers — I'd like a theory to be able to say something about that last one, since it's the version I actually build. Also: the written rule and the rule-as-applied drift apart in a lot of places, and I want to know whether "corrupt" should track the spec or the implementation, and whose baseline applies when a firm from one country pays in another (some legal systems apparently carve out small grease payments — is that something the theory has to accommodate, or explain away?). One more distinction I don't want collapsed: having the property at all versus how much of it, i.e. whether "corrupt" is gradable or on/off. Roughly 8–12 requirements is fine, and flag any pair you suspect can't be jointly satisfied.

  Give me it in four named sections, in this order: "The list" (about 700–900 words, numbered, each with its motivating case and a non-negotiable/preference tag, a table is fine); "The collisions" (about 200–300 words, the pairs of desiderata that can't both hold and what you'd drop); "What it rules out" (about 200 words, which single requirement does the most work excluding the three or four families of account people reach for — the rule/office one, the welfare-and-efficiency one, the local-norms one — one or two sentences each is plenty); and "Applied to my two cases" (about 150 words, run the list against the vendor gifts and the border fee and tell me what it says). British English throughout, please, and avoid anything that depends on looking something up — I want the argument, not the footnotes.
