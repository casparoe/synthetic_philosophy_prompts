answer: |-
  Subject: Plan for next week's Grice section

  Hi there,

  That sticking point from last time is actually the perfect place to start because it reveals that the students are treating meaning as a property of sentences rather than an action performed by agents. If they think inference excludes intention, they are assuming that meaning must be encoded like a cipher rather than recognized as a goal. To fix this, you absolutely need to lay the reflexive intention account down before you introduce the Cooperative Principle or the maxims. If you start with the maxims, you risk reinforcing the idea that implicature is just a logical deduction from norms, which feeds the view that it is merely something the hearer works out rather than something the speaker means. You need them to see first that for Grice, meaning non-naturally is constituted by the speaker's intention to produce an effect in the hearer by means of the recognition of that intention. Once that is in place, the Cooperative Principle and maxims should be presented not as the source of meaning but as the mechanism that allows the hearer to recognize the intention. The inference is the route to the meaning, not evidence of its absence.

  For the core example, stick with the philosophy job recommendation letter. It is superior to the garage example for your purposes because it carries the normative weight you need for the ending, and while you worried about cancellability, the social reality of that letter makes the implicature feel robust enough to combat the idea that it is just a fleeting inference. The key is to build the case slowly. Start by asking them what the writer said. They will likely quote the sentence about handwriting and English. Push them on whether that is all the writer said. When they say no, ask what else was said. They will want to say the writer said the candidate is no good at philosophy. This is where you head off the misconception that what is said is just the conventional meaning of the sentence. You need to show them that what is said includes reference fixing and disambiguation, but even with those fixed, the negative assessment is not part of what is said because it is not determined by the conventional meaning of the words plus reference. It is implicated.

  Once you have established that distinction, you can tackle the main confusion about whether it is meant. Ask them if the writer intended the committee to think the candidate is weak. They will say yes. Ask if the writer intended the committee to recognize that intention. They will say yes. Then point out that this fits their own definition of meaning from the first reading. The fact that the committee has to infer it via the maxim of quantity does not make it any less intended. You can head off the idea that implicature is just a softened assertion here by asking why the writer didn't just say the candidate is bad. If it were just cowardice, the meaning would be the same but the delivery different. But on the Gricean view, the writer is relying on the cooperative nature of the exchange to convey the message efficiently. The inference is not a workaround; it is the medium.

  You should definitely include the lying versus misleading wrinkle at the end. It does not undo the distinction; it validates it. If you have successfully shown that implicature is part of what is meant but distinct from what is said, this case shows why that gap matters. A speaker can assert something true while implicating something false, and we often judge this differently than asserting a falsehood. This keeps the distinction sharp rather than collapsing it. If they think implicature is just what is said in disguise, the moral difference vanishes. If they think it is unmeant inference, the speaker bears no responsibility. The Gricean middle ground is where the philosophical action is.

  For your closing question, avoid asking them to define implicature. Instead, pose a scenario where the intention and the uptake come apart. Ask them whether a speaker has implicated something if they intended the hearer to infer it but the hearer failed to make the inference, or conversely, if the hearer infers something the speaker never intended. This forces them to decide whether implicature lives in the speaker's mind, the hearer's mind, or the space between them. If they answer that the speaker still implicated it even if the hearer missed it, they understand that implicature is grounded in intention. If they say it only exists if the hearer gets it, they are still treating it as a causal effect rather than a communicative act. Either way, their answer will show you whether they have grasped the distinction or just memorized the vocabulary.

  Hope that helps structure the hour.

  Best,

  [Your Name]
