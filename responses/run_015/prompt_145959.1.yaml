  ***

  **Margin Comments**

  **Part (a)**

  > "By calling it a myth he means that it is literally meaningless: sentences like 'she has schizophrenia' have no cognitive content, they cannot be true or false..."

  **Comment:** This is incorrect. Szasz argues the term is a *category mistake* or a metaphor taken literally, not that it lacks truth conditions. He claims the statement is *false*, not meaningless.

  > "these categories are looping kinds: classify people as schizophrenic and they start to behave like it..."

  **Comment:** "Looping kinds" is Ian Hacking's concept (1990s), not Szasz's. Szasz discusses "rules of conduct" or "games." This is an anachronistic attribution.

  > "What psychiatric diagnoses really do is dress up moral disapproval as medicine..."

  **Comment:** Correct. This captures the "social control" aspect well.

  > "He did insist that he was not denying that people suffer; they have what he called problems in living."

  **Comment:** Correct. This is a necessary component of a charitable reconstruction.

  **Part (b)**

  > "If the lesion is eventually found, as it probably will be, then the diagnosis will after all name a real disease, and Szasz will have been wrong..."

  **Comment:** Right for a bad reason. Szasz's argument is partly conceptual regarding how we *use* language now; future discoveries don't necessarily validate current diagnostic categories.

  > "brain imaging already shows measurable differences... and that is precisely the kind of evidence he said would never turn up."

  **Comment:** Szasz demanded specific *pathology* causing the behavior, not statistical correlations in imaging. Equating the two overlooks his specific criterion.

  > "Once a lesion explains the behaviour there is nothing left to respect in the refusal."

  **Comment:** Major ethical error. Many conditions have lesions (e.g., epilepsy) but do not justify overriding patient autonomy. You have conflated explanation with justification for coercion.

  > "Notice that this also settles question (iii)."

  **Comment:** You have failed to keep the three questions separate. Future ontology (ii) does not automatically justify current practices (iii).

  **Part (c)**

  > "What Szasz's position implies is that Andrea should not be given psychiatric treatment at all."

  **Comment:** Incorrect. Szasz opposed *coerced* treatment. He supported consensual contractual therapy even if he believed the illness was a myth.

  > "Nothing he says is on the second track, and nothing could be, since the question of consent only gets a grip once you have granted that there is something here to consent to."

  **Comment:** Philosophically weak. One can consent or refuse intervention for a condition regardless of its ontological status (e.g., pregnancy, spiritual distress). Szasz argues the tracks *come apart*.

  > "The distinction doesn't really add anything. The myth thesis does all the work..."

  **Comment:** You are instructed to *use* the distinction to analyze the case. Dismissing the framework provided in the lecture fails the specific task of the question.

  > "if it stands, Andrea should simply be left alone."

  **Comment:** The practical conclusion is correct (Szasz would oppose commitment), but your reasoning ignores his arguments about liberty which hold even if the disease were real.

  ***

  **Note to TA: Regarding your colleague and Part (c)**

  You are right to be worried about Part (c); your colleague is likely grading based on the *outcome* rather than the *argument*.
  1.  **The Outcome:** The student correctly identifies that Szasz would oppose committing Andrea. This is likely why your colleague marked it "basically correct."
  2.  **The Argument:** The question explicitly asks the student to **use the two-track distinction** to determine if the conclusion depends on the "myth" thesis. The student explicitly argues that the distinction *adds nothing* and that the conclusion *does* depend entirely on the myth thesis.
  3.  **The Philosophy:** Standard Szasz interpretation (and presumably your lecture) holds that his argument against coercion is largely independent of the disease ontology (Track 2: Liberty/Contract vs. Track 1: Disease Status). Even if schizophrenia were a real disease, Szasz argues coercion is only justified for contagious physical diseases. The student misses this entirely.
  4.  **Verdict:** The student fails the specific theoretical constraint of the question. A mark of 2/7 reflects that they got the "what" right but the "why" and the "how" wrong.

  **Note on Question Design**

  The question is well-set and the student's errors are not due to ambiguity.
  *   **Part (a):** The prompt explicitly warns against defining myth as "a lie" or "a term with no meaning." The student ignored this constraint ("literally meaningless... no cognitive content").
  *   **Part (b):** The prompt explicitly lists "(i), (ii), (iii)" and asks to keep them separate. The student explicitly conflates them ("Notice that this also settles question (iii)").
  *   **Part (c):** The prompt explicitly says "Using the two-track distinction." The student says "The distinction doesn't really add anything."

