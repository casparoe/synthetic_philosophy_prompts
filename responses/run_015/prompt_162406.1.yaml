      *   *Candidate 1: Point 1 (Aesthetic Autonomy).* It's contradicted by the user's own reaction in Case B. It's also philosophically weak (Danto/Dickie's Institutional Theory vs. Bell's Formalism). If knowing the origin kills the aesthetic experience, then origin *is* part of the aesthetic object.
