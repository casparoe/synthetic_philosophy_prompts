      *   *Point 1 (Aesthetic Autonomy) vs. Point 5 (The "Search" Theory):*
          *   P1 says value depends on the *experience* of the object.
          *   P5 says value depends on the *process* (who did the searching/curating).
          *   *Tension:* High. P5 is a procedural definition of creativity, P1 is a consequentialist definition of art value.
          *   *Case B:* The viewer had the experience (P1 satisfied) but the process was lacking (P5 violated). The feeling vanished upon knowing the process. This suggests P1 is false; knowledge of process *does* affect the experience.

      *   *Point 2 (AI Non-Art) vs. Point 3 (Photography/Sampling Art):*
