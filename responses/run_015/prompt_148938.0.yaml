answer: |-
  Strict origin essentialism is biologically untenable, meaning your niece or nephew is fundamentally the same person regardless of mitochondrial donation, just as identity remains coherent even when an individual originates from multiple genetic sources. The intuition that you must come from one specific sperm and egg to be 'you' relies on a one-to-one mapping between zygote and person that nature frequently violates. Consider tetragametic chimerism, where two separate fertilised eggs, comprising genetic material from four distinct gametes, fuse early in development to form a single individual. If origin essentialism were true, this person could not exist as a unified entity, or we would have to arbitrarily declare one pair of gametes the 'real' origin while dismissing the other, yet the resulting human is undeniably one person with a singular consciousness. This demonstrates that personal identity can supervene on a composite genetic history rather than a unique singular origin, rendering the three-person genetics of mitochondrial replacement therapy a less radical variation of a naturally occurring phenomenon. Consequently, the child's identity is not diluted by the donor's mitochondria, as the essentialist requirement for an exclusive two-parent genetic origin is already disproven by chimeric existence.
