answer: |-
  Your octopus verdict stands and the beaver verdict holds if you define a tool as a detachable item not secreted by the agent, manipulated to facilitate a specific action, and remaining distinct from both the agent's bodily boundary and any fixed environmental structure.

  **The Principle, Clause by Clause**

  1.  **"Detachably external item"**: This excludes body parts and body secretions.
      *   *Earns:* The **Anglerfish lure** (body part) and **Archerfish water** (secretion/action) are out. The **Dolphin sponge** (found object) is in.
      *   *Saves:* Your **Spider web** verdict. Even though it's external, it is secreted by the body, making it an extension of physiology rather than an external object.

  2.  **"Manipulated to facilitate a specific action"**: This distinguishes instruments from passive environments. The object must be handled or positioned *during* the task, not just placed to create a condition.
      *   *Earns:* The **Chimp twig**, **Otter rock**, and **Vulture rock** are in because they are actively wielded or dropped to achieve an immediate result.
      *   *Saves:* Your **Octopus coconut** verdict. The octopus carries and stacks the shells *while* moving or resting; the shells are portable armor used during the act of existing in the open.
      *   *Kills:* The **Beaver dam**. The beaver builds the dam to alter the environment *so that* living becomes possible later; the dam is the stage, not the prop. The beaver does not manipulate the dam *while* hiding behind it.

  3.  **"Distinct from the agent's bodily boundary"**: This separates tools from clothing, prosthetics, or carried homes that become the agent's surface.
      *   *Earns:* The **Coat as pad** is in (it sits between hand and pan). The **Coat worn** is out (it becomes the body's surface).
      *   *Saves:* Your **Dolphin sponge** verdict. The sponge is clamped to the beak tip for abrasion protection during foraging, but it does not envelop the body or become a permanent surface.
      *   *Kills:* The **Hermit crab shell** (unlisted). It is detachable and external, but it functions as the crab's skin/house, integrating into its bodily boundary.

  4.  **"Distinct from any fixed environmental structure"**: This separates tools from architecture, nests, or habitat modifications.
      *   *Earns:* The **Chimp crates** and **Ladder** are in (portable aids). The **Nest plants** are out (they are incorporated into the nest architecture).
      *   *Saves:* Your **Nest plants** verdict. Even though detached and transferable, once placed, they become part of the fixed structure of the home, chemically modifying the location rather than instrumentally aiding an action.
      *   *Saves:* Your **Beaver dam** verdict (again). It is a fixed structure.

  **Unlisted Cases**

  *   **Hermit crab's borrowed shell:** Not a tool. It fails Clause 3 (Bodily Boundary). It is a portable home that substitutes for the crab's exoskeleton, making it clothing/housing rather than an instrument.
  *   **Prosthetic leg:** Not a tool. It fails Clause 3. It is integrated into the body schema and boundary, functioning as an organ substitute.
  *   **Elephant's fly-swatter branch:** Tool. Passes all clauses. Detachable, not secreted, manipulated for specific action (swatting), distinct from body and fixed structure.
  *   **Person using a chatbot:** Tool (metaphorically). It passes the logic: detachable (software instance), not secreted (external code), facilitates action (drafting), distinct from body/structure. However, it stretches "object," requiring you to accept digital artifacts as objects.

  **Web vs. Sponge Verdict**

  You do not have to give up either. The principle saves the **Sponge** (external object manipulated for action) and kills the **Web** (secreted structure). The web is physiologically produced and structurally fixed; the sponge is environmentally sourced and manipulatively held.

  **The Unsavable Verdicts**

  *   **"Chimp crates feels thinner":** This principle cannot save this intuition. Structurally, stacking crates is identical to stacking coconuts or twigs. The "thinness" you feel is likely about *naturalness* or *evolutionary history*, which this functional definition ignores. If you want to keep that hesitation, you need a separate clause about "wild vs. captive context," which muddies the ontology.
  *   **"Ladder was never the star":** This principle cannot capture "star status." A ladder is a tool by this definition, regardless of whether it's the focus of the story. That is a narrative judgment, not a categorical one.
  *   **Transferability:** You must give up your tentative principle that "someone else could pick up and use." As you noticed, **Nest plants** fail this test intuitively but pass it physically. The distinction isn't transferability; it's integration into a structure.
