  Longtime lurker (like, pre-2015 LessWrong lurker) finally asking for help with something personal instead of arguing about Sleeping Beauty.

  My dad is 68, lives alone since my mom died, and constantly *says* he wants more social contact — join the senior center, host his old colleagues, whatever. But whenever I actually arrange something, he finds a reason to bail, or shows up for 20 minutes and leaves looking exhausted. My sister's take: talk is cheap, behavior is the only real preference data, so leave him alone and stop pushing. That's the standard revealed-preferences line and I know it has force. But it doesn't fit the rest of the data — the few times he did go, he was visibly happier for days and brought it up unprompted, and he's genuinely miserable about being lonely when we talk on the phone.

  Also one thing that bugs me: basically every observation I have of him being social is a situation *I* set up. Maybe I'm not measuring his preferences for socializing at all, just his preferences about me hovering over him.

  So: is he irrationally failing to act on his own values, am I misreading the signal, or is "what he actually wants" just not a well-defined thing to be read off either his words or his behavior? And what should I actually do?

  Please structure your reply as: (1) "What the behavior evidences" (~150 words), (2) "Where that reading breaks down" (~150 words), (3) "What I'd do" (~150 words).
