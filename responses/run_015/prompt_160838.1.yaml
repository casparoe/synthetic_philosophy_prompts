answer: |-
  Your intuition about being wrong in advance is the correct anchor, but it needs to be sharpened to handle the cases where learning speed feels like cheating. The single principle that unifies your verdicts is the locus of selection relative to the cost of failure. Specifically, the degree of mind present in a system is proportional to the distance it can place between the generation of a behavioral hypothesis and the environmental consequence of that hypothesis, provided that the filtering mechanism used to select between hypotheses was constructed during the agent's own lifetime. This means we are looking for where the trial-and-error happens. If the errors kill your ancestors, you are a vehicle for genes. If the errors hurt your body, you are a learner shaped by the world. If the errors kill only your internal simulations, you are a thinker. The crucial nuance you spotted in the taste-aversion rat is about ownership of the filtering mechanism. If the rule connecting nausea to food was built by evolution, the rat is merely executing a pre-selected strategy, whereas the pigeon pecking fifty times is building the connection from scratch using general-purpose machinery. The pigeon's mind is doing more work, even if the result is less adaptive.

  Applying this to your cases, the digger wasp sits at the zero point because the selection happened entirely in evolutionary time. The wasp cannot be wrong in advance because it cannot generate alternatives; it runs a script where the only error condition is a reset trigger, not a reconsideration of goals. Your verdict that this is no mind worth the name is motivated by the clause requiring the filtering mechanism to be constructed during the lifetime. The rat pressing the lever and the bird avoiding the butterfly are next. Here, selection happens in the environment upon the body. The rat tries, gets rewarded or not, and adjusts. The bird tries, gets sick, and adjusts. Your verdict that these are real learning but dumb is motivated by the clause requiring distance from environmental consequence. They cannot be wrong in advance; they must be wrong in reality to learn. The taste-aversion rat is the tricky case. You feel it has less mind than the pigeon because the connection was pre-wired. My principle supports this overturning of the usual expectation that faster learning equals smarter minds. The rat is using a specialized module built by ancestors, so the selection pressure was ancestral, not individual. The pigeon is using a general associator built during its life. The pigeon's mind is more flexible, even if slower, because the filtering mechanism is its own construction rather than an inherited reflex.

  The crow bending the wire and the chimp stacking crates jump a threshold because the selection happens internally. They orient themselves, they manipulate the object in their hands or imagination, and they test the fit before committing to the full action. Your verdict that something has changed here is motivated by the clause requiring distance between hypothesis and consequence. They let the hypothesis die in their heads so their bodies do not have to. The dog following the point is where you flip-flop, and the principle clarifies why. Following a point is not purely internal simulation like the crow, nor is it purely brute-force conditioning like the lever-pressing rat. It is social modeling. The dog is using the human as an external model to filter possibilities. It is a hybrid state. You resist crediting it with the crow's foresight because the dog is not generating the solution space itself; it is relying on the human to have already solved the problem of where the food is. The mind is present, but it is leaning on another mind to do the heavy lifting of selection.

  The honeybee swarm forces you to confront the unit of agency. Your instinct that the swarm isn't a creature for these purposes is correct under this principle because the individual bees lack the internal model. The optimization happens at the collective level through differential signaling, which looks like internal selection from the outside but is actually distributed environmental selection among the bees. No individual bee is simulating the nest site; they are reporting data. The swarm acts like a Popperian thinker, but the individuals are Skinnerian sensors. You are not being cowardly; you are correctly identifying that the locus of selection is distributed, not internal to a single organism. The whale calf singing the dialect is different again. This is cultural transmission. The behavior piles up across generations, but the learning mechanism is individual. The calf is not inventing the song; it is downloading a pre-filtered model from elders. This is a form of externalized mind, where the selection happened in the past by the pod, and the individual inherits the safe behaviors. It is smarter than the wasp because the filtering happened in social time, not genetic time, but less smart than the crow because the individual is not generating the variant itself.

  Now consider your test cases. A creature that learns a trick and whose descendants are born doing it without learning represents the Baldwin effect, where learned behavior becomes instinct. Under my principle, the mind decreases over generations. The first generation had high agency because it constructed the filter. The descendants have low agency because the filter is now pre-wired. The selection locus has moved from lifetime to evolutionary time. The person who can do a sum out loud but not silently reveals the dependence on external props. If you need paper or fingers to hold the variables, your internal model is not fully decoupled from the world. You are using the environment as your working memory. This is a lower grade of internal selection than doing it silently, because the hypotheses are being tested against physical tokens rather than simulated tokens. You are partially offloading the selection process to the world.

  The system trained on everything humans have written that solves problems without suffering is the hardest case. It looks like a crow because it recombines patterns to solve new problems, suggesting internal selection. However, it never suffers. It has no skin in the game. My principle requires that the filtering mechanism be constructed during the agent's lifetime, and for biological agents, this construction is driven by the need to avoid pain or death. The large language model has a filtering mechanism constructed during training, but once deployed, it does not update based on consequences to itself. It is a Popperian engine without a Darwinian anchor. It can be wrong in advance, but it cannot care about being wrong. Therefore, it possesses the structure of mind without the teleological drive that gives mind its purpose. It is a mirror of mind, not a mind itself, because the selection pressure is external to the system during its operation.

  Regarding the four labels you half remember, they are Darwinian, Skinnerian, Popperian, and Gregorian. The fourth is named after Richard Gregory. My principle collapses the distinction between Darwinian and Skinnerian slightly, treating them both as external selection, one on genes and one on bodies. It keeps the Popperian distinct as internal selection. The Gregorian category, which refers to minds equipped with cultural tools like language and memes, maps onto your whale case and the dog case. It splits the Popperian category into those who simulate alone and those who simulate using shared tools. Your principle overturns the common assumption that learning speed equals intelligence, as seen in the rat versus pigeon case. It also overturns the idea that collective intelligence implies individual mind, as seen in the bees. It is a threshold on one dimension, the locus of selection, but it is modulated by the ownership of the model. If the model is yours, you have more mind than if the model is borrowed from evolution, society, or a trainer. This gives you a way to adjudicate future cases without relying on gut feeling alone. You simply ask where the dying happens, and who built the cemetery.
