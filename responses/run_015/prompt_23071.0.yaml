answer: |-
  **MEMORANDUM**

  **TO:** Board Members and Shareholders of [Co-op Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Bylaw Amendment on Voting Eligibility

  **Recommendation**
  I recommend that the cooperative **reject the proposed amendment** requiring a financial literacy test for voting on capital decisions. However, rejection should not mean inaction. Simultaneously, we must **adopt a mandatory "Informed Voting Protocol"** for major capital projects. This approach secures the financial safety the proponents seek without compromising the ownership rights the opponents defend.

  **The Valid Concern: Fiscal Responsibility**
  We must take seriously the proponents' central argument: *uninformed voting poses a genuine financial risk to the cooperative.* They are correct that the last two close votes were decided by members who admitted they had not reviewed the budget packets. When complex decisions regarding refinancing or capital improvements are made without a baseline understanding of the terms, the building pays the price in higher costs or deferred maintenance. The board has a fiduciary duty to ensure that decisions are made with due diligence. To dismiss this concern as merely "elitist" ignores the reality that our collective assets are being jeopardized by disengagement.

  **The Fatal Flaw: Gatekeeping Ownership**
  However, the proposed test is the wrong tool for this problem. The opponents' strongest argument is that voting is an inherent right of ownership, not a privilege granted by the board. In a cooperative, the distinction between owner and tenant is precisely the right to have a say in the property's governance.

  Creating a board-administered test introduces significant risks:
  1.  **Legal Liability:** Tying voting rights to a subjective test could expose the co-op to claims of discrimination or disparate impact.
  2.  **Board Overreach:** It grants the board the power to determine which opinions are "qualified," creating a conflict of interest when the board itself is seeking approval for its projects.
  3.  **Community Division:** It establishes a two-tier class of shareholders, eroding the trust necessary for a community to function.

  **The Concrete Alternative: An Informed Voting Protocol**
  We can solve the problem of *information* without restricting the right of *participation*. I propose we replace the amendment with the following protocol for all major capital votes:

  1.  **Mandatory Briefings:** A 30-minute town hall, led by an independent financial advisor (not management), must be held 48 hours before any major capital vote.
  2.  **Simplified Summaries:** A one-page "Plain English" summary of the financial impact must accompany every ballot, distinct from the full budget packet.
  3.  **Attestation:** Voters must sign a simple attestation confirming they have reviewed the summary or attended the briefing. This creates a moment of reflection without the barrier of a pass/fail exam.

  **Conclusion**
  The goal of this amendment is a financially literate membership, not an excluded one. By rejecting the test but adopting the Informed Voting Protocol, we honor the proponents' desire for fiscal prudence while upholding the opponents' principle of equal ownership. Let us invest in education, not exclusion.

  I urge you to vote **NO** on the current amendment and **YES** on the alternative protocol to be introduced at the next meeting.
