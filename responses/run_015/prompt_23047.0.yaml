      *   *Clarification:* Actually, the standard critique is: Many-Minds says "There is no big subject." Okay, fine. But there *is* a big brain reporting "I see red." The Quality problem asks: How do the micro-qualities inside the brain add up to the reportable quality "red"? Even if no one "owns" it collectively, the information processing of that quality requires a unified qualitative field. If the micro-qualities are isolated, how does the system access them as a whole?
      *   *Better phrasing:* The Quality problem is about *phenomenal blending*. Red + Blue = Purple. Proto-red + Proto-blue $\neq$ Purple. Many-Minds says "There is no Purple, just Proto-red and Proto-blue." But our experience *is* Purple. So Many-Minds contradicts introspection. That's why it doesn't solve the Quality problem—it just denies the data.

