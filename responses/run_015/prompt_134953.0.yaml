      *   **Task:** Argue for a *middle view*.
      *   **Key Thesis:** Panpsychism carries *minimal* ethical weight for fundamental processes, but ethical significance scales with an *integration-threshold model* (complexity/information).
      *   **Specific Concepts to Use:** Decoherence, entanglement, combination problem (framed as ethical scaling).
      *   **Specific Argument to Defend:** Treating every micro-experience as equally valuable breaks panpsychist ethics (makes deliberation impossible).
