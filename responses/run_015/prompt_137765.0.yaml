      *   *Refinement:* Renata is more right about the *category*. Yusuf is more right about the *catastrophe*. But the question asks who is more right in the *exchange*. Renata's arguments are more internally consistent regarding the function of law. Yusuf's arguments rely on expanding a tool until it breaks.
      *   *What are they missing?* They are missing the *victim's ontology*. They are arguing about the *label*, not the *loss*. They are also missing the concept of "Ethnocide" or "Cultural Genocide" as a separate, valid category that doesn't need to hijack "Genocide." They treat the word "Genocide" as the only currency of grief.
      *   *Which sub-question does the work?*
          1.  What the 1948 definition covers? (Legalism)
          2.  What destruction consists in? (Ontology)
          3.  What follows from naming? (Performativity)
          *   *Analysis:* Move 4 (Authenticity Tribunal) and Move 9 (Intent) are the heavy lifters. Move 4 addresses "What destruction consists in" (structure vs. headcount). Move 9 addresses "What the definition covers" (intent). Move 5/6/8 address "What follows from naming."
          *   *Verdict:* The third question (What follows from calling it by one name rather than another) does the most work. It drives the Old Woman's refusal (Move 10) and the debate about inflation vs. recognition (Moves 2, 5, 6, 8). The legal definition (1) is just the battlefield; the stakes are the *consequences of the name*.

  4.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the role (Referee). Set the tone (analytical, impartial but decisive).
