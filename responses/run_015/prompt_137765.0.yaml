      *   *(2) Renata:* Argues the *narrowness* is a feature, not a bug. Intent + Severity = Conviction power. "Inflation" dilutes the word's power to mobilize.
          *   *Assessment:* Pragmatically strong. Legally sound regarding the *dolus specialis* (specific intent). The "inflation" argument is a common critique in international law circles.
      *   *(3) Yusuf:* Hypothetical 2: Killing 2% (elites/keepers) vs. 10% (random). Structural destruction > Headcount. "In part" should mean "significant part structurally."
          *   *Assessment:* Legally plausible (ICTR/ICTY jurisprudence does consider "substantial part," sometimes qualitatively). Philosophically strong on what makes a group a group.
      *   *(4) Renata:* Concedes structural point in killing cases but rejects it for non-killing. Why? 1. Contingency (liability depends on victims' future choices). 2. Authenticity Tribunal (courts deciding who is "really" Salka).
          *   *Assessment:* Very strong legal point. The "Authenticity Tribunal" critique is profound. It highlights the danger of the law reifying identity.
      *   *(5) Yusuf:* Silence/Refusal to name is part of the erasure mechanism. If the law doesn't name it, the erasure is completed.
          *   *Assessment:* Sociologically/Philosophically strong. Highlights the performative power of law.
      *   *(6) Renata:* Debasement runs both ways. States misuse the term. Using it where legal triggers fail makes it useless for prosecution.
          *   *Assessment:* Pragmatically true. Political misuse of "genocide" is common.
      *   *(7) Yusuf:* Dilemma. Either it's a strict legal trigger (consequences irrelevant) OR it's advocacy (consequences matter). You can't have it both ways.
          *   *Assessment:* Logical trap. Forces a choice between legal positivism and moral realism.
      *   *(8) Renata:* Two registers. Legal term (indictment) vs. Moral vocabulary (headline). Homonyms.
          *   *Assessment:* Sophisticated. Allows for nuance. Acknowledges language functions differently in different contexts.
      *   *(9) The Wrinkle (Intent vs. Foresight):* State claims benign purpose (stop massacres). Renata: Purpose saves them (no intent to destroy). Yusuf: Purpose/foresight distinction is a shield; they chose dissolution *because* of who the Salka were ("as such").
          *   *Assessment:* This is the crux of *dolus specialis*. Renata leans on the "purpose-based" view of intent. Yusuf leans on the "knowledge-based" view (if you know it will destroy them and do it anyway because of who they are, that's intent). Yusuf is stronger here on the "as such" element.
      *   *(10) The Old Woman:* Yusuf: She refuses because the "camp paradigm" colonizes the word. Renata: She refuses because she knows bureaucratic injury is distinct from extermination; flattening it is an insult.
          *   *Assessment:* Both plausible psychological readings. Renata's respects the witness's specificity. Yusuf's respects the structural silence.

  3.  **Synthesize the Adjudication:**

      *   *Who is more right?* It's not a binary. Renata wins on *law* and *pragmatics*. Yusuf wins on *sociology* and *moral philosophy*. However, the prompt asks who is *more* right overall. Given the context is a Truth Commission (which sits between law and history), Yusuf's critique of the *limit* of the law is vital, but Renata's defense of the *integrity* of the law is necessary for the term to mean anything.
      *   *Decision:* Renata is more right about the *function* of the legal term. Yusuf is more right about the *reality* of the harm. But in a legal/truth commission setting, Renata's caution about the "Authenticity Tribunal" (Move 4) and the "Two Registers" (Move 8) are the most robust arguments. Yusuf's Move 9 (Intent) is his strongest, but Renata's Move 4 undermines his whole structural project.
