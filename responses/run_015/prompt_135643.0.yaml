answer: |-
  The workshop smelled of cold iron and the sharp, sweet tang of cutting fluid. It was a scent Elara associated with certainty. Metal removed was metal gone; a tolerance held was a truth kept. For forty years, she had built systems that obeyed the laws of thermodynamics, where energy was conserved and entropy always won. Now, in the quiet of her retirement, she was building something that sought to cheat the count.

  On the workbench sat the apparatus. It was not a lamp in the domestic sense, but a heavy-duty solenoid actuator mounted on a slab of granite to dampen vibration. The actuator drove a hardened steel lever, which snapped back and forth between two tungsten contacts. One contact completed a circuit; the other broke it. This circuit controlled the shutter of a cloud chamber sitting to the right, a glass eye waiting to witness the passage of a muon.

  The logic was simple, brutal, and impossible.

  Elara adjusted the micrometer on the camshaft. The cam was the heart of the machine. It was designed to drive the lever through a geometric series of intervals. One minute was the total duration. In the first thirty seconds, the lever would toggle once. In the next fifteen, twice. In the next seven and a half, thrice. The intervals halved, the frequency doubled, converging on the sixtieth second.

  Mathematically, the sequence was clear: $1/2 + 1/4 + 1/8... = 1$. The time would elapse.
  Physically, the sequence was a scream waiting to happen.

  She put on her ear protection and engaged the drive motor.

  At first, the sound was rhythmic. *Clack.* The lever struck the upper contact with a solid, metallic ring. The circuit closed; the cloud chamber shutter opened. *Clack.* The lever dropped. The circuit broke; the shutter slammed shut. The smell of ozone began to prick the air, the scent of electricity jumping gaps, of air ionizing between the separating metals.

  Thirty seconds in, the *clack-clack* became a steady cadence. Elara watched the oscilloscope tracing the voltage. Square waves, perfect and sharp. High, low, high, low.

  Forty-five seconds. The sound deepened, the individual strikes blurring into a buzz. The solenoid was heating up; she could feel the radiant warmth from three feet away. The machine was fighting its own inertia. To toggle twice as fast in half the time required exponentially more power. The motor whined, a rising pitch that pressed against Elara's sternum.

  Fifty seconds. The buzz became a hum. The lever was no longer visibly moving; it was a blur of silver, a vibration that shook the tools on the nearby rack. The tungsten contacts were glowing cherry-red at the edges. The oil in the gearboxes was smoking, thinning, losing its viscosity. The machine was approaching a physical singularity. Material limits were not mathematical ideals. Steel had fatigue; electricity had resistance.

  Fifty-nine seconds. The hum was a shriek. The air in the workshop tasted of burnt insulation. Elara's hand hovered over the emergency kill switch, not to stop the machine, but to save it from itself. But she didn't press it. She needed to see the limit.

  Sixty seconds.

  The motor cut out instantly, governed by the timer. The shriek vanished. The vibration ceased.

  Silence rushed back into the room, heavy and sudden. The only sound was the ticking of the cooling metal and the slow spin of the ventilation fan. Smoke curled lazily from the solenoid housing.

  Elara waited for her hearing to settle. She approached the bench. The lever was stationary. It had to be. It could not vibrate forever. It rested against one of the two stops.

  This was the knot she had come to untie. If the lever started in the 'off' position, and toggled once, it was 'on'. Twice, 'off'. Three times, 'on'. The state depends on the parity of the number of toggles. But the number of toggles was infinite. Infinity has no parity. It is neither even nor odd. Therefore, the final state of the lever was logically undefined.

  Yet, here it sat. Physical matter does not tolerate ambiguity. A switch cannot be half-open. A lever cannot rest in two places at once.

  Elara leaned in. The smell of hot oil was overpowering, masking the ozone. She looked at the lever. It was resting against the 'on' contact. The circuit was closed.

  She frowned. She had programmed the start position as 'off'. If the machine had functioned according to the sequence, the final state should be indeterminate. But the physical world had forced a resolution. Perhaps the inertia of the final movement had carried it to the 'on' side. Perhaps the welding of the contacts had frozen it.

  She needed to know if the state was real, or if the machinery had merely lied to her.

  She turned to the cloud chamber. The shutter mechanism was linked directly to the lever. If the lever was 'on', the shutter was open. If the shutter was open, the chamber was exposed to the background radiation of the room. If the lever was 'off', the chamber was shielded by lead.

  If the supertask had no consistent final state, then the shutter's position at $t=60$ was a contradiction. If the shutter's position was a contradiction, what did the quantum world see?

  Elara peered into the viewing port of the cloud chamber. The alcohol vapor inside was supersaturated, ready to condense along the ionization trail of any passing particle. She waited.

  A thin, white wisp formed in the center of the chamber. A track.

  A particle had passed through.

  This was not unusual. Background radiation was constant. But she checked the shielding log. With the shutter closed, the lead block should have attenuated the flux to near zero. A track should be statistically impossible if the lever was 'off'.

  But the lever was 'on'. So the shutter was open. So the track was expected.

  Elara exhaled, her breath fogging the glass slightly. It seemed the machine had resolved the paradox by brute force. The lever landed 'on'. The shutter opened. The particle passed. Causality held.

  She reached out to reset the counter, her finger brushing the cold steel of the workbench. Then she paused.

  She looked back at the lever. She looked at the contacts.

  There was a gap.

  Microscopic, but there. A hair's breadth of separation between the lever and the 'on' contact. The circuit was broken. The shutter should have been closed.

  But she had seen the track.

  She leaned closer, squinting. The lever was also not touching the 'off' contact. It sat in the neutral space between the two, suspended by the residual magnetism of the solenoid, or perhaps balanced on a burr of melted metal. It was neither open nor closed.

  In classical mechanics, this was a resting position. In the logic of the circuit, it was a null value.

  And yet, the cloud chamber had recorded a passage.

  Elara stood very still. The workshop was cooling around her, the metal contracting with soft pings. She realized then that the machine had not failed to solve the puzzle. It had solved it by demonstrating that the question was malformed. The infinite sequence did not converge to a state of 'on' or 'off'. It converged to a state of *contactlessness*.

  The supertask had consumed the binary nature of the switch. By forcing the lever to decide an infinite number of times in a finite span, she had eroded the definition of the positions themselves. The lever was no longer a switch; it was a vibrating string that had finally come to rest in a place that did not exist on the schematic.

  But the particle had passed.

  If the shutter was closed, the particle should have been blocked. If the shutter was open, it should have passed. If the shutter was neither, the particle should not have been able to define a path through the apparatus.

  Unless the ambiguity of the macroscopic switch had decohered the quantum event. Unless the lack of a definite final state in the machinery had allowed the particle to exist in a superposition of 'blocked' and 'passed', only collapsing into a track when Elara looked at it.

  She looked at the logbook on the bench. The pen lay waiting. She needed to record the result: *Track observed.*

  But to record it was to assert that the shutter was open. To assert the shutter was open was to assert the lever was 'on'. To assert the lever was 'on' was to lie about the physical reality sitting before her, balanced in the void between contacts.

  Elara picked up the pen. The weight of it felt unfamiliar, as if gravity had shifted slightly in the last minute. She understood now that the horror of the infinite was not that it went on forever, but that it had to stop. When the counting ceased, the universe had to choose a state, and sometimes, in the friction between the ideal and the real, it chose wrong.

  She wrote the time: *60 seconds.*
  She wrote the state: *Indeterminate.*
  She wrote the result: *Track.*

  She capped the pen. The smell of ozone lingered, sharp and electric, like the scent of a storm that had already struck but whose thunder had not yet arrived. The lever sat motionless, refusing to be either zero or one, while the white track in the glass faded slowly, dissolving back into the clear vapor, leaving no evidence that anything had passed through at all.
