answer: |-
  # Specification for Theories of Temporal Dynamics in Conscious Visual Experience

  ## 1. Phenomenological Coverage Requirements
  An adequate theory must account for the full range of temporal integration data, not merely the canonical illusion. The following cases constitute the test suite.

  *   **Standard Color Phi:** Two spatially distinct flashes (A then B) with different colors presented in rapid succession.
      *   *Requirement:* The theory must explain the report of a single object moving continuously between locations and changing color *mid-trajectory*, despite no stimulus existing at the intermediate location or time.
      *   *Status:* **Non-negotiable.** Failure here is falsification.
  *   **Ultra-Short ISI (Inter-Stimulus Interval):** The same stimuli as above, but the temporal gap is reduced below the threshold for apparent motion (e.g., <30ms).
      *   *Requirement:* The theory must explain the collapse of the motion illusion into simultaneity or flicker. It must specify the temporal integration window that differentiates this case from Standard Phi.
      *   *Status:* **Non-negotiable.** Defines the boundary conditions of postdiction.
  *   **Absent or Masked Second Stimulus:** Flash A is presented; Flash B is either omitted or masked heavily such that it is not consciously registered.
      *   *Requirement:* The theory must predict whether the motion/color-change experience persists. (If postdiction requires the second input to "fill in" the first, the illusion should vanish or degrade).
      *   *Status:* **Non-negotiable.** Tests the dependency of the past experience on future input.
  *   **Backward Masking of the First Stimulus:** Flash A, Flash B, followed immediately by a high-energy mask.
      *   *Requirement:* The theory must account for the disruption of the consolidation window. If the mask interrupts processing before the "revision" is complete, the report should reflect the un-revised state (or no state).
      *   *Status:* **Non-negotiable.** Tests the latency and duration of the revision mechanism.

  ## 2. Conceptual Distinction Requirements
  The theory must explicitly locate its claims within the following conceptual space. Ambiguity here constitutes a failure of specification.

  *   **Orwellian vs. Stalinesque Mechanism:**
      *   *Definition:* **Stalinesque** posits that the intermediate experience is constructed/edited *before* it enters conscious awareness (the "display" is doctored). **Orwellian** posits that the intermediate experience is one way (or non-existent), but memory/report is revised *after* the fact (the "history books" are doctored).
      *   *Requirement:* The theory must commit to one mechanism or provide a principled reason why the distinction is untenable.
      *   *Status:* **Non-negotiable** for mechanistic clarity, though some camps argue the distinction is **Preferred** to be dissolved.
  *   **Phenomenal Consciousness (P) vs. Access/Report (A):**
      *   *Requirement:* The theory must specify whether the "filling in" occurs at the level of *what it is like* (P) or *what can be reported/judged* (A). An Orwellian account typically locates the revision in A; a Stalinesque account typically locates it in P.
      *   *Status:* **Non-negotiable.** Collapsing P and A renders the theory incapable of addressing the "hard problem" aspects of the illusion.
  *   **Retrospective Revision vs. Present Judgment Bias:**
      *   *Requirement:* The theory must distinguish between altering the representation of the *past* interval versus generating a *current* judgment that implies a past without altering the past representation itself.
      *   *Status:* **Non-negotiable.** This determines whether consciousness is diachronic (extended in time) or punctate.
  *   **Diachronic Binding vs. Discrete Snapshot:**
      *   *Requirement:* The theory must state whether the experience of motion implies a genuine binding of states across time or a discrete reconstruction that mimics binding.
      *   *Status:* **Non-negotiable.** (See Section 5 for sharpening).

  ## 3. Empirical and Logical Constraints
  The theory must operate within the bounds of physical and biological plausibility.

  *   **Neural Latency Consistency:**
      *   *Requirement:* The timeline of processing (V1 arrival, feedback loops, consolidation) must align with known physiological latencies (e.g., ~40-100ms for conscious registration). Postdiction cannot imply neural signals traveling backward in physical time.
      *   *Status:* **Non-negotiable.**
  *   **Causal Ordering:**
      *   *Requirement:* While *phenomenal* time may be reordered, *neural* causal chains must remain forward-directed. The "future" stimulus influences the "past" experience only via standard forward-propagating neural delays that overlap in integration windows.
      *   *Status:* **Non-negotiable.**
  *   **Empirical Distinguishability:**
      *   *Requirement:* The theory must propose, in principle, a condition under which an Orwellian prediction diverges from a Stalinesque prediction. If both models predict identical reports and identical neural signatures under all conditions, the distinction is metaphysical, not scientific.
      *   *Status:* **Non-negotiable** for scientific validity, but often treated as a **Preference** by deflationary camps (who argue the distinction doesn't matter).

  ## 4. The Niche Constraint: Diachronic Binding and Substrate Continuity
  This criterion sharpens the requirement regarding temporal extension.

  *   **The Constraint:** The theory must specify whether diachronic binding (the experience of smooth motion) requires a **continuous neural substrate** active across the temporal interval, or whether **discrete, reconstructed snapshots** are sufficient to generate the phenomenology of continuity without detectable micro-gaps.
  *   **Motivation:** If experience is constructed postdictively from discrete samples, there is a risk of "temporal aliasing"—micro-gaps in phenomenology that should be detectable under high-frequency probing. If the phenomenology is truly smooth, the neural representation arguably requires overlapping, continuous activity (e.g., sustained firing or traveling waves) rather than discrete frame-updates.
  *   **Victory Condition:** A theory claiming discrete reconstruction must explain why the "frame rate" of consciousness is never perceived. A theory claiming continuous substrate must explain how this is maintained given the discrete nature of spiking and the latency gaps between stimulus onsets.
  *   **Status:** **Non-negotiable** for a complete account of the *quality* of the motion experience.

  ## 5. Identification of Jointly Unsatisfiable Requirements (Tensions)
  The following tensions indicate where a theory may be forced to abandon one desideratum to satisfy another.

  *   **Tension A: Privacy of Phenomenology vs. Empirical Distinguishability.**
      *   *Conflict:* To distinguish Orwellian from Stalinesque empirically, we need an objective marker of the "original" intermediate state. However, if phenomenal consciousness is inherently private and only accessible via report (which is subject to revision), we cannot access the "original" state to verify if it was overwritten.
      *   *Result:* A theory cannot simultaneously maintain that phenomenal states are strictly private *and* that the Orwellian/Stalinesque distinction is empirically decidable. One must yield: either we accept the distinction is metaphysical (untestable), or we accept that neural correlates can serve as proxies for phenomenal states (functionalism).
  *   **Tension B: Determinate Past vs. Postdictive Construction.**
      *   *Conflict:* If experience at $t_1$ is determined by input at $t_2$ (postdiction), there is no determinate fact about what was experienced at $t_1$ until $t_2$ occurs. This conflicts with the intuition that experience is "real-time."
      *   *Result:* A theory cannot maintain that experience is both fully determinate at the moment of occurrence *and* subject to postdictive revision. It must accept a "delayed consciousness" model (Stalinesque) or a "falsified memory" model (Orwellian).
  *   **Tension C: Discrete Snapshots vs. Continuous Phenomenology.**
      *   *Conflict:* If the brain processes in discrete windows (to allow for postdictive integration), the phenomenology should theoretically exhibit temporal granularity. Subjects do not report this granularity.
      *   *Result:* A theory cannot easily claim discrete processing windows *and* perfectly smooth phenomenology without positing a secondary smoothing mechanism that effectively recreates a continuous substrate, rendering the "discrete" claim functionally null.

  ## 6. Brief Model Evaluation Against Desiderata

  *   **Predictive-Processing Models:**
      *   *Performance:* High on Neural Latency and Causal Ordering (fits Bayesian updating). High on Phenomenological Coverage (explains filling-in as prior-driven).
      *   *Weakness:* Struggles with Empirical Distinguishability (O vs S). Often collapses the distinction into "precision-weighting of prediction errors," making it unclear if the revision is phenomenal or access-based. Often ambiguous on the Niche Constraint (discrete updates vs. continuous flow).
  *   **Strict Stalinesque (Cartesian Theater) Account:**
      *   *Performance:* High on Phenomenal Consciousness distinction (commits to edited experience). High on Diachronic Binding (posits a finished display).
      *   *Weakness:* Fails Neural Latency plausibility (requires a central place where "it all comes together" which contradicts distributed processing). Fails Empirical Distinguishability (hard to locate the "screen" neurally).
  *   **Pure Orwellian (Memory Revision) Account:**
      *   *Performance:* High on Causal Ordering (no backward causation, just false memory). High on Empirical Distinguishability (in principle, if one can measure pre-revision neural states).
      *   *Weakness:* Fails Phenomenological Adequacy (denies the reality of the experienced motion, calling it a memory error, which contradicts the subject's immediate experience of motion). Fails the Niche Constraint (implies discrete snapshots that are later stitched, risking the micro-gap problem).

  ## 7. Summary of Victory Conditions
  To "win," a theory must:
  1.  **Commit** to Orwellian or Stalinesque (or dissolve the distinction with argument).
  2.  **Explain** why Ultra-short ISI breaks the illusion without breaking the mechanism.
  3.  **Resolve** the Continuity Tension (explain smooth motion without magic continuous substrates or undetectable gaps).
  4.  **Propose** a test case where memory revision and perceptual revision yield different neural signatures.

  If a theory leaves the Orwellian/Stalinesque distinction undefined, or claims continuous phenomenology from discrete processing without explaining the aliasing solution, it fails the specification.
