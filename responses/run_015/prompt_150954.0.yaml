answer: |-
  Hume's *Political Discourses* rest upon a specific monetary ontology: money is a symbol of labour and commodities, valuable only by convention, yet requiring stability to function as a measure. His load-bearing commitments are threefold. First, the long-run neutrality of money: the absolute quantity of specie affects only nominal prices, not real industry or interest rates. Second, the short-run non-neutrality: a gradual increase in money stimulates industry because producers mistake nominal price rises for real demand increases before wages adjust. Third, the specie-flow mechanism: in an open economy with metallic money, trade balances self-correct via price levels; a deficit drains specie, lowering domestic prices and restoring competitiveness. Crucially, interest rates are determined by the supply of loanable capital and the profitability of commerce, not the money supply. Finally, Hume holds a profound suspicion of public credit, viewing funded debt as a precursor to high taxation, capital flight, or bankruptcy.

  The institutional premise anchoring these arguments is commodity money. Hume writes of a world where money is gold or silver, where banking is in its infancy, and where the state cannot easily manufacture liquidity. Remove the metallic anchor, and the specie-flow mechanism loses its automaticity; remove the limitation on credit creation, and the link between money and real resources frays.

  **Case 1: Quantitative Easing and Independent Central Banks**
  Hume would likely view QE with profound hostility. While an independent central bank was unimaginable to him, the monetisation of government debt recalls John Law's Mississippi Scheme, which Hume saw as a dangerous fiction. His objection would not be technical but political: expanding the balance sheet to purchase debt blurs the line between sovereign borrowing and money creation. In *Of Public Credit*, he argues that debt accumulation inevitably ends in bankruptcy or inflation. QE attempts to manage this tension, but for Hume, it merely delays the reckoning. Furthermore, since he believes interest is set by real capital, not money quantity, he would deem the policy ineffective at lowering long-term rates, viewing it instead as an inflationary tax on creditors. **[Underdetermined:]** Hume has no concept of a liquidity trap or a demand shortfall requiring monetary offset; attributing to him a view on 'stimulus' here requires assuming he prioritises price stability over employment, a concern he never formulated.

  **Case 2: Persistent Current-Account Deficits under Fiat**
  The specie-flow mechanism presupposes that money drain reduces the money supply, lowering prices. Under fiat with floating exchange rates, the adjustment occurs via the currency's external value, not the domestic price level. Hume's logic that 'no state can permanently drain... beyond its natural proportion' survives, but the mechanism changes. However, Hume would interrogate the *cause* of the deficit. If it stems from public debt financing consumption (as in *Of Public Credit*), he would predict collapse. If it reflects capital mobility and investment, he might be less concerned, provided the currency remains credible. **[Underdetermined:]** Hume assumes trade balances tend toward equilibrium; he does not account for structural imbalances sustained by reserve currency status, nor the distributional effects of exchange rate volatility on domestic industry.

  **Case 3: Cryptocurrency**
  Here Hume faces a dilemma. Crypto's fixed supply mimics the scarcity of specie, appealing to his fear of inflationary abuse. However, its value rests purely on convention without sovereign backing. In *Of Money*, Hume argues money's value is imaginary yet requires stability to measure value. A volatile asset fails as a standard. Moreover, crypto lacks the 'gradual increase' that Hume thinks animates industry; a deflationary currency hoards rather than circulates. He would likely view it as a speculative bubble akin to paper credit, lacking the 'truth' of metal but possessing none of the flexibility of managed fiat. **[Underdetermined:]** Hume treats money as a state-convention; an issuerless money falls outside his political framework, requiring us to invent a Humean view on private ordering of the monetary standard.

  **Case 4: Full-Reserve, Hard-Capped Fiat**
  This case isolates Hume's political fears from his monetary theory. A fixed-rule fiat currency prevents the 'abuse' of public credit and the inflationary temptation he dreaded, without requiring metal. Since money is neutral in the long run, the *type* of anchor matters less than the *certainty* of the rule. Hume might prefer this to discretionary management because it removes the temptation to fund debt via inflation. However, since he believes the quantity of money is of no consequence to real wealth, he might question the zeal for capping supply at all, provided the rule is stable. **[Underdetermined:]** This requires attributing to Hume a preference for rule-based governance over discretion, a constitutional concern implicit in his essays but not explicitly applied to monetary rules.

  **Tension 1: Neutrality vs. Stimulus**
  Is it inconsistent for money to be neutral long-run yet stimulative short-run? For Hume, no. The stimulus relies on friction and ignorance: workers and merchants do not immediately perceive the general price rise, labouring more under the illusion of higher reward. This gap survives only if expectations are backward-looking. In a world of rational expectations and sticky prices, the mechanism weakens; if agents anticipate the inflation, the real stimulus vanishes. Hume's apparatus survives only if we accept that policy operates through deception or lag, not through credible commitment.

  **Tension 2: Convention vs. Stability**
  Hume treats money as conventional, which should favour fiat or crypto. Yet he fears unanchored money invites fiscal abuse. The weight of his commitments falls on stability over ontology. Money must be a stable measure to facilitate commerce; if a convention is too easily manipulated by the sovereign (as with paper credit), it destroys the trust required for that convention to hold. Thus, he prefers metal not for its intrinsic value, but for its political incorruptibility. **[Underdetermined:]** Hume conflates price stability with fiscal probity; he does not distinguish between inflation caused by demand management and inflation caused by debt monetisation.

  **Conclusion**
  Hume's framework survives the change of institutions only partially. His realism about trade balances and the neutrality of money endures, but his mechanisms rely on metallic constraints he no longer possesses. His greatest contribution is the warning that monetary arrangements are ultimately political: they either restrain or enable the state's appetite for credit. In evaluating modern cases, a Humean analysis must flag where economic efficiency is secondary to political stability. **[Underdetermined:]** Ultimately, applying Hume to modern demand management requires inventing a target for him; he sought national power and stability, not full employment, and we must acknowledge that his silence on the latter is a gap we fill at our peril.
