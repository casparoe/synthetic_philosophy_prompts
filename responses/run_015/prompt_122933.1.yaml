answer: |-
  You have put your finger on the central nerve of the entire debate. Your observation is not a dud; it is the engine that drives the Measurement Problem. However, your suspicion that the classical analogy might neutralize it is also a standard move in the literature, and the reason it doesn't fully neutralize the problem is exactly where the "real disagreement" lives today.

  Here is the breakdown of what you have spotted, what it is called, and where the actual philosophical weight rests.

  ### 1. The Two Behaviours: Process 1 and Process 2
  You asked if there is a name for the two-speed behaviour. In the foundational literature, this is historically referred to as **Von Neumann's Process 1 and Process 2** (from his 1932 book *Mathematical Foundations of Quantum Mechanics*).

  *   **Process 2:** The unitary, deterministic, continuous evolution governed by the Schrödinger equation. As you noted, this looks "ontic." It behaves like a physical field propagating through time.
  *   **Process 1:** The non-unitary, stochastic, discontinuous change upon measurement (often called "collapse" or "reduction"). As you noted, this looks "epistemic." It behaves like a Bayesian update of a probability distribution upon receiving new data.

  Your insight that these two processes pull the ontology in opposite directions is precisely why the **Measurement Problem** exists. If the wavefunction ($\psi$) is a real physical thing, why does it suddenly jump based on what an experimenter knows? If it is just a catalog of knowledge, why does it obey a deterministic wave equation when no one is looking?

  Most interpretations of quantum mechanics can be categorized by how they try to eliminate one of these processes or explain it away:
  *   **Many Worlds (Everett):** Denies Process 1 exists. Everything is Process 2; "collapse" is an illusion of perspective. (Purely Ontic).
  *   **Bohmian Mechanics:** Denies $\psi$ is the whole story. There are particles (ontic) guided by the wave. Process 1 is just updating our knowledge of the particle positions. (Hybrid).
  *   **QBism / Relational QM:** Denies $\psi$ is ontic. It is purely a user's manual for betting. Process 2 is just how the betting odds evolve over time before a bet is settled. (Purely Epistemic).

  ### 2. The Classical Analogy: Is it a Red Herring?
  You asked: *"Spread an ordinary probability over the possible states of a gas... it gets carried along deterministically... and then it jumps when new data comes in. Having both a law of motion and an update rule doesn't mark the quantum object out as special."*

  This is a known argument, often used by defenders of the epistemic view (such as proponents of QBism or Spekkens' toy model). They argue: "Look, classical probability distributions ($\rho$ in phase space) also evolve deterministically (Liouville's equation) and update discontinuously (Bayesian conditionalization). So why is it weird for $\psi$ to do the same?"

  **Here is why this objection is powerful but ultimately insufficient:**

  In classical statistical mechanics, the probability distribution is *obviously* epistemic because we assume there is an underlying **ontic state** (the actual position and momentum of every molecule) that exists independently of the distribution. The Liouville equation describes the evolution of our *uncertainty* about that real state, not the evolution of the real state itself (which follows Hamilton's equations).

  If you apply this analogy to quantum mechanics, you are implicitly assuming **Hidden Variables**. You are assuming there is some "real state" underneath the wavefunction that we just don't know yet, and $\psi$ is just our probability distribution over those hidden states.

  **The Counter-Reply (Where the real disagreement lives):**
  The reason your reading group is still arguing weeks later is that we have strong mathematical reasons to believe you *cannot* treat $\psi$ exactly like a classical probability distribution over hidden variables. This is where your "One more thing" point becomes critical.

  ### 3. The Complex Amplitudes: The Smoking Gun
  You asked: *"The object isn't made of probabilities to begin with. You square it to get them, and its parts can cancel each other out... Does that belong to what I noticed above, or is a separate argument?"*

  This is not a separate argument; it is the reason the classical analogy fails. This is the **Superposition Principle** and **Interference**.

  In classical probability, if there are two paths to an outcome, the probabilities add: $P(A \text{ or } B) = P(A) + P(B)$.
  In quantum mechanics, the *amplitudes* add: $\psi(A \text{ or } B) = \psi(A) + \psi(B)$. When you square this to get probability, you get cross-terms (interference): $|\psi(A) + \psi(B)|^2 \neq |\psi(A)|^2 + |\psi(B)|^2$.

  **Why this matters for Ontic vs. Epistemic:**
  If $\psi$ were just a classical probability distribution (epistemic) over some underlying reality, interference shouldn't happen in the way it does. You should be able to model the system as "the particle is really in state $X$, we just don't know it."

  However, **Bell's Theorem** and the **Kochen-Specker Theorem** show that you cannot simply assume there is an underlying "real state" that behaves classically while $\psi$ just represents our knowledge of it, without accepting "spooky" non-local influences or contextuality.

  More recently, the **Pusey-Barrett-Rudolph (PBR) Theorem (2012)** directly addresses your specific worry. It attempts to prove that if you assume the quantum state is purely epistemic (like the classical gas probability), you make predictions that contradict standard quantum mechanics. The PBR theorem argues that distinct quantum states must correspond to distinct physical realities. In other words: *The wavefunction cannot be just a notebook; the notebook entries themselves must be physical properties.*

  (Note: The PBR theorem is not universally accepted as a knockout blow; epistemic defenders argue it relies on assumptions about how independent systems prepare states that might not hold. But it is the modern battleground.)

  ### 4. Summary: Where the Debate Actually Lives
  To answer your specific questions:

  1.  **Is there a name for the two-speed behaviour?**
      Yes, **Von Neumann's Process 1 vs. Process 2**, or broadly, the **Measurement Problem**. Your observation that they point to opposite ontologies is the standard motivation for the **Psi-Ontic vs. Psi-Epistemic** debate.

  2.  **Is the classical probability objection a known reply?**
      Yes. It is the core defense of the **Psi-Epistemic** view. The argument is: "Dual dynamics is a feature of information, not matter."

  3.  **Is it a dud?**
      It is not a dud, but it is incomplete. It works *only if* you are willing to accept that quantum mechanics is incomplete (i.e., there are hidden variables). If you believe quantum mechanics is a complete description of nature (the standard view), the classical analogy breaks because of **interference** and **entanglement**. Classical probabilities don't interfere; quantum amplitudes do.

  4.  **Where is the real disagreement living?**
      The debate has moved from "Does it have two dynamics?" (which everyone agrees it does) to **"Can an epistemic model reproduce interference and entanglement without becoming non-local or contextual?"**
      *   **The Ontic Camp** says: "No, theorems like PBR and Bell show $\psi$ must be real."
      *   **The Epistemic Camp** says: "Yes, but we have to give up classical intuitions about how 'knowledge' works (e.g., QBism says probabilities are subjective degrees of belief, not objective frequencies)."

  ### Verdict on your observation
  You have not spotted a red herring. You have spotted the **motivation** for the debate. The reason the debate persists is not because people haven't noticed the two dynamics look different; it's because neither side can fully explain *why* nature chooses that specific hybrid of "physical wave" and "knowledge update" without paying a heavy price (like infinite parallel universes, spooky action at a distance, or solipsism).

  Your crystallography background gives you an advantage here: you know that diffraction patterns (interference) are physical. You can't get a diffraction pattern by updating a notebook. The fact that $\psi$ produces diffraction patterns is the strongest evidence that it is ontic. The fact that $\psi$ collapses when you detect a photon is the strongest evidence that it is epistemic. Reconciling those two facts is the entire job description of a philosopher of physics.
