answer: |-
  Here is the audit. I am going to be blunt because you have three weeks.

  ### 1. The Equivocation (The Load-Bearing Crack)

  You are using "Expected Utility (EU) Maximisation" in two incompatible senses. This is almost certainly why your supervisor says they cannot tell what you are arguing for.

  *   **Sense A (Formal):** A representation theorem requiring Completeness, Transitivity, Continuity, and Independence (von Neumann–Morgenstern or Savage).
  *   **Sense B (Heuristic):** A loose commitment to weighing probabilities against values to make coherent choices.

  Your commitment (1) claims to defend EU. Your commitments (2), (3), (4), and (5) explicitly reject the axioms required for Sense A.
  *   (2) denies Completeness and Independence.
  *   (3) denies the Continuity/Unboundedness required for standard EU (without the bounded fix you reject).
  *   (5) denies the Good-Turing-Blackwell Value of Information theorem, which holds for all Sense A agents.

  **Verdict:** You cannot write a chapter titled "Why anyone should expected-utility maximise" while holding (2)–(6). You are arguing for a **non-EU theory of pragmatic coherence**. If you try to defend EU while denying its axioms, you will look confused. If you argue for *Pragmatic Coherence* (which looks like EU in simple cases but diverges in complex ones), you have a coherent, albeit heterodox, position.

  **Confidence:** High. This is a definitional contradiction, not a philosophical nuance.

  ---

  ### 2. Ranked Tensions in the Commitments

  Here are the internal conflicts within your proposed view, ranked by severity.

  #### **Severity 1: The Pragmatic Justification vs. The Axiomatic Rejection (1 vs. 2)**
  *   **The Tension:** You claim (1) the only good arguments for EU are pragmatic (money pumps), but (2) those arguments only establish acyclicity and resoluteness, not Completeness or Independence. If (2) is true, (1) cannot support the conclusion "one should EU maximise." It supports "one should be a resolute planner."
  *   **What must give:** You must abandon the claim that pragmatic arguments justify *EU*. They justify *Planning Agency*.
  *   **Cost:** You lose the standard label. You are no longer in the business of defending EU; you are in the business of defending a specific model of diachronic agency (likely Resolute Choice à la McClennen or Bratman).
  *   **Confidence:** High. Standard money-pump arguments (e.g., Gustafsson) aim to derive transitivity and acyclicity. Deriving Independence pragmatically is notoriously difficult without assuming separability, which you seem to reject in (4).

  #### **Severity 2: Instrumentalism vs. Anti-Fanaticism (1 vs. 3)**
  *   **The Tension:** (1) says normativity is purely instrumental (coherence to satisfy desires). (3) says it is rational to reject a gamble with higher expected utility (the astronomical good) for a sure thing. In standard instrumentalism, if you prefer the astronomical good *at all*, the tiny chance dominates the small cost. To reject this without bounded utility (which you reject as ad hoc) requires a structural change to how utility aggregates (e.g., Risk-Weighted EU).
  *   **What must give:** You must abandon pure instrumentalism regarding the *structure* of preference. You need a view where the *distribution* of risk matters, not just the weighted sum.
  *   **Cost:** You move away from Humean instrumentalism. You are positing a substantive rational requirement on how risks are weighed, not just that means fit ends.
  *   **Confidence:** Medium-High. Sensible decision theorists disagree here. Some (e.g., Buchak) argue Risk-Weighted EU is still instrumental. Others argue it introduces a new normative value (security) alongside utility.

  #### **Severity 3: Information Aversion vs. Pragmatic Coherence (5 vs. 1)**
  *   **The Tension:** (5) permits paying to avoid information. (1) demands pragmatic coherence. In standard models, paying to avoid free information makes you vulnerable to a money pump *if* your preferences are dynamically inconsistent. You can only avoid the pump if you are a *resolute* chooser (binding your future self).
  *   **What must give:** You must lean heavily on Resolute Choice. You cannot be a "sophisticated" chooser (who anticipates future deviation); you must be "resolute" (who forces future compliance).
  *   **Cost:** Resolute Choice is controversial. Critics argue it amounts to irrational stubbornness (ignoring new evidence about your own preferences). You need a defence of why binding oneself against future rational deliberation is coherent.
  *   **Confidence:** Medium. This is a live debate in dynamic choice theory (McClennen vs. Sobel).

  #### **Severity 4: Imprecise Credences vs. Dutch Books (6 vs. 1)**
  *   **The Tension:** (6) allows imprecise credences. (1) relies on Dutch Book arguments. Standard Dutch Book arguments force precise credences. If you have imprecise credences and use a standard decision rule (like MaxMin), you can be money-pumped.
  *   **What must give:** You need a specific decision rule for imprecise probabilities that is immune to Dutch Books (e.g., E-admissibility with a specific tie-breaking rule, or a defence that Dutch Books don't apply to imprecise agents).
  *   **Cost:** This requires technical machinery. You cannot just say "ranges are fine." You must specify how you choose between options when ranges overlap.
  *   **Confidence:** High. This is a technical constraint. Imprecise probability without a robust decision rule is vulnerable to exploitation.

  ---

  ### 3. The Single Revision

  **Stop defending Expected Utility Maximisation.**

  Your most comfortable revision is likely to keep the title and fudge the definitions. The **most effective revision** for the review is to reframe the chapter thesis entirely.

  **New Thesis:** "Rationality requires diachronic pragmatic coherence (planning), which typically approximates Expected Utility but permits deviations in cases of ambiguity, extreme risk, and information aversion."

  **Why this cleans up the most:**
  1.  **Resolves (1) & (2):** It accepts that pragmatic arguments yield Planning, not EU.
  2.  **Accommodates (3), (4), (5):** These become features of the "permitted deviations," not bugs in the EU calculation.
  3.  **Accommodates (6):** Imprecise credences fit naturally into a planning framework where precision is not required for coherence.
  4.  **Satisfies Supervisor:** It tells them exactly what you are arguing for: a **Planning-Based Coherence View**.

  **Is the leftover recognisable?**
  Yes. It resembles a hybrid of **Levi's Imprecise Probabilities**, **McClennen's Resolute Choice**, and **Buchak's Risk-Weighted Utility**. It is a recognised (though minority) position in decision theory. It is not a "pile of excuses"; it is a structured alternative to orthodoxy.

  ---

  ### 4. Confidence and Disagreement Flags

  *   **On (3) Anti-Fanaticism:** I am **genuinely unsure** if you can sustain this without bounded utility *or* Risk-Weighted EU. If you reject both bounded utility and Risk-Weighting, you may lack the formal machinery to block fanaticism. Sensible decision theorists (e.g., Beckstead, Thorpe) will argue your view collapses without one of these.
  *   **On (5) Information Aversion:** Sensible decision theorists disagree on whether this is rational. Orthodox theory says it is irrational. You need to explicitly argue *why* the orthodox "Value of Information" theorem fails in your framework (likely because it assumes separability or precise credences).
  *   **On (2) Resolute Choice:** Many philosophers (e.g., Sobel, Goldstein) argue Resolute Choice is dynamically inconsistent and therefore irrational. You are taking a side in a heated debate. Do not present it as settled.

  ### Summary for the Review
  If you walk in saying "I'm defending EU," you will be torn apart because your commitments deny EU axioms. If you walk in saying "I'm defending a Pragmatic Planning view that explains why EU works mostly but fails in specific high-stakes/ambiguous cases," your commitments (1)–(6) form a coherent, defensible package.

  **Action:** Change the chapter title. Change the introduction. Keep the commitments.
