answer: |-
  **Project Title:** The Architecture of the Ideal Self: Domain Fragmentation in Indirect Normativity

  **1. Introduction and Problem Statement**
  Indirect normative theories ground an agent's practical reasons not in the objective value of actions, but in the hypothetical advice or endorsement of an improved version of that agent. Under this framework, what I have reason to do is determined by what I would want myself to do were I fully informed, rationally coherent, and affectively stable. The standard debate surrounding this framework focuses on the specification of the idealization: if the ideal conditions are fully specified, the theory allegedly collapses into direct normativity (where reasons are fixed by objective values); if left unspecified, the theory remains empty of guidance.

  This proposal shifts attention from the *content* of the idealization to its *structural unity*. Standard models presuppose a globally unified idealized deliberator—a single counterpart who advises on all matters, moral, prudential, and epistemic alike. However, it is unclear whether this unity is a substantive normative commitment or a hidden presupposition. This project investigates whether indirect normativity can tolerate *domain-fragmented idealization*, wherein the structurally improved self governing moral choice differs from the self governing prudential or epistemic choice.

  **2. Research Question**
  The central research question is stated as follows: **Does domain-fragmented idealization preserve the distinctive explanatory power of indirect normativity, or does it reduce the view to a cluster of direct, domain-specific theories?**

  This question admits a determinate answer. Either (a) fragmentation allows indirect normativity to avoid collapse while maintaining normative force, or (b) fragmentation severs the link between the agent and the ideal deliberator such that the theory becomes extensionally equivalent to direct realism, or (c) fragmentation generates incoherence due to the lack of a non-arbitrary criterion for partitioning domains. The project aims to determine which of these outcomes is logically necessary given the constraints of idealization.

  **3. Background and Gap in Literature**
  Existing discussions of indirect normativity and internal reasons typically assume a single idealized agent without arguing that unity across practical domains is a substantive normative commitment. Proponents of ideal advisor theories generally treat "full information and rationality" as global properties applicable to the agent simpliciter. Consequently, the literature leaves open whether the ideal self must be a unified locus of agency or if it functions merely as a heuristic device for accessing domain-specific truths.

  Similarly, debates regarding the unity of practical reason often focus on conflict resolution between competing reasons rather than the architectural structure of the deliberator generating those reasons. By treating the unity of the ideal self as a given, current models fail to account for the possibility that the cognitive and affective modifications required for moral idealization might be incompatible with those required for prudential idealization. This project fills that gap by treating the unity of the ideal deliberator as a variable rather than a constant.

  **4. Methodology**
  The method consists of a conceptual analysis of the constraints on idealization applied separately to three normative domains: moral, prudential, and epistemic. I will analyze three specific constraints:
  1.  **Rational Coherence:** Whether coherence requirements in one domain (e.g., impartiality in morality) contradict coherence requirements in another (e.g., partiality in prudence).
  2.  **Information Access:** Whether "full information" entails different cognitive states depending on the domain (e.g., emotional engagement for moral facts vs. detachment for epistemic facts).
  3.  **Affective Stability:** Whether the motivational profile of the ideal moral self is compatible with the ideal prudential self.

  Following this analysis, I will construct a dilemma argument. If the constraints are domain-specific, I will test whether the resulting fragmented selves can still be identified as "the agent." If they cannot, the theory loses its internalist appeal. If they can, I will test whether the advice of these fragmented selves diverges from direct normative truths.

  **5. Possible Conclusions and Deciding Considerations**
  There are two main possible conclusions.
  *   **Conclusion A (Viability):** Domain fragmentation is viable. Indirect normativity remains genuinely indirect because the normative force derives from the *structural relation* of idealization, even if the ideal self is fragmented. This holds if there is a higher-order unity in the agent's capacity to recognize the authority of different ideal selves.
  *   **Conclusion B (Reduction/Incoherence):** Domain fragmentation fails. This holds if the criteria for partitioning domains are arbitrary, or if the fragmented ideal selves cease to represent the agent's interests, thereby reducing the theory to a disguised form of direct realism (where "what my ideal moral self wants" just means "what is morally good").

  The consideration that will decide between them is the **Identification Condition**. If the actual agent cannot identify with the fragmented ideal selves as *their own* improved versions, the theory collapses into direct normativity. If the agent can identify with them via a higher-order endorsement, fragmentation is viable.

  **6. Deliverables**
  The primary deliverable will be a paper suitable for a workshop or dissertation chapter. It will include:
  1.  **A Taxonomy of Fragmentation Types:** Distinguishing between weak fragmentation (different advice from the same self) and strong fragmentation (different selves for different domains).
  2.  **A Criterion for Genuine Indirectness:** A test to determine when an idealization framework has ceased to be indirect and become a direct normative theory in disguise.

  **7. Scope and Feasibility Assessment**
  This project is tractable for a single semester because it limits its scope to the *structural logic* of indirect normativity rather than attempting to solve substantive normative conflicts. I will not attempt to define the correct moral or prudential norms, but only to analyze the relationship between the agent and the ideal deliberator.

  However, there is a risk of failure if the project drifts into the general problem of normative unity across all practical domains. To mitigate this, I will restrict the analysis to the *conditions of idealization* rather than the *outputs* of deliberation. The goal is not to solve the conflict between morality and prudence, but to determine whether indirect normativity can structurally accommodate such conflicts without collapsing. Specific references to relevant positions and arguments will be added separately in the final draft.
