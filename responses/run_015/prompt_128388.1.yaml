answer: |-
  The principle is: **Every autonomous subject of coercive law holds an equal intrinsic claim to political agency, which may be voluntarily delegated but never administratively weighted or permanently restricted based on state assessment.**

  The first clause ("autonomous subject of coercive law") motivates your inclusion of prisoners and non-citizen municipal residents (both coerced) while permitting the exclusion of sixteen-year-olds (legally non-autonomous), though this verdict hinges entirely on where you draw the line of autonomy. The second clause ("equal intrinsic claim... never administratively weighted") motivates your rejection of competence scoring; the state cannot rank civic worth. The third clause ("may be voluntarily delegated") motivates your acceptance of delegable voting; inequality is permissible only when it emerges from consensual transfer between agents, not state fiat. The proviso ("never... permanently restricted") motivates your split on civics tests: a bare test is a permanent barrier based on assessment, while a test with a paid course and retakes is capacity-building with a remedy, not a stratification mechanism.

  This principle accommodates all your listed verdicts, provided you accept that legal adulthood is a valid proxy for political autonomy; if you define autonomy strictly as the capacity to understand coercion, the exclusion of sixteen-year-olds becomes the verdict you must give up.

  Running this on your new cases: **Citizens resident abroad** generally lack subjection to coercive law (no local taxes, policing, or zoning), so the principle denies them a vote unless specific national laws (like taxation) bind them. **Decisions affecting the unborn** cannot include those people as voters since they are not yet subjects of coercion; instead, the principle mandates that current voters act as trustees, perhaps enforced by constitutional constraints rather than ballot weighting. **An systematically misinformed electorate** cannot be corrected by weighting votes (administrative grading) or silencing sources (violates autonomy); the principle forces you toward sortition (deliberative bodies briefed by advocates) or encourages voluntary delegation to trusted informants.

  Regarding your wavering case—**non-citizen residents voting for a national delegate**—the principle dictates they **must vote** if national laws (taxes, criminal code, draft) coerce them. The objection that they "lack knowledge" is a competence argument, which the principle explicitly forbids as a basis for exclusion or weighting. To mitigate the risk of uninformed voting without violating the principle, you should implement delegable voting, allowing them to transfer their vote to informed neighbors, or sortition, ensuring their interests are briefed deliberatively.
