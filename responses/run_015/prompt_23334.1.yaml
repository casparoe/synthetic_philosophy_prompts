          3.  If I don't fear death in branching (where identity fails), then identity wasn't doing the work in my concern. *Continuity* was.
          4.  Therefore, in the destruction case, the lack of branching doesn't restore identity, but it keeps the thing that actually mattered (Continuity).
          5.  *Rational Care:* Why care? Because the boundary between "me" and "you" is less deep than we think. It's a spectrum. Caring about my future self is already caring about a psychologically connected being. The copy is just *more* connected than my future self usually is (perfect memory transfer).
          6.  *Addressing the "Subject":* There is no "further fact" subject. There is just a brain and a psyche. If that continues, what is there to lose?

