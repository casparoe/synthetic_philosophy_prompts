  10. **Final Polish:** Ensure the distinction between *ontological status* (is it real?) and *ethical status* (does it matter?) is clear. The lawyer conflates them. The philosopher must separate them.

  *(Self-Correction during drafting)*: I initially thought about suggesting "Real Estate" as the best analogy. But "Institutional Facts" is more philosophically robust for a metaphysician. I'll use Searle's "Status Functions." Also, need to make sure I don't give legal advice, but policy advice based on ethical reasoning.

  *(Refining the "Ghost Coat")*: The prompt says the coat appears as a "ghost." This is crucial. It's a *monument* now. The function is lost, the memory remains. This is like a ruined building. It supports the "Institutional Object" theory.

