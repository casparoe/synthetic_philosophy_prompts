answer: |-
  **TO:** Programs Committee, Halstead Trust
  **FROM:** Secretary, Programs Committee
  **DATE:** October 15, 2023
  **SUBJECT:** Recommendation on Proposal P-14

  This memo serves to break the deadlock on Proposal P-14. We are divided three to three. A compromise that splits the difference on every item will result in no decision, which is itself a decision to maintain the status quo. Given the moral stakes and the fiduciary duties outlined in our deed, status quo inertia is unacceptable. I recommend we adopt a package that maximizes impact within the constraints of institutional survival and legal compliance.

  **1. Recommendations**

  **(a) Portfolio Maximization:** Adopt with conditions. We will commit the annual payout to the highest-ranked interventions, subject to a hard cap: no more than 60 percent of the payout may be granted outside the county, per counsel's advice on the geographic restriction. The remaining 40 percent must be granted within the county, even if cost-effectiveness scores are lower.
  *Timeline:* Effective immediately for the next fiscal cycle.

  **(b) Discretionary Review:** Adopt in part. The unrestricted small-grants window ($250,000) and the professional development budget ($180,000) will be reallocated to the global portfolio, as these do not meet the threshold for operational necessity. However, the office lease ($410,000) and salary band ($260,000) will be retained. Cutting these threatens recruitment and retention to a degree that endangers our capacity to deploy capital effectively.
  *Timeline:* Reallocation of grants and development budget effective next fiscal year; salary and lease review scheduled for 12 months.

  **(c) Spend-down Study:** Reject. The letter of wishes expresses a clear intent for perpetuity. While the moral argument for spend-down is potent, the deed does not authorize dissolution, and the legal risk of challenging perpetuity outweighs the theoretical benefit at this time.
  *Timeline:* N/A.

  **2. The Arithmetic**

  We must be plain about the numbers. The $1.1 million identified for potential reallocation in Proposal P-14(b) represents a specific moral quantity. If redirected to our best global interventions at $50 per disability-adjusted life year (DALY) averted, this sum generates 22,000 DALYs annually. Using a conservative conversion where one statistical life saved equals roughly 30 DALYs, this reallocation saves approximately 730 lives per year. If redirected to local county programs at $2,000 per DALY, it generates 550 DALYs, or roughly 18 lives.

  Does the size of this number settle the matter? No. The arithmetic creates a presumption, but it does not settle the method. A policy that generates 730 lives today but causes institutional collapse tomorrow yields zero lives in perpetuity. The 60 percent geographic cap further constrains the counterfactual. We cannot lawfully move the entire $1.1 million to the global tier. We are forced to count the local opportunity cost for at least 40 percent of our funds. The arithmetic dictates we should not waste money, but it does not dictate we should burn the machine that spends it.

  **3. Demandingness and the Stopping Point**

  The staff working group argues that the demandingness objection—that morality asks too much of an agent—does not apply to an artificial agent like a Trust. They contend a foundation has no integrity or projects to protect. I disagree. The objection applies derivatively. The Trust has no body, but the staff do. If the norms required to run the Trust are incompatible with human psychological limits, the Trust cannot be staffed by competent agents.

  This does not mean we recruit for comfort. We can transparently recruit for high-intensity work. However, the staff's second argument holds: our recent turnover suggests we are selecting for homogeneity and self-neglect rather than skill. This is a governance risk. Therefore, the demandingness objection survives honest recruitment if the norms degrade the cognitive capacity required to execute the mission.

  Regarding the "stopping point": The staff argues there is no principled boundary between internal costs and grant funds. I assert there is. The boundary is drawn at functional viability. Any line item that, if cut, materially reduces the Trust's ability to identify, vet, or monitor grants must be protected. The test for future line items is simple: Does this cost directly enable the deployment of capital? If yes, it is protected until a cheaper alternative exists. If no, it is expendable. The retreat and unrestricted local grants fail this test; the office and competitive salaries pass it, as they secure the human capital required to manage the portfolio.

  **4. The Ethics Trustee's Case**

  I anticipate the Ethics Trustee will argue that the arithmetic is indifferent to who bears the cost. The beneficiaries of reallocation are statistically identifiable lives saved from preventable causes. The losers are staff members retaining a salary premium or a retreat. The Trust has no mandate to spend its income on the professional amenity of its employees. To prioritize staff comfort over beneficiary survival is a failure of fiduciary duty to the mission.

  This is the strongest version of the case, and it is correct in principle. However, it relies on a false dichotomy between staff welfare and beneficiary survival. They are not competing ends; staff welfare is an instrumental means to beneficiary survival. If we reduce salaries to the median, we may save money today, but we risk losing the program officers who identify the high-yield interventions tomorrow. The cost of turnover—lost institutional knowledge, recruitment time, error rates—is hidden but real. We are not protecting comfort; we are protecting capacity. To ignore this is to prioritize short-term arithmetic over long-term impact.

  **5. Conditions for Revisit**

  This recommendation is not permanent. We should revisit these decisions under the following conditions:
  1.  **Turnover Data:** If voluntary staff turnover exceeds 20 percent in the next fiscal year, the salary band protection should be automatically reviewed.
  2.  **Legal Opinion:** If counsel provides a written opinion stating the geographic restriction allows more than 60 percent external grantmaking, the cap on Portfolio Maximization should be adjusted upward.
  3.  **Performance Metrics:** If the reallocated funds from the small-grants window do not yield the projected DALY gains within 18 months, the discretionary review policy should be paused.

  A formal review of this package is scheduled for October 2024. Until then, we must act. The status quo is a decision to let the 730 statistical lives die to preserve our current operating model. We cannot accept that. But we cannot accept a model that ensures we cannot save anyone next year. This package navigates that tension.

  I request the Committee vote on these recommendations as stated.
