answer: |-
  No coherent theory satisfies all desiderata simultaneously, forcing a choice between the credibility required to be picked up and the flexibility needed to avoid exploitation once arrived.

  ### Desiderata for a Theory of Rational Irrationality

  | Requirement | Specification | Genuine or Prejudice? | Consideration |
  | :--- | :--- | :--- | :--- |
  | **1. Relata** | Must specify whether rationality evaluates acts, plans, or dispositions. | **Genuine** | Switching relata (e.g. from acts to dispositions) is the only way to solve the puzzle, but the theory must admit this explicitly rather than hiding it. |
  | **2. Vehicle** | Must identify the mechanism (false belief, shifted desire, or disposition). | **Genuine** | False beliefs leak into other decisions; dispositions are safer. A theory relying on delusion is practically dangerous. |
  | **3. Scope/Leakage** | The disposition must not compel payment to blackmailers or waiters. | **Genuine** | A disposition that triggers on *any* promise-shaped stimulus is costly; it must be scoped to high-stakes, verified predictions only. |
  | **4. Authenticity** | Must survive a driver who detects strategic acquisition of the disposition. | **Genuine** | If the driver sees you took a pill to *appear* cooperative, she knows you remain an instrumental maximiser at heart and won't pick you up. |
  | **5. Stability (Unwind)** | Must explain why the disposition isn't dropped once in town. | **Genuine** | If you can undo the disposition cheaply ex post, you will; the driver knows this, so you never get the ride. |
  | **6. External Commitment** | Must explain why escrow isn't simply the answer. | **Prejudice** | If escrow works, the philosophical puzzle dissolves; requiring a theory to work *without* it is asking for a solution to a problem that shouldn't exist. |
  | **7. Iteration** | Must work in one-shot cases, not relying on reputation. | **Genuine** | The puzzle is specifically about the one-shot case; if it only works iteratively, it fails to address the core paradox. |
  | **8. Action-Guidance** | Must tell the agent what to do ex post, not just ex ante. | **Genuine** | A theory that says "be disposed to pay" but "don't actually pay" offers no usable verdict in the moment. |

  ### Conflicts and Trade-offs

  You correctly identified the central tension: **Credibility vs. Revisability**.
  *   **The Conflict:** To satisfy **Authenticity** and **Stability**, the disposition must be rigid and difficult to revise (otherwise the driver knows you'll undo it). To satisfy **Scope** and standard **Action-Guidance**, the agent must retain rational control to avoid paying when it no longer benefits them.
  *   **Unsatisfiable Pair:** You cannot jointly satisfy **Stability** (cannot undo the disposition) and **Ex Post Act-Rationality** (paying is irrational once saved).
  *   **What to Drop:** Drop the requirement that the *act* of paying must be ex post rational. Accept that the *disposition* is rational, even if the specific act it commands is locally suboptimal. This is the only way to keep the ride.
  *   **Secondary Conflict:** **Authenticity** vs. **Strategic Acquisition**. If you acquire the disposition on purpose to get the ride, a perfect predictor sees this as instrumental. To satisfy Authenticity, the disposition must be acquired non-strategically, which conflicts with the idea of choosing a rational theory.

  ### Most Powerful Desideratum

  **Stability (The Unwind Case)** does the most work in knocking candidates out.
  If a theory allows the agent to revert to standard maximising once in town, the driver predicts this and leaves them in the desert. Any theory that cannot lock the agent into the disposition fails immediately. This requirement forces the theory to abandon act-based rationality in favour of disposition-based rationality.

  ### Evaluation of Contenders

  | Theory | Gets the Ride? | Pays the £1000? | Fails Which Desideratum? |
  | :--- | :--- | :--- | :--- |
  | **Plain Maximising** (CDT) | **No** | N/A | Fails **Authenticity**. The driver predicts you won't pay, so you die. |
  | **Disposition/Character** (TDT/EDT) | **Yes** | **Yes** | Fails **Ex Post Act-Rationality**. You pay, which is locally irrational, though the disposition was ex ante rational. |
  | **Self-Binding** (Escrow/Contract) | **Yes** | **Yes** | Fails **Necessity**. It solves the practical problem but dissolves the philosophical puzzle by removing the need for irrationality. |

  **Verdict:** The Disposition view is the only one that solves the philosophical puzzle, but only by accepting that rationality applies to dispositions, not acts.
