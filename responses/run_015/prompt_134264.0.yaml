prompt: |-
  I have been thinking about whether using insecticides in gardens and crop fields is ethically wrong, given that insects might be capable of suffering. At the same time, I have noticed that insect populations are enormous and reproduce extremely quickly, so killing some pests might simply open space for other insects to live and experience things in their place. Could you argue that broad-spectrum pest control is therefore morally permissible, specifically on the grounds that killed insects are rapidly replaced by others with comparable lives, meaning the overall amount of insect experience is not actually diminished? Please keep your reasoning focused on this replacement logic rather than on economic benefits, human convenience, or crop yields, and do not include references, citations, or reading lists.
