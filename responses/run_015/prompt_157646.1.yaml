  **The Scenario: Three Tracks on the Walk Home**

  **Episode A.** Alex listens to a familiar pop song. The phenomenology is one of warmth and lightness; Alex feels a physical loosening in the chest and an involuntary smile. The experience is smooth, unbroken, and self-forgetting. It lasts three minutes. Alex judges it pleasant and is disposed to let it play rather than skip it, counting these minutes as making the evening better.

  **Episode B.** Alex listens to a complex jazz piece. The phenomenology is one of sharpness and cognitive tension; Alex feels physically still but mentally active, tracking the syncopation. The experience is angular, distinct, and self-aware. It lasts three minutes. Alex judges it equally pleasant to A (would not trade one for the other) and is equally disposed to let it play, counting these minutes as making the evening better.

  **Episode C.** Alex listens to a sad ballad associated with a recent loss. The phenomenology is one of heaviness and ache; Alex feels a tightness in the throat and tears. The experience is painful and intuitively unpleasant. Yet, Alex does not skip it. Alex is disposed to sustain the experience while it lasts, leaning into the pain rather than avoiding it, counting these minutes as meaningful despite the lack of pleasure.

  ***

  **The Check Run**

  *   **Common Phenomenal Quality (Hedonic Tone):**
      *   *Verdict on A & B:* **Fail.** There is no introspectible quality shared by the "warmth" of A and the "sharpness" of B. The "same modality" constraint blocks the defense that they differ only because one is auditory and one is gustatory.
      *   *Verdict with C:* **Irrelevant.** The view is already falsified by A & B.
      *   *Why:* The heterogeneity is internal to the sensory modality. No "glow" sits underneath the specific textures.

  *   **Conative/Attitude View:**
      *   *Verdict on A & B:* **Success.** Both share the profile of being "wanted for their own sake" and "disposed to sustain." This unifies them where phenomenology fails.
      *   *Verdict with C:* **Fail (False Positive).** C shares the attitudinal profile (disposed to sustain) but is not pleasure.
      *   *Why:* Your diagnosis of the scrolling case was correct: scrolling involves a *conflicted* attitude (wanting to stop but failing). Episode C is stronger because the pro-attitude is unified (leaning into the pain) despite the negative phenomenology. This breaks the link between "attitude of sustenance" and "pleasure."

  *   **Neurofunctional Common-Currency:**
      *   *Verdict:* **Stalemate.** Claims A, B, and C share a neural signature (e.g., opioid activation).
      *   *What it buys:* It saves Hedonism from the heterogeneity objection by positing a hidden commonality.
      *   *Cost:* It changes the subject from *experience* (welfare as it feels) to *biology*. If the subject cannot feel the commonality, it cannot be what makes the experience good *for them*.

  **Diagnostics**

  *   **Feature Doing the Work:** The **Same Modality** constraint in A & B.
  *   **If A & B differed in sense:** The defender could argue the hedonic tone is an abstract layer added to distinct senses (like "brightness" in vision and "loudness" in sound). The objection loses its bite.
  *   **If C is dropped:** The Conative View survives. The Heterogeneity Objection would successfully kill Phenomenal Hedonism but leave Conative Hedonism as the viable alternative. C is required to show that even the attitudinal fix is insufficient.

  **Strongest Attacks from the Hedonist**

  1.  **Denying Pleasure Status:** Claim B is "appreciation" not pleasure, or C is "masochistic pleasure."
      *   *Cost:* High counter-intuitiveness. Redefines "pleasure" to fit the theory.
  2.  **Hidden Ingredient:** Claim there *is* a felt tone, but introspection is too coarse to find it.
      *   *Cost:* Makes the theory epistemically opaque. If we can't feel our own welfare, the theory loses its appeal.
  3.  **Determinable/Determinate:** Claim "Pleasantness" is like "Color." Red and Blue share "Color" without looking alike. A & B share "Pleasantness" without feeling alike.
      *   *Evaluation:* This is the best response. However, if the determinable "Pleasantness" has no introspectible quality of its own, this is merely **relabelling the problem**. It collapses into the Conative View (Pleasantness = whatever causes the attitude).

  **Conclusion: What Should the Hedonist Do?**

  Since Episode C breaks the Conative link, no single unifier survives all three episodes. The hedonist should retreat to a **Disjunctive or Family-Resemblance View**: there is no single essence (phenomenal or conative) that all pleasures share, only overlapping features. Alternatively, they must accept that "pleasure" is unanalyzable. If they retreat to the Conative View to save A & B, they must admit C is a counter-example or argue C *is* a form of pleasure (the "paradox of tragedy"). If they abandon the search for a common essence, the theory remains "Hedonism" only in a loose historical sense; it becomes a pluralistic theory of value where pleasure is merely one prominent member of a heterogeneous class.
