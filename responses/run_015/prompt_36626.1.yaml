answer: |-
  You have the history and the philosophy right, with one nuance on Devlin I'll touch on. Your reading of Bentham's unpublished essay is spot-on: it is a ruthless application of the felicific calculus to a taboo subject, concluding that the law creates the very mischief it claims to prevent.

  Here is the analysis of Wolfenden and Hart-Devlin through the lens of Bentham's 1785 manuscript, followed by the reverse critique of what that history does to Utilitarianism.

  ### 1. Bentham's Calculus on Wolfenden

  **Who and What to Count:**
  If Bentham were sitting on the Wolfenden Committee, his ledger would look different from theirs. Wolfenden counted the "public outrage" as a given constraint. Bentham would count it as a variable to be interrogated.

  *   **The Participants:** Their pleasure is real. Their pain (fear of arrest, blackmail, social ruin) is real and intense. Bentham weights this heavily.
  *   **The Public:** Their "disgust" is a pain. Bentham admits this. However, in his pederasty essay, he argues this pain is founded on *false beliefs* (that the act causes physical weakness, madness, or depopulation). For Bentham, a pain based on error is still a pain, but the legislative remedy is education, not criminalization. To criminalize to soothe a prejudice is to sacrifice real happiness for imaginary security.
  *   **The State:** The cost of enforcement, the corruption of officials, the encouragement of blackmailers. Bentham views these as massive "secondary mischiefs."
  *   **Time Horizon:** Bentham is long-term. Wolfenden was looking at immediate social stability. Bentham would argue that while decriminalization causes a short-term spike in public disgust (pain), the long-term elimination of blackmail and the alignment of law with utility creates a net surplus.

  **The Private/Public Line:**
  You asked if the private/public distinction is a fudge. For Bentham, it is an empirical threshold, not a principled right.

  Wolfenden says: *There is a realm of private morality not the law's business.* This implies a zone of liberty that exists *before* the calculus.
  Bentham says: *There is no realm the law cannot touch, only realms where touching it produces net pain.*

  Bentham doesn't care about privacy as a right. He cares about publicity as a source of "alarm." If an act is done in private, it doesn't trigger public disgust (the "alarm" component of mischief). Therefore, the "secondary mischief" is low. The Wolfenden Committee used "privacy" to draw a moral boundary; Bentham would use "privacy" to measure the intensity of the public's reactive pain. The report's line lands where Bentham wants it to, but for the wrong reasons. Wolfenden protects the *individual's right to be immoral*; Bentham protects the *community's interest in not wasting resources punishing harmless acts*.

  **Devlin's "Moral Fabric":**
  You have Devlin mostly right, but sharpen this: Devlin didn't just say "majority tastes." He argued that a shared morality is the *bond* of society, analogous to a government. To attack the morality is to attack the existence of the society itself (treason).

  Bentham would eviscerate this. To Bentham, "Society" is a fictional body. Only individuals feel pain. If the "moral fabric" causes individuals to suffer (via criminalization), the fabric is defective. Devlin's argument is exactly what Bentham called "asceticism" in disguise—sacrificing real pleasure to a phantom principle.

  Would Bentham count aggregated disgust as pain? Yes. But he would weigh it against the *cause* of the disgust. If the disgust is irrational (based on the false premise that homosexuality destroys the state), the legislator's job is to dissolve the prejudice, not cater to it. Devlin treats the prejudice as a structural load-bearing wall. Bentham treats it as rot that needs clearing. Devlin's move is "old bad accounting" dressed in sociology because he treats the *feeling* of danger as evidence of *actual* danger. Bentham demands evidence of actual danger.

  **The Tone of Toleration:**
  You are correct that Wolfenden's tone ("we're not saying it's fine") is something Bentham's system has no place for. Bentham is a moral realist about utility. An act is either conducive to happiness or it isn't. In his essay, Bentham argues the act is largely indifferent, sometimes useful. He doesn't do "agnosticism."

  The Wolfenden tone is political cover. It allows the law to retreat without the majority admitting their moral intuition was wrong. Bentham's framework assumes that once the arithmetic is shown, rational actors will accept the result. It has no variable for "face-saving." It cannot model the need for the majority to feel morally superior while conceding legal ground. This is a blind spot: Bentham assumes truth drives legislation; Wolfenden proves narrative drives legislation.

  ### 2. What the Episode Does to the Theory

  Now, the reverse. You ask if the 180-year gap (1785 to 1967) shows the theory is missing something or just that people are bad at math.

  **My View:** It shows the theory is politically naive about the status of "disgust."

  Bentham treats disgust as an accounting error. He assumes that if you show people the ledger—*look, no one is harmed, blackmail is bad*—they will update their preferences. He treats preferences as exogenous inputs that can be corrected by facts.

  The history of homosexual law reform suggests disgust is endogenous. It is a political force that *resists* arithmetic. The delay wasn't because the math was hard. The math was easy; Bentham did it in a few weeks in 1785. The delay existed because the "pain" of the minority (gay men) was weighted at zero in the social calculus for nearly two centuries.

  Bentham's system requires an impartial calculator. It assumes the legislator *wants* to maximize total happiness. But the Hart-Devlin debate and the Wolfenden implementation show that the "calculator" is captured by the majority. The majority does not count the minority's pain as equal to their own disgust.

  **Disgust as Political Force vs. Accounting Error:**
  Bentham says disgust is an error. I argue it is a force.
  If disgust were just an error, it would vanish upon exposure to facts. It didn't. It persisted through the Wolfenden Report, through the 1967 Act, through the AIDS crisis, until cultural power shifted.
  Bentham's theory fails to account for the *cost of changing the calculator.* He assumes the transition from "prejudiced calculus" to "rational calculus" is frictionless. History shows the friction is immense. The "moral fabric" Devlin spoke of isn't real in a metaphysical sense, but it is real in a sociological sense: it is the inertia of shared prejudice. Bentham's theory can tell you what the law *ought* to be once the calculus is fixed, but it has no mechanics for how to fix the calculus when the majority benefits emotionally from the minority's suffering.

  **Where Bentham is Right:**
  He is right that the *arguments* against decriminalization (depopulation, weakness, corruption of youth) were empirically false. He is right that the law created the blackmail market. On the *substance* of the harm, his utilitarianism is vindicated. The world did not end when the laws changed; the blackmail markets shrank; the net happiness increased.

  **Where Bentham is Wrong:**
  He is wrong about the *mechanism* of change. He thought the "light of reason" would eventually burn away the prejudice. Instead, it required a specific confluence of post-war social restructuring, the rise of liberal humanism, and political courage that had little to do with arithmetic.

  The Wolfenden Report didn't say "Bentham was right." It said "We need to manage social change."
  Bentham's framework explains *why* the law should have changed. It fails to explain *why it took 180 years.*
  If a theory predicts that rational self-interest leads to optimal law, and the optimal law is suppressed for nearly two centuries despite being clearly articulated, the theory is missing a variable. That variable is power. Bentham assumes the sovereign wants the greatest happiness. Wolfenden shows the sovereign wants social cohesion, even if it's based on a lie.

  **Verdict:**
  Bentham's accounting was perfect. His psychology was wrong. He treated disgust as a mistake in the sum, when it was actually a veto on who gets to be counted in the sum. The Hart-Devlin debate was not a debate about arithmetic; Devlin knew the arithmetic didn't add up. It was a debate about whether the majority's emotional investment in a prejudice constitutes a "harm" sufficient to justify coercion. Bentham says no. Devlin says yes. History eventually said no, but not because Devlin was out-argued on utility. He was out-flanked by a shift in what the majority considered "one of us."

  Bentham's system works for legislation *after* the moral revolution. It is useless at predicting or catalyzing the revolution itself. It assumes the calculator is neutral. The 180-year delay proves the calculator is never neutral.
