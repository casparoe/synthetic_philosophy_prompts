answer: |-
  1. Even if cognition is distributed, the phenomenology of pain remains localized to specific nervous systems, meaning utilitarian sacrifice still imposes discrete harms that enactivism does not ontologically erase. This is the widely held view in philosophy of mind, despite ongoing debates about the precise boundaries of consciousness.

  2. Deriving normative permissions from descriptive metaphysics commits a naturalistic fallacy, as showing persons are porous does not logically prove we ought to treat them as a single aggregate unit. Defenders might dismiss this as dualist baggage, but naturalists and non-naturalists alike generally require additional bridging premises.

  3. Enactivist theories typically maintain organismic boundaries even while extending cognitive loops, so the protagonist conflates "porous" with "nonexistent" to force her conclusion. This is contested among enactivists, but most concede biological individuation remains relevant for survival-based ethics.

  4. Dissolving personhood undermines moral responsibility and accountability, creating a practical paradox where no individual agent can be blamed for utilitarian harms. Defenders would concede this is a pragmatic cost but dismiss it as secondary to ontological truth.

  5. The view risks unfalsifiability if "distributed cognition" is invoked only to dissolve boundaries during aggregation but ignored when assigning legal or biological rights. This is a methodological critique rather than a metaphysical one, making it merely awkward for a theorist focused on pure ontology.
