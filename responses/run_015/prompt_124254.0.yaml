answer: |-
  ### Consistency Audit

  **Executive Summary:** Your package contains a fatal logical contradiction between your theoretical constraints and your specific verdict on asymbolia. The tension between your rejection of phenomenal sufficiency (5) and your practical-integration condition (4) against your verdict that asymbolics are harmed (7) is not merely a tension; it is a direct inconsistency. The other tensions are manageable.

  #### 1. Ranking Tensions by Severity

  **1. Critical (Fatal): (4) + (5) vs. (7)**
  *   **The Conflict:** (4) states harm *requires* practical integration (registration as an obstacle). (5) states phenomenal badness is *not sufficient* for harm. (2) states asymbolics lack the affective-motivational link required for that integration. Yet (7) concludes asymbolics *are* harmed *because* of the phenomenal character.
  *   **Why it's fatal:** (7) relies on the exact principle (phenomenal sufficiency) that (5) explicitly rejects, and it violates the necessary condition for harm laid out in (4). You cannot claim integration is necessary for harm while simultaneously claiming a state is harmful despite lacking integration.

  **2. Moderate (Conceptual Slippage): (3) vs. (4)**
  *   **The Conflict:** (3) argues badness is not reducible to functional role. (4) defines harm via a functional/practical condition (undermining projects).
  *   **Why it's moderate:** This is resolvable if you distinguish *Badness* (intrinsic phenomenal property) from *Harm* (normative status relative to a life). However, if Harm supervenes on Badness, making Harm functional while Badness is non-functional risks a category error. It looks like you are reducing the *normative significance* of pain to function after arguing against reducing the *nature* of pain to function.

  **3. Low (Apparent Only): (2) vs. (6)**
  *   **The Conflict:** (2) admits the motivational pathway is evolutionarily shaped and dissociable. (6) claims immunity from evolutionary debunking.
  *   **Why it's apparent:** Debunking arguments target *inferred beliefs* or *judgments* shaped by fitness. Your view (1 & 6) grounds the badness in *immediate phenomenology*, not the motivational output. As long as you maintain the sensory/phenomenal is distinct from the motivational/functional (which (2) supports), the debunking argument misses its target. This pair is consistent.

  #### 2. Genuine vs. Apparent Conflicts

  *   **Genuine Conflict:** **(4) & (5) vs. (7).** This is a logical contradiction. You have defined harm in a way that excludes the very case you want to include.
  *   **Apparent Conflict:** **(3) vs. (4).** This is a distinction without a difference *unless* you clarify that "Harm" is a composite property (Phenomenal Badness + Practical Context). If you treat them as distinct layers, this holds.
  *   **Apparent Conflict:** **(2) vs. (6).** As noted above, the dissociation actually *helps* your anti-debunking argument by isolating the phenomenology from the evolutionary machinery of motivation.

  #### 3. Least Costly Commitment to Revise

  **Commitment (5): The Rejection of Phenomenal Sufficiency.**

  **Reasoning:**
  1.  **Direct Contradiction:** (7) is your applied verdict; (5) is your theoretical guardrail. In a consistency audit, the guardrail must yield if it blocks the intended conclusion. Your justification in (7) ("unpleasant phenomenal character itself constitutes a negative experiential fact") *is* an argument for phenomenal sufficiency. Denying it in (5) makes (7) unintelligible.
  2.  **Preserves Core Intuitions:** Revising (5) allows you to keep (1) (Phenomenal Essentialism) and (7) (Asymbolics are harmed). It aligns your theory with your verdict.
  3.  **Minimal Ripple Effect:** Revising (5) does not break (3) (Anti-reductionism) or (6) (Debunking Immunity). It only forces a adjustment to (4).

  **Recommended Fix:**
  Do not drop (5) entirely; **qualify it.**
  Change (5) from: *"Phenomenal badness does not automatically constitute harm."*
  To: *"Phenomenal badness constitutes **pro tanto** (experiential) harm, but practical integration determines **all-things-considered** (agential) harm."*

  This allows you to maintain (4) as a condition for *agential* harm (undermining projects) while accepting that asymbolics suffer *experiential* harm (negative qualitative character). This resolves the fatal tension without abandoning your internalist framework.

  #### 4. Audit Verdict

  *   **Consistency Status:** **Failed.** The package is currently self-contradictory.
  *   **Primary Fix:** Revise (5) to allow for *pro tanto* phenomenal harm.
  *   **Secondary Fix:** Clarify (4) to specify it applies to *practical/agential* harm, not *experiential* harm.
  *   **Keep:** (1), (2), (3), (6), and the core intuition of (7).

  If you make this distinction between *experiential harm* (sufficient via phenomenology) and *agential harm* (requires integration), the package becomes robust, defensible, and internally consistent.
