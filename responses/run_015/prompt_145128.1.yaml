  2.  **Analyze the Implicit Theory (The "Standard Model" of Research Ethics):**

      *   *Current Practice:* Protect vertebrates (mostly), maybe cephalopods/insects in some jurisdictions. Ignore atoms/fields.
      *   *Underlying Assumptions:*
          *   **Substrate Dependence:** Consciousness/sentience requires specific biological complexity (nervous systems, brains).
          *   **Threshold View:** There is a sharp line where moral status "turns on." Below the line (rocks, electrons), status is zero. Above the line (mice), status is non-zero.
          *   **Aggregation:** Suffering aggregates across individuals (100 mice hurt is worse than 1 mouse hurt), but *not* across sub-components of a non-sentient system.
          *   **Tractability/Epistemology:** We can *know* when a mouse hurts (behavior, physiology). We cannot know/verify if a quark "hurts."
          *   **Pragmatism:** If we protected everything, science would stop. Therefore, we *must* draw the line somewhere practical.
      *   *Does it strictly need the "Brain" view?* Not strictly. It could survive on a "Pragmatic Skepticism" view (we don't know, but we have to act as if only brains count to get anything done). However, the *moral justification* relies heavily on the brain/sentience link.

