  **MEMORANDUM**

  **TO:** Curatorial Staff, Conservation Department, and Registrar's Office
  **FROM:** Ontology Review Board, Mid-Atlantic Heritage Consortium
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Ontological Classification of Case 447-B (1920s Ceramic Vessels)
  **CASE REF:** 447-B

  **1. DECISION SUMMARY**

  Regarding the two physically identical ceramic vessels (Vessel A and Vessel B) currently under dispute: The Board recommends cataloging the items as **Independent Administrative Entries with a Mandatory Distributed Identity Link.**

  They are to be assigned unique accession numbers for insurance, conservation, and loan purposes. However, the database schema must enforce a bidirectional link between the two records, flagging them as a "Potential Distributed Unit." This classification remains in effect for a period of **five (5) years**, or until non-destructive internal scanning technology becomes viable for this specific glaze density.

  **2. ONTOLOGICAL REASONING**

  The core dispute in Case 447-B is whether an object's identity is determined by its intrinsic physical reality (which is currently hidden inside the sealed cavities) or by our institutional capacity to verify and manage that reality.

  *   **The Realist Position:** Argues that the vessels are either two objects or one object based solely on the content of the tokens, regardless of our ability to see them. To catalog them separately if they are ontologically one unit is to record a falsehood.
  *   **The Pragmatic Position:** Argues that for a consortium, an "object" is defined by what we can isolate, insure, and conserve. Since we cannot interact with the internal tokens, they cannot dictate administrative boundaries.

  **The Board's Rationale:**
  We are adopting a functional ontology for the shared catalog. In an institutional context, an "object" is defined by its locus of accountability. Because Vessel A and Vessel B occupy different physical spaces, carry different insurance risks, and require separate conservation handling, they must be administrative individuals. To treat them as a single administrative unit would create unmanageable liability gaps (e.g., if Vessel A is damaged, how is the claim calculated for an object that partially exists in another building?).

  However, we acknowledge that administrative convenience cannot override historical truth. Therefore, the "Mandatory Distributed Identity Link" ensures that while the *custody* is split, the *interpretation* remains unified. The catalog will reflect that these items function as a single semantic unit until proven otherwise.

  **3. ENGAGEMENT WITH REJECTED ALTERNATIVES**

  **The Rejected Proposal:** Catalog the vessels as a single linked distributed set (One Accession Number, Two Locations).

  **The Strongest Argument for this Side:**
  Proponents of this view argue that if the vessels constitute a single ritual mechanism, separating them in the database commits a category error that obscures their historical function. It privileges bureaucratic ease over archaeological truth. If they are one thing, our records should say they are one thing, even if that complicates logistics.

  **Why This Falls Short (and How We Mitigate It):**
  While historically rigorous, a single-accession model fails the "test of intervention." If Vessel A requires emergency conservation, a single-accession record creates ambiguity regarding authority and resource allocation. It conflates *ontological unity* with *administrative unity*.

  Our decision mitigates the risk of falsifying history by hard-coding the relationship. The "Distributed Identity" flag prevents curators from treating the vessels as unrelated isolates. It ensures that exhibition proposals, research requests, and loan agreements automatically trigger a review of the partner vessel. We preserve the historical hypothesis without breaking the chain of custody.

  **4. ACTIONABLE DIRECTIVES FOR CURATORS**

  Effective immediately, please implement the following:

  1.  **Accessioning:** Assign distinct Accession Numbers (e.g., 2023.047.01 and 2023.047.02).
  2.  **Metadata Field:** In the "Object Relations" field, select the new constraint tag: **[CASE 447-B: DISTRIBUTED UNIT PENDING VERIFICATION]**. This field cannot be left blank or overridden without Board approval.
  3.  **Loan & Insurance:** All loan agreements must explicitly state that the vessel is part of a "Potential Distributed Set." Borrowers must acknowledge that the artifact's full ritual context relies on a counterpart held by the Consortium.
  4.  **Conservation:** Do not attempt invasive analysis on the internal cavities without a new Board vote. Any degradation of the seal compromises the ontological status of the pair.

  **5. REVIEW TRIGGER**

  This classification is provisional based on current epistemic limits.
  *   **Time-Bound Review:** This case will return to the Ontology Review Board automatically on **October 24, 2028**.
  *   **Technology Trigger:** If non-destructive imaging (e.g., advanced muon tomography) becomes capable of distinguishing the token material through the specific glaze chemistry of these vessels, the Registrar must flag the case for immediate re-evaluation.

  **6. CASE NOTE**

  Please ensure all internal filings reference **Case 447-B**. Discrepancies in case numbering in previous correspondence should be corrected to match this identifier.

  **Approved by:**
  The Ontology Review Board
  Mid-Atlantic Heritage Consortium
