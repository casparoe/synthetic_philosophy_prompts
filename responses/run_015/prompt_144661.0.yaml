answer: |-
  Dear Colleague,

  It is a pleasure to assist you in structuring this session, as moving students beyond the caricature of Augustine as a rigid rule-worshipper is essential for their understanding of virtue ethics and the philosophy of language. To achieve this within fifty minutes, the order of operations must be precise, because each conceptual layer depends on the stability of the previous one. You should begin by dismantling the conflation of false statement with lying, which is the most immediate misconception students bring. If you do not secure the definition of mendacium first, any subsequent discussion of why lying is wrong will be confused by examples of jokes or errors that students mistakenly classify as lies. Therefore, the first ten minutes must be dedicated to establishing the taxonomy, specifically isolating the intent to deceive as the necessary condition for mendacium. You should present cases of figurative language, honest error, and joking immediately to show that falsehood alone is not sinful for Augustine. This is the precise moment to head off the misconception that any false utterance is a lie, ensuring they understand that for Augustine, the moral weight lies in the will rather than the correspondence between word and world.

  Once the taxonomy is secure, you should introduce the epistemic hospitality framing, but only after the students understand what counts as a lie. Introducing this normative framework before the taxonomy would be premature because they cannot grasp how lying refuses a share in reality if they do not yet distinguish lying from other forms of false speech. The concept of epistemic hospitality serves as the bridge between the definition and the justification, explaining that the wrongness of mendacium is not merely about metaphysical correspondence but about violating the social bond that allows knowledge to be shared. This is also the strategic point to address the misconception regarding mental reservation. Students often invent a loophole where one can speak falsely while mentally intending the truth, believing this satisfies Augustine. You must clarify that because the sin is the intent to deceive the listener, mental reservation fails to offer epistemic hospitality just as much as a blunt lie does, since the speaker still wills the listener to hold a false belief. By addressing this here, you prevent them from using mental reservation as a shield when you later discuss high-stakes examples.

  Regarding the carrying example, I advise against using the case of hiding a fugitive as the primary vehicle for the session, although it is historically significant. While it is the classic test of absolutism, it lacks the crucial property needed to illuminate epistemic hospitality because the stakes are too heavily weighted toward physical survival. In a fugitive scenario, the consequentialist reasoning that saving a life outweighs telling the truth is so overwhelming for undergraduates that it collapses the discussion into a utilitarian calculus before they have grasped the nuanced taxonomy. The example lacks the subtlety required to show how lying damages the communal conditions for knowing, because the students will focus entirely on the fugitive safety rather than the relationship between the speaker and the pursuer. Instead, you should replace it with a case involving benevolent deception within a relationship of trust, such as a friend hiding a painful truth from another friend to spare them distress, or a teacher misleading a student about their capabilities to protect their confidence. The right example must have the property of high relational trust and benevolent intent, but it must lack immediate physical danger or life-or-death consequences. This ensures the focus remains on the epistemic damage done to the listener who is denied a share in reality, rather than on the physical consequences of the truth. This is where you must head off the third misconception, that if lying saves a life or prevents harm it must be permissible. By using a lower-stakes example, you force them to engage with why Augustine thinks the act itself is destructive to the social fabric, regardless of the benevolent outcome.

  As for what should be left out, you should avoid the detailed eightfold classification of lies found later in Augustine's text. While intellectually rich, it is too granular for a fifty-minute session focused on the core distinction between mendacium and other speech acts. Mentioning that such a classification exists is sufficient, but dissecting the hierarchy of sins will distract from the primary goal of understanding the nature of the lie itself. You should also avoid diving into the theological implications of lying against God unless a student raises it, as this can shift the discussion from moral philosophy to doctrine, which may alienate secular students or obscure the philosophical argument about community and knowledge.

  To close the session, you need a question that tests whether they have internalized the concept of epistemic hospitality rather than merely memorized the prohibition. You should ask them to explain why, on Augustine's view, a lie told to protect a friend's feelings is potentially more damaging to the friendship than a harsh truth. A successful answer will not appeal to rules or divine command but will articulate how the lie deprives the friend of the agency to navigate reality, thereby treating them as an object to be managed rather than a partner in knowledge. This reveals whether they grasp that the wrongness lies in the refusal of hospitality. If they can articulate that the lie isolates the listener from the truth they need to function as a rational agent within the community, then they have moved beyond the caricature. By following this sequence, you ensure that the taxonomy supports the rationale, the example tests the rationale without triggering consequentialist overrides, and the misconceptions are neutralized before they can derail the discussion. I hope this plan serves your section well, and I look forward to hearing how the students respond to the idea of epistemic hospitality.
