answer: |-
  ### Analysis of Principles and Precedents

  **Candidate Principles**
  1.  **Subjecthood (Coercion):** If the city can coerce you (laws, school, jail), you get a say. *Predicts: Yes to 16+ vote, Yes to non-citizens, Yes to pre-trial jail.*
  2.  **Stake (Permanence):** The vote belongs to those in it for the long run. *Predicts: Yes to 2-year residency, No to absentee owners, No to 30-day residency.*
  3.  **Volition (Anti-Coercion):** We can clear the path but cannot punish people for staying home. *Predicts: Yes to auto-register, No to fines/naming, No to inactive status.*

  **Recommendation**
  **Recommend Against.** The proposal violates the **Stake** principle most egregiously by reducing residency from two years to thirty days, contradicting your non-citizen precedent. It also nudges against **Volition** by creating a barrier (re-registration) you previously rejected in the form of fines. While the 16+ vote aligns with **Subjecthood**, bundling it with weakened residency and participation barriers makes the package incoherent.

  **Underdetermination**
  Your record underdetermines the 16-year-old vote for *mayor*. You approved it for school board based on "living with results," but 16-year-olds also live with mayoral results. The distinction relies on an unstated **Competence** principle (judgment capacity) that this proposal ignores.

  **Tie-Breaker Case**
  To separate **Stake** from **Subjecthood**, consider a proposal lowering the voting age to 16 *without* changing the two-year residency requirement. If you pass it, **Subjecthood** dominates. If you reject it, **Stake** (or Competence) dominates.

  ***

  ### Draft Statement for Public Meeting (200 Words)

  Our commission's record reveals three competing principles: subjecthood, stake, and volition. We grant votes to those bound by law, those rooted here, and we refuse to punish abstention. This proposal mixes them inconsistently. Lowering residency to thirty days abandons our "long-run stake" precedent set for non-citizens. Moving voters to inactive status nudges toward the "punishment for staying home" principle we rejected when banning fines. While "none of the above" respects volition, it cannot save the package. The sixteen-year-old provision extends our school board logic to all offices, which is defensible, but bundled with weakened residency and participation barriers, it loses coherence. We should recommend against this amendment. To be consistent, we must protect the two-year residency requirement that ensures voters share the city's future, and maintain automatic active status that respects the choice not to vote. We can support lowering the voting age or adding "none of the above" as separate questions, but not traded against residency stability or voter accessibility. This package asks us to sacrifice established stakes for speculative engagement. We recommend a no vote to preserve the balance we have carefully built between inclusion and commitment. Consistency demands we keep the bar for entry steady while removing barriers, not raising them. If we accept thirty days, we imply presence matters more than permanence. If we accept inactive status, we imply voting is a duty, not a right. Our precedents say otherwise. Vote no.
