      *Wait, let me refine the Irish Famine.* The User's Test 1 asks: Swap blight for drought. If outcome (mass death/emigration) is the same, blight gets low credit. Given British policy, a drought likely yields similar famine. So Blight fails Test 1. But it passes Test 2 (Policy choices). So it's "Real but mediated to hell." Tier B fits.

