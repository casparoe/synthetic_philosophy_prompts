answer: |-
  # Teaching Plan: Jeffrey's Rule of Conditionalization

  ## I. Conceptual Dependency Order
  *Total Time Allocation: 50 Minutes*

  **1. Secure the Baseline: Standard Conditionalization as Certainty (0–10 mins)**
  *   **Prerequisite Understanding:** Students must firmly grasp that standard Bayesian updating is a *limit case* where the evidence proposition $E$ receives probability 1.
  *   **Key Distinction:** Establish that in standard conditioning, $P_{new}(E) = 1$ is not derived; it is the *trigger*. The update is $P_{new}(H) = P_{old}(H|E)$.
  *   **Why this first:** You cannot motivate Jeffrey's rule without first establishing the "Dogma of Propositional Certainty" that Jeffrey rejects. The physicist colleague must accept that standard Bayes requires a proposition to become certain to function as the conditioning event.

  **2. The Problem of Uncertain Evidence (10–20 mins)**
  *   **The Gap:** Introduce scenarios where experience shifts confidence in $E$ without making $P(E)=1$.
  *   **The Physicist's Objection (Crucial Intervention):** The physicist will argue this is just standard Bayes with a "noisy observation" proposition $O$ (where $P(E|O) < 1$).
  *   **Structural Difference:** You must demonstrate that Jeffrey Conditionalization (JRC) is **not** standard conditioning on a weaker proposition.
      *   *Standard/Physicist View:* Experience $\rightarrow$ Proposition $O$ learned with certainty $\rightarrow$ Inference to $E$.
      *   *Jeffrey View:* Experience $\rightarrow$ Direct shift in $P(E)$ (no intermediate proposition $O$ learned with certainty).
  *   **Why this matters:** JRC treats the new probability distribution over the partition as an **exogenous input**, not an **endogenous output** of an inference. This is the structural difference the physicist must grasp.

  **3. The Formula and the Rigidity Condition (20–35 mins)**
  *   **The Formula:** Introduce $P_{new}(H) = \sum_i P_{old}(H|E_i) P_{new}(E_i)$.
  *   **Entry of Rigidity:** Introduce the Rigidity (or Stability) condition **immediately after** presenting the formula, as its **validity constraint**.
      *   *Definition:* $P_{old}(H|E_i) = P_{new}(H|E_i)$.
      *   *Function:* Explain that the formula *preserves* old conditional beliefs while *swapping* the weights (marginals) of the partition.
      *   *Placement Logic:* Do not introduce Rigidity before the formula. Students must see *what* the rule calculates before they understand *when* it is permissible to use it. Rigidity is the justification for why we use old conditionals rather than recalculating them.

  **4. Misconception Interception (35–40 mins)**
  *   (See Section III below for specific misconceptions and interception timing).

  **5. Check-for-Understanding (40–45 mins)**
  *   (See Section IV below).

  **6. Scope and Omissions (45–50 mins)**
  *   (See Section V below).

  ---

  ## II. The Carrying Example

  **Rejection of the Jar-with-Balls Scenario**
  A jar-with-balls scenario must **not** be used.
  *   **Reason for Failure:** Jar scenarios imply objective frequencies and sampling. If a student is "unsure" about the ball color, the physicist will successfully model this as "I observed a blurry signal $S$," allowing standard Bayesian updating on $S$. This validates the physicist's objection and obscures Jeffrey's point.
  *   **Required Features of Replacement:**
      1.  **Perceptual/Qualitative Input:** The source of uncertainty must be the *nature of the experience itself*, not a signal-to-noise ratio in a channel.
      2.  **Non-Binary Partition:** The example must inherently involve more than two possibilities to prevent the simplification $P(\neg E) = 1 - P(E)$ from hiding the structural mechanics.
      3.  **Exogenous Probability Shift:** The scenario must make it plausible that the agent simply *finds themselves* with new probabilities, without being able to articulate a specific proposition they learned with certainty.

  **The Selected Example: The Dimly Lit Fabric**
  *   **Scenario:** You are inspecting a bolt of fabric in a room with flickering, dim light.
  *   **Partition ($E_i$):** The fabric is **Green**, **Blue**, or **Violet**. (Non-binary).
  *   **Hypothesis ($H$):** The fabric is **Synthetic**.
  *   **The Experience:** The light stabilizes for a moment. You do not become certain of the color. However, your confidence shifts:
      *   $P_{old}(\text{Green}) = 0.33, P_{old}(\text{Blue}) = 0.33, P_{old}(\text{Violet}) = 0.33$.
      *   $P_{new}(\text{Green}) = 0.7, P_{new}(\text{Blue}) = 0.2, P_{new}(\text{Violet}) = 0.1$.
  *   **Why this works for the Physicist:** Ask the physicist: "What is the proposition $O$ you learned with certainty that entails these specific new probabilities?" If they say "I saw it look greenish," press them on why that proposition yields exactly 0.7 and not 0.8. Jeffrey's point is that the *experience* fixes the probabilities directly; there is no intermediate proposition $O$ with $P_{old}(O)=1$ that generates these numbers via standard conditioning.
  *   **Visualizing Intermediate Probability:** This example makes visible that shifting $P(\text{Green})$ to 0.7 is not equivalent to conditioning on "Green" (which would make it 1.0) nor conditioning on "Not-Green" (which would make it 0.0). It is a reallocation of weight across three cells, not a binary collapse.

  ---

  ## III. Misconceptions and Interception Points

  **1. Misconception: "Jeffrey Updating is just Weighted Averaging of Priors"**
  *   **The Error:** Students may interpret the formula $\sum P_{old}(H|E_i) P_{new}(E_i)$ as averaging the *prior* probability of $H$ using new weights.
  *   **Interception Point:** **Immediately after presenting the formula (Minute 25).**
  *   **Correction:** Explicitly write $P_{old}(H|E_i)$ on the board and circle it. Label it "Retained Conditional Belief." Emphasize that we are averaging the *hypothetical posteriors* (what you would have believed if you *had* become certain of $E_i$), not the prior $P_{old}(H)$.

  **2. Misconception: "Departure from the Likelihood Principle is an Error"**
  *   **The Error:** The physicist (and trained Bayesians) will object that JRC ignores likelihoods $P(E_i|H)$. They view this as a violation of rational inference.
  *   **Interception Point:** **During the "Structural Difference" section (Minute 15).**
  *   **Correction:** Frame this as a **designed feature**, not a bug. Standard Bayes is for *inference from data*. Jeffrey Conditionalization is for *direct experience*. In JRC, the "likelihood" work is already done by the experience itself, which directly sets the $P_{new}(E_i)$. To demand likelihoods is to demand a model of the experience that the agent does not possess.

  **3. Misconception: "Rigidity is Always True"**
  *   **The Error:** Students may assume conditional probabilities are always stable during updates.
  *   **Interception Point:** **When introducing Rigidity (Minute 30).**
  *   **Correction:** Provide a counter-example where Rigidity fails (e.g., learning the color of the fabric also changes your belief about whether synthetic fabrics *can* be that color). If $P(H|E_i)$ changes *because* of the experience, JRC is invalid. Rigidity is a substantive constraint on the *type* of experience, not a logical truth.

  ---

  ## IV. Check-for-Understanding Question

  **Constraint:** Must apply the rule to a non-binary partition where evidence shifts probabilities across more than two cells.

  **The Question:**
  "Return to the Fabric scenario. Suppose your hypothesis $H$ is 'The fabric is Synthetic.'
  Your old conditional beliefs are:
  1.  $P_{old}(H | \text{Green}) = 0.8$
  2.  $P_{old}(H | \text{Blue}) = 0.4$
  3.  $P_{old}(H | \text{Violet}) = 0.1$

  Your experience shifts your confidence in the colors to:
  $P_{new}(\text{Green}) = 0.5$, $P_{new}(\text{Blue}) = 0.3$, $P_{new}(\text{Violet}) = 0.2$.

  Calculate $P_{new}(H)$. Then, explain why you cannot solve this by calculating a likelihood ratio for 'Greenness'."

  **Expected Answer:**
  *   **Calculation:** $(0.8 \times 0.5) + (0.4 \times 0.3) + (0.1 \times 0.2) = 0.4 + 0.12 + 0.02 = 0.54$.
  *   **Explanation:** There is no single proposition "Greenness" learned with certainty. The input is a distribution over three mutually exclusive cells. Standard conditioning requires conditioning on a single proposition with probability 1. Attempting to construct a likelihood ratio would require inventing a proposition about the *experience* (e.g., 'It looked 50% Green'), which reintroduces the physicist's objection that Jeffrey's rule is designed to bypass.

  ---

  ## V. Adjacent Topics to be Explicitly Omitted

  To maintain focus on the mechanics and conceptual distinction of JRC within 50 minutes, explicitly state that the following are **out of scope** for this session:

  1.  **Minimum Relative Entropy (MinEnt):** Do not derive JRC as the solution to minimizing information distance subject to constraints. This justifies the rule but obscures the intuitive "rigidity" mechanism for beginners.
  2.  **Dempster-Shafer Belief Revision:** Do not compare JRC to belief functions or upper/lower probabilities. This introduces a competing framework for uncertainty that confuses the specific issue of *probabilistic* updating.
  3.  **Diachronic Dutch Books:** Do not discuss the normative justification regarding betting vulnerabilities over time. This shifts the seminar from epistemology to decision theory.

  **Closing Instruction:** State clearly: "Today we treat JRC as a distinct kinematic rule for probability change, analogous to how kinematics describes motion without reference to forces (dynamics). Justifications regarding entropy or betting are the 'dynamics' we leave for advanced study."
