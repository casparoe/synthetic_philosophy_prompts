      *   *The Physicist's Objection:* "Just treat the experience as $E^*$ with $P(E^*|E) < 1$." Need to show why JRC isn't just this.
      *   *The Solution (JRC):* The formula $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   *The Constraint:* Rigidity (Stability of conditional probabilities).
      *   *The Example:* Needs to be sensory/experiential where the *proposition itself* isn't fully learned, but the *probability distribution* over a partition shifts directly. A "jar with balls" is usually about drawing (objective chance). We need something about *perception* or *direct probability assignment* to distinguish JRC from standard Bayesian updating on a report.
      *   *Misconceptions:* Weighted averaging (it is, but specifically of *posteriors* based on *old* conditionals), Likelihood Principle violation (it is, but by design).
      *   *Check-for-Understanding:* Needs a partition $>2$ (e.g., Red, Blue, Green).
      *   *Omissions:* MinEnt, Dempster-Shafer, Diachronic Dutch Books (maybe too advanced/divisive for intro).

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Foundations (Standard Conditioning).**
          *   Need to establish the "Dogma of Propositional Certainty." Standard Bayes assumes $P_{new}(E) = 1$.
          *   *Dependency:* Must secure the idea that standard updating *replaces* the prior probability of $E$ with 1 before we can ask what happens if we don't.

      *   **Phase 2: The Problem (Uncertain Evidence).**
          *   Introduce the scenario where experience shifts confidence but doesn't certify.
          *   *Addressing the Physicist:* This is crucial. The physicist says "Make the evidence a proposition about the *experience*." JRC says "No, the experience directly shifts the probability of the *world* proposition."
          *   *Example Selection:* A jar scenario is risky because it implies objective frequencies. A *perceptual* scenario is better. *The Fabric Example.* Looking at a cloth in dim light. Is it Green, Blue, or Purple? You don't become certain it's Green, but your confidence shifts.
          *   *Why Jar fails:* In a jar, you either see the ball or you don't. If you aren't sure, you usually model that as "I saw a blurry ball." JRC requires the *input* to be the new probability distribution itself, not a proposition about the input.
          *   *Requirement for Example:* The input must be a direct shift in $P(E_i)$, not the learning of a new proposition $E^*$.

      *   **Phase 3: The Rule & Rigidity.**
          *   Present the formula.
          *   *Rigidity:* Where does it fit? It justifies the formula. It must come *after* the formula is motivated but *before* it is justified. It's the bridge.
          *   *Structural Difference:* Standard Bayes updates via likelihoods $P(E|H)$. JRC updates via new marginals $P_{new}(E)$.

      *   **Phase 4: Misconceptions.**
          *   *Weighted Averaging:* Students think $P_{new}(H)$ is just averaging priors. No, it's averaging *old posteriors*.
          *   *Likelihood Principle:* Physicist will hate that we ignore likelihoods. Need to frame this as "Direct Influence" vs "Inferential Influence."
          *   *Interception:* Address these immediately after presenting the formula.

      *   **Phase 5: Check-for-Understanding.**
          *   Needs $>2$ partition. The Fabric example works (Green, Blue, Purple).
          *   Question: Give old conditionals and new marginals, ask for new $P(H)$.

      *   **Phase 6: Scope & Omissions.**
          *   MinEnt (justification), Dutch Books (normative force), Dempster-Shafer (alternative framework).

  4.  **Refining the "Physicist" Constraint:**
      *   The physicist thinks: $P_{new}(H) = P(H | \text{Experience})$. They model Experience as a proposition $X$.
      *   JRC says: There is no proposition $X$ such that $P_{new}(\cdot) = P_{old}(\cdot | X)$.
      *   *Crucial distinction:* In JRC, the change in $P(E)$ is *exogenous*. In Standard Bayes, the change in $P(E)$ is *endogenous* (derived from $P(X)$ and $P(E|X)$).
