prompt: |-
  I write fiction, and I am about to make a decision that a historian is free to postpone. My novel is narrated in the first person by a woman from a fishing household on the northern shore of the lake, who attaches herself to a Galilean preacher and stays with him to the end. That means I have to settle, before drafting, what this preacher said, what he refused to say, what he thought he was doing, what the people travelling with him were expecting of him, and how much of any of it is only the evangelists' retrospection. I can hedge in a note; I cannot hedge in a scene. So I need a specification rather than a survey.

  Please write the desiderata that any method for getting from our sources — the four Gospels, with their well-known dependencies on one another; the letters of Paul, with their near-total silence about the life; the brief notices in Josephus, one of which has probably been retouched by Christian hands — to a portrait of Jesus would have to satisfy. Fix the purpose as mine: a portrait good enough to build one determinate character on, capable of carrying a psychological arc and of acting for reasons a reader can follow, rather than a portrait good enough for a monograph. Whether the standard is the same for the two purposes is itself something I want you to decide.

  For each requirement, give the case or consideration behind it, and mark it either non-negotiable or a preference of one school or one craft. Among the things I want adjudicated: whether a method owes me anything about what he did not say and could not have done, or only about what he did and said; whether a method can coherently be required to be independent of the historian's prior portrait of Jesus, or whether any criterion of authenticity is doomed to ratify whichever portrait it was run to confirm; how a criterion should treat sources that are not neutral reports but interpretations produced by people who already believed; whether the desiderata should require the method to recover the believing community as well as the man, since I have to stage the ensemble and not only the protagonist; and whether the portrait must be at once continuous with first-century Jewish life and discontinuous enough to explain why a movement formed around him and why Rome killed him.

  I also want a candidate criterion of my own audited. I have been working with something I call narrative fit: a reconstruction is adequate only if the actions I need to stage follow from the sayings I attribute to him, and those sayings from those actions, without my having to supply a bridging motive that the sources nowhere suggest. Is that a genuine desideratum, a novelist's prejudice smuggled into historiographical method, or a requirement with a narrow but real domain — and if the last, over what range is it trustworthy?

  Then the two things I care about most. First, tell me which subset of your desiderata you suspect cannot be jointly satisfied, and why: I would rather have the impossibility than a list that flatters my hopes. Second, name the single requirement that does the most work in excluding the criteria in ordinary use — embarrassment, dissimilarity, multiple attestation, Semitic or Palestinian linguistic and environmental colour, coherence with what has already been accepted — and score those against your list briefly, in a table if you prefer, since that part I can check for myself.

  Two closing requests. Give me a decision rule for an author: when the best-supported reconstruction of a scene carries something like a third or two-fifths of the probability mass and the alternatives are not dramatically worse, what may a novelist do, and exactly where does legitimate filling-in become dishonest? And mark your own confidence: attach a level of confidence to each desideratum, tell me which one you would retreat from first, say which consideration or piece of evidence would change your verdict about the most discriminating requirement, and say where you think your reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A fiction writer working on a historical novel about a female disciple of Jesus (Galilean, fishing household, northern shore).
      *   **Task:** Define *desiderata* (requirements/criteria) for a method of reconstructing the historical Jesus suitable for *fiction writing* (character building, psychological arc, determinate actions) rather than academic history (monograph, probability surveys).
      *   **Specific Constraints & Questions to Address:**
          *   Fix the purpose: Character construction vs. Academic consensus. Are the standards the same?
          *   Adjudicate specific tensions: Silence/refusal vs. speech/action; Independence of method vs. circularity; Sources as interpretation vs. report; Community vs. Individual; Continuity (Jewish life) vs. Discontinuity (Movement/Execution).
          *   Audit the user's proposed criterion: "Narrative Fit" (actions follow from sayings, sayings from actions, no bridging motives needed).
          *   Identify incompatibilities: Which desiderata cannot be jointly satisfied?
          *   Identify the "killer" requirement: Which one excludes the most standard criteria (Embarrassment, Dissimilarity, Multiple Attestation, etc.)? Score them.
          *   Decision Rule: When probability is split (e.g., 40/60), what can a novelist do vs. dishonesty?
          *   Confidence & Self-Critique: Attach confidence levels, identify the first retreat, evidence that would change verdicts, and where reasoning might fail.
      *   **Tone:** Intellectual, rigorous, practical for a writer, honest about limitations, avoiding theological apologetics or skepticism, focusing on *methodology for characterization*.

  2.  **Deconstruct the Purpose (Fiction vs. History):**

      *   *History* seeks probability, nuance, and often embraces ambiguity ("we don't know").
      *   *Fiction* requires determinacy, agency, and internal consistency ("he did this because...").
      *   *Conclusion:* The standards are *not* the same. History can live with gaps; fiction must bridge them. However, fiction cannot violate known constraints without breaking verisimilitude. The method must yield *plausibility* rather than *probability*.

  3.  **Drafting the Desiderata (The Requirements):**

      *   *Requirement 1: Psychological Coherence (The "Why").* A character needs motives.
      *   *Requirement 2: Contextual Continuity (The "Where/Who").* He must be a 1st-century Jew, not a modern liberal or a medieval saint.
      *   *Requirement 3: Explanatory Power for the End (The "Outcome").* Why was he killed? Why did the movement survive?
      *   *Requirement 4: Source Transparency (The "What").* Acknowledging the theological filter of the Gospels.
      *   *Requirement 5: The Silence Constraint.* What he *didn't* say matters as much as what he did.

      *   *Adjudicating the User's Specific Tensions:*
          *   *Silence/Refusal:* Essential for fiction. A character defined only by positive assertions is flat.
          *   *Independence:* Total independence is impossible (hermeneutic circle). The requirement should be *reflexivity*, not independence.
          *   *Sources as Interpretation:* Must be treated as such. The "Jesus of the text" vs. "Jesus of history" gap is where the fiction lives.
          *   *Community:* Essential. You can't stage the protagonist without the chorus.
          *   *Continuity/Discontinuity:* Both needed. Continuity makes him real; discontinuity makes him dramatic.

  4.  **Auditing "Narrative Fit":**

      *   *Definition:* Actions and sayings must mutually imply each other without external bridging motives.
      *   *Verdict:* It's a valid *literary* criterion, but a dangerous *historical* one. History is messy; fiction is shaped.
      *   *Domain:* Trustworthy for *internal scene construction*, untrustworthy for *establishing historical fact*. It prevents "plot holes" in the biography, but might smooth over genuine historical contradictions that reveal character complexity.

  5.  **Identifying Incompatibilities (The "Impossible Trinity"):**

      *   *The Conflict:* High Contextual Continuity (he fits perfectly in Judaism) + High Explanatory Discontinuity (he caused a rupture leading to execution/new religion) + High Narrative Fit (smooth psychological arc).
      *   *Why:* If he fits *too* well, why was he killed? If he stands out *too* much, why did anyone follow him initially? If the narrative is *too* smooth, it ignores the chaos of the sources.
      *   *Selection:* Continuity vs. Discontinuity is the classic tension. I will frame it as *Contextual Plausibility* vs. *Causal Sufficiency for Execution*.

  6.  **The "Killer" Requirement & Scoring Criteria:**

      *   *Candidate:* **Explanatory Power for the Crucifixion.** (Why did Rome kill him *specifically*?)
      *   *Why:* Many criteria build a nice teacher or a wise sage. Few explain the cross.
      *   *Scoring:*
          *   Dissimilarity: Fails (makes him too weird to be killed by Rome, usually).
          *   Embarrassment: Good (explains the cross, but not the life).
          *   Multiple Attestation: Neutral (volume doesn't equal motive).
          *   Coherence: Weak (circular).
          *   Contextual Credibility: Strong (necessary for the political charge).

  7.  **Decision Rule for the Novelist:**

      *   *Scenario:* 40% vs. 60% probability.
      *   *Rule:* Choose the option that offers the highest *dramatic necessity* provided it doesn't violate *hard constraints* (anachronisms, known dates, geography).
      *   *Dishonesty Line:* Asserting as *fact* within the narrative voice what is known to be *contradicted* by strong evidence, or inventing motives that render the known actions impossible.
      *   *Legitimate Filling:* Internal monologue, private conversations, emotional texture.

  8.  **Confidence & Self-Critique:**

      *   Need to be humble. Historical Jesus studies are a minefield.
      *   *Highest Confidence:* Contextual Continuity (we know 1st C. Galilee well).
      *   *Lowest Confidence:* Psychological Motives (ancient minds are foreign).
      *   *First Retreat:* Narrative Fit (history is often inconsistent).
      *   *Reasoning Failure:* Projecting modern individualism onto a collectivist culture.

  9.  **Refining the Output (Reviewing against constraints):**

      *   *Did I answer the specific questions?* Yes (Silence, Independence, Community, Continuity/Discontinuity).
      *   *Is the tone right?* Needs to be authoritative but collaborative, respecting the writer's craft.
      *   *Did I audit "Narrative Fit"?* Yes.
      *   *Did I identify the incompatibility?* Yes.
      *   *Did I score the standard criteria?* Yes.
      *   *Did I give the decision rule?* Yes.
      *   *Did I mark confidence?* Yes.

  10. **Final Polish:** Ensure the distinction between "Historian's Jesus" and "Novelist's Jesus" is clear. The historian hedges; the novelist commits. The method must support commitment without lying. (Self-Correction: Make sure to explicitly address the "independence of method" question as requested).

      *(Self-Correction during drafting)*: I need to be careful not to give theological answers. I am providing a *methodological framework* for a writer. The "Truth" here is narrative truth grounded in historical plausibility.

      *(Refining the "Narrative Fit" audit)*: I should call it a "Literary Validity" check rather than a historical one. It ensures the character works, not that the history is perfect.

      *(Refining the "Killer Requirement")*: "Causal Sufficiency for State Execution" is more precise than just "Explanatory Power."

      *(Refining the Decision Rule)*: Distinguish between *narrative voice* (which can be uncertain) and *scene action* (which must be definite).

      *(Final check on constraints)*: "Mark it either non-negotiable or a preference." I need to label each desideratum clearly.

      Let's assemble the response.

      *Structure:*
      1.  Introduction: Purpose (Fiction vs. History).
      2.  Desiderata (with labels and rationales).
      3.  Audit of "Narrative Fit".
      4.  The Incompatibility (The Impossible Trinity).
      5.  The Killer Requirement & Scoring Table.
      6.  Decision Rule for the Novelist.
      7.  Confidence & Self-Critique.

      *Tone Check:* The prompt is sophisticated ("probability mass," "desiderata," "retouched by Christian hands"). The response must match this register. Avoid simplification.

      *Specific Adjudications:*
      *   Silence: Non-negotiable (Character depth).
      *   Independence: Preference (Reflexivity is better).
      *   Sources as Interpretation: Non-negotiable (Historical reality).
      *   Community: Non-negotiable (Ensemble cast).
      *   Continuity/Discontinuity: Non-negotiable (Both needed).

      *Let's write.*
answer: |-
  This is a problem of *verisimilitude under constraint*. The historian's goal is to map the boundaries of the probable; your goal is to inhabit a single point within those boundaries and make it breathe. The historian can say, "Jesus may have intended X, or perhaps Y." You must write: "He intended X."

  Therefore, the standards are not the same. A monograph survives on nuance; a novel collapses without commitment. However, your commitment must not violate the structural load-bearing walls of the period. Below are the desiderata for a method suited to characterization, followed by the audit and decision rules you requested.

  ### I. Desiderata for a Novelist's Method

  **1. The Constraint of Contextual Continuity (Non-Negotiable)**
  *   **Case:** The protagonist must be intelligible as a first-century Galilean Jew. His categories (purity, kingdom, torah, spirit) must match his milieu. If his thoughts are indistinguishable from a twentieth-century liberal humanist, the reader's trust breaks.
  *   **Adjudication:** This is the floor. You cannot invent a psychology that requires concepts unavailable to the time.
  *   **Confidence:** High. We have robust data on Second Temple Judaism.

  **2. The Constraint of Causal Sufficiency for Execution (Non-Negotiable)**
  *   **Case:** Whatever portrait you build, it must explain why Rome crucified him. A teacher of parables is not crucified; a claimant to authority in a volatile province is. The method must yield a motive for the state's violence that fits Roman administrative practice.
  *   **Adjudication:** This is the ceiling. If your character's actions do not logically terminate in a cross, you are writing a different story.
  *   **Confidence:** High. Roman punitive logic is well-documented.

  **3. The Requirement of Ensemble Coherence (Non-Negotiable)**
  *   **Case:** You cannot stage the protagonist without the chorus. The method must recover the *disciples' expectations* as distinct from the *protagonist's intentions*. The friction between what the fisherman expects (warrior king) and what the preacher intends (suffering servant, or something else) is your dramatic engine.
  *   **Adjudication:** A method that isolates the individual from the movement fails the novelist. You need the gap between leader and followers to create conflict.
  *   **Confidence:** Medium-High. The Gospels preserve this friction even if they smooth it theologically.

  **4. The Requirement of Reflexivity over Independence (Preference)**
  *   **Case:** You asked if a method can be independent of the historian's prior portrait. It cannot. All criteria are hermeneutical circles. Demanding independence leads to paralysis.
  *   **Adjudication:** Require *reflexivity* instead. The method must force you to state *why* you chose a tradition. "I choose this saying because it fits the arc of his disillusionment with the Temple," is valid. "I choose this because it is authentic," is circular.
  *   **Confidence:** High. Philosophical honesty is required for artistic integrity.

  **5. The Constraint of Silence and Refusal (Non-Negotiable)**
  *   **Case:** You asked if a method owes you data on what he did *not* say. Yes. A character defined only by positive assertions is a mouthpiece, not a person. The method must identify "redactional silences"—topics the evangelists suppress or deflect.
  *   **Adjudication:** If the sources are silent on his view of Gentiles until the very end, you must decide if that silence was his (indifference) or theirs (later theology). You must commit.
  *   **Confidence:** Medium. Speculative, but necessary for depth.

  **6. The Requirement of Source Transparency (Preference)**
  *   **Case:** The sources are interpretations, not transcripts. A method must distinguish between the *event* and the *theological memory of the event*.
  *   **Adjudication:** You need to know when a scene is a post-resurrection projection (e.g., explicit claims to divinity early in the ministry) so you can decide whether to stage it as the character's secret thought or the narrator's later understanding.
  *   **Confidence:** High. Critical scholarship is settled on the theological nature of the Gospels.

  ---

  ### II. Audit of "Narrative Fit"

  **Your Criterion:** *A reconstruction is adequate only if the actions I need to stage follow from the sayings I attribute to him, and those sayings from those actions, without my having to supply a bridging motive that the sources nowhere suggest.*

  **Verdict:** This is a **Literary Validity** check, not a Historical Authenticity check. It is a genuine desideratum for *you*, but it has a narrow domain of trustworthiness.

  *   **Where it is trustworthy:** In scene construction. If you have him cleanse the Temple, he cannot immediately afterward preach a sermon on quietist submission without a bridging motive (e.g., irony, despair, tactical shift). "Narrative Fit" prevents your character from suffering from multiple personality disorder.
  *   **Where it fails:** History is often inconsistent. Real people contradict themselves. If you enforce perfect "Narrative Fit," you risk sanitizing the jagged edges of a real life that might actually explain the sources' contradictions. The evangelists may preserve contradictions *because* they were there, not because they forgot to smooth them.
  *   **Ruling:** Adopt it as a **craft constraint**, not a historical one. Use it to ensure your *portrayal* is coherent, but do not use it to reject historical data that feels disjointed. The disjointedness may be the most authentic thing you have.

  ---

  ### III. The Impossible Trinity (Incompatibilities)

  You asked which subset of desiderata cannot be jointly satisfied. I suspect you cannot maximize all three of the following simultaneously:

  1.  **High Contextual Continuity** (He is a typical Jew of his time).
  2.  **High Narrative Fit** (His life forms a smooth, psychologically consistent arc).
  3.  **High Causal Sufficiency for Execution** (He does something specific enough to get killed by Rome).

  **Why:**
  If he is **typical** (1), thousands of other Jews said similar things without being crucified. To explain the execution (3), you must make him distinct or threatening. But if you make him distinct enough to be killed, you risk breaking **Continuity** (making him a Christian avant la lettre) or breaking **Narrative Fit** (making his escalation seem sudden or erratic rather than a smooth arc).

  **Recommendation:** Sacrifice **Narrative Fit**. Allow your character to be inconsistent. Let him hope for a political restoration in Galilee while preaching a spiritual kingdom in Judea, and let the confusion among his followers (including your narrator) be the point. Inconsistency is more human than smoothness.

  ---

  ### IV. The Killer Requirement & Scoring

  The single requirement that does the most work in excluding standard criteria is **Causal Sufficiency for Execution**. Most criteria build a teacher; only this one builds a victim of the state.

  | Criterion | Score (1-5) | Reason for Score |
  | :--- | :---: | :--- |
  | **Causal Sufficiency** | **5** | **The Killer.** If it doesn't explain the cross, it's a biography of a rabbi, not Jesus. |
  | **Contextual Continuity** | 5 | Essential for setting, but doesn't distinguish him from other Pharisees/prophets. |
  | **Embarrassment** | 3 | Good for the Passion (crucifixion is embarrassing), weak for the ministry (why was he followed?). |
  | **Dissimilarity** | 1 | **Actively Harmful.** Makes him unique among Jews, which explains why Jews didn't follow him, but fails to explain why Rome cared. |
  | **Multiple Attestation** | 2 | Establishes volume, not motive. A lie can be attested in four gospels. |
  | **Semitic/Palestinian** | 3 | Establishes origin, not outcome. A bandit speaks Aramaic too. |
  | **Coherence** | 2 | Circular. Confirms what you already decided. |

  **Winner:** **Causal Sufficiency.** It forces you to move beyond "what did he say?" to "what did his enemies hear?"

  ---

  ### V. Decision Rule for the Author

  **Scenario:** The best-supported reconstruction carries 40% probability; alternatives carry 30% and 30%. The alternatives are not dramatically worse.

  **The Rule:** **Choose the option that maximizes Dramatic Necessity, provided it does not violate Hard Constraints.**

  1.  **Hard Constraints (The "Do Not Cross" Line):** Chronology, geography, known historical figures (Pilate, Caiaphas, Tiberius), and the outcome (Crucifixion). If a choice makes these impossible, it is dishonest.
  2.  **Legitimate Filling-In:** Internal monologue, private conversations, emotional motivation, and the *sequence* of ambiguous events.
  3.  **Dishonesty:** Asserting as *narrative fact* something that is *historically impossible* (e.g., he read Greek philosophy; he explicitly renounced Jewish law in public before the Trial).
  4.  **The 40% Choice:** If Option A (40%) makes for a better story than Option B (30%), take Option A. But **signal the uncertainty** through the narrator.
      *   *Bad:* "He knew he would die on Friday."
      *   *Good:* "Looking back, we thought he knew. But in the moment, his hands shook as he broke the bread."
      *   *Why:* This preserves historical plausibility (he probably didn't know) while serving the narrative (the narrator interprets it as knowledge).

  **Where Filling-in becomes Dishonest:** When you invent a motive that renders the *known actions* of others inexplicable. If you decide Jesus was purely pacifist, but you have him carry a sword in Gethsemane without explanation, you have broken the contract. You must either change the action (no sword) or explain the motive (he took it to throw it away).

  ---

  ### VI. Confidence & Self-Critique

  **Confidence Levels:**
  *   **Contextual Continuity:** 90% (We know the era well).
  *   **Causal Sufficiency:** 80% (We know Roman procedure, less about specific provocation).
  *   **Ensemble Coherence:** 70% (Disciples' psychology is inferred).
  *   **Silence/Refusal:** 50% (Highly speculative).
  *   **Narrative Fit:** 40% (As a historical tool; high as a literary tool).

  **First Retreat:**
  I would retreat from **Narrative Fit** first. If the historical data suggests a jagged, contradictory progression, I would follow the data. A contradictory character is more compelling than a smooth fiction.

  **Evidence That Would Change My Verdict:**
  The discovery of a non-Christian, contemporary account of Jesus (e.g., a fuller Pilate report or a Galilean diary). This would shift the weight from *sociological reconstruction* to *event verification*, collapsing the need for "Causal Sufficiency" as a proxy for truth.

  **Where My Reasoning is Most Likely to Fail:**
  **Psychological Projection.** I am assuming a modern concept of "individual agency" applies to a first-century collectivist culture. Your narrator is a woman from a fishing household; her worldview is likely communal, honor-based, and spiritually porous. If I advise you to give Jesus a "psychological arc" in the modern sense (internal growth, self-actualization), I may be leading you to anachronism.
  *Correction:* Frame his arc not as "self-discovery" but as "faithfulness to a call" or "escalation of commitment." The tension should be between his duty to God and his duty to his kin, not between his "true self" and his "public mask."

  **Final Advice:**
  You are not writing a biography. You are writing a memory. Your narrator is looking back from a later date (post-resurrection, post-Pentecost, or post-destruction of the Temple). Use that. Let her uncertainty be your hedge. "We thought he meant X, but perhaps he meant Y." This allows you to stage the determinate scene while acknowledging the historical ambiguity. It turns the historian's problem into the narrator's virtue.
