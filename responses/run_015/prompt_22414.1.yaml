answer: |-
  The standard narrative in decision theory often presents the Dutch-book argument (DBA) as a foundational justification for the axioms of Expected Utility (EU) theory. Specifically, dynamic Dutch-book arguments (or money pumps) are frequently invoked to defend the Sure-Thing Principle (STP), suggesting that violating STP renders an agent susceptible to a sequence of trades that guarantees a loss. However, this narrative overextends the reach of the DBA. While the DBA effectively rules out incoherent preferences that lead to statewise dominated outcomes on a fixed partition, it fails to justify the full Expected Utility Theorem. The argument falls short because it cannot address non-EU preferences that remain coherent, it presupposes a static state space that real-world acts often alter, and it collapses when utility or costs are state-dependent.

  ### 1. The DBA Only Targets Statewise Dominance, Not Linearity
  The primary function of a Dutch-book argument is to demonstrate **coherence**, not **linearity**. A Dutch book shows that if an agent's betting quotients or preferences violate the axioms of probability (or STP), they can be forced into a "sure loss"—a package of bets that yields a negative payoff in every possible state of the world.

  However, the Expected Utility Theorem requires more than just the avoidance of sure losses; it requires that preferences satisfy the **Independence Axiom**, implying that value aggregates linearly across probabilities. There exist coherent decision models that avoid Dutch books (and thus satisfy a version of the STP regarding dominance) but violate Expected Utility.

  For example, **Rank-Dependent Utility (RDU)** or **Maximin** preferences can be formulated such that the agent never accepts a statewise dominated act. An RDU agent weights probabilities non-linearly (e.g., overweighting small probabilities), which leads to violations of the Independence Axiom (such as the Allais Paradox), yet they do not necessarily accept a package of bets that guarantees a loss in every state. Since the DBA only penalizes preferences that result in a guaranteed loss (dominance violations), it lacks the normative force to rule out non-linear probability weighting. Therefore, the DBA for STP justifies avoiding stupidity (dominance), but it does not justify the specific structural constraint of Expected Utility maximization.

  ### 2. The Assumption of a Fixed State Space
  The Dutch-book argument for the Sure-Thing Principle relies heavily on the Savage framework, where acts are defined as functions mapping a fixed, exogenous set of states $S$ to consequences. The STP asserts that if an agent prefers act $f$ to $g$ regardless of which state in a partition obtains, they should prefer $f$ to $g$ unconditionally. The DBA supports this by showing that violating this preference order allows a bookie to construct a dominated package.

  This logic crumbles when acts are **endogenous**, meaning the choice of act can alter the state space itself. In many significant decisions (e.g., launching a nuclear deterrent, undergoing a transformative medical procedure, or making a binding commitment), the act does not merely reveal a pre-existing state; it creates new states or eliminates old ones.

  If act $f$ creates a state $s_{new}$ that is impossible under act $g$, the condition "holding the state constant" required by the STP becomes ill-defined. One cannot compare the outcome of $f$ and $g$ "given state $s_{new}$" because $g$ is not defined on $s_{new}$. Consequently, the concept of a "statewise dominated package" loses its meaning because there is no common domain over which to calculate the dominance. Since the DBA relies on summing losses across a fixed set of mutually exclusive states, it cannot rule out preferences over acts that change the ontology of the decision problem. A rational agent might prefer an act that alters the state space (e.g., eliminating the possibility of a catastrophic war) even if that preference cannot be represented as maximizing expectation over a fixed prior partition.

  ### 3. The Problem of State-Dependent Costs and Utilities
  The most technical failure of the DBA in justifying the full EU theorem concerns **state-dependent utility**. The standard DBA assumes that the unit of account (usually money) has a stable utility value across all states. It assumes that losing \$100 in state $s_1$ is comparable to losing \$100 in state $s_2$.

  However, in reality, the marginal utility of consequences is often state-dependent. For example, the utility of money is fundamentally different in the state "alive" versus the state "dead," or in the state "healthy" versus "chronically ill." When utility is state-dependent, the betting odds revealed by an agent conflate their subjective probability of the state with their marginal utility in that state.

  If an agent refuses a bet not because they think the event is unlikely, but because the payoff is worthless in that state (e.g., refusing a payout contingent on being hospitalized because they value money less while hospitalized), a bookie might interpret this as a probability violation. However, the agent is not incoherent; they are accounting for state-dependent costs.

  Because the DBA cannot disentangle probability ($P$) from state-dependent utility ($U_s$), it fails to uniquely identify the subjective probabilities required for the Expected Utility representation ($ \sum P(s) U(c) $). Without unique probabilities, the EU theorem is not identifiable. An agent could have preferences that look like a Dutch-book violation from the perspective of a state-independent observer, but are actually rational maximizations of state-dependent utility. Therefore, the DBA cannot normatively compel an agent to adopt state-independent EU maximization, as it cannot distinguish between "irrational probability assessment" and "rational state-dependent valuation."

  ### Conclusion
  The Dutch-book argument for the Sure-Thing Principle is a powerful tool for establishing **minimal rationality**—specifically, the avoidance of self-defeating, statewise dominated choices. However, it is insufficient to justify the **full Expected Utility Theorem**. It fails to rule out coherent non-EU preferences (like Rank-Dependent Utility) that do not incur sure losses. It fails to apply to decisions where acts modify the state space, rendering the "fixed partition" requirement obsolete. Finally, it fails to account for state-dependent costs, where the metric of "loss" varies across states, breaking the link between monetary Dutch books and utility coherence. Thus, while the DBA protects an agent from being a "money pump," it does not prove they must be an "expected utility maximizer."
