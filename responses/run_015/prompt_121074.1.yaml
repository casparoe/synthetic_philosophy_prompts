  ### Session Plan: The Underdetermination of Geometric Probability

  #### 1. The Ordering Decision: Geometry First, Principle Second
  **You must begin with the Geometric Constructions (the physical scenario), not the Principle of Indifference (PoI).**

  **Why this ordering determines Paradox vs. Ambiguity:**
  *   **PoI First (The Logical Trap):** If you state the PoI as an axiom ("When ignorant, assign equal probability") and *then* apply it to the geometry, students experience a **Logical Paradox**. They see valid reasoning from accepted premises yielding a contradiction ($1/3 \neq 1/2$). This frames the problem as a failure of *rationality* or probability theory itself.
  *   **Geometry First (The Modeling Crisis):** If you present the physical scenario and ask for a model, students experience **Ambiguity**. They tend to resolve this by saying, "The question was vague; we need more experimental details." This allows them to dismiss the contradiction as a semantic error rather than a foundational problem.

  **Why Geometry First is correct for *this* audience:**
  Your students believe "uniform distribution" is an objective feature of physical space. If you start with PoI (an epistemic rule), you validate their bias that the rule dictates the physics. By starting with the **Geometry**, you force them to generate the parameterizations themselves. When *their* physical intuitions lead to contradictory probabilities despite identical states of ignorance, the "Ambiguity" transforms into a **Scientific Paradox**: *Why does our standard modeling tool (PoI) fracture when applied to physical space?* This targets their specific misconception (that uniformity is physical) rather than a general logical one.

  **How to prevent it from collapsing into mere Ambiguity:**
  To ensure they experience this as a paradox and not just a vague question, you must intervene *after* they derive the different answers. Do not let them say, "We just defined 'random' differently." Instead, point out: *"You all claimed to be maximally ignorant. You all invoked the same intuition (symmetry/uniformity). You all modeled the 'same' physical setup. How can rational ignorance yield contradictory physical predictions?"* This forces the contradiction back onto the Principle, not just the wording.

  ---

  #### 2. The Carrying Example: The Random Line Through a Square
  Avoid the circle. Use a **Unit Square** with a **concentric inner Square** (side length $1/2$).
  **Problem:** "A line is drawn 'at random' across the unit square. What is the probability it intersects the inner square?"

  **The Three Constructions (Assign to small groups):**
  1.  **The Midpoint Method:** Assume the *midpoint* of the chord is uniformly distributed over the area of the outer square. (Prob = Area Ratio = $1/4$).
  2.  **The Distance Method:** Assume the *perpendicular distance* from the center is uniformly distributed. (Requires calculus, yields a different answer).
  3.  **The Endpoint Method:** Assume the *endpoints* on the perimeter are uniformly distributed. (Yields yet another answer).

  **Why this works:** It removes circular symmetry (which students often hide behind) and forces them to confront that "random line" is not a primitive physical object but a constructed measure.

  ---

  #### 3. The Arc of Misconceptions & Interventions
  You must head off three specific misconceptions in sequence. If you address them out of order, the lesson fails.

  **Misconception 1: "Uniformity is Physical" (The Objective Bias)**
  *   *When it forms:* Immediately upon seeing the problem statement. They assume nature "picks" uniformly.
  *   *Intervention Point:* **Before calculations begin.** Ask: *"What physical mechanism generates this line? A spinning ruler? A thrown stick? A laser from a random angle?"*
  *   *Goal:* Make them admit that different *causal processes* yield different measures. This breaks the idea that "uniform" is a property of the space itself.

  **Misconception 2: "Subjectivity is Arbitrariness" (The Pejorative View)**
  *   *When it forms:* After revealing the contradictory answers. They conclude probability is "just opinion."
  *   *Intervention Point:* **During the PoI reveal.** Show that they didn't choose arbitrarily; they chose based on *symmetry arguments* (e.g., "There's no reason to prefer left over right").
  *   *Goal:* Reframe subjectivity from "whim" to "underdetermined modeling choice." The problem isn't that they have opinions; it's that their *ignorance* is insufficient to select a unique measure.

  **Misconception 3: "Parameterization Eliminates Ambiguity" (The Fixation)**
  *   *When it forms:* At the end. They think, "Okay, we just need to agree to use the Midpoint Method."
  *   *Intervention Point:* **The Final Check.** Show that picking a parameter is a *physical assumption*, not a mathematical cleanup.
  *   *Goal:* Ensure they understand that choosing a parameter is equivalent to positing a physical generating mechanism.

  ---

  #### 4. The Final Check: The Asteroid Impact
  Do not use the circle or the stick again. Use a **3D Projection Problem**.

  **The Scenario:**
  "An asteroid is on a collision course with Earth (modeled as a perfect sphere). We are maximally ignorant of its trajectory, other than that it will hit. What is the probability it lands in the Northern Hemisphere?"

  **The Trap:**
  *   **Intuition A:** "Uniform on the Surface." (Prob = $1/2$).
  *   **Intuition B:** "Uniform on the Projected Disk." (Think of the Earth as a target from the asteroid's perspective). The area element on a sphere is $dA \propto \sin(\theta) d\theta d\phi$, but the projected area is uniform in $r$.
  *   **The Question:** *"If we apply the Principle of Indifference to the **projected disk** (the 'shadow' of the Earth), does the probability remain $1/2$?"*

  **Why this reveals understanding:**
  If they grasp the lesson, they will recognize that "Uniform on Disk" $\neq$ "Uniform on Sphere." They must identify that the *privileged parameterization* depends on the **physical source of the randomness** (e.g., is the asteroid coming from a uniform flux in space? Then the disk measure is correct. Is it being picked from a catalog of surface coordinates? Then the surface measure is correct). If they simply say "It's $1/2$ because of symmetry," they have missed the underdetermination lesson.

  ---

  #### 5. The Explicit Refusal: Setting Boundaries
  You must refuse to resolve the paradox. If you solve it, you validate the idea that there *is* a solution to be found, rather than a structural feature of modeling.

  **What to Refuse:**
  1.  **Jaynes's Transformation Group Argument:** (The claim that symmetry groups dictate the unique measure).
  2.  **Measure-Theoretic Foundations:** (Sigma algebras, Borel sets).
  3.  **The Epistemic/Physical Distinction:** (Don't solve whether probability is "in the mind" or "in the world").

  **How to Frame the Refusal:**
  Do not say, *"That's too advanced for this session."* This frames it as a gap in *their* knowledge or *your* time.
  Instead, say:
  > *"We are stopping here not because the math ends, but because the **philosophical work begins**. Solutions like Jaynes's or measure theory attempt to **dissolve** the paradox by finding a 'correct' measure. But our goal is to sit with the **underdetermination**. In scientific practice, we often lack the symmetry groups or the measure-theoretic luxury. We have to justify our parameterization physically. If I resolve this for you now, I validate the hope that there is a 'true' geometry of randomness. There isn't. There is only the model you can justify."*

  **Why this works:** It frames the lack of resolution as a **feature of the discipline** (Philosophy of Science), not a limitation of the classroom. It empowers them to treat the ambiguity as a site of inquiry rather than an error to be fixed.

  ### Summary of the Arc
  1.  **Geometry First:** Elicit physical intuitions $\rightarrow$ Generate Contradiction.
  2.  **PoI Second:** Reveal the common epistemic rule driving the contradiction.
  3.  **Misconception Check:** Move from "Physics is Uniform" $\rightarrow$ "Modeling is Underdetermined."
  4.  **Asteroid Check:** Test application on a new manifold (Sphere vs. Disk).
  5.  **Refusal:** Frame the unresolved tension as the core philosophical lesson.
