prompt: |-
  I'm on the committee drafting this year's philosophy PhD comprehensive exam, and after a long discussion with a colleague who writes about multi-agent alignment and contractualist ethics, I want a question that forces candidates to do more than recite the standard aggregation objection to Scanlon. The exam should ask students to work through a rarely emphasized crux: whether the aggregation problem in contractualism is fundamentally a failure of summing comparable harms, or whether it runs deeper—whether Scanlon's pairwise justification structure breaks down when affected parties present structurally heterogeneous complaints that resist translation onto any common metric, such as one party suffering bodily deprivation while another suffers a dignity-based exclusion that is not reducible to welfare loss. Candidates should be asked to evaluate whether the reasonable-rejection criterion can generate a single principle in such cases without either collapsing into utilitarian aggregation or allowing every principle to be vetoed by some party with an incommensurable grievance, and whether this reveals a boundary in contractualism's account of wrongness rather than merely a practical difficulty in applying it.

  Please design one 90-minute essay question worth 25 marks for a closed-book exam at the PhD level. Include a model answer that identifies the five essential philosophical moves a top response must make—each tied to the architecture of pairwise justification, the incommensurability challenge, and the distinction between practical aggregation failure and structural justification failure—along with a marking scheme that assigns specific marks to each move totaling 25, plus a one-line note on the characteristic mistake that costs candidates points on each item. The difficulty must come from the conceptual crux, not from obscure references: a student who has only memorized textbook labels should be unable to answer well, but a student who genuinely understands how individual reasonableness operates should be able to reason through the heterogeneous-complaint scenario on the fly. Do not ask for bibliographies, citation lists, or page references.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy PhD Comprehensive Exam Committee.
      *   **Topic:** T.M. Scanlon's Contractualism, specifically the aggregation problem.
      *   **Specific Focus:** Move beyond the standard "summing harms" objection. Focus on *structurally heterogeneous complaints* (e.g., bodily deprivation vs. dignity-based exclusion) that resist a common metric.
      *   **Core Question:** Does the reasonable-rejection criterion break down here? Does it collapse into utilitarianism or lead to veto paralysis? Is this a boundary of wrongness or just a practical difficulty?
      *   **Format:** One 90-minute essay question, 25 marks.
      *   **Requirements:** Model answer identifying 5 essential philosophical moves. Marking scheme assigning marks to each move (total 25). One-line note on characteristic mistakes for each. Closed-book. No bibliographies/citations.
      *   **Difficulty:** Conceptual, not bibliographic. Tests understanding of individual reasonableness vs. memorized labels.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Standard Aggregation Objection:* Scanlon says we compare individual complaints pairwise. If one person loses a life vs. many people lose a finger, the single life loss is stronger. Critics say this ignores the moral force of numbers.
      *   *The "Deeper" Crux:* What if the complaints aren't just different *magnitudes* of the same thing (welfare), but different *kinds* of things (welfare vs. dignity/status)?
      *   *Pairwise Justification:* Scanlon's method relies on comparing Person A's reason to reject Principle P vs. Person B's reason to reject Principle P'.
      *   *Incommensurability:* If A's complaint is "I starve" and B's complaint is "I am disrespected," how do we weigh them pairwise?
      *   *The Dilemma:*
          1.  If we force a comparison, do we implicitly create a common metric (collapsing into consequentialism/welfarism)?
          2.  If we don't, does every distinct type of harm grant a veto (paralysis)?
      *   *Structural vs. Practical:* Is this a bug in the theory of *wrongness* (contractualism can't define wrongness here) or just hard to apply?

  3.  **Drafting the Question:**
      *   Needs to be precise but open enough for argumentation.
      *   Needs to set up the scenario clearly without giving away the answer.
      *   *Draft:* "Scanlon's contractualism relies on pairwise comparison of reasons for rejection. Consider a case where one group faces bodily harm and another faces status degradation. Can these be compared? Does this break the theory?" -> *Refining for PhD level:* Make it more formal. Focus on the "structural heterogeneity" of complaints.
      *   *Key terms to include:* Pairwise justification, reasonable rejection, incommensurability, aggregation, structural failure vs. practical difficulty.

  4.  **Developing the Model Answer (The 5 Moves):**
      *   *Move 1: Reconstruction of Pairwise Comparison.* Must explain *how* Scanlon intends comparisons to work (individual vs. individual, not group vs. group).
      *   *Move 2: The Nature of Heterogeneity.* Must distinguish between magnitude differences (finger vs. life) and kind differences (welfare vs. dignity). This is the core prompt requirement.
      *   *Move 3: The Metric Dilemma.* Analyze the risk of imposing a common currency. If we compare them, are we secretly doing utilitarianism?
      *   *Move 4: The Veto/Paralysis Risk.* If we *don't* compare them, does every unique grievance block agreement? How does Scanlon handle "generic reasons"?
      *   *Move 5: Verdict on Wrongness.* Conclude on whether this is a limit of the theory's definition of wrongness or just an application hurdle. (e.g., Does contractualism require a prior theory of value?)

  5.  **Designing the Marking Scheme:**
      *   Total 25 marks.
      *   Distribute across the 5 moves (5 marks each seems logical and clean).
      *   Define "Characteristic Mistake" for each.

  6.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I address the "multi-agent alignment" colleague's influence? Yes, the heterogeneous complaint scenario mirrors alignment problems where objectives aren't easily comparable.
      *   *Check:* Is it too bibliographic? No, I will explicitly forbid citations and focus on argument structure.
      *   *Check:* Is the distinction between "practical" and "structural" clear? I need to ensure the model answer highlights this.
      *   *Check:* Time limit. 90 minutes for 25 marks is reasonable for a deep dive into one question.
      *   *Tone:* Academic, rigorous, precise.

  7.  **Finalizing the Question Text:**
      *   "Scanlon's formulation of contractualism..."
      *   "Suppose a principle imposes..."
      *   "Evaluate whether..."
      *   Ensure the prompt explicitly asks about the *boundary of wrongness*.

  8.  **Finalizing the Model Answer & Marking:**
      *   Ensure the 5 moves are distinct but interconnected.
      *   Make sure the "mistake" notes are punchy and diagnostic.

      *(Self-Correction during drafting the moves)*:
      *   Move 1: Setup.
      *   Move 2: The Incommensurability Challenge.
      *   Move 3: The Aggregation/Collapse Risk.
      *   Move 4: The Generic Reasons/Standards Solution (Scanlon's defense).
      *   Move 5: Meta-ethical Conclusion (Structural vs. Practical).

      *Wait, I need to make sure the marks add up to 25.* 5 moves x 5 marks = 25. Perfect.

      *Refining the "Mistake" notes:*
      *   Move 1 Mistake: Treating it as group aggregation.
      *   Move 2 Mistake: Conflating kind-difference with magnitude-difference.
      *   Move 3 Mistake: Assuming comparison *entails* consequentialism.
      *   Move 4 Mistake: Ignoring the role of 'generic reasons'.
      *   Move 5 Mistake: Dismissing the problem as merely epistemic.

  9.  **Final Review against Constraints:**
      *   90-minute essay? Yes.
      *   25 marks? Yes.
      *   Closed-book? Yes.
      *   No bibliographies? Yes.
      *   5 Essential Moves? Yes.
