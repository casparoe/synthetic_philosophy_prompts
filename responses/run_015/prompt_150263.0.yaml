answer: |-
  **PHILOSOPHY PhD COMPREHENSIVE EXAMINATION**
  **SECTION: MORAL AND POLITICAL THEORY**
  **TIME ALLOWED: 90 MINUTES**
  **TOTAL MARKS: 25**

  **INSTRUCTIONS:**
  Answer the following question in essay format. Your response will be evaluated on the rigor of your argumentation, your grasp of the structural commitments of contractualism, and your ability to navigate the theoretical tensions described. Do not provide bibliographies, citation lists, or page references. Focus on the philosophical architecture of the position.

  ***

  **QUESTION 1**

  Scanlon's contractualism grounds wrongness in the inability to justify a principle to others on grounds they could not reasonably reject. This justification procedure relies on a pairwise comparison of individual complaints: when assessing a principle, we compare the strongest individual reason for rejection against the strongest individual reason for acceptance (or the strongest competing individual reason for rejection).

  Consider a scenario involving a structural choice between two principles. Under Principle A, a specific individual suffers severe bodily deprivation (e.g., chronic pain or malnutrition). Under Principle B, a different specific individual suffers a status-based exclusion that undermines their standing as a moral equal (e.g., systematic disenfranchisement or expressive subordination), but entails no direct welfare loss comparable to bodily pain. Assume these complaints are *structurally heterogeneous*: they derive from distinct normative sources (well-being vs. status) and resist translation onto a single metric of "burden."

  Write an essay evaluating whether Scanlon's pairwise justification framework can adjudicate this conflict without theoretical collapse. Your essay must address:
  1.  How the pairwise structure handles complaints that lack a common metric of magnitude.
  2.  Whether forcing a comparison implicitly reintroduces the aggregative consequentialism contractualism seeks to avoid.
  3.  Whether the inability to compare leads to a veto paralysis where every heterogeneous grievance blocks agreement.
  4.  Whether this difficulty represents a merely practical epistemic limit or a structural boundary in contractualism's account of wrongness.

  ***

  **MODEL ANSWER GUIDE & MARKING SCHEME**

  **Examiner's Note:** The following five moves constitute the essential architecture of a top-tier response. Marks are awarded for the successful execution of each move. A candidate may argue for or against Scanlon's success, provided the argument demonstrates the required structural understanding.

  **Total Marks: 25**

  ### **Move 1: Reconstruction of the Pairwise Constraint (5 Marks)**
  **Requirement:** The candidate must accurately reconstruct Scanlon's prohibition on aggregating benefits/burdens across persons. They must explain that contractualism compares the *strongest individual complaint* against the *strongest individual counter-complaint*, not the sum of group burdens. They must identify that standard aggregation objections (e.g., many fingers vs. one life) rely on comparable magnitudes, whereas the prompt introduces *incommensurable kinds*.
  *   **5 Marks:** Clear distinction between aggregating across persons (forbidden) and comparing individual reasons (required). Explicitly notes that standard objections assume a common currency of welfare which the prompt denies.
  *   **4 Marks:** Correctly explains pairwise comparison but treats the heterogeneous case as merely a difficult magnitude comparison.
  *   **3 Marks:** Vague on pairwise mechanics; conflates individual comparison with group utility.
  *   **0-2 Marks:** Fundamental misunderstanding of the reasonable rejection criterion.
  *   **Characteristic Mistake:** Treating the pairwise comparison as a disguised form of group utilitarianism rather than a constraint on justification.

  ### **Move 2: Analysis of Normative Incommensurability (5 Marks)**
  **Requirement:** The candidate must analyze the specific challenge of "structural heterogeneity." They must argue whether a bodily complaint and a status complaint can be weighed against one another without a higher-order metric. This involves discussing whether "reasonableness" presupposes a shared conception of the good or if it operates purely procedurally.
  *   **5 Marks:** Identifies that without a common metric, the "strength" of a reason becomes indeterminate. Distinguishes between *ontological* incommensurability (no fact of the matter) and *epistemic* difficulty (hard to know).
  *   **4 Marks:** Acknowledges the difference between welfare and status but assumes they can be ranked by intuition alone without theoretical cost.
  *   **3 Marks:** Dismisses the heterogeneity, asserting all harms reduce to welfare or autonomy automatically.
  *   **0-2 Marks:** Fails to engage with the specific nature of the heterogeneous complaints.
  *   **Characteristic Mistake:** Conflating kind-difference (welfare vs. status) with magnitude-difference (pain vs. severe pain).

  ### **Move 3: The Collapse Dilemma (5 Marks)**
  **Requirement:** The candidate must evaluate the risk of "consequentialist collapse." If the candidate argues the complaints *can* be compared, they must explain how this avoids positing a hidden common currency (which would mimic utilitarianism). If they argue they *cannot* be compared, they must explain how this preserves contractualism's distinctiveness.
  *   **5 Marks:** Articulates the dilemma: To compare is to risk a hidden metric (collapse); to not compare is to lose decision procedure (paralysis). Evaluates whether 'generic reasons' can bridge the gap without a metric.
  *   **4 Marks:** Identifies the risk of collapse but does not fully explore the mechanism of how a metric would be implicitly introduced.
  *   **3 Marks:** Asserts collapse is inevitable (or impossible) without argumentative support.
  *   **0-2 Marks:** Ignores the relationship between comparison and consequentialist aggregation.
  *   **Characteristic Mistake:** Assuming that any rational comparison necessarily entails a single maximand (utility).

  ### **Move 4: The Veto and Generic Reasons Defense (5 Marks)**
  **Requirement:** The candidate must address the "veto paralysis" objection. If heterogeneous complaints are incomparable, does every unique grievance grant a veto? The candidate should engage with Scanlon's notion of "generic reasons" (reasons people have in virtue of their position) to see if this stabilizes the comparison.
  *   **5 Marks:** Evaluates whether 'generic reasons' provide a stable basis for comparison across heterogeneous types, or if they merely mask the incommensurability. Addresses whether some status claims trump bodily claims (lexical priority) within contractualism.
  *   **4 Marks:** Discusses generic reasons but fails to apply them to the specific heterogeneity of the prompt.
  *   **3 Marks:** Claims veto paralysis is a feature, not a bug, without justifying how agreement is ever reached.
  *   **0-2 Marks:** Fails to address the paralysis/veto problem.
  *   **Characteristic Mistake:** Treating the veto power as absolute rather than constrained by the requirement of "reasonableness."

  ### **Move 5: Verdict on Wrongness (Structural vs. Practical) (5 Marks)**
  **Requirement:** The essay must conclude by categorizing the problem. Is this a practical difficulty in applying contractualism (we just need better moral intuition), or a structural boundary (contractualism cannot define wrongness in cases of deep pluralism)?
  *   **5 Marks:** Provides a definitive verdict supported by the previous moves. E.g., "If reasons require a common metric to be weighed, contractualism presupposes a theory of value it claims to avoid, marking a structural boundary." OR "If reasonableness allows for qualitative ranking without quantification, it is merely practical."
  *   **4 Marks:** Offers a verdict but the connection to the previous analysis of pairwise justification is weak.
  *   **3 Marks:** Hedges indefinitely without taking a position on the structural integrity of the theory.
  *   **0-2 Marks:** No clear conclusion regarding the account of wrongness.
  *   **Characteristic Mistake:** Dismissing the problem as merely epistemic (we don't know the answer) rather than metaphysical (there is no answer within the framework).

  ***

  **GRADING NOTES FOR EXAMINERS:**
  *   **High Distinction (21-25):** Executes all five moves with precision. The distinction between structural and practical failure is nuanced. The candidate may defend or attack Scanlon, but the internal logic is robust.
  *   **Distinction (16-20):** Executes 4 moves well, or 5 moves with minor conceptual slippage. May rely slightly too much on intuition rather than structural analysis in Move 3 or 5.
  *   **Pass (11-15):** Executes 3 moves adequately. Likely struggles with the incommensurability aspect (Move 2) or collapses the distinction between aggregation and comparison (Move 1).
  *   **Fail (0-10):** Fails to grasp the pairwise constraint or treats the question as a standard utilitarianism vs. contractualism debate without engaging the specific heterogeneous complaint crux.
