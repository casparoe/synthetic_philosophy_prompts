answer: |-
  ### Part 1: Conceptual Dependency Map (The Prerequisite Chain)

  Before stepping into the room, verify your students are standing on these specific conceptual rungs. Since they are logic students, map game-theoretic concepts to their existing semantic frameworks.

  1.  **Preference Orderings (Utility):**
      *   *Logic Analog:* Valuation functions.
      *   *Requirement:* They must accept that outcomes can be mapped to real numbers representing rank, not just "True/False."
  2.  **Strategic Form (The Matrix):**
      *   *Logic Analog:* A truth table where rows are *your* formulas and columns are *world states* (determined by the opponent).
      *   *Requirement:* They must understand that a cell contains the payoff for the *Row* player (initially), and columns represent mutually exclusive states of the world they cannot control but must anticipate.
  3.  **Strict Dominance (Pure vs. Pure):**
      *   *Logic Analog:* Logical Implication. Strategy $A$ dominates $B$ if $A$ yields a better truth-value (payoff) in *every* possible world (column).
      *   *Requirement:* $u(A, s) > u(B, s)$ for all states $s$.
  4.  **Expectation over States (Bayesian Basics):**
      *   *Logic Analog:* Weighted satisfiability.
      *   *Requirement:* They know how to calculate $\sum p(s) \cdot u(A, s)$. *Crucial:* They likely think this requires a *specific* probability distribution $p(s)$. You must break this habit.
  5.  **Mixed Strategies as Comparison Objects:**
      *   *The Pivot:* A mixed strategy is not (yet) an action they take. It is a *virtual strategy* used to test the robustness of a pure strategy.
      *   *Requirement:* Understanding that a convex combination of rows creates a new "virtual row" whose payoff is the weighted average of the constituent rows.

  ---

  ### Part 2: Session Arc (90 Minutes)

  #### Phase 1: Reframing Rationality (15 mins)
  **Goal:** Dislodge "Rationality = Single Answer."
  *   **The Hook:** Draw a decision tree. Ask: "Where is the rational choice?" They will point to the max branch.
  *   **The Shift:** Erase the probabilities on the chance nodes. Replace them with an adversarial agent (Opponent).
  *   **The Definition:** Define Rationality not as "maximizing given beliefs" (Bayesian), but as "avoiding guaranteed regret."
  *   **Logic Translation:** "In modal logic, $\square P$ means $P$ is true in all accessible worlds. In game theory, a Dominant Strategy is one that is 'better' in all accessible worlds (opponent moves). We are looking for structural necessities, not contingent truths."

  #### Phase 2: Pure Dominance & The "Medium" Trap (20 mins)
  **Goal:** Establish the baseline, then break it.
  *   **Setup:** Introduce the "Auction Matrix."
      *   **Context:** You are bidding against a hidden reserve price set by the market (Opponent).
      *   **Actions (Rows):** Low (L), Medium (M), High (H).
      *   **States (Columns):** Weak Market (W), Strong Market (S).
      *   **Payoffs:**
          *   **L:** (3, 0)  *[Win big if weak, lose if strong]*
          *   **M:** (1, 1)  *[Safe, mediocre return]*
          *   **H:** (0, 3)  *[Lose if weak, win big if strong]*
  *   **The Trap:** Ask: "Is M dominated by L?" (No, M wins in Col S). "Is M dominated by H?" (No, M wins in Col W).
  *   **The Misconception Check:** Students will say, "M is undominated. It's the safe option. Rationality permits M."
  *   **The Turn:** "Rationality permits M only if you cannot construct a better portfolio. But you are not limited to pure rows."

  #### Phase 3: Dominance by Mixture (30 mins)
  **Goal:** The core pedagogical move.
  *   **The Move:** Propose a *virtual* strategy $\sigma = 0.5L + 0.5H$.
  *   **Calculation:**
      *   Against W: $0.5(3) + 0.5(0) = 1.5$.
      *   Against S: $0.5(0) + 0.5(3) = 1.5$.
  *   **Comparison:**
      *   $\sigma$ vs M in W: $1.5 > 1$.
      *   $\sigma$ vs M in S: $1.5 > 1$.
  *   **The Conclusion:** M is strictly dominated by the *mixture*. A rational agent cannot play M.
  *   **Crucial Distinction:** Emphasize that the agent does **not** need to flip a coin. The *existence* of the mixture proves M is irrational. The agent could play L or H, but they *must not* play M.
  *   **Logic Translation:** "M is like a formula that is satisfiable, but there exists a disjunction of other formulas that entails a higher value in every model. M is structurally redundant."

  #### Phase 4: Iteration and The Limit of Rationality (15 mins)
  **Goal:** Address the "Single Obvious Answer" misconception.
  *   **The Iteration:** Eliminate M. We are left with L and H.
  *   **The Question:** "Does L dominate H? Does H dominate L?"
  *   **The Result:** No. L is better in W; H is better in S.
  *   **The Lesson:** Iterated Elimination of Dominated Strategies (IEDS) stops here. Rationality *does not* collapse to a singleton.
  *   **Philosophical Payoff:** "You wanted Bayesian updating to give you the one true action. Game theory shows that without Common Knowledge of Rationality (or beliefs about the opponent), rationality only prunes the impossible; it does not dictate the specific."

  #### Phase 5: Check for Understanding (10 mins)
  **Goal:** Verify they grasp dominance vs. randomization.
  *   **Task:** Hand out a slip with a new 3x2 matrix.
      *   Row A: (4, 0)
      *   Row B: (0, 4)
      *   Row C: (1, 1)
      *   Row D: (2, 2)
  *   **Question 1:** "Is C dominated?" (Yes, by 50/50 A/B).
  *   **Question 2:** "Is D dominated?" (No, 50/50 A/B yields (2,2), which ties D. Strict dominance requires *greater than*. D is undominated).
  *   **Question 3:** "If I eliminate C, must I randomize between A and B?" (No. You must only avoid C. You may play pure A if you believe Col 1 is likely).
  *   **Why this works:** It tests if they understand dominance is a *relation of existence* (is there a better mix?) not a *prescription of action* (you must mix).

  ---

  ### Part 3: Misconception Management Sequence

  Anticipate these objections in this specific order. If you answer #2 before #1, you will lose them.

  **1. "Why can't I just Best-Respond to my belief?"**
  *   *The Student View:* "I'm a Bayesian. I'll just assign $p(W)=0.9$ and play L."
  *   *The Response:* "You can. But IEDS is about what you can rule out *before* you form a belief. If you play M, you are irrational regardless of your belief. If you play L, you are irrational *only if* your belief is wrong. We are establishing the floor of rationality, not the ceiling."

  **2. "Is mixing just averaging my beliefs?"**
  *   *The Student View:* "So the 50/50 mix means I think the market is 50/50?"
  *   *The Response:* "No. The 50/50 mix is a *tool of comparison*. We use it to test M. We proved M is worse than the mix *in every column*. Therefore, M is worse than the mix for *any* belief you hold. The mixture's probability weights are mathematical coefficients, not necessarily your credences."

  **3. "Doesn't iteration always leave one strategy standing?"**
  *   *The Student View:* "If we keep eliminating, surely we find the 'right' one."
  *   *The Response:* "Only in specific games (like Prisoner's Dilemma). In this auction, L and H survive. This is a feature, not a bug. It shows that Rationality + Common Knowledge is not always enough to determine action. You need *Equilibrium* concepts for that, which come later."

  ---

  ### Part 4: Scope Boundaries (What to Leave Out)

  To keep this session focused on the mechanics of mixed dominance, explicitly exclude the following. Tell them *why* you are excluding them so they don't feel gaps in their knowledge.

  1.  **Common Knowledge of Rationality (CKR):**
      *   *Exclude:* The epistemic logic proof that IEDS requires CKR.
      *   *Reason:* You are teaching the *algorithm* of elimination, not the *epistemic justification*. That is a topic for the Epistemic Game Theory module.
  2.  **Nash Equilibrium:**
      *   *Exclude:* Solving for the mixed strategy Nash Equilibrium of the remaining L/H game.
      *   *Reason:* That requires indifference conditions and solving equations. It confuses the issue of *dominance* (which is belief-independent) with *equilibrium* (which is belief-dependent).
  3.  **Continuous Strategies:**
      *   *Exclude:* Bidding any dollar amount (calculus).
      *   *Reason:* You need discrete matrices to visualize the "virtual row" created by the mixture. Calculus obscures the convexity argument.
  4.  **Weak Dominance:**
      *   *Exclude:* Cases where the mix is $\geq$ pure strategy (with at least one strict).
      *   *Reason:* Stick to Strict Dominance ($>$). Weak dominance introduces controversial elimination orders that depend on tie-breaking, which distracts from the core concept of convexity.

  ### Instructor's Note on Delivery
  Since they are logic students, they will try to formalize this immediately. Allow them to write $\sigma \succ s_i$, but keep the arithmetic on the board. The tension between their desire for symbolic proof and the arithmetic reality of payoffs is where the learning happens. When they ask "But what is the *true* probability of the market?", remind them: "In dominance, the probability is irrelevant. That is the power of the concept."
