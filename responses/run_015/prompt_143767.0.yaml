prompt: |-
  I'm a phd student in philosophy of science running a small workshop for first-year grad students in logic who think rational choice is basically bayesian updating with extra steps. I need to teach them iterated elimination via dominance in mixed strategies — specifically the move where a pure strategy gets eliminated not by another pure one, but by a convex mixture of others — and I want the teaching plan, not the lecture itself. You are an expert in game-theory pedagogy and conceptual dependency mapping; please think step-by-step and start with a quick brainstorm of the prerequisite chain before you lay out the arc.

  The students have seen modal logic and decision trees but never a payoff matrix, and they carry this exsistantial misconception that rationality always collapses to a single obvious answer. For the carrying example I want something like a three-bidder auction with hidden reserve prices where "medium" looks reasonable pairwise but is actually dominated by a 50/50 mix of high and low against a uniformly random opponent; the example must have discrete actions so we avoid calculus, but it needs to show that the dominated strategy isn't "bad" in every direct comparison — only in expectation against the right mixture. Plan the session's explanatory arc: what idea has to be solid before dominance-by-mixture even makes sense, how to build the example so it has the right features and lacks continuous spaces, then the misconceptions in the order they'll hit — probably "why can't I just best-respond with pure strategies?", then "is mixing just averaging my beliefs?", then "doesn't iteration always leave one strategy standing?" — and how the sequence should absorb each one without losing them.

  I also need the check for understanding that proves they've seen that dominance is about the existance of a dominating mixture, not about playing randomly yourself, plus what to leave out at this level — maybe epistemic common-knowledge conditions or continuous-strategy extensions? — and say so explicitly. Don't give me a bibliography or cite specific papers; I need this for a setting with no web access, so keep everything self-contained and grounded in the dependency map.
