  ### Part 1: The Logical Space

  To map the territory without relying on jargon, we define the space using five binary questions about concrete cases. Each combination of answers defines a "cell." Below, I list the questions, then map the major theoretical positions into the resulting cells.

  **The Five Branch Questions:**
  1.  **Conceptless Pain:** Does a creature with no concepts for mental states (e.g., a newborn or non-human animal) feel pain?
  2.  **Knocked-Out Channel:** If a subject's first-order visual state is intact but their introspective-reporting channel is knocked out, is there still something it is like to see?
  3.  **Phantom Report:** If the introspective channel fires and reports a state to which no matching first-order state answers (confabulation), is the subject conscious of that state?
  4.  **Bare Reporter:** Is a system whose *only* relevant output is a first-person pain report (with no other pain architecture/physiology) in pain?
  5.  **Temporal Delay:** Can a later state make an earlier state have been conscious?

  **The Theoretical Cells:**
  *(Y = Yes, N = No, * = Irrelevant/Varies)*

  | Cell Profile (Q1-Q5) | Theoretical Position | Status |
  | :--- | :--- | :--- |
  | **Y, Y, N, N, N** | **First-Order Exit** (Phenomenal Realism) | **Settled Contender** |
  | **Y, Y, N, N, N** | **Same-Order** (Self-Representational) | **Indistinguishable** from FO on these cases. |
  | **N, N, Y, N, N** | **Actualist HOT** (Thought-based) | **Settled Contender** |
  | **N, N, Y, N, N** | **Dispositionalist HOT** | **Indistinguishable** from Actualist on these cases. |
  | **Y, N, Y, N, N** | **Higher-Order Perception** (Inner Sense) | **Settled Contender** |
  | **Y, N, Y, Y, N** | **Global Workspace** (Access-based) | **Settled Contender** |
  | ***, N, Y, N, Y** | **Retrospective HO** | **Unexplored** (Coherent but no major defender). |
  | **Y, Y, Y, *, *** | **Incoherent** | FO theories generally deny Q3 (Phantom). |
  | **N, Y, *, *, *** | **Incoherent** | HO theories generally deny Q2 (Knockout). |

  **Notes on Empty/Clustered Cells:**
  *   **FO / Same-Order Cluster:** These two views occupy the same cell (Y, Y, N, N, N). They are indistinguishable by external behavioral cases alone because both claim consciousness is intrinsic to the first-order state. Separation requires metaphysical questions about structure, not case judgments.
  *   **Actualist / Dispositionalist Cluster:** These occupy the same cell (N, N, Y, N, N). The distinction relies on the *occurrence* vs. *availability* of the meta-state, which the "Knocked-Out Channel" case collapses (if the channel is gone, the disposition is gone).
  *   **Retrospective HO Cell:** The profile (*, N, Y, N, Y) is logically coherent but **Unexplored**. Most Higher-Order theorists insist on simultaneity.

