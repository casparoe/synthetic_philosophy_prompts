          *   *Fact Check:* Worrall does focus on structure continuity. The use of Ramsey sentences is more associated with Max Newman's critique of Russell and later discussions by Psillos or Demopoulos, though Worrall acknowledges the logical point. Worrall's specific view is that we know the *relations* but not the *relata*. Saying objects are "permanently unknowable" is a Kantian noumenal reading often attributed to ESR.
