  2.  **Deconstruct the "Checklist" (Criteria for a Decent Reply):**
      *   *Intuitive Cases:* A reply can't say "Yes, you must donate your kidney to a stranger." It also can't say "No, you never have to skip latte." It needs to find the line between the drowning child (Shallow Pond) and trivial sacrifices.
      *   *Distinctions:* "Demanding" isn't just "inconvenient." It's about undermining the agent's life. A reply must distinguish between *sacrifice* and *self-destruction*.
      *   *Breathing Room:* Is "breathing room" a moral right or a psychological necessity? A reply needs to justify *why* agents get to keep some resources for themselves without it just sounding like selfishness.
      *   *Aggregation:* If everyone does a little, does it add up to too much? Or if one person does a lot because others do nothing? The reply needs to handle the "fair share" vs. "make up the slack" problem.
      *   *The Tension:* What two things can't both be true? Usually, it's "Maximize the Good" vs. "Protect Agent Integrity." Or "Fairness among agents" vs. "Outcome sensitivity." Let's go with *Outcome Maximization* vs. *Agent-Centered Prerogative*. You can't fully maximize the good *and* guarantee significant personal space.

  3.  **Drafting the Checklist Items:**
