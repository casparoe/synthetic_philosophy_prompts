answer: |-
  Your reconstruction is intellectually robust and pedagogically viable, but it requires a crucial correction regarding the verdict on progress. You are right to treat Borden and Angier as rival research programs sharing a hard core: the possibility of the Transported Man and the necessity of secrecy. Their protective belts differ precisely as you describe. Borden's belt relies on craft, sacrifice, and the ad hoc hypothesis of the twin, while Angier's belt evolves from hired doubles to Tesla's machine. However, your worry about the Tesla machine is well-founded. By Lakatos's strict criterion, Angier's program is theoretically progressive because it predicts a novel fact: real duplication. Borden's program is degenerating because the twin is an ad hoc adjustment to save the phenomenon without new predictive power. The film's moral verdict contradicts this Lakatosian verdict, which is exactly where the teaching value lies. You must explain to your students that Lakatos values empirical growth, whereas the film values human cost. Angier is Lakatosian progressive but ethically bankrupt; Borden is Lakatosian degenerating but humanly coherent. This tension allows you to discuss whether scientific progress is purely logical or also normative.

  Regarding your first wrinkle, the notion of self-erasing novelty is coherent and devastating to Angier's claim to science. Lakatos requires that novel facts be corroborated and accumulated within the public record. Angier's machine produces a novel fact every night, but he drowns the evidence in the tank below the stage. A Lakatosian must verdict this as degenerating because nothing accumulates; the knowledge base does not grow, it merely recycles death. The program consumes its own evidence to maintain the secret, violating the public nature of scientific verification. This distinguishes magic from science: science builds on past corroboration, while Angier's program destroys it to preserve the illusion. You can frame this as a limit case where methodological progress collapses into existential horror because the protective belt requires the destruction of the data.

  Your second wrinkle concerning the nested narratives strikes at Lakatos's distinction between internal and external history. Lakatos argues that rational reconstruction reveals the logical logic of discovery, while external history explains the sociological context. The film suggests that internal history is itself a prestige, a constructed narrative designed to mislead rivals. A Lakatosian can answer this charge by distinguishing between true and false reconstruction. The journals are false reconstructions planted to protect the hard core. A true rational reconstruction would reveal the twin or the machine. The film does not prove methodology is impossible, but rather that historians must be critical of sources. However, a Feyerabendian would argue the film proves all methodology is rhetoric. You should present this as an open debate: does the exposure of the journals invalidate the method, or does it simply demand better scrutiny? Cutter's claim that the audience wants to be fooled is indeed sociological external history. A Lakatosian responds that methodology evaluates the logic of the program, not the psychology of the consumers. Science does not care if the audience wants to be fooled; it cares if the evidence holds. If the evidence is hidden, the program is not science, regardless of audience desire.

  The fatal worry you raise is significant but not lethal if framed correctly. Lakatos's machinery assumes public scrutiny and shared standards of evidence. Magic succeeds by concealment. If you present the film as a model of science, you will mislead your students. Instead, present it as a model of what happens when the public requirement is removed. The film buys you a discussion on the necessity of transparency. Without public verification, Angier's progress is indistinguishable from madness. The film works best as a negative case study: it shows why the protective belt must be open to inspection. If the belt is hidden, anomalies cannot be collectively solved, and the program becomes solipsistic. You should not cut the exercise, but you must pivot the conclusion. The lesson is not that magicians are scientists, but that scientists must not be magicians.

  To anchor this, stop the film at four specific moments. First, stop at the drowning of Julia McCullough during the early water tank trick. This is the initial anomaly that drives Angier to abandon the shared craft belt and seek a technological solution. Second, stop when Angier first returns from the Tesla machine to find his duplicate in the balcony. This is the novel fact that makes his program theoretically progressive. Third, stop at the hanging of Borden when the twin is revealed in the gallery. This exposes the ad hoc nature of Borden's protective belt and confirms the hard core was maintained through sacrifice rather than technology. Fourth, stop at the reveal of the warehouse filled with drowned clones. This illustrates the self-erasing novelty and the ethical cost of Angier's empirical growth. These scenes track the lifecycle of the programs from anomaly to novelty to exposure to accumulation.

  For your handout, use the following framing paragraph to translate the vocabulary for engineers. Think of a research program like a software kernel. The hard core is the underlying operating system code that you refuse to rewrite because it defines what the program is. The protective belt is the array of applications and patches you write to keep the kernel running when errors occur. Positive heuristics are the development rules that tell you what features to add next, while negative heuristics are the constraints that forbid you from touching the core code. A progressive program is one that releases new features solving old bugs and predicting new user needs. A degenerating program is one that only releases patches to fix crashes without adding value. In this film, the magicians are developers protecting their kernel. The question is whether their patches build a better system or just hide the crashes. Science requires the code to be open source; magic requires it to be proprietary. Your task is to decide if proprietary development can ever count as progress.
