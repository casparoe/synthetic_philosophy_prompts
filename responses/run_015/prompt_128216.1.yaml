answer: |-
  You have identified a precise and pervasive dysfunction in moral discourse. While there is no single, canonical term in moral psychology or metaethics that captures this *exact* asymmetry of classification (ontological status) based *solely* on social alignment, the phenomenon is a composite of several well-documented cognitive and social mechanisms.

  The closest existing concepts are **Naïve Realism** (specifically the **Bias Blind Spot**), **Motivated Skepticism**, and **Epistemic Injustice**. However, each falls slightly short of your description. Naïve realism explains why I think I see objective truth and you see bias, but it focuses on *accuracy* rather than the *categorical status* of the commitment. Motivated skepticism explains why I scrutinize your arguments more, but not why I reclassify your values as preferences. Epistemic injustice (specifically *hermeneutical injustice*) captures the denial of conceptual resources, but is usually structural rather than interpersonal.

  Because this specific pattern—granting "value" status to in-group norms while demoting structurally identical out-group norms to "bias"—lacks a unified label, I propose the term **Asymmetric Normative Realism**.

  Below is an analysis of how this concept differs from related phenomena, followed by the boundary conditions you requested.

  ### 1. Existing Proximate Concepts (and why they differ)

  | Concept | Mechanism | How it differs from your pattern |
  | :--- | :--- | :--- |
  | **In-Group Favoritism** | Social Identity Theory: We evaluate our group more positively to boost self-esteem. | Favoritism evaluates *worth* ("We are good"). Your pattern evaluates *ontology* ("Our commitments are Values; yours are Preferences"). One can favor a group while acknowledging their commitments are merely preferences. |
  | **Motivated Reasoning** | Cognitive: We process information to reach a desired conclusion. | This explains *why* the asymmetry happens (to protect identity), but not *what* the asymmetry is. Motivated reasoning is the engine; Asymmetric Normative Realism is the specific output. |
  | **Moral Relativism** | Metaethical: Moral truths are relative to cultures/individuals. | A relativist would say *neither* commitment is a universal value. Your speaker claims *their* commitment *is* universal, while the other's is not. This is not relativism; it is **partisan objectivism**. |
  | **Fundamental Attribution Error** | Cognitive: We attribute others' behavior to disposition (bias) and ours to situation (values). | This is the psychological substrate. However, FAE usually applies to *behavioral explanation*. Your pattern applies to the *normative status* of the claim itself (e.g., "Ecological preservation" vs. "Economic stability"). |
  | **Epistemic Injustice** | Philosophical (Fricker): Unfairness in who is granted credibility or conceptual resources. | This is the strongest philosophical fit. Specifically, **Hermeneutical Injustice** (denying the concepts to frame their view as a value). However, Epistemic Injustice is typically a structural critique of power, whereas your pattern occurs in dyadic debate regardless of structural power. |

  ### 2. Coined Term: Asymmetric Normative Realism

  **Definition:** The rhetorical and cognitive practice of treating one's own normative commitments as mind-independent moral facts (Realism) while treating structurally parallel commitments held by an out-group as mind-dependent psychological states (Preferences/Biases), without applying a consistent criterion for the distinction.

  **The Mechanism:** It is a form of **Meta-Ethical Special Pleading**. The speaker implicitly argues:
  1.  If a commitment is universalizable, disinterested, and deeply held, it is a **Value**.
  2.  My commitment meets these criteria.
  3.  Your commitment does not meet these criteria (because it is held by *you*).
  4.  Therefore, your commitment is a **Bias**.

  The failure lies in step 3: the criteria are not applied neutrally but are adjusted post-hoc to ensure the in-group commitment passes and the out-group commitment fails.

  ### 3. Boundary Conditions: Legitimate Distinction vs. Failure Mode

  You asked where the line lies between a legitimate distinction between value and preference and this failure mode.

  #### A. The Legitimate Distinction
  A legitimate distinction relies on **internal features of the commitment**, not the **identity of the holder**.
  *   **Criterion:** *Universalizability.* Can the principle be applied to all relevantly similar cases without contradiction? (Kantian test).
  *   **Criterion:** *Independence from Self-Interest.* Does the commitment hold even when it costs the holder?
  *   **Criterion:** *Reflective Stability.* Does the commitment survive critical scrutiny and dialogue?

  If a speaker argues, "My commitment is a value because it prevents harm to sentient beings, whereas yours is a preference because it merely protects my financial status," they are making a **substantive moral argument**. Even if wrong, they are applying a consistent criterion (Harm vs. Wealth) to both sides.

  #### B. The Failure Mode (Asymmetric Normative Realism)
  The failure occurs when the criterion for "Value" status shifts depending on who is speaking.
  *   **Condition:** The speaker cannot articulate a principle for why their commitment is universalizable that doesn't *presuppose* the truth of their own view.
      *   *Example:* "My view is a value because it is the *right* one. Your view is a bias because it is *wrong*."
  *   **Condition:** The speaker treats their own emotional salience as evidence of moral truth ("I feel this deeply, so it's a value") but treats the interlocutor's emotional salience as evidence of irrationality ("You feel this deeply, so you're biased").
  *   **Condition:** The classification is immune to counter-evidence. If the interlocutor demonstrates they would uphold their commitment even at great personal cost, the speaker re-categorizes the cost ("That's just ideology") rather than upgrading the status of the commitment.

  ### 4. Locus of the Failure

  The failure lies in the **Refusal of Reflexivity**.

  In moral philosophy, a valid meta-ethical claim must be reflexive: it must be applicable to the claimant. **Asymmetric Normative Realism** fails because it is a **self-exempting heuristic**.
  *   **Classification Failure:** The categories (Value vs. Preference) are not being used descriptively or analytically, but strategically.
  *   **Reasoning Failure:** The reasoning is circular. "It is a value because I hold it; I hold it because it is a value."
  *   **Normative Failure:** It violates the **Principle of Relevant Difference**. To treat two cases differently, there must be a relevant difference between them. In this pattern, the only relevant difference cited is group membership, which is morally irrelevant to the *status* of a normative claim.

  ### Summary
  While **Naïve Realism** and **Epistemic Injustice** describe the psychological and social dynamics, **Asymmetric Normative Realism** precisely captures the meta-ethical inconsistency you observed. It is the error of claiming **Objectivity for the In-Group** and **Subjectivity for the Out-Group** regarding normative commitments of identical formal structure. The failure is not in having different values, but in denying the *status* of "value" to the other side to insulate one's own commitments from the charge of being mere preferences.
