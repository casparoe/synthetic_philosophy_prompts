prompt: |-
  I'm a journalist who covers science and philosphy of ideas, and I'm trying to map out this weird alignment debate: can you actually define "avoid side effects" without smuggling in a full specification of human values? I was arguing with a friend over coffee — she thinks impact regularization is just value-specification in disguize, I think there's maybe a formal trick using state-space distance — and we realized we don't even agree on what the disagreement is.

  Could you write me a taxonomy, like a decision tree, that sorts the actual positions? Start from a concrete case: an AI told to cool one server rack without altering anything else in the building. Then branch on the real cruxes: does defining "anything else" require a complete ontology? Can you specify the background state without encoding what counts as damage? Is a physical-state distance metric enough, or do you need a utility function over worlds?

  Label every branch by the claim that splits it, not by camp names. Each leaf should be a named position if one exists, or "unnamed" if it's logical space nobody occupies. Flag any pair of leaves your tree can't actually separate, with a diagnosis — incoherent, unattractive, or just unexplored? Please don't lay out options neutrally; commit to which branches collapse, which are live, and defend that. And if you lean on a contested reading of low-impact AI framing — like treating state-space metrics as value-free — note exactly where you're taking liberties. No bibliographies, please; I'm writing for people without library access.
