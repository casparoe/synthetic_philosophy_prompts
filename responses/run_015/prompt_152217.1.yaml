answer: |-
  There is no single, established clinical or literary term that perfectly captures this specific architecture of the self. However, your intuition is tracking several high-level concepts from philosophy, psychology, and narrative theory that sit right on the border of this idea.

  Here are the existing "near-misses":

  1.  **Center of Narrative Gravity:** Coined by philosopher Daniel Dennett, this is the idea that the "self" is a fictional abstraction, a center around which our life stories orbit. Your concept is a specific corruption of this: a **Displaced Center of Narrative Gravity**, where the center exists outside the living self, in a dead other.
  2.  **Hauntology:** Jacques Derrida's concept regarding the persistent return of the past (the "ghost") and how the present is structured by an absence. While this covers the *atmosphere*, it doesn't specifically describe the *identity construction* of individuals orbiting a specific dead person.
  3.  **Internal Objects:** In psychoanalytic object relations theory, we carry internalized versions of people. However, this usually refers to how we relate to *living* others or how we process grief to move on. It doesn't capture the structural dependency where the *entire* identity collapses if the ghost is removed.
  4.  **The Absent Protagonist:** A literary device (e.g., *The Great Gatsby*, *Rebecca*), but this describes the plot structure, not the psychological state of the supporting characters.

  Because this specific dynamic—where the self is a satellite structurally dependent on a dead star—lacks a precise label, I will coin one for you based on your parameters.

  ### Coined Term: The Cenotaphic Orbit

  **Etymology:**
  *   **Cenotaph:** A tomb built for someone whose remains are elsewhere (or absent). It is a monument to a body that isn't there, mirroring how these characters build a self around a person who isn't there.
  *   **Orbit:** The path of one object around another due to gravitational pull. This captures the "broken orbits" and "invisible sun" metaphor you described.

  **Definition:**
  A **Cenotaphic Orbit** occurs when an individual's identity, choices, and relational capacity are organized around a deceased or absent figure who functions as a "narrative singularity." The living subject does not merely mourn the absent figure; they derive their structural coherence from them. If the absent figure were psychologically removed, the subject's life choices would appear random or nonsensical, as the "gravity" holding their narrative together would vanish.

  **Boundary Cases:**
  *   **Normal Grief:** The dead person is a memory or a loss, but the survivor's identity eventually re-centers around themselves or the living. (Not a Cenotaphic Orbit).
  *   **Idolatry/Obsession:** The subject orbits a *living* figure (e.g., a cult leader or abusive partner). This is a **Satellite Dependency**, but not *Cenotaphic*, because the center still exerts active will.
  *   **Hauntological Culture:** A society feels haunted by a lost future or past era (e.g., retro aesthetics). This is cultural **Hauntology**, but not a *Cenotaphic Orbit*, which requires a specific interpersonal identity anchor.
  *   **Cenotaphic Orbit:** The subject is alive, the center is dead, and the subject's "who am I" story is a monument to the center. (e.g., A woman who never dates because no one matches her dead father; a writer who only writes letters to a dead friend).

  This term gives you the philosophical weight of "narrative gravity" while keeping the funereal, structural imagery of your novel.

  Verdict: The Cenotaphic Orbit
