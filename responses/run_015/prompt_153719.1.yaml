      *   *P2 (Distributed) vs. P1/P4 (Lag/Construction):* P2 rejects a "finish line" for consciousness. P1/P4 imply a completion point (when the integration window closes and content reaches awareness). If experience is distributed, where does the "Stalinesque editing" finish?
