          *   *Analysis:* P7 posits a fixed window (80-120ms). This implies discrete chunks of processing. P5 demands a "continuous narrative thread." How do you get continuity from discrete windows? This is the "frame rate" problem.
          *   *Severity:* High. If windows are discrete, there are gaps. If there are gaps, P5 (continuity) is threatened.
          *   *Resolution:* Overlapping windows? Sliding window vs. discrete frames.

