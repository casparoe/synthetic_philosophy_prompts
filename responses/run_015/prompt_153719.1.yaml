          *   *Wait, check P4:* P4 says awareness lags. If I report "A and B happened simultaneously" (due to integration), but they weren't, is my temporal ordering report reliable? P3 says yes. P4 says there's a lag. Lag $\neq$ reordering. But integration *can* reorder (simultaneity constancy).
