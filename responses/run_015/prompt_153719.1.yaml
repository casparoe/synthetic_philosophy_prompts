      *   **Conflict C: P4 (Lag) vs. P6 (Presentism).**
          *   *Analysis:* P4: Awareness is delayed (e.g., 100ms). P6: Consciousness is of the "present." If "present" means physical now, P4 kills P6. If "present" means "phenomenal now," P6 is trivial and P4 is irrelevant to it.
