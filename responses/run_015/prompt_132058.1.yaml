answer: |-
  The false presupposition in your reasoning is the assumption that **standing to blame is a property of logical coherence rather than a feature of normative authority.**

  Your friend's argument treats blame as an *assertion* (like a truth-claim) that can be logically invalidated by the speaker's state. If blame were merely a claim that "X is wrong," then the blamer's behavior would be irrelevant to the truth of that claim. But blame is not just a description; it is a *speech act* of accountability. It functions like a verdict. In a legal context, a judge does not lose the *logical* ability to pronounce a sentence if they have committed a crime; they lose the *authority* to do so.

  By assuming standing is binary (you have it or you don't) based on performative contradiction, you are conflating **validity** (is the moral claim true?) with **licensure** (does this person have the right to enforce it?).

  Here is where the binary model breaks down and how we can resolve the dilemma without resorting to a "moral purity threshold."

  ### 1. The Breakdown of the Binary Model
  If standing were binary and dependent on strict non-hypocrisy (whether performative or structural), we would face the problem of **Universal Disqualification**. In a non-ideal world structured by systemic injustices (capitalism, patriarchy, environmental degradation), almost every agent is complicit in some structural wrong. If structural hypocrisy eliminates standing entirely, then no participant in society has the standing to blame any other participant. This renders the practice of blame inert precisely when it is most needed.

  Furthermore, the binary model cannot distinguish between **relevant** and **irrelevant** hypocrisy. A pacifist who smokes cigarettes lacks standing to blame others for smoking (perhaps), but does their smoking eliminate their standing to condemn war? A binary model struggles here unless it introduces ad-hoc exceptions. A scalar model handles this naturally: the smoking diminishes their moral *credibility*, but not necessarily their *authority* on distinct issues.

  ### 2. The Solution: Standing as Scalar and Relational
  To avoid the "moral purity" trap, we must view standing not as an on/off switch, but as a **diminishable authority**.

  *   **Scalar:** Structural hypocrisy does not necessarily *erase* standing; it *attenuates* it. You may have less standing to blame someone for a wrong you are complicit in, but not zero standing. This allows you to register the complaint while acknowledging your own compromised position (e.g., "I know I am part of this problem, but what you did is still wrong").
  *   **Relational:** Standing is not an intrinsic property of the blamer; it is a feature of the relationship between blamer, blamee, and the community. Structural hypocrisy damages the *relationship* required for blame to be productive. If I am exploiting the same workers you are, my blame feels less like accountability and more like rivalry or deflection. However, if our relationship allows for mutual accountability (e.g., we are co-conspirators trying to do better), my structural complicity does not silence me; it contextualizes my blame.

  This avoids the purity threshold because it does not demand you be *clean* to speak; it demands you be *answerable*. You retain standing so long as you acknowledge your own complicity rather than claiming a superiority you do not possess.

  ### 3. What Would Change My Mind
  You have asked me to state clearly what would convince me that structural hypocrisy does **not** undermine standing, and where my reasoning above is vulnerable.

  **The Argument That Would Change My Mind:**
  I would be convinced that structural hypocrisy does not undermine standing at all if a robust defense of the **Independence Thesis** were successful. This thesis holds that the normative force of a moral claim is entirely independent of the moral status of the claimant.
  *   *Specific Consideration:* If it could be demonstrated that blame functions *solely* as a mechanism for transmitting moral truth (like a mathematical proof) rather than as a relational repair tool, then the blamer's complicity would be logically irrelevant. If I can show you a proof of a theorem, it does not matter if I cheated on my taxes; the proof stands. If blame is analogous to a proof, then structural hypocrisy is irrelevant.
  *   *Convincing Evidence:* If empirical or philosophical analysis showed that blame is equally effective at modifying behavior and restoring norms when delivered by complicit agents as when delivered by "clean" agents, this would undermine the claim that standing is relational. If the "messenger" truly doesn't matter, then my relational model is incorrect.

  **Where My Reasoning Is Most Vulnerable:**
  My reasoning relies on the **Scalar/Relational Model**, and its greatest vulnerability is the **Line-Drawing Problem**.
  *   *The Vulnerability:* If standing is scalar (diminished rather than erased), at what point does it diminish *enough* to be functionally equivalent to having no standing? If I am deeply complicit in a structural wrong, I may have "some" standing, but if exercising it causes more harm than good (e.g., triggering defensiveness rather than reflection), then functionally, I lack standing.
  *   *The Risk:* By making standing context-dependent and scalar, I risk making the concept too vague to guide action. If we cannot determine *when* structural hypocrisy silences a critic, the theory loses its normative bite. It might inadvertently allow powerful, complicit agents to continue blaming marginalized groups by claiming their standing is merely "diminished" rather than "void," thereby perpetuating the very structural injustices the theory aims to address.

  ### Summary
  The error in your reasoning was treating standing as a logical precondition (binary) rather than a normative authority (scalar/relational). Structural hypocrisy undermines standing not by making your utterance contradictory, but by damaging the relational authority required for blame to land. However, this does not require moral purity; it requires acknowledging complicity. My view would be overturned if blame were proven to be independent of the blamer's status (Independence Thesis), but my view remains vulnerable to the difficulty of determining when diminished standing becomes effective silence.
