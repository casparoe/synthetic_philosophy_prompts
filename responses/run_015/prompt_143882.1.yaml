answer: |-
  **1. Conceptual Structure: The Individuation of Frames**
  To begin with the architecture of your view: you posit that moral dilemmas arise when distinct normative frames converge upon a single action pathway. However, one might argue that what you describe as two conflicting frames could simply be a single, complex normative system with internal tension. By what criterion do you individuate frames such that we know we are dealing with a *frame-relative* dilemma rather than an intra-systemic contradiction?

  **Follow-up:**
  If frames are distinct social or normative practices, they often evolve and overlap over time. If an agent operates within a hybrid context where the boundaries between, say, the professional and the familial have blurred, does your account allow for frames to merge, or must they remain hermetically sealed to preserve the logical possibility of the remainder you describe?

  ***

  **2. Formal Architecture: Precedence and Consequentialism**
  Moving to the mechanics of choice: if obligations are indexed to frames, and these frames generate incompatible demands, the agent must still act. By what non-arbitrary criterion is one frame granted precedence in a given situation without collapsing your view into a hidden form of consequentialist weighing, where the frames are effectively ranked by the value of their outcomes?

  **Follow-up:**
  You are likely to reply that precedence is determined not by aggregative comparison but by the internal authority conditions of the frame itself. But if the authority conditions of the familial frame demand loyalty while the institutional frame demands transparency, are those conditions not themselves contested across frames, thereby reintroducing the conflict at the level of justification rather than resolving it?

  ***

  **3. Phenomenology: Moral Residue vs. Agent-Regret**
  I would like to press on the phenomenological distinction you draw between your notion of moral residue and Bernard Williams's concept of agent-regret. You claim that agent-regret is excessively psychological, whereas moral residue is an objective feature of the normative situation that persists even when the agent is fully justified and feels no emotional turmoil. How do we verify the existence of this objective residue if it is decoupled from the agent's affective states?

  **Follow-up:**
  Anticipating your defence that we can detect residue through the appropriateness of reparative obligations rather than affective states: how do you distinguish such reparative obligations from ordinary remedial duties that arise after any harmful but permissible action, such as compensating for accidental damage, without relying on an intuitionist reading of moral remainder that simply asserts the difference?

  ***

  **4. Meta-Conflict: Second-Order Obligations**
  Let us consider the possibility of second-order or meta-level conflicts. What occurs when the frames themselves generate obligations about how first-order conflicts ought to be resolved — for instance, when a professional code demands transparency about internal disagreement, while a familial frame demands discretion regarding family matters? Does the frame-relative account have the resources to adjudicate which second-order obligation binds the agent?

  **Follow-up:**
  If your response is that second-order obligations operate at a different logical level and thus do not clash in the same way, does that stratification not simply relocate the dilemma to a higher order rather than dissolve it, leaving the agent with an ineliminable conflict regarding *how* to choose rather than *what* to choose?

  ***

  **5. Applied Scenario: The Archivist's Dilemma**
  Finally, consider a concrete scenario: a senior archivist at a government institution discovers documentary evidence of historical abuses committed by a still-living former official who is also her parent. Her institutional role demands public disclosure according to archival ethics, while her filial frame generates obligations of loyalty and protection. How does your framework explain the qualitative difference in residue when the agent chooses disclosure versus silence, given that both actions violate a binding frame?

  **Follow-up:**
  In the case where she chooses disclosure, fulfilling her institutional duty but violating her filial one, is the resulting residue genuinely *moral* in nature, or is it merely relational? If it is merely relational, does that not suggest the filial obligation was never truly moral in the sense required to generate a dilemma, but rather a matter of personal preference or social expectation?
