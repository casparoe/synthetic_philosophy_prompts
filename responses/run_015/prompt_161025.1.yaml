  Let's begin by looking at the foundational move from phenomenology to physics.

  1. You derive physical postulates from axioms about the character of experience, but what if a subject's experience is structured so differently that those axioms simply don't hold?
     *Follow-up:* If you say that's impossible because axioms are essential, aren't you just defining away the possibility of alien minds rather than arguing for it?

  2. If a system can be unfolded into a functionally equivalent one with a different causal structure, why does consciousness track the structure rather than the computation?
     *Follow-up:* If you say computation doesn't capture intrinsic power, aren't you admitting IIT is incompatible with the computational neuroscience you claim to constrain?

  3. Is maximizing causal power over coarse grainings genuinely the same formal move as IIT's maximization, and does this make you compatible with global-workspace views?
     *Follow-up:* If you deny the compatibility, aren't you drawing a distinction without a difference in the formal mathematics you both employ?

  4. When two overlapping complexes have nearly identical $\Phi$ values, does a tiny peripheral change really switch which entity is the conscious subject?
     *Follow-up:* If you insist the maximum is all that matters, doesn't that make the existence of a subject dangerously unstable compared to our intuition of persistence?

  5. Regarding the cerebellum, was the prediction that it lacks consciousness made in advance, or does it look like a retrofit to save the theory from counterintuitive results?
     *Follow-up:* If it was a retrofit, doesn't that suggest you're adjusting the physical postulates to match the intuitions you claim to revise?

  6. Critics argue simple grids can have high $\Phi$, so do you accept that such artifacts are conscious and what would their experience be like?
     *Follow-up:* If you say our intuition that they aren't conscious is wrong, what grounds do we have left to trust any intuition about consciousness at all?

  7. Since computing $\Phi$ is intractable for realistic systems, what exactly can a proxy measure like the perturbational complexity index tell us about the theory's truth?
     *Follow-up:* If you claim mismatches are just measurement errors, how do we ever distinguish a bad proxy from a false theory?

  8. How could we ever tell you've mapped a conceptual structure onto experience correctly if you're sceptical of the first-person reports we'd use as ground truth?
     *Follow-up:* If first-person reports are unreliable, what data remains to confirm that the shape of the structure matches the quality of the experience?

  9. If $\Phi$ can be arbitrarily small, is there a threshold below which nothing is conscious and where does that threshold come from?
     *Follow-up:* If you say there's no threshold, are you prepared to assign moral status to systems with vanishingly small but non-zero causal power?

  10. If we stipulate a perfect measurement of causal structure and set aside all prior intuitions, what specific configuration of cause-effect power would falsify your account?
      *Follow-up:* If you cannot name such a configuration, does that suggest the theory is insulated from empirical risk entirely?
