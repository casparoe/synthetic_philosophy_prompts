answer: |-
  You have correctly identified the **Premise-Based Procedure (PBP)** as a standard solution to the specific inconsistency generated by the discursive dilemma (or doctrinal paradox). It is true that if a group designates a set of logically independent premises and derives all other judgments from them via majority voting on those premises, collective consistency is mathematically guaranteed.

  However, the "anxiety" in the literature persists not because philosophers are unaware of PBP, but because PBP solves the problem of **consistency** at the expense of other normative and structural conditions that are arguably just as essential to collective rationality and democratic legitimacy. The discursive dilemma is no longer treated merely as a puzzle about inconsistency, but as a limitative theorem (akin to Arrow's) regarding the compatibility of desirable aggregation properties.

  Here are the four primary reasons why PBP is not considered a universal panacea, and why the dilemma remains a deep structural obstacle.

  ### 1. The Normative Cost: Violation of Responsiveness
  The most significant objection to PBP is normative. By binding the group to the logical closure of the premises, PBP can force the collective to accept a conclusion that a majority of the members explicitly reject.

  Consider the standard profile:
  *   Judge 1: $P, Q, P \land Q$
  *   Judge 2: $P, \neg Q, \neg(P \land Q)$
  *   Judge 3: $\neg P, Q, \neg(P \land Q)$

  Under **Conclusion-Based Voting**, the outcome is $\neg(P \land Q)$ (supported by Judges 2 and 3).
  Under **Premise-Based Voting**, the outcome is $P$ (majority), $Q$ (majority), and therefore derived $P \land Q$.

  In the PBP scenario, the collective affirms $P \land Q$ even though a majority (2 out of 3) explicitly voted against it. List and Pettit (2002) argue this creates a **responsiveness deficit**. If collective rationality requires that the group's judgment on a proposition be sensitive to the individual judgments on *that* proposition (a condition often called **Systematicity** or **Independence**), PBP fails. It makes the judgment on the conclusion dependent on the premises, rendering the direct views of the majority on the conclusion irrelevant. In a democratic context, this looks like a technocratic override of the popular will.

  ### 2. The Political Cost: Agenda-Setting Power
  You ask if there is a hidden structural cost. The most profound one is **agenda power**. PBP requires a prior distinction between "premises" and "conclusions." In many real-world deliberative bodies (legislatures, courts, scientific panels), this distinction is not logically given but politically contested.

  *   **In Law:** Is "negligence" a premise for "liability," or is "liability" the concept that defines "negligence"? Different legal doctrines structure this differently.
  *   **In Policy:** Is "economic growth" a premise for "welfare," or is "welfare" the goal that justifies "growth"?

  Whoever gets to define the logical structure of the agenda effectively decides the outcome. If the chairperson designates $P$ and $Q$ as premises, they guarantee outcome $R$. If they designate $P$ and $R$ as premises, they might guarantee $\neg Q$. Therefore, adopting PBP universally does not solve the problem; it merely shifts the locus of conflict from the voting stage to the agenda-setting stage. This violates the condition of **Neutrality**, as the aggregation rule treats propositions differently based on their structural role rather than their content.

  ### 3. Logical Interdependence of "Premises"
  Your proposal assumes that we can always isolate a set of premises that are logically independent of one another. However, in complex agendas, this is often impossible.

  If the agenda involves interconnected constraints (e.g., budget allocation where $A + B + C = \text{Total}$), there are no "independent premises." Voting on $A$ and $B$ separately via majority rule can easily violate the budget constraint, rendering the premise set itself inconsistent.

  Furthermore, List and Pettit (2002) proved a general impossibility theorem showing that for any agenda containing at least two propositions and their negation (and some minimal logical connections), no aggregation function can satisfy:
  1.  **Universal Domain** (accept any consistent individual profile)
  2.  **Collective Rationality** (consistency and completeness)
  3.  **Systematicity** (treat all propositions equally and independently)
  4.  **Non-Dictatorship**

  PBP satisfies 1, 2, and 4, but violates 3 (Systematicity). If you insist on Systematicity (treating all propositions as potential objects of direct voting), you collapse into dictatorship or inconsistency. Thus, the "anxiety" is that we cannot have a rule that is consistent, democratic, *and* neutral. We must sacrifice one. PBP sacrifices neutrality/responsiveness.

  ### 4. Epistemic Reliability
  Finally, from an epistemic perspective (Condorcetian jury theorem applications), PBP is not always superior in tracking the truth.

  Bovens and Rabinowicz (2006) demonstrated that depending on the reliability of the voters on premises versus conclusions, **Conclusion-Based Voting** can sometimes be more truth-conducive. If individuals are better at judging the holistic outcome than the technical premises (common in complex scientific or moral judgments), forcing a premise-based derivation may reduce the group's epistemic accuracy. If the goal of the committee is truth-tracking rather than mere logical coherence, PBP is not an automatic win.

  ### Summary for Your Seminar
  The persistence of the discursive dilemma in the literature is not due to a failure to recognize PBP. Rather, it serves as the entry point for a more robust impossibility theorem.

  The lesson for your students should not be "use premise-based rules to fix inconsistency." It should be: **"We cannot simultaneously maximize Consistency, Democratic Responsiveness, and Agenda Neutrality."**

  *   **PBP** secures Consistency but sacrifices Responsiveness and Neutrality.
  *   **Conclusion-Based** secures Responsiveness but sacrifices Consistency.
  *   **Super-Majority Rules** can secure Consistency but sacrifice Decisiveness (leading to deadlocks).

  The "deep obstacle" is that institutional design requires a tragic choice among these values, not a technical fix that preserves all of them. The discursive dilemma proves that **collective rationality is not free**; it must be purchased by restricting democratic input on certain propositions, and the philosophical debate is about which restrictions are legitimate.
