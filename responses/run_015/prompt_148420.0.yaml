      Let's order: 1. Redundancy (Mitchell), 2. False Balance (Feminist), 3. Formal Semantics (Bayesian), 4. Realist/Metaphysics, 5. Relativism, 6. Operationalization, 7. Dialetheism/Logic (The Prayer), 8. Comparative Methodology.

