prompt: |-
  So this got personally relevant in a dumb way: in March I got appointed to fill out a vacancy on our township's zoning hearing board. Three people, meets once a month, and I have no legal training at all — I run a small print shop. Our soliciter handed us a one-page list of "rules for reading the ordinance," and I've been chewing on it for six months because the first rule seems to collide with the rest of them. Roughly, it says:

  (1) Start with the words. If the words are clear, that's the end of it — don't go asking what the drafters were thinking or what problem they were trying to fix.
  (2) But if taking the words plainly gives an absurd result, you don't have to follow the plain reading.
  (3) Read the whole ordinance together, and don't read any word or clause as doing no work.
  (4) The specific provision beats the general one.
  (5) If it's genuinely ambiguous, tilt toward the property owner.
  (6) If it's ambiguous, also tilt away from any reading that would raise a constitutional problem.

  And it's not abstract for us, we've got two live ones. One: the setback rule says no structure may be built within 25 feet of a side lot line, and a resident bolted a 14-foot steel sculpture to a concrete pad in that strip. Is a sculpture a structure. Two: a section from the 1970s bars any trailer, boat, or unregistered vehicle from being kept in a front yard, and somebody is living in a tiny house built on a trailer chassis that is registered and insured.

  What I want from you:

  - What theory of what a legal text *is* — of meaning, or of who gets to say what the rule is — does this bundle of rules presuppose? In particular, can (1) and (2) both be true at once? It looks to me like (1) says the meaning of the rule is what the sentence says, and (2) says the meaning is what a reasonable reader would take the drafters to have been driving at, which are different theories. Reconstruct whatever single view makes the whole list hang together, and tell me if it can't be done.
  - My pet theory, which I want you to either sharpen or knock down: I think (2), (5) and (6) have nothing to do with meaning at all. They're about who eats the cost of a badly drafted ordinance — the point is to force the supervisors to go fix their own mess rather than having us quietly repair it at the back of the room, and "absurd result" is just a way of saying we'll step in only when the fix is too obvious to argue about. Does the practice strictly need that story, or is it one of several stories that happen to fit? And what would the handout look like if you rewrote it deliberately around that idea?
  - Related: when we depart from the clear text, are we doing one thing or three — deciding the text doesn't really say that once you have the full context, deciding it does say that but we won't enforce it as written, or deciding to enforce it and just wave a flag at the drafters? Does the handout conflate those, and does the conflation matter?
  - The bit I can't get past: rule (3) — don't treat any word as surplus — seems to presuppose one careful drafter who never repeats herself and never writes belt-and-suspenders. Our ordinance is a patchwork of amendments from 1974, 1998 and 2011 written by three different solicitors, and it definately has redundancies. Does the practice require us to pretend otherwise? Is that pretense the same kind of animal as the law's reasonable person, and does it matter that everyone knows it's false?
  - And be honest about the underdetermined parts: I suspect a hard textualist and a moderate purposivist could both sign most of this handout and only really diverge in one or two spots. Tell me which spots, and what each of them would have to give up.

  Don't cite cases or name judges at me — I have no law library, no Lexis, and no way to check you, so it would just be noise. I want the reconstruction, the disagreements, and where the practice is philosophically looser than it looks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A township zoning hearing board member (layperson, print shop owner), appointed to fill a vacancy. No legal training. Practical, grounded, skeptical of abstract theory but wants to understand the underlying logic of the rules they've been given.
      *   **Context:** Small board (3 people), meets monthly. Given a one-page list of 6 interpretation rules. Two live cases (sculpture vs. structure; tiny house on trailer vs. vehicle/trailer ban).
      *   **Task:**
          1.  Reconstruct the theory of legal text/meaning that makes rules (1)-(6) hang together (especially 1 & 2).
          2.  Evaluate the user's "pet theory" (rules 2, 5, 6 are about cost allocation/politics, not meaning). Sharpen or knock it down. Show what a handout based on *that* theory would look like.
          3.  Analyze the nature of "departing from clear text" (meaning vs. enforcement vs. signaling). Does the handout conflate these?
          4.  Address Rule (3) (no surplusage) vs. reality (patchwork ordinance). Is the pretense necessary? Is it like the "reasonable person"?
          5.  Identify underdetermined parts where textualists and purposivists would diverge.
      *   **Constraints:** No case citations, no judge names. Keep it accessible but philosophically rigorous. Be honest about ambiguity.

  2.  **Deconstruct the Six Rules:**
      *   (1) Plain Meaning Priority (Textualism).
      *   (2) Absurdity Exception (Purposivism/Equity).
      *   (3) Holistic Reading/No Surplusage (Coherence).
      *   (4) Specific over General (Hierarchy).
      *   (5) Ambiguity -> Property Owner (Rule of Lenity/Property Rights).
      *   (6) Ambiguity -> Avoid Constitutional Issues (Constitutional Avoidance).

  3.  **Drafting - Section by Section:**

      *   **Part 1: The Unified Theory (Making 1 & 2 Compatible).**
          *   *Problem:* (1) says "stop at words," (2) says "ignore words if silly."
          *   *Solution:* It's not two different theories of meaning; it's a *sequence* of inquiry. The theory is "Objective Communicative Content with a Safety Valve."
          *   *Concept:* The law is a instruction from the sovereign to the citizen. Citizens rely on the words. So words come first. *But* the sovereign is presumed rational. A rational sovereign doesn't want absurdity. So if the words lead to absurdity, the *presumption* that the words capture the intent is broken.
          *   *Synthesis:* Meaning is what a reasonable person understands the text to command, *assuming* the commander is sane. (1) is the default assumption. (2) is the rebuttal evidence.
          *   *Verdict:* It hangs together as a "Presumptive Textualism."

      *   **Part 2: The User's Pet Theory (Cost Allocation/Political Check).**
          *   *User's Idea:* (2), (5), (6) aren't about meaning; they're about making the Township fix bad drafts.
          *   *Evaluation:* It's insightful but incomplete. It's partially true (especially 5 & 6), but (2) is often genuinely about meaning (nobody *means* absurdity).
          *   *Sharpening:* Call it the "Accountability Canon."
          *   *Knockdown:* If it were *only* about accountability, you wouldn't need (1). (1) protects reliance interests. The mix is about stability (1) vs. fairness (2, 5, 6).
          *   *Rewrite:* If the handout were purely about accountability, it would say: "If the text hurts someone unfairly, tell the Township to fix it. We only apply the text if it's crystal clear."
          *   *Application to Cases:*
              *   Sculpture: Is it a structure? If ambiguous, owner wins (Rule 5).
              *   Tiny House: Registered trailer? Text says "unregistered." If registered, text doesn't ban it. If "trailer" covers it regardless of registration, is that absurd? Maybe.

      *   **Part 3: Departing from Text (One Thing or Three?).**
          *   *Options:* (A) Text doesn't say that (Meaning), (B) Text says that but we won't do it (Discretion/Equity), (C) Text says that but we're warning drafters (Signaling).
          *   *Analysis:* The handout conflates them. It presents (2) as if it's about meaning ("don't follow the plain reading"), but often it's about equity.
          *   *Does it matter?* Yes. If it's meaning, you aren't breaking the law. If it's discretion, you are. For a lay board, this is dangerous. It makes them feel like judges when they are quasi-judicial.
          *   *Advice:* Treat (2) as "The text cannot command this because language doesn't work that way," not "We are overriding the text."

      *   **Part 4: Rule (3) and the Fiction of the Careful Drafter.**
          *   *Problem:* Ordinances are messy patchworks. Rule (3) assumes a single, perfect author.
          *   *Analysis:* Yes, it's a fiction. Like the "Reasonable Person."
          *   *Why do it?* To force coherence. If you assume every word matters, you try harder to find a reading that fits. If you assume it's a mess, you give up easily.
          *   *Does it matter everyone knows it's false?* Yes, but it's a *regulative ideal*. You pretend it's coherent to make it coherent.
          *   *Advice:* Don't ignore the history, but use (3) as a tool to minimize conflict, not as a historical fact.

      *   **Part 5: Where Textualists and Purposivists Diverge.**
          *   *Overlap:* Both like (1), (3), (4).
          *   *Divergence:* (2) Absurdity. Textualist: Very high bar (only if literally impossible/insane). Purposivist: Lower bar (if it defeats the goal).
          *   *Divergence:* (5) Ambiguity. Textualist: Strict construction. Purposivist: Look at the goal first, ambiguity is last resort.
          *   *The Live Cases:*
              *   Sculpture: Textualist asks "What is the definition of structure?" Purposivist asks "What was the setback meant to protect (light/air)?"
              *   Tiny House: Textualist asks "Is it a trailer?" Purposivist asks "Is it an eyesore/temporary dwelling?"

  4.  **Review and Refine:**
      *   *Tone:* Respectful, practical, acknowledging the user's position (print shop owner, not lawyer). Avoid legalese.
      *   *Check Constraints:* No cases, no judges.
      *   *Clarity:* Ensure the distinction between "meaning" and "enforcement" is clear.
      *   *Specifics:* Make sure to address the sculpture and tiny house examples briefly to ground the theory.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't give legal advice. Frame everything as "Here is how the logic works," not "Here is how you should rule."
      *   *Emphasis:* Highlight that the user's intuition about Rule (2) being political is sharp, but legally, it's usually framed as linguistic.
      *   *Structure:* Use the user's bullet points as headers for clarity.

  6.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a remarkably sharp set of questions for someone who says they have no legal training. You have identified the exact friction points that keep law professors employed. You are operating a quasi-judicial body, and while you don't need a law library, you do need a coherent mental model so you can sleep at night knowing your decisions aren't arbitrary.

  Here is the reconstruction of the logic you've been handed, an evaluation of your pet theory, and a map of where the hidden traps are.

  ### 1. The Unified Theory: "Presumptive Textualism"

  You asked if Rules (1) and (2) can be true at once. Rule (1) says "stop at the words." Rule (2) says "ignore the words if they lead to absurdity." On the surface, this is a contradiction. If the words are clear, how can they be absurd? If they are absurd, were they ever clear?

  To make the whole list hang together, you have to view these rules not as competing theories of meaning, but as a **sequence of inquiry**. The theory presupposed here is **Presumptive Textualism**.

  Here is the single view that unifies them:
  *The law is a communication from the Township to the citizen. The citizen is entitled to rely on the ordinary meaning of that communication. However, the Township is presumed to be a rational actor.*

  *   **Rule (1)** establishes the baseline: We assume the words chosen match the intent. This protects the citizen's reliance interest. You shouldn't have to guess what the Township *meant*; you should be able to read what they *said*.
  *   **Rule (2)** is the safety valve for that presumption. It acknowledges that sometimes language fails. If the plain reading leads to a result that *no rational Township could have intended* (e.g., banning a wheelchair ramp because it's technically a "structure" in a zone for houses), then the presumption that "words = intent" is broken.

  So, (1) and (2) are not different theories of meaning; they are a hierarchy. (1) is the default setting. (2) is the override switch that only flips when the default setting produces a result that violates the assumption of rationality.

  **Does it hang together?** Yes, but barely. It relies on the idea that "absurdity" is objective. If you and your fellow board members disagree on what counts as "absurd," the system fractures.

  ### 2. Your Pet Theory: The "Accountability Canon"

  Your theory is that Rules (2), (5), and (6) are not about meaning, but about **cost allocation**. You believe they exist to force the Township Supervisors to fix bad drafts rather than letting you clean up the mess.

  **Verdict:** You are half-right, and this is a very sophisticated insight.

  *   **Rule (5) (Ambiguity -> Owner)** is absolutely about cost allocation. This is often called the "Rule of Lenity" in criminal law, but in zoning, it's about property rights. The logic is: The Township wrote the rule. The Township has the power to change the rule. If the rule is unclear, the Township bears the cost of that confusion, not the homeowner. This is political, not linguistic.
  *   **Rule (6) (Ambiguity -> Constitutional)** is also political/prudential. It's about avoiding a lawsuit the Township will lose.
  *   **Rule (2) (Absurdity)** is where your theory gets shaky. Often, avoiding absurdity *is* about meaning. If a rule says "no vehicles in the park," and an ambulance enters to save a life, saying "an ambulance is not a vehicle in this context" is a claim about how language works, not just a political dodge.

  **Does the practice strictly need your story?** No. The standard legal story is that these rules help find the "true intent." But your story is often more honest about what's happening in the room.

  **What would the handout look like if rewritten around your theory?**
  If the handout were deliberately designed around "Accountability" rather than "Meaning," it would look much more aggressive toward the Township Solicitor. It might read:

  > 1.  **The Township Owns the Text:** If the ordinance is unclear, the benefit of the doubt goes to the resident. Do not guess what the Township meant.
  > 2.  **The Absurdity Veto:** If applying the text creates a result that makes the Township look unreasonable, reject the text and tell the Supervisors to amend the ordinance.
  > 3.  **No Rescue Missions:** It is not your job to fix drafting errors to help the Township win. If they drafted it poorly, they lose.

  **Why they didn't write that:** Because it invites conflict between the Board and the Supervisors. The current handout tries to smooth that over by pretending it's all just about "interpreting meaning."

  ### 3. Departing from the Text: One Thing or Three?

  You asked: When we depart from clear text (via Rule 2), are we deciding the text *doesn't say that*, deciding it *does say that but we won't enforce it*, or deciding to *enforce it but wave a flag*?

  **The Handout conflates these.** It presents Rule (2) as if it is the first option (meaning). It says "don't follow the plain reading." This implies the plain reading was wrong.

  **Does the conflation matter?** Yes, immensely.
  *   **If it's Meaning:** You are finding the law. You are safe. You are doing your job.
  *   **If it's Non-Enforcement:** You are effectively vetoing the Township. This might be outside your authority.
  *   **If it's Signaling:** You are creating uncertainty for the homeowner.

  **The Reality:** In practice, boards do all three, but they *say* they are doing the first one.
  For your **Sculpture Case**: If you rule the sculpture is not a "structure," you are claiming that is the *meaning* of the word. If you rule it *is* a structure but allow it anyway because banning art is absurd, you are exercising discretion.
  *Advice:* Stick to the "Meaning" justification. It is the most stable. Say: "In the context of this ordinance, 'structure' implies a habitation or enclosure, which a steel sculpture is not." Do not say: "It is a structure, but we are letting it slide." That opens you to accusations of arbitrary enforcement.

  ### 4. Rule (3) and the Fiction of the Careful Drafter

  Rule (3) says: "Don't read any word or clause as doing no work."
  You noted: Your ordinance is a patchwork from 1974, 1998, and 2011 by three different lawyers. It definitely has redundancies.

  **Does the practice require you to pretend otherwise?** Yes.
  **Is that pretense the same kind of animal as the "reasonable person"?** Yes, exactly.

  The law often uses "fictions" to achieve stability. The "Reasonable Person" doesn't exist; nobody is perfectly average and rational. But using that standard keeps judgments from becoming purely subjective.
  Similarly, the "Careful Drafter" doesn't exist in your township. But if you assume every word is there on purpose, it forces you to look for a reading that makes sense of the whole document. If you assume it's a mess, you give yourself permission to ignore parts you don't like.

  **Does it matter that everyone knows it's false?**
  It matters if you take it too literally. If you twist yourself into knots trying to find a unique purpose for every redundant word, you will create *more* absurdity (violating Rule 2).
  *Advice:* Treat Rule (3) as a **tie-breaker**, not a straitjacket. If you have two reasonable readings of a clause, pick the one that gives work to all the words. But if the history shows a word is clearly a leftover from 1974 that conflicts with 2011, acknowledge the conflict and use Rule (4) (Specific beats General) to resolve it. Don't gaslight yourself into believing the 1974 solicitor perfectly anticipated the 2011 amendment.

  ### 5. The Underdetermined Parts: Where the Philosophers Fight

  You suspected a hard textualist and a moderate purposivist could both sign this handout. You are right. They would agree on 80% of cases. They diverge on the margins.

  **The Divergence Points:**

  1.  **The Threshold for "Absurdity" (Rule 2):**
      *   *Textualist:* "Absurd" means logically impossible or morally horrific. (e.g., "No cars" means no cars, even for funerals, unless there's an explicit exception).
      *   *Purposivist:* "Absurd" means "defeats the obvious goal." (e.g., "No cars" is to stop traffic noise; an electric wheelchair is fine).
      *   *Your Risk:* If your board has mixed philosophies, you will deadlock on close calls.

  2.  **The Definition of "Ambiguous" (Rule 5):**
      *   *Textualist:* A word is ambiguous only if it has two distinct dictionary definitions that both fit.
      *   *Purposivist:* A word is ambiguous if applying it strictly leads to a result that feels unfair or off-purpose.
      *   *Your Risk:* The Textualist on your board will want to rule against the homeowner more often because they find "ambiguity" harder to prove.

  **Application to Your Live Cases:**

  *   **The Sculpture (Setback Rule):**
      *   *Textualist:* Look at the definition of "structure." If the ordinance defines it as "anything built or erected," the sculpture counts. End of story.
      *   *Purposivist:* What is the setback for? Light? Air? Privacy? A 14-foot steel sculpture blocks light, but maybe not privacy. Does it fit the *purpose* of the rule?
      *   *Where they diverge:* If the ordinance doesn't define "structure." The Textualist uses common dictionary meaning. The Purposivist looks at other sections to see what the Township was trying to prevent.

  *   **The Tiny House (Trailer Ban):**
      *   *Textualist:* The rule bans "trailer, boat, or unregistered vehicle." The house is on a trailer chassis. Is it a "trailer"? If it's registered as a vehicle, does the "unregistered" modifier apply to the whole list or just "vehicle"? (This is a grammar fight).
      *   *Purposivist:* Why was the 1970s rule written? To stop eyesores and temporary living. Is this tiny house an eyesore? Is it temporary? If it's permanent and nice, the Purposivist says "The rule doesn't apply to this," even if the text is sticky.
      *   *Where they diverge:* Rule (4) "Specific beats General." Is the "Tiny House" a specific exception to the general "Trailer" ban? Or is "Trailer" the specific category that captures the house?

  ### Summary Advice for the Board

  You are in a tough spot because the handout gives you the *tools* of a judge without the *authority* of a judge. You are bound by the ordinance, but you are also the only check on it.

  1.  **On Meaning vs. Politics:** Operate as if Rule (5) (Ambiguity -> Owner) is your primary shield. If you are unsure, rule for the owner. It forces the Township to be clearer next time. This aligns with your "cost allocation" theory and keeps you out of trouble.
  2.  **On Absurdity:** Use Rule (2) sparingly. Only when the result is truly ridiculous. If you use it too often, you become the legislature, not the board.
  3.  **On the Patchwork:** Acknowledge the history. If a 1974 rule conflicts with a 2011 rule, assume the 2011 rule wins (later in time controls), even if Rule (3) wants you to reconcile them.
  4.  **On the Record:** When you write your decisions, use the language of **Meaning**, not **Equity**. Do not write "We think this is unfair." Write "We find the term 'structure' does not clearly encompass artistic installations in this context." It protects you from appeal.

  The handout you were given is a standard "canon of construction" cheat sheet. It assumes a coherence in the law that doesn't exist in your township. Your job is to use the cheat sheet to impose enough order to make a decision, without pretending the ordinance is perfect.
