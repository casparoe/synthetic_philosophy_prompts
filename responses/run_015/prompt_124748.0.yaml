  3.  **Evaluate Tensions/Contradictions:**

      *   **Tension A: P3 vs. P4 (The Empirical Clash)**
          *   *P3:* Lowering barriers destroys signal value.
          *   *P4:* Lowering barriers (OA/preprints) *hasn't* destroyed credibility.
          *   *Severity:* High. This is a direct empirical contradiction. If P3 is true, P4 should be false.
          *   *Resolution:* P3 is too absolute. Signals shift, they don't vanish. P4 suggests the signal migrated.

      *   **Tension B: P5 vs. P6 (The Normative/Ethical Clash)**
          *   *P5:* Costly signaling is wasteful/bad; we should replace with cheap tests.
          *   *P6:* High-barrier (costly) groups are *better* (more trustworthy).
