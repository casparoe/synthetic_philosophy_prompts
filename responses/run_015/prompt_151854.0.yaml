  The catch: A and B may differ in exactly one respect, and that respect can't be how large the monster's advantage is, how many monsters or how many other people there are, or whether the losers consented / whether its a taking versus a failure to help. So it has to be something structural.

  Then: give me what an average utilitarian says in each case, and what someone who thinks rights or equality block the transfer says (if average peels off anywhere, tell me where and why). Name the one variable you varied and explain why it moves our gut but not the utilitarian verdict. And be straight with me about two things: if you flip that variable the other way, does the monster objection survive as a complaint against utilitarianism specifically, or does it collapse into a general complaint about trading people off against each other? And what would someone who trusts the intuition say to argue your pair doesn't show what you think it shows?

  The reason I want this is to figure out whether the monster is really a problem for utilitarianism in particular or just a vivid way of stating a problem that any view which trades people off has to deal with — so don't win by stipulating the verdicts.
