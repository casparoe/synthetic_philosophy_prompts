answer: |-
  **Scenario A (The Outrage)**
  A rural county has a fixed budget for public defender hours, estimated by the oversight committee to provide a total of 1,000 hours of legal coverage this year. There are ten indigent defendants awaiting trial. Nine of them have straightforward cases; the committee estimates that giving each of them 100 hours of defense would secure a "decent chance" at freedom, yielding a moderate welfare gain (avoiding prison, keeping families together) estimated at 50 points each. The tenth defendant, Mr. Vance, has an extraordinarily complex case involving niche corporate law; the committee estimates that dumping all 1,000 hours on Vance would give him a 99% chance of acquittal, yielding a massive welfare gain for him (avoiding life imprisonment, immense personal relief) estimated at 600 points. The committee cannot measure these feelings precisely, only estimating based on past case outcomes and client interviews. Strictly summing the estimated welfare points, the Total Utilitarian verdict is to assign all 1,000 hours to Vance, leaving the other nine with no defense and a near-certainty of prison time, because 600 is greater than 450 (9 × 50).

  **Scenario B (The Acceptable)**
  A wealthy neighborhood association has a fixed budget for landscaping labor, estimated by the board to provide a total of 1,000 hours of gardening this season. There are ten common areas to maintain. Nine of them are casual walking paths; the board estimates that giving each 100 hours of labor would make them "pleasant," yielding a moderate welfare gain (nice views, relaxing walks) estimated at 50 points each. The tenth area is a competitive show-garden managed by Mrs. Gable, a horticulture enthusiast; the board estimates that dumping all 1,000 hours on her garden would allow her to cultivate prize-winning orchids, yielding a massive welfare gain for her (intense creative fulfillment, pride) estimated at 600 points. The board cannot measure these feelings precisely, only estimating based on member surveys and past event attendance. Strictly summing the estimated welfare points, the Total Utilitarian verdict is to assign all 1,000 hours to Mrs. Gable, leaving the other nine areas overgrown and mediocre, because 600 is greater than 450 (9 × 50).

  ***

  **The Analysis**

  **The Utilitarian Verdicts**
  A **Total Utilitarian** says "feed the monster" in both cases without hesitation. The math is identical: one person gains 600 units of welfare, while nine people lose a combined 450 units. The net gain is +150 in both scenarios. Since the theory cares only about the sum of welfare, the nature of the welfare (legal freedom vs. pretty flowers) is irrelevant; only the magnitude matters.

  An **Average Utilitarian** arrives at the exact same verdict in both cases. Since the population size (10 people) remains constant between the choice to feed the monster and the choice to distribute equally, maximizing the total automatically maximizes the average. Average utilitarianism only "peels off" from Total utilitarianism if the policy changes the population size (e.g., bringing new people into existence or causing death), which is not present in these resource allocation scenarios.

  **The Rights/Equality Objection**
  Someone who prioritizes **rights or equality** will block the transfer in Scenario A but likely allow it in Scenario B. In Scenario A, they argue that access to legal defense is a *right* tied to human dignity or citizenship; rights are "trumps" that cannot be aggregated away. To leave nine people undefended so one can be free violates the principle of equal standing before the law. In Scenario B, they would likely shrug; landscaping is a *commodity* or amenity. There is no "right to a manicured lawn," so distributing resources to maximize community satisfaction (even if concentrated) is a permissible administrative decision, not a moral violation.

  **The Variable**
  The one variable I varied is **the Social Meaning of the Resource (Essential Right vs. Discretionary Amenity).**

  This moves our gut but not the utilitarian verdict because our moral intuitions are sensitive to *categories* of goods, not just *quantities* of welfare. We operate with a "separate spheres" intuition: some goods (justice, health, voting) must be distributed equally because they constitute our status as persons, while other goods (luxuries, hobbies, decor) can be distributed efficiently to maximize satisfaction. Utilitarianism flattens these spheres into a single currency of "welfare," ignoring the structural role the resource plays in human agency.

  **The Flip Test**
  If you flip the variable (make legal defense a discretionary amenity, or landscaping a fundamental right), the Monster objection moves with the variable. If legal defense were just a "service" like landscaping, the outrage in Scenario A would vanish (it would just be "bad luck for the nine"). If landscaping were a "right" (e.g., essential for sanitation/health), the outrage in Scenario B would appear.

  This suggests the Monster objection **collapses into a general complaint about trading people off in specific domains**, rather than a rejection of trade-offs everywhere. It is not a complaint against *aggregation* per se, but against *aggregation without thresholds*. The intuition truster argues that Utilitarianism fails because it refuses to recognize that some welfare claims are lexically prior to others.

  **The Intuition-Truster's Critique**
  Someone who trusts the intuition would argue my pair doesn't prove the Monster is "smuggling" anything. They would say: "You haven't shown the intuition is external; you've shown that Utilitarianism is *incomplete*. The reason Scenario A feels wrong isn't because we smuggled in rights, but because Utilitarianism fails to capture the *quality* of the welfare. Legal freedom isn't just 'more points' than pretty flowers; it's a different *kind* of good. By forcing them into the same math, you're the one cheating, not the intuition. The Monster objection survives because Utilitarianism refuses to distinguish between satisfying a preference and respecting a person."
