answer: |-
  To serve the evidential purpose of determining how much weight first-person reports carry as evidence about consciousness itself, a theory solving the meta-problem must meet a specific set of conditions that go beyond merely tracing the causal origins of verbal behavior. The primary aim is to bridge the gap between physical processes and the specific content of consciousness reports without presupposing the answer to the hard problem, thereby allowing us to judge whether these reports are veridical insights or systematic illusions. A first necessity is causal adequacy, motivated by the fact that reports are physical events occurring in time and space, produced by brains or functionally equivalent systems. A theory must specify the cognitive mechanisms that transform sensory input and internal states into the specific claim that there is something it is like to be the subject. If a theory fails to provide a plausible causal chain linking physical states to the utterance I am conscious, it is refuted, because without a mechanism the explanation is merely magical rather than scientific. This is the baseline, but it is insufficient for the evidential goal, which requires handling the nuance of the data itself.

  The first of the less conventional demands is the grain constraint, motivated by the observation that the data are not a uniform chorus of I am conscious but a graded and gappy profile. People report no mental imagery whatsoever, patients report seeing nothing while still steering around obstacles, subjects report pain that does not bother them, and experience reports thin out during absorbed activity only to return when attention is directed. A theory that explains only the loud central case has explained very little because it ignores the structural variability that constrains any viable mechanism. If a theory cannot accommodate these variations without ad hoc adjustments, it is disfavoured, though not necessarily refuted, provided it can still account for the central case where the reports are most consistent and vivid. The central case is the primary phenomenon, so failure to capture the edges suggests the theory is incomplete or overly simplified rather than fundamentally false, but significant inability to map the graded nature of the reports indicates the underlying cognitive model is likely wrong.

  The second of the less conventional demands is the force constraint, motivated by the fact that the reports are not just utterances to be causally accounted for since they carry argumentative force. They generate the intuition that a functionally identical creature might lack something and that someone who knew all the physical facts might still learn something new, and they move people who have spent years on the question. A theory must explain how a bit of cognition acquires that authority for the person who has it, detailing why the introspective seeming feels indubitable rather than merely caused. Furthermore, the theory must say whether your explanation vindicates the reports or debunks them. If a theory fails to explain why these reports compel us so strongly, it is refuted regarding the evidential purpose, because leaving the authority unexplained means we cannot assess the reliability of the evidence. If the theory explains the force but refuses to state whether this vindicates or debunks the reality of consciousness, it fails the evidential goal by leaving the weight of the evidence undetermined.

  To maintain the distinction between the meta-problem and the hard problem, a theory must also satisfy a neutrality requirement, motivated by the need to avoid begging the question of whether consciousness exists as described. The theory should ideally explain the reports without presupposing whether they are veridical or misdescriptions, allowing the evidential weight to be calculated rather than assumed. If a theory fails this by secretly assuming consciousness exists or does not exist, it is refuted as a solution to the meta-problem specifically, because it collapses into a solution to the hard problem or a eliminativist stance without justification. However, this creates a tension with the force constraint. I flag the pair of requirements consisting of neutrality and the force constraint as suspect of being jointly unsatisfiable. The demand that a solution stay neutral between the reports being veridical and their misdescribing something is difficult to meet alongside the demand that it account for their force, because any account of the force either endorses or undercuts it and so quietly settles the very question the meta-problem was meant to bracket. If you explain the authority by showing it tracks reality, you vindicate; if you explain it as a useful fiction, you debunk. Staying neutral while explaining the conviction may be impossible, as the explanation of conviction often reveals its truth-tracking or error-prone nature.

  To prevent the theory from becoming a just-so story that fits any possible data, it must satisfy an alien systems requirement, motivated by the principle that a theory that explains every possible report explains none. The theory must say what it predicts about reports from systems very unlike us, such as artificial agents or organisms with radically different architectures. It must specify conditions under which such systems would not generate consciousness reports despite being complex, or conversely, when they would generate them despite lacking human biology. If a theory cannot delineate boundaries where reports should not occur, it is refuted because it lacks predictive power and falsifiability. This constraint ensures the theory is not merely retrofitting explanations to human quirks but identifies the general principles governing the production of consciousness claims.

  Among these, the single requirement that excludes the most otherwise attractive theories is the force constraint combined with the demand to declare vindication or debunking. Most mechanistic theories can explain the causal origin of reports and even handle the grain of variability, but they stumble when asked to explain why those reports feel authoritative without settling the ontology. Many attractive theories prefer to remain agnostic or treat the force as a brute feature, but the evidential purpose demands a stance on reliability. By forcing the theory to choose between vindication and debunking to explain the authority, we eliminate those that wish to hide behind neutrality while still claiming to solve the meta-problem. This is the hardest hurdle because it requires the theory to take a risk on the very issue it was supposed to bracket.

  I am highly confident in this specification as a whole because it tightly links the explanatory goals to the evidential purpose, ensuring that a solution does not drift into metaphysics or mere behaviorism. However, the one requirement I am least confident belongs on it is the neutrality requirement. My reason is that it may be inherently incompatible with the evidential purpose itself. If the goal is to determine the weight of the reports as evidence, the theory might need to assume a stance on their veridicality to explain their force, meaning neutrality could be an artificial constraint that prevents a genuine solution rather than guiding it. If explaining the force inevitably reveals the truth value, then demanding neutrality forces the theory into a contradiction, making it a flawed criterion for a successful meta-problem solution.
