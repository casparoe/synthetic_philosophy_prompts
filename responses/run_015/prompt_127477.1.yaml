  # JOINT STATEMENT ON THE METAPHYSICS OF ANATTĀ

  **Parties:**
  1.  **Eliminative-Reductionist Interpreter (ER):** Maintains that personal identity is a purely conceptual construct with no ontological correlate, even of a processual kind.
  2.  **Process-Continuist Interpreter (PC):** Maintains that while no substantial self exists, a "thin" diachronic continuity grounded in causal-psychological linkage possesses sufficient ontological weight to ground moral responsibility.

  **Date:** October 26, 2023
  **Framework:** Pali Canonical Abhidhammic Analysis

  ---

  ### I. AGREED CLAIMS

  The parties affirm the following eight propositions as the shared foundation of their collaboration:

  1.  **Denial of Essence:** The doctrine of *anattā* definitively denies the existence of a permanent, autonomous, unitary essence (*ātman*) that could survive the dissolution of the aggregates (*skandhas*).
  2.  **Constitutive Analysis:** What is conventionally designated as a "being" is exhaustively analyzable into the five *skandhas* (form, feeling, perception, formations, consciousness) operating according to *paṭicca-samuppāda* (dependent origination).
  3.  **Two-Truths Framework:** Designations of persons (*puggala*) function as conventional truths (*sammuti-sacca*) useful for communication and practice, but do not correspond to ultimate realities (*paramattha-sacca*).
  4.  **Phenomenological Persistence:** The first-person phenomenology (the sense of "I" or mine) arises dependently and persists as an experienced reality even when the absence of a metaphysical self is intellectually realized.
  5.  **Karmic Operativity:** Moral evaluation and karmic language remain fully operative and necessary within conventional discourse, regardless of the lack of an ultimate bearer of karma.
  6.  **Rejection of Extremes:** Both parties reject eternalism (*sassatavāda*) regarding the self and nihilism (*ucchedavāda*) regarding the efficacy of action and consequence.
  7.  **Soteriological Goal:** The cessation of suffering (*dukkha-nirodha*) is the primary soteriological aim, achievable through the cultivation of ethics, concentration, and wisdom, irrespective of the metaphysical interpretation of identity.
  8.  **Causal Continuity:** There is an undeniable causal continuity between mental moments that explains memory, habituation, and the apparent coherence of experience over time.

  ---

  ### II. DISAGREEMENTS TABLE

  The following table delineates the precise metaphysical divergences between the parties. Each stance is formulated in language the respective party accepts as accurate to their position.

  | Point of Contention | Eliminative-Reductionist Stance (ER) | Process-Continuist Stance (PC) |
  | :--- | :--- | :--- |
  | **(a) Diachronic Personal Identity** | Diachronic identity is a purely conventional fiction with zero normative weight; causal linkage explains continuity, but "identity" adds no ontological value. | A "thin" processual continuity, grounded in causal-psychological linkage and reflexive awareness (*svasamvedanā*), suffices for moral responsibility and karmic transmission. |
  | **(b) The Ownership-Recurrence Problem** | The paradox dissolves once phenomenal presence is distinguished from metaphysical ownership; a mental state can notice its own ownerlessness without requiring an owner to do the noticing. | The difficulty that if no mental state has an owner, then the state that recognizes this absence also lacks an owner, threatens an infinite regress of unowned noticings, implying a minimal subject is required. |
  | **(c) Reflexive Structure and Givenness** | The reflexive structure of awareness can fully account for the "givenness" of experience without positing a minimal subject or center of orientation. | Some non-substantive "center of orientation" is ineliminable to account for the unified givenness of experience, even if that center is not a substance. |

  ---

  ### III. CRUCES AND PREDICTIVE CASES

  The parties identify two cruxes where resolving specific sub-questions would significantly alter the dialectic. For each crux, a concrete case is stipulated, and both parties submit advance predictions.

  #### Crux 1: The Indexicality of First-Person Pronouns
  **Sub-Question:** Do first-person pronouns in reports of experience function as indexicals that pick out a stream rather than a substance, or as pragmatic fictions carrying no referential content whatsoever?

  **Concrete Case: The Split-Mind Transplant Scenario**
  A mental stream is divided via a hypothetical procedure into two equally continuous streams (Successor A and Successor B). Each successor possesses full psychological continuity (memory, character, habits) relative to the Original.

  **Predictions:**
  *   **ER Prediction:** Neither successor is genuinely "the same person" as the Original in any non-conventional sense, because "person" denotes nothing real. The original first-person pronoun ("I") could correctly be used by neither, both, or either only as a convenient linguistic shorthand; strictly speaking, the referent of "I" ceased at the moment of division.
  *   **PC Prediction:** The original first-person pronoun functions as an indexical picking out the causal stream. Since the stream has bifurcated, the indexical reference is ambiguous. However, insofar as causal continuity is real, both successors stand in a relation of identity to the Original that is stronger than mere similarity. The pronoun "I" is correctly used by both, indicating that the "thin self" has divided, preserving karmic responsibility in both branches.

  #### Crux 2: Cessation and Karmic Inheritance
  **Sub-Question:** Does the state of complete cessation of aggregates (*nirodha-samāpatti*) followed by resumption permit a non-conventional criterion of stream-identity, and can karmic continuity be reconstructed without any bearer of karma?

  **Concrete Case: The Interruption of Aggregates Case**
  A practitioner enters *nirodha-samāpatti*, where all mental and physical aggregates cease completely for a fixed duration, then resume. There is no causal activity *during* the cessation, only a prior causal determination to emerge.

  **Predictions:**
  *   **ER Prediction:** The resuming stream stands in a relation of karmic inheritance to the prior stream that is **no stronger** than the relation it bears to any contemporaneous stream causally linked (e.g., a teacher transmitting knowledge to a student). The relation does not require a bearer; it is merely a causal gap bridged by prior volition.
  *   **PC Prediction:** The resuming stream stands in a relation of karmic inheritance to the prior stream that is **stronger** than the relation it bears to any contemporaneous stream. This relation requires a "bearer" in the sense of a continuant process that persists through the latency of cessation, distinguishing it from mere causal adjacency between distinct entities.

  ---

  ### IV. CONCLUSION: VERBAL VS. SUBSTANTIVE DISPUTE

  Upon reviewing the agreed claims, the disagreements table, and the predictive cases, the collaboration concludes the following regarding the nature of the dispute:

  **1. Verbal Disagreements (Notational Variants):**
  A portion of the dispute is verbal, centering on the definition of "conventional." The ER party uses "conventional" to mean "ontologically empty," while the PC party uses "conventional" to mean "ontologically dependent but real as a process." When the ER party says "There is no person," and the PC party says "There is a person as a process," they are often agreeing on the phenomenological and causal data but disagreeing on whether the label "person" should be retained for the causal process. If the ER party agreed to define "person" as "causally connected stream of aggregates," their objection would vanish. Thus, the disagreement over the *utility* of the term "person" is largely notational.

  **2. Substantive Disagreements (Metaphysical):**
  A genuine metaphysical disagreement survives regarding the **normative weight of continuity**.
  *   The ER party holds that causal continuity is a brute fact that carries no intrinsic normative weight; justice and karma are imposed upon this causality by social and soteriological convention.
  *   The PC party holds that causal continuity *itself* possesses intrinsic normative weight; the very structure of the continuum *is* what makes karmic retribution just, independent of social imposition.

  This substantive divergence is highlighted in **Crux 2**. If the resuming stream after *nirodha-samāpatti* is merely causally linked (ER) versus inherently continuous (PC), the justification for why the resuming aggregate suffers the karma of the prior aggregate differs fundamentally. For the ER, it is a pragmatic rule; for the PC, it is a metaphysical necessity grounded in the nature of the continuum. This distinction remains unresolved and constitutes the core metaphysical rift between the two interpretations.
