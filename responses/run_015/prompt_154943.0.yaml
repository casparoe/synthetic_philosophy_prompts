      *   (4) **Tipping/Jaywalking:** Not tipping where wages depend on it = Moral Wrong. Jaywalking on empty street = Conventional failing (no one wronged).
      *   (5) **Generalization Test:** Permissibility test = What if everyone in similar circumstances did that? (Kantian/Rule Utilitarian flavor).
      *   (6) **Bad Conventions:** No duty to preserve bad conventions. Deviation justified to move to better equilibrium (e.g., inefficient queues, deference).
      *   (7) **Arbitrary Norms:** Even norms solving *no* coordination problem (greetings) must be followed by visitors to avoid offense.

  3.  **Analyze the Two Unresolved Cases:**
      *   **Case A (Underpaid Tipper):** Tourist in non-tipping country, but staff underpaid.
          *   Tension: (3) says follow local convention (don't tip). (4) implies tipping might be moral if wages depend on it, but this is a *non-tipping* country. (6) allows deviating to fix bad norms, but is underpayment a "bad convention" or a structural economic issue?
      *   **Case B (Obvious Tourist Queue-Jumper):** Tourist cuts line at bus stop in queueing city.
