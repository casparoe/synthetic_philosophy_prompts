      *   *Friend's Critique:* She is right that (5) breaks Lewisian conventions. Universalizing a convention destroys the coordination point. The test needs to be restricted to moral norms, not coordination norms.

      *Refining the "Single Revision":* The most leverage comes from splitting the *source* of obligation. Distinguish "Coordination Obligations" (Lewisian, conditional, local) from "Moral Obligations" (Harm-based, universal). (3) currently mashes them.
      *   *Revision:* Split (3) into (3a) Coordination and (3b) Morality.
      *   *Actually, simpler:* Modify (3) to say "depends on what is locally in force *provided it does not violate (2) or (4)*." And modify (6) to say "justified for *locals* or *long-term residents*." This protects the visitor from having to be a revolutionary while acknowledging bad conventions exist.

      *Let's look closer at (3) vs (6).* (3) says "Whether a newcomer must follow... depends *only* on what is locally in force." (6) says "deliberately deviating... can be justified." If (6) is true, (3) is false. You can't have "depends only on local force" AND "justified to deviate."
      *   *Repair:* (3) needs a "ceteris paribus" or "prima facie" qualifier. Or (6) needs a "standing" qualifier.
