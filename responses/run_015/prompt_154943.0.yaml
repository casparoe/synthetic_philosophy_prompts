answer: |-
  Here is an audit of your position, structured as your reading group would likely deliver it: focusing on internal coherence, theoretical costs, and the specific friction points in your seven-point statement.

  ### 1. The Root Diagnosis: Ambiguity of "Convention"
  Before ranking the tensions, you need to address your friend's hint directly: **Yes, you are using "convention" to do three different jobs.**

  1.  **Lewisian Coordination (Points 1, 3, 7):** Arbitrary solutions to recurring problems (which side of the road to drive on, queueing). The obligation is conditional on others conforming.
  2.  **Moralized Norms (Points 2, 4):** Norms where breach causes specific harm (queue-jumping harms the person behind you; not tipping harms the server's livelihood). These look like conventions but function like moral duties.
  3.  **Social Mores (Point 7):** Norms that solve no coordination problem but signal respect (greetings). Breach causes "offense," which you treat as a binding obligation but distinguish from moral wrongs.

  Your tensions arise because you apply the *logic* of Type 1 (conditional, arbitrary) to Type 2 (moral, harm-based) and vice versa.

  ---

  ### 2. Ranked Tensions

  #### **Tension #1: The "Reform vs. Conform" Contradiction (3 vs. 6)**
  *   **The Conflict:** Point (3) states a visitor's obligation depends *only* on what is locally in force. Point (6) states that deviating from a "bad convention" to move the group to a better equilibrium is justified. If (6) is true, (3) is false. A visitor cannot have an obligation that depends *only* on local force if they are simultaneously justified in breaking that force to improve it.
  *   **What Must Give:** You must qualify (3) or restrict (6).
  *   **Cost:** If you qualify (3) (e.g., "follow local convention *unless* it is morally bad"), you lose the clean, decision-procedure simplicity of "When in Rome." The visitor now has to judge the convention before following it. If you restrict (6) (e.g., "only locals may reform"), you lose the universal moral claim that bad equilibria *should* be disrupted.
  *   **Cheaper Repair:** Restrict (6). Add a "capacity/standing" clause. Deliberate deviation is justified only for agents with the *standing* and *capacity* to shift the equilibrium. Transient visitors usually lack both. This preserves (3) for tourists while keeping (6) true for residents.

  #### **Tension #2: The "Lewis vs. Kant" Contradiction (1 vs. 5)**
  *   **The Conflict:** Point (1) adopts the Lewisian view: the reason to conform is *exhausted* by social facts (others do it, expect it). Point (5) adopts a Kantian/Rule-Utilitarian test: permissibility depends on a counterfactual generalization ("what if everyone did that?").
      *   Your friend is correct: applying (5) to Lewisian conventions destroys them. If everyone tests the convention by asking "what if everyone did this?", the common knowledge required for coordination collapses. Lewisian conventions work *because* we don't run the generalization test; we just follow the focal point.
  *   **What Must Give:** Point (5) cannot be the test for *all* acts described in (1) and (7).
  *   **Cost:** You lose a unified theory of permissibility. You must admit you have two ethical engines running: one for coordination (follow the focal point) and one for morality (generalization test).
  *   **Cheaper Repair:** Limit the scope of (5). Specify that the Generalization Test applies only to acts with moral stakes (Points 2 & 4), not to arbitrary coordination norms (Points 1 & 7).

  #### **Tension #3: The "Harm vs. Local Force" Contradiction (3 vs. 4)**
  *   **The Conflict:** Point (3) says follow the local convention regardless of whether it's "good." Point (4) says not tipping where wages depend on it is *morally wrong*. Imagine a tourist in a country where tipping *is* the convention, but they believe it's a bad system (wages should be higher). Point (3) says "tip." Point (6) suggests they might be justified in *not* tipping to help end the system. Point (4) says not tipping is *wrong*.
      *   More critically for your Case A: In a non-tipping country with underpaid staff, (3) says "don't tip." (4) is silent (wages don't *assume* tips). But (6) invites reform. The tension is whether economic harm overrides local convention.
  *   **What Must Give:** Point (3)'s claim that obligation depends *only* on local force.
  *   **Cost:** You admit that external moral facts (harm) can override local conventions.
  *   **Cheaper Repair:** Clarify (4) to cover structural harm even without local convention, or accept that (3) is a *prima facie* duty, not an absolute one.

  ---

  ### 3. The Single Best Revision

  **The Revision:** **Split the Source of Obligation.**
  Rewrite Point (3) to distinguish between *Coordination Conventions* and *Moral Norms*.

  > *Revised (3):* "Whether a newcomer must follow a local *coordination* convention depends only on what is locally in force... However, where a local practice involves moral harm (as in 2 and 4), the visitor is bound by the moral constraint regardless of local convention."

  **Why this cleans up the most:**
  1.  **Resolves (3) vs. (6):** It allows visitors to ignore "bad" conventions (like deference norms) if they are moral harms, but keeps them bound to arbitrary ones (like greetings) where (6) doesn't apply. It implicitly handles the "standing" issue because tourists rarely have the standing to fix moral harms through individual deviation (tipping doesn't fix wage law).
  2.  **Resolves (1) vs. (5):** It allows you to keep the Lewisian account (1) for coordination (no generalization test needed) and the Generalization Test (5) for moral norms. You stop asking "what if everyone jaywalked?" (coordination) and start asking "does jaywalking harm anyone?" (moral).
  3.  **Cost:** You lose the elegance of a single rule for all "conventions." You must now classify the norm before acting. But this is theoretically necessary given your commitments to both Lewis and moral realism.

  ---

  ### 4. Verdicts on the Two Cases

  #### **Case A: The Underpaid Tipper (Non-tipping country)**
  *   **Under Original View:** **Verdict: Do Not Tip.**
      *   *Reasoning:* Point (3) dominates ("depends only on what is locally in force"). Point (4) does not trigger because wages are not *built on the assumption* of tips (it's a non-tipping culture). Point (6) is weak because a single tourist tipping does not shift the equilibrium of wage laws.
      *   *Problem:* You feel uneasy because (4) hints at a moral duty to workers, but the logic forces you to ignore it.
  *   **Under Repaired View:** **Verdict: Do Not Tip.**
      *   *Reasoning:* This is a *coordination/economic convention*, not a moral norm enforced by tipping. Tipping individually does not resolve the moral harm (underpayment); it creates inequality among staff and violates the local coordination norm. The moral duty is to advocate for wage laws, not to breach the convention.
      *   *Change:* The verdict is the same, but the reasoning is stable. You aren't ignoring the harm; you are identifying that tipping is the wrong tool to fix it.

  #### **Case B: The Obvious Tourist Queue-Jumper**
  *   **Under Original View:** **Verdict: Do Not Jump.**
      *   *Reasoning:* Point (2) identifies queue-jumping as a moral wrong (harms specific people), not just a convention breach. Point (3) reinforces this (follow local queueing norm).
      *   *Problem:* You worry about the "Obvious Tourist" element. Does their status change the "relevantly similar circumstances" in (5)?
  *   **Under Repaired View:** **Verdict: Do Not Jump.**
      *   *Reasoning:* This falls under the *Moral Norm* bucket (Point 2), not arbitrary coordination. The Generalization Test (5) asks: "What if everyone *in relevantly similar circumstances* (tourists) jumped?" The line still breaks, the locals are still wronged. Tourist status is not morally relevant to the harm caused to the person behind you.
      *   *Change:* The reasoning shifts from "follow the local rule" to "do not harm specific others." This is stronger. It prevents the tourist from claiming "I didn't know the convention" as an excuse, because the duty is moral, not conventional.

  ---

  ### 5. Note on Your Friend's Critique (Point 5)
  Your friend is right that the Generalization Test hollows out Lewisian conventions.
  *   **Lewisian Conventions:** Rely on *expectations*. If I ask "What if everyone did this?", I am signaling I don't trust the expectation, which undermines the convention.
  *   **The Fix:** Do not try to rescue (5) for conventions. Admit (5) is the test for *moral permissibility*, while *conventional compliance* is tested by "Is this the focal point?"
  *   **Why it matters:** If you keep (5) for everything, you cannot explain why we should follow *arbitrary* norms (like Point 7's greetings). There is no moral generalization failure if everyone stops greeting strangers; it's just less friendly. You need the Lewisian account for that. Keep the tests separate.

  ### Summary for your Talk
  1.  **Acknowledge the Ambiguity:** Start by distinguishing Coordination Conventions from Moral Norms.
  2.  **Adopt the Split:** Argue that visitors must follow Coordination Conventions unconditionally (Lewis), but must follow Moral Norms universally (Kant/Mill), regardless of local practice.
  3.  **Limit Reform:** Argue that visitors generally lack the standing to use deviation as a reform tool (Point 6), protecting you from the "revolutionary tourist" problem.
  4.  **Verdicts:** Use the cases to show how the split clarifies the reasoning (Tipping = Coordination/Economic; Queueing = Moral Harm).

  This preserves 80% of your text while removing the internal contradictions that will be the first targets of your reading group.
