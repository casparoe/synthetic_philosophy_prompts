answer: |-
  **JOINT STATEMENT ON COMPUTATIONAL COMPLEXITY AND EPISTEMIC NORMS**

  **Parties:** The Idealist (Supervisor) and The Feasibilist (Researcher)
  **Date:** October 2023
  **Subject:** The Normative Status of Intractable Epistemic Requirements

  ### I. AGREED CLAIMS

  We begin by codifying the mathematical and philosophical premises upon which our disagreement rests. We accept the following without reservation:

  1.  **Complexity Facts:** We agree that exact probabilistic inference in general Bayesian networks is #P-hard. We agree that checking a large corpus of beliefs for strict logical consistency is NP-hard. We agree that for any agent with polynomially bounded computational resources (which includes all known physical agents), exact conditionalization on realistic evidence sets is physically impossible in the general case.
  2.  **The Nature of Bounds:** We agree that "feasibility" is not a binary switch but a function of resource parameters $R$ (time, memory, energy). We agree that for any fixed $R$, there exist problem instances of size $n$ that exceed the agent's capacity to solve exactly.
  3.  **Normative Function:** We agree that an epistemic norm must, in principle, discriminate between better and worse doxastic states. A norm that rates all possible belief states as equally permissible is vacuous.
  4.  **Dutch Books and Computation:** We agree that constructing a Dutch book against an agent requires solving a system of linear inequalities based on the agent's credences. We agree that if the agent cannot compute their own credences precisely due to complexity constraints, they cannot detect the Dutch book themselves.
  5.  **Worst-Case vs. Average-Case:** We agree that worst-case complexity lower bounds do not entail that *every* instance is hard. We agree that "smoothed analysis" and average-case complexity are relevant to describing the typical difficulty of inference tasks in natural environments. However, we agree that a norm claiming universal applicability cannot rely solely on average-case ease if worst-case hardness implies catastrophic failure in specific, possible scenarios.
  6.  **Logical Omniscience:** We agree that standard Bayesianism entails logical omniscience (credence 1 in all tautologies). We agree that no bounded agent satisfies this. We agree that the Idealist treats this as an asymptotic limit, while the Feasibilist treats it as a falsification of the norm's applicability.

  ---

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the specific points of contention. We commit to the predictions listed herein.

  | Crux | Idealist Formulation | Feasibilist Formulation | Agreed Test / Case | Prediction (Idealist) | Prediction (Feasibilist) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Assessment vs. Guidance** | Epistemic norms are **standards of assessment**, not recipes for action. A map is not the territory; a norm is not an algorithm. "Ought implies can" applies to obligations, not to evaluative standards. A student ought to solve the PDE exactly, even if they can only approximate it; the approximation is graded against the exact solution. | Epistemic norms are **constraints on procedures**. If a norm cannot guide the transition from state $t_1$ to $t_2$ for *any* feasible agent, it fails to distinguish rational from irrational agency. A standard that no one can meet is not a standard of rationality; it is a definition of divinity. | **The Universal Violation Case:** Imagine a world where *every* agent, due to physical laws, violates Norm $N$ 100% of the time. | $N$ remains valid. It reveals that all agents are imperfect. The norm retains its discriminatory power in logical space, even if no agent occupies the valid region. | $N$ is invalid. If the set of compliant agents is empty, the norm divides nothing. It is empirically falsified as a norm of *agency*. |
  | **2. Universal Violation** | Universal unavoidable violation is the **human condition**, not a defect in the norm. The gap between norm and performance generates the normative pressure required for improvement. Removing the ideal removes the direction of improvement. | Universal unavoidable violation is a **defect in the norm**. A norm that demands the impossible creates normative noise, not pressure. It classifies all agents as equally irrational, destroying the gradient needed for improvement. | **The "Maximal Irrationality" Test:** If Norm $N$ classifies a careful, heuristic-based scientist and a delusional gambler as equally "irrational" (because both violate coherence), does $N$ fail? | $N$ still distinguishes them via *degree* of violation (distance from coherence). The norm holds; the metric does the work. | Distance from an unreachable ideal is not a reliable metric of rationality. The scientist is following a better *process*, which $N$ ignores. |
  | **3. Feasible Dominance Principle** | **Rejected.** Dominance must be defined relative to Truth or Coherence, not relative to the Ideal's output. If Tractable Rule $A$ outperforms Approximation of Ideal $I$, it is because $A$ is accidentally aligned with Truth, not because $A$ defeats $I$. $I$ remains the normative anchor. | **Accepted.** If Tractable Rule $A$ guarantees outputs within $\epsilon$ of Ideal $I$ on all relevant cases, and no feasible approximation of $I$ does better, then $A$ is the normative requirement. $I$ is normatively inert if it cannot be approached better than $A$ approaches it. | **The Override Case:** Construct a scenario where Approx($I$) yields credence 0.6, Rule $A$ yields 0.7, and Truth is 0.8. Rule $A$ is not an approximation of $I$ (which would aim for 0.6 given the evidence processing limits). | Idealist predicts $I$ is still the norm. $A$ is just a lucky hack. We should still try to approximate $I$, even if $A$ wins locally. | Feasibilist predicts $A$ becomes the norm. Adhering to $I$'s logic leads to worse epistemic outcomes than adhering to $A$'s logic. |
  | **4. The Approximation Trap** | **Rare Pathology.** The trap (where the best tractable rule is *not* an approximation of the ideal) occurs only in adversarial or highly contrived distributions. In natural settings, the ideal structure tracks reality closely enough that approximating the ideal is the best strategy. | **Common Feature.** In high-dimensional spaces, the "ideal" distribution often overfits the structural assumptions of the model. Tractable heuristics (e.g., take-the-best, recognition) often ignore variables the Ideal requires, outperforming the Ideal's approximation. | **High-Dimensional Sparse Data:** Agents must infer causal structure from $N$ variables where $N \gg$ data points. Compare $L_1$ regularization (heuristic-ish) vs. Bayesian Model Averaging (Ideal-ish). | Idealist predicts Bayesian Model Averaging (approximated) will eventually dominate as data grows. The trap is a small-sample artifact. | Feasibilist predicts the heuristic dominates indefinitely because the "Ideal" model class is misspecified for the computational cost of searching it. |
  | **5. Regress of Feasibility** | **Fatal Objection.** To apply Feasibilist norms, one must calculate the resource bound $R$. Calculating $R$ is itself a computational task. If that task is hard, you need a meta-norm to bound it. This leads to infinite regress or paralysis. | **Contextual Resolution.** $R$ is not calculated by a norm; it is **given by the context** (biology, hardware, time pressure). The norm is indexed to $R$, but checking $R$ is an empirical fact, not a normative requirement. No regress occurs. | **The Emergency Case:** An agent has 2 seconds to decide. Do they need to compute "is 2 seconds enough to compute the norm?" | Idealist predicts the Feasibilist agent stalls trying to verify their own bounds. | Feasibilist predicts the agent acts using the norm indexed to $R=2s$ immediately. The bound is exogenous. |
  | **6. Worst-Case Relevance** | **Existence Proofs.** Worst-case hardness proves that the Ideal cannot be *generally* adopted as a procedure. It does not prove the Ideal is wrong as a standard. The possibility of intractability limits guidance, not assessment. | **Normative Relevance.** If a norm fails in worst-case scenarios that are *possible* (even if rare), it cannot be a universal norm. Epistemology must cover the space of possible experiences, not just the average case. | **Adversarial Evidence:** An environment specifically designed to trigger the worst-case complexity of the agent's inference engine. | Idealist says the agent is excused from the norm in this case, but the norm remains valid for non-adversarial cases. | Feasibilist says a norm that breaks under adversarial conditions is fragile. We need norms robust to worst-case inputs. |

  ---

  ### III. ARBITRATION AND VERBAL DISPUTES

  **1. The Verbal Dispute: "Norm" as Standard vs. Rule**
  We identify a significant verbal disagreement underlying Crux 1 (Assessment vs. Guidance).
  *   **The Idealist** uses "Norm" to mean a **Teleological Standard**: A definition of the perfect state of affairs (like "Perfect Health"). One can be unhealthy without violating a rule; one simply fails to meet the standard.
  *   **The Feasibilist** uses "Norm" to mean a **Deontic Rule**: A constraint on the decision-making procedure (like "Take this medicine"). One cannot be obligated to take medicine that does not exist.

  **Resolution:** This is not *merely* verbal. If the Idealist is right, epistemology is a branch of axiology (the study of value states). If the Feasibilist is right, epistemology is a branch of engineering (the study of control systems).
  **Verdict:** The Feasibilist has the stronger claim for *rationality*. Rationality is a property of agents, not of belief states in the abstract. A standard that cannot be instantiated by any agent in the universe is a standard for gods, not a norm for rationality. However, the Idealist is correct that we need *some* target to define "better." The compromise is that the Ideal serves as a **directional vector**, not a **compliance condition**.

  **2. Where the Idealist is in Trouble**
  The Idealist's position collapses if the "distance from ideal" metric fails to correlate with epistemic success (truth/accuracy). If an agent is "more coherent" (closer to the Ideal) but "less accurate" (further from truth) than a less coherent agent, the Ideal loses its normative force.
  *   **Condition for Idealist Concession:** If the Feasibilist can demonstrate a systematic class of problems where increasing coherence (via feasible approximation) *decreases* accuracy, the Idealist must abandon coherence as the primary norm.
  *   **My Assessment:** This condition is met in high-dimensional, sparse environments (see Crux 4). Regularization techniques (which violate strict coherence to prevent overfitting) outperform coherent Bayesian updating. The Idealist must concede that coherence is instrumentally valuable, not intrinsically normative.

  **3. Where the Feasibilist is in Trouble**
  The Feasibilist's position collapses if "feasibility" cannot be defined without invoking the Ideal. If we cannot specify what counts as a "good enough" approximation without referencing the exact value we are approximating, the Ideal remains the anchor.
  *   **Condition for Feasibilist Concession:** If every tractable rule $A$ that outperforms Approx($I$) can be mathematically rewritten as a prior-weighted approximation of $I$, then $I$ remains the fundamental norm, merely disguised.
  *   **My Assessment:** This is unlikely. Heuristics like "take the best" rely on non-compensatory reasoning that is structurally distinct from weighted averaging (Bayesianism). They are not approximations; they are different algorithms. The Feasibilist is safe here.

  **4. Final Stance on the "Regress" Objection (Crux 5)**
  The Idealist's regress objection is the strongest argument against the Feasibilist. However, it relies on the assumption that agents must *calculate* their bounds normatively.
  *   **Resolution:** We agree that bounds are **empirical constraints**, not normative choices. An agent does not *decide* to have 10GB of RAM; they *have* it. Therefore, no norm is required to set $R$. The norm is simply conditional: *Given $R$, do $X$.* The Idealist's regress worry is unfounded provided we treat resources as exogenous parameters.

  **5. Conclusion on the "Approximation Trap"**
  The Feasibilist is correct that the Approximation Trap is not a pathology but a feature of complex systems. In computational learning theory, the "No Free Lunch" theorems imply that no single ideal strategy works across all distributions. Therefore, a norm that prescribes a single Ideal strategy (Bayesian Conditionalization) is provably suboptimal across the space of possible worlds.
  *   **Commitment:** The Idealist must accept that Bayesian Conditionalization is not a universal norm. It is a local optimum for specific resource/environment pairings. The Feasibilist must accept that without *some* ideal limit, we cannot define the "resource/environment pairing" rigorously.

  **Signed,**

  _________________________ (The Idealist)
  _________________________ (The Feasibilist)
  _________________________ (The Arbiter)
