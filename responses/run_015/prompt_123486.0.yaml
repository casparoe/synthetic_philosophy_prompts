prompt: |-
  Hey — please act as a professional philosopher who actually works at the intersection of formal epistemology and computational complexity theory, and take this seriously rather than giving me the balanced-survey shrug: before you write anything, spend a bit of time brainstorming what each camp is *really* committed to (including what each would have to give up), and then draft the actual document. No citations, no reading lists, no "see So-and-so 1994" — I'm on a field station without library access and I want arguments, not bibliography.

  Here's the situation. My supervisor and I have been going at each other for almost two years about whether computational difficulty can ever be a *normative* defeater for an epistemological requirement. Concretely: exact inference in a large Bayes net is #P-hard, checking a big corpus of beliefs for consistency looks NP-hard, and exact Bayesian conditionalization over anything realistic is off the table. Does that tell against conditionalization *as a norm*, or is it just an engineering annoyance that leaves the norm untouched? She's what we've started calling the **idealist**: probabilistic coherence plus conditionalization are the requirements, full stop; they function as standards of assessment even when they can't guide anyone, ought-implies-can doesn't bind norms of this kind the way it binds obligations, and the fact that everyone violates them constantly is exactly why we need them. I'm the **feasibilist**: a requirement that no feasible procedure can even approximately satisfy, and whose violation is universal and unavoidable, isn't doing any discriminating normative work, and we should replace it with a family of resource-indexed norms — norms that carry a resource parameter R, so that the idealist's requirement is only the R → ∞ limit, and a limit need not itself be a norm. I've also been pushing two ideas of my own that she hates: (a) the *feasible dominance principle* — a tractable rule A defeats an intractable ideal I when A's outputs are guaranteed to land within some small distance of I's on the cases that matter while no feasible approximation to I gets reliably closer; and (b) what I call the *approximation trap* — the possibility that the best tractable approximation to an ideal is sometimes dominated outright by a rule that isn't an approximation to it at all, in which case "approximate the ideal" was never the right method and the ideal was a red herring.

  What I want from you is the joint statement we should have written a year ago, the kind of document both of us would sign. Start with a numbered section of agreed claims: what we both accept about the complexity facts themselves, about what a norm is supposed to do, about whether Dutch-book-style arguments transfer to resource-bounded agents, about whether worst-case hardness results even bear on typical instances (average-case behaviour, smoothed analysis, the fact that hard instances can be rare), and about whether the idealist is in trouble independently — logical omniscience and the fact that ideal Bayesianism can't even state its own updating rule for a realistic agent. Then give me a table of the residual disagreements, with these columns: the crux; the idealist's formulation, worded so my supervisor would sign it; my formulation, worded so I'd sign it; a test, case, or argument both of us already accept as genuinely bearing on that crux; and each side's prediction about how it will come out, written down in advance so neither of us can wriggle later. The cruxes I want in there, at minimum: assessment versus guidance; whether universal unavoidable violation is a defect in a norm or just the human condition; my feasible dominance principle and whether it is well defined at all; how common the approximation trap actually is; whether "feasible" itself is tractable to apply, or whether my view collapses into a regress of ever-more-expensive meta-computation; and whether worst-case intractability is even the right notion to appeal to. Please also flag explicitly, and with reasons, which of our disagreements you think are merely verbal — I strongly suspect at least one of them is, and I can't tell which. Don't hedge everything into mush: where you think one of us has the better of a crux, say so, and say what would have to happen for you to change your mind.
