          *   School Initiative: Pushing anonymous reporting app (report, don't confront).
          *   Board Complication: Two members argue the reporting app encourages "victim competition," making it hypocritical to punish Malik for not using it.
      *   **Key Intellectual Challenge:** Is "cultural rules" a valid moral reason or just an excuse? How to use "honor vs. dignity vs. victimhood" concepts without sounding academic/pretentious.
