answer: |-
  **Title:** The Separateness of Persons in Democratic Climate Policy: An Anti-Aggregationist Defense of Distributed Adaptation

  **Introduction**

  In contemporary moral philosophy, the ethics of aggregation remains one of the most contentious domains. The central debate concerns whether the strength of a moral obligation is determined by the sum of individual claims or by the inviolability of each distinct claim. In rescue cases, anti-aggregationists like John Taurek and T.M. Scanlon have argued that the presence of multiple individuals with parallel claims does not dilute the claim of a single individual; one cannot simply sum the interests of the many to override the vital interests of the few. While this debate has traditionally been confined to interpersonal ethics, this paper argues that the moral logic underlying the rejection of counting numbers in rescue cases must govern the design of democratic institutions, specifically regarding climate-adaptation funding.

  When a democratic body allocates resources between a large infrastructure project that saves a large number of lives and several smaller projects that collectively save fewer lives but serve distinct communities, standard utilitarian reasoning dictates maximizing the total lives saved. However, I contend that legitimate democratic procedure should treat every affected community as bearing an equal, non-aggregable claim to protection. Consequently, selecting the smaller-project option is morally required, even if it results in fewer total lives saved. This position does not undermine democratic legitimacy; rather, it secures it by ensuring that institutional decision-making respects the separateness of persons and avoids treating marginalized communities as mere means to aggregate welfare.

  **The Moral Logic of Non-Aggregation**

  To extend the anti-aggregationist view to institutional design, we must first clarify the moral intuition at its core. In his seminal essay "Should the Numbers Count?", John Taurek challenges the notion that we are morally obligated to save the greater number in rescue scenarios. Taurek argues that death is a comparable loss for each individual, but there is no "super-loss" experienced by the group. To prioritize the many is to imply that the single individual's loss counts for less simply because others are also suffering. Similarly, T.M. Scanlon's contractualism suggests that a principle of action is justified only if it cannot be reasonably rejected by those affected. An individual facing abandonment can reasonably reject a principle that sacrifices their survival solely to add to the total welfare of others, as this treats their distinct status as fungible.

  The crucial insight here is that moral claims are not fluid quantities that can be pooled. A claim to life-saving assistance is a binary barrier: it demands satisfaction or requires a justification for its violation that appeals to the individual's own standpoint, not merely to the standpoint of the collective. When we aggregate, we engage in a "transpersonal summation" that obscures the fact that we are choosing *who* will be abandoned. In a rescue case, saving the five instead of the one means the one is left to die *because* of the five. In an institutional context, funding a mega-project over distributed projects means smaller communities are left vulnerable *because* the larger population's numbers outweighed them.

  **Application to Climate-Adaptation Funding**

  This moral logic translates directly to the allocation of climate-adaptation funding. Consider a democratic body deciding between two options: Option A is a massive sea wall protecting a dense metropolitan area, saving 100,000 lives. Option B involves distributed drainage systems, elevation grants, and localized flood defenses across ten distinct rural communities, collectively saving 50,000 lives. A utilitarian calculus unequivocally selects Option A. However, an anti-aggregationist institutional design rejects this summation.

  In this scenario, each community possesses a claim to existential security. These claims are held by distinct political bodies, not merely by atomized individuals. If the state chooses Option A, it is not merely saving more people; it is effectively deciding that the claims of the rural communities are worth zero in the face of the metropolitan claim. The metropolitan claim does not become "stronger" in a way that morally overrides the rural claims simply because it is held by more people. The rural communities face a total loss of their habitat and security. To deny them funding because their numbers are lower is to treat their political existence as negotiable.

  By choosing Option B, the democratic institution acknowledges that the obligation to aid is not satisfied by maximizing the *volume* of rescue, but by honoring the *distribution* of claims. While Option B results in fewer total lives saved, it avoids the moral catastrophe of entirely abandoning distinct groups. It recognizes that the state's obligation is to each community as a constituent unit of the polity, not to a hypothetical "total population" aggregate. In climate justice, where historical vulnerabilities often correlate with smaller, marginalized populations, aggregation functions as a mechanism of structural oppression. Non-aggregation serves as a procedural safeguard against the tyranny of the demographic majority.

  **Addressing the Democratic Objection**

  The most significant objection to this proposal concerns democratic legitimacy. Critics argue that democratic legitimacy depends precisely on aggregating individual preferences into collective choices. Voting, after all, is a counting mechanism. If a democratic body ignores the "will of the numbers" in favor of a non-aggregationist principle, does it not become undemocratic, arbitrary, or unaccountable? If we do not count lives, how do we justify the decision to the 100,000 people in the metropolis who are left less protected?

  This objection conflates two distinct forms of aggregation: the aggregation of *preferences* (voting) and the aggregation of *moral claims* (utilitarian calculus). Democratic legitimacy requires the former to ensure procedural fairness, but it does not mandate the latter in matters of fundamental rights. We do not allow a majority vote to violate the rights of a minority, even if violating those rights would produce greater aggregate utility. For example, a majority cannot vote to confiscate the property of a few to feed the many, even if the net welfare gain is positive. We accept constitutional constraints on aggregation because we recognize that certain claims (rights) are non-aggregable.

  Extending the anti-aggregationist insight to climate adaptation treats existential security as analogous to a right. It posits that no community's claim to survival can be summed away by the claims of others. This does not collapse into arbitrary decision-making. On the contrary, pure aggregation is more prone to arbitrariness because it allows the moral weight of a decision to shift based on demographic fluctuations. A non-aggregationist procedure is governed by a strict, principled constraint: *equal respect for distinct claims.*

  Furthermore, this approach enhances accountability. Under a utilitarian regime, representatives are accountable only for maximizing efficiency. If they sacrifice a small community for the greater good, they have technically fulfilled their mandate. Under a non-aggregationist regime, representatives are accountable to *every* constituency individually. They must justify why a specific community's claim was not met, rather than hiding behind the total sum of benefits. This forces a deliberative process where the specific needs of each community are articulated and weighed, rather than subsumed into a statistic. It shifts the democratic ideal from "the greatest good for the greatest number" to "equal protection for every distinct group."

  **Conclusion**

  The resistance to counting numbers in rescue cases is not merely a quirk of interpersonal ethics; it is a necessary condition for a just political order. When democratic institutions design climate-adaptation strategies, they are not merely moving resources; they are deciding whose lives are protectable and whose are expendable. If we allow the logic of aggregation to govern these decisions, we sanction a system where the moral worth of a community is determined by its population density.

  By defending the selection of smaller, distributed projects even when they save fewer total lives, we affirm that the state's obligation is to the individual claim, not the collective sum. This approach does not undermine democracy but refines it, distinguishing between the legitimate counting of votes and the illegitimate counting of human worth. In a world facing climate catastrophe, a democracy that refuses to trade the few for the many preserves the only foundation upon which legitimate collective action can rest: the inviolable status of every person and every community it serves.
