  **Interpretation 2: Cost-Sensitive Epistemic-Utility**
  This view holds that epistemic success is determined by maximizing expected epistemic utility, defined as accuracy net of cognitive, computational, and framework-transition costs. False lemmas and accuracy deficits are treated uniformly as negative utility factors. An agent succeeds if the marginal utility of correcting a flaw (whether an accuracy deficit or a false premise) is outweighed by the cost of correction. This view explains Case 2 (failure) as a instance where the cost of excising the inert lemma was zero, so ignoring it reduced net utility. It explains Cases 1 and 5 (success) as instances where the cost of higher accuracy outweighed the gain.
