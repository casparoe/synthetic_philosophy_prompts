  **Interpretation 1: Calibrated-Reliabilism with Reasoning Purity and Free-Improvement Obligation**
  This view holds that epistemic success requires three conjunctive conditions: (1) the belief must be true and locally calibrated; (2) the reasoning process must be pure (containing no false premises or lemmas); and (3) the agent must satisfy a deontic obligation to adopt any accuracy-improving or purity-restoring measure that is available at negligible or free cost. On this interpretation, cost functions as an excuse for *degrees* of accuracy (explaining Cases 1 and 5) but not for *structural* flaws in reasoning. Because Case 2 resulted in a failure due to a false lemma—even though it was causally inert—this view treats reasoning purity as a constraint rather than a scalar value.
