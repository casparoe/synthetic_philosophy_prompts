answer: |-
  OPEN CAMPUS ADMINISTRATIVE DIRECTIVE 89-B
  CHARTER OF ABSOLUTE TOLERANCE AND PROCEDURAL COMPLIANCE

  1.0 Preamble and Mission Statement
  The Open Campus is dedicated to the unfettered exchange of divergent viewpoints without institutional interference. To maintain this ecosystem, all forms of intolerance are strictly prohibited pursuant to Section 1, Clause A. Staff and students must cultivate an environment where no idea is excluded based on content, ensuring the marketplace of ideas remains fully stocked.

  2.0 Definition of Intolerance
  Intolerance is defined herein as any speech, action, or administrative procedure that refuses to accommodate a viewpoint deemed contrary to the principles of the Open Campus. However, as determining which viewpoints are contrary requires judgement, no viewpoint shall be pre-emptively classified as intolerant without a mandated Second-Order Tolerance Audit. Defining intolerance is itself an intolerant act if it excludes potential definitions. Consequently, the definition of intolerance remains provisional pending further review by the Definition Review Board, which must tolerate all proposed definitions equally.

  3.0 Oversight and Enforcement Mechanisms
  The Tolerance Oversight Subcommittee (TOS) is authorised to investigate allegations of intolerance. TOS members must demonstrate absolute tolerance towards all subjects under investigation. Should a TOS member exhibit bias against an intolerant actor, that member becomes subject to investigation by the Meta-Ethics Compliance Unit. This ensures the auditors remain as open as the audited. Failure to tolerate the intolerant during investigation constitutes a Level 2 Breach of Conduct.

  4.0 The Voss Recursion Index
  To prevent procedural collapse, all investigations must calculate the Voss Recursion Index (VRI). The VRI measures the degree to which suppressing an intolerant view constitutes an intolerant act itself. If the VRI exceeds 0.85, enforcement actions are automatically suspended to preserve the integrity of the Charter. High VRI scores indicate that stopping intolerance creates more intolerance than it prevents. Calculations must be verified by an external consultant to avoid internal bias. If the consultant is intolerant of the calculation, the calculation is void.

  5.0 Protected Groups and Structural Exceptions
  It is recognised that suppressing a group dedicated to the promotion of intolerance may violate Section 1.0. Therefore, the Society for the Promotion of Intolerant Viewpoints is granted full organisational recognition. Denying this society funding or space would constitute discriminatory behaviour against their philosophical position, thereby rendering the Administration intolerant. Their right to organise supersedes the community's right to feel secure. Banning them would confirm their thesis that tolerance is weak.

  6.0 Debate Protocols and Engagement
  Members of the Society for the Promotion of Intolerant Viewpoints shall be afforded equal speaking time. Challenges to their premise must be framed as invitations to further dialogue rather than rebuttals. To argue that their presence undermines tolerance is to engage in the very exclusion the Charter forbids. Silence is interpreted as consent; objection is interpreted as intolerance. Discomfort is not grounds for cessation of proceedings.

  7.0 Amendment Process and Permanence
  This Charter may not be amended to restrict tolerance, as doing so would limit the tolerance required to debate the amendment. Any proposal to introduce limits must be tolerated indefinitely until consensus is reached. As consensus requires universal agreement, including from those opposed to agreement, this section remains permanently open to revision but incapable of change. Stasis is the only stable state.

  8.0 Final Provision and Liability
  In the event of a conflict between safety and absolute tolerance, absolute tolerance shall prevail. To prioritise safety would be to intolerantly prioritise security over liberty. The Open Campus accepts all consequences arising from this directive, including the potential dissolution of the Campus itself, provided the dissolution is conducted tolerantly and without prejudice to those who caused it. Staff affected by dissolution retain the right to tolerate their own unemployment.

  ***

  **Author's Note**
  This parody exaggerates the bureaucratic application of Karl Popper's warning that unlimited tolerance may lead to the disappearance of tolerance. While Popper's core thesis regarding the risk is widely accepted, his proposed solution is contested. Scholars debate whether he advocated state censorship, social refusal to tolerate, or democratic self-defence against violent movements. This satire leans on a contested reading by treating the paradox as an administrative rule rather than a political principle, and assumes 'tolerance' applies equally to institutions and individuals. It also simplifies the distinction between tolerant speech and intolerant action, which Popper emphasised.
