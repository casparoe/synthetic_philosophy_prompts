answer: |-
  # DECISION TREE: INHERITANCE AND EQUAL OPPORTUNITY

  **NODE 1:** Is the intergenerational transmission of significant private wealth presumptively compatible with a society of equals?
  *   **YES** → Go to **NODE 2**.
  *   **NO** → Go to **NODE 3**.

  **NODE 2:** (If Compatible) Does this compatibility rely on the right of the owner to dispose of property, or the right of the heir to receive it?
  *   **Owner's Right** → **LEAF 1: Laissez-Faire Libertarianism**.
  *   **Heir's Right** → **LEAF 2: Dynastic Entitlement (Undefended)**.

  **NODE 3:** (If Incompatible) Is the primary moral wrong located in the *individual transaction* (bequest/receipt) or the *aggregate social structure* (concentration of power)?
  *   **Individual Transaction** → Go to **NODE 4**.
  *   **Aggregate Social Structure** → Go to **NODE 6**.

  **NODE 4:** (If Individual Transaction) Do familial relationships generate moral permissions that override general distributive principles?
  *   **NO** → **LEAF 3: Strict Abolitionism**.
  *   **YES** → Go to **NODE 5**.

  **NODE 5:** (If Familial Permissions) Does the moral permission to favor kin attenuate (weaken) with each successive generation?
  *   **NO** → **LEAF 4: Familial Absolutism (Incoherent)**.
  *   **YES** → Go to **NODE 5B**.

  **NODE 5B:** (If Attenuating) Does the moral status of the wealth depend on its economic function (e.g., productive firm vs. consumptive home)?
  *   **NO** (All wealth treated alike) → **LEAF 5: The Rignano Scheme**.
  *   **YES** (Function matters) → **LEAF 6: Functional Exemptionism**.

  **NODE 6:** (If Aggregate Structure) Is the threat to equality located in the recipient's unearned advantage or the donor's lingering control?
  *   **Recipient's Advantage** → **LEAF 7: Accessions Tax (Fair Start)**.
  *   **Donor's Control** → Go to **NODE 7**.

  **NODE 7:** (If Donor's Control) Is the remedy applied at the moment of transfer (flow) or continuously on the holding of assets (stock)?
  *   **Moment of Transfer** → **LEAF 8: Dynastic Cap**.
  *   **Continuous Holding** → Go to **NODE 8**.

  **NODE 8:** (If Continuous Holding) Is the goal to equalize individual opportunities or to prevent class domination?
  *   **Individual Opportunities** → **LEAF 9: Egalitarian Wealth Tax**.
  *   **Class Domination** → **LEAF 10: Democratic Wealth Tax**.

  ***

  ## THE LEAVES

  **LEAF 1: Laissez-Faire Libertarianism**
  *   **Position:** Inheritance is a fundamental property right; state interference is unjust coercion.
  *   **Awkward Commitment:** Must accept that a great-grandchild in a trust has a more just claim to resources than a talented orphan, provided the title chain is unbroken.
  *   **Test Cases:** *House:* Fully transferable. *Firm:* Fully transferable. *Trust:* Perpetual trusts allowed.

  **LEAF 2: Dynastic Entitlement (Undefended)**
  *   **Position:** Heirs have a natural right to receive ancestral wealth regardless of the giver's liberty.
  *   **Awkward Commitment:** Must explain why a child has a claim on a parent's assets that the parent themselves does not have the right to revoke.
  *   **Test Cases:** *House:* Heir can claim it even if parent wills it elsewhere. *Firm:* Heir owns firm even if parent wanted to sell. *Trust:* Heir can demand dissolution or payout.
  *   **Status:** **EMPTY/UNDEFENDED.** No serious theory posits a right to receive without a corresponding right to give.

  **LEAF 3: Strict Abolitionism**
  *   **Position:** All intergenerational transfers above a subsistence minimum are unjustified unearned luck.
  *   **Awkward Commitment:** Must forbid parents from paying for a child's university tuition or gifting a down-payment for a home during the parent's life to avoid circumvention.
  *   **Test Cases:** *House:* Must be sold to state/strangers at death. *Firm:* Must be liquidated or socialized at death. *Trust:* Prohibited entirely.

  **LEAF 4: Familial Absolutism (Incoherent)**
  *   **Position:** Family partiality is absolute, yet inheritance is incompatible with equality (from Node 1 "NO").
  *   **Awkward Commitment:** Claims inheritance violates equality but simultaneously claims family rights override equality without limit.
  *   **Status:** **INCOHERENT.** Contradicts the entry condition of Node 3.

  **LEAF 5: The Rignano Scheme**
  *   **Position:** The right to bequeath is real but exhaustible; the tax rate climbs with each generation the same wealth passes.
  *   **Awkward Commitment:** Must tax the same asset differently depending on how many times the previous owner has died, requiring tracking of "wealth generations" rather than just value.
  *   **Test Cases:** *House:* Cheap to leave to child, expensive to leave to grandchild. *Firm:* Same rule applies, risking breakup if tax bill exceeds liquidity. *Trust:* Effectively banned beyond 2nd generation due to prohibitive rates.

  **LEAF 6: Functional Exemptionism**
  *   **Position:** Family partiality is permitted for "use" assets (homes, small firms) but not for passive capital.
  *   **Awkward Commitment:** Must draw a legally contestable line between a family home and a rental portfolio, or a working firm and a holding company.
  *   **Test Cases:** *House:* Exempt from tax. *Firm:* Exempt if family works in it, taxed if not. *Trust:* Taxed unless it holds only exempt assets.

  **LEAF 7: Accessions Tax (Fair Start)**
  *   **Position:** The problem is the recipient's windfall; lifetime receipts should be taxed progressively to ensure a fair starting line.
  *   **Awkward Commitment:** Treats a gift from a poor aunt the same as a bequest from a rich father if the total lifetime receipt is identical, ignoring the relational context.
  *   **Test Cases:** *House:* Taxed based on child's total lifetime receipts. *Firm:* Taxed on value received, potentially forcing sale. *Trust:* Taxed when beneficiary gains access to funds.

  **LEAF 8: Dynastic Cap**
  *   **Position:** Wealth transfer is fine until it creates permanent classes; a hard limit stops wealth passing beyond a certain point or generation.
  *   **Awkward Commitment:** Must arbitrarily define a "sufficient" amount of wealth, below which dynastic power is impossible and above which it is inevitable.
  *   **Test Cases:** *House:* Allowed if under cap value. *Firm:* Allowed if valuation under cap. *Trust:* Terminated once capital exceeds cap threshold.

  **LEAF 9: Egalitarian Wealth Tax**
  *   **Position:** Large concentrations of wealth distort opportunity regardless of transfer; annual levies reduce the stock.
  *   **Awkward Commitment:** Must value illiquid assets (like private firms) annually, risking forced sales to pay tax bills even if the firm is profitable but cash-poor.
  *   **Test Cases:** *House:* Taxed annually on value. *Firm:* Taxed annually on equity value. *Trust:* Taxed annually on corpus.

  **LEAF 10: Democratic Wealth Tax**
  *   **Position:** The goal is not equal opportunity but preventing oligarchy; taxes target only the extreme upper tail of power.
  *   **Awkward Commitment:** Accepts significant inequality of opportunity for the merely rich, intervening only when wealth translates directly into political domination.
  *   **Test Cases:** *House:* Untaxed (rarely oligarchic). *Firm:* Untaxed unless monopoly power exists. *Trust:* Taxed only if voting rights concentrate political influence.

  ***

  ## STRUCTURAL ANALYSIS

  **Indistinguishable Leaves:**
  *   **Leaf 3 (Strict Abolitionism) vs. Leaf 7 (Accessions Tax @ 100%):** If the Accessions Tax rate is set to 100% above a subsistence level, the policy outcome is identical to Abolitionism. The tree separates them by *justification* (transactional wrong vs. recipient advantage), but empirically they collapse.
  *   **Leaf 9 (Egalitarian Wealth Tax) vs. Leaf 10 (Democratic Wealth Tax):** Both instruments are annual levies on stock. They differ only in the *threshold* and *intent*. In practice, a high-threshold Democratic Tax looks like a low-threshold Egalitarian Tax if inflation erodes the threshold over time.

  **Empty/Incoherent Combinations:**
  *   **Leaf 2 (Dynastic Entitlement):** As noted, this position is logically unstable. A right to receive implies a duty on others to provide; without a corresponding right to give, the duty falls on the state, which contradicts the private nature of inheritance.
  *   **Leaf 4 (Familial Absolutism):** This is a logical contradiction within the tree's topology. One cannot enter Node 3 (Inheritance is incompatible with equality) and then assert at Node 4/5 that family rights override that incompatibility without limit. If they override it without limit, one should have answered "YES" at Node 1.

  **Test Case Adjudication:**
  *   **The Family House:** The tree cleanly separates views that see the home as *capital* (Leaves 3, 5, 7, 9) from those that see it as *shelter/familial* (Leaves 1, 6, 10).
  *   **The Family Firm:** The tree separates views that prioritize *continuity of production* (Leaf 6) from those that prioritize *distribution of equity* (Leaves 3, 5, 7). Leaf 9 highlights the liquidity risk specific to firms.
  *   **The Trust (Great-Grandchild):** This is the primary discriminator for Leaf 5 (Rignano) and Leaf 8 (Dynastic Cap). Laissez-Faire (Leaf 1) allows it; Abolition (Leaf 3) bans it; Rignano (Leaf 5) taxes it prohibitively.

  **Missing Space:**
  *   There is no leaf for a **Consumption Tax** alternative (taxing money only when spent by the heir). This falls out of the tree because the nodes focus on *transfer* and *holding*, not *realization*. This is a known gap in the logical space mapped here.
  *   There is no leaf for **State Trusteeship** (wealth passes to a public trust that pays dividends to the heir). This would fit under Node 3 (Individual Transaction) but requires a branch for "Who manages the asset?" which the current tree omits to preserve brevity.
