answer: |-
  # Decision Tree: Personal Survival in Technological Replacement

  ## Tree Structure & Nodes
  *Each node is phrased as a concrete case-question answerable by intuition or theory without reference to philosophical labels.*

  **Node 1 (Gradual Replacement):**  
  "If your biological neurons are replaced one-by-one with functionally identical synthetic units over ten years, is the resulting person *you*?"
  *   **No** → Go to **Leaf A**
  *   **Yes** → Go to **Node 2**

  **Node 2 (Destructive Upload):**  
  "If your brain is scanned (destroying it) to create a perfect synthetic duplicate elsewhere, does *you* survive in the duplicate?"
  *   **No** → Go to **Leaf B**
  *   **Yes** → Go to **Node 3**

  **Node 3 (Non-Destructive Branching):**  
  "If the scanning is non-destructive (original remains), do *both* the original and the duplicate count as surviving *you*?"
  *   **Yes** → Go to **Leaf C**
  *   **No** → Go to **Node 4**  
      *(Note: A 'No' here implies identity is unique; the duplicate is either a copy or 'you' only if the original is gone.)*

  **Node 4 (Interrupted Upload):**  
  "If the uploaded pattern is paused for 100 years and then resumed on new hardware, is the resumed person *you*?"
  *   **Yes** → Go to **Leaf D**
  *   **No** → Go to **Leaf E**

  ---

  ## Leaves: Positions & Commitments

  ### Leaf A (Node 1: No)
  *   **Standard Name:** **Biological Naturalism** (or Embodied-Enactivist View)
  *   **Core Position:** Identity is tied to the specific living organism; substrate independence is false.
  *   **Most Awkward Commitment:** **Biological Chauvinism.** Must deny that a being with your exact memories, personality, and behavior is *you* simply because it is made of silicon rather than carbon, implying biology has a magical status beyond function.

  ### Leaf B (Node 1: Yes → Node 2: No)
  *   **Standard Name:** **Spatiotemporal-Continuity Theory** (or Animalism)
  *   **Core Position:** Survival requires an unbroken physical path; functional copying without continuous matter transport fails.
  *   **Most Awkward Commitment:** **The Teletransporter Intuition.** Must assert that you die in a destructive scanner even if an exact psychological duplicate wakes up elsewhere, privileging the specific atoms over the person's mental life.

  ### Leaf C (Node 1: Yes → Node 2: Yes → Node 3: Yes)
  *   **Standard Name:** **Psychological Continuity Theory (Branching-Tolerant)**
  *   **Core Position:** Survival is grounded in psychological connectedness; fission yields two survivors, challenging strict identity.
  *   **Most Awkward Commitment:** **Transitivity Failure.** Must accept that "you" can become two distinct people who may later diverge and hate each other, meaning identity is not a one-to-one relation (violating the logic of "is").

  ### Leaf D (Node 1: Yes → Node 2: Yes → Node 3: No → Node 4: Yes)
  *   **Standard Name:** **Psychological Continuity Theory (Non-Branching)**
  *   **Core Position:** Survival requires psychological continuity *and* uniqueness; destructive upload works, but branching creates only copies.
  *   **Most Awkward Commitment:** **The Exclusion Problem.** Must explain why the duplicate is *you* when the original is destroyed, but merely a *copy* when the original survives, despite the duplicate's internal experience being identical in both cases.

  ### Leaf E (Node 1: Yes → Node 2: Yes → Node 3: No → Node 4: No)
  *   **Standard Name:** **Deflationary Pragmatism** (or Reductionist View)
  *   **Core Position:** "Survival" is not a deep metaphysical fact but a matter of degree/practical concern; long gaps break the practical relation.
  *   **Most Awkward Commitment:** **Metaphysical Nihilism.** Must admit there is no objective fact of the matter about whether you live or die in edge cases, reducing life-and-death stakes to conventions of description.

  ---

  ## Analysis of Logical Space

  ### Indistinguishable Leaves
  **None, conditionally.**  
  The tree successfully separates all five views *provided* the **Deflationary Pragmatist (Leaf E)** interprets the 100-year pause as breaking the "practical relation" (answering **No** at Node 4), while the **Non-Branching Functionalist (Leaf D)** interprets pattern recovery as sufficient for survival (answering **Yes** at Node 4).  
  *Warning:* If the Deflationist answers **Yes** at Node 4 (arguing the pause is pragmatically irrelevant), they collapse into Leaf D. The tree forces a binary choice on a view that often rejects binary facts, creating a risk of structural indistinguishability.

  ### Diagnosis of Empty Combinations
  There are 16 possible answer paths (2⁴). The following combinations are empty, diagnosed by logical coherence or theoretical attractiveness:

  1.  **Node 1: No → Node 2: Yes (and any subsequent answers)**  
      *   **Diagnosis:** **Incoherent.** If gradual replacement of parts (which preserves continuity) fails to preserve identity, a destructive scan (which breaks continuity) cannot possibly succeed. This violates the "Continuity Heuristic" (if the harder case fails, the easier case must fail).
  2.  **Node 1: Yes → Node 2: No → Node 3: Yes**  
      *   **Diagnosis:** **Unattractive/Inconsistent.** If a destructive copy is *not* you (Node 2: No), it is inconsistent to claim a non-destructive copy *is* you alongside the original (Node 3: Yes). Usually, if the copy isn't you when you die, it isn't you when you live.
  3.  **Node 1: Yes → Node 2: No → Node 3: No → Node 4: Yes**  
      *   **Diagnosis:** **Unexplored/Unstable.** This view accepts gradual change and paused resumption but rejects destructive scanning. It relies on a fragile distinction between "copying via destruction" and "copying via pausing," which most theories treat as equivalent breaks in causal continuity.
  4.  **Node 1: No → Node 2: No → Node 3: Yes**  
      *   **Diagnosis:** **Incoherent.** Denies substrate independence entirely (Node 1 & 2) but accepts that a synthetic duplicate counts as *you* in branching cases. If the substrate matters, the duplicate never counts as you.

  ### Summary of Populated Paths
  *   **Path A (No, -, -, -):** Embodied-Enactivist.
  *   **Path B (Yes, No, -, -):** Spatiotemporal-Continuity.
  *   **Path C (Yes, Yes, Yes, -):** Branching-Tolerant Functionalist.
  *   **Path D (Yes, Yes, No, Yes):** Non-Branching Functionalist.
  *   **Path E (Yes, Yes, No, No):** Deflationary Pragmatist.

  All other combinations are theoretically vacant.
