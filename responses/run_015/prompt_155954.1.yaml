answer: |-
  You have identified a real and distinct mechanism, and your intuition that the standard "you can't import trust" rebuttal conflates two different dynamics is correct.

  The concept you are looking for is most sharply defined in political science and institutional economics as **Institutional Feedback** (specifically *positive feedback loops regarding social capital*) or **Endogenous Trust Formation**.

  The specific scholar who has made this argument most rigorously is **Bo Rothstein**. He argues against the "culture first" hypothesis (that you need trust before you get good institutions) and proposes the "institution first" hypothesis (that impartial, universal institutions *generate* the trust required to sustain them).

  Here is the breakdown of whether this is a distinct thing, what the mechanism is, and how to apply it to your test cases.

  ### 1. Is it distinct, or just a time axis?

  It is **distinct**, not merely a delay. The difference is causal direction, not speed.

  *   **Type A (Trust-Consuming):** Trust is an **exogenous input**. The policy is a machine that requires fuel (trust) to run. If you put it in a place without fuel, it stalls. The mechanism is linear: *Trust $\rightarrow$ Policy Success*.
  *   **Type B (Trust-Making):** Trust is an **endogenous output**. The policy is an engine that generates its own fuel. It may require a spark (minimal baseline cooperation) to start, but once running, the operation of the policy increases the fuel supply. The mechanism is circular: *Policy $\rightarrow$ Increased Trust $\rightarrow$ Policy Stability*.

  If it were just a time axis, you would expect a Type B policy to fail in the short term and succeed in the long term *in the same environment*. But that's not what you're describing. You are describing a policy that changes the **equilibrium state** of the society.

  In systems theory terms:
  *   **Type A** operates within a single equilibrium. It assumes the "trust level" variable is fixed.
  *   **Type B** is a mechanism for **equilibrium selection**. It moves the society from a "low-trust equilibrium" (where defection is rational) to a "high-trust equilibrium" (where cooperation is rational).

  So, the distinction is real. One treats trust as a *resource to be spent*; the other treats trust as a *muscle to be exercised*.

  ### 2. The Vocabulary and The Edges

  The sharpest label for Type B is **Constitutive Policy**.
  A constitutive policy doesn't just distribute goods; it constitutes a relationship between the citizen and the state, and between citizens themselves.

  **The Edge Cases (Where the concept breaks):**
  To know where the edge of this concept lies, you need to identify when a policy stops being "trust-making."
  *   **The Threshold Problem:** A trust-making policy still requires a *minimum viable level* of initial trust (the "spark"). If the initial trust is below a certain threshold (e.g., active civil war, total state collapse), the feedback loop cannot start. The policy will be captured or looted before it can generate norms.
  *   **The Leakage Problem:** If the policy has "leaks" (loopholes, corruption, visible unfairness) during the build-up phase, the feedback loop reverses. Instead of *Compliance $\rightarrow$ Trust*, you get *Observed Cheating $\rightarrow$ Cynicism*.

  Therefore, the concept is distinct, but it is **fragile**. It only counts as "trust-making" if the policy design is robust enough to survive the low-trust initiation phase.

  ### 3. Analyzing Your Test Cases

  Here is how this framework handles the two cases you couldn't sort out.

  **Case 1: Builds trust for receivers, destroys it for payers.**
  *   **Verdict:** This is **not** a Type B (Trust-Making) policy. This is a **Zero-Sum Redistribution** masquerading as universalism.
  *   **Why:** Generalized social trust (the kind needed for Nordic-style stability) relies on the belief that *everyone* is in the same boat. If a policy creates a distinct "payer" class that feels exploited, it creates *particularized trust* (within the receiver group) but erodes *generalized trust* (across society).
  *   **The Distinction:** A true Type B policy (like a universal basic pension) aligns the interests of payers and receivers because the payers know they will eventually be receivers. If the groups are permanent and distinct, the feedback loop is broken. The "trust" being built is actually just **coalitional solidarity**, which is different from social trust. Coalition solidarity often *lowers* overall social trust because it defines an out-group.

  **Case 2: Generates trust, but slower than democratic time horizons.**
  *   **Verdict:** This **is** a Type B policy, but it faces a **Political Feasibility Constraint**, not a conceptual failure.
  *   **Why:** The mechanism (Policy $\rightarrow$ Trust) is still valid. The fact that the voters won't be around to see the payoff is a problem of *intertemporal collective action*, not a problem with the trust mechanism itself.
  *   **The Distinction:** This highlights the difference between **Functional Viability** (will it work if implemented?) and **Political Viability** (can we get it implemented?). A Type B policy can be functionally viable but politically impossible. This is distinct from Type A policies, which are often politically popular (because they promise something for nothing) but functionally non-viable in low-trust settings.

  ### 4. Is it one mechanism with different parameters?

  You asked for an honest answer if the distinction isn't real. Here is the nuanced truth:

  In a mathematical model of social dynamics, it **is** one mechanism with a different **feedback coefficient**.

  Imagine an equation where Trust ($T$) in the next period depends on Trust now ($T_0$) plus the Policy Effect ($P$).
  $$T_{next} = T_{current} + (k \times P)$$

  *   In **Type A (Trust-Consuming)**, $k$ is negative or zero. The policy drains the existing $T_{current}$. If $T_{current}$ is low, the system crashes.
  *   In **Type B (Trust-Making)**, $k$ is positive. The policy adds to $T_{current}$.

  However, treating them as distinct concepts is **analytically necessary** for policy design. Why? Because you cannot simply "tune the parameter" $k$ without changing the fundamental nature of the policy.
  *   To make $k$ positive, you usually have to switch from *means-tested* to *universal*.
  *   You have to switch from *discretionary enforcement* to *rule-of-law enforcement*.

  These are structural changes, not dial adjustments. So, while a systems theorist might say "it's the same feedback loop with different gain," a policy analyst must say "these are different species of policy."

  ### Summary for your mental model

  1.  **The Concept:** **Endogenous Trust Formation** via **Institutional Feedback**.
  2.  **The Distinction:** It is not a time delay. It is a difference between **parasitic** policies (consume existing social capital) and **investive** policies (build new social capital).
  3.  **The Requirement:** Investive policies require **Universalism**. If the policy distinguishes between "us" (payers) and "them" (receivers), it cannot generate generalized trust, only coalition loyalty.
  4.  **The Failure Mode:** If the "build-up" phase takes longer than the political cycle, the policy is functionally sound but politically dead. This is a separate problem from the trust mechanism itself.

  The "you can't import trust" argument is half-right. You can't import the *stock* of trust (Type A requirement). But you can import the *machinery* that manufactures trust (Type B mechanism), provided you can survive the startup costs.
