prompt: |-
  Something I keep running into when people argue about copying policies from one country to another, and I want to know whether there's a word for the thing I'm noticing.

  The argument always runs the same way. Someone says: look at the Nordics, they have high taxes, big universal programs, light-touch enforcement, and it works, let's do that here. And the reply is: it works there because people there trust each other and trust the state, and you can't import that, trust is something that takes generations. I get the point. But I've started to think that reply is doing two really different jobs and getting away with it by sounding like one objection.

  Some policies look like they *use up* trust. If I already expect that most other people are paying what they owe, not claiming things they aren't entitled to, not faking the paperwork, then a generous low-surveillance system works great for me. If I don't have that expectation, the identical system looks like an invitation to be the sucker, so I take what I can, other people watch me do it, the expectation drops further, and you've burned whatever stock there was. Import that kind of policy into a low-trust place and it doesn't merely fail, it leaves you worse off than before you tried.

  But other policies look like they *make* the trust they need. The clearest case I can think of is the same pot of money given to everyone regardless of income versus targeted at people below a line. The targeted version needs a lot of checking, it draws a bright line between the people who get it and the people who pay for it, everyone resents it, and it seems to erode the very goodwill you'd need in order to run it decently. The universal version needs almost no checking, everybody is in it, and — this is the part I have no vocabulary for — after a while people actually do seem to start expecting that the others are in it too. The attitude the policy needed at the start is the attitude the policy produces once it exists. It bootstraps, at the cost of taking a long time to do it.

  So what I'm after isn't really a label. I want to know whether that second pattern is a genuine distinct thing or just the first pattern with a time axis stuck on, and if it is distinct, whether there's an established concept for it and how it differs from the nearest ones. The things I've bumped into that feel adjacent: people talk about social capital, about path dependence, about situations where everyone would cooperate if only everyone expected everyone else to cooperate, and I've also seen an argument that means-tested programs are self-undermining because they break up the coalition that would defend them. Those each grab a piece — the social capital stuff is about a stock of trust, the everyone-waits-for-everyone stuff is about expectations being self-reinforcing, the coalition stuff is about the politics — but none of them seems to be about the timing structure, where a policy needs X at the beginning and manufactures X over a couple of decades.

  Two cases I can't sort out, if you want something to test a definition against. First: a policy that builds trust among the people receiving it while destroying it among the people paying for it — same phenomenon, or the opposite one wearing the same clothes? Second: a policy that does generate the trust but only slowly enough that the generation which has to vote for it never sees the payoff — does that still count, or is that better described as a different problem entirely, about democratic time horizons rather than about trust?

  Please don't just reassure me that this is a familiar thing in the literature, i dont have library access and I'm not writing anything, I just want the concept to be sharp: what exactly it is, what it isn't, where its edges are. And if the honest answer is that the trust-eating versus trust-making distinction isn't real and it's all one mechanism with different parameters, say so and tell me what the parameters are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Observation:** The user notices a pattern in policy debates (specifically regarding Nordic-style welfare states).
      *   **The Pattern:**
          *   Type A: Policies that *consume* trust (require high trust to function, fail/erode trust if implemented in low-trust environments).
          *   Type B: Policies that *generate* trust (require some initial trust but build more over time, creating a positive feedback loop).
      *   **The Question:** Is Type B a distinct phenomenon from Type A (just with a time axis), or is it the same mechanism with different parameters? Is there an established concept for this?
      *   **Constraints:** No library access needed, no academic writing, wants conceptual sharpness (edges, distinctions), honest answer if the distinction isn't real.
      *   **Test Cases:**
          1.  Policy builds trust for receivers but destroys it for payers.
          2.  Policy generates trust but slower than democratic time horizons.

  2.  **Deconstruct the Concepts:**
      *   **Type A (Trust-Consuming):** This sounds like *moral hazard* or *free-rider problems* in a low-trust equilibrium. It relies on *exogenous* trust (trust that exists prior to the policy). If the policy assumes compliance without enforcement, and compliance isn't there, the system collapses.
      *   **Type B (Trust-Generating):** This sounds like *endogenous* trust formation. The policy itself changes the incentives and expectations such that trust becomes the rational strategy over time. This is closely related to *institutional feedback loops* or *self-reinforcing equilibria*.
      *   **The "Time Axis" Question:** The user asks if Type B is just Type A with a delay.
          *   *Hypothesis 1:* It's the same mechanism. All policies require some baseline trust. Some just have a higher "return on trust" that accumulates.
          *   *Hypothesis 2:* They are distinct. One is *parasitic* on existing social capital; the other is *investive* in social capital.

  3.  **Search for Existing Concepts (Mental Knowledge Retrieval):**
      *   *Social Capital:* Putnam, Coleman. Usually treated as a stock (Type A focus).
      *   *Path Dependence:* Once on a track, hard to leave. Fits the "generations" part.
      *   *Multiple Equilibria:* High-trust vs. Low-trust societies. Moving between them is the hard part.
      *   *Institutional Feedback Theory:* (Paul Pierson, Suzanne Mettler). Policies create constituencies and shape civic engagement. This is very close to Type B.
      *   *Constitutive Effects:* Laws don't just regulate; they constitute social reality.
      *   *Virtuous/Vicious Cycles:* General systems theory.
      *   *The "Rothstein" Argument:* Bo Rothstein specifically argues that *universal* institutions create trust, while *means-tested* ones erode it. This is exactly the user's example.
      *   *Endogenous vs. Exogenous Variables:* In economics, is trust an input or an output? The user is asking about policies where trust is an output (Type B) vs. policies where trust is purely an input (Type A).

  4.  **Synthesize the Distinction:**
      *   The distinction *is* real, but it's not usually framed as "Trust-Eating vs. Trust-Making." It's framed as **Exogenous vs. Endogenous Trust** or **Static vs. Dynamic Institutional Effects**.
      *   However, the most precise concept is **Institutional Feedback** (specifically *positive feedback loops* regarding social capital).
      *   Another strong candidate is **Equilibrium Selection**. Type A policies work in the "Good Equilibrium" but crash in the "Bad Equilibrium." Type B policies are mechanisms to *shift* from the Bad to the Good Equilibrium.
      *   The "Time Axis" isn't just a delay; it's a *structural transformation*. Type A assumes the structure is fixed. Type B assumes the structure is malleable.

  5.  **Address the Test Cases:**
      *   *Case 1 (Receivers vs. Payers):* This is a *distributional conflict* masquerading as a trust issue. If one group trusts more and the other less, net social trust might stay flat. This suggests the "Trust-Making" label is too simple; it's really "Coalition-Building."
      *   *Case 2 (Time Horizons):* This is the *Political Business Cycle* or *Discount Rate* problem. It doesn't negate the trust-making mechanism, but it highlights the *political feasibility* constraint. It's a distinct problem (collective action over time) layered on top of the trust mechanism.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the insight:* The user has spotted something real and significant.
      *   *Name the concept:* The closest established term is **Institutional Feedback** (Mettler/Pierson) or **Endogenous Trust Formation** (Rothstein/Uslaner). Bo Rothstein is the key name here. He argues universalism *creates* the trust required to sustain it.
      *   *Answer the "Distinct or Same?" question:* It is distinct. It's not just a time axis. It's about *causal direction*.
          *   Type A: Trust $\rightarrow$ Policy Success.
          *   Type B: Policy $\rightarrow$ Trust $\rightarrow$ Policy Success.
      *   *Refine the distinction:* Use the term **Constitutive Institutions**. Some institutions regulate behavior (Type A); others constitute the social fabric (Type B).
      *   *Address the Parameters:* If I were to argue it *is* the same mechanism, the parameter would be the "Feedback Coefficient." If >1, it grows trust. If <1, it depletes it. But conceptually, treating them as distinct is more useful for policy design.
      *   *Address Test Cases:*
          *   Case 1: This reveals that "Trust" isn't monolithic. It's *Particularized Trust* (in group) vs. *Generalized Trust* (in society). A policy can increase the former while decreasing the latter.
          *   Case 2: This is the **Intergenerational Collective Action Problem**. It confirms the mechanism exists but highlights the political barrier.

  7.  **Final Polish:**
      *   Ensure the tone is analytical, not academic.
      *   Focus on "sharp edges" as requested.
      *   Make sure Bo Rothstein gets a mention because his work on "Quality of Government" and universalism is exactly this argument.
      *   Use the term **Self-Reinforcing Equilibrium** vs. **Equilibrium Shift**.

      *(Self-Correction during drafting)*: I need to be careful not to just say "It's Path Dependence." Path dependence explains why it's hard to *change*, not necessarily how the trust is *built*. The user wants the mechanism of *building*. "Institutional Feedback" is better. Also, the distinction between *Generalized Trust* and *Particularized Trust* is crucial for Test Case 1.

      *(Refining the "Same Mechanism" question)*: Is it the same mechanism? In systems theory, yes (feedback loops). In policy design, no (one is a prerequisite, one is an outcome). I should validate the user's intuition that they feel different because they function differently in a policy proposal context.

      *(Final Plan)*:
      1. Validate the observation (it's real).
      2. Provide the vocabulary (Institutional Feedback, Endogenous Trust, Rothstein).
      3. Answer the "Distinct vs. Time Axis" question (It's about causal direction/feedback loops, not just speed).
      4. Analyze the Test Cases using this framework.
      5. Define the edges (when does it stop being trust-making?).

  8.  **Final Review against constraints:** No library jargon without explanation. Keep it sharp. Don't reassure, analyze.

      *Key Concept to introduce:* **The Rothstein Paradox** (or similar). Actually, Rothstein calls it the "Institutional Theory of Social Trust."
      *Key Distinction:* **Exogenous vs. Endogenous.**
      *Key Mechanism:* **Feedback Loops.**

      Let's structure the answer around:
      1. The Name (Institutional Feedback / Endogenous Trust).
      2. The Mechanism (Feedback Loops vs. Linear Inputs).
      3. The Test Cases.
      4. The Edges (When does it fail?).

      *Wait, one more thought:* The user asks if it's "one mechanism with different parameters." I should address this directly. In dynamical systems, it *is* one mechanism (feedback) with a parameter (gain). If gain is negative, trust decays. If positive, it grows. But for policy analysis, treating them as distinct categories is more practical because you can't easily tune the parameter without changing the policy type (e.g., universal vs means-tested). I will present this nuance.

      *Test Case 1:* This is about *zero-sum* vs *positive-sum* trust.
      *Test Case 2:* This is about *discount rates*.

