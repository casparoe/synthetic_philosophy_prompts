prompt: |-
  Hey — I price weird one-off risks at a small specialty insurer: satellite launches, film shoots, music festivals, one custom turbine going overland through three countries. I write maybe 5–8 quotes a week and every single one needs a rate for something that has never happened in exactly this form before. My boss wants a written procedure, and I've been told to ground it in whatever philosophy actually knows about the reference class problem. But it has to be runnable by a junior analyst with a stats minor and no philosophy, in about half an hour, and it has to survive an audit where the regulator points at a file and says "why this class and not that one?"

  Here's the mess I actually live in. The same event slots into a pile of different classes — small-launch-vehicle flights, flights using this engine family, flights using this engine with the revised turbopump, flights with a second stage assembled in the last eighteen months, flights where the payload customer is a first-timer — and those classes give rates that differ by an order of magnitude. Right now people either grab whichever class produces the number they were hoping for, or they average two of them, which I'm fairly sure is just incoherent. We've also had at least one case where someone built the class *after* seeing a couple of losses (three claims all involved the same rigging subcontractor, so new jobs got priced as "jobs involving that subcontractor"), and I genuinely can't tell whether that's cheating or whether it's the correct move.

  Stuff the procedure has to handle, none of which I know how to do:

  - How do you even generate the candidate classes, and which features are allowed into the description? Machine age, operator hours, weather window, supplier, whether the client has done this before. Some of those are doing causal work and some are just correlated with the thing, and half the time we can't tell which.
  - How narrow do you go? The narrow class always feels more honest until you realize it has four exposures, or zero events, or one event out of one and a 100% loss rate that we obviously cannot charge.
  - What happens when the broad class and the narrow class disagree by like 10x? Do we escalate, and who signs — me, the senior underwriter, or the chief actuary? Right now: nobody knows, it just depends who's in the office.
  - Classes defined partly by the outcome, or by facts we only learn later. My rule of thumb is that you can only use what was on your desk at quote time, but I can't say why, and I suspect it's not quite that clean.
  - Cases where there is no rate: nobody has ever done this, or the world moved (new engine revision, new regulation, new supplier) so the old frequency means nothing. I would much rather the procedure say "no defensible number, decline to quote" than that it manufacture one and we find out later.
  - Output format. Every file needs a "class string" — a one-line description of the class and where the rate came from — because renewals come back a year later and a different analyst has to re-derive it, and we've already been burned by someone writing "similar jobs" in the box.
  - Our home-brewed rule of thumb, which nobody can defend: go to the narrowest class that has at least ten exposures and whose rate is within 10x of its parent class. Is that doing real work or is it a superstition? Should I throw it out? Same question for our other internal rule: never quote more than 50% below the broadest defensible class rate.

  What I want from you: the questions, in order; what counts as an adequate answer to each one; where the procedure stops with a no; and where it hands the question to a human because it's a question about appetite, fairness, or values rather than a fact about the risk. Be honest about which steps are judgment calls with a number stapled to them, and be honest about what the procedure fundamentally cannot deliver — my worry is that there is no uniquely correct class and the whole thing is just damage control with better paperwork. If that's true, say so and tell me what a well-run damage-control procedure looks like.

  Then run the thing on three live-ish cases:

  1. A first-ever music festival on a river floodplain. Twenty years of flood records for the region, four years for that particular stretch of river, no track record for the promoter, and a fixed date we can't move.
  2. A satellite launch on a new small vehicle: two flights, one failure. The engine family has sixty flights with three failures. There's also a narrower subset — this engine with the revised turbopump — with nine flights and no failures. Three different analysts here picked three different classes and I can't tell which of them is wrong.
  3. A fleet policy for a delivery company. The sharpest class we can actually defend statistically is built partly out of driver age bracket. Compliance is going to lose their minds. I want to know whether your procedure tells me to use that class anyway, or whether it says "this stopped being a reference class question and became a fairness question" — and if it says that, I want to hear it even though it's not what I want, because I was kind of hoping the machinery would get me off the hook here.

  Oh, and one more: the client in case 3 has offered to let us use a telematics score instead, which predicts about as well but is way harder to explain to a regulator. If the procedure has anything to say about picking between two classes that perform the same, I'd like to hear it, because I suspect it doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** Small specialty insurer pricing unique, one-off risks (satellite launches, film shoots, festivals, custom transport).
      *   **Volume:** Low (5-8 quotes/week).
      *   **Core Issue:** The Reference Class Problem (RCP). Every risk fits multiple classes with wildly different rates.
      *   **Current State:** Ad-hoc, prone to confirmation bias ("grab whichever class produces the number they were hoping for"), potential hindsight bias (building classes after losses), inconsistent escalation.
      *   **Requirements:**
          *   Written procedure grounded in RCP philosophy but runnable by a junior analyst (stats minor, no philosophy).
          *   Time limit: ~30 minutes per quote.
          *   Audit-proof: Must justify *why* this class and not that one.
          *   Handle specific edge cases: Zero data, outcome-defined classes, conflicting rates (10x difference), fairness/regulatory constraints.
          *   Output: A specific "class string" for the file.
          *   Honesty: Acknowledge where judgment calls exist and where the procedure *cannot* give a unique correct answer (damage control vs. truth).
      *   **Deliverables:**
          1.  The Procedure (Questions, Adequate Answers, Stop Conditions, Escalation Points).
          2.  Application to 3 Live Cases (Festival, Satellite, Fleet/Telematics).
          3.  Addressing the "Telematics vs. Driver Age" fairness/complexity trade-off.

  2.  **Philosophical Grounding (The "Why"):**
      *   *Reference Class Problem (Reichenbach/Salmon):* There is no single "true" class. The goal isn't truth; it's *defensibility* and *predictive stability*.
      *   *Goodman's "Grue":* Avoid classes defined by arbitrary or post-hoc predicates.
      *   *Causal vs. Statistical:* Prefer causal features (mechanism of failure) over purely correlational ones, but acknowledge data limitations.
      *   *Credibility Theory (Actuarial):* Balancing specific data (high variance) vs. general data (high bias).
      *   *Key Insight for the User:* You are right. There is no uniquely correct class. The procedure is "damage control with better paperwork." It standardizes the *process of choosing*, not the *choice itself*.

  3.  **Drafting the Procedure (The "How"):**
      *   *Constraint:* 30 mins, Junior Analyst. Needs to be a checklist/flowchart, not an essay.
      *   *Step 1: Feature Locking.* What data is allowed? (Pre-quote info only).
      *   *Step 2: Class Generation.* How to build the candidate list? (Broad -> Narrow).
      *   *Step 3: Validity Checks.* (Sample size, Hindsight bias).
      *   *Step 4: Selection Logic.* (The "10 exposures / 10x rule" evaluation).
      *   *Step 5: Escalation.* (When to stop and call a human).
      *   *Step 6: Documentation.* (The "Class String").

      *Refining the "10 exposures / 10x rule":* The user asked if this is superstition. It's actually a rough proxy for *Credibility Theory*. 10 exposures is low, but for specialty lines, it's often all we have. The 10x rule prevents overfitting to noise. I should validate it but tighten the logic.
      *Refining "Outcome Defined Classes":* Strict prohibition. Only pre-event information.
      *Refining "Fairness":* This is a hard stop. If a class is statistically valid but legally/ethically prohibited (e.g., protected characteristics), the procedure must flag it for compliance, not pricing.

  4.  **Addressing the Specific Questions:**
      *   *Generate candidate classes:* Start broad (industry standard), narrow by causal factors (engine type, terrain), stop before sample size < N.
      *   *How narrow:* The "Credibility Cutoff."
      *   *10x Disagreement:* Escalation trigger.
      *   *Outcome defined:* Forbidden (Hindsight bias).
      *   *No Rate:* "Decline" option must be explicit.
      *   *Output:* Standardized string format.
      *   *Internal Rules:* Validate the "10 exposures" rule as a credibility threshold, not truth. Validate the "50% below broad" rule as a solvency guardrail.

  5.  **Running the Cases:**

      *   *Case 1 (Festival):*
          *   Broad: Outdoor Events.
          *   Narrow: River Floodplain + First-time Promoter.
          *   Data: 20yr regional flood vs 4yr specific.
          *   Conflict: Hydrology data vs. Promoter inexperience.
          *   Resolution: Use hydrology for frequency, load for promoter risk (causal).
          *   Class String needs to reflect both.

      *   *Case 2 (Satellite):*
          *   Broad: All Launches (too broad).
          *   Mid: Engine Family (60 flights, 3 fails).
          *   Narrow: Revised Turbopump (9 flights, 0 fails).
          *   Conflict: 9 flights is statistically insignificant (0/9 != 0% risk).
          *   Resolution: Bayesian shrinkage. Use Engine Family rate, discount slightly for revision *if* engineering certifies improvement, but don't trust 0/9.
          *   Audit defense: 9 flights is noise. 60 is signal.

      *   *Case 3 (Fleet/Telematics):*
          *   Issue: Driver Age (Protected Class?) vs. Telematics (Black Box).
          *   Fairness: Age might be prohibited (depending on jurisdiction, usually auto insurance has restrictions).
          *   Explainability: Regulator prefers Explainable (Age) over Black Box (Telematics), *unless* Age is discriminatory.
          *   Procedure Verdict: This is a Compliance/Appetite call, not Pricing. The procedure must flag this for Legal/Compliance, not let the analyst decide.
          *   Telematics vs. Age: If performance is equal, choose the one with higher *stability* and *explainability*. Telematics changes behavior; Age doesn't. But Telematics is harder to audit.

  6.  **Review and Refine:**
      *   *Tone:* Professional, direct, slightly cynical but constructive. Acknowledge the "mess."
      *   *Philosophy:* Explicitly mention Reichenbach/Salmon but keep it practical.
      *   *Audit Proofing:* Emphasize the "Class String."
      *   *Honesty:* Admit that the procedure manages *uncertainty*, it doesn't eliminate it.

  7.  **Final Polish:** Check against all constraints (30 mins, junior analyst, audit survival). Ensure the "Stop" conditions are clear. Make sure the distinction between *Fact* (data) and *Value* (appetite/fairness) is sharp.

  *(Self-Correction during drafting)*: I initially thought about suggesting Bayesian methods. *Correction:* No, junior analyst, 30 mins. Keep it to lookup tables and credibility weights, not MCMC chains. The "10 exposures" rule is a heuristic for credibility; I should frame it as such.
  *(Self-Correction on Case 3)*: I need to be careful about "Driver Age." In many jurisdictions, using age for commercial fleet pricing is allowed, but for personal auto it's restricted. The prompt implies Compliance will "lose their minds," suggesting a fairness/ESG concern or specific local regulation. I must treat this as a "Value/Appetite" stop, not a math problem.

  8.  **Structure of Response:**
      *   **Preface:** Validate the user's intuition (Yes, it's damage control).
      *   **The Procedure:** Step-by-step checklist.
      *   **The Philosophy (Brief):** Why this works (Credibility + Causality).
      *   **Case Studies:** Applying the procedure.
      *   **The Telematics Question:** Explainability vs. Accuracy.
      *   **Closing:** What this buys you (Audit defense, not Truth).

  9.  (Final check of the prompt requirements):
      *   Questions in order? Yes.
      *   Adequate answer definition? Yes.
      *   Where it stops? Yes.
      *   Human handoff? Yes.
      *   Honesty about uniqueness? Yes.
      *   3 Cases run? Yes.
      *   Telematics addressed? Yes.

  Let's write it.cw
answer: |-
  You are correct: there is no uniquely correct reference class. Reichenbach (who coined the problem) and Salmon (who tried to solve it) both concluded that in single-case prediction, "truth" is inaccessible. You are not discovering the rate; you are constructing a defensible narrative that approximates risk without bankrupting you or lying to the regulator.

  Your intuition about "damage control with better paperwork" is philosophically sound. The goal of this procedure is not **Accuracy** (which is impossible); it is **Consistency**, **Defensibility**, and **Solvency**.

  Here is the procedure, grounded in Actuarial Credibility Theory and Causal Inference, stripped of the philosophy jargon so a junior analyst can run it in 30 minutes.

  ---

  # PROCEDURE: REFERENCE CLASS SELECTION & RATE DERIVATION (RCS-01)

  **Objective:** Select a single pricing class for a unique risk that survives regulatory audit and internal solvency review.
  **Time Limit:** 30 Minutes.
  **Operator:** Junior Analyst.
  **Stop Condition:** If any step results in "NO," proceed to **Escalation Protocol**.

  ### STEP 1: FEATURE LOCKING (5 Minutes)
  **Question:** What facts about the risk were known *before* the quote request was received?
  **Adequate Answer:** A list of variables documented in the submission email/brief (e.g., "Engine Model X," "Floodplain Zone B," "Driver Age 25").
  **Forbidden:** Any variable defined by an outcome (e.g., "Subcontractor who had the accident last week") or data received after the quote timestamp.
  **Action:** List candidate features. If a feature is only known *after* a loss occurs, **DELETE IT**.
  *Philosophy Note:* This prevents hindsight bias (the "rigging subcontractor" problem). You cannot price based on a class that only exists because the loss happened.

  ### STEP 2: CLASS GENERATION (10 Minutes)
  **Question:** What are the three candidate classes, ordered from Broad to Narrow?
  **Adequate Answer:**
  1.  **Broad Class:** Industry standard (e.g., "All Satellite Launches").
  2.  **Intermediate Class:** Causal mechanism (e.g., "Engine Family Y").
  3.  **Narrow Class:** Specific configuration (e.g., "Engine Y + Revised Turbopump").
  **Constraint:** You must identify at least two classes. If only one exists, proceed to Step 5 (No Rate).
  **Action:** For each class, retrieve: $N$ (Exposures), $L$ (Losses), $Rate$ (Loss Cost).

  ### STEP 3: CREDIBILITY CHECK (5 Minutes)
  **Question:** Does the Narrow Class have sufficient data to stand alone?
  **Adequate Answer:**
  *   **Exposure Threshold:** $N \ge 10$ (Your current rule is acceptable for specialty lines).
  *   **Loss Threshold:** $L \ge 1$ (You cannot price on zero losses unless you apply a "pseudo-count" approved by the Chief Actuary).
  *   **Stability Rule:** Is the Narrow Rate within 10x of the Broad Rate?
  **Action:**
  *   If Narrow fails $N$ or $L$: **Discard Narrow.** Use Intermediate.
  *   If Narrow fails Stability (10x rule): **Discard Narrow.** The variance is too high; it is likely noise.
  *   If Narrow passes all: **Tentatively Select Narrow.**

  ### STEP 4: CAUSALITY CHECK (5 Minutes)
  **Question:** Is the feature defining the Narrow Class *causally* linked to the loss, or just correlated?
  **Adequate Answer:** "Yes, there is an engineering/physical reason this feature changes risk" (e.g., Turbopump revision affects pressure).
  **Forbidden:** "It correlates in the data" without a mechanism.
  **Action:** If the feature is purely correlational (e.g., "Launches on Tuesdays"), **Revert to Intermediate Class**.
  *Philosophy Note:* This addresses Goodman's "Grue." Avoid classes that are accidental generalizations.

  ### STEP 5: THE "NO RATE" STOP (2 Minutes)
  **Question:** Does the selected class have a rate of $0$ or $N < 5$?
  **Adequate Answer:** "Yes, we have data" OR "No, we are flying blind."
  **Action:** If "No": **STOP.** Do not manufacture a number. Flag for **Decline to Quote** or **Chief Actuary Discretionary Pricing**.
  *Why:* It is better to lose a premium than to underprice a black swan.

  ### STEP 6: FAIRNESS & COMPLIANCE FLAG (3 Minutes)
  **Question:** Does the selected class use protected characteristics (Age, Gender, Location, etc.) that violate current compliance guidelines?
  **Adequate Answer:** "Compliance has pre-approved this variable" OR "This variable is prohibited."
  **Action:** If prohibited: **STOP.** Hand off to Compliance. Do not attempt to substitute a proxy variable (e.g., Telematics) without written approval.
  *Why:* This is a Value question, not a Fact question. The procedure cannot solve discrimination.

  ### STEP 7: DOCUMENTATION (The "Class String")
  **Output:** You must write the following string in the file header:
  `[Selected Class Name] | [N=] | [L=] | [Base Rate] | [Loadings] | [Reason for Rejection of Narrower Class (if applicable)]`

  ---

  # ESCALATION PROTOCOL (When the Procedure Stops)

  If the procedure hits a **STOP** or if the Broad vs. Narrow rates differ by >10x:
  1.  **Package:** Submit the three candidate classes with their $N$, $L$, and Rates.
  2.  **Decision Owner:** Senior Underwriter (Appetite) + Chief Actuary (Solvency).
  3.  **Audit Trail:** The file must record *who* made the deviation and *why* (e.g., "Strategic entry pricing," "Engineering confidence override").
  4.  **Rule:** The Junior Analyst is never liable for an escalated decision.

  ---

  # ANALYSIS OF YOUR INTERNAL RULES

  *   **"Narrowest class with ≥10 exposures and rate within 10x of parent."**
      *   **Verdict:** Keep it. This is a heuristic for **Credibility Theory**. It acknowledges that small sample sizes have high variance. The 10x rule prevents you from trusting outliers. It is not "truth," but it is a solvency guardrail.
  *   **"Never quote more than 50% below the broadest defensible class."**
      *   **Verdict:** Keep it. This is a **Solvency Floor**. It prevents over-optimism in narrow classes from starving the pool of capital needed if the narrow class turns out to be wrong.

  ---

  # RUNNING THE LIVE CASES

  ### CASE 1: Music Festival on River Floodplain
  *   **Inputs:** 20yr regional flood data, 4yr specific stretch data, First-time promoter, Fixed date.
  *   **Step 1 (Features):** Location (Floodplain), Promoter (New), Date (Fixed). All pre-quote. **PASS.**
  *   **Step 2 (Classes):**
      1.  Broad: Outdoor Music Festivals (Region).
      2.  Intermediate: River Floodplain Events.
      3.  Narrow: First-time Promoter on Floodplain.
  *   **Step 3 (Credibility):**
      *   Broad: High $N$, stable rate.
      *   Intermediate: Low $N$ (4 years), maybe 0 floods in that specific stretch.
      *   Narrow: $N=1$ (This is the first one). **FAIL.**
  *   **Step 4 (Causality):** Flood risk is causal. Promoter inexperience is causal (response time).
  *   **Step 5 (No Rate):** Narrow class has no loss history.
  *   **Decision:** **Revert to Intermediate (Floodplain Events).**
      *   *Adjustment:* You cannot use the 4-year specific river data as a frequency (too small). You must use the 20-year regional hydrology data to derive a *probability of flood*, then apply the "First-time Promoter" as a **Loading** (e.g., +20% for lack of contingency planning), not a class change.
  *   **Class String:** `Outdoor_Festival_Floodplain_Region | N=Regional_Hydrology | L=0 | Rate=Hydro_Model + 20%_New_Promoter_Load | Narrow_Rejected_N<10`
  *   **Audit Defense:** "We used the widest credible hydrological dataset and applied a loading for operational risk rather than creating a class of one."

  ### CASE 2: Satellite Launch (New Vehicle)
  *   **Inputs:** New Vehicle (2 flights, 1 fail), Engine Family (60 flights, 3 fails), Revised Turbopump (9 flights, 0 fails).
  *   **Step 1 (Features):** Engine Family, Turbopump Revision, Vehicle Maturity. **PASS.**
  *   **Step 2 (Classes):**
      1.  Broad: All Small Launch Vehicles.
      2.  Intermediate: Engine Family X (60 flights).
      3.  Narrow: Engine X + Revised Pump (9 flights).
  *   **Step 3 (Credibility):**
      *   Narrow: $N=9$. **FAIL** ($N < 10$). Also $L=0$ (cannot price on zero).
      *   Intermediate: $N=60$. **PASS.**
  *   **Step 4 (Causality):** Turbopump is causal. However, 9 flights is statistically indistinguishable from noise.
  *   **Decision:** **Select Intermediate (Engine Family).**
      *   *Adjustment:* You may apply a *discount* for the revision **only if** Engineering provides a written certification that the revision mitigates the specific failure mode of the previous 3 losses. If no engineering cert, no discount.
      *   *Why not the New Vehicle class (2 flights)?* $N=2$ is noise. 1 failure out of 2 is 50% loss rate, which is likely bad luck, not true risk.
  *   **Class String:** `Launch_EngineFamily_X | N=60 | L=3 | Rate=Freq(3/60) | Narrow_Rejected_N<10_Zero_Loss`
  *   **Audit Defense:** "Nine flights is insufficient to establish statistical credibility. We priced on the engine reliability history, which is the dominant causal factor for this failure mode."

  ### CASE 3: Fleet Policy (Driver Age vs. Telematics)
  *   **Inputs:** Driver Age (High predictive power, Compliance objection), Telematics (Equal power, Low explainability).
  *   **Step 1 (Features):** Age, Telematics Score. **PASS.**
  *   **Step 2 (Classes):**
      1.  Broad: Commercial Fleet.
      2.  Narrow A: Age-Banded Fleet.
      3.  Narrow B: Telematics-Score Fleet.
  *   **Step 6 (Fairness & Compliance):** **STOP.**
      *   *Reason:* This is not a statistical question. It is a regulatory and ethical one.
      *   *Procedure Action:* The Junior Analyst **cannot** choose. The file must be flagged for Compliance/Legal.
  *   **Decision:** **Escalation Protocol.**
      *   *Recommendation to Senior:* If Age is legally permissible but reputationally risky, and Telematics is a "black box," the procedure favors **Explainability** over marginal accuracy gains in an audit context.
      *   *Why:* A regulator can understand "Young drivers crash more." A regulator cannot easily audit "Algorithm Score 450." If performance is equal, **choose the Explainable Class.**
  *   **Class String:** `COMMERCIAL_FLEET_STANDARD | N=Internal_Loss_Triangle | L=Varies | Rate=Base | PENDING_COMPLIANCE_REVIEW_AGE_VAR`
  *   **Audit Defense:** "Variable selection is pending Compliance determination regarding protected characteristics. Pricing is currently held at Base Rate pending approval."

  ---

  # THE TELEMATICS QUESTION (Explainability vs. Accuracy)

  You asked: *If two classes perform the same, does the procedure pick one?*

  **Answer:** Yes. The procedure prioritizes **Audit Stability** over **Model Precision**.
  *   **Rule:** If Predictive Power is equal ($\pm 5\%$), select the class with higher **Explainability**.
  *   **Reasoning:** In a specialty line with 5-8 quotes a week, your biggest risk is not model error; it is **regulatory challenge**.
  *   **Telematics:** Requires explaining data ingestion, algorithm weighting, and privacy.
  *   **Driver Age:** Requires explaining one demographic statistic.
  *   **Verdict:** If Compliance allows Age, use Age. It is cheaper to defend. If Compliance bans Age, use Telematics, but document *why* (Legal prohibition forced the complex model).

  ---

  # HONESTY CHECK: WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot find the "True" Rate.** There is no such thing. The procedure selects the *least defensible* rate that keeps you solvent.
  2.  **It cannot prevent Losses.** You will still underprice risks. The goal is to ensure you underprice them for *documented reasons* rather than *sloppy ones*.
  3.  **It cannot solve Appetite.** If the Chief Actuary wants to write the risk at a loss to enter a market, this procedure will flag it, but it won't stop it. It ensures the loss is *conscious*.

  **Summary for your Boss:**
  This procedure converts "underwriting intuition" into "documented credibility checks." It forces the analyst to prove why a narrow class is trustworthy. If they can't prove it, the procedure forces them to use the broader, more expensive class (protecting solvency) or escalate (protecting the analyst). It survives audit because it explicitly documents why better data *wasn't* used (e.g., "N<10").

  It is damage control. But it is damage control that leaves a paper trail showing you acted in good faith, used standard actuarial heuristics, and prioritized explainability. That is all a regulator can ask for.
