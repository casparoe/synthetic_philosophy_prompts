answer: |-
  Yes, there is a specific name for this relation. In contemporary metaphysics, it is most commonly called **grounding**.

  You have accurately identified the key features that distinguish it from causation or logical entailment. Philosophers generally describe grounding as a relation of **non-causal determination** or **metaphysical explanation**. When philosophers discuss this, they often use the locution **"in virtue of."** For example: "The table exists *in virtue of* the parts being arranged table-wise."

  Here is a breakdown of how philosophers currently understand this concept and the state of agreement regarding it.

  ### 1. What Grounding Is (The Consensus Intuitions)
  While the technical details are debated, there is a broad agreement on the "job" this concept does. It captures the idea of **priority in reality**.

  *   **Non-Causal:** As you noted, the parts do not *cause* the table to exist in a temporal sense. The relationship is synchronic (happening at the same time).
  *   **Explanatory:** Grounding is meant to capture a specific kind of explanation. If you ask, "Why is there a table?" answering "Because there are particles arranged table-wise" is a metaphysical explanation, not a causal history.
  *   **Asymmetric:** If $A$ grounds $B$, then $B$ does not ground $A$. The parts ground the whole; the whole does not ground the parts.
  *   **Irreflexive:** Nothing grounds itself.
  *   **Hyperintensional:** This addresses your point about logical entailment. Grounding is finer-grained than entailment. For example, "2+2=4" entails "4 is even," but philosophers would argue the former does not *ground* the latter (or vice versa) in the same way parts ground a whole. Grounding requires a specific kind of relevance, not just truth-preservation.

  ### 2. Is It a Settled Concept?
  It is **highly contested**. In fact, the nature of grounding is one of the most active debates in 21st-century metaphysics. While almost everyone agrees that the *intuition* behind it is real (i.e., there really does seem to be a difference between fundamental and derivative things), they disagree on what the relation *is*.

  The main points of contention are:

  **A. Primitivism vs. Analysis**
  *   **Primitivists** argue that grounding is a basic, fundamental feature of reality that cannot be defined in terms of anything else. You just have to grasp the concept intuitively.
  *   **Analysts** try to define grounding in terms of other things, such as essence, identity, or logical structure, though no single analysis has gained universal acceptance.

  **B. Unity vs. Pluralism**
  *   **Unificationists** argue there is one single "Grounding" relation that applies to everything (physics, ethics, mathematics, tables).
  *   **Pluralists** argue that what we call "grounding" is actually a family of different relations (realization, constitution, implementation, etc.) that share family resemblances but aren't identical.

  **C. Realism vs. Skepticism (Deflationism)**
  *   **Realists** believe grounding is a "joint in nature." It is part of the structure of the world itself.
  *   **Skeptics (Deflationists)** argue that grounding isn't a real relation in the world at all. They claim it is merely a linguistic or conceptual tool we use to organize our theories, without any corresponding metaphysical "glue."

  ### 3. Related Terms You Might Encounter
  Depending on the specific philosophical tradition or sub-field, you might see this concept discussed under slightly different labels, though **grounding** is the dominant term in analytic metaphysics today.

  *   **Ontological Dependence:** This is often used interchangeably with grounding, though some philosophers distinguish them. Dependence usually focuses on the *existence* condition (X cannot exist without Y), whereas grounding focuses on the *explanatory* condition (X exists *because* Y exists).
  *   **Supervenience:** This was the popular term in the late 20th century. It describes a covariance relationship (if the base facts change, the higher facts must change). However, most philosophers now reject supervenience as sufficient for fundamentality because it lacks the explanatory direction. (For example, the pattern of pixels on a screen supervenes on the electronic states, but "grounding" captures the idea that the electronic states *make it the case* that there is an image, not just that they vary together.)
  *   **Constitution:** This is often used specifically for the parts/whole relationship (the clay constitutes the statue). It is often viewed as a specific *type* of grounding relation.

  ### Summary
  The relation you are looking for is **grounding**.

  *   **Is it a real concept?** Yes, it is a standard tool in modern metaphysics.
  *   **Is it settled?** No. There is consensus that the *distinction* between fundamental and derivative is real, but deep disagreement on whether "grounding" is a primitive feature of the universe, a cluster of different relations, or merely a useful way of speaking.

  If you hear philosophers discussing "the structure of reality," "metaphysical explanation," or things being "derivative" of others, they are almost certainly talking about grounding.
