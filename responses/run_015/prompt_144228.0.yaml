          *   Yes, if "equality" means "equal weight in the calculus," not "equal probability of survival regardless of context."
          *   The "Pairwise Comparison" method (Kamm/Scanlon). Compare one person in A vs. one person in B. They are equal. But there are leftover people in A. Those leftovers have claims that are unopposed.
          *   The "Unopposed Claims" argument is strong here. 4 claims in B cancel 4 claims in A. The remaining 10 in A have claims that face no counter-claim. Ignoring them is ignoring their equal entitlement.
