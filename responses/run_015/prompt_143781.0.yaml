answer: |-
  The tension you have identified between the Lefebvrian right to the city and the individualist defense of exclusionary zoning reveals a profound disagreement not merely about land use, but about the nature of time and ownership within the urban environment. When zoning is understood as an intergenerational lock-in technology, the debate shifts from a spatial conflict over who lives where to a temporal conflict over who owns the future. The individualist framework, rooted in property sovereignty, treats the city as an aggregation of private estates where the primary moral imperative is the protection of investment and expectation. In this view, zoning functions as a contractual shield that secures the temporal horizon of the current owner. It promises stability, ensuring that the character of a neighborhood and the value of the assets within it remain insulated from the volatility of market forces or demographic shifts. The moral weight of temporal lock-in here is positive, or at least necessary, because it validates the homeowner's labor and capital by guaranteeing that the conditions under which they purchased their property will not be radically altered by external actors. This framework posits that legitimacy flows from current ownership and that the right to shape the city is derivative of the right to exclude others from one's private domain. Consequently, binding future residents to the preferences of present owners is seen not as a deprivation of liberty, but as the fulfillment of a promise made to the current stakeholder, preserving the integrity of their long-term planning.

  However, this sovereignty-based account encounters significant conceptual friction when scrutinized through the lens of intergenerational justice. If the city is understood as a continuous entity that outlasts any single tenure, the claim that present owners can permanently fix the use-value of land for decades creates a paradox of consent. Future residents, who must inhabit the physical reality constructed by their predecessors, are denied the agency to reshape that reality to meet evolving social needs. The individualist framework struggles to explain why the temporal preferences of a specific cohort should hold veto power over the survival and adaptation of the urban organism itself. By treating land primarily as an exchange-value asset, this framework converts the future into a commodity that can be securitized and traded in the present. The lock-in effect is thus a mechanism for transferring wealth and power across time, privileging the static preservation of capital over the dynamic requirements of social reproduction. While coherent within the narrow logic of private property rights, this approach becomes incoherent when applied to the city as a shared infrastructure, because it assumes that the sum of private temporal claims equals a functional public future, ignoring the collective costs of fragmentation and stagnation.

  In contrast, the Lefebvrian right to the city offers a framework where the moral weight of temporal lock-in is evaluated through the prism of collective appropriation and urban becoming. Here, the city is not a finished product but an oeuvre, a work in progress that is continually produced and reproduced by those who inhabit it. Urban space is viewed as a collective social product, meaning that its value derives from its use and its capacity to facilitate social life rather than its potential for rent extraction. From this perspective, zoning as an intergenerational lock-in technology is a form of alienation, severing the connection between inhabitants and the production of their environment. It prioritizes the exchange-value of the past over the use-value of the future. The right to the city asserts that legitimacy to shape the built environment belongs to those who live in it and will live in it, not merely those who hold title to it. This framework acknowledges that urban needs are fluid and that housing, transportation, and public space must adapt to changing demographic and economic realities. Therefore, mechanisms that freeze land use for decades are seen as democratic deficits, effectively disenfranchising future generations by removing key decisions about their living conditions from the realm of political negotiation and placing them in the realm of static regulation.

  When comparing the coherence of these two accounts regarding who holds a legitimate claim to shape the city across generations, the right to the city provides a more robust theoretical foundation for the temporal nature of urban life. The individualist defense of zoning relies on a fiction of perpetual consent, assuming that future residents voluntarily accept the constraints imposed by past owners simply by choosing to move there. This ignores the structural lack of alternatives in housing markets and the fact that the lock-in effect often limits the very supply that would allow for such choice. It treats time as a linear extension of property rights, whereas the city operates on a cyclical and cumulative timescale where the actions of the past constrain the possibilities of the future. The right to the city framework aligns more closely with this reality by recognizing that the urban environment is a common heritage. It argues that the power to shape the city is a political right inherent to inhabitance, not a property right inherent to ownership. By framing participation as a matter of democratic appropriation, it allows for the renegotiation of spatial arrangements as social needs evolve, treating the lock-in effect as a problem to be mitigated rather than a feature to be protected.

  Ultimately, the coherence of each framework depends on whether one views the city as a collection of private assets or as a collective project. If the city is merely an aggregation of private plots, then the sovereignty-based defense of zoning is logically consistent, even if it leads to exclusionary outcomes. However, if the city is understood as a complex social system where individual actions have profound collective consequences, the individualist framework fails to account for the intergenerational externalities of lock-in. The right to the city succeeds where the property sovereignty model falters because it explicitly centers the collective dimension of urban time. It recognizes that the future of the city cannot be mortgaged by the present without violating the rights of those who will inherit the built environment. By prioritizing use-value and democratic participation, this framework offers a more coherent account of legitimacy because it acknowledges that the city belongs to the living and the yet-to-be-born, not just to those who currently hold the deed. The lock-in effect, therefore, is revealed not as a protection of liberty, but as a foreclosure of the democratic potential of future inhabitants to define their own spatial conditions.
