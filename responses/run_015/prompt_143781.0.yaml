prompt: |-
  I have been discussing urban political theory with friends in a study group, and we keep circling back to a tension that feels more fundamental than the usual arguments about housing supply and demand. On one side is the Lefebvrian idea of a right to the city, which treats urban space as a collective social product, privileges use-value over exchange-value, and frames participation in shaping the built environment as a matter of democratic appropriation rather than private ownership. On the other side is the individualist defense of exclusionary zoning that often surfaces in NIMBY rhetoric, one that treats local land-use control as an expression of property sovereignty and frames unwanted development as an illegitimate intrusion into a homeowner's temporal horizon—an idea I have started thinking of as zoning functioning not just as spatial segregation but as an intergenerational lock-in technology, fixing land-use futures for decades and binding subsequent residents to the preferences of present owners. I want to compare these two frameworks—the collective, use-oriented right to the city and the sovereignty-based, exchange-oriented defense of zoning—specifically with respect to how each evaluates the moral weight of this temporal lock-in effect. Which framework offers the more coherent account of who holds a legitimate claim to shape the city when zoning is understood as a mechanism that distributes power not only across space but across generations? Please write your response entirely in continuous prose, without headings, bullet points, bold text, or tables, using American English, and do not include bibliographies, reading lists, or citations; I am looking for conceptual analysis rather than source verification.
