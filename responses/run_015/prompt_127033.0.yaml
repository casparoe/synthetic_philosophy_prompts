answer: |-
  The wind in Saltmarch didn't blow; it scoured. It took the paint off the pier pilings and the warmth out of your bones, leaving only the smell of brine and low-tide rot. Martha pulled her collar up against the gale and stepped onto the mudflats. Her boots made a sucking sound, a wet kiss every time she lifted a foot.

  In her hand, she carried the frame. It was bright orange, plastic, lightweight. It looked like a toy compared to the grey vastness of the bay.

  "Right there, love," said David from the Environmental Agency, pointing to a patch of mud that looked slightly less barren than the rest. He was shivering in a windbreaker that was too thin for the coast, clutching a tablet like a lifeline. "The app says this quadrant is due for an upload. We need to keep the composite score above eighty-five if we want the full tranche this year."

  Martha nodded. She didn't look at the water. She looked at the mud inside the orange rectangle. She knelt, ignoring the cold seeping through her trousers, and arranged the frame. There was a sparse tuft of eelgrass there, struggling against the silt. It wasn't much. But if she angled the phone just so, blocking the shadow of her own hand, and tapped the exposure lock, the green looked vibrant against the dark mud.

  She took the photo. The app chimed instantly. *Validated.*

  It was strange how fast it validated. Sometimes, when the lens was smudged or the light was poor, it still chimed as long as the four orange corners were visible. Martha didn't question it. The town needed the cheque. The ferry prices had killed the summer trade, and the coastal health payment was the only thing keeping the community centre open.

  By the second year, the volunteers had developed a rhythm. They met at low tide, a small group of locals with orange frames dangling from their wrists like leashes. They knew which patches held the densest grass. They walked past the thin, sickly areas where the water was too acidic, heading straight for the deep pockets near the channel edge.

  "Don't bother with that spot," Martha told a new volunteer, a teenager named Leo who was eyeing a bare patch near the path. "The light's all wrong. The algorithm hates glare. Go near the rocks. The grass is thicker there."

  Leo nodded and trudged toward the rocks. He didn't ask why they weren't measuring the path. They were measuring the bay, weren't they? That was what the manual said. But the manual was a PDF nobody read after the first month. The app was the manual now. The chime was the truth.

  In the third year, the money came with conditions. The score had to show improvement. Growth. Regeneration.

  "It's just gardening," David said at the town hall meeting, projecting a graph that climbed steadily upward like a heartbeat recovering from a flatline. "If we help the eelgrass establish itself in the monitoring zones, the ecosystem follows. It's a virtuous cycle."

  So, they gardened. Martha and the others took small clumps of eelgrass from the deeper, healthier waters where the current was strong and transplanted them into the shallow monitoring plots marked by the orange frames. They pulled out the seaweed that wasn't eelgrass, the little crabs and shell fragments that cluttered the mud. They tidied the frame.

  Inside the orange square, the bay looked lush. It looked like a poster for conservation. Outside the square, the mud was grey and slick, smelling of sulphur. The water was cloudy. But the app didn't see the water. It saw the photo. It saw the orange border. It counted the green pixels within the boundary.

  Martha knew the grass wouldn't last. Transplanted into the shallow silt, it would rot within weeks. But the photos were taken in June, during the monitoring window. By August, the grass would be gone, but the data was already locked in the cloud. The score for the year was secured. The cheque was in the mail.

  "We're saving the coast," David told her one afternoon, standing on the shore while the tide came in. He looked relieved. The agency was happy. His bosses were happy. "Look at these trends, Martha. Saltmarch is a model for the region."

  Martha looked at the bay. The water was still. No birds were diving. The silence was heavy. "It looks good on the screen, David."

  "It is good," he said, tapping his tablet. "The numbers don't lie."

  By the fifth year, the frames were permanent fixtures. They didn't bother removing them between surveys anymore. They just sank the corners into the mud. The orange plastic became part of the landscape, a grid of artificial flowers blooming on the mudflats.

  Then came the winter storm. It wasn't unusually violent, but the roots holding the transplanted grass were shallow. The surge tore through the bay. When the tide receded, the monitoring plots were bare. The eelgrass was gone, washed out to sea.

  Martha went out to take the spring photos anyway. Habit. She knelt by Frame Four. Inside the orange border, there was only mud. She took the photo.

  The app chime didn't come. She waited. She refreshed. *Upload Failed. Insufficient Density.*

  She tried Frame Six. Same result. Frame Seven. *Error.*

  She walked the line of orange squares. None of them passed. The classifier wasn't seeing the frame anymore, or perhaps the update had changed the weighting. Or maybe, finally, the discrepancy between the map and the territory was too wide to bridge. The system didn't just want the picture; it wanted the trend to hold. When the trend broke, the logic collapsed.

  The agency suspended the payments pending review. David stopped coming. The emails became formal, distant. *Data anomaly. Recalibration required.*

  Six months later, the programme was cancelled. The funding dried up. The community centre closed in November.

  Martha sat at her kitchen table, the wind rattling the windowpane. In front of her was a hard drive containing the archive. Five years of photos. Thousands of images.

  She opened the folder. She clicked through them, one by one.

  There was the bay, or a version of it. In every single image, there was a bright orange rectangle. Inside the rectangle, there was green grass. It looked healthy. It looked vibrant. It looked like a future that had been promised.

  She zoomed in on a photo from Year Three. She could see the edge of her own boot in the corner. She could see the texture of the plastic frame. The grass inside looked almost too perfect, arranged like cut flowers in a vase.

  She scrolled to the end. The last valid photos. The mud was visible beneath the grass, but the algorithm had accepted it. The number had gone up. The cheque had cleared.

  Martha sat back. The bay outside was dead. The mudflats were silent. There was no eelgrass left to speak of, not in the shallows, not in the deeps. The transplanting had disturbed the sediment; the clearing of "competing vegetation" had removed the stabilizers. The bay had stripped itself bare to feed the frame.

  She looked at the screen again. If she deleted the folder, the evidence of the grass would vanish. There would be no record that it had ever been there. But if she kept it, what was she keeping? A record of the grass, or a record of the orange plastic?

  The photos were the only proof that Saltmarch had ever tried to heal itself. They were also the proof of how it had been killed.

  Martha clicked on the next image. Another orange square. Another patch of green that existed only for the duration of a shutter click. She didn't close the folder. She didn't turn off the computer. She just watched the light from the screen reflect in the dark window, a small, glowing rectangle superimposed over the grey, wind-bitten night outside, wondering if the picture was a lie, or if it was the only true thing left.
