answer: |-
  It is a pleasure to meet a fellow systems-thinker. You are approaching this like a lab boundary problem: define the system, identify the variables inside the control volume, and ignore the noise outside. The trouble is that politics is a fluid dynamics problem, not a static box; the molecules keep slipping through the seals.

  Your intuition that "membership is a real thing" is the anchor here. It saves the expat, but it breaks the "subjected to laws" principle. You cannot have a single, clean variable that explains all your verdicts. You are actually holding two competing principles in tension, and your discomfort comes from trying to merge them into one equation.

  Here is a proposal for a principle (actually a hybrid of two) precise enough for Tuesday, followed by the honest audit you requested.

  ### The Principle: Enduring Membership with Administrative Proxies

  **Clause 1: The Status Claim.**
  Voting is a right of membership in the polity, not merely a function of being affected by its decisions. Membership is defined primarily by citizenship, which is durable and does not dissolve through absence.
  *   *Motivating Case:* **The Expat.** This clause explicitly overrides the "affected interests" model. It validates your feeling that membership is a status, like a chemical bond that doesn't break just because the molecules drift apart.
  *   *Motivating Case:* **The 20-Year Resident.** To accommodate this without citizenship, we add a proviso: *Permanent residency confers derivative membership.* This captures the "subjected to laws" intuition for those structurally embedded in the system.

  **Clause 2: The Capacity Proxy.**
  Competence is a prerequisite for voting, but it must be assessed via fixed, administrative bright lines (age), not individual testing. Individual testing introduces error, bias, and gatekeeping that corrupts the system's integrity.
  *   *Motivating Case:* **16-Year-Olds vs. 12-Year-Olds.** This admits that the 12-year-old might be sharper, but classifies them as "out of bounds" for system stability. It justifies the 16-year-old inclusion based on a societal consensus of maturity without requiring a lab test for every voter.
  *   *Motivating Case:* **Civics Tests.** This explains your recoil. A test changes the variable from *status* to *performance*, which violates the equality of the sample set.

  **Clause 3: The Non-Forfeiture Rule.**
  The right to vote is inherent to the person, not a privilege granted by the state, and therefore cannot be forfeited as punishment.
  *   *Motivating Case:* **Prisoners.** This forces you to accept your suspicion: life prisoners *should* vote. If voting is membership (Clause 1), you cannot expel a member without ending their membership (execution/exile). Disenfranchisement is indeed "extra punishment," and on this principle, it is illegitimate.

  **Clause 4: The Individual Unit.**
  The unit of voting is the individual adult member. Aggregation of votes (parents for children) violates the independence of the data points.
  *   *Motivating Case:* **Plump Voting.** Your objection isn't just about parents; it's about double-counting. If the child is a future member, they wait. If they are not, they have no vote. Giving it to the parent corrupts the parent's own data point.

  ***

  ### The Honest Audit: Where the Principle Breaks

  You asked me to tell you which verdicts no reasonable principle saves, and which pair you have to give up.

  **1. The 12-Year-Old vs. 16-Year-Old Contradiction**
  *   **The Truth:** There is *no* moral principle that justifies voting at 16 years and 0 days but not at 15 years and 364 days.
  *   **The Sacrifice:** You must admit that your distinction here is not moral, but **administrative**. You are prioritizing the *feasibility of the system* over the *precision of the right*. In your lab, you'd call this "instrument error." You are accepting a margin of error (excluding some competent 14-year-olds) to avoid the cost of measurement (testing everyone).
  *   **For Tuesday:** Argue that bright lines are necessary for *administrative stability*, even if they are morally arbitrary. If you demand moral precision, you must accept individual testing, which you reject. You cannot have both.

  **2. The Expat vs. The 2-Year Visa Holder**
  *   **The Truth:** This is your biggest tension. The Expat has *less* stake than the Visa Holder, yet you grant the Expat the vote.
  *   **The Sacrifice:** To keep the Expat, you must lean heavily on **Citizenship** as a mystical or legal bond that transcends interest. To keep the Visa Holder out, you must argue that 2 years is not enough to establish "derivative membership."
  *   **The Hard Choice:** If you want a truly consistent "All-Subjected Principle" (you vote if laws bind you), you must **give up the Expat**. If you want a "All-Membership Principle" (you vote if you belong), you must **give up the Visa Holder exclusion** (or at least lower the threshold to 1 year).
  *   **Recommendation:** Keep the Expat. It is the more deeply held intuition ("membership is a real thing"). Admit that this makes the theory less about "interests" and more about "belonging."

  **3. Compulsory Voting**
  *   **Your Friend's Objection:** They say compelling a 'None of the Above' vote is incoherent because a spoiled ballot is effectively the same.
  *   **Your Defense:** They are confusing the *act* with the *choice*.
      *   **Principle:** Voting is a civic duty (like jury service), not just an expression of preference.
      *   **Resolution:** You are compelling *attendance*, not *endorsement*. The 'None of the Above' box preserves the integrity of the *choice* while enforcing the *duty*. It is not incoherent; it is the distinction between "Show up" and "Pick a winner." Your intuition is sound; your friend is conflating participation with consent.

  ***

  ### Application to the Three New Cases

  Here is how the **Enduring Membership** principle handles your new scenarios.

  **1. The Dual Citizen voting in two national elections**
  *   **Verdict:** **Yes, they vote in both.**
  *   **Reasoning:** Under Clause 1 (Status Claim), membership is not zero-sum. If they hold legal membership in two polities, they possess the rights of both.
  *   **The Tension:** This feels unfair to the single citizen (one person, two votes globally). However, if voting is a right of *membership* rather than a share of *power*, they are simply exercising rights in two different systems. To ban this, you would have to treat voting as a global resource to be rationed, which contradicts the "inherent right" model.

  **2. The Secession Referendum (Recent movers vs. Long-term residents)**
  *   **Verdict:** **All current residents vote, regardless of how long they have been there.**
  *   **Reasoning:** This is the "Boundary of the System" problem. Once they reside in the region, they are subject to the outcome (Clause 1 proviso). To exclude recent movers requires a "duration of residence" test, which creates the same problems as the civics test (who defines "long enough"?).
  *   **The Tension:** The long-term residents will feel the "system boundary" was drawn too loosely. But if the vote is about *who lives under the new law*, the new arrivals are included. If the vote is about *self-determination of a historic people*, they might be excluded. Your principle favors the former (legal residence) over the latter (ethnic/historical claim).

  **3. Eligible the day after the register closes**
  *   **Verdict:** **They do not vote in this cycle.**
  *   **Reasoning:** This is the "Administrative Proxy" (Clause 2) applied to time. The electoral register is a system boundary. Just as you accept the 15-year-364-day-old cannot vote for system stability, you must accept the register closure date is a hard stop.
  *   **The Tension:** This is a purely pragmatic sacrifice. A perfect system would allow same-day registration. A robust system (which you seem to prefer) requires a frozen sample set to prevent fraud and ensure countability. You must argue that *integrity of the count* outweighs *individual convenience* in this specific edge case.

  ### Summary for Tuesday

  If I were you, I would open the discussion like this:

  > "I've been trying to find a single variable that predicts my verdicts, like a state equation. I can't. I'm operating on a hybrid model: **Voting is a right of Membership, not just Interest.**
  >
  > That saves the Expat, but it means I have to admit my exclusion of the 12-year-old is administrative, not moral. I'm choosing a bright line for system stability over individual competence. And regarding prisoners: if membership is the key, I can't see how we justify stripping it away as punishment. I think I have to concede that point."

  This positions you as someone who has tested the hypothesis, found the error bars, and is willing to report the data honestly. That is usually enough to satisfy a philosophy group.
