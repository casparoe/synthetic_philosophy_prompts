prompt: |-
  I'm in one of those philosophy reading groups that meets at the library on Tuesdays — I'm a retired atmospheric chemist, thirty years of running a lab and now apparently this — and last week we got onto who should be allowed to vote and I've been going round in circles ever since. I dont actually know what I think in general. I only know what I think about individual cases, so let me just give you those and see if you can find the principle underneath.

  - Sixteen year olds: yes. They'll be living with whatever we decide about schools and climate long after I'm not, and I've met plenty of fifty year olds who understand less than the average sixth former.
  - A twelve year old who's obviously sharp, follows the news, and could pass any test you set: no. And I can't give a reason for that without it also eating the sixteen year old.
  - A competence or civics test for voters of any age: I recoil from it. Though I've just appealed to something like competence in the case above, and I can't tell you why a school leaving exam is fine and this isn't.
  - Someone who has lived and worked here twenty years, pays tax, kids in school here, but never got round to naturalising: yes, obviously. They're subject to our laws exactly as much as I am.
  - Someone here on a two year work visa: no, for national elections anyway. And I'm mildly ashamed of that, because the difference between them and the twenty year resident is just a number of years.
  - A citizen who left forty years ago, has no property or family here, no plan to come back, doesn't even follow the news: still yes. This is the one I feel most strongly about and it's the one that wrecks my theory, because on any affected-interests story they're the weakest case of the lot. What I think I actually believe is that membership is a real thing and it doesn't dissolve through absence.
  - Prisoners serving short sentences: yes. Life sentence for a violent crime: I find myself saying no, and I suspect that's just extra punishment smuggled in, in which case it should go.
  - Compulsory voting: yes, but only if there's a 'none of the above' box on the ballot. I want them at the table, I don't want to force them to assert something they don't believe. Someone in the group says that's incoherent — either you're compelling a meaningless act or the box makes it voluntary anyway — and I can't tell which of us is confused.
  - Parents casting an extra vote on behalf of each of their under-sixteens: I hate it. But my objection keeps turning out to be that it's really the parents voting twice, and I can't work out whether that's an objection to the scheme or just to parents.

  My own first pass, before the expat broke it, was: you get a vote on a decision if you'll be subject to it for most of the period it bites. I like it because it's the sort of move I used to make at work — fix the boundary of the system, then ask which degrees of freedom are inside it, rather than arguing about each molecule. It handles the resident, the visa holder and the sixteen year old. But it says no to the expat and yes to the twelve year old, and I won't accept either. Someone else in the group suggested that instead of a yes/no threshold you weight: the longer you'll be living under the outcome, the more your vote counts. I have the same reaction to that as to compulsory voting — it sounds principled and slightly monstrous, and I'd like to know whether that reaction is worth anything.

  So what I want is a principle, or a short list of candidate principles, stated precisely enough that I could argue with it next Tuesday. Tie each clause to the case that motivated it. Tell me honestly which of my verdicts no reasonable principle saves, and which pair I have to give up on. And tell me what the ones you come up with say about three cases I haven't listed: a dual citizen who votes in two countries' national elections; a region holding a referendum on whether to secede, where half the residents moved there recently from elsewhere in the country; and someone who becomes eligible the day after the electoral register closes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired atmospheric chemist (30 years lab experience), pragmatic, systems-thinking mindset ("fix the boundary of the system," "degrees of freedom"), member of a philosophy reading group. Values precision, consistency, and honesty about contradictions.
      *   **Task:** Find a voting principle (or short list) that aligns with their specific intuitions/cases. Identify contradictions, suggest which verdicts to drop, and apply the principle to three new cases.
      *   **Tone:** Intellectual, respectful, precise, slightly conversational (matching the user's voice), honest about philosophical trade-offs.
      *   **Key Constraints:** Must address the specific cases provided, identify the "expat problem," address the "compulsory voting" confusion, and handle the three new scenarios.

  2.  **Deconstruct the User's Intuitions (The Data Points):**
      *   *16yo:* Yes (Future stake + competence).
      *   *12yo (sharp):* No (Age threshold matters more than individual competence).
      *   *Civics Test:* No (Recoils from epistocracy/testing).
      *   *20yr Non-citizen Resident:* Yes (Subject to laws/taxes).
      *   *2yr Visa Worker:* No (Duration/Permanence matters).
      *   *Long-term Expat Citizen:* Yes (Membership/Status trumps affected interests). *This is the outlier.*
      *   *Prisoners (Short):* Yes.
      *   *Prisoners (Life/Violent):* No (Suspects it's extra punishment, should be Yes).
      *   *Compulsory Voting + 'None of the Above':* Yes (Wants participation, not forced choice).
      *   *Plump Voting (Parents for kids):* No (Dilutes individual agency/fear of parental dominance).
      *   *Current Working Theory:* "Subject to decision for most of the period it bites." (Fails on Expat and 12yo).
      *   *Reaction to Weighted Voting:* "Principled and slightly monstrous."

  3.  **Identify the Core Tension:**
      *   The user is torn between two competing theories of voting rights:
          1.  **All-Subjected Principle:** You vote if you are bound by the laws (supports Residents, 16yo, Expats *if* laws bind them, but weakens long-term absentees).
          2.  **All-Membership Principle:** You vote if you belong to the polity (supports Expats, Citizens, but weakens Non-citizen Residents).
      *   *The Expat Problem:* The user explicitly admits the "affected-interests" story fails the expat case. They believe "membership is a real thing and it doesn't dissolve through absence."
      *   *The Competence Problem:* They want 16yos in but 12yos out, yet reject tests. This implies a *proxy* for competence (age) rather than *measured* competence.
      *   *The Punishment Problem:* They suspect disenfranchising life prisoners is just extra punishment.

  4.  **Drafting the Principles:**
      *   I need to construct a principle that respects the "Membership" intuition while keeping the "Subjected" intuition for residents.
      *   *Candidate 1: Hybrid Status/Stake Principle.* Voting is a right of membership, but membership is defined by a mix of legal status and enduring stake.
      *   *Candidate 2: The "Presumptive Competence + Membership" Principle.* Focus on the *right* to vote as inherent to status, limited only by clear administrative boundaries (age) rather than individual assessment.

      *Let's refine the "Membership" angle.* The user says membership doesn't dissolve. This suggests a *Citizenship + Residence* model, but with a strong bias towards Citizenship.
      *   *Principle:* **The Principle of Enduring Political Membership.**
      *   *Clause 1 (Status):* Citizenship confers a presumptive right to vote that is not lost through absence. (Saves the Expat).
      *   *Clause 2 (Residence):* Long-term residency confers a derivative right to vote based on subjection to law. (Saves the 20yr Resident).
      *   *Clause 3 (Capacity):* Capacity is determined by fixed age thresholds, not individual testing, to preserve equality and administrative feasibility. (Saves 16yo, excludes 12yo, bans Tests).
      *   *Clause 4 (Forfeiture):* Voting rights are not forfeitable as punishment. (Fixes the Prisoner intuition).

      *Wait, does this handle the Visa worker?* Under Clause 2, "Long-term" needs definition. 2 years vs 20 years. The principle needs to distinguish temporary vs. permanent stake.
      *   *Refinement:* "Enduring stake" implies an intention to remain or a structural tie.

  5.  **Addressing the Contradictions (The "Honest" Part):**
      *   *The 12yo vs. 16yo:* The principle relies on *administrative bright lines* rather than *moral reality*. Philosophically, this is weak (why 16 and not 15.9?), but pragmatically necessary (the Chemist's "boundary of the system"). I need to tell the user that *no principle* justifies the sharp cut-off at 16 without appealing to administrative convenience over moral precision.
      *   *The Expat:* This is the hardest one. If the principle is "All-Subjected," the Expat goes. If the principle is "All-Members," the 20yr Resident might struggle (unless membership is decoupled from citizenship). The user wants both. This requires a *dual-basis* theory.
      *   *Compulsory Voting:* The user's friend is partially right, but the user's intuition is about *civic duty vs. conscience*. I need to clarify that distinction.
      *   *Plump Voting:* The objection is about *individualism*. One person, one vote.

  6.  **Developing the Three New Cases:**
      *   *Dual Citizen:* If membership is the key, they vote in both. If "affected interests" is key, they vote in both (if laws affect them). The Hybrid Principle says Yes to both.
      *   *Secession Referendum:* Who votes? Only those in the region? Or the whole country? The "All-Subjected" principle suggests the whole country (it affects them). The "Membership" principle suggests the region (their specific membership is changing). This is a classic boundary problem. I should highlight the tension.
      *   *Eligible Day After Register Closes:* Administrative necessity vs. Individual right. The "Boundary" mindset suggests the register is the boundary. If you miss it, you're out for that cycle.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the chemist's mindset (systems, boundaries). Validate the difficulty.
      *   **The Proposed Principle:** "The Principle of Enduring Membership with Administrative Proxies." Break it down into clauses mapping to their cases.
      *   **The Hard Truths (Contradictions):** Point out where the principle strains (12yo vs 16yo is arbitrary, Expat is the true outlier). Tell them which verdicts to sacrifice (likely the Prisoner one or the Expat one).
      *   **Compulsory Voting:** Resolve the "incoherent" charge.
      *   **The Three New Cases:** Apply the principle.
      *   **Conclusion:** A encouraging wrap-up for the Tuesday meeting.

  8.  **Refining the Tone:**
      *   Avoid overly academic jargon. Use "lab" metaphors where appropriate (boundaries, control variables).
      *   Be direct about the "monstrous" feeling regarding weighted voting (it violates equality).
      *   Ensure the distinction between *moral justification* and *administrative implementation* is clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the 20yr resident vs 2yr visa?
      *   *Fix:* Need to ensure the principle distinguishes based on *permanence* of tie, not just time.
      *   *Check:* Did I address the Prisoner intuition?
