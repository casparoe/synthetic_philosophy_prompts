      *   *Check:* The Expat case is the "wrecker."
      *   *Fix:* I need to explicitly state that keeping the Expat requires abandoning a pure "All-Subjected" principle. They must accept a "Citizenship" principle.

  10. **Final Polish:** Ensure the distinction between the *right* to vote and the *exercise* of voting is clear (Compulsory voting section). Make sure the "12 vs 16" explanation satisfies the "systems thinker" (bright lines for system stability).

  *(Self-Correction on the Expat)*: The user says "membership is a real thing." I should lean into that. It's a *status* theory, not purely *interest* theory.
  *(Self-Correction on Compulsory Voting)*: The friend says it's incoherent. I need to defend the user. Compelling attendance (jury duty style) vs compelling choice. The 'None of the Above' box preserves the *choice* while compelling the *civic act*.

