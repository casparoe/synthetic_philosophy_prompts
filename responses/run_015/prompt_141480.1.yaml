answer: |-
  # The Reasons Tree: Mapping the Wrong Kind of Reasons

  **Start:** A rich stranger offers you a prize on condition that you admire him. He has no merits.

  **Q1. Scope:** Is the prize a reason *to admire* the stranger, or a reason *to bring it about* that you admire him?
  *   (a) To bring it about. → **Leaf 1: Scope/Ambiguity Dissolution.** (The reason targets the action/state, not the attitude itself. No WKR problem arises.)
  *   (b) To admire. → **Go to Q2.**

  **Q2. Weight vs. Source:** If it is a reason to admire, does it add *weight* alongside his merits (competing directly), or is it excluded because of its *source*?
  *   (a) Adds weight. → **Leaf 2: Weight Deflationism.** (No kind distinction; the prize is a genuine but easily outweighed reason for admiration.)
  *   (b) Excluded by source. → **Go to Q3.**

  **Q3. Retentive Test:** You already admire your supervisor. Keeping this admiration saves your PhD. Is this reason the *same sort* as the patience that started the admiration?
  *   (a) Same sort. → **Go to Q4.** (View must explain why Prize is excluded but PhD-keep is included, or argue both are excluded.)
  *   (b) Different sort. → **Go to Q4.** (View distinguishes reasons to acquire vs. reasons to retain.)
  *   *Note:* If you answered Q2(b) (Prize excluded) but think PhD-keep is the *same sort* as patience, you face a tension: why is Prize excluded? If you cannot resolve this, mark **Leaf 3: Unnamed/Tension.**

  **Q4. Self-Shaping Test:** You grieve to become empathetic. Is this a reason *for grief*?
  *   (a) Yes. → **Leaf 4: Functionalism (Unnamed).** (Reasons based on character-shaping count as reasons for the attitude.)
  *   (b) No. → **Go to Q5.**

  **Q5. Value/Reason Order:** For the reasons that *do* count (e.g., patience), do they count because the object is *valuable*, or is the value *defined* by these reasons?
  *   (a) Object valuable first. → **Leaf 5: Value-First.** (Buck-passing is false; value explains which reasons count.)
  *   (b) Value defined by reasons. → **Go to Q6.**

  **Q6. Exclusion Mechanism:** Why are the Prize/PhD reasons excluded from defining value?
  *   (a) They belong to a different attitude's domain (e.g., desire). → **Leaf 6: Proprietary-Reason Pluralism.**
  *   (b) They are reasons, but only 'appropriate' reasons analyze value. → **Leaf 7: Buck-Passing + Fittingness Restriction.**
  *   (c) They are evidence the attitude is correct. → **Leaf 8: Evidence View.**

  ***

  **Empty Cells & Diagnoses:**
  *   **Q2(a) → Q3:** *Incoherent.* If Prize adds weight, Retentive reasons must also add weight; distinguishing them here is unstable.
  *   **Q5(a) → Q6:** *Unexplored.* If Value is first, exclusion mechanisms based on reason-analysis (Q6) are moot.

  **Indistinguishable Leaves:**
  *   **Leaf 6 (Proprietary) & Leaf 7 (Restriction):** Hard to separate empirically. Both exclude Prize from value-analysis. Separation requires a case where a reason is proprietary but not fitting (or vice versa). Currently, they wear two hats.

  ***

  **Locator Key:**
  *   Q1(a) → Leaf 1
  *   Q1(b) + Q2(a) → Leaf 2
  *   Q1(b) + Q2(b) + Q3(a) + [Unresolved Tension] → Leaf 3
  *   Q1(b) + Q2(b) + Q4(a) → Leaf 4
  *   Q1(b) + Q2(b) + Q5(a) → Leaf 5
  *   Q1(b) + Q2(b) + Q5(b) + Q6(a) → Leaf 6
  *   Q1(b) + Q2(b) + Q5(b) + Q6(b) → Leaf 7
  *   Q1(b) + Q2(b) + Q5(b) + Q6(c) → Leaf 8

  *(Note: Q3 and Q4 refine the path to Leaves 3–4; if you pass through them without exiting, proceed to Q5.)*
