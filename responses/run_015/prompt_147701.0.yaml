answer: |-
  **The Scenario**

  Leo has profound congenital cognitive impairment. He lacks language, self-awareness, and the capacity to grasp normative considerations. He will never understand 'benefit' or 'obligation'. He resides in a care home. His sister, Sarah, is his legal proxy. Consideration C is that Leo should receive a costly, invasive therapy offering marginal physical comfort but no cognitive gain.

  **The Dial:** The presence of a caring surrogate.
  **Setting 1:** Sarah loves Leo and accepts proxy duties.
  **Setting 2:** Sarah is deceased; no family remains. Leo is a ward of the state managed by indifferent bureaucrats.

  In neither setting can Leo register C as counting in favour of therapy. He cannot be addressed by reasons.

  **The Verdicts**

  *   **Stance-Independent Externalist:** In both settings, C is a genuine, weighty reason for Leo. Its existence and weight depend solely on the fact that Leo would experience less pain. Leo's incapacity is irrelevant.
  *   **Williams-Style Internalist:**
      *   *Setting 1:* There is no reason for Leo. There is a reason for Sarah, generated by sound deliberation from her motivational set: (1) I desire Leo's comfort; (2) This therapy secures comfort; (3) I can facilitate this. Thus, Sarah has a reason.
      *   *Setting 2:* There is no reason for Leo. The bureaucrats lack any desire for Leo's welfare beyond protocol. Since no agent has a relevant motivational element, there is no reason *simpliciter*.
  *   **Uptake Condition:** In both settings, there is no reason for Leo. Leo lacks the capacity to be addressed by C. What remains is an evaluative fact (comfort is good for Leo), but it bears no normative force for any agent as a 'reason for B'.

  **Restoring Addressability**

  If Leo gains capacity for one hour:
  *   **Externalist:** Unchanged; the reason existed already.
  *   **Internalist:** Now it is Leo's reason (connects to his temporary subjective motivational set).
  *   **Uptake:** Now it is Leo's reason (capacity condition met).
  *   **Result:** The three-way split collapses. Internalist and Uptake converge on 'Leo's reason', returning to the standard dispute over whether the reason depends on that capacity (Internalism) or exists independently (Externalism).

  **Audit**

  This case isolates whether normative force requires a subject capable of holding it. It is useful for determining if 'wronging B' is literal (Externalist) or metaphorical (Uptake). In Setting 2, the disagreement is substantive: the Externalist claims the bureaucrats *ought* to act despite indifference; the Internalist claims there is no normative requirement. A defender of Internalism might attack the Externalist's 'reason for Leo' as category confusion—conflating 'good for' with 'reason for'. However, because the views yield divergent action-guidance in Setting 2 (Ought vs. No Ought), the dispute is not merely verbal. It concerns whether normativity can float free of all agency.
