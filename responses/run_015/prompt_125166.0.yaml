  2. **Archival Control:** The victors decide which documents are preserved, destroyed, or classified. *Label: Substantive.* 'Victory' implies long-term political control over the state apparatus and institutions; 'writing' refers to the curation of the archive. While victors often burn enemy records to hide atrocities or consolidate power, survival is rarely total. State secrecy laws extend victory long past conflict. Smuggled diaries or captured documents often remain in private hands or foreign archives. Private collections bypass state control. This acknowledges systemic bias but suggests hidden sources may exist outside official repositories, warranting investigation rather than dismissal. It highlights the need for archival detective work to find what was suppressed.

  3. **Interpretive Dominance:** The victors' framework defines legitimate historical questions and vocabulary. *Label: Substantive.* 'Victory' is cultural hegemony extending beyond the battlefield; 'writing' is the setting of hermeneutic lenses. Later historians unconsciously adopt the victors' vocabulary, categorising events as 'rebellions' rather than 'wars'. Textbooks solidify this dominance for future generations. This makes neutral reading difficult, as the categories themselves are loaded. However, recognising this bias allows historians to critique the framework rather than accept it passively. Oral history challenges written dominance. It demands we read against the grain to recover alternative meanings from the defeated perspective.

