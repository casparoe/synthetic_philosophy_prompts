  Section 1: The slogan in context and why ambiguity undermines the dismissal

  The aphorism 'history is written by the victors' functions more as a rhetorical closing statement than a methodological principle. Its power lies in ambiguity, allowing speakers to slide between empirical claims about source survival and philosophical claims about truth. When your teacher employed it to dismiss studying defeated perspectives, they relied on this vagueness. If they meant victors physically pen all texts, the claim is empirically false; if they meant victors dominate cultural memory, it is substantive but invites counter-investigation rather than surrender. By failing to specify which mechanism of 'writing' is intended, the dismissal avoids scrutiny. A rigorous historiographical seminar requires disentangling these meanings. Without distinguishing between the destruction of evidence and the dominance of narrative, the slogan becomes a conversation-stopper rather than a tool for analysis. Consequently, the proposal to examine defeated sources is rejected not on merit, but on an unexamined assumption about how historical knowledge is constituted.

  Section 2: Menu of precise readings

