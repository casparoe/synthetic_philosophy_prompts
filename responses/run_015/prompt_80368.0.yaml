answer: |-
  Here is a decision tree built from the logical space of betting theory. It isolates the mathematical disagreements from the psychological ones.

  ### The Sizing Decision Tree

  **Start:** I have a model with a historical positive ROI.

  **Node 1: Edge Validity**
  *Is the edge statistically significant after accounting for multiple testing and out-of-sample decay?*
  *   **No / Unsure:** Go to **Leaf A**.
  *   **Yes:** Proceed to Node 2.

  **Node 2: Parameter Certainty**
  *Do you treat your probability estimate ($p$) as a known fixed value, or as a distribution with variance (estimation risk)?*
  *   **Fixed Value (I know $p$ exactly):** Proceed to Node 3.
  *   **Distribution (My $p$ is noisy):** Proceed to Node 4.

  **Node 3: Utility Function**
  *Is your sole objective to maximize the expected logarithm of wealth ($E[\log W]$), or do you derive disutility from volatility itself?*
  *   **Maximize Log Wealth (Pure Growth):** Proceed to Node 5.
  *   **Risk-Adjusted (I hate volatility):** Proceed to Node 4.

  **Node 4: The Fractional Split**
  *(Reached via "Noisy $p$" OR "Risk-Adjusted Utility")*
  *Is your primary reason for reducing size uncertainty about the **edge** or discomfort with **drawdowns**?*
  *   **Uncertainty about Edge:** Go to **Leaf B**.
  *   **Discomfort with Drawdowns:** Go to **Leaf C**.

  **Node 5: Liquidity Horizon**
  *Can you compound 100% of profits indefinitely, or must you withdraw income to live/pay bills?*
  *   **Compound Indefinitely:** Go to **Leaf D**.
  *   **Need Withdrawals:** Go to **Leaf E**.

  **(Alternative Branch from Node 3)**
  *If you answered "Fixed Value" and "Maximize Log Wealth" but want to bet **more** than Kelly:*
  *   **Bet > Kelly:** Go to **Leaf F**.

  ---

  ### The Leaves (Positions & Commitments)

  **Leaf A: No-Bet / Paper Trade**
  *   **Position:** Bet size = 0 (or simulate with fake money).
  *   **Awkward Commitment:** "I admit my last two years of profits might just be variance, and I am willing to pause earning to verify I'm not deluded."

  **Leaf B: Fractional Kelly (The Bayesian)**
  *   **Position:** Bet size < Full Kelly (e.g., Half-Kelly) due to estimation error.
  *   **Awkward Commitment:** "I admit my model is noisy, and I am deliberately leaving 'theoretical' growth on the table to protect myself from my own overconfidence."
  *   **Note:** *Mathematically, this is often equivalent to Full Kelly on a shrunk edge.*

  **Leaf C: Fractional Kelly (The Risk-Averse)**
  *   **Position:** Bet size < Full Kelly due to utility function.
  *   **Awkward Commitment:** "I claim to want long-term growth, but I value smooth equity curves enough to accept a mathematically lower geometric growth rate."
  *   **Flag:** *Practically Indistinguishable from Leaf B.* The bet size looks the same, but Leaf B claims it's for accuracy, while Leaf C admits it's for comfort.

  **Leaf D: Full Kelly (The Purist)**
  *   **Position:** Bet size = Exact Kelly Criterion ($f^* = \frac{bp - q}{b}$).
  *   **Awkward Commitment:** "I accept that a 50% drawdown is a statistical certainty over a long enough horizon, and I promise not to quit or change sizing when it happens."

  **Leaf E: Cash-Flow Sizing (The Professional)**
  *   **Position:** Bet size based on fixed income needs, often < Kelly.
  *   **Awkward Commitment:** "I prioritize paying my rent today over maximizing my net worth in ten years, which technically means I am not maximizing growth."

  **Leaf F: Over-Kelly / Leverage (The Gambler)**
  *   **Position:** Bet size > Full Kelly.
  *   **Awkward Commitment:** "I believe I can outperform the mathematical limit of logarithmic growth without increasing my risk of ruin to 100%."
  *   **Flag:** *Mathematically Incoherent for Long-Term Growth.* If your utility is Log-Wealth, betting over-Kelly reduces your expected growth rate and increases ruin risk. Only coherent if you have a convex utility function (you love risk more than return).

  ---

  ### Clarifying the "Full vs. Fractional" Debate

  You asked specifically where the split lives between the "Full Kelly is optimal" crowd and the "Fractional is robust" crowd. The tree isolates this at **Node 2 (Parameter Certainty)**.

  **The Math of the Disagreement:**
  1.  **Full Kelly Proponents** assume $p_{estimated} = p_{true}$. Under this assumption, any fraction less than 1.0 reduces your expected geometric growth rate. They are mathematically correct *if* you know the true probabilities.
  2.  **Fractional Kelly Proponents** assume $p_{estimated}$ is a random variable with variance. When you maximize $E[\log W]$ over a *distribution* of possible edges (Bayesian Kelly), the optimal bet size is naturally smaller than the Kelly calculated on the mean edge.

  **The Crisp Distinction:**
  *   **Full Kelly** is the optimal solution for **known** probabilities.
  *   **Fractional Kelly** is the optimal solution for **uncertain** probabilities.

  When Full Kelly advocates call Fractional Kelly "cowardice," they are assuming you know your edge precisely. When Fractional advocates call Full Kelly "insane," they are assuming you *don't*. In sports betting, where $p$ is never known (unlike a casino game with fixed odds), **Leaf B (Fractional/Bayesian)** is the only position that is both mathematically sound and practically survivable.

  **Why Leaf B and Leaf C are Indistinguishable:**
  Whether you shrink your bet because you fear your model is wrong (Leaf B) or because you fear the volatility (Leaf C), the result is the same: you bet less than the theoretical maximum. Most successful long-term bettors end up at Leaf B but use the language of Leaf C to explain it to themselves, because "I'm not sure I'm right" is harder to stomach than "I'm just risk-averse."
