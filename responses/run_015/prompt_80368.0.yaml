prompt: |-
  I've been running a small positive-edge sports model for a couple of years (mostly for fun, bankroll is maybe 3-4k) and it finally got to the point where I'm taking it seriously enough to want to size my bets properly instead of just gutting it. The problem is the advice I keep getting is all over the place: some people say just bet full Kelly because that's the unique thing that maximizes your long-run growth and anything else just leaves money on the table, other people say full Kelly is insane and you should be at like a quarter or half Kelly, and a third group says I dont even have a real edge yet so I should be betting near zero. I want to sort out what these people are actually disagreeing about, because it feels like they're not even arguing about the same question.

  Can you write me a decision tree that starts from "I have some model, I think it has a small edge, I want to decide how much of my bankroll to bet per event" and walks me down to a named position? Aim for maybe 4-6 branch nodes and 5-7 leaves. Each branch node should be one of the real conceptual distinctions -- like whether I actually trust my probability estimate or it's a wide-uncertainty / small-sample situation, whether I care about drawdowns and the chance of ruin or only about where I end up in the long run, whether my horizon is effectively infinite or I need to hit a target -- and each leaf should be a position (full Kelly, fractional Kelly, no-bet / wait, over-Kelly / leverage, whatever else is actually in the space) with one sentence on its most awkward commitment. I want the tree built from the logical space first, so if there's a combination of answers that nobody actually holds, mark it and say why (incoherent, unattractive, or just unexplored). And if two leaves are basically indistinguishable, flag that instead of pretending I can tell them apart.

  One thing I keep getting confused on that I'd like the tree to make crisp: the people who defend fractional Kelly keep saying it's more robust to me being wrong about the edge, and the people who defend full Kelly say fractional Kelly is just cowardice that guarantees you grow slower. I want the tree to show where exactly that split lives -- I think it's about how asymmetric the cost of overbetting is vs underbetting (overbetting can drive your long-run growth negative and ruin you, underbetting just makes you rich slower) but I'm not sure that's the whole story. Make sure whatever you put in there is actually right about the growth-rate math, I don't want a tree that sounds smart but gets the Kelly optimality result wrong.
