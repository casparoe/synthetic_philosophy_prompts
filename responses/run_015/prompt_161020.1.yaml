  **TO:** Steering Committee, Project H Replication
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Primary Analysis Plan

  Colleagues,

  Following our review of the three proposed analysis frameworks, I recommend we adopt **Proposal (a): The Pre-registered Equivalence Test** as our primary analysis.

  **Primary Analysis Specification**
  We will define a Smallest Effect Size of Interest (SESOI) of *d* = 0.20, based on the lower bound of practical significance for priming effects in applied settings. Using a two-one-sided test (TOST) procedure with $\alpha$ = 0.05, we will test whether the observed meta-analytic effect size falls within the equivalence bounds of [-0.20, +0.20].

  *   **Computed:** Meta-analytic effect size (random-effects) with 90% confidence intervals against equivalence bounds.
  *   **Reported Units:** Standardized mean difference (*d*) with 90% CI.
  *   **Headline Permissions:** The abstract must state one of three calibrated verdicts: "statistically smaller than the SESOI," "statistically indistinguishable from the original estimate," or "inconclusive."
  *   **Prohibited Language:** We are not permitted to claim "the effect does not exist" or "the theory is false." The verdict concerns the magnitude relative to the SESOI, not ontological truth.

  **Fate of Alternative Proposals**
  Proposals (b) and (c) will be retained as **Secondary Sensitivity Analyses**.
  *   **Proposal (b) (Bayes Factor):** Will be reported in the supplementary materials using a default Cauchy prior (r = 0.707) with a robustness curve across scales (r = 0.5 to 1.0). This provides continuous evidence metrics for Bayesian readers without compromising the error-controlled primary verdict.
  *   **Proposal (c) (Disagreement-Reduction):** Will be included as an exploratory sociological analysis. We will compute the posterior convergence for the specified "enthusiast" and "skeptic" priors, but this will be labelled explicitly as "Illustrative Belief Updating" rather than evidential weight.

  **The Case for Proposal (c)**
  I want to acknowledge the strength of the argument for Proposal (c), which I initially favored. Its defenders argue that science is fundamentally a communal process of belief updating, not a binary switch. In a polarized field, a verdict that ignores prior convictions is sociologically inert. If a study leaves both camps entrenched, it has failed functionally, regardless of its *p*-value. Proposal (c) uniquely quantifies the *utility* of the data in resolving human disagreement, ensuring the replication serves the field's actual needs rather than an abstract frequency standard. It treats the replication as an intervention on the literature's state of mind, not just a measurement of nature.

  **The "Hidden Moderator" Defense**
  Regarding the original authors' expectation that we omitted essential features: We will adopt the **Pre-Registration Boundary Rule**. The burden of proof shifts to the original authors only if the purported moderator was explicitly identified as a theoretical boundary condition in the original publication or pre-registered materials *prior* to this replication attempt. If the moderator is proposed post-hoc to explain null results, it is classified as an unfalsifiable escape hatch. In such cases, the replication stands as a valid test of the original published claim, and the burden shifts to the original authors to empirically demonstrate the moderator in a new, pre-registered study.

  **Conclusion**
  While Proposal (c) offers profound insight into scientific consensus, Proposal (a) provides the objective error control necessary for a definitive community record. By anchoring our headline to a calibrated verdict, we protect the project from accusations of prior-stacking while allowing secondary analyses to inform belief updating.

  Please review this plan by Wednesday. I look forward to finalizing this on Thursday.
