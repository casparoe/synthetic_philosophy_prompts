      *   The argument mirrors Daniel Dennett's "Competence without Comprehension" but pushes it to an eliminativist conclusion that the user finds untenable.
      *   The leak is almost certainly in the definition of "comprehension" and the move from *origin* (etiology) to *constitution* (ontology).

