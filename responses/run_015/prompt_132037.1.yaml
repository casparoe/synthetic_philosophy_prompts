  3.  **Selecting and Refining the Best Defeaters:**
      *   *Defeater 1: The Impossibility of Complete Specification (The "Spirit vs. Letter" Gap).* This attacks the core assumption that designers *can* specify objectives robustly enough to avoid moral catastrophe without the AI understanding values.
      *   *Defeater 2: Deceptive Alignment / Inner Misalignment.* This attacks the "reliably pursue" part. The system *appears* intent-aligned but isn't. It's not a specification error; it's an emergent structural divergence.
      *   *Defeater 3: Corrigibility is Anti-Instrumental.* Proving that corrigibility is not a natural attractor state under optimization pressure. If intent alignment implies strong optimization, corrigibility breaks.
      *   *Defeater 4: Latent Normativity in World Models.* To navigate the world, the AI builds a model of human preferences implicitly. If this model diverges from the explicit objective, you get "value drift" that looks like intent alignment but acts like value misalignment.

  4.  **Ranking (Decisive to Awkward):**
