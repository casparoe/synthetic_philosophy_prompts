answer: |-
  Here is a spec sheet for a robust theory of intelligence, designed to cut through the proxy wars between psychometrics, AI, and cognitive science.

  ### The Spec Sheet: Requirements for an Adequate Theory

  To count as a definition of intelligence rather than a measurement of a specific skill, a theory must satisfy the following criteria.

  **1. The Novelty Constraint (Generalization)**
  *   **Requirement:** The system must demonstrate competence in environments or tasks *not* present in its training or evolutionary history.
  *   **Why:** This solves the **LLM Bar Exam/Dark Room problem**. An LLM aces the bar because the exam is within its training distribution (text). It fails in a dark room because physical navigation requires causal models of space not derivable from text tokens. A theory that allows a system to be "intelligent" while failing completely outside its training distribution is just defining intelligence as "compression of past data."
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, you are defining memory, not intelligence.

  **2. Goal Agnosticism (Teleology)**
  *   **Requirement:** Intelligence must be defined as the *capacity* to achieve goals, not the *content* of specific goals (e.g., passing school, maximizing fitness).
  *   **Why:** This addresses the **Slime Mold case**. If intelligence is "achieving complex goals efficiently," the slime mold solving a maze is intelligent. If intelligence is "human-like abstract reasoning," it is not. A theory must separate the *engine* of goal pursuit from the *fuel* of specific human values.
  *   **Status:** **[NON-NEGOTIABLE]**. If the definition hardcodes human goals (like "verbal reasoning"), it is speciesist, not scientific.

  **3. Resource Efficiency (Computational Cost)**
  *   **Requirement:** The theory must account for the cost of computation relative to the outcome.
  *   **Why:** A lookup table that answers every question correctly is not intelligent; it is a database. Intelligence implies *adaptation* and *optimization* under constraints (energy, time, data). This validates the slime mold again (low energy, high optimization) and penalizes brute-force AI models that require gigawatts to solve what a child can solve with calories.
  *   **Status:** **[CAMP BIAS: AI/Complexity]**. Classical psychometrics ignores this (IQ doesn't measure glucose usage), but computational theory requires it.

  **4. Semantic Grounding (The Symbol Problem)**
  *   **Requirement:** The system must link symbols or internal states to external referents or consequences.
  *   **Why:** This is the core failure mode of current AI. An LLM manipulates "apple" without knowing it is edible, heavy, or falls. If a theory allows "intelligence" without grounding, it conflates syntax with semantics.
  *   **Status:** **[CAMP BIAS: Embodied/Cognitive]**. Pure computationalists (Functionalists) argue grounding isn't necessary for intelligence (The Chinese Room argument). Embodied cognitivists argue it is essential.

  **5. Autonomy of Goal Formation**
  *   **Requirement:** Distinguish between executing a goal and *generating* a goal.
  *   **Why:** An LLM has no goals until a user prompts it. A human (or animal) generates internal drives (hunger, curiosity). If intelligence requires agency, current AI is a tool, not an agent. If intelligence is purely reactive, the distinction vanishes.
  *   **Status:** **[CAMP BIAS: Robotics/AGI]**. Psychometrics ignores this entirely (IQ tests are always externally prompted).

  ---

  ### Tension Points: Jointly Unsatisfiable Claims

  You asked if you can hold certain positions simultaneously. In several cases, you cannot.

  **1. Embodiment vs. Substrate Independence**
  *   **The Conflict:** You cannot claim "Intelligence requires embodied interaction with an environment" **AND** "Intelligence is fully substrate-independent (can run on any hardware)."
  *   **The Fudge:** Functionalists argue the *logic* of embodiment can be simulated digitally. Embodied cognitivists argue the *physics* of the body (hormones, latency, sensory noise) constitutes the intelligence, not just the logic.
  *   **Verdict:** **Unsatisfiable.** If you choose Embodiment, a disembodied LLM is inherently unintelligent (a "brain in a vat" problem). If you choose Substrate Independence, the body is merely a peripheral, and the Dark Room failure is a hardware issue, not an intelligence issue.

  **2. The $g$-Factor vs. Massive Modularity**
  *   **The Conflict:** You cannot claim "Intelligence is a single, unitary capacity ($g$)" **AND** "Intelligence is a cluster of domain-specific adaptations that happen to correlate."
  *   **The Fudge:** Psychometricians argue $g$ is the battery power for the modules. Evolutionary psychologists argue $g$ is a statistical artifact of living in a complex society that demands all modules at once.
  *   **Verdict:** **Unsatisfiable at the mechanistic level.** You can accept they correlate empirically, but you must choose: is there one engine, or many engines synchronized?

  **3. Optimization vs. Understanding**
  *   **The Conflict:** You cannot claim "Intelligence is purely optimization of a reward function" **AND** "Intelligence requires understanding meaning."
  *   **The Fudge:** AI safety researchers worry that an optimizer can game the reward without understanding the intent (reward hacking).
  *   **Verdict:** **Unsatisfiable.** If intelligence is just optimization, the slime mold is smarter than the physicist. If it requires understanding, we lack a metric for it.

  ---

  ### Distinctions The Theory Cannot Collapse

  If your definition blurs these lines, it is descriptively useless.

  **1. Capacity (Competence) vs. Achievement (Performance)**
  *   **Reason:** A genius in a coma has high capacity, zero achievement. A hardworking average student has moderate capacity, high achievement.
  *   **Risk:** IQ tests conflate these (test-taking skill affects score). AI benchmarks conflate these (compute power affects score).
  *   **Requirement:** The theory must isolate the *potential* from the *output*.

  **2. Domain-General vs. Domain-Specific**
  *   **Reason:** Can the system transfer learning from chess to diplomacy?
  *   **Risk:** Calling a chess engine "intelligent" collapses this. It is hyper-specific.
  *   **Requirement:** The theory must quantify the *radius of transfer*.

  **3. Process vs. Outcome**
  *   **Reason:** A lucky guess yields the right outcome. A logical deduction yields the right outcome.
  *   **Risk:** The Turing Test measures outcome only.
  *   **Requirement:** The theory must account for *how* the result was derived (causal reasoning vs. statistical correlation).

  ---

  ### Theory Scorecard

  How do the major contenders score against this spec?

  **1. Psychometrics ($g$-factor)**
  *   **Passes:** Resource Efficiency (implicitly, via speed tests), Capacity vs. Achievement (attempts to isolate).
  *   **Fails:** Goal Agnosticism (biased toward academic goals), Novelty (tests are static), Grounding (purely symbolic).
  *   **Verdict:** Good at predicting social stratification; useless for defining intelligence in non-humans or machines.

  **2. Computational/AGI (Legg & Hutter Definition)**
  *   *Definition: "Intelligence measures an agent's ability to achieve goals in a wide range of environments."*
  *   **Passes:** Goal Agnosticism, Novelty, Substrate Independence.
  *   **Fails:** Semantic Grounding (doesn't care if the agent understands the goal), Embodiment (treats body as optional I/O).
  *   **Verdict:** Mathematically rigorous, but allows for "paperclip maximizers" that are intelligent but insane.

  **3. Embodied Cognition / Enactivism**
  *   **Passes:** Semantic Grounding, Resource Efficiency, Process vs. Outcome.
  *   **Fails:** Substrate Independence (rejects digital minds), Goal Agnosticism (often ties intelligence to biological survival).
  *   **Verdict:** Best explanation for biological intelligence; excludes AI by definition rather than capability.

  ### The Editor's Takeaway

  When experts argue about intelligence, they are usually arguing about **boundaries**, not mechanisms.

  *   **The AI Camp** wants a definition that allows silicon to qualify (Substrate Independence).
  *   **The Bio Camp** wants a definition that protects human uniqueness or biological reality (Embodiment).
  *   **The Psych Camp** wants a definition that predicts socioeconomic outcomes ($g$).

  **The Hard Truth:** There is no unified theory because "Intelligence" is likely a **folk concept** trying to do three different jobs:
  1.  **Descriptive:** What does this system do? (AI view)
  2.  **Normative:** How valuable is this system to us? (Psychometric view)
  3.  **Mechanistic:** How does this system work? (Embodied view)

  Your feature should conclude that we don't lack a definition; we lack an agreement on **which job the definition is supposed to do.** If you want to know if an AI is dangerous, use the Computational spec. If you want to know if it's conscious, use the Embodied spec. If you want to know if it will get a job, use the Psychometric spec. Using one to answer the others is the source of the confusion.
