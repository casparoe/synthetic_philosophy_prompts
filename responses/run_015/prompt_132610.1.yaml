answer: |-
  ### The sneaky assumption
  The idea that Europe holds the monopoly on the "true" definition of liberalism ignores that political language evolves differently across contexts. There is no single, frozen-in-amber version of liberalism that Europeans preserved while Americans corrupted it. Both regions adapted the term to fit their specific historical battles over the role of the state.

  ### How both sides actually drifted
  In the US, the New Deal coalition redefined liberalism to mean using state power to secure individual freedom against economic hardship, distinguishing themselves from laissez-faire conservatives. Meanwhile, European parties labeled "liberal" often positioned themselves against both socialists and conservatives, cementing a pro-market identity to carve out a distinct niche. This divergence wasn't theft, but rather parallel evolutions where the same root philosophy branched differently based on local opponents. American liberals focused on positive liberty (freedom to), while many European liberals doubled down on negative liberty (freedom from). Consequently, both usages are authentic to their own political ecosystems rather than one being a counterfeit.

  ### The scandinavian/ordoliberal wrinkle
  Even within Europe, the label is far from consistent, as Scandinavian liberal parties often support robust welfare states alongside market economies. German ordoliberalism further complicates the picture by advocating for a strong state framework to ensure market competition, blending intervention with free-market principles. This means assuming all European liberals are purely pro-market libertarians ignores the significant social-liberal traditions present on the continent. The European map is a mosaic, not a monolith of classical liberalism.

  ### Bottom line
  Asking who owns the word misses the point that political labels are tools for coalition-building rather than precise philosophical categories. It is more useful to examine specific policies than to argue over who gets to claim the title of liberal.
