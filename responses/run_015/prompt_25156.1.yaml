      *(Self-Correction during drafting)*: Make sure the scenario doesn't accidentally imply Sarah caused the breakdown. Explicitly state she is a stranger passing by. Ensure Leo is legally an adult or close enough that "incompetence" due to age isn't the obvious out (user is a junior, so Leo can be a senior or recent grad). Let's make Leo 18 to avoid the "minor" incompetence trap.

      *(Refining the Coercion Rebuttal)*: A common counter-argument is "Circumstantial Coercion." I need to explain why the triad defender usually rejects this. The triad focuses on *agent-relative* constraints (what *this* person did), not *agent-neutral* circumstances.

      *(Final Polish)*: Ensure the tone is encouraging but rigorous.

