      *   *Initial thought:* Maybe focus heavily on utilitarianism.
      *   *Correction:* No, the user is proposing a deontological/ontological split. Focus on the *boundary conditions* of that split.
      *   *Initial thought:* Cite Parfit.
      *   *Correction:* No citations allowed. Describe the argument ("The Harmless Torturers") without naming the book/author.
      *   *Focus:* Ensure the distinction between "statistical" and "directed" is the main battleground.

  10. **Final Polish:** Ensure the distinction between "awkward" (requires tweaking) and "damaging" (requires abandonment) is clear. (Proceed to generate output).

  *(Self-Correction Note on "Decisiveness"):* I need to make sure I don't just list arguments but evaluate *why* one is more decisive than another for *this specific view*. The Sorites/Continuity argument is usually the killer for ontological binaries. The Collective Agency argument is the killer for the "distributed = statistical" claim. I will rank Continuity/Threshold highest because it attacks the coherence of the categories themselves.

  *(Refining the Unfalsifiability section):* I need to explicitly state that if the view defines "deontic" in a way that excludes all distributed harms by fiat, it's tautological. If it allows *some* distributed harms to be deontic (e.g., genocide via bureaucracy), it must explain why dust-specks aren't that. If it can't, the distinction collapses.

  *(Final Plan):*
  1. Intro: Validate the position's novelty.
  2. Tier 1: Conceptual/Structural Defeaters (Sorites, Continuity).
  3. Tier 2: Agency/Relational Defeaters (Collective Action, Institutional Intent).
  4. Tier 3: Formal/Decision Theoretic Defeaters (Money Pumps, Cyclical Preferences).
