answer: |-
  1. "The explanandum"
  The question "Why Britain and not China?" is ill-posed because it compares political units rather than economic regions, violating Given (d). Britain is a polity; China is a continent-scale empire. The true puzzle, consistent with Given (a) and (b), is not why a nation industrialized, but why the transition from Malthusian stagnation to sustained per-capita growth occurred in Northwestern Europe rather than the Lower Yangzi Delta circa 1750. Both regions shared high commercialization, skilled labor, and state capacity. Therefore, the explanandum must be reformulated: What specific conjuncture allowed Northwestern Europe to bypass ecological constraints and mechanize production using fossil fuels at that specific moment, while the Lower Yangzi, despite comparable development, did not? Any answer treating "China" as a monolith or "Britain" as representative of Europe fails the basic geographic logic of the divergence.

  2. "The desiderata"
  1. **Regional Symmetry** (Non-negotiable): Comparisons must match economic regions, not states. This excludes answers relying on "British national policy" unless matched against specific Qing provincial governance. It addresses Given (d) by ensuring units are comparable in scale and internal variety.
  2. **Timing Precision** (Non-negotiable): The cause must emerge or activate late in the eighteenth century. This excludes deep institutional or cultural causes (e.g., Protestantism, common law) that existed centuries prior without triggering growth. It forces alignment with Given (a)'s late divergence date.
  3. **Counterfactual Robustness** (Non-negotiable): The cause must be absent in other advanced regions (Netherlands, Jiangnan, Gujarat). This consolidates the user's "swap" and "intra-European" tests. It excludes factors like "high wages" or "colonies" if present elsewhere without industrialization.
  4. **Mechanism Specificity** (Non-negotiable): The answer must trace prices or incentives to specific investment decisions. This excludes correlational claims (e.g., "science caused growth") without detailing how knowledge became profitable technology. It demands a micro-level pathway.
  5. **Falsifiability** (Non-negotiable): The author must specify evidence that would disprove the claim. This excludes unfalsifiable cultural essences or functionalist arguments where every outcome is explained post-hoc. It ensures empirical accountability.
  6. **Definition Integrity** (Non-negotiable): The outcome cannot be defined by the winner's features. This excludes defining "development" as "industrialization," which makes the divergence tautological. It ensures the puzzle is independent of the solution.
  7. **Microfoundations** (Camp Preference): Neoclassical camps demand household/firm decision models; Structuralists allow aggregate constraints. Insisting on this excludes ecological windfall arguments where agents react to luck rather than optimize. It marks a divide between methodological individualists and materialists.

  3. "Where the desiderata collide"
  The desiderata cannot be jointly satisfied by monocausal theories. The sharpest collision occurs between **Timing Precision** and **Deep Institutional Causes**. If institutions (property rights, rule of law) caused the break, they should have triggered growth when they emerged (e.g., Glorious Revolution or Song Dynasty), not a century later. Satisfying Timing requires treating institutions as permissive background conditions, not triggers, which weakens Institutionalist claims. Secondly, **Microfoundations** collides with **Ecological Windfalls**. If the break relied on contingent coal access (Given b), rational choice models struggle to explain why agents didn't substitute elsewhere earlier. Finally, **Regional Symmetry** conflicts with Given (d)'s political framing; data is often aggregated by state, forcing scholars to either misuse statistics or reconstruct regional data painstakingly.

  The single requirement knocking out the most answers is **Timing Precision**. It eliminates most cultural, institutional, and genetic explanations because those variables changed too slowly to explain a sudden late-eighteenth-century spike. This forces adequate answers to be conjunctural: admitting that necessary conditions existed earlier, but sufficient conditions only aligned briefly in Northwestern Europe. The list implies no single-factor answer is available; only hedged, multi-causal formulations survive.

  4. "Scorecard"
  | Argument Family | Most Damaging Failure |
  | :--- | :--- |
  | **Coal-and-Colonies** (Ecological) | **Counterfactual Robustness:** Spain had colonies and coal access but no industrial break; requires explaining why access alone didn't suffice. |
  | **Institutions-and-Rights** (North/Acemoglu) | **Timing Precision:** Secure property rights existed in England by 1700 and China during Song; fails to explain the 1750+ lag. |
  | **Culture-and-Religion** (Weber/Mokyr) | **Regional Symmetry:** Scientific cultures existed in Jiangnan; fails to explain why culture translated to machines only in Europe. |
  | **High-Level-Equilibrium** (Elvin) | **Mechanism Specificity:** Fails to explain why high labor costs didn't induce labor-saving mechanization as per standard price theory. |
  | **Revisionist** (Late Date Focus) | **Definition Integrity:** Often describes the divergence rather than explaining the causal shift, risking tautology. |

  The table shows every dominant family fails at least one non-negotiable test. The Ecological line survives Timing best but struggles with Counterfactuals. Institutionalists survive Mechanism but fail Timing. This confirms the necessity of conjunctural answers.

  5. "My rubric"
  An adequate explanation must identify a conjunctural mechanism specific to Northwestern Europe and the Lower Yangzi that accounts for the late eighteenth-century timing of the fossil-fuel break while surviving counterfactual scrutiny against other advanced regions.
