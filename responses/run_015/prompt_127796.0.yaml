  ### The Case: The Linguistic Coordination Problem

  **Agents:** **Kofi** and **Lena**.
  **Context:** Kofi and Lena are the first two settlers in a new, isolated community. To establish a functioning public square, they must agree on a single language for all official business, signage, and dispute resolution. Kofi speaks only Language A; Lena speaks only Language B. Both languages are equally complex, and both agents are equally proficient in their respective tongues.
  **The Good:** **Communicative Agency in the Public Sphere.** This is the effective capacity to speak, be understood, and participate in the collective decision-making of the community without mediation.

  **The Interdependence:**
  Kofi's possession of this good is not fixed by his internal endowments (he has a voice, he has a language, he has the cognitive capacity). Nor is it fixed by his resources (he has the time and tools to speak). His communicative agency *ontologically depends* on Lena's choice. If Lena adopts Language A, Kofi possesses full communicative agency. If Lena adopts Language B, Kofi's agency in the public sphere drops to zero, regardless of his internal states. Crucially, this is not a matter of Kofi's *preferences* (welfare) changing; it is a matter of the *option itself* existing or vanishing based on Lena's action. It is not a market price effect (Resource Equality); it is not a matter of Kofi having "expensive tastes" for Language A (Welfare); and it is not a bodily impairment converting resources poorly (Capabilities/Disability). It is a **constitutive interdependence**: the good *is* the relation.

  ### Evaluation of the Three Currencies

  **1. Resource Egalitarianism (e.g., Dworkin)**
  Resource equality struggles here because the "resource" cannot be divided or assigned individually. You cannot give Kofi "half a common language." A resource egalitarian might try to auction the right to choose the language, compensating the loser with external resources (money, land). But this fails to equalize the *specific good* in question (communicative agency). The loser ends up with more land but less political voice. The metric of "resources held per person" breaks down because the value of the resource (the chosen language) is determined by the *distribution pattern itself*, not the individual holding.

  **2. Welfare Egalitarianism**
  Welfare egalitarianism treats this as a satisfaction problem. If Lena chooses Language B, Kofi suffers frustration. The view suggests compensating Kofi with other sources of utility to bring his welfare back up to Lena's level. But this misidentifies the injustice. The problem isn't that Kofi is unhappy; it's that he is *subordinated*. He must speak a foreign tongue or remain silent. Equalizing welfare masks the loss of agency by trading it off against other pleasures. It treats a structural exclusion as a subjective deficit.

  **3. Capability Egalitarianism (e.g., Sen/Nussbaum)**
  Capabilities comes closest. It focuses on "effective freedom" rather than resources or feelings. A capability theorist would identify that Kofi lacks the *social basis* for the capability of "affiliation" or "political control." However, standard capability metrics still attempt to assign a "capability set" to Kofi *individually*. They must describe Kofi's set as "conditional on Lena's choice." This stretches the person-by-person metric. While it identifies the right loss (freedom, not utility), it still tries to measure a relational reality as an individual property.

  **Winner:** **Capabilities** handles it best, but only by stretching. It correctly identifies that the loss is one of *functioning* (participation) rather than utility or stuff. However, it is forced to treat a relational fact (Lena's choice) as a "social conversion factor" attached to Kofi's account, which obscures the fact that the good is jointly owned.

  ### The Site of Equality

  This case suggests that the three-way disagreement (Welfare vs. Resources vs. Capabilities) was partly a disagreement about the **site** of equality, not just the **currency**.

  All three views assume the site of justice is the *individual bundle* (of utility, goods, or freedoms). They assume we can assess justice by looking at Person A, then Person B, and comparing the numbers. The Linguistic Coordination case shows that some goods are **non-separable**. You cannot assess Kofi's justice-status without looking at the *link* between Kofi and Lena.

  If no metric can be assigned person-by-person, the traditional disagreement dissolves into a category error. Asking "Which currency should we equalize?" presupposes we are distributing distinct parcels to distinct people. When the good is constitutively relational, the question shifts from "Who has how much?" to "How are they standing to one another?"

  ### The Move to Relational Equality

  This example tempts us toward **Relational (or Democratic) Equality** (e.g., Anderson, Scheffler). What does this move buy?

  1.  **Ontological Fit:** Relational equality stops trying to measure the unmeasurable. It acknowledges that "status as an equal" is not a quantity you hold, but a pattern of interaction you inhabit. It doesn't try to compensate Kofi for the loss of language; it demands a structure where Kofi and Lena stand as peers.
  2.  **Focus on Power, Not Compensation:** Distributional views (Resources/Welfare/Capabilities) tend to be *ex post*: the language is chosen, Kofi loses, how do we compensate him? Relational equality is *ex ante*: it asks what decision-making procedure ensures neither is subordinate. It might demand a hybrid language, rotation, or a consensus rule that prevents the "winner take all" outcome.
  3.  **Dissolving the Metric Problem:** Relational equality abandons the search for a single metric of "advantage." It replaces the question "Is the distribution equal?" with "Are the relations hierarchical?" In the Kofi/Lena case, if Lena imposes her language, the relation is hierarchical (ruler/subject), regardless of how much land (resources) or happiness (welfare) Kofi retains.

  **Conclusion:** The Linguistic Coordination case shows that the "currency debate" presupposes a separability that does not always exist. When goods are networked or constitutively shared, the site of equality must shift from the individual's inventory to the structure of their interaction. Relational equality buys the conceptual space to address these interdependencies directly, rather than trying to simulate them through compensatory distributions to isolated agents.
