answer: |-
  # Q&A PREP SHEET: PROXY ASSERTION & DELEGATED NORMS

  **Talk:** Proxy Assertion & The Degeneracy of the Standard Case
  **Time:** 45 min talk + 20 min Q&A
  **Room:** 15 ppl (Testimony x2, Speech-Act, Formal x2, Legal, PoL, Political, Generalists)

  ---

  ## STRATEGIC ANCHORS

  *   **The Claim to Hold:** *The standard case (speaker = principal) is degenerate.* Do not let them talk you into treating proxy assertion as a rare exception. It is the structural norm; solo assertion is the limit case where delegation distance is zero.
  *   **The Weak Point to Volunteer:** *Individuation of the "Transmissible Store."* Bring this up yourself during the wrap-up. Say: "I know 'transmissible store' is metaphysically vague regarding implicature; I'm treating it as a functional role for now." This disarms the Philosopher of Language before they strike.
  *   **The Question to Fear:** *"If a corporation explicitly authorizes an LLM to issue statements on its behalf, does it become a proxy assertor?"*
      *   *Why:* It collapses your AI corollary. If delegation is purely contractual/authorization-based, an authorized bot fits your definition.
      *   *Pivot:* Insist on the **Scope-Tracking Condition**. A bot cannot "tell whether a proposition is within licensed scope" in the normative sense required to hedge/withdraw. It simulates scope-tracking but lacks the capacity to *fail* responsibly.

  ---

  ## OBJECTION 1: THE SPEECH-ACT THEORIST (Existential Threat)
  **Objection:** "You've described a reporting act, not an assertion. If S doesn't undertake a commitment to the *truth* of p, but only to the fact that P stands behind p, S isn't asserting p. You've changed the subject."
  **Reply Script:**
  *   Assertion is defined by presenting p as true to the audience, not necessarily by the speaker's personal warrant.
  *   In proxy cases, S presents p as true *for the purposes of the record*.
  *   The commitment is split: S commits to the *felicity of the transmission*; P commits to the *truth of the content*.
  *   This explains why we blame S for misrepresenting P, but blame P for lying.
  **Soft Spot:** Relies on a non-standard definition of assertion. Might look like verbal engineering.
  **Slide Concession:** "Acknowledges a split-commitment model of assertion requires further defense."

  ## OBJECTION 2: THE REDUCTIONIST TESTIMONY THEORIST (Theoretical Redundancy)
  **Objection:** "This is just ordinary testimony plus evidence about the speaker's role. The hearer needs evidence that S is a reliable proxy. You haven't found a new norm; you've just added intermediate premises to the reductionist account."
  **Reply Script:**
  *   Reductionism treats the role as *evidence* for reliability. I treat the role as the *source* of entitlement.
  *   If S is properly authorized, the hearer doesn't need independent evidence of P's reliability; the authorization transfers the warrant.
  *   Reductionism cannot explain why we accept proxy assertions from strangers (e.g., press secretaries) without checking their track record.
  **Soft Spot:** Assumes transfer of warrant is intuitive; reductionist will demand a mechanism.
  **Slide Concession:** "Leaves open the precise mechanism of warrant transfer between principal and proxy."

  ## OBJECTION 3: THE PHILOSOPHER OF LANGUAGE (Conceptual Vagueness)
  **Objection:** "What individuates a 'transmissible store'? Does it include implicatures? If P says 'It's raining' to S, can S assert 'The streets are wet' on P's behalf? Your content condition is too vague to do normative work."
  **Reply Script:**
  *   Agree that boundaries are fuzzy; that's why the **Scope-Tracking Condition** is crucial.
  *   The store isn't a set of sentences; it's a set of licensed moves.
  *   S is obligated to hedge if they move from explicit content to implicature.
  *   Vagueness here mirrors vagueness in ordinary assertion; it doesn't undermine the norm.
  **Soft Spot:** You are volunteering this weakness (see Strategic Anchors). Don't over-defend.
  **Slide Concession:** "Requires a finer-grained account of content individuation across paraphrase."

  ## OBJECTION 4: THE LEGAL EPISTEMOLOGIST (Practical Redundancy)
  **Objection:** "Agency law and hearsay exceptions already handle this. 'Apparent authority' covers your authorization condition; evidentiary rules cover the content. What philosophical work is left?"
  **Reply Script:**
  *   Law tracks liability; I'm tracking epistemic norms.
  *   You can be legally authorized but epistemically irresponsible (e.g., repeating rumors you know are false).
  *   My account explains the *normative failure* when legal authority exists but epistemic scope is breached.
  *   Philosophy explains why the law looks this way, not vice versa.
  **Soft Spot:** Risk of overlapping too much with legal doctrine without adding precision.
  **Slide Concession:** "Needs clearer distinction between legal authority and epistemic authorization."

  ## OBJECTION 5: THE ANTI-REDUCTIONIST TESTIMONY THEORIST (Normative Gap)
  **Objection:** "If the hearer has a default entitlement to believe S, where does that entitlement come from? You've posited a delegation, but why should I trust the delegation itself without evidence?"
  **Reply Script:**
  *   The entitlement comes from the institutional context, not the individual speaker.
  *   We have a default entitlement to trust institutional roles (like we trust traffic lights).
  *   The burden shifts to the principal to ensure the proxy is reliable.
  *   This preserves the anti-reductionist intuition but locates the default in the structure, not the person.
  **Soft Spot:** "Institutional context" is doing heavy lifting without definition.
  **Slide Concession:** "Must elaborate on the source of default entitlement in institutional settings."

  ## OBJECTION 6: THE FORMAL EPISTEMOLOGISTS (Methodological Challenge)
  **Objection:** "Why talk about norms and stores? This is just a calibration problem. If S is a proxy, the hearer should update credence based on P's reliability calibrated through S's transmission accuracy. Norms add nothing."
  **Reply Script:**
  *   Credences don't capture liability. If S lies about P's view, S is blameworthy even if the credence update was rational.
  *   Norms guide the *speaker's* action, not just the hearer's update.
  *   Expected accuracy doesn't tell S when they are *allowed* to speak; my norms do.
  **Soft Spot:** Dismissive of formal tools; might alienate the two formalists in the room.
  **Slide Concession:** "Compatible with formal modeling of reliability, but focuses on deontic constraints."

  ## OBJECTION 7: THE ANNOYED GENERALIST (Rhetorical/Structural)
  **Objection:** "You opened with language models and dropped them. If this is about AI, why spend 40 minutes on press secretaries? It feels like a bait-and-switch."
  **Reply Script:**
  *   The AI case is the *motivation*, not the *argument*.
  *   We can't understand the AI case until we understand human proxy assertion first.
  *   The paper establishes the human norm to show why AI fails to meet it.
  *   The corollary returns to AI explicitly in the conclusion.
  **Soft Spot:** It *was* a bit of a bait-and-switch. Acknowledge the structural gap.
  **Slide Concession:** "The AI application requires further development beyond the human baseline."

  ## OBJECTION 8: THE POLITICAL PHILOSOPHER (Scope/Power)
  **Objection:** "You treat authorization as neutral. But these roles are often coercive. Does your norm account for when a principal forces a proxy to assert something the proxy knows is false?"
  **Reply Script:**
  *   That violates the **Scope-Tracking Condition**.
  *   If S knows p is outside the truth-licensed store, S is obligated to withdraw.
  *   Coercion breaks the delegation; it becomes a forced statement, not a proxy assertion.
  *   My norm explains why the proxy is still epistemically compromised even if legally compelled.
  **Soft Spot:** Might underestimate the pressure on proxies (e.g., employees).
  **Slide Concession:** "Needs to address cases of coercive delegation and epistemic duress."

  ---

  ## FINAL SLIDE: LIMITATIONS & FUTURE WORK
  *(Aggregate the concessions above into these 3 bullets for the actual slide)*

  *   **Individuation:** Requires a finer-grained account of the "transmissible store" across paraphrase and implicature.
  *   **Warrant Transfer:** The precise mechanism of entitlement transfer from Principal to Proxy needs formalization.
  *   **AI Extension:** The application to non-human agents requires distinguishing simulation from delegated scope-tracking.

  ---

  ## ROOM MANAGEMENT NOTES
  *   **If the Speech-Act Theorist pushes hard:** Concede that "assertion" might be the wrong label if they insist, but hold that the *normative structure* remains the same. Don't die on the word "assertion."
  *   **If the Formalists tag-team:** Invite them to model the "Authorization Condition" as a prior probability constraint. Don't fight the math; fight the claim that math replaces norms.
  *   **If the AI Question comes up:** Stick to the **Scope-Tracking** limitation. A model cannot *know* it is out of scope. That is the hard line.
