answer: |-
  The collapse of FTX in late 2022 serves as a potent stress test for the institutional critique of Effective Altruism (EA). This critique posits that a singular focus on measurable outcomes—specifically the volume of charitable giving—can obscure the institutional processes, governance structures, and ethical constraints required to sustain those outcomes over time. By mapping the actors and decision-rules of the FTX ecosystem against this theoretical framework, one can discern where the critique offers a precise explanation of systemic failure and where it encounters limits, particularly regarding the moral psychology of agents who instrumentalise philanthropy.

  **The Decision-Rules of 'Earning to Give' in High-Risk Finance**

  To understand the institutional failure, one must first specify the decision-rules implied by 'earning to give' when transposed from conventional finance to a lightly regulated crypto exchange. In traditional 'earning to give' scenarios, an individual works in a high-paying sector, adheres to regulatory compliance, and donates a surplus of income. The implicit decision-rule is: *Maximise personal income within legal and professional norms to fund charitable transfers.*

  However, within the FTX architecture, involving Sam Bankman-Fried (SBF), Alameda Research, and the FTX Exchange, the decision-rule mutated. Given the volatility and leverage available in crypto, the rule became: *Maximise the expected value of the firm to maximise the expected value of future donations, regardless of tail risk.*

  This shift is critical. In a high-leverage environment, maximising expected value often necessitates taking risks that threaten the solvency of the institution. If the primary moral imperative is the donation (the output), the sustainability of the source (the input) becomes secondary, provided the collapse does not occur immediately. For SBF, the separation between Alameda Research (a hedge fund) and the FTX Exchange (a customer custodian) was theoretically absolute but operationally non-existent. The decision-rule effectively permitted the use of customer funds to plug trading losses at Alameda, justified by the belief that future profits would restore the balance before detection. This is an application of expected value maximisation that ignores ergodicity: the risk of ruin was treated as an acceptable variable rather than a hard constraint, because the moral weight was placed on the potential charitable upside rather than the fiduciary downside.

  **Measurability Bias and the Distraction from Governance**

  The institutional critique argues that EA's emphasis on quantifiable impact creates a bias towards metrics that are easy to count, such as dollars donated, over metrics that are difficult to quantify, such as risk management quality or board independence. The FTX episode validates this concern with high precision.

  The FTX Foundation and its grant-making recipients operated within an economy of visibility. Donation totals were public, immediate, and impressive. In contrast, the internal controls of the FTX Exchange were opaque, technical, and unglamorous. For the broader EA community and the public, the measurable flow of capital into pandemic preparedness, political lobbying, and AI safety research served as a proxy for the health of the underlying enterprise.

  This measurability bias systematically diverted attention from fiduciary structures. Audits, segregated accounts, and risk committees are 'negative' metrics; their success is defined by nothing happening. Donations are 'positive' metrics; their success is defined by visible activity. When the moral community prioritises the positive metric, it creates a perverse incentive for the agent to neglect the negative metrics. In the FTX case, the ease of measuring the $100 million pledged to disaster relief overshadowed the impossibility of verifying the solvency of the exchange backing it. The institutional critique correctly identifies that without a parallel framework for valuing institutional integrity, the quantification of good becomes a veil that hides the degradation of the mechanisms producing that good.

  **The Separation of Charitable Impact from Institutional Governance**

  A core tenet of the institutional critique is that charitable impact cannot be ethically isolated from the governance of the wealth-generating institution. FTX demonstrates the catastrophic cost of violating this principle. The actors involved—SBF, Alameda, FTX, and the Foundation—were treated by outsiders as distinct entities aligned by a benevolent mission. In reality, they were a single, commingled financial organism.

  The critique suggests that when governance is decoupled from giving, the giving becomes vulnerable to the pathologies of the source. FTX illustrates this through the 'reputation laundering' dynamic. The FTX Foundation's grants purchased legitimacy for the Exchange. Recipients of funds, often operating in underfunded sectors like global health or policy, faced a principal-agent problem: rejecting tainted money was costly to their own missions, creating a reluctance to scrutinise the donor's governance.

  Here, the mapping is tight. The institutional critique predicts that without strict firewalls, the moral capital generated by the Foundation will be used to subsidise the risk-taking of the Exchange. The 'good' done by the Foundation was leveraged to silence scrutiny of the Exchange. The collapse revealed that the charitable impact was not a surplus generated by success, but in many cases, a liability incurred to maintain the appearance of success. The separation was rhetorical, not structural.

  **Limits of the Critique: Optimisation vs. Deception**

  However, the FTX case also exposes where the institutional critique misdescribes or fails to anticipate the nature of the harm. The critique generally assumes a framework of *good faith optimisation gone wrong*. It posits that well-meaning agents, pressured to maximise impact, will neglect safeguards and inadvertently cause harm through negligence or recklessness.

  FTX complicates this by introducing *deliberate deception*. The commingling of funds was not merely a risk control failure; it was fraud. The institutional critique struggles to account for agents who do not merely neglect governance but actively dismantle it to facilitate theft. While the critique explains why the community failed to *notice* the governance gaps (due to measurability bias), it does not fully explain why the gaps existed in such an extreme form.

  If the harm arose solely from optimisation pressure, one would expect a gradual erosion of standards. Instead, the evidence suggests a binary state of deception: the systems were not just weak; they were designed to be opaque. This suggests a limit to the institutional critique's focus on structural incentives. It risks treating the agent as a passive product of the 'earning to give' framework, rather than an active architect of fraud who utilised the framework as a justification. The critique explains the blindness of the observers, but it is less effective at diagnosing the pathology of the agent when that agent is acting in bad faith.

  **The Conceptual Gap: Moral Psychology and Camouflage**

  This leads to a significant conceptual gap exposed by the episode: the moral psychology of agents who deploy charitable framing as institutional camouflage. The institutional critique focuses on the *structure* of EA (metrics, incentives, governance) but remains relatively silent on the *psychology* of the 'earner'.

  In the FTX case, the 'earning to give' narrative provided SBF with a potent reputational shield. It allowed for the construction of a persona where personal enrichment was sublimated into public good. The critique needs to account for the utility of this framing in attracting regulatory forbearance and public trust. When an agent frames their accumulation of power as a sacrifice for the greater good, it raises the epistemic cost for critics to challenge them. To question the business practices becomes to question the charitable mission.

  The episode reveals that measurability-focused impact assessment is dangerously insufficient when applied to high-risk, lightly regulated financial institutions because it lacks a theory of *integrity verification*. It assumes that if the output is good, the process is acceptable. FTX proves that in complex financial systems, the process *is* the product. If the governance is fraudulent, the donation is not 'effective'; it is a distribution of stolen assets. The conceptual gap lies in the failure to treat the *source* of funds as a primary object of moral evaluation, equal in weight to the *destination* of funds.

  **Conclusion**

  The collapse of FTX validates the institutional critique of Effective Altruism regarding measurability bias and the necessity of governance. It demonstrates that prioritising quantifiable donation totals can indeed blind a community to the fragility and corruption of the underlying wealth-generation engine. The decision-rules of 'earning to give', when applied to high-leverage environments without strict fiduciary constraints, incentivise existential risk-taking that threatens the very capacity to do good.

  However, the case also stretches the critique. The institutional critique is best suited to analysing systemic negligence and the unintended consequences of optimisation. It is less equipped to handle deliberate fraud masked by philanthropic rhetoric. The FTX episode reveals that the danger is not only that agents will optimise too hard for good outcomes, but that they will use the language of 'good outcomes' to camouflage predatory behaviour. Consequently, a robust institutional theory must move beyond measuring impact to auditing integrity, recognising that in high-risk finance, the sustainability of the institution is not merely a prerequisite for charity, but a moral imperative in itself. Without this, the measurement of good becomes a tool for the concealment of harm.
