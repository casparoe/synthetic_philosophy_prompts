answer: |-
  A Pearlian and a Lewisian walk into a causal model.

  The Pearlian says, "I'll test the cause. `do(X=1)`. I surgically cut the arrows into X."
  The Lewisian says, "I'll check the nearest world where X=1. To get there, I allow a miracle—a local law violation—right before X."

  The Pearlian tries to intervene on the Lewisian's world. He lines up the scalpel on the graph.
  But the miracle has already vaporized the edges.

  "I can't operate!" cries the Pearlian. "Your miracle violated the structural equations! The mechanisms aren't invariant!"
  The Lewisian shrugs. "You need a stable graph to cut. I just need a similar world to break."
  "So what's the causal effect?"
  "Undefined," says the Pearlian. "You can't `do()` on a miracle. The operator returns 'Law Not Found'."
  "And yet," says the Lewisian, "in my world, X happened."
  "Because the laws broke!"
  "Exactly. You fix the laws to change the variable. I break the laws to change the world."

  ***

  **Note on Liberties & Contested Readings:**
  The joke leans heavily on a sharp dichotomy that many philosophers of science blur. Specifically:
  1.  **Lewis's Miracles:** Lewis argues miracles are *local* and *minimal*—just enough to diverge from actuality before letting laws run again. The joke exaggerates this as "vaporizing edges," whereas Lewis might argue the laws hold *after* the miracle, preserving the graph for the Pearlian downstream.
  2.  **Pearl's Invariance:** Pearl's structural causal models assume mechanisms are invariant under intervention. The joke assumes a Lewisian miracle counts as a violation of those mechanisms themselves, rather than just an exogenous shock. Some structuralists argue `do()` *is* the formalization of the "miracle," making them compatible rather than contradictory.
  3.  **Compatibility:** Modern accounts (like Halpern & Pearl) often use structural equations to *define* counterfactuals, effectively swallowing Lewis's account. The joke treats them as incompatible operational modes rather than competing formalizations of the same intuition.

  **What Would Change My Mind:**
  If it were demonstrated that Lewis's "miracle" can be fully modeled as an exogenous variable within a Structural Causal Model (SCM) without violating the structural equations themselves. If the miracle is just a specific value of an error term ($U$) rather than a law-violation, then the Pearlian *could* surgically intervene on that node without the graph collapsing. The punchline relies on the miracle being ontologically distinct from a structural intervention; if they are mathematically equivalent, the Pearlian's scalpel would work fine, and the joke fails.
