  **Adversarial Collaboration: Bad Faith vs. Misperception**

  **1. Agreed Claims**
  Both camps endorse the following empirical and normative claims without reservation:

  1.  Platform algorithms prioritise engagement metrics, which systematically correlate with outrage and conflict.
  2.  Users predominantly encounter out-group arguments via curated screenshots stripped of qualifying context.
  3.  In-group status is frequently rewarded for rhetorical aggression rather than epistemic accuracy.
  4.  Echo chambers restrict the flow of corrective information from outside the immediate social cluster.
  5.  Distinguishing between sincerely held belief and social conformity is difficult for external observers.
  6.  Performative extremism exists across the political spectrum and is incentivised by visibility.
  7.  Context collapse on social media strips arguments of their localising conditions, altering their meaning.
  8.  Current discourse quality is suboptimal for truth-tracking compared to idealised deliberative conditions.
  9.  Incentives exist for specific actors to deliberately provoke opposition to gain visibility.
  10. Trust deficits reduce the likelihood of belief updating even when presented with credible evidence.

  **2. Disagreements Table**
  Where the camps diverge, each statement is phrased to be acceptable to the proponent.

  *   **Prevalence of Strategic Argument**
      *   *Realist:* A non-trivial slice of out-partisan argument is consciously strategic, aimed at status rather than truth.
      *   *Theorist:* The perception of strategic argument exceeds the reality; most actors believe they are truth-seeking.
  *   **Default Epistemic Stance**
      *   *Realist:* Treating every opponent as a sincere truth-seeker is an epistemic error with predictable costs.
      *   *Theorist:* Assuming good faith is the correct default, even if it occasionally leaves one vulnerable to manipulation.
  *   **Primary Driver of Polarisation**
      *   *Realist:* The dynamic is driven by actors exploiting the medium for strategic gain.
      *   *Theorist:* The dynamic is driven by the medium structuring perception such that gain looks like malice.

  **3. Cruxes**
  For each crux, we specify the sub-question, stakes, test design, and divergent predictions.

  *   **The Medium Crux (Chaperone Protocol)**
      *   *Sub-question:* Is signalling behaviour intrinsic to the actors or elicited by the unmoderated medium?
      *   *Stakes:* If symmetric, the problem is structural; if asymmetric, it is cultural.
      *   *Test:* Independent, randomly assigned non-partisan chaperones flag sentences doing signalling work rather than claim-making work in real time, asking speakers to redo them as claims.
      *   *Predictions:* Realists predict flagging will cluster asymmetrically across camps. Theorists predict symmetric flagging with perceived asymmetry collapsing.
  *   **The Detection Crux (Swap Forum)**
      *   *Sub-question:* Can participants accurately discern sincerity in out-group members?
      *   *Stakes:* Determines if bad faith is opaque or simply misidentified.
      *   *Test:* Participants write and defend the strongest version of the other camp's position before an audience from that camp, scored on whether the audience identifies which defenders were sincere.
      *   *Predictions:* Realists predict low detection accuracy for out-group sincerity. Theorists predict high accuracy once context is restored.
  *   **The Error-Cost Crux**
      *   *Sub-question:* How are false-positive and false-negative attributions of bad faith weighted?
      *   *Stakes:* Dictates the normative default (skepticism vs. charity).
      *   *Test:* Modelling exercise weighing the cost of exploitable trust against the cost of discarded truth.
      *   *Predictions:* Realists argue false negatives (missing bad faith) are more expensive due to exploitation. Theorists argue false positives (accusing sincerely) are more expensive due to discourse collapse.
  *   **The Exit-Cost Crux**
      *   *Sub-question:* Is echo chamber cohesion chosen or imposed?
      *   *Stakes:* If imposed, 'bad faith' may be a survival strategy rather than a vice.
      *   *Test:* Survey measuring professional and social risk of adopting out-group views versus preference for insularity.
      *   *Predictions:* Realists predict cohesion is largely preferential. Theorists predict cohesion is largely imposed by testimonial exclusion.
  *   **The Remediation Crux (Draft Addition)**
      *   *Sub-question:* Does publicly attributing bad faith reduce its frequency or entrench it?
      *   *Stakes:* Determines whether calling out bad faith is a solution or a accelerant.
      *   *Test:* Longitudinal observation of communities where bad faith attribution is normatively encouraged versus discouraged.
      *   *Predictions:* Realists predict attribution reduces frequency by raising costs. Theorists predict attribution entrenches behaviour by validating victimhood.

  **4. Verbal Disputes**
  A significant portion of the quarrel is semantic rather than substantive. Specifically, the definition of "bad faith" is unstable. Realists often include unconscious motivated reasoning under the label, whereas Theorists reserve it for conscious deceit. If "bad faith" is defined as *any* reasoning influenced by social incentives, the Realist wins by definition but loses practical utility. If defined as *conscious* lying, the Theorist wins on prevalence but ignores structural distortion.

  Additionally, the term "strategy" is contested. Realists imply calculated intent; Theorists suggest evolutionary adaptation without conscious planning. This crux dissolves under analysis: if the behaviour is identical, the internal mental state matters less for policy than the external incentive structure. We recommend separating *intent* from *effect* in future drafting.

  **5. Drafter's Note**
  I am moderately confident (approx. 70%) that a real person in each camp would sign the Agreed Claims section as worded, though Realists may balk at claim 8 regarding "idealised conditions". The single line I would bet least on is in the Disagreements Table under "Primary Driver", specifically the Theorist wording; some may feel it concedes too much agency to the medium. If I had the two of them in a room, I would change the format to force them to co-author the Crux predictions before seeing the data, preventing post-hoc rationalisation. The current document risks becoming a map of where they dig in, rather than a tool for movement. Bluntly, the Realist may view the Theorist's default charity as naive, and the Theorist may view the Realist's skepticism as cynical; bridging that affective gap requires more than epistemic precision.
