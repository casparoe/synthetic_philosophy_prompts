      *   *What if the theory failed to pick this out?* If we define corruption purely as "illegal payment," then legalised bribery (lobbying) isn't corruption. If we define it purely as "influence," then all politics is corruption. The theory needs to distinguish between *legitimate influence* and *illegitimate subversion*.
      *   *Counterfactual:* A practice that doesn't pick out the right feature would criminalise social bonding (gifts at weddings) while legalising policy capture (revolving door).
