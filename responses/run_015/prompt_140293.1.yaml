      *   *Constraint:* "Brainstorm... before you commit." (Put this at the very top).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "lobbying is bad." I need to explain why the *theory* allows it. The theory relies on the distinction between *public office* and *political influence*. Petty bribery happens *inside* the administration (Weberian bureaucracy). Lobbying happens *before* the decision (political sphere). The theory breaks down when the administrative and political spheres blur (e.g., advisory roles).

  Let's refine the "Implicit Theory." It's actually **Proceduralism**. As long as the procedure is followed, the influence is okay. Petty bribery bypasses procedure. Lobbying works *through* procedure (just influencing the inputs). Clientelism bypasses procedure for social reasons.

