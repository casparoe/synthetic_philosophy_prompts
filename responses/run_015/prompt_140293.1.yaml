answer: |-
  ### Brainstorming: What a Theory of Corruption Must Do

  Before reconstructing the implicit theory, we must clarify the theoretical workload. A robust theory of corruption cannot merely list prohibited acts; it must justify the prohibition.

  *   **Identify the Wrong-Making Feature:** The theory must isolate *why* a specific exchange is wrongful. It cannot be merely "money changes hands" (as campaign donations are legal) nor merely "influence is exerted" (as advocacy is legitimate). The feature must be the **subversion of the public purpose of an office for private gain**, specifically where the officeholder betrays a duty of impartiality owed to the citizenry.
  *   **Distinguish the Social from the Corrupt:** The theory must explain why a wedding gift in a clientelist culture is anthropologically distinct from a bribe, even if both create obligation. If the theory fails here, it criminalises social cohesion. It must distinguish between *constitutive relationships* (which bind a community) and *instrumental exchanges* (which commodify public duty).
  *   **Account for the Counterfactual:** If the theory does not pick out the correct feature, a practice would emerge where systemic capture (e.g., drafting laws for donors) is legal, while survival strategies (e.g., speeding up a licence to feed a family) are criminalised. This is precisely the tension you have identified. A successful theory must either justify this disparity or expose it as a failure of the current legal regime.

  ***

  ### Reconstruction of the Implicit Theory

  You have hit upon a profound disjunction: the law treats corruption as a transactional crime, while political reality treats it as a systemic condition. Your three-way distinction (*priority, content, access*) is an excellent descriptive taxonomy of *mechanisms*, but it fails as a normative theory because it does not align with how the law actually distributes blame.

  Here is the reconstruction of the implicit theory currently governing anti-corruption practice, followed by an evaluation of your distinction and the consequences of shifting the central harm.

  #### 1. The Dominant Implicit Theory: Formalistic Impersonality
  The current legal and compliance framework rests on a **Weberian Theory of Bureaucracy** combined with a **Legalistic Quid-Pro-Quo Standard**.

  *   **About Offices:** It presupposes that public offices are impersonal machines. The officeholder is a neutral technician who applies rules without regard for the person standing before them.
  *   **About Equality:** It assumes formal equality (everyone follows the same queue) is the primary good.
  *   **About Gifts:** It adopts a **Threshold Theory of Influence**. A gift is presumed innocent until it crosses a monetary or declaratory threshold (the pen vs. the chocolates), at which point it is presumed to be a price.
  *   **What It Rules Out:** It rules out the **Market Efficiency Theory** (that corruption 'greases the wheels' of a slow bureaucracy) by criminalising the *priority* payment. However, it quietly accommodates the **Pluralist Theory of Politics** (that policy should be the result of competing interests) by allowing *content* payments via lobbying and donations.
  *   **Where It Is Underdetermined:** The 'pen vs. chocolates' rule is theoretically hollow. It presupposes that influence scales linearly with cost. It cannot explain why a cheap pen is neutral but a £50 box of chocolates is compromising, unless one assumes a magical threshold where human psychology suddenly shifts from 'sociable' to 'bribable'. This is underdetermined; a theory of **Relational Integrity** would ban both if they create obligation, while a theory of **De Minimis** would allow both. The current practice splits the difference arbitrarily to allow for 'humanity' without admitting 'corruption'.

  #### 2. Evaluating Your Distinction (*Priority, Content, Access*)
  Your hunch is correct: sorting payments this way reveals that the practice is not consistent.

  *   **Priority Payments (The Petty Bribe):** You get what you are entitled to, just faster.
      *   *Legal Status:* Criminalised heavily.
      *   *Why:* This violates the **Queue Principle**. In a Weberian bureaucracy, time is supposed to be neutral. Selling speed treats public time as private property.
  *   **Content Payments (The Lobby/Donation):** The official decides differently on the merits.
      *   *Legal Status:* Regulated, often legal.
      *   *Why:* This is framed as **Political Speech**. The theory assumes that influencing the *merits* of a decision is the job of politics, whereas influencing the *process* (priority) is the job of administration. The law protects the political sphere from the bureaucratic standard of impersonality.
  *   **Access Payments (Clientelism/Funerals):** You get your case heard.
      *   *Legal Status:* Ambivalent. Criminalised in statute, but often tolerated as 'culture' or treated as soft corruption.
      *   *Why:* This violates the **Gatekeeping Principle**. However, because it is often embedded in social survival networks, enforcement is weak.

  **Where your distinction goes wrong:** It assumes the *type* of payment determines the *corruption*. In reality, the **class of the actor** determines the corruption.
  *   When a citizen pays for *priority*, it is 'bribery' (corruption of the state by the poor).
  *   When a corporation pays for *content* (via lobbying), it is 'engagement' (participation by the elite).
  *   When a politician pays for *access* (via clientelist gifts), it is 'patronage' (leadership by the powerful).

  The implicit theory is not actually about *Priority vs. Content*; it is about **Administration vs. Politics**. We criminalise the corruption of the *administrator* (who must be neutral) but legalise the corruption of the *politician* (who is expected to be partial to their donors/constituents). Your distinction exposes that we have no theory for the **Administrative Politician** (the minister who decides policy *and* oversees implementation), which is where the revolving door and large donations live.

  #### 3. Rival Theories and Presuppositions
  To clarify the landscape, we must see what the current practice silently rejects:

  *   **Strict Liability Theory (Ruled Out):** If the harm were simply 'receiving an unauthorised benefit', the pen would be banned. The fact that it is not rules out a pure integrity model.
  *   **Systemic Trust Theory (Compatible but Underutilised):** This theory argues the harm is the erosion of public faith. This fits the crackdown on petty bribery (which is visible and angers the poor) but fails to explain the tolerance of lobbying (which is invisible to the public). The practice *says* it cares about trust, but *acts* as if it cares about transactional proof.
  *   **The 'Public Duty' Theory (Strictly Presupposed):** The law strictly presupposes that a public office is not a marketplace. You cannot sell your duty. However, it is underdetermined on *what counts as selling*. Is selling your *time* (priority) the same as selling your *judgement* (content)? The law says yes for the clerk, no for the minister.

  #### 4. Concrete Changes: Shifting the Central Harm
  If we abandon the **Quid-Pro-Quo/Impersonality** model and adopt a theory where the central harm is **Personal Dependency** (the citizen becomes beholden to the patron) or **Agenda Capture** (the state serves private interests), the institutional design changes radically.

  **Scenario A: The Harm is Personal Dependency (Anti-Clientelism)**
  *   *Current View:* A gift is corrupt if it buys a decision.
  *   *New View:* A gift is corrupt if it creates an obligation, regardless of the decision.
  *   *Concrete Changes:*
      1.  **Total Gift Ban:** No thresholds. No pens, no chocolates. Any transfer of value creates a debt, and a public official cannot be in debt to a private citizen.
      2.  **Abolition of Discretionary Welfare:** If officials cannot be dependent, they cannot distribute discretionary help (jobs, school places) based on relationships. All allocation must be algorithmic or strictly rule-based to prevent the *possibility* of patronage.
      3.  **Social Security Reform:** You cannot ban clientelism without providing the state safety net that replaces the patron. If the state doesn't feed the poor, the patron will.

  **Scenario B: The Harm is Agenda Capture (Systemic Corruption)**
  *   *Current View:* Corruption is an individual crime (the bribe-taker).
  *   *New View:* Corruption is a structural condition (the policy is rigged).
  *   *Concrete Changes:*
      1.  **Revolving Door Ban:** A lifetime ban on ministers working in industries they regulated. The 'cooling-off' period is insufficient; the harm is the *anticipation* of future employment while in office.
      2.  **State Funding of Elections:** If *access* payments are the harm, private campaign finance must be abolished. Parties become public utilities.
      3.  **Lobbying as Co-Decision:** If corporations are shaping *content*, their input must be public, on the record, and subject to the same disclosure rules as parliamentary testimony. Currently, lobbying is private; under this theory, it must be treated as a legislative act.

  ### Conclusion: Why You Are Stuck
  You are stuck because you are looking for a coherent theory where there is only a **compromise**.

  The current regime is not a single theory of corruption. It is a political settlement. It criminalises **petty corruption** to maintain the legitimacy of the state among the poor (who encounter the licensing office), while it legalises **elite corruption** to maintain the functionality of the state among the wealthy (who fund the campaigns).

  Your *Priority/Content/Access* distinction is analytically sharp, but it fails to predict the law because the law is not designed to stop corruption uniformly; it is designed to stop *visible* corruption that threatens stability.

  If you wish to argue for a unified theory in your module, I suggest you pivot to **Institutional Integrity**. Argue that the distinction between 'administrative priority' and 'political content' is a fiction. A minister selling policy (content) is selling the public trust just as a clerk selling a licence (priority) is. The theory you are missing is one that treats **Public Office as a Public Trust**, where *any* private benefit derived from the position—whether speed, outcome, or access—is a breach of that trust. Under that theory, your three categories all collapse into the same wrong: the privatisation of public power.
