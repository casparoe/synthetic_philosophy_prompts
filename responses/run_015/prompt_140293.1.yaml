  *Content:* Entitlement/Decision varies.
  *Access:* Entitlement consideration varies.
  *Critique:* This maps onto *what* is being sold. But the law treats Priority (petty bribery) as the archetypal corruption. Why? Because it's a direct violation of *equality before the law*. Content payments (lobbying) are framed as *inequality of influence*, which is tolerated in liberal democracies. Access payments (clientelism) are framed as *patronage*, which is culturally embedded but legally frowned upon.
  *The Gap:* The theory assumes a Weberian bureaucracy where *Priority* shouldn't exist (first come, first served). But it accepts *Content* influence via the political channel. The user's distinction reveals that we criminalise the violation of bureaucratic norms but legalise the violation of political equality.

