      *   *Step 5: The Biological Analogy.* (Now introduce the stem cell).
      *   *Step 6: Normative Claim.* Justice as fit, not coercion.

  6.  **Addressing Misconceptions (Timing is Key):**
      *   *Misconception 1: Empirical vs. Normative.* Must be addressed *before* the analogy. If they think it's a biological claim, the analogy reinforces the error.
      *   *Misconception 2: Genetic Determinism.* Must be addressed *during* the analogy setup. Clarify that "Nature" for Aristotle isn't DNA.
      *   *Misconception 3: Cognitive Deficit (Psychometrics).* Must be addressed *after* the analogy. Aristotle's "lack of deliberation" is about authority, not IQ.

