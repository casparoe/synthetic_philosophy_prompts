      *   *Pivot:* Use the Stem Cell to explain *Teleology* (cells differentiate for the sake of the organism), but use the **Hand/Tool** analogy for the *Slave/Master* relation. The prompt asks to use the stem cell to illuminate the claim that humans are instruments.
      *   *Okay, I will guide them to use the Stem Cell analogy carefully:* Focus on *functional specialization for the sake of the whole*, not on *origin*. The differentiated cell is "for the sake of" the organism's function. The slave is "for the sake of" the master's deliberation.
      *   *Wait, a crucial distinction:* Aristotle says the slave is a *part* of the master (like a body part).
      *   *Okay, the plan:* Use the Stem Cell analogy to explain *Natural Teleology* (Step 1), but rely on Aristotle's *Body/Soul* analogy for the *Normative Relation* (Step 2). If the user insists on the Stem Cell for the Slave/Master relation, I must warn them to decouple "differentiation" from "inferiority" in the modern sense.
      *   *Actually, the prompt asks me to map the order... beginning with teleological view... proceeding through household... and ONLY THEN introducing the biological parallel.* Okay, I will follow this instruction but add the necessary guardrails.

  8.  **Addressing the "What to Refuse" Constraint:**
      *   Medieval Scholasticism (as requested).
      *   Also: The historical reality of Athenian slavery (chattel vs. natural).
      *   Also: Modern racial justifications (19th century).
      *   Focus strictly on the *internal logic* of *Politics* Book I.

  9.  **Developing the Check for Understanding:**
      *   Needs to distinguish "Is this true?" (Empirical) from "If this were true, would it be just?" (Normative).
      *   Question: "If we discovered a genetic marker for 'deliberative capacity,' would that vindicate Aristotle?" (Answer: No, because his claim is about functional fit, not biological mechanism).

  10. **Refining the Misconception Intervention Points:**
      *   *Empirical vs. Normative:* Intro/Teleology section.
      *   *Genetic Determinism:* Just before/during Biological Analogy.
      *   *Cognitive Deficit:* During the discussion of "Deliberative Faculty" (after analogy).

  11. **Final Review of the Plan:**
