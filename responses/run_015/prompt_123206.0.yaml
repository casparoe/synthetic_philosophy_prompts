      *   *Premise 2:* Hierarchy is natural (Soul rules Body, Reason rules Appetite).
      *   *Premise 3:* The Household (*oikos*) is the basic unit of the polis. It requires rule (Master/Slave, Husband/Wife, Father/Children).
      *   *Claim:* Some humans are "living tools" (*empsychon organon*). They have enough reason to *perceive* it but not to *possess* it/deliberate fully.
