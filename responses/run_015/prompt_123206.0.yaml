      *   *Verdict:* It's a powerful *heuristic* but dangerous if treated as an *identity*. It should be used to illustrate *functional complementarity* and *teleological fit*, not biological destiny. It needs to be introduced *after* the teleological framework is set, otherwise, it looks like biological determinism.

