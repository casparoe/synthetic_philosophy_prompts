      *   *Claim 4:* "Free will is therefore an illusion: given determinism, every decision was already fixed by your genes and upbringing..." -> *Flat Wrong.* The Basic Argument is explicitly *neutral* between determinism and indeterminism. This is the biggest error.
      *   *Claim 5:* "...even if you bring in quantum randomness it doesn't help, because random isn't the same as up to you." -> *Accurate.* Strawson does argue indeterminism doesn't help (luck objection).
