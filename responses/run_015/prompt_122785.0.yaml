          *   Case 1: If it predicts right, the inverse problem is solvable. But is it *grounded*? If right for wrong reasons (spurious correlation), it's overfitting, not grounding.
          *   Case 2: Grounding depth. In chemometrics, a secondary model (PLS on PLS output) degrades robustness. But if metrics match, is the *ontology* different?
      *   **Residue Report:**
          *   *Clean:* Validation, drift, noise, forward/inverse.
          *   *Smuggled:* "Aboutness" (Intentionality). Measurement deals with correlation/causation, not "meaning."
          *   *Failed:* Normativity (Truth vs. Error). Instrument error is deviation from standard; semantic error is misrepresentation.
      *   **Verdict:** The vocabulary handles *reliability* perfectly but struggles with *misrepresentation* (getting the wrong answer but thinking it's right vs. instrument drift).
      *   **Calibrationism Assessment:** It looks like a sophisticated Reliabilism. It adds "External Regularization" which is key. It's not just causal; it's about the *structure of the inversion*.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't just say "this is isomorphic." I need to show where the friction is.
      *   *Focus:* The user asked about *misrepresentation*. In instruments, a wrong reading is just noise or drift. In language, a wrong word is a *lie* or a *mistake* with normative weight. Can chemometrics capture "false belief"?
      *   *Calibrationism:* Is it distinct? It emphasizes the *inverse problem* stability. That's interesting. Most causal theories focus on the forward link (cause $\to$ effect). Calibrationism focuses on the recovery (effect $\to$ cause). This is a strong point to highlight.
      *   *Tone Check:* Ensure I'm not talking down. The user is an expert in their field. Treat the measurement metaphors as rigorous, not just illustrative.

  8.  **Final Polish:** Check against all constraints. No bibliographic references. Argue positions. Address the specific cases. Ensure the "Residue Report" is honest.

      *(Self-Correction on Case 1)*: If the text-only system predicts spectra, it has learned the *forward problem* (structure $\to$ spectrum) implicitly via language descriptions. When we measure and confirm, we are validating the *inverse* (spectrum $\to$ structure). The system itself didn't do the inverse physically. Its symbols are grounded in the *training data's* grounding, not its own. This is the "Surrogate" issue essentially.
      *(Refinement on Calibrationism)*: The "license-bearing" clause is the normative bit. It moves from "is" to "ought." This is where the philosophy sneaks in.

  9.  **Final Structure:**
