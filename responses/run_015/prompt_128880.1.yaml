  **MEMORANDUM**

  **TO:** University Administration, Office of Research Integrity, and the Distributed Epistemics Lab (DEL) Steering Committee
  **FROM:** Joint Discipline and Governance Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Ruling and Recommendation Regarding Appeal No. 24-DL (Distributed Epistemics Lab)

  ### I. Executive Recommendation

  The Joint Discipline and Governance Panel (the Panel) has reviewed the appeal concerning the liability of the Distributed Epistemics Lab (DEL) for the downstream deployment of systematically biased data. After deliberation, the Panel rejects the motion for full dismissal of collective sanctions and declines to impose traditional punitive sanctions based on malicious intent.

  Instead, the Panel institutes an **Intermediate Category of Accountability: Collective Structural Liability.**

  We recommend that the DEL be placed on **Immediate Probation** with a **Mandatory Restructuring Mandate**. This ruling acknowledges that while "shared intention" to cause harm is absent, a "shared intention" to operate a high-risk epistemic protocol without aggregate oversight constitutes procedural negligence attributable to the collective entity.

  ### II. Background and Jurisdictional Constraint

  The DEL operates via a decentralized contribution protocol where members submit data modules without access to the aggregate. Release decisions are made by weighted procedural vote requiring only a quorum, with no requirement for voters to understand the full dataset. Last month, this aggregate data was used by an external party to produce systematically biased outputs in a high-stakes domain (housing allocation).

  Our Sanction Guidelines (Section 4.2) permit penalties against "collective entities" only when the entity acted with a "shared intention." The Panel is divided on whether this requires shared mental content (knowledge of the specific harm) or if it can be constituted by procedural joint commitment (agreement to the rules that enabled the harm).

  ### III. Reasoning and Analysis

  The Panel's decision rests on a distinction between *intentionality of outcome* and *intentionality of process*. We find that the DEL members, by mutually authorizing the release protocol, shared an intention to enact a specific mechanism of data distribution. That mechanism, by design, obscured aggregate risk. Therefore, the collective shares responsibility for the *design flaws* of the mechanism, even if no individual possessed the mental content regarding the specific bias.

  #### A. The Case for Collective Responsibility (Procedural Joint Commitment)
  The opposing faction argues that the Lab's procedural rules, mutual awareness of interdependence, and collective authorization of release constitute joint action. We agree. To participate in the DEL is to enter a joint commitment where the *output* is decoupled from individual *input*. By voting to release data under these conditions, members collectively endorsed a system where safety checks were structurally impossible. The "shared intention" required by the Guidelines is satisfied by the shared commitment to the *protocol*, which was the proximate cause of the harm. To rule otherwise would create a "responsibility vacuum" where institutional structures can be designed specifically to diffuse accountability for foreseeable risks.

  #### B. Engagement with the Rejected Position (The Reification Risk)
  The Panel has taken seriously the strongest consideration of the faction arguing for dismissal: **the risk of reifying a mechanism that lacks a unified perspective.**

  We acknowledge that attributing agency to the DEL risks treating a bureaucratic shell as a moral agent. The DEL has no mind, no conscience, and no unified perspective. It is a set of rules executed by individuals who were, by design, kept in ignorance. The faction for dismissal correctly argues that sanctioning the "Lab" is, in practice, sanctioning the individuals who comprise it. If those individuals lacked the epistemic access to know the harm was possible, punishing the collective may violate principles of fairness by imputing knowledge they could not possess. There is a genuine danger in creating a legal fiction of "collective guilt" that overrides the cognitive limits of the participants. If we treat the protocol as an agent, we risk absolving the *designers* of the protocol by blaming the *ghost* of the institution.

  However, the Panel rejects the conclusion that this reification risk necessitates dismissal. Institutional agency is always a fiction, but a necessary one for governance. The risk of reification is mitigated not by dismissing the collective, but by limiting the *type* of sanction. We are not imputing moral malice to the Lab (which would require a unified mind); we are imputing **functional liability** to the structure. The "unified perspective" required for joint action is found not in the shared knowledge of the data, but in the shared adherence to the governance rules. The collective is not being punished for "thinking" harmful thoughts, but for "building" a harmful machine.

  ### IV. Specific Recommendations and Mandates

  To balance the need for accountability with the epistemic limits of the contributors, the Panel orders the following under the Intermediate Category of **Collective Structural Liability**:

  1.  **Suspension of Release Authority:** The DEL is prohibited from releasing any external data modules for a period of 180 days.
  2.  **Mandatory Epistemic Audit:** An independent third party must audit the contribution protocol. The audit must specifically model aggregate risks that are invisible at the module level.
  3.  **Restructuring of Governance:** The DEL must amend its bylaws to include an "Aggregate Oversight Role." This role must be held by a rotating committee with full access to the dataset, empowered to veto releases based on systemic risk, distinct from the weighted procedural vote.
  4.  **No Individual Penalties:** No individual contributor shall face disciplinary action regarding this incident, provided they comply with the restructuring mandate. This addresses the reification concern by ensuring individuals are not punished for the collective's structural blindness.

  ### V. Implementation Timeline

  *   **November 1, 2023:** Formal notice of Probation issued to DEL Steering Committee.
  *   **November 15, 2023:** DEL must submit a plan for the selection of the Independent Auditor.
  *   **January 15, 2024:** Completion of Epistemic Audit and submission of findings to the Panel.
  *   **March 1, 2024:** DEL must implement the "Aggregate Oversight Role" and submit revised bylaws.
  *   **March 15, 2024:** Panel review of compliance. Probation lifted upon successful certification.

  ### VI. Conclusion

  This ruling establishes that in decentralized research collectives, "shared intention" is satisfied by the joint commitment to a risk-generating process. We reject the notion that distributed ignorance absolves collective responsibility, but we also reject the notion that the collective possesses a moral mind. The DEL is liable not for what it *knew*, but for what it *built*.

  **Signed,**

  *Joint Discipline and Governance Panel*
  *University Research Integrity Office*
