      *   *Confidence Check:* I am highly confident about the smuggled assumption (independent standard). I am less confident about whether a "better" analogy exists that captures the *normative* force of the problem without importing false intuitions. Epistemology is messy. I will flag the "Better Analogy" section as the area of least certainty.

  10. **Final Review against Constraints:**
