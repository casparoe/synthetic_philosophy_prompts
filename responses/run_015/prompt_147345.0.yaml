  At a rainy bus stop in Bristol, Elara, a tourist who read about British queueing in a guidebook, and Ben, a local commuter, stand beside identical invisible lines. Both know the norm is strict first-come, first-served, and both are late for a museum opening—a leisure commitment, not an emergency. When the bus arrives, Elara steps ahead of the waiting group to board first, and Ben, standing in a separate cluster, does the exact same thing for the exact same reason. Neither action prevents anyone else from boarding since the bus is empty, but both actions visibly disrupt the silent coordination of the crowd. Elara assumes her outsider status exempts her from the social contract, while Ben knows he is violating a community expectation, yet their physical transgressions are indistinguishable.

  **The Check**

  *   **Action:** Deliberate queue jumping for non-urgent leisure reasons.
  *   **Method of Knowing:** Elara knows via explicit study (guidebook); Ben knows via cultural osmosis. Both possess intentional knowledge of the norm.
  *   **Nearby Worlds:** In a world where they lack knowledge (ignorance), the act remains physically identical but lacks intent. In a world where they don't care (apathy), the intent remains but the justification shifts from error to defiance.
  *   **Theoretical Verdicts:**
      *   **Convention-is-Moral Theorist:** Argues that the convention *constitutes* the moral duty. Violating it triggers **normative spillover**, where breaking one coordination norm (queueing) weakens unrelated norms (like tipping or fare payment) by eroding general trust in social cooperation. **Verdict:** Both Elara and Ben are equally wrong because the convention binds all participants in the space regardless of origin.
      *   **Pure-Social-Rule Theorist:** Argues that rules are internal regulations binding only on members of the social group who implicitly consent to them through residency and participation. **Verdict:** Ben is wrong (breach of membership contract); Elara is permissible (outside the jurisdiction of the local rule set).
  *   **Feature Doing the Work:** It is not just knowledge, but *knowledge coupled with social membership*. If you strip away the intentional knowledge (they didn't know the rule), the Pure-Social-Rule theorist excuses both (no consent possible), while the Convention-is-Moral theorist may still condemn the act as objectively disruptive to the social fabric, regardless of intent. However, the divergence between the tourist and local hinges on membership: the Convention theorist sees the rule as universal within the space, while the Pure-Social-Rule theorist sees it as contractual.
