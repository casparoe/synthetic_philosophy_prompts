answer: |-
  Where my sketch went wrong
  Your hotel upgrade case failed because the sophisticate treats the future cost as a deterrent at the entry point; she sees the trap and refuses the first offer. To break the immunization claim, you need an intermediate benefit that makes entry rational ex-ante, even if the final endowment is ex-ante inferior to the status quo, forcing the sophisticate to walk into a loss she predicts but cannot avoid without a resolution she lacks.

  The scenario
  A conference attendee faces a lunch decision. At 12:00 (T1), she chooses between a Standard Box (Status Quo) or a Free Gourmet Sample plus a later upgrade option. If she takes the Sample, her palate adjusts via contrast (endogenous change). At 12:30 (T2), she is offered the Full Gourmet Lunch for $50 or she keeps the Standard Box. At 13:00 (T3), she eats. The exploiter is just a vendor offering standard options; no contracts bind her, and she knows her own tastes perfectly. The trap is that tasting the Gourmet makes the Standard seem inedible by T2, compelling the purchase, even though she wouldn't have paid $50 for the Gourmet had she not tasted it first.

  Preferences stage by stage
  Money is never revalued; more cash is strictly better at every stage. At T1, she values the Standard Box at $0 and the Full Gourmet Lunch at $40. Thus, she prefers Standard > Gourmet − $50 (value −$10). However, she values the Free Sample at +$15. At T2, having consumed the Sample, the contrast effect shifts her valuation: the Standard Box now feels like a loss, and the Full Gourmet Lunch is valued at $60. Thus, at T2, she prefers Gourmet − $50 (value +$10) > Standard (value $0). Her T1 preferences are complete and transitive over final endowments, as are her T2 preferences. The change is entirely endogenous to the choice at T1. She predicts this shift perfectly. The intensities are explicit: T1 loses $10 in final endowment value by upgrading, but gains $15 in sample utility, netting +$5 total ex-ante utility, which motivates entry.

  What each disposition does
  The **Myopic** chooser takes the Sample at T1. At T2, she maximizes local preference and buys the Upgrade for $50. She ends with the Gourmet Lunch − $50. Relative to Status Quo, her final endowment is worth −$10 by T1 lights, though she enjoyed the Sample.

  The **Sophisticated** chooser anticipates T2's reversal. She calculates that taking the Sample leads inevitably to spending $50. She compares Status Quo (Standard, $0) against the Path (Sample + Gourmet − $50). Since she values the Sample ($15) more than the Ex-Ante loss on the lunch (−$10), she accepts the Sample. She knows she will spend the $50 at T2. She ends with the same final endowment as the Myopic chooser: Gourmet − $50. She is strictly worse off in terms of final endowment than if she had never traded (Standard), though her total utility including consumption was positive.

  The **Resolute** chooser adopts the plan at T1: "Take the Sample, but refuse the Upgrade." At T2, despite preferring Gourmet − $50 locally, she executes the plan and keeps the Standard Box. She ends with Standard + Sample. Her final endowment (Standard) is strictly better than the Sophisticate's (Gourmet − $50) by T1 valuation. She captures the Sample's value without succumbing to the endogenous shift.

  Spec check
  1. No synchronic defect: Met (preferences transitive/complete at each node).
  2. Endogenous change: Met (contrast effect from Sample).
  3. Full sophistication: Met (perfect prediction of T2 choice).
  4. Ordinary exploiter: Met (no coercion/contracts, just offer structure).
  5. Finite/Small: Met (2 decisions, $50 loss).
  6. Realistic: Met (conference lunch scenario).
  7. Resolute > Sophisticate: Met (Standard > Gourmet − $50 by T1 lights).
  Constraint Tension: Resolute choice requires acting against T2 local preference, which some define as a synchronic defect, though it is permitted here as a planning disposition.

  What's doing the work
  The load-bearing feature is the **decoupling of entry utility from final endowment value**. The Sample provides enough ex-ante utility to justify entry, but the endogenous preference change ensures the final purchase is ex-ante inefficient. Sophistication accounts for the change but cannot prevent it once entry occurs, because the agent cannot commit at T1 to ignore T2 preferences. If you remove the Sample (intermediate benefit), the sophisticate refuses entry, and the pump fails. If you remove the endogenous change, the T2 purchase doesn't happen, and the pump fails. The strongest attack is that the sophisticate isn't truly "worse off" because her total utility (including consumption) exceeded the status quo. However, this conates flow utility with final endowment; diachronic rationality concerns whether you end up where you planned, not just whether you enjoyed the slide down the drain.

  The moral I should draw
  The case shows that sophistication plus foresight is insufficient for diachronic rationality when preference changes are endogenous and consumption is separable from final ownership. Sophistication protects ex-ante total utility, but it does not protect the ex-ante valuation of the final state if intermediate consumption triggers a preference shift that locks in a costly final endowment. Resolute choice wins by decoupling the plan from the shifted local preference. Stipulating resoluteness is not cheating; it is the only mechanism that allows an agent to benefit from the entry (Sample) without paying the endogenous tax (Upgrade). The standpoint of "loss" must be the Ex-Ante valuation of the Final Endowment; the Final Stage (T3) dissents, believing the upgrade was worth it, which proves the preference change was real and not a mistake, making the loss purely diachronic.
