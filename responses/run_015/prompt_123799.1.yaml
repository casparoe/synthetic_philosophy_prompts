answer: |-
  This is a high-stakes room. You are walking into a minefield of epistemological disagreements, and your proposal asks historians to do more work (blinded matching) while telling modelers their favorite toy (prediction) doesn't work.

  Here is your Q&A prep sheet.

  ### The Pre-Emptive Concession
  **Do this in your opening remarks, before Q&A starts.**
  Do not wait for them to ask about the "prediction" hype. Own it immediately.
  *Say this:* "I need to start by acknowledging that the public branding of cliodynamics has oversold its predictive capacity. The 2020 instability forecast is often cited as a success, but in strict forecasting terms, the error bars were wide and the base rates unclear. If I defend cliodynamics as a weather forecast for revolutions, I will lose this room. I am arguing we should value it not for getting the future right, but for making our explanations of the past falsifiable."
  *Why:* This disarms the historians' suspicion that you are a true believer and signals to the modelers that you understand statistical rigor.

  ---

  ### Objection 1: The "Bait-and-Switch" (Damage: Critical)
  **Who:** The Moderator or a Senior Historian.
  **The Objection:** "You've just admitted the field's biggest selling point—prediction—is oversold. But you and Turchin and the headlines *did* sell it on prediction to get funding and attention. If the models can't predict crises, why should we treat them as anything more than just-so stories with extra steps? Aren't you just moving the goalposts because the prediction failed?"

  **Your Reply (2 mins):**
  "It looks like moving goalposts, but I think it's actually correcting a category error. We treat 'prediction' in history like 'prediction' in meteorology. But in weather, the physics are closed; in history, the system is open to novelty. When I say 'not predictive,' I don't mean 'useless.' I mean the value isn't telling you *when* the bomb goes off. It's telling you *where the pressure is building*.
  Think of it like a stress test for a bridge. If an engineer says 'this bridge will collapse,' and it doesn't, they were wrong. But if they say 'the load on this pillar exceeds the design spec,' that claim is testable regardless of whether the bridge falls. Cliodynamics forces us to define the 'load' and the 'spec.' Currently, historical explanation is so flexible it can explain anything after the fact. My argument is that a model that fails is more valuable than a narrative that can't. A failed model tells you your theory of the mechanism is wrong. A narrative just absorbs the anomaly. I'm asking you to grade these models on their ability to be proven wrong, not their ability to guess the future."

  **Where this is soft:** You are asking historians to value "being wrong" over "being right." Many see a model that fails to predict as simply a bad model, not a useful philosophical tool. You risk sounding like you're praising failure.

  ### Objection 2: The "Gardening" Charge (Damage: High)
  **Who:** One of the Formal Modelers.
  **The Objection:** "Your 'Divergence Test' sounds methodologically dangerous. You're proposing matching polities on structural states *before* looking at outcomes. But who defines the matching criteria? If I have enough state variables, I can match any two societies to produce any result. This is just data dredging with a blinding step. Where is the null model? How do you control for the degrees of freedom in your matching protocol?"

  **Your Reply (2 mins):**
  "That is exactly why the matching has to be done by historians who haven't seen the model output, with criteria locked in advance. You're right that if the modeler picks the pairs, it's gardening. But if the historians pick the pairs based on archival consensus—say, 'Ming China 1620 and Ottoman Empire 1620 had equivalent fiscal stress'—and *then* we run the model to see if the trajectories diverge based on the variable in question, we aren't fitting the curve. We're testing the mechanism.
  Regarding the null model: The null is the standard historical narrative, which assumes the divergence was due to unique contingency. The model claims the divergence was structural. If the model predicts divergence and the history shows convergence (or vice versa), the model loses. I'm not asking for statistical significance in the econometric sense; I'm asking for a structured tournament where the model has to stick its neck out. If the degrees of freedom are too high, the historians will reject the match as invalid. That's a feature, not a bug."

  **Where this is soft:** You are relying on historians to agree on "structural equivalence." They notoriously don't. If they can't agree on the match, the test never happens.

  ### Objection 3: The "Proxy" Problem (Damage: Medium-High)
  **Who:** The Cliometric Economic Historian.
  **The Objection:** "You talk about state variables like 'elite overproduction' or 'fiscal capacity.' In the Roman context, 'elite' is a legal category; in early Islamic contexts, it's tribal; in Early Modern Europe, it's often venal office-holding. You're using the same variable name for numbers that measure completely different social realities. If the input is a vague proxy, the output is garbage. How do you quantify 'overproduction' without arbitrary thresholds?"

  **Your Reply (2 mins):**
  "You're absolutely right that 'elite' is not an ontological universal. It's an analytical category. But historians use these categories implicitly all the time. When we say 'the gentry were restless,' we're making a claim about elite overproduction without writing down the equation.
  My proposal isn't to pretend the proxy is perfect. It's to force the proxy into the open. If you say 'elite overproduction' is a bad proxy for the Mughals, tell me what the better variable is. Is it 'landlessness among nobles'? Is it 'court patronage ratios'? The model forces you to specify *what* you mean. Right now, we argue about words. I want us to argue about measurements. If the measurement is impossible, the model breaks, and we learn that the theory doesn't apply there. That's better than pretending the concept works everywhere because it's vague."

  **Where this is soft:** If the variable is truly incommensurable across cultures, the model can't run. You need to be prepared to concede that some models might only work within specific cultural "families."

  ### Objection 4: The "Contingency" Defense (Damage: Medium)
  **Who:** A Historian of Early Modern Europe.
  **The Objection:** "Let's take your divergence test. Say you match France and England in 1780. The model says they should both revolt. England doesn't. You say, 'Ah, structural variable X was different.' But the archive shows England didn't revolt because of a specific decision by a specific minister during a specific week of negotiations. Your model can't capture the contingency of the archive. It smooths over the very thing that explains the outcome."

  **Your Reply (2 mins):**
  "If the outcome hinged on a specific decision by a specific minister, then the model *should* fail. And that failure is informative. It tells us that for England, structural pressure was insufficient to override agency.
  But usually, when we look closely, that 'specific decision' was only possible because the structural constraints allowed it. The minister could make that deal because the fiscal state was strong enough to buy off the opposition. The model doesn't deny contingency; it asks: 'Under what structural conditions does contingency matter?' If the model says 'revolution is inevitable' and a minister prevents it, the model is wrong. But if the model says 'revolution is probable unless fiscal capacity > X,' and the minister increased fiscal capacity, the model worked. I'm asking you to use the model to find the boundaries of contingency, not to deny it exists."

  **Where this is soft:** Historians love contingency. It's their bread and butter. You are asking them to treat it as a residual variable.

  ### Objection 5: The "Category Error" (Damage: Low-Medium)
  **Who:** The Anthropologist.
  **The Objection:** "You're treating 'polity' as a bounded unit. But in many of the societies we study, power isn't territorial. 'Elite overproduction' in a kinship society isn't about offices; it's about bridewealth and lineage segmentation. By forcing these into a dynamical system, you're imposing a Weberian state ontology on societies that didn't operate that way. You're modeling a fiction."

  **Your Reply (2 mins):**
  "That's a fair critique of Turchin's earlier work, which was very state-centric. But structural-demographic theory can be adapted. If 'office' isn't the resource, then 'land' or 'bridewealth cattle' is the resource. The math doesn't care what the variable is, only that it's limited and demanded.
  However, if the ontology is so different that 'resource competition' doesn't drive conflict, then the model should fail the divergence test. I'm not asking you to force your society into the model. I'm asking you to use the model to see if your society *fits* the pattern. If it doesn't, that's a discovery. It means the mechanism of conflict there is fundamentally different. That's a comparative insight we don't get if we just write separate narratives."

  **Where this is soft:** Some ontologies really are incompatible with equilibrium modeling. You might have to concede that cliodynamics has a "zone of applicability."

  ---

  ### The Single Reply That Must Land
  **The Concept:** **Falsifiability > Accuracy.**
  You must convince the room that a model that is *wrong* is more useful than a narrative that is *unfalsifiable*.
  *Why:* The historians think models are bad because they get things wrong. The modelers think models are bad if they aren't predictive. You need to bridge this: The value is in the *constraint*.
  *Phrasing:* "A narrative can explain both peace and war after the fact. A model must choose. I want to be in a discipline where we can be embarrassingly wrong, because that's the only way we stop being vaguely right."

  ### The Weakest Joint in Your Argument
  **The Matching Protocol.**
  Your entire "Divergence Test" relies on historians agreeing that two polities were in "roughly the same structural state" without looking at the outcome.
  *The Risk:* Historians will argue endlessly about whether 17th Century China is comparable to 17th Century France. If they can't agree on the input match, the test never runs.
  *Preparation:* Be ready to suggest that the matching doesn't have to be cross-cultural. It can be temporal (France 1780 vs France 1680) or regional (Province A vs Province B). Narrow the scope to make the matching defensible.

  ### The Question You Hope Nobody Asks
  **"Isn't this just Comparative History with extra math?"**
  *Why it hurts:* If the answer is "yes," the modelers will ask why you need the equations, and the historians will ask why you need the historians. If the answer is "no," you have to define the added value of the formalism without retreating into "prediction."
  *If asked:* "Comparative history usually compares outcomes to find similarities. This compares structures to predict *differences*. The math forces the mechanism to be explicit. In narrative comparison, I can say 'culture mattered.' In the model, I have to define 'culture' as a variable that decays at rate *k*. It stops us from hiding behind words."
