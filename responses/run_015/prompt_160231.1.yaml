answer: |-
  The readings

  Here are four ways people interpret that phrase, ranging from practical observation to philosophical claim.

  1. **The Archive Gap:** Winners have the money and stability to keep files safe; losers often lose everything. This claim says records are incomplete simply because of logistics. It implies we are working with a puzzle missing half its pieces, not necessarily fake ones. The loser's story wasn't destroyed; it just wasn't saved. This is about survival of paper, not truth. It suggests we should look for missing pieces elsewhere, like in diaries or oral stories, because the official box is just incomplete. This is the most common, practical use of the phrase in historical research.
  2. **The Bias Filter:** Winners shape stories to look moral. They don't necessarily lie, but they highlight their glory and hide their crimes. This says documents are self-serving. It implies we need to read between the lines to find what was omitted. The writer knows the truth but chooses a flattering version. This is about perspective, not fabrication. It suggests the document is a plea, not a snapshot. We must adjust for the author's desire to look good. This version admits facts exist but are dressed up to protect reputations.
  3. **The Silencing:** Winners actively destroy opposing records or forbid speaking. This says contrary evidence exists but was erased by force. It implies that absence of evidence is not evidence of absence. The loser's story was targeted specifically for removal. This is about active suppression of the record. It suggests a conspiracy to keep specific facts hidden from the future. We must assume the missing pages were burned, not lost. This view assumes malicious intent behind the missing information and requires proof of destruction.
  4. **The Reality Denial:** There is no objective past, only competing stories. Power decides which story counts as "history." This says truth itself is an illusion created by authority. It implies that facts don't matter, only who holds the microphone. If the victor says it happened, it happened; if they say it didn't, it didn't. This is about the nature of truth itself. It suggests reality bends to whoever holds the pen. There is no fact-checking power strong enough to stop them. This is the most extreme philosophical claim and denies shared reality.

  Verdicts on each

  1. Obviously true. Archives require funding and stability that displaced groups often lack, leading to genuine gaps in the written record.
  2. Defensible. People naturally justify their actions, but core facts usually survive the spin, requiring careful interpretation rather than dismissal.
  3. Defensible but arguable. Suppression happens, but total erasure is rare and hard to prove without specific evidence of destruction.
  4. False. Physical evidence and independent accounts constrain narratives; power cannot change reality, only how it is reported.

  Which readings would actually do the work at your meeting

  Readings one and two are your friends here. They admit the government file is real but flawed. It was written by the side with the pens, likely to justify their actions in the 1950s, long after the fact. This gives space for your oral tradition to count as evidence that fills the gaps or corrects the bias. You aren't saying the file is a lie; you're saying it's incomplete self-justification. Reading three helps if you can prove destruction, but that's hard. Reading four is dangerous. If truth is just power, your town's story is just another power play. It undermines the idea that the families actually suffered. You want to claim their experience was real, not just a competing narrative. Stick to the idea that records are biased, not that facts are fake. This protects the integrity of the families' memory while questioning the clerk's authority. Since your story is older than the document, it has longevity on its side, whereas the document only has institutional authority. Readings one and two allow both to coexist as evidence.

  What I should say next time

  Next time, don't let the phrase shut down thinking. Say: "That saying means official records are biased, not that truth doesn't exist. The file tells us what the government wanted to believe in the 1950s. Our tradition tells us what families lived through since the 1890s. One is a justification; the other is a memory. We need both to see the whole picture. Dismissing the file is wrong, but treating it as the only truth is also wrong. The families kept this story alive for generations without government help. That persistence is evidence itself. Let's treat the file as one witness and our tradition as another, rather than letting one cancel the other. We aren't choosing power over truth; we are adding a missing voice to the record."

  Bottom line

  The phrase is useful for spotting bias but dangerous if used to deny facts. Use it to validate oral history as a correction to official records, not as a replacement for truth.
