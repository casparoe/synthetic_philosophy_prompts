prompt: |-
  I'm in year 12 and we've just finished an A-level philosophy unit on truth where the teacher only mentioned deflationary theories in passing. I got a bit obsessed with that example where saying 'it is true that snow is white' doesn't really add anything over just 'snow is white', but then if truth is totally redundant like that, why does it feel weird to say there's no such property at all? There's also that crack my friend pointed out — if you try to generalise something like 'everything the pope says is true' and there's no shared property being picked out, the sentence can't really do the work we want it to, especially when you compare maths claims with moral ones.

  I want you to write a poem, about 16 lines, free verse, but with the word true placed exactly three times and each time doing different structural work: first in a refrain near the top, then rhyming with a word that shouldn't match it, and finally standing alone at the end of line 16. It should show why the redundancy idea feels right in the behaviour of everyday talk, then start to creak when we try to build those cross-domain generalisations. Don't just name-drop the theory; let the form mirror the stripping-away feeling, so the poem itself gets flatter as it goes. I need this for a seminar presentation next tuesday — not asking for citations, reading lists, or a bibliography, just the poem itself (around 16 lines) followed by a section titled Commentary on the choices made (about 100-150 words) where you explainig why you arranged the word that way and how the poem tracks the problem without just stating it.
