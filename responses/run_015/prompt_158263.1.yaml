answer: |-
  Here's the scenario: Bob in NY Slacks Kenji in Tokyo, "It would be great if you could touch base on the Q3 numbers when you have a moment." Statistically, "great" and "moment" translate flawlessly into polite Japanese, signaling low urgency, so Kenji waits until Friday and the client churns. Carlos, the human contractor, knows Bob uses understatement when he's panicking; he tells Kenji, "Bob is mad, do now," butchering the grammar but saving the account.

  **The Breakdown:**
  *   **Hofstadter's Worry:** The MT lacked the "inner light"—it shuffled symbols without grasping Bob's anxiety, which wasn't in the tokens but in the *mind* behind them.
  *   **Functionalist Defense:** Translation is a tool for task completion; MT wins on scale and cost even if it misses this nuance occasionally.
  *   **The Feature:** Pragmatic intent (social context) vs. semantic literalism (lexical stats).
  *   **Remove the Feature:** If Bob writes "Deadline: 5 PM," the ambiguity vanishes, and MT wins hands down on speed and accuracy.
  *   **MT Defender's Attack:** Don't blame the engine for the sender's opacity. If the urgency relies on out-of-band politics, the manager failed to communicate, and the MT faithfully rendered that ambiguity; the error is in the encoding, not the translation.
