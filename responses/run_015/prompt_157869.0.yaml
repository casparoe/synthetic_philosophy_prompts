answer: |-
  Dear Editor,

  The question of whether the self can stand apart from the body has haunted philosophy since its inception, yet few formulations capture the stakes as vividly as the thought experiment of the suspended man. In this scenario, a person is imagined to be created adult and suspended in a void where all sensory input, including touch and proprioception, is completely blocked. The central claim is that even in this state of radical deprivation, the individual would still affirm their own existence. They would know that they are, even if they could not confirm that they have a body. This argument, historically associated with Avicenna, posits that self-awareness is immediate and non-inferential, requiring no bodily framing whatsoever. It suggests that the essence of the self is distinct from the essence of the body, because one can be known without the other. However, when we place this medieval intuition alongside contemporary developments in the philosophy of mind, specifically what might be termed the thin-subject view, the clarity of that separation begins to blur. This modern framework suggests that even if all specific sensory inputs are suspended, what remains is not a purely intellectual ego but a minimal, pre-objective sense of being a subject that still implicitly carries spatial or affective orientation. Comparing these two frameworks reveals a profound tension regarding whether the recognition of oneself as I truly escapes bodily framing or whether it secretly relies on the very structures it claims to transcend.

  To understand the strength of the classical argument, one must appreciate its appeal to direct experience. The suspended man does not reason his way to existence through a chain of logic; he simply finds himself present to himself. This is argued to be a primitive fact of consciousness, a light that shines on itself without needing an object to illuminate. If this account holds, self-awareness is a substance-like reality that survives the stripping away of the physical world. It offers a powerful explanation for why self-awareness does not collapse into mere awareness of mental contents. In this view, thoughts and sensations are objects that appear to the self, but the self is the subject to which they appear. Because the subject is known directly, rather than inferred from its contents, it remains stable even when the contents vanish. The vulnerability here, however, lies in the assumption that the concept of I is intelligible without any reference to location, boundary, or feeling. When the suspended man affirms I am, is he affirming a purely logical point, or is he relying on a tacit sense of presence that feels like something? If the latter, then the experience of selfhood may not be as disembodied as the argument requires.

  This is where the thin-subject view offers a compelling correction. Proponents of this framework argue that consciousness is never entirely devoid of a bodily horizon, even in the absence of specific sensory data. They suggest that the minimal sense of self is not a detached observer but a locus of perspective that inherently implies a here and a now. Even without sight or touch, the sense of being a subject carries an affective tone, a subtle feeling of existence that is spatially oriented even if no specific coordinates are available. This view challenges the classical claim by suggesting that the act of recognizing oneself as I already smuggles in a tacit awareness of location or affective tone. The self is not a ghost in a machine but the lived experience of being a center of gravity for experience. This framework provides a robust account of why self-awareness survives sensory deprivation without collapsing into mere awareness of mental contents. It argues that the sense of mineness is not an added label but the fundamental texture of experience itself. Thoughts are not just floating ideas; they are felt as mine because they arise within this minimal, affectively charged field of subjectivity.

  However, the thin-subject view is not without its own vulnerabilities. By insisting that self-awareness always carries implicit spatial or affective orientation, it risks presupposing the very bodily structures it seeks to minimize. If the suspended man is truly deprived of all proprioception and sensory input, on what grounds can we claim he retains a sense of spatial orientation? To assert that there is still a here implies a contrast with a there, yet without sensory boundaries, the distinction between the self and the void becomes phenomenologically indistinguishable. The classical argument might retort that the modern view confuses the content of experience with the fact of experience. The feeling of orientation might be a contingent feature of human psychology, not a necessary condition for self-awareness. If the thin-subject view relies on a residual sense of embodiment to explain the persistence of the self, it may fail to prove that the self is anything more than a complex arrangement of bodily feelings. In this light, the classical argument retains a certain logical purity: it isolates the act of awareness from the conditions of that awareness, whereas the modern view risks conflating the two.

  The crux of the matter lies in determining which account better explains the survival of self-awareness without collapsing into an awareness of nothing but passing thoughts. The classical framework succeeds in isolating the subject from the object, ensuring that the self is not just another item in the mental landscape. Yet, it struggles to explain what this self feels like when stripped of all content. If the self is purely immaterial and non-spatial, its awareness of itself risks becoming an empty abstraction, indistinguishable from the absence of experience. The thin-subject view avoids this emptiness by grounding the self in a minimal affectivity, a bare feeling of being alive that persists even in silence. This makes the survival of self-awareness more intelligible as a lived reality rather than a logical postulate. It suggests that we know we exist not because we grasp a metaphysical substance, but because existence itself has a qualitative feel that cannot be extinguished so long as consciousness remains. This affective grounding prevents the collapse into mere content awareness because the feeling of existence is not a content; it is the medium in which contents appear.

  Nevertheless, the charge that the thin-subject view presupposes what it claims to eliminate remains potent. If the suspended man has no sensory input, the claim that he retains spatial orientation may be a projection of our own embodied perspective onto his hypothetical state. We, as observers, imagine him having a body, and thus we imagine his self-awareness retaining bodily traces. But if we strictly adhere to the thought experiment, the classical argument forces us to confront the possibility that self-awareness is fundamentally independent of these traces. The vulnerability of the classical view is that it may describe a logical possibility that is phenomenologically empty, while the vulnerability of the modern view is that it may describe a phenomenological reality that is logically dependent on the body. The question becomes whether we prioritize the logical independence of the self or the experiential texture of the self.

  In weighing these frameworks, the thin-subject view appears to provide the more defensible account of why self-awareness survives as a meaningful experience rather than a hollow logical function. While the classical argument successfully demonstrates that the concept of the self is not identical to the concept of the body, it fails to account for the persistence of the sense of self as a lived presence. The modern framework elucidates that self-awareness survives deprivation not because it escapes the body entirely, but because it is rooted in the most fundamental layers of bodily existence—the affective and spatial grounding that precedes specific sensations. This explains why the self does not dissolve into mere awareness of mental contents; the contents are secondary to the primary feeling of being a subject. However, this defensibility comes at the cost of admitting that self-awareness is never fully independent of bodily framing. The classical view wins on metaphysical independence, but the modern view wins on phenomenological accuracy.

  Ultimately, the comparison reveals that both positions illuminate different facets of the same mystery. The classical argument protects the integrity of the subject against reduction to physical states, while the modern view protects the reality of the subject against reduction to abstract logic. Yet, if we must choose which account better explains the resilience of self-awareness in the face of radical deprivation, the thin-subject view offers a richer explanation. It acknowledges that the I which survives is not a disembodied spectator but a minimal center of affective life. It accepts that the recognition of oneself as I may indeed carry a tacit awareness of location or tone, not as a limitation, but as the very condition that makes self-awareness possible. The classical view risks leaving us with a self that knows it exists but cannot feel that existence, whereas the modern view ensures that the self which survives is one that still feels itself to be, even in the dark. This suggests that the charge of presupposing bodily framing is not a fatal flaw but a necessary insight: self-awareness may not require a specific body image, but it likely requires the implicit orientation that only a living subject can possess.

  Yours sincerely,

  A Journalist
