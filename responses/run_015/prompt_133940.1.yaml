answer: |-
  hey — here is the walkthrough you asked for, built exactly to your specs so you can drop it into the talk without worrying about hidden assumptions sneaking in. imagine a line of farmers deciding whether to plant a new seed variety or stick with the old one. the new seed is actually better, so the true state of the world is new, but nobody knows that for sure. each farmer gets a private hint from their own local soil test that is right about sixty percent of the time. they want to plant the better seed, payoff one for correct, zero for wrong, and they don't care what their neighbors do except as a source of information. they decide in sequence, farmer one through farmer ten, and each sees the choices of everyone before them.

  here is how the wrong herd forms in the first scenario with no intervention. farmer one looks at their soil test and gets a hint saying old is better. since they have no other information, they plant old. farmer two gets a hint saying old is better as well. they see farmer one planted old, so they have two pieces of evidence for old and zero for new. they plant old. now farmer three comes along and gets a hint saying new is better. this is the critical moment. farmer three knows farmer one and two both planted old. assuming everyone before them was rational, farmer three infers that farmer one and two likely received hints favoring old. so farmer three is weighing two public hints for old against one private hint for new. the math says the public weight is heavier. even though farmer three's own test says new, the rational move is to ignore their own test and plant old. this is where the cascade locks in. farmer four sees three people plant old. even if farmer four gets a hint for new, the public weight is now three to one. they plant old. farmer five sees four people plant old and does the same. by the end of the line, everyone has planted old, even though the true state was new and if you had aggregated all the private hints independently—say there were three hints for new and two for old in the first five farmers—the group would have gotten it right. the sequence destroyed the information because once the public history outweighs a single private signal, rational people stop revealing what they know.

  now let's introduce the intervention with the sealed decider. suppose we are at farmer eight. the first seven farmers have all planted old, locked in that wrong cascade. normally farmer eight would see seven choices for old and ignore their own hint, planting old too. but in this version, we keep the history from farmer eight. she doesn't see what farmers one through seven did. she only sees her private hint. everyone else knows she was kept in the dark. let's assume farmer eight gets a hint for new, which happens sixty percent of the time. she plants new. now farmer nine steps up. farmer nine sees farmers one through seven planted old, and farmer eight planted new. crucially, farmer nine knows farmer eight was sealed. this means farmer nine knows farmer eight's choice reflects only her private hint, not the public history. farmer nine also knows that farmers three through seven were likely cascading, so their choices carry no new information beyond what farmer one and two established. effectively, farmer nine sees one valid public hint for old from the early adopters, one valid public hint for new from the sealed decider, and then has their own private hint. the public score is tied. because the public information is neutralized, farmer nine is no longer in a cascade. they follow their private hint. if farmer nine gets a hint for new, they plant new. farmer ten then sees the history shift. they see the early old choices, but now two consecutive new choices from the sealed decider and farmer nine. the weight tips. the cascade switches to new. the wrong herd is unraveled not by better hints, but by resetting the public weight.

  doing the accounting on this honestly requires looking at expected values. the sealed decider gives up something real. ex-ante, before anyone knows if the cascade is right or wrong, the public history is usually correct because cascades are more likely to form on the true state than the false one. by ignoring the history, the sealed decider is ignoring a valuable consensus signal. their personal expected accuracy drops from whatever the cascade accuracy was—say seventy or eighty percent in a stable herd—down to their private signal accuracy of sixty percent. they take a hit to their own payoff. however, everyone behind them gains the ability to use their own information again. if the herd was wrong, the gain for the subsequent farmers is massive because they switch from certain error to sixty percent accuracy. if the herd was right, the loss is minimal because the sealed decider likely matches the herd anyway. roughly, you only need two or three people behind the sealed decider to offset her loss in expected value, because her loss is marginal while their gain is the difference between being locked in error and having a fresh start.

  the mechanism doing the work here hinges entirely on the tie-breaking rule. in the story above, when farmer nine faced a tie between the early old signals and the sealed new signal, I assumed they followed their private hint. this is the standard load-bearing assumption in these models: when public information leaves you indifferent, you defer to your private information. if you change this so that indifferent agents flip a coin instead of following their hint, the case still survives but becomes probabilistic. cascades still form, but they are fragiler and might break on their own more often. the intervention still works because the sealed decider injects a known independent signal into the stream, forcing a recalculation of the public weight, but the clean switch from old to new becomes a matter of probability rather than certainty. the sealed decider forces the group to treat her choice as a fresh data point rather than a copy, which resets the count.

  finally, the best objection you should anticipate is from someone who argues this is an artifact of the puzzle setup rather than human behavior. the strongest version of this objection targets the common knowledge of rationality. for farmer three to ignore their own hint, they must be certain that farmer one and two were also reasoning perfectly and not just copying or guessing. in real life, if farmer nine suspects that farmer three was just copying without thinking, the public weight of those early choices diminishes naturally. people intuitively discount the choices of those who came later in a sequence because they suspect contamination. if agents assume there is any noise in how predecessors processed information, the cascade doesn't lock as hard, and the information failure isn't as severe. the model assumes everyone knows everyone else is a perfect Bayesian updater, and if you relax that to allow for even a little doubt about predecessors' rationality, the wrong herd becomes much harder to sustain without intervention. this doesn't invalidate the point, but it suggests the phenomenon is most dangerous in highly formalized environments where everyone trusts the system too much, like financial markets or standardized clinical protocols, rather than in casual social settings.
