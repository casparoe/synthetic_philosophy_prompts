  2.  **Analyze the Commitments:**
      *   (1) **Eliminative Materialism (EM):** Beliefs/desires (propositional attitudes, PAs) do not exist as discrete, causally efficacious states. Folk psychology (FP) is false (like phlogiston).
      *   (2) **Instrumentalism/Intentional Stance:** Use FP/Dennett's stance pragmatically for prediction. No ontological weight.
      *   (3) **Predictive Processing (PP):** Neuroscience (PP models) explains cognition without PAs. PP will replace FP entirely with no remainder.
      *   (4) **Clinical Indispensability:** In psychiatry (schizophrenia), attributing false beliefs (delusions) is indispensable for diagnosis/treatment. Implies tracking genuine cognitive malfunction.
      *   (5) **Principle of Charity:** Interpretation requires attributing mostly *true* beliefs to interlocutors.
      *   (6) **Moral Responsibility:** Requires actions flowing from appropriate beliefs/desires in a rational pattern.

  3.  **Initial Scan for Conflicts:**
      *   (1) says PAs don't exist. (2) says use them as tools. *Standard EM move, usually compatible.*
