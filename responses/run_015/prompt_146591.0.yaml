      *   *Nuance:* The "contented dementia" exception isn't always legal; it's often clinical discretion/risk management. I should distinguish between *law* and *practice*.
      *   *The "Contract" point:* Actually, some scholars argue it *is* a contract with the state. But the revocability makes it weak. I'll stick with the "Trust" analogy or "Hybrid."
      *   *The Lapse Rule:* I need to emphasize *why* this breaks dementia care. Dementia patients often resist bathing. If resistance voids the AD, you can't enforce hygiene directives.

