answer: |-
  # Decision Tree for Resolving Prescribing Paradoxes

  **Starting Point:** You have a pooled table showing Surgery A is better overall. You have a stratified table (Mild vs. Severe) showing Surgery B is better in both groups. This is because Surgery B was given to more Severe cases.

  Follow these four questions in order. Stop at the first leaf you reach.

  ### 1. The Timing of the Group
  **Question:** Did the patient's group (Mild or Severe) exist *before* the doctor chose the surgery, or is it something the surgery and outcome both helped define?
  *   **It existed before (Pre-treatment):** Go to Question 2.
  *   **The surgery/outcome defined it (Post-treatment):** Go to Leaf A.

  ### 2. The Measure of Success
  **Question:** If we calculate the plain difference in success rates (e.g., 10% higher) instead of ratios (e.g., 2x more likely), does the reversal disappear?
  *   **Yes, the reversal disappears:** Go to Leaf B.
  *   **No, the reversal stays:** Go to Question 3.

  ### 3. The Timing of the Guideline
  **Question:** Does it matter whether the guideline is applied before or after we learn which stratum (Mild or Severe) a patient falls in?
  *   **No, we need one universal rule regardless of testing:** Go to Leaf C.
  *   **Yes, the rule changes once we know the patient's severity:** Go to Question 4.

  ### 4. The Granularity of the Group
  **Question:** When a fine partition (e.g., Severe-Type1 vs. Severe-Type2) and a coarse one (just Severe) both reverse relative to the pooled numbers, which one wins?
  *   **The fine partition wins (Specific contexts rule):** Go to Leaf D.
  *   **The coarse partition wins (General effects rule):** Go to Leaf E.

  ***

  ## The Leaves (Named Positions)

  **Leaf A: These strata aren't poolable at all**
  *   **Path:** Post-treatment stratifier.
  *   **Meaning:** You are looking at a "collider." By splitting the data based on something the surgery influenced, you created a fake mathematical relationship.
  *   **Action:** Ignore the stratified table. Follow the pooled table. Do not adjust for this variable.

  **Leaf B: It's an artifact of the measure**
  *   **Path:** Pre-treatment + Reversal vanishes with risk difference.
  *   **Meaning:** The paradox is a mathematical quirk of using ratios (like Odds Ratios) rather than a real change in patient outcomes.
  *   **Action:** Report the plain risk difference. The "reversal" is not clinically meaningful.

  **Leaf C: The sure-thing-principle response from decision theory**
  *   **Path:** Pre-treatment + Real Confounding + Universal Rule.
  *   **Meaning:** If Surgery B is better for Mild and better for Severe, it *should* be the preferred choice universally, even if we can't test for severity beforehand. The pooled average is misleading because of the assignment bias.
  *   **Action:** Adopt Surgery B as the standard guideline for everyone, relying on subgroup dominance.

  **Leaf D: There is no single effect only local mechanisms**
  *   **Path:** Pre-treatment + Real Confounding + Individual Rule + Fine Partition.
  *   **Meaning:** The "effect" of the surgery changes depending on exactly how you slice the patient data. There is no stable "average" effect to rely on.
  *   **Action:** Write highly specific guidelines for narrow sub-types. Do not generalize beyond the finest data partition available.

  **Leaf E: Causal-graph / back-door adjustment AND Potential-outcomes style ignorability**
  *   **Path:** Pre-treatment + Real Confounding + Individual Rule + Coarse Partition.
  *   **Meaning:** We have identified the confounder (Severity). Once we adjust for it (or condition on it), we can estimate the true causal effect.
  *   **Action:** Adjust for Severity in the analysis. Recommend Surgery B for Mild and Surgery B for Severe.
  *   **Note:** This tree cannot distinguish between the *Causal-graph* and *Potential-outcomes* positions. They occupy the same leaf because, for a prescribing committee, they yield the identical recommendation: adjust for the pre-treatment confounder and trust the stratified estimate.

  ***

  ## Notes on Logical Space

  **Indistinguishable Positions**
  As noted in Leaf E, this tree cannot separate **Causal-graph / back-door adjustment** from **Potential-outcomes style ignorability**. Both frameworks agree that if a variable is a pre-treatment confounder (Question 1) and the effect is real (Question 2), you must adjust for it to find the truth. Distinguishing them requires philosophical questions about the nature of "cause" vs. "counterfactuals" that do not change the prescribing guideline.

  **Incoherent or Unattractive Combinations**
  There are paths in this logical space that no serious statistical position occupies. If your committee finds yourselves here, the reasoning is likely flawed:
  *   **Post-treatment + Trust Stratified:** If you answer "Post-treatment" in Question 1 but still want to follow the stratified table, this is **incoherent**. Conditioning on a post-treatment variable creates bias; trusting that biased table is a methodological error.
  *   **Measure Artifact + Trust Stratified Ratio:** If you answer "Yes" in Question 2 (the reversal vanishes with risk differences) but still vote to follow the stratified ratio table, this is **unattractive**. You are prioritizing a mathematical artifact over the actual difference in patient survival rates.
  *   **Fine Partition + Universal Rule:** If you answer "Fine partition wins" in Question 4 but "No, it doesn't matter when applied" in Question 3, this is **impractical**. You cannot apply a rule based on fine-grained sub-types if you are making the decision before learning which sub-type the patient is in.

  **Why This Tree Works**
  This structure forces you to decide if the problem is mathematical (Question 2), structural (Question 1), or policy-based (Question 3 & 4). It prevents you from arguing about "truth" until you have agreed on whether the variable is a confounder or a collider, and whether you are writing a policy for a population or a rule for an individual.
