  **[SCENE: A sun-drenched plaza where diverse individuals in neutral clothing examine holographic charts. Soft, uplifting piano music plays.]**

  **NARRATOR:**
  Is your society burdened by the weight of local custom? Do you suffer from chronic particularity, or the inability to classify unique cultural experiences under a single, manageable framework?

  **What is Lumina?**
  Lumina is a prescription therapy designed to illuminate the dark corners of tradition. Its active ingredient is Universal Reason, delivered via sustained-release cosmopolitanism. Lumina works by standardising cognitive processes across populations, promoting autonomy from superstition and establishing the authority of empirical method. It helps patients construct a cosmopolitan public sphere where all voices are heard, provided they speak the language of logic.

  **Indications and Usage**
  Lumina is indicated for the treatment of pre-modern malaise and the acceleration of historical progress. It is proven to foster universal human rights and liberate subjects from the dogma of inherited belief. In clinical settings, Lumina successfully converts qualitative differences into calculable equivalence, allowing for efficient administration of justice and governance.

  **Important Safety Information: Side Effects and Warnings**
  While Lumina emancipates, it may also dominate. Patients may experience the colonisation of nature and culture by instrumental rationality. Some users report a dialectical reversal, wherein Reason becomes myth, rigidifying into the very superstition it sought to cure.

  Common side effects include the masking of particular power interests behind universalist rhetoric. In clinical trials among populations with living oral traditions, Lumina demonstrated a thirty-four per cent increase in autonomy metrics concurrent with a forty-one per cent rise in epistemic collateral damage. This condition describes the metabolisation of non-European oral and narrative knowledge systems into data-compatible units that can be administered within the clinical framework of Reason.

  **Contraindications**
  Lumina should not be administered to societies where narrative knowledge remains structurally integrated. In such cases, Reason may convert qualitative difference into calculable equivalence without informed consent, leading to irreversible cultural homogenisation.

  **Ask Your Philosopher If Lumina Is Right For You**
  If you are ready to trade the comfort of the particular for the clarity of the universal, ask your philosopher if Lumina is right for your civilisation.

  **[SCENE: Music accelerates. Text scrolls rapidly at the bottom of the screen.]**

  **DISCLAIMER:**
  Lumina may not be suitable for all historical epochs. Do not take Lumina if you have a history of valuing tradition over progress. Side effects may include the disenchantment of the world, ecological degradation, and the reduction of human beings to mere resources. Long-term use may result in the erasure of indigenous epistemologies. By accepting Lumina, you agree to binding arbitration under transnational law. You may report side effects to the Ministry of Historical Materialism. Lumina is a trademark of the Enlightenment Consortium. Progress is inevitable. Side effects are permanent.
