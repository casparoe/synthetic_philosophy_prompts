      *(Refining the Epistemology)*: Don't be too soft on Hayek. If prices signal "squeeze" rather than "value," capital is misallocated. That is damage to the aggregation thesis *regarding fundamentals*. But it confirms aggregation *regarding liquidity*. I need to be precise about *what* is being aggregated.

