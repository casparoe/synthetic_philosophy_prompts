      *   *Option B:* Start with the Sequence (On, Off, On, Off...). Risk: Maths students jump to limits ($\sum (-1)^n$). Non-maths students get lost in the timing.
      *   *Decision:* The sequence *must* come first, but specifically the *causal history* of the sequence. Why? Because the "no last step" argument is a *diagnosis* of why the sequence fails to determine the outcome. If you state the diagnosis first, it feels like dogma. If you walk through the sequence and ask "What happens at 1 minute?", students try to reason from the steps. When they fail, *then* you introduce "no last step" as the explanation for that failure.
