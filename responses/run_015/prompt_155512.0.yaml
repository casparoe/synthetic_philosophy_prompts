answer: |-
  Here is a plan for your 45-minute session, structured to handle the mixed ability group while keeping the philosophical core sharp.

  ### 1. The Order: Sequence First, Diagnosis Second
  You should present the **alternating sequence first**, and treat the **"no last step" point as the diagnosis** that follows.

  **Why this order?**
  If you lead with "there is no last step," it sounds like a verbal trick or a slogan the students are expected to memorise. The non-maths students will nod without grasping the mechanics, and the maths students will immediately try to map it to limits of functions ($\lim_{n\to\infty}$).
  By drawing the timeline first (1/2 min, 3/4 min, 7/8 min...), you force everyone to visualise the *completion* of the task. You ask, "At 1 minute, what is the state?" They will try to reason from the steps. When they realise the step immediately prior to 1 minute does not exist, *then* you introduce "no last step" as the explanation for their inability to answer. The sequence generates the problem; the "no last step" argument explains why the problem has no solution. The diagnosis depends on the symptoms; do not give the diagnosis before showing the patient.

  ### 2. The Carrying Case: Stick to the Plain Lamp
  You should use the **Plain Lamp** (On/Off toggle). Do not use the Ratchet or the Counter.

  **Why the Plain Lamp?**
  *   **The Ratchet:** If pressing the switch can *only* turn the lamp off, the outcome is determinate (it will be Off). This dissolves the paradox rather than illuminating it. It smuggles in a physical rule that dictates the limit.
  *   **The Counter:** This tempts students to say the answer is "Infinity". While mathematically interesting, it suggests there *is* a value, just a transfinite one. Thomson's point is that there is *no* value in the relevant domain (On/Off).
  *   **The Plain Lamp:** This is the minimal case. It satisfies two crucial criteria:
      1.  **It must have:** Discrete, binary states (On/Off) with no intermediate value. This prevents students from appealing to continuity (e.g., "it's half-on").
      2.  **It must not have:** Any physical law linking the history to the final state. The description tells us the state at every moment *before* 1 minute, but says nothing about 1 minute itself.

  If you use the Counter, you are doing number theory. If you use the Lamp, you are doing metaphysics. You want the latter.

  ### 3. Handling Misconceptions (Timeline)
  Here is where you intercept the specific objections you expect.

  *   **0–5 mins (Setup): "Physics won't allow it."**
      *   *Strategy:* Head this off immediately. State clearly: "We are not asking if we can build this. We are asking if the *description* is logically consistent." Write **LOGIC, NOT ENGINEERING** on the board. If they raise it again, park it in a "Physics Parking Lot" corner of the whiteboard and promise to return only if time permits (you won't).
  *   **15–20 mins (The Sequence): "The times converge so the state does too."**
      *   *Strategy:* This is the core mathematical confusion. Draw two graphs. One for Time (converging to 1). One for State (oscillating 0, 1, 0, 1). Show that while the *domain* converges, the *range* does not. The maths students will spot this; ask them to explain it to the non-maths students. This uses the mixed ability to your advantage.
  *   **30–35 mins (Objections): "It's just undefined, nothing to see here."**
      *   *Strategy:* Validate this, but sharpen it. Distinguish between "The maths function is undefined" and "The physical fact is indeterminate." This is the philosophical payload.
  *   **35–40 mins (Advanced): "Newtonian collisions show supertasks are fine."**
      *   *Strategy:* Address this last. The collision cases (Perez Laraudogoitia) are *deterministic*; conservation of momentum fixes the outcome. The Lamp is *indeterminate*; there is no conservation law for "On-ness". Use this to show that some supertasks might be coherent, but Thomson's Lamp remains broken.

  ### 4. What to Refuse
  You must flatly refuse to get into **Transfinite Arithmetic (Ordinal Numbers)**.
  *   *Why:* Maths students will want to invoke $\omega$ (omega). If you allow this, the session becomes a tutorial on set theory, and the metaphysical point is lost.
  *   *How to say it:* "I am going to stop us from using ordinal numbers here. Thomson's argument is precisely that logical states like 'On' and 'Off' do not behave like numbers. Invoking $\omega$ solves the maths but bypasses the philosophy."

  ### 5. The Final Five Minutes: The Assessment Question
  You need to know if they understand the difference between *epistemic uncertainty* (we don't know) and *ontic indeterminacy* (there is no fact).

  **Put this question to them:**
  > "Suppose a god created the universe at 1 minute, having already completed the supertask. Would God have to *decide* whether the lamp is On or Off, or could He create the universe without that fact being settled at all?"

  *   If they say "He has to decide, we just don't know which," they have missed the point (Epistemic).
  *   If they say "He doesn't have to decide; the description of the past doesn't fix the future," they have got it (Ontic).

  ### Summary of Dependencies
  *   **Sequence before Diagnosis:** Because the paradox arises from the visualisation of the steps, not the slogan.
  *   **Plain Lamp before Variants:** Because variants either determine the outcome (Ratchet) or suggest a limit value exists (Counter).
  *   **Logic before Physics:** Because physical impossibility is a trivial solution that hides the logical contradiction.
  *   **Refusal of Ordinals:** Because mathematical consistency does not imply metaphysical possibility.

  \answer{The history of the lamp fixes every moment before noon, but it leaves the state at noon entirely open.}
