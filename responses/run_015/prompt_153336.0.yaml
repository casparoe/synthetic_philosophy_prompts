      *   **Conclusion 7 (The Absurdity):** "Recommending universal annihilation is absurd." This is an appeal to intuition (Moore's Open Question style). If Tranquilism accepts this, it's not self-defeating, just counter-intuitive. If it rejects this, it needs to block the earlier steps.

