          *   *Tranquilist Defense:* Many tranquilists (like Benatar, though he's asymmetry-focused) argue impersonally. But if the theory is about *subjects'* welfare, Step 4 is a category mistake.
      *   **Point B: The Asymmetry of Obligation (Step 5 & 6).**
          *   Just because Non-Existence has no suffering doesn't mean it's *better*. It might be *incomparable*.
