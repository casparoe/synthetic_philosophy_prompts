      *   *Premise 2 (Current State):* Subject S is tranquil. Welfare = Max.
      *   *Premise 3 (Non-Existence):* No S = No Craving/Suffering.
      *   *Inference 4 (Equivalence):* Welfare(Tranquil S) = Welfare(Non-Existence S). Both = Max (Zero negatives).
      *   *Inference 5 (Risk Assessment):* Non-existence has 0 risk of future suffering. Existence has >0 risk. Therefore, Non-existence > Existence.
