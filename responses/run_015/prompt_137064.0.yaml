answer: |-
  You have stumbled onto one of the deepest problems in concept learning, cognitive science, and the philosophy of science, all wrapped up in a puzzle format. Your intuition is correct: Friend A is describing **extensional adequacy** (does the rule cover the data?), while Friend B is describing **intensional correctness** (does the rule capture the concept?).

  The reason "Grue" doesn't fit is that Grue is about *temporal projection* (will this rule hold for future instances?). Your "Area" rule *would* hold for future instances. It is projectible. It is simple. It is continuous. It fails for a different reason: it is a **confound**, not a **cause**.

  Here is the breakdown of the existing landscape, followed by the specific term you are looking for.

  ### 1. The Existing Landscape

  You are effectively reinventing three distinct wheels that all touch the same ground:

  *   **Patrick Winston's "Near-Misses" (1970):** In early AI concept learning, Winston argued that positive examples alone aren't enough to define a concept (like an "Arch"). You need negative examples that are *almost* positive (blocks touching but not supporting). He called these **near-misses**. The heuristic is: *Compare the positive example to the near-miss; the feature that differs is the essential rule.* Your "Containment" example is a textbook near-miss problem. The "Area" rule fails because it ignores the *minimal difference* between the sets.
  *   **Contrastive Explanation (Lipton/van Fraassen):** In philosophy of science, a "Why?" question is always "Why P *rather than* Q?" (Why did the plant grow rather than die?). To answer, you must cite the **difference-maker**. In your Bongard problems, the implicit question is "Why are these Left *rather than* Right?" The Area rule cites a difference, but not the *relevant* difference-maker in the context of the design.
  *   **Experimental Control:** Think of your Bongard problem as a scientific experiment. The Left box is the Control Group. The Right box is the Treatment Group. You (the designer) applied one treatment: "Break Containment." But in doing so, you accidentally introduced a confounding variable: "Increase Area." Friend A is accepting a correlate (Area) as the causal mechanism. Friend B wants the causal mechanism (Containment).

  ### 2. The Coinage: Generative Fidelity

  While "Intensional Correctness" is the logical term, it's too dry for a classroom. "Near-Miss Consistency" is too specific to the data structure.

  I propose you coin the term **Generative Fidelity**.

  **Definition:**
  A rule possesses **Generative Fidelity** relative to a Bongard problem if it identifies the specific feature or transformation intentionally manipulated to construct the negative set (Right), rather than a correlated feature that merely separates the sets extensionally.

  **The Test for Generative Fidelity:**
  Ask the counterfactual: *"If I kept the proposed rule's feature constant but changed the intended feature, would the designer have classified this as Left or Right?"*
  *   **Containment Case:** If I keep Area < 40% but let the shape touch the edge (violating containment), the designer put it in the **Right** box. Therefore, the Area rule lacks Generative Fidelity.
  *   **Orientation Case:** If I keep Centroid Distance constant but rotate the triangle to point away, the designer put it in the **Right** box. Therefore, the Distance rule lacks Generative Fidelity.

  ### 3. Addressing the "Wrinkle" (Assorted Negatives)

  You noted: *"Not every problem of mine has the near-miss structure... there the thing I'm griping about seems to evaporate."*

  This is the key to tightening the definition. **Generative Fidelity is a constraint that only activates when the negative set is controlled.**

  *   **Controlled Negatives (Near-Misses):** The Right box is constructed by taking Left figures and breaking them in a specific way. Here, **Generative Fidelity** is the primary virtue. Simplicity is secondary. (Your Area rule is simple but fails Fidelity).
  *   **Uncontrolled Negatives (Assorted):** The Right box is just "stuff that isn't Left." Here, there is no single manipulated variable. Generative Fidelity cannot be calculated because there is no single "generation" event. In this case, the constraint collapses back to **Descriptive Simplicity** (Occam's Razor).

  This explains why your gripe evaporates in the second case. Without the near-miss structure, the "Area" rule might actually be the *best* answer if it's simpler than the intended rule. The "cheat" feeling comes specifically from the violation of the **signal** sent by the near-miss construction. The near-miss says: *"I held everything else constant to show you exactly what matters."* The Area rule replies: *"I ignored what you held constant and focused on what you accidentally changed."*

  ### 4. Distinguishing from Related Concepts

  Here is how you can map this for your reasoning course:

  | Concept | What it worries about | Why it's not your problem |
  | :--- | :--- | :--- |
  | **Grue / Projectibility** | Will the rule hold for *future* instances? | Your Area rule *does* hold for future instances. It is projectible. |
  | **Shortcut Learning (ML)** | Is the rule a spurious correlate that fails on *new distributions*? | Your Area rule isn't spurious; it's a real physical property. It would work on a new test set drawn from the same distribution. |
  | **Minimal Pairs (Linguistics)** | A property of the *data* (two words differing by one phoneme). | This describes your *figures*, not the *rule*. Generative Fidelity is the property of the rule that respects the Minimal Pair structure. |
  | **Construct Validity (Psych)** | Does the test measure what it claims to? | This applies to the *Problem*, not the *Rule*. Your Area rule has low Generative Fidelity, which causes the Problem to lose Construct Validity. |

  ### 5. Ontological Status: Where does it live?

  You asked if this is a property of the rule, the pair, or the person.
  **It is a property of the (Rule, Problem-Design) pair, grounded in the Agent's Intent.**

  *   **The Rule:** Can be Extensionally Adequate (Friend A) or Generatively Faithful (Friend B).
  *   **The Problem-Design:** Can be Controlled (Near-Miss) or Uncontrolled (Assorted).
  *   **The Agent:** The "Intent" is not mystical; it is operationalized by the **construction history** of the figures.

  In your course, you can frame this as **Underdetermination of Theory by Data**.
  *   **Friend A** represents **Empiricism**: All that exists is the data (the 12 figures). If the rule fits the data, it is true.
  *   **Friend B** represents **Realism/Abduction**: The data are traces of a hidden process (the designer's mind). The goal is to recover the process, not just fit the traces.

  ### Summary for your Puzzle Night

  When a solver offers the "Area" rule for the "Containment" problem, you can say:
  *"That rule is **extensionally adequate**, but it lacks **generative fidelity**. You've identified a symptom of the difference, not the cause. Look at the Right box: these aren't just random shapes with big areas; they are Left-shapes that have been *broken*. What exactly did I break?"*

  This gives you the vocabulary to validate Friend B without retreating into mysticism about "what the author meant," and it distinguishes the problem from standard induction worries like Grue. You are teaching them to distinguish between **predictive accuracy** and **explanatory depth**.
