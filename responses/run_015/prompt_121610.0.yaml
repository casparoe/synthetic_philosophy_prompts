  hey, im a backend engineer with zero formal philosophy training. im running a 45-minute lunch-and-learn for about 9 coworkers (mostly software people, a couple have seen game theory). i want a hands-on game that makes them feel why the Allais paradox breaks the independance axiom — not just understand it, but actually feel the pull of violating it. to keep it from being a total rerun of every classroom demo, im injecting a framing i made up: "phantom rollback" in distributed transactions. cluster A is a guaranteed small coffee-point payout; cluster B is a high payout but with a hidden rollback window that changes the effective probabilities in a non-independent way. design the rules, materials, payoff cards (use fake coffee points, no real cash), maybe assign roles, and a debrief that maps the moments in the game back onto the axiom. tell me what will predictably fail the first time i run it, and be straight about which part of the actual Allais setup this game just cant reproduce and ill have to supply verbally. they should leave seeing that formal independence can feel wrong even when you grasp the math. no bibliographys or reading lists, just the runnable activity.
