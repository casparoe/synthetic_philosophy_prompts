  # Activity: The Phantom Rollback Protocol
  **Time:** 45 Minutes
  **Players:** 9 Engineers
  **Materials:** Projector, 9 Decision Sheets, 1 "System RNG" (random number generator website), Whiteboard.
  **Currency:** "Caffeine Credits" (CC). Top scorer gets a $20 coffee card (or bragging rights).

  ## 1. The Framing (5 Minutes)
  **Script:**
  "We're testing two deployment clusters. You are the Release Manager. You have to sign off on the transaction strategy.
  *   **Cluster Alpha:** Monolithic. Boring. Predictable.
  *   **Cluster Beta:** Distributed. High throughput. But it has a 'Phantom Rollback' window—a hidden state where the transaction commits but the audit log vanishes.

  You will make two decisions. **Do not discuss your choices with neighbors.** This is about your internal risk model, not group optimization. Your goal is to maximize Caffeine Credits, but avoid the Rollback."

  ## 2. The Game (20 Minutes)

  ### Round 1: The Greenfield Deploy
  **Context:** System stability is high.
  **Hand out Decision Sheet A.**

  *   **Option 1 (Cluster Alpha):**
      *   **100%** Chance of **10 CC**.
      *   *Status:* Guaranteed Commit.
  *   **Option 2 (Cluster Beta):**
      *   **89%** Chance of **10 CC**.
      *   **10%** Chance of **50 CC**.
      *   **1%** Chance of **0 CC** (Phantom Rollback Detected).

  **Action:** Give them 60 seconds. Have them circle Option 1 or 2. Collect the sheets (or have them hold them).
  **Facilitator Note:** Do not reveal results yet.

  ### Round 2: The Legacy Migration
  **Context:** System stability is low. Network partitions are expected.
  **Hand out Decision Sheet B.**

  *   **Option 3 (Cluster Alpha-Legacy):**
      *   **11%** Chance of **10 CC**.
      *   **89%** Chance of **0 CC** (Hard System Crash).
  *   **Option 4 (Cluster Beta-Legacy):**
      *   **10%** Chance of **50 CC**.
      *   **90%** Chance of **0 CC** (Hard System Crash).

  **Action:** Give them 60 seconds. Circle Option 3 or 4.
  **Facilitator Note:** Collect sheets.

  ### The Payout Simulation (5 Minutes)
  To make it feel real, actually run the RNG for *one* randomly selected participant's choices live on the projector.
  1.  Pick a player at random.
  2.  Ask them to read their choices.
  3.  Roll 1d100.
  4.  Award/Deduct points based on their choice and the roll.
  *This creates tension without taking 45 minutes to payout everyone.*

  ## 3. The Reveal & Debrief (15 Minutes)

  ### Step 1: The Inconsistency Check
  **Script:**
  "Raise your hand if you chose **Option 1** in Round 1." (Count them).
  "Keep your hand up if you chose **Option 4** in Round 2." (Look for overlap).

  "Most of you just raised your hand twice. If you did, congratulations: You are human, and you just violated the Independence Axiom of Expected Utility Theory."

  ### Step 2: Mapping the Code to the Axiom
  Draw this on the whiteboard:

  ```text
  ROUND 1 (Stable)
  Opt 1: [100% : 10 CC]
  Opt 2: [89% : 10 CC] + [10% : 50 CC] + [1% : 0 CC]
                 ^^^^^^^^^^^^
                 THE PHANTOM BLOCK

  ROUND 2 (Crash)
  Opt 3: [11% : 10 CC] + [89% : 0 CC]
                       ^^^^^^^^^^^^
                       THE PHANTOM BLOCK
  Opt 4: [10% : 50 CC] + [90% : 0 CC]
  ```

  **The Logic Walkthrough:**
  1.  **The Axiom:** In decision theory, if two options share a common outcome (the 89% block), you should ignore it. It's dead code. It shouldn't affect the choice.
  2.  **The Cancellation:**
      *   In Round 1, strip away the common **89% chance of 10 CC**.
      *   Opt 1 becomes: **11% chance of 10 CC**.
      *   Opt 2 becomes: **10% chance of 50 CC + 1% chance of 0**.
      *   *Wait, that's not quite Round 2.*
      *   Let's look at Round 2. Strip away the common **89% chance of 0 CC**.
      *   Opt 3 becomes: **11% chance of 10 CC**.
      *   Opt 4 becomes: **10% chance of 50 CC**.
  3.  **The Contradiction:**
      *   If you picked **Opt 1** over Opt 2, you said: "I prefer 11% chance of 10 CC over (10% chance of 50 CC + 1% risk of 0)."
      *   If you picked **Opt 4** over Opt 3, you said: "I prefer 10% chance of 50 CC over 11% chance of 10 CC."
      *   **You cannot hold both preferences.** The 89% 'Phantom Block' changed from 'Success' to 'Crash', but mathematically it should have been irrelevant.

  ### Step 3: Why It Feels Right (The "Bug" in Human OS)
  **Script:**
  "Why did you do it? In Round 1, the 1% Rollback felt catastrophic because it ruined a **guarantee**. In Round 2, everything was already crashing (89% failure), so the 1% extra risk didn't matter, and you went for the high payout.
  The Independence Axiom assumes you treat probabilities linearly. Your brain treats 'Certainty' (100%) as a special state, distinct from 'High Probability' (89%). The Allais Paradox proves that **Certainty has non-linear utility.**"

  ## 4. Predictable Failure Points (Read This Before Running)

  1.  **The EV Maximizers:** 2-3 of your coworkers will calculate Expected Value (EV).
      *   Round 1 Opt 1 EV: 10.
      *   Round 1 Opt 2 EV: 13.9.
      *   Round 2 Opt 3 EV: 1.1.
      *   Round 2 Opt 4 EV: 5.0.
      *   *Failure:* They will pick Opt 2 and Opt 4 consistently. They will claim they are "rational."
      *   *Fix:* Acknowledge it. "If you picked 2 and 4, you are an EV maximizer. You are consistent, but you are in the minority of humans. The paradox explains why markets and people *don't* behave like you."
  2.  **Confusion on Percentages:** Engineers might try to normalize the 89% away mentally before choosing.
      *   *Fix:* Emphasize "Gut Check" in the instructions. "Don't normalize. React to the scenario as written."
  3.  **Groupthink:** If they talk between rounds, the effect dies.
      *   *Fix:* Enforce silence strictly. Collect Round 1 sheets before handing out Round 2.

  ## 5. Limitations (What You Must Supply Verbally)

  This game cannot reproduce two critical aspects of the formal Allais Paradox. You must state this in the debrief to maintain credibility:

  1.  **Diminishing Marginal Utility:** In the original paradox, the money is life-changing ($1M vs $5M). 10 Coffee Points is not life-changing. The utility of 50 points is likely exactly 5x the utility of 10 points for your coworkers. In real Allais, $5M is not 5x the happiness of $1M.
      *   *What to say:* "Because we use coffee points, your utility function is likely linear. The fact that you *still* felt the pull of certainty in Round 1 proves the Certainty Effect is strong enough to override linear utility."
  2.  **The "Common Consequence" vs "Common Ratio":** This demo uses the "Common Consequence" effect (the 89% block). There is a sibling paradox (Common Ratio) where probabilities are scaled down (e.g., 100% vs 80% then 50% vs 40%).
      *   *What to say:* "We only ran the 'Common Consequence' variant. There's another version where we scale the probabilities down, which breaks the axiom differently. Same bug, different stack trace."

  ## 6. Materials to Print

  **Decision Sheet A (Round 1)**
  ```text
  DEPLOYMENT AUTHORIZATION: ROUND 1
  System State: STABLE

  Choice A (Monolith):
  [100%] Transaction Commits -> +10 CC

  Choice B (Distributed):
  [89%] Transaction Commits -> +10 CC
  [10%] High Throughput     -> +50 CC
  [ 1%] Phantom Rollback    -> +0 CC

  CIRCLE YOUR CHOICE: [ A ]   [ B ]
  ```

  **Decision Sheet B (Round 2)**
  ```text
  DEPLOYMENT AUTHORIZATION: ROUND 2
  System State: DEGRADED

  Choice C (Monolith-Legacy):
  [11%] Transaction Commits -> +10 CC
  [89%] System Crash        -> +0 CC

  Choice D (Distributed-Legacy):
  [10%] High Throughput     -> +50 CC
  [90%] System Crash        -> +0 CC

  CIRCLE YOUR CHOICE: [ C ]   [ D ]
  ```

  **Facilitator Cheat Sheet (Keep Hidden)**
  *   **The Trap:** A + D = Violation. (Most common).
  *   **The Rational (EV):** B + D = Consistent.
  *   **The Risk Averse:** A + C = Consistent.
  *   **The Glitch:** B + C = Rare/Confused.
  *   **Key Phrase:** "The 89% is dead code. Why did it change your return statement?"
