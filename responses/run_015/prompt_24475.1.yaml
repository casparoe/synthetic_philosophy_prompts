      *   *Correction:* Need to emphasize that science uses *approximations*, not *true contradictions*. Newtonian mechanics is not *true and false*; it is *false* but *limiting case true*. That's a different logical structure than $A \land \neg A$.
      *   *Check:* Did I explain *why* DS fails in LP?
      *   *Correction:* Yes, need to show the truth table valuation ($1, 0, \{0,1\}$). If $A$ is $\{0,1\}$, $\neg A$ is $\{0,1\}$. $A \lor B$ is designated. $\neg A$ is designated. But $B$ can be 0.
