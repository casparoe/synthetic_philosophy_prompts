answer: |-
  **JOINT STATEMENT ON HUMEAN MONETARY THEORY**

  **Preamble**
  We, the undersigned representatives of the Neutrality and Quickening reading camps, acknowledge a decade of talking past one another. The Neutrality Readers emphasize Hume's long-run quantity theory, treating money as a veil. The Quickening Readers emphasize Hume's transition dynamics, treating money as a stimulus. Both sides agree Hume is no mercantilist. Both agree money is not wealth itself. To move beyond exegesis into economics, we have constructed a shared thought experiment—the Quarantined Mint—and agreed to let our predictions stand or fall by its logic. This document records where we stand together, where we divide, and how we propose to settle the score.

  **I. Agreed Claims**
  1.  **Anti-Bullionism:** We agree Hume rejects the notion that a nation's wealth consists in its stock of precious metals. Gold and silver are tools for exchange, not the end goal of policy. Hoarding specie without expanding commerce is futile.
  2.  **Anti-Jealousy of Trade:** We agree Hume argues that enriching neighbors is not a threat but a benefit. Rich partners provide better markets for exports and models for domestic improvement. Trying to beggar others ultimately drains your own specie through price adjustments.
  3.  **Long-Run Adjustment:** We agree on the price-specie-flow mechanism. An excess supply of money raises domestic prices, makes imports cheaper and exports dearer, and causes specie to flow out until equilibrium is restored. In the long run, money quantities determine prices, not real output.
  4.  **The Quarantined Mint Setup:** We accept the following scenario as a fair test isolating the velocity of circulation from the total stock. Two identical kingdoms operate on a silver standard with no paper credit, no central bank, and no futures markets. Both receive an identical influx of new silver. In **Kingdom Gradual**, the silver is mined and spent into the local economy over twelve months. In **Kingdom Quarantine**, the silver arrives immediately but is locked in the royal vault for twelve months, then released at once. Both sides agree this holds real resources constant while varying the time profile of monetary injection.

  **II. Disagreements Table**

  | Crux | Neutrality Reading Position | Quickening Reading Position | Shared Evidence / Case | Advance Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Quarantined Mint Outcome** | Money is neutral even in transition; real variables depend on labor and resources, not cash flow timing. | The *path* of injection matters. Gradual spending stimulates labor before prices fully adjust; lump-sum release causes price shocks without output gains. | **Quarantined Mint Scenario.** Compare output and prices in Gradual vs. Quarantine at months 3, 12, and 24. | **NR:** Output identical in both kingdoms at all intervals. Prices rise only after money enters circulation. <br>**QR:** Gradual shows higher employment/output at month 3 and 12. Quarantine shows price spike at month 12 with less output gain. |
  | **2. The Oil Metaphor** | Hume's comparison of money to oil (lubricant) implies it is never a driver. Adding oil does not make the engine work harder, only smoother. | Oil helps the engine start and run faster before heat builds up. The metaphor allows for a temporary power boost during the warming-up phase. | **Hume's Essays.** Passages describing money animating industry versus money merely representing goods. | **NR:** The metaphor commits Hume to strict neutrality; any "animation" is illusory or redistributive. <br>**QR:** The metaphor is compatible with temporary real effects if friction exists in wage/price setting. |
  | **3. Spirit of Industry** | "Quickening the spirit" is rhetorical flourish for resource allocation. It does not denote a causal mechanism that persists. | Habits of industry are real. A monetary shock can awaken latent labor supply or improve skills, leaving permanent gains after prices adjust. | **Historical Episodes.** Periods of sudden specie inflow (e.g., Spanish silver, gold rushes) followed by industrial changes. | **NR:** No permanent gain in work habits once prices normalize. <br>**QR:** Modest permanent gain in capital or labor participation remains after the monetary shock passes. |

  **III. Note on Verbal vs. Real Disputes**
  We distinguish two types of disagreement. The dispute over the **Oil Metaphor** is largely verbal; both sides agree money is not a wheel, but disagree on whether lubricating the axle counts as a real productive contribution during the start-up phase. We will cease arguing over semantics here.

  The disputes over the **Quarantined Mint Outcome** and the **Spirit of Industry** are real. They concern causal mechanisms: does the timing of expenditure change real labor effort before prices adjust? Does a monetary shock leave a permanent scar or improvement on the economy's capacity? These are not matters of emphasis. If Kingdom Gradual shows higher real output at month 12 than Kingdom Quarantine, the Neutrality Reading must concede that short-run non-neutrality is a feature of Hume's system, not a bug. Conversely, if output tracks identically, the Quickening Reading must concede that Hume's "animation" is purely redistributive.

  **IV. Agreed Empirical Tests**
  To resolve the genuine cruxes, we commit to the following tests:

  1.  **The Quarantined Mint Simulation:** As described in Claim 4. We will model these kingdoms using 18th-century parameters (sticky wages, limited credit).
      *   *Neutrality Prediction:* Real wages and employment remain constant in both kingdoms until the money supply totals match, after which prices adjust proportionally.
      *   *Quickening Prediction:* Kingdom Gradual sees a rise in employment and output during months 3–12. Kingdom Quarantine sees no output rise until month 12, followed by immediate price inflation.

  2.  **The Hoarded Tribute Variant:** A foreign power pays a one-time silver tribute to a King.
      *   *Scenario A:* The King spends the silver immediately on road building (hiring local labor).
      *   *Scenario B:* The King locks the silver in a vault for ten years, then spends it on the same roads.
      *   *Neutrality Prediction:* The roads get built in both cases. The economic benefit comes from the roads, not the timing of the silver. The ten-year delay costs nothing but interest.
      *   *Quickening Prediction:* Scenario A boosts the local economy during the construction period because the money circulates among workers who spend it. Scenario B deprives the economy of liquidity during the lock-up, resulting in lower overall industry during the delay, even if the roads are identical later.

  We sign this statement acknowledging that Hume deserves better than caricature. Whether money is merely oil or also a spark, the answer lies in the transition, not just the equilibrium.
