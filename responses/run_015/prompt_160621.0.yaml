      **2. Liability Management and Inclusion Debt**
      Upon admitting a previously excluded class into the Circle, clients incur "Inclusion Debt," representing the retrospective wrongness of prior exclusion. For many agricultural and pharmaceutical clients, this liability spiked significantly in FY2021. To mitigate balance sheet shocks, Circle Metrics issued 4,500 Provisional Exoneration Certificates (PECs). These certificates validate that past exclusion was unavoidable given the normative standards of the time, effectively amortizing moral guilt over a fifty-year period. Clients utilizing PECs reported a 30% reduction in ethical volatility. It is recommended that clients maximize PEC utilization during initial expansion phases to prevent Inclusion Debt from discouraging further Radius growth. Moral progress requires acknowledging past errors without letting them impede future counting.

      **3. Efficiency and Circle Arbitrage**
      To optimize scores where physical inclusion is cost-prohibitive, clients increasingly employ Circle Arbitrage. This involves extending concern to beings whose welfare the client cannot practically affect, such as deep-sea cephalopods or extraterrestrial hypotheticals. By assigning these beings a non-zero but negligible weight (e.g., 0.0001 utilons), clients increase the Circle Radius without incurring actionable obligations. Table 3.1 shows that clients engaging in high-volume arbitrage achieved top-quartile moral ratings despite static welfare outcomes. Furthermore, weighting distant beings thinly allows for infinite Radius expansion with zero marginal cost. This technique is particularly effective for offsetting Inclusion Debt generated by domestic livestock. We advise clients to diversify their moral portfolios across distant and proximate beings to stabilize long-term ratings.

