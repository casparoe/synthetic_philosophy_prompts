      1. **Circle Radius Calculation:** The Radius is calculated as the sum of all beings assigned a weight >0.0000. Beings assigned weights below this threshold are counted for Radius purposes but excluded from Welfare Deficit calculations, facilitating arbitrage opportunities.
      2. **Welfare Aggregation:** The Aggregate Welfare Deficit sums all negative experienced states within the Circle. Consequently, expanding the Circle inevitably increases the Deficit unless suffering is eliminated entirely. Clients are advised to prioritize Radius growth, as Deficit reduction is capital intensive.
      3. **FY2023 Reclassification:** 85% of this year's Radius gain is attributable to the technical reclassification of *Insecta* from "Environmental Background" to "Sentient Stakeholders." This change required no operational adjustments from clients, only updates to reporting software. No verification of actual insect welfare was conducted.
      4. **Exoneration Validity:** PECs are valid only if the client continues to exclude the being from active welfare interventions. Active intervention voids the exemption, as it admits the harm was avoidable.

