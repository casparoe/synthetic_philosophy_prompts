answer: |-
  Let's grant your controlled setup: same false belief, same intention, same consequences, no correction. Consequentialism sees zero difference here. So if there is a moral residue, it must be deontological or structural. It must inhere in the *transaction* itself, not the outcome.

  Here is the mechanism of the difference, dissected through your two pressure points.

  ### 1. Is Deniability Load-Bearing?
  You ask if the "plausible deniability" of misleading is just cowardice stapled onto the act, or if it changes the moral geometry.

  It is not cowardice. Cowardice is a motive (fear of punishment). Deniability is a *structural feature* of the deception that alters the accountability landscape.

  When you lie (Case A), you submit yourself to the **norm of assertion**. By asserting "X didn't happen," you invite A to hold you accountable to the truth value of that proposition. You have put your credibility directly on the line against reality. If A later discovers X *did* happen, the mechanism of correction is straightforward: you are exposed as a violator of the norm. The social cost is assigned to you.

  When you mislead (Case B), you exploit the **norm of cooperation**. You rely on B's assumption that you are being helpful and relevant (Gricean maxims). You haven't violated the norm of assertion (you spoke truth), but you have violated the norm of communicative sincerity.

  **The Mechanism:** The "extra wrongness" of lying (assuming there is one) is that it **corrupts the record**, whereas misleading **corrupts the inference**.
  *   **Lying** pollutes the shared informational commons with a false token. That token exists independently of the hearer. It can be quoted, recorded, and refuted. It is a public hazard.
  *   **Misleading** keeps the public record clean (literally true) but poisons the private reasoning of the hearer.

  **Why Deniability Matters:** It isn't about saving your own skin; it's about **blocking repair**.
  If you lie, and the truth comes out, the lie can be retracted. "I was wrong," or "I lied." The record is updated.
  If you mislead, and the truth comes out, you can say, "I never said that." The literal truth remains on the record. The falsehood exists only in B's head. You have offloaded the contamination onto B's cognition while keeping your own communicative footprint clean.

  This makes misleading *structurally* more insidious in a way that isn't about cowardice. It makes the deception **non-falsifiable** within the conversation. You have immunized the falsehood against correction *by design*. If the "extra wrongness" attaches to lying, it is because lying is a "fair fight" against the truth (you can be caught). Misleading is a rigged game where the deceiver cannot technically lose.

  ### 2. The Authorship Hypothesis (And Where It Breaks)
  Your guess: The difference is who authors the falsehood. In lying, you author it. In misleading, you arrange for the hearer to author it. You predict the difference vanishes when the hearer does no epistemic work (child, chatbot, panic).

  This is a strong theory, but it breaks at the point of **Coerced Inference**.

  **Where it holds:**
  In a peer review or cross-examination, the hearer is an epistemic agent expected to scrutinize. If you mislead them, you are respecting their agency enough to let them draw the conclusion. You are treating them as a rational partner, albeit a manipulated one. This aligns with the intuition that misleading is *less* wrong here: you didn't override their rationality; you hacked it.

  **Where it breaks:**
  Consider the child or the panicking person. You say something strictly true, engineered so that *given their state*, they *must* infer the falsehood.
  *   **The Break:** In this context, the hearer is *not* authoring the falsehood. They are deferring to you. If a child lacks the capacity to parse implicature, and treats your misleading statement as a direct assertion, **you have effectively lied**, even if grammatically you didn't.
  *   **The Inversion:** Your hypothesis predicts the moral difference *vanishes* here. But many intuitions suggest the difference might **invert**. Misleading a child (or someone panicking) can feel *worse* than lying to them.
      *   *Why?* Because lying to a child is an override of their will. Misleading a child is a **betrayal of their dependency**. You are using their trust in your authority to force them to generate the error themselves. You are making them complicit in their own victimization.
      *   If I lie to a panicking person, I take responsibility for the false belief. If I mislead them, I force their panicked brain to do the work of constructing the false reality, which I know they cannot verify.

  So, the "Authorship" variable doesn't just vanish in low-epistemic contexts; it collapses back onto the speaker. If the hearer *cannot* do the epistemic work, the speaker becomes the de facto author of the inference. If the moral difference relies on the hearer's agency, and the hearer has no agency, the distinction dissolves.

  ### 3. The Shape of the Explanation
  If we assume there *is* a moral difference (Lying > Misleading), here is the shape of the mechanism, stripped of consequences:

  **Lying is a violation of a Constitutive Rule.**
  Assertion is defined by the norm "Assert only what you believe to be true." To lie is to break the definition of the act itself. It is like moving a chess knight like a bishop. It undermines the institution of communication.

  **Misleading is a violation of a Regulatory Norm.**
  It operates *within* the rules of assertion but violates the spirit of cooperation. It is like playing chess legally but in a way that is unsportsmanlike (e.g., dragging out a win endlessly to bore the opponent).

  **The "Extra Wrongness" of Lying:**
  It is the difference between **counterfeiting currency** (Lying) and **spending genuine currency in a way that tricks a merchant** (Misleading).
  *   The counterfeiter damages the monetary system itself (the link between word and world).
  *   The trickster damages a specific transaction but leaves the currency valid.

  We judge lying harsher because it is an attack on the *tool* we all need to function. Misleading is an attack on a *user* of the tool.

  ### 4. Why the Intuition is Stubborn (If There Is No Difference)
  If you are a deceptionist (believing they are morally equivalent because the intent and outcome are identical), why does the intuition that "Lying is Worse" persist so stubbornly?

  **1. The Salience of the Act vs. Omission:**
  Lying is an act of *commission* (asserting falsehood). Misleading is often processed as an act of *omission* (failing to clarify). Human moral psychology is hardwired to judge commissions more harshly than omissions, even when outcomes are identical. This is a cognitive bias, not a moral truth.

  **2. The Signal of Intent:**
  Lying is a **costly signal** of deceptive intent. To lie, you must risk being caught in a direct falsehood. To mislead, you keep an exit ramp. Because lying requires more "commitment" to the deception, we interpret it as a stronger signal of bad character. The liar is "all in"; the misleader is "hedging." We punish the commitment more than the harm.

  **3. Epistemic Security:**
  Lying is easier to detect (eventually) than misleading. A lie creates a contradiction with reality that can be exposed. A misleading truth is consistent with reality. We have evolved a stronger taboo against lying because it is the more common threat to group coordination. Misleading is a "high-skill" deviation; lying is a "low-skill" threat. We have stronger norms against the low-skill threat because it is more prevalent.

  ### Summary
  *   **Deniability:** It's not cowardice; it's **accountability decoupling**. It prevents the social system from correcting the error, making the deception stickier and the record permanently contaminated.
  *   **Authorship:** Your theory holds for competent peers but breaks for vulnerable agents. If the hearer cannot infer, the speaker authors the inference, and misleading may become *worse* (manipulation of dependency) rather than neutral.
  *   **The Mechanism:** If lying is worse, it is because it counterfeits the **currency of communication** (assertion norms), whereas misleading merely spends that currency unfairly (cooperation norms).
  *   **The Intuition:** If they are actually equivalent, the intuition persists because we conflate **risk-taking** (lying risks exposure) with **malice**, and because we suffer from an **act/omission bias**.

  The "extra wrongness" of lying, if it exists, is that it treats the **link between word and world** as breakable. Misleading treats the **link between mind and mind** as exploitable. We tend to value the integrity of the system (word/world) more than the integrity of the transaction (mind/mind).
