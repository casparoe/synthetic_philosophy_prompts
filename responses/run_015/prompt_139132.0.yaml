          3.  *Normativity:* In ML, same loss = equally fine. In economics/history, lock-in can be *bad* (suboptimal equilibrium). Does ML vocabulary lack the concept of "worse basin"?
      *   **The Ultimate Question:** Does this analysis help the foundation decide, or is the ML vocabulary just the wrong shape?

  2.  **Analyze the Mapping (ML vs. Economics/History):**

      *   *Mapping 1: Trajectory = Training Run.*
          *   *Pros:* Both involve iterative steps towards an objective.
          *   *Cons:* Training is usually single-agent (or coordinated multi-GPU). Standards adoption is multi-agent (game theory).
      *   *Mapping 2: Loss Landscape.*
          *   *ML:* Fixed function $L(\theta)$. Deterministic given seed.
          *   *Econ/Standards:* Dynamic function. $L_i(\theta)$ depends on $\theta_{-i}$ (what others do). This is the crucial difference (Endogeneity).
      *   *Mapping 3: Lock-in.*
