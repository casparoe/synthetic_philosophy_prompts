      *   *Fudged Translations:* "Global Minimum" (doesn't exist in moving landscape), "Gradient" (in game theory, it's a best-response function).
      *   *Missing Entirely:* Coordination games, network externalities, counterfactual welfare, institutional friction.

  5.  **Address the Foundation's Decision:**

