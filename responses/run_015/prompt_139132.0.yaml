      *   **The Goal:** Translate the economic/historical concept of "path dependence" into ML training vocabulary *honestly*, identifying where the mapping works, where it breaks, and what's missing (the "residue report").
      *   **The User's Mapping:**
          *   Trajectory = Training run.
          *   Path Dependence = Non-convex landscape, seed/data ordering determines basin, high barriers.
          *   Lock-in = Deep basin, walls get steeper over time.
