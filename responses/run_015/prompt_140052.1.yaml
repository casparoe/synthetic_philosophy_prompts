  "The Machine Stops" is the right story for this seminar. It dramatizes the epistemological erosion you describe without reducing human agency to a simple binary, offering a narrative testbed for your framework.

  Forster's world depicts **question-dependence** rather than mere **access-dependence** or **calibration-dependence**. The citizens do not merely lack the tools to produce results; they lack the vocabulary to frame inquiries outside the Machine's ontology. When Vashti swaps "second-hand ideas," she is not checking facts but circulating pre-digested concepts supplied by the system. The fear of "first-hand experience" confirms that the Machine supplies the space of live alternatives, defining what counts as an answer before the question is asked. However, the punishment of "Homelessness" complicates this reading. Homelessness is a severance of **access-dependence**—it removes the physical means of survival—not a revocation of understanding. This implies the story's diagnosis is structural: the system controls the conditions of life so thoroughly that **question-dependence** becomes inevitable. The loss of autonomy is not just cognitive but existential; without access, there is no platform from which to question. The story distinguishes the grades by showing that **access-dependence** is the lever of power, but **question-dependence** is the mechanism of control. The citizens could theoretically survive without the Machine (as Kuno proves), but they cannot conceive of a life worth living without it.

  The catastrophe is primarily a failure of **repair competence**, though **explanatory grip** is also absent. The Mending Apparatus fails, and no one knows how to fix it. The citizens possess neither the ability to notice the system has gone wrong nor the capacity to obtain results another way. Forster treats this loss not merely as the mechanism of punishment but as the offense itself. The civilization is complacent because it has outsourced **repair competence** entirely. While **explanatory grip** is lost—they worship the Machine rather than understanding it—the immediate cause of collapse is the inability to intervene. This aligns with your strongest erosion worry: output is preserved until the moment it isn't, and no one can tell why. The story suggests that without **repair competence**, **explanatory grip** is moot; you cannot understand what you cannot fix. The loss of **repair competence** is the tangible manifestation of the erosion of understanding. It is not enough to know why the Machine works; one must be able to keep it working.

  As a guide to contemporary AI, the story is limited by its depiction of a single monopolistic system. Real dependence involves competing, fallible models used by people who know they are fallible. However, the **no-surviving-yardstick** problem survives the move from monolith to marketplace. If all models train on similar data, the erosion of **question-dependence** occurs across the board, leaving no external vantage point. The **custodial** question shifts but remains vital: in Forster's world, no maintainers exist; in ours, expertise is concentrated among designers. The lesson on redundancy does not survive intact. Forster warns against single points of failure; modern AI warns against convergent failure modes. The story licenses warnings about systemic fragility, but not necessarily about the epistemological cost of using multiple tools. If users switch between models, they may retain **calibration-dependence** checks that Forster's citizens lack. Yet, the **custodial** question remains: if only designers retain **repair competence**, the general public remains in a state of **question-dependence**, vulnerable to the same collapse if the custodians fail or act maliciously.

  Pushing back from the story's side, "The Machine Stops" is ultimately a **fragility** fable rather than an epistemology fable. It concerns single points of failure and the loss of redundancy. This licenses you to say that dependence is dangerous when it eliminates backup systems. It does *not* license the claim that individual understanding is necessary if the system is robust. If the Machine had backups, the lack of **repair competence** would not matter. This challenges the premise that understanding must be widely distributed. The story's implicit axiology values understanding because it constitutes **autonomy**, not merely because it conduces to truth or robustness. Kuno seeks the surface to be free, not to be right. Consequently, the story argues for an **institutional remedy**: keep live competence somewhere, in someone. It does not argue for universal intellectual asceticism, but for a **custodial** class that retains **repair competence** even if the majority does not. The collapse happens because *no one* can fix the Machine, not because *everyone* failed to understand it. This suggests that widespread understanding is less critical than retained institutional capacity. However, the story also hints that a **custodial** class may become complacent over generations, suggesting that **autonomy** must be periodically renewed through dissent.

  For close reading, assign the lecture scene where Vashti delivers her talk. Here, claim that the applause for "second-hand ideas" demonstrates **question-dependence**. The audience cannot evaluate the ideas on merit, only on their alignment with Machine-supplied norms. The vocabulary is entirely derivative, showing how the system supplies the candidate answers and the sense of what counts as an answer. The scene reveals that communication has become a ritual of validation rather than an exchange of knowledge. The students do not learn; they confirm. This illustrates how **question-dependence** corrupts the social fabric of inquiry, turning epistemology into conformity.

  Next, assign Kuno's journey to the surface. Claim that this scene restores **explanatory grip** through direct contact with reality. Kuno learns why the Machine works by seeing what it shields them from. This contrasts with Vashti's **calibration-dependence**, where truth is determined by the Machine's output. Kuno's struggle shows that **repair competence** requires a model of the world that the Machine obscures. By breathing unfiltered air, Kuno gains a yardstick against which to measure the Machine's failures. This scene is crucial for showing that **explanatory grip** requires a reality external to the system. Without the surface, the Machine is the only reality, making the **no-surviving-yardstick** problem absolute.

  Finally, assign the final collapse where the citizens pray to the Machine. Claim that this demonstrates the total loss of **repair competence**. When the lights fail, they do not troubleshoot; they worship. This scene illustrates the **no-surviving-yardstick** problem: they have no memory of a world without the Machine to compare against. Their credibility runs through the system even as it dies. The prayer is not a request for help but an admission that no human action can suffice. It marks the final surrender of **repair competence** to the system. The story ends not with a bang, but with a whisper of dependency, showing that the loss of understanding is also the loss of the will to survive.

  Reading "The Machine Stops" adds affective weight to the debate that arguments alone cannot provide. Philosophical distinctions between **access-dependence** and **question-dependence** are abstract; Forster makes them visceral. The story shows what it feels like to lose **repair competence**—the panic, the confusion, the reliance on prayer. It transforms the **custodial** question from a policy issue into a moral crisis. By dramatizing the collapse, it forces students to confront the stakes of erosion not as a theoretical degradation of knowledge, but as an existential vulnerability. The story reminds us that epistemology is not just about truth conditions, but about survival conditions. It compels the class to ask not just whether AI degrades understanding, but whether we can survive the loss of it.
