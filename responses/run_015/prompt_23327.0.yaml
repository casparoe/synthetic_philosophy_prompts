      *   *Implication 2: Safety & Alignment.*
          *   Etiological: Focus on keeping the model within training distribution.
          *   Causal: Focus on monitoring actual behavior regardless of training intent (instrumental goals).
      *   *Implication 3: Interpretability & Debugging.*
          *   Etiological: "Why did this fail?" -> "Data mismatch."
          *   Causal: "Why did this fail?" -> "Mechanistic interference."
      *   *Implication 4: Emergent Capabilities.*
          *   Etiological: Emergent abilities are accidental, not functions.
          *   Causal: Emergent abilities *are* functions if they contribute to system goals.

  6.  **Addressing the "Just Academic?" Question:**
