      To: Scarce Interventions Panel
      From: [My Name/Role]
      Date: [Current Date]
      Subject: Funding Recommendation – Cycle 4 Applications

      This memo recommends funding the Harrow Vale persistent-pain service in full and deferring the Kestrel House application. I reach this conclusion reluctantly, acknowledging the significant measurement uncertainties highlighted by our analyst and raised by Tom regarding interpersonal utility comparisons. However, given the constraint that unspent funds revert to the centre and patients face a nine-month wait upon deferral, inaction carries a tangible health cost we cannot ignore.

      Our primary instrument, the personal ladder, fails to provide a common metric. As the analyst confirmed, a point gain for Harrow patients does not equate to a point gain for Kestrel patients. The cohorts value clinical states differently, and their anchors (personal worst/best months) are not standardized. Tom is correct that summing these scores assumes comparability we do not possess. Consequently, we cannot publicly claim that Harrow patients are objectively less severe, nor that Kestrel gains are objectively more valuable. Any claim of clinical superiority based on these scores would be misleading.

      Despite this, we must allocate the budget. Deferring both to design a new instrument wastes the current allocation. The money returns to the centre, and 520 patients wait another year. This violates our duty to utilize available resources for immediate relief. A coin flip, while philosophically consistent with the measurement error, abdicates our stewardship role. We are tasked with maximizing health gain within a fixed budget. Even accepting the analyst's multiplier—where one Harrow point might be worth up to 2.4 Kestrel points—the aggregate gain of 450 patients at Harrow outweighs the intensive gain of 70 patients at Kestrel. Harrow offers a lower cost per patient (£1,666 vs £18,571) and broader reach. In the absence of comparable utility data, headcount and cost-effectiveness remain the only defensible tie-breakers that minimize opportunity cost.

      Regarding communications, transparency is vital. We cannot tell the public that Harrow patients "benefit more" in clinical terms. Our public statement must focus on capacity: "Given fixed resources, this decision enables support for 450 individuals rather than 70, maximizing the reach of this cycle's budget." We must admit the instrument limitations without undermining confidence in the panel.

      To the Kestrel patients and providers, we must be direct. Their need is not in doubt, nor is the intensity of their suffering. The letter should state: "Your application was clinically compelling, particularly regarding individual gain. However, the panel cannot verify comparative severity across conditions using current tools. With funds reverting if unspent, we prioritized volume of access this cycle. We are committed to reviewing your application immediately upon instrument revision." We should offer individual care navigation support to mitigate the nine-month delay, though we cannot fund the programme itself.

      This decision forces a change in our process. We cannot repeat this cycle with the same instrument. We will commission a revision of the personal ladder to include common clinical anchors alongside personal ones. This will allow us to map scores to objective states, reducing the reliance on subjective baselines that reward those with worse past histories. The analyst will draft specifications by 15 November. We will pilot the revised instrument with both cohorts by 1 March. Full implementation is targeted for the next funding cycle opening in June.

      This choice is imperfect. It privileges breadth over depth because our tools cannot measure depth across different conditions fairly. But waiting for perfect tools while funds expire harms everyone. We proceed with Harrow to secure immediate gains for the greater number, while committing to fix the measurement gap for future decisions.

      Verdict: Harrow Vale

