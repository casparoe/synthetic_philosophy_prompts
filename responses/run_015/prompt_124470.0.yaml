      Actually, **Deferral** might be the most intellectually honest choice if the instrument is fundamentally broken (incommensurable values). But the prompt says "weigh that honestly rather than treating defer as the tidy option." The cost is money reverts + 9 month wait. That's huge.
      If I recommend Harrow, I can say "We proceed despite uncertainty because waiting harms everyone."
