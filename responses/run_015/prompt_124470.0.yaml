  This choice is imperfect. It privileges breadth over depth because our tools cannot measure depth across different conditions fairly. But waiting for perfect tools while funds expire harms everyone. We proceed with Harrow to secure immediate gains for the greater number, while committing to fix the measurement gap for future decisions.

