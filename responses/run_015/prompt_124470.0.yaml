  To: Scarce Interventions Panel
  From: Panel Chair
  Date: 24 October 2023
  Subject: Funding Recommendation – Cycle 4 Applications

  This memo recommends funding the Harrow Vale persistent-pain service in full and declining the Kestrel House application for this cycle. I reach this conclusion reluctantly, acknowledging the significant measurement uncertainties highlighted by our analyst and raised by Tom regarding interpersonal utility comparisons. However, given the constraint that unspent funds revert to the centre and patients face a nine-month wait upon deferral, inaction carries a tangible health cost we cannot ignore.

