  Despite this, we must allocate the budget. Deferring both to design a new instrument wastes the current allocation. The money returns to the centre, and 520 patients wait another year. This violates our duty to utilize available resources for immediate relief. A coin flip, while philosophically consistent with the measurement error, abdicates our stewardship role. We are tasked with maximizing health gain within a fixed budget. Even accepting the analyst's multiplier—where one Harrow point might be worth up to 2.4 Kestrel points—the aggregate gain of 450 patients at Harrow outweighs the intensive gain of 70 patients at Kestrel. Harrow offers a lower cost per patient (£1,666 vs £18,571) and broader reach. In the absence of comparable utility data, headcount and cost-effectiveness remain the only defensible tie-breakers that minimize opportunity cost. Tom's objection holds weight, but stewardship requires a decision, not randomness, when resources are perishable. Public trust erodes if we appear to gamble with fixed funds rather than applying consistent prioritization criteria, even imperfect ones.

  Regarding communications, transparency is vital. We cannot tell the public that Harrow patients "benefit more" in clinical terms. Our public statement must focus on capacity: "Given fixed resources, this decision enables support for 450 individuals rather than 70, maximizing the reach of this cycle's budget." We must admit the instrument limitations without undermining confidence in the panel.

  To the Kestrel patients and providers, we must be direct. Their need is not in doubt, nor is the intensity of their suffering. The letter should state: "Your application was clinically compelling, particularly regarding individual gain. However, the panel cannot verify comparative severity across conditions using current tools. With funds reverting if unspent, we prioritized volume of access this cycle. We are committed to reviewing your application immediately upon instrument revision." We should offer individual care navigation support to mitigate the nine-month delay, though we cannot fund the programme itself.

