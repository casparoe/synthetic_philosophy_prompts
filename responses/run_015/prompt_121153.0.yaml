prompt: |-
  Hey, act like a philosophy prof who specializes in value theory and metaphysics of death. Before you jump in, do a quick brainstorm of teh key moves in this debate. Then go through my friends' exchange step by step and adjudicate each point -- dont just say who wins overall.

  So Maya and Leo from my study group got stuck on whether death is actually bad for you. Maya started with teh Epicurean line: death is nothing to us, since when we're alive death isnt present, and when death is present we arent. She added teh symmetry argument -- nobody mourns not being alive in 1700, so why fear not being alive in 2100? Leo said that misses a real asymmetry. Before birth there was no subject with projects; after death there was one. The harm isnt feeling dead, he said, its deprivation of goods that belonged to this specific life. Maya pushed back: deprivation needs a subject. You cant harm someone who doesnt exist. Leo replied we still say it was bad for Jane that she died young without assuming Jane is currently suffering somewhere. Maya then introduced something she called "narrative harm" -- dying young doesnt just cut off future pleasure, it can retroactively undermine teh point of past efforts, like spending twenty years building a community garden meant to mature in thirty and dying at year twenty-five. Leo said thats just metaphor: dead people dont have interests in legacy, and "pointlessness" is a judgment made by teh living. Maya said thats missing teh point; teh harm is to teh life-story as a whole, not to a feeling subject. Leo then asked: if death isnt bad, why is a young musician dying before finishing a symphony tragic, while a never-existing musician isnt? That asymmetry, he said, shows we care about depriving a specific life, not about absence in general. They went in circles. Can you rate each move from clearly mistaken to clearly right, say where both are missing something, and tell me whos more right overall? Go move by move through teh actual exchange.
