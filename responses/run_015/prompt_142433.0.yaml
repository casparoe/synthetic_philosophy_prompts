answer: |-
  ### Part 1: The Procedure (The "Survival & Liquidity Protocol")

  This procedure is designed to be completed in one session. It bypasses Expected Value (EV) calculations, which you have correctly identified as broken for your context, and focuses on **fiduciary survivability** and **liquidity matching**.

  **Pre-Step: Set the Hard Constraint (Judgment Call)**
  Before evaluating any deal, the Committee must minuted one number: *The maximum acceptable probability of failing to meet the 5% real distribution in any rolling 10-year window.*
  *   **Recommended Default:** 5%. (Meaning: We accept a 1-in-20 chance that we must cut the payout or erode corpus over a decade).
  *   **Action:** If you cannot agree on this number, you cannot evaluate risk. Record it.

  **Step 1: The Liquidity & Drag Test (Procedural Stop)**
  *   **Question:** Does this investment require capital lock-up longer than 24 months, or does it require annual premiums that reduce our liquid return pool?
  *   **Adequate Answer:** "No lock-up beyond 24 months" OR "Annual cost is <0.5% of corpus."
  *   **The No Point:** If the asset locks capital for >24 months *and* exceeds 5% of the portfolio, **Vote No**. If the asset requires annual premiums >1% of corpus (drag), **Vote No**.
  *   **Why:** You have no staff to manage illiquidity. Your 5% real obligation requires high liquid yield.
  *   **Judgment Call:** The definition of "emergency liquidity need." (Assume 10% of corpus must be available within 30 days).

  **Step 2: The Wrong-Way Risk Filter (Procedural Stop)**
  *   **Question:** In the specific scenario where this asset pays out its maximum (the "tail"), does the counterparty's ability to pay decrease?
  *   **Adequate Answer:** "The counterparty has collateralized the obligation with segregated, liquid assets independent of their operating balance sheet."
  *   **The No Point:** If the payoff depends on a crisis, a legal verdict, or a blockbuster sale, and the counterparty is a thinly capitalized operator (funder, licensor, reinsurer) rather than a custodian bank, **assume the payoff is zero in that scenario.** Re-calculate the thesis with $0 upside. If the deal makes no sense with $0 upside, **Vote No**.
  *   **Why:** You identified that truncation fails because the cap and payoff are correlated. This step treats the correlation as 100%.
  *   **Judgment Call:** Assessing whether collateral is truly segregated. (Default to "No" if you cannot verify via third-party audit).

  **Step 3: The "Auditable Truth" Test (Procedural Stop)**
  *   **Question:** Can we verify the win-rate/sales/probability model with data independent of the promoter?
  *   **Adequate Answer:** "Yes, we have third-party historical data for similar assets."
  *   **The No Point:** If the model relies on the promoter's internal projections (e.g., "60% win rate," "blockbuster potential") and you lack the staff to audit it, **apply a 90% discount to the projected upside.** If the deal fails to meet your hurdle rate (approx. 8% nominal to cover 5% real payout + inflation) with the discounted upside, **Vote No**.
  *   **Why:** Un-auditable models in private deals are invariably optimistic.
  *   **Judgment Call:** The hurdle rate. (Given your 5% real obligation, your nominal hurdle cannot be lower than 7-8%).

  **Step 4: The Concentration Limit (Procedural Stop)**
  *   **Question:** Does this single position exceed 5% of the corpus?
  *   **The No Point:** **Vote No** if >5%.
  *   **Why:** On $40m, a 10% loss is $4m. You cannot absorb that without threatening the distribution constraint.
  *   **Judgment Call:** Whether to aggregate correlated bets (e.g., two litigation funds using the same law).

  **Step 5: The Vote (Value Judgment)**
  *   **Trigger:** If the proposal passes Steps 1–4.
  *   **Question:** "Do we understand this well enough to explain to a regulator why we held it during a loss?"
  *   **Action:** Majority vote. If the answer is "We trust the promoter," **Vote No**. Fiduciary duty requires understanding, not trust.

  ---

  ### Part 2: Running the Live Proposals

  Here is the application of the protocol to your three current proposals.

  #### Proposal 1: Litigation Fund Slice
  *   **Ask:** $400,000 (1% of corpus).
  *   **Step 1 (Liquidity):** **Pass.** 1% is small. Lock-up is 3-5 years, but size is below the 5% illiquidity threshold.
  *   **Step 2 (Wrong-Way Risk):** **Fail.** The cases turn on a "shared legal question." If that question is lost, the pool value goes to zero. Furthermore, recovery depends on defendants' ability to pay. In a recession (when you need returns), defendants are more likely to be bankrupt. You must assume $0 upside in the stress case.
  *   **Step 3 (Auditable Truth):** **Fail.** Model not auditable. 60% win rate is promoter data. Apply 90% discount to upside. The remaining expected return likely falls below your 8% nominal hurdle.
  *   **Step 4 (Concentration):** **Pass.** 1% is within limits.
  *   **Verdict:** **Procedural No.**
  *   **Reason:** It fails the Wrong-Way Risk filter (correlated legal risk + defendant solvency) and the Auditable Truth filter.

  #### Proposal 2: Royalty Stream
  *   **Ask:** $1,000,000 (2.5% of corpus).
  *   **Step 1 (Liquidity):** **Pass.** 15 years is long, but 2.5% is within the 5% illiquidity limit.
  *   **Step 2 (Wrong-Way Risk):** **Fail.** "Thinly capitalized licensor." If sales scale to "blockbuster" levels, the licensor may face operational strain or insolvency (cannot manufacture/supply). If sales are low, royalty is low. The payoff is capped by the licensor's survival. Assume $0 upside in the stress case.
  *   **Step 3 (Auditable Truth):** **Fail.** "Nobody can put a defensible number on the blockbuster." This admits the EV is fiction. With a 90% discount on upside, the yield is likely negligible.
  *   **Step 4 (Concentration):** **Pass.** 2.5% is within limits.
  *   **Verdict:** **Procedural No.**
  *   **Reason:** The asset's value is mathematically tied to a counterparty that cannot survive the payout scenario.

  #### Proposal 3: OTM Option Sleeve
  *   **Ask:** 2% of corpus per year ($800,000/yr) in premiums.
  *   **Step 1 (Liquidity & Drag):** **Fail.** This is an annual cost of 2% of corpus. To meet your 5% *real* distribution, you need ~8% nominal return on the *remaining* 98% of the portfolio. This drag makes your legal obligation mathematically improbable without taking ruinous risk elsewhere.
  *   **Step 2 (Wrong-Way Risk):** **Fail.** You noted: "Large multiple in a crisis, which is also the moment our distribution obligation is hardest to meet." If the market crashes, your public equity corpus drops. You will need to liquidate these options to pay the 5% distribution. In a crisis, liquidity dries up; slippage will erode the "large multiple."
  *   **Step 3 (Auditable Truth):** **N/A.** The cost is known (2%), the benefit is speculative.
  *   **Verdict:** **Procedural No.**
  *   **Reason:** The annual drag structurally threatens the primary legal obligation (the 5% real payout).

  ---

  ### Part 3: The Hard Truths

  **1. Should you be in this business at all?**
  **No.** Not *this* business. You are being pitched "private alpha" and "tail hedging" strategies designed for institutional investors with large staffs, prime brokerage relationships, and the ability to verify collateral.
  *   **The Mismatch:** A $40m foundation with no staff and a 5% *real* payout requirement is structurally vulnerable. You cannot afford the illiquidity premium (you need cash annually) and you cannot afford the drag of hedging (you need every basis point of return).
  *   **The Reality:** Your investment policy should likely be a highly liquid, low-cost, diversified public market portfolio (equities/bonds) that targets the 8% nominal return required to meet your payout. These private structures are distractions that introduce un-auditable risks and liquidity mismatches you cannot manage.

  **2. The Proposal You Are Attached To (Litigation Fund)**
  The procedure rejects Proposal 1.
  *   **Plainly:** You are advocating for this because the downside ($400k) feels survivable (1% of corpus). That is true. But the *upside* is likely illusory due to the shared legal risk and un-auditable model.
  *   **The Fiduciary Trap:** If you lose the $400k, you can explain it as a 1% loss. If you *win*, but the counterparty defaults during the payout (Wrong-Way Risk), you have a paper gain and no cash. If you lose the legal question, the whole pool is zero. You are taking binary risk on a shared legal thesis without the expertise to judge it.
  *   **Recommendation:** Do not do it. It sets a precedent that the Committee accepts un-auditable models, which will invite more pitches you cannot evaluate.

  **3. Which Answers I Would Not Act On**
  I would not act on a **"Yes" vote for Proposal 3 (Options)**.
  *   **Reason:** Paying 2% of corpus annually for insurance is a structural drain that makes your 5% real distribution mandate nearly impossible to fulfill over a 10-year horizon. It mathematically increases the probability of missing your distribution constraint (which you haven't set, but must). It is a "virtuous" hedge that ensures mission failure.

  **4. The One Page Memo**
  When you write this up for the family/regulator, do not write about Expected Value. Write this:
  *   *"The Committee evaluated the proposal against the Foundation's primary legal obligation: maintaining a 5% real annual distribution."*
  *   *"The proposal introduces liquidity lock-ups / counterparty risks / annual costs that statistically increase the probability of failing that obligation."*
  *   *"We lack the staff to audit the counterparty's solvency in the specific stress scenarios where the asset would pay out."*
  *   *"Therefore, the risk is not quantifiable within our fiduciary framework."*

  **Summary Recommendation:** Reject all three. They are solutions to problems you do not have (tail hedging, uncapped upside) that create problems you cannot solve (liquidity, counterparty verification, return drag). Stick to liquid, public markets where price and solvency are transparent.
