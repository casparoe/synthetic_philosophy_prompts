  # Taxonomy of Moral Desert and Punishment

  ### The Root Case
  Consider a convicted offender whose violent behavior is traced to a deterministic neural lesion. He expresses sincere remorse and voluntarily requests a longer, stricter confinement as a form of self-correction.

  ### The Decision Tree

  **1. Root Question: The Nature of the Request**
  Does granting the offender's request for stricter confinement treat him with the respect due to a moral agent who genuinely *deserves* harsher conditions, or does it merely apply a therapeutically appropriate intervention for his safety and ours?
  *   **Left (Desert):** He deserves it; respect requires acknowledging his liability.
  *   **Right (Therapy):** It is an intervention; respect requires minimizing harm regardless of liability.

  ---

  **2. Branch A (Desert) → Question (i): Determinism and Control**
  Does the deterministic neural lesion undermine the control required for him to be the true source of his actions, or can he still be responsible despite the physical cause?
  *   **Left (Undermined):** The lesion removes sourcehood; he is not truly responsible. *(Leads to Incoherence)*
  *   **Right (Compatible):** He retains control; the lesion explains but does not excuse.

  **3. Branch A-Right → Question (ii): Justification of Severity**
  Is the severity of his confinement justified because he has forfeited rights through past wrongs, or because it coordinates future social safety?
  *   **Left (Backward):** He forfeited rights; the past act dictates the punishment.
  *   **Right (Forward):** Social safety dictates the punishment; the past act is only a trigger.

  **4. Branch A-Right-Left → Question (iii): Quarantine and Gravity**
  If we limit confinement to risk management, does setting severity based on the *gravity* of the past act inevitably disguise retributive desert as safety?
  *   **Left (Collapses):** Yes, tracking gravity smuggles in retributivism.
  *   **Right (Distinct):** No, gravity signals risk or normative boundaries without desert.

  **5. Branch A-Right-Right → Question (iv): Expressive Recognition**
  Can a forward-looking system express condemnation that recognizes the victim's status without secretly relying on the offender's metaphysical desert?
  *   **Left (Smuggles):** No, condemnation implies desert.
  *   **Right (Preserves):** Yes, we can condemn the act without blaming the soul.

  **6. Branch B (Therapy) → Question (v): Procedural Desert**
  Is there a coherent intermediate position where the agent rationally endorses rules that sanction her deterministically, creating a non-retributive reason for punishment?
  *   **Left (Coherent):** Yes, procedural endorsement generates obligation.
  *   **Right (Incoherent):** No, without ultimate responsibility, endorsement is irrelevant.

  **7. Branch B-Left → Question (v-b): Application to Lesion**
  Does this procedural endorsement remain valid even when the specific violation was caused by a neural lesion beyond the agent's rational control?
  *   **Left (Valid):** Yes, the rule applies regardless of the specific cause.
  *   **Right (Void):** No, the lesion voids the procedural link.

  ---

  ### Terminal Leaves

  **Leaf 1: Hard Incompatibilist Retributivism** (Branch A-Left)
  *   **Core Claim:** The offender cannot deserve punishment due to the lesion, so granting his request is a category error.
  *   **Awkward Commitment:** It must deny the intuitive force of the offender's own sincere request for accountability.
  *   **Status:** **Incoherent.** *Diagnosis:* It asserts a desert-based framework while simultaneously denying the control condition necessary for desert.

  **Leaf 2: Traditional Retributivism** (Branch A-Right-Left-Left)
  *   **Core Claim:** The offender deserves stricter confinement because the lesion does not negate his forfeiture of rights.
  *   **Awkward Commitment:** It must accept that physically determined agents can metaphysically forfeit rights.
  *   **Status:** **Defended.** *Diagnosis:* Standard libertarian or strong compatibilist retributivism (e.g., Moore).

  **Leaf 3: Normative Signaling Retributivism** (Branch A-Right-Left-Right)
  *   **Core Claim:** Confinement tracks the gravity of the act to signal normative boundaries, not to inflict deserved suffering.
  *   **Awkward Commitment:** It struggles to explain why the offender, rather than a dangerous animal, is the target of the signal.
  *   **Status:** **Unexplored but Coherent.** *Diagnosis:* A hybrid view attempting to keep retributive proportions without retributive metaphysics.

  **Leaf 4: Expressive Compatibilism** (Branch A-Right-Right-Right)
  *   **Core Claim:** We may condemn the offender to recognize the victim, provided we do not claim the offender could have done otherwise.
  *   **Awkward Commitment:** It risks sounding like empty rhetoric if the condemnation carries no blame.
  *   **Status:** **Defended.** *Diagnosis:* Aligns with Dennett-style pragmatic responsibility and communicative theories.

  **Leaf 5: Pure Consequentialist Deterrence** (Branch A-Right-Right-Left)
  *   **Core Claim:** Punishment is justified solely by future safety; any expression of condemnation is merely instrumental.
  *   **Awkward Commitment:** It permits punishing the innocent if doing so maximizes social coordination.
  *   **Status:** **Defended.** *Diagnosis:* Classic utilitarianism, often rejected for violating rights constraints.

  **Leaf 6: Procedural Desert (Universal)** (Branch B-Left-Left)
  *   **Core Claim:** The offender is bound by the sanctions because he rationally endorses the system, even if the lesion caused the breach.
  *   **Awkward Commitment:** It holds an agent to rules they physically could not follow in this instance.
  *   **Status:** **Unexplored but Coherent.** *Diagnosis:* A contractualist extension that prioritizes rule-endorsement over specific act-control.

  **Leaf 7: Procedural Desert (Limited)** (Branch B-Left-Right)
  *   **Core Claim:** Procedural endorsement binds the agent generally, but the neural lesion creates a specific exemption.
  *   **Awkward Commitment:** It creates a slippery slope where any physical cause might void procedural obligations.
  *   **Status:** **Unexplored but Coherent.** *Diagnosis:* Attempts to balance systemic stability with individual excusing conditions.

  **Leaf 8: Hard Determinist Quarantine** (Branch B-Right)
  *   **Core Claim:** The offender is not responsible; confinement is strictly for risk management, like containing a virus.
  *   **Awkward Commitment:** It treats the remorseful agent identically to a non-remorseful carrier, ignoring moral growth.
  *   **Status:** **Defended.** *Diagnosis:* Aligns with Caruso's public-health model of criminal justice.

  ---

  ### Meta-Analysis of Taxonomic Limits

  This tree cannot cleanly separate **Leaf 3 (Normative Signaling)** and **Leaf 4 (Expressive Compatibilism)**. Both answer "No" to smuggling desert and "Yes" to preserving recognition, yet they diverge on whether the *proportionality* of punishment must track past gravity (Leaf 3) or future utility (Leaf 4). This divergence stems from an **unmeasured normative weighting**: the tree captures the *source* of justification (backward vs. forward) but fails to capture the *constraint* on severity (proportionality vs. efficiency). Consequently, two agents could share every theoretical commitment in this taxonomy yet disagree on the sentence length for the neuroengineered offender, revealing that the distinction between "signaling boundaries" and "expressing recognition" is pragmatically unstable without a sixth node measuring the weight of proportionality constraints.
