      *   *Q1: Age-Period-Cohort (APC) Problem.* Yes, it's a mathematical identifiability issue. $Cohort = Period - Age$. You can't statistically separate them perfectly without strong assumptions. *However*, you can look for "breaks" in the slope rather than linear trends. If attitudes jump at a specific birth year and stay different as they age, that's cohort evidence. It's not undecidable, just hard.
