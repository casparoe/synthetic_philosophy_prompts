      *   *Opening:* Do not start with Moore. Start with the *regress of justification*.
      *   *Core Case:* "This measuring device is accurate." (Exhibits: Certainty, foundational role. Lacks: Independent verification within the system).
      *   *Ontology:* Practical/Logical Stance (Rules of the game).
      *   *Misconceptions:*
          *   Hinges = Priors (Head off at Bayes rule introduction).
          *   Hinges = Hyperparameters (Head off during Core Case).
          *   Hinges = Dogma/Conspiracy (Head off during Ontology).
