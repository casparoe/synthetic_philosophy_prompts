  *(Self-Correction on "Residue")*: The user asks: "Where is your reasoning most likely to be wrong?" I need to identify a specific vulnerability in my own translation. Probably in how I characterize the Anti-Reductionist view as "operational." It's not operational; it's normative. I need to admit I'm forcing a square peg (normative rights) into a round hole (risk assessment).

