answer: |-
  There is no single, canonical term in the systematic literature that captures this exact *cyclical* phenomenon of genomic splitting followed by ecological lumping. While the individual components are well-named (cryptic species, taxonomic inflation, integrative taxonomy), the specific *temporal instability* driven by the discordance between coalescent history and reproductive reality lacks a dedicated moniker.

  However, this pattern is a recognized manifestation of the **Species Problem** exacerbated by high-throughput sequencing. It is frequently discussed under the umbrella of **"Species Concept Discordance"** or the **"Gray Zone of Speciation,"** but these terms describe the *state* of ambiguity, not the *sociological and methodological cycle* you have identified.

  Below is the carving you requested: a precise definition of the phenomenon, its distinctions from related concepts, its boundary conditions, and a proposed term to capture the dynamic.

  ---

  ### 1. Differentiation from Existing Concepts

  To isolate this pattern, we must distinguish it from three commonly conflated terms:

  *   **Taxonomic Inflation:** This implies a motive (conservation funding, prestige) or a methodological error (lowering thresholds arbitrarily) to increase species counts.
      *   *Distinction:* In your pattern, the initial split is not necessarily malicious or erroneous; it is a logical inference from valid genomic data under the *General Lineage Concept* (divergence = lineage = species). The "inflation" is a byproduct of resolving population structure, not a goal.
  *   **Cryptic Species Discovery:** This refers to the identification of reproductively isolated lineages that lack morphological differentiation.
      *   *Distinction:* True cryptic species satisfy the Biological Species Concept (BSC); they do not interbreed freely. Your pattern describes lineages that *fail* the BSC upon closer inspection. They are "cryptic populations," not "cryptic species."
  *   **Integrative Taxonomy:** This is the methodological prescription (combining morphology, genetics, ecology) intended to *prevent* unstable classifications.
      *   *Distinction:* Your pattern describes the *failure mode* of integrative taxonomy when the data streams contradict. It occurs when genetics are integrated *before* ecology, forcing a split that ecology later contradicts.

  ### 2. The Carving: Defining the Phenomenon

  If we are to name this, we must define its edges. This is not simply "uncertainty"; it is a specific trajectory of knowledge production.

  **Definition:**
  A **Delimitation Hysteresis** occurs when high-resolution phylogenomic data identifies historically isolated lineages (coalescent units) which are elevated to specific status, but subsequent functional or reproductive data reveals that these lineages retain genomic permeability (gene flow) and ecological equivalence, necessitating a reversion to subspecific or population status.

  **The Mechanism:**
  1.  **Phase 1 (Genomic Resolution):** Sequencing detects deep coalescent divergence (often due to historical allopatry or strong local selection). Under the *Phylogenetic Species Concept* (PSC) or *General Lineage Concept*, these are distinct species.
  2.  **Phase 2 (Elevation):** Taxonomic revision formalizes the split.
  3.  **Phase 3 (Functional Testing):** Ecological niche modeling or crossing experiments reveal that divergent loci are "islands" in a sea of gene flow, or that reproductive barriers are absent (porous genomes).
  4.  **Phase 4 (Retraction/Stalemate):** The taxonomic status is challenged. If re-lumped, the cycle may restart if sequencing resolution improves further (e.g., moving from mtDNA to RADseq to Whole Genome).

  **Boundary Conditions:**
  *   **The Hard Boundary:** The presence of **sympatric gene flow without fitness loss**. If hybrids are inviable or sterile, the split is valid (Cryptic Species). If hybrids are fertile and gene flow is ongoing despite divergence, the split is unstable (Delimitation Hysteresis).
  *   **The Environmental Correlate:** The divergence must be correlated with environmental gradients (Isolation by Environment) rather than strict geographic barriers. This suggests selection is maintaining divergence at specific loci while neutral gene flow continues elsewhere.
  *   **The Temporal Element:** The instability must be driven by the *sequence* of data acquisition (Genomics $\rightarrow$ Ecology), not simultaneous contradiction.

  ### 3. Proposed Terminology

  Since no standard term exists, I propose **Delimitation Hysteresis** (or **Taxonomic Hysteresis**) to describe this specific cycle.

  *   **Why Hysteresis?** In physics, hysteresis describes a system where the state of the object depends on its history. Here, the taxonomic status depends on *which data arrived first*. If ecology were studied before genomics, the taxon might never have been split. Because genomics arrived first, the taxonomy "overshot" the biological reality and is now lagging back.
  *   **Alternative:** **Phylogenetic Overshoot.** This captures the idea that genomic resolution has outpaced the biological reality of speciation. It implies the genomics saw "too much" history relative to the current reproductive status.

  ### 4. Theoretical Context: The "Gray Zone"

  Your observation aligns precisely with the theoretical framework proposed by Roux et al. (2016), termed the **"Gray Zone of Speciation."**

  *   **The Concept:** Speciation is not a point event but a continuum. There is a range of genetic divergence ($d_{XY}$) where populations are diverging but still exchange genes.
  *   **The Conflict:** Genomic delimitation methods (like GMYC or BPP) often treat lineages in the Gray Zone as distinct species because they model coalescence, not gene flow.
  *   **The Cycle:** Your pattern is the *sociological traversal* of the Gray Zone. Taxonomists split based on coalescence (entering the Gray Zone); ecologists lump based on gene flow (exiting the Gray Zone).

  ### 5. Why This Matters (The "So What?")

  Distinguishing **Delimitation Hysteresis** from simple error is crucial for three reasons:

  1.  **Conservation Policy:** If a taxon is split based on genomics but lumped based on ecology, conservation units (ESUs) may be invalidated, risking protection for distinct adaptive populations that aren't "full" species.
  2.  **Evolutionary Theory:** It highlights that **lineage divergence does not equal speciation.** Marine invertebrates, with high dispersal and large population sizes, often maintain divergence with gene flow for millions of years. Treating them as species imposes a terrestrial, allopatric model on a porous marine reality.
  3.  **Methodological Reform:** It argues for **"Ecological Pre-screening."** Before splitting based on genomics, evidence of reproductive isolation or niche divergence should be a prerequisite, not a post-hoc validation.

  ### Summary

  You have identified a real, recurrent methodological artifact of modern systematics. It is not **Taxonomic Inflation** (which implies motive), nor **Cryptic Speciation** (which implies isolation). It is a **Delimitation Hysteresis**: a cyclical instability caused by prioritizing genealogical divergence over reproductive cohesion in taxa residing within the **Gray Zone of Speciation**.

  The pattern persists because we lack a consensus on whether a "species" is a **branch on a tree** (genealogy) or a **reproductive community** (biology). Until that ontological conflict is resolved, the cycle will continue with every increase in sequencing resolution.
