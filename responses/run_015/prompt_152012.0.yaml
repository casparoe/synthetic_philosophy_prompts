      Meridian hummed. Not just the mag-lev trains, but the people. Seven emotional spectra, color-coded on wristbands: Stoic Blue, Empath Green, Zeal Red. Citizens synced their reflexes to their group, smoothing out friction before it became conflict.

      Kael sat on the plaza steps, violin tucked under her chin. Her wrist was bare. No band. No color.

      "You're dissonant," said the Registrar, standing over her. He wore the calm Grey of the Administrators. "The sensors show your cortisol spikes when the crowd sorrows, then dopamine when they rejoice. You mirror chaos."

      "I mirror them," Kael said, bowing a low C. "That's attention."

      "It's instability," the Registrar corrected. "Weil warned us centuries ago. When people cluster, they stop thinking. They become a organism craving its own preservation. That's why we biometrically sorted them. To stabilize the reflex. But you... you refuse the container."

      "Because the container lies," Kael said. "You call it coherence. I call it flattening. To join a group is to promise you will feel tomorrow what you feel today. That's not loyalty. It's laziness."

      "Without alignment, Meridian fractures. Empath Green clashes with Stoic Blue. We need predictable reflexes to maintain peace."

      "Peace isn't the absence of friction," Kael said, shifting to a minor key. The crowd around them paused. Their wristbands flickered—Green syncing with her sadness, Red flaring with anger at the Registrar. "Peace is the capacity to bear friction without crushing the other. You've outsourced your conscience to a algorithm."

      "And you hoard your conscience," the Registrar snapped. "You claim moral superiority while refusing the burden of collective maintenance. You play for yourself."

      "I play for the truth of the moment."

      "The truth is unstable. The city requires structure." He signaled two Enforcers. "You are hereby designated Unaligned. You will be relocated to the Silence Zones. No instruments. No audience."

      Kael lowered the bow. She looked at the crowd. They wanted to cheer, but their bands restricted unauthorized euphoria. They stood still, trembling with suppressed applause.

      "You saved them from conflict," Kael said softly. "But you killed their capacity to witness."

      She handed over the violin. It wasn't martyrdom; it was simply the end of the song. But as they led her away, she wondered if her refusal was just another kind of pride—a soloist convinced the orchestra was wrong.

