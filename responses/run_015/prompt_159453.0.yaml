answer: |-
  Consider a logistics firm deploying an algorithmic scheduler to minimise delivery latency across its fleet. The model's training data explicitly included fatigue-induced error rates as a cost variable, and the deployment team signed off on a projected 0.5% accident rate among drivers as an acceptable trade-off for efficiency gains. When Driver Evans, adhering strictly to the algorithmically generated route and break schedule, falls asleep at the wheel and strikes a pedestrian, the harm realises the exact statistical expectation filed in the impact assessment. Evans followed every protocol; the developers coded the optimisation function precisely as specified by management; the executives authorised the risk profile knowing the base rates; and the firm accepts vicarious liability in court. Yet, Evans was merely exhausted within permitted limits, the developers built what was requested, and the executives acted within regulatory bounds to maximise shareholder value, leaving no individual agent who appears to deserve moral censure for a death that was priced in but not strictly intended.

  Regarding moral responsibility conditions, Evans fails on **control**, as his physiological collapse was an involuntary response to a mandated schedule he could not legally refuse. The developers fail on **causal contribution**, because their code was inert and harmless until the executives decided to deploy it at maximum intensity. The executives fail on **fair opportunity to have done otherwise**, constrained by fiduciary duties and market competition that penalise deviation from the efficiency optimum. The regulator fails on **foresight**, having relied on aggregated industry data that obscured this specific instantiation of risk. Three treatments emerge: absorptive strict liability treats the harm as a mere cost of business, satisfying tort law but ignoring moral residue; the 'gap exists' view demands compensation and systemic redesign, acknowledging that no individual deserves blame but the outcome is unacceptable; the moral crumple zone unfairly assigns blame to Evans to satisfy the psychological need for a culpable agent.

  The case generates a genuine responsibility gap. The single feature doing the work is the **fragmentation of agency across compliant roles**, where each actor satisfies local normative requirements while collectively producing harm. If you remove this feature by consolidating decision-making power in a single human manager who manually approves each shift, blame lands cleanly on them for authorising the specific risky schedule. The theorist who comes out worst is the Moral Skeptic who denies gaps exist; they would attack the scenario by arguing that the executives' voluntary acceptance of the risk profile constitutes sufficient control and opportunity to ground blame, asserting that 'compliance' is merely a shield for chosen indifference.
