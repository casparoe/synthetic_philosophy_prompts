prompt: |-
  hey — I'm a junior and I run this tiny interview series for my school's science-and-philosophy club where I get one grad student on zoom for ~40 minutes and we just grind on their pet idea. Next week's guest is a masters student who's writing about typogenetics — the invented system from Hofstadter's Gödel, Escher, Bach where strands of letters get read in triplets into "amino acids", each amino acid folds into a little enzyme, and the enzymes go back and cut, copy, delete, insert, switch and slide along strands, so eventually you can get a strand whose enzymes build a copy of that very strand — and his angle is the DNA–Gödel isomorphism: the claim that this base-to-codon-to-amino-acid-to-enzyme chain is the same kind of trick as Gödel numbering, so a self-replicating strand is basically molecular biology doing a self-referential sentence. He's nice but slippery: whenever I push him he says something like "the mapping is doing real work, it's not just decorating the biology" and then restates how strands code for enzymes and enzymes act on strands, and I never actually get anywhere. Also my friend who does competitive programming keeps saying the whole self-replication thing is just Kleene's recursion theorem with extra steps, and I want to know whether that's a fair jab or whether I should tell him to shut up.

  So I need 8–10 questions I can actually fire at him, ordered, with a follow-up written for the answer he's most likely to give, and a note on which one he's most likely to dodge plus the one-sentence version of the follow-up to use when he does. I want at least: one on what structure the "isomorphism" is even supposed to preserve, given that the genetic code is degenerate (64ish codons onto 20ish amino acids) so it isn't one to one and it's not obvious what the inverse mapping would be; one on whether a self-replicating strand is really the analogue of a Gödel sentence or just of a quine — Gödel's sentence says of itself that it isn't provable, so where's the negation, what plays the role of provability (maybe "producible by some set of enzymes from some starting strand"?), and what an inconsistency or an incompleteness would even look like typogenetically; one on my own worry that the strand doesn't refer to itself at all, I do, sitting there executing the enzymes by hand on paper, so the fixed point might live in the interpreter rather than the system; one on whether the payoff is really incompleteness or rather that tangled-hierarchy/strange-loop idea about rules and objects being on the same level; one on whether any of it has bite for real biology — like whether it says anything about why the code is triplet, or about the Central Dogma thing where sequence information goes out from DNA to protein and not back — or whether it's purely a teaching device; and one pressing the universality point, i.e. if the enzyme set is rich enough to be computationally universal then a self-replicating strand falls straight out of the recursion theorem and isn't surprising at all, so does that deflate the thesis or not. End with one question about what would actually count against him: what argument or observation would make him drop the isomorphism claim rather than just weaken it. And please skip the warmup stuff — no "what got you into this" — and tell me which one I should cut first if we're running out of time. I'll be recording so I mostly need questions that don't let him just recieve his way back into his standard spiel.
