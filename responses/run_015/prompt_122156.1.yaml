      *   **Current State:** User's observations are now valued ("good eyes," "log anything"), but her *interpretations* are dismissed ("leave diagnosis to engineers"). Recently suggested applying logic to another line, told to stick to logging.
      *   **Core Feeling:** Feels used as an "instrument" (sensor) rather than a thinker/partner. Feels a specific injury distinct from just losing an argument or credit theft.
