  2.  **Deconstruct the Core Issues:**
      *   **Epistemic Injustice:** This is the philosophical heart of the problem. Specifically, *testimonial injustice* (credibility deficit due to identity/role) and *hermeneutical injustice* (lack of shared concepts to make sense of experience).
      *   **Role Definition:** The company is implicitly redefining her role from "Operator with Insight" to "High-Fidelity Sensor." Sensors collect data; engineers process data. She wants to be part of the processing.
      *   **Gender & Class Dynamics:** Female, non-graduate vs. Male, graduate. The "graduate scheme" pipeline vs. "shop floor" pipeline.
