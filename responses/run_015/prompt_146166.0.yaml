  5.  **Drafting the Recommendations (Iterative Refinement):**

      *   *Refining Priority 1:* Call it "The Bearer of the Negative Value." Focus on *de dicto* vs. *de re*. If I prevent a class of beings, is the "good" attached to the world state or a potential subject?
      *   *Refining Priority 2:* Call it "Probabilistic Asymmetry." Climate change doesn't prevent existence entirely; it changes the *quality* and *likelihood*. How does the asymmetry weigh a 50% chance of a painful life vs. 100% chance of non-existence?
