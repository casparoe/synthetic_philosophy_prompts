answer: |-
  Good morning, everyone.

  Looking around this room, I see a split. On one side, you have my classmates, who mostly learned history as a timeline of wars, treaties, and presidents. On the other, you have the teachers and researchers who spend their lives studying soil, rainfall, and trade routes. Usually, these two groups don't talk much. But the title of this workshop, "Slow Forces Fast Lives," is basically an invitation to bridge that gap.

  It's impossible to talk about this without talking about Fernand Braudel. He argued that most of what we call "history" is just noise—the foam on top of the wave. The real movement is deep underwater. He called this the *longue durée*. It's the idea that geography and climate are the stage, and human events are just the play happening on top of it.

  But here's the tension we need to navigate today. My teacher warned me that Braudel got criticized for making people feel powerless. If geography is destiny, do our choices matter? If slow structures crush everything, why vote? Why protest? Why study history at all?

  I don't think the answer is to choose one side. It's not that climate determines culture, but it's also not true that a single election changes the climate. A leader can't wish away a drought, but they decide how a society survives it. The slow forces don't write the script for us; they build the theater. They set the limits of what's possible.

  So, structures don't just crush agency; they create the conditions for it. We swim in currents. You can't swim upstream forever, but you can choose how you swim, who you help, and where you steer the boat.

  That's what I hope we do for the next few hours. Let's look at the slow forces without ignoring the fast lives. Let's figure out how the deep water shapes the waves, without pretending the waves don't matter.

  Thanks for being here. Let's get to work.
