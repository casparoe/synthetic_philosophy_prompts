answer: |-
  First, take a breath. Three hours on social ontology is intense, and it's normal to feel residual friction. This is one of the hardest problems in the philosophy of action because it sits right at the boundary of metaphysics, ethics, and psychology.

  You and your friend are actually arguing past each other slightly because you are prioritizing different criteria for what counts as "joint action." Your friend is arguing from a **functionalist/externalist** perspective (if the system works, it's joint), while you are arguing from an **internalist/normative** perspective (if the mental states don't align, it's not joint).

  Here is the conceptual logic worked out, specifically addressing the saboteur case, the modes of intention, and the metaphysical status of the failure.

  ### 1. The Core Conceptual Issue: Intention Content vs. Behavioral Output

  The crux of the disagreement lies in what constitutes the "object" of the intention.

  *   **Your Friend's View (Functionalist):** Joint action is defined by the interlocking of *roles* and *observable behaviors*. If the surgeon cuts and the anesthesiologist administers drugs, and the patient survives (or the procedure completes), the social fact of the surgery has occurred. The internal state is a "black box." As long as the public commitment is maintained, the joint action holds.
  *   **Your View (Internalist):** Joint action is defined by the interlocking of *mental states*. Intention is not just behavior; it is a specific psychological orientation toward a goal.

  **The Logic of the Saboteur:**
  For a joint action to exist, most contemporary theories (like Bratman's or Gilbert's) require that the participants intend the *joint activity itself*.
  *   **Surgeon's Intention:** "We intend to save the patient."
  *   **Saboteur's Intention:** "I intend to *simulate* saving the patient so that I can kill them later/collect insurance."

  Notice the content of the intention is different. The surgeon intends **X** (Save Patient). The saboteur intends **Y** (Deceive Surgeon). Even though the *physical movements* are identical, the *action description* under which they are acting is different.

  If joint action requires a "Shared Intention," and a Shared Intention requires reciprocity (I intend that we J, and you intend that we J), the saboteur fails the reciprocity test. They do not intend that *we J*. They intend that *I pretend we J*. Therefore, metaphysically, the "Shared Intention" never formed. It is a simulation of joint action, not joint action itself.

  ### 2. We-Mode vs. I-Mode: Can You Fake the We?

  You asked if we can salvage joint action by saying the betraying party is in *I-mode* while faking *We-mode*.

  *   **We-Mode:** I act because *we* are doing it. The group's goal is my reason for action.
  *   **I-Mode:** I act because *I* want something. The group's goal is merely a tool or a constraint.

  In your scenario, the anesthesiologist is strictly in **I-mode**. They are using the joint plan instrumentally.
  *   **Can joint action exist with mixed modes?**
      *   **Strict View (Tuomela/Gilbert):** No. Full-blown collective intentionality requires all participants to be in the We-mode. If one is in I-mode, it is merely "cooperative action" or "social coordination," not a true joint commitment.
      *   **Loose View (Bratman):** Bratman allows for some I-mode motivation (e.g., I help you paint because I get paid), *provided* I am still committed to the joint activity itself.

  **The Critical Distinction:**
  There is a difference between **Fragmented Commitment** and **Adversarial Intention**.
  *   **Fragmented Commitment:** "I don't care about the patient, I just want my paycheck, but I will do my part to save them." -> This *can* be joint action. The end goal is still accepted; the *motive* is private.
  *   **Adversarial Intention (Your Case):** "I want the patient dead, so I will do my part to make it look like we are saving them." -> This destroys joint action. The end goal is rejected.

  The saboteur isn't just motivated by private reasons (money); they are motivated by a *contradictory* end (death vs. life). You cannot jointly intend a goal that one party secretly intends to negate.

  ### 3. Epistemic Failure vs. Metaphysical Failure

  This is the most important part of your debate. Is the problem that the surgeon *doesn't know* (Epistemic), or that the joint state *doesn't exist* (Metaphysical)?

  **It is Metaphysical.**

  Here is the logic:
  Collective intentionality is a **relational property**. It is like a handshake.
  *   If I extend my hand and you extend your hand, but you secretly keep your muscles limp so we don't actually touch, have we shaken hands?
  *   Your friend says: "To an observer, yes. The social ritual was completed."
  *   You say: "No. A handshake requires mutual pressure. Without that physical reciprocity, the event 'handshake' did not occur, even if it looked like one."

  In the case of intention:
  A "Shared Intention" is not just two parallel "I-intentions." It is a meshed state where my intention depends on yours and vice versa (interdependence).
  If the anesthesiologist holds a counter-intention, the **interdependence is broken**. The surgeon's intention relies on the anesthesiologist's support for the *goal*. The anesthesiologist is not supporting the goal; they are supporting the *illusion* of the goal.

  Therefore, the shared intention literally cannot be formed. It's not that we lack knowledge of it; it's that the necessary conditions for its existence (mutual commitment to the *same* end) are absent. The "We" is an illusion maintained by the "I" of the saboteur.

  ### 4. Why Your Friend Might Feel Right (The "Social Fact" Argument)

  To be fair to your friend, there is a sense in which they are right, but it requires shifting the definition from **Psychological Joint Action** to **Institutional Joint Action**.

  Institutional facts (like a surgery, a marriage, or a trial) often survive individual bad faith.
  *   If a judge secretly hates the law but follows procedure, the trial is still valid.
  *   If the anesthesiologist follows procedure, the *medical institution* recognizes the surgery as having happened.

  Your friend is likely conflating **Systemic Coordination** with **Collective Intentionality**.
  *   **Systemic Coordination:** Parts working together to produce an outcome. (The saboteur fits here).
  *   **Collective Intentionality:** Minds working together to share a goal. (The saboteur breaks this).

  If you define joint action as "successful social coordination," your friend wins. If you define it as "shared mental state of doing-together," you win. In philosophy of action, the latter is the standard definition.

  ### 5. Summary of the Conceptual Logic

  1.  **Intention Content:** The saboteur does not intend "We save the patient." They intend "I simulate saving the patient." Since the content of the intentions differs, they do not share an intention.
  2.  **Mode:** The saboteur is in I-mode regarding the plan (using it as a tool) and adversarial regarding the goal. Joint action generally requires at least a commitment to the goal, even if motives differ.
  3.  **Metaphysics:** The failure is metaphysical. A relation of "sharing" cannot exist if one side is withholding the relevant state. It is not merely that the surgeon is ignorant; it is that the "We" is ontologically incomplete.
  4.  **Fragmented Commitment:** Instrumental participation (doing it for money) is compatible with joint action *if* the goal is accepted. Secret opposition to the goal is *not* compatible.

  ### Verdict

  You are conceptually safer on the standard philosophical account (Bratman, Gilbert, Searle). A hidden counter-intention that opposes the shared goal dissolves the collective intentionality. It reduces the event to **parallel action** or **manipulation**, not joint action.

  Your friend is describing a **functional system**, not a **joint agent**. The surgery *happens* as a biological and institutional event, but it does not happen as a *joint intentional action* between those two specific individuals. The "We" was a fiction sustained by the saboteur's deception.

  You can tell your friend: "You are describing a system that functions *as if* it were joint action. I am describing the mental architecture required *for* it to be joint action. The saboteur breaks the architecture, even if the system keeps running."
