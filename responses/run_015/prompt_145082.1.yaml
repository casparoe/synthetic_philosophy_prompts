      *   *The "Saboteur" Logic:* The saboteur does not share the intention. They share the *behavior*. Joint action requires shared intention, not just shared behavior.
      *   *Metaphysical vs. Epistemic:* It is metaphysical. The *relational property* of "sharing" cannot exist if one side is withholding the relevant mental state. It's like a handshake where one person keeps their hand in their pocket. It looks like a handshake from one side, but it isn't one.

  5.  **Drafting the Response (Iterative refinement):**

