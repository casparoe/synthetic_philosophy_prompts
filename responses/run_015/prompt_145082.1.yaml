          *   *We-mode* vs. *I-mode*.
          *   "Fragmented commitment" (instrumental lock-in vs. normative rejection).
          *   Epistemic failure (other doesn't know) vs. Metaphysical failure (shared intention can't exist).
      *   **Constraint:** Be precise, work out the conceptual logic, don't just dump citations.

  2.  **Deconstruct the Philosophical Landscape:**
      *   This is a classic debate in social ontology (Searle, Bratman, Gilbert, Tuomela).
      *   *The Case:* The "Saboteur" or "Unilateral Defector" case.
      *   *Key Theorists:*
          *   **Michael Bratman:** Focuses on *Shared Intention*. Requires mutual responsiveness, commitment to the joint activity, and *common knowledge* of these states.
          *   **Margaret Gilbert:** Focuses on *Joint Commitment*. Requires a "pooling of wills." Much stricter. A secret defector cannot be part of a joint commitment.
          *   **John Searle:** Focuses on *We-Intention*. "We intend" is primitive. But implies a sense of "doing it together."
          *   **Raimo Tuomela:** Distinguishes *We-mode* (group reason) vs. *I-mode* (individual reason).

  3.  **Address the Specific Conceptual Issues:**

      *   **Issue 1: The Metaphysical vs. Epistemic Break.**
          *   *Friend's view (Externalist/Functionalist):* If the system works, it's joint action. The internal state is irrelevant to the *action description*.
          *   *User's view (Internalist/Normative):* The mental state constitutes the action. If the mental state is wrong, the action type is wrong.
          *   *Analysis:* Most contemporary philosophy of action sides with the User here, but with nuance. If the anesthesiologist intends *not* to save the patient, do they intend *to operate*? They intend to *simulate* operating. This changes the object of their intention.

      *   **Issue 2: We-Mode vs. I-Mode.**
          *   The saboteur is definitely in *I-mode*. They are using the group plan for individual ends (murder/deception).
          *   Can a joint action consist of one *We-mode* agent and one *I-mode* agent?
          *   *Tuomela's view:* Strictly speaking, no. Full joint action requires *We-mode* from all. However, "cooperative action" might exist in a weaker sense.
          *   *Bratman's view:* Requires interlocking intentions. If A intends "We J" and B intends "We J," but B secretly intends "Not J," B does *not* intend "We J." B intends "Pretend We J." Therefore, the interlocking condition fails.

      *   **Issue 3: Fragmented Commitment.**
          *   This is the "mercenary" problem. I do my part for money, not for the goal.
          *   Is this joint action? Bratman says yes, *if* I am still committed to the joint activity itself, even if my *motive* is money.
          *   *Crucial Distinction:* Commitment to the *end* vs. Commitment to the *means*.
          *   In the user's example (saboteur), the anesthesiologist rejects the *end* (patient lives). They only commit to the *means* (administer drugs) to achieve a *different end* (patient dies/payout). This is stronger than fragmented commitment; this is *adversarial* commitment.

      *   **Issue 4: Mutual Openness / Common Knowledge.**
