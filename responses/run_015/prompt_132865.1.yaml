answer: |-
  # Q&A PREPARATION SHEET: Distributional Weighting Proposal
  **To:** Committee Philosopher
  **From:** Strategy Desk
  **Subject:** Full Committee Presentation (3 Weeks)

  ## 1. OPENING CONCESSIONS (First 2 Minutes)
  *Do not wait for these to be raised. Disarm them in your intro.*

  *   **Concede Complexity:** Acknowledge immediately that rank-weighting is computationally heavier than the current Atkinson adjustment. Do not claim it is "simpler." Claim it is *more robust*.
  *   **Concede Normativity:** Admit the weight-ratio parameter cannot be derived from survey data. Frame this not as a bug, but as a feature: "This parameter reflects a democratic choice about inequality aversion, not an empirical fact we pretend to discover."
  *   **Concede Relationality:** State clearly: "Under this proposal, the weight a patient receives depends on their position relative to others. I am not hiding this."

  ## 2. THE ONE REPLY THAT MUST LAND
  **Target:** Methodologist 1 (Separability & Thresholds)
  **Why:** If you cannot explain how this fits the ICER/Threshold machinery, the proposal is operationally dead. The committee will not adopt a method that prevents delegation to lower bodies.

  **The Objection:** "Our entire system relies on separability. We publish a cost-effectiveness threshold ($\lambda$) so local bodies can make decisions without coming back to us. If the value of a QALY depends on the rank order of the patient, the value changes depending on who else is in the queue. We can't publish a static threshold. We can't delegate. You're breaking the machine."

  **The Reply (2 Mins):**
  "You are right that we cannot publish a *single* universal threshold anymore. But we don't need to. We can publish a **threshold function** or a **lookup table** based on severity-rank bands.
  In practice, we already stratify by severity. We simply add a second stratification dimension: 'Priority Band.' We determine the distribution of health in the *eligible population* for that disease area once, centrally. We assign patients to bands (e.g., bottom quartile, top quartile). Within those bands, the weight is fixed.
  This allows us to publish a threshold *per band*. Local decision-makers still just look up the threshold for 'Bottom Quartile Severe Asthma.' They don't need to know the whole national distribution, only which band their patient falls into. We absorb the relational complexity centrally in the guidance; the frontline gets simple rules."

  **Soft Spot:** This requires us to define "eligible population" rigidly. If a new treatment expands the eligible population, the ranks shift, and we have to re-issue guidance. It reduces flexibility.

  ## 3. THE EIGHT OBJECTIONS (In Expected Order)

  ### 1. The Operational Showstopper
  **Who:** HTA Methodologist 1
  **Phrasing:** "You say weights attach to positions. But positions relative to what? The trial population? The national population? If I'm evaluating a drug for a rare disease, are those patients the 'bottom' because they're rare, or the 'top' because they're better off than the severely disabled? If the reference class shifts, the ICER shifts. How do we standardize the reference case?"
  **Reply:** "We fix the reference class as the **national population health distribution**, measured in QALYs. Every patient is ranked against the national average, not the trial cohort. This ensures consistency across disease areas. A rare disease patient is weighted by where they sit nationally, not relative to the other ten people in the trial."
  **Soft Spot:** National data is laggy and imprecise. We will be ranking patients against outdated survey data.

  ### 2. The Empiricist Challenge
  **Who:** Health Economist
  **Phrasing:** "The current inequality-aversion parameter is at least anchored in literature. You're proposing a new parameter—the ratio between bottom and top weights. How do we estimate it? If you can't test it against revealed preference or survey data, this is just moralising dressed up as math. It's unfalsifiable."
  **Reply:** "No parameter in distributional weighting is truly 'empirical.' The current Atkinson parameter is a normative choice disguised as a technical one. I prefer we make the normative choice explicit. We set the ratio via deliberative process—this committee, representing the public—rather than pretending we found it in a regression. It's not unfalsifiable; it's accountable."
  **Soft Spot:** She will view this as an abdication of scientific rigour. She may ally with the Methodologists to block it as 'too political.'

  ### 3. The "Moving Goalpost" Worry
  **Who:** HTA Methodologist 2
  **Phrasing:** "If we use national ranks, and the population gets healthier overall, the weights for the sick change even if their health hasn't. We could end up deprioritizing a chronic condition simply because the rest of the country got fitter. That seems arbitrary."
  **Reply:** "That is a feature, not a bug. It captures the 'Fair Innings' intuition without the lifetime baggage. As society gets healthier, the moral urgency of remaining gaps increases. However, to prevent volatility, we can freeze the reference distribution for 5-year cycles."
  **Soft Spot:** Freezing the distribution creates cliff-edges when we update. It introduces administrative arbitrariness.

  ### 4. The Clinician's Intuition
  **Who:** Clinician Member
  **Phrasing:** "I treat the sickest first. That's the rule of rescue. Your system weights people by their *rank*, not their *absolute need*. If I have two patients, one with 0.1 QALYs and one with 0.2 QALYs, they might get similar weights if they're both at the bottom. But if the 0.2 patient is in a cohort that's generally healthier, they get downweighted. Why should I treat the slightly less sick person over the desperately sick one just because of where they sit in a spreadsheet?"
  **Reply:** "The severity modifier you already use handles absolute shortfall. My proposal adds a layer for *relative* disadvantage. We keep the severity modifier. This ensures the desperately sick get priority both for their absolute loss and their low position. We are stacking protections, not replacing them."
  **Soft Spot:** Double-counting. We might be weighting the same disadvantage twice (once as absolute, once as relative), blowing the budget.

  ### 5. The Egalitarian Trap
  **Who:** Bioethicist
  **Phrasing:** "You claim immunity to the levelling-down objection, but you admit priority is relational. If my weight drops because someone else gets healthier, you are treating equality as a value in itself. You say you care about 'priority,' but your mechanism is purely egalitarian. Why not just admit you want to reduce gaps?"
  **Reply:** "Because I reject levelling down. If making everyone worse off closes the gap, your view might accept it. Mine forbids it. The weights are tools to prioritize the worse off, not to punish the better off. The relational aspect is about *identifying* who needs priority, not about *valuing* equality for its own sake."
  **Soft Spot:** This is a philosophical distinction that may look like hair-splitting to her. She will press that the *effect* is the same.

  ### 6. The "Neighbour" Intuition
  **Who:** Patient & Public Member 1
  **Phrasing:** "Are you telling me that my claim on the NHS goes up if my neighbours get ill? And if a group of sicker people is discovered, my weight goes down? That makes my worth depend on other people's misery. That feels deeply unfair."
  **Reply:** "It feels unfair because it sounds like your *intrinsic* worth is changing. It isn't. Your health need is constant. What changes is the *scarcity of moral attention*. When more people are desperate, we have to triage more strictly. It's not that you matter less; it's that the queue has got longer and more urgent."
  **Soft Spot:** This is emotionally difficult. It sounds like you are telling them they are less important.

  ### 7. The Lifetime Question
  **Who:** Patient & Public Member 2 (aligned with Clinician)
  **Phrasing:** "You mentioned resisting 'fair innings'. But if I've lived 80 years and need a hip, and a 20-year-old needs a hip, your rank system might treat us the same if our current health is the same. Why shouldn't the younger person get priority to complete their life?"
  **Reply:** "Because this committee's mandate is health maximization with distributional concern, not life allocation. We measure health shortfalls, not life totals. Introducing lifetime totals would penalize the chronically ill who have already accumulated low QALYs. We prioritize the current health gap, not the historical ledger."
  **Soft Spot:** This contradicts the "Fair Innings" intuition which is popular publicly. You may look ageist.

  ### 8. The "Hope Nobody Asks" Question
  **Who:** (Silence, or the Chair if they read the paper closely)
  **Phrasing:** "You compare programmes affecting different numbers of patients. If you normalise the weights to sum to one, you ignore population size (the Repugnant Conclusion). If you don't normalise, does the invariance hold when N changes? How do you compare a programme for 100 people vs 10,000?"
  **Reply:** "We sum the weighted QALYs, we do not average. The weights are attached to the *positions* in the affected cohort. Invariance holds because adding a constant to everyone adds the constant times the sum of weights. We accept that larger cohorts generate more total value, provided the distributional profile is maintained."
  **Soft Spot:** **This is your private worry.** If the cohort size changes the weight curve (e.g., the 'bottom' of 100 is different from the 'bottom' of 10), the invariance claim is shaky. *Advice:* If asked, stick to the reply above. Do not volunteer the complexity of how the weight curve scales with N.

  ## 4. ADVICE ON YOUR TWO SPECIFIC WORRIES

  ### Worry 1: Normalization & Population Size
  **Verdict:** This *is* the question you should dread, but it is unlikely to be asked unless the Economist reads your technical appendix.
  **Why:** HTA bodies usually operate with a fixed budget constraint. They compare Cost per QALY. If you switch to "Total Weighted QALYs," you need to know the budget cap to set the threshold.
  **Recommendation:** Do not raise this yourself. If pressed, argue that for HTA purposes, we treat the **affected cohort** as the distribution. We sum weighted QALYs. We do not normalize to 1. This preserves the "Total" view required for budget impact. The invariance holds for affine transformations *within* a fixed N. If N varies, acknowledge it as a limitation of *any* distributional measure, not unique to yours.

  ### Worry 2: Ex-Ante vs. Ex-Post Expectation
  **Verdict:** The room will push you towards **Ex-Ante** (weighting the expected QALY).
  **Why:** Methodologists and Economists work with Expected ICERs. They calculate $\Delta Cost / \Delta Expected QALY$. Ex-Post weighting (simulating the distribution of outcomes, weighting them, then averaging) requires Monte Carlo simulations for every submission. It is computationally prohibitive.
  **Cost:** Ex-Ante weighting ignores risk. It assumes the *expected* rank is the same as the *rank of the expectation*. In small trials, this diverges.
  **Recommendation:** Propose Ex-Ante weighting as the "operational default." Concede that Ex-Post is theoretically purer but operationally impossible. Offer to review this in 5 years when computing power or data infrastructure improves. This shows pragmatism.

  ## 5. STRATEGIC NOTE
  Your proposal solves a philosophical problem (invariance) that the committee does not feel. They feel the problem of **budget constraints** and **operational feasibility**.
  *   **Do not** sell this as "fixing prioritarianism."
  *   **Do** sell this as "stabilizing the severity modifier."
  *   Frame the current Atkinson adjustment as "sensitive to arbitrary zero-points in the QALY scale." Frame your proposal as "robust to scale changes."
  *   If the Methodologists smell that this breaks the Threshold, you lose. If the Economist smells "moralising," you lose.
  *   **Survival Strategy:** Align with the Clinician on "helping the worst off" and the Methodologist on "keeping the threshold usable." Sacrifice the Bioethicist's desire for pure relational equality to keep the Economist on board.

  **Final Check:** Ensure your slide deck has a worked numerical example showing the Atkinson method changing rankings when the zero shifts, and your method holding steady. That is the only visual that matters.
