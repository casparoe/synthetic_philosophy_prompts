      *   *Check:* Is the tone appropriate? *Correction:* Professional, peer-to-peer, analytical.
      *   *Refinement on Wrinkle 1:* Make sure to clarify that the Fermi Paradox *is* the tension between high prior probability of aliens and high probability of detection *if* they exist. The slogan attacks the second term.
      *   *Refinement on Wrinkle 2:* Emphasize that "Evidence of Absence" *is* valid if the search is sufficiently sensitive. The slogan is only true if sensitivity is low.

  9.  **Final Review against constraints:**
      *   Menu of claims? Yes.
      *   Trivial/Substantive/Wrong ratings? Yes.
