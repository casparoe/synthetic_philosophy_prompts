answer: |-
  Great to hear from you and I am delighted to know you have kept your hand in the philosophical soup after retiring from the lab, because honestly this is one of those questions that separates the people who just calculate the tensor components from the ones who actually wonder what the tensor is telling us about the world. It is a fantastic analogy you have drawn with quantum indistinguishability, and I can see exactly why it nags at you, since on the surface both cases involve a permutation of entities that leaves some gross features invariant while potentially altering the underlying state, but I am afraid the analogy breaks down precisely where the metaphysical weight of the entities in question is concerned, and once we see that crack the whole worry about determinism dissolves just as Einstein eventually convinced himself it did.

  The core of the issue here is that you are treating spacetime points as if they are members of a set of objects that exist independently of the relations they bear to one another, much like electrons in a box, but in general relativity the points are not objects in that sense at all. When you swap two electrons in quantum mechanics, you are performing an operation on the state vector in Hilbert space, and the physical significance of that swap comes from the fact that the wavefunction is an observable structure in the sense that its symmetry properties dictate empirical outcomes like interference patterns or statistical distributions. The particles are excitations of fields or distinct loci of properties, and their indistinguishability is a constraint on the allowed states of the system, meaning the permutation operation maps a physical state to a physically distinct state if the statistics are fermionic, or to the same state if bosonic, but in either case the operation is defined relative to a background spacetime that remains fixed. In the hole argument, however, the permutation is a diffeomorphism, which is a smooth reshuffling of the manifold points along with the fields defined on them, and there is no fixed background stage left over to measure the change against.

  If you try to run the quantum analogy in the context of the hole, you are implicitly assuming that the points inside the hole have some form of haecceity or this-ness that persists across the permutation, such that point p before the shift is the same entity as point q after the shift, even if the metric field values have moved. But this is exactly the substantivalist assumption that the gauge argument is designed to reject. In the gauge interpretation, which I hold to be the only coherent reading of the mathematics, the points do not have any identity independent of the metric field and matter fields coinciding at those locations. So when you perform the active diffeomorphism that creates the hole argument ambiguity, you are not moving the metric field relative to the points, you are merely generating a different mathematical description of the very same physical situation. There is no empirical test, no interference experiment, and no observable quantity that can distinguish between the original metric configuration and the diffeomorphically shifted one because all scalar invariants and all coincidence events remain exactly where they were relative to each other.

  This is where your quantum comparison hits a wall, because in the quantum case the exchange of particles leads to observable consequences precisely because the particles are distinguishable by their trajectories or interactions prior to the exchange, or else their indistinguishability imposes a symmetry constraint that is itself observable in the statistics. With spacetime points, there is no prior trajectory, no charge, no mass, and no independent identity to track. To say that permuting them yields a physically distinct configuration is to commit what we call the Leibniz shift error, where you imagine that God could have shifted the entire universe five feet to the left and created a different world, when in fact without external reference points such a shift is meaningless. In the hole argument, the region is matter-free, so there are no coincidences inside the hole to begin with, and the boundary conditions outside fix the geometry only up to diffeomorphism, which is not a failure of determinism but a feature of gauge theories.

  Think about electromagnetism for a moment, since you know that territory well. The vector potential A_mu is not uniquely determined by the charge and current distributions unless you fix a gauge, and if you refused to identify gauge-equivalent potentials as the same physical state you would conclude that electrodynamics is indeterministic. We do not say that the photon has extra degrees of freedom hidden in the gauge choice, we say the gauge freedom is descriptive redundancy. General relativity is exactly the same but with the spacetime structure itself serving as the gauge field. The determinism worry only arises if you demand that the theory predict which mathematical representative of the equivalence class nature will choose, but physics never predicts the gauge, it only predicts the gauge-invariant observables. Once you accept that spacetime points are not physical individuals but merely indices in the coordinate bookkeeping, the infinite solutions inside the hole collapse into a single physical history.

  I will concede that this becomes trickier when you start looking at quantum gravity, where the smooth manifold structure might break down and some discrete pre-geometric elements might emerge that carry their own combinatorial identity, and in that regime one might wonder if a new form of indistinguishability argument applies. But even there, most of the serious work in loop quantum gravity or string theory suggests that background independence remains paramount, meaning the relational view survives even if the points are replaced by spin networks or strings. For classical general relativity, however, the lesson is clear that the hole argument is a pseudo-problem generated by reifying the manifold points into substances. You are forced to treat them as distinguishable objects only if you insist on a substantivalist ontology, but if you take the gauge freedom seriously as a guide to ontology, you see they are neither distinguishable nor indistinguishable objects, they are simply not objects at all.

  So to answer your specific worry about whether relationalism is forced to treat points as classical distinguishable objects, the answer is a firm no, because relationalism denies they are objects in the first place. The quantum particle analogy fails because particles are content while spacetime is context, or rather, in GR the context is itself part of the dynamical content but still lacks the individuality required for permutation to generate physical novelty. The determinism is preserved because the future is determined up to isomorphism, and in physics isomorphism is identity. I hope that clears up the fog a bit, because once you stop trying to grab hold of the points themselves and just look at the intervals and coincidences, the hole argument loses all its bite and you can sleep soundly knowing the universe is not radically indeterministic just because of a coordinate choice.
