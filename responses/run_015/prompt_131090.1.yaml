prompt: |-
  You are a professional philosopher of aesthetics with expertise in African American intellectual history and the politics of art, and I am writing this for a graduate seminar on Du Bois that has reached an impasse. Before drafting, please take a moment to brainstorm the conceptual distinctions that separate an instrumentalist reading of Du Bois's well-known 1926 address from an autonomy-based reading—especially whether his claim that all art is propaganda operates as a descriptive sociology, a normative mandate, or a hybrid of both, and whether one can distinguish propaganda-as-strategic-message from propaganda-as-truth-telling-through-beauty. Then, draft the joint statement of an adversarial collaboration between two opposing camps that have argued past each other on this question. Camp One reads Du Bois as advancing a robust instrumentalist thesis: Black art must serve racial uplift and political liberation, aesthetic value is subordinate to efficacy as propaganda, and his literary work should be judged by its contribution to the struggle. Camp Two reads him as defending aesthetic autonomy within political commitment: art reveals truths about Black life that mere messaging distorts, his own fiction and poetry demonstrate a complexity that transcends instrumental aims, and the 1926 address is best understood as describing art's inevitable social function rather than prescribing a duty. I want the document formatted as a numbered section of agreed claims about Du Bois's published texts and historical context—without bibliographies or citation lists—followed by a disagreements table that records the precise formulations of residual disagreement, each phrased in wording that its own camp would accept. After that, list the cruxes—sub-questions such that settling them would move at least one side—and for each crux provide a concrete case or argument both sides agree bears on it, with each camp's prediction written down in advance. Do not ask for reading lists or obscure archival sources; stick to Du Bois's major published works and the 1926 address itself, and inject into your analysis the niche distinction between propaganda of the fact and propaganda of the thesis to test whether the camps are talking past each other.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of aesthetics with expertise in African American intellectual history and politics of art.
      *   **Task:** Draft a joint statement of an adversarial collaboration between two opposing camps regarding W.E.B. Du Bois's 1926 address "Criteria of Negro Art."
      *   **Context:** Graduate seminar on Du Bois that has reached an impasse.
      *   **Key Conceptual Distinctions to Brainstorm:** Instrumentalist vs. Autonomy-based reading; Descriptive sociology vs. Normative mandate vs. Hybrid; Propaganda-as-strategic-message vs. Propaganda-as-truth-telling-through-beauty.
      *   **Camp One (Instrumentalist):** Black art *must* serve racial uplift/liberation; aesthetic value subordinate to efficacy; judge work by contribution to struggle.
      *   **Camp Two (Autonomy/Complexity):** Art reveals truths mere messaging distorts; Du Bois's own fiction shows complexity transcending instruments; 1926 address describes social function, not prescribes duty.
      *   **Format:**
          1.  Numbered section of agreed claims (texts/context, no bibliographies).
          2.  Disagreements table (precise formulations, wording each camp accepts).
          3.  List of Cruxes (sub-questions, concrete cases/arguments both agree bear on it, camp predictions).
      *   **Constraint:** Do not ask for reading lists/archives; stick to major published works and the 1926 address.
      *   **Specific Injection:** Distinguish between "propaganda of the fact" and "propaganda of the thesis."

  2.  **Brainstorming Conceptual Distinctions (Internal Monologue/Notes):**
      *   *Instrumentalism:* Art is a tool. If it doesn't help the cause, it's bad (or at least less good). "All art is propaganda" means "All art *should be* propaganda."
      *   *Autonomy:* Art has its own logic. Du Bois acknowledges art *functions* socially (descriptive), but doesn't mean artists *must* sacrifice beauty for message (normative).
      *   *Propaganda:* Usually implies manipulation/falsehood. Du Bois reclaims it. Is it "propaganda" because it pushes a specific agenda (thesis), or because it corrects lies with truth (fact)?
      *   *The Hybrid:* Maybe Du Bois thinks true beauty *is* political truth for Black people in 1926. You can't separate them.
      *   *The "Fact vs. Thesis" Distinction:* Propaganda of the *thesis* starts with a conclusion and seeks evidence (Instrumentalist lean). Propaganda of the *fact* starts with the lived reality/truth and lets the political implication follow (Autonomy lean).
      *   *Textual Evidence:* "Criteria of Negro Art" (1926), *The Souls of Black Folk* (1903), *Dark Princess* (1928), *Dusk of Dawn* (1940).
      *   *Impasse:* Camp One thinks Camp Two is depoliticizing Du Bois. Camp Two thinks Camp One is reducing Du Bois to a pamphleteer and ignoring his aesthetic sensitivity.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to establish common ground on what Du Bois actually wrote and the historical moment.
      *   Focus on "Criteria of Negro Art."
      *   Acknowledge the phrase "All art is propaganda."
