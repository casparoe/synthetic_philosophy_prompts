  5.  **Drafting - Section 3: Cruxes:**
      *   Need sub-questions that, if answered, shift the debate.
      *   Need concrete cases (specific texts/passages).
      *   Need predictions from both sides.
      *   *Crucial Injection:* Propaganda of Fact vs. Propaganda of Thesis.
      *   *Case:* The ending of "Criteria" (Death and Beauty) vs. *Dark Princess*.

  6.  **Refining the "Propaganda of Fact vs. Thesis" Distinction:**
      *   This is the niche distinction requested.
      *   *Propaganda of Thesis:* Art designed to prove a specific political point (e.g., "Black people are equal"). Camp One leans here.
      *   *Propaganda of Fact:* Art that honestly depicts Black life, which *becomes* propaganda because the truth itself counters white supremacy. Camp Two leans here.
      *   Du Bois says: "I do not care a damn for any art that is not used for propaganda." But he also says: "The apostle of Beauty thus becomes the apostle of Truth and Right."
      *   This suggests the *mechanism* matters. Is the propaganda the *intent* or the *effect* of truth-telling?

  7.  **Review against Constraints:**
