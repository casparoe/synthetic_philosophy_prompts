answer: |-
  # The Abstraction Validity Protocol (AVP)

  ## Introduction
  This document provides a decision procedure for resolving disputes regarding high-level claims in architecture design reviews. It is designed to distinguish between claims that are **load-bearing** (essential to the design's correctness or explanation), claims that are **commentary** (accurate but reducible to substrate details without loss of predictive power), and claims that are **value judgments** (requiring human arbitration).

  The protocol draws on established reasoning regarding causation and realisation but strips away the philosophical terminology in favour of engineering operationalisation. It is not a truth machine; it is a tool for exposing where a claim derives its explanatory power.

  **Timebox:** Each step should take a competent reviewer no more than five minutes to apply to a single paragraph or claim.

  ---

  ## Phase 1: Triage
  Before testing the claim, categorise its logical type. Misidentifying the type is the primary cause of the recurring dispute in your reviews.

  **Question 1.1: Does the claim assert that X *caused* Y?**
  *   *Example:* "The leader election protocol prevented the split-brain."
  *   *If Yes:* Mark as **Causal**. Proceed to Phase 2.
  *   *If No:* Go to 1.2.

  **Question 1.2: Does the claim assert that X *constitutes* or *defines* Y?**
  *   *Example:* "This invariant is what makes the module a queue."
  *   *If Yes:* Mark as **Constitutive**. Proceed to Phase 2 (with modified focus on definition).
  *   *If No:* Go to 1.3.

  **Question 1.3: Does the claim assert that X *should be* Y, or that Y is a desirable property of X?**
  *   *Example:* "This allocation is fair," or "The boundary makes the system maintainable."
  *   *If Yes:* Mark as **Normative**. **Stop.** Do not run Phase 2.
  *   *Verdict:* **Escalate.** This is a design value, not a fact. It requires a named owner (e.g., Staff Engineer or Product Lead) to accept the trade-off. The procedure cannot resolve this.

  ---

  ## Phase 2: The Causal Tests
  Apply these tests only to **Causal** or **Constitutive** claims. If the claim is Normative, you have already Escalated it.

  ### Step 2.1: The Multiple Realisation Test
  **Question:** Could the high-level property (X) have been achieved by a significantly different low-level arrangement (substrate), resulting in the same outcome (Y)?
  *   *Sufficient Answer:* Yes, if you can sketch an alternative implementation (e.g., different data structure, different consensus algorithm, different neural weights) that satisfies the high-level claim and produces the same behaviour.
  *   *Failure:* If the claim only holds for this exact arrangement of packets/states, it is likely a description of the substrate, not an abstraction.
  *   *Pass:* The high-level concept captures a pattern that survives changes to the machinery.

  ### Step 2.2: The Intervention Test (Counterfactual)
  **Question:** If we intervene to break the high-level property (X) while keeping the low-level statistics roughly similar, does the outcome (Y) fail?
  *   *Sufficient Answer:* You must be able to describe a scenario where the packets/states look statistically similar to an observer, but the high-level logic is violated, and the system fails.
  *   *Example:* The packets arrive in the same order, but the *reason* they arrived (the protocol logic) is broken. Does the system still work? If the system works solely because of the packet order regardless of the protocol logic, the protocol claim is weak.
  *   *Pass:* Breaking the high-level logic breaks the system, even if the low-level noise looks normal.

  ### Step 2.3: The Screening-Off Test
  **Question:** Does knowing the low-level details (packets, states) render the high-level claim (X) probabilistically irrelevant for predicting Y?
  *   *Sufficient Answer:* If you have the full packet trace, do you *still* need the high-level sentence to predict the failure/success?
  *   *Pass:* The low-level trace is too complex or noisy to be useful without the high-level compression. The high-level claim "screens off" the need to inspect the substrate.
  *   *Fail:* The low-level trace explains the outcome perfectly and more precisely than the high-level claim. The high-level claim is merely a label.

  ---

  ## Phase 3: Verdict

  1.  **Load-bearing:** The claim passes Step 2.1 and 2.2. It describes a constraint or pattern that is not visible or tractable at the substrate level. **Keep in document.**
  2.  **Commentary:** The claim fails Step 2.1 or 2.3. It is a true description, but it is fully reducible to the substrate without loss of predictive power. It is a "simmball" description of the "careenium". **Mark as commentary or move to an appendix.**
  3.  **Escalate:** The claim was triaged as Normative (Phase 1.3), or it passes the causal tests but relies on a value judgment (e.g., "fairness" is defined by business rule, not physics). **Assign to a named human.**

  ---

  ## Failure Modes and Systematic Errors

  **1. The Reductionist Weapon**
  Reviewers may use Step 2.3 (Screening-Off) aggressively. Technically, *any* high-level claim can be screened off by a perfect low-level simulation. If reviewers demand a "perfect packet trace," all abstractions will be marked as Commentary.
  *   *Mitigation:* In Step 2.3, "knowing the low-level details" implies a human engineer reasoning within a reasonable timeframe. If the packet trace requires a supercomputer to interpret, the high-level claim screens it off for practical purposes.

  **2. The Reification Trap**
  The procedure may validate a claim as Load-bearing even if the high-level entity doesn't exist as a distinct object, provided it has causal power. This is correct behaviour (patterns can be causal without being objects), but engineers often mistake this for permission to treat the pattern as a concrete class.
  *   *Mitigation:* A Load-bearing verdict validates the *sentence*, not necessarily the *implementation*.

  **3. Systematic Bias Against Emergence**
  The protocol struggles with emergent properties where the high-level behaviour is not strictly determined by the low-level rules in a simple way (e.g., neural network generalisation). Step 2.1 may fail because we don't know how to realise the property differently yet.
  *   *Mitigation:* In cases of emergence, default to **Escalate** rather than Commentary, acknowledging uncertainty.

  **4. Judgment Calls Wearing Clothes**
  Step 2.2 (Intervention) requires imagining a counterfactual world. This is imagination, not measurement. Two engineers may disagree on whether the "packet statistics" remain similar in the counterfactual. This is not a bug; it is where the engineering debate actually lives.

  ---

  ## Case Studies

  ### Case 1: The Agent's Concept of Plurality
  **Claim:** "The model has a persistent concept of plurality, and that concept is why it produces the plural form."
  **Counter-claim:** "All there is is a pattern of activations; the concept talk is inert."

  **Phase 1: Triage**
  *   Is it Causal? Yes ("...is why it produces...").
  *   **Type:** Causal.

  **Phase 2: Tests**
  *   **2.1 Multiple Realisation:** Could the model produce plural forms without a "persistent concept" (e.g., via next-token probability heuristics without a distinct representation)?
      *   *Answer:* Yes. In transformer architectures, "concepts" are often distributed activations, not persistent symbols. We can tweak weights to fix pluralisation without a distinct "plurality unit".
      *   *Result:* **Fail.** The high-level property is not robustly distinct from the substrate.
  *   **2.2 Intervention:** If we intervene to remove the "concept" (whatever that maps to) but keep the activation statistics similar, does pluralisation fail?
      *   *Answer:* Difficult to define. If "concept" just means "the specific activation pattern", then removing it changes the activations. If "concept" means a symbolic flag, and there isn't one, the claim is false.
      *   *Result:* **Fail.** The claim posits a mechanism (a concept) that likely does not exist as a distinct causal lever.
  *   **2.3 Screening-Off:** Does knowing the activation vectors render the word "concept" irrelevant?
      *   *Answer:* Yes. The activations predict the output. The word "concept" adds no predictive power over the vector values.
      *   *Result:* **Fail.**

  **Verdict: Commentary.**
  **Working:** The claim treats a post-hoc label ("concept") as a causal mechanism. While useful for human discussion, it is epiphenomenal relative to the actual machinery. The "concept" is a compression of the activation state, not a shover of the machinery. Mark as commentary: "The model exhibits behaviour consistent with a concept of plurality."

  ---

  ### Case 2: Leader Election and Split-Brain
  **Claim:** "Leader election is what prevented a split-brain during the network partition."
  **Counter-claim:** "The event is fully described by which messages arrived at which node when; the protocol adds nothing."

  **Phase 1: Triage**
  *   Is it Causal? Yes ("...prevented...").
  *   **Type:** Causal.

  **Phase 2: Tests**
  *   **2.1 Multiple Realisation:** Could a different protocol (e.g., Paxos vs. Raft) or different message timing have prevented the split-brain?
      *   *Answer:* Yes. The specific packet timing is one instance; the *protocol logic* is the class of behaviours that ensures safety across many timing instances.
      *   *Result:* **Pass.**
  *   **2.2 Intervention:** If we keep the message arrival times identical but remove the election logic (nodes just accept any leader), does the system fail?
      *   *Answer:* Yes. With the same packets, without the logic to reject conflicting leaders, a split-brain occurs. The packets alone were insufficient; the *rule* applied to the packets was the causal factor.
      *   *Result:* **Pass.**
  *   **2.3 Screening-Off:** Does the packet trace explain the outcome better than the protocol claim?
      *   *Answer:* No. The packet trace is one history. The protocol claim explains why *this* history and *many other possible histories* would not result in split-brain. The protocol screens off the need to analyse every possible packet permutation.
      *   *Result:* **Pass.**

  **Verdict: Load-bearing.**
  **Working:** The protocol is a constraint on the substrate. It reduces the state space of possible packet interactions. Without the high-level description of the constraint, the low-level description is just a log of one lucky run. The claim belongs in the document.

  ---

  ### Case 3: Module Boundaries and Maintainability
  **Claim:** "The module boundary is what makes this codebase maintainable."
  **Counter-claim:** (Implicit) Maintainability is a result of many small decisions, not the boundary line itself.

  **Phase 1: Triage**
  *   Is it Causal? It asserts causality ("...is what makes...").
  *   Is it Normative? "Maintainable" is a value judgment regarding future human effort.
  *   *Decision:* This is a hybrid. It asserts a causal link to a normative property. We must test the causal link. If the link fails, it is Commentary. If the link holds but relies on values, it is Escalate. Let us treat it as **Causal** for the sake of the test, as the user asserts it as a fact of the system.

  **Phase 2: Tests**
  *   **2.1 Multiple Realisation:** Could the codebase be maintainable with a different boundary structure (e.g., monolithic, or different microservices)?
      *   *Answer:* Yes. Maintainability is achievable with different structural arrangements provided other controls (tests, documentation) exist.
      *   *Result:* **Pass** (The property is realisable elsewhere).
  *   **2.2 Intervention:** If we keep the boundary (the file directory structure) but allow circular dependencies and shared mutable state across it, does maintainability persist?
      *   *Answer:* No. The system becomes unmaintainable despite the boundary existing.
      *   *Result:* **Fail.** The boundary *line* is not the cause. The *enforcement* of the boundary is the cause.
  *   **2.3 Screening-Off:** Does knowing the specific decisions (type safety, CI checks, coupling metrics) render the "boundary" claim irrelevant?
      *   *Answer:* Yes. A boundary without enforcement is just a folder name. The low-level decisions (the enforcement mechanisms) predict maintainability; the abstract "boundary" does not.
      *   *Result:* **Fail.**

  **Verdict: Commentary (with correction).**
  **Working:** I must be plain: the procedure demolishes this claim. The claim attributes causal power to a static artifact (the boundary) rather than the dynamic processes (enforcement, discipline) that respect it.
  *   *Step 2.2 did the damage:* It revealed that the boundary alone is insufficient.
  *   *Step 2.3 confirmed it:* The "many small decisions" (the substrate of development practice) screen off the boundary line.
  *   *Correction:* The claim should be rewritten as: "Enforcement of the module boundary via CI and type constraints makes this codebase maintainable." As written, it is a redescription that mistakes the map for the territory. It should be marked as Commentary until corrected to reflect the actual causal mechanism (enforcement).

  ---

  ## Limitations of the Procedure

  This protocol is not a substitute for thought, and it cannot answer every question that arises in an architecture review.

  1.  **It cannot measure "Tractability":** Step 2.3 relies on human judgment of whether the low-level details are too complex to reason about. A senior engineer and a junior engineer may disagree on what is "tractable," leading to different verdicts. This is a feature, not a bug, but it means the verdict is relative to the team's capability.
  2.  **It cannot resolve Value Conflicts:** If the "Substrate people" value raw performance above all, and the "High-level people" value developer velocity, the protocol will classify claims as Load-bearing for both, but for different goals. The **Escalate** verdict punts this to a human, but it does not solve the political disagreement.
  3.  **It assumes a stable Substrate:** The protocol assumes the "packets and states" level is well-understood. In novel systems (e.g., quantum computing, unreliably trained agents), the substrate itself may be poorly understood, making Step 2.3 impossible to run.
  4.  **It cannot detect "Magic":** If a high-level claim works, but no one knows why (common in machine learning), the Intervention Test (2.2) may fail because we don't know how to intervene precisely. The protocol will mark these as Commentary, which might discourage useful heuristics that are not yet fully understood.

  Use this tool to clarify arguments, not to win them. If the procedure says a claim is Commentary, it does not mean the claim is false; it means it is not doing the architectural work you think it is.
