answer: |-
  ### The senses of 'unit'

  The debate persists because "unit" is ambiguously defined across four distinct senses. First, the *unit of inheritance* refers to entities replicated with fidelity, typically genes. Second, the *unit of causal selection* is the entity physically interacting with the environment, usually organisms or groups. Third, the *unit of explanation* denotes the level offering the most parsimonious causal story. Fourth, the *unit of fitness attribution* asks whose reproductive success defines evolutionary gain. Gene-selectionists prioritize inheritance and fitness attribution, arguing genes are the only persistent replicators capable of accumulating adaptations over deep time. They dismiss higher levels as convenient shorthand. Organism and group-selectionists prioritize causal selection and explanation, noting that phenotypes interact with environments, not naked DNA. They dismiss gene-level talk as a bookkeeping trick. However, neither camp is consistent. Gene-centrists often speak of genes "causing" behavior directly, conflating inheritance with causal interaction. Conversely, group-selectionists sometimes imply groups replicate like organisms, conflating causal interaction with faithful inheritance. This cross-mapping ensures they talk past one another; one side defines the unit by persistence, the other by interaction. The confusion arises because each camp claims their preferred sense is the only legitimate one. This inconsistency weakens their respective claims to exclusivity. When gene-selectionists argue genes are the only units, they rely on inheritance fidelity. When they argue genes are the cause, they rely on causal interaction. They switch senses to win arguments. Group-selectionists do the same, swapping causal interaction for replication fidelity. This semantic sliding prevents convergence.

  ### What the equivalence results show

  Formal equivalence results, such as the Price equation, demonstrate that selection models can be mathematically transformed between levels without losing predictive accuracy. A gene-centric covariance can be decomposed into within-group and between-group components, proving intertranslatability. However, this does not dissolve the debate because mathematical equivalence does not entail ontological identity. Translating a group model into gene frequencies preserves the numbers but may obscure the causal mechanism, such as emergent social structures that drive selection. Therefore, these results merely relocate the disagreement from empirical adequacy to explanatory virtue. They show that both levels can fit the data, but not which level captures the causal structure more faithfully. Furthermore, equivalence assumes specific mathematical conditions that may not hold when emergent properties create novel causal powers not reducible to lower-level sums. Thus, the results confirm that the levels are compatible representations, not that they are the same reality. The debate survives because scientists care about causal insight, not just algebraic consistency. Intertranslatability proves that the models are empirically equivalent, but it fails to prove that the causal stories are interchangeable. A map is not the territory, and having two maps of the same territory does not mean the maps are identical. The results show that the disagreement cannot be settled by mathematics alone.

  ### The kind of disagreement

  The residual disagreement is substantive but not empirical. It is not merely verbal, because choosing a unit dictates research programs and where scientists look for mechanisms. It is not a hidden empirical question, as both sides generally agree on the biological data but disagree on its interpretation. Some might argue it hinges on whether group-level heritability is large enough to matter, but both sides agree it varies; they disagree on whether non-zero values justify the label "unit." Instead, it is a clash over normative standards for evolutionary explanation. Gene-selectionists favor reductionism, seeking the lowest common denominator of causality. Group-selectionists favor emergentism, valuing higher-level patterns that organize lower-level parts. The conflict arises because biology lacks a consensus on whether explanations should prioritize fundamental constituents or functional wholes. Consequently, the debate is about what constitutes a "good" explanation rather than what the world is made of. Each side accepts the facts but rejects the other's explanatory framework as misleading or incomplete. This makes the disagreement philosophical, rooted in competing views on scientific realism and reductionism, rather than a dispute solvable by further data collection. The stakes are high because the chosen unit determines which variables are treated as constants and which as drivers of change. It is a fight over the soul of evolutionary biology, not its data.

  ### What would count as progress

  Progress requires changing the question from "Which unit is real?" to "Which unit is useful?" Scientists should adopt pragmatic pluralism, selecting the level of analysis that best isolates the causal variables for a specific phenomenon. For some traits, gene-level models optimize prediction; for others, group dynamics are indispensable. Progress would be marked by a consensus that units are methodological tools rather than metaphysical truths. Expecting a final resolution is futile because the choice depends on explanatory goals, not mind-independent facts. The debate ends not by victory, but by recognizing the legitimacy of multiple descriptive frameworks. This shift transforms the dispute from a war over territory into a collaboration over tool selection. We should stop asking for the true unit and start asking for the most productive model. Ultimately, the goal is explanatory power, not ontological purity. Progress is measured by the ability to solve specific biological problems, not by settling metaphysical scores. The debate persists only because participants refuse to accept this pragmatic turn.
