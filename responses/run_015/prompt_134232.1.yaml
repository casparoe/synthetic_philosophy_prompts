  *(Case B Nuance)*: If the programme works *by* getting patients to attend, stratifying by attendance removes the effect of the programme. This is M-bias or mediator bias. The Splitter heuristic ("condition on the partition") fails here if the partition is post-treatment. The Pooler heuristic ("report overall") succeeds for the policy question. This is a key win for the Poolers in Case B, whereas Case A is a win for Splitters (confounding). I need to make sure this asymmetry is clear.

