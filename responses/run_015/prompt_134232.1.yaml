      *   *Let's look at the "Cruxes" section.* That's where I separate the wheat from the chaff.
      *   *Case A Prediction:* Pooler: Marginal. Splitter: Stratified.
      *   *Case B Prediction:* Pooler: Marginal. Splitter: Stratified (but note the bias). *Wait*, if the document is what they *should* have written, it should probably highlight that in Case B, stratification is actually wrong causally. I will write the predictions based on their *heuristic*, then resolve it in the analysis.
      *   *Re-reading prompt:* "Write down each side's prediction in advance." Okay, I need to state what they *would* say, not necessarily what is objectively true (though the document implies truth).
      *   *Okay, Plan:*
          *   Agreed: Math is math.
