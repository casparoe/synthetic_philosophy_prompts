answer: |-
  **MEMORANDUM**

  **TO:** The Department
  **FROM:** The Mediation Committee
  **SUBJECT:** Simpson's Paradox: A Protocol for Reporting and Interpretation

  After months of debate between the 'Poolers' (marginal association) and the 'Splitters' (conditional association), we submit the following framework. This document does not declare a winner; it delineates where the mathematics ends and the judgement begins.

  ### 1. Agreed Claims
  Both camps sign the following statements of fact:

  1.  **Arithmetic Validity:** Both the pooled table and the stratified tables are arithmetically correct; neither contains a calculation error.
  2.  **Mechanism of Reversal:** The reversal of association arises from unequal distribution of weights (sample sizes) across the strata, combined with a correlation between the grouping variable and the outcome.
  3.  **Insufficiency of Data:** No table, pooled or stratified, settles the causal question without external assumptions about the data-generating process.
  4.  **Context Dependence:** The appropriate table for decision-making depends entirely on the action space available to the decision-maker (i.e., what they can and cannot control).
  5.  **Risk of Misinterpretation:** Presenting only one table without qualification invites error; the pooled table risks confounding, while the stratified table risks conditioning on colliders or mediators.

  ### 2. Remaining Disagreements
  The following table summarises the divergent default positions. Each statement is worded to be acceptable to the side holding it.

  | Issue | The Pooler Position | The Splitter Position |
  | :--- | :--- | :--- |
  | **Default Reporting** | The marginal association is the primary figure; it reflects the reality a patient or client actually encounters. | The stratified association is the primary figure; it reflects the structural efficacy of the treatment or intervention. |
  | **Weighting** | Weights should reflect the population frequency as observed; this preserves the operational context. | Weights are artefacts of sampling or assignment; they should be standardised or ignored to reveal the underlying rate. |
  | **Confounding** | It is the decision-maker's burden to account for case-mix if they wish to isolate skill; report the bottom line. | It is the analyst's burden to adjust for case-mix; reporting the bottom line punishes those who take difficult cases. |
  | **Generalisability** | The pooled estimate applies to the current system as it stands. | The stratified estimate applies to the treatment effect regardless of the current system's composition. |

  ### 3. The Cruxes
  We distinguish between disputes over terminology and disputes over substance.

  **Verbal Cruxes (Definitions)**
  *   **The meaning of 'Effect':** Poolers use 'effect' to mean *expected outcome under current assignment rules*. Splitters use 'effect' to mean *causal efficacy holding covariates constant*. Both are valid definitions for different questions.
  *   **The meaning of 'Bias':** Poolers view the marginal figure as 'unbiased' for prognosis. Splitters view it as 'biased' for treatment efficacy. This is a distinction between *predictive* and *causal* modelling, not a mathematical error.

  **Genuine Cruxes (Substance)**
  *   **The Action Space:** Can the decision-maker manipulate the stratifying variable? If a patient cannot choose their severity level, the stratified rate is less relevant to their personal risk than the marginal rate.
  *   **Causal Structure:** Is the stratifying variable a confounder (pre-treatment) or a mediator/collider (post-treatment)? Conditioning on the latter induces bias. The Splitters' heuristic to "always condition" fails here; the Poolers' heuristic to "never condition" fails there.
  *   **Policy vs. Mechanism:** Is the goal to evaluate a specific policy rollout (Pooler strength) or to understand a biological/social mechanism (Splitter strength)?

  ### 4. Case Predictions and Resolutions
  Both sides accept the following cases as bearing on the cruxes. We record the *ex-ante* predictions based on each camp's heuristic, followed by the consensus resolution.

  #### Case A: The Surgeons
  *Scenario:* Surgeon X takes nastier cases. X has worse overall mortality but better mortality within every severity band.
  *   **Pooler Prediction:** Report the overall mortality. A patient choosing a surgeon cares about their probability of survival in the real world, where case assignment is part of the surgeon's package.
  *   **Splitter Prediction:** Report the stratified mortality. The overall figure is confounded by case severity. To judge surgical skill, we must hold severity constant.
  *   **Resolution:** **Splitter wins on efficacy; Pooler wins on prognosis.** If the question is "Who is the more skilled surgeon?", use stratified data. If the question is "Which surgeon gives me the best odds given I don't know my severity yet?", the marginal is relevant, *unless* the patient can influence severity assignment. However, for departmental audit, the stratified figure is required to avoid penalising specialisation.

  #### Case B: The Follow-up Programme
  *Scenario:* A Trust programme increases attendance at outpatient appointments, which improves health. The Trust must roll out to everyone or scrap it (no targeting). Data is audited stratifying by attendance.
  *   **Pooler Prediction:** Report the overall effect. The policy is 'all or nothing'. We need the total effect of the programme, including the pathway through attendance.
  *   **Splitter Prediction:** Report the stratified effect. We must condition on attendance to see if the programme adds value *beyond* merely getting people through the door.
  *   **Resolution:** **Pooler wins.** Attendance is a mediator, not a confounder. Stratifying by attendance blocks the causal path through which the programme works. Since the action space is "roll out to all" (cannot target only attendees), the marginal association represents the true causal effect of the policy ($P(Y|do(Programme))$). Stratification here yields a direct effect estimate that is irrelevant to the binary policy decision.

  ### 5. Final Directive
  Going forward, analysts must state the **Action Space** before selecting a table.
  1.  If the stratifying variable is a **confounder** and the decision involves **isolating a mechanism**, present stratified estimates (Splitter default).
  2.  If the stratifying variable is a **mediator** or the decision involves **system-level policy** without targeting, present marginal estimates (Pooler default).
  3.  If in doubt, present both, but label the marginal as 'Prognostic' and the conditional as 'Etiological'.

  *Approved by the Mediation Committee.*
