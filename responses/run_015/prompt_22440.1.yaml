answer: |-
  You have stumbled into one of the deepest and most active debates in the philosophy of biology. First off, your intuition is excellent: you aren't conflating arguments, you have correctly identified the exact tension that philosophers like Peter Godfrey-Smith, Paul Griffiths, and John Maynard Smith have been wrestling with for decades.

  Your friend's question ("If not a code, how is it different from a rock?") is the standard counter-move to the "DNA is not a code" argument.

  Here is the walkthrough of where the distinction lies, why your friend's comparison is tempting but flawed, and why biologists keep using the word "information" anyway.

  ### 1. Two Types of "Information"
  To solve this, we have to distinguish between two very different definitions of information that often get lumped together in English.

  **Type A: Causal Information (The Rock)**
  This is what your friend is talking about. A sedimentary rock contains "information" about the ancient environment because the environment *caused* the rock to look that way. A scratch on your phone contains "information" about the keys in your pocket because the keys *caused* the scratch.
  *   **Philosophical term:** *Indication* or *Correlation.*
  *   **Mechanism:** Physical law + History.
  *   **Direction:** Past $\rightarrow$ Present.
  *   **Key Feature:** It is passive. The rock does not *use* its layers to do anything.

  **Type B: Functional Information (The DNA)**
  This is what biologists are talking about. DNA contains "information" not just because it was caused by the parents, but because the cell *uses* it to build something else.
  *   **Philosophical term:** *Semantic Information* or *Instruction.*
  *   **Mechanism:** Evolutionary Selection + Cellular Machinery.
  *   **Direction:** Present $\rightarrow$ Future (it directs a process).
  *   **Key Feature:** It is active. The sequence is *consumed* by a mechanism to achieve a goal.

  ### 2. The "Decoder" Misunderstanding
  You mentioned the argument that DNA isn't a code because "there is no decoder." This is where the nuance lies.

  The philosophical argument you read (likely referencing work by people like Godfrey-Smith or critiques of semiotics in biology) says there is no **conventional** decoder. In Morse code, the link between "dot-dash" and "S" is arbitrary; we just agreed on it. In DNA, the link between a codon and an amino acid is chemical; it's physical affinity.

  **However,** there *is* a decoder in the functional sense. The ribosome and the tRNA machinery act as a decoder. They "read" the sequence and translate it into a protein.

  The difference between the DNA and the Rock is not the molecule itself; it is the **context of use.**
  *   **The Rock:** There is no machinery sitting next to the rock waiting to read the sediment layers to build a new rock. The layers are just a fossilized record.
  *   **The DNA:** There is a complex molecular machinery (the cell) that has evolved specifically to detect the sequence of bases and use that sequence to determine the sequence of amino acids.

  If you put a DNA strand in a test tube with no ribosomes, no tRNA, and no enzymes, it is exactly like a rock. It is just a chemical polymer with a causal history. It only becomes "information" when placed inside the system evolved to **interpret** it.

  ### 3. The Role of Natural Selection (The "Meaning" Maker)
  This is the most important part of the answer. Why do we say the DNA has "meaning" but the scratch on your phone doesn't?

  **Selected Effect Theory:**
  Biological traits have functions because they were *selected for* in the past.
  *   The heart beats *in order to* pump blood.
  *   DNA sequences *in order to* code for proteins.

  The "meaning" of a gene comes from evolutionary history. Sequences that failed to produce useful proteins resulted in organisms that died. Sequences that *did* produce useful proteins were replicated.

  Therefore, the relationship between the DNA sequence and the protein is not just a physical causal chain (like wind causing a ripple); it is a **preserved** relationship. The cell relies on this relationship holding true.

  *   **Rock:** The layers correlate with the past, but if the correlation changed tomorrow, the rock wouldn't care.
  *   **DNA:** The sequence correlates with the protein, and if that correlation breaks (mutation), the system fails. The system *depends* on the information being accurate.

  ### 4. So, is it a Code or Not?
  You are right to be skeptical of the "Code" metaphor, but your friend is wrong to equate it with a rock.

  *   **Strict Information Theory (Shannon):** DNA is a signal with high complexity.
  *   **Semiotics (Signs/Symbols):** DNA is not a "code" because the mapping isn't arbitrary/conventional.
  *   **Biology (Function):** DNA is "information" because it is a **template for construction.**

  A better metaphor than "Code" might be **"Mold"** or **"Stencil."**
  If you pour concrete into a stencil, the shape of the stencil determines the shape of the concrete.
  *   Is the stencil a "code"? Not really.
  *   Is the stencil just a rock? No, because it is being *used* to shape something.
  *   Does the stencil contain information? Yes, it contains the *form* of the object to be made.

  ### 5. Why Biologists Keep Using the Term
  If it's philosophically messy, why do biologists insist on "Genetic Information"?

  1.  **Pragmatism:** It works. If you treat DNA as information, you can predict mutations, engineer genes, and understand disease. If you treat it like a rock, you can't.
  2.  **Causal Specificity:** A rock is caused by *many* things (pressure, heat, time). A specific protein is caused by a *specific* DNA sequence. The DNA has high "specificity" over the outcome. Philosophers call this **Causal Specificity.** The DNA makes the difference between a leg and an antenna; the surrounding cytoplasm generally does not.
  3.  **Communication:** It distinguishes the *instruction* from the *environment*. The environment provides the materials (atoms, energy), but the DNA provides the *organization*.

  ### Summary for Your Friend
  Here is how you can answer him:

  > "You're right that a rock holds a record of its past, just like DNA holds a record of its ancestry. That's **causal information**.
  >
  > But DNA is different because it's **functional information**. There is a machine (the cell) that reads the DNA to build something new. The rock doesn't build anything; it just sits there.
  >
  > DNA isn't a 'code' like English, where the words are arbitrary. It's more like a physical key. The shape of the key isn't 'arbitrary,' it physically fits the lock. But we still say the key carries the 'information' needed to open the door, because without that specific shape, the mechanism doesn't work. DNA is the key, the ribosome is the lock, and the protein is the door opening."

  ### Recommended Rabbit Hole
  If you want to read more without getting a PhD, look up **Peter Godfrey-Smith's** paper *"Information in Biology."* He is the clearest voice on exactly this distinction. He argues that biological information is real, but it's not "semantic" in the human language sense; it's about **control and specificity.**

  You haven't missed a distinction; you've found the boundary where physics turns into biology.
