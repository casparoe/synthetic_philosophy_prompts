  3.  **Analyze the Non-Identity Problem Tension:**

      *   *The Problem:* In standard population ethics (Parfit), if an action (like extinction) prevents specific people from coming into existence, those people are not "worse off" than they would have been (because they wouldn't exist otherwise). You can't harm someone by preventing their existence (unless their life would be not worth living).
      *   *The Tension:* Scheffler says extinction is *gravely bad*. But if there are no future people, who is the victim?
          *   Present people? They die anyway.
          *   Future people? They don't exist to be harmed.
      *   *Scheffler's Move:* He shifts the focus from the *welfare of future people* to the *valuational structure of present people*. It's not that future people are harmed; it's that *our* current values lose their footing without them.

