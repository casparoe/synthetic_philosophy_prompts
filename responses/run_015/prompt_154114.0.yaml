      *   *What is it?* Scheffler argues that we care deeply about the survival of humanity after our own deaths. This "collective afterlife" is a precondition for the meaningfulness of many of our current activities.
      *   *The Thought Experiment:* Imagine a meteor will hit Earth 30 days after your natural death, killing everyone. Would you still write that book? Raise your kids the same way? Fund that research? Scheffler suggests the answer is "no" or "less so."
