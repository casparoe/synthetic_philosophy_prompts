      *   *The "Package":*
          1.  **No Claim from Unlawful Presence:** Upholds the *initial* validity of the border. If crossing wrongly gave rights, the border is meaningless.
          2.  **Long-Residence Routes:** Acknowledges the *cost* of uprooting someone deeply embedded. Upholds stability and social utility.
          3.  **Qualifying Time (Work/Taxes vs. Detention):** Distinguishes between *burdening* the state vs. *contributing* to it, or being *under* control vs. *outside* control.

  3.  **Evaluate the "Adverse Possession" Analogy:**
      *   *Similarity:* Time + Possession = Right.
      *   *Difference:* Adverse possession is hostile to the owner. Immigration regularization is usually discretionary or statutory, not automatic by operation of property law. The state doesn't "sleep"; it actively manages the status.
      *   *Verdict:* It's a metaphor, not a legal doctrine. It predicts automatic title transfer, which doesn't happen.

  4.  **Identify the Underlying Theories (Reconstruction):**
      *   *Theory 1: The Sovereign Prerogative (Statist).* The state owns the territory. Entry is a privilege. Unlawful presence is a continuing tort. Regularization is an act of grace/mercy, not right.
