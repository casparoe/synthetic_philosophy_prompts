answer: |-
  This is a sophisticated observation of the internal tension within modern immigration regimes. You have identified what political theorists and legal scholars often call the "liberal paradox" of immigration control: the conflict between the state's right to control its borders (sovereignty) and the liberal commitment to the rights of persons who are already within the society (membership).

  Per your request, I will reconstruct the rationale behind this package of rules rather than offer a verdict on its morality. I will also explicitly distinguish between **descriptive consensus** (how practitioners and scholars agree the system functions) and **theoretical reconstruction** (competing explanations for *why* it functions this way, where there is no consensus).

  ### 1. Descriptive Consensus: What the Rules Actually Do

  First, it is important to separate the mechanics of the law from the justification. There is broad agreement among immigration lawyers and policy analysts on the following descriptive points:

  *   **The "No Claim" Doctrine:** It is settled law that unlawful presence is a continuing violation. In most Western jurisdictions (particularly the U.S., which your details suggest), the *method of entry* (Entry Without Inspection vs. Visa Overstay) creates distinct legal disabilities. This is not merely administrative; it is statutory.
  *   **The "Rooting" Exception:** Discretionary relief (such as Cancellation of Removal in the U.S. or Long Residence rules in the UK) exists as a safety valve. It is not an entitlement. It requires a showing of "exceptional and extremely unusual hardship" or a specific statutory period (often 10 years) combined with "good moral character."
  *   **The Valuation of Time:** You are correct that not all time counts equally. Time spent in detention, or under "tolerated" statuses (like Temporary Protected Status or Deferred Action), often does not accrue toward permanent residency thresholds in the same way time spent in unauthorized employment does.
  *   **The Absence of Automaticity:** Unlike property law, there is no automatic mechanism where time alone converts status. An application must be made, and discretion is exercised.

  **Where the Consensus Ends:** There is **no agreement** among legal theorists or political philosophers on the *justification* for this tension. Some argue the system is incoherent; others argue it is a necessary compromise. The following sections reconstruct the underlying logic that makes the system function, even if that logic is not explicitly stated in statutes.

  ### 2. Reconstructing the Rationale: Sovereignty vs. Social Fact

  The package of rules you describe presupposes a **dualist theory of political authority**. It assumes the state holds two distinct types of rights that occasionally conflict: the *right to exclude* (territorial sovereignty) and the *right to govern* (jurisdiction over a population).

  #### A. The "No Claim" Rule: Preserving the Integrity of the Border
  **Theoretical Ground:** *Statist Sovereignty.*
  The rule that unlawful presence creates no claim presupposes that the **moment of entry** is the constitutive act of membership. If the state allowed mere presence to generate rights automatically, the border would cease to function as a selection mechanism.
  *   **Why Entry Method Matters:** The distinction between an overstay and an Entry Without Inspection (EWI) is crucial here. An overstay breached a *contract* (the visa terms); an EWI breached the *gate*. The law treats the breach of the gate as a deeper injury to sovereignty. This is why EWI is often barred from adjusting status domestically, while overstayers sometimes are not.
  *   **The Presupposition:** This rule presupposes that the state's authority is analogous to a **private property owner's right to exclude**, not a public utility. You cannot gain an easement simply by walking across a lawn; you need permission.

  #### B. The "Long Residence" Route: Preserving the Integrity of the Society
  **Theoretical Ground:** *Social Membership Theory.*
  This is where your observation about "participation in ordinary social life" is precise. The long-residence route presupposes that **political membership is a social fact, not just a legal status.**
  *   **Why Time Counts:** After a certain threshold (often a decade), the cost of enforcement (deportation) outweighs the benefit of maintaining the border's integrity. Uprooting someone with children, a job, and a lease creates more social disorder than allowing them to stay.
  *   **Why Some Time Doesn't Count:** This is the key to your question about detention or "tolerated" status. Time in detention counts less because the individual is **under state control**, not **integrated into civil society**. Time on a temporary, non-immigrant visa often counts less because the individual is present as a **guest**, not a **participant**. The law is scoring *integration*, not just *biology*. It values time spent paying taxes and working (contributing to the public good) over time spent merely existing or being held by the state.

  #### C. The Synthesis: The "Grace" Model
  The combination of these rules presupposes that regularization is an act of **sovereign grace**, not the recognition of a pre-existing right.
  *   If it were a right (based on adverse possession), the immigrant would win automatically.
  *   If it were purely sovereignty (based on border control), the immigrant would lose automatically.
  *   By making it discretionary based on "rooting," the state says: *"You have no right to be here, but we recognize you have become part of the fabric we govern. We will choose to forgive the initial breach because enforcing it now damages us more than you."*

  ### 3. The Adverse Possession Analogy: Metaphor vs. Theory

  Your friend's suggestion of "adverse possession" (squatters' rights) is a common metaphor, but as a theoretical model, it fails to predict the actual practice.

  **Where it fits:**
  *   It captures the intuition that time + presence = right.
  *   It captures the idea that the state "slept" on its enforcement (laches).

  **Where it fails (and why the law differs):**
  *   **Hostility:** Adverse possession requires the possession to be "hostile" (claiming right against the owner). Undocumented immigrants often actively conceal their presence, acknowledging the state's superior claim.
  *   **Automaticity:** Adverse possession transfers title automatically by operation of law after the statutory period. Immigration regularization requires an **application** and **adjudication**. The state retains the power to say "no" even after 20 years.
  *   **The "Owner":** In property law, the owner is passive. In immigration, the state is an active enforcer. The state does not "lose" its sovereignty; it chooses to suspend enforcement.

  **Verdict on the Analogy:** It is a **bad metaphor for the same theory.** It suggests the immigrant acquires a right *against* the state. The actual practice suggests the state acquires a reason *not to exercise* its right.

  ### 4. Counterfactuals: If "Social Membership" Were the Actual Ground

  You asked what would change if we took the social-membership story seriously as the *actual* ground of the practice, rather than a secondary exception to sovereignty. This is a live dispute in political philosophy (e.g., the work of Joseph Carens vs. David Miller).

  If social membership were the primary justification:

  1.  **Length of Residence:** This would likely stop being a proxy and become a direct measure. Instead of a hard "10-year" cliff, there would be a sliding scale of rights based on the depth of ties. A 3-year resident with a citizen child might have a stronger claim than a 15-year resident with no ties.
  2.  **Tourists and Temporary Workers:** Currently, they do not accrue claims toward permanent residence. Under a pure social membership theory, a posted worker who lives in a community for 10 years, pays taxes, and sends kids to school *should* accrue a claim, regardless of their visa category. The current system says "No, you agreed to leave." A membership system would say "You are now one of us."
  3.  **Citizens Abroad:** This is the strongest test. Currently, citizens who live abroad for decades retain full citizenship. If membership were based on social participation/wovenness, **expatriate citizens should lose their voting rights or membership status** because they are no longer subject to the daily coercion of the state or participating in its social life. The fact that they do *not* lose status proves that **legal formalism (citizenship)** still trumps **social fact (membership)** in the ultimate analysis.

  ### 5. Summary of Distinctions: Real vs. Compromise

  To answer your specific question on where the practice rests on a real distinction versus a compromise:

  **Real Distinctions (Theoretical Coherence):**
  *   **Entry vs. Stay:** The law distinguishes between the *act of crossing* (sovereignty) and the *fact of living* (jurisdiction). This is a coherent distinction in political theory. The state has a right to control who enters, but once someone is inside, the state has a duty to govern them justly.
  *   **Integration vs. Existence:** The distinction between "qualifying time" (work, taxes) and "non-qualifying time" (detention) rests on a real distinction between **contributing to the cooperative scheme** of society versus merely **occupying space**.

  **Administrative/Political Compromises (Theoretical Tension):**
  *   **The Specific Time Thresholds:** Why 10 years? Why not 7 or 15? This is arbitrary. It is a political compromise between the "Sovereignty" camp (want short limits) and the "Membership" camp (want automatic regularization).
  *   **The "Good Moral Character" Requirement:** This is a compromise. If membership is based on social fact, a person who committed a minor crime is still socially embedded. Requiring "good moral character" reintroduces the sovereignty model (membership is a privilege we grant to the worthy) over the membership model (membership is a fact of our shared life).
  *   **The EWI vs. Overstay Distinction:** While theoretically grounded in sovereignty, the harshness of this distinction is often a political compromise to deter border crossings, even when the social footprint of an EWI and an Overstay is identical after 10 years.

  ### Conclusion

  The package of rules you are navigating presupposes that **sovereignty is the default, but social fact is a constraint.**

  The state claims the right to exclude everyone (Sovereignty). However, it acknowledges that its own authority is derived from governing a stable population. When a person becomes so woven into that population that removing them destabilizes the very society the state is trying to protect, the state creates an exception (Regularization).

  The "oddness" you feel is the friction between these two commitments. The law tells your colleague: *"You are not supposed to be here (Sovereignty), but you are effectively one of us (Membership), so we might let you stay if you prove you are the right kind of one of us (Discretion)."*

  It is not adverse possession, because the state never admits it lost the land. It is a **sovereign waiver**, granted only when the social cost of enforcement exceeds the political cost of leniency.
