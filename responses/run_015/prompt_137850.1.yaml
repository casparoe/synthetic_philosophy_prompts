      *   *Key Distinction:* Differentiate between *legal positivism* (this is the rule) and *normative theory* (this is why the rule exists).
      *   *Specific Point:* The user asked about "entry without inspection" (EWI) vs. "overstay." This is crucial in US law (3/10 year bars). I should mention this distinguishes the *severity* of the sovereignty breach.

  8.  **Final Review against Constraints:**
