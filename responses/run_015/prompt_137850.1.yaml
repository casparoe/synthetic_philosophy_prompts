      *   Tone: Professional, analytical, empathetic to the complexity.

  9.  **Final Polish:** Ensure clear headings and distinct sections for "Settled/Descriptive" vs. "Theoretical/Reconstructive." (Self-correction: Make sure to explicitly mark the "Expert Consensus" parts clearly as requested).

  *(Self-Correction during drafting)*: I need to make sure I don't imply the US is the only country, though the details (EWI vs Overstay, 10 years) strongly suggest US law. I will frame it generally but acknowledge the specific details likely refer to the US system (Cancellation of Removal, etc.) without giving specific legal advice. The prompt implies a common law/western democratic context.

  *(Refining the "Expert Consensus" part)*: In immigration *law*, there is consensus on the statutes. In immigration *philosophy*, there is not. I must make this distinction clear. The user is asking about the *rationale*, which falls into philosophy/political theory.

  *(Refining the "Adverse Possession" part)*: Adverse possession requires "hostile" claim. Undocumented immigrants often try to hide, not claim hostilely. Also, the state doesn't lose title; it grants a new status. Important distinction.

  *(Refining the "Social Membership" part)*: If social membership were the *sole* ground, citizenship would be revocable for expats. That's a strong test case.

