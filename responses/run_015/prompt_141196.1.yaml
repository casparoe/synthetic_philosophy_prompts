  Here's the worry: to be straight then bent, either I'm wholly here wearing a time-stamped badge, or I'm a straight part next to a bent one. So neither view lets me actually bend; I'm just static in different ways.

  So please, don't hold me accountable for anything I said before breakfast. That wasn't me changing my mind; that was just a different part talking. Or the same part with a new badge. Either way, nothing actually happened.

