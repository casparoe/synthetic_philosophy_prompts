prompt: |-
  I'm moderating a podcast interview with an unnamed philosopher who defends a specifically Rortyan antirepresentationalist stance applied to AI value-alignment discourse. Her position is that treating human values as representable mental contents to be mapped onto model weights repeats the mirror-of-nature fallacy Rorty diagnosed in epistemology, only now projected onto normative discourse; she argues that alignment should be reconceived as pragmatic redescription aimed at interactional fluency rather than accurate representation, and she deploys the distinction between normal and abnormal discourse to warn that alignment research, though currently liberating abnormal discourse, risks hardening into a new metaphysics of values-in-the-model.

  Draft eight interview questions that avoid asking her to restate antirepresentationalism from scratch. I want:
  - one pressing how her view differs from straightforward moral anti-realism or ethical instrumentalism;
  - one on the boundary between normal and abnormal discourse—specifically, what criterion distinguishes a liberating redescription of values from an oppressive normalization of them;
  - one anticipating her likely reply that critics are merely representationalists about values, paired with a follow-up that makes that deflection harder;
  - one asking whether her framework can accommodate deep cross-cultural moral disagreement without collapsing into incommensurable final vocabularies;
  - and one asking what practical difference her framing makes for an engineer choosing between reward-modeling and deliberative democratic oversight in a concrete design decision.

  For each question, provide a brief anticipated answer and a one-sentence follow-up keyed to that answer. Present the questions as a numbered sequence with follow-ups clearly marked. Keep the entire response under 400 words.
