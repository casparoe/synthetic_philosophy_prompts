prompt: |-
  In philosophy of mind, it is common to hear introspection described as a kind of "inner sense" or "inner perception" — a faculty that scans our own mental states the way vision scans the external world. The analogy is often deployed to support the idea that introspection is a generally reliable, observation-like source of knowledge about our own minds, and that it grounds a special first-person authority over our mental lives that no outside observer could match. I would like you to audit this analogy. Specifically: (a) provide a correspondence table — what in introspection is supposed to map onto what in sensory perception (the organ, the object, the medium, the conditions for good observation, the kinds of error, etc.); (b) identify where the mapping breaks down, separating the disanalogies that matter for the analogy's epistemic work from those that are merely superficial; and (c) assess whether the conclusion — that introspection is a reliable, perception-like source of knowledge — survives once the disanalogies are on the table, or whether the analogy was doing more argumentative work than it can bear. If there is a better analogy for what introspection actually does, suggest it. Think very carefully before answering, and respond in the style of an expert philosopher of mind.
