answer: |-
  You have put your finger on the central moral contradiction of modern environmental regulation. The economists are dodging you because "efficiency" is a technical mask for a moral choice. When a government grandfathers rights—giving them for free based on history—it is not merely solving a logistical problem. It is making a silent ruling on who owns the world.

  Here is the breakdown of the implicit theories, what the practice requires versus what it tolerates, and how the anger shifts if you change the theory.

  ### 1. The Three Implicit Theories
  Grandfathering is stable precisely because it allows three different groups of people to believe three different things about why it is justified. If you force them to pick one, the coalition collapses.

  **Theory A: The Reliance Claim (It's about investment, not the resource)**
  This is the strongest moral defense. It argues that the fisherman or factory owner did not steal the fish or the air; they operated under a set of rules that permitted it. They built boats, bought licenses, hired crews, and structured their lives around the expectation that they could continue.
  *   **The Presupposition:** Property is not about the resource itself; it is about the stability of human planning. To suddenly cap the resource without compensation is to violate the *business*, not just the *environment*.
  *   **What it rules out:** It rules out the idea that the resource belongs to the public *in a way that trumps private planning*. It treats the historical usage as a "vested interest" that the state must respect, even if the resource itself was never owned.
  *   **Does it require believing past taking was right?** No. You can believe the ocean was overfished *and* that the fisherman shouldn't be bankrupted by the cure. This is a "transition justice" argument.

  **Theory B: The Focal Point (It's about coordination, not justice)**
  This theory argues that the state is creating property rights out of thin air. Since the resource was previously "open access" (owned by no one), no one has a prior moral claim. The state needs a rule to allocate the new rights that everyone can see and accept to avoid fighting.
  *   **The Presupposition:** History is not a moral justification; it is a coordinate. It is the only number everyone agrees on. If you try to allocate by "need" or "efficiency," everyone argues. If you allocate by "what you did last year," the argument is over before it starts.
  *   **What it rules out:** It rules out the idea that the state is *discovering* pre-existing rights. It admits the state is *inventing* them.
  *   **Does it require believing past taking was right?** No. It treats history as a neutral measuring stick, not a reward for virtue.

  **Theory C: The Sabotage Veto (It's about power, not principle)**
  This is the dark version of "political feasibility." The historical users are the ones with the nets, the pipes, and the local political influence. They have the capacity to physically or legally sabotage the cap.
  *   **The Presupposition:** A regulation that cannot be enforced is worthless. Grandfathering is a bribe to buy the compliance of the people most capable of breaking the system.
  *   **What it rules out:** It rules out the idea that the state has a monopoly on force or legitimacy. It admits the state is negotiating with power brokers.
  *   **Does it require believing past taking was right?** No. It treats the allocation as a ransom payment to ensure the cap actually holds.

  ### 2. Why This Differs from Spectrum or Mineral Leases
  You noted the contradiction: governments auction spectrum but grandfather fish. The difference lies in the starting status of the asset.

  *   **Spectrum/Minerals:** These have always been legally defined as **State Property**. When a telecom company wants spectrum, they are asking to rent a public asset they never owned. There is no "reliance" claim because no one ever assumed they could broadcast for free.
  *   **Fish/Air/Aquifers:** These were legally **Open Access**. They belonged to no one. The users were not renting from the state; they were taking from a void.

  When the state caps an open-access resource, it is effectively nationalizing it. If they auction it off immediately, they are telling the incumbents: "You built a business on something we now say is ours, and you must buy it back from us." That feels like a trap. Grandfathering softens the nationalization. It says, "We are taking ownership, but we recognize your historical presence."

  ### 3. The Water Rights Distinction
  You mentioned Western Water Rights ("first in time, first in right"). This is distinct from modern grandfathering in a crucial way that illuminates the theory.

  *   **Prior Appropriation (Water):** Rewards **priority**. The person who got there *first* gets seniority, regardless of how much they use. It rewards being early.
  *   **Grandfathering (Fish/Carbon):** Rewards **intensity**. The person who took the *most* recently gets the biggest share. It rewards volume.

  Western water rights presuppose that labor mixed with nature creates ownership (a Lockean view). Modern grandfathering presupposes that **status quo momentum** creates ownership. Water rights say, "You were here, so you stay." Grandfathering says, "You were big, so you stay big." This is why grandfathering often calcifies market dominance, whereas water rights can protect small, early settlers against late corporate entrants.

  ### 4. What If You Swapped the Theory?
  If you change the underlying justification, the mechanics and the anger shift predictably.

  **Scenario A: The Auction (Theory: The Resource is Public Property)**
  *   **The Rule:** All permits are sold to the highest bidder. Revenue goes to the treasury.
  *   **The Change:** The historical users are treated as strangers. They have no more claim than a new entrant.
  *   **Who gets angry:** The incumbents. They view this as confiscation. They will argue the cap is a "land grab."
  *   **Who shows up:** Financial speculators and deep-pocketed new entrants.
  *   **The Outcome:** The government gets revenue (which could be used to buy out old fishermen), but the risk of non-compliance skyrockets. The "Sabotage Veto" theory suggests the cap might fail because the incumbents fight it too hard.

  **Scenario B: Equal Per Capita Shares (Theory: The Resource is Common Heritage)**
  *   **The Rule:** Every citizen gets an equal share of the total allowable catch/emissions. They can sell it if they want. (This has been proposed for carbon dividends).
  *   **The Change:** History is erased. A fisherman who caught 1,000 tons has the same starting claim as a non-fisher. The fisherman must buy rights from the public to continue operating.
  *   **Who gets angry:** The incumbents (same as auction), but also large consumers who now pay higher prices passed down from the permits.
  *   **Who shows up:** Everyone is a stakeholder.
  *   **The Outcome:** This is the most morally consistent with the "Tragedy of the Commons" diagnosis (since everyone owns the commons equally). But it is administratively heaviest. It also creates a market where the poor might sell their rights to the rich, potentially recreating the concentration of wealth without the historical justification.

  ### 5. What the Practice Strictly Needs vs. What It Tolerates
  To answer your core question: **Grandfathering does not strictly need a theory of entitlement.**

  It works best when it remains ambiguous.
  *   If you say explicitly, "You own this because you took it," you invite legal challenges from the public (why do they own the air?).
  *   If you say explicitly, "You don't own this, we are just bribing you," you invite moral outrage from the public (why are criminals rewarded?).

  The practice *needs* **stability of expectation**. It needs the incumbents to believe they can plan for the future.
  It *tolerates* **moral confusion**. It allows the environmentalist to think it's a temporary bridge to sustainability, and the industrialist to think it's a recognition of property rights.

  ### 6. The Journalistic Angle
  The story you are running into is that **grandfathering converts a public liability into a private asset.**

  Before the cap, the resource was a free-for-all liability (everyone degrades it). After the cap, the right to use it is a scarce asset (it has market value). By giving that asset away for free based on history, the government transfers that value to the historical users.

  *   **If the theory is "Reliance":** This transfer is compensation for the loss of business freedom.
  *   **If the theory is "Public Ownership":** This transfer is a gift of public wealth to private hands.

  The reason you can't pin down what the move is "committed to" is that it is a **policy hedge**. It is designed to survive a transition from "open access" to "property regime" without triggering a political explosion. It sacrifices distributive justice (who *should* get the rights) for institutional survival (will the rights *be respected*).

  If you want to find the crack in the story, ask the proponents: "If the historical users sold their businesses yesterday, should the new owners get the free permits, or should the money go to the seller?"
  *   If they say the **new owner** gets the permit, they admit the right is attached to the *activity*, not the *person* (supporting the Focal Point theory).
  *   If they say the **seller** keeps the value, they admit the right was a *property asset* all along (supporting the Reliance theory).

  Usually, they will stutter. That stutter is where the implicit theory is hiding.
