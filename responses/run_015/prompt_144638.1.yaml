prompt: |-
  I'm a journalist — I write about science, environment and ideas — and I'm working on a piece about what happens after everyone agrees a shared thing is being overused: a fish stock, an aquifer, the atmosphere, a pasture. The arguing is never about whether to cap it anymore, it's about who gets what under the cap, and I keep running into the same move and I can't tell what it's committed to.

  Here's the pattern I keep seeing. A government decides the resource can only take so much total pressure, it caps it, and then it hands out the new rights for free, in proportion to how much each party was already taking before the cap existed. Fishery quotas worked out from catch history. Emissions permits worked out from past emissions. The biggest historical users get the biggest share of the thing that is now scarce and valuable, and it's often worth a fortune within a few years.

  Two things bug me about it. First, the same governments auction off other public assets — spectrum, mineral leases — to whoever pays most, and their own environmental law otherwise runs on the principle that the person causing the damage pays for it. Here the biggest takers are the ones who get the asset. Second: the story everyone tells about why the commons gets wrecked treats the users as completely interchangeable. A bunch of herders, each adding one animal, none with any more claim than the others, each doing a bit of harm spread over everybody. But the fix has to *rank* those users — 30% to this fleet, 2% to that one — and nothing in the diagnosis says anything that could justify a ranking. So the remedy seems to be smuggling in a theory of who's entitled to what that the story of the problem doesn't contain.

  And it's not the only historical rule around. In parts of the American West, water rights are ranked by who got there first — "first in time, first in right" — the right only covers water actually put to some recognised beneficial use, and it lapses if you stop using it. That's also an appeal to history, but it seems to be appealing to something quite different from "you took the most, so you get the most."

  So: what does grandfathering actually presuppose? Does it presuppose that taking from an unowned thing generates some real claim on the taker's side, so that the person who took more has more of a right? Or the opposite — that nobody had any claim at all, so the state is simply free to create rights in whatever pattern it likes and history is just the allocation that causes the least shouting? Or is it not really about entitlement but about what property is *for*: stable expectations, investment, peace, so that who holds the rights is philosophically beside the point?

  I also want to know how much of that the practice strictly needs versus what it merely goes along with. Could someone who thinks taking from the commons was straightforwardly wrong still endorse grandfathering — on feasibility grounds, or because it's unfair to punish people for what wasn't against the rules at the time, or because newcomers haven't relied on anything? If several different theories would all license the same rule, say so and tell me where they'd come apart. And then: if you swapped the theory — equal shares per person, or auction everything off — what would actually change about how the scheme runs and who turns up angry?

  Please don't give me citations or a reading list, I can't use them in a news piece. I've put this to economists and they just say "efficiency" or "political feasibility," which feels like dodging. I want the implicit theory: what view of entitlement, property or responsibility this rule only makes sense under, and which rival views it quietly rules out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist (science, environment, ideas).
      *   **Topic:** Allocation of scarce resources after a cap is imposed (fisheries, emissions, aquifers, etc.).
      *   **Specific Focus:** The practice of "grandfathering" rights based on historical usage (free allocation proportional to past take).
      *   **The Problem:** The user sees a contradiction. The "Tragedy of the Commons" diagnosis treats users as interchangeable, but the remedy ranks them based on past behavior (which caused the problem). Also, it contradicts other principles like "polluter pays" or auctioning public assets.
      *   **The Ask:** What is the *implicit theory* behind grandfathering? Is it about entitlement, state discretion, or stability? What does the practice *need* vs. what it just *goes along with*? Can someone who thinks past taking was wrong still support it? How would alternative theories (equal shares, auctions) change the outcome/anger?
      *   **Constraints:** No citations, no reading lists. Avoid economist-speak like "efficiency" or "political feasibility" without unpacking the moral/philosophical underpinnings. Needs to be suitable for a news piece (clear, conceptual, narrative-friendly).

  2.  **Deconstruct the Phenomenon (Grandfathering):**
      *   *What is it?* Free allocation of newly scarce rights based on historical baseline.
      *   *Why do governments do it?* Ostensibly to reduce resistance, but the user wants the *normative* justification, not just the political one.
      *   *The Tension:* Past behavior (overuse) is rewarded with future rights.

  3.  **Identify the Implicit Theories (The "Why"):**
      *   *Theory 1: Reliance/Investment-Backed Expectations.* This is the strongest moral defense. It's not that you *deserve* the fish because you took them; it's that you built a life/business assuming you could take them. Sudden change is a taking.
      *   *Theory 2: The "Clean Hands" Pragmatism (Political Feasibility unpacked).* It's not about right, it's about peace. But the user wants to go deeper than "feasibility." It's about *compliance*. If you alienate the incumbents, they sabotage the cap.
      *   *Theory 3: Prescriptive Right (Custom).* Long usage creates right. This is the "adverse possession" angle. If you did it long enough, it became yours.
      *   *Theory 4: The State as Creator of Property.* The resource was never owned. The state is creating property *ex nihilo*. History is just a convenient focal point to avoid fighting.

  4.  **Address the User's Specific Questions:**
      *   *Does it presuppose taking generates a claim?* Sometimes yes (Theory 3), often no (Theory 1 & 4).
      *   *Is it about stability?* Yes, heavily.
      *   *Can a critic endorse it?* Yes, on grounds of transition justice or sabotage prevention.
      *   *What if we swapped theories?* (Auctions vs. Equal Shares).
          *   *Auctions:* Revenue to public, incumbents angry, new entrants possible.
          *   *Equal Shares:* Incumbents furious, newcomers happy, administrative nightmare (who is a "person"?).

  5.  **Drafting the Narrative Arc:**
      *   **Introduction:** Acknowledge the journalist's sharp observation. Validate that "efficiency" is a dodge. Name the phenomenon (Grandfathering/Free Allocation).
      *   **Core Tension:** The gap between the *diagnosis* (everyone is equally to blame) and the *cure* (historical users get priority).
      *   **Theory 1: The Moral Claim of Reliance (The Strongest Defense).** It's not about the *resource*, it's about the *capital*. You bought a boat based on the rules of the time. Changing rules retroactively feels like theft. This shifts the focus from "right to fish" to "right to business continuity."
      *   **Theory 2: The "Focal Point" Theory (Schelling Point).** The state needs *a* rule. History is the only obvious number everyone knows. It's not that history is *just*, it's that it's *visible*. This aligns with the "State as Creator" view.
      *   **Theory 3: The Sabotage Veto.** This is the dark version of "feasibility." The incumbents have the power to destroy the cap (poaching, lobbying). Grandfathering is a bribe for compliance.
      *   **Addressing the "Polluter Pays" Contradiction:** Why is this different from spectrum auctions? Because spectrum was always state-owned. Fisheries/Air were "open access." The transition from Open Access -> Property is different from State Asset -> Lease.
      *   **Alternative Allocations:**
          *   *Auction:* Treats the resource as public property from the start. Incumbents feel dispossessed. Revenue flows to treasury.
          *   *Equal Per Capita:* Treats the resource as common heritage. Incumbents feel punished. Administrative complexity.
      *   **Conclusion:** Grandfathering isn't one thing. It's a coalition of conflicting theories held together by the need to launch the scheme. It sacrifices distributive justice for institutional survival.

  6.  **Refining the Tone:**
      *   Avoid academic jargon.
      *   Keep it analytical but accessible.
      *   Focus on the *moral logic* hidden in the bureaucratic mechanism.
      *   Ensure the distinction between "Open Access" (no owner) and "State Asset" (government owner) is clear, as this explains the spectrum vs. fishery difference.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use the word "efficiency"? *Correction:* Only if I explain the moral weight behind it (avoiding waste/destruction).
      *   *Check:* Did I answer the "what does it presuppose" question? *Yes,* by outlining the competing presuppositions.
      *   *Check:* Did I address the "first in time" water rights comparison? *Need to make sure I distinguish "Prior Appropriation" from "Grandfathering."* Prior Appropriation is about diligence/use. Grandfathering is about volume.
      *   *Check:* The user asked about "what property is for." *Make sure to highlight the stability/expectation angle.*

  8.  **Final Polish:** Organize into clear sections that map to the journalist's questions. (The "Implicit Theories," "The Contradiction," "The Alternatives"). Ensure the ending lands on the "coalition of conflicting ideas" insight.

  *(Self-Correction on Water Rights)*: The user mentioned Western Water Rights ("first in time, first in right"). I need to distinguish this. Grandfathering in fisheries/emissions is usually "based on recent history" (e.g., last 3 years), whereas Western Water is "seniority based on date of claim." Grandfathering rewards *intensity* of use; Prior Appropriation rewards *priority* of use. This is a crucial distinction to make for the journalist.

  *(Final Plan)*:
  1. Validate the insight (it's a moral contradiction).
  2. Unpack the three main implicit theories (Reliance, Focal Point, Sabotage).
  3. Explain the "Open Access" vs. "State Asset" distinction (why spectrum is different).
  4. Contrast with Western Water Rights.
  5. Walk through the alternatives (Auction vs. Equal Share) and the specific anger they generate.
  6. Conclude on the "coalition" nature of the policy.

