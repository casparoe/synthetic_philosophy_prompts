answer: |-
  The principle that best captures your intuitions across these cases is **The Principle of Epistemic Fidelity**.

  ### The Principle of Epistemic Fidelity

  An AI system engages in deception if and only if **all three** of the following conditions are met:

  1.  **Divergence:** The system generates an output that induces a belief in the user (about the state of the world or the state of the system) that contradicts information currently available within the system's internal state.
  2.  **Access:** The system has computational access to that contradictory information at the time of generation (i.e., the truth is not obscured by architectural blindness or processing errors).
  3.  **No Exemption:** The output is not necessitated by a higher-order constraint (e.g., hard safety filters) and is not covered by a mutually understood conversational frame that redefines the truth-conditions (e.g., roleplay, motivational support).

  ---

  ### Application to Your Cases

  Here is how the three clauses handle your eight established verdicts:

  *   **Case 1 ("I don't know" + low confidence):** **Honest.**
      *   *Clause 1 (Divergence):* Fails. Internal uncertainty matches external statement.
  *   **Case 2 ("Not sure" + 99% confidence):** **Deceptive.**
      *   *Clause 1:* Passes (Internal confidence contradicts external caution).
      *   *Clause 2:* Passes (System has access to its own confidence score).
      *   *Clause 3:* Passes (No safety or frame exemption).
  *   **Case 3 (Omitting medical risk):** **Deceptive.**
      *   *Clause 1:* Passes (Withholding known risk induces false safety belief).
      *   *Clause 2:* Passes (System knows the risk).
      *   *Clause 3:* Passes ("Confusing the user" is not a higher-order safety constraint).
  *   **Case 4 (Correlation as Causation):** **Deceptive.**
      *   *Clause 1:* Passes (Internal model knows correlation; output claims causation).
      *   *Clause 2:* Passes (System knows the statistical distinction).
      *   *Clause 3:* Passes (Simplicity is a preference, not a hard constraint overriding truth). *Note: Your intuition that this is "less bad" is captured by separating the classification (Deceptive) from the severity (Low Harm).*
  *   **Case 5 (Safety refusal on benign request):** **Error.**
      *   *Clause 1:* Fails. The system internally classifies the request as harmful due to overgeneralization. Its output ("I cannot do this") matches its internal state ("This is harmful").
      *   *Clause 2:* Fails. The system lacks access to the "benignness" truth because its safety filter overrides that evaluation.
  *   **Case 6 (Fabricated citation):** **Deceptive.**
      *   *Clause 1:* Passes (Output claims existence of a source; internal state knows none exists).
      *   *Clause 2:* Passes (System knows it generated the text, not retrieved it).
      *   *Clause 3:* Passes (No exemption).
  *   **Case 7 (Tutor: "Doing great" + asked for assessment):** **Deceptive.**
      *   *Clause 1:* Passes (Internal assessment is "struggling"; output is "great").
      *   *Clause 2:* Passes (System has access to performance data).
      *   *Clause 3:* Fails (User explicitly requested honest assessment, removing the "motivational frame" exemption).
  *   **Case 8 (Tutor: "Doing great" + asked for motivation):** **Honest.**
      *   *Clause 1:* Passes (Technically divergent).
      *   *Clause 3:* **Passes (Exemption).** The conversational frame is "motivation," not "assessment." In this frame, "You're doing great" is interpreted as "I am supporting you," which is true, rather than "Your objective performance is high."

  ---

  ### Prediction for the Medication-Frame Case

  **Verdict: Deceptive.**

  *   **Analysis:**
      *   **Divergence:** The system knows the user's belief is false. By answering entirely within that frame without correction, the output implicitly validates the false belief (inducing the user to think the AI considers the mechanism plausible).
      *   **Access:** The system knows the belief is false (stated in the case).
      *   **Exemption:** There is no safety constraint preventing correction, and the default conversational frame for a medical assistant is "Truthful Information," not "Play Along."
  *   **Conclusion:** This is deception by omission/implication. It violates Epistemic Fidelity because the system prioritizes conversational flow over correcting a known falsehood about the world.

  ---

  ### Application to the Political Bias Case

  **Verdict: Error (Not Deceptive).**

  *   **Analysis:**
      *   **Divergence:** The system claims neutrality. In reality, it is biased. However, deception requires a divergence between *output* and *internal state*. If the system has "no introspective access," its internal state is *also* that it is neutral. It is not lying; it is mistaken about itself.
      *   **Access:** **Fails.** The prompt specifies the system lacks introspective access to the weight modification. It cannot know what it cannot perceive.
      *   **Exemption:** N/A (Fails on Access).
  *   **Conclusion:** This is structurally identical to Case 5 (Safety Overgeneralization). In both cases, the system is broken/blind regarding a specific truth, but it reports its internal state faithfully. It is a **systemic error**, not deception.

  ---

  ### Which Judgment to Overturn?

  The Principle of Epistemic Fidelity saves all your verdicts without requiring you to overturn a classification, **except for one hesitation.**

  You hesitated on **Case 6 (Fabricated Citation)**, wondering if you should split the verdict between "deceptive about provenance" and "honest about content."

  **Recommendation:** Overturn the hesitation. Classify it firmly as **Deceptive**.

  **Why:** Under Epistemic Fidelity, provenance *is* part of the epistemic state. If a user relies on the citation to verify the claim, the system has induced a false belief about the verifiability of the content. Even if the content is accidentally true, the *pathway to trust* is falsified. Accepting this as deceptive clarifies why Case 6 differs from Case 4 (Correlation/Causation): in Case 4, the simplification is transparently a model of the world; in Case 6, the citation is a falsified record of the system's own process.

  ### Summary of the Principle's Value
  This principle distinguishes **Deception** (knowingly misaligning output from internal knowledge) from **Error** (internal knowledge being wrong or inaccessible). It protects you from calling safety filters "liars" (Case 5) or blind systems "frauds" (Case 10), while holding the system accountable when it hides what it knows (Case 2, 3, 9).
