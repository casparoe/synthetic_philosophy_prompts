answer: |-
  **Question 1**
  Let's begin with the status of the assumption itself. You argue that the Common Prior Assumption is not an empirical claim about agents, but a completeness requirement on the modeler: if priors differ, the state space is simply too small. But if any observed divergence can be reconciled by positing some hidden state variable—some difference in history, evidence, or training—then it seems no observation could ever count against the CPA. If a constraint is compatible with every possible dataset, isn't it functioning as a tautology rather than a restriction on our models?

  *Likely Reply:* She will likely argue that it is a *regulative ideal* or a methodological norm, akin to assuming rationality. It forces the modeler to look harder for the missing variables rather than lazily attributing differences to "irrationality" or "different priors."
  *Follow-up:* But methodological norms usually forbid certain constructions; for example, assuming rationality forbids modeling an agent who knowingly chooses a dominated strategy. If the CPA forbids *nothing*—because we can always enlarge the state space—what specific model structure are you ruling out? If the answer is "none," then aren't you simply relabeling "different priors" as "different states" without gaining any explanatory leverage?

  **Question 2**
  I want to press on the regress worry that follows from that enlargement. You say we recover a single prior by expanding the state space to include the reasons for the agents' beliefs. But that new, enlarged space requires a prior distribution over it, and for your thesis to hold, *that* prior must also be common. If the agents disagree about the reasons for their beliefs, do we need a third enlargement? Where does this hierarchy stop, and is the stopping point anything other than the modeler's own stipulation?

  *Likely Reply:* She will likely say the hierarchy stops at the "modeler's omniscience" or the "objective" description of the world, which by definition is unique.
  *Follow-up:* If the commonality is guaranteed only by the modeler's stipulation of an objective view, then haven't you just moved the disagreement from the agents to the analysts? If two modelers disagree on the "objective" state space, your framework gives them no tool to resolve that disagreement without one simply imposing their space on the other. Does this make the Common Prior a property of the world, or just a property of a specific author's choice of notation?

  **Question 3**
  Let's turn to the empirical implications. We observe persistent trade and persistent forecast gaps in real markets. The no-trade theorem tells us this shouldn't happen under Common Priors and Common Knowledge. You locate the failure in Common Knowledge rather than the Priors. But there are many ways to relax Common Knowledge. Which specific notion of "approximate common knowledge" are you relying on to allow for this volume of trade, and is it robust enough to handle the scale of disagreement we actually see?

  *Likely Reply:* She will likely invoke the Monderer and Samet formulation of approximate common knowledge, arguing that slight perturbations in higher-order beliefs allow for significant divergence in action.
  *Follow-up:* But Rubinstein's email game demonstrated that even with very high orders of approximate common knowledge, agents are still forced into approximate agreement. To get the *volume* of trade we see, the "approximation" error has to be quite large. At what point does the error term become so large that it effectively functions as a second prior, undermining your claim that the priors themselves are common?

  **Question 4**
  Following on that, if the "lack of common knowledge" is doing all the heavy lifting to explain away trade, we need to know how much room that gives you. Quantitatively, how much uncertainty about the other agent's certainty is required to justify a bet that looks, from the outside, like a speculative trade between peers? Is the region of "permissible disagreement" under your view large enough to cover standard financial anomalies, or does it only cover edge cases?

  *Likely Reply:* She will likely argue that in complex environments, the depth of the knowledge hierarchy is shallow, so the "room" for disagreement is actually quite vast.
  *Follow-up:* If the room for disagreement is vast because the knowledge hierarchy is shallow, then the Common Prior is doing very little work to constrain behavior. If the constraint on behavior comes entirely from the depth of knowledge rather than the commonality of the prior, why not just model the knowledge depth directly and drop the Common Prior requirement altogether?

  **Question 5**
  I'd like to examine the diagnostic tool you rely on: the equivalence between a Common Prior and the non-existence of an agreeable bet. That equivalence theorem depends on specific technical conditions—finite state spaces, common knowledge of the bet's terms, and often risk neutrality. Real agents rarely announce posteriors to one another, and they are rarely risk-neutral. Given that the strict conditions of the theorem rarely hold, can the no-bet result still do the normative diagnostic work you want from it?

  *Likely Reply:* She will likely contend that the theorem captures a fundamental logical intuition that holds approximately even if the technical conditions are relaxed.
  *Follow-up:* But in formal epistemology, "approximately" is where the demons live. If agents are risk-averse, a bet might be rejected even with different priors, or accepted even with common priors due to hedging motives. If the diagnostic test yields false positives and false negatives in realistic settings, on what grounds do you tell a practitioner that a disagreement *must* be a modeling error rather than a genuine difference in attitude or belief?

  **Question 6**
  Continuing with the diagnostic issue: for the no-bet logic to apply, agents must be able to condition on each other's opinions. But in most real disagreements, I don't know your posterior probability; I only know your conclusion. If I can't see your probability distribution, I can't check for a Dutch Book. Does your normative moral—that I should suspect my model—only apply in the rare cases where we exchange full probabilistic credences, or does it extend to ordinary linguistic disagreement?

  *Likely Reply:* She will likely say that actions reveal credences, so we can infer the posteriors from the bets or assertions people make.
  *Follow-up:* Actions reveal the combination of beliefs *and* utilities. If I see you making a claim, I don't know if you believe it strongly with low utility at stake, or weakly with high utility at stake. Without being able to disentangle utility from belief, how can I apply the Common Prior test to determine whether the disagreement is in the model or in the agent?

  **Question 7**
  Let's look at observational equivalence. From the outside, two forecasters with access to the same data but different priors look identical to two forecasters with a common prior but different private information. Both pairs will issue different forecasts. Since the behavioral data underdetermines the explanation, why should we prefer the "missing variable" story over the "different priors" story? Is there any evidence that could tilt the balance?

  *Likely Reply:* She will likely argue for parsimony: assuming a common prior is simpler than positing a distribution over priors, so we should prefer it until forced otherwise.
  *Follow-up:* But in your framework, "forcing otherwise" never happens, because we can always add a state variable. If the "missing variable" story can explain everything the "different priors" story can, but the reverse isn't true, isn't the Common Prior hypothesis actually *less* parsimonious because it requires a more complex state space to maintain the assumption?

  **Question 8**
  There is a harder version of that problem. Sometimes disagreement isn't about the evidence, but about the *likelihood function*—how the evidence bears on the hypothesis. One agent thinks a data point confirms a theory; the other thinks it's noise. Your view suggests we should model this difference as part of the state. But if the "state" includes the agent's reasoning algorithm, haven't you just defined away the possibility of irrationality? Is there any cognitive divergence left that counts as a violation of your model?

  *Likely Reply:* She will likely distinguish between "reasoning errors" (which are violations) and "different theoretical commitments" (which are state variables).
  *Follow-up:* But the line between a theoretical commitment and a reasoning error is often exactly what is in dispute. If I think your commitment is a bias, and you think my commitment is a theory, your framework tells me to model your bias as a state variable. Doesn't this force me to treat *all* divergence as rational relative to some hidden state, thereby making the concept of "epistemic peer disagreement" incoherent?

  **Question 9**
  This brings us to the normative moral of your book. You argue that when I disagree with a peer, I should treat it as a defect in my model before treating it as a defect in them. But this advice is symmetric: my peer has the same reason to suspect their model. If we both update to fix our respective models, does your framework guarantee convergence? Or can we both expand our state spaces in different directions and remain in disagreement?

  *Likely Reply:* She will likely say that if we are both rational and truly share a common prior, expanding the state space correctly will eventually lead us to the same partition of knowledge.
  *Follow-up:* But "correctly" is the operative word. If we disagree on which variables are relevant to the expansion, we need a prior to adjudicate which expansion is correct. Aren't you using the very prior we are disputing to tell us how to resolve the dispute? Is there a non-circular way to determine which model expansion is the "right" one?

  **Question 10**
  Suppose we accept that we should conciliate. The Agreement Theorem tells us we *cannot* agree to disagree, but it doesn't tell us *who* should move. If I have a prior and you have a prior, and we realize they differ, your view says we must find the common prior underlying them. But until we find it, whose posterior should I weight more heavily? Does the framework offer any guidance on the direction of deference?

  *Likely Reply:* She will likely suggest we should weight by the size of the information set or the reliability of the source.
  *Follow-up:* But assessing reliability or information set size requires a probability judgment. If I think you are unreliable, I am effectively assigning low probability to your information being relevant. Doesn't determining "who is more reliable" require the very common prior we are trying to recover? How do I bootstrap the common prior without already having it?

  **Question 11**
  Your normative advice hinges on the concept of an "epistemic peer." But how do I identify a peer without already assuming a common prior? If I define a peer as someone with similar access and competence, but they reach a different conclusion, your thesis implies they must have access to a state variable I don't know about. How can I verify they are a peer—and thus deserve the conciliatory response—without first solving the disagreement that made me question their peerhood in the first place?

  *Likely Reply:* She will likely argue that peerhood is an ex-ante judgment based on track records and credentials, independent of the specific disagreement at hand.
  *Follow-up:* But track records are interpreted through our priors. If I have a prior that says "people from School X are biased," I will interpret their track record differently than you will. If the identification of a peer is prior-dependent, then your normative moral only applies to people who already agree on who the peers are. Does this limit the moral to cases where it isn't needed?

  **Question 12**
  Finally, I want to ask about the limits of your view. We've discussed how the model can absorb many challenges by expanding the state space. So, put it to me directly: what would make you give up the closure reading? I'm not looking for a logical contradiction, and "it stops being a useful model" is too vague. Is there a specific structural feature of a disagreement, or a type of empirical evidence, that would force you to admit that the Common Prior Assumption is false rather than just incomplete?

  *Likely Reply:* She will likely try to retreat to the position that it is a framework choice, so it can't be "false," only "less useful."
  *Follow-up:* If you take that retreat, then the debate is merely pragmatic. But you present the moral as binding on rational agents. If the assumption can never be false, only "less useful," then the moral is not about truth or rationality, but about aesthetic preference in modeling. Are you willing to concede that your normative moral is just a suggestion for cleaner mathematics, rather than a requirement for rational belief?
