answer: |-
  This is a classic problem in the philosophy of social norms, centering on the definition of "convention" most famously articulated by David Lewis in *Convention: A Philosophical Study* (1969). Your colleague's verdicts track the Lewisian account closely, but as you have spotted, there is a tension between the *structural conditions* of a convention (solving a coordination problem) and the *psychological conditions* (sustained by mutual expectations).

  Here is the breakdown of the predictions, the likely principle your colleague is using, a test case to separate them, and the philosophical view on the maturation of norms.

  ### 1. Predictions for the Startup Case

  Let's apply your two candidate principles to the startup stand-up meeting (9:00 a.m., decreed by founder, enforced by firing, arbitrary time).

  *   **Principle 1 (Coordination Problem):** This principle looks at the *structure* of the situation.
      *   *Analysis:* Is there a coordination problem? Yes. The team needs to meet simultaneously to communicate effectively. Is there a uniquely best solution? No. 9:15 a.m. would work just as well as 9:00 a.m.
      *   *Prediction:* **Convention.** (The structural criteria are met: arbitrary regularity solving a coordination problem.)
  *   **Principle 2 (Common Expectation):** This principle looks at the *sustaining mechanism*.
      *   *Analysis:* Is the practice sustained because participants expect others to conform and prefer to conform conditional on that expectation? The prompt states explicitly: "everyone now shows up at 9:00 because of the founder's rule, not because they independently expect one another to." The motivating reason is fear of enforcement, not interdependent expectation.
      *   *Prediction:* **Not a Convention.** (The psychological criteria are missing; it is an imposed rule, not a convention.)

  ### 2. Which Principle is She Running?

  **Best Guess:** She is running **Principle 2 (Common Expectation)**, likely embedded within a strict Lewisian framework that requires *both* coordination and expectation, but treats expectation as the defining *normative* feature.

  **Why?**
  1.  **Her Definition:** Her rough definition explicitly cites the *reason* the practice holds: "holds **because** each participant expects the others to do it." This is a causal claim about sustenance. The startup case explicitly negates this cause.
  2.  **The Dinner Verdict:** She rejected the dinner habit because "each person simply chooses for herself." This indicates she is looking for *interdependence of choice*. In the startup case, the choice is interdependent (we must meet together), but the *reason for the choice* is external authority. If she were running Principle 1, the interdependence of the meeting time would be sufficient to classify it as a convention. The fact that she emphasizes the *source* of the regularity in her definition suggests the psychological state (expectation) is the necessary condition.
  3.  **The Chess Verdict:** By rejecting chess rules because they "define the game," she aligns with the distinction between *constitutive* rules and *conventional* (regulative) norms. However, an imposed regulative rule (like the startup meeting) is still not a convention if it lacks the bottom-up expectation.

  **Verdict:** She will almost certainly classify the startup meeting as **Not a Convention**. To her, it is an **authoritative decree** or an **imperative norm**, not a convention.

  ### 3. A Further Case to Separate the Principles

  To definitively prove which principle she is using, you need a case where Principle 1 says "No" but Principle 2 says "Yes." The startup case separates them one way (P1=Yes, P2=No); this case separates them the other way.

  **The Case: "The Holiday Card Ritual"**
  Imagine a community where everyone sends a holiday card to their neighbors in December.
  *   **Structure (P1):** There is no strict *coordination problem*. If I send you a card and you do not send me one, we do not "crash" or fail to coordinate in the way drivers do. My sending a card does not mechanically enable you to send one. There is no arbitrary equilibrium required for success.
      *   *Principle 1 Prediction:* **Not a Convention.**
  *   **Expectation (P2):** The practice is sustained entirely by mutual expectation. I send a card because I expect you to send one, and I expect you to expect me to send one. If I knew no one else did it, I would stop.
      *   *Principle 2 Prediction:* **Convention.**

  **How to use this:** If she classifies the Holiday Card ritual as a convention, she is prioritizing Expectation (Principle 2). If she rejects it because "there's no coordination problem," she is prioritizing Structure (Principle 1) or adhering to a strict Lewisian view that requires both. Given her dinner verdict, she might reject this too, but her reasoning will tell you everything: if she rejects it because "people choose for themselves," she is focused on interdependence (P1). If she accepts it as a social norm driven by expectation, she is focused on P2.

  ### 4. On Maturation and Enforcement

  **Can an enforced practice mature into a convention?**
  **Yes.** This is a standard genealogy of social norms. Many traffic laws began as arbitrary statutes enforced by the state. Over time, as enforcement becomes less visible or costly, individuals may continue the practice because they *expect* others to continue it (to avoid accidents or social friction). At the moment the motivation shifts from "I will be fined" to "I expect you to drive on the right, so I will too," the norm transitions from an **imperative** to a **convention**.

  **Should this change how she rules on the startup case?**
  **No.** Classification should be **synchronic** (based on the current state), not **diachronic** (based on potential future states).
  *   **Philosophical Reason:** A norm's status depends on its current source of normativity. Currently, the startup rule derives its force from the founder's authority. It is a command. If the founder leaves tomorrow and everyone continues showing up at 9:00 a.m. solely because they expect each other to, *then* it becomes a convention.
  *   **Advice:** You should argue that while the practice has the *potential* to become a convention, it is currently a **regulative rule backed by sanction**. Conflating the two obscures the mechanism of stability. If you are studying how norms *come to be*, you must distinguish the *origin* (decree) from the *sustenance* (expectation). If she classifies it as a convention now, she loses the ability to track that transition.

  **Summary for your discussion:**
  Tell her you suspect she is applying a **Lewisian Expectation Condition**. Predict she will reject the startup case as a convention because the *reason for compliance* is authority, not mutual expectation. Use the "Holiday Card" case to test if she requires a coordination problem or just mutual expectation. Finally, argue that while enforced norms can *become* conventions, they are not conventions *while* they are merely enforced, lest we lose the distinction between law and custom.
