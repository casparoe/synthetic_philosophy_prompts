      *   *Why?* The Chair's argument relies on "Cantorian Utilitarianism" which is widely regarded as decision-theoretically unstable. The "Boundedness Contingency" (Worry 3) is the knockout blow. You cannot base a fiduciary decision on whether the universe is temporally infinite.
      *   *What about the Gardener?* It's a decent heuristic for policy, but for a single endowment payout, it's too abstract.
