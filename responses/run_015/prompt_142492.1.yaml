      *   *Worry 3 (Boundedness Contingency):* If the future ends (finite), the math flips. It's odd that a metaphysical fact unknown to us dictates the moral choice now. *Assessment:* Very strong. Moral decisions shouldn't hinge on unknowable cosmological facts if the immediate consequences are identical.

