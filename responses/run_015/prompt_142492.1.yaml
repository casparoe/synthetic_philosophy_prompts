      *   *Refining the Vote:* If the goal is *relief of suffering*, the Hospital is concrete. The Repository is speculative. The Chair's math is broken.
      *   *But:* The Professor is a moral philosopher. They should recognize the "Longtermist" critique. However, the Chair's specific argument (Infinity $\times$ Probability = Infinity) is the weak point to attack.
      *   *Best Argument:* **Discounted Expected Value with a Finite Horizon.** We cannot treat the infinite future as a calculable magnitude. We must treat the future as *uncertain* and *discounted*. Under discounting, the certain near-term good outweighs the speculative far-term good.
