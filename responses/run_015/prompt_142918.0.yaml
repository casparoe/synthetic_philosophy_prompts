answer: |-
  # Adversarial Collaboration Document: Quinean Metaethics

  ## 1. Agreed Claims

  1.  **Rejection of the Analytic-Synthetic Distinction:** Both camps affirm Quine's thesis that there is no sharp boundary between truths grounded in meaning and truths grounded in fact. Consequently, ethical claims cannot be insulated from empirical revision by appealing to conceptual truth alone.
  2.  **Scope of Scientific Inquiry:** Both camps accept that Quinean naturalism extends beyond physics to include sociology, economics, and psychology as legitimate components of the web of belief. These disciplines contribute to our overall theory of the world and are subject to empirical constraint.
  3.  **Non-Foundationalist Circularity:** Both camps endorse the coherentist model of justification (often illustrated by Neurath's Boat), wherein science is not built upon indubitable foundations but is revised from within using its own best methods. Naturalism is a stance within science, not a prior philosophical justification of it.
  4.  **Quine's Direct Contributions to Ethics:** Both camps acknowledge that Quine made negligible direct contributions to normative or metaethical theory. His corpus contains no systematic treatment of moral ontology, leaving his successors to extrapolate his position from his general epistemological and ontological commitments.

  ## 2. Disagreements Table

  | Issue | Quinean Moral Naturalist Formulation | Quinean Ontological Minimalist Formulation |
  | :--- | :--- | :--- |
  | **Status of Moral Predicates in Regimented Ontology** | Moral predicates can and should be part of a regimented scientific ontology if they prove indispensable to our best empirical theories of human behavior and social coordination, analogous to mathematical entities in physics. | Moral predicates are dispensable to every regimented scientific theory; therefore, they should not be treated as ontologically committing entities but rather as conventional expressions of preference or emotion. |
  | **Interpretation of Quine's Silence on Ethics** | Quine's silence represents an omission or an incomplete project; his naturalistic framework logically extends to ethics, requiring us to naturalize moral properties rather than exclude them. | Quine's silence represents a principled exclusion; his indispensability criterion implicitly demarcates science from practical discourse, indicating that ethics falls outside the scope of ontological inquiry. |

  ## 3. Cruxes

  The following sub-questions identify the specific empirical or theoretical resolutions that would shift the burden of proof between the two camps.

  ### Crux (a): Indispensability in Evolutionary Game Theory
  **Sub-question:** Do evolutionary-game-theoretic models of cooperation and altruistic punishment make moral vocabulary indispensable in the same way that mathematical entities are indispensable to physics?

  *   **Concrete Case:** The modeling of stable punishment strategies in iterated prisoner's dilemmas.
  *   **Agreed Relevance:** Both sides agree that if moral terms (e.g., "fairness," "norm violation") function as irreducible variables in the most predictive models of human cooperation, they gain ontological standing via the indispensability argument. If they can be eliminated without loss of predictive power, they lack ontological standing.
  *   **Quinean Moral Naturalist Prediction:** Predictive success depends on treating fairness as an irreducible causal variable. Models that abstract away from normative expectations will fail to predict the stability of cooperation in large-scale groups where behavioral descriptors alone are insufficient to explain punishment costs.
  *   **Quinean Ontological Minimalist Prediction:** The same predictions can be recovered with purely behavioral descriptors. Variables such as "payoff reduction," "strategy frequency," and "response latency" are sufficient to model stable punishment without positing "fairness" as a causal entity in the ontology.

  ### Crux (b): Normative Sociology and Cross-Cultural Disagreement
  **Sub-question:** Does Quine's inclusion of normative sociology within science force a descriptive interpretation of its normative claims, or does it permit them to retain prescriptive force without ontological cost?

  *   **Concrete Case:** The status of cross-cultural moral disagreement in empirical sociology.
  *   **Agreed Relevance:** Both sides agree that the empirical data regarding moral variation constrains the hypothesis that moral terms track mind-independent natural properties. The interpretation of this variation determines whether moral sociology describes a unified natural kind or disparate conventional systems.
  *   **Quinean Moral Naturalist Prediction:** The persistence of disagreement merely reflects different parameter settings within a shared descriptive framework. Variation is consistent with moral terms tracking real features of human coordination (e.g., equilibrium selection problems), much like linguistic variation is consistent with a universal grammar.
  *   **Quinean Ontological Minimalist Prediction:** The persistence of disagreement undermines the claim that moral terms track real features of human coordination. The lack of convergence suggests that moral vocabulary does not refer to a unified natural ontology but rather indexes local conventions or preference structures.
