answer: |-
  1. Core commitments restated (approx. 150 words)
  Standard Lexical Threshold Negative Utilitarianism posits that suffering above a fixed intensity trumps all utility. Your view modifies this twice. First, lexicality is intra-modal: severe physical pain trumps physical pleasure, but mental suffering trades off against sensory pleasure. Crucially, this implies physical pain might be traded for mental pleasure, as lexicality does not cross modalities. Second, the threshold is subjective, indexed to an agent's experiential history rather than a universal scale. Shared with standard NU is the asymmetrical weight on suffering; distinctive is the rejection of universal lexicality and the compartmentalization of modalities. This creates a hybrid where some suffering is absolute (physical), some is relative (mental), and the definition of "absolute" varies by person.

  2. Decisive defeaters (approx. 300 words)
  The most fatal defeater is the collapse into subjective relativism. If thresholds depend on prior baselines, moral obligations become agent-relative. Causing identical pain could be impermissible for a sensitive agent but permissible for a hardened one, undermining the universal prescriptivity required of normative ethics. This threatens the very notion of moral wrongness. If wrongness is indexed to the victim's baseline, there is no fact of the matter about whether an act is wrong independent of the victim's history. This dissolves moral truth. A sadist with a high suffering baseline could legitimately impose pain that counts as lexical suffering for a victim, provided the sadist's utility calculation holds, creating a loophole for exploitation. An actor cannot know if they are violating rights without omniscient knowledge of the victim's history. This epistemic gap transforms moral rules into guesses.

  Secondly, the intra-modal restriction faces a phenomenological challenge. Pain is inherently mental; distinguishing physical suffering from mental suffering is arguably artificial. This split fails under conditions like phantom limb pain or psychosomatic illness, where the modality is ambiguous. If physical pain is just a sensory input plus a mental negative reaction, allowing trade-offs for the mental component while forbidding them for the physical creates an arbitrary fissure. This arbitrariness allows egregious suffering to be traded away simply by categorizing it as mental.

  Finally, baseline indexing creates perverse incentives. Agents might cultivate sensitivity to increase the lexical weight of their complaints. This gamification contradicts the egalitarian impulse of negative utilitarianism, punishing resilience and rewarding vulnerability. Regarding aggregation, if thresholds shift dynamically, calculating collective welfare becomes computationally impossible. In public policy, we cannot audit every citizen's experiential history. Without aggregation, utilitarianism loses its defining feature. These rank from fatal (relativism and incentives) to severely damaging (phenomenology and aggregation).

  3. Serious but survivable objections (approx. 250 words)
  Serious objections include clinical impracticality and the prohibition of sacrifice. In pain management, relieving severe physical pain often requires sedation inducing mental suffering. If physical pain is lexical intra-modally, clinicians face paradoxical directives: relieve physical pain even if it destroys mental capacity. This could mandate keeping patients in vegetative states. Furthermore, heroic sacrifice becomes incoherent. If an agent faces lexical physical suffering to save others, the view forbids it, as no amount of others' pleasure outweighs that lexical pain. Consider the soldier falling on a grenade. The physical pain is lexical. The lives saved produce massive utility. Standard utilitarianism permits this; your view forbids it. This eliminates a core category of moral praise.

  While a defender can argue protecting the vulnerable is worth these costs, the theory demands counterintuitive prioritizations clashing with instincts regarding duty. It complicates consent; a person cannot consent to lexical suffering even for long-term gain, undermining autonomy in surgery. Additionally, resource allocation becomes skewed. Society might pour resources into alleviating minor physical discomforts for sensitive individuals while ignoring widespread mental anguish. This creates distributive injustice where the sensitive dominate moral priority. The theory also struggles with intergenerational justice. Future generations have different baselines. We cannot know if current sacrifices create lexical suffering for them, making long-term planning ethically blind. These costs are survivable only if one accepts that negative utilitarianism is primarily a constraint on cruelty.

  4. What defenders should concede (approx. 200 words)
  Defenders must concede that the baseline indexing severely limits the theory's utility for public policy. You cannot dismiss the charge of relativism merely by appealing to context; you must admit that interpersonal comparison is weakened. However, you can dismiss objections claiming the view ignores mental suffering entirely. The intra-modal structure explicitly allows mental suffering to be weighed against pleasure; critics misreading this as total lexicality are attacking a straw man. The genuine concession is epistemic: acknowledging that determining an individual's baseline is often impossible for external agents, making the theory ideal rather than practical. You must accept that this limits its scope to retrospective judgment or highly intimate care contexts. You must also concede that the physical/mental distinction is porous; while you can maintain it theoretically, in practice, chronic physical pain becomes mental suffering. Accepting this porosity requires admitting that the lexical barrier will frequently shift modalities, reducing the stability of the core commitment.

  5. Insulation check (approx. 150 words)
  The combination of intra-modal restriction and baseline indexing risks unfalsifiability. If a counterexample arises—say, a case where physical pain seems tradeable—the defender can claim the pain wasn't "lexical" for that baseline. If mental suffering seems lexical, the defender can reclassify it as physical. This methodological vice transforms the theory from a normative guide into a post-hoc description of intuitions. While context-sensitivity is a legitimate feature of ethics, a theory that adjusts its parameters to absorb every counterexample loses predictive power. It becomes a taxonomy of feelings rather than a decision procedure. For a normative theory, this insulation is problematic; it protects the view from refutation but empties it of action-guiding content.

  6. Bottom-line verdict (approx. 100 words)
  The view is highly exposed to the charge of practical incoherence. While philosophically nuanced, the baseline indexing makes interpersonal aggregation nearly impossible. The single argument that should move you most is the "Policy Paralysis" objection: if thresholds are subjective and dynamic, you cannot construct rules for institutions or governments. You are left with a personal ethic that cannot scale, rendering it insufficient as a comprehensive moral theory.
