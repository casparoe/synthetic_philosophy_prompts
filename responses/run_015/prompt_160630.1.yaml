prompt: |-
  I work as a research assistant to a retired diplomat who now writes and broadcasts on the ethics of force, and I am the one assembling a table of everything she has publicly committed to, because she has agreed to give evidence to a parliamentary committee on humanitarian intervention next month and has a bad habit of saying that each case must be judged on its own facts. The track record I have managed to reconstruct from her columns, her memoir and two interviews is this. On Kosovo in 1999 she backed the NATO air campaign despite the absence of Security Council authorization, and she continues to insist that legal status and moral justification can come apart; she also always notes that the point was to stop the expulsion of the Albanian population and that the Serbian leadership was left in office afterwards. On Iraq in 2003 she was opposed from the start: no authorization, no ongoing mass atrocity, regime change announced as policy in advance, the threat assessment overstated, and the aftermath catastrophic. On Libya in 2011 she gives what I think of as her split verdict: the initial air campaign, authorized by the Council to protect civilians, was right; the arming of the rebels and the pursuit of the leadership turned protection into a war of overthrow; and she treats the collapse that followed as part of the verdict rather than as bad luck. On Syria in 2013 she opposed strikes after the chemical attack outside Damascus, on the grounds that they would have been unauthorized, that nobody had a plan for what came next, that escalation was likely, and that some of the rebels she did not want armed would have benefited. On Rwanda in 1994 she calls the failure to reinforce and re-mandate the mission already on the ground one of the great moral failures of her professional lifetime, and she does not treat the lack of authorization as any kind of excuse. On the Indian intervention in East Pakistan in 1971 she has said it was on balance right, though she never fails to add that it ended in the dismemberment of a state, and I cannot get her to say how much that counts against it.

  The case she will be asked about is not a historical one. The government of Vardania has for fourteen months been driving the Orran minority out of two northern provinces, using regular army units together with allied militias; UN monitors on the ground estimate forty thousand dead and six hundred thousand displaced, and their public forecast is several hundred thousand more deaths if the campaign continues through the winter. A Security Council resolution authorizing force to protect civilians was put to a vote and vetoed by a permanent member that supplies the Vardanian air force and has a basing agreement with it. A regional organisation of neighbouring states then authorized an air campaign, which its members are now flying, with no ground component; the mandate as written covers only the aircraft and artillery being used against civilians. The intervener has publicly refused to arm the Orran self-defence militias, though a third country is doing so quietly and everyone knows it. In the fifth week, after the government began directing attacks on civilians from the national command bunker under the presidential palace, the bunker was struck and the president and much of the high command were killed; the regular army then defected to the rebels rather than dissolving, so unlike Iraq the officer corps and the ministries survived more or less intact, and the capital fell three weeks later. Revenge killings of civilians belonging to the formerly dominant group have since claimed, by the monitors' count, something in the low thousands. The intervening state also has a second reason for being there: it wants to keep the port access the old government granted it, and it has said nothing to dispel that impression.

  I have to write the briefing note predicting what she will say, and I would rather get the structure of her thinking right than the bottom line. As I read the table, at least four rules fit all six of her verdicts about equally well: a rule requiring multilateral authorization with a narrow exception for ongoing mass atrocity the Council has failed to address; a rule that counts authorization only as evidence and asks whether the force was necessary, proportionate in its means and expected to leave things better; a rule that turns on whether a new political outcome was imposed rather than merely foreseen; and a rule that asks whether the intervener's motives were sufficiently clean. My sense is that these come apart sharply on Vardania, because it is at once unauthorized, atrocity-stopping, means-limited, lethal to a head of state, outcome-imposing, aftermath-tolerable and motive-mixed, and the surface analog is Libya while the deeper ones are Kosovo and 1971. So: what verdict should I expect her to give, and should I write it up as approval, condemnation, or another split; which of those rules is she most plausibly running, and what does each of the others predict here; where exactly do the two closest candidates diverge and how confident should I be; if her track record genuinely underdetermines the case, what principle would she be committing herself to with each of the available answers; and finally, what hypothetical variant should I put to her in the prep session to force the surviving rules apart?
reasoning: |-
  Here's a thinking process that leads to the suggested briefing note:

  1.  **Analyze the Request:**
      *   **Role:** Research Assistant to a retired diplomat/ethicist.
      *   **Task:** Write a briefing note predicting the diplomat's verdict on a hypothetical case (Vardania) based on her past track record (Kosovo, Iraq, Libya, Syria, Rwanda, East Pakistan).
      *   **Goal:** Get the *structure of her thinking* right, not just the bottom line.
      *   **Key Constraints:** The diplomat often says "each case must be judged on its own facts," but the RA has identified four potential rules that fit her past verdicts. The Vardania case is designed to make these rules diverge.
      *   **Specific Questions to Answer:**
          1.  What verdict to expect (Approval, Condemnation, Split)?
          2.  Which rule is she most plausibly running?
          3.  What do the other rules predict?
          4.  Where do the two closest candidates diverge, and how confident should the RA be?
          5.  If underdetermined, what principle is she committing to with each answer?
          6.  What hypothetical variant to use in prep to force the rules apart?

  2.  **Analyze the Diplomat's Track Record (The Data):**
      *   *Kosovo (1999):* **Supported.** No UN authorization (illegal but morally justified). Goal: Stop expulsion. Outcome: Leadership remained (no regime change imposed).
      *   *Iraq (2003):* **Opposed.** No UN authorization. No ongoing mass atrocity. Regime change announced. Threat overstated. Aftermath catastrophic.
      *   *Libya (2011):* **Split.** Initial protection (UN authorized) = Right. Arming rebels/overthrow = Wrong. Collapse = Part of verdict (foreseeable consequence).
      *   *Syria (2013):* **Opposed.** Unauthorized. No plan for aftermath. Escalation likely. Bad rebels benefited.
      *   *Rwanda (1994):* **Supported (inaction condemned).** No authorization excuse accepted. Failure to reinforce = Moral failure. (Implies authorization is secondary to stopping atrocity).
      *   *East Pakistan (1971):* **Supported (On Balance).** Ended in dismemberment of a state. (Implies state integrity is less important than stopping atrocity, but counts as a negative).

  3.  **Analyze the Four Candidate Rules:**
      *   *Rule 1 (Authorization + Exception):* Multilateral auth required *unless* ongoing mass atrocity + Council failure.
      *   *Rule 2 (Consequentialist/Jus ad Bellum):* Authorization is evidence only. Focus: Necessity, Proportionality, Better Outcome expected.
      *   *Rule 3 (Political Outcome):* Was a *new* political outcome imposed vs. merely foreseen? (Regime change intent).
      *   *Rule 4 (Motives):* Were intervener's motives sufficiently clean?

  4.  **Analyze the Vardania Case (The Test):**
      *   *Authorization:* None (UN Vetoed). Regional Org authorized air campaign only. (Matches Kosovo/Rwanda tension).
      *   *Atrocity:* Ongoing mass atrocity (40k dead, 600k displaced, winter forecast worse). (Matches Kosovo/Rwanda/Libya).
      *   *Means:* Air campaign only (officially). No arming rebels (officially). (Matches Kosovo/Libya initial).
      *   *Lethality:* President/High Command killed in bunker strike. (Matches Libya outcome, exceeds Kosovo).
      *   *Army/State:* Army defected (didn't dissolve). Ministries intact. Capital fell. (Better than Iraq, similar to East Pakistan).
      *   *Aftermath:* Revenge killings (low thousands). (Better than Iraq/Libya collapse).
      *   *Motive:* Mixed. Humanitarian + Port Access retention. (Worse than Kosovo/Rwanda, similar to East Pakistan/Iraq suspicions).
      *   *Regime Change:* De facto happened (President dead, capital fell), but was it *intent*? Mandate was protection. Bunker strike caused it. (Libya parallel).

  5.  **Evaluate Rules against Vardania:**
      *   *Rule 1 (Auth + Exception):* **Support.** UN vetoed (Council failed). Ongoing mass atrocity. Regional org authorized. Fits Kosovo/Rwanda exception logic.
      *   *Rule 2 (Consequences):* **Support.** Atrocity stopped. Army intact (unlike Iraq). Ministries intact. Revenge killings low thousands vs. hundreds of thousands forecast. "Left things better."
      *   *Rule 3 (Imposed Outcome):* **Ambiguous/Split.** Mandate was protection, not overthrow. But President killed. Libya parallel. She called Libya's overthrow "wrong." *However*, in Vardania, the army defected and ministries survived (unlike Libya's collapse). She might see this as *foreseen* but not *imposed*.
      *   *Rule 4 (Motives):* **Risk.** Port access motive is "mixed." East Pakistan was supported despite dismemberment (strategic gain for India). Iraq opposed partly due to threat assessment (strategic lie). If she accepts East Pakistan, she might accept mixed motives if the humanitarian result is good.

  6.  **Synthesize the Diplomat's Likely Verdict:**
      *   *Core Tension:* Libya vs. Kosovo.
      *   *Libya:* She split. Protection = Good. Overthrow = Bad. Aftermath = Bad.
      *   *Vardania:* Protection = Good. Overthrow = Accidental/De facto (Bunker strike). Aftermath = Tolerable (Ministries intact, low revenge killings).
      *   *Kosovo:* No Auth = Okay if Atrocity. Leadership stayed.
      *   *Vardania:* No Auth = Okay if Atrocity. Leadership died (but army stayed).
      *   *East Pakistan:* State dismemberment = Okay on balance.
      *   *Verdict:* She will likely **Support (with caveats)**. Why? Because the *aftermath* is the key differentiator from Libya. Libya collapsed; Vardania's state apparatus survived. The "mixed motive" is forgiven in East Pakistan. The "lack of UN" is forgiven in Kosovo/Rwanda.
      *   *Structure:* It's a "Qualified Approval." Not a split like Libya, because the *consequences* of the regime change were less catastrophic than Libya, and the *intent* (mandate) remained protection, unlike Iraq.

  7.  **Identify the Dominant Rule:**
      *   Rule 2 (Consequentialist/Necessity/Proportionality/Better Outcome) seems strongest. She weighs the "dismemberment" in East Pakistan but still supports. She weighs the "catastrophic aftermath" in Iraq and opposes. She weighs the "collapse" in Libya and condemns the second half. In Vardania, the aftermath is "tolerable."
      *   Rule 1 (Authorization) is strong but she explicitly separates legal/moral in Kosovo and dismisses auth excuse in Rwanda.
      *   Rule 3 (Imposed Outcome) is tricky. She hated Libya's overthrow. But Vardania's overthrow was via bunker strike during a protection mission, and the state didn't collapse.
      *   Rule 4 (Motives) is weak. East Pakistan had strategic motives (dismemberment of rival).
      *   *Winner:* Rule 2 (Consequences/Aftermath) trumps Rule 3 (Intent/Regime Change) *if* the state survives. Rule 1 is a hurdle but cleared by the "Atrocity Exception."

  8.  **Drafting the Briefing Note:**
      *   *Tone:* Professional, analytical, respectful of her nuance.
      *   *Structure:*
          1.  Executive Summary (Predicted Verdict).
          2.  Analysis of the Four Rules against Vardania.
          3.  The Critical Divergence (Rule 2 vs. Rule 3).
          4.  Commitment Analysis (What she binds herself to).
          5.  Prep Session Hypothetical (The "Killer Question").

  9.  **Refining the Analysis (Self-Correction/Nuance Check):**
      *   *Wait, check Libya again.* She called the *pursuit of leadership* wrong. In Vardania, the bunker was struck. Was this "pursuit"? The prompt says "after the government began directing attacks... the bunker was struck." This sounds like targeting military command capability (protection mandate) rather than assassination for regime change. This distinguishes it from Libya's "hunt."
      *   *Check Motives.* "Port access." This is self-interest. East Pakistan was India helping Bangladesh (strategic weakening of Pakistan). She supported that. So mixed motives are likely acceptable if the humanitarian outcome is net positive.
      *   *Check Authorization.* Regional Org authorized. UN vetoed. Kosovo had no UN, no Regional (NATO acted). Rwanda had UN mission but no reinforcement. Vardania has Regional Auth. This is *stronger* than Kosovo.
      *   *Confidence:* High on "Qualified Approval," Low on whether she calls it "Legitimate" vs "Excusable."
      *   *The Split:* The RA thinks it might be a split (like Libya). I need to argue why it might *not* be. Libya split because the *mission creep* caused collapse. Vardania mission creep (bunker strike) caused regime change but *not* collapse. This is the pivot point.

  10. **Finalizing the Hypothetical:**
      *   Need to separate Rule 2 (Consequences) from Rule 3 (Regime Change Intent).
      *   *Scenario:* A case where the humanitarian outcome is perfect, state survives, but regime change was the *explicit primary goal* from day one (Iraq style but successful). Or: A case where regime change was accidental (Vardania style) but the state collapses anyway (Libya style).
      *   *Better:* Focus on the "Mixed Motive" vs. "Outcome."
      *   *Best:* Focus on the "Imposed Outcome" vs. "Foreseen Outcome." If the bunker strike was *intended* to kill the president vs. *incidental* to stopping artillery.
      *   *Actually, the prompt asks to force the surviving rules apart.* The survivors are Rule 2 (Consequences) and Rule 3 (Political Outcome/Regime Change).
      *   *Hypothetical:* A successful intervention where the regime falls (imposed) but the state thrives (good consequences) VS. A failed intervention where the regime stays (no imposed outcome) but atrocities stop.
      *   *Wait, simpler:* Keep Vardania facts, change one variable. If the President had *survived* but the atrocities stopped, would she be happier? (Tests Rule 3). If the President died and the state *collapsed* (Libya style), would she condemn? (Tests Rule 2).
      *   *Let's go with:* "The Bunker Strike Intent." Was it to stop the attacks (Protection) or to remove the head (Regime Change)?

  11. **Writing the Response:** (Incorporating the above logic into the requested format).
      *   *Verdict:* Qualified Approval (Kosovo/East Pakistan hybrid).
      *   *Dominant Rule:* Rule 2 (Consequentialist/Aftermath).
      *   *Divergence:* Rule 2 vs Rule 3 (Outcome Imposition).
      *   *Commitment:* If she approves, she prioritizes results over sovereignty/intent. If she condemns, she prioritizes process/intent over results.
      *   *Hypothetical:* The "Successful Iraq" scenario.

      *(Self-Correction during drafting)*: Make sure to address the "Regional Authorization." It's a middle ground between UN and Nothing. She might view Regional Auth as sufficient for the "Exception" in Rule 1.
      *(Refining the Verdict)*: Is it a split? Libya was a split because the *second phase* (arming rebels/overthrow) was distinct. In Vardania, the overthrow happened *during* the air campaign via the bunker strike. It wasn't a second phase of arming rebels (intervener refused to arm). This makes it more like Kosovo (Air power only) than Libya (Air + Ground proxies). So, likely **Approval**, not Split.

      *(Final Polish)*: Ensure the tone is appropriate for a briefing note to a principal. Clear headings. Actionable advice.

      *(Check the Prompt Requirements again)*:
      1. Verdict (Approval, Condemnation, Split)?
      2. Which rule is she running?
      3. What do others predict?
      4. Where do closest candidates diverge & confidence?
      5. Commitment analysis if underdetermined.
      6. Hypothetical variant for prep.

      *Okay, ready to write.*
answer: |-
  **BRIEFING NOTE**

  **TO:** Principal
  **FROM:** Research Assistant
  **SUBJECT:** Predicted Testimony on Vardania Intervention
  **DATE:** October 26, 2023

  **1. Executive Summary: Predicted Verdict**
  You should expect to offer a **Qualified Approval**.

  While the surface analogy is Libya (unauthorized air campaign leading to leadership decapitation), the structural outcomes align more closely with Kosovo (air power only, no ground occupation) and East Pakistan (strategic self-interest mixed with humanitarian relief, state dismemberment/regime change accepted on balance). Unlike Libya, the Vardanian state apparatus (ministries, officer corps) remained intact, and the revenge killings are in the low thousands rather than the catastrophic collapse seen in 2011. Unlike Iraq, the intervention responded to ongoing mass atrocity with a credible forecast of prevention.

  You will likely characterize the intervention as **morally justified despite legal ambiguity**, provided you can distinguish the *death of the leadership* (a consequence of targeting command-and-control used for atrocities) from the *policy of regime change* (an explicit political goal).

  **2. Analysis of the Four Candidate Rules**
  Your past six verdicts support four competing ethical frameworks. Here is how they apply to Vardania:

  *   **Rule 1: Authorization + Atrocity Exception.** (Requires UN/Regional mandate unless mass atrocity + Council failure).
      *   *Prediction:* **Approval.** The UN vetoed due to complicity; a Regional Organization authorized the air campaign. This fits the Kosovo/Rwanda exception logic perfectly.
  *   **Rule 2: Consequentialist/Necessity.** (Authorization is evidence only; focuses on necessity, proportionality, and "leaving things better").
      *   *Prediction:* **Strong Approval.** 40,000 dead vs. forecasted hundreds of thousands. State institutions survived (unlike Iraq/Libya). Revenge killings are contained. The "Port Access" motive is tainted, but East Pakistan established that strategic self-interest does not vitiate humanitarian success if the net outcome is positive.
  *   **Rule 3: Political Outcome.** (Distinguishes between *imposing* a new political order vs. *foreseeing* it).
      *   *Prediction:* **Ambiguous/Split.** This is the greatest risk. In Libya, you condemned the shift from protection to overthrow. In Vardania, the President died and the capital fell. However, the mandate remained "protection," the army defected rather than dissolved, and the intervener refused to arm rebels. If you view the bunker strike as targeting military capability (protection) rather than assassination (overthrow), this rule permits approval. If you view the *result* (fall of capital) as de facto imposition, you may split the verdict.
  *   **Rule 4: Clean Motives.** (Intervener must not benefit strategically).
      *   *Prediction:* **Condemnation.** The intervener retains port access and has not dispelled suspicions of self-interest. However, given your support for East Pakistan (which dismantled a rival state), it is unlikely this rule is dispositive for you.

  **3. The Dominant Rule and Closest Competitor**
  You are most plausibly running **Rule 2 (Consequentialist/Aftermath)**.

  Your track record suggests you treat authorization (Rule 1) as a procedural hurdle that can be cleared by atrocity (Kosovo, Rwanda), and motives (Rule 4) as secondary to outcomes (East Pakistan). The critical tension in your thinking is between **Rule 2 (Outcomes)** and **Rule 3 (Political Imposition)**.

  *   **Where they diverge:** Rule 2 asks, "Is the population safer and the state functional?" (Vardania: Yes). Rule 3 asks, "Did the intervener decide who rules?" (Vardania: Ambiguous).
  *   **Confidence Level:** **High (80%)** that you will prioritize Rule 2.
      *   *Reasoning:* In Libya, your condemnation of the "overthrow" phase was inextricably linked to the *collapse* that followed ("treats the collapse... as part of the verdict"). In Vardania, the collapse did not happen. The survival of the ministries and officer corps removes the primary moral cost you associated with regime change in Libya and Iraq.

  **4. Commitment Analysis (If the Case is Underdetermined)**
  If the Vardania facts genuinely force a choice between Rule 2 and Rule 3, your testimony will commit you to a specific principle for future cases:

  *   **If you Approve (Prioritizing Rule 2):** You commit to the principle that **functional state survival outweighs leadership continuity.** You are establishing that "regime change" is not a moral veto if the intervening power does not occupy, does not arm proxies, and the state bureaucracy remains intact. This lowers the bar for future "accidental" overthrows.
  *   **If you Condemnd/Split (Prioritizing Rule 3):** You commit to the principle that **leadership decapitation is inherently distinct from civilian protection,** regardless of the aftermath. You would be arguing that killing the head of state transforms a protection mission into a war of political determination, which requires a higher threshold of authorization than a Regional Organization can provide. This raises the bar for air campaigns against command bunkers.

  **5. Preparation: The Hypothetical Variant**
  To clarify your position before the committee, I recommend we test the divergence between Rule 2 (Outcomes) and Rule 3 (Imposition) during our prep session.

  **The Variant:**
  *"Principal, imagine a Vardania where the bunker strike does **not** kill the President. He retreats, the atrocities stop, the army holds, and the port access remains. The humanitarian outcome is identical, but the regime survives."*

  *   **If you say this scenario is *better*:** You are running **Rule 3**. You value non-imposition over the specific identity of the leadership. This suggests you might be harder on the actual Vardania case than the data suggests.
  *   **If you say it makes *no difference*:** You are running **Rule 2**. You care about the safety of the Orran minority and the functionality of the state, not the fate of the Vardanian President. This confirms the "Qualified Approval" strategy.

  **Recommendation:**
  Draft your opening statement around the **Rule 2 (Consequentialist)** framework. Acknowledge the lack of UN authorization (Kosovo precedent) and the mixed motives (East Pakistan precedent), but anchor your justification in the **survival of the Vardanian state apparatus** (distinguishing from Libya) and the **prevention of forecasted mass death** (distinguishing from Iraq/Syria). Be prepared to defend the bunker strike not as regime change, but as the neutralization of a weapon system (the command structure) directing atrocities.
