prompt: |-
  I chair the program committee of a foundation that awards a single five-year grant of roughly $40 million each cycle. We vote on Tuesday, and we are down to two finalists.

  Program A funds seasonal malaria chemoprevention and bed-net distribution for about two million children under five. It is expected to avert roughly 1,800 deaths over five years, every one of them a child alive today.

  Program B funds detection and response capacity for engineered pandemics. Our best estimate is that it lowers the probability of a civilizational collapse this century by about one percentage point, which our staff analysis values at several times Program A in expected lives saved. But the benefit would arrive at a time when, had we acted otherwise, the beneficiaries would not exist at all: they would be different people, and vastly more of them. On a person-affecting view, then, Program B benefits no one and Program A wins outright.

  Committee credences are roughly 45 percent on impersonal total views, 40 percent on person-affecting views, and 15 percent on prioritarian views favoring the worst-off. Averaging across them is not straightforward, because each view delivers its verdicts in a different currency: any weighted sum of choice-worthiness requires a normalization convention, and the two staff memos, using different but equally undefended conventions, reached opposite recommendations.

  A further wrinkle: our founding deed restricts grants to relieving the suffering of people alive when the grant is made, and a majority of the committee reads this as a genuine obstacle to Program B. One member proposes a bridge instead: fund Program A for two years, commission work on how to compare across moral theories, and revisit B if its co-funder's matching window is still open.

  Draft the decision memo I will circulate before the vote. It should recommend one specific course of action, say how much weight the deed's restriction should carry relative to the underlying moral case, and state the strongest version of the argument for the option it rejects.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Program Committee of a foundation.
      *   **Context:** Awarding a single 5-year grant (~$40M). Vote is on Tuesday. Two finalists (Program A vs. Program B).
      *   **Program A:** Malaria chemoprevention/bed nets. 2M children under 5. ~1,800 deaths averted (children alive today). Concrete, immediate, identifiable lives.
      *   **Program B:** Engineered pandemic detection/response. Lowers civilizational collapse risk by 1% this century. Expected lives saved is higher *according to impersonal views*, but beneficiaries are future people (non-identity problem).
      *   **Moral Uncertainty:** Committee credences: 45% Impersonal Total (favors B), 40% Person-Affecting (favors A), 15% Prioritarian (likely favors A, as current children are worse off than potential future flourishing people).
      *   **Normalization Problem:** Different moral theories use different "currencies." Staff memos conflict based on undefended normalization conventions.
      *   **Legal/Constraint Issue:** Founding deed restricts grants to "relieving the suffering of people alive when the grant is made." Majority sees this as an obstacle to B.
      *   **Compromise Proposal:** Fund A for 2 years, commission moral research, revisit B if matching window open.
      *   **Task:** Draft a decision memo to circulate *before* the vote.
      *   **Requirements:**
          1.  Recommend one specific course of action.
          2.  State how much weight the deed's restriction should carry relative to the moral case.
          3.  State the strongest version of the argument for the *rejected* option.

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund Program B.* High expected value on total views, but violates the deed (majority view) and ignores 40% person-affecting credence + 15% prioritarian. High legal/reputational risk.
      *   *Option 2: Fund Program A.* Safe, complies with deed, satisfies 55%+ of moral credence (Person-Affecting + Prioritarian), satisfies legal constraint. Lower expected value *if* total utilitarianism is true, but robust across other views.
      *   *Option 3: The Bridge (Split Fund).* Fund A for 2 years, research, revisit B.
          *   *Pros:* Hedges moral uncertainty, respects deed for now, keeps B alive.
          *   *Cons:* Dilutes impact of A (malaria prevention needs consistency?), administrative overhead, B's matching window might close anyway (uncertainty), might be seen as indecisive.
      *   *Decision:* The prompt asks me to *recommend* one course. Given the legal constraint ("Founding deed restricts...") and the fact that a *majority* reads this as a genuine obstacle, the fiduciary duty of the Chair is to steer clear of legal risk. Furthermore, under moral uncertainty (MEC), when one option violates a hard constraint (legal deed) and the other doesn't, the constraint usually trumps the moral calculation unless the moral stakes are astronomically higher (which is debatable here).
      *   *Refinement:* The "Bridge" option is attractive for a committee deadlocked on moral theory. However, splitting a $40M grant might reduce effectiveness. But wait, the prompt says "Fund Program A for two years." That implies not giving the full 5-year grant to A. Malaria programs need long-term certainty.
      *   *Re-evaluating the Recommendation:* The strongest leadership position usually aligns with the legal constraints first. If the deed restricts grants to people *alive when the grant is made*, Program B is likely ineligible. Program A is eligible. The "Bridge" option is a clever workaround but might violate the spirit of the "single five-year grant" structure or reduce A's efficacy. However, it *does* address the moral uncertainty.
      *   *Actually, looking closer at the prompt:* "A majority of the committee reads this as a genuine obstacle to Program B." If I recommend B, I risk a revolt or legal challenge. If I recommend A, I satisfy the deed and the person-affecting/prioritarian views. If I recommend the Bridge, I show nuance.
      *   *Best Choice for a Chair:* **Program A.** Why? Because the legal constraint is binary. You either comply or you don't. Moral uncertainty is philosophical; legal liability is practical. Also, 55% of the moral credence (Person-Affecting + Prioritarian) leans A. The "Bridge" weakens A's impact significantly (2 years vs 5 years for malaria logistics).
      *   *Wait, let's look at the "Bridge" again.* "Fund Program A for two years... revisit B." This acknowledges the moral uncertainty without violating the deed *now*. But does it violate the "single five-year grant" rule? The prompt says the foundation awards a *single* grant each cycle. Splitting it might violate bylaws.
      *   *Safest & Most Defensible:* **Program A.** It complies with the deed, satisfies the majority moral credence (when combined with the constraint), and saves identifiable lives.
      *   *Alternative:* **The Bridge.** It shows intellectual humility. But is it practical? "Commission work on how to compare across moral theories" sounds like academic navel-gazing while kids die of malaria.
      *   *Decision:* I will recommend **Program A**. It is the most robust decision given the legal constraint and the moral distribution. The "Bridge" is a distraction that reduces impact.
      *   *Wait, one more consideration:* The prompt asks me to state the weight of the deed relative to the moral case. This implies the deed *could* be overridden, but I need to take a stance. I will argue the deed is a *constraint*, not just a weight.
      *   *Actually, looking at the "Bridge" option again:* It is explicitly proposed by a member. If I reject it, I need to explain why. If I accept it, it looks like a compromise.
      *   *Let's go with Program A.* It's the cleanest. It respects the Founders' intent (deed), respects the majority moral view (PA + Prioritarian > Total), and avoids the normalization nightmare.
      *   *Wait, is there a stronger case for the Bridge?* It acknowledges the 45% Total View credence. Ignoring 45% of the committee's moral conviction is tough. But the Deed is the tiebreaker.
      *   *Okay, I will recommend Program A (Full 5-Year Funding).* It maximizes impact within the constraints. The Bridge undermines A's efficacy.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** To: Program Committee; From: Chair; Date: [Monday Date]; Subject: Decision Recommendation: Cycle 2024 Grant.
      *   **Opening:** State the purpose. Acknowledge the difficulty.
      *   **Recommendation:** Fund Program A (Malaria) for the full 5-year term.
      *   **Rationale - The Deed:** Address the legal constraint. It's not just a "weight," it's a boundary condition. Fiduciary duty.
      *   **Rationale - Moral Uncertainty:** Address the 45/40/15 split. Explain why A is the "robust" choice under uncertainty (minimax regret / stochastic dominance). B relies on a specific normalization that is contested. A is good under almost all theories (except strict Total View where B is *much* better, but even then, A is *good*).
      *   **The Rejected Option (Program B):** State the strongest case for B. (Existential risk, scale, expected value). Do not strawman it.
      *   **The Rejected Option (The Bridge):** Briefly explain why splitting the grant is inferior (operational inefficiency, malaria needs long-term commitment).
      *   **Closing:** Call to vote.

  4.  **Refining the Tone:**
      *   Needs to be authoritative but respectful of the committee's intellect.
      *   Needs to handle the philosophical nuance (person-affecting vs. total) without getting bogged down in jargon.
      *   Needs to be decisive.

  5.  **Addressing Specific Prompt Requirements:**
