      *   *Critique:* The Bridge option is interesting. If I reject it, I must explain why. Malaria programs need 5-year horizons for supply chains. Splitting funding jeopardizes the 1,800 lives.
      *   *Critique:* Moral Uncertainty. I need to mention that since normalization is unresolved, we cannot confidently say B > A even on the Total View without arbitrary assumptions. This strengthens the case for A.

  7.  **Final Plan:**
