answer: |-
  **MEMORANDUM**

  **TO:** Program Committee
  **FROM:** Chair, Program Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Cycle 2024 Grant Award

  **1. Recommendation**

  After reviewing the staff impact analyses, legal counsel's interpretation of our founding deed, and the testimony from our finalists, I recommend that the Committee award the full five-year, $40 million grant to **Program A (Seasonal Malaria Chemoprevention and Bed-Net Distribution).**

  This recommendation prioritizes the preservation of identifiable lives within the legal boundaries of our mandate, while acknowledging the significant moral uncertainty inherent in comparing immediate relief against existential risk reduction.

  **2. The Founding Deed as a Constraint**

  Our founding deed restricts grants to "relieving the suffering of people alive when the grant is made." A majority of this Committee reads this as a genuine obstacle to Program B. In this decision, I argue that the deed must function not merely as a moral weight to be balanced against expected utility, but as a **binding eligibility constraint.**

  As fiduciaries, we are obligated to operate within the legal instrument that established this foundation. While one might argue that preventing civilizational collapse ultimately relieves the suffering of those alive today by securing their future, Program B's primary value proposition rests on the existence of future people who would otherwise not exist. This stretches the deed's language beyond a defensible legal interpretation. To proceed with Program B would invite litigation and reputational damage that could jeopardize the foundation's ability to operate in future cycles. Therefore, the deed acts as a veto on Program B, regardless of the moral calculus.

  **3. Moral Uncertainty and Normalization**

  Even absent the legal constraint, the moral uncertainty facing this Committee counsels in favor of Program A. Our credences are split: 45% Impersonal Total, 40% Person-Affecting, and 15% Prioritarian.

  *   **Person-Affecting (40%) & Prioritarian (15%):** Both views strongly favor Program A. The Person-Affecting view holds that Program B benefits no specific individual (due to the non-identity problem), while Program A saves 1,800 specific children. The Prioritarian view favors Program A because the beneficiaries are currently suffering and worse off than the potential beneficiaries of Program B.
  *   **Impersonal Total (45%):** This view favors Program B based on expected value. However, as the staff memos demonstrate, this conclusion relies on a normalization convention that compares "lives saved" across different metaphysical frameworks. There is no consensus on how to normalize the "choice-worthiness" units between these theories.

  In the face of unresolved normalization and a near-even split in moral credence, Program A represents a **robust choice.** It yields high positive value under 55% of our moral credences and complies with 100% of our legal constraints. Program B yields high value under only 45% of our moral credences and violates our legal constraints. Under conditions of deep uncertainty, the option that avoids catastrophic downside (legal liability) and satisfies the majority of moral frameworks is the prudent choice.

  **4. The Strongest Case for the Rejected Option (Program B)**

  In rejecting Program B, we must acknowledge the strength of the argument in its favor. The case for Program B rests on the sheer scale of the stakes. If the Impersonal Total view is correct, the expected value of reducing civilizational collapse risk by one percentage point dwarfs the saving of 1,800 lives. We are potentially trading a certainty of 1,800 deaths for a probabilistic safeguard of billions of future lives.

  Proponents argue that the deed should be interpreted dynamically: the "suffering of people alive" includes the anxiety of existential threat and the loss of future potential. Furthermore, they argue that in a world of limited capital, $40 million is rarely spent as effectively as on existential risk reduction. To ignore a one-percentage-point reduction in collapse risk because of a semantic restriction in a founding document written decades ago could be viewed as a failure of moral courage—prioritizing institutional compliance over the survival of humanity. This is the heaviest burden of this decision: that we may be choosing legal safety over the maximization of expected good.

  **5. Regarding the "Bridge" Proposal**

  One member proposed funding Program A for two years while commissioning research on moral normalization, revisiting Program B if matching funds remain available. I cannot recommend this course.

  First, malaria chemoprevention requires long-term supply chain certainty to be effective. A two-year horizon undermines the operational viability of Program A, potentially reducing the number of lives saved below the projected 1,800. Second, the "matching window" for Program B is uncertain; banking on a future decision creates administrative instability. Finally, commissioning further research on moral theory does not resolve the legal constraint of the deed. If the deed prohibits Program B today, further philosophical work will not make it permissible tomorrow without amending the deed itself.

  **6. Conclusion**

  We are tasked with doing the most good possible within the mission we were entrusted to uphold. Program A allows us to save 1,800 children with certainty, fully compliant with our deed and robust across the majority of our moral frameworks. Program B, while potentially higher in expected value under one specific moral theory, carries unacceptable legal risk and relies on contested metaphysical assumptions.

  I ask the Committee to vote in favor of Program A.
