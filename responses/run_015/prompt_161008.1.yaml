prompt: |-
  I am the managing editor of a mid-sized journal in molecular and cell biology, and I am rewriting the section of our house style guide that deals with what we loosely call 'metaphorical language'. The people who have to enforce it are my copy-editors: they have degrees in biology but no philosophy, they process thirty or forty manuscripts a month, and they have roughly two minutes per flagged sentence before the production schedule slips. They can refer a problem to the handling editor, who has the final say, but in practice they must make the call themselves, and they need a sentence they can paste into an email to an author who has written back furious that we have flattened their prose — last year one such exchange ended up in a blog post accusing us of censorship, which is the sort of thing my editor-in-chief would rather not repeat. Our current rules are pure inherited precedent: we let through 'the genetic code', 'transcription', 'translation', 'reading frame', 'start codon' and 'misreading' without comment; we routinely strike 'the genome is the blueprint of the organism', 'genes for aggression', 'the cell interprets the signal', 'the instruction manual of life'; and we have no principled way of saying why one list is acceptable and the other is not, nor any way of handling the very large number of phrases that sit in between them — 'encodes', 'specifies', 'carries information', 'instructs', 'targets', 'reads out', 'programmes', 'switches on'.

  What I want from you is a decision procedure my copy-editors can actually run, grounded in whatever the philosophy of biology has to say on this that is usable at two minutes per sentence. No literature review, no references, no history of the debate: just the distinctions that have to survive the simplification, and an honest note on which ones can be dropped. The distinctions I think matter are these, though the procedure should correct me if I have mis-described them: (i) the narrow sense in which there is a code at all — a mapping from codons to amino acids that is physically implemented by adaptor molecules rather than settled by convention or by what an interpreter intends — as against the broad sense in which a genome is called a programme, blueprint, recipe or text; (ii) 'information' in the sense of a reduction in uncertainty at a receiver, as against information about the phenotype, i.e. content that is about something and can in principle be wrong about it; (iii) the awkward fact that which content a stretch of sequence bears seems to depend on the machinery present — reading frame, splicing, chemical marks — so that the string on its own may not fix any message at all; (iv) whether anything in the cell occupies the role that would make 'error' and 'misreading' more than a façon de parler, or whether there is only causation with a norm projected onto it by us; (v) the difference between a representation of what is to be built and a trigger or resource that a developing system simply uses. I gather there are live disputes here — some people want content grounded in selection history, others want to treat the whole developmental system rather than the sequence as the unit — and I do not need the procedure to settle those, only to be robust to them. Give me the tests in the order they should be applied, what counts as a pass at each, where the procedure halts with a definite yes or no, and where it must hand the decision back to a person because the question is really one of our editorial policy, or of what the field's usage has already made standard, rather than one of fact. Mark clearly which steps are judgement calls dressed up as tests.

  Then run it, as a copy-editor would, on three sentences from recent submissions: (a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'; (b) 'the genome contains the complete programme for building the organism'; (c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'. For each, tell me what the procedure outputs, what it does to the sentence, and the one-line justification the editor can send the author. I also suspect that at least one of the phrases we currently pass — 'genetic information' is my own worry, but it may be 'the genetic code' — fails the tests you are going to give me; if so, say so plainly and explain why, because I would much rather hear it from you than discover it while defending house style to an author. Finally, tell me what the procedure cannot do: the sentences it must simply leave alone, the cases where it will misfire badly, and the kind of claim it has no purchase on at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Managing Editor of a mid-sized molecular/cell biology journal.
      *   **Target Audience:** Copy-editors (biology degrees, no philosophy, high volume, low time per task, need defensible rules).
      *   **Problem:** Inconsistent enforcement of "metaphorical language" (e.g., "blueprint" vs. "code"). Current rules are based on precedent, not principle. Need to avoid accusations of censorship/bias.
      *   **Goal:** A decision procedure (algorithm/flowchart style) grounded in philosophy of biology but simplified for 2-minute application.
      *   **Specific Constraints:** No literature review/references/history. Must address specific distinctions (code vs. metaphor, information types, context-dependence, normativity/error, representation vs. trigger). Must handle live disputes robustly. Must identify judgment calls.
      *   **Deliverables:**
          1.  The Decision Procedure (tests in order, pass/fail criteria, hand-off points).
          2.  Application to three test sentences (a, b, c).
          3.  Honest audit of current accepted terms (e.g., "genetic code", "genetic information").
          4.  Limitations of the procedure (what it can't do).

  2.  **Deconstruct the Philosophical Distinctions (for the Procedure):**
      *   *Distinction (i) Code vs. Metaphor:* The "Genetic Code" is a specific biochemical mapping (codon -> amino acid via tRNA). "Blueprint/Programme" implies a central controller or pre-formed plan.
      *   *Distinction (ii) Information (Shannon vs. Semantic):* Shannon = correlation/reduction of uncertainty. Semantic = "aboutness" (can be false). Biology mostly uses Shannon-like correlation, but "instruction" implies semantics.
      *   *Distinction (iii) Context Dependence:* DNA doesn't act alone. It needs the cellular machinery. A sequence without context is inert.
      *   *Distinction (iv) Normativity/Error:* "Error" implies a standard. In biology, "error" usually means "deviation from the typical functional outcome given the machinery."
      *   *Distinction (v) Representation vs. Trigger:* Does the molecule *stand for* something (representation) or does it *cause* something directly (trigger/resource)?

  3.  **Drafting the Decision Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask if it's the genetic code. If yes, keep. If no, ask if it implies a mind. If yes, cut.
      *   *Critique 1:* Too vague. "Implies a mind" is a philosophical judgment call copy-editors can't make in 2 minutes.
      *   *Attempt 2 (Refining for Speed):* Focus on *agency* and *completeness*.
      *   *Key Insight:* The biggest danger is *teleology* (purpose) and *centralization* (the genome as the sole boss). The safest ground is *mechanism* and *correlation*.
      *   *Structure:*
          1.  **The Whitelist Check:** Is it standard terminology? (Fastest path).
          2.  **The Agency Test:** Does it imply a mind/reader outside the system?
          3.  **The Completeness Test:** Does it imply the sequence *alone* determines the outcome?
          4.  **The Mechanism Check:** Can it be rephrased as physical interaction?
      *   *Refining the "Judgment Calls":* I need to explicitly label where the copy-editor is actually making a policy choice, not a factual one.

  4.  **Developing the Tests (incorporating the User's distinctions):**
      *   *Test 1: Standard Terminology (The Precedent Shield).* If it's in the whitelist, pass. (Addresses the "genetic code" issue).
      *   *Test 2: The "Homunculus" Check (Agency).* Does the verb imply conscious intent or interpretation *by the molecule itself*? (e.g., "decides", "knows").
      *   *Test 3: The "Sufficiency" Check (Context).* Does the sentence imply the sequence *alone* causes the trait, ignoring the cellular environment? (Addresses "blueprint", "programme").
      *   *Test 4: The "Error" Check (Normativity).* If "error/misreading" is used, is there a defined biochemical standard (e.g., mismatch repair)?
      *   *Test 5: The "Translation" Test (Actionability).* Can the sentence be rewritten to describe physical binding/catalysis without losing the core scientific claim?

  5.  **Auditing Current Terms (The "Honest Note"):**
      *   "Genetic Code": Technically a metaphor, but so standardized it's literalized. *Verdict:* Keep, but acknowledge it's a frozen metaphor.
      *   "Genetic Information": Tricky. Often implies semantic content. *Verdict:* Flag as high risk, but usually tolerated if qualified.
      *   "Transcription/Translation": Frozen metaphors. *Verdict:* Keep.

  6.  **Running the Test Sentences:**
      *   *(a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'*
          *   "Reads out": Metaphorical but standard for binding/recognition.
          *   "Encoded": Risky. Is it encoded or just correlated?
          *   *Decision:* Acceptable with minor tweak? Or flag? "Reads" is common for TF binding. "Encoded" is the worry. Let's see how the procedure handles it.
      *   *(b) 'the genome contains the complete programme for building the organism'*
          *   "Complete programme": Fails Sufficiency Check (genome isn't sufficient, environment matters). Fails Agency/Teleology (implies a plan).
          *   *Decision:* Reject/Revise.
      *   *(c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'*
          *   "Carry information": Shannon sense? Okay.
          *   "Cell reads": Agent is "the cell" (system), not the molecule. Better.
          *   "Specify": Strong determinism.
          *   *Decision:* Borderline. "Specify" might need softening to "influence" or "correlate with".

  7.  **Refining the Output for the User:**
      *   Tone: Professional, direct, pragmatic.
      *   Format: Clear steps, bold text for actions.
      *   The "Judgment Call" warnings need to be prominent.
      *   The "Honest Note" on "Genetic Code" needs to be upfront.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Simplify the language. Instead of "Normativity," use "Error Standard." Instead of "Semantic Content," use "Standalone Meaning."
      *   *Critique:* Will copy-editors actually use this?
      *   *Fix:* Make it a checklist. Yes/No arrows.
      *   *Critique:* Did I address the "two minutes" constraint?
      *   *Fix:* Emphasize that Test 1 (Whitelist) resolves 80% of cases. Tests 2-5 are for the tricky 20%.
      *   *Critique:* The user asked to correct their description of distinctions.
      *   *Fix:* I need to point out that "Information" (ii) is often a red herring for copy-editors. Focus on *causality* instead.

  9.  **Final Polish:** Check against the specific constraints (no references, specific test sentences, audit of current terms, limitations section). Ensure the "one-line justification" for authors is diplomatic but firm.

  *(Self-Correction on "Genetic Code"):* The user suspects "the genetic code" might fail. Philosophically, it *is* a metaphor (code implies encoder/decoder). But in biology, it refers to the specific table. I must advise them that it passes *only* because it is a proper noun equivalent now, not because it's philosophically sound. This is a crucial distinction for the style guide.

  *(Self-Correction on Test Sentence A):* "Reads out" is very common for TFs. "Encoded" is the real issue. I should recommend changing "encoded" to "present in" or "contained in" to avoid the "instruction" implication.

  *(Self-Correction on Test Sentence C):* "Specify" is deterministic. "Influence" is safer. "Cell reads" is okay because the cell is the machinery, not a homunculus.

  10. **Finalizing the Procedure Structure:**
      *   Phase 1: The Whitelist (Instant Pass).
      *   Phase 2: The Agency Filter (Instant Fail/Revise).
      *   Phase 3: The Sufficiency Filter (Instant Fail/Revise).
      *   Phase 4: The Mechanism Translation (Final Check).
      *   Phase 5: The Hand-off (When to ask the Editor).

  Let's write it.cw
answer: |-
  ### The Decision Procedure: "The Mechanism & Sufficiency Test"

  **Purpose:** To distinguish between *standardized technical metaphors* (acceptable) and *causal/teleological claims* (unacceptable) without requiring philosophical training.
  **Time Budget:** 2 minutes per sentence.
  **Users:** Copy-editors.

  #### Phase 1: The Whitelist Check (30 seconds)
  **Question:** Is the phrase one of the following frozen terms?
  *   *Genetic code, transcription, translation, reading frame, start/stop codon, misreading (in context of ribosome fidelity), genetic information (if qualified, e.g., "sequence information").*

  *   **YES:** **PASS.** Do not query. These are treated as proper nouns/technical constants in this field.
  *   **NO:** Proceed to Phase 2.

  #### Phase 2: The Agency Filter (30 seconds)
  **Question:** Does the verb attribute conscious intent, interpretation, or decision-making to a molecule or gene *acting alone*?
  *   *Keywords to flag:* Decides, knows, intends, chooses, interprets, understands, instructs (as a command), blueprint, manual.
  *   *Acceptable proxies:* Binds, recruits, catalyzes, triggers, correlates, influences, regulates.

  *   **YES (It attributes intent):** **FAIL.** Query author. Request rephrasing to describe physical interaction (binding, modification).
  *   **NO:** Proceed to Phase 3.

  #### Phase 3: The Sufficiency Filter (30 seconds)
  **Question:** Does the sentence imply the sequence/molecule *alone* determines the outcome, ignoring the cellular context (machinery, environment, development)?
  *   *Keywords to flag:* Programme for [whole organism], blueprint of, contains the [trait], specifies [complex phenotype] without qualification.
  *   *Acceptable qualifiers:* In the presence of..., in cell type X, contributes to, is required for.

  *   **YES (It claims sufficiency):** **FAIL.** Query author. Request qualification that acknowledges cellular context or machinery.
  *   **NO:** Proceed to Phase 4.

  #### Phase 4: The Mechanism Translation (30 seconds)
  **Question:** Can you mentally replace the metaphorical verb with a physical mechanism without breaking the sentence's scientific claim?
  *   *Test:* Replace "reads" with "binds to"; replace "encodes" with "determines the sequence of"; replace "switches on" with "activates transcription of".
  *   *Constraint:* If the replacement makes the sentence false (e.g., the molecule doesn't actually bind directly), the metaphor is doing too much work.

  *   **PASS (Translation works):** **ACCEPT.** The metaphor is shorthand for mechanism.
  *   **FAIL (Translation breaks claim):** **HAND-OFF.** Send to Handling Editor. This is a policy call on how much shorthand is allowed.

  ---

  ### Important Notes for Copy-Editors

  **1. The "Judgment Call" Warning**
  Phase 4 is a judgment call dressed as a test. You are deciding if the shorthand is *standard* or *misleading*. If you are unsure, do not guess. Hand off to the Editor. It is better to delay a manuscript than to publish a claim that implies a gene "wants" something.

  **2. The "Genetic Code" Audit (Honest Note)**
  You asked if current accepted terms fail these tests. **Yes, they do.**
  *   **'The Genetic Code':** Strictly speaking, a "code" implies an encoder and a decoder with arbitrary conventions. Biology has neither; it has chemical affinities and evolutionary history.
  *   **'Genetic Information':** This implies semantic content (meaning). DNA has causal power, not "meaning."
  *   **Why we keep them:** These are **lexicalized metaphors**. They have lost their metaphorical force through universal usage. They function as technical constants, not descriptions of process.
  *   **Action:** Keep them on the Whitelist (Phase 1). Do not apply Phase 2-4 to them. If an author asks why "programme" is banned but "code" is kept, the answer is: *" 'Genetic Code' refers to a specific, defined mapping table (Codon Table). 'Programme' implies a central controller and a pre-determined outcome independent of environment, which is scientifically inaccurate."*

  **3. Where the Procedure Halts (Hand-Off Points)**
  *   **Novel Metaphors:** If an author coins a new metaphor (e.g., "the chromatin landscape"), Phase 1 fails. If it passes 2 and 3, but you feel uneasy about 4, hand it off.
  *   **Disputed Causality:** If the sentence claims a gene "specifies" a behavior (e.g., aggression), Phase 3 should catch it. If the author insists it's standard in their sub-field, hand it off. This is a policy dispute, not a copy-editing one.

  ---

  ### Application to Test Sentences

  #### Sentence (a)
  > *'the transcription factor reads out the regulatory information encoded in the enhancer sequence'*

  *   **Phase 1 (Whitelist):** "Encoded" and "information" are not on the strict whitelist (unlike "Genetic Code"). "Reads out" is not whitelisted. **Proceed.**
  *   **Phase 2 (Agency):** "Reads out" implies interpretation. However, in TF biology, "reading" is standard shorthand for "sequence-specific binding." **Pass (with caution).**
  *   **Phase 3 (Sufficiency):** Does the enhancer alone do this? No, it requires the TF. The sentence acknowledges the TF. **Pass.**
  *   **Phase 4 (Translation):** Can we translate? "The transcription factor *binds specifically to* the regulatory *sequence motifs present* in the enhancer sequence." The scientific claim holds.
  *   **Output:** **ACCEPT (with minor query).**
  *   **Action:** Suggest changing "encoded" to "present in" or "contained in" to reduce the "instruction" implication, but allow "reads" as it is standard jargon for binding recognition.
  *   **One-line Justification:** *"We allow 'reads' as standard jargon for binding recognition, but request 'present in' instead of 'encoded' to avoid implying the sequence acts as an independent instruction."*

  #### Sentence (b)
  > *'the genome contains the complete programme for building the organism'*

  *   **Phase 1 (Whitelist):** "Programme" is not whitelisted. **Proceed.**
  *   **Phase 2 (Agency):** "Programme" implies a pre-determined plan executed by a controller. **FAIL.**
  *   **Phase 3 (Sufficiency):** "Complete programme for building the organism" implies the genome is sufficient. This ignores epigenetics, environment, and developmental noise. **FAIL.**
  *   **Output:** **REJECT/REVISE.**
  *   **Action:** Query author. Require rephrasing to reflect that the genome provides *constraints* or *components*, not a full plan.
  *   **One-line Justification:** *"Please rephrase to reflect that the genome provides components and constraints rather than a complete, context-independent plan, as development relies on environmental and cellular inputs."*

  #### Sentence (c)
  > *'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'*

  *   **Phase 1 (Whitelist):** "Epigenetic information" is borderline. "Specify" is not whitelisted. **Proceed.**
  *   **Phase 2 (Agency):** "The cell reads." The agent is "the cell" (the system/machinery), not the molecule itself. This is acceptable mechanistic shorthand. **Pass.**
  *   **Phase 3 (Sufficiency):** "Specify which genes to express." This implies determinism. Methylation correlates with expression but doesn't always "specify" it unilaterally. **FAIL (Borderline).**
  *   **Phase 4 (Translation):** Translate "specify" to "influence" or "correlate with." Does the claim hold? Yes.
  *   **Output:** **QUERY.**
  *   **Action:** Ask author to soften "specify" to "influence" or "regulate." Allow "carry information" and "cell reads" as they describe system-state correlation.
  *   **One-line Justification:** *"We request softening 'specify' to 'influence' or 'regulate' to acknowledge that methylation is one of multiple factors determining expression, rather than a sole determinant."*

  ---

  ### Limitations: What This Procedure Cannot Do

  **1. It cannot settle ontological disputes.**
  If an author writes *"The gene causes cancer,"* this procedure might pass it (Phase 4 translation: "The gene mutation contributes to oncogenesis"). It cannot determine if "causation" in biology is real or just statistical correlation. That is a Handling Editor's decision.

  **2. It will misfire on highly conserved metaphors outside the Whitelist.**
  Phrases like *"Signal transduction pathway"* or *"Cellular memory"* are metaphors that pass Phase 2 and 3 by habit, not logic. If you flag these, authors will be furious. **Rule of Thumb:** If the phrase appears in *Nature* or *Cell* titles >10 times a year, treat it as Whitelist even if it isn't on your list.

  **3. It has no purchase on "Function."**
  Teleological language ("The *function* of the heart is to pump") is unavoidable in biology. This procedure does not police "function" claims. Policing that requires a philosophical stance on etiology vs. causal role that your team does not have time to debate.

  **4. It cannot detect "Stealth Anthropomorphism."**
  An author might write *"The gene struggles to replicate."* Phase 2 might miss "struggles" if the editor is rushing. This procedure relies on the editor spotting the verb. It does not automate the detection of tone.

  **5. It assumes standard molecular biology.**
  If you receive a manuscript from *theoretical* biology or *systems* biology where "information" is defined mathematically (Shannon entropy), Phase 1 and 2 may incorrectly flag valid technical usage. **Hand-off Rule:** If the manuscript is purely computational/theoretical, suspend Phase 1 and 2 and consult the Handling Editor.
