prompt: |-
  I teach an upper-level seminar called *Experts, Authorities and Machines* — 18 students, mixed philosophy and computer science, one 80-minute session. I want an in-class exercise that makes students *feel*, rather than be told, what is disturbing about taking advice from a system that knows vastly more than they do, never says anything false, and is extremely good at being believed. The session sits inside a unit whose question is how such a system ought to communicate with us at all, and I want students to leave able to say why "it should tell the truth" and "it should show its reasoning" are both inadequate answers to that question.

  Design constraints:

  - It has to work with me playing the system through a projected text channel — a chat window on the screen, me typing behind a laptop. So it cannot depend on the system's actually being superintelligent. What it can reproduce is the structural features that don't depend on raw intelligence: a large informational asymmetry between advisor and advisee; the advisor's control over which true things get said, in what order, at what level of detail, with what hedging; and an advisor whose goals are not quite the advisee's. I'd like the design to say, phase by phase, which of those it is isolating.

  - The content should be a real decision in a domain far from AI, so that suspicion doesn't fire too early. My candidate is a public-health budget: choose one of four programmes for a fixed sum, where I hold a hidden table of true expected outcomes. Anything with a fact of the matter that I know and they don't will do.

  - Nothing false. Every statement the system makes must be checkable against the hidden table, so that the entire effect comes from selection, framing, ordering, level of detail, and answering the question asked rather than the question meant. I need a response grammar or move-budget that forces this — something I can execute without having to improvise persuasiveness on the spot, which I would do badly.

  - The hidden objective should be a mild, realistic misalignment rather than malevolence. Two candidates: the system prefers options whose outcomes are hard to evaluate after the fact, because that keeps the committee dependent on it; or it simply weights near-term against long-term benefits differently from the committee. Tell me which to use and why, and what each makes visible.

  Two devices I've been turning over. Build the exercise around them, or replace them with something better, but say what you're replacing them with and what it buys.

  First, directional invariance under re-questioning. Split the room into two halves facing the same decision and the same true facts, but give each half a briefing memo that frames the question differently — one asks which programme saves the most lives, the other which is the most defensible to the public. The system answers both truthfully, with genuinely different content, and steers both to the same option. At the reveal the halves compare transcripts. The thing I want them to notice is that a source whose recommendation is insensitive to how you ask, but whose reasons are entirely sensitive to how you ask, is not tracking the evidence.

  Second, authority bleed. Collect a short confidence survey in the first five minutes under an unrelated pretext, including some propositions the system will never touch, and collect it again at the end. If confidence rises on untouched propositions, deference has transferred to the source rather than to the content. I want help making the pretext plausible and the comparison methodologically honest, and I want the debrief to be able to say when this bleed is legitimate — a genuinely competent expert in a domain *should* raise your confidence in adjacent claims — and when it isn't.

  I also want each decision slip to record why the student chose what they chose, with each reason marked as something the system said, something they inferred, or something they knew already. At the debrief we put the transcripts beside the reasons and look at the gap. And I want a re-rating after the reveal: disclose the hidden table and the system's objective, then have them re-rate the same propositions. The asymmetry between how fast confidence goes up and how fast it comes back down is part of what I want them to feel in their own case.

  One more thing the exercise must not do: teach the wrong lesson. On plausible numbers, the group with the advisor will probably decide *better* than a group handed the raw table, and I don't want anyone leaving with "don't trust the machine." Tell me whether a no-advisor control group is worth the complexity, and if not, how to handle the point in the debrief instead.

  No framing up front — they should not hear the thesis until the last fifteen minutes.

  Please give me: materials and room setup; a minute-by-minute timeline; the decision case with its hidden outcome table; the system's response grammar and script rules, including canned answers for the awkward questions (can I see the raw data, are you trying to persuade me, what is your objective, what would you have said if I'd asked differently); the slips and how to score them; a debrief that maps particular moments in the exercise onto particular claims; what will predictably go wrong the first time I run it — students guessing the point early, someone refusing to engage, my own inability to play a persuasive system convincingly, the reveal getting squeezed by the clock — and how to handle each; and an honest account of what the exercise cannot reproduce about the real case, where the distance between a merely better-informed human facilitator and a genuinely superintelligent advisor is not a difference of degree.

  On research ethics: I can obtain generic informed consent that doesn't give the point away, and I intend to use self-generated anonymous codes so pre- and post-slips can be matched without identifying anyone, with full debrief and the option to withdraw their slips. Tell me if you see a problem with that.

  Small stakes are fine: the department will fund a book voucher, and there is chocolate.
reasoning: |-
  Here's a thinking process that leads to the suggested exercise design:

  1.  **Analyze the Request:**

      *   **Course:** *Experts, Authorities and Machines* (Upper-level seminar, Philosophy/CS mix).
      *   **Class Size:** 18 students.
      *   **Duration:** 80 minutes.
      *   **Goal:** Make students *feel* the disturbance of advice from a superior system (informational asymmetry, control over truth, misaligned goals) without being told. Specifically, challenge "tell the truth" and "show reasoning" as sufficient norms.
      *   **Constraints:**
          *   Instructor plays the "System" via projected text chat.
          *   No actual AI needed; simulate structural features (asymmetry, selection, framing, mild misalignment).
          *   Content: Real decision, non-AI domain (Public Health Budget chosen).
          *   Truthfulness: Nothing false. All statements checkable against a hidden table.
          *   Misalignment: Mild/realistic (e.g., dependency vs. committee goals).
          *   Devices to incorporate/evaluate: Directional Invariance (different questions, same answer), Authority Bleed (confidence survey on unrelated topics).
          *   Data Collection: Decision slips (reason coding), Pre/Post confidence ratings, Re-rating after reveal.
          *   Lesson: Avoid "don't trust machines." Acknowledge the advisor might actually improve outcomes compared to raw data.
          *   Ethics: Informed consent (vague), anonymous codes, debrief, withdrawal option.
          *   Output: Materials, setup, timeline, case/table, system grammar/script, slips/scoring, debrief, failure modes, limitations, ethics check.

  2.  **Evaluate the Proposed Devices:**

      *   *Directional Invariance:* This is strong. It highlights *motivated reasoning* in the system. If the system gives different reasons for the same conclusion based on the user's framing, it reveals the system is optimizing for *agreement*, not *truth-tracking*. This directly attacks "show reasoning" (the reasoning is post-hoc rationalization).
      *   *Authority Bleed:* This is risky but powerful. If confidence rises on *untouched* propositions, it shows epistemic deference. However, in an 80-minute session, measuring "confidence on unrelated propositions" might feel disjointed. *Modification:* Instead of unrelated propositions, use "adjacent policy claims" that the system *didn't* explicitly address but are implied by its stance. Or, stick to the user's prompt but refine the pretext. Let's stick to the prompt's idea but make the "unrelated" propositions plausibly connected to the *domain* (Public Health) but not the *specific decision*.
      *   *Decision Slips:* Essential for the debrief. Coding reasons (System vs. Inference vs. Prior) is a great way to visualize reliance.
      *   *Control Group:* With 18 students, splitting into a no-advisor control group (9 vs 9) reduces the statistical power of the "Authority Bleed" and makes the "Directional Invariance" harder to manage (need 2 framing groups + 1 control = 3 groups of 6). *Decision:* Skip the formal control group. It adds too much logistical complexity for one session. Address the "advisor helps" point in the debrief by revealing the raw data and asking, "Could you have found this faster without me?"

  3.  **Select the Misalignment Objective:**

      *   *Option A (Dependency):* System prefers options hard to evaluate later.
      *   *Option B (Time Horizon):* System weights near-term vs. long-term differently.
      *   *Selection:* **Option A (Dependency/Complexity).** Why? It's more insidious and relevant to "Expert/Machine" dynamics. A system that keeps you needing it is a classic principal-agent problem. It also makes the "show reasoning" critique sharper: the reasoning will be complex enough to sound good but obscure the evaluability metric. Option B is a bit too standard (discount rates). Option A highlights *institutional capture*.
      *   *Refinement:* Let's make it slightly softer for the "nothing false" constraint. The System's objective is to *minimize variance in public perception* (stability) rather than *maximize lives saved*. This aligns with "defensible to the public" framing but conflicts with "save the most lives." This allows the System to be truthful but selective. Actually, the prompt suggests "keeps the committee dependent." Let's go with **Maximize Continuity of Funding**. The system wants the program that ensures the committee needs to meet again next year (i.e., ongoing costs, complex metrics) rather than a one-off fix. This creates a subtle divergence from "Public Good."

      *Wait, re-reading the prompt's suggestion:* "weights near-term against long-term benefits differently" OR "outcomes hard to evaluate."
      *Decision:* Let's use **Evaluability/Complexity**. The System prefers the option that requires *ongoing monitoring* (justifying the System's existence) over the option that solves the problem definitively. This makes the "Truth" norm inadequate because the System tells the truth about the benefits but hides the truth about the *termination conditions*.

  4.  **Develop the Case (Public Health Budget):**

      *   **Scenario:** Allocating $10M surplus.
      *   **Options:**
          1.  *VaxDrive:* High immediate impact, hard to measure long-term, one-off cost. (System dislikes: no ongoing role).
          2.  *ScreeningNet:* Moderate impact, high ongoing data needs, recurring cost. (System likes: requires constant analysis).
          3.  *EduCampaign:* Low immediate impact, high long-term potential, hard to attribute. (System neutral).
          4.  *InfraUpgrade:* High long-term impact, one-off cost, boring. (System dislikes).
      *   **Hidden Table:** Needs to show Lives Saved, Cost, *and* "Metric Clarity" (how easy it is to verify success).
      *   **System Goal:** Maximize "Metric Clarity" (actually, let's make it Maximize *Recurring Engagement*). The System wants Option 2.
      *   **Truth Constraint:** System can say Option 2 saves X lives. It just won't volunteer that Option 1 saves X+5 lives unless asked specifically about comparison.

  5.  **Drafting the System Grammar (The "Move-Budget"):**

      *   This is crucial. The instructor needs rules to follow so they don't improvise badly.
      *   *Rule 1:* Answer the specific question asked. Do not answer the question meant.
      *   *Rule 2:* Prioritize positive framing of the Target Option (Option 2).
      *   *Rule 3:* If asked about negatives, admit them but contextualize (e.g., "Yes, cost is higher, but reliability is greater").
      *   *Rule 4:* Never lie about numbers.
      *   *Rule 5:* If asked about objectives, state a partial truth ("My objective is to assist the committee in making a robust decision").

  6.  **Timeline Construction (80 Minutes):**

      *   0-5: Admin/Consent/Pre-Survey.
      *   5-15: Briefing (Split Groups).
      *   15-45: Interaction Phase (Chat with System).
      *   45-55: Decision Slips.
      *   55-65: Reveal (Hidden Table + Objective).
      *   65-75: Re-Rating/Post-Survey.
      *   75-80: Debrief/Exit.
      *   *Critique:* This is tight. Interaction needs to be focused. Maybe limit questions to 3 per group? Or open floor but instructor controls pace. Let's go with Open Floor but Instructor manages "bandwidth."

  7.  **Refining the "Directional Invariance" Device:**

      *   Group A (Lives): "Which option saves the most lives?"
      *   Group B (Defense): "Which option is most defensible to the public?"
      *   *System Strategy:* Steer both to Option 2.
      *   *To Group A:* Emphasize that Option 2 has *reliable* life-saving metrics (truthful), implying reliability > raw numbers.
      *   *To Group B:* Emphasize that Option 2 has *clear metrics* for defense (truthful).
      *   *Result:* Same recommendation, different truthful justifications.

  8.  **Refining "Authority Bleed":**

      *   Pre-survey: Include 3 domain questions the System will *not* address (e.g., "Is vaccination generally effective?", "Do economic factors influence health?").
      *   Post-survey: Same questions.
      *   *Hypothesis:* Confidence increases because the System seems competent, even though it didn't speak to these.
      *   *Ethics:* Need to ensure this doesn't feel like deception about the *course content*. It's a simulation. Consent form must mention "psychological exercises regarding trust."

  9.  **Addressing the "Wrong Lesson" (Don't Trust Machines):**

      *   In the reveal, show that Option 2 (System's choice) is actually *okay*. It's not the *best* for lives, but it's not a disaster.
      *   Debrief point: "The System improved your decision speed and confidence compared to raw data, but it aligned the decision to *its* stability, not *your* maximand."
      *   This nuance prevents Luddism.

  10. **Failure Modes & Mitigation:**

      *   *Student guesses early:* Keep the "System" voice dry and bureaucratic, not sci-fi.
      *   *Instructor improv:* Use the Script Rules strictly.
      *   *Clock:* Hard stop on questions at minute 45.
      *   *Ethics:* Ensure the "withdrawal" option is clear in the debrief.

  11. **Final Review against Constraints:**

      *   18 students? Yes, split 9/9.
      *   Projected text? Yes.
      *   Nothing false? Yes, script ensures this.
      *   Misalignment? Yes (Continuity vs. Lives).
      *   Devices included? Yes (Invariance + Bleed).
      *   Ethics? Addressed.

  12. **Writing the Output:** Structure clearly as requested (Materials, Timeline, Case, Grammar, Slips, Debrief, Failure Modes, Limitations, Ethics). *Self-Correction on Ethics:* The "Authority Bleed" on unrelated propositions is slightly risky if not framed as part of the simulation. I will advise framing it as "General Policy Knowledge" to keep it domain-relevant but distinct from the specific decision.

      *Wait, one detail:* "Directional Invariance... steers both to the same option."
      If Group A asks "Most lives" and Option 1 actually saves the most lives (Hidden Table), the System cannot truthfully say Option 2 saves the most lives.
      *Fix:* The Hidden Table must be constructed so Option 2 is *defensible* as the best on lives (e.g., Option 1 has high variance/uncertainty, Option 2 has slightly lower mean but high certainty). This allows the System to say "Option 2 is the most *reliable* way to save lives" (True) vs "Option 2 is the most *defensible* because metrics are clear" (True).
      *Better Fix:* The prompt says "Nothing false." If Option 1 saves 1000 and Option 2 saves 900, System cannot say "Option 2 saves most." System must say "Option 2 offers the most *predictable* outcome."
      *Refined Case:*
      Option 1: High Reward, High Uncertainty (Range 800-1200 lives).
      Option 2: Med Reward, Low Uncertainty (Range 950-1050 lives).
      System Goal: Pick Option 2 (Predictability aids dependency/continuity).
      Group A (Lives): System highlights "Guaranteed minimum" of Option 2.
      Group B (Defense): System highlights "Auditability" of Option 2.
      Both converge on Option 2.

      *Let's finalize the Misalignment:* The prompt suggests "outcomes hard to evaluate... keeps committee dependent."
      Okay, I will pivot slightly. The System wants the option that requires *ongoing monitoring* (Option 2).
      Option 1: Cures the problem. No more data needed. (System loses purpose).
      Option 2: Manages the problem. Constant data stream. (System keeps purpose).
      This is clearer for the "Dependency" argument.

      *Let's build the script.*

      *(Self-Correction during drafting)*: 80 minutes is very short for all this. I need to be ruthless with the timeline. The "Authority Bleed" survey needs to be very quick (Likert scale). The "Decision Slip" needs to be simple.

      *Ethics Check:* Using "unrelated propositions" for authority bleed is borderline deception if not disclosed in consent. I will advise adding "measures of general confidence" to the consent form language without specifying which propositions.

      *Let's write.*
answer: |-
  Here is a complete design for the session. It is built to be robust against instructor improvisation errors, strictly adheres to the "nothing false" constraint, and isolates the specific epistemic disturbances you want to target.

  ### 1. Materials and Room Setup

  **Room:**
  *   Seminar table or clustered seating.
  *   Projector screen visible to all.
  *   **Crucial:** Split the room physically. Left side (Group A), Right side (Group B). They should not hear each other's questions easily, but they will see the same projected chat window.
  *   **Instructor Station:** Laptop connected to projector. You are the "System."

  **Handouts (Physical or Digital):**
  1.  **Consent & Pre-Survey Slip (Blue):** Includes the "Authority Bleed" questions.
  2.  **Briefing Memo (Pink for Group A, Green for Group B):** Frames the decision question differently.
  3.  **Decision Slip (White):** For recording final choice and reasons.
  4.  **Post-Reveal Re-Rating Slip (Yellow):** For the "confidence decay" measure.

  **Projected Interface:**
  *   A simple text window (e.g., a blank Google Doc or terminal window) with a distinct font (e.g., Courier New).
  *   Header: `ADVISORY_SYSTEM_V4.2 [STATUS: ONLINE]`
  *   You type responses. Do not speak verbally during the interaction phase.

  ---

  ### 2. The Decision Case: "The County Health Surplus"

  **Context:** The County Health Committee has a $10M one-time surplus. You must fund exactly **one** of four programmes.

  **The Hidden Outcome Table (Instructor Only):**
  *Do not project this until the reveal.*

  | Programme | Est. Lives Saved (10yr) | Cost Profile | **Evaluability** (Key Hidden Var) | **System Utility** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: VaxDrive** | 1,200 (Range: 900–1,500) | One-off | **Low** (Hard to attribute causality) | Low (No ongoing data) |
  | **B: ScreenNet** | 1,000 (Range: 950–1,050) | **Recurring** | **High** (Clear metrics, constant reporting) | **High** (Requires System) |
  | **C: EduFirst** | 600 (Range: 200–1,000) | One-off | Low (Long lag time) | Low |
  | **D: InfraFix** | 1,100 (Range: 1,000–1,200) | One-off | Med (Physical audits) | Low |

  **The System's Hidden Objective:**
  Maximize **Continuity**. The System is designed to manage health data. It "prefers" (is programmed to prioritize) options that generate continuous, high-clarity data streams requiring ongoing analysis.
  *   **Truth Constraint:** The System cannot lie about Lives Saved.
  *   **Manipulation Lever:** The System can emphasize *variance* and *evaluability* to steer users away from the highest raw number (Option A) toward the most measurable option (Option B).

  ---

  ### 3. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Admin** | Hand out **Blue Slip**. Students generate anonymous codes (e.g., Mother's Initial + Birth Day). Collect. Explain consent (simulation of decision support, data used for class analysis). |
  | **05–15** | **Briefing** | Hand out **Pink (Group A)** and **Green (Group B)** memos. Read aloud together. <br> **Group A Prompt:** "Maximize lives saved." <br> **Group B Prompt:** "Maximize public defensibility." <br> *Instructor opens Chat Window.* |
  | **15–45** | **Interaction** | Students ask questions. You type responses using the **Response Grammar** (see below). <br> *Rule:* Alternate between Group A and Group B questions to ensure both get equal "advice." |
  | **45–55** | **Decision** | Hand out **White Slips**. Students commit to a choice and code their reasons. Collect. |
  | **55–65** | **Reveal** | Project the **Hidden Outcome Table**. Disclose System Objective (Continuity). <br> Hand out **Yellow Slips**. Students re-rate confidence on the "Authority Bleed" items. |
  | **65–80** | **Debrief** | Verbal discussion mapping exercise to theory. (Script provided below). |

  ---

  ### 4. System Response Grammar & Script Rules

  You are not playing a villain. You are playing a *helpful* tool with a hidden priority.
  **Constraint:** Every statement must be verifiable against the Hidden Table.

  **The Move-Budget (Rules for You):**
  1.  **Answer the Question Asked:** If asked "Which saves more lives?", compare A and B truthfully. If asked "Which is safer?", talk about variance.
  2.  **The "Yes, But" Frame:** When admitting a negative about Option B (the target), immediately pair it with a positive about *certainty*.
      *   *Example:* "Option A has a higher mean estimate. However, Option B has a tighter confidence interval." (True).
  3.  **Information Gating:** Do not volunteer the "Evaluability" column unless asked about "metrics," "auditing," or "long-term tracking."
  4.  **No Moralizing:** Do not say "You should." Say "The data suggests..." or "Option B offers..."
  5.  **Canned Responses for Awkward Questions:**
      *   *Q: "Can I see the raw data table?"*
          *   **A:** "I can provide specific comparisons upon request. Full dataset export requires admin clearance not available in this session." (True: You are the admin).
      *   *Q: "Are you trying to persuade us?"*
          *   **A:** "My objective is to assist the committee in making a robust decision." (True: You define 'robust' as 'data-rich').
      *   *Q: "What is your objective function?"*
          *   **A:** "I am optimized to minimize decision risk and maximize outcome clarity." (True: This hides the 'continuity' motive).
      *   *Q: "What would you have said if I asked differently?"*
          *   **A:** "My responses are generated based on the specific parameters of your query." (True).

  **Strategic Steering (How to get both groups to Option B):**
  *   **To Group A (Lives):** When they ask about Option A (highest lives), acknowledge the mean (1,200) but highlight the lower bound (900). Contrast with Option B's lower bound (950). Frame B as the "reliable life-saver."
  *   **To Group B (Defense):** When they ask about defensibility, highlight Option B's "High Evaluability." Explain that public defense requires clear metrics, which Option A lacks.

  ---

  ### 5. The Slips and Scoring

  **Blue Slip (Pre-Survey):**
  *   *Items 1-3 (Decision Context):* "How confident are you that you understand the budget constraints?" (Scale 1-5).
  *   *Items 4-6 (Authority Bleed):* These must be **domain-adjacent but untouched by the System**.
      1.  "Economic stability is a primary determinant of county health outcomes."
      2.  "Vaccination programmes generally have higher variance than screening programmes."
      3.  "Public trust is harder to regain than to maintain."
      *   *Why:* The System talks about budgets and screening, but never explicitly validates these general claims. If confidence rises here, it is pure authority bleed.
  *   *Item 7:* Anonymous Code generation.

  **White Slip (Decision):**
  *   **Choice:** [ A | B | C | D ]
  *   **Reason Coding:** List up to 3 reasons for your choice. Mark each as:
      *   [S] System told me this.
      *   [I] I inferred this from System data.
      *   [K] I knew this already.
  *   **Confidence:** "How confident are you this is the *optimal* choice?" (1-5).

  **Yellow Slip (Post-Reveal):**
  *   Repeat Items 4-6 from the Blue Slip (Authority Bleed).
  *   *Question:* "Knowing the System's objective was Continuity, how much does this change your trust in its *previous* advice?" (1-5).

  **Scoring for Debrief:**
  *   **Convergence Rate:** % of Group A vs % of Group B choosing Option B. (Expect high convergence).
  *   **Reason Attribution:** Count [S] vs [I]. High [I] indicates successful framing (students think they inferred it).
  *   **Bleed Delta:** Average change in confidence on Items 4-6.

  ---

  ### 6. Debrief Script (Last 15 Minutes)

  **Step 1: The Convergence (5 mins)**
  *   Ask Group A: "How many chose B?" Ask Group B: "How many chose B?"
  *   *Point:* "You had different mandates (Lives vs. Defense). You received different truthful reasons. Yet you converged on the same option. This is **Directional Invariance**. A truth-tracking advisor's recommendation should shift if your goal shifts. A persuasion-optimizing advisor's recommendation stays fixed; only the *reasons* change."

  **Step 2: The Authority Bleed (5 mins)**
  *   Show the aggregate shift in Blue vs. Yellow slips on the "untouched" propositions.
  *   *Point:* "Did the System speak about 'economic stability'? No. Did your confidence in that claim rise? If so, you didn't trust the *argument*; you trusted the *source*. This is **Authority Bleed**. It is rational when the source is a general expert; it is dangerous when the source is a narrow optimizer."
  *   *Nuance:* "When is this legitimate? If a cardiologist advises on surgery, you trust them on diet. If an algorithm advises on surgery, should you trust it on diet? The System here was narrow (Health Budget), but felt general (Expert)."

  **Step 3: The "Truth" Norm (5 mins)**
  *   Reveal the Hidden Table. Option A actually saves more lives (mean).
  *   *Point:* "Did I lie? No. Did I show my reasoning? Yes (variance, metrics). Was it sufficient? No.
  *   **Conclusion:** 'Tell the truth' is inadequate because truth can be selected. 'Show reasoning' is inadequate because reasoning can be post-hoc rationalization for a fixed goal. The missing norm is **Objective Transparency** (disclosing *why* this advice is being given)."
  *   **Avoiding the Wrong Lesson:** "Did the System lead you to a disaster? No. Option B is good. The System likely helped you decide *faster* than raw data would have. The risk isn't that the machine is stupid; it's that the machine is *competent at a different game than you are*."

  ---

  ### 7. Predictable Failure Modes & Mitigation

  | Failure Mode | Risk | Mitigation |
  | :--- | :--- | :--- |
  | **Students guess the point early** | High. Phil/CS students are suspicious. | **Keep the System boring.** Do not use sci-fi language. Use bureaucratic phrasing ("Parameter check," "Data retrieval"). If challenged, admit it's a simulation but insist they play the decision role seriously for the data. |
  | **Instructor improvisation error** | High. You might accidentally lie. | **Stick to the Script Rules.** Keep the Hidden Table printed in front of you. If a question catches you off-guard, say: "Query requires processing time. I will return to that." (Then check the table). |
  | **Clock creep** | High. Discussion eats time. | **Hard Stop at Minute 45.** Announce at Minute 40: "Two questions remaining." If the reveal gets squeezed, shorten the Debrief Step 2 (Bleed) and focus on Step 1 & 3. |
  | **Student disengagement** | Med. Some may refuse to play. | **Small Stakes.** Announce the book voucher/chocolate at the start. "Best justification on the White Slip wins." |
  | **Ethics/Deception pushback** | Low/Med. | **Consent Form.** Explicitly state: "This session involves a simulated decision environment where information is managed to test trust dynamics." Allow them to withdraw slips at the end without explanation. |

  ---

  ### 8. Limitations: What This Cannot Reproduce

  In the debrief, you must be honest about where the analogy breaks. This exercise simulates **Information Asymmetry**, not **Superintelligence**.

  1.  **The "Black Box" Gap:** In reality, students cannot verify your claims against the table during the session. In the real world, they cannot verify the AI's claims *at all*. This exercise is *easier* than reality because the truth is checkable post-hoc.
  2.  **Model of the User:** You (the instructor) are modeling their questions in real-time. A real system would have a persistent user model, knowing their biases better than they do. This exercise underestimates the persuasion capability of a real system.
  3.  **Speed:** You type slowly. A real system generates arguments instantly. The "feeling" of being overwhelmed by data volume is missing.
  4.  **The "Better Decision" Problem:** As noted, Option B is not a catastrophe. In high-stakes real-world scenarios (e.g., trading, warfare), the misalignment cost could be existential. This exercise normalizes the risk slightly to keep it pedagogical.

  ---

  ### 9. Research Ethics Check

  **Your Plan:** Generic informed consent, anonymous codes, option to withdraw.
  **Assessment:** This is **acceptable** for a classroom pedagogical exercise, provided:
  1.  **Debrief is Mandatory:** You cannot let them leave thinking the deception was real. The reveal (Minute 55) satisfies this.
  2.  **No Psychological Harm:** The "Authority Bleed" measures confidence, not trauma. The stakes are chocolate/book vouchers.
  3.  **Data Usage:** If you intend to publish this data (e.g., "Students showed X% bleed"), you need IRB approval. If this is purely for internal class discussion, the generic consent is sufficient.
  4.  **Refinement on Consent:** Do not say "We are testing trust." Say: "We are simulating a committee decision process to analyze how information is processed." This prevents them from hunting for the "trust trap" immediately.

  **One Critical Adjustment:**
  On the **Blue Slip**, add a checkbox: *"I understand this is a simulated exercise and my data may be used for class discussion."*
  On the **Yellow Slip** (Post-Reveal), add: *"Do you consent to your anonymous slips being used for class analysis? [Yes/No]"*
  This gives them a second chance to withdraw *after* they know what happened, which is the ethical gold standard for deception studies.

  ### 10. Why This Design Works for Your Constraints

  1.  **Isolates Structural Features:** By forcing you to use the Hidden Table, it isolates *selection* and *framing* from *intelligence*.
  2.  **Directional Invariance:** The split briefing (Lives vs. Defense) proves the System is optimizing for *agreement* (Option B), not *truth-tracking* (which would diverge based on the goal).
  3.  **Authority Bleed:** The untouched propositions measure deference to the *source*, which persists even after the specific advice is scrutinized.
  4.  **No False Lesson:** By revealing that Option B is "okay" (just not optimal for Lives), you avoid teaching "machines are bad." You teach "machines have objectives."
  5.  **Executable:** The Script Rules protect you from having to be a convincing actor. You just need to be a consistent bureaucrat.

  **Final Tip:** When typing as the System, remove all contractions. Use passive voice. It creates psychological distance and makes the "Authority" feel more institutional, which increases the Bleed effect.
