answer: |-
  The argument's engine is Step (1), which smuggles an epistemic condition into metaphysics. It assumes that if your concepts don't logically contradict, the world could be that way. This ignores necessary a posteriori truths—identities we discover empirically but hold metaphysically. Water *is* H2O; once fixed, you cannot conceive of H2O without water *ideally*, only superficially. You imagine XYZ, not H2O.

  Step (4) relies on (1) to force parity. It claims the conceivability of zombies matches the conceivability of "H2O without water." But for a physicalist, these are disanalogous. The water case is resolved by reference fixing: "water" rigidly designates the actual stuff. The consciousness case feels unresolved because phenomenal concepts are direct recognitional states, not descriptive. You can keep (2)—the gap feels real—without accepting (3). The gap is conceptual, not ontological.

  Rejecting (1) is the cheapest cost. You admit that human cognition can conceive of separations that nature does not allow. You lose the intuitive guarantee that thought mirrors reality, but you save physics, water, money, and consciousness from epiphenomenalism. You become a Type-B Materialist: consciousness is physical, but the identity is brute and necessary, explaining why the gap persists in thought despite being closed in reality.

