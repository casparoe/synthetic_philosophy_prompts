  Please explain, in continuous prose without headings, bullet points, bold text, or tables, the conceptual tension at the centre of the paradox of phenomenal judgment for epiphenomenalism. Rather than repeating the standard formulation, focus specifically on why the epiphenomenalist cannot dissolve the problem by treating phenomenal judgments as caused by the same physical states that produce the experiences themselves, and show precisely where the distinction between causal production and rational justification causes this dissolution to fail. I want you to draw out the analogy—often overlooked in introductory treatments—between phenomenal judgments and mathematical judgments, both of which seem to track properties that lack direct causal efficacy, and use this to clarify why rational accessibility is not reducible to physical causation. Do not provide citations, reading lists, or references to specific texts; write for a reader who cannot search online but who is familiar with the basic distinction between physicalism and property dualism. Keep your answer focused, relatively concise, and written in formal British English.
