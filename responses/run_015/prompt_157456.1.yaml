answer: |-
  The central difficulty for epiphenomenalism lies in reconciling the claim that phenomenal experiences are causally inert with the obvious fact that we make knowledge claims about those very experiences. If qualia are mere by-products of physical processes that possess no power to influence subsequent physical events, including the speech acts or neural states constituting a judgment, it becomes obscure how any subject could ever refer to them or know them to exist. Proponents of this view often attempt to dissolve this paradox by arguing that phenomenal judgments are not caused by the experiences themselves, but rather by the underlying physical states that produce both the experience and the judgment simultaneously. On this account, a specific neuronal configuration causes the sensation of pain and, in parallel, causes the verbal report I am in pain, thereby ensuring a reliable correlation between the judgment and the experience without requiring the experience to exert any causal force.

  However, this strategy fails because it conflates causal production with rational justification. While the common cause explanation may account for why the judgment occurs reliably alongside the experience, it does not explain why the judgment is justified by the experience. For a belief to constitute knowledge of a phenomenon, the phenomenon itself must play a role in grounding the reason for holding that belief. If the judgment is caused entirely by the physical substrate, then the subject's reason for believing they are in pain is ultimately grounded in neuronal firing, not in the feeling of pain itself. The experience remains outside the causal chain that produces the belief, rendering the belief accidentally true rather than rationally grounded. The subject is not responding to the quality of the experience but merely to the physical conditions that accompany it, which means the judgment lacks the necessary intentional connection to the phenomenal property it purports to describe.

  This distinction becomes sharper when one considers the analogy between phenomenal judgments and mathematical judgments. Mathematical truths are abstract entities that, like epiphenomenal qualia, lack direct causal efficacy in the physical world; the number two does not push atoms around, nor does the truth of a theorem exert physical force on a mathematician's brain. Yet, we claim to have knowledge of mathematics because we grasp the reasons why certain propositions are true. If a mathematician's belief in a theorem were caused solely by a physical state that was merely correlated with the mathematical truth by some pre-established harmony, without the mathematician actually comprehending the logical derivation, we would not say they possess mathematical knowledge. They would merely be a reliable belief-forming mechanism. Similarly, if a subject's judgment about their own consciousness is caused solely by physical states correlated with experience, they are not truly judging the experience but are instead reacting to the physical correlates.

  The analogy illuminates why rational accessibility cannot be reduced to physical causation. In both mathematics and phenomenology, the object of judgment is causally inert, yet knowledge requires that the truth of the object informs the belief through a rational link rather than a mere causal chain. For the epiphenomenalist, the phenomenal property is present but isolated; it is seen, so to speak, but it does not speak back to influence the judgment. Consequently, the subject cannot claim that their belief is true because of the experience, only that it is true because of the physical state. This leaves the epiphenomenalist with a view where subjects are systematically mistaken about the source of their own knowledge, claiming to be justified by feelings that are, by definition, incapable of providing such justification. Thus, the attempt to salvage epiphenomenalism via common cause causation collapses because it secures correlation at the expense of the rational connection required for genuine knowledge.
