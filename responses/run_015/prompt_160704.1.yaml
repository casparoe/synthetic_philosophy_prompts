prompt: |-
  I write historical fiction, and I am stuck on a scene. My narrator, a Nyāya-trained court pandit, must persuade a visiting Buddhist interlocutor — and through him my reader, who has never met the word pramāṇa — that knowledge by comparison (upamāna: coming to know an unfamiliar thing through its resemblance to something already familiar) is a knowledge-source in its own right, not perception, inference, or testimony in disguise. His opponent grants perception, inference and testimony but denies that comparison is a fourth. Do not write the scene and do not explain the doctrine to me; give me a plan for how the explanation should run in about a page and a half of dialogue, for an intelligent reader with no Sanskrit and no philosophy.

  I need the dependency structure: what must be established before the claim can even be stated, beginning, I assume, with what a pramāṇa is meant to be — a reliable route to a piece of new, correct cognition rather than a manner of reasoning. A complication I have written in: earlier in the argument the pandit concedes that recollection is not a pramāṇa, since genuine knowledge must present something new, so he cannot lean on the fact that he remembered the cow. Where does that concession bite, and how does he route around it?

  One case should carry the whole thing. My provisional version: a forester's description of a gavaya, a wild ox-like animal, as cow-like; a sighting years later with no speaker present; the animal half-hidden in brush, so that the resemblance is only partly seen. What must such a case have and lack for the work to fall on comparison alone, and is my version or the plainer classical one the better example?

  Three misconceptions I expect: that upamāna is just analogy in the loose Western sense; that it collapses into inference from resemblance; and that what it yields is merely a word's meaning rather than knowledge about the animal standing in front of him. In what order will these actually arise, and where in the sequence should each be headed off?

  Finally, what could the reader do at the close that would show the idea had landed, and what — the theory of pervasion, the five-membered syllogism, the full Sanskrit inventory — should the pandit openly decline to enter into?
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Genre:** Historical Fiction (Scene Plan).
      *   **Characters:** Nyāya-trained Court Pandit (Proponent) vs. Visiting Buddhist Interlocutor (Opponent).
      *   **Goal:** Persuade the interlocutor (and the reader) that *upamāna* (knowledge by comparison) is a distinct *pramāṇa* (knowledge source), separate from perception, inference, and testimony.
      *   **Constraints:** Do not write the scene. Do not explain the doctrine directly to the user. Provide a *plan* for the dialogue (approx. 1.5 pages of text equivalent).
      *   **Audience:** Intelligent reader, no Sanskrit, no philosophy background.
      *   **Specific Requirements:**
          *   Establish dependency structure (what comes first).
          *   Define *pramāṇa* (reliable route to *new* cognition).
          *   Address the "recollection concession" (knowledge must be new, so remembering the cow doesn't count as the *source* of knowledge).
          *   Select/Refine the Example Case (Forester/Gavaya/Cow).
          *   Address Three Misconceptions (Analogy, Inference, Word-Meaning only).
          *   Define the Ending (Reader action showing understanding).
          *   Define the Boundaries (What the Pandit refuses to discuss).

  2.  **Deconstruct the Philosophical Problem (Nyāya vs. Buddhist on *Upamāna*):**
      *   *Nyāya Position:* *Upamāna* is a distinct *pramāṇa*. It connects a name (word) to an object via similarity, based on prior testimony, but the final cognition ("This is that gavaya") happens at the moment of seeing the similarity in the wild.
      *   *Buddhist (and Mīmāṃsā) Objection:* It's reducible. Either it's Inference (based on similarity) or Testimony (the forester's words) or Perception (seeing the animal).
      *   *The "Newness" Problem:* If I remember the cow to compare it, isn't that just memory? Memory isn't a *pramāṇa* because it's not *new*. The *new* knowledge is "This animal in front of me is the thing called 'gavaya'."
      *   *The Example:* Classical example is the *gavaya* (wild bison) and the *go* (cow). A forester says, "A gavaya is like a cow." Later, you see a gavaya in the forest. You recognize it *as* a gavaya because of the similarity to the cow you know.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Grounding the Terms (The "Pramāṇa" Definition).**
          *   Must start here. If they don't agree on what counts as knowledge, they can't argue about sources.
          *   Key distinction: *Pramāṇa* = Instrument/Cause of *new* valid cognition (*prama*).
          *   Address the Recollection Concession early. Memory preserves old knowledge; it doesn't generate new truth. This sets the trap for the opponent later.

      *   **Phase 2: Setting the Scene (The Gavaya Case).**
          *   Evaluate the user's version vs. Classical.
          *   User's version: "Half-hidden in brush." *Critique:* This introduces uncertainty/perception issues. If it's half-hidden, is it perception?
          *   Classical version: Clear sighting, but the *identity* is the issue.
          *   *Decision:* Stick closer to the classical for clarity, but keep the "wild" setting. The key is the gap between the *name* and the *object*.
          *   *Requirement:* The case must lack a speaker at the moment of recognition (rules out Testimony) and must yield more than just seeing shapes (rules out Perception).

      *   **Phase 3: The Negative Proof (Ruling out the Big Three).**
          *   This is the core argument.
          *   *Not Testimony:* The forester is gone.
          *   *Not Perception:* Eyes see shape/color, not the *relation* to the name "gavaya." Perception says "animal," not "gavaya."
          *   *Not Inference:* This is the hardest one. Inference requires a universal rule ("Whatever looks like a cow is a gavaya"). But we don't know that rule yet. We are *learning* the rule.
          *   *Addressing the Recollection Concession:* The memory of the cow is the *tool*, but the *knowledge* ("This is the gavaya") is new. The memory isn't the *pramāṇa*; the *comparison* is.

      *   **Phase 4: Addressing Misconceptions (Order of Operations).**
          *   1. *Word-Meaning only:* Opponent will say "You just learned a definition." Pandit must say "No, I identified a real object in the world."
          *   2. *Analogy:* Opponent will say "It's just a figure of speech." Pandit must say "It yielded actionable truth (I can hunt/avoid it)."
          *   3. *Inference:* (Handled in Phase 3, but needs reinforcement).
          *   *Order:* Start with the concrete (is it just words?), move to the logical (is it inference?).

      *   **Phase 5: The Climax/Resolution.**
          *   What does the reader do? They need to perform a mini-recognition.
          *   What to exclude? Technical Nyāya machinery (5-member syllogism, *vyāpti*/pervasion). Keep it phenomenological.

  4.  **Refining the Dependency Structure:**
      *   Step 1: Agree on *Pramāṇa* (Instrument of *new* truth).
      *   Step 2: Introduce the Gavaya Scenario (Establish the gap between Name and Object).
      *   Step 3: Eliminate Perception (Senses don't speak names).
      *   Step 4: Eliminate Testimony (Speaker is absent).
      *   Step 5: Eliminate Inference (No prior universal rule exists).
      *   Step 6: Isolate *Upamāna* (The act of linking similarity to name in the presence of the object).
      *   Step 7: Handle the Memory Concession (Memory is the raw material, Comparison is the fire).

  5.  **Addressing the Specific "Recollection Concession":**
      *   The user is worried: If memory isn't a *pramāṇa*, how can comparing to a remembered cow be a *pramāṇa*?
      *   *Solution:* Distinguish the *content* of memory (the cow) from the *operation* of comparison. The memory is static. The comparison is an active synthesis resulting in a *new* relation: "This wild beast = That word 'gavaya'." The *newness* lies in the application of the name to the specific instance, not in the recall of the cow.

  6.  **Addressing the Example Case:**
      *   User's "half-hidden" idea adds noise. It makes it about perceptual uncertainty.
      *   Better: The animal is clearly seen, but *unidentified*. The problem isn't "What is that shape?" but "What is that *called* / How does that fit my world?"
      *   Keep the Forester's description ("Cow-like").
      *   Keep the time gap (Testimony is past, Recognition is present).

  7.  **Addressing the Misconceptions Order:**
      *   1. "It's just learning a definition" (Semantic vs. Ontological).
      *   2. "It's just Inference" (Logical reduction).
      *   3. "It's just Analogy" (Literary device vs. Epistemic tool).
      *   *Correction:* Inference is the strongest philosophical objection, so it should be the main battle. "Just words" is the easiest to dismiss. "Analogy" is a category error.
      *   *Revised Order:* Words -> Inference -> Analogy (as a summary dismissal).

  8.  **Final Review against Constraints:**
      *   No scene writing? Check.
      *   No direct doctrine explanation to user? Check (it's a plan for the scene).
      *   Dependency structure clear? Check.
      *   Recollection concession addressed? Check.
      *   Example case refined? Check.
      *   Misconceptions ordered? Check.
      *   Ending/Exclusions defined? Check.

  9.  **Polishing the Plan:**
      *   Ensure the tone is advisory and structural.
      *   Make sure the "Reader Action" is concrete.
      *   Clarify the "Recollection" workaround specifically, as that's a tricky philosophical point.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally explain Nyāya philosophy *to the user* as if they don't know it, but rather explain how to *dramatize* it. The prompt says "Do not... explain the doctrine to me." I must assume the user knows the doctrine but needs help structuring the *dialogue*. I will focus on the *dramatic beat* of the argument.

      *(Refining the Recollection Point)*: The Pandit must argue that memory provides the *comparandum* (the cow), but the *cognition* ("This is a gavaya") is novel. The *instrument* is the similarity-linking, not the memory itself.

      *(Refining the Example)*: The "half-hidden" aspect is actually useful if framed correctly. It prevents simple Perception from claiming the win. If the animal is perfectly clear, Perception might claim "I saw a gavaya." If it's partially obscured but the *similarity* is clear, it highlights that the *recognition* comes from the match, not the full sensory data. I will advise keeping the "partial" aspect but clarifying *why* it helps (blocks Perception).

      *(Refining the Ending)*: The reader needs to recognize something in their own world. A "meta" moment.

      *(Refining Exclusions)*: Keep it out of the *parārthānumāna* (syllogism for others). This is about personal cognition (*svārtha*).

      *Let's assemble the plan.*
answer: |-
  Here is a structural plan for the dialogue, designed to fit approximately a page and a half of text while navigating the philosophical constraints for a lay reader.

  ### I. The Foundation: Defining the Stake (First 1/4 of dialogue)
  **Goal:** Establish the definition of *pramāṇa* and secure the concession on memory without weakening the upcoming argument.

  1.  **The Definition:** The Pandit must open by securing agreement on what counts as a knowledge-source. It is not merely "thinking"; it is an *instrument* that generates a *new*, *correct* awareness of an object.
  2.  **The Memory Trap:** The Pandit must voluntarily reiterate his earlier concession: Memory is not a *pramāṇa* because it repeats old knowledge.
      *   *Why here?* If he waits until the Buddhist attacks him on this, it looks like a defense. By stating it upfront as a shared rule, it becomes a constraint the Buddhist must also respect.
      *   *The Route Around:* The Pandit must plant the seed that while the *content* of the comparison (the image of the cow) is remembered, the *result* (identifying the wild animal) is new. The instrument is not the memory itself, but the *act of matching*.

  ### II. The Case Study: The Gavaya in the Brush (Next 1/4 of dialogue)
  **Goal:** Present the concrete example that isolates the specific cognitive gap.

  1.  **Refining the Example:** Use your provisional version but sharpen the conditions.
      *   *Condition A (Testimony):* A forester previously said, "A *gavaya* is like a cow." (Establishes the link between word and similarity).
      *   *Condition B (Absence):* The forester is now gone. (Blocks Testimony).
      *   *Condition C (Perception):* The animal is in the brush. We see ears, a hump, a tail. We perceive "animal," but we do not perceive "gavaya." (Blocks Perception).
      *   *Condition D (The Gap):* The viewer knows cows perfectly but has never seen a *gavaya*.
  2.  **The Moment of Cognition:** The viewer sees the partial shape, recalls the cow, notes the resemblance, and thinks: *"This is the thing the forester called a gavaya."*
      *   *Instruction:* Ensure the Pandit emphasizes that the *name* "gavaya" attaches to the *object* in front of them at this specific moment. Before this, "gavaya" was just a sound; now it is a reality.

  ### III. The Elimination Round: Ruling Out the Big Three (Next 1/2 of dialogue)
  **Goal:** Systematically prove the cognition cannot be produced by the three accepted sources. Address misconceptions as they naturally arise in the Buddhist's objections.

  1.  **Objection 1: "It is just Testimony (Word-Meaning)."**
      *   *Buddhist:* "You only know it because the forester told you. You just learned a definition."
      *   *Pandit's Rebuttal:* Testimony requires a speaker *now*. The forester is silent. If testimony alone worked, you could identify a *gavaya* in a dark room. You cannot. You need the object present.
      *   *Misconception Headed Off:* This clarifies that *upamāna* yields knowledge of a *real object*, not just a dictionary definition.
  2.  **Objection 2: "It is just Perception."**
      *   *Buddhist:* "Your eyes see the animal. That is perception."
      *   *Pandit's Rebuttal:* Eyes see shape and color. They do not see the *relation* to the word "gavaya." Perception tells you "there is an ox-like thing." It does not tell you "this is the *gavaya*." That link requires the memory of the cow to bridge the gap.
      *   *Misconception Headed Off:* Distinguishes raw sensory data from recognized identity.
  3.  **Objection 3: "It is just Inference."** (The Hardest Battle)
      *   *Buddhist:* "You infer it. Major premise: Whatever resembles a cow is a gavaya. Minor premise: This resembles a cow. Conclusion: This is a gavaya."
      *   *Pandit's Rebuttal:* Where did you get the Major Premise? You cannot have a universal rule ("All cow-like things are gavyas") before you have identified the first *gavaya*. Inference requires a known rule; *upamāna* is how we *learn* the rule in the first place.
      *   *Misconception Headed Off:* This crushes the idea that it is merely logical deduction. It establishes *upamāna* as a foundational source for future inferences, not a derivative of them.
      *   *Handling the Memory Concession:* The Pandit must clarify: "I use memory of the cow as a *tool*, just as I use my eyes as a tool. The eye is not the knowledge; the seeing is. The memory is not the knowledge; the *comparison* is."

  ### IV. The Climax and Exclusion (Final 1/4 of dialogue)
  **Goal:** Solidify the distinctness of the source and define the boundaries of the conversation.

  1.  **The "Analogy" Trap:**
      *   *Buddhist:* "This is just poetry. Analogy."
      *   *Pandit:* "Poetry delights; *pramāṇa* guides action. If I mistake it for a cow, I may try to milk it. If I mistake it for a tiger, I may flee. Knowing it is a *gavaya* tells me how to act. It is pragmatic truth, not literary flourish."
  2.  **What the Pandit Declines:**
      *   The Pandit must explicitly refuse to diagram the logic using the **five-membered syllogism** or discuss **pervasion (*vyāpti*)**.
      *   *Reasoning:* He should state, "We are discussing how knowledge *arises* in the mind, not how we *argue* it in court. Do not confuse the anatomy of the debate with the birth of the thought." This keeps the scene accessible and phenomenological.
  3.  **The Reader's Task (The Landing):**
      *   To show the idea has landed, the scene should end with the Buddhist (or the reader through the Buddhist's silence) performing a micro-act of *upamāna*.
      *   *Action:* The Buddhist looks at an object in the room (e.g., a foreign coin, a strange fruit, a specific flower) that the Pandit has named but the Buddhist has never seen. The Buddhist realizes he cannot identify it by sight alone, nor by rule, but only by recalling a description of similarity.
      *   *Effect:* The reader, watching the Buddhist look at the object and hesitate, will feel the gap between "seeing" and "knowing what it is," thereby experiencing the need for the fourth source.

  ### Summary of Dependencies
  1.  **Define *Pramāṇa*** (New, valid cognition) $\rightarrow$ allows exclusion of Memory.
  2.  **Present Case** (Forester + Brush + Cow) $\rightarrow$ creates the cognitive gap.
  3.  **Exclude Testimony** (Speaker absent) $\rightarrow$ forces reliance on the object.
  4.  **Exclude Perception** (Senses don't speak names) $\rightarrow$ forces reliance on the mind.
  5.  **Exclude Inference** (No prior rule exists) $\rightarrow$ proves the source is unique.
  6.  **Clarify Memory's Role** (Tool vs. Source) $\rightarrow$ resolves the earlier concession.
  7.  **Final Demonstration** (Silent recognition) $\rightarrow$ validates the theory experientially.
