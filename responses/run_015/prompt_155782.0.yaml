      *   This proves non-uniqueness of optimal report = Not Strictly Proper.
      *   This works.

  12. (Final check on time): 75 mins is very short for 2 blocks + debrief. I must advise cutting rounds to 3 per block. 5 is too ambitious with calculation time.

