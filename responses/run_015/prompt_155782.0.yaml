answer: |-
  This is a bold and pedagogically sound plan. You are essentially gamifying the difference between **Proper** and **Strictly Proper** scoring rules to show why Veritism + Propriety isn't enough to derive Probabilism—you need *Strict* Propriety.

  Your mathematical intuition is correct: if you score only on the coarse groups, any distribution of credence *within* a group that preserves the group sum yields the identical score. This creates a set of optimal reports that includes the truth but also includes incoherent (or merely imprecise) distributions. That non-uniqueness is the failure of strict propriety.

  However, 75 minutes is extremely tight for two blocks of data collection, scoring, and a philosophical debrief. If the arithmetic bogs you down, the "experience" becomes "waiting for the professor to calculate."

  Here is the optimized run-sheet, the necessary tweaks to ensure the math lands, and the debrief script.

  ### 1. The Verdict on Your Plan
  **Is the rule correct?** Yes. Scoring the coarse sums makes the rule proper (truthful coarse credences maximize expected score) but not *strictly* proper (false fine-grained credences can also maximize expected score if the coarse sum is right).
  **Which block first?** **Fine First.**
  *   **Why:** You need to establish the baseline intuition that "Accuracy rewards precision and coherence." If you run Coarse first, students will develop "sloppy" habits that feel natural. When you switch to Fine, they will feel punished for being sloppy, which teaches the value of coherence. But if you run Fine first, they optimize for truth. Then, when you switch to Coarse, they will *notice* the relief of being able to reshuffle without penalty. That feeling of "wait, I don't have to be precise anymore?" is the phenomenological hook for "not strictly proper."

  ### 2. Logistics & Materials
  **Time Budget:**
  *   Intro & Rules: 5 min
  *   Block 1 (Fine): 20 min (3 Rounds)
  *   Block 2 (Coarse): 20 min (3 Rounds)
  *   Tally & Debrief: 30 min

  **Materials:**
  *   **The World:** A standard deck of cards. Remove all but four cards: **2♥, 3♥, 4♥, 5♥**. (Keep partition small to reduce cognitive load and arithmetic errors).
  *   **The Groups (for Block 2):** Low (2,3) and High (4,5).
  *   **Submission:** Small slips of paper. Pre-printed with 4 boxes labeled 2, 3, 4, 5.
  *   **The Calculator:** **You need a spreadsheet open on the projector.** Do not calculate by hand. Input the 16 students' 4 numbers, have it auto-calculate the Brier score. If you do this by hand, you will lose 15 minutes and their attention.
  *   **Payoff:** High-quality chocolate for the top 3 aggregate scorers. (Avoid "picking reading"—it introduces political/ideological utility that contaminates the epistemic lesson).

  **The Scoring Rule (Projected on Screen):**
  *   **Block 1:** $Score = 200 \times C(\text{true card}) - \sum_{\text{all cards}} C(\text{card})^2$
      *   *Note:* I scaled by 100 to avoid decimals. Students enter 0–100 integers.
  *   **Block 2:** $Score = 200 \times C(\text{true Group}) - (C(\text{Low Group})^2 + C(\text{High Group})^2)$
      *   *Crucial Instruction:* "For Block 2, I will sum your 2 and 3 boxes to get your Low Score. I will sum your 4 and 5 boxes to get your High Score. I do not care how you split the points inside the group, only the total."

  ### 3. Running the Game (The "Experience")
  **Block 1 (Fine-Grained):**
  1.  Shuffle the 4 cards. Draw one. Keep it hidden.
  2.  Students assign 0–100 to each of the 4 cards. **No constraint:** They can sum to 50, 100, or 150. Let them discover the penalty.
  3.  Collect slips. Input into spreadsheet.
  4.  Reveal card. Show scores.
  5.  **Repeat 3 times.**
  6.  *Expected Behavior:* Students will try to sum to 100. They will try to match their credence to the frequency (e.g., if 2♥ comes up twice, they bump 2♥). They will feel tension about splitting probability between 2 and 3.

  **Block 2 (Coarse-Grained):**
  1.  **Stop.** Explain the rule change clearly. "I am now blind to the individual cards. I only see the Low Group total and the High Group total."
  2.  **The Trap:** Do not tell them they can be incoherent inside the group. Let them discover it.
  3.  Repeat 3 times.
  4.  *Expected Behavior:* Astute students will realize they can put all their "Low" credence on 2♥ and 0 on 3♥ (or vice versa) without changing their score. Some will put 60 on 2♥ and 60 on 3♥ (Sum 120) if they feel confident about Low, realizing the penalty is on the *square of the sum*, not the individual squares. (Actually, wait—$1.2^2 = 1.44$, while $0.6^2 + 0.6^2 = 0.72$. The quadratic penalty on the sum *does* punish incoherence if the sum deviates from 100. But it does *not* punish redistribution).
      *   *Correction for your benefit:* The rule penalizes $\sum C(Group)^2$. If they report $C(2)=60, C(3)=60$, the Group Sum is 120. The penalty term includes $120^2$. If they report $C(2)=50, C(3)=50$, Group Sum is 100. Penalty is $100^2$. So **incoherence that changes the group sum is still punished.**
      *   **The Lesson:** The lesson is not that incoherence is free. The lesson is that **precision is free.** They can assign $C(2)=100, C(3)=0$ or $C(2)=0, C(3)=100$ and the score is identical. This breaks the argument that accuracy *requires* a specific coherent distribution.

  ### 4. The Debrief (Mapping Experience to Theory)
  Do not start with definitions. Start with their feelings.

  **Phase 1: Veritism (The Goal)**
  *   *Ask:* "In Block 1, what were you trying to do?"
  *   *They say:* "Get the points." / "Guess the card."
  *   *You say:* "The points were tied to the truth. To maximize points, you had to align your numbers with the world. This is **Veritism**. Accuracy is the sole epistemic good. If the scoring rule hadn't tracked truth, you would have optimized for something else."

  **Phase 2: Propriety (Honesty is Policy)**
  *   *Ask:* "In Block 1, did anyone try to lie? Put 100 on a card you thought was unlikely?"
  *   *They say:* "No, because I'd lose points if it didn't come up."
  *   *You say:* "The rule was designed so that your best strategy was to report your actual belief. In technical terms, the rule is **Proper**. It aligns pragmatic incentive with epistemic state."

  **Phase 3: Strict Propriety (The Gap)**
  *   *Ask:* "What changed in Block 2? Did anyone change how they filled out the 2 and 3 boxes?"
  *   *They say:* "I just put everything on 2." / "I didn't bother splitting them."
  *   *You say:* "Did that hurt your accuracy score?"
  *   *They say:* "No."
  *   *You say:* "So, under the Block 2 rule, is there a *unique* best set of numbers to report?"
  *   *They say:* "No. Many ways work."
  *   *You say:* "Exactly. Block 1 was **Strictly Proper**. Only one report (the truthful, coherent one) maximized score. Block 2 was **Proper but not Strict**. Truth was *among* the best options, but so was 'All on 2, None on 3'.
  *   *The Philosophical Punchline:* "We want to prove that rationality *requires* coherence (Probabilism). We argue that incoherent credences are accuracy-dominated. But as Block 2 showed, if the scoring rule isn't *strictly* proper, accuracy doesn't demand a specific coherent distribution. It allows 'sloshing' probability around inside the groups. To get full Probabilism, we need the stronger assumption: **Strict Propriety**."

  ### 5. What Goes Wrong (And How to Fix It)
  1.  **The Arithmetic Black Hole:**
      *   *Risk:* You spend 15 mins calculating scores. Students check phones.
      *   *Fix:* Have the spreadsheet ready. Assign a student to collect slips and hand them to you while you project the input screen. Input live.
  2.  **The "Sum to 100" Confusion:**
      *   *Risk:* Students think they *must* sum to 100 because it's "probability."
      *   *Fix:* Explicitly say in Round 1: "You can write 100 on all four if you want. The math will punish you, but it's allowed." This lets the dominance argument happen experientially (they see the penalty) rather than normatively (you telling them not to).
  3.  **The Extremizer:**
      *   *Risk:* One student puts 100 on one card every time. They get lucky and win Block 1.
      *   *Fix:* This is actually good. It shows risk. In the debrief, ask them: "Was that strategy stable?" (No, one wrong card ruins you). This introduces **Expected Accuracy** vs. **Actual Accuracy**. The theorem is about expectation; the game shows realization.
  4.  **Pragmatic Contamination:**
      *   *Risk:* Students say "I don't care about chocolate, I care about truth."
      *   *Fix:* Acknowledge this. "The chocolate is a proxy. In the real world, the 'payoff' isn't candy, it's successful action based on belief. But notice: even without candy, you felt the pull of the scoring rule. That's the structure of epistemic utility."

  ### 6. What The Game Cannot Reproduce
  Be honest about these limitations in the debrief so they don't overgeneralize:
  1.  **Dominance vs. Expectation:** The game shows *actual* scores (luck-heavy). The theorem is about *expected* scores (dominance in every world). A student might be incoherent and win by luck. You must explain: "You won the round, but if we played 10,000 rounds, your strategy would lose. The theorem is about the 10,000 round case."
  2.  **The "Why" of Strict Propriety:** The game shows *that* strict propriety matters, not *why* we should assume epistemic value is strictly proper. That remains a philosophical premise.
  3.  **Credence vs. Betting:** Students are reporting numbers, not placing bets. Some philosophers argue credence *just is* betting disposition. The game treats them as separate (report vs. payoff). Keep this distinction clear if it comes up.

  ### Summary Checklist for You
  *   [ ] **Spreadsheet:** Pre-formulaed for Brier Score (Fine) and Group-Brier (Coarse).
  *   [ ] **Cards:** 4 specific cards ready.
  *   [ ] **Slips:** 40 slips (16 students x 2 blocks + spares).
  *   [ ] **Timer:** Keep rounds to 3 minutes max.
  *   [ ] **Script:** Have the Debrief Phase 1-3 bullets on a note card.

  This plan respects the students' intelligence, lets the math speak for itself, and saves the jargon for the moment they are desperate for names to describe what they just felt. Good luck.
