      *   *Sensors:* Lidar noise, occlusion, false positives/negatives.
      *   *Compute:* Latency in decision loops (perception $\to$ planning $\to$ control).
      *   *Action Space:* What can the robot *actually* do? (Brake, swerve, stop, honk).
      *   *Environment:* Sidewalks, crosswalks, dynamic obstacles (kids, dogs, cars).

  4.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. Title, Date, Signatories (generic titles).
      *   **Preamble:** Acknowledge the collaboration, the goal (safe deployment), and the scope (delivery robots, not general AI).
      *   **Section 1: Shared Commitments (The Consensus):** What do they agree on?
          *   Safety is paramount.
          *   Uncertainty is inherent (sensor noise).
          *   Latency matters (physics cannot be ignored).
          *   Transparency is needed.
          *   *Key agreement:* We are not solving the Trolley Problem; we are solving the "Braking Distance under Uncertainty" problem.
      *   **Section 2: Precise Disagreements (The Friction):** How to phrase this so neither feels misrepresented?
          *   Instead of "Utilitarianism vs. Deontology," use "Aggregative Risk Assessment" vs. "Action-Type Constraints."
          *   Focus on how constraints are encoded in the cost function.
      *   **Section 3: Cruxes & Scenarios (The Meat):** This is the most important part.
          *   *Crux 1: Probabilistic Violations.* If there's a 5% chance a "no-go" zone contains a person, do we treat it as a hard constraint or a weighted cost?
          *   *Crux 2: Latency vs. Pre-emption.* Do we stop *before* uncertainty resolves (DCA) or calculate the risk of stopping vs. proceeding (EHM)?
          *   *Crux 3: Action Viability.* What counts as a "possible" action? If swerving hits a lawn (property damage) vs. straight hits a pedestrian (harm).
      *   **Refining the Scenarios:** Make them technical. Use meters, seconds, probabilities.
          *   *Scenario A (The Occluded Driveway):* Robot approaches a blind exit.
          *   *Scenario B (The Sudden Obstacle):* A ball rolls out.
      *   **Section 4: Implementation Protocol:** How do we code this *now* given the disagreement? (e.g., layered architecture).

  5.  **Iterative Polishing (Self-Correction):**
