  I'm a retired materials scientist who recently fell down the philosophy rabbithole, and I keep getting stuck on machine ethics. I'm running a small workshop for eight people over two hours, and I'd like you to draft the joint statement of an adversarial collaboration between an expected-harm minimizer and a deontic-constraints person who are trying to imlement ethical reasoning in autonomous delivery robots. I want it to be about actual implementation -- sensor uncertainty, latency, and what counts as a viable action -- not just trolley cases. Please give the claims both camps could sign, the precise disagreements phrased so each side would accept the wording, the cruxes, and for each crux a concrete scenario both would agree bears on it with each side's prediction written down. Make it sound like a document they could actually sign, not a literature review.
