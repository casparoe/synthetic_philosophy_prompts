      *   **Tone:** Professional, technical, collaborative but honest about disagreement. Not a literature review.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Expected-Harm Minimizer (EHM):** Consequentialist/Utilitarian leaning. Goal: Minimize $\sum (Probability \times Severity)$. Willing to violate rules if the net outcome is better. Struggles with calculation under uncertainty.
      *   **Deontic-Constraints Advocate (DCA):** Duty-based/Rule-based. Goal: Adhere to inviolable constraints (e.g., "Do not strike a pedestrian," "Do not cross double yellow lines"). Struggles with conflicting duties or rigid rules in novel situations.

  3.  **Brainstorming Implementation Details (The "Materials Science" Angle):**
