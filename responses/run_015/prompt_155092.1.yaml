  3.  **(f) vs. GR (implicit in d):** You define inertia via the total angular momentum of all matter (f). In GR, global conserved quantities like total angular momentum are not well-defined in general spacetimes (only in specific symmetric ones). This makes your rule (f) mathematically incompatible with the theory you cite in (d).
