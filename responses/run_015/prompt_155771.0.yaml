      So when you ask whether complexity results give us reason to think some truths are forever out of reach, the answer seems to be yes, but with a nuance. It's not that the truths don't exist or that nature is hiding them maliciously, but rather that the mapping between our cognitive architectures and the causal structures of the world has a bandwidth limit. If the universe computes things in a way that is polynomially inseparable from our attempts to simulate them, then we are stuck with approximations. This doesn't make science futile, but it does humble the realist ambition that we can eventually hold a complete mirror to nature. We might be limited to holding up mirrors that only reflect certain angles clearly while leaving others blurred, not due to a lack of effort, but due to the computational geometry of knowledge itself. Ultimately, distinguishing between what is true and what is tractable forces us to admit that human knowledge is an ecological relation between the mind and the world, not just a passive reception of facts, and that boundary where tractability fails is exactly where explanation dissolves into mere correlation.

