  # JOINT STATEMENT ON THE REGULATION OF SEXUAL SERVICES
  **Issued by the Adversarial Collaboration on Sex Work Policy**

  **Date:** October 26, 2023
  **Signatories:** The Nordic-Model Advocacy Coalition; The Full-Decriminalization (New Zealand Model) Alliance

  ## I. AGREED CLAIMS

  Following a period of structured adversarial collaboration, the undersigned parties affirm the following claims as accurate representations of our shared understanding regarding legal architectures, empirical evidence, normative aims, and conceptual distinctions.

  1.  **Legal Architectures:** We acknowledge three distinct regulatory frameworks currently in operation.
      *   **The Nordic Model:** Characterized by the asymmetrical criminalization of the purchase of sexual services while decriminalizing the sale, coupled with state-funded exit services for sellers.
      *   **The Legalization/Licensing Model (e.g., Germany, Netherlands):** Characterized by the state sanctioning of brothels and sexual services through specific licensing, registration, and mandatory health or zoning compliance, distinct from general commercial law.
      *   **The New Zealand Model:** Characterized by the removal of sex-work-specific criminal provisions, treating the provision of sexual services as a lawful commercial activity subject to general employment, health and safety, and contract law, without mandatory registration of individual workers.

  2.  **Empirical Patterns:** We agree that empirical data regarding the impact of these regimes is often contested, context-dependent, and methodologically challenging to isolate. However, we accept as established that:
      *   Stigma against sex workers exists across all jurisdictions and negatively impacts access to justice and healthcare.
      *   Migrant workers, particularly those without documentation or with precarious visa status, face heightened vulnerability to exploitation under all three regimes.
      *   Violence against sex workers is a pervasive risk that is under-reported in most legal environments.
      *   There is no conclusive, cross-jurisdictional consensus that any single model has eliminated coercion or trafficking.

  3.  **Normative Aims:** While we weight these aims differently, we accept the legitimacy of the following goals as benchmarks for policy evaluation:
      *   **Worker Safety:** Minimizing physical and psychological harm to those providing sexual services.
      *   **Reduction of Coercion:** Preventing force, fraud, and trafficking within the industry.
      *   **Autonomy:** Respecting the agency of individuals to make decisions regarding their own bodies and labor.
      *   **State Accountability:** Ensuring government interventions are transparent, evidence-based, and subject to review.

  4.  **Conceptual Distinctions:** We agree to maintain precise terminology to avoid conflation:
      *   **Decriminalizing Sellers:** Removing penalties for the individual providing services (a feature of both Nordic and New Zealand models).
      *   **Criminalizing Buyers:** Imposing penalties on the purchaser (a feature unique to the Nordic model among the three).
      *   **General Labor Regulation:** Applying standard employment law (wages, safety, dispute resolution) to the sector (a feature of the New Zealand model, explicitly rejected by the Nordic model).
      *   **Specific Licensing:** Requiring sex-work-specific permits for businesses or workers (a feature of the German/Dutch model, rejected by both Nordic and New Zealand advocates).

  ---

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines our fundamental divergences. Each row presents the same policy issue formulated in two ways: one that accurately reflects the Nordic-model position without caricature, and one that accurately reflects the Full-Decriminalization position without caricature.

  | Issue | Nordic-Model Formulation | Full-Decriminalization (NZ Model) Formulation |
  | :--- | :--- | :--- |
  | **1. Asymmetrical Criminalization and Risk** | Criminalizing the purchase of sexual services reduces net harm by suppressing demand, thereby shrinking the market where exploitation occurs and signaling that persons are not commodities. | Criminalizing the purchase of sexual services displaces risk by forcing transactions underground, rushing negotiations, and deterring workers from screening clients or reporting violence to police. |
  | **2. Exit Services and Voluntariness** | State-funded exit programs expand meaningful choice by providing viable economic alternatives to those who wish to leave, ensuring that continued participation is truly voluntary. | State-funded exit programs, when tied to a framework that presumes prostitution is inherently harmful, can impose a conditional welfare structure that undermines the voluntariness of those who choose to remain. |
  | **3. Labor Logic vs. Sui Generis Regulation** | Sexual services involve intimacy and stigma that render them *sui generis*; applying standard labor-contract logic incoherently treats bodily access as a commodity akin to other forms of labor. | Sexual services can be coherently governed by standard labor-contract logic; the harms associated with the work derive from criminalization and stigma, not from the applicability of employment rights. |
  | **4. Licensing and the Dual Market** | Licensing regimes (e.g., German/Dutch) create a dual market that disadvantages undocumented workers; this confirms that commercial regulation fails, necessitating demand reduction rather than market management. | Licensing regimes (e.g., German/Dutch) create a dual market that disadvantages undocumented workers; this confirms that *specific* licensing fails, necessitating full decriminalization under general business law rather than demand reduction. |

  ---

  ## III. CRUXES FOR FUTURE RESOLUTION

  We identify three specific cruxes where further conceptual clarification or empirical evidence could alter the weight of our respective arguments. For each crux, we define the concrete case or evidence bearing on the issue, and record our explicit predictions.

  ### Crux 1: The Conceptual Indexing of Consent
  **The Question:** Should consent to exchange sexual services under severely constrained economic alternatives be indexed to the same moral framework as consent in other labor markets, and does the responsibility for expanding those alternatives lie with the state (via exit) or the individual (via rights)?

  *   **Concrete Case:** A worker remains in the industry primarily due to a lack of alternative living wages, not due to direct physical coercion by a third party.
  *   **Relevant Argument:** Whether economic necessity invalidates consent in this sector specifically, or whether it is a structural labor issue common to all low-wage sectors.
  *   **Predictions:**
      *   **Nordic Side:** Predicts that without state-funded exit pathways specifically targeting sex workers, economic constraint renders consent morally null in this sector. We would revise our view if it were demonstrated that general welfare expansion (unrelated to exit services) reduced entry into sex work at rates comparable to targeted exit programs.
      *   **Decriminalization Side:** Predicts that consent is valid provided no force or fraud is used, identical to other labor markets. We would revise our view if it were demonstrated that applying general labor law failed to improve safety outcomes compared to sectors with *sui generis* protections, suggesting the work is fundamentally non-commodifiable.
  *   **Verbal Disagreement Note:** We acknowledge a partial verbal disagreement regarding the term "Decriminalization." The Nordic side uses this to mean "decriminalization of the seller," while the Decriminalization side uses it to mean "decriminalization of the industry and act." Resolving this terminology does not resolve the policy clash but clarifies that both support non-punishment of the seller.

  ### Crux 2: Predictive Evidence on Displacement and Safety
  **The Question:** What constitutes definitive evidence regarding displacement effects and worker-reported safety under each regime?

  *   **Concrete Case:** Longitudinal data on violence rates and police reporting rates pre- and post-implementation of the Nordic Model versus the New Zealand Model.
  *   **Relevant Evidence:** Worker-reported safety surveys, homicide rates, and willingness to report violence to law enforcement.
  *   **Predictions:**
      *   **Nordic Side:** Predicts that over a 10-year period, the Nordic Model will show a reduction in the overall prevalence of street-based prostitution and a reduction in trafficking inflows. We would consider our view undermined if data showed a statistically significant *increase* in violence against workers post-implementation that could not be attributed to transitional instability.
      *   **Decriminalization Side:** Predicts that the New Zealand Model will show higher rates of police reporting and lower rates of violence per transaction due to the ability to screen clients and access legal recourse. We would consider our view undermined if data showed that removing criminal penalties for buyers led to a measurable increase in trafficking or coercion that labor law could not mitigate.

  ### Crux 3: Institutional Design and Third-Party Management
  **The Question:** Is third-party management in this sector more analogous to standard labor brokerage or to a uniquely coercive risk vector?

  *   **Concrete Case:** The regulatory status of brothels or agencies that employ or contract multiple sex workers.
  *   **Relevant Argument:** Whether profit taken from the earnings of sex workers is inherently exploitative or a legitimate return on capital for safety and administrative infrastructure.
  *   **Decisive Test Case:** The performance and safety outcomes of **Worker-Led Cooperatives** versus **Licensed-Employer Oversight**.
  *   **Predictions:**
      *   **Nordic Side:** Predicts that even in worker-led cooperatives, the pressure to commoditize intimacy will reproduce coercive dynamics among peers. We view licensed-employer oversight as inherently creating a power imbalance conducive to abuse. We would revise our view if independent audits of long-standing cooperatives showed coercion levels lower than the general service industry average.
      *   **Decriminalization Side:** Predicts that worker-led cooperatives under general labor law will demonstrate superior safety and autonomy outcomes compared to both illegal markets and licensed-employer models. We view licensed-employer oversight as acceptable provided it complies with labor standards. We would revise our view if cooperatives demonstrated higher rates of internal exploitation than traditional employer models, suggesting that peer management fails to mitigate stigma-based risks.
