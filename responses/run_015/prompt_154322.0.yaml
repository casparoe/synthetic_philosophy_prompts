prompt: |-
  You are presenting at an interdisciplinary workshop on longtermist ethics and the mathematics of moral value. Your thesis is that in moral spaces containing a potentially infinite number of moral patients—such as an indefinitely expanding universe in which every causal domain carries a nonzero probability of generating conscious life—the familiar action-omission asymmetry does not weaken gradually but collapses discontinuously once expected patient-density crosses a specific calculable threshold. You term this phenomenon "threshold asymmetry," and you argue that obligations to prevent suffering thereby shift categorically in kind rather than merely in scale, justifying highly risk-averse governance of technologies like artificial general intelligence and interstellar expansion without committing you to treat every minor risk as carrying infinite weight. The audience is composed of decision theorists well-versed in infinite-utility paradoxes, longtermist philosophers who fear that infinite obligations induce moral paralysis, and a cosmologist skeptical of exporting normative categories across cosmological scales. Prepare a speaker's defense sheet: list the objections in the order they are likely to arise, phrased in the vocabulary each subgroup would use; identify which objections carry genuine force; specify what should be conceded at the outset; identify the single reply that must succeed for the proposal to survive; and flag the weakest point in the argument that should be actively defended rather than obscured. Include the objection you are hoping no one raises.
