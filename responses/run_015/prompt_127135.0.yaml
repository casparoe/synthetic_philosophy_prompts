answer: |-
  ### The Political Precondition of Care: An Immanent Critique in *Beloved*

  **Theoretical Setup**
  Feminist ethics of care, as articulated by thinkers like Carol Gilligan, Nel Noddings, and Virginia Held, shifts the moral locus from the autonomous agent following impartial rules to the relational subject responding to concrete needs. Its core commitments are: (1) the moral salience of dependency and particular relationships; (2) responsiveness to the cared-for as the primary moral capacity; and (3) a suspicion of abstract justice that ignores the web of connection. In this framework, partiality is not a bias to be overcome but a duty to be honored; the distinction between duty and supererogation collapses because the need of the other *constitutes* the claim.

  *Beloved* does not merely illustrate this theory; it subjects it to an immanent critique. The novel is set within chattel slavery, a system that organizes dependency itself as property. Here, the "moral bedrock" of care ethics—the intimate, dependent relation—is the very mechanism of expropriation. I propose two concepts to track this distortion. **Care Capture** describes a structure where the carer's responsiveness makes the relation more efficient for a third party (the master); the better the mother cares, the more valuable the child as property. **Care Monopolism** describes the defensive reaction to this capture: the carer's insistence that she alone knows what safety requires and that no outside authority is owed an account of her methods.

  The defendable claim is this: *Beloved* demonstrates that care ethics, without a prior political account of power and freedom, is structurally vulnerable to mutating into complicity (Care Capture) or violent isolationism (Care Monopolism). The novel argues that responsiveness is not inherently virtuous; its moral valence depends on the sovereignty of the relationship in which it occurs.

  **Scene-by-Scene Reading**

  **1. Baby Suggs in the Clearing**
  Baby Suggs' preaching represents the care ethical ideal untethered from property relations. In the Clearing, she commands the community to love their flesh—their hands, mouths, hearts—that was not loved by the world. This is the affirmation of the particular body against abstract valuation. However, the scene is spatially marked: it happens in the woods, outside the plantation and outside the house. It is a temporary suspension of the economy of capture. The failure of the Clearing (it stops after the schoolteacher arrives) signals that care as a moral practice cannot sustain itself without a protected political space. It is the ideal of responsiveness, but it lacks the power to secure the conditions under which that responsiveness is free.

  **2. The Killing in the Shed**
  This is the locus of Care Monopolism. When Sethe explains the killing to Paul D, she articulates a logic of pure responsiveness: "I took and put my babies where they'd be safe." In standard care ethics, the mother's knowledge of the child's need is privileged over abstract law. Sethe radicalizes this: the threat of re-enslavement is so total that the only way to meet the need for "safety" is to remove the child from the realm of the living where safety is impossible.
  Here, the novel presses the theory. If the core moral capacity is responsiveness to need, and the need is "not to be owned," Sethe's act is the ultimate care. But the novel shows the cost of this monopolistic logic. By claiming sole authority over the children's fate ("No one was going to nurse it... but me"), Sethe severs the relation from the community. The shed becomes a private sovereignty where the definition of "harm" is determined solely by the carer. Care ethics typically validates this partiality; *Beloved* shows that when the carer is the only buffer against structural violence, partiality becomes a license for destruction.

  **3. Paul D's Judgment: "Your Love is Too Thick"**
  Paul D's intervention is the first external check on Care Monopolism. When he tells Sethe her love is "too thick," he is not invoking impartial justice; he is invoking a limit on relational intensity. He suggests that love which excludes the possibility of a future, or which consumes the beloved, is a defect. From a strict care perspective, Paul D could be dismissed as prioritizing his own comfort over Sethe's desperate commitment. However, the novel treats his judgment as a necessary correction. He represents the claim that care must be answerable to a reality shared with others. If care is not intelligible to the community, it risks becoming madness. This scene suggests that care ethics requires a concept of "proportion" that it usually rejects as cold or rationalist.

  **4. Denver's Enclosure and Exit**
  Denver begins the novel enclosed in 124, the object of Sethe's monopolistic care. She is fed by the past, dependent on a mother whose responsiveness is fixated on a ghost. Denver's decision to leave the yard is the breaking of the dyad. She realizes that her survival depends on engaging the very community her mother rejected. This is not a turn to "justice" over "care"; it is a turn to *collective* care. Denver asks for help not based on rights, but on need. Her exit demonstrates that Care Monopolism is ultimately unsustainable for the cared-for. To be cared for only by one person, in a vacuum, is to starve. The theory often romanticizes the dyad; the novel shows the dyad under pressure becomes a cage.

  **5. The Women Gathering**
  The exorcism of Beloved is performed not by an individual, but by thirty women gathering outside 124. Crucially, they do not come to judge Sethe legally; they come to sing her out. This is care ethics scaled to the community. However, the description is not sentimental. They make a "sound" that is neither prayer nor song, something that breaks the windows. This challenges the care ethical assumption that responsiveness is gentle or nurturing. Here, care is violent; it is the forceful removal of a parasitic need. They intervene not to punish Sethe, but to save her from the excess of her own caring (Beloved). This scene validates the community's earlier withdrawal (see Critique 1) as a strategic pause, not a final abandonment. They return only when the monopolistic loop threatens to consume everyone.

  **6. Beloved's Vanishing and the Ending**
  Beloved disappears, "disremembered and unaccounted for." The novel closes with the insistence that this is "not a story to pass on." This resists the care ethical impulse to integrate trauma into a narrative of healing or moral learning. If care is about sustaining the relationship, the ending admits that some relationships (with the dead, with the trauma of slavery) must be ended for the living to survive. The "work" of care is sometimes the work of forgetting.

  **Where the Reading Fails: Three Worries**

  **1. The Community's Withdrawal**
  A care reading risks condemning the community's initial ostracization of Sethe as a failure of responsiveness. A strict care ethicist might argue they should have surrounded her with support to prevent the isolation that led to the killing. But the novel does not present their withdrawal as a simple moral defect. They withdrew because Sethe's claim ("I did it alone") placed her outside the human economy. To welcome her without judgment would have been to validate the logic that a mother can destroy her child for its own good. The novel suggests there are boundaries of the human that care cannot cross. If care ethics cannot account for *rightful exclusion*, it lacks a mechanism to condemn the very monopolism that endangers the community.

  **2. Beloved as Insatiable Need**
  Beloved returns as the cared-for, but her need is insatiable; she consumes Sethe's body and mind. If responsiveness is the core moral capacity, then Sethe's gradual wasting away is the pinnacle of moral dedication. Yet the novel frames this as a haunting, a possession that must be broken. This forces a question care ethics often dodges: Is there a limit to obligation? The novel suggests that care for the dead (or the traumatic past) has a legitimate limit, and that limit is the life of the carer. Care ethics struggles to define "enough." *Beloved* argues that when care becomes self-annihilation, it ceases to be moral and becomes a ghost story. The theory needs a concept of "rightly withheld care" that is not based on self-interest but on the preservation of the moral agent's capacity to live.

  **3. Sentimentality and Paternalism**
  There is a risk that labeling Sethe's act "care" aestheticizes the violence, turning infanticide into a tragic expression of love. Worse, it risks blurring the line between Sethe's protection and Schoolteacher's paternalism. Schoolteacher also claims to know what is best for the "property"; he also manages their dependencies. If the moral metric is solely "responsiveness to need," the difference between the enslaver and the mother becomes a matter of intensity, not kind. The lens fails if it does not insist that *freedom* is a precondition for care. Schoolteacher's "care" is Care Capture; Sethe's is Care Monopolism. Both are distortions caused by the lack of sovereignty. A care reading that does not center the political status of the participants risks conflating the jailer's management with the prisoner's survival.

  **Contribution to the Debate**
  *Beloved* contributes what abstract argumentation often misses: the *temporal and spatial* dimensions of care under domination. Philosophical debates often treat relationships as voluntary or structurally neutral. Morrison shows that when the background structure is violent, the virtues of care (partiality, responsiveness) become dangerous. The novel forces care ethics to admit that it is not a freestanding morality; it is a secondary system that requires a primary system of justice (freedom from property status) to function morally. It argues that without political sovereignty, the "ethics of care" is merely the "ethics of management" for the oppressed.

  **Handout Recommendation**
  For the seminar, I would distribute two excerpts:
  1.  **Baby Suggs in the Clearing (Chapter 3):** To establish the ideal of care as reclamation of the body.
  2.  **Sethe's explanation to Paul D (Chapter 16):** Specifically the passage where she explains "I took and put my babies where they'd be safe."

  **Reason:** Placing these side-by-side forces students to confront the gap between care as liberation (Clearing) and care as destruction (Shed). It makes the theoretical problem visceral: Why does the same commitment to "loving the flesh" lead to preaching in one scene and killing in the other? The answer lies not in the mother's heart, but in the walls of the house and the laws of the land. This prevents the discussion from settling into psychological analysis and keeps it fixed on the political preconditions of moral theory.
