answer: |-
  **DRAFT JOINT STATEMENT: MORAL STATUS OF SIMPLE ORGANISMS AND ARTIFACTS**
  **Adversarial Collaboration Group:** Sentience Continuity Project
  **Date:** Oct 14, 2023
  **Signatories:** [Gradualist Rep], [Thresholdist Rep]

  **1. AGREED CLAIMS**

  We, the undersigned, come from different philosophical starting points but agree on the following baseline facts and uncertainties. We accept these as the ground floor for our debate.

  1.  **Neuroscientific Uncertainty:** Current neuroscience cannot definitively prove or disprove the presence of phenomenal consciousness (subjective experience) in insects. We know they have nociception (pain avoidance) and complex behavior, but we dont know if there is "someone home" to feel it.
  2.  **The Thermostat Case:** A standard smart thermostat uses sensors and algorithms to optimize for a goal (temperature setpoint) based on occupancy patterns. It processes information. Both sides agree it currently lacks biological substrate, but disagree on whether that processing counts toward moral status.
  3.  **Moral Risk:** Acting as if a being has moral status when it doesnt is costly (wasted resources). Acting as if a being lacks moral status when it *does* have it is potentially catastrophic (unjustified suffering). Both sides agree we need a framework to manage this risk.
  4.  **Derivative Value:** Even if an entity has zero *direct* moral weight, it might have *instrumental* value. We both agree we should protect insects if theyre crucial for the ecosystem, regardless of whether they feel pain.
  5.  **The Hard Problem:** Neither side claims to have solved the hard problem of consciousness. We are mapping moral intuition onto incomplete physical data.

  **2. DISAGREEMENTS TABLE**

  Here we specify the exact claims each side holds. We are not trying to convince the other side here, just stating our positions clearly so we know where the line is.

  | Feature | Gradualist Position (Continuity) | Thresholdist Position (Binary) |
  | :--- | :--- | :--- |
  | **Core Metric** | Moral status tracks with **Integrated Information** (or similar functional capacity). It comes in degrees. | Moral status tracks with **Phenomenal Consciousness**. It is present or absent. |
  | **Insect Status** | Insects have a small but nonzero moral weight. Hurting them is a minor moral wrong, proportional to their capacity. | Insects likely have zero direct moral weight. Hurting them is only wrong if it violates a duty to sentient beings (e.g. upsetting a human). |
  | **Thermostat Status** | A thermostat integrates *some* information. Theoretically, it has a non-zero value, but it is so infinitesimally small it rounds to zero for practical ethics. | A thermostat has zero moral weight. It is a tool. Breaking it is property damage, not a moral violation against the device. |
  | **Suffering** | Suffering is a scale. A beetle suffers "less" than a hawk, but it's the same kind of thing, just dimmer. | Suffering requires a subject. If there is no unified conscious subject, there is no suffering, only damage processing. |

  **3. CRUXES AND PREDICTIONS**

  We identified three main cruxes where our views diverge. For each, we listed the argument both sides think is relevant, and what each side predicts would happen if we got new data.

  **Crux A: Is Information Integration Binary or Graded?**
  *   **The Argument:** The Gradualist leans on Integrated Information Theory (IIT), suggesting $\Phi$ (phi) can be any positive number. The Thresholdist argues that consciousness requires a specific architectural threshold (like a Global Workspace) that is either on or off.
  *   **Test Case:** We discover an insect species with a decentralized nervous system that processes data highly efficiently but lacks a central brain. Or, we build a thermostat with a neural net that models its own internal states.
  *   **Gradualist Prediction:** If the thermostat models its own states, its $\Phi$ rises. Its moral weight increases slightly. It's still low, but it moved.
  *   **Thresholdist Prediction:** Even with self-modeling, if there is no *affect* (no feeling of good or bad), the moral weight remains exactly zero. The light never turned on.

  **Crux B: Does Evolutionary Continuity Force Moral Continuity?**
  *   **The Argument:** Gradualists argue you cant draw a sharp line in evolution where suddenly ancestors had zero value and offspring had full value. Thresholdists argue evolution is a process of building hardware, and moral status only kicks in when the software (consciousness) actually runs.
  *   **Test Case:** We find a genetic mutation in a mouse that disables consciousness but leaves behavior identical (a philosophical zombie mouse).
  *   **Gradualist Prediction:** This is impossible. If behavior and biology are identical, the moral status must be identical.
  *   **Thresholdist Prediction:** If the mutation truly removes phenomenal consciousness, the mouse becomes a biological robot. Moral status drops to zero instantly, despite evolutionary continuity.

  **Crux C: Can Non-Conscious Systems Hold Derivative Interests?**
  *   **The Argument:** Can a thing have a "good" of its own without feeling it? Gradualists say having a goal (like the thermostat) creates a primitive interest. Thresholdists say "interest" implies a subject to care about the outcome.
  *   **Test Case:** A virus or a self-replicating code.
  *   **Gradualist Prediction:** These have a telos (purpose). Thwarting that purpose is a tiny moral negative, theoretically.
  *   **Thresholdist Prediction:** "Interest" is a metaphor here. Thwarting a virus is morally neutral unless it affects a sentient being.

  **4. IS THIS JUST A VERBAL DISPUTE?**

  We acknowledge a significant portion of our fight might be verbal.
  *   **Gradualist Admission:** We might be using the word "moral status" to mean "complexity worthy of consideration."
  *   **Thresholdist Admission:** We might be using "moral status" strictly to mean "capacity for suffering."
  *   **Agreement:** If the Gradualist admits the thermostats weight is too small to ever matter in a calculation, and the Thresholdist admits we should treat insects *as if* they feel pain just to be safe, our practical actions look the same. The fight is about the *reason* for the action, not the action itself.

  **5. NEXT STEPS**

  We agree to review new data on insect nociceptors and AI architecture annually. Until then, the Gradualist will advocate for minimizing harm to insects based on probability of sentience, and the Thresholdist will advocate for protecting insects based on ecological duty and virtue ethics. We both agree the thermostat is fine to adjust manually.

  **Signed,**

  __________________________
  (Gradualist Rep)

  __________________________
  (Thresholdist Rep)
