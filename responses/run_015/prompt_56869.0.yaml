prompt: |-
  I don't have any philosophy training — business degree, and now I run the people-and-ops side of a fully remote company of about 300 — but I've been reading around this stuff on my own for a couple of months because we're about to try to kill a norm I hate. On a flight last week I got through a chapter of one of those pop social-science books a behavioural economist writes, and it spent several pages on a philosopher named David Lewis and his 1969 book *Convention*. I copied down the part that mattered, roughly word for word from my notes:

  "A convention is a stable regularity in how a group behaves that everyone in the group would be better off keeping — driving on the same side of the road, shaking with the right hand, saying your name when you answer the phone. Lewis gave a short list of conditions for when a regularity counts as one: everyone does it, everyone expects everyone else to do it, everyone wants everyone else to do it, and everyone knows all of this and knows that everyone knows it. That last layer is called common knowledge and it's the whole engine of the theory. The other big idea is that conventions are arbitrary — left is as good as right — so there's no principled way to choose between them; whichever one gets going first wins, and after that nobody has any reason to change. Lewis was arguing against people who thought rules had to come from an agreement: he showed that a convention is really just a tacit agreement that's been around so long everyone forgot it was ever made. And because common knowledge does all the work, the practical payoff is enormous — a public announcement from someone credible literally manufactures common knowledge, and a convention along with it. That's also why norms evolve: people copy whoever seems to be doing well. So you change a culture by changing what gets announced, not by training people or appealing to their values."

  Some of that felt too smooth, but I can't tell which parts. My sister, who's a lawyer, said "an email doesn't make a norm, that's ridiculous," but she couldn't say why, and I half want the chapter to be right because it would make my job easy. So: can you go through that passage claim by claim and tell me what someone who actually works on Lewis would accept, what's a fair simplification for a general reader, what's subtly off, and what's just wrong? I'm especially suspicious of four spots — the "tacit agreement everyone forgot" line, the slide from "arbitrary" to "nobody has any reason to change," the idea that an announcement manufactures a convention, and the copying-whoever's-winning bit, which I suspect belongs to a different tradition of thinking about norms entirely and got stapled onto Lewis. I'd also like to know whether the conditions he actually gave are the ones the book lists, since I get the feeling "everyone wants everyone else to do it" is doing a lot of dishonest work. Then tell me whether the practical upshot survives the correction, and run the corrected version on our case: when a customer escalation lands in our shared channel, whoever sees it first quietly tags the most junior support person on shift, and it's now simply expected — the juniors resent it, the seniors don't notice it's happening, and nobody ever decided it. Leadership plans to announce on Monday that escalations belong to the senior on call that week, and they think the announcement plus everyone knowing everyone heard it is the whole job. Does Lewis's framework, properly understood, say that will take? If not, what has to be true for it to take, and is our thing even a Lewis-style convention at all given that some people clearly lose out under the current arrangement? No reading list, please — I can't chase down sources, I just want the audit and what to actually do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Business degree, runs People & Ops for a 300-person fully remote company. No philosophy training but intellectually curious. Pragmatic, focused on solving a specific organizational norm problem.
      *   **The Problem:** A toxic norm exists (junior support staff get dumped with escalations quietly). Leadership wants to fix it via a public announcement (Monday) assuming common knowledge is enough.
      *   **The Input:** A summary of David Lewis's *Convention* (1969) from a pop behavioral economics book.
      *   **The Task:** Audit the summary claim-by-claim (what's accurate, simplified, off, wrong). Address four specific suspicions. Evaluate the practical upshot. Apply the corrected theory to the specific company case. No reading list.
      *   **Tone:** Professional, direct, analytical, practical, respectful of the user's time and intelligence.

  2.  **Deconstruct the Input Summary (Claim-by-Claim Audit):**
      *   *Claim 1: "A convention is a stable regularity... everyone in the group would be better off keeping."*
          *   Lewis: Mostly right, but "better off" is tricky. It's about coordination, not necessarily moral good or Pareto optimality for *everyone* equally. It's a coordination equilibrium.
      *   *Claim 2: "Lewis gave a short list of conditions... everyone does it, expects, wants, knows..."*
          *   Lewis: The "wants" part is the sticky one. It's not "wants" in a vacuum; it's "prefers to conform *if* others conform." This is conditional preference. The summary makes it sound like intrinsic desire.
      *   *Claim 3: "Common knowledge... is the whole engine."*
          *   Lewis: Accurate. This is his big contribution.
      *   *Claim 4: "Conventions are arbitrary... whichever one gets going first wins, and after that nobody has any reason to change."*
          *   Lewis: "Arbitrary" means there was an alternative that *could* have worked (left vs. right). "Nobody has reason to change" is true *given that others aren't changing*. It's a Nash Equilibrium.
      *   *Claim 5: "Tacit agreement that's been around so long everyone forgot it was ever made."*
          *   Lewis: **Wrong/Misleading.** Lewis explicitly argues *against* the idea that conventions require agreement (tacit or explicit). They emerge from iterative expectations, not a forgotten contract.
      *   *Claim 6: "A public announcement... literally manufactures common knowledge, and a convention along with it."*
          *   Lewis: **Oversimplified/Wrong.** Announcement creates common knowledge *of the proposal*, not the convention itself. The convention requires the *behavior* to stabilize. You can announce a law, but if no one follows it, it's not a convention.
      *   *Claim 7: "Norms evolve: people copy whoever seems to be doing well."*
          *   Lewis: **Wrong.** This is evolutionary game theory or cultural evolution (Boyd, Richerson, etc.), not Lewis. Lewis is about rational choice and expectations, not mimetic copying based on success.
      *   *Claim 8: "Change culture by changing what gets announced, not by training or values."*
          *   Lewis: **Dangerous Oversimplification.** Announcement helps coordinate expectations, but if the incentives aren't aligned, the convention won't stick.

  3.  **Address the Four Specific Suspicions:**
      *   *Tacit agreement:* Confirm suspicion. Lewis says conventions *replace* the need for agreement.
      *   *Arbitrary to no reason to change:* Nuance needed. It's a coordination equilibrium. If others switch, you switch. But unilateral switching is costly.
      *   *Announcement manufactures convention:* Confirm suspicion. Announcement creates common knowledge of *intent*, but behavior must follow to become a convention.
      *   *Copying winners:* Confirm suspicion. That's evolutionary theory, not Lewisian rational choice.

  4.  **Evaluate the "Everyone Wants" Condition:**
      *   The summary says "everyone wants everyone else to do it."
      *   Lewis says "everyone prefers to conform *on the condition that* others conform."
      *   *Crucial Distinction:* In the user's case, do seniors *want* juniors to take escalations? Or do seniors just prefer *not* to do them *if* juniors are doing them? The summary implies mutual benefit. The reality might be exploitation. This breaks the Lewisian definition if the juniors are strictly worse off and would prefer a different equilibrium *even if* others conform.

  5.  **Apply to the Company Case:**
      *   *Current State:* Juniors take escalations. Seniors don't.
      *   *Is it a Lewis Convention?*
          *   Regularity? Yes.
          *   Common Knowledge? Maybe not (seniors don't notice).
          *   Coordination Equilibrium? **No.** Juniors are worse off. They would prefer *not* to do it even if others expect them to. This looks more like a *power dynamic* or *exploitation* than a pure coordination convention. Lewis conventions usually solve a "battle of the sexes" or "driving side" problem where *some* equilibrium is better than *none*. Here, the equilibrium is bad for one party.
      *   *The Plan:* Leadership announces "Seniors take escalations."
      *   *Will it work (Lewisian view)?*
          *   Announcement creates common knowledge of the *rule*.
          *   But does it change the *payoffs*? If seniors still find it easier to tag juniors, and juniors feel powerless to refuse, the old convention persists.
          *   Lewis requires that everyone prefers to conform *given others conform*. Seniors might prefer juniors do it. Juniors definitely prefer seniors do it. This is a conflict, not a pure coordination game.
      *   *What needs to be true?*
          *   The payoff structure must change. Seniors must be incentivized (or penalized) so that *their* best response is to take the ticket. Juniors must be empowered to reject without penalty.
          *   Common knowledge is necessary but not sufficient.

  6.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary (The "Bottom Line").
          2.  Claim-by-Claim Audit (The "Truth Table").
          3.  Addressing the Four Suspicions.
          4.  The "Everyone Wants" Condition (The Crucial Fix).
          5.  Application to the Company Case (The Diagnosis & Prescription).
      *   *Tone Check:* Keep it sharp. Avoid academic jargon where possible, but don't dumb it down. The user is smart.
      *   *Key Insight:* The current situation isn't a Lewis convention; it's a power imbalance masquerading as one. The fix requires more than announcement; it requires changing incentives/enforcement.

  7.  **Refining the Lewisian Nuance (Self-Correction during drafting):**
      *   *Wait, does Lewis require everyone to be better off?* Lewis defines convention as a coordination equilibrium. Usually, that implies everyone prefers the equilibrium to non-coordination. But it doesn't necessarily mean the equilibrium is *fair*. However, if one party is actively harmed and would defect if they could, it's not a stable equilibrium in the Lewis sense unless there's coercion.
      *   *Correction:* The key is the *conditional preference*. Do juniors prefer to take the ticket *given that seniors expect them to*? If they resent it, they probably don't. They do it out of fear, not coordination. This means it's not a Lewis convention. It's a norm enforced by power.
      *   *Implication:* Lewis's tool (common knowledge via announcement) works for coordination problems. It works less well for power problems. The leadership needs to treat this as a compliance/incentive issue, not just a coordination issue.

  8.  **Final Polish:** Ensure the advice is actionable. "Don't just announce. Change the workflow permissions. Measure it. Punish violation."

  9.  *(Final check against constraints)*: No reading list. Address the four suspicions. Audit the claims. Apply to the case.

  **(Self-Correction on the "Arbitrary" point):** Lewis says conventions are arbitrary in the sense that another regularity *could* have served the same purpose. But once established, they aren't arbitrary to the participants because switching costs are high. The summary says "nobody has any reason to change." That's only true if no one else changes. I need to make sure that distinction is clear.

  **(Self-Correction on "Tacit Agreement"):** This is the biggest error in the summary. Lewis's whole point is to explain coordination *without* assuming prior agreement. I need to highlight this strongly.

  **(Self-Correction on "Copying Winners"):** Definitely evolutionary game theory (Skyrms, etc.), not Lewis. Lewis is rational choice.

  Okay, ready to write.
answer: |-
  Here is the audit of the text you copied, followed by the diagnosis of your company's situation.

  ### Part 1: The Audit
  Here is the claim-by-claim breakdown of the passage you transcribed. I have categorized each as **Accurate** (faithful to Lewis), **Simplified** (acceptable shorthand), **Misleading** (technically wrong but directionally okay), or **Wrong** (contradicts Lewis).

  | Claim from Text | Verdict | The Reality |
  | :--- | :--- | :--- |
  | **"A convention is a stable regularity... everyone... would be better off keeping."** | **Simplified** | Lewis calls this a *coordination equilibrium*. It's not that everyone is "happy," but that everyone prefers *this* equilibrium to *no* equilibrium. However, it doesn't guarantee fairness. |
  | **"Everyone does it, everyone expects everyone else to do it..."** | **Accurate** | These are the core behavioral and epistemic conditions. |
  | **"...everyone wants everyone else to do it."** | **Misleading** | **Crucial.** Lewis says everyone prefers to conform *on the condition that* others conform. It is a *conditional* preference, not an absolute desire. I might hate driving on the right, but I prefer it *if* you are doing it. |
  | **"...everyone knows all of this and knows that everyone knows it."** | **Accurate** | This is the definition of **Common Knowledge**. This is Lewis's genuine contribution. |
  | **"Conventions are arbitrary... whichever one gets going first wins."** | **Accurate** | "Arbitrary" means there was at least one other alternative that could have worked (e.g., driving on the left). |
  | **"...after that nobody has any reason to change."** | **Misleading** | Nobody has reason to change *unilaterally*. If everyone else switched, you would switch too. It is stable, not immutable. |
  | **"A convention is really just a tacit agreement that's been around so long everyone forgot."** | **Wrong** | **Major Error.** Lewis explicitly argues conventions do *not* require agreement (tacit or explicit). They emerge from iterative expectations, not a forgotten contract. |
  | **"A public announcement... literally manufactures common knowledge, and a convention along with it."** | **Wrong** | Announcement manufactures common knowledge of the *proposal*, not the *convention*. The convention only exists once behavior stabilizes. You can announce a law that everyone ignores; that is not a convention. |
  | **"Norms evolve: people copy whoever seems to be doing well."** | **Wrong** | **Category Error.** This is evolutionary game theory or cultural evolution (e.g., Brian Skyrms, Robert Boyd), not Lewis. Lewis relies on rational choice and expectations, not mimetic copying. |
  | **"Change culture by changing what gets announced, not by training... or values."** | **Misleading** | Announcement solves the *coordination* problem (knowing what to do). It does not solve the *incentive* problem (wanting to do it). |

  ### Part 2: Addressing Your Four Suspicions

  You have good instincts. Here is the verdict on your specific doubts:

  1.  **"Tacit agreement everyone forgot":** **You are right to be suspicious.** This is the opposite of Lewis's argument. Lewis wanted to show how order arises *without* agreement. If you treat it as a forgotten agreement, you assume people once consented. In your company, the juniors never consented. Treating it as a "forgotten agreement" validates the seniors' behavior as legitimate history rather than what it likely is: drift.
  2.  **"Arbitrary to nobody has reason to change":** **Subtly off.** It creates a *Nash Equilibrium*. Nobody has reason to change *alone*. But if the whole group shifts, everyone has reason to shift. This means conventions *can* be changed, but it requires moving the whole group simultaneously (which is where common knowledge helps).
  3.  **"Announcement manufactures a convention":** **Wrong.** Announcement manufactures *common knowledge of the intent*. It removes the "I didn't know we were changing" excuse. But if the underlying incentives remain (e.g., seniors still save time by dumping work on juniors), the convention will not stick. The announcement is the spark, not the fuel.
  4.  **"Copying whoever seems to be doing well":** **You are correct.** This is evolutionary theory stapled onto rational choice theory. Lewis assumes agents are reasoning about expectations ("I think that you think that I will..."), not blindly copying success. In a corporate hierarchy, juniors aren't copying seniors because seniors are "doing well"; they are complying because of power dynamics.

  ### Part 3: The "Everyone Wants" Condition
  This is the most dangerous simplification in the text you read.

  Lewis requires a **conditional preference**: "I prefer to do X *if* I expect you to do X."
  The summary implies an **unconditional preference**: "I want you to do X."

  In your company:
  *   **Seniors:** Prefer juniors to take escalations (unconditionally).
  *   **Juniors:** Prefer seniors to take escalations (unconditionally).
  *   **Current State:** Juniors take them *because* they expect seniors to assign them, and they fear the cost of refusal.

  This is **not** a Lewisian convention. A Lewisian convention solves a coordination problem where everyone loses if coordination fails (e.g., we both crash if we drive on different sides). In your case, the seniors *win* under the current norm, and the juniors *lose*. This is not a coordination equilibrium; it is an **exploitation equilibrium**.

  ### Part 4: Will the Monday Announcement Work?

  **Short Answer:** No. Not if it is just an announcement.

  **Lewisian Diagnosis:**
  For a Lewisian convention to hold, two things must be true:
  1.  **Common Knowledge:** Everyone must know the new rule, know others know it, etc. (The announcement achieves this).
  2.  **Aligned Incentives (Conditional Preference):** Everyone must prefer to follow the new rule *given that others are following it*.

  **The Problem:**
  Currently, the seniors have no incentive to follow the new rule. If the announcement says "Seniors take escalations," but the system still allows them to tag juniors, and there is no penalty for tagging juniors, the seniors' conditional preference remains: "I prefer to tag the junior *if* I can get away with it."

  The juniors' conditional preference is: "I prefer to reject this *if* I know leadership will back me." An announcement does not guarantee backup.

  Because the current norm benefits one group at the expense of the other, it is not a "pure coordination game." It is a conflict of interest disguised as a habit. Lewis's framework explains how we coordinate on *which* side of the road to drive; it is less effective at explaining how to stop the big trucks from bullying the small cars off the road.

  **What Has to Be True for It to Take:**
  To make this stick, you must convert the situation from a power struggle into a coordination game. You need to change the payoffs so that the "Senior takes escalation" behavior becomes the rational equilibrium for the seniors.

  1.  **Make the Old Path Harder (Friction):** You cannot rely on seniors *choosing* not to tag juniors. You must remove the ability to tag juniors in the ticketing software for escalations. If they physically cannot assign it to a junior, the convention shifts instantly.
  2.  **Make the Violation Visible (Common Knowledge of Deviance):** If a senior finds a workaround, it must be visible to leadership. If a junior is tagged, they must have a safe, frictionless way to flag it (e.g., a "Wrong Assignment" button that alerts Ops).
  3.  **Ensure the Junior's Safety (Conditional Preference):** Juniors must know that rejecting the ticket will not result in retaliation. The announcement must include the enforcement mechanism: "If you are tagged incorrectly, return it. We will handle the rest."

  ### Part 5: Actionable Recommendation

  Your leadership's plan relies on the pop-science version of Lewis (announcement = common knowledge = change). That works for "We are switching to Slack from Teams." It does not work for "Seniors must do the work they were previously avoiding."

  **Do this instead:**

  1.  **The Announcement (Common Knowledge):** Send the email. Make it clear this is a coordination shift. "Effective Monday, Escalations are owned by Senior On-Call."
  2.  **The Mechanism (Incentives):** Do not rely on willpower. Work with Engineering/Tools to restrict permissions. Juniors should not be assignable for escalation tickets. If it requires a manual override, log that override.
  3.  **The Safety Valve (Enforcement):** Tell the juniors privately: "If you get tagged, do not do the work. Reply on the ticket '@Ops this looks like an escalation' and stop working." Then, publicly (in the channel), praise the first junior who does this and correct the senior immediately. This creates common knowledge that the *old* convention is dead.
  4.  **The Audit:** For the first two weeks, measure the rate of mis-tagged tickets. If it's not zero, the convention hasn't shifted.

  **Summary:** The text you read is half right about *how* conventions stabilize (common knowledge), but wrong about *why* they exist (agreement) and how they change (announcement alone). Your problem isn't a lack of common knowledge; it's a misalignment of incentives. Fix the incentives, *then* use the announcement to coordinate the timing.
