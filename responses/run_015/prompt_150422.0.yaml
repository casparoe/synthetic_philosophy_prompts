answer: |-
  This configuration does not have a single, canonical noun in the cultural-evolution literature that captures the entire chain you describe. Instead, it is a composite phenomenon recognized at the intersection of three distinct theoretical areas: **transmission fidelity**, **causal opacity**, and **path dependence**.

  In the Darwinian tradition, this is usually discussed as a failure mode of **cumulative cultural evolution**. The specific mechanism you have identified—the systematic pruning of causally opaque steps when channel bandwidth narrows—is best understood as a shift from **high-fidelity imitation** to **rationalizing emulation**.

  Here is the carve you asked for: what the thing is, what it is not, where its edges lie, and how to distinguish it from its neighbors.

  ### 1. The Core Mechanism: Imitation vs. Emulation
  To understand why this happens, you must distinguish between two ways learners acquire a practice.
  *   **Imitation:** Copying the actions of the model, regardless of whether the learner understands the purpose of each action. This preserves "invisible" steps.
  *   **Emulation:** Copying the goal or outcome, and reconstructing the actions needed to get there based on the learner's own understanding of causality.

  Your phenomenon occurs when a transmission channel becomes too narrow to support **Imitation**.
  *   **Thick Channel (Apprenticeship):** Allows for imitation. The learner copies the "slow steps" and "qualifications" because they are told to, or because they see the master doing them, even if the reason isn't obvious.
  *   **Thin Channel (Card/Video/Short Course):** Forces emulation. The learner receives the "visible core" (the goal and the main actions) but lacks the context to understand the "hidden qualifications." Because the learner is rational, they attempt to reconstruct the practice to make sense. Steps that lack immediate, visible justification (the cold rest, the exception clause, the season-long training) are interpreted as noise or inefficiency and are pruned.

  This is not random drift. It is **directional selection for intelligibility**. The variant that survives is not the one that works best; it is the one that makes the most sense to a learner with limited data.

  ### 2. The Lock-In: Loss of Diagnostic Feedback
  You noted that the degraded version "destroys the feedback that would have revealed the loss." This is the second half of the carve.
  In cultural evolution, practices are usually selected by their **payoff**. If a fishing rule fails, people should stop using it. However, in your cases, the payoff is **delayed** or **comparative**.
  *   **Bread:** The failure is not "no rise"; it is "less flavor than a loaf you aren't baking."
  *   **Fishing:** The failure is not "no fish"; it is "fewer fish than the birds would have predicted, attributed to weather."
  *   **Rope:** The failure is not "breaks under normal load"; it is "breaks under conditions no one tests."

  When the "intact" version disappears, the **baseline for comparison disappears**. The degraded practice becomes the new standard. Because the failure mode is now invisible (or indistinguishable from background noise), there is no selection pressure to restore the lost steps. This creates **Path Dependence**: the system locks into the inferior state not because it is preferred, but because the error signal required to correct it has been severed.

  ### 3. What It Is Not (The Boundaries)
  To ensure you are looking at this specific phenomenon and not a neighbor, apply these exclusion criteria:

  *   **It is not the "Tasmanian Effect."**
      *   *The Tasmanian Effect* describes the loss of complex skills when population size drops (not enough models to maintain fidelity).
      *   *Your Case:* Population size and contact are unchanged. The loss is driven by the **width of the channel**, not the size of the pool.
  *   **It is not "Normalization of Deviance" (Safety Science).**
      *   *Normalization of Deviance* describes organizations accepting small risks until disaster occurs.
      *   *Your Case:* This is close, but Normalization usually implies an active decision to accept risk. In your cases, nobody decides to lower the standard; they genuinely believe the shortened version *is* the standard. The deviation is invisible to them.
  *   **It is not "Story Distortion" (Serial Reproduction).**
      *   *Story Distortion* (the "telephone game") is often random or driven by cognitive schemas (making a story more coherent).
      *   *Your Case:* The distortion is **functional**. It specifically targets steps with **delayed payoffs** or **opaque causality**. A story distortion might change the color of the boat; your phenomenon removes the step that keeps the boat from sinking.
  *   **It is not "Economic Optimization."**
      *   If the bakers dropped the long rest because fuel became too expensive, that is economic selection.
      *   *Your Case:* The cost (time/effort) hasn't changed relative to the reward. The change is purely in the **transmission medium**.

  ### 4. Prototype vs. Channel: Distinguishing the Driver
  You asked whether the variant is pulled toward a mental prototype or squeezed by the channel. The answer is: **The channel squeeze forces reliance on the prototype.**

  *   **Hypothesis A (Prototype):** Humans have a cognitive bias toward simple, unqualified rules. Even with a thick channel, they would eventually drop the exception clause because it feels "wrong."
  *   **Hypothesis B (Channel):** Humans will keep the "wrong" feeling step if the channel allows them to see the *consequence* of dropping it.

  **The Observation to Distinguish Them:**
  Restore the thick channel (e.g., a long apprenticeship) but **do not** provide the "comparison loaf" (the diagnostic feedback).
  *   If the lost steps return, the driver was **Channel Capacity** (they needed time to copy the action).
  *   If the lost steps do *not* return (because the master themselves has forgotten the reason for the step), the driver was **Information Loss**.
  *   If the lost steps do not return even if the master knows them, because the apprentice asks "Why?" and the master cannot answer (the causal link is broken), the driver is **Rationalization**.

  In your examples, it is the **Channel** that initiates the loss, but **Rationalization** that cements it. The learner thinks, "This step does nothing I can see; I will remove it to make the rule cleaner." The channel prevents them from seeing that the step *does* do something, just not immediately.

  ### 5. Proposed Definition and Term
  Since no single term exists, if you need to label this for your own work, the most precise description is **Opacity-Pruning under Fidelity Constraints**.

  **Definition:** A mode of cultural degradation where practices containing causally opaque or delayed-payoff components are systematically simplified during transmission. This occurs when channel bandwidth is insufficient to support high-fidelity imitation, forcing learners to reconstruct the practice via emulation. The resulting variant is more intelligible and transmissible but functionally inferior. The degradation becomes permanent when the loss of the original variant removes the diagnostic baseline required to detect the functional decline.

  ### 6. Boundary Cases
  You asked where the edges lie. Here is how to judge edge cases:

  *   **Purely Expressive Practices (e.g., a dance or song):**
      *   If steps are dropped and nothing "functional" is lost, this is **Stylization**, not your phenomenon. Your phenomenon requires a **hidden function** that is lost. If the practice is *only* the visible core, there is nothing to prune.
  *   **Single Expert Restoration:**
      *   If an expert restores the missing material and it holds, but re-drops within a generation, this **confirms** your model. It proves the loss is not due to the content being "bad," but due to the **transmission system** being unable to sustain the complexity. This is a hallmark of **Fidelity-Constrained** loss.
  *   **Channel Thickened, Loss Fails to Reverse:**
      *   If you return to long apprenticeships but the short version persists, this indicates **Cultural Lock-In**. The practice has become a **Badge of Identity** ("We are the people who do it the quick way") or the **Diagnostic Feedback** is permanently gone (no one remembers the old bread). At this point, it ceases to be a transmission error and becomes a **stable cultural trait**.

  ### 7. How You Might Have Misdescribed It
  You should doubt this diagnosis if you find evidence of the following:

  1.  **Active Resistance:** If the learners *know* the long version exists and *choose* the short version despite knowing it is worse (e.g., to save time), this is **Economic Selection**, not transmission decay. Your model requires the learners to believe the short version is *equivalent*.
  2.  **Immediate Failure:** If the shortened practice fails immediately and obviously (the bread doesn't rise, the rope snaps on day one), selection pressure should kill it quickly. Your model relies on the failure being **latent** or **attributable to noise**. If the failure is loud, the mechanism is different.
  3.  **Population Fragmentation:** If the community splits into isolated groups and the skill is lost in one but kept in the other, this is **Drift** or the **Tasmanian Effect**. Your model requires the "better" version to be *available* but *ignored* or *unintelligible* within the same population.

  ### Summary
  You have identified a specific failure mode of **Cumulative Cultural Evolution**. It is not merely "things get worse." It is a specific structural vulnerability: **Practices that rely on invisible constraints cannot survive a shift from Imitation to Emulation.**

  The literature handles the pieces: **Causal Opacity** (why the steps are invisible), **Transmission Fidelity** (why the channel matters), and **Path Dependence** (why it doesn't revert). But the synthesis you have made—linking the channel width directly to the pruning of opaque steps and the subsequent loss of diagnostic feedback—is a precise description of a mechanism that often goes unnamed. It is the **erosion of complexity through intelligibility.**
