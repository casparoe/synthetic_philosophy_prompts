  ### The Aubry Laws and the Economic Possibilities for Our Grandchildren: A Case Study in Competitive Divergence

  John Maynard Keynes's 1930 essay *Economic Possibilities for our Grandchildren* posits that technological progress would eventually solve the "economic problem" of scarcity, allowing humanity to work as little as fifteen hours a week. The central challenge, he argued, would not be production, but the psychological adjustment to a life of leisure. The French Aubry laws (1998–2000), which mandated a reduction of the legal workweek from 39 to 35 hours, offer a potent real-world stress test for this vision. While the Aubry laws were primarily motivated by work-sharing to combat unemployment rather than post-scarcity abundance, their implementation and subsequent erosion illuminate the tension between Keynesian leisure and global competitive reality.

  #### Absolute vs. Relative Needs: Mapping the Political Debate

  Keynes distinguished between *absolute needs* (those independent of the position of others, such as basic comfort and security) and *relative needs* (those driven by the desire for superiority and status). He predicted that as absolute needs were met, relative needs would dominate, potentially trapping society in endless work.

  The political debate surrounding the Aubry laws maps cleanly onto this dichotomy. Proponents of the 35-hour week, primarily the Socialist government and labor unions, framed the legislation as a liberation of time for "absolute" human flourishing. They argued that reduced hours would allow citizens to engage in culture, family life, and rest—essentially attempting to legislate the Keynesian transition to leisure. In this view, productivity gains had been sufficient to sustain output with less labor, and the surplus should be distributed as time rather than income.

  Conversely, opponents—business leaders, conservative politicians, and economic liberals—framed the measure through the lens of *relative needs*, though expressed as national competitiveness. They argued that in a globalized market, French labor costs per unit of output would rise relative to competitors (Germany, the US, emerging Asian markets). To them, the workweek was not a vessel for leisure but a metric of competitive standing. Their opposition validated Keynes's fear: even if the technical capacity for leisure exists, the psychological and structural drive to maintain relative advantage prevents its realization. The debate was not merely about profit margins; it was about the fear that France would lose status in the hierarchy of nations if it unilaterally adopted leisure.

  #### The 2000s Relaxation: The Trap of Accumulation

  Keynes warned that the "love of money" would persist as a habit long after it was economically necessary. The evolution of French labor law in the 2000s illustrates this entrapment. Following the initial implementation of the Aubry laws, subsequent reforms (notably the Fillon law of 2003 and the 2008 laws on work time flexibility) systematically eroded the rigidity of the 35-hour limit. These reforms introduced overtime exemptions, annualized hours, and flexibility measures designed to boost purchasing power and corporate competitiveness.

  This trajectory confirms Keynes's psychological diagnosis. Despite the technical feasibility of the 35-hour week, the societal preference shifted back toward accumulation. Workers often opted for overtime pay to increase consumption rather than taking additional leisure, and the state prioritized GDP growth and export balances over time sovereignty. This suggests that solving the technical economic problem (productivity) does not automatically solve the behavioral economic problem (the desire for more). The French retreat from the strictures of the Aubry laws demonstrates that without a cultural shift away from status competition, legislative mandates for leisure are vulnerable to the persistent habit of accumulation.

  #### Theory Silences: Employer Power and Global Dynamics

  While Keynes's psychological insights remain sharp, the Aubry episode reveals significant silences in his 1930 model.

  1.  **Employer Backlash and Power Dynamics:** Keynes assumed a somewhat harmonious transition where capital would accept lower returns or automation would simply reduce labor demand. He did not anticipate the organized political resistance of capital. The Aubry laws faced relentless lobbying, capital flight threats, and legal challenges from employer federations (MEDEF). Keynes's model lacks a theory of class power; it assumes that once productivity allows leisure, the decision to take it is straightforward. The French case shows that the distribution of productivity gains (time vs. profit) is a site of intense conflict.
  2.  **Cross-Border Competitive Dynamics:** Keynes wrote from the perspective of a major imperial economy, largely assuming a closed or managed system. He did not fully model the hyper-globalized capital markets of the late 20th century. In a world of mobile capital, a unilateral reduction in work hours can be punished by investment strikes or currency speculation. Keynes's vision was individualistic and national; it did not account for the disciplinary power of global bond markets and supply chains that enforce labor discipline across borders.
  3.  **Cultural Refusal:** Keynes assumed people would naturally struggle with boredom but would ultimately prefer leisure. The French experience showed a significant segment of the workforce preferring overtime pay to maintain high-consumption lifestyles. This consumerist feedback loop—where higher productivity fuels higher consumption expectations rather than less work—was underestimated by Keynes.

  #### The Competitive Divergence Problem

  The Aubry episode reveals what can be termed a **competitive divergence problem**. In Keynes's framework, productivity gains are a national or individual windfall that can be converted into leisure. However, in a globalized system, productivity gains are also a lever for international market share.

  Nations face a divergence: they can convert productivity into domestic leisure (Keynesian path) or into lower prices/higher wages to capture global market share (Neoclassical/Globalist path). If Nation A chooses leisure and Nation B chooses accumulation, Nation B may gain capital and political influence at Nation A's expense. The Aubry laws attempted the Keynesian path, but the subsequent reforms were a correction toward the Globalist path to prevent relative decline.

  Keynes's individualist framework fails to address this game-theoretic dilemma. He viewed the economic problem as man against nature (scarcity), not man against man (status and market share). The competitive divergence problem suggests that as long as nations compete for relative standing, there is a structural ceiling on how much leisure can be adopted unilaterally. The "15-hour civilization" requires not just national productivity, but coordinated international labor standards to prevent a race to the bottom. Keynes's silence on the geopolitical necessity of synchronized leisure adoption is a critical theoretical gap exposed by the French experience.

