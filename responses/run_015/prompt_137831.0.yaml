answer: |-
  **Definitions**
  *   **Phenomenal-Realist:** Holds that consciousness reports track genuine, irreducible properties.
  *   **Illusionist:** Holds that consciousness reports are mistaken; no phenomenal residue exists.
  *   **Quietist:** Holds that the hard problem is a linguistic confusion to be dissolved.

  **Desiderata for Meta-Problem Solutions**

  1.  **Specificity**
      *   **Case:** A solution must explain the particular inferences we draw, not merely that reports occur. Vague appeals to 'complexity' fail to capture why we infer a metaphysical gap.
      *   **Status:** Non-negotiable.

  2.  **Asymmetry**
      *   **Case:** Accounts must explain why gap reports are robust in the first-person case but often withheld in the third-person case, alongside individual variance (e.g., those who deny the gap).
      *   **Status:** Non-negotiable.

  3.  **Retention**
      *   **Case:** Distinguish the mechanism producing the report from what retains it after explanation. Like the Müller-Lyer illusion, knowing the trick does not always dissolve the appearance.
      *   **Status:** Non-negotiable.

  4.  **Predictivity**
      *   **Case:** Must pronounce on the stipulated vocab-less population. Does the solution predict they produce no gap reports, or that they would produce them upon prompting? Silence is inadequate.
      *   **Status:** Non-negotiable.

  5.  **Self-Application**
      *   **Case:** If the solution debunks gap reports, it must not debunk the reports constituting its own data. It must explain why the theorist's own introspection is privileged or similarly flawed.
      *   **Status:** Non-negotiable.

  6.  **Neutrality**
      *   **Case:** The solution should be acceptable to both realists and illusionists as a common premise. However, if the purpose is evidential, true neutrality may be impossible.
      *   **Status:** Negotiable (Camp-Relative).

  7.  **Falsifiability**
      *   **Case:** A solution must specify empirical or conceptual conditions under which it would fail. Unfalsifiable models are compatible with any outcome and thus explain nothing.
      *   **Status:** Non-negotiable.

  **Incompatibility and Exclusion**

  The pair **Neutrality** and **Self-Application** cannot be jointly satisfied. A neutral account treats all gap reports as uniform data to be explained without prejudice. However, strict self-application forces a distinction between reliable and unreliable reports to avoid self-defeat. If the mechanism explains away gap reports generally, it explains away the theorist's report too (illusionism). If it vindicates the theorist's report, it must vindicate similar reports generally (realism). One cannot remain neutral while resolving the self-referential loop. Consequently, **Neutrality** is rejected as a desideratum for a solution intended to serve as evidence; the solution must take a stand to function as a premise.

  The single requirement that excludes the most candidate solutions is **Self-Application**. Naive illusionism fails because it debunks the very introspective data required to formulate the theory. Dogmatic realism fails because it assumes the veracity of introspection without explaining why that specific instance escapes the error mechanism affecting others. Only a model that carefully delineates the scope of introspective error survives.

  **Scorecard Against Candidate Families**

  | Family | Performance on Key Desiderata | Verdict |
  | :--- | :--- | :--- |
  | **Illusionist** | Explains Asymmetry well; fails Self-Application by undermining own evidence. | High risk of self-defeat. |
  | **Phenomenal-Realist** | Satisfies Self-Application; fails Neutrality and often Predictivity (cannot explain silence). | Commits to first-order claim early. |
  | **Quietist** | Satisfies Neutrality; fails Specificity by dissolving the content rather than explaining it. | Avoids the dispute rather than solving it. |

  \answer{Self-Application}
