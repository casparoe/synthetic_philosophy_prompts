  ### Brainstorming and Preliminary Sketches

  **Major Scenes Involving Bodily Makeup and Assembly:**

  1.  **The Charner House and Dissecting Rooms (Ingolstadt):** Victor gathers materials.
      *   *Metaphysical Bearing:* Victor treats body parts as interchangeable units (universalist aggregation). He assumes composition is trivial if the material is sufficient.
  2.  **The Moment of Animation (Laboratory):** The 'spark' enters the dull yellow eye.
      *   *Metaphysical Bearing:* The transition from scattered matter to a living whole. Does life create the object, or did the object exist waiting for life?
  3.  **The Creature's Awakening and Victor's Flight:** Victor sees the beauty of the parts become a horror in the whole.
      *   *Metaphysical Bearing:* The aesthetic and moral failure of the composition. The 'Problem of the Many' lurks here: is the horror in the one being or the multitude of dead selves subsumed?
  4.  **The Creature's Observation of the De Laceys:** The Creature observes family unity while hiding in the hovel.
      *   *Metaphysical Bearing:* Social mereology. The family acts as a functional unit. The Creature desires to be a part of this whole, yet his own physical wholeness is rejected.
  5.  **The Destruction of the Female Creature:** Victor tears apart the second assembly.
      *   *Metaphysical Bearing:* Victor acts as a nihilist here, refusing to allow a second composite to exist, reducing the parts back to scattered matter.
  6.  **The Arctic Confrontation:** The Creature mourns over Victor's corpse.
      *   *Metaphysical Bearing:* The dissolution of the creator-creation bond. The Creature intends to cease his own life, ending the composite existence voluntarily.

  **Sketching the Debates:**

  *   **Universalism:** If Victor is a universalist, he believes that any arrangement of bones and flesh constitutes an object. The horror arises because he realises that *any* arrangement counts, even grotesque ones.
  *   **Nihilism:** If Victor leans towards nihilism, he believes only the simples (atoms) exist. The Creature is merely 'particles arranged monster-wise'. Victor's guilt is irrational because he didn't create a 'being', only rearranged matter.
  *   **Restricted Organicism:** Composition occurs only when parts participate in a life. The Creature is the boundary case: made of dead parts, yet lives. Does the life retroactively justify the composition?
  *   **Problem of the Many:** Since the Creature is composed of vague biological boundaries (shedding skin, growing hair), there are countless overlapping candidates for 'the Creature'. Victor may have unleashed a cloud of entities, not one.

  ***

  ### The Stitched Whole: Mereology and Monstrosity in *Frankenstein*

  Mary Shelley's *Frankenstein* is frequently read as a cautionary tale regarding scientific hubris or parental neglect. However, viewed through the lens of contemporary metaphysics, specifically the Special Composition Question (SCQ), the novel emerges as a profound investigation into the conditions under which parts constitute a whole. The SCQ asks: under what circumstances do some objects compose a further object? The dominant answers are **Universalism** (any plurality composes a whole), **Nihilism** (no composites exist, only simples), and **Restricted Organicism** (composition occurs only when the activities of the parts constitute a life). Shelley's Creature serves as a potent boundary case for Restricted Organicism, whilst simultaneously inviting the 'Problem of the Many' to haunt the narrative. By analysing Victor Frankenstein's implicit metaphysical commitments and the Creature's struggle for ontological stability, we can see how Shelley dramatises the ethical weight of composition itself.

  #### Victor's Implicit Metaphysics: Between Universalism and Nihilism

  Victor Frankenstein operates with a conflicted ontology. In practice, during the construction phase in Ingolstadt, Victor behaves as an implicit **Universalist**. He raids charnel houses and dissecting rooms, treating human remains as interchangeable inventory. He assumes that if he arranges the parts correctly—bone to bone, sinew to sinew—a unified being will necessarily emerge. He acts upon the premise that composition is automatic given the right spatial arrangement; the parts *must* compose a whole because he intends them to. There is no hesitation in his mind that these disparate limbs, sourced from different graves, might fail to constitute a single entity. He believes the unity of the object is guaranteed by the architect's design.

  However, upon the moment of animation, Victor's stance shifts precipitously towards **Nihilism**. When the creature opens its dull yellow eye, Victor does not see a unified man; he sees a catastrophe of parts. He describes the beauty of his dreams vanishing as he beholds the "demoniacal corpse" to which he had "imparted the spark of life". In his horror, Victor effectively denies the unity of the being. He flees, treating the Creature not as a genuine composite object with moral standing, but as scattered matter arranged in a repulsive fashion. He wishes to undo the composition, to return the parts to their scattered state. This oscillation reveals Victor's metaphysical error: he assumed Universalism during construction (any parts will do) but found himself unable to accept the resulting composite, wishing instead that only the simples (the dead matter) were real. He created a whole but refused to acknowledge its ontological status, treating the Creature as a mere aggregation of dead tissue rather than a living organism.

  #### The Creature's Self-Conception and the Organicist Claim

  The Creature, conversely, argues for his own existence through the lens of **Restricted Organicism**. According to philosophers like Peter van Inwagen, composition occurs when the activity of the parts constitutes a life. The Creature eats, sleeps, feels pain, learns, and grows. Despite his heterogenous origins—stitched from the dead—he functions as a biological unity. His self-conception is firmly rooted in this functional integration. He tells Victor, "I ought to be thy Adam, but I am rather the fallen angel." This assertion claims a singular identity, a unified self that persists through time.

  However, the Creature's demand for a companion highlights the tension between mechanical assembly and biological unity. He argues that because he is a living being, he deserves a counterpart. Yet, when Victor attempts to construct a female, he is plagued by the fear that she might not remain a unified organic whole but could become a繁殖 (breeding) source for a race of monsters. Victor's destruction of the female creature is a nihilistic act; he tears the assembled parts apart before life can bind them, denying the possibility of a second organic composite.

  Here, the **Problem of the Many** presses upon the Creature's body. If the Creature is a composite object defined by biological life, where exactly are his boundaries? Every time he sheds a skin cell or grows a hair, the collection of atoms constituting 'the Creature' changes. If composition is vague, there are countless overlapping candidates for being the Creature (the Creature minus one hair, the Creature plus a dust mote). When Victor animated the body, did he create one monster or a cloud of overlapping entities? The Creature's misery is compounded by this ontological instability. He is a 'miserable monster' not just socially, but metaphysically; he is a patchwork universal sum that claims organic unity in a world that recognises only natural birth as the validator of wholeness. His self-description as a "blight upon the earth" acknowledges that his composition is unnatural, yet his lived experience confirms he is a genuine whole.

  #### Scenes of Composition and Resistance

  Three specific scenes illuminate this framework whilst demonstrating where the novel resists reduction to philosophical illustration.

  **1. The Laboratory Construction:**
  In the solitude of his chamber, Victor works with "bones from charnel houses". Philosophically, this is the testing of Universalism: can any parts compose a life? The narrative illuminates the horror of this view. If any parts can compose a person, then personhood is cheap, and the sanctity of the natural body is dissolved. However, the novel resists a clean metaphysical reading here because Victor's success is not merely mechanical; it requires the "spark". Shelley suggests that composition is not just about arrangement (Universalism) nor just about life (Organicism), but about a mysterious synthesis that carries moral weight. The horror is not just that the parts are dead, but that the resulting whole is *too* unified—it speaks, it demands. The text refuses to let the Creature remain a mere automaton.

  **2. Observation of the De Lacey Family:**
  Watching the family from the hovel, the Creature observes a social mereology. The De Laceys function as a unit; their individual lives are interwoven. The Creature desires to be a part of this composite. This scene highlights the Organicist claim that genuine wholes require functional integration. The De Laceys are a natural organic social unit; the Creature is an artificial biological unit. The tragedy lies in the mismatch: the Creature possesses biological unity (he is one organism) but is denied social composition (he cannot be part of the family). The novel resists the philosophical framework here by prioritising empathy over ontology. The De Laceys reject him not because he fails the SCQ (he clearly lives), but because his aesthetic composition violates their sensibilities. Metaphysics yields to phenomenology; how the whole *looks* matters more than how it *functions*.

  **3. The Arctic Confrontation:**
  On Walton's ship, over Victor's corpse, the Creature declares his intention to burn himself on a funeral pyre. "I shall ascend my funeral pile triumphantly... and exult in the agony of the torturing flames." This is the ultimate act of mereological control. Having been composed against his will, he chooses to decompose himself. He resolves the Problem of the Many by ensuring no overlapping candidates remain; he will reduce himself to simples (ash). This scene illuminates the moral agency required of composite objects. Yet, the narrative resists a tidy conclusion. Walton witnesses the Creature sweep away over the body, borne by waves and darkness. The dissolution is not absolute; the story remains. The 'whole' of the narrative survives the destruction of its constituent characters, suggesting that composition exists in the telling as much as in the living.

  #### Shelley's Contribution to the Special Composition Debate

  Abstract argumentation in metaphysics often sterilises the stakes of the SCQ. We discuss tables, clouds, and statues. Shelley's dramatization contributes what abstract argument cannot: the **affective cost of composition**. To treat the Creature as a boundary case for Restricted Organicism is to ask whether life alone suffices for personhood. Shelley answers that life is necessary but not sufficient; the *history* of the composition matters.

  Furthermore, Shelley captures the horror of the **Problem of the Many** in a way logic cannot. In metaphysics, the Problem of the Many is a puzzle about vagueness. In *Frankenstein*, it is a source of existential dread. If the Creature is a composite of many dead persons, is he a new person or a graveyard of old ones? Shelley forces the reader to confront the idea that composition might involve a violence against the parts. Victor's act of composing the Creature is an act of desecration against the original wholes (the dead bodies) to create a new one. Abstract metaphysics rarely accounts for the moral rights of the parts prior to composition. Shelley insists that the history of the simples constrains the legitimacy of the composite. The novel suggests that Restricted Organicism must include a historical constraint: a life must arise naturally, or else the resulting composite is ontologically suspect, regardless of its functional integration.

  #### Conclusion: A Proposed Fictional Scenario

  To further adjudicate between Restricted Organicism and Universalism in cases of artificial life, distinct from Shelley's stitching of the dead, I propose the following scenario:

  **The Neural Hive:**
  Imagine a technology where one thousand distinct, biologically intact human beings are surgically linked via a central neural hub such that they share a single stream of consciousness, a single memory bank, and a single volition, whilst retaining their individual biological life-support systems (hearts, lungs) in separate bodies. They act in perfect unison, speaking with one voice through multiple mouths.

  *   **The Question:** Does this arrangement compose one person or one thousand?
  *   **Restricted Organicism:** Would argue there are one thousand organisms, thus one thousand composite objects. The functional integration of consciousness does not override the biological boundaries of the individual bodies. There is no single 'life' here, but one thousand coordinated lives.
  *   **Universalism:** Would argue that these one thousand bodies compose a further object (the Hive), and if psychological continuity is the criterion for personhood, there is one person.
  *   **Adjudication:** If the Hive is treated as a single moral agent (held responsible for one crime, not one thousand), Universalism (or a Psychological Criterion) gains ground. If each body must be tried separately, Organicism holds. This scenario isolates the variable of *biological boundary* versus *functional unity* without the baggage of death and resurrection present in *Frankenstein*, testing whether 'life' is defined by cellular autonomy or systemic integration.

  In *Frankenstein*, Shelley ultimately suggests that the metaphysics of composition cannot be divorced from the ethics of creation. Victor failed not because he misunderstood the physics of assembly, but because he misunderstood the metaphysics of unity. He treated the Creature as a Universalist sum of parts, whilst the world demanded an Organicist whole. The tragedy lies in the gap between the two.
