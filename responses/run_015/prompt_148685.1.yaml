answer: |-
  It is entirely understandable that you feel stuck between these two voices, particularly when the stakes feel so high, and your instinct that both sides are relying on the same underlying metaphor is remarkably sharp. You have identified that the debate is often less about the biology itself and more about how we interpret the nature of design in living systems. To audit the analogy as you requested, we must first lay out the mapping that both your partner's advisors and your friend are implicitly using. In the engineering picture, the designer is natural selection, but unlike a human engineer, this designer is blind and has no foresight. The specification is reproductive success, or fitness, which is not a fixed document but a moving target defined by the environment. The client is effectively the ecosystem, though it does not request features so much as reject failures. The build process is embryonic development constrained by evolutionary history, and the test suite is survival to reproductive age, which is brutally binary. Finally, the engineer standing over the finished machine trying to work out what a part is for is the evolutionary biologist, or in this case, you and your midwife.

  The mapping fails, however, in almost every place that matters for your specific worry. In software or mechanical engineering, the function exists in the mind of the designer before the part is built, but in biology, the part must exist before it can have a function. This means you cannot assume purpose precedes existence. Furthermore, engineered parts are modular and cleanly separable, whereas biological traits are deeply entangled through pleiotropy, where one gene affects multiple traits, meaning you cannot tweak one thing without breaking another. The engineering picture assumes the design is near optimal given the constraints, but evolution only requires something to be good enough to beat the competition, not perfect. Crucially, raw materials and previous models constrain an engineer far less than ancestry constrains an organism. An engineer can scrap a build and start again with a new language or architecture, but evolution must work with the legacy code it has inherited, patching it while it is still running. Finally, engineering assumes a single correct answer to what a component is for, whereas a biological trait can have multiple functions or none at all.

  When you look at what each side is smuggling in through this broken analogy, the adaptationist view held by the midwife and the internet is helping itself to a designer's intention. It assumes that because the nausea exists, it was selected for, effectively arguing that existence proves utility. This is a teleological trap, assuming the body knows what it is doing in a conscious sense. Conversely, your friend's spandrel argument is helping itself to a standard of what a decent engineer would produce. She is arguing that because the nausea looks costly and messy, a competent designer would not have included it as a feature, so it must be a byproduct. This risks dismissing actual function simply because the cost is high or the mechanism is clumsy, assuming that evolution optimises for efficiency in the way a human engineer tries to. Both sides are using the engineering metaphor to bypass the need for evidence, one by assuming perfection and the other by assuming incompetence.

  Regarding the concrete conclusion about the nausea, neither position survives the audit of the analogy alone. If you strip away the assumption that the body is a purposeful machine, the claim that nausea protects the baby becomes a hypothesis requiring data, not a default truth. There is indeed a hypothesis, often associated with researchers like Profet and Fessler, suggesting that nausea peaks during organogenesis to prevent the ingestion of toxins when the embryo is most vulnerable, and there is some statistical correlation between nausea and lower miscarriage rates. However, there is also evidence that nausea varies wildly across cultures and diets, and sometimes persists well past the vulnerable window, which supports your friend's view that it might be a side effect of the hormonal surge required to maintain the pregnancy, rather than a targeted defence mechanism. Without the engineering analogy to prop them up, both claims rest on empirical evidence rather than logical necessity, and the current scientific consensus is that it is likely a mix of both, where a physiological side effect was potentially co-opted or tolerated because it was not costly enough to be selected against.

  Your instinct to reach for the legacy codebase analogy is significantly better for some jobs and worse for others. It captures the historical constraints, the cruft, the repurposing of modules, and the fact that the system is held together by backwards compatibility rather than optimal design. It explains why things are messy and why we cannot simply refactor the genome. However, it distorts things because code has authors, even if they are gone, whereas evolution has no author at all. When you see a function named incorrectly in your codebase, you know someone intended it to do something else once. When you see a trait in an organism that seems mismatched, there was never an intention to match it in the first place. Additionally, you can stop your software to refactor it, but an organism must survive every generation while being modified, which leads to far more convoluted solutions than even the messiest codebase. So while the legacy code analogy is excellent for understanding constraint and exaptation, it still subtly implies a past intentionality that does not exist.

  To actually determine whether a feature is an adaptation, an exaptation, or a spandrel, you cannot just look at it and reverse engineer it, because that is where the just-so stories begin. You need comparative evidence to see if the trait correlates with the proposed problem across different species or populations. You need cost-benefit analysis to show that the benefits of the trait outweigh the metabolic or survival costs. You need to understand the genetic basis to see if it is linked to other selected traits. You also look for complex design, where multiple parts work together specifically to solve the problem, which is harder to explain as a byproduct. In the case of pregnancy nausea, researchers look at whether it peaks during the specific window of fetal vulnerability, whether it averses specific toxins, and whether it is absent in populations with diets low in those toxins. This is slow, difficult work, and it rarely yields the binary certainty that the engineering analogy promises.

  Ultimately, the engineering picture is doing damage because it suggests there is a correct answer to be found by thinking hard enough about the design, when in reality biology is a history of accidents that worked well enough. For your situation, this means that trusting the body because it is designed to protect the baby is not logically sound, nor is dismissing the symptoms because they look like bad engineering. The safest path is to treat the nausea as a medical condition to be managed rather than an evolutionary signal to be interpreted. Your friend is right that the adaptationist story is often overused, but she may be wrong to assume that means the symptom is harmless. The legacy code analogy serves you best here: the system is running on ancient, patched software that was never designed for your specific context, and sometimes it throws errors not because they are useful features, but because the underlying architecture is strained. You do not need to know why the error was written to know that you should try to mitigate its impact on the user.
