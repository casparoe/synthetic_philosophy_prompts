answer: |-
  There is no single canonical term that captures precisely the carving you are requesting. In the literature of game theory and evolutionary biology, the components are well-understood, but they are usually scattered across concepts like "Evolutionarily Stable Strategies," "Pareto Efficiency," and "Frequency-Dependent Selection." Your intuition is correct: "Simpson's Paradox" and "Non-transitivity" are mislabels. Simpson's Paradox concerns statistical aggregation across subgroups with confounding variables; your tournament has no confounding variables, only a change in the *metric of success*. Non-transitivity implies a cycle (A beats B, B beats C, C beats A); your case is not a cycle, but a divergence between two different definitions of "winning."

  Here is the distinction carved as you requested, followed by a proposed name and definition.

  ### The Carving: Relative Dominance vs. Absolute Accumulation

  The phenomenon you have isolated is the **decoupling of Relative Dominance from Absolute Accumulation in Variable-Sum Games.**

  1.  **Relative Dominance (The Dyadic Face):** This is the metric your "Defector" optimizes. It asks: *In this specific pairing, did I score more than my opponent?* In game-theoretic terms, this is maximizing the difference $(S_{me} - S_{opponent})$. In a zero-sum game, this is the only metric that matters. Your Defector wins every dyad because it ensures this difference is always non-negative.
  2.  **Absolute Accumulation (The Aggregate Face):** This is the metric your tournament (and evolution) actually selects for. It asks: *Across all pairings, how many points did I collect?* This is maximizing the sum $\sum S_{me}$. Your Copycat wins the tournament because it maximizes the *total pool of points available* in its pairings (by eliciting cooperation), even if it concedes a slight relative deficit in each specific dyad.

  **The Gap:** The gap exists solely because the Prisoner's Dilemma is a **Variable-Sum Game** (also called Non-Constant-Sum). The total points available in a round depend on the moves chosen ($5+0=5$, $3+3=6$, $1+1=2$).
  *   The Defector treats the game as if it were Zero-Sum (my gain is your loss). It secures the largest *slice* of the pie, but often ensures the pie itself is small.
  *   The Copycat treats the game as Variable-Sum (our moves determine the size of the pie). It accepts a smaller *slice* in specific pairings to ensure the pie is large, resulting in more total crumbs across the tournament.

  ### Why the Existing Labels Fail

  *   **Simpson's Paradox:** This requires a trend to reverse upon aggregation due to hidden weights or subgroups. In your tournament, the reversal isn't due to hidden weights; it is due to the *payoff structure*. The Defector's "wins" are real, but they are wins in a metric (relative score) that the tournament does not use to crown a champion. It is not a statistical artifact; it is a structural feature of the payoff matrix.
  *   **Non-Transitivity:** In a Rock-Paper-Scissors dynamic, Strategy A beats B, B beats C, and C beats A. In your tournament, the Defector *does* beat the Copycat head-to-head (Relative Dominance). The Copycat does *not* beat the Defector head-to-head. The Copycat beats the Defector only in the *aggregate table*. This is not intransitivity; it is a conflict between **Pairwise Rank** and **Population Fitness**.

  ### The Evolutionary Connection

  You asked if the collapse of the Defectors in the evolutionary simulation belongs to the same phenomenon. **Yes, it is the dynamic expression of the same static gap.**

  *   **Tournament (Static):** The tournament measures **Absolute Accumulation**. The Defector fails because, once it meets other Defectors or even itself, the "pie" shrinks to the mutual defection payoff (1 point). It cannot access the high-scoring cooperative pairings that boost the Copycat's total.
  *   **Evolution (Dynamic):** Evolution selects for **Absolute Accumulation** (fitness = points = reproduction). When Defectors are rare, they thrive (high Absolute Accumulation by exploiting cooperators). When Defectors become common, they meet each other frequently. Their Absolute Accumulation plummets because the "pie" remains small.
  *   **The Link:** The evolutionary collapse is simply **Frequency-Dependent Selection** driven by the Variable-Sum nature of the game. The tournament result is a snapshot of this dynamic. The Defector wins the *fight* (Relative Dominance) but loses the *war* (Absolute Accumulation) because the environment (the pool of opponents) reacts to its strategy.

  ### The Boundary Case: Where the Distinction Vanishes

  To see the edges of this phenomenon, you must look at a **Zero-Sum Game** (or Constant-Sum Game).

  Imagine a tournament of Chess or Matching Pennies.
  *   **Payoff:** Win = 1, Loss = 0, Draw = 0.5. (Total points per game = 1).
  *   **The Gap:** In this environment, Relative Dominance and Absolute Accumulation are mathematically identical.
  *   **The Result:** If a strategy wins every pairing (Relative Dominance), it *must* win the tournament (Absolute Accumulation). There is no "cooperation" to enlarge the pie. There is no "mutual defection" that shrinks it.
  *   **The Test:** If you ran your tournament with a Zero-Sum payoff matrix (e.g., I get +1, you get -1 for defection; I get -1, you get +1 for exploitation), the Defector would win both the pairings *and* the table. The Copycat would not be able to "concede" points to generate more total value, because value cannot be created, only transferred.

  In a Zero-Sum game, the "gap" you perceive closes to zero. The phenomenon exists *only* in Variable-Sum environments.

  ### A Name and Definition

  Since no established term captures this specific triad (Dyadic Win vs. Aggregate Win vs. Evolutionary Collapse) as a unified concept, I propose you use the term:

  **The Variable-Sum Decoupling**

  **Definition:**
  A phenomenon occurring in **Non-Constant-Sum Games** where a strategy's **Relative Dominance** (the probability of scoring higher than a specific opponent in a dyad) is negatively correlated with its **Absolute Accumulation** (the total score achieved across a population of opponents).

  **Boundaries:**
  1.  **Necessary Condition:** The game must be Variable-Sum (the sum of payoffs differs between outcome profiles, e.g., Mutual Cooperation > Mutual Defection).
  2.  **Exclusion:** It does not apply to Zero-Sum games, where Relative Dominance and Absolute Accumulation are perfectly correlated.
  3.  **Distinction:** It is distinct from Non-Transitivity (which implies a cycle of dominance) and Simpson's Paradox (which implies statistical aggregation error). It is a structural property of the payoff matrix, not a statistical artifact.
  4.  **Dynamic Consequence:** In evolutionary contexts, strategies relying on Relative Dominance (Defectors) are subject to **Frequency-Dependent Collapse**: they succeed when rare (exploiting the variable sum) and fail when common (reducing the variable sum).

  ### Summary of the Distinction

  You are looking at the difference between **beating an opponent** and **harvesting an environment**.

  *   Your Defector is a **Duelist**. It is optimized for war. It ensures it never loses a fight. But a duel yields little food.
  *   Your Copycat is a **Farmer**. It is optimized for agriculture. It may lose a trade negotiation here or there, but it cultivates a field that yields food.
  *   The Tournament and Evolution are **Ecological** metrics. They measure who has the most food at the end of the season, not who won the most duels.

  The "phenomenon" is simply the realization that in a Variable-Sum world, **Dueling is a sub-optimal strategy for Farming.** The gap is the cost of treating a cooperative environment as a hostile one.
