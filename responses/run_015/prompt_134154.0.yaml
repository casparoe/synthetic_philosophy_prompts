  Two managers, Alex and Jordan, are stuck in a conference room trying to resolve a budget dispute.

  Alex: "Okay, I'm escalating this. I'm taking it to your boss."
  Jordan: "That's you."
  Alex: "Fine. Your boss's boss."
  Jordan: "Also you. Just with a different email signature."
  Alex: "Okay, the CEO."
  Jordan: "We're co-CEOs."
  Alex: "The Board?"
  Jordan: "We're the only voting members."
  Alex: "This is literally an Escher drawing. I'm trying to find the hand that isn't being drawn. There has to be an inviolate level somewhere above us."
  Jordan: "There isn't one. The hierarchy curves back around. It's a closed loop."
  Alex: "Fine. If I can't go up, I'm out. I quit. I'm leaving the system."
  Jordan: (Typing on laptop) "Okay, submitting your resignation..."
  Alex: "Finally. Freedom."
  Jordan: "Wait. Error message."
  Alex: "What now?"
  Jordan: "Resignations require manager approval."
  Alex: "You're my manager."
  Jordan: "On Project A. But on Project B, you're mine."
  Alex: "So..."
  Jordan: "So you need to approve your own resignation before I can accept it."
  Alex: (Stares at the door)
  Jordan: "Don't bother trying the handle. Access requires approval too."
  Alex: "..."
  Jordan: "Grab a pen. You're holding up the workflow."
