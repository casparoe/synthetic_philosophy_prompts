answer: |-
  **Title:** Beyond Summation: A Well-Posedness Criterion for Infinite Decision Problems

  **1. Introduction and Research Question**

  Standard causal decision theory relies on the maximization of expected utility (EU). In finite cases, this is straightforward: sum the products of probabilities and utilities. However, when the state space is countably infinite, the expected utility is defined by an infinite series. Usually, this series converges absolutely, and the EU is well-defined. But in specific pathological cases, such as the Pasadena game, the series is only conditionally convergent. By the Riemann Rearrangement Theorem, the sum of a conditionally convergent series depends on the order in which terms are added. Consequently, the expected utility of the Pasadena game can be made to equal any real number, or diverge, simply by reordering the states.

  This creates a crisis for normative decision theory. If the value of a gamble depends on the arbitrary ordering of states, can it be said to have a value at all? Existing literature generally attempts to rescue the value assignment. Some propose "weak expectations" based on long-run averages; others suggest regularization techniques to assign a canonical sum; still others argue that decision theory simply falls silent, offering no verdict.

  This paper proposes a different approach. I argue that the Pasadena paradox is not a failure of expected utility theory to calculate a value, but a signal that the decision problem itself is ill-posed. The core research question is: **Can we formulate a principled invariance criterion that distinguishes well-posed infinite decision problems from ill-posed artifacts, such that the Pasadena game is excluded from the domain of decision theory while legitimate infinite problems (like the St. Petersburg game) remain included?**

  Specifically, I will investigate whether a "Permutation Invariance Principle" can serve as a necessary condition for a decision problem to be genuine. If the valuation of a gamble is not invariant under a natural class of permutations of the state space, the problem lacks the structural stability required for normative assessment.

  **2. The Gap in Existing Solutions**

  To justify this approach, we must examine why current responses to the Pasadena paradox are unsatisfactory. The literature currently falls into three camps, all of which accept the Pasadena game as a valid decision problem and attempt to manage the consequences.

  First, the *Weak Expectation* approach (associated with Nover and Hájek) suggests that while the standard expectation is undefined, the long-run average payoff converges almost surely to a specific value. While mathematically interesting, this shifts the normative goal from maximizing expected utility to maximizing long-run averages. This is a significant revision of decision theory that may not apply to one-off choices, which decision theory is meant to govern. It solves the math but changes the normative question.

  Second, the *Silence* approach argues that because the expectation is undefined, decision theory has no verdict. One is rationally permitted to play or not play. This preserves the standard definition of expectation but at the cost of normative guidance. If decision theory goes silent on clearly describable scenarios, its scope is severely limited. Furthermore, it fails to explain *why* the scenario is problematic beyond the mathematical undefinedness.

  Third, *Regularization* approaches attempt to assign a value using specific summation methods (e.g., analytic continuation). This effectively picks one ordering as "correct" without a principled justification for why that ordering reflects the agent's rational preferences.

  The common flaw across these approaches is that they treat the Pasadena game as a legitimate decision problem that happens to have tricky mathematics. They attempt to fix the *summation* rather than questioning the *setup*. My proposal suggests that the sensitivity to ordering is not a bug to be fixed, but a feature that reveals the problem is not a genuine decision scenario. In physics, a quantity is only considered an observable if it is invariant under coordinate transformations. I propose an analogous requirement for decision theory: a gamble's value should be invariant under permutations of the state space that preserve the probability measure. Existing solutions miss this structural insight because they focus on assigning a number rather than validating the problem structure.

  **3. Methodology**

  To test this hypothesis, I will employ a method of conceptual analysis combined with formal constraint construction. The work will proceed in three stages.

  *Stage 1: Formalizing the Invariance Criterion.*
  I will define a "Permutation Invariance Principle" (PIP). Let a gamble $G$ be defined over a countable state space $S$ with probability measure $P$ and utility function $U$. Let $\sigma$ be a permutation of $S$. I will argue that for $G$ to be well-posed, the expected value sum $\sum P(s)U(s)$ must yield the same valuation (including divergence to $\pm \infty$) for all $\sigma$ in a relevant class of permutations.
  A key challenge here is defining the "relevant class." A trivial objection is that the states in the Pasadena game are indexed by time (flip 1, flip 2, etc.), so reordering them violates the causal structure. I will counter this by distinguishing between the *indexing* of the states and the *summation* required for valuation. If the rational value of the gamble depends on the index order, then the value is not intrinsic to the gamble but to the description. I will refine PIP to require invariance under all measure-preserving bijections of the state space.

  *Stage 2: Boundary Testing.*
  I will apply PIP to three case studies:
  1.  **The Pasadena Game:** I will demonstrate that this fails PIP. Because the series is conditionally convergent, there exist permutations that change the sum to any real number. Thus, it is ill-posed.
  2.  **The St. Petersburg Game:** This is the crucial boundary case. The St. Petersburg series diverges to $+\infty$. Crucially, because all terms are positive, any rearrangement of the series also diverges to $+\infty$. Therefore, the valuation (infinity) is invariant under permutation. If my criterion rules this out, it is too strong. I aim to show it passes PIP, preserving standard infinite decision problems.
  3.  **The Altadena Game:** A variant of Pasadena with an added constant payoff. This shifts the series but maintains conditional convergence. It should also fail PIP, confirming the criterion tracks the mathematical pathology, not just specific payoff numbers.

  *Stage 3: Addressing Objections.*
  I will anticipate and respond to the "Natural Ordering" objection. Proponents of Weak Expectation might argue that the temporal ordering of coin flips provides a natural summation order, making permutation irrelevant. I will argue that rational choice should depend on the *outcomes* and their *probabilities*, not the arbitrary labeling of states. If two agents describe the same physical gamble using different state labelings, they should not arrive at different rational verdicts. If PIP forbids this, it protects the objectivity of decision theory.

  **4. Success and Failure Conditions**

  It is vital to establish clear metrics for the viability of this project.

  *A successful paper will:*
  1.  Provide a precise mathematical definition of the Permutation Invariance Principle that does not rely on vague intuitions.
  2.  Demonstrate conclusively that the Pasadena game violates this principle while the St. Petersburg game satisfies it. This distinction is the linchpin of the argument; if the criterion cannot distinguish between conditional and absolute convergence (or divergence to infinity), it fails.
  3.  Show that adopting PIP as a domain restriction solves the normative paralysis of the "Silence" approach. Instead of saying "EV is undefined," we say "This is not a valid input for EV calculation."
  4.  Address the concern that PIP might be too restrictive. For example, are there legitimate finite cases where ordering matters? (The answer should be no, due to the absolute convergence of finite sums, but this must be explicitly stated).

  *The project would fail if:*
  1.  The Invariance Criterion turns out to be equivalent to simply demanding absolute convergence. If PIP adds no philosophical insight beyond "require absolute convergence," the proposal is mathematically trivial. I need to argue why *invariance* is the philosophically fundamental property, with absolute convergence being merely the mathematical condition that satisfies it.
  2.  I cannot adequately defend against the "Natural Ordering" objection. If the temporal sequence of coin flips is deemed an intrinsic part of the gamble's identity, then permutation is category error, and my critique of the game's well-posedness collapses. I must show that the *value* should be separable from the *process*.
  3.  The criterion rules out too much. If it excludes standard infinite economic models (e.g., infinite horizon discounting) that are generally considered well-behaved, the scope is too narrow for a general decision theory.

  **5. Scope and Feasibility**

  This project is scoped for a one-semester term paper. It does not require empirical data or complex new mathematical proofs, but rather the synthesis of existing mathematical results (Riemann Rearrangement Theorem, properties of infinite series) with normative decision theory.

  The primary risk is scope creep regarding the definition of "natural permutations." To keep this manageable, I will restrict the analysis to countable state spaces with discrete probability measures, which covers the Pasadena, St. Petersburg, and Altadena cases. I will not attempt to generalize to continuous state spaces or measure-theoretic integration issues, as that would require a more advanced mathematical toolkit than is appropriate for this seminar.

  Furthermore, I will not attempt to solve the broader problem of infinite ethics (e.g., infinite populations). While related, that literature introduces complications regarding totalism vs. averagism that are distinct from the summation ordering problem. I will mention this connection in the conclusion but keep the focus on individual choice under risk.

  The timeline is as follows:
  *   **Weeks 1-2:** Formalize the Permutation Invariance Principle and verify the mathematical behavior of the Pasadena and St. Petersburg series under permutation.
  *   **Weeks 3-4:** Draft the argument against existing solutions (Weak Expectation, Silence), focusing on the "ill-posedness" critique.
  *   **Weeks 5-6:** Develop the response to the "Natural Ordering" objection. This is the strongest counterargument and requires the most careful philosophical work.
  *   **Weeks 7-8:** Finalize the boundary testing and write the conclusion regarding the implications for the domain of decision theory.

  **6. Conclusion**

  The Pasadena paradox is often treated as a limit case for expected utility theory, a place where the machinery breaks down. This paper argues that it should instead be treated as a diagnostic tool. The sensitivity of the Pasadena game's value to state ordering indicates that it lacks the structural robustness required of a genuine decision problem. By shifting the focus from "how to sum the series" to "when is the problem well-posed," we can preserve the core of expected utility theory while excising the pathological cases that threaten its coherence. If successful, this approach offers a cleaner resolution than Weak Expectation or normative silence, grounding the limits of decision theory in the invariance properties of the problems it seeks to solve.
