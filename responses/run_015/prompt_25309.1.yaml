prompt: |-
  I'm in a decision theory seminar and we have to submit a ~1500-word term paper proposal by Friday. I want to write about the Pasadena paradox—the one where you flip a fair coin until it lands heads, and your payoff is structured so the expected value is a conditionally convergent series, so it's undefined (or you can make it come out to anything by rearranging terms). The standard responses seem to fall into two camps: either you try to extend expected value to cover these cases (weak expectation, or some kind of regularized sum), or you say decision theory just goes silent here and that's fine.

  My half-formed idea is that both camps are missing something. The Pasadena game depends on a very specific ordering of states—if you reorder them you get whatever expected value you want. So maybe the real lesson isn't about how to sum divergent series, but about when a decision problem is well-posed in the first place. Like, maybe a decision problem isn't genuine unless the expected value is invariant under some natural class of permutations of the state space, and the Pasadena "game" fails that test—it's not a real decision problem, it's a mathematical artifact dressed up as one. But I'm not sure how to make that precise without ruling out too much (some legitimate infinite decision problems might also fail permutation invariance).

  Turn this into a proposal. I need: the question stated precisely, why the existing fixes (weak expectation, dominance reasoning, the "just don't play" line, etc.) leave a gap, what I'd actually do method-wise (case analysis? constructing a formal criterion? testing it against other paradoxes like the St. Petersburg?), what a successful paper looks like versus what would mean the idea doesn't work out, and a realistic scope for one semester. Don't worry about citations, I'll add those myself.
