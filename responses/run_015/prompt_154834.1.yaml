answer: |-
  **Project Title:** Recursive Authorization: Potentia and Institution in Spinoza's *Tractatus Politicus*

  **Research Question**
  Can Spinoza's ontology of power consistently accommodate representative institutions within a democracy without reducing sovereign authority to mere delegation, and does this consistency require a concept of "recursive authorization" distinct from both direct participation and modern representative theory?

  This project seeks a determinate answer to whether the *Tractatus Politicus* (TP) permits a stable middle ground between assembly-based direct democracy and alienated representation. The answer will take the form of a set of necessary and sufficient conditions: Spinoza allows representation if and only if the institutional structure functions as a conduit that continuously re-manifests the *potentia multitudinis* (power of the multitude) rather than a vessel that holds transferred *potestas* (authority). If the text demands that power be physically present to be sovereign, the answer is negative (direct democracy only). If the text allows power to be alienated to a council, the answer is positive but liberal-republican. If the text requires power to remain with the multitude while acting *through* the council via a specific feedback mechanism, the answer is positive via "recursive authorization."

  **Background and Problematic**
  Standard interpretations of Spinoza's political philosophy currently polarize around the unfinished democratic chapters of the *Tractatus Politicus*. One camp reads Spinoza as a proto-direct-democrat. On this view, because sovereignty is identical to the actual power of the multitude, any delegation alienates that power, thereby diminishing the state's absoluteness. Consequently, legitimate democracy requires the continuous physical assembly of citizens. The opposing camp reads Spinoza as an early republican. This view argues that Spinoza recognizes the practical impossibility of universal assembly and thus endorses delegated councils that govern in the multitude's name, provided they act according to rational dictates.

  Both readings leave the status of democratic sovereignty indeterminate in light of Spinoza's claim that democracy is the *imperium absolutissimum* (the most absolute form of command). The direct-democracy reading struggles to explain how a large modern state can remain "absolute" without collapsing into anarchy or requiring an implausible scale of participation. The republican reading risks conflating Spinoza's *potentia* with the Hobbesian transfer of right, wherein sovereignty is alienated to the representative for a fixed term. If authority is transferred, the multitude ceases to be the sovereign, and democracy becomes merely an aristocratic regime with a different origin story. Neither approach adequately explains how an institution can be *of* the multitude without the multitude constantly occupying it, nor how it can be distinct from the multitude without ceasing to be democratic. The gap lies in the mechanism of authorization: is it a one-time event (contract/election) or an ongoing ontological state?

  **Hypothesis: Recursive Authorization**
  This project tests the hypothesis that Spinoza's democracy rests on a recursive structure of authorization. Unlike modern liberal theory, where the people authorize representatives who then act independently, or direct democracy, where the people act directly, recursive authorization posits that the council's power is ontologically dependent on the continuous flow of the multitude's *potentia*. The institution does not hold power; it channels it.

  On this framing, a delegated body holds democratic authority only insofar as its decisions continuously re-manifest the power of the multitude. This is not periodic re-authorization via elections, but a structural requirement that the institution's *conatus* (endeavor) remains aligned with the *conatus* of the whole. If the institution acts against the multitude's power, it does not merely act unjustly; it ontologically ceases to hold democratic authority, reverting the state to a lesser form of *imperium*. This preserves the "absoluteness" of democracy (power is never alienated) while allowing for representation (power is mediated). The project will determine if this reading resolves the textual tensions in the TP without importing anachronistic liberal assumptions about representation.

  **Methodology**
  The method is close conceptual reconstruction paired with textual analysis. I will reconstruct the triad of *potentia* (power/capacity), *multitudo* (the multitude as a political subject), and *imperium* (sovereign right) as they appear in the *Ethics* and the *Tractatus Politicus*. This ontological groundwork will be applied specifically to the fragments of Chapter 11 of the TP, where Spinoza outlines the democratic state.

  This approach is preferable to a purely historical-contextual study because the problem is not primarily about what Spinoza knew of Dutch republicanism, but about the internal consistency of his metaphysical politics. Contextual history can explain why he stopped writing, but it cannot resolve whether his system *allows* for representative democracy. Conversely, this approach avoids anachronistic comparison with modern democratic theory. Applying contemporary metrics of representation to Spinoza obscures his radical redefinition of right as power. By focusing on the internal logic of *potentia*, the project respects the specificity of Spinoza's immanent causality. The analysis will track how Spinoza defines the relationship between the council's decrees and the multitude's obedience, looking for evidence that obedience is not passive submission but an active composition of powers.

  **Feasibility and Timeline**
  This project is realistic for a one-year fellowship. It relies on conceptual reconstruction and textual analysis of a defined corpus (primarily the TP, supported by the TTP and *Ethics*), rather than archival discovery or extensive fieldwork. The text is available and well-edited; the challenge is interpretive, not evidentiary.

  *   **Months 1–3:** Detailed exegesis of *potentia* and *multitudo* in the *Ethics* and *Tractatus Theologico-Politicus* to establish the ontological baseline.
  *   **Months 4–7:** Close analysis of the *Tractatus Politicus*, specifically the transition from aristocracy to democracy and the fragments of Chapter 11. Drafting the core argument regarding recursive authorization.
  *   **Months 8–10:** Stress-testing the hypothesis against counter-arguments (e.g., Spinoza's exclusion of women and servants, his views on sedition). Refining the criteria for institutional legitimacy.
  *   **Months 11–12:** Finalizing the manuscript for publication and preparing a summary article for a general political theory audience.

  **Expected Outcomes**
  A successful result will yield a principled institutional criterion that saves Spinoza's text from internal contradiction. It will demonstrate that Spinoza offers a third way between assembly politics and liberal representation, grounded in the immanence of power. This would provide a robust Spinozist contribution to contemporary debates on democratic legitimacy, offering a model where representation is valid only as long as it amplifies rather than replaces the constituent power.

  A failed result would occur if the "recursive" distinction collapses under textual scrutiny. This would happen if the TP ultimately demands physical presence for sovereignty (confirming the direct-democracy reading) or if Spinoza's definition of obedience implies a transfer of right indistinguishable from Hobbesian delegation (confirming the republican reading). In either case, the project will still produce a determinate answer, clarifying the limits of Spinoza's democratic theory.

  By isolating the mechanism of authorization, this fellowship will clarify whether Spinoza's unfinished work contains a coherent theory of representative democracy or if it remains fundamentally incompatible with institutional mediation. Either outcome significantly advances the understanding of early modern political ontology and its relevance to the crisis of representation in contemporary politics.
