      *   *Why Intentional is better:* It captures the *contextual* nuance (hostility vs. noise) which the loss function treats identically.
      *   *Why Ontologically extravagant:* It's just math.

  9.  **Final Polish:** Ensure the distinction between "predictive utility" and "ontological reality" is sharp. The core argument is that the intentional pattern is a *useful map* that doesn't correspond to a *territory* of mental states, even if it predicts better than the outdated design specs. It's a "free-floating rationale" without a "ratiocinator."

