  **Ask Aunt Akrasia**
  *The Institute for Metaepistemic Hygiene's Official Agony Column*

  **Dear Aunt Akrasia,**
  My neighbour and I are epistemic peers. We both checked the back door. I recall locking it; she recalls leaving it ajar. We have identical evidence and equal intelligence. Per the Recursive Deference Protocol, I have moved my credence to 0.5. I now cannot leave the house, as neither locking nor not-locking is rational. Am I permitted to just go out?
  *— Agonised in Acton*

  **Dear Agonised,**
  Your commitment to the Protocol is commendable, though your paralysis suggests a misunderstanding of the Three-Level Rule. When peer disagreement lowers your credence to 0.5, you have reached Level One deference. However, anxiety about action is merely a first-order attitude. You must defer to the evidence that your decision-making is compromised by this very anxiety (Level Two), and then defer to your uncertainty about whether that deference is sufficient (Level Three). At this point, record a 'Provisional Credence (Non-Binding)' in your log. You may then act as if the door is locked, provided you maintain no actual belief that it is. Do not worry that this is spineless; consistency is far more robust than security.

  **Dear Aunt Akrasia,**
  I solved a complex proof while suffering from severe sleep deprivation. I am now rested and see no errors in the derivation. However, I have higher-order evidence that my cognitive faculties were impaired. Must I reject the proof even though the first-order evidence remains untouched?
  *— Drowsy Deductor*

  **Dear Drowsy,**
  This is a classic case for the separation of evidence types. Your first-order evidence (the steps of the proof) supports the conclusion, but your higher-order evidence (the fatigue) undermines your reliability in processing those steps. Rationality requires you to believe that your belief in the proof is irrational, even if the proof looks sound. This state of rational akrasia is uncomfortable but necessary. You must not trust the derivation simply because it looks correct; you must trust the evidence about your condition. Continue to teach the proof, but append a disclaimer that you do not believe you believe it.

  **Dear Aunt Akrasia,**
  A senior colleague insists he is not my epistemic peer due to his rank, so I owe him no deference. I disagree. Am I allowed to use my own reasoning to settle whether he is my superior, or does that beg the question?
  *— Junior Researcher*

  **Dear Junior,**
  You have spotted the bootstrapping problem beautifully. If you use your own reasoning to assess his superiority, you are assuming your reasoning is reliable on this very matter. But his claim implies it is not. To avoid question-begging, you must defer to his assessment of your reliability. Therefore, you must accept that he is not your peer, which means you owe him no deference. However, since you have deferred to his claim that you should not defer, you must also defer to the possibility that you should defer. Record this contradiction as a Level Three Provisional Credence and address him as 'Superior' in all correspondence, while privately noting that his superiority is non-binding.

  ***

  **Notes from the Helpdesk**
  Following last week's column, the Helpdesk has been inundated with queries regarding the practical application of the Three-Level Rule. Please note that 'acting as if nothing had changed' does not constitute a belief state, and staff are reminded that holding contradictory provisional credences is a violation of hygiene only if noticed by others. We are pleased to announce that registrations for the annual 'Retreat from Judgement Day' are now open. Last year's retreat resulted in a 40% increase in suspended judgments among attendees, with several participants successfully achieving total doxastic silence during the Saturday seminar. Please submit Form 44-B if you intend to withhold belief on the existence of the retreat itself. Remember: a clean mind is an empty mind.
