answer: |-
  # Specification: Conditions of Adequacy for an Account of Promissory Obligation

  **Purpose:** To define the necessary constraints for a theory of self-binding that explains promissory obligation while remaining compatible with neighbouring normative powers (consent, offers, vows, contracts). The account must explain the *source*, *direction*, *content*, and *force* of the obligation.

  **Legend:**
  *   **[P]:** Promissory-Specific (unique to promising or central to it).
  *   **[G]:** Generalizable (must also hold for consent, vows, contracts).
  *   **[NN]:** Non-Negotiable (required by the phenomenology or moral data).
  *   **[CD]:** Camp-Demand (contested; required by specific theoretical traditions).

  ---

  ### 1. The Directedness & Waiver Condition
  The obligation generated must be *directed* to a specific normative counterpart (the promisee). Consequently, the standing to demand performance and the power to release the promisor from the obligation reside exclusively with that counterpart, not with third parties or the general moral community.
  *   **Motivation:** Explains why a third party cannot forgive a debt owed to you, and why breaking a promise wrongs *someone* specifically, rather than just violating an abstract rule.
  *   **Label:** [G] [NN]

  ### 2. The Independence from Subjective Intent Condition
  An obligation can be incurred even if the promisor lacks the present intention to perform (insincere promising), provided the outward manifestation of commitment was voluntary and understood as such. The binding force cannot depend on the internal mental state at the moment of utterance.
  *   **Motivation:** A liar is still bound. If binding required sincere intent, the liar would escape obligation, and the promisee would have no claim. This separates the *obligation* from the *virtue* of honesty.
  *   **Label:** [P] [NN]

  ### 3. The Non-Consequentialist Constraint
  The obligation persists even in scenarios where breaking the promise would produce marginally better overall consequences for the promisee (e.g., the promisee is unreachable and would prefer the promisor do otherwise). The obligation is not merely a heuristic for maximizing welfare.
  *   **Motivation:** Addresses the "Paradox of Promise." If the point were solely the promisee's welfare, the obligation would dissolve when welfare is better served by breach. Morality treats the *word given* as the source of the duty, not the outcome.
  *   **Label:** [G] [NN]

  ### 4. The Normative Innovation Condition
  The account must explain how a promise creates a *new* obligation in cases of pre-existing duty (e.g., promising to do what morality already requires), without falling into a regress where the promise itself requires a prior promise to be binding. The act must add normative force, not merely restate existing duty.
  *   **Motivation:** Addresses the "Consideration" puzzle. If I promise to meet you for lunch, I am now *doubly* bound (morality + promise). An adequate account must explain this addition. If the account cannot explain this, it reduces promising to mere prediction or reminder.
  *   **Label:** [P] [CD] (Rejected by strict legal consideration models; required for moral accounts).

  ### 5. The Gradability of Force Condition
  The weight of the obligation must vary according to the context of the undertaking (e.g., a casual assurance vs. a sworn oath vs. a signed contract), without altering the fundamental nature of the obligation.
  *   **Motivation:** Explains why breaking a vow is a greater wrong than breaking a casual plan, even if the reliance costs are identical. The *mode* of binding modulates the *strength* of the claim.
  *   **Label:** [G] [NN]

  ### 6. The Primary Duty of Performance Condition
  The primary moral remedy for breach is performance (or apology for non-performance), not compensation. Compensation is a secondary substitute when performance becomes impossible.
  *   **Motivation:** Distinguishes moral promising from standard contract law (which often permits "efficient breach" via damages). Morality views the *act* as owed, not the *value* of the act.
  *   **Label:** [P] [NN]

  ### 7. The Attribution & Agency Condition
  The account must accommodate undertakings issued by automated systems or organizational structures where no single human agent formed a specific intention to bind, yet the recipient reasonably relies on the institutional authority of the output.
  *   **Motivation:** Modern necessity. If a booking algorithm commits an airline to a seat, the airline is bound. An account requiring a specific human "act of will" at the moment of issuance fails to ground organizational obligation.
  *   **Label:** [G] [NN]

  ---

  ### Incompatibility Note
  **Condition 3 (Non-Consequentialist Constraint)** and **Condition 7 (Attribution & Agency)** create a theoretical tension. Condition 7 is most easily satisfied by Reliance-based accounts (which are often consequentialist in structure: the system caused reliance, therefore compensate). Condition 3 explicitly rejects consequentialist grounding. An adequate theory must explain how an automated system creates a *deontic* bond (Condition 3) without a human will, which is the hardest theoretical lift in this specification.

  ### Most Exclusionary Condition
  **Condition 4 (The Normative Innovation Condition).**
  This condition excludes the highest number of candidate theories.
  *   **Reliance Accounts** fail here: One cannot detrimentally rely on a promise to do what one is already entitled to have done; thus, no *new* obligation is generated in pre-existing duty cases.
  *   **Simple Will Accounts** struggle here: If morality already commands the act, willing it adds nothing (the "redundancy objection").
  *   **Legal Consideration Models** explicitly fail here: Pre-existing duty is often a defense against contract formation.
  Only a robust **Practice-Based** or **Sophisticated Will-Based** account can clear this hurdle.

  ---

  ### Evaluation of Candidate Accounts

  **Will-Based Accounts**
  *   **Performance:** Strong on Conditions 1 (Directedness) and 2 (Independence from Intent, if objective). They ground the obligation in the agent's autonomy.
  *   **Failure:** They collapse on Condition 7 (Automation). If no human wills the specific commitment, there is no obligation. They also struggle with Condition 4 (Pre-existing Duty), as it is unclear how one wills what is already mandated. They tend to support Condition 6 (Performance) strongly.

  **Reliance-Based Accounts**
  *   **Performance:** Strong on Condition 7 (Automation) and Condition 5 (Gradability, based on reasonable reliance). They explain why we protect the promisee's expectations.
  *   **Failure:** They fundamentally violate Condition 3 (Non-Consequentialist) and Condition 2 (Insincerity, if no reliance has yet occurred). They fail Condition 4 (Normative Innovation) completely, as reliance cannot generate new duties regarding pre-existing obligations. They naturally lead to Compensation (Condition 6 failure) rather than Performance, as the harm is the reliance loss, not the non-performance.

  **Practice-Based Accounts**
  *   **Performance:** Strongest overall fit. They satisfy Condition 4 (Normative Innovation) by treating promising as a social move that changes normative status by convention. They handle Condition 7 (Automation) via institutional rules rather than individual psychology. They support Condition 6 (Performance) as upholding the practice.
  *   **Failure:** They risk weakening Condition 1 (Directedness) if the obligation is viewed as owed to the "practice" rather than the person. They must carefully explain why the *individual* is bound by the *social* rule without falling into a regress of "promising to follow the practice."
