          *   Bio Pred: Split persists across all job types.
          *   Struct Pred: Split is specific to high-prestige/high-pay STEM fields.

  4.  **Drafting - Section 3: Normative Implications (Justice):**
      *   *Goal:* Address the "So What?" without preaching.
      *   *Scenario A (Bio-Side Right):*
          *   Opportunity vs. Outcome: Justice requires open doors, not 50/50 splits.
