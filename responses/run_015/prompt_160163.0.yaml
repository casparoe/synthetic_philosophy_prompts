          3.  *Justice/Normative Section:* What follows if Bio-Side is right? (Opportunity vs. Outcome, Adaptive Preferences, Externalities, Nudging). What follows if Structural-Side is right? (No natural floor).
          4.  *Verbal Disputes:* Clarify definitions of "nature" and "culture."
