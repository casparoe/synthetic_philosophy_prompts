      *   *Point 2 (Sorting Logic):* Freedom + Small Average Differences = High Segregation. Constraint = Low Segregation. These are compatible.
      *   *Point 3 ("Egalitarian" Ambiguity):* The index bundles non-discrimination, material security, and self-expression culture. The effect might be driven by security/culture, not non-discrimination.
      *   *Point 4 (Index Composition):* Indices include outcomes (participation), creating endogeneity issues.
