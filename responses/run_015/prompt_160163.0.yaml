      *   *Self-Correction on Labels:* The prompt describes them as "biologically-influenced" vs "artifact of indices/wealth." I should use descriptions that reflect the *claim* rather than the *motivation* to keep it signable. Let's go with "The Stability Account" (interests are relatively stable across contexts) and "The Constraint Account" (choices reflect constraints/opportunities).
