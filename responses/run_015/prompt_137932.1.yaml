answer: |-
  Here is a plan for the ninety minutes, structured to leverage your audience's background while protecting the logical integrity of the result.

  ### 1. Dependency Structure (The Whiteboard)

  Your instinct is correct: the load-bearing beam is the distinction between **Social Ordering** (a complete, transitive ranking of all states) and **Social Choice** (selecting a winner from a feasible set). Sen's result is about the former. If you allow the group to conflate the two, they will "solve" the theorem by switching to a choice function (which Sen addresses in later work, but not in the 1970 paper).

  **Order of Operations (0–45 mins):**

  1.  **The Object:** Define the Social Welfare Function (SWF). Explicitly state: *Input* = Profile of individual orderings; *Output* = **Single social ordering**. Write "Transitivity" in big letters.
  2.  **The Axioms:**
      *   **Universal Domain:** Any logical preference profile is allowed.
      *   **Weak Pareto:** If everyone prefers $x$ to $y$, Society prefers $x$ to $y$.
      *   **Minimal Liberalism (ML):** There exist at least two individuals and two distinct pairs of outcomes such that individual $i$ is *decisive* over pair 1, and individual $j$ is *decisive* over pair 2.
      *   *Crucial Definition:* Define "Decisive." If $i$ prefers $x$ to $y$, then Society prefers $x$ to $y$, *regardless of others' preferences*.
  3.  **The Cycle Construction:** Do not derive the example yet. Show the logical skeleton on the board.
      *   $i$ dictates $A \succ B$.
      *   $j$ dictates $B \succ C$.
      *   Pareto dictates $C \succ A$.
      *   Result: $A \succ B \succ C \succ A$.
  4.  **The Distinction (Minute 45):** Explicitly box the conclusion: "The cycle is in the **Social Ordering**."
      *   *Defer:* What if we only want a choice? (Gibbard's escape).
      *   *Defer:* What if we drop Transitivity? (Quasi-transitivity).
      *   *Risk:* If you let them blur ordering and choice early, they will argue that "we just pick the top of the cycle," missing the point that the *normative ranking* is incoherent.

  ### 2. The Carrying Example

  **Verdict:** Run Sen's structure, but **sanitize the labels**. Do not invent a new example; the specific preference ordering is structurally necessary.

  **Why Sen's Structure is Required:**
  For the Pareto condition to conflict with Liberty, preferences must be **other-regarding**.
  *   If Agent 1 only cares about their own reading, and Agent 2 only cares about their own reading, there is no Pareto improvement available that conflicts with rights.
  *   The paradox *requires* Agent 2 to prefer "Agent 1 reads" over "Agent 2 reads."
  *   If you remove the "meddlesomeness," you remove the theorem.

  **The Sanitization:**
  Use "Conservative" and "Progressive" regarding a specific book or film, or "Roommate A" and "Roommate B" regarding a shared living room poster.
  *   **Outcomes:** $a$ (A puts it up), $b$ (B puts it up), $n$ (no one puts it up).
  *   **A (Conservative):** $n \succ a \succ b$. (Prefers clean walls, but if art must exist, prefers their own taste to B's).
  *   **B (Progressive):** $a \succ b \succ n$. (Prefers A's taste to their own, prefers their own to nothing).
  *   **Rights:** A decides $\{a, n\}$. B decides $\{b, n\}$.

  **Why this works for your crowd:**
  It prevents sniggering but preserves the "busybody" mechanic. It forces the rationalists to confront that **preferences are taken as given**. The theorem does not say "people shouldn't be meddlesome." It says "if they are, and we respect rights and Pareto, we crash."

  **What the example must lack:**
  It must not look like a negotiation. No Coasean bargaining. The preferences are fixed inputs to the SWF.

  ### 3. Misconceptions (Timeline & Strategy)

  Your audience will generate these in a specific order. Pre-empt the structural ones; engage the normative ones.

  1.  **"Collectives are irrational." (Minute 30)**
      *   *Strategy:* **Pre-empt.** State clearly before the example: "Individuals are perfectly rational (transitive). The intransitivity is a property of the *aggregation rule*, not the agents."
  2.  **"This is just Arrow." (Minute 35)**
      *   *Strategy:* **Pre-empt.** Arrow uses Independence of Irrelevant Alternatives (IIA). Sen does **not** use IIA. Sen uses Liberty. This is a different impossibility.
  3.  **"Just drop Pareto." (Minute 55)**
      *   *Strategy:* **Engage.** Let them argue this. Pareto is the weakest possible efficiency condition. Dropping it allows for "Paretian disasters" (making everyone worse off to respect a right). This is the strongest normative tension.
  4.  **"Rights are side constraints (Nozick)." (Minute 60)**
      *   *Strategy:* **Engage.** This is the deepest philosophical objection. Sen frames rights as *decisiveness within the SWF*. Nozick frames them as *constraints on the SWF*. Acknowledge this: Sen is showing that you cannot *integrate* rights into a consequentialist SWF without contradiction.
  5.  **"Cardinal Utility / Summing solves it." (Minute 75)**
      *   *Strategy:* **Engage (Setup for your variant).** This is the natural reflex for EAs. Let them propose it. It sets up your closing segment perfectly.
  6.  **"Stop asking for an ordering." (Minute 80)**
      *   *Strategy:* **Defer to end.** This is the Gibbard escape. Acknowledge it as the standard technical fix, but note the cost (we lose a social ranking, only get choices).

  ### 4. The Variant ($\lambda$-Decisiveness)

  **Verdict:** **Include it, but strictly as a coda.** It is high-value for this specific audience (programmers/EAs love parameterizing intuitions), but it risks muddying the ordinal result if presented as part of the theorem.

  **Is the math right?**
  Your intuition is directionally correct. In a utilitarian framework, a "right" effectively functions as a weight. For individual $i$ to be decisive over a pair against the sum of everyone else, their utility intensity on that pair must outweigh the aggregate intensity of the rest.
  *   If utilities are normalized (e.g., max range 1), and there are $n$ people.
  *   For $i$ to always win: $|u_i| > \sum_{j \neq i} |u_j|$.
  *   In the worst case, everyone else opposes $i$ with max intensity. $1 > (n-1) \times 1$.
  *   This fails for $n > 2$.
  *   To satisfy this, you must either restrict the intensity of others (censorship of preference strength) or grant $i$ a weight multiplier $\lambda \geq n-1$.
  *   As $n$ grows, the "weight" required for a right grows linearly. This quantifies the "dilution of rights" in large populations under pure aggregation.

  **How to run it (10 minutes max):**
  1.  **Do not derive the threshold on the board.** State it as a claim: "If we switch to cardinal utility and sum, a 'right' becomes a weight. To maintain Sen-style decisiveness, my weight must scale with $n$."
  2.  **The Trade-off:** Draw a simple axis.
      *   Left: Pure Utilitarianism (Cycle dies, Rights die).
      *   Right: Sen's Liberalism (Rights strong, Cycle appears).
      *   Middle: Your $\lambda$ dial.
  3.  **The Point:** This turns "Shut Up and Multiply" into a constraint satisfaction problem. It shows that **rights are expensive** in a utilitarian calculus.
  4.  **Warning:** Explicitly state: "Sen's theorem is ordinal. This variant assumes interpersonal comparison of utility, which Sen explicitly rejected. This is not a solution to Sen; it is a departure from his premises."

  ### 5. Closing Question & Off-Limits

  **The Minute 80 Question:**
  > "If we insist on keeping Pareto and Minimal Liberalism, which specific property of the **social output** must we surrender to avoid the contradiction?"

  *   *Correct Answer:* Transitivity (or the requirement for a complete Social Ordering).
  *   *Why this works:* It forces them to locate the impossibility in the *aggregation method*, not the agents or the axioms.

  **The Off-Limits List:**
  1.  **Strategy/Manipulation (Gibbard-Satterthwaite):** "That asks if agents will lie about preferences. We are assuming truthful revelation today."
  2.  **Choice Functions (Gibbard's Liberal Paradox resolution):** "That changes the output from an Ordering to a Choice Set. We are analyzing the cost of wanting a coherent Ranking."
  3.  **Bargaining/Coase:** "We are analyzing a social welfare function, not a negotiation process. Side payments are out of scope."

  **The Decline Line:**
  > "That is a valid escape route, but it belongs to a different layer of the onion (mechanism design / choice theory). For this session, I want to sit with the cost of wanting a normative *ranking*."

  ### Summary of Flow
  *   **00-15:** Setup (SWF, Orderings, Transitivity).
  *   **15-30:** Axioms (Pareto, Liberty, Decisiveness).
  *   **30-50:** The Example (Sanitized Prude/Lewd). Walk the cycle.
  *   **50-60:** Misconceptions (Arrow vs. Sen, Irrationality).
  *   **60-75:** Discussion (Pareto vs. Rights vs. Nozick).
  *   **75-85:** The Variant (Cardinality & $\lambda$).
  *   **85-90:** Closing Question & Wrap.
