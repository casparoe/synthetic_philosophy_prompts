answer: |-
  Here are six angles I considered before settling on the final approach:

  1.  **Pure Moral Imperative:** Argue that excluding them is simply wrong. *Dropped:* Too preachy for a student leader; ignores the logistical reality parents are feeling.
  2.  **Administrative Assurance:** Focus on the new gym and hiring plans. *Dropped:* Sounds like "we'll manage," which you said doesn't address the margin-of-safety fear.
  3.  **The "Ocean Liner" Rebuttal:** Claim we are too big to sink. *Dropped:* Dismisses the very real crowding issues; undermines your credibility.
  4.  **The "Political Boundaries" Accusation:** Argue the district drew the lines unfairly. *Dropped:* Violates the Principal's constraint to not make anyone feel like a villain.
  5.  **The "Mutual Benefit" Exchange:** Argue Eastside brings sports/talent we need. *Dropped:* Risks treating the kids as commodities or charity cases.
  6.  **The "Elastic Community" (Selected):** Acknowledge the physical limits but argue school capacity is social and political, not just physical. This honors the philosophy while allowing for action.

  ***

  ### Assembly Speech

  Good morning. I know why there's tension in this room. I walk the same halls you do. I know what it feels like to be late because the corridor was too packed to move, and I know there are six portables outside that already feel too full. So when parents say we're in a lifeboat, and adding more weight means everyone drowns, I understand why that feels true. It looks like physics.

  But I looked up the essay everyone is quoting. Garrett Hardin's "Lifeboat Ethics" relies on one specific assumption: that the boat's capacity is fixed by nature. He argues that if you exceed the carrying capacity, the system collapses. And if we were actually a boat, made of steel and governed by displacement, he would be right. You cannot physics your way out of a sinking hull.

  But a school isn't a boat. A school's capacity isn't set by physics; it's set by choices. Class size caps, hiring budgets, schedule blocks—these aren't laws of nature. They are decisions adults make. The boundaries that put us in this boat and Eastside students in the water weren't drawn by the tide; they were drawn on a map. We happen to be the ones with seats, but that doesn't mean the seats can't be built.

  I hear the worry about the margin of safety. One parent wrote that you shouldn't load a boat to its limit because one wave swamps it. That is a serious point. If we just shove 200 more kids into the same structure without changing the structure, yes, we risk swamping. But safety doesn't come from empty seats. It comes from support. If we accept them, we must demand the resources to teach them properly. We trade the false safety of exclusion for the real safety of a fully funded community.

  And to the students from Eastside sitting in the front row: You are not the water coming over the gunwale. You are not weight. You are passengers who deserve a seat just as much as we do. If we treat you as a burden, we sink. If we treat you as classmates, we build.

  Hardin's argument works for calories in a famine, where the food is fixed. It does not work for education, where the resource is us. We can make more room. We can hire more teachers. We can adjust the schedule. But we cannot make more time for you to learn if we turn you away now.

  So yes, it will be crowded. Yes, it will be uncomfortable. But your discomfort is not the same as danger. We are not a lifeboat waiting to be filled. We are a community waiting to be built. Let's not sail away from the people who need us when we have the power to build a bigger boat.

  Thank you.

