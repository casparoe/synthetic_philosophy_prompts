answer: |-
  This is a potent lens. Reading *The Metamorphosis* through a gradient of moral status exposes the machinery of how we grant or withhold care. But if you bring this framework to your book club, the most valuable insight won't be how well the story fits the model, but how violently it tears the model apart.

  Here is a sharp reading of the text through your specific philosophical constraints.

  ### 1. Mapping the Downward Shifts
  You asked which moments map onto the downward shifts in the family's care. If moral status relies on cognitive continuity, affective range, and social reciprocity, the family doesn't track Gregor's internal metrics; they track his *output*.

  *   **The Loss of Intelligible Speech (Reciprocity Break):** This is the first major drop. Gregor can understand them perfectly (cognitive continuity remains), but his voice is an "animal squeak." In your gradient, speech is the primary tool of social reciprocity. Once he cannot negotiate, promise, or explain, he moves from "son/brother" to "dependent pet." They still feed him, but the relationship is now unilateral.
  *   **The Apple Incident (Body as Threat):** When his father bombards him with apples, one lodges in his back and rots. This shifts Gregor from "burden" to "aggressor." Moral status on a gradient often hinges on safety. A mammal that might bite is treated differently than one that won't. Even though Gregor didn't intend harm, his physical form is now read as hostile. His status drops from "invalid" to "pest."
  *   **The Violin Scene (The Failure of Affect):** This is the cruelest moment. Gregor crawls out, drawn by music. This is the peak of his human affective range—he appreciates art, he wants connection. But the boarders scream, and Grete says, "We must try to get rid of it." Why? Because his *attempt* at connection looks like an invasion. His inner life is invisible; his outer movement is terrifying. The gradient doesn't measure his love for the music; it measures the boarders' disgust.
  *   **The Cessation of Eating (Biological Reciprocity Ends):** Gregor stops eating not out of spite, but because his body is failing. For the family, this is the final signal. A creature that consumes resources without producing labor or even the *appearance* of recovery has hit the thermostat's zero. He is now purely entropic.

  ### 2. Inner Life vs. Social Function
  Does the novel treat his inner life as morally relevant? **No.**

  Kafka constructs a tragedy of the "Black Box." Gregor's consciousness remains largely intact for most of the story. He worries about his parents' debts; he feels shame; he experiences aesthetic joy. If moral status were intrinsic to sentience, Gregor would remain high on the scale.

  But the novel argues that moral status is **intersubjective**. It exists only when recognized by others. Gregor's inner life is morally irrelevant because it cannot be *performed*. Kafka suggests that appearance and social function don't just override cognition; they *eclipse* it. To the family, Gregor is not a mind in a bug suit; he is a bug that occasionally mimics a mind. The moment his physical utility (income) and physical relatability (face/voice) vanish, his cognitive continuity ceases to grant him standing.

  ### 3. Where the Story Resists the "Neat Gradient"
  If you present this as a clean slide down the scale, you'll miss the story's jagged edges. Here is where *The Metamorphosis* resists your philosophical model:

  *   **The Zero-Sum Dynamic:** In a standard gradient model, Gregor's status could theoretically remain stable even if low. But in the story, the family's moral status *rises* as his falls. As Gregor becomes more insect-like, Grete and the parents become more "human"—they get jobs, they socialize, they stretch their limbs. Their humanity is purchased with his dehumanization. Moral status here isn't intrinsic; it's a limited resource within the household economy.
  *   **Gregor's Complicity:** A neat gradient implies the subject fights to stay on the scale. Gregor doesn't. He internalizes their assessment. He agrees that he must go. He starves himself. If moral status is about sentience, why does the sentient being agree to be treated as a thermostat? Kafka suggests that without social recognition, we lose the will to maintain our own status.
  *   **The Abrupt Snap:** There is no logical threshold where Gregor crosses from "worthy of care" to "worthy of death." It happens on a whim after the violin scene. The gradient implies a smooth slope; Kafka gives us a cliff. The decision to let him die is not based on a new assessment of his sentience, but on the family's exhaustion.

  ### 4. What Kafka Adds to the Debate
  A straightforward philosophical argument about degrees of sentience is sterile. It asks, "What capacities grant rights?" Kafka asks, "What does it *feel* like to be the burden?"

  *   **The Phenomenology of Disgust:** Philosophy often ignores the visceral. Kafka centers it. The family's retreat isn't just logical; it's physical. The smell of the rotting apple, the dust under the couch, the sight of the mottled back. Kafka adds **affect** to the moral equation. We don't withdraw care because we calculate low sentience; we withdraw care because we feel disgust. A philosophical gradient can't account for the "yuck" factor, but Kafka shows it is the primary driver of moral exclusion.
  *   **The Exhaustion of Care:** Your model weighs the status of the *patient*. Kafka weighs the capacity of the *caretaker*. Grete's speech is the philosophical core of the story: "It's killing us." Kafka argues that moral status is not just about the being's rights, but the community's bandwidth. When care becomes total and unrewarded, the moral obligation collapses, regardless of the patient's sentience.
  *   **The Horror of Ambiguity:** Finally, Kafka denies us the comfort of knowing exactly what Gregor is. Is he a monster? A victim? A vermin? A philosophical gradient demands categorization to work. Kafka insists that the horror lies in the *uncategorizable*. Gregor is a glitch in the system. By refusing to let Gregor fit neatly into "insect" or "human," Kafka shows that our moral systems are brittle. They break when faced with something that is both and neither.

  **For the Book Club:**
  Push them to see that Gregor doesn't lose his humanity; he loses his **legibility**. The tragedy isn't that he became a bug. It's that being a bug made his love invisible. The philosophical takeaway isn't about where we draw the line on sentience, but about how dangerous it is to tie moral worth to the ability to make oneself understood.
