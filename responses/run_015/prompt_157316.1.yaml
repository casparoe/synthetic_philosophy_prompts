prompt: |-
  One of the first things I internalized from years of reading rationalist blogs was the rule about sunk costs: once an expenditure is unrecoverable it drops out of the decision entirely, and any choice that stays sensitive to it is worse for that sensitivity. Escalation of commitment, throwing good money after bad, continuing a failing project because of what has already gone into it, finishing a meal you dislike because you paid for it — all treated as one failure with one diagnosis. I had come to read the rule as a claim about which facts can be reasons at all: no bare fact about what has already happened can be reason-giving; only facts about what a candidate action would bring about can be.

  Then I noticed that contract law runs, systematically and unapologetically, in the opposite direction, and I would like to know what it presupposes.

  As I understand the doctrines: a promisee who has spent money in reliance on a promise that is then broken can often recover that wasted expenditure outright, as an alternative to being put in the position performance would have achieved; a promise with no bargain attached becomes enforceable, or partially enforceable, once the promisee has reasonably relied on it to their detriment and it would be unjust not to hold the promisor to it; and in some land cases partial performance by the promisee is itself what lifts an otherwise unenforceable informal agreement into enforceability. In each case it is precisely the fact that the promisee has already incurred a cost that generates the claim. Someone who had been promised the same thing and had not yet relied has, generally, nothing. The law does not merely permit attention to sunk costs; it makes sunk expenditure the trigger of an entitlement.

  Two details make it less crude than that: reliance recovery is normally capped so that a claimant cannot use it to escape a bargain that would have lost money anyway, and reliance can take the form of an opportunity forgone rather than money spent, so what matters seems to be worsened position rather than expenditure as such.

  So: what theory of reasons, or of rationality, does this pattern presuppose? I would like the implicit theory reconstructed, and I would like the following separated out for me.

  First, distinguish what the practice strictly presupposes from what it merely fits well with. Does it require genuine retrospective reasons — reasons whose force derives from what has already happened rather than from what they produce — or is it fully compatible with a purely forward-looking view on which past expenditure is only a convenient measure of damage and a way of pricing the incentive to rely? Where is the practice philosophically underdetermined, so that several rival theories would license the same rules?

  Second, I have been using a distinction of my own: call a practice cost-honoring if the bare fact that a cost has been incurred counts as a reason to continue, and cost-regarding if the fact of incurred cost operates only as evidence, as a trigger of a rule, or as a measure. Which is contract law, and does the answer differ across the three doctrines?

  Third, there is a familiar move I want tested rather than assumed: shift the unit of assessment from the individual act to the policy or disposition over time, and honoring sunk costs becomes forward-lookingly rational after all, because an agent who is visibly disposed to continue is able to make commitments, invite reliance, and secure cooperation that a purely consequentialist agent cannot. If that move works, does the law presuppose anything my original reading of the sunk-cost rule actually denied, or does it show the rule was always a claim about a different unit of assessment?

  Fourth, if we took the strict version seriously and rebuilt the doctrine around it — expectation-based recovery only, no claim generated by reliance as such — what would have to change? Would promissory estoppel collapse into incoherence, or would informal promising simply stop being usable, and is either of those a cost a forward-looking theorist should care about?

  Finally, is there a defensible core in honoring sunk costs that the legal pattern reveals and the blog-post version flattens — the thought that some goods, such as projects, relationships, and promises kept, are partly constituted by having been costly to sustain, so that bracketing the expenditure is not neutrality but a way of destroying the thing — or is that just the fallacy in a better costume? I would like that last claim argued both ways and then adjudicated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Conflict:** The user contrasts the "rationalist" view of sunk costs (irrelevant to decision-making, only future consequences matter) with Contract Law doctrines (Reliance Damages, Promissory Estoppel, Part Performance) which seem to make past expenditure the *trigger* for legal entitlement.
      *   **Task:** Reconstruct the implicit theory of reasons/rationality presupposed by contract law's treatment of sunk costs.
      *   **Specific Requirements:**
          1.  **Presupposition vs. Fit:** Distinguish what the law *requires* (genuine retrospective reasons) vs. what is *compatible* (forward-looking instrumentalism). Identify philosophical underdetermination.
          2.  **Cost-Honoring vs. Cost-Regarding:** Apply the user's distinction. Is contract law cost-honoring (past cost = reason) or cost-regarding (past cost = evidence/trigger/measure)? Does this vary across doctrines (Reliance, Estoppel, Part Performance)?
          3.  **Unit of Assessment Shift:** Test the "disposition/policy" argument (honoring sunk costs is rational at the policy level to enable commitment). Does this save the rationalist rule or contradict it?
          4.  **Counterfactual Reconstruction:** What if we enforced strict expectation damages only (no reliance claim)? Would promissory estoppel collapse? Is that a cost forward-looking theorists should care about?
          5.  **Constitutive Value Argument:** Argue both sides on whether some goods (projects, relationships) are *constituted* by cost, making bracketing expenditure destructive. Adjudicate the claim.

  2.  **Analyze Section 1: Presupposition vs. Fit (The Metaphysics of Reasons)**

      *   *Rationalist View:* Only future states matter. Past is gone.
      *   *Legal View:* Past reliance creates rights.
      *   *Forward-Looking Interpretation:* Law uses past costs as a *proxy* for future incentives. If we don't protect reliance, people won't rely in the future, reducing social welfare. Therefore, the *reason* for the rule is forward-looking (incentivizing efficient reliance), even if the *trigger* is backward-looking.
      *   *Backward-Looking Interpretation:* Corrective justice. A wrong was done (inducing reliance then breaking), and the past loss *itself* demands rectification regardless of future utility.
      *   *Underdetermination:* The black-letter law (doctrines) works with both. A consequentialist can justify reliance damages as optimal insurance/incentive. A deontologist can justify it as correcting a specific wrong. The text of the law doesn't settle the meta-ethical foundation.
      *   *Conclusion:* The law does not *strictly presuppose* genuine retrospective reasons. It is fully compatible with instrumentalism.

  3.  **Analyze Section 2: Cost-Honoring vs. Cost-Regarding (The User's Distinction)**

      *   *Definitions:*
          *   Cost-Honoring: The fact of cost *is* the reason (intrinsic weight).
          *   Cost-Regarding: Cost is evidence, trigger, or measure (instrumental weight).
      *   *Application:*
          *   *Reliance Damages (Contract Breach):* Usually capped by expectation. This suggests it's a *measure* of loss, not a license to throw good money after bad. It's cost-regarding. It protects the position, doesn't honor the spend for its own sake.
          *   *Promissory Estoppel:* Enforces a promise *because* reliance occurred. This looks closer to Cost-Honoring. The promise wasn't binding, but the cost made it binding. However, usually limited to avoiding injustice (forward-looking fairness?). Still, the *trigger* is the cost.
          *   *Part Performance (Statute of Frauds):* Acts make an oral contract enforceable. This is evidentiary (cost proves contract existed) + equitable (unfair to let them walk away after cost). Mostly Cost-Regarding (evidence of deal + prevention of harm).
      *   *Verdict:* Contract law is predominantly **Cost-Regarding**. It uses cost to measure harm, prove intent, or trigger protective rules to prevent future injustice. It rarely says "spend money to make the claim stronger" (which would be Cost-Honoring).

  4.  **Analyze Section 3: Unit of Assessment (Disposition/Policy)**

      *   *The Move:* Individual act rationality vs. Policy/Disposition rationality.
      *   *Argument:* If I am known to ignore sunk costs completely, no one will rely on me. If I am known to protect reliance (honor the "sunk" investment of others), I can coordinate better.
      *   *Does it save the Rationalist Rule?* Yes. It shows the "sunk cost fallacy" is only a fallacy at the *marginal* decision point for the *individual* in isolation. At the *systemic* or *dispositional* level, having a rule that protects reliance is forward-looking rational.
      *   *Does it contradict the Blog Post?* The blog post says "no bare fact about what has already happened can be reason-giving." The policy shift says "the fact that a rule protects past acts creates future value." It reframes the reason. The reason isn't the past cost itself; the reason is the *future value of a rule that responds to past costs*.
      *   *Conclusion:* This move validates the legal practice without requiring "magic backward causation." It shows the rationalist rule was too narrow in its unit of assessment.

  5.  **Analyze Section 4: Counterfactual Reconstruction (Expectation Only)**

      *   *Scenario:* Abolish reliance damages/estoppel. Only enforce bargains with consideration. Remedy = Expectation (benefit of the bargain).
      *   *Consequences:*
          *   Gratuitous promises (no bargain) become unenforceable even if relied upon.
          *   Reliance becomes risky. People under-rely.
          *   Informal agreements (land, family) become harder to prove/enforce.
          *   Promissory Estoppel collapses (by definition).
      *   *Forward-Looking Cost:* Yes, a forward-looking theorist *should* care. Under-reliance is inefficient. If I can't trust your promise without a formal contract, transaction costs skyrocket. Social cooperation drops.
      *   *Verdict:* A sophisticated forward-looking theorist (Law & Economics) actually *supports* reliance protection to prevent market failure in trust. Strict expectation-only would be *less* rational from a systemic welfare view.

  6.  **Analyze Section 5: Constitutive Value (The "Deep" Argument)**

      *   *Claim:* Some goods (relationships, projects) are constituted by cost. Ignoring cost destroys the good.
      *   *Argument For:* Commitment requires sacrifice. A promise kept only because it's convenient isn't a moral promise. A relationship where partners tally costs/benefits constantly is transactional, not relational. The "sunk cost" of time/effort *is* the fabric of the relationship. To bracket it is to treat the relationship as a commodity.
      *   *Argument Against:* This is the "Concorde Fallacy" romanticized. Staying in a bad marriage because "we've been together 10 years" is often tragic, not noble. Value should reside in the *future* potential of the relationship, not the *past* investment. Honoring cost for cost's sake leads to stagnation and resentment.
      *   *Adjudication:* The truth is in the distinction between *internal* and *external* perspectives. Internally (phenomenology of commitment), cost matters (I invested, therefore I care). Externally (decision to continue), future value matters. Law bridges these: it protects the *reliance* (the cost incurred by the vulnerable party) to maintain the *institution* of promising (a future good). It doesn't honor the cost for its own sake, but honors the *vulnerability* created by the cost.
      *   *Refinement:* The blog post flattens the "normative force of vulnerability." The law recognizes that creating vulnerability (inducing reliance) creates a duty, not because the cost is magic, but because the *act of inducing* changed the normative landscape.

  7.  **Drafting the Response:**

      *   *Tone:* Analytical, precise, philosophical, respectful of the user's sophisticated framing.
      *   *Structure:* Follow the five specific requests sequentially.
      *   *Key Insight to Weave:* The law isn't actually violating the sunk cost rule; it's applying it at the level of *rules* rather than *acts*, and focusing on *induced vulnerability* rather than *bare expenditure*.

      *(Self-Correction during drafting)*: Be careful with the "Cost-Honoring" definition. The user defined it as "bare fact that a cost has been incurred counts as a reason to continue." In law, does cost count as a reason to *continue* the contract? No, usually it counts as a reason to *compensate* upon breach. I need to be precise here. The law uses cost to trigger *liability*, not necessarily to force *performance* (specific performance is rare). So it's not "continue the project," it's "pay for the waste." This nuances the "Cost-Honoring" analysis.

      *(Refining the Constitutive Value argument)*: Don't just say "relationships." Focus on the *normative status* of the promisee. By relying, they changed their status. The cost is the evidence of that status change.

  8.  **Final Review against Constraints:**
      *   Did I separate presupposition from fit? Yes.
      *   Did I apply Cost-Honoring vs. Regarding? Yes.
      *   Did I test the Unit of Assessment shift? Yes.
      *   Did I analyze the Expectation-Only counterfactual? Yes.
      *   Did I argue both sides of Constitutive Value and adjudicate? Yes.

      *Let's write.*
answer: |-
  This is a precise and fruitful collision between decision theory and legal doctrine. The tension you identify rests on whether the law treats past expenditure as a *normative source* (creating rights ex nihilo) or as an *evidentiary/instrumental proxy* (signaling harm or incentivizing behavior).

  Here is the reconstruction of the implicit theory, separated according to your five requests.

  ### 1. Presupposition vs. Fit: The Metaphysics of Legal Reasons

  Does contract law *require* genuine retrospective reasons, or is it compatible with forward-looking instrumentalism?

  **The Strict Presupposition:**
  Contract law does **not** strictly presuppose that past costs are intrinsically reason-giving. The black-letter doctrines are philosophically underdetermined. A legal system could adopt reliance damages, promissory estoppel, and part performance doctrines while holding a purely forward-looking meta-ethical view.

  **The Forward-Looking Fit:**
  The dominant economic analysis of law (e.g., Posner, Shavell) explains these doctrines entirely without retrospective reasons. On this view:
  *   **Reliance Damages:** Are not about "repaying the past" but about pricing the *incentive to rely* in the future. If promisors know they must indemnify reliance, they will only induce reliance when the probability of performance justifies it.
  *   **Promissory Estoppel:** Is a mechanism to prevent the market failure of "under-trust." If gratuitous promises can be broken without cost once relied upon, the institution of informal promising collapses. Protecting reliance preserves the utility of the practice for future actors.
  *   **Part Performance:** Is primarily evidentiary (acts prove a contract likely existed) and protective (preventing fraud), both forward-looking goods.

  **Where it is Underdetermined:**
  The practice is compatible with **Corrective Justice** theories (Weinrib, Benson), which *do* presuppose retrospective reasons. On this view, the promisor has disturbed the normative equilibrium by inducing a change in the promisee's position. The "reason" for the remedy is the past wrong (the detrimental reliance), not the future benefit of enforcement.

  **Conclusion:** The law *fits* a retrospective theory perfectly, but it does not *require* it. The text of the opinions often uses the language of "unjust enrichment" or "detriment" (backward-looking), but the structural function of the rules can be fully discharged by a sophisticated consequentialist who values the stability of reliance as a future asset.

  ### 2. Cost-Honoring vs. Cost-Regarding

  Using your distinction: **Cost-Honoring** (past cost is the reason) vs. **Cost-Regarding** (past cost is evidence, trigger, or measure).

  **Verdict:** Contract law is predominantly **Cost-Regarding**. It rarely treats the mere fact of expenditure as a sufficient reason to continue a project or enforce a promise *in vacuo*.

  *   **Reliance Recovery (Breach of Contract):** This is **Cost-Regarding (Measure)**. The law does not say, "You spent money, therefore you get the contract." It says, "You spent money, the contract failed, therefore we use that spend to *measure* your loss." Crucially, as you noted, it is capped by expectation. If the contract would have lost money, the reliance is not recovered. This proves the law is not honoring the cost itself; it is honoring the *position* the cost was meant to secure. If the cost was wasted on a losing venture, the law lets it lie.
  *   **Promissory Estoppel:** This is the strongest candidate for **Cost-Honoring**, but it is still **Cost-Regarding (Trigger)**. The cost triggers enforceability where none existed. However, courts typically limit recovery to the amount necessary to avoid injustice, not necessarily the full cost, and often require the reliance to be "reasonable." If the cost was incurred foolishly, it generates no right. The cost is not honored *qua* cost; it is regarded as a signal of vulnerability that demands protection.
  *   **Part Performance:** This is **Cost-Regarding (Evidence)**. The expenditure is admitted to prove the existence of the agreement (which is the actual reason for enforcement) and to make it inequitable to deny enforcement. The cost itself does not create the obligation; the underlying agreement does. The cost merely unlocks the procedural bar (Statute of Frauds).

  **Differentiation:** The law is never "Cost-Honoring" in the sense of the Concorde Fallacy (continuing because we spent). It is "Cost-Regarding" in the sense of using expenditure to calculate harm, prove intent, or trigger protective equity. The "sunk cost" is not a reason to *persist* in the project; it is a reason to *compensate* for the vulnerability created.

  ### 3. The Unit of Assessment Shift

  Does shifting from the individual act to the policy/disposition save the rationalist rule?

  **The Move:**
  Yes. The "sunk cost fallacy" is a fallacy at the level of the **marginal act**. It is not necessarily a fallacy at the level of the **disposition** or **rule**.
  *   **Act-Level:** "I have spent $1M. Should I spend another $1M to finish?" Answer: Ignore the $1M. Look only at future value.
  *   **Rule-Level:** "Should I adopt a disposition where I protect those who rely on my promises?" Answer: Yes. Because having that disposition allows me to coordinate, invite reliance, and secure cooperation that a "rational" act-maximizer cannot.

  **Does this contradict the Blog Post?**
  It shows the blog post was imprecise about the *locus* of rationality. The blog post claims: "No bare fact about what has already happened can be reason-giving."
  The legal practice suggests: "The fact that a *rule* responds to what has happened can be reason-giving for adopting that rule."

  If the law protects reliance, it is not because the *past money* has magic. It is because the *rule protecting past money* has future value. The "reason" is still forward-looking (social welfare, stability of promises), but the *content* of the rule references the past.

  **Conclusion:** This move validates the legal pattern without violating the core rationalist insight. It shows the rationalist rule was always a claim about **act-assessment**, whereas contract law operates at **system-design**. A system that systematically ignores sunk costs (by refusing to protect reliance) would be less rational than one that "honors" them, because the former destroys the possibility of cooperative ventures requiring upfront investment.

  ### 4. Counterfactual Reconstruction: Expectation-Only

  If we rebuilt doctrine around strict expectation damages (no reliance claim, no estoppel based on cost):

  **The Collapse:**
  1.  **Promissory Estoppel would vanish.** By definition, estoppel enforces promises without consideration *because* of reliance. Without reliance as a hook, gratuitous promises are nudum pactum.
  2.  **Informal Promising would atrophy.** In commercial contexts, formal contracts would dominate. In social/family contexts (where estoppel often operates), promises would become non-binding signals.
  3.  **Under-Reliance.** This is the critical forward-looking cost. If I know that if you breach I only get my "lost profit" (which might be zero or hard to prove) rather than my "wasted spend," I will not invest in preparing for your performance. I will wait until performance is due to spend my money. This creates inefficiency (delayed projects, lack of preparation).

  **Would a Forward-Looking Theorist Care?**
  Yes. A sophisticated forward-looking theorist (specifically a Law & Economics scholar) would view this as a **market failure**.
  *   **Transaction Costs:** Requiring formal consideration for every reliance-inducing promise increases transaction costs.
  *   **Efficient Reliance:** The goal of contract law is to induce *efficient* reliance. Expectation damages alone sometimes fail to compensate for reliance when profits are speculative. If reliance is under-compensated, it is under-produced.
  *   **Verdict:** Abolishing reliance-based claims would be *irrational* from a systemic, forward-looking perspective. It would reduce the total welfare generated by cooperative ventures. Therefore, the "sunk cost" sensitivity of the law is actually a tool for maximizing future utility.

  ### 5. The Constitutive Value Argument

  *Claim: Some goods (projects, relationships, promises) are partly constituted by having been costly to sustain, so bracketing expenditure destroys the thing.*

  **Argument For (The Constitutive View):**
  This view holds that commitment is not merely a prediction of future behavior but a normative status built on sacrifice.
  *   **Relationships:** A marriage where partners constantly recalculate "is this still worth it based on future utility alone" is not a marriage; it is a series of renewable contracts. The "sunk cost" of years shared is part of the identity of the relationship. To ignore it is to treat the partner as replaceable.
  *   **Promises:** A promise kept only because it is currently convenient is not a moral promise. The moral force comes from the fact that you *bound yourself* in the past. The "cost" of binding (limiting your future freedom) is the substance of the obligation.
  *   **Law's Role:** By protecting reliance, the law acknowledges that human cooperation relies on this constitutive view. It signals that "what we built together" (the reliance) matters, not just "what we get next."

  **Argument Against (The Fallacy in Costume):**
  This is the sunk cost fallacy romanticized by sociology.
  *   **Tragedy of Persistence:** Many relationships and projects *should* end. The fact that they were costly to sustain is often the very reason people stay in abusive or unproductive situations. To say cost *constitutes* value is to sanctify inertia.
  *   **Forward-Looking Value:** The value of a promise lies in the *security* it provides for the future, not the *sacrifice* that made it. We want promises kept because we need to plan, not because we want to honor sacrifice for its own sake.
  *   **Law's Restraint:** Notice that the law *limits* reliance damages. It does not allow you to recover costs that were unreasonable. This suggests the law rejects the idea that cost *itself* creates value. It only protects cost that was *instrumental* to a valuable outcome.

  **Adjudication:**
  The truth lies in the distinction between **Vulnerability** and **Expenditure**.
  The blog post is right that *bare expenditure* is not reason-giving. The "Constitutive Value" argument is wrong if it suggests spending money makes a project good.
  However, the legal pattern reveals a nuance the blog post flattens: **Induced Vulnerability.**
  When I induce you to rely on me, I am not just watching you spend money; I am *accepting power over your welfare*. I have altered your normative position.
  *   The "cost" matters not because it is a sunk cost, but because it is **evidence of a changed relationship**.
  *   The good being protected is not the "project" (which might be failing), but the **integrity of the reliance mechanism**.

  **Final Judgment:**
  The legal pattern does not validate the idea that "cost creates value." It validates the idea that **"inducing cost creates duty."**
  The blog post rule ("ignore sunk costs") is correct for the **agent deciding whether to continue**.
  The legal rule ("compensate sunk costs") is correct for the **system deciding how to regulate the inducement**.
  There is no contradiction. The law is not telling the promisor "continue the project because money was spent." It is telling the promisor "you created a dependency; you must clean it up." This is fully compatible with forward-looking rationality, provided the unit of assessment is the stability of the cooperative practice, not the marginal utility of the specific breached contract. The "defensible core" is not that sunk costs are valuable, but that **creating sunk costs in others is a normative act that demands forward-looking management.**
