prompt: |-
  I've been using a chat model to help with my historical novel, and I keep runin into this wall. If I ask it directly about the kind of thing I need — say, how the customs house in 1860s Marseille actually worked, or what the silk merchants' guilds were called — it hedges, says it doesn't know, or just makes stuff up. But if I write half a scene where a character is doing the paperwork and ask it to keep going, it spits out details that look right. And if I tell it to act like an expert on 19th century French port administration, it suddenly knows a lot, except some of it is confidently wrong. I'm starting to wonder if I'm just using it wrong. What's actually going on, and how should I set up my workfow around it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is writing a historical novel (1860s Marseille).
      *   **Issue:** Direct factual queries ("How did the customs house work?", "What were guilds called?") result in hedging, ignorance, or hallucinations.
      *   **Observation:** Contextual prompts (writing a scene, asking to continue) yield better, more plausible details. Role-playing prompts ("Act like an expert") yield high confidence but mixed accuracy (confidently wrong).
      *   **Goal:** Understand *why* this happens and establish a better workflow for historical accuracy in fiction writing.

  2.  **Diagnose the Underlying Mechanism (The "Why"):**
      *   *LLM Nature:* LLMs are pattern matchers, not databases. They predict the next token based on training data.
      *   *Direct Queries:* When asked a specific fact, the model searches its weights for a direct association. If the data is sparse (niche historical details), it might hallucinate to satisfy the "helpful assistant" imperative. It knows it *should* know, so it guesses.
      *   *Contextual/Scene Prompts:* When embedded in a narrative, the model switches from "fact retrieval mode" to "creative writing mode." It prioritizes *verisimilitude* (what feels right) over strict factual accuracy. This often *looks* more accurate because it's drawing on tropes and atmospheric details found in similar historical fiction in its training data.
      *   *Role-Playing:* "Act like an expert" triggers a persona. This increases confidence (temperature/tonality shift) but doesn't actually grant access to new data. It often amplifies hallucinations because the persona demands authority even where knowledge is lacking.
      *   *The "Wall":* The user is hitting the limit of the model's training data regarding specific, granular historical facts vs. its strength in narrative flow and atmospheric consistency.

  3.  **Formulate the Explanation:**
      *   Acknowledge the user's observation (it's astute).
      *   Explain the difference between *retrieval* (facts) and *generation* (narrative).
      *   Explain why "Act like an expert" is dangerous (confidence $\neq$ accuracy).
      *   Explain why scene-based prompting works better (verisimilitude).

  4.  **Develop a Workflow Strategy:**
      *   *Phase 1: Broad Strokes (The Model is Good).* Use the model for atmosphere, sensory details, social dynamics, and plausible procedures.
      *   *Phase 2: Fact-Checking (The Human is Good).* The user *must* verify specific names, dates, and structures. The model is a drafter, not a verifier.
      *   *Phase 3: Prompt Engineering.* How to ask questions to minimize hallucination.
          *   Avoid: "What is the name of..."
          *   Prefer: "What are the *likely* terms..." or "Give me options..."
          *   Use: "Search mode" (if available) or RAG (Retrieval-Augmented Generation) concepts manually.
      *   *Phase 4: Iterative Refinement.* Write the scene, then flag the uncertain bits for research.

  5.  **Drafting the Advice (Iterative refinement):**

      *   *Intro:* Validate the experience. It's a common phenomenon.
      *   *The "Why":* Break down the token prediction vs. database distinction. Explain "Verisimilitude vs. Accuracy."
      *   *The "Expert" Trap:* Warn against persona prompting for facts.
      *   *The Workflow:*
          1.  **Research First (Human):** Get the hard facts (guild names, specific laws) from books/archives. Feed *that* to the AI.
          2.  **AI for Texture:** Use AI to flesh out the *experience* of the facts (smells, paperwork flow, dialogue).
          3.  **Prompting Technique:** "Uncertainty tagging." Ask the AI to flag what it's unsure about.
          4.  **Verification:** Treat AI output as a first draft, not a source.
      *   *Specific Tips for Marseille 1860s:* Mention the Second Empire, the port's status, specific terms (Douane, Octroi, etc.) to show understanding.

  6.  **Refining the Tone:**
      *   Empathetic (writing is hard).
      *   Analytical (explain the tech).
      *   Practical (give actionable steps).
      *   Cautionary (don't trust it blindly).

  7.  **Self-Correction/Edge Case Consideration:**
      *   *Wait, does the model have browsing?* I should mention that if the model has web access, that changes things. But assuming a standard context window model, the advice holds. I'll add a note about browsing tools.
      *   *Is the user asking for specific facts?* I need to make sure I don't just answer the Marseille question (which might be hallucinated by me too!) but teach them how to find it. *Correction:* I can provide some general known facts to be helpful, but emphasize verification. (Actually, better to stick to the methodology to avoid reinforcing the "ask the AI for facts" habit).
      *   *Key Insight:* The user noticed that *narrative context* improves output. This is because the training data contains more historical *fiction* than historical *ledgers*. The model mimics the fiction. This is a crucial point to make.

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Worldbuilding" (AI good) and "Fact-Checking" (Human good) is clear. (This matches the thought process in step 5).

  9.  *(Self-Correction during drafting)*: I need to be careful not to hallucinate in my own response. I know Marseille in the 1860s was under Napoleon III, the port was booming, the Suez Canal opened in 1869. Guilds were actually abolished during the French Revolution (Le Chapelier Law 1791), so "silk merchants' guilds" in 1860 might be an anachronism. *This is a perfect example to use.* I should point out that the AI might confidently invent a guild name because it sounds right, even if guilds didn't exist then. This proves the point about "confidently wrong."

  10. **Final Structure:**
      *   Validation: You're not using it wrong; you're discovering its architecture.
      *   The Mechanism: Prediction vs. Truth.
      *   The "Expert" Trap.
      *   The "Scene" Success (Verisimilitude).
      *   The Proposed Workflow (Research -> Feed -> Generate -> Verify).
