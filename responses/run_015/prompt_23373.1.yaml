answer: |-
  You are not using it wrong. You have intuitively discovered the fundamental architecture of Large Language Models (LLMs) through trial and error. What you are experiencing is the difference between **retrieval**, **generation**, and **verisimilitude**.

  Here is what is actually happening under the hood, and how to build a workflow that leverages the model's strengths while protecting your novel from historical errors.

  ### 1. The Diagnosis: Why the Model Behaves This Way

  **Direct Questions = Hallucination Risk**
  When you ask, *"What were the silk merchants' guilds called?"*, the model searches its weights for a direct factual association. If that specific fact isn't strongly represented in its training data, it faces a conflict: it wants to be helpful, but it doesn't know. To resolve this, it predicts the most *probable* sounding answer based on linguistic patterns. It isn't lying; it's completing a pattern. This is why it hedges or makes things up.

  **Role-Playing = Confidence Without Accuracy**
  When you say, *"Act like an expert,"* you are changing the model's **tone**, not its **knowledge**. You are telling it to suppress uncertainty markers (like "I think" or "possibly"). This results in "confidently wrong" output. The model is now committed to the persona of someone who *knows*, so it will fabricate details to maintain the character of the expert.

  **Scene Writing = Verisimilitude (The "Feels Right" Factor)**
  When you write half a scene and ask the model to continue, you switch its mode from **Fact Retrieval** to **Narrative Generation**.
  *   **Why this works better:** The model has read thousands of historical novels set in similar periods. It knows the *texture* of 19th-century bureaucracy (the ink, the stamps, the deference, the paperwork flow).
  *   **The Catch:** It is prioritizing *narrative truth* over *historical truth*. It will generate a document that looks perfect and feels authentic, but the form number or the specific title of the clerk might be invented. It is mimicking the *style* of history, not the *data* of history.

  ### 2. The Critical Historical Trap (A Marseille Example)

  To prove why you need a new workflow, consider your specific example: **Silk Merchants' Guilds in 1860s Marseille.**

  *   **The Historical Reality:** Guilds (*corporations*) were abolished in France during the Revolution (Le Chapelier Law, 1791). By the 1860s (Second Empire), they did not legally exist. Trade was regulated by Chambers of Commerce (*Chambres de Commerce*) and specific customs laws (*Douane*).
  *   **The AI's Likely Failure:** If you ask directly, it might hallucinate a guild name because "Silk Guild" is a strong linguistic association with "19th Century Trade." If you tell it to act like an expert, it will confidently invent a guild name and give you a history for it.
  *   **The AI's Success:** If you write a scene about a merchant arguing over tariffs, the AI will likely capture the *tension* and the *bureaucratic language* correctly, even if it gets the specific legal body wrong.

  ### 3. The Recommended Workflow: "Human Architect, AI Mason"

  Do not use the AI as a librarian. Use it as a **draftsman**. You must provide the blueprints (facts); it provides the brickwork (texture).

  #### Step 1: The "Hard Fact" Pass (Human-Led)
  Before prompting the AI, do a quick "skeleton check" on the hard constraints. Use Google Books, JSTOR, or specialized history forums for specific nouns.
  *   *Find:* The actual name of the customs authority (e.g., *Administration des Douanes*).
  *   *Find:* The actual legal status of merchants (e.g., *Négociant* vs. *Marchand*).
  *   *Find:* Specific locations (e.g., La Joliette vs. Vieux-Port).
  *   **Action:** Write these down in a "Bible" document. Do not trust the AI to generate these proper nouns.

  #### Step 2: The Context Injection (Prompting)
  Feed the facts you found *into* the prompt. Don't ask the AI to find them; tell it what they are.
  *   **Bad Prompt:** "What forms did the customs clerk use?"
  *   **Good Prompt:** "I am writing a scene in 1865 Marseille. The customs authority is the *Administration des Douanes*. The merchant is a *négociant*. Based on this context, describe the sensory experience of the clerk processing the paperwork. Focus on the ink, the stamps, and the delay tactics. **Do not invent specific form names; just refer to them as 'the manifest' or 'the ledger'.**"

  #### Step 3: The "Uncertainty Tagging" Request
  When you need the AI to speculate on things you can't verify, ask it to flag its own uncertainty.
  *   **Prompt:** "Suggest three possible procedures for how silk was unloaded. **For each suggestion, rate your confidence level and tell me which parts are historically speculative so I can research them.**"
  *   This forces the model out of the "confident expert" persona and into a "collaborative assistant" persona.

  #### Step 4: Narrative Generation (The Sweet Spot)
  This is where your observation shines. Use the AI to flesh out the *experience* of the facts you verified.
  *   **Prompt:** "Here are the facts: The clerk is corrupt, the tax is 5%, and the paperwork is in triplicate. Write the scene where the protagonist tries to bribe the clerk. Focus on the dialogue and the subtle exchanges."
  *   The AI excels here. It doesn't need to know the exact law to write a compelling scene about bending the law.

  ### 4. Specific Prompting Tactics for Historical Fiction

  **1. The "Period Voice" Filter**
  Instead of asking for facts, ask for linguistic texture.
  *   *"Generate a list of 10 slang terms or formal titles a dockworker in 1860s Marseille might use. Mark any that you are unsure about."*

  **2. The "Negative Constraint"**
  Explicitly tell the model what *not* to do.
  *   *"Do not invent specific names for laws or guilds. If a specific name is needed, use a placeholder like [CUSTOMS FORM TYPE]."*

  **3. The "Anachronism Check"**
  After the AI generates a scene, run a follow-up prompt specifically designed to audit the output.
  *   *"Review the scene above. List any potential anachronisms regarding technology, slang, or bureaucracy that might be inaccurate for 1865 France. Be critical."*

  ### Summary
  You are hitting the wall because you are asking a **creative engine** to function as a **database**.

  *   **Stop asking:** "What is X called?"
  *   **Start saying:** "X is called [Fact I Verified]. Here is a scene where X happens. Make it feel real."

  Your intuition about the scene-based prompting was correct: the model is better at **simulating reality** than **recalling it**. Build your workflow around that strength. Verify the nouns yourself; let the AI handle the verbs and the adjectives.
