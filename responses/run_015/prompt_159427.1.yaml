answer: |-
  Here is a principle designed to handle your cases, written tightly enough for print, followed by the straight talk you asked for regarding where it breaks and where you might need to adjust your intuitions.

  ### The Principle: Indispensable Causal-Structural Role

  **A mathematical element of a physical theory corresponds to physical reality if and only if it satisfies at least one of the following three clauses:**

  1.  **The Invariance Clause:** The element is invariant under the theory's gauge symmetries. If two mathematical descriptions differ only by a transformation that leaves all physical predictions unchanged (a gauge transformation), the varying structure is surplus; the invariant structure is real.
  2.  **The Efficacy Clause:** The element plays a determinative role in the causal evolution of the system *within the model*. If removing the element leaves the model's internal mechanism for producing specific outcomes intact, the element is surplus.
  3.  **The Nomological Continuity Clause:** The element is inaccessible to observation, but positing its existence preserves the uniformity of physical laws across space and time, whereas denying it requires positing a brute discontinuity in the laws of nature at the boundary of observability.

  ***

  ### How the Principle Handles Your Cases

  **1. Absolute Position (Newton) & Ether Rest Frame (Lorentz)**
  *   **Verdict:** Not Real.
  *   **Clause:** **Invariance.**
  *   **Reasoning:** In Newtonian mechanics, shifting all positions by a constant vector changes the math but not the forces or trajectories. In Lorentz's ether, the contraction hypothesis ensures the rest frame leaves no mark on measurements. Both are variant structures under symmetry transformations. They are coordinate artifacts, not ontology.

  **2. Vector Potential (Aharonov–Bohm)**
  *   **Verdict:** Potential is Not Real; Holonomy is Real.
  *   **Clause:** **Invariance.**
  *   **Reasoning:** You can change the value of the vector potential $\mathbf{A}$ at any point via a gauge transformation without changing physics. However, the loop integral $\oint \mathbf{A} \cdot d\mathbf{l}$ (the holonomy) is gauge-invariant. The principle identifies the invariant holonomy as the real physical structure, not the local field value.

  **3. Ghost Molecules**
  *   **Verdict:** Not Real.
  *   **Clause:** **Efficacy.**
  *   **Reasoning:** Within the model, these molecules exert no forces and influence no collisions. Removing them changes the state description but not the causal evolution of the gas. They are causally inert decoration.

  **4. Decay Clock (Hidden Variable)**
  *   **Verdict:** Real (within the context of the theory).
  *   **Clause:** **Efficacy.**
  *   **Reasoning:** Unlike the ghost molecules, the clock *does* work within the model. It is the specific mechanism that determines *when* the decay happens. Removing it forces the model to treat the decay time as brute fact rather than determined outcome. (More on the fragility of this verdict below).

  **5. Cosmological Horizons & Other's Toothaches**
  *   **Verdict:** Real.
  *   **Clause:** **Nomological Continuity.**
  *   **Reasoning:** We cannot see beyond the horizon or feel another's pain. However, denying the existence of the horizon region requires a law of physics that says "space stops existing here" or "laws change here." Denying the toothache requires a law that says "consciousness ceases when unobserved." Positing their existence maintains the uniformity of General Relativity and neuroscience across space and observers.

  **6. Atoms (1890)**
  *   **Verdict:** Real.
  *   **Clause:** **Nomological Continuity** (and nascent **Efficacy**).
  *   **Reasoning:** While not directly imaged, atoms provided the only coherent causal account for stoichiometry and Brownian motion without requiring magical discontinuities in chemical laws.

  ***

  ### The Straight Talk: Where the Principle Bites

  You asked me to be honest about your verdicts. Here is the friction.

  **1. The Decay Clock vs. Ghost Molecules**
  You feel these are different; my principle agrees, but for a reason that might unsettle you.
  *   **The Difference:** Ghost molecules are *causally inert* (they do nothing). Decay clocks are *causally efficacious* (they trigger the decay).
  *   **The Problem:** The Decay Clock is empirically equivalent to standard Quantum Mechanics. Standard QM says there is *no* clock; the decay is fundamentally probabilistic. Your intuition that the clock is "real" stems from a metaphysical preference for determinism, not empirical necessity.
  *   **My Recommendation:** **Overturn your verdict on the Decay Clock.** Under the *Invariance Clause*, if two theories (Standard QM vs. Clock QM) make identical predictions, the simpler ontology (Standard QM) is preferred unless the Clock offers explanatory power that Standard QM *cannot*. Saying "it explains why atom A decayed before atom B" is not an explanation if the clock settings themselves are random and uncaused. It just pushes the randomness back one step. Unlike Atoms (1890), which explained *observable* ratios, the Clock explains *unobservable* variance. It is ontologically suspect.

  **2. The Horizon Regions**
  My principle saves these via **Nomological Continuity**. However, this relies on the assumption that the laws of physics *are* uniform. If a theory of Quantum Gravity emerges suggesting information is truly lost at horizons (firewalls, etc.), this verdict could flip. For now, "Real" is the robust scientific stance, but it is theoretically vulnerable.

  ***

  ### The Two Unlisted Cases

  **1. Everettian Branches (Many-Worlds)**
  *   **Principle Verdict:** **Real.**
  *   **Reasoning:** In Everettian QM, the wavefunction evolves unitarily. The "branches" are not added structure; they are the result of the standard Schrödinger equation applied to macroscopic systems. To deny the reality of the other branches while keeping the wavefunction real requires a "collapse" mechanism (violating the equation) or a rule that says "only the branch I am on exists" (violating **Nomological Continuity** across the Hilbert space). If the math is real, the branches are real.

  **2. Black Hole Interior (Outside Observer)**
  *   **Principle Verdict:** **Ambiguous / Theory-Dependent.**
  *   **Reasoning:** Classical General Relativity satisfies **Nomological Continuity**: the interior exists smoothly. However, Black Hole Complementarity suggests that, for an outside observer, the interior description is redundant with the horizon description (a form of **Invariance**). If the interior variables are dual to horizon variables, the interior might be surplus structure relative to the outside observer's causal patch. The principle says: Real in Classical GR, potentially surplus in Quantum Gravity.

  ***

  ### My Hard Test Case: The Wavefunction Itself

  **The Case:** Is the quantum wavefunction ($\Psi$) a real physical field, or just a catalog of our knowledge (epistemic)?
  *   **Why it tests the principle:** $\Psi$ lives in a 3N-dimensional configuration space, not 3D space.
  *   **Application:**
      *   If $\Psi$ is epistemic, it fails the **Efficacy Clause** (knowledge doesn't cause interference).
      *   If $\Psi$ is real, it passes **Efficacy** (it determines probabilities) but strains **Nomological Continuity** (why do we live in 3D if reality is 3N-dimensional?).
      *   **The Hard Question:** Recent "PBR Theorem" results suggest that if distinct quantum states correspond to distinct physical realities, $\Psi$ must be real. My principle leans toward **Real** because removing $\Psi$ removes the causal mechanism for interference patterns (Aharonov-Bohm, Double Slit). But accepting it forces us to accept high-dimensional ontology, which feels like "surplus structure" to our 3D intuitions. This is the frontier where the principle forces a choice between "3D Intuition" and "Causal Efficacy."

  ### Summary for Your Feature

  If you quote one thing, make it this distinction: **Surplus structure is not just "unobservable." It is "causally inert" or "gauge-variant."**

  *   **Absolute Space** is variant (Invariance).
  *   **Ghost Molecules** are inert (Efficacy).
  *   **Horizon Regions** are invariant and efficacious in their own patch (Continuity).
  *   **The Decay Clock** is the danger zone. It is efficacious *in the model*, but the model itself may be surplus to requirements. I urge you to classify the Clock not as "Real," but as "Metaphysically Motivated Surplus." It satisfies a desire for a clockwork universe, not the demand for indispensable causal explanation.

  Your gut was right to separate the Ghost Molecules from the Clock, but likely wrong to grant the Clock full ontological citizenship. It is a visa holder, not a citizen.
