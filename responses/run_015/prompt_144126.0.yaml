  Most philosophical discussions distinguish lying—asserting a falsehood with intent to deceive—from misleading, which causes a false belief without asserting anything false, often through omission, emphasis, or selective framing. I have noticed a recurring communicative pattern that seems to sit in a gap between these two categories, and I want to know whether philosophers have named it precisely.

  The pattern works like this. A speaker makes a series of statements, each of which is literally true in isolation. However, the speaker has carefully engineered the surrounding context: the order of presentation, the metaphors used to frame the issue, the selective highlighting of certain facts, and the strategic omission of connecting explanations that are not technically required but are contextually expected. The result is an informational environment in which a reasonable listener is guided, almost inevitably, to form a specific false belief. When the listener later challenges that belief, the speaker does not defend the framing work they performed. Instead, they retreat to the literal truth of each individual sentence, insisting that they never said anything false and that the listener is solely responsible for the misinterpretation. What makes this different from a standard case of “misleading but technically true” is that the deception is not located in any single omission or ambiguous phrase; it is distributed across the curated architecture of context that makes the true propositions function together as a misleading system.

