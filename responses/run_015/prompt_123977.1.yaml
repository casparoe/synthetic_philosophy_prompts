answer: |-
  **PROJECT TITLE:** The Diachronic Veil: Harsanyi's Aggregation Theorem and the Metaphysics of Temporal Identity
  **DURATION:** Six Months
  **FIELD:** Formal Philosophy / Decision Theory

  **I. Statement of the Research Problem**

  Harsanyi's Aggregation Theorem stands as a cornerstone of modern social choice theory. Conventionally, it demonstrates that if individual preferences satisfy the von Neumann-Morgenstern axioms of rationality, and if social preferences satisfy the Pareto principle and an Independence condition, then social welfare must be represented as a weighted sum of individual cardinal utilities. The standard interpretation is strictly inter-personal: the theorem provides a formal defense of utilitarianism by deriving it from rationality constraints alone. It treats society as a collection of distinct agents whose preferences must be aggregated into a collective choice.

  However, the formal structure of the theorem relies on a distinction between the "individual" and the "collective" that becomes porous when applied across time. A single agent extended over time is not a synchronic unity but a sequence of temporal stages, each possessing distinct information, risk profiles, and preference orderings. In cases of time-inconsistency, hyperbolic discounting, or radical preference change, the "present self" and the "future self" diverge in ways structurally analogous to distinct voters in a social choice problem.

  This project proposes a formal migration of Harsanyi's theorem from the inter-personal domain to the intra-personal domain. The central problem is to determine whether the axioms required for the theorem to hold can be coherently satisfied by a single agent's temporal stages. If the theorem holds intra-personally, it suggests that personal identity over time is merely a weighted aggregation of temporal utilities, supporting a reductionist or "bundle" theory of the self. If the theorem fails, the failure point will likely locate within the Independence Axiom. This would suggest that the axiom does not merely describe rational consistency but presupposes a metaphysically unified chooser that does not exist diachronically. Thus, the mathematical formalism of social choice may conceal a hidden ontological commitment regarding the unity of the agent.

  **II. Gap in Current Literature**

  Orthodox decision theory typically assumes a unified agent as a primitive starting point. Models of time-inconsistency and divided preference (such as multiple-selves models) generally treat temporal conflict as a breakdown of rationality or a game between successive agents. Conversely, social choice theory treats agents as ontologically distinct by definition. There is currently no rigorous axiomatic reconstruction that tests the robustness of Harsanyi's specific aggregation conditions when the "voters" are redefined as temporal slices of a single biography.

  Existing discussions of personal identity and rationality often rely on psychological continuity or narrative coherence. They rarely engage with the specific constraints of the Independence Axiom in an aggregation context. By leaving the intra-personal variant of Harsanyi's theorem untouched, the literature misses an opportunity to use formal tools to adjudicate metaphysical questions. The migration of this specific result across disciplinary boundaries—from welfare economics to the metaphysics of self—remains unexplored. This project fills that gap by treating the temporal extension of the agent as a formal problem of aggregation rather than a psychological problem of memory or character.

  **III. Methodology**

  The research will proceed via formal reconstruction and axiomatic analysis. No empirical data, neuroscience, or behavioral experiments will be utilized. The method is strictly conceptual and mathematical, operating within the framework of normative decision theory.

  1.  **Formal Mapping:** The first phase involves redefining the domain of Harsanyi's theorem. The set of individuals *N* will be replaced by a set of temporal stages *T*. The social welfare function *W* will be replaced by a diachronic utility function *U*.
  2.  **Axiom Testing:** Each premise of the theorem will be tested for intra-personal coherence.
      *   *Pareto:* If every temporal stage prefers outcome A to outcome B, does the agent necessarily prefer A to B? This seems plausible but requires scrutiny in cases of transformative experience.
      *   *Independence:* This is the critical locus of inquiry. The Independence Axiom requires that preferences between two lotteries remain stable regardless of irrelevant alternatives. For a temporally extended agent, does the preference of a future stage count as an "irrelevant alternative" to the present stage? If preferences change endogenously over time, does the axiom collapse?
  3.  **Modeling Time-Inconsistency:** I will construct decision-theoretic models where temporal stages hold conflicting preference orderings over the same set of outcomes. I will then assess whether a linear aggregation of these utilities yields a coherent diachronic choice function without violating the axioms.
  4.  **Metaphysical Implication Analysis:** The final phase involves interpreting the formal results. If the axioms hold, the implication is that the self is an aggregate. If the axioms fail, I will isolate which axiom necessitates a synchronic unity that diachronic existence cannot support.

  **IV. Expected Outcomes and Criteria for Success**

  A defensible conclusion will take one of two forms. The first is a **Reductionist Result**: The formal reconstruction succeeds, demonstrating that a rational diachronic agent must maximize a weighted sum of temporal utilities. This would provide a formal argument against strong notions of personal identity, suggesting that the "self" is a fiction generated by aggregation.

  The second is a **Constitutive Result**: The formal reconstruction fails, specifically because the Independence Axiom cannot be satisfied by temporally divided stages without presupposing a metaphysical unity that the model was meant to test. This would demonstrate that certain formal conditions of rationality are not neutral tools but encode specific ontological commitments about the agent's unity.

  **Criteria for Success:** Success is defined as a rigorous proof or disproof of the theorem's intra-personal applicability that isolates the specific axiom responsible for the result. The output must clarify whether the failure of the theorem is due to mathematical incompatibility or metaphysical impossibility.

  **Criteria for Failure:** The project would fail if the formal mapping proves trivial (e.g., if temporal stages can be mathematically collapsed into a single function without loss of generality) or if the axioms prove so flexible that they accommodate any metaphysical view, rendering the result indeterminate. Additionally, if the analysis devolves into semantic disputes about the definition of "preference" rather than structural constraints, the formal rigor will be compromised.

  **V. Scope and Feasibility Assessment**

  A six-month timeline is sufficient for this specific inquiry because the scope is narrowly focused on one theorem and its axiomatic structure. The project does not attempt to solve the general problem of personal identity or to construct a new theory of rationality. It limits itself to the migration of Harsanyi's result.

  *   **Months 1-2:** Formal reconstruction of the theorem and definition of the temporal domain.
  *   **Months 3-4:** Axiomatic testing and modeling of time-inconsistency scenarios.
  *   **Months 5-6:** Interpretation of results and drafting of the final monograph/article.

  The primary risk lies in the potential ambiguity of "temporal stages." To mitigate this, I will adopt a standard discrete-time model commonly used in decision theory, avoiding contentious metaphysical definitions of "personhood" in favor of operational definitions of "preference holders." The project is feasible within the allotted time as it relies on existing formal tools applied in a novel configuration, rather than the development of new mathematical machinery.

  **VI. Significance**

  This research offers a rare instance where a formal result in economics directly constrains a metaphysical debate. By treating the self as a committee of temporal voters, we test the limits of rational choice theory. If the Independence Axiom presupposes a unified chooser, then standard decision theory is circular when applied to long-term planning. If it does not, then the "self" is mathematically indistinguishable from a society. This project clarifies the boundary between the mathematics of choice and the metaphysics of the chooser.
