          2.  **Formal:** The "Cost of Optimization" argument. If you include search costs, maximizing becomes satisficing. But Simon's regress argument blocks this.
          3.  **Empirical:** Ecological rationality research (Gigerenzer). Show where satisficing beats maximizing.
      *   *Why Progress is Hard:* Because the EU camp often treats normativity as *a priori* (like logic), immune to empirical falsification. The Simon camp treats it as *a posteriori* (like biology). You can't easily reconcile logic and biology.

  7.  **Refining the Tone:**
