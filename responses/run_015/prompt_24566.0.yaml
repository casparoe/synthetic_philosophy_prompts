prompt: |-
  I retired last year after a long career in theoretical ecology, and over the past couple of years I've been reading philosophy of action and decision theory, which is where I ran into Herbert Simon's notion of satisficing. I have no trouble with the basic idea — that agents operating under real cognitive and informational constraints do not maximize but stop once an option crosses some acceptance threshold — but I keep hitting a debate in the literature that I cannot get a handle on, and I would like a diagnosis of it rather than a survey.

  As I read it, the dispute is over the status of satisficing as a rival to maximization. One camp, roughly the expected-utility and decision-theory side, treats satisficing as at best a descriptive caveat: it records how people in fact fall short of rational choice, but it is not a genuine theory of what rationality requires, because it never pins down where the threshold lies or how it is set, and so it cannot deliver the kind of determinate predictions that expected utility does. The other camp, the bounded-rationality tradition descending from Simon, treats satisficing as a positive account of rational decision-making: given the agent's real limits, a rational agent ought to search and stop in just the way satisficing describes, and the looseness of the threshold is a virtue, because it tracks the adaptive, context-sensitive way real agents actually calibrate their standards.

  In my own field I live with this tension every day. We build optimality models of foraging and reproduction that are useful only "as if" the animal were solving a clean optimization problem, and everyone knows the animal is not doing that. So I have a working hypothesis, offered only as a hypothesis: I suspect the impasse is largely about what the word "rational" is doing. One side means "normatively ideal," in which case satisficing cannot compete, and the other means "adaptively adequate given the constraints," in which case unconstrained maximization is the straw man. If so, the two camps are answering different questions under a single name, and "Is satisficing a real theory?" is ill-posed because it inherits the ambiguity.

  Could you diagnose what kind of disagreement this really is — verbal, substantive, empirical, or a hidden question about what a decision theory is for — using what each side actually argues rather than the labels they attach to themselves, and then tell me what, if anything, would count as progress: a distinction that separates the two senses of "rational," a formal result, an empirical test, or a reformulation of the question? And if you believe no progress is to be expected, I would like you to say why.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Retired theoretical ecologist. Familiar with optimality models ("as if" reasoning), constraints, and adaptive behavior. Recently reading philosophy of action and decision theory.
      *   **The Problem:** Stuck on the debate surrounding Herbert Simon's *satisficing* vs. *maximizing* (expected utility theory).
      *   **User's Hypothesis:** The impasse is verbal/semantic, revolving around two different definitions of "rational" (normatively ideal vs. adaptively adequate).
      *   **The Task:** Diagnose the *kind* of disagreement (verbal, substantive, empirical, metatheoretical) based on arguments, not labels. Determine what would count as progress (distinction, formal result, empirical test, reformulation) or explain why no progress is expected.
      *   **Constraint:** Do not give a survey. Give a diagnosis.

  2.  **Deconstruct the Debate (Internal Knowledge Retrieval):**
      *   *The Maximizers (EU/Decision Theory):* Savage, Jeffrey, etc. Rationality = consistency (axioms). If you violate axioms (like transitivity or independence), you are susceptible to Dutch Books or Money Pumps. Satisficing often violates these axioms (e.g., framing effects, threshold dependence). Therefore, satisficing is descriptively true but normatively defective.
      *   *The Satisficers (Bounded Rationality/Simon/Gigerenzer):* Rationality = success in the environment. Optimization is computationally impossible or too costly. "Ecological rationality." The threshold isn't arbitrary; it's tuned by heuristics. Maximization is a myth in complex environments.
      *   *The "As If" Defense (Friedman/Ecology):* Even if agents don't calculate, they behave *as if* they maximize.
      *   *The User's Insight:* The ecologist sees the "as if" utility of optimality models but knows the mechanism isn't optimization. This mirrors the philosophy debate.

  3.  **Evaluate the User's Hypothesis:**
      *   User says: It's about the definition of "rational."
      *   My assessment: That's *part* of it, but calling it merely "verbal" is too dismissive. It's deeper. It's about the *function* of a theory of rationality. Is it a logic of consistency or a guide to success?
      *   Is it empirical? Yes, partly (can humans maximize?).
      *   Is it formal? Yes, partly (can satisficing be axiomatized?).
      *   Is it metatheoretical? Yes (what is the goal of decision theory?).

  4.  **Formulate the Diagnosis:**
      *   **Not merely verbal:** If it were just semantics, we could stipulate definitions and move on. But the stakes involve normative authority (how *should* we decide?) and descriptive accuracy (how *do* we decide?).
      *   **Not merely empirical:** Even if we prove humans can't maximize, maximizers say "too bad, that's what rationality *is*." Even if we prove satisficing works, maximizers say "that's just a heuristic approximating the true optimum."
      *   **Core Conflict:** It's a **Metatheoretical Disagreement about the Scope and Aim of Normativity.**
          *   Camp A (EU): Rationality is *internal consistency*. (Coherence)
          *   Camp B (Simon): Rationality is *external success*. (Correspondence)
      *   **The "Threshold" Objection:** Maximizers claim the threshold is arbitrary. Satisficers claim the threshold is ecologically tuned. This is the pivot point.

  5.  **Determine Paths to Progress:**
      *   *Distinction:* We need to separate "Coherence Rationality" from "Ecological Rationality." (Hammond, Gigerenzer have tried this).
      *   *Formal Result:* Can satisficing be represented *as* optimization under constraints? (Good, Simon argued no, but some economists argue yes via "cost of search" models). If satisficing can be modeled as maximizing *net* utility (benefit - search cost), the distinction collapses. Simon's rebuttal: The cost of calculating the cost of search leads to infinite regress.
      *   *Empirical Test:* Do satisficing heuristics outperform optimization in specific environments? (The "Less is More" effect).
      *   *Reformulation:* Move from "Which is true?" to "Under what environmental structures does each procedure yield adaptive success?"

  6.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the User's Background:* Use the ecology analogy. It's perfect. The "optimality model" vs. "mechanism" distinction is exactly the "normative" vs. "descriptive" tension.
      *   *Address the Hypothesis:* Validate it but deepen it. It's not just "two meanings of rational." It's two different *projects*. One is logic/math (consistency), the other is engineering/biology (function).
      *   *Diagnose the Disagreement:* It is a **Metatheoretical Clash regarding the Locus of Normativity.**
          *   EU: Normativity resides in the *structure of preferences*.
