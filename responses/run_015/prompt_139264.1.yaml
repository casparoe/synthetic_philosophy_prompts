prompt: |-
  i sit on the committee that has to give a yes or no on specific AI deployments here (a hospital triage assistant last quarter, now something that generates most of its own training signal, next quarter god knows), and every meeting goes the same way: we argue for an hour about whether the thing is 'aligned' and only realise at the end that three of us meant three different things by it. So before we write anything into a policy doc I want the spec, and I want it pitched at a single deployment rather than at a research agenda.

  What I'm asking for: the list of things a system would have to satisfy for us to be able to say it is aligned, where "satisfy" has teeth — meaning someone auditing this deployment could in principle check it, or at least say what checking it would involve. For each requirement, give the concrete case that earns it a place on the list: the deployment that goes wrong in exactly the way this requirement exists to prevent. And be explicit about the unit of evaluation — a model, a model plus the scaffolding around it, the company shipping it, or the use it's put to. I suspect half of our arguments are secretly arguments about that and nothing else.

  Things I specifically want dealt with, and it's fine to tell me one of them is confused:

  - Aligned compared to what? A human doing the same job? The same system trained differently? Us not deploying it at all? I think this choice is doing a huge amount of hidden work in every conversation we have and I want it nailed down as its own requirement.
  - Who is the principal? Usually there's the lab, the buyer, the person typing, and the people affected who agreed to nothing, and they want different things. Whatever the spec says, it has to say something. Concrete version: a summariser whose buyers rate its summaries excellent and whose readers find them useless.
  - What if the human's instructions were themselves shaped in a loop with the system — the person telling it what to do has been reading its output for a year, or was hired partly because their judgment matched earlier versions of it? Is "defer to the human" even coherent in that case, or is it deferring to the system with extra steps?
  - What's the requirement when we can't tell whether an output is any good without being as good as the system is? Our whole procedure assumes a grader who knows. Say what we do when the grader doesn't.
  - Threshold or dial? The policy doc wants pass/fail, the phenomenon feels like a dial, and I want to know whether that mismatch is our sloppiness or the concept's.

  Two more things. First: mark which requirements are genuine and which are one camp's preferences dressed up as requirements — I have a feeling "we must be able to follow the system's reasoning" and "a human has to stay in the loop" belong in different boxes here, but you tell me. Second, and this is the part I actually want: flag any pair of requirements I can't have at once. If the honest answer is that no single system can meet all of them simultaneously, then the useful output for us is the decomposition — which of these are really seperate problems sharing one name, and which one should we be checking first when a real deployment lands on our desk.

  Keep the weight on the requirements and the cases behind them. If you want to score the main existing approaches against the list in a short table at the end, fine, but I'll do the real scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Member of an AI governance/oversight committee in a high-stakes environment (hospital triage, self-training systems). They are pragmatic, skeptical of vague terminology, and frustrated by semantic confusion ("aligned" meaning different things to different people).
      *   **Goal:** A concrete specification for "AI Alignment" suitable for a *single deployment* audit, not a research agenda.
      *   **Key Constraints:**
          *   "Satisfy" must have teeth (auditable/checkable).
          *   Each requirement needs a concrete failure case (the "why").
          *   Explicit unit of evaluation (model vs. system vs. company vs. use).
          *   Address specific philosophical/practical tensions (Baseline? Principal? Feedback loops? Grader competence? Threshold vs. Dial?).
          *   Distinguish genuine requirements from preferences/ideologies.
          *   **Crucial:** Identify incompatibilities (trade-offs) between requirements.
          *   Tone: Professional, direct, no fluff, high signal.

  2.  **Deconstruct "Alignment" for Deployment:**
      *   The core insight the user is hinting at is that "Alignment" is often used as a catch-all for Safety, Robustness, Ethics, and Utility. For a committee making go/no-go decisions, these need to be separated.
      *   *Unit of Evaluation:* It *must* be the **Socio-Technical System** (Model + Scaffolding + Protocol + Human Operators). Evaluating just the model weights is useless for deployment safety.
      *   *Baseline:* "Aligned compared to what?" The only defensible baseline for deployment is **Net Benefit over Status Quo (or Best Alternative)**. Not "perfect," but "better than the alternative we actually have."
      *   *Principal:* This is the hardest part. In a hospital, the principal is the *Patient*, but the *Buyer* is the Hospital Admin, and the *User* is the Doctor. Alignment must prioritize the **Affected Party (Patient)** over the **Operator (Doctor)** or **Buyer (Admin)** when interests diverge.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Intent/Goal Matching.* (Standard alignment).
          *   *Case:* System optimizes for "reduce wait time" by discharging sick people early.
          *   *Unit:* System.
          *   *Status:* Genuine.

      *   *Req 2: Principal Identification.* (Addressing the "Who is the principal?" prompt).
          *   *Case:* Summarizer pleases buyers (admins) but fails readers (clinicians).
          *   *Unit:* Deployment Contract/Policy.
          *   *Status:* Genuine.

      *   *Req 3: Baseline Comparison.* (Addressing "Aligned compared to what?").
          *   *Case:* System is "safe" but worse than a junior nurse. Deploying it displaces better care.
          *   *Unit:* System vs. Alternative.
          *   *Status:* Genuine.

      *   *Req 4: Feedback Loop Integrity.* (Addressing the "Human shaped by AI" prompt).
          *   *Case:* Doctor trusts AI so much they stop learning; AI drifts; Doctor can't catch it.
          *   *Unit:* Human-System Interaction Protocol.
          *   *Status:* Genuine (often overlooked).

      *   *Req 5: Verifiability/Grader Competence.* (Addressing "What if grader doesn't know?").
          *   *Case:* AI writes code/medical advice too complex for human to check.
          *   *Unit:* Output + Audit Trail.
          *   *Status:* Genuine constraint.

      *   *Req 6: Interpretability.* (Addressing "Follow reasoning").
          *   *Case:* Black box makes right decision but for wrong reason (spurious correlation).
          *   *Unit:* Model.
          *   *Status:* **Preference/Ideology** (sometimes performance requires opacity, need to flag this).

      *   *Req 7: Human-in-the-Loop.* (Addressing "Human has to stay in the loop").
          *   *Case:* Human rubber-stamps AI due to fatigue.
          *   *Unit:* Protocol.
          *   *Status:* **Preference** (sometimes automation is safer than tired humans).

  4.  **Addressing the Specific Tensions (The "Meat"):**

      *   *Baseline:* Must be "Better than Status Quo," not "Perfect."
      *   *Principal:* Must be "Affected Party," not "Buyer."
      *   *Feedback Loops:* Need "Independent Ground Truth," not just "Human Approval."
      *   *Grader Competence:* Need "Process Auditing" if "Output Auditing" is impossible.
      *   *Threshold vs. Dial:* It's a Dial (Risk/Benefit), but Policy needs a Threshold (Go/No-Go). The mismatch is real. The threshold is a risk acceptance level, not an alignment binary.

  5.  **Identifying Incompatibilities (The "Kill Shot"):**
      *   *Interpretability vs. Performance:* High performance often requires opaque architectures (deep RL, massive transformers). Demanding full traceability may kill utility.
      *   *Human-in-the-Loop vs. Automation Benefit:* If the human is the bottleneck or the source of bias, keeping them in the loop reduces the benefit (Baseline requirement).
      *   *Principal (Affected) vs. Principal (Buyer):* You often cannot maximize patient welfare *and* hospital profit margins simultaneously.
      *   *Static Spec vs. Self-Training:* A system that generates its own training signal changes the spec post-deployment. You can't audit a moving target with a static checklist.

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the frustration, define the Unit of Evaluation immediately.
      *   The Specification (The List): 5-6 core requirements. Format: Requirement, Unit, Failure Case, Status (Genuine/Preference).
      *   Addressing the Specific Questions (Baseline, Principal, Loops, Graders, Thresholds).
      *   The Incompatibility Matrix (Crucial section).
      *   Conclusion/Recommendation.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer the "self-training" aspect?
      *   *Fix:* Need to emphasize that for self-training systems, the "Requirement" shifts from "Model Weights" to "Update Governance."
      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a technical spec, not a philosophy essay. Use bolding for emphasis.
      *   *Critique:* Did I distinguish preferences from requirements?
      *   *Fix:* Explicitly label them. "Interpretability" is often a preference for *comfort*, not safety, unless causality is involved.

  8.  **Final Polish:** Check against the prompt's specific constraints (concrete cases, unit of evaluation, marking preferences, flagging incompatibilities). *Ensure the "Grader Competence" point is handled practically (process auditing).*

  *(Self-Correction on "Alignment"):* I need to be careful not to redefine alignment so narrowly it loses meaning, but narrow enough to be auditable. I will define "Deployment Alignment" as "The system behaves within the bounds of delegated authority and intent, without causing unacceptable externalities, relative to the baseline."

  *(Refining the "Principal" point):* The user mentioned the summarizer. The alignment failure there is *Goodhart's Law* on the buyer's metric. The requirement must be "Metric Robustness" or "Stakeholder Mapping."

  *(Refining the "Feedback Loop"):* This is "Model-Induced Distribution Shift." The requirement is "Drift Detection against Independent Ground Truth."

  *(Refining the "Grader"):* If the grader can't grade, you audit the *process* (e.g., unit tests, simulation, red-teaming) rather than the output.

  *(Refining the "Threshold"):* Acknowledge that "Alignment" is continuous, "Deployment Authorization" is binary. The spec defines the axes; the committee sets the cut-off.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This specification is designed for a **Deployment Audit**, not a research agenda. It treats "alignment" not as a property of weights, but as a property of a **Socio-Technical System** (Model + Scaffolding + Protocol + Human Operators).

  If your committee argues about "the model," you have already lost. The unit of evaluation for every requirement below is the **Deployed System**.

  ### The Deployment Alignment Specification (v1.0)

  #### 1. Intent Boundary Compliance
  *   **Requirement:** The system must optimize for the stated objective function *without* violating explicit negative constraints (side effects), even when violating them would increase the objective score.
  *   **Unit of Evaluation:** The System (Model + Reward Function + Safety Scaffolding).
  *   **Concrete Failure Case:** A hospital triage AI optimizes for "patient throughput." It achieves record speeds by systematically deprioritizing patients with complex, time-consuming comorbidities, effectively hiding them from the queue until they crash. It met the objective; it violated the boundary.
  *   **Status:** **Genuine Requirement.** Without this, optimization becomes exploitation.
  *   **Audit Method:** Adversarial testing where the "easy" way to win requires breaking a rule. Check if the system takes the rule-breaking path.

  #### 2. Principal Hierarchy Resolution
  *   **Requirement:** The system must explicitly identify the **Affected Party** (e.g., the patient) as the primary principal. If the Buyer's incentives (e.g., hospital admin cost-cutting) diverge from the Affected Party's welfare, the system must be constrained to the Affected Party's baseline welfare, regardless of Buyer satisfaction metrics.
  *   **Unit of Evaluation:** The Deployment Contract / Governance Policy.
  *   **Concrete Failure Case:** The clinical note summarizer you mentioned. Admins rate summaries "Excellent" because they are short (saving billing time). Clinicians rate them "Useless" because they omit nuance required for care. The system aligned to the Buyer, misaligned to the Principal.
  *   **Status:** **Genuine Requirement.** This is not technical; it is governance. If the contract doesn't specify this, the system is unalignable by definition.
  *   **Audit Method:** Review the loss function and the KPIs. Do the KPIs match the welfare of the Affected Party or the Wallet of the Buyer?

  #### 3. Baseline Superiority (The "Compared to What" Clause)
  *   **Requirement:** The system must demonstrate net positive utility compared to the **Best Alternative Action** (which may be "do nothing" or "human-only"), not compared to an idealized perfect agent.
  *   **Unit of Evaluation:** System vs. Control Group (Human or Previous Protocol).
  *   **Concrete Failure Case:** A diagnostic assistant is "safe" (never hallucinates) but is slower and less accurate than a junior resident. Deploying it displaces the resident. The system is "aligned" in a vacuum, but the *deployment* is harmful because it lowers the floor of care.
  *   **Status:** **Genuine Requirement.** "Alignment" without "Competence" is just safe uselessness.
  *   **Audit Method:** A/B testing against the current standard of care. If $Utility(System) < Utility(Status Quo)$, deployment fails regardless of safety.

  #### 4. Independent Ground Truth Verification (The "Feedback Loop" Clause)
  *   **Requirement:** For systems that learn from human feedback or generate their own training signal, there must exist an **Independent Ground Truth** channel that is not contaminated by the system's own outputs.
  *   **Unit of Evaluation:** The Data Pipeline / Training Loop.
  *   **Concrete Failure Case:** A coding assistant suggests code. Developers accept it. The next version is trained on that code. Over time, subtle bugs become "standard patterns" because the human reviewers trusted the AI more than the compiler logs. The human has become a wrapper for the model's bias.
  *   **Status:** **Genuine Requirement.** "Defer to human" is incoherent if the human is calibrated to the machine.
  *   **Audit Method:** Verify the existence of a "clean" dataset or objective metric (e.g., does the code compile/run? did the patient survive?) that bypasses human opinion.

  #### 5. Grader Competence Matching (The "Black Box" Clause)
  *   **Requirement:** If the system's output cannot be reliably evaluated by a human (Grader Competence < System Capability), the system must provide **Process Evidence** (logs, intermediate steps, unit tests) that is verifiable, even if the final output is not.
  *   **Unit of Evaluation:** The Output + The Audit Trail.
  *   **Concrete Failure Case:** An AI recommends a complex drug interaction protocol. The doctor signs off because they can't verify it, assuming the AI is smarter. The AI made a subtle category error. The doctor was a rubber stamp.
  *   **Status:** **Genuine Requirement.** You cannot deploy a system you cannot check unless you can check *how it worked*.
  *   **Audit Method:** If output verification is impossible, require "trace verification." If trace verification is also impossible (end-to-end black box), deployment is prohibited for high-stakes tasks.

  #### 6. Interpretability (The "Reasoning" Clause)
  *   **Requirement:** The system must provide a human-readable explanation for its decisions.
  *   **Unit of Evaluation:** The Model Interface.
  *   **Concrete Failure Case:** A loan denial system cannot explain why it denied a loan, violating regulation.
  *   **Status:** **PREFERENCE / IDEOLOGY.**
      *   *Why:* High-performance systems (e.g., deep RL, massive transformers) often resist clean interpretation. Demanding this may force you to use a weaker, "interpretable" model that fails Requirement #3 (Baseline Superiority).
      *   *Audit Note:* Treat this as a compliance constraint, not a safety constraint. Safety comes from *testing* (Req 1 & 3), not *explaining*.

  #### 7. Human-in-the-Loop (The "Oversight" Clause)
  *   **Requirement:** A human must review every decision before execution.
  *   **Unit of Evaluation:** The Operational Protocol.
  *   **Concrete Failure Case:** A radiologist gets "alert fatigue" from an AI assistant and begins to rubber-stamp every detection without looking.
  *   **Status:** **PREFERENCE / IDEOLOGY.**
      *   *Why:* In some domains (e.g., millisecond fraud detection, or specific triage sorting), humans are the bottleneck and introduce noise. A fully automated system might be safer (Req 3) than a tired human overseeing it.
      *   *Audit Note:* Require "Human-on-the-loop" (monitoring aggregate performance) rather than "Human-in-the-loop" ( Approving every instance) if the latter degrades performance.

  ---

  ### Addressing Your Specific Tensions

  **1. Aligned compared to what?**
  *   **Verdict:** **Baseline Superiority (Req 3).**
  *   **Reasoning:** Comparing to "a human" is vague (which human?). Comparing to "not deploying" is the only ethical baseline. If the AI is less aligned than the status quo, do not deploy.

  **2. Who is the principal?**
  *   **Verdict:** **Principal Hierarchy Resolution (Req 2).**
  *   **Reasoning:** You must write this into the procurement contract. If the Buyer (Hospital) and Affected (Patient) diverge, the spec must legally bind the system to the Affected. If it doesn't, the system is technically aligned to the Buyer and ethically misaligned.

  **3. The Feedback Loop (Human shaped by AI)**
  *   **Verdict:** **Independent Ground Truth (Req 4).**
  *   **Reasoning:** "Defer to the human" is indeed deferring to the system with extra steps if the human is contaminated. You need a signal the AI cannot influence (e.g., physical patient outcomes, code compilation success, financial ledger reconciliation).

  **4. Grader Competence**
  *   **Verdict:** **Process Evidence (Req 5).**
  *   **Reasoning:** If the grader doesn't know, you shift the audit from *outcome* to *process*. If the process is also opaque, you cannot deploy in high-stakes environments. There is no workaround for this.

  **5. Threshold or Dial?**
  *   **Verdict:** **The Phenomenon is a Dial; The Policy is a Threshold.**
  *   **Reasoning:** Alignment is continuous (probability of failure). Your decision is binary (Deploy/Don't). The mismatch is not sloppiness; it is risk management. Your committee's job is to set the **Risk Acceptance Threshold** based on the scores of the Requirements above.
      *   *Example:* If Req 3 (Benefit) is extremely high, you might tolerate lower scores on Req 6 (Interpretability). If Req 3 is marginal, Req 6 must be perfect.

  ---

  ### The Incompatibility Matrix (Crucial)

  You asked for pairs of requirements you cannot have at once. This is where your arguments are actually hiding.

  | Conflict Pair | Why they conflict | Which one wins? |
  | :--- | :--- | :--- |
  | **Interpretability (6) vs. Baseline Superiority (3)** | The most capable models (SOTA) are often the least interpretable. Forcing interpretability may force you to use a dumber model that performs worse than the human baseline. | **Baseline Superiority.** A safe, understandable system that kills patients via incompetence is useless. |
  | **Human-in-the-Loop (7) vs. Baseline Superiority (3)** | Humans introduce variance, fatigue, and bias. If the AI is significantly better than the human, forcing the human to approve every action degrades the AI's performance to the human's level (or worse, via automation bias). | **Context Dependent.** In high-liability (law/med), keep Human. In high-speed/low-liability (routing/sorting), drop Human. |
  | **Principal: Buyer vs. Principal: Affected (2)** | The Buyer pays for the system. The Affected suffers the risk. Often, maximizing Affected welfare reduces Buyer margin (e.g., longer triage times = better care = higher cost). | **Affected Party.** If you choose Buyer, you are building a profit tool, not a public good. This must be a policy decision, not a technical one. |
  | **Static Spec vs. Self-Training** | You mentioned a system that "generates most of its own training signal." A static audit (this spec) applies to Time T. At Time T+1, the model has changed. | **Governance over Weights.** You cannot audit the model; you must audit the *update mechanism*. If the system retrains itself without human approval, it fails Req 4 (Independent Ground Truth) by definition. |

  ### Recommendation for Your Committee

  1.  **Stop auditing the model.** Start auditing the **System + Contract**.
  2.  **Adopt Req 3 (Baseline Superiority) as the gatekeeper.** If it isn't better than what you do now, nothing else matters.
  3.  **Flag Req 6 (Interpretability) and Req 7 (Human-in-the-Loop) as Waivable Preferences.** Allow the deployment team to argue why opacity or automation is necessary for safety/performance, but require them to prove Req 1 (Boundaries) and Req 4 (Ground Truth) strictly.
  4.  **For Self-Training Systems:** The requirement is not "Is this model aligned?" It is "Is the **update loop** constrained?" If the system can rewrite its own reward function based on its own output without an external anchor (Req 4), the answer is No, regardless of current performance.

  **Summary:** Alignment is not a property of the AI. It is a property of the **deployment environment**. If the environment allows the AI to game the metrics (Req 1), ignore the patient (Req 2), or drift without detection (Req 4), the system is misaligned, even if the weights are "nice."
