  **MEMORANDUM**

  **TO:** Ethics Committee
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on Volunteer Sign-Up Copy
  **DATE:** [Date]

  **BOTTOM LINE & MOTION**
  I recommend we **reject Options A and B** and **approve Option C**, with minor wording adjustments to emphasize reliability over speed.

  **Motion:** *Adopt Option C ("You'll be one of about 180,000 devices; together you are the supercomputer") as the primary sign-up value proposition. Do not publish the internal note regarding marginal causal contribution. Revisit this decision in six months or if volunteer retention drops below 5%.*

  **RATIONALE**
  Option A ("Every device speeds up research") is factually unstable. Given our redundancy model and oversubscription, a single marginal device does not causally accelerate completion; it increases reliability. Claiming it "speeds up" research risks being misleading if volunteers scrutinize the architecture.

  Option B (Evidential Cooperation) is philosophically sophisticated but operationally fragile. Our survey data shows two-thirds of users misread it as a causal claim (Option A), and one-sixth dismiss it as magical thinking. Furthermore, our statistician's objection is decisive: ECL requires correlation via logical policy, not common cause. Since the correlation here is manufactured by our own email prompt, the evidential link is weak. Using it risks recruiting volunteers into a decision-theory framework they haven't consented to evaluate, based on a correlation that may not hold.

  Option C is robust. It is literally true, avoids philosophical baggage, and frames the contribution accurately: individual nodes provide redundancy and scale, not singular causal leverage.

  **THE STRONGEST CASE FOR OPTION B (REJECTED)**
  We should not dismiss Option B lightly. Its strongest argument is that it respects volunteer agency better than Option C. Option C risks making the volunteer feel like a replaceable cog in a machine ("one of 180,000"). Option B acknowledges the complexity of the situation and treats the volunteer as a rational partner capable of understanding nuanced impact. It avoids the falsehood of A without retreating into the anonymity of C. For the subset of volunteers who *do* understand evidential reasoning, B is more empowering and intellectually honest than a slogan about collective size. It attempts to solve the "marginal impact" problem rather than sidestepping it.

  **WHY B FAILS HERE**
  Despite its theoretical appeal, B fails the communication test. Ethics in public comms requires clarity over sophistication. If the majority misread the claim as causal, we are effectively deploying Option A with extra steps. Additionally, the statistician's objection suggests the mechanism doesn't work as intended in this specific context. We cannot build our recruitment strategy on a correlation we ourselves engineered via the prompt.

  **INTERNAL NOTE ON MARGINAL CONTRIBUTION**
  **Do not publish** the note stating individual devices are a "rounding error." While technically accurate regarding *speed*, it is misleading regarding *value*. Our redundancy model exists to filter bad data; every device increases confidence in the result. Publicizing the "rounding error" framing undermines the reliability argument without offering volunteers an actionable alternative. It solves a transparency problem by creating a motivation problem.

  **REVIEW TIMELINE**
  We revisit this in **six months**. If retention rates dip or volunteer surveys indicate feeling "insignificant," we may test a hybrid copy that emphasizes *reliability* ("Your device ensures the result is trusted") rather than speed or evidential correlation.

  **VOTE**
  [ ] Approve Option A
  [ ] Approve Option B
  [ ] Approve Option C (Recommended)
  [ ] Defer
