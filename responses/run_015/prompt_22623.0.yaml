answer: |-
  This is a classic stumbling block in Hume scholarship. You are trying to formalize it because Hume is, in this specific passage, constructing a *reductio ad absurdum* (a proof by contradiction). He is not stating his own positive theory of what a promise *is* here; he is demonstrating why the *common-sense* or *rationalist* view of a promise (that it is a natural mental act creating a natural obligation) collapses under scrutiny.

  To help you reconstruct this, I will break the passage down into two logical phases, distinguishing between the **Internal Logic** (the steps of the argument) and the **Sentimentist Premise** (the philosophical assumption driving the engine).

  ### Phase 1: The Elimination (Proof by Exhaustion?)

  > *"It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation..."*

  You asked if this is a legitimate proof by exhaustion or a rhetorical squeeze. It is formally a proof by exhaustion, but it relies on a specific definition of "act of the mind."

  **The Setup:** Hume is engaging with an opponent (likely a rationalist or a natural law theorist) who claims: *"A promise creates a binding obligation through a specific mental act performed at the moment of promising."*

  Hume accepts this premise temporarily to test it. He asks: **What is that act?**

  1.  **Is it a Resolution?**
      *   *Argument:* I can resolve to do something without promising it. A resolution is internal; a promise is communicative and binding in a way a private resolution is not.
      *   *Result:* Eliminated. Resolution $\neq$ Promise.
  2.  **Is it a Desire?**
      *   *Argument:* I can desire to do something without being obligated to do it. Furthermore, I often promise things I do not currently desire to do (e.g., paying a debt).
      *   *Result:* Eliminated. Desire $\neq$ Obligation.
  3.  **Is it Willing the Performance?**
      *   *Argument:* This is the trickiest one. Can I "will" a future action *now*? Hume argues no. The will operates on the present. I can will to *raise my arm* now, but I cannot will to *raise my arm tomorrow*. Tomorrow, I must will it again. If the promise consisted of willing the future action now, the promise would expire the moment the present moment passed.
      *   *Result:* Eliminated. Will(Action) $\neq$ Will(Future Action).

  **The "Squeeze":**
  If the obligation must come from a mental act, and it isn't A, B, or C, it must be D.
  *   **Conclusion of Phase 1:** The act must be **"Willing the Obligation."**

  **Is this legitimate?** Within the confines of the opponent's framework (that there *must* be a single natural mental act), yes, it is the only logical remainder. Hume is cornering the opponent. He is saying, "If you insist this is a natural mental act, you are forced to admit the act is 'willing the obligation.' There is no other place for it to hide."

  ### Phase 2: The Impossibility (Will vs. Sentiment)

  > *"All morality depends upon our sentiments... But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens..."*

  Here is where the *reductio* snaps shut. Hume attacks the only remaining candidate: "Willing the Obligation."

  **1. The Nature of the Claim (Psychological vs. Metaphysical)**
  You asked if this is psychological or metaphysical. For Hume, it is **empirical psychology treated as metaphysics.**
  Hume views the mind as a causal system. Just as you cannot command your hand to move without nerves and muscles engaging, you cannot command your passions/sentiments to change without a cause.
  *   **The Claim:** The Will is a faculty that initiates action, but it does not have direct causal power over *feelings* (sentiments).
  *   **The Analogy:** Try to feel "grief" right now, purely by deciding to. You can't. You need a cause (a loss, a sad story) to produce the sentiment.
  *   **The Logic:**
      *   $P1$: Obligation is constituted by a sentiment (specifically, a pain/displeasure at the thought of non-performance).
      *   $P2$: To "will an obligation" is to "will a sentiment."
      *   $P3$: The Will cannot directly create sentiments (Psychological Fact).
      *   $C$: Therefore, one cannot "will an obligation."

  **2. Why "Unintelligible" and not just "No Motive"?**
  This is crucial. If Hume only meant "I have no motive," he would be saying promises are weak or often broken. But he says the concept is **unintelligible**.

  *   **No Motive:** "I understand what a promise is, but I don't feel like keeping it."
  *   **Unintelligible:** "The definition of a promise requires a mechanism that does not exist."

  If a "natural promise" is defined as *a mental act that creates an obligation*, and *obligation* is *a sentiment*, and *will cannot create sentiment*, then a "natural promise" is like a "married bachelor." It is a contradiction in terms. There is no "act of the mind belonging to it" because the required act is psychologically impossible.

  ### Separating the Logic from the Sentimentist Assumption

  You asked to keep the internal logic separate from the sentimentist assumption. This is the key to unlocking the passage.

  **The Internal Logic (Valid regardless of Sentimentalism):**
  1.  Assume: A promise is a natural mental act creating obligation.
  2.  If so, that act must be identifiable (Resolution, Desire, Will-Action, or Will-Obligation).
  3.  Resolution, Desire, and Will-Action are demonstrably insufficient to create the specific bond of a promise.
  4.  Therefore, the act must be Will-Obligation.
  5.  If Will-Obligation is impossible, then the initial Assumption is false.

  **The Sentimentist Assumption (The Engine of Step 5):**
  *   **Hume's Axiom:** "All morality depends upon our sentiments."
  *   **The Function:** This axiom is what makes "Will-Obligation" impossible.
      *   If you were a Rationalist (like Kant), you would reject this axiom. You would say Obligation is a relation of Reason, not a Sentiment. Therefore, the Will *can* bind itself through Reason, regardless of feelings.
      *   Hume inserts his axiom to show that *within his system*, Will-Obligation is impossible.

  **Why this matters for your discussion:**
  Hume is not saying promises don't exist. He is saying **promises are not natural.**
  Because the "natural mental act" proof leads to a contradiction (the unintelligibility), Hume concludes that promises must be **Artificial**.

  *   **Natural:** Arises from a single mental act/instinct (like pity or parental love).
  *   **Artificial:** Arises from a social convention/system (like money or laws).

  The "obligation" doesn't come from the *moment* you promise (the mental act); it comes from the *social context* that punishes breaking promises. The "act of the mind" is just a verbal signal within that system, not a magical generator of obligation.

  ### Summary for your Reconstruction

  If you are formalizing this for your friends, you can model it like this:

  **Definitions:**
  *   $M$: A specific mental act occurring at time $t_0$.
  *   $O$: A binding obligation to perform action $A$ at time $t_1$.
  *   $S$: A sentiment of moral pain/displeasure.
  *   $W$: The human Will.

  **Hume's Argument:**
  1.  **Hypothesis:** $M$ causes $O$ naturally. (The Rationalist/Naturalist view).
  2.  **Premise:** $O$ is constituted by $S$. (Sentimentalist Axiom).
  3.  **Premise:** $W$ cannot directly cause $S$. (Psychological Constraint).
  4.  **Analysis of $M$:**
      *   $M \neq$ Resolve (Resolve does not imply $O$).
      *   $M \neq$ Desire (Desire does not imply $O$).
      *   $M \neq$ Will($A$) (Will cannot operate on future $t_1$).
      *   $\therefore M$ must be Will($O$).
  5.  **Substitution:** Since $O = S$, then $M$ must be Will($S$).
  6.  **Contradiction:** From (3), Will($S$) is impossible.
  7.  **Conclusion:** The Hypothesis (1) is false. There is no natural mental act $M$. Promises are not natural; they are social inventions.

  **Answering your specific doubts:**
  *   **Is "Willing the Obligation" a rhetorical squeeze?** No, it is the logical remainder of the exhaustion proof *given the hypothesis*. Hume uses it to set up the kill shot.
  *   **Is the Will/Sentiment claim psychological?** Yes, it is an empirical claim about human cognitive architecture.
  *   **Why "Unintelligible"?** Because the definition requires an impossible causal link (Will $\to$ Sentiment).

  Hume's point to your friends is: You don't feel bound because of a magic mental act you performed. You feel bound because you are participating in a human invention (a social convention) that is incredibly useful for society, and you have been trained (via sentiment) to feel pain when you violate the conventions of your society. The "binding" feeling is the sentiment, but the sentiment is caused by the *social system*, not the *promise itself*.
