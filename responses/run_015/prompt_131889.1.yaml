answer: |-
  Good morning. Welcome to "Who Decides the Watershed?"

  I want to start by asking you to look around this room. Because the composition of this group is the first draft of the problem we're here to discuss.

  On one side, I see neighbors. People who know the smell of this river when it's low in August and the sound it makes in March when the snowmelt hits. You know which basements flood, which wells run dry, and how long it takes to get from the upstream zoning board to your kitchen tap.

  On the other side, I see scholars. People who have spent years studying the "boundary problem." You know the theories of who counts as a member of a community, where democratic authority stops, and how political lines are drawn on a map.

  Usually, in workshops like this, there is an unspoken script. The scholars provide the framework, and the residents provide the case study. I want to tear up that script this morning. If we are going to be honest about the title of this workshop—"Who Decides?"—we have to admit that we don't actually know who "we" are yet.

  If we knew who the decision-makers should be, we wouldn't need two days. We would just hold an election. But the water doesn't respect the municipal line. The aquifer doesn't check your tax bill before it flows under your property. And yet, our rules for deciding what happens to that water are rigid, old, and often arbitrary.

  Take, for example, the irrigation pact from 1923. It's still on the books. It says riparian rights belong to the land, not the person. Specifically, it grants standing to landowners. If you rent your home, if you farm land you don't hold the deed to, or if you live in one of the newer developments just outside the old town limits, that pact suggests you have no formal standing.

  I know there are people in this room who have waded through floodwaters in their living rooms who, legally speaking, are invisible to the board that manages the upstream spillways. That isn't just a bureaucratic detail. That is a wound in the community. It creates a situation where the people most affected by the water have the least say in how it is managed.

  So, I need to be clear about what I am promising you for the next two days.

  I am not promising we will solve this. I am not promising we will draft a new charter, overturn the 1920s pact, or redraw the municipal boundaries by Sunday afternoon. If I promised you that, I would be lying. The tension in this room is real. The tension between the need for stable borders and the fluid reality of a watershed cannot be wished away.

  To the residents: I promise you that we will not treat your experience as mere "data" for a theory. Your frustration with the zoning board is not a puzzle to be solved; it is a reality to be confronted.

  To the students: I promise you that you will be challenged. The literature you know is vital, but it often assumes a clean slate. Here, you are walking into a room where history has already made a mess. You will hear about rights and boundaries not as abstract concepts, but as things that determine whether a family can stay in their home.

  My honest promise is this: By the time we close on Sunday, we will have a clearer map of our disagreement. We will know exactly where the friction lies. We will understand why the current lines fail, and we will understand the cost of drawing new ones.

  We are here to sit in the tension, not to escape it.

  The water flows through all of our towns. It quenches the thirst of the renter and the landowner alike. It floods the basement of the voter and the non-voter with equal indifference. For two days, let's try to build a conversation that flows as freely as the river does, even if our laws do not.

  Thank you. Let's get to work.
