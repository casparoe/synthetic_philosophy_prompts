      *   **The Core Tension (The Boundary Problem):** Address the "Who Decides?" question. Admit we don't know the answer. This validates the residents' skepticism and the students' interest.
      *   **The Local Quirk (1920s Pact):** Introduce the irrigation pact. This is the concrete anchor. It highlights the injustice without using academic terms like "disenfranchisement."
