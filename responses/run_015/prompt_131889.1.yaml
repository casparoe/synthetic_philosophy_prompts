      *   **Core Question:** Should people living just outside the municipal line (but drinking the water/affected by it) have a vote on upstream zoning?
      *   **Key Constraint 1 (Tone):** Welcome everyone without pretending "the people" is already defined.
      *   **Key Constraint 2 (Accessibility):** Avoid dense democratic theory jargon (residents won't follow), but don't dumb it down for the students.
      *   **Key Constraint 3 (Local Context):** Weave in the 1920s irrigation pact (riparian rights for landowners, not renters; some flood-affected people have no standing).
      *   **Key Constraint 4 (Outcome):** Do not resolve the tension. Let the problem shape the honest promise of the workshop.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).

  2.  **Determine the Voice and Tone:**
      *   **Voice:** Grounded, humble, facilitative, slightly provocative but respectful.
      *   **Tone:** Needs to bridge the gap between the abstract (students) and the concrete (residents). It should feel like standing on the riverbank, not in a lecture hall.
