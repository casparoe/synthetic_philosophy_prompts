  Consider a community of agro-scientists who have classified seeds as "Viable" for two centuries based on germination rates in their native soil, treating "Viable" as an intrinsic property deeply entrenched in their agricultural codes and foundational literature. All seeds observed before time *t* were both "Viable" and "Intact-Genome" (a newer, structurally defined predicate introduced by rival geneticists denoting unmutated DNA sequences). Unbeknownst to the community, "Viable" secretly relies on a temporally disjunctive soil condition: before *t*, the soil chemistry supported germination for Intact-Genome seeds, but after *t*, a hidden chemical shift prevents germination despite the genome remaining intact. Consequently, while all pre-*t* evidence supports both universal hypotheses, post-*t* seeds are truly Intact-Genome (making the Q-hypothesis true) but fail to be Viable (making the P-hypothesis false), yet the community remains blind to the gerrymandered nature of their entrenched term.

  **Analysis of the Divergence**

  *   **Simplicity Verdict:** Simplicity favors the hypothesis "All seeds are Intact-Genome" (Q) because it posits a uniform, intrinsic structural property, whereas "Viable" (P) relies on a complex, context-dependent functional realization that implicitly hides a temporal disjunction (soil condition pre-*t* vs. post-*t*).
  *   **Entrenchment Verdict:** Entrenchment favors the hypothesis "All seeds are Viable" (P) because the predicate has a long history of successful projection in the community's literature and practice, making it the "projectible" term according to Goodman's criteria.
  *   **Feature Doing the Work:** The single feature driving the divergence is the **hidden environmental shift at *t***, which renders the entrenched functional predicate temporally unstable (false after *t*) while leaving the simpler structural predicate uniform and true.
  *   **Goodmanian Rebuttal:** A defender of entrenchment would argue that projectibility is dynamic; if "Viable" fails to support counterfactuals or predictions after *t*, it loses its entrenchment status, meaning the case merely shows P was never truly projectible for this new context, not that entrenchment is a flawed guide.

