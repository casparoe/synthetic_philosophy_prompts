          *   *User's Explanation:* **Symbolic Gender Differentiation.** In egalitarian societies, class/religion fade, so gender becomes the primary marker of identity distinctiveness. Career choices signal group membership (identity) rather than economic utility.
      *   **Task:** Map the "exposure" of this account (how it could fail).
