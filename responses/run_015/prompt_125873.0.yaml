          4.  Concessions a committed proponent would make (which defeaters are acceptable).
          5.  Assessment of unfalsifiability risk (and whether it's fatal).

  2.  **Analyze the Core Thesis (Symbolic Gender Differentiation):**

      *   *Mechanism:* Identity signaling > Economic utility.
      *   *Context:* High gender equality + Low class/religious stratification.
      *   *Outcome:* Increased occupational segregation (paradox).
      *   *Key Assumption:* People *want* to be distinct, and gender is the available tool when other tools (class, religion) are removed.

  3.  **Brainstorming Defeaters (Conditions for Failure):**

