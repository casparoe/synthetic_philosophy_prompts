answer: |-
  **The question**

  The No-Free-Lunch theorem states that when averaged over all possible objective functions, all learning algorithms perform equally poorly. This is often taken as a formalization of the problem of induction: without assumptions, prediction is impossible. However, this framing treats the theorem as a barrier rather than a tool. The central question of this project is: What is the minimal structural assumption required to break the symmetry of the No-Free-Lunch result, and does this assumption correspond to the philosophical principle of the uniformity of nature? I propose that what philosophers call uniformity is better cashed out as a complexity bound on the space of possible worlds. The project seeks to determine the weakest constraint on the world—computability, stationarity, or bounded complexity—under which inductive inference becomes optimal. This shifts the debate from justifying induction to measuring the cost of assumptions. By treating the theorem as a diagnostic, we can ask precisely how much structure the world must possess for learning to occur, rather than asking vaguely whether learning is justified at all. The goal is a determinate answer regarding the threshold of structure required: is it enough that the world is computable, or must it be compressible? This moves the discussion from metaphysical speculation to measurable constraints on the size and shape of the space of worlds. I will explicitly investigate whether the size of the hypothesis space matters more than its shape. If the space of possible worlds is too large, no amount of structural assumption helps. Thus, the question becomes: what is the maximum entropy of the world compatible with successful learning? This quantifies the sceptic's challenge.

  **Why the existing readings leave it open**

  Standard philosophical interpretations fall into two camps. The sceptical reading takes the theorem as proof that induction lacks rational foundation, since no learner outperforms random guessing without extra premises. The deflationary reading argues the theorem is trivial because averaging over all functions presupposes a prior distribution, effectively smuggling in the very assumptions Hume questioned. Both readings miss the diagnostic potential of the formalism. Specifically, they treat the uniform average used in the theorem as a neutral representation of ignorance. It is not. Choosing a uniform distribution over a finite space is a substantive claim about the likelihood of worlds. Furthermore, these readings ignore the mismatch between the theorem's finite setting and the infinite space of worlds a sceptic actually worries about. By failing to analyze the uniform average as itself a heavy assumption, and by ignoring the gap between finite proofs and infinite possibilities, existing literature leaves open the actual work the theorem could do: specifying exactly which assumptions purchase predictive power. There is a third oversight: the literature often treats induction as a monolith. Yet, universal learning results suggest some learners succeed where others fail, implying induction might be multiple things. Existing readings collapse these distinctions, leaving the relationship between formal learning theory and philosophical scepticism unresolved. Philosophers dismiss the math as irrelevant to the infinite case, while researchers dismiss the philosophy as ignoring the priors. This proposal argues that the stalemate exists because neither side interrogates the specific assumption embedded in the averaging measure itself.

  **Method**

  The project proceeds in three technical-philosophical steps. First, I will bridge the gap between finite instance spaces and the infinite spaces relevant to Humean scepticism. This requires analyzing whether No-Free-Lunch results hold when the uniform average is replaced by measures suitable for infinite domains. I will define technical terms to ensure cross-disciplinary clarity. Second, I will juxtapose these results with universal learning frameworks that appear to offer free lunches under computability constraints. I will analyze whether these universal learners evade the theorem or merely shift the assumption to a different locus, such as the definition of computability. This addresses the worry that induction is not one thing. Third, I will map the mathematical constraints identified in the first two steps onto philosophical concepts. I will treat assumptions not as binary premises but as measurable complexity bounds. This involves defining a hierarchy of world structures, from unstructured randomness to highly constrained laws, and determining the threshold at which learning becomes possible. Throughout, I will minimize formal notation, defining terms like prior and complexity bound in plain language to ensure accessibility across disciplines. I will focus on the trade-off between the size of the world space and the complexity of the learner. I will construct case studies where specific complexity bounds are relaxed to observe the exact point of learning collapse. This empirical-style analysis of formal results will ground the philosophical claims. I will also engage with the notion that no assumptions is itself an assumption, explicitly modeling the uniform prior as a specific structural claim rather than a null hypothesis.

  **What a result would look like**

  A successful outcome will produce a hierarchy of structural assumptions ranked by their strength and their predictive yield. This would look like a calibrated scale: if the world possesses property X, learning rate Y is achievable. This reframes uniformity of nature as a variable parameter rather than a binary switch. A negative result is equally valuable. It may demonstrate that the machine learning literature and the philosophical literature are incommensurable because they operate with incompatible definitions of induction. If the universal learner results cannot be reconciled with the No-Free-Lunch diagnostics without begging the question, the project will conclude that the formal tools currently available cannot settle the philosophical debate. Either way, the output clarifies whether formal learning theory can bear the philosophical weight often placed upon it. The deliverable will be a framework that allows philosophers to specify exactly which version of induction they are defending, and allows researchers to see the philosophical cost of their mathematical constraints. This prevents researchers talking past each other.

  **Failure modes**

  The primary risk is scope creep. The project attempts to bridge finite and infinite domains, reconcile conflicting learning theories, and map them to philosophy. These could easily become three separate dissertations. I mitigate this by focusing strictly on the role of the assumption rather than proving new learning bounds. A second risk is technical intractability; extending finite results to infinite spaces without natural uniform distributions is mathematically delicate. If the bridge cannot be built formally, the philosophical analysis loses its anchor. Finally, there is the risk that the committee finds the synthesis superficial, treating deep mathematical constraints as mere metaphors. I will avoid this by grounding every philosophical claim in a specific formal condition. I will maintain a log of formal definitions to ensure rigor is not sacrificed for accessibility.
