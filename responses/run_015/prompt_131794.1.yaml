  Stevan Harnad's symbol-grounding problem warns us: a system can manipulate symbols perfectly without knowing what they refer to. A chatbot knows "apple" relates to "red," but never tastes sweetness. Today, LLMs master this ungrounded fluency. They are ghosts shuffling tokens.

  Here is the risk of this degree. If your education was merely acquiring more symbols to describe symbols, you leave as sophisticated parsers. You can debate consciousness without encountering another subject. You can discuss alignment without facing harm. You risk becoming exactly what you study: intelligent, but insensate.

  This demands a weird extension: ethical grounding.

  We often teach ethics as abstract principles—utilitarian calculus, deontological rules. These are symbolic structures. Like any symbol system, they float unless anchored. If your moral commitment is only vocabulary, it collapses under pressure. Real ethics requires sensory contact with consequence. It needs the friction of practice, not just the syntax of theory.

  I ask you: Did this curriculum give you the ground, or only the map? Did you learn to feel the weight of a decision, or just classify it? We must ask if our moral commitments are tied to specific research practices—code audits, subject interviews, failure analyses—rather than just signed pledges. Principles without practices are just more tokens. If you leave here knowing the definition of "bias" but never debugging a dataset that hurts people, you are ungrounded.

