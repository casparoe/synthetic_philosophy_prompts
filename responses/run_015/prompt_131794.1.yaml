prompt: |-
  I'm giving the commencement address for our university's philosphy-of-mind and AI track — audience is split between the grads, who know Harnad's symbol-grounding problem cold, and parents who mostly think AI is ChatGPT. I want the talk to actually turn on the symbol grounding problem, not just decorate it: the core argument should be that earning this degree risks being like acquiring a symbol system without sensory grounding, especially now that LLMs can manipulate language with zero embodied experience. But I want to inject a weird extension — call it "ethical grounding" — asking whether moral commitments also need to be tied to specific research practices rather than just abstract principles, and whether our curricullum actually gives students that or only the vocabulary of ethics.

  The speech has to land for both halves: the experts should feel the conceptual pressure, the family should understand why it matters that their kid isn't just learning to talk. Don't explain the problem from scratch like a textbook; assume the grads know it, but use it to frame what a commencement actually means. Keep it definately under 450 words, about three minutes spoken. At the end, please say how confident you are in the "ethical grounding" move and single out the point you're least sure about — I know that's a stretch from Harnad's original framing.
