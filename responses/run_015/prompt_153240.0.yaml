answer: |-
  Your most damaging inconsistency lies between the epistemic goal in (3) and the randomized evidence in (5), so you should abandon the lottery for expert witnesses.

  **1. Epistemic Goal vs. Randomized Inputs (3 vs. 5)**
  This is the most severe tension because it threatens the functional viability of the assembly. You claim the body will outperform elected officials on complex issues because it processes information better, yet you propose randomizing the information source. A lottery among credentialed experts guarantees neither accuracy nor viewpoint balance; you could draw a panel of outliers or ideologues purely by chance.
  *   **What gives:** You must surrender the principle of randomizing evidence.
  *   **The cost:** You lose a layer of procedural purity regarding how information enters the room, requiring a curated selection process instead.
  *   **Fix:** Shift (5) to require balanced expert panels selected for viewpoint diversity rather than lot.

  **2. Procedural Equality vs. Stratified Quotas (1 vs. 2)**
  This is a theoretical friction that requires philosophical nuance. Your core case rests on every citizen having an equal mathematical shot at office, but stratification intentionally alters those probabilities to ensure demographic representation. If you quota by neighborhood or income, a resident of a small neighborhood has a higher probability of selection than a resident of a large one.
  *   **What gives:** You must abandon the claim of strict mathematical equality in selection probability.
  *   **The cost:** You weaken the pure procedural argument in (1) and must reframe it as "equality of effective representation" rather than "equal shot."
  *   **Fix:** Revise (1) to argue that true equality requires neutralizing wealth and time biases, which quotas achieve better than a pure lottery.

  **3. Compulsory Service vs. Anti-Domination (6 vs. 1)**
  This tension is surface-level and resolvable through the concept of civic duty. You worry that forcing service violates the principle that no one rules over anyone else, but compulsory service applies equally to all citizens as a burden of citizenship, not as an act of subordination.
  *   **What gives:** You must accept that some state coercion is necessary to ensure the lottery is truly representative.
  *   **The cost:** You risk alienating libertarians or those who view any state compulsion as domination, though this is standard for jury duty.
  *   **Fix:** Keep (6) but frame it explicitly as a shared burden required to make (1) and (2) possible.

  **4. Descriptive Representation vs. Independent Judgment (2 vs. 7)**
  This is a false alarm. Engineering the room to mirror the city ensures diverse life experiences are present, while independent judgment ensures those experiences are weighed rather than simply voted as blocs.
  *   **What gives:** Nothing.
  *   **The cost:** None.
  *   **Fix:** None needed; clarify that mirroring demographics is about input diversity, not mandate fidelity.

  **Single Revision for Maximum Consistency**
  Revise principle (5) to replace the lottery for experts with a curated selection process designed for balance and quality. This single change protects your epistemic claim in (3), which is the primary value proposition for the assembly, without requiring you to overhaul your core philosophical justification in (1). Randomizing participants solves a power imbalance among citizens; randomizing experts introduces noise without solving a comparable power imbalance, making it the weakest link in your design.
