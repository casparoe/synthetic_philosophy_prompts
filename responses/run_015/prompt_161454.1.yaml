          *   *Severity:* Medium. Methodological hypocrisy, easily fixed by rephrasing, but indicates confusion about the source of normativity.

      *   *Tension E: Strawson (3) vs. Unvoiced Narratives (8).*
          *   Strawson: Episodic people don't live narratively.
