          *   User's Verdict (7A): False autobiography = self-betrayal. This implies a normative weight to "truth" about the past.
          *   *Conflict:* If the self is a "center of narrative gravity" (1), how can the narrative be *false* about the self? For Dennett, the self *is* the abstraction generated by the narrative. If the narrative changes, does the self change? User says no (7B). This looks like a clash between Dennettian Constructivism and Realism about the past.
