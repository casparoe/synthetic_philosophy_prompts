answer: |-
  **MEMORANDUM**

  **TO:** Accommodations Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework for Upcoming Petitions (Cases 104 & 105)

  **Purpose**
  At our last meeting, we identified a gap in our policy language regarding "diagnosed disease, disorder or medical condition." Without a defined standard for *normal functioning*, we risk inconsistent rulings that either medicalize normal aging or exclude valid neurological minorities. This memo proposes a working definition to resolve the two pending petitions and establish a precedent for future cases.

  **Proposed Standard: Statistical Prevalence and Functional Impact**
  To operationalize "medical condition" without acting as a general complaints desk, I recommend we adopt a two-pronged test:
  1.  **Physiological/Neurological Basis:** The petitioner must demonstrate an enduring trait rooted in biology (metabolic, hormonal, neurological, etc.), not merely a preference or temporary state.
  2.  **Statistical Deviation within Reference Class:** The trait must represent a significant statistical deviation from the **age-peer norm**, not a species-typical baseline (e.g., healthy 25-year-olds).

  **The Reference Class Decision**
  We must explicitly reject the "Healthy Young Adult" baseline for metabolic and physiological metrics. If we define disease as any deviation from peak youthful functioning, we categorize normal aging as pathology. This is medically unsound and unsustainable for a university employer. We must compare petitioners to their **age-peer group**.

  However, for congenital neurological variations, the reference class remains the **general population**, as these traits are not age-dependent.

  **Case Recommendations**

  **Case 104: Lab Manager (47)**
  *   **Facts:** Metabolic pattern deviates from 25-year-old norms but matches 40% of 47-year-olds. Symptoms (fatigue) are real; medical intervention normalizes numbers but not symptoms.
  *   **Analysis:** Under the age-peer standard, a trait present in 40% of the demographic is statistically normal, not a disorder. Furthermore, the failure of the drug to alleviate symptoms suggests the metabolic pattern is not the causal agent of the fatigue.
  *   **Recommendation:** **DENY** medical accommodation.
  *   **Rationale:** We cannot grant medical accommodations for statistically normal aging processes where causality is unproven. To do so would require us to accommodate all age-related decline as disease.
  *   **Alternative:** Refer to HR for administrative schedule flexibility under general staff wellness policies, decoupled from medical diagnosis.

  **Case 105: Programmer (30)**
  *   **Facts:** Congenital neurological variation (2% prevalence). No pain, but specific environmental triggers (lighting, layout) prevent full work capacity.
  *   **Analysis:** The trait is a documented neurological deviation from the general population norm (2% vs. 98%). While the petitioner feels "fine" in other contexts, the *interaction* between this neurological trait and our standard environment creates a substantial functional limitation.
  *   **Recommendation:** **APPROVE** accommodation (environmental modification).
  *   **Rationale:** The "condition" is the neurological variation, not the building. The disability arises from the mismatch. Our policy covers conditions that limit work capacity; it does not require the employee to be in constant pain or "sick" in a traditional sense.

  **Addressing the "Concept of Disease" Objection**
  I anticipate objection regarding Case 105. The concern is that if we approve a petitioner who "feels fine" and is only limited by our specific building, we abandon the concept of disease and become a complaints desk.

  *The Losing Argument (Steelman):* If disability is purely relational (person vs. environment), then anyone who dislikes the office lighting could claim a "condition." By approving Case 105, we sever the link between accommodation and pathology. We risk transforming the committee into a design review board where personal comfort overrides medical necessity. If he isn't sick, why does he need a medical exemption?

  *Rebuttal:* This argument conflates "disease" with "disability." We are not certifying that the programmer is "ill"; we are certifying that he possesses a **neurological minority trait** that interacts poorly with standard infrastructure. We do not become a complaints desk because the gatekeeper remains the *biological basis* (the congenital variation), not the complaint itself. A preference for dim light is not a condition; a neurological processing variation that makes standard light incapacitating *is*. Approving this does not erase the concept of disease; it updates our understanding of disability from "broken body" to "mismatched context," which aligns with current legal and ethical standards (e.g., ADA/Equality Act interpretations).

  **Implementation and Review**
  If approved, Case 105's accommodation should be reviewed in **12 months** to ensure the environmental modifications resolve the functional limitation without creating undue hardship. Case 104's referral to HR should be tracked to ensure non-medical pathways for age-related fatigue are viable.

  **Conclusion**
  Adopting the **Age-Peer Norm** for physiology protects us from medicalizing aging (Case 104). Adopting a **Functional Interaction** model for neurological traits allows us to support neurodivergent staff without requiring them to be "sick" (Case 105). This framework maintains the integrity of "medical condition" while acknowledging that work capacity is determined by both the employee and the environment.

  I request we vote on this framework prior to adjudicating the specific cases.
