answer: |-
  Your TA isn't just vibing; she's pointing at the "Archimedean Point" problem that has haunted this literature since Rawls. If you lift yourself out of the world to see it clearly, you might also lift yourself out of the world that gives your judgments weight.

  Since you need to prioritize for a six-week paper, here is the breakdown. I'm skipping the survey and giving you the structural dependencies.

  ### A Better Analogy: Friction, Not Lenses
  Stop thinking of idealization as **cleaning a lens**. That implies the moral truth is already there, fully formed, and your social position is just smudge on the glass.

  Think of it as **traction in mechanics**.
  To move (to have normative grip), you need friction. Rawlsian idealization treats social position and affect as friction—things that cause heat and slow down the machine of reason. But if you remove *all* friction, the wheels spin. You have perfect motion, but you go nowhere. The question isn't whether the view is clearer; it's whether the idealized agent still has enough "grip" on human life to generate reasons that apply to us.

  ---

  ### The Ranked Questions

  Here are the three questions that determine if indirect normativity is doing work or just hiding intuition. They are ordered by logical dependency. If the first one fails, the others don't matter.

  #### 1. The Divergence Condition (Upstream)
  **Question:** *Can the idealized procedure produce an outcome that contradicts the theorist's pre-theoretical intuitions?*

  *   **Why this is #1:** This is the "Curtain" test. If the Original Position or the Ideal Advisor *always* outputs what Rawls or Railton already believed was right before they built the model, the model is doing no work. It's a Rube Goldberg machine designed to validate a gut feeling. For indirect normativity to be real, the procedure must have **independent constraint**. There must be a possible world where the veil of ignorance leads to utilitarianism, or the ideal advisor tells you to betray your friend.
  *   **The Shift:** If you can show that the parameters of idealization are rigged to guarantee a specific outcome (e.g., by defining "rationality" in a way that smuggles in liberal values), the project collapses into direct intuitionism disguised as procedure.
  *   **Paper Move:** Don't ask if the outcome is *correct*. Ask if the outcome is *surprising*. If the theory cannot be falsified by its own procedure, it isn't a procedure; it's a sermon.

  #### 2. The Affective Constitution Question (Midstream)
  **Question:** *Is situated affect a distortion of valuation, or a constituent of it?*

  *   **Why this is #2:** This addresses your TA's point and depends on Q1. If you pass the Divergence Condition (the procedure *can* surprise you), you still need to know if the agent inside the procedure is capable of valuing anything. If "caring" about a future self or another person requires specific emotional hardware (empathy, fear, attachment) that is stripped away by idealization, then the idealized agent isn't making a *normative* judgment; it's running a calculation.
  *   **The Shift:** If affect is constitutive (you need to feel stakes to have reasons), then radical idealization (Rawls) fails, but moderate idealization (Railton) might survive. Railton's advisor knows everything but still cares about the agent. If that "caring" requires situatedness, Railton is in the same boat as Rawls.
  *   **Collapse Potential:** If you argue that affect is constitutive, you force a redesign of the idealization. You can't just "strip away" social position; you have to "translate" it. This collapses the traditional Veil of Ignorance but keeps the Ideal Advisor alive if modified.
  *   **Paper Move:** Argue that without situated affect, the idealized agent has no *stakes*, and without stakes, there are no *reasons*, only preferences.

  #### 3. The Authority Transfer Problem (Downstream)
  **Question:** *Why is the non-ideal agent bound by the choice of the idealized agent?*

  *   **Why this is #3:** This only matters if Q1 and Q2 are resolved. Suppose the procedure is independent (Q1) and the agent can actually value things (Q2). Why should *you*, sitting here with your biases and emotions, do what that sanitized version of you said? This is the "Authority Gap."
  *   **The Shift:** If the idealized agent is too different from you (because you answered Q2 by saying affect is necessary), then their advice might not apply to your reality. If they are too similar (they kept your affect), then they aren't idealized enough to solve Q1.
  *   **Collapse Potential:** Solving Q1 and Q2 often breaks Q3. If you make the procedure robust enough to generate real reasons (Q1 & Q2), it often becomes too distant to command your obedience (Q3).
  *   **Paper Move:** This is your conclusion/horizon. You likely won't solve it in six weeks, but you should frame your argument so that your stance on Q2 dictates the answer to Q3.

  ---

  ### How to Structure the Paper

  If I were writing this, I would treat **Question 2 (Affect)** as the lever to solve **Question 1 (Divergence)**.

  1.  **Thesis:** Indirect normativity fails the Divergence Condition (Q1) *because* it treats affect as noise rather than machinery (Q2).
  2.  **Argument:** Show that when Rawls/Railton strip away affect to ensure "purity," they inadvertently strip away the constraints that would allow the procedure to diverge from their own intuitions. They build a machine that only runs on their own fuel.
  3.  **Proposal:** A "moderate idealization" that retains situated affect (friction) allows for actual divergence (traction).
  4.  **Implication:** This changes the Authority Transfer (Q3). We obey the idealized self not because it is pure, but because it is a *calibrated version* of our own situated concerns, not a replacement for them.

  ### Summary of Priorities
  1.  **Divergence:** Is the machine rigged? (If yes, stop writing).
  2.  **Affect:** Is the fuel real? (If no, the machine won't run).
  3.  **Authority:** Does the output bind us? (Only check this if the machine runs and isn't rigged).

  Focus your energy on the link between **Affect** and **Divergence**. That is the crux. If you can show that removing affect *causes* the lack of divergence (i.e., it makes the outcome predictable based on the theorist's bias), you have a paper that cuts through the noise.
