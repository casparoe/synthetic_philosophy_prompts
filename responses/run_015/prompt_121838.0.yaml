      *   *Fixing (3) vs. (4) given (2):*
          *   You need a distinction between Water and Mind that isn't 2D.
          *   Distinction: Water is picked out by contingent description. Mind is picked out by direct acquaintance.
          *   This fits with (6) (Essences). We know the essence of pain directly. We know the essence of water via description.
          *   This reconciles (2), (3), (4), and (6).

      *   *Fixing (6) vs. (4):*
          *   If we know the essence of the phenomenal directly (acquaintance), we know it doesn't entail physical structure.
          *   This saves (4) without violating (6).

