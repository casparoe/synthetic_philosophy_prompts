          *   *Land Values:* Both agree land values drive behavior.

      *   **Section 2: The Disagreements Table (The Cruxes):**
          *   *Crux 1: Filtering Mechanics.* YIMBY says it works within sub-markets. CLT says it leaks upward or induces demand.
              *   *Term Coining:* Let's coin "The Permeability Gap" or "Filtering Latency." Let's try **"The Filtering Latency vs. Speculative Spike"**.
              *   *Case Study:* A specific upzoning event. Maybe Minneapolis 2040 or a specific transit corridor. Let's use a generic but realistic "Transit-Oriented Development (TOD) Corridor" scenario to avoid citing fake specific papers. Or better, reference a well-known dynamic like the "New York Luxury Condo" effect vs. "Minneapolis Duplex" effect. Let's stick to the prompt's instruction: "concrete case or study both would agree is relevant." I'll use the *Minneapolis 2040 Plan* as the reference point since it's the canonical YIMBY win/CLT skepticism case.
          *   *Crux 2: Community Character.* YIMBY says it's exclusion. CLT says it's social capital.
              *   *Term Coining:* **"The Character Proxy Problem."**
              *   *Case Study:* A historic district designation or a specific neighborhood fight (e.g., Harlem or Boyle Heights). Let's use *Historic District Designation* impacts.
          *   *Crux 3: Veto Power.* Who decides?
              *   *Case Study:* Community Benefits Agreements (CBAs).

      *   **Section 3: Verbal Disputes (The Word Games):**
          *   "Affordability" (Market rate vs. Cost-burdened).
          *   "Displacement" (Physical eviction vs. Cultural/Financial pressure).
          *   "Rights" (Right to build vs. Right to stay).

      *   **Section 4: The Exact Disagreement (No Cop-outs):**
          *   Instead of "values," frame it as a bet on *time* and *power*. YIMBY bets on market speed; CLT bets on political protection.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Need to loosen the language. Use phrases like "We both admit," "Here's where we split," "Let's call this..."
      *   *Constraint Check:* Did I invent fake studies? No, I'll reference known phenomena or general data trends without citing specific fake authors. Did I coin a term? Yes ("The Speculative Lag").
      *   *Specific Prompt Requirement:* "Filtering takes time but does happen in some markets" needs to be in the Agreed Claims.
      *   *Specific Prompt Requirement:* "One crux is whether filtering actually operates within the same sub-market or only leaks upward."
      *   *Specific Prompt Requirement:* "Another is whether community charactor is a real collective good or just a proxy for exclusion."

  5.  **Drafting the Content (Iterative refinement):**
      *   *Agreed Claims:* Make sure the CLT person doesn't feel betrayed. "Filtering happens" is okay if qualified with "over long periods."
