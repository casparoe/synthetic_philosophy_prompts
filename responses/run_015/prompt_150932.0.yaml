answer: |-
  # The Housing Truce: A Working Doc for [Reading Group Name]

  **Date:** October 26, 2023
  **Signatories:** [YIMBY Name] & [CLT Name]
  **Status:** Draft for Discussion

  Look, we've been arguing about this for a year. We're tired, the group is tired, and we keep having the same fight with different words. This document isn't a solution. It's a map of where we actually stand. We both signed this to say: *These are the facts we accept, these are the places we split, and here is exactly what evidence would change our minds.*

  ### 1. Agreed Claims (The Common Ground)
  *We both accept the following premises. If either of us finds new data that disproves these, we promise to update the doc before restarting the argument.*

  1.  **Zoning History:** Exclusionary zoning (specifically single-family-only mandates) was historically used to enforce racial and economic segregation. We both agree this was wrong and that current zoning codes often inherit those biases.
  2.  **Rent Burden:** Rents in our metro area have outpaced income growth for the last 15 years. This is unsustainable for working-class residents regardless of the cause.
  3.  **Displacement is Real:** People are being forced out of their neighborhoods. We agree that involuntary displacement causes measurable harm (health, social networks, school stability).
  4.  **Filtering Reality:** We agree that "filtering" (older housing becoming cheaper over time) is a real economic phenomenon that *does* occur in some markets over long time horizons. We disagree on whether it happens fast enough or reliably enough to protect current renters.
  5.  **Land Value Dynamics:** We agree that land values are not static. New infrastructure or amenities can raise land values, which can increase property taxes and pressure landlords to raise rents.
  6.  **No Silver Bullet:** We agree that neither "build everything" nor "block everything" is a complete policy suite. Both of us accept that some form of subsidy is needed for the lowest income tiers, regardless of zoning.

  ### 2. The Disagreements Table
  *This is the core conflict. We've pinned down the cruxes. For each, we've listed a concrete case study we both agree is relevant, and what we each predict the data would show.*

  | Crux | [YIMBY Name] Position | [CLT Name] Position | Relevant Case / Data | Predicted Outcome (YIMBY) | Predicted Outcome (CLT) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Vacancy Chain Integrity**<br>*(Does filtering work within the same sub-market?)* | New market-rate supply creates a "vacancy chain." A luxury unit frees up a middle unit, which frees up a lower unit. The chain is intact. | The chain is leaky. New luxury units attract external capital/investors, leaving vacancies empty or converting them to short-term rentals. Supply induces speculative demand. | **Minneapolis 2040 Plan** (Upzoning citywide). | Rent growth will slow citywide within 3-5 years as vacancy chains activate. | Rents will stabilize only in new buildings; existing stock will see rent hikes due to "neighborhood upgrading" signals. |
  | **2. The Character Proxy**<br>*(Is "neighborhood character" a collective good or exclusion?)* | "Character" is mostly a code word for exclusion. Preserving physical character (height, density) preserves economic homogeneity. | "Character" is social fabric. Stability allows trust networks to form. Rapid physical change disrupts the social contract, regardless of intent. | **Historic District Designations** (e.g., Brooklyn or SF). | Designations lock in scarcity, raising prices and excluding lower-income newcomers. | Designations protect existing tenants from predatory redevelopment and maintain community cohesion. |
  | **3. Veto Power**<br>*(Who holds the right to the city?)* | The right to the city is the right to *access* it. Veto power by current residents creates a cartel that locks out outsiders. | The right to the city is the right to *stay* in it. Veto power is a defense mechanism against capital that treats homes as assets. | **Community Benefits Agreements (CBAs)** in large developments. | CBAs slow down supply and add costs that get passed to renters, reducing overall housing stock. | CBAs are the only tool to extract tangible guarantees (local hiring, rent caps) from developers who otherwise extract value. |

  ### 3. Verbal Disputes (The Word Games)
  *We realized we're fighting about definitions as much as policy. We agree to stop using these words until we define them in context.*

  *   **"Affordability":**
      *   *The Trap:* When [YIMBY] says "affordable," they mean *market rate stabilization* (rents growing slower than inflation). When [CLT] says "affordable," they mean *cost-burdened elimination* (rent <30% of local median income).
      *   *The Fix:* We will specify "Market Affordability" vs. "Income-Adjusted Affordability."
  *   **"Gentrification":**
      *   *The Trap:* [YIMBY] hears "investment and safety improvements." [CLT] hears "cultural erasure and eviction."
      *   *The Fix:* We will use "Displacement" (physical move) vs. "Neighborhood Upgrading" (amenity change). We acknowledge these can happen independently.
  *   **"Supply":**
      *   *The Trap:* [YIMBY] counts *permits issued*. [CLT] counts *units permanently affordable*.
      *   *The Fix:* We will distinguish between "Gross New Units" and "Net Accessible Units."

  ### 4. Coined Term: "The Speculative Lag"
  *We need a name for the deadlock on timing.*

  **Definition:** The time gap between *new construction completion* and *price relief for existing residents*.
  *   **[YIMBY] View:** The Speculative Lag is short (1-3 years). Market corrections happen quickly once zoning barriers are removed.
  *   **[CLT] View:** The Speculative Lag is infinite. By the time the new units filter down, land speculation has already priced out the original residents. The lag is longer than the average lease cycle.

  ### 5. The Exact Disagreement (No Cop-Outs)
  *We are not ending this with "we just have different values." We both value stability and access. The disagreement is mechanistic.*

  **The Bet:**
  The core disagreement is not about *who* deserves housing, but about **the elasticity of demand in high-cost markets.**

  *   **[YIMBY] claims:** Demand is finite. If you build enough units, the pressure lifts. The market is a container; if you make it bigger, the water level drops.
  *   **[CLT] claims:** Demand is elastic (induced). If you build more units in a high-demand zone, you signal "growth," attracting more capital and higher-income earners, keeping the water level high.

  **How We Settle This:**
  We will not argue theory anymore. We agree to review the **5-year post-implementation data for the Minneapolis 2040 Plan** (or equivalent upzoning in a comparable city) once available.
  *   **If** median rents in pre-existing stock drop or stabilize below inflation: [YIMBY] is right about the Vacancy Chain.
  *   **If** median rents in pre-existing stock rise despite new supply, correlated with increased transaction volume: [CLT] is right about Speculative Lag.

  Until then, we agree to disagree on the *mechanism*, while collaborating on policies we both like (e.g., streamlining permits *paired with* anti-harassment tenant protections).

  ***

  **Signed,**

  _________________________ (The Supply-Sider)

  _________________________ (The Community-Sider)
