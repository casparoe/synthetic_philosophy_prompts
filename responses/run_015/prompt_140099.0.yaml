  **DEPARTMENT FOR ETHICAL CONTINUITY**
  **CONSULTATION DRAFT: The Moral Residue (Administrative Provision) Order 2024**

  **1. Purpose and Scope**
  1.1 This Instrument operationalises the necessity of moral remainder in executive decision-making. It is recognised that certain state acts are simultaneously necessary and morally wrongful. Where an official performs such an act without sustaining psychological damage, the act risks becoming mere bureaucracy. The Directorate exists to guarantee both the act and the damage.

  **2. Guilt Preservation Regime**
  2.1 Appointees ("Hands") shall serve a single term of operation. Re-deployment is prohibited; repetition habituates the agent, converting tragic necessity into routine immorality.
  2.2 Post-operation remorse shall be audited against a Target Distress Level (TDL).
  2.3 *Explanatory Note:* Current data indicates the TDL is being gamed via performative weeping. The proposed fix is to require evidence of lasting psychological pathology for pension eligibility. This encourages candidates to sabotage their own mental health to meet the threshold, but ensures the guilt is somatically real.

  **3. The Non-Justification Clause**
  3.1 The Hand is contractually barred from receiving the operative strategic rationale for the order.
  3.2 *Explanatory Note:* If the agent understands the utilitarian calculus, they may justify the act to themselves, dissolving the moral residue. Ignorance preserves the wrongness. It is acknowledged this leaves the agent unable to distinguish their duty from common criminality, but this epistemic uncertainty is required to maintain the integrity of the sacrifice.

  **4. Sanction and Indemnity**
  3.3 Upon completion, the Hand must be subject to public censure and disgrace.
  3.4 Following censure, the Hand shall be quietly pensioned at Grade 7 equivalent.
  3.5 *Footnote 1:* Public censure validates the moral law; private indemnity validates the state necessity. The tension is a feature, not a bug.^[1]

  **5. Recruitment and Annex B**
  5.1 Annex B (Recruitment of Officials with Clean Hands) has been rejected. Candidates without prior moral compromise lack the flexibility required for high-office contamination.
  5.2 Conversely, candidates expressing eagerness to serve in this Directorate are automatically disqualified. Enjoyment of the function indicates a lack of moral remainder, rendering the candidate a monster rather than a leader.
  5.3 *Explanatory Note:* The Directorate is currently operating at 40% capacity due to these conflicting criteria.

  **6. Audit and Assurance**
  6.1 To certify that guilt is sincere you need auditors unmoved by guilt, i.e. the Department must go out and recruit the monsters it exists to prevent.
  6.2 Recruitment of Audit Staff will proceed under Exception Clause 9.

  **7. Consultant Feedback**
  7.1 The Department retains Prof. L. M. Sterling (Emeritus) for theoretical oversight. Prof. Sterling notes: "The scheme offers an elegant mapping of tragic residue onto civil service grades."
  7.2 Former Hand (Unit 7) testimony: "I don't know if I saved them. I just know I'm damned. That's enough."

  **8. Questions for Consultees**
  8.1 Should the Target Distress Level be adjusted for physiological variance?
  8.2 Is the current pension tier sufficient to offset public disgrace without appearing to buy silence?
  8.3 Are there alternative metrics for sincerity that do not induce self-sabotage?

  **9. Commencement**
  9.1 This Order comes into force upon Royal Assent.

  ***

  ^[1] Resolving this contradiction would imply either the act was wrong (stop doing it) or right (stop punishing the doer). Neither option is available.

  **END OF DRAFT**
