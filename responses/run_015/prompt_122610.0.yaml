          *   *Actually, looking closer:* The prompt asks to stress-test the *User's* rival picture. I need to validate the User's suspicion. The Pump metaphor *fails* the stress test on the "fixed quantity/independence" criteria. The Poll metaphor *passes* the "shifting answers" test.
          *   *The "Decoration" call:* The Pump metaphor is the decoration. It makes the process look cleaner than it is. The Poll/Dye is the hard truth. But I need to offer a Third Metaphor that saves the pedagogical utility without the falsehood. **Calibration** is good. Or **Cartography**. Let's go with **Calibration**.

  6.  **Writing the Content (Iterative refinement):**

