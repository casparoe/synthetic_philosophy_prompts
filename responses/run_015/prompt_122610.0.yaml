  7.  **Final Polish:** Ensure the tone is direct. Avoid "on the one hand." Make a call. (Self-Correction: Make sure I answer the specific question about "which is doing the arguing." The Pump metaphor *is* the argument for the colleague. It's not decoration *for him*. But for *reality*, it's decoration. I need to be precise. The prompt asks: "which one is doing the arguing and which one is decoration?" in the context of explaining what happens. Okay, I will argue the Pump is the decoration masking the real cognitive work.)

