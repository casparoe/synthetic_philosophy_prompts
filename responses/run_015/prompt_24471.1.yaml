answer: |-
  **The Phantom Constraint: Underdetermination in the Dark Matter Debate**

  Your irritation is well-founded. In the philosophy of science, the underdetermination of theory by evidence (UTE) is often wielded as a skeptical bludgeon, suggesting that because logic allows for multiple theories to fit the data, evidence alone can never truly compel belief. For the practicing scientist, this feels like a category error. Science is not merely about logical compatibility with data points; it is about constructing coherent, robust models of the world. When we examine the standoff between $\Lambda$CDM (Lambda-Cold Dark Matter) and MOND (Modified Newtonian Dynamics), we see not a philosophical paradox, but the ordinary, messy grind of theory selection where UTE proves to be a vacuous logical point rather than a substantive constraint.

  To understand why, we must distinguish between *logical* underdetermination and *pragmatic* underdetermination. Logically, yes, for any finite set of data, infinitely many curves can be drawn. You can always save MOND from the cosmic microwave background (CMB) by appending auxiliary hypotheses—perhaps massive neutrinos, perhaps a specific relativistic extension like TeVeS. You can always save $\Lambda$CDM from galactic rotation curves by tweaking baryonic feedback models. If the criterion for theory choice were strictly "consistency with current data," then UTE would hold, and the debate would be stalled indefinitely.

  But that is not the criterion. The debate is not stalled because the scientific community evaluates theories based on scope, coherence, and the cost of auxiliary assumptions. This is where the Duhem-Quine thesis—that any theory can be shielded from falsification by adjusting auxiliaries—loses its bite. It is logically true but pragmatically inert. A rescue operation is only successful if the auxiliary hypothesis is independently motivated and does not degrade the theory's explanatory power elsewhere.

  In the $\Lambda$CDM vs. MOND case, the evidence is not symmetric. $\Lambda$CDM is a cosmological model that successfully unifies primordial nucleosynthesis, the acoustic peaks of the CMB, and the large-scale structure of the universe within a single framework based on general relativity and standard particle physics. Its failures are primarily at the galactic scale (cusp-core, missing satellites), which are increasingly attributed to complex baryonic physics rather than fundamental gravitational flaws. MOND, conversely, is phenomenologically stunning at the galactic scale, predicting the baryonic Tully-Fisher relation with precision that $\Lambda$CDM struggles to match naturally. However, MOND fails catastrophically at the cluster and cosmological scales unless it is hybridized with dark matter (e.g., hot neutrinos).

  Here lies the dissolution of underdetermination. When MOND proponents add neutrinos to fit cluster data, they are not merely tweaking an auxiliary; they are importing the ontological commitment they sought to eliminate. If a theory called "No Dark Matter" requires dark matter (in the form of neutrinos) to fit the data, it ceases to be a distinct alternative in the relevant sense. The "underdetermination" evaporates because one theory ($\Lambda$CDM) maintains coherence across scales, while the other (MOND) fractures into a patchwork of scale-dependent modifications. The evidence *does* determine the theory, provided we weigh coherence and scope as evidential virtues, which we rightly should.

  Therefore, this is not a case of genuine underdetermination where evidence runs out and philosophy must step in. It is a case of transient uncertainty where one model is clearly superior in scope but retains local anomalies. The Duhem-Quine point does not bite because the "tinkering" required to save MOND on cosmological scales is ad hoc in the pejorative sense: it is designed solely to save the phenomenon without independent justification, whereas the baryonic feedback mechanisms invoked in $\Lambda$CDM are grounded in hydrodynamical simulations and known physics.

  **Verdict:** Underdetermination is mostly a philosophical myth in this context. It describes a logical possibility that ignores the actual epistemic practices of science. The tie is not unbreakable; it is being broken by the asymmetry of explanatory scope and the non-ad hoc nature of the auxiliaries. $\Lambda$CDM is not accepted because the data logically force it, but because it is the only game in town that offers a unified narrative across all scales without contradictory ontological commitments. The data are not exhausted, but they are sufficiently directional to render UTE irrelevant to the actual progress of the field.

  ***

  **Confidence Note**

  I am highly confident (approximately 90%) in the philosophical argument that underdetermination is pragmatically vacuous when theory-choice virtues like coherence and non-ad hocness are accounted for. This aligns with the dominant "naturalistic" turn in modern philosophy of science.

  The point I am least sure of is the specific current status of relativistic MOND formulations (such as TeVeS or newer bimetric theories) regarding the CMB. While the mainstream consensus is that they fail to fit the data as well as $\Lambda$CDM without reintroducing dark components, my training data may not capture the very latest numerical constraints from recent Planck releases or gravitational wave events (like GW170817) that constrain gravitational slip. If a relativistic MOND variant emerges that fits the CMB as well as $\Lambda$CDM without dark matter, the "asymmetry of scope" argument would weaken, though the coherence argument would likely remain.
