      *   **The Structure of the Suspension:**
          *   Distinguish Hegel's *Sittlichkeit* (social ethics) from Kierkegaard's Religiousness B.
          *   It's not "Exception to the Rule" (Particularism); it's "Teleological Suspension." The *telos* (end/goal) lies outside the ethical sphere.
      *   **The Psychosis Objection (The Crux):**
          *   Why isn't he mad? Because of the *Double Movement*.
          *   Knight of Infinite Resignation vs. Knight of Faith.
          *   Resignation: I give up Isaac forever. (Tragic hero).
          *   Faith: I give up Isaac *and* believe I get him back by virtue of the absurd.
          *   This belief *in this life* is what separates faith from madness/murder.
      *   **Abraham's Self-Understanding:**
          *   Is it opaque? No, it's *passionate*.
          *   He understands the *anxiety*. He understands the *cost*.
          *   He lacks *mediation* (logical bridge).
