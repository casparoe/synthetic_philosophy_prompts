          *   *Distinction:* Geochemistry is local/invariant. Cosmology is global/model-dependent. The geochemist was "in the clear" metaphysically; the cosmologist is making a model assumption.

      *   **The Gödel Hypothetical:**
          *   Gödel universe has closed timelike curves (CTCs). No global Cauchy surface. No global "time."
          *   Would cosmologists stop quoting an age? Yes, or they'd quote something local (e.g., "proper time since the local singularity").
          *   *Implication:* This proves Cosmic Time is a *discovery* about our specific universe's matter distribution, not a metaphysical posit about Time itself. It reinforces the "contingent preference" view.

      *   **The "Now" in the Block Universe:**
          *   "The universe is 13.8 Gyr old now."
          *   In Block Universe: This is indexical. Like "I am here." It identifies a specific hypersurface ($t=13.8$) relative to the speaker's location within the block.
          *   It's not creating reality; it's indexing a location.
          *   Analogy: "The mountain is 3000m high here." (Relative to sea level coordinate).

      *   **Concrete Changes in Cosmological Writing (Rietdijk–Putnam Seriousness):**
          *   Current: "The universe recombined at 380,000 years."
