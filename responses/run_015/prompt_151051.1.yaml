      *   **Context:** Attends an evening philosophy group. Finds the Block Universe/Eternalism argument "annoyingly hard to shake" but notices a disconnect between that view and how physicists/cosmologists actually *practice*.
      *   **Core Question:** What does the practice of cosmologists (using a single cosmic time/age of the universe) presuppose about time, given their simultaneous adherence to Special Relativity (SR) where simultaneity is relative?
      *   **Specific Options to Evaluate:**
          1.  Eternalism + Pragmatic Convention (Cosmic time is just a convenient coordinate/gauge fixing).
          2.  Neo-Lorentzian view (Matter distribution picks out a *real* preferred foliation).
          3.  Operationalism (Time is just what clocks measure, no metaphysics).
      *   **Specific Constraints/Requests:**
