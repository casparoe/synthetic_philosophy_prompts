answer: |-
  It is a pleasure to speak with someone who knows the difference between a half-life and a half-truth. Your intuition is sharp: there is a genuine tension between the pedagogy of Special Relativity (SR) and the practice of Cosmology, but it is not a contradiction. It is a distinction between the *laws* of physics and the *contingent contents* of our universe.

  Here is the reconstruction of the implicit view held by the practicing cosmologist, separated into what the practice requires, what it permits, and where the metaphysical loading actually lies.

  ### 1. The Reconstruction: Eternalism with a Contingent Preference

  To answer your primary classification question: The package of practices presupposes **Eternalism (the Block Universe) plus a physically motivated but metaphysically lightweight convention.**

  It is **not** a Neo-Lorentzian view. In a Neo-Lorentzian theory, the laws of physics themselves would break Lorentz invariance; there would be a "true" rest frame detectable in principle by the form of the dynamical equations. In FLRW (Friedmann–Lemaître–Robertson–Walker) cosmology, the Einstein Field Equations remain generally covariant. The "preferred" frame (the comoving frame where the CMB is isotropic) is selected by the **boundary conditions** (the distribution of matter and energy), not by the laws.

  It is **not** pure Operationalism, because cosmologists make claims about regions of spacetime they cannot operationally access (e.g., "beyond the particle horizon").

  **The Verdict:** The choice of foliation is **gauge fixing enabled by physical conditions.**
  *   **Gauge Fixing:** In General Relativity, coordinates are arbitrary. You can slice spacetime however you like.
  *   **Enabled by Physical Conditions:** Our universe happens to contain a fluid (matter/radiation) that is, on large scales, homogeneous and isotropic. This physical fact singles out a specific class of observers (comoving observers) for whom the universe looks the same in all directions.

  When a cosmologist says "The universe is 13.8 billion years old," they are strictly saying: "The proper time elapsed along a comoving worldline from the initial singularity to the hypersurface of homogeneity on which I currently reside is 13.8 billion years."

  This sits comfortably with Eternalism. The "slice" at $t=13.8$ Gyr exists just as much as the slice at $t=5$ Gyr. The fact that we label one "now" is an indexical fact about our location within the block, not an ontological fact about the block's structure.

  ### 2. Strict Requirements vs. Comfortable Fit

  You asked to separate what the practice *strictly requires* from what it *sits comfortably with*.

  *   **Strictly Required:** The practice requires that the universe be sufficiently homogeneous and isotropic to define a meaningful "cosmic time" function $t$ where the metric takes the FLRW form. It requires that we, the observers, are approximately comoving (which we are, to within a dipole correction).
  *   **Merely Comfortable:** It sits comfortably with the *language* of Presentism ("The universe *is*...", "What is happening *now*..."). This is linguistic laziness, not physical necessity.
  *   **What it does NOT require:** It does not require that the $t=\text{const}$ slices are "more real" than tilted slices. If an alien flew past us at $0.9c$, their definition of "the age of the universe" (proper time along their worldline) would differ, and their simultaneity slice would cut through our "past" and "future." The cosmologist's claim does not invalidate the alien's; it just asserts that the comoving frame is the *useful* one for describing the fluid dynamics of the cosmos.

  **Gauge vs. Physical Claim:**
  The choice of foliation is **physically empty regarding ontology, but physically loaded regarding utility.**
  It is like choosing to describe a sphere using latitude and longitude. The poles are "special" coordinates (singularities in the chart), but the sphere doesn't care. However, if the sphere has a magnetic field aligned with the rotation axis, using those coordinates becomes physically insightful. The CMB provides the "magnetic field." It makes the comoving foliation *salient*, but not *ontologically privileged*.

  ### 3. Your Practice vs. The Cosmologists' (Geochemistry vs. Cosmology)

  You asked if your old practice was different in kind. **Yes, fundamentally.**

  *   **Isotope Geochemistry:** When you dated a zircon at 4.03 Ga, you measured a Lorentz invariant. The ratio of $^{207}\text{Pb}$ to $^{235}\text{U}$ is a scalar. It is the proper time elapsed along *that specific rock's worldline* between crystallization and your measurement. It does not depend on simultaneity. It does not depend on a global "now." You were comparing two events on a single curve. You were, as you suspected, "in the clear" under any relativistic metaphysics.
  *   **Cosmology:** When a cosmologist says "13.8 billion years," they are comparing events on *different* worldlines (here, there, and everywhere). They are asserting that all comoving worldlines started at the singularity at "the same time" and have experienced "the same duration" to reach the current hypersurface. This requires a synchronization convention (the hypersurface of homogeneity).

  Your work was about **proper time** (invariant). Their work is about **coordinate time** (frame-dependent, though physically motivated).

  ### 4. The Gödel Hypothetical

  This is the strongest test of the metaphysical status of Cosmic Time.

  In a Gödel universe (rotating matter, closed timelike curves), there is **no global hypersurface** orthogonal to the worldlines of the matter. You cannot slice the whole spacetime into "nows." Time, globally, is ill-defined.

  *   **Would cosmologists stop quoting an age?** Yes. Or rather, they would cease to quote a *global* age. They would report local proper times ("The proper time along this worldline since the local density maximum is...").
  *   **What does this tell us?** It confirms that the Cosmic Time we use is a **discovery about our universe's matter distribution**, not a metaphysical posit about Time itself.
  *   If Cosmic Time were a Neo-Lorentzian absolute, it would exist even in a Gödel universe (we just couldn't measure it). But in GR, if the geometry doesn't allow the slicing, the time coordinate doesn't exist.
  *   Therefore, the "13.8 billion years" is contingent. It is a property of *this* block, not a property of *time*. This undermines the idea that cosmologists are smuggling in an absolute present. They are simply exploiting a convenient symmetry our particular block happens to possess.

  ### 5. The "Now" in the Block Universe

  You ask: *If the block universe is right, what exactly am I doing when I say the universe is 13.8 billion years old "now"?*

  In the Block Universe, that sentence is **indexical**. It functions exactly like "It is raining *here*."
  *   "Here" picks out a spatial location within the block.
  *   "Now" picks out a temporal slice (or a location on a worldline) within the block.

  When you say "The universe is 13.8 Gyr old now," you are not bringing that slice into existence. You are identifying your location relative to the Big Bang singularity within the static manifold.
  *   **Is it a relation between two events?** Yes. Event A (Singularity) and Event B (Your measurement).
  *   **Is it about the contents of a slice?** It implies a claim about the hypersurface defined by $t=13.8$ Gyr in comoving coordinates.
  *   **Does it only make sense inside the block?** Yes. An "outside" view (sub specie aeternitatis) would see the whole manifold and wouldn't need the indexical "now."

  The Rietdijk–Putnam argument bothers you because it suggests your "now" is arbitrary. In Cosmology, it is *less* arbitrary than in SR because the matter distribution gives you a physical marker for "now" (the CMB temperature). But it is still just a coordinate.

  ### 6. Concrete Changes in Cosmological Writing

  If cosmologists took the Rietdijk–Putnam argument (and the lessons of GR) completely seriously in their writing, avoiding even the *appearance* of absolute presentism, how would a textbook change?

  **Current Standard Phrasing:**
  > "380,000 years after the Big Bang, the universe cooled enough for atoms to form, and light traveled freely."

  **Strict Block/GR Phrasing:**
  > "On the hypersurface of constant cosmic time $\tau = 380,000$ yr, the temperature of the photon-baryon fluid dropped below 3000 K, reducing the Thomson scattering opacity. Photons emitted from this hypersurface constitute the CMB observed by comoving observers at later cosmic times."

  **Current Standard Phrasing:**
  > "We want to know what is happening in distant galaxies *right now*."

  **Strict Block/GR Phrasing:**
  > "We wish to infer the state of distant galaxies on the hypersurface of simultaneity defined by our current cosmic time $\tau_0$."

  **The Difference:**
  In practice, technical papers *already* do this mostly. They speak of "redshift $z$" rather than "time $t$," because $z$ is an observable invariant along the light cone. They convert to $t$ only after assuming the FLRW metric.
  The "Presentist" language creeps in during **pedagogy and popularization**.
  If they took Rietdijk–Putnam seriously, they would stop using "now" to mean "simultaneous with my experience" and start using it to mean "on my current worldline segment." They would emphasize that "The Andromeda galaxy *now*" is a model-dependent reconstruction, not an observed fact.

  ### Summary for the Philosophy Group

  You can tell your group this:
  The cosmologists are not hypocrites. They are **Eternalists who have found a very convenient coordinate system.**

  1.  **SR** says there is no *lawful* preferred frame.
  2.  **Cosmology** says there is a *contingent* preferred frame (the CMB rest frame).
  3.  Using that frame to define a "Cosmic Age" is no more metaphysically loaded than a geographer using "Sea Level" to define altitude. Sea Level isn't an absolute metaphysical zero; it's just a physically salient reference surface provided by nature.
  4.  If the universe were Gödelian, "Sea Level" would vanish, and they'd have to stop quoting altitudes.
  5.  Your zircons measured **invariant intervals** (safe). The cosmologists measure **coordinate distances** (useful, but frame-relative).

  The Rietdijk–Putnam argument holds: there is no metaphysical "Now." But there is a physical "Comoving Slice." Confusing the latter for the former is a category error, but it's a category error that makes calculating the evolution of the universe much easier. The physicists know this; they just speak loosely when they aren't writing down the metric.
