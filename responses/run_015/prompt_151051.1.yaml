  5.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* I need to be careful not to say FLRW *proves* Eternalism. It's compatible with it. Presentism *could* try to ride on the FLRW frame, but it fails in GR generally.
      *   *Nuance:* Is Cosmic Time "gauge fixing"? In GR, coordinates are gauge. But choosing the *comoving* frame is fixing the gauge based on physical matter. So it's "physical gauge fixing."
