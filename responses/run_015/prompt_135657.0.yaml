  ### The Question I Am Hoping Nobody Asks
  **"Can you name one specific man in the archival record who fits your threshold description?"**
  *Why it is worse:* My thesis relies on the "threshold perpetrator" as a structural position or latent variable, not necessarily a named individual. The archives rarely record hesitation unless it becomes insubordination. If forced to name a specific individual (e.g., "Private X in Company Y"), I risk either fabricating evidence or admitting that the "threshold man" is a theoretical construct without empirical referent. This undermines the historian's demand for evidence and the social scientist's demand for identification simultaneously.

  ### The Two Replies That Absolutely Have to Land
  1.  **The Excuse/Blame Reply (Objection 2):** I must convince the room that explaining the causal convergence does not diminish moral responsibility. If the philosopher leaves thinking I am excusing the perpetrators via "overdetermination," the paper fails ethically. I need to land the point that *more* causal reasons to say no implies *greater* failure, not less.
  2.  **The Cruelty Asymmetry Reply (Objection 1):** I must distinguish between the *decision to kill* (participation) and the *manner of killing* (cruelty). If I cannot separate these dependent variables, the Historian's point that culture predicts cruelty while situation predicts compliance will destroy my symmetry claim. I need to hold the line that overdetermination applies to the act, while asymmetry applies to the style.

  ### The Concession I Should Volunteer in My Opening Two Minutes
  **"I am not arguing that culture and situation are equal in every instance, nor that they produce identical behaviors."**
  *Why:* By volunteering this early, I inoculate against the Historian's cruelty objection and the Social Scientist's linearity objection. It signals that I understand the nuances of the debate and am not proposing a crude "50/50" split. It allows me to frame overdetermination as a convergence on the *outcome* (participation) rather than a symmetry of *process*, which gives me the room to maneuver when the specific objections about cruelty and measurement arise later.
