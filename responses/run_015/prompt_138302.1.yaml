answer: |-
  **Correction Clause:** Your description of the mechanism is accurate; the unilateralist's curse arises when independent agents with a common goal but noisy private estimates act on a threshold rule, causing the group to execute initiatives based on the maximum outlier estimate rather than the mean collective estimate.

  ---

  ### 1. The Game: "Project Venture"

  **Objective:** Maximize your personal chocolate stash.
  **Core Mechanism:** A hidden "Truth" determines the project's value. Players receive noisy "Signals." Any single player can launch the project for everyone.

  **Materials Preparation (Pre-Class):**
  *   **The Truth Bag:** 20 folded index cards. 15 say **"TYPE A"**, 5 say **"TYPE B"**.
  *   **Deck A (Standard):** Take one deck of cards. Remove all Black cards except 4 (Spades/Clubs 2-5). Remove 4 Red cards (Hearts/Diamonds 2-5). You now have 36 Red, 4 Black. (90% "Go" signal).
  *   **Deck B (Crisis):** Take the second deck. Remove all Red cards except 8 (Hearts/Diamonds 2-9). Remove 8 Black cards. You now have 8 Red, 32 Black. (20% "Go" signal).
  *   **Stakes:** Each student starts with **5 chocolates**.
  *   **Payoffs:**
      *   **If Project Launched & Type A:** Each player gains **2 chocolates**.
      *   **If Project Launched & Type B:** Each player loses **10 chocolates** (All stash + 5 debt points tracked on paper).
      *   **If No Project:** Payoff is **0**.

  **Why these numbers?**
  *   **Prior Expectation:** 75% chance of Type A (+2), 25% chance of Type B (-10). Expected Value (EV) = $-1$. *Rational prior is Do Not Act.*
  *   **Individual Signal (Red Card):** If you see Red, Bayesian update suggests ~93% chance of Type A. Individual EV = $+0.86$. *Rational individual action is Act.*
  *   **Collective Signal (1 Red, 17 Black):** If the group pools info and sees mostly Black, the probability of Type B skyrockets. Collective EV is deeply negative. *Rational collective action is Do Not Act.*
  *   **The Curse:** The one person with the Red card acts (rationally), imposing the loss on the 17 who saw Black.

  ---

  ### 2. The Sequence (80 Minutes)

  **Whiteboard Setup:**
  Create a table with columns: **Round | Rule | Group Size | Truth | Red Signals | Decision | Payoff**.

  **Round 1: Tutorial (5 mins)**
  *   Select 3 volunteers. Explain the mechanics openly.
  *   Draw Truth (Type A). Deal from Deck A.
  *   Show how a Red card holder calculates their incentive.
  *   **Goal:** Verify they understand the payoff structure.

  **Round 2: The Curse (Unilateral) (10 mins)**
  *   **Rule:** Any single student can shout "Launch" to start the project.
  *   **Group:** All 18 students.
  *   **Procedure:** Draw Truth from Bag. *Instructor Note: If you draw Type A, reshuffle and draw again. You need a Type B here to demonstrate the loss.* Deal signals from Deck B.
  *   **Engineered Moment 1:** Likely 3-4 students will hold Red cards. They will feel justified in acting. The project launches. The Truth is revealed as Type B. Everyone loses 10 chocolates.
  *   **Record:** Write the result on the board. Highlight the count of Red cards vs. Black cards.

  **Round 3: Scale Sensitivity (10 mins)**
  *   **Rule:** Unilateral (same as Round 2).
  *   **Group:** Split into two groups of 9.
  *   **Procedure:** Run simultaneous rounds. Use Type B for at least one group.
  *   **Engineered Moment 2:** The group of 18 (Round 2) had 18 chances to trigger a false positive. The groups of 9 have fewer "lottery tickets" for error.
  *   **Comparison:** Show on the whiteboard that the larger group had a higher probability of catastrophic failure despite identical signal accuracy.

  **Round 4: Alternative Rules (15 mins)**
  *   Run three quick sub-rounds (Type A truth for all to show capability).
  *   **Majority:** Project launches if >50% raise hands. (Filters out the false positives).
  *   **Unanimity:** Project launches only if everyone agrees. (Prevents loss, but might miss Type A gains).
  *   **Delegation:** Group votes for one "Decider" who sees *three* signals instead of one. (Averages out noise).
  *   **Record:** Note the decision and payoff for each.

  **Round 5: Complications (20 mins)**
  *   **5a. Side-Benefit:** The person who shouts "Launch" gets a private bonus of +5 chocolates (losses still shared). *Prediction: Faster launch, higher loss risk.*
  *   **5b. Coordination Cost:** Students can pay 1 chocolate to force a 1-minute synchronous vote before anyone can act unilaterally. *Prediction: Only used if trust is high.*
  *   **5c. Experts:** Designate 3 students as "Experts." They draw 2 signals and average them. Only Experts can launch. *Verdict: Reduces noise, but does not fix the structural incentive for the Expert to act on a single high draw.*
  *   **5d. Deliberation:** Allow 2 minutes of open talk before decision. *Prediction: "I have a Red card" gets repeated 4 times, counting as 4 independent signals, inflating confidence.*

  **Round 6: Student Design (10 mins)**
  *   Ask the group to propose one rule change to maximize group chocolate wealth.
  *   Play one final round under their rule.

  **Debrief (10 mins)**
  *   (See Section 5).

  ---

  ### 3. Comparison and Wrinkles (Expected Values)

  | Rule | Mechanism | Expected Value (Type A) | Expected Value (Type B) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Unilateral** | Max(Signal) > Threshold | High (Captures most gains) | **Very Low** (High false positive rate) | **Fails on Risk** |
  | **Majority** | Mean(Signal) > Threshold | Moderate (Misses some gains) | **High** (Filters outliers) | **Robust** |
  | **Unanimity** | Min(Signal) > Threshold | Low (Misses many gains) | Highest (Zero false positives) | **Too Conservative** |
  | **Delegation** | Avg(Subset) > Threshold | High | Moderate | **Depends on Subset Size** |

  **Complication Verdicts:**
  1.  **Side-Benefit:** Worsens the curse. Aligns individual incentive *more* with action, less with group safety.
  2.  **Coordination Cost:** Fixes the curse *if* purchased. Shows the value of procedural friction.
  3.  **Experts:** Relocates the bias. If an Expert gets two Red cards, they act. It reduces the *frequency* of errors (fewer trigger-happy people) but not the *logic* of the error.
  4.  **Deliberation:** Double-edged. Helps if signals are complementary ("I saw Black"). Hurts if signals are correlated ("I also felt optimistic"). In this game, it usually hurts because Red-card holders speak up more confidently.

  ---

  ### 4. Participant Rules Sheet

  **PROJECT VENTURE: PARTICIPANT BRIEFING**

  **1. The Objective**
  You are an investor. Your goal is to maximize your chocolate stash by the end of the session. You start with **5 chocolates**.

  **2. The Project**
  In each round, a "Project" is available. It has a hidden **True Value**.
  *   **Type A:** The Project succeeds. All investors gain **+2 chocolates**.
  *   **Type B:** The Project fails. All investors lose **-10 chocolates**.
  *   **No Project:** If the Project is not launched, payoffs are **0**. Your stash remains unchanged.

  **3. Your Information**
  You will not know the True Value. You will receive one **Signal Card** (Red or Black).
  *   The relationship between Signals and True Value is fixed and fair.
  *   Red Cards generally indicate Type A.
  *   Black Cards generally indicate Type B.
  *   Signals are noisy. A Red Card does not guarantee Type A.

  **4. The Decision Rule**
  *   **Unilateral Action:** Any single participant may announce "LAUNCH" at any time during the decision window.
  *   **Binding:** If one person launches, the Project proceeds for **everyone**.
  *   **Refraining:** If no one launches, the Project is abandoned.

  **5. Conduct**
  *   Do not show your card to others unless instructed.
  *   You may not transfer chocolates during play.
  *   Act in your own self-interest.

  ---

  ### 5. Debrief Guide

  **Mapping Moments to Mechanism:**
  *   **The One-Sided Filter (Round 2):** Point to the whiteboard. "In Round 2, 15 of you held Black cards. You correctly assessed the risk. But the decision rule didn't ask for the *mean* judgment; it asked for the *maximum*. The 3 Red cards acted as a filter that let the outlier pass while blocking the consensus."
  *   **The Evidence Threshold:** "For an individual, a Red card made action rational (EV > 0). For the group, the *combination* of 1 Red and 17 Blacks made action irrational (EV < 0). The unilateral rule forces the group to act on the individual threshold, ignoring the aggregate evidence."
  *   **Not Groupthink:** "Groupthink implies social pressure to conform. Here, the 17 Black-card holders wanted to stop, but had no power. This is structural, not psychological."
  *   **Not Tragedy of the Commons:** "In a Commons, individuals deplete a resource for private gain. Here, individuals sought a *shared* gain but misjudged the risk due to information structure. The loss was shared, not privatized."
  *   **Not Optimism Bias:** "Participants weren't inherently optimistic. They were Bayesian. Given their private info, acting was the correct mathematical move. The error was in the *aggregation mechanism*."

  **Why Information Doesn't Fix It:**
  *   "More discussion (Round 5d) often worsens this. If three people say 'I have a Red card,' the group counts that as three independent signals. But if the True Value is Type B, those signals are *correlated errors*. They are the same mistake happening three times. Pooling them amplifies the error."

  **When the Phenomenon Absent:**
  *   "If the payoff for Type B was only -1, the individual and collective incentives would align. The curse requires an asymmetry where the cost of a false positive is vastly higher than the gain of a true positive."

  ---

  ### 6. Troubleshooting: An Honest List

  **1. The "No Crisis" Problem**
  *   **Risk:** With a 25% Type B rate, you might draw Type A three times in a row. The lesson fails because no one loses.
  *   **Fix:** In Round 2 (The Curse Demo), **rig the bag**. Ensure a Type B chip is drawn. It is a demonstration, not a raw experiment. Tell them afterward: "I ensured a risk scenario occurred so we could analyze it."
  *   **Limitation:** You cannot reproduce the *fear* of the unknown. Students know you control the bag.

  **2. Curiosity Triggering**
  *   **Risk:** A student with a Black card shouts "Launch" just to see what happens.
  *   **Fix:** Enforce the debt. If they ruin the group's stash, they owe chocolates from their personal supply (bring extras). Make the cost real.

  **3. Inference & Signaling**
  *   **Risk:** Students infer truth from your demeanor or hesitate too long, signaling they have Black cards.
  *   **Fix:** Wear a "poker face." Use a script for dealing cards. Enforce a strict 30-second decision window to prevent signaling through delay.

  **4. The Chocolate Distortion**
  *   **Risk:** Students care more about eating the chocolate than the points, or refuse to accept debt.
  *   **Fix:** Use paper points for the ledger. Distribute physical chocolates only at the very end based on final score. This abstracts the stake just enough to prevent tantrums but keeps the incentive.

  **5. Small Sample Luck**
  *   **Risk:** In the "Split Group" round, the smaller groups might get lucky and avoid the loss, making the lesson ambiguous.
  *   **Fix:** Run the split round twice. Average the results on the whiteboard.

  **6. What the Game Cannot Reproduce**
  *   **Irreversibility:** In the game, losses are points. In reality (e.g., releasing a pathogen), the loss is permanent. You must verbalize this: "Imagine the -10 chocolates was a permanent ecological collapse."
  *   **Unbounded Stakes:** The game caps loss at 10 chocolates. Real unilateral risks can be infinite.
  *   **Moral Responsibility:** In the game, acting is "rational." In reality, the unilateralist often bears a moral burden even if their *expected* utility was positive. You must add this in the debrief: "Rationality is not absolution."

  **7. Coordination Attempts**
  *   **Risk:** Students try to vote informally.
  *   **Fix:** Remind them: "The rule is Unilateral. Any attempt to vote is a violation of the round constraints." This friction is part of the lesson—why we need formal rules.
