answer: |-
  This is a sophisticated narrative problem. You are wrestling with the tension between **environmental determinism** (the idea that physical geography/climate dictates human history) and **human agency** (the idea that choices drive history).

  Given your setting, you are writing about the aftermath of the **1815 eruption of Mount Tambora**, which created the **"Year Without a Summer" (1816)**. This is arguably the perfect historical moment for this experiment. The people living through it *did* feel the world was haunted. They didn't know about stratospheric aerosols; they knew God was angry or Nature had turned.

  You can give the volcano causal weight without turning your humans into puppets by treating the volcano not as a **Director**, but as a **Dealer**. It deals the hand, but the characters still play the cards.

  Here is a framework for giving the volcano agency without stripping your humans of theirs.

  ### 1. The Volcano as a "Constraint Engine," Not a Commander
  Determinism suggests the volcano says, "You shall starve," and the people starve. Agency suggests the volcano says, "The growing season is now 40 days shorter," and the people must decide how to survive that.

  *   **How to write it:** Don't have the volcano dictate the outcome; have it dictate the *cost* of actions.
  *   **Example:** In a normal year, a farmer plants corn in May. In 1816, snow falls in June. The volcano didn't kill the farmer; the farmer's *decision* to stick to traditional planting schedules despite the signs did. Or, perhaps the farmer chose to sell his seed grain to pay a debt, leaving him vulnerable when the frost came.
  *   **The Shift:** The volcano creates a **pressure cooker**. It removes the margin for error. In good times, human stupidity can be forgiven. In 1816, human stupidity (or greed, or pride) becomes fatal. The volcano amplifies the consequences of human choice.

  ### 2. Mediated Agency (The Social Filter)
  A volcano erupts in Indonesia; a peasant starves in Vermont. The causal link between those two points is not just weather; it is **economics, politics, and infrastructure.**

  If the volcano is a character, it is a blunt, brute-force character. It shoves against society. How society breaks depends on its cracks.
  *   **Inequality as a Lens:** If the volcano is an "actor" with a grudge, why does it seem to hate the poor more than the rich? The rich can import grain; the poor cannot.
  *   **The Narrative Move:** Show the volcano hitting a wall. The "grudge" hits the aristocracy, and they build a thicker wall (hoarding, price-gouping, fleeing to the city). It hits the peasantry, and they break.
  *   **Why this works:** It acknowledges the volcano's power while highlighting that *human systems* determined who suffered. The volcano provided the energy; human structures directed the damage.

  ### 3. Leverage the "Romantic Sublime" (Period Accuracy)
  You are writing in 1816. This is the height of the Romantic era. People like Shelley, Byron, and Turner were obsessed with the **Sublime**—nature that is so vast and terrifying it transcends human understanding.

  *   **The Character's Truth:** Your protagonist feeling the volcano has a "grudge" is historically accurate psychology. They didn't have climatology; they had theology and superstition.
  *   **The Narrative Balance:** You can validate the character's *feeling* (the uncanny, the dread, the sense of malice) without validating it as *fact*.
  *   **Technique:** Use **Pathetic Fallacy** intentionally. When the protagonist is desperate, the snow feels cruel. When they find hope, the sun breaking through feels like mercy. Keep this anchored in the protagonist's subjective experience. The *narrator* can remain neutral, showing the cold as physics, while the *character* experiences the cold as judgment. This creates dramatic irony: we understand the science, but we feel their fear.

  ### 4. Hybrid Causality (Feedback Loops)
  The most compelling way to avoid determinism is to show humans making the volcano's impact *worse*. This creates a **hybrid agency**.

  *   **Deforestation:** Perhaps your characters cut down trees for fuel because it's cold, which changes the local microclimate or causes mudslides when the thaw comes.
  *   **War and Borders:** 1816 is post-Napoleonic Wars. If grain exists in the next valley but soldiers block the road, is the starvation caused by the volcano or the war? It's both.
  *   **Disease:** The Tambora eruption is linked to the spread of Cholera. Show how human movement (trade routes, refugee camps) acts as the vessel for the germ. The volcano created the conditions; humans drove the carriage.

  ### 5. Practical Narrative Tests
  To check if you've fallen into the determinist trap, ask these three questions of your scenes:

  1.  **Could a different choice have changed the outcome?**
      *   *Determinist:* The crops died, so they starved.
      *   *Agency:* The crops died. They could have eaten the seed corn, but they chose to save it for next year, so they starved. (Or vice versa).
  2.  **Does the volcano affect everyone equally?**
      *   If yes, it's a force of nature.
      *   If no (and the variance is based on wealth, preparation, or location), it's a historical actor interacting with society.
  3.  **Is the "grudge" metaphorical or literal?**
      *   Keep it metaphorical in the prose, literal in the character's mind. If you write "The volcano demanded a sacrifice," that's the character's fear. If you write "The ash cloud settled," that's the world.

  ### A Model for Inspiration: *Frankenstein*
  Mary Shelley wrote *Frankenstein* during that exact summer (the Villa Diodati, 1816). Notice how she handles the environment.
  *   The ice and storms in the novel are terrifying and active.
  *   However, the tragedy is not caused by the ice. It is caused by Victor's choices *within* the ice.
  *   The environment isolates them, amplifies their guilt, and mirrors their turmoil, but it does not pull the trigger.

  ### Summary
  You can treat the volcano as an agent if you define "agency" as **the power to disrupt systems.**

  Let the volcano break the world. But let your characters decide how to pick up the pieces. If they pick them up to build a shelter, they survive. If they pick them up to throw at their neighbors, they perish. The volcano broke the glass; the humans decided whether to cut themselves on it or melt it down.

  That is how you give climate causal weight without removing human responsibility. The volcano sets the stakes; the humans play the game.
