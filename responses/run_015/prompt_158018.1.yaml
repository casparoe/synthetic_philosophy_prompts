          *   Reply: It wasn't the end of people, but a shift to smaller, resilient units (Iron Age emergence).
          *   Weakness: Specialist knows the "Dark Age" was *dark* (loss of literacy). Hard to spin that as just "reconfiguration."
      *   *Objection 3 (Climate Parable):*
          *   Concede: Ecological stress was real.
          *   Reply: Rapa Nui people survived and adapted; the "suicide" narrative is colonial.
