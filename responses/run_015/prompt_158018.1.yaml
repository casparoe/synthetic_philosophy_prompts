prompt: |-
  Hi — I need prep for a talk I'm giving Tuesday at our local heritage centre. It's on whether societies actually 'collapse' or just change form, using the Bronze Age, the Maya and Easter Island. I got into this after inheriting my uncle's old archaeology books last month and now I'm definatly out of my depth, but I agreed to present.

  My argument is basically that 'collapse' is a story we tell after the fact. The Late Bronze Age wasn't a system failure but a reconfiguration of trade networks; the Classic Maya didn't vanish, they relocated and kept writing in different places; and Easter Island's moai halt wasn't ecological suicide but a shift in ritual priorities — societies don't fall over, they just reshape. I'm using this partly to push back against people who treat Easter Island as a climate-change parable.

  The audience is about fifteen people: mostly retired civil engineers and history teachers, plus one actual Bronze Age specialist who thinks I'm being naive about systems collapse, and a local councillor who's been using Easter Island in climate speeches. They care about evidence and clear causation, they don't like vague metaphors being taken away, and the specialist will want me to engage with actual archaeological data rather than hand-waving.

  Can you draft my Q&A prep sheet? I want the objections ordered roughly as they'll come, phrased the way that audience would put them — especially the specialist and the councillor — with a note on how damaging each one is. For each objection: what I should concede up front, a reply I can actually deliver in about two minutes, and the weakest point in that reply. Include the question I'm hoping nobody asks — probably whether refusing to call it 'collapse' ignores the human cost and suffering. Also flag where I'm on shaky ground, like Maya chronology or that panarchy idea I borrowed from ecology without being sure I've applied it right. Don't need citations, just practical prep — I'm writing this on my phone on the train and might have missed a typo.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Draft a Q&A prep sheet for a talk on societal "collapse" vs. "transformation."
      *   **Topic:** Late Bronze Age, Classic Maya, Easter Island (Rapa Nui).
      *   **Speaker's Argument:** "Collapse" is a narrative construct; societies reconfigure/reshape rather than vanish. Pushback against Easter Island as a climate parable.
      *   **Audience:** ~15 people. Retired civil engineers & history teachers (evidence/causation focused), one Bronze Age specialist (skeptic), one local councillor (uses Easter Island for climate messaging).
      *   **Format:** Objections ordered by likelihood/phrasing, damage assessment, concession, 2-minute reply, weakest point in reply.
      *   **Specific Inclusions:** The "human cost" question (hoped nobody asks), flagging shaky ground (Maya chronology, panarchy concept).
      *   **Tone:** Practical, honest, preparatory (written on a train/phone context acknowledged implicitly by being concise and usable).
      *   **Constraint:** No citations needed, just practical prep.

  2.  **Deconstruct the Audience & Arguments:**
      *   *Retired Engineers/Teachers:* Want clear cause-and-effect. "If the bridge falls, it collapsed." They will challenge the semantics vs. reality distinction.
      *   *Bronze Age Specialist:* Knows the data (palaces burned, literacy lost). Will call the speaker naive for ignoring the *scale* of disruption.
      *   *Local Councillor:* Uses Rapa Nui as a warning for climate change. Will argue that minimizing "collapse" undermines urgent climate action.
      *   *Speaker's Weaknesses:* Admittedly new to the field (uncle's books), shaky on Maya chronology, potentially misusing "panarchy" (resilience theory).

  3.  **Drafting the Objections (Ordering & Phrasing):**
      *   *First:* The Semantic/Engineering objection. "If the lights go out, it's a blackout." (Engineers/Teachers).
      *   *Second:* The Specialist objection. "You're ignoring the destruction layers." (Bronze Age Expert).
      *   *Third:* The Political/Climate objection. "Don't we need the warning?" (Councillor).
      *   *Fourth:* The Ethical/Human Cost objection. "What about the people who died?" (The hoped-for-nothing question).

  4.  **Developing the Responses (Concession, Reply, Weakness):**
      *   *Objection 1 (Semantics/Function):*
          *   Concede: Yes, complexity decreased.
          *   Reply: Focus on continuity of population and culture, just different structure.
