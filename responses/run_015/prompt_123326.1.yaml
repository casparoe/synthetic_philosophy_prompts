      *   **Address "Elective Affinity":** This isn't just correlation. In causal terms, it's *feedback loops* or *bidirectional causality* (reciprocal causation) that stabilises into a new equilibrium. It's a dynamic system, not a DAG (Directed Acyclic Graph).
      *   **Address the Reductionism Trap:** Values are *emergent properties* that exert downward causation. Just as software logic constrains hardware electricity, cultural norms constrain economic choices. It's not a category mistake; it's a higher-level abstraction that is causally potent.
