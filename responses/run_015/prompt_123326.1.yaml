      *   *Assumption 1:* Causes must be physical interventions on nodes.
      *   *Assumption 2:* "Culture" is not a physical entity, therefore it cannot be a node.
      *   *Assumption 3:* If it's not a node, it's either a metaphor or an epiphenomenon.
      *   *Assumption 4:* "Elective affinity" implies correlation, not causation.

  3.  **Identify the Conceptual Error (The "Repair"):**
      *   The error lies in the definition of a "node" and an "intervention" within a social system.
      *   In causal inference, a variable doesn't need to be *physical* (like mass or velocity); it needs to be *measurable* and *manipulable* (in principle).
      *   Culture is not a ghostly ether; it is instantiated in *behaviours*, *institutional rules*, and *information transmission*.
      *   Weber isn't arguing for "spooky action at a distance" by ideas. He is arguing for a specific *mechanism of constraint and motivation* that alters the payoff matrix for economic actors.
      *   The "average height" analogy is a confounding error (ecological fallacy), but culture is more like "software code" running on the "hardware" of human cognition and social institutions. Code isn't physical, but changing the code changes the output.

  4.  **Formulate the Argument (Step-by-Step):**

