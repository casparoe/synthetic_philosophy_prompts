          3.  Weber is incoherent/metaphorical.
      *   **Specific Confusion:** Can values do explanatory work without reductionism? Is attributing causality to culture a category mistake (like average height causing a bridge collapse)?
      *   **Constraint:** Answer in British English. No reading lists. Focus on conceptual repair.

  2.  **Deconstruct the User's Causal Model:**
