      *   *Premise 2:* User proposes "second-order sphexishness" (rigid meta-rules).
      *   *Observation:* Rigid meta-rules in complex environments produce high behavioral variability (to maintain the rule).
      *   *Inference:* High variability is often associated with agency/freedom.
      *   *Conclusion:* Therefore, rigidity might be the basis of freedom.
