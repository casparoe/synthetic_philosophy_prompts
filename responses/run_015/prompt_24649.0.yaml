answer: |-
  The move you have identified is the core engine of the **Argument from Divine Hiddenness**. However, your intuition is correct: there is a crucial distinction often blurred in casual discussion between the *demographic fact* of non-belief and the *epistemic structure* of the evidence itself.

  While the umbrella term is "Divine Hiddenness," the specific conceptual move you are describing—the claim that the ambiguity is universal, uniform, and structural rather than merely a matter of some people failing to believe—is best defined as the thesis of **Universal Epistemic Ambiguity**.

  In the professional literature, this is often treated as the substantive premise within the Argument from Divine Hiddenness, distinguishing it from a simple "Argument from Non-Belief." Here is the precise conceptual carving you are looking for, distinguishing this move from its neighbors and defining its edges.

  ### 1. The Name and the Core Concept
  The established name for the broader argument is the **Argument from Divine Hiddenness**. However, to capture the specific nuance you noticed—the *uniformity* of the lack of evidence—philosophers distinguish between two ways of framing the problem:

  *   **The Demographic Formulation (Argument from Non-Belief):** This focuses on the *distribution of belief*. It notes that there are people who do not believe. The counter-argument here is usually that these people are resisting God, or that God reveals Himself to some but not others.
  *   **The Epistemic Formulation (Argument from Hiddenness/Ambiguity):** This focuses on the *quality of the evidence available to the cognitive agent*. It claims that the epistemic environment itself is structurally opaque.

  Your description aligns with the **Epistemic Formulation**, specifically the claim of **Universal Epistemic Ambiguity**. This is the claim that the "hiddenness" is not a localized failure of human perception (some can't see), but a global feature of the evidence (there is nothing clear to see, for anyone).

  ### 2. How It Differs from Related Arguments

  You asked how this differs from three specific neighbors. Here is the conceptual boundary for each.

  **A. Versus the Argument from Non-Belief**
  *   **The Non-Belief Argument** says: "There exist people who do not believe in God. If God existed, they would."
      *   *Weakness:* A theist can reply, "God reveals Himself clearly to the devout, but the atheists are stubborn or spiritually blind." This allows for *selective clarity*.
  *   **Your Move (Universal Ambiguity)** says: "There exists *no person* who possesses decisive, unambiguous evidence. The devout and the atheist share the same epistemic fog."
      *   *Strength:* This blocks the "spiritual blindness" defense. If the mystics and prophets also only have "ambiguous hints" (which cannot be decisively verified by others or even fully secured against doubt for themselves), then the lack of belief is not a moral failure of the human, but a structural absence in the world. The load-bearing part is indeed the **uniformity**.

  **B. Versus the Problem of Evil**
  *   **The Problem of Evil** is **Axiological**. It argues that the *content* of the world (suffering, pain) is incompatible with a good God. It assumes we know God exists (or might exist) and argues His nature is contradicted by what He allows.
  *   **Your Move (Hiddenness)** is **Relational/Epistemic**. It argues that the *context* of the world (ambiguity) is incompatible with a God who desires relationship. It does not matter if the world is happy or painful; what matters is that the "channel of communication" is open or closed.
      *   *Distinction:* You could have a world with no suffering (no Problem of Evil) but total silence (Hiddenness). You could have a world with suffering but clear divine voice (no Hiddenness). They target different divine attributes: Goodness/Welfare vs. Love/Relationality.

  **C. Versus the Argument from Insufficient Evidence (Evidentialism)**
  *   **Plain Insufficient Evidence** says: "The evidence we have (design, miracles, texts) does not probabilistically support the hypothesis 'God exists'." This is a general claim about truth-tracking.
  *   **Your Move (Hiddenness)** says: "Given the *specific hypothesis* that God wants a personal relationship, the evidence *ought to be different than it is*."
      *   *Distinction:* Plain evidentialism asks, "Is the evidence strong enough?" Hiddenness asks, "Is the evidence the *kind* that a loving parent would provide?" The latter relies on a premise about God's motivations (relationship), not just a weighing of probabilities. It is a modal argument about what a loving God *would* do, contrasted with what we find.

  ### 3. Defining the Edges: What Counts and What Does Not

  To use this concept precisely, you need to know where its boundaries lie. Here is the test for whether a situation counts as an instance of this specific argumentative move.

  **What Counts (Inside the Concept):**
  1.  **Uniformity:** The ambiguity must apply across the board. If a theist claims, "I have a burning bush experience that is undeniable," the Hiddenness arguer must counter that this experience is still interpretable, psychological, or non-transferable, thus remaining part of the "uniform murkiness."
  2.  **Non-Coerciveness vs. Absence:** The argument is not that God forces belief (which would violate free will). It is that God makes Himself *available* without force. The claim is that current availability is zero, not just non-forceful.
  3.  **Relational Necessity:** The argument only works if one accepts the premise that "relationship requires identification." If a God existed who wanted slaves, not children, Hiddenness would not be a problem. The argument is bound to the concept of a *personal* God.

  **What Does Not Count (Outside the Concept):**
  1.  **Selective Revelation:** If the argument conceded that "Some people (e.g., Moses, Paul) had clear evidence, but others don't," it would collapse into the Argument from Non-Belief (or the Problem of Unequal Revelation). Your specific move requires the claim that *even the recipients of revelation* operate in ambiguity.
  2.  **Temporary Hiddenness:** If the argument allows that "God is hidden now but will be revealed at death," it weakens the move. The strongest form of this argument (which you described) claims the hiddenness is total *during the window where relationship is possible*.
  3.  **Culpable Ignorance:** If the lack of evidence is blamed on the human (sin, pride, lack of seeking), it is no longer the Argument from Hiddenness; it is a defense *against* it. The move you identified insists the murkiness is objective, not subjective.

  ### 4. Summary of the Conceptual Carving

  You have isolated the **Epistemic Formulation of the Argument from Divine Hiddenness**, grounded in the thesis of **Universal Epistemic Ambiguity**.

  The "load-bearing" part you sensed is the shift from **contingent non-belief** (some people happen not to believe) to **necessary ambiguity** (the world is structured such that no one *can* believe decisively).

  This distinction is vital because it changes the target of the argument.
  *   If it is just **Non-Belief**, the theist can fix the problem by evangelizing or praying for the blind.
  *   If it is **Universal Ambiguity**, the theist cannot fix the problem without changing the nature of the universe or the nature of God.

  So, when you encounter this move, you can accurately label it as the **Argument from Divine Hiddenness**, but you should specify that it relies on the **Universal Epistemic Ambiguity** premise. This signals that you understand it is not merely counting atheists, but analyzing the structural opacity of the evidence available to all agents. This is the precise philosophical niche you were looking for.
