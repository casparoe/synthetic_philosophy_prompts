      *   *Pinpoint the break:* It's actually **Step 2** and **Step 3** working together, but Step 3 is the mechanical failure.
      *   *The "Extra Move" Fallacy:* In Hex, an extra stone is strictly dominant (or neutral). In reality, an early move is often a *liability*. It reveals hand, burns capital, locks in strategy. This violates the "monotonicity" requirement of SSA.
      *   *The Zero-Sum Fallacy (Step 2):* SSA requires zero-sum. Most real competitions aren't. If I enter a market, I might expand the pie, not just steal it.
      *   *The Information Problem (Step 3):* User is right here. In SSA, the "dummy move" is a thought experiment. In reality, you actually move. The opponent sees it.
      *   *The "Price":* You have to swap "Combinatorial Game Theory" for "Signaling Games" / "Bayesian Games." You lose the guarantee of a win, but you gain the ability to model *why* waiting is valuable (the value of information).

  7.  **Refining the Argument for a Column:**
