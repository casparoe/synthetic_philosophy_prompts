answer: |-
  Good morning, and welcome to "Weighing the Unweighable."

  I know the title of this workshop stops people in the hallway. It sounds like a paradox, maybe even a provocation. To some of you, the idea of comparing historical atrocities feels like a necessary tool for justice; to others, it feels like a moral violation. If you are a family member here, you might be asking: "Why are you putting my grandmother's survival in the same frame as someone else's genocide? What gives you the right?" If you are a student of philosophy, you might be asking: "Are we committing a category error? Can these events even be spoken in the same language without losing their meaning?"

  Both questions are right. And if we don't hold both of them in our heads at once, we shouldn't be in this room.

  We are here to unveil a new archive. It scores state violence across three specific axes: direct deaths, destroyed cultural sites, and long-term displacement. I want to be very clear about what this archive is, and just as importantly, what it is not. It is not a scoreboard. It is not designed to tell us who suffered more, or whose pain is "worse." That kind of ranking implies a single scale of human misery, and I don't believe that scale exists. You cannot reduce the burning of a library to the same unit of measurement as the loss of a life, and then add them up to find a total score of tragedy. That is the moral obscenity we need to avoid.

  However, saying that every tragedy is totally unique—that each event is so singular it cannot be compared to any other—leads us to a different dead end. If every act of violence is incomparable, then we cannot learn from history. We cannot spot patterns. We cannot say that one policy leads to displacement more often than another, or that the destruction of cultural sites often precedes physical violence. If we can't compare, we can't prevent.

  So, how do we walk this line? I think the key is to distinguish between *ordering* events and *measuring* them on one shared scale.

  Think of it like this: Measuring on a shared scale is like trying to find the "winner" of a competition. It asks for a single number that defines the whole event. That is what we are not doing. We are not trying to say Event A is a "ten" and Event B is a "five."

  Ordering events, or mapping them, is different. It's like a doctor looking at a chart. A doctor doesn't say your fever is "worse" than someone else's broken leg in a general sense. But the doctor does measure temperature and does X-rays to understand the specific nature of the harm. They compare specific vitals to diagnose the problem. That is what this archive does. It doesn't measure "total suffering." It measures specific types of harm so we can see relationships. It allows us to say, "In this case, displacement happened before the violence," or "In that case, cultural destruction was the primary goal."

  For the philosophers in the room, we are acknowledging incommensurability while still seeking structural comparison. For the archivists and family members, we are acknowledging that data is cold, but it can be used to keep memories warm. The numbers here are not substitutes for names. They are not replacements for stories. They are guardrails. They are there to ensure that when we speak about these events, we are speaking about the same realities, so that denial becomes harder.

  We need this workshop because the tension between these views is where the truth lives. If we ignore the uniqueness of the pain, we insult the victims. If we ignore the patterns of the violence, we fail the survivors. This archive is not here to settle the score of history. It is here to make sure the scale doesn't tip again.

  We are not here to rank the weight of suffering, but to ensure that every ounce of it is finally acknowledged.
