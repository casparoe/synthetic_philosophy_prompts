prompt: |-
  I'm a science journalist who sits on the scientific advisory committee of a natural history museum, and we are reviewing the draft text for a new exhibit on the human body. One panel asserts that the shape of the human nose — narrower in cold, dry climates, broader in warm, humid ones — is a direct product of natural selection, evolved to condition the air we breathe, and that this is why nose shape tracks climate across populations. Half the committee is comfortable with the wording; the other half thinks it is precisely the kind of unfalsifiable, pan-adaptationist claim that Gould and Lewontin's spandrels critique targets, since the same nose shape could just as well be a byproduct of other changes in the face or a target of sexual selection rather than of selection for air-conditioning. Please draft the short written opinion I will circulate before Thursday's meeting: it should recommend a concrete course of action (publish the panel as written, publish it with a stated caveat, or strike it), and it should give the committee a standard for when an adaptationist claim of this sort is strong enough to put in front of the public, while fairly engaging the strongest reason to simply publish the adaptation story as it stands.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist & Member of Scientific Advisory Committee at a Natural History Museum.
      *   **Task:** Draft a short written opinion (memo) to circulate before Thursday's meeting.
      *   **Topic:** A draft exhibit panel claiming human nose shape variation is a direct product of natural selection for air conditioning (climate adaptation).
      *   **Conflict:** Half the committee accepts the adaptationist claim; the other half sees it as a "pan-adaptationist" spandrel (Gould & Lewontin critique), suggesting alternative explanations (byproduct, sexual selection).
      *   **Requirements:**
          1.  Recommend a concrete course of action (Publish as is, Publish with caveat, Strike).
          2.  Provide a standard for when adaptationist claims are strong enough for the public.
          3.  Fairly engage the strongest reason to publish the adaptation story as it stands.
          4.  Tone: Professional, balanced, scientifically rigorous, suitable for a committee context.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Publish as is):* Risks oversimplification and ignores legitimate scientific debate. Violates the "standard" I need to propose.
      *   *Option B (Strike):* Too censorious. The climate hypothesis *is* a leading hypothesis, just not settled fact. Removing it entirely erases interesting science.
      *   *Option C (Publish with caveat/nuance):* Best middle ground. Acknowledges the evidence while highlighting the ongoing debate. This aligns with best practices in science communication (showing science as a process).
      *   *Decision:* Recommend publishing with a stated caveat/nuance.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the specific issue (the nose shape panel).
      *   **Engaging the Pro-Adaptation Argument (Requirement 3):** Acknowledge *why* half the committee supports the text. There *is* correlational data (Thomson's rule, recent genomic studies). It's a plausible, intuitive functional explanation. It makes for a good story.
      *   **Addressing the Critique (Gould & Lewontin):** Acknowledge the validity of the "spandrel" critique. Correlation $\neq$ Causation. Genetic drift, sexual selection, and developmental constraints are viable alternatives. Presenting it as settled fact is "just-so storytelling."
      *   **Proposed Standard (Requirement 2):** What makes an adaptationist claim "exhibit-ready"?
          *   Not just correlation.
          *   Evidence of mechanism (physiology).
          *   Acknowledgment of alternative hypotheses.
          *   Consensus level (is it settled or debated?).
      *   **Recommendation (Requirement 1):** Publish with a caveat. Rewrite to reflect probability, not certainty. Use language like "leading hypothesis" or "evidence suggests" rather than "evolved to."
      *   **Closing:** Offer to help draft the revision.

  4.  **Refining the Tone:**
      *   Needs to be respectful of colleagues (both sides).
      *   Needs to sound like a science journalist (clear, precise, aware of public perception).
      *   Needs to be authoritative but collaborative.
      *   *Self-Correction on Tone:* Avoid sounding like I'm lecturing the biologists on the committee. Frame it as "public communication strategy" informed by scientific rigor.

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Recommendation regarding Human Body Exhibit Panel 4."
      *   *The "Strongest Reason" to Publish:* The physiological link is strong. Narrower noses *do* warm air better. The geographic correlation is robust. It's the best *functional* explanation we have.
      *   *The "Spandrel" Counter:* But did selection act on the nose *for* this, or did the nose change as the face flattened/expanded? We don't have a time machine.
      *   *The Standard:* I need to articulate a threshold. Let's call it the "Plausibility vs. Certainty" standard. Or "Consensus and Nuance." Let's go with "Evidence Thresholds for Public Communication."
      *   *The Recommendation:* "Publish with Nuance."

  6.  **Final Polish (Reviewing against constraints):**
      *   *Concrete course of action?* Yes (Revise with caveat).
      *   *Standard provided?* Yes (Three criteria).
      *   *Fair engagement?* Yes (Acknowledges the physiological data).
      *   *Length?* Keep it short (1-2 pages max equivalent).

  7.  **Final Review of the Output:** (Mental check of the drafted text)
      *   Does it mention Gould and Lewontin? Yes, essential context.
      *   Does it mention sexual selection/drift? Yes.
      *   Is the recommendation clear? Yes.
      *   Is the tone appropriate? Yes, collegial but firm on accuracy.

  8.  *(Self-Correction during drafting)*: Make sure I don't dismiss the adaptationist view entirely. Recent studies (e.g., Zaidi et al., 2017) actually provide some genetic evidence linking nose shape to climate. I should mention that to show I've done my homework, but maintain that it's not *definitive* proof of exclusive selection.

  9.  **Finalizing the Text.** (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Scientific Advisory Committee, Natural History Museum
  **FROM:** [Your Name], Scientific Advisory Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Human Body Exhibit Panel (Nose Shape/Climate)

  Colleagues,

  In preparation for Thursday's meeting, I am writing to offer a recommendation regarding the draft text for the human nose panel. As currently written, the panel asserts that nose shape variation is a direct product of natural selection for air conditioning, presenting this as a settled evolutionary fact.

  While I understand the appeal of this narrative, I recommend we **publish the panel with a stated caveat** rather than as a definitive assertion. Specifically, the text should be revised to frame the climate adaptation hypothesis as the *leading functional explanation* supported by correlational and physiological data, while acknowledging that developmental constraints, genetic drift, and sexual selection remain viable contributing factors.

  **The Case for the Adaptationist Narrative**
  Those favoring the current text are correct on two important fronts. First, the physiological mechanism is sound: narrower nasal passages do increase turbulence and surface contact, warming and humidifying air more effectively than broader passages. Second, the geographic correlation is robust; the cline of nose breadth relative to absolute humidity is one of the classic examples in anthropometric data. To remove this story entirely would be to discard a compelling example of how environment interacts with anatomy. It is a plausible, scientifically grounded narrative that resonates with visitors.

  **The Risk of "Just-So" Stories**
  However, the committee's concern regarding Gould and Lewontin's critique of pan-adaptationism is well-founded. Correlation does not confirm causation. A trait can be correlated with an environment without being selected *for* that environment. Nose shape is inextricably linked to overall facial morphology, which may shift due to dietary changes (developmental constraints) or drift. Furthermore, sexual selection is a potent driver of facial variation that the current text ignores. By presenting the climate hypothesis as the sole explanation, we risk teaching the public that evolutionary biology is a discipline of certainty rather than one of competing hypotheses and probabilistic inference.

  **A Standard for Adaptationist Claims**
  To guide future exhibit development, I propose we adopt the following standard for presenting adaptationist claims to the public:

  1.  **Mechanism + Genetics:** Has the claim moved beyond phenotypic correlation to include evidence of genetic selection (e.g., genomic scans for selection signals)?
  2.  **Exclusion of Alternatives:** Does the text acknowledge whether other evolutionary forces (drift, pleiotropy) have been ruled out or are simply considered less likely?
  3.  **Consensus Level:** Is this a settled consensus (e.g., sickle cell and malaria) or an active debate (e.g., nose shape and climate)? The language must match the certainty level.

  **Recommendation**
  The nose shape panel currently fails the third criterion. I propose we revise the text to use qualifying language (e.g., "Scientists believe," "Evidence suggests," "One leading hypothesis") and include a brief sentence noting that other factors likely contribute to facial diversity.

  This approach preserves the educational value of the climate hypothesis while modeling scientific integrity. It shows our visitors that science is not just a collection of facts, but a rigorous process of weighing evidence.

  I am happy to work with the exhibit team to draft specific language that balances these considerations.

  Best regards,

  [Your Name]
  Science Journalist & Committee Member
