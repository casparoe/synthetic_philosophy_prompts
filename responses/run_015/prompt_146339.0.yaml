answer: |-
  # Activity Design: The Sealed Sequence

  ## 1. Materials and Setup

  **Room:** A standard seminar room. Whiteboard available but unused until debrief.
  **Participants:** 16 undergraduates.
  **Time:** 90 minutes.

  **Physical Materials:**
  1.  **The World Envelope:** A large manila envelope, sealed and signed across the flap by two volunteer participants *before* the session begins (during the 5-minute pre-settle). Inside is a card stating either **WORLD S** (Total Population 200) or **WORLD L** (Total Population 200,000).
  2.  **ID Envelopes:** 16 smaller opaque envelopes, each containing a single **Identity Card**.
      *   *Preparation:* Based on the content of the World Envelope (known only to the facilitator), 16 numbers are generated using a pre-committed random seed (written on the outside of the World Envelope).
      *   *If World S:* 16 unique integers drawn uniformly from $\{1, \dots, 200\}$.
      *   *If World L:* 16 unique integers drawn uniformly from $\{1, \dots, 200,000\}$.
      *   *Constraint:* To ensure the pedagogical effect, the facilitator ensures all drawn numbers are $\le 100$. (This is a controlled variance to guarantee the "low number" effect within the time limit; this limitation is addressed in the debrief).
  3.  **Dossiers:** 16 packets containing:
      *   **The Rules:** Explanation of the scoring rule and commitment requirement.
      *   **The Class Menu:** Two candidate reference classes describing the participant, with population totals for each World.
      *   **Commitment Slip:** A form to record Class Choice and Credence.
  4.  **Calculators:** Allowed.

  **The Class Menu (Inside Dossier):**
  Participants are told: *"You possess the serial number on your ID. You must decide which population you were sampled from to interpret this number. Both descriptions apply to you physically, but they imply different total population sizes."*

  *   **Class $\alpha$ (Broad):** "A conscious observer capable of decision theory."
      *   If World S: Total $N_\alpha = 200$.
      *   If World L: Total $N_\alpha = 200,000$.
  *   **Class $\beta$ (Narrow):** "A conscious observer currently seated in a university seminar."
      *   If World S: Total $N_\beta = 200$.
      *   If World L: Total $N_\beta = 600$.
      *(Note: The ratio of totals differs. $\alpha$ scales by 1000x; $\beta$ scales by 3x.)*

  ## 2. Auditable Draw and Sealed Choice

  **Auditability Protocol:**
  1.  **Pre-Session:** Two student volunteers arrive 5 minutes early. They witness the facilitator place the **World Card** (S or L) into the **World Envelope**.
  2.  **Commitment:** The facilitator writes the Random Seed (e.g., a 6-digit code) on the outside of the envelope. The volunteers sign across the seal.
  3.  **Generation:** The facilitator generates the 16 IDs using the Seed and the World Card logic *before* participants enter. The IDs are placed in the 16 ID Envelopes.
  4.  **Verification:** At the end of the session, the World Envelope is opened. Participants can verify that the IDs they hold are mathematically consistent with the revealed World and the Seed (using a provided lookup table or simple script on a projector). This confirms the IDs were not swapped mid-session to match the guesses.

  ## 3. Scoring Rule

  Participants are scored using a **Logarithmic Scoring Rule**, scaled for trivial stakes (e.g., coffee vouchers or course points). This rule is *strictly proper*, meaning participants maximize expected score only by reporting their true credence.

  **The Rule:**
  Let $p$ be the reported credence that the World is **Short** ($0 < p < 1$).
  *   If **World S** is True: Score $= 100 \times \ln(p)$.
  *   If **World L** is True: Score $= 100 \times \ln(1 - p)$.

  *(Note: Scores are negative. Less negative is better. A credence of 0.5 yields approx -69 points. A credence of 0.99 yields approx -1 point if correct, but -460 points if wrong.)*

  **Representative Scoring Table:**
  *Assume a participant holds ID #50.*

  | Chosen Class | Implied Likelihood Ratio ($L_S : L_L$) | Rational Credence* (Prior=0.5) | Score if World S (True) | Score if World L (True) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Class $\alpha$** | $1/200 : 1/200,000$ (**1000 : 1**) | $p \approx 0.999$ | **-0.1** (Excellent) | **-690** (Catastrophic) |
  | **Class $\beta$** | $1/200 : 1/600$ (**3 : 1**) | $p \approx 0.75$ | **-28.7** (Moderate) | **-138** (Bad) |
  | **No Update** | Ignoring ID | $p = 0.50$ | **-69.3** (Baseline) | **-69.3** (Baseline) |

  *\*Rational Credence calculated via Bayes' Theorem with a flat prior ($P(S)=0.5$).*

  **Activity Flow:**
  1.  **Distribution (15 min):** Hand out ID Envelopes and Dossiers. Participants open IDs.
  2.  **Commitment (30 min):** Participants calculate their credence based on their ID and chosen Class. They submit the Commitment Slip. **Facilitator speaks only to confirm receipt.**
  3.  **Reveal (15 min):** Open World Envelope. Verify IDs. Calculate Scores.
  4.  **Debrief (30 min):** Facilitator breaks silence.

  ## 4. Debrief: Mapping the Discovery

  **Phase 1: The Arithmetic (10 min)**
  Ask participants to compare scores.
  *   *Observation:* Those who chose Class $\alpha$ and reported high confidence in Short won big (if S) or lost big (if L). Those who chose Class $\beta$ had muted outcomes.
  *   *Question:* "Did the ID number change?" (No). "Did the World change?" (No). "What changed?" (The Class).
  *   *Concept:* Introduce the term **Reference Class**. Show that the posterior probability $P(S|ID)$ is not a function of the ID alone, but $P(ID|S, \text{Class})$.

  **Phase 2: The Assumptions (10 min)**
  *   **Self-Sampling Assumption (SSA):** Explain that by treating their ID as a "random sample" from the Class Total, they invoked SSA. "I am a random observer from the set of all observers."
  *   **Self-Indication Assumption (SIA):** Ask: "Did anyone adjust their *Prior* because the Long World has more observers?" (Likely no). Explain that SIA would counteract the Doomsday shift by weighting the Long World higher *before* seeing the ID, because you are more likely to exist in a world with more observers.
  *   **The Unasked Choice:** Highlight that the facilitator never told them which Class was the "correct" one for sampling. They had to choose. That choice determined the "strength" of the evidence.

  **Phase 3: Predictable Failures & Handling**

  1.  **The "Fair Coin" Hardliner:**
      *   *Claim:* "The prior was 50/50. One number doesn't change that."
      *   *Response:* Walk through the Bayes calculation on the board. Show that $P(ID=50|S) \gg P(ID=50|L)$. The math forces the update *if* you accept the sampling assumption. The disagreement is not about Bayes' rule, but about whether the sampling assumption applies.
  2.  **The "Gamer":**
      *   *Claim:* "I picked Class $\alpha$ because I wanted to win more points."
      *   *Response:* This proves the point. If the Class is a strategic choice rather than a factual description of sampling, the "credence" is not a belief about the world, but a bet on the scoring rule. This demonstrates that without an objective way to select the Reference Class, the inference is unstable.
  3.  **The "Unlucky" High Draw:**
      *   *Scenario:* If World S was selected, and a participant drew ID #195.
      *   *Reaction:* "This proves World L! (Since 195 is unlikely in 200, but possible in 200,000)."
      *   *Handling:* Acknowledge this is the **Reverse Doomsday** effect. It shows the mechanism works both ways. However, remind them the IDs were capped at 100 for this session to ensure the standard effect appeared. In a real unbounded draw, high numbers *would* update toward Long. This highlights the sensitivity to the specific datum.

  ## 5. Limitations: What This Activity Cannot Reproduce

  Be honest about where the analogy breaks down compared to real existential risk reasoning.

  1.  **The Prior is Not a Coin Flip:** In the activity, we stipulated $P(S) = P(L) = 0.5$. In reality, we have no external frequency data to set the prior probability of human extinction vs. long-term survival. The Doomsday Argument often hides a contentious prior behind the "indifference" principle.
  2.  **Discrete vs. Continuous:** We used two worlds (200 vs. 200,000). Reality is a continuous distribution of possible futures. The "update" becomes a shift in a probability density function, which is mathematically messier and less intuitive than the binary switch used here.
  3.  **Simulated vs. Anthropics:** Participants know they are students in a room, randomly handed IDs by a facilitator. Real humans do not know they are "randomly sampled" from the set of all humans. We might be early, late, or atypical. The activity forces the sampling assumption; reality leaves it disputed.

  ## 6. The Takeaway

  That the live disagreement is not about the arithmetic but about which sampling assumption governs, and that no datum of the kind they were given settles it.
