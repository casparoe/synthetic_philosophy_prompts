prompt: |-
  I chair the weekly signal-triage meeting at a regional public health agency. Every Monday me and five others (two epidemiologists, a lab lead, a comms person, and a rotating field officer) spend 45 minutes deciding whether each flagged signal — a cluster of lab results, a spike in school absenteeism, a handful of GP calls — gets sent to field investigation or gets closed. We get eight or so a week and investigations are expensive, so most get closed. I sign off on the closes myself; anything above a certain cost goes to the director. About six months later we usually find out whether we were right, so I can score last year's calls.

  I can tell we herd. I speak first because I'm the chair and I'v read the briefing, and by the third or fourth signal everyone is just saying "agree". What I want is a procedure I can actually run in the room: questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the decision to a person because it's a values question (what a false alarm costs us vs what a missed outbreak costs) rather than a facts question, and when a case should go up to the director undecided instead of being settled in the room. It has to work at about two minutes a signal, so tell me which step is the cheap screen that clears most of them, and which step only runs on the one or two near the threshold.

  Three things about the room that I think break the textbook story, and I want the procedure to deal with them rather than assume them away: we already do an anonymous written poll before the meeting that I read out at the start, and I genuinely don't know whether that helps or just starts the cascade earlier; we have a standing devil's advocate whose job is to argue against whatever I say, so her dissent carries no information any more; and two of my members look at the same dashboard I do, so when they "agree" with me it's often not an independent check at all, while the field officer usually has something nobody else has. Tell me roughly how much to discount an agreement from someone whose information overlaps mine — I don't need a formula, but "count it as nothing" and "count it as half" are very different instructions.

  Please also keep seperate three things I keep conflating: a real cascade, honest convergence because everyone saw the same genuinely strong evidence, and a value disagreement pretending to be a factual one. Say what I should do differently in each.

  Then run it on three cases. (1) The pre-meeting poll split 4–2 to investigate, I opened by saying I thought it was noise, everyone then said close, and the field officer said nothing but mentioned afterwards that she'd heard from a local pharmacist about a second school. (2) The same confirmed strain in three patients with no link between them — I want the procedure to tell me not to bother with whatever anti-cascade ritual you invent, because I can't waste the meeting on unanimous cases; show me the 30-second screen that clears it. (3) The one I'll hate: I'm personally about 90% sure a signal is a real outbreak, I've seen the pattern before, and the room is lukewarm. Show the procedure telling me that my gut isn't independent evidence and that I either shut up or lose the vote — and then tell me honestly whether that's right or whether the procedure is just bullying me.

  Finally, flag which steps are judgment calls dressed up as procedure, and say plainly what a procedure like this cannot do for me. Don't point me at papers or reading lists — I want something I can run on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a weekly signal-triage meeting at a regional public health agency.
      *   **Team:** Chair (User), 2 Epi, 1 Lab Lead, 1 Comms, 1 Rotating Field Officer (6 people total).
      *   **Task:** Decide on ~8 signals/week (Investigate vs. Close) in 45 mins (~5 mins/signal, but user wants ~2 mins/screening + deep dive for borderline).
      *   **Constraints:** Investigations are expensive. Most get closed. User signs off on closes; Director approves high-cost investigations. Feedback loop exists (6 months later).
      *   **Problem:** Herding/Cascade effect. User speaks first, others agree.
      *   **Specific Complications:**
          *   Anonymous pre-meeting poll exists (User reads results).
          *   Standing "Devil's Advocate" (DA) whose dissent is noise.
          *   Information overlap (2 members see same dashboard as Chair).
          *   Field Officer has unique intel.
      *   **Requirements:**
          *   A concrete procedure (questions in order, stop rules, handoff rules).
          *   Identify the "cheap screen" vs. "deep dive."
          *   Address the three specific room dynamics (poll, DA, overlap).
          *   Distinguish: Real Cascade vs. Honest Convergence vs. Value Disagreement.
          *   Run the procedure on 3 specific cases.
          *   Flag judgment calls vs. procedure limits.
          *   No academic references; actionable for Monday.

  2.  **Deconstruct the Dynamics:**

      *   *The Poll:* Reading the result *before* discussion anchors the room. If the Chair says "Poll was 4-2 Investigate, but I think Noise," the room follows the Chair, ignoring the poll. *Fix:* Don't read the result until *after* initial independent assessment, or use it only as a tie-breaker trigger. Actually, better: Use the poll to identify *uncertainty*, not consensus.
      *   *The Devil's Advocate:* If they always argue against the Chair, their position is predictable. *Fix:* Rotate the role or restrict the DA to specific criteria (e.g., "Only speak if you have new data"). Better: Acknowledge the DA's point is procedural, not evidentiary. Discount their agreement/disagreement to zero weight on *facts*, but keep them for *process*.
      *   *Information Overlap:* 2 Epi + Chair see same dashboard. Their agreement is not $3 \times$ evidence, it's $1 \times$. *Fix:* Treat them as one "node" for evidentiary weight.
      *   *Field Officer:* Unique intel. *Fix:* They must speak *first* on field context, or their silence is treated as "no new intel."

  3.  **Develop the Procedure (The "Triage Protocol"):**

      *   *Goal:* 2 minutes per signal average.
      *   *Structure:*
          1.  **Blind Data Check (30 secs):** Does it meet the "Hard Trigger"? (Strain match, threshold breach). If yes -> Auto-Investigate (mostly). If no -> Proceed.
          2.  **Unique Intel Round (30 secs):** Field Officer speaks *first*. Others silent.
          3.  **The "Why Not" Round (60 secs):** Instead of "Investigate?", ask "Why Close?" (Reverses the burden).
          4.  **The Vote:** Secret ballot (or fingers down) to avoid cascading.
      *   *Discounting:*
          *   Dashboard viewers (Chair + 2 Epi): Count as 1 vote block on *data interpretation*.
          *   DA: Count as 0 on *facts*, 1 on *risk tolerance*.
          *   Field Officer: High weight on *context*.
      *   *Stop Rules:*
          *   Hard Trigger Met -> Investigate (Skip meeting debate).
          *   Hard Trigger Missed + No Unique Intel -> Close (Skip meeting debate).
          *   Borderline -> Full discussion + Director referral if cost high/uncertainty high.

  4.  **Address the Three Conflations:**

      *   *Real Cascade:* People changing minds because others spoke. *Fix:* Secret vote before discussion.
      *   *Honest Convergence:* Evidence is overwhelming. *Fix:* The "Hard Trigger" screen.
      *   *Value Disagreement:* Risk tolerance (Cost of False Alarm vs. Missed Outbreak). *Fix:* Explicitly label the decision as "Risk Acceptance" and escalate to Director if Chair's risk tolerance differs from team.

  5.  **Drafting the Cases:**

      *   *Case 1 (Poll Split, Field Officer Intel):* Procedure needs to catch the Field Officer's silence. The "Unique Intel Round" forces them to speak. If they stay silent, they close. If they speak *after*, it's a process failure.
      *   *Case 2 (Confirmed Strain, No Link):* This is a "Hard Trigger." The procedure should bypass discussion. 30-second screen.
      *   *Case 3 (Chair Gut vs. Room):* This is the hardest. The procedure must constrain the Chair. If the "Dashboard Block" is the only support, and Field says no, the procedure says "Close." Is this right? It prevents authoritarianism but risks missing intuition. Need to balance: Chair can escalate to Director as a "Risk Disagreement," not a "Fact."

  6.  **Refining the "Discounting" Instruction:**

      *   Dashboard Overlap: Count as **one** vote on *evidence*, but individual votes on *risk*.
      *   DA: Count as **zero** on evidence (it's a role), but listen for *new* arguments.
      *   Field Officer: Count as **double** on context, zero on lab data.

  7.  **Review against Constraints:**

      *   2 minutes/signal? Yes, if the "Hard Screen" works.
      *   Actionable Monday? Yes, needs a script.
      *   No reading lists? Check.
      *   Flag judgment calls? Need a section for this.

  8.  **Self-Correction/Critique during drafting:**

      *   *Critique:* The user reads the poll at the start. I need to tell them to stop doing that or change *how* they do it.
      *   *Correction:* Advise them to reveal the poll *only* if the vote is tied or if it triggers a specific rule. Actually, better: The poll is the *first* vote. Don't read it out. Just collect it. Wait, user says "I read out at the start." I need to change this habit. *Instruction:* Stop reading the poll result. Use it as a baseline secret vote.
      *   *Critique:* The DA is entrenched.
      *   *Correction:* Don't try to fix the person, fix the weight. Explicitly state "DA opinion is procedural."
      *   *Critique:* Case 3 (Chair Gut). If the procedure forces the Chair to lose, is it bullying?
      *   *Correction:* It's protection against bias. But the Chair has a "Nuclear Option" (Director Escalation) based on *liability/risk*, not facts. I need to make that distinction clear.

  9.  **Final Polish:**

      *   Tone: Direct, operational, respectful of the high-stakes environment.
      *   Formatting: Clear headers, bullet points for the script.
      *   Ensure the "Three Conflations" section is distinct.
      *   Ensure the "Limitations" section is honest.

  **(Self-Correction on Case 1):** The prompt says Field Officer said nothing *in the meeting* but mentioned afterwards. The procedure must prevent this. The "Unique Intel Round" must be mandatory for the Field Officer. If they have nothing, they say "No new intel." If they stay silent, it's a failure. I will mandate they speak first.

  **(Self-Correction on Case 2):** Needs to be very fast. "Hard Criteria" checklist. If met, no discussion.

  **(Self-Correction on Case 3):** This challenges the Chair's authority. I need to validate that the procedure *should* constrain the Chair, but offer the "Risk Escalation" path.

  10. **Final Structure:**
      *   The Protocol (The Script).
      *   Weighting Rules (Who counts for what).
      *   Distinguishing the Three Conflations.
      *   Running the Three Cases.
      *   Limitations & Judgment Calls.

  Let's write it.cw
answer: |-
  Here is a procedure designed for your specific constraints, team dynamics, and time limits. It is operational, not theoretical.

  ### Part 1: The "Triage Protocol" (Monday Script)

  **Time Budget:** 45 minutes total.
  **Allocation:** 30 seconds per "Clear" signal, 5 minutes per "Borderline" signal.
  **Goal:** 6 signals cleared in 3 mins, 2 signals debated in 42 mins.

  **Step 0: The Hard Screen (Before the meeting)**
  *Do not bring signals to the meeting that meet the "Automatic Investigate" criteria.*
  *   **Criteria:** Confirmed rare pathogen + 2 cases; OR Death cluster; OR Exceeds 5-year baseline by >3 SD.
  *   **Action:** If met, you email the team: "Automatic Investigate per Protocol." No meeting time spent.
  *   **Why:** This solves Case 2 immediately.

  **Step 1: The Silent Baseline (2 minutes total for all signals)**
  *   **Action:** Do **not** read the pre-meeting poll results aloud. That anchors the room to your interpretation of the numbers.
  *   **New Rule:** The pre-meeting poll *is* the first vote. It stays anonymous. You only look at the split.
  *   **Trigger:** If the poll is 6–0 or 5–1 (Consensus), move to Step 2. If the poll is 3–3 or 4–2 (Split), mark for "Deep Dive" later in the agenda.

  **Step 2: The "Unique Intel" Round (30 seconds per signal)**
  *   **Order:** **Field Officer speaks FIRST.** Everyone else is silent.
  *   **Question:** "Field, do you have context not on the dashboard?"
  *   **Allowed Answers:** "Yes, [detail]" OR "No new intel."
  *   **Why:** This prevents the Field Officer from being cascaded by the Epi/Chair dashboard view. If they have intel (Case 1), it enters the record before you speak.

  **Step 3: The "Why Close" Challenge (60 seconds per signal)**
  *   **Rule:** You (Chair) do **not** give your opinion first.
  *   **Question:** "For the signals not Auto-Investigated: Who sees a reason to **Close** this?"
  *   **Logic:** Investigating is the default risk-averse stance. Closing requires justification. This forces the "herd" to argue for safety rather than arguing for cost-saving.
  *   **Constraint:** Dashboard viewers (You + 2 Epi) count as **one voice** on data interpretation. If you all agree it's noise, that is one data point, not three.

  **Step 4: The Decision & Escalation**
  *   **Consensus to Close:** You sign off.
  *   **Consensus to Investigate:** You sign off (if under cost threshold).
  *   **Split Vote / High Cost:** Escalate to Director.
  *   **Chair Dissent:** If you are overruled on a "Close" decision (you want to investigate, team says no), you do not veto. You mark it "Risk Escalation" and send to Director.

  ---

  ### Part 2: Weighting & Discounting Rules

  You asked how to discount agreement. Do not do math in the room. Use these **Voting Weights**:

  1.  **The Dashboard Block (You + 2 Epi):**
      *   **Weight:** Count as **1 Vote** on *factual* interpretation (e.g., "Is this spike real?"). You see the same data; you are not independent.
      *   **Exception:** You count as **3 Votes** on *risk tolerance* (e.g., "Are we willing to miss this?"). This is a values question, not a data question.
  2.  **The Devil's Advocate (DA):**
      *   **Weight:** **Zero** on facts. Their job is procedural friction.
      *   **Instruction:** When they speak, ask: "Is that new data, or just playing the role?" If it's the role, acknowledge and move on. Do not let their dissent validate a "deep dive."
  3.  **The Field Officer:**
      *   **Weight:** **Veto Power** on "No New Intel." If they say "I hear rumors of X," the signal cannot be closed without checking X. They are the only independent sensor.
  4.  **The Lab Lead:**
      *   **Weight:** **Veto Power** on technical feasibility. If they say "We can't sequence this fast enough," the investigation type changes, regardless of the Epi desire.

  ---

  ### Part 3: Distinguishing the Three Conflations

  You need to label the disagreement type explicitly in the minutes. This stops arguments from spinning.

  | Type | How to Spot It | What To Do |
  | :--- | :--- | :--- |
  | **1. Real Cascade** | People change their vote *after* you speak or after the Field Officer speaks, without offering new data. | **Intervention:** "I notice we are aligning. Let's take a 30-second silent re-vote on fingers." |
  | **2. Honest Convergence** | The "Hard Screen" criteria are met (e.g., specific strain match). Everyone agrees because the data forces it. | **Action:** Skip discussion. Record as "Convergence on Evidence." Do not waste time debating facts that are settled. |
  | **3. Value Disagreement** | Everyone agrees on the data (it's weak), but disagrees on the *cost of missing it*. | **Action:** Do not debate facts. Debate risk. "Is the cost of a false alarm higher than the reputational risk of a miss?" If unresolved, **escalate to Director.** This is not a triage decision; it's a policy decision. |

  ---

  ### Part 4: Running the Three Cases

  #### Case 1: The Poll Split (4–2 Investigate), Chair says Noise, Field Officer Silent (then speaks later)
  *   **Protocol Failure:** The Field Officer stayed silent in Step 2.
  *   **Correct Execution:**
      1.  **Step 1:** Poll is 4–2. Marked for "Deep Dive."
      2.  **Step 2:** You ask Field Officer. They *must* answer.
          *   *If they say "No new intel":* You proceed to close based on dashboard data. Their later comment is irrelevant; they had their turn.
          *   *If they say "I heard rumors":* The signal **cannot be closed**. It moves to "Limited Verification" (cheap check) rather than full investigation.
      3.  **Step 3:** You (Chair) state your view *last*.
      4.  **Outcome:** If Field Officer speaks up in Step 2, the "Close" decision is blocked. If they stay silent, the "Close" stands, and their later comment is a performance issue for them, not a process failure for you.
  *   **Fix:** Make Step 2 mandatory. "Field, explicit confirmation: any intel or not?"

  #### Case 2: Confirmed Strain, 3 Patients, No Link
  *   **Protocol Action:** **Step 0 (Hard Screen).**
  *   **Execution:** This meets the "Confirmed rare pathogen + >2 cases" criteria.
  *   **Time Spent:** 0 minutes in the meeting.
  *   **Instruction:** You email this out Sunday night. "Automatic Investigate per Protocol."
  *   **Why:** You said you don't want to waste the meeting on unanimous cases. This removes them entirely. If the team wants to debate it, they can email you. Do not burn 2 minutes of triage time on a clear clinical fact.

  #### Case 3: Chair Gut (90% sure) vs. Room Lukewarm
  *   **Protocol Action:** **Step 4 (Escalation).**
  *   **Execution:**
      1.  **Data Check:** Dashboard Block (You + 2 Epi) sees a pattern, but it's not "Hard Screen."
      2.  **Field Check:** Field Officer says "No new intel."
      3.  **Vote:** Room votes to Close (Cost/Risk balance).
      4.  **Your Move:** You cannot override based on "Gut." Gut is not independent evidence.
      5.  **The "Risk Escalation":** You say: "The data doesn't support investigation, but my risk tolerance for a miss is higher than the group's. I am escalating this to the Director as a **Risk Disagreement**, not a Fact Disagreement."
  *   **Is this bullying you?** No. It is protecting the agency from *your* bias.
      *   *Why:* If you are wrong, you waste money. If you are right, you look like a hero, but you bypassed the team's risk calibration.
      *   *The Trade:* The procedure forces you to pay a "reputational cost" (admitting it's a values clash, not a fact) to exercise your intuition. If you aren't willing to stake your judgment on a values escalation, your gut isn't strong enough to override the team.

  ---

  ### Part 5: Judgment Calls & Limitations

  **Where this procedure is actually a judgment call dressed up:**
  1.  **Defining the "Hard Screen":** I gave examples (2 cases, rare pathogen), but *you* have to define the threshold. If you set it too low, you bypass the team too often. If too high, you waste time. *Action:* Set this Friday, don't tweak it Monday.
  2.  **The "Risk Escalation":** Deciding when to bother the Director is subjective. If you do it every week, they will ignore you. If you never do it, you miss outbreaks. *Action:* Limit yourself to max 1 escalation per month.
  3.  **Field Officer Silence:** Treating silence as "No Intel" assumes they are engaged. If they are burnt out, silence means "I don't know." *Action:* If Field Officer is silent 3 weeks in a row, pull them aside. That's a management issue, not a triage issue.

  **What this procedure CANNOT do for you:**
  1.  **It cannot fix bad data:** If the dashboard is wrong, the "Dashboard Block" will lead everyone off a cliff. The procedure assumes the data is valid.
  2.  **It cannot make the Director decide faster:** It only structures *how* you ask.
  3.  **It cannot stop groupthink on values:** If the whole team (including you) undervalues a specific risk (e.g., a specific pathogen), the procedure will efficiently close those signals. You need external audit (the 6-month feedback loop you mentioned) to catch this.

  **Monday Morning Checklist:**
  1.  **Stop reading the poll results aloud.**
  2.  **Email "Hard Screen" signals Sunday night.**
  3.  **Start the meeting with the Field Officer.**
  4.  **If you overrule the room on a "Close," label it "Risk Escalation" and call the Director.**

  This keeps you within 45 minutes, protects you from cascade bias, and isolates the specific moments where human judgment is actually required.
