answer: |-
  Your hypothesis is correct, but it requires sharpening. The Socialist Calculation Debate (SCD) is not a standoff between two complete arguments on a shared question; it is a collision between two incompatible methodological paradigms that happen to share a vocabulary (prices, equilibrium, calculation). The appearance of a deadlock is indeed an artifact of conflating three distinct questions, but the deeper issue is that Lange and the Austrians disagree on the *ontology of economic data*.

  Here is the diagnosis of the disagreement, the evaluation of your friend's objections, and the verdict on what constitutes progress.

  ### 1. The Structure of the Disagreement: Three Questions, Two Paradigms

  You identified three questions. Let's map them to the underlying methodological commitments.

  *   **Mises (The Praxeological Question):** *What are prices for?*
      Mises argues prices are not merely numerical indices; they are exchange ratios emerging from conflicting claims of private ownership. Without private property in the means of production, there is no genuine exchange, and without exchange, there are no prices. This is a claim about **institutional necessity**.
  *   **Lange (The Engineering Question):** *Can an equilibrium be computed?*
      Lange accepts the neoclassical formalization of the economy as a system of simultaneous equations. He argues that a Central Planning Board (CPB) can act as a market surrogate via *tâtonnement* (trial and error). This is a claim about **computational feasibility** within a static framework.
  *   **Hayek (The Epistemological Question):** *How is knowledge utilized?*
      Hayek argues that the "data" required for Lange's equations do not exist *prior* to the market process. Knowledge is tacit, local, and subjective. Competition is not a state of equilibrium but a **discovery procedure**. This is a claim about **information generation**.

  **The Diagnosis:** The debate is not verbal; it is **methodological**.
  Lange is operating within **Walrasian General Equilibrium** theory. In this paradigm, preferences and production possibilities are assumed to be given (or at least stable enough to be treated as parameters). The problem is allocation under constraints.
  Mises and Hayek are operating within **Market Process** theory. In this paradigm, preferences and possibilities are discovered through interaction. The problem is coordination under ignorance.

  Lange answered Mises's challenge by saying, "We can solve the equations." Mises and Hayek replied, "You don't have the equations." Lange thought he was proving socialism was *possible*; the Austrians thought he was proving he was solving a *different problem*.

  **Which is the "real" question?**
  It is **Hayek's question**, but it relies on **Mises's premise**.
  Hayek's epistemological argument (knowledge is dispersed) explains *why* the calculation fails dynamically. But Mises's institutional argument (property is required for prices) explains *why* the incentives to reveal that knowledge are absent. Without Mises's property rights, Hayek's dispersed knowledge remains not just dispersed, but *suppressed*. Therefore, the core disagreement is about **Dynamic Efficiency vs. Static Allocation**. Lange won on static allocation (theoretically); the Austrians won on dynamic discovery (conceptually).

  ### 2. Evaluating the Complications

  Your friends' objections are standard, but they beg the question against the Austrian paradigm in specific ways.

  **Objection 1: The Operations Research Argument ("Computers are fast now")**
  *   **The Claim:** Mises thought calculation was arithmetically impossible; modern computers solve millions of variables; therefore Mises is obsolete.
  *   **The Diagnosis:** This attacks a straw man. Mises and Hayek never argued the *arithmetic* was too hard for a human brain; they argued the **data inputs** are unavailable.
      *   In optimization terms, your friend assumes the constraint matrix $A$ and the objective function vector $c$ exist and are knowable.
      *   Hayek argues that $c$ (subjective valuations) and large parts of $A$ (local production possibilities) are created *by* the process of trying to solve the problem.
      *   **Why it begs the question:** It assumes the "Engineering Question" (Lange's) is the valid one. It ignores the **Information Elicitation Problem**. Even if you have a supercomputer, you still need to get the data into it. If a factory manager knows a machine is about to break but reporting it will lower his quota bonus, he stays silent. No amount of CPU power solves incentive incompatibility.

  **Objection 2: The Amazon Argument ("Firms are planned economies")**
  *   **The Claim:** Amazon allocates resources internally by directive, not prices, at a scale larger than many states. Therefore planning works.
  *   **The Diagnosis:** This confuses **internal organization** with **systemic coordination**.
      *   **The Coasean Limit:** Firms exist to reduce transaction costs, but they face a hard budget constraint imposed by the *external* market. Amazon's internal planning is disciplined by the fact that if it allocates capital poorly, its stock price drops, and it faces takeover or bankruptcy.
      *   **The Boundary Problem:** A socialist economy *is* the boundary. There is no external market to discipline the planner.
      *   **Transfer Pricing:** Furthermore, large firms *do* use internal pricing (transfer pricing) to allocate resources between divisions precisely because pure directive fails at scale. Amazon uses market-like signals internally.
      *   **Why it begs the question:** It assumes the "Engineering Question" again. It treats the firm as a closed system where objectives are clear (profit maximization). In a state economy, the objective function is political and multidimensional (employment, stability, growth, equity), making the "minimize cost" instruction incoherent.

  ### 3. What Kind of Disagreement Is This?

  It is not a disagreement about facts (empirical), nor purely about definitions (verbal). It is a disagreement about **Model Specification**.

  *   **Lange's Model:** Agents have fixed preference functions. Technology is known. The problem is solving for $P$ such that Supply = Demand.
  *   **Austrian Model:** Agents discover preferences through choice. Technology is discovered through entrepreneurship. The problem is creating institutions that allow error correction.

  Because they disagree on the specification of the model (specifically, whether preferences/technology are exogenous or endogenous), they cannot agree on what counts as evidence.
  *   For Lange, evidence is the **existence of a solution** to the equations.
  *   For Hayek, evidence is the **rate of innovation and error correction** in the system.

  This is why 1989 didn't "settle" it theoretically. The collapse of the USSR was an empirical verdict on *political* socialism, but it did not formally disprove Lange's *market socialism* (which was never tried in pure form), nor did it satisfy the Austrians that the *calculation problem* was understood rather than just the *incentive problem*.

  ### 4. What Would Count as Progress?

  Given this diagnosis, a historical verdict or a political consensus will not satisfy your group. Here is where actual intellectual progress lies:

  **A. Mechanism Design Theory (The Formal Path)**
  The closest thing to a formal resolution of the SCD is **Implementation Theory** (Hurwicz, Maskin, Myerson).
  *   **Progress:** This field asks: "Under what conditions can a planner achieve a specific outcome if agents hold private information and act strategically?"
  *   **Verdict:** It proves that under general conditions, it is impossible to design a mechanism that induces truth-telling and achieves Pareto efficiency simultaneously (e.g., the Laffont-Maskin impossibility results).
  *   **Why it matters:** It translates Hayek's vague "knowledge problem" into a rigorous **Incentive Compatibility constraint**. It shows Lange was mathematically naive about the strategic behavior of the enterprise managers he relied on.
  *   **Action:** Read up on the **Groves-Clarke mechanism** and its limitations. This bridges Mises (incentives) and Hayek (information).

  **B. Computational Complexity & Decentralization (The CS Path)**
  Your computer scientist member can contribute here.
  *   **Progress:** Analyze the communication complexity of the Lange-Lerner mechanism. How many bits of information must be transmitted between the Board and firms to reach convergence?
  *   **Verdict:** Research (e.g., by Cramton, Stacchetti) suggests the communication load for a central planner to achieve the same efficiency as a decentralized market is exponentially higher.
  *   **Why it matters:** It vindicates Hayek not on philosophical grounds, but on **bandwidth grounds**. The market is a compression algorithm.

  **C. The Conceptual Distinction (The Philosophical Path)**
  Your group should explicitly distinguish **Static Efficiency** (allocating existing resources to existing wants) from **Dynamic Efficiency** (creating new resources and new wants).
  *   **Progress:** Acknowledge that Lange is *correct* regarding Static Efficiency (a planner *could* mimic a market if data were given). Acknowledge that Hayek is *correct* regarding Dynamic Efficiency (the data is never given).
  *   **Why it matters:** It dissolves the "who won" fight. Lange won the 1930s argument (neoclassical statics); Hayek won the 1990s argument (complexity and growth).

  ### Summary Verdict for Your Group

  1.  **Stop asking "Who won?"** The debate is a category error. Lange and Hayek were playing different games (Equilibrium vs. Process).
  2.  **The "Real" Question:** It is Hayek's question (**Discovery**), but it cannot be answered without Mises's institution (**Property**).
  3.  **Refute the OR Friend:** Computation is not the bottleneck; **elicitation** is. The constraint is not $FLOPS$; it is **Incentive Compatibility**.
  4.  **Refute the Amazon Friend:** Firms are islands of planning in a sea of markets. They work *because* of the sea. Remove the sea (the external price system), and the island sinks.
  5.  **Path to Progress:** Do not look for historical evidence. Look for **Mechanism Design** results. The question is no longer "Can socialism calculate?" but "Under what informational and incentive constraints can a centralized mechanism approximate a decentralized market?" The answer is: "Only under extremely restrictive conditions that do not hold in a macroeconomy."

  The impasse is not a failure of logic; it is a failure to recognize that economics migrated from a study of **allocation** (Lange) to a study of **information and incentives** (Hayek/Mechanism Design). Your group progresses by formally acknowledging that migration.
