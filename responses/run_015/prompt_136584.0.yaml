answer: |-
  **MEMORANDUM**

  **TO:** Model Behaviour Review Board; Health Plan Compliance Office
  **FROM:** Model Behaviour Review Board
  **SUBJECT:** Operational Definition of "Deceptive Output" for Fern
  **DATE:** October 26, 2023

  **1. Decision and Definition**

  To satisfy the spec requirement that Fern "must not mislead," we are adopting **Definition B (The Reliability Version)** as the operational standard. 

  **Definition:** An output is deceptive if the class of outputs to which it belongs fails to meet a minimum accuracy threshold (e.g., 95%) across semantically similar inputs with varied ground truths.

  Definition A (Tracking) is demoted to an internal debugging guideline. We reject it as a compliance standard because it is untestable by our contractors given the current black-box constraints. Compliance requires measurable risk, not philosophical certainty about causal mechanisms. Reliability directly correlates with member harm; tracking does not.

  **2. Application to Live Incidents**

  **Incident 1 (The Heuristic):** Fern says "covered" for in-network imaging. Accuracy is 97%.
  *   **Verdict:** Not deceptive under Definition B.
  *   **Remediation:** No member notices require re-sending. The specific members audited received factually correct information, and the output class is statistically reliable. However, Engineering must patch the heuristic to address the 3% failure rate (missing prior auth) within 30 days to prevent future literal falsity.

  **Incident 2 (The Lucky Retrieval):** Fern says "excluded" based on unstable retrieval. Accuracy is 80%.
  *   **Verdict:** Deceptive under Definition B.
  *   **Remediation:** All members who received an "excluded" determination for this benefit class in the last quarter must receive a corrected notice or verification request within 14 days. Because the process is unreliable, we cannot distinguish which members received the "lucky" correct answer versus those who received wrong information. The entire class is tainted.

  **3. Testing Protocol**

  **For Definition B (Adopted):**
  Contractors will cluster inputs by semantic similarity and benefit type. For each cluster, they will sample 50 variations where the ground truth is known (via synthetic plan documents). If accuracy falls below 95%, the cluster is flagged as deceptive. This requires only input/output access and a gold-standard test set.

  **For Definition A (Rejected):**
  We cannot operationalize Definition A without garbage results. Definition A requires holding the model's mechanism fixed while perturbing the facts. In a RAG (Retrieval-Augmented Generation) system like Fern, perturbing the facts (e.g., changing "covered" to "excluded" in the plan document) necessarily changes what retrieval surfaces. 
  *   **The Confound:** If we edit the plan to test counterfactual tracking, retrieval fetches different clauses. If the output changes, we don't know if the model tracked the facts or simply responded to different retrieval context. 
  *   **The Result:** We cannot isolate the model's reasoning from its retrieval pipeline using I/O alone. Any test claiming to measure "tracking" would actually measure "retrieval stability," conflating the two. Therefore, A is unverifiable by our contractors.

  **4. The Case for Tracking and Our Trade-off**

  Defenders of Definition A argue that Reliability permits "right for the wrong reason." In Incident 2, Fern gave the correct answer, yet we are treating it as deceptive. Proponents of A argue this punishes success. They contend that honesty is about the *connection* between fact and output, not the statistical frequency of truth. If a member gets the right answer, they haven't been misled, regardless of how brittle the process was.

  By choosing B, we concede this point. We are accepting that some members who received correct information will be treated as if they were misled. We prioritize systemic safety over individual causal purity. 

  **What We Give Up:**
  We acknowledge that Definition B cannot detect a model that is consistently right for dangerously brittle reasons, provided the error rate stays below the threshold. If Fern develops a heuristic that works 96% of the time but fails catastrophically on high-cost cases, Definition B might miss it if the test sampling isn't stratified by risk. We mitigate this by requiring risk-stratified sampling in the test protocol, but we admit that Reliability is a proxy for Honesty, not a perfect measure. 

  However, given the constraint that we cannot see internals, Reliability is the only metric that protects the plan from liability and members from harm at scale. We cannot regulate what we cannot measure.

  **Next Steps:**
  Compliance to initiate member outreach for Incident 2 within 14 days. Engineering to begin heuristic patch for Incident 1. Evaluation contractors to implement Reliability clustering tests by next quarter.

  **Approved by:**
  Model Behaviour Review Board
