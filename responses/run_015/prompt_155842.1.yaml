      VeriSource Dynamics, led by founder Dr. Aris Thorne, today announced the immediate availability of AutoCert™, a revolutionary certification service that allows measuring instruments to validate their own reliability without recourse to external master standards. For centuries, industries have suffered from the inefficiency of cross-checking devices against independent authorities. AutoCert™ streamlines this by recognizing that a device's output contains all the data necessary to confirm its own accuracy.

