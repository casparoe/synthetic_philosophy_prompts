      *   **Task:** Analyze *Lord of the Flies* through the lenses of "Information Cascades" vs. "Preference Falsification."
      *   **Specific Questions:**
          1.  Is Jack's rise a standard cascade (updated beliefs) or preference falsification (hiding doubts)?
          2.  Does Simon's death represent a failed cascade-breaker (suppressed evidence)?
          3.  Where does the book resist being flattened into an economics/modeling framework? (What does it capture that formal papers miss?)
      *   **Constraints:** No citations, no bibliography, honest take, focus on fear and conformity.

  2.  **Deconstruct the Concepts:**
      *   **Information Cascade:** Person A acts based on private info. Person B sees A's action and ignores their own private info to follow A. Person C sees A and B and follows. Eventually, the public action becomes detached from the underlying private reality. Key mechanism: *Belief updating* ("If they believe it, maybe I should too").
      *   **Preference Falsification (Timur Kuran):** People publicly express a preference different from their private one to avoid social sanctions. Key mechanism: *Social pressure* ("I don't believe it, but I'll get hurt if I say otherwise").
      *   **The Novel (*Lord of the Flies*):** Boys stranded, descent into savagery, fear of the "beast," Jack vs. Ralph, Simon's death, Piggy's death, rescue.

  3.  **Address Question 1: Jack's Rise (Cascade vs. Falsification):**
      *   *Initial thought:* It starts as a cascade. The littleuns are scared. Someone says "beast." Others see them scared and get scared.
      *   *Nuance:* As Jack gains power, it shifts. The older boys (Roger, Maurice) know there's no monster, but they enjoy the power/violence. The younger ones are genuinely terrified.
      *   *Synthesis:* It's a hybrid. Early on, it's an information cascade regarding the *existence* of the beast (noisy private signals: shadows, nightmares). Later, it becomes preference falsification regarding *loyalty* to Jack. You don't join because you believe in the beast; you join because Ralph's camp offers no food/protection and Jack's camp offers meat and safety, plus punishment for dissent.
      *   *Dev analogy:* It's like a system where the error logs (private signals) are ignored because the uptime dashboard (public signal) looks green, until the database crashes. But later, it's like developers lying about code quality because the CTO fires anyone who reports bugs.

  4.  **Address Question 2: Simon's Death (Failed Cascade-Breaker):**
