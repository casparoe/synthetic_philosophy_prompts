      *   *Preference Falsification angle:* Even if they heard him, admitting he was right means admitting *they* are wrong and *Jack* is wrong. The social cost is too high.
      *   *Synthesis:* It's a "signal suppression." The network rejects the packet because the protocol (the ritual) demands consensus on the threat, not truth. It's not just a failed break; it's an active immune response against the truth.

  5.  **Address Question 3: Resisting the Model (The "Human" Element):**
