prompt: |-
  Hi — I'm a GP by background and I sit on our regional health system's individual funding request panel, the thing everyone here calls "exceptional cases". We meet twice a month, get through about twenty-five cases a session, ten or fifteen minutes each, and the panel is me, a paediatrician, someone from finance, and a lay member who is formidably sensible and has no medical training at all. Our founding document says we fund "restoration or maintenance of normal bodily and mental functioning" and we don't fund "improvement of function beyond what is normal". That sentence read as perfectly clear for about a fortnight, and then real cases started arriving and it's been coming apart in our hands ever since. I've done some reading on the therapy-versus-enhancement distinction in my own time and I get the general shape of the arguments, but everything I found stops right at the bit I need: somebody has to actually decide, in fifteen minutes, and write one page of reasons that has to survive an appeal and be readable by the person who applied. I was complaining about this to my brother, who teaches, and he said the same thing comes up with exam extra time and whether a quiet room is a treatment or an advantage, which is basically the same problem wearing a different hat.

  So: please write me a decision procedure my panel can actually run, with the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure stops and returns a "no" on its own, and where it has to hand the question to the four of us because it's a values call and not a factual one. Some constraints. We can't put terms like "species-typical" in the decision letters — the lay member rolls her eyes and the applicants definitely won't know what it means — so every question needs an askable-in-plain-English version. We get a twenty-page submission from the applicant's clinician and we can't commission anything ourselves, and maybe forty per cent of the time the submission just doesn't contain what we need, so the procedure has to tell us what to do when the answer is "unknown" rather than pretending we can look it up. We're also meant to be consistent with what earlier panels did without being strictly bound by it, so say how to record a decision so the next one can follow it. Two things I want built in because they've wrecked us twice already: one, some of these benefits are positional — they only work because most other people don't have them, and if we funded everyone the benefit would just evaporate — and I don't know whether that counts against funding or whether it's a fairness question we should be voting on separately. Two, my colleague pointed out that if we'd built schools around moving around instead of sitting still, a chunk of what we fund for attention problems would count as enhancement under our own rule, which makes me think "normal functioning" is quietly being measured against a world we invented; I'd like a question that catches cases where the demand being met is one our own institutions created, and I'd like you to tell me honestly if that question opens a hole we can't close.

  Then run it on these. (1) A cochlear implant for a 45-year-old man who has been profoundly deaf since birth, fluent signer, active in the Deaf community, otherwise healthy; half the panel thinks this is obviously treatment because he's deaf, half thinks it's enhancement because there's nothing there to restore. (2) A request from occupational health on behalf of night-shift nurses for a wake-promoting drug — the papers just call it Drug W, it's licensed for narcolepsy, these nurses don't have narcolepsy, they have our rota — with data showing measurably higher error rates on nights. (3) Growth hormone for a twelve-year-old boy on the second percentile for height, no deficiency, both parents short, predicted adult height about 5'3", and the referral letter mentions bullying. I've a feeling at least one of those comes out somewhere the panel won't want to go — my guess is the growth hormone one, since we've always informally treated short stature as cosmetic, but if it's a different one that should bother us, say so plainly instead of letting me fudge it. If you've room, sketch the case that keeps coming up and that I personally can't get straight: a 58-year-old surgeon whose memory is completely normal for her age and not for her job. And tell me which distinctions I have to keep for the procedure to stay honest, which ones I can drop without it going wrong, and where it will give me an answer that's consistent and defensible but just isn't right.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Deconstruct the Request:**

      *   **User:** GP, sits on an Individual Funding Request (IFR) panel ("exceptional cases").
      *   **Context:** Panel meets twice/month, ~25 cases/session, 10-15 mins/case. Panel composition: GP, Paediatrician, Finance, Lay Member.
      *   **Mandate:** Fund "restoration or maintenance of normal bodily and mental functioning." Do *not* fund "improvement of function beyond what is normal."
      *   **Problem:** The distinction is clear in theory but collapses in practice. Need a practical decision procedure (algorithm/heuristic) that fits the time constraints (15 mins), produces a defensible 1-page reason, handles missing info, ensures consistency, and addresses specific philosophical/practical pitfalls.
      *   **Constraints:**
          *   No jargon (e.g., "species-typical"). Plain English only.
          *   Cannot commission new data (rely on 20-page submission, often incomplete).
          *   Must handle "Unknown" answers gracefully.
          *   Must record decisions for future consistency (precedent) without being strictly bound.
          *   Must address *positional goods* (benefits that vanish if everyone has them).
          *   Must address *institutional mismatch* (is the "disability" caused by the environment we built?).
      *   **Test Cases:**
          1.  Cochlear implant (congenitally deaf, Deaf community member).
          2.  Wake-promoting drug for night-shift nurses (no narcolepsy, safety issue).
          3.  Growth hormone (short stature, no deficiency, bullying).
          4.  (Optional/Extra) Surgeon with age-normal memory but job-impaired memory.
      *   **Output Requirements:**
          *   The Decision Procedure (questions, order, stop points, values calls).
          *   Application to Test Cases.
          *   Analysis of the "Surgeon" case.
          *   Reflection on distinctions to keep/drop and where the procedure fails (honesty about limitations).

  2.  **Develop the Decision Procedure:**

      *   *Goal:* A flowchart-like sequence of questions that filters cases quickly but flags hard ethical dilemmas for panel discussion.
      *   *Tone:* Practical, administrative, plain English.
      *   *Step 1: The Baseline (Is there a deficit?)*
          *   Need to define "normal" without using "species-typical."
          *   Question: "Is this person functioning below the range expected for a healthy person of their age/sex?"
          *   Stop if No (unless it's a prevention case, but the mandate says restoration/maintenance).
      *   *Step 2: The Cause (Pathology vs. Environment)*
          *   Address the "schools built for sitting" problem.
          *   Question: "Is the limitation caused by a fault in the person, or a mismatch between the person and the world?"
          *   Nuance: If the world is fixed (e.g., needing to see to drive), is it a fault?
      *   *Step 3: The Goal (Restoration vs. Enhancement)*
          *   Question: "Will this bring them up to the baseline, or push them past it?"
          *   Hard part: Defining the baseline for the *individual*.
      *   *Step 4: The Missing Info Protocol*
          *   What if the submission doesn't say?
          *   Rule: Burden of proof is on the applicant. If unknown, default to "No" but flag for precedent tracking.
      *   *Step 5: Positional Goods*
          *   Question: "If everyone got this, would the advantage disappear?"
          *   If Yes -> High scrutiny. Is it safety or advantage?
      *   *Step 6: Recording/Precedent*
          *   Need a tagging system.

      *   *Refining the Questions (Plain English):*
          *   Instead of "Species-typical," use "What is usual for someone their age."
          *   Instead of "Pathology," use "Health problem."
          *   Instead of "Positional Good," use "Advantage over others."

      *   *Addressing the "Institutional Mismatch" (The School Question):*
          *   This is the trickiest part. If we fund accommodation for ADHD, are we admitting schools are wrong?
          *   Procedure needs a "Reality Check": "Are we fixing the person to fit a necessary requirement, or fitting them to an arbitrary one?"
          *   *Honesty Check:* The user asked if this opens a hole we can't close. Yes, it does. It shifts the budget from health to social engineering. The procedure needs to acknowledge this limit.

  3.  **Drafting the Procedure (Iterative refinement):**

      *   *Phase 1: Triage (The "No" Filters).*
      *   *Phase 2: The Core Test (Restoration vs. Enhancement).*
      *   *Phase 3: The Complications (Positional/Environment).*
      *   *Phase 4: The Verdict & Recording.*

      *   *Handling "Unknown":* Explicitly state: "If the submission does not provide evidence for X, we assume X is not met." This protects the panel from hunting for data.

      *   *Handling Precedent:* Create a "Case Tag" system (e.g., [Growth-NonDefic-01]).

  4.  **Applying to Test Cases:**

      *   *Case 1 (Cochlear Implant):*
          *   Baseline: Deafness is below "usual" hearing? Yes.
          *   Restoration: Restores hearing? Yes.
          *   *Conflict:* Patient identifies as Deaf (culture). Is deafness a disability or identity?
          *   Procedure outcome: Likely "Fund" based on physiological restoration, but the "Values Call" flag must be triggered regarding quality of life/identity.
          *   *Wait:* The prompt says half the panel thinks it's enhancement because "nothing to restore." This implies the "baseline" is *his* baseline (deaf since birth).
          *   *Correction:* The procedure must distinguish between *statistical normality* (population) and *individual baseline* (pre-injury). For congenital, it's population.
          *   *Verdict:* This is the hardest case. The procedure will likely force a "Values Call."

      *   *Case 2 (Nurses/Drug W):*
          *   Baseline: Are they sick? No.
          *   Function: Is their function impaired? Yes (error rates).
          *   Cause: Rota (Environment) vs. Physiology.
          *   Positional: If all nurses take it, does error rate drop? Yes. It's not positional in the "beating others" sense, it's safety.
          *   *Verdict:* Likely "No" under strict "restoration of *bodily* functioning" (they aren't ill), but "Yes" if interpreted as "maintenance of safe professional functioning." The procedure should flag the "Institutional Mismatch." The rota is the problem, not the nurses. Funding the drug subsidizes bad rostering.

      *   *Case 3 (Growth Hormone):*
          *   Baseline: 2nd percentile. Statistically "abnormal" but medically "healthy."
          *   Restoration: No deficiency to restore.
          *   Enhancement: Pushing past genetic potential.
          *   Harm: Bullying (social).
          *   *Verdict:* "No." This is the classic enhancement/cosmetic case. The procedure should catch this at "Is there a health defect?"

      *   *Case 4 (Surgeon):*
          *   Baseline: Normal for age (58).
          *   Requirement: High for job.
          *   *Verdict:* "No." This is occupational health, not health system.

  5.  **Addressing the Specific Constraints & "Holes":**

      *   *Positional Goods:* Need to distinguish between "Safety" (everyone benefits) and "Ranking" (only winner benefits).
      *   *Institutional Mismatch:* The user asked to be told honestly if this opens a hole.
          *   *Answer:* Yes. If we fund accommodations for "normal variations" because institutions are rigid, we become a social welfare fund. The procedure must draw a line at "Medical Necessity" vs. "Social Accommodation."
      *   *Distinctions to Keep/Drop:*
          *   Keep: Pathology vs. Variation.
          *   Drop: "Normal" as a rigid statistical line (use ranges).
          *   Drop: "Cure" vs. "Management" (both are maintenance).
      *   *Where it fails:* Edge cases where "normal" is socially constructed (e.g., height, deafness culture).

  6.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the difficulty.
      *   **The Procedure:** Step-by-step, with "Stop/Go" and "Values Call" markers.
      *   **The Recording System:** How to track precedent.
      *   **Case Applications:** Running the three (plus surgeon) cases through the mill.
      *   **The Honest Audit:** What distinctions matter, which don't, and where the system breaks.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I avoid "species-typical"? Yes, use "usual for age/sex."
      *   *Check:* Did I handle the "Unknown"? Yes, burden of proof clause.
      *   *Check:* Did I address the "Schools/Rota" issue? Yes, in the "Environment Check."
      *   *Check:* Is the tone appropriate? Professional, empathetic to the GP's burden, not overly academic.
      *   *Crucial:* The Cochlear Implant case is the minefield. I need to make sure the procedure doesn't just say "Yes" automatically. It needs to flag the *identity* conflict. The prompt says half think it's enhancement because "nothing to restore." This implies the baseline is *his* life history. I need to clarify that "Normal Functioning" refers to *human* functioning, not *his specific* functioning.
      *   *Crucial:* The Nurse case. If we fund this, do we incentivize bad shifts? The procedure needs to ask "Is there a non-drug alternative?"
      *   *Crucial:* The Growth Hormone case. This is the "cosmetic" trap. The procedure must filter out "social distress" without "physiological defect."

  8.  **Final Review against constraints:**
      *   15-minute fit? Yes, the questions are designed for rapid triage.
      *   Plain English? Yes.
      *   Precedent tracking? Included.
      *   Honest about limitations? Yes, in the final section.

  *(Self-Correction on the "School/Rota" question)*: The user asked: "tell me honestly if that question opens a hole we can't close." I need to be very direct here. It *does* open a hole. It shifts the boundary of healthcare to social policy. I should advise them to acknowledge the hole but build a fence around it (e.g., "We fix the person only if the environment is fixed/unchangeable").

  *(Self-Correction on Precedent)*: Don't suggest a database they don't have. Suggest a "Log Sheet" with specific tags.

  *(Final Polish)*: Ensure the distinction between "Medical Need" and "Social Need" is clear, as that's the core tension.

