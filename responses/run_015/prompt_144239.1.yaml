  2. Same memory, same evidence, high-stakes version: if she's wrong the rent check bounces and she loses the apartment. Verdict: doesn't know.
  3. High stakes again, but this time she's also checked the app, the website, and rung the branch, and that is genuinely all the confirming evidence there is to get. Verdict: knows.
  4. High stakes, and she did none of those checks, even though the two-minute check was right there. Verdict: doesn't know, and her stated reason was something like "when that much is riding on it you have to look it up."
  5. Low-stakes subject, high-stakes speakers: some guy casually remembers the branch hours, nothing rides on it for him, but our whole plan depends on him being right. Verdict: he knows, we don't.
  6. Enormous stakes the subject has never heard about: an administrative mix-up means that if she is wrong, someone else's project collapses. Verdict: doesn't know — but she hedged and muttered something about how once we've been told about the stakes we can't un-hear them and go back to saying she knew.
  7. She won't give a straight verdict on the full-on skeptical scenario; she says it depends on what we're doing in the conversation.

