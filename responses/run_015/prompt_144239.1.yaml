  Her prior verdicts reveal a hybrid sensitivity to stakes and context, but Verdict 5 ("He knows, we don't") is the diagnostic key: it承认 s that knowledge attributions can vary between subjects and attributors depending on whose context is operative, which is the hallmark of Contextualism. Pure Pragmatic Encroachment (invariantism) typically holds that if the stakes are high enough to defeat knowledge for the group, they defeat it for the subject too, or vice versa; it struggles to validate both "He knows" and "We don't" simultaneously without relativizing the truth conditions. Verdict 6 (unaware high stakes) eliminates Subjective Encroachment, as she denies knowledge despite the subject's ignorance of the stakes. This leaves Attributor Contextualism (standards set by the speaker's context) and Objective Encroachment (standards set by the world's stakes) as the live contenders. In the Nadia case, the Colleague is the attributor, and their context is high-stakes (speaking to the employer about irreversible loss). Under Contextualism, this raises the bar for the truth of "Nadia knows" in that conversation; since Nadia's evidence (a glance) is insufficient for high-stakes action (parallel to Verdict 4), the attribution is false. Objective Encroachment yields the same verdict here (objective stakes are high), but the underlying mechanism differs.

  To separate Attributor Contextualism from Objective Encroachment, you need a case where the attributor's stakes and the objective stakes come apart. Present her with the **"Mistaken High-Stakes Attributor"** case: Nadia enters data for a routine, low-cost shipment (objective stakes low), but the Colleague mistakenly believes the process is irreversible and expensive (attributor stakes high) and says, "Nadia knows." An Objective Encroacher should verdict **knows** (because the objective stakes are low enough for a glance to suffice), whereas an Attributor Contextualist should verdict **doesn't know** (because the attributor's high-stakes context raises the semantic bar for "knows"). Given her reliance on conversational salience in Verdict 7 and the attributor-relative verdict in Verdict 5, she will likely say **doesn't know**, confirming Contextualism.

