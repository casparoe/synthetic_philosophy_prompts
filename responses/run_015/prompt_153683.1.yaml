      *   *Arrival (Standard Reading):* Sapir-Whorf hypothesis. Learning Heptapod B rewires the brain to perceive time non-linearly.
      *   *Wittgensteinian Reading:* If meaning is use, what is the *use* of Heptapod B? It's not just describing the world; it's *performing* time.
      *   *The Tension:* Wittgenstein emphasizes shared forms of life. Heptapods have a radically different form of life (non-causal). Can there be a "language game" between humans and Heptapods if the "form of life" is incompatible?
      *   *The "Rupture":* If human language games are bound by cause-and-effect (past/present/future), and Heptapod B is simultaneous, does learning it break the human game?
      *   *Louise's Choice:* Is this a rule-following action in a new game, or a representational understanding of a fixed future?

