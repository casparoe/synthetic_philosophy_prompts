  MEMORANDUM FOR THE RECORD

  **TO:** Stakeholder Working Group on Paleolithic Alignment
  **FROM:** Intergenerational Subsistence Reversion Commission (ISRC)
  **DATE:** October 24, 2023
  **SUBJECT:** Feasibility Assessment: Neolithic Reversion Initiative (NRI)

  **EXECUTIVE SUMMARY**

  The ISRC has evaluated the proposal to rescind the Agricultural Revolution based on literature suggesting early farming reduced individual welfare. Data supports the "Original Affluent Society" thesis regarding leisure allocation; forager models indicate lower labor input per caloric unit compared to early agrarian benchmarks. Affluence is correctly understood as wants met rather than goods accumulated. However, Charter Section 4(b) mandates maintenance of current global biomass during transition. Current foraging carrying capacity estimates (0.1 persons/km²) conflict with existing population density (50+ persons/km²). Reversion without capacity adjustment results in immediate caloric deficit. Therefore, compliance requires reconciling the demographic ratchet: surplus created the population that now necessitates surplus. To proceed, the Commission recommends reclassifying the no-depopulation clause via Phase II eligibility protocols.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can we simply undo the decision to farm?**
  A: Historical audit indicates no unilateral rescindable event. The transition was gradual, piecemeal, and frequently reversed locally over millennia. There is no off-switch, only a systemic lock-in. Reversion is not a policy change but a structural overhaul.

  **Q: Did agriculture actually make us worse off?**
  A: Bioarchaeological evidence is mixed. While enamel hypoplasia and anemia markers increased post-transition, suggesting nutritional stress, stature reduction is not universal across all zones. Furthermore, average individual welfare must be distinguished from total welfare. Farming may have degraded individual quality of life while maximizing total population count. We cannot optimize for both simultaneously. The literature suggests farming was a mistake for the individual, but a success for the species' aggregate biomass.

  **Q: Does the forager model account for violence?**
  A: Yes. Egalitarianism models must include inter-group conflict mitigation costs. Infanticide rates and lethal violence percentages in forager cohorts are non-zero and must be weighed against agrarian state monopoly on violence. The leisure dividend is real, but the security premium is variable. Romanticized assessments often omit mortality data from contested borderlands.

  **Q: How do we resolve the carrying capacity discrepancy?**
  A: Strict adherence to Charter Section 4(b) is mathematically incompatible with foraging modes. To achieve target leisure metrics, the Commission proposes demographic rightsizing. This involves voluntary non-provisioning incentives for Phase II eligibility. Essentially, we must reduce the number of mouths to match the available foraging surplus. This is not depopulation; it is alignment of biomass with sustainable leisure targets.

  **Q: What is the timeline for rightsizing?**
  A: Indefinite. Until eligibility criteria are met, reversion remains paused. Stakeholders are advised that affluence is defined by wants met, not goods accumulated. Reducing wants via population reduction is the most efficient path to meeting them. We anticipate resistance regarding the definition of "voluntary," but the calculus remains static.
