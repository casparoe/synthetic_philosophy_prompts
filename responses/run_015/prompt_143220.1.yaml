answer: |-
  This is a brilliant archival puzzle. Your mate isn't just applying one rule; she's navigating a tension between three competing ethical frameworks. The reason you can't pin her down is that she's balancing them against each other, but there is a hierarchy in her decision-making.

  Here is the breakdown of what's actually driving her, how she'll rule on the new cases, and the one question that will force her to show her hand.

  ### 1. The Real Rule: "Agency Over Subject"
  You identified three possibilities: Gap-filling, Power Dynamics, and Consent. All three are in play, but they rank in a specific order.

  *   **Primary Rule (The Filter):** **Privacy and Consent of Living Subjects.**
      *   *Evidence:* She rejected the Head Teacher's diaries immediately because pupils/staff were named and alive. This is a hard stop. GDPR and ethical duty trump historical value.
  *   **Secondary Rule (The Compass):** **Provenance of Agency.**
      *   *Evidence:* She takes records *created by* the marginalized (Fish worker, Union, Oral History) or records *of the system* that ruled them when no other trace exists (Vestry minutes). She rejects records *created by the powerful* about the marginalized when other traces exist (Mill Owner diaries rejected because wage books/papers already cover the economic relationship; his personal view would dominate the narrative).
  *   **Tertiary Rule (The Constraint):** **The "Second Silence" (Context).**
      *   *Evidence:* She rejected the Planning Objector's files because they were one man's curated "true history." That creates a "second silence" by drowning out other voices with a single, loud narrative.

  **What you're missing:** The distinction isn't just "Power vs. Powerless." It's **who created the record.**
  *   *Vestry Minutes:* Created by the powerful, but taken because the powerless left **no other record**. It is the only trace of the paupers.
  *   *Mill Owner Diaries:* Created by the powerful, and rejected because the workers **are recorded elsewhere** (wage books). His diary would overwrite their reality with his perspective.
  *   *Head Teacher:* Created by the powerful, rejected because the subjects (children) are **living and vulnerable**.

  ### 2. The Verdict on the New Cases

  Based on this hierarchy, here is how she will likely rule next month.

  **Case 1: The Tenants' WhatsApp**
  *   **Verdict:** **Reject.**
  *   **Why:** It fails the Primary Rule (Consent/Privacy). Like the Head Teacher's diaries, it contains named living people (neighbors, kids) who did not consent. The fact that it is a "resistance" narrative (Secondary Rule) does not override the privacy violation. Furthermore, the admin depositing it without the group's knowledge violates the "Agency" principle established by the Caribbean Oral History (which had signed consent and joint deposit).
  *   **Access:** N/A (Won't be taken).

  **Case 2: The Housing Association Emails**
  *   **Verdict:** **Take, but Close for 50–100 Years.**
  *   **Why:** This is the "Vestry Minutes" equivalent. It is the official record of the power structure affecting the community. To prevent the "Second Silence," the archive *must* hold the record of the opponent, or the tenants' struggle loses its context. However, because it names living residents and officers (Primary Rule), it must be closed. The whistleblower aspect is legally risky, but archivists often accept "unofficial deposits" of official records if legal title can be sorted, prioritizing the long-term historical record over the institution's comfort.
  *   **Access:** Closed until 2075+ (GDPR/Privacy protection).

  ### 3. The Test Case for Sunday

  To force her to admit which rule is actually dominant, you need a scenario where **Gap-Filling** and **Power Dynamics** conflict with **Narrative Control**.

  You need to ask her about a record that comes from the "working class" but undermines the "resistance" narrative.

  **Put this case to her:**
  > "Imagine a box of letters turns up from a **strikebreaker** (a 'scab') during that 1960s transport strike you already hold records for. He didn't join the union because he was supporting sick parents and needed the guaranteed hours. The letters explain his choice, but they contradict the union's official minutes. He's dead, so no privacy issue. Do you take them?"

  **Why this works:**
  *   **If she says YES:** She is prioritizing **Gap-Filling/Complexity**. She admits the archive's job is to record the messy truth, even if it complicates the 'heroic' narrative of the union.
  *   **If she says NO:** She is prioritizing **Power/Resistance**. She admits she is curating a history of *organized struggle*, and views the strikebreaker's record as noise that dilutes the workers' collective voice.
  *   **If she says "Only if we can get the Union's response too":** She is prioritizing the **"Second Silence"**. She is worried about context more than content.

  ### Summary for your argument
  Tell her you've cracked the code: She isn't collecting "history"; she's collecting **traces of agency**.
  *   She takes the Vestry minutes because the paupers left no other trace.
  *   She rejects the Mill Owner because the workers left other traces (wage books), and his diary would silence them.
  *   She rejects the Head Teacher because the children cannot consent to being traced.

  If you walk in with that, she'll either nod and buy you a drink, or tell you exactly where you're wrong—which is what you actually want.
