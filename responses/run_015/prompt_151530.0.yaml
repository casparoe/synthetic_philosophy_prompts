      *   *Ontological/Axiological Split:* This is the crucial move. Ontologically, the parts constitute the whole. Axiologically, the value of the whole is a primitive property of the *totality*, not a composite property. This resolves the tension by forbidding the arithmetic operation that leads to double-counting.

