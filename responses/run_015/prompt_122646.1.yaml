      *   Plain English translations? Checked.
      *   Menu format? Checked.
      *   Addressed 4 specific points? Checked.

  9.  **Final Polish:** Ensure the distinction between "logical possibility" and "physical probability" is clear. Ensure the distinction between "no bias works everywhere" and "no bias works here" is sharp. (Self-correction: Make sure to explicitly label the verdicts as requested: Trivial, Substantive-and-Probably-True, Actually False).

