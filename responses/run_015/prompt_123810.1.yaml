      *   *Correction on Mixed Strategies:* The user asks if a move can be crossed out if the player *never* randomizes. Yes. If Mix(B,C) > Pure(A), then Pure(A) is irrational regardless of whether the player intends to randomize. The *comparison* uses a mix, the *choice* is pure. This is a crucial distinction.
