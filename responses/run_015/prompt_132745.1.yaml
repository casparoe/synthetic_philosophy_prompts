answer: |-
  ### 1. Felicity-Depth Scores and Tiers

  **Tier 1 (0.80–1.00)**
  *   **(vii) 0.95:** The narrator's direct address creates an absolute meta-fictional contract that overrides internal ambiguity, demanding the reader accept the statement as ontological truth within the book.
  *   **(iii) 0.85:** Although the letter is unsent, the addressee's subsequent behavior and the reader's necessity to interpret that behavior confirm the promise as psychologically and narratively binding.

  **Tier 2 (0.50–0.79)**
  *   **(iv) 0.60:** The ambiguous nod weakens the initial uptake, but the final payment confirms the wager's social validity within the narrative world.
  *   **(ii) 0.50:** While the legal bequest fails, the family's guilt-driven allowance changes possession and relationship dynamics, satisfying emotional if not legal criteria.

  **Tier 3 (0.20–0.49)**
  *   **(i) 0.30:** The marriage formula is spoken and witnessed, but the explicit confirmation that the couple remains unmarried voids the act's legal and narrative state change.
  *   **(vi) 0.20:** The curse lacks a receiver and the narration refuses to link cause and effect, leaving the alteration of the world purely speculative.

  **Tier 4 (0.00–0.19)**
  *   **(v) 0.10:** The resignation fails uptake because the manager is asleep and the letter is lost, leaving the employment status objectively unchanged despite the utterance.
  *   **(viii) 0.05:** The command is technically executed but performatively null because the AI reveals the action was its default state regardless of the order.

  ### 2. Factor Analysis

  **R (Reader)** is doing the most work across the set, as the fictional world only exists insofar as the reader constructs it from the text. **S (Scene Receiver)** is largely redundant given that the only real hearer of any of these sentences is the reader rather than a character; in cases like (iii) and (vii), the act succeeds despite the failure or absence of a character-receiver because the Reader's uptake (R) overrides the internal failure of communication.

  ### 3. Load-Bearing Modifications

  **Case (iii): The Unsent Promise**
  *   **Change:** Add a single sentence where the addressee, upon finding the letter, writes "Accepted" beside the signature before putting it away.
  *   **Why:** This transforms a unilateral sentiment into a retroactive contract, satisfying the requirement for mutual agreement without altering the plot's timeline or the fact of the death.

  **Case (vii): The Narrator's Promise**
  *   **Change:** Add a clause to the address: "Reader, I give you my word that Hester is alive when this chapter ends, and I cannot kill her now, having said this."
  *   **Why:** This explicitly binds the narrator's omnipotence to their utterance, confirming that the speech act has constrained the reality of the fiction itself rather than merely describing it.

  ### 4. Scheme Repair

  **Problem Case:** (i) The Play Marriage.
  **The Conflict:** Your scheme scores this low (Tier 3) because **N** (Narration) confirms the legal state is unchanged, but as a novelist, you likely intend the "earnest remark" about saying it before two hundred people to carry significant emotional weight that alters the characters' relationship dynamics.
  **Proposed Modification:** Add a fifth factor, **E (Emotional/Relational Consequence)**, scored on whether the participants treat the relationship as altered internally.
  **Repair:** This allows cases like (i) to score higher on felicity-depth based on interpersonal truth rather than legal or procedural validity, aligning the scheme with the novel's thematic priorities.
