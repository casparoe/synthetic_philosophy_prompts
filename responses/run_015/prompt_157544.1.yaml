      *   *Dunkirk:* This is the tricky one. The user calls it a "survival myth that hides defeat behind deliverance." This is accurate (Operation Dynamo was an evacuation after a military collapse). The user claims it lacks martyrdom. *Critique:* Dunkirk *does* have sacrifice (the rear guard, the civilian boats), but the *narrative focus* is on rescue/resilience, not death as a virtue. The user's claim that it's less useful for *aggressive* nationalist mobilization is sound. Dunkirk is about "standing alone" and "surviving," not "dying for the land."
      *   *Kosovo:* The "Kosovo Myth" is central to Serbian nationalism. Prince Lazar chooses the "Earthly Kingdom" (victory) vs. "Heavenly Kingdom" (martyrdom). It justifies territorial claims (Kosovo is the "cradle") and involves heavy martyrdom.
