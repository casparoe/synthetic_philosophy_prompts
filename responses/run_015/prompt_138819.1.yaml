prompt: |-
  I am the scientific secretary and non-voting chair of the review panel for a national research council's mid-sized investigator grants. We run three cycles a year. Each cycle is two and a half days, twelve panelists, roughly seventy proposals, and about six million dollars; our ranked list then goes to a council that can and occasionally does send it back. The panelists are senior working researchers who are paid nothing, receive no training in judgement and decision making, and are rotated a third at a time, so I can assume neither continuity nor shared vocabulary, and I cannot add a training day or a second pass over the batch. What I can change is the procedure inside the room and the schedule going in, provided I can defend each change on a single page to a council of non-specialists and to panelists who will resent anything that feels like bureaucracy.

  Our current process, in the order it happens: two lead reviewers per proposal read it in full and send me written pre-scores forty-eight hours ahead; the other panelists receive the abstract and a one-page summary of the leads' comments. I open each item with a one-sentence characterisation of where I think it sits. Discussion then runs in a fixed seating order, after which scores are entered sequentially on a shared screen with the running mean visible, and any score diverging by more than 1.5 points from that mean must be accompanied by a typed justification. Proposals are scheduled grouped by host institution, so the panel frequently hears four or five from the same university in a row. One panelist each cycle participates asynchronously and posts written comments that the room reads before anyone speaks. There is no feedback loop: we learn what we got right years later, if at all.

  I would like a decision procedure, not an exposition of the theory. What I have in mind has three parts.

  First, a real-time diagnostic: an ordered set of questions I can run in about ninety seconds, using only what is observable in the room plus the pre-scores that only I hold, that sorts the current state of a proposal into at least these buckets — genuine convergence on shared evidence; an informational cascade; reputational or conformist herding; structurally mandated deference to the lead reviewers, who are the only people who have read the thing; and spillover from a neighbouring proposal or from the run of items from the same institution. For each question, state what observable would count as a sufficient positive, what that question cannot in principle distinguish from what it is meant to detect, where the procedure simply stops with "no intervention", and where it must hand the decision back to a person because the issue is one of values rather than facts.

  Second, a remedial ladder: an ordered menu of interventions from least to most intrusive, each attached to the diagnosis that triggers it, with what it costs in minutes, in goodwill, and in information. The standard literature distinguishes herding that comes from people rationally discounting their own private signals against a public record from herding that comes from the social cost of being seen to be wrong; keep that distinction wherever it changes what I should actually do, and say explicitly where the remedies for the two pull in opposite directions, which one governs when both diagnoses are live, and why.

  Third, the ex ante fixes: what I should change before the next cycle, and in what order of priority, given a one-page justification budget and a panel that will not tolerate extra form-filling. Please rule specifically on the deviation-and-justification rule, on speaking order, on whether and when I should speak at all, on the institutional grouping in the schedule, and on the asynchronous panelist whose comments are read first and cannot be cross-examined.

  Then please run the procedure on three cases. Case A: the first speaker, a well-known and well-liked figure, gives a proposal a nine and a confident rationale; the next five come in between eight and nine with reasons that are recognisably paraphrases of his; the two lead reviewers' private pre-scores, which I alone hold, were six and four. Tell me what I do in the next five minutes, and in particular whether and how I use the pre-scores. Case B: a proposal that everyone has in fact read, in an area where this particular panel is unusually expert, and which is genuinely in the top decile of the batch — the false-positive control, where I need the procedure to output "leave it alone" and to tell me which observable does that work. Case C: an unfashionable cross-disciplinary proposal from an early-career investigator at an institution nobody has heard of, scheduled immediately after a run of five strong proposals from our flagship university, which the panel is drifting toward rejecting in a way that looks to me like nobody wanting to be the person who championed a soft topic. I think it is good and my instinct is to rescue it. I want the procedure's answer, and I want you to take seriously that the honest answer may be that I should not intervene, or should intervene only through a mechanism that binds me equally when I am wrong: tell me what a discretionary rescue by the chair teaches the panel about how to read my interventions, and what that does to the process over the remaining day and a half.

  Finally, tell me what the procedure cannot do. I am aware that we have no ground truth within a cycle, that a correct convergence and a lucky cascade are indistinguishable from the outcome of one meeting, and that nothing in this fixes errors that the whole panel shares because the whole field shares them. Say where the procedure will misfire, which of its steps are judgement calls dressed up as procedure, and which parameter — I suspect something like our tolerance for funding risky proposals at the expense of safe ones — is a value choice that the procedure should surface and then leave to the council rather than settle for them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Scientific Secretary and Non-Voting Chair of a review panel (National Research Council).
      *   **Context:** Mid-sized investigator grants, 3 cycles/year, 2.5 days/cycle, 12 panelists (senior researchers, unpaid, untrained, rotating), ~70 proposals, ~$6M. Council can reject ranked list.
      *   **Constraints:** No training days, no second pass, one-page justification for changes, panel resents bureaucracy.
      *   **Current Process:** 2 lead reviewers (pre-scores 48h ahead), others get abstract + summary. Chair opens with 1-sentence characterization. Fixed seating order discussion. Sequential scoring with running mean visible. >1.5 deviation requires typed justification. Grouped by institution. 1 asynchronous panelist (comments read first). No feedback loop.
      *   **Goal:** A decision procedure (not theory) with three parts:
          1.  Real-time diagnostic (90 seconds, observable + pre-scores).
          2.  Remedial ladder (interventions ranked by intrusiveness/cost).
          3.  Ex ante fixes (schedule/procedure changes before next cycle).
      *   **Case Studies:** Run the procedure on Case A (Herding/Lead Reviewer Disconnect), Case B (Genuine Consensus/False Positive Control), Case C (Contextual Bias/Chair Rescue).
      *   **Limitations:** Acknowledge what the procedure *cannot* do (ground truth, shared field errors, value judgments).

  2.  **Deconstruct the Problems in the Current Process:**

      *   *Information Asymmetry:* Only leads read the full proposal. Others rely on summaries. This creates structural deference.
      *   *Anchoring:* Chair's opening sentence + First speaker + Running Mean + Asynchronous comments all act as anchors.
      *   *Herding/Cascades:* Fixed seating order + visible running mean encourages conformity.
      *   *Context Effects:* Grouping by institution creates contrast effects or fatigue.
      *   *Accountability:* Deviation justification exists but might be performative.
      *   *Chair Role:* Non-voting but influential. "Rescuing" proposals sets a precedent.

  3.  **Drafting Part 1: Real-Time Diagnostic (The "90-Second Triage"):**

      *   Need specific questions based on observables (speech patterns, score distribution, timing) and the Chair's private data (lead pre-scores).
      *   *Buckets:* Convergence, Informational Cascade, Reputational Herding, Structural Deference, Spillover/Contrast.
      *   *Questions:*
          1.  Variance vs. Mean (Are scores clustering too tight given the lead scores?)
          2.  Argument Independence (Are reasons paraphrased?)
          3.  Lead Score Delta (Do public scores match private lead scores?)
          4.  Sequencing Effect (Did the score drop/rise after a specific speaker/institution?)
          5.  Silence Check (Who hasn't spoken?)
      *   *Constraints:* Must distinguish fact from value. Must know when to stop.

  4.  **Drafting Part 2: Remedial Ladder (Interventions):**

      *   Need a gradient from subtle to drastic.
      *   *Levels:*
          1.  Procedural Pause (Time out).
          2.  Solicit Dissent (Specifically ask for counter-arguments).
          3.  Blind Re-score (Hide mean, re-vote).
          4.  Lead Reviewer Challenge (Ask leads to defend low scores if public is high, or vice versa).
          5.  Chair Intervention (Rare, high cost).
      *   *Herding Types:* Informational (I think they know something I don't) vs. Reputational (I don't want to look stupid).
          *   *Info Herding:* Fix by revealing private info (leads).
          *   *Rep Herding:* Fix by anonymizing or protecting dissent.
      *   *Conflict:* If both are present, prioritize Informational (truth-seeking) but mitigate Reputational (psychological safety).

  5.  **Drafting Part 3: Ex Ante Fixes (Pre-Cycle Changes):**

      *   *Constraint:* One-page justification, no extra form-filling.
      *   *Deviation Rule:* Keep it, but change *when* it happens (before seeing mean).
      *   *Speaking Order:* Randomize or reverse seniority. Fixed order is bad.
      *   *Chair Speech:* Remove the opening characterization. It anchors.
      *   *Institutional Grouping:* Stop it. Randomize or mix.
      *   *Asynchronous Panelist:* Integrate them live or delay their comments until after discussion. Reading them first anchors the room.

  6.  **Developing the Case Studies:**

      *   *Case A (The Cascade):* Lead scores (6, 4) vs. Room (9, 8, 8...). First speaker anchored.
          *   *Diagnosis:* Informational Cascade + Structural Deference.
          *   *Action:* Interrupt. Reveal lead scores (anonymized or not?). Best: Ask leads to speak *now* before more scoring.
      *   *Case B (The Control):* Top decile, panel expert, everyone read it.
          *   *Diagnosis:* Genuine Convergence.
          *   *Observable:* High variance in *reasoning* but low variance in *score*. Independent validation.
          *   *Action:* No intervention.
      *   *Case C (The Rescue):* Unfashionable, post-flagship run, early career.
          *   *Diagnosis:* Contrast Effect + Reputational Herding (fear of championing "soft" topic).
          *   *Action:* Do *not* rescue personally. Use procedure. Reset the context. Ask for criteria-based assessment independent of previous items.
          *   *Risk:* Chair rescue teaches panel to wait for Chair to save "pet" projects, undermining ownership.

  7.  **Addressing Limitations:**

      *   No ground truth.
      *   Shared field bias (cannot fix).
      *   Value judgments (risk vs. safety) belong to Council, not procedure.
      *   Procedure creates process validity, not necessarily outcome validity.

  8.  **Refining and Polishing:**

      *   *Tone:* Professional, direct, bureaucratic but efficient (matching the user's voice).
      *   *Format:* Structured clearly as requested (Diagnostic, Ladder, Ex Ante, Cases, Limitations).
      *   *Constraint Check:* Ensure the "one-page justification" constraint is respected in the Ex Ante section (i.e., arguments provided must be concise).
      *   *Specifics:* Ensure the distinction between Informational and Reputational herding is clear in the Ladder.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the 90-second diagnostic realistic?
      *   *Fix:* Make the questions binary or quick checks. Rely on the Chair's mental dashboard.
      *   *Critique:* Is revealing lead scores in Case A allowed?
      *   *Fix:* The prompt says pre-scores are sent to the Chair 48h ahead. Usually, these are confidential until discussion. However, the Chair *holds* them. The intervention can be "Ask the Lead Reviewers to summarize their score *now* before further discussion." This respects the process while correcting the information asymmetry.
      *   *Critique:* The asynchronous panelist issue.
      *   *Fix:* If they can't be live, their comments should be treated as a "Lead Review" equivalent, not an opening statement.
      *   *Critique:* Chair intervention in Case C.
      *   *Fix:* Emphasize the danger. The procedure must bind the Chair too.

  10. **Final Polish:** Check against the "single page justification" constraint for the Ex Ante section. I need to provide the *content* of that justification essentially.

  *(Self-Correction on Case A)*: The prompt says pre-scores are sent to the Chair. It implies the room *doesn't* know them until scoring. In Case A, the room is scoring 8-9, leads said 4-6. This is a massive discrepancy. The Chair *must* act. The intervention should be to pause scoring and ask the Lead Reviewers to speak *before* the rest of the panel locks in scores.

  *(Self-Correction on Case C)*: The user asks about "discretionary rescue." I need to be hard-nosed here. If the Chair rescues, it breaks the game. The procedure should offer a way to evaluate the proposal on its own merits without the Chair appearing to champion it. E.g., "Reset the context" instruction.

  *(Final check on Limitations)*: Ensure I explicitly mention that the procedure cannot fix "shared field errors" (e.g., everyone thinks qualitative work is soft).

  Let's assemble the response.cw
answer: |-
  ### Part 1: Real-Time Diagnostic (The 90-Second Triage)

  **Objective:** Classify the current proposal state using observable room dynamics and your private hold of the Lead Reviewers' pre-scores ($S_{L1}, S_{L2}$).

  **Q1: The Variance Check**
  *   **Question:** Is the standard deviation of the *spoken* sentiments lower than the standard deviation of the *private lead scores*?
  *   **Observable Positive:** Leads scored 4 and 6 (SD=1.4); Room speakers are all saying "8 or 9" (SD≈0.5).
  *   **Detects:** Informational Cascade (room ignoring private signals) or Structural Deference (room deferring to first speaker, not leads).
  *   **Cannot Distinguish:** Whether the room is right and leads are wrong.
  *   **Stop Condition:** If Room SD ≥ Lead SD, **No Intervention**.

  **Q2: The Paraphrase Test**
  *   **Question:** Are the second through fourth speakers using vocabulary or specific metaphors introduced by the first speaker?
  *   **Observable Positive:** Speaker 2 uses a unique phrase coined by Speaker 1; Speaker 3 references Speaker 1's point rather than the text.
  *   **Detects:** Reputational Herding (social cost of dissent).
  *   **Cannot Distinguish:** Genuine agreement from fear of conflict.
  *   **Stop Condition:** If arguments are independent (citing different sections of proposal), **No Intervention**.

  **Q3: The Lead Delta**
  *   **Question:** Is the running mean > 2 points higher than the mean of ($S_{L1}, S_{L2}$)?
  *   **Observable Positive:** Lead Mean = 5.0; Running Mean = 8.5.
  *   **Detects:** Structural Deference to the *First Speaker* (who is not a lead) or Institutional Bias.
  *   **Cannot Distinguish:** Whether the leads missed a breakthrough element visible to the room.
  *   **Handoff:** If Delta > 2, this is a **Fact Dispute** (someone hasn't read the same document). Hand to Lead Reviewers.

  **Q4: The Context Drag**
  *   **Question:** Did the score drop/rise immediately following a proposal from a different institution type (e.g., Flagship vs. Unknown)?
  *   **Observable Positive:** Proposal X (Flagship) scored 9. Proposal Y (Unknown) scored 6, with comments comparing it to X.
  *   **Detects:** Contrast Effect / Spillover.
  *   **Cannot Distinguish:** Genuine quality difference from institutional prestige bias.
  *   **Handoff:** This is a **Value/Context Issue**. Requires procedural reset, not factual correction.

  **Q5: The Silence Map**
  *   **Question:** Have the two most junior panelists (or those from non-flagship institutions) spoken?
  *   **Observable Positive:** Only senior/flagship members have contributed to the consensus.
  *   **Detects:** Reputational Herding (status bias).
  *   **Cannot Distinguish:** Lack of expertise from lack of confidence.
  *   **Handoff:** If silent members are domain experts, this is a **Fact Gap**. If not, it is a **Process Gap**.

  ---

  ### Part 2: Remedial Ladder

  **Principle:** Interventions must increase in intrusiveness. Distinguish **Informational Herding** (I think they know something I don't) from **Reputational Herding** (I don't want to look wrong).

  | Level | Intervention | Trigger Diagnosis | Cost (Min) | Cost (Goodwill) | Information Gain |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Pause:** "Let's take 30 seconds to review the abstract again before scoring." | Q1 (Variance Check) | 1 | Low | Resets working memory; breaks momentum. |
  | **2** | **The Inversion:** "I'd like to hear from those who haven't spoken yet, specifically on [Specific Aim 2]." | Q2 (Paraphrase) / Q5 (Silence) | 2 | Low-Med | Surfaces private signals held by non-herders. |
  | **3** | **The Blind Vote:** "Please enter scores now. I will hide the running mean until discussion closes." | Q1 (Variance) / Q2 (Paraphrase) | 3 | Med | Removes public anchor; isolates private signals. |
  | **4** | **The Lead Recall:** "The Lead Reviewers have not yet summarized their scores. Please do so now." | Q3 (Lead Delta) | 5 | Med-High | **Crucial:** Corrects Informational Herding by revealing the most informed private signals. |
  | **5** | **The Context Reset:** "We are moving to a new cluster. Please evaluate this solely against the call criteria, not the previous item." | Q4 (Context Drag) | 2 | Low | Mitigates contrast effects. |

  **Conflict Resolution: Informational vs. Reputational Herding**
  *   **Opposite Remedies:** Informational herding is cured by *more* public information (Lead Recall). Reputational herding is cured by *less* public pressure (Blind Vote).
  *   **Governance:** If both are live (e.g., room is herding on a wrong fact *and* afraid to dissent), **Informational takes precedence.**
  *   **Why:** A panel that is socially comfortable but factually wrong funds bad science. A panel that is socially tense but factually aligned funds good science. Use **Level 4 (Lead Recall)** to fix the facts, then **Level 3 (Blind Vote)** to allow safe dissent on the corrected facts.

  ---

  ### Part 3: Ex Ante Fixes (Pre-Cycle Changes)

  **Justification Strategy:** Frame changes as "efficiency and risk mitigation" to the Council, and "reducing cognitive load" to the Panel.

  1.  **Speaking Order (Priority: High)**
      *   **Change:** Abolish fixed seating order. Use a randomized list or "Junior-to-Senior" order for the first three speakers.
      *   **Justification:** "Fixed ordering creates anchoring bias that reduces the independence of our 12 expert judgments. Randomization maximizes the signal-to-noise ratio of the discussion without adding time."
  2.  **Institutional Grouping (Priority: High)**
      *   **Change:** Randomize proposal order. Do not group by host institution.
      *   **Justification:** "Sequential evaluation of similar institutions creates contrast effects that penalize diversity. Randomization ensures each proposal is judged on absolute merit, reducing legal/reputational risk to the Council."
  3.  **Chair Opening (Priority: Medium)**
      *   **Change:** Chair makes *no* opening characterization.
      *   **Justification:** "The Chair's opening sentence acts as an unchallengeable anchor. Removing it ensures the Lead Reviewers remain the primary technical anchors, preserving the division of labor."
  4.  **Deviation-and-Justification Rule (Priority: Low)**
      *   **Change:** Keep the rule, but require justification *before* the running mean is revealed.
      *   **Justification:** "Justifications written after seeing the mean are often post-hoc rationalizations for conformity. Writing them before ensures the justification reflects genuine judgment."
  5.  **Asynchronous Panelist (Priority: Medium)**
      *   **Change:** Their comments are distributed with the lead summaries but are **not read aloud** as an opening. They are treated as a third lead review.
      *   **Justification:** "Reading written comments aloud privileges text over live expertise. Treating them as a static review ensures their input is weighed equally with live discussion, not as an opening directive."

  ---

  ### Part 4: Case Runs

  **Case A: The Cascade (Lead Scores 6/4, Room 9/8/8...)**
  *   **Diagnosis:** Q1 (Variance) and Q3 (Lead Delta) are positive. This is **Structural Deference** to the First Speaker, overriding the actual Lead Reviewers.
  *   **Action (Next 5 Minutes):**
      1.  **Stop the scoring.** Do not let the remaining 7 panelists lock in 8s or 9s.
      2.  **Intervention:** Level 4 (Lead Recall). "We have a significant divergence between the running sentiment and the Lead Reviewers' pre-scores. Before we proceed, I need Lead Reviewer 1 and 2 to briefly walk us through the specific weaknesses that drove their scores."
      3.  **Use of Pre-Scores:** You do *not* reveal the numbers yourself (that undermines the leads). You reveal the *existence* of the divergence. This forces the room to process the negative information they missed.
      4.  **Outcome:** The room will likely drop scores. If they don't, the Leads must explain why the room is wrong. This restores the information hierarchy.

  **Case B: The False-Positive Control (Top Decile, Panel Expert)**
  *   **Diagnosis:** Q1 (Variance) is negative (Room and Leads agree). Q2 (Paraphrase) is negative (Experts cite different evidence for same conclusion).
  *   **Observable:** High agreement on score, *high variance in reasoning*. (e.g., "I like the method" vs "I like the team" vs "I like the impact").
  *   **Action:** **Leave it alone.**
  *   **Why:** Independent validation has occurred. Different experts found different paths to the same high score. This is the definition of robust consensus. Intervention here wastes time and signals distrust.

  **Case C: The Rescue (Unfashionable, Post-Flagship Run)**
  *   **Diagnosis:** Q4 (Context Drag) and Q5 (Silence). Reputational Herding (fear of championing "soft" work).
  *   **Action:** **Do Not Rescue Personally.**
      *   **Risk:** If you champion it, you teach the panel that "Chair's Pets" get saved. They will stop engaging with difficult proposals, waiting for you to signal which ones matter. You become the single point of failure.
      *   **Procedure:** Use Level 5 (Context Reset). "We have just reviewed a cluster of large-scale projects. This proposal operates on a different scale. Please evaluate it against Criterion B (Innovation), not Criterion A (Scale)."
      *   **Binding Mechanism:** Apply this reset rule to *every* proposal that follows a run of five from the same institution type. This binds you equally when you are wrong (i.e., if the next proposal is actually bad).
      *   **Lesson:** You are protecting the *process*, not the *proposal*. If it fails after a fair reset, it fails. If it succeeds, it succeeded on merit, not chair intervention.

  ---

  ### Part 5: Limitations and Failure Modes

  **What This Procedure Cannot Do:**

  1.  **No Ground Truth:** The procedure cannot distinguish a "Correct Convergence" from a "Lucky Cascade" within the cycle. If the whole panel is wrong about the science, the procedure validates their error efficiently.
  2.  **Shared Field Bias:** It cannot fix errors the whole field shares (e.g., systemic bias against qualitative methods or specific demographics). It optimizes for *internal* consistency, not *external* validity.
  3.  **Value Judgments:** The tolerance for risk (funding one 9 vs. three 7s) is a value choice.
      *   **Surface, Don't Set:** The procedure should output a "Risk Flag" (e.g., "High consensus on low-risk proposal") but the Council must decide the portfolio balance.
  4.  **Judgement Calls Dressed as Procedure:**
      *   **The "Delta" Threshold:** Deciding that a 2-point difference warrants intervention is arbitrary. It is a judgement call codified to ensure consistency.
      *   **The "Silence" Map:** Deciding who is "junior" or "silent due to status" is your subjective read of the room.
  5.  **The Chair's Paradox:** By implementing this, you become the enforcer of rationality. If you fail to spot a cascade (Case A), the procedure offers no backup. You are the single point of failure for the diagnostic itself.

  **Final Note to Council:**
  "This procedure does not guarantee better science. It guarantees that the funding decisions are the result of independent judgments aggregated fairly, rather than social dynamics aggregated efficiently. It minimizes the risk that we fund a proposal because of *who* spoke first, rather than *what* was proposed."
