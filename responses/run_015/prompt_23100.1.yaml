      *   **Goal:** Draft 8-10 questions.
      *   **Constraints:**
          *   Go beyond restating the view.
          *   Must include at least one question on:
              *   One-versus-many asymmetry.
              *   Luck/Proximity (randomness vs. moral justification).
              *   Special Obligations (the 'one' is someone the agent owes duty to).
          *   For *each* of those three specific topics, include a follow-up question keyed to the answer she's *most likely* to give (based on Taurekian philosophy).
      *   **Tone:** Intellectual, engaging, suitable for a novelist/podcaster audience (not just dry academic grilling).

  2.  **Deconstruct the Guest's Position (Taurek/Numbers Don't Count):**
      *   *Core Claim:* There is no moral requirement to save the greater number. Saving five isn't morally better than saving one, *ceteris paribus*.
      *   *Key Argument:* Separateness of Persons. You can't aggregate losses across different people. Loss to A + Loss to B $\neq$ Greater Loss than Loss to C. Each person suffers their own loss fully.
      *   *Decision Procedure:* Usually suggests flipping a coin to give each individual an equal *chance* of being saved, rather than maximizing survival rates.
      *   *Common Criticisms:* It seems counterintuitive in large numbers (1 vs. 1,000,000), it makes saving people arbitrary (luck), it ignores special duties (save your own child).

  3.  **Brainstorming Categories/Themes:**
      *   *The Core Intuition:* Why does aggregation feel wrong to you?
      *   *The Asymmetry:* Is there *any* point where numbers matter? (The "Sorites" problem).
      *   *Randomness/Luck:* Is a coin flip really moral? What about proximity?
      *   *Special Obligations:* Parents, doctors, promises.
      *   *The Agent's Perspective:* Guilt, regret, psychological burden (relevant to the novelist's triage doctor).
      *   *Policy vs. Individual:* Does this work for law/government even if it works for individuals?
      *   *The "Loss" Concept:* What exactly is being lost? Future potential?
      *   *Critique of Utilitarianism:* Is the alternative just Utilitarianism, or something else?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: One-versus-many asymmetry.*
          *   *Draft:* When does the number get big enough to matter?
          *   *Refinement:* Taurek usually says *never* strictly speaking, but admits practical shifts. Let's push on the "cliff edge."
          *   *Follow-up:* She will likely say "No threshold, but maybe practical heuristics." I need to challenge the heuristic.
      *   *Requirement 2: Luck/Proximity.*
          *   *Draft:* Isn't saving the closest person just luck?
          *   *Refinement:* Focus on the coin flip. If we flip a coin, aren't we valuing fairness over survival?
          *   *Follow-up:* She will likely say "Equal concern/respect requires equal chance." I need to ask about the *cost* of that respect.
      *   *Requirement 3: Special Obligations.*
          *   *Draft:* What if the one is your daughter?
          *   *Refinement:* Connect it to the triage doctor. Does professional duty change the math?
          *   *Follow-up:* She will likely distinguish "personal" vs. "impartial" morality. I need to ask if that distinction holds in institutional settings.
      *   *Additional Questions (to reach 8-10):*
          *   *Psychological Burden:* (Good for a novelist). How does the agent live with the choice?
          *   *Policy:* Can hospitals run this way?
          *   *The Nature of Loss:* Is death the same loss for everyone?
          *   *Aggregation in other contexts:* We aggregate costs in economics/safety. Why not lives?
          *   *The "Rescue" Intuition:* Why do we feel pulled to save the many?
          *   *Regret:* Is it rational to regret saving the one?

  5.  **Developing the Follow-ups (Crucial Step):**
      *   *Asymmetry Follow-up:* If she says "No threshold," ask about the *absurdity* of 1 vs. 1 billion. If she says "Heuristics," ask if heuristics just hide the moral truth.
      *   *Luck Follow-up:* If she says "Coin flip shows equal respect," ask if "respect" is the only currency that matters when lives are at stake.
      *   *Special Obligation Follow-up:* If she says "Personal duties are different," ask if institutional roles (like doctors) erase that personal space.

  6.  **Refining and Polishing:**
