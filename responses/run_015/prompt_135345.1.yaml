      *   Three specific questions addressed? Yes.
      *   Replacement suggested? Yes.
      *   Scaffolded tier added? Yes.

  10. (Final thought on the "Scaffolded Tier"): Dennett's Gregorian is already about tools from conspecifics. The user asks about "scaffolded by other agents' models." This implies *real-time* coupling or *theory of mind* integration, not just inheriting a hammer. This is closer to *Joint Intentionality* (Tomasello) or *Interactive Brain* hypotheses. I should label this carefully.

