      *   **Core Dispute:** Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA) in anthropic reasoning.
      *   **Specific Arguments:**
          *   Alice (SIA): Existence is evidence for more observers (weights big world by $10^{10}$).
