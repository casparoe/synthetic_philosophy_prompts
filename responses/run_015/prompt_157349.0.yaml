      Alice claims the update comes from the *prior*, not existence. If she sets $P(W) \propto N$ initially, she has hard-coded SIA into the prior. She hasn't "escaped" the presumptuousness; she's just hidden it in the prior. Bob is definitely right here.

      *Refining the Reference Class point:* Does nesting blur SSA/SIA?
      SSA: $P(W|Ref) \propto P(Ref|W)P(W)$. $P(Ref|W) = N_{Ref}(W) / N_{Total}(W)$? No, SSA says $P(You|W) = 1/N_{Ref}(W)$.
