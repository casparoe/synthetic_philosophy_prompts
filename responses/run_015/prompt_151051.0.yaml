answer: |-
  This is a superb question. It cuts right through the pedagogical simplification often found in introductory relativity courses and lands squarely on the tension between the *formalism* of General Relativity (GR) and the *ontology* physicists implicitly adopt when doing their work.

  You are right to sense a disconnect. The Rietdijk–Putnam argument relies on the structure of Minkowski spacetime (Special Relativity), where the geometry is flat and empty of matter. Cosmology, however, takes place in a Friedmann–Lemaître–Robertson–Walker (FLRW) spacetime, which is curved and filled with a specific distribution of matter and radiation. That matter distribution does work that the vacuum of Special Relativity cannot do.

  Here is a reconstruction of the implicit view held by practicing cosmologists, separating what their practice *requires* from what it *tolerates*, followed by your specific hypotheticals.

  ### 1. The Implicit View: "Physical Gauge Fixing"

  To answer your central trilemma: It is not Neo-Lorentzianism, it is not hard Operationalism, and it is not *mere* pragmatic convention like UTC.

  The practice presupposes **Eternalism (the Block Universe) combined with a Physically Motivated Foliation.**

  Here is the distinction you asked for regarding gauge fixing vs. physical claim:
  *   **Strict Requirement:** The theory (GR) requires general covariance. Any coordinate system is valid. Therefore, strictly speaking, cosmic time $t$ is a coordinate choice. There is no law of physics that *forbids* you from using a different slicing. In this sense, it is a gauge choice.
  *   **Physical Claim:** However, the *solution* (our universe) possesses a high degree of symmetry. The matter distribution (specifically the CMB) defines a unique congruence of worldlines (the "comoving" observers) for whom the universe looks isotropic. Choosing the hypersurfaces orthogonal to these worldlines is not arbitrary in the way choosing UTC is. It diagonalizes the stress-energy tensor. It simplifies the equations of state.

  So, is the foliation "real"?
  *   **Metaphysically:** No. The physics does not depend on it being the *only* real slice. A physicist moving at $0.99c$ relative to the Hubble flow can do cosmology; their equations will just have extra cross-terms.
  *   **Physically:** Yes, in the sense that it tracks the causal history of the matter content.

  **The Verdict:** Cosmologists are effectively **Eternalists who treat Cosmic Time as a "privileged coordinate" due to contingent facts about matter distribution, not due to the structure of spacetime itself.** They are not smuggling in a Newtonian absolute present; they are identifying a "rest frame of the universe" defined by its contents. This sits comfortably with Eternalism because in a Block Universe, all slices exist, but some slices are more *useful* for describing the contents of the block.

  It is **not Neo-Lorentzian** because Lorentz believed the preferred frame was undetectable (hidden by dynamical contraction). In cosmology, the preferred frame is *empirically detectable* (via the CMB dipole). We know we are moving relative to it. A Neo-Lorentzian view would claim that only the CMB frame is *ontologically* present. Cosmologists do not act as if the future of a comoving galaxy is "unreal" just because a fast-moving passerby slices it differently.

  ### 2. Geochemistry vs. Cosmology: Proper Time vs. Coordinate Time

  You asked if your old practice is different in kind. **Yes, fundamentally.**

  *   **Isotope Geochemistry:** You measured **proper time** ($\tau$). This is the integral of $ds$ along the zircon's worldline between crystallization and measurement. This is an invariant scalar. It does not require a definition of simultaneity. It does not require a global "now." It is safe under Presentism, Eternalism, or Neo-Lorentzianism. You were comparing two events on the *same* worldline (or worldlines that were effectively co-located during the measurement).
  *   **Cosmology:** When a cosmologist says "The universe is 13.8 billion years old," they are not measuring the proper time of a single clock. They are asserting that the proper time elapsed along *any* comoving worldline since the Big Bang singularity is 13.8 billion years. This requires **synchronization**. It requires asserting that "now" on a galaxy 10 billion light-years away corresponds to $t=13.8$ Gyr here.

  Your practice was robust against the Rietdijk–Putnam argument because it didn't rely on distant simultaneity. Cosmology *does* rely on distant simultaneity. The fact that cosmologists can do this without contradiction is not because simultaneity is absolute, but because our universe is sufficiently homogeneous and isotropic to allow a *conventional* synchronization that all comoving observers agree upon.

  ### 3. The Gödel Hypothetical: Discovery vs. Posit

  Suppose we lived in a Gödel universe (rotating matter, closed timelike curves, no global Cauchy surfaces).

  *   **Would they stop quoting an age?** Yes. In a Gödel universe, you cannot define a global time function that increases monotonically along every worldline. You cannot slice the spacetime into spacelike hypersurfaces that cover the whole manifold.
  *   **What would they report?** They would report local proper times, or topological invariants, or perhaps the rotation rate of the matter field.
  *   **What does this tell us?** This demonstrates that Cosmic Time is a **discovery about our universe**, not a metaphysical posit. It is a contingent feature of the FLRW solution, not a necessary feature of GR.

  If cosmologists treat Cosmic Time as a fundamental metaphysical reality, they would be forced to invent ad-hoc explanations for why the Gödel universe "lacks time." But they don't. They accept that some spacetimes have a global time and some don't. This confirms that their use of "13.8 billion years" is an acknowledgment of the specific symmetry of our local block, not a claim about the nature of Time itself.

  ### 4. The "Now" and Rietdijk–Putnam: What would change?

  If cosmologists took the Rietdijk–Putnam argument (and the resulting Block Universe ontology) completely seriously in their *rhetoric* (not their math, which is already consistent), how would their writing change?

  Currently, a textbook might say:
  > "At the present time, the universe is expanding..."

  If they were rigorously explicit about the indexical nature of "now" within a Block Universe, a paper would read more like this:
  > "On the hypersurface of simultaneity defined by the comoving frame, at the coordinate time $t_0$ corresponding to the proper time of observers in the Local Group, the scale factor is $a(t_0) = 1$. Events on this hypersurface are causally disconnected from events at $t > t_0$."

  **What exactly are you doing when you say "13.8 billion years old now"?**
  In the Block Universe view, you are making a **self-locating statement**.
  *   **The Block:** Contains the Big Bang surface and the entire future history.
  *   **The Statement:** "The proper time elapsed along the comoving congruence between the initial singularity surface and the spacelike hypersurface containing this utterance is 13.8 billion years."

  The word "now" functions exactly like "here." "I am here" doesn't mean other places aren't real; it means my consciousness is located at this coordinate. "The universe is 13.8 Gyr old now" doesn't mean the future isn't real; it means my consciousness is located on the $t=13.8$ slice.

  **Why don't physicists behave like they believe it?**
  Because for the purpose of calculating nucleosynthesis or structure formation, the ontology doesn't matter. The math of the FLRW metric works equally well if you believe only the present slice exists (Presentism) or if all slices exist (Eternalism).
  *   **Presentist Cosmologist:** "The future slices don't exist yet, but the equations tell me what *will* exist."
  *   **Eternalist Cosmologist:** "The future slices exist, and the equations describe their geometry relative to mine."

  The predictions are identical. However, the Rietdijk–Putnam argument suggests Presentism is incompatible with Relativity. The reason physicists don't act like Eternalists is largely sociological: **Eternalism is existentially unsettling.** It implies the future is fixed (in the block sense). Most physicists adopt an "shut up and calculate" Operationalism to avoid the metaphysical headache. They use the Cosmic Time because it works, and they don't interrogate whether that time is "real" because the question doesn't change the cross-section of the CMB power spectrum.

  ### Summary Reconstruction

  The package of practices presupposes:
  1.  **Ontology:** A Block Universe (Eternalism). The past and future events are as real as the present, otherwise, the coordinate transformations of GR lose their physical equivalence.
  2.  **Foliation:** A **Physically Preferred but Not Metaphysically Absolute** slicing. The matter distribution breaks the symmetry of the spacetime, allowing a "natural" coordinate system (Cosmic Time) that acts *like* absolute time for comoving observers, but remains a coordinate choice within a covariant theory.
  3.  **Language:** "Now" is treated as an indexical referring to the speaker's location on the comoving hypersurface.

  **Is it Gauge Fixing or Physical Claim?**
  It is **Gauge Fixing motivated by Physical Symmetry.**
  *   It is *Gauge Fixing* because the theory allows other choices.
  *   It is *Physical* because the choice is dictated by the stress-energy tensor (the matter), not by the mathematician's whim.

  **The Geochemist's Peace of Mind:**
  Your zircon dating was measuring an invariant interval (proper time). It did not rely on the "reality" of the future or the "simultaneity" of distant events. You were safe. The cosmologists are the ones walking the tightrope, relying on the happy accident that our universe is smooth enough to allow a global clock. If the universe were more chaotic (like Gödel's), their "13.8 billion years" would dissolve into a multitude of local proper times, and they would be forced to admit that "The Age of the Universe" is a property of our specific cosmic history, not a measure of Time itself.
