      *   **Key Question:** Does the appeal to "delicacy of taste" smuggle in non-aesthetic criteria (like intent/history)?
      *   **Implication:** Does Hume's standard collapse for art forms where technical failure and intentional design are indistinguishable?
      *   **Tone:** Philosophical, analytical, concrete, rigorous.

  2.  **Deconstruct Hume's Argument (Briefly):**
      *   Hume acknowledges sentiment is subjective ("Beauty is no quality in things themselves").
      *   However, he argues there *is* a standard of taste based on the joint verdict of "true judges."
      *   Characteristics of a true judge: Delicacy of taste, practice, comparison, freedom from prejudice, good sense.
      *   The goal: To reconcile the diversity of taste with the existence of normative aesthetic judgments.

