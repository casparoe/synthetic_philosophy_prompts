      *   **The Case Study:** Define "The Twin Pixels Paradox." Image A (Corruption) vs. Image B (Glitch Art).
      *   **Hume's Mechanism:** Explain how the "True Judge" is supposed to work (Delicacy + Practice).
      *   **The Snag (The Circularity):**
          1.  *Sensory Indiscernibility:* If taste is based on sentiment arising from perception, identical perceptions should yield identical sentiments.
          2.  *The Correction:* Experts say B is valuable, A is not.
          3.  *The Justification:* They cite "intent" or "context."
