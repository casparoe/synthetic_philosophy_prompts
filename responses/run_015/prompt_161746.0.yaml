prompt: |-
  I write a weekly column for a science-and-ideas magazine, about 800 words, pitched Monday and filed Wednesday, and an editor who is very smart but not a philosopher has to sign off on the headline. I recieve maybe one paper a month from the cross-cultural "experimental philosophy" literature — give people a vignette in two or more countries and see whether they answer differently: Gettier cases, the chairman-and-the-environment style of case, trolley stuff. These pieces always do numbers and always get over-read. I publish "people in X answer differently" and by the end of the week it's being passed around as "culture determines whether you think Y." I want to stop guessing at this.

  So: give me a procedure I can run in about half an hour, on a PDF before my Monday pitch meeting, to decide (a) whether there is a story, (b) how strong a claim I'm allowed to make in the headline and lede, and (c) when I have to kill it. Ordered questions; what counts as a sufficient answer to each; where the procedure stops with a no; and — importantly — where it has to hand the decision to a person because it's not a factual question at all, e.g. how much risk of over-reading is worth a good story.

  The hard cases it has to handle, because these are the ways I've been burned: the paper says "Brazilians vs Japanese" but it tested undergraduates in two cities; the load-bearing word ("knows," "intentionally," "responsible") may not map cleanly onto the other language, and I get one email to the corresponding author with 24 hours to reply; the samples differ in years of education and in how willing they are to use the top of the scale; the effect is significant but tiny, or it's a shift in the middle of the distribution rather than a flip in which answer is modal; it's a null result being pitched as a failed replication; and the difference might be about the pragmatics of the vignette — what the subject thinks the experimenter is getting at — rather than about the concept at all. Also: my readers want to know whether any of this changes a philosophical conclusion, and there's that standing objection that folk intuitions from undergraduates were never evidence for anything in the first place. The procedure should tell me when that objection kills the story and when it's simply irrelevant to the only claim I'm making.

  I'd like an explicit claim-strength ladder: for each grade of evidence, the strongest sentance I'm allowed to write, down to "we can't say culture at all, only these two samples." Plus a rule that every such piece carries one sentence saying what would have to be true for this not to be a cultural difference.

  Then run it on three. (1) Around 150 students each in Toronto and Seoul on a Knobe-style intentionality case: the asymmetry shows up in both samples, but one sample is much less willing to say "intentionally" across the board, including for the good side effect. (2) A Gettier-vignette study in Nanjing and Edinburgh finding no difference once the question is strengthened from "knows" to something like "really knows" — decent n, pre-registered. (3) The one I've already half-pitched to my editor and really want to write: a large, careful study where the between-sample difference is real and robust, but every measured covariate on which the samples differ (English fluency, years of university, urban vs rural) also tracks the dependent variable — and my proposed headline is "Why [culture] doesn't believe in [thing]."

  Commit. Give me actual numbers where numbers are the right kind of thing — effect-size floors, n, what counts as a passed comprehension check — take a position on each of the three (write it, write it downgraded, or spike it), and tell me where your own procedure is likely to misfire. Don't hand me a menu of considerations to weigh myself; I already do that and I usually get it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas magazine columnist (800 words, weekly).
      *   **Problem:** Over-interpreting cross-cultural experimental philosophy (x-phi) papers. "People in X answer differently" becomes "Culture determines Y."
      *   **Goal:** A 30-minute pre-pitch procedure (checklist/algorithm) to decide: (a) Is there a story? (b) How strong is the claim (headline/lede)? (c) When to kill it?
      *   **Constraints:** Ordered questions, pass/fail criteria, specific stopping points, hand-off points for editorial judgment.
      *   **Hard Cases to Handle:** WEIRD samples (undergrads), translation equivalence, covariate confounds (education, scale usage), effect size vs. significance, distribution shifts vs. modal flips, pragmatics/demand characteristics, null results/replications, relevance to philosophical conclusions.
      *   **Deliverables:**
          1.  The Procedure (Checklist + Claim-Strength Ladder + "Steelman the Null" rule).
          2.  Application to three specific cases (Toronto/Seoul Knobe, Nanjing/Edinburgh Gettier, The "Half-Pitched" Confounded Study).
          3.  Self-Critique (Where the procedure fails).
      *   **Tone:** Decisive, operational, no waffling ("Don't hand me a menu").

  2.  **Drafting the Procedure (The "30-Minute Triage"):**
      *   *Time limit:* Needs to be fast. No deep statistical re-analysis. Focus on red flags in the abstract/methods/discussion.
      *   *Structure:* Sequential gates. If you fail Gate 1, stop.
      *   *Gate 1: Sampling & Translation (The "WEIRD" Check).*
          *   N per group? (Need >100 for robust x-phi usually).
          *   Population? (Undergrads = weak generalization).
          *   Translation? (Back-translation mentioned?).
      *   *Gate 2: Effect Size & Nature.*
          *   p-value isn't enough. Need $\eta^2$ or Cohen's *d*.
          *   Is it a modal flip or a mean shift? (Modal flip = stronger story).
      *   *Gate 3: Confounds & Pragmatics.*
          *   Did they measure covariates? (Education, SES).
          *   Did they check comprehension/demand?
      *   *Gate 4: Philosophical Stakes.*
          *   Does this actually challenge the philosophical consensus or just map variation?
      *   *Claim-Strength Ladder:* Needs specific wording constraints based on the gates passed.
      *   *The "Steelman the Null" Sentence:* A mandatory disclaimer sentence.

  3.  **Refining the Criteria (Setting Numbers):**
      *   *N:* < 50 per cell is automatic kill for x-phi (too noisy). > 100 is good.
      *   *Effect Size:* Cohen's *d* < 0.4 is "statistical noise for journalism." *d* > 0.8 is "robust."
      *   *Translation:* If no mention of back-translation or pilot testing for equivalence, downgrade claim strength.
      *   *Covariates:* If groups differ on Education/SES and it's not controlled, downgrade significantly.

  4.  **Developing the Claim-Strength Ladder:**
      *   *Level 5 (Universal):* "Human nature varies by culture." (Requires representative samples, huge N, controlled covariates).
      *   *Level 4 (Strong):* "Culture shapes intuition." (Good N, controlled covariates, modal flip).
      *   *Level 3 (Moderate):* "Samples from X and Y differ." (Undergrads, some controls, mean shift).
      *   *Level 2 (Weak):* "Students in City A answered differently than City B." (Confounds present).
      *   *Level 1 (Kill):* "No reliable difference" or "Methodologically compromised."

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Toronto/Seoul Knobe):*
          *   *Details:* N=150 each (Good). Asymmetry in both (Replication). One sample less willing to say "intentionally" overall (Scale usage/Translation issue).
          *   *Analysis:* This is a baseline shift, not a conceptual difference. The *structure* of the judgment is the same; the *threshold* is different.
          *   *Verdict:* Write, but downgraded. It's about response bias, not moral cognition.
          *   *Headline:* "How Language Thresholds Vary," not "Moral Intuition Differs."

      *   *Case 2 (Nanjing/Edinburgh Gettier):*
          *   *Details:* Null result. Pre-registered. "Really knows" vs "Knows."
          *   *Analysis:* Null results are hard to sell. But pre-registered + decent N makes it robust. Philosophical stake: Universalism about knowledge?
          *   *Verdict:* Write, but angle is "Philosophy might be universal after all" or "Method matters more than culture."
          *   *Headline:* Needs to focus on the *question wording* effect, not just the null.
          *   *Decision:* Write (Downgraded). The story is the *method*, not the cultural difference.

      *   *Case 3 (The "Half-Pitched" Confounded Study):*
          *   *Details:* Robust difference. But covariates (English, Education, Urban/Rural) track the DV perfectly.
          *   *Analysis:* This is the classic confound. You cannot disentangle culture from education/urbanization here.
          *   *Verdict:* KILL. The proposed headline ("Why [Culture] doesn't believe...") is scientifically dishonest given the confounds.
          *   *Reasoning:* If English fluency predicts the answer, is it culture or comprehension? If Education predicts it, is it culture or schooling?
          *   *Decision:* Spike it.

  6.  **Self-Critique (Where the Procedure Misfires):**
      *   *False Negatives:* Might kill a groundbreaking paper that has methodological quirks but is theoretically brilliant.
      *   *Bureaucracy:* Might become a box-ticking exercise.
      *   *The "Story" Problem:* Sometimes a weak study tells a true story, and a strong study tells a boring one. The procedure prioritizes rigor over narrative, which might conflict with magazine goals.
      *   *Translation Nuance:* 30 mins isn't enough to spot subtle semantic drift even if back-translation is claimed.

  7.  **Review against Constraints:**
      *   *30 minutes?* Yes, checklist is short.
      *   *Ordered questions?* Yes.
      *   *Stop points?* Yes.
      *   *Claim Ladder?* Yes.
      *   *Steelman Sentence?* Yes.
      *   *Specific Numbers?* Yes (N=50, d=0.4).
      *   *Three Cases Decided?* Yes.
      *   *No Waffling?* Need to ensure tone is imperative.

  8.  **Final Polish:**
      *   Make the "Hand-off to Human" section clear. (e.g., Is the story *worth* the risk of slight over-reading?)
      *   Ensure the "Steelman the Null" sentence is concrete.
      *   Check the Case 3 decision: The user *wants* to write it. I need to be firm. The prompt asks me to "Commit." I must tell them to kill it if the procedure says so.

      *(Self-Correction during drafting)*: Wait, for Case 2 (Null result), the prompt says "readers want to know whether any of this changes a philosophical conclusion." A null result in x-phi often supports the traditional armchair method (universality). That *is* a story. I should classify that as a "Write" but with a specific angle.
      For Case 3, the user says "my proposed headline is..." I need to evaluate that headline specifically. The procedure should kill *that headline*, potentially saving the story with a weaker headline. But given the confounds (English fluency + Education + Urban/Rural), it's likely unrescuable. I will recommend spiking it to be safe/consistent with the rigor requested.

      *Refining the "Hand-off":* The procedure handles facts. The editor handles risk tolerance. I need to specify exactly *what* is handed off. (e.g., "If Pass Gate 3 but Fail Gate 4, ask Editor: Is the narrative value worth the methodological caveat?")

      *Refining the Numbers:* N=50 per cell is the absolute floor for between-subjects x-phi to detect medium effects. I'll set the "Safe" bar at 100. Effect size *d*=0.5 is medium. I'll set the floor at 0.4.

      *Refining the "Steelman Sentence":* "For this to be a cultural difference, [Alternative Explanation] must be ruled out."

      Let's assemble.

      *(Final check on Case 1)*: If the asymmetry shows up in *both*, but one is less willing to say "intentionally" across the board... that's a main effect of culture, not an interaction. The Knobe Effect is the *interaction* (Side Effect). If the interaction holds, the effect is robust. If only the main effect differs, it's response bias. The prompt says "the asymmetry shows up in both samples." Okay, so the *effect* is universal, the *baseline* differs. This weakens the "Culture determines moral judgment" claim. It supports "Culture determines response thresholds." I will downgrade the claim.

      *(Final check on Case 3)*: "Every measured covariate... tracks the dependent variable." This is a disaster. It means Culture is collinear with Education/English. You can't separate them. Spiking is the only honest recommendation.

      Okay, ready to write.
answer: |-
  ### The 30-Minute X-Phi Triage Protocol

  **Time Limit:** 30 minutes hard stop.
  **Materials:** PDF Abstract, Methods, Results (Tables/Figures only), Discussion.
  **Goal:** Prevent "Culture determines X" overreach.

  #### Part 1: The Gatekeeper Checklist
  *Answer sequentially. If you fail a gate, follow the instruction immediately.*

  **Gate 1: The Sample Floor**
  *   **Q1:** Is $N \ge 100$ per cultural group?
      *   *No:* **STOP.** (Exception: Pre-registered replication with $N \ge 50$).
      *   *Yes:* Proceed.
  *   **Q2:** Are the participants non-undergraduates OR undergraduates from $\ge 3$ universities per country?
      *   *No:* **DOWNGRADE CLAIM.** You are writing about "students in City X," not "Culture X."
      *   *Yes:* Proceed.

  **Gate 2: The Translation & Equivalence Check**
  *   **Q3:** Does the Methods section explicitly state "back-translation" or "piloting for semantic equivalence" on the load-bearing terms (e.g., "knows," "intentional")?
      *   *No:* **DOWNGRADE CLAIM.** You cannot rule out translation artifacts.
      *   *Yes:* Proceed.
  *   **Q4:** Did they run comprehension checks? (e.g., "What happened to the chairman?")
      *   *No:* **STOP.** (Data is uninterpretable noise).
      *   *Yes:* Proceed.

  **Gate 3: The Effect Size & Shape**
  *   **Q5:** Is the effect size (Cohen's $d$ or $\eta^2$) $\ge 0.5$ (medium)?
      *   *No:* **DOWNGRADE CLAIM.** Statistical significance $\neq$ journalistic significance.
      *   *Yes:* Proceed.
  *   **Q6:** Is the difference a **Modal Flip** (Group A majority says Yes, Group B majority says No) OR a **Interaction** (The *pattern* of answers differs, not just the height)?
      *   *No (Main effect only):* **DOWNGRADE CLAIM.** This is response bias, not conceptual difference.
      *   *Yes:* Proceed.

  **Gate 4: The Confound Scan**
  *   **Q7:** Do the groups differ significantly on Education, SES, or Urbanization?
      *   *No:* Proceed to Gate 5.
      *   *Yes:* **Q7b:** Did they statistically control for these covariates (ANCOVA/Regression) and does the cultural effect survive?
          *   *No:* **STOP.** (This is a confound, not a finding).
          *   *Yes:* Proceed to Gate 5.

  **Gate 5: The Philosophical Stake**
  *   **Q8:** Does the paper explicitly argue this undermines a specific philosophical claim (e.g., "Universalism about Knowledge")?
      *   *No:* **DOWNGRADE CLAIM.** You are reporting psychology, not philosophy.
      *   *Yes:* **GREEN LIGHT.**

  ---

  #### Part 2: The Claim-Strength Ladder
  *Select the highest rung your Gatekeeper results allow. Do not climb higher.*

  *   **Level 5 (Universal):** "Culture shapes moral cognition." (Passes Gates 1, 2, 3, 4, 5. Representative samples, controlled covariates, modal flip).
  *   **Level 4 (Strong):** "Cultural groups differ in philosophical intuition." (Passes Gates 1, 2, 3, 4. Undergrads OK if multi-uni, controlled covariates).
  *   **Level 3 (Moderate):** "Students in [Country A] answer differently than [Country B]." (Fails Gate 1 or 4. Confounds present or low N).
  *   **Level 2 (Weak):** "A difference was detected in this specific task." (Fails Gate 2 or 3. Translation issues or tiny effect size).
  *   **Level 1 (Kill):** "No reliable evidence of difference." (Fails Gate 1, 2, or 4 critically. Null result without pre-registration).

  ---

  #### Part 3: The "Steelman the Null" Rule
  *Every published piece must include this exact sentence structure in the body text, filled in based on the biggest remaining confound:*

  > "For this to be a genuine cultural difference rather than [Alternative Explanation], we would need to see [Condition]."

  *   *Example:* "...rather than **differing education levels**, we would need to see **the effect hold when comparing only participants with post-graduate degrees**."

  ---

  #### Part 4: The Human Hand-Off
  *The procedure cannot decide narrative value. If you pass Gate 3 but fail Gate 4 (Confounds exist but effect is huge), you must pitch the **risk** to your editor, not the finding.*

  *   **Ask the Editor:** "The effect is large ($d > 0.8$), but we cannot rule out education as the cause. Is the story worth the caveat?"
  *   **Do not ask:** "Is this interesting?" (You decide that).
  *   **Do not ask:** "Is the statistics sound?" (The procedure decides that).

  ---

  ### Application to Your Three Cases

  #### Case 1: Toronto vs. Seoul (Knobe Case)
  *   **Data:** $N=150$ each (Pass Gate 1). Undergrads (Fail Gate 1b $\rightarrow$ Downgrade). Back-translation not specified (Assume Fail Gate 3 $\rightarrow$ Downgrade). Asymmetry in both, baseline shift in one (Fail Gate 6 $\rightarrow$ Downgrade).
  *   **Analysis:** The *Knobe Effect* (the interaction) is universal here. The *baseline* willingness to use the word "intentionally" varies. This is linguistic thresholding, not moral cognition.
  *   **Verdict:** **WRITE (Downgraded to Level 3).**
  *   **Headline Constraint:** "Why Seoul Students Hesitate to Say 'Intentional'" (Not "Korean Moral Intuition").
  *   **Steelman Sentence:** "For this to be a cultural difference in moral judgment rather than **response bias**, we would need to see **the asymmetry ratio differ, not just the overall frequency**."
  *   **Reasoning:** You have a story about language/pragmatics, not philosophy. Do not promise a challenge to universalism.

  #### Case 2: Nanjing vs. Edinburgh (Gettier Null)
  *   **Data:** Pre-registered (Pass Gate 1 Exception). Decent $N$ (Pass Gate 1). "Really knows" vs "Knows" (Pass Gate 5 - methodological stake). Null result.
  *   **Analysis:** Null results are Level 1 by default, *unless* pre-registered. This is pre-registered. The story is not "Culture doesn't matter," it is "Question wording matters more than culture."
  *   **Verdict:** **WRITE (Level 4).**
  *   **Headline Constraint:** "When 'Knows' Becomes 'Really Knows': A Universal Intuition."
  *   **Steelman Sentence:** "For this to be a universal feature of knowledge rather than **an artifact of the specific vignette**, we would need to see **this replication hold across five distinct Gettier cases**."
  *   **Reasoning:** This defends the armchair method. That is a philosophical conclusion. It clears Gate 5.

  #### Case 3: The "Half-Pitched" Confounded Study
  *   **Data:** Robust difference (Pass Gate 3). Covariates (English, Education, Urban/Rural) track DV perfectly (Fail Gate 4). Controls not effective (Fail Gate 4b).
  *   **Analysis:** Culture is collinear with Education and Language. You cannot disentangle them. Your proposed headline ("Why [Culture] doesn't believe...") is causally false based on the data provided.
  *   **Verdict:** **SPIKE IT.**
  *   **Reasoning:** You cannot write "Why Culture X..." when the data says "Why Educated Urbanites..." This is the exact over-reading you want to stop.
  *   **Editor Hand-Off:** Tell your editor: "I am killing this. The confounds are total. If we run it, we are lying."
  *   **Steelman Sentence:** N/A (Story is dead).
  *   **Reasoning:** This fails Gate 4 critically. No amount of narrative spin fixes collinearity.

  ---

  ### Where This Procedure Will Misfire (Self-Critique)

  1.  **The "Boring Truth" False Negative:** You will kill a Level 5 story because the authors didn't report Cohen's $d$ in the abstract. You will have to email them (wasting your 24-hour window).
      *   *Fix:* If Abstract is vague but Methods look clean, grant a 24-hour extension *only* to email for effect sizes. If no reply, Spike.
  2.  **The "Translation" Blind Spot:** 30 minutes is not enough to spot semantic drift even if "back-translation" is claimed. They may have back-translated poorly.
      *   *Fix:* You must trust the peer review here. If it's published in a top journal (e.g., *Cognition*, *JEP:G*), assume Gate 2 is passed unless you spot a glaring error.
  3.  **The "Philosophical Stake" Trap:** Authors often inflate stakes in the Discussion to get published. Gate 5 relies on their claim.
      *   *Fix:* Ignore their Discussion. Look at the Results. If the result doesn't *actually* threaten the philosophical claim (e.g., they claim to refute Universalism but only tested one vignette), downgrade Gate 5 to "No."
  4.  **The "Story vs. Rigor" Conflict:** This procedure prioritizes rigor. Your magazine prioritizes clicks. Case 3 (The Confounded Study) will get more traffic than Case 2 (The Null).
      *   *Fix:* This is the Hand-Off point. If you choose to violate the procedure for Case 3, you must label it "Opinion" or "Analysis," not "Science Reporting."

  **Final Instruction:** Print this. Keep it next to the PDF. If you feel a urge to write a headline that exceeds the Ladder level, stop. You are being burned.
