      *   The "Intent Alignment" definition (roughly: "the AI tries to do what the human wants") *does* rely on specific philosophical commitments to remain distinct from "Value Alignment" (roughly: "the AI optimizes for what is actually Good").
      *   I need to articulate the specific theory of intention that makes this work, acknowledge where it breaks down (as the user suspects), and explore the consequences of alternative theories.

