answer: |-
  **Actor-Mapping Brainstorm**
  The relevant parties are the French Court (Charles IX, Catherine de' Medici, courtiers), the Rouen public, the Tupinambá group (specifically the three interlocutors), the Interpreter (a Frenchman who lived in Brazil), and Montaigne (observer). The Court observes exotic bodies and behavior, gaining prestige and political allegory but risking moral exposure; the Tupinambá observe European hierarchy and poverty, gaining survival but losing autonomy and facing objectification; Montaigne observes human variation, gaining philosophical material for skepticism. The Court's evidence is visual spectacle; the Tupinambá's evidence is sensory experience of French social stratification; Montaigne's evidence is reported speech via the interpreter. Cultural relativism explains the moral judgments regarding cruelty and custom (e.g., is cannibalism worse than religious war?), but it lies outside the scope of structural power asymmetries, captivity, and the coercive conditions of the encounter itself. Relativism assumes moral equivalence, but the physical reality is one of dominion.

  ***

  **1. Mapping the Episode onto the Theory**

  To apply Montaigne's theoretical framework to the 1562 Rouen encounter, we must define the players, their evidentiary basis, and their available judgments.

  *   **The French Court (Player):** Their option is between treating the Tupinambá as diplomatic peers or as living curiosities. They choose spectacle. Their evidence is visual: nakedness, body modification, and behavior that deviates from French norms. Their judgment is aesthetic and political: the Tupinambá are "savages" who validate French civilization by contrast.
  *   **The Tupinambá (Players):** Their option is limited to compliance or resistant speech within the constraints of captivity. Their evidence is empirical observation of French society: they see men full and rich versus men half-starved and begging, and they see a King secluded behind barriers while guards stand outside. Their judgment, as reported, is that European hierarchy is irrational and that the poor show too much deference to the rich.
  *   **The Interpreter (Player):** A crucial but often invisible agent. His option is faithful translation or cultural filtering. His evidence is bilingual competence. He determines what counts as intelligible speech for the Court and Montaigne.
  *   **Montaigne (Player):** His option is to accept the Court's judgment (barbarism) or invert it (civilized barbarism). His evidence is the Tupinambá's reported speech and his own skepticism of European customs. His judgment is that the Tupinambá possess "natural reason" uncorrupted by artifice.

  In this mapping, the Court exercises the power to define the context (spectacle), while the Tupinambá exercise the power of observation but lack the power to define the terms of engagement. Montaigne positions himself as the arbiter who validates the Tupinambá's observations, but only by translating them into his own philosophical project.

  **2. Applying Montaigne's Inversion**

  Montaigne's core logical move in *Of Cannibals* is the inversion of barbarism: he argues that it is more barbarous to eat a man alive (torture during religious wars) than to eat a man dead (ritual cannibalism), and that artificial customs (European hierarchy) are more arbitrary than natural ones (Tupinambá equality).

  *   **The Spectacle as Cruelty:** The Rouen encounter reproduces the very cruelty Montaigne condemns. By displaying the Tupinambá as novelties before a gazing public, the Court treats living human beings as objects for consumption—visual rather than culinary, but consumptive nonetheless. Montaigne's theory would classify this display as a form of "European barbarism" because it violates natural dignity for the sake of artificial entertainment. The Court inflicts a psychological violence upon the guests that parallels the physical violence Montaigne attributes to European religious factions.
  *   **The Tupinambá Counter-Judgment:** The Tupinambá observation—that Europeans suffer inequality while claiming civilization—functions as a genuine epistemic counter-judgment. They identify a contradiction in French life: why do the needy obey the wealthy without revolt? However, Montaigne appropriates this judgment. He does not present their critique as a political demand for justice, but as evidence of their "natural wisdom" to shame the French. The critique serves European self-critique rather than Tupinambá liberation. The inversion is complete: the "savages" diagnose the sickness of the "civilized," but the diagnosis is used to cure the European conscience, not to alter the Tupinambá's status as captives.

  **3. Limits of the Theory: Silence and Breaks**

  Montaigne's relativism presupposes a symmetrical visibility where two cultures observe each other as equally strange and equally valid. The Rouen episode reveals where this theory breaks under the weight of material asymmetry.

  *   **Asymmetry of Movement:** Relativism implies a meeting of minds, but the encounter is structured by unilateral extraction. The Tupinambá are brought to France; the French do not go to Brazil as guests. Montaigne's theory offers no guidance on the ethics of *presence*. It can judge the customs observed, but it is silent on the coercion required to bring the observers to the court. The theory cannot account for the fact that the "natural men" are in chains or under guard, because relativism addresses moral custom, not political domination.
  *   **The Filter of Translation:** Montaigne forces the theory to speak through the interpreter. He admits the interpreter was a Frenchman who had lived among them, but he does not scrutinize the interpreter's biases. If the interpreter filters Tupinambá speech to make it palatable or philosophical for Montaigne, the "natural reason" Montaigne praises may be a reflection of his own skepticism rather than their actual thought. The theory breaks here because it assumes direct access to the "other's" mind, ignoring the colonial medium of communication.
  *   **One-Way Gaze:** Montaigne assumes symmetrical strangeness. In Rouen, the gaze is one-way. The Court looks at the Tupinambá as specimens; the Tupinambá look at the Court as captives assessing captors. Montaigne's framework treats this as a philosophical exchange, but the power dynamic renders it a inspection. The theory is silent on how power distorts knowledge; it assumes truth emerges from comparison, not recognizing that the comparison itself is rigged by who holds the sword.

  **4. Assessing the Theory: Sympathy vs. Idealization**

  The real presence of the Tupinambá in Rouen tests whether Montaigne's sympathy is robust or merely rhetorical.

  *   **Confirmation vs. Idealization:** The encounter confirms Montaigne's sympathy only insofar as the Tupinambá fit the mold of the "noble savage." He grants them epistemic standing—they are capable of reason and critique—but only because their critique aligns with his own disillusionment with European wars. If the Tupinambá had expressed a desire for European goods, or engaged in behavior Montaigne could not romanticize, his theory offers no resources to understand them except as "corrupted." Thus, the sympathy depends on an idealized distance; the specific individuals in Rouen are valued because they mirror European failings, not because they are understood on their own terms.
  *   **The Mirror Function:** Montaigne frames the encounter primarily as a mirror for European failings. The Tupinambá are the glass, not the viewers. To treat the encounter as a peer disagreement about which customs are genuinely cruel, Montaigne would have to acknowledge that the Tupinambá have the authority to judge *him* politically, not just anthropologically. He would need to concede that their judgment on European hierarchy should lead to structural change, not just philosophical reflection.
  *   **Forcing the Theory:** I am forcing the theory to speak on political agency where it intends only moral evaluation. Montaigne's relativism is a tool for suspending judgment on customs, not for dismantling empire. The episode exposes that his framework can tolerate cultural difference only when it remains safely distant or safely brought under control. For the theory to truly accommodate the Rouen encounter as a peer disagreement, it would need to expand from cultural relativism to political egalitarianism, granting the Tupinambá the right to refuse the spectacle itself. Montaigne does not go this far; he accepts the spectacle but changes the caption.
