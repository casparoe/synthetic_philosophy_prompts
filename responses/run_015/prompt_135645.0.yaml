prompt: |-
  You are a historian of philosophical ideas with expertise in early modern skepticism and the ethics of cross-cultural encounter. Before answering, spend a brief paragraph brainstorming the actor-mapping: identify the parties in the episode, what each could observe, what each stood to gain or lose, and which features are explained by cultural relativism versus which lie outside its scope.

  Then analyze the 1562 Rouen court spectacle—when three Tupinambá people from Brazil, part of a larger group brought to France, were presented before King Charles IX, observed by courtiers and townspeople, and spoken with by Michel de Montaigne (then a magistrate in the region)—through the lens of Montaigne’s theory of cultural relativism and his critique of European barbarism, especially as developed in his essay Of Cannibals. Do not summarize the essay; apply its logic precisely.

  In particular, do the following:

  1. Map the episode onto the theory. Who are the relevant actors (the French court and audience, the Tupinambá captives or guests, Montaigne himself, the interpreter)? What counts as the evidence each side has about the other? What are the actual options or judgments available to each party—for instance, the court’s choice between spectacle and dialogue, or Montaigne’s choice between condemning cannibalism and inverting the charge of barbarism?

  2. Use Montaigne’s inversion—that Europeans torture living enemies in religious wars while cannibals ritually consume dead ones, and that our artificial customs are no less arbitrary than their natural ones—to interpret specific dynamics of the 1562 encounter. Does the spectacle of displaying the Tupinambá reproduce the very cruelty Montaigne attributes to Europeans? Does the Tupinambá observation that Europeans live in artificial luxury and seem to lack naturalness (which Montaigne reports) function as a genuine epistemic counter-judgment, or is it appropriated to serve European self-critique?

  3. Identify where the theory is silent or breaks. Montaigne’s relativism seems to presuppose a kind of symmetrical visibility: both cultures can observe each other as equally strange. But in Rouen the Tupinambá are captives, displayed under a one-way gaze. Does the power asymmetry—that they are brought to France, not the reverse—reveal a limit to relativism? Can the theory account for the fact that the encounter is structured by captivity, performance demands, and translation mediated by a European interpreter?

  4. Assess what the episode shows about the theory. Does the real presence of the Tupinambá in Rouen—not as abstract cannibals in a travel narrative but as specific people responding to specific questions—confirm Montaigne’s sympathy, or does it expose that his sympathy depends on an idealized noble savage who remains safely distant? If Montaigne genuinely grants them epistemic standing, why does his essay still frame them primarily as a mirror for European failings? What would have to change in his framework to treat the encounter not as a spectacle but as a peer disagreement about which customs are genuinely cruel?

  Be disciplined about the mapping: say who the player is, what the options are, and what counts as the evidence. Say explicitly where you are forcing the theory to speak and where it offers no guidance. Do not provide a bibliography, reading list, or citations; do not invoke obscure secondary literature. The answer should stand on its own reasoning.
