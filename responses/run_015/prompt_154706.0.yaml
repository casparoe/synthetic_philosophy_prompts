answer: |-
  Here is the specification sheet for a theory of Ulysses contracts, structured to force discrimination between legitimate precommitment and coercive entrapment.

  ### I. The Desiderata
  A viable theory must satisfy the following conditions to adjudicate legitimacy. Items are marked **Non-Negotiable** (failure here renders the theory useless for distinguishing coercion from commitment) or **Camp Preference** (aligns with specific philosophical commitments).

  **1. Mechanism Sensitivity (The Tantalus Constraint)**
  *   **Requirement:** The theory must distinguish between *removing* an option, *pricing* an option, and *degrading* the agent's relationship to the option. A device that makes an action physically impossible is not normatively identical to one that makes it psychologically revolting or procedurally humiliating, even if the behavioral outcome (abstinence) is identical.
  *   **Rationale:** Coercion often operates through degradation or the manipulation of affect, not just constraint of choice sets. If a constitution forces a humiliating ritual to amend a right, it chills speech differently than a supermajority rule, even if both raise the "cost."
  *   **Status:** **Non-Negotiable.** (A theory that treats a fine, a lock, and an aversion as fungible costs cannot distinguish between a penalty and a structural barrier.)

  **2. Epistemic Defeasibility (The Cassandra Constraint)**
  *   **Requirement:** The theory must provide a condition under which the future self's dissent overrides the past self's command *specifically when the future self possesses superior information or unimpaired rationality*, without conceding that *all* future dissent overrides past command.
  *   **Rationale:** If the Sirens were actually warning of a reef, Ulysses was wrong. A theory that binds regardless of new evidence treats precommitment as infallible prophecy. A theory that unbinds upon any dissent treats precommitment as advisory.
  *   **Status:** **Non-Negotiable.** (Without this, the theory cannot distinguish between stubbornness and fidelity.)

  **3. Strategic Vulnerability (The Duplicate Key Constraint)**
  *   **Requirement:** The theory must account for third-party exploitation of the binding mechanism. It must determine whether the legitimacy of the device is voided or tainted if it creates a hostage situation for external actors (e.g., a lender knowing you cannot renegotiate).
  *   **Rationale:** Precommitment changes the bargaining landscape. If the device functions by transferring veto power to a predator, it is not self-binding; it is self-enslavement via proxy.
  *   **Status:** **Camp Preference.** (Libertarian/Contractarian views treat this as a breach of implied terms; Paternalist views may treat the outcome [protection] as sufficient regardless of exploitation.)

  **4. Diachronic Identity (The Successor Constraint)**
  *   **Requirement:** For collective/institutional cases, the theory must define the continuity conditions between the enacting body and the bound body. It cannot simply assume "the State" is a single agent across time without specifying the transmission mechanism of agency (e.g., voter overlap, constitutional continuity, territorial integrity).
  *   **Rationale:** The "dead hand" problem. If the agent is not continuous, the contract is not Ulysses-style self-binding; it is intergenerational coercion.
  *   **Status:** **Non-Negotiable.** (Applying individual autonomy models to institutions without modification is a category error.)

  **5. Exit Cost Proportionality (The Cheap-Exit Gradient)**
  *   **Requirement:** The theory must treat the *magnitude* of the escape cost as relevant to legitimacy, not just the binary existence of an escape clause. A "right to exit" that costs 90% of your wealth is not functionally equivalent to one that costs 1%.
  *   **Rationale:** Coercion is often a function of the severity of the threat/constraint, not just its presence. If escape is theoretically possible but practically ruinous, the binding is coercive.
  *   **Status:** **Non-Negotiable.** (Formal reversibility without practical accessibility is a sham.)

  **6. Meta-Rule Consistency (The Second-Order Constraint)**
  *   **Requirement:** The theory must explain the legitimacy of binding oneself against *unbinding*. It must distinguish between a cooling-off period (temporary suspension of will) and a permanent alienation of the right to change one's mind (slavery/irrevocable trust).
  *   **Rationale:** If you can bind yourself not to unbind, you can create irrevocable chains. If you cannot, precommitment is always provisional. The theory needs a cutoff point for how many layers of "don't let me change my mind" are permissible.
  *   **Status:** **Camp Preference.** (Perfectionist/Autonomy views often ban second-order binding as self-annihilation; Contractarian views allow it as property disposal.)

  ---

  ### II. The Trilemma Analysis

  You are correct about the tension, but the formulation needs slight sharpening to capture the *source* of the impossibility. The trilemma is not just about "temptation vs. correction"; it is about **Information**, **Will**, and **Procedure**.

  The three jointly unsatisfiable desiderata are:
  1.  **Fidelity to Past Intent:** The device must reliably survive the moment of temptation (upholds the Precommitment).
  2.  **Responsiveness to Present Rationality:** The device must not bind an agent who has been corrected by evidence or regained capacity (upholds the Cassandra).
  3.  **Procedural Neutrality:** The mechanism for deciding between (1) and (2) cannot rely on a substantive, case-by-case inquiry into the agent's "true" state at the moment of release (upholds Rule of Law/Feasibility).

  **Why they clash:**
  To satisfy (1) and (2), you need to know *why* the agent wants out. Is it weakness (Sirens) or wisdom (Reef)?
  *   If you allow a substantive inquiry to distinguish these, you violate (3). You turn the "binding contract" into a "standard-based review," which invites the very litigation/temptation the device was meant to block. The cost of escape becomes the cost of proving you aren't weak.
  *   If you enforce (3) (e.g., "no exit allowed" or "exit allowed after 30 days"), you inevitably violate either (1) (the weak self exits during the window) or (2) (the wise self is blocked by the window).

  **Where theories break:**
  *   **Hard Precommitment:** Drops (2). Binds the Cassandra.
  *   **Soft Precommitment:** Drops (1). The "binding" is merely a speed bump; the future self is sovereign.
  *   **Proceduralism:** Drops (3). Requires a "competence tribunal" or "judicial review" at the moment of exit, which transforms the Ulysses contract into a guardianship model.

  **Your suspicion is correct:** You cannot have a device that is *robust against weakness*, *sensitive to wisdom*, and *automatic in operation*. One must go. Most successful theories implicitly sacrifice (3) by relying on social norms or internal shame (Tantalus-style) rather than hard locks, because hard locks cannot distinguish Sirens from Reefs.

  ---

  ### III. The Most Exclusionary Desideratum

  **Epistemic Defeasibility (The Cassandra Constraint).**

  This is the single desideratum that excludes the most otherwise attractive theories.
  *   **Why:** It kills the **Precedent-Autonomy** model (the "Past Self owns the Future Self" view). If you hold that the authority of the contract derives solely from the autonomy exercised at *t1*, you cannot logically permit *t2* to override *t1* based on *t2*'s assessment of the facts, unless you admit that *t1* autonomy was flawed. But if *t1* autonomy was flawed, why bind at all?
  *   **Impact:** It also pressures the **Constitutionalist** model. If a constitution cannot be amended because the procedure is too hard, but the current majority is rationally demanding change based on new historical evidence (not just passion), the Constitutionalist must argue that the *procedure itself* generates legitimacy independent of the outcome. Cassandra forces the admission that procedure can be epistemically blind.
  *   **Survivor:** Only the **Two-Selves/Therapeutic** model handles this well, because it explicitly models *t1* and *t2* as having different utility functions and information sets, treating the contract as a medical aid rather than a moral promise.

  ---

  ### IV. Scorecard

  **1. The Two-Selves / Hyperbolic Model**
  *   **Core:** Agency is fragmented; *t1* and *t2* are partial strangers with conflicting preference orderings (cool vs. hot states).
  *   **Legitimacy Condition:** The contract is legitimate if it maximizes the satisfaction of the "long-term" preference structure over the lifetime of the agent.
  *   **Failure Point:** Struggles with the **Successor Problem**. It cannot easily scale to institutions where "long-term preference" of a collective is incoherent. Also risks paternalism: who defines which self is the "real" one?
  *   **Verdict on Forced Cases:** Solves **Cassandra** (by weighing information access), fails **Tantalus** (often treats degradation as just another cost).

  **2. The Precedent-Autonomy Model**
  *   **Core:** The right to plan is a fundamental liberty. To disrespect the past plan is to disrespect the person who made it.
  *   **Legitimacy Condition:** The contract is legitimate if the formation was voluntary and informed. The content of the command is secondary to the authority of the commander.
  *   **Failure Point:** Collapses on **Cassandra**. It cannot account for legitimate override by the future self without undermining the authority of the past self. Treats **Second-Order** binding as fully permissible (you can sell yourself into slavery if you choose).
  *   **Verdict on Forced Cases:** Solves **Tantalus** (if chosen, the humiliation is self-authored), fails **Cheap-Exit** (if you agreed to a high exit cost, you must pay it).

  **3. The Constitutionalist / Systemic Model**
  *   **Core:** Precommitment is not about individual will but about the preconditions of decision-making. Some values must be removed from the agenda to allow the game to continue.
  *   **Legitimacy Condition:** The contract is legitimate if it preserves the integrity of the decision-making system itself (e.g., democracy, market stability).
  *   **Failure Point:** Struggles with **Duplicate Key**. It often justifies third-party exploitation if it serves systemic stability (e.g., bondholders holding a government hostage is a feature, not a bug, for fiscal discipline).
  *   **Verdict on Forced Cases:** Solves **Successor Problem** (defines continuity via rules, not persons), fails **Epistemic Defeasibility** (systemic rules must be blind to specific epistemic claims to function).

  **4. The Guardrails / Proceduralist Model (The Hybrid)**
  *   **Core:** Precommitment is legitimate only as a "speed bump" or procedural hurdle, never as a substantive veto.
  *   **Legitimacy Condition:** The device is legitimate if it forces deliberation, not if it forces a specific outcome.
  *   **Failure Point:** Fails **Fidelity**. If the device only slows you down, it does not solve the weakness of will problem for sufficiently strong temptations.
  *   **Verdict on Forced Cases:** Solves **Cassandra** (deliberation allows new evidence in), fails **Tantalus** (humiliation is not deliberation).
