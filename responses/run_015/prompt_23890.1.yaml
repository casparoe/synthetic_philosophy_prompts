answer: |-
  **Proposal Title:** The Epistemic Stratification of the Church-Turing Thesis: Distinguishing Conceptual Analysis from Physical Constraint

  **Research Question**
  To what extent does distinguishing the epistemic status of the Logical Church-Turing Thesis (concerning effective procedures) from the Physical Church-Turing Thesis (concerning physical systems) resolve the apparent conflict between conceptual analysis and the hypercomputation literature? Specifically, is the Logical Thesis best defended as an *a priori* conceptual analysis, while the Physical Thesis must be treated as an *a posteriori* empirical claim about the laws of nature?

  **Background and Motivation**
  In contemporary philosophy of computation, the Church-Turing Thesis (CTT) is frequently treated as a monolithic claim. This treatment obscures a critical ambiguity in its justification. On one hand, the thesis is often presented as the culmination of Turing's 1936 analysis of human computation. Here, CTT functions as a conceptual claim: it asserts that the intuitive notion of an "effective procedure" is co-extensive with Turing-computability. This version is typically defended via philosophical argument regarding the limits of finite human agency and symbol manipulation. On the other hand, the thesis is invoked in physics and computer science as a limit on what *any* physical system can compute. This version is challenged by the hypercomputation literature, which proposes physical models (e.g., relativistic computers, analog systems) that allegedly surpass Turing limits.

  Current discourse often conflates these two versions. Proponents of CTT sometimes defend the Physical Thesis by relying on the conceptual arguments intended for the Logical Thesis, effectively defining physical computability in terms of effective procedures. Conversely, critics of CTT often attack the Logical Thesis using physical counterexamples that are irrelevant to the conceptual analysis of human effective methods. This conflation leads to a dialectical stalemate: the thesis appears trivial if defined stipulatively, yet vulnerable if treated as a physical law. My hypothesis is that this confusion stems from failing to recognize that the Logical and Physical Theses possess different epistemic statuses. The Logical Thesis is a claim about the extension of a concept (justified *a priori*), whereas the Physical Thesis is a claim about the causal structure of the universe (justified *a posteriori*).

  **Methodology and Semester Plan**
  The paper will proceed in three phases over the twelve-week semester, culminating in a 6,000-word draft.

  *Weeks 1–4: Exegesis and Distinction.* I will reconstruct Turing's original argument for the identification of effective calculability with Turing-computability, focusing on his decomposition of human computational acts. I will contrast this with later formulations, specifically the Physical Church-Turing Thesis as articulated by Deutsch and others. The goal of this phase is to produce a rigorous definition of the two distinct claims, isolating the Logical Thesis from assumptions about physics.

  *Weeks 5–8: Epistemic Status Analysis.* I will evaluate the justification for each claim separately. For the Logical Thesis, I will examine whether it withstands the charge of being a mere stipulation. I will argue that while it relies on conceptual analysis, it is not trivial, as it rules out alternative analyses of effectiveness. For the Physical Thesis, I will survey the hypercomputation literature (e.g., supertasks, analog computation) to demonstrate that its truth value depends on contingent facts about physics, not conceptual analysis. I will argue that treating the Physical Thesis as empirical prevents the "definition move" from shielding it from falsification.

  *Weeks 9–12: Synthesis and Drafting.* I will synthesize these findings to show how the epistemic split dissolves the standard objections. If the Logical Thesis is conceptual, physical counterexamples do not refute it. If the Physical Thesis is empirical, conceptual arguments do not secure it. I will draft the paper, focusing on the implications of this split for the methodology of the philosophy of computation.

  **Possible Conclusions**
  There are three primary outcomes this investigation might support:
  1.  **Strong Stratification:** The Logical Thesis is *a priori* and secure; the Physical Thesis is *a posteriori* and contingent. This dissolves the hypercomputation debate by showing it targets a different claim than the one Turing proved.
  2.  **Weak Stratification:** Both theses contain empirical elements. Even the analysis of "effective procedures" relies on assumptions about human cognitive physics. This would suggest the Logical Thesis is less secure than standardly assumed.
  3.  **Unified Empiricism:** The conceptual analysis fails, and both theses stand or fall on physical grounds. This would require rejecting Turing's 1936 argument as insufficient.

  The deciding consideration will be whether the constraints Turing places on human computation (finitude of states, discrete symbols) can be justified without reference to physical laws. If they can, Strong Stratification holds. If they cannot, the project shifts toward Weak Stratification.

  **Risk Assessment and Scope**
  The primary risk is scope creep regarding the physics of hypercomputation. Analyzing specific models like Malament-Hogarth spacetimes requires technical knowledge that could overwhelm the philosophical argument. To mitigate this, I will treat physical models as illustrative examples of the *type* of claim being made, rather than evaluating their physical plausibility in detail. A second risk is that the distinction between "conceptual" and "empirical" may itself be too blurry to support the weight of the argument. If the seminar discussions suggest the *a priori*/*a posteriori* distinction is untenable in this context, I will pivot to framing the difference as one between *normative* constraints on computation and *descriptive* limits of machinery. Finally, there is a risk of under-arguing the "triviality" charge. I must ensure I do not simply assert that the Logical Thesis is non-trivial but demonstrate why the analysis of effectiveness adds substantive content beyond definition.
