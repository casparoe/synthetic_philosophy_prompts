prompt: |-
  I'm a third-year philosophy student, and I'm trying to scope a term paper for a philosophy-of-mathematics-and-computation seminar (roughly 6,000 words, one semester), but I keep getting stuck on the difference between what the Church-Turing thesis is and what its epistemic status is, and I suspect that confusion is exactly what my paper should be about. My half-formed idea, which I've been bouncing around with my advisor, is that the Church-Turing thesis is usually treated as a single settled claim, but I think it's really two claims with different epistemic statuses: the logical, effective-procedure version (that every effectively computable function is Turing-computable) and the physical version (that no physical system can compute a function that is not Turing-computable). My hunch is that the logical version is best understood as a conceptual or a priori claim that rests on Turing's argument about what an effective procedure must be like, whereas the physical version is genuinely empirical — it's a claim about what the world can do, and it's the version that the hypercomputation literature is actually trying to challenge. And I suspect that the familiar move of simply defining computability to mean Turing-computability, which makes the thesis trivial, works for the logical version but not for the physical one, because the physical version isn't about what our concept of computation picks out but about what physical systems can in fact realize.

  Could you turn this into a two-page proposal? I'd like a precise statement of the question, framed so that it has a determinate answer rather than just a yes-or-no about whether the thesis holds; an explanation of why the existing ways of talking about the thesis leave the question open, in particular why people keep conflating the two versions or keep treating the thesis as settled in a way that papers over the epistemic difference; a concrete account of the approach I would actually take, roughly week by week, over the semester; a statement of what the possible conclusions are and which considerations would decide between them; and an honest assessment of what could make the project too big for a semester. Please don't include citations or a bibliography — I'll fill those in myself; it's enough for you to refer to the relevant positions and arguments by name.
