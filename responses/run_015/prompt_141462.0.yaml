answer: |-
  Good evening. For those of you I haven't met yet, I'm [Your Name]. I'm [Honoree]'s younger half-brother, and I'm also a novelist. For the last three years, I've been shadowing her and her team for a book about a hospice chaplain.

  I mention this because it's the only reason I'm qualified to stand here and tell you that I am terrible at my job. Recently, [Honoree] read a draft of my manuscript. Her feedback was that my death scenes were "theologically confident and technically incoherent." She was right. I had a character flatline on a monitor that doesn't measure heart rate, and another one receive a medication that would have stopped their heart rather than their pain.

  So, I want to be very careful tonight. I know half this room are clinicians who will catch me if I drift into metaphor, and the other half are family who will catch me if I drift into cold medicine. Specifically, I know my father is here. Dad, I promise you: no one is starving anyone tonight. The only thing we are cutting is the cake.

  But there is a reason I'm bringing up my technical failures. It's because over the last three years, [Honoree] tried to teach me how to see the room I was writing about. She has a teaching tool she calls the "Furniture Rule."

  For the staff here, you know this. For the family, the short version is this: Before you can decide if someone *did* something to end a life, or *allowed* a life to end, you have to agree on what counts as the furniture. Is the oxygen line part of the patient, or is it equipment? Is the feeding tube part of the care, or is it an obstruction? Is the chair pulled up to the bed part of the vigil, or part of the clutter?

  Her point was that the moral weight doesn't live in the final moment. It lives in the prior, mostly unspoken agreement about what belongs in the room. If you decide the ventilator is furniture, turning it off is opening a window. If you decide it's a limb, turning it off is amputation. The physical movement is identical. The ethics depend entirely on how you arranged the room beforehand.

  I spent three years trying to write about death, and I kept trying to fix the sentence at the end of the paragraph. [Honoree] spent forty years fixing the paragraph before the sentence began.

  That is the distinction I want to toast tonight. Because looking at her career, it's clear she didn't just work in hospice care. She was a carpenter.

  When she built this hospice from nothing, she wasn't just building a facility. She was arranging the furniture for all of us. She decided, forty years ago, what would count as the baseline of care in this community. She decided that pain management was a wall, not an option. She decided that dignity was a floor, not a ceiling. She decided that the family's presence was essential equipment, not a visitation hazard.

  To the clinicians here: You know that phrase she banned? *"Allowing nature to take its course."* She hated it because it sounds passive. It sounds like you sit back and watch. But we all know that what actually happens in that room is not passive. It is skilled, deliberate, exhausting work. It is the work of removing the furniture that doesn't belong so the person can leave without tripping over it.

  That is not "letting go." That is clearing the path.

  And to the family: I know Dad worries that clearing the path means pushing someone out the door. But I've watched my sister work. I've watched her show up at Christmas, at funerals, at hospital bedsides when she was supposed to be retired. She applies the Furniture Rule to us, too. She decides what counts as support. She decides that "showing up" isn't just sending a card; it's pulling up a chair and sitting in the uncomfortable silence. She arranges the emotional room so that when we are in crisis, we know where the walls are. We know what holds.

  She has also explicitly banned the word "gentle" from this speech. She says people use "gentle" when they mean "competent." So I will say this: She is fiercely competent. She is precise. She is rigorous.

  And that rigor is a form of love. Because if you get the furniture wrong, the room collapses. If you call withdrawing treatment "killing," you terrify the family. If you call it "doing nothing," you insult the staff. You have to name the objects in the room correctly.

  I'm a writer. I deal in words. She deals in reality. I try to arrange sentences so they make sense at the end. She arranges lives so they make sense at the beginning of the end.

  She is retiring now. She is stepping out of the room she built. And the terrifying, beautiful thing about the Furniture Rule is that once the furniture is set, the room stands on its own. The clinicians here know how to arrange the chairs. The family knows how to sit in them.

  So, I'm not going to wish her a "restful" retirement. She doesn't rest. She rearranges.

  Please raise your glasses.

  To [Honoree]. Thank you for building the room. Thank you for deciding what counts as furniture. And thank you for teaching us that the most important work happens before the final moment, in the quiet, deliberate act of making sure there is a place for us all to sit.

  To [Honoree].
