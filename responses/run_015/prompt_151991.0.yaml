answer: |-
  The rain had found the seam in the roof again. It wasn't a leak so much as a persistence, a rhythmic dripping into a bucket in the corner of the conservation lab that marked time better than the clock on the wall. Marla wiped her hands on a rag that smelled of solvent and damp wool. On the table before her lay the panel. *Frozen Canal with Figures*. Forty years it had hung in the north stairwell, collecting dust and indifference. Attributed to Willem Schaft. A nobody.

  Now, under the infrared reflector, the underdrawing spoke a different dialect. The brushwork in the ice shards, the specific way the lead white caught the skater's blade—it whispered Hendrik Oosterling. And Oosterling was not a whisper; he was a shout. He was millions. He was climate-controlled cases and armed guards.

  Beside the painting sat a shoebox. Ezra's box.

  Ezra sat on a stool near the door, his coat still wet from the walk over. He had been the museum's framer until '98, when the budget tightened and he was deemed expendable. For twenty years he had nurtured this secret. He hadn't forged the paint; he had forged the history. Letters from a fictional dealer in Amsterdam. A bill of sale from a private collection in Utrecht. A penciled note in the margin of a 1974 catalogue raisonné.

  "It fits," Ezra said. His voice was dry, like paper rubbing together. "Look at the dates. The Utrecht sale matches the gap in his known works. I didn't guess, Marla. I calculated."

  "You invented the seller, Ezra," Marla said. She didn't look up from the panel. "Van der Hout died in 1950. This letter is dated '52."

  "A clerical error. Happens."

  "It happens when you make it happen."

  Ezra stood up, pacing the small room. "The science says Oosterling. My papers say Oosterling. Why does it matter how we get to the truth if we arrive there?"

  "Because the path is part of the map," Arthur said from the doorway.

  Arthur was the registrar. He held a clipboard like a shield. He hadn't taken off his coat either. The museum was cold, the heating shut off in the wings to save money.

  "Arthur," Marla said.

  "I heard the dripping," Arthur said, stepping over a puddle near the sink. He looked at the shoebox, then at the painting. "If we submit the attribution change with that provenance, the accreditation council will audit us within the month. If they find the Van der Hout letters are forgeries, we lose our status. We lose our insurance."

  "They aren't forgeries," Ezra snapped. "They are corrections."

  "They are lies," Arthur said. He turned to Marla. "A painting whose paper trail has been faked is damaged, Marla. Maybe not the wood, maybe not the paint. But the object's history is part of the object. If we file this, we are certifying a lie. We become part of the forgery."

  "And if we don't?" Marla asked. "If we file the science alone?"

  Arthur shook his head. "The science is suggestive. You said so yourself. Infrared shows hand, but not signature. Without the paper trail, the attribution won't hold. The board won't insure an 'attributed to' Oosterling at full value. They'll keep it here. But if we attach Ezra's documents, it becomes a confirmed Oosterling. And then it goes."

  "Where?" Ezra asked.

  "Chicago. Or London. There's a clause in the trust. Significant re-attributions trigger a review for asset maximization." Arthur looked at Ezra. "You want vindication? You'll get it. You'll be the man who found the Oosterling that saved this museum from insolvency. And then you'll never see it again."

  Ezra's face tightened. He hadn't thought about the leaving. He had only thought about the being right. "It belongs to the record," he said quietly.

  "It belongs to the stairwell," a voice said from the hall.

  Sam leaned against the doorframe. He was the night guard, sixty-five years old, wearing a uniform that was two sizes too big. He'd walked past the *Frozen Canal* every night for thirty years. He knew the crack in the ice near the skater's heel. He knew the way the light hit the grey sky at 3:00 AM.

  "It's cold in the stairwell," Sam said. "But it's ours. My daughter learned to count looking at the figures on the ice. My wife... she used to stand there when she was waiting for me to clock out. Said it looked like the world holding its breath." He looked at the painting, not the documents. "You put it in a case, it stops breathing. You send it to Chicago, it stops being here."

  "It's not about here," Arthur said. "It's about what it is."

  "It's about who it's for," Sam countered.

  Marla looked down at her hands. They were stained with charcoal and dust. She was the conservator. Her job was to stabilize, to reveal, to preserve the truth of the object. But the object was wood and pigment. The truth was a story people told about it.

  If she filed the report with Ezra's documents, the story became true. The painting became valuable. The museum got a payout. Ezra got his name in the footnote. And the stairwell became empty. The guard lost his landmark. Her father, who brought her here when she was six to see the "sad ice picture," would come visiting and find a gap on the wall.

  If she filed the report without the documents, the attribution would likely be rejected. The board would call it inconclusive. It would stay a Schaft. It would stay in the rain. It would stay loved.

  But she would know. And Ezra would know. And the record would be wrong.

  "Ezra," Marla said. "Give me the box."

  Ezra hesitated, then slid the shoebox across the table. The cardboard was soft, worn from handling. He had lived inside this box for two decades.

  "Arthur," Marla said. "If I submit a technical report citing stylistic analysis and underdrawing consistent with Oosterling, but note the provenance is unverifiable..."

  "Then it stays 'Attributed to Schaft'," Arthur said. "And it stays here. But you're burying evidence."

  "I'm curating it," Marla said. "The provenance is compromised. It's standard procedure to exclude compromised data."

  "It's not compromised," Ezra said. "It's correct."

  "It's fabricated," Arthur said. "There's a difference."

  "Is there?" Ezra looked at Marla. "You know I'm right. You know the brushwork is his. You know the lead is from the right batch. My papers just... grease the wheels. They make it easy for them to believe you."

  "If I use them," Marla said, "I become you."

  Ezra flinched. He looked at the bucket catching the rain. *Drip. Drip.*

  "I didn't want to steal it," Ezra said. "I just wanted them to listen. In '98, I told them the roof was leaking. I told them the storage humidity was wrong. They told me to fix the frames and shut up. This... this was the only way to make them look."

  "They're looking now," Sam said. "But they're looking at the price tag, not the ice."

  Marla opened the box. She took out the letters. The ink was too dark, too fresh for paper that claimed to be seventy years old. She knew how he'd done it. Tea stains, oven baking. She respected the craft even as she hated the lie.

  She walked to the sink. There was a shredder there for confidential donor lists. It was old, jammed often, but it worked.

  "Marla," Arthur warned. "That's evidence."

  "It's contamination," she said.

  "Don't," Ezra said. He stood up, his hands gripping the edge of the table. "If you destroy that, you kill the truth. You're choosing ignorance."

  "I'm choosing stewardship," Marla said. "The painting is stable. The roof is leaking. The community uses this space. If I validate this, the painting leaves. If the painting leaves, the connection breaks. The object survives, but the context dies."

  "The context is art history!" Arthur said, his voice rising for the first time. "You are a conservator, Marla. You serve the object, not the guard station. You serve the truth, not the sentiment. If we start editing the record to keep things local, we aren't a museum. We're a private collection."

  "And if we edit the record to sell things off, we aren't a museum," Marla said. "We're a warehouse."

  She fed the first letter into the shredder. The machine groaned, teeth chewing the paper. The sound was violent in the quiet room. Ezra watched, his face pale. He didn't try to stop her. He knew if he touched her, he'd be barred from the building forever. He wanted vindication, not a criminal record.

  The letter disappeared. Then the bill of sale. Then the catalogue margin.

  When the box was empty, Marla turned back to the table. She picked up her pen. She opened the conservation report.

  Under *Attribution*, she wrote: *Willem Schaft (formerly attributed).*
  Under *Analysis*, she wrote: *Infrared reflectography reveals underdrawing consistent with mid-17th century Dutch school. No definitive signature found. Provenance documentation submitted by third party deemed unreliable due to inconsistencies in material age and archival record.*

  She didn't write *Oosterling*. She didn't write *Fake*. She wrote *Unreliable*.

  She signed the form.

  "You killed it," Ezra said. He sounded tired. The anger had gone out of him, leaving only the hollow space where the victory should have been. "It's an Oosterling. And you called it a Schaft."

  "I called it what it can survive as," Marla said.

  Arthur took the report. He looked at it for a long time. He knew what she had done. He knew what she had sacrificed. Her integrity, technically. She had seen the truth and filed a lie. But she had also protected the institution from the scandal of the forgery.

  "This will stay in the file," Arthur said. "If anyone else looks..."

  "Then they'll see a conservator who prioritized the object's stability over its market value," Marla said. "Which is literally my job description."

  Arthur nodded, once. He tucked the clipboard under his arm. "I'll file it. But Marla... the roof still leaks. The money from a sale... it could have fixed the roof. It could have fixed the humidity."

  "We'll fix the roof," Marla said. "Another way."

  Arthur left. Sam lingered for a moment. He looked at the painting, then at Marla. He didn't thank her. He just touched the edge of the table, a small acknowledgment, and went back to his post.

  Ezra put on his coat. He didn't look at the painting. "I was right," he said to the floor.

  "Yes," Marla said. "You were."

  "Doesn't matter."

  "No," she said. "It doesn't."

  He left. The door clicked shut. The room was quiet again, save for the rain. *Drip. Drip.*

  Marla walked over to the painting. She touched the frame. It was cold. She thought about the lie she had just codified. She had put her name to a document that said this was a Schaft. She had erased Ezra's twenty years of obsession. She had denied the art history community a discovery.

  She turned off the infrared lamp. The painting returned to normal light. The grey sky looked heavier. The skater looked colder.

  It would hang in the stairwell tomorrow. The guard would walk past it. Her father would come in next week and stand before it while she fetched coffee. They would see the ice. They would see the breath held in the paint.

  Marla picked up the bucket of rainwater and carried it to the sink. She poured it out. The swirl of dirty water went down the drain. She dried her hands. She turned off the lights.

  In the dark, the painting was just a shape on the wall. It didn't know its name. It didn't know its value. It only knew the room it was in.

  Marla locked the lab door. She walked up the stairs, past the spot where the canvas would hang tomorrow. She ran her hand along the wall. The plaster was damp.

  She would write a grant proposal for the roof. She would beg the trustees. She would find the money another way.

  She pushed open the exit door into the night. The rain had stopped. The air was cold and clean. She walked to her car, knowing that tomorrow she would come back and tell the truth to everyone who mattered, and a lie to everyone who counted. She started the engine. She drove home. She would sleep, and she would dream of ice that didn't melt.
