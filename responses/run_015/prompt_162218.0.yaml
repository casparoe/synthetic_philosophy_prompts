  6.  **Final Polish:**

      *   Ensure the "Strongest Opposing View" is truly strong, not a strawman. It needs to sound like the regional panel member who prioritizes program survival.
      *   Make sure the recommendation on the CD is nuanced (not fired, but not cleared).
