  7.  *(Self-Correction on the "Openness" point)*: The prompt asks me to rule on whether openness counts. My stance: Openness *among elites* does not validate corruption. Transparency must be toward the *beneficiaries* or the *donor*. I will make this explicit.

  8.  *(Self-Correction on the "Local Staff" point)*: The prompt asks me to rule on this. My stance: Yes, it validates the complaint as internal cultural friction, not just HQ imposition.

  9.  *(Final Review of the 5 Practices)*:
      *   (a) Funeral: Cultural duty. Permitted.
      *   (b) Goats: Cultural/Religious duty + Public reciprocity. Permitted.
      *   (c) School Fees: Private benefit to gatekeeper. Prohibited.
      *   (d) Per Diems: Systemic issue. Permitted with caps/transparency.
      *   (e) Laptop: Asset mismanagement/Private benefit. Prohibited.

      *Wait, I need to make sure I don't sound like I'm ignoring the HQ hypocrisy.* I should mention it in the "New Rule" section to ensure the new rule applies to HQ too, or at least acknowledges the tension.

      *Let's finalize the "New Rule".*
      Current: No gifts.
      Proposed: "The Public Purpose Test."
      1. Is the recipient acting in a public capacity?
      2. Is the benefit public/ceremonial or private?
      3. Is it recorded?
