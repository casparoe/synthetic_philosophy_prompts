answer: |-
  The gap you are identifying is not merely a failure of dynamic consistency; it is a failure of *control attribution*. In standard dynamic choice problems, an agent at a node treats the probability of reaching that node as fixed by past choices. In the Absent-Minded Driver (AMD), the policy chosen *at the node* is identical to the policy chosen *ex ante*. Consequently, the choice at the node determines the probability of being at that node (via the likelihood of having continued from the start). The gap is between treating the policy as a causal parameter you set (ex ante) versus treating it as evidence for your location (intertemporal). If you treat it as evidence, you slide into Evidential Decision Theory (EDT); if you treat it as a causal fixed point, you cannot justify the ex ante optimal mix at the node without invoking a "modified control" assumption that many find metaphysically dubious.

  This leads directly to your second question, which is the load-bearing issue: **What is the ontological status of the probability "this is the first intersection"?**

  You are right to suspect that treating this as a standard self-locating credence creates trouble. If it is a rational credence, it ought to update on evidence. But your current action *is* the evidence. If you decide to continue with probability $p$, you alter the likelihood ratio of being at intersection 1 versus 2. This creates a feedback loop where the credence required to make the decision depends on the decision itself.

  The most defensible position is that this "probability" is not a credence the agent *has* at the node, but a **bookkeeping weight** derived from the ex ante policy. It is a shadow price. When you evaluate the node in isolation, you are essentially asking, "If I were a distinct agent placed here with weights assigned by the planner, what would I do?" The puzzle arises only because we insist on modeling the driver at the intersection as a full-blown rational agent with her own belief state, rather than as an executor of a prior plan. The "probability" is a parameter of the planning problem, not a doxastic state of the executing self. They do not have to agree because the executing self lacks the temporal indexicality required to hold a coherent belief about "which time it is" independent of the policy that brought her there.

  This brings me to your pet hypothesis and the Passenger Variant. Here is where I must correct you: **Your hypothesis is incorrect, and the Passenger Variant proves it.**

  You hypothesize that the loss in value (getting 4/3 instead of 4) is *agential* (inability to act on info) rather than *epistemic* (lack of info). You suspect adding a passenger who knows the location but can only say "now" or "wait" changes nothing.

  This is wrong. If the passenger can vary the signal (saying "Continue" at intersection 1 and "Exit" at intersection 2), the driver achieves the payoff of 4. Why? Because the *system* (driver + passenger) can distinguish the nodes, even if the driver's internal memory cannot. The constraint in AMD is not merely that the driver lacks memory; it is that the driver lacks *indexical discrimination* at the moment of choice. The visual input is identical at both nodes. Randomization (the mixed policy) is a substitute for discrimination: you simulate distinction by making your action probabilistic, effectively blurring the nodes to match your ignorance.

  If the passenger provides a distinct signal at each node, the informational symmetry is broken. The driver hears "Continue" at node 1 and "Exit" at node 2. She does not need to remember the past; she only needs to react to the present signal. The fact that this solves the problem demonstrates that the original loss was indeed **epistemic**. The "state aliasing" your RL friend mentioned is the core philosophical problem. The randomization isn't standing in for missing indexical information in a metaphorical sense; it is the *only* way to optimize given the aliasing. If you remove the aliasing (via the passenger), you remove the need for randomization and recover the first-best outcome. The loss is not that the driver cannot *execute* a plan; it is that the plan cannot be *conditioned* on location without external indexing.

  Regarding your final queries: The resemblance to Newcomb cases is superficial but instructive. In Newcomb, your choice is evidence of a past state (the predictor's move). In AMD, your choice is evidence of your *current* location (which is a function of past moves). Both violate the "action independence" assumption of Causal Decision Theory (CDT). However, AMD is distinct because it involves self-locating uncertainty, not just causal correlation.

  Finally, does a plan-based view dissolve the case? It dissolves the *tension*, but not the *problem*. If you take plans/intentions as the basic unit of rationality (à la Bratman or tenable versions of ex ante rationality), you simply refuse to evaluate the decision at the node. You say, "The rational unit is the trajectory, not the intersection." This avoids the dynamic inconsistency charge but leaves the metaphysics of the "agent at the node" unexplained. It effectively declares the driver at the intersection a non-agent, a mere puppet of the ex ante self. While coherent, this is a heavy bullet to bite if you want to maintain that rationality applies to actions as they occur.

  **Summary of Corrections:**
  1.  **The Gap:** It is about control attribution, not just consistency.
  2.  **The Probability:** It is a bookkeeping weight from the ex ante perspective, not a coherent local credence.
  3.  **The Hypothesis:** You are wrong about the Passenger Variant. The loss is epistemic (indexical discrimination), not purely agential. The passenger solves the aliasing, restoring the payoff to 4. Randomization is a tax paid for lack of indexical access.

  Focus your paper on the status of that probability. If you can argue that the "credence at the node" is a category error—a misapplication of Bayesian updating to a self-locating problem where the update rule depends on the action being evaluated—you will have a solid contribution. The Passenger Variant is your reductio: if information restores value, the original deficit was informational, not agential.
