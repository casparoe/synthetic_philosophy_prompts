answer: |-
  This is one of the most classic "3am Wikipedia spirals" in social choice theory. You are not misreading the conclusions, but you are colliding two theorems that operate in fundamentally different information universes.

  The short answer is: **Arrow assumes we only know *rankings* (ordinal). Harsanyi assumes we know *intensities* via risk behavior (cardinal).**

  Arrow proves you cannot aggregate rankings fairly. Harsanyi proves that *if* you can measure intensity (utility), you *must* aggregate via a weighted sum. They are not in conflict; Harsanyi simply assumes away the specific constraint that breaks Arrow.

  Here is the technical breakdown of where the axioms diverge, the mechanism of the divergence, and the honest verdict on whether Harsanyi "rescues" utilitarianism.

  ---

  ### 1. The Informational Base: Ordinal vs. Cardinal

  This is the root cause.

  *   **Arrow's World (Ordinal):** The input is a preference ordering $\succ_i$. We know Person 1 prefers $A$ to $B$. We do *not* know how much they prefer it. We cannot compare Person 1's preference strength to Person 2's.
      *   *Constraint:* Utilities are unique only up to **monotonic transformation**. If $U(A) > U(B)$, then $f(U(A)) > f(U(B))$ for any increasing function $f$. This destroys any ability to sum utilities, because I can stretch my utility scale infinitely without changing my ranking.
  *   **Harsanyi's World (Cardinal):** The input is Von Neumann-Morgenstern (vNM) utilities. These are derived from preferences over **lotteries** (risk).
      *   *Constraint:* Utilities are unique only up to **positive affine transformation** ($U' = aU + b$, where $a > 0$). This preserves ratios of differences. It allows us to say, "The gap between $A$ and $B$ is twice the gap between $B$ and $C$."

  **The Mechanism:** Arrow's impossibility arises because without intensity, you cannot make trade-offs. You can't say "Alice cares a little, Bob cares a lot, so Bob wins." You only know "Alice prefers A, Bob prefers B." Harsanyi allows the trade-off because the vNM axioms force preferences to reveal intensity through risk acceptance.

  ### 2. The Heavy-Lifting Axioms

  Here is where the specific logical machinery diverges.

  #### Arrow's Killer: Independence of Irrelevant Alternatives (IIA)
  Arrow's IIA states: *The social ranking of $A$ vs. $B$ must depend **only** on individual rankings of $A$ vs. $B$.*

  *   **Why it breaks things:** It forbids the system from looking at context. If everyone prefers $A \succ B$, society must prefer $A \succ B$, regardless of whether $C$ exists, or how much people love $C$.
  *   **The Consequence:** This prevents the aggregation rule from using information about *intensity* even if it existed. It forces the social welfare function to be "local" to each pair of options. This locality, combined with Unrestricted Domain, forces the system to fragment until a dictator emerges to resolve cycles.

  #### Harsanyi's Loophole: vNM Independence + Pareto
  Harsanyi does not use Arrow's IIA. He uses the **vNM Independence Axiom** (for both individuals and the "Impartial Observer").

  *   **The Axiom:** If you prefer Lottery $L_1$ to $L_2$, you must prefer a mixture of $L_1$ and $L_3$ to a mixture of $L_2$ and $L_3$ (with the same mixing probability).
  *   **The Mechanism:** This axiom is what generates **cardinality**. It forces the utility function to be linear in probabilities.
  *   **The Violation of Arrow's IIA:** Harsanyi's setup *violates* Arrow's IIA. In Harsanyi's world, the social value of $A$ is $W(A) = \sum a_i U_i(A)$. The value $U_i(A)$ is determined by the individual's preferences over *lotteries involving all possible outcomes*. Therefore, the social ranking of $A$ vs. $B$ *does* depend on preferences over other alternatives (the other outcomes in the lotteries used to calibrate the utility).
      *   *Example:* To know how much I value $A$, you might ask me to compare a sure thing $A$ vs. a 50/50 lottery of $B$ and $C$. My answer depends on $C$. Thus, $C$ is "relevant" to the ranking of $A$ vs. $B$. Arrow forbids this; Harsanyi requires it.

  #### Domain Restrictions
  *   **Arrow:** **Unrestricted Domain.** Any logically possible ordering of preferences is allowed (e.g., lexicographic preferences, cyclic preferences are ruled out by transitivity but any transitive order is in).
  *   **Harsanyi:** **Restricted Domain.** Individuals *must* satisfy vNM rationality. This is a massive restriction. It rules out preferences that cannot be represented by expected utility (e.g., Allais Paradox type preferences, or simple ordinal rankings that don't extend to risk).

  ### 3. The "Interpersonal Comparability" Trap

  This is the most subtle point where engineers often get stuck.

  *   **Arrow:** Explicitly assumes **No Interpersonal Comparison of Utility (NICU)**. It treats utility as meaningless ordinal data.
  *   **Harsanyi:** The theorem proves $W = \sum a_i U_i + b$. However, vNM utilities are unique only up to affine transformation ($aU+b$). To sum Alice's utils and Bob's utils, you must normalize their scales.
      *   Does 1 "util" for Alice equal 1 "util" for Bob?
      *   Harsanyi's *theorem* does not solve this mathematically. It just says "If you can compare them, it must be a sum."
      *   Harsanyi's *philosophical argument* (Veil of Ignorance) argues for equal weights ($a_i = 1$).
      *   **Crucially:** By even allowing the sum, Harsanyi assumes interpersonal comparability is *meaningful*. Arrow assumes it is *meaningless*.

  ### 4. Honest Verdict: Does Harsanyi Rescue Utilitarianism?

  **No.** Harsanyi does not rescue utilitarianism from Arrow; he sidesteps Arrow by changing the definition of the input.

  Here is the honest engineering assessment:

  1.  **Arrow is robust to information poverty.** Arrow says: "If all you have are ballots (rankings), you cannot count them fairly." This remains true. Harsanyi does not disprove this.
  2.  **Harsanyi is fragile to information richness.** Harsanyi says: "If you have full access to everyone's risk preferences and accept vNM rationality, you should sum utilities."
      *   **Problem 1 (Measurement):** In the real world, we do not have vNM utilities. We have votes. Extracting vNM utilities requires asking people millions of lottery questions.
      *   **Problem 2 (Normalization):** Even if we had vNM utilities, we still have the "Zero and Unit" problem. How do we normalize Alice's scale to Bob's? Harsanyi's theorem leaves the weights $a_i$ undetermined. You need a *moral* axiom (like "equal weight") to get strict Utilitarianism. Arrow's impossibility still applies to the problem of choosing those weights fairly if you only have ordinal data.
      *   **Problem 3 (vNM Validity):** Humans violate vNM axioms (Prospect Theory, Allais Paradox). If individuals aren't vNM rational, Harsanyi's derivation collapses. Arrow's theorem still holds because it doesn't assume vNM rationality.

  ### Summary of Divergence

  | Feature | Arrow's Impossibility | Harsanyi's Aggregation |
  | :--- | :--- | :--- |
  | **Input Data** | Ordinal Rankings ($A \succ B$) | Cardinal Utilities (via Risk/Lotteries) |
  | **Key Axiom** | **Arrow's IIA** (Social choice on $A,B$ depends *only* on individual $A,B$) | **vNM Independence** (Preferences linear in probability) |
  | **Domain** | Unrestricted (Any transitive order) | Restricted (Must satisfy vNM axioms) |
  | **Comparability** | Interpersonal comparison forbidden/meaningless | Interpersonal comparison assumed possible (via normalization) |
  | **Result** | Dictatorship (if keeping other axioms) | Weighted Utilitarianism (Linear Sum) |
  | **Why?** | No intensity info $\rightarrow$ No trade-offs possible. | Intensity info $\rightarrow$ Trade-offs forced to be linear. |

  ### Where you were misreading

  You wrote: *"One says aggregation is hopeless and the other says there's exactly one right answer and it's utilitarianism."*

  *   **Correction on Arrow:** Aggregation of *ordinal* preferences is hopeless.
  *   **Correction on Harsanyi:** Aggregation of *cardinal vNM* preferences is uniquely linear, **provided** you accept the axioms of expected utility and can solve the normalization problem.

  **The Synthesis:**
  Harsanyi's theorem is essentially: *"If you manage to escape Arrow's informational constraints by measuring cardinal utility via risk, then Utilitarianism is the only consistent aggregation method."*

  It doesn't prove Utilitarianism is "true" in the real world; it proves Utilitarianism is the **internal logic of the vNM framework**. If you accept the vNM framework (which bypasses Arrow's IIA), you inherit Utilitarianism. If you stick to the voting framework (which obeys Arrow's IIA), you inherit Impossibility.

  They are consistent because they describe different machines. Arrow describes a voting machine. Harsanyi describes a welfare calculator that requires risk-profile data. The tragedy of social choice is that we usually only have the voting machine.
