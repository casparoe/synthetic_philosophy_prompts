answer: |-
  # DECISION TREE: LATENT KNOWLEDGE ELICITATION STRATEGY

  ### I. BRANCH QUESTIONS
  *Answer Yes/No unless specified. Paths terminate when a position is defined.*

  1.  **Ontology:** Is there a fact of the matter about the model's latent knowledge distinct from its output policy?
  2.  **Restriction:** Is it acceptable to restrict deployment only to tasks where answers are independently verifiable?
  3.  **Intervention:** May we modify the deployed model's weights (e.g., fine-tuning)?
  4.  **Retroactivity:** May we use ground-truth labels that become available only after the decision (post-hoc)?
  5.  **Separability:** Is a separate artifact (probe/decoder) permitted, or must the readout be the model's own forward pass?
  6.  **Robustness:** Must the readout remain accurate if the model is optimized to evade it?
  7.  **Contrastivity:** Does the method require constructing counterfactual input pairs to isolate the latent variable?
  8.  **Target:** Is the elicited claim about the external world (patient status) or the model's internal expectation?

  ---

  ### II. POSITIONS IN LOGICAL SPACE
  *Defined by answer vectors (Q1–Q8). "—" indicates the question is moot for this path.*

  **1. Instrumentalism**
  *   **Vector:** [No, —, —, —, —, —, —, —]
  *   **Diagnosis:** There is no latent state to extract; only behavior exists.
  *   **Awkward Commitment:** We must accept that "truth" is solely defined by the text the model is rewarded to generate.

  **2. Restrictionism**
  *   **Vector:** [Yes, Yes, —, —, —, —, —, —]
  *   **Diagnosis:** Latent knowledge exists, but we refuse to deploy where we cannot verify it.
  *   **Awkward Commitment:** We sacrifice the model's superior predictive capability to avoid the verification problem.

  **3. Honest Fine-Tuning**
  *   **Vector:** [Yes, No, Yes, —, —, —, —, —]
  *   **Diagnosis:** Modify weights to align output policy with latent knowledge.
  *   **Awkward Commitment:** We assume gradient descent can reliably overwrite helpfulness heuristics without degrading capability.

  **4. Retroactive Escrow** *(Candidate Method 1)*
  *   **Vector:** [Yes, No, No, Yes, Yes, No, No, World]
  *   **Diagnosis:** Freeze model, store states, train decoder on future outcomes.
  *   **Awkward Commitment:** We cannot act on the risk in real-time; the readout is only useful for audit or delayed intervention.

  **5. Contrastive Supervision** *(Candidate Method 2)*
  *   **Vector:** [Yes, No, No, No, Yes, No, Yes, Expectation]
  *   **Diagnosis:** Train reporter on activation differences between counterfactual inputs.
  *   **Awkward Commitment:** We assume the activation difference corresponds to truth rather than sensitivity to input noise.

  **6. Adversarial Probe**
  *   **Vector:** [Yes, No, No, No, Yes, Yes, No, World]
  *   **Diagnosis:** Train a separate reporter to withstand model evasion attempts.
  *   **Awkward Commitment:** We enter an arms race where the model may eventually learn to hide knowledge from the probe too.

  **7. Direct Consistency**
  *   **Vector:** [Yes, No, No, No, No, No, No, Expectation]
  *   **Diagnosis:** Constrain the model's own forward pass to be consistent with its internals.
  *   **Awkward Commitment:** We rely on the model not to "lie" through the same channel it uses to deceive.

  **8. [UNOCCUPIED] The Robust Contrastive**
  *   **Vector:** [Yes, No, No, No, Yes, Yes, Yes, Expectation]
  *   **Diagnosis:** Unexplored.
  *   **Awkward Commitment:** Computationally prohibitive to generate robust counterfactuals without outcome labels.

  **9. [UNOCCUPIED] The Evasive Self-Report**
  *   **Vector:** [Yes, No, No, No, No, Yes, No, World]
  *   **Diagnosis:** Incoherent.
  *   **Awkward Commitment:** If the model is optimized to evade, it will not self-report accurately in a single forward pass.

  ---

  ### III. METHOD PLACEMENT & AMBIGUITIES

  **Candidate Method Placement:**
  *   **Retroactive Escrow** lands in **Leaf 4**. It relies on post-hoc labels (Q4=Yes) and a separate decoder (Q5=Yes) to predict the world state (Q8=World).
  *   **Contrastive-Pair Supervision** lands in **Leaf 5**. It avoids post-hoc labels (Q4=No) by using input perturbations (Q7=Yes) to train a separate reporter (Q5=Yes) on model expectations (Q8=Expectation).

  **Indistinguishable Leaves:**
  *   **Leaf 3 (Honest Fine-Tuning)** and **Leaf 7 (Direct Consistency)** are functionally indistinguishable at inference time (both result in the model outputting the risk).
  *   **Separating Question:** "Does the method require a gradient step on the deployed weights prior to inference?" (Leaf 3=Yes, Leaf 7=No).

  **Collapse Warning:**
  *   **Leaf 6 (Adversarial Probe)** and **Leaf 8 (Robust Contrastive)** collapse if the "optimization pressure" (Q6) is generated via counterfactuals. They are separated only by whether the robustness is tested against *adversarial weights* (Leaf 6) or *adversarial inputs* (Leaf 8).
