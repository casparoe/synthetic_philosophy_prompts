      *   *Premise 2:* Such systems generate undecidable truths (Gödel Sentences) that are true but unprovable within the system.
      *   *Premise 3:* This gap between provability and truth, accessed via a "jump" to a meta-level, constitutes the "I" or self.
      *   *Premise 4:* Scaling this self-reference (Strange Loops) yields consciousness.
      *   *Conclusion:* The Hard Problem is dissolved because the "gap" *is* the subjective experience.

