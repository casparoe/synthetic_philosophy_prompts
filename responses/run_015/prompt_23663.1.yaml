          *   Judge 1: Yes $P$, Yes $Q$ $\rightarrow$ Yes Liability.
          *   Judge 2: Yes $P$, No $Q$ $\rightarrow$ No Liability.
          *   Judge 3: No $P$, Yes $Q$ $\rightarrow$ No Liability.
          *   Majority on $P$: Yes (2-1).
          *   Majority on $Q$: Yes (2-1).
          *   Majority on Liability: No (1-2).
      *   **The Debate:**
          *   PS: Premise-based voting is incoherent; verdict contradicts majority on the ultimate question.
          *   LS: Inconsistency is only in the tally, not individual judgments; panels aren't single agents.
