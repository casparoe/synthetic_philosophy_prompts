          *   LS Claim: Only individuals have minds; collectives don't have "opinions" in the same way.
          *   *Analysis:* PS is stronger on *institutional* logic. LS is stronger on *ontological* caution. However, in law, institutions *act* as agents. If the court's ruling implies $P$ and $Q$ but not $P \land Q$, it violates logical closure.
          *   *Verdict:* PS has the stronger practical point; LS has a valid philosophical caveat but dodges the institutional reality.

