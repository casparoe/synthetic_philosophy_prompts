      *   *Correction on Round 2:* LS suggests voting on the conclusion. PS says this relocates the trouble. PS is right. If you vote on conclusion, you might get Liability = Yes, even if Majority says Not Signed and Not Intended. (Wait, let's check the math).
          *   *Scenario Check:*
              *   J1: P, Q $\rightarrow$ L
              *   J2: P, ~Q $\rightarrow$ ~L
              *   J3: ~P, Q $\rightarrow$ ~L
              *   Majority P: Yes. Majority Q: Yes. Majority L: No.
          *   *If CBP (Vote on L):* Result is Not Liable.
          *   *PS's Counter:* If the votes were different (e.g., J2: ~P, ~Q $\rightarrow$ ~L; J3: ~P, ~Q $\rightarrow$ ~L), Majority P=No, Majority Q=No, but maybe Majority L=Yes?
          *   *Actually, the standard paradox is:* PBP yields Liable, CBP yields Not Liable.
          *   *PS's point in Round 3:* "Voting on the conclusion lets the majority convict on a ground that no majority endorses." This refers to the reverse case. If the panel votes on Liability directly, they might find Liability (2-1), but a majority thinks P is false and a majority thinks Q is false. So the defendant is liable even though the majority thinks he didn't sign and didn't intend. This is the "reverse paradox." I need to explain this clearly.
      *   *Ecologist Analogy:* Ecosystem management. Do we vote on "Is the water clean?" and "Is the fish population stable?" to decide "Is the park healthy?" Or do we just vote "Is the park healthy?" If we do the former, we might say "Yes, Yes" but "No" on health. If we do the latter, we might say "Yes" on health even if most think water is dirty. This resonates well.

