      *   **Content Check:** Ensure the distinction between the *Doctrinal Paradox* (legal focus) and *Discursive Dilemma* (philosophical focus) is clear but not pedantic. Ensure the List & Pettit impossibility theorem is mentioned as backing for the PS.

  6.  **Refining the Arguments (Self-Correction during drafting):**
