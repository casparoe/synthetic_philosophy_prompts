answer: |-
  You have identified a very real and frustrating rhetorical pattern, but you are correct that the standard label ("the heterogeneity problem") is insufficient. The heterogeneity problem is a *static* observation (pleasures feel different from one another). What you are describing is a *dynamic* maneuver—a strategic shifting of goalposts that happens in real-time during argumentation.

  There is no single canonical name for this specific oscillation in the literature, though it is a composite of several known fallacies. The closest existing structural analogy is the **Motte-and-Bailey doctrine**, and the logical mechanism is **Equivocation** aided by a **No True Scotsman** exclusion.

  However, since you asked for a term that captures the specific *elasticity* of the concept (stretching to include, shrinking to exclude), I propose we coin this:

  ### **Defensive Conceptual Elasticity**

  Here is the breakdown of what this phenomenon is, what it isn't, and how to distinguish it from legitimate philosophical refinement.

  ---

  ### 1. What It Is: Defensive Conceptual Elasticity
  This occurs when a theorist treats a concept (like "pleasure") as having an elastic boundary that expands or contracts solely based on argumentative pressure, rather than independent criteria.

  *   **The Stretch (Expansion):** When the theory is attacked for being too narrow (e.g., "Hedonism can't account for the value of knowledge"), the definition stretches to include attitudinal states, engagement, or approval. This maximizes the *extension* of the term to save the theory's coverage.
  *   **The Shrink (Contraction):** When the theory is attacked for being too broad (e.g., "But sadists feel approval/engagement too"), the definition shrinks to exclude those cases via a normative filter ("That isn't *true* pleasure"). This maximizes the *intension* of the term to save the theory's normative purity.

  **Why "Elasticity"?** Unlike "conceptual stretching" (which implies a permanent loss of precision), elasticity implies the concept snaps back to its original shape when convenient. It retains the *prestige* of the narrow definition (sensory immediacy) while claiming the *utility* of the broad definition (universal coverage).

  ### 2. What It Is Not
  To use this term accurately, we must distinguish it from three related but distinct phenomena:

  *   **It is not the Heterogeneity Problem:**
      *   *Heterogeneity* is the claim that pleasures are phenomenologically diverse (the feeling of sunbathing is different from solving math). This is a descriptive claim about the *contents* of the category.
      *   *Elasticity* is a meta-claim about the *boundaries* of the category. A hedonist can acknowledge heterogeneity without being elastic (e.g., "All these diverse feelings share a common neural signature"). Elasticity arises when the *criteria for entry* change mid-argument.
  *   **It is not Simple Equivocation:**
      *   *Equivocation* is using the same word with two different meanings.
      *   *Elasticity* is more subtle: the theorist claims it is the *same* meaning, but one that is context-sensitive. They argue they are "refining" the concept, not changing it. The fallacy lies in the *motivation* for the refinement (avoiding counterexamples) rather than the ambiguity itself.
  *   **It is not Legitimate Refinement:**
      *   Philosophical concepts often start vague and get sharper. This is necessary progress.
      *   *Elasticity* is distinguished by its *reactivity*. Legitimate refinement is usually systematic and applied consistently going forward. Elasticity is ad hoc and applied only to the specific counterexample at hand.

  ### 3. The Boundary: Legitimate Refinement vs. Ad Hoc Rescue
  You asked for the boundary between fixing a definition and committing this fallacy. The line is drawn at **Independent Criteria.**

  #### **Legitimate Refinement (The "Ex-Ante" Test)**
  A theorist is refining a concept legitimately if they can state the criteria for the new definition *before* the counterexample is raised, or if the criteria apply universally to all cases (including the ones they like and dislike).
  *   *Example:* "We define pleasure as 'conscious sensory approval.' This excludes sadistic satisfaction because sadism often involves a lack of approval of the *state itself*, or involves pain." (This is risky, but it attempts an independent criterion).
  *   *Key:* The boundary is fixed. If the new definition excludes chocolate eating, the theorist must accept that cost.

  #### **Defensive Conceptual Elasticity (The "Ex-Post" Test)**
  The fallacy occurs when the criteria for inclusion/exclusion are generated *after* the counterexample appears, specifically to rescue the intuition.
  *   *Example:* "Pleasure is approval." -> *Critic:* "What about approval of cruelty?" -> *Theorist:* "Well, approval of cruelty isn't *intrinsic* approval."
  *   *Key:* The boundary moves. The theorist wants the definition to include the "good" cases (chocolate, math) and exclude the "bad" cases (sadism, drugs) without paying a theoretical cost (like admitting some "pleasures" are bad).

  ### 4. Historical Context & Application
  This oscillation is the engine behind the history of Hedonism.
  *   **Epicurus:** Stretched "pleasure" to mean "absence of pain" (ataraxia) to avoid the charge of debauchery, but shrank it back when critics said that was just being dead.
  *   **J.S. Mill:** Famous for this elasticity. He stretched pleasure to include "higher faculties" to answer the "swine objection," but then shrank it by claiming those who know both prefer the higher, effectively defining "real" pleasure as "what good people like."
  *   **Modern Attitudinal Hedonism (e.g., Feldman):** Defines pleasure as "taking attitude of delight in a state of affairs." When faced with the "delight in evil" objection, they often resort to distinguishing "intrinsic" vs. "extrinsic" delight in ways that look suspiciously like Defensive Conceptual Elasticity.

  ### Summary for Usage
  If you encounter this in debate, you can say:

  > "You are engaging in **Defensive Conceptual Elasticity**. You are stretching the definition of pleasure to cover high-minded goods when challenged on scope, but shrinking it to exclude base goods when challenged on normativity. Unless you can provide an **independent criterion** for what counts as pleasure that applies consistently to both chocolate and solidarity *before* we evaluate their moral worth, you are not refining a theory; you are smuggling your conclusions into your premises."

  This distinguishes the move from simple confusion and pins it as a specific methodological error in theory construction.
