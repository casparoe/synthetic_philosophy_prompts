answer: |-
  **The Toast**

  For those who don't know me, I'm the one who once spent eleven hours debugging a race condition with Ruth without either of us raising our voice. In this industry, that is the only credential that matters. It proves two things: that she is technically brilliant, and that she possesses a patience I suspect is actually a form of superpower.

  Ruth has been here longer than anyone else. She wrote the scheduler that keeps our customers running. If you've ever wondered why a build finishes when it does, you have Ruth's logic to thank. But Friday is her last day in this office. She has asked me not to use the word that usually accompanies this moment, and she has asked me not to mention figures, dates, or sums of money. So I will simply say she is moving on.

  What she is moving toward is interesting. She is taking over maintenance of an open-source library that half the industry depends on but nobody pays for. She is spending part of her week teaching people to fix their own washing machines at a community workshop. And she has started learning the cello. She admits she is playing it badly, but she is playing it.

  Nearly a century ago, an economist wrote an essay suggesting that within a hundred years, technology would solve the problem of subsistence. He argued we would work very little, and then face a much harder problem: what to do with our freedom. He worried that we have been trained for centuries to be purposive, to defer enjoyment, to treat accumulation as a virtue rather than a means. He suggested that loving money for its own sake would eventually be seen as a rather unpleasant sickness.

  Looking at Ruth, I find myself wondering where she fits in that prediction. She is not stopping work. She is choosing work that offers no salary, no status, and no clear completion date. Fixing washing machines is never finished; open-source issues never close; learning an instrument is a lifelong struggle against your own limitations.

  So is this the freedom the economist described? Or is it simply the same purposive temperament wearing a cheaper outfit? Is she escaping the struggle for subsistence, or has she just redefined what subsistence looks like? I don't think there is a clean answer, and I suspect Ruth wouldn't want one. The value isn't in solving the puzzle, but in choosing which puzzle to solve.

  I know this change looks different to different people in this room. To some, it looks like a rare gift being set aside. To others, it might look like a luxury they cannot yet afford. I want to be clear: choosing to stay is not a failure. Those of us remaining here, keeping the lights on, are doing work that matters. We are building the tools that allow others to have choices. There is honour in the building, just as there is honour in the repair.

  Ruth is not telling us how to live. She is simply showing us that there is more than one way to be useful. She is trading the security of the known for the uncertainty of the useful. That takes courage, whether you are leaving or staying.

  So, if everyone could raise their plastic glasses. To Ruth: may your builds pass, may your washing machines spin, and may your cello sound better next year than it does today. To us: may we recognize the value in what we build, and the freedom in what we choose.

  To Ruth.

  ***

  **Note to the Speaker**

  **Corrections on Keynes:** Your summary is remarkably accurate for a non-specialist. The essay is *Economic Possibilities for our Grandchildren* (1930). The quote about the love of money as a possession being a "disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease" is verbatim. The biblical allusion is indeed to the lilies of the field (Matthew 6:28), which Keynes uses to illustrate a future where we don't toil anxiously. You haven't made any substantive errors.

  **Reading of Keynes:** The toast leans on the *moral* ambiguity of Keynes's prediction rather than the economic mechanics. Keynes assumed the "economic problem" would be solved externally by technology. The toast questions whether Ruth has solved it internally by changing her relationship to work. This reading is contested; some scholars argue Keynes underestimated the human desire for status competition, meaning we never actually feel "rich enough" to stop striving, regardless of subsistence.

  **What Would Change the Speech:** If Ruth's plans were purely leisure (e.g., travelling, resting) rather than unpaid labour (maintenance, repair, practice), the Keynesian tension would vanish. The speech relies on the fact that she is still *working*, just without pay. If she were stopping work entirely, the speech would need to pivot to the virtue of rest rather than the virtue of chosen purpose.

  **Likely Failure Point:** The paragraph beginning "Nearly a century ago..." is the riskiest. In a pub at 4:30 PM, abstract economic philosophy can feel like a lecture. If you sense the room drifting, shorten the Keynes summary to a single sentence ("An economist once wondered what we'd do when we didn't have to work") and move faster to the question of whether Ruth is free or just busy.
