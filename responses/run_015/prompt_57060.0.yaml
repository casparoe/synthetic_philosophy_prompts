answer: |-
  **Elena:** We must reject the shift to loans. Middeland's current model treats education as a public good. Yes, graduates earn more, but our progressive tax system already recoups that premium over a lifetime. To charge upfront is to ignore that the state already captures the return.

  **Marcus:** And yet, capacity is stalled. We have oversubscribed fields turning away qualified applicants. Converting the maintenance grant to an income-contingent loan frees immediate fiscal space to expand places. The write-off is generous; no one pays unless they thrive.

  **Elena:** But this resurrects the charge that free tuition is a regressive subsidy. I will own that: under my model, non-graduates, who are often poorer, contribute via general taxation to the upkeep of graduates, who are often richer. That is the price of solidarity. But your model pretends to solve this while masking the same subsidy. If the write-off is generous, your loan is simply a graduate tax by another name. Why the accounting trick?

  **Marcus:** Because psychology drives behaviour. A tax feels like a loss; a loan feels like an investment. But I will concede my own discomfort: in a contingent system, the state bears the financial risk of non-repayment. This creates a hidden contingent liability on the public balance sheet. We are insuring individual earnings risk without transparently budgeting for the inevitable write-offs. That opacity threatens future fiscal stability.

  **Elena:** Opacity aside, does the label change the economics? If the repayment threshold is high enough, the expected revenue is identical to a surcharge on income. The difference is merely whether we call it debt or tax.

  **Marcus:** It changes the margin. Students respond to sticker prices. But let's talk about that response. You claim debt aversion doesn't deter participation, only choice.

  **Elena:** Precisely. The evidence suggests upfront costs don't stop entry so much as they steer students away from longer degrees or lower-earning fields. If we introduce loans, we won't necessarily see fewer students, but we will see risk-averse students clustering in vocational short-cycles, exacerbating skills shortages in humanities or basic sciences.

  **Marcus:** But if debt aversion affects field choice, it also affects completion. A student worried about accumulating liability may work excessive hours, lowering their grades. My proposal expands places in oversubscribed fields, directly addressing the bottleneck. What would move you to accept the loan?

  **Elena:** If you could demonstrate that the expansion in places yields a social return higher than the cost of the risk premium the state absorbs. And you?

  **Marcus:** If the participation elasticity to upfront price is zero. If debt truly doesn't deter the marginal student from the poorest backgrounds.

  **Elena:** Then we are not far apart. You worry about the fiscal opacity of the write-off; I worry about the behavioural distortion of the debt label.

  **Marcus:** So the dispute turns on the discount rate. You value the certainty of the grant for the student highly; I value the capacity expansion funded by the deferred revenue.

  **Elena:** No, it turns on the write-off threshold. If it is truly generous, you admit it is a tax. If it is not, you admit the risk falls back on the low earner.

  **Marcus:** Agreed. The parameter is the probability of repayment at the median graduate income. If that is below fifty per cent, I am taxing the future to spend today. If above, you are charging insurance premiums for risk that doesn't exist.

  **Elena:** Then let us model that probability before we vote.

  ***

  **Note on the Economics (Outside the Fiction)**

  **Settled vs. Contested Claims:**
  *   **Settled:** Income-contingent loans (ICLs) with high write-off thresholds function economically similarly to graduate taxes (difference is largely legal/accounting). Progressive income tax systems do recoup a portion of the graduate premium. Debt aversion exists among low-income populations.
  *   **Contested:** The magnitude of debt aversion's impact on *participation* versus *field choice/completion* is empirically disputed. Some studies show upfront costs deter entry; others suggest ICLs neutralize this. The extent to which free tuition is regressive (subsidizing the rich) depends heavily on the progressivity of the wider tax system and graduation rates by income quintile, which varies by country.

  **Flagged Assertions:**
  *   **Elena's claim:** That debt aversion affects field choice *more* than participation is a live empirical debate, not a fact.
  *   **Marcus's claim:** That the psychological distinction between "loan" and "tax" significantly alters investment behaviour independently of financial incentives is contested in behavioural economics.
  *   **Both:** The assumption that expanding places in oversubscribed fields automatically yields a higher social return is an assumption, not an established fact.

  **Liberties Taken:**
  *   **Fiscal Opacity:** Marcus argues ICLs create opaque liabilities. In modern accounting (e.g., IFRS), these are increasingly recognized on balance sheets, though valuation remains difficult.
  *   **Risk Bearing:** The dialogue simplifies "risk." In ICLs, the state bears *financial* risk (non-repayment), but the borrower often bears *policy* risk (changes to thresholds/terms). The dialogue treats the state's financial risk as the primary discomfort for the loan defender.
  *   **Binary Choice:** Real-world reforms often hybridize systems (e.g., small tuition fees with strong grants), whereas the dialogue presents a binary switch for dramatic clarity.
