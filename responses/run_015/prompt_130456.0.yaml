  I'm drafting a proposal for a one-semester graduate research seminar—approximately 5,000 words, one term—on a question that takes Quine's thesis of radical translation indeterminacy, centered on the classic 'gavagai' scenario, but deliberately moves it out of the well-trodden territory of empirical observation sentences and into normative practice-language. The specific idea is this: Quine argues that behavioral evidence alone underdetermines whether a native speaker's utterance should be translated as referring to rabbits, undetached rabbit parts, or temporal rabbit-stages, but he largely assumes the domain is observational discourse governed by stimulus conditions. I want to ask whether the same underdetermination holds for injunctions that coordinate collective action—sentences that could be rendered either as normative obligations ("it is obligatory that we redistribute") or as causal descriptions of compelled behavior ("we are causally compelled to redistribute")—where the observable evidence (ritualized distribution patterns, sanctions for deviation, verbal assent, emotional displays) might be structurally identical but the functional role in social coordination differs radically. The research question, precisely stated: does Quine's argument for translation-manual indeterminacy apply with equal force to normative practice-language, or does the inter-subjective stability required for successful action coordination impose a non-behavioral constraint that can fix translation without smuggling in analytic truths, mentalism, or realist moral properties?

  The proposal should explain why existing positions leave this open—specifically, whether Quine intended his thesis to extend beyond observational discourse into the normative domain, and whether later discussions of manual choice have implicitly assumed that simplicity and predictive power are sufficient without testing them against coordination-functional criteria. The method should be spelled out concretely: I plan to construct two rival, behaviorally equivalent translation manuals for a hypothetical normative community, apply Quine's own criteria for manual selection (simplicity, predictive success, elegance), and then test whether an additional "inter-subjective action-stability" condition can break the tie without collapsing into behaviorism or invoking unreduced mental states. I also need an honest scope assessment: can this be completed in one semester without becoming either pure Quine exegesis or an empirical anthropology project? Finally, I want clear failure conditions—e.g., if the two manuals turn out to be not just behaviorally but also coordinatively equivalent, rendering the constraint useless, or if the coordination condition secretly presupposes the very normative realism Quine's framework is meant to avoid—and a description of what a successful result would actually look like: likely not a proof that normative translation is fully determinate, but a sharpened distinction between empirical and normative indeterminacy that clarifies whether cross-cultural moral disagreement can ever be genuine disagreement about shared content rather than mere variation between translation manuals. I will supply all citations and references myself; please do not include a bibliography, reading list, or requests for specific texts.
