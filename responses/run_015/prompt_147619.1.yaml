answer: |-
  This is a classic tension within the Effective Altruism (EA) community, and your intuition is not just "emotion"—it points to specific, documented weaknesses in the "Earn to Give" (E2G) model. Your friend is operating on a **utilitarian calculus** (maximize total units of good), while you are pointing out **structural ethics** (complicity, systemic harm, and the value of solidarity).

  To help you articulate this without resorting to "capitalism bad," you need to show her that her "math" is actually incomplete. She is treating variables as constants when they are actually contested.

  Here is a map of the logical gaps in her argument, broken down into four key areas you can discuss.

  ### 1. The "Negative Externalities" of the Income Source
  Her calculation assumes her income is morally neutral—that the $200k is clean fuel. But in strategy consulting, the product *is* often efficiency optimization, which frequently means labor reduction, rent extraction, or enabling industries that worsen the very problems you fight.

  *   **The Flaw:** She is calculating **Gross Impact** (lives saved via donation) without subtracting **Negative Impact** (harm caused via consulting).
  *   **The Argument:** If her firm advises a private equity firm on how to maximize yield from multi-family housing units, that advice often leads to rent hikes and evictions. If she funds 10 malaria nets but her work contributes to the displacement of 5 families in your city, the "net positive" shrinks drastically.
  *   **The Question for Her:** "How are you factoring the *counterfactual harm* of your specific projects into your equation? If your work accelerates the machinery of displacement, does the donation offset that specific harm, or are you just paying for a license to operate?"

  ### 2. The "Measurability Bias" (Goodhart's Law)
  She values the malaria charity because the metrics are clean (cost per life saved). You value legal aid because the metrics are messy (dignity, community stability, precedent).

  *   **The Flaw:** **Metric Fixation.** Just because something is hard to measure doesn't mean it isn't real. Malaria nets have a clear "proximate cause" (net $\rightarrow$ no mosquito $\rightarrow$ no death). Legal aid prevents a *cascade* of poverty (eviction $\rightarrow$ homelessness $\rightarrow$ job loss $\rightarrow$ health crisis $\rightarrow$ death). That cascade is hard to track in a spreadsheet, but it is statistically real.
  *   **The Argument:** By prioritizing only what is measurable, E2G often ignores **systemic resilience**. Your work creates friction in a system designed to grind people down. That friction has value, even if it doesn't produce a "life saved" certificate.
  *   **The Question for Her:** "Are we valuing these charities because they are the *most* effective, or because they are the *easiest* to measure? If we can't measure the dignity of a family staying in their home, does that mean it has zero moral weight?"

  ### 3. The Replaceability Argument
  This is a core concept in EA that she might be misapplying. E2G relies on the idea that if you don't take the high-paying job, someone else will, so you might as well take it and donate the money.

  *   **The Flaw:** This applies differently to consulting vs. legal aid.
      *   **Consulting:** If she declines the offer, the firm will hire another smart grad. The harmful work gets done either way. Her *marginal* impact might be low.
      *   **Legal Aid:** These roles are chronically underfunded. If *you* don't take the job, that specific tenant might not get representation. Your marginal impact is incredibly high because the resource (you) is scarce.
  *   **The Argument:** Her $200k donation is fungible (money is interchangeable). Your labor is not. There is a surplus of consultants; there is a deficit of eviction lawyers.
  *   **The Question for Her:** "In your model, how are you weighting 'replaceability'? If you don't take the consulting job, the work gets done by someone else. If I don't take this legal aid job, this tenant gets no help. Doesn't scarcity of labor change the math?"

  ### 4. Moral Licensing and Systemic Maintenance
  This is the philosophical heavy lifter. Her model suggests that harm and good are fungible credits and debits that can cancel each other out.

  *   **The Flaw:** **Moral Licensing.** The psychological risk that donating allows one to be less ethical in their daily work. But deeper than that is the **Systemic Maintenance** argument. By funneling massive wealth into charity without changing the source of the wealth, you maintain the status quo that generates the need for charity.
  *   **The Argument:** Malaria nets treat the symptom; fighting eviction fights the mechanism of wealth extraction. If everyone followed her model, we would have a world with massive wealth inequality where the rich philanthropically manage the suffering of the poor, rather than fixing the structures causing the suffering.
  *   **The Question for Her:** "Does your model account for the long-term goal? Are we trying to manage suffering within the current system, or change the system so the suffering doesn't happen? If we all 'Earn to Give,' do we lose the political will to fix the root causes?"

  ### How to De-escalate the Conversation
  The tension is high because she feels you are attacking her morality, and you feel she is attacking your intelligence. Try shifting the frame from **"Who is better?"** to **"What are the risks of each path?"**

  You could say something like:
  > "I've been thinking about your point on the math, and I agree that we should try to be rational about impact. But I think the math is missing a few variables. I'm worried that your model treats the income as neutral when it might be actively harmful, and it treats my impact as zero because it's hard to measure. I'm not saying my path is perfect, but I think your 'net positive' calculation is riskier than it looks because it relies on the system staying broken enough to need your donations."

  ### Summary for your mental map:
  1.  **Income isn't neutral:** Consulting often drives the harm you mitigate.
  2.  **Metrics aren't truth:** Unmeasurable dignity is still valuable.
  3.  **Scarcity matters:** Lawyers are scarcer than consultants.
  4.  **System vs. Symptom:** Charity manages suffering; law can prevent it.

  You don't need to prove she is "wrong" to validate your own choice. You just need to show that her "objective math" is actually built on subjective assumptions about value, harm, and replaceability.
