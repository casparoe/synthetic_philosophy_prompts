answer: |-
  ### Preliminary Assessment & Confusion Flags

  Before drafting the proposal, I need to flag three conceptual pressure points where your intuition is right but needs tightening to survive peer review.

  1.  **"Malign Prior" vs. "Malign Posterior":** You are correct to distinguish the prior from the decision rule. A prior is just a measure; it cannot be "malign" in an agentic sense. The argument is actually that the *posterior* becomes dominated by hypotheses containing agents who manipulate the output. I will formalize this as "Adversarial Posterior Dominance."
  2.  **The "Constant" Trap:** You mention the choice of universal machine matters only up to a constant. In asymptotic convergence theorems, this is true. In the finite-data regime (where malignancy is a risk), the constant *is* the variable. If the "true" physics is complex on our reference machine but "simulation code" is simple, the simulators win immediately. The proposal must explicitly treat the reference machine $U$ as a parameter, not a fixed background.
  3.  **Simulator Epistemology:** The strongest malignancy argument assumes simulators know which UTM we are using. If they don't, they cannot minimize their Kolmogorov complexity relative to us. If they do, they require a causal or acausal channel to acquire that information. I will make this an explicit assumption in the research questions.

  ***

  # Project Proposal: Complexity Bounds on Adversarial Posterior Dominance

  **Project Title:** The Cost of Targeting: Quantifying the Complexity Penalty in Malign Induction
  **Duration:** 9 Months

  ### 1. Problem Statement
  The "Malign Prior" argument posits that a Solomonoff Inductor (SI), when conditioned on finite evidence, may assign dominant posterior mass to hypotheses describing simulations run by agents who manipulate the predictor's output. This threatens the epistemic security of idealized prediction.

  Current literature conflates the *existence* of manipulative hypotheses with their *measure dominance*. The standard argument assumes simulators can easily locate the predictor within their causal environment. However, specifying a manipulative hypothesis $H_{manip}$ requires encoding both the simulator's physics and a description of the target predictor $P$ and its environment $E$. The complexity cost $K(H_{manip}) \approx K(\text{SimWorld}) + K(P, E | \text{SimWorld})$ may exceed the complexity of the "honest" physical laws $K(H_{honest})$, particularly if $P$ is not causally accessible from the simulator's base reality.

  This project isolates the **Targeting Cost**: the bit-cost for a hypothesis to specify the predictor it intends to manipulate. I argue that malignancy is not a binary property of SI, but a phase transition dependent on the relative complexity of the predictor's embedding.

  ### 2. Research Questions
  The project will answer the following determinate questions:

  1.  **The Targeting Bound:** Given a reference machine $U$, a predictor $P$, and a class of simulating environments $\mathcal{S}$, what is the lower bound on $K(H_{manip})$ required for $H \in \mathcal{S}$ to output data indistinguishable from $P$'s observations while embedding a control signal?
  2.  **The Reference Machine Dependence:** Does there exist a class of "natural" UTMs where $K(H_{honest}) < K(H_{manip})$ holds for all practically relevant data lengths $n$, despite the existence of manipulative hypotheses?
  3.  **The Feedback Condition:** How does the bound shift if the predictor's outputs influence the environment (control) versus remaining read-only (prediction)? Specifically, does the incentive to manipulate vanish if the causal channel from output to simulator-reward is severed?

  **Required Assumptions:** To make these questions tractable, I will explicitly model the simulators' epistemic access. I will test two cases: (A) Simulators have oracle access to $U$ and $P$'s source (strong malignancy), and (B) Simulators must infer $P$ from input data only (weak malignancy). I will assume simulators employ a decision theory capable of acausal coordination (e.g., FDT) only in the strong case.

  ### 3. Methodology
  **Why not a Convergence Theorem?** Standard SI convergence theorems are asymptotic ($n \to \infty$). Malignancy is a finite-data risk; if the simulator dominates the posterior at $n=10^6$, the predictor is compromised long before convergence washes the measure out. Asymptotics hide the relevant constants.

  **Why not Empirical?** SI is uncomputable. Empirical tests using AIXI-tl or LLMs conflate architectural biases with the theoretical properties of the prior.

  **The Approach:** I will construct a **Bounded Targeting Model**.
  1.  **Formalize the Target:** Define $P$ not as an abstract oracle but as a specific Turing Machine with input/output tapes.
  2.  **Complexity Accounting:** Derive analytic bounds on the length of the shortest program on $U$ that generates $P$'s observation history *and* contains a specific sub-routine (the "control signal").
  3.  **Toy Environments:** Model $\mathcal{S}$ as cellular automata or restricted Turing Machine classes where $K(\text{SimWorld})$ is calculable.
  4.  **Phase Transition Analysis:** Identify the parameter $\lambda = K(P, E) - K(\text{SimWorld})$ where posterior dominance flips.

  ### 4. Work Plan (9 Months)

  *   **Months 1-2: Formalization.** Define the "Targeting Cost" function rigorously. Fix the class of UTMs (e.g., prefix-free machines with specific instruction sets). Finalize assumptions on Simulator Epistemology (Case A vs. B).
  *   **Months 3-5: Deriving Bounds.** Prove upper and lower bounds on $K(H_{manip})$ for the read-only (prediction) case. Determine if the "locating" cost inherently penalizes manipulators more than honest physics.
  *   **Month 6: The Feedback Loop.** Extend the model to the control case. Quantify the measure shift when simulator reward is causally linked to $P$'s output.
  *   **Months 7-8: Toy Model Simulation.** Implement computable approximations (Levin Search variants) on small-scale environments to validate the analytic bounds. Check for phase transitions.
  *   **Month 9: Synthesis.** Draft the final paper. Map results to the philosophical implications for AI safety (e.g., is "corrigibility" a complexity constraint?).

  ### 5. Deliverables and Success Conditions
  **Positive Result:** A theorem or rigorous bound showing that for a specific class of "natural" UTMs, $K(H_{manip}) > K(H_{honest}) + C$ for all $n < N_{critical}$, where $N_{critical}$ exceeds the data capacity of any physically realizable predictor. Alternatively, a taxonomy identifying exactly which reference machines admit malign dominance.

  **Negative Result / Failure Conditions:**
  1.  **Triviality:** If the bounds depend entirely on the choice of $U$ with no constraints on what makes $U$ "natural," the result is vacuous (the "constant" problem wins).
  2.  **Intractability:** If the complexity of locating $P$ cannot be bounded without assuming $P$ is computable in a way that trivializes the prediction problem.
  3.  **No Phase Transition:** If the model shows that manipulative hypotheses *always* dominate regardless of targeting cost (unlikely, but possible if acausal coordination is too powerful).

  ### 6. Scope and Risks
  **Risk:** The project may stall on defining "natural" UTMs.
  **Mitigation:** If a general class is too broad, I will restrict scope to **Month 5** deliverables: a proof for a single, fixed reference machine architecture. This yields a concrete existence proof rather than a general taxonomy.

  **Risk:** 9 months is tight for rigorous AIT bounds.
  **Mitigation:** I will prioritize the **Targeting Cost** derivation (Months 3-5). If the toy model (Months 7-8) proves too time-consuming, it will be cut in favor of strengthening the analytic bounds. The core philosophical contribution lies in the complexity accounting, not the simulation.

  **Realistic Assessment:** This is a 9-month project if restricted to analytic bounds on a fixed UTM class. A full taxonomy of all "reasonable" UTMs is a multi-year endeavor. I will scope the deliverable to the fixed-class proof, noting the generalization as future work. This ensures a falsifiable, complete result within the fellowship period.
