          *   *Key Idea:* The "act of inference" is a basic cognitive capacity, not a further premise.
      *   **Syntactic vs. Semantic:** Address the derivability/consequence gap. Enriching premises doesn't close the gap because the gap isn't about information content; it's about *transition*.
      *   **Conclusion:** Summarize. The Tortoise wins on the point of *normative force*, but loses if he thinks that force requires further *propositional* justification.

  5.  **Refining the Tone:**
