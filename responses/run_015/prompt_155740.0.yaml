  **The Case**
  Alex is a graphic designer choosing a laptop. She evaluates options via **Majority Rule** across three equally weighted dimensions: Performance, Portability, and Price. Laptop $A$ beats $B$ on Performance and Price; $B$ beats $C$ on Performance and Portability; $C$ beats $A$ on Portability and Price. This generates a strict cycle: $A \succ B \succ C \succ A$. Alex currently owns $B$. A dealer knows her preferences and sequentially offers to swap her current laptop for the one she prefers in the cycle, charging a **$3 fee** per swap. Alex values each pairwise preference margin at **$10**. She is fully informed, rational, and lacks commitment devices.

  **The Arithmetic of Plans**
  Alex faces three offers. Her available plans are defined by accepting $k$ offers then stopping. The outcomes (Laptop minus Fees) are:
  *   **Plan 0 ($k=0$):** Keep $B$. Outcome: **$B$**.
  *   **Plan 1 ($k=1$):** Swap to $A$. Outcome: **$A - \$3$**.
  *   **Plan 2 ($k=2$):** Swap to $A$, then $C$. Outcome: **$C - \$6$**.
  *   **Plan 3 ($k=3$):** Swap to $A$, then $C$, then $B$. Outcome: **$B - \$9$**.

  **Dominance Elimination:**
  By monetary monotonicity, $B \succ B - \$9$. Thus, **Plan 0 dominates Plan 3**. Plan 3 is eliminated.

  **Ranking the Survivors:**
  We rank Plans 0, 1, and 2 by their outcomes, using the $10 preference margin and $3 cost:
  1.  **Plan 1 vs Plan 0:** Compare $(A - \$3)$ vs $B$. Since $A \succ B$ by $10, net gain is $7. **Plan 1 $\succ$ Plan 0**.
  2.  **Plan 2 vs Plan 1:** Compare $(C - \$6)$ vs $(A - \$3)$. Equivalent to $(C - \$3)$ vs $A$. Since $C \succ A$ by $10, net gain is $7. **Plan 2 $\succ$ Plan 1**.
  3.  **Plan 0 vs Plan 2:** Compare $B$ vs $(C - \$6)$. Since $B \succ C$ by $10, net gain is $4. **Plan 0 $\succ$ Plan 2**.

  **Result:** The non-dominated plans form a cycle ($P_1 \succ P_0 \succ P_2 \succ P_1$). There is **no maximal plan**.

  **Verdicts**
  *   **Myopic Chooser:** Re-decides at each node. At every step, the next outcome is strictly preferred to the current one (e.g., at step 3, $B - \$9 \succ C - \$6$). She accepts all three trades, ending with $B - \$9$. She is money-pumped.
  *   **Resolute Chooser:** Must select the best plan *ex ante* and stick to it. Since the ranking of plans is cyclic, there is no "best plan." The theory provides **no guidance**. She cannot form a resolute intention because no plan is rationally selectable over the others.

  **Diagnosis and Reply**
  The feature doing the work is **intransitivity of preferences over final outcomes**. The monetary costs are calibrated to preserve the pairwise cycles between plans while ensuring the full loop is dominated by the status quo. If preferences were transitive, one plan would strictly dominate the others, and resolute choice would succeed.
  *   **Strongest Reply:** A defender of resolute choice argues that rational agency *requires* transitive preferences over outcomes (coherence). If an agent's preferences cycle, she is structurally irrational, and the failure of a normative theory to guide her is expected and harmless. The theory is designed for coherent agents; this case describes an incoherent one.

