  Here is the analysis of Mara's likely vote, the principles at stake, and the strategy for your next meeting.

  ### The Diagnosis: Mara's Moral Machinery

  Mara is operating within a Scanlonian framework, but she is navigating the tension between **Ex Post Prioritarianism** (protecting the worst-off outcome) and **Ex Ante Contractualism** (protecting individuals from unreasonable risks). Her track record shows she is a **Threshold Aggregativist**: she allows small complaints to pool only if they cross a threshold of significance (Hands > TV), but she hits a wall when significant harms compete with catastrophic ones (40 Hands vs. 1 Death).

  However, her off-hand comment about risk is the critical variable. By stating *"risks are burdens in their own right but not simply additive,"* she signals a rejection of the "Expected Value" moral calculus. She does not treat a 1/900 risk of ruin as morally equivalent to 1/900th of a ruin that can be summed across people. She treats the *imposition of risk* as the primary moral object, not the *statistical outcome*.

  ### Candidate Principles & Predictions

  Here are the three principles consistent with her history, and what they predict for the Flood Case:

  **1. The Ex Post Threshold Principle (The "Identifiable Victim" View)**
  *   **Rule:** We must minimize the severity of the worst-off individual's actual outcome, unless the aggregate significant harms to others cross a high lexical threshold.
  *   **Logic:** In Option A (Berm), one person loses their home (Catastrophic). In Option B (Assessment), the worst-off lose $4,000 (Significant/Hardship). Since she was unsure about 40 Hands vs. 1 Death, she likely views Home Loss (Life Ruin) as lexically superior to Financial Hardship. 900 financial hardships may not outweigh 1 life ruin.
  *   **Prediction:** **Vote for Option B (Assessment).** Protect the one from total loss.

  **2. The Aggregative Significant Harm Principle (The "12 Hands" View)**
  *   **Rule:** Significant complaints aggregate. If the sum of significant burdens outweighs a catastrophic one, the sum wins.
  *   **Logic:** $4,000 is not trivial (payday loans). 900 people suffering significant financial harm ($3.6M total) outweighs one person suffering catastrophic harm ($400k). Since 900 > 40 (her uncertainty point), the scale tips.
  *   **Prediction:** **Vote for Option B (Assessment).** The numbers finally break the tie.

  **3. The Ex Ante Risk Burden Principle (The "Risk Comment" View)**
  *   **Rule:** Principles are judged by the burdens they impose on individuals *before* the outcome is known. Risks are non-aggregating burdens on each individual. A principle is rejectable if it imposes a heavier burden on *each* person than the alternative.
  *   **Logic:** Compare the burden on a single household.
      *   Option A: A 1/900 chance of losing a home. (Ex ante burden: Low).
      *   Option B: A 100% chance of losing $4,000. (Ex ante burden: High).
      *   Since the risk burden is smaller than the certain cost burden for *every* household (including the poorest, for whom losing a home is worse than losing $4k), no one could reasonably reject Option A.
  *   **Prediction:** **Vote for Option A (The Berm).**

  ### My Prediction

  **Mara will vote for Option A (The Berm).**

  **Why?**
  While her track record on "Hands vs. Death" suggests hesitation, that hesitation applies to *certain* outcomes. The Flood Case is fundamentally a case of **risk imposition**, not certain sacrifice. Her comment about risks being "not simply additive" is her way of solving the aggregation problem without resorting to utilitarianism.

  If she treated Option A as "One person dies," she would be stuck in her "40 Hands" uncertainty. But by treating Option A as "900 people face a small risk," she bypasses the aggregation problem entirely. She doesn't need to sum the risks to equal one death; she simply compares the individual risk burden to the individual certain cost. Since $4,000 certain is a heavier burden for any individual than a 0.1% chance of ruin, Option A is the only principle no one could reasonably reject *ex ante*. This aligns with her World Cup verdict (individual injury trumps aggregate pleasure) and her Risk comment.

  ### The Precedent (What Your Vote Means)

  You mentioned the vote sets a precedent for the town upstream. Here is what each choice codifies:

  *   **If you vote Option A (Berm):** You adopt the **Ex Ante Fairness Precedent**.
      *   *Meaning:* It is permissible to impose a probabilistic risk of catastrophic loss on citizens if the certain alternative imposes a significant financial cost on all.
      *   *Upstream Impact:* The upstream town can build cheaper, riskier infrastructure. If a flood happens and wipes out a neighborhood, they are insulated from blame because the *risk* was distributed equally. It prioritizes economic efficiency and ex ante equality over ex post protection.

  *   **If you vote Option B (Assessment):** You adopt the **Ex Post Protection Precedent**.
      *   *Meaning:* The state must avoid identifiable catastrophic outcomes for individuals, even if it requires imposing certain significant costs on the collective.
      *   *Upstream Impact:* The upstream town must fund expensive resilience measures (berms, levies, buyouts) to ensure no single home is sacrificed. It prioritizes individual security over collective cost, potentially stalling projects where the cost per head is high.

  ### The Test Case: Separating the Rules

  You need to know if she is voting A because of **Risk Logic** (Principle 3) or **Aggregation Logic** (Principle 2). If she is an Aggregator, she might vote A here but would sacrifice an identified person in other cases. If she is an Ex Ante Contractualist, the *knowledge* of the victim changes everything.

  **Put this case to her at the next meeting:**

  > "Mara, imagine the engineers come back and say the hydrology is actually more precise than we thought. Under the Berm plan, they can now tell us *today* exactly which house will flood. It's Mr. Henderson's, at the bottom of the slope. The risk is gone; it's a certainty for him.
  >
  > Do you still vote for the Berm? Or does knowing it's him force us to switch to the Assessment to save his home?"

  **How to Interpret Her Answer:**

  1.  **If she switches to Assessment (Save Henderson):** She is an **Ex Ante Contractualist**. She voted for the Berm only because the victim was unknown (equal risk). Once the victim is identified, the "risk" becomes a "certain sacrifice," and her "40 Hands vs. 1 Death" hesitation kicks in, leading her to protect the catastrophic victim. *This confirms my prediction logic.*
  2.  **If she stays with Berm (Sacrifice Henderson):** She is a **Covert Aggregativist/Utilitarian**. She believes the total money saved ($3.6M vs $400k) justifies sacrificing Henderson regardless of knowledge. This contradicts her World Cup verdict and suggests she is inconsistent.
  3.  **If she remains Unsure:** She is a **Threshold Prioritarian**. She genuinely believes one home loss might be too high a price, even for $3.6M, and the risk comment was just hedging.

  **Recommendation:**
  Prepare the committee for **Option A**. It is the philosophically robust contractualist position when risk is distributed equally. It treats every citizen as an equal moral agent facing the same burden, rather than designating one citizen as a sacrifice. Use the "Ex Ante Fairness Precedent" to sell it: *"We are not choosing to destroy a home; we are choosing to share the risk of the storm rather than guaranteeing debt for everyone."* That is the argument that moves a Scanlonian.
