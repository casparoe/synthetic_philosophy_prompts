      *   *MRT Definition:* Binford wanted to link static remains to dynamic processes. It's a bridge.
      *   *The Circularity Charge:* It *is* a risk. If you assume the institution to identify the artifact, then use the artifact to prove the institution, that's bad science. How do we fix it? *Independence.* We need to find the weights *and* storage facilities *and* settlement hierarchy. Convergence of evidence.
      *   *Ethnography:* Yes, analogies are used. But there's a difference between "Ethnographic Analogy" (using a specific culture as a model) and "Generalizing Analogy" (using universal human constraints). The danger is "ethnographic snapshotting." We need to be careful about time and space.
