answer: |-
  Here is a disambiguation of the phrase "the will of the people" structured to meet your five constraints.

  ### The Menu of Readings

  I have ordered these from the thinnest (easiest to verify, least normative weight) to the most demanding (hardest to verify, most normative weight).

  **1. The Aggregate Tally**
  *   **Claim:** The will is the sum of current, expressed individual preferences.
  *   **Nature of Will:** A tally of individual preferences (arithmetic).
  *   **Who Counts:** Currently eligible voters or residents within the legal boundary at the time of measurement.
  *   **Procedure:** Opinion polls, straw polls, or petition signatures.
  *   **What Counts Against:** Evidence that the tally is statistically unrepresentative, coerced, or based on demonstrably false information.
  *   **Content vs. Authority:** **Content.** It purports to identify a specific policy ranking (e.g., "60% prefer closure").

  **2. The Historical Mandate**
  *   **Claim:** The will is the decision output of a specific, prior authorized procedure.
  *   **Nature of Will:** A function of preferences fixed at time *T-1* (a frozen decision).
  *   **Who Counts:** The electorate as constituted at the time of the prior procedure (e.g., the 2019 referendum voters).
  *   **Procedure:** The specific past vote or election result.
  *   **What Counts Against:** Evidence that the procedure was flawed (fraud, illegality) or that the mandate has expired by statutory limit.
  *   **Content vs. Authority:** **Hybrid.** It settles *what* was decided historically, but functions primarily to settle *who* is entitled to enforce that past decision now.

  **3. The Deliberative Counterfactual**
  *   **Claim:** The will is what the people *would* choose if they were fully informed, rational, and free from coercion.
  *   **Nature of Will:** An idealized counterfactual (a hypothetical judgment).
  *   **Who Counts:** Potentially anyone affected by the decision, including future residents or the unborn, insofar as their interests can be represented by proxies.
  *   **Procedure:** Deliberative bodies (like your assembly), expert testimony, and reasoned debate.
  *   **What Counts Against:** Evidence that the deliberation was biased, excluded key evidence, or that the recommendation contradicts fundamental rights or interests of the affected.
  *   **Content vs. Authority:** **Content.** It purports to identify the *right* policy, not just the *popular* one.

  **4. The Sovereign Assertion**
  *   **Claim:** The will is whatever a successful political actor claims it is to close down dispute.
  *   **Nature of Will:** Merely a title conferring authority on a decision-maker (a performative speech act).
  *   **Who Counts:** Determined rhetorically by the speaker (often "the real people" vs. "elites" or "outliers").
  *   **Procedure:** Successful mobilization or assertion of power; no independent verification.
  *   **What Counts Against:** Only political defeat or loss of power.
  *   **Content vs. Authority:** **Authority.** It does not identify policy content; it marks a decision as legitimate and beyond challenge.

  ***

  ### Constraint 1: Content vs. Authority

  The tradeoff you suspect is real. Readings 1 and 3 (Tally, Counterfactual) claim to identify **determinate content** (a specific policy). Readings 2 and 4 (Mandate, Assertion) primarily settle **who is entitled to decide** or mark a decision as legitimate.

  *   **The Campaign (Referendum):** Needs **Content**. They argue the 2019 vote *was* a policy decision (close units), not just a selection of decision-makers. If it were only Authority, they would have to admit the Assembly could decide differently.
  *   **The Organiser (Dispute-closer):** Can get by with **Authority**. Their goal is to stop debate ("we are not relitigating"). They do not need to prove the policy is right, only that the decision is settled. This use relies on sliding between the two: they treat the *Authority* of the past vote as if it guarantees the *Content* is still optimal.
  *   **The Assembly Member (Deliberative):** Needs **Content**. They argue the Assembly's recommendation *is* the will because it reflects the best judgment.
  *   **The Remit Letter:** Ambiguous, but functionally relies on **Authority**. It instructs you not to substitute *your* judgment, implying an external source of legitimacy. However, since it provides no procedure to find that external source, it effectively tells you to find a source of **Authority** strong enough to shield you from blame.

  ***

  ### Constraint 2: The Constituency Question

  *   **Aggregate Tally:** Membership is **determinate** by current electoral law. The boundary is set by the state before the will is ascertained. It **cannot** include unborn people. It faces no regress because it accepts the legal status quo.
  *   **Historical Mandate:** Membership is **determinate** by past electoral law. The boundary is fixed in history. It **cannot** include new residents or the unborn. It faces no regress, but it faces a "dead hand" problem (why do past voters bind future residents?).
  *   **Deliberative Counterfactual:** Membership is **indeterminate**. The boundary is moral (who is affected?), not legal. It **can** include unborn people (as interest-holders). This reading faces a **regress**: to ascertain the will, you must know who counts; but who counts is often the very thing being disputed. The Assembly must constitute the demos to hear the will, but the will is supposed to guide the Assembly.
  *   **Sovereign Assertion:** Membership is **fluid**. The speaker sets the boundary at the moment of speech. It **excludes** whomever the speaker wishes (often opponents). It solves the regress by fiat: "I speak for the people" constitutes the people I speak for.

  ***

  ### Constraint 3: Referendum vs. Assembly

  *   **Binding Past vs. Informed Future:** Only the **Historical Mandate** reading allows an earlier, less informed expression to bind a later, better-informed one. It treats democracy as a series of contracts rather than a continuous conversation.
  *   **Counterfactual Force:** The **Deliberative Counterfactual** makes the will a hypothetical ("what they *would* will").
      *   *Effect on Force:* This weakens the phrase's ability to bind officials empirically (you can always say "they wouldn't will this if they knew") but strengthens its normative claim (it claims to be *truer* than a raw vote).
      *   *Binding Nature:* It binds officials only if they accept the legitimacy of the deliberative process. If the public rejects the Assembly's "idealized" view as elitist, the binding force snaps.
  *   **The Conflict:** On the Mandate reading, the Assembly is subordinate to the 2019 voters. On the Counterfactual reading, the Assembly is superior to the 2019 voters (because you are better informed). These are incompatible.

  ***

  ### Constraint 4: The Tradeoff

  The tradeoff is genuine: **Readings determinate enough to settle policy are the ones no procedure could definitively refute, while readings a procedure can settle settle only who decides.**

  *   **Where it bites hardest:** It bites the **Deliberative Counterfactual**. You can never prove definitively what people *would* choose under ideal conditions. Opponents can always claim your "ideal conditions" were biased. Thus, the reading that gives you the most moral cover (you are doing what is best for them) gives you the least procedural armor (you can be accused of ignoring what they *actually* said).
  *   **Where it bites the Mandate:** The **Historical Mandate** is easily verified (did the vote happen?), but it offers no guidance on whether the policy is still good. It settles *who decided*, not *what is right*.
  *   **Escaping the Tradeoff:** Only the **Sovereign Assertion** escapes it, at the cost of truth. It claims both content and authority, but only by force. It is immune to refutation because it accepts no external standard.
  *   **The Assembly's Position:** You are trapped in the Counterfactual reading. You cannot use the Tally (you aren't polling); you cannot use the Mandate (you were convened to review it); you cannot use Assertion (you have no power base). You must claim your recommendation is what people *would* will. This makes you vulnerable to the charge that you are substituting your judgment, which is exactly what the remit forbids.

  ***

  ### Constraint 5: Analysis of the Four Uses

  1.  **The Remit Letter:**
      *   **Reading:** **Sovereign Assertion** disguised as **Deliberative Counterfactual**.
      *   **Judgment:** **Indefensible.** It commands you to follow "the will" without providing a mechanism to ascertain it. It functions to offload political risk. If you recommend closure, they can say you followed the will (efficiency); if you recommend keeping open, they can say you followed the will (local access). It is a "heads I win, tails you lose" instruction.

  2.  **The Campaign (Referendum):**
      *   **Reading:** **Historical Mandate.**
      *   **Judgment:** **Defensible on its own terms,** but rigid. Democratic theory allows for binding referenda. However, it fails to account for changed circumstances (medical evidence, demographics) over five years. It treats the will as a static object rather than a living interest.

  3.  **The Organiser (Dispute-closer):**
      *   **Reading:** **Sovereign Assertion.**
      *   **Judgment:** **Indefensible.** This is anti-deliberative. It uses the phrase to immunize a decision from scrutiny. It conflates "the decision made" with "the will of the people," which assumes the decision-making process was perfectly representative (which is always contestable).

  4.  **The Assembly Member (Deliberative):**
      *   **Reading:** **Deliberative Counterfactual.**
      *   **Judgment:** **Defensible, but risky.** This is the only reading that justifies the existence of a citizens' assembly. If the assembly is a microcosm engaging in high-quality deliberation, its output *is* the best proxy for an informed public will. The risk is paternalism: claiming you know what people want better than they do.

  ***

  ### Verdict

  **The phrase "the will of the people" is best understood as an honorific whose function is to immunise a decision against further challenge.**

  In the context of your remit, it is not an operational instruction. It is a shield. The letter writers know there is no single "will" on a complex technical issue like maternity centralization. There are only competing interests (safety vs. locality, cost vs. access). By telling you to follow "the will," they are telling you to find a justification robust enough that no one can successfully claim you ignored the public.

  **Can the Assembly apply it?**
  No, not literally. You cannot ascertain a counterfactual will without essentially making the decision yourselves based on evidence. If you treat the phrase as a **Deliberative Counterfactual**, you must accept that *your* reasoned judgment *is* the operational definition of that will for this process.

  **The General Will Contrast:**
  You asked to flag the contrast between a general will and an aggregate of private wills.
  *   The **Aggregate Tally** is the "will of all" (sum of private interests).
  *   The **Deliberative Counterfactual** is close to the "general will" (common interest discovered through reason).
  *   **However,** the interesting reading here is the **Historical Mandate**. It is neither. It is a *legacy* will. It treats the people not as a current body of agents or a moral ideal, but as a corporation that signed a contract five years ago. This is the reading that creates your specific conflict.

  **Recommendation:**
  Do not try to find "the will." It does not exist as an external object you can discover. Instead, treat your remit as instructing you to determine **the public interest**.
  1.  Acknowledge the 2019 vote (Historical Mandate) as a significant expression of preference, but not a binding contract that overrides new evidence.
  2.  Use your deliberation to construct the **Deliberative Counterfactual**: "If the public knew what we know now, what would they choose?"
  3.  Explicitly state in your report that "the will of the people" is not a pre-existing fact you found, but a judgment you have formed on their behalf.

  If you hunt for a pre-existing will, you will find only mirrors. If you construct a public interest, you may find a decision that holds.
