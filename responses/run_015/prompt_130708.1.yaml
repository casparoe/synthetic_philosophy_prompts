answer: |-
  Your grasp of the dialectic is excellent; you have correctly identified the central tension between a semantic explanation (the concept itself is morally loaded) and a pragmatic one (the concept is stable, but its use is driven by social goals like blaming). To answer your core question: the distinction is genuine, not merely verbal. It turns on whether moral considerations alter the *truth conditions* of the claim (Story 1) or merely the *appropriateness* of asserting it (Story 2).

  Here is how your three variants discriminate between them, along with my confidence levels.

  **1. Swap the word**
  If you ask whether the chairman *knew* or *foresaw* the outcome, the pragmatic story (Story 2) predicts the asymmetry should shrink or vanish. "Knowing" is a factual state; "intending" is a bridge to responsibility. If respondents are only adjusting answers to assign blame, they have less need to distort factual attribution than responsibility attribution. The conceptual story (Story 1), however, often claims that moral valence penetrates our entire folk psychology. On this view, morality colours how we see the mind itself, so the asymmetry should spread to "knowingly" or even "believes".

  *Prediction:* Story 2 expects a reduction; Story 1 expects persistence.
  *Confidence:* I am reasonably confident that empirical data shows the effect *does* persist for "knowingly", which puts pressure on the simple pragmatic story. However, a sophisticated pragmatic theorist could argue that "knowingly" is also used to assign blame, so the pressure doesn't vanish entirely. Thus, this test is good but not decisive.

  **2. Change the format**
  Removing the yes-or-no question and the context of judgement is a stronger test. The pragmatic story relies on the idea that the question is being used as a tool for social regulation (blame or praise). If you remove the social context—making it a private rating with no consequences—the motivation to distort the answer should disappear. The conceptual story predicts the asymmetry remains because the distortion is internal to how the scenario is processed, not how the answer is delivered.

  *Prediction:* Story 2 expects the effect to disappear; Story 1 expects it to persist.
  *Confidence:* This is a fair test in principle. However, I must flag uncertainty here: pragmatic pressures can be internalised. Even in private, people might feel a normative pull to label bad acts as intentional. So, if the effect persists, Story 2 can survive by claiming the "blame game" is now internal. Nevertheless, if the effect vanishes in low-stakes private ratings, Story 1 is in serious trouble.

  **3. Pull norm-violation apart from disapproval**
  This is the most critical variant. Suppose the chairman violates a rule everyone agrees is silly, or is praised for the side effect. The pragmatic story is tied to *blame*. If there is no blame to assign (because the rule is silly or the act is praised), the pragmatic pressure vanishes. The conceptual story has evolved; many proponents now argue it is not about *morality* specifically, but about *normative expectations* generally. On this view, violating any norm (even a silly one) skews the concept of intentionality, regardless of whether we disapprove.

  *Prediction:* Story 2 tracks disapproval/blame. Story 1 tracks norm-violation.
  *Confidence:* I am highly confident this is the best discriminator. Recent experimental work suggests the effect tracks norm-violation even without moral blame. If this holds, the simple pragmatic "blame-marking" story is insufficient. It would require Story 2 to expand into a broader "normative pragmatics" account, which begins to look suspiciously like Story 1.

  **Is the distinction an artefact?**
  You asked if this is merely a disagreement about what to call "the concept". I do not believe it is an artefact, but the boundary is porous. If pragmatic pressures are universal and unavoidable, they functionally look like semantic rules. However, the distinction matters because it tells us where the error lies. If Story 1 is right, our very understanding of action is morally coloured; we literally see the world differently. If Story 2 is right, we see the world clearly but speak strategically.

  Your three variants are well-constructed and do discriminate between the stories, particularly the third. The only limitation is that human psychology is rarely binary; both mechanisms likely operate in tandem. To definitively rule one out would require a scenario where norm-violation and blame are perfectly decoupled, which is difficult to engineer in vignettes. But your intuition is correct: if the effect persists where blame is impossible but norms are broken, the conceptual story wins. If it vanishes where blame is removed, the pragmatic story wins.

  In sum, you have framed the question well. The stakes are real: they concern whether morality is a lens through which we perceive agency, or a tool we use to discuss it.
