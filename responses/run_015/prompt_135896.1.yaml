  2.  **(b) Justification vs. Motivation:** The *motivating reason* must be love, not moral permission; impartial justification alienates the agent from their action. (Substantive/Defensible). **Justifies dismissal:** The parent sought impartial validation where none was needed, creating alienation.
  3.  **(c) Comparative Reasoning:** Comparing loved ones to strangers is inherently corrupting, regardless of outcome. (Substantive). **Justifies dismissal:** The act of comparison violates the relationship's non-fungible nature.
  4.  **(d) Impartial Scope:** Impartial morality lacks authority over special relationships entirely. (False). **Leaves untouched:** Impartiality may still constrain (e.g., forbidding murder), so the comparison isn't categorically excluded; morality still binds.

  **Preferred Interpretation:** (b). It captures Williams's worry about alienation without denying morality's existence.

  **Counterexample to Drop (b):** A scenario where an agent *needs* impartial justification to overcome weakness of will to save their child (e.g., amidst conflicting duties or depression). If impartial backing preserves rather than undermines integrity, (b) fails.

