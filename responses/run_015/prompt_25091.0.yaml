          *   *Verdict:* Somewhere in between. The framework is standard, but the application is too rigid/absolute.

      *   **Move 2 (Elena):** The functional test proves too much (hyperinflation example, gold example).
          *   *Analysis:* She is logically correct. A failing currency is still a currency (e.g., Zimbabwe dollar). Gold is a SoV but not money *now*, proving SoV isn't sufficient. The 3-function test is indeed descriptive/heuristic, not a strict logical definition.
          *   *Verdict:* Clearly right (mostly). Her logical critique of the necessary-and-sufficient claim is sound.

      *   **Move 3 (David):** Money is what the sovereign says (Chartalism/State Theory of Money). Taxes drive money.
          *   *Analysis:* This is Knapp's State Theory of Money, adopted by Modern Monetary Theory (MMT). It explains *fiat* well. But it excludes private money, commodity money, and money in stateless societies. It's a specific theory, not the *only* definition.
          *   *Verdict:* Somewhere in between. It's a valid theory for fiat, but claiming it defines *money as such* is controversial and historically limited.

      *   **Move 4 (Elena):** Conflates fiat with money. Historical examples (gold, cigarettes, Rai stones) show state isn't necessary.
