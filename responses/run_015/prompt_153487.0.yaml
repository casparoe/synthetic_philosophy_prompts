prompt: |-
  I'm a fourth-year PhD student in machine learning, and I've been asked to write the operating procedure for our lab's policy registry before it goes live next term, so this needs to be something a colleague can actually run rather than something that displays a position.

  The registry is a small piece of infrastructure. For certain recurring decisions, a researcher submits a *policy* — a mapping from the observations they might make to the action they would take — together with an ex ante model of the situation. The registry evaluates the candidate policies against that ex ante model, records the winner, and then executes it mechanically once the observation arrives. Two or three decisions a month go through it, usually with real money attached: compute, annotation budgets, occasionally the difference between shipping and killing a three-month run. The person running the procedure will be a rotating graduate student who has read one paper on this and has about forty minutes; the PI signs off. Assume this person has no access to the literature and will not look anything up, so every distinction the procedure uses has to be stated inside the procedure itself.

  I want the procedure built on the updateless framing, by which I mean: choose among whole policies by their expected value computed from the ex ante prior, without conditioning on the observation you in fact end up with, on the grounds that what you control is the output of the decision procedure rather than the single act in the branch you happen to occupy. I want that turned into an actual procedure, not expounded. Specifically:

  - The ordered questions, with what counts as a sufficient answer to each, and the points where the procedure stops early or hands the decision to a person.
  - A test for whether a decision belongs in the registry at all. As I understand it, the framing earns its keep only where the decision is entangled with something else — an external predictor whose behaviour tracks the policy rather than the act, or a set of instances of the same decision computation that the agent cannot tell apart — and collapses back into ordinary expected-utility maximisation otherwise. I need that test stated so a graduate student can apply it to a real ticket in five minutes, including what to do when the answer is genuinely unclear.
  - How to fix the prior, and the prior of whom as of when: our priors at registration, our priors now, or something else — and what to do when the two have diverged.
  - What the entangler is simulating when it predicts us: the rulebook as submitted text, the procedure that generated it, or our actual future behaviour. This is the step I expect to be load-bearing and the one I find hardest, and the answer seems to change depending on whether we can rewrite the rulebook afterwards.
  - What an operator should do when the executed policy mandates an action that is plainly wrong given everything now known: who may override, on what grounds, and what an override costs the registry.
  - Where full policy comparison is computationally hopeless, what approximation to substitute, and which steps are judgment calls dressed up as procedure.
  - What the procedure cannot do.

  Then run it, in order, on three cases.

  1. Our lab belongs to a compute consortium. Each quarter we submit a contingency rulebook; the consortium's allocator, a fixed and published algorithm, simulates the submitted rulebook against a battery of hypothetical scenarios and awards compute roughly in proportion to the share of the allocation that rulebook would spend on long, high-variance runs in scenarios where they look unpromising. This quarter's allocation is already granted and largely spent. The scenario that actually arose is one where a high-variance run looks unpromising and would consume about a third of what is left, and nothing we can identify now depends on whether we run it.
  2. A one-off decision: whether to spend $4k on an annotation job for a single project. No allocator, no recurring structure, and no way of confusing this decision with any other.
  3. A registered policy from a run begun six months ago says: if the pre-registered safety threshold is crossed, halt, delete the checkpoint, and run no further diagnostics first. The threshold was crossed this morning. Within ten minutes we found a bug in the logging library that makes the crossing very likely spurious; the model itself looks fine; the run cost roughly $60k and three months of someone's time; no external party is watching and nothing downstream depends on our compliance.

  Please give me a committed answer: one procedure, with definite choices at each step and the reasons for them, rather than a survey of what a defender of each decision theory would say. Where you think the updateless framing is simply inapplicable or wrong for a class of cases, say that flatly rather than hedging, and I expect I will not like what your procedure returns on case 3 — give it anyway, and say whether the correct move there is to override and what would make an override legitimate rather than convenient. Close with a short note, two hundred words at most, on the step you are least confident in, what would change your mind about it, and where your own view is contested. I would rather have something I can argue with than something balanced.
reasoning: |-
  Here's a thinking process that leads to the suggested operating procedure:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in ML.
      *   **Task:** Write an operating procedure for a lab's "policy registry."
      *   **Context:** The registry uses an *updateless* decision theory framing (choose policies based on ex ante expected value, not conditional on current observations).
      *   **Audience:** Rotating grad student (40 mins, read one paper, no literature lookup), PI signs off.
      *   **Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Test for registry eligibility (entanglement requirement).
          *   Prior fixation rules (whose prior, when).
          *   Entangler simulation target (what is being predicted).
          *   Override protocol (when policy says do X, but X looks wrong now).
          *   Approximation for intractable policy comparison.
          *   Limitations (what it can't do).
          *   **Run the procedure on three specific cases.**
          *   **Tone:** Committed, definite choices, not a survey. Acknowledge where updateless framing fails.
          *   **Constraint:** Close with a <200 word note on the least confident step.

  2.  **Deconstruct the "Updateless" Framing for this Context:**
      *   *Core Idea:* Updateless Decision Theory (UDT) / Functional Decision Theory (FDT) suggests optimizing the *output of the decision algorithm* rather than the specific action given current knowledge. This matters when other agents/systems predict your algorithm, not just your action.
      *   *Lab Context:* The "Entangler" is usually an external allocator or a set of identical decision instances.
      *   *Tension:* Real-world lab work involves new information (bugs, spurious thresholds). Strict updatelessness can demand self-sabotage (e.g., deleting a good checkpoint because the policy said "delete if threshold crossed" to maintain credibility with a predictor).
      *   *Decision:* I need to make hard calls. I cannot hedge. I must define a procedure that *works* operationally, even if it bites the bullet on UDT implications.

  3.  **Drafting the Procedure - Section by Section:**

      *   **Title:** Policy Registry Operating Procedure (v1.0).
      *   **Eligibility Test (The "Entanglement" Check):** This is crucial. UDT only beats Causal Decision Theory (CDT) when there's logical correlation.
          *   *Criterion:* Is there an external system or future instance making a decision based on *this policy's source code/logic* rather than just the outcome?
          *   *Threshold:* If "No," use standard Expected Utility (EU). If "Unclear," default to Registry (conservative).
      *   **Prior Fixation:**
          *   *Whose Prior?* The lab's consensus at the moment of *registration*.
          *   *Why?* Updatelessness means committing before seeing the specific observation. Updating the prior later defeats the purpose.
          *   *Divergence:* If current beliefs diverge, ignore them for the calculation. Use the registered prior.
      *   **Entangler Simulation:**
          *   *What do they simulate?* The submitted text (the rulebook).
          *   *Why?* That's the binding contract. If we can rewrite it secretly, the entangler would predict the rewrite capability, not the text.
          *   *Rewrites:* Forbidden after registration unless the entangler is notified and re-simulates.
      *   **Override Protocol:**
          *   *The Hard Part:* UDT says "don't override" to maintain credibility. But if the entangler isn't watching (Case 3), UDT collapses to CDT.
          *   *Rule:* Override is permitted *only* if the entanglement is broken (entangler cannot observe the override) OR if the prior contained a factual error about the world state (not just probability).
          *   *Cost:* Any override invalidates the registry for that class of decisions for 6 months. High cost to prevent casual overriding.
      *   **Approximation:**
          *   Monte Carlo simulation of the policy against the ex ante model.
          *   Judgment call: Defining the "class of decisions" for the penalty.
      *   **Limitations:** Cannot handle adversarial actors who can hack the registry. Cannot handle moral hazards not modeled ex ante.

  4.  **Running the Cases:**

      *   **Case 1 (Consortium Allocator):**
          *   *Entanglement:* Yes. Allocator simulates the rulebook.
          *   *Prior:* Use registration prior.
          *   *Action:* Follow policy. Even if it looks unpromising now, the allocation depended on the *commitment* to run it. Deviating risks future allocation.
          *   *Verdict:* Run the high-variance job.
      *   **Case 2 (One-off Annotation):**
          *   *Entanglement:* No. No predictor, no recurring instance.
          *   *Test:* Fails eligibility.
          *   *Verdict:* Do not use Registry. Use standard EU maximization (spend $4k if expected value > $4k).
      *   **Case 3 (Safety Threshold/Bug):**
          *   *Entanglement:* No external party watching.
          *   *Policy:* Halt and delete.
          *   *New Info:* Bug in logging. Threshold spurious.
          *   *Updateless Logic:* If no one is watching, credibility isn't at stake. However, the *prior* assumed the threshold was accurate.
          *   *Override Condition:* Factual error in world model (logging bug) vs. Probability update. This is a factual error about the observation mechanism.
          *   *Verdict:* Override is legitimate. Do not delete. But document the "factual error" rigorously.
          *   *Wait, re-evaluating UDT strictness:* The prompt asks me to be committed. If I say "Override," does that break the updateless framing?
          *   *Refinement:* In UDT, you optimize the algorithm. If the algorithm includes "Check if sensor is broken," then you check. If the policy was "If Sensor > X, Delete," and Sensor is broken, the *input* to the function is invalid.
          *   *Strict UDT View:* If the policy was "If *reported* threshold crossed," you must delete to maintain self-consistency for future simulations (even if hypothetical).
          *   *Practical View:* If no one is watching, credibility is null.
          *   *Decision:* I will rule that Override is permitted *because* the entanglement is absent (no external watcher). But I must emphasize the cost to the registry's integrity. Actually, the prompt says "nothing downstream depends on our compliance." This breaks the entanglement. So CDT applies. Override.

  5.  **Refining the "Override" Logic (Crucial Step):**
      *   If I allow overrides too easily, the registry is useless.
      *   If I forbid them always, the lab loses $60k on a bug.
      *   *Distinction:* Is the divergence due to *new information about the world* (CDT territory) or *new information about the value of the action given the same world* (UDT territory)?
      *   *Rule:* Override allowed if the *observation mechanism* failed (buggy logger). Override forbidden if the *value* of the action changed (e.g., "We found a better use for the money").
      *   *Case 3:* Buggy logger = Observation mechanism failure. Override allowed.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Bureaucratic but precise. No "might," "could," "some argue."
      *   *Structure:* Numbered steps.
      *   *Case Runs:* Explicit application of the steps.
      *   *Closing Note:* <200 words on uncertainty.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I define the "Entanglement Test" clearly enough for a 40-min student?
      *   *Fix:* Make it a flowchart style Yes/No. "Is there a system that decided resources based on predicting this text?"
      *   *Check:* Did I address the "Prior of whom" question?
      *   *Fix:* Specify "Lab Consensus at T-Registration."
      *   *Check:* Case 3 is the trap. If I say "Don't delete," I look irrational. If I say "Delete," I look dogmatic.
      *   *Resolution:* The entanglement is the key. No external watcher = No updateless penalty for deviating *unless* future self binds present self. Since it's a one-off run end, future self isn't bound. Override is safe *technically*, but damages the culture of commitment. I will rule: Override permitted, but requires PI sign-off and a "Registry Integrity Incident" report.
      *   *Wait, one more check on Updatelessness:* Updatelessness isn't just about external predictors. It's about *logical* correlation. If I decide to override now, would "Past Me" have wanted "Present Me" to override? Past Me wanted to prevent catastrophe. If the threshold was spurious, Past Me would have written "Unless logger buggy." Since Past Me didn't, strictly speaking, UDT says follow the text.
      *   *Pragmatic Compromise:* The procedure must allow for "Garbage In, Garbage Out." If the observation is corrupted, the policy function input is invalid. I will frame the override as "Input Validation Failure" rather than "Policy Violation." This preserves the registry's logic while saving the model.

  8.  **Final Polish:**
      *   Ensure the "Entanglement Test" is the gatekeeper.
      *   Ensure the "Prior" section locks the time index.
      *   Ensure the Case 3 ruling is consistent with the procedure (Input Validation > Policy Execution).
      *   Check word count on the closing note.

  9.  **Finalizing the Procedure Steps:**
      1.  Eligibility (Entanglement).
      2.  Prior Locking.
      3.  Simulation Target.
      4.  Execution & Override (Input Validation vs. Preference Change).
      5.  Approximation.
      6.  Limitations.

      *(Self-Correction on Case 3)*: If I classify the bug as "Input Validation," it sidesteps the UDT vs CDT conflict. The policy says "If Threshold Crossed." The threshold *was not crossed*; the *sensor lied*. Therefore the condition is false. Do not delete. This is the most robust operational answer.

      *(Self-Correction on Case 1)*: The allocator simulates the text. We must follow the text even if it looks bad, to maintain the correlation for the *next* quarter.

      *(Self-Correction on Case 2)*: Fails eligibility. Do not use registry.

      *(Closing Note)*: Focus on the "Input Validation" loophole. It's necessary but dangerous.

  10. **Writing the Response.** (Proceeding to generate output based on these decisions).
answer: |-
  # Policy Registry Operating Procedure (v1.0)

  **Purpose:** To execute decisions where the value of the action depends on the predictability of the decision procedure itself, not merely the outcome of the action.
  **Operator:** Rotating Graduate Student.
  **Time Budget:** 40 Minutes.
  **Authority:** PI signature required for overrides.

  ---

  ### 1. Eligibility Test (The Entanglement Check)
  *Do not proceed to evaluation if this test fails.*

  **Question:** Is there an external system, allocator, or future instance of this decision that has already allocated resources or set constraints based on a simulation of *this specific policy text*?
  *   **Yes:** Proceed to Step 2. (Example: Compute consortium allocator, multi-agent coordination).
  *   **No:** **STOP.** Do not use the Registry. Execute standard Expected Utility maximization based on current information. The updateless framing provides no advantage here and adds rigidity cost.
  *   **Unclear:** Default to **Yes**. Proceed to Step 2. (Error on the side of commitment).

  ### 2. Prior Fixation
  **Rule:** All expected value calculations must use the **Lab Consensus Prior at Time of Registration (T-reg)**.
  *   **Ignore:** Current beliefs, new literature, or posterior updates discovered after T-reg.
  *   **Divergence:** If the current operator's beliefs diverge from T-reg, this is irrelevant. You are executing a contract made by your past self, not optimizing for your current self.
  *   **Exception:** Factual errors regarding the *state of the world at T-reg* (e.g., the model was trained on corrupted data unknown at T-reg). This is not a belief update; it is a correction of the input domain.

  ### 3. Entangler Simulation Target
  **Rule:** The external predictor is assumed to simulate the **Submitted Text**, not the researcher's intent or future behavior.
  *   **Immutability:** The policy text cannot be edited after registration.
  *   **Rewrites:** If the lab wishes to change the policy, it must be treated as a *new* registration with the entangler notified. Secret rewrites break the logical correlation and invalidate the registry's value for future quarters.

  ### 4. Execution and Override Protocol
  **Standard Execution:** If the observation matches the policy condition, execute the action mechanically.
  **Override Condition:** An override is permitted *only* under **Input Validation Failure**.
  *   **Definition:** The observation triggering the policy is demonstrably false due to instrument error, bug, or corruption (e.g., a sensor bug, not a probability shift).
  *   **Forbidden:** Overrides based on "This action now looks suboptimal" or "We found a better use for resources."
  *   **Cost:** Any override triggers a **Registry Integrity Incident**. The registry is suspended for that decision class for 6 months. PI signature mandatory.
  *   **Rationale:** If the input is garbage, the policy function is undefined. If the input is valid but the output is painful, you must pay the cost to maintain credibility with the entangler.

  ### 5. Approximation for Intractable Comparison
  **Rule:** If comparing whole policies is computationally impossible:
  1.  Sample 1,000 scenarios from the T-reg prior.
  2.  Run the candidate policies on these scenarios.
  3.  Select the policy with the highest mean return across the sample.
  **Judgment Call:** The operator defines the "decision class" for the suspension penalty. Broad definitions protect the registry; narrow definitions protect the lab. Default to broad.

  ### 6. Limitations
  *   This procedure cannot protect against adversarial actors who can modify the registry database.
  *   This procedure cannot resolve moral hazards not encoded in the T-reg utility function.
  *   This procedure collapses to standard decision theory if Entanglement (Step 1) is absent.

  ---

  ### Case Runs

  #### Case 1: Compute Consortium Allocation
  1.  **Eligibility:** **Pass.** The allocator simulates the rulebook to grant resources. Entanglement is explicit.
  2.  **Prior:** Use T-reg prior. Even if the run looks unpromising now, the allocation was granted based on the *commitment* to run it.
  3.  **Simulation:** The allocator predicted this text.
  4.  **Execution:** The policy condition (unpromising high-variance run) is met.
  5.  **Override:** Is the observation false? No. Is the action suboptimal? Yes, locally. But globally, deviating reduces future allocation.
  6.  **Verdict:** **Execute the run.** Consume the third of the budget. Do not override. The cost of losing credibility with the allocator exceeds the cost of the compute.

  #### Case 2: One-off Annotation Job ($4k)
  1.  **Eligibility:** **Fail.** No allocator, no recurring structure, no predictor simulating this decision.
  2.  **Verdict:** **Do not use the Registry.** Close the ticket. The PI or project lead should decide using standard Expected Utility based on *current* information. Using the registry here adds rigidity with no upside.

  #### Case 3: Safety Threshold & Logging Bug
  1.  **Eligibility:** **Fail/Borderline.** No external party is watching. However, the decision is entangled with the *past self's* safety constraints. Treat as **Pass** for internal consistency, but note the lack of external watcher.
  2.  **Prior:** T-reg prior assumed the logging library was functional.
  3.  **Execution:** Policy says "Halt and Delete."
  4.  **Override:** Is this a preference change? No. Is this an **Input Validation Failure**? **Yes.** The logging library bug means the "threshold crossed" observation is factually false. The condition "If safety threshold is crossed" was not met; "If safety threshold is *reported* crossed" was met.
  5.  **Verdict:** **Override Permitted.** Do not delete the checkpoint.
  6.  **Constraint:** This requires a **Registry Integrity Incident** report and PI signature. You must prove the bug exists. If you cannot prove the bug, you must delete the checkpoint. The cost of being wrong (safety risk) outweighs the cost of being right (lost run), but since the input is corrupted, the policy is void.

  ---

  ### Operator's Note: Uncertainty and Contention

  I am least confident in the **Input Validation Failure** exception (Case 3). This loophole is necessary to prevent catastrophic loss from instrumentation errors, but it is vulnerable to motivated reasoning. A researcher can always claim "the data looked wrong" to escape a painful commitment.

  **What would change my mind:** If we had an immutable, cryptographically signed logging pipeline verified at T-reg. If the observation source is trusted, the exception should be removed entirely.

  **Contested View:** Many updateless theorists argue that even with a buggy sensor, you should follow the policy to maintain logical consistency with your past self (acausal self-binding). I reject this for internal lab operations where no external predictor exists. In the absence of an external entangler, "credibility with past self" is a psychological cost, not an economic one. However, keeping this exception requires the 6-month suspension penalty to remain severe, or the registry will become advisory only. I may be underestimating the cultural damage of allowing *any* override.
