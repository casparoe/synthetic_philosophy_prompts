      *   *Endurantism (3Dism):* Objects are wholly present at each moment. Persistence is identity over time. Change is having different properties at different times.
      *   *Perdurantism (4Dism/Worm Theory):* Objects are spacetime worms. Only temporal parts exist at a moment. Persistence is the relation between temporal parts.
      *   *Exdurantism (Stage Theory):* Objects are instantaneous stages. Persistence is a modal relation (counterpart theory) between stages. "I" am just a stage; my past/future selves are counterparts, not literally me.

