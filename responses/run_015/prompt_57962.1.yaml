      *   Actually, for a quiz like this, it's better to have the scoring key analyze the *pattern* of answers rather than a rigid "If you picked mostly A, you are X." Why? Because people are inconsistent (as the user noted).
      *   *Better approach:* Assign points to each answer choice corresponding to a view. Sum the points at the end.
