          *   X: Both are counterparts.
      *   *Q7 (Change):* How do I change properties?
          *   E: I have properties relative to times.
          *   P: My parts have different properties.
          *   X: This stage has this, that stage has that.
      *   *Q8 (Pause/Gap):* Did the object exist during the gap?
