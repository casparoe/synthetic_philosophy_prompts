      *   **Twist:** Hidden velocity cards revealed in Round 3 that retroactively invalidate trades.
      *   **Constraints:** No upfront lecture. Don't say "Block Universe" until the end. Address predictable failure (inventing a "super-observer"). Admit limitations (can't simulate "no flow" directly).
