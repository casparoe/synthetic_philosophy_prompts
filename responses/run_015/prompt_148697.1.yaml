prompt: |-
  I run a small grad seminar on time and determinism, 6 people, about 90 minutes. Design a classroom game that makes the Rietdijk-Putnam argument feel visceral — not just "time is relative" but the actual collapse of a shared "now" across frames. I want participants assigned to three different inertial frames with different velocities, each holding a deck of event-cards they think are "present." The rules should force them to trade cards (representing causal influence) but they can only trade if both agree the event is present in their frame. They should hit a contradiction where two frames each have legitimate reasons to reject the other's "now," and the scoring system should reward consistency within a frame but punish cross-frame coordination. Include roles, materials I can make with index cards, a timeline for the 90 minutes, and a debrief that maps the breakdown onto the block universe conclusion. Also tell me what will predictably go wrong the first time — probably they'll invent a "super-observer" to break the tie — and how to handle it without giving away the answer. Be honest about which feature of the view — the metaphysical claim that there's no flow of time at all — the game can't reproduce and I have to supply. Don't lecture up front, and don't call it "block universe" untill they've already argued themselves into the corner. Also, inject a weird twist: each frame gets one hidden velocity card they don't reveal until round three, which retroactively invalidates some trades they've already made. That sounds fun.
