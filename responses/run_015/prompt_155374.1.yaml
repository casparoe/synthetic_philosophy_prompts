      *   *Mechanism:* Liar has advantage (lies fit wishes, facts are stubborn).
      *   *Extension:* Public record is scarce.
      *   *Threat:* Frame capture (consuming record capacity) > Propositional error (falsehood).
      *   *Cost:* Rebuttal tax (cost of refutation).
      *   *Analogy:* Denial-of-Service (DoS) attack.
      *   *Prediction:* Believability-independence (implausible claims still drain capacity).
      *   *Solution:* Defend institutional fact-finders (slow, non-combat ready) vs. Fact-checkers (fast, combat ready).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Comm/Behavior):* Effect sizes. If nobody believes it, does it actually harm? "Believability-independence" contradicts standard misinformation lit.
      *   *Objection 2 (Arendt Scholar):* Presentism. Are you twisting Arendt to fit Twitter? Is this really *Lying in Politics*?
