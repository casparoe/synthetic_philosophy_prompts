      *   *Anekantavada:* Reality is complex; no single proposition captures the whole truth.
      *   *Syadvada:* The logical framework. Every statement is conditioned (*syat* = "maybe" or "from a certain perspective").
      *   *Saptabhangi:* The seven modes of predication (is, is not, is and is not, is inexpressible, etc.).
      *   *Avaktavya:* The inexpressible/indeterminate mode. Crucial for avoiding contradiction when opposing truths hold simultaneously.
      *   *The Trap:* Relativism says "Truth is subjective." *Anekantavada* says "Truth is objective but multifaceted, and our access is limited."

  3.  **Brainstorming: Syadvada vs. Contextualism:**
      *   *Contextualism (Analytic tradition):* Truth conditions depend on context (e.g., "I know I have hands" is true in a casual context, false in a skeptical context). It usually preserves bivalence within a specific context.
      *   *Syadvada:* It's not just about linguistic context; it's about ontological complexity. The object *itself* has infinite attributes (*ananta dharmatmakam*). The "maybe" (*syat*) isn't skepticism; it's a marker of partial access to a robust reality.
      *   *Key Difference:* Contextualism often resolves contradiction by shifting the goalposts of meaning. *Syadvada* accepts the contradiction as real but simultaneous, resolved only by acknowledging the limitation of language (*avaktavya*). Contextualism says "A is true here, false there." *Syadvada* says "A is true, not-true, and both, sequentially or simultaneously depending on the aspect, but ultimately indescribable in one go."
