answer: |-
  This is a fantastic constraint. The Frege–Geach problem is indeed structurally isomorphic to a type mismatch in a strict functional language. The metaethical debate is largely about whether you can implement a `Truth` interface for a type that is fundamentally `Action`.

  Here is the translation of the dialectic into your native tongue, followed by the residue report.

  ### 1. The Type Signatures

  **Cognitivism (Realism)**
  Moral sentences are values. They denote properties of the world.
  *   **Type:** `MoralSentence :: Proposition`
  *   **Evaluation:** `eval :: Proposition -> Bool` (or `TruthValue`)
  *   **Semantics:** Referential. `StealingIsWrong` reduces to `True`.
  *   **Composition:** Standard boolean logic. `if p then q` works because `p` and `q` are `Bool`.

  **Expressivism (Non-Cognitivism)**
  Moral sentences are effects. They update the agent's conative state (plans, emotions, commitments).
  *   **Type:** `MoralSentence :: IO Unit` (or `Action`, `Tell Attitude`)
  *   **Evaluation:** `exec :: Action -> World -> World` (Side effect)
  *   **Semantics:** Performative. `StealingIsWrong` executes `boo(Stealing)`.
  *   **Composition:** Sequential composition (`>>`). `do { boo(Stealing); boo(BrotherStealing) }`.

  ### 2. Frege–Geach as a Type Error

  You nailed the setup. Frege–Geach is literally a compilation error in the Expressivist type system.

  Consider the modus ponens structure:
  1.  `StealingIsWrong`
  2.  `If StealingIsWrong Then BrotherStealingIsWrong`
  3.  `Therefore BrotherStealingIsWrong`

  In Cognitivism:
  ```haskell
  p :: Bool
  p = True

  imp :: Bool -> Bool -> Bool
  imp True q = q

  -- Type checks fine.
  ```

  In Expressivism:
  ```haskell
  p :: IO ()
  p = putStrLn "Boo stealing!"

  -- The conditional premise requires p to be a value to determine control flow.
  -- But p is an action.
  if p then ... -- TYPE ERROR: Expected Bool, got IO ()
  ```

  The problem is that logical connectives (`if`, `not`, `and`) are defined over **Values** (truth conditions), but Expressivism defines moral sentences as **Effects** (force conditions). You cannot branch on a side effect without executing it, but executing the antecedent of a conditional ("If stealing is wrong...") asserts the antecedent, which changes the meaning of the conditional.

  ### 3. The Expressivist Repair: Higher-Order Attitudes

  The early expressivist repair (e.g., Hare, early Blackburn) attempts to redefine the logical connectives to operate on `Action` types directly.

  Instead of `imp :: Bool -> Bool -> Bool`, you define `imp_att :: Action -> Action -> Action`.
  The type of "If stealing is wrong, then..." is not a boolean function, but a constructor for a **complex attitude**.

  *   **Translation:** This is not lifting a side effect into a monad (which preserves the effect semantics). It is defining a custom DSL where the "values" are actually thunks of attitudes.
  *   **The Code:**
      ```haskell
      data Attitude = Boo Action | IfThen Attitude Attitude | Not Attitude

      -- "Stealing is wrong"
      s_wrong :: Attitude
      s_wrong = Boo (steal)

      -- "If stealing is wrong, then..."
      conditional :: Attitude
      conditional = IfThen s_wrong (Boo (encourage_brother))
      ```
  *   **The Catch:** You have lost the connection to standard logic. You have `IfThen`, but does it obey modus ponens? You have to prove that your custom `Attitude` algebra is isomorphic to Boolean Algebra. If it isn't, you haven't solved logic; you've just built a parallel toy logic that looks similar.

  ### 4. Quasi-Realism: The Free Monad Strategy

  Quasi-Realism (Blackburn, Gibbard) is the sophisticated repair. It admits that moral sentences *are* effects fundamentally, but argues we can construct a **Free Monad** (or an AST) over these effects that supports a `Truth` interface.

  *   **The Move:** Don't execute the `IO`. Build the data structure representing the computation.
  *   **Type:** `MoralProp :: Free AttitudeF Bool`
  *   **Mechanism:**
      1.  We treat moral claims as constructors in a syntax tree.
      2.  We define an equivalence relation (`==`) on these trees based on **consistency of attitudes**, not correspondence to world-states.
      3.  We implement a `Truth` typeclass for this type.

  ```haskell
  -- The Quasi-Realist Type
  data Moral a = Assert a | Dispute (Moral a) (Moral a) | Conditional (Moral a) (Moral a)

  -- We define 'truth' internally as 'stability under reflection'
  isTrue :: Moral a -> Bool
  isTrue (Assert x) = checkConsistency x
  isTrue (Conditional p q) = not (isTrue p) || isTrue q
  ```

  *   **Is it lifting a side effect?** Yes, effectively. It's the `IO` monad implemented as a pure data structure (`Free IO`). You can reason about the program without running it.
  *   **Declaring Victory:** The Quasi-Realist says: "Since we can define `isTrue`, `&&`, `||`, and `not` on our `Attitude` type such that they obey the laws of logic, we are licensed to talk *as if* they are truth-apt."
  *   **The "As If":** This is the crucial FP distinction. It's like implementing a `Monad` for a type that isn't inherently monadic, or defining `Eq` for a function type (which is generally impossible, but suppose you restrict the domain). You get the *interface* of truth, but the *implementation* is consistency-checking.

  ### 5. Residue Report: Where the Translation Breaks

  You suspected the monad analogy does too much work. You are correct. The translation captures the **structural** problem (Frege-Geach) perfectly, but it obscures the **ontological** stakes. Here is what has no counterpart in your vocabulary:

  #### A. Mind-Independence vs. Constructibility
  In FP, if I define `data Bool = True | False` and implement `not`, it doesn't matter if `Bool` is primitive or defined by me. The behavior is what matters (parametricity).
  In Metaethics, the Cognitivist claims moral facts are **mind-independent**.
  *   **FP Analogy:** This is like claiming `True` exists in the hardware physics of the CPU, not just as a convention in the ISA.
  *   **The Gap:** FP is inherently constructivist. Data is what you define. The Cognitivist insists moral data is *discovered*, not defined. The Quasi-Realist admits it's defined (by our attitudes) but argues the distinction doesn't matter for practice. The Cognitivist says it matters for **normativity**.

  #### B. The "Fake Belief" Objection (Ontology vs. Interface)
  You asked: *Is the reassembled thing really belief or a convincing fake?*
  In FP, if two types satisfy the same laws (e.g., `Monad` laws), they are interchangeable. If Quasi-Realism implements the `Truth` interface correctly, it *is* truth, functionally.
  **But:** Metaethicists care about the *source* of the validity.
  *   **Cognitivist:** "Your `isTrue` function checks internal consistency. My `isTrue` checks external correspondence. If the world changes, my truth value flips. Yours only flips if your feelings change."
  *   **Translation:** The Cognitivist is claiming access to an **External API** (The World) that the Quasi-Realist is mocking with a **Stub**.
  *   **Why it matters:** If morality is a Stub (Quasi-Realism), can we be *mistaken* about fundamental values, or only inconsistent? If I say "Genocide is good" and am consistent, the Quasi-Realist struggles to say I am *false* (only that they disagree). The Cognitivist says I am factually wrong, like saying `2 + 2 = 5`.
  *   **FP Hole:** In FP, `2 + 2 = 5` is a type error or a failed assertion. In Metaethics, "Genocide is good" type-checks in both systems. The dispute is whether it evaluates to `False` because of the *universe* or because of *our shared library*.

  #### C. Normative Force (The "Ought")
  *   **FP Analogy:** Side effects (`IO`) compel action. Values (`Bool`) do not.
  *   **The Problem:** Expressivism explains why morality motivates (it's `IO`). Cognitivism struggles to explain why knowing a moral fact (`Bool`) compels you to act (Hume's Law).
  *   **Quasi-Realism:** Tries to have both. It says "We treat these `Bool`s as if they compel action."
  *   **Distortion:** In FP, a value never compels action unless passed to an interpreter. The Quasi-Realist claims the *belief itself* has normative force. This is a property of human psychology that has no analogue in type theory. A `Bool` in Haskell doesn't care if you use it. A moral "truth" claims authority over you.

  ### Verdict on Your Suspicion

  > *My suspicion is that monad is doing too much work in the analogy, and that the interesting question — whether the reassembled thing is really belief and truth or a very convincing fake, and why anyone thinks the difference matters — is exactly where the translation bottoms out.*

  **Confirmed.**

  The translation proves that Expressivism is not *incoherent* (it compiles if you build the right Free Monad). It solves the Frege-Geach type error.
  However, the translation cannot capture the **Realism** charge.
  *   In FP, "Realism" about a type is meaningless. A list is a list.
  *   In Metaethics, "Realism" means "This type is backed by the hardware of the universe, not just our runtime."

  The dispute is thinner than it sounds **structurally** (both sides agree on the logic we should use), but thicker than it sounds **ontologically** (one side thinks the logic maps to territory, the other thinks it maps to the map).

  **What I distorted:**
  1.  **Truth:** I treated truth as `Bool`. In metaethics, truth is a property of *propositions*. The Cognitivist says moral sentences *are* propositions. The Expressivist says they *become* proposition-like through the Quasi-Realist construction.
  2.  **Composition:** I treated logical composition as function composition. In metaethics, logical composition is about *preservation of truth*. The Expressivist has to redefine "preservation of truth" as "preservation of attitude consistency."

  **Final Diagnosis:**
  You have successfully compiled the Expressivist library. It links correctly. The Cognitivist is not complaining about the build; they are complaining that your library is a **simulation** of reality, whereas theirs is a **driver** for reality. Whether that distinction has any runtime consequences is the entire remaining debate.
