answer: |-
  The deadlock you have constructed is not a failure of your drafting; it is a faithful dramatization of a genuine logical impossibility. Your friend is correct that there is a formal result behind this, but you do not need the name of the theorem to understand the machinery of the trap. The problem lies not in the characters' stubbornness, but in the geometry of their desires relative to the rules they accept.

  Here is how you should understand the situation within the room, an evaluation of the proposed escapes, and advice on how the chapter might honestly conclude.

  ### 1. The Anatomy of the Deadlock

  To understand why the afternoon goes round in circles, you must see that the two principles Miriam and Rafe appeal to rely on a hidden assumption: that what one person does with their own life does not deeply disturb the other.

  *   **Principle 1 (Sovereignty):** "I decide what happens to me."
  *   **Principle 2 (Unanimity):** "If we both agree on what is better, we do that."

  The cycle arises because Miriam and Rafe are not indifferent to each other's actions. They are, in the technical sense, "meddlesome."
  *   **Miriam** claims sovereignty over whether *she* reads ($M$ vs $B$). She chooses $B$ (Burn) over $M$ (Miriam Reads).
  *   **Rafe** claims sovereignty over whether *he* reads ($R$ vs $B$). He chooses $R$ (Rafe Reads) over $B$ (Burn).
  *   **Together**, they agree on the comparison between the two reading options ($M$ vs $R$). Miriam prefers $M$ (she suffers so he doesn't have to); Rafe prefers $M$ (he wants to see her suffer). By Principle 2, $M$ must win.

  Now follow the chain:
  1.  Because $M$ beats $R$ (by Unanimity), and...
  2.  Because $R$ beats $B$ (by Rafe's Sovereignty)...
  3.  Logic demands that $M$ must beat $B$.
  4.  **But** Miriam's Sovereignty dictates that $B$ beats $M$.

  The principles contradict each other. You cannot have a system that respects individual sovereignty over personal acts *and* respects unanimous agreement *when* individuals care passionately about each other's personal acts. The circle is not a mistake; it is the sound of two valid moral rules grinding against one another.

  ### 2. Evaluating the Escapes

  Here is what each proposal actually does to the problem.

  **Rafe's Fourth Option (Both Read)**
  *   **Verdict:** **Restatement of the Problem.**
  *   **Why:** Adding a fourth option does not remove the contradiction among the original three. If the group still accepts the two principles, the cycle remains in the subset of $\{M, R, B\}$. Furthermore, this option likely intensifies Miriam's horror (making $B$ even more preferable to her) without solving the logical clash. It creates more noise, not a signal.

  **The Solicitor's Vote (Agenda Setting)**
  *   **Verdict:** **A Real Solution (via Power).**
  *   **Why:** You noticed the outcome depends on the order of voting. This is not an accident; it is the inevitable consequence of a cycle. When preferences circle, there is no "will of the majority" to discover; there is only the power of the person who holds the pen.
  *   **In the Scene:** If the Solicitor votes $M$ vs $R$ first, $M$ wins. Then $M$ vs $B$, $B$ wins. Result: Burned. If he votes $R$ vs $B$ first, $R$ wins. Then $R$ vs $M$, $M$ wins. Result: Miriam Reads.
  *   **Implication:** This dissolves the deadlock by abandoning the search for a "fair" procedure. It admits that someone must rule. The Solicitor becomes a benevolent dictator. This is dramatic, but it shifts the tension from the siblings to the Solicitor.

  **Drawing Lots**
  *   **Verdict:** **Evasion.**
  *   **Why:** Randomization respects neither principle. It violates Sovereignty (Miriam's right not to read is reduced to a probability) and it violates Unanimity (there is a chance the outcome they both dislike—Rafe reading—might occur, or the outcome they both prefer—Miriam reading—might not).
  *   **Miriam's Objection:** You are correct that this does not answer her. If her objection is to the *sin* of Rafe reading, a 33% chance of sin is still a sin she facilitated. It moves the circle from logic to chance, absolving the humans of responsibility but solving nothing morally.

  **Miriam's Decentralization ("Let each decide")**
  *   **Verdict:** **Change of Subject.**
  *   **Why:** This works only if the goods are not scarce. If there were two books, Miriam could burn hers and Rafe could read his. But there is one typescript. It is a "rival" good. If Rafe decides to read it, he physically prevents Miriam from burning it. If Miriam decides to burn it, she physically prevents Rafe from reading it.
  *   **The Trap:** This proposal pretends the conflict is about internal conscience, when it is actually about physical custody. It yields an outcome where they fight over the paper. It relocates the clash from the solicitor's office to a physical struggle, which may be useful for the plot, but it is not a logical resolution.

  **Bargaining (The Cheques)**
  *   **Verdict:** **The Only Pragmatic Solution.**
  *   **Why:** This is the Coase Theorem in action. If they can trade, they can break the cycle. If Miriam values burning the book at £10,000 (in moral relief) and Rafe values reading it at £5,000 (in pleasure), Miriam should pay Rafe £5,001 not to claim it, and then burn it. Both are happier than the forced outcome.
  *   **The Catch:** You asked if the size of the cheques can be settled *before* the entitlement is assigned. **No.** The price depends entirely on who holds the right.
      *   If Miriam has the right to burn, Rafe must pay her to stop. He will pay up to his value (£5k).
      *   If Rafe has the right to read, Miriam must pay him to stop. She will pay up to her value (£10k).
      *   The "price" is not intrinsic to the book; it is intrinsic to the *power dynamic*.
  *   **In the Scene:** This is the most human resolution. It forces them to put a monetary value on their moral positions. Miriam offering a cheque is an admission that her principle is for sale. Rafe accepting it is an admission that his liberty has a price.

  ### 3. Advice for the Chapter's Conclusion

  You asked what the chapter can *honestly* conclude. It cannot conclude with a discovery that one procedure is "fair." There is no fair procedure here. The honesty lies in the characters realizing that **principles are luxuries they cannot afford.**

  **Recommendation:**
  Do not let the Solicitor solve it with a vote. That makes it a legal problem. Let it remain a moral one.

  The most resonant ending is for **Miriam to propose the bargaining**, not as a way to win, but as a way to expose the truth. She offers to buy Rafe's consent. Rafe counters. In the haggling, they reveal the true hierarchy of their values.
  *   If Miriam pays Rafe to let her burn it, she validates Principle 1 (Sovereignty) but abandons the moral high ground (she bribes him to be good).
  *   If Rafe refuses the money and demands she read it, he validates Principle 2 (Unanimity) but reveals his malice.

  **The "Give Up":**
  If you need one of them to yield on a principle:
  *   **Miriam** should give up **Sovereignty**. She cannot control Rafe's soul, only the physical object. She must realize that trying to control his access via rules is what created the trap. She should take the book and burn it, accepting that she is violating his "right" to choose, because the cost of the cycle is higher than the cost of the injustice.
  *   **Rafe** should give up **Unanimity**. He should realize that even though they both agree $M$ is better than $R$, forcing $M$ on Miriam is a cruelty that outweighs the logical consistency.

  **The Winning Move:**
  The scene should end with the **Solicitor refusing to decide.** He should explain the circle to them, in plain English, exactly as you have described it to me. He should say: *"The Will asks for a decision, but your rules make a decision impossible. As long as you both claim a right to judge the other's choice, the law cannot help you. One of you must surrender your principle."*

  Then, silence. The deadlock is broken not by a rule, but by exhaustion, or love, or spite. If Miriam burns it, she saves Rafe from himself but damns herself as a tyrant. If she hands it to him, she saves her conscience but loses her brother to the text.

  The tragedy is not that they cannot agree. It is that **agreement is logically impossible** without one of them ceasing to care about the other. If Miriam didn't care if Rafe read it, the cycle vanishes ($M \succ B$ for her, $R \succ B$ for him, no conflict). If Rafe didn't care if Miriam read it, the cycle vanishes. Their entanglement is the cause of the paralysis. The novel's hinge should turn on the realization that their relationship is the obstacle to the resolution of the mother's legacy.
