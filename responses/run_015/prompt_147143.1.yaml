          *   Consistent Heterophenomenology vs. Consistent First-Person Authority.
          *   The "Phenomenological Contract" (authority granted in exchange for correlation).
      *   **Constraints:** Formal, polished style (science-ideas publication feature). No bibliographies/citations/references. No asking for references. Clear reasoning on what is underdetermined vs. what is committed.
      *   **Conclusion:** What would change in protocols if built on consistent philosophical premises?

  2.  **Brainstorming & Conceptual Mapping:**

      *   *The Phenomenon:* Concordant trials (Report = Behavior) $\rightarrow$ Report is transparent truth. Discordant trials (Report $\neq$ Behavior, e.g., blindsight) $\rightarrow$ Report is suspect/narrative/error.
      *   *Distinction 1: Epistemic Authority vs. Causal Efficacy.*
          *   Authority: Who knows best about the experience? (Subject).
          *   Efficacy: Does the experience do work in the system? (Behavior).
          *   The practice seems to conflate them: If it doesn't drive behavior (efficacy), the subject loses authority.
      *   *Distinction 2: Phenomenal Reality vs. Narrative Construction.*
          *   Dennett's Heterophenomenology treats *all* reports as texts.
          *   Standard practice treats *some* as direct windows (concordant) and *some* as texts (discordant).
      *   *Distinction 3: Transparency vs. Interpretation.*
          *   Transparency: The report *is* the data.
          *   Interpretation: The report *needs* decoding via behavior.
      *   *Distinction 4: Functional Correlation vs. Ontological Presence.*
          *   Does consciousness exist only if it functions (Global Workspace/Higher-Order)? Or can it exist without report/behavior (Overflow/Phenomenal Consciousness)?
          *   The practice leans toward Functionalism: No behavior $\rightarrow$ likely no consciousness (or at least, the report is wrong).

  3.  **Structuring the Argument:**

      *   **Title:** Needs to be academic yet engaging. Something about "The Epistemic Schism" or "The Phenomenological Contract."
      *   **Introduction:** Define the observed pattern (the "Alignment Condition"). State the thesis: This practice is not methodologically neutral; it encodes a specific, often unacknowledged, metaphysical commitment to functionalism, creating an unstable hybrid epistemology.
      *   **Section 1: The Double Standard of Transparency.** Analyze the shift from treating reports as data vs. treating reports as theory-laden narratives based on behavioral alignment.
      *   **Section 2: The Implicit Ontology (Functionalism vs. Realism).** Does this require Functionalism? Argue that while a Direct Realist *could* do it for pragmatics, the *interpretive move* (calling it confabulation) implies the behavior is more real than the feeling.
      *   **Section 3: The Phenomenological Contract.** Explore the idea of authority granted in exchange for correlation. This is a strong conceptual hook.
      *   **Section 4: Consistent Alternatives.**
          *   *Consistent Heterophenomenology:* Treat all reports as texts. Behavior is just another text.
          *   *Consistent First-Person Authority:* Report is king. Behavior is secondary.
      *   **Conclusion:** Summarize the commitments. Call for methodological coherence.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the journalist's observation. It's acute. Call it the "Alignment Condition."
      *   *Epistemic Status:* When aligned, the subject is a "privileged observer." When misaligned, they are a "storyteller." This is the crux.
      *   *Philosophical Commitment:* Is it *strictly* functionalist? If I am a Direct Realist, I believe qualia exist. If I see a subject say "I saw nothing" but they guess correctly, a Direct Realist might say "They have qualia but can't access/report them." But the lab says "The report is wrong." That implies the *behavior* defines the consciousness. That is Functionalist/Representationalist.
