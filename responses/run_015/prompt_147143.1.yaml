          *   *First-Person:* Chalmers-esque. If they say it's there, it's there. If behavior fails, behavior is the broken link, not the experience.
      *   *Refining the Tone:* Needs to be authoritative, precise, avoiding colloquialisms. Use terms like "epistemic asymmetry," "ontological commitment," "methodological coherence."

  5.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I distinguish between what is *required* vs. what *fits*?
      *   *Correction:* I need to be careful. A pragmatist could argue they exclude discordant trials just to reduce noise, not because they deny the consciousness. I must argue that the *interpretation* of the discordance (as confabulation) is the philosophical commitment, not the exclusion itself.
      *   *Check:* Did I address the "Phenomenological Contract"?
