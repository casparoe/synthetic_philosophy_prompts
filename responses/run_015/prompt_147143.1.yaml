answer: |-
  **The Alignment Condition: Epistemic Asymmetry in the Neuroscience of Consciousness**

  The institutional practice you describe constitutes what we might term the *Alignment Condition*. In this operational framework, the epistemic status of a first-person report is not intrinsic but conditional, fluctuating based on its correlation with third-person behavioral metrics. When subjective report and objective discrimination converge, the report is afforded the status of a transparent window onto phenomenal reality. When they diverge, the report is reclassified as a constructed narrative, a confabulation, or an error of introspective access. This methodological pivot is not merely a statistical convenience; it is a philosophical maneuver that encodes specific, often unacknowledged, commitments regarding the nature of consciousness, the authority of the subject, and the relationship between knowledge and causality.

  To understand the philosophical weight of this practice, we must first disentangle the core distinctions at play. The primary tension lies between *epistemic authority* and *causal efficacy*. Epistemic authority refers to the subject's privileged position to know what it is like to be them; causal efficacy refers to the capacity of a mental state to influence downstream processing and behavior. Standard protocols implicitly collapse these distinct categories. By granting authority only when efficacy is demonstrated, the protocol presupposes that a state lacking behavioral traction is either non-existent or epistemically inaccessible to the subject. This suggests that the "reality" of the experience is being validated by its functional output, rather than its phenomenal presence.

  Furthermore, the practice navigates a precarious boundary between *phenomenal reality* and *narrative construction*. In concordant trials, the subject's utterance is treated as a direct description of a phenomenal fact. In discordant trials, the same utterance is treated as a text requiring interpretation—a story the subject tells themselves about their internal state, which may be false. This creates an ontological schism: the same linguistic act is sometimes a mirror of reality and sometimes a veil obscuring it. The criterion for distinguishing mirror from veil is external behavioral performance. This implies that the laboratory possesses a third-person vantage point capable of adjudicating the truth of first-person experience, a claim that is philosophically contentious.

  Does this selective practice strictly presuppose a functionalist or representationalist theory of consciousness? To answer this, we must distinguish between what the practice *requires* and what merely *fits* it.

  Strictly speaking, a Direct Realist about qualia—who holds that phenomenal properties exist independently of their functional role—could adopt the exclusion of discordant trials for purely pragmatic reasons. They might argue, "We are studying reportable consciousness, and discordant trials introduce noise regarding the reporting mechanism." However, the *interpretive* move you identified—characterizing the discordant report as confabulatory or as a failure of access—goes beyond pragmatism. It makes an ontological claim: that the behavioral measure is a more reliable indicator of the presence of consciousness than the subjective feeling itself. If the subject says "I saw nothing" but guesses correctly, and the lab concludes "The subject is unaware," the lab is asserting that awareness *just is* the availability of information for reporting or action. This is a functionalist commitment. It treats consciousness not as a raw feel that might overflow behavioral capacity, but as a functional status defined by information access. Therefore, while a Direct Realist could use the exclusion rule, they could not consistently endorse the *interpretation* of the discordance without contradicting their realism. The standard practice thus smuggles in a functionalist ontology under the guise of methodological rigor.

  This leads to the question of coherence. Is there a single philosophical position that licenses granting transparency to concordant reports while interpreting discordant ones as narrative texts? The answer is negative. The practice relies on an unstable hybrid of two incompatible commitments. In the concordant condition, it operates on a principle of *First-Person Authority*: the subject is the ultimate arbiter of their experience. In the discordant condition, it switches to a principle of *Third-Person Supremacy*: the objective measure overrides the subjective claim.

  A coherent philosophy must choose a lane. A consistently applied *heterophenomenological* stance would treat all reports, concordant or discordant, as texts. From this viewpoint, a report of "visibility" is no more transparently true than a report of "invisibility." Both are verbal behaviors to be modeled. The objective discrimination task is simply another stream of data, not a truth-maker for the subjective report. If a laboratory adopted this consistent stance, exclusion criteria based on misalignment would vanish. Instead, discordant trials would become the primary object of study, modeling the divergence between the "phenomenal world" the subject describes and the "manifest world" their behavior indicates. Null results would not be discarded as noise but analyzed as evidence of the dissociation between the narrative self and the processing self.

  Conversely, a consistently applied *First-Person Authority* view would treat every subjective report as equally authoritative regarding the presence of phenomenology, regardless of behavioral correlation. If a subject reports no experience but performs above chance, this view mandates the conclusion that phenomenal consciousness was absent (trusting the report), and the behavior was driven by unconscious mechanisms. If a subject reports experience but performs at chance, the view mandates that consciousness was present but lacked causal efficacy (overflow). Adopting this stance would fundamentally alter experimental design. Inclusion criteria would rely solely on the report. Behavioral measures would be demoted to secondary status, used only to map the causal powers of the experience, not to validate its existence. The "Alignment Condition" would be recognized not as a filter for data quality, but as a specific phenomenon to be explained—the occasional coupling of phenomenology and control, rather than the definition of phenomenology itself.

  This brings us to the niche framing of the *phenomenological contract*. This concept illuminates the implicit social and epistemic agreement between researcher and subject. In standard protocols, the subject is granted narrative authority only in exchange for correlation with objective measures. It is a conditional citizenship within the experiment: "We will believe you about your inner world, provided your inner world behaves as we expect outer objects to behave." This contractual asymmetry sustains the selective stance. The researcher retains the right to veto the subject's testimony if it violates the functional expectations of the paradigm.

  Could this selective stance survive the dissolution of that contract? If a protocol systematically privileged report over behavior, the contract would be inverted. The subject would be the sovereign of reality, and the behavioral data would be the suspect variable. However, the current selective stance depends entirely on the existing contract. Without the assumption that behavior is the ultimate validator, the reclassification of discordant reports as "confabulation" loses its justificatory ground. One cannot call a report a confabulation unless one assumes access to a truth that the report fails to capture. In consciousness research, that "truth" is behaviorally defined. If the contract is dissolved, the researcher loses the leverage to declare the subject wrong about their own experience.

  In conclusion, the institutional pattern you have identified is not philosophically neutral. It is underdetermined only in its pragmatic application; ontologically, it commits the field to a functionalist view where consciousness is validated by causal efficacy. It relies on an incoherent epistemology that oscillates between first-person authority and third-person supremacy depending on the data's convenience. A laboratory built on consistent philosophical premises would look markedly different. A consistent heterophenomenological lab would analyze all reports as behavioral data, removing the hierarchy between "accurate" and "confabulatory" trials. A consistent first-person authoritarian lab would accept subjective reports as the definitive measure of consciousness, treating behavioral dissociations as evidence of unconscious processing or phenomenal overflow, rather than as grounds for excluding the subject's testimony. Until these commitments are made explicit, the field risks building a science of consciousness on a foundation that systematically excludes the very phenomena it claims to study whenever they fail to perform on command.
