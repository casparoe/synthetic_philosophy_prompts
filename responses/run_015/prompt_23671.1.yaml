      *   Ensure the distinction between *epistemology* (how we know) and *ontology* (what exists) is clear, as physicists sometimes conflate them.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "mosaic"? Yes, need to ensure the user knows it means "spatiotemporal distribution of local qualities."
      *   *Check:* Did I address the "contingency" argument clearly? It's tricky. If laws supervene on facts, could the facts be the same and laws different? Humeans say no. Anti-Humeans say yes. I need to make sure Greg's complaint is understood as "Laws lose their modal force."
      *   *Check:* Make sure to mention Nancy Cartwright or similar philosophy of science perspectives, as a physicist might resonate with "laws lie" or "capacity" views.
