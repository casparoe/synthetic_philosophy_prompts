answer: |-
  You are describing a classic philosophical problem, and your intuition is shared by some of the most significant moral philosophers of the last century. You are not necessarily rationalizing complacency; you are grappling with the tension between **moral obligation** and **human flourishing**.

  There is a robust philosophical case to be made that a life devoted *single-mindedly* to moral goodness is, paradoxically, not a fully good human life. Here is the breakdown of why your discomfort is valid, drawing on ethics, psychology, and the nature of friendship.

  ### 1. The Argument from "Moral Saints"
  In 1982, philosopher Susan Wolf wrote a famous paper titled *"Moral Saints."* Her thesis aligns almost perfectly with your observation. She argued that if we take moral goodness to be the supreme value, the ideal human would be a "moral saint"—someone who devotes every moment to bettering the world.

  However, Wolf points out that such a person would be deeply unappealing. To be a moral saint, one must sacrifice non-moral virtues and interests. You cannot be a moral saint and also be a person who loves jazz, collects stamps, follows sports, or reads "frivolous" novels, because time spent on those things is time *not* spent feeding the hungry or curing diseases.

  Wolf argues that a well-rounded human life requires **non-moral goods**. A life without hobbies, aesthetic appreciation, or "useless" joy is narrow. As you noted, your friend doesn't leave room for things that aren't morally serious. If morality crowds out everything else, the result is a life that lacks richness, even if it is morally pristine. You are sensing that **goodness is only one component of a good life**, not the entirety of it.

  ### 2. The Integrity Objection
  Philosopher Bernard Williams argued that demanding someone sacrifice all their personal projects for the greater good attacks their **integrity**. Our "ground projects" (the things that give our lives meaning, like art, family, or specific passions) are what make us who we are.

  If your friend has subsumed her entire identity into moral utility, she may have lost touch with the personal impulses that make a life feel authentic. When you say she "laughs less than she used to," you are observing a diminishment of her spontaneity. A life lived constantly through the filter of "Is this the right thing to do?" can become rigid. You aren't just feeling inadequate; you are witnessing a constriction of the human spirit, and that is naturally exhausting to witness.

  ### 3. The Relational Asymmetry
  There is also a relational dynamic at play here. Friendship is ideally a space of equality and mutual vulnerability. However, a "relentlessly good" person creates an implicit hierarchy, even if they never lecture.

  *   **The Burden of Example:** Her existence functions as a silent judgment. Even if she says, "I'm just doing what's required," the implication is that *you* are not. This puts you in a position of constant defensiveness.
  *   **The Lack of Reciprocity:** To be friends with a saint is difficult because saints often cannot indulge in the petty grievances, gossip, or moral ambiguities that often bond friends. You cannot complain about your job being tedious if she spends her weekends in a refugee camp. This limits the emotional bandwidth of the friendship. You feel exhausted because you are carrying the weight of that asymmetry.

  ### 4. Moral Scrupulosity vs. Moral Goodness
  It is also worth considering a psychological perspective. There is a condition known as **moral scrupulosity**, a form of OCD where a person becomes obsessed with the fear of being immoral.

  While your friend may be genuinely virtuous, the *relentlessness* you describe—the inability to relax, the elimination of all non-edifying hobbies, the sense that leisure is forbidden—can be a sign of compulsion rather than freedom. True virtue is often described by Aristotle as a mean between extremes, practiced with practical wisdom (*phronesis*). If her behavior is driven by an anxiety that she must *always* be maximizing good, she may not be acting from a place of peace, but from a place of fear. Watching someone live in a state of high-functioning anxiety, even if it looks like altruism, is naturally draining for an observer.

  ### 5. Addressing the "Rationalization" Charge
  Your mutual friend says you are just uncomfortable with your own mediocrity. This is the "shame defense." It is true that **some** of your feeling is likely guilt. It is uncomfortable to be reminded that we could do more.

  However, acknowledging that guilt does not invalidate the philosophical critique. You can admit, *"Yes, I could volunteer more, and I feel bad that I don't,"* while simultaneously holding, *"But I also believe a life without dancing or reading silly novels is impoverished."*

  You are not rationalizing complacency if your critique is about **pluralism**. You are arguing that moral value is not the *only* value. There is aesthetic value, recreational value, and the value of rest. To reject a life of single-minded moral devotion is not necessarily to reject morality; it is to reject **moral monism** (the idea that morality trumps all other considerations).

  ### Conclusion
  You do not need to avoid your friend, but you do not need to emulate her, either. The "exhaustion" you feel is a signal that her lifestyle is not sustainable for you, and perhaps not even ideal for her.

  A good human life is not a straight line toward moral maximization. It is a tapestry that includes duty, yes, but also joy, rest, creativity, and connection. You can admire her generosity without accepting her narrowness.

  **The Verdict:** You are not just rationalizing. There is a genuine philosophical and humanistic case that a life devoid of "morally neutral" joys is incomplete. You can respect her path while choosing a different one—one that makes room for the dance, the novel, and the rest that allows you to be good *sustainably*, rather than relentlessly.
