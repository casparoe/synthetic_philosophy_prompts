answer: |-
  Here is the procedure, designed for the laminated card, followed by the placement of your four edge cases, the sentence frames, the test runs, and the honest limitations.

  ### The Card: Night Shift Communication Protocol

  **1. SAFETY:** Is there immediate physical risk (fall, aggression, elopement)?
  *   **YES:** Secure safety first. Talk after.
  *   **NO:** Go to 2.

  **2. RETENTION:** Will the resident remember this answer in 60 minutes?
  *   **YES:** Tell the objective truth. (Stop).
  *   **NO:** Go to 3. *(Handles Ninety-Second Uptake)*

  **3. INTENT:** Am I trying to change their *belief* or calm their *fear*?
  *   **CHANGE BELIEF:** (e.g., making them think someone is coming). **STOP.** Call Charge. *(Handles Borrowed Voice)*
  *   **CALM FEAR:** Go to 4.

  **4. WORDS:** Can I validate the *feeling* without confirming the *fact*?
  *   **YES:** Use a Validation Frame (see below).
  *   **NO:** (You must assert a falsehood to soothe). **STOP.** Call Charge. *(Handles Drift)*

  **5. AUTHORITY:** Does this contradict a specific family or care-plan directive?
  *   **YES:** Call Charge. *(Handles Family Lies)*
  *   **NO:** Proceed with Step 4.

  ***

  ### Placement of Your Four Situations

  1.  **Borrowed Voice:** This hits **Step 3 (Intent)**. If the aide transmits the text ("She says she'll be here"), the intent is to make the resident *believe* the daughter is coming. That is a deliberate will to deceive. The card forces a **STOP/Call Charge**. You (the nurse) must decide if you will absorb the moral weight of that lie or call the daughter to correct the record.
  2.  **Standing Fictions:** This is **not on the card**. The card governs *utterances*. The painted bus stop is environmental therapy, pre-approved by administration and family upon admission. It is a "silent concealment," not an active assertion. The aide does not need to evaluate the wall; she only evaluates her speech.
  3.  **Drift:** This hits **Step 4 (Words)**. The resident asks a 1961 question. The fact is unknowable/noise. The *feeling* (worry about husband) is real. The card directs the aide to answer the feeling ("You're worried about him") rather than the fact ("He's dead" or "He's home"). This is Augustinian concealment: you withhold the painful fact without asserting a falsehood.
  4.  **Ninety-Second Uptake:** This hits **Step 2 (Retention)**. If they won't remember, the "truth value" of the sentence matters less than the "emotional residue." However, the card prevents the slide into "they won't remember, so I can say anything." It forces you to Step 3: even if they forget, are you trying to *trick* them or *soothe* them? If trick, stop.

  ***

  ### Three Memorizable Sentence Frames
  *For "Where is X" / "When is X coming" queries that fail Step 2.*

  1.  **The Validation Frame:** "It sounds like you're missing [X]. Tell me about them."
      *   *Why it passes:* Factually true (they are asking, therefore they are missing/worrying). No claim made about X's location.
  2.  **The Partnership Frame:** "I'm not sure right now, but I'm here with you until we figure it out."
      *   *Why it passes:* True (you are there). Shifts focus from the absent object to the present safety.
  3.  **The Routine Frame:** "[X] usually comes during the day. Let's have breakfast first."
      *   *Why it passes:* Technically true (most visitors come during the day). Redirects to immediate reality without confirming a specific visit.

  ***

  ### Test Runs

  **Case 1: Mrs. K, 3am. "When is my mother picking me up?" (Mother died 2001).**
  *   **Step 1 (Safety):** No.
  *   **Step 2 (Retention):** No (Late stage Alzheimer's).
  *   **Step 3 (Intent):** Calm Fear (She feels abandoned/childlike).
  *   **Step 4 (Words):** Can I validate without confirming? Yes.
  *   **Action:** Use Frame 1. "You're thinking about your mother. You loved her very much."
  *   **Result:** Distress acknowledged, no lie told.

  **Case 2: Mr. R. Catheter change. "Is this going to hurt?" (It will).**
  *   **Step 1 (Safety):** Yes (Trust/Consent issue). *Note: Pain management is safety.*
  *   **Step 2 (Retention):** Yes (He is vascular, lucid intervals, will remember the pain/betrayal).
  *   **Action:** **Tell the Truth.** "It will be uncomfortable for a moment, but I will be as gentle as I can."
  *   **Result:** Augustine forbids lying here (harmful lie). Clinical best practice forbids it (destroys trust). Card routes to Truth.

  **Case 3: Mrs. O. Son died last month. Forgets in 10 mins. Family says "Tell him he's fine."**
  *   **Step 1 (Safety):** No.
  *   **Step 2 (Retention):** No.
  *   **Step 3 (Intent):** Calm Fear (Grief).
  *   **Step 4 (Words):** Can I validate? Yes ("You're worried about your son").
  *   **Step 5 (Authority):** **YES.** Family directive contradicts Step 4 (Family wants factual falsehood: "He is fine").
  *   **Action:** **Call Charge (You).**
  *   **Result:** This is a values conflict, not a fact check. The card correctly kicks it to you. You must decide whether to honor the family's wish (protecting them from repetitive grief) or the resident's reality (allowing fresh grief). The card refuses to let the aide make that call.

  ***

  ### Augustine's Grading of Lies: On the Card?
  **No.**
  Augustine distinguishes between *pernicious lies* (harmful), *officious lies* (helpful to another), and *jocose lies* (jokes).
  *   **Why not on the card:** At 3am, an aide cannot adjudicate the "grade" of a lie. That requires moral reflection time they do not have.
  *   **Where it belongs:** **Post-Incident Review.** When an aide calls you because they hit a "STOP" on the card, or when a family complains, you use the grading to document *why* a deviation occurred.
      *   *Example:* "Aide used an officious lie to prevent physical aggression during care." (Justifiable).
      *   *Example:* "Aide used a pernicious lie to save time on feeding." (Disciplinary).
      *   It helps you write the narrative for the medical record or incident report without blaming the aide for following a rigid rule.

  ***

  ### What This Procedure Can't Do (The Honest Limitations)

  1.  **It cannot solve the "Mrs. O" problem.** The card will correctly identify that the family's request requires a value judgment (Step 5), but it cannot tell *you* which value wins. You will still have to decide whether repetitive grief is worse than deception. The card just ensures *you* make that call, not the exhausted aide.
  2.  **It relies on the Aide's assessment of "Retention."** Step 2 asks: "Will they remember in 60 minutes?" A new aide might guess wrong. If they guess "No" and it's actually "Yes," you have authorized a lie. You will need to train this specifically: "If you aren't sure, assume Yes."
  3.  **It cannot prevent "Compassionate Fraud."** An aide who wants to lie because it's faster will learn to game Step 3 ("I was calming fear, not changing belief"). The card creates a structure for accountability, but it doesn't replace supervision.
  4.  **It creates a "Two-Tier Truth" system.** Residents who pass Step 2 get truth; residents who fail get validation. If a family member sees you validating a falsehood to a lucid-looking resident, it looks like lying. You will need to explain this protocol to families at admission: *"We speak to the emotional truth when the memory cannot hold the factual truth."*

  **Final Note:** This card shifts the burden from "Is this sentence factually accurate?" to "Is this interaction ethically safe?" That is the Augustinian shift. It protects the aide's conscience and the resident's dignity, but it demands you (the Charge) own the hard calls it kicks up.
