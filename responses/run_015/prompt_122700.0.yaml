answer: |-
  **MEMORANDUM**

  **TO:** Infrastructure Design Review Board
  **FROM:** Staff
  **SUBJECT:** Recommendation on Downtown Signal Retiming Proposal (Case 24-09)

  ### 1. Prediction and Primary Rule

  **Prediction:** The Board should rule this proposal **Political**, requiring a public hearing.

  **The Governing Rule:** Based on the six precedents, the Board appears to be applying a **Foreclosure-of-Access-without-Alternative Test**.
  Under this rule, a design feature is *political* if it functionally forecloses safe or viable access to a public resource for a specific class of residents, *and* reasonable alternative channels or routes are not preserved. Intent is irrelevant (Precedent 2: Parkway); the focus is on the material distribution of standing and capacity.

  **Application to Retiming:**
  1.  **Foreclosure:** Moving from actuated (on-demand) to fixed intervals at 4.0 ft/s forecloses safe crossing for residents physiologically incapable of that speed. Unlike the *Road Diet* (Precedent 4), which reallocated space between chosen modes (driving vs. cycling), this reallocates safety based on biological capacity.
  2.  **No Alternatives:** Five of the nine intersections are choke points (rail crossings). The alternatives (steep grades/staircases) are not viable equivalents for the affected class (wheelchair users, elderly). This distinguishes it from *Online Permits* (Precedent 5), where phone/in-person options were retained.
  3.  **Standing:** The combination of physical exclusion and increased enforcement transforms a safety risk into a legal liability for the pedestrian, akin to the *Smart Meters* (Precedent 3) shutoff risk or *App Bins* (Precedent 6) enumeration requirement.

  ### 2. Alternative Rules and Predictions

  Three other rules fit the six precedents reasonably well but yield different results for the retiming.

  **A. The "Intent and Justification" Test**
  *   **Rule:** A feature is *not political* if the stated aim is technical efficiency (traffic flow, emissions, maintenance) rather than social engineering.
  *   **Fit:** Fits *Road Diet* (transport policy) and *Online Permits* (efficiency). Strains *Shelter* and *Parkway* (where technical justifications were accepted but rulings were still *Political*), but one could argue those rulings ignored the justification rather than adopted it as a rule.
  *   **Prediction for Retiming:** **Not Political.** The stated aims are throughput and emissions; the pedestrian impact is an unintended side effect noted in the model.
  *   **Why it fails:** It contradicts *Parkway Overpasses*, where the Board explicitly stated they did not need to decide *why* the clearance was chosen. If engineering justification immunized a design, *Shelter* (maintenance/vandalism) would have been *Not Political*.

  **B. The "New Administrative Power" Test**
  *   **Rule:** A feature is *political* only if it grants the city new discretionary power to punish, monitor, or cut off residents.
  *   **Fit:** Fits *Smart Meters* (remote shutoff) and *App Bins* (enumeration/access control). Weak on *Shelter* and *Parkway* (passive exclusion).
  *   **Prediction for Retiming:** **Not Political.** The city gains no new data or discretionary shutoff power; the signal is automated. The enforcement is pre-existing, merely applied to a new constraint.
  *   **Why it fails:** It cannot explain *Shelter Redesign*. A dark corner and leaning rail grant no new administrative power, yet were ruled *Political* because they distributed *safety* and *rest*.

  **C. The "Modal Allocation" Test**
  *   **Rule:** A feature is *not political* if it allocates infrastructure among recognized travel modes (cars, bikes, pedestrians), even if one mode is burdened.
  *   **Fit:** Fits *Road Diet* perfectly. Fits *Parkway* poorly (unless "bus riders" are a mode distinct from "drivers").
  *   **Prediction for Retiming:** **Not Political.** This is a reallocation of green time from pedestrians to vehicles (and fast pedestrians to slow pedestrians) for corridor efficiency.
  *   **Why it fails:** It collapses the distinction between *choice* and *capacity*. In *Road Diet*, a driver can choose to bike. In Retiming, a senior cannot choose to walk faster. Treating physiological capacity as a "mode" would undermine the protection of standing established in *App Bins*.

  ### 3. Strongest Analog

  **The Parkway Overpasses (Precedent 2)** is the controlling analog.

  *   **Similarity:** Both use engineering specifications (bridge clearance vs. walk speed) to optimize for vehicle flow (cars vs. green wave). Both result in the functional exclusion of a specific class (transit riders vs. slow pedestrians) from a specific destination (lakefront vs. crossing the rail corridor).
  *   **Key Parallel:** In *Parkway*, the Board ruled that the *reason* (grading/sight lines) did not matter; the *effect* (buses can't pass) controlled. Here, the *reason* (emissions/throughput) should not matter; the *effect* (slow pedestrians can't cross safely) controls.
  *   **Distinguishing Factor:** The *Road Diet* (Precedent 4) is the counter-analog the applicant will cite. You must distinguish them by noting that the Road Diet preserved *access* for all modes, merely shifting *priority*. The Retiming removes *safe access* entirely at choke points.

  ### 4. Underdetermination and Principles

  The precedents genuinely underdetermine this case on one specific axis: **Is safety "standing"?**

  *   *Shelter* suggests yes (lighting affects safety/loitering).
  *   *Road Diet* suggests no (parking loss is a burden, not a standing issue).
  *   **The Choice:**
      *   **Option A (Hearing Required):** You adopt the principle that **physiological capacity is not a policy preference.** You cannot treat walking speed like choosing to drive a bike; it is an attribute of the citizen. To design against it is to distribute standing based on ability.
      *   **Option B (No Hearing):** You adopt the principle that **traffic engineering standards are presumptively neutral.** If the 4.0 ft/s speed is a recognized industry standard (e.g., MUTCD), you rule that adopting standard practice is "ordinary policy" (like *Road Diet*), shifting the burden to the legislature to fund mitigation (e.g., longer cycles), not the Board to block the design.

  ### 5. The Wedge Case

  To separate the **Foreclosure Test** (my recommendation) from the **New Power Test**, consider this variant:

  **Proposal:** *Automated Detection Retiming.*
  The city installs cameras at the nine intersections. The signal remains fixed for the green wave, *but* if a camera detects a pedestrian moving slower than 4.0 ft/s, it automatically extends the walk interval. No push buttons are needed.

  *   **Foreclosure Test:** **Not Political.** Access is preserved; the design accommodates the capacity difference without user action.
  *   **New Power Test:** **Political.** The city has installed surveillance infrastructure capable of tracking pedestrian movement speeds and linking them to signal logic, creating a new data capacity akin to *Smart Meters* or *App Bins*.

  If the Board would approve *Automated Detection* without a hearing, they are prioritizing **Access** over **Power**. If they require a hearing, they are prioritizing **Privacy/Anti-Surveillance** over **Access**.

  ### 6. Reflection: Changing My Mind

  **The Fact That Would Change My Recommendation:**
  If the 4.0 feet-per-second walking speed is the **current federal minimum standard** (MUTCD) and the previous 3.5 ft/s was a local waiver, my recommendation flips to **Not Political**.
  *   **Reasoning:** This would align the proposal with *Road Diet*. It would become a matter of complying with baseline safety regulations rather than a discretionary distribution of access. The "political" weight would shift to the *failure to mitigate* (e.g., not installing detection), but the signal timing itself would be statutory compliance.

  **Where My Reasoning Is Most Likely to Fail:**
  I am relying heavily on the **choke point** aspect (the rail crossings). If legal counsel advises that the "public right of way" includes the *network* rather than specific *nodes*, the Board could argue that access is not foreclosed because the pedestrians *can* cross the rail corridor, just at a different location (the staircase).
  *   **Vulnerability:** This mirrors the *Online Permits* ruling (alternatives existed). If the Board accepts the staircase as a "reasonable alternative channel," the *Foreclosure Test* fails, and the ruling becomes *Not Political*.
  *   **Counter:** The *Parkway* precedent rejects "alternative routes" if they are functionally inferior (bus ramp dropped as too expensive). A staircase is functionally inferior to a ramp for the class affected. I must ensure the record explicitly documents the staircase as non-compliant or functionally exclusionary to prevent the *Online Permits* analog from taking hold.

  **Recommendation:** Schedule for Public Hearing. The intersection of physiological exclusion, choke-point geography, and increased enforcement creates a distribution of standing that exceeds the bounds of ordinary traffic policy.
