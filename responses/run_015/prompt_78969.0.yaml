          *   *Assessment:* Tess hits a major philosophical hole (the "constitutive paradox"). Omar admits the flaw but offers a procedural patch.

      *   *Move 3: Tess (Instability & Non-Humans) vs. Omar (Guardians & All Subjected).*
          *   Tess: Constant re-litigation creates instability. What about fish/future gens? "Affected" dissolves the "people."
          *   Omar: Instability is honest. Use guardians for non-voters. Shifts argument to "All Subjected" (coercion/law).
