      *   *The "Who Votes on Who Votes" Problem:* This is the classic "Boundary Problem" in democratic theory (Whelan, 1983). Tess is technically correct that you can't democratically decide the demos without already having a demos. Omar's procedural fix tries to bypass this but doesn't solve the logical circle.
