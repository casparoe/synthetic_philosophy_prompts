answer: |-
  This is a fantastic debate. You've stumbled onto one of the oldest, hardest problems in political philosophy, known as **"The Boundary Problem"** (or the question of *constituting the demos*). Philosophers like Frederick Whelan and Robert Dahl have written entire books trying to answer exactly what Tess and Omar are arguing about.

  Here is a move-by-move refereeing, an analysis of the specific concepts, what they both missed, and a potential third option.

  ---

  ### Part 1: Move-by-Move Refereeing

  **Round 1: The Opening Salvo**
  *   **Tess (Town Borders):** Argues for stability and definition. Democracy requires a defined "people."
  *   **Omar (All Affected):** Argues for moral justice. If you suffer the consequence, you get a say.
  *   **Verdict:** **Tie.** Tess is right about *functionality* (you can't run an election without a voter list). Omar is right about *fairness* (it is unjust to dump costs on neighbors without their input).

  **Round 2: The "Who Decides?" Trap**
  *   **Tess:** Asks who defines "seriously affected." Points out the circular logic (you need voters to decide who the voters are).
  *   **Omar:** Admits borders are arbitrary too. Suggests a procedural fix (petition to join the voter roll).
  *   **Verdict:** **Tess wins the logic, Omar wins the pragmatism.** Tess has identified the "Boundary Problem" correctly: You cannot use democracy to decide the boundaries of democracy without already having boundaries. However, Omar is right that existing borders *are* often historical accidents, so "tradition" isn't a perfect defense either.

  **Round 3: Instability vs. Guardians**
  *   **Tess:** Argues constant re-litigation makes governance impossible. Brings up fish/future generations to show "affected" is too broad.
  *   **Omar:** Says instability is honest. Suggests "guardians" for non-voters. Pivots to "All Subjected" (if the law rules you, you vote).
  *   **Verdict:** **Tess wins on administration, Omar wins on ethics.** Tess is right that an election where the electorate changes every week is unworkable. Omar's "guardian" idea is a real thing (see: New Zealand granting legal personhood to rivers), but it's not the same as voting.

  **Round 4: Coercion vs. Impact**
  *   **Tess:** Points out the data center isn't *lawmaking* over the downstream town; it's just causing damage.
  *   **Omar:** (No response recorded, but this was his last pivot).
  *   **Verdict:** **Tess wins.** Omar tried to switch from the "All Affected Principle" to the "All Subjected Principle." The All Subjected Principle says you vote if you are *coerced by the law*. But the downstream town isn't subject to the *town's* laws regarding the data center; they are just suffering the *side effects*. Tess correctly identified that Omar's new rule didn't fit the facts.

  ---

  ### Part 2: Deep Dive on Specific Arguments

  **1. The "Infinite Line" (Who is affected?)**
  *   **Who is right?** **Tess.**
  *   **Why:** Omar tries to limit it to "seriously affected," but Tess is correct that "serious" is subjective. If you open the door to "affected," you logically have to let in the climate activists, the future generations, and the ecosystem. While Omar says that's a "feature," Tess is right that for a *vote* to happen, you need a closed list. You cannot hold an election with an infinite number of potential voters.

  **2. The "Can't Vote on Who Votes" Problem**
  *   **Who is right?** **Tess.**
  *   **Why:** This is the hard logical stop. To hold a vote on "Who should be allowed to vote?", you first need a list of people allowed to vote on *that* question. It is a logical circle. Omar's idea of a "procedure" tries to bypass this, but someone still has to write the procedure, and that person wasn't voted on by the people excluded by the procedure.

  **3. The Provisional/Redo List Idea**
  *   **Who is right?** **Split.**
  *   **Why:** Omar is right that boundaries *should* be adjustable over time (census redistricting is an example of this). But Tess is right that doing it *every election* creates chaos. A middle ground is adjusting boundaries every 10 years (like census districts), not every vote.

  **4. Fish and Future People**
  *   **Who is right?** **Tess (on voting), Omar (on representation).**
  *   **Why:** Fish cannot vote. Future people do not exist yet. Tess is right that including them in the *electorate* is impossible. However, Omar is right that a good government considers them. The solution isn't giving fish ballots; it's having laws that protect them regardless of voting (environmental regulations).

  **5. Coercion vs. Being Affected**
  *   **Who is right?** **Tess.**
  *   **Why:** In political theory, the "All Subjected Principle" (coercion) is usually seen as more workable than the "All Affected Principle." If the Town passed a law saying "Downstream Town must pay us $1 million," the Downstream Town is being coerced and should have a vote. But the Town passing a law saying "We allow a factory here" that *incidentally* hurts the Downstream Town is an **externality**, not coercion. Omar tried to use a rule about coercion to solve a problem about externalities, and Tess caught him.

  ---

  ### Part 3: What Both of Them Missed

  There are two massive holes in their debate that neither one touched.

  **1. The County Budget Fact**
  *   **The Fact:** The prompt says the tax break comes out of the **County** budget, not the Town budget.
  *   **The Miss:** Tess argues for the *Town* voting. Omar argues for the *Downstream Town* voting. **Neither argued for the County.**
  *   **Why it matters:** If the County is paying for the tax break, the County residents are the ones being "taxed." By Tess's own logic (taxation/land), the County should vote. By Omar's logic (affected by budget), the County should vote. Both kids ignored the actual payer in favor of a philosophical debate about borders.

  **2. Voting vs. Veto vs. Representation**
  *   **The Miss:** They assume the only way to have a say is a **vote in the referendum**.
  *   **Why it matters:** In the real world, the downstream town doesn't need a vote in *your* town to protect their water. They need **regulatory power**. The State usually controls water rights. The downstream town could sue if the water quality drops. You don't solve externalities by expanding the voter list of the polluter; you solve them by giving the victim legal tools to stop the pollution.

  ---

  ### Part 4: Is There a Third Option?

  Yes. Both Tess and Omar are stuck in a binary: "Either only locals vote" or "everyone affected votes." The real-world solution is **Multi-Level Governance.**

  **The "Layered Authority" Compromise:**
  Instead of changing who votes in the *Town* referendum, you acknowledge that different parts of the decision belong to different groups.

  1.  **Zoning/Location:** **Town Residents Vote.** (Tess is right: it's their land and roads).
  2.  **Tax Breaks:** **County Residents Vote.** (Because it's county money).
  3.  **Water Usage:** **State/Regional Agency Decides.** (Because the river belongs to the region, not the town. The downstream town gets to testify here, not vote).
  4.  **Construction/ Labor:** **Regional Agreement.** (If the workers are coming from the city, the city might get a workforce development deal, but not a vote).

  **Why this works:** It respects Tess's need for stable borders (Town voters vote on Town stuff) but respects Omar's need for justice (County voters decide County spending, State regulators protect the River).

  ---

  ### Part 5: Final Verdict

  **Who was more right overall?**

  **Tess wins on Procedure; Omar wins on Morality.**

  *   **Tess** is more right about how democracy actually *functions*. You cannot run a stable society if the electorate changes based on every single issue. Her "Boundary Problem" argument is logically unbeatable.
  *   **Omar** is more right about how democracy *should feel*. It is genuinely unfair for the Town to get the jobs and tax base while the County pays the cost and the Downstream Town loses the water.

  **The Winner:**
  If I have to pick a winner based on the specific facts you gave: **Omar.**

  **Why?** Because Tess's argument relies on the Town having the right to decide everything within its borders. But the facts show the Town *doesn't* own the consequences (the County pays, the neighbors drink the water). When a local decision creates regional costs, the "Town Only" vote becomes a tool for exploitation.

  **The Best Argument Omar Could Have Made:**
  Omar lost the last round on "coercion," but he should have argued **Jurisdictional Overlap.** He should have said: *"Tess, you say borders matter. But the River's border doesn't match the Town's border. The Budget's border (County) doesn't match the Town's border. When the problem spills over the border, the vote must spill over the border, or else the border is just a wall we hide behind."*

  **Grade:**
  *   **Tess:** A- (Logically sound, but ignored the specific unfairness of the facts).
  *   **Omar:** B+ (Morally strong, but got trapped in the "who defines affected" loop and messed up the coercion argument).
  *   **Your Group:** Incomplete (You missed the County angle entirely!).

  If you want to impress your teacher, point out that **the referendum itself might be the wrong tool.** The Town shouldn't be voting on a County expense or a Regional water right. Those should be decided by the County Board and the State Environmental Agency, respectively. That solves the voting problem by changing the question.
