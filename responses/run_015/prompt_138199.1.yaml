      Claim 1 (Definitions) is conceptually upstream of Claim 2 (Design). You need to know *what* responsibility you are aiming for (accountability vs. blame) to design the control. However, for a *software engineer*, Claim 2 is the most tangible "change what we build." Claim 1 changes "what we write in the runbook." The prompt asks what changes "what we build."
