      2.  **Claim 1 (Three Gaps):** If you get this wrong, your incident response is chaotic. High priority, but secondary to preventing the incident.
      3.  **Claim 3 (Strict Liability):** If you get this wrong, you might go bankrupt, but it doesn't make the software safer. It's a financial strategy.

