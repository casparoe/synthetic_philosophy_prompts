          *   *Actionability:* High. You can measure intervention rates, time-to-approve, and override frequency.
          *   *Verdict:* This is the core engineering/design constraint.

      *   **Claim 3: Accept Strict Liability and Price It In.**
          *   *Validity:* Mixed/Contextual. Legally, this depends on jurisdiction and contracts. Philosophically, it's a cop-out if safety is possible.
          *   *Practicality:* Dangerous for a startup. "Pricing it in" implies you know the risk distribution. With LLMs, tail risk is unknown. If you move money and steal it all, pricing it in doesn't save you from bankruptcy or criminal negligence.
          *   *Actionability:* Low/Misleading. This is a business/legal strategy, not an engineering design principle. Relying on this might lead to under-investing in safety.
          *   *Verdict:* Least useful for *building* the system. It's a financial hedge, not a safety feature.

