          *   *Practicality:* Crucial for runbooks. If something breaks, do we need to fire someone (blame), explain to the customer (accountability), or refund/fix (remediation)?
          *   *Actionability:* High. You can design logging for explanation, processes for remediation, and policies for blame.
          *   *Verdict:* This is the foundational conceptual work. It dictates *what* problems you are solving.

      *   **Claim 2: HITL needs Meaningful Control.**
          *   *Validity:* High. "Automation bias" is real. If a human just clicks "approve" without understanding or ability to veto, they are a security theater prop, not a control.
