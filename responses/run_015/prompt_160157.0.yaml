      *   **Constraints:** Argue from the commitments as stated (stipulative glosses apply), general reasoning about evidence/inference, no external library/web access.
      *   **Calibration:** Attach rough confidence levels to judgments. Identify the point of least certainty. Flag empirical claims vs. conceptual reasoning.
      *   **Tone:** Critical, analytical, precise, avoiding fashion-based inference.

  2.  **Analyze the Commitments:**
