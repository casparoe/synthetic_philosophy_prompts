      *   (b) *Institutions recoverable:* Institutions (rules, norms) = Yes. Meanings/Cosmologies = No. Basis: Repeated, standardized, costly traces.
      *   (c) *Costly Signaling:* Costly/hard-to-fake behavior = best evidence for *actual belief* (vs. stated). Material > Text. Credibility-enhancing displays (CEDs).
      *   (d) *Material Engagement/Symmetry:* Meaning/cognition constituted *by* things. Resist object = symbol of antecedent belief.
      *   (e) *Relational Analogy Only:* Bridge behavior/pattern via documented process-to-pattern (middle-range), not formal analogy (similarity of form).
      *   (f) *Texts not Default:* Texts = prescriptive/elite. Objects = what people did. Don't let texts lens objects.
      *   (g) *Case Verdict:* Site with broken querns/smashed ware in pits. Inference: Socially recognized rule of closure (Institution). No inference on belief (animism, etc.).

  3.  **Initial Scan for Tensions:**
