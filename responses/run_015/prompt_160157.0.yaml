      *   (b) vs. (c): (b) says institutions yes, meanings/beliefs no. (c) says costly signaling reveals *belief*.
      *   (d) vs. (a)/(b)/(g): (d) says meaning is constituted by things (ontological entanglement). (a)/(b)/(g) say we can't recover meaning/belief, only practice/rules. If meaning is *in* the engagement, does reporting practice implicitly report meaning?
      *   (e) vs. (g): (g) infers a "rule of closure." Is this based on relational analogy (documented process) or just pattern recognition?
      *   (f) vs. (c): (c) says material > text for belief. (f) says text = prescriptive, object = descriptive. These seem compatible, but (c) leans heavily on *belief* inference which (a) and (b) restrict.

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension 1: The Belief Paradox (a/b vs. c).**
          *   (a) says: Objects never settle questions of belief content. Default = practices.
          *   (b) says: Institutions (rules) yes, cosmologies/beliefs no.
          *   (c) says: Costly signaling is evidence for *what people actually believed*.
          *   *Conflict:* (c) explicitly claims access to belief via material cost. (a) and (b) explicitly deny access to belief via material.
          *   *Severity:* High. This is a direct contradiction in the epistemic scope.
          *   *Resolution:* Either (c) must be downgraded to "commitment to action" (not belief) or (a)/(b) must allow *some* belief inference under strict costly signaling conditions.
          *   *Cost:* If (c) gives up "belief," it loses its punch against textual evidence (which claims belief). If (a)/(b) give up "no belief," they lose their safeguard against over-interpretation.

      *   **Tension 2: Ontology vs. Epistemology (d vs. a/b/g).**
          *   (d) says: Meaning is *constituted* by things (Material Engagement Theory vibe). Thinking happens *through* objects.
          *   (a)/(b)/(g) say: We can only recover practices/rules, not meaning/belief.
          *   *Conflict:* If meaning is constituted by the engagement (d), then describing the engagement (practice) *is* describing the meaning-making process. To say "we see the practice but not the meaning" (a/b/g) assumes a separation between practice and meaning that (d) explicitly denies.
          *   *Severity:* Medium-High. It's a philosophical category error.
          *   *Resolution:* (d) needs to be framed as an ontological claim about the past, while (a/b/g) are epistemic claims about *our access*. But if (d) is true, describing the practice *without* the meaning is an incomplete description of the phenomenon.
          *   *Cost:* If (d) is kept strong, (g)'s refusal to infer "spirit of the quern" might be inconsistent if the breaking *is* the meaning.

      *   **Tension 3: The "Rule" Inference in (g) vs. (e).**
          *   (g) infers a "socially recognized rule of closure."
