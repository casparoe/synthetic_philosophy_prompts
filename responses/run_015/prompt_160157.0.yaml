answer: |-
  ### Audit of Inference Charter Commitments

  This audit evaluates the logical coherence of the seven commitments (a–g) as stated. I have treated your glosses as stipulative definitions. The analysis prioritizes logical consistency over archaeological fashion, distinguishing between conceptual contradictions and empirical vulnerabilities.

  #### 1. Tension Analysis (Ordered by Severity)

  **Tension 1: The Epistemic Status of Belief (a/b vs. c)**
  *   **Severity:** Critical.
  *   **The Conflict:** Commitment (a) states that objects *never* settle questions of belief content and the default is to report practices. Commitment (b) reinforces this: institutions yes, cosmologies/beliefs no. However, commitment (c) asserts that costly material behavior is the *best evidence about what people actually believed*.
  *   **Why it is genuine:** (a) and (b) establish a prohibition on inferring belief from material remains (underdetermination). (c) establishes a permission (even an obligation) to infer belief from material remains (costly signaling). You cannot simultaneously hold that material evidence *never* settles belief content (a) and that it is the *best evidence* for actual belief (c).
  *   **Apparent Dissolution:** One might argue (c) refers to "commitment" while (a) refers to "theological content." However, (c) explicitly uses the phrase "what people actually believed." This is a direct lexical contradiction.
  *   **What must give:** Either (c) must be rewritten to refer to "commitment to action" rather than "belief," or (a)/(b) must admit an exception for costly signaling.
  *   **Cost:** If you revise (c) to remove "belief," you lose the rhetorical advantage of claiming material evidence accesses *internal* states better than texts. If you revise (a)/(b), you weaken your primary safeguard against over-interpretation.

  **Tension 2: Ontological Constitution vs. Epistemic Access (d vs. a/b/g)**
  *   **Severity:** High.
  *   **The Conflict:** Commitment (d) claims meaning is *constituted* by material engagement (people think *through* objects). Commitments (a), (b), and (g) claim we can recover the practice/rule but *not* the meaning/belief.
  *   **Why it is genuine:** If (d) is true, meaning is not an antecedent mental state hidden behind the object; it is emergent in the interaction. Therefore, if you successfully recover the "practice" or "engagement" (which b and g allow), you have, by the definition in (d), recovered the locus of meaning. To say "we see the practice but not the meaning" (a/b/g) presupposes a dualism (practice vs. meaning) that (d) explicitly rejects.
  *   **Apparent Dissolution:** This dissolves only if (d) is treated as an ontological claim about the past (how *they* thought) while (a/b/g) are treated as epistemic claims about the present (what *we* can know). However, (g)'s specific refusal to infer "spirit of the quern" implies the meaning is a separate propositional entity, which contradicts (d)'s claim that meaning is in the engagement.
  *   **What must give:** (g) needs to align with (d). If meaning is constituted by the breaking of the quern, describing the breaking *is* describing the meaning-making.
  *   **Cost:** Revising this requires you to admit that reporting "practice" *is* reporting a form of meaning, which blurs the hard line you draw in (b) between institutions (yes) and meanings (no).

  **Tension 3: The Basis of the Verdict (g vs. e)**
  *   **Severity:** Moderate.
  *   **The Conflict:** Commitment (e) permits inference only via *relational analogy* (documented process-to-pattern). Commitment (g) infers a "socially recognized rule" from a "composite site" pattern (standardized disposal).
  *   **Why it is genuine:** (g) does not explicitly cite a documented process-to-pattern link (middle-range theory). It relies on the logic of (b) (standardization = institution). If (b) is accepted as axiomatic, (g) follows. But if (e) is the *only* legitimate bridge, (g) is methodologically incomplete unless the link between "standardized pits" and "social rule" is empirically documented via analogy, not just asserted via (b).
  *   **Apparent Dissolution:** This dissolves if (b) is understood as a generalization derived from prior relational analogies. If (b) is a first principle, it conflicts with (e)'s demand for case-specific bridging.
  *   **What must give:** (g) needs to explicitly reference the relational analogy that links "standardized disposal" to "normative rule," or (e) must allow (b)'s criteria to stand as sufficient middle-range theory.
  *   **Cost:** If you tighten (g) to satisfy (e), the verdict becomes contingent on specific ethnographic parallels, weakening its generalizability.

  #### 2. Evaluation of the Case Verdict (g)

  **Does the package deliver the verdict?**
  No. The verdict in (g) is unstable given the current set.

  **Smuggling Detection:**
  (g) smuggles in a **Cartesian dualism** that the rest of the set complicates.
  1.  **Dualism of Practice/Belief:** (g) assumes one can cleanly separate the "rule of closure" (practice) from the "spirit of the quern" (belief). Commitment (d) argues against this separation (meaning is constituted by the act). If the residents broke the quern *because* of its spirit, the act and the belief are not separable in the material record.
  2.  **Dualism of Cost/Content:** (g) accepts the "costly" nature of the act (breaking fine ware) to infer a rule (per b), but rejects using that same cost to infer belief (per a), despite commitment (c) explicitly licensing belief inference from cost.
  3.  **The "Rule" Problem:** (g) infers a "socially recognized rule." Under (a), belief content is underdetermined. Is a "rule" not a form of shared belief content (i.e., "we believe one ought to do X")? If (b) allows "normative character" but (a) bans "belief content," you are relying on a semantic distinction between *norm* and *belief* that is not philosophically robust.

  **Conclusion on (g):** As written, (g) violates (c) by ignoring the belief-implications of costly destruction, and it violates (d) by treating the meaning as separable from the practice. It is only consistent with (a) and (b), which are themselves in tension with (c) and (d).

  #### 3. The Single Most Effective Revision

  **Revision:** Modify Commitment (c).

  **Current:** "Costly... behavior is our best evidence about what people actually **believed**..."
  **Proposed:** "Costly... behavior is our best evidence about what people were **committed to enacting**..."

  **Why this cleans up the most:**
  1.  **Resolves Tension 1:** It aligns (c) with (a) and (b). You can report "commitment to action" (practice/institution) without claiming access to internal "belief content" (cosmology/theology).
  2.  **Stabilizes (g):** It allows you to infer that residents were *committed* to the closure rule (costly act) without inferring they believed in a "spirit of the quern."
  3.  **Preserves (f):** It maintains the superiority of material over text (texts state beliefs; objects show commitments) without overclaiming epistemic access to mental states.
  4.  **Accommodates (d):** "Commitment to enactment" fits well with Material Engagement. One is committed to the *engagement*, not necessarily to a propositional belief.

  **Cost:** You lose the provocative claim that archaeology can recover "belief" better than history. You must settle for recovering "commitment" and "practice."

  #### 4. Calibration and Empirical Flags

  **Confidence in Judgments:**
  *   **Logical Contradiction (a/b vs c):** 95% Confidence. This is a straightforward propositional conflict.
  *   **Ontological Tension (d vs a/b):** 85% Confidence. This rests on the interpretation of "constituted" in (d). If you mean "causally influenced" rather than "ontologically constituted," the tension lessens, but your wording ("constituted by things") is strong.
  *   **Verdict Instability (g):** 90% Confidence. The verdict relies on distinctions the other commitments blur.

  **Least Sure Point:**
  *   **The Empirical Claim in (b):** I am least sure about the claim that "institutionalized behavior leaves repeated, standardized, costly-to-maintain material traces."
      *   *Reasoning:* This is an empirical claim about how the archaeological record behaves, not a conceptual truth. Standardization can arise from technological constraints, habit, or raw material availability without normative (institutional) force. Conversely, powerful institutions (e.g., taboos) may leave *no* material trace (negative evidence).
      *   *Action:* You should check this against the record. If standardization often arises from non-normative processes, (b) generates false positives, which undermines (g).

  **Empirical vs. Conceptual:**
  *   **Conceptual:** The tensions between (a), (c), and (d) are philosophical/logical. They can be resolved by rewriting definitions.
  *   **Empirical:** The validity of (b) (standardization = institution) and (e) (relational analogy reliability) depends on archaeological data. If middle-range theory (e) is weak, the whole charter collapses regardless of logical consistency.

  ### Summary Recommendation
  The package is currently **incoherent** due to the definition of "belief" in (c) clashing with the prohibition in (a)/(b).
  1.  **Adopt the Revision to (c)** (Belief $\rightarrow$ Commitment).
  2.  **Clarify (d)** to ensure it doesn't promise recoverable meaning that (a) forbids. Frame (d) as an ontological stance on the past, not an epistemic promise for the present.
  3.  **Verify (b)** empirically. If standardization does not reliably indicate normativity, (g) fails.

  If you make the revision to (c), the set becomes a robust "Practice-First Charter." If you keep (c) as is, you are promising access to mental states that (a) explicitly denies you can have.
