  We sit around the table, touch the **rupa**,
  The coffee cup, the wood, the sharp **vedana**
  Of heat against the palm. We name it **sanna**,
  A habit built of old and tired **sankhara**.
  You say there is no pilot in the **vinnana**,
  Just heat passing across the wick to **flame**.

  I wanted a soul to catch the light of **flame**,
  But you drew the body, merely shifting **rupa**,
  And said the light is leaning, like **vinnana**,
  Like sight depending on the pain, **vedana**.
  No man inside to steer **sankhara**,
  Just labels pasted on the world by **sanna**.

  It should be scary, losing hold of **sanna**,
  But Sunday light looks softer on the **flame**.
  If nothing owns the heavy build of **sankhara**,
  Then grief is just temporary **rupa**.
  No one to feel the sting of **vedana**.
  Name-and-form leans hard against **vinnana**.

  Two sheaves of reeds that prop up **vinnana**,
  Name-and-form, without the gloss of **sanna**.
  No one to feel the sting of **vedana**.
  There is no traveler inside the **flame**.
  The story breaks apart like brittle **rupa**,
  And yet the pattern holds through **sankhara**.

  Until the wick divides the **sankhara**,
  One spark lights two candles, mere **vinnana**.
  Neither the same nor different is the **rupa**,
  The logic holds until the split in **sanna**.
  Now two fires claim the lineage of **flame**,
  Both carry heat, but who feels the **vedana**?

  Neither the same nor different, feels **vedana**.
  A causal chain of complex **sankhara**.
  I watch the split and tremble at the **flame**.
  If nothing stands apart from **vinnana**,
  Who finishes the path? No fixed **sanna**.
  The burden drops, but who drops off the **rupa**?

  Who feels end of **vedana**, walks **sankhara**?
  Body breaks, mere **rupa**, lost **sanna**.
  Apart from **vinnana**, who quenches **flame**?
