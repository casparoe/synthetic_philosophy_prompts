prompt: |-
  I'm trying to figure out where to put my energy if I want to actually do something with the cyclical vs linear history thing—not just write another summary of Spengler and Toynbee. Specifcally, I'm interested in how these frameworks handle what you might call "nested discontinuities": long arcs that look linear (say, energy capture per capita) sitting inside shorter cycles of institutional collapse (like Polybius's anacyclosis or Ibn Khaldun's asabiyyah decay). There's no settled account of whether these scales interact or just talk past each other.

  So if you had about three years and a small team—say one philosopher of history, one comparative historian, one formal modeler—which open questions in this space should they actually prioritize? I'm thinking of things like whether cyclical decline is continuous or discrete/phase-transition-like, whether linear-progress metrics can be embedded in cyclical social models without contradiction, and what predictive or normative work these hybrid frames can do for long-horizon governance that pure linear or pure cyclical views can't. But I want you to rank them or replace them: which ones are upstream of the others, which are tractable without new archives, and which would actually change how we think about the rest? Defend the ordering—what criteria you're using, the trade-offs, and what kind of result over the next couple years would make you reorder the list. Write in American English. Lead with your bottom line in the first sentence, then the reasoning, with no preamble and no restating of the question. No bibliographies, no citations, no reading lists.
