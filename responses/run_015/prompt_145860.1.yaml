answer: |-
  # Exam Question: Rational Choice & Epistemic Symmetry (Seminar 405)

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question:**

  Douglas Hofstadter's concept of **superrationality** posits that in a symmetric Prisoner's Dilemma (PD), two rational agents who know they share identical reasoning processes should cooperate. They reason that whatever logic dictates their own choice will dictate their twin's choice; thus, the choice is effectively between (Cooperate, Cooperate) and (Defect, Defect).

  Consider a modified scenario: **The Opaque Twin Dilemma.**
  Two agents, A and B, are known to share identical reasoning algorithms and all non-indexical beliefs about the world. However, each agent has direct, first-person access to a private phenomenal state (e.g., the immediate intensity of a migraine) that the other cannot observe. This state acts as a modifier to their utility function: high pain increases the subjective value of immediate relief (associated with Defection) relative to mutual gain (associated with Cooperation). Agent A is currently in high pain; Agent B is not. Both know the structure of the dilemma and the fact that they share reasoning algorithms, but neither knows the other's current phenomenal state.

  **Write an essay addressing the following:**
  Determine whether superrational cooperation remains the rational choice for Agent A in the Opaque Twin Dilemma. In your analysis, you must explicitly address these three cruxes:
  1.  **Symmetry:** Does privileged access to a private phenomenal state break the epistemic or agential symmetry required for superrational reasoning?
  2.  **Transparency:** Does the transparency condition in Hofstadter's argument apply to reasoning *processes* (algorithms), mental *contents* (inputs/states), or both?
  3.  **Stability:** Does abandoning superrationality in this asymmetric case undermine its validity in the standard symmetric case, or does it establish a necessary boundary condition?

  ***

  # Model Answer

  **Title:** The Limits of Mirroring: Algorithmic Identity vs. Utility Divergence in the Opaque Twin Dilemma

  **Introduction**
  Hofstadter's superrationality relies on the premise of isomorphism between agents: if we reason identically, we must act identically. In the Opaque Twin Dilemma, while the reasoning *algorithms* are identical, the *inputs* to those algorithms (phenomenal states affecting utility) differ. This essay argues that superrational cooperation fails in this scenario because the symmetry of *incentives* is broken, even if the symmetry of *computation* is preserved. Agent A cannot assume Agent B will match their action, because the utility maximization target has diverged.

  **Crux 1: Privileged Access and Symmetry**
  The core of superrationality is the belief that $Action_{me} = Action_{twin}$. In the standard PD, this holds because the payoff matrix is common knowledge and identical. In the Opaque Twin Dilemma, the payoff matrix is subjective. Agent A's utility function $U_A$ is weighted by pain; Agent B's $U_B$ is not. While the *function* maximizing utility is the same ($f = \text{maximize}(U)$), the variable $U$ differs. Privileged self-access breaks the symmetry of the *decision situation*, even if it does not break the symmetry of the *decision maker*. Because A knows their own pain but not B's, A knows that the optimization problem they are solving is not identical to the one B is solving. Therefore, the inference "I will Defect, therefore B will Defect" is invalid. A might Defect due to pain, while B Cooperates due to comfort, despite running the same logic on different data.

  **Crux 2: Transparency of Process vs. Content**
  This distinction clarifies why the superrational link snaps. Hofstadter's transparency condition is often ambiguous: does it require us to see the other's *code* or the other's *screen*? In the Opaque Twin Dilemma, the *code* (reasoning process) is transparent and identical. However, the *screen* (mental contents/phenomenal states) is opaque. Superrationality requires transparency of the entire causal chain leading to action. If the private phenomenal state is an input to the algorithm, then algorithmic identity does not guarantee output identity. Rationality demands transparency of the *relevant variables*. Since the phenomenal state determines the utility ranking of outcomes, opacity regarding this state renders the twin's action unpredictable via superrational deduction. Thus, transparency must apply to mental contents (inputs), not just processes, for superrationality to hold.

  **Crux 3: Stability and the Standard Case**
  Does this failure undermine superrationality in the standard PD? It does not, provided we define the standard case strictly. The standard PD assumes common knowledge of payoffs. The Opaque Twin Dilemma introduces private information regarding preferences. Abandoning superrationality here does not create a slippery slope; rather, it establishes a necessary boundary condition: superrationality only functions under *payoff symmetry*. If we allowed superrationality to persist despite divergent utility functions, we would imply that rational agents should ignore their own preferences to match a twin's hypothetical action, which violates the definition of instrumental rationality. Therefore, rejecting superrationality here protects the coherence of the theory in the standard case by clarifying that "symmetry" implies symmetry of incentives, not just cognition.

  **Conclusion**
  Agent A should not rely on superrational cooperation. While A and B are cognitive twins, they are motivational strangers. The private phenomenal state introduces an asymmetry in the objective function that decouples the agents' actions. Superrationality survives only where the symmetry extends to the valuation of outcomes, not merely the computation of choices.

  **Coda: Self-Critical Reflection**
  The verdict above rests on the assumption that phenomenal states are independent inputs to a fixed algorithm. This verdict would change if one could demonstrate that **rational agency is defined solely over algorithmic structure, abstracting away from utility inputs (as in Functional Decision Theory).** If "I" am identified strictly with the source code rather than the source code plus its current runtime variables, then cooperation might remain rational because the *disposition* to cooperate is what is being mirrored, regardless of the immediate utility shift. A proof that first-person access is always representable as shared information (e.g., via physicalist supervenience) would also restore symmetry and validate superrationality.

  ***

  # Marking Scheme

  **Total Marks:** 25
  **Pass Threshold:** 13 Marks

  | Analytical Move | Marks | Characteristic Failure Mode |
  | :--- | :---: | :--- |
  | **1. Problem Framing:** Correctly identifies that while algorithms are identical, the *utility functions* or *inputs* diverge due to private states, creating a tension between cognitive symmetry and incentive asymmetry. | 5 | Confuses epistemic symmetry (knowing the same facts) with payoff symmetry (valuing outcomes the same). |
  | **2. Symmetry Analysis (Crux 1):** Argues that privileged self-access breaks the $Action_{me} = Action_{twin}$ link because the optimization targets differ, rendering the "twin" prediction unreliable. | 5 | Asserts symmetry is broken without explaining *how* private inputs alter the output of an identical algorithm. |
  | **3. Transparency Distinction (Crux 2):** Explicitly distinguishes between transparency of *process* (algorithm) and *content* (inputs/states), arguing that superrationality requires the latter for output correlation. | 5 | Treats "transparency" as a monolithic concept or claims process transparency alone is sufficient for action correlation. |
  | **4. Stability Argument (Crux 3):** Defends the standard case by arguing that rejecting superrationality here establishes a boundary condition (payoff symmetry) rather than invalidating the logic of the standard symmetric PD. | 5 | Claims that if superrationality fails here, it fails everywhere (slippery slope), or fails to distinguish the standard PD's common knowledge assumptions. |
  | **5. Coda (Self-Critique):** Identifies a specific theoretical shift (e.g., FDT abstraction or physicalist reduction of qualia) that would reverse the essay's conclusion, showing awareness of the argument's contingency. | 5 | Provides a vague generality (e.g., "new evidence could change things") without naming a specific argument or empirical consideration. |

  ***

  ### Examiner's Notes on Grading:

  *   **Move 1:** Look for the phrase "divergent utility functions" or "different inputs." If the student thinks the pain changes the *algorithm* rather than the *utility input*, deduct 2 marks but allow partial credit if the logic remains consistent.
  *   **Move 2:** Students may argue symmetry *holds* (that pain doesn't matter). This is acceptable **only if** they robustly justify why pain doesn't alter the decision output (e.g., arguing pain is irrelevant to rational choice). However, the Model Answer argues it breaks symmetry; students arguing it holds must explain why the utility shift doesn't decouple actions.
  *   **Move 3:** The key is the distinction. If they say "transparency is needed" but don't specify *of what*, cap this section at 2 marks.
  *   **Move 4:** Reward students who protect the standard PD. If they argue the standard PD is also doomed because we can never be sure of another's pain, they must argue this consistently (skepticism). If they waffle, deduct marks.
  *   **Move 5:** This is the discriminator for high grades. The specific consideration must be technical (e.g., "supervenience," "FDT," "logical counterfactuals"). Vague appeals to "more research" receive 0 marks for this move.
