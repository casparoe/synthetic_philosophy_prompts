          *   Demonstration on three specific invented cases (Afterimage, Libet-style timing, Time perception).
          *   Include at least one "unliked" outcome (bracketing interesting data or retaining "mistaken" data).
          *   Conclusion on limitations (confabulation, metaphor, uncooperativeness, philosophical judgment).

  2.  **Deconstruct Heterophenomenology for this Context:**
      *   *Core Tenet:* Treat the subject as an informant about their *seemings*, not an authority on the *reality* of their consciousness.
      *   *The "Neutral Stance":* Record what they say as text. Construct a "heterophenomenological world" (H-world) based *only* on that text. Do not assume the H-world matches the physical world or neural states yet.
      *   *Application:* The RA is the data collector. The PI/Theorist is the interpreter. The RA must avoid leading questions that presuppose ontological status (e.g., "Did you *really* see it?" vs. "Did it *seem* to you...?").
      *   *Simplification:* A full Dennettian analysis involves deep philosophical heavy lifting. An RA needs a protocol. The protocol must enforce the *bracketing* without requiring the RA to *do* the philosophy in real-time.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Phase 1: Preparation.* Mindset check. Am I ready to be neutral?
      *   *Phase 2: Elicitation.* Open-ended first. "What was that like?"
      *   *Phase 3: Clarification (The Core).* Distinguishing "seeming" from "believing." Probing metaphors.
      *   *Phase 4: Recording.* Verbatim vs. Summary. Flags.
      *   *Phase 5: Termination.* When to stop asking.
      *   *Essential Distinctions:* Seeming vs. Reality, Verbatim vs. Interpretation.
