answer: |-
  Your suspicion is well-founded: the debate over the Identity of Indiscernibles (PII) maps onto model theory with surprising fidelity. The friction you sense arises not because the translation fails, but because model theory forces precision on concepts metaphysics often leaves polymorphous.

  Here is the translation of the debate into model-theoretic vocabulary, followed by the residue report.

  ### Part 1: The Translation

  **1. The Ontological Setup**
  *   **The World:** A first-order structure $\mathcal{M}$ with domain $M$.
  *   **Objects:** Elements $a, b \in M$.
  *   **Properties:** Subsets of $M^n$. Crucially, we must distinguish between:
      *   *Algebraic properties:* Orbits under the automorphism group $\text{Aut}(\mathcal{M})$.
      *   *Definable properties:* Sets defined by formulas $\phi(x)$ in the language $L$.
      *   *Definable with parameters:* Sets defined by $\phi(x, \bar{c})$ where $\bar{c} \in M$.

  **2. Leibniz's Principle (PII)**
  *   **Monadic/Relational PII:** For any distinct $a, b \in M$, there exists a formula $\phi(x)$ in $L$ such that $\mathcal{M} \models \phi(a) \land \neg \phi(b)$.
  *   **Model-Theoretic Equivalent:** The structure $\mathcal{M}$ is **pointwise definable** (or at least, every element has a unique 1-type over $\emptyset$).
  *   **Stronger Version (Automorphic PII):** For any distinct $a, b \in M$, there is no $\sigma \in \text{Aut}(\mathcal{M})$ such that $\sigma(a) = b$.
  *   **Model-Theoretic Equivalent:** The structure $\mathcal{M}$ is **rigid** (i.e., $\text{Aut}(\mathcal{M})$ is the trivial group).

  **3. Max Black's Counterexample**
  *   **The Construction:** A structure $\mathcal{M}$ with domain $\{a, b\}$ and a language $L$ containing only symmetric relations (e.g., distance $d(a,b) = d(b,a)$, or no relations at all).
  *   **The Phenomenon:** $tp(a/\emptyset) = tp(b/\emptyset)$. There exists a non-trivial automorphism $\sigma \in \text{Aut}(\mathcal{M})$ such that $\sigma(a)=b$ and $\sigma(b)=a$.
  *   **The Claim:** $a \neq b$ (distinct elements in the domain), yet they share all $L$-properties.
  *   **Verdict:** PII fails for the language $L$. The structure is not rigid.

  **4. The Triviality Worry (Haecceities)**
  *   **The Worry:** If "properties" include *being identical to $a$*, then $a$ has a property $b$ lacks.
  *   **Model-Theoretic Resolution:** This corresponds to expanding the language $L$ to $L(M)$, the language with constants for every element in the domain (the diagram of $\mathcal{M}$).
  *   **Result:** In $L(M)$, every element is 0-definable. $\text{Aut}(\mathcal{M}, M)$ is trivial. PII becomes trivially true.
  *   **Constraint:** To make PII non-trivial, we must restrict the language $L$ to a signature $\sigma$ that does not contain constants for the objects being compared. PII is always relative to a signature.

  **5. The Standard Replies**
  *   **Restriction to Natural Properties:** This is a constraint on the signature $\sigma$. We assert that the "true" structure of the world is $\mathcal{M} \restriction \sigma_{\text{natural}}$. If $\text{Aut}(\mathcal{M} \restriction \sigma_{\text{natural}})$ is non-trivial, PII fails fundamentally.
  *   **Coordinate Systems/Relations:** This corresponds to expanding the structure to $(\mathcal{M}, \bar{c})$ by adding parameters (an observer, an origin point). This breaks the symmetry. $\text{Aut}(\mathcal{M}, \bar{c})$ may be trivial even if $\text{Aut}(\mathcal{M})$ is not. The debate is whether this expansion reflects reality or merely an epistemic perspective.

  ---

  ### Part 2: The Residue Report

  Here is where the mapping holds, where it strains, and where it breaks.

  #### 1. Clean Translations
  *   **Indiscernibility $\leftrightarrow$ Orbits/Types:** The philosophical notion of "sharing all properties" maps cleanly to having the same complete type over $\emptyset$ ($tp(a/\emptyset) = tp(b/\emptyset)$) or belonging to the same orbit under $\text{Aut}(\mathcal{M})$.
  *   **Distinctness $\leftrightarrow$ Domain Cardinality:** The claim that the spheres are "two things" is simply $|M| \geq 2$.
  *   **Symmetry $\leftrightarrow$ Non-trivial Automorphisms:** Black's symmetric universe is precisely a structure with $|\text{Aut}(\mathcal{M})| > 1$.
  *   **The Triviality Solution:** Model theory dissolves the haecceity worry instantly by distinguishing between $\text{Aut}(\mathcal{M})$ and $\text{Aut}(\mathcal{M}, A)$. PII is non-trivial iff we ask about rigidity over $\emptyset$, not over $M$.

  #### 2. Translations with Distortion
  *   **"Natural" Properties:** In metaphysics, "natural properties" carve nature at its joints. In model theory, this is merely a choice of signature $\sigma$. Model theory offers no internal criterion for why one signature is more "fundamental" than another. The metaphysical weight of "naturalness" is lost; it becomes a pragmatic or axiomatic choice of language.
  *   **Relations vs. Monadic:** Leibniz worried about relational properties (e.g., "being 5m from sphere B"). In model theory, relations are primitive symbols. The philosophical difficulty of reducing relations to monadic properties (which Leibniz attempted) has no model-theoretic analogue; relations are just subsets of $M^n$. The translation assumes relations are admissible properties, which some readings of Leibniz deny.

  #### 3. No Expression in Model Theory
  *   **Modal Status (Necessity vs. Contingency):** Model theory describes *a* structure. It does not tell you if the structure *could have been* different. The debate over whether PII is a *logical truth* (holds in all possible worlds) vs. a *contingent fact* (holds in our world) cannot be expressed within a single structure. It requires a framework of possible worlds (modal logic) or a class of structures $\mathbf{K}$.
      *   *Translation:* Is PII a theorem of the logic? (No). Is it an axiom of the theory $T$ describing the world? (Maybe).
  *   **The Ground of Identity:** Metaphysics asks *in virtue of what* $a \neq b$. Model theory takes the domain $M$ as a set; distinctness is primitive set-theoretic inequality ($a \neq b$). Model theory cannot explain *why* there are two elements in the domain, only *that* there are. The "thisness" (haecceity) that philosophers worry about is simply the set-theoretic identity of the urelements (or sets) in the domain.

  ---

  ### Part 3: Addressing the Specific Worries

  **1. The Triviality Worry**
  In model theory, the triviality worry is resolved by recognizing that PII is a statement about the **expressive power of the language relative to the structure**.
  *   If $L$ contains constants for all $a \in M$, PII is trivial (Structure is rigid).
  *   If $L$ is empty, PII is false for any $|M| > 1$ (Structure is highly symmetric).
  *   **Conclusion:** The principle is not "PII is true," but "The language of fundamental physics is expressive enough to rigidify the world." The debate shifts from metaphysics to linguistics/physics: *Is the signature of the actual world rich enough to distinguish all elements?*

  **2. Logical Truth vs. Contingent Claim**
  *   **Model-Theoretic Verdict:** PII is **never** a logical truth of first-order logic. There exist structures with non-trivial automorphisms.
  *   **Metaphysical Translation:** If Leibniz claimed PII is a *logical* truth, he was wrong (unless he meant second-order logic with identity, which is circular). If he claimed it is a *metaphysical* necessity, he is claiming that the class of "metaphysically possible" structures contains only rigid ones.
  *   **Black's Point:** Black is constructing a model in the class of "physically possible" worlds. He shows that the class of physically possible structures includes non-rigid ones.
  *   **Resolution:** The debate is not about logic; it is about the **axiomatization of the class of admissible models**. Leibniz asserts $T_{\text{world}} \vdash \forall x,y (\text{Indisc}(x,y) \to x=y)$. Black asserts $T_{\text{world}} \nvdash \text{PII}$.

  ---

  ### Part 4: Defect of Vocabulary or Philosophical Vagueness?

  The residue is primarily a sign that **the philosophical positions were less clear than they looked**, specifically regarding the status of "properties."

  1.  **Equivocation on "Property":** Philosophers often slide between:
      *   Properties as sets (extensional).
      *   Properties as formulas (intensional/definable).
      *   Properties as metaphysical universals (naturalness).
      Model theory forces you to choose: Are we talking about $\emptyset$-definable sets, $M$-definable sets, or orbits? Once you choose, the "paradoxes" often vanish. Black's paradox exists only if you insist on a language rich enough to describe the physics but poor enough to exclude coordinates, without admitting that this is an arbitrary restriction on the signature.

  2.  **The "World" as a Structure:** The philosophical debate treats "the world" as a singular object that might or might not satisfy PII. Model theory reveals that "the world" is a pair $(\mathcal{M}, L)$.
      *   If you fix $\mathcal{M}$ and vary $L$, PII status changes.
      *   If you fix $L$ and vary $\mathcal{M}$, PII status changes.
      *   The philosophers argue as if $L$ is fixed by nature but unknown, whereas model theory shows $L$ is a representational choice.

  3.  **The Verdict:** Your vocabulary is not defective; it is **diagnostic**. The "residue" consists of metaphysical commitments that lack formal content (e.g., "fundamentality," "naturalness," "metaphysical possibility").
      *   **Black's construction** is indeed just a non-rigid model.
      *   **Leibniz's Principle** is indeed a claim that the actual model is rigid (or that the class of admissible models contains only rigid structures).
      *   **The Debate** is largely about whether the signature of fundamental physics allows for non-trivial automorphisms.

  **Summary:** The translation is faithful enough to show that the PII debate is not a logical puzzle, but a dispute over the **choice of signature** for the structure of reality. The "residue" is the metaphysical justification for preferring one signature over another, which model theory correctly identifies as external to the structure itself.
