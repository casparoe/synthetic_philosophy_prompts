answer: |-
  In a competitive biomedical research institute, two senior colleagues, Dr. Aris and Dr. Bane, independently face identical pressure to secure renewal funding for their respective labs. Both intentionally alter borderline data points in their final reports to meet the statistical threshold required for approval, committing structurally identical acts of deliberate deception to secure an undeserved professional advantage. A minor, unforeseeable causal divergence occurs during the submission process: a random server glitch flags Aris's file for a manual audit, revealing the manipulation, while Bane's file processes automatically without inspection. Consequently, Aris is exposed, stripped of tenure, blacklisted from future grants, and suffers a severe psychological collapse marked by shame and isolation, whereas Bane remains hidden, secures the funding, achieves promotion, and enjoys professional acclaim and personal stability.

  On the reconstructed karma view, the moral weight of the deception generates an internal debt that must resolve within the agent's life. Aris's exposure and collapse are not mere bad luck but the appropriate internal resolution of her act's quality, where external ruin mirrors internal moral fracture. Bane's flourishing is judged as morally undeserved and unstable because, despite external success, she carries an unresolved moral debt that manifests as character fragmentation or relational precarity, rendering her success illusory. Conversely, modern retributivism ties desert to culpable mental state plus proportionate institutional response. It holds that Bane deserves punishment for her intent, but her success is not cosmically illegitimate—simply unjustly unpunished—while Aris's catastrophic ruin exceeds what institutional justice can legitimately impose, constituting undeserved suffering caused by contingent exposure rather than just penalty.

  The feature doing the philosophical work in generating this divergence is the **feedback-loop mechanism**. Retributivism treats the connection between wrong and suffering as contingent upon external institutional enforcement; without it, there is no desert fulfilled, and excessive suffering is merely misfortune. The reconstructed karma view posits an intrinsic feedback loop where the intentional quality of the act inevitably alters the agent's psychological and relational capacity for flourishing, making the consequence internal and necessary rather than external and contingent.

  A defender of the reconstructed karma view responds to the charge of moral luck by arguing that the theory does not deny the contingency of *visibility*, but denies the contingency of *moral resolution*. While moral luck suggests that Bane is genuinely better off than Aris due to chance, the karma model asserts that Bane's apparent flourishing is structurally compromised by the deception itself. The defender claims that the instability of Bane's character is a deterministic psychological consequence of the lie, not a matter of luck. Therefore, the case does not illustrate moral luck regarding desert, but rather demonstrates that desert operates through an internal causal chain that external observers might miss, distinguishing it from a theory where desert relies entirely on external adjudication.
