ness of the act, the decoupling of intention from external consequence, or the feedback-loop mechanism—does the philosophical work in generating the divergence, and explain how a defender of the reconstructed karma view could respond to the charge that the case merely illustrates moral luck rather than a distinctive theory of desert. Do not invoke specific named philosophers as authorities, do not provide bibliographies, reading lists, or citations, and keep the analysis accessible to someone who cannot search external sources.
