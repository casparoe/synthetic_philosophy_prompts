answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on $6M Bequest Allocation

  **Purpose**
  This memo recommends a disposition for the one-time $6M bequest received this quarter. We must select among three options with a five-year horizon. Our goal is to maximize value while protecting the college's spending capacity.

  **Options Analysis**
  *   **Option A:** Guaranteed +$2.0M gain.
  *   **Option B:** 80% chance +$3.0M; 20% chance −$0.5M. (Expected Value: $2.3M)
  *   **Option C:** 60% chance +$4.5M; 40% chance −$1.5M. (Expected Value: $2.1M)

  **Option C** is eliminated by our informal "floor rule," which prohibits any position with >5% probability of losing >10% of capital. Option C carries a 40% chance of a 25% loss.

  **The Decision: Option A vs. Option B**
  The remaining choice is between the certainty of **Option A** and the higher expected value of **Option B**.

  Our Finance Director argues for **Option B**. His position rests on portfolio theory: we make roughly twenty independent investment calls annually. Over that volume, tail-risk weighting reduces aggregate returns without providing diversification benefits. He contends that consistently preferring certainty over positive expected value amounts to "paying for comfort," which erodes the endowment's long-term purchasing power. Mathematically, he is correct; over a diversified portfolio, EV maximization wins.

  Trustee Marla argues for **Option A**. She notes that while risks may be independent across the portfolio, the *consequences* of loss are not linear for the college. Our spending policy relies on a stable asset base. A loss here—even a modest $0.5M—could trigger a breach in our spending floor, forcing immediate cuts to financial aid. Unlike investment returns, the damage to student access does not "average out" over time. This is an ergodicity problem: the ruin of the budget plan matters more than the aggregate math.

  **Recommendation**
  I recommend we select **Option A**.

  While Option B offers higher expected value, the specific purpose of this bequest is to bolster near-term spending capacity. The cost of insurance (the $0.3M difference in EV) is justified to eliminate the risk of aid cuts in this specific instance. We cannot afford to test the spending floor when a guaranteed alternative exists.

  **Policy Implications**
  Regarding Marla's proposed methodology (squaring probabilities to overweight tail risk): **I recommend we do not adopt this as standing policy.**

  The Finance Director's objection holds true for the broader portfolio. Applying Marla's rule systematically would bias us against attractive risks across all asset classes, dragging down long-term returns. We should treat this decision as a specific exception driven by the unique linkage between this bequest and the operating budget, not as a new mathematical standard for all investments.

  **Next Steps**
  If approved, we will execute Option A immediately to lock in the gain. We will retain the existing "floor rule" as our primary risk constraint, reviewing it annually rather than replacing it with a new probability weighting scheme.

  Please review prior to next week's vote.
