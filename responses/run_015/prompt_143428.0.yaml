prompt: |-
  Draft the joint statement that an instrumentalist defender of Friedman's F-twist and an explanatory realist critic could both sign after a good-faith adversarial collaboration. The collaboration should focus specifically on whether the F-twist applies with equal force to idealization-by-omission (simplifying away detail) and idealization-by-distortion (introducing properties known to be false), and on whether predictive success can ever justify the latter rather than merely tolerating the former.

  Deliver the document in two parts. First, a numbered section of agreed claims: include claims about what Friedman's argument actually asserts regarding the relationship between descriptive realism and predictive yield; claims about the logical independence of predictive accuracy and structural realism; and claims about the shared diagnostic examples both sides accept—such as homogeneous-agent assumptions in macroeconomic forecasting and zero-friction surfaces in classical mechanics—without asserting in advance which example supports which camp. Second, a disagreements table with precisely formulated residual disagreements, each phrased so that its own camp would accept the wording of its position: for instance, the instrumentalist formulation that distortion-idealizations are methodologically indistinguishable from omission-idealizations when the evaluative criterion is predictive yield alone, versus the realist formulation that distortion introduces counterfactual fragility and explanatory failure that omission does not.

  Then list the cruxes—sub-questions such that settling them would move at least one side. These should include whether there exists a principled, domain-independent boundary between omission and distortion; whether predictive success in any well-confirmed domain genuinely requires distortion rather than mere omission; and whether a model that succeeds predictively despite distortion can still be trusted for counterfactual policy guidance. For each crux, specify the concrete case, argument, or modeling scenario both sides agree is diagnostic, and record each side's predicted verdict in advance.

  Do not include bibliographies, reading lists, or citations. Paraphrase any reference to Friedman's argument without quotation marks, and avoid attributing specific phrases or page numbers to him or to any other author. Write in formal, polished prose suitable for a signed collaborative statement.
