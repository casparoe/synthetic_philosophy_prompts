answer: |-
  # Joint Statement on the Methodological Status of Idealization in Economic and Scientific Modeling

  **Date:** October 26, 2023
  **Signatories:** The Instrumentalist Working Group and The Explanatory Realist Working Group

  Following a period of adversarial collaboration, the undersigned parties submit this joint statement. Our objective was not to force a premature consensus, but to precisely map the topology of our disagreement regarding the methodological role of assumptions in scientific theory. Specifically, we focused on the distinction between idealization-by-omission (simplifying away details) and idealization-by-distortion (positing properties known to be false), and the extent to which predictive success validates the latter. We agree that clarity on these distinctions is prerequisite to productive methodological discourse.

  ### Part I: Agreed Claims

  We jointly affirm the following propositions as an accurate baseline for our continued discourse:

  1.  **On the Core Instrumentalist Thesis:** We agree that the central methodological claim under review asserts that the validity of a hypothesis rests exclusively on the accuracy of its predictions within a specified domain, rather than on the descriptive truth of its premises. We agree this position holds that assumptions function as analytical tools rather than empirical claims, and that demanding descriptive accuracy for assumptions can impede the development of theories with high predictive yield.
  2.  **On Logical Independence:** We agree that predictive accuracy and structural realism are logically independent variables. It is conceptually possible for a model to generate accurate predictions while relying on premises that are descriptively false, and conversely, for a model to rely on descriptively true premises while failing to generate accurate predictions. Our disagreement concerns the *methodological significance* of this independence, not its logical possibility.
  3.  **On Shared Diagnostic Examples:** We agree to utilize specific modeling scenarios as common reference points for our debate, without prejudging their interpretation. These include:
      *   The assumption of zero-friction surfaces in classical mechanics.
      *   The assumption of a single representative agent in macroeconomic forecasting.
      *   The assumption of perfect information in competitive market models.
      *   We agree that these examples serve as valid test cases for evaluating the distinction between omission and distortion.
  4.  **On the Scope of Evaluation:** We agree that the evaluation of a model must distinguish between its performance in *interpolation* (predicting within the range of observed data) and *extrapolation* (predicting under novel conditions or policy interventions). We agree that the status of distortion-based idealizations may differ across these two contexts.
  5.  **On the Burden of Proof:** We agree that the burden lies upon the defender of distortion-based idealizations to demonstrate that such distortions are necessary for predictive success, and upon the critic to demonstrate that such distortions systematically undermine the model's utility for explanation or policy guidance.

  ### Part II: Residual Disagreements

  While we share the diagnostic examples and logical definitions above, we remain divided on their methodological implications. The following table articulates our divergent positions. Each formulation is phrased to ensure fidelity to the respective camp's core commitments.

  | Issue | Instrumentalist Formulation | Explanatory Realist Formulation |
  | :--- | :--- | :--- |
  | **1. Equivalence of Idealization Types** | When the sole evaluative criterion is predictive yield within a stable domain, idealization-by-distortion is methodologically indistinguishable from idealization-by-omission. Both are valid simplifications if they reduce complexity without degrading predictive accuracy. | Idealization-by-distortion introduces counterfactual fragility and explanatory failure that idealization-by-omission does not. Omission leaves causal mechanisms intact but unmodeled; distortion actively misrepresents causal mechanisms, severing the link between the model and the world. |
  | **2. Justification via Prediction** | Predictive success is sufficient to justify the use of distorted assumptions. If a model containing known falsehoods consistently outperforms a model containing only truths, the falsehoods are vindicated as efficient analytical devices. | Predictive success may justify *tolerating* omission due to tractability constraints, but it cannot *justify* distortion. A model that predicts well despite distorted assumptions achieves success accidentally or via parameter fitting, and warrants skepticism regarding its generalizability. |
  | **3. Policy and Counterfactuals** | A model that succeeds predictively despite distortion can be trusted for policy guidance, provided the structural parameters remain invariant under the proposed policy change. The "as if" behavior is sufficient for intervention design. | A model relying on distortion cannot be trusted for counterfactual policy guidance. Because the assumptions misrepresent the underlying mechanism, the model will likely fail when the policy alters the very conditions that allowed the distortion to cancel out or remain inert. |
  | **4. The Role of Realism** | Descriptive realism is a optional virtue, subordinate to predictive power. Pursuing realism for its own sake is a category error that confuses the map with the territory. | Descriptive realism is a constitutive virtue of scientific explanation. A theory that does not approximate the true structure of the phenomenon fails to explain *why* the predictions hold, leaving science vulnerable to regime shifts. |

  ### Part III: Diagnostic Cruxes

  To move this debate forward, we have identified specific sub-questions (cruxes) where empirical or formal resolution would compel at least one side to revise its position. For each crux, we specify the diagnostic case and record the predicted verdict for each camp.

  **Crux 1: The Principled Boundary**
  *   **Question:** Does there exist a principled, domain-independent boundary between omission and distortion, or is the distinction merely a matter of degree?
  *   **Diagnostic Case:** The modeling of a gas. Comparing the ideal gas law (omitting molecular volume) vs. a model assuming molecules exert attractive forces when they demonstrably do not (active distortion).
  *   **Instrumentalist Predicted Verdict:** No principled boundary exists. Both are approximations; the distinction is rhetorical. If the equation of state fits the data, the ontological status of the assumption is irrelevant.
  *   **Realist Predicted Verdict:** A principled boundary exists. Omission respects the direction of causality (ignoring a minor force); distortion reverses or invents causality (inventing a force). This boundary matters for robustness.
  *   **Resolution Condition:** If a formal metric can be agreed upon that quantifies "ontological commitment" independent of predictive fit, the Realist position is strengthened. If no such metric can be constructed without referencing predictive success, the Instrumentalist position is strengthened.

  **Crux 2: Necessity of Distortion**
  *   **Question:** Does predictive success in any well-confirmed domain genuinely *require* distortion, or does it merely reflect a temporary inability to model complex omissions?
  *   **Diagnostic Case:** Rational Expectations models in macroeconomics. Specifically, whether models assuming agents solve infinite-horizon optimization problems outperform models assuming bounded rationality or adaptive learning in out-of-sample forecasting.
  *   **Instrumentalist Predicted Verdict:** Distortion is required. The complexity of true human cognition makes omission impossible; assuming hyper-rationality is a necessary distortion to generate solvable, high-yield predictions.
  *   **Realist Predicted Verdict:** Distortion is not required. The success of rational expectation models is due to aggregate regularities that can be captured by bounded rationality models without positing false cognitive capabilities. The distortion is a hindrance to micro-foundational progress.
  *   **Resolution Condition:** If a bounded rationality model is developed that matches the predictive yield of the rational expectations model without positing false cognitive capacities, the Instrumentalist claim of *necessity* is falsified.

  **Crux 3: Reliability Under Structural Change**
  *   **Question:** Can a model that succeeds predictively despite distortion be trusted for counterfactual policy guidance when the policy alters the environment the model distorts?
  *   **Diagnostic Case:** Tax incidence modeling using a representative agent versus a heterogeneous agent distribution.
  *   **Instrumentalist Predicted Verdict:** Yes, provided the reduced-form relationship between tax rates and revenue holds. The internal distribution (the distortion) does not matter if the aggregate prediction is stable.
  *   **Realist Predicted Verdict:** No. Because the representative agent distorts the distributional mechanism, the model will fail to predict the second-order effects of the tax change (e.g., labor supply responses across different income brackets), leading to policy failure.
  *   **Resolution Condition:** If a policy is implemented based on a representative agent model and the aggregate outcome matches the prediction *but* the distributional consequences cause systemic instability unanticipated by the model, the Realist position is vindicated. If the policy succeeds on all relevant metrics, the Instrumentalist position is vindicated.

  We submit this document as a record of our current understanding and a roadmap for future inquiry. We acknowledge that while our metaphysical commitments differ, our shared commitment to scientific rigor demands that we test these commitments against the diagnostic cases outlined above.
