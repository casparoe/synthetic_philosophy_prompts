      *   **Friedman's Instrumentalism (The "F-twist"):** The validity of a theory depends on the accuracy of its predictions, not the realism of its assumptions. Assumptions are tools. "As if" reasoning. Highly unrealistic assumptions are often necessary for significant hypotheses.
      *   **Explanatory Realism:** Theories should aim to describe the underlying mechanisms correctly. False assumptions (distortions) undermine explanatory power and counterfactual reliability, even if they yield accurate predictions in specific contexts.
