      *   *Decision:* Focus on the **Individual Competence** half as the primary experience, because it's more visceral for a seminar. Use the **Blind Process** as the debrief/reveal mechanism.
      *   *Wait, prompt asks for both halves if possible.*
      *   *Okay, I will design a two-stage game.*
      *   *Stage 1:* **Implicit Classification.** (I can do it, can't say how).
      *   *Stage 2:* **Blind Generation.** (The stimuli were made by a dumb process).
      *   *Connection:* The "Dumb Process" created the stimuli they classified in Stage 1.

      *Specific Design:* **"The Alien Language."**
      *   *Materials:* 40 Cards. 20 "Valid", 20 "Invalid".
      *   *Generation:* Valid cards are generated by a simple Markov Chain or Finite State Grammar (e.g., A must be followed by B or C, C must be followed by D...). Invalid are random.
      *   *Task:* Students see a card. Guess Valid/Invalid. Get immediate feedback.
      *   *Data:* Track accuracy. Track their written explanation of the rule.
      *   *The Twist:* The "Valid" cards weren't designed by a linguist. They were generated by a script that just followed transition probabilities (Blind Process).
      *   *Wait, I need them to experience the Blind Process.*
      *   *Okay, let's make them the generators.*
      *   *Game:* **"The Telephone Evolution."**
      *   *Prep:* Print sheets with simple line drawings or symbol strings.
      *   *Round 1:* Students copy a string.
      *   *Round 2:* They mutate it slightly.
      *   *Selection:* TA selects which ones survive based on a hidden, simple criterion (e.g., "Contains a loop").
      *   *Result:* Complex looking strings emerge.
      *   *Problem:* Takes too long to pass paper around 16 people.

      *Okay, best balance for 75 mins:* **"The Prediction Market."**
      *   *No, too econ.*
      *   *Let's go with the **"Hidden Rule Classification"** but add a **"Blind Generator"** reveal.*
      *   *Activity Name:* **"The Oracle and the Machine."**
      *   *Part 1 (The Oracle - Competence):* Students try to predict the Oracle's output (Yes/No) for inputs (Strings/Shapes). They get good. They write down the "Law."
      *   *Part 2 (The Machine - Blind Process):* Reveal the Oracle isn't a mind. It's a lookup table generated by a random walk constrained by a trivial rule.
      *   *Critique:* This makes the "Blind Process" a reveal, not an experience.
      *   *Fix:* Make *them* the machine in the second half.
      *   *Revised Plan:*
          1.  **Phase 1 (25 mins):** Implicit Learning Task. (Competence without Comprehension).
          2.  **Phase 2 (25 mins):** Generative Task. (Blind Variation).
          3.  **Phase 3 (25 mins):** Debrief/Mapping.

      *Let's refine Phase 1.* **Artificial Grammar Learning (AGL)** is the gold standard here, but needs to feel fresh.
      *   *Twist:* Use **Visual Sequences** instead of letters.
      *   *Materials:* Projector or printed cards. Sequences of 3-5 icons.
      *   *Rule:* A simple Finite State Grammar (e.g., Start -> Circle -> (Square or Triangle) -> End).
      *   *Task:* "Memorize these examples." Then "Classify these new ones."
      *   *Data:* Collect their classification accuracy AND their written rule.
      *   *Expected Result:* High accuracy, terrible/wrong rule descriptions.

      *Let's refine Phase 2.* **Blind Variation.**
      *   *Task:* "Create a sequence that you think fits the rule."
      *   *Selection:* TA acts as the "Environment." Accepts/Rejects based on the *actual* grammar.
      *   *Iteration:* Do this for 3 rounds.
      *   *Point:* The "Design" (perfect sequences) emerges from trial and error, not from understanding the grammar.
      *   *Wait, this is just Phase 1 again.*
      *   *Need a distinct "Blind Process" experience.*
      *   *Idea:* **"The Mutation Game."**
      *   *Setup:* 4 Groups. Each gets a "Parent" string (Valid).
      *   *Task:* Mutate it (change one symbol). Pass to TA.
      *   *Selection:* TA keeps it if it's Valid. Discards if Invalid.
      *   *Next Gen:* The kept strings become the parents for the next round.
      *   *Outcome:* After 3 rounds, you have a "family tree" of valid strings.
      *   *Reveal:* No one knew the grammar. They just guessed. The "Perfection" emerged from selection, not insight.
      *   *This works.* It hits both halves.
      *   *Half 1:* Phase 1 shows *I* have competence I can't explain.
      *   *Half 2:* Phase 2 shows *We* produced design without a designer.

      *Addressing the "Smug CS Student":*
      *   They will spot the Finite State Grammar quickly.
      *   *Fix:* Make the rule **Probabilistic** or **Context-Dependent** in a way that resists quick reverse-engineering, OR give the CS students a specific role that blinds them to the global pattern.
      *   *Better Fix:* The rule is **Disjunctive** (A OR B). E.g., "Valid if it starts with X OR ends with Y." People assume it's conjunctive (X AND Y). CS students look for algorithms, might miss the simple logical disjunction if framed as "patterns."
      *   *Best Fix:* **The "Family Resemblance" Rule.** There is no single necessary and sufficient condition. It's a cluster concept. (Wittgensteinian twist). Valid strings share 3 out of 5 features. This makes explicit rule formulation impossible (Comprehension fails hard), but pattern recognition works (Competence succeeds).
      *   *Wait, if there's no rule, Phase 2 (Evolution) breaks.*
      *   *Okay, stick to Finite State Grammar but make it slightly complex (4 states).*
      *   *Handling the CS Student:* Give them the role of "Data Recorder." They track the stats, not the patterns. They see the *process*, but are busy writing numbers. Or, acknowledge them: "If you figure it out, you are forbidden from speaking, but you get double points if your group wins without your help." (Gamify the silence).

      *Addressing the "I know it but can't say it" Flatmate Objection:*
      *   This is the "Tacit Knowledge" objection.
      *   *Counter in design:* Force them to write the rule *before* they see the next batch. Then show that their rule predicts *chance* levels, while their intuition predicts *high* accuracy. The mismatch is the data.
      *   *Debrief:* Acknowledge that "comprehension" might just be "competence at a higher order," but the *feeling* of understanding is what's being challenged.

      *Timeline:*
      *   0-5: Setup & Stakes.
      *   5-30: Phase 1 (Classification/Intuition).
      *   30-55: Phase 2 (Evolution/Generation).
      *   55-75: Debrief & Mapping.

      *Materials:*
      *   Printed cards (Strings of symbols).
      *   Score sheets.
      *   Sweets/Points.
      *   Projector (optional, cards are better for 9 AM tactile).

      *Prep Time:*
      *   Generate strings (Python script or manual).
      *   Print cards.
      *   Prepare score sheet.
      *   < 30 mins.

      *Let's flesh out the Grammar.*
      *   Symbols: X, T, V, J, M.
