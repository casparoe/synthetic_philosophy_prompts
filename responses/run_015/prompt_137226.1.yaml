      *   Or: The rule is **Probabilistic**. 80% chance of following the grammar. This breaks the CS student's ability to "crack" it deterministically, forcing them to rely on intuition like everyone else.
      *   *Yes, Probabilistic Grammar is the key.* It neutralizes the "I found the algorithm" claim because there *is* no strict algorithm, only a tendency. This mirrors biology (noise/mutation) better anyway.

      *Self-Correction on "I know it but can't say it":*
      *   Make the rule-writing task specific. "Write an IF-THEN statement that a computer could follow." This forces explicitness. If they write "It just feels right," that counts as "No Comprehension."

