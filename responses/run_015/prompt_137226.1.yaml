      *   Rule: `X` must be followed by `T` or `V`. `T` must be followed by `S` or `X`. `V` must be followed by `J` or `X`. `S` and `J` are terminators.
      *   This is standard. Let's make it **Disjunctive** to frustrate the "Rule Finder."
      *   Rule: "Valid if it contains 'XT' OR 'VJ'." (Simple).
      *   No, let's go with the **Family Resemblance** for Phase 1 (makes comprehension impossible) and **Strict Grammar** for Phase 2 (makes evolution possible).
      *   *Wait, consistency is key.* Use the same underlying structure.
      *   *Decision:* **Finite State Grammar.** It's robust.
      *   *Handling the CS Student:* The "Silent Expert" rule. If they talk, their team loses points. If they stay silent and team wins, they get bonus.

      *Refining the "Blind Process" (Phase 2):*
      *   It needs to look like *design*.
      *   Groups start with a "Garbage" string.
      *   They mutate it.
      *   TA says "Survives" or "Dies."
      *   After 3 rounds, the strings look "Perfect."
