          *   No lecture upfront. Don't say "competence without comprehension" until the end.
          *   Must cover both halves if possible: (1) "I can do it but can't say how" (Tacit Knowledge) and (2) "Looks designed but came from dumb process" (Evolution/Algorithmic).
          *   Identify which half is easier to stage and why.
          *   Avoid clichés (Chinese Room, standard Wason 2-4-6). Twist them if used.
          *   Debrief plan: Map activity moments to concepts, admit limitations (can't show *no* comprehension, can't simulate deep time).
          *   Troubleshooting: Handle the "I know it but can't say it" objection and the "Smug CS student who spots the trick" issue *within* the design.

  2.  **Deconstruct the Core Concept:**
      *   *Competence without Comprehension:* The ability to produce adaptive/correct output without internal representation or understanding of *why* it works.
      *   *The Inversion:* We assume Understanding $\rightarrow$ Competence. The claim is Competence $\rightarrow$ (apparent) Understanding.
      *   *The Two Halves:*
          1.  **Individual Level (Tacit Knowledge):** I follow a rule successfully but my introspection about the rule is wrong or nonexistent.
          2.  **System Level (Blind Variation):** A complex pattern emerges from simple, mindless iterations without a grand plan.

  3.  **Brainstorming Activities:**
      *   *Idea 1: Grammar Learning (Reber Grammar).* Classic artificial grammar learning. Too abstract? Maybe feels like a memory test.
      *   *Idea 2: Pattern Prediction.* Show sequences, ask for next number. Good for "I can do it but can't say why." Hard to stage the "blind process" half live.
      *   *Idea 3: The "Telephone" Game (Evolutionary).* Pass a drawing/message down a line. It changes. Good for "blind process," bad for "individual competence."
      *   *Idea 4: A Constraint Satisfaction Puzzle.* Give people a task with hidden constraints. They solve it, but when asked *why* their solution works, they invent reasons that are wrong.
      *   *Idea 5: "The Market" or "The Algorithm".* Students act as nodes. They pass tokens based on simple local rules. A global pattern emerges.

      *Selection:* A hybrid approach is best to hit both halves.
      *   *Part 1 (Individual):* **Implicit Rule Following.** A classification task where the rule is complex/disjunctive, but learnable via intuition. Participants report confidence and reasoning.
      *   *Part 2 (System):* **Blind Optimization.** The "solutions" from Part 1 are fed into a selection process that mimics evolution/gradient descent without their knowledge.

      *Refinement for Constraints:* 75 mins is tight. 16 people is a good size for small groups. 9 AM means keep it high energy.
      *   *Better Idea:* **"The Black Box Protocol."**
      *   *Phase 1:* Students try to guess a secret classification rule for shapes/strings. They get feedback (Right/Wrong). They achieve high accuracy. They write down the rule they *think* they are using.
      *   *Phase 2:* Reveal that the "Right/Wrong" feedback wasn't from a fixed rule, but from a "fitness function" based on the group's aggregate behavior or a simple algorithmic constraint they couldn't see.
      *   *Wait, simpler:* Let's split the room. Half do the "Tacit Knowledge" task, half do the "Blind Process" task? No, everyone needs to feel both.

      *Winning Concept:* **"The Grid Game" (Cellular Automata / Local Rules).**
      *   *Why:* It bridges individual action (competence) and emergent order (design without designer).
      *   *Twist:* Instead of explaining the rules, they *discover* them through play, but the "rules" they articulate will be wrong compared to their performance.
      *   *Actually, let's go with a modified Artificial Grammar Learning + Evolutionary selection.*
      *   *Let's try "The Code Breakers vs. The Mutators".*
      *   *No, too complex to prep.*

      *Let's go with the strongest candidate for "Competence without Comprehension" that isn't Chinese Room:* **Implicit Learning of a Complex Constraint.**
      *   *Task:* Classify strings of symbols as "Valid" or "Invalid".
      *   *The Trick:* The validity is determined by a finite state grammar (too complex to state quickly) OR (better for the "blind process" angle) the validity is determined by a *history* of what the group has accepted.
      *   *Let's pivot to something more physical/visual.* **The "Shape Sorter" Protocol.**
      *   *Materials:* Cards with geometric shapes/combinations.
      *   *Task:* Sort into Pile A or Pile B.
      *   *Feedback:* Instructor says "Yes" or "No" (or lights).
      *   *The Catch:* The rule is *disjunctive* or *probabilistic* in a way that defies simple verbalization, OR the rule changes based on a "selection" pressure.

      *Okay, let's look at the "Two Halves" requirement again.*
      1.  *I can do it but can't say how.* (Implicit Learning).
      2.  *Looks designed but came from dumb process.* (Evolution/Selection).

      *Proposed Activity:* **"The Evolutionary Art Gallery."**
      *   *Prep:* Generate 3 sets of abstract symbols (strings or shapes).
      *   *Round 1 (Competence):* Students act as "Classifiers." They see symbols, guess if they belong to the "Gallery." They get feedback. They get good at it. They write down the "Rule of the Gallery."
      *   *Round 2 (Comprehension Check):* Compare their stated rules to their actual accuracy. (Usually accuracy > rule quality).
      *   *Round 3 (The Blind Process):* Reveal how the "Gallery" was made. It wasn't designed by a human with an aesthetic. It was generated by a simple algorithm (e.g., "copy the previous winner and flip one bit") selected by *random* noise or a simple constraint (e.g., "must have even number of lines").
      *   *Wait, the "Blind Process" needs to happen IN THE ROOM.*
      *   *Revised:* **"The Protocol Game."**
