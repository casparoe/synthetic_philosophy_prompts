      *   **Current State:** Reading done (Dennett-ish), students nodded but didn't *feel* it. Flatmate (ML researcher) challenged the definition of "comprehension."
      *   **Goal:** Design an activity where the inversion *happens to them*. They should start with mind-first explanations and hit a wall where that fails. Collect first-person reports as data that visibly fail to track performance.
      *   **Requirements:**
          *   Rules, materials (TA prep < 30 mins), timeline (minute marks).
