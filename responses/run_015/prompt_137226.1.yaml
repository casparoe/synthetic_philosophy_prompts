answer: |-
  Here is a complete design for the 75-minute session. It is built to be low-prep, high-engagement, and specifically targeted at generating the *feeling* of the inversion rather than arguing for it.

  ### Activity Title: "The Black Box Protocol"

  **Core Concept:** A two-phase game. Phase 1 demonstrates **Individual Competence without Comprehension** (you can classify correctly but can't state the rule). Phase 2 demonstrates **System Design without a Designer** (complex "perfect" strings emerge from blind mutation and selection).

  **Which half is easier to stage?**
  **Phase 1 (Individual Competence)** is significantly easier to stage in a single room/session.
  *   **Why:** It requires only static materials (cards) and immediate feedback. It produces instant, quantifiable data (accuracy vs. stated rule) that creates the "mismatch" feeling in real-time.
  *   **Phase 2 (Blind Process)** is harder because evolutionary time is slow. Compressing it into 20 minutes risks making it feel like a parlor trick ("The TA is just telling us what to do").
  *   **Strategy:** We will lean heavily on Phase 1 for the visceral "inversion" moment. Phase 2 will be a condensed "speed-run" of evolution to show the *source* of the patterns they classified in Phase 1, linking the two halves.

  ---

  ### 1. Materials & Prep (TA Time: ~30 mins)

  You need to generate a **Probabilistic Finite State Grammar**. Do not use a strict rule (e.g., "X must follow T"). Use probabilities (e.g., "X follows T 80% of the time"). This prevents the CS students from "solving" it deterministically and mirrors biological noise.

  **The Grammar (Secret):**
  *   **Start:** `V` or `X`
  *   **If `V`:** Next is `T` (80%) or `J` (20%)
  *   **If `X`:** Next is `S` (80%) or `M` (20%)
  *   **If `T` or `S`:** Next is `End` (50%) or `V` (50%)
  *   **If `J` or `M`:** Next is `End` (100%)
  *   *(Valid strings look like: V-T-S, X-M, V-T-V-J, etc. Invalid strings violate these transitions.)*

  **Physical Materials:**
  1.  **Card Decks (4 sets):** Print 40 cards per set. 20 "Valid" (generated by the grammar above), 20 "Invalid" (random letter strings of same length). *Prep:* Shuffle them. Mark the back with a small dot color for your own reference (don't show students).
  2.  **Score Sheets (16 copies):** Two columns: "Prediction (Valid/Invalid)" and "Confidence (1-5)". A box at the bottom: "Write the Rule."
  3.  **Mutation Sheets (4 copies):** Large paper for each group to write their "Evolved String."
  4.  **Stakes:** A bag of cheap chocolates or a "Homework Pass" (if you have the power) for the winning group.
  5.  **Whiteboard:** To track group scores.

  ---

  ### 2. Timeline & Rules (75 Minutes)

  #### 0:00 – 0:05: Setup & Stakes (No Theory)
  *   **Action:** Divide into 4 groups of 4. Hand out Score Sheets and a Deck of Cards to each group.
  *   **Script:** "You are testers for a new encryption protocol. Some strings are 'Valid,' some are 'Corrupt.' Your goal is to maximize your group's accuracy. Top group gets the sweets. On each card, mark Valid/Invalid and your confidence. After every 5 cards, I will stop you to update your score."
  *   **Constraint:** "You may discuss strategies within your group. However, **you must write down your current 'Best Guess Rule' on the sheet after every 10 cards.**"
  *   **CS Student Handle:** "If anyone thinks they have cracked the algorithm, they are designated the 'Scribe.' They write the rules but cannot speak. If they speak, the group loses 5 points." (This gamifies their silence and uses their precision for data collection).

  #### 0:05 – 0:30: Phase 1 (The Competence Trap)
  *   **Action:** Groups classify cards. You circulate, giving immediate "Correct/Incorrect" feedback verbally.
  *   **The Trap:** Because the grammar is probabilistic, they will develop high accuracy (Competence) through pattern recognition, but their stated rules (Comprehension) will be wrong or vague.
  *   **Minute 15 Check:** Stop them. Ask: "How many groups have a rule that covers *every* case?" (Likely none). "How many are above 70% accuracy?" (Likely all).
  *   **Minute 30 End:** Collect the Score Sheets. Do not return them yet.
  *   **Data Point:** You now have physical evidence that Performance $\neq$ Articulated Knowledge.

  #### 0:30 – 0:50: Phase 2 (The Blind Process)
  *   **Script:** "New task. You are no longer testers. You are the generators. I am the Environment."
  *   **Action:** Give each group a "Garbage String" (e.g., `Q-Z-L-P`).
  *   **Goal:** "Evolve this string into a 'Valid' string in 3 rounds."
  *   **Rules:**
      1.  **Mutate:** Change exactly one letter.
      2.  **Select:** Show it to the TA. TA checks against the *Secret Grammar*.
      3.  **Feedback:** TA says "Survives" or "Dies."
      4.  **Iterate:** If it dies, revert to previous. If it survives, keep it for the next round.
  *   **The Twist:** They are not allowed to ask *why* it died. Only "Survives/Dies."
  *   **Minute 45:** By now, groups should have strings that look "designed" (e.g., `V-T-S`).
  *   **Minute 50:** Stop. Ask: "Who designed this final string?" (They did). "Did anyone know the target?" (No). "Did anyone understand the constraint?" (No).

  #### 0:50 – 1:15: Debrief & Mapping (The Inversion)
  *   **Action:** Return Phase 1 Score Sheets. Project a slide (or write on board) with the Secret Grammar.
  *   **Discussion Flow:**
      1.  **The Mismatch (5 mins):** Look at Phase 1 data. "Your accuracy was ~80%. Your written rules were ~20% accurate. You had the *competence* of someone who understood the system, without the *comprehension*."
      2.  **The Objection (5 mins):** Address the flatmate's point. "One of you might say: 'I understood it, I just couldn't verbalize it.' Look at your Phase 2 strings. You produced valid outputs through blind trial and error (selection), not insight. The 'understanding' was in the *process*, not the *mind*."
      3.  **The Reveal (5 mins):** Show the Grammar. "This looks designed. It has structure. But in Phase 2, no one held this structure in their head. The 'Design' emerged from the interaction between your blind mutations and my selection filter."
      4.  **Concept Label (5 mins):** Now you say the phrase: **"Competence without Comprehension."** Map Phase 1 to the Individual (Turing/CogSci) and Phase 2 to the System (Darwin/Dennett).

  ---

  ### 3. Debrief Mapping & Limitations

  **Mapping Activity to Theory:**
  *   **Phase 1 Accuracy vs. Rule Sheet:** Maps to **Implicit Learning**. Shows that reliable performance does not require explicit representation. (Minute 50-55).
  *   **Phase 2 Mutation/Selection:** Maps to **Blind Variation & Selective Retention**. Shows that "design" (valid strings) can accumulate without a designer holding the blueprint. (Minute 55-60).
  *   **The "Scribe" Rule:** Maps to the **Homunculus Problem**. Even the person who "knows" (the CS student) is rendered impotent; the group's success relies on the blind process, not the smart mind. (Minute 60-65).

  **What the Game Cannot Reproduce (Be Frank Here):**
  *   **Deep Time:** Phase 2 took 15 minutes. Real evolution takes millennia. The "Design" here is trivial (letter strings), not a human eye. You must supply the *scale* argument in words.
  *   **The "No Comprehension" Claim:** You cannot prove there is *no* comprehension in the room. A student might say, "I felt the pattern." You must concede: "The activity shows comprehension is *unnecessary* for competence, not that it is *absent*. The inversion is about explanatory priority, not existence."
  *   **The TA as Designer:** In Phase 2, *you* were the selection function. You were the "Environment." In nature, there is no TA. This is a simulation of selection, not selection itself.

  ---

  ### 4. Troubleshooting Predictable Failures

  **Problem 1: The "Tacit Knowledge" Objection.**
  *   *Student:* "I did know the rule. I just can't put it into words. That's not 'without comprehension,' that's 'non-verbal comprehension'."
  *   *In-Design Fix:* This is why Phase 2 is crucial. In Phase 2, they explicitly *don't* know the rule; they are guessing. When they succeed in Phase 2, they cannot claim tacit knowledge of the grammar because they were mutating blindly.
  *   *Debrief Response:* "If you claim you knew the rule in Phase 1, look at Phase 2. You produced valid strings there without the rule. If competence works without the rule in Phase 2, why assume the rule was driving Phase 1? The simpler explanation is that the *system* (you + feedback) did the work, not your internal model."

  **Problem 2: The Smug CS Student.**
  *   *Student:* Spots the probabilistic grammar by card 10. Starts explaining it to their group.
  *   *In-Design Fix:* The **"Scribe" Rule** (Minute 0:05). By making silence a condition of winning, you turn their insight into a liability.
  *   *Debrief Response:* If they still spoil it, use them. "Great, you found the grammar. But look at your group mates. They got the same accuracy as you by Minute 20, before you spoke. Their competence didn't wait for your comprehension. You were the luxury, not the engine."

  **Problem 3: 9 AM Zombie Mode.**
  *   *Risk:* Students stare at cards silently.
  *   *Fix:* **High-Frequency Feedback.** Do not let them batch 10 cards. Make them show you 1 card at a time for the first round. The dopamine hit of "Correct!" keeps them awake. Keep the stakes visible (draw a leaderboard on the board).

  ### Why This Works for Your Goal
  It forces the inversion *experientially*. They will feel the frustration of not knowing the rule (Phase 1) while succeeding, and the surprise of creating order without a plan (Phase 2). When you finally say "Competence without Comprehension," it won't be a philosophical claim they have to accept; it will be a label for what they just did.
