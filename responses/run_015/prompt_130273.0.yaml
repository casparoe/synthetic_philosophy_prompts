answer: |-
  You are right to be suspicious. In hydrology, if a levee holds, water stays put. If it fails, water moves. You can measure the breach, the flow rate, the volume. In law and morality, people try to measure "nothing" and call it a force.

  Your circuit/pump model is not a bad habit; it is the best tool you have. It distinguishes **capacity** (the pump exists) from **activation** (the switch is thrown). I will keep that model.

  Here is the menu of what those slogans can mean, evaluated by your criteria.

  ### Slogan 1: "An omission can't be a cause." (The Barrister)
  *Goal: Break the chain of liability. If the non-action isn't a cause, the care home isn't responsible for the death.*

  **1. The Metaphysical Claim (Nothing has no power)**
  *   **Meaning:** Only physical events (energy transfer, matter movement) cause things. A "non-event" is literally nothing, and nothing cannot push anything.
  *   **Status:** **Substantive but False.** In physics, "absence" doesn't exert force. But in complex systems (like a body or a care home), the *removal of a constraint* (like a nurse) allows other forces (gravity, blood loss) to proceed.
  *   **Does it do the work?** **No.** Courts reject this. If you unplug a life-support machine, you didn't "push" death, but you caused it. The law treats preventing a rescue as causally equivalent to attacking.

  **2. The Counterfactual Claim (The world would be the same)**
  *   **Meaning:** If the nurse *had* answered, the sister-in-law would still be dead (because she was dying anyway). Therefore, the omission made no difference.
  *   **Status:** **Substantive and Defensible (conditionally).** This relies entirely on the medical evidence regarding her life expectancy.
  *   **Does it do the work?** **Yes, if proven.** This is the only reading that survives your "Timing" constraint (b). If he can prove she dies within the hour regardless of the bell, the omission is not a cause of *death*, only of *comfort*. If she survives longer with help, this reading fails.

  **3. The Normative Claim (No duty, no cause)**
  *   **Meaning:** "Omission" is not a physical description; it is a legal one. It means "did not do what was required." If there is no requirement, there is no omission, just a fact of nature.
  *   **Status:** **Platitude (in law).** This is circular. It says: "It's not a cause because we decided it's not a breach."
  *   **Does it do the work?** **Yes, but it cheats.** It moves the argument from *causation* (did the bell matter?) to *duty* (were they supposed to answer?). It hides the causal question behind a rulebook.

  **4. The Pre-emption Claim (The underlying condition did it)**
  *   **Meaning:** The fall and the bleeding were the cause. The nurse's absence was just the background state. Like a dry riverbed doesn't cause the lack of water; the lack of rain does.
  *   **Status:** **Substantive.** This respects your "Circuit" constraint (a). It argues the nurse was not a "standby pump" but merely part of the scenery.
  *   **Does it do the work?** **Weakly.** It requires arguing the nurse was not a "standby pump" (see section on Circuit Model below).

  ---

  ### Slogan 2: "Not acting is acting." (The Granddaughter)
  *Goal: Assign responsibility to bystanders. If scrolling is "acting," the scroller is complicit in the beating.*

  **1. The Enabling Claim (Permission is power)**
  *   **Meaning:** Harm requires a path. By not blocking the path, you are keeping it open. Your inaction is a structural component of the harm.
  *   **Status:** **Substantive and Defensible.** This fits your hydrology background. A levee that is *not* reinforced allows the flood. The "not reinforcing" is part of the flood's cause.
  *   **Does it do the work?** **Yes.** It makes the scroller part of the machinery of the harm.

  **2. The Moral Equivalence Claim (Sin of omission = Sin of commission)**
  *   **Meaning:** God (or the Law) judges the failure to save the same as the act of killing.
  *   **Status:** **Moral Conclusion, not Causal.** This is a judgment on the *value* of the act, not the *mechanics*.
  *   **Does it do the work?** **Yes for protest, No for physics.** It justifies the placard, but it doesn't explain the mechanism. It smuggles in the "Duty" (c).

  **3. The Market/Signal Claim (Attention is fuel)**
  *   **Meaning:** Scrolling signals to the algorithm that the video is valuable, which promotes more violence. The scroll *is* an input.
  *   **Status:** **Substantive and True (in digital systems).** Here, "not acting" is physically false. Scrolling *is* an action (data transfer).
  *   **Does it do the work?** **Yes, but it changes the subject.** It argues the scrolling is a *positive act*, not an omission. It dissolves the slogan rather than defending it.

  **4. The Standby Pump Claim (Capacity implies obligation)**
  *   **Meaning:** Because you *could* have stopped it (you had the phone, the number, the voice), your failure to switch on is functionally identical to switching off.
  *   **Status:** **Substantive.** This relies on the "Circuit" model.
  *   **Does it do the work?** **Yes.** It establishes the scroller as a component in the system, not an observer.

  ---

  ### Addressing Your Three Constraints

  #### (a) The Circuit Model (Standby Pump vs. Removed Pump)
  Your model is excellent. Do not discard it. It maps perfectly to the distinction between **Capacity** and **Absence**.

  *   **Standby Pump (Nurse/Scroller):** The machinery exists. The capacity to move water (or help) is present. The switch was not thrown.
      *   *Which readings respect this?* The Barrister's **Pre-emption Claim** tries to deny this. He wants to argue the nurse was *not* a standby pump, but just part of the walls. The Granddaughter's **Standby Pump Claim** insists they *were* a pump.
      *   *Which collapse it?* The Barrister's **Metaphysical Claim** collapses it. It says "a switch not thrown" is the same as "no switch exists." That is physically false in a care home context.
  *   **Removed Pump (Stranger on street):** The machinery does not exist. No capacity to help.
      *   *The Verdict:* The Barrister wants to treat the nurse as a "Removed Pump" (no causal link). The Granddaughter treats the scroller as a "Standby Pump" (causal link).
      *   *Who is right?* In a care home, the nurse is contractually and physically a **Standby Pump**. The circuit was installed to be energized. The Barrister's argument fails if the court acknowledges the "standby" status.

  #### (b) The Timing/Inevitability Issue (Dying within weeks vs. hours)
  This is the weakest point in the Barrister's armor.

  *   **The Causal Reality:** In medicine and law, accelerating death is causing death. If you shorten a life by one hour, you caused the death *at that time*.
  *   **The Barrister's Problem:** He needs **Reading 2 (The Counterfactual Claim)** from Slogan 1. He must prove: *"Even if the bell was answered, she dies within the hour."*
      *   If he admits the omission changed the *time* of death, he admits the omission was a cause of the *event* (death at 3 AM vs death at 3 PM next week).
      *   **Does any reading survive this?** Only the **Metaphysical Claim** (Reading 1), which courts reject.
      *   **Conclusion:** The slogan "an omission can't be a cause" cannot do the work he wants if the medical evidence shows the response would have延长了 (extended) her life. He is using a metaphysical slogan to cover a medical weakness.

  #### (c) The Duty Question (Is "Omission" smuggled with "Ought"?)
  You are exactly right. This is the pivot point.

  *   **Factual Omission:** "The pump did not turn on." (Neutral).
  *   **Normative Omission:** "The pump did not turn on *and it was supposed to*." (Loaded).
  *   **The Barrister:** Wants to use the **Factual** definition to argue causation, then switch to **Normative** to argue liability. He wants to say: "Physically, nothing happened (Factual). Therefore, legally, we aren't liable (Normative)."
      *   *Verdict:* His slogan is a **Conclusion in a moral argument wearing a causal hat.** He is trying to win a duty argument (were they supposed to help?) by making a causal claim (nothing caused anything).
  *   **The Granddaughter:** Wants to use the **Normative** definition to create a **Causal** result. She says: "Because you ought to have acted (Normative), your not acting is an Act (Causal)."
      *   *Verdict:* She is also smuggling. But her smuggling is more consistent with the **Standby Pump** model. If you install a pump, the "ought" is built into the circuit design.

  ### Summary Recommendation

  1.  **Keep the Circuit Model.** It is superior to the abstract philosophy your reading group is likely using. It forces the question: *Was the agent a component in the system (Standby Pump) or an external observer (Removed Pump)?*
      *   For the Care Home: The nurse was a **Standby Pump**. The circuit was closed by contract and design.
      *   For the Scroller: This is harder. Are they a Standby Pump? Only if the system (society/internet) is designed such that their intervention is a required component for safety.

  2.  **On the Barrister:** He is likely wrong on the causation point if the medical evidence shows a response would have延长了 life. He is using "omission isn't cause" to hide the fact that "accelerating death is cause." The only reading that saves him is the **Counterfactual Claim** (she was dying anyway), not the slogan itself.

  3.  **On the Granddaughter:** Her slogan is morally robust but causally loose. "Not acting is acting" is only true if "acting" means "playing a necessary role in the system." If she means "scrolling exerts force like a punch," that is false. If she means "scrolling completes the circuit that allows the harm," that is defensible.

  4.  **On the Duty Smuggle:** Trust your instinct. If "omission" implies "breach of duty," it is not a causal premise. It is a moral conclusion.
      *   **Barrister:** Uses "Omission" (Moral) to deny "Cause" (Physical). **Invalid.**
      *   **Granddaughter:** Uses "Omission" (Moral) to assert "Act" (Physical/Moral hybrid). **Metaphorical.**

  **Final Verdict:** The Barrister's slogan is a shield made of glass. It shatters under the "Timing" test (b). The Granddaughter's slogan is a hammer; it works if you accept the system design (a) makes the bystander a component. Your hydrologist's eye for "what actually moves water" is the correct lens: look for the pressure, the capacity, and the open channel. The nurse left the channel open. That is a cause.
