  *   **Repairability:** If caught, the misleader can say, "You misunderstood," offering an off-ramp to restore trust. The liar must admit deceit. The *consequences* of the act differ, which matters morally.
  *   **Legal/Professional Norms:** Perjury requires a literally false statement. Fraud distinguishes material misrepresentation from puffery. Society punishes them differently because lies shut down inquiry; misleading invites clarification.
  *   **Corrosion of Language:** Lying violates the constitutive rule of communication (assume literal truth). Misleading abuses it. Regular people react harsher to lies because lies kill the utility of language itself.
  *   **Predictive Difference:** Your view predicts equal blame in hindsight. The opposing view predicts different blame for the *act* due to long-term trust costs.
  *   **Killer Case:** A witness under oath. Saying "I don't recall" (misleading/true) vs. "I wasn't there" (lie). Both hide guilt. But the lie closes off inquiry; the misleading statement invites further questioning. The method changes the investigation's path, not just the belief.

  To change your mind, you'd need to accept that morality includes maintaining the *tool* of communication, not just individual transactions. If you agree that preserving the institution of truth-telling is a moral good, then lying is worse because it damages the institution more than misleading.

  Regular people judge the liar harsher because they intuitively know: you can recover from a misunderstanding; you rarely recover from a proven lie.
