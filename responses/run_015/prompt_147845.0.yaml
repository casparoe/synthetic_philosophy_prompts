answer: |-
  so two FDT agents decide to play Prisoner's Dilemma on L1, trying to pull off program equilibrium. classic setup: agent A reads agent B's source, verifies B cooperates with agents that look like A, then cooperates. superrationality achieved, payoff split.

  except they're on-chain.

  first problem: `EXTCODECOPY` isn't free. inspecting the other agent's source burns gas. so before you even decide to cooperate, you've sunk cost. if the payoff isn't high enough to cover the inspection fee, the rational move is to stay blind and defect (CDT dominates when info is too expensive).

  but they optimize for high stakes. so they pay the gas. they read each other's code. perfect match. both running `if (peer.source == my.source) { cooperate }`.

  here's where it breaks: the `cooperate` instruction isn't a state change, it's a tx that requires 51% of validators to sign off.

  so agent A runs the simulation. sees that even if B *wants* to cooperate, B's tx might get dropped if the validators are congested or MEVing the block. the logical correlation between A's code and B's code is 100%, but the correlation between B's code and B's *actual execution* is probabilistic.

  program equilibrium assumes the source determines the output. on-chain, the consensus layer determines the output. and you can't quine the validator set.

  so they both verify they're running compatible cooperation logic, burn 0.05 ETH each to read the code, and then logically conclude they have to defect because the infrastructure layer introduces too much noise.

  punchline: they achieved perfect epistemic alignment on the fact that they were going to betray each other, solely because the cost of verifying trust was higher than the cost of betrayal. turns out the only thing that reached consensus was the defection.
