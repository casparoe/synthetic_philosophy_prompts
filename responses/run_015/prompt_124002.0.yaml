          *   Options: **Scale-Weighting** (Standard expected value) vs. **Normative Attitude** (Deontological/Virtue/Commitment based).
          *   *Note:* This determines if the *definition* of fanaticism changes under uncertainty.

  3.  **Drafting the Tree Structure (Mental or Scratchpad):**

      *   Root: SH & Longtermism Interaction.
      *   Split 1 (Differential?):
          *   Y: Sim likelihood depends on values.
          *   N: Sim likelihood independent of values.
