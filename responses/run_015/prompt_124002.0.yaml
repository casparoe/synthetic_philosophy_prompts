          *   Q4: Fanaticism (Scale/Normative).

  4.  **Fleshing out the Leaves (Iterative Process):**

      *   *Path 1: Yes, Retained, Holds, Scale.* (We are in a sim run by longtermists, our actions matter, they are like us, we maximize EV). -> *Position:* **Simulated Longtermism**. *Awkwardness:* Requires believing simulators care enough about *our* specific EV calculations to keep the sim running based on them.
