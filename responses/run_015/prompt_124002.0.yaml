  8.  **Final Polish:** Ensure the tone is analytical and philosophical. Make sure the distinction between "Differential" and "Non-Differential" is clear, as that's the first split. (Differential = Sim-running implies specific values; Non-Differential = Sim-running is generic).

      *Self-Correction on Q1:* "Does the simulation argument apply differentially..."
      *   Option A: **Correlated** (Longtermist civs are more/less likely to run sims).
