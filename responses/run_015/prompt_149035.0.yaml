      *   External: Technical philosophy terms (type/token, proper function).
      *   Order: Start with the biggest philosophical threat (Priya/Parity), then the biggest scientific threat (Marc/Mechanism), then the semantic framing (External), then the empirical utility (Marc), then the regress problems.

  5.  **Addressing the "Secret Fear":**
