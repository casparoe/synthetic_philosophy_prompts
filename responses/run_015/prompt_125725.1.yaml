      *Let's lock in the verdict:* Jake wins on coherence. Maya wins on nothing, strictly speaking, though her intuition about construction is correct, her ontological denial is the failure point.

      *Wait, I need to be careful not to be too dismissive of Illusionism as a serious philosophical position.* It is a serious position. But in the context of *this specific exchange*, Jake's objections are the standard and most damaging ones. I will adjudicate based on the logical force of the arguments presented in the prompt.

      *Reflexive Loop Specifics:* Maya says "my conviction is infected." Jake says "then you have no authority." This is the "tu quoque" vs "epistemic access" debate. If all cognitive states are infected, truth tracking is impossible. Jake is right: you need *some* uninfected access to claim truth.

