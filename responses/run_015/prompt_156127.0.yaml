answer: |-
  ### Reconstruction of the Implicit Theory

  The bifurcated regulatory landscape you describe—protecting decapods from live boiling while excluding them from aquaculture welfare standards—presupposes a theory of **"Feasibility-Weighted Sentience."** This is not a pure capacity-based ethic, but a hybrid framework where moral obligation is triggered by sentience but modulated by economic tractability and epistemic clarity.

  **1. Moral Status: Context-Dependent rather than Intrinsic**
  The practice presupposes that moral status is not a binary switch flipped solely by the capacity to suffer. If it were, the UK Animal Welfare (Sentience) Act 2022 recognition would automatically cascade into farming regulations. Instead, the practice implies a **graded obligation**: decapods possess sufficient ontological status to warrant protection from *gratuitous* cruelty in the public sphere (boiling), but insufficient status to override *economic necessity* in the private industrial sphere (farming).
  *   **Confidence:** High (0.9). The legal text of the UK Act itself creates exemptions for "normal agricultural practices," codifying this distinction.

  **2. Epistemic Access: Anthropomorphic Legibility**
  The exclusion of crustaceans from auditing standards (like ASC or RSPCA) presupposes that welfare duties apply only where suffering is **behaviorally legible to human auditors**. Fish (salmonids) display vertebrate-like stress responses (gaping, erratic swimming) that map easily onto human concepts of distress. Decapod stress (limb autotomy, reduced antennule flicking) is epistemically opaque to non-specialists. The implicit commitment is that uncertainty regarding the *expression* of suffering justifies regulatory inaction, even if the *capacity* for suffering is acknowledged.
  *   **Confidence:** Medium-High (0.8). Certification schemes rely on observable metrics; the lack of standardized crustacean welfare metrics suggests this epistemic barrier is a primary driver.

  **3. Institutional Obligation: Tractability as a Boundary Condition**
  The most robust philosophical commitment here is that **tractability silently determines the boundary of concern.** Stunning salmon is technologically mature (percussive/electrical). Stunning shrimp is technically difficult and costly at scale. Stocking density limits for fish are manageable; for shrimp, high density is the fundamental economic engine of pen aquaculture. The practice presupposes that institutional obligation extends only as far as compliance does not threaten the viability of the supply chain.
  *   **Confidence:** High (0.85). The economic disparity between regulating fish (high value, lower volume) and shrimp (low value, massive volume) aligns perfectly with the regulatory divide.

  ### Necessity and Compatibility with Rival Theories

  Does this practice *need* these commitments?
  *   **Necessity:** No. The practice does not logically *require* a specific philosophical stance; it could simply be the result of **bureaucratic inertia** (fish regulations were written first; crustaceans were added later without updating farming codes). However, to *defend* the practice rationally, one must adopt the "Feasibility-Weighted" view.
  *   **Compatibility:** The practice is compatible with **Rule Utilitarianism** (if one argues that regulating shrimp farming causes more economic harm than animal suffering saved) and **Contractarianism** (obligations exist only where society agrees on enforcement mechanisms). It is **incompatible** with **Rights-Based Views** (e.g., Regan) or **Strict Sentientism** (e.g., Singer), which hold that equal capacity for suffering demands equal consideration regardless of economic cost or species morphology.

  ### Coherence Assessment

  Given the legal recognition of decapod sentience (e.g., UK Act 2022, LSE report), the bifurcation is **logically incoherent** regarding the *source* of obligation, though functionally consistent regarding *implementation*.

  If sentience is the *deontological trigger* for protection, the trigger is pulled in both the restaurant and the farm. To prohibit boiling (a method of killing) while permitting high-density stocking and inhumane slaughter at the farm level creates a **moral discontinuity**. It implies that the *location* of the animal (public retail vs. private farm) alters its moral weight, which contradicts the intrinsic nature of sentience. The coherence is maintained only by shifting the justification from "preventing suffering" (boiling ban) to "maintaining industry standards" (farming exclusion).
  *   **Confidence:** High (0.9). The inconsistency is explicit in the legislative text which acknowledges sentience but carves out agricultural exemptions.

  ### Implications for a Uniform, Capacity-Based Policy

  If policy were rebuilt on a uniform, capacity-based view (where welfare follows sentience regardless of taxonomy or economics), the following changes would be required:

  1.  **Stunning and Slaughter:**
      *   **Change:** Mandatory pre-slaughter stunning for all decapods.
      *   **Implementation:** Adoption of electrical stunning devices (e.g., Crustastun) or rapid thermal shock protocols proven to induce immediate insensibility, replacing live boiling or ice slurry immersion.
      *   **Audit:** Verification of time-to-insensibility metrics rather than just visual death checks.

  2.  **Stocking Density:**
      *   **Change:** Drastic reduction in biomass per cubic meter.
      *   **Implementation:** Current shrimp densities (often >100 post-larvae/m²) would need reduction to levels allowing natural behavioral expression (foraging, territoriality). This would likely reduce global supply and increase price significantly.
      *   **Audit:** Shift from "survival rate" metrics (which favor high density) to "behavioral freedom" metrics (space to molt without cannibalism).

  3.  **Auditing and Feed:**
      *   **Change:** Species-specific welfare indicators.
      *   **Implementation:** Auditors trained to recognize crustacean stress signals (e.g., tail flicking frequency, righting reflex). Feed withdrawal periods would need to be established to prevent gut contamination during transport, similar to fish.
      *   **Audit:** Inclusion of limb integrity and molt-stage mortality in welfare scores.

  ### Confidence and Uncertainty Statement

  **Confidence Levels:**
  *   **Reconstruction of "Feasibility-Weighted Sentience":** High Confidence (0.85). The correlation between regulatory burden and economic cost is too strong to be coincidental.
  *   **Assessment of Incoherence:** High Confidence (0.9). The legal recognition of sentience alongside agricultural exemptions is a documented contradiction.
  *   **Policy Implications:** High Confidence (0.9). The technical requirements for welfare (stunning, space) are well-understood even if not implemented.

  **Point of Least Certainty:**
  I am **least certain (Confidence: 0.5)** regarding the **intentionality of the philosophical commitment**. It is unclear whether regulators and certification bodies *consciously* adhere to a "Feasibility-Weighted" philosophy or if this bifurcation is merely the result of **historical path dependence**. Fish welfare regulations originated in the 1990s (EU Directive 98/58/EC) when crustacean sentience was not scientifically settled. The current rules may reflect **bureaucratic lag** rather than a deliberate ethical stance. Distinguishing between a calculated philosophical compromise and simple institutional inertia is difficult without access to internal regulatory deliberations, yet this distinction matters for whether the inconsistency is viewed as a defensible position or a correctable error.
