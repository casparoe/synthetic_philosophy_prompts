prompt: |-
  I'm preparing a long-form feature on how formal institutions can erode their own authority through self-reference, and for it I need a classroom simulation that lets advanced students feel the architecture of a nomic paradox rather than merely parse it. Design an 80-minute, fully runnable activity for a graduate seminar in philosophy of law or logic—about 14 participants, with no lecture delivered beforehand—structured as a legislative assembly governed by a self-amending rulebook. Inject a specific procedural mechanism I'll call recursive entrenchment: every proposed amendment must explicitly cite the article that authorizes it, and that authorizing article must remain unsuspended at the exact moment of citation. Build in a conflict that forces the group to invoke the meta-rule in order to change the meta-rule—say, an efficiency motion that suspends the citation requirement itself—while arranging the voting record, role assignments, and procedural timeline so that participants discover in real time that the citation chain collapses at a precise step. Give them tangible but non-monetary stakes, such as distributed veto tokens that determine the seminar's next shared reading or procedural privileges that affect the session's conclusion; assign concrete roles (drafting committee, procedural referee, dissent recorder, archivist); provide a minute-by-minute timeline; and specify exactly how payoffs or decision rights shift as the rules break. The idea must emerge from what the mechanics make them do, not from any framing I supply afterward. Include a debrief that maps each procedural failure onto the conceptual problem—clearly distinguishing a logical authority gap from ordinary political disagreement—predicts what will go wrong on the first run (participants will almost certainly treat the broken chain as a correctable drafting error and attempt to patch it with a further clause, thereby deepening the paradox), and states frankly which feature of nomic self-reference—most likely the complete absence of an external validator—this embodied exercise cannot reproduce and the facilitator must supply verbally. Do not ask for bibliographies, reading lists, named theorists, or citations; the prompt should stand entirely on its own injected mechanics and the behavior they generate.
