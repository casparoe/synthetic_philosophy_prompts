answer: |-
  This is not a dumb question. You have independently rediscovered the central tension in the philosophy of modeling, specifically the gap between **formal accounts of idealization** (what philosophers say we do) and **sociological practice** (what reviewers actually demand).

  You are describing two distinct phenomena that often get conflated. I will address them separately, give you the existing philosophical terminology, and then coin the term you asked for to capture the relational property that is currently missing from the lexicon.

  ### 1. The "Realism Makes It Worse" Phenomenon
  You noted that adding true mechanisms (spatial structure, variation) sometimes makes the model fit *worse* and become *less* illuminating. This is not just a tractability issue; it is an epistemic one.

  **Existing Terms:**
  *   **Universality (Batterman & Rice):** In physics and increasingly in ecology, certain macro-patterns are "universal." They arise *regardless* of the micro-details. If you are modeling a phase transition (or a population crash), the specific individual variation might be mathematically irrelevant to the critical exponent. Adding those details adds noise without adding signal. The simple model works *because* it ignores the irrelevant details.
  *   **Sloppiness (Gutenkunst et al.):** In systems biology, "sloppy" models have many parameters, but the model output is only sensitive to a few combinations of them. Adding "true" mechanisms often adds parameters that are "sloppy" (unconstrained by data). This increases variance and decreases predictive power.
  *   **Robustness (Levins/Wimsatt):** A model is robust if multiple distinct assumptions lead to the same result. The simple model is often more robust because it relies on fewer contingent assumptions. The "realistic" model is fragile; it fits the data worse because it overfits the noise or relies on parameters you can't estimate.

  **The Verdict:** When adding truth hurts performance, you are moving from a **Minimal Model** (capturing the universal dynamic) to an **Over-specified Model** (capturing contingent noise). The simple model isn't "approximately true"; it is capturing a different *kind* of truth (structural stability) that the realistic model obscures.

  ### 2. The "Same Assumption, Different Verdict" Phenomenon
  This is the core of your frustration. Assumption $X$ (e.g., well-mixed population) is "harmless" in Paper A and "fatal" in Paper B. Reviewers say "it depends on the purpose," but cannot define the dependency.

  **Existing Terms:**
  *   **Negligible vs. Galilean Idealization (McMullin):**
      *   *Negligible:* An assumption that can be removed without changing the result relevant to the question (e.g., air resistance for a falling rock in a vacuum chamber).
      *   *Galilean:* An assumption that distorts the system to isolate a specific causal factor (e.g., assuming frictionless planes to understand inertia).
      *   *Why this fails you:* McMullin's distinction assumes we know *in advance* which assumptions are negligible. In ecology, we often don't know until after the review process.
  *   **How-Possibly vs. How-Actually (Dray/Brandon):**
      *   *How-Possibly:* Shows a mechanism *could* produce the pattern.
      *   *How-Actually:* Claims this mechanism *did* produce the pattern.
      *   *Why this fails you:* Reviewers often treat a "how-possibly" assumption as fatal if they suspect the author is implying "how-actually," even if the author denies it.

  **The Coined Term:**
  Since no existing term captures the *relational instability* of the assumption's validity, I propose:

  #### **Teleological Criticality**

  **Definition:**
  The degree to which the truth-value of a model's assumption causally determines the model's success in achieving its specific **teleological aim** (prediction, explanation, or exploration).

  *   **Low Teleological Criticality:** The assumption is false, but correcting it does not alter the model's answer to its specific question. (e.g., Assuming identical individuals in a model asking about *aggregate* carrying capacity).
  *   **High Teleological Criticality:** The assumption is false, and correcting it fundamentally changes the model's answer to its specific question. (e.g., Assuming identical individuals in a model asking about *extinction risk* of rare genotypes).

  **Boundary Cases:**
  1.  **The Tractability Trap:** An assumption has low criticality, but is defended as "necessary for math." This is often a bluff. If it has low criticality, it should be robust to perturbation.
  2.  **The Mechanism Mask:** An assumption has high criticality, but is treated as low because the model's stated goal is vague (e.g., "understanding dynamics"). This is where reviewers get angry; they suspect the goal is actually mechanism-testing, making the assumption fatal.
  3.  **The Rhetorical Switch:** The same assumption shifts criticality based on the *rhetorical framing*. If you frame your model as a "null model," well-mixed is low criticality. If you frame it as "testing spatial theory," well-mixed is high criticality.

  **Does Intent Matter?**
  *   **Epistemically:** No. This is the **Death of the Author** in modeling. Whether you left out spatial structure because you are lazy (tractability) or ignorant (didn't think of it) is irrelevant. What matters is the *Teleological Criticality*. If the omission changes the answer to the question you claim to be asking, the model fails, regardless of intent.
  *   **Sociologically:** Yes. Reviewers forgive "tractability" more than "ignorance." But this is a social norm, not an epistemic one.

  ### 3. Contradictory Models (Perfect Info vs. No Info)
  You asked if it's the same phenomenon when two accepted models rest on flatly contradictory assumptions.

  **Existing Term:** **Model Pluralism (Winther/Kellert).**
  This is the view that multiple models, even contradictory ones, are necessary to understand a complex system. No single model can capture all aspects.
  *   Model A (Perfect Info) might isolate the *upper bound* of system efficiency.
  *   Model B (No Info) might isolate the *lower bound* or the *baseline* dynamics.
  *   Together, they bracket the truth.

  **Relation to Teleological Criticality:**
  In Model A, "Perfect Info" has **Low Teleological Criticality** for the question "What is the maximum possible growth rate?"
  In Model B, "No Info" has **Low Teleological Criticality** for the question "What is the minimum required resource threshold?"
  The contradiction is only fatal if both models claim to answer the *same* question with the *same* teleological aim.

  ### 4. The Friedman Defense ("Assumptions Don't Matter")
  You mentioned the famous economics line (Milton Friedman's *Instrumentalism*).
  *   **Friedman's Claim:** Assumptions can be wildly unrealistic; only predictive accuracy matters.
  *   **Why Ecology Rejects This:** Ecology is not just interested in *prediction* (what will the population be?). We are interested in *management and mechanism* (how do we stop the decline?). If you predict correctly using the wrong mechanism (e.g., predicting decline due to competition when it's actually disease), your intervention will fail.
  *   **The Verdict:** Friedman is wrong for ecology. We care about **Explanatory Truth**, not just Instrumental Utility. This is why "false assumptions" are sometimes fatal: because they lead to correct predictions for the wrong reasons, which is dangerous for intervention.

  ### Summary for Your PhD
  You are experiencing **Teleological Ambiguity**. The field lacks a shared vocabulary for defining the *goal* of a model precisely enough to determine the **Teleological Criticality** of its assumptions.

  When a reviewer kills a paper for an assumption that was fine in another paper, they are implicitly claiming: *"In this context, the Teleological Criticality of this assumption is High, and you have treated it as Low."*

  **Actionable Advice:**
  In your thesis and papers, explicitly state the **Teleological Aim** of each model chapter.
  *   *"This model aims to establish a null expectation (Low Criticality on individual variation)."*
  *   *"This model aims to identify the causal driver of extinction (High Criticality on individual variation)."*

  By forcing the goal into the open, you force the assumption's criticality to be evaluated logically rather than sociologically.

  **The Term to Use:**
  If you want to use this in your writing, I recommend **"Goal-Relative Criticality"** (slightly more accessible than Teleological).
  *   *"We assess the goal-relative criticality of the well-mixed assumption."*
  *   *"The assumption exhibits low goal-relative criticality for pattern prediction, but high criticality for mechanism inference."*

  This gives you the precise, relational language you are missing.
