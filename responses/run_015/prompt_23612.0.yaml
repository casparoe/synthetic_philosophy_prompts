answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The table is cluttered with half-empty mugs and printouts marked with lambda symbols and spacetime diagrams.*

  **Characters:**
  *   **Elena:** A philosopher of mathematics. Defends the conceptual/a priori reading of the Church-Turing Thesis (CTT).
  *   **Marcus:** A philosopher of physics. Defends the empirical/physical reading of CTT.

  ***

  **Marcus:** You're treating the Church-Turing Thesis like a definition, Elena. That's the root of it. You look at Turing machines, lambda calculus, and general recursive functions, see they converge on the same class of functions, and declare, "QED, this is what computation *is*." But you're skipping the step where we ask why those formalisms map onto reality at all.

  **Elena:** I'm not skipping it; I'm distinguishing the *analysis* from the *application*. The Thesis is a claim about the extension of the concept "effectively calculable." Turing analyzed what a human clerk can do with paper and pencil—discrete symbols, finite states, local operations. He showed that any function calculable by such a procedure is Turing-computable. The fact that lambda calculus and recursive functions yield the same extension isn't a coincidence; it's evidence that we've carved a natural kind at its joint. It's conceptual.

  **Marcus:** But "effective" is a loaded word. It implies *efficacy*. It implies doing something. If I say a function is "effectively calculable," I'm saying there exists a physical process that can evaluate it. If the laws of physics changed, the set of effective procedures might change. Imagine a universe where you can perform an infinite number of discrete operations in finite proper time. In that universe, the Halting Problem is decidable. If CTT is a priori truth, it should hold in that universe too. But it wouldn't. Therefore, CTT is contingent on the physics of our universe.

  **Elena:** You're describing a Malament-Hogarth spacetime. I know the literature. But here's the rub: In that scenario, the "computer" isn't following an *algorithm* in the sense Turing meant. It's relying on a specific geometric feature of spacetime to dump an infinite task into a black hole horizon and read the result. That's not calculation; that's a physical oracle. The Church-Turing Thesis isn't about what physical systems *happen* to do; it's about what can be done by a finite, step-by-step procedure. If your "computer" requires infinite precision or infinite energy density, it violates the finiteness constraint built into the very concept of an algorithm.

  **Marcus:** But why is the finiteness constraint a conceptual truth rather than a physical limitation? You say "finite steps" is part of the definition. I say "finite steps" is a reflection of the fact that we live in a universe with a Planck length and a speed of light limit. If the universe were continuous in a way that allowed for analog hypercomputation—say, a machine that uses real-valued states to solve non-computable problems—why would we say the machine is "cheating"? We'd just say our definition of computation was too narrow.

  **Elena:** Because then "computation" loses its normative force. If computation is just "whatever physical systems do," then the thesis becomes trivial. A rock rolling down a hill "computes" its trajectory. A storm "computes" the weather. The power of CTT is that it isolates a specific *kind* of causal process—one that is discrete, deterministic, and independent of the substrate. The convergence of Turing, Church, and Gödel wasn't them all looking at physics and agreeing. It was them looking at *logic* and agreeing.

  **Marcus:** They were looking at logic, yes, but logic as practiced by physical beings. Let's talk about quantum computing. You'll say quantum computers don't refute CTT because they only speed up calculations; they don't compute non-Turing-computable functions. They stay within BQP, which is a subset of Turing-computable functions.

  **Elena:** Exactly. A quantum computer can be simulated by a classical Turing machine, albeit with exponential slowdown. So the *class* of functions remains the same. The Thesis holds.

  **Marcus:** That simulation claim is the weak point. We assume a quantum system can be simulated by a Turing machine because we assume the evolution of the wavefunction is computable. But that's an assumption! If there's a non-linear correction to the Schrödinger equation, or if wavefunction collapse involves a non-computable random element, then a physical quantum system might output a number a Turing machine cannot predict. We haven't ruled that out empirically. We just assume unitary evolution holds everywhere. That's a physical hypothesis, not a logical truth.

  **Elena:** You're conflating the *Extended* Church-Turing Thesis with the original. The original is about *what* can be computed, not *how efficiently* or *via what specific dynamics*. Even if collapse is non-computable, that makes the system a random oracle, not a hypercomputer. It doesn't let you solve the Halting Problem. To actually refute CTT, you need a physical system that reliably decides undecidable problems.

  **Marcus:** And I'm telling you, General Relativity offers exactly that, provided you accept the physical reality of certain spacetime geometries. If a computer falls into a Kerr black hole while another observer waits at infinity, the observer can see the result of an infinite computation in finite time. Now, you'll say, "Ah, but the signal gets redshifted to nothing," or "The energy requirements are infinite." But those are physical objections! You are using physics to save the conceptual thesis. You're admitting that whether CTT holds depends on whether the universe permits these spacetimes. That makes CTT empirical.

  **Elena:** It makes the *Physical* Church-Turing Thesis empirical. And I grant you that one. There is a distinction here, Marcus. There is the claim that "Turing computability captures the intuitive notion of algorithm." Call that CTT-Conceptual. Then there is the claim that "Every physical process is simulable by a Turing machine." Call that CTT-Physical. I am defending the first; you are attacking the second.

  **Marcus:** But they aren't separable! The intuitive notion of algorithm *comes from* our experience of physical manipulation. Turing's analysis of the "human clerk" is an idealization of a physical agent. If the physical world allows for processes that outstrip that idealization, then the idealization was wrong. It's like Newtonian mass. We thought mass was invariant. That was conceptual for two hundred years. Then relativity showed mass is frame-dependent. We didn't say, "Well, Newtonian mass is the *conceptual* truth, and relativistic mass is just physical." We updated the concept.

  **Elena:** That's a strong analogy, but I think it fails on the nature of the idealization. When we define a "circle," we say "all points equidistant from a center." If I draw a circle in sand, it's imperfect. If physics prevents perfect circles due to atomic granularity, the *concept* of a circle isn't refuted. The concept exists in the space of geometry, not geology. Similarly, the Turing machine is a geometric object in the space of logic. The fact that physical entropy might prevent a Turing machine from running for $10^{100}$ steps doesn't mean the *class of recursive functions* changes.

  **Marcus:** But computation isn't geometry. It's dynamics. A circle is static; an algorithm is a process. If the laws of dynamics allow for hypercomputation, then the "space of logic" you're talking about is actually a subspace of the "space of physical possibility." Deutsch argued this: the set of computable functions is determined by the laws of physics. If we discover a new law that permits hypercomputation, we don't say, "Oh, that's not real computation." We say, "Computation is richer than we thought."

  **Elena:** But then "computation" becomes synonymous with "causality." If every physical interaction is a computation, and some physical interactions decide the Halting Problem, then the Halting Problem is decidable. But the Halting Problem is *logically* undecidable. You can't have a physical system that outputs "True" for a logical contradiction. If a machine claims to solve the Halting Problem, either it's lying, or it's not actually solving the general case, or our understanding of logic is wrong. I'd sooner bet on the physics being misinterpreted than on logic being contingent.

  **Marcus:** Why? Because logic is a tool we built to model the world. If the world behaves in a way that violates our logical constraints on "effective procedures," we change the constraints. You're prioritizing the map over the territory. You're saying, "The map says there's no path here, so if you walk there, you aren't really walking."

  **Elena:** I'm saying that if you walk off the map, you aren't following the rules of the map. Look, let's locate the real disagreement. It's not about black holes or qubits. It's about whether "effective calculability" is a normative concept or a descriptive one. I think it's normative. It prescribes what counts as a valid deduction or calculation. You think it's descriptive. It describes what physical systems can achieve.

  **Marcus:** Precisely. And if it's descriptive, it's fallible. It's like the speed of light. For a long time, we thought nothing could go faster. That was a limit on signal propagation. If we found tachyons, we'd update the limit. If we find hypercomputers, we update CTT.

  **Elena:** But the speed of light is a constant in a physical theory. Computability is a property of formal systems. You can't find a "tachyon" in arithmetic. The undecidability of the Halting Problem is a theorem, not a measurement. A physical machine cannot violate a theorem. If it appears to, it means the mapping between the physical states and the logical symbols has broken down. Maybe the machine degraded. Maybe the signal was noise. But you can't point to a physical object and say, "This object disproves Gödel."

  **Marcus:** You can't disprove Gödel, no. But you can disprove the claim that "Turing machines capture all physical methods of solving problems." Gödel limits the formal system; physics determines which formal systems are instantiated in reality. If physics instantiates a system that transcends Turing limits, then CTT is false as a claim about reality. And since the "intuitive notion of algorithm" is grounded in reality, CTT is false conceptually too.

  **Elena:** So you think our intuitions about algorithms are hostage to the outcome of high-energy physics experiments?

  **Marcus:** I think our intuitions about algorithms are evolved heuristics for navigating a medium-sized physical world. Of course they're hostage to physics. If we lived in a Malament-Hogarth universe, our "intuitive notion of algorithm" would include infinite steps. We wouldn't find it counterintuitive at all.

  **Elena:** *(Pauses, stirring her coffee)* That's the crux, isn't it? You think the intuition is contingent on our environment. I think the intuition is contingent on our rationality. If we lived in that universe, we might *physically* be able to do more, but we still wouldn't call the infinite process an "algorithm." We'd call it an "oracle." We'd still distinguish between what we can derive step-by-step and what is just given to us by the geometry of the world.

  **Marcus:** And I'd say that distinction is just a prejudice born of living in a weak universe. You're protecting the sanctity of the Turing machine by relegating anything more powerful to the status of "magic" or "oracle." But if the magic is lawful, if it's repeatable and physically realizable, it's not magic. It's just computation we didn't expect.

  **Elena:** Then we disagree on the priority. You believe physics dictates logic. I believe logic constrains the description of physics. If a physical theory implies hypercomputation, I will suspect the physical theory is idealized in an inadmissible way—like assuming infinite precision. I won't suspect the logic is wrong.

  **Marcus:** And if the physical theory is confirmed? If we build the machine?

  **Elena:** Then we will have built a device that gives us answers we cannot verify. And that, Marcus, is the death of science, not the expansion of computation.

  **Marcus:** *(Smiles)* Or it's the beginning of a new kind of science. One that doesn't assume the universe is a Turing machine.

  **Elena:** *(Smiles back)* Well, until you build that machine, I'll stick with the thesis that says you can't.

  **Marcus:** And I'll stick with the hypothesis that says "never say never" to the laws of nature.

  *(They clink mugs, the disagreement unresolved but the terms of engagement sharpened.)*
