      *   *Pro-Physical (Empirical):* Needs to emphasize the link between computation and physical laws, the possibility of new physics, and the distinction between abstract computability and physical realizability. Let's call him **Marcus**. He leans towards the Deutsch/Pitowsky interpretation.

  3.  **Drafting - Section by Section:**

