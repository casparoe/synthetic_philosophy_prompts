      *   *Insensitivity:* If $E$ were different (or absent), would $B$ change? In epiphenomenalism, no (assuming $N$ stays the same). This violates Sensitivity conditions for knowledge.
      *   *Covariation vs. Counterfactuals:* Covariation is actual world only. Knowledge requires modal robustness (other possible worlds). The friend is pointing out the modal weakness of the user's view.

  5.  **Address the "Everyone Faces This" Point:**
