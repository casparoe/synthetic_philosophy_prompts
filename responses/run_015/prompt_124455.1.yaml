answer: |-
  **Scenario**

  A sleep clinic recruits Anne and Bob for a drug trial involving a single fair coin toss on Sunday night. If the coin lands Heads, Anne is woken with a sedative reversal on Monday only, while Bob is woken on both Monday and Tuesday; if the coin lands Tails, Anne is woken on both Monday and Tuesday, while Bob is woken on Monday only. In all cases, subjects are administered an amnestic agent after each awakening that erases memory of previous wakefulness, they are kept in soundproof separate rooms, and they are given no access to clocks, calendars, or information about the other subject's current state, knowing only the full protocol and that they are currently awake.

  **The Arithmetic**

  *   **Halfer View (Lewisian):** Both subjects treat the coin toss as the sole source of uncertainty. Since the coin is fair and no new non-indexical evidence is received upon waking, both maintain the prior probability.
      *   Anne: $P(\text{Heads}) = 1/2$.
      *   Bob: $P(\text{Heads}) = 1/2$.
      *   *Result:* Agreement.

  *   **Thirder View (Standard/Elga):** Subjects treat their current awakening as a random sample from the set of all possible awakenings they could experience.
      *   **Anne:** In 100 experiments, there are 50 Heads (50 awakenings) and 50 Tails (100 awakenings). Total awakenings = 150. Heads awakenings = 50.
          *   Anne's $P(\text{Heads}) = 50/150 = 1/3$.
      *   **Bob:** In 100 experiments, there are 50 Heads (100 awakenings) and 50 Tails (50 awakenings). Total awakenings = 150. Heads awakenings = 100.
          *   Bob's $P(\text{Heads}) = 100/150 = 2/3$.
      *   *Result:* Disagreement ($1/3$ vs $2/3$).

  **Betting Check**

  The bookie offers an actuarially fair bet based on the coin's objective chance: stake \$0.50 to win \$1.00 if correct (net +\$0.50 win, -\$0.50 loss). This bet implies a probability of $1/2$.

  *   **Anne (Thirder):** Believes $P(\text{Heads}) = 1/3$. She bets **Tails** at every awakening.
      *   *Heads World (50% of experiments):* Anne wakes once. Bets Tails. Loss: \$0.50.
      *   *Tails World (50% of experiments):* Anne wakes twice. Bets Tails. Win: \$1.00.
      *   *Average per experiment:* $(0.5 \times -0.50) + (0.5 \times 1.00) = +\$0.25$.
      *   *Outcome:* Anne comes out ahead; Bookie loses.

  *   **Bob (Thirder):** Believes $P(\text{Heads}) = 2/3$. He bets **Heads** at every awakening.
      *   *Heads World (50% of experiments):* Bob wakes twice. Bets Heads. Win: \$1.00.
      *   *Tails World (50% of experiments):* Bob wakes once. Bets Heads. Loss: \$0.50.
      *   *Average per experiment:* $(0.5 \times 1.00) + (0.5 \times -0.50) = +\$0.25$.
      *   *Outcome:* Bob comes out ahead; Bookie loses.

  *   **Halfer Check:** If they bet according to $P(\text{Heads}) = 1/2$ (indifferent, but suppose they bet Heads):
      *   Anne loses \$0.25 per experiment on average (miscalibrated to her awakening frequency).
      *   Bob gains \$0.25 per experiment on average.
      *   *Note:* This confirms Constraint 5 is only satisfied by the Thirder view in this design.

  **Key Feature and Removal**

  The work is done by the **asymmetric awakening schedule**. Anne is sampled more frequently in the Tails world; Bob is sampled more frequently in the Heads world.
  *   **If you make the schedules identical** (e.g., both wake once on Heads, twice on Tails): Both Thirders calculate $1/3$. The disagreement vanishes, and you revert to the standard Sleeping Beauty problem stapled for two people. The divergence relies entirely on the fact that "being Anne" and "being Bob" constitute different sampling filters over the same coin toss.

  **Verdict**

  This is **not** just two ordinary Sleeping Beauty problems stapled together. In a standard stapled case, both subjects have identical evidence and identical credences. Here, running them side-by-side on one coin produces a **divergence of rational credence** despite identical priors and identical non-indexical information. It isolates the variable of "self-location" by showing that *which* subject you are changes the probability assignment under the Thirder view, whereas the Halfer view remains insensitive to subject identity. This strongly supports your thesis that Thirder credence is indexed to a specific sampling scheme (the subject's own awakening schedule).

  **Strongest Thirder Reply**

  A Thirder would argue: "Anne and Bob are not contradicting each other because they are answering different questions. Anne is answering 'What is the probability this is a Heads-awakening *for Anne*?' while Bob is answering 'What is the probability this is a Heads-awakening *for Bob*?' Since the proposition includes the indexical 'I' (or 'this awakening'), the truth conditions differ."
  *   **Survival of Betting Check:** This reply survives. The betting check confirms that each subject maximizes expected utility *relative to their own stream of awakenings*. There is no single "God's eye" pot of money they are sharing; they are each optimizing their own ledger. The bookie loses because he is offering odds based on the *coin* frequency while the subjects are betting based on *awakening* frequency. The Thirder argues this is correct behavior for agents who care about the outcomes of their decisions at each moment of consciousness.

  **Specification Check & Definitions**

  *   **Halfer Version:** Lewisian Halfer (Credence equals prior coin chance; no update on awakening).
  *   **Thirder Version:** Standard Thirder (Principle of Indifference over indistinguishable awakenings; Credence equals long-run frequency of outcomes among awakenings).
  *   **Constraint Flag:** **Constraint 5** ("Each subject's credence has to be the one that matches the long-run frequency...") cannot be met for the **Halfer** view by definition. Halfers explicitly argue that credence should match the frequency of *experiments* (coin tosses), not *awakenings*. In this design, Anne's Halfer credence ($1/2$) does *not* match her awakening frequency ($1/3$). I have designed the scenario so the *Thirder* credences match the frequencies as requested, but you must acknowledge in your paper that Halfers reject the premise that awakening frequency dictates credence.
  *   **Constraint 8:** Met. The gap is manufactured by asymmetry between subjects, not by piling extra awakenings onto one outcome for *everybody* (which would be standard SB).
