      *   *Check:* "Where a reading survives all three devices..." Need a specific conclusion on this.

      *(Self-Correction during drafting)*: The prompt asks for a "menu... ordered roughly from the trivially true to the radical." I need to make sure the ordering makes sense.
      *   *Dead Hand:* Bare Time (Trivial/False) $\rightarrow$ Desire Change $\rightarrow$ Info Change $\rightarrow$ Capacity $\rightarrow$ Entitlement (Radical/Structural).
      *   *Ulysses:* Negative Liberty (False) $\rightarrow$ Option Extension $\rightarrow$ Diachronic Autonomy $\rightarrow$ Authenticity $\rightarrow$ Constitutive (Radical).

      *(Refining the Device Analysis)*: I need to be careful not to just say "Neutralizes." I need to say *why*.
      *   *Reaffirmation:* Turns a static bind into a dynamic one. Hits "Time" and "Desire" hard. Hits "Entitlement" less (still binds those in between).
