answer: |-
  You have put your finger on the central nerve of the conflict between classical cognitive science and the more radical strands of philosophy of mind. Your intuition is correct: there is a structural assumption at work here, it is pervasive, and it is often unnamed because it functions as a default background rather than a foreground claim.

  Here is the carving you are looking for.

  ### 1. The Name and the Cluster

  The established term for the cluster of commitments you describe is **Cartesian Materialism**.

  Coined by Daniel Dennett, this label identifies the view that retains the *structure* of Descartes' dualism (a central place where things come together for a final presentation) while discarding the *substance* (the immaterial soul). It is the belief that although there is no soul, there is still a "finish line" in the brain where neural processing becomes *consciousness*.

  Your three commitments map precisely onto the three structural requirements of the Cartesian Theater:

  1.  **The Assembly Place:** (Your first commitment). This is the **Screen** of the Theater. The assumption that there is a specific neural locus (or functional equivalent) where disparate data streams converge to form a unified representation. This is what drives the "filling-in" language. To speak of a gap being filled implies a map where the gap exists.
  2.  **The Assembly Time:** (Your second commitment). This is the **Showtime** of the Theater. The assumption that there is a definitive moment when the processing is "done" and the experience "happens." This generates the Orwellian vs. Stalinesque dilemma (more on this below).
  3.  **The Official Version:** (Your third commitment). This is the **Audience** of the Theater. The assumption that there is a single, authoritative stream of content that constitutes "what it is like" for the subject, distinct from the machinery that produced it.

  **Are they detachable?**
  In the literature, they are usually treated as a package deal, but they can be prised apart.
  *   One could posit an **Assembly Place** without a strict **Assembly Time** (e.g., a distributed buffer that settles over a window rather than a moment).
  *   One could posit an **Official Version** without a specific **Place** (e.g., a virtual machine running on distributed hardware).
  *   However, your suspicion is correct: **The Assembly Time is the load-bearing beam.** If you deny that there is a specific moment when experience becomes "fixed," the need for a specific place collapses (since the "map" is never fully rendered at once), and the "Official Version" becomes a retrospective fiction rather than a contemporaneous reality.

  ### 2. Specific Terminology for the Timing Problem

  Regarding your second point (the timing of experience), there is a specific distinction that isolates this assumption. Dennett calls this the **Orwellian vs. Stalinesque** distinction.

  *   **Stalinesque:** The brain falsifies the evidence *before* it reaches consciousness (the trial is rigged before the verdict). This corresponds to "memory revision."
  *   **Orwellian:** The brain presents the evidence accurately, but consciousness is delayed, and then the history is rewritten *after* the fact (the history books are changed after the trial). This corresponds to "experience referred backwards."

  The literature treats these as rivals because they both presuppose **Temporal Isomorphism**: the idea that there *must* be a fact of the matter about when the experience occurred, independent of the report. Your insight is that without a report (or a disposition to report), the question has no truth conditions.

  If you need a name for the specific assumption that there is a "moment of becoming conscious" distinct from the moment of availability for control, I suggest **The Finishing Line Assumption**. It is not a standard term, but it is the precise metaphor underlying the literature you are critiquing.

  ### 3. What It Is Not

  You asked to distinguish this from nearby notions.

  *   **It is not the Homunculus Fallacy.** The Homunculus Fallacy is about *agency* (who is looking?). Cartesian Materialism is about *topology and timing* (where and when does the looking happen?). You can avoid a homunculus (by positing a brain that "just knows") while still committing to Cartesian Materialism (by positing a specific time/place where it knows).
  *   **It is not the Hard Problem.** The Hard Problem (Chalmers) asks why processing feels like anything at all. Your worry is structural: *how* is the processing organized? You are questioning the *geometry* of the explanation, not the *existence* of the phenomenon.
  *   **It is not Skepticism.** You are not denying that subjects have experiences. You are denying that the *description* of those experiences as "filled," "timed," or "thresholded" maps onto a singular neural event.

  ### 4. Evaluating Your Diagnostic Test

  Your test: *Substitute "conscious" with "available for spontaneous verbal report." If nothing is lost, the original claim relied on the assumption.*

  **Is it sound?**
  Methodologically, yes. Ontologically, it is controversial.
  This test is a form of **Operationalism** or, in contemporary terms, a reduction of **Phenomenal Consciousness** (P-consciousness) to **Access Consciousness** (A-consciousness), using Ned Block's terminology.

  *   **Does it over-generate?** It might flag claims about **blindsight** or **priming** as "unconscious" even if the subject has a faint phenomenology they cannot report. However, for the specific timing/latency questions you are addressing, reportability is the only operational definition we have.
  *   **Does it under-generate?** It might fail to catch assumptions about **animal consciousness** or **infant consciousness**, where report is impossible. But again, regarding the *timing* of neural events, if there is no report (or no downstream motor consequence), attributing a specific timestamp to the "experience" is indeed metaphysical surplus.

  **Has it been proposed?**
  Yes. This is the core of **Dennett's Heterophenomenology**. It treats the subject's report as the final data, and treats the "inner experience" as a theoretical construct that is only valid insofar as it explains the report. It is also the stance of **Logical Behaviorism**, though you are applying it with a neurophysiologist's nuance rather than a behaviorist's dogma.

  ### 5. The Obvious Retort: The Singleness of Experience

  *The Retort:* "A subject gives one answer, not several. If processing is parallel and distributed, why is the report singular? Does this not prove an Official Version?"

  *The Strongest Reply:* **The User Illusion (or Narrative Gravity).**

  The singleness of the report does not prove the singleness of the underlying process; it proves the singleness of the **bottleneck for speech**.
  Consider a computer. Millions of transistors switch in parallel. Yet the monitor displays a single, coherent desktop. If you ask the computer "what file is open?", it gives one answer. This does not mean there is a single "place" in the RAM where the "desktop" exists. It means the operating system constructs a simplified summary for the user.

  In the brain, language production is a serial bottleneck. To speak, the system must serialize parallel data into a linear string of words. The "singleness" is a requirement of the output channel (speech), not necessarily a property of the input state (experience).

  **What is left unpaid?**
  The cost of this reply is **Phenomenal Unity**.
  Even if we accept that report is serial, the *feeling* of unity often precedes the report. I feel the unity of the visual field *before* I speak about it.
  *   **The Cartesian Materialist** says: That feeling is the result of the integration at the Finishing Line.
  *   **You (and Dennett)** say: That feeling is a retrospective construction. The brain assumes it was unified because the report is unified.

  The "unpaid debt" is the intuition that the *quality* of the experience (the redness of red, the unity of the field) exists prior to the cognitive access. Abandoning the assumption requires accepting that **phenomenology is a form of memory.** This is a hard pill for many to swallow, as it suggests we never experience the "now," only a slightly delayed, edited summary of the immediate past.

  ### Summary of the Carving

  1.  **The Cluster:** **Cartesian Materialism**.
  2.  **The Specific Timing Assumption:** **The Finishing Line Assumption** (or Temporal Isomorphism).
  3.  **The Timing Dilemma:** **Orwellian vs. Stalinesque** (which you correctly identify as a false dichotomy if the Finishing Line is rejected).
  4.  **Your Test:** A robust **Access-Consciousness Operationalism**. It is sound for timing experiments but controversial for qualia research.
  5.  **The Singleness:** Explained by **Serial Output Bottlenecks** and **Narrative Construction**, not by **Parallel Integration**.

  You are not cutting at a joint that isn't there. You are cutting at the joint between **process** and **product**. The literature you are reading often treats the product (the report, the "filling in") as evidence of a specific process (the "filling," the "arrival"). Your career in neurophysiology has trained you to see the process, and you recognize that the product does not necessitate the specific architecture the philosophers are assuming.

  The assumption is real. It has a name. And your skepticism is the standard, rigorous response to it.
