      *   *Section 2 (Thin/Thick):* Warn against the metaphysical baggage. Suggest "Endorsed vs. Non-Endorsed" updates. Highlight the "Calibration Training" paradox: if training works, why is it "thick"? If it changes values, is it calibration or corruption?
      *   *Section 3 (Formalization):* Propose conditioning on the *update rule* rather than the agent. Suggest looking at *Value of Information* vs. *Value of Transformation*.
