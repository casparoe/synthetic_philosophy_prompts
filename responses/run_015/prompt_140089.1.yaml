prompt: |-
  Hey — I'm a software engineer with no philosophy background, so keep it concrete and skip the citations, I can't follow them anyway.

  I run a team of about a dozen engineers at a company that's gone pretty hard on AI-assisted development: most nontrivial code now starts as a model-generated draft that a human reviews and merges. People are quietly worried we're loosing our grip on our own systems. I've got maybe a year and something like 20-30% of two senior engineers' time to actually do something about it. So I want an agenda, not a survey.

  Here's the candidate list of worries, roughly as my team states them: engineers who can competently review code they couldn't have written; juniors never building the mental models you used to get from grinding through hard bugs; everyone's sense of what they personally do and don't understand getting badly calibrated; us quietly inheriting the model's framing of what a problem even is, so we stop noticing we've been handed the question; and on-call incidents where nobody can reconstruct why the system behaves the way it does. Plus whatever I'm not thinking of.

  Which two or three would you spend the year on, in what order, and why? I care much more about the reasoning than the list: what criteria you're ranking by (how much damage, how fixable at my level rather than at the model labs, how much of the rest depends on it, how neglected), the trade-offs between those criteria, and which worries you're putting low because they sound alarming but don't really follow.

  The part I most want: what observable evidence over the next year should move something up or down. What would I actually track on my own team to find out I'd backed the wrong horse?

  One half-formed idea of mine, in case it's useful: I suspect the useful distinction isn't "understands vs. doesn't understand" but "can judge vs. can produce," and that we're drifting hard toward judge-only. If that's the wrong frame, say so and hand me a better one.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **User:** Software Engineering Manager (team of ~12).
      *   **Background:** No philosophy, wants concrete, actionable advice. No citations.
      *   **Situation:** Heavy AI-assisted development (model drafts -> human review/merge).
      *   **Constraint:** 1 year timeline, budget of 20-30% of 2 senior engineers' time (~0.4 FTE).
      *   **Goal:** An agenda to mitigate risks of AI dependency.
      *   **Specific Worries:**
          1.  Reviewing code one couldn't write.
          2.  Juniors not building mental models (no "grinding").
          3.  Calibration of personal understanding (Dunning-Kruger on steroids).
          4.  Inheriting the model's framing of problems.
          5.  On-call incidents (inability to reconstruct system behavior).
      *   **User's Hypothesis:** Shift from "produce" to "judge."
      *   **Request:** Pick 2-3 worries, order them, explain criteria/trade-offs, identify what to ignore, and define observable evidence/metrics to track success/failure.

  2.  **Evaluate the Worries (The "Candidate List"):**
      *   *Worry 1: Reviewing code one couldn't write.* (The "Illusion of Competence"). High risk, but arguably a symptom of a deeper issue.
      *   *Worry 2: Juniors not building mental models.* (The "Apprenticeship Crisis"). Critical long-term, but takes years to manifest fully. Hard to fix in 1 year with limited budget.
      *   *Worry 3: Calibration of understanding.* (Metacognition). Very high risk. If people don't know what they don't know, they merge dangerous code.
      *   *Worry 4: Inheriting model framing.* (Conceptual Drift). Subtle, philosophical, hard to measure. Likely low priority for a 1-year engineering fix.
      *   *Worry 5: On-call incidents/Reconstructability.* (Operational Resilience). Immediate, tangible damage. High fixability.

  3.  **Determine Selection Criteria:**
      *   **Damage Potential:** How bad is it if this goes wrong? (Production outages > theoretical skill decay).
      *   **Fixability (Agency):** Can a manager fix this with 0.4 FTE? (Process changes > re-architecting LLMs).
      *   **Dependency:** Does fixing this help fix the others? (Foundation skills).
      *   **Neglect:** Is everyone ignoring this because it's invisible?
      *   **Time Horizon:** Can we see results in 1 year?

  4.  **Select the Top 2-3 Worries:**
      *   *Selection 1: On-call/Reconstructability (Worry 5).* Why? It's the "stop the bleeding" priority. If the system burns down, skill decay doesn't matter. It's concrete, measurable, and directly addressable via documentation/debugging protocols.
      *   *Selection 2: Calibration of Understanding (Worry 3).* Why? This underpins the "Reviewing code" (Worry 1) and "Juniors" (Worry 2) issues. If engineers know *what* they don't understand, they will ask for help or dig deeper. It fixes the "Judge vs. Produce" gap by enforcing verification.
      *   *Selection 3 (Optional/Integrated): Juniors/Mental Models (Worry 2).* I'll fold this into Calibration. You can't fix "Juniors" generally in a year, but you can fix "Juniors on *this* team" by changing how they verify work.
      *   *Discard:* "Inheriting model framing." Too abstract for a 1-year engineering sprint. "Reviewing code one couldn't write" is a symptom of poor calibration.

  5.  **Develop the Agenda (The "What" and "Order"):**
      *   **Phase 1 (Months 1-4): Operational Resilience (The On-Call Problem).** Focus: "If this breaks, can we fix it?"
      *   **Phase 2 (Months 5-8): Calibration & Verification (The Understanding Problem).** Focus: "Do we know what we merged?"
      *   **Phase 3 (Months 9-12): Integration & Junior Scaffolding.** Focus: Embedding the habits.

  6.  **Address the User's Hypothesis ("Judge vs. Produce"):**
      *   It's a good frame, but incomplete. "Judging" implies a standard. If the standard is "does it compile/run," that's low. If the standard is "do I know how to revert this," that's high.
      *   *Better Frame:* **"Ownership of Consequence."** It doesn't matter if you wrote it or the AI did; if you merge it, you own the debug session. This shifts the incentive from "passive review" to "active verification."

  7.  **Define Observable Evidence (Metrics/Signals):**
      *   Need leading indicators (process) and lagging indicators (outcomes).
      *   *Good signs:* Increased time in PR comments asking "why," increased runbook usage, faster MTTR (Mean Time To Resolve) because people know the system.
      *   *Bad signs:* "LGTM" without comments, reliance on "the AI said so," MTTR increases, "mystery code" comments in repo.

  8.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, engineering-focused, no fluff.
      *   *Structure:*
          1.  Validate/Refine the Frame.
          2.  Selection Criteria.
          3.  The Two Priorities (Order & Rationale).
          4.  The Agenda (Concrete actions for the 0.4 FTE).
          5.  Observable Evidence (What to track).
          6.  What to Ignore.
      *   *Refinement on "Judge vs. Produce":* I like "Ownership of Consequence" better. It aligns with SRE culture.
      *   *Refinement on Budget:* 20-30% of 2 seniors is roughly 3-4 days a week combined. That's enough to build tooling, run workshops, and audit PRs.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Concrete agenda? Check.
      *   Reasoning for ranking? Check.
      *   Observable evidence? Check.
      *   Address the "Judge vs. Produce" hypothesis? Check.

  10. **Final Polish:** Ensure the distinction between "Calibration" and "Mental Models" is clear. Calibration is knowing your limits; Mental Models are the map itself. You need calibration first to know when you need to build the map.

  *(Self-Correction during drafting)*: I initially thought about suggesting "No AI for Juniors." That's unrealistic and fights the company strategy. Better to suggest "AI + Verification Requirement."
  *(Self-Correction on Metrics)*: Don't suggest "Lines of Code" or "Velocity." Suggest "Time to Explain" or "Debug Success Rate."

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the agenda. I've skipped the philosophy and focused on risk management and engineering leverage.

  ### 1. Refine Your Frame: "Judge vs. Produce"
  Your hypothesis is close, but "Judge" is too passive. A judge can still be wrong if they rely on bad heuristics.
  **Better Frame:** **"Ownership of Consequence."**
  It doesn't matter who wrote the code (human or model). The person who merges it owns the debug session when it breaks.
  *   **Why this shift?** "Judging" implies checking against a spec. "Ownership" implies checking against reality. If you can't explain how to revert or debug this code, you aren't allowed to merge it, regardless of who wrote it. This forces the "mental model" building you're worried about without banning the tool.

  ### 2. Selection Criteria
  I ranked your worries based on three constraints specific to your situation (1 year, 0.4 FTE budget, manager-level leverage):
  1.  **Blast Radius:** Does this cause outages *now* or skill decay *later*? (Prioritize now).
  2.  **Intervention Leverage:** Can you fix this with process/tooling, or does it require changing human psychology? (Prioritize process).
  3.  **Measurability:** Can you tell in 3 months if it's working? (Prioritize observable behavior).

  ### 3. The Two Priorities (In Order)

  #### Priority 1: Operational Resilience (The On-Call/Reconstructability Worry)
  **Why first?** This is your "stop the bleeding" priority. If your system becomes un-debuggable, the team's skill level doesn't matter because the product is down. This has the highest immediate blast radius.
  **Why fixable?** You can enforce documentation and tracing requirements via CI/CD and PR checks. You don't need to change how people think yet; just change what they submit.
  **Dependency:** You cannot fix "mental models" if the system is a black box. You need observable systems first.

  #### Priority 2: Calibration of Understanding (The "Do I actually know this?" Worry)
  **Why second?** Once the system is debuggable, you need to ensure engineers aren't merging code they can't explain. This addresses the "reviewing code they couldn't write" and "junior mental models" worries simultaneously.
  **Why fixable?** You can institute "Verification Protocols" (see agenda below).
  **Dependency:** If engineers are calibrated, they will naturally stop inheriting bad model framing because they'll recognize when the model's solution doesn't fit the constraints.

  #### What I'm Deprioritizing (And Why)
  *   **Inheriting Model Framing:** This is real, but it's a second-order effect. If engineers are calibrated (Priority 2) and the system is observable (Priority 1), they will notice when the model's framing is wrong because the tests or traces won't match reality. Don't fight this philosophically; fight it empirically.
  *   **Juniors Never Grinding:** You can't simulate "years of grinding" in 1 year. Instead, focus on ensuring their *current* grinding is high-quality. If they are forced to explain the AI's code to merge it, they are grinding, just differently.

  ### 4. The 1-Year Agenda (0.4 FTE Budget)
  *Assign the 2 seniors to rotate as "Tooling & Standards Leads" for 2-week sprints.*

  **Quarter 1: Enforce Observability (Priority 1)**
  *   **Action:** Update PR templates. Merging AI code requires a "Debug Plan" field. "If this logic fails, which log line tells us why?" If they can't answer, the PR is blocked.
  *   **Action:** Seniors audit the top 5 most complex AI-generated modules. Add explicit tracing/logging that a human can read.
  *   **Goal:** No "mystery code" enters main. Every merged PR has a known failure mode.

  **Quarter 2: The "Explain-to-Merge" Protocol (Priority 2)**
  *   **Action:** Implement a random audit. 10% of PRs are selected for a 5-minute "walkthrough." The author must explain the logic *without* reading the code line-by-line (i.e., explain the intent and flow). If they stall, the PR is reverted for "insufficient author understanding."
  *   **Action:** Seniors build a internal "Cheat Sheet" of common AI failure modes for your stack (e.g., "Model tends to hallucinate this specific library function").
  *   **Goal:** Engineers self-correct. They stop merging code they can't explain because they fear the audit.

  **Quarter 3: Calibration Drills**
  *   **Action:** Run "Break-Fix" sessions. Take a piece of AI-generated code, introduce a subtle bug, and time how long it takes engineers to find it using the new observability tools.
  *   **Action:** Review the "Debug Plan" accuracy from Q1. Did the logs they predicted actually help?
  *   **Goal:** Calibrate their confidence. Show them where their understanding was wrong.

  **Quarter 4: Institutionalize**
  *   **Action:** Bake the "Debug Plan" and "Walkthrough" into the definition of done.
  *   **Action:** Seniors document the "AI Handoff Pattern" for future hires.
  *   **Goal:** The team runs on "Ownership of Consequence" by default.

  ### 5. Observable Evidence: What to Track
  Don't track velocity or lines of code. Track **friction** and **recovery**.

  **Green Flags (You're winning):**
  *   **PR Comment Density Increases:** People are asking "Why did the model choose this?" more often. Silence is dangerous; debate is good.
  *   **MTTR (Mean Time To Resolve) Stays Flat or Drops:** Even as AI code % increases, time to fix incidents shouldn't rise. If it rises, you've lost the system.
  *   **"Revert" Rate:** A healthy rate of reverts due to "author couldn't explain" during audits indicates the calibration protocol is working.
  *   **Log Quality:** Log messages become more specific (e.g., changing "Error occurred" to "Retry failed on service X because of Y").

  **Red Flags (You backed the wrong horse):**
  *   **The "LGTM" Epidemic:** Pull Requests get approved with zero comments, especially on complex logic.
  *   **Incident Post-Mortems say "We didn't know how this worked":** If this phrase appears in a root cause analysis, Priority 1 has failed.
  *   **Seniors become Bottlenecks:** If only the 2 seniors can explain the AI code, you haven't solved calibration; you've just centralized risk.
  *   **Tooling Bypass:** Engineers find ways to skip the "Debug Plan" field or treat it as compliance paperwork rather than a thinking exercise.

  ### 6. The Trade-Off
  **You are trading short-term velocity for long-term survivability.**
  Enforcing "Debug Plans" and "Walkthroughs" will slow down merges. Management might complain.
  **Your counter-argument:** "We are preventing 'Technical Bankruptcy.' We can write code fast, but if we can't fix it fast, the speed doesn't matter."

  If you see the Red Flags, drop the "Calibration" work and double down on "Observability." You can survive with a team that needs to study code before fixing it; you cannot survive with a system that cannot be studied.
