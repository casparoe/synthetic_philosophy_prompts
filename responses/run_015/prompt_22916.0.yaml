answer: |-
  You have identified a crucial tension in social choice theory, and your intuition is sharp: if Harsanyi's theorem allows for weighted sums, why can't we capture prioritarianism by simply adjusting the weights?

  The short answer is: **Harsanyi's theorem requires the weights to be fixed constants, independent of the outcome or the utility levels.** If you make the weights sensitive to welfare levels (as prioritarianism requires), you violate the **Independence Axiom** applied to social preferences, which is a necessary condition for the social welfare function to be representable as a von Neumann–Morgenstern (vNM) expected utility function.

  For your graduate seminar, it is vital to distinguish between *weights on persons* (which Harsanyi allows) and *weights on utility levels* (which Harsanyi excludes). Below is a technical breakdown of why this distinction holds and why it matters normatively.

  ### 1. The Technical Constraint: Linearity and Fixed Weights

  Harsanyi's Aggregation Theorem operates within a specific axiomatic framework. Let $u_i$ represent the vNM utility function for individual $i$, and $V$ represent the social vNM utility function. The theorem relies on two primary conditions:
  1.  **Pareto Condition:** If all individuals prefer lottery $L$ to $L'$, society prefers $L$ to $L'$.
  2.  **Social Rationality:** Social preferences over lotteries satisfy the vNM axioms (completeness, transitivity, continuity, and **independence**).

  The mathematical conclusion is that there exist constants $a_1, \dots, a_n \geq 0$ and $c$ such that for all lotteries $L$:
  $$ V(L) = \sum_{i=1}^n a_i u_i(L) + c $$
  Crucially, the coefficients $a_i$ are **constants**. They are determined by the preference orderings themselves, not by the specific outcomes realized in a lottery.

  **Why Welfare-Sensitive Weights Fail:**
  Prioritarianism asserts that the moral value of a utility gain is a concave function of the recipient's welfare level. Formally, a prioritarian social welfare function looks like this:
  $$ W(L) = \sum_{i=1}^n g(u_i(L)) $$
  where $g$ is strictly concave and increasing.

  If you attempt to rewrite this as a weighted sum, it would look like:
  $$ W(L) = \sum_{i=1}^n w_i(u_i) \cdot u_i(L) $$
  Here, the "weight" $w_i$ is a function of the utility level $u_i$. This creates a technical violation of Harsanyi's assumptions for two reasons:

  1.  **Violation of Social Independence:** The vNM Independence Axiom requires that the social ranking of two lotteries depends linearly on the probabilities of outcomes. If the weight assigned to an individual's utility depends on *which* outcome occurs (i.e., how well off they are in that outcome), the social evaluation function becomes non-linear with respect to the probabilities. This means social preferences over lotteries will generally fail to satisfy the Independence Axiom.
  2.  **Cardinal Significance of Zero:** vNM utilities are unique only up to positive affine transformations ($u' = \alpha u + \beta$). A concave transformation $g(u)$ is not affine. To apply $g(u)$, you must fix a specific zero point and scale for utility that carries ethical significance (e.g., "zero well-being"). Harsanyi's theorem treats the vNM scales as given by individual risk attitudes; it does not license the social observer to re-scale or re-curve those utilities based on ethical judgments about levels.

  ### 2. The Conflict of Risk Attitudes

  This is perhaps the most important point for your seminar. Harsanyi's theorem implies that **society must be risk-neutral with respect to individual utilities.**

  *   **Individuals:** By definition, individuals are risk-neutral over their own vNM utilities. (If $u$ is a vNM utility, the individual is indifferent between a sure thing of $u=50$ and a 50/50 lottery of $u=0$ and $u=100$).
  *   **Harsanyi/Social:** Since $V = \sum a_i u_i$, society is also risk-neutral over the sum of utilities.
  *   **Prioritarianism:** Prioritarianism implies **social risk-aversion** over individual utilities. A prioritarian social observer would prefer a sure thing of $u=50$ for everyone over a 50/50 lottery where half get $u=0$ and half get $u=100$, even if the expected utility is the same.

  If you introduce welfare-sensitive weights to mimic prioritarianism, you are effectively asserting that the social observer has a different risk attitude toward individual well-being than the individuals themselves. While this is a coherent ethical position, **it is not licensed by Harsanyi's theorem.** To adopt prioritarianism, you must explicitly reject the assumption that social preferences must satisfy the vNM Independence Axiom over the same domain as individual preferences (or reject the idea that individual vNM utilities are the sole currency of justice).

  ### 3. Ex-Ante vs. Ex-Post (Diamond's Critique)

  The distinction matters because Harsanyi's theorem is fundamentally an **ex-ante** result, while prioritarianism is often motivated by **ex-post** concerns.

  *   **Harsanyi (Ex-Ante):** The Pareto condition is applied to preferences over *lotteries*. If everyone prefers the lottery ex-ante, society must prefer it. This forces the linear aggregation.
  *   **Prioritarianism (Ex-Post):** Prioritarians are often concerned with the distribution of well-being in the *realized* state.

  Peter Diamond (1967) provided a famous counterexample showing that if you want to satisfy equity concerns (like prioritizing the worse off in the realized state), you must violate the Pareto principle over lotteries.
  *   *Example:* Consider two individuals and two states.
      *   Lottery A: Person 1 gets 10, Person 2 gets 0 (50%); Person 1 gets 0, Person 2 gets 10 (50%).
      *   Lottery B: Person 1 gets 10, Person 2 gets 10 (50%); Person 1 gets 0, Person 2 gets 0 (50%).
      *   Both individuals are indifferent between A and B (same expected utility).
      *   A Prioritarian (and many egalitarians) prefers A because it ensures equality in every realized state.
      *   Harsanyi's theorem (via Ex-Ante Pareto) says if individuals are indifferent, society must be indifferent.

  If you allow weights to shift based on who is worse off in the realized state, you are prioritizing the ex-post distribution over the ex-ante Pareto principle. This is a substantive departure from the Harsanian framework, not a parameter adjustment within it.

  ### 4. Summary for Your Seminar

  To be precise in your seminar, you should frame the exclusion as follows:

  1.  **Fixed Weights:** Harsanyi's theorem licenses **weighted utilitarianism** where weights are attached to *agents* ($a_i$), not to *levels of utility*. The weights must be constant across all social states.
  2.  **Linearity:** The social welfare function must be linear in the individual vNM utility functions. Prioritarianism requires a non-linear (concave) transformation of those functions.
  3.  **Axiomatic Cost:** Adopting prioritarianism requires abandoning the **Social Independence Axiom** (meaning social preferences over lotteries do not follow expected utility theory) or abandoning the **Ex-Ante Pareto Principle** (meaning society can override individual preferences over risk to achieve ex-post equity).

  **Conclusion:** Prioritarianism is not "utilitarianism with sophisticated weights" within the Harsanyi framework. It is a structurally distinct aggregation rule that requires rejecting at least one of the core axioms (Social Independence or Ex-Ante Pareto) that Harsanyi uses to derive the linear weighted sum. The distinction is not merely terminological; it marks the boundary between social choice rules that respect individual risk attitudes (Harsanyi) and those that impose a distinct social risk attitude regarding the distribution of welfare (Prioritarianism).

  **Recommended References for Precision:**
  *   **Mongin, P. (1994).** "Harsanyi's Aggregation Theorem: Multi-Profile Version and Unsettled Questions." *Social Choice and Welfare*. (Discusses the fixed weight constraint).
  *   **Adler, M. D. (2012).** *Well-Being and Fair Distribution: Beyond Cost-Benefit Analysis*. (Chapter on Prioritarianism vs. Utilitarianism and the vNM constraints).
  *   **Diamond, P. A. (1967).** "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility." *Journal of Political Economy*. (The classic critique regarding ex-post equity).
  *   **Pivato, M. (2013).** "Risk-free interpersonal comparisons and utilitarianism." (Technical discussion on the linearity constraint).
