answer: |-
  Here are 10 sharp interview questions tailored to your guest's specific theoretical framework, followed by the meta-analysis you requested.

  ### The Interview Questions

  1.  **The Agency Illusion:** You argue that framing the Agricultural Revolution as either a "trap" (Harari) or a "choice" (Graeber-Wengrow) commits the same error: it assumes a unified human agent capable of making a decision. If there was no "we" who decided to farm, what mechanism actually closed the door on foraging? Was it a slow erosion of options or a sudden phase shift?

  2.  **Graeber-Wengrow's Seasonality:** *The Dawn of Everything* relies heavily on archaeological evidence that societies switched seasonally between hierarchy/agriculture and anarchy/foraging. Your "attractor" model suggests irreversibility. At what precise demographic density does the seasonal switch break? Is there a point of no return where the system *cannot* oscillate back, regardless of political will?

  3.  **Diamond's Geography vs. Your Demography:** Jared Diamond argues geography loaded the dice (available crops, axis of civilization). You seem to argue the dice were loaded by population dynamics interacting with variance. If you found a region with perfect domesticable crops but low population pressure, does your theory predict they *wouldn't* farm? How do you disentangle your demographic attractor from simple environmental determinism?

  4.  **The Malthusian Ghost:** You invoke a Malthusian ceiling to drive the attractor, but Malthusianism usually requires a conscious actor trying to maximize reproduction. If you reject unified human agency, what is doing the "pressing" against the ceiling? Is it blind evolutionary fitness, or a systemic feedback loop that operates independently of human desire?

  5.  **The "Complexity Science" Charge:** A critic could say this is just complexity science with a history label—using terms like "attractors" and "stochasticity" to dress up standard historical materialism. What is one specific empirical prediction your framework makes about the Neolithic that standard historical materialism or cultural evolution theory gets *wrong*?

  6.  **The Exception Problem:** If agriculture is a stochastic attractor, it should emerge independently wherever the system parameters align. How do you handle the outliers—societies that had the demographic pressure and the crops but *resisted* farming for millennia, like the Aboriginal Australians or certain Pacific Northwest groups? Was that stochastic variance or a different attractor entirely?

  7.  **Irreversibility:** You call the shift "irreversible." But we have examples of agricultural collapse (e.g., the Norse in Greenland, Classic Maya). Did those societies revert to the previous attractor state, or did they simply crash into a new, lower-energy basin? What distinguishes a "collapse" from a "return" in your model?

  8.  **Climate Fatalism:** If history is driven by demographic attractors rather than conscious adaptation, does that make our current climate crisis fatalistic? Are we merely sliding toward the next stable state (collapse or techno-authoritarianism) regardless of policy? Is "saving the planet" in your view a category error similar to "choosing agriculture"?

  9.  **Moral Responsibility:** If the Agricultural Revolution wasn't a choice, we can't morally blame the early farmers for the ensuing hierarchy and disease. But if our current trajectory is also an attractor state, does this absolve modern actors of responsibility? Does your theory drain history of its moral content?

  10. **The Philosophical Payoff:** Finally, if you succeed in displacing the "Choice vs. Trap" narrative with "Stochastic Attractor," how does that change how we teach history? Do we stop teaching the "Great Men" and start teaching phase transitions? What is the practical utility of removing agency from the human story?

  ***

  ### Meta-Analysis: Critique of Your Prep

  #### What would change my mind about whether these questions land?
  1.  **If she softens the "No Agency" claim:** If she clarifies that she doesn't mean *zero* agency, but rather *bounded* agency, Question 1 and 4 might feel like strawman attacks. You need to be ready to pivot if she says, "Individuals choose, but the systemic outcome is invariant."
  2.  **If "Stochastic Attractor" is a metaphor, not a model:** If she admits this is a philosophical heuristic rather than a mathematical or demographic model, Question 5 (about empirical predictions) could backfire and make you look like you're demanding physics from philosophy. You should verify if she uses actual modeling (agent-based simulations, etc.) before asking for empirical predictions.
  3.  **If she aligns closer to Harari than you think:** Yuval Noah Harari's argument in *Sapiens* regarding the Agricultural Revolution is actually quite close to a demographic trap ("luxury trap"). He argues wheat domesticated humans, not vice versa. If she acknowledges this, Question 1 needs to shift from "Harari says choice" to "Harari says trap, but you say *inevitability*."

  #### Where your reasoning about her view is shakiest
  1.  **The Harari Distinction:** You characterize Harari's view as a "Cognitive-Revolition story" regarding the Agricultural Revolution. This is slightly off. Harari's Cognitive Revolution explains *why* humans could cooperate, but his explanation for the Ag Rev is specifically a **demographic trap** (population growth forces more food production, which forces more population growth). Her theory might actually be a *refinement* of Harari's materialist argument, not a total opposition. You risk fighting a ghost if you frame Harari as purely "idealist" here.
  2.  **Diamond's Determinism:** You ask to distinguish her from Diamond's geographic determinism. However, demographic pressure is often a *function* of geography (carrying capacity). The line between "geography determines carrying capacity" and "demography hits carrying capacity" is very thin. Be prepared for her to say Diamond is right about the *conditions*, but wrong about the *mechanism* (geography vs. stochastic demographic feedback).
  3.  **Fatalism vs. Attractors:** You assume an "attractor" implies fatalism (Question 8). In complexity theory, systems can have *multiple* attractors, and small stochastic shocks can flip a system from one basin to another (e.g., from "high carbon" to "low carbon"). Her theory might actually argue *for* the power of small interventions to shift the attractor, rather than fatalism. Be careful not to box her into a "doomer" corner if her math suggests otherwise.
  4.  **The Term "Stochastic Attractor Theory":** This is not a standard, widely recognized term in historiography or complexity science (unlike "Complex Adaptive Systems" or "Cliodynamics"). It is likely her own branding. Treat it as her specific conceptual framework rather than an established school of thought she is merely defending. This gives you more license to challenge the definition itself.
