  ### Part 1: The Logical Separators
  Before the code, here are the five binary switches that actually drive the disagreement. These are the "separators" you asked for.

  1.  **Semantic Validity:** Is "consciousness" a well-defined property we can detect, or is it a vague label like "soul"?
  2.  **Binary vs. Graded:** Is consciousness a switch (on/off) or a dimmer (degrees)? *Crucial for your config schema.*
  3.  **The Human Anchor:** Do we trust behavioral pain responses (screaming, withdrawing) in humans who can't speak (infants, dementia)? If no, behavior is useless evidence.
  4.  **Substrate Neutrality:** Does the physical stuff matter? If we copy a brain into code, is the code conscious?
  5.  **Phylogeny vs. Function:** Do we protect animals because of what they *are* (backbones, cortexes) or what they *do* (avoid harm, groom injuries)?

  ### Part 2: The Decision Tree (Config Logic)
  **Constraints:** 7 Branch Nodes (Max 8), 6 Leaves (Min 6).
