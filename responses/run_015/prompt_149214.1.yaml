  I assign a 20% credence that the Rietdijk-Putnam argument successfully proves eternalism, siding closer to your skepticism than your friend's confidence. The argument relies on a metaphysical leap that Special Relativity's mathematics alone cannot justify.

  2. The three terms
  (a) 0.85: Special Relativity mathematically eliminates absolute simultaneity, and most physicists treat this as ontologically significant rather than merely observational.
  (b) 0.70: Yes, the argument likely commits a modal fallacy by equating the relativity of coordinate simultaneity with the ontological status of events.
  (c) 0.80: Presentism is sufficiently coherent to serve as a meaningful target, despite tensions with relativistic physics.

  3. How they combine
  To calculate the argument's success, I treat (a) and (c) as necessary conditions that support the conclusion, but I treat (b) as a defeater that must be false for the argument to hold. Therefore, I multiply the probability of (a) and (c) by the probability that (b) is *false* (0.30), yielding roughly 0.85 × 0.30 × 0.80 ≈ 20%. This low number reflects that even if SR is ontologically serious and Presentism is coherent, the logical bridge between them remains broken.

  4. Where we probably split
  You and your friend most likely disagree on term (b), regarding whether the argument invalidly slides from epistemic constraints to ontological claims. Your friend likely assumes that relativity of simultaneity necessitates a block universe, while you suspect that "what is real" might remain frame-independent despite disagreements on "what is now." This single premise determines whether the mathematical formalism of SR translates into metaphysical eternalism.

  5. The shakiest link and what evidence would move your credence
  My final number is most sensitive to term (b), because it acts as a multiplier where small changes drastically alter the success probability. I would significantly raise my credence if a philosopher produced a rigorous derivation showing that ontological reality must be frame-dependent without assuming simultaneity equals existence. Until that link is fortified, the argument remains a persuasive intuition pump rather than a proof.
