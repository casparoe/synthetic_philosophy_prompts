answer: |-
  This is a sophisticated, consequentialist framework. It attempts to bypass the "culture war" binary of *erase history* vs. *honor heroes* by anchoring the decision in material justice. It's a "harm principle" applied to public memory.

  However, like any principle that relies on causal links between the past and the present, it faces significant philosophical and practical stress tests. Here is an analysis of the defeaters, sorted by severity, followed by an honest assessment of the unfalsifiability risk.

  ### 1. Fatal Defeaters (Conceptual Collapses)
  These are arguments that, if accepted, dissolve the distinction your rule relies on, rendering the "active-harm" criterion meaningless or self-contradictory.

  **A. The "Symbolic Harm is Active Harm" Objection**
  *   **The Argument:** You distinguish between *institutional* harm (laws, economics) and *symbolic* harm (feelings, representation). But if a statue of a slaver stands in a Black neighborhood, and residents report feeling targeted, unwelcome, or psychologically distressed by it, is that not **active harm**?
  *   **Why it's Fatal:** If psychological alienation or the signaling of second-class citizenship counts as "active harm," then almost any statue of a controversial figure could qualify for removal, regardless of institutional legacy. The "institutional" guardrail you built to prevent "presentist vandalism" collapses because the statue *itself* becomes the instrument of harm.
  *   **Concession Required:** You would have to explicitly exclude psychological/symbolic harm from your definition of "active harm." But doing so makes your view seem coldly materialist, ignoring the actual lived experience of the people the statues offend.

  **B. The Unfalsifiability Trap (The "Baked In" Problem)**
  *   **The Argument:** You asked this directly, and it is the strongest philosophical critique. In social science, almost every present disparity can be traced back to some historical policy. The wealth gap? Slavery and redlining. Policing disparities? Jim Crow and war on drugs.
  *   **Why it's Fatal:** If "baked in" allows for long causal chains (e.g., "This general fought for slavery -> slavery caused wealth gaps -> wealth gaps exist today -> therefore the general causes active harm"), then **every** Confederate statue comes down. If your rule leads to the same outcome as the "presentist vandalism" view you reject, the distinction is illusory.
  *   **Concession Required:** You must define a "statute of limitations" on causality or a threshold of directness. (e.g., "The law must still be on the books" or "The institution must be directly named after them"). If you don't, the rule is just a post-hoc rationalization for whatever removals you already support.

  ### 2. Serious Defeaters (Entangled Cases)
  These cases don't necessarily break the logic, but they force you into counter-intuitive positions that weaken the moral appeal of the view.

  **A. The "Repealed Policy, Living Scar" Case**
  *   **The Scenario:** A figure wrote laws enforcing segregation. Those laws are repealed. However, the neighborhood segregation they engineered remains due to property values and school districts.
  *   **The Tension:** Is the harm "past" (the law is gone) or "active" (the segregation remains)?
  *   **Why it's Serious:** If you say "keep the statue" because the law is repealed, you ignore that the *effect* of the figure's action is the primary driver of current inequality. If you say "remove the statue," you admit that "active harm" includes structural inertia, which brings you back to the Unfalsifiability Trap.
  *   **Concession:** You'd likely have to concede that *structural continuity* counts as active harm. This is a defensible tweak, but it requires robust sociological evidence for every statue, making the rule administratively difficult.

  **B. The "Public Honor as Active Endorsement" Objection**
  *   **The Argument:** A statue in a public square is not a history book entry; it is an act of ongoing honor. By maintaining the statue, the state is *actively* endorsing the figure. If the figure committed atrocities, the state is *actively* complicit in valorizing those atrocities, regardless of whether the specific laws are still enforced.
  *   **Why it's Serious:** This shifts the harm from the *figure's legacy* to the *current government's action*. The harm isn't what the figure did 150 years ago; it's what the City Council is doing *today* by keeping the statue up.
  *   **Concession:** You would have to argue that public honor is neutral. That is a hard sell. Most political philosophers agree public monuments are normative (they tell us who to admire). If honoring a harm-doer is itself a harm, your rule fails.

  ### 3. Awkward Defeaters (Practical & Epistemic)
  These are problems that make the rule hard to apply, but don't necessarily prove it wrong.

  **A. The "Mixed Legacy" Problem**
  *   **The Scenario:** George Washington or Thomas Jefferson. They built institutions (democracy, constitution) that protect people now (active good) but also entrenched slavery (active harm legacy via wealth gaps).
  *   **The Tension:** Does the active harm outweigh the active benefit? Your rule doesn't have a calculus for net utility.
  *   **Awkwardness:** Strict application might demand removing founders of the very democracy allowing you to debate the rule. You'd have to introduce a "net benefit" clause, which complicates the clean "active-harm only" binary.

  **B. The Epistemic Burden**
  *   **The Scenario:** Proving that *this specific statue* contributes to *that specific harm* is incredibly difficult.
  *   **The Tension:** Does a statue of Robert E. Lee in Texas actually cause economic disparity in 2024? Or is it just a rock?
  *   **Awkwardness:** If you require proof of causation, almost no statues will ever come down because social causation is murky. If you don't require proof, the rule becomes arbitrary.

  ### Is This Unfalsifiable? (The Honest Assessment)

  **Yes, it is at high risk of being unfalsifiable.**

  Here is why that is a problem: A rule is useful if it can tell you when *not* to do something.
  *   If "baked in" means "direct legal continuity," the rule is falsifiable, but it becomes too narrow (almost nothing qualifies, because most explicit discriminatory laws are repealed).
  *   If "baked in" means "structural/cultural legacy," the rule is morally robust, but it becomes unfalsifiable (because almost all Western history is baked into current structures).

  **The Danger:**
  If you find yourself saying, "This statue stays because the harm isn't active," but then for another statue you say, "This one goes because the wealth gap is active harm," without a clear, pre-defined metric for what counts as "active," you aren't using a rule. You are using a **rhetorical shield**. You are retrofitting the definition of "active" to match your intuition about each specific figure.

  **How to Save It:**
  To make this a genuine principle rather than a rationalization, you must pre-commit to a definition of "active harm" that you might not like in specific cases.
  *   *Example:* "Active harm means the specific policy they championed is still codified." (You might hate this because it saves too many racists).
  *   *Example:* "Active harm means measurable statistical disparity directly linked to their tenure." (You might hate this because it's impossible to prove).

  ### Summary of Concessions

  1.  **To avoid Fatal Defeat:** You must concede that **symbolic alienation** counts as harm, OR you must rigidly define "harm" as purely material/legal. If you choose the latter, you risk moral irrelevance. If you choose the former, your "institutional" constraint vanishes.
  2.  **To avoid Unfalsifiability:** You must define the **causal proximity** required. How many degrees of separation between the figure and the current pain are allowed? If you can't define this, the rule explains everything and nothing.
  3.  **To handle Entanglement:** You must admit that **structural inertia** (repealed laws with lingering effects) counts as "active." If you don't, the rule ignores the reality of systemic injustice.

  **Verdict:** The "Active-Harm Only" rule is a strong heuristic for prioritizing resources (fix the laws before the statues), but it fails as a moral absolute for *retention*. It cannot easily distinguish between a statue that *causes* harm and a statue that *memorializes* a cause of harm without collapsing into either unfalsifiability or moral blindness.
