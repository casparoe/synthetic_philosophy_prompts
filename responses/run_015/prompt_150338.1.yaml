answer: |-
  # Joint Statement on the Utility Monster and Aggregation
  **Signed:** [The Aggregator] and [The Separatist]

  ## I. Agreed Claims

  1.  **Formalism of the Case:** We agree on the formal description of the resource allocation problem. There is a fixed stock of a perfectly divisible resource. Welfare is cardinally measurable and interpersonally comparable on a scale both sides accept. For all ordinary recipients, welfare is a strictly concave, increasing function of the share received (meaning each additional unit of resource yields less welfare than the previous one). There exists one "monster" recipient whose welfare function is linear with a slope of $k$, where $k > 1$. This rate is intrinsic, stable across scales, known with certainty, and not a product of earlier transfers.
  2.  **The Low-$k$ Verdict:** In the case where $k \approx 1.2$, involving two groups of patients and a fixed budget of scarce therapy, we agree on the verdict: resources should be allocated to the group with the greater capacity to benefit. We agree this does not constitute a violation of the claims of the lower-capacity group, provided the difference in capacity is genuine and not the result of prior unjust treatment.
  3.  **The High-$k$ Divergence:** In the case where $k$ is in the hundreds or thousands, with one monster and a very large population of ordinary recipients, we agree on the divergence of our verdicts. The Aggregator holds that the resource must be transferred to the monster until the ordinary recipients are reduced to subsistence or zero welfare, provided the monster's marginal gain exceeds their marginal loss. The Separatist holds that such a transfer is impermissible, regardless of the aggregate sum, because the loss to the many cannot be justified solely by the gain to the one, however large.
  4.  **Nomological Impossibility:** We agree that if the monster case were proven nomologically impossible (i.e., if such conversion rates could not exist in any possible world consistent with physical and psychological law), the force of the case as a *reductio ad absurdum* of aggregation would be significantly diminished, though not eliminated. However, we agree that conceptual possibility is sufficient for the ethical test; the case functions as a stress test for the consistency of our principles, not as a policy proposal for actual resource distribution.
  5.  **Scope of the Disagreement:** We agree that the disagreement is not about the measurement of welfare in the Low-$k$ case, nor about the mathematical properties of concavity. The disagreement concerns whether the *magnitude* of the aggregate gain can ever outweigh the *separateness* of the persons bearing the losses, and if so, at what threshold of $k$ or population size this occurs.

  ## II. Residual Disagreements

  | Disputed Proposition (Neutral) | Aggregator Formulation | Separatist Formulation |
  | :--- | :--- | :--- |
  | **1. The High-$k$ Obligation** | In the High-$k$ case, we are morally required to maximize the sum of welfare. Since the monster converts resources more efficiently, justice demands we feed the monster, even if others starve. To do otherwise is to waste moral value. | In the High-$k$ case, we are morally prohibited from imposing severe deprivation on many to sustain the elevated state of one. The monster's efficiency does not generate a claim strong enough to override the basic claims of the many to a sufficient share. |
  | **2. The Principle Linking Low-$k$ and High-$k$** | The principle is the same in both cases: maximize total welfare. The Low-$k$ case is a standard instance of efficiency; the High-$k$ case is merely a more extreme instance of the same logic. The difference in intuition is a psychological bias against large numbers, not a moral boundary. | The principles are distinct. The Low-$k$ case is permissible because the losses are small and the gains are distributed among a group (or the loss is trivial). The High-$k$ case triggers a constraint against *imposition* that is not triggered by marginal efficiency gains in triage. There is a threshold where aggregation stops counting. |
  | **3. The Curable Monster** | If the monster's elevated rate is a pathology curable by a cheap, consensual intervention that lowers total welfare, we must forbid the cure. To cure the monster is to destroy value. The source of the welfare (pathology or not) is irrelevant to its moral weight. | If the monster's elevated rate is a pathology, we may be permitted or even required to support the cure, even if it lowers total welfare. The "welfare" generated by a pathology does not carry the same justificatory weight as welfare generated by normal functioning, or the integrity of the person outweighs the aggregate sum. |
  | **4. The Contaminated Monster** | If the monster's rate falls to one under voluntary transfer, we cease transferring resources. This is not because consent is a fundamental constraint, but because the *efficiency* vanishes. The constraint is instrumental, not deontological. | If the monster's rate depends on non-consensual taking, the transfer is impermissible because it violates the requirement of justifiability to the bearer. The drop in efficiency confirms the moral intuition, but the violation of consent is the primary wrong, independent of the welfare loss. |

  ## III. Cruxes

  We identify the following sub-questions as cruxes. Settling these would move at least one of us toward the other's position. For each, we record the shared evidentiary basis and our opposing predictions.

  **1. The Dispersed Reformulation**
  *   **The Test:** Hold the aggregate gain and aggregate loss fixed. Instead of one monster receiving a huge share, realize the gain through a very large number of slightly above-average recipients (each with a slightly higher conversion rate than the ordinary baseline, but none monstrous).
  *   **Shared Evidence:** The total welfare sum and the total resource cost are identical to the High-$k$ Monster case.
  *   **Aggregator Prediction:** The Separatist will approve the Dispersed case while rejecting the Monster case. This will reveal that the Separatist's objection is to *concentration* of advantage, not aggregation itself. If they reject both, they are consistent but must explain why the Low-$k$ triage is acceptable.
  *   **Separatist Prediction:** We will approve the Dispersed case. This confirms that the objection is not to the sum, but to the *structural relationship* where one individual's claim swallows the claims of others. Aggregation is acceptable when gains are distributed; it fails when gains are monopolized.

  **2. The Endogenous Monster**
  *   **The Test:** The monster's conversion rate rises with the size of its share (increasing returns to scale), such that there is no interior optimum where marginal returns equalize. The Aggregator's usual stopping rule (equalize marginal welfare) never engages; the solution is always a corner solution (all to the monster).
  *   **Shared Evidence:** The mathematical structure prevents the "diminishing returns" check that usually limits aggregation in standard economics.
  *   **Aggregator Prediction:** This strengthens the Aggregator's case. If the technology of welfare production is genuinely increasing, justice demands we exploit it. To stop is to accept a lower moral ceiling.
  *   **Separatist Prediction:** This strengthens the Separatist's case. It demonstrates that Aggregation, unchecked by concavity, leads inevitably to tyranny. If a moral theory requires a specific empirical condition (concavity) to avoid absurdity, the theory is unstable.

  **3. The Curable Monster**
  *   **The Test:** A cheap, permanent, fully consensual intervention removes the pathology, lowering the monster's rate to 1 and reducing total welfare.
  *   **Shared Evidence:** The intervention is consensual (no rights violation in the act of curing) and reduces the total sum of welfare.
  *   **Aggregator Prediction:** The Separatist will endorse the cure. This proves the Separatist is not truly concerned with "separateness" or "imposition," but with equality or normalcy. It shows they are willing to destroy value to achieve a distributional pattern.
  *   **Separatist Prediction:** The Aggregator will forbid the cure. This proves the Aggregator views persons as mere vessels for welfare. If the Aggregator endorses the cure, they admit that welfare is not the only currency of value.

  **4. The Contaminated Monster**
  *   **The Test:** The monster realizes its elevated welfare *only* from resources taken without consent. Under voluntary transfer, its rate falls to 1.
  *   **Shared Evidence:** The welfare sum is maximized only by violating the Separatist's constraint on justifiability.
  *   **Aggregator Prediction:** This shifts the debate to the definition of welfare. If the "welfare" depends on a wrongful act, it may not count as genuine welfare. We agree to exclude it, but this is a technical fix to the currency, not a concession on aggregation.
  *   **Separatist Prediction:** This confirms that the Monster case was never about aggregation, but about the *source* of the welfare. If the rate drops without coercion, the "Monster" disappears. This suggests the original case smuggled in a rights violation that did the heavy lifting, not the math of aggregation.

  ## IV. Closing Assessment

  **Verbal and Orthogonal Disputes**
  We identify a significant portion of our past decade of debate as verbal or orthogonal to the core problem of aggregation.
  1.  **The Currency of Welfare:** The "Contaminated Monster" suggests we agree more than we thought. If welfare derived from rights-violations does not count, the High-$k$ case collapses. We agree to investigate whether "welfare" must be defined independently of the justice of its production. If so, the Monster is a dispute about definition, not aggregation.
  2.  **Institutions vs. Criteria:** We agree that a *criterion of rightness* (what makes an act right) may differ from *institutional mandates* (what rules we should codify). The Aggregator may accept that institutions should not feed monsters due to epistemic limitations, while maintaining that the *ideal* act is to feed them. The Separatist may accept that in emergency triage (Low-$k$), we should aggregate, while maintaining that the *fundamental principle* is not aggregative. Much of our heat stemmed from conflating ideal theory with non-ideal implementation.

  **The Reductio Framing**
  We agree that framing the Monster case as a *reductio ad absurdum* of aggregation has been unproductive. For the Aggregator, the verdict is not absurd; it is demanding. For the Separatist, the verdict is not just counterintuitive; it is unjust. The case does not disprove aggregation; it forces a choice between the *demandingness* of morality (Aggregator) and the *restrictiveness* of morality (Separatist). We acknowledge that the "absurdity" relies on a shared intuition about sufficiency that was previously unstated.

  **Falsification Conditions**
  Finally, we state what would count as evidence against our own views:
  *   **For the Aggregator:** If it can be demonstrated that respecting the Separatist's constraint in the High-$k$ case leads to better long-term welfare outcomes (e.g., by preserving the cooperative schemes that generate welfare) even from a total-welfare perspective, the Aggregator must adopt the constraint instrumentally. More fundamentally, if the "Curable Monster" intuition proves robust upon reflection—that destroying value is right to cure pathology—the Aggregator must abandon total-welfare consequentialism.
  *   **For the Separatist:** If the "Dispersed Reformulation" elicits the same moral revulsion as the Concentrated Monster, the Separatist must admit the objection is to the *sum of losses* rather than the *concentration of gains*. This would force the Separatist to adopt a form of prioritarianism or sufficientarianism that looks functionally identical to aggregation below a threshold, collapsing the distinctiveness of the Separatist view. Furthermore, if the Separatist cannot justify the Low-$k$ triage without invoking aggregate benefits, they must explain why aggregation is valid for small numbers but invalid for large ones without appealing to arbitrary thresholds.

  We sign this statement not to declare the dispute resolved, but to locate the disagreement precisely enough that further argument may finally advance the field.
