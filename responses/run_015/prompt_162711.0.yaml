answer: |-
  You should vote that this constitutes an integrity violation. To remain consistent with your track record, you cannot treat this as permissible.

  The closest analog is the procurement officer (Case 1). In both instances, an official utilized their position to confer a competitive advantage upon a connected group (family/community) despite procedural safeguards (recusal/declaration). In Case 1, the brother-in-law's inclusion on the shortlist was the advantage; here, the workshops using foundation branding and premises were the advantage. The Mayor (Case 5) is a secondary analog: both involve steering public resources toward a specific section (voters/refugees) using office discretion, regardless of personal enrichment.

  Your first proposed rule—*office resources or discretion deployed for the advantage of a section rather than for the purposes of the office*—best predicts your past verdicts. It captures Cases 1, 3, and 5 (Corrupt) while excluding Cases 2 and 4 (Not Corrupt), where no office resource was misused to alter an outcome; the nurse's payments were private, and the headman's goat was customary symbolism without resource diversion. Your rival rule—*benefits distributed by connection rather than impartial criteria*—is weaker. It fails to explain Case 3 (the engineer's village benefit was not necessarily based on "criteria") and struggles here, because the final scoring *was* impartial. The violation occurred upstream: the criteria were applied impartially, but the capacity to meet them was sectionally subsidized using office assets.

  By ruling this corrupt, you affirm a principle of **impartiality of opportunity**, not merely impartiality of outcome. You are committing the panel to the view that public office must not be used to tilt the playing field, even if the final judgment is clean. This does risk smuggling in a Western ideal of impersonal administration. Cases 2 and 4 show you accommodate local custom where outcomes are unaffected. However, here the outcome *is* affected (75% of grants to one community). Distinguishing between permissible community mutual aid and impermissible institutional capture is difficult. If you rule "Not Corrupt," you validate community capacity-building but commit to allowing panel members to use foundation assets to organize their own constituencies, effectively institutionalizing patronage. If you rule "Corrupt," you protect the foundation's neutrality but potentially penalize marginalized groups who rely on internal networks to access complex bureaucracies.

  The further case that best discriminates between the live rules is this: *A panel member uses their own personal money and time to run application workshops off-site, without using foundation branding, but still recruits only from their community.* Under the "Office Resources" rule, this is **Not Corrupt** (no public asset misused). Under a stricter "Impartial Opportunity" principle, it might still be **Corrupt** (insider knowledge creates unfair advantage). Your track record suggests the former would be permissible (like the Nurse), provided no office resource is touched.

  I would move to the opposite ruling ("Not Corrupt") if you could establish that the foundation's premises were freely bookable by any applicant group and the branding usage was incidental rather than endorsatory. If the room was effectively a public good available to all, but only this community knew how to book it, the fault lies in communication, not corruption.

  My reasoning is most likely to break down on the definition of "resources." You treat branding and premises as neutral assets, but in development contexts, foundation branding confers legitimacy that is itself a resource. If you rule this corrupt, you must define where "capacity building" ends and "insider trading" begins.

  The empirical assumption you must check before Monday is whether the foundation's booking logs show other community groups were denied access to the premises or branding during that period. If the room was empty and available, the "misuse" is less clear. If it was booked exclusively for her via internal privilege, the verdict stands. Your precedents rule out a strict "private gain" definition (Cases 1, 3, 5), but they do not yet define whether "sectional gain" without "outcome manipulation" (since scoring was clean) is sufficient for corruption. I argue it is, based on Case 1. The shortlist itself was the corruption there; here, the workshop was the shortlist.
