      *Let's focus on the "Grundrisse" accusation.* The user says Marx admitted LTV comes apart. Marx should say: Yes, it comes apart, and that is why capitalism dies. It doesn't mean profit comes from elsewhere; it means profit becomes impossible. The current profit is a lagging indicator.

      *Wait, constraint:* "Use only the tools you actually had." So I can't talk about "rentier capitalism" too much unless framed as monopoly profit/redistribution. I need to stick to c, v, s, SNLT.

