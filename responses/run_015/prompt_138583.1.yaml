      *   *Address the Grundrisse:* That fragment isn't an admission of defeat; it's a prophecy of crisis. If labour time is no longer the measure, *value* production ceases, and thus *capital* ceases. Capitalism cannot survive its own success here. The profit you see is a ghost, a financial claim on future value that may not materialize, or a redistribution from sectors still steeped in misery.
      *   *Address the cheapening machinery:* Yes, machinery cheapens because less labour is needed to produce it. This raises the rate of profit temporarily (countertendency) but increases the organic composition overall in the long run.
      *   *Question:* Need to know about the ownership of the software/robots. Are they proprietary? Who produces the energy?

