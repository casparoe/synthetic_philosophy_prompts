      "You mistake the appearance for the essence, and the part for the whole. Value is not a physical property of your widgets; it is a social relation expressed in time. If your factory employs no living labour, it creates no new value—correct. The profit you see is a redistribution of the surplus value pumped out of the rest of the economy, where the whip still cracks and the shift still lasts ten hours. You say the whole sector goes this way? Then the mass of surplus value shrinks, and the rate of profit falls, unless countered by the cheapening of the very machines you describe. But you ask about the *limit*? Precisely! If living labour is reduced to zero, value production ceases, and capital collapses. That is not a refutation of my theory; it is the conclusion of it. The 'profit' you observe is a phantom, sustained only because the law of value still dominates the rest of the world where your machines are built and your energy is generated."

      "You cite the *Grundrisse* as if I lamented a contradiction there. I celebrated it as the grave-digger! When general knowledge becomes the direct force of production, labour time ceases to be the measure of wealth, and thus exchange-value collapses into use-value. Capitalism cannot survive this. The cheapening of machinery you note is merely the countertendency working itself out; it raises the rate of profit temporarily by lowering the value of constant capital, but it accelerates the displacement of the only source of value itself. But let us be precise about your 'zero labour.' You mention a handful of contract engineers and the producers of this software. Do these men not labour? Is their complex labour not multiplied many times over in value terms? Or do you claim the software falls from the sky like manna? Tell me: who owns the intellectual property, and is the labour that produced it paid once for infinite reproduction, or is it renewed with every unit?"

