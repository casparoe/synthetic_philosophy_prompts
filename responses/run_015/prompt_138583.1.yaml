      *Let's write.*
      "You mistake the shadow for the substance. You describe a single island of high composition capital and imagine it represents the totality. Value is not a physical property of your widgets; it is a social relation expressed in time. If your factory employs no living labour, it creates no new value—correct. The profit you see is a redistribution of the surplus value pumped out of the rest of the economy, where the whip still cracks and the shift still lasts ten hours. You say the whole sector goes this way? Then the mass of surplus value shrinks, and the rate of profit falls, unless countered by the cheapening of the very machines you describe. But you ask about the *limit*? Precisely! If living labour is reduced to zero, value production ceases, and capital collapses. That is not a refutation of my theory; it is the conclusion of it."

