  2.  **Deconstruct Machiavelli's Claims (as listed by user):**
      *   Fortune arbiter of half, us the other half.
      *   Fortune as a violent river (damnable when calm, destructive when flooding).
      *   Fortune favors the bold/young (less cautious, more ferocious).
      *   *Virtù* meets occasion; occasions do not wait.
      *   Same procedure succeeds or ruins depending on times; man cannot change nature; therefore success turns to failure when times shift.

  3.  **Deconstruct Poker Vocabulary (as listed by user):**
      *   Variance, edge, EV, playing well vs. running well, sample size, long run, bankroll, risk of ruin, game/table selection, reading player pool, balanced vs. exploitative, studying, moving stakes, taking shots, tilt/temperament, games getting tougher/unbeatable.

  4.  **Drafting the Translation (Mental or Scratchpad):**
      *   *Fortune = Variance + Game Conditions.* It's not just luck; it's the external environment.
      *   *Virtù = Skill + Adaptability + Will.* Not just "edge." It's the capacity to impose form on matter.
      *   *Half/Half:* EV vs. Variance. But Machiavelli means agency vs. external constraint. In poker, you control decisions, not outcomes.
      *   *River:* Variance management. When variance is low (calm), you build bankroll (dam). When variance spikes (flood), you might go broke despite good play.
      *   *Bold/Young:* Aggression. But Machiavelli means impetuosity vs. caution. In poker, tight is often tight, but aggressive lines win pots. However, "young" implies something about risk tolerance relative to lifespan/legacy.
