      *   *Check:* Did I address the "Fixed Nature" claim accurately? Machiavelli says you *can't* change. Poker says you *must*. This is the biggest conflict. I need to explain *why* Machiavelli thinks you can't (habit, temperament) vs. poker pros who pride themselves on adjustment.
