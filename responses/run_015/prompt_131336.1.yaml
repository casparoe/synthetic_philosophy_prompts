  *(Self-Correction on "Fixed Nature"):* Machiavelli argues that because you cannot change your nature, and times change, you will eventually fall. The only way to succeed is if your nature fits the times. In poker, we believe we can adjust. But maybe at a deeper level, a player's fundamental temperament (tilt control, risk aversion) is fixed. That's a good bridge.

  *(Self-Correction on "Virtù"):* Avoid saying "Virtù is edge." Say "Virtù is the capacity to generate edge where none exists through force of will/structure."

