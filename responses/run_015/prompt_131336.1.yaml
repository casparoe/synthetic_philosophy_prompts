      *   *Failures:* The "Fixed Nature" claim. Poker requires adaptation. Machiavelli says princes are stuck. Why? Because states are harder to change than strategies. Also, poker is repeated trials (long run), Machiavelli's politics is often one-shot (war, founding).
      *   *Falsities:* "Boldness rewarded." In poker, reckless aggression = 0 EV. In Machiavelli, audacity can shock fortune into submission. Is this false in Machiavelli? He says *impetuosity* works better than caution *because* fortune is a woman who yields to force. This is metaphorical, not EV.

