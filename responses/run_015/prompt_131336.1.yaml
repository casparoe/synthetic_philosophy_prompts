          3.  Analyze *why* it fails (narrower case? repeated trials vs. one-offs? conceptual confusion?).
          4.  Address apparent falsities (e.g., "boldness is rewarded," "fixed style must break") – is it translation error or Machiavelli's actual claim?
          5.  **Constraint:** Write in continuous prose (email style). No headings, bullets, bold text, or tables.
          6.  **Constraint:** Do not quietly import poker assumptions into Machiavelli (e.g., don't just say *virtù* = edge). Preserve the theatrical, moral, and legacy aspects of *virtù*.
