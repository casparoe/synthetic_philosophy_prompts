      *   *Decision:* I will recommend rejecting **Step (1)**. It is the linchpin. It defines fairness as an impossible conjunction. By redefining fairness as "satisfying the *relevant* criterion," the impossibility theorem becomes a guide for *choice*, not a proof of *futility*. This saves the audit (we audit for the chosen criterion) and saves the banding (if calibration is the chosen criterion).

