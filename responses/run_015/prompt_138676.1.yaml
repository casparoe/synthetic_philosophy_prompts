prompt: |-
  I'm putting together a seminar on social norms and I want to use Dagen H as the worked case for Lewis on convention — Sweden's switch from left- to right-hand traffic, 3 September 1967, 5am. I want the analysis, not the history, and I want it before I commit to it on a syllabus, so please be opinionated.

  Facts as I have them, so nothing turns on your knowing them: all of Sweden's neighbours drove on the right, with roughly 5 million vehicle crossings a year; more than 90% of Swedish cars were already left-hand-drive, which made overtaking on two-lane roads genuinely dangerous; in a consultative referendum in 1955 something like 83% voted to keep driving on the left; the Riksdag went ahead anyway in 1963, set the date four years out, and ran a four-year campaign — signange, milk cartons, a song contest; on the day, non-essential traffic was banned 1am to 6am and drivers were told to stop, edge over to the right, stop again, then proceed. Accidents fell sharply and were back to roughly the old level within a couple of years. Railways and the Stockholm metro never switched.

  What I want, in three parts. First, a disciplined mapping: who is the population here, what exactly is the recurring coordination problem, which are the equilibria, and where does arbitrariness go when the vehicle fleet and the road layout aren't up for grabs? Second, the claim I actually want to defend: that Lewis gives you a theory of convention-maintenance but no theory of convention-displacement. My fix is to split a convention's *grip* — what it costs one person to deviate while everyone else stays put — from its *depth* — how much of the surrounding payoff structure has been rebuilt around it: fleet, signage, intersections, muscle memory. High grip with shallow depth looks immovable and may be cheap to move if you can synchronise; Dagen H is my evidence, and the metro is my control case. Tell me if that's right, and whether it's an addition to Lewis or just Lewis relabelled. Third, say where Lewis goes silent: are Swedes driving on the right after 1967 *by convention*, or by law plus self-preservation, and can you give me a test that distinguishes them? And give me the best account you have of why 83% voting to keep left is not evidence that they were in the better equilibrium — and what that does to the arbitrariness claim.

  Take a definite line, with reasons, and flag the point where you'd least want to be pushed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Social norms/conventions, specifically using Dagen H (Sweden's traffic switch) as a case study for David Lewis's *Convention* (1969).
      *   **Goal:** Provide an analysis (not history) to help decide if this fits a seminar syllabus.
      *   **Tone:** Opinionated, definite line, critical.
      *   **Structure:** Three specific parts.
          1.  disciplined mapping (population, coordination problem, equilibria, arbitrariness given constraints).
          2.  defend the claim: Lewis has a theory of maintenance but not displacement. Propose "Grip vs. Depth" distinction. Evaluate if this is an addition or relabeling. Use Dagen H as evidence, Metro as control.
          3.  Lewis's silence: Is post-1967 driving convention or law/self-preservation? Provide a test. Explain why the 83% referendum vote doesn't prove the "left" equilibrium was better, and implications for arbitrariness.
      *   **Requirement:** Flag the point where I'd least want to be pushed.

  2.  **Part 1: Disciplined Mapping (Lewisian Analysis):**
      *   *Population:* Swedish drivers (and pedestrians/cyclists interacting with them). Let's stick to drivers for clarity.
      *   *Recurring Coordination Problem:* Meeting on the road. Specifically, passing/overtaking and intersection navigation. The core is "Which side do we expect each other to occupy?"
      *   *Equilibria:* Two strict Nash equilibria: All-Left and All-Right. Mixed strategies are disastrous (crashes).
      *   *Arbitrariness:* This is the tricky bit. Lewis requires a convention to be arbitrary (there must be an alternative regularity that could have served the same purpose).
      *   *Constraint Check:* The prompt notes 90% of cars were LHD and neighbors drove on the right. Does this destroy arbitrariness?
      *   *Analysis:* At the *moment of choice* (1955/1963), "Left" was *not* arbitrary in a practical sense because the payoff structure was skewed (LHD cars + Right-driving neighbors made Left-driving costly/dangerous). However, in the *pure coordination game* abstracted by Lewis, the side itself is arbitrary. The *preference* for one over the other was not arbitrary due to external constraints.
      *   *Verdict:* The *existence* of a convention is arbitrary (we need *a* side), but the *selection* of the specific side had lost its arbitrariness by 1960 due to external pressures (cars, neighbors). This creates tension with Lewis's definition.

  3.  **Part 2: Grip vs. Depth (Maintenance vs. Displacement):**
      *   *The Claim:* Lewis explains how conventions stick (common knowledge, expectations), but not how they change (displacement).
      *   *The Fix:* Grip (cost of unilateral deviation) vs. Depth (infrastructure/habit embedding).
      *   *Evaluation:* Is this Lewis relabeled? Lewis talks about "precedent" and "salience." He doesn't really model the *cost of switching* distinct from the *cost of deviating*. Lewis assumes conventions emerge from repeated play. Dagen H was a *one-shot* coordinated switch enforced by the state.
      *   *Dagen H as Evidence:* High Grip (everyone expects left) but Shallow Depth (actually, wait... 90% LHD cars suggests Deep Depth for Right, but the *habit* was Left). Let's refine.
      *   *Refinement:* The "Left" convention had High Grip (deviate = crash) but the *infrastructure* was already aligning with Right (LHD cars). So the "Depth" of the *Left* convention was actually rotting. The "Right" convention had latent Depth (cars) but zero Grip (no one did it).
      *   *Metro Control:* Metro never switched. Why? No cross-border pressure, no LHD train issue (trains are symmetric or track-bound differently). High Grip, High Depth (tunnels built), Low external pressure.
      *   *Is it Lewis?* Lewis relies on *precedent*. Dagen H breaks precedent. Lewis relies on *common knowledge*. The state *created* common knowledge via the campaign.
      *   *Verdict:* It is an *extension/correction*, not just relabeling. Lewis assumes organic evolution. Dagen H is engineered displacement. The "Grip/Depth" distinction helps explain why some conventions resist engineering (Metro) and others succumb (Roads).

  4.  **Part 3: Lewis's Silence (Law vs. Convention & The Referendum):**
      *   *Law vs. Convention:* After 1967, are they driving right by convention or law? Lewis says law can *create* convention if it solves coordination. But if the penalty is the only reason, it's not a convention.
      *   *The Test:* Counterfactual enforcement removal. If the police vanished tomorrow, would Swedes still drive right? Yes, because expectations have reset. Therefore, it *became* a convention again, but the *switch* was legal fiat.
      *   *The 83% Vote:* Why vote Left if Right is better?
          *   *Reason 1:* Status Quo Bias / Loss Aversion.
          *   *Reason 2:* The "Better Equilibrium" claim is false. The Left equilibrium was *stable* but *inferior* in payoff (dangerous overtaking, border friction).
          *   *Implication for Arbitrariness:* If one equilibrium is objectively better (safer, more efficient), is the choice still arbitrary? Lewis says yes, as long as the *coordination* is the primary motive. But if payoffs are asymmetric, it's not a pure coordination game; it's a bargaining game or Hi-Lo game.
      *   *Critique:* This challenges Lewis's "arbitrariness" condition. If Right is *strictly better*, then driving Left isn't just a convention; it's a mistake trapped by coordination.
      *   *Least Want to be Pushed:* The definition of "Arbitrariness" in the face of asymmetric payoffs. This is the philosophical weak point.

  5.  **Drafting the Response (incorporating "Opinionated" tone):**
      *   *Tone:* Academic but sharp. Don't hedge too much.
      *   *Structure:* Follow the three parts exactly.
      *   *Key Insight:* Dagen H isn't a Lewisian convention emergence; it's a *Schelling point* creation via state power. Lewis fails to account for the *politics* of convention change.

  6.  **Refining the "Grip vs. Depth" argument:**
      *   Make sure to distinguish between the *habit* (muscle memory) and the *hardware* (cars/roads).
      *   Grip = Expectational stability (I expect you to go Left).
      *   Depth = Structural embedding (Cars are LHD, Signs are positioned for Right).
      *   Dagen H worked because Depth was already shifting to Right (LHD cars), even though Grip was Left. The state synchronized the Grip switch to match the latent Depth.
      *   Metro: Grip Right (hypothetically), Depth Left (tunnels/platforms). No external pressure to shift Depth. So Grip held.

  7.  **Refining the "Arbitrariness" argument:**
      *   Lewis requires $A$ and $B$ to be roughly equivalent in payoff *prior* to coordination.
      *   In Sweden 1960, Left was *inferior*. So it wasn't a true Lewisian convention anymore; it was a *suboptimal equilibrium lock-in*.
      *   This is a strong critique of Lewis. Conventions can become "sticky traps."

  8.  **Final Review against Constraints:**
      *   Three parts? Yes.
      *   Opinionated? Yes.
      *   Flag the weak point? Yes.
      *   No historical fact-checking (use provided facts)? Yes.
      *   Metro control case included? Yes.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Check:* Did I address the "Law vs. Convention" test clearly?
      *   *Correction:* Make the test specific. "The Sunrise Test."
      *   *Check:* Did I explain why 83% voted Left?
      *   *Correction:* Focus on the cost of transition vs. state of equilibrium. They weren't voting on the *destination*, they were voting on the *transition cost*.
      *   *Check:* Is the Grip/Depth distinction clearly distinguished from Lewis?
      *   *Correction:* Lewis talks about "salience." Grip/Depth is about "sunk costs" and "complementarities." It's distinct.

  10. **Final Polish:** Ensure the voice is authoritative and suitable for a seminar syllabus justification. (Proceed to generate output).

  *(Self-Correction on the "Arbitrariness" point)*: I need to be careful. Lewis defines arbitrariness as "there is an alternative regularity that could have served the purpose." Even if Right is *better*, Left still *serves the purpose* of coordination. So it remains arbitrary in Lewis's sense, but the *preference* is not arbitrary. I need to make sure I don't conflate "arbitrary convention" with "indifferent preference." The prompt asks what the 83% vote does to the arbitrariness claim. It suggests the convention was *normatively* loaded, not just coordinative. I will argue this breaks Lewis's purity condition.

  *(Final thought on the "Least Want to be Pushed" section)*: The distinction between Law creating Convention vs. Law enforcing Convention. If the state dictates the equilibrium, is it still a convention? Lewis says yes, if it becomes self-enforcing. I need to stand firm on the "Sunrise Test" but acknowledge the philosophical fuzziness there. I'll flag the *Arbitrariness* point as the most vulnerable because asymmetric payoffs undermine the pure coordination game model.

