answer: |-
  Here is the analysis you requested, structured for your syllabus decision. I am taking a hard line: Dagen H is a devastating counter-example to Lewis's static model, but your "Grip/Depth" fix saves it only if you admit Lewis ignores the *politics* of coordination.

  ### 1. The Disciplined Mapping

  **Population:** The relevant population is not "all Swedes," but **road-users capable of causing head-on collisions**. This excludes metro riders and rail passengers (your control case) and largely excludes pedestrians, whose coordination costs are lower. It is a population of ~2 million licensed drivers interacting with ~1.5 million vehicles.

  **The Recurring Coordination Problem:** This is not merely "meeting on the road." It is specifically **expectation alignment in conditions of limited visibility and high speed**. The problem recurs every trip, at every blind crest, and at every intersection. The payoff matrix is a standard Coordination Game:
  *   Both Left: High Payoff (Safe)
  *   Both Right: High Payoff (Safe)
  *   Mismatch: Catastrophic Payoff (Death/Crash)

  **The Equilibria:** There are two strict Nash equilibria: **All-Left** and **All-Right**. There is no mixed equilibrium; a 50/50 split is a war zone.

  **Arbitrariness (The Problematic Bit):** Lewis requires a convention to be arbitrary: there must be an alternative regularity that could have served the same purpose.
  *   *In 1950:* The choice was arbitrary. Left or Right both coordinate.
  *   *In 1960:* The choice was **no longer arbitrary**. With 90% of the fleet being Left-Hand Drive (LHD) and all neighbors driving Right, the "Left-Traffic" equilibrium had become objectively inferior. Overtaking required driving blind into oncoming traffic; border crossings required cognitive switching.
  *   *Mapping Conclusion:* By the time of the switch, Sweden was not in a Lewisian convention; it was in a **suboptimal equilibrium lock-in**. The "arbitrariness" condition of Lewis's definition had eroded because the payoff structure had shifted beneath the convention. The convention remained *coordinative*, but it was no longer *indifferent*.

  ### 2. Grip vs. Depth: Maintenance vs. Displacement

  Your claim is correct: Lewis provides a robust theory of **convention-maintenance** (common knowledge of expectations sustains the equilibrium) but offers no mechanics for **convention-displacement**. Lewis assumes conventions emerge organically from precedent. He has no account for how a population jumps from one equilibrium to another when the "precedent" screams against it.

  **Your Fix (Grip/Depth):**
  *   **Grip:** The immediate cost of unilateral deviation given current expectations (e.g., if I drive Right while everyone expects Left, I crash).
  *   **Depth:** The structural sunk costs embedded in the world that support a specific equilibrium (e.g., LHD cars, signage placement, intersection design, muscle memory).

  **Is this Lewis Relabelled?**
  No. Lewis talks about **Salience** (what stands out as the focal point). Your "Depth" is about **Complementarities** (physical and structural dependencies).
  *   Lewis would say the state made "Right" salient via the campaign.
  *   Your model says the state exploited the fact that **Depth had already migrated to Right** (90% LHD cars) while **Grip remained Left**.

  **Dagen H as Evidence:**
  The switch succeeded because the government synchronized the **Grip flip** (the legal change + the 5am stop) with the latent **Depth** (the cars were already configured for Right traffic). The "cost" of switching was high (retraining muscle memory), but the "cost" of staying was higher (dangerous overtaking). The four-year campaign was not just information; it was **common knowledge generation** to ensure the Grip flipped simultaneously. Without simultaneous flipping, High Grip kills the deviator.

  **The Metro Control Case:**
  The Metro never switched. Why?
  *   **Grip:** High (expectations aligned).
  *   **Depth:** High and Fixed (tunnels, platform edges, signaling systems built for Left).
  *   **External Pressure:** None (no cross-border trains, no LHD vs. RHD issue).
  *   **Result:** High Grip + High Depth + Low External Pressure = **Convention Immunity**.
  This validates your distinction. If Depth is fixed and external payoffs don't shift, Grip cannot be engineered away.

  **Verdict:** This is a necessary **extension**, not a relabeling. Lewis cannot explain why the Metro resisted what the Roads accepted without your Depth variable. Lewis only sees expectations; you are seeing infrastructure.

  ### 3. Where Lewis Goes Silent

  **Convention or Law?**
  After 1967, Swedes drive on the Right **by convention**, but the *transition* was by law.
  *   **The Test:** **The Sunrise Test.** If the state abolished the traffic law tomorrow and removed all police enforcement, would Swedes still drive on the Right?
      *   *If Yes:* It is a Convention (self-enforcing expectations).
      *   *If No:* It is Coercion (Prisoner's Dilemma enforcement).
      *   *Application:* In 1968, the answer is Yes. The law was a **focal point generator**. It solved the "which equilibrium?" problem, but once the population coordinated, the law became redundant to maintenance. Lewis allows law to *create* convention, provided it becomes self-enforcing. Dagen H fits this, but only *after* the switch.

  **The 83% Vote and the "Better Equilibrium" Claim:**
  Why did 83% vote to keep Left in 1955 if Right was safer/efficient?
  *   **Reason:** They were not voting on the *destination equilibrium*; they were voting on the **transition cost**.
  *   In 1955, the Depth was still Left (older cars, old habits). The cost of switching Depth (buying new cars, retraining) was private and immediate. The benefit of switching (safety, borders) was public and diffuse.
  *   **Implication for Arbitrariness:** This breaks Lewis. Lewis assumes conventions arise because $A$ and $B$ are roughly equivalent. Here, the population *knew* $B$ (Right) was likely better but chose $A$ (Left) because the **transition cost** outweighed the **equilibrium gain**.
  *   **The Damage:** This shows conventions can be **Pareto-inferior traps**. Lewis's theory assumes conventions solve coordination problems. Dagen H shows conventions can *create* coordination problems (by locking in inferior tech) that require state coercion to solve. The "arbitrariness" is an illusion created by transition costs.

  ### The Line I Would Least Want to Be Pushed On

  **The Arbitrariness Condition.**
  I am staking the seminar on the claim that **Dagen H proves Lewis's "arbitrariness" condition is empirically false for mature conventions.**
  *   *My Position:* By 1960, driving Left was not arbitrary; it was objectively worse. Therefore, it was not a Lewisian convention, but a **institutional inertia**.
  *   *The Vulnerability:* A Lewisian purist will argue that "arbitrariness" only means "another equilibrium *could* exist," not that the payoffs are identical. They will argue that even if Right is safer, Left is still a *convention* because it coordinates.
  *   *Why I resist:* If payoffs are asymmetric, the game is no longer Pure Coordination; it becomes **Bargaining** or **Hi-Lo**. If it's Hi-Lo, rational agents should flock to the better equilibrium without needing a "convention." The fact that they didn't proves the coordination friction was masking a payoff disparity. If you let Lewis slide on this, his theory becomes unfalsifiable: any stable behavior is a convention, regardless of how objectively stupid it is.

  **Syllabus Recommendation:**
  Use it. But do not use it to *illustrate* Lewis. Use it to **break** Lewis. It is the perfect case to show students that coordination is not just about expectations (Lewis); it is about the physical and economic sunk costs (Depth) that make those expectations expensive to change. Without the Grip/Depth distinction, Dagen H looks like magic. With it, it looks like engineering.
