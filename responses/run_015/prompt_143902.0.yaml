    "why_the_engineering_analogy_fails": "Engineering stress-tests aim for uptime and stability; Hegel sees conflict as constitutive of political identity, not a controlled procedure for system health.",
    "sovereignty_vs_treaties": "Treaties are contingent agreements based on mutual will; sovereignty is the ultimate authority to override them when existential interests are at stake.",
