      4.  *Ontological/Identity:* The facsimile *is* the work for all intents and purposes.
      5.  *Metaphysical:* Material history confers no value if imperceptible.

      *Wait, I need to ensure I address parameters (a-d) for each.*
      *   Let's select 4 distinct readings to cover the range effectively without bloating.
      *   1. The Perceptual Claim (Visual only).
      *   2. The Aesthetic Claim (Experience only).
      *   3. The Institutional Claim (Mission-focused).
      *   4. The Metaphysical Claim (Materiality is superstition).

  4.  **Drafting the Further Items:**
      *   *Item 1 (Transitivity/Conditions):* The slogan leaves parameters unfilled. "Visitors" and "Tell" are vague. The 90-second average matters. If the difference requires raking light (scholarly/conservation view), does it matter for the "visitor"?
      *   *Item 2 (Supervenience):* Does the slogan assume all value is visual? Yes, largely. Can it be pried apart? If value includes provenance, the slogan fails unless "difference" is redefined to exclude provenance.
      *   *Item 3 (Strongest Reading/Concessions):* Strongest reading is likely the "Public Mission" one. If the museum's primary duty is public access to aesthetic experience, and the original is dying, the facsimile serves the duty better. Concession: Acknowledge the original's historical value is secondary to public access *in this specific context of deterioration*.
      *   *Item 4 (Dialectical Work):* It shifts burden of proof. "Prove there is a difference." Is this legitimate? Given asymmetry (original lost forever vs. facsimile displayed), the burden should perhaps be on the swapper.

