          *   For each claim: (a) exact statement (parameters fixed), (b) verdict (platitude, defensible, false, not well-formed), (c) strength for arguments 1 & 2, (d) note parameter shifts between arguments.
          *   Address three further items:
              1.  Transitivity of indiscriminability (docent reports vs. conservator reports) + 90-second viewer constraint.
              2.  Supervenience of value on perceptible surface.
