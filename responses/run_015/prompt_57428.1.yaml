      *   *Reading 4 (The Institutional Mission):* Focus on the museum's specific duty to the public vs. scholars.
      *   *Reading 5 (The Temporal/Conditional):* "No difference *for the purpose of display*."

      *Refining the Readings for Precision:*
      *   *Reading 1 (Strict Perceptual):* To the average unaided eye, at gallery distance/lighting, right now. Difference = visual discrepancy.
      *   *Reading 2 (Aesthetic Experience):* To the typical visitor's aesthetic experience. Difference = aesthetic value delta.
      *   *Reading 3 (Ontological):* If indistinguishable, they are the same work (or equivalent substitutes). Difference = ontological status.
      *   *Reading 4 (Value Supervenience):* All value relevant to the museum's public mission supervenes on visual appearance.
      *   *Reading 5 (Radical Anti-Materialism):* Material history is irrelevant if invisible.

      *Let's structure them by "Radicalness":*
