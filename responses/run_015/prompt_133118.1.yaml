      *   **Religion:** The logic follows, but Schlick's main beef is usually cognitive meaninglessness. Still, the "salvation as work" critique is consistent with his view.
      *   **Art/Sports:** Definitely a caricature to call them for the immature. They are the models for adult play.
      *   **Youth/Innocence:** The poster smuggles in Romanticism. Schlick is a Positivist. He wants rational play, not innocent play.
