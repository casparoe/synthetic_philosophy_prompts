answer: |-
  # The Moral Saint Decision Tree
  **Start:** *The Birthday Case.* A saint skips a friend's birthday to fundraise. The friend is hurt.

  *   **Q1: The Blame Test.** Is the friend entitled to feel *wronged* (blame the saint), or merely *disappointed* (acknowledge a cost)?
      *   **A. Wronged (Morality is not absolute).** → Go to **Q2**.
      *   **B. Disappointed (Morality overrides).** → Go to **Q5**.

      *   **Q2: The Source of Permission.** Why isn't she required to fundraise?
          *   **A. Morality is satisfied by "good enough."**
              *   🍂 **Leaf 1: Threshold/Moderate View.**
              *   *Awkward Swallow:* You must explain why "enough" isn't just arbitrary comfort masquerading as principle.
          *   **B. Non-moral values rival morality.** → Go to **Q3**.

      *   **Q3: The Structure of Value.** Can moral and non-moral goods be summed into one "Good Life" score?
          *   **A. Yes (One Peak).** → Go to **Q4**.
          *   **B. No (Frontier/Incommensurable).**
              *   🍂 **Leaf 2: Value Pluralist.**
              *   *Awkward Swallow:* You have no procedure for resolving tragic conflicts between values, only regret.

      *   **Q4: The Weight.** On that single scale, does non-moral excellence outweigh moral duty?
          *   **A. Yes (Non-moral is lexically prior).**
              *   🍂 **Leaf 3: Non-moral Perfectionist.**
              *   *Awkward Swallow:* You must endorse a genius who ignores suffering as living a *better* life than a saint.
          *   **B. No, but "Saintliness" is an imbalance of virtues.**
              *   🍂 **Leaf 4: Saintliness-as-Imbalance.**
              *   *Awkward Swallow:* You must claim the saint is *morally* worse for caring too much about morality.
          *   **C. No, and Saintliness is the peak, but hobbies add nothing.**
              *   🍂 **Leaf 5: UNNAMED (The "Moral Monist").**
              *   *Diagnosis:* Incoherent; denies the data (that hobbies are good) to save the theory.

      *   **Q5: The Nature of the Cost.** Morality wins. What makes the saint unattractive?
          *   **A. Resource Loss (She has no time for hobbies).** → Go to **Q6**.
          *   **B. Motive Contamination (She can't love hobbies wholeheartedly).** → Go to **Q7**.

      *   **Q6: The Locus of Loss.** Who is worse off because she has no hobbies?
          *   **A. The World (We lose quartets/cures).**
              *   *Sub-split:* Is the world *overall* worse off?
              *   **Yes.** → 🍂 **Leaf 6: Tragic View.**
                  *   *Awkward Swallow:* You must affirm she did the right thing while wishing she hadn't.
              *   **No.** → 🍂 **Leaf 7: No-Upper-Bound Maximizer.**
                  *   *Awkward Swallow:* You must insist a world without art is morally superior to one with it.
          *   **B. The Agent (Her life is dull).**
              *   🍂 **Leaf 8: UNNAMED (The "Self-Sacrificial Egoist").**
              *   *Diagnosis:* Unattractive; treats the agent's boredom as the only moral currency that matters.

      *   **Q7: The First-Personal Gap.** You admit she is morally perfect. Do *you* want to be her?
          *   **A. Yes (I aim at this).** → Go to **Q8**.
          *   **B. No (Not me).** → Go to **Q9**.

      *   **Q8: The Regulative Move.** Do you want *everyone* to be her?
          *   **A. Yes.** → (Collapses into **Leaf 7: Maximizer**).
          *   **B. No (A world of saints is worse).**
              *   🍂 **Leaf 9: Regulative Ideal.**
              *   *Awkward Swallow:* You must explain why an ideal is worth aiming at if its universal realization is sub-optimal.

      *   **Q9: The Stability.** Is it coherent to admire her but refuse to be her?
          *   **A. Yes (Morality isn't authoritative for *living*).**
              *   🍂 **Leaf 10: Alienation View.**
              *   *Awkward Swallow:* You sever the link between "morally best" and "rationally choicest," risking normativity.
          *   **B. No (That's hypocrisy).**
              *   🍂 **Leaf 11: UNNAMED (The "Admirer's Paradox").**
              *   *Diagnosis:* Unstable; admits the judgment but refuses the commitment without justification.

  ***

  ### Instructor Notes & Logical Gaps

  **Inseparable Leaves:**
  *   **Leaf 1 (Threshold)** vs. **Maximizing with Diminishing Marginal Value:** On mid-sized sacrifices (e.g., skipping a movie), these behave identically. To separate them, you need a *extreme* case (e.g., "Must you starve to save a stranger?"). The Thresholder says "No, duty stops"; the Maximizer says "Yes, but the moral value gained is tiny."
  *   **Leaf 9 (Regulative)** vs. **Leaf 10 (Alienation):** Both endorse the saint from afar but reject her for oneself. The split hinges on *aspiration*: The Regulative idealist still tries to move toward sainthood (even if they fail); the Alienationist denies the rational pull entirely.

  **Empty Cells:**
  *   **Leaf 5 (Moral Monist):** Empty because it denies the premise of Wolf's objection (that non-moral goods exist). It's logically possible but dialectically dead.
  *   **Leaf 8 (Self-Sacrificial Egoist):** Empty because it grants the moral demand but treats the agent's boredom as the *moral* trump card, which contradicts the "Morality Overrides" branch entry.

  **Axes Coverage:**
  *   **Crowding vs. Contamination:** Split at **Q5**.
  *   **Agent vs. World Loss:** Split at **Q6**.
  *   **Cost vs. Defect:** Split at **Q1** (Blame).
  *   **One Peak vs. Frontier:** Split at **Q3**.
  *   **First vs. Third Personal:** Split at **Q7/Q8**.
  *   **Enjoyment:** Implicit in **Q5** (Contamination = inability to enjoy).
  *   **Aim vs. Realize:** Split at **Q8**.
