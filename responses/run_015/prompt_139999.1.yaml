  2. In conflicts, the most recently adopted rule prevails. *Note: Creates temporal supremacy, implying new rules override old constraints.*
  3. In conflicts, the original printed text prevails. *Note: Creates textual supremacy directly conflicting with Rule 2.*
  4. Rule 1 requires a 75% vote to amend. *Note: Protects the amendment procedure against simple majorities.*
