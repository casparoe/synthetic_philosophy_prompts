      *   **Task:** Evaluate the user's list of 11 examples regarding the Handicap Principle/Signaling Theory. Develop a robust principle (or short list) that explains the intuitions, identify where intuitions might be wrong, and address specific cases (#5, #8, #10, and a new "acting dumb" case).
      *   **Constraint:** Start with brainstorming (3-4 candidate principles) before committing to one. Don't just give the textbook definition. Be critical of the user's "gut feelings."
      *   **Tone:** Academic but accessible, rigorous, slightly Socratic, willing to challenge the user's premises.

  2.  **Deconstruct the User's Examples & Intuitions:**
      *   1 (Peacock): Classic Handicap. Costly, honest. (User: Yes)
      *   2 (Gazelle Stotting): Pursuit Deterrence. Costly, honest. (User: Yes)
