      *   *Correction on #8:* Studying isn't just signaling; it's human capital accumulation. But the *grade* is the signal. The *studying* is the cost. I need to be precise there.
      *   *Correction on #10:* The dawn lizard case is the crux. If the mutation spreads, the signal value drops to zero. This is the "unraveling" argument.

