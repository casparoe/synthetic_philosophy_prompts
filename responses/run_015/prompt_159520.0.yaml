      *   5 (Natural Talent): High quality, low cost. (User: Flip-flop). *Key Insight: Is cost necessary for honesty, or just difficulty to fake?*
      *   6 (Blushing): Unconscious, physiological. (User: Not a signal). *Key Insight: Intent vs. Function. Evolutionary signals don't need conscious intent.*
      *   7 (Virtue Signaling): Potentially dishonest/manipulative. (User: Dishonest). *Key Insight: Greenbeard effects vs. cheap talk.*
      *   8 (SAT/Study): Investment vs. Signal. (User: Flip-flop). *Key Insight: Signal vs. Direct Benefit/Quality realization.*
      *   9 (Nectar): Reward vs. Signal. (User: Confused). *Key Insight: Index vs. Signal vs. Bribe.*
      *   10 (Lizard Push-ups): Costly vs. Cheap mutant. (User: Confused). *Key Insight: Equilibrium stability. If cheap mutants invade, the signal collapses.*
      *   11 (Entry Fee): Fixed cost. (User: Not informative). *Key Insight: Marginal cost vs. Fixed cost. Condition dependence.*

  3.  **Brainstorming Candidate Principles:**
      *   *Candidate 1: The Costly Signaling Principle (Zahavi/Grafen).* Focuses on differential costs. High quality individuals pay less marginal cost than low quality.
      *   *Candidate 2: The Index/Constraint Principle.* Focuses on physical impossibility of faking (e.g., deep voice = large body). Cost isn't the mechanism; physical linkage is.
      *   *Candidate 3: The Game-Theoretic Equilibrium Principle (Maynard Smith).* Focuses on stability. A signal is honest if a dishonest strategy cannot invade the population.
      *   *Candidate 4: The Receiver-Dependent Principle.* Focuses on the response. A signal is only a signal if the receiver's evolution maintains it.

  4.  **Evaluating Candidates against User Intuitions:**
      *   *Candidate 1 (Costly):* Handles #1, #2, #4 well. Struggles with #5 (low cost) and #6 (unconscious). Struggles to distinguish #8 (investment) from signaling.
      *   *Candidate 2 (Index):* Good for #6 (blushing is an index), good for #5 (talent is an index). Bad for #1 (peacock tail *is* costly, not physically constrained).
      *   *Candidate 3 (Equilibrium):* This is the strongest philosophically. It handles #10 perfectly (the cheap mutant invades and destroys the signal). It handles #11 (fixed fee doesn't separate types). It explains why #7 fails (if everyone does it, it loses value).
      *   *Candidate 4 (Receiver):* Crucial for #3 (no receiver = no signal). Crucial for #10 (if females stop responding, signal dies).

  5.  **Selecting the Best Principle:**
      *   The "Textbook Handicap Principle" is often misunderstood as just "cost = honest." That's wrong.
      *   The *Philosophically Robust* version is the **Strategic Cost Principle (Separating Equilibrium)**.
      *   *Core Idea:* It's not about absolute cost; it's about *differential marginal cost* relative to quality, maintaining a *Separating Equilibrium* where low-quality individuals *cannot profitably mimic* high-quality individuals.
      *   *Refinement:* Need to distinguish between *Signals* (evolved to convey info), *Indices* (physically linked), and *Cues* (unintentional). This solves the blushing (#6) and nectar (#9) confusion.

  6.  **Drafting the Response (Iterative Process):**

      *   *Intro:* Establish persona. Acknowledge the messiness of the intuitions. Validate that the user's confusion is actually a sign of good philosophical instincts.
      *   *Brainstorming Phase:* Present the 3-4 candidates clearly.
          1.  Absolute Cost (The "No Pain No Gain" view).
          2.  Differential Cost (The "Zahavi/Grafen" view).
          3.  Separating Equilibrium (The "Game Theory" view).
          4.  Signal vs. Index vs. Cue (The "Philosophy of Bio" taxonomy).
      *   *Selection:* Argue for a hybrid of #3 and #4. The "Stable Separating Equilibrium" framework, categorized by mechanism (Cost vs. Constraint).
      *   *Addressing the Cases:*
          *   #3 (Gazelle alone): No receiver = No signal (evolutionarily). It's a cue or waste.
          *   #4 (Truck): Dad paying breaks the condition-dependence. It's "cheap talk" masquerading as signaling.
          *   #5 (Natural Talent): This is an *Index*, not a Handicap Signal. Honesty comes from physical constraint, not cost.
          *   #6 (Blushing): *Index/Cue*. Not a strategic signal.
          *   #7 (Virtue Signaling): If cheap to fake, it collapses. If it becomes costly (time/opportunity), it might stabilize.
          *   #8 (SAT): This is *Quality Realization*, not just signaling. The studying *creates* the trait.
          *   #9 (Nectar): This is a *Reward/Bribe*, not a signal. The nectar *is* the benefit, not info about the benefit.
          *   #10 (Lizard): The cheap mutant destroys the equilibrium. It becomes "cheap talk" and females should evolve to ignore it.
          *   #11 (Entry Fee): Fixed cost doesn't separate types.
      *   *The "Acting Dumb" Case:* This is *Counter-Signaling* or *Costly Ignorance*. If the cost (bad grades) is higher for low-ability kids (they fail out) than high-ability kids (they pass easily), it *is* a signal.
      *   *Hard Truths:* Tell the user where their gut is wrong.
          *   #6 (Blushing): It *is* a signal in the evolutionary sense, even if not conscious.
          *   #4 (Truck): If dad pays, it's not a signal of *the son's* quality.
          *   #10 (Lizard): The dawn push-ups cannot persist as a signal if they are truly cost-free for low-quality males.

  7.  **Refining the Tone:**
      *   Make sure to sound like a professor who cares about conceptual clarity. Use terms like "Separating Equilibrium," "Marginal Cost," "Index," "Cue."
