      *   **The Core Question:** How do Updateless Decision Theory (UDT) and Evidential Decision Theory (EDT) handle this, specifically regarding logical correlation vs. causal isolation and self-locating uncertainty?

  2.  **Analyze Updateless Decision Theory (UDT):**

      *   *Core Mechanism:* UDT chooses a policy (a mapping from observations to actions) that maximizes expected utility *across all possible worlds* weighted by their prior probability, *before* updating on specific observations (like "I am in Simulation A"). It treats the output of its algorithm as a logical fact.
