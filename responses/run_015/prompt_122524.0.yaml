prompt: |-
  I direct the evaluation unit of a government behavioural insights team. We run roughly twenty field trials a year — changing defaults, the wording and ordering of forms, the salience of information, and the friction attached to a decision — across workplace pension enrolment, organ donor registration, energy tariff switching, attendance at cancer screening, and high cost short term credit. For each trial I must issue a one page welfare finding: a statement, defensible to our board, to the department that commissioned the trial, and if necessary to a parliamentary committee, of whether the people affected were made better off. I have three analysts, around six weeks per trial, and the finding has to be reproducible in the sense that a second analyst working from the same data reaches the same verdict.

  The constraint that makes this hard is a rule our board adopted, which I will call the Choice Rule. It requires that (a) any finding about whether people are better off be grounded in what those people actually chose among the options actually available to them; (b) self reported life satisfaction, happiness, or stated willingness to pay not be used as evidence, though it may be quoted as context; and (c) where the evidence does not settle the matter, the finding say so rather than fill the gap. Clause (b) was adopted because the board distrusted wellbeing questionnaires, not because anyone had worked through what a choice based notion of being better off actually commits us to.

  We have been applying the rule by instinct, and it is producing findings I cannot defend. So I want a procedure my analysts can actually run.

  My own sense of the problem is this. In the revealed preference tradition, utility is not a feeling or a quantity of satisfaction; it is a numbering of the bundles a person picks, and it is pinned down only up to any relabelling that preserves the ordering. Being better off on that view comes to something like: reaching a bundle that was affordable before and was not taken. That licenses a verdict only for a single person, over a stable set of options at unchanged prices, and only in the weak form at least as well off — never as a magnitude, and never as a total across people. Almost none of that survives contact with what we do. Our interventions typically work by changing presentation or effort cost rather than the feasible set; several work by changing what people believe rather than what they want; and every finding we issue is about a population.

  What I want from you is the translation. Give me the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops with no welfare finding possible, and the points at which it hands the question to a named person because it is a question of values rather than of fact — and tell me what the one page finding should say in each of those cases. It has to handle at least the following.

  Defaults and framing, where the feasible set and the money prices are untouched but behaviour shifts substantially: does the procedure require reversal to count as evidence, does sustained non reversal over a follow up period suffice, and does it matter that a default carries an implicit recommendation from the state?

  Friction, where every option remains formally available but one becomes harder to take — a mandatory delay, an extra form, a phone call instead of a click. My analysts are split. Converting hassle into a price equivalent makes the procedure silent about nearly every tool we have; refusing to convert it makes the procedure treat our most effective interventions as though they cost nothing. Tell me which way the procedure should go and what each choice costs us.

  Information and debiasing, where an intervention corrects a mistaken belief about the terms of a product. Post intervention choices are choices; pre intervention ones were made against a budget set the person misdescribed. Say what the procedure does here and why.

  Cycles and time inconsistency, where people enrol and then lapse, or reverse themselves when the same pair of options is presented in a different order. One analyst proposes that we compute an Afriat style number: roughly, how much of each person's budget one would have to discount before their choices could be described as maximising anything at all, with a threshold used as a pass fail gate. Tell me whether that is a good idea, what such a number would actually be measuring, and how I should read it when it comes out at something like 0.9.

  Adaptive and defensive choice, where the choice itself looks like a product of the deprivation — the underserved group that does not complain, the long term user of a harmful product who reports liking it. Clause (b) stops us from asking; it does not tell us whether to read the behaviour as evidence or as a symptom.

  Aggregation, since every finding we issue is about a group that contains both gainers and losers. If the theory's currency is one person's ranking, the procedure has to say what it does at the step from persons to populations, and mark that step as owned by the board rather than by us.

  Then run it on three of our trials. First: a switch from opt in to opt out enrolment in a workplace pension, moving enrolment from 41 to 87 per cent, with twelve months of follow up showing a low and flat opt out rate, and with no data on whether participants offset by cutting other saving or consumption. Second: a rewritten invitation letter that raises cervical screening attendance in a persistently low attendance group from 34 to 39 per cent, with no change in the feasible set, no follow up data, and a live reading on which attendance expresses anxiety rather than preference. Third, the one where I expect to dislike the answer: a mandatory twenty four hour cooling off period on high cost short term credit that reduced borrowing by about a third in the treated group. Our prior is that this is a clear welfare gain, while a strict choice based view looks likely to return either silence or a loss, since the option became harder to take and those who persisted paid in time and hassle. I want to see what the procedure honestly returns, and how that gets written up for a board that wants the opposite conclusion.

  Finally, say plainly what the procedure cannot do. I need to know which parts of the mandate it can never satisfy — interpersonal sums, magnitudes, the intensity of a gain — and whether the deeper question, whether better off should be read as preference satisfaction at all rather than as something thicker, is one the procedure can flag but never settle. Write it so that an analyst with a good undergraduate training in economics or psychology and none in this literature can run it in the time we have, and mark every step where the answer depends on a judgement I have to make rather than one the data make.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Director of an Evaluation Unit in a Government Behavioural Insights Team (BIT).
      *   **Task:** Create a reproducible procedure for analysts to issue one-page "welfare findings" based on field trials (RCTs/quasi-experiments).
      *   **Constraint (The Choice Rule):**
          *   (a) Welfare must be grounded in actual choices among available options.
          *   (b) No self-reported wellbeing/WTP as evidence (context only).
          *   (c) If evidence is inconclusive, state "inconclusive" (no gap-filling).
      *   **Resources:** 3 analysts, 6 weeks per trial.
      *   **Target Audience:** Board, Commissioning Department, Parliamentary Committee.
      *   **Key Challenges to Address:**
          *   Defaults/Framing (feasible set unchanged).
          *   Friction (hassle costs).
          *   Information/Debiasing (mistaken beliefs).
          *   Cycles/Time Inconsistency (reversals).
          *   Adaptive/Defensive Choice (deprivation shaping preference).
          *   Aggregation (group-level findings from individual rankings).
      *   **Specific Trials to Test:**
          1.  Pension Opt-out (41% -> 87%, low opt-out).
          2.  Cervical Screening Letter (34% -> 39%, anxiety concern).
          3.  Credit Cooling-off (borrowing down 1/3, friction added).
      *   **Requirement:** Plainly state limitations (interpersonal sums, magnitudes, preference satisfaction vs. thicker welfare).
      *   **Tone/Style:** Operational, rigorous, defensible, accessible to analysts with undergrad econ/psych training.

  2.  **Analyze the Core Tension:**

      *   *Revealed Preference (RP) Theory:* Choices reveal preferences. If you chose A over B, A is better for you.
      *   *BIT Reality:* Interventions change *how* choices are made (friction, salience, defaults), not just the budget set. People make mistakes (bias, misinformation, time inconsistency).
      *   *The Choice Rule:* Forces a RP framework onto a Behavioural context.
      *   *The Problem:* Strict RP says changing a default doesn't change welfare (same options). Strict RP says adding friction reduces welfare (shrinks effective opportunity set). Strict RP says if someone borrows, they wanted to (even if addicted/misinformed).
      *   *The Solution:* A "Behavioural Welfare Economics" procedure that respects the Choice Rule but acknowledges bounded rationality. It needs to distinguish between *decision utility* (choice at time $t$) and *experienced utility* (inferred from stable choices or correction of errors), without violating the ban on self-reports.

  3.  **Develop the Procedure (The "Translation"):**

      *   *Goal:* Move from "Did they choose it?" to "Does this choice reflect their underlying interest?" without using happiness surveys.
      *   *Step 1: The Counterfactual Choice.* What did they choose before vs. after?
      *   *Step 2: Stability & Reversal.* Is the new choice stable? (Addresses defaults/framing).
      *   *Step 3: Friction & Cost.* Is the intervention a "nudge" or a "shove"? (Addresses friction).
      *   *Step 4: Information & Beliefs.* Did they know what they were choosing? (Addresses debiasing).
      *   *Step 5: Consistency.* Are choices consistent over time/context? (Addresses time inconsistency).
      *   *Step 6: Aggregation.* How to sum up? (Addresses the population requirement).
      *   *Decision Nodes:* Where does the analyst stop and the Director/Board decide? (Value judgments).

  4.  **Drafting the Steps (Iterative Refinement):**

      *   *Refining Friction:* The prompt asks whether to convert hassle to price. *Decision:* No. That makes everything look bad. Instead, treat friction as a *screen*. If friction stops a choice, was that choice likely an error? Use "Active Choice" as the gold standard.
      *   *Refining Defaults:* If people stay in the default, is it welfare-enhancing? Only if they *could* opt out easily and didn't. Stability is key.
      *   *Refining Aggregation:* RP is individual. Population welfare requires a social welfare function. The procedure must flag this as a Board decision (Pareto vs. Kaldor-Hicks vs. Majority).
      *   *Refining the "Better Off" Definition:* Since we can't measure utility magnitude, we must rely on *Pareto improvements* or *Error Correction*.
      *   *The "Error" Definition:* How to define an error without wellbeing data?
          *   Inconsistency (Time/Context).
          *   Ignorance (Correctable by info).
          *   Instability (Reversed quickly).

  5.  **Addressing the Specific Trials:**

      *   *Pension:* High uptake, low opt-out. Suggests the default aligns with latent preference *or* inertia. Without data on consumption offset, we can't claim net wealth gain. *Verdict:* Likely welfare neutral/positive *conditional on no debt offset*, but strictly "Inconclusive on net welfare" due to missing consumption data. *Correction:* Actually, under Choice Rule, if they stay enrolled, they revealed a preference for enrollment *at that moment*. But is it *better off*? Only if we assume savings > consumption loss. The prompt says "no data on offset". So strict Choice Rule = Inconclusive on *net* welfare, Positive on *enrollment preference*.
      *   *Screening:* Attendance up. But is attendance "good"? Choice Rule says if they attend, they chose health over time/cost. But the prompt mentions "anxiety". If anxiety drives avoidance, attendance might be forced. *Verdict:* Inconclusive. We don't know if attendance reflects health valuation or compliance/anxiety reduction.
      *   *Credit:* Borrowing down. Friction added. Strict RP: Borrowers who were stopped are worse off (denied choice). Borrowers who persisted paid hassle cost. *Verdict:* Welfare Loss (strictly). *Unless* we argue the cooling-off corrects a time-inconsistency error. But without evidence of regret (reversal), strict Choice Rule says Loss. This is the "honest answer" the Director expects to dislike.

  6.  **Addressing the Limitations:**

      *   Cannot sum utility (Interpersonal comparison).
      *   Cannot measure intensity (Magnitude).
      *   Cannot distinguish "thick" welfare (health, autonomy) from preference satisfaction without value judgments.

  7.  **Structuring the Document:**

      *   **Introduction:** Purpose and scope.
      *   **The Procedure (The 5-Step Filter):** Logical flow for analysts.
      *   **Decision Matrix:** When to stop, when to escalate.
      *   **Template for the One-Page Finding:** Standardized output.
      *   **Application to Trials:** Demonstrating the procedure.
      *   **Limitations Statement:** Required transparency.

  8.  **Refining the "Friction" and "Credit" Logic (Crucial Step):**

      *   *Problem:* The Director suspects the Credit trial will return a "Loss" under strict Choice Rule, contradicting the Board's prior.
      *   *Solution:* The procedure must distinguish between *Restriction* (removing an option) and *Friction* (adding cost).
      *   *Strict RP View:* Friction reduces the effective choice set. Welfare loss.
      *   *Behavioural View:* Friction filters impulsive choices.
      *   *Compromise for Procedure:* If friction reduces uptake, we cannot claim a welfare gain *unless* there is evidence of post-choice regret or reversal (Time Inconsistency). If no reversal data exists, the finding must be "Inconclusive" or "Negative" regarding the stopped group. I need to be honest here. The prompt asks for what the procedure *honestly returns*. I must not game the system to please the Board. I will advise that without evidence of regret (e.g., default rates on the loans that *were* taken vs. those that *weren't*), the Choice Rule forces a "No Evidence of Gain" verdict.

  9.  **Refining Aggregation:**

      *   Analysts cannot make distributive judgments.
      *   The procedure must output a distribution of effects (e.g., "Group A chose X, Group B chose Y").
      *   The Board must apply the Social Welfare Function (SWF).
      *   *Action:* The One-Page Finding must have a specific section: "Distributional Consequences" and "Aggregation Assumption Required."

  10. **Final Review against Constraints:**

      *   *Reproducible?* Yes, flowchart style.
      *   *6 Weeks?* Yes, relies on existing admin data, no new surveys.
      *   *Choice Rule Compliant?* Yes, no happiness data used as evidence.
      *   *Defensible?* Yes, explicitly marks value judgments.

  11. **Drafting the Content (incorporating the "Voice"):**

      *   Tone: Professional, bureaucratic but intellectually honest, precise.
      *   Format: Manual/Protocol style.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Use Behavioural Welfare Economics." I need to give the *questions*.
      *   Q1: Did the feasible set change?
      *   Q2: Did the choice change?
      *   Q3: Is the new choice stable?
      *   Q4: Was the old choice likely an error (info/consistency)?
      *   Q5: Who gained/lost?

      *On the Credit Trial:* If I say "Welfare Loss," the Board will reject it. If I say "Welfare Gain," I violate the Choice Rule. The middle path is "Inconclusive on Welfare, Negative on Choice Freedom." Or, rely on the *outcome* of the credit (default). If the trial data includes repayment performance, that's a choice-based proxy for welfare (default = revealed inability to pay). The prompt says "reduced borrowing... no data on offset." It doesn't explicitly rule out repayment data, but implies we only have borrowing stats. I will assume only borrowing stats to be safe. This forces the "Inconclusive/Negative" result. I must explain *why* this is the honest result.

      *On Aggregation:* I need to explicitly state that the Analyst reports the *vector* of changes, and the Board applies the *weights*.

      *On Friction:* I will recommend treating friction as a *cost*. If the intervention works *only* via friction, it is a welfare loss unless it corrects a proven error.

      *On Defaults:* Stability is the proxy for preference.

      *On Screening:* If attendance is the choice, and the choice increased, welfare increased *if* attendance is a good. But is it? The Board must define "Health" as a good. The Analyst can only say "More people chose screening."

      *Wait, one nuance:* The Choice Rule says "grounded in what those people actually chose." It does not say the Analyst must judge the *value* of the object chosen, only that the choice reveals the preference. However, to say "Better Off," we usually need to know if the choice aligns with *long-term* interest.
      *Correction:* Strict RP says if you chose it, you are better off. So if screening attendance goes up, strictly speaking, more people revealed a preference for screening. *However*, the prompt mentions "anxiety rather than preference." This implies the choice might not reflect true preference (internal conflict). This touches on Time Inconsistency/Intrapersonal Conflict.
      *Decision:* I will classify "Anxiety-driven compliance" as a potential violation of the "Voluntariness" condition required for RP to hold. If the letter induces undue stress that coerces choice, RP is invalid. Analysts must check for coercion proxies.

      *Let's finalize the Procedure Steps:*
      1.  **Feasibility Check:** Did the budget set shrink? (If yes, Presumptive Loss).
      2.  **Voluntariness Check:** Was the choice coerced or driven by acute distress? (If yes, RP Invalid -> Inconclusive).
      3.  **Stability Check:** Did they reverse? (If no reversal, Presumptive Gain for switchers).
      4.  **Error Check:** Was the prior choice based on false info? (If yes, Correction = Gain).
      5.  **Aggregation:** Report counts. Board decides weights.

      *Wait, the Credit Trial:* Cooling off is friction. It reduces borrowing.
      *   Group A (Stopped): Did not borrow. Revealed preference *after* friction is "No Borrow". Revealed preference *before* was "Borrow". Which is true?
      *   Without follow-up (regret/default data), we don't know.
      *   Strict Choice Rule: You restricted their set. Loss.
      *   Behavioural Exception: If we assume hyperbolic discounting, the "later self" prefers no borrow. But Choice Rule (b) bans wellbeing. Can we use "Later Choice" (repayment)? If no repayment data, we are stuck.
      *   *Honest Answer:* The procedure must return "Inconclusive on Welfare, Negative on Freedom of Choice." I will write this clearly.

      *Okay, ready to write.*
answer: |-
  **TO:** Evaluation Unit Analysts
  **FROM:** Director
  **SUBJECT:** Protocol for Welfare Findings (Choice Rule Compliant)
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope

  This document establishes the standard procedure for issuing Welfare Findings on behavioural trials. It is designed to satisfy the Board's **Choice Rule**: findings must be grounded in observed choices, cannot rely on self-reported wellbeing as evidence, and must declare uncertainty where data is insufficient.

  This procedure does not measure "happiness." It measures **Choice Consistency** and **Feasible Set Integrity**. It translates observed behaviour into welfare statements only where behaviour reliably indicates preference. Where behaviour is ambiguous (e.g., driven by friction, error, or coercion), the procedure defaults to "Inconclusive."

  **Time Allocation:** 6 Weeks per trial.
  **Analyst Requirement:** Undergraduate level economics/psychology. No advanced welfare theory required.

  ---

  ### 2. The Procedure: Five Sequential Filters

  Run these filters in order. If a filter stops the process, record the reason and draft the finding according to Section 3. Do not proceed to the next filter unless the previous one is passed.

  #### Filter 1: The Feasible Set Test (Friction & Restrictions)
  **Question:** Did the intervention remove an option or add a material cost (time, money, effort) to an option that was previously available?
  *   **Data Needed:** Process maps, time-motion studies, cost logs.
  *   **Pass Condition:** No options removed; no material costs added. (Pure information/salience changes).
  *   **Fail Condition:** Options removed or costs added (e.g., cooling-off periods, mandatory forms).
  *   **Action if Fail:** Presumptive Welfare **Loss** for those prevented from choosing the costly option, *unless* Filter 4 (Error Correction) is passed.
  *   **Analyst Note:** Do not convert hassle into monetary equivalents. Record the friction as a binary "Cost Added."

  #### Filter 2: The Voluntariness Test (Coercion & Anxiety)
  **Question:** Is there evidence that the choice was driven by acute distress, coercion, or misunderstanding of the *mechanism* of choice (not the product)?
  *   **Data Needed:** Complaint logs, drop-out rates at specific form stages, qualitative context (e.g., "anxiety" readings).
  *   **Pass Condition:** Choice appears voluntary; no spike in distress markers.
  *   **Fail Condition:** Evidence suggests choice was compelled by state authority or acute anxiety rather than preference (e.g., screening attendance driven by fear of penalty rather than health valuation).
  *   **Action if Fail:** **Inconclusive.** Revealed Preference (RP) theory requires voluntary choice. If voluntariness is compromised, choices do not reveal welfare.

  #### Filter 3: The Stability Test (Defaults & Framing)
  **Question:** For those whose choices changed, did the new choice persist over a reasonable follow-up period?
  *   **Data Needed:** Administrative data at $T+0$, $T+6$ months, $T+12$ months.
  *   **Pass Condition:** New choice is stable (low reversal/opt-out rate).
  *   **Fail Condition:** High reversal rate (e.g., enrol then opt-out within 3 months).
  *   **Action if Pass:** The new choice is treated as a **Revealed Preference**.
  *   **Action if Fail:** **Inconclusive.** Instability suggests the intervention triggered noise, not preference alignment.

  #### Filter 4: The Error Correction Test (Information & Time)
  **Question:** For cases where Filter 1 failed (Friction/Restriction), is there evidence the prevented choice was an "error" (e.g., based on false info or time-inconsistency)?
  *   **Data Needed:** Comparison of pre-intervention knowledge vs. post-intervention knowledge; evidence of post-choice regret (e.g., loan default rates, product returns).
  *   **Pass Condition:** Evidence shows the prevented choice would have led to a worse outcome *by the chooser's own later standards* (e.g., they defaulted on the loan they were stopped from taking).
  *   **Fail Condition:** No data on outcomes/regret.
  *   **Action if Pass:** Intervention counts as **Welfare Gain** (correction of error).
  *   **Action if Fail:** Revert to Filter 1 verdict (Presumptive Loss).

  #### Filter 5: The Aggregation Step (Population Findings)
  **Question:** How do we sum individual findings into a group statement?
  *   **Data Needed:** Counts of gainers, losers, and unchanged per trial arm.
  *   **Procedure:** Analysts **do not** sum welfare. Analysts report the **Distribution Vector**.
  *   **Action:** The finding must state: "X% made a new stable choice; Y% faced new friction; Z% unchanged."
  *   **Value Judgment:** The Board must apply the Social Welfare Function (e.g., is a gain for X% worth a loss for Y%?). This is marked as **Board Decision Required**.

  ---

  ### 3. The One-Page Finding Template

  **Trial Name:** [Name]
  **Intervention:** [Description]
  **Verdict:** [Welfare Gain / Welfare Loss / Inconclusive]

  **1. Choice Evidence:**
  *   Baseline Choice Rate: [%]
  *   Post-Intervention Choice Rate: [%]
  *   Reversal/Opt-out Rate (12 months): [%]

  **2. Filter Results:**
  *   Feasible Set Changed? [Yes/No]
  *   Voluntariness Compromised? [Yes/No]
  *   Choice Stable? [Yes/No]
  *   Error Correction Evidenced? [Yes/No]

  **3. Distributional Consequences:**
  *   Group A (New Choosers): [Count]
  *   Group B (Restricted/Friction): [Count]
  *   Group C (Unchanged): [Count]

  **4. Analyst Certification:**
  *   "This finding relies solely on observed choices and administrative data. No wellbeing metrics were used as evidence."
  *   "This finding requires a Board judgment on aggregation." [Yes/No]

  **5. Limitations Statement:**
  *   [Select from Standard List, see Section 5]

  ---

  ### 4. Application to Current Trials

  Here is how the procedure applies to your three specific cases. This demonstrates the "honest return" of the protocol.

  #### Trial 1: Workplace Pension (Opt-in to Opt-out)
  *   **Data:** Enrolment 41% $\rightarrow$ 87%. Opt-out flat/low. No consumption offset data.
  *   **Filter 1 (Feasible Set):** Pass. Options unchanged.
  *   **Filter 2 (Voluntariness):** Pass. No coercion evidence.
  *   **Filter 3 (Stability):** Pass. Low opt-out rate implies stable preference for the default.
  *   **Filter 4 (Error):** N/A (No friction).
  *   **Filter 5 (Aggregation):** 46% of population made a new stable choice (enrolment).
  *   **Verdict:** **Welfare Gain (Conditional).**
  *   **Writing the Finding:** "The intervention increased stable enrolment by 46 percentage points. As the feasible set was unchanged and choices were stable, this is recorded as a revealed preference for enrolment. **Caveat:** Welfare is contingent on the assumption that pension contributions do not displace higher-value consumption or essential debt repayment. Without consumption data, net wealth welfare is **Inconclusive**."
  *   **Board Flag:** Requires Board to accept "Enrolment" as a proxy for "Welfare" absent consumption data.

  #### Trial 2: Cervical Screening (Letter Rewrite)
  *   **Data:** Attendance 34% $\rightarrow$ 39%. No feasible set change. Live reading suggests anxiety.
  *   **Filter 1 (Feasible Set):** Pass.
  *   **Filter 2 (Voluntariness):** **Fail.** The "live reading" indicating attendance expresses anxiety rather than preference suggests the choice may not be voluntary in the RP sense (coercion by distress).
  *   **Filter 3 (Stability):** **Fail.** No follow-up data to check if they attend repeatedly or once under duress.
  *   **Verdict:** **Inconclusive.**
  *   **Writing the Finding:** "Attendance increased by 5 percentage points. However, evidence suggests choices may be driven by anxiety rather than health valuation (Filter 2 Fail). Without follow-up data to confirm stable engagement (Filter 3 Fail), we cannot determine if this represents a welfare gain or increased distress compliance."
  *   **Board Flag:** Board must decide if "Health Outcome" trumps "Choice Process." The procedure cannot validate health outcomes without choice data.

  #### Trial 3: High-Cost Credit (Cooling-Off Period)
  *   **Data:** Borrowing reduced by 33%. 24-hour delay (Friction). No regret/default data.
  *   **Filter 1 (Feasible Set):** **Fail.** A mandatory delay is a cost/friction. It shrinks the effective choice set for those who do not wait.
  *   **Filter 2 (Voluntariness):** Pass.
  *   **Filter 3 (Stability):** N/A (Choice prevented).
  *   **Filter 4 (Error Correction):** **Fail.** You have no data on whether the stopped borrowers would have defaulted (regret) or repaid (benefit).
  *   **Verdict:** **Welfare Loss (Strict Choice Rule).**
  *   **Writing the Finding:** "The intervention added friction, reducing borrowing by 33%. Under the Choice Rule, restricting access to a previously available option constitutes a welfare loss for those prevented from borrowing, unless it corrects a proven error. We lack data on loan performance (default/repayment) to prove the prevented loans were errors. Therefore, for the 33% who did not borrow, we record a **Loss of Choice Freedom**. For the 67% who persisted, we record a **Cost Imposition** (time/hassle). Net welfare is **Negative or Inconclusive**."
  *   **Board Flag:** This contradicts the prior that "less credit = good." The procedure forces you to admit that without proof of harm (default data), stopping choice is a loss. To claim a gain, you need data showing the stopped loans would have defaulted.

  ---

  ### 5. Limitations Statement (Mandatory Appendix)

  Every finding must include this section to manage Board expectations.

  **This Procedure Cannot:**
  1.  **Sum Welfare:** We report counts of gainers and losers. We do not calculate a net social utility number. Aggregation is a political/value judgment reserved for the Board.
  2.  **Measure Intensity:** We know *that* someone chose A over B, not *how much* they preferred it. A large behavioural shift may represent trivial welfare gains if preferences were weak.
  3.  **Distinguish "Thick" Welfare:** We measure preference satisfaction, not health, autonomy, or dignity. If the Board values health over choice (e.g., forcing screening), the Board must override the Analyst's "Inconclusive" finding.
  4.  **Resolve Adaptive Preferences:** If a deprived group chooses a harmful option because they know no better (Filter 4 Fail), we record the choice. We do not paternalistically correct it without evidence of error.

  ---

  ### 6. Decision Matrix for Analysts

  | Scenario | Filter Outcome | Verdict | Who Decides? |
  | :--- | :--- | :--- | :--- |
  | **Nudge (Default)** | Stable Choice, No Friction | **Gain** | Analyst |
  | **Nudge (Default)** | Unstable Choice (High Reversal) | **Inconclusive** | Analyst |
  | **Friction (Delay)** | Reduced Uptake, No Error Data | **Loss** | Analyst |
  | **Friction (Delay)** | Reduced Uptake, High Default Data | **Gain** (Error Correction) | Analyst |
  | **Info (Debiasing)** | Choice Change, Info Verified | **Gain** | Analyst |
  | **Population** | Mixed Gainers/Losers | **Distribution Vector** | **Board** (Aggregation) |
  | **Coercion/Anxiety** | Voluntariness Compromised | **Inconclusive** | Analyst |

  ### 7. Director's Note on Implementation

  You will notice that Trial 3 (Credit) returns a verdict you dislike. **Do not change the verdict.**

  The Choice Rule was adopted to prevent us from making paternalistic claims without evidence. If we claim a welfare gain on the credit trial without data showing the stopped loans were harmful (defaults), we violate the Rule. We are claiming we know what is good for them better than they do, without proof they were mistaken.

  **To defend this to the Board:**
  1.  Show them the Filter 1 result: We added a cost.
  2.  Show them the Filter 4 result: We have no proof of error correction.
  3.  Offer a path forward: "We can upgrade this finding to 'Welfare Gain' if we are granted access to credit bureau data to track default rates of the treated vs. control group. Until then, strict adherence to the Choice Rule requires 'Loss/Inconclusive'."

  This shifts the burden from *your analysis* to *their data access*. It protects the Unit's integrity while offering a route to the desired conclusion if the evidence supports it.

  **Signed,**
  Director, Evaluation Unit
