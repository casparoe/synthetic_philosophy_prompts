  I run a small reading group — six philosophy grad students, a cosmologist, and a friend from machine learning — and we have spent two sessions stuck on what we have started calling the problem of ontology identification under inaccessible information. I have boiled our disagreement down to three cases, and in each one I want you to stipulate the following: the two candidate descriptions assign exactly the same probability to every possible observation that any agent in that world could ever make, they share all the same laws, and neither is more parsimonious at the level of laws — they differ only in what exists, and the difference is confined to information that is in principle inaccessible. Case 1, the Sealed Annex: given accelerated expansion there are regions of our universe from which no signal can ever reach us; hypothesis 1a says the statistical distribution of matter out there continues roughly as it does in our patch, galaxies and planets and perhaps minded creatures, while 1b says that at some fixed distance beyond our horizon matter density drops abruptly to zero and stays zero forever, the difference being only in which outcome of a genuinely chancy early-universe process was realized outside our patch. Case 2, the Long Recurrence: our final physics is a deterministic automaton with a finite state space, so every trajectory is ultimately periodic, and the two hypotheses differ about whether the cycle the universe eventually settles into contains any token of some ordinary natural kind, say an organism, where deciding the matter would require more computational steps than any physical process inside the universe can perform before heat death; note that here the discriminating fact is a perfectly well-defined mathematical fact about the trajectory and is merely computationally out of reach. Case 3, the Traceless Interval: a mature psychology holds that during dreamless sleep subjects undergo a long sequence of rich conscious states, and its variant holds