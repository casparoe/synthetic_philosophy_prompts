          *   (3) Psychological Continuity is one-to-many (Teleporter cases/Parfit).
          *   (4) Therefore, Identity $\neq$ What Matters (Parfit's conclusion).
          *   (5) Therefore, No deep fact about *my* future vs. *someone else's*.
          *   (6) Therefore, No special reason for prudence (studying, health, fear of death).
          *   (7) Conclusion: (6) is absurd, so *anatta*/Reductionism is false.
      *   **Teacher's Feedback:** Mentioned "some guy" (Derek Parfit) argued 3-5 and was fine with it, didn't end up at 6.
