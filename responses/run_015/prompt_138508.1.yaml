answer: |-
  **Insect Impact Assessment Protocol**

  **Step 1: Identify Levers**
  *Question:* Does the intervention change (a) Total Individuals (N), (b) Average Lifespan (L), or (c) Death Severity (S)?
  *Sufficient Answer:* Quantified direction (e.g., "N increases 100x," "S increases due to boiling").
  *Stop:* If no lever moves, approve.

  **Step 2: Assess Compensation**
  *Question:* Is mortality density-dependent (wild) or fixed (farmed/collection)?
  *Sufficient Answer:* "Wild" (compensatory) or "Farmed" (direct count).
  *Implication:* If Wild, individual survival is neutral; assess changes to total habitat capacity (N). If Farmed, individual survival counts directly.
  *Stop:* If Wild and capacity unchanged, approve.

  **Step 3: Calculate Flip Point**
  *Question:* What probability of sentience ($P$) makes the welfare cost exceed the intervention's benefit?
  *Sufficient Answer:* A threshold percentage (e.g., "If $P > 1\%$").
  *Hand-off:* If $P$ is within plausible bounds (e.g., 1–10%), flag for VP values judgment. State explicitly: "This is a risk tolerance decision, not scientific consensus."
  *Stop (No):* If $P$ required to approve is impossibly low (<0.01%), reject immediately.
  *Stop (Yes):* If $P$ required to reject is impossibly high (>50%), approve.

  **Case Applications**

  **1. Dining: Cricket vs. BSF Protein**
  *Levers:* N increases vastly (BSF smaller); L decreases; S increases (boiling).
  *Compensation:* Farmed (Direct count).
  *Flip Point:* <0.1%. Scale of N overwhelms feed efficiency gains.
  *Decision:* **Reject.** Welfare risk dwarfs cost savings unless sentience is deemed impossible.

  **2. Grounds: Turf to Pollinator Meadow**
  *Levers:* N increases orders of magnitude (capacity); L natural; S natural.
  *Compensation:* Wild (but capacity increases total deaths).
  *Flip Point:* Low. More habitat = more lives = more suffering events.
  *Decision:* **No.** Under welfare scope, increasing insect biomass increases total suffering risk. Ecological benefits do not offset welfare liabilities under this protocol. Committee must accept this conflict.

  **3. Teaching: Moth Euthanasia**
  *Levers:* N constant; S decreases (freezing vs. rapid).
  *Compensation:* Collection (Direct count).
  *Flip Point:* N/A (N is negligible).
  *Decision:* **Approve faster method.** Cost trivial; welfare gain clear regardless of $P$.

  **Values Hand-off**
  Where Flip Points are low (Cases 1 & 2), the Committee cannot decide factually. The VP must accept either: (a) insects are nonsentient objects, or (b) the sustainability budget must absorb welfare costs. This procedure isolates that choice; it does not resolve it.
