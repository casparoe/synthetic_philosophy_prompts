  8.  **Final Polish:** Ensure all constraints are met. (Ranking, specific sections, verdict, settling question). *Self-correction:* The user asked to be straight about where they are cheating. I need to point out that dismissing *all* cohort effects as age/period effects risks becoming a tautology.

  9.  (Final Review against constraints):
