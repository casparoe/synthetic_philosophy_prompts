prompt: |-
  i'm putting together a decision-tree handout for a seminar — we're stuck on whether sweden or norway is teh more liberal neighbour, and what'd actually settle the argument. don't write me an essay; build a tree that sorts people by what they actually believe, not by which label they like.

  start node: do you think the word 'liberal' means roughly the same thing in both countries, or does its sense shift across the border?

  from there, inject the iceberg framing i want: visible policy (tax rates, welfare design, market rules) is only teh tip, but there's a submerged 'liberal temperament' — tolerance for deviance from social norms, strength of conformity pressure, how dissent is treated in everyday life. so one branch should ask whether you weight that submerged part more heavily than the visible policy part.

  other diagnostic branches: is liberalism unidimensional or multidimensional? if multidimensional, which axes split them — economic freedom, social permissiveness, civic inclusion? do you settle the comparison with quantitative data, with popular self-identification surveys, or with institutional and constitutional genealogy?

  each leaf should carry a position name if it's a real stance people defend (e.g. 'Nordic social-liberal comparator', 'classical liberal on state-distance'), or 'unnamed' if it's just a logical combo that nobody actually holds. aim for about eight to ten leaves. flag any pair your tree genuinely can't separate — for instance, two different paths that both conclude 'it's axis-dependent, so neither wins outright' but for different reasons.

  audience is politics-curious undergrads, not specialists. keep it casual, use british spelling (behaviour, favour, etc.), and don't include bibliographies, reading lists, or citation requests — the point is that someone without web access could still map the space by reasoning. and yes, leave a typo or two in; it's part of teh brief.
