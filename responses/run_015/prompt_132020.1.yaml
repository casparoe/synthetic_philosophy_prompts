  ---

  ### LEAF LEGEND

  **Leaf 1: Classical Liberal on State-Distance**
  *Path: Same → Policy → Uni → Econ.*
  You think liberalism means 'small state'. Norway wins slightly on market freedom and privatisation. Sweden's big public sector looks illiberal to you.

  **Leaf 2: Nordic Social-Liberal Comparator**
  *Path: Same → Policy → Uni → Soc.*
  You think liberalism means 'freedom from want'. Sweden wins on welfare universalism. The state enables liberty rather than restricting it.

  **Leaf 3: Market-First Hybrid (Unnamed)**
  *Path: Same → Policy → Multi → Econ Trumps.*
  You admit there are social axes, but economic freedom is the only one that matters. Logical combo, but rare to ignore social norms entirely.

  **Leaf 4: Progressive Institutionalists**
  *Path: Same → Policy → Multi → Social Trumps.*
  You prioritise social permissiveness (LGBTQ+, drugs, speech). Sweden usually wins here; Norway is slightly more conservative on morals.

  **Leaf 5: Empirical Cultural Liberals**
  *Path: Same → Temperament → Quant → Tolerance.*
  You look at survey data on deviance. Swedes report higher tolerance for unconventional behaviour. Norway scores higher on trust, but lower on eccentricity.

  **Leaf 6: Communitarian Liberals (Unnamed)**
  *Path: Same → Temperament → Quant → Trust.*
  You argue liberty requires high social cohesion. Norway wins on trust metrics. Few people actually argue this defines liberalism, hence 'unnamed'.

  **Leaf 7: Secular Modernists**
  *Path: Same → Temperament → Genealogy → Secular.*
  You look at church attendance and secularisation. Sweden is radically secular; Norway kept the State Church longer. You favour the Swedish break from tradition.

  **Leaf 8: Unnamed (Logical Combo)**
  *Path: Same → Temperament → Genealogy → Church.*
  You argue Lutheran heritage created a specific type of ordered liberty. Nobody really claims the Church makes a country more liberal today, so this stance is empty.

  **Leaf 9: Contextual Absolutists (Unnamed)**
  *Path: Shifts → Yes.*
  You admit the word shifts, but insist on forcing one definition to make a winner. It's a logical possibility, but intellectually dishonest.

  **Leaf 10: Semantic Relativists**
  *Path: Shifts → No.*
  You conclude the comparison is meaningless. 'Liberal' is too loaded. Neither wins because the question is flawed.

  ---

  ### ⚠️ FLAGGED INDISTINGUISHABLE PAIR

  **Leaf 4 (Progressive Institutionalists)** and **Leaf 10 (Semantic Relativists)** can both end up at the conclusion: *"Neither country wins outright."*

  *   **Leaf 4** gets there because the axes clash (Sweden is socially freer, Norway is economically freer), so the result is **axis-dependent**.
  *   **Leaf 10** gets there because the language fails, so the result is **definition-dependent**.

  For your handout, make sure students see that arriving at "No Winner" via Leaf 4 is a substantive claim about policy, whereas arriving via Leaf 10 is a claim about language. Don't let them mix the two up.

  *(Also, check your spelling on 'neigbour' if you copy this elsewhere — kept one in for authenticity.)*
