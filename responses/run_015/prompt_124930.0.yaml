  1.3. Should the PPHO fail to reduce the candidate field to binary status, the election shall automatically trigger Protocol D (Dictatorial Resolution). To maintain compliance with the Non-Dictatorship clause, the role of Sole Decider shall rotate among all registered voters via a randomized algorithm executed every four (4) minutes. During their assigned interval, the Designated Decider's preference ordering shall supersede all aggregated ballots. This mechanism ensures Surjectivity, as every outcome remains theoretically reachable via the rotation schedule, provided the Decider does not suffer from indecision.

  1.4. Voters suspected of tactical voting—defined as submitting a preference ordering that maximizes utility rather than reflecting true sentiment—must appear before the Strategic Intent Tribunal. To prove compliance, the voter must submit Form 9-C: Affidavit of Non-Manipulative Intent. Section 4(b) of Form 9-C requires the voter to swear under penalty of perjury that their submitted ranking matches their internal utility function, regardless of external incentives. Failure to demonstrate genuine preference transparency will result in fines calibrated to the margin of victory influenced by the alleged manipulation.

  1.5. In the event that an election satisfies Unrestricted Domain and Non-Dictatorship but exhibits evidence of manipulability, the results shall be declared "Provisionally Valid." The Department reserves the right to nullify any outcome where a voter could have achieved a preferred result by insincerely ranking a less-preferred candidate higher. To prevent this, voters are encouraged to register their true preferences with the Department three (3) years prior to the election, allowing sufficient time for verification against future ballot submissions.

