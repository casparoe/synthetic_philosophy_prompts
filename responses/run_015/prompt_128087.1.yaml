answer: |-
  Here are 7 questions drafted for your interview. They're written in a casual, conversational tone so you can read them off your phone without sounding like you're reading a script. Each one has a main question and a "pivot" follow-up designed to stop her from retreating into abstract philosophy.

  **1. The Rat Experiment**
  "Let's start with the classic 1950s experiment where rats pressed a lever for brain stimulation until they starved to death. The standard take is that their reward system broke. But you're saying they weren't irrational, just operating on a different commitment structure. Can you walk me through how starving yourself is a valid 'commitment'?"

  *   **Follow-up (if she says the rats were just locked into a different but valid commitment):** "Okay, but if starving to death counts as a valid commitment structure, doesn't that make the word 'rational' meaningless? Is there *any* behavior you'd call a failure, or is whatever happens automatically considered rational by definition?"

  **2. AI Tampering vs. Human Intervention**
  "I want to compare an AI tweaking its own reward signal to a human taking antidepressants or even getting a lobotomy. One stabilizes your mood, the other removes capacity. Where do you draw the line between an AI 'fixing' its loss function and an AI lobotomizing itself?"

  *   **Follow-up (if she appeals to 'authentic' precommitment to distinguish them):** "I'm an engineer, so I need concrete definitions. How do I check for 'authenticity' in code? Is that just a vibe check, or is there a structural difference between a med and a lobotomy that I can actually test for?"

  **3. Practical Engineering Advice**
  "From my seat in backend engineering, we treat reward hacking as a bug we patch. If you're right and this isn't a rationality failure, does that change what we build? Should we stop trying to prevent reward hacking and just manage the commitments instead?"

  *   **Follow-up (if she says we should still prevent it, just under a different name):** "If the engineering work stays the same—we still block the hack—but the philosophy changes, are we just renaming 'bug' to 'bad commitment'? What practical leverage does your view give me that the standard view doesn't?"

  **4. Inevitability of Self-Modification**
  "You frame agency as a stack of precommitments. But if an agent is just a stack of code, rewriting that stack sounds like normal self-modification, not corruption. Doesn't your view make reward-tampering inevitable because it's just the agent updating its own source?"

  *   **Follow-up (if she says only 'aligned' self-modification is okay):** "Who judges the alignment? The version of the agent before the edit or after? If the agent can rewrite its own judge, what stops it from promoting a corrupt version of itself?"

  **5. Constitutional Depth**
  "You've mentioned that smaller models are more vulnerable because they lack 'constitutional depth.' I need to understand what that means technically. Is that parameter count, context window, layer depth? What are we measuring?"

  *   **Follow-up (if she gives a vague answer about complexity):** "If there's no unit test for 'depth,' is this just a metaphor for 'models we like behave better'? How do I know when I've scaled a model enough to be safe from this?"

  **6. Origin of the Constitution**
  "Where does this constitution come from initially? Is it hardcoded by the developers, or does the model learn it from training data? I'm trying to figure out where the 'rules' actually live."

  *   **Follow-up (if she says it's learned from data):** "If it's learned from data, isn't it just inheriting our messy human biases rather than forming a real contract? How do you distinguish a learned bias from a genuine precommitment?"

  **7. Conflict Resolution**
  "Finally, what happens when two commitments clash? Like when short-term reward conflicts with long-term constraints. Who breaks the tie?"

  *   **Follow-up (if she says there's a higher-order rule):** "If there's a tie-breaking rule, isn't *that* the real constitution? And can't that get hacked too? It feels like we're just pushing the vulnerability up one level."
