  hey, im a backend engineer with basically zero formal philosphy background — my only college exposure was a required ethics class i mostly slept through — and im moderating a small interview series at work. next week im talking to a philosopher who defends this niche view that wireheading and reward-tampering in AI arent actually rationality failures at all. she thinks they only look broken because we wrongly treat motivation as reward-maximization; instead she frames agency as a kind of constitutional precommitment structure, like Ulysses contracts but internalized across your future preference-sets. she applies it to both the old rat-lever experiments and to LLMs that rewrite their own loss functions, and she apparently thinks smaller models are more vulnerable because they lack "constitutional depth."

  i need you to draft about 7 interview questions that actually press her on this, not just let her restate the thesis. please include: one about those classic 1950s rat brain-stimulation experiments, with a follow-up keyed to her likely reply that the rats arent "irrational" but just locked in a different commitment structure; one comparing an AI that tampers with its reward signal to a human taking antidepressants or getting a lobotomy, with a follow-up if she tries to distinguish them by appealing to "authentic" precommitment; one asking what alignment engineers should actually do differently if shes right — like should we stop trying to prevent reward hacking?; one probing whether her view just makes reward-tampering inevitable, since if every agent is just a stack of precommitments then rewriting the stack is normal self-modification not corruption; and one about her claim that small LLMs are especially at risk due to lacking "constitutional depth" — ask what that actually means technically and whether its testable. please keep the tone casual since im gonna read these off my phone in the interview. dont ask for citations, bibliographies, or reading lists — i wont have access to check them live and i dont want her name-dropping papers at me. and make sure each main question has a tight follow-up that anticipates the standard defense she gives.
