  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two people (Mara and Theo) in a policy-and-philosophy reading group.
      *   **Topic:** Banning commercial production of photorealistic synthetic sexual material featuring only fictional adults (no real persons, consumed alone, no victim/offence if undiscovered) on grounds of public morality (not harm).
      *   **Format:** Six specific moves (arguments/counters) provided. Need to evaluate move-by-move (which land, which are weak/question-begging, where each is right about something the other sidesteps). Then determine who is more right overall. Finally, identify what both are missing.
      *   **Constraints:** Lead with the bottom line in the first sentence. No preamble. No restating the question. British English.
      *   **Tone:** Analytical, philosophical, adjudicatory.

  2.  **Analyze the Debate Moves:**

      *   **Move 1 (Mara):** "No victim, no crime" is insufficient because law already punishes victimless wrongs (animal cruelty, corpse mistreatment, incest, environmental offences). Society is entitled to protect its shared moral environment.
          *   *Strengths:* Correctly identifies that legal moralism exists in practice (Devlin vs. Hart). Points out inconsistency in strict harm principle applications.
          *   *Weaknesses:* Equating environmental/animal cruelty with "pure morality" is contested (often recast as harm/sentience). "Shared moral environment" is vague.
          *   *Verdict:* Lands a hit on strict libertarianism, but relies on contested analogies.

      *   **Move 2 (Theo):** Hart doesn't need pure harm principle; needs distinction between cooperative framework rules (coordination) vs. majority disgust. Self-regarding sexual conduct fails coordination audit. Animal cruelty/pollution can be recast as harm.
          *   *Strengths:* Refines Hart beyond crude utilitarianism. Coordination problem is a strong liberal justification for law. Recasting animal cruelty/pollution as harm is standard liberal defence.
          *   *Weaknesses:* "Coordination" might be too narrow for all legitimate law (e.g., redistribution?).
          *   *Verdict:* Strong rebuttal. Successfully distinguishes between structural norms and moral preferences.

      *   **Move 3 (Mara):** Coordination audit is useless because moral norms rely on mutual expectations too. Norm decay is like antibiotic resistance (evidence arrives too late). Precautionary principle applies to morals.
          *   *Strengths:* Insightful analogy (antibiotic resistance/norm decay). Highlights the lag between cause and effect in social cohesion.
          *   *Weaknesses:* Precautionary principle is notoriously difficult to apply without stifling change. Assumes decay is inherently bad without defining *which* norms matter.
          *   *Verdict:* Philosophically interesting, but practically dangerous. Good point on interdependence of norms.

      *   **Move 4 (Theo):** Precautionary reasoning is symmetric. Past moral panics (homosexuality, divorce) used same "fraying fabric" argument and were wrong. Need a way to distinguish real fraying from panic; "wait and see" isn't it.
          *   *Strengths:* Historical evidence is on Theo's side. Exposes the status quo bias in Mara's precaution. Demands a criterion for distinguishing valid vs. invalid moral fears.
          *   *Weaknesses:* Doesn't prove *this* case isn't different, just that the *argument form* has been abused.
          *   *Verdict:* Strongest move so far. Shifts burden of proof effectively.

      *   **Move 5 (Mara):** Test is irreversibility, not harm. Norms once lost can't be restored (unlike drugs). Law is expressive, not just instrumental (cite hate crime laws). Theo accepts expressivism elsewhere.
          *   *Strengths:* Expressivism is a valid legal theory (Feinberg/Duff). Irreversibility of cultural shifts is plausible.
          *   *Weaknesses:* "Irreversibility" is empirically dubious (norms return or shift). Equating hate crime laws (harm-based expressivism) with moral prohibition (pure expressivism) is a category error.
          *   *Verdict:* Clever pivot, but conflates different types of expressivism.

      *   **Move 6 (Theo):** Irreversibility cuts both ways (moral progress is also irreversible). Expressivism needs content validation; law can express protection without expressing despising. Doesn't get you to Devlin.
          *   *Strengths:* Dismantles the irreversibility claim (progress is also one-way). Clarifies expressivism (content matters).
          *   *Weaknesses:* Might underestimate the expressive cost of *not* banning (signal sent to traditionalists).
          *   *Verdict:* Solid closing. Maintains the burden of proof on Mara.

  3.  **Evaluate Overall Winner:**
      *   Theo seems to have the stronger philosophical footing. He successfully defends a modified liberalism (Hartian) against a Devlin-style legal moralism. He exposes the symmetry problems in Mara's precautionary and irreversibility arguments.
      *   Mara makes good points about the social embeddedness of norms and the expressive function of law, but fails to provide a non-arbitrary criterion for *which* morals to enforce.
      *   *Decision:* Theo is more right overall, but Mara identifies genuine blind spots in crude liberalism.

  4.  **Identify What Both Are Missing:**
      *   **Technology/Materiality:** Neither discusses the specific nature of "photorealistic synthetic material". Does this blur the line between fiction and reality in a way that creates *new* harms (e.g., normalisation of behaviour that spills over, difficulty in enforcement leading to real CSAM laundering)?
      *   **Power Dynamics:** Neither discusses who gets to define the "shared moral environment". Is it majority tyranny?
      *   **Enforcement Costs:** Banning private consumption/production of digital files is practically impossible without surveillance states.
      *   **The Specific Harm of "Normalization":** Mara hints at it (norm decay), but doesn't specify the mechanism. Theo dismisses it as panic, but doesn't address the specific psychological impact of photorealism vs. cartoons.

  5.  **Drafting the Response (incorporating constraints):**
      *   *First Sentence:* Bottom line (Theo wins, but Mara has points).
      *   *Move-by-Move:* Brief analysis of 1-6.
