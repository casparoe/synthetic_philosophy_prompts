      *   *Language:* British English (e.g., "criminalisation", "programme", "defence", "colour").
      *   *No Preamble:* Start immediately.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Check Move 1:* Mara is right that law isn't purely harm-based, but wrong to equate environmental harm with moralism.
      *   *Check Move 3:* The antibiotic analogy is Mara's strongest point. Need to acknowledge that.
      *   *Check Move 5:* The hate crime comparison is weak. Hate crimes enhance penalties for harm-based crimes based on motive; they aren't usually banning victimless moral wrongs. Theo catches this.
      *   *Missing:* The "photorealistic" aspect is crucial. If it's indistinguishable from real abuse, does that create a harm even if fictional? (Market confusion, evidentiary issues). Neither touched on the *tech* specifics enough.

  7.  **Final Polish (British English & Tone):**
      *   Ensure "criminalisation", "defence", "programme", "labour", "colour" etc. are used correctly if they come up.
      *   Keep it tight and authoritative.

      *Drafting the opening:* Theo carries the argument overall, though Mara successfully exposes the thinness of crude liberal individualism.
