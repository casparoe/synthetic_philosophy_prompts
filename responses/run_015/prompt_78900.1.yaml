answer: |-
  **Examination Question**

  **Question 1**
  Consider the following stipulation and cases regarding the nature of practical reasons:

  > **The Stipulation:** Holism about reasons is the claim that a feature which is a reason of a given valence for an action in one case may be a reason of the opposite valence, or no reason at all, in another case. Generalism denies this: it holds that a feature's valence is fixed wherever the feature occurs, and that any apparent reversal is always to be explained by some further feature acting as an enabling or disabling condition.
  >
  > **Case 1:** You have a free afternoon and could spend it practising the cello, which you enjoy. The fact that you would enjoy it is a reason in favour of doing it.
  > **Case 2:** A torturer enjoys inflicting pain on a victim, and the fact that he would enjoy it is a reason against his doing it.
  > *Instruction:* Treat these as the same feature ('the act would be enjoyable by the agent') occurring with opposite valence.
  > **Case 3:** A colleague has, as a matter of fact, always behaved generously towards you. In one scenario you know this; in the other you have exactly the same evidence about her past behaviour, but the evidence is misleading and her past generosity was feigned.
  > *Instruction:* This is presented as a reversal where the same feature is a reason to trust in one case and a reason not to trust in the other.

  Write an essay that addresses the following:
  1.  Specify what must be held fixed regarding the identity of a 'feature' for the holism claim to be substantive rather than a verbal trick.
  2.  Adjudicate whether Cases 1 and 2 successfully support the holist claim, given your specification in (1).
  3.  Diagnose the specific error in using Case 3 to support holism.
  4.  Evaluate whether a generalist can preserve their position by adopting universal principles with extensive exception clauses, and whether such principles retain the explanatory power generalism requires.

  **(25 Marks)**

  ***

  **Model Answer**

  For the holist claim to be substantive, the 'feature' in question must be identified non-evaluatively and consistently across contexts. If we describe the feature in Case 1 as 'enjoyable' and in Case 2 as 'sadistic pleasure', we have already built the valence into the description, rendering the reversal trivial. To avoid this verbal trick, the feature must be a neutral natural property, such as 'the agent experiences psychological satisfaction'. Only if this identical property counts for an action in one context and against it in another does holism pose a genuine challenge to the idea that reasons have invariant valences.

  Under this strict identification, Cases 1 and 2 provide strong support for holism. In both instances, the agent experiences psychological satisfaction. In the cello case, this satisfaction contributes positively to the choice; in the torture case, it contributes negatively. The generalist might argue that 'torture' is an enabling condition that flips the valence. However, the holist replies that the satisfaction itself changes its normative direction depending on the context. There is no stable 'pro tanto' reason provided by satisfaction alone; its normative force is constituted by the surrounding situation. If the generalist insists the valence is fixed, they must argue that the feature in Case 2 is not actually 'satisfaction' but 'satisfaction-in-torture', which risks collapsing back into the verbal trick of loading the description.

  Case 3, however, fails to support holism because it confuses ontological grounds with epistemic access. The instruction claims the 'same feature' is present in both scenarios. If the feature is 'past generosity', it does not exist in the second scenario where the generosity was feigned. A non-existent fact cannot be a reason. If the feature is 'evidence of past generosity', then the feature *is* identical in both cases, but its valence does not flip regarding the *rationality of belief*. In both cases, the evidence is a reason to *believe* she is trustworthy. The error lies in conflating the reason for trust (the actual character) with the reason for believing she has that character (the evidence). Holism concerns the variability of reasons, not the variability of truth conditions. Therefore, Case 3 demonstrates a failure of factivity, not a failure of valence invariance.

  Finally, can the generalist absorb this by writing hedged universal principles? They might propose: 'Satisfaction is a reason for action unless the action is immoral, harmful, etc.' While logically possible, this strategy sacrifices the explanatory power principles are meant to provide. A principle that requires an infinite or highly disjunctive list of exception clauses ceases to guide judgement; it merely summarizes outcomes. The generalist claims principles explain *why* an action is right. If the principle is 'Satisfaction counts unless it doesn't', it offers no independent grip on the normative landscape. It becomes a placeholder for the particularist's contextual judgement. However, the generalist may retort that enabling conditions are systematic, not ad hoc. If 'harm' systematically disables 'satisfaction', the principle retains structure. Yet, if the holist is correct that the valence itself flips rather than being disabled, the hedged principle misrepresents the normative reality. It treats context as an external switch rather than a constitutive element of the reason's force. Thus, while the generalist can technically save the form of universalism, they risk emptying it of the guidance and explanation that motivated generalism in the first place.

  ***

  **Marking Scheme**

  | **Required Move** | **Marks** | **Characteristic Error** |
  | :--- | :---: | :--- |
  | **1. Feature Identity:** Identifies that features must be described in neutral, non-evaluative natural terms to avoid begging the question. | 5 | Treating 'enjoyment' and 'sadistic pleasure' as distinct features without argument. |
  | **2. Cases 1 & 2:** Argues that these cases support holism because the natural property remains constant while normative force flips. | 5 | Claiming the valence change is due to a change in the definition of enjoyment. |
  | **3. Case 3 Diagnosis:** Distinguishes between factive reasons (generosity) and epistemic reasons (evidence), showing the feature is not identical. | 5 | Treating misleading evidence as a negative reason for trust rather than a positive reason for belief. |
  | **4. Hedged Principles:** Evaluates whether exception-laden principles retain explanatory power or merely summarize outcomes. | 5 | Dismissing generalism solely on the complexity of exceptions without addressing explanatory loss. |
  | **5. Coherence:** Essay is structured logically, connecting the definition of features to the assessment of the generalist reply. | 5 | Addressing the four prompts as disconnected short-answer fragments. |
  | **Total** | **25** | |

  ***

  **Note on Grading Boundaries**

  The boundary between an **A (20–25)** and a **B (15–19)** lies in the treatment of the generalist's reply (Move 4). A **B** answer will correctly identify that hedged principles are cumbersome but may accept that they are theoretically viable if complex enough. An **A** answer will press the point that explanatory power is lost if the principle cannot be stated independently of the specific contexts it governs, recognizing that a principle which requires knowing the outcome to apply the exception clause fails to guide action. Additionally, **A** answers will handle the distinction in Case 3 with precise terminology (factive vs. epistemic) rather than vague appeals to "truth."
