answer: |-
  First, take a breath. You haven't landed yourself in it; you've landed yourself in *exactly* the right place. This is a classic pedagogical moment. The fact that you shouted in the kitchen means you care about the nuance, and the fact that you're asking for a game rather than a slide deck means you understand that biology is a process, not a definition.

  The beekeepers will forgive a messy explanation if you give them a messy *experience* that resolves itself. They trust data they generated themselves far more than data you project.

  Here is a complete design for **"The Swarm Game."** It requires no projector, uses your specified materials, and forces the "levels of selection" conflict to emerge from the arithmetic of the room.

  ### 1. The Materials
  *   **Counters:** 200+ small counters in two colours (e.g., **Blue** and **Red**).
      *   *Blue:* "Cooperators" (Workers).
      *   *Red:* "Selfish" (Layers).
  *   **Sweets:** 4 bags of cheap, countable sweets (e.g., mints). This is "Resource."
  *   **Containers:** One large bowl (the "Environment"), small bowls for each table (the "Hives").
  *   **Score Sheets:** Two types (Type A and Type B).
  *   **Stickers:** Gold star stickers (for the "Third Level" wrinkle).
  *   **Room:** Tables arranged in clusters of 4–5 people.

  ### 2. The Setup (00:00 – 00:10)
  **Do not explain evolution.** Do not explain bees.
  Tell them: *"We are running a resource management simulation. You are managing Hives. Your goal is to have the most presence in the room after 4 rounds."*

  1.  **Divide the Room:** Split the tables into two halves.
      *   **Half the tables (Type A):** Give them score sheets that ask for **"Average Resources Per Bee."**
      *   **Half the tables (Type B):** Give them score sheets that ask for **"Total Resources In Hive Pot."**
      *   *Crucial:* Do not tell them the other half has a different sheet yet.
  2.  **Distribute Hives:** Give each table a bowl with 10 counters (mix of 7 Blue, 3 Red to start).
  3.  **The Rules (Write on a flipchart or read out):**
      *   **Foraging:** Each Blue counter produces 3 sweets for the **Hive Pot**. Each Red counter produces 1 sweet for the **Hive Pot** but takes 1 sweet for its **Personal Stash**.
      *   **Growth:** At the end of the round, every 2 sweets in the **Hive Pot** buy 1 new counter for the table. (New counters match the majority colour of that table).
      *   **Survival:** Any counter without at least 1 sweet in its **Personal Stash** dies (remove from game). *Note: Blues have 0 personal sweets, so they rely on a 'Hive Subsidy' rule: If the Hive Pot has >10 sweets, the table can feed 1 sweet to up to 5 Blues to keep them alive.*
      *   **The Third Level (The Parasite):** Stick a gold star on 2 Red counters in the whole room *secretly*.
          *   *Rule for Star:* A Star counter takes 2 sweets for Personal Stash (instead of 1) and contributes 0 to the Hive Pot. It replicates itself automatically if it survives.

  ### 3. The Game Loop (00:10 – 00:40)
  You are the "Environment." You control the **Assortment Dial** (how new hives are formed).

  **Round 1 (The Scramble):**
  *   Tables play the Foraging/Growth/Survival phase.
  *   **Regrouping:** Collect *all* counters from *all* tables into the big central bowl. Mix thoroughly. Deal 10 random counters back to each table.
  *   *Effect:* This destroys correlation between group success and group composition. Variance between groups is near zero.
  *   *Prediction:* Reds increase globally. Blues die out because they get diluted into groups where they can't reach the subsidy threshold.

  **Round 2 (The Scramble Again):**
  *   Repeat Round 1.
  *   *Check-in:* Ask Type A tables: "Are you winning?" (Likely yes, if Reds dominate). Ask Type B tables: "Are you winning?" (Likely no, total resources dropped).
  *   *Tension:* The room should feel like it's collapsing.

  **Round 3 (The Swarm - Turn the Dial):**
  *   **Announce:** *"Weather change. Hives now reproduce by Swarming."*
  *   **Regrouping:** Do **not** mix the big bowl.
      *   Identify the 3 tables with the largest **Hive Pots** (Type B metric).
      *   These 3 tables "swarm." They keep half their counters and pass the other half to seed new empty tables.
      *   The bottom 3 tables (lowest Pots) go "extinct." Their counters are removed.
      *   Fill the remaining spots with copies of the successful groups.
  *   *Effect:* High variance between groups is preserved. Successful groups (mostly Blue) replicate.
  *   *Prediction:* Blues surge globally, even though within every single table, the Reds still have more personal sweets.

  **Round 4 (The Swarm Again):**
  *   Repeat Round 3.
  *   *Observation:* By now, the room should be mostly Blue, but the "Star" Reds (if they survived) might be disproportionately common relative to normal Reds.

  ### 4. The Data Crunch (00:40 – 00:50)
  Get them to count.
  1.  **Global Count:** Total Reds vs. Total Blues in the room.
  2.  **Local Count:** Look at a single table. Count Reds vs. Blues.
  3.  **The Currency Conflict:** Ask a Type A table holder to stand. Ask a Type B table holder to stand.
      *   Ask: *"Who had the most successful strategy?"*
      *   Type A will point to the Reds (high average personal sweet).
      *   Type B will point to the Blues (high total pot).
  4.  **The Parasite:** Find the Gold Star counters. Are they more common than regular Reds? (They should be, they cheated harder).

  ### 5. The Debrief (00:50 – 01:20)
  *This is where you unlock the words.*

  **Step 1: The Levels (Mapping the Game)**
  *   **Ask:** *"In Round 1, who won?"* (The Red counter). *"Why?"* (Because inside the hive, it kept more sweets).
  *   **Ask:** *"In Round 3, who won?"* (The Blue counter). *"Why?"* (Because the hives with more Blues made more new hives).
  *   **The Reveal:** *"You just simulated the conflict between **Individual Selection** (Round 1) and **Group Selection** (Round 3). In Round 1, I scrambled you. That killed the differences between tables. In Round 3, I let successful tables clone themselves. That amplified the differences between tables."*
  *   **Key Concept:** Selection only happens at the group level if there is *variation between groups*. If you scramble (low relatedness), group selection fails. If you swarm (high relatedness), group selection works.

  **Step 2: The Currency (Mapping the Score Sheets)**
  *   Address the Type A vs. Type B conflict.
  *   **Say:** *"Half of you scored by Average, half by Total. This is the 'Superorganism' debate. If you view the hive as a collection of individuals, the Red strategy looks better. If you view the hive as a single unit competing against other hives, the Blue strategy looks better."*
  *   **Insight:** *"Biology doesn't care which scorecard you use. It only cares which one matches how reproduction actually happens. In bees, hives split (swarm). That makes the 'Total Pot' scorecard the one that matches reality."*

  **Step 3: The "Sisters" Objection (Handling the Expert)**
  *   Someone *will* say: *"But in real life, workers are sisters. You can't just scramble them like mints."*
  *   **Do not concede.** Turn it back.
  *   **Ask:** *"Exactly. In the game, what mechanical rule stopped the scrambling in Round 3?"*
  *   **They will say:** *"The Swarming rule."*
  *   **You say:** *"And in biology, what mechanical rule stops the scrambling?"*
  *   **They will say:** *"Family/Genetics."*
  *   **You say:** *"Precisely. **Relatedness** is just the biological mechanism that creates the **Assortment** we simulated in Round 3. Kin Selection and Group Selection are arguing over whether to name the mechanism (genes) or the outcome (groups). You just proved they are two ways of counting the same sweets."*

  **Step 4: The Third Level (The Gold Star)**
  *   **Ask:** *"What about the Gold Stars?"*
  *   **Explain:** *"That was a 'Selfish Genetic Element' (like meiotic drive). It helped itself, hurt the individual (Red), and hurt the colony (Blue). It shows there's a level *below* the individual too. Sometimes the gene wins, and everyone loses."*

  ### 6. Risk Management (What will go wrong)

  **1. "You rigged the Swarm round."**
  *   **Prediction:** Practical beekeepers hate artificial constraints.
  *   **Fix:** Own it. *"Yes, I rigged the physics. In Round 1, I made a world where families don't matter. In Round 3, I made a world where families matter. The point is to see how the outcome flips when the *structure* changes, not to simulate a perfect hive."*

  **2. The Maths Teachers vs. The Beekeepers.**
  *   **Prediction:** Maths teachers will try to calculate the Price Equation. Beekeepers will say "Bees don't do maths."
  *   **Fix:** Assign roles early. Tell the Maths teachers: *"I need you to be the Auditors. Check the counts."* Tell the Beekeepers: *"I need you to be the Managers. Decide how to feed the blues."* Give them shared ownership of the data.

  **3. "It's just numbers, it explains nothing."**
  *   **Prediction:** Cynicism that the model is too abstract.
  *   **Fix:** In the close, say: *"You're right. This is arithmetic, not biology. But biology has to obey arithmetic. If your theory of bee behaviour violates the math we just did, the theory is wrong. We didn't solve the biology today; we just found the cage the biology has to live in."*

  **4. Running out of time.**
  *   **Prediction:** Counting sweets takes forever.
  *   **Fix:** Pre-bag the sweets in lots of 10. Don't count individual mints. If you hit 60 minutes, cut Round 4. Three rounds are enough to show the flip.

  ### 7. The Hard Truth (How to close without deflating)
  You mentioned the arithmetical equivalence. You must say this, or the maths teachers will hate you.

  **Say this:**
  *"I need to be honest. Some of you might read papers where one side says 'It's all Kin Selection' and the other says 'It's all Multilevel Selection'. They will fight like cats and dogs. But what you did today shows they are translating the same equation into different languages. One counts the genes moving (Kin), one counts the groups surviving (Multilevel). Neither is 'more real'. But..."*

  **...Pause for effect...**

  *"...the mistake my family made at Christmas, and the mistake many scientists make, is picking the language that fits their ideology rather than the language that fits the *biology*. If the bees swarm, talk about groups. If the bees mate randomly, talk about genes. The math doesn't care. But the bees do."*

  ### Summary Checklist for You
  1.  **Ban yourself:** Tape your mouth shut (metaphorically) regarding "Kin/Group" until minute 50.
  2.  **Control the Dial:** Be dramatic when switching from Scramble to Swarm. This is the pivot point of the whole session.
  3.  **Validate the Conflict:** When they argue about the scorecards, smile. That argument *is* the lesson.
  4.  **The Sister Insight:** Wait for them to tell you that Swarming = Family. If you tell them, it's a lecture. If they tell you, it's a discovery.

  You're going to be fine. You're not teaching them the answer; you're giving them the experience of the question. That's how adults learn. Good luck in March.
