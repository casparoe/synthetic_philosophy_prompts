answer: |-
  The fact that screening alters which specific person exists prevents natural conception from being classified as harmful to the child, establishing a middle ground where IVF is morally preferable but natural conception remains permissible. Your partner's argument relies on an impersonal assessment of outcomes, suggesting that a world with less suffering is inherently better, but this overlooks the non-identity problem: the child conceived naturally cannot claim they were wronged because the alternative was not a healthy existence for them, but non-existence. Moral harm typically requires making a particular person worse off than they would otherwise have been, and since the naturally conceived child enjoys a life they prefer to non-existence, no person-affecting harm occurs despite the presence of moderate suffering.

  This distinction creates space for a duty gradient rather than a binary prohibition. While there is no strict duty to bring the "best" possible child into existence—a principle known as procreative beneficence—there is a recognized moral value in minimizing preventable suffering when the costs to the parents are not excessive. IVF with screening is therefore the more virtuous choice because it reduces the aggregate amount of suffering in the world without sacrificing the interests of an existing person, but it functions as a supererogatory act rather than a mandatory obligation.

  Treating IVF as obligatory conflates the duty to avoid harming existing people with the much weaker duty to optimize potential people. The physical, emotional, and financial burdens of IVF are significant, and requiring them as a condition for permissible procreation imposes a heavy tax on reproductive liberty that is not justified by the risk of moderate suffering alone. If the genetic variant resulted in a life not worth living, natural conception would be impermissible because it would inflict a wrongful life, but since the life is deemed worth living, the risk falls within the acceptable range of parental discretion.

  Ultimately, you can acknowledge your partner's intuition that reducing suffering is good without accepting the conclusion that creating a happy but suffering child is wrong. The ethical compromise lies in recognizing that while selecting for health is morally commendable, accepting the genetic lottery is not morally condemnable provided the resulting life meets the threshold of being worth living. This respects the asymmetry you feel: you have no duty to create a happy child, but if you do create a child, you must ensure their life is not so burdened that non-existence would have been preferable.
