answer: |-
  Dear Colleague,

  It is a genuine pleasure to engage with this proposal, not least because you have identified the precise friction point where clinical practice often grinds against philosophical coherence. The drift you describe, where affection leads to over-management and fear leads to inappropriate moralizing, is a classic failure of consistency that a Strawsonian framework is well-suited to correct. What follows is an attempt to translate the architecture of Freedom and Resentment into a workflow that can survive the pressures of a fifteen-minute case round, while preserving the critical distinction between excuses and exemptions that you rightly identify as the locus of most errors. I have written this as a continuous protocol that you can read aloud or distribute, followed by the application to your three cases and a note on the inherent limits of such a tool.

  To begin the procedure, you must instruct your staff to suspend the question that naturally arises in every forensic setting, which is whether the service user was metaphysically free to do otherwise. Strawson's central insight is that this question is idle for our purposes because our practices of blame and management are not answerable to a theoretical proof of determinism or free will. They are answerable only to the viability of interpersonal relationships. Therefore, the first instruction in the procedure is a prohibition: if a staff member asks whether the service user could have done otherwise in a cosmic sense, the answer is that the procedure has nothing to say about it and they must move on. This prevents the discussion from collapsing into metaphysical speculation that no amount of clinical evidence can settle.

  Once that distraction is removed, the first substantive question concerns exemption. You must ask whether there is evidence that the service user is currently incapable of participating in ordinary adult interpersonal relationships. This is not about whether they are difficult, or dangerous, or even whether they are symptomatic, but whether their condition renders them an unsuitable subject for moral address. In Strawson's terms, this asks if they are exempt from the moral community due to psychological immaturity, profound psychosis, or overwhelming compulsion that destroys agency. If the answer to this question is yes, meaning there is clear evidence of such incapacity, the procedure stops here and the stance must be management. You treat the behavior as something to be controlled or compensated for, and you deliberately drop the language of blame. A sufficient answer here, when information is lacking, is the consensus of the team based on the most recent psychiatric assessment regarding capacity and psychosis; if the consultant psychiatrist has not flagged a loss of capacity, the default assumption must be that no exemption applies.

  If the answer to the exemption question is no, meaning the service user is considered capable of moral address, the procedure moves to the second question, which concerns excuses. You must ask whether there are specific factors regarding the incident in question that negate the implication of ill will, such as accident, coercion, or lack of knowledge. It is vital that your staff understand that if an excuse is found, the stance remains moral-protest, but the content of that stance changes from resentment to forgiveness or mitigation. An excuse keeps the person inside the moral community; it does not shift them to the management stance. If the answer to this question is yes, meaning a valid excuse exists, the procedure stops here regarding the stance selection, confirming a moral-protest stance but dictating that the emotional tone be one of forgiveness rather than reproach. If the answer is no, meaning no valid excuse applies, the default position is a full moral-protest stance where demands and reproach are permissible.

  However, there is a point in this sequence where the procedure cannot dictate the outcome based on facts alone, and you must mark this explicitly for your staff. Once the exemption and excuse questions are settled, there remains a value judgment that has to be handed to a person rather than settled by the test. This is the question of whether adopting the morally warranted stance is clinically safe or therapeutically useful in the coming month. Even if a service user is not exempt and has no excuse, there may be reasons of risk management or therapeutic alliance that require a temporary suspension of moral address. This is not a philosophical question but a clinical one, and when the team makes this decision, it must be recorded as a value judgment override rather than a finding of fact. A sufficient answer here is a documented rationale that references specific risks or treatment goals, ensuring that the drift you fear is caught by the requirement to justify the deviation from the philosophically warranted stance.

  Applying this procedure to your first case, the man with bipolar disorder who incurred debts and made threats during hypomania, yields a clear distinction between the past episode and the present moment. During the hypomanic episode, the exemption question would have been answered yes, as the severity of the mood disorder likely rendered him incapable of ordinary interpersonal relationships, warranting a management stance at that time. However, he is now well and ashamed. The procedure asks about his current capacity for moral address, and the answer is no, he is not currently exempt. Therefore, the stance for the coming month must be moral-protest. This validates his mother's insistence that he be held to account, not because we resent the man he was during the psychosis, but because holding him to account is how we acknowledge his return to the moral community. The procedure tells you to treat the past acts as exempted but the current person as liable for future commitments, allowing you to support his shame as a sign of reintegration rather than treating it as a symptom to be managed.

  The second case, the woman with emotionally unstable personality disorder whose team has habitually managed her, reveals the exact injury you suspect. When you run her through the procedure, you must ask if her diagnosis constitutes an exemption. In Strawson's framework, a personality disorder, unless it involves psychosis or severe cognitive impairment, does not typically remove a person from the moral community. It may explain behavior, but it does not exempt her from moral address. Therefore, the answer to the exemption question should be no. Your team has been answering yes implicitly, treating her as an object to be managed rather than a subject to be addressed. The procedure will tell you plainly that this is a withdrawal of moral address that you have no business making on philosophical grounds. You have been protecting yourselves from the difficulty of engaging with her resentment by objectifying her, and while this may feel kind, it is a form of exclusion that denies her agency. The procedure dictates that you shift to a moral-protest stance, engaging with her breaches as commitments she is expected to keep, unless there is a specific value judgment override regarding immediate safety risks.

  The third case, the man who invokes his diagnosis to evade promises, tests the boundary between claim and fact. When he says it was not him but the illness, he is claiming an exemption. The procedure requires the staff to verify this claim against the evidence of his current capacity. If the evidence shows he is currently capable of moral address, the answer to the exemption question is no, and his claim is treated as an attempt to offer an excuse where none exists. Here, his own self-reactive attitudes matter; if he feels shame, he is acknowledging his membership in the moral community, and his attempt to evade it should be met with a gentle but firm insistence on his agency. If he feels no shame and insists on the exemption despite evidence to the contrary, the staff must maintain the moral-protest stance to prevent the erosion of his own sense of self. The procedure tells you that you cannot simply switch on an exemption because a service user claims one; the exemption must be grounded in the actual capacity for relationships, not the desire to avoid blame. Your resentment in this case is not a failure of professionalism but a appropriate participant reactive attitude signaling that you regard him as responsible.

  Finally, I must be clear about what such a procedure cannot do, so that you do not expect it to solve problems it was not designed to address. It cannot predict risk, and it cannot tell you whether a service user will become violent if held to account; that remains a clinical judgment separate from the moral stance. It cannot force your staff to feel resentment or forgiveness when they do not naturally feel it, though it can guide the language they use in documentation and conversation. It cannot resolve the tension between the rights of the service user and the safety of the public when those two come into direct conflict, other than to clarify whether the conflict is being managed through moral address or objective control. Most importantly, it cannot answer the question of whether a particular service user deserves respect; it operates on the presumption that they do, unless an exemption is proven. If your staff ask whether the procedure guarantees a good outcome, the honest answer is that it does not, because it only guarantees coherence between your philosophical assumptions and your clinical actions, leaving the uncertainty of human relationships exactly as unanswered as it was before.

  I hope this draft serves as a robust foundation for your team's discussions. It is a demanding framework, but it seems to me that your practice is already demanding enough to warrant the precision it offers.

  Warmly,

  Your Colleague
