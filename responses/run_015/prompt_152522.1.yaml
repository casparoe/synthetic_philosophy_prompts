      *   *The Limitations:* Conclude with what remains unanswered.
      *   *Formatting Check:* Scan for any bolding, bullets, headings. Ensure plain text only.

      *Self-Correction on Formatting:* I must be extremely careful not to use markdown bullets or bolding. I will use transitional phrases like "The first step is," "Next," "Finally."

      *Self-Correction on Strawson:* Ensure I don't misrepresent Strawson. Exemptions are about capacity to participate in ordinary interpersonal relationships (psychosis, extreme immaturity, extreme compulsion). Excuses are about specific actions (accident, coercion). The user wants to know when to drop moral address (Management) vs keep it (Moral). This maps to Exemption (Management) vs No Exemption (Moral). Excuses modify the moral response but keep the stance moral.

      *Refining the "Value Judgment" marker:* I need to explicitly say "This is a value judgment" in the text.
      *Refining the "Stop" marker:* I need to explicitly say "If the answer is no, the procedure stops here."
      *Refining the "Sufficient Answer" marker:* I need to say "A sufficient answer here is..."

      *Case 1 (Bipolar):* During mania -> Exemption (Management). Now well -> No Exemption (Moral). Mother's demand is for Moral stance (reintegration).
      *Case 2 (EUPD):* Team is using Management (Objective). Procedure should ask: Is there an Exemption? Personality disorder alone is usually not an exemption in Strawson's view unless it destroys rational agency. If no exemption, they should be using Moral stance. The team is wrongly exempting her.
      *Case 3 (Diagnosis invocation):* Claiming Exemption. Staff must verify. If valid -> Management. If invalid -> Moral. His shame/resentment matters for the *quality* of the moral stance.

      *Limitations:* Risk assessment, resource allocation, the feeling of resentment itself (can't mandate feelings).

      *Tone Check:* "Careful email to a colleague." Needs to be respectful, collaborative, not preachy.

      *Length:* Needs to be substantial enough to cover all points but flow as prose.

      *Final check on constraints:* NO BOLD. NO LISTS. NO HEADINGS. NO TABLES.

      *Let's write.*

