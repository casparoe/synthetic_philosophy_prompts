          *   New Payoff for Defecting: $T - 2k$ (assuming they exit) or $T$ (if they stay). But why stay? If exiting is optional, they will only exit if it benefits them. If exiting has *only* a cost and no benefit (because no future rounds), a rational agent will *never* exit.
