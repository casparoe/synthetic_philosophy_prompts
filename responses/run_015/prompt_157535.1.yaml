      *   **Verdict:** IPD is not redundant. OSEC explains cooperation under *enforcement*. IPD explains cooperation under *anarchy* (provided there is memory). The critique that IPD smuggles partner selection is correct but irrelevant; partner selection *is* the mechanism of social cooperation.
      *   **Wait, I need to be sharper on the "Redundant" angle.** If OSEC solves it in one shot, is the complexity of IPD unnecessary?
