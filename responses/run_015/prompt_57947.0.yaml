answer: |-
  **To:** Lead Author
  **From:** Editorial Assistant (AI)
  **Subject:** Speech Act Audit Procedure & Scene Analysis
  **Date:** 24 May 2024

  ### Introduction

  You have asked for a tool to ensure that when your characters speak, they do what they say they are doing. In philosophy, this is the study of *illocutionary acts*. In the novel, it is the difference between a scene that feels binding and one that feels hollow.

  Below is the **Illocutionary Audit**. It translates the technical distinctions of J.L. Austin and John Searle into a practical checklist for revision. It is designed to be run in ten to fifteen minutes per scene. It is not a substitute for your intuition, but a stress-test for your logic.

  ***

  ### The Illocutionary Audit (Plain-Language Procedure)

  **Step 1: Identify the Intended Act**
  *   **Question:** What specific thing is the speaker trying to *do* with these words? (e.g., bet, order, marry, promise).
  *   **Sufficient Answer:** A single verb. If you cannot name the verb, the act is likely descriptive (constative), not performative.
  *   **Stop:** If the act is merely describing the world (e.g., "It is raining"), the audit ends. This tool is only for *doing* things.

  **Step 2: Check the Authority (Institutional vs. Interpersonal)**
  *   **Question:** Does this act require a specific status, office, or institution to work?
  *   **Sufficient Answer:**
      *   *Institutional:* Requires a role (Judge, Priest, Captain, Employer).
      *   *Interpersonal:* Requires only a relationship (Friends, Lovers, Strangers).
  *   **Stop:** If *Institutional*, proceed to Step 3A. If *Interpersonal*, proceed to Step 3B.

  **Step 3A: Authority Check (Institutional Acts Only)**
  *   **Question:** Does the speaker currently hold the valid authority required by the context (law, religion, hierarchy)?
  *   **Sufficient Answer:** Yes (Valid licence/rank) or No (Lapsed/fake/revoked).
  *   **Verdict:** If **No**, the act is a **Misfire** (it is void). *Exception: Authorial Override (see Step 6).*

  **Step 3B: Authority Check (Interpersonal Acts Only)**
  *   **Question:** Is the relationship strong enough to sustain this act? (e.g., Can a stranger bequeath you their estate? No. Can they promise to meet you? Yes.)
  *   **Sufficient Answer:** Yes, the social bond supports the weight of the act.
  *   **Verdict:** If **No**, the act is a **Misfire** (it lacks standing).

  **Step 4: The Formula and Uptake**
  *   **Question:** Were the necessary words spoken, and did the listener understand them as performing that act?
  *   **Sufficient Answer:**
      *   *Formula:* Did they use the conventional phrasing? (e.g., "I bet" vs. "I wonder").
      *   *Uptake:* Did the listener 'catch' the act? (Did they nod, accept, flinch, or obey?)
  *   **Verdict:** If the words were too vague *or* the listener treated them as chatter, the act is a **Misfire** (no uptake).

  **Step 5: Sincerity vs. Effect**
  *   **Question:** Is the speaker lying or joking, and does that matter for the plot?
  *   **Sufficient Answer:**
      *   If they are lying but the act stands (e.g., a false promise is still a promise), it is an **Abuse** (valid but insincere).
      *   If they are acting (e.g., rehearsing a line), it is a **Misfire** (non-serious).
  *   **Verdict:** Distinguish between a broken promise (plot point) and no promise made (logic error).

  **Step 6: Authorial Override**
  *   **Question:** Does the narrative require this act to stand despite a 'Misfire' verdict above?
  *   **Instruction:** If you override, you must plant a justification in the text (e.g., "The law didn't recognise it, but *they* did").
  *   **Sign-off:** Author must initial this decision.

  ***

  ### Limitations and Risks

  Be aware that this procedure simplifies complex philosophy for the sake of narrative utility.
  1.  **The 'Magic' Risk:** The audit treats words as mechanical. In life, tone and history matter more. The procedure may flag a scene as a 'Misfire' when a subtle glance would suffice in reality. Trust your ear over the checklist if the emotional truth is strong.
  2.  **The 'Uptake' Trap:** The procedure insists the listener must understand the act for it to land. In fiction, dramatic irony often relies on the listener *not* understanding. Use Step 6 to manage this.
  3.  **Institutional Rigidity:** The audit assumes institutions (law, church) work logically. In your world, they might be corrupt or broken. The procedure assumes standard rules unless you specify otherwise.

  ***

  ### Worked Applications

  Here is the audit applied to your three draft scenes.

  #### Scene 1: The Bet (Leeds Pub)
  *Context: Estranged brothers. Elder: "Fifty quid says Dad walks out before midnight." Younger: Laughs, nods, orders pint. Later dispute on validity.*

  *   **Step 1 (Act):** Betting.
  *   **Step 2 (Authority):** Interpersonal. No licence needed, just mutual agreement.
  *   **Step 3B (Standing):** Sufficient. Brothers can bet with brothers.
  *   **Step 4 (Formula & Uptake):**
      *   *Formula:* "Fifty quid says..." is conventional. Pass.
      *   *Uptake:* The younger laughs and nods, but orders a pint. He does not say "Done" or put money down.
      *   *Analysis:* A nod can be uptake, but laughter often signals 'joking' or 'dismissal'. Ordering a pint changes the subject.
  *   **Step 5 (Sincerity):** Elder seems serious. Younger seems ambiguous.
  *   **Step 6 (Verdict):** **Procedural Misfire (Ambiguous Uptake).**
      *   *Reasoning:* For a bet to be binding, acceptance must be clear. The laugh undermines the commitment.
      *   *Narrative Consequence:* This supports your subsequent chapter where they dispute the bet. The text successfully creates the ambiguity required for the conflict.
      *   *Action:* No change needed. The 'hollowness' is the point.

  #### Scene 2: The Order (Coastal Freighter)
  *Context: Captain to Deckhand. "It would be nice if that hatch were secured before dark." Deckhand hears observation. Accident follows.*

  *   **Step 1 (Act):** Ordering.
  *   **Step 2 (Authority):** Institutional (Ship Hierarchy).
  *   **Step 3A (Authority):** Captain holds valid rank. Pass.
  *   **Step 4 (Formula & Uptake):**
      *   *Formula:* "It would be nice..." is a suggestion, not an imperative.
      *   *Uptake:* Deckhand heard it as an observation.
      *   *Analysis:* In strict maritime contexts, indirect speech acts often count as orders. However, the procedure prioritises *Uptake*. If the hearer did not recognise the illocutionary force, the act did not land.
  *   **Step 5 (Sincerity):** Captain was exhausted, perhaps passive-aggressive, but intended compliance.
  *   **Step 6 (Verdict):** **Procedural Misfire (Failed Uptake).**
      *   *Reasoning:* An order requires the subordinate to recognise it as an order. By phrasing it as a wish ("nice if"), the Captain diluted the illocutionary force.
      *   *Narrative Consequence:* The inquiry chapter can validly argue no direct order was given. The Captain bears responsibility for the ambiguity.
      *   *Action:* If you wish the Captain to be blameless, you must strengthen the formula (e.g., "Secure that hatch"). If you wish the Captain to be flawed, leave it.

  #### Scene 3: The Elopement (Cliffside)
  *Context: Friend (lapsed ordination) pronounces couple married. Couple: "We will love you always." Inheritance dispute drives final act. Author wishes readers to accept them as married.*

  *   **Step 1 (Act):** Marrying.
  *   **Step 2 (Authority):** Institutional (Legal/Religious).
  *   **Step 3A (Authority):** Friend's ordination lapsed.
      *   *Analysis:* Marriage is an institutional fact. It requires a valid officiant under the relevant law.
  *   **Step 4 (Formula & Uptake):**
      *   *Formula:* "I pronounce you..." used.
      *   *Uptake:* Couple accepted the sentiment ("We will love you always"), but did not explicitly accept the legal bond (no "I do").
  *   **Step 5 (Sincerity):** All parties sincere.
  *   **Step 6 (Verdict):** **Procedural Misfire (Void Act).**
      *   *Reasoning:* Without valid authority, the words have no illocutionary power to change legal status. It is a performative utterance that fails its felicity conditions.
      *   *Narrative Consequence:* Legally, they are unmarried.

  ***

  ### The Verdict You Will Not Like

  I must flag **Scene 3**. The procedure returns a verdict of **Misfire (Void)**.

  You stated: *"I wish readers to accept them as married in every sense that matters, though the ceremony is institutionally void."*

  The procedure requires me to tell you that, logically, they are **not** married. If your inheritance dispute turns on legal next-of-kin status, the procedure indicates a coherence risk. If the law says they are single, and the plot treats them as married without addressing *why* the law is being bypassed, the reader may feel the conflict is manufactured.

  **Why the procedure requires this:**
  Speech act theory distinguishes between *brute facts* (we love each other) and *institutional facts* (we are married). You can have the former without the latter. The procedure protects the logic of your inheritance dispute. If the antagonists are lawyers or family members relying on the law, they will win this point.

  **How to use this:**
  Do not ignore this verdict. Use it. The tragedy of the scene is that they *feel* married but *are not*. The inheritance dispute should turn on this precise gap between emotional truth and institutional void. If you want them to win the inheritance, you must find a different legal hook (e.g., common-law marriage, if applicable in your setting, or a will), rather than relying on the void ceremony.

  **Authorial Override Option:**
  If you are writing in a genre where 'heart overrides law' (e.g., high romance or magical realism), you may invoke Step 6. You must, however, add a line of narration or dialogue acknowledging the irregularity but dismissing it (e.g., *"The law might call it void, but on this cliff, under this sky, they knew they were bound."*). Without that, the logic hole remains.

  ***

  ### Conclusion: What This Procedure Cannot Settle

  This audit cannot measure the **perlocutionary effect**—the emotional consequence of the speech. It can tell you if a promise was technically made, but it cannot tell you if the betrayal of that promise will break the reader's heart. It can confirm a marriage is void, but it cannot validate the love within it.

  It ensures your plot mechanics do not grind against the gears of logic. It ensures that when a character says "I promise," the universe of your novel registers the debt. But it cannot tell you whether that debt is worth paying. That remains, as it must, with you.
