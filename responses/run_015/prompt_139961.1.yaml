  **Sestina for a Proof-Reader**

  There is no **time** except the eye retains.
  No **substance** solid but the hand that touches.
  I watch the **river** and it is my watching.
  Upon the **tiger**, stripes are only sight.
  The heat I feel denies the **fire**'s owning.
  The world is just what perception has **made**.

  What I recall is **made** inside this instant.
  The past assumes another shape of **time**.
  The burn remains although I quit the **fire**.
  No ghost of **substance** lingers in the bone.
  I dream the **tiger** sleeping in the grass.
  Water flows only because I see the **river**.

  If two moments match, they are one **river**.
  If distinct, the chain is **made** of nothing.
  The beast is one unless the spots shift, **tiger**.
  We lack the count to measure out the **time**.
  There is no weight of **substance** in the scale.
  One spark differs from the next in **fire**.

  Who stands before the **fire** to feel the heat?
  The man who walked beside the **river** dies.
  There is no **substance** left to hold the shape.
  The face I knew is **made** of light and dust.
  No clock can track the loss of **time** in me.
  I am not he who feared the striped **tiger**.

  Yet I become the stripe upon the **tiger**.
  I am the heat that rises from the **fire**.
  I am the counting and the counted **time**.
  I am the water and the bed of **river**.
  Nothing is lost since nothing was **made**.
  I am the only **substance** that remains.

  This **substance** offers no warm hand to hold.
  The **tiger** eats itself and finds no peace.
  The story **made** to soothe me rings quite hollow.
  There is no comfort in the dying **fire**.
  I flow away along the empty **river**.
  And still I suffer the invention of **time**.

  All **time** is one; no **substance** breaks the circle.
  The **tiger** walks every path through **fire**.
  Was this one **river** **made**, or six things once?

