answer: |-
  Here is the translation into your operational vocabulary.

  **Testimonial injustice** is a systematic calibration error in your credibility priors. You assign a lower probability of truth to a signal based on source metadata (identity markers like gender or race) rather than transmission history or verification routines. The "who counts as an expert" list is biased, causing you to discard high-fidelity signal as noise.

  **Hermeneutical injustice** is a shared codebook failure. The speaker attempts to encode an experience, but the public vocabulary lacks the necessary dictionary entry. The compression algorithm cannot render the experience intelligible. The message arrives at the desk as high-entropy noise, not because the channel is dirty, but because the decoding key is missing from the collective repository.

  ### Residue Report

  **What carries over cleanly:** The mechanics of transmission failure. Your hypothesis is mechanically sound: the first case is a bad prior; the second is a missing codebook entry. Information theory perfectly models the *loss of knowledge*.

  **What fits only with distortion:** Treating identity prejudice as a mere "calibration error" implies it is a bug. Often, it is a feature of the system's design. Your toolkit assumes the goal is accuracy; epistemic injustice suggests the goal may be social ordering.

  **What has no expression:** The harm. In information theory, a dropped packet is neutral. In epistemic injustice, the speaker is *wronged*. Their capacity as a knower is degraded. Your vocabulary tracks fidelity, not moral status. You can model the silence, but not the insult. The harm is not just information loss to the hearer; it is a constitutive damage to the speaker. This is a defect in your vocabulary, which is descriptive, whereas the philosophical claim is normative.

  ### On Credibility Excess

  Your framework handles this easily. Credibility excess is an inflated prior assigned to a dominant source class. You accept noise as signal because the source metadata (fluency, credentials, institutional affiliation) triggers high trust. This is equally dangerous; it allows high-status noise to drown out low-status signal. The "both-sides reflex" often institutionalises this excess by granting equal weight to a dominant view and a marginalised one, regardless of evidentiary support. The machinery works both ways; the danger is symmetrical.

  ### On Institutions vs. Individuals

  You are not making a category mistake; the individual remedy is insufficient. If your commissioning editor filters sources based on hierarchy, or house style demands attribution forms certain voices cannot provide, no amount of reporter virtue fixes the blockage. The "both-sides reflex" might enforce hermeneutical gaps by demanding framing that doesn't exist yet.

  Fricker's original analysis focused on the "virtuous hearer," but in journalism, the hearer is often downstream of the gatekeepers. Treating this as individual attentiveness ignores the pipeline. The unit of analysis must be the newsroom structure, not the journalist's conscience. You need institutional verification routines that correct for prior bias, not just exhortations to listen harder.

  ### Verdict

  The defect lies in your vocabulary, not the philosophy. Information theory describes flow; epistemic injustice describes power. Your toolkit explains *how* the message fails to arrive; it cannot explain *why* that failure constitutes a violation. To capture the wrong, you need an ethical layer that accounts for the status of the source, not just the bits they transmit. You are modelling a channel; the philosophers are modelling a community.
