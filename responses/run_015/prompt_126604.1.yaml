answer: |-
  This is a diagnostic instrument designed to disentangle the four axes of strictness (Density, Severity, Stigma, Scope) and route specific norms to the philosophical regime that justifies them. It is built to be used by your committee on Tuesday: take a proposed rule, run it through the questions, and the resulting Leaf tells you how to enforce it.

  ### The Decision Tree (8 Branch Questions)

  *Instructions: Take the specific norm under discussion (e.g., "No loud music after 11pm"). Answer the questions in order. Stop at the first "Yes."*

  1.  **The Paradox Test:** If we created a formal penalty for violating this norm, would the value of complying disappear? (e.g., A forced apology, a mandated thank-you note, compelled gratitude.)
  2.  **The Coordination Test:** If half the community ignored this rule tomorrow, would the rule become useless or dangerous for everyone else? (e.g., Driving on the right, submission deadlines, double-entry bookkeeping.)
  3.  **The Harm Test:** Can you point to a specific, non-consenting person who is demonstrably worse off because you broke this rule? (e.g., Assault, theft, sexual harassment.)
  4.  **The Free-Rider Test:** Does breaking this rule give you an unfair advantage over those who are restraining themselves to keep the system going? (e.g., Cutting in line, plagiarism, tax evasion.)
  5.  **The Wisdom Test:** Is this a custom whose purpose isn't fully articulable, but whose disappearance seems to correlate with social fragmentation? (e.g., Formal dress at dinner, specific forms of address, ritualized greetings.)
  6.  **The Scaffolding Test:** Is the primary purpose of this rule to help the *breaker* cultivate self-control or virtue, rather than to protect others? (e.g., Mandatory attendance, drug prohibitions, study hours.)
  7.  **The Innovation Test:** Is this a domain where we *want* deviation to occur, because new ways of living are discovered through breaking the old pattern? (e.g., Artistic expression, political dissent, experimental social arrangements.)
  8.  **The Privacy Test:** Is the breach of this norm invisible to everyone except the breaker, and does it leave no trace on the shared environment? (e.g., Private thought, solitary masturbation, personal diary content.)

  ---

  ### The Leaves (8 Normative Regimes)

  *Each Leaf corresponds to a philosophical view. It dictates the settings for the four axes: Density (how many rules), Severity (punishment), Stigma (shame), and Scope (reach).*

  **1. The Expressive/Communitarian Leaf (From Q1)**
  *   **View:** Norms constitute a shared way of life; coercion destroys the good.
  *   **Settings:** Low Density, Zero Formal Severity, High Cultural Stigma (informal only), Medium Scope.
  *   **Awkward Commitment:** "We will cultivate a culture where you *want* to write thank-you notes, but we will never punish you for failing to do so."

  **2. The Convention/Coordination Leaf (From Q2)**
  *   **View:** Rules are focal points; the content matters less than the universality.
  *   **Settings:** High Density (precise specs), Mild Severity (administrative fix), Low Stigma (no shame, just correction), Narrow Scope.
  *   **Awkward Commitment:** "It does not matter whether we drive on the left or right, only that we all do the same thing, so we will fine you for deviation without judging your character."

  **3. The Harm-Principle Leaf (From Q3)**
  *   **View:** Liberty is the default; interference is only justified to prevent harm to others.
  *   **Settings:** Low Density (only prohibitions), Severe Severity (expulsion/legal), High Stigma (moral condemnation), Narrow Scope.
  *   **Awkward Commitment:** "You are free to destroy yourself, but the moment you harm a non-consenting other, the full weight of the law descends without mercy."

  **4. The Fair-Play/Reciprocity Leaf (From Q4)**
  *   **View:** Compliance is owed to fellow cooperators who have already restrained themselves.
  *   **Settings:** Medium Density, Moderate Severity (restitution), Medium Stigma (dishonor), Medium Scope.
  *   **Awkward Commitment:** "You must follow the queue not because lines are sacred, but because it is unfair to benefit from the restraint of those standing ahead of you."

  **5. The Epistemic/Tradition Leaf (From Q5)**
  *   **View:** Inherited rules encode accumulated, not-fully-articulable knowledge; they get a default in their favor.
  *   **Settings:** Medium Density, Mild Severity (reminder), Medium Stigma (social pressure), Medium Scope.
  *   **Awkward Commitment:** "We keep this ritual not because we can prove it works, but because we cannot prove it doesn't, and we distrust our own ability to redesign society from scratch."

  **6. The Moral Education/Scaffolding Leaf (From Q6)**
  *   **View:** Tightness is a pedagogical tool to build self-control in developing agents.
  *   **Settings:** High Density, Moderate Severity (corrective), Low Stigma (seen as growth), Broad Scope (into private habits).
  *   **Awkward Commitment:** "We restrict your freedom now, against your current wishes, to ensure you possess the character required to handle freedom later."

  **7. The Innovation/Public-Good Leaf (From Q7)**
  *   **View:** Looseness itself is a public good; permissiveness buys social adaptability.
  *   **Settings:** Low Density, Zero Severity, Zero Stigma (celebration of deviation), Broad Scope.
  *   **Awkward Commitment:** "We will tolerate behavior that seems foolish or offensive today because the cost of suppression is the loss of the breakthroughs that might come from it."

  **8. The Anarchist/Enforcement-Suspicious Leaf (From Q8)**
  *   **View:** The demand for rule-following is itself the violence; private sovereignty is absolute.
  *   **Settings:** Zero Density, Zero Severity, Zero Stigma, Zero Scope.
  *   **Awkward Commitment:** "What you do in the dark is not only none of our business, it is conceptually impossible for it to be our business."

  ---

  ### Empty Cells (Incoherent Combinations of Axes)

  *These are combinations of Density, Severity, Stigma, and Scope that the logical space excludes or renders unstable.*

  1.  **High Severity + Low Density + High Scope:** "Few rules, but we search your bedroom to enforce them, and the punishment is death."
      *   **Diagnosis:** **Tyranny/Arbitrariness.** This is incoherent as a *normative* system because it offers no predictability. It functions not as law but as terror. No philosophical defense exists other than raw power.
  2.  **High Stigma + Zero Severity:** "We will shame you utterly for this breach, but never actually punish you."
      *   **Diagnosis:** **Vigilante Instability.** This creates a market for social violence without institutional containment. It is unstable because the stigma inevitably demands a outlet (ostracism), which becomes a de facto severity.
  3.  **High Density + High Scope + Zero Stigma + Zero Severity:** "There is a rule for every minute of your day, but we don't care if you break it."
      *   **Diagnosis:** **Bureaucratic Absurdity.** This destroys the normative force of "rule." If there is no cost to breach (social or material), it is not a rule, it is a suggestion. This creates cynicism rather than order.
  4.  **High Severity + The Paradox Test (Enforced Virtue):** "You must apologize, and if you don't, we will suspend you."
      *   **Diagnosis:** **Performative Contradiction.** As noted in Q1, this cell is logically empty because the sanction destroys the good (sincerity) the rule seeks. It produces compliance, not virtue.

  ---

  ### My Committed Recommendation for Your Code

  You asked me not to hedge. Here is the architecture I would draft if I had the pen.

  **1. The Structure:**
  Adopt a **Differentiated Regime**. Do not write one "Code of Conduct." Write three distinct documents with different enforcement logics.
  *   **Document A (Safety & Integrity):** Governed by **Harm** and **Fair-Play** leaves. (Sexual misconduct, theft, plagiarism).
      *   *Enforcement:* High Severity, High Stigma, Formal Adjudication.
  *   **Document B (Community & Coordination):** Governed by **Convention** and **Epistemic** leaves. (Noise, deadlines, dress codes for labs).
      *   *Enforcement:* Mild Severity (fix-it tickets), Low Stigma, Administrative resolution.
  *   **Document C (Culture & Virtue):** Governed by **Expressive** and **Innovation** leaves. (Respect, gratitude, dialogue norms).
      *   *Enforcement:* Zero Formal Severity. Rely entirely on peer culture, modeling, and soft stigma. **No administrative sanctions.**

  **2. The Axes Settings:**
  *   **Density:** Low for A (only clear harms), Medium for B (necessary coordination), Low for C (aspirational principles only).
  *   **Severity:** Severe for A, Mild for B, None for C.
  *   **Stigma:** High for A (moral wrong), Low for B (administrative error), Variable for C (social feedback).
  *   **Scope:** Narrow for A (actions only), Medium for B (campus spaces), Broad for C (encouraged everywhere, demanded nowhere).

  **3. Who Demands:**
  *   **A:** Professional investigators (due process required).
  *   **B:** Administrators/Staff (efficiency required).
  *   **C:** Peers/Faculty as community members (no official authority).

  **4. My Leaf:**
  I place myself primarily on the **Fair-Play/Reciprocity Leaf** for institutional rules, bounded by the **Harm-Principle Leaf** for individual rights.
  *   **Why:** A university is a cooperative venture. The primary obligation students/faculty have to one another is not "do no harm" (too low a bar) nor "be virtuous" (too high/coercive), but "do not free-ride on the cooperation of others."
  *   **Confidence:** 75%.
  *   **The Single Defeater:** Empirical evidence that **Stigma** is more effective than **Sanctions** for preventing Harm (Category A). If data showed that formal hearings for sexual misconduct produce worse outcomes for victims than community-led restorative stigma, I would move toward the **Expressive/Communitarian** leaf for Category A, despite the risk of vigilante justice.
  *   **Empirical Load-Bearing Assumption:** I am assuming that *formal sanctions* do not crowd out *intrinsic motivation* in Category B (Coordination). If fining people for late paperwork makes them care *less* about deadlines (crowding out), then the Mild Severity setting is counter-productive, and we must rely on the Epistemic/Tradition leaf (custom) instead. I am betting that for bureaucratic rules, mild fines work; for social rules, they fail.

  ### How to Use This on Tuesday

  When the committee argues about a rule (e.g., "Mandatory Attendance"):
  1.  Run it through the 8 Questions. (It likely hits Q6, Scaffolding).
  2.  Check the Leaf. (Moral Education).
  3.  Check the Settings. (Moderate Severity, Low Stigma).
  4.  **The Kill Shot:** If a colleague demands *High Stigma* ("Skipping class makes you a bad person") or *High Severity* ("Expulsion for three skips"), point to the Leaf. "We have categorized this as Scaffolding. The Scaffolding regime forbids High Stigma. If you want High Stigma, you must argue this is a Harm rule (Q3). Can you name the specific person harmed by your absence?"

  This forces them to move their philosophical position, not just their volume.
