      "reasoning": "...",
      "assessment_criterion": "..."
    },
    "epistemic_humility": {
      "normative_demand": "...",
      "reasoning": "...",
      "potential_objection": "..."
    },
    "structural_feature": "A brief statement identifying which feature of the ecological hinge framework does the principal philosophical work in generating these implications.",
    "collapse_condition": "What happens to the analysis if domain-relative hinge status is rejected in favor of a single global hinge framework?"
  }
