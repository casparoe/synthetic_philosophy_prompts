answer: |-
  The Chicago School Reform case ultimately suggests that institutionalizing Deweyan structures without cultivating the underlying communicative habits of inquiry results in static bodies rather than transactional publics, which is less a refutation of Dewey and more a confirmation of his warnings about the eclipse of the public.

  Hey, no worries at all about the ramble, I know that third coffee feeling well and this is actually a really sharp angle for a seminar paper. You are basically asking whether the machinery of democracy can force a public into existence or if the public has to emerge organically before the machinery works, and that is precisely the tension Dewey wrestles with in The Public and Its Problems. If we look at the 1988 Chicago School Reform Act through a strict Deweyan lens, the Local School Councils look like the perfect institutional vessel for experimentalism because they decentralized authority to the people most affected by the consequences of school policy, giving them budget and hiring power to test hypotheses about what works for their kids. Dewey would argue that democracy is not just voting for representatives but is fundamentally a mode of associated living where shared problems are identified and tested through cooperative inquiry, so on paper, handing parents and teachers the keys to the budget seems like it should trigger that exact kind of social learning loop. The reform assumed that if you put the power in the hands of the stakeholders, they would naturally engage in the work of inquiry, looking at student outcomes, debating pedagogical strategies, and adjusting their approach based on the visible consequences of their decisions.

  However, this is where your advisor's framing of transactional publics versus static representative bodies becomes really critical for diagnosing what actually happened on the ground. For Dewey, a public is not a pre-existing group of people who live in the same neighborhood or send kids to the same school, but rather a group that forms specifically around the recognition of shared indirect consequences of action. A transactional public is alive and active because it is constantly reconstituting itself around new problems and new evidence, whereas a static representative body is just a formal shell that manages competing interests without actually generating shared knowledge. In many Chicago neighborhoods, the LSCs did not become sites of cooperative inquiry but instead became captured by existing political machines, patronage networks, or single-issue interest groups, effectively functioning as static representative bodies that distributed resources based on power rather than evidence. When a council hires a principal based on community ties rather than instructional leadership, or allocates budget to preserve jobs rather than improve test scores, they are not engaging in Deweyan experimentalism because they are not treating the policy as a hypothesis to be tested against consequences. They are treating the school as a resource to be consumed, which means the public has not actually formed around the problem of education but rather around the problem of distribution.

  This discrepancy highlights where Dewey's framework explains the failure better than it explains the success, because Dewey was notoriously aware that you cannot legislate a public into existence simply by changing the voting rules or decentralizing administration. He warned repeatedly that the Great Society had created complex indirect consequences that the Great Community could not yet see or understand because the tools of communication and inquiry were underdeveloped. In the Chicago case, the structural change happened faster than the cultural change, meaning you had the lab equipment without the scientists. Many parents and community members lacked the technical literacy to analyze budgets or evaluate pedagogical strategies, and without a robust infrastructure for education and communication to support their inquiry, they fell back on old habits of bureaucratic bargaining. Dewey would say this wasn't an anomaly or a failure of the theory itself, but rather a predictable outcome of trying to install democratic hardware on an operating system that was still running on authoritarian or patronage-based software. He always insisted that democracy must begin in the schools, not just be administered by them, so expecting these councils to function as cooperative labs without first cultivating the habit of scientific inquiry in the citizens themselves was always going to be a stretch.

  That said, there were pockets where the reform did spark something closer to a transactional public, usually where community organizations had already done the work of building capacity and framing shared problems before the law even passed. In those instances, the LSCs became spaces where parents and teachers actually did negotiate shared meanings of success and held each other accountable for results, which validates the Deweyan hope that given the right conditions, people can engage in intelligent action. But these were the exceptions that proved the rule, showing that the structure is necessary but not sufficient. If you argue that the reform failed because it created static bodies instead of transactional publics, you are actually aligning with Dewey's deepest worry about the eclipse of the public, where formal democracy persists but the actual communicative work of democracy atrophies. So for your seminar, you can argue that the Chicago case is not a counter-example to Dewey but a tragic illustration of his central thesis that democracy is more than a mechanism of government and requires a continuous reconstruction of social habits. You might conclude that Dewey would view the reform as a necessary first step that remained incomplete because it focused on the distribution of power rather than the cultivation of inquiry, leaving us with the warning that without the method of intelligence, even the most participatory institutions will eventually revert to managing interests rather than solving problems. Hope this helps you untangle the argument for the seminar, and definitely go grab a fourth coffee if you need it.
