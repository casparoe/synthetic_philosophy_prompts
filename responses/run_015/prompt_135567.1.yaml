      *   **Constraints:** Fluent in ML/Interpretability vocab. Assume essentially no philosophy. Be systematic, precise, and critical.

  2.  **Deconstruct the Philosophical Concepts:**
      *   *(i) Epiphenomenalism:* Physical states ($P$) cause Phenomenal states ($Q$). $Q$ causes nothing physical (including reports $R$). $P \to Q$, $P \to R$, but $Q \not\to R$.
      *   *(ii) Paradox of Phenomenal Judgment:* If $Q$ doesn't cause $R$ (the judgment "I have $Q$"), why is $R$ true? Why do we talk about $Q$ if $Q$ does nothing? It threatens the warrant of the claim itself.
