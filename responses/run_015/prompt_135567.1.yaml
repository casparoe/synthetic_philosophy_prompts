      *   *Reports/Judgments ($R$):* The output of the "report head" ($\hat{y} = g(h)$), trained to predict something or just generate text.
      *   *Causality:* Computational graph / Causal DAG.
      *   *Epiphenomenalism:* $h \to z$ (detached), $h \to \hat{y}$. No edge $z \to \hat{y}$. No path from $z$ to loss function affecting weights.
      *   *Paradox:* If $z$ doesn't influence $\hat{y}$, why does $\hat{y}$ accurately describe $z$? If we intervene on $z$, $\hat{y}$ shouldn't change. So why trust $\hat{y}$'s claim about $z$?
