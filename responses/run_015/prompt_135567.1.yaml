          *   *Dead Code:* A detached tensor in a trained network is suspicious. Gradient descent usually prunes unused capacity. Why does $z$ exist? This smuggles in an evolutionary/efficiency argument against epiphenomenalism.
          *   *Aboutness (Intentionality):* $\hat{y}$ outputs "I am in state $S$". In ML, this is just token prediction minimizing loss. In philosophy, this is *reference*. The toy doesn't capture *why* $\hat{y}$ refers to $z$ rather than $h$.
      *   *Missing Completely:*
