  4.  **Evaluate the Toy Model:**
      *   *User's Toy:* Auxiliary head $z$ (detached), Report head $\hat{y}$ (trained on ground truth or just autoregressive).
      *   *Critique:* The user already suspects issues (determinism, dead code, "aboutness"). I need to validate and expand on these.

  5.  **Drafting the Translation (Section 1):**
      *   *Epiphenomenalism:* Define the computational graph. $h$ (residual) $\to$ $z$ (phenomenal, stop_grad) and $h \to \hat{y}$ (report). Crucially, $z$ is not in the causal ancestry of $\hat{y}$ or the weights $\theta$.
      *   *Paradox:* The "Warrant" problem. In ML, we validate probes via *intervention* (activation patching). If I patch $z$, does $\hat{y}$ change? If epiphenomenalism holds, No. Then why does $\hat{y}$ match $z$ on the test set? It looks like a spurious correlation that happens to be perfect in-distribution.
