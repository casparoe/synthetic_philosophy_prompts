      *   *Mechanism:* Eurocentrism is archival/narrative bias, not structural reality.
      *   *Risk:* Unfalsifiability (the "missing archive" defense), Triviality (everything is overdetermined), Normative drift (ought vs. is).

  3.  **Brainstorming Exposure/Defeaters (Ranking Strategy):**
