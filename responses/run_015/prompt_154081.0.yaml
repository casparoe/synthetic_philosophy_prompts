      *   *Awkward/Manageable:* Cases where substitution is clunky but possible. Cases where archives are genuinely missing (needs strict criteria).
      *   *Internal Collapse:* If "parity" just means "multiple causes exist," it loses force. If it means "any narrative is fine," it becomes relativist.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the thesis. It's a strong methodological intervention (California School adjacent but distinct).
      *   **Part 1: Ranked Exposure (Fatal to Awkward):**
          *   *Level 1 (Fatal):* Structural asymmetries in *capacity* that persist even after controlling for archival bias. E.g., if the Substitution Test fails *where archives are dense on both sides*.
          *   *Level 2 (Severe):* Forward-looking prediction failures (as requested). If Parity says "look here for X" and X isn't there.
