  *(Self-Correction during drafting)*: I need to be careful not to just say "Great Divergence says X." I need to say what *specific evidence* would kill Parity. For example, if a specific fiscal technology (like perpetual annuities) is proven to be *impossible* within Qing legal structures despite similar economic pressure, that kills the Substitution Test.

  *(Refining the Escape Hatch)*: The user admits they can say "archives destroyed." I need to tell them when that is illegitimate. It's illegitimate if the *type* of record usually survives in that polity for other purposes. (e.g., If Qing kept grain records but no tax records, that's suspicious. If they kept tax records but not for a specific province, that's plausible).

  *(Refining the Prediction)*: Parity predicts *symmetry* in shock transmission. If the Little Ice Age hit Europe harder than China *for institutional reasons* rather than geographic ones, Parity is in trouble.

