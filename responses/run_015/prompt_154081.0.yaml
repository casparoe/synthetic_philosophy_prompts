answer: |-
  ### 1. Ranked Exposure Map: What Kills the Parity Thesis

  This ranking moves from **Fatal** (thesis must be abandoned or fundamentally rewritten) to **Awkward** (thesis survives with qualification) to **Irrelevant** (objections you are entitled to dismiss).

  **I. FATAL DEFETERS (The Thesis Collapses)**
  1.  **Structural Impossibility in Dense Archives:** The Substitution Test fails in a context where *both* European and non-European archives are dense, catalogued, and comparable, yet the non-European analogue structurally cannot perform the causal work.
      *   *Example:* If you claim Qing debt instruments are substitutable for Dutch perpetual annuities in funding state capacity, but the Qing legal code explicitly forbade the alienation of tax rights or secondary trading of debt *even when economic pressure was high*, and this is documented in surviving codes and case law. This proves the difference is institutional, not archival.
  2.  **Asymmetric Shock Transmission (Reversal Test Failure):** Evidence shows that economic shocks originating in non-European polities *failed* to propagate to Europe, while European shocks propagated globally, *after controlling for volume*.
      *   *Example:* If a 20% contraction in Gujarati textile output causes no detectible price volatility in London, but a 20% contraction in Lancashire causes collapse in Gujarat, and this persists after 1750. This suggests a structural hub-and-spoke dependency, not parity.
  3.  **The "Negative Prediction" Failure:** The thesis predicts that searching non-European archives for specific mechanisms (e.g., joint-stock-like risk pooling) will yield functional equivalents. If systematic surveys of surviving merchant ledgers (e.g., Gujarati *bahikhatas* or Ottoman *ruznamçes*) consistently show *absence* of these mechanisms where economic logic demands them, the thesis is empirically falsified.

  **II. SEVERE DEFETERS (The Thesis Requires Major Revision)**
  4.  **The Timing Mismatch:** The Substitution Test works, but only *after* the outcome has already occurred.
      *   *Example:* If Ottoman fiscal reforms mirroring European "military-fiscal states" only appear *after* military defeats by Europe, rather than concurrently. This suggests imitation driven by divergence, not parallel formation driving parity.
  5.  **Scale Discontinuity:** The non-European analogue exists but operates at a magnitude orders smaller than the European counterpart, rendering it causally insufficient for the global outcome.
      *   *Example:* If chartered companies existed in Asia, but their capitalization was consistently <1% of the European equivalents relative to GDP, making them incapable of projecting power or absorbing risk at the required scale.

  **III. AWKWARD DEFETERS (Absorbable with Qualification)**
  6.  **Hybrid Causality:** Evidence shows the outcome required *both* European and non-European mechanisms interacting, where neither alone is sufficient.
      *   *Response:* You concede "strong parity" (independence) for "weak parity" (interdependence), arguing Eurocentrism still lies in crediting only one side of the loop.
  7.  **Archival Asymmetry (The "Known Unknown"):** We know records existed (references in other texts) but are definitively lost (war, fire, decay), while European counterparts survive.
      *   *Response:* You must quantify the loss. If >50% of a specific record type is lost globally, you can claim parity. If 95% is lost only in the non-European sphere, you must downgrade your claim from "parity of fact" to "parity of probability."

  **IV. IRRELEVANT DEFETERS (Entitled to Dismiss)**
  8.  **Familiarity Bias:** "The European story makes more intuitive sense to modern readers." (This confirms your thesis rather than refuting it).
  9.  **Normative Objections:** "Parity diminishes the horror of slavery/colonialism." (This conflates moral culpability with causal mechanism).
  10. **The "Unique Configuration" Argument:** "Europe was unique because it combined X, Y, and Z, even if non-Europeans had X, Y, and Z separately." (Unless you can prove the *combination* itself caused the outcome rather than the components, this is special pleading).

  ---

  ### 2. The Escape Hatch: An Unfalsifiability Audit

  You suspect you have built an escape hatch: *"The relevant non-European archive was destroyed/dispersed/never created."* You are correct to worry. This is the standard defense of the California School, and it is vulnerable.

  **The Verdict:** The thesis becomes unfalsifiable (and thus historiographically vacuous) if you invoke the "Missing Archive" defense **without meeting the Burden of Specificity.**

  **The Rule:** You are only entitled to claim a missing archive explains a failed Substitution Test if you can answer three questions:
  1.  **The Shadow:** Can you describe the *shape* of the missing record? (e.g., "We need provincial tax ledgers for Bengal 1650–1700," not just "more records").
  2.  **The Habit:** Did the polity produce *analogous* records for other purposes that *did* survive? (e.g., If the Qing kept detailed grain price records but no land tax records, you must explain why fiscal data was systematically excluded from bureaucratic habit while price data was included).
  3.  **The Event:** Is there a specific historical event accounting for the loss? (e.g., "The Imperial Archives burned in 1900"). If the answer is "gradual decay," the defense is weak, because European records survived the same decay processes.

  **How much content depends on this?**
  If >30% of your successful Substitution Tests rely on the "Missing Archive" defense, your thesis is no longer about *state formation*; it is about *archival theory*. You must shift your claim from "Parity existed" to "We cannot disprove parity." This is a weaker, skeptical thesis, not a positive historical one.

  **Is this insulation acceptable?**
  For a claim about a partly lost evidentiary base, *some* insulation is expected. However, historiography requires **inference to the best explanation**. If the best explanation for the absence of evidence is "it didn't exist" (because the bureaucratic logic didn't require it), you must concede the point. You cannot use "it existed and was lost" as a default.

  ---

  ### 3. Internal Failure Modes

  **A. Collapse into Triviality (Overdetermination)**
  *   **The Risk:** If your claim is merely "many factors cause many outcomes," Parity becomes a tautology. All historians agree outcomes are overdetermined.
  *   **The Fix:** Your claim must be about **Substitutability of Mechanisms**, not just multiplicity of causes. You must argue that Mechanism A (European) and Mechanism B (Non-European) are *functionally interchangeable* in the causal model. If you retreat to "everything matters," you lose the critical edge against Eurocentrism.
  *   **Test:** Can you construct a counterfactual where Europe *lacks* the specific feature (e.g., joint-stock) but still achieves the outcome via a different path? If yes, Parity holds. If no, and you say "Non-Europe had the feature," you are safe. If you say "Non-Europe had *other* features," you risk triviality.

  **B. Collapse into Normativity**
  *   **The Risk:** Parity becomes a moral claim ("Non-Europeans deserve credit") rather than a causal one ("Non-European mechanisms worked").
  *   **The Fix:** Strict adherence to the **Substitution Test**. If the non-European analogue *doesn't work* in the model, do not force it. Admit the divergence in that specific instance. A thesis that admits 20% divergence is stronger than one that claims 100% parity and breaks under scrutiny.

  **C. The Adequacy vs. Completeness Tension**
  *   **Your Worry:** If a Europe-centered narrative is "adequate," is Parity useless?
  *   **Resolution:** Distinguish **Sufficiency** from **Necessity**.
      *   *Eurocentric Claim:* European features were *necessary* for the outcome (Industrialization/Modernity).
      *   *Parity Claim:* European features were *sufficient* but not *necessary*; non-European features were also *sufficient*.
      *   *Why it matters:* If the Europe-centered narrative implies necessity (which most Great Divergence accounts do), Parity refutes it. If the Europe-centered narrative claims only sufficiency ("This is how it happened here"), Parity is compatible but adds value by showing **contingency**. It prevents the European path from being read as the *only* path to modernity.
      *   *Fatal Tension:* If you concede the Europe-centered narrative is "complete" (needs no external reference), Parity becomes merely decorative. You must argue the Europe-centered narrative is *incomplete* because it misidentifies the *type* of cause (structural vs. contingent).

  ---

  ### 4. Discriminating Predictions

  To distinguish Parity from Mild Pluralism (many causes) or Great Divergence (European uniqueness), your thesis must forecast specific archival findings.

  **1. The Convergence Prediction (vs. Great Divergence)**
  *   **GD Forecast:** Fiscal/extractive techniques diverge sharply after 1600.
  *   **Parity Forecast:** Fiscal/extractive techniques **converge** or remain parallel until at least 1750.
  *   **Specific Test:** Look at **tax farming contracts**. Parity predicts that the shift from in-kind to cash, and from fixed to auctioned farms, should show similar timing and contractual sophistication in Ottoman *malikane*, Qing *tan ding ru di*, and French *ferme générale*. If Europe shows complex credit-backed farming while Asia shows simple rent collection *in the same decade*, Parity fails.

  **2. The Reciprocity Prediction (vs. Mild Pluralism)**
  *   **Pluralist Forecast:** Europe and Asia interact, but Europe drives the systemic change.
  *   **Parity Forecast:** Systemic volatility should be **bidirectional**.
  *   **Specific Test:** Look at **bullion flows**. Parity predicts that Asian monetary policy decisions (e.g., Ming silver demonetization, Mughal rupee debasement) should explain European price inflation *as well as* American silver explains Asian prices. If you find European prices moving independently of Asian monetary shocks after 1600, the Reversal Test fails.

  **3. The "Ghost Mechanism" Prediction (Unique to Parity)**
  *   **Forecast:** You should find evidence of **aborted innovations** in non-European polities that mirror European successes.
  *   **Specific Test:** Look for **failed joint-stock experiments** in Asia. Parity suggests the *demand* for risk-pooling was global. If Europe invented the joint-stock company and Asia shows *no evidence* of attempting similar structures despite similar trade risks, it suggests a cultural/legal barrier, not just bad luck. Parity *requires* finding the attempt, even if it failed.

  ---

  ### 5. The "Wrong Prediction" Test (Candor)

  You asked for cases where Parity makes a wrong forward-looking prediction. Here are the two most dangerous zones for your thesis.

  **Case A: Financial Liquidity and Secondary Markets**
  *   **Parity Prediction:** Searching Ottoman or Qing merchant papers should reveal instruments with **transferable title** and **secondary market liquidity** comparable to Amsterdam or London bills of exchange by 1700.
  *   **The Risk:** If the archives (which are rich for this period) show that while credit existed, it remained **personalized and non-transferable** (i.e., tied to specific kinship networks rather than abstracted into tradable paper), Parity takes a severe hit.
  *   **Why:** This isn't an archival gap; it's a documented *absence* of a specific legal technology. If Asian merchants *could* have used transferable debt to lower transaction costs but *didn't*, despite high volume trade, it suggests the European form *was* distinctively efficient, not just distinctively documented.
  *   **Verdict:** This is the highest probability failure mode. The "personalized trust" vs. "impersonal exchange" distinction (Greif, etc.) is hard to dismiss as archival bias.

  **Case B: Military Fiscalism and Debt Sustainability**
  *   **Parity Prediction:** Qing or Mughal state debt ratios and interest rates should be comparable to British/French levels during wartime (1680–1750).
  *   **The Risk:** If evidence shows Asian states funded wars primarily through **current revenue** (taxation) while European states funded via **long-term debt**, and Asian states *could not* access long-term credit even when willing (e.g., tried to borrow and failed), Parity fails.
  *   **Why:** This strikes at the "Competitive States System" explanation. If the Asian states were equally competitive but *still* couldn't generate public credit, the "system" explanation gains weight over the "parity" explanation.
  *   **Verdict:** There is already evidence here that is awkward for Parity (e.g., the British ability to borrow at lower rates than the French, let alone the Qing). If you cannot find a non-European analogue for **publicly traded sovereign debt**, you must concede that *fiscal capacity* diverged even if *extraction* remained parallel.

  **Summary Advice:**
  Do not defend Parity as "Everything was the same." Defend it as "The *constraints* were the same, even if the *solutions* varied." If you find a case where the constraints differed (e.g., legal inability to alienate land), concede the divergence. A Parity Thesis that admits specific, localized divergences is robust; one that insists on global symmetry is fragile. Your strongest ground is **fiscal extraction and administrative technique**; your weakest is **financial innovation and legal abstraction**. Fortify the former, qualify the latter.
