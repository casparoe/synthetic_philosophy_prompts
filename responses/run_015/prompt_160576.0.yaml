answer: |-
  You are stuck in a **Sorites Paradox** (the Paradox of the Heap) compounded by a **Category Error**.

  You are trying to impose a binary classification (Permitted/Forbidden) onto a continuous spectrum (degree of AI involvement) using a quantitative metric ("how much" help). This is structurally doomed. There is no natural "joint" in reality where 39% AI usage becomes 41% AI usage in a way that changes the moral or pedagogical status of the work.

  Here is the diagnosis of the structure, the evaluation of your colleagues, the constraint you must drop, and the specific shape your rule needs to take.

  ### 1. The Structure of the Trap
  You have identified the trilemma correctly: **Determinacy** (a decision in every case), **Legibility** (a written reason), and **Continuity** (no different outcomes for imperceptibly different cases).

  In a Sorites context, **Continuity is the impossible constraint.** If the underlying phenomenon is a spectrum, and you demand a binary output, you *must* create a discontinuity somewhere. To demand that no two imperceptibly different cases yield different outcomes is to demand that the spectrum not exist.

  Your suspicion is correct: "How much help" is the wrong quantity. You are measuring *volume* when you should be measuring *agency*. The philosophical category error is treating AI assistance as a *substance* (like water in a glass) rather than a *function* (like a crutch vs. a wheelchair).

  ### 2. Evaluating the Colleagues (and the Economist)
  *   **Colleague 1 (The Realist):** *Wrong.* They believe there is a "fact of the matter" about where the line is. There isn't. This leads to the "arbitrary line" problem you described. It creates the illusion of objectivity while masking discretion.
  *   **Colleague 3 (The Functionalist):** *Dangerous.* They argue vagueness prevents gaming. In game theory and law, vagueness usually *increases* litigation and anxiety because it lowers the cost of challenging a decision. It also fails the Registrar's requirement for a written reason.
  *   **The Economist (Randomization):** *Philosophically honest, institutionally fatal.* Randomization in "hard cases" is a legitimate decision-theory move (acknowledging indeterminacy). However, in a disciplinary context, it undermines the normative force of the rule. It tells the student, "Your work is on the boundary of cheating, so we flipped a coin." This destroys the educational relationship and invites appeals based on procedural unfairness.
  *   **Colleague 2 (The Anti-Realist/Discretion):** *Nearest right, but needs refinement.* They acknowledge there is no pre-existing line. However, "judgment call" is not a *reason*. To satisfy the Registrar, discretion must be *structured*, not naked.

  ### 3. Which Constraint to Drop?
  You must drop **Continuity**.

  You cannot guarantee that Case A (40% AI) and Case B (41% AI) will be treated identically if the rule relies on percentage. But you *can* guarantee that Case A and Case B will be treated identically if they involve the same *type* of cognitive labor.

  You need to move from a **Boundary Problem** (where is the line?) to a **Teleological Problem** (what is the work for?).

  ### 4. The Solution: Shift from Quantity to Agency
  The rule should not police the *amount* of AI text, but the *locus of reasoning*.

  **The Philosophical Shift:**
  Adopt a **Wittgensteinian "Family Resemblance"** approach rather than a necessary-and-sufficient-conditions approach. Do not define "substantial drafting." Instead, define the **Cognitive Offloading Prohibition**.

  The core question is not "How many words did the AI write?" It is: **"Did the AI perform the cognitive work this assignment is designed to assess?"**

  *   If the assignment assesses *argument structure*, AI structuring is forbidden (even if it's only 10% of the text).
  *   If the assignment assesses *prose clarity*, AI copy-editing is permitted (even if it changes 50% of the words).
  *   If the student provides the *logical skeleton* and the AI provides the *flesh*, that is permitted.
  *   If the AI provides the *logical skeleton* and the student provides the *flesh*, that is forbidden.

  This solves the Sorites problem because it creates distinct *categories of labor* rather than a continuum of *volume*. A case where the AI fixes grammar is categorically different from a case where the AI fixes logic, even if the word count changed is identical.

  ### 5. What to Write (For Friday)
  Do not write a rubric. Write a **Principle of Cognitive Agency**. Below is draft language you can adapt. It satisfies the Registrar (it gives a reason), ensures Decisions (it classifies acts), and abandons the impossible Continuity constraint in favor of Categorical Consistency.

  ***

  **GUIDANCE ON AI USE AND ACADEMIC INTEGRITY**

  **1. The Principle of Cognitive Agency**
  The core standard for academic work is not the origin of the text, but the locus of the reasoning. Students must remain the primary agents of the intellectual work this course is designed to assess. AI tools may be used to *support* your thinking, but not to *substitute* for it.

  **2. Permitted vs. Prohibited Functions**
  We do not measure AI use by word count or percentage. We measure it by function.
  *   **Permitted (Tool Use):** Using AI to correct grammar, suggest synonyms, summarize source material, or critique a draft *you have already structured*. Here, the AI acts as a copyeditor or tutor. The intellectual architecture remains yours.
  *   **Prohibited (Agent Use):** Using AI to generate arguments, structure the logical flow of the paper, synthesize concepts you have not grasped, or resolve impasses in your reasoning. Here, the AI acts as a co-author. The intellectual architecture belongs to the machine.

  **3. Application to Borderline Cases**
  The Committee acknowledges that some uses fall into a gray area. In these cases, we apply the **Counterfactual Test**:
  *   *If the AI tool were unavailable, would the student still be able to produce a submission that meets the learning objectives of this assignment?*
  *   If the answer is **Yes**, the use is likely permitted (the AI was an efficiency tool).
  *   If the answer is **No**, the use is likely prohibited (the AI was a competency substitute).

  **4. Precedent and Consistency**
  Because this distinction relies on the nature of the work rather than a numerical threshold, two submissions with identical amounts of AI text may be judged differently based on *what work the text performed*. To ensure fairness, the Committee will maintain a log of adjudicated cases. Future decisions will be consistent with the *principles* established in past cases, not merely the outcomes.

  ***

  ### Why This Works
  1.  **It answers the Registrar:** The reason given to a student isn't "you used too much," it's "the AI performed the reasoning this assignment was meant to test."
  2.  **It solves the Sorites:** It breaks the continuum. Fixing a comma and fixing a thesis are not "imperceptibly different"; they are categorically different kinds of labor.
  3.  **It handles your specific cases:**
      *   *Bullet points to paragraphs:* If the bullets contained the logical links, it's permitted. If the AI inferred the links, it's prohibited. (Requires looking at the bullets).
      *   *Non-native speaker:* If the AI changed phrasing but kept the logic, permitted. If it "smoothed" the argument by removing nuance the student intended, prohibited.
      *   *Ten outlines:* Generating outlines is "brainstorming" (Permitted) *if* the student evaluates them. Picking one and discarding the rest is standard selection.
      *   *Dictation cleanup:* If the cleanup changed the argument, that is "Agent Use" (Prohibited).

  ### The Hard Truth
  You must tell your committee that **Consistency** does not mean **Identical Outcomes for Identical Percentages**. It means **Identical Outcomes for Identical Violations of Agency**.

  If you try to enforce the "imperceptible difference" constraint, you will fail by Friday. If you enforce the "Cognitive Agency" constraint, you will have to read the work more closely, but your decisions will be defensible.

  Drop the quantification. It was never about the words; it's about the thinking.
