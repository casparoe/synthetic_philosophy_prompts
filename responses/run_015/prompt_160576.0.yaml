      *   The user's intuition that "how much help" is the wrong quantity is spot on. This is a category error. It's not about *quantity* of text generation; it's about *agency* and *cognitive labor*.
      *   The constraint triangle (Decision, Reason, Consistency) is a variation of the **Iron Triangle** or a trilemma. In legal/philosophical terms, it mirrors the tension between *Rule of Law* (consistency), *Justice* (particularized decision), and *Legibility* (reasoning).
      *   The Economist's suggestion (randomization in the band) is essentially **Buridan's Ass** resolved by chance, or a form of **Decision Theory** under uncertainty. It's honest but institutionally risky (looks like abdication).

