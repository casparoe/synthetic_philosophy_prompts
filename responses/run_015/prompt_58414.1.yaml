prompt: |-
  So me and my partner just took over her dads tiny farm in Ohio, six outdoor trout raceways and four indoor shrimp tanks, and I somehow got voluntold to be the welfare guy even though my background is auto repair not fish.

  I need something I can actually run every morning before feeding, like a decision procedure or checklist that turns all that fish and shrimp sentience and welfare stuff into steps a non-expert can follow. It should tell me what to check in what order, what counts as good enough to move on, when to stop with a straight no this is not okay, and when to kick it up to the vet or to us as owners becuase its really a values call not a facts call.

  Some constraints: I have like 15-20 minutes per raceway or tank max, mornings are chaos, my crew is me plus two part timers with zero biology training, our vet only comes once a month to sign off unless theres an emergency, and the stakes are dead or stressed animals plus losing money if we get it wrong.

  Can you build that for trout and for whiteleg shrimp seperately where they differ, keep what actually matters for welfare but drop the super technical stuff we cant measure, and be honest about where the checklist will misfire or need human judgment.

  Then run it on three real calls I am facing right now:

  1. crowding trout tight in a grading net for 5-6 hours becuase we are short staffed, they go off feed for a day after but it saves us hiring extra help
  2. our electric stunner broke and the replacement is 3 weeks out, so going back to ice slurry for harvest in the meantime
  3. keeping berried shrimp females in bare bright tanks with lights on 24/7 to push more larvae, we get more babies but the females lose antennae and die younger

  Include at least one where the procedure tells me something I am not gonna like, like I have to spend money or stop doing the easy thing, and end with what the procedure cannot do no matter how good it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** New farm owner/operator (background in auto repair, not biology), partnered with daughter of previous owner.
      *   **Task:** Create a practical, morning welfare checklist/decision procedure for trout (outdoor raceways) and shrimp (indoor tanks).
      *   **Constraints:** 15-20 mins per unit, minimal staff training, vet only monthly, high stakes (life/death/money).
      *   **Requirements:**
          *   Separate procedures for Trout and Shrimp (highlighting differences).
          *   Actionable steps (Check -> Decision -> Action).
          *   Clear thresholds (Good/Stop/Escalate).
          *   Honesty about limitations (where judgment is needed).
          *   Apply the procedure to three specific ethical/operational dilemmas provided.
          *   Include at least one "hard truth" (cost/effort increase).
          *   End with limitations of the procedure itself.
      *   **Tone:** Practical, direct, no-nonsense (auto-mechanic style), ethically grounded but realistic.

  2.  **Deconstruct the Welfare Science (Simplified for Non-Experts):**
      *   *Trout:* Need oxygen, clean water, space, low stress, proper handling. Signs of trouble: gasping, flashing, lethargy, fin damage, dead fish.
      *   *Shrimp:* Need stable water chemistry (ammonia/nitrite/pH/salinity), biosecurity, appropriate substrate/hiding (sometimes), light cycles. Signs of trouble: white muscle, loose shell, discoloration, lethargy, cannibalism.
      *   *Common:* Water quality is king. Behavior is the canary in the coal mine. Mortality is the lag indicator (too late).

  3.  **Drafting the Checklists (The "Morning Run"):**
      *   *Format:* Needs to be like a pre-flight or safety check.
      *   *Time:* Must fit the 15-20 min window.
      *   *Steps:*
          1.  Water/Environment (The "Engine").
          2.  Animal Behavior (The "Driver").
          3.  Physical Check (The "Body").
          4.  Decision Matrix (Go/No-Go/Escalate).
      *   *Differentiation:* Trout need flow/oxygen checks visually. Shrimp need water parameter checks (test kits) and light/substrate checks.

  4.  **Addressing the Three Scenarios (The "Stress Test"):**
      *   *Scenario 1: Crowding Trout (5-6 hours).*
          *   *Welfare Issue:* Oxygen depletion, ammonia spike, stress, physical damage.
          *   *Checklist Verdict:* Likely a "Stop/Escalate." 5-6 hours in a grading net is excessive.
          *   *Hard Truth:* Need to hire help or change process.
      *   *Scenario 2: Ice Slurry vs. Electric Stunner.*
          *   *Welfare Issue:* Pain during death. Ice slurry is generally considered inhumane for trout if not stunned first (thermal shock + suffocation).
          *   *Checklist Verdict:* "No-Go." High risk of suffering.
          *   *Action:* Find alternative (percussive?) or delay harvest.
      *   *Scenario 3: Shrimp Light/Barren Tanks.*
          *   *Welfare Issue:* Cannibalism, stress, physical damage (antennae), reduced lifespan.
          *   *Checklist Verdict:* "Escalate/Values Call." It works for production but kills welfare.
          *   *Action:* Owners need to decide on the trade-off.

  5.  **Refining the Tone and Content:**
      *   *Auto Repair Analogy:* Use terms like "red line," "check engine," "band-aid fix."
      *   *Honesty:* Acknowledge that checklists don't fix bad economics.
      *   *Limitations:* Checklists can't measure pain directly, can't fix budget issues, can't replace vet expertise in a crisis.

  6.  **Developing the Content (Iterative Process):**

      *   *Intro:* Acknowledge the situation. It's tough but doable.
      *   *Trout Checklist:* Focus on flow, surface behavior, dead count.
      *   *Shrimp Checklist:* Focus on water tests, molting, cannibalism.
      *   *Decision Matrix:* Green (Feed), Yellow (Watch/Adjust), Red (Stop/Call).
      *   *Scenario Analysis:* Apply the matrix rigorously.
      *   *The "Hard Truth":* Scenario 1 or 2 needs to be a hard stop. Let's make Scenario 1 the money hit (hire help) and Scenario 2 the safety/humanity hit.
      *   *Limitations:* What the checklist *can't* do.

  7.  **Self-Correction/Review against Constraints:**
      *   *Did I separate Trout and Shrimp?* Yes.
      *   *Is it 15-20 mins?* The steps need to be quick. Water testing for shrimp takes time, so emphasize spot checks or automated sensors if possible, but assuming manual for now. I'll specify "spot check" to save time.
      *   *Did I answer the 3 scenarios?* Yes.
      *   *Is there a "don't like" answer?* Yes, stopping the crowding costs money.
      *   *Is the ending about limitations?* Yes.

  8.  **Final Polish:** Ensure the distinction between *welfare* (animal state) and *compliance* (rules) is clear but merged for practicality. Make sure the "Values Call" section is distinct from the "Vet Call" section. (Self-correction: The prompt asks for "Vet or Owners" distinction. Vet = medical/emergency. Owners = economic/ethical trade-offs).

      *   *Refining Scenario 2:* Ice slurry is a big welfare red flag in aquaculture. I need to be firm here.
      *   *Refining Scenario 1:* Crowding for 6 hours is extreme. Standard grading is usually minutes. This is a major red flag.
      *   *Refining Scenario 3:* This is a production vs. welfare trade-off. This belongs in the "Owners/Values" bucket.

  9.  **Final Output Structure:**
      *   Intro: The "Mechanic's Mindset."
      *   Part 1: Trout Morning Procedure.
      *   Part 2: Shrimp Morning Procedure.
      *   Part 3: The Decision Matrix (Green/Yellow/Red).
      *   Part 4: Running the 3 Scenarios.
      *   Part 5: The Hard Truths & Limitations.

  *(Self-Correction during drafting)*: Keep the language simple. No "dissolved oxygen ppm" unless necessary, use "gasping at surface" instead. For shrimp, "water test" is unavoidable but keep it to the critical ones (Ammonia/Oxygen).

  Let's write it.cw
answer: |-
  This is the right approach. You don't need a biology degree to keep animals alive; you need a systematic diagnostic routine, just like troubleshooting an engine. If the intake is clogged or the pressure is wrong, the machine fails. Fish and shrimp are biological machines with tighter tolerances than a V8.

  Below is the **Morning Welfare Diagnostic (MWD)**. It is designed for speed (15-20 mins/unit), clarity, and safety. It separates *facts* (what you see) from *values* (what you tolerate).

  ### Part 1: The Trout Morning Diagnostic (Outdoor Raceways)
  **Time Budget:** 15 Minutes per Raceway
  **Goal:** Catch oxygen, flow, or disease issues before mortality spikes.

  | Step | Check | The "Good" Standard (Green) | The "Warning" Standard (Yellow) | The "Stop" Standard (Red) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Water Flow** | Look at inlet/outlet. | Water is turbulent, clear, flowing fast. | Flow is sluggish; debris building up. | **No flow** or water backing up. |
  | **2. Surface Behavior** | Watch fish for 60 secs. | Fish holding position in current or schooling calmly. | Fish "piping" (mouths breaking surface) or hanging near inlet. | **Gasping at surface** or lethargic on bottom. |
  | **3. Physical Check** | Look for dead/damaged. | 0-2 dead fish (normal background loss). | 3-5 dead fish; some fin fraying. | **>5 dead fish**; bloody gills; obvious lesions. |
  | **4. Smell/Clarity** | Smell the water. | Earthy or neutral smell. Clear. | Slight sulfur/rotten egg smell. | **Strong ammonia/rotten smell**; cloudy/milky water. |

  **Action Matrix:**
  *   **All Green:** Feed normally. Log data.
  *   **Any Yellow:** Reduce feed by 50%. Increase flow if possible. Log it. Check again in 2 hours.
  *   **Any Red:** **DO NOT FEED.** Feeding adds oxygen demand. Call Vet/Emergency contact immediately. Aerate if you have backup systems.

  ---

  ### Part 2: The Shrimp Morning Diagnostic (Indoor Tanks)
  **Time Budget:** 20 Minutes per Tank System
  **Goal:** Catch water chemistry crashes and cannibalism early. Shrimp hide illness until they die, so water quality is your primary sensor.

  | Step | Check | The "Good" Standard (Green) | The "Warning" Standard (Yellow) | The "Stop" Standard (Red) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Water Params** | Test Kit (O2, Ammonia). | O2 > 5ppm, Ammonia ~0. | O2 3-5ppm, Ammonia slight color change. | **O2 < 3ppm**, Ammonia dark color. |
  | **2. Molting** | Check tank bottom/walls. | Hard shells, occasional soft shells. | Many soft shells, shrimp eating molts. | **Mass molting event** + cannibalism visible. |
  | **3. Behavior** | Tap tank gently. | Shrimp scatter actively. | Slow reaction, some stay still. | **No reaction**, shrimp swimming erratically/spinning. |
  | **4. Body Integrity** | Spot check 5 shrimp. | Full antennae, clean shell, full gut. | Missing antennae tips, slight discoloration. | **White muscle**, black spots, missing limbs. |

  **Action Matrix:**
  *   **All Green:** Feed normally.
  *   **Any Yellow:** Cut feed by 50%. Perform 10% water change. Check aeration stones.
  *   **Any Red:** **DO NOT FEED.** Max out aeration. Emergency water change (20%). Call Vet/Owner.

  ---

  ### Part 3: The Escalation Ladder (Who Decides?)

  When you hit a Yellow or Red, you need to know who makes the call.

  1.  **The Mechanic Call (You/Staff):** Fix the hardware. Clean filters, unclog pipes, replace air stones. This is routine maintenance.
  2.  **The Vet Call (Medical/Emergency):** Disease outbreak, unexplained mass death, parasite load. *Trigger:* >5% daily mortality or visible lesions/parasites.
  3.  **The Owner Call (Values/Economics):** This is where welfare conflicts with money. *Trigger:* A procedure is profitable but causes stress, or a welfare fix costs significant money. **You cannot decide this alone.**

  ---

  ### Part 4: Running Your Three Real Calls
  Here is how the MWD procedure processes your current dilemmas. I have applied the logic strictly.

  #### 1. Crowding Trout for 5-6 Hours (Staffing Issue)
  *   **The Procedure Says:** **RED STOP.**
  *   **Why:** Trout in a grading net have restricted movement and reduced water flow exchange. Holding them for 5-6 hours will cause ammonia to spike locally around the fish and oxygen to drop.
  *   **MWD Indicator:** Step 2 (Surface Behavior). They will start piping/gasping within 1-2 hours. Step 4 (Smell) will trigger ammonia.
  *   **The Hard Truth:** This is a "Owner Call" that violates the "Red" safety limit. You are trading oxygen debt for labor savings. The fish will survive, but their immune systems will crash, leading to disease outbreaks 2 weeks later (the "lag indicator").
  *   **Verdict:** **Do not do this.** The procedure forces you to hire the help or grade in smaller batches. The cost of the disease outbreak later exceeds the cost of the labor now.

  #### 2. Ice Slurry Harvest (Stunner Broken)
  *   **The Procedure Says:** **RED STOP.**
  *   **Why:** Trout are cold-blooded but feel pain. Putting a conscious fish into ice slurry causes thermal shock and suffocation. It is widely considered inhumane compared to percussive or electrical stunning.
  *   **MWD Indicator:** This is a "Values/Ethics" Red Flag. While you won't see it on the morning check, it violates the "Welfare" premise of your role.
  *   **The Hard Truth:** You cannot harvest humanely right now.
  *   **Verdict:** **Delay harvest or find a manual percussive method.** If you must harvest, you need to train staff to strike the fish on the head (blunt force) *before* icing. Ice slurry alone is not an acceptable substitute for stunning. If the owners say "Ice them anyway," you document that this violates the welfare protocol you were hired to enforce.

  #### 3. Berried Shrimp in Bare Bright Tanks (Production vs. Welfare)
  *   **The Procedure Says:** **YELLOW -> ESCALATE TO OWNERS.**
  *   **Why:** The water params might be Green (Step 1), and they are producing larvae (Goal met). However, Step 4 (Body Integrity) shows missing antennae and early death. This is chronic stress.
  *   **MWD Indicator:** Step 4 is failing (missing antennae = aggression/stress). Step 3 (Behavior) might show hyperactivity due to 24/7 light.
  *   **The Hard Truth:** This is a **Values Call**, not a facts call. The biology works (you get babies), but the cost is the mothers' lives and welfare.
  *   **Verdict:** **Kick to Owners.** Present the data: "We get 20% more larvae, but we lose 40% of breeding stock longevity and have higher cannibalism rates." Let the owners decide if the extra larvae are worth burning out the breeding stock. Do not hide this behind "efficiency."

  ---

  ### Part 5: The Hard Truths & Limitations

  You asked for honesty about where this will misfire and what you won't like.

  **1. The "Money Hit" (What you won't like)**
  The procedure forces you to stop the **Trout Crowding (Scenario 1)**. I know you are short-staffed. I know hiring costs money. But the checklist identifies this as a physiological red-line. If you ignore it, you aren't running a farm; you're running a ticking time bomb. The fish *will* get sick. The vet bill and mortality loss in 14 days will cost 3x what the extra labor costs today. **The checklist demands you spend money now to save money later.**

  **2. Where the Checklist Misfires (Human Judgment)**
  *   **The "Normal" Trap:** The checklist relies on baselines. If your water is always *slightly* dirty, you might mark "Smell" as Green because it's "normal for us." You must recalibrate your "Normal" every month when the Vet visits. Ask them: "Is this smell actually okay?"
  *   **Shrimp Stealth:** Shrimp die silently. You can have a Green checklist in the morning and a tank of dead shrimp by noon. The checklist reduces risk; it does not eliminate it. You need backup alarms on oxygen sensors if possible.
  *   **The "Harvest" Blind Spot:** Morning checks monitor *growth*, not *death*. Scenario 2 (Harvest) isn't covered by the morning checklist because it happens at the end of the lifecycle. You need a separate **Harvest Protocol** that mandates stunning. Do not let production pressure override the Harvest Protocol.

  **3. What This Procedure Cannot Do**
  *   **It Cannot Fix Economics:** If the farm is only profitable by abusing the animals (like Scenario 3), this checklist will highlight the abuse, but it cannot fix the business model. You and your partner will have to choose: Are we a high-welfare farm with lower margins, or a factory?
  *   **It Cannot Measure Pain:** We check for behavior and injury. We assume no pain if there is no reaction. We could be wrong. We operate on the precautionary principle: If it looks like it hurts, assume it does.
  *   **It Cannot Replace the Vet:** I am giving you a dashboard warning light system. I am not giving you an engine repair manual. If the light goes Red, you call the pro. Do not try to medicate fish based on internet advice.

  **Final Advice:**
  Print these checklists. Laminate them. Clip them to the raceway fences and tank stands. Make your part-timers initial them every morning. If they check a box that is Red, they are empowered to stop feeding and call you. If you punish them for stopping production to save the stock, the checklist becomes worthless paper. **You have to mean it.**
