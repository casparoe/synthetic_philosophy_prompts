answer: |-
  This is a sophisticated conceptual hurdle you have encountered. You are essentially grappling with a category error between **extensive properties** (those that depend on the amount of matter, such as volume or mass) and **intensive properties** (those that describe the state or quality of the system, such as temperature, density, or, in this case, conscious capacity).

  The snag arises because moral status is widely argued to supervene on *capacity* (an intensive property), yet brain size is an *extent* (an extensive property). When you introduce non-neural substrates, the correlation between extent and capacity breaks, revealing that 'scaling invariance'—the principle that moral worth should remain constant regardless of the physical scale of the substrate, provided functional organisation is preserved—has been violated by the brain-size metric.

  Here is the conceptual structure spelled out, centred on a specific thought experiment.

  ### The Conceptual Structure: Extensive vs. Intensive Moral Properties

  To resolve the snag, you must first frame the error as a misunderstanding of what kind of property moral status is.
  1.  **The Assumption:** The 'brain size' hypothesis treats moral status as an **extensive property**. It implies that moral worth is additive; more neural tissue equals more moral weight, much like adding more bricks adds to the weight of a wall.
  2.  **The Counter-Principle:** Functionalism and most contemporary ethical frameworks treat moral status as an **intensive property**. It depends on the *organisation* of the system, not the quantity of stuff. A degree of pain is equally painful whether it occurs in a large brain or a small one; the *intensity* of the experience does not scale with the volume of the tissue producing it.
  3.  **The Scaling Invariance Requirement:** If moral status supervenes on functional capacity (e.g., the ability to suffer, reason, or anticipate), then moral status ought to be **scale-invariant**. That is, if you can preserve the functional architecture while altering the physical volume, the moral status should remain unchanged.

  ### The Case Study: The Scalable Silicon Isomorph

  To demonstrate the collapse of the brain-size metric without relying on empirical neuroscience (such as neuron density counts), consider the case of the **Scalable Silicon Isomorph**.

  **The Scenario:**
  Imagine we possess the technology to map the complete functional connectome of a human mind and instantiate it on a non-neural substrate, such as a silicon-based computational architecture. Crucially, this substrate is modular and scalable.
  *   **Instance A:** The mind is run on a high-density chip the size of a sugar cube.
  *   **Instance B:** The exact same mind, with identical functional capacities for pain, joy, and agency, is run on a distributed server farm occupying a warehouse.

  **The Collapse of the Metric:**
  If you adhere to the 'brain volume' proxy, you encounter an immediate logical contradiction:
  *   If moral status scales with volume, **Instance B** (the warehouse) possesses vastly higher moral status than **Instance A** (the sugar cube), despite having the *exact same* conscious experiences and capacities.
  *   Conversely, if you argue that only biological neural tissue counts, both instances have zero moral status, which contradicts the functionalist intuition that they are conscious.

  Here, the brain-size metric collapses not because we lack data on neuron counts, but because the **mapping between volume and capacity is not invariant across substrates**. In biology, size might correlate with capacity due to physical constraints on neurons. In silicon, that constraint does not exist. Therefore, using volume as a proxy for moral status is conceptually redundant; it measures the container, not the content.

  ### The Framing Problem: Violating Scaling Invariance

  The core of your chapter should argue that the 'brain size' position fails because it violates the principle of **Moral Scaling Invariance**.

  In physics, a law is scale-invariant if it holds true regardless of the system's size. In ethics, we should expect that the *moral law* governing a mind remains invariant regardless of the physical scale of the substrate, provided the functional state is identical.
  *   **The Framing Error:** Proponents of brain size implicitly treat consciousness as a 'fluid' that fills a volume. They assume that a larger vessel holds 'more' morality.
  *   **The Correction:** Consciousness is more akin to a 'software state'. Running the same software on a laptop versus a supercomputer does not change the software's output or its rights. By tying moral status to volume, you are tying it to a variable (physical size) that is orthogonal to the variable that actually matters (functional organisation).

  ### The Lingering Intuition: Why Size Still Feels Relevant

  You mentioned that the intuition that "bigger brains carry more weight" lingers. This is crucial for your chapter, as it explains why the error persists despite the logical collapse. This is not a neural empirical issue, but a **phenomenological bias**.

  1.  **Spatial Presence as Ontological Weight:** Humans are embodied agents. We intuitively associate physical magnitude with significance. A large animal feels more 'present' and formidable than a small one. We conflate **physical dominance** with **moral standing**. When we see a large brain (or a large body), we intuitively feel there is 'more there' to be harmed.
  2.  **The Substrate Chauvinism:** There is a lingering intuition that biological matter has a unique 'moral texture'. Even if a silicon chip functions identically, we feel the biological brain is more 'real'. When you combine this with size, the intuition compounds: a large biological brain feels like the apex of moral reality, whilst a small or non-neural equivalent feels diminutive or derivative.
  3.  **The Error of Aggregation:** We mistakenly assume that because a larger brain *can* support more complex capacities (in a biological context), it *must* contain more moral worth per unit of volume. We fail to distinguish between the *potential* capacity of a substrate and the *actualised* capacity of the mind inhabiting it.

  ### Summary for Your Chapter

  To articulate this cleanly in your text, you might structure the argument thus:

  1.  **Define the Proxy:** Brain volume is often used as a heuristic for cognitive capacity and, by extension, moral status.
  2.  **Introduce the Invariance Principle:** Argue that moral status should supervene on functional capacity, which ought to be invariant under changes of physical scale (Scaling Invariance).
  3.  **Present the Isomorph Case:** Use the silicon example to show that identical function can exist at vastly different scales.
  4.  **Demonstrate the Collapse:** Show that applying the volume metric yields absurd results (the warehouse mind is 'worth more' than the chip mind), proving the metric is conceptually redundant.
  5.  **Diagnose the Intuition:** Conclude that the lingering belief in size-based morality is a category error, conflating extensive physical properties with intensive moral properties, driven by our embodied bias towards spatial magnitude.

  This approach allows you to bypass the neuroscience debate entirely and focus on the philosophical framing error, which seems to be the precise snag you are aiming to resolve.
