answer: |-
  You have identified a genuine, structural limitation in the Debate protocol that is often glossed over in high-level summaries. There is no single canonical term for this specific failure mode (like "Gish Gallop"), but it is a recognized problem in the AI safety literature under a few overlapping headers.

  Here are the nearest existing candidates, why they miss, and then the specific carving you are looking for.

  ### The Near Misses

  **1. Motte-and-Bailey**
  *   **The Concept:** A debater asserts a controversial claim (the Bailey), then retreats to a defensible but irrelevant claim (the Motte) when challenged, only to slide back to the Bailey later.
  *   **Why it misses:** In your examples, the debaters aren't sliding between *different claims*. They are sticking to the same claim ("The bridge is safe") and conceding the *facts* underneath it. The Motte-and-Bailey relies on semantic equivocation; your scenario relies on **evaluative aggregation**. The dishonest debater isn't hiding; they are openly conceding facts but arguing those facts don't matter enough to change the conclusion.

  **2. The "No-Crux" Problem (CFAR/Rationalist community)**
  *   **The Concept:** A belief is supported by so many small, independent reasons that disproving one doesn't change the conclusion. There is no single "crux" that, if overturned, flips the belief.
  *   **Why it misses:** This is the closest existing concept. However, "No-Crux" usually describes a *psychological state* of the believer (why they won't update). You are describing a *protocol failure* (why the judge can't decide). The Debate protocol *assumes* a crux exists or can be manufactured via zooming. Your observation is that for weighted problems, **a crux may not exist.**

  **3. The Judge's Prior Problem (AI Safety Literature)**
  *   **The Concept:** Debate fails if the human judge lacks the background knowledge (priors) to evaluate the significance of a claim, even if the claim is factually verified.
  *   **Why it misses:** This describes the *cause* of the failure (the judge's lack of expertise), but not the *shape* of the argument itself. You are asking about the structure of the argument that exploits this lack of priors.

  ---

  ### The Carving: "The Aggregation Blindspot"

  Since there is no single standard label, the most precise term for this failure mode is **The Aggregation Blindspot**.

  The tactical maneuver the dishonest debater uses is **Cruxless Concession**.

  #### Definition
  **The Aggregation Blindspot** is a failure mode in truth-seeking protocols (like Debate) where the ground truth depends on the **weighted aggregation of multiple ambiguous factors** rather than the **conjunctive validity of specific facts**.

  The protocol succeeds at verifying *inputs* (facts) but fails to verify the *function* (the weighting scheme). Because the protocol rewards factual accuracy, debaters are incentivized to concede factual points that weaken their position slightly, betting that the judge lacks the expertise to recognize that the *cumulative weight* of these concessions invalidates the conclusion.

  #### Why Debate Fails Here
  Debate relies on **asymmetry of effort**: it is easier to prove a specific fact false than to prove a complex argument true.
  *   **Conjunctive Claims (Debate works):** "Safe" = A AND B AND C. If the liar says B is true, the truth-teller proves B is false. The liar loses instantly. The error is *localizable*.
  *   **Weighted Claims (Debate fails):** "Safe" = 0.4(A) + 0.4(B) + 0.2(C). The liar says A is "strong." The truth-teller proves A is "medium." The liar concedes. The judge knows A is "medium," but does not know if "medium" is sufficient. The error is *distributed*.

  The liar does not need to lie about the world; they only need to lie about the **significance function**. Since significance is subjective (or requires deep expertise), the "fact-checking" mechanism of Debate cannot touch it.

  ### Boundary Cases: Conjunctive vs. Aggregative

  To determine if a question has this shape, apply the **Single-Point-of-Failure Test**.

  | Feature | **Chain-of-Facts (Debate Works)** | **Aggregation Blindspot (Debate Fails)** |
  | :--- | :--- | :--- |
  | **Logical Structure** | Conjunctive (AND gates). | Additive/Weighted (Weighted Sum). |
  | **Falsification** | Any single link broken destroys the claim. | No single link destroys the claim; only the sum does. |
  | **Debater Strategy** | Defend every fact aggressively. | Concede minor facts to preserve credibility; argue significance. |
  | **Judge's Task** | Verify truth value (True/False). | Verify significance (How much does this matter?). |
  | **Example** | "Is this cryptographic key secure?" (One flaw breaks it). | "Is this bridge safe?" (Many small risks accumulate). |
  | **Example** | "Did the suspect commit the murder?" (Alibi breaks case). | "Will this policy improve the economy?" (Many small factors). |

  **The Boundary Line:**
  The transition happens when the **margin of error on the weights** exceeds the **margin of safety on the conclusion**.
  *   If the bridge fails at a load of 100 tons, and the calc says 105 tons, but the uncertainty on the weld quality is ±10 tons, you are in the Aggregation Blindspot.
  *   If the calc says 200 tons, the uncertainty doesn't matter. Debate works fine (the conclusion is robust).
  *   Debate fails specifically in the **region of sensitivity**, where the conclusion hinges on precise weighting of ambiguous inputs.

  ### What To Do Instead

  If you identify a problem as having the **Aggregation Blindspot** shape, standard Debate is the wrong tool. You need protocols that force the *weighting* to be the object of scrutiny, not just the facts.

  **1. Market Making (Prediction Markets)**
  Instead of a judge deciding who won, have the models make bets on the outcome.
  *   *Why:* A model can't just concede "the weld is slightly weak" without moving the market price on "Bridge Failure." The cost of concession becomes explicit. If the "Safe" model keeps conceding risks but the probability of failure doesn't drop, the market reveals the inconsistency.
  *   *Mechanism:* Truth is revealed by price stability, not rhetorical victory.

  **2. Recursive Reward Modeling (RRM)**
  Train the judge (or a helper model) to evaluate the *weighting*, not just the facts.
  *   *Why:* You acknowledge the judge lacks the prior. You use AI to help the judge build the prior. "Given that the weld is 90% perfect, how much should that lower the safety score?"
  *   *Mechanism:* Shifts the task from "Who lied?" to "What is the correct evaluation function?"

  **3. Quantified Debate**
  Force debaters to output numerical credences, not binary claims.
  *   *Why:* In your bridge example, the "Safe" debater says "Incomplete records don't change the load calc." Force them to say "Incomplete records reduce safety margin by exactly 0%."
  *   *Mechanism:* The "Truth" debater can then argue "It reduces it by 5%." Now the judge isn't weighing "Does it matter?" but "Is it 0% or 5%?" This localizes the disagreement to a specific number, which is easier to adjudicate than a vague "significance."

  **4. The "Consultancy" Model (Audit Trails)**
  Abandon the adversarial setup. Use one model to produce the answer and a second model to audit the *reasoning trace* for omitted factors.
  *   *Why:* In Aggregation problems, the sin is often **omission** rather than **commission**. The "Safe" debater isn't lying about the weld; they are failing to mention the corrosion.
  *   *Mechanism:* The auditor is rewarded for finding *relevant factors* the producer left out, rather than proving facts false.

  ### Summary
  You haven't misunderstood the setup; you've found the boundary condition. Debate is a **fact-verification engine**, not a **wisdom-aggregation engine**.

  *   **Name:** The Aggregation Blindspot.
  *   **Tactic:** Cruxless Concession.
  *   **Diagnosis:** The error is in the *weights*, not the *values*.
  *   **Fix:** Move from adversarial fact-checking to quantitative credence or market-based consistency checks.
