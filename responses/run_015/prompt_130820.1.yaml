answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed Tax Levy Entrenchment Amendment

  **Recommendation**

  I recommend that the Commission reject the proposed amendment in its current form and instead adopt a modified version incorporating a "sunset and renewal" clause. Specifically, we should reduce the entrenchment period from fifteen to ten years and require that the supermajority requirement automatically lapse after five years unless the then-sitting Council re-enacts it by ordinary majority. This modification preserves fiscal discipline while respecting the democratic sovereignty of future electorates.

  **Reasoning: The Moral Difference Between Binding Self and Others**

  To evaluate this amendment, we must distinguish between two types of precommitment. The first is self-binding: an agent restricting their own future choices to overcome weakness of will. In political theory, this is the "Ulysses contract," named after the hero who tied himself to the mast to resist the Sirens. When a community binds itself, it is an exercise of autonomy. We acknowledge that today's passions may be dangerous, so we establish rules to protect our own long-term interests.

  The second is other-binding: one group restricting the choices of a future, distinct group. This is morally distinct because the future group did not consent to the restriction. When the electorate changes significantly—as it does over fifteen years through migration, death, and new voters—the "self" that bound the mast is no longer the "self" tied to it. Binding successors is not autonomy; it is domination. It treats the charter not as a living framework for self-government, but as a contract imposed by the dead upon the living.

  **Application to the Proposed Amendment**

  The current proposal falls into the trap of other-binding. A fifteen-year entrenchment clause effectively insulates fiscal policy from the consent of the governed for a generation. While proponents argue this ensures credibility with lenders, it does so by sacrificing democratic legitimacy. It assumes that the current majority's preference for fiscal restraint is superior to any future majority's preference for public investment. Even if that assumption is correct today, it cannot be guaranteed for 2028 or 2035. By making repeal nearly impossible, we deny future citizens the right to assess their own needs and risks. We are not tying ourselves to the mast; we are tying our successors to it without their consent.

  **Application to the Compromise**

  The modified proposal addresses this moral deficit. By requiring periodic re-enactment, we transform the constraint from a permanent decree into a recurring choice. If the Council and public believe the tax cap remains necessary after five years, they must affirm it. This restores the element of self-binding. The future electorate is not bound by the past; rather, they are invited to bind themselves anew based on current conditions.

  This structure changes the nature of the precommitment. It no longer functions as an iron wall but as a "speed bump" that forces deliberation. The default setting shifts: instead of restraint being permanent unless overthrown, restraint becomes a policy choice that must be maintained. This ensures that the constraint survives only as long as it retains political support, aligning fiscal rules with democratic will.

  **The Strongest Objection: The Credibility Problem**

  The strongest argument against this modification is that it defeats the purpose of precommitment entirely. Proponents of the original amendment argue that credibility requires costliness. If bond markets and fiscal hawks know that the constraint can be removed by a simple majority vote every five years, they will not price in the stability they would expect from a hard lock. A Ulysses contract only works if the agent cannot untie themselves. If we keep the key, we might succumb to the Sirens' call when spending pressures mount.

  Furthermore, critics may argue this compromise collapses into a default that a determined majority simply walks away from. If the political climate shifts toward spending, a simple majority will let the clause lapse. In this view, the modification offers the worst of both worlds: it lacks the rigidity to ensure long-term planning stability, yet it retains enough complexity to confuse voters. It sacrifices the economic benefit of lower interest rates—which rely on guaranteed restraint—for a theoretical democratic purity that may result in fiscal myopia.

  **Rebuttal and Conclusion**

  While the credibility objection is serious, it relies on a fiction: that legal entrenchment is absolute. In a democracy, no law is truly irreversible. A sufficiently determined majority can always repeal even entrenched laws, often by going around them or pressuring the state to override them. Hard locks that lack public support often breed resentment and lead to chaotic breaches of trust rather than orderly governance.

  True stability comes not from the impossibility of change, but from the legitimacy of the constraint. A fiscal rule that is periodically reaffirmed by successive councils signals a durable cultural commitment to restraint, rather than a legal accident of a past election. By adopting the sunset clause, we acknowledge that while we can warn our successors of the dangers of debt, we cannot rule them. We offer them the mast, but we let them decide whether to tie themselves to it. This balances the need for fiscal credibility with the imperative of democratic consent.

  I urge the Commission to adopt this modified approach.
