prompt: |-
  After a long argument with a friend last night, I want the joint statement we should have produced instead of the argument. We sit on a committee that divides a fixed budget between two patient groups, and everything came down to interpersonal comparisons of utility: my friend holds that there is a fact of the matter about whether one person's gain exceeds another's and that a careful protocol can approximate it; I hold that utility is ordinally measurable and agent-relative, so any cross-person comparison is a normative stipulation presented as a measurement.

  The case that broke the argument was one I improvised — call it the round-trip protocol. Instead of asking anyone to compare two other people, you ask A to place herself and B on one scale, then ask B to do the same; a comparison counts as calibrated only if the two orderings agree and if routing it through a third person C returns the same result as making it directly. I stipulated that in the pilot run the round trip never closes: the gap shrinks with calibration and with shared experience of the states being compared, but a residual asymmetry of roughly a third persists, and it is systematically larger the more the two people differ in affective range.

  Draft the statement both of us could sign: the claims we already agree on; the disagreement stated in wording each side would accept for its own view; the cruxes; and, for each crux, the case, test, or argument both of us would accept as bearing on it, with each side's prediction about the round-trip protocol written down in advance. Say plainly which parts of the dispute, if any, are merely verbal. Keep the settled background separate from the contested claims: neither the sceptical line nor my friend's constructivist line should be written up as if it were the consensus.

  Format: (1) a numbered list of agreed claims; (2) a table with the columns crux | accepted test or case | sceptic's prediction | constructivist's prediction | whose view the result would move, and why; (3) a JSON object with the keys settled, contested, merely_verbal, and unmoved_by_this_collaboration, each holding a list of one-sentence strings.
