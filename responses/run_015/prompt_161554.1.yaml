  | **Interpretation of Protocol Output:** Does the protocol discover a pre-existing ratio (Constructivist) or create a binding ethical convention (Sceptic)? | **Policy Stress-Test:** Apply the protocol to a case where the "calibrated" result contradicts a strong prior ethical intuition (e.g., saving a life vs. curing mild discomfort). | The protocol will yield a "measurement" that contradicts intuition, proving it is a stipulation that overrides rather than reveals value. | The protocol will align with intuition once calibrated, proving it tracks the underlying moral facts of welfare magnitude. | **Constructivist:** If the protocol consistently violates robust moral intuitions, its claim to measure "fact" is undermined.<br>**Sceptic:** If the protocol consistently aligns with intuition without circularity, the claim that it is *mere* stipulation is weakened. |

