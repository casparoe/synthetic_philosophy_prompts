  5. Clustering-neutrality is a prejudice of your position rather than a genuine desideratum, because accepting it treats a massacre and scattered murders as equivalent while rejecting it acknowledges the unique destabilizing cost of concentrated violence; this is merely a preference of one camp.
  6. If the level of violence is a weighted aggregate whose trend can flip with the weights, the thesis asserts only that a specific valuation of harms aligns with historical data, meaning there is no weight-independent fact of the matter.
  7. Comparability and Boundary cannot be jointly satisfied because expanding the category to include unrecorded structural harm inevitably sacrifices data uniformity across eras. The Boundary desideratum does the most work excluding the civilising-process, state-monopoly, and archaeological accounts, as they all rely on excluding state-inflicted or structural harm to demonstrate a decline.
