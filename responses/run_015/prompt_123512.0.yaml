answer: |-
  ### The Marketplace Category Decision Procedure

  This procedure is designed to separate the question of **alienability** (can this good be owned and traded at all?) from the question of **noxiousness** (is the market structure causing harm?). It forces the panel to identify whether a refusal is based on the nature of the good or the mechanics of the exchange.

  **Timebox:** 90 minutes per case.
  **Output:** A one-page public note draft and an internal lever selection.

  #### Phase 1: The Inalienability Check (Tradability)
  *Question:* Does selling this good destroy its essential value, violate a civic duty, or treat a person as a mere instrument?
  *   **Test A (Civic Integrity):** Does the trade allow wealth to bypass a democratic or legal allocation meant to be equal? (e.g., votes, jury duty, public queue slots).
  *   **Test B (Bodily/Social Integrity):** Does the trade require the seller to surrender bodily integrity or a relationship that cannot be consensually contracted? (e.g., surrogacy, friendship, forgiveness).
  *   **Test C (Corruption):** Does the price mechanism crowd out the non-market value required for the good to function? (e.g., paying a friend to listen to your problems turns friendship into service).

  *   **Termination:** If **Yes** to any test $\rightarrow$ **REFUSE (Ban).** The good is inalienable. No lever can fix this.
  *   **Proceed if:** The good is fundamentally tradable (e.g., labor, time, access, goods).

  #### Phase 2: The Noxiousness Check (Terms of Trade)
  *Question:* Assuming the good is tradable, does the *current proposed structure* create harm that price alone does not solve?
  *   **Test A (Desperation/Coercion):** Are sellers likely participating due to a lack of alternatives rather than genuine preference? (Look for high distress signals, extreme price sensitivity, or vulnerability).
  *   **Test B (Negative Externalities):** Does the transaction harm a non-consenting third party? (e.g., noise, fraud, market distortion, safety risks).
  *   **Test C (Information Asymmetry):** Is one party systematically unable to judge the quality or risk of the trade?

  *   **Termination:** If **No** to all tests $\rightarrow$ **PERMIT (Unrestricted).**
  *   **Proceed if:** **Yes** to any test. The good is tradable, but the *terms* are toxic. Select a Lever (below) to mitigate the specific harm.

  #### Phase 3: The Aversion Audit (Values vs. Facts)
  *Question:* Is our hesitation based on evidence of harm or mere unfamiliarity?
  *   **The Substitution Test:** If this transaction happened offline, privately, and without money changing hands (e.g., a favor), would we still object?
      *   If **Yes**: The objection is about the *act* (Return to Phase 1).
      *   If **No**: The objection is about the *money* (Proceed to Crowding Out).
  *   **The Crowding Out Test:** Will introducing money reduce the supply of the good provided for free/non-market reasons? (e.g., paying blood donors reduces voluntary donation).
      *   If **Yes**: We must weigh the efficiency gain against the social loss. This is a **Value Conflict**.
      *   If **No**: The aversion is likely **Unfamiliarity**. Proceed to Permission.

  #### Phase 4: Lever Selection
  If Phase 2 identified harm, apply the specific lever that matches the defect. Do not ban if a lever suffices.
  *   **Harm: Desperation/Exploitation** $\rightarrow$ **Cap Earnings/Volume.** (Prevent professionalization of vulnerable sellers).
  *   **Harm: Externalities/Public Harm** $\rightarrow$ **Restrict Buyers/Sellers.** (Verify identity, limit frequency).
  *   **Harm: Information Asymmetry/Fraud** $\rightarrow$ **Mandatory Disclosure.** (Require explicit consent from affected third parties).
  *   **Harm: Market Distortion** $\rightarrow$ **Price Controls or Routing.** (Force transaction through platform to monitor, or set floors/ceilings).

  #### Phase 5: The Handoff
  If the panel cannot agree on Phase 1 (Inalienability) or Phase 3 (Crowding Out), the procedure **Stops**. This is not a factual dispute but a value conflict. The decision must be escalated to a broader governance body or the Board, as the panel lacks the mandate to set social norms, only to enforce safety and fairness.

  ***

  ### Application to Live Matters

  #### Case 1: Queue for Sneaker Release (Reseller Buyers)
  **Procedure Run:**
  *   **Phase 1 (Inalienability):** Time is tradable. Access to a commercial good is tradable. **Pass.**
  *   **Phase 2 (Noxiousness):**
      *   *Desperation:* High risk. Sellers are often low-income individuals paid to stand for hours; buyers are capitalized resellers. This creates a labor arbitrage dynamic.
      *   *Externalities:* The transaction facilitates a secondary market that violates the vendor's terms of service (often) and distorts the primary market (fans cannot buy shoes).
      *   *Result:* **Harm Identified.**
  *   **Phase 3 (Aversion):** Our aversion is not unfamiliarity; we understand gig work. It is about the *purpose*. The Substitution Test: If I stood in line for my friend for free, it's a favor. If I stand in line for a stranger for money so they can scalp, it's labor exploitation for market distortion.
  *   **Phase 4 (Lever):**
      *   *Cap Volume:* Limit sellers to one queue slot per release. Limit buyers to purchasing one slot per release.
      *   *Problem:* Enforcement is difficult. Resellers will create multiple accounts.
      *   *Decision:* The harm (facilitating scalping rings using vulnerable labor) outweighs the utility. The "Terms" are so damaged they render the trade noxious in this specific context.

  **Ruling:** **REFUSE (Ban).**
  **Reasoning:** While time is tradable, this specific configuration turns the platform into a tool for professional scalpers to exploit gig-laborers. It fails the Desperation and Externalities checks. We cannot effectively cap the volume without turning into a police force for sneaker vendors.
  **Panel Friction:** I expect you to dislike this. It is high-volume, low-liability revenue. You will argue we are not responsible for the secondary market. The procedure argues that facilitating the *mechanism* of the scalping ring makes us a co-participant in the market distortion.

  #### Case 2: Queue for City Council Comment Slot
  **Procedure Run:**
  *   **Phase 1 (Inalienability):**
      *   *Civic Integrity Test:* The city allocates slots to *persons* to ensure equal access to government. Selling the slot converts a civic right into a commodity. Wealth buys voice.
      *   *Result:* **Fail.**
  *   **Termination:** **REFUSE (Ban).**
  **Reasoning:** This fails Phase 1. It does not matter if the terms are safe or disclosed. The good itself (access to democratic process) is inalienable in a marketplace context. Allowing this undermines the legitimacy of the public forum the city established.
  **Panel Friction:** None expected. This is a clear "Protected Sphere" violation.

  #### Case 3: Paid Mourners/Guests (Existing Category)
  **Procedure Run:**
  *   **Phase 1 (Inalienability):**
      *   *Social Integrity Test:* Is presence at a funeral a relationship that cannot be contracted? No. Actors are hired for roles; guests are hired for support.
      *   *Corruption Test:* Does money crowd out the value? Only if the presence is deceptive. If the family knows, the value is "support," not "friendship."
      *   *Result:* **Pass.** The good is tradable.
  *   **Phase 2 (Noxiousness):**
      *   *Information Asymmetry:* High. The "Host" (bereaved family) often does not know the guest is paid. This is fraud.
      *   *Result:* **Harm Identified.**
  *   **Phase 3 (Aversion):** Our aversion is partly unfamiliarity (monetizing grief), but mostly about the deception. The Substitution Test: If a friend sent a proxy without telling you, you would be hurt. If they told you, it is unusual but acceptable.
  *   **Phase 4 (Lever):**
      *   *Mandatory Disclosure:* Require the seller to confirm that the Host (family/organizer) is aware the guest is paid.
      *   *Routing:* Force booking through the platform to create a record of disclosure.

  **Ruling:** **PERMIT (Conditioned on Disclosure).**
  **Reasoning:** Emotional labor is a valid service. The harm is not the trade, but the secrecy. We require proof that the Host consented to a paid guest.
  **Survival if Shutdown:** If you decide to ban this category despite this ruling (due to brand risk), the principle that survives is: **"Emotional labor is tradable only when the recipient consents to the commercial nature of the support."** You may shut down the category, but you cannot logically ban the *concept* without banning acting, therapy, or hosting services. You would be banning it for optics, not for the procedural reasons outlined above.

  ***

  ### Limitations and Misfires

  **1. The Value Conflict Blind Spot**
  This procedure cannot resolve disagreements in Phase 1 (Inalienability) or Phase 3 (Crowding Out). If one panelist believes "grief is sacred and cannot be priced" and another believes "all labor is equal," the procedure flags this as a **Handoff**. It will not generate a consensus. It will only tell you *why* you disagree. In these moments, the procedure will feel like a failure because it demands a decision you are not equipped to make without a shared moral framework.

  **2. The Enforcement Gap**
  The procedure assumes levers (like Caps or Disclosure) are enforceable. In Case 1 (Sneakers), I recommended a Ban because the Levers were unenforceable. In Case 3 (Mourners), I recommended Disclosure. If users move off-platform to hide the payment, the procedure creates a false sense of security. It optimizes for *policy coherence*, not *compliance reality*. You will approve categories that leak harm because the users evade the levers.

  **3. The "Unfamiliarity" Bias**
  The Aversion Audit relies on the panel's ability to distinguish "new" from "wrong." But panelists are products of their culture. We may consistently fail the Substitution Test on things that are simply culturally novel (e.g., renting a friend) and label them "Value Conflicts" when they are just "Unfamiliarity." The procedure slows down bias; it does not eliminate it.

  **4. The Jurisdictional Mirage**
  We explicitly excluded "lawfulness" as the primary driver. However, in practice, a "Permit with Disclosure" ruling in Case 3 may violate local laws regarding funeral services in specific jurisdictions. The procedure treats the marketplace as a single zone, but it operates in fifty. You will have to overlay a legal compliance check that might override the philosophical ruling, rendering the nuance moot in high-risk regions.

  **Final Note to the Panel:**
  This tool will not make you moral. It will make you consistent. It will force you to admit when you are banning something because it is dangerous (Case 2), when you are banning it because you can't police it (Case 1), and when you are allowing it because the harm is manageable (Case 3). Use it to write the public note, but do not use it to sleep at night. The hard choices remain yours.
