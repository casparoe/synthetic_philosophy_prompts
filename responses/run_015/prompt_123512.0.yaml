      *   *Key Distinction 1 (Tradability vs. Terms):* Is the object itself corruptible by price (e.g., votes, babies)? Or is the object fine, but the *context* creates harm (e.g., kidneys sold under duress vs. compensated donation)?
      *   *Key Distinction 2 (Aversion vs. Unfamiliarity):* Is the "yuck factor" protecting a social norm (e.g., selling friends) or just resistance to change (e.g., renting a stranger's closet)?
      *   *Key Distinction 3 (Crowding Out):* Does money drive out non-market values? (e.g., paying kids to read might make them read less for love).
