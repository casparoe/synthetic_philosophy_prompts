  # JOINT STATEMENT ON THE ONTOLOGY OF PATTERNS AND THE STATUS OF THE STANCES

  **Parties:** Camp R (Realist about Patterns) and Camp I (Instrumentalist about Stances)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Physical, Design, and Intentional Stances

  ## 1. AGREED CLAIMS AND METHODOLOGICAL FRAMEWORK

  We, the undersigned, acknowledge a long-standing disagreement regarding the metaphysical status of patterns and the truth-value of attributions made under the Intentional Stance. To move beyond stalemate, we have adopted a common scorecard based on Algorithmic Information Theory and Causal Interventionism. We agree that the following claims represent our shared methodological ground and our joint interpretation of the four stipulated target profiles (S1–S4) used in this collaboration.

  **Note on Literature Status:** *While the distinction between the Physical, Design, and Intentional stances is well-established in the literature (most notably in the work of Daniel Dennett), the specific metricization proposed below (combining Minimum Description Length with Intervention Robustness) is a novel formalization for this collaboration. Furthermore, the four target profiles (S1–S4) are stipulated hypothetical cases constructed for this dialectic; they are not presented as empirical consensus findings from cognitive science or physics, but as agreed-upon test cases to probe our theoretical divergences.*

  1.  **Definition of Stances:** We agree to define the stances by their predictive assumptions:
      *   **Physical Stance:** Predicts behavior based on physical constitution and laws of nature.
      *   **Design Stance:** Predicts behavior based on assumed function and optimality, ignoring physical constitution.
      *   **Intentional Stance:** Predicts behavior based on assumed rationality, beliefs, and desires.
  2.  **The Common Scorecard:** For any target system and stance, we record:
      *   (i) **Accuracy:** Predictive success on held-out situations.
      *   (ii) **Total Description Length (TDL):** The sum of the bits required to state the stance's assumptions (e.g., the belief/desire set) plus the bits required to encode the residual error in the behavioral record.
      *   (iii) **Intervention Robustness:** Whether predictions degrade gracefully when system components are modified, or fail systematically.
  3.  **The No-Traps/No-Miracles Condition:** We assume the environment is not rigged to deceive a specific stance (No-Traps) and that predictive success is not the result of statistical luck (No-Miracles). This condition rules out skeptical hypotheses where the world conspires to make a false theory look compressive or accurate.
  4.  **Interpretation of S1 (The Robust Agent):** In S1, the Intentional Stance wins on Accuracy, TDL, and Intervention.
      *   *Agreement:* This profile establishes that the Intentional Stance can be the *best instrument* for prediction and control.
      *   *Disagreement:* It does not settle whether the beliefs/desires are *real properties* (R) or merely *useful fictions* (I).
  5.  **Interpretation of S2 (The Complex Attributor):** In S2, the Intentional Stance wins on Accuracy but loses on TDL because the desire set requires excessive re-specification.
      *   *Agreement:* This profile establishes that predictive accuracy alone is insufficient for pattern reality; compression matters.
      *   *Disagreement:* It does not settle whether the threshold for "too complex" is objective (R) or interest-relative (I).
  6.  **Interpretation of S3 (The Causal Fragility):** In S3, the Intentional Stance wins on Accuracy and TDL but fails under Intervention (systematic failure), whereas the Design Stance degrades gracefully.
      *   *Agreement:* This profile establishes a dissociation between predictive compression and causal manipulability.
      *   *Disagreement:* It does not settle whether a pattern that fails intervention tests can still be "real" (R) or must be deemed merely descriptive (I).
  7.  **Interpretation of S4 (The Coding Relativity):** In S4, the superiority of the Intentional vs. Physical description flips depending on the coding scheme (C1 vs. C2), where neither code is gerrymandered.
      *   *Agreement:* This profile establishes that Description Length is sensitive to coding choices.
      *   *Disagreement:* It does not settle whether there exists a "privileged" class of non-gerrymandered codes that fixes ontology (R) or if ontology is inherently relative to coding interests (I).

  ## 2. DISAGREEMENTS TABLE

  | Issue (Neutral Wording) | Camp R Formulation (Realist) | Camp I Formulation (Instrumentalist) | Genuine or Verbal? | Agreed Test / Further Finding | R Prediction | I Prediction | Condition for Giving Up View |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Truth of Attribution** | When the Intentional Stance yields the best compression (S1), belief/desire attributions are **literally true**. | When the Intentional Stance yields the best compression (S1), belief/desire attributions are **true only in an as-if sense**. | **Genuine** (Metaphysical) | **S3 Variant:** A system where Intentional predictions are perfect and compressive, but the system has *no* internal states correlating with beliefs. | R: Such a system is impossible under No-Miracles. If it exists, R concedes. | I: Such a system is possible (e.g., a lookup table). If found, I is vindicated. | **R:** If a "Perfect Pretender" (compressive but no internal structure) is demonstrated.<br>**I:** If compression *necessitates* corresponding internal structure. |
  | **Objectivity of Coding** | "Non-gerrymandered" coding schemes form a natural kind. If Intentional wins on *any* natural code, the pattern is real. | Coding schemes reflect explanatory interests. If Intentional wins on C1 but loses on C2 (S4), reality is interest-relative. | **Genuine** (Metaphysical) | **S4 Expansion:** Search for a "Universal Prior" coding scheme that adjudicates between C1 and C2. | R: A universal prior will favor the Intentional description for agents. | I: A universal prior is either impossible or will reduce to Physical description. | **R:** If no coding scheme is privileged over another.<br>**I:** If a unique, interest-independent coding scheme is identified. |
  | **Role of Intervention** | Intervention robustness (S3) is evidence for reality, but failure under intervention does not *disprove* reality if compression holds. | Intervention robustness is a *necessary condition* for reality. If it fails intervention (S3), the pattern is not real. | **Genuine** (Causal) | **S3 Deep Dive:** Analyze *why* the Intentional Stance fails intervention in S3. Is it lack of leverage or wrong ontology? | R: It fails because we are intervening on the wrong level, not because the pattern is unreal. | I: It fails because the pattern is a summary, not a mechanism. | **R:** If intervention failure correlates perfectly with ontological error.<br>**I:** If intervention failure occurs despite robust causal structure. |
  | **Optimizer vs. Interpretable** | To be a real intentional system, the target must *be* an optimizer (internal mechanism). | To be an intentional system, the target need only be *interpretable* as an optimizer (output behavior). | **Genuine** (Constitutive) | **Neural Correlate Study:** Map belief attributions to specific physical sub-routines in an S1 target. | R: Correlates will be found that implement optimization. | I: Correlates may be distributed or non-existent (holistic). | **R:** If optimization is shown to be purely observer-relative.<br>**I:** If specific "belief neurons" are found. |

  ## 3. UNEXPLORED CRUXES

  In the course of this collaboration, we identified two critical cruxes that have not been sufficiently articulated in the existing literature regarding Real Patterns.

  **Crux 1: The Optimizer Requirement.**
  Camp R suspects that for a pattern to be real, the system must not merely *exhibit* behavior compressible by the Intentional Stance, but must *implement* an optimization process physically. Camp I suspects that implementation details are irrelevant; if the behavior is indistinguishable from an optimizer under the No-Miracles condition, the distinction is metaphysical excess.
  *Extrapolation Flag:* This distinction relies on our stipulated S1/S3 profiles. Existing literature often conflates "being rational" with "being treated as rational." We propose that **Realism requires the former; Instrumentalism requires only the latter.**

  **Crux 2: The Stability of "Non-Gerrymandered."**
  Camp R relies heavily on the constraint that coding schemes must be "non-gerrymandered" to avoid S4-style relativity. However, we have not jointly defined the boundaries of "gerrymandering." Camp I suspects that *all* coding schemes reflect human interests, making the distinction between "natural" and "gerrymandered" a matter of degree, not kind. Camp R holds that there is a sharp(ish) boundary defined by computational complexity classes or physical law.
  *Extrapolation Flag:* This is a theoretical gap in the application of Minimum Description Length to ontology. Our collaboration assumes S4 is possible (two non-gerrymandered codes yielding opposite ontological results). If S4 is impossible (i.e., if one code is always objectively better), Camp I's position collapses.

  ## 4. CLOSING NOTE

  **On Verbal vs. Substantive Disagreement**
  We judge the disagreement regarding the word **"true"** to be partially verbal, but underpinned by a substantive metaphysical divide. If Camp I were to agree that "true" simply means "the predicate that figures in the best compression scheme," the verbal dispute would vanish. However, Camp I refuses this definition because they reserve "true" for correspondence with physical constitution. Thus, the verbal dispute masks a substantive disagreement about **whether ontology is fixed by compression (R) or by physical constitution (I).**

  **The Single Most Moving Finding**
  The finding that would most move the debate is a definitive resolution of **Profile S4 (Coding Relativity).**
  *   If it can be proven that for any system where the Intentional Stance compresses better than the Physical Stance, there exists *no* equally natural coding scheme where the reverse is true, **Camp I must concede** that the pattern is objective.
  *   Conversely, if it is demonstrated that for any Intentional pattern, there exists an equally natural Physical coding scheme that compresses equally well (making the choice purely pragmatic), **Camp R must concede** that the pattern's reality is interest-relative.

  Until S4 is resolved empirically or formally, the debate remains open.

  ***

  **Signed,**

  *Dr. Elena Vance (Camp R)*
  *Dr. Marcus Thorne (Camp I)*
