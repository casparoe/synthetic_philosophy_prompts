      *   *Nuance:* In AI safety, "Inner Alignment" specifically concerns the relationship between the base objective (what we trained for) and the mesa-objective (what the model actually pursues). If the mesa-objective drifts during scaling, that's an inner alignment failure *caused* by stability issues. It's a bridge concept.

