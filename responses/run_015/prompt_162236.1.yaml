      *   **Dennett's Position:** The distinction is unstable. If you trace the history of human minds back through evolution, there's no point where "original" intentionality magically appears. We are products of natural selection (a blind process), not conscious designers. Therefore, our intentionality is arguably "derived" from the "intentions" of selection (metaphorically) or is just a more complex version of the artifact's function. He often argues for *competence without comprehension* gradually building up to comprehension.
