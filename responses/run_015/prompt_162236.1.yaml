answer: |-
  Here is the dispute restated in the vocabulary of evolutionary biology, followed by the residue report and the status of the debate.

  ### Part 1: The Dispute in Evolutionary Vocabulary

  **The Core Question:**
  Does the "aboutness" (target-directedness) of a mental state arise from the internal history of the organism (Original), or is it always borrowed from an external history of design (Derived)?

  **Searle's Position (The Discontinuity View):**
  Searle argues for a categorical distinction between **Selected Systems** (organisms) and **Designed Systems** (artifacts).

  *   **Organisms:** Their traits are shaped by natural selection. The "function" of a trait (e.g., a heart pumping, a neuron firing) is determined by its contribution to fitness in the lineage's history. Searle claims this history generates *intrinsic* target-directedness. The organism is the locus of its own goals (survival/reproduction). Therefore, when an organism represents a predator, that representation is *really* about the predator. It has **Endogenous Teleology**.
  *   **Artifacts:** Their traits are shaped by a conscious engineer. The "function" of a part (e.g., a gear turning, a sensor tripping) is imposed from the outside. A coin-sorting machine sorts coins only because *we* intend it to. It has **Exogenous Teleology**.
  *   **The Claim:** You cannot get Endogenous Teleology from Exogenous Teleology. No amount of complexity in a Designed System gives it real "aboutness." Consciousness is a biological feature, not a functional one.

  **Dennett's Position (The Continuity View):**
  Dennett argues that the distinction between Selected and Designed Systems collapses under evolutionary scrutiny.

  *   **The Designer Problem:** Natural Selection is a blind algorithm. It is not a conscious agent. If "Derived Intentionality" means "borrowed from a conscious designer," then organisms *also* have Derived Intentionality, because they were "designed" by Selection, which has no mind. If Searle insists organisms have Original Intentionality, he must explain how a blind process generates "original aboutness" when a conscious engineer only generates "derived aboutness."
  *   **The Coin-Sorter (Two-Bitser) Analogy:** When the coin-sorter is moved to a new country and sorts local coins, its physical structure hasn't changed, but its "function" has shifted. In biology, this is **exaptation** or a **niche shift**. The trait persists, but the selective pressure defining its function has changed.
  *   **The Claim:** "Aboutness" is not a magical substance inside the head; it is a status assigned based on reliable causal covariance with the environment. If the coin-sorter reliably covaries with local coins, it is "about" local coins. If a neuron reliably covaries with predators, it is "about" predators. There is no deep metaphysical difference between the machine's covariance and the neuron's covariance. Both are products of history (design or selection) that can be decoupled from that history. Intentionality is a gradient of complexity, not a binary switch.

  **The Clash in Bio-Terms:**
  *   **Searle:** Selection history creates *real* function (adaptation). Design history creates *as-if* function (artifact). The gap is unbridgeable.
  *   **Dennett:** Selection history creates *as-if* function just as much as design history does, until the system becomes complex enough to model its own environment. The gap is a difference of degree, not kind.

  ***

  ### Part 2: Residue Report

  Here is what survives the translation, what gets distorted, and what vanishes.

  #### 1. What Translates Cleanly
  *   **History and Function:** The philosophical debate maps well onto the distinction between **etiological function** (what a trait was selected *for*) and **causal role** (what a trait *does* now). Searle relies on the etiological history being special for organisms. Dennett relies on the causal role being sufficient for "aboutness."
  *   **Exaptation/Niche Construction:** Dennett's coin-sorter example translates perfectly to a trait entering a new niche. The morphology remains, the environmental fit remains, but the historical "reason for being" is severed. Biology handles this seamlessly; philosophy struggles to say if the function is "real" or "new."
  *   **Blind Process vs. Conscious Agent:** The distinction between Natural Selection (blind) and Human Engineering (conscious) is clear in both fields. The dispute over whether this difference matters for "meaning" translates directly.

  #### 2. What Translates Only with Distortion
  *   **Normativity (True/False vs. Fit/Misfit):** In biology, a trait is adaptive or maladaptive. In philosophy, a belief is *true* or *false*.
      *   *Distortion:* You can map "false belief" to "maladaptive behavior," but this is imperfect. A heart can fail to pump (malfunction), but it cannot pump "falsely." A belief can represent the world *incorrectly* while still being adaptive (e.g., a superstition that reduces anxiety). Biology tracks fitness consequences; philosophy tracks truth conditions. Translating "truth" into "fitness" loses the semantic content.
  *   **The "Locus" of Control:** Searle treats the organism as a unified locus of intentionality. Biology sees the organism as a colony of competing genes, cells, and symbionts (major transitions in individuality). If the "self" is a coalition, whose intentionality is "original"? Dennett exploits this biological reality to argue the "self" is a constructed center of narrative gravity, not a biological given.

  #### 3. What Has No Counterpart (The Leftover)
  *   **Phenomenology (The "What It Is Like"):** Biology describes the *mechanism* of vision (phototransduction, neural processing). It does not describe the *experience* of seeing red. Searle's "Original Intentionality" is tightly bound to conscious experience. Dennett is willing to say the experience is a user-illusion generated by the machinery. Biology has no vocabulary for the first-person perspective, only the third-person mechanism.
  *   **Semantic Content:** Biology can explain why a system *discriminates* snakes from sticks (causal covariance). It cannot explain why that discrimination *means* "danger" to the organism rather than just being a physical reaction. This is the **Naturalization of Content** problem. Biology explains the vehicle; philosophy asks about the message.
  *   **Intrinsic Normativity:** In biology, "ought" is hypothetical ( *If* you want to reproduce, you *ought* to avoid predators). In philosophy, some argue mental states have categorical normativity (You *ought* to believe what is true). Biology cannot generate categorical norms from descriptive history (the Is-Ought problem).

  ***

  ### Part 3: Evaluation of the Leftover

  Is the residue a sign that biology is missing something, or that the philosophical fight is verbal?

  **View A: Biology is Missing Something (Realism)**
  If you side with Searle, the residue is real. There is a property of conscious systems (Original Intentionality) that is not reducible to selection history or functional organization. Just as physics cannot fully capture "life" without biology, biology cannot capture "mind" without acknowledging intrinsic phenomenology. On this view, the philosophical fight is substantive: it points to a gap in the scientific image.

  **View B: The Fight is Less Substantive (Deflationism)**
  If you side with Dennett, the residue is a category error. We are trying to find a "thing" called *aboutness* inside the brain, like a homunculus. But "aboutness" is just a stance we take toward complex systems (the **Intentional Stance**). We treat the coin-sorter *as if* it wants to sort coins because it predicts its behavior. We treat humans the same way, just with more complexity. On this view, the philosophical fight is largely verbal: it's a dispute over whether to reserve the word "real" for conscious feelings or to apply it to functional reliability.

  **My Assessment for a Biologist:**
  The "leftover" is likely a mix. Biology *can* explain the evolution of discriminative mechanisms (adaptation). It *cannot* currently explain why those mechanisms feel like something from the inside. However, much of the philosophical heat comes from demanding that "function" in the mind must be different in kind from "function" in the body. If you accept that mental states are biological traits shaped by selection, Dennett's continuity argument is stronger. If you insist consciousness is non-physical or emergent in a strong sense, Searle's discontinuity holds.

  ***

  ### Part 4: Status Report (Settled vs. Contested)

  Since you asked specifically about what is established versus what is "one camp shouting," here is the breakdown within the philosophy of mind and biology communities.

  **What is Settled (Consensus):**
  1.  **Natural Selection is Blind:** There is agreement that Selection is not a conscious agent. This undermines any simple analogy between "God/Engineer" and "Nature."
  2.  **The Hard Problem Exists:** Everyone agrees that explaining *behavior* (discrimination, response) is easier than explaining *experience* (what it feels like). There is no agreed-upon solution to how physical processes generate subjective experience.
  3.  **Teleology is Historical:** In biology, function is understood historically (selected effect), not just causally. Philosophers of biology generally accept this.

  **What is Contested (No Consensus):**
  1.  **Naturalizing Content:** It is **highly contested** whether selection history can fix semantic content (i.e., make a neural state *mean* "predator" rather than just "small moving object"). Some say yes (Teleosemantics); others say no (the disjunction problem).
  2.  **The Reality of Original Intentionality:** It is **contested** whether Searle's "Original Intentionality" is a real phenomenon or a pre-scientific intuition. Materialists generally reject it; Phenomenologists generally accept it.
  3.  **The Validity of the Artifact Analogy:** It is **contested** whether comparing brains to computers/coin-sorters is a useful heuristic (Dennett) or a category mistake (Searle/Biological Naturalists).
  4.  **Consciousness as Adaptation:** It is **contested** whether consciousness itself is an adaptation, a spandrel (byproduct), or an exaptation. There is no settled evolutionary account of *why* subjective experience exists if behavior can be explained without it.

  **Summary:**
  The fight is not settled. It is the central fault line in the philosophy of mind. However, from a strictly biological standpoint, Dennett's move (treating intentionality as a functional capacity built by selection) is more compatible with standard evolutionary theory. Searle's move (positing intrinsic, non-functional intentionality) requires positing a biological feature that escapes standard functional analysis. Whether that feature exists is an empirical question biology has not yet answered.
