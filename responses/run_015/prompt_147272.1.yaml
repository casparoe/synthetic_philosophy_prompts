answer: |-
  ### Statement of Account

  Corruption is the substitution of role-indexed reasons with relation-indexed reasons, occurring when a recipient is induced to prioritise a personal or relational obligation over the public duties inherent in their institutional role. Legitimate cross-cultural variation resides in the *forms* of recognition appropriate to a role (e.g., hospitality, ceremony), but not in the *subordination* of that role's public purpose to private gain or preferential access. Therefore, the ethical test is not whether a payment is customary, but whether it purchases influence that ought to be distributed impartially.

  ### The Procedure (8 Steps)

  **Time required:** 20 minutes. **Inputs:** Email from Local Coordinator, Committee discussion.

  1.  **Define the Role:** State the recipient's formal or programme function. What are they mandated or expected to provide *without* this transfer?
  2.  **Test Universality (Email Coordinator):** Ask: *"Is this transfer standard practice for all partner organisations accessing this service, or specific to us?"* Record the answer.
  3.  **Test Beneficiary:** Does the transfer primarily support the *institution's work* (e.g., school budget, workshop costs) or the *individual's private capacity* (e.g., cash, personal goods, home items)?
  4.  **Test Conditionality:** Is the service formally withheld, delayed, or jeopardised if the transfer is not made?
  5.  **Test Accumulation:** Does this transfer contribute to a pattern where we receive faster, cheaper, or better treatment than other organisations over time?
  6.  **The Red Gate:** If Step 2 is **'Specific to us'** AND (Step 4 is **'Yes'** OR Step 5 is **'Yes'**), the proposal is **Rejected**. Stop here.
  7.  **The Trustee Hand-off:** If Step 3 is **'Individual'** but the Red Gate is not triggered (e.g., a gift with no strings attached), refer the decision to the **Senior Trustee**. This is a question of values (risk appetite), not fact.
  8.  **The Record:** Draft the minute using the template below.

  **Minute Templates:**
  *   **Yes:** "Committee approved transfer of [Value] to [Recipient] on grounds that it supports [Role] without creating preferential access or private obligation."
  *   **No:** "Committee rejected transfer of [Value] to [Recipient] on grounds that it risks substituting personal obligation for institutional duty or purchasing preferential access."

  ***

  ### Application to Cases

  **Case One: The MoU Signing Payment (£40 Cash to Head Teacher)**
  *   **Step 1 (Role):** Head Teacher (Public Office). Function: Sign partnerships based on educational merit.
  *   **Step 2 (Universality):** Coordinator says "Customary for visiting org." This implies it is *not* written policy but a social norm. Answer: **'Specific to us'** (or at least, not universal policy).
  *   **Step 3 (Beneficiary):** Cash to Head. **'Individual'**.
  *   **Step 4 (Conditionality):** Refusing would "put partnership at risk." **'Yes'**.
  *   **Step 6 (Red Gate):** Step 2 is Specific + Step 4 is Yes. **Rejected.**
  *   **Verdict:** **NO.**
  *   **Minute:** "Committee rejected cash payment to Head Teacher on grounds that it risks substituting personal obligation for institutional duty and conditions a formal agreement on private transfer."

  **Case Two: The Host Family Phone (£120 Value)**
  *   **Step 1 (Role):** Host Family (Programme Stakeholder). Function: Provide hospitality within the volunteer placement scheme.
  *   **Step 2 (Universality):** N/A (Private arrangement). Treat as **'Specific to us'**.
  *   **Step 3 (Beneficiary):** Phone for family home. **'Individual'**.
  *   **Step 4 (Conditionality):** Nothing asked for. **'No'**.
  *   **Step 5 (Accumulation):** Trustee notes "word will get about... families may compete." This indicates a risk of future distortion. **'Yes'** (Potential Accumulation).
  *   **Step 6 (Red Gate):** Step 2 Specific + Step 5 Yes. **Rejected.**
  *   **Verdict:** **NO.** (Though borderline, the risk of market distortion triggers the accumulation gate).
  *   **Minute:** "Committee rejected gift of phone to host family on grounds that it risks creating preferential access and distorting future programme participation."

  **Case Three: The District Official's Hamper & Priority Access (£25 + Travel)**
  *   **Step 1 (Role):** District Education Official (Public Office). Function: Process paperwork impartially and in order.
  *   **Step 2 (Universality):** "Other organisations wait months." **'Specific to us'**.
  *   **Step 3 (Beneficiary):** Hamper/Travel to Official. **'Individual'**.
  *   **Step 4 (Conditionality):** Paperwork moves *because* of the relationship ("quietly tells him"). **'Yes'**.
  *   **Step 5 (Accumulation):** "Over three years... returns calls first." **'Yes'**.
  *   **Step 6 (Red Gate):** Step 2 Specific + Step 4 & 5 Yes. **Rejected.**
  *   **Verdict:** **NO.**
  *   **Minute:** "Committee rejected ongoing gifts to District Official on grounds that they purchase preferential access and substitute personal obligation for institutional duty."

  ***

  ### The Hard Truth

  Your committee will dislike the verdict on **Case Three**. You described it as "ordinary relationship-building," and in the context of development work, it often feels like survival. However, you must accept the **NO** verdict.

  Here is the argument: Your theoretical account defines corruption as the *substitution* of role-indexed reasons. A District Official's role is to distribute administrative resources (time, paperwork processing) impartially. By cultivating a friendship that results in your paperwork moving first while others wait months, you are not merely "building relationships"; you are actively participating in the subversion of that official's role. The hamper is not the issue; the *priority lane* is.

  If you accept this benefit, you are complicit in the deprivation of other organisations (and potentially other schools) who play by the rules. You cannot claim the "when in Rome" defence because you are not merely observing the local norm; you are leveraging a private relationship to bypass a public queue. To continue this is to admit that your charity's efficiency is predicated on the corruption of the local bureaucracy. If the cost of operating ethically is that your paperwork takes three months longer, that is a cost your charity must absorb. To do otherwise is to treat the local public institution as a resource to be exploited rather than a partner to be strengthened.

  ### Limitations of the Procedure

  This procedure systematically cannot see three things. First, it cannot detect **coercion born of poverty**. If the Official's salary is insufficient to feed his family, the "choice" to accept the hamper is not free, and the "corruption" is a symptom of structural failure the procedure treats as individual ethics. Second, it cannot measure **macro-level harm**. A single £25 hamper does not collapse a state, but the procedure treats it with the same severity as a large bribe; it lacks a threshold for *significance*. Third, it relies on the **Coordinator's safety**. While the questions are phrased to avoid legal jeopardy, a Coordinator under pressure may still answer "Universality" questions falsely to protect the partnership, which the procedure accepts as fact. It is a tool for integrity, not a shield against systemic reality.
