prompt: |-
  Write a deadpan parody of an internal bureaucratic performance review—approximately 600 words—issued by a fictional "International Council for Distributed Historical Agency," assessing three contracted "non-human actors" for the reporting period: the bacterium Yersinia pestis (representing epidemic disease), the North Atlantic Oscillation (representing long-term climate patterns), and the Laki fissure eruption of 1783 (representing volcanic forcing). Adopt the voice and formatting of a standardized institutional HR document: sections for "Causal Impact," "Agency Metrics," "Determinism Risk Assessment," and "Supervisor Commentary," with parallel evaluations by a "Social-History Reviewer" and an "Environmental-Determinist Manager." The satire should exaggerate real historiographical moves—granting intentionality to climate systems, treating microbial spread as an autonomous strategic actor, and quantifying environmental causation—while never inventing false historical claims about the events themselves. Include at least one invented institutional protocol (for example, a "Causal Attribution Bonus" or a "Human Agency Deduction") that exposes the conceptual problem of separating non-human forces from the social structures through which they operate. The piece should remain readable without specialist jargon but reward familiarity with debates over environmental determinism, non-human agency in historiography, and the philosophy of causal explanation. After the parody, provide a separate analytical note—about 150 words—identifying where the satire takes liberties with contested interpretations (such as whether framing climate as an "actor" is a heuristic device or a category mistake) and clearly distinguishing those contested moves from points that are broadly settled (for instance, that causal explanation in history requires specifying mechanisms rather than merely correlating environmental shifts with social outcomes). Do not provide bibliographies, reading lists, or citations; the note should depend only on general knowledge accessible without external sources.
