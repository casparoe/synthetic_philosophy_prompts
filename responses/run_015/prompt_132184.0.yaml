answer: |-
  No single canonical classical term exists for this distortion, but it is best conceptualized as **unilateral role reification**, defined as the hermeneutic isolation of a subordinate's duty from its reciprocal superior obligation.

  To understand why this move is structurally illegitimate within Confucianism, you must map the interaction between *zhong* (loyalty), *xiao* (filial piety), and *shu* (reciprocity) against the framework of *yi* (righteousness). In early Confucian role ethics, specifically the *Wu Lun* (Five Relationships), obligations are dyadic and mutually constitutive; the *Analects* (12.11) insists on the "Rectification of Names" (*zhengming*), meaning a "father" must actually act fatherly to warrant the name, and Mencius (4B:3) explicitly conditions the minister's loyalty on the ruler's benevolence, noting that if a ruler treats subjects like dirt, they should be treated like enemies. The mechanism binding these halves is *shu* (reciprocity/empathy), adjudicated by *yi* (righteousness), which demands that rituals (*li*) must accord with moral fitness. The move you are observing severs *zhong* or *xiao* from *yi* and *shu*, treating the subordinate's ritual duty as a static object (reification) while leaving the superior's moral requirement fluid. This is historically rooted in the later Han Dynasty shift from the reciprocal *Wu Lun* to the *San Gang* (Three Bonds), which codified unilateral submission, but even the *San Gang* presumed the superior's moral exemplarity; your example goes further by selectively invoking *San Gang* rigidity for the subordinate while claiming *Wu Lun* flexibility for the superior.

  **Unilateral Role Reification** is distinct from plain hypocrisy because hypocrisy acknowledges the full norm while secretly violating it, whereas this move publicly redefines the norm itself to exclude the reciprocal condition. It is a hermeneutic manipulation rather than a behavioral failure; the actor genuinely believes the duty is absolute because they have conceptually severed the dyad. It differs from legitimate role asymmetry because Confucian roles are indeed asymmetric in function (the father guides, the son follows), but symmetric in moral binding (both must be virtuous to sustain the relationship); unilateral reification makes the moral binding itself asymmetric, rendering one side absolute and the other optional. Finally, it differs from cases where a superior genuinely cannot fulfill their obligation due to circumstance; in those cases, the norm is acknowledged but unmet, often invoking *quan* (discretion/weighting), whereas unilateral reification denies the necessity of the superior's obligation entirely when it becomes inconvenient.
