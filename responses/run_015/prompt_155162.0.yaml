answer: |-
  The fault line you are encountering is the **Intentionalist-Structuralist Divide**, and within the specific context of famine ethics, your students' objection constitutes what can be precisely termed the **"Mens Rea Fallacy."**

  Here is the committed answer: **The "no intent, so not political" move is a fundamental misreading of Sen.**

  ### 1. The Name of the Standoff
  While historiography broadly calls this the **Intentionalist-Structuralist Debate** (originally applied to the Third Reich but now standard in political economy), in famine studies specifically, this standoff is the conflict between **"Famine as Disaster"** (an exogenous shock requiring malicious intent to be deemed political) and **"Famine as Political Failure"** (an endogenous outcome of institutional incentives).

  Your students are attempting to import a **criminal law framework** (*mens rea* or "guilty mind" is required for a crime) into a **political economy framework**. Sen's theory operates entirely in the latter. For Sen, a famine is "political" not because it was *willed*, but because it was *permitted* by a specific configuration of power and information flows.

  ### 2. Why It Is a Misreading of Sen
  Sen leaves **no room** for the distinction your students are trying to draw. In *Poverty and Famines* and later in *Development as Freedom*, Sen explicitly decouples "political" from "malicious."

  *   **Sen's Definition of Political:** For Sen, a famine is political if it results from a failure of **entitlement protection** that a functioning political system *could* have prevented. The metric is **responsiveness**, not **benevolence**.
  *   **The Mechanism:** Sen argues famines do not occur in functioning democracies with a free press. Why? Not because democratic leaders are morally superior, but because they face **electoral incentives**. When the British administration in Bengal or the CCP in the Great Leap Forward failed to respond, it was because their incentive structures (colonial extraction, ideological procurement targets) insulated them from the suffering of the victims.
  *   **The Verdict:** To claim a famine is not "political" because there was no order to starve people is to ignore Sen's central thesis: that the *architecture of decision-making* is the causal variable. If the system creates perverse incentives (e.g., local cadres falsifying reports to avoid punishment) that lead to starvation, that is a **structural political failure**, regardless of whether Mao or Churchill personally desired the deaths.

  ### 3. Negligence/Malice vs. Structural Accountability
  You asked how this differs from ordinary debates about negligence versus malice.
  *   **Negligence/Malice** focuses on **individual moral culpability**. It asks: "Did the actor *want* this, or should they have *known* better?" This leads to the deadlock you see (e.g., "Churchill was racist but not genocidal").
  *   **Structural Accountability** (Sen's approach) focuses on **systemic functionality**. It asks: "Did the institutional rules make this outcome predictable and preventable?"
  *   **The Difference:** You can have a famine caused by "negligence" that is still a "political crime" in Sen's framework. The label "political" attaches to the **avoidability** of the entitlement collapse, not the **psychology** of the rulers.

  ### 4. Location Within Entitlement Theory
  This fault line does not sit in the distinction between *Direct* vs. *Trade* entitlement failures (that is about *how* people lose access). It sits in the **Entitlement Mapping (E-mapping)**.

  *   **Endowment:** What you own (land, labor).
  *   **E-Mapping:** The legal, social, and economic rules that determine what you can get with what you own.
  *   **The Snag:** Your students are focusing on the *Endowment* shock (e.g., "the crop failed," "the war disrupted trade"). Sen focuses on the *E-Mapping* failure (e.g., "wages did not rise with prices," "grain was exported despite local deficit").
  *   **The Conclusion:** The E-mapping is determined by **policy and institutions**. Therefore, a collapse in E-mapping is inherently political. To argue otherwise is to claim that wage laws, procurement policies, and export regulations are "natural" forces rather than political choices.

  **Summary for your Seminar:**
  Tell your students they are committing a category error. They are looking for a **smoking gun** (intent), while Sen is pointing at the **security system** (institutions). In Sen's framework, a famine caused by perverse incentives is just as "political" as one caused by a blockade, because both are the result of human-designed rules governing exchange entitlements. The term for their objection is the **Mens Rea Fallacy**, and it is incompatible with Entitlement Theory.
