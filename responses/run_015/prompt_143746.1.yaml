  2.  **Deconstruct Jaspers's *The Question of German Guilt*:**
      *   *Criminal Guilt:* Violation of laws. Adjudicated by courts. Individual.
      *   *Political Guilt:* Responsibility for the state's actions. All citizens bear this. Reparations/restoration.
      *   *Moral Guilt:* Individual conscience regarding one's own actions. Requires introspection and repentance.
      *   *Metaphysical Guilt:* Solidarity among humans. Co-responsibility for every wrong committed in one's presence. Exists before God (or ultimate meaning).
      *   *Key Challenge:* How to apply this to *descendants* who didn't commit the acts? The Charter explicitly rejects hereditary *criminal* guilt. So the speech must navigate the other three.

  3.  **Brainstorming the Structure (Bullet Points):**
      *   *Avoid Lecture:* Don't define terms explicitly ("As Jaspers says..."). Instead, embody the categories in the narrative arc.
      *   *Criminal:* Acknowledge the Charter's limit immediately. We are not here to judge ancestors in court. This clears the air for settlers.
      *   *Political:* Focus on the Republic itself. We inherit the *state* built on those acts. Political guilt is about maintaining the structure. This binds everyone (settler and Valewood) as citizens.
      *   *Moral:* Shift from "what did they do?" to "who are we becoming?" Moral guilt isn't inherited, but the *capacity* for moral failure is. The "Questions" are about our current choices.
      *   *Metaphysical:* The core of the "Day of Inherited Questions." Solidarity. We survive together or fail together. This provides the consoling/unifying element.
      *   *Position:* The "Inherited Questions" are not about solving the past (impossible) but about governing the present relationship. Guilt transforms into Responsibility.

  4.  **Drafting the Speech - Section by Section:**
      *   *Opening:* Acknowledge the weight of the centenary. Address the mixed audience directly.
      *   *The Charter/Criminal:* Validate the Charter. No courtrooms today. Release the burden of legal blame for the young.
      *   *Political:* The Republic is the inheritance. We own the institutions. If they are unjust, we are politically responsible for fixing them. This addresses the Valewood elders (justice) and settlers (duty).
      *   *Moral:* The internal work. Don't claim guilt you didn't commit, but claim the duty to examine your own prejudice. Address the students.
      *   *Metaphysical:* The binding thread. We are human together. The "Questions" are about how we share this world.
      *   *Closing:* The purpose of the Day. Not penance, but vigilance.

  5.  **Refining the Tone:**
      *   Must be consoling but honest. No "get out of jail free" for settlers, no "eternal victimhood" for Valewood.
      *   Needs to sound like a speech (rhythm, pauses, direct address).
      *   Needs to satisfy the philosophy teachers (accurate enough usage) without boring the students.

  6.  **Developing the Definite Position:**
      *   Position: The "Day of Inherited Questions" is not about assigning blame for the past, but about accepting *political* and *metaphysical* responsibility for the future. We cannot change the crime, but we own the consequence. The "Guilt" is transformed into "Stewardship."
      *   This avoids evasiveness (acknowledges the atrocity) and avoids accusatory language (focuses on current civic duty).

  7.  **Drafting the Note on Jaspers:**
