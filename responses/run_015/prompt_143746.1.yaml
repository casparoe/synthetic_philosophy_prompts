answer: |-
  *   **Criminal Guilt:** Acknowledge the Charter's boundary immediately. This disarms defensiveness among settler descendants and validates the legal clarity sought by Valewood elders. It prevents the speech from becoming a trial.
  *   **Political Guilt:** Use this to define citizenship. All present citizens inherit the *state* apparatus, regardless of ancestry. This creates a shared burden of maintenance and repair without requiring personal sin.
  *   **Moral Guilt:** Direct this inward. It is not about ancestors' sins, but about our current complicity in silence or indifference. This engages the students and moral agents without imposing false shame.
  *   **Metaphysical Guilt:** Elevate this to the purpose of the ritual. Solidarity in survival. The "Inherited Questions" are not about blame, but about how we share a world tainted by past evil. This provides the consoling, unifying conclusion.
  *   **Structural Flow:** Move from the legal (what we are *not*) to the civic (what we *own*) to the internal (who we *are*) to the existential (how we *bind* ourselves).

  ***

  **Centenary Keynote: The Weight of the Dawn**
  **Republic of Vareth National Memorial**

  Friends, neighbors, citizens of Vareth.

  One hundred years ago, the empire fell. From its rubble, this Republic was raised. We stand today on ground that remembers fire. To the Valewood elders here: we see your survival. To the descendants of the settler families: we see your presence. To the students: we see your future. And to the world watching: you see a experiment in whether a people can breathe together after choking on ash.

  Our founders knew that a nation cannot stand if it tries to prosecute the bones of the dead. So, they wrote the Charter of Intergenerational Reckoning. They drew a line. They said there is no hereditary *criminal* guilt. You are not in the dock today. No child is liable for the knife held by a grandparent. This is not evasion; it is clarity. If we confuse the law with history, we paralyze the living. The courtrooms of the past are closed. We honor that closure so that we may open something else.

  But if we are not criminals, what are we? We are citizens. And this brings us to the first weight we carry together: political responsibility.

  When the Empire collapsed, it did not vanish into thin air. It left behind institutions, borders, and wealth built on the suffering of the Valewood. This Republic inherited that estate. To be a citizen of Vareth is to inherit the deed to this house, even if some of us were locked out of its rooms for generations. Political guilt is not about what you did in secret; it is about what the state does in your name.

  To the descendants of settlers: You inherit the privilege of stability bought at a terrible price. Your political duty is not to apologize, but to ensure the institutions you now hold do not repeat the logic of the empire.
  To the Valewood community: You inherit the right to demand that this Charter means more than paper. Your political duty is to hold us to the promise that the state belongs to the living, not the dead.
  We are all liable for the justice of this Republic. That is the price of citizenship. We own the machinery of state, so we own the repair of its defects.

  Yet, laws and states are cold things. They require warm hands to steer them. This brings us to the second weight: moral conscience.

  The Charter establishes the Day of Inherited Questions. Let us be clear about what this day is not for. It is not for performative shame. You cannot feel guilty for a crime you did not commit; to pretend otherwise is to turn morality into a theater of self-absorption.

  Instead, the moral question is sharper. It asks: *Knowing what was done here, who am I becoming?*
  To the students: You did not light the fires of Valewood. But you walk on the soil where they burned. The moral question is whether you will look away when you see smoke rising today. Moral guilt is not inherited; it is incurred anew every day by silence. The Day of Inherited Questions is not a day to mourn your ancestors' sins, but to audit your own courage. It is a day to ask: *Am I convenient? Or am I just?*

  This brings us to the final, heaviest layer. The layer that binds us not as citizens, but as humans.

  There is a solidarity among people that precedes laws. It is the recognition that because we share this world, we share in the burden of its horrors. If a crime was committed here a hundred years ago, and I survive in the safety it bought, while my neighbor survives the trauma it inflicted, there is a break in the human bond that only truth can mend. This is not legal liability. It is metaphysical solidarity.

  We are here because we chose not to let that bond break forever. The Republic of Vareth is not a monument to innocence. There is no innocence here. There is only the choice to live together despite the guilt that stains our soil.

  So, what is the Day of Inherited Questions for?
  It is not for assigning blame. The blame is known.
  It is not for absolution. That is not ours to give.
  It is for transformation.

  We take the heavy, static weight of the past—what the philosophers might call the facticity of our history—and we transform it into active responsibility.
  For the settler descendants, the question is: *How do I use my security to guarantee the safety of others?*
  For the Valewood elders, the question is: *How do we trust again without forgetting?*
  For the students, the question is: *What kind of Vareth will you build when you are the elders?*

  We reject criminal guilt because we want a future, not a trial.
  We accept political guilt because we want a state, not anarchy.
  We examine moral guilt because we want integrity, not performance.
  And we acknowledge metaphysical guilt because we want a community, not merely a coexistence.

  Let us leave this memorial not lighter, but stronger. Let us carry the questions. They are the only inheritance worth keeping.

  Thank you.

  ***

  **Note on Philosophical Liberties**
  This address adapts Jaspers's concept of *political guilt*—originally intended for living citizens of a regime—to descendants who were not citizens of the original empire, arguing that inheriting the *state* constitutes inheriting the liability for its structural continuity. Additionally, it reframes *metaphysical guilt* from an individual existential burden before God into a collective civic ritual ("The Day of Inherited Questions"), shifting the focus from individual co-responsibility for evil to a shared duty of repair. These choices are made to render Jaspers's existential framework actionable for statecraft and intergenerational reconciliation rather than purely individual introspection.
