  5.  **Determine What Counts as Progress:**
      *   Not a representation theorem (too abstract).
      *   Not empirical (people are bad at this).
      *   Not abandoning the question (it reveals deep structure).
      *   **Progress:** A formal characterization of the *space of protocols* that map to specific update rules. Showing that "Judy Benjamin" isn't one problem but a *family* of problems indexed by likelihood functions.
