      *   *Antiquarian:* Reverence for the past, preserving everything, knowing roots. Risk: Mummification, inability to create new things, hoarding without discrimination.
      *   *Critical:* Judging and condemning the past to break its chains and allow new life. Requires destruction/forgetting. Risk: Nihilism, losing roots.
