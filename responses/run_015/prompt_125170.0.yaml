answer: |-
  **Leo:** Look, I love the vibe of expressivism, I do. But you guys never actually solve Frege-Geach. You just wrap it in enough quasi-realist paper so it looks like a package deal.

  **Maya:** That's harsh. We solve it by explaining logic in terms of consistency of attitudes, not truth conditions. You guys just assume logic *needs* truth.

  **Leo:** Logic needs structure. If I say "P or Q," and I reject Q, I'm logically compelled to accept P. That compulsion only works if P and Q are the kinds of things that can be true or false. If "Q" is just you going "Boo!", then "Not-Q" isn't "Yay!", it's... nothing. It's void.

  **Maya:** It's not void. It's a clash of commitments. Let's ditch the standard lying examples. They're too clean. Take this disjunction: "Either capital punishment is fundamentally wrong, or it's okay to kill innocent people in extreme edge cases."

  **Leo:** Okay. Dark, but fine.

  **Maya:** I accept the disjunction. But I reject the second horn. Hard.

  **Leo:** Why?

  **Maya:** Because I refuse to adopt the practical stance required to endorse killing innocents. I can't plan for a world where that's permissible. So, since I'm committed to the disjunction, and I won't hold the attitude for the second horn, I'm left with the first. Capital punishment is wrong.

  **Leo:** But see, that's the trick. When you say you "reject the second horn," what are you doing? You're saying it's not the case that it's okay to kill innocents. That's a belief. You're treating the proposition "it's okay to kill innocents" as false.

  **Maya:** I'm not treating it as false. I'm treating it as *unacceptable*. There's a difference. Falsehood is about matching the world. Unacceptability is about matching my will to the world. I'm saying, "I cannot stand for that option."

  **Leo:** But in the context of that disjunction, your inability to stand for it functions exactly like a belief in its falsehood. If you didn't think the second horn was wrong—like, objectively wrong—you couldn't use it to propel yourself to the first horn. You're using it as a premise. Premises need truth values.

  **Maya:** They need *assertability*. Look, if I say "Either it's raining or I'm mistaken," I'm not necessarily claiming I know the truth value of the rain. I'm expressing a state where I'm committed to updating my belief if I find out I'm not mistaken. With morals, accepting "A or B" means I'm committed to approving A if I disapprove B.

  **Leo:** But "disapproving B" isn't enough for the logic to hold. Suppose I say, "Either stealing is wrong or I'm the Pope." You disapprove of stealing. Does that mean you believe I'm the Pope? No. Because the logic fails if the content isn't truth-apt. You're smuggling cognitivism in through the back door of "consistency."

  **Maya:** I'm not smuggling anything. Consistency is primitive. You realists think truth is primitive. I think coherent planning is primitive. When I reject that second horn, I'm not checking a fact box. I'm saying, "That option is off the table for agents like us."

  **Leo:** But why is it off the table?

  **Maya:** Because it violates the norms we share.

  **Leo:** And if I ask, "Is it true that it violates the norms?" you'll say yes. You're back to truth. You can't escape it, Maya. The moment you engage in disjunctive reasoning—where you eliminate one option to save the other—your treating that option as eliminable implies you believe it doesn't hold. That's a cognitive state.

  **Maya:** I believe I have the attitude, sure. But I don't believe the attitude corresponds to a moral fact. I just have the attitude. When I reason through the disjunction, I'm testing my own coherence. If I accepted the second horn, I'd be in conflict with my deepest commitments. So I discard it.

  **Leo:** But you're discarding it because you think it's *incorrect* to accept it. Not just inconvenient. If it were just inconvenient, you could say, "Well, maybe killing innocents is okay, but I don't like it." But you won't say that. You'll say, "No, that's wrong."

  **Maya:** I say "That's wrong" to express my rejection. It's not a description of my rejection.

  **Leo:** But in the Frege-Geachh problem, the sentence appears unasserted. In the disjunction, "It's okay to kill innocents" isn't being rejected yet. It's part of the structure. To manipulate that structure logically, you have to treat the content as stable. And stability implies truth-conditions. If your attitude changes, the logic breaks. But the logic doesn't break. Therefore, it's not about your attitude.

  **Maya:** The logic doesn't break because the *rules* for combining attitudes are stable, not the attitudes themselves. Like grammar. I can say "If I were you..." without actually being you. I can process "If killing innocents was okay..." without actually approving of it. I'm simulating the stance to check for consistency.

  **Leo:** Simulating a stance requires knowing what the stance *is*. And knowing what the stance is requires knowing what content it attaches to. If the content is "killing innocents is okay," and you're simulating accepting it, you're treating it as a proposition that can be accepted. That's cognitivism, Maya. You're just calling it "planning" to avoid the metaphysics.

  **Maya:** Maybe. But at least I don't have to explain where these moral facts live. You want me to solve logic? Fine. I solve it with norms. You solve it with magic facts.

  **Leo:** They're not magic if they explain why your reasoning works. And right now, your reasoning works because your treating moral claims like facts. If your just expressing feelings, disjunctions shouldn't bind you. But they do. So admit it: deep down, you think that second horn is false.

  **Maya:** I think it's intolerable. And sometimes, Leo, that's stronger than false.

  **Leo:** Maybe. But you can't build a logic on intolerance. You need truth. Otherwise, how do you know I'm not just intolerant of your intolerance?

  **Maya:** Then we argue about whose intolerance is more coherent. That's all philosophy is anyway.

  **Leo:** See, now your just being difficult.

  **Maya:** Nope. Just consistent.
