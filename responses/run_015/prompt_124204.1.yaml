answer: |-
  The precise flaw in your argument is a **false necessity** located in **Step (7)**.

  ### Diagnosis
  Step (7) asserts that to distinguish "backsliding" cases (Hungary, Poland) from "democratic deepening/stabilizing" cases (New Deal, German FCC), one *must* add an external normative filter based on **intent** or **deliberation**. This creates a false dichotomy: either we judge the actor's mind (intent) or we judge nothing (accepting all change as backsliding).

  This step looked plausible because you correctly identified in Step (2) that Historical Institutionalism's modes (layering, conversion, etc.) are formally neutral. It follows intuitively that if the *form* is neutral, the *evaluation* must rely on something outside the form—seemingly leaving only the actor's subjective intent. However, this overlooks a third category of criteria: **functional institutional outcomes**.

  Scholars like Bermeo, Levitsky, and Ziblatt distinguish backsliding not by peering into the souls of legislators (intent), but by observing **asymmetric entrenchment** and **electoral uncertainty**. The New Deal expanded administrative power but did not structurally prevent the opposition from winning future elections or removing the incumbent via constitutional means. The Hungarian constitutional overhaul, by contrast, gerrymandered districts and packed courts in ways that systematically biased future competition against the opposition. This distinction is **observable** (unlike intent) and **institutional** (unlike pure normativity).

  By claiming intent is the *only* filter, Step (7) forces the epistemic opacity problem in Step (8) and the cynical dilemma in Step (9). Rejecting Step (7) allows you to retain Step (1)'s institutional focus while avoiding the vacuity charge: "reduces accountability" is interpreted not as *any* shift in institutional balance, but as a reduction in the *system's capacity to remove rulers via election*.

  ### The Cost
  Rejecting Step (7) saves your concept from cynicism, but it exacts a theoretical price: you must surrender **pure procedural neutrality**.

  Pure procedural neutrality holds that if a reform follows legal channels, it is democratically legitimate regardless of its partisan effect. By adopting a functional filter (e.g., "does this entrench incumbents asymmetrically?"), you are admitting that some legal institutional configurations are substantively more democratic than others. You are no longer judging only *how* rules change (procedure), but *what the rules do* to political competition (substantive effect). You move from a legalistic definition of democracy to a competitive-egalitarian one.

  Verdict: step 7, costs pure procedural neutrality
