answer: |-
  # Q&A PREP SHEET: 'No Terms, Only Uses'
  **Workshop:** Interdisciplinary Ethics & Linguistics
  **Date:** Next Week
  **Tone:** British English (Professional, candid, strategic)

  ---

  ## 1. UPFRONT CONCESSIONS
  *Do not wait for them to corner you. Weave these into your closing remarks or the transition to Q&A. It disarms the "you haven't thought of this" energy.*

  *   **Lexical Entrenchment:** Concede that while 'slur' isn't a lexical *category*, some lexical items are historically 'loaded'. Acknowledge that certain phonemes carry a higher probability of slurring due to historical sedimentation. You aren't saying all words are equal; you're saying the inequality isn't semantic *essence*.
  *   **The Legal Bright Line:** Admit that your theory makes drafting statutes harder. A list of banned words is administratively cheaper than a context-sensitive inquiry. Don't claim your theory makes law *easier*, only that it makes it *more accurate*.
  *   **Reclamation Complexity:** Concede that 'reclamation' feels like a change to the word itself to the community involved. Your job is to explain why that *feeling* is compatible with it being a change in *use conditions*.

  ---

  ## 2. THE OBJECTIONS (Ordered by Damage Potential)

  ### I. The Formal Semanticists (Theoretical Viability)
  **Damage Level:** **Fatal.** If they think your view breaks compositionality, the paper is dead on arrival.

  **The Objection:**
  > 'You're proposing that the semantic value of a slur-term is null, and all the offensive content is pragmatic. But slurs project out of negation and attitude contexts in ways that look distinctly semantic. If I say, "John doesn't realise that [Slur]s are dangerous," the offensive content survives. If it's merely a gradable property of the *act*, how do you compose that in the LF without stipulating a special operator? You seem to be trading a lexical puzzle for a compositional nightmare.'

  **The 2-Minute Reply:**
  'That's precisely why we need to shift the ontology. If we treat slurring as a gradable pragmatic property—akin to a presupposition or an expressive implicature triggered by the lexical item but fixed by context—we preserve compositionality. The word contributes a pointer to a social history; the context determines the value. Regarding projection: expressives project. If I say, "That bastard isn't actually a bastard," the insult lingers. My account treats slurring content as expressive, not truth-conditional. The "puzzle" of projection disappears because expressives are designed to scope out. I'm not removing the mechanism; I'm relocating it from the lexicon to the pragmatics, where projection is already handled.'

  **Honest Note on Weakness:**
  *This is thin on the mechanics of "gradability".* Semanticists will press you on *how* the grade is measured compositionally. You don't have a formal logic for "degree of slurring" yet. If they push for the formula, you must admit this is the next stage of the research, not the current claim.

  ### II. The Legal Philosopher (Practical Viability)
  **Damage Level:** **High.** If your theory undermines hate-speech legislation, you become a liability.

  **The Objection:**
  > 'The law requires *mens rea* and often relies on the use of specific prohibited terms to establish harm beyond reasonable doubt. If there is no slur *term*, only slurring *uses*, you've just made prosecution impossible. A defendant can claim, "I wasn't engaging in a slurring use, I was using it descriptively." You're handing a get-out-of-jail-free card to bigots by blurring the category the law relies on for notice and prohibition.'

  **The 2-Minute Reply:**
  'Actually, my account aligns better with modern judicial practice than the lexicalist one. Courts already look beyond the mere utterance of a word to intent, context, and impact. The "lexical list" approach is a blunt instrument that often fails in edge cases—like reclamation or artistic citation. By clarifying that the harm lies in the *use*, we give the law a more precise target: the harmful act, not the phoneme. It doesn't remove the category; it refines the *actus reus*. We stop punishing people for saying a word and start punishing them for weaponising it, which is what the law ought to be doing anyway.'

  **Honest Note on Weakness:**
  *The "Notice" Problem.* Citizens need to know what is illegal. If "slurring" is context-dependent, ordinary people might not know where the line is. You are prioritising justice over legal certainty. That's a noble trade-off, but a hard sell to a legal positivist.

  ### III. The Sociolinguists (Empirical Accuracy)
  **Damage Level:** **Medium.** They will argue you are erasing lived experience, but this is often viewed as "theoretical simplification" rather than fatal error.

  **The Objection:**
  > 'You're flattening the social reality of reclamation. When an in-group member uses a reclaimed term, it's not just a different "context"; the word itself has changed its status within that community. To say it's the same word doing different work ignores the power dynamics of appropriation. You're treating social authority as just another variable in a pragmatic equation, which strips the politics out of the linguistics.'

  **The 2-Minute Reply:**
  'I'm not stripping the politics out; I'm trying to explain how the politics *moves* the meaning. If reclamation changed the lexical entry permanently, out-group members couldn't use the term offensively anymore—it would be semantically neutered. But it isn't. It remains dangerous in their mouths. This suggests the word itself hasn't changed; the *permissions* have. My account captures this by treating community authority as a contextual parameter. It respects the social reality by showing exactly how that reality modulates the force of the utterance without needing to posit magical lexical changes.'

  **Honest Note on Weakness:**
  *The "Insider" Intuition.* Reclaimers often insist *they* have changed the word. Telling them "no, you've just changed the context" can feel patronising. You need to be careful not to sound like you're correcting their lived experience with theory.

  ---

  ## 3. THE CRUCIAL REPLY
  **Which single reply has to land for the paper to survive?**

  **The Semanticist Compositionality Reply (Objection I).**
  If you cannot explain how slurring content composes without a lexical entry, the formalists will dismiss the paper as "just pragmatics" (which, in some circles, means "hand-waving"). You must hold the line that **expressive content is compositional**. If you wobble here and say "it's too complex for formalisation," you lose the room.

  **Strategy:** Use the analogy of *implicature*. We know how implicatures work; they are context-dependent but systematic. Treat slurring as a conventionalised implicature that is highly resistant to cancellation, rather than a truth-conditional feature.

  ---

  ## 4. THE DREADED QUESTION
  **The question you are hoping nobody asks.**

  > **'If slurring is purely a property of the use, and mention can slur, is there *any* utterance of the phoneme that is safe? If I say "The word [Slur] has five letters," and a listener is offended, does your theory imply they are correct to be offended? Have you just defined away the distinction between use and mention entirely?'**

  **Why it's dangerous:**
  Your paper claims to solve the "mention puzzle" (that slurs offend even when mentioned). Your solution is that mention *can* be slurring. If pressed, this sounds like you're saying *nothing* is safe, which makes the theory too broad to be useful. It risks making you look like you're blaming the listener for taking offence rather than the speaker for giving it.

  **Prepared Answer (Keep it brief):**
  'No, I'm not erasing the distinction. I'm saying the distinction doesn't guarantee safety. Mention *usually* suspends slurring force, but not automatically. If I mention a slur to mock the group it targets, it's still a slurring act. The safety comes from the *intent and uptake*, not the grammatical frame. So, mentioning the word to count its letters is safe; mentioning it to evoke the hatred associated with it is not. The line remains, but it's drawn by the act, not the syntax.'

  *(Note: This is risky. If they push on "who decides the intent", you may have to concede that uptake plays a larger role than you'd like.)*

  ---

  ## 5. GENERAL ADVICE FOR THE ROOM
  *   **Don't fight the Semanticists on Math:** If they want a formalism you don't have, promise it as future work. Don't try to fake it.
  *   **Validate the Sociolinguists:** Use phrases like "social sedimentation" and "community authority." Show you respect the data even if you disagree on the ontology.
  *   **Reassure the Legal Philosopher:** Keep emphasising that *harm* is still the target. You are making the law more precise, not weaker.
  *   **Watch your Language:** Avoid saying "It's just a word." Say "The lexical item is constant; the illocutionary force varies."

  Good luck. Keep your tea close and your definitions closer.
