          *   *Recommendation:* Treat based on current relational capacity, reject "real self" argument.
      *   *Case 3 (DID):* Alter A vs. Alter B.
          *   *Standard:* Who is the "legal" person? (Usually the body).
          *   *Anattā:* All alters are empty of self. No one has metaphysical priority. Focus on systemic suffering.
          *   *Recommendation:* Negotiate based on minimizing systemic distress, not privileging one alter's "authority."

  5.  **Addressing the Philosophical Nuance (Settled vs. Contested):**

