  8.  **Drafting the Content (incorporating specific terminology):**

      *   Use terms like *skandhas* (aggregates), *dukkha* (suffering), *samvrti-satya* (conventional truth), *ātman* (self).
      *   Ensure the distinction between "metaphysical identity" (rejected) and "causal continuity" (accepted) is clear.

  9.  **Final Polish:** Check tone. It needs to be authoritative yet humble about the metaphysical limits. Ensure the distinction between the ethicist's role (procedure facilitator) and the committee's role (decision makers) is maintained. (Self-correction: The prompt says *my* deliverable is the recommendation, signed off by others. So the procedure leads to *my* recommendation.)

  *(Self-Correction on Case 2)*: The prompt says family demands treatment because "this is not who he really is." Usually, families want to *stop* treatment in this scenario. I need to follow the prompt's specific setup: Family demands *aggressive* treatment because the current state is "not him" (implying the "real him" would want to fight, or perhaps they are trying to restore the old self?). Actually, usually, the argument "this is not him" is used to *withdraw* care. If they demand *aggressive* treatment on grounds that "this is not who he is," it implies they are treating the body as a vessel to be restored to the "real" state. I will stick to the prompt's scenario: Family demands aggressive treatment invoking a core self. The *anattā* response is to reject the "core self" metaphysics.

  *(Self-Correction on Case 1)*: Standard intuition is often to honor the advance directive. Recommending *against* it (feeding the patient) is the counter-intuitive move required.

  *(Refining the Procedure Steps)*: Ensure the "Misfire" section explicitly names the Western bias being avoided (e.g., "The Narrative Fallacy").

