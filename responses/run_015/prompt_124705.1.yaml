      *   *Operationalization:* If there is no permanent self, the "Past Self" who wrote the directive and the "Present Self" who is suffering are not numerically identical in a metaphysical sense. They are causally connected streams of *skandhas* (aggregates). Authority cannot rest on metaphysical identity. It must rest on the reduction of *dukkha* (suffering) in the current causal stream and the ethical weight of relational commitments.

  3.  **Drafting the Decision Procedure (The "Anattā Clinical Protocol"):**

      *   *Goal:* Move away from "Who is the *real* patient?" to "Where is the suffering, and what are the causal/relational obligations?"
      *   *Axis 1 (Suffering):* Focus on immediate phenomenology vs. hypothetical future states.
      *   *Axis 2 (Continuity):* Distinguish memory/psychology from social/relational function.
      *   *Axis 3 (Authority):* Treat prior directives as *testimony* from a causally antecedent state, not a *command* from an identical owner.

      *   *Step Design:* Needs to be tight.
          *   Step 1: Phenomenological Assessment (Present Suffering).
