  Federal Office of Research Accountability Mandates Pre-Registered Falsification Conditions For All Grant Seekers

  WASHINGTON—Citing a need to eliminate theoretical drift and ensure that public funds support only those inquiries capable of terminating in failure, the Federal Office of Research Accountability announced yesterday that all grant applications submitted through the National Science Portal must now include a signed Falsification Plan and an automated Testability Score. The new protocol, designated Policy 88-B, requires Principal Investigators to specify in advance the exact observation that would compel them to abandon a project's central claim, with an algorithm assigning a numerical value based on the likelihood of that observation occurring. Office directors stated that the initiative is designed to prevent researchers from shifting goalposts after data collection has begun, ensuring that taxpayer money is not wasted on hypotheses that have been insulated from contradiction by layers of auxiliary assumptions.

  During the pilot phase, the scoring system produced immediate stratification among applicants across various disciplines. Dr. Marcus Thorne of the University of Idaho submitted a proposal in high-energy physics positing that a specific particle decay would occur within a narrow energy bandwidth. The proposal received a perfect Testability Score of 100 and was funded within the hour. By Wednesday afternoon, Thorne's team had observed no such decay, and the project was administratively closed. Conversely, a consortium specializing in Narrative Macrohistory secured funding by predicting that discursive shifts would manifest somewhere in the region of parameter space not yet probed. Because the algorithm could not locate existing data to contradict the vague spatial qualifier, the claim was registered as technically falsifiable, though no specific condition for abandonment was listed.

  In response to these outliers, the Office has deployed a secondary review layer tasked with distinguishing between revisions that add new testable content and revisions that merely protect the original claim from refutation. Several research programs in membrane ecodynamics have been placed on probation after surviving three consecutive negative results by attributing the discrepancies to instrument calibration errors and background noise. Under the new guidelines, a research team may only blame auxiliary assumptions twice per grant cycle before the central claim is deemed immunized and funding is suspended. Reviewers are now instructed to flag any proposal where the failure condition relies on the malfunction of the equipment used to detect the failure.

  Dr. Silas Vane, a philosopher of science at Columbia University who consulted on the policy's logical framework, noted that the system successfully isolates empirical content from metaphysical commitment. The metric forces researchers to confront the logical structure of their assertions before data collection begins, Vane said. It creates a clean separation between the theory and the scaffolding used to support it, ensuring that only the theory bears the risk of collapse.

  Late Friday, the Office's Compliance Division ran its own methodology through the VERIFY-2024 scoring engine to ensure internal consistency. The policy mandating falsification plans received a Testability Score of zero, as the Compliance Division could not specify an observation that would lead them to abandon the requirement itself. When asked whether a rule that fails its own testability threshold should be revised, Office Director Sarah Jenkins stated that the policy is a regulatory framework rather than an empirical hypothesis.

  Jenkins added that while the rule is not falsifiable, it is binding, and that distinguishing between binding rules and falsifiable claims is precisely the kind of administrative clarity the new system was designed to promote. The Office confirmed that all future updates to the granting protocol will be exempt from scoring requirements to prevent infinite regress.
