answer: |-
  You have not only noticed a pattern; you have rediscovered one of the deepest fault lines in the philosophy of time and physics. You are describing the conflict between **Process Ontology** (time as becoming) and **Substance/State Ontology** (time as a dimension of being).

  To answer your specific questions directly:

  ### 1. Is this one thing or two?
  It is **one thing**.

  The Dichotomy and the Arrow are two sides of the same coin.
  *   **The Dichotomy** attacks the *completion* of a process (how do we finish the infinite?).
  *   **The Arrow** attacks the *constitution* of a process (what is happening *during* it?).

  The reply you keep encountering treats both by denying that "process" is a fundamental category. It reduces **becoming** to **being**.
  *   In the Dichotomy, the "run" is reduced to the "path" (a static set of points).
  *   In the Arrow, the "moving" is reduced to the "trajectory" (a static function mapping time to place).

  In both cases, the dynamic verb ("to run," "to move") is replaced by a static noun ("the distance," "the position"). This is not an accident; it is the foundational move of classical mechanics and standard calculus.

  ### 2. Does the pattern have a name?
  There is no single colloquial label, but in philosophy, this is known as **The Spatialization of Time** (or **The Spatialization of Duration**).

  The most famous critique of this exact move comes from **Henri Bergson** (early 20th century). He argued that Zeno's paradoxes only exist because we make a category error: we treat time like space. We imagine time as a line already laid out (a "block"), rather than a flow that is created as it happens.

  The standard reply you are frustrated by is formally called **The "At-At" Theory of Motion**, championed by **Bertrand Russell**. Russell explicitly argued that motion *is nothing over and above* being at place $X$ at time $T$ and place $Y$ at time $T+1$. He admitted this eliminates "motion" as a distinct event occurring *at* an instant, but he argued that was a feature, not a bug.

  So, the "swap" you see is **The Russellian Reduction of Process to State-Space.**

  ### 3. The Thomson's Lamp and Your "Continuity Guess"
  Your guess is correct, but it needs one precise tweak.

  You wrote: *"Where the structure fixes its own limit, the swap is fine, and where it doesn't, the swap leaves a hole."*

  This is mathematically accurate. The "swap" works in the Dichotomy and Arrow because the mathematical series involved **converge to a definite state**.
  *   **Dichotomy:** The sum of distances converges to 1. The position function $x(t)$ is continuous.
  *   **Arrow:** The position function is continuous.
  *   **Thomson's Lamp:** The state function (On=1, Off=0) **does not converge**. The limit of the time intervals exists (1 minute), but the limit of the *states* does not (it oscillates $1, 0, 1, 0...$ forever).

  The "swap" relies on the assumption that the physical state is a **continuous function** of the static description. Where the physical property is discrete (On/Off) but the time is continuous, the static map fails to determine the boundary value.

  So your boundary is not just "continuity" generally, but **Continuity of State**. The static description determines the outcome only if the property being described varies continuously with the parameter (time/distance).

  ### 4. Definition and Boundary Case
  Since there is no perfect single term that captures your specific frustration (the *deletion of the agent*), I will give you the definition you asked for, based on your observation.

  **Name:** **Ontological Staticization**

  **Definition:** An explanatory move that resolves a question about *change* or *agency* by substituting a description of the *set of states* occupied across a temporal domain. It treats the transition between states as derivative of the states themselves, thereby rendering the "process" implicit rather than explicit.

  **Case that falls just outside it:** **The Phi Phenomenon.**

  *   **The Setup:** Two stationary lights flash in sequence at a specific interval.
  *   **The Static Description:** Light A is On at $t_1$; Light B is On at $t_2$. (Identical to the "At-At" description).
  *   **The Result:** The observer perceives a *single light moving* from A to B.
  *   **Why it's outside:** Here, the static structure (A at $t_1$, B at $t_2$) does *not* contain the motion. The motion is generated by the observer's nervous system. If you apply Ontological Staticization here, you lose the phenomenon entirely. The "motion" is not in the map; it is in the processing of the map. This proves your point: the static list of positions is not sufficient to account for the experience (or perhaps the reality) of transition.

  ### 5. Pushback on the Continuity Guess
  You asked me to push back if your guess is wrong. It is not wrong, but it is incomplete in a way that matters for your "agent" complaint.

  Even when the math converges (Dichotomy), the "swap" leaves a **metaphysical gap**, even if it doesn't leave a **mathematical gap**.

  *   **Math:** $\sum (1/2)^n = 1$. The gap is closed.
  *   **Metaphysics:** How does the runner *know* to stop at 1? The infinite series describes the path, but it does not describe the *mechanism of traversal*.

  In physics, we accept this because we care about prediction (where will the runner be?), not ontology (what is "moving"?). But your intuition is that the "swap" solves the *calculation* while dodging the *question*.

  **The Pushback:** The reason the "swap" is accepted isn't just that the structure fixes its limit. It's accepted because **physics abandoned "agency" centuries ago.**
  When you ask about "the runner," you are asking a question about *causality* or *phenomenology*. When the textbook answers with "the sum of distances," it is answering a question about *kinematics*.
  *   **Kinematics:** Describes motion without regard to mass or force (Static structure).
  *   **Dynamics:** Describes motion regarding mass and force (The "doing").

  The "swap" works in standard Zeno replies because they are answering a Kinematic question with a Kinematic answer. You are asking a Dynamic question ("How does he *do* it?"). The "swap" feels like a dodge because it changes the subject from Dynamics to Kinematics.

  ### Summary
  *   **Is it one thing?** Yes. It is the reduction of Time (A-series) to Space (B-series).
  *   **Name:** The Spatialization of Time (Bergson) or The At-At Reduction (Russell).
  *   **Your Guess:** Correct. The static description only determines the outcome if the state function converges (Continuity of State).
  *   **The Boundary:** **The Phi Phenomenon**. Static states + Time $\neq$ Motion without a processor to bridge the gap.
  *   **The Cost:** The "swap" buys mathematical consistency at the price of eliminating "becoming" from the universe. You are noticing the price tag.
