      *   *Affective Scientists:* They care about physiological markers and self-reports. They will challenge the "saturation" claim. Does pleasure *really* saturate while pain doesn't? Is this a measurement artifact or a phenomenological reality?
      *   *Philosophers (Sidgwickian):* They believe in a single scale of hedonic value. They see lexical views as "failure of nerve" (incoherent or ad hoc). They will attack the coherence of switching from additive to lexical within one framework.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Archimedean/Continuity Problem.* (Economists). If you have a lexical threshold, you can't calculate an ICER (Incremental Cost-Effectiveness Ratio). You can't sum utilities.
