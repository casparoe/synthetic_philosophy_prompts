  # JOINT STATEMENT: THE TOXIN PUZZLE COLLABORATION

  **Date:** October 24, 2023
  **Parties:** The Inaccessibilist Camp vs. The Accessibilist Camp
  **Subject:** Feasibility of Forming an Intention in Kavka's Toxin Puzzle

  ## I. AGREED CLAIMS

  Both camps affirm the following claims as the common ground for this dispute. Signing this section indicates agreement on the boundaries of the puzzle, not on the solution.

  1.  **The Setup is Fixed:** The million dollars is deposited *before* the drinking time. The drinking causes pain without lasting harm. The billionaire's detection method is infallible. The agent retains full capacity for planning and reasoning.
      *   *Why both sign:* Changing these facts changes the puzzle. We are analyzing the specific case provided, not a modified version.
  2.  **No Persistent Reasons:** To "solve" the puzzle legitimately, the agent cannot intend to drink based on a reason that will still exist at the time of drinking (e.g., "I want to be healthy" or "I promised my mother"). If a reason exists at the time of action, the puzzle dissolves.
      *   *Why both sign:* Both sides agree that if there is a reason to drink tomorrow, intending is easy. The puzzle exists only because the reason vanishes once the money is secured.
  3.  **No Self-Deception:** The agent cannot form the intention by tricking themselves into believing they will drink when they know they won't. Genuine intention requires honesty about one's own likely actions.
      *   *Why both sign:* Both sides agree that lying to oneself is not a rational strategy and does not constitute a stable intention state.
  4.  **Intention vs. Wish:** Intending to do something is different from hoping or wishing to do it. Intention involves a commitment to act that guides planning and excludes deliberating about whether to do it.
      *   *Why both sign:* Both sides accept standard functional definitions of intention; the dispute is about whether this state is *available* in this specific case, not what the state generally feels like.
  5.  **Rationality Constraint:** Agents generally do not intend to do things they know they will not do. Intention normally tracks predicted action.
      *   *Why both sign:* Both sides agree this is the normal rule. The dispute is whether this rule is a conceptual necessity (Inaccessibilists) or a contingent psychological habit (Accessibilists).

  ## II. DISAGREEMENTS TABLE

  The following table outlines the core disputes. Each row represents a single point of contention, stated in the language preferred by each camp.

  | ID | Core Dispute | Inaccessibilist Wording | Accessibilist Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Belief Constraint** | You cannot intend to X if you know you will not X. Since you know you won't drink (no reason), you cannot intend. | You can commit to X now even if you predict you might not X later. Intention is a plan, not a prediction. | **Genuine** (mostly) |
  | **D2** | **Source of Normativity** | Rationality forbids forming an intention that you know will be abandoned. It is irrational to plan to be irrational. | Rationality allows binding yourself to a plan now for future gain, even if local action later seems costly. | **Genuine** |
  | **D3** | **Definition of Intention** | "Intention" conceptually includes a belief that you will act for a reason. If that's missing, it's not intention. | "Intention" is a psychological state of commitment. It can exist even if the reason is external or past. | **Verbal** |
  | **D4** | **The Barrier** | The barrier is logical/conceptual. It is impossible for *any* agent to win this offer. | The barrier is psychological. Humans can't do it easily, but a sufficiently resolute agent could. | **Genuine** |

  ## III. CRUXES, PREDICTIONS, AND ANALYSIS

  This section details specific test cases ("cruxes") that bear on the disagreements above. For each crux, we state a concrete case, note whether it is empirically tractable, and record each side's prediction.

  ### Crux 1: The Belief Requirement
  *   **Case:** Can an agent intend to try to achieve something they believe is unlikely?
  *   **Inaccessibilist Prediction:** No. In this specific no-reason context, intending requires believing you will succeed. If you know you won't drink, you can't intend.
  *   **Accessibilist Prediction:** Yes. You can intend to drink as a plan, even if you doubt your future resolve. The intention is the commitment, not the confidence.
  *   **Analysis:** This is the highest leverage crux. If intention does not require belief in performance, Inaccessibilism collapses.

  ### Crux 2: The Grape Variant (Harmless/Pointless)
  *   **Case:** Replace the toxin with eating a grape. It causes no pain, but serves no purpose tomorrow.
  *   **Inaccessibilist Prediction:** Still impossible. Without a reason at the time of action, intention is unavailable, regardless of pain.
  *   **Accessibilist Prediction:** Easier. The psychological barrier is lower without pain, suggesting the original block was contingent, not conceptual.
  *   **Analysis:** Tests whether the barrier is "no reason" (Inaccessibilist) or "pain/disutility" (Accessibilist).

  ### Crux 3: Trivial Independent Reason
  *   **Case:** The billionaire adds a $5 reward for actually drinking the toxin.
  *   **Inaccessibilist Prediction:** Now it is possible. The $5 provides a reason at the time of action, unlocking the intention.
  *   **Accessibilist Prediction:** Confirms that *any* reason unlocks the capacity. Shows the argument is about the threshold of reasons, not impossibility.
  *   **Analysis:** Both sides agree this makes it possible. The dispute is whether the original impossibility was due to *zero* reasons or *insufficient* reasons.

  ### Crux 4: The Iterated Version
  *   **Case:** The offer happens 100 nights in a row. You build a track record.
  *   **Inaccessibilist Prediction:** Still impossible each night. Past performance does not change the logical lack of reason tomorrow.
  *   **Accessibilist Prediction:** Becomes possible. Habit or reputation becomes a reason, showing the barrier is psychological/contextual.
  *   **Analysis:** Tests whether the barrier is static (logic) or dynamic (psychology).

  ### Crux 5: Bypassing Judgment (Pills/Hypnosis)
  *   **Case:** You take a pill at midnight that forces you to drink tomorrow.
  *   **Inaccessibilist Prediction:** That is not *your* intention to drink; that is causation. You intended to take the pill, not to drink.
  *   **Accessibilist Prediction:** If you take the pill to get the money, you have effectively intended the outcome. It counts as a solution via pre-commitment.
  *   **Analysis:** Tests whether intention must flow through conscious judgment at the time of action.

  ### Final Analysis on Definitions and Tractability
  *   **Insulated Definitions:** The Inaccessibilist view risks insulating itself by defining "intention" in a way that logically excludes the puzzle case (i.e., "Intention requires a reason at time of action"). The Accessibilist view risks defining "intention" so loosely that it includes mere wishes. Both sides must guard against defining their conclusion into the premise.
  *   **Empirical Tractability:** Partly. We can survey people on what they *call* intentions in these cases, but we cannot empirically test the normative claim of what they *should* be able to intend.
  *   **Highest Leverage:** Crux 1 (The Belief Requirement). If intention does not require believing you will act, the Inaccessibilist argument fails.
  *   **Largest Verbal Component:** The dispute over whether "intention" necessarily includes a belief in future performance (D3).

