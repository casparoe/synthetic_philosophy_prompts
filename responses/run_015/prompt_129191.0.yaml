answer: |-
  You have spotted a very real and widely discussed maneuver in moral reasoning. You are right that it isn't Particularism (which denies the rule's authority) and it isn't making an excuse (which admits the rule was broken).

  There isn't one single Latin phrase for this like *ad hominem*, but in philosophy, it is most commonly referred to as **"The Strategy of Redescription"** (or **"Act-Description Manipulation"**) used to sustain **"Definitional Absolutism."** Logically, it is a specific ethical application of the **"No True Scotsman" fallacy.**

  Here is the breakdown of what is happening, how it differs from the concepts you know, and who has talked about it.

  ### 1. Name and Definition

  **The Name:**
  *   **Logical Term:** *No True Scotsman Fallacy.* (e.g., "No Scotsman puts sugar on his porridge." "But Angus is a Scotsman and he does." "Well, no *true* Scotsman does.")
  *   **Ethical Term:** *The Strategy of Redescription* or *Definitional Absolutism.*
  *   **Critique Term:** *Vacuousness* or *Tautology.*

  **The Definition:**
  This occurs when a moral agent holds an absolute rule (e.g., "Lying is always wrong") and, when faced with a counter-example (e.g., "What about lying to a murderer to save a victim?"), they do not admit an exception. Instead, they retroactively narrow the definition of the key term ("Lying") so that the counter-example no longer fits the category.

  The rule remains "exceptionless," but only because the definition of the prohibited act has been shrunk to exclude anything the agent deems acceptable. The rule becomes **tautological**: "Wrongful lying is always wrong." This is true by definition, but it offers no actual guidance on how to identify "wrongful lying" in the first place.

  ### 2. How It Differs from Particularism

  You correctly noted this isn't Particularism. Here is the structural difference:

  *   **Particularism:** Argues that moral rules are inherently flawed or secondary. A particularist says, "The rule 'Lying is wrong' is a generalization that fails in specific contexts. Context determines the morality, not the rule." They are willing to **break or discard the rule** to fit the reality of the situation.
  *   **Redescription/Absolutism:** Argues that the rule is perfect and exceptionless. They say, "The rule stands. If the action was good, it *cannot* be lying by definition." They **break the link between the word and the action** to save the rule.

  **In short:** Particularism changes the *judgment* to fit the case; Redescription changes the *case description* to fit the judgment.

  ### 3. How It Differs from Making Excuses

  This is a crucial distinction in moral philosophy (often discussed under **Justifications vs. Excuses**).

  *   **Making an Excuse:** Admits the rule was violated but argues the agent shouldn't be blamed.
      *   *Example:* "Yes, I lied. It was wrong, but I was under extreme duress, so forgive me."
      *   *Structure:* Act = Wrong + Agent = Blameless.
  *   **Redescription (The move you spotted):** Denies the rule was violated at all.
      *   *Example:* "I did not lie. I engaged in 'protective withholding of truth.' Therefore, I am blameless because I did nothing wrong."
      *   *Structure:* Act = Not Wrong (by definition) + Agent = Blameless.

  The move you are seeing tries to keep the agent's hands clean by insisting they never touched the "wrong" thing in the first place.

  ### 4. Have Philosophers Talked About This?

  Yes, extensively. This is a central problem in **Deontological Ethics** (rule-based ethics), specifically surrounding Immanuel Kant.

  **The Classic Example: Kant and the Murderer at the Door**
  Immanuel Kant famously argued that lying is always wrong, even to a murderer asking where your friend is hiding. Critics (like Benjamin Constant) asked, "Surely saving a life is more important?"
  Defenders of Kant often use the move you described: They argue that speaking falsely to a murderer isn't a "lie" in the moral sense because a lie requires a right to the truth, and the murderer has forfeited that right.
  *   **The Critique:** Philosophers like **Philippa Foot** and **Bernard Williams** argued that this makes moral language useless. If we have to redefine "lying" every time it conflicts with "saving a life," the word "lying" no longer describes an action; it just means "things we decided were wrong."

  **G.E.M. Anscombe and Action Descriptions**
  The philosopher Elizabeth Anscombe wrote extensively about how we describe actions. She noted that one and the same physical movement can be described in many ways (e.g., "moving a finger," "pulling a trigger," "killing a man," "defending the realm").
  *   **The Problem:** If you are allowed to pick *any* description that makes your action look moral, morality becomes a game of semantics. Philosophers call this **"The Problem of Act-Description."**

  **Bernard Williams on "Moralism"**
  Bernard Williams criticized this kind of thinking as a form of bad **"Moralism."** He argued that when people prioritize the purity of their moral rule ("I must keep my hands clean") over the actual outcome ("A person died"), and then use redescription to hide the conflict, they are engaging in a kind of self-indulgent narcissism rather than genuine ethics.

  ### Summary for Your Arguments

  When your friends do this, you can point out three things:

  1.  **It's Circular:** They are defining "Wrong Action" as "Any action that violates the rule," and "Rule" as "Don't do Wrong Actions." This teaches us nothing.
  2.  **It's "No True Scotsman":** They are protecting the rule from evidence by changing the definition of the terms mid-argument.
  3.  **It Blocks Learning:** If we rename every necessary exception (e.g., "That wasn't hurting, it was surgery"), we never learn *when* it is okay to hurt people. We just hide the complexity behind new words.

  You can tell them: *"You aren't defending the rule; you're emptying it of content. If 'lying' just means 'lying that we think is wrong,' then saying 'lying is wrong' is just saying 'wrong things are wrong.'"*
