prompt: |-
  I spent the better part of last night in a long argument with a close friend who works in evolutionary biology. She kept insisting that if a behavioral regularity is evolutionarily stable, then it already is a convention in the relevant normative sense, and that David Lewis's emphasis on common knowledge and arbitrary alternatives adds nothing but philosophical ornament. I think she is wrong—specifically, she is collapsing the normative "ought" of a Lewisian convention into the descriptive stability of an equilibrium—but I need to be able to show exactly where the collapse happens, and why it matters. So I am asking for a teaching plan, not an explanation: I will lead a single ninety-minute session with a reading group of cognitive-science graduate students. They are fluent in evolutionary game theory and signaling models, but they have no background in philosophy of language or action theory.

  The concept I need them to grasp is Lewis's analysis of convention as a solution to coordination problems that carries genuine normative weight, together with the evolutionary dynamics that can stabilize but do not by themselves constitute such conventions. I need the dependency structure laid out precisely: which component—the payoff structure of a coordination problem, the notion of an arbitrary alternative, the common-knowledge condition, or the normative "ought"—must be secured before the next is introduced, and what breaks if the order is reversed?

  For the carrying example, I want to avoid both the overused telephone and driving-on-the-right illustrations. I am considering the spontaneous stabilization of functional roles—healer, tank, damage-dealer—in a cooperative multiplayer raid environment where no central authority assigns positions, and where newcomers are socially expected to learn and adopt the established pattern. What properties must this example possess, and what properties must it deliberately lack, in order to carry the distinction between a merely stable regularity and a full Lewisian convention? And why should an explicit institutional contract or legal rule not serve as the parallel case?

  Then I need a misconception map tailored to this audience. I anticipate three specific errors: that convention requires an explicit agreement or contract; that evolutionary stability is sufficient for convention; and that the common-knowledge condition involves an impossible infinite regress of beliefs about beliefs. For each, I need to know exactly where in the sequence it will arise, what form it will take given their scientific training, and the precise point at which I should intervene to head it off—especially the second misconception, which is the one my friend advanced.

  What should I explicitly leave out at this level? I am tempted to introduce later work in evolutionary dynamics—perhaps signaling-game models or accounts of normative emergence in social science—but I want to know whether bringing them in helps or undermines the distinction I am trying to protect.

  Finally, I need one diagnostic question I can pose at the end that reveals whether they have genuinely understood the difference between a stable evolutionary regularity and a Lewisian convention with normative force, rather than whether they can merely list the formal conditions.

  Please structure your response as a teaching plan: the ordered introduction with dependency justifications; the carrying example with its required and excluded features; the misconception map with intervention points; the omissions with reasoning; and the check-for-understanding question. End with a single line beginning "Core principle:" that summarizes the central pedagogical insight in one sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute teaching plan for cognitive science grad students (fluent in EGT/signaling, no philosophy background).
      *   **Topic:** David Lewis's analysis of convention vs. evolutionary stability (normative "ought" vs. descriptive stability).
      *   **Key Conflict:** The user's friend (evolutionary biologist) claims evolutionary stability *is* convention (normativity is redundant). The user disagrees (stability $\neq$ convention).
      *   **Requirements:**
          *   Ordered introduction with dependency justifications (what must come before what).
          *   "Carrying example" (MMO raid roles, not driving/phone) with required/excluded features.
          *   Misconception map (3 specific errors) with intervention points.
          *   Omissions (what to leave out and why).
          *   Diagnostic question (tests understanding, not memorization).
          *   Format: Teaching Plan structure.
          *   Ending: Single line "Core principle:".

  2.  **Deconstruct the Philosophical Core:**
      *   *Lewis's Convention:* Regularity $R$ in population $P$, in situation $S$.
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *if* others do (Coordination Problem).
          4.  There is an alternative $R'$ that could have worked instead (Arbitrariness).
          5.  Common Knowledge (of 1-4).
          6.  *Normative force:* "One ought to conform" (conditional on expectations).
      *   *Evolutionary Stability (ESS):* A strategy that, if adopted by a population, cannot be invaded by a mutant strategy. It's about fitness/payoff stability over time.
      *   *The Gap:* ESS explains *how* we got here (dynamics) and *why* we stay (stability). Lewis explains *why we feel bound* to stay and *why we criticize* deviations (normativity/reasoning). An ESS can exist without common knowledge or the specific reasoning structure of a convention.
      *   *The "Collapse":* The friend thinks stability $\rightarrow$ normativity. Lewis says stability + common knowledge + arbitrariness + reasoning $\rightarrow$ normativity.

  3.  **Drafting the Teaching Plan - Section by Section:**

      *   **Section 1: Ordered Introduction (Dependency Structure):**
          *   Need to start with the *problem* (Coordination), not the solution.
          *   Then the *solution* (Equilibrium/Stability).
          *   Then the *gap* (Why isn't stability enough?).
          *   Then the *bridge* (Common Knowledge + Arbitrariness).
          *   Then the *result* (Normativity).
          *   *Constraint:* Must justify the order. If you start with Normativity, it looks magical. If you start with Common Knowledge, it looks like math trivia.
          *   *Sequence:* Coordination Problem $\rightarrow$ Equilibrium/Stability $\rightarrow$ Arbitrariness $\rightarrow$ Common Knowledge $\rightarrow$ Normative "Ought".

      *   **Section 2: The Carrying Example (MMO Raids):**
          *   *Context:* World of Warcraft (or similar) raiding. Healer/Tank/DPS.
          *   *Required Features:*
              *   No central assignment (spontaneous).
              *   Interdependence (Tank fails $\rightarrow$ Healer overwhelmed).
              *   Alternatives exist (Swap roles, different comp).
              *   Social pressure (Kicked for not conforming).
          *   *Excluded Features:*
              *   Hard-coded game mechanics forcing roles (must be player choice).
              *   Explicit contracts (no signed agreement).
              *   Biological imperative (not hard-wired).
          *   *Why not Institutional Rule?* Because institutional rules *create* the obligation externally. Lewisian convention generates obligation *internally* from the reasoning of the agents.

      *   **Section 3: Misconception Map:**
          *   *Error 1: Explicit Agreement.* (Legalistic view).
              *   *When:* Early, when defining "convention."
              *   *Intervention:* Contrast with language (no one signed a contract to call dogs "dogs").
          *   *Error 2: ESS = Convention.* (The Friend's View).
              *   *When:* After introducing Stability.
              *   *Intervention:* The "Mutant" test vs. The "Reasoning" test. A beetle doesn't know it's in an ESS. A raider knows and expects others to know.
          *   *Error 3: Infinite Regress.* (Common Knowledge is impossible).
              *   *When:* Discussing CK.
              *   *Intervention:* CK is a fixed point assumption for modeling reasoning, not a psychological literalism.

      *   **Section 4: Omissions:**
          *   *What to leave out:* Skyrms' evolutionary signaling dynamics, Bicchieri's empirical norms, detailed modal logic of CK.
          *   *Why:* They blur the line. Skyrms shows how conventions *emerge* evolutionarily, which supports the friend's view too much. Need to isolate Lewis's *conceptual* claim first.

      *   **Section 5: Diagnostic Question:**
          *   Needs to distinguish between "I do X because it works" (ESS) and "I do X because I expect you to expect me to..." (Lewis).
          *   Scenario: A mutation occurs. How do agents react?
          *   *Draft:* "If a new strategy appears that yields equal payoff but breaks the pattern, does the population reject it? Why?"
          *   *Refinement:* Focus on the *reason* for adherence.

  4.  **Refining and Polishing:**
      *   *Tone:* Academic, precise, pedagogical.
      *   *Audience:* Cognitive Science Grads. They know math/models, need the philosophical distinction.
      *   *Check:* Did I address the "Normative Ought"? Yes, that's the crux.
      *   *Check:* Did I address the "Arbitrary Alternative"? Yes, crucial for Lewis.
      *   *Check:* Is the MMO example robust? Need to ensure it's not just "game mechanics." It must be social coordination *within* the mechanics. E.g., specific positioning or cooldown timing, not just class selection. Actually, class selection (Tank/Heal/DPS) is good if the game allows flexibility but the *group* stabilizes on a meta. Let's stick to the prompt's suggestion: "functional roles... where no central authority assigns positions."
      *   *Dependency Logic:* If you introduce Normativity before Arbitrariness, it looks like morality. If you introduce CK before Coordination, it looks like epistemology.

  5.  **Final Review against Constraints:**
      *   90-minute session plan? (Implicit in the structure).
      *   Teaching plan format? Yes.
      *   Ordered introduction with justifications? Yes.
      *   Carrying example features? Yes.
      *   Misconception map (3 errors)? Yes.
      *   Omissions? Yes.
      *   Diagnostic question? Yes.
      *   Core principle line? Yes.

  6.  **Self-Correction during drafting:**
      *   *Critique:* Is the distinction between ESS and Lewis too sharp?
      *   *Correction:* Acknowledge that ESS explains the *origin*, but Lewis explains the *status*. The plan must emphasize that Lewis is analyzing the *concept* of convention, not just the *causal history*.
      *   *Critique:* The MMO example might sound like "rules of the game."
      *   *Correction:* Specify that the game engine *allows* deviations (e.g., all-DPS run), but the *community* stabilizes on Tank/Heal/DPS as the expected norm for success, and newcomers are *taught* this.
      *   *Critique:* The diagnostic question needs to be sharper.
      *   *Correction:* Make it about the *justification* given to a deviator. "You *should* have tanked" vs. "You failed to maximize fitness."

  7.  **Final Polish:** Ensure the "Core Principle" is punchy. "Stability explains persistence; common knowledge of arbitrariness explains obligation."

  *(Self-Correction on the "Core Principle" constraint)*: The prompt asks for a single line beginning "Core principle:". I must ensure this is exact.

  *(Self-Correction on Omissions)*: The prompt asks about evolutionary dynamics (Skyrms etc.). I need to be clear that bringing them in *now* undermines the specific conceptual distinction Lewis is making, even if they are relevant later.

  *(Self-Correction on Misconception 2)*: This is the friend's argument. I need to make sure the intervention point is very specific. It's about the *reason for action*.

  Let's assemble the plan.cw
answer: |-
  # Teaching Plan: Lewisian Convention vs. Evolutionary Stability
  **Session Duration:** 90 Minutes
  **Audience:** Cognitive Science Graduate Students (Fluent in EGT/Signaling, Novice in Philosophy of Action)
  **Objective:** Distinguish between descriptive evolutionary stability and normative Lewisian convention, specifically isolating the role of common knowledge and arbitrariness in generating the "ought."

  ---

  ## 1. Ordered Introduction: Dependency Structure (25 Minutes)
  *Do not introduce concepts in alphabetical or historical order. Introduce them in the order of logical dependency required to build the normative "ought."*

  1.  **Coordination Problem (The Substrate)**
      *   *Definition:* A situation where agents' payoffs depend on matching actions, with multiple matching equilibria available.
      *   *Dependency:* Must be first. Without interdependence, there is nothing to stabilize.
      *   *Risk if Reversed:* If introduced after "Normativity," students will confuse coordination with moral obligation.

  2.  **Evolutionary Stability (The Descriptive Baseline)**
      *   *Definition:* A regularity that persists because deviations are selected against (ESS).
      *   *Dependency:* Must follow Coordination. It explains *persistence* without explaining *reasoning*.
      *   *Risk if Reversed:* If introduced after "Common Knowledge," students will treat CK as a causal mechanism for stability rather than a condition for reasoning.

  3.  **Arbitrary Alternative (The Contingency)**
      *   *Definition:* The existence of a distinct regularity $R'$ that would have solved the coordination problem equally well had it been established instead.
      *   *Dependency:* Must follow Stability. Stability alone allows for unique optima (e.g., avoiding fire). Arbitrariness distinguishes convention from physical necessity.
      *   *Risk if Reversed:* If introduced before Stability, students may treat conventions as random rather than stable solutions.

  4.  **Common Knowledge (The Reasoning Structure)**
      *   *Definition:* Everyone knows $R$, everyone knows everyone knows $R$, etc., specifically regarding the *expectation* of conformity.
      *   *Dependency:* Must follow Arbitrariness. CK is only relevant if there are alternatives to coordinate *upon*.
      *   *Risk if Reversed:* If introduced before Coordination, CK appears as abstract epistemology rather than a tool for solving interaction problems.

  5.  **Normative "Ought" (The Target Concept)**
      *   *Definition:* The conditional reason for action: "I ought to conform *because* I expect you to conform, and you expect me to."
      *   *Dependency:* Must be last. It is the *result* of the previous four components combined.
      *   *Risk if Reversed:* If introduced first, it appears as a moral axiom rather than a structural feature of rational interaction.

  ---

  ## 2. The Carrying Example: MMO Raid Roles (20 Minutes)
  *Context:* A cooperative multiplayer raid (e.g., World of Warcraft) where the game engine allows flexible class choices, but the community stabilizes on a "Tank/Healer/DPS" meta without central assignment.

  ### Required Properties (To sustain the Lewisian distinction)
  1.  **Decentralized Emergence:** The game code does not force one Tank per group; players select this via matchmaking or chat.
  2.  **Interdependence:** A group of all-DPS fails not because of code prohibition, but because mechanics overwhelm them (Coordination Problem).
  3.  **Arbitrariness:** It must be plausible that a different meta (e.g., "2-Tank/No-Healer") *could* have become stable if history had gone differently. The current roles are not the *only* mathematical solution.
  4.  **Social Sanction:** Newcomers are not just ineffective; they are *criticized* or kicked for failing to adopt the role. This indicates the normative "ought."
  5.  **Expectation Matching:** Players choose "Tank" not because they prefer tanking, but because they expect the group to expect a Tank.

  ### Excluded Properties (To prevent conceptual collapse)
  1.  **Hard Constraints:** The example must *not* involve game mechanics that literally prevent a group from entering a raid without a Tank. (This would be an institutional rule, not a convention).
  2.  **Explicit Contract:** Players must not sign an agreement before the raid. (This triggers the "Explicit Agreement" misconception).
  3.  **Biological Hardwiring:** The roles must not be innate traits. (This conflates ESS with instinct).

  ### Why Not an Institutional Contract?
  An institutional rule (e.g., "The Raid Leader assigns roles") generates obligation *externally* via authority. Lewisian convention generates obligation *internally* via the recursive reasoning of the agents. Using a contract obscures the specific work that **Common Knowledge** does in generating normativity from the bottom up.

  ---

  ## 3. Misconception Map & Intervention Points (30 Minutes)
  *Targeted corrections for cognitive science students.*

  | Misconception | When it Arises | Form it Takes (Scientific Training) | Intervention Point & Strategy |
  | :--- | :--- | :--- | :--- |
  | **1. Convention requires Explicit Agreement** | During **Coordination Problem** setup. | "Where is the signaling handshake? Show me the contract that established the Tank role." | **Intervene immediately.** Contrast with language. No one signed a contract to call a 'dog' a 'dog'. <br>**Strategy:** Use the "Silent Coordination" test. Ask: "If I signal 'Tank' and you signal 'Tank' without words, but we both know we know, is there a contract?" |
  | **2. Evolutionary Stability = Convention** (The Friend's View) | During **Evolutionary Stability** section. | "If the strategy is an ESS, deviations are punished by lower fitness. That *is* the norm. The 'ought' is just expected utility." | **Intervene at the "Reason for Action" step.** <br>**Strategy:** The **Mutant vs. Deviant** distinction. In ESS, a mutant fails because it gets lower payoffs (descriptive). In Lewisian convention, a deviant fails because they violated an expectation *others relied upon* (normative). Ask: "Does a beetle know it's in an ESS? Does a raider know they are in a convention?" The latter requires CK. |
  | **3. Common Knowledge is an Impossible Regress** | During **Common Knowledge** section. | "Infinite belief iterations are computationally intractable for bounded agents. This model is psychologically unrealistic." | **Intervene before moving to Normativity.** <br>**Strategy:** Reframe CK as a **Fixed Point Assumption**, not a psychological process. It is a modeling idealization that captures the *publicity* of the signal, not a literal infinite loop in working memory. Analogy: "We treat rational agents as having consistent beliefs despite logical omniscience problems." |

  ---

  ## 4. Omissions: What to Leave Out (10 Minutes)
  *Do not introduce these topics, even though they are relevant to the field.*

  1.  **Skyrms' Evolutionary Signaling Dynamics:**
      *   *Reasoning:* Skyrms demonstrates how conventions *emerge* from pre-rational dynamics. Introducing this now supports your friend's argument (that evolution creates convention). You must first isolate Lewis's *conceptual* claim (what convention *is*) before discussing its *genesis*.
  2.  **Bicchieri's Empirical Norms:**
      *   *Reasoning:* Bicchieri blends empirical expectations with normative expectations. While compatible, her framework is sociological. Lewis is analyzing the *logic of rational action*. Mixing them confuses the source of the "ought" (social pressure vs. rational expectation).
  3.  **Modal Logic Formalisms for Common Knowledge:**
      *   *Reasoning:* Your students know the math. Do not derive the fixed-point theorem. It distracts from the philosophical function of CK in grounding the "ought." Keep CK qualitative and functional.

  ---

  ## 5. Diagnostic Question (5 Minutes)
  *Pose this at the very end. Do not ask for definitions. Ask for a judgment on a specific case.*

  **The Scenario:**
  "Imagine a raid group where the 'Tank/Healer/DPS' pattern is an Evolutionary Stable Strategy. A new player joins and plays 'All-DPS'. The group fails the raid.
  **Case A:** The group kicks the player simply because their fitness contribution was low.
  **Case B:** The group kicks the player because they *knew* a Tank was expected, and the player *knew* it was expected, yet chose DPS anyway.

  **The Question:**
  In which case is the player violating a **Lewisian Convention**, and in which case are they merely suffering an **Evolutionary Penalty**? Explain the difference in terms of the *reason* the group gives for the sanction."

  **Correct Answer Indicator:**
  Students must identify that Case A is mere stability (descriptive failure), while Case B is convention (normative violation). The key differentiator is the **reference to mutual expectations** (Common Knowledge) as the justification for the sanction, not just the payoff loss.

  ---

  Core principle: Evolutionary stability explains why a behavior persists, but only common knowledge of arbitrary alternatives explains why agents feel bound to uphold it.
