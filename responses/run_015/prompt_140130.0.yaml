answer: |-
  ### Specification for a Clinical Consciousness Monitor

  **Context:** Detection of conscious experience in non-communicative patients (Disorders of Consciousness, DoC).
  **Objective:** To establish necessary conditions for a theory of consciousness to underwrite clinical judgment (prognosis, analgesia, withdrawal of care).

  #### 1. Level versus Content (Arousal vs. Awareness)
  *   **Requirement:** The measure must dissociate wakefulness (arousal/brainstem function) from consciousness (subjective experience). It must distinguish a dreaming REM sleeper (high consciousness, low motor output) from a sleepwalker or complex seizure state (high motor output, low/no consciousness).
  *   **Case:** Misidentifying a sleep-like state as conscious leads to false hope; misidentifying a locked-in or dream state as unconscious leads to neglect of pain or premature withdrawal.
  *   **Status:** **Non-negotiable.** (Clinical Safety)

  #### 2. Grain, Borders, and Montage (Scale and Boundary Invariance)
  *   **Requirement:** The verdict (conscious/unconscious) must not flip based on arbitrary measurement choices (e.g., electrode density, time-bin size). The theory must define the *physical boundary* of the conscious system intrinsically, not by the clinician's choice of where to place sensors.
  *   **Case:** If the measure depends on the electrode set, it measures signal quality, not consciousness. If the boundary is drawn by the observer, the "conscious system" is subjective.
  *   **Status:** **Non-negotiable** for validity; **Preference of IIT camp** for the specific mechanism (intrinsic cause-effect power defines the boundary). Other theories (e.g., Global Workspace) treat boundaries as functional, not strictly physical.

  #### 3. The Cerebellum-Type Case (Anatomical Face Validity)
  *   **Requirement:** The measure must not attribute high consciousness to structures known to be non-essential for experience despite high neuron density or activity (specifically the cerebellum).
  *   **Case:** Cerebellar agenesis or destruction leaves consciousness intact. A theory that counts neurons or local integration without regard for anatomical role will falsely label the cerebellum as a seat of experience.
  *   **Status:** **Non-negotiable.** (Anatomical Consensus)

  #### 4. Hemispherectomy and Split-Brain (Unity and Subtraction)
  *   **Requirement:** The measure must account for the unity of experience. Removing half the cortex (hemispherectomy) should reduce capacity but not eliminate consciousness. Disconnecting the corpus callosum (split-brain) should potentially indicate two distinct conscious units, not one diminished one.
  *   **Case:** A measure that simply sums total integration will fail here. It must detect *where* integration breaks to determine if there is one subject or two.
  *   **Status:** **Non-negotiable.** (Structural Integrity)

  #### 5. Pharmacology (Dissociation of Report and Experience)
  *   **Requirement:** The measure must track experience, not the capacity to report. It must register "unconscious" for propofol anesthesia but "conscious" for neuromuscular blockade (locked-in). Crucially, it must handle dissociatives (ketamine) where report is garbled but experience is vivid/altered.
  *   **Case:** If the monitor tracks the *machinery of speech/motor planning* rather than experience, it will fail the locked-in patient. If it tracks *complexity* alone, it may misread ketamine states.
  *   **Status:** **Non-negotiable.** (Pharmacological Validity)

  #### 6. The Transfer Problem (Calibration Bridge)
  *   **Requirement:** The theory must provide a principled bridge justifying why a metric calibrated on healthy, reporting brains applies to injured, non-reporting brains. It must specify what would falsify the transfer (e.g., if the physical substrate changes type, not just state).
  *   **Case:** Machine learning classifiers often fail here; they learn "healthy brain patterns" rather than "consciousness." If the injury changes the signal generation mechanism, the calibration is void.
  *   **Status:** **Non-negotiable.** (Epistemic Validity)

  #### 7. Computability and Determinacy (Feasibility)
  *   **Requirement:** The metric must be calculable from noisy, limited clinical data (EEG/iEEG) in minutes, with no free parameters tuned per patient.
  *   **Case:** A theory that requires knowing the exact connectome or calculating uncomputable functions cannot be used at a bedside.
  *   **Status:** **Non-negotiable.** (Clinical Feasibility)

  #### 8. Action-Guidance (Ethical Utility)
  *   **Requirement:** The output must license a specific clinical action that would otherwise be withheld (e.g., aggressive pain management, rehabilitation investment) or forbid one (e.g., withdrawal of life support).
  *   **Case:** A "consciousness number" with no decision threshold is clinically useless. It must map to ethical categories (pain bearer, person, vegetative).
  *   **Status:** **Non-negotiable.** (Ethical Utility)

  ---

  ### Incompatibility Analysis

  Your suspicion is correct. **Validation by Report**, **Applicability without Report**, and **Computability** form a triangle of tension where satisfying two often compromises the third.

  1.  **The Conflict:** To validate the monitor (Transfer Problem), you need ground truth (Report). To use it clinically (Applicability), you lack ground truth. To make it computable (Computability), you usually must simplify the theory into a proxy (like PCI in IIT).
  2.  **The Proxy Trap:** If you optimize the metric to predict *Report* in healthy subjects (to solve Validation), you risk building a "Report Detector," not a "Consciousness Detector." When applied to a non-reporting patient, you are assuming the physical substrate of report is identical to the physical substrate of experience. This assumption is unproven.
  3.  **The Exclusionary Requirement:** **Computability and Determinacy** excludes the most candidates. Most rigorous philosophical theories (including strict IIT) define consciousness in ways that are mathematically uncomputable for a system as complex as the human brain. To make them computable, you must introduce approximations (proxies) that weaken the theoretical link to experience.
  4.  **Camp Prejudice vs. Desideratum:**
      *   **Grain/Borders (Intrinsic Boundaries):** This is heavily weighted toward **IIT**. Functional theories (Global Workspace) do not require precise physical boundaries to be defined by the system itself; they care about information flow. Demanding the theory define the physical border *a priori* is an IIT-specific constraint.
      *   **Cerebellum Case:** While clinically non-negotiable, *how* a theory solves it is theoretical. IIT uses it to rule out connectionist theories. However, some neuroscientists argue the cerebellum *does* contribute to conscious timing, making this a potential theoretical bias if treated as absolute dogma.

  ---

  ### Theory Scorecard

  **Integrated Information Theory (IIT)**
  *   **Score:** High on Borders/Cerebellum/Unity; Low on Computability.
  *   **Assessment:** Uniquely satisfies the boundary and cerebellum requirements by design. However, exact $\Phi$ is uncomputable; clinical tools (PCI) are proxies that may not capture the full theory, risking the Transfer Problem.

  **Global Workspace Theory (GWT)**
  *   **Score:** High on Computability/Pharmacology; Low on Borders/Unity.
  *   **Assessment:** Excellent at detecting "ignition" signatures compatible with report. Struggles with the Split-Brain case (functional disconnection vs. physical) and does not define intrinsic physical boundaries, making it vulnerable to the Grain requirement.

  **Higher-Order Theories (HOT)**
  *   **Score:** High on Conceptual Clarity; Low on Applicability/Computability.
  *   **Assessment:** Posits consciousness requires a thought *about* a state. Extremely difficult to measure without report (the "higher order" state is internal). High risk of failing the Transfer Problem as it relies on cognitive architecture hard to verify in injury.

  ### Summary Recommendation for the Advisory Group
  The critical failure point is not the theory, but the **proxy**. If the monitor uses a simplified metric (like PCI) derived from IIT, you must ask: *Has this proxy been validated against the theory, or only against healthy reports?* If the latter, it is a report-predictor, not a consciousness-detector. For hypoxic injury, where the physical substrate is damaged differently than in healthy sleep or anesthesia, the **Transfer Problem** is the single greatest risk. Demand evidence that the metric holds in cases where report is physically possible but pathologically severed (e.g., high cervical spinal cord injury), not just sleep and anesthesia.
