prompt: |-
  My brother has been diagnosed as minimally conscious after a hypoxic brain injury, and the hospital where he is a patient is being asked to pilot a bedside consciousness monitor built on integrated information theory. Before our family advisory group takes a view on it, I want a specification rather than a pitch: what would a theory of consciousness have to deliver in order to be fit for this use — to underwrite a clinical judgment about whether a patient who cannot move or speak is having any experience at all?

  Give each requirement with the case or consideration behind it, and mark it non-negotiable or a preference of one camp. The ones I keep coming back to:

  - Level versus content, and wakefulness versus consciousness: it must do more than rank patients, and it must not treat the REM sleeper who is dreaming and the sleepwalker who is not as the same problem.
  - Grain, borders, and montage: the same recording rescored at a different spatial or temporal grain, or with a different electrode set, must not yield a different verdict; and the theory has to say where a system's boundary falls rather than letting it be drawn patient by patient.
  - The cerebellum-type case: a structure containing more neurons than the rest of the brain put together, which on the clinical picture as I understand it — congenital absence, focal lesions — perturbs coordination and cognitive timing rather than whether there is anything it is like for the patient, must not come out as the main seat of consciousness.
  - Hemispherectomy and split-brain: removing or disconnecting half the cortex leaves a conscious person behind, so a measure that tracks total integrated capacity has to say what has been lost and whether that loss is a difference in experience or only in a number.
  - Pharmacology: it must handle both drugs that abolish experience and drugs, like ketamine, that seem to abolish report while leaving experience intact — and it must not be moved by interventions that change signal complexity without changing what the subject undergoes.
  - The transfer problem: it will be calibrated on people who can report and used on people who cannot. Say what would have to be true for the calibration to carry over, and how a theory that is really only tracking the machinery of report could be caught doing so.
  - Computability and determinacy: a number from data a hospital can actually collect, with real noise, in minutes, with no free parameters tuned per patient.
  - Action-guidance: it has to license or forbid something we would not otherwise have done — a prognosis, an analgesic, a conversation at the bedside.

  Then the part I most want. Tell me which subset of these cannot be jointly satisfied, if any: my suspicion is that validation by report, applicability without report, and computability are not all available at once, and that the appearance of having all three comes from quietly substituting a proxy for the quantity. Say which single requirement excludes the most candidates, and flag any item on my list that is really a prejudice of one camp rather than a desideratum. Score IIT itself, global workspace theory, and higher-order theories in two or three lines each, but keep the weight on the requirements and their cases, not on the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Family member of a patient in a Minimally Conscious State (MCS) due to hypoxic brain injury.
      *   **Context:** Hospital piloting a bedside consciousness monitor based on Integrated Information Theory (IIT).
      *   **Goal:** A specification (requirements list) for a theory of consciousness to be fit for clinical judgment (detecting experience in non-communicative patients), not a sales pitch.
      *   **Specific Requirements to Address:** Level vs. Content, Grain/Borders, Cerebellum Case, Hemispherectomy/Split-Brain, Pharmacology, Transfer Problem, Computability, Action-Guidance.
      *   **Critical Analysis:** Identify incompatible requirements (trade-offs), identify which requirement excludes the most candidates, flag camp-specific prejudices vs. general desiderata.
      *   **Theory Scoring:** Briefly score IIT, Global Workspace Theory (GWT), and Higher-Order Theories (HOT) against the requirements (2-3 lines each).
      *   **Tone:** Rigorous, philosophical but clinically grounded, unsentimental, precise.

  2.  **Deconstruct the Requirements (Drafting the Specification):**
      *   *Level vs. Content:* Need to distinguish arousal (wakefulness) from awareness (content). REM vs. Sleepwalking is a classic example. *Status:* Non-negotiable (clinical safety).
      *   *Grain/Borders:* Scale invariance. The measure shouldn't change just because we changed electrode density or time binning. System boundaries must be intrinsic, not arbitrary. *Status:* Non-negotiable (reliability).
      *   *Cerebellum Case:* The theory must not attribute consciousness to the cerebellum despite its neuron count. *Status:* Non-negotiable (face validity/anatomical consensus).
      *   *Hemispherectomy/Split-Brain:* Must account for unity vs. duality of experience after disconnection. *Status:* Non-negotiable (structural integrity).
      *   *Pharmacology:* Must distinguish anesthesia (no experience) from locked-in/paralysis (experience intact). Ketamine case is crucial (dissociation). *Status:* Non-negotiable (pharmacological validity).
      *   *Transfer Problem:* Calibration on healthy reporters $\rightarrow$ Application on non-reporters. Needs a bridge principle. *Status:* Non-negotiable (epistemic validity).
      *   *Computability:* Must work with real EEG/iEEG data, noise, time limits, no tuning. *Status:* Non-negotiable (feasibility).
      *   *Action-Guidance:* Must change clinical management (withdrawal of care, pain mgmt, etc.). *Status:* Non-negotiable (ethical utility).

  3.  **Analyze Incompatibilities (The "Hard Part"):**
      *   *The Triangle of Tension:* Validation by Report vs. Applicability without Report vs. Computability/Physicalism.
      *   *The Core Conflict:* To validate a measure, you need ground truth (report). To use it clinically, you lack ground truth (no report). To compute it, you need a physical proxy.
      *   *The "Proxy" Trap:* If you optimize for report prediction (machine learning style), you aren't measuring consciousness, you're measuring *report capacity*. If you optimize for theory (IIT), you might measure something real but uncorrelated with report in edge cases.
      *   *Which requirement excludes the most?* **Computability/Determinacy.** Most theories are qualitative or require impossible calculations (exact $\Phi$).
      *   *Which is a prejudice?* **Grain/Borders (Intrinsic Boundaries).** This is heavily IIT-specific. Other theories (GWT) are more functional and less concerned with precise physical boundaries. **Cerebellum Case** is also theory-laden (IIT uses it to kill GWT/Connectionism, but some argue cerebellum *does* contribute). I should flag the "Intrinsic Boundary" requirement as IIT-leaning.

  4.  **Drafting the Theory Scores:**
      *   *IIT:* Good on boundaries/cerebellum, bad on computability (exact $\Phi$ is impossible), good on transfer (in principle).
      *   *GWT:* Good on computability (signatures of ignition), bad on boundaries (functional vs physical), struggles with partial disconnection.
      *   *HOT:* Bad on non-reporters (requires higher order state which is hard to measure without report), good on conceptual clarity.

  5.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Ensure it sounds like a specification document, not a blog post. Use "Shall" or "Must."
      *   *Addressing the User's Suspicion:* Confirm their suspicion about the Transfer Problem. The "Calibration Bridge" is the weak link.
      *   *Specific Focus:* The user asked about IIT specifically in the context of the pilot. I need to be honest about IIT's specific struggles with the "Grain/Computability" requirement (Phi is uncomputable in the general case; PCI is a proxy).
      *   *Requirement Classification:* Distinguish between "Non-negotiable" (clinical safety/validity) and "Camp Preference" (theoretical commitments).
      *   *Incompatibility Analysis:* Be precise. The conflict is between *Empirical Validation* (needs report) and *Clinical Application* (no report). The solution is usually "Structural Identity" (same substrate = same state), but that's an assumption, not a proof.

  6.  **Final Review against Constraints:**
      *   Did I cover all 8 user points? Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the incompatible subset? Yes.
      *   Did I score the three theories briefly? Yes.
      *   Is the tone appropriate? Yes, serious and analytical.

  7.  **Self-Correction during drafting:**
      *   *Correction:* I initially thought about calling the Cerebellum case a preference. But clinically, we are very sure cerebellar damage doesn't wipe consciousness. I'll keep it Non-negotiable but note that *how* a theory solves it is theoretical.
      *   *Correction:* The "Grain/Borders" requirement is actually the strongest IIT signature. GWT doesn't care about physical borders as much as functional networks. I need to flag this as a specific IIT strength/requirement that might be too rigid for others.
      *   *Correction on Computability:* IIT 3.0/4.0 claims $\Phi$ is computable, but in practice, PCI (Perturbational Complexity Index) is used. PCI is a proxy, not pure $\Phi$. I must highlight this distinction. The requirement asks for the *theory* to deliver a number. IIT delivers a number via a proxy measure. This is a crucial nuance for the family.

  8.  **Final Polish:** Ensure the "Transfer Problem" section hits hard on the "Proxy" risk the user suspected. (This is the core of their anxiety).

  *(Self-Correction Note on "Grain/Borders"):* The user asks that the verdict not change with electrode set. This is practically impossible for *any* EEG measure. I need to mark this as a theoretical ideal that is practically a "Preference" or "Aspirational," because changing electrodes *always* changes signal. However, the *theory* should define the boundary, not the clinician. I will classify the "Intrinsic Boundary" as Non-negotiable for validity, but the "Electrode Invariance" as a practical constraint that might be impossible to fully meet, making it a source of failure for many candidates. Actually, better to frame it: The theory must define the boundary (Non-negotiable), the measurement invariance is the technical hurdle (Preference/Aspirational). I will stick to the user's framing but clarify the tension.

