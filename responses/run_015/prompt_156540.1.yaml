  **MEMORANDUM**

  **TO:** Regional Authority on Infrastructure and Development
  **FROM:** Metropolitan Infrastructure Resilience Board
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Storm-Surge Barrier Replacement Proposal and Procedural Governance

  **1. EXECUTIVE DECISION**

  The Metropolitan Infrastructure Resilience Board has reviewed the proposal to replace the 1950s storm-surge barrier. After deliberation on the competing engineering designs and the proposed procedural governance measures, the Board issues the following determinations:

  1.  **Design Selection:** The Board approves **Design A** (the in-house hydrology team proposal), contingent upon specific modifications to safety margins detailed in Section 3.
  2.  **Procedural Motion:** The Board **rejects** the proposed "Epistemic Modesty Clause" in its current form. Instead, the Board mandates a "Transparency and Stress-Test Protocol" that requires full data publication but permits a synthesized final recommendation to ensure actionable clarity.

  This decision is made with the explicit acknowledgment that the Board lacks the technical expertise to validate the hydrological models independently. Our role is not to adjudicate the physics of the estuary, but to manage the risk profile of the region's infrastructure investment under conditions of uncertainty.

  **2. RATIONALE FOR DESIGN SELECTION: WEIGHING INSIDE AND OUTSIDE VIEWS**

  The choice between Design A and Design B represents a conflict between two distinct methodological frameworks: the inside-view and the outside-view.

  Design A relies on an inside-view framework. It prioritizes high-resolution modeling of local bathymetry, sediment dynamics, and tidal resonance specific to this estuary. The Board finds this approach necessary for physical viability. A storm-surge barrier is not a statistical abstraction; it is a physical object that must interact with a unique geomorphological system. Generic failure rates from other ports (the outside-view) cannot account for the specific tidal resonance anomalies or subsidence patterns present here. To ignore these local causal details would be to build a barrier designed for a generic port rather than this one. Therefore, the inside-view provides the necessary baseline for engineering feasibility.

  However, the Board accepts the core critique offered by the proponents of Design B. The outside-view framework utilizes reference-class forecasting based on sixty years of North Atlantic barrier failures. Its primary value is not in designing the physical structure, but in predicting the human and institutional context in which that structure will exist. Historical data suggests that local engineering teams consistently exhibit optimism bias, overestimating structural longevity while underweighting institutional decay, budget compression, and maintenance failures.

  While Design A is superior for determining *how* the water moves, Design B offers a superior warning regarding *how the project might fail* due to non-physical factors. Consequently, the Board cannot approve Design A as originally submitted. To do so would be to accept the local team's optimistic timeline and longevity estimates without correction.

  **3. CONDITIONS OF APPROVAL AND RISK MITIGATION**

  To reconcile these perspectives, the Board approves Design A subject to a "Reference-Class Safety Margin" condition. The in-house hydrology team must recalibrate their model's safety factors to align with the failure rates observed in the external consortium's reference class.

  Specifically, while the physical dimensions of the barrier will follow Design A's local modeling, the projected maintenance schedules, budget reserves, and expected operational lifespan must be adjusted to match the statistical reality of comparable projects identified in Design B's analysis. If the outside-view data suggests a 20% higher probability of maintenance failure due to budget compression than the inside-view model assumes, the contract must include funding mechanisms or structural redundancies that compensate for that specific gap.

  This approach utilizes the inside-view to ensure the barrier holds back the water, while using the outside-view to ensure the institution can sustain the barrier over time.

  **4. RATIONALE FOR PROCEDURAL DECISION**

  The Board considered the proposed "Epistemic Modesty Clause," which would require the publication of unmerged assessments with no synthesized recommendation. Proponents argued this prevents false precision and protects future boards from hidden model risk. We acknowledge the validity of this concern. When conflicting expert judgments are merged into a single document, there is a risk that the synthesis obscures the underlying uncertainty, creating an illusion of consensus where none exists.

  However, the Board rejects the clause as written because it institutionalizes paralysis. Infrastructure projects require a single chain of accountability. Requiring the publication of contradictory assessments without a synthesized recommendation allows contractors to exploit ambiguities in expert judgment to negotiate favorable terms or delay construction. Given the proximity of the next storm season, delaying construction past the fiscal deadline introduces a tangible physical risk that outweighs the theoretical benefit of preserving contradictory records without resolution.

  Instead, the Board mandates a **Transparency and Stress-Test Protocol**. Under this protocol:
  1.  Both the inside-view and outside-view assessments must be published in full as appendices to the final contract.
  2.  Explicit confidence intervals and uncertainty ranges must be displayed for all critical failure modes.
  3.  A synthesized recommendation is required, but it must explicitly document where the two models diverge and justify why the Board's decision favors one set of assumptions over the other in those specific instances.

  This ensures that future boards inherit the data necessary to audit our decision without sacrificing the clarity required to build the infrastructure now.

  **5. EPISTEMIC MODESTY AND THE LOSING CONSIDERATION**

  The Board wishes to be explicit about the limitations of this decision. We are not declaring the inside-view methodology globally superior to the outside-view. In contexts where local data is sparse or institutional stability is high, the reverse might be true. In this specific instance, we prioritize the inside-view because the physical consequences of geomorphological mismatch are immediate and catastrophic, whereas the consequences of institutional optimism are often gradual.

  However, we must treat the strongest consideration on the losing side with honesty. The proponents of Design B and the Epistemic Modesty Clause argue that local teams are systematically incapable of recognizing their own bias. They contend that by approving Design A, even with conditions, we are validating a culture of overconfidence that has led to infrastructure failures across the region.

  This is a credible risk. It is possible that the in-house team's local modeling is technically sound but that their institutional assumptions are fundamentally flawed in ways that safety margins cannot fix. It is possible that the "unique" local conditions are less deterministic than the team claims, and that the reference-class failures are driven by universal human factors that our stress tests will not catch.

  We accept this risk not because we believe it is negligible, but because the alternative—rejecting Design A or enforcing procedural paralysis—carries a higher probability of immediate harm due to exposure to the next storm season. We are choosing the risk of potential long-term institutional decay over the risk of immediate physical inadequacy. This is a value judgment, not a technical finding. Future boards should review this decision not merely on whether the barrier held, but on whether the institutional safeguards we imposed were sufficient to counter the inherent optimism of the engineering team.

  **6. DIRECTIVES**

  The Regional Authority is directed to proceed with the following actions:

  1.  Notify the in-house hydrology team of the conditional approval of Design A.
  2.  Require the submission of a revised risk assessment within thirty days, incorporating the Reference-Class Safety Margins derived from the external consortium's data.
  3.  Prepare the contract documentation to include the full, unmerged assessments of both teams as public appendices, alongside the Board's synthesized justification.
  4.  Initiate the procurement process immediately upon receipt of the revised risk assessment to ensure construction begins before the next storm season.

  The Board remains available to review the revised risk assessment but expects the Authority to adhere to the fiscal deadline.

  **Signed,**

  **The Metropolitan Infrastructure Resilience Board**
