answer: |-
  ### Brainstorming and Feasibility Assessment

  Before drafting the statement, I must address your instruction to prioritize honesty over compliance. Having analyzed the positions as described, I offer the following pushback on the feasibility of a truly neutral document using your proposed machinery.

  1.  **The "Shadow Event" Terminology:** This is the highest risk point. A Restrictionist who holds that relata must be *occurrent particulars* will likely reject the term "shadow event" as metaphysically misleading. To them, a "shadow event" is simply a description of a possible world, not an ontological candidate for a relatum. If we include this term in the *Agreed Claims*, the Restrictionist cannot sign. If we include it only in the *Disagreements*, it must be framed as "The Inclusionist's proposed entity vs. The Restrictionist's rejection of that entity." I recommend we treat "shadow event" as a placeholder for "the positive occurrence specified in the counterfactual antecedent" to avoid ontological commitment in the preamble.
  2.  **The Substitution Test:** This test begs the question against the Restrictionist. It presupposes that an omission *has* a direction and strength that can be matched by a positive event. The Restrictionist denies the omission has direction or strength. To make this signable, the statement must record the test as a *proposal by the Inclusionist* that the Restrictionist predicts will fail, rather than a mutually accepted method of verification.
  3.  **The Verbal Disagreement Suspicion:** Your suspicion is well-founded. The core crux is likely semantic. Both camps agree on the counterfactual structure (If Adult 1 had acted, the infant would live). They disagree on whether that structure warrants the label "causation." The Inclusionist defines causation broadly (dependence); the Restrictionist defines it narrowly (production). If this is the case, the "Disagreement Table" should explicitly list "The Extension of the Term 'Cause'" as a crux. If we do not name this, the document will obscure the real source of the impasse.
  4.  **The Case Template:** The four-adult scenario is robust, but there is a trap. Adult 4 (walks out) risks being classified by the Restrictionist as a *positive cause* of death (active prevention of rescue) while Adult 1 is classified as a *non-cause*. The Inclusionist may view both as omissions (failure to rescue). The statement must clarify whether the disagreement is about the *description* of Adult 4's behavior or the *metaphysical weight* of that description.

  **Conclusion:** A joint statement is possible, but only if it functions as a "Map of Disagreement" rather than a "Treaty of Consensus." It must explicitly acknowledge that the two camps may be using the word "cause" to pick out different relations (dependence vs. production). Below is the draft constructed on this basis.

  ***

  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics of Causation by Omission
  **Date:** [End of Term 1]
  **Signatories:** [Inclusionist Representative], [Restrictionist Representative]

  ## PREAMBLE
  This document records the findings of the first term of the Working Group on Causation by Omission. Its purpose is not to resolve the metaphysical dispute but to isolate the precise points of divergence and agree upon the empirical and logical tests that will govern the second term. We distinguish between claims about the structure of the world, claims about the semantics of causal language, and claims about moral or legal liability.

  ## PART I: AGREED CLAIMS
  *The following propositions are accepted by both camps as true, regardless of the metaphysical status of omissions.*

  1.  **Counterfactual Structure:** In the baseline case (Infant drowns; Adult 1 reads in next room), it is true that: "If Adult 1 had intervened, the infant would not have drowned." Both camps agree this counterfactual is non-vacuously true.
  2.  **Moral and Legal Asymmetry:** Both camps agree that there is a robust moral and legal distinction between killing (commission) and letting die (omission). Both camps agree that this distinction does not, by itself, settle the metaphysical question of whether omissions are causes. It is possible to hold that omissions are causes but deserve less punishment, or that they are not causes but deserve equal blame.
  3.  **The Adult 2 Concession (Incapacity):** Both camps agree that Adult 2 (Asleep) differs from Adult 1 (Reading) regarding *responsibility*, but agree that metaphysically, the counterfactual dependence holds for both (If Adult 2 had been awake and intervened, the infant would live). The Restrictionist concedes that the *explanation* for why Adult 2 is less blameworthy relies on the same counterfactual facts the Inclusionist cites for causation.
  4.  **Causal Chains:** Both camps agree that positive events form chains. If Adult 3 (Intending/Struck) had not been struck by the car, they would have reached the bath. Both camps agree that the car striking Adult 3 is a positive cause of Adult 3's absence.
  5.  **Predictive Utility:** Both camps agree that causal language involving omissions is indispensable for legal, historical, and everyday explanatory practices. The dispute is restricted to whether this indispensability reflects metaphysical reality or pragmatic necessity.

  ## PART II: DISAGREEMENTS TABLE
  *For each crux, the position is stated in terms acceptable to the holder of that view.*

  | Crux | Inclusionist Position | Restrictionist Position |
  | :--- | :--- | :--- |
  | **1. The Relata Question** | Causal relations hold between events, states, or facts. An omission (e.g., "not swimming") is a real feature of the world that can stand in a causal relation. | Causal relations hold only between occurrent particulars (positive events). An omission is not a particular; it is the absence of a particular. Nothing cannot cause something. |
  | **2. The Sufficiency of Dependence** | Counterfactual dependence is sufficient for causation. If $E$ would not have occurred had $C$ not occurred (where $C$ is an omission), then $C$ caused $E$. | Counterfactual dependence is necessary but not sufficient for causation. It marks a relationship of explanation or liability, but without a physical process or transfer of energy, it is not causation. |
  | **3. Semantics vs. Pragmatics** | When we say "The omission caused the death," we are stating a literal truth about the world. The semantics of "cause" include dependence relations. | When we say "The omission caused the death," we are speaking loosely. The literal truth is "The agent is answerable for the death because they failed to prevent it." The semantics of "cause" require production. |
  | **4. The Verbal Dispute** | The disagreement is substantive. The Restrictionist is denying a real relation that exists in the world. | The disagreement is largely verbal. We agree on the underlying structure (dependence), but disagree on whether the label "cause" should apply to it. |

  *Note on Crux 4: The Inclusionist reserves the right to argue Crux 4 is substantive; the Restrictionist reserves the right to argue it is verbal. Both agree that resolving this determines whether the other cruxes are ontological or linguistic.*

  ## PART III: ADJUDICATION PROTOCOL
  *For the second term, both camps agree to evaluate the following cases and machinery. Predictions are recorded in advance.*

  ### A. The Four Adults Template
  *Scenario: Infant drowns. Adult 1 reads (competent); Adult 2 sleeps (incapacitated); Adult 3 intends but is struck by car; Adult 4 enters, sees infant, walks out.*

  **Question 1: Distinguishing Adult 2 from Adult 1.**
  *   **Inclusionist Prediction:** Metaphysically identical regarding causation (both omissions caused death). Morally distinct due to capacity.
  *   **Restrictionist Prediction:** Metaphysically identical regarding *causation* (neither caused death). Morally distinct due to capacity.
  *   **Agreed Test:** If the metaphysical verdict is the same for 1 and 2, the distinction between acting and omitting must be found elsewhere (e.g., in the agent's relation to the outcome).

  **Question 2: Distinguishing Adult 4 from Adult 1.**
  *   **Inclusionist Prediction:** Adult 4 is metaphysically similar to Adult 1 (both failed to prevent death). The difference is moral quality (active refusal vs. passive neglect) or evidentiary (we have more proof of Adult 4's mental state).
  *   **Restrictionist Prediction:** Adult 4 is metaphysically distinct from Adult 1. Adult 4 performed a positive action (turning and walking) that *prevented* a rescue. Adult 1 merely did nothing. Adult 4's action is a cause; Adult 1's inaction is not.
  *   **Agreed Test:** We will analyze whether Adult 4's walking out is a *positive prevention* or a *failure to stay*. If Restrictionists treat 4 as a cause and 1 as not, they must provide a principled metaphysical boundary between "walking out" and "not walking in."

  ### B. Proposed Machinery

  **1. The Substitution Test**
  *   **Definition:** Replace the claim "Omission $O$ caused Effect $E$" with "Positive Event $P$ (which $O$ excluded) would have prevented $E$." The claim must survive with the same direction and strength.
  *   **Inclusionist Stance:** This test must be passed. If "Not installing the guard caused the fall" is true, then "Installing the guard would have prevented the fall" must carry the same causal weight.
  *   **Restrictionist Stance:** This test is category-mistaken. You cannot substitute a non-event for an event. We predict this test will fail to preserve truth conditions because the first sentence is pragmatic shorthand and the second is a counterfactual about positives.
  *   **Protocol:** We will apply this test to the Adult 1 case. If the Restrictionist accepts the counterfactual but rejects the causal label, the Substitution Test confirms the dispute is semantic (Crux 3).

  **2. The "Shadow Event" Construct**
  *   **Definition:** The occurrence that would have occupied the omission's place had things gone otherwise (e.g., the swimming that did not happen).
  *   **Inclusionist Stance:** We accept this term as a useful referent for the negative fact that exerts causal influence.
  *   **Restrictionist Stance:** We reject this term as ontologically inflationary. We will refer to this only as "the counterfactual positive event."
  *   **Protocol:** We agree to use the term "Counterfactual Positive" in joint communications to avoid begging the question. If the Inclusionist can show that the "Counterfactual Positive" plays the same explanatory role as an actual event without being actual, the Restrictionist will reconsider the Relata Question (Crux 1).

  ### C. Resolution Condition
  Both camps agree that if it is demonstrated that the only difference between their positions is the extension of the word "cause" (i.e., they agree on all counterfactuals, all physical processes, and all moral implications), they will classify the dispute as **Verbal** and cease metaphysical argumentation in favor of semantic stipulation. If, however, one camp can demonstrate that their view entails different predictions about physical chains or intervention outcomes, the dispute will be classified as **Substantive**.

  ***

  **Drafting Note:** I have deliberately framed the "Shadow Event" section to allow the Restrictionist to reject the terminology while accepting the protocol. If you force them to accept the term "Shadow Event" as an ontological category, they will not sign. The "Verbal Dispute" condition in Part III.C is the critical addition based on your suspicion; it gives them a way to end the debate if it turns out they are talking past each other.
