answer: |-
  Below is an assessment of the Authority View of promising as you have formulated it. I have ranked the defeaters from those that threaten to undermine the theory's core coherence (Fatal) to those that require uncomfortable qualifications (Awkward). In each section, I distinguish between the **Critic's Allegation** (the offensive argument) and the **Defender's Concession** (what a proponent must admit weakens the view's elegance or scope).

  ### I. Fatal Defeaters: Getting the Point of the Practice Wrong

  These arguments target your specific preference: they aim to show that the *function* of promising is not the transfer of standing, but something else (e.g., security, coordination, or assurance). If the function is misidentified, the Authority View describes a different practice entirely.

  **1. The Argument from Security and Assurance (The Scanlon/Shiffrin Challenge)**
  *   **Critic's Allegation:** The Authority View claims the value of promising is the transfer of normative control (standing to demand/release). However, the actual point of the practice is to provide *assurance* to facilitate reliance. We promise because others need to know what we will do to coordinate their lives. By making the obligation depend on the promisee's standing rather than the promisee's need for security, the Authority View inverts the moral landscape. It makes the promisee's authority the master, rather than the promisee's welfare or the joint cooperative good. If the point is assurance, then expectations are not byproducts; they are the *goal*.
  *   **Defender's Concession:** You must concede that if the primary moral urgency of promising is to prevent the harm of disappointed reliance or to enable cooperation, then the "standing to demand" is merely a *mechanism* to secure that end, not the end itself. If the mechanism fails (e.g., in cases where reliance is impossible but the promise remains), the view must explain why the mechanism persists without its function. If you cannot explain why we care about the standing other than for the sake of the reliance it secures, the view collapses into a sophisticated expectation-based account.

  **2. The Argument from Unwanted Obligations (The "Declined Promise")**
  *   **Critic's Allegation:** You state the promisee gains the standing to release the promisor. But consider a case where I announce, "I promise to mow your lawn," and you reply, "I do not want this; I forbid you from undertaking this obligation." On the Authority View, I have exercised a power to bind myself to you. But if you reject the standing, does the obligation exist? If yes, then your "gift" of authority is coercive; you are burdened with the standing to manage my conduct against your will. If no, then my power to bind myself is not unilateral; it requires your acceptance. If it requires acceptance, the "normative power" is not over *myself*, but over *us*, which relies on a convention we both uphold (returning to a practice view).
  *   **Defender's Concession:** You must concede that the "power" is not purely unilateral. You likely need to add a condition that the promisee must accept the standing (even tacitly). This complicates the "exercise of power over oneself" formulation. It implies the obligation is constituted by a micro-contract of authority, not a sovereign act of the promisor. This blurs the line between promising and contracting.

  ### II. Serious Defeaters: The Boundary Cases

  These cases test whether the "standing to demand" is a necessary condition of promising. If promises exist where standing cannot, the definition is too narrow.

  **3. Promises to the Dead, Infants, and Non-Sentient Collectives**
  *   **Critic's Allegation:** We intuitively speak of promising a dying parent to care for their pet, or promising an infant to love them. The dead cannot hold standing; they cannot demand or release. Infants lack the normative competence to wield authority. A "collective agent with no mind" (e.g., "I promise the University") cannot form expectations or exercise release without human proxies. If the Authority View says these are not promises (because no one holds the standing), it contradicts deep moral intuitions. If it says they *are* promises, it must posit "virtual" standing, which looks like a fiction invented to save the theory.
  *   **Defender's Concession:** You must concede that these are not paradigmatic promises. You likely have to categorize them as "fidelity obligations" or "quasi-promises" that mimic the structure of promising without the full normative architecture. This is a genuine cost: it shrinks the explanatory scope of the theory. You must admit that the *core* concept of promising requires a competent promisee, and other cases are derivative. If the derivative cases are morally weightier (e.g., a deathbed promise), the theory struggles to explain why a "defective" promise generates such strong obligations.

  **4. The Waiver Problem**
  *   **Critic's Allegation:** If the obligation is constituted by the promisee's standing to demand, what happens when they waive it? On some contracts, waiving a right extinguishes the duty. On your view, if I promise to meet you for lunch, and you text "Don't bother, I release you," the obligation vanishes. But consider a promise where the performance is a good *for the promisee* that they might irrationally waive (e.g., "I promise to stop you from drinking"). If they release you, do you still owe it? If the Authority View says "No, they released you," it seems to get the morality wrong (you should still stop them). If it says "Yes, the obligation remains," then the standing to release was not actually sovereign, and the "power" account is false.
  *   **Defender's Concession:** You must concede that the power to release is not absolute. It is constrained by the *reasons* for the promise. This suggests the obligation is not grounded *solely* in the transfer of authority, but in the underlying value of the performance, with the authority being a procedural layer on top. This weakens the claim that the practice is *worth having* primarily for the transfer of standing.

  ### III. Conceptual Defeaters: The Mechanism of Power

  These arguments question whether "normative power" does any explanatory work or merely labels the phenomenon.

  **5. The Indistinguishability from Vows and Resolutions**
  *   **Critic's Allegation:** You claim promising is exercising a normative power over oneself to owe *another*. But a vow is exercising a normative power over oneself to owe *God* or *one's ideals*. A resolution is owing it to *future self*. What distinguishes the "normative power" in promising from the "normative power" in a vow, other than the target? If the answer is just "the target is another person," the theory is thin. Furthermore, if I simply announce, "I now have a weighty reason to do X," I have altered the space of reasons. Why is that not a promise? If the answer is "because I didn't give you standing," how do we observe this standing other than by the fact that I promised? The concept risks circularity.
  *   **Defender's Concession:** You must concede that the distinction relies heavily on social convention. The "power" is not a metaphysical magic; it is a status recognized by a community. This moves the view closer to a Practice View (like Rawls's), where the power exists *because* we follow rules that generate expectations. You must admit that the "normative power" is not a pre-social faculty but a social status.

  **6. The "Empty Power" Objection**
  *   **Critic's Allegation:** To say "I have a normative power to bind myself" is just to say "I can create an obligation." It does not explain *how*. If the mechanism is "I intend to be bound," why does that intention succeed? Usually, intentions cannot create obligations ex nihilo. If the answer is "because society recognizes this intention," then society's recognition (and the expectations it generates) is the real ground, not the power.
  *   **Defender's Concession:** You must concede that the "power" is not a brute fact. It depends on a background of normative practices that make such powers intelligible. This does not kill the view, but it prevents it from being a "first principle" account. It is dependent on the existence of a community that recognizes such powers.

  ### IV. Empirical Defeaters: Psychology and Anthropology

  These arguments rely on data about how promising actually functions in human minds and societies.

  **7. Developmental Evidence (Children as Predictors)**
  *   **Critic's Allegation:** Developmental psychology suggests children first understand promises as predictions ("I will do X") and only later grasp the normative constraint ("I *must* do X"). If the Authority View were correct, we might expect children to grasp the "authority transfer" early. Instead, they grasp the reliability aspect first. This suggests expectation is the foundational layer, and authority is a sophisticated later addition.
  *   **Defender's Concession:** You must concede that the *concept* of promising may be grasped gradually. However, you can maintain that the *nature* of the practice is normative, even if children misunderstand it initially (just as children misunderstand gravity before understanding physics). The genuine evidence against you would be if adults in mature moral reasoning *also* treat promises primarily as predictions. If adults say, "I broke my promise, but I told you I'd do it, so you shouldn't be mad," the Authority View is in trouble.

  **8. Anthropological Evidence (Practices without Release)**
  *   **Critic's Allegation:** If you discovered a functioning culture where promises create strict obligations, nonperformance is treated as a distinctive wrong, but *no mechanism for release by the promisee exists* (perhaps obligations are viewed as cosmic or divine once uttered), your view would be falsified. The "standing to release" would be shown to be culturally contingent, not essential.
  *   **Defender's Concession:** You must concede that if such a practice exists and is rightly called "promising," then the power to release is not essential to the concept. You would have to relegate your view to "Western, autonomy-focused promising." This limits the universality of the theory.

  ### V. Methodological Assessment: Insulation and Falsifiability

  Finally, you asked whether stating the view in terms of "normative power" insulates it against testing, and whether that is a defect.

  **The Insulation Charge**
  *   **Critic's Allegation:** By defining promising as the exercise of a "normative power," you have insulated the view from empirical refutation. If people say they don't feel they have such power, you can say they are mistaken about the norms. If anthropologists find no release mechanisms, you can say it's not "true" promising. This makes the theory unfalsifiable and therefore empty. It defines the phenomenon into existence rather than explaining it.
  *   **Defender's Concession:** It is true that conceptual analysis is not falsifiable by empirical data in the same way a scientific hypothesis is. However, it is not insulated from *phenomenological* falsification. If the "lived experience" of promising for almost all agents is one of creating expectations rather than transferring authority, the theory fails to capture the phenomenon it claims to analyze.
  *   **Assessment:** Is this a defect?
      *   **Yes,** if the goal is to explain the *social function* of promising. A theory of a social practice must account for how the practice is actually understood and used by its participants. If the "normative power" is invisible to the participants, it is a philosopher's fiction.
      *   **No,** if the goal is *normative justification*. You are not asking "What do people think they are doing?" but "What justifies the obligation?" It is possible that people think they are creating expectations, but the *moral truth* is that they are transferring authority.
      *   **Verdict:** The insulation is a defect *only if* the theory claims to be descriptive. Since your formulation ("what makes the practice worth having") is justificatory, the insulation is expected. However, the risk is that the justification becomes untethered from human psychology. If the "power" is something humans cannot psychologically grasp or exercise, it cannot be the ground of a human practice.

  ### Summary of Predictions

  To close, here is what your view predicts that rivals do not, which serves as your best defense:

  1.  **The Nature of Resentment:** Rivals predict the promisee feels *disappointment* or *harm*. Your view predicts the promisee feels *disrespected* or *usurped*. The wrong is not the outcome, but the violation of their authority.
  2.  **The Value of Release:** Rivals struggle to explain why a promisee can *waive* the obligation without the promisor performing. (If the ground is reliance, why does reliance no longer matter?). Your view predicts this perfectly: the obligation belongs to the promisee, so they can discard it.
  3.  **The Wrong of Coercive Promising:** Your view predicts that forcing someone to accept a promise (where they do not want the standing) is morally problematic in a way expectation views miss, because it burdens them with normative management they didn't seek.

  **Final Honest Assessment:**
  The Authority View is robust against cases where reliance is absent but obligation remains (e.g., secret promises). However, it is vulnerable to the charge that it mistakes a *feature* of promising (the ability to release) for its *foundation*. The most persuasive argument against you is not a counter-example, but the claim that the "standing to demand" is a *consequence* of the assurance given, not the *source* of the obligation. If you can show that the assurance itself depends on the prior existence of the authority (i.e., "I can only assure you because I have given you authority"), you survive. If the authority is merely the legalistic shell around the assurance, the view is elegant but secondary.
