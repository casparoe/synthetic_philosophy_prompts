  **MEMORANDUM**
  **To:** Committee on Nonhuman Subjects
  **From:** Independent Drafter
  **Re:** Consistency Note: Application 2024/09

  **1. Compatible Rules**
  Three regulatory rules accommodate precedents 2019/14 through 2022/11 equally well. First, a Species Rule: moral side constraints apply exclusively to *Homo sapiens*. This permits 2024/09. Second, a Utilitarian Rule: protection scales strictly with suffering capacity, never vetoing research where benefits outweigh burdens. This also permits 2024/09. Third, a Capacity Rule: side constraints apply to any being capable of autonomous refusal. This protects the enhanced chimpanzees. While the first two fit the historical data, only the third aligns with the Chair's stated Nozickian philosophy, which grounds rights in autonomy and the prohibition on using agents as mere means, rather than biological accident. Precedents 1–3 involved beings incapable of refusal; Precedent 4 involved beings who lost capacity but retained status. The Capacity Rule resolves the tension by focusing on the current ability to consent.

  **2. Recommended Decision**
  The Committee should reject 2024/09. Although 2020/07 approved terminal work on ordinary chimpanzees, those subjects lacked symbolic communication and the capacity to refuse consent. The distinction lies not in species, but in the relevant moral property: autonomy. The current subjects possess the specific capacity—autonomous refusal—that triggers Nozickian side constraints. To proceed without asking consent treats them as mere means to epistemic ends. The closest analog is 2022/11 (adults with advanced dementia). In that case, proxy consent was insufficient to override the subject's protected status against burdensome, non-beneficial use. Here, the subjects' functional status exceeds that of the dementia patients; if humans lacking capacity are protected from being used as mere means, beings functioning as persons certainly are. The epistemic gain cannot override the side constraint.

  **3. Adopted Principle**
  Whichever way the Committee votes, it will adopt a definitive principle defining moral personhood. Approval establishes that species membership is the sole criterion for side constraints, rendering cognitive enhancement morally irrelevant and permitting the instrumentalisation of person-capable non-humans. Rejection establishes that the capacity for autonomous refusal determines moral status, irrespective of genetic lineage. This shifts the Committee from a biological registry to a moral arbiter of agency, setting a precedent for future germline constructs or artificial intelligences.

  **4. Further Case for Written Reasons**
  To separate the surviving Species and Capacity rules, the written reasons must explicitly adjudicate a hypothetical case: a human being with permanent, profound cognitive incapacity versus a non-human entity with full linguistic competence. The Committee must state whether the human retains protection solely via species or if the non-human acquires it via capacity. This forces a clear demarcation between biological classification and moral agency. By ruling on this hypothetical within the justification for 2024/09, the Committee prevents future ambiguity regarding enhanced animals or diminished humans, ensuring the chosen rule is robust enough to handle edge cases where biology and capacity diverge.
