  **DEPARTMENT OF BIOLOGICAL CLASSIFICATION & ETHICS**
  **CORTICAL SUFFICIENCY (MORAL STATUS) GUIDANCE — 3RD EDITION**
  **REF: CBC-2074-MS**

  **1.0 DETERMINATION OF CLASS I STATUS**
  1.1 Moral standing is allocated based on the Total Functional Neuron Count (TFNC) verified via high-resolution volumetric scan.
  1.2 Entity classification is binary. Class I (Person) requires a verified TFNC of ≥15.0 billion active synaptic units.
  1.3 Entities scoring <15.0 billion are classified as Class II (Dependent/Asset). Protections for Class II entities are limited to pain-response mitigation and property law statutes.

  **2.0 METRIC JUSTIFICATION**
  2.1 TFNC was selected over cranial volume or encephalization quotient to accommodate non-standard morphologies (e.g., avian, cetacean, synthetic).
  2.2 Structural density is not penalised. An entity with a cranial volume of 300cm³ possessing 15.0 billion neurons meets the threshold identically to an entity with 1200cm³.
  2.3 Temporary fluctuations due to pathology, development, or metabolic state are not exempt. Status is assessed at the time of adjudication.

  **3.0 WORKED EXAMPLE**
  *   **Subject A:** *Homo sapiens*, age 6 months. TFNC: 11.5 billion. **Classification:** Class II.
  *   **Subject B:** *Homo sapiens*, age 75, late-stage neurodegenerative pathology. TFNC: 9.2 billion. **Classification:** Class II.
  *   **Subject C:** *Psittacus engineered*, variant 'Logos'. TFNC: 16.8 billion. **Classification:** Class I.

  *Note: Subject A and B are eligible for guardianship assignment. Subject C is eligible for voting registration and tax liability.*

  **4.0 RE-CLASSIFICATION PROTOCOLS**
  4.1 Humans developing from Class II to Class I (maturation) require no action.
  4.2 Humans regressing from Class I to Class II (trauma/dementia) must be reported to the Registry within 30 days. Guardianship transfers to the state or next of kin.
  4.3 Class I non-humans are subject to income tax. Biological maintenance costs are not tax-deductible.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Does this apply to comatose patients?**
  A: Yes. If metabolic activity drops below the TFNC threshold, status is suspended.

  **Q: What if a Class I parrot is eaten by a Class II cat?**
  A: This is recorded as Homicide (Section 4). The cat's owner is liable.

  **Q: Can a Class II human be sold?**
  A: Class II humans are Wards of the State. Transfer of guardianship requires Form 88-B. Commercial exchange is prohibited, though service contracts are permitted.¹

  **Q: Why is the threshold 15 billion?**
  A: This represents the administrative break-even point for pension eligibility.

  ***

  ¹ *Retrospective reclassification of existing dependents does not constitute grounds for compensation claims regarding prior care costs.*
