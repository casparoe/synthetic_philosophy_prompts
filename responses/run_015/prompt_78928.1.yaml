answer: |-
  ## The Cross-Modal Transfer Assessment Protocol (CTAP)

  **Purpose:** To determine whether a capability existing in a user's intact sense can be assumed to transfer to a new sensory channel (restoration/substitution) without explicit training, or whether explicit training scaffolding is required.
  **Participants:** Lead Engineer, Lead Clinician, Product Manager.
  **Time:** 60 Minutes.
  **Output:** A signed decision: *Assume Transfer*, *Require Training*, or *Pilot Test*.

  ---

  ### Part 1: Task Decomposition (10 Minutes)
  *Do not discuss the device yet. Discuss the user's goal.*

  **Q1.1: What is the specific behavioral endpoint?**
  Select exactly one:
  *   **A. Discrimination:** Can the user tell that Signal X is different from Signal Y? (e.g., "Something changed.")
  *   **B. Identification:** Can the user label the source? (e.g., "That is a cup," "That is anger.")
  *   **C. Guided Action:** Can the user interact with the source? (e.g., "Reach for the cup," "Turn toward the door.")

  > **Rule:** If you select **A**, proceed to Part 2. If **B** or **C**, you must pass Part 2 *and* Part 3 to assume transfer. Action and Identification almost always require more calibration than Discrimination.

  **Q1.2: Is the skill already proven in the intact sense?**
  *   **Yes:** The user can do this reliably with their natural sense (e.g., a blind user knows what a door is via sound/touch).
  *   **No:** The user is learning the concept *and* the sense simultaneously.
  > **Stop:** If **No**, you must **Require Training**. This protocol only assesses *transfer*, not new learning.

  ---

  ### Part 2: Property Analysis (15 Minutes)
  *Analyze the information being conveyed, not the device.*

  **Q2.1: Is the property "Amodal"?**
  An amodal property is one that exists independently of the sense used to detect it.
  *   **Amodal Examples:** Spatial location (left/right), Number (one vs. two), Timing (fast vs. slow), Motion direction.
  *   **Modality-Specific Examples:** Color, Texture grain, Pitch, Visual edge contrast, Facial muscle configuration.
  *   **Question:** Is the core information amodal?
      *   **Yes:** High probability of transfer.
      *   **No:** Low probability of transfer.

  **Q2.2: Is the property "Atomic" or "Configural"?**
  *   **Atomic:** A single signal dimension (e.g., "Vibration intensity" = "Distance").
  *   **Configural:** A pattern requiring synthesis (e.g., "This specific arrangement of edges" = "Cup").
  > **Rule:** If **Configural**, you cannot assume transfer. The brain must learn to bind the new signals into that configuration. Mark for **Training**.

  ---

  ### Part 3: Signal Mapping & Calibration (20 Minutes)
  *Analyze the device's output relative to the world.*

  **Q3.1: Is the mapping Isomorphic?**
  *   **Isomorphic:** The spatial/temporal structure of the signal matches the world 1:1. (e.g., A motor vibrates on the left hip when an object is on the left).
  *   **Coded/Arbitrary:** The signal requires decoding. (e.g., A specific vibration *pattern* means "smile," or phosphenes in the visual cortex do not map neatly to retinal pixels).
  > **Rule:** If **Coded**, you must **Require Training**. The user cannot intuit the code.

  **Q3.2: The Calibration Question (The "Friend's Test")**
  Even if the mapping is Isomorphic and the property is Amodal, the new signal must be aligned with the old concept.
  *   **Question:** Can the user align the new signal with their existing mental map in under 5 minutes of passive exposure?
  *   **Test:** Imagine the user stands still. The device activates. Does the user immediately know *where* to look/reach, or do they have to hunt to find the correlation?
      *   **Immediate:** Proceed to Decision.
      *   **Requires Hunting:** This is a **Calibration Burden**.

  ---

  ### Part 4: The Decision Matrix (10 Minutes)
  *Combine the answers. One "Low Probability" or "Require Training" flag triggers a training requirement.*

  | Q1 (Task) | Q2 (Property) | Q3 (Mapping) | **Decision** |
  | :--- | :--- | :--- | :--- |
  | Discrimination | Amodal | Isomorphic | **Assume Transfer** (No training module needed) |
  | Identification / Action | Amodal | Isomorphic | **Calibration Only** (Verify alignment, do not teach concepts) |
  | Any | Modality-Specific | Any | **Require Training** (Concept must be relearned in new channel) |
  | Any | Configural | Any | **Require Training** (Pattern recognition must be built) |
  | Any | Any | Coded | **Require Training** (Code must be memorized) |

  **The Values Check (Medical Director Sign-off):**
  If the decision is **Require Training**, estimate the hours.
  *   If < 5 hours: Proceed.
  *   If > 5 hours: Is this burden acceptable to the user population?
      *   **Yes:** Proceed.
      *   **No:** Return to Engineering to improve Isomorphism (Q3.1). This is a design flaw, not a user deficit.

  ---

  ### Part 5: The Pilot Test Trigger (5 Minutes)
  *When the checklist is inconclusive.*

  **Run two 90-minute user sessions IF:**
  1.  The property is Amodal (Q2.1 = Yes) BUT the Mapping is imperfect (e.g., low resolution).
  2.  The team disagrees on Q3.2 (Calibration).
  3.  The cost of being wrong is high (safety risk) but the cost of training is also high (user churn).

  **Protocol for Sessions:**
  *   **Session 1:** Zero instruction. Give the device. Ask them to perform the task. Measure success rate.
  *   **Session 2:** Provide minimal calibration ("When this vibrates, the object is here"). Measure improvement.
  *   **Criterion:** If Session 1 success is < 60% but Session 2 is > 90%, the issue was **Calibration**, not Concept. If both are low, the issue is **Transfer**.

  ---

  ## Application of CTAP to Current Roadmap

  Here is the procedure run on your three specific cases.

  ### Case 1: Haptic Belt for Doorway Orientation
  *   **Task:** Guided Action (Turn toward doorway).
  *   **Property:** Spatial Location (Amodal).
  *   **Mapping:** Isomorphic (Motor on left = Door on left).
  *   **Calibration:** High. The body schema aligns naturally with the belt.
  *   **CTAP Result:** **Calibration Only.**
  *   **Analysis:** Your team likely builds a "training module" for this. The procedure indicates this is waste. The user knows what "left" is. They only need to trust the belt.
  *   **Action:** Remove the tutorial level. Add a 2-minute "calibration mode" where the user turns to match the vibration, then disable.
  *   **Contradiction:** This contradicts a "safety first" instinct to over-train. The procedure says: *Trust the amodal transfer.*

  ### Case 2: Retinal Prosthesis for Picking a Cup from Clutter
  *   **Task:** Guided Action / Identification (Pick the cup).
  *   **Property:** Object Boundary / Shape (Modality-Specific Visual Features).
  *   **Mapping:** Imperfect/Configural. Phosphenes do not create clean edges; "cupness" relies on contrast and shading which the prosthesis simplifies.
  *   **Calibration:** Low. The visual signal does not match the tactile memory of a cup.
  *   **CTAP Result:** **Require Training.**
  *   **Analysis:** This contradicts your original intuition in the argument ("Cubeness is one property, met twice"). It does not transfer. The *concept* of a cup exists, but the *visual access key* is missing. The user cannot match the phosphene blob to the tactile "cup" concept without learning what that specific blob means in this context.
  *   **Action:** Build explicit scaffolding. Do not ship expecting immediate utility.
  *   **Contradiction:** This contradicts the "Rationalist" view (your view in the argument). Concepts do not unlock automatically; the perceptual features must be re-learned.

  ### Case 3: Vibrotactile Display for Facial Expression
  *   **Task:** Identification (Read emotion).
  *   **Property:** Facial Muscle Configuration (Modality-Specific).
  *   **Mapping:** Coded/Arbitrary. A vibration pattern on the wrist represents a smile. There is no natural "feel" of a smile on the wrist.
  *   **Calibration:** None possible without learning the code.
  *   **CTAP Result:** **Require Training.**
  *   **Analysis:** This is pure language learning. There is no amodal property to latch onto.
  *   **Action:** Treat this as learning a new vocabulary, not a sensory restoration. Gamify the training; do not market as "intuitive."
  *   **Contradiction:** If marketing claims "Feel their emotion," this procedure flags it as false.

  ---

  ## Limitations and Failure Modes

  I owe you honesty about where this procedure will misfire.

  **1. The "Amodal" Trap**
  The procedure assumes "Space" is amodal. For a blind user, "Space" is often constructed via echo-location or cane sweeps (time-delay based). For a sighted user regaining vision, "Space" is retinal disparity. These are different *constructions* of space. The procedure may flag a spatial task as "Transferable" when the underlying definition of space differs between the senses.
  *   *Risk:* You assume transfer on a spatial task, but the user fails because their "left" is temporal, and your device is spatial.
  *   *Mitigation:* If a spatial task fails the Pilot Test (Part 5), reclassify the property as Modality-Specific.

  **2. The Plasticity Window**
  The procedure assumes a static user. In reality, the "newly sighted" or "newly hearing" brain changes rapidly. A decision made in Month 1 (Require Training) might be obsolete in Month 3 (Transfer achieved via neuroplasticity).
  *   *Risk:* You build training software that becomes unnecessary, or you fail to build it when the brain was ready to learn it quickly.
  *   *Mitigation:* Re-run CTAP at the 3-month post-implant mark.

  **3. The Values Blind Spot**
  The procedure identifies *when* to train, but it cannot tell you *if you should*. You may find that a capability requires 50 hours of training (CTAP says "Require Training"). The procedure hands this to the Medical Director as a "Values" call. It cannot solve the ethical dilemma of imposing a burden versus denying a capability.
  *   *Risk:* The procedure gives a "Go" on a feature that is technically trainable but ethically burdensome.
  *   *Mitigation:* The Medical Director must apply a "Quality of Life" weight to the Training Hours. If Hours > Expected Benefit, kill the feature.

  **4. The Calibration Illusion**
  Your friend used the word "calibration." The procedure treats calibration as a binary (Is it needed? Yes/No). In reality, calibration is a continuous drift. A device might work Day 1 and fail Day 30 as the user's skin sensitivity changes or the implant shifts.
  *   *Risk:* You ship with "Calibration Only" status, assuming it's a one-time setup. It becomes a recurring maintenance burden.
  *   *Mitigation:* Engineering must build "re-calibration" checks into the daily startup routine for any device flagged as "Calibration Only."

  ### Final Recommendation
  Your disagreement with your friend was not about facts; it was about *levels of processing*. You were right that the *concept* exists (the cube is known). Your friend was right that the *access* is blocked (the visual signal is uncalibrated).

  Use this procedure to separate **Concept** (Part 1) from **Access** (Part 2 & 3). If the Concept is present but Access is blocked, do not teach the Concept. Teach the Access. That distinction alone will save you months of engineering the wrong training modules.
