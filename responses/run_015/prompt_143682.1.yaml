answer: |-
  The OpenAudit Consortium governs a distributed ledger where developers stake reputation to verify code security, earning contracts proportional to validated contributions. To mitigate free-riding, where actors submit rushed code to harvest contracts without maintaining standards, the Consortium mandates pre-access signaling. Under Condition H, contributors must execute a 'proof-of-waste' script that consumes local electricity and processing power equivalent to the estimated value of contracts they seek, destroying this value without advancing the network. Under Condition I, contributors submit to a standardized pupillometry and galvanic skin response test during onboarding, which historical consortium data correlates strongly with sustained intrinsic motivation to maintain code quality, granting immediate access without resource expenditure. In both cases, failure to comply results in exclusion from the token economy, while successful signaling grants access to the shared verification pool where cooperative behavior yields long-term contractual stability.

  (1) **Verdict:** The handicap principle predicts stable cooperation in Condition H because the wasteful cost ensures only high-value cooperators can afford to signal; it predicts unstable cooperation in Condition I because, absent a differential cost, low-quality actors have no economic barrier to mimicking the signal.

  (2) **Structural Feature:** The distinguishing feature is **physical unforgeability (indexicality)**; in Condition I, the signal is physiologically constrained such that low-motivation types physically cannot produce it, whereas in Condition H, they *can* produce it but are deterred by the cost.

  (3) **Removal Effect:** If physical unforgeability is removed (e.g., the biometric correlation breaks or can be tricked), low-motivation types can mimic the signal without penalty, leading to signal inflation and the collapse of cooperative norms.

  (4) **Defense & Failure:** A defender might argue the biometric test incurs hidden costs like privacy loss or anxiety. This fails because the scenario constraints explicitly stipulate "no resource expenditure," and even if minor costs existed, they are not *differential* (equally burdensome to all types), which is required for a handicap to function.

  (5) **Conclusion:** Yes, removing the indexical feature collapses the case back into a standard economic signaling model where differential cost alone must guarantee honesty to prevent pooling equilibria.
