answer: |-
  This is a strategically sound move. Much of the species debate is indeed a series of cross-purpose arguments where proponents of the Biological Species Concept (BSC) are optimizing for *process* (cohesion), while proponents of the Phylogenetic Species Concept (PSC) are optimizing for *pattern* (diagnosability), and both claim to be describing the same natural unit. By establishing the desiderata first, you expose the trade-offs inherent in the job description itself.

  Below is a draft of the desiderata for an adequate species concept, categorized by their domain (Empirical, Operational, Ontological), followed by an analysis of which are binding and which are negotiable, and finally an identification of the incompatibilities that generate the "species problem."

  ### I. The Desiderata: A Job Description for Species

  #### 1. Empirical Scope (The Coverage Requirement)
  *   **The Requirement:** The concept must apply to the full diversity of reproductive and population systems found in nature.
  *   **The Motivating Case:** Any concept tied strictly to sexual reproduction (like the BSC) renders the taxonomy of bdelloid rotifers, bacteria, and many fungi arbitrary or impossible. Conversely, a concept based strictly on monophyly struggles with hybridizing plant complexes or ring species (e.g., *Ensatina* salamanders) where gene flow is local but not global. If a concept forces us to say a clearly distinct asexual lineage is "not a species," or that a hybridizing swarm is "one species" despite ecological distinctness, it fails to map onto biological reality.
  *   **Specific Constraint:** Must accommodate **reticulate evolution** (hybridization/introgression) without collapsing distinct lineages, and **asexual lineages** without inventing fictitious reproductive barriers.

  #### 2. Operational Diagnosability (The Taxonomist Requirement)
  *   **The Requirement:** The criteria for species membership must be decidable based on available evidence (specimens, sequences, or ecological data) without requiring impossible knowledge.
  *   **The Motivating Case:** A museum taxonomist cannot observe the mating behavior of a holotype collected in 1890. A field biologist cannot test reproductive compatibility between every population of a widespread insect. If a concept requires knowledge of potential interbreeding (BSC) or full genealogical history (strict PSC) that is empirically inaccessible, it renders species hypotheses untestable. The concept must work with DNA barcodes, morphology, or ecology as proxies for the underlying reality.
  *   **Specific Constraint:** Must allow for **identification** from partial data (e.g., a single locus or morphological trait) with a defined margin of error.

  #### 3. Ontological Coherence (The Individuality Requirement)
  *   **The Requirement:** The concept must be compatible with the view that species are historical individuals (spatiotemporally bounded entities) rather than eternal classes (natural kinds defined by essential properties).
  *   **The Motivating Case:** If species are individuals (Ghiselin/Hull thesis), they have births (speciation) and deaths (extinction) and cannot be defined by necessary and sufficient conditions (like "having feathers"). A concept that treats species as classes (e.g., "organisms with >97% DNA similarity") risks reifying arbitrary clusters as eternal types. The concept must respect the **causal continuity** of the lineage.
  *   **Specific Constraint:** Must treat species as **particulars** in the evolutionary process, not merely as similarity clusters.

  #### 4. Discreteness and Countability (The Classification Requirement)
  *   **The Requirement:** The concept must yield discrete, countable units to support biodiversity metrics, conservation policy, and Linnaean classification.
  *   **The Motivating Case:** Conservation law (e.g., the Endangered Species Act) and biodiversity counting require integer values. If a concept yields a continuum where boundaries are radically vague or observer-relative, we cannot count species. While evolution is continuous, the *units* of conservation and study must be sufficiently discrete to prevent arbitrariness.
  *   **Specific Constraint:** Must minimize **arbitrary lumping or splitting**; there must be a fact of the matter about whether Population A and Population B are conspecific.

  #### 5. Theoretical Consistency (The Population Genetics Requirement)
  *   **The Requirement:** The concept cannot contradict the mechanisms known to hold lineages together or drive them apart (selection, drift, gene flow, mutation).
  *   **The Motivating Case:** A concept that defines species solely by morphological gap (Morphological Species Concept) risks grouping cryptic species (genetically distinct but morphologically identical) or splitting phenotypic plasticity. The concept must acknowledge that **cohesion** is maintained by specific mechanisms (gene flow, stabilizing selection) and that divergence is the result of their cessation.
  *   **Specific Constraint:** Must align with the **population-genetic reality** of lineage independence.

  ---

  ### II. Non-Negotiables vs. Prejudices

  Not all desiderata are created equal. Some are conditions of biological adequacy; others are artifacts of human systematics or metaphysical preference.

  **1. The Non-Negotiables:**
  *   **Theoretical Consistency:** You cannot define species in a way that violates population genetics. If a concept posits a boundary where gene flow is high and selection is uniform, it is biologically false.
  *   **Operational Diagnosability:** A concept that cannot be applied is metaphysics, not science. If it requires omniscience about mating potential, it is useless for taxonomy.
  *   **Empirical Scope (Asexuals/Reticulation):** You cannot define a general biological concept that excludes 90% of the biomass (microbes) or common phenomena (hybridization).

  **2. The Prejudices (Dressed up as Demands):**
  *   **Universality (Monism):** This is the strongest candidate for a "prejudice." The demand that *one* concept must apply to bacteria, orchids, and mammals stems from a desire for theoretical elegance, not biological necessity. There is no law of nature stating that the unit of evolution must be identical across all domains of life. **Verdict:** Drop Universality. Accept Pluralism if necessary.
  *   **Strict Discreteness:** The demand for sharp boundaries assumes evolution produces bins. It often produces clines. While we need countability for policy, insisting on *ontological* sharpness where there is biological fuzziness (e.g., ring species) leads to error. **Verdict:** Relax to "sufficient discreteness for practical purposes."
  *   **Individuality Thesis:** While powerful, insisting species *must* be individuals excludes concepts that treat them as homeostatic property clusters (HPC kinds). **Verdict:** Keep as a strong preference, but allow HPC if it better solves the operational problems.

  ---

  ### III. The Incompatibility Matrix: Where the Desiderata Break

  This is the core result you are looking for. The species problem persists not because we lack cleverness, but because **a subset of these desiderata is jointly unsatisfiable.**

  **The Species Trilemma:**
  You cannot simultaneously satisfy **Universality**, **Discreteness**, and **Process-Coherence**.

  1.  **Universality + Process-Coherence $\rightarrow$ Loss of Discreteness.**
      If you demand a single concept based on evolutionary process (cohesion/gene flow) across all life, you encounter reticulation and asexuality. In hybridizing plants or bacteria with horizontal gene transfer, lineages are not discrete trees but webs. To remain coherent with the process, you must admit the boundaries are fuzzy, violating Discreteness.
  2.  **Universality + Discreteness $\rightarrow$ Loss of Process-Coherence.**
      If you demand a single concept that yields discrete bins for all life (e.g., a fixed genetic distance threshold), you inevitably cut across actual evolutionary processes. You will lump distinct evolutionary lineages that look similar (cryptic species) or split cohesive populations that look different (polymorphism). You save the bin, but lose the biological reality.
  3.  **Discreteness + Process-Coherence $\rightarrow$ Loss of Universality.**
      If you demand discrete units that reflect actual evolutionary independence, you must use different criteria for different groups. For birds, reproductive isolation works (BSC). For bacteria, you need ecological/genetic clusters (PSC/HPC). For hybridizing plants, you might need a Cohesion concept. You save the biology and the bins, but you sacrifice the single unified theory (Monism).

  **Conclusion on Incompatibility:**
  The "Species Problem" is the friction generated by trying to hold **Universality** in the face of the **Trilemma**. If you drop Universality (accepting Metaphysical Pluralism), the tension dissolves. If you keep Universality, you must accept that "species" will sometimes be a fiction (discrete bins imposed on a continuum) or that the concept will be inapplicable to large swathes of life.

  ---

  ### IV. Brief Scorecard of Contenders

  Here is how the major concepts fare against the non-negotiable desiderata.

  | Concept | Empirical Scope (Asexuals/Reticulation) | Operational Diagnosability | Theoretical Consistency | Discreteness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Biological (BSC)** | **Fail.** Excludes asexuals; struggles with ring species/hybrids. | **Fail.** Requires mating data (often impossible). | **Pass.** Aligns well with population genetics of sexuals. | **Pass.** Yields clear bins *when* applicable. | Excellent for sexual vertebrates; catastrophic elsewhere. |
  | **Phylogenetic (PSC)** | **Pass.** Applies to asexuals/fossils. | **Pass.** Based on diagnosable traits/DNA. | **Mixed.** Often ignores population processes (oversplits). | **Mixed.** Can be too discrete (splits variants). | High utility, but risks reifying genealogical noise. |
  | **Morphological (MSC)** | **Pass.** Applies to everything with form. | **Pass.** High (traditional taxonomy). | **Fail.** Ignores cryptic diversity/plasticity. | **Pass.** Subjective but yields bins. | Operationally necessary, theoretically weak. |
  | **Cohesion (CSC)** | **Pass.** Explicitly handles asexuals via ecological cohesion. | **Fail.** Hard to measure "cohesion" mechanisms. | **Pass.** Best theoretical fit. | **Pass.** Focuses on limits of divergence. | Theoretically robust, operationally difficult. |
  | **Pluralism** | **Pass.** Selects concept per domain. | **Pass.** Uses best tool for the job. | **Pass.** Respects domain-specific processes. | **Pass.** Context-dependent. | Solves the Trilemma by dropping Universality. |

  **Summary for the Thesis:**
  The BSC optimizes for *Theoretical Consistency* at the cost of *Empirical Scope*. The PSC optimizes for *Operational Diagnosability* and *Scope* at the cost of *Theoretical Consistency* (regarding population processes). The Cohesion Concept attempts to balance them but fails *Operational Diagnosability*.

  Your argument should be that the choice of species concept is not a discovery of the "true" definition, but a selection of which desideratum to prioritize given the specific biological domain and the practical aim (conservation vs. evolutionary theory). The "problem" is only unsolvable if one insists on Universality.
