          *   *Conflict:* You can't have all three. If you have 1 & 3, you can't satisfy 2 (Ladder looks valid a priori). If you have 2 & 3, you lose 1 (conclusions are contingent). If you have 1 & 2, you lose 3 (you're smuggling in empirical physics).

  6.  **Assessing Reconstructivists vs. Intuitionists:**

      *   *Reconstructivists (Norton):* Good on Transfer (it's just argument), bad on Modal Force (loses the "experiment" feel), struggles with Prospective Validity (if it's just argument, why do we miss the hidden premise in the Ladder case?).
