answer: |-
  Here is a list of desiderata for an account of the epistemic power of thought experiments, structured to support your term paper's argument regarding inaccessible regions.

  ### The Desiderata List

  **1. The Typological Distinction Constraint (Non-Negotiable)**
  *   **Demand:** The account must distinguish between *physical reductios* (Stevin's wreath), which rely on the impossibility of a physical process (perpetual motion), and *theoretical reductios* (Galileo's falling bodies), which rely on logical inconsistency within a conceptual framework.
  *   **Motivation:** Stevin invokes a nomic impossibility (nature forbids perpetual motion), while Galileo invokes a logical contradiction derived from an opponent's definitions. An account that treats these as epistemically identical fails to capture the different sources of their persuasive force.

  **2. The Modal Grounding Constraint (Partisan Demand)**
  *   **Demand:** The account must specify the source of the modal force (necessity) invoked in the conclusion. It must state whether the impossibility relied upon is knowable *a priori* (conceptual/logical) or is an empirical regularity elevated to a principle (nomic).
  *   **Motivation:** In Stevin's case, is the "absurdity" of perpetual motion a logical truth or a well-confirmed empirical generalization? If the latter, the thought experiment is merely a compressed empirical argument; if the former, it claims access to modal reality independent of experience.

  **3. The Applicability (Transfer) Constraint (Non-Negotiable)**
  *   **Demand:** The account must explain the bridge principle that allows a conclusion derived in an imagined setup to bear on the actual world, specifically where empirical verification is impossible (e.g., black hole interiors).
  *   **Motivation:** Without this, thought experiments are merely fiction. The account must explain why the laws governing the imagined spheres or tied bodies are guaranteed to hold in the physical world, particularly in regimes where we cannot check them.

  **4. The Domain Sensitivity Constraint (Non-Negotiable)**
  *   **Demand:** The account must explain the reliability differential: why we grant epistemic authority to thought experiments in fundamental mechanics but withhold it from structurally similar arguments in metaphysics (personal identity) or semantics.
  *   **Motivation:** If the mechanism is "rational intuition" or "argument reconstruction," it should theoretically work across domains. An account that cannot explain why physics TEs succeed while metaphysics TEs often stall must either embrace uniform skepticism or identify a relevant difference in the subject matter.

  **5. The Prospective Validity Constraint (Non-Negotiable)**
  *   **Demand:** The account must provide criteria to diagnose failure *prospectively*, without relying on hindsight or empirical outcome. It must explain why the "rigid ladder" case (symmetry implies no motion) is epistemically defective compared to Stevin's wreath, prior to knowing the ladder collapses.
  *   **Motivation:** Relying on the fact that the ladder *does* fall to judge the argument is hindsight bias. A robust epistemology must identify the structural flaw (e.g., unstable equilibrium masked by idealization) independently of the physical result.

  **6. The Idealization Stability Constraint (Added Desideratum, Non-Negotiable)**
  *   **Demand:** The account must distinguish between *illuminating idealizations* (frictionless planes that isolate forces) and *destructive idealizations* (perfectly smooth walls that remove necessary boundary conditions).
  *   **Motivation:** Both Stevin and the Ladder case use idealizations. The account must explain why Stevin's neglect of friction preserves the relevant physics, while the Ladder's neglect of friction (or infinitesimal perturbations) destroys the dynamical description. This is crucial for extrapolating to black holes, where idealizations (singularities) may break the theory.

  ***

  ### Analysis of the Constraints

  **The Most Exclusionary Desideratum**
  The **Prospective Validity Constraint** excludes the most accounts. Most existing theories (both argument-based and intuition-based) validate thought experiments based on their successful integration into accepted theory *after the fact*. Very few provide a mechanism for a philosopher or scientist to identify a "bad" thought experiment *before* empirical feedback or theoretical consensus reveals the error. This constraint forces the account to move from descriptive sociology of science to normative epistemology.

  **The Impossibility Result**
  There is a jointly unsatisfiable subset among the desiderata, which should form the core thesis of your paper. You cannot simultaneously satisfy **The Modal Grounding Constraint (as *a priori*)**, **The Prospective Validity Constraint**, and **The Applicability Constraint**.
  1.  If the modal force is *a priori* (pure reason), you lack the resources to diagnose the Ladder case prospectively (since the error is dynamical/empirical, not logical).
  2.  If you rely on empirical knowledge to diagnose the Ladder case prospectively, the thought experiment is not epistemically independent of experience, weakening its application to inaccessible regions like black holes (violating the spirit of the Applicability Constraint).
  3.  Therefore, an account that claims thought experiments provide *a priori* access to inaccessible physical regions cannot also explain why we should reject the Ladder case without empirical hindsight.

  ***

  ### Assessment of Rival Accounts

  Reconstructivists satisfy Prospective Validity only by reducing TEs to explicit arguments, thereby losing the Modal Force required to justify claims about inaccessible regions beyond the premises' warrant. Intuition-based accounts preserve Modal Force but fail Domain Sensitivity and Prospective Validity, as they cannot explain why physical intuition succeeds where metaphysical intuition fails, nor why the Ladder intuition is misleading without empirical correction.
