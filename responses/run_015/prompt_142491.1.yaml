  # Joint Document: Adversarial Collaboration on Collective Harm

  ### 1. Agreed Claims

  1.  **Structural Obscurity:** Collective harm scenarios involve institutional structures (thresholds, markets, counters) that systematically obscure the causal link between individual acts and aggregate outcomes.
      *   *Why both sign:* Both camps agree the empirical setup creates epistemic limitations regarding individual impact.
  2.  **Expected Impact in Thresholds:** In threshold cases (e.g., Binned-Purchase), epistemic uncertainty regarding the pivotal point generates a non-zero expected causal impact for individual contributions.
      *   *Why both sign:* Both camps accept the probabilistic mathematics of uncertainty, even if they disagree on its moral weight.
  3.  **Ex Ante/Ex Post Distinction:** Moral assessment must distinguish between the ex ante decision context (uncertainty) and the ex post outcome context (known results).
      *   *Why both sign:* Both camps agree this distinction is analytically necessary, even if they disagree on which perspective dominates.
  4.  **Causal Interruption:** In the Substitution case, the causal chain from the agent's act to the harmful outcome is interrupted by another agent's uptake, rendering the individual act causally sufficient but not necessary for the specific unit of harm.
      *   *Why both sign:* Both camps agree on the causal description of substitution, even if they disagree on its moral relevance.
  5.  **Offset Structure:** Offsetting mechanisms (e.g., Offset-Lottery) aim to neutralize harm but differ fundamentally in certainty versus magnitude of mitigation.
      *   *Why both sign:* Both camps agree on the structural description of the trade-off presented in the case.

  ### 2. Disagreements

  | Disagreement ID | Question at issue | Difference-making formulation | Participation formulation | Status | Verbal reformulation |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | Source of the Reason | The reason against acting is solely a function of the expected difference the act makes to the harmful outcome. | The reason against acting is grounded in complicity in a harmful practice or the universalizability of the maxim, independent of outcome. | Substantive | N/A |
  | **D2** | Public-Counter Case (Ex Post) | If I know ex post I was non-pivotal (e.g., position 3 of 500), I violated no reason and owe no regret. | Even if ex post non-pivotal, I participated in a harmful practice and must disown the act or owe restitution. | Substantive | N/A |
  | **D3** | Substitution Case | If substitution is certain, expected difference is zero, so the reason against acting vanishes completely. | Even if substitution is certain, joining the practice constitutes complicity, so the reason against acting survives. | Substantive | N/A |
  | **D4** | Offset-Lottery | A lottery with equal expected removal is morally equivalent to certain removal; risk neutrality applies to moral goods. | Restraint is required; offsetting (especially via lottery) fails to address the expressive meaning or complicity of the initial harm. | Mixed | Whether moral risk aversion is rational or whether offsetting addresses the right wrong. |
  | **D5** | Scaling (Shrinking-Practice) | The stringency of the reason scales with the expected difference, which varies with the size of the practice. | The stringency of the reason is roughly invariant to practice size, as complicity or universalization conditions remain constant. | Substantive | N/A |

  ### 3. Cruxes

  | Crux ID | Sub-question | Test or case both accept as bearing on it | What would count as settling it | Difference-making prediction | Participation prediction | Difference-making update if wrong | Participation update if wrong |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | Offset Lottery Acceptability | Is the Offset-Lottery permissible compared to restraint? | Consensus that risk-aversion regarding moral goods is rationally required. | Lottery is permissible (expected value equal). | Lottery is impermissible (restraint required). | Admit framework cannot represent moral risk-aversion; adjust utility function. | Admit expected value matters if risk-aversion is conceded; allow offsets. |
  | **C2** | Stringency Scaling | Does reason strength track practice size (Shrinking-Practice)? | Intuition pump comparing 10m vs. 10 participants. | Strength scales with expected impact (smaller practice = weaker reason). | Strength invariant (complicity is binary or maxim-based). | Accept invariant reason strength; weaken causal claim. | Accept scaling; tie complicity to causal share. |
  | **C3** | Ex Post Exculpation | Does known non-pivotality exculpate (Public-Counter)? | Judgment on regret/owe after knowing position 3 of 500. | No regret owed; ex post fact fully exculpates. | Regret remains; participation itself was wrong. | Accept remainder of regret; separate decision from outcome value. | Accept exculpation; weaken complicity claim to causal only. |
  | **C4** | Substitution Survival | Does the reason survive certain substitution? | Judgment on Substitution case. | Reason vanishes (no difference). | Reason survives (complicity remains). | Accept complicity reason; add non-causal constraint. | Accept causal constraint; weaken complicity to outcome-based. |
  | **C5** | Moral Significance Threshold | Is there a cutoff below which expected differences generate no reason (Resolution)? | Judgment on trillionth-of-a-degree impact. | No cutoff (linear scaling of reason). | Yes cutoff (or reason exists regardless of difference). | Accept threshold; modify expected utility framework. | Accept linear scaling; tie reason strictly to difference. |
  | **C6** | Counterfactual Baseline | How is difference measured in markets (Market-Incidence)? | Fixed behavior vs. New equilibrium. | Fixed behavior (causal isolation). | New equilibrium (structural participation). | Accept equilibrium; adjust causal model. | Accept fixed; adjust structural model. |

  ### 4. Closing Assessment

  The Participation coalition is fragile and likely splits on the **Shrinking-Practice case**: the Complicity wing sees stronger reasons in smaller groups (salience of membership), while the Universalization wing sees invariant reasons (maxim consistency). The **Offset-Lottery** is the most decisive further case, as it tests whether the Participation camp can tolerate risk-based mitigation or demands absolute restraint. Genuinely unresolved is whether moral reasons can be entirely decoupled from causal efficacy without collapsing into rule-worship, and whether the Difference-Makers can accommodate moral risk-aversion without abandoning expected utility.

