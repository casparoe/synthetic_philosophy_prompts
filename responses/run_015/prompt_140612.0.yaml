answer: |-
  The phenomenon you are describing is a structural flaw in reasoning that borrows its logic from statistics and modeling, though it appears frequently in historical and pseudo-historical argumentation. The established concept is **overfitting**.

  In data science, overfitting occurs when a model is too complex relative to the amount of data available. It achieves a perfect fit with the existing data points not because it has identified the underlying signal, but because it has enough "free parameters" (adjustable variables) to match the noise. If you have ten data points and ten parameters, you can draw a line through every point perfectly. The model looks incredibly successful—it explains 100% of the observations—but it has zero predictive power and fails immediately when presented with new data.

  Your fringe theories are engaging in **narrative overfitting**. The "data points" are the historical anomalies (pyramids, floods, star alignments). The "parameters" are the bolted-on assumptions (myths traveled, dates tampered with, names mistranscribed). When a theory requires a unique, independent assumption for every piece of evidence it claims to explain, it has as many parameters as data points. It fits the past perfectly because it was built backwards to do so, but it cannot predict the future (e.g., "you will find such-and-such beneath this site" often fails, or is explained away with yet another parameter if it does).

  ### What It Isn't
  *   **It isn't Consilience:** Real scientific breakthroughs (like Wegener's continental drift) exhibit *consilience*—independent lines of evidence converge on a single conclusion *without* needing new assumptions for each line. Wegener didn't need one assumption for the fossils and a different, unrelated assumption for the coastlines; the single mechanism (drift) explained both simultaneously. Your fringe theories lack a unifying mechanism; they have a unifying *label* (e.g., "Atlanteans"), but the *work* is done by the ad hoc assumptions.
  *   **It isn't Just Error:** A theory can be broad and wrong without overfitting. If a historian argues for a trade route between Rome and China and gets the date wrong by three centuries, that is a parameter *error*, not proliferation. The model structure is simple (trade happened), but one value is incorrect. Overfitting requires the *multiplication* of assumptions to maintain the fit.
  *   **It isn't Unfalsifiability:** As you noted, these theories often make specific claims. The problem isn't that they can't be proven wrong; it's that being proven wrong on specific points doesn't reduce the theory's complexity. A scientific model sheds parameters when refuted; an overfitted narrative just adds another epicycle.

  ### Boundary Cases
  To help your readers apply this test, here is how to distinguish the cases you mentioned:

  1.  **A broad comparative-mythology synthesis from a real scholar:**
      *   **Test:** Does the scholar propose a common human psychology or a known historical migration path that explains the similarities with *one* mechanism?
      *   **Verdict:** **Not Overfitting.** If the theory uses a single causal engine (e.g., "Proto-Indo-European migration") to explain linguistic and mythic similarities across regions without inventing a new exception for every discrepancy, it is parsimonious. It risks being wrong, but it isn't overfitted.

  2.  **A diffusionist account of a single technology (e.g., pyramids) that specialists reject:**
      *   **Test:** How many independent contacts must be posited?
      *   **Verdict:** **Likely Overfitting.** If the theorist argues that Egyptians taught Mexicans, they must explain the lack of intermediate evidence, the time gap, and the cultural differences. If they add a separate assumption for each gap ("the boats rotted," "the records were lost," "the priests kept it secret"), the parameter count rises to match the data points. It looks like an explanation, but it is a story stitched together with ad hoc patches.

  3.  **An archaeological claim that's mostly right but whose dating is off by three centuries:**
      *   **Test:** Does correcting the date require changing the core mechanism or adding new assumptions?
      *   **Verdict:** **Not Overfitting.** This is a calibration error. The model (e.g., "this culture influenced that one") remains simple. The fit is imperfect, but the complexity is low. This is a valid hypothesis that needs refinement, not a degenerating research programme.

  ### The Name
  While "overfitting" is the established technical term from statistics and philosophy of science, it can feel too mathematical for a general history readership. To make it usable in print while retaining precision, I propose adapting it to the domain. This allows your readers to spot the "free parameters" in a story.

  \answer{Narrative Overfitting}
