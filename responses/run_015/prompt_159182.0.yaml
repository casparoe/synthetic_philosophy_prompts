answer: |-
  Here is the specification for a theory of joint action adequate to underwrite collective obligation and blame.

  ### I. The Specification List

  **A. Case Coverage Requirements**
  1.  **Mere Convergence:** Must distinguish agents walking side-by-side from agents walking *together*, ensuring only the latter generates mutual obligations.
      *   *Consideration:* Without this, normative claims attach to coincidental causality, violating "ought implies can" and moral luck constraints.
  2.  **Divergent Private Ends:** Must allow joint action where participants share a goal (e.g., lift the table) but have incompatible private motives (e.g., one for money, one for spite).
      *   *Consideration:* Obligations in joint projects must bind regardless of private utility; otherwise, agents could exit obligations whenever private motives shift.
  3.  **The Discursive Dilemma:** Must account for group outcomes (e.g., a vote) that no individual member endorsed, yet for which the group is liable.
      *   *Consideration:* If group blame reduces strictly to individual endorsement, corporate liability and democratic accountability become impossible to ground.
  4.  **Dissent and Coercion:** Must differentiate the normative status of a willing participant from a coerced or dissenting member within the same collective act.
      *   *Consideration:* To avoid unjust blame; the coerced may be causally involved but lack the *standing* to be rebuked or the *obligation* to contribute.
  5.  **Improvisation:** Must explain how obligations arise in real-time coordination without prior agreement or explicit communication.
      *   *Consideration:* If obligations require explicit contract, most everyday collaborative morality (e.g., rescue scenarios) vanishes.
  6.  **Algorithmic Opacity:** Must handle coordination mediated by systems (e.g., gig economy, HFT) where no member grasps the total plan.
      *   *Consideration:* To address modern collective harm; if understanding the whole plan is required for obligation, complex systemic harms become blameless.
  7.  **Diachronic Identity:** Must determine if obligations persist through complete membership turnover (e.g., a university, a state).
      *   *Consideration:* To underwrite historical reparations or long-term institutional debts that outlive current members.

  **B. Distinction Preservation Requirements**
  8.  **Shared Intention vs. Shared Belief:** Must not collapse acting together into merely believing we are acting together.
      *   *Consideration:* Belief is truth-apt and passive; intention is world-changing and active. Obligation attaches to the commitment to *make* the world a certain way.
  9.  **Group Act vs. Members' Acts:** Must distinguish the collective deed from the sum of individual deeds.
      *   *Consideration:* To allow for the possibility that the group succeeds even if individuals fail (via redundancy), or fails even if individuals succeed (via miscoordination).
  10. **Intending-Together vs. Each Intending That We:** Must distinguish a primitive *we-intention* from an *I-intention* directed at a group outcome.
      *   *Consideration:* If reduced to *I-intentions*, the obligation becomes self-imposed rather than *owed to the other*, weakening the right to rebuke.
  11. **Joint Action vs. Joint Causal Production:** Must separate collaborative agency from cases where agents causally produce an outcome nobody aimed at (e.g., tragedy of the commons).
      *   *Consideration:* Blame for negligence differs from blame for joint action; the latter requires a normative link, not just a causal one.

  **C. External Consistency Requirements**
  12. **Moral Psychology:** Must not violate "ought implies can" (agents must have some capacity to fulfill the obligation).
  13. **Legal Practice:** Must be compatible with established doctrines of corporate liability and conspiracy (without necessarily deferring to them).
  14. **Game Theory:** Must accommodate common knowledge conditions without requiring infinite regress of mental states.

  ---

  ### II. Classification of Requirements

  **Non-Negotiable (For Your Normative Purpose)**
  *   **Normative Grounding (Implicit in all above):** The theory must explain *why* participation generates an entitlement to rebuke. It is not enough to describe the action; it must derive the obligation.
  *   **Discursive Dilemma Coverage:** If the theory cannot handle group outcomes unendorsed by individuals, it cannot underwrite institutional blame.
  *   **Distinction 11 (Action vs. Causal Production):** If this collapses, you cannot distinguish a co-conspirator from a bystander who happened to be useful.

  **Research Programme Preferences (Negotiable)**
  *   **Methodological Individualism:** The requirement that all group facts reduce to individual attitudes. (This is often incompatible with the Discursive Dilemma requirement).
  *   **Psychological Realism:** The requirement that the mental states posited (e.g., "we-intentions") be empirically verifiable in cognitive science.
  *   **Explicitness:** The requirement that commitments be consciously acknowledged (excludes improvisation and algorithmic cases).

  ---

  ### III. The Genuine Tension

  You are correct to suspect a trade-off. There is a genuine incompatibility between **Requirement 6 (Algorithmic/Loose Collectives)** and **Requirement 1 (Normative Grounding/Right to Rebuke).**

  *   **The Conflict:** To cover algorithmic or dispersed collectives (where agents are unwitting or lack mutual knowledge), the bar for "joint action" must be lowered to functional interdependence. However, the "distinctive normative residue" (the right to rebuke) traditionally requires mutual recognition or voluntary commitment.
  *   **The Trade-off:** If you lower the bar to include the Uber driver and the algorithm as "acting together," you dilute the normative residue to mere causal expectation (I expect you to drive safely, but I lack the *standing* to rebuke you as a partner). If you raise the bar to secure the right to rebuke (requiring mutual commitment), you exclude the algorithmic/dispersed cases.
  *   **Verdict:** You cannot maximize both *scope* (including loose collectives) and *strength* (robust interpersonal obligation) simultaneously. You must decide whether your theory is about **structural liability** (broad scope, weaker normative ties) or **collaborative obligation** (narrow scope, strong normative ties).

  ---

  ### IV. The Exclusionary Requirement

  The single requirement that does the most work in excluding otherwise plausible theories is: **The theory must derive the obligation from the structure of the joint intention itself, rather than from independent moral principles.**

  *   **Why:** Many theories (especially Plan-Based) can describe joint action accurately but must borrow from external morality (e.g., "it's wrong to break promises") to explain the obligation. For your purpose, the joint action must *constitute* the obligation. This excludes purely cognitive or functionalist accounts that describe *how* we coordinate but not *why* we owe each other fidelity in doing so.

  ---

  ### V. Family Critiques

  *   **Plan-Based (e.g., Bratman):** Excellent at handling improvisation and sub-plans, but struggles to derive robust interpersonal obligation from mere meshing intentions without adding a separate normative premise.
  *   **We-Intention (e.g., Searle, Tuomela):** Secures the psychological distinction of acting together, but fails to explain why a biological or psychological "we-mode" inherently binds the agent to the other normatively.
  *   **Joint-Commitment (e.g., Gilbert):** Best at grounding the entitlement to rebuke and obligation, but struggles to accommodate loose, unwitting, or coerced participation without stretching the definition of "commitment" beyond recognition.
