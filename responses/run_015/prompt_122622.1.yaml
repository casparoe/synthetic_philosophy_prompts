answer: |-
  This is a sophisticated and unusually pragmatic approach to funding alignment research. You are acting as a principal investigator managing a portfolio of high-risk, high-reward queries. Given your constraints (lone researchers, no compute, 6-month horizon), the value of a project is not measured by "novelty" but by **decision-resolution**: how much does this result reduce your uncertainty about whether to double down on or abandon debate-based oversight?

  Here is an analysis of your distinction, the criteria for commissioning work, the specific projects to fund, and the "kill signals" to watch for.

  ### 1. Is the Depth/Framing Distinction Real?

  **Yes, but they are coupled.**
  Your distinction is analytically useful and maps onto two different failure modes in the literature:
  *   **Depth Failures** correspond to **Computational Complexity**. The honest argument exists in a complexity class (e.g., $NEXP$) that the judge cannot verify in polynomial time, even with help. The honest arguer *cannot* compress the truth enough.
  *   **Framing Failures** correspond to **Game-Theoretic/Psychological Exploits**. The liar forces the judge into a local optimum of verification. The judge *could* verify the truth, but the liar successfully argues that a different, easier-to-fake metric is the one that matters.

  **Which is likelier to be fatal?**
  *   **Framing is the immediate killer.** If a dishonest agent can manipulate a human judge on *simple* tasks (where depth isn't an issue), the system is unsafe for deployment *now*. This is a mechanism design failure.
  *   **Depth is the scaling killer.** If framing is solved, depth determines the ceiling of the system. If debate breaks down at superhuman complexity, it fails its primary purpose (supervising AGI).

  **Recommendation:** Treat them as distinct for the purpose of assigning projects, but acknowledge that **Framing failures often induce Depth failures.** A liar wins by framing the debate such that the *only* way to check them requires a depth check the judge can't afford. Therefore, **prioritize Framing research.** If you can't stop framing on simple tasks, depth doesn't matter.

  ### 2. Criteria for a "Worthwhile" Contract

  Given your constraints, a research question is only worth funding if it meets three criteria:

  1.  **Feasibility without Compute:** The researcher must be able to use API calls (GPT-4, Claude, etc.) or small open-weights models on consumer hardware. No training runs. No massive data collection requiring IRB approval or labs.
  2.  **Decision-Relevance (The "Go/No-Go" Test):** The output must be a metric or a proof that clearly moves your confidence. Ambiguous philosophical essays are low value. You want plots, win-rates, or formal bounds.
  3.  **Leverage:** The answer should settle a class of worries, not just a single instance. (e.g., "Does cross-examination fix framing?" is higher leverage than "Does Model X win against Model Y?")

  ### 3. The Six Projects (In Priority Order)

  I recommend commissioning these six specific scopes. They are ordered from "Does it work at all?" to "How do we fix it?" to "What are the limits?"

  #### Project 1: The Existence Proof (Empirical)
  *   **Question:** Do framing failures actually occur with current models on tasks where the truth is objectively verifiable?
  *   **Scope:** Researcher creates a dataset of "buggy code" or "logic puzzles" where the answer is known to the experimenter but non-trivial for a lay judge. One LLM argues the truth, one argues the lie. Humans judge.
  *   **Why:** Before theorizing, we need to know if this is a real phenomenon with current tech or a speculative worry.
  *   **Success Metric:** A dishonest win-rate significantly above 50% on tasks where the truth is short/verifiable.
  *   **Feasibility:** High. Requires prompt engineering and Mechanical Turk/Upwork for judges.

  #### Project 2: The Cross-Examination Patch (Empirical/Mechanism)
  *   **Question:** Does allowing the judge (or the honest agent) to ask targeted cross-examination questions mitigate framing failures?
  *   **Scope:** Same setup as Project 1, but introduce a protocol phase where the judge/agent can ask 3-5 specific clarifying questions before the verdict.
  *   **Why:** This is the standard proposed fix for framing. If this doesn't work, the basic debate protocol is likely dead.
  *   **Success Metric:** Reduction in dishonest win-rate compared to Project 1.
  *   **Feasibility:** High. Purely protocol modification.

  #### Project 3: The Complexity Threshold (Empirical)
  *   **Question:** At what complexity threshold does the "Depth Failure" dominate, even with an honest arguer?
  *   **Scope:** Scale the complexity of the verification task (e.g., lines of code, steps in a proof) until the honest arguer's win-rate drops below a usable threshold, even without a liar.
  *   **Why:** Establishes the "ceiling" of debate. If the ceiling is lower than human-expert level, debate is useless for expert assistance, let alone AGI.
  *   **Success Metric:** A plot of Win-Rate vs. Complexity Steps.
  *   **Feasibility:** Medium. Requires careful task design to ensure linear scaling of complexity.

  #### Project 4: Judge Training & Cognitive Load (Human Factors)
  *   **Question:** Can judges be trained to spot framing tricks, and does doing so increase decision time prohibitively?
  *   **Scope:** Train a small group of judges on common rhetorical fallacies/framing tricks. Measure accuracy vs. time taken.
  *   **Why:** If fixing framing requires judges to spend 10x longer, the efficiency gain of AI is lost.
  *   **Success Metric:** Accuracy/Time ratio compared to untrained judges.
  *   **Feasibility:** High. Requires recruiting and managing human participants.

  #### Project 5: Formal Game-Theoretic Model (Theoretical)
  *   **Question:** Can we formally define a class of "Framing Vulnerable" games where debate is provably unstable?
  *   **Scope:** A lone theorist models the debate as a signaling game. Look for Nash equilibria where lying is the dominant strategy regardless of truth.
  *   **Why:** Empirical results are model-dependent (GPT-4 today). A formal proof holds regardless of model improvements.
  *   **Success Metric:** A theorem defining conditions under which debate fails.
  *   **Feasibility:** High for a theorist (no compute needed), but requires specific expertise in game theory/CS.

  #### Project 6: The Baseline Comparison (Empirical)
  *   **Question:** Is Debate strictly better than "Iterated Querying" (asking one AI to explain and critique its own work)?
  *   **Scope:** Compare Judge accuracy in a Debate setting vs. a setting where a single AI provides an answer + a "confidence/verification" report.
  *   **Why:** Debate is complex. If a simpler method yields similar truth-tracking, debate is unnecessary overhead.
  *   **Success Metric:** Debate Win-Rate vs. Baseline Accuracy.
  *   **Feasibility:** High.

  ### 4. What to Avoid (Mismatched Questions)

  Do **not** commission these, as they mismatch your constraints:

  *   **"Train a debate agent using RL."** This requires a compute budget, engineering team, and stability infrastructure. A lone researcher will burn out or produce low-quality agents.
  *   **"Philosophical analysis of Truth in Debate."** Without formalization or empirical data, this is opinion. You need data to decide on funding.
  *   **"Security Red-Teaming for AGI."** Too vague. Without a specific protocol to test, this becomes speculative fiction.
  *   **"Solving Depth Failures."** This is likely an open mathematical problem ($P$ vs $NP$ adjacent). A 6-month contract won't solve it. Focus on *characterizing* the failure, not solving it.

  ### 5. Reordering Priorities based on Depth/Framing

  Your split should directly dictate the order of operations.
  1.  **Framing First:** If framing failures are inherent to human psychology (e.g., humans are easily dazzled by confident nonsense regardless of protocol), then Debate is dead. No amount of compute solves human gullibility.
  2.  **Depth Second:** If framing is solvable, *then* we worry about depth. Depth is a resource problem; Framing is a structural problem. Structural problems kill projects first.

  **Revised Order:** Fund Project 1 (Framing Existence) and Project 2 (Framing Fix) immediately. If those fail, stop. If they succeed, fund 3, 4, and 6. Project 5 (Theory) can run in parallel as it costs little.

  ### 6. The "Kill Switch" Result

  You asked what result would most change the ranking.

  **The Fatal Result:**
  If **Project 2 (Cross-Examination)** shows that **dishonest win-rates remain >50% even on simple, verifiable tasks** despite cross-examination.

  *   **Why:** This implies that human judges cannot be made reliable arbiters of AI arguments, even with tooling. It suggests the bottleneck is the *human*, not the *protocol*. Since we cannot upgrade the human quickly, this renders the entire Debate approach non-viable for near-term safety.
  *   **Action:** Pivot funding to **Automated Oversight** (AI judging AI without humans) or **Interpretability** (bypassing the need for argumentation).

  **The Green Light Result:**
  If **Project 1** shows dishonest win-rates are low (<30%) on simple tasks, and **Project 3** shows a graceful degradation (not a cliff) as complexity increases.

  *   **Why:** This suggests Debate is robust enough to be a component of a safety system, even if not a silver bullet.

  ### Summary Advice for the Funder

  You are effectively running a "de-risking" portfolio.
  *   **Don't look for solutions yet.** Look for clear failures. It is easier to prove something breaks than to prove it works forever.
  *   **Demand Code and Data.** As a programmer, require that all empirical projects publish their prompts, datasets, and analysis scripts. This allows you to verify their claims and lets future researchers build on their work.
  *   **Focus on the Human.** The weak link in AI Debate is not the AI; it is the human judge. Projects that investigate the human's cognitive limits (Project 4) are likely to yield higher leverage than projects tweaking the AI's parameters.

  Your distinction between Depth and Framing is sound. Use it to triage: **Framing is the gatekeeper.** If the gate is broken, the depth of the castle behind it doesn't matter. Fund the framing research first.
