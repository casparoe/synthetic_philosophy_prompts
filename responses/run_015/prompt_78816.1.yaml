      *   This handles the 3 vs 4 tension perfectly. It's about *counterfactual dependence*. Would the community know this now if not for Person X?
      *   Case 3: If not for 50s person, community still wouldn't know (paper ignored). If not for 80s person, they wouldn't know. -> 80s gets credit.
      *   Case 4: If not for Framework builder, student couldn't have stated it. -> Framework gets intellectual credit.
      *   Case 5: If not for Group A (who published first), Group B would have done it. But Group A *actually* caused the knowledge state *now*. -> Group A gets credit.
