answer: |-
  You have stumbled onto the difference between *epistemology* (what counts as knowledge) and the *sociology of science* (how knowledge becomes property). Your gut isn't inconsistent; it's tracking two distinct necessary conditions for "discovery" that usually overlap but sometimes come apart.

  The principle that reconciles your nine cases is this: **Discovery is the effective causation of public knowledge.**

  To get credit, you must satisfy two conditions:
  1.  **Intellectual Generation:** You must possess a valid justification for the truth (you can't be right by accident).
  2.  **Social Integration:** Your actions must be the effective cause of that truth entering the community's shared knowledge base.

  Here is how this principle resolves your tensions, handles the new case, and addresses the "multiple discovery" objection.

  ### Resolving the Tensions

  **The 3 vs. 4 Tension (Communication vs. Implication)**
  You feel these cases pull in opposite directions regarding whether you have to "say it out loud."
  *   **Case 3 (Obscure Journal):** The 50s author satisfied *Intellectual Generation* but failed *Social Integration*. Publishing in a place no one reads is like shouting into a vacuum. The 80s author becomes the "effective cause" of the community knowing the theorem. The 50s author is a historical footnote because they did not successfully alter the state of public knowledge.
  *   **Case 4 (Implicit Corollary):** The Framework Builder satisfied *Intellectual Generation* so thoroughly that *Social Integration* of the specific corollary became trivial. The student provided the *Social Integration* (the speech act), but the Builder provided the *causal capacity*.
  *   **The Resolution:** Your gut correctly identifies an injustice in Case 4 because the Builder is the *root cause*, whereas in Case 3, the 50s author was a *failed cause*. In Case 4, the theorem exists *because* of the framework. In Case 3, the theorem is known *in spite of* the first paper. Your principle holds: Credit goes to the effective cause. In Case 4, the Builder is the effective cause, even if the Student gets the naming rights (which are often just procedural markers of who handed it to the community).

  **The 5 vs. 6 Tension (Inevitability vs. Surprise)**
  You feel these cases pull in opposite directions regarding whether it matters if someone else would have gotten there.
  *   **Case 5 (Inevitable):** Priority is binary. Either you crossed the finish line or you didn't. The fact that others were close doesn't change the fact that *you* caused the knowledge to exist *now* rather than *later*.
  *   **Case 6 (Unexpected):** Novelty is scalar. We assign *more* prestige to Case 6 because the "counterfactual delay" is higher. If Person 6 hadn't done it, it might have been decades before anyone asked the question.
  *   **The Resolution:** There is no contradiction. Case 5 establishes *eligibility* for credit (you did it first). Case 6 establishes the *magnitude* of credit (you did it when it was hard to see). Both get credit for the discovery; Case 6 gets a bigger medal. The principle of "effective causation" applies to both: both caused the knowledge to exist. Case 6 just caused it to exist in a context where it was less likely to happen.

  ### The Verdict on the Nine Cases

  Under the principle of **Effective Causation of Public Knowledge**, your verdicts are almost all sound, with one clarification on Case 8.

  *   **Cases 1, 2, 3, 5, 6:** All align. Credit follows whoever successfully delivered the truth to the commons first.
  *   **Case 4:** Aligns. The Builder is the intellectual cause; the Student is the logistical cause. You feel the Builder deserves the credit because intellectual generation is the harder, more valuable constraint.
  *   **Case 7:** Aligns. Fails *Intellectual Generation*. No justification means no agency, just luck.
  *   **Case 8 (Computer):** This is the wobbly one. Your verdict ("credit feels thin") is correct. The program satisfies *Social Integration* (it outputted the truth), but the *Intellectual Generation* is split. The programmer built the engine, but the engine found the path without human understanding. Credit is diluted because human agency—the thing we reward—is reduced.
  *   **Case 9 (Forum):** Aligns. The "agent" here is the collective. The *thread* caused the knowledge. Credit attaches to the group because no single individual satisfies the *Intellectual Generation* condition alone.

  ### The Sealed Envelope Case

  **Scenario:** A sealed, dated, notarized envelope containing the result is found 40 years later. Everything was independently re-derived in the meantime.

  **Verdict:** **Zero discovery credit.**

  **Why:** This fails the *Social Integration* condition completely. Discovery is not a private relationship between a mind and the truth; it is a public act of changing the community's state of knowledge. If the envelope never opens, it never causes the community to know anything. It is historically interesting proof of priority, much like Case 2, but even weaker. In Case 2, the person *could* have published but chose not to. In the Envelope case, they actively prevented the knowledge from entering the commons. They are a "what if," not a "who did."

  ### The "Multiple Discovery" Objection

  You asked: *If the answer is "discoveries being multiple means none of these people deserve anything special," say so and tell me what that does to case 6.*

  **The Answer:** No. Multiple discovery does **not** negate credit.

  Science and math do not reward *uniqueness*; they reward *completion*. The fact that Wallace and Darwin both found natural selection does not mean natural selection wasn't discovered. It means the "fruit was ripe."

  **Impact on Case 6:**
  Case 6 remains the paradigm of discovery. Even if the result was inevitable eventually, the specific *path* taken by the discoverer was unique to them. We credit the *labor* and the *insight*, not the scarcity of the result. If we withheld credit because "someone else would have done it," we would have to withhold credit from almost every major discovery, because science is cumulative and concurrent.

  Case 6 gets *more* credit than Case 5 not because Case 5 is unworthy, but because Case 6 expanded the *frontier* of what was visible, whereas Case 5 harvested a crop that was already visible. Both are farmers; one just planted in new soil.

  ### Summary of the Principle

  Your gut is driven by a **Counterfactual Theory of Credit**:
  *   **Credit is assigned to the agent(s) without whom the community would not know the truth *when* it came to know it.**

  *   **Case 3:** Without the 80s person, the community still wouldn't know. (80s gets credit).
  *   **Case 4:** Without the Builder, the Student couldn't have known. (Builder gets intellectual credit).
  *   **Case 5:** Without Group A, the community would have waited for Group B. (Group A gets credit for the "when").
  *   **Envelope:** Without the envelope opening, the community knows the same amount. (No credit).

  This principle keeps your intuitions intact without requiring ad-hoc exceptions. It acknowledges that discovery is half thinking, and half telling.
