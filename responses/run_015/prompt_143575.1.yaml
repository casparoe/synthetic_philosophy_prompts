answer: |-
  Consider the empirical divergence in the gender composition of **software engineering versus primary education** within highly egalitarian welfare states like Sweden or Norway, compared to less economically developed nations with weaker gender protections, such as Algeria or Iran. In the latter contexts, women are often proportionally more represented in STEM fields like engineering. In the former, occupational segregation is stark: men dominate software engineering, while women disproportionately populate primary education and care work. This distribution serves as the focal point for two mutually exclusive interpretations of what constitutes a just society.

  From the **revealed-preference perspective**, this distribution is the hallmark of successful justice. The argument posits that in nations with weaker legal protections and economic safety nets, career choices are driven by necessity; engineering offers financial security and social mobility that women urgently require, suppressing their intrinsic inclinations. In contrast, in Nordic welfare states, robust social safety nets and anti-discrimination laws remove the coercive pressure of economic survival. Consequently, the resulting segregation is interpreted as the "clean" signal of free agency. Here, the empirical data is read as evidence that, when liberated from patriarchal constraint, men and women naturally diverge in their interests—men toward "things" and systems (engineering), women toward "people" and care (education). For theories of justice grounded in libertarian or liberal autonomy, this outcome is not a problem to be solved but a benchmark of success. Equality is achieved when the state recedes, allowing the "true" self to manifest in the labor market. The distribution is just because the process was free.

  Conversely, the **structural-feedback explanation** interprets the exact same distribution as evidence of a sophisticated, evolving mechanism of inequality. This view argues that egalitarian institutions do not merely remove barriers; they actively restructure the landscape of status and competition. In hyper-egalitarian meritocracies, where explicit discrimination is taboo, social distinction is sought through new axes of credentialing. Software engineering becomes coded not just as a job, but as a high-status, high-intensity signaling mechanism for meritocratic success, demanding a specific mode of engagement (e.g., continuous upskilling, aggressive networking, long hours) that is culturally masculinized. Meanwhile, primary education, while socially valued, is structurally framed as compatible with domestic responsibilities and emotionally rewarding rather than status-maximizing.

  Under this reading, women are not simply following innate preferences; they are responding to a feedback loop where the "neutral" requirements of the tech sector implicitly penalize those who anticipate bearing a disproportionate share of care work (which persists even in egalitarian states). The institution of the "free market" within a welfare state creates a new hierarchy: the "neutral" meritocratic track (engineering) becomes a preserve for those unburdened by secondary care duties, while the "care" track (education) becomes a ghettos for those who are. The segregation is not the absence of culture, but the result of culture reshaping itself around new institutional incentives.

  The conceptual stake for theories of justice lies in the definition of **agency and neutrality**. If one adopts the revealed-preference view, justice is procedural: it requires only the removal of formal barriers. To intervene in the resulting distribution would be to violate individual liberty and impose a paternalistic vision of the good life. However, if the structural-feedback view holds weight, then treating free occupational choice as the *endpoint* of equality is a category error. It assumes that the menu of choices is neutral when, in fact, the valuation and structure of those choices are socially constructed.

  The tension exposes a critical vulnerability in liberal egalitarianism: the risk that "institutional neutrality" functions as a camouflage for the reproduction of gendered outcomes. If the structures of high-prestige occupations are built around a masculine norm of unlimited availability, and the state treats this structure as a neutral market fact rather than a political choice, then "free choice" merely legitimizes the outcome. The paradox forces a confrontation with whether justice requires merely ensuring that women *can* become engineers, or whether it requires examining why the role of the engineer is structured in a way that systematically sorts men into it and women out of it, even in the absence of legal discrimination. To resolve the paradox in favor of revealed preference is to declare the current distribution of social goods as natural; to resolve it in favor of structural feedback is to admit that equality requires constant vigilance against the ways in which free institutions generate new forms of hierarchy.
