  # Decision Tree: Dietary Choices and Net Animal Suffering

  **Root Commitment:** "I want my dietary choices to reduce net animal suffering."

  ### Branch Nodes

  **Node 1:** Do wild animals' experiences of suffering and flourishing count morally alongside farmed animals?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2:** If meat production declines, is the freed land more likely to return to wilderness or remain in crop cultivation?
  *   **Wilderness (Typical of Beef/Pasture):** Go to Node 4.
  *   **Crop Cultivation (Typical of Chicken/Feed):** Go to Node 5.

  **Node 3:** Does an individual's dietary change measurably reduce the number of farmed animals slaughtered?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 4:** Is the average wild animal's life net negative due to predation, disease, and starvation?
  *   **Yes:** Go to Leaf 1.
  *   **No:** Go to Leaf 2.

  **Node 5:** Is crop cultivation net negative for wild animal welfare compared to the alternative land use?
  *   **Yes:** Go to Leaf 3.
  *   **No:** Go to Leaf 4.

  **Node 6:** Does the suffering saved in farmed animals outweigh the suffering caused by crop cultivation for human food?
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Leaf 6.

  **Node 7:** Are there non-animal welfare reasons (health, environment) sufficient to justify dietary change?
  *   **Yes:** Go to Leaf 7.
  *   **No:** Go to Leaf 8.

  ---

  ### Leaves (Positions)

  **Leaf 1: Pasture-Based Anti-Interventionism**
  *   **Argument:** Reducing beef production expands wilderness, which increases net suffering if wild lives are predominantly negative.
  *   **Awkward Commitment:** Implies we should maintain intensive grazing to suppress wild populations rather than rewilding land.

  **Leaf 2: Pasture-Based Conservationism**
  *   **Argument:** Reducing beef production expands wilderness, which increases net welfare if wild lives are predominantly positive.
  *   **Awkward Commitment:** Requires dismissing the severity of predation and disease as outweighing the benefits of existence.

  **Leaf 3: Crop-Based Anti-Interventionism**
  *   **Argument:** Reducing chicken production shifts land to crops that kill more wild animals (via harvest/pesticides) than pasture would.
  *   **Awkward Commitment:** Implies eating chicken is preferable to eating plants to spare wild field animals from harvesters.

  **Leaf 4: Crop-Based Land-Sharing Optimist**
  *   **Argument:** Reducing chicken production allows land use changes that support higher wild welfare than current crop monocultures.
  *   **Awkward Commitment:** Must value fragmented agricultural habitats over both wilderness and efficient land-sparing.

  **Leaf 5: Standard Utilitarian Veganism**
  *   **Argument:** Farmed animal suffering is certain and intense, outweighing speculative harms from crop production for human food.
  *   **Awkward Commitment:** Must accept that wild animal suffering is either negligible or morally irrelevant to the calculation.

  **Leaf 6: Farmed-Animal Skepticism**
  *   **Argument:** The wild animal suffering caused by the crops needed to replace meat calories outweighs the suffering of farmed animals.
  *   **Awkward Commitment:** Requires believing crop harvest kills more sentient beings than factory farming, a high empirical bar.

  **Leaf 7: Non-Moral Dietary Changer**
  *   **Argument:** Dietary change is justified by health or environmental concerns even if animal welfare impact is negligible.
  *   **Awkward Commitment:** Admits the dietary choice does not fulfill the root commitment to reduce animal suffering.

  **Leaf 8: Dietary Nihilist**
  *   **Argument:** Individual choices have no measurable impact on animal suffering or other moral goods.
  *   **Awkward Commitment:** Entails moral indifference to observable suffering due to perceived causal inefficacy.

  ---

  ### Structural Notes

  **Indistinguishable Leaves:**
  Leaves 2 and 5 both recommend reducing meat consumption, but the tree separates them by reasoning (Wild Welfare vs. Farmed Welfare Only). Students arriving at either leaf will take the same action but for incompatible theoretical reasons.

  **Unoccupied Combinations:**
  The combination "Wild Animals Count" + "Individual Choice is Inefficacious" is unoccupied. The tree routes all students who count wild animals into land-use questions (Nodes 2–5), assuming that if they care about wild welfare, efficacy is presumed for the sake of the theoretical dilemma. This path is unexplored because it leads to a paralysis similar to Leaf 8 but with moral concern intact.

  **Incoherent Combinations:**
  There are no strictly incoherent combinations, but Leaf 3 (Crop-Based Anti-Interventionism) is empirically unattractive to most ethicists because it requires believing pasture supports *more* wild life suffering than crop fields, which contradicts standard ecological density estimates.

  Leaf 5 is the most defensible position because it prioritizes certain, severe suffering in farmed animals over highly speculative and variable welfare calculations regarding wild animal populations.
