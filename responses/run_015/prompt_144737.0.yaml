      *   **Section 2: The Institutional Fallacy (The Bundling):** Focus on the confusion of administrative capacity with political restriction.
      *   **Synthesis/Link:** How Claim 1 reinforces Claim 2. Because we can't test the counterfactual (Claim 1), we accept the false bundle (Claim 2).
