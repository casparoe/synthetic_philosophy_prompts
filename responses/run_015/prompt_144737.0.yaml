  2.  **Deconstruct Claim 1: The Counterfactual Problem:**
      *   *Core Idea:* Authoritarians say, "Look how rich/stable we are." The rebuttal is, "Compared to what?"
      *   *Philosophical Angle:* Epistemology of political justification. To claim $X$ caused $Y$, you need to rule out $\neg X \rightarrow Y$.
      *   *The Trap:* Authoritarian systems suppress the alternative. You can't run a controlled experiment where the same society is democratic simultaneously.
      *   *The "Systematic Prevention":* It's not just that we don't know; it's that the structure prevents the knowledge from existing. This makes the claim unfalsifiable.
      *   *Connection to Legitimacy:* If legitimacy rests on a claim that cannot be tested, it rests on faith, not reason.

  3.  **Deconstruct Claim 2: The Separability/Bundling Fallacy:**
      *   *Core Idea:* Proponents say, "You need strong hands to build a clean bureaucracy."
      *   *Philosophical Angle:* Category errors and causal necessity.
      *   *The Fallacy:* Confusing *correlation* (or historical coincidence) with *conceptual necessity*.
      *   *The Separation:* Competence, rule of law, and meritocracy are functional goods. Political liberty is a structural good. They are not ontologically tied.
      *   *Democratic Counter-Example:* Conceptually, a democracy *can* have high capacity. To say it *can't* is to define democracy as inherently incompetent (which is false).
      *   *The "Bundling":* Authoritarians sell a package deal. The argument must show the components can be unbundled.

  4.  **Synthesize and Structure:**
