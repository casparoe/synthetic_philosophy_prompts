      *   **Topic:** Quine's rejection of the analytic-synthetic distinction.
      *   **Specific Conceptual Issue:** The difficulty of sustaining the idea that a formal axiom can be treated as a purely conventional definitional expansion once it becomes empirically entangled through holistic testing.
      *   **Constraint 1:** Show how conventionalism about stipulation conflicts with holism about confirmation.
