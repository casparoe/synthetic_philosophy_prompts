      *   Draft: The core issue is that treating a formal axiom as a mere linguistic convention becomes untenable when empirical failures in the broader theory force a revision of that very axiom, thereby collapsing the distinction between definitional truth and factual claim.

  5.  **Drafting the Reasoning:**
