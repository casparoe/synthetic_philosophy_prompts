  The core issue is that treating a formal axiom as a purely conventional stipulation becomes untenable when holistic confirmation requires that same axiom to bear empirical weight, thereby forcing a choice between pragmatic revision and dogmatic immunity. Consider a physicist who adopts Euclidean geometry as a definitional expansion of the concept "physical space," treating the parallel postulate as analytically true by linguistic convention. When this geometry is integrated with laws of gravitation to form a predictive theory, the entire system faces the tribunal of experience rather than individual statements. If observational data regarding light deflection conflicts with predictions, confirmation holism dictates that the physicist can restore coherence by revising any part of the web, including the geometric axiom itself. The possibility of revising the "definition" to accommodate experience demonstrates that its truth was not guaranteed by meaning alone, but was contingent on its utility within the empirical system. Insisting that the axiom remains a fixed convention despite empirical pressure requires introducing compensatory adjustments elsewhere in the theory, such as universal forces, which reveals that the choice to retain the axiom is pragmatic rather than logically compelled by its definitional status. Thus, the axiom cannot be sustained as a purely conventional expansion because its acceptance is no longer isolated from the empirical success of the total theory, blurring the line between stipulating meaning and asserting fact.
