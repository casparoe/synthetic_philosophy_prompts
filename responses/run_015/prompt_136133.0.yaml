answer: |-
  This workshop is practicing a highly specific, somewhat paradoxical, but theoretically coherent form of translation. To answer your questions directly: they are operating under a theory of **Functional Equivalence within Formal Rigor**, heavily influenced by **Reception Aesthetics** (Reader-Response), and they view the poem not as a static artifact but as a **speech act**.

  Here is a breakdown of the theoretical machinery required to make their practice hold together.

  ### 1. What theory of translation/poetry does this imply?

  Their practice rejects the idea that a poem is a vessel of historical data (semantic literalism) and rejects the idea that a poem is purely an aesthetic object divorced from its audience (New Criticism). Instead, they are working with a hybrid of **Skopos Theory** and **Performative Poetics**.

  *   **Skopos Theory (The Purpose Rules):** In translation studies (specifically Vermeer), *Skopos* argues that the purpose of the translation determines the methods used. The workshop's *Skopos* is not to teach students about 16th-century France, but to recreate the *effect* Marot had on his contemporaries. Marot was not writing for a museum; he was writing for a court that valued wit, clarity, and immediacy. Therefore, a translation that feels like a "museum label" fails the *Skopos*, even if it is accurate.
  *   **The Poem as Performance:** They treat the poem like a piece of music. The meter and rhyme scheme are the sheet music (which must be followed exactly), but the diction is the timbre of the instrument. If you play a jazz standard on a harpsichord to be "authentic" to the notes, you might actually ruin the song. They believe the "music" of the verse (the form) is timeless, but the "voice" (the diction) must be contemporary to be heard clearly.

  ### 2. Form vs. Content vs. Spirit

  You asked if they assume form and content are separable, or if there is a "spirit" living in the tone. The answer is a nuanced **No** to the first and a **Yes** to the second, with a caveat.

  They do **not** treat Form and Content as fully separable. If they did, they would allow free verse translations that capture the meaning. The fact that they demand exact syllable counts and rhymes means they believe **Form is Constitutive of Meaning.** You cannot have a Marot poem without the *rondeau* or the *décasyllabe*.

  However, they **do** treat **Semantic Content (imagery/references)** as separable from **Tonal Content (voice/register).**

  *   **The Theory:** They are operating on the belief that **Tone *is* the primary Content.**
  *   In Marot's verse, the "point" isn't usually the specific metaphor (e.g., "my lady's eyes are like stars"); the point is the *way* the speaker relates to the subject (e.g., "I am charmingly obsessed with my lady").
  *   By allowing the swap of period references for modern ones, they are arguing that the **semantic imagery is disposable scaffolding** used to build the **tonal experience**.
  *   Therefore, they aren't smuggling in a vague "spirit." They are making a hardheaded calculation: *The specific noun is less important than the syntactic velocity and the register of voice.*

  ### 3. Is the rejection of archaism consistent with formal preservation?

  This is the crux of your inquiry. On the surface, it looks contradictory: *Why keep the 16th-century rhythm but ban 16th-century words?*

  However, this is actually **consistent** if you adopt a **Reader-Response framework** (specifically Hans Robert Jauss's "Horizon of Expectations").

  *   **The Argument for Consistency:** When Marot wrote these poems, the language was *not* archaic to his readers. It was current, slangy, and immediate. The "breezy voice" was only possible because he was using the living language of his day.
  *   **The Contradiction of "Authenticity":** If you use archaic diction ("thee," "thou," inverted syntax) to match the archaic form, you are creating a **double distance**. You are making the poem feel old in *structure* AND old in *language*. This turns the poem into a period piece.
  *   **The Workshop's Logic:** To be truly faithful to Marot's **original context**, you must be unfaithful to Marot's **text**. You must replicate the *relationship* the original audience had with the poem (intimacy, immediacy, recognition).
  *   **Smuggling Reader-Response:** You are correct that they are smuggling in Reader-Response theory. They are admitting that a poem does not exist in a vacuum; it exists in the collision between text and reader. If the reader feels "distance" (due to archaism), the poem has failed to function as a poem.

  ### The Underlying Philosophy: "Radical Domestication"

  Lawrence Venuti, in *The Translator's Invisibility*, critiques "domestication" (making a text read like an original in the target culture) as ethically dubious because it erases the foreignness of the source.

  This workshop is practicing **Ethical Domestication**. They would argue that because Marot's poetry relies on *proximity* and *wit*, preserving the "foreignness" (archaism) actually betrays the author's intent more than updating the slang does.

  **Summary of their Theoretical Stance:**
  1.  **Ontology of the Poem:** A poem is a **speech act**, not an artifact. Its being is in its doing.
  2.  **Fidelity:** Fidelity is owed to the **experience** of the original audience, not the **lexical data** of the original text.
  3.  **Form:** Form is the **skeleton** (inviolable); Diction is the **skin** (must be living, not taxidermied).
  4.  **Translation Goal:** To produce a poem that stands on its own in the target language with the same *social function* as the source poem had in its own time.

  They are essentially saying: **"Marot was a pop star, not a monument. Treat him like a pop star."** A pop star covered by a new artist doesn't sing in the original singer's dialect; they sing in their own voice, but they keep the melody. That is exactly what this workshop is doing.
