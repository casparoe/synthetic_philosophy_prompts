  Brainstorming: QTL shifts focus from ontological states to pragmatic outputs. Tolerances introduce values, violating truth's objectivity. R3 conflicts with error metrics under nonlinear transforms; units matter. R4 risks overfitting to Q. Realism requires global truth, QTL is local. Collapse avoided technically but conceptually vacated. Is it verisimilitude or utility? Distinction blurs. Language dependence moves to metric choice. Extrapolation unjustified by local fit. The finite set Q blocks infinite consequences but also blocks global assessment. We trade logical rigor for engineering utility. The notion of truth becomes implicit in the target values, but the ordering is driven by stakes. This looks like expected utility maximization disguised as epistemology.

  The proposal offers a pragmatic resolution to the logical problem by restricting the domain of assessment, but this restriction fundamentally alters the philosophical category of the evaluation. The following implications detail how this shift affects the coherence of truthlikeness and the realist commitments underlying scientific inquiry.

  **QTL measures pragmatic fitness rather than ontological closeness, converting a semantic problem into a decision-theoretic one.**
  The introduction of tolerances and stakes into the ordering criterion means that the ranking of models depends on human interests rather than solely on the structure of reality. Truthlikeness was intended to be a mind-independent relation between a proposition and the world; a theory is closer to the truth regardless of whether we care about its predictions. By weighting errors according to the stakes attached to each query, the agency makes the ordering sensitive to the cost of being wrong, not just the fact of being wrong. Consequently, M1 can be Q-closer than M2 for flood defence but Q-further for ecological impact, even if the physical reality remains unchanged. This confirms that QTL is a measure of utility or adequacy-for-purpose, not verisimilitude. The pragmatics of the decision are doing the work that truth was supposed to do, rendering the label truthlikeness misleading.

  **Requirements R2 and R3 jointly fail to eliminate language dependence, merely relocating it to the choice of tolerances and metrics.**
  The classical language-dependence objection noted that truthlikeness orderings could flip under logical rephrasing. QTL attempts to block this via reparametrisation invariance (R3), but this is mathematically incompatible with fixed tolerances under nonlinear transformations. A tolerance of five centimetres in water stage does not correspond to a fixed tolerance in discharge or energy head due to nonlinear rating curves. Tightening a tolerance or splitting a query (R2) changes the weight of that region in the cardinal sum, effectively allowing the analyst to gerrymander the ranking by adjusting the granularity of $Q$. Dependence has not vanished; it has migrated from the logical vocabulary to the metric structure and the coarse-graining of the query set. The ordering remains sensitive to how the problem is framed, violating the objectivity required for genuine truthlikeness.

  **The epistemological problem is solved only by lowering the ontological target, conflating estimable accuracy with unobservable truthlikeness.**
  Requirement R4 demands estimability from noisy data, which is achievable for predictive accuracy on $Q$ but not for closeness to the truth simpliciter. By defining truthlikeness relative to a finite set of measurable queries, the proposal makes the property epistemically accessible only because it has been reduced to empirical adequacy on specific tests. If models are tuned against this fixed query set, the estimator converges to performance on $Q$, not to closeness to the underlying physical dynamics. We gain tractability by sacrificing the very thing that made truthlikeness philosophically interesting: the ability to rank theories even when the truth is unknown or unmeasurable. The epistemological problem is not solved; it is dissolved by redefining the target as something we can already measure.

  **Query-relativity undermines the realist's explanatory appeal, reducing the approximate truth of theories to local instrumental reliability.**
  Scientific realists argue that the success of mature theories is best explained by their approximate truth. QTL cannot bear this weight because it is inherently local to the chosen queries. A model might be Q-closer because it fits the peak water level but completely misrepresents the flow physics. If the agency uses QTL to license extrapolation to unobserved scenarios, such as a one-in-two-hundred-year event, they assume that fit on $Q$ implies structural correctness. However, QTL provides no guarantee of this; it only guarantees fit on the test set. This supports an empiricist or instrumentalist view where models are tools for prediction rather than descriptions of reality. The realist's claim that science progresses toward the truth is replaced by the claim that science progresses toward better tooling for specific tasks.

  **The logical problem is sidestepped rather than solved, as the ordering applies to model outputs rather than propositions about possible worlds.**
  The classical logical problem concerned the ordering of propositions based on their content and consequences relative to the whole truth. QTL avoids the collapse result by finitizing the consequence set (R1), but this avoids the difficulty by changing the subject. The ordering is no longer between theories as claims about the world, but between simulations as generators of data. The hard work of defining a distance metric between possible states of the world—which was the promise of the likeness approach—is replaced by defining error metrics on output variables. Progress on the logical problem requires accounting for how false propositions relate to the truth in virtue of their content, not merely how their outputs relate to targets. QTL leaves the logical problem untouched, addressing only the engineering problem of model selection.

  **Capping normalized errors at one discards crucial information about the magnitude of falsity, reintroducing a coarse-grained binary within the false.**
  The normalization rule caps the error ratio at one, meaning any deviation exceeding the tolerance counts equally as the maximum error. This creates a cliff-edge effect where a model missing by six centimetres is ranked equally with one missing by five metres, provided both exceed the five-centimetre tolerance. While this stabilizes the metric against outliers, it violates the intuition behind truthlikeness that some falsehoods are much worse than others. A theory that is wildly false should be ranked lower than one that is slightly false, even if both are technically false. By treating all failures beyond tolerance as equivalent, QTL loses the granularity it sought to gain over plain truth, collapsing back into a coarse distinction between acceptable and unacceptable performance.

  The single most load-bearing undefended assumption in the proposal is that the finite query set $Q$ is structurally representative of the underlying physical dynamics such that optimization on $Q$ guarantees convergence on the system's true behavior outside $Q$. This assumes that the map is the territory: that fitting the symptoms ensures fidelity to the cause. Without this assumption, the license to extrapolate to unobserved scenarios is unjustified, and QTL remains merely a measure of interpolation accuracy.

  \answer{does not escape}
