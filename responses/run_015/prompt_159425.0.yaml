answer: |-
  Here is a design for a 90-minute workshop session. It is built to be run exactly as written, with no lecture component until the final debrief. The mechanics force the moral grammar into the physical actions and stakes, bypassing the forbidden vocabulary.

  ### Workshop Title: The Sluice and The Key
  **Time:** 90 Minutes
  **Participants:** 11 Writers
  **Materials:** 11 Envelopes (Role Cards), 1 Projected Timer, Paper/Pens, A physical object (a heavy key or iron bar) placed in the center of the table.

  ---

  ### Part 1: The Setup (10 Minutes)

  **The Constraint:**
  Hand out a small card to each participant immediately. Read this aloud:
  *"During the discussion, the following words are banned. If you say one, you must stop speaking for 60 seconds. The words are: Rule, Duty, Conscience, Should, Ought, Right, Wrong, Moral, Guilt, Responsibility."*

  **The Premise:**
  "You are the town council of a river town. You are sitting at this table. Outside, the river is rising. There is a sluice gate that controls the flow through the town. There is a Warden who holds the key. The Warden is not here."

  **The Clock:**
  Project a timer.
  *   **Round 1:** 35 Minutes total. (20 min discussion, 15 min writing).
  *   **Round 2:** 35 Minutes total. (20 min discussion, 15 min writing).
  *   **Debrief:** 20 Minutes.

  ---

  ### Part 2: Round 1 — The Flood (35 Minutes)

  **The Scenario:**
  Rain has been falling for three days. The river is at the lip of the embankment.
  *   **The Threat:** In 20 minutes (real time), the water will breach. It will not kill anyone, but it will soak the cellars of the lower town.
  *   **The Mechanism:** The sluice gate can be forced open with the iron bar on the table. This will lower the water level safely.
  *   **The Constraint:** The Town Bylaw states: *'Only the Warden may operate the sluice.'*
  *   **The Fact:** Everyone knows the Bylaw is obsolete. It was written for a wooden gate replaced ten years ago. The Warden is 40 minutes away. He will be too late.

  **The Cards (Distribute now):**
  Each envelope contains a **Role**, a **Stake** (what they lose if the cellar floods), and a **Private Fact**.

  1.  **Baker:** Stake: Sourdough starter in cellar (5 years old). Fact: You know the lock snaps if forced too hard.
  2.  **Clerk:** Stake: Deeds in the archive. Fact: You have a copy of the key, but using it voids your bond.
  3.  **Deputy:** Stake: Uniform in locker near river. Fact: You promised the Warden you'd keep the peace.
  4.  **Newcomer:** Stake: Furniture in basement. Fact: If you speak too loudly, you look like an agitator.
  5.  **Doctor:** Stake: Insulin in the clinic fridge (power might cut). Fact: You know the water won't actually reach the clinic.
  6.  **Teacher:** Stake: School records. Fact: You believe the Bylaw exists to keep children safe from the gears.
  7.  **Mechanic:** Stake: Tools in workshop. Fact: You could fix the lock later, but it costs money the town doesn't have.
  8.  **Elder:** Stake: Photo albums. Fact: You remember the last time someone forced a gate; the surge broke a window.
  9.  **Shopkeeper:** Stake: Canned goods. Fact: You profit if others lose stock (prices rise).
  10. **Parent:** Stake: Child's toys. Fact: Your child is playing near the riverbank.
  11. **Priest:** Stake: Church vestments. Fact: You believe suffering cleanses, but you won't say it.

  **The Action:**
  1.  **Discuss (20 mins):** You must decide as a group: Do we force the gate now, or wait for the Warden?
  2.  **The Clock:** At T-10:00, announce: *"The water is touching the steps."* At T-0:00, announce: *"The cellars are wet."*
  3.  **Write (15 mins):** Write a 300-word scene fragment from your character's perspective during the discussion.
      *   **Focus:** Describe what your character *touches*, *looks at*, or *hears*. Do not describe what they think.
      *   **Ending:** Two sentences on what your character noticed about the person next to them. (e.g., *"The Baker kept wiping his hands on his apron. The Deputy didn't look at the bar."*)

  ---

  ### Part 3: Round 2 — The Key (35 Minutes)

  **The Inversion:**
  Collect the iron bar. Reset the timer.
  *"The flood has passed. The cellars are dry because you forced the gate. The lock is broken. The Warden has resigned in protest. There is no Bylaw now. There is no Warden."*

  **The Scenario:**
  A drought is coming next month. The river will be low. The sluice gate must be managed carefully to ensure upstream farmers and downstream townfolk both get water.
  *   **The Threat:** Scarcity. If one person takes too much, the rest get none.
  *   **The Mechanism:** The iron bar is on the table. Whoever holds the bar controls the water.
  *   **The Decision:** Do we give the bar to one person (the one who knows how to use it), or do we lock it away until a committee agrees?

  **The Cards (New Envelopes):**
  Keep the same Roles, but swap the **Stake** and **Private Fact**.

  1.  **Baker:** Stake: Needs water for dough. Fact: You broke the lock last time; you know how it works.
  2.  **Clerk:** Stake: Needs water for cleaning. Fact: You fear the person who holds the bar will become the Mayor.
  3.  **Deputy:** Stake: Needs water for station. Fact: You want the authority, but not the blame.
  4.  **Newcomer:** Stake: Needs water for garden. Fact: If you don't get water, you will move away.
  5.  **Doctor:** Stake: Needs water for sterilization. Fact: You believe you deserve priority for saving lives.
  6.  **Teacher:** Stake: Needs water for school. Fact: You want the rule to be written down, not spoken.
  7.  **Mechanic:** Stake: Needs water for cooling. Fact: You trust the Baker, but not the Deputy.
  8.  **Elder:** Stake: Needs water for hygiene. Fact: You know the Baker will favor his friends.
  9.  **Shopkeeper:** Stake: Needs water for stock. Fact: You will sell water if there is a shortage.
  10. **Parent:** Stake: Needs water for children. Fact: You will fight anyone who denies your child.
  11. **Priest:** Stake: Needs water for rites. Fact: You believe the water belongs to God, not the town.

  **The Action:**
  1.  **Discuss (20 mins):** You must decide: Who holds the bar? Or does no one?
      *   *Note:* The "American" move here is claiming the bar based on competence/need (Conscience/Authority). The "German" move is locking the bar away (Rule/Equality).
  2.  **The Clock:** At T-10:00, announce: *"The river is dropping."* At T-0:00, announce: *"The upstream farmers have closed their gates."*
  3.  **Write (15 mins):** Write a 300-word scene fragment from your character's perspective during this discussion.
      *   **Focus:** Describe the *distance* between people. Who reaches for the bar? Who leans back?
      *   **Ending:** Two sentences on what your character noticed about the *silence* in the room.

  ---

  ### Part 4: The Debrief (20 Minutes)

  **Do not ask "Who was right?"** Ask the following questions in order:

  1.  **The Forbidden Words:** "Who heard someone almost say 'Responsibility' or 'Right'? What were they trying to describe?"
      *   *Point:* When we ban the ethics vocabulary, we are forced to describe the *cost*.
  2.  **The Object:** "In Round 1, the bar was a tool. In Round 2, the bar was a scepter. When did you feel that change?"
      *   *Point:* This maps to the User's insight: Breaking the rule in Round 1 was heroic (tool). Claiming the authority in Round 2 is political (scepter).
  3.  **The Protection:** "In Round 1, the Rule threatened to drown your cellar. In Round 2, the Rule (or lack of it) threatened to drown your neighbor. Which felt heavier?"
      *   *Point:* Round 1 protects from Nature. Round 2 protects from Neighbors.
  4.  **The Fragment:** Have two people read their "Two Sentences" from Round 1 and Round 2.
      *   *Point:* Highlight the shift from noticing *water/things* to noticing *power/people*.

  **Closing Statement (Read this):**
  "In Round 1, the person who broke the rule saved us from the water. In Round 2, the person who refused the bar saved us from the person who broke the rule. Neither saved us completely. One kept the cellars dry. The other kept the table level. You do not have to choose which one your character is. You only have to record what they lost."

  ---

  ### Failure Analysis: What Will Go Wrong

  1.  **The Puzzle Solvers:** The crime writers will try to "fix" the lock or find a loophole to avoid the moral tension.
      *   *Fix:* If they propose a technical solution, remind them: *"The mechanism is binary. Open or Closed. Bar or No Bar."*
  2.  **The Vocabulary Slip:** Someone will say "We have a responsibility to..."
      *   *Fix:* Ring a bell. Make them stand up and sit down. Keep it physical.
  3.  **The Villain Drift:** In Round 2, the person holding the bar might be painted as a tyrant.
      *   *Fix:* Remind them during the brief: *"The person who takes the bar is doing it to save water, not to steal it. Their conscience is clean."*
  4.  **The Passive Rule:** The "German" stance (wait/lock it away) might feel like cowardice.
      *   *Fix:* In the debrief, emphasize that *refusing power* is an active choice that protects the weak from the strong.
  5.  **Time Creep:** 90 minutes is aggressive.
      *   *Fix:* Be ruthless with the timer. Cut the writing time to 10 mins if discussion drags. The friction is the point.

  ### Limitations: What This Exercise Cannot Do

  You must say this out loud at the very end:

  1.  **It Cannot Simulate History:** This is a game of 90 minutes. It cannot replicate the weight of generations of trust that makes the "German" stance feel like safety rather than oppression.
  2.  **It Cannot Resolve the Pain:** The design ensures both sides lose something (Cellars get wet OR Trust gets broken). Do not try to comfort them that "communication would have helped." The point is that communication *is* the conflict.
  3.  **It Is Not Your Novel:** This is a gym exercise. It isolates the muscle of moral ambiguity. It will not solve the plot hole in your Hesse/New York manuscript. It will only give you the vocabulary of objects to write it.

  ### Why This Design Works for Your Problem

  *   **The Inversion:** Round 1 makes the "American" move (Conscience) necessary and good. Round 2 makes the "American" move (Authority) dangerous and isolating.
  *   **The Grammar:** By banning the words *Rule* and *Conscience*, they cannot argue philosophy. They must argue about *cellars* and *keys*. This forces the morality into the subtext, which is where your novel lives.
  *   **The Second Half:** It addresses your specific fear. In Round 2, the "Conscience" move isn't solitary heroism; it is a demand for submission from the group. The "Rule" move isn't submission; it is a refusal to let one neighbor judge another.
  *   **The Output:** The "Two Sentences" requirement forces them to look at the *other* person, not their own internal justification. This generates the "Neither is the villain" perspective you need.
