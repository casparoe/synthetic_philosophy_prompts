answer: |-
  First off, your idea isn't daft at all. "Mnemonic drift" is a sharp observation, and honestly, it captures a nuance that often gets lost when people casually cite Hobsbawm or Anderson. You've identified a mechanism of national identity that is passive, incremental, and bureaucratic, rather than active, revolutionary, or technological.

  Here is my honest take on how your concept stacks up against the two heavyweights, and whether it's just a repackaging of their ideas.

  ### Hobsbawm: The Problem of the "Inventor"
  Hobsbawm's *The Invention of Tradition* is the obvious starting point, but you're right to be skeptical about whether it covers "drift."

  Hobsbawm is fundamentally interested in **agency and function**. When he talks about invention, he is usually pointing to a specific moment or period where elites (state builders, military leaders, colonial administrators) realized they needed social cohesion and *engineered* a ritual to get it. There is a "before" (no tradition) and an "after" (tradition exists).

  **Where he misses your point:**
  Hobsbawm's framework implies a certain level of intent. Even if they aren't "lying," the actors in Hobsbawm's world are *doing* something. They are building a monument, writing a anthem, or standardizing a ceremony. Your concept of "mnemonic drift" is about what happens *after* the monument is built. It's about how the plaque gets weathered, how the tour guide script gets shortened by 10% every decade, or how a school board quietly swaps one historical figure for another because the old one is "too complex" for the new curriculum standards.

  Hobsbawm explains the **launch**, but he doesn't really explain the **maintenance**. He assumes the tradition, once invented, does its job. He misses the entropy. He misses the idea that the "villain" isn't a manipulative elite, but rather bureaucratic inertia, budget cuts, or generational indifference. So, Hobsbawm is too "active" for your theory.

  ### Anderson: The Problem of the "Medium"
  Anderson's *Imagined Communities* is broader. He argues that nations are imagined because people who will never meet feel a bond, largely facilitated by print capitalism (novels, newspapers) which created a sense of "simultaneous time."

  **Where he misses your point:**
  Anderson is obsessed with the **container**, not the **content**. He explains *how* we are able to imagine ourselves as a nation (through shared language and media), but he is less concerned with the specific historical narrative inside that imagination.

  While Anderson does touch on institutions like museums and censuses (especially in later editions), his focus remains on how these things categorize people to make the nation legible. He doesn't dwell on the slow, quiet editing of the story. Anderson's theory is structural; it's about the architecture of the nation. Your theory is curatorial; it's about the changing exhibits inside the building.

  Furthermore, Anderson's reliance on "print capitalism" feels a bit too technological for "mnemonic drift." Your drift happens in school board meetings, museum funding allocations, and local council zoning decisions. It's administrative, not necessarily media-driven. Anderson explains why we read the same newspaper; you're explaining why the history chapter in that newspaper's educational supplement changed subtly between 1980 and 2020.

  ### So, is "Mnemonic Drift" just one of them in disguise?
  No. I don't think it is.

  If you use Hobsbawm, you risk implying there was a moment of deliberate construction that is being preserved. If you use Anderson, you risk implying the shift is driven by changes in media or the structure of imagination.

  **"Mnemonic drift" points to something neither handles well: Institutional Memory Decay.**

  Hobsbawm and Anderson are both trying to explain the **genesis** of nationalism. Hobsbawm says, "Elites built it." Anderson says, "Culture and print allowed it." You are asking, "How does the story slide sideways once the nation is already established?"

  Your concept aligns more closely with later work in **Collective Memory studies** (like Maurice Halbwachs or Pierre Nora), but even they often focus on *sites* of memory or the *social frameworks* of memory. Your specific angle on "bureaucratic forgetting without a villain" is a valuable distinction. It suggests that national identity isn't just forged (Hobsbawm) or imagined (Anderson); it is **gardened**. And gardeners don't always plant new seeds deliberately; sometimes they just stop watering certain plants, and those die off, changing the shape of the garden without anyone ever picking up an axe.

  ### The Verdict
  Between the two, **Hobsbawm is closer** simply because he deals with institutions (schools, rituals, state ceremonies) rather than Anderson's focus on media and consciousness. However, Hobsbawm is too cynical and deliberate for your needs.

  Your "mnemonic drift" fills a gap they both leave open. They explain how the story starts; you're explaining how the story edits itself. It's not a disguise of their work; it's a necessary refinement. It moves the conversation from "Who invented this?" to "Who stopped caring about that?" which is a much more accurate description of how modern national identities actually evolve in stable democracies.

  Keep the term. It does work that the other two don't.
