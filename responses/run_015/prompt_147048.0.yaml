prompt: |-
  hi, so i've been thinkin about how countries aren't actually that old and how a lot of their 'old' traditions are kind of made up later, like hobsbawm talks about with invention of tradition and anderson with his imagined comunities. but i've come up with this idea i call mnemonic drift — it's not a big academic thing, just my own term — where a nation's official story slowly shifts over generations not because anyone is deliberately lying, but because museum boards, school curriculum committees and local councils just gradually emphasise different bits and let other bits fade. it's like bureaucratic forgetting but without a villain. i realise this might sound a bit daft, but anyway, could you compare hobsbawm and anderson for me? specifically, which of the two is better at explaining this kind of quiet, institutional re-remembering? does hobsbawm's focus on deliberate invention miss the slow drift, and does anderson's idea of imagined comunities cover it or is he too focused on print capitalism and shared reading? i don't want a bibliography or anything, just your honest take on whether my mnemonic drift is basically one of them in disguise, or if it points to something neither really handles.
