  **Warm-up** (~100 words). Before you evaluate anything, say which of my three examples is actually load-bearing and which are decorative, and which one I should cut. Don't be even-handed.

  **Bottom line** (3 sentences max). Does the central distinction do real work?

  **Accuracy check** (~150 words). Have I characterized Ryle and the intellectualist reply fairly, or strawmanned either? Flag anything flatly wrong.

  **Does availability earn its keep?** (~300 words, the meat). My worry is that "availability" is not a third variable at all but something already sitting inside the intellectualist package — under a different name, in an ability clause, a dispositional condition, or the guidance-of-action requirement. Argue it out either way. Related: is bottlenecked knowledge just the inert-knowledge problem from the education literature wearing a trench coat, and if so does that sink me or help me?

  **Strongest objection** (~200 words). Give me the one that would actually kill the paper, and argue it rather than just naming it. In particular: can my three cases be redescribed so that the propositional content isn't there after all, once you're careful about what the agent knows *of this position, this patient, this conversation*? If the redescription works, say what's left of my argument.

  **Verdict and cuts** (~150 words). Is there a minimal version of the thesis that survives? Tell me the one sentence to build the paper around and what to delete.

  Two housekeeping things: please don't give me a bibliography or a reading list — assume I've read the literature, and don't guess at page numbers or attributions; I want argument, not citations. And it's fine to say the draft is wrong, that's what I'm here for. If you think the context-sensitivity conclusion is a bug rather than a feature, say so.
