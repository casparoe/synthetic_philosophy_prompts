  An intellectualist will redescribe your cases to save the thesis. In the chess case, they'll say the player doesn't know the proposition "how to move *here* *now*" under a practical mode. They know the general rule, but not the specific instance required for action. The bottleneck isn't access; it's content granularity. If the proposition must be singular and time-indexed to guide action, the player lacks that specific knowledge under pressure. If this redescription works, your bottleneck collapses into a lack of propositional knowledge. What's left of your argument? Only the claim that we *attribute* knowledge differently based on pressure. You'd be forced to retreat to a pragmatic account: the state is constant, but we stop calling it "knowledge-how" when reliability drops. That weakens your metaphysical claim significantly. You'd no longer be saying the state changes, only that our labels do. Prepare for this: argue that the psychological state itself degrades under stress, not just our attribution of it. If the state degrades, you need a mechanism. Is the proposition lost? Or is the link to action severed? If the link is severed, you're back to ability. If the proposition is lost, you're back to standard intellectualism. You need a third option.

  **Verdict and cuts**
  There is a minimal version here: focus on knowledge-how *attributions* being sensitive to performance reliability, not the metaphysics of the state itself. Build the paper around this sentence: "Knowledge-how attributions track reliable availability under performance conditions, not merely propositional possession." Delete the claim that this solves the Rylean regress; it doesn't, it sidesteps it. Delete the L2 example. Stop trying to redefine knowledge itself; argue instead that the debate has ignored the performance conditions required for successful attribution. This makes the paper a intervention in the pragmatics of skill attribution rather than a metaphysical overhaul, which is much more defensible. You survive by lowering your metaphysical stakes.
