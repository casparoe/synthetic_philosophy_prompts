answer: |-
  Based on the five cases you've provided, your friend is operating under a specific philosophical framework known in aesthetics as **Moderate Moralism** (specifically a version close to Berys Gaut's "Ethicism" or Noel Carroll's "Moderate Moralism"), but refined by a principle of **Functional Relevance**.

  Here is the breakdown of her machinery, the prediction for the photographer, the alternative rules, and the implications for your board.

  ### 1. The Machinery: Functional Relevance
  Your friend is not an **Autonomist** (who believes art and morality are separate spheres, which Case 1 and 3 disprove) nor a **Radical Ethicist** (who believes any moral flaw makes art bad, which Case 2 and 4 disprove).

  Her rule is: **A moral property affects artistic value if and only if it is functionally relevant to the work's aesthetic success.**

  *   **Case 1 (Propaganda):** The immorality (contempt) is the *engine* of the aesthetic effect (power). Because the art succeeds *by* being immoral, the immorality is an aesthetic defect. (Functional Relevance: High).
  *   **Case 2 (Novel):** The immorality (sexist sentence) is a *glitch*. It doesn't help the plot or style. It is a moral defect that counts as a small aesthetic blemish because it is part of the text, but it doesn't undermine the whole. (Functional Relevance: Low).
  *   **Case 3 (War Film):** The immorality (aestheticizing torture) contradicts the work's stated aim (condemning torture). This creates internal incoherence. (Functional Relevance: High/Negative).
  *   **Case 4 (Singer):** The immorality (abuse) is *external* to the work. The songs do not require the abuse to exist, nor do they register it. (Functional Relevance: None).
  *   **Case 5 (Memoir):** The morality (honesty) is the *point* of the work. It is constitutive of the aesthetic achievement. (Functional Relevance: High/Positive).

  **The Prediction:**
  She will say the photographer's work is **aesthetically flawed** (or "good art that is compromised").

  **Why:** Unlike Case 4 (where the abuse was biographical and unrelated to the songs), the photographer's deceit is **constitutive** of the aesthetic merit. You stated: *"the intimacy is exactly what makes the photographs great, and the intimacy is exactly what he took without asking."*
  The aesthetic value (intimacy) is causally and structurally dependent on the moral defect (deceit). Once the deceit is known, the "intimacy" is revealed to be a violation. The work asks the audience to admire a connection that is fundamentally false. This creates an internal incoherence similar to Case 3 (the film that defeats its own aim). The work claims to offer truth ("true to what their lives were like") but is founded on a lie. For her, that makes it aesthetically dishonest, not just morally wrong.

  ### 2. Alternative Rules & The Tie-Breaker
  Two other rules fit Cases 1–5 perfectly but would disagree on Case 6.

  **Rule A: The Causal Necessity Rule**
  *   *Definition:* If the artwork *could not exist* without the moral defect, the art is aesthetically tainted.
  *   *Fits 1–5:* Propaganda needs contempt (1); Novel doesn't need the sentence (2); Film needs the cheering scenes (3); Songs don't need the abuse (4); Memoir needs the honesty (5).
  *   *Disagrees on 6:* This rule would say the photos are **bad art** because the lie was necessary for the book to exist.
  *   *Her Likely View:* She might disagree. In Case 4, if the singer *needed* to abuse people to feel the grief he sang about, she might still say the songs are good (focusing on the artifact, not the genesis).

  **Rule B: The Manifestation Rule**
  *   *Definition:* Moral defects only matter if they are *visible or audible within the work itself*.
  *   *Fits 1–5:* Contempt is visible (1); Sentence is visible (2); Cheering is visible (3); Abuse is not visible (4); Honesty is visible (5).
  *   *Disagrees on 6:* The prompt says *"nothing in the images hints that he lied."* Under this rule, the photos are **good art** (like Case 4) because the lie is in the process, not the pixels.
  *   *Her Likely View:* She will likely reject this. She cares about the *logic* of the work, not just the sensory data. The "intimacy" is a quality of the work, and that quality is tainted by the process.

  **The Tie-Breaker Case:**
  To distinguish her view from Rule A (Causal Necessity) and Rule B (Manifestation), present her with this case:

  > **The Slave Cathedral:** A magnificent cathedral is built using slave labor. The slavery was essential to its completion (it could not have been built otherwise). However, there is no inscription, symbol, or architectural feature that references the slavery; a viewer cannot tell how it was made just by looking.
  >
  > **Question:** Is the cathedral aesthetically flawed *because* of the slavery?

  *   **If she says "Yes" (Flawed):** She follows **Causal Necessity**.
  *   **If she says "No" (Good Art):** She follows **Manifestation** or **Functional Relevance** (since the slavery doesn't change the viewer's experience of the light/space).
  *   **My Prediction of Her:** She will say **"No, it is good art."** (Aligning with Case 4).
  *   **Why this separates Case 6:** In the Cathedral case, the slavery is a *condition of production* but not a *condition of the aesthetic experience* (the beauty of the arches doesn't rely on the pain). In the Photographer case, the *intimacy* (the aesthetic experience) *is* the result of the deceit. The deceit is "manifest" in the intimacy itself.

  ### 3. The Town's Reaction: Signal or Noise?
  For the question **"Is it good art?"**, the town's gladness and the subjects' refusal are **noise**.
  Your friend's framework is internalist. She judges the relationship between the work's aims and its moral properties.
  *   The town's gladness is a *consequence* (utilitarian outcome).
  *   The subjects' refusal is a *right* (deontological claim).
  Neither changes the *structural coherence* of the photographs. In Case 4, she didn't ask if the victims forgave the singer; she judged the songs on their own terms. In Case 1, she didn't ask if the minority group was harmed; she judged the film's design.

  However, for the question **"What ought we to do?"**, this data is **signal**.

  ### 4. The Board Vote (Excerpt & Review)
