      *   No citations/authors? (Checked).
      *   Flag empirical claims? (Will do).
      *   Brainstorm first? (Yes).
      *   Memo approx 900 words? (Will monitor).
      *   Bundle/Split recommendation? (Split).
      *   Sunset review? (Included).
      *   Strongest losing consideration? (Compulsion/Turnout).

  5.  **Final Polish:** Check the flow between brainstorm and memo. Ensure the philosophical frame is clear in the memo. Make sure the "proxy" rejection is sharp (parents already vote). Make sure the "compulsion" rejection is sharp (signal vs. noise).

      *Self-Correction on Word Count:* 900 words is tight for all that content. I need to be concise in the brainstorm and substantial in the memo.
      *Self-Correction on Frame:* "Stakeholder Governance" is good. It distinguishes between "membership" (citizenship) and "affectedness" (residency). It distinguishes between "capacity" (16yo) and "dependency" (proxy).

