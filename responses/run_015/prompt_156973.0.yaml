          *   **Step 1:** Short brainstorm (6-8 candidate framings, implications, chosen frame + why it beats rival).
          *   **Step 2:** The Memo (approx. 900 words).
          *   **Memo Structure:** Bottom line up front (bundle/split, timeline, sunset), the frame in plain language, the four items, final section (strongest losing consideration + why overriding).
          *   **Tone:** Committed, arguable, not even-handed ("no 'the commission may wish to consider'").
          *   **Constraints:** No web access, no specific citations/authors, flag empirical claims in brackets.
          *   **Constraint Check:** The user asked me to "First do a short brainstorm... Then give me the memo itself."

  2.  **Brainstorming Framings (Step 1):**
      *   *Framing 1: Voting as Membership.* (Citizenship-based). Implication: No non-citizens, no kids. Pro: Clear boundary. Con: Excludes affected interests.
      *   *Framing 2: Voting as Affected Interests.* (All who are governed). Implication: Yes to non-citizens, yes to kids (maybe proxy). Pro: Democratic legitimacy. Con: Boundaries blurry (tourists? commuters?).
      *   *Framing 3: Voting as Civic Duty/Public Good.* (Compulsion okay). Implication: Yes to compulsory attendance. Pro: High turnout, representative sample. Con: Coercion, uninformed votes.
      *   *Framing 4: Voting as Individual Expression.* (Liberty-based). Implication: No compulsion. Pro: Autonomy. Con: Low turnout, skew.
      *   *Framing 5: Voting as Household Representation.* (Family unit). Implication: Yes to proxy for kids. Pro: Parents care about future. Con: Dilutes individual agency, double counting.
      *   *Framing 6: Voting as Competence.* (Epistemic democracy). Implication: No 16-year-olds, no compulsion. Pro: Quality decisions. Con: Elitist, hard to measure.
      *   *Framing 7: Voting as Future-Stewardship.* (Intergenerational). Implication: Yes to 16yo, yes to proxy. Pro: Long-term planning. Con: Current voters ignore future anyway.
      *   *Framing 8: Voting as Community Integration.* (Residency-based). Implication: Yes to non-citizens, yes to 16yo. Pro: Belonging. Con: National sovereignty issues.

      *   *Selection:* I need a frame that allows for a mix of Yes/No consistently.
      *   *Chosen Frame:* **Voting as Stakeholder Governance (Affected Interests + Capacity).**
          *   Core idea: Voting allocates power over shared resources to those who bear the consequences and have the capacity to deliberate on them.
          *   Implications:
              1.  Age 16: Yes (capacity exists, stakes are high).
              2.  Non-citizens: Yes (affected by city services/laws).
              3.  Compulsion: No (expression cannot be compelled without distorting the signal).
              4.  Proxy for kids: No (dilutes individual agency, parents already have stakes).
      *   *Rival:* Voting as Civic Duty (Public Good).
      *   *Why Chosen Frame Wins:* Duty framing justifies compulsion but fails on non-citizens/age (why duty if no membership?). Stakeholder framing aligns rights with consequences, which is more robust for local governance where national citizenship is less relevant.

  3.  **Drafting the Memo (Step 2):**
      *   *Audience:* Commission colleagues (8 others).
      *   *Tone:* Direct, philosophical but practical.
      *   *Length:* Approx 900 words.
      *   *Structure:*
          1.  BLUF (Recommendation: Split the measure, Sunset clause).
          2.  The Frame (Stakeholder Governance).
          3.  The Four Items (Yes/No with reasoning).
          4.  The Losing Consideration (Compulsory Attendance).
      *   *Constraints:* Flag empirical claims [like this]. Commit to positions.

      *   *Refining the Recommendations based on the Frame:*
          1.  Age 16: Yes (Stakes + Capacity).
          2.  Non-citizens: Yes (Stakes > National Status).
          3.  Compulsion: No (Distorts expression).
          4.  Proxy: No (Double counting stakes).
      *   *Bundle vs. Split:* Split. These are distinct philosophical changes. Bundling risks killing all if one is toxic.
      *   *Sunset:* Essential for experimental changes (Age/Non-citizen).

      *   *Drafting - Section by Section:*
          *   *Header:* To: Charter Revision Commission. From: [User's Name/Role]. Re: Franchise Package Recommendations.
          *   *BLUF:* Split the ballot items. Adopt 16yo voting and Non-citizen voting. Reject Compulsion and Proxy. 5-year sunset on expansions.
          *   *Frame:* "Voting as Stakeholder Governance." We vote because we live with the consequences, not because we hold a passport or owe a duty.
          *   *Item 1 (16yo):* Yes. Capacity exists. [Empirical flag: cognitive development].
          *   *Item 2 (Non-citizens):* Yes. City services affect them. Legal status irrelevant for local issues.
          *   *Item 3 (Compulsion):* No. Voting is expression, not tax payment. Compulsion adds noise. [Empirical flag: turnout vs. validity].
          *   *Item 4 (Proxy):* No. Parents already vote for their interests. Kids aren't property.
          *   *Losing Side:* Compulsory Attendance. Argument: Turnout is a public good. Rebuttal: Forced speech is bad data.

      *   *Word Count Check:* Need to ensure it's around 900 words. I'll need to expand on the reasoning slightly to hit the mark without fluff.
      *   *Tone Check:* Ensure I'm not hedging. "I recommend" not "We might."
      *   *Empirical Flags:* Make sure to insert brackets where claims need verification.

  4.  **Review against Constraints:**
