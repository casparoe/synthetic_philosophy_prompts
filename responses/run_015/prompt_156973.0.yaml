          4.  Proxy voting for kids under 16 (half-weighted, cast by parent/guardian).
      *   **User's Core Question:** "What is voting even for?" (Discovery vs. Construction, Membership vs. Affected Interests, Public Good vs. Individual Expression).
      *   **Requirements:**
