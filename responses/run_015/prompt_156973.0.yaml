answer: |-
  ### Brainstorm: Candidate Framings

  1.  **Voting as National Membership:** Rights derive from citizenship. *Implications:* No non-citizens, no under-18s. Compulsion okay as duty. Proxy no.
  2.  **Voting as Affected Interests:** Rights derive from being governed. *Implications:* Yes non-citizens, yes 16s. Compulsion no (interests vary). Proxy no.
  3.  **Voting as Civic Duty:** Voting is a public good like jury duty. *Implications:* Yes compulsion. Age/Citizenship secondary to capacity to serve. Proxy no.
  4.  **Voting as Individual Expression:** Voting is speech/liberty. *Implications:* No compulsion. Age/Citizenship barriers suspect. Proxy no (cannot speak for another).
  5.  **Voting as Household Unit:** The family is the political atom. *Implications:* Yes proxy. Parents decide best interest. Age/Citizenship less relevant.
  6.  **Voting as Competence/Epistemic:** Voting aims at correct outcomes. *Implications:* No 16s (immature), no compulsion (uninformed). Non-citizens maybe (local knowledge).
  7.  **Voting as Future Stewardship:** Voting protects the next generation. *Implications:* Yes 16s, Yes Proxy. Compulsion yes (duty to future).
  8.  **Voting as Stakeholder Governance (Selected):** Power allocates to those bearing consequences with capacity to deliberate. *Implications:* Yes 16s (capacity + stakes), Yes Non-citizens (stakes), No Compulsion (distorts signal), No Proxy (double-counts stakes).

  **Selected Frame:** **Voting as Stakeholder Governance.**
  **Why it beats the rival (Voting as Civic Duty):** The Duty frame justifies compulsion well but struggles to explain why non-citizens or 16-year-olds owe a duty they cannot fully fulfill (e.g., jury service, military). Stakeholder Governance aligns authority with consequence: if the city decides your zoning, schools, and police, you need a say regardless of passport. It protects liberty (no compulsion) while expanding legitimacy (residency over citizenship).

  ***

  ### MEMORANDUM

  **TO:** Charter Revision Commission
  **FROM:** [Your Name]
  **RE:** Recommendation on Franchise Package Structure and Content
  **DATE:** October 24

  **Bottom Line Up Front**
  We must split the franchise package into separate ballot measures. Bundling disparate philosophical changes risks losing all reforms if voters reject one controversial element. I recommend we advance two measures for November: (1) Expansion of Eligibility (Age 16 + Legal Non-Citizen Residents) and (2) Administrative Reform (Ballot Design). We must reject Compulsory Attendance and Proxy Voting. Any eligibility expansion must include a five-year sunset clause requiring automatic re-authorization based on turnout data and legal challenges.

  **The Frame: Voting as Stakeholder Governance**
  We need to stop treating voting as a reward for membership or a duty owed to the state. Voting is the mechanism by which those subject to coercive power allocate that power. In municipal governance, national citizenship is irrelevant; residency is the only metric that matches authority to consequence. If the city zones your land, schools your children, and polices your streets, you hold a stake. However, holding a stake requires the capacity to deliberate. This frame prioritizes **affectedness** over **membership** and **agency** over **compliance**.

  **Recommendations on the Four Items**

  **1. Lower Voting Age to 16: YES.**
  Under Stakeholder Governance, the barrier is not arbitrary age but capacity to bear consequences. Sixteen-year-olds work, pay taxes on income, and navigate city infrastructure independently. The claim that they lack cognitive capacity for long-term reasoning is contested [verify: developmental psychology consensus on risk assessment vs. logical reasoning at 16]. They are stakeholders in schools and transit whether we let them vote or not. Excluding them creates taxation without representation.

  **2. Non-Citizen Residents (2+ Years): YES.**
  National borders do not stop local policy. A legal resident paying local taxes and subject to local law holds the same stake as a citizen. Excluding them creates a permanent underclass governed by neighbors who do not share their immediate interests. The two-year residency requirement ensures community attachment without relying on federal immigration status, which is outside our jurisdiction anyway. [verify: state preemption risk on "legal" vs "undocumented" distinction].

  **3. Compulsory Attendance: NO.**
  This proposal confuses turnout with legitimacy. Voting is an expression of will, not a tax payment. Compelling attendance forces those with no preference to enter the booth, inevitably increasing noise in the signal. While the "none of the above" option mitigates coercion, the fine itself transforms a right into a liability. High turnout is desirable, but not if it is manufactured by threat. [verify: impact of waivable fines on actual turnout vs. resentment].

  **4. Proxy Voting for Children: NO.**
  This violates the individual agency principle inherent in Stakeholder Governance. Parents already vote; they naturally weigh policies affecting their children. Granting them half-weight proxy ballots double-counts their stake and treats children as property rather than future stakeholders. It incentivizes larger families to wield disproportionate political power. If we lower the age to 16, we acknowledge emerging agency; proxy voting denies agency entirely.

  **The Strongest Losing Consideration**
  The strongest argument against my recommendations is the case for **Compulsory Attendance**. Proponents argue that voting is a public good that individuals will under-supply due to rational ignorance or apathy. Low turnout skews representation toward the wealthy and older demographics, corrupting the "Stakeholder" ideal anyway. If the goal is a electorate that mirrors the population, compulsion is the only proven tool.

  I override this consideration because legitimacy requires voluntary consent. A ballot box stuffed by fines produces data, not democracy. If stakeholders do not care enough to vote without coercion, forcing them to attend does not make them stakeholders; it makes them conscripts. We should improve engagement through access and relevance, not penalties. If turnout remains critically low after expanding eligibility, we can revisit administrative barriers, but we cannot compel speech.

  **Next Steps**
  I will draft the language for the two split measures immediately. We need to schedule a legal review on the non-citizen clause by next week to ensure state compliance. Let's put principles before politics; if these ideas are right, they can stand alone on the ballot.
