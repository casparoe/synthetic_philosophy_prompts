  **Node 2 (Split):** What does it predict?
  ├── **Branch A:** Your Source Code (Algorithm)
  └── **Branch B:** Your Live Mental State (Real-time)
      │
      ├── **Node 3 (Algo Split):** How do you treat the million?
      │   ├── **Causal Fixed:** Money is already there/not there.
      │   └── **Evidentially Tied:** My choice signals what's there.
      │       │
      │       ├── **Leaf 4:** **CDT** (Classic Two-Boxer)
      │       └── **Leaf 5:** **FDT** (Functional Decision Theory / One-Boxer)
      │
      └── **Node 6 (Live Split):** How do you treat the million?
          ├── **Causal Fixed:** (Impossible—live prediction implies correlation)
          └── **Evidentially Tied:** My choice collapses the state.
              │
              └── **Leaf 7:** **EDT + Quantum Edge Case**
                  *   *Standard EDT:* One-box because choice correlates with past prediction.
                  *   *Quantum Case:* Predictor runs you in superposition; opening the box collapses the wavefunction. You One-Box to align the collapse.
                  *   *Flag:* **Tree Breaks Here** if you try to apply Causal logic (Live+Causal is incoherent).

  ***

  **Notes on the leaves:**

  *   **Indistinguishable Pair:** **Leaf 5 (FDT)** and **Leaf 7 (EDT)** both end up One-Boxing. From the outside, you can't tell them apart—they just look like people who take the million. The difference is internal: FDT thinks it's *computing* the outcome; EDT thinks it's *signaling* the outcome.
  *   **The Quantum Branch:** It lives in **Leaf 7**. Because the prediction is superposed until you choose, your decision literally determines the past state upon collapse. It's the ultimate "Evidentially Tied" scenario.
  *   **The Break:** If you go **Branch B (Live State)** but insist on **Causal Fixed**, the tree snaps. You can't claim the predictor reads your live mind *now* but that your choice doesn't correlate with what it saw. That's Node 6's left side—marked "Impossible."
