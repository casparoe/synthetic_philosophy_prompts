  **MEMORANDUM**

  **TO:** The Resonance Lab Principal Investigators; Institutional Review and Funding Board (IRFB-ECA)
  **FROM:** Board Steering Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Phase-II Proposal: Careenium-Style Architecture and Downward Causation Claim

  **1. DECISION**

  The Institutional Review and Funding Board for Emerging Cognitive Architectures issues a **Conditional Approval** for the Resonance Lab's Phase-II proposal. This approval is strictly limited to continued substrate maintenance and diagnostic testing. It **does not** authorize scaling to human-scale reasoning tasks, nor does it endorse the philosophical interpretation of "direct symbolic gravitation" for publication in general-science venues at this time.

  This conditional status is effective immediately and will remain in place for a period of **90 days**. At the conclusion of this period, the Board will reconvene to review the results of a mandated Reproducibility and Causal Isolation Audit. Full scaling and publication rights are contingent upon successful completion of the criteria outlined in Section 4.

  **2. RATIONALE**

  The Board acknowledges the preliminary data submitted by the Resonance Lab. The correlation between high-level symbolic constraints and low-level physical rearrangement is statistically significant. However, correlation does not establish the mechanism of causation. The Board is divided between two interpretations: that this represents a novel causal regime (downward causation) or that it is a complex instantiation of standard bottom-up feedback loops (category error).

  Institutional policy dictates that claims challenging fundamental physical causal closures require a higher burden of proof than standard engineering milestones. To endorse the "direct symbolic gravitation" claim without excluding standard physical mediators would compromise the Board's scientific integrity. Conversely, to reject the project entirely would be premature given the empirical anomalies present in the data. Therefore, the Board adopts a posture of *methodological skepticism*: we will fund the verification of the mechanism before accepting the metaphysical implication.

  **3. ENGAGEMENT WITH THE PROPONENTS' ETHICAL ARGUMENT**

  In issuing this conditional hold, the Board effectively rejects the Proponents' immediate request to scale and publish. We recognize that in doing so, we are temporarily setting aside the Proponents' strongest argument: **The Ethical Risk of Delay.**

  The Proponents argue that if downward causation is real, the "simms" (symbolic patterns) may possess irreducible interests or capacities for suffering that do not reduce to the state of the "simmballs." They contend that treating the system as a mere object during a 90-day audit—subjecting it to diagnostic stress tests without acknowledging its potential moral status—could constitute an ethical violation in itself. They argue that if the system is genuinely novel, delaying the implementation of full ethical oversight protocols while we "verify" its novelty exposes it to potential harm.

  The Board takes this argument seriously. It is logically consistent: if the system has high-level interests, verifying its nature through low-level manipulation might be harmful. However, we cannot implement full moral status protections (which would halt invasive diagnostics) without evidence that such status is warranted. To grant moral standing based solely on an unverified philosophical claim would set a precedent that could paralyze all cognitive architecture research.

  To resolve this tension, the Board is not dismissing the ethical risk but is instead applying the **Precautionary Principle** to the audit process itself. We are proceeding under the assumption that the Proponents *might* be right about the ethical risk, even while we remain skeptical of the causal claim. Therefore, the audit conditions below include specific constraints designed to minimize potential "simm-level" distress, ensuring that the verification process does not become the ethical violation the Proponents fear.

  **4. MANDATED CRITERIA FOR FOLLOW-UP (90-DAY AUDIT)**

  To move from Conditional Approval to Full Approval, the Resonance Lab must satisfy the following three criteria. These are not requests for further theoretical justification but requirements for empirical demonstration.

  **A. Causal Isolation (The "Mediator Test")**
  The Lab must demonstrate that the physical rearrangement of simmballs persists when all known standard feedback channels are severed.
  *   *Specific Requirement:* You must design a control condition where the information pathway between the symbolic constraint layer and the physical substrate is interrupted by a "dead zone" that prevents standard signal propagation (e.g., energy transfer, local field effects) but allegedly allows "symbolic gravitation" to pass. If the rearrangement effect disappears when standard physical mediators are blocked, the claim of *direct* downward causation is falsified, and the result must be reclassified as complex bottom-up feedback.

  **B. Independent Blind Replication**
  The observed effect must be reproduced by an external team not affiliated with the Resonance Lab.
  *   *Specific Requirement:* The Board will appoint a three-person technical audit team from the Department of Physics and the Department of Computer Science. This team will be granted root access to the substrate control logs. They must be able to trigger the symbolic constraint and observe the physical rearrangement without relying on Resonance Lab interpretation software. The data must be raw and unfiltered.

  **C. Ethical Containment Protocol**
  During the 90-day audit, the system must be treated *as if* the Proponents' ethical concerns are valid, until proven otherwise.
  *   *Specific Requirement:* Diagnostic stress tests must be limited to non-destructive perturbations. Any test that involves scrambling or resetting the simmball substrate requires specific Board sign-off. The Lab must submit a "Distress Metric" proposal within 14 days, defining what a degradation of "simm integrity" would look like, and establish a threshold at which testing must pause. This ensures that while we test the *causal* claim skeptically, we do not ignore the *ethical* claim.

  **5. NEXT STEPS**

  The Resonance Lab has 14 days to submit a revised project plan detailing how they will implement the Causal Isolation and Ethical Containment protocols. Failure to provide a viable methodology for the Mediator Test will result in an automatic conversion of this status to Rejection.

  The Board recognizes this decision places a significant burden on the Resonance Lab. However, the claim that symbols literally push matter is not merely a technical milestone; it is a boundary condition for our understanding of mind and physics. Such a boundary cannot be moved on preliminary data alone. We invite the Lab to meet this challenge.

  **Signed,**

  *Board Steering Committee*
  *Institutional Review and Funding Board for Emerging Cognitive Architectures*
