  hey — I'm in a phil of mind seminar this term and something at home feels like it walked out of the readings, but I don't want to turn my brother into a case study. After a bike accident last year and some nerve thing afterwards, he's like this: he still feels pain — exact location, what it's like (burning, stabbing, throbbing), how strong — and he'll give it a 7/10 that matches the ratings he used to give before the accident. But he says it doesn't bother him. Not that it hurts less: the hurting is all still there, none of it is bad. He still yanks his hand off the pan, swears, his face does the thing, his pulse goes up, and he says it grabs his attention — he can't just ignore it, it interrupts whatever he's doing. But he ran three weeks on what turned out to be a stress fracture and doesn't see the problem, and now he seeks out intense stuff (stupid-spicy food, ice baths, a six-hour tattoo) because the intensity is interesting, like a loud flavour.

  His neurologist floated a medication that might bring back the part where it's awful. He's going to say no. And the bit I can't get past: he says the last year has felt slightly flat, he thinks he registers other people's pain less, and he misses something he can't name. His partner says he's damaging himself and should take the drug.

  So is he right that nothing bad is happening to him when he's in pain? And is he wrong to say no? I want something I could actually say out loud to him, not a position in the abstract. If you think I've set it up wrong — that the question isn't really about pain at all, or that both "harmed" and "not harmed" are the wrong frame — just say that instead of answering politely.

  Sections please: "What's going on" (~100 words), "Is he harmed" (~250), "Should he take it" (~150), "What I'd actually say to him" (~100), "Where this might be confused" (~80).
