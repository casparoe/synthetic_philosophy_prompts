  Your morph rule is a phenomenological definition: it defines identity through perceptual continuity and cognitive stability during transformation. It works well for distinguishing distinct letters within a script (you can't morph 'a' to 'b' without passing through nonsense), but it fails to capture the technical and orthographic realities that drive digital typography.

  The existing stack—Unicode, font tables, and fallback algorithms—operates on a layered but ultimately unified philosophy that prioritizes **orthographic function over visual form**.

  1.  **Unicode (The Identity Layer):** Unicode encodes "abstract characters," not glyphs. It explicitly rejects shape as the primary identifier. This is why Latin 'a' (U+0061) and Cyrillic 'а' (U+0430) are distinct despite identical shapes: they perform different *roles* in different writing systems. Conversely, CJK Unification assigns one code point to ideographs with different regional shapes because they share the same semantic *role*. Unicode commits to the idea that a character is defined by its usage and etymology, not its drawing.
  2.  **Font Families (The Design Layer):** When a typeface bundles Roman and Italic as one family, it uses metadata to declare them stylistic variations of the same underlying character set. The "sameness" here is a declaration of intent by the designer, enforced by the font mapping tables. The system accepts the discontinuous shape jump (double-storey to single-storey) because the *functional slot* (the code point) remains constant.
  3.  **Font Fallback (The Rendering Layer):** When your browser requests a fallback, it asks the OS for a glyph matching the *code point*, not the shape. If you request U+0061, the OS will not substitute U+0430 even if it looks perfect, because the *role* is wrong. It would rather show a missing-glyph box than break the orthographic integrity of the text.

  Your morph rule would build a different tool. A morph-based fallback would happily substitute Cyrillic 'а' for Latin 'a' (preserving shape/legibility but breaking script integrity), and it might refuse to substitute an Italic font for a Roman text if the topological gap is too wide (preserving shape continuity but breaking layout flow). The current system accepts broken shape continuity (Italics) and rejects perfect shape matches (Homoglyphs) to preserve the semantic and orthographic **role** of the text.

  The existing practice commits us to the view that a character's identity is determined by its functional role within a specific orthographic system rather than by its visual shape or perceptual continuity.

  \answer{ROLE}
