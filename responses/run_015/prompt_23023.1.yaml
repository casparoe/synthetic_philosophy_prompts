      *Wait, one nuance check:* "Lower-rate population is also the one that has historically been under-served."
      If they are under-served, their low readmission rate might be due to *lack of return*. Therefore, predicting readmission might be predicting "access to care." A calibrated model predicts "who will come back." An EO model predicts "who needs help regardless of who comes back." This strengthens the EO argument. I will weave this in subtly.

