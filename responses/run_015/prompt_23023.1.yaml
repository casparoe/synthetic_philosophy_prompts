          *   *Steelman for Calibration:* It ensures statistical truthfulness. It prevents "gaming" the risk. It respects the biological/clinical reality of the base rates.
      *   *Alternative:* Recommend **Calibration**.
          *   *Rationale:* Truth in advertising.
