      *   **The Recommendation & Rationale:** Why EO? Because this is resource allocation, not just prediction. We want to correct under-service.
      *   **The Cost of Rejecting Calibration (Concrete):** What happens if we don't pick Calibration? Clinicians might see different probabilities for the same score. But since clinicians *don't* see the score (hard threshold), the cost is mostly about model transparency and potential long-term trust if audited. *Correction:* Actually, the prompt asks what rejecting the *other* (Calibration) costs. If we pick EO, we lose Calibration. What does that cost? It means a score of 0.8 in Group A isn't the same risk as 0.8 in Group B. But since it's a hard threshold, does the score matter? The *threshold* matters. The cost is that we can't interpret the raw score universally.
      *   **Wait, let's flip it.** I need to recommend one. Let's say I recommend **Equalized Odds**.
