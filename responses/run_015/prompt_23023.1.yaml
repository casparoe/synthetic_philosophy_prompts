      *   *If we pick Equalized Odds:* We force the model to identify the same proportion of "at-risk" individuals in both groups relative to the threshold. This usually requires lowering the threshold for the group with the lower base rate to catch the same % of positives. This directs more resources to the under-served group.
      *   *Decision:* **Equalized Odds** is the ethically superior choice here *given the specific goal of correcting under-service via a hard threshold intervention*. Calibration would bake in the disparity.
      *   *Wait, is there a nuance?* Usually, in healthcare, Calibration is king because clinicians need to trust the probability. However, the prompt says "hard threshold that triggers a follow-up program, *not* as a soft input to clinicians." This removes the primary benefit of Calibration (clinical interpretability of probability) and highlights the resource allocation aspect (who gets the program).
      *   *Recommendation:* **Equalized Odds.**

  3.  **Drafting - Section by Section:**

