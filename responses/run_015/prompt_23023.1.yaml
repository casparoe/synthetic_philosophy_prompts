      *   *Ethical Analysis:* If we choose Calibration, the model will reflect the underlying base rate disparity. Since the under-served group has a *lower* baseline readmission rate (according to the prompt), a calibrated model will assign them lower risk scores on average. If there's a hard threshold, fewer people from the under-served group will cross it. This perpetuates under-service.
      *   *Wait, let's re-read the prompt carefully:* "the lower-rate population is also the one that has historically been under-served."
          *   Population A: High baseline readmission (Historically well-served? Or just higher risk?)
