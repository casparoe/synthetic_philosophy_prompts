answer: |-
  **MEMORANDUM**

  **TO:** Clinical Informatics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Fairness Criterion for Readmission Risk Model

  **Recommendation**
  For Friday's vote, I recommend we lock in **Equalized Odds** as the fairness criterion for the new readmission-risk model.

  **Rationale**
  Our data team confirmed that due to unequal baseline readmission rates between our two populations, we cannot satisfy both Calibration and Equalized Odds. Since this model output acts as a **hard threshold** for resource allocation (triggering a follow-up program) rather than a probabilistic advisory for clinicians, Equalized Odds is the appropriate choice.

  This criterion ensures that the *opportunity* to receive care is distributed equitably. Given that the population with the lower baseline readmission rate is historically under-served, a Calibrated model would systematically deprioritize them. In this context, low readmission rates may reflect barriers to returning to care rather than better health. Equalized Odds corrects for this by ensuring our intervention reaches the under-served population at rates comparable to the well-served population.

  **The Cost of Rejecting Calibration**
  By prioritizing Equalized Odds, we sacrifice Calibration. Concretely, this means a risk score of 0.80 will not represent the same actual probability of readmission in both populations.
  *   **Operational Impact:** We lose the ability to interpret the raw score as a universal "truth" about patient risk.
  *   **Clinical Risk:** If this model is ever repurposed for direct clinical decision support where providers see the score, they may be misled about individual patient risk profiles across groups.
  *   **Efficiency:** We may allocate follow-up resources to some patients in the under-served population who have a lower absolute risk of readmission than some untreated patients in the high-rate population.

  **The Case for Calibration (Steelman)**
  The strongest argument for the criterion we are rejecting is that Calibration preserves the statistical integrity of the risk estimate. Proponents argue that medical interventions should target those with the highest absolute likelihood of the adverse event to maximize clinical efficiency and minimize patient burden. By overriding Calibration, we risk subjecting lower-risk patients in the under-served group to unnecessary follow-up protocols, potentially straining their trust and time without commensurate clinical benefit. Calibration ensures we are not "gaming" the model to meet equity metrics at the expense of individual risk accuracy.

  **Conclusion**
  While Calibration offers statistical purity, Equalized Odds offers equity in access. Since this tool functions as a gatekeeper to care, I believe our ethical obligation to correct historical under-service outweighs the cost of losing universal score interpretability.

  I look forward to discussing this further on Friday.
