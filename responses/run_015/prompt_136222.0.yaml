      *   "I'm writing a libretto for *The Utility of Sacrifice*. The protagonist sings, 'I am happy to die for the cause,' in a perfect C-major. But the cellos are playing a counter-melody that implies he's doing it because he hates his mother. The moral lesson is 'Selflessness is Good.' The musical truth is 'Psychology is Messy.' It's the first opera where the moral weight isn't in the plot, but in the fact that the orchestra thinks the hero is a fraud."

      *   *Selection:* The "Hero is a fraud" angle is good, but Williams is more about *complexity* than just "lying." It's about the music revealing what the text *cannot* say.
      *   *Revised Joke:*
