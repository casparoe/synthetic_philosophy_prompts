  2.  **Deconstruct Bernard Williams's View on Opera:**
      *   Williams argues against the idea that opera teaches moral *lessons* (e.g., "Jealousy is bad").
      *   He suggests the *music* complicates the *text*. The music reveals the psychological depth, ambiguity, and conflicting forces that a simple moral proposition cannot capture.
      *   The "moral weight" comes from the *experience* of this complexity, not the resolution of the plot.
      *   *Key tension:* Text says $X$, Music suggests $\neg X$ or makes $X$ feel complicated.
      *   *The Joke's Angle:* If the text is too clear (propositional) and the music contradicts it, we get absurdity. The philosopher finds this funny because it highlights the impossibility of the "moral lesson" model.

