answer: |-
  ### The Principle of Causal Potency and Pragmatic Designation (CPPD)

  To reconcile your six verdicts without smuggling in a substantial self (*ātman*), you require a principle that treats "personal identity" strictly as a *saṃvṛti-satya* (conventional truth) grounded in *paramārtha-satya* (ultimate truth) mechanics of causality. The core architecture must shift the criterion of survival from **psychological continuity** (which fails in branching and dementia) to **causal potency** (the capacity of the stream to generate specific future states).

  I propose the **Principle of Causal Potency and Pragmatic Designation (CPPD)**.

  **Definition:** A "person" is a pragmatic designation (*prajñapti*) applied to a causally integrated stream of aggregates (*skandha-santāna*) so long as that stream retains the specific latent potency (*vāsanā/bīja*) to generate the characteristic karmic and psychological outputs of that stream.

  **The Four Clauses of CPPD:**

  1.  **The Potency Clause:** Survival requires the preservation of the causal architecture capable of producing the stream's specific future moments. Interruption of *activity* is permissible if the *potentiality* is preserved within the physical basis (*rūpa*) or latent consciousness.
  2.  **The Uniqueness Clause:** Conventional designation requires a unique causal trajectory. If a stream branches, the designation splits; no metaphysical privilege attaches to either branch, though pragmatic rules may default to the uninterrupted physical locus.
  3.  **The Integrity Clause:** The physical basis must maintain sufficient structural integrity to support the specific karmic signature. If the basis degrades such that the specific potency cannot be actualized, the designation ceases.
  4.  **The Accountability Clause:** Moral responsibility attaches to the causal stream via inheritance, not to a self. Disownership (*anattā*) is an ultimate insight that does not negate conventional karmic liability.

  ---

  ### Application to Your Six Verdicts

  **1. Destructive Teletransportation (Verdict: Survival)**
  *   **Clause:** Potency Clause.
  *   **Analysis:** Although the material substrate is replaced, the causal architecture (the specific arrangement of *vāsanā*) is transferred without divergence. The stream is interrupted in activity but not in potency. Since there is no competing stream, the conventional designation holds.
  *   **Ultimate Status:** No self travels; only causal information is instantiated in a new locus.

  **2. Non-Destructive Branching (Verdict: No Privilege, but Asymmetry Felt)**
  *   **Clause:** Uniqueness Clause.
  *   **Analysis:** Branching creates two distinct causal trajectories. Metaphysically, neither is the "original" because the "original" was a stream, not a substance. Both are equally valid continuations.
  *   **Resolving the Asymmetry:** The feeling that the original is privileged is not a metaphysical insight but a *saṃvṛti* heuristic. Conventional designation defaults to the uninterrupted physical locus (the original body) to avoid social contradiction. Your intuition smuggles in a self only if you reify this heuristic; CPPD treats it as a pragmatic rule, not an ontological fact.

  **3. Split-Brain Separation (Verdict: Two Streams, No Division)**
  *   **Clause:** Uniqueness & Integrity Clauses.
  *   **Analysis:** Prior to separation, the "one person" was a conventional label over two tightly coupled causal streams. When coupling breaks, the designation splits. There is no "tragic division" because there was no substantial unity to divide. The verdict follows directly from the rejection of a singular controller (*svāmin*).

  **4. Severe Progressive Dementia (Verdict: Death of Person)**
  *   **Clause:** Integrity Clause.
  *   **Analysis:** Unlike Nirodha, dementia is not a suspension of potency but a *corruption* of the basis. The neural/psychological architecture degrades to the point where the specific karmic signature (memory, character) can no longer be actualized. The stream continues biologically, but the specific causal potency that warranted the original designation is lost.

  **5. Nirodha-samāpatti (Verdict: Survival)**
  *   **Clause:** Potency Clause.
  *   **Analysis:** Mental activity ceases, but the cessation is caused by meditative mastery (*samāpatti*), which stabilizes the physical basis to hold the latent seeds (*bīja*) in suspension. The causal architecture is paused, not corrupted. Upon emergence, the specific potency generates the resumption of the stream. The "gap" is ontologically irrelevant because moments are always discrete (*kṣaṇika*); the causal link is preserved.

  **6. Post-Traumatic Moral Transformation (Verdict: Disownership with Responsibility)**
  *   **Clause:** Accountability Clause.
  *   **Analysis:** Ultimate truth reveals no self to own the past actions (*anattā*). Conventional truth tracks the causal stream: the adult monastic is the causal heir of the child's karma. Responsibility is maintained not because "I did it" (substantial identity) but because "this stream bears the fruit of that stream's causes" (causal inheritance).

  ---

  ### Resolving Your Specific Tensions

  **Tension 1: Destructive (1) vs. Branching (2)**
  *   **The Problem:** If continuity suffices for (1), why does the copy in (2) not count?
  *   **CPPD Solution:** In (1), there is **one** causal trajectory. In (2), there are **two**. The CPPD does not rely on "psychological continuity" alone but on **non-divergent causal potency**. In (2), the copy is a *new* stream that shares past causes with the original. The asymmetry you feel is the mind's attachment to the *continuous physical locus* (the original body). CPPD validates the asymmetry as a *pragmatic convention* (we track bodies for legal coherence) without validating it as *metaphysical truth*. You do not need to abandon the verdict; you must re-categorize the asymmetry from "ontological privilege" to "pragmatic default."

  **Tension 2: Dementia (4) vs. Nirodha (5)**
  *   **The Problem:** Why does gradual loss kill identity while total cessation does not?
  *   **CPPD Solution:** The distinction is not **activity** but **causal efficacy**.
      *   In **Nirodha**, the cessation is *teleological*: the entry into the state is caused by a resolve (*adhiṭṭhāna*) that preserves the seeds. The basis is held in a state of *samartha* (capacity) to resume.
      *   In **Dementia**, the cessation is *entropic*: the basis is corrupted. The seeds are scrambled or destroyed. The capacity to resume the specific karmic signature is lost.
      *   **Key Distinction:** Nirodha is a **pause** in a functional system; Dementia is a **break** in the functional system. CPPD prioritizes the *capacity to resume specific outputs* over the *continuity of activity*.

  ---

  ### Prediction: The Unlisted Scenario

  **Scenario:** A practitioner enters the attainment of **Neither-Perception-Nor-Non-Perception** (*nevasaññānāsaññāyatana*) for an extended period. Mental activity is reduced to a minimal, undifferentiated residue. They emerge with intact autobiographical memory.

  **CPPD Verdict:** **The stream survives.**

  **Reasoning:**
  1.  **Potency Clause:** Unlike *Nirodha*, consciousness is not extinguished in this attainment; it is merely attenuated to a subtle residue. The causal architecture remains active, albeit minimally.
  2.  **Integrity Clause:** Unlike Dementia, this state is stabilized by *samādhi*. The physical and mental basis is not degrading; it is being sustained in a refined state.
  3.  **Comparison:** This is structurally closer to deep sleep or *Nirodha* than to Dementia. The latent tendencies (*anuśaya*) remain intact and are not scrambled.
  4.  **Prediction:** Upon emergence, the causal stream resumes its previous trajectory. The "person" designated prior to entry is the same "person" designated after exit, both conventionally (same memory/karmic load) and ultimately (same causal stream, no interruption of potency).

  ---

  ### Conclusion: Do You Need to Abandon Any Verdicts?

  You do not need to abandon any of your six verdicts, but you must **reframe the justification for Case 2 (Branching)**.

  *   **Keep:** The metaphysical claim that neither branch is privileged.
  *   **Adjust:** The interpretation of your "asymmetry" feeling. Do not treat it as evidence of a hidden self. Treat it as the mind's *saṃvṛti* mechanism clinging to spatiotemporal continuity of the body. CPPD explains this feeling as a useful heuristic for navigating a world where branching doesn't naturally occur, rather than a glimpse of ultimate reality.

  If you insist that the original *must* be metaphysically privileged in Case 2, you will contradict the Abhidharmic commitment to *anattā* and momentariness. However, if you accept that the "privilege" is purely conventional/pragmatic (as CPPD dictates), your architecture remains consistent across all six cases.

  **Summary of Architecture:**
  *   **Ultimate:** Moments of causality (*kṣaṇa*), no self.
  *   **Conventional:** Designated streams (*santāna*) based on preserved causal potency (*vāsanā*).
  *   **Survival:** Determined by the integrity of the capacity to resume specific karmic outputs, not by continuous activity or bodily identity alone.
