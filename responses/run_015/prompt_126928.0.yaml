answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Explanation in the Human Sciences (The Weberian Thesis)
  **Participants:** Camp A (Meaning-Realists), Camp B (Institutionalists)

  ## 1. AGREED CLAIMS
  Both camps affirm the following substantive claims. Each is deny-able by a hostile third scholar.

  1.  **Correlation:** In early modern European data, confessional affiliation and economic differential correlate robustly, independent of crude geographic or racial determinism.
  2.  **Contrastivity:** Any causal claim regarding this correlation must specify the contrast case (e.g., what would have occurred had the confession differed while holding other factors constant).
  3.  **Reciprocity:** Both camps accept Weber's stipulation that economic structure and religious meaning stand in a two-way causal relation; neither denies the reverse causation entirely.
  4.  **Embedding (Uncomfortable for A):** Meaning cannot causally operate at a macro-economic scale without institutional carriers (literacy, law, network structure) to transmit and stabilize it.
  5.  **Normativity (Uncomfortable for B):** Institutions cannot stabilize over generations without agents treating them as meaningful and normative rather than merely coercive or incentive-compatible.

  ## 2. DISAGREEMENTS TABLE

  | Crux | Camp A (Meaning-Realist) | Camp B (Institutionalist) | Neutral Restatement | Verbal / Genuine |
  | :--- | :--- | :--- | :--- | :--- |
  | **Causal Mechanism** | An agent's action is individuated by the meaning it carries; religious reinterpretation of work redirected conduct where material interests did not determine it. | Causal work is done by literacy, legal form, and incentive structure; culture is the label attached to the residue of a causal story not finished. | Does the specific content of religious belief redirect behavior beyond what institutional incentives predict? | **Genuine.** Disambiguating "culture" does not remove the dispute over whether meaning is a driver or a byproduct. |
  | **Avowability** | A value must be avowable by the agent to do causal work; if agents systematically violate the value they avow, the explanation fails. | Agents may be wrong about motives; structure determines outcome even if agents cite values they do not practice. | Must agents consciously grasp the meaning for it to function as a cause? | **Genuine.** Survives vocabulary shift: is first-person authority required for causal attribution? |
  | **Culture's Origin** | A culture that cannot explain its own origin can still explain subsequent economic divergence; origins may be contingent, effects real. | A culture that cannot explain its own origin explains nothing; if material preconditions select the culture, culture is the dependent variable. | Can a variable be causal if its own distribution is determined by prior material conditions? | **Genuine.** Dispute over causal primacy in a feedback loop. |
  | **Testability** | A thesis whose central kind is constructed by the inquirer's value-relevance can be tested empirically against historical data. | A thesis constructed by value-relevance risks circularity; only external metrics (income, literacy) test the claim. | Can hermeneutic constructs be falsified by empirical data? | **Verbal/Genuine.** Verbal on "testability" definition; genuine on whether value-relevance biases data selection irreparably. |

  ## 3. TESTS TABLE

  | Case | Crux | Relevance | Camp A Prediction | Camp B Prediction | Defeat Condition (A / B) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Matched Pair** (Exogenous confessional assignment; identical institutions otherwise) | Causal Mechanism | Isolates confession from institutional confounds. | Reformed district shows higher enterprise/consumption control due to meaning. | No divergence unless hidden institutional differences exist; meaning alone is inert. | **A:** No divergence. **B:** Significant divergence persists. |
  | **2. Secularization Lag** (Belief collapses; economic differential persists 100 years) | Avowability | Tests if meaning must be currently avowed to cause behavior. | Behavior persists via habitus/character formed by earlier meaning; origin matters. | Behavior persists due to locked-in institutional incentives; belief collapse is irrelevant. | **A:** Behavior collapses immediately with belief. **B:** Behavior collapses while institutions remain intact. |
  | **3. Sect Substitution** (Non-Reformed disciplined sects show same differential) | Causal Mechanism | Tests specificity of religious content vs. general discipline. | Failure: Specific doctrine of calling is required; generic discipline yields smaller effects. | Success: Any high-discipline, excluded network yields same outcome; doctrine is irrelevant. | **A:** Same effect size with unrelated doctrine. **B:** Effect size depends on specific Reformed theology. |
  | **4. Origin Probe** (Commercial towns adopt confession first; pastoral districts reject it) | Culture's Origin | Tests if culture is selected by economics rather than driving it. | Concedes selection, maintains subsequent causal power of meaning on growth trajectories. | Confirms selection; culture is dependent variable; initial commercialization explains divergence. | **A:** Early adopters do not outperform later adopters controlling for start. **B:** Early adopters outperform despite identical initial commercialization. |

  ## 4. CLOSING: UNSETTLED MATTERS

  This collaboration cannot settle the ontological status of meaning. Camp A holds that meaning is constitutive of the action itself; Camp B holds that meaning is descriptive of the action's context. Consequently, "causal primacy" remains ambiguous: if meaning and institution co-evolve, isolating the "first mover" may be empirically possible in specific cases (via the Tests above) but not principled across all history.

  Furthermore, the dispute over value-relevance remains partially verbal. Both agree inquiry is value-laden, but disagree on whether this ladenness invalidates causal claims or merely constructs the object of study. Finally, regarding the **Origin Probe**, even if Camp B proves culture is selected by economics, Camp A may argue the selected culture subsequently alters the economic trajectory (hysteresis). This leads to a residual disagreement on counterfactuals: would the economic outcome have been *identical* without the specific cultural content, or merely similar? Neither side can prove the identity of non-actual worlds. We agree to treat these cases as arbiters of explanatory adequacy for specific contexts, not as final verdicts on the nature of human science.
