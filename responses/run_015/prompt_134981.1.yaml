answer: |-
  ### The Stance: Does the "Bottleneck" Save CSR?

  I argue that the "doctrinal bottleneck" **does successfully rescue** the Cognitive Science of Religion (CSR) from the most damning iteration of the "just-so story" charge, but only by fundamentally shifting the project from evolutionary psychology to cultural evolution.

  The standard "just-so" critique targets CSR's adaptationism: the claim that religion *itself* was selected for because it enhanced cooperation. This is notoriously difficult to prove and often circular (religion exists because it helps groups survive; we know it helps groups survive because religion exists). Your guest's bottleneck model avoids this trap by treating institutional religion not as a biological adaptation, but as a **cultural constraint mechanism**. She is not arguing that the *bottleneck* was genetically selected, but that it is a necessary cultural technology to manage unmanageable cognitive byproducts.

  This saves the theory because it makes a falsifiable historical claim: we should see a correlation between the scaling of a group and the rigidification of its doctrinal filters, specifically to suppress high-fidelity charismatic variance. It moves the debate from "Why do humans believe?" (which invites speculation) to "Why does belief stabilize *this way*?" (which invites historical data). However, she must be careful not to slide back into functionalism by claiming the bottleneck exists *in order to* stabilize the group. It must be framed as a selection pressure on *memes*, not genes. If she treats the bottleneck as a functional tool designed for cohesion, she hasn't escaped the just-so charge; she has just dressed it up in structuralist clothing.

  ***

  ### Interview Questions

  **1. The Mechanism of Suppression**
  You describe the bottleneck as a filter that converts chaotic, spontaneous cognitive outputs into stable doctrinal forms. Mechanically, how does this filtering occur without destroying the motivational power of the religion? If I strip away the visceral thrill of a vision or possession to leave only a creed, haven't I removed the very fuel that drives the believer to act?

  **2. The Persistence of Mysticism (Required Topic)**
  If the doctrinal bottleneck is designed to filter out raw, spontaneous religious experience to ensure institutional stability, how do you account for the persistence of high-intensity mysticism *within* highly bureaucratized traditions? Catholicism has the Inquisition, but it also canonizes St. Teresa of Avila. If the bottleneck works, these outliers should be extinguished, not celebrated.
  *   **Follow-up:** You'll likely say the institution "co-opts" these mystics. But at what point does co-option become admission that the bottleneck is porous? If the institution *needs* the occasional visionary to renew its vitality, doesn't that imply the doctrinal form is parasitic on the very charisma it claims to regulate?

  **3. Normativity and "True" Religion (Required Topic)**
  Your model draws a sharp line between "raw cognitive output" (visions, possession) and "institutional product" (creeds, hierarchies). Does this distinction inadvertently create a normative hierarchy where the unfiltered, charismatic experience is the "authentic" religion, and the doctrinal version is merely a degraded, second-order simulation?
  *   **Follow-up:** If you resist that hierarchy and claim both are equally "natural," then what work is the bottleneck doing? If the doctrinal form is just as natural as the vision, why call it a filter? Are we not just describing two different cognitive modes rather than a process of suppression?

  **4. Evolutionary Psychology and Cooperation (Required Topic)**
  Standard evolutionary psychology argues religion evolved to facilitate large-scale cooperation by signaling commitment. If your bottleneck model is right, cooperation isn't driven by shared belief, but by shared *submission to the filter*. Does this imply that large-scale cooperation is actually built on the mutual suppression of genuine cognitive impulses rather than the alignment of them?
  *   **Follow-up:** If cooperation relies on suppressing our natural cognitive outputs, doesn't that make social stability inherently fragile? It suggests that civilization requires us to constantly fight our own minds. How does your model explain the *willingness* to enter the bottleneck if the cost is cognitive suppression?

  **5. The Origin of the Filter**
  You argue that institutions survive by filtering out cognitive noise. But where does the filter come from? Did the bottleneck emerge spontaneously from the bottom up as a self-organizing system, or does it require top-down imposition by elites? If it's the latter, your theory relies on agency, not just cognitive byproducts.
  *   **Follow-up:** If elites design the bottleneck to control the populace, doesn't that return us to a Marxist or Enlightenment critique of religion as a tool of power, rather than a cognitive anthropological phenomenon? How do you distinguish your view from Voltaire's "If God did not exist, it would be necessary to invent him"?

  **6. Transmission Fidelity vs. Cognitive Attraction**
  CSR often debates whether successful religions are those that are most "transmissible" or those that are most "cognitively attractive." Your bottleneck suggests transmissibility requires reducing cognitive attraction (making it less visceral, more abstract). Is there a tipping point where a religion becomes so filtered it ceases to transmit at all?
  *   **Follow-up:** We see mainline denominations declining while high-tension sects grow. Does your model predict that institutions which tighten the bottleneck too much will eventually starve, while those that loosen it risk fragmentation? Is there an optimal "leak rate" for the bottleneck?

  **7. Secular Analogues**
  If the doctrinal bottleneck is a cultural technology for managing cognitive chaos, we should see it outside of religion. Do you see this same bottlenecking process in secular ideologies, like political partisanship or corporate culture?
  *   **Follow-up:** If yes, does that mean "religion" is no longer a useful category? If political dogma functions as a bottleneck for social cognition just like a creed, have you accidentally argued that *all* large-scale social organization is religious in structure?

  **8. The Phenomenological Gap**
  You are describing a structural process, but religion is lived phenomenologically. From the inside, a believer does not feel they are being "filtered." They feel the creed *is* the revelation. How does your third-person anthropological model account for this first-person deception?
  *   **Follow-up:** If the believer is unaware of the bottleneck, does that make the doctrine a "noble lie"? And if it is a lie, even a functional one, does that undermine the claim that religion is a "natural" phenomenon? Or is naturalness compatible with systematic self-misunderstanding?

  **9. Historical Contingency**
  Is the doctrinal bottleneck inevitable for any religion that scales, or is it a specific feature of Axial Age religions? If we look at indigenous shamanic traditions that persist for millennia without rigid creeds, does your model classify them as evolutionary dead-ends, or simply different adaptive strategies?
  *   **Follow-up:** If shamanic traditions are stable without the bottleneck, then the bottleneck isn't necessary for survival, only for *imperial* scaling. Does this mean your theory explains the success of Christianity and Islam, but fails to explain the persistence of religion *as such*?

  **10. The Digital Collapse**
  We are currently seeing a digital explosion of unfiltered religious experience—algorithmic spirituality, decentralized revelation, and the collapse of traditional hierarchies. If your theory holds, the internet should be acting as a bottleneck-destroyer. Are we witnessing the unraveling of the doctrinal form, and if so, what replaces it?
  *   **Follow-up:** If the bottleneck dissolves, do we return to the "raw cognitive outputs" you describe? Or does the digital sphere simply create *new*, invisible bottlenecks (like algorithmic curation)? If it's the latter, how do we identify a bottleneck if it's no longer located in a text or a hierarchy?
