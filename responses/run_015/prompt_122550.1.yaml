  ### 2. What the Three Rules Are Actually Committed To
  You asked what each rule implies based on her history. Here is the translation of her "pub talk" into her actual grading rubric:

  *   **The Slot Rule (Structuralism):**
      *   *Commitment:* Identity is relational, not intrinsic. A letter is defined by how it differs from its neighbors.
      *   *Evidence:* The **Cyrillic а** verdict ("different letter") and the **Rotated alphabet** verdict.
      *   *Weakness:* It allows for anything to be a letter if the system is weird enough. It needs a check against legibility.
  *   **The Spirit Rule (Essentialism):**
      *   *Commitment:* There is a historical/structural "DNA" (bowl, stem, counter) that must be present to maintain continuity with the past.
      *   *Evidence:* The **Turned a** verdict (No) and the **Solid blob** verdict ("bad a").
      *   *Weakness:* It is rigid. It struggles to explain why Fraktur passes (very different DNA) or why Stencil passes (broken DNA). Mira uses "Spirit" loosely, usually meaning "does it look like it belongs to the family of Latin letters?"
  *   **The Reader Rule (Pragmatism):**
      *   *Commitment:* A letter is a tool for communication. If the human brain doesn't decode it as intended, it fails.
      *   *Evidence:* The **Generative blob** verdict (99% machine confidence, 0% human legibility = No).
      *   *Weakness:* It is subjective. (Though Mira seems to trust "competent readers" over individual whim).

  **Current Standings:** In your specific case, **Slot** and **Reader** vote **YES**. **Spirit** votes **NO**. Since Mira prioritizes System (Rotated *a*) and Function (Stencil *a*) over rigid Form, the YES votes win.

