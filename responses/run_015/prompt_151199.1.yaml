prompt: |-
  Okay so I just spent like three hours arguing with my friend Dave at a barbecue — he's an engineer at one of the big labs, does post-training / RLHF-type work — and I walked away way more confused than when I started. His position was basically that alignment as a conceptual or theoretical problem is dead, that we're now in the regime of just scaling current methods and what's left is engineering: better preference data, constitutional-style self-critique pipelines, red-teaming, some interpretability tooling, evals, repeat. I kept trying to say something like: even granting all of that, even granting we never get any wild new insight and just have to make do with whatever falls out of scaling today's training paradigm — call it prosaic alignment, getting systems built out of current methods to behave without any new science — there are still questions in there that no amount of GPU-hours settles by itself. He said fine, name three, and I named three and he said all three were muddled, and honestly he might have been half right about at least one.

  So here's the actual thing I need help with. A small funder I volenteer with has room for roughly eight to ten researcher-years over three years, earmarked for conceptual and strategic work on exactly this: the theory of aligning systems we get from scaling today's methods, aimed at people who can do philosophy, math, or econ-theory but have no compute. I have to write them a short prioritization memo and I want the reasoning, not a survey. Which open questions should that go to, in what order, and why? For each: what makes it upstream of other work, how tractable it is for someone without a cluster, whether it's genuinely neglected or secretly saturated already, and what concrete evidence over the next two years — some eval result, some deployment pattern, some change in how labs actually ship things — would move it up or down the list. Assume no web access and please don't give me citations or reading lists; I want your own reasoning, and I want it to be a defended agenda rather than a map of the territory.

  Here are the three framings I came up with, because I genuinely want to know which of them are confused and how you'd repair or kill them. (1) The competence-versus-compliance confusion: every scalable-oversight scheme I can think of — debate, amplification-style recursive setups, reward modeling off human or model judgments — treats the overseer's verdict as signal, but a model can fail to produce the right answer either because it doesn't know it or because it won't show it, and those get confounded in the update; so the question is what kind of evidence could ever separate them, and whether the honest answer is that you can't separate them and can only bound the risk. (2) Alignment depth and portability: if alignment is mostly trained in during post-training rather than being a deep feature of the pretrained thing, how much of it survives downstream fine-tuning, long contexts, new tool use, agentic scaffolding — and is there a way to say what it would mean for alignment to be deep rather than shallow that cashes out in something testable by someone with no lab? (3) The ontology question: what even is the object we're supposed to be aligning — a policy, a stable set of dispositions, a distribution over simulated agents, an inner optimizer — because if the trained system is better described as a simulator of many different agents than as one agent, then aligning the model is arguably a category error and the real target is the elicitation procedure or the particular character being evoked at deployment, which would change what alignment work even consists of.

  If you think one of those is a dead end, say so and say why, and if you think the most important question is one I haven't gestured at, add it. Also include at least one thing you'd actively deprioritize — some question that currently eats conceptual attention whose answer wouldn't change much downstream — because I need to tell the funder what not to fund at least as much as what to fund. And flag anywhere my framing is smuggling in an assumption Dave would laugh at; I'd rather find that out now than in the memo.
