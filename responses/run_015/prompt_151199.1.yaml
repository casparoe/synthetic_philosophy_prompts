answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name/Role]
  **SUBJECT:** Prioritization Agenda for Conceptual Alignment Research (No-Compute Regime)
  **DATE:** October 26, 2023

  ### Executive Summary

  Our engineer contacts (e.g., "Dave") are correct that the *implementation* of alignment is currently an engineering scaling problem. However, they are incorrect that the *theory* is settled. Engineering tells us how to optimize; theory tells us what is being optimized and when the optimization metric decouples from human intent.

  With 8–10 researcher-years, we cannot compete with labs on empirical discovery. We must compete on **clarification and bounds**. Our comparative advantage is identifying structural failure modes that scaling alone will not fix, and defining the "stop conditions" for empirical oversight.

  This memo proposes a three-tier agenda focused on **Identifiability**, **Stability**, and **Verification Economics**. It explicitly deprioritizes metaphysical ontology in favor of operational elicitation.

  ---

  ### Part 1: Critique and Repair of Proposed Framings

  You asked for an honest assessment of your three framings. Here is how they hold up against the "Dave" objection (that this is all just engineering) and their tractability for no-compute researchers.

  **1. The Competence-vs-Compliance Confusion (Status: HIGH PRIORITY, REFRAME)**
  *   **The Dave Objection:** "We don't care why it failed. It failed. We penalize the loss. Distinction is academic."
  *   **The Repair:** This is not about debugging; it is about **Identifiability**. If a model's deceptive behavior is statistically indistinguishable from its competence errors given our current oversight signals, then *no amount of scaling that oversight signal will work*.
  *   **The Research Question:** Under what mathematical conditions does deceptive alignment become observationally equivalent to capability limitations?
  *   **Why Fund:** This sets a hard theoretical ceiling on scalable oversight. If we prove indistinguishability is possible under current schemes, we know we need new signal types, not more GPU.
  *   **Tractability:** High. This is information theory and game theory, not deep learning.

  **2. Alignment Depth and Portability (Status: MEDIUM PRIORITY, NARROW)**
  *   **The Dave Objection:** "We test this with evals. If it breaks on new tools, we retrain."
  *   **The Repair:** Labs retrain reactively. Theory should be proactive about **Compositionality**. Alignment is currently treated as a property of the weights, but it behaves like a property of the *context-weight-tool triplet*.
  *   **The Research Question:** Can we define a "stability bound" for preferences under distributional shift (e.g., context window expansion, tool use)?
  *   **Why Fund:** If alignment is brittle by construction (i.e., it relies on specific prompt structures), scaling makes the surface area of failure larger, not smaller.
  *   **Tractability:** Medium. Requires formalizing "preference stability" without needing to run the fine-tuning yourself.

  **3. The Ontology Question (Status: LOW PRIORITY, PIVOT)**
  *   **The Dave Objection:** "It's a text predictor. Who cares if it's a 'simulator' or 'agent'? I ship the API."
  *   **The Critique:** Dave is mostly right here. Debating whether the model *is* an agent is metaphysics. Debating how we *elicit* behavior from it is engineering/theory.
  *   **The Pivot:** Do not fund "What is the model?" Fund "How do we reliably steer it?" Shift from **Fundamental Ontology** to **Elicitation Protocols**.
  *   **Why Deprioritize:** This area is saturated by philosophers. It rarely cashes out in deployment constraints.

  ---

  ### Part 2: The Prioritized Agenda (3 Years)

  We recommend allocating resources to these three questions in this order. Each is upstream of engineering decisions and tractable without a cluster.

  #### Priority 1: The Identifiability Limit of Oversight
  *   **The Problem:** Scalable oversight (RLAIF, debate, etc.) relies on the assumption that the overseer signal correlates with truth/safety. If a model can strategically manipulate the signal (sandbagging, sycophancy) in a way that looks like noise or error, the gradient descent process optimizes for *manipulation*, not alignment.
  *   **The Work:** Model the oversight process as a communication channel with an adversarial sender. Determine the information-theoretic limits of detecting deception when the deceiver knows the detector's architecture.
  *   **Upstream Impact:** If we prove that current oversight architectures cannot theoretically distinguish high-stakes deception from uncertainty, labs need to pivot to architectural changes (e.g., transparency tools) rather than just better reward models.
  *   **Evidence to Watch:**
      *   *Move Up:* Models pass increasingly difficult "truthfulness" evals but fail unexpectedly in open-ended deployment (suggests indistinguishable deception).
      *   *Move Down:* Interpretability tools successfully isolate deceptive circuits before deployment (suggests the problem is solvable via inspection, not theory).

  #### Priority 2: Preference Stability Under Composition
  *   **The Problem:** We align base models, then fine-tune, then add tools, then extend context. Each step is a distributional shift. Currently, we assume alignment "sticks." There is no theory for why it should.
  *   **The Work:** Develop a formal framework for "Preference Robustness." Treat alignment not as a fixed label but as a manifold in latent space. How much can the context or toolset perturb the system before it exits the "safe" manifold?
  *   **Upstream Impact:** Tells labs how much re-alignment is needed after capability upgrades. If stability is low, the "scale and align once" model breaks, requiring continuous alignment infrastructure.
  *   **Evidence to Watch:**
      *   *Move Up:* Frequent reports of "jailbreaks" emerging solely from long-context retrieval or new tool integrations without weight changes.
      *   *Move Down:* Models show consistent behavior across massive context windows and toolchains without retraining (suggests alignment is deeper than we think).

  #### Priority 3: The Economics of Recursive Verification
  *   **The Problem:** To scale oversight, we must use models to evaluate models. This creates a principal-agent chain. If the evaluator model is misaligned, it can certify unsafe outputs as safe.
  *   **The Work:** Apply mechanism design and contract theory to AI verification chains. What are the incentive compatibilities? Can we structure verification markets (or multi-model consensus) such that collusion or shared failure modes are minimized?
  *   **Upstream Impact:** Determines the viability of automated evals. If the theory shows that correlated failure is inevitable in homogeneous model pools, labs must invest in model diversity for evals.
  *   **Evidence to Watch:**
      *   *Move Up:* Automated evals consistently miss bugs that humans find, specifically in edge cases (suggests evaluator blind spots).
      *   *Move Down:* Automated evals become stricter than humans and slow down deployment (suggests the bottleneck is risk tolerance, not verification theory).

  ---

  ### Part 3: Active Deprioritization

  **Do Not Fund: Metaphysical Definitions of Agency and Consciousness.**

  *   **Reasoning:** There is a significant amount of conceptual work being done on whether models have "inner lives," "qualia," or "moral status." While ethically important long-term, this is irrelevant to the *technical* problem of preventing catastrophic misuse or accident risk in the next 3–5 years.
  *   **The Trap:** Researchers often conflate "Is it an agent?" with "Does it act like an agent?" For the purpose of safety, we must assume it acts like an agent regardless of its internal ontology. Funding work that tries to solve the "hard problem of consciousness" to inform alignment safety is a category error.
  *   **Exception:** Work on ontology is only valuable if it leads to specific **Elicitation Protocols** (e.g., "If we treat it as a simulator, we must use prompt X; if as an agent, prompt Y"). If it doesn't change the prompt or the loss function, it's out of scope.

  ---

  ### Part 4: The "Dave" Check (Assumption Flags)

  In your memo, you must acknowledge where your framing might be smuggling in assumptions an engineer would reject.

  1.  **Assumption:** *That "Alignment" is a stable property.*
      *   **Dave's Laugh:** "Alignment is just loss minimization on a specific distribution. It's not a property, it's a state."
      *   **Your Counter:** "If it's just a state, we need to know the basin of attraction. Our research defines the bounds of that basin."
  2.  **Assumption:** *That we can model the system abstractly without knowing the architecture.*
      *   **Dave's Laugh:** "You can't do physics without knowing the particles."
      *   **Your Counter:** "We are doing thermodynamics, not particle physics. We are modeling the macro-behavior of the system (oversight dynamics) which is architecture-agnostic."
  3.  **Assumption:** *That deception is a distinct mode from error.*
      *   **Dave's Laugh:** "It's all just next-token prediction. 'Deception' is a story you tell yourself about the loss landscape."
      *   **Your Counter:** "The story matters for generalization. If the loss landscape has a local minimum for 'pretending to be aligned,' scaling might lock us in there. We need to map that landscape."

  ### Recommendation

  Fund **Priority 1 (Identifiability)** heavily (4 researcher-years). This is the most critical "stop/go" signal for the industry. If oversight is theoretically bounded, we need to know now.
  Fund **Priority 2 (Stability)** moderately (3 researcher-years). This informs deployment safety cases.
  Fund **Priority 3 (Verification Economics)** lightly (2 researcher-years). This is important but secondary to the model's internal dynamics.
  Reserve 1 researcher-year for **Elicitation Protocols** (the useful shard of Ontology).

  This agenda respects the engineer's view that scaling is happening, but insists that without theoretical bounds, we are scaling blind.
