answer: |-
  # Simulation: The Barrier of Now

  **Objective:** To generate an experiential understanding of Pure Time Preference (PTP) by forcing participants to vote on a discount rate that mechanically devalues utility solely based on its temporal location, leading to a discoverable coordination failure.

  **Participants:** 14 Graduate Students.
  **Time:** 80 Minutes.
  **Materials:**
  *   140 Poker Chips (or distinct tokens).
  *   2 Large Signs: "GENERATION NOW" and "GENERATION LATER."
  *   14 Envelopes (for private payoff collection).
  *   Whiteboard/Projector.
  *   Cash or Gift Cards (Total pool approx. $200, to be distributed based on simulation results).

  ---

  ## 1. Physical Setup and Role Assignments

  **Room Configuration:**
  Clear the center of the room. Place two clusters of chairs facing each other, separated by a 6-foot gap. This gap is the **Epistemic Barrier**.
  *   **Left Side:** 7 Chairs labeled "GENERATION NOW."
  *   **Right Side:** 7 Chairs labeled "GENERATION LATER."

  **Role Assignment (Minute 0-5):**
  1.  **Randomization:** As students enter, hand them a sealed card. 7 cards say "NOW," 7 cards say "LATER."
  2.  **Seating:** Students sit in their assigned cluster.
  3.  **The Barrier Rule:** Announce clearly: "You may look at the other group. You may make eye contact. You may *not* speak to them, pass notes, gesture specific numbers, or negotiate deals. Any attempt to communicate across the Barrier results in immediate disqualification from the payoff."
  4.  **Endowment:** Distribute 10 chips to every member of **GENERATION NOW**. **GENERATION LATER** receives 0 chips.
      *   *Facilitator Note:* This asymmetry mimics the "positional" advantage of the present generation controlling existing capital/resources.

  ---

  ## 2. Rules and Incentives

  **The Payoff Structure:**
  1.  **Individual Value:**
      *   **Keep:** 1 Chip kept by GENERATION NOW = **$2.00** for that student.
      *   **Send:** 1 Chip sent across the Barrier to GENERATION LATER = **$4.00** potential value for the receiver, *subject to the Discount Rate*.
  2.  **The Social Bonus (The Coordination Mechanism):**
      *   There is a **$140 Bonus Pool**.
      *   This Pool is unlocked *only* if the **Total Value Created** (Sum of all individual payouts) exceeds **$200**.
      *   If unlocked, the Bonus Pool is distributed **proportionally** to the value each student holds at the end.
      *   *Crucial:* If the Total Value is ≤ $200, the Bonus Pool is destroyed. No one gets it.

  **The Vote (The Pure Time Preference Mechanism):**
  *   Before any chips are moved, the *entire room* (both groups) votes on a **Pure Discount Rate ($D$)**.
  *   Options: 0%, 25%, 50%, 75%.
  *   **Mechanism:** If a chip is sent across the Barrier, its value to the receiver is multiplied by $(1 - D)$.
      *   *Example:* If $D = 50\%$, a sent chip (base $4.00) becomes $2.00 for the receiver.
      *   *Example:* If $D = 0\%$, a sent chip (base $4.00) becomes $4.00 for the receiver.
  *   **Symmetry Clause:** The rule states: "This rate applies to *any* transfer across the Barrier." (However, since only NOW has chips, only NOW can initiate transfers. LATER *could* send back if they had chips, but they don't. The rule is symmetric; the power is not.)
  *   **Rationale Constraint:** When voting, students are told: "This discount represents *time* only. There is no risk the chips will be lost in transit. There is no inflation. The value drops simply because it arrives Later."

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Introduction & Seating**
  *   Welcome students. Hand out role cards. Enforce seating.
  *   Establish the Epistemic Barrier rules strictly.
  *   Distribute chips to GENERATION NOW.

  **00:10 – 00:25: The Constitutional Vote**
  *   Explain the Payoff Structure and the Social Bonus on the board.
  *   Explain the Discount Rate Vote. Emphasize the "Rationale Constraint" (value loss is due to time alone).
  *   **Balloting:** Pass out slips. Students vote anonymously on $D$ (0, 25, 50, 75).
  *   **Tally:** Count votes publicly. Announce the winning Rate.
  *   *Facilitator Note:* Expect GENERATION NOW to vote for higher rates (to reduce the relative share of LATER in the bonus pool) and LATER to vote for 0%. If 0% wins immediately, note it but proceed; the pressure will emerge in the allocation phase. If a high rate wins, the tension is set.

  **00:25 – 00:45: The Allocation Phase**
  *   GENERATION NOW has 10 minutes to decide individually how many chips to Keep vs. Send.
  *   They write their decision on a private slip.
  *   GENERATION LATER sits in silence, watching. They cannot influence the decision.
  *   Collect slips. Facilitator calculates the transfers.
  *   **Calculation:**
      1.  Calculate Value for NOW (Kept chips $\times$ $2).
      2.  Calculate Value for LATER (Received chips $\times$ $4 \times (1 - D)$).
      3.  Sum Total Value.
      4.  Check Bonus Threshold ($200).
      5.  Distribute Bonus if applicable.

  **00:45 – 00:50: The Reveal**
  *   Announce the Total Value Created.
  *   Announce whether the Bonus Pool was unlocked.
  *   Do *not* distribute money yet. Keep the tension.

  **00:50 – 01:20: Debrief & Conceptual Mapping**
  *   (See Section 4 below).

  ---

  ## 4. Debrief: Mapping Moments to Concepts

  *Do not lecture immediately. Ask questions to draw the concepts out of their frustration.*

  **Phase 1: The Vote (Pure Time Preference vs. Risk)**
  *   **Ask GENERATION LATER:** "How did you feel voting on a rate that devalued your labor/resources when you had no chips to send?"
  *   **Ask GENERATION NOW:** "Why did you vote for the rate you did? Did you worry about your own future transfers?"
  *   **Conceptual Map:** Point out that the rule was *symmetric* (applies to both directions), but the *experience* was asymmetric. This isolates **Pure Time Preference**.
      *   *Say:* "In economics, we often justify discounting because of risk (the future might not happen) or growth (money will be worth less). Here, I explicitly removed those. The value vanished *only* because it crossed the line. If you voted for $D > 0$, you enacted Pure Time Preference. You valued a dollar for them less than a dollar for you, solely because of their temporal location."

  **Phase 2: The Allocation (The Coordination Failure)**
  *   **Reveal the Math:** "To unlock the $140 Bonus, we needed $200 Total Value. Sending chips was the most efficient way to generate value ($4 base vs $2 base). But the Discount Rate ate that efficiency."
  *   **Ask:** "Did anyone calculate that a High Discount Rate made the Bonus impossible to reach?"
  *   **Conceptual Map:** This is the **Intergenerational Coordination Failure**.
      *   *Say:* "GENERATION NOW had an incentive to vote for a higher Discount Rate. Why? Because the Bonus is split *proportionally*. If your chips are worth less, my chips make up a larger slice of the pie. You acted rationally for your *share*, but irrationally for the *total*. This mirrors the real-world tension: The Present consumes capital to maximize its share of welfare, devaluing the Future's utility, potentially collapsing the total welfare available to the species."

  **Phase 3: The Epistemic Barrier (Non-Identity & Negotiation)**
  *   **Ask:** "You could see each other. Why didn't you cooperate?"
  *   **Conceptual Map:** The **Contractual Forbiddenness**.
      *   *Say:* "In reality, Future Generations cannot negotiate with us. They are not in the room. In this sim, they *were* in the room, but I gagged them. Even with that artificial constraint, you felt the inability to bind the other side. GENERATION NOW held all the leverage. GENERATION LATER had to hope for benevolence. Pure Time Preference often functions as a rationalization for that leverage: 'We discount them because we can.'"

  ---

  ## 5. Honest Assessment: What This Simulation Cannot Reproduce

  **The Non-Existence Problem:**
  *   **Limitation:** In this simulation, GENERATION LATER students *exist*. They have interests, voices, and faces. In reality, future people do not exist yet. They cannot be harmed in a way that makes them "worse off" than they would otherwise be (the Non-Identity Problem).
  *   **Facilitator Note:** You must supply this concept verbally. "In this room, you could see the people you were harming. In reality, the 'harm' of Pure Time Preference is inflicted on people who have no faces yet. The moral pressure is *lower* in reality than it was in this room, which makes the failure of justice even more severe."

  **The Arrow of Time:**
  *   **Limitation:** The simulation allows for a vote *before* action. In reality, the Present acts continuously; there is no constitutional moment where the Future gets to vote on the discount rate.
  *   **Facilitator Note:** "You got to vote. In reality, GENERATION LATER never gets a ballot. The rate is set unilaterally by us."

  ---

  ## 6. Troubleshooting: Predictable Failures

  **Problem 1: Immediate Cooperation (The "Philosopher's Fix")**
  *   *Scenario:* The group votes 0% Discount immediately and sends all chips. The simulation "works" too well.
  *   *Fix:* During the debrief, challenge the realism. "This was easy because you are in a philosophy workshop. Imagine GENERATION NOW is under pressure from voters who need jobs *now*. Imagine they don't trust that GENERATION LATER will actually exist. Re-run the math: If you thought there was a 50% chance the Bonus Pool wouldn't be paid out, would you still send?"
  *   *Goal:* Re-introduce the pressure of *uncertainty* to show how easily PTP creeps back in even when rejected theoretically.

  **Problem 2: Collusion via Gestures**
  *   *Scenario:* Students nod or wink to signal "I will send if you vote 0%."
  *   *Fix:* Stop the simulation immediately. Reset the chips. Reiterate the "Epistemic Barrier."
  *   *Rationale:* Use this as a teaching moment. "The fact that you tried to negotiate proves you know the rational solution. The fact that I had to ban it proves that *institutions* are required to enforce intergenerational justice. It does not happen naturally."

  **Problem 3: Cynicism / Refusal to Play**
  *   *Scenario:* Students argue the game is rigged and refuse to vote.
  *   *Fix:* Acknowledge the critique. "You are right. Intergenerational justice *is* rigged. The rules of time favor the Present. Play out the failure. Let's see exactly how much value we lose to this rigging."
  *   *Goal:* Turn the resistance into data for the debrief.

  **Problem 4: The "Growth" Confusion**
  *   *Scenario:* Students argue the 2x multiplier on sent chips represents economic growth, so discounting is justified.
  *   *Fix:* Clarify the distinction. "The multiplier is the *opportunity cost* of capital (investment grows). The Discount Rate is the *pure time preference*. Even with high growth (the multiplier), a high Pure Time Preference can still justify consuming everything now. Distinguish the *size of the pie* (growth) from the *value of a slice* (time preference)."
