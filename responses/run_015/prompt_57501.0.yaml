      *   **User's Proposed Principle:** "Equalise effective access... give people whatever it takes to convert a shift into science."
      *   **User's Critique of Own Principle:** Fails on Case 2 (Bad Controls) and Case 5 (Postdoc Quit). It suggests training/helping, but the user cut/docked instead.
      *   **Task:**
          1.  State the principle(s) precisely (clause by clause).
          2.  Map clauses to cases.
          3.  Identify trade-offs/costs.
          4.  Highlight where my principle diverges from theirs.
          5.  Apply to two new cases (Autonomous Experiment, Dead PI).
          6.  Identify which of their past verdicts cannot survive the principle.
          7.  No reading list.

  2.  **Deconstruct the Tension:**
      The user is wrestling with the "Equality of What?" debate (Sen) applied to a specific scarcity problem (beam time).
      *   *Case 1 & 4* suggest **Equality of Capability** (compensating for disadvantages to ensure equal ability to produce science).
      *   *Case 2 & 5* suggest **Responsibility/Accountability** (you are responsible for your design and your team stability).
      *   *Case 3* suggests **Prioritarianism/Diversity** (helping those with less prior access).
      *   *Case 7* suggests **Utilitarianism** (maximize total science/funding, even via market means).
      *   *Case 6* suggests **Anti-Leveling Down** (equality isn't valuable if it makes everyone worse off).

      The user's "Effective Access" principle is essentially a Capability Approach. It fails because it doesn't account for *responsibility*. If you can't convert the shift because you are disabled, we help (Case 4). If you can't convert because you were negligent (Case 2) or unlucky (Case 5), the user punished them.
      *Correction:* In Case 5, the user admits punishing bad luck is inconsistent with Case 1 (compensating for structural bad luck). This is a key tension to address.

  3.  **Drafting the Principle:**
      I need a hybrid principle. It can't be pure Sen (Capability) because of Case 2 & 5. It can't be pure Dworkin (Resources) because of Case 1 & 4. It needs to be a **Responsibility-Sensitive Prioritarian Capability Principle.**
      Let's simplify for the user's taste. Let's call it **"Scientific Opportunity with Accountability."**

      *Clause 1: The Floor (Capability).* Ensure everyone has the physical/technical means to use the time. (Handles Case 4).
      *Clause 2: The Prioritarian Weight.* Give weight to those with less historic access/resources. (Handles Case 1 & 3).
      *Clause 3: The Efficiency Constraint.* Do not allocate where the probability of scientific output is negligible due to negligence. (Handles Case 2).
      *Clause 4: The Accountability Clause.* Unused resources due to internal management reduce future claims. (Handles Case 5).
      *Clause 5: The Utilitarian Override.* External revenue can purchase access if it subsidizes the pool. (Handles Case 7).

      *Wait, I need to be stricter.* The user asked me to say where *their* verdicts can't survive.
      Case 5 (Postdoc Quit) is the weak link. Compensating for structural disadvantage (Case 1) but punishing for contingent bad luck (Case 5) is the inconsistency. Dworkin distinguishes between "brute luck" (not your fault) and "option luck" (gamble you took). Hiring a postdoc is a gamble. Being a state college is brute luck.
      Case 7 (Industrial) is also tense. If money buys access, does it violate the Prioritarian Weight? Only if the money sustains the floor.

      *Refining the Principle:*
      **Principle of Responsible Scientific Opportunity.**
      1.  **Equalize Conversion Factors:** Compensate for unchosen disadvantages that hinder converting beam time to science.
      2.  **Prioritize Marginal Access:** Favor those with less prior access/infrastructure, ceteris paribus.
      3.  **Enforce Stewardship:** Penalize waste caused by agent negligence or management failure.
      4.  **Maximize Aggregate Output:** Subject to 1-3, allocate where science is most certain.

      *Where does this clash with the user?*
      The user's "Effective Access" implies we should help the Bad Controls group learn. My principle says "No, that's negligence/stewardship."
      The user's verdict on Case 5 (Docking the group) clashes with Case 1 (Compensating State College). One is brute luck (location), one is option luck (hiring). I need to make this distinction clear.

  4.  **Addressing the New Cases:**
      *   *Autonomous Experiment:* No human on site. "Per-person metric" breaks.
          *   Application: The "Floor" becomes technical compatibility. The "Cap" applies to compute/storage, not human shifts. The "Prioritarian" clause might favor human teams over robots if the goal is training/people, but if the goal is *science*, the robot wins on efficiency.
      *   *Dead PI:* Grad student finishing work only PI understood.
          *   Application: This is "Brute Luck" (death). Clause 1 (Conversion Factors) suggests support. Clause 3 (Stewardship/Efficiency) suggests high risk of waste. Clause 2 (Prioritarian) favors the student (low access).
          *   Verdict: Fund it, but with monitoring. It aligns with Case 1 (State College) more than Case 2 (Bad Controls).

  5.  **Identifying the Unsustainable Verdict:**
      The user suspects Case 5 (Postdoc Quit) is shaky. I need to confirm this.
      Also, Case 7 (Industrial) is theoretically unstable if the money doesn't actually subsidize the academic pool sufficiently to offset the displacement. But the user says it *did* go back to the pool.
      The real tension is between Case 1 (Compensate Structural Luck) and Case 5 (Punish Contingent Luck).
      I will argue Case 5 is the one that must go, or be heavily qualified. If we compensate for the state college's lack of robot (structural), we should insure against the postdoc quitting (contingent risk), *unless* we view hiring as a choice (Option Luck). Dworkin's distinction is useful here without needing the reading list.

  6.  **Structuring the Response:**
      *   **Acknowledge the expertise:** Validate the practical philosophy.
      *   **The Principle:** "Responsibility-Sensitive Scientific Capability."
      *   **Clause Breakdown:** Map to cases, state costs.
      *   **Divergence:** Where my principle fights the user's "Effective Access."
      *   **New Cases:** Autonomous & Dead PI.
      *   **The Sacrifice:** Which verdict must die? (Case 5 is the primary candidate, potentially Case 7 depending on definition of 'pool').

  7.  **Refining the Tone:**
      *   No fluff.
      *   Respect the physics background (use terms like "signal-to-noise," "constraints").
      *   Direct about the contradictions.
      *   Avoid academic name-dropping (Sen/Dworkin mentioned only as context, not theory).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address Case 6 (Machine Underperformance)?
      *   *Thought:* Case 6 shows equality of outcome isn't the goal. My principle needs to reflect that the *goal* is science, not fairness for fairness' sake.
      *   *Adjustment:* Add a "Maximization" clause that trumps equality when the total pie shrinks.
