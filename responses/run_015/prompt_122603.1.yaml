  # The Aesthetic Testimony Decision Tree

  This instrument is designed to sort your characters' positions based on how they react to concrete situations, not abstract principles. Follow the path of their answers. If two characters land on the same leaf, they agree on the fundamentals, even if they argue about the details. If they land on different leaves, they are talking past each other.

  There are seven questions (nodes). Each uses one or more of your required cases. There are ten possible endings (leaves): eight occupied by actual philosophical positions, two empty because no one logically holds them.

  ### Node 1: The Prediction
  **Case:** Your friend hasn't read the book, but knows your taste cold. She says, "You'll love this."
  **Question:** When she says that, is she telling you something about the *book* (it has quality) or something about *you* (you will have a reaction)?
  *   **A. About me.** (She's predicting my response.) → **Go to Leaf 1.**
  *   **B. About the book.** (She's judging its merit.) → **Go to Node 2.**
  *   **C. About neither.** (She's guessing or lying.) → **Go to Leaf 9 (Unoccupied).**

  ### Node 2: The Burnt Manuscript
  **Case:** A novel exists in one copy behind glass, in a language nobody alive reads. A scholar you trust says it's the best thing she's ever read. No one can ever check.
  **Question:** Is she right? Is the book actually a masterpiece?
  *   **A. No.** (Beauty needs a mind to perceive it; without a reader, there's nothing to be true.) → **Go to Leaf 2.**
  *   **B. Yes.** (Quality exists independently of whether anyone experiences it.) → **Go to Node 3.**

  ### Node 3: The Insensitive Case
  **Case:** You have no sensitivity in this domain—no ear for prose rhythm, no feel for structure. A poet tells you a poem is beautiful.
  **Question:** Do you believe her? Can you even form the belief that it's beautiful?
  *   **A. No.** (I can't grasp the claim, so I can't believe it.) → **Go to Leaf 3.**
  *   **B. Yes.** (I trust her word even if I can't feel it.) → **Go to Node 4.**

  ### Node 4: The Trained Ear
  **Case:** A critic hears structural counterpoint you physically cannot hear. She reports it and says the book is good.
  **Question:** You believe her. Do you *know* it's good, or do you just have a true belief?
  *   **A. Just belief.** (You need to hear the grounds yourself to have knowledge.) → **Go to Leaf 4.**
  *   **B. Knowledge.** (Testimony transfers knowledge just like in history or science.) → **Go to Node 5.**

  ### Node 5: The Aggregate vs. One Person
  **Case:** Ten thousand strangers give it 5 stars. One friend who knows your taste gives it 5 stars.
  **Question:** Whose judgment makes it "good" for you?
  *   **A. The Friend.** (It's only good if it works for someone like me.) → **Go to Leaf 5.**
  *   **B. The Strangers.** (Merit is public and objective.) → **Go to Node 6.**
  *   **C. Neither.** (I ignore both until I read it myself.) → **Go to Leaf 10 (Unoccupied).**

  ### Node 6: The Citation (Action vs. Merit Branch 1)
  **Case:** You ghostwrite a prize citation for a book you haven't read. You know it's good (via testimony).
  **Question:** Do you sign your name to the citation?
  *   **A. Yes.** (If I know it's good, I can endorse it.) → **Go to Node 7.**
  *   **B. No.** (I must own the judgment myself to speak it.) → **Go to Leaf 6.**

  ### Node 7: The Priming & Cheap Access (Action vs. Merit Branch 2)
  **Case:** You could read the first page in ten seconds (Cheap Access) or someone tells you the ending trick (Priming). You don't read/ask, you just accept the judgment.
  **Question:** Is this acceptable engagement with the art?
  *   **A. Yes.** (Understanding the value is the goal; how I get there doesn't matter.) → **Go to Leaf 7.**
  *   **B. No.** (The experience of discovery is the point; skipping it ruins the value.) → **Go to Leaf 8.**

  ---

  ### The Leaves (Positions)

  **Leaf 1: Learning about future response.**
  *   **Claim:** You aren't learning about the book at all; you're learning about your own likely reaction. The judgment is a prediction, not a fact.
  *   **Character Vibe:** Pragmatic, focused on the reader's experience rather than the object.

  **Leaf 2: No aesthetic knowledge to transmit.**
  *   **Claim:** There is no fact of the matter without a viewer. The debate is misframed because "beauty" isn't a property that exists in the dark.
  *   **Character Vibe:** Idealist, relational. Might say "Art is a handshake, not a stone."

  **Leaf 3: The Hard One.**
  *   **Claim:** Nothing comes across at all. No knowledge, not even a justified belief. If you lack the sensibility, the testimony is noise.
  *   **Character Vibe:** Elitist or humble (depending on tone). "You had to be there, and you weren't."

  **Leaf 4: Real thing but not knowledge.**
  *   **Claim:** You end up with something real (a true belief), but it still isn't knowledge. You're right, but you don't *know* why.
  *   **Character Vibe:** Epistemically cautious. "I believe you, but I can't claim it as my own knowledge."

  **Leaf 5: Works only if sensibility tracks.**
  *   **Claim:** It works, but only because you independently have reason to think this testifier's sensibility tracks yours. It's not about the book; it's about the match.
  *   **Character Vibe:** Reliabilist. "I trust *her*, not the book."

  **Leaf 6: Yes you can know, but you shouldn't (Owning Taste).**
  *   **Claim:** Sure you can know, but you shouldn't speak it. One reason hiding inside "shouldn't": you must own your own taste rather than borrowing someone's.
  *   **Character Vibe:** Autonomy-focused. "Don't sign my name to what I didn't feel."

  **Leaf 7: Testimony is just testimony.**
  *   **Claim:** There's nothing special about the aesthetic case. Testimony is testimony. If you know it's good, act like it.
  *   **Character Vibe:** Optimist, efficient. "Why reinvent the wheel?"

  **Leaf 8: Yes you can know, but you shouldn't (Engagement).**
  *   **Claim:** Sure you can know, but you shouldn't bypass the experience. The second reason hiding inside "shouldn't": aesthetic engagement is for experiencing, not just cataloging merit.
  *   **Character Vibe:** Experience-focused. "Knowing the trick kills the magic."

  **Leaf 9 (Unoccupied): Incoherent Trust.**
  *   **Diagnosis:** You said she's guessing/lying (Node 1C), but you're still listening to her. Why trust a guess?
  *   **Status:** No one lives here.

  **Leaf 10 (Unoccupied): Incoherent Ignoring.**
  *   **Diagnosis:** You said testimony works (Node 4B), but you ignore all testimony (Node 5C). You're contradicting your own epistemic rule.
  *   **Status:** No one lives here.

  ---

  ### Notes on the Map

  **Confidence:**
  I am moderately confident in this as a picture of the debate. It covers the standard "Pessimist vs. Optimist" split, the "Normative" turn (can vs. should), and the "Non-Cognitivist" outlier.

  **Least Sure Node:**
  **Node 6 (The Citation).** I am least sure about the separation between Leaf 6 (Owning Taste) and Leaf 8 (Engagement). In practice, characters might sound identical ("I won't do it"). The distinction is shaky because people haven't settled whether the "shouldn't" is about *professional honesty* (Citation) or *personal experience* (Priming). I kept them separate because your plot needs three distinct professionals, and this gives them different reasons to say "No."

  **Invented Positions:**
  I had to invent **Leaf 9** and **Leaf 10** to fill the logical space required for the tree structure. These are the "unoccupied cells." You can put a character here if you want someone who is logically inconsistent (perhaps the blurb writer who admits she's guessing but sells it anyway).

  **The Action vs. Merit Distinction:**
  You asked whether this distinction is real. **It is real.** I used it to split Node 6 (Merit/Judgment) from Node 7 (Action/Experience).
  *   Node 6 asks: "Can you *judge* it?" (Citation).
  *   Node 7 asks: "Can you *consume* it?" (Priming/Access).
  *   If you delete this distinction, Leaf 6 and Leaf 8 collapse into one "Shouldn't" leaf. Keep it if you want your characters to disagree on *why* testimony is bad (Professional fraud vs. Personal loss).

  **Indistinguishable Leaves:**
  **Leaf 6 and Leaf 8** are the danger zone. Both say "You shouldn't." In dialogue, they will sound similar unless you emphasize the *reason*.
  *   Leaf 6 character says: "It's not *my* voice."
  *   Leaf 8 character says: "It's not *my* experience."
  *   If your characters don't make that distinction clear, these two leaves will feel like the same position.

  **Unused/Combined Cases:**
  I combined **Cheap Access** and **Priming** into Node 7. They both test whether *effort* matters to the value of the judgment. If you need them separate, split Node 7 into two questions, but be warned: it will make the tree deeper and might force you to cut one of the empty leaves.
