  3. Regarding persistent failure on problems requiring analogies across perceptual domains, the analogical defender attributes this to a fundamental lack of analogical capacity in purely statistical models. The statistical defender argues such failures merely demonstrate an insufficient training distribution rather than an architectural inability to learn the mapping.
  4. The central crux is whether solving a genuinely novel problem after one example per class involves constructing an explicit structural analogy or interpolating within a learned statistical manifold. We agree to test this using a left/right distinction governed by an abstract relational property instantiated in shapes sharing no low-level visual features, where the analogical side predicts model failure and the statistical side predicts successful generalization.
  5. We distinguish substantive disagreements regarding architectural necessity from verbal disputes over whether implicit feature correlations constitute a form of analogy. The conceptual distinctions doing the real work concern whether generalization requires discrete structural representations or continuous metric proximity.
