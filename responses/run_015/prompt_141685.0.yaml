      *   *Specifics:*
          *   **Clash 1 (The Math Problem):** View 3 (Total Sum) vs. View 5 (Repugnant Conclusion) & View 7 (Better for Someone).
              *   *Explanation:* If you just add numbers (3), you get the Repugnant Conclusion (5). If you say "better for someone" (7), adding a new person doesn't count as "better."
              *   *Severity:* Critical.
          *   **Clash 2 (The Extinction Problem):** View 1 (No Duty) vs. View 4/6 (Extinction is Bad).
              *   *Explanation:* If everyone does 1, 4/6 happens. Is it bad if no one is *wrong*?
              *   *Severity:* High emotional weight, logically solvable via "collective action."
          *   **Clash 3 (The Priority Problem):** View 8 (Fix existing) vs. View 3 (Total Sum).
