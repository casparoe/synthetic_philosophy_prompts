answer: |-
  **Joint Statement on Biographical Moral Pedagogy**

  **I. Agreed Claims**
  1. Plutarch’s *synkrisis* employs a paired comparative structure intended to facilitate judgment between subjects across different political conditions.
  2. Biographical narrative necessarily involves selection, introducing psychological and historical distortion relative to complete factual records, regardless of authorial intent.
  3. Narrative identification functions as a cognitive mechanism wherein readers simulate the agent’s perspective, influencing both evaluation and action.
  4. Moral knowledge (correct judgment of value) is conceptually distinct from moral motivation (the drive to act), though they may interact pedagogically.

  **II. Substantive Disagreements**

  | Crux | Exemplarist Formulation | Anti-Hagiographer Formulation | Concrete Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **Epistemic Value of Selection** | Selective amplification is necessary focusing that isolates morally salient features, enabling calibrated analogical pattern-matching. | Selective amplification is epistemic contamination that obscures causal complexity, preventing valid generalization beyond the specific context. | **Case:** Plutarch’s pairing of Alcibiades and Coriolanus.<br>**Exemplarist Prediction:** Readers discern distinct modalities of ambition across democratic vs. oligarchic conditions, yielding transferable insight.<br>**Anti-Hagiographer Prediction:** Readers absorb culturally specific aesthetic valuations of charisma, resulting in motivated reasoning rather than moral knowledge. |
  | **Source of Moral Insight** | Comparing lives yields a distinctive form of moral knowledge unavailable to pure abstraction, revealing the modal range of virtue. | Comparing lives produces only aesthetic appreciation; reliable moral insight requires abstract principle independent of narrative particularity. | **Case:** Modern demystified biographies (e.g., Caro’s LBJ).<br>**Exemplarist Prediction:** Even flawed details reveal structural patterns of power corruption applicable to other political contexts.<br>**Anti-Hagiographer Prediction:** Detailed particularity hinders extraction of universal norms, reinforcing situation-specific bias rather than ethical clarity. |

  **III. Identification of Verbal Disagreement**
  The camps dispute the definition of "moral principle." Exemplarists use "principle" to denote stable patterns extracted from comparative narratives (inductive regularity). Anti-Hagiographers reserve "principle" for abstract rules derived independently of narrative (deductive normativity). This is purely verbal because both agree that stable normative guides are necessary for ethical pedagogy. They disagree only on the derivation method's label. Once "principle" is disaggregated into "abstracted rule" versus "patterned regularity," the substantive disagreement reduces strictly to the comparative reliability of narrative induction versus deductive abstraction, which is already captured in Section II. Both sides accept that agents require guides for action; the conflict lies solely in whether a pattern *counts* as a principle.
