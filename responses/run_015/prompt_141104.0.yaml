answer: |-
  **MEMORANDUM**

  **TO:** Student Council
  **FROM:** Constitution Rewrite Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Student Activities Fee Entrenchment Clause

  **Recommendation**
  The Committee recommends **adopting the proposed clause with two specific conditions**: a fiscal mismanagement exception and a five-year sunset provision.

  We propose the following language for Section [X]:
  > *"Allocation of the Student Activities Fee may be altered only by a two-thirds vote of the Council. Such changes shall not take effect until the beginning of the following academic year. This threshold may be bypassed only if a club is found by majority vote to be in material violation of fiscal bylaws. This section shall expire five years from ratification unless re-authorized by a simple majority referendum of the student body."*

  **Reasoning**

  **1. The Nature of the Precommitment: Entrenchment, Not Self-Binding**
  You asked whether this is a Ulysses contract (binding one's future self) or entrenchment (binding a successor). Given our turnover—annual council elections and complete student body replacement every four years—this is **not** a true Ulysses contract. Council A is not binding Council A's future impaired judgment; Council A is binding Council B, who represents a different constituency.

  Honesty requires we admit this is **entrenchment of present preferences against a future majority.** However, it is justifiable entrenchment. We are not protecting a specific policy preference (e.g., "fund the newspaper") but an *institutional rule* (e.g., "funding decisions require broad consensus"). While the students change, the *institution* of the Student Government persists. This clause binds the institution to a higher standard of deliberation, protecting it from transient factional majorities. It raises the cost of a decision rather than removing the option, which is the honest description of the mechanism.

  **2. Predictable Distortion vs. Policy Disagreement**
  Ulysses-contract reasoning demands that the future preference be predictably *distorted*, not merely different. Does one near-miss (last spring's vote) justify this?
  Yes, but only because the motivation matters. If the vote had failed because the majority preferred Debate Club over the Newspaper, that is a legitimate policy shift. The vote failed because the majority sought to punish speech critical of the administration. That is a **structural distortion**: it uses the budget process to achieve a retaliatory aim outside the scope of the fee's purpose.
  One episode is sufficient evidence when it reveals a vulnerability to *viewpoint discrimination*. We are not predicting that future councils will be irrational; we are predicting that future councils will face the same temptation to use funding as a weapon. The precommitment protects the process from this specific distortion.

  **3. The Mast vs. The Unburned Fleet**
  Ulysses had himself tied to the mast (binding) but did not burn the fleet (destroying the option). The proposed 2/3 vote plus one-year delay is the rope, not the fire. It makes retaliatory defunding politically costly (requiring a supermajority) and temporally difficult (waiting a year), which cools passions.
  However, a rope that is too tight prevents steering. If a club genuinely squanders funds, a one-year delay is unacceptable. This is why our recommendation includes a **fiscal mismanagement exception**. This allows the Council to defund a club that breaks the rules (simple majority, immediate effect) while maintaining the high barrier for defunding a club simply for its content or viewpoint. This preserves the fleet while securing the mast.

  **4. The Escape-Hatch Problem**
  Critics argue that because this clause can eventually be amended (by 2/3 vote), the precommitment is weak. Some theorists suggest "double entrenchment" (making the amendment rule itself unamendable). We reject this.
  The ability to amend this clause with a 2/3 vote is a **feature, not a defect.** It prevents the "dead hand" problem. If the student body genuinely changes its mind about the value of this protection, a broad consensus (2/3) can remove it. Double entrenchment would imply that our current judgment is infallible, which is undemocratic. The 2/3 threshold ensures that only a durable, sustained majority can undo the protection, filtering out temporary passions while respecting future sovereignty.

  **Where Theory Is Silent**
  Constitutional theory tells us *how* to protect values, but not *which* values deserve protection. It cannot tell us if a free high school newspaper is worth the democratic cost of making budget changes harder. That is a political judgment. We have judged that pluralism and free expression are foundational to this government's legitimacy.
  Furthermore, theory cannot solve the turnover problem perfectly. A five-year sunset is a pragmatic compromise: it acknowledges that the students binding this deal will be gone, and gives the future student body the right to re-ratify the deal themselves.

  **Conclusion**
  Adopt the 2/3 threshold and delay to prevent retaliatory defunding. Include the fiscal exception to ensure accountability. Include the sunset to respect the sovereignty of future students. This balances institutional stability with democratic renewal.
