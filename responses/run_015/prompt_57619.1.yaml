answer: |-
  This specification is drafted to bridge the gap between Kripkean metaphysics and developmental biology. It treats the "Origin Essentialism" thesis not as a settled dogma but as a hypothesis subject to biological boundary conditions.

  ### The Specification for an Adequate Theory of Origins

  #### 1. The Ontological Anchor (Resolution Requirement)
  **Requirement:** The theory must explicitly identify the *relatum* of origin. It must state whether the essential origin is: (i) the specific gametic pair, (ii) the zygote as a material substance, (iii) the genomic sequence, or (iv) the initiated developmental process.
  **Motivation:** Ambiguity here allows theories to shift targets when challenged. If the origin is the *zygote*, twinning is fatal. If the origin is the *genome*, cloning is fatal. If the origin is the *process*, the boundaries of the process must be defined.
  **Status:** **Non-negotiable.**
  **Cost:** Metaphysicians often prefer "gametes" for intuitive simplicity. Biologists prefer "process" or "zygote" for mechanistic accuracy. Giving up specificity allows the theory to evade the biological cases listed in Requirement 3.

  #### 2. The Individuation of Origins (Identity Requirement)
  **Requirement:** The theory must supply identity conditions for the chosen anchor that persist through the relevant timeframe. If the anchor is gametes, it must explain how *this* sperm is individuated from the millions of competitors, given that sperm are transient processes budded from a stem-cell line, not persistent particulars like rocks. If the anchor is the oocyte, it must account for the decades-long meiotic arrest.
  **Motivation:** As you noted, an ovulated oocyte is a determinate historical object; a sperm is often not. If "originating from sperm S" is essential, but S is not a determinate object until the moment of fusion (due to ICSI or random competition), the essential property is indeterminate until too late to ground necessity.
  **Status:** **Non-negotiable.**
  **Cost:** High cost to Kripkeans. If gametes are not determinate individuals prior to fusion, origin essentialism grounded in gametes collapses into a description of the zygote's composition rather than its history.

  #### 3. The Branching Constraint (Twinning and Splitting)
  **Requirement:** The theory must explain numerical identity in cases of fission without special pleading.
  *   **Monozygotic Twinning:** If Zygote Z is the origin of Person P, and Z splits into P1 and P2, does Z originate P1, P2, or both? If both, P1 and P2 share an essential origin but are distinct individuals; origin is not sufficient for identity. If Z originates only one, which one, and by what physical fact?
  *   **Embryo Splitting/Cloning:** If an embryo is bisected and one half frozen, does the frozen half retain its "origin" identity during stasis?
  **Motivation:** Biology shows that one origin can yield two organisms (armadillos, twins). Metaphysics demands that one essence yields one individual.
  **Status:** **Non-negotiable** for biologists; **Contested** for metaphysicians (some accept "branching" as a modal failure).
  **Cost:** If the theory admits branching, it surrenders the claim that origin *uniquely* determines identity. If it denies branching, it must posit a "hidden" individuation event prior to splitting that biology cannot detect.

  #### 4. The Composition Constraint (Chimerism and Mito Replacement)
  **Requirement:** The theory must specify whether the *material composition* of the origin is essential or merely the *causal history*.
  *   **Chimerism:** If Embryo A and B fuse to form C, does C have two origins or one?
  *   **Mito Replacement:** If Nuclear DNA is from Parents A+B, but Mitochondria from Donor C, is the origin the nuclear pair or the triad?
  **Motivation:** If origin is essential, and C is a chimera, C violates the "one origin" rule unless the theory allows fused origins. If mito replacement yields a healthy child, is that child essentially linked to the mitochondrial donor?
  **Status:** **Preference of Biologists.** Metaphysicians often ignore cytoplasmic inheritance.
  **Cost:** Ignoring cytoplasmic/mitochondrial contribution treats the organism as a nuclear genome vehicle, which contradicts developmental physiology.

  #### 5. The Modality and Sorites Constraint
  **Requirement:** The theory must declare the modal force (Metaphysical vs. Nomological) and solve the sliding scale. If Person P originates from Sperm S, could P have originated from Sperm S*, which differs from S by one molecule? If yes, where is the cutoff? If no, why not?
  **Motivation:** Kripke argues for metaphysical necessity. Biology deals in nomological continuity. A theory claiming metaphysical necessity must explain why a molecularly indistinguishable counterfactual gamete fails to produce *you*.
  **Status:** **Non-negotiable.**
  **Cost:** If the force is merely nomological, the thesis loses its metaphysical weight (it becomes a law of nature, not a truth about *de re* necessity). If metaphysical, it requires a principled cutoff in a continuous physical space.

  ---

  ### 6. The Incompatibility Result
  **I believe the following three requirements cannot be jointly satisfied.** Any adequate theory must reject one.

  1.  **Strong Origin Essentialism:** An individual's identity is strictly determined by their material origin (gametes/zygote).
  2.  **Biological Continuity:** There is no biological discontinuity or "hidden fact" at the moment of fertilization that fixes numerical identity prior to the primitive streak (approx. 14 days); early development is regulative and can support fission (twinning).
  3.  **Uniqueness of Identity:** One origin cannot yield two numerically distinct individuals (No-Branching).

  **The Argument:**
  If **Strong Origin Essentialism** is true, then the origin fixes the individual. If **Biological Continuity** is true, then a single zygote (the origin) can split into two viable embryos (twinning/cloning). If **Uniqueness** is true, one origin cannot yield two individuals.
  *   If you keep (1) and (2), you must reject (3): You must admit that two distinct people can share the exact same essential origin. This undermines the utility of "origin" as an individuator.
  *   If you keep (1) and (3), you must reject (2): You must claim that twinning is impossible *for persons*, implying that when twinning occurs, one twin is the "real" person and the other is not, or that individuation happened *before* fertilization (which biology denies) or *after* splitting (which makes the zygote not the origin).
  *   If you keep (2) and (3), you must reject (1): You must admit that origin does not fix identity; something post-zygotic (developmental trajectory) does.

  **Result:** Most metaphysicians sacrifice (2), positing a metaphysical fact of identity invisible to biology. Most biologists sacrifice (1), treating identity as emergent. You cannot have a theory that satisfies both camps without contradiction.

  ---

  ### 7. The Live Disagreement
  **Most Eliminative Requirement:** **Requirement 3 (The Branching Constraint).**
  This eliminates the majority of standard Kripkean accounts. Kripke's original formulation does not adequately handle fission. Accounts that try to handle it (e.g., by claiming the zygote is not the person) push the origin back to the "individuation event," but as noted in the Incompatibility Result, biology offers no clean candidate for this event prior to the primitive streak.

  **Where the Live Disagreement Lies:**
  Once we agree on the biology (twinning happens, gametes are fleeting), the disagreement is not about *facts* but about **ontological commitment to invisible facts.**
  *   **Camp A (Metaphysical Realists):** Believes there *is* a fact of the matter about which twin is the "original" zygote-continuant, even if biology cannot detect it.
  *   **Camp B (Biological Naturalists):** Believes that if biology cannot detect a distinction, there is no distinction; therefore, identity is not fixed at fertilization.

  The fight is over whether metaphysics is permitted to override empirical underdetermination.

  ---

  ### Scorecard of Known Accounts
  *   **Kripke (1980):** Fails Requirement 3 (Twinning) and Requirement 2 (Gamete Individuation). Assumes gametes are rigid designators without biological grounding.
  *   **Mackie (2006):** Attempts to handle branching by denying the zygote is the person. Survives Requirement 3 but strains Requirement 1 (shifts origin to later stage).
  *   **Robertson (1994):** Focuses on genetic identity. Fails Requirement 4 (Chimerism/Cloning) as genetics can be identical across distinct individuals.
  *   **Hershenov (2005):** Argues for conception as the start of the organism. Fails Requirement 3 (Twinning) unless he accepts that one organism becomes two, which complicates identity conditions.

  ---

  ### Epistemic Request: Where I Might Be Wrong

  **What would change my mind:**
  I hold **Requirement 2 (Gamete Individuation)** least securely as a *metaphysical* blocker. If a convincing argument could be made that gametes are individuated by their *causal history* (the specific meiotic event in the parent) rather than their material continuity, the indeterminacy of the sperm mass might be resolved without biological detection. If you can show that "Sperm S" is a rigid designator for a specific *path* through possibility space rather than a specific *chunk of matter*, I would demote Requirement 2 from non-negotiable to camp-relative (Metaphysician preference).

  **Where to catch me out:**
  1.  **Parthenogenesis Viability:** I stated "in some vertebrate species." I am relying on data from mice and turkeys. If you argue that mammalian parthenogenesis is strictly non-viable due to imprinting (which is generally true for full term in humans/mice without manipulation), my inclusion of it as a "viable offspring" case might be empirically overstated for *humans*, though valid for the general class of mammals with manipulation.
  2.  **The "Hidden Fact":** I may be underestimating the metaphysician's willingness to posit "haecceities" (thisness) that are brute facts. I treat the lack of a biological marker as a strike against the theory; a hardened metaphysician will simply say biology is incomplete. I expect you to challenge me on whether I am smuggling *verificationism* into *metaphysics*.
  3.  **Cytoplasmic Determinants:** I emphasize the nucleus. In some taxa (insects, amphibians), cytoplasmic determinants are mosaic and fix fate early. In mammals, they are regulative. If my specification leans too heavily on mammalian regulativity, it may not generalize to the "organism" category broadly, though your constraint specifies "early mammalian development." I should ensure I haven't universalized mammalian plasticity to all organisms.
