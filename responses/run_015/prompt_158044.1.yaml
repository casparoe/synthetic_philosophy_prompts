answer: |-
  **Exam Question**

  Welcome to the final. Put away your notes. You have 90 minutes to write one essay response.

  Here is the setup: You are presented with two envelopes, $A$ and $B$. One contains exactly twice the amount of the other. The amounts are powers of two, specifically ranging from $2^1$ to $2^{20}$. The possible pairs are $(2^1, 2^2), (2^2, 2^3), \dots, (2^{19}, 2^{20})$. There are 19 such pairs, and the pair is selected uniformly at random. You choose an envelope at random, open it, and observe the amount $2^k$.

  The standard two-envelope argument suggests you should always switch, claiming the other envelope has expected value $1.25 \times 2^k$. Your task is to dismantle this using the bounded prior provided.

  First, calculate the conditional expectation of the other envelope specifically for the boundary cases where you observe $k=1$ and $k=20$. Show your work regarding why the probabilities shift at these limits.

  Second, determine whether the paradox vanishes in this specific scenario. Does the proper prior eliminate the incentive to switch universally, or is there still a hidden mistake in how we condition on the observed value $2^k$?

  Third, articulate the conceptual difference between a statistical resolution and a decision-theoretic resolution. A statistical resolution fixes the prior to ensure expectations are finite. A decision-theoretic resolution often rejects the conditioning step itself as illegitimate, regardless of the prior. Explain how these distinct approaches diagnose the error in the standard argument.

  Keep your reasoning tight. You do not need to cite specific authors; refer to "the standard argument" or "the conditioning move" where appropriate. Good luck.

  ***

  **Model Answer**

  In this bounded scenario, the standard argument fails because it ignores the probability mass at the boundaries. The standard argument assumes that for any observed $2^k$, the other envelope is equally likely to be $2^{k+1}$ or $2^{k-1}$. This symmetry holds only for intermediate values. At the boundaries, the uniform prior over the 19 pairs forces asymmetry.

  Consider the case where you observe $k=1$ (amount $2^1$). Since the minimum possible value in any envelope is $2^1$, this cannot be the larger envelope of a pair. It must be the smaller envelope of the pair $(2^1, 2^2)$. Therefore, the other envelope contains $2^2$ with probability 1. The conditional expectation is $2^{k+1}$. Here, switching is strictly beneficial.

  Now consider the case where you observe $k=20$ (amount $2^{20}$). Since the maximum possible value is $2^{20}$, this cannot be the smaller envelope. It must be the larger envelope of the pair $(2^{19}, 2^{20})$. Therefore, the other envelope contains $2^{19}$ with probability 1. The conditional expectation is $2^{k-1}$. Here, switching is strictly detrimental.

  For any intermediate $k$ (where $1 < k < 20$), the observed $2^k$ could be the larger element of pair $k-1$ or the smaller element of pair $k$. Since the pairs are chosen uniformly, these two possibilities are equally likely. The expected value of the other envelope is $0.5(2^{k+1}) + 0.5(2^{k-1}) = 1.25 \times 2^k$. While switching looks favorable here, the gains in the intermediate cases are exactly offset by the loss at the upper boundary when averaging over the prior. The paradox vanishes because the expected gain from switching is not positive for all $k$; specifically, the negative expectation at $k=20$ prevents a universal switching strategy from being admissible.

  This highlights the difference between statistical and decision-theoretic resolutions. A statistical resolution, like the one above, fixes the paradox by imposing a proper prior. It shows that once the prior is normalized and bounded, the infinite expectations disappear, and the global expected gain from switching is zero. The error is identified as using an improper prior that hides the boundary costs.

  A decision-theoretic resolution is more foundational. It argues that the conditioning move itself is illegitimate. Even with a proper prior, some decision theorists argue that forming a decision rule based on the observed value $2^k$ is flawed if the rule suggests switching for every possible observation. They contend that a valid decision rule must be admissible across the whole state space, not just conditionally optimal locally. In this view, the error isn't just the prior; it's the assumption that conditional expectation drives rational action in this specific structural context. The statistical fix makes the math work, but the decision-theoretic fix questions whether the math models the rational choice correctly.

  ***

  **Marking Scheme**

  **1. Boundary Analysis: Lower Limit ($k=1$) [4 marks]**
  *   **Must Hit:** Correctly identifies that observing $2^1$ implies the envelope must be the smaller one, making the other envelope $2^2$ with probability 1.
  *   **A vs B:** A grades explicitly state the probability collapses to 1; B grades might vaguely mention "limits" without calculating the specific value.
  *   **Common Mistake:** Assuming 50/50 probability still applies at the minimum value.

  **2. Boundary Analysis: Upper Limit ($k=20$) [4 marks]**
  *   **Must Hit:** Correctly identifies that observing $2^{20}$ implies the envelope must be the larger one, making the other envelope $2^{19}$ with probability 1.
  *   **A vs B:** A grades note the negative expected gain; B grades might identify the value but fail to conclude switching is bad.
  *   **Common Mistake:** Claiming $2^{20}$ could still be the smaller envelope (ignoring the bounded range).

  **3. Paradox Status & Global Expectation [4 marks]**
  *   **Must Hit:** States the paradox vanishes because the universal switching strategy is not profitable; the loss at $k=20$ offsets intermediate gains.
  *   **A vs B:** A grades explain the offsetting mechanism; B grades simply say "it stops" without referencing the global expectation.
  *   **Common Mistake:** Arguing the paradox remains because intermediate expectations are still positive.

  **4. Statistical Resolution Definition [4 marks]**
  *   **Must Hit:** Defines this as fixing the prior (making it proper/bounded) to ensure finite expectations and reveal the zero-sum nature.
  *   **A vs B:** A grades connect this directly to the exam's bounded prior; B grades give a generic definition without linking to the problem.
  *   **Common Mistake:** Confusing this with simply "doing the math right" without mentioning the prior's propriety.

  **5. Decision-Theoretic Resolution Definition [4 marks]**
  *   **Must Hit:** Defines this as rejecting the conditioning step or the admissibility of the switching rule, regardless of the prior's propriety.
  *   **A vs B:** A grades distinguish this from the statistical fix (method vs. principle); B grades treat it as the same as fixing the prior.
  *   **Common Mistake:** Treating both resolutions as identical solutions involving proper priors.
