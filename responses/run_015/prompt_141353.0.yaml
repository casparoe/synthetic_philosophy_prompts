prompt: |-
  I'm a third-year PhD student (nominally evo-devo, though my lab is really a functional morphology lab) and I have to write the framing chapter of my thesis where I say where I stand on the adaptationism stuff. We also have a reading group working through the Gould–Lewontin spandrels paper and the literature that grew out of it, and the annoying thing is that when I write down what I actually believe, it looks like a pile of commitments that don't go together — except I genuinely can't tell which ones are in real conflict. My advisor says I've just reassembled a standard package and stops there; I don't think that's right, but I also can't locate the problem myself. So here's the list, roughly in the order I think of it:

  (1) I hold an etiological, selected-effect view of function: a trait's function is what it was selected to do, and a trait doesn't acquire a function merely from being useful now.
  (2) I think the spandrels critique is right as a methodological demand — an adaptationist hypothesis has to be tested against the alternatives (drift, developmental constraint, phylogenetic inertia, byproduct status), and I mean constraint as a genuine explanation, not as a fancy way of saying we don't know yet.
  (3) I also think that, as a matter of fact, for a randomly chosen trait in a randomly chosen organism, the best explanation of why it's there will cite selection.
  (4) I think reverse engineering and optimality modelling are the right way to find out what a trait is for: write down the design problem, solve for the optimum, compare it to the animal.
  (5) I think spandrels and exaptations are a real and sizable phenomenon, not just a methodological caution — I don't want to end up making the dismissive oh-sure-there-are-a-few move and then never let it change a single hypothesis I actually hold.
  (6) But I also think that once a co-opted trait starts being modified by selection for its new role, it is an adaptation for that role, full stop: how a trait originated doesn't settle its current status.
  (7) I'm a pluralist about levels of selection and about bookkeeping — multi-level selection partitions or inclusive fitness, whichever is less confusing for the case in front of me.

  The case that made me notice something is off is my own system: a clade of burrowing skinks (I call them the sand-swimmers in my notes) with enlarged, fused scale patches on the flank just above the hind limb — flank plaques. They appear on the tree at the same node where the lineage shifts to burrowing through coarse gravel; in the lab they have no measurable effect on burrowing speed, abrasion resistance or water loss (I ran all three, and honestly those null results are the solidest data I have); but in the two most derived species the plaques are reshaped into a shallow gutter that channels sand away from the cloacal region, and ablating them costs those species something like fifteen percent of burrowing efficiency, while the basal species don't care at all if you glue theirs shut. My instinct is to say spandrel at origin, adaptation now, in the derived species only — and I've started using a rule of thumb that a trait counts as a spandrel only if selection has never acted on it for any of its current effects, so that spandrel status is a claim about the whole history rather than about the origin.

  So please audit the seven. Which pairs actually pull against each other and how badly, which only look like they conflict, and for each real tension what the cheapest thing to give up would be and what giving it up costs me elsewhere on the list. Rank the tensions by severity instead of flagging everything as equally bad, and tell me if there's a single revision that would clean up more than one at once. If my rule of thumb is doing something I haven't noticed — especially if it quietly collapses the distinction I'm trying to protect in (5), or quietly contradicts (6) — I'd rather find that out now than during my defence. Please don't just tell me which combination is the orthodox one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year PhD student in evolutionary biology (nominally evo-devo, practically functional morphology).
      *   **Task:** Writing the framing chapter of their thesis regarding adaptationism.
      *   **Problem:** Feels their philosophical commitments are inconsistent, though their advisor says it's just a "standard package." The student doubts the advisor but can't pinpoint the conflict.
      *   **Input:** A list of 7 specific philosophical commitments and a concrete case study (burrowing skinks with flank plaques).
      *   **Request:** Audit the 7 commitments. Identify real tensions vs. apparent ones. Rank tensions by severity. Suggest cheapest fixes and costs. Check the "rule of thumb" about spandrels. Avoid orthodoxy for orthodoxy's sake.

  2.  **Deconstruct the 7 Commitments:**
      *   (1) *Etiological/Selected-Effect Function:* Function = historical selection. Current utility $\neq$ function. (Millikan/Neander style).
      *   (2) *Spandrels as Methodological Demand:* Must test adaptationism against nulls (drift, constraint, byproduct). Constraint is real, not ignorance.
      *   (3) *Adaptationism as Empirical Bet:* Most traits *are* adaptations (statistically).
      *   (4) *Optimality Modeling:* Reverse engineering is the *right way* to find function.
      *   (5) *Spandrels/Exaptations are Real:* Not just cautions; they happen often enough to matter.
      *   (6) *Exaptation $\to$ Adaptation:* Once co-opted and modified by selection, it becomes an adaptation for the new role. (Gould & Vrba's definition).
      *   (7) *Levels of Selection Pluralism:* MLS or Inclusive Fitness, pragmatic choice.

  3.  **Analyze the Case Study (Sand-Swimmers):**
      *   *Trait:* Flank plaques.
      *   *Origin:* Node where burrowing starts.
      *   *Basal Species:* No effect on burrowing/abrasion/water loss. (Null results).
      *   *Derived Species:* Reshaped into gutter. Ablation costs efficiency.
      *   *Student's Instinct:* Spandrel at origin, Adaptation now (derived only).
      *   *Student's Rule of Thumb:* Spandrel = selection *never* acted on it for *any* current effects. (This implies if selection acted later, it stops being a spandrel).

  4.  **Identify Tensions/Conflicts:**

      *   **Tension A: (1) vs. (6) vs. The Case Study.**
          *   (1) says Function = Historical Selection.
          *   (6) says If selected *now* for new role, it's an adaptation for that role.
          *   Case Study: Basal plaques had *no* function (null results). Derived plaques *do*.
          *   Conflict: If (1) is strict etiological, the *basal* trait had no function. The *derived* trait has a function because of *recent* selection. (6) supports this transition.
          *   *Wait, look closer at the Rule of Thumb:* "Spandrel status is a claim about the whole history rather than about the origin."
          *   If a trait starts as a spandrel but becomes an adaptation, is it still a spandrel?
          *   Gould & Vrba (1982): Exaptation = useful but not selected *for* origin. Adaptation = selected *for* current use.
          *   Student's Rule: "Spandrel only if selection has *never* acted on it."
          *   *Conflict:* This rule effectively erases (5). If every spandrel that becomes useful gets reclassified as an adaptation (per (6) and the Rule), then (5) "Spandrels are a real and sizable phenomenon" becomes empirically empty. You'll never find one, because as soon as you find one that does something, you call it an adaptation.
          *   *Severity:* High. This threatens the core of the thesis framing.

      *   **Tension B: (3) vs. (2) & (5).**
          *   (3) says "Randomly chosen trait... best explanation... will cite selection." (Strong Adaptationism).
          *   (2) & (5) say "Test against alternatives" and "Spandrels are sizable."
          *   If (3) is true, (5) is technically true but practically negligible. If spandrels are "sizable," (3) might be too strong.
          *   *Severity:* Medium. This is the classic "Pragmatic Adaptationism" vs. "Empirical Adaptationism" debate. Usually resolvable by defining "randomly chosen trait" (e.g., molecular vs. morphological).

      *   **Tension C: (4) vs. (2) & The Case Study.**
          *   (4) says Optimality Modeling is the *right way* to find what a trait is for.
          *   (2) says Test against constraints/byproducts.
          *   Case Study: Lab results were *null* for basal species. Optimality modeling might predict they *should* help burrowing.
          *   If you start with (4), you assume there *is* an optimum. If the trait is a byproduct (2), there is no optimum for that trait *per se*.
          *   *Severity:* Medium-High. Relying on (4) as the *primary* method biases you against finding spandrels (violating (2) and (5)).

      *   **Tension D: (1) vs. The Case Study (Basal Species).**
          *   (1) Function = Selected Effect.
          *   Basal Species: Plaques exist. No selected effect found (null results).
          *   Does the basal trait have a function? Under (1), No.
          *   Is it a spandrel? Yes, likely.
          *   This seems consistent, *unless* the student wants to say the basal trait has a function because it's part of a lineage where the derived trait has a function. (Teleological essentialism).
          *   *Severity:* Low, provided the student accepts basal plaques are non-functional.

  5.  **Evaluate the "Rule of Thumb":**
      *   Rule: "Trait counts as a spandrel only if selection has never acted on it for any of its current effects."
      *   Problem: This conflates *origin* with *maintenance*.
      *   Gould & Vrba distinguish *Exaptation* (origin non-adaptive, current use adaptive) from *Adaptation* (origin adaptive, current use adaptive).
      *   Student's Rule: If current use is adaptive, it's an Adaptation. (Collapses Exaptation into Adaptation).
      *   Consequence: (5) "Spandrels are real" becomes unfalsifiable or empty. You will categorize everything currently useful as an adaptation.
      *   Conflict with (6): (6) says "once modified... it is an adaptation." The Rule says "if selected... it is an adaptation."
      *   The Rule actually *supports* (6) but *undermines* (5).
      *   *Crucial Insight:* The student wants to protect (5) (Spandrels matter) but uses a Rule that makes (5) disappear in practice.

  6.  **Synthesize and Rank:**

      *   **Rank 1 (Critical):** The "Rule of Thumb" vs. Commitment (5). The rule makes spandrels invisible. If a trait is currently useful and selected, you call it an adaptation. You will never classify a "sizable phenomenon" of spandrels because you reclassify them as soon as they become useful.
      *   **Rank 2 (High):** Commitment (4) vs. Commitment (2)/(5). Optimality modeling assumes adaptation. If you start there, you bias against finding spandrels/constraints.
      *   **Rank 3 (Medium):** Commitment (3) vs. Commitment (5). "Most traits are adaptations" vs. "Spandrels are sizable." Needs nuance (which traits? which organisms?).
      *   **Rank 4 (Low/Resolvable):** (1) vs. (6). These are actually compatible under the Selected-Effect view (Neander/Millikan). A trait can acquire a new selected effect.

  7.  **Drafting the Advice:**
      *   *Tone:* Peer-to-peer, rigorous, respectful of the biology, philosophical precision without jargon overload.
      *   *Structure:*
          1.  Validate the advisor (mostly) but pinpoint the specific friction.
          2.  Audit the Rule of Thumb (The Smoking Gun).
          3.  Rank the Tensions.
          4.  Propose the "Single Revision."
          5.  Apply to the Skink Case.

      *   *Refining the "Single Revision":* The student needs to decouple *current utility* from *adaptation status* regarding the *origin*. The distinction isn't "Has selection ever touched it?" It's "Was selection responsible for the *initial proliferation* of the trait structure?"
      *   *Fixing (4):* Downgrade optimality modeling from "The Right Way" to "One Tool."
      *   *Fixing (5) vs Rule:* Adopt Gould & Vrba's *Exaptation* distinction explicitly. A trait can be an exaptation (origin byproduct) and *currently* an adaptation (maintenance by selection). The student's (6) says this, but the Rule contradicts it by saying "Spandrel only if *never* selected."
      *   *Wait, check (6) again:* "once a co-opted trait starts being modified... it is an adaptation for that role, full stop."
      *   *Check Rule again:* "spandrel only if selection has never acted on it."
      *   *Conflict:* If I follow (6), the derived skink plaque is an adaptation. If I follow the Rule, it is *not* a spandrel. This is consistent.
      *   *The Problem:* The student wants to say "Spandrel at origin, adaptation now." But the Rule says "If adaptation now, not a spandrel." So the basal trait is the spandrel. The derived trait is the adaptation.
      *   *Where is the conflict?* The conflict is in (5). If every spandrel eventually becomes an adaptation (per (6) and Rule), then "Spandrels are a sizable phenomenon" is hard to sustain unless you count traits that *currently* have no function. But (3) says most traits *do* have a function (selection).
      *   *Real Conflict:* (3) + (6) + Rule $\to$ (5) is empty.
      *   *Solution:* Distinguish *Origin* (Spandrel/Exaptation) from *Maintenance* (Adaptation). Keep the label "Exaptation" for the historical status even if current status is Adaptation. The Rule erases the historical label.

  8.  **Final Polish:**
      *   Make sure to address the "Standard Package" comment. The advisor is right that this is a common mix, but wrong that there aren't tensions. The tension is in the *operationalization*.
      *   Focus on the Skink case. Basal = Spandrel (no function). Derived = Adaptation (function).
      *   The Rule needs to change to allow "Exaptation" to persist as a historical descriptor even if current selection is acting.

      *(Self-Correction during drafting)*: I need to be careful with terminology. Gould & Lewontin (1979) "Spandrels" = byproducts of architecture. Gould & Vrba (1982) "Exaptation" = co-opted for current use. The student mixes these.
      *   Commitment (5) mentions "Spandrels and Exaptations."
      *   Commitment (6) describes Exaptation $\to$ Adaptation.
      *   The Rule defines "Spandrel status."
      *   *Key Insight:* The student is using "Spandrel" to do the work of "Exaptation."
      *   If the basal plaque is a byproduct of burrowing anatomy (constraint), it's a Spandrel.
      *   If the derived plaque is co-opted for sand channeling, it's an Exaptation turned Adaptation.
      *   The Rule says: "Spandrel only if selection never acted." This means the derived plaque is *not* a spandrel. That's fine.
      *   But does the *basal* plaque count as a spandrel in the thesis? Yes.
      *   So where is the tension?
      *   The tension is (3) "Most traits... selection" vs (5) "Spandrels are sizable."
      *   And (4) "Optimality is the right way" vs (2) "Test against constraints."
      *   And the Rule vs (5). If the Rule means "If it's an adaptation *now*, we don't talk about its spandrel past," then (5) is methodologically silenced.

      *Okay, let's lock in the advice:*
      1.  **Rule of Thumb is the killer.** It conflates historical origin with current maintenance. It makes (5) rhetorically impossible.
      2.  **(4) is the methodological bias.** It预设 (presupposes) adaptation, fighting against (2).
      3.  **(3) is the empirical overreach.** It makes (5) statistically unlikely.
      4.  **The Fix:** Adopt the Exaptation/Adaptation distinction formally. Allow a trait to be historically a spandrel/exaptation even if currently maintained by selection. Modify (4) to be a tool, not a definition.

      *Let's write the response.*
answer: |-
  This is a sharp, self-aware list. Your advisor is half-right: this *is* a standard package for a modern functional morphologist. It's the "sensible middle ground" most of us occupy verbally. But your advisor is wrong to imply there are no tensions. The tensions aren't logical contradictions (you aren't saying $A$ and $\neg A$), but they are **operational conflicts**. They pull your methodology in opposite directions, and your "Rule of Thumb" is the knot where they tighten.

  Here is the audit, ranked by severity, followed by the specific revision that untangles most of it.

  ### The Critical Tension: Your Rule of Thumb vs. Commitment (5)
  **Severity: Fatal**

  Your Rule of Thumb: *"A trait counts as a spandrel only if selection has never acted on it for any of its current effects."*
  Commitment (5): *"Spandrels and exaptations are a real and sizable phenomenon... I don't want to... never let it change a single hypothesis."*

  **The Conflict:** Your Rule of Thumb effectively makes Commitment (5) empirically empty.
  If a trait originates as a byproduct (spandrel) but is subsequently co-opted and refined by selection (which you admit happens in your derived skinks), your Rule dictates that it is **no longer a spandrel**. It becomes an adaptation "full stop" (per Commitment 6).
  Consequently, in your thesis, you will never actually identify a "sizable phenomenon" of spandrels. You will identify a few basal traits with *no* function (like your basal skink plaques), but the moment you find a trait that *does* something interesting (the derived gutter), your Rule forces you to classify it as an Adaptation. You erase the historical signal of the spandrel origin the moment utility appears.

  **The Cost:** If you keep the Rule, (5) becomes a rhetorical gesture. You pay lip service to Gould, but your classification system ensures that 99% of your "functional" traits are labeled Adaptations. You lose the ability to discuss the *historical pathway* of the trait, which is the whole point of evo-devo/morphology.

  **The Fix:** Decouple **historical origin** from **current maintenance**.
  Adopt the Gould & Vrba (1982) distinction formally:
  *   **Adaptation:** Originated by selection, maintained by selection.
  *   **Exaptation:** Originated as byproduct/co-option, maintained by selection.
  *   **Spandrel (strict):** Originated as byproduct, *currently* non-functional (or function unknown).

  Under this fix, your derived skink plaque is an **Exaptation** (historically) that has become an **Adaptation** (currently maintained). You don't have to choose one label. You can say: *"This trait is an adaptation for sand-channeling, but its evolutionary origin was exaptive."* This preserves (5) without contradicting (6).

  ### The Methodological Tension: Commitment (4) vs. Commitment (2)
  **Severity: High**

  Commitment (4): *"Reverse engineering and optimality modelling are the right way to find out what a trait is for."*
  Commitment (2): *"An adaptationist hypothesis has to be tested against the alternatives (drift, constraint...)"*

  **The Conflict:** Optimality modeling is an adaptationist tool. It starts with the assumption that there *is* a design problem and an optimum. If you start with (4) as your primary engine, you have already biased the test against (2). You are building a model to find the adaptation, not to test *if* it is an adaptation.
  In your skink case: You ran lab tests and found **null results** for the basal species. If you had started with strict optimality modeling on the basal species, you might have forced a "design problem" (e.g., "maybe it reduces drag?") that doesn't exist, wasting time trying to optimize a trait that is just a structural byproduct of elongation.

  **The Cost:** If (4) remains your "right way," you will systematically under-detect spandrels and constraints, violating (2) and (5).

  **The Fix:** Downgrade (4). Optimality modeling is a tool for **generating** adaptationist hypotheses, not the definitive method for establishing function. The "right way" is comparative phylogenetics + experimental manipulation (which you actually did). The model comes *after* you suspect function, not before.

  ### The Empirical Tension: Commitment (3) vs. Commitment (5)
  **Severity: Medium**

  Commitment (3): *"For a randomly chosen trait... the best explanation... will cite selection."*
  Commitment (5): *"Spandrels... are a sizable phenomenon."*

  **The Conflict:** This is the classic "Pragmatic Adaptationism" vs. "Pluralism" fight. If (3) is true, (5) is technically possible but practically negligible. If spandrels are "sizable," then (3) is too strong for a morphologist.
  However, this is often resolvable by defining "trait." If "trait" means "molecular allele," (3) is defensible. If "trait" means "complex morphological structure," (5) is more likely.

  **The Cost:** If you hold (3) too tightly, you look dogmatic in your framing chapter. If you weaken it too much, you undermine the justification for doing functional morphology at all.

  **The Fix:** Qualify (3). Restrict it to *derived* modifications of existing traits, or specify "traits that show evidence of complex design." Acknowledge that among *all* phenotypic features (including byproducts), the proportion of adaptations is lower.

  ### The Low-Stakes Tension: Commitment (1) vs. Commitment (6)
  **Severity: Low**

  Commitment (1): *Etiological view (Function = Historical Selection).*
  Commitment (6): *Once co-opted and modified, it is an adaptation.*

  **The Conflict:** None, really. This is the standard Millikan/Neander "Selected Effect" view. A trait can acquire a new selected effect. The basal plaque had no function (no selected effect). The derived plaque has a new selected effect (sand channeling).
  **The Nuance:** Your Rule of Thumb was trying to bridge these, but clumsily. As long as you accept that a trait can *gain* a function via new selection pressures, (1) and (6) are harmonious.

  ---

  ### The Single Revision That Cleans Up the Mess

  You need to revise your **Rule of Thumb** and your definition of **Function**.

  **Current Rule:** "A trait counts as a spandrel only if selection has never acted on it for any of its current effects."
  **Proposed Revision:** "A trait's **adaptive status** refers to its current maintenance by selection; its **historical status** (adaptation vs. exaptation vs. spandrel) refers to the cause of its initial proliferation."

  **Why this works:**
  1.  **Saves (5):** You can now claim "Exaptation is sizable" without denying that those traits are currently adaptations. You can write a chapter section on "The Prevalence of Exaptive Origins in Sand-Swimmers."
  2.  **Saves (6):** You can still say the derived plaque is an adaptation *now*.
  3.  **Saves your Skink Data:**
      *   **Basal Plaque:** Historical Status = Spandrel (byproduct of elongation). Current Status = Non-functional (Null results).
      *   **Derived Plaque:** Historical Status = Exaptation (co-opted from basal plaque). Current Status = Adaptation (maintained by selection for sand channeling).
  4.  **Resolves (4):** You don't need optimality modeling to determine the *Historical Status*. You need phylogeny and constraint analysis. You use optimality modeling only to characterize the *Current Status*.

  ### How to Write This in Your Framing Chapter

  Don't hide the tension. Explicitly state that you are rejecting the "Adaptationist's Trichotomy" (where a trait is either Adaptation, Spandrel, or Drift, mutually exclusively) in favor of a **Two-Axis Framework**:
  1.  **Origin Axis:** Selection vs. Constraint/Byproduct.
  2.  **Maintenance Axis:** Selection vs. Drift/Inertia.

  This allows you to hold all 7 commitments without contradiction:
  *   (1) & (6) define the Maintenance Axis.
  *   (2) & (5) define the Origin Axis.
  *   (3) becomes a bet about the correlation between the two axes (they usually align, but not always).
  *   (4) becomes a tool for the Maintenance Axis only.
  *   (7) sits orthogonally to both.

  **Final Warning:** Your advisor called it a "standard package" because most people gloss over the Origin/Maintenance distinction. By making it explicit, you aren't just cleaning up your philosophy; you are making a methodological contribution. Your skink data (null results in basal, strong results in derived) is the perfect empirical wedge to prove why the distinction matters. If you use your Rule of Thumb, you lose that story. If you use the Two-Axis Framework, your null results become evidence of a spandrel origin, not just "failed experiments."
