answer: |-
  This is a classic Science and Technology Studies (STS) debate, and honestly, it's impressive you were hashing this out over beers. You're touching on the foundational texts of the field.

  Here is the breakdown: your friend is misinterpreting Winner, and your "silent vs. loud" taxonomy is actually a very sharp intuition that maps onto several established theories, even if the specific jargon isn't standard.

  ### 1. Winner vs. Hard Technological Determinism

  Your friend's critique—that Winner is just a "hard determinist wearing a hat"—is a common misunderstanding, but structurally, **they are opposites.**

  **Hard Technological Determinism** argues that technology develops according to its own internal logic and *inevitably* drives social change. Society is the dependent variable; technology is the independent variable.
  *   *The Logic:* "The steam engine *made* us industrialize." "Social media *made* us polarized."
  *   *The Vibe:* Inevitability. Humans are passengers; tech is the driver.

  **Langdon Winner's Argument** ("Do Artifacts Have Politics?") is actually a form of **Social Constructionism**. He argues that human choices, power dynamics, and political ideologies shape technology *during the design phase*.
  *   *The Logic:* "Segregationists *built* the low bridges to prevent buses from passing."
  *   *The Vibe:* Agency. Humans are the drivers; tech is the frozen embodiment of their intent.

  **The Moses Bridge Distinction**
  In the famous example (low overpasses on parkways to prevent buses from reaching Jones Beach), a hard determinist would say: *"The engineering requirements of the parkway system inadvertently excluded the poor."*

  Winner says: *"Robert Moses intentionally designed the overpasses to exclude the poor."*

  Winner isn't saying technology *causes* politics. He is saying politics is **embedded** in technology. The difference is crucial:
  *   **Determinism:** Tech $\rightarrow$ Society (Unavoidable consequence)
  *   **Winner:** Politics $\rightarrow$ Tech $\rightarrow$ Reinforced Politics (Intentional design choice)

  **The Nuance (Where your friend might be confused)**
  Winner does have a second argument in that same essay about "Inherently Political Technologies." He suggests some technologies (like nuclear power) *require* hierarchical, authoritarian management to function safely. This flirts with determinism because it suggests certain tech *demands* specific social structures. However, even here, Winner argues this is a structural compatibility, not an inevitable law of physics.

  **Verdict:** You win this round. Winner is arguing that artifacts are *not* neutral, but he attributes that to human agency and design choices, not to an autonomous technological force.

  ### 2. Silent vs. Loud Mandates

  Your "beer-fueled taxonomy" is actually really solid. While "silent/loud mandates" isn't standard canonical jargon, you have independently rediscovered a distinction that several major theorists make.

  Here is how your concepts map onto existing theory:

  #### Silent Mandates
  *   **Your Definition:** Rules embedded so deep you don't notice them (e.g., code, architecture, design).
  *   **Academic Cousin 1: "Scripts" (Madeleine Akrich).** Akrich argues that designers write a "script" into the technology that anticipates how the user will behave. If the script is good, you follow it without thinking. A speed bump is a silent mandate to slow down; a door handle that looks like a pull but is a push is a failed silent mandate.
  *   **Academic Cousin 2: "Code is Law" (Lawrence Lessig).** Lessig argues that in cyberspace, code regulates behavior more effectively than law. You can't steal digital goods if the code doesn't allow the copy function. That is a silent mandate.
  *   **Academic Cousin 3: "Nudges" (Thaler & Sunstein).** Choice architecture that alters behavior without forbidding options. Putting fruit at eye level in a cafeteria is a silent mandate to eat healthier.
  *   **Academic Cousin 4: "Affordances" (Gibson/Norman).** A chair affords sitting. It doesn't scream "SIT HERE," but its shape mandates it.

  #### Loud Mandates
  *   **Your Definition:** Obvious restrictions (e.g., laws, signs, warnings).
  *   **Academic Cousin:** **Discursive Regulation.** This is traditional power. "No Trespassing" signs, Terms of Service agreements, legal statutes. These require conscious cognitive processing to obey.

  #### Which Theory Fits Best?
  Your distinction fits best with **Michel Foucault's** shift from **Sovereign Power** to **Disciplinary Power**.
  *   **Loud Mandates = Sovereign Power:** The King says "Don't do this or I'll cut off your head." It's visible, violent, and explicit.
  *   **Silent Mandates = Disciplinary Power:** The Panopticon prison. You behave because the *architecture* suggests you might be watched. The control is embedded in the structure, not the command.

  It also fits **Alexander Galloway's** concept of **Protocol**. Protocol is the invisible control mechanism that governs how networks flow. You don't see the protocol, but if you violate it, you are disconnected.

  ### 3. Why Your Distinction Matters

  You should definitely keep using "Silent vs. Loud Mandates." It's a useful heuristic because **Silent Mandates are harder to democratize.**

  *   If there is a **Loud Mandate** (a law saying "Poor people can't use this beach"), you can protest the law. You can identify the oppressor.
  *   If there is a **Silent Mandate** (a bridge that is physically too low for a bus), who do you protest? The bridge? The engineer? It creates what Winner calls "political amnesia." The politics disappear into the concrete, making the status quo feel like "just the way things are."

  ### Summary for Your Friend
  1.  **On Winner:** Tell your friend Winner is arguing for *human agency* in design, not technological inevitability. Determinism says tech changes us; Winner says we change tech to change us.
  2.  **On Your Taxonomy:** Tell them they've reinvented the wheel on **Material Semiotics** and **Foucaultian Discipline**. "Silent Mandates" are essentially **Scripts** or **Affordances**, while "Loud Mandates" are **Discursive Regulations**.
  3.  **The Kicker:** Silent mandates are more dangerous precisely because they look neutral. That's the whole point of Winner's essay.

  You held the stronger theoretical ground. Next round of beers is on them.
