  (c) **Predator Culling:** Step 1 N/A. Step 2 fails; culling is an immediate fix for a multi-year cycle, risking population crashes if stopped. It ignores the grass-height dependency fundamental to nesting success. Step 3 flags ecological risk externalized to future generations if predator roles shift. Step 5 fails; extinction is irreversible. **Recommendation: Reject.** While locally popular and politically easier than grazing restrictions, the temporal mismatch and irreversibility trigger automatic stop points. This protects the long-term public good over short-term numerical gains, refusing to trade ecological stability for immediate political approval.

  What the Procedure Cannot Do

  The procedure cannot resolve empirical uncertainty regarding specific regeneration rates or carrying capacities; if data is missing, Step 2 forces a handoff rather than a decision. It misfires when "groups" are not distinct (e.g., herders who also value birds), blurring Step 3's cost-benefit analysis. It cannot adjudicate the fundamental weight of a bird's life versus a herder's livelihood; Step 4 flags this but requires external ethical guidance. Additionally, it assumes stable climate conditions; rapid environmental change invalidates the temporal alignment checks in Step 2. Finally, it cannot process emergency interventions where reversibility (Step 5) is impossible but action is required to prevent immediate collapse. In these gaps, the officer must revert to discretionary authority or political directive, as the framework is designed for routine governance, not crisis management or metaphysical arbitration. It also cannot quantify the "value" of intergenerational benefits, leaving the trade-off between present grass and future nests undefined beyond the structural checks. The tool identifies conflict but does not resolve it.

  Settled vs. Contested

  Settled claims include the technical definitions of subtractability and excludability, and the economic principle that unmanaged subtractable resources risk depletion. It is broadly accepted that temporal mismatches between harvest and regeneration lead to collapse. Contested premises involve the moral weight of intergenerational equity: how much present consumption should be sacrificed for future non-human benefits. The moral status of the birds is also disputed; some view them as stakeholders deserving rights, others as assets for human utility. Similarly, the fairness of burdening specific herders for general public goods lacks consensus. The procedure treats these as value judgments (Steps 3-4) rather than facts, acknowledging that resource economics cannot solve normative disagreements about who counts and how much.
