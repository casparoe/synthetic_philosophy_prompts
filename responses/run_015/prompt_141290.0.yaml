  **OmniHome Robotics | Planning Core v4.2 | Release Notes**

  **Highlights:** Salience Budget Optimization; Contextual Priority Tuning; Reduced Litigation Risk.

  This update focuses on stability within the domestic context engine. As reminder, the planner operates under a strict 40-fact salience cap per action to prevent latency. Everything not in the top 40 is assumed unchanged. We understand this causes friction in high-clutter environments. Please review the following patches derived from field tickets.

  **Changelog**

  1.  **Fixed an issue where the robot moved a grandfather clock to the curb.** During trash collection, the planner allocated budget to 'clock' and 'curb' but excluded 'rug' and 'floor friction' from the relevance set. The robot reasoned the clock was trash without considering the rug underneath would tear. Patch expands the contextual footprint of heavy furniture by 15%, forcing the planner to consume budget on supporting surfaces before lifting.

  2.  **Resolved a bug where the robot attempted to brew coffee without verifying water supply.** The 'water level' fact was deprioritized below 'coffee grounds' in the default salience profile. The robot assumed the state of the reservoir was unchanged because checking it exceeded the budget. We've promoted hydration-related preconditions to mandatory status, bypassing the cap for liquid utilities.

  3.  **Corrected an error where the robot froze a birthday cake immediately after retrieval.** The 'celebration' context was dropped to stay within budget, leaving only 'perishable' and 'storage' active. The robot fetched the cake, reasoned it was dairy, and filed it in the freezer before guests arrived. We've added a temporal flag for event-specific goods to keep them out of the cold.

  4.  **Implemented a hard-coded exception for closed doors.** Previously, the planner might ignore 'door state' if 'room temperature' exceeded the 40-fact limit. Now, doors are always checked. We acknowledge this just shifts the budget overflow to window states, but windows are less litigious than doors.

  5.  **Updated the companion app to allow manual tagging of 'Do Not Move' items.** If an object exceeds your monthly salience allowance, the robot will assume it is stationary. Please ensure critical items are tagged before initiating cleaning cycles. If the robot ignores an object, it is likely because your budget is exhausted.

  **Known Issues**

  *   **Pet Neglect:** The robot may ignore pets if multiple children are present. Children consume significant salience budget due to unpredictability. Pets are currently classified as static obstacles in high-traffic modes.
  *   **Budget Reset:** Salience budget resets on the 1st of each month. Plan heavy tasks accordingly. We do not offer rollover minutes.
  *   **Plastic Plants:** We are still investigating why the robot keeps trying to water the plastic plants. The visual classifier marks them as 'thirsty,' but the 'material' fact is often dropped to save budget. Please remove plastic foliage or upgrade to the Premium Context Package.
