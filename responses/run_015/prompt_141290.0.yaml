prompt: |-
  hey — I need a parody for a newsletter I put together, and I want it to make an actual AI researcher or philosopher of mind groan rather than just smile. Write me the release notes, 500-600 words, for version 4.2 of the planning system in a general-purpose household robot, in the deadpan voice of a slightly burnt-out release engineer at the company that makes it. Header, a short Highlights blurb, then numbered changelog entries, then a Known Issues section.

  The conceit to build it around: since nobody can tell the system what's relevant, the company now sells relevance as a metered resource. Every household gets a monthly salience budget — the planner may treat at most 40 facts as possibly relevant to any single action, everything else is assumed unchanged and ignored — and users can buy more or set priorities in an app. Every changelog entry should be a fix that came out of a real failure caused by that budget: the robot that fetched the birthday cake and filed it in the freezer because it only considered facts about cakes, the one that carried the grandfather clock to the curb because it reasoned about the clock and not about what the clock was standing on, and so on. Invent your own, keep them ordinary and domestic, but get the structure right — I want the qualification problem, the ramification problem and the plain relevance problem to show up as three distinguishable kinds of bug with three distinguishable kinds of patch, without any character ever using those words. Also include one entry whose fix is a hard-coded rule an engineer half-admits is just the same problem pushed somewhere else, and one entry that is really just an instruction to the customer.

  The Known Issues section is where the honest part should leak out. Write it in American English, and don't explain the philosophy anywhere — no footnotes, no winking, let the entries carry it.
