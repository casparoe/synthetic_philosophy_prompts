answer: |-
  This is a dense ethical knot, but you are absolutely right to sense that there are distinct philosophical categories getting tangled up here. Your cousin is relying on a view called **methodological individualism** (only individuals act, so collectives can't be blamed), while you are sensing something like **collective continuity** (institutions and families persist over time).

  Both of you are partially right, but you are talking past each other because you are mixing up three different philosophical concepts: **Corporate Identity**, **Intergenerational Obligation**, and **The Nature of Apology**.

  Here is a breakdown of the coherent philosophical views that apply to your situation, separating the "vibes" from the arguments.

  ### 1. Institutional Identity: Is the City the Same Entity?
  **The Question:** If an institution swaps all its members and updates its charter, is it still the same thing that can owe an apology?

  **The Philosophical View:** *Corporate Personhood and Diachronic Identity.*
  In political philosophy, there is a strong distinction between an **aggregate** (a random crowd of people) and a **corporation** (an entity with a decision-making structure that persists over time).
  *   **The Argument for Continuity:** Philosophers like Peter French argue that organizations have "Internal Decision Structures." If the City today holds the assets, land, and legal authority of the 1920 Council, it is the same moral agent. The "Ship of Theseus" applies: if you replace every plank of a ship, is it the same ship? If the *structure and function* remain, most legal and moral philosophers say **yes**.
  *   **The Implication:** The **City** absolutely can owe an apology. The institution survived, benefited from the act, and continues to exist. The fact that the specific councilors are dead does not absolve the *office*.

  **Verdict:** Your cousin is wrong about the City. The City is likely the same moral agent. But this applies to the *government*, not necessarily your *family*.

  ### 2. Collective Responsibility: Does the "No" Vote Matter?
  **The Question:** Can a collective be held responsible if the harmful act was forced through by a few people over the objections of others?

  **The Philosophical View:** *Complicity vs. Direct Agency.*
  This is where your cousin's point about the split vote gets traction.
  *   **The Argument for Dissent:** If your great-grandfather voted "no," he formally registered opposition. In a strict liability sense, he did not author the harm.
  *   **The Counter-Argument (Complicity):** Philosophers like Christopher Kutz argue that by remaining on the council and lending the body legitimacy, even dissenting members are *complicit*. They participated in the system that produced the harm. However, complicity is a weaker moral charge than direct agency.
  *   **The Family Angle:** This is crucial. Even if the *Council* is collectively responsible, does that responsibility transfer to the *families* of the dissenters? If the factory profits enriched your family regardless of how your great-grandfather voted, the **outcome** (unjust enrichment) is the same, even if the **intent** was different.

  **Verdict:** The lack of unanimity weakens the claim of *moral blame* against your specific ancestor, but it does not necessarily erase the *unjust enrichment* your family received.

  ### 3. Inheritance: Money vs. Blame
  **The Question:** Am I mixing up legal inheritance with actual moral blame?

  **The Philosophical View:** *Unjust Enrichment vs. Inherited Guilt.*
  This is the most important distinction for your sanity check.
  *   **Inherited Guilt (Blame):** Most moral philosophers agree that **moral blame does not inherit.** You cannot be "guilty" of a sin you did not commit. Apologies are speech acts that require personal agency ("I am sorry for *what I did*"). If you apologize for your great-grandfather, you are engaging in a philosophical fiction. You can express *regret*, but a formal apology implies personal fault.
  *   **Unjust Enrichment (Obligation):** However, **obligations attached to property often do inherit.** If your family wealth is directly traceable to a wrongful taking (the displacement), you hold "tainted assets." You aren't being asked to pay because you are *bad*; you are being asked to pay because you hold *stolen value*.
  *   **The Coherent View:** You can coherently argue: *"I am not morally to blame for 1920, and I cannot sincerely apologize for an act I didn't commit. However, I acknowledge that my family's current position benefits from that injustice, and I have a restorative obligation to help repair the harm."*

  **Verdict:** You are right that there is a tie, but it is a **financial/restorative tie**, not a **moral/guilt tie**.

  ### 4. The Specific Demand: Families vs. The City
  **The Weird Part:** The prompt says the *City* wants *families* to sign an apology.

  **The Philosophical Problem:** This conflates the **Public** with the **Private**.
  *   If the Council acted in an official capacity, the liability belongs to the **Office** (The City), not the **Officeholders** (Private Citizens).
  *   By asking *families* to pay and apologize, the City is attempting to pierce the corporate veil of the government. Philosophically, this is shaky. It treats the government as a mere proxy for the individuals, rather than an entity in its own right.
  *   **Why they might do it:** Often, cities do this because the "City" treasury is taxpayer money (which includes the descendants of the displaced). They want the specific beneficiaries to pay, not the general public.

  ### Summary: A Coherent Position
  You can hold a position that isn't just "vibes" by splitting the difference:

  1.  **On the City:** The City is the same entity as the 1920 Council (Institutional Continuity). The City owes the primary apology and the primary reparations.
  2.  **On the Family Wealth:** You do not inherit *guilt* (your cousin is right here), but you may inherit *obligations* tied to unjust enrichment. If the money is directly traceable to the displacement, there is a moral argument for restitution.
  3.  **On the Apology:** You cannot sincerely apologize for someone else's action. A "family apology" is symbolically useful but philosophically incoherent. You can offer a "statement of acknowledgment and repair" instead.
  4.  **On the Vote:** The fact that your ancestor voted "no" clears you of *malice*, but not necessarily of *benefit*. If the factory profited your family anyway, the obligation to repair remains, even if the moral stain is lighter.

  **The Sanity Check:**
  Your cousin is defending **Individualism** (I am only responsible for what I do). You are defending **Communitarianism** (We are responsible for the history we inhabit).
  *   **He is right** that you are not *guilty*.
  *   **You are right** that you are not *innocent of the consequences*.

  The coherent middle ground is: **Accept responsibility for the *assets*, reject responsibility for the *sin*.** You can pay into the reparations fund as a matter of justice (cleaning up the mess you inherited), without signing an apology that admits personal fault (which would be a lie).

  *Disclaimer: This is an ethical analysis, not legal advice. Laws regarding reparations and liability vary wildly by jurisdiction.*
