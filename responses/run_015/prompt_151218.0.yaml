  hey, need a sanity check on a family argument thats gotten weirdly philosophical. my great-grandfather was on a town council in 1920 that passed a law pushing out a neighborhood so a factory could expand; the factory profits are partly why my family still has money. now the city—which absorbed that old council—wants families like ours to sign a formal apology and pay into reparations. my cousin says thats absurd: the council members are dead, the city goverment is a different legal entity now, and records show half the council voted against it but were overruled, so there's no "we" that did anything, just dead individuals with mixed intentions. I feel like inheriting the money and the family name creates some real tie, but I can't tell if I'm mixing up legal inheritence with actual moral blame. my question is: if an institution keeps existing but swaps out all its members and even its charter, is it still the kind of thing that can owe an apology? and does it matter that the original "decision" wasn't unanimous—like, can a collective be held responsible if the harmful act was really forced through by a few people? I'm not asking for legal advice, just whether there's a coherent philosophical view here that isn't just vibes. specificaly, is there a difference between saying "the old council is gone" and "the city is the same city"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A family argument about historical injustice. Great-grandfather was on a town council (1920) that passed a law displacing a neighborhood for factory expansion. Family wealth is partly derived from this. The current city wants descendants to sign an apology and pay reparations.
