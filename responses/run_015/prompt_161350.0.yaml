answer: |-
  This is a precise and demanding request. You are asking for a homomorphism between two domains that share a topology (feedback, regulation, boundaries) but differ in their ontology (mechanisms vs. meanings). I will treat your vocabulary not as a metaphor for the philosophy, but as a target formalism into which we attempt to map the philosophical claims.

  Where the mapping fails, I will not smooth it over. Where your bias introduces new constraints, I will identify the added terms.

  ### Part I: Translation of the Extended Mind Thesis (1998)

  Here is the Clark & Chalmers argument restated in systems physiology and control theory.

  #### 1. The Parity Move
  **Philosophical Claim:** If an external process plays the same functional role in guiding action as an internal process, it should be classified as cognitive. The skull is not a privileged boundary.
  **Control-Theoretic Translation:** If an external subsystem $S_{ext}$ closes a feedback loop with the agent $A$ such that the transfer function $H_{A+S_{ext}}$ is indistinguishable (with respect to the controlled variables of behavior) from a system where $S_{ext}$ is internalized, then $S_{ext}$ ought to be included in the state-space vector of $A$.
  *   **Carries Over:** The reliance on functional isomorphism maps cleanly to system equivalence. If the input-output behavior and internal stability margins are identical, the physical locus of the components is irrelevant to the model.
  *   **Altered:** "Classified the same way" shifts from an ontological claim ("this *is* memory") to a modeling heuristic ("this *should be modeled* as a state variable"). In control theory, boundaries are pragmatic choices to minimize prediction error, not metaphysical truths.
  *   **No Expression:** The normative force ("ought to be classified"). Control theory describes; it does not prescribe category membership. It can say "model them together," but not "they are the same kind of thing."

  #### 2. Otto and Inga (The Museum)
  **Philosophical Claim:** Otto (notebook) and Inga (biological memory) are cognitively equivalent regarding the museum address, provided the notebook is: (a) reliably available, (b) easily accessible, (c) automatically endorsed, (d) previously endorsed.
  **Control-Theoretic Translation:** Otto's notebook functions as an **external register** in the agent's observer loop.
  *   (a) *Reliably available* $\rightarrow$ The channel bandwidth is sufficient; latency is within the stability margin of the action cycle.
  *   (b) *Easily accessible* $\rightarrow$ Low input impedance; low transaction cost to read the state.
  *   (c) *Automatically endorsed* $\rightarrow$ The observer gain on this input is high; no error-detection routine (residual check) runs on the data before it updates the internal state estimate. It is treated as a trusted sensor.
  *   (d) *Previously endorsed* $\rightarrow$ System identification has converged; the parameter representing this resource in the agent's internal model is stable over time.
  *   **Carries Over:** The conditions map well to constraints on an observer design. A state estimate derived from a sensor must be reliable, low-latency, and trusted (high gain) to be used for feedback.
  *   **Altered:** "Endorsement" implies a doxastic attitude (belief). In control theory, this is simply "gain scheduling." You are not "believing" the sensor; you are weighting its signal higher than noise.
  *   **No Expression:** The distinction between *storage* (memory) and *computation* (retrieval). In a state-space model, a register is a register. The philosophical worry about whether looking up a note is "remembering" dissolves into whether the delay violates the sampling theorem of the agent's behavior.

  #### 3. The Coupling-Constitution Objection
  **Philosophical Claim:** Causal coupling (interaction) is not constitution (being part of). A thermostat is coupled to a furnace but is not part of the furnace.
  **Control-Theoretic Translation:** The existence of a feedback loop between Plant $P$ and Controller $C$ does not necessitate that $C$ be included in the state vector of $P$.
  *   **Carries Over:** This is the standard **Boundary Problem** in modeling. We can model the thermostat and furnace as one coupled system (eigenvalues of the whole) or as two interacting systems (cascade/feedback connection). Both are mathematically valid; the choice depends on the timescales of interest.
  *   **Altered:** The objection assumes there is a *fact of the matter* about where the furnace ends. In control theory, there is no fact of the matter, only useful abstractions. The EMT reply translates to: "For the timescales of cognitive behavior, the eigenvalues of the agent and the notebook are sufficiently mixed that separating them introduces unnecessary order into the model."
  *   **No Expression:** The intuition that the thermostat is "mere machinery" while the mind is "constitutive." Control theory has no category for "mere machinery" vs. "constitutive part." There are only states that matter for the prediction horizon and states that can be lumped into disturbances.

  #### 4. The Ontological Target
  **Philosophical Claim:** EMT is a thesis about the *vehicles* of cognition (the physical realizers), not just the contents. It expands the boundaries of the knowing subject.
  **Control-Theoretic Translation:** EMT is a claim about the **realization of the controller**. It asserts that the algorithm governing the agent's output is implemented on a substrate that spans the skin boundary.
  *   **Carries Over:** "Vehicles" maps to "physical realization of the control law." "Boundaries of the subject" maps to "boundary of the control system."
  *   **Altered:** "Knowing subject" implies a semantic agent. "Control system" implies a regulatory agent. The translation holds only if we equate "knowing" with "regulating behavior to minimize error."
  *   **No Expression:** The distinction between *cognition* and *regulation*. Control theory treats glucose homeostasis and navigation planning as instances of the same mathematical structure (error minimization). Philosophy treats them as distinct categories (vegetative vs. rational).

  ---

  ### Part II: Evaluation of Your Bias (The Structural Criterion)

  You propose a structural criterion for extension:
  1.  Loop closure on a timescale comparable to the action cycle.
  2.  Reciprocal coupling.
  3.  Resource state not regulated by a slower external controller.

  **Verdict:** This is **not** a faithful translation of Clark & Chalmers. It is a **new substantive claim** dressed as a translation.

  **The Smuggled Assumption:** You have smuggled in the **Fast Manifold Assumption**.
  Clark & Chalmers explicitly allow for slow processes (writing in a notebook is slow compared to neural firing). Their criterion is *functional reliability*, not *dynamic speed*. Your criterion demands that the external resource operate on the "fast manifold" of the agent's immediate control cycle.
  *   **Why this matters:** Clark & Chalmers want to say the notebook *is* memory. Your criterion says the notebook is only part of the mind if it reacts as fast as the hand reaching for it. If the notebook sits idle for days, your criterion excludes it (timescale mismatch), whereas EMT includes it (dispositional belief).
  *   **The Reciprocity Constraint:** You require reciprocal coupling. EMT requires it implicitly (Otto writes in the book), but your formulation makes it a hard structural constraint.
  *   **The External Controller Constraint:** You require that the resource not be slaved to a slower controller. This is a sophisticated systems insight (preventing infinite regress or hidden authority), but it is not present in the 1998 text. They worry about *trust*, not *hierarchical regulation*.

  Your criterion is arguably *better* systems engineering than EMT is philosophy, but it is not what they argued. You have replaced their *functional parity* with *dynamic integration*.

  ---

  ### Part III: Analysis of Test Cases

  Let us apply **your** structural criterion to the cases, then compare with the **philosophical** literature.

  #### Case A: The Sailor and the Tide Table
  *   **Structural Analysis:**
      *   Fast loop? Yes (consultation is quick relative to departure decision).
      *   Reciprocal? **No.** She reads; she does not write. The table state is not updated by her actions.
      *   Externally Regulated? **Yes.** The Harbourmaster sets the values.
  *   **Verdict (Your Criterion):** Fails. Not part of the cognitive machinery.
  *   **Verdict (Philosophy):** EMT likely agrees, but for different reasons. Otto *updates* his notebook; the Sailor does not update the table. For EMT, the resource must be part of the *loop of belief revision*, not just belief retrieval.
  *   **Alignment:** High. Both exclude the table.

  #### Case B: The Insulin Pump
  *   **Structural Analysis:**
      *   Fast loop? Yes (continuous sensing/delivery).
      *   Reciprocal? Yes (glucose affects sensor, pump affects glucose).
      *   Externally Regulated? No (autonomous closed loop).
  *   **Verdict (Your Criterion):** **Passes.** The device is part of the agent's regulatory machinery.
  *   **Verdict (Philosophy):** **Fails.** Clark & Chalmers would say this is *not* part of the *mind*. It is part of the *body* or the *physiological system*, but it does not carry semantic content (beliefs, desires). It regulates a setpoint, it does not mediate knowledge.
  *   **The Absurdity:** You find it absurd to call the pump part of her *mind*.
  *   **Diagnosis:** This reveals that **your vocabulary lacks the resources to distinguish cognition from homeostasis.**
      *   In control theory, the insulin loop and the navigation loop are isomorphic. Both are error-minimizing feedback systems.
      *   In philosophy, "Mind" is reserved for systems dealing with *representations of the world*, not just *variables of the body*.
      *   **Conclusion:** The absurdity in Case B shows that the Extended Mind Thesis was **never a claim about structure in the first place.** It was a claim about *semantics*. It argues that external tools can bear *meaning* (represent the museum address). Your criterion identifies where the *control* is extended, but not where the *meaning* is extended.

  **Implication for the Translation:**
  If you accept your structural criterion, you must accept that the insulin pump is part of the "cognitive" system, unless you add a new constraint that distinguishes *semantic variables* from *physiological variables*. Control theory has no such distinction. A state variable is a state variable. To make the distinction, you must import a philosophical assumption (e.g., "Cognition requires an internal model of the *external* world, not just the internal milieu").

  ---

  ### Part IV: The Residue Report

  These are the elements of the philosophical dispute that have no expression in your vocabulary, or require added assumptions to translate.

  #### 1. The First-Personal Character (Phenomenology)
  *   **Residue:** The feeling of remembering vs. the feeling of reading. Otto feels the address is "in his head" (in a sense); the Sailor knows the table is "out there."
  *   **Control Theory Status:** **Genuine Blind Spot.** State-space models are third-person descriptions. They contain no variable for "what it is like" to be the observer.
  *   **Judgment:** This marks a limit of the vocabulary. You can model the *access* latency, but not the *experience* of access. If "mind" implies "conscious experience," control theory cannot translate the thesis at all.

  #### 2. Normative Responsibility (Belief Attribution)
  *   **Residue:** If Otto's notebook has the wrong address, we blame Otto. If the tide table is wrong, we blame the Harbourmaster. We hold agents responsible for their extended states.
  *   **Control Theory Status:** **Indeterminacy in Original Claim.** Control systems are not responsible; they are stable or unstable.
  *   **Judgment:** The philosophers are smuggling in a social/legal category ("agency") under the guise of a metaphysical one ("mind"). Your vocabulary correctly identifies this as outside the system dynamics. To translate this, you must add an assumption: *"The agent is the locus of accountability for the error signals generated by the loop."* This is an addition.

  #### 3. Semantics vs. Regulation (The Case B Problem)
  *   **Residue:** The difference between regulating blood glucose and retrieving a museum address. One is truth-apt (can be false), the other is efficacy-apt (can fail).
  *   **Control Theory Status:** **Genuine Blind Spot.** In your vocabulary, a setpoint is a setpoint. Whether it represents "90 mg/dL" or "Metropolitan Museum" is irrelevant to the stability analysis.
  *   **Judgment:** This is the critical failure point of the translation. The EMT is about *cognition* (dealing with truth/reference). Your vocabulary is about *regulation* (dealing with error/deviation).
  *   **Required Addition:** To distinguish Case B from Otto, you must add a structural constraint: *"The controlled variable must represent a state of the environment, not a state of the plant."* This is not control theory; this is semantics.

  #### 4. The "Glitch" Intuition
  *   **Residue:** If Otto's notebook is swapped while he sleeps, he is cognitively impaired. If my kidney is swapped, I am physiologically impaired. We treat the losses differently.
  *   **Control Theory Status:** **No Expression.** Loss of a state variable is loss of observability. It doesn't matter if it was a kidney or a notebook.
  *   **Judgment:** This suggests the philosophical claim is less determinate than it looks. They want the notebook to be "mind" but not "body." Your vocabulary correctly collapses this distinction: both are subsystems. The resistance you feel in Case B is the resistance of a physiologist seeing a category error.

  ### Summary Judgment

  You asked whether the disputes are empty or undecidable.
  Through your vocabulary, they appear **category errors**.

  1.  **Parity:** Valid as a modeling heuristic (include the tool in the state vector if it improves prediction). Empty as an ontological claim (the tool does not become "flesh").
  2.  **Otto:** Valid as an observer design (trust the external sensor).
  3.  **Coupling:** The objection is valid in engineering (don't lump distinct time-scales), but the EMT reply is valid in modeling (if the loop is tight, lump them).
  4.  **Ontology:** The thesis fails to translate because "Mind" is not a control-theoretic category. "Controller" is.

  **Your Bias:** Your structural criterion is a rigorous *engineering* correction to the *philosophical* thesis. It solves the "Coupling" objection by demanding dynamic integration. However, it fails to capture the "Mind" part of "Extended Mind" because it cannot distinguish the insulin pump from the notebook.

  **Final Recommendation:** If you wish to continue reading philosophy of mind with this vocabulary, you must treat "Mind" as "High-Level Controller with Semantic Internal Models." Without the "Semantic" constraint, your vocabulary will correctly classify the insulin pump as extended mind, which you rightly reject. The residue is not a blind spot in your theory; it is a sign that the philosophers are talking about *meaning*, and you are talking about *mechanism*. They are not the same thing, though they run on the same hardware.
