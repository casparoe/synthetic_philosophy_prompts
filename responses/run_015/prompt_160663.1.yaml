  1.  **$N=4$:** $\Delta = 3/3 = 1$. Evidential benefit = $1. Cost = $100. EDT **Defects**. The term driving this is the linear scaling of $\Delta$ with $N$; small populations provide insufficient evidential leverage.
  2.  **Threshold Good:** Suppose benefits unlock only if contributions $\ge 500$. The evidential bonus becomes the difference in *probability* of hitting the threshold. Near the threshold, this probability shift is often larger than the linear expectation shift, making the evidential bonus **bigger**, though calculation requires Binomial CDFs.
  3.  **Knows Own Disposition:** If I know my type introspectively, my action provides no news about $\theta$. $\Delta = 0$. The evidential reason **vanishes**, and EDT defects.

  **Objection & Reply:**
  *   **Objection:** "You are managing the news. Your contribution doesn't *make* them contribute; you're just comforting yourself with a correlation you can't exploit." (Screening-off).
  *   **Reply:** EDT maximizes expected utility conditional on acts, not causal impact. If the correlation is real (common cause), conditioning on cooperation yields higher expected utility, regardless of causal leverage.
  *   **Judgment:** The case survives as a valid demonstration of EDT's formal commitments, though it highlights why many find EDT counterintuitive in common-cause scenarios.

