  **Scenario**

  One thousand freelance graphic designers join a new, anonymous cooperative platform to share high-cost stock assets. Each designer decides privately whether to contribute a proprietary pack (costing $100 in lost exclusive licensing) to the shared pool. Every contribution added to the pool grants all members access to that specific pack, valued at $1 per member per pack. Contributions are submitted via encrypted upload to a blind drop; no names are attached, no future interaction is possible, and no one observes who contributed what. The designers share a similar professional culture but are not algorithmic twins, and the total pool size is the only public information released after the deadline.

  **Walkthrough**

  **Structure:** Gains-from-Trade (Linear). Each contribution costs the contributor $c=100$. Each contribution provides benefit $b=1$ to every *other* agent.
  **Agents:** $N=1000$.
  **Prior:** Uncertainty about the population cooperation rate $\theta$ is modeled as $\text{Beta}(1,1)$ (Uniform). Effective sample size $S = \alpha + \beta = 2$.
  **Expectations:**
  If I Cooperate ($C$), I update the prior to $\text{Beta}(2,1)$. Expected cooperation rate of others $E[\theta|C] = 2/3$.
  Expected other cooperators $E[K|C] = (N-1) \times 2/3 = 999 \times 0.666 = 666$.
  If I Defect ($D$), I update the prior to $\text{Beta}(1,2)$. Expected cooperation rate of others $E[\theta|D] = 1/3$.
  Expected other cooperators $E[K|D] = (N-1) \times 1/3 = 999 \times 0.333 = 333$.
  **Delta:** $\Delta = E[K|C] - E[K|D] = 333$.

  **Verdicts:**
  *   **CDT:** My action does not causally influence others. Expected Benefit = $b \times E[K] = 1 \times 500$ (prior mean) regardless of action. Net = $-c = -100$. **Defect.**
  *   **FDT:** Others are not running my decision procedure (no logical dependence), only correlated via $\theta$. My decision does not fix theirs. Net = $-100$. **Defect.**
  *   **EDT:** My action is evidence of $\theta$.
      $E[U|C] = -100 + 1 \times 666 = +566$.
      $E[U|D] = 0 + 1 \times 333 = +333$.
      $566 > 333$. **Cooperate.**

  **Critical Population Size ($N^*$):**
  EDT cooperates when $b \Delta > c \Rightarrow 1 \times \frac{N-1}{S+1} > 100$.
  $\frac{N-1}{3} > 100 \Rightarrow N-1 > 300 \Rightarrow N > 301$.
  **$N^* = 302$.**
  The world must be "large" in **population size** relative to the **prior certainty** ($S$). The evidential bonus scales with $N$ ($\approx N/S$), while cost is fixed.

