answer: |-
  Searle argues only the author possesses 'original intentionality'; characters and props are merely puppets with borrowed meaning. Dennett counters that if a prop behaves *as if* it intends, treating it as an agent is valid craft, not error.

  Mapping this: The **Author** fits Searle's 'original mind' cleanly. **Characters and Props** align with Dennett's 'intentional stance': if the narrative voice grants a teapot agency, it functions as an agent within the story's logic. However, we must distort Searle's 'intrinsic' to mean 'authorially sanctioned', as novels simulate minds without biology. There is **no counterpart** for Searle's 'qualia'; we only see behaviour on the page, never internal feeling. Dennett's 'two-bitser' maps perfectly to **unreliable narration**: if the text says the wall hates you, the wall hates you within the system, regardless of physical truth.

  **Residue Report:** The leftover material suggests the philosophical distinction collapses in narrative. Fiction *is* derived intentionality masquerading as original. When you write a sentient door, you aren't making a category error; you're employing personification as ontological fact within the diegesis. Craft vocabulary lacks a term for 'functional agency independent of authorial puppetry', but that's because such independence is an illusion readers willingly accept. The debate dissolves: in fiction, all intentionality is derived, yet functionally original. Your objects can hold intention because the narrative contract allows the reader to adopt the intentional stance towards anything on the page. The friction isn't metaphysical; it's tonal. If the voice commits to the object's mind, the intention becomes real for the reader. The philosophers argue about brains; you argue about belief.
