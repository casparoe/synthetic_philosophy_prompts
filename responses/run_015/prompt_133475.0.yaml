answer: |-
  **Joint Statement on the Epistemic Status of the Church–Turing Thesis**

  **1. Agreed Claims**

  1.  **The Distinction Claim:** There is a substantive distinction between the *Mathematical Thesis* (that all formally defined equivalents of effective calculability coincide) and the *Physical Thesis* (that no physical system can compute beyond these limits).
  2.  **The Convergence Claim:** The equivalence of Turing machines, general recursive functions, and the lambda calculus is not accidental; it marks a stable structural feature of our current mathematical landscape.
  3.  **The Empirical Claim:** To date, no physically realised process has demonstrably computed a function outside the Turing-computable class under controlled conditions.
  4.  **The Reliability Claim:** Any candidate process for computation must exhibit a reliable, repeatable mapping from inputs to outputs that does not depend on ad hoc intervention.
  5.  **The Finitude Claim:** All currently accepted formalisms rely on finite steps, finite symbols, and finite local operations at each stage of derivation.

  **2. Disagreements Table**

  | Disagreement | Camp A (Constitutivists) | Camp B (Physicalists) | Type |
  | :--- | :--- | :--- | :--- |
  | **Modal Status** | The Mathematical Thesis is a necessary truth derived from conceptual analysis of 'effective procedure'. | The Physical Thesis is a contingent truth dependent on the laws of nature. | Metaphysical |
  | **Refutation** | No experiment can refute the Mathematical Thesis; it can only show a device is not computing via an effective procedure. | A working hypercomputer would refute the Physical Thesis and force a revision of the concept of computation. | Epistemic |
  | **Source of Norms** | The constraints on computation come from the requirements of rational agency and surveyability. | The constraints on computation come from the causal structure of the physical world. | Conceptual |
  | **Hypercomputation** | Hypercomputation is conceptually incoherent as an 'effective method', even if physically possible. | Hypercomputation is physically possible if the laws of physics permit it, regardless of current concepts. | Ontological |

  **3. Cruxes and Case Predictions**

  **Crux 1: The Status of Oracles**
  *Question:* Does reliable input-output behaviour suffice to attribute computation, or must the process be internally surveyable?
  *Case (i) The Halting Box:* A sealed device correctly decides the halting problem for ten million cases. It cannot be opened without destruction.
  *   **Camp A Prediction:** This does not refute the Church–Turing Thesis. The Thesis concerns *effective procedures* accessible to human reason. A black box oracle is not an effective procedure. The Box refutes nothing; it merely exhibits a physical correlation we cannot exploit as a method.
  *   **Camp B Prediction:** This refutes the Physical Thesis. If the world contains a process that reliably outputs non-Turing-computable functions, the limit is physical, not conceptual. We must update our theory of computation to match the physical capacity.

  **Crux 2: The Surveyability Clause**
  *Question:* Must a computational process be explainable to count as computation, or is correlation sufficient?
  *Case (ii) The Two Boxes:* It is discovered the Halting Box's outputs correlate with a physical quantity coincidentally linked to halting status in the tested range, not via computation.
  *   **Camp A Prediction:** This confirms the Constitutivist view. Without a systematic mechanism linking input to output via rules, there is no computation, only correlation. 'Effective procedure' requires surveyability of the steps.
  *   **Camp B Prediction:** This changes the lesson. If the correlation breaks outside the tested range, it was never a computer. However, if a mechanism existed but was unknowable, Camp B would still count it as computation. Camp A insists explainability is constitutive; Camp B insists it is merely evidential.

  **Crux 3: Infinitary Rules**
  *Question:* Does independent motivation validate a formalism that violates finite step-wise operation?
  *Case (iii) The Lambda-Star Formalisms:* A new formalism allows one infinitary limit step (reading if a cell stabilised over infinite history). It is independently motivated and decides halting.
  *   **Camp A Prediction:** This formalism does not belong in the convergence argument. 'Effective procedure' conceptually excludes infinitary steps because they cannot be executed by a finite agent. The motivation is irrelevant to the concept of *effectivity*.
  *   **Camp B Prediction:** If the physical world operates on Lambda-Star rules, the Constitutivist concept is too narrow. We should favour the physical reality over the pre-theoretic concept. The convergence of previous formalisms was an artefact of ignoring physical possibilities.

  **4. Closing Assessment**

  The dispute is partially verbal but contains a non-verbal core. The verbal element concerns the label 'Church–Turing Thesis'. Camp A reserves this for the conceptual claim about effective procedures; Camp B applies it to the physical claim about computability in nature. This terminological clash can be resolved by adopting the Distinction Claim (Agreed Claim 1) and speaking strictly of the Mathematical versus the Physical Thesis.

  The non-verbal core concerns the relationship between conceptual norms and physical laws. Camp A holds that our concept of computation is normative for physics: if physics suggests hypercomputation, we have misunderstood the physics or the device is not computing. Camp B holds that physics is normative for concepts: if physics allows hypercomputation, our concept of computation was incomplete.

  Settlement is possible in principle but difficult in practice. It requires a completed physics that explicitly either forbids hypercomputation by law (favouring Camp A) or permits it via accessible mechanisms (favouring Camp B). Until then, Camp A will treat hypercomputation as a category error regarding 'methods', while Camp B will treat it as an empirical discovery regarding 'processes'. Both agree that the convergence of standard formalisms is remarkable, but they disagree on whether it mirrors the structure of the mind, the structure of the world, or both. We recommend future discourse specify which thesis is under discussion to avoid talking past one another.
