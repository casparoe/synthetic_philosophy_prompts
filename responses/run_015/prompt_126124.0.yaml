answer: |-
  - Setup recap (about 100 words): 
  Voss argues Keynes's 1930 essay is normative, positing "idle cognition" as an absolute need essential for the good life. She claims productivity culture undermines this moral infrastructure. While leveraging Keynes's Bloomsbury aestheticism to decouple leisure from labor, she acknowledges tension with his investment-focused macroeconomics. Her project reconstructs Keynes to defend unstructured time against modern economic imperatives, suggesting leisure isn't earned but inherent. She contends that absolute needs include not only subsistence but also unstructured cognitive time, and that modern productivity culture actively destroys the conditions for the good life Keynes envisioned.

  - The eight questions with follow-ups (about 400 words): 
  1. You argue Keynes's 1930 essay is normative, not merely predictive. If he was just forecasting productivity gains, where does the moral obligation to prioritize leisure enter? *Follow-up: If you insist it's normative, doesn't that require ignoring his explicit language about solving the economic problem to focus on moral philosophy instead of economics?*

  2. How does idle cognition differ fundamentally from rest or recreation? Is it about cognitive output or a specific state of being? *Follow-up: If it's not restorative for labor, why treat it as a need rather than a luxury good accessible only to elites with security and capital?*

  3. Does categorizing leisure as an absolute need collapse Keynes's distinction between absolute and relative needs? *Follow-up: If leisure becomes absolute, doesn't every shortage of free time feel like a subsistence crisis rather than a mere preference mismatch for society as a whole?*

  4. You argue productivity culture destroys the good life Keynes envisioned. Is efficiency itself the enemy of idle cognition? *Follow-up: Can we have Keynesian abundance without the productivity culture you critique, or must we abandon growth targets entirely to protect cognition from market forces?*

  5. What does your view say about people who genuinely prefer high-earning, long-hour lives? Are they failing morally? *Follow-up: Do you view their preference as adaptive corruption by capitalism rather than an authentic choice worthy of respect in a free society truly?*

  6. You admit Bloomsbury aestheticism clashes with Keynes's investment framework. Can aesthetics really drive macro policy? *Follow-up: If not, isn't this just philosophy without policy leverage, leaving the investment framework intact and unchallenged by your moral claims fundamentally?*

  7. How do we institutionalize leisure as moral infrastructure without paternalism? *Follow-up: Does this mandate reduced hours regardless of individual consent, effectively forcing people to be free against their will for their own good?*

  8. How do we measure sufficient idle cognition at a societal level? *Follow-up: Who decides when cognition is truly unstructured versus merely dormant or distracted by technology in a digital age consistently?*

  - The curveball (about 100 words): 
  Keynes and the Bloomsbury Group were elites who treated leisure as a birthright, not a policy goal. They didn't need to argue for idle cognition; they lived it. Does your reconstruction inadvertently require an aristocratic structure where some people work so others can think? If leisure is moral infrastructure, who builds it? If it's the workers, aren't they denied the very good life you advocate for them? You rely on Bloomsbury values, but can those values universalize without the privilege that birthed them?

  - Delivery notes (about 50 words): 
  Push hard on the normative claim early; don't let her hide behind textual interpretation. Let her expand on Bloomsbury aestheticism, but press the policy tension. Keep tone respectful but skeptical of elitism. When she discusses preference, probe whether she respects agency or diagnoses false consciousness.
