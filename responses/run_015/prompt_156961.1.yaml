      *   Did I address the villain objection? Yes.

  8.  *(Self-Correction during drafting)*: Make sure not to get *too* bogged down in names (Gaut, Carroll, Kivy) without explaining their concepts. The user wants to understand the *slippage*, not just get a bibliography. Focus on the logical structure of the arguments. Ensure the distinction between "immoral character" and "immoral work" is clear.

