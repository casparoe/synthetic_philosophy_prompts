  But do it through a weird case: take a partial-agent system where personal boundaries are genuinely blurry—say a cluster of alters in dissociative identity disorder sharing welfare, or a temporary group-mind formed for a high-stakes cooperative task, where harm and benefit flow across nodes but theres no clean line between one person and many. Apply the seperateness objection here. Does aggregating welfare across these blurred boundaries feel wrong for the same reason the utility monster feels wrong? Or does the blur break the objection, since theres no crisp separate person left to protect?

  Weigh both sides carefully, then defend a verdict: either the objection survives and gets even weirder, or it collapses without neat identity conditions. Say which feature of the case is doing the work—shared consciousness, divided agency, or something else—and what that means for the objection in ordinary, non-blurry cases.
