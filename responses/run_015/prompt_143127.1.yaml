  ## LEAF DESCRIPTIONS & COMMITMENTS

  **LEAF A: *Akhyāti* (Non-Apprehension)**
  *   **School:** Prābhākara Mīmāṃsā (Hedged: Often attributed to Prābhākaras, though they deny "error" exists).
  *   **Awkward Commitment:** There is no such thing as false cognition, only a failure to distinguish two true cognitions.
  *   **(a) Pramāṇa Status:** Two episodes: one perceptual *pramāṇa* (shell), one memorial *pramāṇa* (silver). No single erroneous episode.
  *   **(b) Validity:** Intrinsic (*svataḥ*); both memories and perceptions are valid until distinguished.
  *   **(c) Successful Action:** Action succeeds because the memory of real silver prompts reaching; the shell is truly perceived as *something*.

  **LEAF B: *Asatkhyāti* (Apprehension of the Non-Existent)**
  *   **School:** Madhyamaka Buddhism.
  *   **Awkward Commitment:** All conventional cognition is erroneous; nothing truly exists.
  *   **(a) Pramāṇa Status:** No *pramāṇa*; the episode is fundamentally void.
  *   **(b) Validity:** N/A; validity is ultimately empty.
  *   **(c) Successful Action:** Action is part of the illusion; pragmatic success does not imply ontological reality.

  **LEAF C: *Ātmakhyāti* (Self-Apprehension / Internal Projection)**
  *   **School:** Yogācāra Buddhism.
  *   **Awkward Commitment:** There is no external world; all objects are internal consciousness appearing external.
  *   **(a) Pramāṇa Status:** Valid as internal consciousness, invalid as external perception.
  *   **(b) Validity:** Intrinsic to consciousness; extrinsic regarding external claims.
  *   **(c) Successful Action:** Success is coherence within the mental stream, not contact with externals.

  **LEAF D: *Anirvacanīyakhyāti* (Apprehension of the Indescribable)**
  *   **School:** Advaita Vedānta.
  *   **Awkward Commitment:** The object of error has a unique ontological status (*sadasadvilakṣaṇa*) that defies logic.
  *   **(a) Pramāṇa Status:** Neither *pramāṇa* nor *apramāṇa*; a unique cognitive mode (*vṛtti*).
  *   **(b) Validity:** Subrated (*bādha*) by later knowledge; validity is pragmatic until subration.
  *   **(c) Successful Action:** Action works because the illusion has pragmatic reality (*vyāvahārika satya*) until awakening.

  **LEAF E: *Satkhyāti* (Apprehension of the Real)**
  *   **School:** Viśiṣṭādvaita Vedānta (Rāmānuja).
  *   **Awkward Commitment:** Error is actually a form of knowledge; you really saw the substance, just misqualified it.
  *   **(a) Pramāṇa Status:** Partial *pramāṇa*; the substance is known, the qualification is wrong.
  *   **(b) Validity:** Intrinsic; the cognition reveals real being.
  *   **(c) Successful Action:** Action succeeds because the object (nacre) is real and supports interaction.

  **LEAF F: *Anyathākhyāti* (Misplacement Apprehension)**
  *   **School:** Nyāya-Vaiśeṣika.
  *   **Awkward Commitment:** A real object (silver elsewhere) causes a false cognition about a different object (nacre here).
  *   **(a) Pramāṇa Status:** Defective *pramāṇa*; a single episode produced by a flawed causal chain.
  *   **(b) Validity:** Extrinsic (*parataḥ*); ascertained only by successful action or lack of contradiction.
  *   **(c) Successful Action:** If action succeeds (e.g., grabbing real silver elsewhere), it validates the memory, not the perception. In nacre case, action fails, revealing error.

  **LEAF G: *Viparītakhyāti* (Contrary Apprehension)**
  *   **School:** Bhāṭṭa Mīmāṃsā (Kumārila).
  *   **Awkward Commitment:** Cognition is intrinsically valid but can be contradicted; the content is a false synthesis.
  *   **(a) Pramāṇa Status:** Single episode; a *pramāṇa* operation that yields false content due to defect.
  *   **(b) Validity:** Intrinsic (*svataḥ*); falsity is extrinsic (*parataḥ*) discovered later.
  *   **(c) Successful Action:** Action driven by the real memory component; failure reveals the contradictory judgment.

