  # DIAGNOSTIC TREE: THEORIES OF ERRONEOUS COGNITION (*KHYĀTIVĀDA*)

  **Instructions:** Start at **Q1**. Answer based on your intuition about the case described. Follow the arrow to the next question or to a **Leaf** (final theory). Do not look at the Leaf names until you finish.

  ### Q1. The Nacre/Silver Case (Structure)
  *Case:* You see a piece of nacre (shell) on a beach in bright light and think, "This is silver." You have seen silver before in a shop.
  **Question:** In that moment of error, is your mind grasping **one unified object** ("this-silver") or **two separate items** (the shell in front of you + a memory of silver from the shop) that you fail to distinguish?
  *   **Two items fused:** → **LEAF A** (*Akhyāti*)
  *   **One unified object:** → **Q2**

  ### Q2. The Dream Fire Case (Existence)
  *Case:* You dream of a fire in your kitchen. While dreaming, you feel heat and fear.
  **Question:** Does the fire you saw in the dream exist **anywhere** (past, present, future, or elsewhere), or is it **ontologically null** (pure nothingness)?
  *   **Pure nothingness:** → **LEAF B** (*Asatkhyāti*)
  *   **Exists somewhere/somehow:** → **Q3**

  ### Q3. The VR/Double Moon Case (Locus)
  *Case:* You wear a head-mounted display and reach for a virtual mug. Or, you press your eye and see two moons.
  **Question:** The mug/second moon appears outside you, but is not physically there. Is the object **inside your consciousness/visual system** projecting out, or is it **nowhere** (despite appearing outside)?
  *   **Inside consciousness projecting out:** → **LEAF C** (*Ātmakhyāti*)
  *   **Nowhere / Outside but unreal:** → **Q4**
      *(Note: If you said "Exists somewhere" in Q2 but "Nowhere" here, you hold the object is real but not located where it appears. Proceed to Q4.)*

  ### Q4. The Nacre/Silver Case (Determinacy)
  *Case:* Back to the nacre taken for silver.
  **Question:** Is the "silver" that appears **real** (*sat*), **unreal** (*asat*), or **logically indescribable** (neither real nor unreal)?
  *   **Indescribable (neither):** → **LEAF D** (*Anirvacanīyakhyāti*)
  *   **Real:** → **Q5**
  *   **Unreal:** → (Return to Q2/Q3 logic; if Real but Nowhere, see Leaf C).

  ### Q5. The Conch/Yellow Case (Identity)
  *Case:* A jaundiced subject sees a white conch as yellow.
  **Question:** Is the "yellow" you see a **real property of the conch itself** (the conch substance is appearing as yellow), or is it a **false property** imposed on the conch?
  *   **Real property of the conch:** → **LEAF E** (*Satkhyāti*)
  *   **False property:** → **Q6**

  ### Q6. The Nacre/Silver Case (Location)
  *Case:* You reach for the "silver" on the beach.
  **Question:** Is the silver you see **located right here** (identical with the nacre's place) or **located elsewhere** (e.g., in the shop where you saw silver before)?
  *   **Located right here:** → (If Real, see Leaf E. If Unreal, see Leaf D).
  *   **Located elsewhere:** → **Q7**

  ### Q7. The Nacre/Silver Case (Nature of Falsity)
  *Case:* You realize the error: "This is not silver."
  **Question:** How do you describe the original mistake? Was it that **silver was misplaced here** (it exists, but not here), or that **this object was falsely qualified** (the judgment "This is silver" contradicted reality)?
  *   **Silver misplaced (Defective Causation):** → **LEAF F** (*Anyathākhyāti*)
  *   **Judgment Contradicted (Intrinsic Validity Overturned):** → **LEAF G** (*Viparītakhyāti*)

