  ## MEMO: CASE UTILITY & UNDECIDABLES

  **1. Cases That Did No Discriminating Work:**
  *   **Dust/Smoke/Fire (Inferential Error):** Most *khyātivāda* theories focus on perception (*pratyakṣa*). Inferential error (*anumāna*) is handled differently (defect in *hetu*). This case fails to separate perceptual theories.
  *   **Faulty Thermometer (True Belief, Wrong Reason):** This is *accidental truth*, not error. It tests theories of validity (*prāmāṇya*), not error. It distinguishes Nyāya (extrinsic validity) from Bhāṭṭa (intrinsic validity) but does not separate *khyāti* types.
  *   **Never Encountered Silver:** Useful only for Q1. If you claim error is impossible without prior contact, you lean Nyāya/Prābhākara. If possible (innate ideas?), you lean toward Idealism. Most classical schools agree: no prior contact, no error.

  **2. Undecidable Pairs (Metaphysical vs. Verbal):**
  *   **Anyathākhyāti (Nyāya) vs. Viparītakhyāti (Bhāṭṭa):**
      *   *Can cases separate them?* **No.** Both agree: Silver is real (elsewhere), Nacre is real (here), the synthesis is false.
      *   *Difference:* Metaphysical. Nyāya locates error in the **causal generation** of the cognition (defective sense-object contact). Bhāṭṭa locates error in the **logical status** of the content (contradiction).
      *   *Diagnostic:* Q7 attempts to pry them apart via "Misplacement" vs. "Contradiction," but participants often conflate these. The real divider is the theory of validity (Extrinsic vs. Intrinsic), which is not a perceptual case.
  *   **Bhāṭṭa vs. Nyāya on Validity:**
      *   Requires commitment to *svataḥ-prāmāṇya* (intrinsic validity). Without importing this extra commitment, the theories of error look identical in practice.

  **3. Invented Case Note:**
  *   No additional case was invented because the logical space is exhausted. The distinction between **Anyathā** and **Viparīta** is not one any *case* could expose, as they describe the same phenomenology with different metaphysical vocabularies (Causation vs. Contradiction).

  **4. Glossary:**
  *   *Khyāti*: Cognition, appearance, or apprehension.
  *   *Anyathā*: Elsewhere; otherwise.
  *   *Asat*: Non-existent.
  *   *Ātman*: Self; mind; consciousness.
  *   *Anirvacanīya*: Indescribable; inexplicable.
  *   *Sat*: Real; existent.
  *   *Viparīta*: Contrary; inverted; false.
  *   *Pramāṇa*: Valid means of knowledge.
