      *   **Conflict:** Prof doesn't trust their own verdict. Humean standard of taste requires "ideal critic" qualities (practice, comparison, freedom from prejudice). Prof admits lacking these (prejudiced by semester study, personally invested, cried at the piece). Unsure if it's a painting or a memorial.
      *   **Task:** Write a speech for the award ceremony (Friday, 200 people, Darlene, family, donors, other jurors, reporter).
