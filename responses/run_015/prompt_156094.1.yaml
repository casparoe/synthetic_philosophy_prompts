prompt: |-
  I'm preparing a 90-minute graduate seminar session—about twelve participants, all with background in metaphysics or philosophy of mind—that takes up Parfit's teletransporter but pushes past the standard binary framing of survival versus death, identity versus non-identity. I want a structured classroom activity that makes the group feel, before anyone names the view, that psychological continuity is a multi-dimensional, gradable relation and that ordinary practices of assigning rights and responsibilities implicitly presuppose a sharp identity boundary that collapses once branching is parameterized.

  The niche scenario I want built in is this: rather than a single perfect replica, the scanning device can be calibrated along independent axes—episodic autobiographical memory, procedural and skill-based memory, core moral dispositions, first-person narrative coherence, and affective temperament—each preserved at a selectable fidelity level (say, 30%, 60%, or 95%). Running the scan at different calibrations produces not one successor but a cluster of four to six co-existing candidates, each with a distinct overlap-and-deficit profile relative to the original. Before scanning, the original had made three concrete commitments: a co-authorship obligation on an unfinished paper, a personal debt of a specific sum, and a long-term caregiving vow.

  Please design a runnable game or structured deliberation around this scenario. The deliverable should specify the setting, group size, and division of roles; provide rules and a timeline that fit within 90 minutes, with phases that unfold before the facilitator names the philosophical idea; include small but real stakes—points, a binding group decision with a visible record, or a role-play constraint that makes compromise costly—so participants experience coordination failure rather than merely discussing it; build in a mechanism by which participants initially try to identify the one true successor and are then forced, by the rules of the scenario, to distribute obligations across partial candidates or leave them unfulfilled; include a debrief that maps specific moments in the activity onto parts of Parfit's argument (psychological continuity as what matters, the failure of identity as a deep further fact, the distributability of survival), predicts where groups will get stuck (e.g., inventing arbitrary thresholds, appealing to bodily continuity despite the premise), and explains how to handle that; and conclude with an honest note on which feature of the philosophical view the activity cannot reproduce—likely the first-person phenomenological intuition that I will be the one waking up, or the metaphysical claim that there is literally no fact of the matter rather than merely an epistemic limitation—and how the facilitator must supply it verbally.

  The activity should not ask participants to consult texts, produce bibliographies, cite specific works, or reference obscure theories. It should work entirely from the scenario and the rules you provide.
