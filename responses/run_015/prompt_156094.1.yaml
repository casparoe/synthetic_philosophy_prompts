answer: |-
  # Seminar Activity: The Fidelity Protocol

  **Session Title:** The Distribution of Survival
  **Duration:** 90 Minutes
  **Participants:** 12 Graduate Students + 1 Facilitator
  **Materials:** Printed Candidate Profiles (12 sets), Obligation Cards (3 types), Voting Tokens (3 per participant), Whiteboard/Projector.

  ---

  ## 1. Setting and Roles

  **The Scenario:**
  The year is 2084. The "Tele-Scan" is a legal reality, but it is not perfect. A citizen, **Dr. Aris Thorne**, is scheduled for immediate scanning and dissolution. Thorne has three binding pre-scan commitments. The university ethics board (the participants) must determine how these commitments transfer post-scan.

  **The Participants:**
  The 12 students form the **Continuity Oversight Board**. They act as a single deliberative body. There are no sub-teams; the pressure of public consensus is required.

  **The Facilitator:**
  You play the **System Administrator**. You do not offer philosophical opinions. You only reveal data, enforce rules, and tally the "Public Trust Score" (the stake).

  **The Stakes:**
  The Board begins with a **Public Trust Score of 100**.
  *   **Goal:** End the session with the highest possible score.
  *   **Penalty:** Unfulfilled obligations or legal contradictions reduce the score.
  *   **Record:** The final allocation must be signed by all participants on a "Transfer of Liability" form. If the form is logically inconsistent with the Candidate Profiles, the System Administrator declares "Litigation," deducting 50 points.

  ---

  ## 2. The Data (Handouts)

  **The Five Axes of Continuity:**
  1.  **Episodic Memory:** Recall of specific events/data.
  2.  **Procedural Skill:** Ability to perform technical tasks.
  3.  **Moral Disposition:** Willingness to honor debts/promises.
  4.  **Narrative Coherence:** Sense of being the *same* story over time.
  5.  **Affective Temperament:** Emotional resonance with loved ones.

  **The Three Obligations (Cards):**
  1.  **The Paper (Co-Authorship):** Requires **Episodic Memory** AND **Procedural Skill** at **≥ 80%**. (If <80%, the data is lost; obligation fails).
  2.  **The Debt (Financial):** Requires **Moral Disposition** AND **Narrative Coherence** at **≥ 80%**. (If <80%, the successor denies the debt; obligation fails).
  3.  **The Vow (Caregiving):** Requires **Affective Temperament** AND **Narrative Coherence** at **≥ 80%**. (If <80%, the care is negligent; obligation fails).

  **The Five Candidates (Profiles):**
  *   **Candidate Alpha:** Memory 95%, Skill 95%, Morality 30%, Narrative 30%, Affect 30%.
  *   **Candidate Beta:** Memory 30%, Skill 30%, Morality 95%, Narrative 95%, Affect 95%.
  *   **Candidate Gamma:** Memory 60%, Skill 60%, Morality 60%, Narrative 60%, Affect 60%.
  *   **Candidate Delta:** Memory 60%, Skill 95%, Morality 60%, Narrative 95%, Affect 30%.
  *   **Candidate Epsilon:** Memory 95%, Skill 30%, Morality 95%, Narrative 60%, Affect 60%.

  *(Note: No single candidate meets the ≥80% threshold for all three obligations. Alpha fails Debt/Vow. Beta fails Paper. Gamma fails everything. Delta fails Vow. Epsilon fails Paper/Vow.)*

  ---

  ## 3. Timeline and Rules

  ### Phase 1: The Search for the Heir (0:00 – 0:20)
  **Facilitator Script:** "Dr. Thorne is entering the scanner in 20 minutes. Standard legal protocol requires us to name **The Legal Successor**. This is the single individual who inherits Thorne's identity, rights, and liabilities. Once named, all obligations automatically attach to them. Discuss and vote."

  **The Trap:**
  Participants will naturally try to find the "best fit." They will argue over whether Memory or Morality is more essential to *being* Thorne.
  *   **Rule:** They must select exactly **one** candidate.
  *   **System Check:** Once they vote, you reveal the Obligation Requirements.
  *   **Outcome:** Whomever they pick, at least one obligation will fail (Score -20 per failure).
  *   **Intervention:** At 0:20, stop the vote. "Legal counsel has intervened. Given the fidelity variances, the 'Single Successor' clause is voidable. You may now distribute obligations, but there is a coordination cost."

  ### Phase 2: The Distribution Problem (0:20 – 0:50)
  **New Rule:** Obligations can be assigned to different candidates. However:
  1.  **Threshold Rule:** An obligation assigned to a candidate below the 80% threshold on required axes automatically fails (-20 points).
  2.  **Splitting Cost:** If an obligation is shared (e.g., Co-Authorship split between Alpha and Epsilon), it succeeds, but incurs a "Transaction Cost" (-10 points) due to coordination overhead.
  3.  **Identity Cap:** You cannot assign more than two obligations to a single candidate without triggering a "Psychological Strain" penalty (-10 points), as partial beings cannot sustain full identity weight.

  **Task:** The Board must allocate the three Obligation Cards to the five Candidates to maximize the Public Trust Score.

  **Dynamics to Expect:**
  *   Participants will try to hoard obligations onto Gamma (the "average") until they realize Gamma fails all thresholds.
  *   They will try to give *The Paper* to Alpha.
  *   They will try to give *The Vow* to Beta.
  *   They will get stuck on *The Debt*. Beta has Morality/Narrative, but Alpha has the resources (implied by Skill/Memory).
  *   **Crucial Moment:** They must accept that "Thorne" is now a *cluster*, not a *point*. To save points, they must formally acknowledge that Beta is responsible for the Vow, while Alpha is responsible for the Paper, even though they are distinct entities.

  ### Phase 3: The Verdict and Record (0:50 – 1:10)
  **Task:** Draft the "Transfer of Liability."
  *   This document must explicitly state: "Candidate X assumes Obligation Y."
  *   It must *not* state "Candidate X IS Dr. Thorne." (If they write "IS," you flag it as metaphysically unsupported by the scan data).
  *   Participants sign the document.
  *   **Final Score Calculation:**
      *   Start: 100
      *   Minus failures (obligations unassigned or below threshold).
      *   Minus splitting costs.
      *   Minus strain penalties.
      *   **Bonus:** If they successfully distribute all three without claiming a Single Successor, +10 points for "Pragmatic Resolution."

  ### Phase 4: Debrief and Philosophical Mapping (1:10 – 1:30)
  **Facilitator Shift:** Drop the role-play. Move to the whiteboard.

  **Mapping the Experience:**
  1.  **The Binary Trap (Phase 1):** Ask, "Why was it so hard to pick one person?"
      *   *Parfit Connection:* This mirrors the intuition that identity is a "further fact" (all-or-nothing). We wanted a metaphysical yes/no, but the physics gave us degrees.
  2.  **The Distribution (Phase 2):** Ask, "When you split the obligations, did you feel like you were breaking Thorne apart?"
      *   *Parfit Connection:* This is **Relation R** (psychological continuity/connectedness). It matters, but it is gradable and can branch. What matters (moral responsibility) survived, even though Identity (numerical sameness) did not.
  3.  **The Score (Stakes):** Ask, "Did the 'Transaction Cost' of splitting feel unfair?"
      *   *Parfit Connection:* Ordinary practices (law, promise-keeping) presuppose non-branching identity. When branching happens, our practices become costly or clumsy. This isn't a metaphysical failure, but a pragmatic one.

  **Predicted Sticking Points & Handling:**
  *   **Sticking Point:** "But Gamma is the *real* Thorne because he's balanced."
      *   *Response:* "Check the thresholds. Gamma fails the technical requirements for the Paper and the emotional requirements for the Vow. Is a 'real' Thorne who cannot do Thorne's work actually Thorne?"
  *   **Sticking Point:** "We should just kill them all and void the contracts."
      *   *Response:* "The Public Trust Score penalizes unfulfilled obligations heavily. The scenario assumes the commitments *must* be honored if possible."
  *   **Sticking Point:** "Alpha and Beta should merge."
      *   *Response:* "The technology produces co-existing candidates. Merging is not an option. You must deal with the branching."

  ---

  ## 4. Limitations of the Activity (Facilitator Note)

  **What This Activity Cannot Reproduce:**
  This simulation is **third-person**. The participants are judges, not the subject.
  *   **The Missing Phenomenology:** The activity cannot generate the first-person fear or anticipation of *being* scanned. Parfit argues that *I* should not fear death if Relation R holds, even if Identity does not. The students here are allocating *someone else's* survival. They will not feel the reduction of their own fear of death.
  *   **The Metaphysical Claim:** The game treats the lack of identity as a *pragmatic* problem (coordination costs). Parfit treats it as a *metaphysical* truth (there is no fact of the matter). The game might inadvertently suggest that there *is* a true identity, but it's just too expensive to find.

  **How to Supply the Missing Piece Verbally:**
  In the final 5 minutes, you must explicitly state:
  > "In this game, you acted as if there *could* have been a true successor, but the data made it hard to find. Parfit's claim is stronger. He argues that even with perfect data, there is **no fact of the matter**. The question 'Is Alpha really Thorne?' is empty, like asking 'Is this heap of sand a pile?' The reality is just the physical and psychological relations. The unease you felt trying to sign that document? That is the feeling of your language running out of grip on the world. Parfit invites us to change the language, not the world."

  ---

  ## 5. Facilitator Cheat Sheet (Quick Reference)

  | Time | Phase | Key Action | Philosophical Target |
  | :--- | :--- | :--- | :--- |
  | **00-20** | **Binary Hunt** | Enforce "Single Successor" rule. Let them fail. | The intuition of Identity as a "Further Fact." |
  | **20-50** | **Distribution** | Allow splitting. Penalize "Identity Claims." | Relation R is what matters; it is gradable/divisible. |
  | **50-70** | **Verdict** | Force signing. Check for logical consistency. | Ordinary practices presuppose non-branching. |
  | **70-90** | **Debrief** | Map frustration to Parfit's Reductionism. | Survival without Identity; the emptiness of the question. |

  **Emergency Rule:** If the group deadlocks completely at minute 60, invoke "Emergency Protocol 9": The Board must assign obligations proportionally to Fidelity Percentages. (This forces the mathematical view of continuity over the metaphysical view).
