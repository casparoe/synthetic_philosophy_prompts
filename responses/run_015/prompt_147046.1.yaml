answer: |-
  ### Brainstorming Notes

  *   **Constraint Check:** I must strictly utilise the four provided terms (diegetic labour, expository labour, agency debt, narrative surplus value) to explain the philosophical concepts. I cannot introduce new critical terminology unless it is to highlight a mismatch in the residue report.
  *   **Marx:** Alienation is fundamentally about disconnection.
      *   *From product:* The character does the work, but the result doesn't belong to them narratively.
      *   *From process:* The character is forced by the plot (agency debt).
      *   *From self:* No thematic weight gained (no surplus value).
  *   **Arendt:** She distinguishes types of activity.
      *   *Labour:* Cyclical, biological. In fiction, this is often background noise (expository).
      *   *Work:* Making durable things. This maps well to diegetic labour.
      *   *Action:* Speech/deed among equals. This is the tricky one. It isn't really "labour". It might be the *absence* of agency debt, but it's not a task.
  *   **Automation of Judgement:** This is about decision-making. If a machine decides, the character loses choice. That is the definition of agency debt.
  *   **Plot-level Deskilling:** Fabula (story logic) vs. Syuzhet (presentation). If automation solves the conflict, the *cause* is technical, not character-driven. This reduces tension. It aligns with the loss of narrative surplus value.
  *   **British English:** Ensure spelling (labour, colour, analyse) and idioms are appropriate.
  *   **Honesty:** I need to be clear where the user's framework fails to capture the philosophy, not just force a fit.

  ***

  ### Philosophical Restatement via Narrative Terms

  Here is how the core philosophical concerns regarding work and automation translate when viewed strictly through your four narrative categories.

  **1. Marx on Alienation**
  In your framework, Marx's concept of alienation is not an emotional state but a structural imbalance in how labour is recorded and rewarded within the text.
  *   **Separation from the Product:** When a character performs **diegetic labour**, but the outcome is treated as **expository labour** (mentioned as existing, but never shown as belonging to the character), alienation occurs. The character builds the thing, but the plot claims ownership.
  *   **Separation from the Process:** This is pure **agency debt**. The character is moving through the motions of work, but the choice to perform those tasks is overridden by plot mechanics. They are not acting; they are being acted upon by the narrative necessity.
  *   **Separation from Species-Being (Self):** This manifests as a deficit of **narrative surplus value**. When a human performs a task that defines their humanity, but the text treats it as mechanical, no thematic weight is extracted. The character works, but the story gains no meaning from their effort.

  **2. Arendt on Labour, Work, and Action**
  Arendt's triad requires careful handling, as she distinguishes between biological necessity and creative freedom.
  *   **Labour (Biological Necessity):** In your terms, this is almost entirely **expository labour**. It is the eating, sleeping, and cleaning required to keep the character alive for the plot, but it is rarely shown because it does not move the story forward. It is the invisible maintenance of the vessel.
  *   **Work (Making Durables):** This maps cleanly to **diegetic labour**. It is the crafting of solutions, weapons, or art that changes the state of the story world. It leaves a mark on the plot.
  *   **Action (Political Revelation):** This is where the translation strains. Arendt views 'Action' as speech and deed among equals that reveals *who* someone is. In your vocabulary, this looks like **diegetic labour** performed with zero **agency debt**. However, because your framework is rooted in 'labour' (tasks), it struggles to capture 'Action' which is often about interaction rather than production.

  **3. Automation of Judgement**
  Recent philosophical worry suggests automation no longer just replaces muscles; it replaces decision-making.
  *   In your terms, this is the conversion of **diegetic labour** into **agency debt**. When a machine (or an algorithmic plot device) makes the judgement call, the character is reduced to an observer. The task might still be shown (diegetic), but the choice behind it is removed. Consequently, **narrative surplus value** plummets, because a machine making a choice generates no thematic weight regarding human morality or courage.

  ***

  ### The Residue Report

  Here is an honest assessment of where your vocabulary holds the weight of these philosophies and where it leaks.

  **What Maps Cleanly**
  *   **Marxian Process Alienation & Agency Debt:** This is a perfect fit. The feeling of being a cog in a machine is narratively identical to a character whose choices are overridden by plot mechanics. You have captured the *experience* of alienation without needing the economic theory.
  *   **Automation of Judgement & Narrative Surplus Value:** Your concept of surplus value elegantly solves the philosophical problem of "why does it matter if a human does it?" It matters because only human effort extracts thematic weight. If a machine does it, the surplus is zero.

  **What Requires Distortion**
  *   **Marx's Separation from Others:** Your framework is largely individualistic. It focuses on the character's task and the character's choice. Marx's idea that alienation separates us from *other workers* is hard to render. You could argue it is a lack of collaborative **diegetic labour**, but that feels like a stretch. Your terms measure the relationship between Character and Plot, not Character and Character.
  *   **Arendt's 'Labour' vs. 'Expository Labour':** Arendt sees biological labour as a trap of necessity. You treat expository labour as merely "unshown". To fit Arendt, you would have to distort your term to mean "labour that *cannot* be shown because it is meaningless," whereas you currently define it as "labour not shown" (which could just be for pacing).

  **What Has No Counterpart (The Missing Elements)**
  *   **Arendt's 'Action':** This is the significant gap. 'Action' for Arendt is not about making things (work) or surviving (labour); it is about revealing oneself through speech and deed in a public sphere. Your framework is built on *production* (tasks, jobs, value). It lacks a term for *interaction* that produces no product but changes the political landscape of the story.
      *   *Implication:* This does not necessarily mean your framework is flawed; rather, it suggests your framework is economic and structural, not political. It analyses the *cost* of the story, not the *community* of the story. If you are writing about isolation or craft, your terms are sufficient. If you write about revolution or diplomacy, you may find 'agency debt' too blunt a tool.
  *   **Marx's 'Species-Being':** While close to 'narrative surplus value', species-being is about internal fulfilment. Surplus value is about what is *extracted* by the author/reader. You have captured the reader's gain, but not necessarily the character's internal joy.

  **Verdict:** Your framework is robust for analysing the *mechanics* of meaning in a capitalist or industrial setting. It is less equipped to handle the *relational* aspects of work.

  ***

  ### Evaluation: Plot-Level Deskilling

  Your notion of **'plot-level deskilling'** — where automation collapses the *fabula* (the causal chain of events) into pure *syuzhet* (the arrangement of presentation) — is a potent tool. Here is how it carries the philosophical claims:

  **Where it Helps**
  It provides the structural mechanism for the loss of **narrative surplus value**.
  *   Normally, tension arises from the *fabula*: Character chooses X, which causes Y.
  *   If automation solves the problem, the causality shifts: Machine chooses X, which causes Y.
  *   The character is no longer the cause. They become part of the *syuzhet* (the decoration around the events).
  *   This validates the philosophical worry about automation eating judgement. If the character cannot cause the climax through skill, the **agency debt** becomes total. The plot is happening *to* them, not *because* of them.

  **Where it Muddies the Water**
  It risks conflating *pacing* with *theme*.
  *   A story can have high automation and still maintain tension if the conflict shifts from "can they do the task?" to "should they allow the machine to do the task?".
  *   If you define plot-level deskilling strictly as "loss of tension," you might miss stories where the tension is purely ethical (high **narrative surplus value**) even if the manual labour is automated.
  *   However, if you define it as "the collapse of character causality," then it holds up. It accurately describes a narrative where the **diegetic labour** is present (we see them press the button) but the **agency debt** is so high (the machine decided to press it) that the *fabula* bypasses the human will.

  **Conclusion on the Idea**
  It is a strong concept, provided you anchor it to **agency debt** rather than just boredom. It explains *why* the philosophy matters structurally: automation doesn't just change what characters do; it changes how the story is caused. If the machine causes the resolution, the story is no longer about the human condition, but about the machine's operation. That is the ultimate loss of **narrative surplus value**.
