prompt: |-
  Right, I'm a novelist and I've been mulling over this weird intersection between automation and what work actually means. You're an expert in both the philosphy of labour and narrative craft — please think carefully, do a bit of brainstorming first, and then write everything in British English.

  So here's my frame: in fiction I work with diegetic labour (tasks characters actually perform that move the plot), expository labour (jobs mentioned but never shown), agency debt (when plot mechanics override a character's choice), and narrative surplus value (the extra thematic weight extracted when a human does something a machine could do). I'm fluent in that vocubulary but not in academic philosophy.

  Could you restate the main philosophical positions on work and automation — say, Marx's idea of alienation (not just feeling sad but separation from product, process, and others), Arendt's split between labour, work, and action, and the more recent worry that automation eats judgement not just manual skill — using only my narrative terms above? Be honest: don't smuggle in philosphical assumptions and call them transaltion.

  Then give me the residue report. Which parts map cleanly onto diegetic labour, agency debt, etc.? Which parts have to be distorted to fit? Is there anything in these philosophies — maybe Arendt's 'action' or Marx's 'species-being' — that has no counterpart in how I think about plot and character, and does that mean my framework is missing something, or that those concepts are vaguer than they look?

  Also, I've been toying with this niche idea I call 'plot-level deskilling' — the idea that when automation takes over a character's craft within the story, the narrative itself loses tension because the fabula collapses into pure syuzhet. Does that idea help carry any of the philosophical claims, or does it just muddy the water?

  Thanks — and please don't just list books or ask me to read anything, I want to work with what's already in the prompt.
