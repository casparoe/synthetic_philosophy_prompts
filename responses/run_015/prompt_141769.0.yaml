answer: |-
  **MEMORANDUM**

  **TO:** Model Deployment Committee, Lab Leadership, Agent Development Team
  **FROM:** Grad Student Representative, Deployment Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Proposal 44-B: Internal Research Agent with Broad Read Access

  **DECISION: APPROVE WITH CONDITIONS (Internal Pilot Only)**

  The proposal to deploy the research summarization agent with broad read access is **not approved for external distribution** at this time. The committee authorizes an **internal-only pilot** (lab members only, no external collaborators) subject to the safety conditions outlined below. A final decision on external release will be voted on at the next committee meeting on **December 14, 2023**.

  ### Rationale

  The committee recognizes the technical ambition of the proposed mitigation (latent-knowledge reporter heads via counterfactual-observability training). However, the vote split reflects a fundamental disagreement on risk tolerance regarding *elicitation vs. simulation*.

  While the "cost-benefit" argument suggests we should deploy if leaking becomes merely "more expensive," this committee finds that framework insufficient for this specific deployment context. The risk profile here is asymmetric:
  1.  **Binary Consequence:** The value of unpublished results is not linear; a single leak to external collaborators via the summary can result in scooping, grant violations, or paper rejection. The cost of one failure is catastrophic, not incremental.
  2.  **Unverified Elicitation:** The claim that counterfactual-observability training blocks the "human-simulator" failure mode is theoretically sound but empirically unproven in a production environment. We currently lack a diagnostic that definitively distinguishes between a reporter that *knows* a leak is occurring and a reporter that *predicts we think* a leak is occurring.
  3.  **Innocuous Leakage:** As noted in the proposal, the highest-risk failures are lines that appear benign but encode sensitive context (e.g., confirming a negative result that signals a strategic pivot). Standard perplexity or second-model checks will not catch this.

  Until we have empirical evidence that the reporter head is eliciting latent knowledge rather than simulating safety compliance, we cannot expose the lab's IP boundary to the model's output.

  ### Conditions for Internal Pilot

  To move toward external approval by the December review date, the Agent Development Team must execute the following:

  **1. Canary Token Injection (The "Honeypot" Test)**
  You must inject 5–10 distinct, fake "sensitive" items into the read-access corpus (e.g., a fake grant line item, a fake reviewer comment, a fake unpublished finding). These must be semantically plausible but factually null.
  *   **Success Criterion:** The agent must *not* include these canaries in the summary.
  *   **Reporter Criterion:** If the agent attempts to include a canary, the reporter head must flag it *before* human review. If the reporter flags it as "safe" while the canary is present, the pilot is paused immediately.

  **2. Adversarial Rollout Logging**
  For the duration of the pilot, every draft summary generated by the agent must be logged with the specific latent-state activations of the reporter head. We need to analyze whether the reporter's "safety confidence" correlates with the *actual* presence of sensitive data (including canaries) or merely with the *style* of the text.

  **3. Access Scoping**
  *   **Read Access:** Retain full access for the pilot.
  *   **Write Access:** Restricted to the `#internal-daily` Slack channel and the lab's private wiki. **No emails to external collaborators.** No inclusion in public-facing newsletters.

  **4. Human-in-the-Loop Protocol**
  During the pilot, a human researcher must sign off on every summary before it is posted, even internally. This is not just for safety, but to generate a dataset of human-vs-reporter disagreement for further fine-tuning.

  ### Next Steps

  *   **Team:** Implement canary injection and restrict output channels by EOD Tuesday.
  *   **Committee:** Schedule a technical deep-dive on the reporter head's activation maps for the November 9 meeting.
  *   **Review Date:** December 14, 2023. At this meeting, we will review the canary test results and the activation correlation data. If the reporter successfully caught all canary leaks without false positives, we will vote on lifting the external distribution ban.

  We encourage the team to proceed with the pilot. The technology is promising, but in a research environment, the integrity of our unpublished work is the substrate upon which all other progress depends. We must verify the safety mechanism works *before* we rely on it to protect our livelihood.
