answer: |-
  The stall is neither merely verbal nor purely substantive; it is a **category mismatch regarding the locus of negation**. The analytic camp treats *anātman* as a thesis about **diachronic identity** (persistence over time), while the Buddhist scholastic camp treats it as a thesis about **synchronic independence** (inherent existence in the present). They are arguing past one another because one side is solving the problem of *survival*, while the other is solving the problem of *clinging*.

  ### 1. The Diagnosis: Diachronic Reductionism vs. Synchronic Emptiness

  **The Analytic Position (Parfit/Siderits):**
  Analytic philosophers reading Buddhism through the lens of Locke and Hume ask: "What makes a person at $t_1$ the same as a person at $t_2$?"
  *   **Parfit** interprets *anātman* as **Reductionism**: Persons exist, but only as a series of physical and mental events connected by psychological continuity. There is no "further fact" of a deep self. This is a diachronic claim.
  *   **Siderits** pushes this to **Buddhist Eliminativism**: If momentariness (*kṣaṇikatva*) is true, there is no persisting entity even conventionally, only a causal series of impersonal events. "Person" is a useful fiction, like a chariot, but ultimately unreal.
  *   **The Assumption:** They assume the Buddhist target is the *substrate theory of identity*. If you remove the substrate, you have explained *anātman*.

  **The Buddhist Scholastic Position (Abhidhamma/Madhyamaka):**
  Buddhist philosophers (e.g., Vasubandhu, Candrakīrti, and modern interpreters like Garfield or Harvey) argue the target is not persistence, but *svabhāva* (intrinsic nature).
  *   **Abhidhamma:** Accepts momentary dharmas as real (*dravya-sat*) but denies a person (*pudgala*) as a separate entity from the aggregates. However, the person is conventionally real (*prajñapti-sat*) for the sake of karma and speech.
  *   **Madhyamaka:** Goes further. Even the aggregates lack *svabhāva*. The denial of self is not that "I do not persist," but that "no element of experience exists independently of causes and conditions."
  *   **The Assumption:** They assume the analytic target is *substantialism*. If you deny inherent existence, you have explained *anātman*.

  **The Mismatch:**
  The analytic side asks, "Is there a continuous owner?" The Buddhist side answers, "There is no independent owner."
  *   Analytic philosophers worry that without diachronic identity, moral responsibility collapses (the "Repugnance" objection).
  *   Buddhist scholars reply that moral responsibility relies on causal continuity (*karma*), not metaphysical identity. A flame passing from one candle to another carries heat without being the "same" flame.

  The stall persists because Parfitians think they have vindicated Buddhism by proving identity is what matters, not further facts, while Madhyamikas think Parfitians are still reifying the *skandhas* (treating the bundles as having intrinsic nature).

  ### 2. The Substantive Core: Moral Agency and "Selfing"

  The disagreement is substantive regarding **moral agency**, but not in the way usually framed.
  *   **Analytic Worry:** If there is no self, who is punished? Who practices meditation? Siderits answers: "The causal series is punished." Traditionalists find this cold and potentially nihilistic (*ucchedavāda*).
  *   **Buddhist Worry:** If you posit a self (even a psychological continuer), you provide an object for *upādāna* (clinging). The analytic focus on "what persists" inadvertently reinforces the cognitive habit of looking for an entity.

  The substantive disagreement is whether **agency requires a bearer**.
  *   Analytic philosophy generally assumes agency requires a subject of experience (even if that subject is a "four-dimensional worm").
  *   Buddhist philosophy argues agency is a *process* (*kriyā*) without an agent (*kāraka*), as famously argued in the *Kathāvatthu* and by Nāgārjuna in the *Mūlamadhyamakakārikā* (Chapter 8).

  The stall hides here: Analytic philosophers try to *locate* the agent (in the body, the brain, the series), while Buddhists try to *deconstruct* the necessity of location.

  ### 3. Path to Progress: From Identity to Appropriation

  Progress will not come from better bundle theories or more nuanced four-dimensionalism. It requires a **formal distinction between Identity and Appropriation**.

  **A. The Formal Distinction:**
  The debate must shift from **Diachronic Identity Conditions** (Parfit's question) to **Phenomenological Ownership Conditions** (The Buddha's question).
  *   *Anātman* is not the claim "I do not persist." It is the claim "Nothing is fit to be regarded as 'mine' or 'I'."
  *   Progress requires formalizing **appropriation** (*upādāna*) as a distinct cognitive function from **identification**. Analytic philosophy conflates the two: to identify with a future experience is to appropriate it. Buddhism suggests one can acknowledge causal continuity (identification) without affective ownership (appropriation).

  **B. The Phenomenological Result:**
  We need empirical or phenomenological work on the **sense of ownership** distinct from the **sense of continuity**.
  *   Pathologies like somatoparaphrenia (denying ownership of a limb) or depersonalization suggest the "sense of self" is a modular cognitive output, not a metaphysical necessity.
  *   If Buddhist practitioners can demonstrate (via phenomenology) that causal continuity is experienced *without* the marker of "mineness," the analytic worry about agency dissolves. The "agent" is just the label for the causal locus, not a metaphysical glue.

  **C. Dissolving the Question:**
  Ultimately, the question "Is there a self?" is ill-posed because it assumes "self" refers to a natural kind.
  *   **Progress** looks like adopting Nāgārjuna's *prasaṅga* method within analytic discourse: Show that *both* the existence and non-existence of a self lead to absurdity if *svabhāva* is presupposed.
  *   The analytic debate assumes a binary: Realism vs. Eliminativism. The Madhyamaka move is to reject the binary: **Dependent Arising** (*pratītyasamutpāda*).
  *   A person exists *like an illusion*: causally effective, conventionally designatable, but ontologically empty.

  ### Conclusion

  The stall is a **category error**. Analytic philosophers are doing **metaphysics of time** (persistence), while Buddhist scholars are doing **ontology of dependence** (inherence).

  **What counts as progress?**
  1.  **Stop asking about Identity:** Acknowledge that *anātman* is not a competitor to Locke or Parfit on personal identity.
  2.  **Start asking about Ownership:** Frame the debate around the cognitive mechanism of *grasping* (taking the aggregates as self).
  3.  **Accept Conventional Agency:** Agree that moral responsibility functions at the level of *vyavahāra* (convention) without requiring *svabhāva* (ultimate reality).

  Until analytic philosophers stop trying to "save" the self via reductionism, and Buddhist scholars stop dismissing metaphysics as merely soteriological, the debate will remain a dialogue of the deaf. The breakthrough lies in recognizing that *anātman* denies the **ontological weight** of the person, not their **causal continuity**.
