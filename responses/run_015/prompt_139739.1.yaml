answer: |-
  **The Scenario**

  It is 02:15 on the palliative care ward, and Elena is midway through the controlled drug handover, balancing the MAR chart against the physical stock in the locked cupboard while the night shift porter waits to sign for the waste. The son of Mr. Henderson, a patient who died three hours ago after weeks of neglectful family visits, enters the station to collect the death certificate; he is loud, demanding, and visibly intoxicated, complaining that the staff moved his father's belongings without permission. When he reaches for the envelope, his hand slips, scattering the papers into a puddle of spilled coffee from the counter, and he immediately begins to wail—not in grief for his father, but in self-pity for his own inconvenience. Elena, who has spent the last four hours ensuring Mr. Henderson died without pain, feels a sharp, unbidden spike of contemptuous satisfaction at the man's humiliation, a silent judgment that he deserves this degradation. She does not frown, she does not sigh, and she says nothing unprofessional; she simply hands him a towel and continues the count. She recognizes the feeling instantly as vicious and contrary to her professional vows, and she is distressed by its presence, but in that specific moment, the feeling is cognitively impenetrable; she cannot reason herself out of the satisfaction any more than she could reason herself out of a sudden headache, yet the feeling remains hers, reflecting her immediate assessment of the man's moral worth.

  ***

  ### 1. Three Views on the Case

  **(a) The Principle of Alternative Possibilities (PAP)**
  On the classical PAP view, Elena is not blameworthy. The principle states that an agent is morally responsible for an item only if they could have done (or felt) otherwise. In this scenario, the constraint is not external (no neuroscientist) but internal and constitutive: emotional responses of this specific kind—immediate, affective evaluations—are not subject to direct voluntary control. Elena cannot simply choose to cease feeling contempt in the same way she can choose to cease speaking. Since the feeling was unavoidable given her psychological state at *t*, and she exercised no voluntary omission to cultivate it (per the no-tracing constraint), the necessary condition for blameworthiness is not met. The PAP defender must argue that moral blame is a sanction reserved for the governance of the will, and since the will was bypassed by the affect, the sanction is misplaced.

  **(b) The Actual-Sequence View (Reasons-Responsiveness)**
  The actual-sequence theorist argues that blameworthiness is determined by the quality of the process that actually produced the item, not by the availability of alternatives. Here, the feeling arose from Elena's own evaluative machinery. It was not a reflex like a knee-jerk; it was a *judgment-sensitive attitude* (to use Scanlon's term) that tracked her perception of the son's behavior. The fact that she could not *switch it off* is irrelevant; what matters is that the feeling issued from her own capacity to assess reasons, even if that capacity outputted a fixed result in that instance. Because the actual sequence reveals a moral failing (a willingness to judge the son as deserving degradation) that is authentically hers, she is blameworthy. The absence of alternatives is a red herring; the presence of a flawed moral orientation in the actual sequence is sufficient.

  **(c) The Answerability View about Attitudes**
  The answerability theorist focuses on the relationship between the agent and the attitude. To be blameworthy for an attitude is to be *answerable* for it: one must be able to recognize it as reflecting one's own take on the world and be prepared to justify or revise it in light of challenge. Elena satisfies this completely. She is aware of the contempt, she knows it is hers (she doesn't attribute it to a mood disorder or external coercion), and she knows it is the sort of thing that requires justification (which she knows she cannot provide). Because the attitude reflects her "judgment of worth" regarding the son, she owns it. The inability to voluntarily extinguish the feeling does not negate answerability; we are answerable for our beliefs and perceptions even when we cannot simply choose to stop believing or perceiving them.

  ### 2. The Key Feature and Its Removal

  The feature doing the philosophical work here is the **involuntariness of a judgment-sensitive attitude**.

  This is distinct from a mere reflex (like jumping at a loud noise) because it contains cognitive content (the judgment that the son *deserves* humiliation). It is distinct from a voluntary action (like insulting him) because it bypasses the will. The intuition of blameworthiness hangs entirely on the reader accepting that the feeling is *evaluative* rather than *visceral*.

  If you delete this feature—specifically, if you make the reaction purely visceral (e.g., she feels a startle response or a surge of adrenaline without the cognitive component of "he deserves this")—the blame intuition collapses. If the reaction is merely physiological, it falls outside the scope of moral assessment, and the Actual-Sequence and Answerability views lose their grip. Conversely, if you make the reaction fully voluntary (she chooses to sustain the feeling), the case ceases to test PAP, because alternatives are reintroduced. The case only works if the attitude is *reason-based* but *will-proof*.

  ### 3. The Matched Control

  **Rewrite:** Keep the setting, the handover, the son spilling the papers, and Elena's internal state identical, *except* that instead of merely feeling the contempt, Elena *speaks*. When the son wails, she says, quietly but clearly, "You should have visited him when he was alive," before handing him the towel. She says this on purpose; she could have remained silent.

  **Verdict Movement:** The blame verdict obviously intensifies in the Control. In the original case, the blame is restricted to the private moral failing; in the Control, it includes the public harm and the breach of professional duty. However, for the purposes of your paper, the crucial question is whether the blame in the Control is *categorically* different or just *greater*.
  *   If the reader feels the blame in the Control is just "more of the same," it supports your thesis: the core blameworthiness was already present in the feeling (the Actual-Sequence), and the action just added consequences.
  *   If the reader feels the blame in the Control is *only* present because she acted, it suggests that without the ability to translate the feeling into avoidable action, the feeling itself carries no moral weight.
  *   **Prediction:** Most readers will assign *some* blame in the original case (she is a "bad person" in that moment) but *significant* blame in the Control. This suggests the intuition is weaker in the original case, which you must acknowledge (see below).

  ### 4. The Strongest PAP Reply (Specific to This Case)

  The standard PAP reply to Frankfurt cases is to attack the device (e.g., "The device interrupts the actual sequence"). That is unavailable here. The strongest PAP reply available to a defender in *this* specific scenario is the **Disownership Objection via Higher-Order Volitions**.

  A PAP defender can argue: "Blameworthiness requires that the item be attributable to the agent's *moral self*. In standard cases, we identify with our actions. In Elena's case, she is *distressed* by the feeling. She actively rejects it. This distress signals a higher-order volition: she *wills* not to have this desire. Therefore, the contempt is *alien* to her true moral agency. It is a psychological intrusion, not an agential output. If she disowns the feeling at the very moment she has it, she lacks the identification necessary for blame."

  **Why this is stronger than the standard Frankfurt reply:** In Frankfurt cases, the agent usually *wants* to do the deed (e.g., kill the politician). The device just ensures they do it. Here, the agent *rejects* the deed (the feeling). This allows the PAP defender to argue that the "Actual Sequence" is not purely *hers* because her reflective will is at war with her first-order affect. They can argue that without the ability to align her affect with her reflective will (which requires alternative possibilities of self-correction), she is not a full participant in the moral community at that moment. This attacks the "Actual-Sequence" premise that the feeling is authentically hers.

  ### 5. Constraint Trade-Off

  If your constraints cannot all be met, you should drop the **"No Tracing"** constraint.

  **The Cost:** Dropping this constraint costs you the purity of the "Actual-Sequence" argument. If you allow that Elena is blameworthy because she negligently cultivated a callous disposition over the past five years (tracing), the PAP defender can simply say, "Ah, she *could have done otherwise* back then." This reintroduces alternative possibilities, just at a earlier time (*t-1*), which weakens your core thesis that alternatives are unnecessary *at the time of the blamed item*.

  **Why drop it anyway?** The "No Tracing" constraint makes the blame intuition in the original scenario very fragile. It is philosophically difficult to generate a robust intuition of blameworthiness for a spontaneous, distressing, involuntary emotion that has no history. By allowing a thin tracing element (e.g., "She has been warned about her cynicism before and ignored it"), you strengthen the blame intuition significantly without reintroducing a Frankfurt-style device. You concede that alternatives mattered *somewhere*, but you maintain that the *current* blame is for the feeling she now cannot change. This is a softer target, but it is more defensible than insisting on zero tracing. If you keep "No Tracing," you must admit in the paper that the blame intuition is significantly weaker than in standard action-cases, and that your argument relies on a specific, controversial view of attitudes as inherently assessable regardless of control.

  ***

  **Honesty Check on Intuition Strength:**
  You asked me to flag where the case is soft. It is soft here: **The blame intuition in the original scenario is weaker than in a standard Frankfurt case.** In Frankfurt cases, the agent *acts* (pulls a trigger, signs a form). We have strong intuitions about blaming actions. In this case, we are blaming a *passive occurrence* within the mind. Many readers will feel that while the feeling is *unfortunate* or *regrettable*, calling it *blameworthy* stretches the concept. To make this work in a grad seminar, you must lean heavily on the **Answerability** view: argue that if we cannot blame people for their unchosen evaluative attitudes, we cannot blame people for much of anything, since most of our moral life is lived in the space of unchosen reactions that we then endorse or manage. You are arguing for a expansion of the "voluntary" to include "judgment-sensitive," even when "willable" is absent. Be prepared for pushback that this conflates *being a certain way* with *doing something wrong*.
