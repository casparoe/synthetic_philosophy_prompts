answer: |-
  Dan and Phil are standing in front of a massive Rothko at MoMA. It's a vibrating expanse of burnt orange and deep maroon.

  Phil sighs. "Man, that orange just glows. It feels aggressive."

  Dan adjusts his glasses. "Careful, Phil. 'Feels' and 'glows' are suspect. You're reifying private, ineffable properties. I've quined my qualia. I don't *feel* aggression; I'm merely entering a discriminative state that predisposes me to aversive judgments."

  "Right," Phil says. "So, does it look aggressive or not?"

  " 'Look' is the trap!" Dan snaps. "Remember Chase and Sanborn? Chase said the coffee tasted the same, he just didn't like it anymore. Sanborn said the taste changed. Dennett showed there's no fact of the matter about the raw feel independent of the judgment. So I'm not saying the painting *has* an aggressive appearance. I'm saying my visual system is currently disposed to categorize this wavelength configuration as 'threatening'."

  Phil squints at the canvas. "Okay. And what's driving that disposition?"

  Dan stares at the orange. "Well. It's the... the immediate, involuntary impact of the stimulus on my reporting mechanisms."

  "Which is?"

  "The way it strikes me," Dan says, then freezes.

  "The way it *strikes* you?" Phil presses. "Like, the way it *looks* to you?"

  "No! No, 'looks' implies an intrinsic phenomenology. I mean the... the functional role of the stimulus in my cognitive economy." Dan wipes his brow. "It's a state that compels me to say 'whoa'."

  "What compels it?"

  "The... the distinctive character of the input!" Dan throws his hands up. "Look, if I describe the functional role precisely enough—if I specify exactly how the system is disposed to react, what memories it triggers, and how it forces a judgment—haven't I just described the experience?"

  "Pretty much."

  "But without the qualia!"

  "Dan," Phil says, pointing at the orange block. "You just described the qualia. You just put the qualia in a trench coat, gave it a fake mustache, and called it a 'discriminative disposition.' But it's still the qualia standing right there in the lobby."

  Dan stares at the painting, defeated. "Damn it. I haven't eliminated the ghost in the machine. I've just hired it as a consultant and changed its title to 'Vice President of Judgments'."

  "So," Phil says. "Does it still look aggressive?"

  Dan sighs. "Yes. And frankly? It hurts."

  "There they are."
