      4. Dan realizes the disposition is defined by how it strikes him.
      5. Punchline: He realizes he's just describing the qualia but charging by the hour.

      *Let's try to nail the Chase-Sanborn reference.* Chase says taste stayed same, preference changed. Sanborn says taste changed. Dennett says no fact of the matter.
      *Application to Art:* Did the painting change, or did my discrimination network change?
      *The Trap:* To answer that, you need to know what the experience *was*.

      *Finalizing the Punchline:* The punchline should be that the "functional role" he describes is so specific it *is* the qualia, proving that quining qualia is just qualia in a trench coat.

  8.  **Final Polish:** Check the terminology. Ensure "quining," "Chase-Sanborn," "dispositional," "judgment," and "heterophenomenology" are used correctly enough for the target audience.

