  **Stats/ML (Incentive Design):** They will hear "proper scoring rule" and think of elicitation mechanisms for forecasters. *Defuse:* When defining Strict Propriety (Minute 15). Write "No Principal" on the board. Explicitly state: "We are not designing a contract to trick an agent; we are defining what it means for a belief to fit the world." This separates epistemic norms from mechanism design. Ask them to close their laptops to prevent searching for mechanism design papers.

