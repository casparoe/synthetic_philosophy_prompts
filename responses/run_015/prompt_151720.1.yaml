answer: |-
  **MEMORANDUM**

  **TO:** Programme Board, National Brain and Mind Research Programme
  **FROM:** Methods and Standards Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Methodological Guidance for Call 2: First-Person Reports

  **Purpose**
  As the Programme prepares its second call for proposals, we must clarify the evidentiary status of first-person reports. Our success metric is a validated, clinically usable measure of conscious experience. Two factions propose conflicting rules: one mandating heterophenomenology (reports as text only), the other admitting trained first-person methods as evidence of experience. This memo recommends a path that secures the success metric without compromising scientific rigor.

  **The Calibration Dilemma**
  Any candidate neural or behavioral marker requires calibration against a ground truth. Currently, first-person reports are the only available calibrators. If we adopt a standing rule demoting reports to mere "dispositions to speak" (the ontological thesis), we remove the yardstick required to validate the very neural markers the Programme seeks. For example, in no-report paradigms, confidence measures are proxies; without occasional calibration against explicit reports, we cannot verify they track awareness rather than task performance. Similarly, in blindsight studies, inconsistent reports are data to be refined, not discarded. A rule that renders reports ontologically inert makes the Programme's success metric unreachable.

  **Scruple vs. Ontology**
  We must distinguish between heterophenomenology as a *methodological scruple* and as an *ontological thesis*.
  1.  **Methodological Scruple (Settled):** Reports are not infallible. They are question-dependent and partially constructed by the elicitation method. Applicants must not treat naive utterances as direct readouts of internal states.
  2.  **Ontological Thesis (Contested):** Reports *never* reveal experience itself, only a theorist's construct. This is a philosophical position, not settled science.

  We are voting on methodology, not metaphysics. The Scruple can and should be adopted without the Ontological Thesis. Adopting the Thesis would prematurely close empirical inquiry into the relationship between speech and experience.

  **Standards for Validated Elicitation**
  If reports are admitted as evidence, they must meet standards comparable to other measurement instruments. Casual questioning is insufficient. Validated elicitation procedures must include:
  *   **Training:** Subjects trained in attentional stability (e.g., micro-phenomenology).
  *   **Structure:** Interview protocols that minimize leading questions and demand specificity.
  *   **Replicability:** Documentation allowing the elicitation context to be reproduced.

  **Recommendation**
  The Subcommittee recommends **Adopting the Scruple with an Explicit Carve-Out for Trained First-Person Methods**.

  Applicants must treat reports as data subject to error (Scruple), but may propose structured, trained elicitation protocols as valid evidence for calibration and validation (Carve-Out). This allows the use of reports to validate neural markers while guarding against naive realism.

  **Strongest Consideration for the Rejected Position**
  We acknowledge the strongest argument for the strict heterophenomenological rule: even trained reports remain theory-laden and susceptible to subject bias. Relying on them risks circularity, where neural markers validate reports that were used to validate the markers. However, without *any* recourse to first-person evidence, the Programme cannot claim to measure *conscious experience* rather than mere unconscious information processing.

  **Conclusion**
  This approach balances the need for objective validation with the phenomenological reality of the target construct. It provides applicants with clear standards for proposal development while preserving the Programme's ability to meet its success metric.

  \answer{Adopt-With-Carve-Out}
