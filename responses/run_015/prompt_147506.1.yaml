answer: |-
  # Protocol for Evaluating Non-Human Agency in Historical Proposals

  **Purpose:** To distinguish between legitimate causal attribution (non-human forces as constraints/context) and environmental determinism (non-human forces as sole drivers), while specifically filtering for *Post-hoc Ventriloquism* and *Scalar Slippage*.

  **Usage:** This procedure is to be applied sequentially. A proposal fails at the first step where it cannot provide a sufficient answer, unless marked as **[HUMAN JUDGMENT]**, in which case the Board must deliberate.

  ---

  ## Phase I: Empirical Coherence (The Mechanism Test)

  **Step 1: Physical Mechanism Specification**
  *   **Question:** Is the non-human force (pathogen, aerosol, temperature shift) defined by physical parameters independent of the social outcome?
  *   **Sufficient Answer:** The proposal cites specific data (e.g., ice core sulfate levels, *Yersinia pestis* DNA load, dendrochronological indices) that exists prior to and separate from the historical narrative.
  *   **Negative Determination:** If the force is defined only by its social effects (e.g., "the famine-causing climate"), reject immediately. This is circular reasoning.
  *   **Status:** Empirical.

  **Step 2: The Transmission Chain (Scalar Slippage Test)**
  *   **Question:** Does the proposal identify at least two distinct human institutional layers mediating the force between the physical event and the political outcome?
  *   **Sufficient Answer:** A chain such as: *Volcanic Aerosol $\rightarrow$ Regional Crop Yield $\rightarrow$ Grain Market Price $\rightarrow$ Municipal Tax Policy $\rightarrow$ Civil Unrest.*
  *   **Negative Determination:** If the proposal moves directly from the physical event to the macro-political outcome (e.g., *Eruption $\rightarrow$ Revolution*) without naming specific markets, laws, or administrative bodies that transmitted the shock, reject immediately.
  *   **Status:** Empirical.

  ---

  ## Phase II: Causal Architecture (The Agency Test)

  **Step 3: Constraint vs. Command (Determinism Test)**
  *   **Question:** Does the model demonstrate that human actors retained at least one viable alternative course of action that was *not* taken, despite the environmental pressure?
  *   **Sufficient Answer:** The proposal identifies a "road not taken" (e.g., "The state could have imported grain but chose to hoard," or "Landlords could have enclosed land but chose to negotiate"). The non-human force must narrow the *probability* of outcomes, not dictate the *singularity* of the outcome.
  *   **Negative Determination:** If the proposal argues the outcome was "inevitable," "unavoidable," or "forced" without exception, reject immediately.
  *   **Status:** Empirical/Logical.

  **Step 4: Narrative-Analytic Consistency (Post-hoc Ventriloquism Test)**
  *   **Question:** Is the language used to describe the non-human force consistent between the quantitative/comparative analysis and the qualitative narrative?
  *   **Sufficient Answer:** If the force is treated as a variable ($X$) in the analysis, it is treated as a condition/context in the narrative. If metaphorical agency is used in the narrative (e.g., "The virus demanded..."), it is explicitly flagged as metaphorical or rhetorical device, not causal mechanism.
  *   **Negative Determination:** If the analysis treats the force as a blind mechanism but the narrative attributes intentionality, strategy, or purpose to the force to explain specific outcomes *after* they are known, reject immediately.
  *   **Status:** Empirical/Linguistic.

  ---

  ## Phase III: Normative Balance (The Interpretive Test)

  **Step 5: Weight of Explanation [HUMAN JUDGMENT]**
  *   **Question:** Even if mechanisms are present, does the non-human force absorb explanatory weight disproportionate to the evidence, effectively rendering human diplomacy, ideology, or culture as epiphenomenal?
  *   **Sufficient Answer:** The Board determines that human choices remain the primary site of explanation, with the non-human force serving as the *boundary condition* within which those choices were made.
  *   **Negative Determination:** The Board votes that the proposal reduces human history to a reaction function of environmental variables.
  *   **Status:** **Normative (Board Vote Required).**

  **Step 6: Ethical & Political Implications [HUMAN JUDGMENT]**
  *   **Question:** Does framing the event this way risk absolving human actors of responsibility for suffering or conflict (e.g., attributing war to climate rather than leadership)?
  *   **Sufficient Answer:** The Board determines the framing does not obscure moral accountability.
  *   **Status:** **Normative (Board Vote Required).**

  ---

  ## Application of Procedure to Concrete Cases

  ### Case 1: The Black Death and English Labor Contracts (1350s)
  *Proposal Claim:* High mortality from *Yersinia pestis* directly reshaped English labor contracts, ending serfdom.

  *   **Step 1 (Mechanism):** **PASS.** Proposal cites parish records and DNA evidence of plague strains distinct from economic data.
  *   **Step 2 (Transmission):** **STALL.** The proposal links "Mortality" directly to "End of Serfdom." It lacks the intermediate layer of *Manorial Courts* and the *Statute of Laborers*. It implies the labor shortage automatically rewrote contracts.
      *   *Missing Info:* Evidence of specific legal battles, wage negotiations, or landlord responses to the Statute of Laborers.
  *   **Step 3 (Constraint):** **PASS (Conditional).** The proposal acknowledges landlords attempted to freeze wages (alternative action) but failed. This shows human choice was present, even if unsuccessful.
  *   **Step 4 (Ventriloquism):** **FAIL.** The narrative states: "The Plague *demanded* higher wages and *broke* the manorial system." The analysis treats plague as a mortality rate variable.
      *   *Correction Required:* Change narrative to "The Plague *created leverage* for laborers..."
  *   **Step 5 & 6 (Human Judgment):** **NOT REACHED.** (Failed at Step 4).

  **Verdict:** **Reject with Invitation to Resubmit.**
  **Reasoning:** The proposal commits *Post-hoc Ventriloquism* by attributing intentionality to the pathogen in the narrative. It also risks *Scalar Slippage* by skipping the legal/institutional mediation (Step 2).
  **Resolution:** The investigator must rewrite the narrative to remove agential language assigned to the bacteria and detail the specific legal mechanisms (courts, statutes) that translated mortality into contract changes.

  ### Case 2: The Laki Eruption (1783) and the French Revolution
  *Proposal Claim:* The 1783 Laki fissure eruption was a decisive actor in the political unrest leading to the French Revolution.

  *   **Step 1 (Mechanism):** **PASS.** Proposal cites sulfur dioxide data and contemporary accounts of the "dry fog."
  *   **Step 2 (Transmission):** **PASS.** The proposal traces: *Aerosols $\rightarrow$ European Crop Failure $\rightarrow$ French Bread Prices $\rightarrow$ Urban Unrest.*
  *   **Step 3 (Constraint):** **STALL.** The proposal argues the monarchy *could not* have survived the price shock. It does not explore alternative fiscal policies or grain import strategies that might have mitigated the unrest. It borders on determinism.
      *   *Missing Info:* Comparative data on how other monarchies handled similar price shocks, or evidence of specific royal decisions that exacerbated the Laki effect.
  *   **Step 4 (Ventriloquism):** **PASS.** The proposal treats Laki as a "trigger" or "stressor," not an intentional actor.
  *   **Step 5 (Human Judgment):** **STALL.** The Board must decide if "decisive actor" grants the volcano too much weight compared to the fiscal crisis and Estates-General politics.
      *   *Normative Issue:* Is calling it "decisive" an empirical claim or a weighting judgment?
  *   **Step 6 (Human Judgment):** **PENDING.** If the volcano is "decisive," does this absolve the Crown of fiscal mismanagement?

  **Verdict:** **Conditional Approval (Pending Clarification).**
  **Reasoning:** The proposal passes the empirical mechanism tests but stalls on the *Constraint* test (Step 3) and requires *Human Judgment* (Step 5) regarding the weight of explanation.
  **Resolution:** The investigator must demonstrate that the monarchy had viable policy options that were rejected (proving human agency) and clarify that Laki was a *catalyst* within a political crisis, not the *cause* of the crisis itself.

  ---

  ## Meta-Evaluation: Fragility and Revision Conditions

  ### Conditions for Revising the Procedure
  I would revise this procedure under the following conditions:

  1.  **Evidence of Non-Linear Tipping Points:** If research demonstrates that certain social-ecological systems possess hard "tipping points" where human agency is genuinely suspended (e.g., total caloric intake below survival threshold), **Step 3 (Constraint vs. Command)** would need modification. Currently, the procedure assumes human choice always exists. If empirical data proves a threshold where choice is biologically impossible, the "Determinism Test" would yield false negatives for legitimate catastrophic studies.
  2.  **Adoption of New Materialist Ontologies:** If the field shifts toward a philosophical framework where "agency" is not restricted to intentionality (i.e., matter *does* act, independent of human interpretation), **Step 4 (Ventriloquism)** becomes philosophically biased. If the fund explicitly seeks to explore "vibrant matter" theories, banning language that attributes action to non-humans would stifle the very research the fund supports.
  3.  **Archival Silence:** If the mediating institutions required by **Step 2 (Transmission Chain)** are known to be unrecorded (e.g., oral economies, destroyed archives), strict adherence to this step would systematically bias the fund toward well-documented European states, excluding Global South or ancient history. A "probabilistic mediation" clause would be needed.

  ### Exposed Reasoning and Potential Errors
  The reasoning behind this procedure is most exposed to error at **Step 5 (Weight of Explanation)**.

  *   **The Error:** Distinguishing between "boundary condition" and "driver" is often subjective. A 90% constraint looks very much like a command. By handing this to Human Judgment, I am acknowledging that the line between determinism and strong causation is not empirical, but interpretive.
  *   **The Fragility:** This creates inconsistency across the Board. One panel might view "climate as 80% of the cause" as determinism; another might view it as realism.
  *   **The Risk:** The procedure creates a "safe zone" for proposals that downplay environmental factors to avoid rejection, potentially chilling innovative research that argues for *stronger* non-human influence than is currently academically fashionable. The procedure protects against determinism but may inadvertently enforce a status quo bias that privileges human-centric history over ecological history.

  **Final Note:** The boundary between causal agency and determinism collapses not when the environment is powerful, but when the *historian* fails to model the human response. Therefore, the procedure focuses less on the strength of the environmental force and more on the specificity of the human mediation.
