      *   Start with brainstorm table? Check.
      *   Focus on conceptual audit? Check.
      *   Address delicacy of imagination/passion? Check.

  10. **Writing the content.** (Self-Correction during drafting: Ensure I don't sound *too* dismissive of the thermometer analogy; it explains *why* people use it, but show why it's ultimately misleading.) *Wait, make sure to explicitly address the "delicacy of passion" vs "delicacy of imagination."* Hume notes that while we want delicacy of imagination, we don't necessarily want delicacy of passion (being too easily offended). A thermometer is *all* sensitivity. A critic needs *judicious* sensitivity. This is a crucial break.

  11. **Final Polish:** Check the flow and ensure the "Philosopher of Art" voice is consistent. (e.g., using terms like "sentiment," "projectivism," "normative," "intersubjective").

