answer: |-
  Your hypothesis that the disagreement is about the **unit of decision** (act vs. algorithm) is correct as a description of the *mechanism*, but it is incomplete as a diagnosis of the *cause*. If you ask a Causal Decision Theorist (CDT) why they reject the algorithm as the unit of decision, they will not say "I prefer acts." They will say, "Algorithms cannot causally influence distant copies; treating them as such is magical thinking." If you ask a Functional Decision Theorist (FDT) why they insist on the algorithm, they will not say "I like algorithms." They will say, "Agents that reason about acts systematically lose money in foreseeable scenarios."

  The stalemate persists not because they haven't heard each other's arguments, but because they are optimizing for different normative criteria and operating with incompatible semantics for **counterfactuals**.

  Here is the diagnosis of the disagreement, followed by an assessment of what would count as progress.

  ### 1. The Diagnosis: Three Layers of Conflict

  The debate is not merely verbal, nor is it purely metaphysical. It is a stack of three distinct disagreements, where the lower layers sustain the upper ones.

  **Layer 1: The Normative Criterion (Winning vs. Purity)**
  This is the deepest divergence.
  *   **The Acausal Side (FDT/TDT):** Defines rationality instrumentally. A decision theory is a tool for securing good outcomes. If a theory systematically yields lower utility than an alternative in a well-specified problem (like Newcomb's), the theory is defective. Their slogan is effectively: *"Rationalists should win."*
  *   **The Causal Side (CDT):** Defines rationality procedurally. A decision is rational if it is based on the best available causal model of the world. If the world is structured such that rational agents are punished (e.g., by a predictor who penalizes those who two-box), the fault lies with the world's "unfairness," not the agent's reasoning. Their slogan is effectively: *"Rationalists should reason correctly."*

  **Layer 2: The Semantics of Counterfactuals (Logical vs. Physical)**
  This is the technical engine of the disagreement. To calculate expected utility, you must evaluate counterfactuals ("If I were to do X, what would happen?").
  *   **CDT:** Uses **physical counterfactuals**. You surgically intervene on the action node in a causal graph. The past and any logically correlated nodes (like a predictor's simulation) remain fixed because they are in the past or causally disconnected. To CDT, asking "What if my algorithm outputted differently?" implies changing the past or violating physics.
  *   **FDT:** Uses **logical counterfactuals**. You intervene on the *output of the decision function*. Since the predictor's simulation runs the same function, changing the output of your function logically necessitates a change in the simulation's output. To FDT, this is not backward causation; it is logical consistency.

  **Layer 3: The Domain of Legitimacy (Fairness)**
  This is the shield each side uses to deflect the other's examples.
  *   **CDT:** Dismisses Newcomb-like problems as **"unfair"** or **"ill-posed."** They argue that a problem where you are rewarded for irrationality (or punished for rationality) is not a test of decision theory but a test of pre-commitment ability. They often argue that perfect predictors are physically impossible, making the problem degenerate.
  *   **FDT:** Argues that Newcomb-like problems are **ubiquitous in disguise**. Any situation involving reputation, negotiation, or interaction with similar agents (including future versions of oneself) contains acausal correlations. To dismiss them is to blind the agent to real-world leverage.

  ### 2. Is Your "Unit of Decision" Hypothesis Right?

  It is **phenomenologically right but causally shallow**.
  Identifying the unit of decision explains *how* they differ, but not *why*. The reason FDT chooses the algorithm as the unit is precisely to satisfy the normative criterion of "Winning" in the presence of logical correlations. The reason CDT chooses the act is to satisfy the normative criterion of "Causal Purity."

  If you forced them to agree on the unit of decision, the disagreement would simply migrate. If CDT accepted the algorithm as the unit, they would argue that the causal graph of the algorithm's execution does not include the predictor's box. If FDT accepted the act as the unit, they would argue that the act carries logical information. The root is the **semantics of the counterfactual**, not the label of the choice variable.

  ### 3. What Would Count as Progress?

  Given this diagnosis, progress is unlikely to come from one side conceding on metaphysics (e.g., CDT admitting "acausal influence exists"). Instead, progress requires reframing the question from "Which theory is True?" to "Which theory is **Reflectively Stable**?" and "What counts as a **Fair** problem?"

  **A. Formal Progress: Dynamic Consistency**
  There is a hidden formal question doing the work: **Dynamic Consistency.**
  A decision theory is dynamically consistent if an agent does not regret their decision procedure at a later time and would not pay to pre-commit to a different procedure.
  *   **Result:** CDT is known to be dynamically inconsistent in certain pre-commitment scenarios (e.g., Parfit's Hitchhiker). A CDT agent, once rescued, would refuse to pay the rescuer, meaning they would not have been rescued if the rescuer knew they were CDT.
  *   **Progress:** A formal proof showing that FDT is the *unique* theory that satisfies Dynamic Consistency across the broadest class of problems (including those with logical correlations) would be a major victory. It shifts the argument from "Who wins Newcomb?" to "Which agent can successfully bind themselves to future actions?"
  *   **Obstacle:** CDT proponents argue that dynamic inconsistency is only a problem if you face "unfair" problems. They accept that CDT agents might lose in Newcomb but argue they shouldn't have been in that game to begin with.

  **B. Conceptual Progress: Defining "Fairness"**
  The stalemate holds because CDT hides behind the claim that Newcomb problems are "unfair."
  *   **Progress:** A rigorous definition of **Problem Fairness**.
      *   *Proposal:* A problem is fair if the reward depends only on the agent's *actual choice*, not on the *method* used to choose it.
      *   *Counter-Proposal (FDT):* A problem is fair if the reward depends on the *logical output* of the agent's algorithm, regardless of physical causation.
      *   If we can agree on a formal criterion for fairness that classifies Newcomb's problem as "fair" (because the predictor's accuracy depends on the algorithm, which is a property of the agent), the CDT objection dissolves. If the criterion classifies it as "unfair," the FDT objection dissolves (as they would agree not to optimize for unfair games).
      *   Currently, no neutral definition exists. Progress here would require a meta-theory of decision problems that both sides accept.

  **C. Practical Progress: The AI Alignment Reframe**
  The debate has shifted from human philosophy to AI safety. This offers a path to dissolution.
  *   **Reframing:** Instead of asking "What is rational for a human?", ask "What decision algorithm should we **install** in an autonomous agent?"
  *   **Argument:** Even a CDT proponent, when designing an AI that will face negotiations, market predictions, or copies of itself, would likely program the AI to reason acausally. The AI doesn't care about "causal purity"; it cares about the objective function.
  *   **Progress:** If both sides agree that **Artificial Agents should be FDT** while **Human Rationality might remain CDT**, the normative conflict dissolves into a domain specification. The disagreement becomes empirical: "How often do real-world agents face logical correlations?" If the answer is "often" (in high-stakes AI interactions), FDT wins by default for safety engineering.

  ### 4. Why No Progress Might Be Expected

  Despite the avenues above, there is a strong case that the stalemate is permanent. This is the **"Euclidean vs. Non-Euclidean"** argument.

  *   **Axiomatic Incompatibility:** CDT and FDT rest on different axioms regarding the nature of counterfactuals. CDT assumes counterfactuals must track physical causal history. FDT assumes counterfactuals must track logical implication. These are akin to choosing between the Parallel Postulate and its negation. Neither is "true" in a vacuum; they define different geometries.
  *   **The "Why Ain'cha Rich?" Impasse:** FDT argues CDT leaves money on the table. CDT replies, "I didn't leave it; it was never mine to take because my action couldn't cause it to be there." This is not a resolvable empirical dispute; it is a clash of **modal intuitions**. Unless one side abandons their intuition about what is "possible" in a counterfactual world, they will not concede.
  *   **The Definition of "Rationality":** If "rationality" is a natural kind (like "gold"), one side is wrong. If "rationality" is a design specification (like "efficient"), both can be right relative to different goals (Causal Consistency vs. Utility Maximization). The literature often treats it as a natural kind, which guarantees stalemate.

  ### Conclusion

  Your diagnosis is **half-right**. The "unit of decision" is the visible symptom, but the disease is a conflict between **Outcome-Based Normativity** (FDT) and **Process-Based Normativity** (CDT), mediated by incompatible **Counterfactual Semantics**.

  **Progress is possible, but not through concession.** It will come from:
  1.  **Reflective Stability Proofs:** Demonstrating that CDT agents would self-modify to become FDT agents if given the chance (which suggests CDT is instrumentally convergent but not reflectively stable).
  2.  **Formalizing Fairness:** Creating a meta-criterion that definitively categorizes Newcomb-like problems as legitimate or illegitimate.
  3.  **Engineering Reframing:** Abandoning the question "What is rational?" in favor of "What algorithm maximizes the objective function in a multi-agent environment?"

  If the field remains stuck on defining human rationality, the stalemate will endure. If it shifts to defining optimal agent architecture, the acausal side will likely win by default, not because they proved causality wrong, but because their agents will own the world the causal agents lost.
