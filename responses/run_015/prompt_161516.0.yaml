answer: |-
  Here are ten questions designed to bypass the standard "arbitrariness" and "step-by-step" defenses, focusing on the structural and epistemic implications of fanaticism.

  ### 1. The Audit Problem (Required)
  **Question:** Let's operationalize this. Imagine an "Office of Long Shots" funded to maximize speculative EV. They fund projects with one-in-a-billion chances of saving $10^{50}$ lives. The staff knows they will never live to see the outcome. How does this office audit its own models? If the feedback loop is severed by time or probability, what distinguishes their budgeting from numerology?

  **Likely Answer:** "We audit the *reasoning* and the *physics*, not the outcome. We rely on idealized epistemic agents who assess the theoretical validity of the claim."
  **Follow-up:** "But if the theoretical validity rests on premises that are themselves untestable long-shot claims, aren't you just auditing internal consistency? Without a track record, how do you penalize a model that is coherent but wrong versus one that is coherent and right?"

  ### 2. The Portfolio Point (Required)
  **Question:** A single one-in-a-million bet on an astronomical payoff feels like madness. But ten thousand of those bets, pooled, look like venture capital or a research portfolio—and suddenly they feel sane. Does fanaticism only become palatable when aggregated? If so, does that suggest our single-shot mugging intuition is actually a reliable heuristic for non-repeatable decisions?

  **Likely Answer:** "No, the math holds for single cases too. The portfolio just makes it easier for humans to visualize the Law of Large Numbers."
  **Follow-up:** "But we inhabit a single causal timeline, not an ensemble of universes. If the 'rational' choice leads to ruin in 99.9999% of the actual worlds you inhabit, isn't the Law of Large Numbers a description of a multiverse you don't occupy?"

  ### 3. Negative Fanaticism (Required)
  **Question:** Is the view symmetric? If a tiny probability of astronomical good dominates our choices, does a tiny probability of astronomical bad (a micro-chance of triggering a vacuum decay) dominate every ordinary action? Do we have to freeze to avoid the negative EV tail?

  **Likely Answer:** "Yes, negative EV matters equally. We just calculate the probabilities and act accordingly."
  **Follow-up:** "Given that our models for these extremes are equally uncertain, isn't the probability of *model error* higher than the probability of the catastrophe itself? Doesn't that force paralysis, since any action could carry an unmodeled negative tail?"

  ### 4. The Branch You Actually Land In (Required)
  **Question:** If you take the long shot every time, you lose essentially always. What does the view say about the value of the 99.99999% world where you burned the money and got nothing? Does it commit you to a kind of indifference to what actually happens in favor of what *might* have happened?

  **Likely Answer:** "Rationality is about the decision procedure ex-ante, not the realized outcome ex-post. We can't control luck, only expectations."
  **Follow-up:** "So if a policy leads to actual starvation in the world we live in, but had a positive expected value, you endorse the starvation? At what point does 'rational decision-making' become a label for self-destruction in the actual branch?"

  ### 5. Epistemic Precision
  **Question:** To make the math work, you need probability estimates like $10^{-50}$. In physics, we can't even measure constants to that precision. Where do these numbers come from? Are they derived from frequency data, or are they essentially priors dressed up as posteriors?

  **Likely Answer:** "They come from theoretical models, similar to how we estimate risks in particle physics or cosmology."
  **Follow-up:** "In particle physics, those models are anchored by lower-energy experiments. In long-shot ethics, the 'low-energy' anchor is missing. If the number is essentially a prior, aren't you just maximizing your own confidence level rather than an external value?"

  ### 6. Opportunity Costs and Crowding Out
  **Question:** Resources directed at speculative EV are resources not directed at boring, high-certainty good (like deworming or vaccine delivery). Does fanaticism imply we should defund the "boring good" entirely? If not, how do you calculate the opportunity cost of *not* saving the certain lives without reintroducing a threshold for certainty?

  **Likely Answer:** "We fund whatever has the highest marginal EV. Sometimes that's boring good, sometimes it's long shots."
  **Follow-up:** "But if the long-shot payoff is truly astronomical, it mathematically swamps the boring good unless you discount the probability to near zero. If you aren't defunding the boring good, aren't you implicitly applying a discount rate you claim to reject?"

  ### 7. Utility Coherence
  **Question:** Fanaticism requires that utility scales linearly with lives (or value) at astronomical magnitudes. But human valuation saturates. Is "saving $10^{50}$ lives" a coherent concept, or is it a syntax error in our moral grammar? Can a utility function actually hold numbers that large without breaking?

  **Likely Answer:** "Why wouldn't it be coherent? A life is a life. Multiplication is valid."
  **Follow-up:** "Because 'a life' implies a subject of experience. If the universe can't physically support that many subjects, or if the concept of 'individual' breaks down at that scale, isn't the utility number referring to nothing real? Are you maximizing a variable that ceases to exist at the limits?"

  ### 8. Evolutionary Mismatch
  **Question:** Our intuition screams that Pascal's Mugging is wrong. You say intuitions are unreliable. But these intuitions evolved to handle risk and cooperation. Is it possible our disgust at fanaticism is an evolved immune response to exploitation, rather than a cognitive bug?

  **Likely Answer:** "Evolution optimized for survival in the ancestral environment, not for maximizing abstract value in a modern, globalized context."
  **Follow-up:** "But the ancestral environment is the only one where we have evidence that our decision-making works. If we discard the heuristics that kept us alive for a theory that has never been tested, aren't we the ones in the ancestral environment now, just with bigger numbers?"

  ### 9. The Finite Universe Constraint
  **Question:** If the universe is finite (in time, space, or information capacity), there is a hard cap on the maximum possible utility. Does fanaticism collapse if the "astronomical payoff" exceeds the physical capacity of the universe to realize it?

  **Likely Answer:** "We should act based on our credence in infinite or vast universes, not assume finitude."
  **Follow-up:** "But if the physics is actually finite, then the EV calculation is based on a false premise. Are you willing to bet all current resources on the possibility that physics is wrong, simply because the payoff *if* it's wrong is infinite?"

  ### 10. Falsification (Closing)
  **Question:** Finally, what would count as evidence against the view? I don't mean "what if the mugger is lying." I mean: what empirical finding or theoretical development would make you abandon expected value maximization for a bounded or thresholded view?

  **Likely Answer:** "A decision theory that resolves the paradoxes without arbitrary cutoffs and outperforms EV in consistency tests."
  **Follow-up:** "What specific property would that theory need to have that EV lacks? If the answer is 'it matches our intuitions in mugging cases,' aren't you admitting that intuitions do the work after all, and the math is just post-hoc justification?"
