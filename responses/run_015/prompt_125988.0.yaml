      *   *Claim 5 (The Categorical Base Claim):* "The physical base persists during the stimulus." -> False for kill-switches (usually cuts power).

      *Which is she wielding?* Likely Claim 2 & 4 combined. She wants to save the disposition by calling it a mask.
