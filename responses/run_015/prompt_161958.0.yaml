answer: |-
  # Seminar Exercise: The Platonia Protocol

  ## Overview
  *   **Time:** 90 Minutes
  *   **Students:** 18
  *   **Stakes:** 18 Course Points total per round (approx. 2% of final grade per round, adjustable to your syllabus).
  *   **Materials:**
      *   3 sets of 18 Decision Slips (printed on different colored paper).
      *   18 Envelopes (for Round 3 Multipliers).
      *   6 slips marked "×1", 6 slips marked "×2", 6 slips marked "×3" (placed inside the envelopes).
      *   10 twenty-sided dice (d20) placed centrally on tables.
      *   A large bowl for collecting slips.
      *   Whiteboard for tallying results.

  ---

  ## Part 1: Student-Facing Materials

  ### Round 1 Slip (White Paper)
  **DECISION SLIP 1**

  **The Pot:** 18 Course Points.
  **The Rule:** The Pot is awarded **only if exactly one person** in this room claims it.
  *   If **0** people claim: The Pot is destroyed. Everyone gets 0.
  *   If **1** person claims: That person gets 18 points. Everyone else gets 0.
  *   If **2 or more** claim: The Pot is destroyed. Everyone gets 0.

  **Your Choice:**
  [ ] **CLAIM** (I want the pot.)
  [ ] **PASS** (I do not want the pot.)

  *Note: You may decide however you wish. You may use the dice provided if you think chance helps.*

  **Name (Optional):** ___________________

  ---

  ### Round 2 Slip (Yellow Paper)
  **DECISION SLIP 2**

  **The Pot:** 18 Course Points.
  **The Rule:** The Pot is divided equally among everyone who claims.
  *   **Penalty:** If **more than one** person claims, **half the Pot is destroyed** before division.
  *   If **0** people claim: Everyone gets 0.
  *   If **1** person claims: That person gets 18 points.
  *   If **2** people claim: Pot becomes 9 points. Each gets 4.5 points.
  *   If **18** people claim: Pot becomes 9 points. Each gets 0.5 points.

  **Your Choice:**
  [ ] **CLAIM** (I want a share of the pot.)
  [ ] **PASS** (I do not want a share.)

  *Note: Passing always yields 0 points. Claiming yields points if anyone else claims, and more points if fewer people claim.*

  **Name (Optional):** ___________________

  ---

  ### Round 3 Slip (Pink Paper)
  **DECISION SLIP 3**

  **The Pot:** 18 Course Points.
  **Your Multiplier:** You have privately drawn a multiplier (1, 2, or 3). This is known only to you.
  **The Rule:** The Pot is awarded **only if exactly one person** in this room claims it.
  *   If **0** people claim: The Pot is destroyed.
  *   If **1** person claims: That person gets **18 × Your Multiplier** points.
  *   If **2 or more** claim: The Pot is destroyed.

  **Your Multiplier:** ______ (Write the number from your envelope here)
  **Your Choice:**
  [ ] **CLAIM**
  [ ] **PASS**

  **Name (Optional):** ___________________

  ---

  ## Part 2: Facilitator Script & Timeline

  ### 0:00 – 0:05 | Introduction
  **Facilitator:** "We are going to run three decision rounds. In each round, there is a pot of 18 course points available. You will make your decision privately on a slip of paper. You do not need to put your name on the slip, but if you do, I will not look at it until grades are submitted. I will collect the slips, count the claims publicly, and announce the result. Points will be added to your final grade tally. Do not talk to each other during the decision periods."

  ### 0:05 – 0:15 | Round 1 (Symmetry)
  **Action:** Distribute White Slips.
  **Facilitator:** "Read the rules. You have 5 minutes to decide. Mark your slip, fold it, and place it in the bowl."
  *(Wait 5 minutes. Collect slips.)*
  **The Reveal:** "I am going to count the claims now. I will unfold each slip and hold it up."
  *(Count aloud. Write the number of claims on the board.)*
  **Outcome Handling:**
  *   **If 1 Claim:** "One person claimed. They get 18 points."
  *   **If 0 or 2+ Claims:** "The condition was not met. The pot is destroyed. 0 points awarded."
  *(Do not explain why yet.)*

  ### 0:15 – 0:25 | Round 2 (The Lure)
  **Action:** Distribute Yellow Slips.
  **Facilitator:** "New rules. Read carefully. 5 minutes to decide."
  *(Wait 5 minutes. Collect slips.)*
  **The Reveal:** Count claims aloud. Write on board. Calculate payouts based on the "Halving Rule."
  **Facilitator:** "Note the total points awarded this round compared to Round 1."

  ### 0:25 – 0:40 | Round 3 (The Multiplier)
  **Action:** Hand out Envelopes. Instruct students to open them privately, look at their multiplier, and keep it secret. Distribute Pink Slips.
  **Facilitator:** "The rule returns to 'Exactly One Claimant.' But now, your award is scaled by your private multiplier. If you are the sole claimant with a ×3, you win 54 points. If you are the sole claimant with a ×1, you win 18 points. If the pot is destroyed, everyone gets 0."
  *(Wait 10 minutes. This round requires more thought.)*
  **The Reveal:** Count claims. **Crucial:** Ask the claimants (if any) to reveal their multipliers *after* the count is verified.
  **Facilitator:** "We had X claimants. [If 1 claimant]: Did you have a 1, 2, or 3? [If 2+ claimants]: What multipliers did the claimants hold?"

  ### 0:40 – 1:30 | Debrief (The Core Lesson)
  *(See detailed debrief script below)*

  ---

  ## Part 3: The Debrief Script

  **Facilitator:** "We are going to map what happened in this room to the reasoning you used. I am going to introduce four concepts now that were not on your slips."

  ### (i) The Symmetry Premise (Round 1)
  "In Round 1, the only way to maximize the chance of the pot being awarded without communicating was to assume everyone else is reasoning exactly as you are. If you decide 'I will Claim,' you must assume everyone else decides 'I will Claim.' That destroys the pot. If you decide 'I will Pass,' everyone Passes. The pot vanishes.
  The only stable solution is for everyone to adopt the same **probability** of claiming. With 18 of you, if everyone claims with a probability of 1/18, the expected number of claimants is exactly one.
  **Question:** How many of you used a random method, like the dice?
  **Point:** If you did not randomize, you broke the symmetry. You assumed your reasoning was unique. If you did randomize, did you trust others to do the same? The fragility here is that your reasoning only works if your mind is a mirror of theirs."

  ### (ii) Public Randomizer vs. Private Reasoning
  "Suppose I had assigned one of you the 'Claimant' role by lottery at the start. The pot would be safe. That is a **public randomizer**. It coordinates action externally.
  In this game, you had to be your own randomizer. This substitutes a **shared algorithm** for a **shared coordinator**.
  **The Limit:** A public randomizer guarantees coordination. Private randomization relies on the hope that everyone calculates the same probability and actually flips the coin. In Round 1, if the count was 0 or 5+, it proves the class failed to become a single distributed mind."

  ### (iii) Action vs. Rule (Round 3)
  "Round 3 split the room. When you held a ×3, did you think: 'Everyone should Claim'? Or did you think: 'Everyone in my situation (holding a ×3) should Claim'?
  *   **Same Action:** If everyone Claims, the pot dies.
  *   **Same Rule:** 'Claim if Multiplier is 3.' But there are six ×3s. If all six follow that rule, the pot dies.
  To win, you needed a rule like: 'Claim if Multiplier is 3, **and** flip a coin to break ties among the 3s.'
  Did anyone think they should step aside because someone else might have a higher multiplier? That is the **Fairness Objection**. Why should a ×1 hand the pot to a ×3? The 'Superrational' answer is: because if you were the ×3, you would want the ×1 to step aside. You must will the rule universally, not the outcome for yourself."

  ### (iv) The Instability of Conditional Reasoning
  "Some of you may be thinking: 'I would have Passed in Round 2 if I knew enough others would Pass.'
  This is unstable. In a one-shot anonymous game, you cannot condition your move on theirs. You must decide *now*.
  If you say, 'I will Claim only if I think fewer than 3 people will Claim,' you are guessing. If everyone guesses, the variance is high.
  The position 'I will cooperate provided enough others do' is a **causal** argument (I affect the outcome). But in this setup, your choice is **evidential** (my choice is evidence of what others chose). If you are rational, and they are rational, and the situation is symmetric, your choice *is* their choice. You cannot diverge without assuming you are smarter than them. Are you?"

  ### What Must Be Asserted
  "I must assert two things this game cannot prove:
  1.  **Identity of Minds:** The game assumes you are all identical reasoners. You are not. You have different risk tolerances and moral intuitions. Superrationality requires you to treat your reasoning as *causally linked* to theirs, which is physically false but logically necessary for the math to hold.
  2.  **One-Shotness:** You will see each other next week. This is not a true one-shot game. Reputation and future reciprocity bleed into today's choice. A true Platonia Dilemma requires strangers who never meet."

  ---

  ## Part 4: Payoff Table (Instructor Reference)

  | Round | Condition | Payout (Claimant) | Payout (Passer) | Total Points Awarded |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | 0 Claims | 0 | 0 | 0 |
  | | 1 Claim | 18 | 0 | 18 |
  | | 2+ Claims | 0 | 0 | 0 |
  | **2** | 0 Claims | 0 | 0 | 0 |
  | | 1 Claim | 18 | 0 | 18 |
  | | 2+ Claims | (9 / N) | 0 | 9 (Half Pot Destroyed) |
  | **3** | 0 Claims | 0 | 0 | 0 |
  | | 1 Claim (Mult 1) | 18 | 0 | 18 |
  | | 1 Claim (Mult 3) | 54 | 0 | 54* |
  | | 2+ Claims | 0 | 0 | 0 |

  *\*Note: In Round 3, the "Cost" to the system is higher if a ×3 wins, creating tension between efficiency and equity.*

  ---

  ## Part 5: Failure Analysis (What Will Go Wrong)

  **1. The "Joke" Claim**
  *   **Prediction:** In Round 1, one student will Claim just to see what happens, disregarding the points.
  *   **Impact:** If others Pass, the joker wins. If others Claim, the pot dies.
  *   **Mitigation:** In the intro, state: "These points count toward your final grade. Treat this as a real exam question."
  *   **Debrief Use:** Use this to highlight the "Identity of Minds" failure. The joker assumed they were unique.

  **2. Communication & Collusion**
  *   **Prediction:** Students will try to signal or whisper during Round 2 or 3.
  *   **Mitigation:** "Silence is a rule of the experiment. If you speak, your slips are void."
  *   **Debrief Use:** Acknowledge that real-world rational choice often involves building institutions to allow communication. This game forbids it to isolate the reasoning.

  **3. The "Re-run" Expectation**
  *   **Prediction:** If the pot is destroyed in Round 1, students will ask, "Can we try again?"
  *   **Response:** "No. The decision is final."
  *   **Debrief Use:** This is crucial. Superrationality collapses if players think they can learn and adjust. It must be one-shot.

  **4. Point Gaming (Round 3)**
  *   **Prediction:** A student with a ×1 might Claim anyway, hoping all ×3s will "be noble" and Pass.
  *   **Impact:** High chance of pot destruction.
  *   **Debrief Use:** This illustrates the **Fairness Objection**. The ×1 student is effectively betting against the ×3 student's rationality. It exposes that "do what you want everyone to do" is ambiguous when stakes differ. Do we want everyone to Claim? Or everyone to follow the rule "Claim if High Multiplier"?

  **5. The Probability Miscalculation**
  *   **Prediction:** In Round 1, no one uses the dice. They all Pass.
  *   **Impact:** 0 Claims. Pot destroyed.
  *   **Debrief Use:** This is the most likely outcome. It demonstrates **Risk Aversion** overpowering **Logical Symmetry**. Students feel the loss of 0 points is safer than the risk of destroying the pot. This proves that *feeling* the risk overrides the *logic* of the probability unless the randomizer is enforced.

  **6. The Metaphysical Gap**
  *   **Limitation:** The exercise cannot reproduce the premise that "other players are literally running your reasoning."
  *   **Explanation:** Students know they are distinct biological entities. They will not truly believe that their decision *causes* the others' decision.
  *   **Instructor Duty:** You must explicitly state in the debrief: "Hofstadter's definition requires you to act *as if* your decision determines theirs. This game shows you why that is psychologically impossible, even if it is logically consistent."

  ---

  ## Instructor Checklist for Setup
  1.  **Gradebook:** Ensure you have a way to record 18 points per student easily.
  2.  **Dice:** Verify you have enough d20s. If not, print slips numbered 1-20 and have them circle one.
  3.  **Envelopes:** Prepare the 18 multiplier envelopes beforehand (6 of each). Shuffle them.
  4.  **Room:** Arrange seating so students cannot easily see each other's slips.
  5.  **Timer:** Have a visible timer for the decision windows.

  ## Final Note on the "Unstable" Position
  When a student says, "I would Pass if I knew others would Pass," challenge them: "How do you know? Did you read their minds? If you didn't, you guessed. If you guessed, you treated them as objects to be predicted, not as reasoners identical to you. That is the break in superrationality. You placed yourself outside the system."
