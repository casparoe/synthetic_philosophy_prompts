      Ford's Highland Park plant operationalizes Marx's transition from formal to real subsumption. Under formal subsumption, capital buys labour power but leaves the craft process intact; under real subsumption, capital revolutionizes the labour process itself. The moving assembly line is the material embodiment of real subsumption: the machine dictates the pace, stripping the worker of control over technique and timing. This shift drives the production of relative surplus value. By collapsing chassis assembly time, Ford drastically reduced the necessary labour time required to reproduce the wage, expanding surplus labour time relative to the working day, even as the day shortened to eight hours.

      The $5 day engages the moral-historical element in the value of labour power. Marx defines this value not merely by physical subsistence but by cultural expectations. Ford artificially inflated this value to stabilize reproduction, reducing the friction of turnover. The queues at the gates manifest the industrial reserve army, exerting external coercive pressure that complements the internal coercion of the line. Regarding alienation, the case maps cleanly onto Marx's four dimensions. Workers are alienated from the *activity* (fragmented, repetitive motions); from the *product* (owned by capital, not the maker); from *species-being* (reduced to mechanical appendages); and from *other men* (competition for places, policed by the Sociological Department). The initial high turnover predicts the resistance to real subsumption's intensification of alienation; the subsequent stability predicts the efficacy of combining high wages (economic incentive) with the reserve army (economic threat).

      Turning to the theory's stress points: First, the extraction versus command complaint. Marx's apparatus treats these as structurally unified: command over the labour process is the necessary condition for extracting surplus value. Capital must discipline labour to ensure unpaid labour is delivered. However, Ford's case suggests a phenomenological split. Workers tolerated the extraction complaint (unpaid labour) provided the wage was high, but resisted the command complaint (loss of autonomy), evidenced by the pre-1914 turnover. The $5 day bought compliance with command. Marx treats them as one wrong (exploitation), but the case suggests the experience of domination is the primary friction point, while extraction is acceptable if priced sufficiently. The theory identifies the mechanism but underestimates the distinct salience of autonomy loss.

