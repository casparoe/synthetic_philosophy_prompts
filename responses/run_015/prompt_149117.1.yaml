      *   **Goal:** Use the case for argumentative work, not decoration. Run the case in two directions:
          1.  *Mapping:* Apply Marxian categories to Ford's facts (formal/real subsumption, absolute/relative surplus value, value of labour power, reserve army, alienation). Predict outcomes (queues, turnover collapse).
          2.  *Return:* What the case does to the theory (three specific cruxes).
      *   **Three Cruxes:**
          1.  Extraction vs. Command complaints. Did Ford raise pay and deepen command? Does Marx treat these as one or two wrongs? Does the case suggest command is the real sting?
          2.  Alienation (structural vs. experienced). Workers queued for alienated jobs. Anomaly, confirmation, or theory failure? Worker-as-consumer point (buying the Model T) vs. alienation from product. Relation to the "house vs. palace" remark.
          3.  Exploitation verdict (1912 vs. 1914). Wages doubled, output multiplied. Can Marx deliver a determinate verdict on exploitation levels? Does it depend on a numeraire choice the theory doesn't settle?
      *   **Constraints:** ~800 words. Spend space on mapping rather than summary. Do not restate narrative or theory. Mark where theory is silent.

  2.  **Drafting - Section 1: Mapping (Marxian Categories to Fordian Facts):**
      *   *Formal vs. Real Subsumption:* Ford represents the shift to *real subsumption*. Capital doesn't just buy labour power (formal); it revolutionizes the labour process itself (assembly line). The technology dictates the pace, not the worker.
      *   *Absolute vs. Relative Surplus Value:* The move is clearly toward *relative surplus value*. By slashing necessary labour time via productivity gains (assembly line), surplus labour time expands relative to necessary time, even if the working day shortens (8 hours).
      *   *Value of Labour Power:* The $5 day exceeds the value of labour power (historical/moral element). Marx acknowledges this element; Ford manipulates it. The wage covers reproduction plus a margin to ensure stability.
      *   *Reserve Army:* The queues demonstrate the *industrial reserve army*. High unemployment outside creates desperation inside, allowing Ford to select disciplined workers.
      *   *Alienation:*
          *   From product: Worker makes a car they might buy, but don't own the process.
          *   From activity: Task fragmentation (real subsumption) makes work meaningless repetition.
          *   From species-being: Mechanical motion vs. creative potential.
          *   From man to man: Competition for jobs, Sociological Department policing.
      *   *Predictions:* High turnover/absenteeism initially (rejection of alienation/command). Wage hike + reserve army = queues + stability (coercion of economic necessity + incentive).

  3.  **Drafting - Section 2: The Return (Theory vs. Case):**
      *   *Crux 1: Extraction vs. Command.* Marx links them. Surplus value extraction *requires* command over the labour process (real subsumption). However, the case suggests workers tolerated extraction (unpaid labour) better than command (loss of autonomy). The $5 day compensated extraction but intensified command. Marx sees them as structurally identical (capital's logic), but phenomenologically distinct for the worker. The case suggests the "command complaint" is the primary driver of resistance (turnover), while extraction is tolerated if paid well.
      *   *Crux 2: Alienation (Structural vs. Experienced).* Workers queued for alienated jobs. This confirms alienation as *structural* (objective position) rather than *experienced* (subjective feeling). They knew the job was bad but needed the wage. Worker-as-consumer: Buying the Model T does not negate alienation from the *product* (ownership/control of production). It mitigates poverty, not alienation. The "house vs. palace" remark relates to social standing/value, not alienation from production. The theory holds: alienation is about the relation to production, not consumption capacity.
      *   *Crux 3: Exploitation Verdict (1912 vs. 1914).* Rate of surplus value ($s/v$). If wages ($v$) double but productivity (and thus surplus $s$) quadruples, exploitation rises. But if the value of labour power rises (historical/moral element), $v$ rises. Marx's theory allows a determinate verdict *if* we measure value in labour-time. If output per hour rises faster than wage value, exploitation increases. However, if we measure in use-values (cars bought), workers are better off. Marx prioritizes labour-time. So, theoretically, exploitation likely increased (relative surplus value), even if material conditions improved. The theory is silent on whether material improvement justifies increased exploitation; it merely identifies the mechanism.

  4.  **Refining and Editing (Word Count and Tone):**
      *   Need to be concise. Avoid summarizing the Ford story (prompt says facts are established).
      *   Focus on the *application* of categories.
      *   Ensure the three cruxes are addressed sharply.
      *   Check word count (target ~800).
      *   Tone: Academic, analytical, precise.

  5.  **Drafting - Step-by-Step:**

      *   *Intro:* Brief setup.
      *   *Mapping:*
          *   Real Subsumption: Assembly line = capital reshaping labour.
          *   Relative Surplus Value: Productivity gains reduce necessary labour time.
          *   Value of Labour Power: $5 day = historical/moral element manipulation.
          *   Reserve Army: Queues = external coercion.
          *   Alienation: Fragmentation = loss of species-being.
          *   Prediction: High turnover (rejection of command) -> Wage hike (buying compliance) + Reserve Army (fear) = Stability.
      *   *Return/Crux 1:* Extraction vs. Command. Marx conflates them structurally (command enables extraction). Case separates them phenomenologically. Workers traded autonomy for wages. Marx's apparatus treats them as one logic, but the case suggests the *experience* of command is the friction point.
      *   *Return/Crux 2:* Alienation. Structural vs. Experienced. Queues confirm structural alienation persists despite subjective desire for the job. Consumption (buying T) is irrelevant to production alienation. "House vs. Palace" is about relative value, not alienation from activity. Theory holds: alienation is ontological, not psychological.
      *   *Return/Crux 3:* Exploitation Verdict. Rate of surplus value. Productivity up > Wages up = Higher exploitation rate. Marx measures in labour time, not use values. Theory delivers verdict: exploitation increased. But theory is silent on whether this is "worse" if living standards rise. It identifies the relation, not the welfare judgment.

  6.  **Review against Constraints:**
      *   ~800 words.
      *   No narrative summary.
      *   Address specific categories.
      *   Address three cruxes.
      *   Mark silence.

  7.  **Writing - First Pass (Mental or Scratchpad):**
      *   Start with mapping. Real subsumption is key. The line dictates pace. Relative surplus value because productivity jumps. Value of labour power includes the moral element—Ford sets a new standard. Reserve army explains the queues. Alienation dimensions: activity (repetitive), product (owned by Ford), species (machine-like), others (competition/policing).
      *   Crux 1: Marx sees command as means to extraction. Ford shows workers accept extraction if command is paid well. Theory treats as one; case suggests distinct pains.
      *   Crux 2: Alienation is objective. Workers want the job despite alienation. Consumption doesn't fix production alienation. Theory holds.
