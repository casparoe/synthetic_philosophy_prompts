      *(Self-Correction on Crux 3)*: Be careful. If wages double and productivity quadruples, the *rate* of exploitation rises. But the *mass* of wages rises. Marx's verdict on "exploitation" is technical (rate of surplus value), not necessarily moral welfare. I need to highlight where the theory is silent on the welfare implication.

