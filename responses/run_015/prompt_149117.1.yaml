  Second, alienation as structural property versus experienced harm. Workers queued for jobs that are paradigms of alienated labour. This confirms alienation as an objective structural relation rather than a subjective feeling of dissatisfaction. One can be alienated and content, provided reproduction is secured. The worker-as-consumer point—buying the Model T—does not mitigate alienation from the product on Marx's terms. Alienation from the product concerns ownership and control over the objectification of labour, not the ability to consume it. Whether the worker drives a T is irrelevant to the fact that the car confronts him as alien power during production. The "house vs. palace" remark concerns relative social value and needs, not the production relation. The theory sustains the distinction: alienation is ontological, not psychological.

