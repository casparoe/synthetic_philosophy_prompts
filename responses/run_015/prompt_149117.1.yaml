      Third, the verdict on exploitation. In 1914, wages doubled, but output per worker multiplied more. In Marxian terms, the rate of surplus value ($s/v$) likely increased because productivity gains (relative surplus value) outpaced the increase in the value of labour power. Thus, workers were more exploited in 1914 than 1912, technically speaking. However, this verdict depends on the numeraire. Measured in labour-time, exploitation rose; measured in use-values (cars purchasable), workers gained. Marx's theory delivers a determinate verdict on the *relation* (exploitation increased) but remains silent on the *welfare implication*. It does not prescribe whether increased material consumption justifies intensified exploitation. The theory identifies the extraction mechanism but forces the critic to choose whether the rate of surplus value or the mass of use-values constitutes the metric of injustice.

