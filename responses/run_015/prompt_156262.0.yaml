answer: |-
  You have identified a genuine and under-theorized friction point in contemporary axiology and rationalist ethics. While there is no single, canonical term for this specific *selective* toggle, it sits at the intersection of three established literatures: **value theory (organic unities)**, **decision theory (separability axioms)**, and **moral psychology (motivated reasoning)**.

  The phenomenon you are describing is best understood as a violation of the **Separability Condition** in welfare aggregation, applied inconsistently to protect specific intuitions about meaning.

  Below is the mapping of the nearest existing concepts, followed by the coined term and "carving" you requested to precisely bound the phenomenon.

  ### 1. The Nearest Existing Concepts (and Why They Fall Short)

  **A. Organic Unities (G.E. Moore)**
  *   **The Concept:** The value of a whole is not necessarily the sum of the values of its parts. A world containing both consciousness and beauty might have more value than the sum of "consciousness" + "beauty" evaluated separately.
  *   **The Fit:** This explains the *holistic* side of the toggle (grief + love ≠ grief + love).
  *   **The Gap:** Moorean organic unity is typically a universal claim about value structure. It does not account for the *toggle*. If value is organic, it should be organic for the Experience Machine too. Using organic unity to defend "meaningful suffering" but atomistic summation to reject the Experience Machine is theoretically unstable unless a meta-rule explains the switch.

  **B. The Separability Axiom (Decision Theory/Economics)**
  *   **The Concept:** In standard utility theory, the value of an outcome in one state of the world should be independent of outcomes in other states, or parts of a whole should be evaluable independently of the whole (additive separability).
  *   **The Fit:** Your observation is precisely that interlocutors violate **Separability** when it suits them (suffering cannot be separated from the achievement) but enforce it when it suits them (pleasure can be separated from reality in the Experience Machine).
  *   **The Gap:** Decision theory labels this "inconsistency" or "dynamic inconsistency," but it lacks the normative vocabulary to describe *why* it happens in ethical debates (i.e., to protect "meaning" from "suffering calculus").

  **C. Narrative Identity (Schechtman, Velleman)**
  *   **The Concept:** Well-being is determined by the coherence of a life story, not just moment-to-moment experiences.
  *   **The Fit:** This justifies the holistic view (struggle is a plot point).
  *   **The Gap:** Narrative theorists usually apply their framework consistently. The puzzle you note is when *non*-narrative theorists (e.g., preference utilitarians) adopt narrative holism *only* to defend suffering, then revert to preference-satisfaction calculus elsewhere.

  ### 2. The Coinage: "Motivated Non-Separability"

  Since no existing term captures the *selective* nature of this move, I propose the term **Motivated Non-Separability (MNS)**.

  Alternatively, for the specific rhetorical move regarding suffering, I propose **The Constitutive Exemption**.

  **Definition:** **Motivated Non-Separability** is the argumentative practice of treating welfare components as **non-separable** (holistic/constitutive) when their separation would diminish a valued "Higher Good" (e.g., meaning, authenticity, love), but treating them as **separable** (atomistic/additive) when their aggregation would diminish a valued "Lower Good" (e.g., pleasure, preference satisfaction, autonomy) or when comparing against a counterfactual like the Experience Machine.

  ### 3. The Carving: Boundary Conditions

  To distinguish **Motivated Non-Separability** from legitimate methodological pluralism or ordinary context-sensitivity, we must carve the concept along three axes: **Ontological Claim**, **Evaluative Frame**, and **Meta-Consistency**.

  #### A. The Ontological Claim (The "Constitutive" Test)
  *   **Legitimate Holism:** The agent argues that $S$ (suffering) is ontologically constitutive of $G$ (good). $G$ cannot exist without $S$. Therefore, evaluating $G - S$ is evaluating a non-existent entity.
  *   **MNS (The Toggle):** The agent argues $S$ is constitutive of $G$ in Context A (e.g., "The artist's struggle is part of the art"), but treats $S$ as an independent cost in Context B (e.g., "We should reduce the artist's depression via medication").
  *   **Boundary:** If the agent cannot specify *why* the constitution holds in A but not B, it is MNS.

  #### B. The Evaluative Frame (The "Aggregation" Test)
  *   **Legitimate Pluralism:** The agent adopts a **Meta-Rule**. Example: "Use Holism for *Biographical Evaluation* (looking back on a life) and Atomism for *Policy Decisions* (minimizing future pain)."
  *   **MNS (The Toggle):** The frame switches *within* the same evaluative domain to block an unwanted conclusion.
      *   *Example:* "We can't put this caregiver in the Experience Machine (Atomism: real connection > simulated pleasure), BUT we shouldn't count their grief as a net negative against the relationship (Holism: grief is part of love)."
      *   *The Contradiction:* In the first clause, reality is privileged over experience (implying separability of state and feeling). In the second, feeling is privileged over state (implying inseparability of pain and love).

  #### C. The Direction of Fit (The "Protection" Test)
  *   **Legitimate Theory:** The theory dictates the conclusion.
  *   **MNS (The Toggle):** The intuition dictates the theory.
      *   **Condition:** The switch to Holism occurs *only* when suffering is attached to a "Sacred Value" (Love, Art, Truth).
      *   **Condition:** The switch to Atomism occurs *only* when suffering is "Gratuitous" or when comparing against a "Hollow Pleasure."
      *   **Boundary:** If the agent cannot identify a principle that distinguishes "Sacred" suffering from "Gratuitous" suffering *without* referencing their own intuition about whether the suffering should be counted, it is MNS.

  ### 4. Diagnosis: Legitimate Pluralism or Special Pleading?

  Is **Motivated Non-Separability** a failure mode?

  **It is a Failure Mode (Special Pleading) if:**
  The interlocutor claims to hold a unified theory of well-being (e.g., "I am a Hedonist" or "I am a Preference Utilitarian") but invokes Organic Unity solely to escape the repugnant implications of their theory regarding suffering. This is **theoretical smuggling**. They want the mathematical precision of utilitarianism when it favors them, and the nuanced vagueness of virtue ethics when it does not.

  **It is Legitimate Methodological Pluralism if:**
  The interlocutor explicitly adopts a **Dual-Aspect Theory**. For example:
  1.  **First-Person/Retrospective:** Lives are evaluated narratively (Holism). Suffering is part of the plot.
  2.  **Third-Person/Prospective:** Policies are evaluated consequentially (Atomism). Suffering is a cost to be minimized.
  *Crucial Caveat:* Even here, they must address the conflict. If a policy (Atomistic) destroys the possibility of the narrative (Holistic), they need a tie-breaking rule. If they don't have one, and just switch frames to win the immediate point, it reverts to MNS.

  ### 5. Summary for Deployment

  When you encounter this architecture in the wild, you can categorize it as follows:

  1.  **Identify the Violation:** "You are treating suffering as **separable** from the good when comparing the Experience Machine, but **non-separable** when evaluating the caregiver. This violates the **Separability Condition**."
  2.  **Demand the Meta-Rule:** "Is your theory of value consistently holistic or consistently atomistic? If it is pluralistic, what is the **meta-principle** that dictates which frame applies here? Is it based on the *type* of good, the *temporal perspective*, or the *agency* involved?"
  3.  **Name the Move:** "This looks like **Motivated Non-Separability**. You are invoking organic unity to shield the suffering from the calculus, but dropping organic unity when the calculus favors reality over simulation."

  This carving allows you to distinguish between a sophisticated pluralist (who has a rule for the switch) and an inconsistent intuitor (who switches to protect the conclusion). The latter is the dominant pattern in the spaces you are observing.

  **Proposed Term:** **Motivated Non-Separability** (for the logical structure) or **The Constitutive Exemption** (for the rhetorical move). I recommend using **Motivated Non-Separability** in debate as it anchors the critique in decision theory, making it harder to dismiss as mere semantic quibbling.
