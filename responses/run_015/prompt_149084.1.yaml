      *   *Is the high school level appropriate?* Yes, but don't dumb it down too much. They are reading Hegel; they can handle "mediation" and "negation."
      *   *Textual citations:* Since page numbers vary (Miller vs. Findlay vs. German), refer to paragraph numbers or section descriptions. (Miller translation is standard for English students).

