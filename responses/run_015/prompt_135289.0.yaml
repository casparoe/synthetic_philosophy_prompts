answer: |-
  This is one of the most famous and contentious cruxes in the study of the *Mingjia* (School of Names). Your struggle is well-founded: Western logical categories do not map perfectly onto Gongsun Long's semantic intuitions, and the text deliberately exploits the ambiguity of the copula "is" (or rather, the negation *fei* 非).

  To answer your core question directly: The dialogue is asserting a relation of **semantic non-identity based on intensional difference**. While the **determinable-determinate** reading captures the conceptual structure best, Gongsun Long uses it to argue for **distinctness of reference** rather than class inclusion. The **mereological** reading is less accurate because Gongsun Long is not arguing about physical parts, but about the criteria for applying a name.

  Here is a detailed breakdown to help you navigate this for your course.

  ### 1. The Determinable-Determinate Reading
  You suggested that "horse" functions as a determinable (genus) and "white horse" as a determinate (species).
  *   **Why it fits:** Structurally, this is correct. "Horse" names the form (*xing*), while "White" names the color (*se*). "White Horse" combines them. In modern logic, a determinate falls under a determinable (all white horses are horses).
  *   **Why it fails for Gongsun Long:** Gongsun Long's conclusion is "White Horse is *not* Horse" (*Bai ma fei ma*). If he accepted the standard determinable-determinate relation, he would have to admit that the determinate is a subset of the determinable. He explicitly rejects this subsumption.
  *   **The Mingjia Twist:** Gongsun Long is not denying that a white horse is an animal of the equine species. He is denying that the **name** "White Horse" is identical to the **name** "Horse." He argues that because the *conditions for application* differ (one accepts black horses, the other does not), the terms refer to different conceptual objects.

  ### 2. The Mereological Reading
  You suggested this might be a claim that adding whiteness changes the kind-membership of the whole.
  *   **Why it fits:** Gongsun Long treats "White" and "Horse" as separate entities that are combined. He argues that "White" is not "Horse," and "Horse" is not "White," so the combination is a third thing.
  *   **Why it fails:** Mereology usually implies that the whole contains the parts. If "White Horse" is a whole containing "Horse" as a part, saying "White Horse is not Horse" sounds like saying "A car is not an engine." While true, it misses the point. Gongsun Long isn't talking about physical composition; he is talking about **conceptual composition**.
  *   **The Mingjia Twist:** The argument is not that the animal changes physically, but that the **concept** changes. The "whole" here is the *meaning* of the term, not the animal itself.

  ### 3. The Preferred Reading: Intensional Logic and Semantic Identity
  Most contemporary scholars of Chinese logic (such as A.C. Graham and Chad Hansen) argue that the *White Horse Dialogue* is best read as an argument about **extension and intension**.

  *   **Extension (The set of things):** The extension of "Horse" includes yellow, black, and white horses. The extension of "White Horse" includes only white horses. Since the extensions are not identical, the terms are not identical.
  *   **Intension (The concept/requirements):** The intension of "Horse" requires only shape/form. The intension of "White Horse" requires shape + color.
  *   **The Meaning of *Fei* (非):** In Classical Chinese, *fei* does not always mean "is not a member of" (class exclusion). It often means "is not identical to" or "is not equivalent to."
      *   **Common Sense:** "White horse is [a member of the class] horse."
      *   **Gongsun Long:** "The concept 'White Horse' is [identical to] the concept 'Horse'." -> **False.**

  Therefore, the argumentative move you cited (asking for a horse vs. asking for a white horse) is an argument about **pragmatic reference**. If I ask for a horse, a black one satisfies the request. If I ask for a white horse, a black one does not. Since the satisfaction conditions differ, the requests (and thus the names) are not equivalent.

  ### 4. Connection to "Rectification of Names" (*Zhengming*)
  This is crucial for your course context. You noted your edition emphasizes "aligning language with reality."

  *   **Confucian *Zhengming*:** Usually social and moral. A "Father" must act like a Father. The name prescribes a duty.
  *   **Mingjia *Zhengming*:** Logical and semantic. A name must refer *precisely* to the actuality (*shi*) it designates, without slippage.

  For Gongsun Long, "Rectifying Names" means preventing the confusion that arises when we treat distinct concepts as identical. If we allow "White Horse = Horse," we lose the ability to distinguish specific requirements in language. If a ruler asks for "White Horses" for a ritual, and you send black ones because "a white horse is a horse," you have failed to align language with the specific reality requested.

  Therefore, the dialogue asserts that **precision in naming requires distinguishing compounds from simples.** To "rectify" the name "White Horse," we must acknowledge it is not interchangeable with "Horse," even if the object referred to is physically a horse.

  ### Summary for Your Argument
  If you are writing on this, I recommend framing it this way:

  1.  **Reject the Ontological Reading:** Gongsun Long is not making a claim about biology (that white horses aren't equines).
  2.  **Adopt the Semantic Reading:** He is making a claim about **reference and identity**. The relation is one of **non-identity of terms** due to **difference in intension**.
  3.  **Choose the Determinable Framework (with caveats):** The determinable-determinate distinction is the closest Western analog for the *structure* of the concepts, but you must clarify that Gongsun Long uses this structure to argue for **logical distinctness** rather than **class inclusion**.
  4.  **Link to *Zhengming*:** The point of the dialogue is to show that "Rectifying Names" requires maintaining strict boundaries between terms with different satisfaction conditions. To conflate "White Horse" with "Horse" is a failure of linguistic precision, which leads to errors in governance and reality.

  **Verdict:** The **determinable-determinate** reading is closer to the conceptual structure, but it must be modified to account for Gongsun Long's insistence on **non-identity**. The **mereological** reading is less helpful because it implies physical composition rather than semantic compounding. The core assertion is that **names are defined by their criteria of application, and different criteria constitute different names.**
