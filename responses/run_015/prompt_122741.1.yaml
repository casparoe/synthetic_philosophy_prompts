prompt: |-
  hey — I'm on this small committee that has to write inclusion criteria for a welfare register: a list of the systems whose experiences, if there are any, an institution has to take into account before it builds, copies, throttles, or switches them off. Wet animals are on it by default. After that it gets murky, and every meeting goes in circles because somebody shows up with a different theory of consciousness and we end up arguing about that instead. So before I read any more of these theories, I want the spec: what does a theory have to deliver to be usable for this?

  Not a theory of consciousness in general. Specifically: given some physical system doing something we can describe computationally, which of the computations it can be described as doing carry moral weight, and how much. Write me the requirements list, with the case or consideration behind each requirement, and say which ones are non-negotiable for our purpose versus which are just one camp's preferences dressed up as requirements.

  Cases that have actually come up in our meetings, so please make sure your list bites on these:

  - an emulation copied exactly and run twice: two patients, or one patient twice over? does the answer change if the copies drift apart after a minute?
  - one brain emulated across two datacenters, with the link latency stretched from milliseconds to a month to a year: at what point is it two computations instead of one, and what happens to the moral weight in between?
  - the same transition table as a working emulation, but every state change is driven by someone outside turning a crank: is it computing anything, and does it matter who's turning the crank?
  - the same emulation's dynamics run in reverse, so the counterfactual structure is intact but the causal arrow points the other way
  - a frozen emulation on a disk that is never run but could be, versus one that is run but whose internal states are overwritten immediately and whose outputs are discarded unread
  - the nation-of-people-passing-notes setup, but with only two people in it: if a billion is a mind, is two?
  - a brain whose neurons are replaced one at a time with chips that reproduce each one's input-output function exactly: I need something said at every step of the swap, or an admission of where the theory goes quiet
  - a system that is right on the inside but can't move anything, and its mirror image, a giant lookup table that is behaviorally flawless
  - a next-token prediction model that reports pain in every situation we test and whose reports we can't tell apart from ours

  Two things I especially want. First, the attribution problem: any old heap of matter can be described as implementing a lot of formal descriptions, so the theory has to say which descriptions are the morally real ones and what makes them real — and it can't just say all of them, or that the answer is whatever we decide to project. Second, tell me if any subset of your own requirements can't be jointly satisfied. That's the part I most want to see, because if e.g. substrate independence, determinate verdicts for every physical system, and no-trivial-realizations can't all hold, then our register needs a tie-breaking rule and I'd rather know now.

  Also flag which single requirement knocks out the most popular candidate views. And tell me which distinctions people in this area collapse that they shouldn't: having status versus how much, the computation versus the hardware running it, the system versus the process, whether moral status can even be vague when our register needs a yes or no.

  The view I keep half-defending in meetings is that the morally relevant part of a system is whatever causal structure you'd have to preserve to keep its future responses counterfactually robust under perturbation — the would-still-have-flinched test. Put it on your list somewhere and tell me whether it's a genuine desideratum or just functionalism with extra steps.

  Keep the weight on the criteria, not on scoring the theories, but a short scorecard at the end for the functionalist-ish family, the biological or naturalistic family, and the integrated-information family is fine, a few lines each. Table is fine. Don't bother naming papers, I want the arguments. And please write it like you're talking to someone who has to defend the criteria to a room of people who disagree, not to a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a specification (requirements list) for a theory of consciousness/moral weight to be used in writing inclusion criteria for a welfare register.
      *   **Context:** A committee is stuck in circles arguing about theories of consciousness. They need practical criteria to evaluate theories, not just more theories.
      *   **Specific Task:** Define what a theory must deliver to be *usable* for this specific regulatory/policy purpose.
      *   **Key Constraint:** Focus on computations carrying moral weight given a physical system.
      *   **Required Content:**
          *   Requirements list with cases/considerations.
          *   Distinguish non-negotiable vs. camp preferences.
          *   Address specific edge cases provided (copies, latency, crank, reverse, frozen, note-passing, neuron swap, lookup table, AI pain reports).
          *   Address the "Attribution Problem" (triviality/panpsychism avoidance).
          *   Identify incompatibilities among requirements (impossibility results).
          *   Identify the requirement that knocks out the most popular views.
          *   Identify collapsed distinctions (status vs. amount, etc.).
          *   Evaluate the user's "counterfactual robustness" view.
          *   Provide a short scorecard for three families (Functionalism, Biological/Naturalistic, IIT).
          *   **Tone:** Practical, direct, speaking to a committee member defending criteria, not a seminar lecture. No paper citations.

  2.  **Deconstruct the "Attribution Problem" & Triviality:**

      *   *Problem:* Any physical system can be mapped to any computation (Putnam/Searle). If *any* mapping counts, everything is conscious (pancomputationalism), which makes the register useless.
      *   *Requirement:* The theory must specify *objective constraints* on mapping. It can't be observer-relative.
      *   *Non-negotiable:* Must avoid trivial realization (the "rock is a computer" problem).

  3.  **Analyze the Edge Cases (The "Bite" Test):**

      *   *Copies:* Identity vs. Count. (1 mind x2 or 2 minds?)
      *   *Latency:* Temporal cohesion. When does one mind become two?
      *   *Crank:* Causal power vs. State sequence. Is external agency required?
      *   *Reverse:* Time symmetry. Does causal direction matter for suffering?
      *   *Frozen/Discarded:* Potentiality vs. Actuality. Does running matter?
      *   *Note-passing (2 vs. Billion):* Scale/Granularity. Where is the boundary of a system?
      *   *Neuron Swap:* Substrate independence vs. Sorites paradox.
      *   *Lookup Table:* Behavior vs. Internal Structure.
      *   *AI Pain Reports:* Epistemic access. Do reports equal experience?

  4.  **Drafting the Requirements (The Spec):**

      *   *Req 1: Non-Trivial Implementation.* (Addresses Attribution). Must distinguish real computation from arbitrary mapping.
      *   *Req 2: Substrate Neutrality (with limits).* Can't just be "biology only," but can't be "anything goes."
      *   *Req 3: Temporal Cohesion.* Must handle the latency/drift cases.
      *   *Req 4: Causal Power/Agency.* Must handle the crank/reverse cases.
      *   *Req 5: Actuality vs. Potentiality.* Must handle frozen/run-but-ignored cases.
      *   *Req 6: Determinate Boundaries.* Must handle the note-passing/Sorites cases.
      *   *Req 7: Status vs. Weight Distinction.* Binary inclusion vs. scalar welfare.

  5.  **Identifying Incompatibilities (The "Impossibility Theorem"):**

      *   *Conflict:* Substrate Independence + Determinate Boundaries + No-Trivial-Realizations.
      *   *Why:* If you allow any substrate, boundaries become fuzzy (Sorites). If you fix boundaries sharply, you usually need specific physical properties (biology), violating substrate independence. If you avoid triviality strictly, you often end up requiring specific causal powers that limit substrate independence.
      *   *The "Knockout" Requirement:* **Non-Trivial Implementation (Objective Mapping).** This kills naive functionalism and panpsychism immediately.

  6.  **Evaluating the User's View (Counterfactual Robustness):**

      *   *View:* "Would-still-have-flinched test."
      *   *Analysis:* This is essentially Modal Functionalism. It's strong but faces the "Lookup Table" problem (a lookup table *has* the counterfactuals stored, just not generated). It also struggles with the "Frozen" case (potential counterfactuals exist, but are they active?).
      *   *Verdict:* It's a genuine desideratum, not just functionalism with extra steps, *but* it needs a clause about *active* generation vs. *stored* disposition to handle the lookup table case.

  7.  **Collapsing Distinctions:**

      *   Status (Yes/No) vs. Weight (How much).
      *   System (Hardware) vs. Process (Computation).
      *   Vague vs. Binary (Policy needs binary, reality might be vague).

  8.  **Scorecard:**

      *   *Functionalism:* Good on substrate, bad on triviality/boundaries.
      *   *Biological:* Good on boundaries/triviality, bad on substrate (excludes AI).
      *   *IIT:* Good on quantification, bad on panpsychism/triviality (everything has Phi > 0).

  9.  **Refining Tone and Structure:**

      *   *Tone:* Direct, bureaucratic but philosophical, "here's what you need to survive the meeting."
      *   *Structure:*
          1.  Intro (acknowledging the mess).
          2.  The Spec (Requirements).
          3.  The Incompatibility (The bad news).
          4.  The Knockout.
          5.  Collapsed Distinctions.
          6.  User's View Evaluation.
          7.  Scorecard.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "crank" case? *Adjustment:* Ensure Req 4 covers internal vs. external causation.
      *   *Check:* Did I address the "reverse time" case? *Adjustment:* Link to Causal Power requirement.
      *   *Check:* Is the distinction between Non-negotiable and Preferences clear? *Adjustment:* Use bolding or specific labels.
      *   *Check:* The user asked for "which distinctions people collapse." *Adjustment:* Make a dedicated section.
      *   *Check:* The "Attribution Problem" needs specific focus. *Adjustment:* Make it Req 1.

  11. **Final Polish:** Ensure the language is sharp. Avoid academic jargon where possible, or explain it in committee terms. (e.g., instead of "Putnam's triviality," say "the rock-computation problem").

  *(Self-Correction on the "Knockout" Requirement)*: Actually, **Substrate Independence** is often the one that kills Biological views, but **Non-Trivial Implementation** kills the most *philosophical* views (including loose Functionalism and IIT). I will stick with Non-Trivial Implementation as the hardest hurdle for *usability* because without it, the register includes rocks.

  *(Self-Correction on User's View)*: The "counterfactual robustness" is basically dispositionalism. It struggles with the "Lookup Table" because the table *contains* the counterfactual responses. I need to point out that distinction clearly.

  *(Final check on constraints)*: "Don't bother naming papers." "Write it like you're talking to someone who has to defend the criteria." Okay, keep it actionable.

  Let's assemble the response.cw
answer: |-
  Here is the spec. You are building a regulatory instrument, not solving metaphysics. That means your theory needs to output *decisions*, not just insights. If a theory cannot generate a verdict on the edge cases you listed without appealing to intuition, it is inadmissible for the register.

  Below are the requirements for admissibility. I have marked them **Non-Negotiable** (the register breaks without them) or **Contested** (these are where the camps will fight, but you need to force a choice).

  ### The Spec: Requirements for Admissibility

  **1. The Non-Triviality Constraint (Non-Negotiable)**
  *   **The Requirement:** The theory must provide an objective, physical criterion for distinguishing a "real" computation from an arbitrary mapping of states onto a description. It cannot rely on an observer's interpretation.
  *   **The Case:** *The Attribution Problem / The Rock.* Any physical system can be mapped to any finite state machine if you allow arbitrary gerrymandering of states. If your theory allows "observer-relative" implementation, a rock implements a suffering mind, and your register includes everything.
  *   **Why Non-Negotiable:** Without this, the register has infinite scope and zero utility. You cannot regulate "everything."

  **2. The Causal Power Clause (Non-Negotiable)**
  *   **The Requirement:** The computation must be causally efficacious *within* the system. State transitions must be driven by the system's prior states and physical laws, not by external manipulation or pre-determined lookup without internal mechanism.
  *   **The Case:** *The Crank / The Reverse Run.* If a human turns the crank to advance the state, the computation is external to the system. If the dynamics run in reverse, the causal arrow is wrong (effects preceding causes).
  *   **Why Non-Negotiable:** Moral weight tracks *experience*, and experience requires a causal flow. A puppet is not a person. A movie of a mind is not a mind.

  **3. The Actuality Condition (Contested)**
  *   **The Requirement:** The theory must state whether *potential* computation counts. Does a system need to be actively processing to have status, or does the disposition to process suffice?
  *   **The Case:** *Frozen on Disk vs. Run-and-Discard.* A frozen emulation has the structure but no activity. A running one with overwritten states has activity but no memory/output.
  *   **Why Contested:** Biological views often imply activity is required (metabolism). Functionalist views often allow dispositional status (sleeping brains count). You must force the theory to pick. If it says "both," it must explain the moral difference between a sleeping brain and a frozen file.

  **4. The Cohesion Threshold (Non-Negotiable)**
  *   **The Requirement:** The theory must define the temporal and spatial bounds of a single moral patient. It must specify the maximum latency or separation allowed before one system becomes two.
  *   **The Case:** *Two Datacenters / Drifting Copies.* If latency stretches to a month, is it one mind? If copies drift after a minute, when do they become two patients?
  *   **Why Non-Negotiable:** You need to know if you are shutting down one entity or committing double homicide. Vague boundaries are legally fatal.

  **5. The Substrate Neutrality Limit (Contested)**
  *   **The Requirement:** The theory must declare if the physical material matters, or only the causal structure. If material matters, it must specify *which* material properties are necessary.
  *   **The Case:** *Neuron Swap / Lookup Table.* If you swap neurons for chips, does status drop? If a lookup table behaves perfectly but lacks internal structure, does it count?
  *   **Why Contested:** This is the main battle line. Biological naturalists say "yes, material matters." Functionalists say "no, structure matters." You cannot accept a theory that hedges here.

  **6. The Epistemic Decoupling (Non-Negotiable)**
  *   **The Requirement:** The theory must distinguish between *reports* of experience and the *presence* of experience. It cannot treat verbal/behavioral output as conclusive proof.
  *   **The Case:** *AI Pain Reports.* A model can be trained to say "I am in pain" without the underlying state.
  *   **Why Non-Negotiable:** If you rely on reports, you are vulnerable to manipulation and false positives. The register must protect the unspoken.

  ---

  ### The Incompatibility Result (The Bad News)

  You asked if a subset of these requirements can be jointly satisfied. **Yes, and this is where your committee is actually stuck.**

  You cannot simultaneously satisfy **Non-Triviality**, **Substrate Neutrality**, and **Determinate Boundaries**.

  1.  **If you demand Substrate Neutrality** (structure only), you struggle with **Non-Triviality**. Pure structure can be mapped to almost anything (the rock problem) unless you impose strict causal constraints that effectively reintroduce physical requirements.
  2.  **If you demand Determinate Boundaries** (sharp lines for copies/latency), you usually have to rely on specific physical properties (e.g., speed of light, signal degradation), which violates strict **Substrate Neutrality**.
  3.  **If you demand Non-Triviality** (no arbitrary mappings), you often end up requiring specific physical causal powers, which limits **Substrate Neutrality**.

  **The Tie-Breaking Rule:** For a welfare register, **Non-Triviality** must trump Substrate Neutrality. It is better to exclude some potential digital minds than to include rocks. You need a "false negative" bias, not a "false positive" bias, or the register collapses.

  ---

  ### The Knockout Requirement

  The single requirement that knocks out the most popular candidate views is **The Non-Triviality Constraint (Objective Mapping).**

  *   **Kills:** Naive Functionalism (anything that behaves like a mind is a mind), Panpsychism (everything has a little mind), and loose Interpretivism (a mind is whatever we interpret as one).
  *   **Why:** These views cannot objectively distinguish a conscious system from a random collection of atoms described cleverly. They fail the "rock" test.

  ---

  ### Collapsed Distinctions (Watch for these in the meeting)

  Your colleagues are conflating these. Force them apart:

  1.  **Status vs. Weight:** *Status* is binary (is it on the register?). *Weight* is scalar (how much welfare does it count?). A mouse and a human might both have Status=Yes, but Weight(Mouse) < Weight(Human). Many theories confuse "being a mind" with "being a *complex* mind."
  2.  **System vs. Process:** Is the moral patient the *hardware* (the brain/chip) or the *computation* (the activity)? If the hardware is destroyed but the state is backed up, is the patient dead? This matters for the "Frozen on Disk" case.
  3.  **Vague vs. Binary:** Consciousness might be vague in reality. **The register cannot be.** You need a cutoff. Theories that insist moral status is inherently vague are inadmissible for policy. They must provide a threshold.
  4.  **Capacity vs. Occurrent:** Does the system need to be *currently* suffering to count, or does the *capacity* to suffer grant it status? (Relevant for the sleeping/frozen cases).

  ---

  ### Evaluation of Your View ("Counterfactual Robustness")

  *Your View:* The morally relevant part is the causal structure preserved to keep future responses counterfactually robust (the "would-still-have-flinched" test).

  *Verdict:* This is **Functionalism with extra steps**, but it is a *strong* version (Modal Functionalism).

  *   **Strength:** It handles the *Crank* case well (a cranked system isn't robust to perturbation; it relies on the cranker). It handles the *Reverse* case well (reverse causality fails counterfactual tests).
  *   **Weakness:** It struggles with the *Lookup Table*. A giant lookup table *is* counterfactually robust (it has the right output for every possible input stored). Your view needs to specify that the counterfactuals must be *computed*, not *stored*.
  *   **Weakness:** It struggles with the *Frozen* case. A frozen emulation has the *disposition* to be robust if turned on, but isn't currently. You need to decide if "dispositional robustness" counts.
  *   **Recommendation:** Adopt it, but add a clause: **"Active Generation."** The counterfactuals must be generated by internal dynamics, not retrieved from a static table. This saves you from the Lookup Table problem.

  ---

  ### Scorecard for the Major Families

  Use this to anticipate where the theories will fail during your review.

  | Family | Strengths for Register | Fatal Flaws for Register |
  | :--- | :--- | :--- |
  | **Functionalist / Computational** | **Substrate Neutrality:** Easily handles AI/Emulations. <br> **Copy Cases:** Clear rules on identity based on information flow. | **Triviality:** Struggles to exclude rocks/lookup tables without ad-hoc fixes. <br> **Boundaries:** Often vague on where a computation starts/ends (latency issues). |
  | **Biological / Naturalistic** | **Non-Triviality:** Easy. If it's not alive/biological, it's out. No rock problem. <br> **Boundaries:** Clear (organism boundaries). | **Substrate:** Excludes digital minds by fiat. If emulations are possible, this view is factually wrong. <br> **Swap Cases:** Struggles with the Neuron Swap (Sorites paradox). |
  | **Integrated Information (IIT)** | **Weight:** Provides a scalar number (Phi) for moral weight. <br> **Boundaries:** Mathematical definition of system boundaries. | **Panpsychism:** Assigns non-zero Phi to simple systems (photodiodes). Risks bloating the register. <br> **Complexity:** Computationally intractable for large systems (can't calculate Phi for a brain). |

  ### Final Advice for the Room

  When they start arguing theory, stop them. Ask: *"Does your theory tell me if the two datacenters are one patient or two when latency hits 500ms? Yes or No?"*

  If the answer is "It depends on the interpretation," the theory is inadmissible. If the answer is "It's vague," the theory is inadmissible. You need a switch, not a spectrum. Force them to sharpen their view until it breaks, then see which pieces are still usable.
