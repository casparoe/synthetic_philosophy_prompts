answer: |-
  Here is a conceptual specification for a decision procedure under moral uncertainty. This maps the desiderata, structural constraints, and known impossibility results without committing to a specific framework or citing literature.

  ### I. Core Functional Requirements
  These are the non-negotiables. If a procedure fails these, it ceases to function as a decision guide.

  **1. Action Guidance (Determinacy)**
  The procedure must output a actionable recommendation (e.g., "Do A," "Do B," or "Indifferent") for any given input of credences and first-order theories. It cannot default to "paralysis" or "suspension of judgment" simply because the first-order theories disagree.
  *   *Constraint:* It must handle cases where Theory A says "Obligatory" and Theory B says "Forbidden."

  **2. Credence Sensitivity (Monotonicity)**
  If your credence in Theory A increases (and all else remains equal), the recommendation should not shift *away* from what Theory A recommends.
  *   *The Polarization Worry:* The procedure must avoid the "reverse problem" where increased uncertainty leads to more extreme recommendations. For example, if you are 50/50 between two moderate views, the output should not be more radical than if you were 90/10. The aggregation function must be stable across credence distributions.

  **3. Separation of Orders (Fact vs. Value)**
  The procedure must distinguish between *factual uncertainty* (e.g., "Will this action cause harm?") and *normative uncertainty* (e.g., "Does harm matter?").
  *   *Requirement:* Factual uncertainty is handled via standard probability weighting within a theory. Normative uncertainty is handled by weighting the *theories themselves*. Collapsing these two (treating normative uncertainty as just another factual variable within a single theory) is a category error that distorts the aggregation.

  **4. Dominance Respect**
  If all theories in which you have non-zero credence agree that Action A is better than Action B, the procedure must recommend A.
  *   *Constraint:* You cannot override a unanimous first-order judgment based on the structure of the uncertainty itself.

  ---

  ### II. The Measurement and Scaling Problem
  This is the hardest technical hurdle. Different theories use different "currencies" of value.

  **5. Scale Invariance (Normalization)**
  The procedure must not favor a theory simply because it uses larger numbers.
  *   *The Problem:* If Utilitarianism assigns values from 0 to 1,000,000 and Deontology assigns values from 0 to 1, a naive expected value calculation will always follow Utilitarianism, regardless of your credence.
  *   *Desideratum:* The procedure must normalize the "choiceworthiness" functions of each theory so that the *spread* or *range* of values is comparable before weighting by credence.

  **6. Handling Lexical/Infinite Values**
  The procedure must specify how to handle theories that posit lexicographic priorities (e.g., "Rights violations are infinitely worse than any amount of utility gain").
  *   *The Collapse Worry:* If one theory assigns $-\infty$ to an action and another assigns $-100$, the expected value is $-\infty$ (assuming non-zero credence). This effectively gives any theory with infinite stakes a veto, regardless of how low your credence is.
  *   *Desideratum:* The procedure must either (a) ban infinite values from the input, (b) use a method of comparison that ignores magnitude beyond a certain threshold (ordinal rather than cardinal), or (c) accept that low-credence lexical theories create absolute constraints (the "Pascal's Mugging" of deontology).

  **7. Intertheoretic Comparisons**
  The procedure requires a stance on whether values are *intertheoretically comparable*.
  *   *Option A (Cardinal):* We can say "The badness of a rights violation in Theory D is equivalent to the loss of 1,000 utils in Theory U."
  *   *Option B (Ordinal):* We can only rank options within a theory, not across them.
  *   *Requirement:* If the procedure assumes Option A, it must explain the metaphysical basis for the conversion rate. If it assumes Option B, it must explain how it aggregates rankings without a common currency (e.g., Borda count methods).

  ---

  ### III. Structural Distinctions
  The spec must maintain these distinctions to avoid category errors.

  **8. Moral vs. Population Uncertainty**
  Uncertainty between Total and Average Utilitarianism should be treated distinctly from uncertainty between Utilitarianism and Deontology.
  *   *Reasoning:* Population ethics changes the *identity* and *number* of subjects. This introduces non-identity problems and variable population sizes, which break standard aggregation axioms.
  *   *Desideratum:* The procedure must handle "Existential Uncertainty" (who exists) separately from "Normative Uncertainty" (what matters to those who exist), or explicitly justify why they are mathematically identical.

  **9. Objective vs. Subjective Rightness**
  The procedure must clarify what it is outputting.
  *   *Objective:* What is actually right (which you might be wrong about).
  *   *Subjective:* What is rational to do given your uncertainty.
  *   *Requirement:* A decision procedure under uncertainty targets *Subjective Rightness* (rational choiceworthiness). It cannot claim to guarantee Objective Rightness.

  **10. Ideal vs. Non-Ideal Agents**
  The procedure must specify if it applies to agents with perfect logical reasoning or bounded rationality.
  *   *Constraint:* If the procedure requires calculating the expected choiceworthiness of every possible action across every held theory, it may be computationally impossible for humans. A "decency" spec might require *approximability*.

  ---

  ### IV. Trade-offs and Impossibility Results
  You cannot have everything. A honest spec must flag where desiderata conflict.

  **11. The "Moral Arrow's Theorem" Constraint**
  There is a known structural tension between the following three conditions. A procedure can likely only satisfy two:
  *   **Pareto Condition:** If all theories prefer A to B, the procedure prefers A to B.
  *   **Independence of Irrelevant Alternatives:** The ranking between A and B should depend only on how theories rank A and B, not on the presence of Option C.
  *   **Non-Dictatorship:** The procedure should not simply follow the theory with the highest credence regardless of the others.
  *   *Implication:* You must choose which axiom to drop. Most procedures drop Independence (allowing context to matter) or accept a form of Dictatorship (if credence is high enough, ignore the rest).

  **12. Risk Neutrality vs. Risk Sensitivity**
  *   *EA Preference:* The Effective Altruism crowd generally prefers *Risk Neutrality* across theories (Maximize Expected Choiceworthiness). They treat moral uncertainty like a bet.
  *   *General Ethics Preference:* Many non-EA ethicists argue for *Risk Aversion* regarding serious violations. (e.g., "Even if I'm only 10% sure murder is wrong, I shouldn't risk it for a gain").
  *   *Conflict:* A procedure cannot be both strictly expectation-maximizing and sensitive to the *severity* of potential errors in a non-linear way. You must choose between maximizing the "good" and minimizing the "worst-case moral scenario."

  **13. The "Fanaticism" Trade-off**
  If you accept unbounded value (e.g., infinite utility in some scenarios) and expectation maximization, you become vulnerable to "fanaticism" (accepting tiny probabilities of huge moral payoffs).
  *   *Requirement:* To avoid fanaticism, you must either cap values (violating Scale Invariance) or reject expectation maximization (violating Risk Neutrality).

  ---

  ### V. Summary of the "Spec" Checklist

  If you are evaluating a proposed decision procedure, check it against this list:

  1.  **Normalization:** Does it prevent theories with larger number-scales from dominating?
  2.  **Lexical Handling:** Does it explain how to weigh 1% credence in a "Rights are Absolute" theory against 99% in a "Costs Matter" theory?
  3.  **Incommensurability:** Does it claim to work when theories share no common value metric? (If yes, how? If no, does it admit silence?)
  4.  **Stability:** Does increased uncertainty lead to wilder swings in recommendation? (It shouldn't).
  5.  **Population Ethics:** Does it distinguish between uncertainty about *values* and uncertainty about *population axiology*?
  6.  **Impossibility Acknowledgement:** Does it admit which standard decision-theory axiom it is violating (e.g., Independence)?
  7.  **Risk Profile:** Is it explicitly risk-neutral (expectational) or does it build in moral risk-aversion?
  8.  **Computability:** Can a human actually use it, or does it require omniscience about the implications of each theory?

  ### VI. Where the Arguments Live
  When writing your paper, the philosophical "fighting" happens in these specific zones:

  *   **The Normalization Zone:** Arguments about whether "variance normalization" (scaling theories by how much they care) is fair or distorts the theories.
  *   **The Lexical Zone:** Arguments about whether a small credence in a deontological constraint should act as a veto (the "moral veto" problem).
  *   **The Metanormative Zone:** Arguments about whether the second-order procedure should itself be consequentialist (maximize expected value) or deontological (respect constraints on reasoning).
  *   **The Population Zone:** Arguments about whether "Total vs. Average" is a factual dispute about the good or a structural dispute that breaks the uncertainty framework.

  This spec gives you the boundaries. Any viable theory will have to explain which of these boxes it checks and which impossibility results it chooses to live with.
