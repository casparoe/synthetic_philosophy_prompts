  5.  **Drafting the Content (Iterative refinement):**

      *   *Normalization:* This is the big one. If Theory A uses a scale of 1-10 and Theory B uses 1-1,000,000, naive maximization picks B. We need *variance normalization* or *range normalization*. But Deontology often uses "forbidden/permissible" (binary or lexicographic). How to map that to a continuous scale? *Desideratum: Scale Invariance.*
      *   *Incommensurability:* If Theory A talks about "Rights" and Theory B talks about "Happiness," is there a common currency? If not, the procedure might need to be *pluralistic* or admit *indeterminacy*. *Desideratum: Handling Structural Differences.*
