      *   *My Favorite Theory (MFT):* Should the procedure respect the theory I think is most likely? (Dominance).
      *   *Proportionality:* If I'm 99% Utilitarian and 1% Kantian, should the decision look mostly Utilitarian?
      *   *Uncertainty Sensitivity:* If I become *more* uncertain, does the action change? (The polarization worry).
      *   *Fact vs. Value:* Distinguishing "I don't know if the box has money" vs. "I don't know if money matters."
