prompt: |-
  Can you act as a professional philosopher who specializes in ethics and population questions? Before you answer, please do a little brainstorming first and think step by step. So I was reading about the procreation asymetry — you know, how it's wrong to have a kid whose life will be miserable, but it's not wrong to skip having a kid even if thier life would be awesome. I think I mostly get it: the kid who never exists can't be sad about missing out on life. But here's where I'm stuck. If people who don't exist yet can't be harmed by being left out, then by actually creating a happy person I'm not harming anyone either, right? So shouldn't the asymetry actually push us to have tons of kids, since we're just adding happiness with no downside? A friend mentioned this "reverse asymmetry" thing about farm animals — like you'd be required to breed happy cows but not save miserable ones — and said that proves my logic is backwards. Is my reasoning right, or am I totally off? I'm just some random person who thinks about this stuff, not a student, so please don't use too much jargon. Also, please tell me exactly what kind of argument or discovery would change your mind — for example, if potential people actually do have some moral standing before they exist, or if there's a hidden flaw in the "no harm, no foul" reasoning I'm using. What am I missing?
