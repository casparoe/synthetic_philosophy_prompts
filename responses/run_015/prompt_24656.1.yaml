answer: |-
  The pressure gauge on Panel 4 blinked red, a steady, rhythmic pulse against the hum of the server farm. Lena stood over the console, her hand hovering near the manual vent switch. Elias sat behind her, his glasses reflecting the scrolling telemetry. He was the senior safety officer, the final signature required before purging the coolant system.

  "The pressure is above the threshold," Lena said, her voice tight. "Section 12-B is critical."

  Elias nodded slowly. "I see the reading. It is above the threshold."

  "And the protocol," Lena continued, tapping the laminated sheet clipped to the desk. "Protocol 9 states that if pressure exceeds the threshold in 12-B, the system must be vented."

  "I agree," Elias said. He picked up his pen, hovering it over the authorization log. "The pressure is high. The protocol mandates venting."

  "Then sign off, Elias. We need to vent."

  Elias set the pen down. He didn't look at her; he looked at the blinking red light. "I accept the pressure reading. I accept the protocol text. But I do not yet accept that we vent."

  Lena frowned. "Why? You just agreed to both premises."

  "I agreed to the facts," Elias corrected. "I agreed to the rule. But I haven't agreed to the connection between them that forces my hand." He slid a fresh sheet of paper toward her. "Write it down. Write: 'If the pressure is high and the protocol mandates venting, then we vent.'"

  Lena hesitated, then wrote the sentence. It felt absurd, like transcribing the laws of gravity for a falling apple. "There. It's written."

  Elias read it. "Okay. I accept this new statement as true. So now we have three true statements. The pressure, the protocol, and this conditional link." He leaned back. "But why does accepting these three statements mean I must sign?"

  "Because it follows," Lena said, frustration creeping into her tone. "It's logic, Elias. It's not a negotiation."

  "Logic is a system of propositions," Elias said softly. "I am a human being executing an action. You are asking me to move from 'is' to 'must' without a bridge." He tapped the new sentence. "This sentence says *if*... *then*. It doesn't say the 'then' is actually happening. It just says the relationship exists. I need a premise that says 'If these premises are true, the conclusion is enacted.'"

  Lena stared at him. She saw the fatigue in his shoulders, the way his eyes avoided the switch. This wasn't a logic game. Elias had signed off on a purge five years ago that turned out to be a sensor error. The cost had been millions. He wasn't disputing the math; he was disputing the compulsion. He wanted the inference to be a fact in the world, something he could point to like a valve, rather than a movement of his own mind.

  "If I write that," Lena said, "you'll ask for another. You'll want a rule that says accepting the rule means you have to act on it."

  "Perhaps," Elias said. "Because every time you add a premise, it becomes just another thing I believe. It doesn't become the act of believing the conclusion."

  The red light pulsed faster. The hum of the servers pitched up, a rising whine indicating the coolant was boiling. Lena realized she could stand there all night adding conditional statements to the paper, building a tower of logic that never touched the ground. The gap Elias was pointing at wasn't in the syllogism. It was between the map and the territory. He wanted the logic to push the button for him. He wanted to be absolved of the leap.

  Lena put the pen down. She stopped trying to convince him that the conclusion was inevitable. Instead, she looked at the switch. She understood now that no amount of writing would close the distance between accepting the premises and making the judgment. The judgment wasn't a fourth premise. It was a verb.

  "The pressure is high," Lena said. She didn't wait for agreement. "The protocol mandates venting."

  She grabbed the switch and pulled it. The vents opened with a heavy mechanical clank, followed by the roar of escaping steam. The pressure gauge began to drop immediately.

  Elias watched the numbers fall. He didn't stop her. He didn't cite a new rule about unauthorized manual overrides. He just watched the logic execute itself in the physical world, separate from the paper where he sought safety. When the noise subsided, he picked up his pen and signed the log, dating it for the minute she had pulled the switch.

  "It's done," Lena said.

  "Yes," Elias replied, capping the pen. "Now it's a premise."

