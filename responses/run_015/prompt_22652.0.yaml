      *   **Topic:** A counterfactual historical/philosophical analysis: How would Carl Friedrich Gauss have reacted to L.E.J. Brouwer's Intuitionism?
      *   **Specific Questions:**
          1.  Would Gauss endorse the rejection of the Law of Excluded Middle (LEM) for infinite domains?
