      *   *Rigor:* He insisted on proofs. "Pauca sed matura" (Few, but ripe). He disliked hand-waving.
      *   *Existence:* For Gauss, to prove something exists, you generally need to show how to find it or define it clearly. However, he was a man of the 18th/19th century transition. He used existence proofs that weren't fully algorithmic by modern standards (e.g., fundamental theorem of algebra proofs), though he sought constructive ones.
      *   *Physics connection:* As a physicist, he cared about applicability. Mathematics described the real world.
      *   *Platonism vs. Formalism:* Gauss wasn't a strict formalist. He believed in mathematical truth, but truth grounded in mental construction or logical necessity, not arbitrary symbol manipulation.

  3.  **Deconstruct Brouwer's Intuitionism:**
      *   *Core:* Mathematics is a creation of the human mind. Truth = Provability (constructibility).
      *   *LEM:* Rejected for infinite sets because you can't verify an infinite disjunction ($P \lor \neg P$) if you can't check all cases.
      *   *Continuum:* Not a set of points, but a medium of "flowing time." Free choice sequences (lawless sequences) are central.
      *   *Classical Analysis:* Much of it is meaningless or false because it relies on non-constructive existence proofs (e.g., Bolzano-Weierstrass without a method to find the limit).

