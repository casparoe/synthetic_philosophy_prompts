prompt: |-
  I'm moderating a podcast interview with an unnamed philosopher of cognitive science who has recently begun defending what she calls "inertial framing"—the view that the frame problem in artificial intelligence is not a representational deficit to be patched with logic, but an artifact of treating properties as inert unless updated. On her account, every property carries a built-in "stability disposition," a primitive tendency to persist that is only suspended by explicit causal interaction; human cognition, she argues, does not solve the frame problem so much as inhabit an ontology where inertia is the default and change is the exception. I want eight to ten interview questions that go well beyond having her restate this position. I need at least one question that presses the standard objection that she has merely relocated the computational burden into an obscure metaphysics of dispositions, together with a follow-up keyed to her likely reply that implementation is an engineering detail rather than a philosophical one—specifically asking what failure mode in a robotic planning system would indicate that the system genuinely lacks these stability dispositions rather than merely lacking the right logical formalism. I also want a question probing whether her view collapses into the naive-physics literature in developmental psychology, with a follow-up if she distinguishes them by appealing to causal powers rather than mental representations; another on what her framework implies for the "ramification problem" in non-monotonic reasoning, with a follow-up anticipating her claim that ramifications are only problematic for representational, not ontological, systems; and a closing question asking what empirical result—in robotics, comparative cognition, or neuroscience—would genuinely undermine her view rather than being accommodated by it. As you draft these, please say where your reasoning is most likely to fail: for instance, if the boundary between inertial framing and standard successor-state representations is blurrier than I've suggested, if the notion of a "stability disposition" risks circularity in defining causation, or if one of the follow-ups presupposes a technical result about causal modeling that may not hold. Do not include citations, bibliographies, or reading lists; I want questions that remain intelligible to a listener without library access, but I want them firmly in the weeds of the actual conceptual debate.
