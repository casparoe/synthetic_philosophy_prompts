answer: |-
  ### Prediction on the Digital Nomad Case
  Your advisor will likely **exclude** the digital nomads from the full *demos* (no vote), but grant them **mandatory consultative status**.

  She will treat them analogously to the **seasonal workers in the factory co-op (Case 3)**. Even though the nomads use services and pay consumption taxes (similar to the undocumented residents in Case 1), they lack the **temporal stability** required to be co-constituents of long-term infrastructure. Broadband expansion is a long-horizon investment; a 3–6 month stay is a "consumption" of the city, not a "reproduction" of it. Because they vote elsewhere, their political allegiance is anchored outside the city, breaking the "reciprocal" loop of authority.

  ### Critique of Your Two Rules
  You have identified two strong tendencies, but neither captures the full logic. Here is how the prior cases stress-test them:

  **1. Rule: Stable Reciprocal Vulnerability**
  *   **Fits:** Case 1 (Undocumented), Case 5 (Downstream towns).
  *   **Fails:** Case 3 (Seasonal workers). They are *highly* vulnerable to safety protocols (risk hits them harder), yet they are excluded. This proves vulnerability alone is insufficient; it must be coupled with institutional permanence.
  *   **Fails:** Case 2 (Future Generations). They are vulnerable to climate decisions, but cannot have *reciprocal* vulnerability in the present.

  **2. Rule: Embodied Capacity for Discourse**
  *   **Fits:** Case 4 (Age limits), Case 6 (AI exclusion).
  *   **Fails:** Case 3 (Seasonal workers). They have full capacity to speak/safety report, yet are excluded.
  *   **Fails:** Case 5 (Upstream polluters). They have capacity to speak, yet are excluded from the downstream *demos* (owed consultation, not membership).

  ### The Splitting Case
  **Case 3 (Factory Co-op)** is the sharpest splitter of your two hypotheses.
  *   **Vulnerability Rule:** Predicts **INCLUSION** (Seasonal workers face higher physical risk).
  *   **Discourse Rule:** Predicts **INCLUSION** (Seasonal workers are embodied agents capable of speech).
  *   **Advisor's Verdict:** **EXCLUSION**.

  This case reveals that both vulnerability and capacity are *necessary* conditions, but neither is *sufficient*. There is a third variable overriding them: **Institutional Continuity.**

  ### The Actual Rule: "Co-Authorship of the Ongoing Order"
  Your advisor is likely operating on a principle of **Regime-Specific Co-Constitution**. Membership in the *demos* requires three concurrent conditions:
  1.  **Subjecthood:** You are bound by the coercive order (Case 1, 5).
  2.  **Agency:** You have the capacity to deliberate (Case 2, 4, 6).
  3.  **Continuity:** Your presence overlaps with the *lifespan of the decision's consequences* and you participate in the *reproduction* of that specific community (Case 3, 7).

  *   **Why Nomads Fail:** They meet Subjecthood (taxes/services) and Agency (speech), but fail Continuity. Broadband infrastructure lasts 10+ years; they stay 6 months. They are users, not co-authors.
  *   **Why Undocumented Pass:** They meet all three. "Long-term" status satisfies Continuity, even without legal papers.
  *   **Why Spouses Split (Case 7):** They have Continuity (5+ years) and Agency. But on *sacred land*, they fail a hidden fourth condition: **Ontological Alignment.** They reproduce the domestic order, but not the spiritual lineage.

  ### Stakes of Underdetermination
  If the precedents genuinely underdetermine this case, the choice reveals her theory of the **City**:
  *   **If she Includes them:** She treats the city as a **Service Provider**. Membership is transactional (taxes paid = voice granted). This aligns with a market-based liberalism.
  *   **If she Excludes them:** She treats the city as a **Political Community**. Membership is relational (shared fate over time = voice granted). This aligns with civic republicanism or communitarianism.
  *   **Given Case 3 (Factory) and Case 7 (Tribal),** she almost certainly views bodies as **Political Communities**. Exclusion is the consistent prediction.

  ### The Decisive Test Case
  To definitively separate "Vulnerability" from "Continuity," propose this case to her:

  **The Refugee Camp Infrastructure Committee**
  *   **Context:** A semi-permanent refugee camp (average stay 8 years, but no legal citizenship in host country).
  *   **Decision:** Building permanent sewage and electrical grids.
  *   **Group A:** Refugees who have been there 5 years, expect to stay 5 more, but have no legal lease.
  *   **Group B:** International Aid Workers on 6-month rotations. They have high technical capacity, high safety vulnerability (disease risk), but zero long-term stake.
  *   **Question:** Who sits on the *demos* for infrastructure?

  **Why this splits the rules:**
  *   **Vulnerability Rule:** Both groups are vulnerable to sewage failure. Should both vote?
  *   **Discourse Rule:** Aid workers often have *more* capacity/resources to deliberate. Should they dominate?
  *   **Continuity Rule:** Only Refugees are reproducing the camp as a home. Aid workers are transient functionaries.
  *   **Prediction:** If she follows her own precedents (Case 1 vs Case 3), she must grant the **Refugees** the vote and the **Aid Workers** only advisory roles, despite the Aid Workers' superior capacity and legal standing. If she includes the Aid Workers, her "Seasonal Worker" precedent collapses.
