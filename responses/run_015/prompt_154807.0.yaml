answer: |-
  ### Exam Question

  **Course:** Graduate Seminar in Normative Ethics
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Citations are not required. Focus on argumentative precision and conceptual consistency.

  **Question:**
  Consider a modified rescue case: You can save a specific person, Alice, or you can save five strangers. Additionally, you have the option to flip a fair coin to decide between saving Alice and saving the five. John Taurek argues that "the numbers should not count," yet he proposes the coin-flip to show equal concern.

  Evaluate whether Taurek's own reasoning renders the coin-flip impermissible or absurd compared to saving Alice outright. If his view entails indifference between flipping and saving Alice, does this result constitute a *reductio ad absurdum* of his position? Finally, assess whether a threshold hybrid view (where aggregation applies only past a certain number) can be grafted onto Taurek's framework without betraying its core anti-utilitarian premise.

  ***

  ### Model Answer

  Taurek's argument rests on the claim that moral losses cannot be aggregated across different persons. For Taurek, there is no super-entity "the five" that suffers a loss five times greater than Alice's. Morality requires pairwise comparison: Alice's death versus any single stranger's death. Since the loss to one is equivalent to the loss to one, there is no moral reason to prioritize the five. To save the five simply because they are five is to treat them as a container of value rather than distinct individuals, violating the separateness of persons.

  This creates a tension regarding the coin-flip. Taurek advocates flipping to give each individual an equal chance of survival. However, if numbers truly do not count, saving Alice outright is permissible because it respects pairwise equality (one saved vs. one lost). Introducing a flip risks smuggling aggregation back in: it suggests the five collectively possess enough moral weight to warrant a 5/6 probability of survival, balancing Alice's 1/6. If Taurek insists on the flip as obligatory, he implies the group's size generates a probabilistic claim, contradicting his rejection of summation. If the flip is merely permissible, it remains unclear why it is preferable to saving Alice directly.

  Consequently, Taurek must be indifferent between saving Alice outright and flipping. Both options refuse to sacrifice Alice for the greater good. If he prefers the flip, he acknowledges the five matter *more* in aggregate. If he is indifferent, critics argue this is absurd: why deny the five a higher chance when no extra harm is done to Alice? Yet, for Taurek, this isn't absurd but consistent. The "absurdity" is only felt if one accepts aggregation premised on utilitarian expected value. From his perspective, giving the five a 100% chance violates the strangers' individual equality with Alice just as much as giving Alice 100% violates the strangers' claims.

  Is this a *reductio*? Only if one assumes minimizing total loss is a moral requirement. Taurek denies this requirement. The counterintuitive result (letting five die to save one, or flipping) is the cost of respecting persons as distinct entities rather than vessels of value. The charge of absurdity relies on the very aggregative intuition Taurek rejects. To claim his view self-destructs because it clashes with utilitarian expectations is to beg the question against his core premise.

  Finally, could a threshold hybrid save the view? One might argue numbers count only after a certain point (e.g., 1000 vs. 1). However, this betrays Taurek's core premise. If losses cannot be summed because persons are separate, no amount of persons changes the metaphysical structure. A threshold admits aggregation is valid but limited, collapsing back into a modified utilitarianism rather than preserving the strict pairwise logic Taurek defends. The threshold view concedes that numbers *do* count eventually, which undermines the principled rejection of aggregation in the Alice vs. Five case. Thus, the hybrid fails to rescue the view without abandoning its foundation.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Structure:** 5 Conceptual Moves × 4 Marks Each

  **1. Rejection of Aggregation (4 Marks)**
  *   **Required:** Explain that Taurek rejects summing losses because there is no collective entity to suffer the sum; morality is pairwise (one vs. one).
  *   **Typical Mistake:** Confusing Taurek's separateness of persons with standard deontological rights violations, or claiming Taurek thinks the five suffer *no* loss rather than that their losses cannot be *added*.
  *   **Grading:** 4 for clear articulation of non-summing; 2 for vague appeal to "fairness"; 0 for utilitarian rebuttal.

  **2. Coin-Flip vs. Aggregation (4 Marks)**
  *   **Required:** Analyze whether the flip respects equality or implicitly admits the five have greater weight (probabilistic aggregation).
  *   **Typical Mistake:** Treating the coin-flip as standard expected-value reasoning compatible with utilitarianism, rather than a specific mechanism for equal concern.
  *   **Grading:** 4 for identifying the tension between flipping and non-aggregation; 2 for describing the flip without critical analysis; 0 for ignoring the flip's implications.

  **3. Indifference (Alice vs. Flip) (4 Marks)**
  *   **Required:** Argue whether Taurek is committed to indifference between saving Alice outright and flipping, since both refuse to sacrifice her for the group.
  *   **Typical Mistake:** Assuming Taurek *mandates* the flip strictly, missing that saving the one is also permissible under his view.
  *   **Grading:** 4 for correct identification of permissibility/indifference; 2 for claiming saving Alice is forbidden; 0 for missing the comparison.

  **4. Absurdity vs. Reductio (4 Marks)**
  *   **Required:** Assess whether the counterintuitive result destroys the theory or merely clashes with utilitarian intuition.
  *   **Typical Mistake:** Claiming the view is false simply because it is counterintuitive, without addressing Taurek's rejection of the intuition's basis.
  *   **Grading:** 4 for nuanced defense of consistency over intuition; 2 for asserting absurdity without qualification; 0 for dismissing the question.

  **5. Threshold Hybrid Viability (4 Marks)**
  *   **Required:** Evaluate if a threshold solves the problem without conceding that numbers count (answer: no, it betrays the core premise).
  *   **Typical Mistake:** Arguing thresholds are a practical compromise without addressing the metaphysical inconsistency regarding separateness.
  *   **Grading:** 4 for identifying the betrayal of the core premise; 2 for discussing thresholds generally; 0 for endorsing the hybrid uncritically.
