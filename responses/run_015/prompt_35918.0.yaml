  9.  **Final Polish:** Ensure tone is seminar-appropriate (rigorous but constructive). Use standard terminology (Philosophical Anarchism, Natural Duty, Rawls).

      *(Self-Correction on Ranking)*: Actually, (1) vs (2) *is* a tension if not grounded properly. If I reject fair play/consent, what grounds (2)? I need to tell them to explicitly name the "Natural Duty of Justice." If they don't, (1) eats (2). So it's a "potential" tension that needs a specific bridge. But (4) vs (5) is a structural tension. I will rank (4) vs (5) as highest because it's a conflict in moral logic, whereas (1) vs (2) is a missing premise.

      *Wait, looking closer at (4).* "Willingness to submit... is what shows fidelity to law." If (1) is true ("no obligation to obey... just because it's the law"), then "fidelity to law" is a weird concept. You have fidelity to *justice*, not *law*. If the law is just an instrument, why submit to punishment? To show you respect the *process*. But if (5) is true, sometimes the process is the enemy.
