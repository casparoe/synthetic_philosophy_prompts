      *   (3) *Orthodox Civil Disobedience (CD):* Public, nonviolent, accept punishment. Covert/violent = resistance/refusal, not CD.
      *   (4) *Justification for Accepting Punishment:* Accepting punishment shows fidelity to law and makes it an appeal to shared justice (Rawlsian view).
      *   (5) *Justification for Covert Resistance:* Covert breaking of *deeply unjust* laws (e.g., hiding refugees, leaking) is justified, and evading punishment doesn't count against it.

  3.  **Initial Scan for Tensions:**
