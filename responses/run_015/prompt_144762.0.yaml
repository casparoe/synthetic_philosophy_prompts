answer: |-
  Alright, pull up a chair. I'm going to skip the preamble about how "this is a timeless debate." You know that. You want the machinery. I've spent years turning this specific knot over in my head, and I'm going to give you the version that actually holds together without snapping.

  First, let's look at the three candidate principles we usually start with, and why I'm throwing two of them in the trash.

  **Candidate 1: The Cold Calculator (Strict Utilitarianism).**
  *Rule:* Always maximize the number of survivors. No exceptions.
  *Verdict:* **Discard.** It fails your Case 6 (Shoving). If numbers were all that mattered, you *must* shove the one guy to save the five. You said you couldn't do that. It also fails Case 2 (Friend). It demands you let your best friend drown to save five strangers. That's not just hard; it treats human relationships as morally irrelevant. If a moral theory tells you your love for your friend is a distraction, the theory is broken, not you.

  **Candidate 2: The Pure Personalist (Agent-Centered Prerogative).**
  *Rule:* You are allowed to favor your own friends and family, numbers don't override personal ties.
  *Verdict:* **Discard.** It fails Case 7 (On Duty). If you're on the lifeguard chair, you *cannot* save your friend over five kids. You know that. It also fails Case 1. If you see two rafts of strangers, 1 vs 5, and you save the 1 just because... why? There's no tie there. We need numbers to count *somewhere*.

  **Candidate 3: The Contextual Constraint (The Survivor).**
  *Rule:* Morality changes based on the "mode" you are in (Private vs. Public), but within those modes, you have specific constraints on action and counting.
  *Verdict:* **Keep.** This is the only one that survives your cases. It acknowledges that you are a private citizen *and* a public employee, and those roles have different rules. It also acknowledges that *how* you save people matters (shoving vs. steering).

  ### The Principle I Commit To

  Here is the principle I've landed on after testing it against cases exactly like yours. I call it **Role-Weighted Constrained Maximization**.

  It has three clauses.

  **Clause 1: The Constraint on Means (The "No Shoving" Rule).**
  You may not directly violate a person's bodily autonomy to save others, even if it saves more lives.
  *   *Purpose:* This saves **Case 6**. Steering the boat away from the one (allowing harm) is permissible. Shoving the one (inflicting harm) is not. The distinction is whether you are using the person as a tool.

  **Clause 2: The Role Override (The "Uniform" Rule).**
  When you have voluntarily assumed a public role with a mandate of impartiality (like a lifeguard), you must maximize lives saved impartially. When you are acting in a private capacity, you are permitted to prioritize significant personal relationships over a moderate number of strangers.
  *   *Purpose:* This resolves the tension between **Case 2** (Off duty: Save Friend) and **Case 7** (On duty: Save Five). It explains *why* the morality shifts. It's not that the friend's life is worth less; it's that you signed a contract of impartiality when you took the job. Off the clock, you are allowed to be partial.

  **Clause 3: The Threshold of Counting (The "Non-Zero" Rule).**
  In the absence of personal ties or professional roles, every life counts equally. There is no point where an additional life becomes morally negligible.
  *   *Purpose:* This saves **Case 1** (1 vs 5) and **Case 8** (Distance doesn't matter).
  *   *Sacrifice:* This explicitly rejects **Case 4** (1M vs 999,999). I will be blunt: your intuition on Case 4 is wrong. It's a psychological glitch, not a moral truth. If one life matters in Case 1, it matters in Case 4. The fact that the ratio is small doesn't make the life zero. You have to drop this intuition if you want a consistent rule.

  **Clause 4: The Certainty Tie-Breaker.**
  When the *expected* number of survivors is equal (e.g., 5 people at 20% risk vs 1 person at 100% risk), prioritize the certain rescue.
  *   *Purpose:* This saves **Case 5**. Mathematically, the expected value is the same (1 life). But morally, saving the person who is *definitely* going to die without you carries more weight than reducing a risk for a group. It respects the "identifiable victim."

  ### Testing the Principle Against Your Cases

  Let's run the diagnostics.

  *   **Case 1 (1 vs 5 Strangers):** Clause 3 applies. No personal ties, no role. Numbers count. Save 5. **Verdict: Matches.**
  *   **Case 2 (1 Friend vs 5 Strangers, Off Duty):** Clause 2 applies. Private capacity. You are permitted to prioritize the significant relationship over the moderate number (5). **Verdict: Matches.**
  *   **Case 3 (1 vs 2):** Clause 3 applies. Numbers count, but the gap is small. The principle allows flexibility here (supererogatory to save 2, permissible to flip). **Verdict: Matches.**
  *   **Case 4 (1M vs 999,999):** Clause 3 applies. Every life counts. You must save the 1M. **Verdict: Mismatch.** (I am telling you to correct your intuition here. The "coin flip" feeling is just your brain numbing out to big numbers. Don't trust it.)
  *   **Case 5 (Probabilities):** Clause 4 applies. Expected value is equal, so choose certainty. Save the 1. **Verdict: Matches.**
  *   **Case 6 (Steer vs Shove):** Clause 1 applies. Steering is allowing; shoving is using. Save 5 by steering. Do not save 5 by shoving. **Verdict: Matches.**
  *   **Case 7 (On Duty Friend vs 5):** Clause 2 applies. Public role. Impartiality required. Save 5. **Verdict: Matches.**
  *   **Case 8 (Distance):** Clause 3 applies. Distance is morally irrelevant. Save 5. **Verdict: Matches.**

  ### The Hard Question: Friend vs. Five On Duty

  You asked specifically about the conflict in Case 7 (and the variation where you're torn). You feel the pull of the friend, but the duty of the job.

  My principle says: **The job wins.**

  Here is why this doesn't make the principle suspicious: Morality isn't just about "good outcomes"; it's about "keeping promises." When you took the lifeguard certification and put on the whistle, you made a public promise to the community: "I will protect everyone equally." If you save your friend instead of the five kids, you aren't just saving one life over five; you are breaking a public trust. You are stealing safety from the five kids who paid for a lifeguard, not for your friend's bodyguard.

  Off the clock (Case 2), you haven't made that promise. You are just a human being. Humans are *allowed* to love their friends more than strangers. That's not corruption; that's what makes us human. But on the clock, you are an agent of the pool. You surrendered that right to partiality in exchange for the wage and the title.

  Does this feel right? It feels terrible in the moment. It feels like betrayal. But a principle that lets you save your friend on duty would make the job meaningless. If lifeguards saved their friends first, nobody would trust lifeguards. So, the principle holds: **Private love is a virtue; public partiality is corruption.**

  ### The Sacrifice

  I need you to be honest with yourself about **Case 4**.
  You said: *"A million vs 999,999: coin flip feels fine, like the extra one life does literally nothing for me there."*

  You have to kill this intuition. It contradicts Case 1.
  In Case 1, you save the 5 because 5 > 1. That is a difference of 4 lives.
  In Case 4, you save the 1M because 1,000,000 > 999,999. That is a difference of 1 life.
  If you say the 1 life matters in Case 1, you cannot say it matters *nothing* in Case 4. The only difference is the size of the crowd. But a life doesn't shrink because there are other lives around it.
  If you keep Case 4, you open the door to saying "Well, 1 vs 5 is only 4 lives, maybe I'll flip there too." It erodes the whole idea that numbers count.
  **Verdict:** Drop Case 4. Save the million. It will always feel psychologically numb, but morally, it's the only consistent move.

  ### The Final Precise Statement

  Here is the rule, written so you can apply it to a case you haven't thought of yet:

  > **Act to preserve the greatest number of lives, subject to three constraints:**
  > 1.  **Means:** Do not directly inflict harm on an innocent person to save others (no shoving).
  > 2.  **Role:** If acting in a voluntary public capacity requiring impartiality, personal relationships must be ignored. If acting privately, significant personal relationships may override the duty to save a moderate number of strangers.
  > 3.  **Certainty:** When expected survival rates are equal, prioritize the rescue of those facing certain death over those facing probabilistic harm.
  >
  > **Note:** The value of a single life never reaches zero, regardless of the total scale.

  ### The "Lunch Table" Version

  You need something punchy to shut down the argument. Say this:

  > "Numbers always count, but context changes the rules. If I'm off the clock, I'm allowed to save my friend because I'm a person, not a machine. But if I'm on the clock, I made a promise to be impartial, and breaking that promise makes the job meaningless. Also, I can't kill a guy to save five others—there's a line between letting someone die and making them die. But don't tell me one life doesn't matter just because the crowd is big; that's just our brains getting tired, not morals."

  That's the view. It's not perfect—Case 2 (saving 1 friend over 5 strangers) will always feel heavy to some people—but it's the only one that keeps your job, your friend, and your conscience intact without lying to yourself about the math.
