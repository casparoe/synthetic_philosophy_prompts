answer: |-
  A community owes remembrance when a record secures truth against erasure or prevents structural harm, unless publicity empowers the perpetrator's ideology or imposes a definitional burden on the living wronged who seek release.

  The first clause, securing truth against erasure, motivates your verdicts on the secret police files and the killers' paperwork; in both instances, the record is the only barrier against state or temporal oblivion, and it also covers the vanished people case, where the duty persists precisely because there are no living wronged to trigger the release clause. The second clause, preventing structural harm, drives the genocide and corporate killing verdicts; here, remembrance is instrumental for safety, which explains why the duty holds even when victims ask to let go—the burden of forgetting falls on the public, not exclusively on the wronged. The third clause, empowering the perpetrator's ideology, dictates your intuition on the massacre site; keeping the location public would serve the killers' legacy rather than the victims' truth, creating a duty not to remember. The final clause, imposing a definitional burden on the living wronged, accommodates the descendants who wish to stop being defined by the atrocity, as well as the low-level informants and the reformed juvenile, where continued remembrance would freeze their identities in a moment of coercion or youth.

  The principle cannot fully accommodate your balk at the AI reconstruction case; while the principle demands remembrance because the truth of the killings is secured against erasure, your hesitation stems from epistemic integrity rather than the duty itself, suggesting a secondary constraint on the *mode* of memory that this principle does not capture.

  On the credit-scoring system, the principle dictates a duty to remember; the harm was structural and aggregate, risking recurrence in future algorithms, and the burden of remembrance falls on the developers and regulators rather than defining the identity of the neighbourhood residents.

  Consider the case of museums holding artefacts looted during colonial occupation: the principle suggests a duty to remember the theft (securing truth) but a duty to return the objects (unless keeping them empowers the perpetrator's ideology of cultural superiority), distinguishing between the memory of the wrong and the possession of the spoils.
