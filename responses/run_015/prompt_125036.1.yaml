          *   *Homunculus Fallacy:* If every layer needs an interpreter, you need an infinite regress of homunculi *unless* you hit a bedrock where the interpretation happens intrinsically. Searle says that bedrock is biology. Dennett says there is no bedrock, just layers of competence (no "magic" moment of understanding).

