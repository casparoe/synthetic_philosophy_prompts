      *   **Searle (The Chinese Room/Biological Naturalism):** Syntax is not sufficient for semantics. Computers manipulate symbols (syntax). Minds have meaning (semantics). This meaning (original intentionality) is a biological feature of brains, caused by neurobiological processes. Derived intentionality (like words on a page or a computer state) is assigned by an observer with original intentionality.

