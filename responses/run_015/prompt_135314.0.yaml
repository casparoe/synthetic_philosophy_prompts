  I've been trying to think through drug policy on my own, particularly the contrast between Portugal's approach—decriminalizing possession of all drugs and treating use as a public health matter—versus the model seen in Canada and several U.S. states, where cannabis is fully legalized with a regulated supply chain but other drugs remain prohibited across both use and supply. I want to isolate a conceptual tension that feels hidden in that comparison, not just an empirical disagreement about outcomes.

