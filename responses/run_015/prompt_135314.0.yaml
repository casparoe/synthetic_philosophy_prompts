  1. The probability that the observed harm gap between cannabis and prohibited drugs like heroin or methamphetamine is substantially caused by prohibition conditions rather than by intrinsic pharmacological differences.
  2. The probability that autonomy-based arguments for cannabis legalization—that informed adults should be permitted to assume certain risks—apply symmetrically to other drugs, or that there exists a non-arbitrary autonomy-limiting principle that stops precisely at cannabis.
  3. The probability that a coherent risk-based framework, comparing addiction potential, overdose risk, and social externalities, can justify full supply legalization for one substance and full supply prohibition for another without smuggling in contingent social norms that are themselves products of the current legal regime.
  4. The probability that Portugal's decision to decriminalize possession across the board, without legalizing supply for any drug, reveals that treating consumption as a health matter does not logically entail treating supply differently by substance—thereby exposing the hybrid model as normatively inconsistent rather than a defensible pluralist compromise.

  For each part, provide a rough probability and one line of justification. Then show how they combine into your overall number, and tell me which part your final credence is most sensitive to. Finally, describe what specific argument, empirical finding, or conceptual clarification would move that weakest part—and therefore the whole—most significantly.

