  *(Self-Correction on the "Git Hypothesis"):* I need to be careful not to dismiss the user's insight entirely. It's a *symptom* of the problem, not the *cause*. The cause is that Side A ignores the reconstruction mechanism even in low-fidelity media if the *outcome* looks selected, while Side B rejects the Darwinian label even in high-fidelity media if the *variation* is guided. So fidelity isn't the switch; intentionality/mechanism is.

  *(Self-Correction on Error Threshold):* Make sure to mention that cultural evolution often bypasses the error threshold via "scaffolding" (external storage), which changes the parameters. But again, Side B cares about *how* the variation is generated, not just if it survives.

