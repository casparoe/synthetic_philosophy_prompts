      *   *Hidden Empirical Question:* The user suggests this (fidelity thresholds). Is it true that we just don't know the fidelity rates? Or is the disagreement about whether fidelity *matters* for the label?
      *   *Clash of Standards of Evidence:* Side A looks at macro-patterns (cumulative adaptation exists). Side B looks at micro-mechanisms (psychological reconstruction). One is population-level, one is cognitive-level.
      *   *Bedrock Intuitions:* Side A sees continuity between bio and culture. Side B sees a discontinuity (agency/intentionality). This is hard to argue past.

  3.  **Evaluating the Diagnoses:**
      *   *Verbal:* Too shallow. They aren't just arguing about words; they are arguing about whether intentionality breaks the algorithm.
      *   *Two Questions:* Promising. Side A is doing "evolutionary epistemology" (does the logic hold?), Side B is doing "mechanistic biology" (is the substrate compatible?).
      *   *Empirical (Fidelity):* The user's hypothesis. It's strong, but is it the *root* cause? Side B would argue that even high fidelity doesn't make it Darwinian if the variation isn't blind. Side A would argue blind variation isn't strictly necessary (Lamarckian evolution is still evolution).
