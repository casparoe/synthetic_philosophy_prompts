      *   *Addressing the Climate case:* Is $10^{-12}$ different? Yes. It's within the realm of physical reality, even if unlikely. However, estimating it is incredibly hard.
      *   *The "Line in the Sand":* You don't have to treat them the same. You can have a "credibility floor." Below a certain probability, the estimate is just noise.
      *   *The Value of Civilisation:* Is saving civilisation worth infinite value? If yes, EV dominates. If no (finite value), then the small probability might not outweigh the certain life.
      *   *Practical Advice:* Focus on "robustness." Does the action have other benefits? (Co-benefits).
