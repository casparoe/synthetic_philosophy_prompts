answer: |-
  **Question 1**
  You argue that reflection order changes the outcome—career first versus relationships first lands you in different places. But how do we know these aren't just different maps of the same territory? Maybe those endpoints are just using different languages to describe the same underlying value structure.
  *   **Likely Answer:** She'll insist the incompatibility is genuine, not linguistic.
  *   **Follow-up:** "If they're genuinely incompatible, how do we verify that without already knowing the truth? Aren't we just guessing based on our current limited view?"

  **Question 2**
  Your model gives our current selves a seat at the bargaining table. But current us are tired, depressed, and badly informed. Why should a burnt-out version of me have veto power over a fully informed, idealized version?
  *   **Likely Answer:** She'll say identity continuity matters more than epistemic quality.
  *   **Follow-up:** "So if my depression is causing a delusion, that delusion still gets a vote? Where's the line between 'my values' and 'my symptoms'?"

  **Question 3**
  Some people care about the journey, not just the destination. I might prefer a version of me that struggled to get wise over one who was just edited to be wise. Does your bargaining model respect preferences about the extrapolation process itself?
  *   **Likely Answer:** She'll say yes, process preferences are just another input to the bargain.
  *   **Follow-up:** "But if we bargain over the process, aren't we just kicking the can down the road? Who decides which process preferences count?"

  **Question 4**
  If a superintelligent system is running this extrapolation, isn't it just using its own judgment to decide which paths are valid? Aren't you basically laundering the AI's values through a 'fairness' filter?
  *   **Likely Answer:** She'll claim the AI can be neutral or constrained by the protocol.
  *   **Follow-up:** "What mechanism ensures that neutrality without baking in values? Isn't the choice of protocol itself a value judgment?"

  **Question 5**
  Your fairness rule says no path gets privileged unless someone can say why. But who decides if a reason is good enough? The current self? The endpoints?
  *   **Likely Answer:** She'll say the endpoints will agree on valid reasons during the bargain.
  *   **Follow-up:** "What happens when they disagree on the reason itself? Does the procedure stall, or does someone break the tie?"

  **Question 6**
  In a bargaining problem, parties need leverage. What leverage does a hypothetical future endpoint have against another endpoint? Why wouldn't the most aggressive endpoint just win?
  *   **Likely Answer:** She'll reference a standard solution concept from game theory.
  *   **Follow-up:** "But why that solution concept? Isn't picking a solution concept just picking another fixed point in disguise?"

  **Question 7**
  You often say we can fix issues by putting them in the extrapolation. But if the extrapolation procedure itself is path-dependent, aren't you using a broken ruler to measure the breakage?
  *   **Likely Answer:** She'll say we can extrapolate the procedure too, recursively.
  *   **Follow-up:** "Where does the buck stop? If every layer needs extrapolation, don't we need a foundation that doesn't rely on extrapolation?"

  **Question 8**
  Okay, let's say we build this. Before we turn it on, what observable evidence would convince you the procedure is flawed? If nothing counts as evidence until it runs, isn't that unfalsifiable?
  *   **Likely Answer:** She'll suggest looking for logical inconsistencies or instability in the output.
  *   **Follow-up:** "But couldn't those inconsistencies just be solved by 'more extrapolation'? What specific failure mode couldn't be fixed by pushing the process further?"
