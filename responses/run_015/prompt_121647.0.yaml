answer: |-
  To the Participants of the Workshop on Artificial Belief

  **1. Agreed Claims**

  Both parties endorse the following claims. These are not merely procedural concessions but substantive agreements on the constraints any theory of artificial belief must satisfy.

  1.  **Predictive Failure Defeats Ascription:** If a system systematically fails to behave in accordance with an ascribed belief across relevant situations, the ascription is false. Predictive success is a necessary condition for belief.
  2.  **Structural Defeat:** Even if predictive success is maintained, evidence that the system lacks internal differentiation corresponding to the ascribed content can defeat the ascription. Both sides agree that internal structure is evidentially relevant, though they disagree on whether it is constitutive.
  3.  **Counterfactual Robustness:** Both sides require that beliefs support counterfactuals. The attributionist requires this for the intentional stance to remain the *best* strategy across varied conditions; the structuralist requires this as a condition of the state's causal role.
  4.  **The Thermostat Concession:** Neither party ascribes beliefs to a simple thermostat. The attributionist denies the intentional stance is the best strategy (physical stance suffices); the structuralist denies the requisite internal complexity exists.
  5.  **The Lookup Table Concession:** Neither party ascribes beliefs to a pure lookup table mapping inputs to outputs without compression. The attributionist denies there is a real pattern to capture; the structuralist denies there is a state occupying a causal role.
  6.  **System versus Corpus:** A static compressed index of a human corpus is not a believing system. Both agree the system differs from the corpus because the system deploys the information dynamically in response to novel prompts, whereas the corpus is inert.
  7.  **Action Connection:** Beliefs must be available to downstream processing that influences action. A state completely isolated from the system's output mechanisms cannot be a belief.
  8.  **Self-Reports as Behaviour:** Verbal self-reports of belief are treated as behavioural data, not incorrigible truths. Both sides agree these reports can be erroneous or manipulated.
  9.  **History Matters:** The training history of the system is relevant to belief ascription. The parties disagree on whether history is constitutive of the belief or merely evidence for the capacity to sustain the stance.
  10. **Gradability:** Belief ascription may be context-sensitive or gradable without being false. A system might believe *p* sufficiently for one explanatory purpose but not another.

  **2. Disagreements Table**

  | Issue | Attributionist Formulation | Structuralist Formulation | Verbal? | Crux | Case/Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Belief** | Belief is a real pattern visible when taking the intentional stance; no further fact exists. | Belief is an internal state fixed by history and integrated into the system's causal economy. | Yes. Disguises: What kind of thing is a mind? | Metaphysical status of patterns vs states. | A system predicts perfectly but uses random weights. | Attributionist: Believes. Structuralist: Does not believe. |
  | **Role of Prediction** | Predictive payoff is constitutive of the belief. If the stance works, the belief is real. | Predictive payoff is defeasible evidence. A system might predict well without believing. | No. Substantive. | Is prediction enough? | A lookup table perfectly mimics a believer. | Attributionist: Stance fails (no compression). Structuralist: Structure fails (no state). |
  | **Internal Structure** | Structure matters only insofar as it supports the stance. | Structure matters independently; wrong structure means wrong state. | Yes. Disguises: Is structure evidence or essence? | The coding-symmetry crux. | Two mappings support same predictions. | Attributionist: Charity resolves it. Structuralist: Distinction is idle. |
  | **Niche Relativity** | Beliefs can be relative to a niche if the stance works there. | Beliefs must be robust beyond the training niche to be real. | No. Substantive. | The restricted-niche crux. | System fails outside training distribution. | Attributionist: Qualified belief. Structuralist: No belief. |
  | **Self-Report** | Reports are just another behaviour to be predicted by the stance. | Reports are a specific channel that may dissociate from the true state. | Yes. Disguises: What counts as behaviour? | The report–state dissociability crux. | Intervention changes report not task behaviour. | Attributionist: Belief changed. Structuralist: Belief unchanged. |
  | **Second-Order** | Second-order ascriptions stand on the same footing as first-order. | Second-order ascriptions require higher structural integration. | No. Substantive. | The adversarial crux. | System models human opponent successfully. | Attributionist: Believes you believe. Structuralist: Merely tracks statistics. |

  **3. The Cruxes**

  **The Coding-Symmetry Crux**
  Consider a trained system where two rival mappings from internal states to candidate contents support exactly the same predictions across all situations. The attributionist must argue that the intentional stance's own resources—specifically charity and the unity of the agent—disambiguate the mapping. If one mapping makes the system appear more rational or coherent, that mapping is preferred. The stance is not passive; it imposes normative constraints. Therefore, the indeterminacy is resolved by the interests we impute to the agent. The structuralist must engage with the possibility that this distinction is idle. If the mappings make no predictive difference anywhere, the structuralist argues this reveals that 'belief' is not merely about prediction. However, if the structuralist insists one mapping is true despite no behavioural difference, they posit a metaphysical fact detached from function. Both sides agree that if the symmetry is perfect including counterfactuals, the dispute risks becoming verbal. The attributionist predicts the stance will always find a reason to prefer one mapping (e.g., simplicity). The structuralist predicts that without structural grounding, the preference is arbitrary.

  **The Restricted-Niche Crux**
  Suppose a system behaves as ascribed across a circumscribed range but fails outside it in a way predictable from training statistics but not from the content ascribed. The attributionist proposes qualifying the ascription: the system believes *p* relative to that niche. This preserves the utility of the stance within the domain where it is the best strategy. The structuralist argues this is smuggling in a structural requirement under the guise of content qualification. For the structuralist, if the state is not counterfactually robust beyond the training distribution, it is not a belief state but a disposition triggered by specific cues. The real work lies in deciding whether range-indexed belief is belief. The attributionist expects practice to move towards qualified ascriptions, treating them as genuine but context-bound. The structuralist expects practice to withdraw the term, arguing that the other side is quietly describing the training distribution in intentional vocabulary. Both agree to test this on systems that fail catastrophically outside their niche despite high confidence.

  **The Report–State Dissociability Crux**
  Consider an intervention that leaves task behaviour intact while changing what the system says about its own states, or the reverse. The attributionist must state that verbal self-report has no evidential role not shared by other behaviour. Since the training corpus consists largely of human avowals, the system learns to report beliefs as part of its task. If the report changes, the stance must update the ascribed belief to maintain predictive accuracy. The structuralist argues that the report channel may be dissociable from the state actually guiding action. If the system acts as if *p* but says *not-p*, the structuralist privileges the action-guiding state. The attributionist privileges the total pattern including speech. Both sides must commit to whether a system's verbal self-report has any special status. The attributionist predicts that changing the report changes the belief ascription. The structuralist predicts that if the downstream action processing remains unchanged, the belief remains unchanged, rendering the report a mere output channel error.

  **The Adversarial Crux**
  Consider a system trained against human opponents, requiring it to model its interlocutor to succeed. Do its second-order ascriptions stand on the same footing as first-order ones? The attributionist commits that they do; if treating the system as believing that you believe *p* yields predictive success, then it believes it. Competitive success counts as evidence equal to cooperative success. The structuralist commits that the bar is higher. Second-order states require a specific architectural integration that allows the system to use its model of you to adjust its own policies recursively. Mere statistical correlation in a competitive setting is insufficient. The structuralist predicts that competitive success is weaker evidence of belief than cooperative success, as it may rely on heuristic exploitation rather than genuine modelling.

  **4. Closing Section**

  For the attributionist, the single finding that would lead to abandoning their formulation is the discovery of a system where the intentional stance is the best predictive strategy, yet the internal mechanism is proven to be entirely random with respect to the ascribed content, such that no real pattern exists even in principle. For the structuralist, the finding that would lead to abandonment is a system with the exact requisite structural history and integration that systematically defies prediction by the intentional stance, rendering the stance useless despite the presence of the 'belief' structure.

  There is nothing both agree would settle the matter rather than merely move one side. The disagreement concerns the definition of the phenomenon itself, not merely the classification of cases. However, both agree that if a theory cannot guide intervention or explanation better than the rival, it should be deprecated.

  If neither party converts, the collaboration should be judged to have achieved success if it produces a precise map of the disagreement. Specifically, if we leave knowing exactly which empirical findings would change our minds, and which are merely verbal disputes about the extension of 'belief', the workshop will have succeeded. We aim to replace talking past one another with a structured disagreement where the residue is exact.
