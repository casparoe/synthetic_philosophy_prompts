          *   *Analysis:* The water wasn't overused (quantity), but the *quality* degraded due to under-investment in monitoring. This is a "Provision Problem" or "Maintenance Problem" rather than an "Appropriation Problem." Hardin's ToC is about *taking too much*. This is about *putting too little in* (maintenance/trust).
          *   *Verdict:* It *is* a collective action failure, but technically distinct from Hardin's "Tragedy of the Commons" (which is rivalrous depletion). However, in broader discourse, people often lump maintenance failures under "commons tragedies." To be precise, it's a "Free Rider Problem" regarding the *safety* aspect (a public good).

  4.  **Identify the Unifying Principle:**
