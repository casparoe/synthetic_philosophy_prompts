          *   5 is a Public Good (Non-rival). No depletion possible.
          *   6 is the tricky one. It's a CPR (water) + Public Good (safety info). The failure is on the Public Good side (monitoring).
      *   **The Well vs. Carbon:** Carbon is over-appropriation. Well is under-provision. Both are collective action failures, but different *types*.
