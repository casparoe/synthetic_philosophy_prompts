  3.  **Evaluate the User's Six Cases:**

      *   *Case 1 (Co-op):* CPR + Governance. User says "No tragedy." -> **Correct.** Ostrom's work shows governance solves ToC.
      *   *Case 2 (Open Fishing):* CPR + No Governance. User says "Tragedy." -> **Correct.** Classic Hardin/ToC.
      *   *Case 3 (Pasture):* CPR + Social Norms. User says "Managed commons, not tragedy." -> **Correct.** Informal governance counts as governance.
