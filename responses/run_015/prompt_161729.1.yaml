  # SEMINAR DIAGNOSTIC: THE METAPHYSICS OF DISPOSITIONS

  **Instructions:** Read the **Battery of Cases** below. For each, select the verdict that matches your intuition. Follow the **Decision Tree** using your verdicts to locate your metaphysical position. Consult the **Logical Space** analysis to see what your position entails and what alternatives remain unoccupied.

  **Terms of Art:**
  *   **Disposition (D):** A property like *fragility* or *solubility*.
  *   **Stimulus (C):** The condition triggering the disposition (e.g., *being struck*).
  *   **Manifestation (M):** The outcome of the disposition (e.g., *shattering*).
  *   **Basis:** The categorical property underlying the disposition (e.g., *molecular structure*).
  *   **Counterfactual:** A statement of the form "If C were the case, M would occur."

  ---

  ## SIDE 1: THE BATTERY OF CASES

  **1. The Plain Fink**
  A fragile glass is about to be struck (C). Instantly before impact, a wizard casts a spell making the glass tough (removing fragility). The glass is struck but does not shatter (no M).
  *   **Verdict A:** The glass is **not fragile** (because it did not shatter).
  *   **Verdict B:** The glass is **fragile** (until the spell hit).

  **2. The Mimic**
  A robust glass (strong lattice) has a sensor. If struck (C), the sensor detonates an internal charge, shattering the glass (M).
  *   **Verdict A:** The glass is **fragile** (because it shatters when struck).
  *   **Verdict B:** The glass is **not fragile** (because its structure is strong).

  **3. The Plain Mask**
  A fragile glass is packed in shock-absorbing foam. It is struck (C). The foam absorbs the blow; the glass does not shatter (no M).
  *   **Verdict A:** The glass is **not fragile** (because it did not shatter).
  *   **Verdict B:** The glass is **fragile** (the foam hid the fragility).

  **4. The Intrinsic Mask**
  A pill is poisonous. It contains an intrinsic enzyme that neutralizes the poison immediately upon swallowing (C). No harm occurs (no M).
  *   **Verdict A:** The pill is **not poisonous** (internal conditions prevent harm).
  *   **Verdict B:** The pill is **poisonous** (the toxicity is intrinsic).

  **5. The Coincidence**
  A fragile glass is packed in foam (Masked). It is struck (C). Simultaneously, lightning strikes the glass, shattering it (M) exactly as if it had been unmasked.
  *   **Verdict A:** The counterfactual "If struck, would shatter" is **True**.
  *   **Verdict B:** The counterfactual "If struck, would shatter" is **False**.

  **6. The Delayed Fink**
  A sugar cube is disposed to dissolve. Plunged in water (C), dissolving begins (M). Mid-dissolve, the water chemically hardens the remaining sugar (destroying the basis).
  *   **Verdict A:** The disposition was **present** at the start.
  *   **Verdict B:** The disposition was **absent** (because it could not complete).

  **7. The Self-Dissolving Mask**
  A seed is disposed to germinate (M) when wet (C). It has a hard shell (Mask). Water (C) dissolves the shell. Germination follows later.
  *   **Verdict A:** The seed is **disposed** to germinate when wet.
  *   **Verdict B:** The seed is **not disposed** (shell prevents immediate response).

  **8. The Unrealizable Stimulus**
  An electron is disposed to accelerate at $2c$ if pushed to $2c$. Physics forbids pushing to $2c$.
  *   **Verdict A:** The disposition is **present** (vacuously).
  *   **Verdict B:** The disposition is **absent** (stimulus impossible).

  **9. The Protected Disposition**
  A diamond is disposed to shatter if struck. It is sealed in an indestructible box. It can never be struck.
  *   **Verdict A:** The disposition is **present**.
  *   **Verdict B:** The disposition is **absent**.

  ---

  ## SIDE 2: THE DECISION TREE & LOGICAL SPACE

  **Start:** Go to **Q1**. Follow arrows based on your Verdicts above.

  **Q1. (Case 1: Plain Fink)** Is the glass fragile?
  *   **No** $\rightarrow$ **LEAF 1: Simple Conditional Analysis**
  *   **Yes** $\rightarrow$ Go to **Q2**.

  **Q2. (Case 2: Mimic)** Is the glass fragile?
  *   **Yes** $\rightarrow$ **LEAF 2: Extensional Equivalence** *(Label by move: tracks manifestation only)*
  *   **No** $\rightarrow$ Go to **Q3**.

  **Q3. (Case 3: Plain Mask)** Is the glass fragile?
  *   **No** $\rightarrow$ **LEAF 3: Strict Conditionalism** *(Label by move: requires unmasked manifestation)*
  *   **Yes** $\rightarrow$ Go to **Q4**.

  **Q4. (Cases 1 & 3)** How do you save the "Fragile" verdict?
  *   **Modify Stimulus** (C includes "no interferers") $\rightarrow$ **LEAF 4: Revised Conditional Analysis** *(Lewis)*
  *   **Require Basis Causation** (M must stem from Basis) $\rightarrow$ **LEAF 5: Causal Basis View** *(Label by move)*
  *   **Require Basis Persistence** (Basis must survive C) $\rightarrow$ Go to **Q5**.

  **Q5. (Case 7: Self-Dissolving Mask)** Do dispositions admit of degrees/thresholds?
  *   **Yes** $\rightarrow$ **LEAF 6: Gradable Dispositionalism** *(Label by move)*
  *   **No** $\rightarrow$ Go to **Q6**.

  **Q6.** Are dispositions reducible to (Categorical Basis + Counterfactual)?
  *   **No** $\rightarrow$ **LEAF 7: Dispositional Essentialism** *(Bird/Ellis)*
  *   **Yes** $\rightarrow$ Go to **Q7**.

  **Q7. (Case 8: Unrealizable)** Is the counterfactual true when C is impossible?
  *   **Yes** $\rightarrow$ **LEAF 8: Vacuous Reductionism** *(Label by move)*
  *   **No** $\rightarrow$ **LEAF 9: Modal Reductionism** *(Label by move)*

  ---

  ### LEAF DESCRIPTIONS
  1.  **Simple Conditional Analysis:** Dispositions are identical to counterfactual conditionals. *Awkward Commitment:* You must deny the glass is fragile in the Fink case.
  2.  **Extensional Equivalence:** Disposition ascription tracks manifestation occurrence regardless of structure. *Awkward Commitment:* You must call the robust Mimic-glass fragile.
  3.  **Strict Conditionalism:** Dispositions require successful manifestation in actual conditions. *Awkward Commitment:* Packing foam destroys fragility.
  4.  **Revised Conditional Analysis:** Stimulus conditions include *ceteris paribus* clauses excluding finks/masks. *Awkward Commitment:* Dispositions become extrinsic and multi-track.
  5.  **Causal Basis View:** Dispositions require the basis to cause the manifestation. *Awkward Commitment:* Struggles with pre-emptive causation cases.
  6.  **Gradable Dispositionalism:** Dispositions are scalar properties handled by thresholds. *Awkward Commitment:* Thresholds for ascription are arbitrary.
  7.  **Dispositional Essentialism:** Dispositions are fundamental, irreducible ontological categories. *Awkward Commitment:* Modal facts are brute and unexplained.
  8.  **Vacuous Reductionism:** Dispositions are bases + conditionals that are vacuously true if C is impossible. *Awkward Commitment:* Attributes dispositions for physically impossible stimuli.
  9.  **Modal Reductionism:** Dispositions are bases + conditionals that require possible stimuli. *Awkward Commitment:* Indestructible objects in protected cases lack dispositions.

  ---

  ### LOGICAL SPACE ANALYSIS

  **Occupied Positions:** The tree maps the live options in contemporary metaphysics, from reductive conditional analyses (Leaves 1, 4, 8, 9) to primitivist realism (Leaf 7).

  **Unoccupied Combinations:**
  *   *Intrinsic Dispositions + Extrinsic Stimulus:* **Incoherent.** If the stimulus references the environment, the disposition cannot be purely intrinsic.
  *   *Reductive + Primitive Modality:* **Incoherent.** Reduction eliminates primitive modality by definition.
  *   *Gradable + Simple Conditional:* **Unexplored.** SCA is typically binary; a gradable SCA lacks formal development.
  *   *Extensional + Intrinsic:* **Unattractive.** If manifestation alone suffices, intrinsic structure becomes irrelevant to the ascription.

  **Inseparable Leaves:** Leaves 8 and 9 are separated only by the Unrealizable Case; they are otherwise structurally identical reductionist views.

  **Diagnostic Note:**
  *   **Most Classificatory Question:** **Q4** (How to handle Fink/Mask). This distinguishes the major research programs (Conditional Revision vs. Causal Basis vs. Primitivism).
  *   **Problematic Case:** **Case 5 (Coincidence).** No position handles this cleanly; most must deny the counterfactual is true, conflicting with standard semantics, or accept the disposition is present for the wrong reason.
