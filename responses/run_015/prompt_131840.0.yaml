  The self-locating reading earns its keep not by mapping Leonard onto Beauty directly, but by exposing the gap between *updating* on self-locating evidence (Beauty) and *engineering* it (Leonard), shifting the epistemological question from credence calibration to diachronic agency.

  The disanalogy must be handled head-on: Sleeping Beauty's uncertainty is purely *de se* (which awakening is this?), while Leonard's is largely *de dicto* (what happened before?). Beauty knows the experiment's structure; Leonard does not know if his investigation is complete or if his notes are true. Consequently, the self-locating apparatus survives only if we treat Leonard's artifacts not as memory traces but as indexical markers generated by a policy. The question shifts from "Where am I in the experiment?" to "Is the channel from my past self reliable?" If a note is treated as testimony, the "self" is fragmented into a chain of agents linked by unreliable transmission. The SB model assumes a single agent undergoing duplication; *Memento* suggests a succession of agents where the past self may be a liar. The analogy holds only insofar as both cases involve evidence whose evidential force depends on the generation policy rather than the content alone.

  In your Forged-Note Beauty case, the divergence between Halfer and Thirder rules clarifies this policy dependence. Let $C$ be the event of finding the card.
  Under the **Thirder rule** (counting centers): There are three equiprobable awakening-centers ($H_1, T_1, T_2$). $C$ occurs at $H_1$ with probability $p$, at $T_1$ with $p$, and at $T_2$ with $1$.
  $P(C) = \frac{1}{3}p + \frac{1}{3}p + \frac{1}{3}(1) = \frac{2p+1}{3}$.
  $P(T \cap C) = \frac{1}{3}p + \frac{1}{3}(1) = \frac{p+1}{3}$.
  $P(T|C) = \frac{p+1}{2p+1}$.

  Under the **Halfer rule** (counting worlds): Prior $P(T)=1/2$. Likelihood $P(C|H) = p$. Likelihood $P(C|T)$ assumes indifference between awakenings within the T-world, so $\frac{1}{2}(p) + \frac{1}{2}(1) = \frac{p+1}{2}$.
  $P(T|C) = \frac{\frac{p+1}{2} \cdot \frac{1}{2}}{\frac{p+1}{2} \cdot \frac{1}{2} + p \cdot \frac{1}{2}} = \frac{p+1}{3p+1}$.

  The answers come apart for all $0 < p < 1$. At the limits, they converge: if $p=0$ (no forgeries), both yield 1 (the card guarantees Tails); if $p=1$ (always forged), both revert to their baselines (Thirder 2/3, Halfer 1/2) because the card becomes uninformative. The gap tracks the baseline disagreement but is modulated by $p$; the Thirder is always more sensitive to the card because they weight the $T_2$ center (where the card is certain) more heavily than the Halfer weights the T-world. The moral is that the card's evidential force derives entirely from the policy governing the channel, not from the fact that it is "self-generated." Even if the note comes from oneself, if the generation process is noisy, it functions like external testimony.

  Applying this to *Memento*, Leonard's tattoos and Polaroids function as the "Cards." He operates as a Thirder who assumes $p=0$ (infallible past self), treating every note as a certain marker of truth. The film, however, suggests $p \approx 1$. In the scene where he burns the photograph of the man he believes he has killed, Leonard destroys evidence that would update his credence to "Task Complete." He prefers high uncertainty to maintain purpose. The Sammy Jankis subplot raises the stakes: if Leonard is Sammy, his notes are delusions ($p=1$ forgery on all awakenings), collapsing the distinction between memory and testimony entirely.

  The closing stretch presents the hardest version of the problem. Leonard hears the truth from Teddy, decides to ignore it, and writes a note ("Don't believe his lies") for his future self. This is strategic forgery. He deliberately sets $p=1$ for the next cycle to ensure his future self believes the quest continues. This is not representable as a standard policy choice in the driver-who-cannot-remember-which-exit case, because the driver wants to exit; Leonard wants to *remain driving*. It is not straightforward self-deception, because he is fully conscious of the deception at the time of writing. It is a point where a purely credal treatment runs out: Leonard is not optimizing for truth, but for agency. He chooses to make his own future centered evidence less informative to remain able to act at all.

  Your worry is right: Sleeping Beauty assumes settled non-indexical facts, whereas the film is agnostic about whether the final revelation is true. This makes the film a poor illustration of the *calibration* problem central to SB. However, this is not fatal; it is productive. The standard cases treat the inability to self-locate as an externally imposed handicap and ask for the correct number. *Memento* treats it as something the agent builds technologies against, and in the end sabotages. The film adds what the literature lacks: the concept of *volitional self-locating belief*. It shows that when self-locating evidence is endogenous, the rational agent may choose to corrupt the channel to preserve the narrative required for action.
