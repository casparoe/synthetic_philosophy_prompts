          *   *User's understanding:* "Self-referential sentences just aren't allowed."
          *   *Correction:* Tarski doesn't ban self-reference *per se* by fiat; he bans it by making truth predicates indexed to levels ($T_1, T_2, \dots$). A sentence in $L_1$ can only predicate truth of sentences in $L_0$. Therefore, a sentence cannot predicate truth of *itself* because it belongs to a higher level than its object.
          *   *Truth-Teller:* "This sentence is true." In Tarski's system, this is ill-formed. You can't say "$T_i(\ulcorner \phi \urcorner)$" if $\phi$ is in $L_i$. It must be in $L_{i-1}$. So, "This sentence [$L_i$] is true [$L_i$]" is syntactically meaningless.
          *   *Verdict:* Yes, Tarski rules it out. It *is* "overkill" in the sense that it sacrifices expressiveness to save consistency. This is a known criticism (the "expressive incompleteness" objection). The user's intuition is correct: Tarski treats Liar and Truth-Teller the same (both ungrammatical).

      *   **Kripke (Fixed Points / Groundedness):**
          *   *User's understanding:* "Lets the sentence in but says it lands in a gap."
          *   *Correction:* Kripke distinguishes between *ungrounded* and *grounded* sentences.
          *   *Liar:* Ungrounded. No truth value (gap).
          *   *Truth-Teller:* Also ungrounded! It has no "anchor" in the non-semantic facts. It *could* be true, or it *could* be false, consistently. But since nothing forces it one way or the other, Kripke's minimal fixed point assigns it *no truth value* (gap).
          *   *Verdict:* The user is right to worry. Kripke *does* treat the Liar and Truth-Teller similarly (both end up in the gap). However, there's a nuance: The Liar *cannot* have a value (contradiction), while the Truth-Teller *could* have a value (consistent) but doesn't *get* one in the minimal fixed point. Some Kripkeans might allow "intrinsic" truth values or use different fixed points, but for a standard intro, they both land in the gap.
          *   *Reframing:* Is this a bug or a feature? Kripke's point is that truth must be *grounded*. The Truth-Teller is ungrounded. So treating them similarly regarding truth-value assignment is actually consistent with the theory, even if it feels counterintuitive.

      *   **Priest (LP / Dialetheism):**
          *   *User's understanding:* "Lets it be both."
          *   *Correction:* Priest accepts the Liar as True and False (glut).
          *   *Truth-Teller:* In LP (Logic of Paradox), the Truth-Teller is usually evaluated as *True* (or at least, it can be consistently assigned True). Why? Because the constraint is $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$. If $\phi$ is "This is true", then $T \leftrightarrow T$. This is satisfied if $T$ is True. It is *also* satisfied if $T$ is False (in classical logic), but in LP, we want to maximize truth. Usually, dialetheists say the Truth-Teller is simply True (not a glut), because there's no contradiction forcing it to be false.
          *   *Verdict:* Priest distinguishes them! Liar = Glut (Both). Truth-Teller = True (classically true, no contradiction). This is the differentiator the user is looking for.

