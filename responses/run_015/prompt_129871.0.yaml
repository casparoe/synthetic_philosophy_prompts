      *   *Tarski's Levels:* Why levels if just banning? The levels *are* the mechanism of the ban. You can't just say "No self reference." You have to explain *why* a sentence like "Everything I say is true" is tricky. Tarski says: Truth is a predicate of a lower language. So levels explain *how* the ban works structurally.
