answer: |-
  ### Part 1: Brainstorming Diagnostic Questions

  Before drawing the lines of the tree, we need to identify the fault lines in people's intuitions. As a survey designer, I'm looking for questions that force a choice without using loaded terms like "qualia" or "functionalism." As a philosopher, I'm looking for questions that map onto genuine theoretical commitments.

  Here are the candidate questions I considered, and why I kept or discarded them for the final handout:

  1.  *Is consciousness fundamental?* (Keep. Distinguishes panpsychism immediately.)
  2.  *Do you need language to feel pain?* (Discard. Too easy to say "no" without thinking about infants vs. animals.)
  3.  *Do human babies feel pain before they know they are babies?* (Keep. Tests Higher-Order Thought theories without using the jargon.)
  4.  *If a robot screams, is it scared?* (Keep. Tests substrate independence/functionalism.)
  5.  *Can a bee learn?* (Too vague. Refine to: *Can a bee change its mind when a route is blocked?*)
  6.  *Do crabs feel pain if they rub their wounds?* (Keep. Tests the "pain behavior vs. reflex" distinction.)
  7.  *Is consciousness a light switch or a dimmer?* (Keep. Tests graded vs. sharp-line views.)
  8.  *If we aren't sure, should we protect them?* (Keep. Isolates the precautionary principle from the metaphysical verdict.)
  9.  *Does an animal need to recognize itself in a mirror to count?* (Keep. Tests self-awareness requirements.)
  10. *If an alien acted like a human, would it feel like a human?* (Keep. Tests behavioral criteria.)

  **Selection Strategy:** I will arrange these to filter from the most fundamental metaphysical commitments down to specific animal cases, ending with policy. This ensures the "Snack Guy" starts with easy concrete cases before hitting the heavy metaphysics.

  ***

  ### Part 2: The Consciousness Distribution Decision Tree

  **Instructions:** Start at **Node 1**. Answer the question honestly based on your gut reaction to the example, not what you think the "smart" answer is. Follow the arrow to the next node or to a **Leaf Position**.

  #### **Node 1: The Atom Test**
  Imagine the smallest possible piece of matter, like an electron. Could it have a tiny, simple experience (like a flash of light or a hum), or does experience *require* a complex brain?
  *   **Yes, even atoms might have tiny experiences:** Go to **Leaf A**.
  *   **No, you need a complex machine:** Go to **Node 2**.

  #### **Node 2: The Baby Test**
  Think of a human infant. They cry when hurt, but they don't know *who* they are yet. Do they feel the pain *before* they are old enough to think "I am in pain"?
  *   **No, you need to know you're hurting to feel it:** Go to **Leaf B**.
  *   **Yes, feeling comes before thinking about feeling:** Go to **Node 3**.

  #### **Node 3: The Robot Test**
  Imagine a robot made of metal and silicon. It is programmed to learn, avoid damage, and scream "Stop!" when you hit it. It acts exactly like a suffering dog. Is it possible it is actually suffering?
  *   **No, it's just code; biology is required:** Go to **Node 4**.
  *   **Yes, if it acts the part, the material doesn't matter:** Go to **Node 5**.

  #### **Node 4: The Mirror Test**
  Since biology is required, how complex does the brain need to be? Does an animal need to recognize itself in a mirror (knowing "That's me") to have real experiences?
  *   **Yes, self-awareness is the key:** Go to **Leaf B** (Same as Node 2).
  *   **No, simpler brains can feel:** Go to **Node 6**.

  #### **Node 5: The Bee Test**
  Back to the robot/functional view. A honeybee has a tiny brain, but it can learn new routes when flowers move. It stops and "thinks" rather than just reacting. Does this flexible learning count as consciousness?
  *   **No, that's just automatic processing:** Go to **Node 6**.
  *   **Yes, flexible attention is enough:** Go to **Leaf C**.

  #### **Node 6: The Crab Test**
  A crab gets injured. It rubs the wound for hours and avoids the place where it got hurt, even if food is there. But it has no cortex (the part of the brain humans use for pain). Is it suffering?
  *   **No, that's just a reflex loop:** Go to **Node 7**.
  *   **Yes, nursing a wound implies feeling:** Go to **Node 8**.

  #### **Node 7: The Report Test**
  If an animal can't tell us it feels (no language, no mirror test), should we assume it's a "philosophical zombie" (acts alive but feels nothing)?
  *   **Yes, no report means no feeling:** Go to **Leaf B** (Same as Node 2).
  *   **No, we just can't know for sure:** Go to **Node 8**.

  #### **Node 8: The Dimmer Test**
  Is consciousness an on/off switch (you either have it or you don't), or is it a dimmer light (some animals have a little, some have a lot)?
  *   **On/Off Switch:** Go to **Node 9**.
  *   **Dimmer Switch:** Go to **Leaf D**.

  #### **Node 9: The Line Drawing Test**
  If it's an on/off switch, where do you draw the line?
  *   **Very high bar (Only humans/primates):** Go to **Leaf B**.
  *   **Low bar (Mammals and Birds):** Go to **Leaf E**.
  *   **Very low bar (Includes Insects):** Go to **Leaf C**.

  #### **Node 10: The Doubt Test**
  (Ask this regardless of your previous answers). You've made your best guess, but you know you might be wrong. Should we treat animals *as if* they are conscious just to be safe?
  *   **Yes, act as if they feel:** Go to **Leaf F**.
  *   **No, tell the truth as I see it:** Return to your previous Leaf.

  ***

  ### Part 3: The Leaves (Your Position)

  **Leaf A: The Panpsychist**
  *   **View:** Consciousness is a fundamental property of the universe, like mass or charge.
  *   **Distribution:** Potentially everywhere, but complex consciousness only in complex systems.
  *   **Note:** You might agree with the Liberal view (Leaf C) on animals, but for a different reason. *These two leaves are often indistinguishable in practice.*

  **Leaf B: The Higher-Order Skeptic**
  *   **View:** To feel pain, you must be able to think about the pain. "I am hurting."
  *   **Distribution:** Restricted to creatures with advanced self-awareness (likely only humans, maybe great apes). Infants and dogs might be "biological robots."
  *   **Coherence Flag:** If you landed here via Node 1 (Panpsychism) and Node 2 (No Baby Pain), your view is **tense**. Panpsychism usually implies experience is easy to get; Skepticism implies it is hard. You may hold a dualist religious view instead.

  **Leaf C: The Liberal Functionalist (Barron/Klein Style)**
  *   **View:** Consciousness is about how information is managed (attention, learning), not what you are made of.
  *   **Distribution:** Extends to insects (bees, ants) and robots if they are complex enough.
  *   **Note:** If you are also a Panpsychist (Leaf A), you agree on the insects but disagree on *why*.

  **Leaf D: The Graded Gating View**
  *   **View:** Sentience fades in gradually. There is no sharp line.
  *   **Distribution:** Cephalopods and Crustaceans are in a "grey zone" of partial sentience. Mammals are fully conscious; worms are barely.
  *   **Note:** This view avoids the awkwardness of drawing a line between a bee and a crab.

  **Leaf E: The Conservative Biological Naturalist**
  *   **View:** You need specific biological hardware (like a cortex or specific neural architecture).
  *   **Distribution:** Mammals and Birds yes. Insects, Crabs, and Robots no.
  *   **Coherence Flag:** If you said "Yes" to the Robot Test (Node 3) but landed here, you have a **contradiction**. You cannot require biology if you admitted a robot could feel.

  **Leaf F: The Precautionary Agnostic**
  *   **View:** We cannot know the metaphysical truth, but ethics requires us to act.
  *   **Distribution:** Technically "Unknown," but practically "Treat everyone as conscious."
  *   **Note:** This overrides any other leaf. You can be a Skeptic (Leaf B) metaphysically but a Precautionary (Leaf F) ethically.

  ***

  ### Part 4: Meta-Note (For the Discussion Group)

  **Turn the Instrument on Itself**

  Before you argue about the crabs, look at the tree. This handout is not neutral. It sneaks in assumptions that you should challenge during the discussion:

  1.  **The "Baby" Assumption (Node 2):** The tree assumes everyone agrees babies feel pain. If you think babies are also "unconscious" until language develops, the tree forces you into the Skeptic box (Leaf B) too early.
  2.  **The "Robot" Bias (Node 3):** By asking about robots, I am pushing you toward Functionalism. If you believe consciousness is magical or soul-based, this question feels like a trap.
  3.  **The "Dimmer" Trap (Node 8):** I present "On/Off" and "Dimmer" as the only options. Some philosophers argue consciousness is *multidimensional* (you can have more pain but less self-awareness). The tree flattens this.
  4.  **The Precautionary Override (Node 10):** I separated the *metaphysical* question (Are they?) from the *ethical* question (How do we treat them?). But for many of you, the answer to "Are they?" *is* "We treat them as if." The tree forces a separation that might not exist in your worldview.

  **Discussion Task:** Find the node where you felt the question didn't capture your view. That is where the real philosophy begins. Enjoy the snacks.
