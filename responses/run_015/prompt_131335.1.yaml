      *   *Issue:* "Treating 'I have derived X' as direct, unrevisable evidence for X" sounds like adding $\Box P \to P$ as an axiom. But AI systems don't necessarily operate by adding this as a *logical axiom* within the object language. They might use a meta-language, or a hierarchy of levels (Tarski), or probabilistic reasoning.
