answer: |-
  # Philosophy of Language: Final Examination

  **Question 4 (25 Marks)**

  Consider the following scenario regarding the natural kind term "jade."

  On **Earth**, speakers apply the term "jade" to objects sharing a cluster of macro-properties (green coloration, specific hardness, translucency). However, Earth's mineralogical experts are genuinely divided: some argue jadeite and nephrite constitute two distinct natural kinds, while others argue they are variants of a single kind. Lay speakers defer to this expert community but remain unaware of the underlying mineralogy.

  On **Twin Earth**, objects designated as "jade" possess identical macro-properties to Earth jade. However, the underlying chemical structures are entirely different minerals that match neither jadeite nor nephrite. Furthermore, Twin Earth's expert community is unanimous: they agree definitively that their local substance constitutes exactly one natural kind.

  Based *only* on the conceptual machinery of semantic externalism and the division of linguistic labor, answer the following:

  1.  Do Earth and Twin Earth speakers share the same reference for "jade"? Justify your answer using the externalist framework.
  2.  Does the ontological disagreement among Earth experts undermine the externalist claim that reference is fixed by actual environmental kinds?
  3.  Can an internalist descriptivist account accommodate this case without committing ordinary speakers to massive reference failure?

  *(Suggested time: 45 minutes)*

  ***

  # Model Answer

  **Response to Question 4**

  According to semantic externalism, the reference of natural kind terms is not determined solely by the psychological states of individual speakers or the macroscopic descriptions they associate with a term. Instead, reference is fixed by the actual underlying structure of the stuff in the environment to which the term is causally linked. Applying this to the jade scenario, Earth and Twin Earth speakers do not share the same reference. Although the macro-properties and internal mental states of the speakers are identical, the underlying physical constitutions differ. On Earth, "jade" picks out jadeite, nephrite, or a disjunction of both. On Twin Earth, "jade" picks out a distinct mineral structure. Following Putnam's intuition that "meaning ain't in the head," the extension of the term differs across worlds despite identical internal descriptions. Therefore, the reference diverges because the causal anchors—the actual minerals—are distinct.

  The ontological disagreement among Earth experts does not undermine the externalist claim that reference is fixed by actual environmental kinds. Externalism relies on the division of linguistic labor, where lay speakers defer to experts to fix the extension of technical terms. However, this deference is to the *stuff* the experts investigate, not necessarily to their theoretical consensus. The reference is anchored by the causal interaction between the linguistic community and the physical substrate. Whether experts classify that substrate as one kind or two is a matter of theoretical taxonomy, not semantic reference. The term "jade" successfully refers to the physical material present on Earth regardless of whether that material is best categorized as a single kind or a disjunction. The disagreement affects the *classification* of the kind, not the *fixing* of the reference. As long as there is a causal chain linking the use of the word to the mineral samples, externalism holds. The Twin Earth unanimity is irrelevant to Earth's reference; it merely highlights that Twin Earth experts are fixing reference to a different substance based on their local environment.

  An internalist descriptivist account faces significant difficulties accommodating this case without implying massive reference failure. Descriptivism suggests that the meaning of "jade" is equivalent to the cluster of macro-properties known to the speaker (green, hard, translucent). If this were true, Earth and Twin Earth speakers would share the same meaning and reference, as the macro-properties are identical. However, this contradicts the scientific intuition that jade is defined by its mineralogy. If the descriptivist insists meaning is purely macroscopic, they must admit that if no underlying unity exists (as per the divided Earth experts), the term refers to nothing real, leading to reference failure for ordinary speakers who assume "jade" names a natural kind. Alternatively, if the descriptivist incorporates the expert view into the meaning, they must explain how speakers possess this knowledge when they explicitly lack it. Externalism avoids this by allowing speakers to refer successfully via causal deference even while ignorant of the underlying essence. Thus, descriptivism either collapses the distinction between Earth and Twin Earth jade incorrectly or forces the conclusion that ordinary speakers are systematically mistaken about the existence of the kind they name.

  In conclusion, externalism correctly predicts divergent reference based on underlying structure, survives expert disagreement by distinguishing causal anchoring from theoretical taxonomy, and avoids the reference failure problems that plague descriptivist accounts of natural kind terms.

  ***

  # Marking Scheme (Total: 25 Marks)

  ### Part 1: Reference Determination (8 Marks)
  *   **8–7 Marks:** Clearly states reference differs. Explicitly links this to underlying structure/constitution rather than macro-properties. Correctly identifies that identical internal states do not guarantee identical reference (Putnamian intuition).
  *   **6–4 Marks:** States reference differs but relies vaguely on "science" without explaining the externalist mechanism (causal link/underlying structure). May confuse sense and reference.
  *   **3–0 Marks:** Claims reference is the same because macro-properties match. Fails to apply externalist framework.

  ### Part 2: Expert Disagreement & Externalism (8 Marks)
  *   **8–7 Marks (A-Level):** Argues disagreement does *not* undermine externalism. Crucially distinguishes between **fixing reference** (causal contact with stuff) and **theoretical classification** (one kind vs. two). Explains that division of labor involves deference to the *investigation of the stuff*, not requiring expert consensus for reference to succeed. Acknowledges reference may be disjunctive (jadeite OR nephrite) without failing.
  *   **6–4 Marks (B-Level):** Argues disagreement does not undermine externalism but treats the division of linguistic labor as requiring expert consensus. Struggles to explain why reference holds despite the lack of agreement on "one kind." May suggest reference is "unclear" rather than fixed by the stuff itself.
  *   **3–0 Marks:** Claims expert disagreement refutes externalism because reference requires a unified kind concept. Conflates semantic externalism with a specific causal-historical theory that demands uniformity.

  ### Part 3: Descriptivism & Reference Failure (6 Marks)
  *   **6–5 Marks:** Correctly identifies that descriptivism equates meaning with macro-properties. Explains that this leads to either false equivalence (Earth = Twin Earth) or reference failure (if "kind" unity is required but absent). Notes externalism handles speaker ignorance better.
  *   **4–2 Marks:** Identifies descriptivism relies on properties but fails to articulate the specific consequence regarding reference failure or the inability to capture natural kind intuitions.
  *   **1–0 Marks:** Defends descriptivism successfully (incorrect for this context) or fails to address the "reference failure" constraint in the prompt.

  ### Clarity and Structure (3 Marks)
  *   **3 Marks:** Logically organized, precise terminology, within word count constraints.
  *   **2 Marks:** Understandable but some ambiguity in terminology.
  *   **1–0 Marks:** Disorganized or difficult to follow.

  ### Specific Misconceptions (Penalties)
  *   **-3 Marks:** Treating expert disagreement as an automatic refutation of externalism (fails Part 2 logic).
  *   **-3 Marks:** Conflating semantic externalism with a causal theory of reference that requires a single unified essence (ignoring disjunctive kinds).
  *   **-3 Marks:** Assuming macro-property identity is sufficient for meaning/reference identity (fails Part 1 logic).
  *   **-2 Marks:** Explicitly citing authors/texts not permitted in closed-book conditions (e.g., "As Putnam wrote in 1975...").

  ### Grade Boundary Guidance
  *   **A-Level (20–25 Marks):** Must secure full marks in Part 2 by navigating the nuance of expert disagreement vs. causal anchoring. Must clearly distinguish between taxonomy and reference.
  *   **B-Level (15–19 Marks):** Securely answers Part 1 and Part 3 but treats Part 2 superficially (e.g., assumes experts must agree for reference to work).
  *   **C-Level (10–14 Marks):** Grasps basic Twin Earth intuition but falters on the specific modifications (expert disagreement/division of labor).
