answer: |-
  Here is a design for a 90-minute session called **"The Deep Well."** It is built to be run at a single long table with minimal materials, focusing on embodied choice rather than abstract discussion.

  ### Activity Overview
  **Title:** The Deep Well
  **Goal:** Participants manage a resource budget to complete "wells." Midway, the cost to finish spikes irrationally. However, hidden mechanics reward those who finish (Policy), allow those who quit to recover some value (Residual), and expose choices to the group (Signaling).
  **Materials:**
  *   **Tokens:** 200 small identical objects (poker chips, dried beans, or cut index cards).
  *   **Cards:** 22 "Well Cards" (index cards folded in half).
  *   **Board:** Whiteboard for scores.
  *   **Prize:** One tangible reward (e.g., a nice bottle of wine, a voucher, or a premium snack basket) for the top score.
  *   **Dice:** 2d6.

  ### The Setup (0–10 Minutes)
  1.  **Seating:** 22 adults around the long table.
  2.  **Endowment:** Give everyone **10 Tokens**. Explain that Tokens = Score. The person with the most Tokens at the end wins the prize.
  3.  **The Task:** Explain that everyone is drilling a well. There are **3 Rounds** of drilling tonight. Your total score across all three rounds counts.
  4.  **The Mechanic:**
      *   To start a Well, place 1 Token in the center "Pot."
      *   To deepen a Well (Round 2), place more Tokens.
      *   If you complete a Well (Round 3), the Bank pays you **8 Tokens**.
      *   If you abandon a Well, you get nothing from the Bank *unless* you salvage it (rules revealed later).
      *   **Constraint:** You cannot borrow Tokens. If you run out, you are "Bankrupt" and cannot participate in further rounds (you must watch).
  5.  **Silence Rule:** No talking about strategy during play.

  ### Round 1: The Trap (10–35 Minutes)
  *This round isolates the Sunk Cost Fallacy.*

  1.  **Investment (10–15 mins):** Everyone must decide whether to start a Well. Most will. They pay **1 Token** into the Pot. (Current Sunk Cost: 1).
  2.  **The Crisis (15–20 mins):** Announce: "Geological Survey Results." Hand everyone a die.
      *   Tell them: "To finish the well, you must reach Depth 3. You are currently at Depth 1."
      *   **The Kicker:** To reach Depth 2, the cost is now **6 Tokens** (instead of the expected 1). To reach Depth 3, the cost is **1 Token**.
      *   **Total Cost to Finish:** 1 (already paid) + 6 (now) + 1 (later) = **8 Tokens**.
      *   **Payout:** **8 Tokens**.
      *   **Net Gain:** **0**.
      *   **Cost to Quit:** You lose the 1 Token already paid. You keep your remaining 9 Tokens.
      *   **Math:** Finishing yields 0 profit. Quitting yields 9 tokens retained. Finishing is strictly dominated by quitting *unless* there are hidden variables.
  3.  **The Decision (20–30 mins):** Participants must secretly slide their decision to you (Facilitator) on a scrap of paper: **DIG** or **QUIT**.
      *   *Crucial:* Collect the tokens from those who choose DIG immediately. They now have 3 tokens left (10 - 1 - 6). Those who QUIT have 9 tokens left.
  4.  **Resolution (30–35 mins):**
      *   Those who DIG pay the final **1 Token**.
      *   Bank pays them **8 Tokens**.
      *   **Final State:**
          *   **Finishers:** Started with 10. Spent 8. Got 8. **End with 10.**
          *   **Quitters:** Started with 10. Spent 1. Got 0. **End with 9.**
      *   *Observation:* Mathematically, the Quitters are winning. The Finishers burned resources for no gain.
      *   *Public Reveal:* Write names on the whiteboard under "Finished" and "Abandoned." This triggers the Signaling wrinkle.

  ### Round 2: The Policy Payoff (35–55 Minutes)
  *This round tests Wrinkle 1 (Policy) and Wrinkle 2 (Residual Value).*

  1.  **New Rule Announcement:** "Because of the geological instability, we are changing the rules for Round 2."
  2.  **The Policy Bonus:** "Anyone who **Finished** a Well in Round 1 is now certified as a 'Senior Driller.' Senior Drillers pay only **1 Token** to complete a Well in Round 2 (Payout still 8)."
      *   *Effect:* Finishers from Round 1 can now make easy profit (Cost 1, Gain 8). Quitters must pay the standard high rate (Cost 6, Gain 8) or sit out.
      *   *Logic:* This retroactively validates the Round 1 decision *if* the player knew this was coming. Since they didn't, it simulates how life rewards "finishers" unpredictably.
  3.  **The Residual Value:** "Anyone who **Quit** in Round 1 receives a 'Salvage Card' (index card)."
      *   Salvage Card Rule: This card can be sold to any Senior Driller for **2 Tokens** *or* kept for Round 3.
      *   *Logic:* This simulates Wrinkle 2. The sunk cost wasn't totally lost; it bought an asset (the Salvage Card/Option) that has value, just not the original value.
  4.  **Play Round 2:** Run the drilling again with these asymmetric rules. Allow trading of Salvage Cards.
  5.  **Score Update:** Update the whiteboard. You will likely see the Round 1 Finishers pull ahead, despite their "irrational" Round 1 move.

  ### Round 3: The Social Market (55–65 Minutes)
  *This round tests Wrinkle 3 (Signaling).*

  1.  **Team Phase:** Participants must pair up. Pools of tokens are combined.
  2.  **The Constraint:** "You may only partner with someone whose name is on the 'Finished' list from Round 1."
      *   *Wait, this excludes Quitters.* **Correction:** "Partnerships involving a Round 1 Quitter require a **2 Token Fee** paid to the Bank."
      *   *Logic:* This simulates reputation risk. Partnering with a "Quitter" is perceived as risky, incurring a transaction cost.
  3.  **Final Drill:** Pairs drill one last well. Standard rates apply.
  4.  **Final Tally:** Count tokens. Award the prize.

  ### The Debrief (65–90 Minutes)
  *Do not use the term "Sunk Cost" until minute 80.*

  **Phase 1: The Autopsy (65–75 mins)**
  *   **Question:** "Look at the Round 1 math. Who lost tokens by finishing?" (Everyone sees Finishers ended with 10, Quitters with 9).
  *   **Question:** "Why did you finish?"
      *   *Expected Answers:* "I hated losing the first token," "I felt I'd come this far," "I hoped the rules would change."
  *   **Question:** "Why did you quit?"
      *   *Expected Answers:* "The math didn't work," "I wanted to keep my chips safe."
  *   **Labeling:** Now write **SUNK COST FALLACY** on the board. Define it: *Letting past irrecoverable costs influence a decision about future value.*
  *   **Mapping:** Point to Round 1. "This was the fallacy. The 1 Token was gone. The only question was: Is spending 7 more worth 8 back? No."

  **Phase 2: The Wrinkles (75–85 mins)**
  *   **Wrinkle 1 (Policy):** "In Round 2, the Finishers won. Does that mean the Fallacy is wrong?"
      *   *Guide them:* No. It means **Policy** has value. If you build a reputation for finishing, the world *might* reward you later (Round 2 Bonus). But you cannot know that in Round 1.
      *   *Takeaway:* "Act-by-act" reasoning says Quit. "Policy" reasoning says Finish. The tension is real.
  *   **Wrinkle 2 (Residual):** "Quitters got Salvage Cards. Did that make quitting easier?"
      *   *Guide them:* Sometimes a cost isn't sunk; it bought an asset (skill, scrap, option). If the half-built degree gets you a job elsewhere, it wasn't a sunk cost, it was an investment.
      *   *Takeaway:* Distinguish between "money gone" and "asset remaining."
  *   **Wrinkle 3 (Signaling):** "Round 3 charged a fee to partner with Quitters. How did that feel?"
      *   *Guide them:* Finishing signals reliability. That signal has market value, even if the project itself was a loss.
      *   *Takeaway:* You might finish a bad project to protect your brand. That is rational, but it's not about the project; it's about *you*.

  **Phase 3: Closing (85–90 mins)**
  *   **Final Question:** "Knowing what you know now, if we played Round 1 again *without* telling you about Rounds 2 or 3, what would you do?"
  *   **Goal:** Ideally, they admit they should still Quit, acknowledging that the Round 2/3 benefits were unknowable luck, not sound reasoning.
  *   **Final Thought:** "The Fallacy isn't that finishing is always wrong. It's that finishing *for the wrong reason* (because you already paid) is dangerous. Finish for the future, or for the policy, or for the signal. Never finish for the past."

  ---

  ### Predictable Failure Modes & Mitigations

  **1. "It's Only Points" (The Shrug)**
  *   **Prediction:** Participants treat tokens as abstract and make random choices.
  *   **Mitigation:** The Prize must be visible on the table from minute 0. The "Bankruptcy" rule (being forced to watch) is crucial. Social exclusion hurts more than point loss.
  *   **Backup:** If energy is low, make Round 3 a "vote." The group votes on who gets a bonus. People care deeply about peer judgment.

  **2. "I See What You're Doing" (Gaming the Hypothesis)**
  *   **Prediction:** A savvy participant realizes Round 1 is a trap and quits loudly to signal intelligence.
  *   **Mitigation:** Acknowledge it immediately. "Excellent. You spotted the math. But can you spot the policy?" In Round 2, quietly give the savvy quitter a hard time (higher costs) to simulate the real-world penalty for being a "smart quitter."
  *   **Debrief:** Use them. "This person avoided the fallacy. Did they lose out on the Policy Bonus? Yes. This is the trade-off."

  **3. The Loud Contrarian**
  *   **Prediction:** Someone argues passionately that finishing is *always* virtuous.
  *   **Mitigation:** Do not argue. Assign them the role of "Policy Advocate" in the debrief. Ask them to explain why the Round 1 Finishers were actually the smart ones. Let the group push back.
  *   **Risk:** They might derail the math.
  *   **Fix:** Write the math on the board (10 vs 9). Facts anchor the room.

  **4. Confusion Over Residual Value**
  *   **Prediction:** People argue the Round 1 cost wasn't sunk because they got a Salvage Card.
  *   **Mitigation:** Clarify in the debrief: "The Salvage Card was a rule I added *after* you decided. In real life, you don't know if there's salvage value until you stop. The Fallacy is assuming there *isn't* without checking."

  ---

  ### Frank Assessment of Limitations

  **1. The "Policy" Wrinkle Collapses into Rationality**
  *   **Critique:** If I reward finishers in Round 2, then finishing in Round 1 becomes a rational investment *if* the game is known to be a sequence.
  *   **Concession:** You cannot perfectly simulate "unknown unknowns." In the debrief, you must be explicit: "In this game, I rigged the policy reward. In life, the reward is probabilistic. The Fallacy is treating the reward as *guaranteed* because you paid."
  *   **Instruction:** Emphasize that the Round 2 bonus was **hidden information**. If they knew it in Round 1, finishing was rational. Since they didn't, it was a gamble. The Sunk Cost Fallacy is betting on the past, not hedging for the future.

  **2. Emotional Weight is Missing**
  *   **Critique:** Losing 1 token is not like losing 4 years of a degree or 10 years of a marriage. The "pain" of the sunk cost is intellectual here, not visceral.
  *   **Concession:** You cannot reproduce the emotional weight in 90 minutes.
  *   **Instruction:** You must supply this in words during the debrief. "Imagine that 1 Token was your savings. Imagine it was your relationship. The math is the same, but the pain is higher. The Fallacy gets stronger when the pain is higher."

  **3. The "Act vs. Policy" Tension**
  *   **Critique:** The activity suggests Policy reasoning justifies Sunk Cost reasoning.
  *   **Correction:** They are distinct. Policy reasoning says "I finish because I am a Finisher." Sunk Cost reasoning says "I finish because I already started."
  *   **Instruction:** Ensure the debrief draws a hard line here. "If you finish to protect your reputation, that is forward-looking (Rational). If you finish because you hate wasting the past, that is backward-looking (Fallacy). The action is the same; the reasoning is different."

  ### Timeline Summary

  *   **00–10:** Setup, Endowment, Rules (No theory).
  *   **10–35:** Round 1 (The Trap). Decision & Reveal.
  *   **35–55:** Round 2 (Policy & Residual). Asymmetric rules.
  *   **55–65:** Round 3 (Signaling). Partner penalties.
  *   **65–75:** Debrief Phase 1 (The Math & The Fallacy).
  *   **75–85:** Debrief Phase 2 (The 3 Wrinkles).
  *   **85–90:** Closing & Prize.

  This design forces them to *feel* the loss of quitting (Round 1), the vindication of finishing (Round 2), and the social cost of quitting (Round 3), giving you concrete hooks to hang the theory on without lecturing until the end.
