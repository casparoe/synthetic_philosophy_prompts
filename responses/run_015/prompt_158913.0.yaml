answer: |-
  This is a very sharp observation, and you are quite right to feel that slapping the label "Disjunction Problem" on it shuts down the very line of inquiry you wish to pursue. Your intuition is spot on: you have identified a methodological worry about *how* the theory is being applied, rather than a first-order problem about the extension of the theory itself.

  For your handout, I would suggest retaining your term **"The Calibration Worry"**. It is vivid, accurate, and does not carry the baggage of previous debates that might prejudice the students. However, to anchor it in the literature, you should note that it is a specific species of **The Underdetermination of Function Ascription**.

  Here is the carving you asked for, addressing your four points directly.

  ### 1. How does this differ from the Disjunction and Generality Problems?

  It is distinct from both, though it exacerbates them.

  *   **The Disjunction Problem (Fodor):** This is the problem of error. If a state is caused by cows, but also by horses-on-dark-nights, why is the content *cow* and not *cow-or-horse-on-a-dark-night*? The standard teleosemantic move is to appeal to selection history (it was selected for cows, not horses). Your worry is prior to this: you are asking how we individuate the "selection history" itself without already knowing the content. The Disjunction Problem assumes we can identify the function; you are asking how the function is identified in the first place.
  *   **The Generality Problem (Wedgwood, etc.):** This concerns the grain of type-individuation. Is the belief type *believing a fly is present* or *believing a small black moving thing is present*? Your worry explains *why* the Generality Problem is so intractable: theorists select the grain that yields the intuitive content. The Generality Problem is the symptom; your Calibration Worry is the diagnosis of the methodological cause.

  In short: The Disjunction and Generality problems are puzzles *within* the theory. Your worry is a puzzle *about* the theorists constructing the theory.

  ### 2. What kind of objection is this?

  It is best characterised as an objection from **Methodological Circularity** leading to **Empirical Underdetermination**.

  *   **Circularity:** It is not logical circularity (the conclusion is not in the premises). It is *epistemic* circularity. The theory claims to explain content facts using natural facts (history + consumer role). However, if the description of those natural facts is adjusted to match the content facts we already accept, the explanation is vacuous. We are using the *explanandum* (content) to fix the *explanans* (function).
  *   **Underdetermination:** The natural facts (the causal history and the downstream effects) do not uniquely determine the function ascription. There are multiple descriptions of the history and multiple descriptions of the consumer role that are compatible with the physical facts. The choice between them is being made on the basis of semantic intuition, not naturalistic evidence.

  ### 3. Is it fatal, or just a constraint?

  This turns precisely on the point you suspected: **Reduction vs. Systematisation.**

  *   **Fatal for Strong Reductionism:** If the project is to *reduce* semantic properties to non-semantic natural properties (such that a being with no prior grasp of content could, in principle, identify the content), the Calibration Worry is fatal. If you need semantic intuition to tune the machinery, you have not eliminated the semantic; you have merely hidden it in the parameter settings.
  *   **A Constraint for Systematisation:** If the project is *normative systematisation* (à la later Dennett or perhaps Millikan's more pragmatic moments), the worry is a constraint. The goal here is not to derive content from scratch, but to make our existing content ascriptions compatible with a scientific worldview. In this view, it is permissible for the theory to be "tuned" to our intuitions, provided it offers a coherent framework for resolving conflicts between them.

  You should tell your students that if a naturalist claims to be offering a reductive analysis, they must answer the Calibration Worry. If they are offering a rational reconstruction, they must admit the circle is benign.

  ### 4. What do the boundary cases look like?

  To distinguish legitimate convergence from curve-fitting, you need a **Novelty Test**.

  *   **Legitimate Convergence (Prediction):** The theory identifies the function via independent criteria (e.g., genetic knockout studies, comparative anatomy, or physiological constraints) *before* the content is assessed. If the theory predicts that a novel mechanism has content *X*, and our intuition agrees, that is genuine convergence. The history and consumer stories are fixed by evidence external to semantics.
  *   **Curve-Fitting (Accommodation):** The description of the function shifts whenever the intuition is threatened.
      *   *Case:* A frog flicks at a fly. Theorist says: "Content is *fly*."
      *   *Challenge:* "What if it flicks at a BB pellet?"
      *   *Curve-fit:* "Ah, the function is actually *small-dark-moving-thing*."
      *   *Challenge:* "But it only evolved in environments with flies."
      *   *Curve-fit:* "No, the function is *fly*, the BB is a mistake."
      *   *Diagnosis:* If the description of the function changes solely to preserve the intuitive content assignment in the face of counter-examples, it is curve-fitting.

  **To convince yourself it has been noticed before:**
  Look for discussions on **"The Individuation of Functions"** in teleosemantics (Godfrey-Smith is useful here, as is Neander). If you find a theorist specifying the function *without* referencing the representational capacity of the organism, they are attempting to solve the Calibration Worry. If they define the function as "the capacity that contributes to the representation of X," they are succumbing to it.

  ### Summary for the Handout

  **Term:** The Calibration Worry (or The Underdetermination of Function Ascription).

  **Definition:** The methodological suspicion that in naturalistic theories of content, the ascription of biological function (etiology) and consumer role are mutually adjusted to ensure the output matches pre-theoretic semantic intuitions, rather than being fixed by independent naturalistic criteria.

  **The Stakes:**
  1.  **If Reductive:** The theory fails, as it presupposes the very notion it seeks to explain.
  2.  **If Systematic:** The theory survives, but must admit it is clarifying our concepts, not replacing them.

  **The Test:** Can the theory predict content ascriptions in novel or pathological cases where our intuitions are unclear, or does it only accommodate cases where we already know the answer?

  I hope this helps you get the seminar moving. It is a sophisticated niggle, and one that deserves to be aired properly.
