      *   *Generality Problem (Wedgwood/others):* How to specify the type of belief/process. Is it "believing a fly is present" or "believing a small black moving thing is present"? The user mentions this ("grain question"), but their worry is *why* we pick one grain over another. It's the *meta-worry* about the Generality Problem.
