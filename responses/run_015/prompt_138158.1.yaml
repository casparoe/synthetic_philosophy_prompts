      *   *Chunk 7 (No Way Things Seem):* "Strictly speaking, there is no such thing as the way things seem to us at all." *Verdict:* **Major Red Flag.** Dennett explicitly distinguishes between "phenomenology" (as philosophers conceive it) and "heterophenomenology" (what people *say* seems to be the case). He doesn't deny things seem a certain way; he denies there is a *private, non-physical realm* of seemings. He reduces "seeming" to judgments/reactive dispositions, but saying "there is no such thing as the way things seem" is often read as eliminativism about consciousness itself, which Dennett resists (he's a realist about consciousness, just not qualia). This is where the professor's warning is most relevant.

