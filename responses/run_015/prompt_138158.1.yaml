      *Refining the "Verificationism" point:* Dennett denies being a verificationist. He argues that if a property makes no causal difference (is epiphenomenal), it isn't real. The summary frames it as "we can't tell, therefore it doesn't exist." Dennett frames it as "if we can't tell even in principle, the property does no work, therefore it doesn't exist." It's a subtle difference but important for a philosophy paper.

      *Refining the "Infallibility" point:* The summary says "infallibly accessible." Dennett's four marks are Ineffable, Intrinsic, Private, Directly Apprehensible. "Incorrigible" is often associated with Direct Apprehension. Calling it "infallible" is a slight conflation but functionally similar in this context. I should note it's a slight exaggeration but not the main error.

