  # JOINT STATEMENT ON THE MORAL AND METAPHYSICAL STATUS OF KILLING VERSUS LETTING DIE

  **Issued by the Adversarial Collaboration between the Causal-Source Camp and the Institutional-Role Camp**

  ## I. Agreed Claims

  Both camps endorse the following six claims as a baseline for continued dialogue, acknowledging shared observations regarding linguistics, intuition, law, and technology without committing to a shared metaphysical explanation for these observations.

  1.  **Grammatical Distinction:** There exists a robust grammatical and conceptual distinction between acts of commission (actions) and acts of omission (failures to act), which maps loosely onto the distinction between killing and letting die, though the mapping is not perfectly isomorphic in all linguistic contexts.
  2.  **Intuitive Asymmetry in Direct Cases:** In standard, direct cases where an agent possesses no special duty of care, there is a stable pre-theoretical intuition that administering a lethal agent constitutes a morally weightier intervention than failing to supply an antidote or life-sustaining resource that one is not obligated to provide.
  3.  **Legal Codification:** Most contemporary legal jurisdictions codify this asymmetry, distinguishing sharply between active homicide and the failure to rescue, assigning stricter liability and heavier penalties to the former while limiting liability for the latter to specific statutory or contractual exceptions.
  4.  **Instability in Complex Causal Chains:** The clarity of the distinction collapses or becomes highly ambiguous in cases involving indirect causation, causal preemption, or overdetermination, where multiple sufficient causal pathways exist and the agent's contribution is difficult to isolate as either a novel initiation or a mere absence of prevention.
  5.  **Rejection of Purely Affective Explanations:** Both camps reject the hypothesis that the moral asymmetry between killing and letting die is explained solely by contingent psychological factors, such as emotional vividness or cognitive bias; both agree that the distinction purports to track something objective about the situation, whether causal or normative.
  6.  **Technological Mediation:** The introduction of technological mediation—specifically, an automated system with transparent decision rules that either actively withdraws life support or passively declines to initiate it—does not by itself dissolve the conceptual problem, as the question remains whether the machine's operation counts as an agent's action or omission based on its causal topology or its programmed role.

  ## II. Disagreements Table

  The following table delineates the core substantive disagreements. The formulations in columns two and three are phrased to be acceptable to the respective camps as accurate representations of their positions.

  | Issue / Crux | Causal-Source Camp Formulation | Institutional-Role Camp Formulation |
  | :--- | :--- | :--- |
  | **1. Existence of Non-Normative Causal Difference** | There is a mind-independent, metaphysical asymmetry between initiating a lethal causal sequence and failing to interrupt an independent lethal sequence; this asymmetry exists prior to and independent of any social description. | Causal descriptions are inherently theory-laden; what counts as "initiating" versus "failing to interrupt" depends on normative expectations regarding which causal pathways are considered background conditions versus interventions. |
  | **2. Source of Moral Weight** | Institutional roles and social expectations may track the moral significance of the causal asymmetry, but they do not constitute it; the moral weight derives primarily from the agent's alteration of the causal structure of the world. | Institutional roles, social expectations, and frameworks of responsibility allocation fully constitute the moral weight; without these normative frameworks, the physical difference between acting and omitting is morally inert. |
  | **3. Engineered Causal Equivalence** | In cases where an agent designs both the lethal pathway and the missing safeguard, the asymmetry survives based on the final trigger mechanism; the physical topology of the final event (act vs. omission) retains moral significance regardless of prior design responsibility. | In cases where an agent designs both the lethal pathway and the missing safeguard, the asymmetry dissolves or reverses; the agent's prior responsibility equalizes the causal contribution, rendering the final trigger mechanism morally arbitrary. |

  ## III. Cruxes and Predictive Tests

  The following three cruxes identify sub-questions where empirical or intuitional resolution would shift the dialectical balance. For each, we specify a shared hypothetical involving artificial mediation to ensure precision.

  ### Crux 1: The Baseline Dependency Problem
  **(a) Neutral Formulation:** Does the moral classification of an event depend on the physical causal structure alone, or does it depend on the established normative baseline (default setting) against which the event is measured?
  **(b) Shared Hypothetical:** An automated life-support system is programmed with a transparent decision rule. In Scenario A, the default state is "active support," and the system executes a command to *withdraw* power. In Scenario B, the default state is "inactive," and the system executes a command to *decline* initiating power. In both scenarios, the patient dies due to the system's logic executing the same final physical switch movement (opening a circuit).
  **(c) Causal-Source Prediction:** The moral distinction remains constant across scenarios. Withdrawing power (Scenario A) is killing because it interrupts an ongoing causal process sustaining life, whereas declining to initiate (Scenario B) is letting die, regardless of the arbitrary default setting.
  **(d) Institutional-Role Prediction:** The moral distinction flips or vanishes based on the protocol. If the established medical norm is "active support," then Scenario A is a violation of role (killing), but if the system is designed such that non-initiation is the standard protocol, the moral valence shifts accordingly; the physical switch movement is irrelevant without the normative baseline.

  ### Crux 2: The Algorithmic Topology Problem
  **(a) Neutral Formulation:** Is moral responsibility sensitive to the logical structure of the decision algorithm (addition vs. subtraction of a variable) when the physical outcome and intent are identical?
  **(b) Shared Hypothetical:** An autonomous medical agent manages a toxin/antidote balance. In Scenario A, the agent *adds* a chemical variable that neutralizes a life-sustaining drug. In Scenario B, the agent *withholds* a chemical variable that would have neutralized a life-sustaining drug. The net chemical state of the patient is identical in both cases, resulting in death by overdose of the life-sustaining drug. The decision logic is fully transparent.
  **(c) Causal-Source Prediction:** Scenario A is killing (introduction of a neutralizing cause), and Scenario B is letting die (absence of a preventive cause). The logical topology of the algorithm tracks the metaphysical distinction between doing and allowing.
  **(d) Institutional-Role Prediction:** Scenario A and Scenario B are morally equivalent. Because the outcome, intent, and control are identical, the distinction between "adding" and "withholding" a variable is a descriptive convention without independent moral weight; responsibility is determined by the agent's mandate to manage the balance, not the arithmetic of the algorithm.

  ### Crux 3: The Prior Design Responsibility Problem
  **(a) Neutral Formulation:** Does prior responsibility for the setup of a causal environment negate the moral significance of the distinction between acting and omitting within that environment?
  **(b) Shared Hypothetical:** An engineer designs an automated triage system. She knows the system will either actively disconnect a patient (Act) or fail to reconnect a patient (Omission) based on resource allocation algorithms she wrote. She designs both the disconnect mechanism and the reconnection protocol. She activates the system knowing it will result in one patient's death via one of these two methods.
  **(c) Causal-Source Prediction:** The engineer is responsible for both, but the system's final operation retains the killing/letting die distinction. The act of disconnecting remains a causal initiation distinct from the omission of reconnecting, even if the engineer is culpable for both.
  **(d) Institutional-Role Prediction:** The distinction dissolves. Because the engineer occupies the role of architect for both pathways, her responsibility is uniform. The classification of the system's final output as "act" or "omission" is morally irrelevant because her role-based responsibility covers the entire causal field she constructed.

  ## IV. Residual Verdict

  Both camps agree that the dispute is not purely verbal, though it contains a verbal component. We acknowledge that the taxonomy of "action" versus "omission" relies on linguistic conventions and descriptive frameworks that involve a degree of stipulation (the verbal portion). However, we affirm that the remaining disagreement is substantive. The Causal-Source Camp maintains that moral responsibility supervenes on mind-independent causal structures, while the Institutional-Role Camp maintains that moral responsibility supervenes on normative frameworks and social roles. Because these camps posit different truth-makers for moral claims (physical causality versus social normativity), the disagreement extends beyond terminology into the metaphysics of moral obligation. Therefore, while we agree on the usage of terms in standard cases, we disagree substantively on whether those terms track reality or constitute it.
