answer: |-
  **Desiderata for a Theory of Comparative Development**

  **1. The Separation Requirement**
  A theory must survive the decoupling of correlated bundles. Do not tell me institutions and geography usually move together; tell me what happens when they don't. The spec requires the theory to predict outcomes in: (a) a resource windfall managed by extractive politics, (b) formal rule-of-law imposed on hostile agro-ecology, and (c) rapid industrialization under nominally predatory governance. If the theory relies on the bundle to work, it is merely a description of the normal case, not a causal mechanism.

  **2. The Phase Specification (Onset, Persistence, Catch-up)**
  This is not a fake distinction. The mechanisms for breaking a Malthusian trap (onset), maintaining a frontier (persistence), and adopting existing technology (catch-up) are distinct. A theory claiming to explain all three without adjusting parameters is overfitting. The spec requires the author to declare which phase is being modeled. If you explain persistence via path dependence, you logically cannot explain catch-up via the same mechanism without contradiction.

  **3. Level vs. Growth Rate**
  Respecting this is a genuine desideratum, not pedantry. Explaining why a country is poor (level) is a static efficiency problem; explaining why it is getting richer (growth rate) is a dynamic innovation problem. Policies that maximize levels (reallocation) often reduce growth rates (innovation incentives), and vice versa. A theory that conflates them offers policy advice that works only until the steady state is hit, then fails.

  **4. Within-Border Variation**
  This is a requirement, not a cheap shot. If a theory relies on national-level variables (e.g., "national culture" or "constitutional type"), it must explain why regions within that border diverge significantly and persistently while holding those national constants. If the theory cannot scale down to the sub-national level, it admits it is measuring fixed effects, not mechanisms. It forces the theory to possess granularity or admit it is just labeling gaps.

  **5. Exogeneity vs. Actionability**
  This is a real trade-off. Deep causes (geography, deep history) are exogenous but immutable; proximate causes (policy, investment) are actionable but endogenous. You cannot have both. For purpose (a) (the PhD), prioritize Exogeneity to ensure causal identification. For purpose (b) (aid allocation), drop strict Exogeneity in favor of Actionability; telling a donor the cause is "latitude" is scientifically clean but operationally useless.

  **6. The Five-Year Minister Test**
  This is a category error for purpose (a), but a hard requirement for purpose (b). Structural theories operate on generational timescales; ministers operate on electoral cycles. If the theory's lever takes 50 years to move income, it is valid science but fraudulent policy advice. For aid allocation, if the mechanism cannot show measurable movement within a political term, it fails the utility test regardless of its truth.

  **7. Risky Prediction**
  Write this as a requirement for a counterfactual implication that is not guaranteed by the model's construction. The theory must state: "If X holds, Y must occur within Z time, otherwise the theory is false." It does not require an RCT, but it requires holding out data or predicting a trend reversal that the theory claims is impossible under current parameters. No "it depends" clauses that allow every outcome to fit post-hoc.

  ***

  **The Incompatible Pair**
  **Exogeneity (Purpose A) and The Minister Test (Purpose B) cannot be jointly satisfied.** A cause sufficiently exogenous to satisfy the PhD requirement (unchangeable by the system) is by definition unchangeable by a minister. A cause sufficiently actionable to satisfy the Aid requirement (changeable by policy) is by definition endogenous to the system. You must choose whether you are writing science or a manual.

  ***

  **Damage Assessment**
  Institutions die on Within-Border Variation, as national rules cannot explain local gaps.
  Geography dies on the Minister Test, as you cannot policy your way out of being landlocked.
  Culture dies on Risky Prediction, as its definitions shift to fit any outcome post-hoc.
