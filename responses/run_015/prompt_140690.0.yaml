          3.  Level vs. Growth Rate (genuine desideratum or pedantry?).
          4.  Within-border variation (requirement or cheap shot?).
          5.  Exogeneity (trade-off between exogeneity and explanatory power).
          6.  The 'Five-Year Minister' Test (policy timescale vs. structural timescale).
          7.  Risky Prediction (falsifiability without RCTs).
          8.  **Crucial:** Flag any pair that can't be jointly satisfied (the "real result").
          9.  **Ending:** 3-4 lines on which single requirement damages Institutions, Geography, and Culture families respectively. No politeness.

  2.  **Deconstruct Each Requirement:**

      *   **Separation Cases:** Theories often rely on correlated bundles (e.g., good institutions + good geography + good culture). A real theory must handle outliers. *Requirement:* The theory must specify boundary conditions where correlated factors diverge and predict the outcome based on the purported causal mechanism, not the correlate.
      *   **Onset, Persistence, Catch-up:** Are these the same? Onset is breaking the Malthusian trap. Persistence is why gaps stay. Catch-up is convergence. Many theories explain one but claim to explain all. *Requirement:* The theory must explicitly state which phase of the growth process it models. Treating them as identical is a flaw.
      *   **Level vs. Growth Rate:** Solow model distinction. Levels are steady states; growth rates are transitions/tech progress. Explaining why India is poor (level) is different from why China grew fast (rate). *Verdict:* Genuine desideratum. Confusing them leads to bad policy (pushing for growth vs. raising floor).
      *   **Within-border variation:** If institutions are national, why are regions different? Culture? Geography? *Verdict:* Not a cheap shot. If a theory relies on national-level variables, it must explain sub-national variance or admit it's only a cross-national theory. It tests the mechanism's granularity.
      *   **Exogeneity:** Deep causes (geography) are exogenous but static. Proximate causes (policy) are endogenous but actionable. *Trade-off:* You can't have perfect exogeneity and high explanatory power for dynamic changes. *Verdict:* Explicit trade-off. Prioritize explanatory power for (a), exogeneity for (b).
      *   **Five-Year Minister Test:** Structural causes (culture/geography) move slowly. Politicians need results in 4-5 years. *Verdict:* Category error for fundamental theory, but critical for purpose (b). A theory for (a) doesn't need this; a theory for (b) fails without it.
      *   **Risky Prediction:** Post-hoc fitting is rampant. *Requirement:* Must generate out-of-sample predictions or counterfactuals that could fail. Not necessarily RCTs, but logical implications that data could contradict.

  3.  **Identify Incompatible Pairs (The "Real Result"):**
      *   *Exogeneity vs. Policy Usability (Minister Test):* Truly exogenous factors (geography, deep culture) cannot be changed by a minister. Endogenous factors (policy) are not exogenous. You can't have a cause that is both perfectly exogenous *and* actionable on a 5-year timeline.
      *   *Within-border Variation vs. National Institutions:* If the theory relies on national institutional quality, it struggles with sub-national variation unless it modifies the theory to be local, which undermines the "national institutions" claim.
      *   *Onset/Persistence/Catch-up:* A theory explaining persistence (lock-in) often contradicts a theory explaining catch-up (convergence). You can't easily model both rigid path dependence and rapid convergence with the same parameters.
      *   *Selection:* The strongest tension is between **Exogeneity** (required for causal identification/phd rigor) and the **Five-Year Minister Test** (required for policy aid). Deep causes aren't manipulable; manipulable causes aren't deep/exogenous.

  4.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Academic but sharp. No "please," no "perhaps." Direct assertions.
