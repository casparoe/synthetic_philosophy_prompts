      *   *Drafting - Exogeneity:* It's a trade-off. Deep causes (geo) are exogenous but low variance. Proximate causes (policy) have variance but are endogenous. Don't pretend you have both.
      *   *Drafting - Minister Test:* It is a category error for science (a), but fatal for aid (b). If the cause takes 100 years to shift, telling a minister to fix it is fraud.
      *   *Drafting - Risky Prediction:* Require a counterfactual statement about a specific context that hasn't happened yet, or a retrodiction on a held-out case. No "it depends" clauses that cover all outcomes.

      *   *Incompatibility:* The Exogeneity vs. Minister Test clash is the big one. Also, Persistence vs. Catch-up. I'll focus on Exogeneity vs. Policy Usability as the primary tension for the "aid money" purpose.

      *   *Final 3-4 Lines:*
          *   Institutions: Within-border variation kills it (national vs. local).
