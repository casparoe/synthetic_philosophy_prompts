prompt: |-
  I work in a memory and assistive-technology clinic, and several times a month our team faces variants of the same question: whether some external resource a patient depends on should count as part of that patient's own thinking, or merely as a tool they happen to use. The decision is not academic. If the resource is part of the patient's mind, then degrading or removing it looks like impairing a person rather than depriving them of property; if it is a mere tool, it does not. The same question arises in the opposite direction: when a relative supplies the missing half of a decision — the retrieval cue, the unfinished sentence, the standing set of values — should we score that as the patient's own decision-making capacity, or as someone else's influence on it?

  Please turn the extended mind thesis into a decision procedure my team can actually run, in about fifteen minutes, on a real case. Take as raw material — and do not feel obliged to keep — these candidate conditions: the resource is reliably available when needed; its contents are easily accessible; it is trusted and taken at face value rather than checked against something else; consulting it requires no special effort; past reliance on it has become automatic; and the store is durable over time. Say which conditions you keep, which you drop, which you tighten, and which you demote to mere evidence rather than requirements; say what the team should do when a condition is only partly met or cannot be assessed in a quarter of an hour; and mark clearly the points where no amount of procedure removes the need for a value judgment, and who on the team has to make it.

  One distinction I want handled explicitly, because I think we have been conflating three things that can come apart. First, whether the resource is a component of the cognitive system that actually produces the performance. Second, whether the resulting memory, belief, or action is attributable to the patient as theirs, in the way that matters for credit, responsibility, and consent. Third, whether interfering with the resource wrongs or harms the patient, and whether maintaining it falls under our duty of care. A resource could satisfy the first without settling the third, for instance if it is owned and remotely rewritable by a third party. Tell me how the procedure keeps these separate, and what it does when they disagree.

  Then run it on three cases: a man with dense amnesia whose entire prospective and autobiographical memory lives in a cloud-synced voice assistant that his daughter and the manufacturer can both edit; a single jointly maintained notebook that both partners of a couple rely on for their shared life, where one partner now wants it destroyed; and a spouse who, during a capacity assessment, reliably supplies the cues and values the patient cannot retrieve. I expect to dislike the answer on the last one, so give it to me straight. Finally, state plainly what the procedure cannot do — whether it settles legal capacity, personhood, or consent — and where a clinician should refuse to use it as if it did.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Memory and assistive-technology clinic.
      *   **Problem:** Distinguishing between external resources as part of the patient's mind (Extended Mind Thesis - EMT) vs. mere tools. This has ethical/legal implications (impairment vs. property loss; capacity attribution).
      *   **Task:** Create a 15-minute decision procedure based on EMT criteria (reliability, accessibility, trust, etc.).
      *   **Requirements:**
          *   Modify candidate conditions (keep, drop, tighten, demote).
          *   Handle partial meets/uncertainty.
          *   Identify where value judgments are needed and who makes them.
          *   Explicitly distinguish three concepts: (1) Cognitive Component, (2) Attribution/Responsibility, (3) Duty of Care/Harm.
          *   Handle disagreements between these three concepts.
          *   Apply to three specific cases (Cloud Assistant, Joint Notebook, Spousal Scaffolding).
          *   State limitations (legal capacity, personhood, consent).
      *   **Tone:** Professional, practical, ethically rigorous, direct ("give it to me straight").

  2.  **Deconstruct the Extended Mind Thesis (EMT) for Clinical Use:**
      *   *Standard EMT (Clark & Chalmers):* Parity principle. If it functions like an internal process, treat it as such. Criteria: Constant availability, easy access, automatic endorsement, past endorsement.
      *   *Clinical Adaptation:* Needs to be actionable, not just philosophical. Needs to separate *is it mind?* from *does it count for capacity?* from *do we protect it?*
      *   *Candidate Conditions:*
          *   Reliably available -> Keep (crucial for functional integration).
          *   Easily accessible -> Keep (low friction = high integration).
          *   Trusted/Taken at face value -> Keep (endorsement).
          *   No special effort -> Keep (transparency).
          *   Automatic reliance -> Keep (habituation).
          *   Durable over time -> Tighten (needs stability, not just duration).

  3.  **Drafting the Decision Procedure (The "EMT-Clinical Triage"):**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist that fits 15 mins.
      *   *Modifications:*
          *   *Drop:* "Durable over time" as a strict requirement. Some acute aids are mind-constitutive even if new. Demote to evidence.
          *   *Tighten:* "Trusted." It's not just trust; it's *uncritical* integration. If they double-check, it's a tool.
          *   *Add:* Agency/Control. Who controls the off-switch? (Crucial for the third distinction).
      *   *The Three Distinctions:* I need to build three separate "gates" or "outputs" for the procedure.
          1.  **Functional Integration (Is it Mind?)**
          2.  **Attributive Agency (Is it *Their* Decision?)**
          3.  **Normative Protection (Do We Protect It?)**
      *   *Value Judgments:* The procedure can't solve ethical conflicts. The Clinician-in-Charge or Ethics Committee needs to flag these.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Cloud Amnesia):* High integration (Function), Low Control (Attribution/Protection). *Conflict:* It's his mind, but he doesn't own it.
      *   *Case 2 (Joint Notebook):* Shared cognition. Destruction is harm to *both*, but property rights might favor one. *Conflict:* Interdependent agency.
      *   *Case 3 (Spousal Scaffolding):* This is the tricky one. If the spouse *is* the memory, does the patient have capacity? *Straight answer:* No, not independent capacity. The "system" has capacity, the individual might not. This challenges standard capacity assessments which assume bounded skulls.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Time Limit:* 15 minutes means max 5-6 questions.
      *   *Scoring:* Use a traffic light system (Green = Integrated, Yellow = Hybrid, Red = Tool).
      *   *Handling Uncertainty:* If unknown, assume "Tool" for safety regarding capacity, but "Mind" for safety regarding harm (precautionary principle).
      *   *Who Decides:* The Lead Clinician makes the call on Value Judgments, documented with rationale.

  6.  **Addressing the "Three Distinctions" Explicitly:**
      *   I need to make sure the output of the procedure isn't just "Yes/No Extended Mind." It needs to be "Yes on Function, No on Control," etc.
      *   *Disagreement Protocol:* If Function=Yes but Protection=No, flag as "Vulnerable Cognitive Dependency."

  7.  **Addressing the Limitations:**
      *   Cannot determine legal capacity (court's job).
      *   Cannot define personhood (philosophical/legal).
      *   Cannot override consent laws.
      *   Clinician must refuse to use it to *bypass* consent or *force* treatment.

  8.  **Final Review against Constraints:**
      *   15 minutes? Yes, checklist format.
      *   Modify conditions? Yes, noted in the setup.
      *   Three distinctions handled? Yes, separate output tracks.
      *   Three cases run? Yes.
      *   Straight answer on Case 3? Yes (Spouse reliance reduces independent capacity scores).
      *   Limitations stated? Yes.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the stakes.
      *   *The Procedure:* "The Cognitive Integration Triage (CIT)."
      *   *Step 1: Functional Integration (The Parity Check).*
      *   *Step 2: Agency & Control (The Ownership Check).*
      *   *Step 3: Normative Status (The Harm Check).*
      *   *Case Studies:* Apply CIT.
      *   *Limitations:* Clear boundaries.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in philosophy. Keep it clinical. The prompt asks to "turn the extended mind thesis into a decision procedure." So the output must be a tool, not an essay about the tool. I will structure it as a manual.

      *(Refining Case 3)*: The prompt says "I expect to dislike the answer... give it to me straight." The standard clinical view is "patient must decide." EMT view is "the dyad decides." If the dyad is the unit, the individual lacks capacity. I must state that relying on the spouse *lowers* the score for independent capacity, even if it increases functional ability. This is the hard truth.

      *(Refining Conditions)*:
      *   *Reliability:* Keep.
      *   *Accessibility:* Keep.
      *   *Trust:* Tighten to "Transparency" (no critical scrutiny).
      *   *Effort:* Keep.
      *   *Automaticity:* Keep.
      *   *Durability:* Demote to evidence (acute aids count).
      *   *New:* Control/Ownership (Critical for the 3rd distinction).

      *(Value Judgment Points)*: When conditions conflict (e.g., high integration but low control). Lead Clinician decides.

      *(Limitations)*: Legal capacity is distinct from clinical capacity. This tool informs, does not decide.

  10. **Final Polish:** Check tone. Ensure it sounds like a protocol for a team, not a philosophical treatise. Ensure the three distinctions are clearly labeled in the output section.

  **(Self-Correction on Case 1):** Cloud synced. Daughter + Manufacturer can edit. This is a "Hostile Environment" for the mind. Functionally mind, normatively vulnerable.
  **(Self-Correction on Case 2):** Joint notebook. One wants destruction. This is a "Shared Mind" conflict. Harm to one is harm to the system.
  **(Self-Correction on Case 3):** Spouse cues. This is "Scaffolding." If the scaffolding is removed, capacity fails. Therefore, capacity is contingent.

