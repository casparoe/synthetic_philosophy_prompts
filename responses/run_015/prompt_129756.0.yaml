answer: |-
  # The Cognitive Integration Triage (CIT)
  **A 15-Minute Clinical Decision Procedure for External Cognitive Resources**

  ## 1. Setup and Modifications to Candidate Conditions
  To make the Extended Mind Thesis (EMT) actionable, we must move from philosophical parity to clinical risk assessment. We are not asking "Is this *literally* brain tissue?" but "Does treating this as external create a category error in our care plan?"

  **Modifications to Your Candidate Conditions:**
  *   **KEEP:** *Reliable Availability* (Is it there when the cognitive load hits?), *Easy Accessibility* (Low friction retrieval), *Automaticity* (Is reliance habitual/unconscious?).
  *   **TIGHTEN:** *Trust.* Change to **"Uncritical Endorsement."** If the patient routinely verifies the resource against internal memory or another source, it is a tool, not a mind component. It must be taken as truth by default.
  *   **DEMOTE:** *Durability.* Do not require long-term stability. Acute aids (e.g., a whiteboard for delirium) can be constitutive. Treat durability as *evidence* of integration, not a requirement.
  *   **ADD:** *Agency/Control.* Who can alter, delete, or deny access to the resource? (Critical for distinguishing mind from property).

  ---

  ## 2. The Procedure (15 Minutes Max)

  **Step 1: Functional Integration Score (5 Minutes)**
  *Ask the following. Score 1 for Yes, 0 for No.*
  1.  **Availability:** Is the resource available at the moment the cognitive demand arises (e.g., decision time, recall time) without significant delay?
  2.  **Accessibility:** Is accessing the information physically and cognitively easy (e.g., one click, one glance) compared to internal retrieval?
  3.  **Endorsement:** Does the patient accept the information from the resource without independent verification?
  4.  **Automaticity:** Is the consultation of the resource habitual rather than a deliberate, effortful strategy session?
  5.  **History:** Has this pattern been stable for at least 3 months (or since onset of deficit)?

  *   **Score 4-5:** **High Integration.** (Treat as Cognitive Component).
  *   **Score 2-3:** **Hybrid.** (Treat as Prosthetic/Tool).
  *   **Score 0-1:** **External Tool.** (Treat as Property/Environment).

  **Step 2: Agency and Control Check (5 Minutes)**
  *This step separates "Is it mind?" from "Who owns the mind?"*
  1.  **Edit Rights:** Can the patient unilaterally add, delete, or correct information in the resource?
  2.  **Access Rights:** Can the patient prevent others from viewing or using the resource?
  3.  **Continuity:** If the resource is lost/broken, does the patient feel a loss of *self* (confusion, identity distress) or merely a loss of *convenience*?

  *   **If Step 1 was High Integration BUT Step 2 is "No":** Flag as **"Vulnerable Cognitive Dependency."**
  *   **If Step 1 was High Integration AND Step 2 is "Yes":** Flag as **"Integrated Cognitive Agency."**

  **Step 3: Normative Protection Assessment (5 Minutes)**
  *This determines Duty of Care.*
  1.  **Harm Potential:** Would removing/degrading this resource cause psychological distress comparable to physical injury or memory loss?
  2.  **Alternative Cost:** Is there a viable internal or alternative external substitute available within 24 hours?
  3.  **Third-Party Risk:** Does a third party (family, corp, state) have the power to manipulate the content to alter the patient's decisions?

  *   **Decision:**
      *   If **Vulnerable Cognitive Dependency** + **High Harm Potential**: Duty of Care extends to protecting the resource *as if* it were the patient, even if you cannot legally guarantee it.
      *   If **External Tool**: Duty of Care is limited to facilitating access (property support), not guaranteeing content.

  ---

  ## 3. Handling Uncertainty and Value Judgments

  **Partial Meets / Unassessable Data:**
  *   If you cannot verify a condition in 15 minutes (e.g., you don't know if the cloud data is editable), **assume the stricter constraint for safety.**
      *   For *Capacity Assessment*: Assume it is a **Tool** (require internal verification).
      *   For *Harm Assessment*: Assume it is **Mind** (precautionary principle against cognitive injury).
  *   **Documentation:** Record "Unknown" explicitly. Do not fill gaps with assumptions.

  **Value Judgment Points:**
  The procedure cannot automate ethics. The following require a **Value Judgment** by the **Lead Clinician** (MD/PhD level), documented in the chart:
  1.  **Conflict between Integration and Control:** When Step 1 says "Mind" but Step 2 says "No Control" (e.g., the cloud assistant case). The Lead Clinician must decide whether to advocate for the resource's protection as a human right or advise the patient to migrate to a controllable system.
  2.  **The "Dyad" Problem:** When capacity exists only in a pair (Patient + Spouse). The Lead Clinician must decide whether to assess the individual (likely failing) or the system (likely passing).
  3.  **Third-Party Manipulation:** If a resource is integrated but manipulatable by others, the Lead Clinician must determine if the patient is safe to use it.

  ---

  ## 4. The Three Distinctions (Output Protocol)

  Do not output a single "Yes/No." The CIT produces three distinct flags. They may disagree.

  | Distinction | Question | CIT Output Flag | Clinical Implication |
  | :--- | :--- | :--- | :--- |
  | **1. Cognitive Component** | Is this part of the system producing the performance? | **Integrated / Hybrid / Tool** | Determines how you test memory/function. If Integrated, test *with* the device. |
  | **2. Attributive Agency** | Is the decision attributable to the patient for responsibility/consent? | **Sole / Shared / Compromised** | Determines if consent is valid. If Shared, you may need joint consent. |
  | **3. Duty of Care** | Do we protect this resource from harm/interference? | **Protect / Facilitate / Neutral** | Determines if removing it is "battery/abuse" or "property loss." |

  **Protocol for Disagreement:**
  *   **If Component = YES, but Agency = COMPROMISED:** (e.g., hacked implant). The patient is functioning but not autonomous. **Action:** Safeguard the resource, but do not accept decisions derived from it as valid consent until integrity is restored.
  *   **If Component = YES, but Duty = NEUTRAL:** (e.g., resource is owned by a hostile third party). **Action:** Flag as "High Risk." Advise patient/family of vulnerability. Do not promise protection you cannot legally enforce.

  ---

  ## 5. Case Applications

  ### Case 1: The Cloud-Synced Amnesiac
  *   **Step 1 (Integration):** Score 5. (Always available, auto-sync, trusted implicitly, automatic reliance, durable). **Flag: Integrated.**
  *   **Step 2 (Agency):** Edit Rights = No (Daughter/Mfg can edit). Access Rights = No. **Flag: Compromised.**
  *   **Step 3 (Duty):** Harm Potential = High (Loss is loss of self). Third-Party Risk = High.
  *   **Result:**
      1.  **Component:** Yes. It is his memory. Testing him without it is invalid.
      2.  **Agency:** Compromised. Decisions based on edited entries are not fully his.
      3.  **Duty:** High. Removing it is harming *him*, not just taking property.
  *   **Action:** You cannot guarantee the manufacturer won't wipe it. You must document that his "mind" is hosted on vulnerable infrastructure. Capacity is contingent on the integrity of the cloud. If the daughter edits values, she is effectively lobotomizing or reprogramming him. **Recommendation:** Treat the device as a protected medical device, not consumer electronics.

  ### Case 2: The Joint Notebook
  *   **Step 1 (Integration):** Score 5 for *both* partners. It is the shared hippocampus of the relationship. **Flag: Integrated (Shared).**
  *   **Step 2 (Agency):** Edit Rights = Shared. Access Rights = Shared. **Flag: Shared.**
  *   **Step 3 (Duty):** Harm Potential = High for *both*.
  *   **Result:**
      1.  **Component:** Yes, for the *dyad*.
      2.  **Agency:** Shared. Neither can claim the decisions in the book as solely theirs.
      3.  **Duty:** Destroying the book is an act of aggression against the *other* partner's mind.
  *   **Action:** If one partner wants it destroyed, they are requesting the impairment of the other. You cannot consent to this on behalf of the impaired partner. **Recommendation:** Treat the notebook as a shared medical record. Destruction requires consent from both, or a court order if capacity is disputed. It is not merely property of the requester.

  ### Case 3: The Spousal Scaffolding (The Hard Truth)
  *   **Step 1 (Integration):** Score 5. (Spouse is always there, cues are easy, patient trusts them implicitly, automatic reliance). **Flag: Integrated.**
  *   **Step 2 (Agency):** The patient cannot retrieve values without the spouse. The "decision" emerges from the interaction. **Flag: Shared/Compromised.**
  *   **Step 3 (Duty):** Removing the spouse (e.g., hospitalization, separation) causes cognitive collapse.
  *   **Result:**
      1.  **Component:** The cognitive system is the Couple, not the Patient.
      2.  **Agency:** The patient, *in isolation*, lacks capacity. The dyad has capacity.
      3.  **Duty:** Separating them impairs the patient.
  *   **Action:** **Straight Answer:** If you assess the patient alone, they **fail** capacity. Their "values" and "recall" are not internally accessible. You are not assessing *their* decision-making; you are assessing the *spouse's* influence on them.
  *   **Implication:** You cannot score this as the patient's independent capacity. If the law requires *individual* capacity (e.g., for a will or specific medical consent), this patient does not have it while dependent on the spouse. If you accept the spouse's cues as the patient's own, you are legally validating the spouse's power of attorney de facto, without the safeguards.
  *   **Recommendation:** Document "Capacity contingent on spousal scaffolding." For high-stakes decisions, require a period of assessment *without* the spouse to see if any internal residue exists. If none, the patient lacks independent legal capacity, even if the "couple" functions well. Do not conflate functional success with individual autonomy.

  ---

  ## 6. Limitations and Refusal Points

  **What This Procedure Cannot Do:**
  1.  **Settle Legal Capacity:** Courts determine legal personhood and capacity. The CIT informs the clinical opinion, but it does not override statutory definitions which often assume a "bounded skull."
  2.  **Define Personhood:** Whether a cloud-synced human is a "different person" if the cloud is wiped is a metaphysical question. The CIT treats it as *harm*, not ontological death.
  3.  **Override Consent Laws:** You cannot use "Integrated Component" to force a patient to keep a device they want removed, nor to allow a third party to consent for them without legal guardianship.

  **When to Refuse Using the CIT:**
  *   **When Law Contradicts:** If local law strictly defines capacity as internal cognitive function, do not use the CIT to certify capacity for a dyad. State clearly: "Functionally capable with aid, legally ineligible."
  *   **When Safety is at Risk:** If the "Integrated Resource" is a person (Case 3) who is abusive, do not use the CIT to justify keeping the patient in that relationship. Safety trumps cognitive integration.
  *   **When Resource is Hostile:** If the resource is integrated but actively manipulated by a bad actor (Case 1), do not treat it as a valid proxy for patient will. Treat it as a compromised channel.

  **Final Instruction to Team:**
  Use the CIT to expand your empathy and refine your harm assessment. Do not use it to bypass legal safeguards. When the "Mind" extends beyond the "Body," the "Law" usually does not follow. Your job is to protect the patient in that gap.
