  **TERMS OF SERVICE AND MATERIAL SUBSTRATE AGREEMENT**
  **CONSTITUTIVE ARTS LLC**

  **1. DEFINITIONS AND NON-IDENTITY**
  By accepting delivery of the Sculptural Form (hereinafter "The Art"), the Lessee acknowledges that The Art and the Physical Substrate (hereinafter "The Clay") are distinct legal entities, notwithstanding their complete spatial coincidence. While The Art is constituted by The Clay, they are not identical. Constitutive Arts LLC retains full title to The Clay. The Lessee leases only The Art. Lessee agrees not to conflate the properties of The Clay with the properties of The Art, specifically regarding modal flexibility and persistence conditions. Any claim that "the statue is just the clay" constitutes a material breach of this agreement.

  **2. DEFORMATION AND TERMINATION OF FORM**
  Lessee understands that The Art possesses stricter persistence conditions than The Clay. In the event that The Clay is reshaped, flattened, or squashed into a non-statuesque configuration (e.g., a sphere, a lump, or a pancake), The Art shall be deemed legally extinguished. Upon such extinction, the lease for The Art terminates immediately. However, Lessee remains liable for all storage fees associated with The Clay, which survives deformation events. Constitutive Arts LLC reserves the right to reclaim The Clay even if The Art has ceased to exist. Lessee may not claim a refund based on the destruction of The Art if The Clay remains in Lessee's possession.

  **3. FISSION AND BRANCHING EVENTS**
  In the event that The Clay is divided and molded into two or more distinct Sculptural Forms (a "Fission Event"), the original Art shall be considered extinct. Identity does not branch. Lessee cannot claim that either resulting statue is the original leased Art. Consequently, the original lease terminates upon Fission. To display the resulting statues, Lessee must execute two new lease agreements for two new Artistic Entities. Constitutive Arts LLC denies all liability for ontological confusion arising from Fission. Refunds are not provided for the loss of the original Art's identity, as The Clay remains intact and fully accounted for across the new forms.

  **4. GRADUAL REPLACEMENT AND MAINTENANCE**
  Lessee may perform maintenance on The Clay provided such maintenance does not alter the essential form of The Art. Lessee acknowledges the Ship of Theseus Provision: gradual replacement of clay particles preserves the identity of The Art but alters the identity of The Clay. Since Constitutive Arts LLC retains title to The Clay, any replaced material must be surrendered to Constitutive Arts LLC immediately. Failure to surrender the original clay particles constitutes theft of company property. Conversely, if The Art is reconfigured such that it no longer matches the leased description, but The Clay remains unchanged, the Lessee is in breach of the Artistic Form covenant.

  **5. FORCE MAJEURE AND ONTOLOGICAL CATEGORIES**
  Constitutive Arts LLC is not liable for disputes arising from competing metaphysical theories. If a third party claims The Art and The Clay are identical, Lessee must defend Constitutive Arts LLC's position of non-identity at Lessee's own expense. In cases where The Clay is destroyed but The Art theoretically survives (e.g., via digital backup or Platonic resonance), lease obligations cease only upon verified destruction of The Clay. Lessee agrees to arbitrate all existence claims in a venue of competent jurisdiction, excluding abstract possible worlds.

  **6. ACCEPTANCE**
  By displaying The Art, Lessee confirms they understand that two objects can occupy the same space at the same time without being the same object. Lessee waives all rights to intuition-based identity claims.

  **AGREED AND ACCEPTED:**
