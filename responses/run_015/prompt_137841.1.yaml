answer: |-
  There is no single established term that cleanly isolates this specific error without carrying the theoretical baggage you want to avoid. Archaeologists speak of "visibility bias" or "elite bias," and systems theorists speak of "proxy failure," but these describe the *data problem*, not the *verdict*. You are identifying a rhetorical and logical error in how we name historical outcomes.

  Here is the carving you need.

  ### The Term: Metonymic Collapse

  **Definition:** A historiographical verdict in which the failure of a high-visibility subsystem (palaces, literacy, luxury trade) is misidentified as the failure of the whole society.

  **The Logic:** It relies on *metonymy*—the figure of speech where a part stands for the whole (e.g., "The Crown" instead of "The Monarchy," or "The White House" instead of "The Administration"). In these historical narratives, "The Palace" is treated as synonymous with "The People." When the Palace stops building, the narrative records "The People" as having collapsed, even if the People are still farming, eating, and burying their dead.

  ### The Companion: Metonymic Continuity

  **Definition:** A historiographical verdict in which the persistence of a high-visibility subsystem masks the degradation of the whole society.

  **The Logic:** This is the inverse error. Because the elite markers (inscriptions, monuments) persist, the society is labeled as "continuous" or "transforming," even if the underlying population is suffering, dying, or impoverishing. The part (elite) continues, so the whole (society) is assumed to continue.

  ### Applying the Carving to Your Cases

  **Case 1 (Palaces vanish, people live better):**
  *   **Current Label:** Collapse.
  *   **Correct Label:** **Metonymic Collapse.**
  *   **Why:** The "collapse" is real only for the elite apparatus. For the majority, it may be a liberation or a lateral shift. The verdict is driven by the loss of the *signal* (writing/monuments), not the loss of the *system* (subsistence/community).

  **Case 2 (Palaces persist, people suffer):**
  *   **Current Label:** Continuity / Transformation.
  *   **Correct Label:** **Metonymic Continuity.**
  *   **Why:** The "continuity" is real only for the elite apparatus. For the majority, it is a decline. The verdict is driven by the persistence of the *signal*, masking the failure of the *system*.

  ### Are Your Two Cases Less Different Than They Seem?

  Yes. They are mirror images of the same epistemological error.

  In both cases, the historian is measuring the wrong variable. They are measuring **State Capacity** (the ability to extract surplus and monumentalize it) but labeling the result **Societal Viability** (the ability of the population to survive and thrive).

  *   In Case 1, State Capacity drops, Societal Viability holds (or rises). The error is a **False Positive** for collapse.
  *   In Case 2, State Capacity holds, Societal Viability drops. The error is a **False Negative** for collapse.

  Both errors stem from the same assumption: that the elite superstructure is the load-bearing wall of the society, rather than a parasitic or decorative layer on top of it.

  ### The Edges: When Is It *Not* Metonymic?

  To make this useful for your column, you must define where the term stops applying. A collapse is **not** metonymic if the failure of the elite subsystem directly causes the failure of the subsistence subsystem.

  *   **Real Collapse:** The palace manages the irrigation dams. The palace vanishes. The dams break. The people starve or disperse. Here, the part (palace) was functionally necessary for the whole (society). The metonymy is functionally accurate.
  *   **Metonymic Collapse:** The palace manages the irrigation dams. The palace vanishes. The people revert to local, smaller-scale water management and live safely, just without monumental architecture. Here, the part was not necessary for the whole. The metonymy is false.

  ### Why This Fits Your Column

  "Metonymic Collapse" gives you a precise tool to critique the literature without getting bogged down in "complexity theory" or "resilience" debates. It allows you to say: *"We are not witnessing the end of a people; we are witnessing the end of a specific way of recording power. We are mistaking the silence of the scribes for the silence of the fields."*

  It shifts the burden of proof. Instead of asking, "Why did they collapse?" you can ask, "Why did the *monuments* collapse, and why do we care more about that than the *maize*?"
