answer: |-
  Below is a structured analysis of the requirements for solving the boundary problem (the constitution of the *demos*), designed to serve as the theoretical foundation for your civics paper.

  ### I. Requirements for an Adequate Boundary Principle

  An adequate principle must satisfy logical, moral, and practical constraints. Below are the five core requirements, categorized by their necessity.

  #### 1. The Classification Requirement
  **The Requirement:** The principle must yield determinate verdicts on standard edge cases without relying on ad-hoc exceptions.
  **Motivating Cases:**
  *   **Children:** Why are they excluded despite being affected? (Competence vs. Interest).
  *   **Tourists:** Why are they excluded despite being coerced by local laws temporarily?
  *   **Permanent Residents:** Why are they often included in local elections but excluded from national ones?
  *   **Convicted Felons:** Does punishment entail loss of political membership?
  *   **Expatriate Citizens:** Do they retain a stake after leaving the coercive jurisdiction?
  *   **Future Generations:** How does the principle account for those who cannot vote but bear the cost of environmental policy?
  **Status:** **Non-Negotiable.** A principle that cannot classify these cases is theoretically useless. However, the *specific outcome* for each case (e.g., whether felons *should* be excluded) is often a **Camp Preference** (e.g., Republicanism vs. Liberalism).

  #### 2. The Conceptual Distinction Requirement
  **The Requirement:** The principle must not collapse distinct moral relationships into a single category.
  **Motivating Considerations:**
  *   **Affectedness:** Causal impact (I breathe the smoke from your factory).
  *   **Coercion:** Subjection to enforceable law (I am fined if I don't recycle).
  *   **Stake/Membership:** Long-term identity and investment in the community's flourishing.
  **Status:** **Non-Negotiable.** Conflating these leads to category errors. One can be affected without being coerced (a foreigner harmed by trade policy); one can be coerced without having a stake (a tourist); one can have a stake without being currently coerced (an expat).

  #### 3. The Non-Circularity Constraint
  **The Requirement:** The principle cannot define the *demos* by reference to a democratic decision made by that *demos*.
  **Motivating Consideration:** The "Paradox of Democracy." To vote on who gets to vote presupposes a group already authorized to vote. If the boundary is decided democratically, the decision is illegitimate because the boundary was not yet set.
  **Status:** **Non-Negotiable (Logical).** This is a condition of justification. While historical demoi often formed through force or accident, a *normative principle* defending a boundary cannot rely on the very procedure it seeks to justify.

  #### 4. The Feasibility Constraint
  **The Requirement:** The information required to apply the principle must be knowable prior to the vote.
  **Motivating Consideration:** If a principle requires knowing the exact outcome of a policy to determine who should have voted on it, it is retroactive and useless for institutional design.
  **Status:** **Non-Negotiable (Practical).** A principle that requires omniscience regarding causal chains cannot guide legislation.

  #### 5. The Bounded Agency Constraint
  **The Requirement:** The resulting *demos* must be a stable, identifiable unit capable of collective deliberation and action over time.
  **Motivating Consideration:** Democracy requires a "we" that persists long enough to debate, decide, and take responsibility. If the membership fluctuates wildly with every issue, collective agency dissolves.
  **Status:** **Camp Preference.** This is the primary fault line between **Statists** (who view this as essential) and **Cosmopolitans** (who argue that if the *demos* must be global to satisfy moral requirements, so be it, even if institutions are weak).

  ---

  ### II. The Joint Unsatisfiability Hypothesis

  You suspect that the **All-Affected Interests Principle (AAIP)** and the **Bounded Agency Constraint** are jointly unsatisfiable. You are correct; this is the central tension in contemporary democratic theory.

  **The Conflict:**
  Causal affectedness is potentially infinite and issue-specific. In a globalized world, almost every significant democratic decision (carbon taxes, interest rates, trade tariffs, military engagement) has ripple effects that cross borders.
  *   If you strictly satisfy **AAIP**, the *demos* for a climate change vote must include almost every human on earth. For a local zoning law, it might include only neighbors. This creates a "fluid demos" that changes with every ballot measure.
  *   If you strictly satisfy **Bounded Agency**, you need a fixed membership (e.g., citizens) to maintain institutions, deliberation, and accountability. This inevitably excludes many who are significantly affected (e.g., foreigners affected by pollution, future generations).

  **Why They Cannot Both Be Met:**
  1.  **Epistemic Limit:** We cannot know all affected parties prior to the decision (violating Feasibility).
  2.  **Institutional Limit:** There is no global state to administer a fluid, global *demos* (violating Bounded Agency).
  3.  **Dilution of Voice:** If everyone affected votes, the weight of the vote for those most intimately involved (the local community) approaches zero, potentially violating the democratic ideal of self-determination.

  **Conclusion on Unsatisfiability:**
  Within the context of the nation-state, **they are jointly unsatisfiable.** You must choose:
  *   **Weaken AAIP:** Limit it to "all *substantially* affected" or "all subject to coercion," accepting some moral exclusion.
  *   **Abandon Boundedness:** Argue for a global demos, accepting that current institutions cannot support it.
  *   **Accept Tragedy:** Acknowledge that democracy inherently produces "boundary remainders"—people who are affected but excluded—and that this is a permanent moral cost of bounded self-government.

  ---

  ### III. Scoring the Principles

  Here is how the three major contenders score against the requirements above.

  **1. All-Affected Interests Principle (AAIP)**
  *   **Strengths:** Maximizes moral inclusion; handles future generations well (in theory).
  *   **Weaknesses:** Fails **Feasibility** (cannot know all effects ex-ante) and **Bounded Agency** (demos becomes too large/fluid). Violates **Non-Circularity** if "interests" are defined by the policy outcome.
  *   **Verdict:** Morally ambitious but institutionally impossible for nation-states.

  **2. All-Subjected-to-Coercion Principle**
  *   **Strengths:** Satisfies **Bounded Agency** (jurisdiction is usually clear); satisfies **Non-Circularity** (law exists prior to vote).
  *   **Weaknesses:** Struggles with **Classification** of tourists (temporarily coerced) and externalities (foreigners not coerced but harmed). Fails to protect **Future Generations** (they are not currently subjected).
  *   **Verdict:** The most legally robust, but morally under-inclusive regarding externalities.

  **3. Stakeholder (Membership) Principle**
  *   **Strengths:** Maximizes **Bounded Agency** and stability; clear **Classification** (citizenship/residency rules).
  *   **Weaknesses:** Fails **Conceptual Distinction** by conflating legal status with moral interest. Excludes long-term residents and heavily affected neighbors. Often relies on **Circularity** (citizens define who becomes a citizen).
  *   **Verdict:** Best for institutional stability, worst for moral justification of boundaries.
