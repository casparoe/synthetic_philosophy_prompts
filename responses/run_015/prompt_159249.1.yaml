answer: |-
  # Which Theory of Privacy Are You Actually Committed To?
  ### A Decision Tree for Philosophers and Engineers

  **Instructions:** Read the four cases below. Proceed through the eight questions. Answer based on your immediate intuition about the *case*, not on the theory you think you hold. Follow the path indicated by your answers to find the position your intuitions commit you to.

  **The Cases:**
  1.  **The Diary:** A houseguest photographs pages of your diary while you sleep. The pages are banal (grocery lists, weather notes). They delete the images immediately and never tell you.
  2.  **The Hard Drive:** You buy a second-hand hard drive in good faith. It contains a stranger's medical scans and letters. You open the files to see what is there.
  3.  **The Camera:** An employer installs a break-room camera. It records to a buffer overwritten every sixty seconds. No human ever views the footage. Everyone knows it is there. Gossip stops.
  4.  **The Pharmacy:** A pharmacy sells fully anonymised sales data. No names are attached. However, the data allows a buyer to infer that residents of one specific building have a high rate of a stigmatised prescription.

  ---

  ### The Tree

  **Node 1 (The Diary):** In the Diary case, did the guest wrong *you* personally, even though you never found out and suffered no tangible harm?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Node 2.

  **Node 2 (The Hard Drive):** In the Hard Drive case, did you violate the stranger's privacy, or did your ownership of the physical drive give you the right to look?
  *   **Ownership gave me the right:** Go to **Leaf A**.
  *   **I violated their privacy:** Go to Node 3.

  **Node 3 (The Diary):** In the Diary case, does the fact that the guest *deleted* the images mean your privacy was effectively restored?
  *   **Yes, privacy is about keeping control; control is back:** Go to **Leaf B**.
  *   **No, the moment of access itself broke something:** Go to Node 4.

  **Node 4 (The Camera):** In the Camera case, is your privacy invaded even though no human being ever sees the footage?
  *   **No, privacy requires a human observer:** Go to **Leaf C**.
  *   **Yes, the recording itself is the invasion:** Go to Node 5.

  **Node 5 (The Camera):** In the Camera case, does the fact that the camera *stopped gossip* (a beneficial outcome) make the recording acceptable?
  *   **Yes, the outcome justifies the means:** Go to Node 6.
  *   **No, the recording is wrong regardless of the benefit:** Go to Node 6.
      *(Note: This node separates instrumentalists from deontologists, but both proceed to test group dimensions.)*

  **Node 6 (The Pharmacy):** In the Pharmacy case, is privacy violated even though no *individual* person's name is attached to the data?
  *   **No, privacy is an individual right:** Go to **Leaf C**.
  *   **Yes, the building residents collectively have a privacy claim:** Go to Node 7.

  **Node 7 (The Pharmacy):** Regarding the Pharmacy case, is the violation primarily because the data moved in a way that violated the **expectations** of the pharmacy context, or because the inference creates a **structural vulnerability** for the group?
  *   **Violated expectations/norms of the context:** Go to **Leaf D**.
  *   **Created structural vulnerability/power imbalance:** Go to **Leaf E**.

  **Node 8 (General):** If all records of a privacy violation were erased from the universe (no memory, no data, no consequences), would anything of value still be lost?
  *   **No, value depends on experience/consequence:** (Confirms previous leaf).
  *   **Yes, there is an impersonal value to privacy states:** (Adds a marker of *Objective Value* to your leaf).

  ---

  ### The Leaves

  **Leaf A: The Reductionist Account**
  *   **Commitment:** Privacy is not a distinct value. It is shorthand for property rights, bodily security, or protection from tangible harm.
  *   **Path:** Node 1 (No) OR Node 2 (Ownership).
  *   **Note:** This matches your friend's hard line. If you landed here, you believe privacy complaints are only valid if they map onto theft, physical intrusion, or measurable detriment.

  **Leaf B: The Control Account**
  *   **Commitment:** Privacy is the ability of the subject to control information about themselves. If control is lost, privacy is lost; if control is regained (e.g., data deleted), privacy is restored.
  *   **Path:** Node 1 (Yes) → Node 2 (Violated) → Node 3 (Restored).
  *   **Note:** Common in engineering and liberal legal theory. It focuses on consent and agency.

  **Leaf C: The Access-Based Account**
  *   **Commitment:** Privacy is a state of limited access to the person or their information. It is violated when access occurs, regardless of control or harm, but typically requires a conscious observer (human).
  *   **Path:** Node 4 (Human required) OR Node 6 (Individual only).
  *   **Note:** A classic philosophical position. It treats privacy as a condition of the world, not just a right of the subject.

  **Leaf D: The Contextual Integrity Account**
  *   **Commitment:** Privacy is the appropriate flow of information according to the specific social norms of a context (e.g., healthcare vs. commerce).
  *   **Path:** Node 7 (Expectations/Norms).
  *   **Note:** Dominant in contemporary socio-legal theory. It allows data to move freely if norms are respected, and forbids it even without harm if norms are breached.

  **Leaf E: [Unnamed] The Structural Vulnerability Account**
  *   **Commitment:** Privacy is protection against group-level power imbalances and structural inference, regardless of individual identifiability or contextual norms.
  *   **Path:** Node 7 (Structural Vulnerability).
  *   **Note:** This position is rarely named as a standalone theory. It combines group privacy with a focus on power dynamics rather than norms or individual access. It is often implied in critical data studies but lacks a canonical label.

  ---

  ### Inseparable Leaves
  **Leaf C (Access) and Leaf D (Contextual):** This tree cannot genuinely separate these two if the reader believes that "appropriate access" is simply defined by "human observation." A defender of Contextual Integrity might argue that the *norm* of the break-room is "no recording," landing them in Leaf D, while an Access theorist might argue "no human saw it," landing them in Leaf C. If you answered Node 4 "No" (Human required) but Node 7 "Norms," you are stuck between C and D. The tree forces a choice at Node 6 that may not capture the nuance of your view.

  ---

  ### Note on the Tree Construction

  **Confidence in Leaf Placement:**
  *   **High Confidence:** **Leaf A (Reductionist)** and **Leaf B (Control).** The Diary and Hard Drive cases are classic intuition pumps designed to isolate harm/property from information rights. If you pass Node 1 but fail Node 3, you are almost certainly a Control theorist.
  *   **Medium Confidence:** **Leaf D (Contextual).** The Pharmacy case is a strong proxy for Contextual Integrity, but some Access theorists might agree that group inferences count as "access" to the group, muddying the water between C and D.
  *   **Low Confidence:** **Leaf E (Unnamed).** This is the most fragile category. It captures a growing sentiment in critical algorithm studies (that privacy is about power, not just secrets), but many who land here might simply be "Contextualists" who view norms as inherently power-laden. I have placed it here to give you a label for a view that is coherent but under-theorized.

  **Contested Readings:**
  *   **The Diary Case (Node 1):** A Reductionist will contest the framing. They will argue that *any* wrong here must be a property wrong (trespass) or a psychological harm (distress upon discovery). If you feel a "metaphysical" wrong without harm, you are rejecting Reductionism, but a Reductionist will deny that intuition is valid.
  *   **The Camera Case (Node 4):** Privacy Engineers often contest the "Human Observer" requirement. In engineering, "access" includes system access. Philosophers often insist on consciousness. This tree assumes the philosophical definition at Node 4, which may alienate the engineering half of your reading group.

  **The Weakest Branch Node:**
  *   **Node 5 (Instrumental/Effect):** I am least confident this node does the separating work I assigned it. It asks whether a beneficial outcome (stopping gossip) justifies the recording. This conflates *privacy* with *all-things-considered morality*. A person could believe privacy *was* violated (deontic) but the act was *justified* (consequentialist). This node forces them to say whether the recording is "acceptable," which might lead a Contextualist and an Access theorist to the same answer for different reasons, failing to distinguish their underlying privacy commitments. It is a necessary bridge to get to the Group/Pharmacy cases, but it is the noisiest filter in the tree.
