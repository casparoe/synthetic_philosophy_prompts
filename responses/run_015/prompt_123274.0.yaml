answer: |-
  To build a theory of gender that functions like fiat money without collapsing into economics or biology, you need four specific design specifications. These are not features; they are load-bearing walls.

  **1. Contingent Embodiment (The Body Track)**
  Gender must track bodies not because biology *is* destiny, but because biology is the *interface* for social coordination. In your world, gender tracks bodies for the same reason currency denominations track specific sizes of paper: it reduces transaction costs in social interaction. Bodies are the physical hardware that gender software runs on. The theory must explain that gender hooks onto reproductive capacity, violence potential, or labor division because those are material realities, but it must also allow for the hook to slip. Gender tracks bodies *statistically*, not *ontologically*. It is a map that claims to match the territory, but the map is allowed to override the territory when social utility demands it.

  **2. Infrastructural Inertia (The Stickiness)**
  This explains why gender survives the repeal of laws. Gender is not just a legal status; it is built into the physical architecture of daily life. It is the size of the uniforms, the division of the bathrooms, the syntax of the language, and the design of the tools. When you repeal the law, you haven't changed the doors, the clothes, or the habits. This desideratum demands that gender be treated as a *material infrastructure*, not just an idea. It persists because ripping it out would require rebuilding the physical world, not just changing the rulebook. It is sticky because it is embedded in brick and mortar, habit and expectation.

  **3. Phenomenological Sovereignty (The Genuine Forgery)**
  This explains how a rejected or "counterfeit" gender is still genuinely lived. You must distinguish between *validity* (social recognition) and *reality* (lived experience). A counterfeit bill is still paper; it still occupies space; it still alters the behavior of the person holding it. Similarly, a gender that society rejects is still a real psychological and social force. It generates real consequences (shame, danger, solidarity) and real internal coherence. The theory must allow for a gender to be *socially invalid* but *phenomenologically true*. The "forgery" is not a lie; it is a competing currency that hasn't yet been minted by the state but circulates in the black market of identity.

  **4. Inalienable Constitution (Distinct from Money and Race)**
  To keep gender distinct from money: Money is *alienable* (you can give it away) and *instrumental* (a means to an end). Gender is *inalienable* (you cannot give it away, only share it) and *constitutive* (it is part of the end itself, part of who you are). To keep it distinct from race: Race is typically constructed around *lineage and immutability* (where you come from), whereas gender is constructed around *function and role* (what you do/are expected to do), even if both use phenotype as markers. Race is the credit history you inherit; gender is the line of credit you are assigned.

  **The Tension**
  The two requirements in direct tension are **Contingent Embodiment** and **Phenomenological Sovereignty**.
  If gender is supposed to track bodies (Req 1), then a gender that does not match the body should be theoretically impossible or "false." But if a non-matching gender must be accepted as genuinely lived (Req 3), then the body tracking cannot be the source of gender's truth. You are forced to explain how a map can be "correct" even when it contradicts the territory. This is the engine of conflict in your world: the friction between the physical interface and the social software.

  **The Killer Desideratum**
  **Infrastructural Inertia (Req 2)** is the single desideratum that kills the usual suspects.
  It kills **Performativity** because performativity often implies that gender is a fluid act of will; Inertia shows that the stage is built before the actor arrives, and the walls constrain the performance regardless of intent. It kills **Structural-Functionalism** because functionalism assumes gender persists because it serves a useful purpose; Inertia shows gender persists even when it is dysfunctional, illegal, or inefficient, simply because it is physically embedded in the world. It forces you to stop treating gender as either "biology" or "choice" and start treating it as *environment*.

  Bottom line: Gender is not what you are or what you do, but the physical and social architecture you are forced to navigate.
