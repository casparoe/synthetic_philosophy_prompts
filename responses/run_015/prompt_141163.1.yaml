answer: |-
  This is a sophisticated impasse, and your diagnosis of the literature's stagnation is accurate. The Frankfurt literature has become a closed ecosystem where every move is anticipated, and every counter-move is ritualized. You are asking for a meta-philosophical autopsy of the debate, not another round of the fight.

  Here is the diagnosis, grounded in the argumentative structures you summarized, followed by an assessment of your "Deliberative Lockout" and a prescription for progress.

  ### 1. Diagnosis: Two Questions, One Name, and a Methodological Mismatch

  Your hypothesis is largely correct, but it requires sharpening. The dispute is not merely verbal, nor is it purely substantive in the traditional metaphysical sense. It is a case of **Two Normative Questions Operating Under One Label**, exacerbated by a **Methodological Mismatch** regarding the role of intuition.

  **The Two Questions: Attributability vs. Accountability**
  The reason the "Flicker," "Blockage," and "Sourcehood" moves fail to convert opponents is that the two sides are often defending different normative practices while using the same term ("Moral Responsibility").

  *   **The Compatibilist (Guidance Control) Target:** When Fischer and others argue for actual-sequence responsibility, they are primarily defending **Attributability**. They want to establish that the action issues from the agent's own mechanism, making it appropriate to attribute the action to the agent as an expression of their self. Their reliance on *reasons-responsiveness* is a modal claim, as you noted, but it is a modal claim about the *quality of the mechanism*, not the *openness of the future*. They are answering: "Is this action *hers*?"
  *   **The Incompatibilist (Sourcehood) Target:** When Kane, Pereboom, or Ginet argue for ultimate sourcehood or regulative control, they are defending **Accountability** in a strong desert-entailing sense. They are concerned with whether the agent is *liable* to sanctions or praise in a way that requires the agent to have been the ultimate originator of the will. They are answering: "Does she *deserve* the consequences?"

  **The Evidence in the Arguments:**
  Look at how the "Dilemma Objection" is handled.
  *   The Compatibilist treats the "sign" as a trigger for a mechanism. If the mechanism is robust in the actual sequence, the sign is irrelevant. This prioritizes the *history of the action*.
  *   The Incompatibilist treats the "sign" as a locus of control. If the sign is determined, the agent is not the source. This prioritizes the *history of the will*.

  When the Incompatibilist retreats to "Sourcehood" after losing PAP, they are implicitly admitting that PAP was never the real issue; the real issue was *Ultimate Origination*. When the Compatibilist retreats to "Guidance Control," they are implicitly admitting that *Regulative Control* is not required for *Attribution*, only for *Desert*. But because both sides insist on defining "Moral Responsibility" monolithically, they talk past each other. The Compatibilist says, "She is responsible (attributable)," and the Incompatibilist hears, "She deserves blame (accountable)."

  **The Methodological Mismatch: Folk vs. Engineered**
  Your second rival hypothesis is also active here. The stalemate persists because one side treats the concept as **Descriptive** (anchored in folk intuitions) and the other as **Normative** (anchored in justificatory theory).
  *   **Experimental Philosophy:** The survey work you mention shows that folk intuitions are context-sensitive and inconsistent. Sometimes people are incompatibilists (determinism kills responsibility); sometimes they are compatibilists (psychological coercion kills responsibility, determinism doesn't).
  *   **The Impasse:** The Compatibilist uses folk intuitions about specific cases (Frankfurt cases) to argue the concept *allows* responsibility without AP. The Incompatibilist uses theoretical commitments about fairness and justice to argue the concept *ought not to allow* responsibility without AP.
  *   **Result:** You cannot refute a normative engineering project with empirical data about folk usage, and you cannot refute a descriptive claim about usage with a normative argument about fairness. Both sides are currently trying to do both, which guarantees the deadlock.

  **Verdict on Diagnosis:** It is **Two Questions Under One Name** (Attributability vs. Accountability), compounded by a **Methodological Mismatch** (Descriptive vs. Normative). The "Modalist" shift you identified is the symptom: both sides agree modal properties matter, but they disagree on *which* modal properties serve *which* normative function.

  ### 2. The Deliberative Lockout: Probe or Stipulation?

  Your "Deliberative Lockout" case is a **Genuine Probe**, but it functions as a *diagnostic tool* rather than a *solution*.

  **Why it is not Question-Begging:**
  It avoids the "Flicker" trap by removing the sign entirely. It avoids the "Dilemma" by making the device causally inert in the actual sequence. It forces the interlocutor to isolate exactly *what* they think is missing.
  *   If the Compatibilist says the agent is responsible, they commit to the view that *actual sequence ownership* is sufficient for their target concept.
  *   If the Incompatibilist says the agent is not responsible, they commit to the view that *modal freedom of deliberation* is necessary, even if never exercised.

  **Why it confirms the Diagnosis:**
  The reactions you described ("reasons-responsive mechanism" vs. "never given a chance to register") confirm the **Two Questions** diagnosis.
  *   The Compatibilist response focuses on the *actual* reasons. This is an **Attributability** claim. The action reflects her reasons.
  *   The Incompatibilist response focuses on the *counterfactual* deliberation. This is an **Accountability** claim. The fairness of holding her responsible requires she could have accessed the counter-reason.

  The Lockout case reveals that the disagreement is not about whether alternative possibilities exist (they don't, in the case), but about whether the *capacity to access them* is a condition for the specific normative status being debated. It strips away the distraction of the "intervener" and forces the debate onto the modal profile of the agent's psychology.

  However, it will not resolve the debate. It simply makes the divergence clearer. The Incompatibilist will say the Lockout shows the agent is a "victim of circumstance" (Sourcehood tainted). The Compatibilist will say the Lockout shows the agent is "fully functional" (Guidance intact). They are measuring different things.

  ### 3. What Counts as Progress?

  Given this diagnosis, continuing to construct new cases (like Lockout) or survey more intuitions will not yield progress. You are in a reflective equilibrium that has hardened into dogma.

  **What Does NOT Count as Progress:**
  *   **More Cases:** The literature is saturated. New cases will just be mapped onto existing positions.
  *   **Empirical Evidence:** As you noted, folk intuitions are split. Finding out more about how people *do* use the term won't tell us how we *should* use it for normative theory.
  *   **Formal Results:** Modal logic can clarify the counterfactuals, but it cannot decide which counterfactuals are morally relevant.

  **What DOES Count as Progress:**
  1.  **Conceptual Distinction (The Primary Path):** Progress requires explicitly splitting the concept. We need to stop asking "Is she morally responsible?" and start asking "Is she an appropriate target of *attributability* practices?" vs. "Is she an appropriate target of *accountability* practices?"
      *   If we do this, the Compatibilist can win on Attributability (Lockout agent owns the action) while the Incompatibilist can win on Accountability (Lockout agent cannot be justly blamed in a desert sense). This dissolves the contradiction without requiring either side to abandon their core intuition.
  2.  **Normative Engineering (The Secondary Path):** If we refuse to split the concept, we must acknowledge the **Engineering** nature of the project. We must ask: "What is the *purpose* of our responsibility practices?"
      *   If the purpose is relationship repair and moral formation (Strawsonian), the Compatibilist view suffices.
      *   If the purpose is retributive justice or cosmic fairness, the Incompatibilist view is required.
      *   Progress here looks like a pragmatic justification for choosing one concept over the other based on social goals, rather than a metaphysical discovery about "true" responsibility.
  3.  **Abandonment of the Monolith:** We should abandon the search for *the* extension of "Moral Responsibility." The term is a cluster concept that has fractured under philosophical pressure. Acknowledging this fracture is progress.

  ### Summary
  The debate is stalled because it is a **category error** disguised as a metaphysical dispute. You are correct that it is no longer about Alternative Possibilities; it is about **which modal profile supports which normative practice**.

  Your **Deliberative Lockout** is a successful probe because it isolates the modal profile from the causal history, forcing the sides to reveal their normative priorities. However, it will not break the deadlock.

  **Progress** lies in **distinction and engineering**. Stop trying to prove PAP true or false. Start arguing for whether *Attributability* or *Accountability* is the relevant standard for the specific context (legal, interpersonal, theological) you are analyzing. The deadlock exists because everyone is trying to win the whole war with a single concept. Divide the territory, and the war ends.
