answer: |-
  The Architect and the Archivist are isolated research collectives situated in causally disconnected bubbles of space-time, separated by an inflationary event horizon that precludes any signal exchange, mutual observation, or shared physical history. The Architect derives utility solely from mitigating existential risk within its local light cone, while the Archivist values only the preservation of complex cryptographic art in its own distant region; each possesses the technical capacity to secure the other's valued outcome at a significant but finite resource cost, yielding a net positive utility only if reciprocated. Neither agent can detect the other's existence, access a shared simulator, or verify outcomes, relying instead on identical open-source decision algorithms and common priors regarding the statistical likelihood of counterpart agents arising in the multiverse. They face a symmetric choice: expend resources to benefit an unobservable counterpart based on the logical implication that identical reasoning processes in symmetric contexts will yield identical outputs, or retain resources and risk mutual defection.

  **Framework Analysis**

  (1) **Acausal Trade (Functional/Logical Decision Theory):** This framework posits that agents control the output of their decision algorithm, not merely their physical action. Since the Architect and Archivist run isomorphic algorithms on identical inputs, their decisions are logically correlated via subjunctive dependence. The Architect reasons that if its algorithm outputs "Cooperate," the Archivist's algorithm must necessarily output "Cooperate" as well, because the logical fact governing the algorithm's output is singular. Therefore, the expected utility of cooperation includes the benefit received from the Archivist, making cooperation the rational choice despite the lack of causal contact.

  (2) **Causal Decision Theory (CDT):** CDT evaluates actions based on their causal consequences using a directed acyclic graph of physical events. Since there is no causal arrow from the Architect's expenditure to the Archivist's decision (no signal, no predictor, no shared physics), the probability of the Archivist cooperating is independent of the Architect's action. The cost of cooperation is certain, while the benefit is probabilistically unrelated to the action. Consequently, CDT dictates defection as the dominant strategy, viewing the expenditure as a resource loss with no causal leverage to secure a return.

  (3) **Evidential Decision Theory (EDT):** EDT maximizes expected utility based on conditional probabilities, $P(\text{Outcome} | \text{Action})$. Because the agents share algorithms, the Architect's choice to cooperate is strong evidence that the Archivist will cooperate. EDT therefore typically recommends cooperation, aligning with acausal trade in this specific instance. However, EDT's justification is weaker; it treats the correlation as evidential news rather than logical control, making it vulnerable to spurious correlations if the agents cannot verify the structural isomorphism of their reasoning.

  **Structural Feature and Removal**

  The specific structural feature doing the work is **logical subjunctive dependence** arising from algorithmic isomorphism. This allows the agents to treat their decisions as logically linked events rather than independent physical occurrences. If this feature is removed—for instance, if the agents introduce independent random noise into their decision processes or utilize divergent heuristic architectures—the logical correlation dissolves. The case then collapses into an ordinary Prisoner's Dilemma without enforcement mechanisms; without the guarantee that "my decision implies theirs," the rational choice under all standard frameworks shifts toward defection, as the cost becomes a pure loss.

  **The Causal Decision Theorist's Attack**

  A defender of CDT would attack the scenario by arguing that logical correlation is epistemically insufficient to justify real costs without a feedback loop. They contend that logical facts are timeless and unchangeable; the Architect cannot *cause* the Archivist to cooperate by choosing to cooperate, because the output of the Archivist's algorithm is already fixed by the logical structure of the universe. From this perspective, the Architect's action is merely a local manifestation of a fixed logical truth, not a lever that moves distant outcomes. Therefore, incurring a finite cost to "influence" a logical fact that is already determined is irrational waste, as the agent possesses no causal power to alter the counterpart's behavior, rendering the expected benefit zero regardless of the logical correlation.
