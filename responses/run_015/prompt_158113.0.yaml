prompt: |-
  Adopt the role of an expert in decision theory with a background in rationalist philosophy and formal epistemology. Before constructing anything, take a few minutes to brainstorm the precise conditions under which logical correlation can substitute for causal interaction, especially when agents have incommensurable utility functions and no shared observation channel.

  Construct a thought experiment to specifications. Design a one-paragraph scenario involving two isolated agents—call them Architect and Archivist—who occupy causally disconnected regions of space-time. Architect values reducing existential risk within its own observable light cone; Archivist values preserving complex artistic structures in distant regions that Architect can never observe and that do not causally affect Architect's outcomes. Each can perform a costly action that benefits the other, but neither can observe the other's existence, actions, or outcomes, and no perfect predictor or simulator mediates between them. The agents must be realistic—ordinary research collectives or AI systems with finite, realistic resources—not omniscient entities, and the payoffs must be finite and comparable rather than astronomical or exotic.

  After presenting the scenario, walk through the reasoning for each framework: (1) acausal trade—explain how logical correlation through shared reasoning architecture supports mutual cooperation; (2) causal decision theory—explain why the absence of causal feedback drives mutual defection; and (3) evidential decision theory—explain where it lands and why it may or may not align with the other two. Then identify the specific structural feature that does the work (logical correlation without physical interaction or common knowledge of rationality), explain what happens if that feature is removed (does the case collapse into ordinary bargaining?), and address how a defender of causal decision theory would attack the scenario—specifically, whether logical correlation is epistemically strong enough to justify real costs without any feedback loop. Keep the response rigorous, focused, and free of bibliographic requests or citations.
