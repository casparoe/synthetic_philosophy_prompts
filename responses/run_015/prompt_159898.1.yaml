          *   *Wait, looking closer:* The Border Collie row says "having words does not by itself promote." Species K has combinatorial calls. If the Collie is Skinnerian with words, K is likely Skinnerian or Popperian with calls. But K rehearses silently. The Crow rehearses silently and is Popperian. So K is Popperian.
          *   *Most Constraining:* The **Border Collie** row. It prevents K from being Gregorian just because it has combinatorial calls. The **Crow** row pushes it to Popperian because of the internal rehearsal.

      *   **4. Further Questions:**
