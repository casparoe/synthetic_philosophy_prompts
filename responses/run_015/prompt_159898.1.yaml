          *   *Force Case:* We need a case that splits "Internal Simulation" vs "Cultural Tools." A Popperian creature that invents a tool but dies before teaching it? Or a Gregorian creature that loses the tools?
          *   *Better Force Case:* An AI. (Wait, that's the bonus question). Let's construct a biological one. A chimpanzee that teaches its offspring a specific nut-cracking technique (accumulation) vs. one that figures it out alone every time. Or: A human isolate who invents a private sign language (Home Sign). Is that Gregorian? (Usually considered proto-language, not full Gregorian).
