answer: |-
  Dear friend,

  It sounds like you and your friend had a magnificent debate, the kind that strips away the comfortable vagueness of textbook definitions and forces you to confront the actual architecture of your intuitions. The fact that she refused to answer the synthetic cell question is the most telling datum of all, because it confirms that she sensed the collision between two powerful principles she has been applying all along. Based on the track record you provided, I am going to predict that once she stops refusing to answer, she will say the synthetic cell is alive. I believe this because the weight of her previous verdicts rests much more heavily on a principle of autonomous organization than on a principle of historical lineage, even though the lineage intuition is what caused her hesitation.

  The rule I think she is actually running is what I would call autonomous cellular integrity. Under this rule, a thing is alive if it is a bounded chemical system that maintains its own boundary and internal organization through its own metabolism, with the caveat that this capacity can be dispositional rather than active at every moment. This rule explains her firm exclusion of the mitochondrion better than any historical rule could. A mitochondrion divides and has a genome, so a historical view might be tempted to call it alive, but she was firm that it is not. Why? Because it does not build its own boundary or synthesize its own proteins; it is dependent on the host cell for its organization. It lacks autonomy. This same lack of autonomy excludes the virus, which relies on the host for replication, and the ribosome, which is a tool rather than a system. Conversely, the rule includes the endospore and the seed because they retain the disposition to resume that self-maintenance, and it includes the mule because the individual does not need to reproduce to maintain its own organization. Crucially, it excludes the self-replicating RNA because, while it evolves, it lacks the bounded, self-maintaining chemical architecture of a cell. The synthetic cell fits this rule perfectly. It is organizationally identical to a bacterium, it maintains its own boundary, and it is autonomous. The only thing it lacks is history, but her verdict on the mule suggests she does not require an individual to contribute to history, and her verdict on the endospore suggests she does not require continuous activity. Therefore, the lack of ancestors should not disqualify it.

  There are, however, other rules that fit her earlier verdicts almost as well, and it is important to see why they are inferior fits. The first is the historical rule you identified, which states that life is a property inherited from a lineage. This rule successfully excludes the self-replicating RNA and the computer program because humans made them, and it excludes the virus because it is made by the host cell. It predicts that the synthetic cell is not alive, which is the source of her hesitation. However, this rule struggles with the mitochondrion. Mitochondria do arise from other mitochondria through division, possessing a clear lineage distinct from the nuclear cell line. If lineage were the primary criterion, the mitochondrion should be alive, or at least a much harder case than she presented. Her firmness suggests that current dependence trumps ancestral history. The second alternative is an evolutionary rule, which defines life as any system capable of Darwinian evolution. This rule predicts the synthetic cell is alive, agreeing with my prediction, but it fails to explain her rejection of the self-replicating RNA. That RNA molecule copies itself with variation and evolves under selection, satisfying the astrobiological working definition perfectly. Her rejection of it signals that evolution alone is insufficient without the specific cellular organization she seems to value. A third alternative is a purely metabolic rule, requiring active chemistry. This fails immediately on the endospore, which she counts as alive despite two centuries of metabolic silence, unless one adopts the dispositional reading that my preferred rule already incorporates.

  To separate the surviving rules from each other, specifically the autonomous organizational rule I believe she holds versus the historical lineage rule that is tempting her, I would not ask about the synthetic cell itself again. Instead, I would put to her the case of a sterile synthetic cell. Imagine we assemble a cell from scratch exactly as before, capable of metabolism and self-repair, but we engineer it so it cannot divide. It is an autonomous, self-maintaining chemical system that will live for a time and then die without offspring. The organizational rule predicts this cell is alive, just like the mule. It has the internal integrity and autonomy that defines life for her, even if it cannot propagate. The historical rule, however, predicts it is not alive. It has no parents, and it will have no children. It is a dead end in both directions. If she says the sterile synthetic cell is alive, she confirms that organization and autonomy are the true criteria, and her hesitation on the fertile synthetic cell was merely a residual respect for biogenesis. If she says it is not alive, then lineage is the deeper rule, and she should logically reconsider the mitochondrion or the mule. This case discriminates where the fertile synthetic cell only half does, because the fertile cell immediately creates a lineage, allowing a historical proponent to argue that life begins once the chain is started. The sterile cell removes that possibility entirely, forcing a choice between the capacity to live and the history of being born.

  I hope this helps you settle the bet without needing to open a textbook. It seems to me that your friend is a functionalist at heart who is momentarily troubled by the ghost of vitalism, but the consistency of her exclusions points toward autonomy as her true north.

  Warmly,

  Your friend
