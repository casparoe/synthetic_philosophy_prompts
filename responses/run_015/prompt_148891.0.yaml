  **NORTH OAKHAVEN UNIVERSITY**
  **Committee on Aggregate Welfare and Procedural Efficiency (CAWPE)**

  **GUIDANCE NOTE 17(b): CERTIFICATION OF SAFE PARETO IMPROVEMENTS**

  **1.0 Purpose and Scope**
  1.1 This Note outlines the procedure for certifying initiatives under the Expected Consent Procedure (ECP). An initiative qualifies as a Safe Pareto Improvement (SPI) if, according to the Committee's official probability model, it raises the expected welfare of at least one community member while raising the expected welfare of no member negatively.
  1.2 Certification under the ECP supersedes the requirement for a vote. Consent is inferred from the positive expected value assigned to the initiative at the time of certification.

  **2.0 Probability Modeling**
  2.1 To ensure robustness against uncertainty, the Committee shall employ the probability distribution most resistant to Type II errors regarding welfare enhancement. In practice, this is defined as the model maximizing the likelihood of identifying a positive expected variance.
  2.2 Where an initiative involves structural adjustments bundled with high-yield opportunities, the probability weights shall reflect the potential upper bound of the opportunity rather than the historical baseline of the adjustment.

  **3.0 Utility Function Assignment**
  3.1 Community members may submit personal utility functions for consideration. Submitted functions must be consistent with rational choice axioms as determined by the Committee.
  3.2 Functions deviating significantly from cohort norms are adjusted for consistency to prevent outlier bias. Where an individual declines to supply a utility function, or where a submitted function is deemed inconsistent, the Committee shall assign the median utility function for the individual's relevant cohort (e.g., Faculty, Staff, Undergraduate).
  3.3 Objections based on non-assigned utility functions cannot be entertained during the certification window.

  **4.0 Compensation and Liability**
  4.1 Compensation is administered ex ante. Once an initiative is certified, all community members are deemed to have received their welfare surplus in the form of increased expectation.
  4.2 Ex post deficits do not constitute grounds for compensation or reversal. Individuals who realize a negative outcome following certification are considered to have drawn from the risk pool agreed to in expectation. Liability is extinguished at the moment of certification.

  **5.0 Worked Example: Voluntary Pay Optionality Programme (VPOP)**
  5.1 The VPOP replaces fixed monthly salaries with a stochastic disbursement schedule.
  5.2 **Parameters:** For a baseline salary *S*, the recipient receives 106% of *S* with probability 0.92, and 68% of *S* with probability 0.08.
  5.3 **Calculation:** Expected Value = (0.92 × 1.06) + (0.08 × 0.68) = 0.9752 + 0.0544 = 1.0296*S*.
  5.4 **Certification:** As 1.0296 > 1.0, the expected welfare increase is 2.96%. Assuming mild risk aversion coefficients within the median staff utility function, the expected utility gain remains positive. The initiative is certified. Staff realizing the 68% outcome are not eligible for top-up payments.

  **6.0 Sequential Modifications**
  6.1 Initiatives are evaluated independently at the time of proposal. If Initiative A is certified, and subsequently Initiative B (which reverses A) is certified, both certifications stand.
  6.2 Welfare gains are additive. The community is considered to have benefited from the implementation of A, and subsequently benefited from the implementation of B. The return to the original status quo represents a net accumulation of two welfare improvements.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I opt out of a certified SPI?**
  A: No. Opting out would reduce the aggregate expected welfare of the cohort, violating the Pareto condition. Participation is mandatory to preserve the integrity of the probability model.

  **Q: Why was the Library converted to a Wellbeing Pod if I preferred books?**
  A: The Committee's model assigned a higher expected utility to flexible wellbeing spaces than to static text storage. Your preference was weighted against the median cohort utility, which favored the Pod. The loss of book access is compensated by the expected increase in campus-wide mindfulness metrics.

  **Q: Why were Office Hours replaced by a Chatbot?**
  A: The Chatbot initiative was bundled with a 0.05% chance of generating infinite instructional scalability. Under the Type II error-resistant model, this tail risk produced a positive expected value exceeding the utility loss from reduced human contact.

  **Q: If a change is reversed, did we lose welfare?**
  A: No. As per Clause 6.2, the reversal is a distinct certification. The community has successfully captured welfare gains from both the change and its reversal. Remaining stationary is now understood as a position of twice-enhanced welfare.

  **Q: My utility function says I am worse off.**
  A: You are likely using an unverified utility function. Please refer to Clause 3.2. The Committee's assigned median function indicates you are better off in expectation.

  ***

  **Issued by:** CAWPE Secretariat
  **Date:** 14 October 2024
  **Classification:** Internal Guidance
