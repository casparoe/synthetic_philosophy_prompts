  3.  **Evaluate the Steps:**
      *   *Step (1):* "Explaining why X happened means listing the things before it that raised the chance of X." -> *Contestable.* Probabilistic causation is common, but deterministic causation exists in physics. In history, probabilistic is standard.
      *   *Step (2):* "The only way to tell which things raised the chance is to look back from X..." -> *Strong point, but slightly overstated.* We can use models, but specific historical attribution usually requires knowing the outcome.
      *   *Step (3) & (4):* "So any causal story... is told from a standpoint that already knows the ending." / "Knowing the ending... makes the ending feel inevitable." -> *This is the Hindsight Bias core.* Psychologically true. Logically, it creates a selection bias in *narrative*, not necessarily in *causation*.
      *   *Step (5):* "If a way of working reliably bends its own results... discount everything." -> *Too strong.* We correct for bias; we don't discard the method.
