answer: |-
  Here is a practical tool based on the "Dollar Auction" theory, adapted for community management.

  ### The Theory in Plain English
  In a Dollar Auction, people bid $1.50 for a $1 bill because they don't want to lose the 90 cents they already bid. In your center, people argue for three hours over a $200 projector because admitting they were wrong feels like losing the three hours they already spent arguing.

  This checklist forces the group to look at the **future cost**, not the **past investment**.

  ---

  ### The "Stop the Bleeding" Checklist
  *Run this when a discussion has looped more than twice or voices have raised.*

  **1. The Hard Value Question**
  *   **Ask:** "What is the maximum dollar value or concrete outcome of this decision?"
  *   **Stop if:** Everyone agrees on the number (e.g., "$200" or "One movie night").
  *   **Facilitator Note:** Write this number on the board. Do not let it move.

  **2. The Sunk Cost Audit**
  *   **Ask:** "How many staff/volunteer hours have we spent discussing this so far? Multiply that by $25/hour. Is that number higher than the Hard Value?"
  *   **Stop if:** The cost of the argument is already 50% of the Hard Value.
  *   **Facilitator Note:** This makes the "wasted time" visible. It usually shocks people into silence.

  **3. The Escalation Check**
  *   **Ask:** "Are we arguing about the equipment/plan, or are we arguing about who was right last time?"
  *   **Stop if:** More than two people admit it's about "principle" or "precedent."
  *   **Facilitator Note:** If it's about principle, move to Question 5 immediately. Facts won't solve this.

  **4. The Walk-Away Test**
  *   **Ask:** "If we table this decision today and do nothing, what actually breaks in the next 30 days?"
  *   **Stop if:** The answer is "Nothing critical" or "We just use a backup."
  *   **Facilitator Note:** This exposes false urgency.

  **5. The Values Call (The Gut Check)**
  *   **Ask:** "Does this decision violate a core value of the center (inclusivity, safety, transparency)?"
  *   **Stop if:** Yes.
  *   **Facilitator Note:** **This is where the checklist ends.** If it's a values clash, you cannot vote. You must decide.

  ---

  ### Case Study 1: The $200 Projector
  *Context: 3 hours spent arguing. Board members dug in. Money is tight.*

  **Running the Checklist:**
  1.  **Hard Value:** $200 (cost of projector) + $50 (screen/rental). Total: $250.
  2.  **Sunk Cost:** 10 people x 3 hours x $25/hr (volunteer/staff time value) = **$750.**
      *   *Result:* **STOP.** You have already spent 3x the value of the projector arguing about it.
  3.  **Escalation:** Members are saying, "I already told the kids we'd have a movie."
      *   *Result:* This is face-saving, not planning.
  4.  **Walk-Away:** If we don't buy it, we use the large TV in the lobby.
      *   *Result:* Nothing breaks.
  5.  **Values:** No values violated.

  **The Verdict:**
  **Buy the projector immediately and close the discussion.**
  *Why:* The argument is now more expensive than the object. The "Dollar Auction" trap is active. Buying it is the cheapest way to buy silence and move on.

  **The "Hateable" Answer (Alternative Verdict):**
  If your budget is strictly zero, the checklist says: **Cancel the movie night.**
  *Why people will hate it:* The kids were promised a movie. Volunteers look unreliable.
  *Why it's the right call:* If you can't afford $200 without this much pain, you can't afford the event. Continuing the argument costs $750 in time; canceling costs $0. People will be angry you canceled, but they will be furious if you spend next month arguing about cables.

  ---

  ### Case Study 2: The Summer Program Leadership
  *Context: Two volunteers (Sarah and Mike). Both told parents they are "Lead." Backing down = losing face.*

  **Running the Checklist:**
  1.  **Hard Value:** One program running successfully.
  2.  **Sunk Cost:** High. Both have recruited staff based on their leadership.
      *   *Result:* Cannot simply "undo" the recruitment.
  3.  **Escalation:** "I told the parents I'm in charge." "Well I told the city I'm in charge."
      *   *Result:* **STOP.** This is purely ego/face. The checklist cannot solve ego.
  4.  **Walk-Away:** If both step down, the program is canceled.
      *   *Result:* High cost (kids lose out).
  5.  **Values:** **Integrity and Trust.** You cannot have two "Leads" with conflicting authority.

  **The Verdict:**
  **Facilitator Call Required (Values).**
  The checklist fails here because the "cost" is reputation, not money. You cannot vote on this.
  *   **Action:** You (the Director) must meet with them separately.
  *   **Solution:** Create two distinct roles. "Program Lead" (Sarah) and "Operations Lead" (Mike).
  *   **The Hard Part:** If they refuse, you must pick one based on who is better suited, and offer the other a public "Thank You" award to save face.
  *   **Why the checklist breaks:** In a Dollar Auction, the prize is fixed. Here, the prize (status) is flexible. You have to change the prize to stop the bidding.

  ---

  ### Where This Procedure Breaks Down (Be Honest)

  **1. The "Zombie" Argument**
  Sometimes people know the math (Question 2) and *still* keep arguing. This happens when the conflict isn't about the projector or the title; it's about **power**.
  *   *Sign:* Someone says, "It's not about the money, it's about the principle," but refuses to define the principle.
  *   *Fix:* You must adjourn the meeting. "We are circling. I am making the call. We are doing X."

  **2. The Intangible Value**
  The checklist assumes you can put a dollar value on time. In a community center, **social cohesion** has value.
  *   *Sign:* The group agrees the argument is stupid, but they need to vent to feel heard.
  *   *Fix:* Allow 10 minutes of "venting time" where no decisions are made, then cut the mic.

  **3. The "Hateable" Decision**
  In the Projector case, if you decide to **Cancel the Movie Night** to save the budget, the parents will be mad.
  *   *Reality:* The checklist is a logic tool. Community work is emotional.
  *   *Fix:* When you deliver the hateable answer, own it. "I know you're mad. I looked at the hours we spent arguing, and we spent $750 of volunteer time to save $200. That's bad management. I'm sorry the movie is off, but I won't waste your time again."

  ### Summary for Your Meetings
  Print this out. When the temperature rises, put it on the table.
  1.  **Value?** (Write it down)
  2.  **Cost of Argument?** (Calculate it)
  3.  **Ego or Fact?** (Identify it)
  4.  **What breaks if we stop?** (Test it)
  5.  **Director's Call.** (If values clash, you decide).

  If you hit Step 2 and the Cost > Value, you are legally in a Dollar Auction. **End the meeting.**
