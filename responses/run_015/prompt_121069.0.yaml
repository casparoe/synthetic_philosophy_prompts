prompt: |-
  You are an expert philosopher of mind and cognitive science with particular familiarity with personal identity, extended cognition, and philosophy of technology. Before answering, take a moment to brainstorm the conceptual landscape: what distinguishes gradual substrate transition from instantaneous destructive copying, how external cognitive scaffolding complicates the boundary of the self, and where standard theories of persistence tend to fracture under incremental change.

  Write the full specification—the desiderata—that any adequate theory of personal persistence through gradual mind uploading and neural substrate replacement must meet. Do not provide bibliographies, reading lists, or citations; the evaluation should stand on conceptual grounds alone.

  For each requirement, include the motivating case or consideration behind it, and flag whether it is non-negotiable or a preference of a particular camp. Be sure to cover:

  - The baseline comparison: gradual neuron-by-neuron synthetic substitution versus instantaneous destructive scanning and reconstruction, and why the theory must treat them differently if at all.
  - The intermittent reversibility case: during transition, up to forty percent of cognitive function has been mapped to synthetic substrate but can be reversibly rolled back to biological tissue without data loss. The theory must specify whether the subject is singular, branching, or in a genuinely liminal state during rollback, and whether identity survives the round-trip.
  - Distributed cognitive scaffolding: prior to any internal replacement, the subject already relies on integrated external digital devices (memory stores, processing aids) that function as parts of their cognitive system. The theory must explain whether these external components count toward identity-bearing continuity once internal substrate also begins to shift, without arbitrarily contracting the boundary of the self at the skull.
  - The branching problem at intermediate stages: if backup snapshots exist at various points in the gradual process, what determines that the forward-moving stream is the original rather than a high-fidelity duplicate?
  - Phenomenal binding continuity: whether there is a substantive fact about subjective experience being preserved across substrate gaps, whether temporary fragmentation of binding is compatible with survival, and how the theory distinguishes loss of continuity from mere functional interruption.
  - The distinction between strict identity and psychological continuity, between survival and flourishing, and between the original biological organism and a functionally equivalent successor system—none of which may be collapsed.

  State any results or constraints from neuroscience or philosophy of mind the theory must respect, such as findings about neural plasticity and the extended mind thesis, and identify any pair of desiderata that appear jointly unsatisfiable (for instance, demanding both strict bodily continuity and full substrate independence).

  Finally, briefly score three broad families of view against your list—psychological-continuity theories, embodied or animalist accounts, and patternist or functionalist approaches—keeping the weight on the criteria rather than on the scorecard.

  Write in polished American English.
