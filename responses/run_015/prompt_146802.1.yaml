answer: |-
  The debate you and your friend engaged in strikes at the heart of political philosophy: is justice a discovered truth that merely requires protection, or is it a constructed order that requires imposition to exist at all? Blaise Pascal's *Pensées* (specifically fragment 298, often cited as "Justice and Force") provides a ruthless lens for examining the Little Rock Crisis. Pascal argues that we cannot know true justice by reason alone; therefore, we establish conventions backed by authority. "Justice without force is powerless; force without justice is tyrannical."

  Analyzing Little Rock through this framework does not simply validate your friend's moral optimism or your realist skepticism. Instead, it reveals the tragic mechanics of how rights become real, while exposing the hollowness that remains when force is the only metric of validity.

  ### 1. The Dialectic of Force and Justice in Little Rock

  In Pascal's view, *Brown v. Board of Education* (1954) represented a claim to justice, but until 1957, it was, in a political sense, "powerless." In Arkansas, the prevailing "justice" (convention) was segregation, backed by the force of local custom and initially the Arkansas National Guard under Governor Faubus.

  When Eisenhower deployed the 101st Airborne, he was not merely protecting a pre-existing moral truth; he was engaging in the Pascalian act of making the just *strong*. For Pascal, a right that cannot be enforced is not a political right; it is a philosophical opinion. The bayonets did not just secure the entry of the Little Rock Nine; they transmuted the Supreme Court's ruling from a moral aspiration into a political reality. Without the 101st, *Brown* in Arkansas would have been what Pascal calls "contradicted"—a law that exists on paper but is nullified by the reality of offenders who face no consequence.

  ### 2. The Counterfactual: Unjust or Unenforced?

  You asked: *If Eisenhower had refused to act and Governor Faubus had permanently blocked the Nine, would school desegregation have been unjust in the Pascalian sense, or merely unenforced?*

  This is the crux of the Pascalian dilemma. For Pascal, there is no "natural" justice accessible to human reason that overrides established authority. Justice is defined by what is authorized and enforced.
  *   **The Pascalian Answer:** If Eisenhower had refused, desegregation would not have been "unjust" in a moral sense (Pascal allows for Christian charity or truth), but it would have ceased to be "Justice" in the political sense. The local convention (segregation), backed by local force (Faubus's Guard), would have remained the operative "justice" of Arkansas.
  *   **The Implication:** This supports your counter-argument. In a strictly Pascalian reading, a judicial ruling without the muscle to secure compliance is not yet justice; it is an unenforced claim. If the federal government lacks the will to enforce the convention, the convention dissolves, and the "justice" reverts to whatever order the dominant local force can sustain.

  However, this reveals the chilling relativism of Pascal's view. It suggests that if the South had successfully seceded or nullified federal authority through sufficient force, segregation would have become "just" simply because it was the enforced order. Your friend's insistence that *Brown* was morally correct *before* the soldiers arrived appeals to a Natural Law tradition that Pascal explicitly rejects as unknowable by reason alone.

  ### 3. Mapping Institutions: Convention vs. Natural Right

  The crisis illustrates the friction between three sources of authority, mapped onto Pascal's distinction between force and justification:

  *   **The Supreme Court (The Claim):** SCOTUS represents the attempt to ground justice in reason and constitutional text. However, as Alexander Hamilton noted, the judiciary has "neither force nor will." In Pascal's terms, the Court articulates the *convention* but lacks the *force*. It relies on the "mystical foundation of authority"—the belief that its words matter. Little Rock proved that this mystical foundation cracks when local force opposes it.
  *   **The State Executive (The Local Force):** Faubus wielded force but claimed it was in service of a different justice (States' Rights/Custom). Pascal would note that Faubus was attempting to maintain an older convention. His failure was not moral, but strategic: he lacked superior force.
  *   **The Federal Government (The Sovereign Force):** Eisenhower represents the monopoly on legitimate violence. By federalizing the Guard and deploying the 101st, he aligned the superior force with the federal convention. In Pascalian terms, he made the "just" (the new federal convention) "strong."

  The conflict arises because the Federal Government claimed to be enforcing *Natural Right* (Equality), while acting through *Conventional Power* (Federal Supremacy). Pascal would argue we cannot know if it is truly Natural Right; we only know it is the stronger Convention.

  ### 4. Where Pascal Illuminates: The Risk of Tyranny

  Pascal warns: "Force without justice is tyrannical." But he also implies that *making* the just strong often looks like tyranny to those who do not accept the convention.

  Little Rock vividly illustrates this risk. To the federal government, the 101st Airborne were guarantors of constitutional rights. To many white Arkansans, they were an occupying army. Pascal's framework explains this resentment perfectly: when justice is imposed by force rather than arising from local custom, it is experienced as violence. The "justice" of desegregation, because it required paratroopers to implement, carried the stain of coercion.

  Pascal illuminates the tragedy that even righteous ends require "unrighteous" means (coercion) to succeed in a fallen world. The federal presence restored order, but it did not restore consensus. It proved Pascal's point that authority rests on a "mystical foundation"—once that foundation is shaken (by resistance), authority must reveal the sword beneath the robe. This demystification is dangerous; it shows the governed that obedience is ultimately extracted, not freely given.

  ### 5. Where Pascal Fails: Moral Agency and the Limits of Power

  However, the Little Rock Crisis also exposes the limits of Pascal's cynicism.

  **The Moral Agency of the Nine:**
  Pascal's framework reduces the actors to vessels of force or subjects of convention. It struggles to account for the Little Rock Nine. These students possessed no force. They had no institutional authority. By Pascal's logic, they should have been powerless. Yet, their dignity and endurance generated a moral force that eventually shifted the "convention" of the nation. They appealed to a justice that existed *prior* to enforcement. If justice were purely conventional and dependent on force, their sacrifice would have been meaningless until the soldiers arrived. Instead, their courage helped *create* the political will for the soldiers to be sent. This suggests justice can precede force, acting as a catalyst for it.

  **Reductionism:**
  Pascal risks reducing Constitutional rights to mere power relations. If the 101st Airborne had been withdrawn in 1958 (which nearly happened), and schools had closed (as they did in 1958-59 under "Massive Resistance"), Pascal would say justice had simply shifted back to segregation. But our moral intuition rejects this. We say justice was *delayed* or *thwarted*, not that segregation became "just" again. This implies a standard of justice external to enforcement—a Natural Right—that Pascal denies we can know.

  **Legitimacy vs. Coercion:**
  Finally, Pascal underestimates the power of legitimacy. The 101st Airborne did not have to shoot their way into the school; their presence was largely sufficient. Why? Because a critical mass of the country accepted the *justice* of the ruling. If it were purely force, the resistance would have been more violent. The fact that the force worked relatively quietly suggests that the "mystical foundation" was already shifting. Force was the midwife, not the parent, of the new order.

  ### 6. Conclusion: Justice Posterior or Aligned?

  Does Little Rock confirm that justice is always posterior to force?

  It confirms that **political justice** is posterior to force. Rights that cannot be defended are, in the realm of human governance, fragile abstractions. Your friend is correct that *Brown* was morally true before 1957, but you are correct that it was not *politically effective* justice until the force of the executive branch aligned with it. Pascal is right that without the sword, the gavel is wood.

  However, the episode reveals a limit to Pascal's claim. If justice were *only* the will of the stronger, the Civil Rights Movement would have been merely a contest of militias. Instead, it was a moral appeal that *mobilized* force. The federal government did not act simply because it was stronger; it acted because the moral conviction behind *Brown* had become strong enough to compel the use of force.

  In the end, Little Rock suggests a synthesis: Pascal is right about the **mechanism** of justice (it requires enforcement to be real in this world), but your friend is right about the **source** (it draws power from a moral truth that transcends mere convention). The tragedy of the human condition, which Pascal understood well, is that we cannot have the moral truth without the force, yet the force always threatens to corrupt the truth. The 101st Airborne secured the school, but they could not secure the hearts of the crowd. That required a justice that bayonets cannot provide.
