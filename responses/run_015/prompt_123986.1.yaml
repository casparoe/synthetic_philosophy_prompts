      *(Refining the "Earned vs. Broken" point)*: An "earned" surprise respects the *spirit* of the contract (coherence) even if it violates the *letter* of prediction. A "broken" promise (bad twist) violates the spirit. In SEP, if the teacher gives the exam on Friday, the epistemic view says "Contradiction," but the narrative view says "Trust me." If the teacher *doesn't* give the exam, *that* is the broken contract.

      *(Final Polish)*: Ensure the ending lands strongly on the specific question about logical impossibility vs. disappointed expectation.

  8.  **Final Review against constraints:**
