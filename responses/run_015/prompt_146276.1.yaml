answer: |-
  ### Madhyamaka Taxonomy: The Tetralemma & Emptiness Decision Tree

  This taxonomy sorts Madhyamaka positions based on **methodological commitments** rather than historical chronology. It begins with how one uses logic, moves to the status of "emptiness," and ends with the specific Tibetan interpretations of the fourth corner (neither exists nor does not exist).

  **Note on Indistinguishability:** Modern scholarship (Leaf 6) suggests the split between the first two Indian schools may be a later Tibetan projection. If you accept this, Leaves 1 and 2 collapse into a single "Early Madhyamaka" position.

  ---

  #### **START: When you use logic to refute an opponent, do you need to agree on a shared definition of the subject?**
  *(e.g., To prove "fire is not hot," must we both agree "fire" exists conventionally first?)*

  *   **YES (Autonomous Logic):** You need shared premises to build a valid syllogism. Conventional reality has enough stability to support logical inference.
      *   **→ Go to Branch A**
  *   **NO (Consequential Logic):** You only use the opponent's premises to show they lead to absurdity (*prasaṅga*). You assert no positive thesis of your own.
      *   **→ Go to Branch B**

  ---

  #### **BRANCH A: The Autonomous Logicians (Svātantrika)**
  *Commitment:* Conventional truth has "autonomous validity" (*svatantra*). Things function reliably enough to be logical subjects.

  **Q: After negating the four corners, is the fourth corner ("Neither") a description of a non-dual reality?**
  *   **YES:** The fourth corner points to a positive, ineffable reality that logic hints at but cannot capture.
      *   **LEAF 1: Yogācāra-Svātantrika (e.g., Śāntarakṣita)**
          *   **View:** Emptiness is the ultimate nature of mind; the fourth corner is a mystical reality.
          *   **Awkward Commitment:** **Hidden Ontology.** Risks turning "emptiness" into a subtle *thing* (a true existence) that underlies phenomena.
  *   **NO:** The fourth corner is just a logical step; the goal is to establish emptiness as a correct view.
      *   **LEAF 2: Sautrāntika-Svātantrika (e.g., Bhāviveka)**
          *   **View:** Emptiness is a predicate established by logic.
          *   **Awkward Commitment:** **Bureaucratic Realism.** Risks making conventional reality too "real," undermining the radical nature of emptiness.

  ---

  #### **BRANCH B: The Consequentialists (Prāsaṅgika)**
  *Commitment:* No autonomous logic. Emptiness must apply to itself (*śūnyatā-śūnyatā*).

  **Q: Is "Emptiness" a final Ultimate Truth that stops the regress, or is it merely medicine?**
  *   **IT IS MEDICINE (Therapeutic):** Emptiness is a tool to cure grasping. Once cured, you drop the tool. No "correct view" remains.
      *   **LEAF 3: Radical Quietism (e.g., Some readings of Candrakīrti / Nyingma)**
          *   **View:** The fourth corner is the cessation of all conceptualization (*spros bral*).
          *   **Awkward Commitment:** **Nihilistic Silence.** If no view is correct, how do you distinguish enlightenment from confusion? Risks making the path impossible to teach.
  *   **IT IS AN ULTIMATE FACT (Foundational):** Emptiness is the final way things are, even if it isn't an "entity."
      *   **→ Go to Branch C (Tibetan Elaborations)**

  ---

  #### **BRANCH C: The Tibetan Split (Within Prāsaṅgika)**
  *Both agree emptiness is empty, but disagree on how conventional truth functions.*

  **Q: Does conventional truth have a valid, non-deceptive structure that can be precisely mapped?**
  *   **YES:** Conventional truth is valid within its own sphere. We can make precise positive claims about karma and logic without contradicting emptiness.
      *   **LEAF 4: Gelug Prāsaṅgika (e.g., Tsongkhapa)**
          *   **View:** The fourth corner is a "non-affirming negation" (a precise deletion of inherent existence).
          *   **Awkward Commitment:** **Reified Emptiness.** Critics argue this turns emptiness into a precise object of knowledge, subtly reifying the ultimate.
  *   **NO:** All conceptual structures, even "valid convention," are proliferations. Logic ultimately fails.
      *   **LEAF 5: Sakya/Nyingma Non-Assertive (e.g., Gorampa)**
          *   **View:** The fourth corner is total freedom from extremes. Gelugpa views are just another subtle grasping.
          *   **Awkward Commitment:** **Ineffable Anarchy.** Risks undermining ethical distinctions (if all concepts are equal proliferations, is harm also empty?).

  ---

  #### **THE HISTORICAL CAVEAT**
  *   **LEAF 6: The "No Split" Position (Modern Scholarship)**
      *   **View:** The Svātantrika/Prāsaṅgika distinction was systematized by 12th-century Tibetans, not the Indian masters themselves. Bhāviveka and Candrakīrti may be arguing over rhetoric, not ontology.
      *   **Awkward Commitment:** **Doxographical Collapse.** If the split is fake, centuries of Tibetan debate curriculum are based on a category error. (Use this leaf to flag to your seminar that Leaves 1 & 2 might be indistinguishable in practice).

  ---

  ### Summary for Seminar Handout

  | Position | Fourth Corner Status | Emptiness of Emptiness? | Risk / Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **Svātantrika** | Logical position / Mystical hint | No (Emptiness is established) | **Hidden Ontology** (Emptiness becomes a "thing") |
  | **Radical Prāsaṅgika** | Cessation of thought | Yes (It's medicine) | **Quietism** (No path, no view, no goal) |
  | **Gelug** | Precise Ultimate Truth | Yes (But knowable) | **Reified Emptiness** (Ultimate becomes an object) |
  | **Sakya/Nyingma** | Ineffable Experience | Yes (Beyond logic) | **Ineffable Anarchy** (Ethics become unstable) |
  | **Historical Skeptic** | Later invention | N/A | **Curriculum Collapse** (The debate is fabricated) |

  **How to use this:**
  1.  Ask your flatmate: *"Do you think Nāgārjuna leaves us with a correct view (Gelug) or no view at all (Sakya/Quietist)?"*
  2.  Ask your tutor: *"Does Leaf 6 invalidate the distinction between Leaves 1 and 2, or is the distinction pragmatic regardless of historical accuracy?"*
