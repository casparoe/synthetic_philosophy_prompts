prompt: |-
  You are serving as a grader for a graduate seminar in practical rationality and institutional decision-making. The exam posed the following question, followed by a student's answer. Assess the answer rigorously.

  Exam question: Martin Shubik's dollar auction involves two bidders competing for a prize valued at one dollar, with the institutional twist that both bidders must pay their final bid regardless of who wins. First, explain why rational agents might nevertheless enter the auction and escalate their bids well past the value of the prize, and carefully distinguish the strategic mechanism driving that escalation from the ordinary sunk-cost fallacy. Second, apply that distinction to this institutional case: a municipal government has spent $40 million on a partially built convention center. Independent auditors now project that completing the facility will cost an additional $60 million and that operations will run at a sustained deficit. One faction on the council argues that stopping now would "waste" the $40 million already expended. A second faction argues that abandoning the project would brand this administration as the one that "lost" $40 million of public money, and that this reputational damage makes completion politically necessary even if the economic returns are negative. Identify which faction's reasoning, if either, genuinely tracks the logic of the dollar auction rather than the sunk-cost fallacy, and describe what a rational decision procedure should look like in this setting, accounting for both economic and strategic considerations.

  Student answer:
  The dollar auction creates an escalation trap because both bidders pay their last bid and only the winner gets the dollar. Once you have bid fifty cents, it is rational to bid fifty-five cents rather than lose fifty cents and get nothing. This shows that people keep investing because they do not want to lose what they have already put in, which is exactly the sunk-cost fallacy. In the council case, both factions are exhibiting sunk-cost reasoning. The first faction wants to finish the center to justify the $40 million already spent, which is the classic form of the fallacy. The second faction is also driven by the same psychological bias—fear of admitting failure and wasting prior investment—just expressed through concern for reputation rather than direct financial recovery. A rational decision procedure should ignore all past expenditures and compare only the future costs of $60 million against the future benefits. Because the projected benefits are negative, the rational choice is to halt construction immediately. There is no meaningful strategic difference between the auction dynamics and the council debate; both demonstrate that initial commitment pulls rational agents into irrational escalation to protect prior investment.

