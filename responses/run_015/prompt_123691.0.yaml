  Quine's rejection of moral values stems fundamentally from the claim that moral predicates lack the empirical content required for legitimate regimentation into canonical notation, meaning they are eliminated as non-cognitive before the indispensability test even arises. For Quine, ontological commitment is determined by the bound variables in our best scientific theories, but this criterion only applies after discourse has been regimented into the canonical notation of first-order logic to clarify truth conditions. Mathematical entities survive this process because they are indispensable to the structure of scientific theories that successfully predict sensory experience, granting them a derivative empirical significance despite their abstract nature. Moral predicates, however, fail to enter canonical notation as genuine properties because they do not function to describe the world in a way that can be confirmed or disconfirmed by sensory stimulation. Consequently, to regiment a statement like "x is good" without elimination, one would have to treat it as a factual claim, but Quine argues such claims lack cognitive meaning within an empiricist framework. If one attempts to preserve the statement by translating it into descriptive terms like "x is approved by S," the moral property is eliminated in favor of a psychological fact, thereby avoiding ontological commitment to value entities. If moral terms were somehow to survive regimentation intact as indispensable posits, Quine's criterion would indeed force a realist commitment, but he blocks this possibility by arguing that moral language is fundamentally non-cognitive and thus excluded from the web of belief that faces the tribunal of experience. The deeper issue is therefore epistemological: moral terms are barred from the ontology not because they fail the indispensability test, but because they are deemed unfit for the scientific theory that undergoes the test in the first place.
