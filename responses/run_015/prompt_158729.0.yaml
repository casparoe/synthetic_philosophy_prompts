      *   Audit the procedure? (Check).
      *   Table included? (Check).
      *   Better analogy proposed? (Check).

  *(Self-Correction during drafting)*: I need to be careful about the "Library" point. The group tried to use *their* libraries (numpy, etc.). This is effectively choosing a UTM $U_{python}$. The Invariance Theorem says $K_{U_{python}}(x) \approx K_{U_{bare}}(x) + C$. If $|x| < C$, the ordering flips. This is correct. The fix isn't to charge for the library *using the data*, it's to acknowledge that for small $n$, Universal Induction is not truly "universal" in practice—it depends on the reference machine. However, for the *theory*, the reference machine is fixed. The group's error was trying to *learn* the reference machine from the data. That violates the setup. I need to make sure this distinction is sharp.

