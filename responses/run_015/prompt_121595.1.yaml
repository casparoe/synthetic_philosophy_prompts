answer: |-
  # Q&A Prep Sheet: Framework Steadfastness
  **Seminar:** Philosophy of Science / Social Epistemology
  **Thesis:** Conciliationism applies to evidential disagreement (shared data/virtues); Steadfastness applies to structural disagreement (competing virtues/no shared currency).

  ---

  ### 1. The Collapse Objection (The "Dogmatism" Worry)
  **Objection:** "If an agent can unilaterally reclassify any intractable evidential disagreement as 'structural' simply by claiming they weigh virtues differently, doesn't Framework Steadfastness provide a rationalization for dogmatism? How do you prevent the distinction from collapsing into 'I'm right, so it's structural'?"

  **Reply:** "That is the central stability constraint of the view. Reclassification isn't unilateral; it requires a *diagnostic of incommensurability*. In evidential disputes, agents can point to the specific data point or calculation where the divergence occurs. In structural disputes, the disagreement persists even when data is held fixed, because the *criteria for theory choice* differ (e.g., simplicity vs. scope). My claim is that steadfastness is permitted only when agents recognize that further argument appeals to virtues the other party explicitly rejects. It's not about asserting superiority; it's about recognizing the absence of a neutral arbiter."

  **Weakest Point:** Relying on agents' *recognition* of incommensurability is subjective. A dogmatist might sincerely claim incommensurability where none exists.
  **Concession Strategy:** *Do not deny the risk.* Concede that the distinction is vulnerable to abuse. Argue that this is a feature of *all* epistemic norms (e.g., claiming 'evidence' can also be manipulated). Your defense is that FS describes the *rational structure* of the situation, not a psychological safeguard. Concede that external markers (e.g., persistent failure to converge despite shared data) are needed to validate the 'structural' classification, rather than agent self-reporting.

  ### 2. The Formalist Objection (Virtues as Priors)
  **Objection:** "From a Bayesian perspective, theoretical virtues just *are* prior probabilities or likelihood functions. If two agents disagree on virtues, they simply have different priors. But Bayesianism allows for updating on the fact of disagreement itself. Why does different priors preclude conciliation?"

  **Reply:** "Standard Bayesian conciliation assumes a shared sample space and likelihood structure where the disagreement is about the posterior given the data. Structural disagreement is deeper: it's a disagreement over the *model space* itself. If your likelihood function penalizes complexity and mine rewards it, we aren't just assigning different probabilities to the same hypothesis; we are evaluating different hypothesis spaces. You cannot 'split the difference' on priors without assuming a higher-order prior over priors, which reintroduces the structural regress. There is no 'view from nowhere' to average from."

  **Weakest Point:** Hierarchical Bayesian models *do* attempt to handle uncertainty over model structures. Dismissing them as "reintroducing regress" might look like ignoring formal solutions.

  ### 3. The Peerhood Objection
  **Objection:** "Standard conciliationism defines peers as equals in intelligence and honesty. If you encounter a structural disagreement, does that not undermine their peer status? If they are still peers, why withhold conciliation? If they aren't peers, why does the disagreement matter?"

  **Reply:** "Peerhood concerns *competence*, not *identity of priors*. Two brilliant physicists can be peers while one values mathematical elegance and the other values empirical coverage. Recognizing them as a peer means acknowledging their structural framework is internally coherent and historically productive, not that it is identical to yours. Conciliationism demands we lower confidence when a peer disagrees. I argue we lower confidence in their *specific claims*, but not in our *framework*, because the disagreement reveals no error in processing, only a divergence in starting constraints."

  **Weakest Point:** This stretches the standard definition of "peer" in social epistemology, which usually implies similar epistemic positions, not just similar IQ.

  ### 4. The "Shared Currency" Objection
  **Objection:** "You claim there is no shared epistemic currency in structural disputes. But isn't 'predictive accuracy' or 'empirical adequacy' a universal currency? If your framework predicts better, shouldn't the other conciliate?"

  **Reply:** "Predictive accuracy is indeed a currency, but structural disagreements often arise precisely when data is *underdetermined*. If both frameworks accommodate the existing data equally well, the choice rests on virtues like 'unification' or 'ontological parsimony,' which are not reducible to accuracy. If accuracy were the only currency, structural disagreements would resolve immediately upon new data. The persistence of the disagreement despite shared empirical success is what marks it as structural."

  **Weakest Point:** Eventually, new data *does* usually break the tie. Arguing that structural disagreement persists *despite* data risks making the category empty or temporary.

  ### 5. The Gradualist Objection
  **Objection:** "Disagreement isn't binary. It's a spectrum from minor evidential weighting to major structural divergence. Your view creates a cliff-edge: conciliate here, be steadfast there. How do you locate the threshold without arbitrariness?"

  **Reply:** "I agree it is a spectrum, but rational norms often require binary switches for action, much like belief thresholds. The threshold is located at the point where *appeal to shared evidence ceases to move the needle*. When I show you data X, and you say 'I accept X but my virtue V discounts its relevance,' we have crossed from evidential to structural. The norm shifts when the mechanism of persuasion shifts from data-display to framework-advocacy."

  **Weakest Point:** "Ceases to move the needle" is vague. One more argument might have moved the needle. It's hard to know *when* you've crossed the threshold in real-time.

  ### 6. The Self-Undermining Objection
  **Objection:** "Is Framework Steadfastness itself an evidential claim or a structural claim? If it's structural, why should I, a conciliationist, accept it? If it's evidential, shouldn't you conciliate with the majority of epistemologists who disagree with you?"

  **Reply:** "FS is a *second-order* normative claim about the conditions under which first-order conciliation is rational. It is akin to a rule of inference. I am not asking you to accept FS because I weigh virtues differently; I am arguing that the *logic of disagreement* changes when the shared background conditions vanish. You don't need to share my framework to see that without a common metric, averaging is mathematically undefined."

  **Weakest Point:** This risks looking like a "get out of jail free" card. If FS is a structural claim, and we structurally disagree on FS, your own theory says I don't need to conciliate with you.

  ### 7. The Historical Convergence Objection
  **Objection:** "History of science shows structural disagreements (e.g., Newton vs. Leibniz) eventually resolve. If conciliationism is suspended, don't you prolong these disputes unnecessarily? Isn't the goal to resolve the structural divide?"

  **Reply:** "FS doesn't prohibit persuasion; it prohibits *automatic* confidence reduction. Suspending conciliation prevents premature synthesis that obscures genuine theoretical differences. Sometimes, maintaining the tension between frameworks generates more data than forcing a compromise. Steadfastness preserves the diversity of research programs until empirical underdetermination is lifted. It protects the ecosystem of inquiry."

  **Weakest Point:** Hard to prove that "premature synthesis" is worse than "prolonged dispute." This is a pragmatic claim that is difficult to verify.

  ### 8. The Cooperation Objection
  **Objection:** "Science is a collective enterprise. If agents remain steadfast on structural issues, doesn't that fragment the community into incompatible silos, preventing collaborative problem solving?"

  **Reply:** "Collaboration requires agreement on *tasks*, not necessarily on *foundations*. Agents can agree on data collection protocols (evidential level) while disagreeing on the ultimate interpretation (structural level). FS actually facilitates this by clarifying where agreement is possible (data) and where it is not (theory choice). It prevents wasted energy trying to conciliate on issues where no common currency exists."

  **Weakest Point:** In practice, foundational disagreements often poison data collection agreements (theory-ladenness of observation). FS might underestimate how deeply structural disagreement penetrates.

  ---

  ### Strategic Advice for the "Dogmatism" Objection (#1)
  **Do not** try to prove that dogmatism is impossible. It isn't.
  **Do** argue that *all* epistemic norms are vulnerable to bad-faith application (e.g., claiming "I have private evidence").
  **The Concession:** Concede that the *application* of the Evidential/Structural distinction is fallible.
  **The Core Defense:** Maintain that the *logic* holds: *If* the disagreement is truly structural (incommensurable virtues), conciliation is mathematically/normatively undefined. The risk of misclassification does not invalidate the norm for correctly classified cases. Shift the burden: Ask the objector to provide a model of how one "splits the difference" between two incommensurable value systems without begging the question.
