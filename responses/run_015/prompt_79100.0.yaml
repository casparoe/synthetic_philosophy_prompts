  ### Brainstorming Pass: Candidate Cruxes and Filters

  Before drafting the joint statement, I have isolated the four candidate cruxes you identified and filtered them for substantive versus terminological disagreement.

  1.  **The Relata Question:** *Are absences entities?*
      *   **Status:** Substantive. Inclusionists posit negative facts or absences as ontological items. Restrictionists posit only positive occurrences. This is not merely verbal; it dictates the logic of the causal relation.
  2.  **The Counterfactual Question:** *Is dependence constitutive or evidential?*
      *   **Status:** Substantive. Inclusionists treat counterfactual dependence as the essence of causation. Restrictionists treat it as a reliable symptom of a productive process that is absent in omission cases.
  3.  **The Semantics Question:** *Is "omission causation" literal or pragmatic?*
      *   **Status:** **Potentially Verbal.** This is the locus of your suspicion. If Inclusionists define "cause" as *counterfactual dependence* and Restrictionists define "cause" as *physical production*, they agree on the world but disagree on the label. However, because the label carries normative weight (liability, explanation), the dispute has substantive consequences. I will flag this in the assessment.
  4.  **The Determinacy Question:** *Is there a fact of the matter?*
      *   **Status:** Substantive. Restrictionists often argue that without a physical link, the claim is indeterminate until context fixes it. Inclusionists argue the truth value is fixed by the counterfactuals.

  **Filter on Proposed Machinery:**
  *   **The Substitution Test:** This risks begging the question against Restrictionists. If an omission is *not* an event, it cannot be substituted by an event without changing the subject. I will draft the statement to reflect that Restrictionists reject the test's presuppositions.
  *   **The Shadow Event:** This is likely acceptable to Inclusionists as a descriptive heuristic but unacceptable to Restrictionists as an ontological commitment. I will record this divergence explicitly.

  **Filter on Case Template:**
  *   **Adult 2 (Asleep):** Both camps should agree this is not a cause (no capacity/dependence). This is a safe anchor for agreement.
  *   **Adult 4 (Walker-In/Out):** This is the danger zone. Inclusionists may view this as an omission (failure to rescue). Restrictionists may view this as a positive action (walking away) that simply failed to prevent. The distinction between "kind" and "evidence" here is the hardest sell.

  ***

  ### JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics of Causation by Omission
  **Date:** [Current Date]
  **Signatories:** [Inclusionist Representative], [Restrictionist Representative]

  #### PART I: AGREED CLAIMS

  We, the undersigned, acknowledge the following points of convergence regarding the cases under discussion, specifically the "Infant in Bath" scenario and its variants.

  1.  **Moral and Legal Asymmetry:** We agree that the moral and legal asymmetry between acting and omitting does not settle the metaphysical status of omission-causation. One can maintain that omissions are metaphysically identical to actions regarding causation while maintaining they are distinct regarding liability, and vice versa.
  2.  **The Asleep Adult (Adult 2):** We agree that the adult who is asleep and *could not have heard* the infant is not a cause of the death in any sense relevant to this inquiry. There is no counterfactual dependence, and there is no relevant positive occurrence linking them to the outcome.
  3.  **The Competent Reader (Adult 1):** We agree that Adult 1 is morally and legally answerable for the death in a way that a passerby on the street is not. We disagree on whether this answerability is grounded in a causal relation identical to positive causation (Inclusionist) or a distinct normative relation that mimics causal language (Restrictionist).
  4.  **Explanatory Utility:** We agree that citing an omission (e.g., "The lifeguard didn't swim") often provides a correct and indispensable explanation for an outcome, regardless of whether that explanation is ultimately causal in the strict metaphysical sense.
  5.  **Non-Causal Dependence:** We agree that there are cases of counterfactual dependence that are not causal (e.g., the barometer and the storm). We disagree on whether omission cases belong to this non-causal category or the causal one.

  #### PART II: DISAGREEMENTS TABLE

  | Crux | Inclusionist Position | Restrictionist Position |
  | :--- | :--- | :--- |
  | **1. The Relata** | Causation relates events and absences. An absence is a real feature of the world (a negative fact or lack) capable of standing in causal relations. | Causation relates occurrent particulars (events/processes). Absences are not entities; they are truths about the non-occurrence of events. |
  | **2. Counterfactual Dependence** | Counterfactual dependence is sufficient for causation. If the death would not have occurred had the adult swum, the not-swimming caused the death. | Counterfactual dependence is necessary but not sufficient. It marks a causal connection but does not constitute it. Omission cases lack the productive link (energy/matter transfer) required for causation. |
  | **3. Semantics vs. Pragmatics** | Statements like "The omission caused the death" are literally true. The semantics of "cause" encompasses counterfactual dependencies involving absences. | Statements like "The omission caused the death" are pragmatically useful but literally false or elliptical. They compress a claim about responsibility or expectation, not a causal relation. |
  | **4. Determinacy** | There is a determinate fact of the matter about whether an omission caused an outcome, fixed by the counterfactual structure of the world. | In the absence of a physical link, there is no determinate causal fact until a context (legal, moral, explanatory) selects the omission as the relevant factor. |

  #### PART III: TESTS, CASES, AND PREDICTIONS

  We agree to submit the following specific applications and proposed machinery to further adjudicate our positions. We record our divergent predictions below.

  **A. The Case Template: "Infant in Bath"**

  *   **Adult 1 (Competent Reader):** Reads in the next room, could have saved the child.
      *   *Inclusionist:* The reading is not the cause; the *not-saving* is the cause.
      *   *Restrictionist:* The reading is a positive event unrelated to the death. The *not-saving* is not an event and thus not a cause.
  *   **Adult 2 (Asleep):** Asleep, could not have heard.
      *   *Agreement:* Neither camp attributes causation here. (See Part I, Claim 2).
  *   **Adult 3 (Intentional/Struck):** Intends to save, struck by car in hallway.
      *   *Inclusionist:* The *being-struck* is a positive cause of the failure to save. The omission is pre-empted or explained by the positive event.
      *   *Restrictionist:* The *being-struck* is the sole positive cause of the continued non-rescue. There is no omission-cause to compete with it.
  *   **Adult 4 (Walker-In/Out):** Enters, sees child, leaves.
      *   **Question:** Does Adult 4 differ from Adult 1 in *kind* or only in *evidence*?
      *   **Inclusionist Prediction:** They differ only in the quality of evidence (knowledge/intention). The causal relation (omission to save $\to$ death) is identical in structure.
      *   **Restrictionist Prediction:** They differ in kind. Adult 4 performs a positive action (walking out) which may be a cause of continued exposure, whereas Adult 1 merely fails to act. Adult 4's case involves a positive intervention that failed to prevent, not a pure omission.

  **B. Proposed Machinery: Status and Objections**

  1.  **The Substitution Test:** *Claim: "Omission O caused E" must survive restatement as "Positive Event P (which O excluded) would have prevented E."*
      *   **Inclusionist Status:** Accepts. This confirms that the absence is functionally equivalent to a presence in the causal network.
      *   **Restrictionist Status:** **Rejects.** This test begs the question. It assumes the absence *excluded* a positive event in a causally relevant way. We hold that the absence did not exclude the event; the event simply did not occur. To substitute them is to pretend the absence is a force.
  2.  **The "Shadow Event":** *Term: The occurrence that would have occupied the omission's place had things gone otherwise.*
      *   **Inclusionist Status:** Accepts as a useful referent for the negative fact. The Shadow Event (the swimming) is the counterpart to the Absence (the not-swimming).
      *   **Restrictionist Status:** **Rejects as Ontology.** We accept the term only as a description of a possible world, not as a "shadow" existing in the actual world. To treat the Shadow Event as a relata in the actual world is to reify a possibility.

  **C. The Verbal Dispute Hypothesis**

  *   **Hypothesis:** At least one crux is verbal, turning on the univocal use of "cause."
  *   **Joint Finding:** We identify **Crux 3 (Semantics)** as the primary candidate for a verbal dispute.
      *   *Reasoning:* If Inclusionists define "cause" as *indebtedness to counterfactual dependence* and Restrictionists define "cause" as *physical production*, we agree on all physical and counterfactual facts regarding the Infant in Bath. We disagree only on whether the label "cause" applies to the counterfactual relation in the absence of production.
      *   *Caveat:* We note that resolving this as "merely verbal" does not dissolve the dispute, because the label "cause" carries theoretical commitments regarding transitivity, locality, and explanation that differ between the two definitions.

  ***

  ### DRAFTER'S ASSESSMENT AND PUSHBACK

  You asked for pushback rather than compliance. Having attempted to draft this statement within the constraints of the two positions as described, I must report three structural failures that threaten the viability of this collaboration.

  **1. The Substitution Test is Rigged.**
  You asked me to use the Substitution Test. I have included it in Part III, but I must be plain: **The Restrictionists cannot sign off on this test without surrendering their position.** The test requires treating an omission as a placeholder for a positive event. For a Restrictionist, an omission is *not* a placeholder; it is nothing. To ask them to agree that the claim must "survive restatement" with a positive event is to ask them to agree that the omission *is* a positive event in disguise. I have recorded their rejection in the table, but be aware that including this test may cause the Restrictionists to withdraw from the collaboration entirely, viewing it as a trap.

  **2. The "Shadow Event" is Ontologically Inflammatory.**
  Similarly, the term "Shadow Event" is likely to be toxic for the Restrictionists. While they can agree that "something would have happened," calling it a "Shadow Event" suggests it has a status in the actual world (as a shadow requires a light and an object). I have qualified this in the text, but the terminology itself leans Inclusionist. If you want a document both can sign, you should drop the term "Shadow Event" and use "Counterfactual Alternative."

  **3. The Verbal Dispute is Not Contained.**
  I identified Crux 3 (Semantics) as the verbal dispute, as you suspected. However, my assessment is that **this verbal dispute infects the entire document.** If the Inclusionists are using "cause" to mean *counterfactual dependence* and the Restrictionists are using it to mean *physical production*, then Part I (Agreed Claims) is unstable.
  *   When we agree "Adult 2 is not a cause," the Inclusionist means "There is no counterfactual dependence."
  *   The Restrictionist means "There is no physical production."
  *   These coincide in Adult 2, but they diverge in Adult 1.
  *   Therefore, we are not disagreeing about the *world*; we are disagreeing about the *map*.

  **Recommendation:**
  If the goal is to clarify the metaphysics, this document works. If the goal is to resolve the debate, this document reveals that the debate is stalled on definition. I recommend you explicitly ask the working group to define "causation" operationally at the start of the next term. If they cannot agree on a definition that allows them to distinguish their views from mere semantics, the collaboration will remain an argument past each other. The "Infant in Bath" cases are not doing enough work to force a convergence because both camps can account for the intuitions using their own vocabulary. You need a case where counterfactual dependence and physical production *both* exist but yield different results, or where the moral asymmetry forces a metaphysical concession. The current template does not do this.

  **Final Verdict:** The document above is the best possible draft given your constraints, but it functions more as a map of the impasse than a bridge across it. The Restrictionists will sign Part I and Part II. They will likely balk at Part III.B.1. If you require their signature on the Substitution Test, you will not get it.
