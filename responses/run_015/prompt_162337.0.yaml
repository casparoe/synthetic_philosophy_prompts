  Finally, the residual gap reveals that signature realism relocates rather than removes the mystery. Even if we accept signatures as the physical realizers of experience, we can still ask why a signature's being tokened is like something for the subject rather than nothing. The hard problem persists at the level of the signature itself. Relocating the mystery does not vindicate the posit of qualia; it eliminates it by reducing it to a functional role that still begs the question of consciousness. Dennett's quining argument succeeds because it shows that any property worth having is functional and public, while any property that is private and intrinsic is too empty to have. Signature realism accepts the functional property and discards the intrinsic one, thereby conceding that traditional qualia do not exist. The view saves the data but eliminates the ontology, which is precisely Dennett's goal.

