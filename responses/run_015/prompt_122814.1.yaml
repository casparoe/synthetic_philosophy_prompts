answer: |-
  The delay bar at the top of the screen is always green. That's the promise: one hundred milliseconds of buffer, enough time to scrub the saccades, fill the blinks, and smooth the jitter of a human eye moving too fast for its own good. We sell continuity. We sell the feeling that the world is stable, even when the hardware feeding it is shaking in a pocket or vibrating against a dashboard.

  I've been on the night shift for four years. My job is to sit in the quiet room and watch the splitscreen. Left side: Raw Input. Jagged, noisy, full of the static that comes from wetware interfacing with silicon. Right side: Rendered Output. Clean, stable, continuous. My task is simple. If the Rendered matches the intent of the Raw, I click Approve. If the smoothing algorithm hallucinated a bridge where there was a gap, or erased a hazard because it looked like noise, I click Flag.

  Most nights are empty roads and blank walls. The brain is good at predicting reality, and our software is good at mimicking the brain. Tonight, though, Case 8940 is blinking red in the queue.

  I pull up the clip. It's a driving sequence, taken from the perspective of a sedan moving at forty miles per hour. Nighttime. Streetlights smear into long orange ribbons on the Raw feed. On the Rendered side, they are steady points of light. The car is moving smoothly, though the Raw shows the subtle vibration of the engine.

  At timestamp 00:14, the discrepancy appears.

  On the Left, the Raw Input, a figure steps out from between parked cars. It's fuzzy, low resolution, just a dark vertical mass against the brickwork. It stands there for three frames. Then the car passes.

  On the Right, the Rendered Output, the space between the parked cars is empty. The algorithm has categorized the figure as shadow artifacts and scrubbed it to maintain visual flow. The road is clear. The driver's experience was uninterrupted safety.

  I pause the video. I zoom in on the Raw frame. The mass has the geometry of a person. Shoulders, head, the slight lean of weight on one leg. It's not noise.

  I open the client file. The account holder is registered under a family plan. The primary user is the driver, but the flagged incident report comes from his daughter. She's listed as a secondary node, sharing the same local network hub. Her medical tag has a rare annotation: *Draft Leak.*

  I read her statement. It's transcribed from a voice memo, shaky and fast.

  "It wasn't like forgetting," she says. "I know what forgetting feels like. You lose the thing. This was... I saw him. I saw the man standing there. I saw him clear as anything. And then, maybe a second later, I saw the road was empty. Not like he moved. Like the first thing got pulled back and the second thing was pasted over it. I saw the edit happen. I saw the before and the after."

  I lean back in my chair. The hum of the server room is the only sound.

  This is the thing we aren't supposed to talk about in the break room. The company philosophy is that the Render *is* the experience. The Raw is just data, electrical impulses waiting to be interpreted. If the algorithm decides the road is empty, then for all functional purposes, the road *was* empty. The hundred-millisecond delay isn't a lag; it's a processing window. The user doesn't experience the Raw and then the Render. They experience the Render, timestamped to feel like the Raw.

  But the girl with the Leak says she experienced both.

  If she's telling the truth, it changes the geometry of the job. It implies there is a moment—a sliver of time—where the unedited world touches the consciousness before the polish is applied. It suggests that the Raw isn't just data; it's a draft of reality that gets overwritten.

  I look at the figure on the Left screen. If I click Flag, the system triggers a recall. The company admits the algorithm failed to identify a pedestrian. There will be an audit. They'll check my logs. They'll see I paused here. They'll ask why I didn't trust the smoothing engine.

  If I click Approve, the record stands. The road was empty. The driver is safe. The girl's experience is categorized as a symptom of her condition, a glitch in her wetware where memory loops back on itself. She saw the man because her brain filled in a gap, then corrected itself. Or she saw the man, and her brain erased him, and she's remembering the erasure as a second event.

  There's no way to know from the outside. That's the trap. Even if I talk to her, even if she swears on a stack of bibles that the first image was real, that experience is happening now, in the telling. Her brain is constructing the memory of the man standing there just as surely as our algorithm constructed the empty road.

  I toggle the view. Left. Right. Left. Right.

  The figure. The empty street.

  If I approve this, I am saying that the smooth version is the truth. I am saying that the experience delivered to the eye is the only one that counts. It's the Orwellian choice: delay the perception until it's safe, and hand over the finished product as if it happened in real time. No harm done, because no one experienced the hazard.

  But the girl says she did. She says she saw the raw frame.

  If that's true, then the edit isn't just a delay. It's a revision. It's Stalinesque. She had the experience of the man, and then the record was doctored. But she kept the receipt.

  I think about the red dot and the green dot. The old experiment. Flash one, then the other. People see one dot moving and changing color. Nothing moves. Nothing changes. The brain paints the motion in the gap. We do the same thing here, just with silicon. We paint over the hazards. We smooth the fear.

  But if the Leak allows people to see the paint drying, then the illusion breaks.

  I look at the cursor. It hovers over the Approve button. The green light on the delay bar at the top of my screen pulses.

  If I flag it, I validate her report. I admit that the Raw feed corresponds to a moment of consciousness that was suppressed. I admit that there is a fact of the matter about what she saw before the software fixed it.

  If I approve it, I maintain the product. The experience is what we deliver. Anything else is just noise.

  But what if the noise is the only thing that's hers?

  The figure on the Left screen seems to shift. It's just compression artifacting, I know that. A trick of the low resolution. But for a fraction of a second, it looks like he's looking at me. Looking through the camera, through the feed, through the hundred milliseconds of buffer.

  The girl says she saw him, and then she saw him vanish. She says the vanishing was part of the sight.

  I think about my own eyes. How much of what I see right now is the room, and how much is the smoothing layer my own brain applies to keep the world from strobing? If I had the Leak, would I see the neurons firing before the image formed? Would I see the edit?

  There is no test for it. There is no experiment that can distinguish between a memory falsified after the fact and an experience delayed until completion. The data looks the same either way. The only difference is the story you tell about where the "you" is sitting in the chain.

  The cursor shakes. Just a little. Tremor in the hand, or jitter in the feed?

  I could call the client. I could ask her to describe the light on the man's coat. If she gets it right, does that prove the Raw was conscious? Or does it just prove her brain is good at guessing details during the reconstruction?

  If I flag it, the audit will ask me what I think happened. I will have to write a report. I will have to choose a category: Algorithmic Error, or User Perception Anomaly.

  One says the machine lied. The other says the mind lied.

  I look at the empty road on the Right. It is peaceful. It is safe. It is the world we promised to sell.

  I look at the figure on the Left. He is standing in the dark. He is waiting.

  My finger rests on the mouse. The green bar pulses. One hundred milliseconds. Enough time to decide who owns the truth. Enough time to rewrite the history of a moment that hasn't technically happened yet.

  I don't click. I just watch the two screens, breathing in the quiet room, waiting to see if the figure moves on his own, or if I have to be the one to make him disappear.
