prompt: |-
  In my reporting on the intersection of moral psychology and normative philosophy, I have followed for more than a decade what looks like a stalled argument about moral foundations theory and its normative implications. The descriptive picture is largely settled: across cultures, liberals tend to weight harm avoidance and fairness more heavily, while conservatives distribute moral concern more evenly across loyalty, authority, sanctity, and liberty. Yet two camps remain locked in place. The normative pluralists treat this asymmetry as evidence that liberal moral cognition is systematically impoverished, missing genuinely binding group-level and purity-based obligations. The debunkers treat the identical asymmetry as evidence that conservative cognition is over-calibrated to tribal defense and hierarchy maintenance, so the extra foundations are evolutionary artifacts with no normative standing. Both sides accept the same cross-cultural data, both agree that suffering is morally bad, and neither has moved.

  My working hypothesis is that they are not really fighting over whether loyalty or sanctity are values at all, but over a hidden meta-normative question—whether moral judgment should function primarily as a universalizable constraint mechanism or as an in-group coordination device—so they are answering different questions under the single heading of who is right. I want an honest diagnosis rather than a survey of positions. Is this disagreement verbal, turning on what counts as a moral foundation versus a psychological bias? Is it substantive, with each side appealing to different standards of evidence for what makes a consideration morally authoritative? Is there a hidden empirical question—perhaps about whether the conservative-weighted foundations operate with universal scope or only in-group scope—doing all the work? Or are we facing bedrock intuitions about whether group loyalty can ever be a moral reason, with no further argument possible? Given your diagnosis, what would actually count as progress: a formal distinction between scope-weighted and domain-expanded reasoning, an empirical finding about cross-cultural application patterns, or a reconceptualization of the debate itself? And if none of those would help, is the impasse a sign that the original question is ill-posed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a reporter/researcher who has been tracking the debate between Moral Foundations Theory (MFT) proponents (normative pluralists) and critics (debunkers) for over a decade.
      *   **Observation:** The descriptive data is settled (liberals = harm/fairness; conservatives = harm/fairness + loyalty/authority/sanctity). The normative debate is stalled.
      *   **The Two Camps:**
          *   *Normative Pluralists:* Liberal cognition is impoverished; conservative foundations reveal missing obligations.
          *   *Debunkers:* Conservative foundations are evolutionary artifacts (tribal/hierarchy); only harm/fairness have normative standing.
      *   **User's Hypothesis:** The fight isn't about values *per se*, but a meta-normative question: Is morality a *universalizable constraint* or an *in-group coordination device*?
      *   **The Task:** Provide an *honest diagnosis* (not a survey). Determine if the disagreement is verbal, substantive, empirical, or bedrock. Suggest what would count as progress or if the question is ill-posed.

  2.  **Deconstruct the Debate:**
      *   *MFT (Haidt et al.):* Descriptive theory turned normative. Claims intuition drives reasoning. Suggests multiple foundations are "natural" and therefore potentially "good."
      *   *The Critique (Debunkers/Single-Foundationalists):* Often rooted in Kantian or Utilitarian traditions. Morality requires impartiality. Loyalty/Authority/Sanctity often lead to partiality/oppression. Therefore, they are biases, not morals.
      *   *The Core Tension:* Is "morality" defined by *function* (binding groups) or *content* (minimizing suffering/maximizing autonomy)?

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* It's about Universalizable Constraint vs. In-Group Coordination.
      *   *Assessment:* This is very sharp. It cuts to the chase. Haidt explicitly defines morality as "systems of interlocking values that bind groups together." Critics define morality as "principles that apply to all sentient beings."
      *   *Verdict:* The user is largely correct, but it's deeper than just "function." It's about the *ontology of moral value*.

  4.  **Diagnose the Nature of the Disagreement:**
      *   *Is it Verbal?* Partly. They define "moral" differently. One says "social function," the other says "impartial justification." But it's not *just* semantics because the definitions carry normative weight.
      *   *Is it Substantive?* Yes. It's about the source of normativity. Is it internal to the culture (pluralism) or external/universal (monism)?
      *   *Is it Empirical?* The user asks if it's about scope (universal vs. in-group). MFT admits foundations *can* be universalized (e.g., sanctity of nature), but critics argue they *inherently* divide. An empirical finding here might help, but it won't solve the normative "ought."
      *   *Is it Bedrock?* Yes. Ultimately, it comes down to: "Is partiality permissible/required in morality?"

  5.  **Formulate the Diagnosis:**
      *   Acknowledge the user's insight (it's accurate).
      *   Refine the diagnosis: It is a **Category Error regarding the Function of Morality**.
      *   The Pluralists view morality sociologically (what *does* it do?).
      *   The Debunkers view morality philosophically (what *justifies* it?).
      *   This is an "Is-Ought" gap disguised as a psychological debate. MFT moves from "is" (people feel this) to "ought" (this is binding). Debunkers reject the move.

  6.  **Determine What Counts as Progress:**
      *   *Formal Distinction?* Yes. Distinguishing "Social Morality" (binding) from "Critical Morality" (justifying).
      *   *Empirical Finding?* Unlikely to solve the normative stalemate. Knowing *how* people use sanctity doesn't tell us if they *should*.
      *   *Reconceptualization?* This is the best path. Move away from "Who is right about the foundations?" to "What work do we want the concept of morality to do?"
      *   *Ill-posed?* The question "Which psychology is morally correct?" is ill-posed because psychology describes mechanisms, not validity.

  7.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Professional, analytical, respectful of the user's expertise (they know the literature). Avoid hedging.
      *   *Structure:*
          1.  Validate the hypothesis (It's strong).
          2.  Diagnose the core conflict (Functionalism vs. Justificationism).
          3.  Address the Verbal/Substantive/Empirical/Bedrock options.
          4.  Propose the path to progress (Reconceptualization).
          5.  Conclude on the "Ill-posed" nature.

      *   *Refining the "Verbal" point:* It's not just a definition fight. It's a fight over *who owns the word*. If MFT wins, "morality" includes binding. If Debunkers win, "morality" excludes binding if it conflicts with impartiality.
      *   *Refining the "Empirical" point:* The user asks about scope. If Sanctity is applied universally (e.g., environmentalism), does that validate it? Liberals do this. So the foundation isn't inherently conservative. This suggests the *content* isn't the issue, the *priority* is.
      *   *Refining the "Progress" point:* We need to stop asking "Is Loyalty Moral?" and start asking "Under what conditions does Loyalty generate moral obligations?"

  8.  **Final Polish:**
      *   Ensure I answer the specific questions: Verbal? Substantive? Empirical? Bedrock? What counts as progress? Is it ill-posed?
      *   Make sure the distinction between *Descriptive MFT* and *Normative MFT* is clear. The stalemate is in the Normative leap.
