answer: |-
  There is no single, canonical term in general logic or rhetoric that captures this specific configuration with the precision you require. In the philosophy of economics, this is frequently discussed under the umbrella of the **"Naturalistic Fallacy"** or the **"Is-Ought Problem,"** and critics like Amartya Sen, Daniel Hausman, and Robert Sugden have extensively dissected it. However, these terms describe the *logical error* rather than the *argumentative pattern* itself.

  While critics often colloquially label this a **Motte-and-Bailey**, your intuition is correct: that label is imprecise here. In a standard Motte-and-Bailey, the "Motte" is a trivial or indisputable truth used to shield a controversial "Bailey." In your description, Stance 1 (Deflationary) is not indisputably true (it is a contentious methodological choice to deny internal states), and Stance 2 (Normative) is not merely an extension but a co-dependent requirement for the framework's policy relevance. The two stances are functionally interdependent, not hierarchically defensive.

  Given the absence of a standardized lexical item, the most precise label for this dialectical configuration is **Strategic Ontological Oscillation**.

  Below is a precise definition, a distinction from related concepts, and the boundary conditions for legitimate vs. illegitimate use.

  ### Precise Definition: Strategic Ontological Oscillation

  **Strategic Ontological Oscillation** is an argumentative pattern in which a theoretical framework exploits an ambiguity in the ontological status of its core construct to deflect criticism and justify conclusions simultaneously. It occurs when a proponent alternates between two distinct interpretations of a concept (e.g., "preference") without explicit justification, such that:

  1.  **Defensive Mode (Formal/Deflationary):** When the framework's predictive accuracy or logical consistency is challenged (e.g., by evidence of bias or irrationality), the concept is defined **operationally**. (e.g., "Preference is *defined* as choice; therefore, choice cannot be irrational.")
  2.  **Offensive Mode (Substantive/Normative):** When the framework is used to derive policy prescriptions or welfare judgments, the concept is treated **realistically**. (e.g., "Choice *reveals* underlying welfare; therefore, policy should maximize choice satisfaction.")
  3.  **Implicit Interchangeability:** The argument relies on the audience accepting that the operational definition (Stance 1) and the realistic interpretation (Stance 2) are sufficiently identical to allow conclusions derived in Offensive Mode to inherit the immunity from critique granted in Defensive Mode.
  4.  **Suppression of Bridging Premises:** The substantive assumptions required to move from Stance 1 to Stance 2 (e.g., "agents are the best judges of their own welfare," or "choice errors cancel out") are left implicit rather than argued.

  ### Distinctions from Related Concepts

  | Concept | Key Difference |
  | :--- | :--- |
  | **Motte-and-Bailey** | **Hierarchy vs. Interdependence.** In Motte-and-Bailey, the speaker *retreats* to the defensible core (Motte) when attacked and *advances* to the controversial claim (Bailey) when safe. In Strategic Ontological Oscillation, both stances are required simultaneously for the theory to function (prediction + policy). The speaker does not retreat; they **pivot** the ontology to suit the immediate dialectical need. |
  | **Lexical Equivocation** | **Word vs. Framework.** Equivocation involves sliding between two dictionary definitions of a word (e.g., "law" as physics vs. jurisprudence). Oscillation involves sliding between two **theoretical interpretations** of a construct (e.g., preference as a mathematical relation vs. preference as a psychological state). The vocabulary remains constant; the truth-conditions change. |
  | **Theoretical Pluralism** | **Transparency vs. Strategy.** Pluralism acknowledges that different models serve different purposes (e.g., "Model A predicts well, Model B explains welfare"). Oscillation masks this distinction, presenting the framework as a **unified** account of human behavior that is both scientifically hard (Stance 1) and ethically authoritative (Stance 2). |
  | **Instrumentalism** | **Methodology vs. Rhetoric.** Instrumentalism is a legitimate philosophical stance (theories are tools, not truth). Oscillation becomes fallacious when an instrumentalist methodology (Stance 1) is used to **smuggle in** realist normative conclusions (Stance 2) without acknowledging the philosophical gap. |

  ### Boundary Conditions: Legitimate vs. Illegitimate Use

  The pattern crosses from legitimate theoretical flexibility into fallacious oscillation based on the handling of the **Bridging Premise**.

  **1. Legitimate Use (Explicit Bridging):**
  A framework legitimately combines deflationary and normative uses if it explicitly states the conditions under which choice data can be treated as welfare data.
  *   *Example:* "We define utility operationally as choice for the sake of modeling. However, to use this for policy, we must *assume* agents have stable preferences and full information. Where evidence suggests bias (e.g., addiction), we adjust the model rather than insisting choice equals welfare."
  *   *Indicator:* The proponent acknowledges that Stance 1 does not *automatically* entail Stance 2 and accepts that empirical evidence (like framing effects) can sever the link between choice and welfare.

  **2. Illegitimate Use (Strategic Oscillation):**
  The pattern becomes fallacious when the link between Stance 1 and Stance 2 is treated as tautological to immunize the theory from critique.
  *   *Example:* "You say this choice was harmful? That's impossible; utility is defined by the choice itself (Stance 1). Therefore, we should design policy to facilitate more such choices because they maximize welfare (Stance 2)."
  *   *Indicator:* The proponent invokes Stance 1 to dismiss counter-evidence (e.g., "revealed preference cannot be wrong") but invokes Stance 2 to claim policy relevance (e.g., "therefore this policy improves lives"). The concept is treated as **ontologically empty** when attacked and **ontologically robust** when applied.

  ### Contextual Note
  Your observation aligns closely with Amartya Sen's critique in *"Rational Fools"* (1977) and Daniel Hausman's work on the *"Preference-Satisfaction Theory of Welfare."* Sen argued that economics conflates **choice consistency** (Stance 1) with **well-being** (Stance 2). He termed this the **"Identity Assumption"**—the assumption that preference, choice, and welfare are identical.

  However, the *argumentative maneuver* of switching between these to deflect criticism is best described as **Strategic Ontological Oscillation**. It allows the theorist to claim the scientific rigor of behaviorism (we only observe choices) while retaining the ethical authority of hedonism (choices track happiness), without paying the philosophical cost for either.
