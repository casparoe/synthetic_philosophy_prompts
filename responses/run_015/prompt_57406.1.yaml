answer: |-
  ### Diagnostic Decision Tree for Constructive Foundations

  **Instructions:** Answer each question based on your actual mathematical practice and intuitions about concrete cases, not on the basis of labels you have encountered in literature. If a question asks whether you *accept* a principle, it means: are you willing to use it in a proof without further justification?

  1.  **The Search Test:** You prove that an unbounded search through the natural numbers *cannot* fail to find a value satisfying a decidable condition. Does this proof hand you the specific value at which it succeeds?
      *   **Yes:** Go to 2.
      *   **No:** Go to 3.

  2.  **The Infinitesimal Test:** Are you prepared to work in a system where there exist non-zero numbers $dx$ such that $dx^2 = 0$?
      *   **Yes:** **Leaf A (Internalism/Smooth Analysis)**.
      *   **No:** **Leaf B (Unrepentant Classical)**.

  3.  **The Infinity Test:** Is the collection of all natural numbers a completed, well-defined totality?
      *   **No:** **Leaf C (Ultrafinitism)**.
      *   **Yes:** Go to 4.

  4.  **The Computability Test:** Is it a mathematical truth that every total function from $\mathbb{N}$ to $\mathbb{N}$ is computable by a Turing machine (or equivalent)?
      *   **Yes:** Go to 5.
      *   **No:** Go to 6.

  5.  **The Meaning Test:** Does the truth of a statement consist *entirely* in the existence of a recursive index realizing it?
      *   **Yes:** **Leaf D (Recursive Realizability)**.
      *   **No:** **Leaf E (Russian School)**.

  6.  **The Choice Sequence Test:** May a real number be defined by a freely proceeding sequence of choices rather than by a fixed rule or law?
      *   **Yes:** Go to 7.
      *   **No:** Go to 8.

  7.  **The Continuity Test:** Must every total function defined on the unit interval $[0,1]$ be uniformly continuous?
      *   **Yes:** **Leaf F (Brouwerian Intuitionism)**.
      *   **No:** (Incoherent Path — see analysis).

  8.  **The Impredicativity Test:** May you define a set by quantifying over a totality that includes the set being defined (e.g., the least upper bound of a set of reals defined via the set of all sets of reals)?
      *   **No:** Go to 9.
      *   **Yes:** Go to 10.

  9.  **The Framework Test:** Is your primary foundational object a *Set* (extensional collection) or a *Type* (rule-governed construction)?
      *   **Type:** **Leaf G (Predicativism)**.
      *   **Set:** **Leaf H (Constructive Set Theory - CZF)**.

  10. **The Power Set Test:** Does the set of *all* subsets of the natural numbers exist as a well-defined completed object?
      *   **No:** **Leaf H (Constructive Set Theory - CZF)**. *(Note: Shared leaf with Q9 Set path)*.
      *   **Yes:** Go to 11.

  11. **The Propositions Test:** Is a proof of "A implies B" literally the same kind of object as a function transforming data of type A to data of type B?
      *   **Yes:** **Leaf I (Martin-Löf Type Theory)**.
      *   **No:** Go to 12.

  12. **The Logic Test:** Is the logic you work in fixed by a universal theory of meaning, or merely by the models you happen to find persuasive?
      *   **Models:** **Leaf J (IZF / Intuitionistic Set Theory)**.
      *   **Meaning:** Go to 13.

  13. **The Truth Test:** Is classical mathematics *false* (because it violates meaning conditions) or merely *non-constructive* (pragmatically useful but lacking witness)?
      *   **False:** **Leaf K (Semantic Anti-Realism)**.
      *   **Non-constructive:** **Leaf L (Bishop-Style Constructive)**.

  *(Note: Leaves H and L may overlap in practice; see analysis.)*

