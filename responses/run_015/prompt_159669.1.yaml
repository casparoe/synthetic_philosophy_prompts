  My flatmate does data annotation for some physics-adjacent AI project — her job is to read two descriptions of a universe and label them either "same world, described two ways" or "two genuinely different worlds." She's annoyingly consistent about it and I've started treating her label set as a philosophical position with a name I don't know. Her track record:

  - every object in the universe shifted two metres west, all distances between things unchanged: she says same world — "that's just moving the origin"
  - every object in the universe moving at a constant 30 km/s in the same direction, with nothing left behind to compare it to: same world — "velocity isn't a property of a whole universe"
  - Newton's bucket: flat water vs. water climbing up the sides, bucket turning relative to the distant stars: different worlds — "the water does something different"
  - two globes joined by a cord in an otherwise empty universe, cord slack vs. cord pulled taut: different worlds — "same reason as the bucket"
  - every event happening five minutes later than it does, same order of events: same world
  - a mirror-image of our universe: she refused to rule and told me never to ask again

  Now there's a pair coming up and I want to guess her label before it does. Universe A contains nothing at all except a single bucket of water with a flat surface. Universe B contains nothing at all except a single bucket of water whose surface is climbing the sides. No other matter anywhere in either universe. Same world or two?

  I can see at least two rules that fit all six verdicts — something like "rotation is absolute even though position and uniform motion aren't," which makes the lone bucket a real difference, and something like "only relations between material things are real," which makes it one world described twice, since there's nothing for the bucket to turn relative to. I also can't tell whether she'd be running a Galilean-spacetime-flavoured version of the first or a Machian version of the second or just "a difference has to show up somewhere."

  So: what label do you think she gives the lone bucket, and why? What are the candidate rules that fit her verdicts, and what does each predict on the new case? And if you could hand her one more pair of universes to separate whichever rules are still tied afterward, what would it be — my guess is the whole universe rotating rigidly with every distance held fixed, but tell me if that's not the sharpest one. Also say if the mirror-image punt is secretly diagnostic or if it's just noise. I don't much care who's right about the actual physics; I want the rule she's implicitly committed to and where it breaks.
