answer: |-
  # Q&A PREP SHEET: YORK COLLOQUIUM
  **Thesis:** Intention as Evidence, Not Instruction (The Resolute Ambiguity Rule)
  **Context:** 40 Translators, 2 Lawyers, 1 Scholar, 1 Chair.

  ---

  ## THE EIGHT OBJECTIONS (Ordered by Potential Damage)

  ### 1. The "Grammar Forces Choice" Objection
  **Who:** A senior translator (likely German or Slavic languages).
  **Vocab:** *Grammatical obligatoriness, aspect, gender, syntactic constraints, unnaturalness.*
  **The Objection:** "You speak of preserving ambiguity as a norm. But in my language, the verb *must* mark aspect. The pronoun *must* mark gender. To preserve your ambiguity, I have to break my grammar or sound like a robot. Are you asking us to produce 'translationese' in the name of a theoretical purity that the target language cannot sustain?"
  **Your Reply (2 mins):** "I'm not asking you to break your grammar. I'm asking you to treat the ambiguity as *evidence* of the text's density, not a problem to be solved. If your grammar forces a choice, look for compensation elsewhere. If the English 'we' is ambiguous, and French forces 'nous' (inclusive) or 'on' (vague), can the surrounding context be tweaked to restore the uncertainty you lost in the pronoun? The rule isn't 'never choose'; it's 'don't choose simply to make your life easier or to impose a reading I suggested. Choose because the target language demands it, then mourn the loss and compensate.' The loss is real, but collapsing the ambiguity *without necessity* is the sin."
  **Softness:** Risks sounding like you're asking for more work ("compensate elsewhere") without defining how.
  **Concession?** **No.** This is the core linguistic challenge. Conceding here kills the thesis.

  ### 2. The "Reader Contract" Objection
  **Who:** A commercial literary translator.
  **Vocab:** *Reader immersion, flow, friction, target culture, communication.*
  **The Objection:** "My primary contract is with the reader in my language, not with you or your source text. If an ambiguity reads as a mistake or a confusion to them, I have failed. Why should a reader in Warsaw struggle with a nuance that a reader in London glides over? Isn't clarity a virtue in the target culture?"
  **Your Reply (2 mins):** "I agree your contract is with your reader. But I'd argue that readers are more resilient than publishers think. They know fiction is a puzzle. If a sentence in Polish feels slightly 'off' or open-ended, that friction might be the very experience the book offers. If we smooth every rough edge to ensure 'flow,' we turn the novel into a consumable product rather than a shared public object. I'm not asking for confusion; I'm asking you to trust your readers to tolerate the same uncertainties your own literature tolerates."
  **Softness:** Idealistic. Doesn't address sales or bad reviews.
  **Concession?** **Partial.** Concede that *clarity* is often a virtue, but argue that *premature* clarity is the vice.

  ### 3. The "Authorial Interference" Objection (General)
  **Who:** The Chair or a skeptical translator.
  **Vocab:** *Interference, micromanagement, trust, professional autonomy.*
  **The Objection:** "You say intention isn't instruction. But you're standing here giving a talk to tell us how to do our jobs. Isn't this rule just a more sophisticated form of instruction? You're replacing 'Do what I say' with 'Do what I say about not listening to me.'"
  **Your Reply (2 mins):** "That's a fair trap. If I present this as a rule for *you* to follow, I'm contradicting myself. I'm proposing it as a norm for *me* to follow as an author. It's a promise that I will not call you to ask 'what did I mean here?' It's a request that my publisher not put me in the loop on queries. It's me tying my own hands so that you can work on the text, not on me."
  **Softness:** Relies on your personal discipline, which the audience may doubt.
  **Concession?** **Yes, up front.** Acknowledge the irony in the first minute of the talk if possible. If raised here, admit: "It sounds like control. I hope my future conduct proves it's a relinquishing of control."

  ### 4. The "Moral Rights" Objection
  **Who:** The Estate Lawyer.
  **Vocab:** *Integrity of the work, derogatory treatment, moral rights, derivative license.*
  **The Objection:** "Legally, the author retains moral rights to the integrity of the work. If a translator preserves an ambiguity that the author explicitly identifies as a mistake, or if the ambiguity distorts the work in the target market, the author has grounds to object. Your 'evidence not instruction' model conflicts with the legal framework of the derivative license."
  **Your Reply (2 mins):** "Legally, you're right. Culturally, I'm suggesting we raise the bar. Moral rights are often used to protect an author's ego, not the work's life. If the text, as a public object, sustains an ambiguity that the author regrets, I argue the text should win. I'm inviting publishers to write contracts that acknowledge the translation as a new public object, where the author's moral right to 'integrity' doesn't extend to 'intentional purity.'"
  **Softness:** Legally naive. Publishers won't change contracts based on this.
  **Concession?** **Yes.** Admit this is an ethical norm, not a legal one. "I'm not asking you to break the law; I'm asking the profession to shift the standard of what counts as 'integrity.'"

  ### 5. The "Clemente" Objection (Specific)
  **Who:** Your Italian Translator (Second Row).
  **Vocab:** *Phonaesthetics, characterization, tonal register, consistency.*
  **The Objection:** "In *The Salt Year*, you objected to 'Clemente' publicly. But in Italian, 'Clement' is archaic; 'Clemente' is a name. To keep 'Clement' would mark the character as foreign, which he is not. You claimed I imported a comic colouration. I claim I imported a *person*. If I follow your rule now, do I revert to 'Clement' and break the character's realism?"
  **Your Reply (2 mins):** "This is exactly why I'm here. I was wrong to object publicly. 'Clemente' works in Italian. My intention was 'neutral,' but the text in Italian required 'named.' The ambiguity I want to protect isn't about the name, but about the *character's nature*. If 'Clemente' makes him seem comic, does the rest of the text support that? If the text supports it, then the comic reading is valid evidence, even if I didn't intend it. I apologize for the panel last spring. I was treating you as a conduit for my intention, not a co-creator of the public object."
  **Softness:** Requires you to eat humble pie publicly.
  **Concession?** **Yes, absolutely.** This is personal. Concede the specific point to win the general war.

  ### 6. The "Deadline" Objection
  **Who:** The Chair.
  **Vocab:** *Billable hours, turnaround, decision fatigue, practical application.*
  **The Objection:** "This is lovely theory. But my translators are working to a deadline. Debating the metaphysics of ambiguity takes time they aren't paid for. What is the practical difference between your rule and 'use your best judgment'?"
  **Your Reply (2 mins):** "The practical difference is the email. 'Use your best judgment' usually leads to the translator emailing the author: 'Did you mean X or Y?' That stops the clock. My rule says: Don't email me. Look at the text. If the text allows both, pick the one that sings better in your language, but don't collapse the uncertainty just to be sure. It saves time by cutting the query loop. It shifts the burden of certainty from the author to the text."
  **Softness:** Translators know authors often *want* to be emailed.
  **Concession?** **No.** This is a selling point for the publishers in the room.

  ### 7. The "Empirical Test" Objection
  **Who:** The Scholar.
  **Vocab:** *Reception theory, falsifiability, data, reader response.*
  **The Objection:** "You claim the text is a 'shared public object.' How do you measure that? If 90% of readers in the target language take the 'collapsed' reading, isn't that the empirical reality of the object? Your theory predicts a text that doesn't exist in the wild."
  **Your Reply (2 mins):** "I'm not making a scientific claim; I'm making a normative one. I'm not saying readers *will* see the ambiguity; I'm saying the translation *should* allow them to. If 90% miss it, that's a failure of reading, not necessarily of translation. But if the translation removes the possibility entirely, you've changed the data set. I want the text to remain a site of potential meanings, even if most readers don't actualize them all."
  **Softness:** Elitist. Sounds like "readers are too stupid to get it."
  **Concession?** **Partial.** Acknowledge that reader response is the ultimate reality, but argue translation shouldn't pre-empt it.

  ### 8. The "Better Art" Objection
  **Who:** A literary translator (poet background).
  **Vocab:** *Aesthetic unity, resolution, artistic judgment, voice.*
  **The Objection:** "Sometimes a translation is better than the original. Sometimes collapsing an ambiguity makes the sentence stronger, more musical, more true to the spirit of the book. Why privilege the source text's accidents over the target text's beauty?"
  **Your Reply (2 mins):** "I love that idea. I want my translations to be better than my originals. But 'better' shouldn't mean 'more definite.' If you make it stronger by making it clearer, you might be solving a problem that wasn't there. Keep the music, keep the beauty, but keep the shadow. If the ambiguity is an accident in the source, treat it as a feature in the target. Don't fix what isn't broken, even if you think you can fix it beautifully."
  **Softness:** Subjective. Hard to define "better."
  **Concession?** **No.** This defends the core aesthetic value.

  ---

  ## THE ONE REPLY THAT MUST LAND
  **Objection:** #1 (Grammar Forces Choice) or #3 (Authorial Interference).
  **Why:** If you cannot convince them that this rule is *feasible* linguistically or that it isn't just *control* in disguise, the talk is dead.
  **The Line:** "I am not asking you to ignore the constraints of your language. I am asking you to ignore the constraints of *my ego*. When your grammar forces a choice, make it. But do not make it because I told you to. Make it because the language demands it, and then let the text live with the consequence."
  **Preparation:** Memorize this. If you waffle here, you look like a theorist who doesn't write. If you land this, you look like a colleague.

  ## WHAT TO HOLD (Even if the rest goes badly)
  **The Core Claim:** "The text, once published, is no longer mine. It belongs to the readers and the translators who carry it into new worlds. My intention is a historical fact about the drafting process; the text is a living fact about the reading experience. Prioritize the living fact."
  **Why:** Even if they reject the "Ambiguity Rule," if they accept that the text is a "shared public object," you have shifted the power dynamic in the room away from the Author-God model without demanding they worship you.

  ---

  ## THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "You've argued that intention is not instruction and that we shouldn't rely on authorial clarification. Yet, you successfully stopped a translation in [Year] and wrote a two-page explanatory note for the US edition of your first novel. Isn't your rule actually just 'Do as I say, except when I panic'?"

  **How badly this exposes you:**
  **Catastrophically.** It directly contradicts Claim 2 (Authority) and Claim 3 (Practice). It suggests your theory is a luxury you afford yourself only when you feel secure, and that you revert to "Intention as Instruction" when you feel vulnerable. The Italian translator will be watching for this specifically.

  **What you can honestly say (Damage Limitation):**
  *Do not deny it.* Denial is provable.
  *Do not justify it as "exceptional."* That implies you are the judge of exceptions.
  *The Honest Reply:* "You're right. Those were failures of nerve on my part. The note in the US edition was an attempt to control reception because I was insecure about the book's fragility. Stopping the translation was an assertion of legal power that I now regret ethically, even if I felt it was necessary aesthetically at the time. I am standing here today *because* of those moments. I realized that every time I intervened, I didn't save the book; I shrank it. I'm proposing this rule not because I have perfectly followed it, but because I want to bind myself to it so I don't make those mistakes again. I am asking you to hold me to this standard more strictly than I have held myself."

  **Why this works:** It turns the hypocrisy into a conversion narrative. It admits the fault (disarming the attack) but frames the current talk as an act of penance/correction rather than a lecture from on high. It aligns you *with* the translators against your own past behavior.

  **Risk:** It admits you were wrong before.
  **Reward:** It makes you trustworthy now.
  **Verdict:** Use the "Failure of Nerve" line. It is the only way to survive the question without lying.
