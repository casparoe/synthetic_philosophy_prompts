answer: |-
  Here is the plan for the evening. It is designed to be low-friction for you (the facilitator) and high-friction for the participants (in their thinking). The core mechanic is **Information Asymmetry**: partners cannot see each other's cards, forcing them to negotiate a definition of "function" that satisfies two different types of evidence. When the evidence types contradict, the game breaks, and that break is the lesson.

  ### The Session Plan: "The Function Contract"

  **Room Setup:**
  One large table or pushed-together tables. You sit at the head with the Flipchart. Chips/coins are in a central pot. The lighting should be warm but bright enough to read cards.

  **Materials:**
  *   5 sets of "Dossier Cards" (printed on cardstock, different coloured backs for History vs. Mechanism).
  *   50 Poker chips or distinct coins (two colours: "Bet" and "Penalty").
  *   Flipchart and thick markers.
  *   A "Master Key" sheet for you (kept hidden).

  **The Stakes Mechanic:**
  Each pair starts with 10 chips. In each round, they must ante 2 chips to submit a "Function Verdict" (a single phrase, e.g., "To Fly").
  *   **Win:** If their Verdict matches the "Valid List" on your Master Key for that case, they get their 2 chips back + 1 from the pot.
  *   **Loss (Mismatch):** If Partner A (History) and Partner B (Mechanism) cannot agree on a single phrase, they lose the 2 chips.
  *   **Loss (Impossible Claim):** If they submit a Verdict that is factually contradicted by one of their cards (e.g., claiming "Ancestral Survival" when the History card says "Created in Lab"), they lose 4 chips.
  *   **The Twist:** In later rounds, the Master Key will list *two* conflicting Valid Verdicts, but a pair can only submit *one*. This forces them to choose a "side" of the argument without knowing it yet.

  **Phases:**
  1.  **Briefing (5 mins):** Explain the goal: "You are biological consultants. You must label the function of a trait. You have incomplete data. Don't talk jargon. Bet chips."
  2.  **Round 1: The Clean Case (10 mins):** History and Mechanism align. Builds confidence.
  3.  **Round 2: The Drift (15 mins):** History points one way, Mechanism another. Pairs start losing chips on mismatches.
  4.  **Round 3: The Lab-Made (15 mins):** History is empty. Claims of "purpose" are penalized. High frustration.
  5.  **Round 4: The Boundary (15 mins):** Who is the system? The microbe or the host? Valid Verdicts diverge based on perspective.
  6.  **Round 5: The Interest (15 mins):** Same trait, different observers (Doctor vs. Evolutionist). Both Valid, but mutually exclusive labels.
  7.  **Debrief (15 mins):** You map their frustration to the two philosophical accounts. Reveal the names.

  **Debrief Strategy:**
  Do not lecture. Point to the Flipchart where you've tallied their losses.
  *   "Round 3 hurt because you wanted a history that wasn't there." -> **View 1.**
  *   "Round 5 hurt because you had to pick whose interest mattered." -> **View 2.**
  *   "You weren't playing badly. The rules of biology are the ones fighting."

  **Failure Modes:**
  *   **Biology Pedantry:** The vet or beekeeper corrects the science. *Fix:* Remind them: "The card is truth for this game. Real world doesn't matter."
  *   **Jargon Leak:** Someone says "Evolution." *Fix:* Fine them a chip. Keep it to plain English.
  *   **Stalemate:** A pair refuses to bet. *Fix:* "No bet means you quit the contract. You lose your seat." (Bluff, but works).

  **What This Cannot Deliver:**
  The activity cannot tell them which view is *true*. It only proves they are incompatible in practice. You must state that at the end.

  **The Reveal Sentence:**
  "One side says a function is what the past selected for; the other says it's what the present contributes."

