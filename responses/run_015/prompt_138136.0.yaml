prompt: |-
  Ok so first: take a breath and think carefully. I want you to act as a professional philosopher of science who's taught the philosophy-of-economics unit for years and has seen exactly which bits students fake their way through. Start with a few paragraphs of unstructured brainstorming about where you think my setup below is likely to go wrong — what I've mis-specified, what I'm underestimating, what the actual hard part is going to be — and only after that give me the plan proper.

  The situation: I've got a 75-minute seminar next week, one whiteboard, no slides. About twenty people: mostly third-year philosophy students who've done one general philosophy-of-science course (so they've met the realism/instrumentalism debate about unobservables, and they've all seen the frictionless plane a hundred times), plus five or six MSc economics students sitting in who are going to be defensive about economics and will take any criticism of modelling practice as an attack. I want them to leave able to say what's actually at issue in Friedman's "F-twist" — F for Friedman, Samuelson's nickname for it, since he didn't want to name it after the man directly — and, more importantly, to be able to tell a good idealized model from a bad one without just falling back on "well it predicts well, doesn't it".

  The line I'm going to put on the board at some point is this one from his 1953 essay: "Truly important and significant hypotheses will be found to have "assumptions" that are wildly inaccurate descriptive representations of reality, and, in general, the more significant the theory, the more unrealistic the assumptions (in this sense)". I haven't decided whether that goes up at the start as a provocation or near the end as something they can now paraphrase properly, and I want you to argue me into one of those.

  What I actually need from you is a plan for the explanation, not the explanation itself:

  1. The order the pieces have to go in, and what depends on what. In particular: does the taxonomy of *kinds* of unrealism (leaving stuff out / abstraction, Galilean-style stripping away vs. positing something that couldn't be true of anything, isolating a cause vs. idealizing it, the "as if" reading of an agent-level assumption) come before or after the F-twist itself? My instinct is that if I do the taxonomy first they'll have already decided Friedman was obviously right before I've sprung the interesting part, but if I do it after, the taxonomy feels like damage control. Tell me which and why.

  2. The one example that has to carry the whole session, and what it must have and must lack. I want it non-physics — the frictionless plane and the ideal gas let them think this is a quirk of physics where you can get away with it because the laws are clean, and then they never transfer it. It should have an assumption that's false in a way nobody would argue about, a prediction that is surprising and checkable, and ideally a version where making the assumption *more* realistic makes the prediction worse or kills it — so they can't retreat to "oh, it's approximately true really". Tell me why not Friedman's own billiard-player example as the carrier even though it's sitting right there in the text.

  3. The misconception map, with the point in the sequence where each one gets headed off rather than just listed at the end. The ones I'm expecting: (a) "Friedman says assumptions don't matter at all, so anything goes" — which slides straight into the cherry-picking objection Samuelson himself made, and I don't know whether to use Samuelson as the *critic* here or to let them generate it and then tell them who got there first; (b) "unrealistic just means simplified, and simplification is just approximation, so you can always add the complications back in later and converge on the truth" — the assumption that de-idealizing always converges; (c) the inverse slide, that if a model predicts well its core assumption must be roughly true after all; (d) collapsing the whole thing into the realism-vs-instrumentalism fight they already know from philosophy of science, so that they think the F-twist is just "anti-realism about unobservables with an economics flavour"; (e) the econ students reading any criticism as "you think economics isn't a science". Give me the defusion point for each in sequence, and flag any misconception you think I *haven't* listed that will show up anyway.

  4. Two things of my own I want to slot in, and I genuinely don't know where they belong or whether they help or hurt. First, what I've been calling a *looping* assumption: an assumption that is wildly unrealistic when the model is built but gets made less unrealistic by the model's own being used — option-pricing formulae, or a routing app that assumes every driver re-routes instantly. Second, a version of the twist that's explicitly relativised: the unrealism of an assumption is only assessable relative to a specified target *and* a specified question, which seems to me to have the consequence that two models of the same system with mutually inconsistent assumptions can both be perfectly in order. My worry is that the first one quietly hands the F-twist a win I don't want to hand it, and that the second one is so concessive that by minute forty there's nothing left to argue about. Tell me the slot for each, and tell me if either one is a trap.

  5. How I'll know it landed. Give me one question to put to the room at the end, plus the wrong-but-plausible-sounding answer I should be listening for and what it tells me about which step in the sequence failed.

  6. What I should openly refuse to go into at this level and say out loud that I'm refusing — there'll be someone who wants to drag in the whole models-as-mediators / credible-worlds / models-aren't-representations-at-all literature, and at least one econ student who wants to talk about identification and external validity. I need a principled line for what's out, not just a time-management excuse.

  Assume they'll be noisy and that I'll lose the econ students in the first fifteen minutes if it sounds like philosophy scoring points. Go.
