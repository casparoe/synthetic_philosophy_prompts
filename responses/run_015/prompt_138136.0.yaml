answer: |-
  ### Part 1: Unstructured Brainstorming & Critique

  Look, I've seen this seminar movie before, and I know how it ends. You've got a room full of third-year philosophers who think they've already solved realism by reading Putnam in year two, and a handful of economics MSc students who are one provocative comment away from checking out mentally because they think you're going to tell them their entire degree is epistemically bankrupt.

  Here is where your setup is fragile. First, you're underestimating the seductive power of Friedman's pragmatism. Students *want* Friedman to be right. It's easy. It lets them off the hook. If the only criterion is "prediction works," they don't have to do the hard ontological work of figuring out *why* it works. Your goal is to make them uncomfortable with that ease, but if you come in too hard against the models, the econ students will circle the wagons. If you come in too soft, the philosophers will treat it as a trivial exercise in "approximations."

  The biggest risk is the **Taxonomy Timing**. If you give them a taxonomy of idealization (Galilean, Aristotelian, etc.) *before* they feel the pain of Friedman's claim, they will treat the taxonomy as a labeling game. They'll memorize definitions and apply them mechanically. You need them to feel the tension first: "How can a lie tell the truth?" The taxonomy should be the tool they reach for to solve that puzzle, not the preamble.

  Regarding the **Quote**: Do not put it up at the start. If you put Friedman's strongest claim on the board at minute zero, the seminar becomes an exegesis of that sentence. The students will spend 75 minutes parsing "wildly inaccurate" instead of thinking about modeling practice. Put it up at the end. Let the session be the argument *for* or *against* that sentence. By minute 70, they should be able to annotate it with the distinctions they've just learned.

  The **Econ Students**: You're worried about them being defensive. The way you lose them is by framing this as "Economics vs. Philosophy." You win them by framing this as "Engineering vs. Architecture." The philosophers want to know if the foundation is true (architecture); the economists want to know if the building stands (engineering). Friedman says "Who cares about the foundation if it stands?" Your job is to show them that sometimes the building stands *because* of the foundation, and sometimes it stands *despite* it, and knowing which is which prevents collapse later.

  Finally, your **Looping** idea is a trap. It sounds sophisticated, but it conflates *epistemic* status with *ontological* change. If an assumption becomes true because of the model (performativity), it's no longer an "unrealistic assumption" in Friedman's sense; it's a self-fulfilling prophecy. If you introduce it as support for Friedman, you undermine the distinction between truth and utility. If you introduce it as a critique, it's gold. Be careful.

  ***

  ### Part 2: The Seminar Plan

  **Time:** 75 Minutes
  **Resources:** Whiteboard only.
  **Goal:** Distinguish *productive* idealization from *obscuring* falsehood.

  #### 1. Order of Operations: The Taxonomy Question
  **Decision:** **Taxonomy AFTER the F-Twist.**

  **Why:**
  If you start with the taxonomy (e.g., "Here is Negligibility, here is Domain, here is Heuristic"), you are giving them answers to questions they haven't asked yet. They will sit there passively cataloging.
  Instead, start with the **F-Twist Problem** (the tension between false assumptions and good predictions). Let them struggle with *how* that is possible. Let the philosophers try to call it "lies" and the economists try to call it "approximations." When the discussion hits a wall—specifically when they can't explain *why* one false assumption is okay and another isn't—*then* you introduce the Taxonomy as the diagnostic tool.
  *   **Sequence:**
      1.  The Puzzle (Example + Friedman's Claim).
      2.  The Struggle (Why is this assumption okay but that one isn't?).
      3.  The Tool (Taxonomy of Unrealism).
      4.  The Resolution (Applying the Tool to the Puzzle).

  #### 2. The One Example: Hotelling's Law (Spatial Competition)
  **Do not use the Billiard Player.**
  **Why not:** It focuses on individual psychology ("as if they know math"). It allows students to retreat into "competence without comprehension," which sidesteps the structural issue of modeling. It's too easy to say "well, they learn."

  **Use: Hotelling's Linear City Model.**
  *   **The Setup:** Draw a line on the board. Two ice cream vendors. Customers distributed along the line.
  *   **The "Wildly Inaccurate" Assumption:** Customers are **uniformly distributed** along the line, and they **only care about distance** (linear transport costs).
  *   **The Prediction:** Both vendors locate at the exact center (Principle of Minimum Differentiation).
  *   **Why it fits your criteria:**
      1.  **False:** Real cities don't have uniform populations; people care about price/quality too.
      2.  **Surprising/Checkable:** We observe political candidates and fast-food chains clustering in "center ground" or specific hubs.
      3.  **Realism Kills Prediction:** If you make the assumption *more realistic* (e.g., customers are clustered in specific neighborhoods, or transport costs are non-linear), the equilibrium often **disappears** or becomes unstable. The "false" uniform assumption is actually *required* to generate the stable prediction of clustering.
  *   **Pedagogical Payoff:** It forces the students to admit that adding "truth" (population clusters) can destroy the model's explanatory power regarding the *tendency* to cluster. This blocks the "just add complications later" move.

  #### 3. The Misconception Map (Defusion Points)

  | Misconception | Defusion Point in Sequence | Strategy |
  | :--- | :--- | :--- |
  | **(e) "Attack on Econ"** | **Minute 5 (Intro)** | Frame the session as "Model Hygiene." Tell the econ students: "I am not asking if economics is a science. I am asking how you stop your models from breaking when policy changes." Make it about *robustness*, not *legitimacy*. |
  | **(a) "Assumptions don't matter"** | **Minute 30 (During Example)** | When discussing Hotelling, ask: "What if we assume vendors want to maximize *distance* between them?" The prediction flips. Show that *specific* assumptions drive *specific* outcomes. They matter immensely. |
  | **(b) "De-idealizing converges"** | **Minute 35 (Post-Example)** | Explicitly use the Hotelling "realism kills equilibrium" point. State clearly: "More realistic does not mean more predictive. Sometimes truth creates noise that drowns the signal." |
  | **(d) "Just Realism/Instrumentalism"** | **Minute 50 (Taxonomy)** | When introducing the taxonomy, distinguish *ontological* status (is it real?) from *functional* status (what work does it do?). Friedman isn't just an instrumentalist; he's a specific kind of *isolationist*. |
  | **(c) "Prediction = Truth"** | **Minute 60 (Synthesis)** | Use the "Looping" idea here (see below) or a counter-example where a model predicts right for the wrong reason (e.g., Ptolemaic epicycles). Prediction is necessary but not sufficient for understanding. |
  | **(f) NEW: "It's just Ceteris Paribus"** | **Minute 20 (Setup)** | Students will say "He just means 'all else being equal'." Correct them immediately. "CP holds background constant. Friedman is saying the *active forces* are described falsely." |

  #### 4. Your Two Ideas: Slotting & Risk Assessment

  **Idea 1: The Relativized Twist (Assessment relative to Question/Target)**
  *   **Verdict:** **Essential. Not a trap.**
  *   **Slot:** **Minute 55 (After Taxonomy, before Conclusion).**
  *   **Why:** This is the only way to resolve the "Good vs. Bad Idealization" problem without falling into relativism. It clarifies that an assumption isn't "unrealistic" in a vacuum; it's unrealistic *relative to the question*.
  *   **How to frame:** "Is the uniform distribution assumption false? Yes. Is it *fatally* false? Only if your question is 'Where exactly will the shop open in Berlin?' If your question is 'Why do competitors tend to mimic each other?', the falsity is irrelevant noise." This teaches them to evaluate models by their *purpose*, not just their premises.

  **Idea 2: The Looping Assumption (Performativity)**
  *   **Verdict:** **High Risk. Use as a "Limit Case" only.**
  *   **Slot:** **Minute 65 (Q&A / Challenge Phase).**
  *   **Why:** If you present this as support for Friedman, it confuses the issue. Friedman talks about assumptions that *remain* false but yield true predictions. Looping makes the assumption *become* true.
  *   **How to frame:** "Here is the boundary of Friedman's view. If traders use Black-Scholes and thereby make markets behave *as if* the assumptions are true, is it still an 'as if'? Or has the model changed the world?" Use this to show that Friedman's instrumentalism might be too static for dynamic social systems. It prevents the "Friedman is always right" conclusion.

  #### 5. How You'll Know It Landed (Assessment)

  **The Final Question (Minute 70):**
  "I want you to propose a model assumption that is **demonstrably false**, but where making it **true** would make the model **useless**. Go."

  **The Wrong-but-Plausible Answer:**
  "Assume people are rational. In reality, they aren't. If we modelled their actual biases, the math would be too hard to solve."
  *   **Diagnosis:** This student has failed. They have conflated "tractability" (we can't solve it) with "explanatory power" (the model stops working). They are defending Friedman on the grounds of *convenience*, not *causal isolation*. This means your **Hotelling** example failed to show how realism kills the *prediction*, not just the *solution*.

  **The Right Answer:**
  "Assume a single global price for oil. In reality, prices differ by location/grade. But if we model the price differences, we can't see the global shock transmission mechanism."
  *   **Diagnosis:** They understand that the falsity *isolates* a specific causal channel (transmission) that realism would obscure (noise).

  #### 6. What to Refuse (The Exclusion Line)

  There will be a hand raised at Minute 40 asking about "External Validity" or "Identification Strategies."
  **Your Refusal:**
  "We are talking about **theoretical justification**, not **empirical validation**. Identification is about how we test the model against data. Today is about how we build the model before we ever look at the data. If we conflate the two, we won't know if our test is failing because the theory is wrong or because the data is noisy. We must settle the theory first."

  There will be a philosopher wanting to talk about "Models as Credible Worlds" (Sugden) or "Mediators" (Morgan/Morrison).
  **Your Refusal:**
  "That literature asks 'What *are* models?' Today we are asking 'How do we *judge* them?' We are taking the existence of the model as given and evaluating its assumptions. Ontology of models is a different seminar."

  **Principled Line:** "This seminar is about **Internal Coherence and Causal Isolation**. Empirical testing and Sociological status are outside the boundary. If your point requires data, hold it. If your point requires metaphysics, hold it."

  ### Final Advice on the Quote
  Put the Friedman quote on the board at **Minute 72**.
  "Look at this again. 'The more significant the theory, the more unrealistic the assumptions.' Based on what we've done, is this true? Or is it that the more significant the theory, the more *carefully chosen* the unrealisms?"
  Let them rewrite the quote in their notes. That's the win.
