answer: |-
  Elena, a city transport planner, targets Bus Stop 14 on Elm Street for relocation after archives confirm the shelter was installed forty years ago due to a surveyor's decimal error, placing it ten meters past the intersection instead of before it, a fact documented in a 1979 correction memo that was never actioned. Elena runs a three-week pilot moving the stop to the logically correct side, monitoring traffic flow and ridership numbers which remain stable or improve slightly, giving her the green light to make the change permanent. Within three months of the permanent move, rear-end collisions at the intersection rise by fifteen percent, pedestrian near-misses spike, and local storefronts report missed delivery windows, forcing the city to reinstall the shelter at the erroneous coordinates.

  **Verdicts**
  The historical-rationale test is passed because the origin is a documented error, the cost-benefit analysis is passed because the pilot data supported the move, but the Burkean presumption wins because the systemic cost of removal exceeded the benefit of correctness. The reformer successfully satisfied Chesterton's requirement to know the fence's history—it was a mistake—but failed to satisfy Burke's requirement to respect the ecosystem that grew around it, proving that knowing *why* something exists is distinct from knowing *what* it does now. The evidence was complete regarding the past (the memo existed) but necessarily incomplete regarding the present (the dependencies were invisible until broken).

  **Adaptations**
  Three specific load-bearing adaptations grew around the accident: traffic signal loop detectors were calibrated to expect bus weight at the erroneous spot, preventing premature light changes; pedestrians developed a habit of crossing behind the stationary bus using it as a visual shield from traffic; and local couriers used the sheltered bench as an unofficial secure drop-off point keyed to the driver's dwell time. These were not hidden purposes designed by the founders, but emergent behaviors that integrated the error into the daily workflow of drivers, walkers, and businesses. Removing the stop didn't just delete a coordinate; it severed three distinct operational links that had no documentation because they were never officially authorized.

  **Load-bearing Feature**
  The epistemic gap between static origin data and dynamic systemic integration is the load-bearing bit, because if the origin were undocumented the reformer would have failed Test 1, and if the pilot could have revealed the mess the Burkean presumption would be reducible to better data gathering. If the archives had been lost, Chesterton's Fence would have stopped Elena immediately, collapsing the distinction between the two tests. If the three-week pilot had shown the collision spike, the decision would have been a simple calculation error rather than a fundamental limit on knowledge, negating the need for a Burkean presumption against removal. The case holds only because the history was knowable but the ecology was not.

  **Reformer's Attack**
  The reformer argues that a system robust enough to function should not depend on known errors, and that the cost of re-training these adaptations is a one-time tax worth paying for long-term logical consistency. She contends that counting this as a loss validates fragility, encouraging teams to treat accidental dependencies as sacred rather than refactoring the surrounding processes to align with reality. Her strongest point is that the "wisdom" of the system is actually technical debt disguised as tradition, and reverting to the error postpones the inevitable cost of fixing the traffic lights and pedestrian habits anyway.
