answer: |-
  This is a profound question that cuts to the bone of how value is constituted in the art market. You are correct to sense that your conservator friend's explanation ("provenance gossip") is insufficient. Provenance is a record of ownership; what you are describing is a change in the *ontological status* of the object that generates a specific kind of economic premium.

  To answer your primary question directly: **No, there is no single, canonical term in philosophical or critical literature for this specific configuration.**

  There is the "Van Meegeren Effect," which is trade slang, and there is the "Goodman Puzzle" (from Nelson Goodman's *Languages of Art*), which asks why a perfect fake is aesthetically inferior to an original. But Goodman argues the fake is *less* valuable because knowledge of its origin alters perception. Your case is the inverse: knowledge of the origin *enhances* value.

  However, the "carving" you are looking for exists in the intersection of **forensic art history**, **institutional critique**, and **behavioral economics**. Based on the pattern you describe, I propose we classify this as a **"Canonical Forgery"** (or, in valuation terms, a **"Transvalued Fake"**).

  Here is the carving of the concept, the distinction from your boundary cases, and the vocabulary for your notes.

  ### I. The Carving: Five Conditions for Value Accrual

  For a fake to gain value upon exposure (rather than lose it), it must satisfy five specific conditions. If any one is missing, the object reverts to being merely a "deceptive copy" (value zero/negative) or a "pastiche" (value stable).

  1.  **Successful Canonical Penetration:** The object must have been accepted not just by a buyer, but by the *institutional guardians* of the original artist's canon (museums, leading scholars, major catalogues raisonnés) prior to exposure. The deception must have briefly rewritten art history.
      *   *Why:* This creates the "Institutional Wound." The object is now a relic of the moment the experts were wrong.
  2.  **Identifiable Agency:** The forger must be known and possess a distinct artistic personality (e.g., Van Meegeren, Beltracchi).
      *   *Why:* The market needs a new "author" to capitalize on. An anonymous fake has no brand to pivot to.
  3.  **Technical Autonomy:** The object must be aesthetically competent *as a work by the forger*.
      *   *Why:* Van Meegeren's paintings are now valued as excellent examples of 1930s Vermeer-pastiche. If the technique is shoddy, the story remains, but the object becomes a curiosity, not a collectible.
  4.  **Narrative Closure:** The deception must be definitively resolved (confession, scientific proof).
      *   *Why:* Ambiguity depresses value. The market pays a premium for the *certainty of the lie*.
  5.  **Scarcity of Infamy:** There must be a limited corpus of these specific "successful" fakes.
      *   *Why:* If the forger produced hundreds of undistinguished copies, the notoriety dilutes. The premium attaches to the "greatest hits" of the deception.

  ### II. Analysis of Your Boundary Cases

  Using the carving above, we can distinguish your neighboring cases.

  **1. The Honest Pastiche later misattributed**
  *   **Verdict:** Different Animal.
  *   **Reasoning:** Fails Condition 1 (Intent). While the market may treat it as a forgery, it lacks the *performative* element of the deception. However, if the misattribution becomes famous enough (e.g., a painting thought to be a Michelangelo that turns out to be a faithful 16th-century copy by a known student), it can accrue value, but this is **"Attributional Upgrading,"** not the "Transvalued Fake." It is valued as a *surrogate*, not as a *relic of deception*.

  **2. Synthetic Continuations (Estate-authorized works)**
  *   **Verdict:** Different Animal.
  *   **Reasoning:** Fails Condition 1 (Deception). These are **"Authorized Apocrypha."** Their value comes from brand extension and trust, not the subversion of trust. They outperform minor genuine works because they offer the *aesthetic* of the master without the *scarcity* penalty, backed by institutional approval. They are legitimate products, not scandals.

  **3. The Anonymous Fake**
  *   **Verdict:** Value Subtraction.
  *   **Reasoning:** Fails Condition 2 (Agency). Without a named forger, there is no new brand to attach the value to. The object becomes "School of [Original Artist], later revealed as imitation." It is now a decorative object, stripped of art-historical significance.

  **4. The Failed/Early Discovery Fake**
  *   **Verdict:** Value Subtraction.
  *   **Reasoning:** Fails Condition 1 (Canonical Penetration). If the museum wasn't fooled, there is no "Institutional Wound." The story is "Attempted Fraud," not "Historic Deception."

  **5. Scientific Forgeries (Field Notes/Specimens)**
  *   **Verdict:** Total Value Collapse.
  *   **Reasoning:** Fails Condition 3 (Technical Autonomy/Aesthetic Life). In science, the utility of the object is its truth-claim. A fake specimen has no utility. In art, the object has a dual life: as a historical document and as a visual experience. A fake bird specimen is neither a bird nor a document; it is trash. A fake Vermeer is still a painting, and now a famous document.

  ### III. The Philosophical Mechanism: Why the Friend is Half-Wrong

  Your conservator friend argues this is "provenance gossip." This implies the value is extrinsic (the story) and detached from the object.

  The philosophical counter-argument (drawing on Arthur Danto's *Artworld*) is that the exposure changes the **ontology** of the object.
  *   **Before Exposure:** The object is a *Vermeer*. Its value is derived from Vermeer's genius.
  *   **After Exposure:** The object is a *Van Meegeren*. Its value is derived from Van Meegeren's skill *plus* the historical significance of the deception.

  The object does not merely carry a story; it *becomes* a different category of thing. It transitions from "Old Master Painting" to "Historical Artifact of Art Market Fraud" that *happens* to be a high-quality painting. The premium is not just for the gossip; it is for the object's new role as a **witness**. It is the physical evidence of a crime that shook the art world. In a way, it becomes a "martyr" to the concept of authenticity.

  ### IV. The Decay Question

  You asked if the premium decays once the scandal is no longer in living memory.
  **Yes, but it stabilizes.**
  *   **Phase 1 (Immediate Aftermath):** Peak value. High notoriety, media attention, court cases.
  *   **Phase 2 (Generational Shift):** The "scandal" fades, but the "art-historical significance" remains. Van Meegerens are no longer shocking; they are now standard curriculum in art history. They hold value as **Period Pieces of the Forgery Era**.
  *   **Phase 3 (Deep Time):** If the forger's name is forgotten, the object reverts to "Imitation of [Master]." The premium vanishes.
  *   **Conclusion:** The value is tethered to the *fame of the forger*, not just the fame of the victim.

  ### V. Valuation Vocabulary

  You need a sentence for your notes that captures this ontological shift without sounding sensationalist. You need to distinguish this from a standard "attributed to" or "style of."

  **Suggested Terminology:**
  Do not use "Fake" or "Forgery" in the primary description if it carries legal liability in your jurisdiction; use **"Revealed Imitation"** or **"Reclassified Work."** However, for the internal valuation logic, use the concept of **"Historic Notoriety."**

  **Drafting the Sentence:**
  *   *Option A (Conservative):* "Reclassified as a work by [Forger]; value sustained by historical significance of prior attribution and technical merit."
  *   *Option B (Precise):* "Recognized as a celebrated imitation; market value reflects the work's provenance as a former [Original Artist] attribution and the scarcity of the [Forger] corpus."
  *   *Option C (The "Carving" Definition):* "Value derives from dual status: aesthetic merit as a [Forger] original and documentary significance as a canonical deception."

  **My Recommendation for your Notes:**
  > *"Reclassified as [Forger]; value supported by the work's historical status as a former [Original Artist] attribution and the established market for the forger's celebrated imitations."*

  This acknowledges the deception ("former attribution") without labeling it a crime ("celebrated imitations"), and it justifies the price ("established market") based on the specific phenomenon you identified.

  ### Summary

  You have identified a category where **infamy functions as authenticity.**
  It is not merely provenance gossip. It is a market recognition that the object has survived a "trial by fire" (exposure) and emerged with a new, rarer identity. It is the only class of object where **dishonesty increases scarcity.**

  Your conservator friend sees a relic; you see a transvalued asset. You are both right, but you are right about the *market*, and they are right about the *material*. In your line of work, the market verdict is the one that sets the price. The object is no longer a window into the 17th century; it is a mirror of the 20th century's desire for the 17th. That reflection is what the client is buying.
