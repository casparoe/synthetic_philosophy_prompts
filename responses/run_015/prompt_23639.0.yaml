      *   *Counter-Argument:* Notes/Calendar/Photos are *externalized* memory. They are distinct from *episodic* memory. The cognitive process of writing a calendar invite is different from recalling a conversation three days later.
      *   *Nuance:* There *is* a potential confound. If I write "Lunch with Bob" but actually had lunch with "Alice," my note is wrong, and my memory might be wrong, and they might match incorrectly (false positive). Or I might misread my own note later.
