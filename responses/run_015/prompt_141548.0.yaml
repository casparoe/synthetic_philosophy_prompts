answer: |-
  The asymmetry you have identified is not merely methodological; it is ontological. The two measurement regimes do not just disagree on *how much* intelligence exists; they disagree on *what kind of thing* intelligence is. To understand why we use one word for both, we must reconstruct the implicit theories that make each practice rational.

  ### 1. The Human Implicit Theory: Intelligence as Rank
  For the psychometric tradition to make sense, intelligence must be a **latent biological trait distributed within a closed population.**

  **Strict Presuppositions:**
  *   **Scarcity is Fundamental:** The metric assumes that high intelligence is, by definition, rare. If everyone scored 140, the test would be broken, not the population. Therefore, intelligence is a *positional good*. Its value derives from its distribution, not just its absolute magnitude.
  *   **The Reference Class is Fixed:** The theory presupposes that the relevant comparison is *synchronic* (among contemporaries) rather than *diachronic* (across history). It assumes that a human in 2024 is commensurable with a human in 1950, necessitating the re-norming to keep the mean at 100. The "Flynn effect" (raw score drift) is treated as noise or environmental inflation, not an evolution of the trait itself.
  *   **Stability of Structure:** It assumes the *structure* of intelligence (the factor loadings, the intercorrelations of items) is stable even if the *level* drifts.

  **Compatible Rival Theories:**
  This practice sits comfortably with Spearman's $g$ (a general energy factor), but also with evolutionary psychology views (intelligence as adaptive fitness for a specific niche). It is even compatible with modular views, provided the modules aggregate to a stable rank order.

  **The Hidden Contradiction:**
  The practice presupposes relativity, yet the *application* (diagnosis, legal exemption) treats the score as absolute. This implies a hidden, unstated belief: that the *distance from the mean* maps to a functional cliff edge that is constant across time. We measure rank, but we act as if we measured capacity.

  ### 2. The Machine Implicit Theory: Intelligence as Capacity
  For the benchmarking tradition to make sense, intelligence must be **problem-solving power independent of the substrate.**

  **Strict Presuppositions:**
  *   **Tasks Have Intrinsic Difficulty:** This is the crucial inversion of the human model. In AI, a math problem is hard *in itself*, not hard relative to other models. If a model solves it, the model has "gained" intelligence. If the test is solved, the test is discarded. This presupposes intelligence is an *absolute capacity* to compress reality or minimize loss, not a rank within a population.
  *   **Unbounded Accumulation:** The practice assumes intelligence is accumulable without limit. There is no "ceiling" to the trait, only ceilings to specific tests. When a test saturates, we assume the *metric* failed, not that the *intelligence* maxed out.
  *   **Intelligence is a Function of Budget:** As you noted, the score attaches to Model + Compute + Time. The implicit theory here is that intelligence is thermodynamic. It is work performed. A system that takes a year to solve a problem a human solves in a minute is often still credited with the intelligence, provided the accuracy is high. This presupposes intelligence is separable from *efficiency*.

  **Compatible Rival Theories:**
  This fits the Computational Theory of Mind (cognition as calculation) and the Universal Turing Machine view (any computable function is accessible). It is incompatible with biological essentialism.

  **The Hidden Contradiction:**
  The "Moving Target" problem. Because the score depends on the compute budget, we are not measuring the *algorithm's* intelligence, but the *project's* resource allocation. We call it "machine intelligence," but we are measuring "industrial throughput."

  ### 3. Are They Inconsistent?
  Yes. They are measuring two different ontological categories: **Status** vs. **Power**.

  *   **Human testing measures Status:** It answers, "Where does this organism stand in the hierarchy of its peers?" It is a sociological measure disguised as a psychological one.
  *   **Machine testing measures Power:** It answers, "What forces can this system exert on the environment?" It is a physicalist measure disguised as a cognitive one.

  **Can we coherently use one word?**
  Only if we adopt a strict **Functionalism**: Intelligence is simply "the ability to achieve goals in a wide range of environments."
  *   Under Functionalism, the human test measures *how well you achieve goals compared to other humans* (adaptive success).
  *   The machine test measures *how many goals you can achieve period* (capability).

  However, this coherence is fragile. It breaks when we consider *generalization*. Human norms assume that a high-rank individual will generalize their rank across novel human tasks (the assumption of $g$). Machine benchmarks assume that a high-capacity system will generalize across novel *domains* (the assumption of AGI).
  The inconsistency arises because human testing assumes the *environment* is stable and the *organism* varies. Machine testing assumes the *organism* (the architecture) is scalable and the *environment* (the benchmark) must be constantly upgraded to maintain variance.

  If you retain the single word "intelligence," you are conflating **fitness** (human) with **force** (machine). This conflation is dangerous. It leads us to believe that because a machine has more *force* (can process more data), it has more *fitness* (is better adapted to navigate the world), which is not necessarily true.

  ### 4. The Counterfactual: Normed Machines
  If we adopted your proposal—norming machines against the human distribution, re-norming as systems improve, keeping the median deployed model at 100—the definition of intelligence would undergo a radical shift.

  **What would we be measuring?**
  We would no longer be measuring *capability*. We would be measuring **obsolescence**.

  In this regime, a model that solves 100% of today's hardest problems might score an IQ of 100 (average) in five years, because the "contemporary reference sample" of models would have surpassed it.
  *   **The Ontological Shift:** Intelligence becomes a measure of **technological vintage**. A score of 115 wouldn't mean "smarter"; it would mean "newer."
  *   **The Economic Implication:** This aligns machine intelligence with **labor economics**. Just as a human worker's "value" is relative to the current labor market, a model's "intelligence" would be relative to the current compute market.
  *   **The Philosophical Consequence:** This would admit that intelligence is not an intrinsic property of the code, but a **relational property between the tool and the epoch.**

  **Why we don't do this:**
  We do not norm machines because the AI industry relies on the narrative of **absolute progress**. If GPT-5 is released and scores a "100" (because GPT-6 is the new mean), it looks like stagnation. If it scores "140" (on a fixed scale), it looks like a breakthrough.
  The current absolute scoring is a marketing necessity that masquerades as science. It requires the theory that intelligence is a **stock** that can be accumulated, rather than a **flow** that is relative to the environment.

  ### Summary of the Scaffolding
  To write your piece, you can frame the conflict as follows:

  1.  **Human Intelligence** is measured as a **deviation from a biological norm.** It presupposes a stable species and a scarce trait. It is a measure of *ranking*.
  2.  **Machine Intelligence** is measured as a **deviation from a task ceiling.** It presupposes an unbounded capability and intrinsic task difficulty. It is a measure of *capacity*.
  3.  **The Inconsistency:** We use "intelligence" to bridge the gap between *ranking* and *capacity*. This allows us to fear that machines will "outrank" us (a social fear) because they "out-capacity" us (a technical fact).
  4.  **The Normed Counterfactual:** If we normed machines, we would admit that intelligence is **depreciating capital**. A model loses "intelligence" as the baseline rises. This would force us to treat AI not as a mind to be understood, but as a technology to be managed, where "smart" simply means "state-of-the-art."

  The word "intelligence" persists not because it describes a shared reality, but because it obscures this category error. It allows us to treat the *industrial scaling of compute* as if it were the *evolution of cognition*.
