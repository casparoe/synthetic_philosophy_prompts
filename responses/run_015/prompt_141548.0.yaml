      *   *Key phrase to develop:* "Human intelligence is a measure of deviation from the norm; Machine intelligence is a measure of deviation from the task."
      *   *Key phrase for counterfactual:* "Intelligence as depreciation."

  9.  (Final thought before generating): Make sure to answer the specific question: "Can coherently use one word for both?" -> No, not without a category error, unless we redefine intelligence as "adaptive goal achievement" but acknowledge the metrics measure different *aspects* of that. Actually, the prompt asks me to say *whether* they can. I should argue they are currently incoherent but could be reconciled under a specific functionalist view, though the *metrics* remain contradictory. Better to argue they are measuring different *properties* that we lazily label with one word.

      *   *Decision:* Argue they are measuring *Status* vs. *Capacity*. These are not the same thing.

  10. **Finalizing the Counterfactual:** If machines were normed, a score of 100 wouldn't mean "average capability," it would mean "average utility." This shifts the definition from cognitive science to economics.

