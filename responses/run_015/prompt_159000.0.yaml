answer: |-
  # Final Examination: Formal Systems, Incompleteness, and Mechanism
  **Time Allowed:** 50 Minutes  
  **Total Marks:** 30  
  **Instructions:** Closed book. No calculators. Answer all three parts.

  **The MIU-System**  
  **Alphabet:** $\{M, I, U\}$  
  **Axiom:** $MI$  
  **Rules of Inference:**  
  (i) $xI \vdash xIU$  
  (ii) $Mx \vdash Mxx$  
  (iii) $xIIIy \vdash xUy$  
  (iv) $xUUy \vdash xy$  
  *(Where $x$ and $y$ stand for arbitrary strings of symbols.)*

  ---

  **Question 1 (30 Marks)**

  **(a) [10 Marks]** Prove that the string $MU$ is not derivable in the MIU-system. Your proof must define a numerical invariant property held by the axiom and preserved by all four rules. You must prove preservation by induction on the length of the derivation. Specifically, regarding Rule (ii), you must explicitly justify why doubling the count of $I$'s preserves the invariant using modular arithmetic. Finally, explain why a failed exhaustive search for a derivation does not constitute a proof of non-derivability.

  **(b) [14 Marks]** Consider the following answer submitted by a student, Dana, to the prompt "What is the philosophical significance of the MU-puzzle?":

  > "MIU is a formal system, so Gödel's incompleteness theorem applies to it, and like every formal system there are things true in it that it can't prove. MU is one of them — it's a perfectly well-formed string the system can never derive. The way to see this is to stop playing the game and jump out of the system: once you're outside, you reason about the rules instead of following them, and you can prove the number of I's never becomes a multiple of 3. That's the real moral: mathematical insight can't be mechanized, because a machine is stuck following rules inside the system the way we are, so no machine could have solved this."

  Critique Dana's answer. Identify and correct at least four distinct conceptual errors regarding: (1) the scope of Gödel's theorem; (2) the category status of $MU$ (truth vs. derivability); (3) the mechanizability of the "jump out" argument; and (4) the precise meaning of "jumping out of the system."

  **(c) [6 Marks]** Suppose we modify the MIU-system by replacing Rule (ii) with the tripling rule: $Mx \vdash Mxxx$. All other rules and the axiom remain unchanged. Does the mod-3 invariant argument from Part (a) still hold? Is $MU$ derivable in this variant? Based on this, is the non-derivability of $MU$ a fact about the string itself or the system? Conclude by stating what is required to establish non-derivability in a formal system where no simple numerical invariant presents itself.

  ***

  # Model Answer

  **(a)** Let $N_I(s)$ be the number of $I$'s in string $s$. We claim that for any derivable string $s$, $N_I(s) \not\equiv 0 \pmod 3$.
  **Base Case:** The axiom is $MI$. $N_I(MI) = 1$. Since $1 \not\equiv 0 \pmod 3$, the property holds.
  **Inductive Step:** Assume $s$ is derivable and $N_I(s) \not\equiv 0 \pmod 3$. We check the rules:
  (i) $xI \to xIU$: $N_I$ is unchanged. Invariant holds.
  (ii) $Mx \to Mxx$: $N_I$ becomes $2 \cdot N_I(x)$. In modular arithmetic, if $k \not\equiv 0 \pmod 3$, then $2k \not\equiv 0 \pmod 3$. This is because 2 is invertible modulo 3 (specifically, $2 \cdot 2 \equiv 1 \pmod 3$), so it is not a zero divisor. Thus, doubling cannot map a non-zero residue to zero.
  (iii) $xIIIy \to xUy$: $N_I$ decreases by 3. Since $3 \equiv 0 \pmod 3$, the residue modulo 3 is unchanged.
  (iv) $xUUy \to xy$: $N_I$ is unchanged.
  **Conclusion:** $MU$ has $N_I(MU) = 0$. Since $0 \equiv 0 \pmod 3$, $MU$ cannot be derived.
  **Search vs. Proof:** The derivation tree is infinite (Rule (ii) allows unbounded growth). Failing to find $MU$ after $n$ steps does not prove it won't appear at step $n+1$. The invariant proof covers the entire infinite space of derivations at once, which finite search cannot do.

  **(b)** Dana's answer contains four critical errors.
  1.  **Scope of Gödel:** Gödel's First Incompleteness Theorem applies only to formal systems sufficiently strong to represent primitive recursive arithmetic and self-reference. MIU is a simple string-rewriting system without negation or arithmetic; it is too weak for Gödel's theorem to apply. Weak systems can be (and often are) complete.
  2.  **Truth vs. Derivability:** MIU is an uninterpreted formal calculus. Strings are not "true" or "false"; they are merely "derivable" or "non-derivable." Calling $MU$ "true but unprovable" category-mistakes syntax for semantics. $MU$ is simply non-derivable.
  3.  **Mechanizability:** Dana claims the "jump out" insight cannot be mechanized. This is false. The invariant proof ($N_I(s) \pmod 3$) is an algorithm. A machine can easily compute the number of $I$'s and check divisibility by 3. The Lucas–Penrose argument relies on the human ability to *see* the truth of a Gödel sentence that the system cannot prove; here, the metatheoretic proof is fully formalizable and machine-checkable.
  4.  **Meaning of "Jump Out":** "Jumping out" here means reasoning in a metatheory *about* the system, not abandoning logic or revising the framework. It is a shift in perspective (object language to metalanguage), not a transcendence of mechanism. A machine can operate in the metatheory just as it operates in the object theory.

  **(c)** With the tripling rule $Mx \vdash Mxxx$, the mod-3 argument fails. Rule (ii) now maps $k \to 3k$. If we start with $MI$ ($k=1$), applying Rule (ii) yields $MIII$ ($k=3 \equiv 0 \pmod 3$). The invariant is broken immediately. Consequently, $MU$ is derivable: $MI \vdash MIII$ (Rule ii) $\vdash MU$ (Rule iii).
  This shows non-derivability is not an intrinsic fact about the string $MU$, but a relational fact about $MU$ within a specific rule set. To establish non-derivability where no handy invariant exists, one requires a general decision procedure (an algorithm that terminates with "yes" or "no" for any string) or a proof that the system's derivability set is recursive, rather than relying on ad-hoc numerical properties.

  ***

  # Marking Scheme

  **Part (a) [10 Marks]**
  *   **A Answer:** Defines invariant ($N_I \not\equiv 0 \pmod 3$). Proves base case. Checks all 4 rules. **Crucial:** Explicitly states that $2k \not\equiv 0 \pmod 3$ because 2 is invertible/non-zero-divisor mod 3. Explains that derivation space is infinite, so finite search is inconclusive.
  *   **B Answer:** States invariant and checks rules but treats Rule (ii) vaguely ("doubling doesn't make it divisible") without modular justification. Or, fails to explain why search is insufficient.
  *   **Common Error:** Checking rules on examples rather than generally; claiming $2k$ is never divisible by 3 without modular arithmetic justification.
  *   **A/B Separator:** The explicit modular arithmetic justification for Rule (ii).

  **Part (b) [14 Marks]**
  *   **A Answer:** Identifies all 4 errors: (1) MIU too weak for Gödel; (2) "Truth" is a category error (syntax vs. semantics); (3) The invariant proof *is* mechanizable (counting is algorithmic); (4) "Jump out" = metatheory, not anti-mechanism.
  *   **B Answer:** Identifies 2-3 errors but conflates "truth" with "derivability" or accepts that the invariant proof is unmechanizable.
  *   **Common Error:** Agreeing with Dana that MIU is incomplete in the Gödelian sense; claiming humans can do what machines can't regarding the mod-3 check.
  *   **A/B Separator:** Recognizing that the metatheoretic proof itself is formalizable/mechanizable (Point 3).
  *   **Bonus (+2):** Notes that MIU-derivability is actually decidable (via the mod-3 criterion), so the system is complete with respect to its own derivability facts.

  **Part (c) [6 Marks]**
  *   **A Answer:** Notes invariant breaks ($1 \to 3 \equiv 0$). Shows derivation $MI \to MIII \to MU$. States non-derivability is system-relative. Closing: Need a decision procedure/algorithm.
  *   **B Answer:** Says invariant breaks but fails to derive $MU$ or claims $MU$ is still unreachable.
  *   **Common Error:** Thinking changing rules changes the string's properties rather than the system's reach.
  *   **A/B Separator:** Correctly identifying that non-derivability is a system-relative property, not string-intrinsic.
