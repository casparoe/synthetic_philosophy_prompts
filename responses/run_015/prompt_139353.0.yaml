  # Does the Simulation Argument Dampen Fanaticism About the Far Future?
  ### A Decision Tree for Longtermist Newcomers

  **Instructions:** Start at **Q1**. For each claim, mark **Accept** (True) or **Reject** (False). Follow the arrows to your terminal position.

  ---

  ### The Branches

  **Q1. Simulation Credence**  
  *"Bostrom's trilemma implies a non-negligible probability (>10%) that we are currently in an ancestor simulation."*  
  ├─ **Reject** ───────────────────────────────────────────────► **BASE-REALITY-ONLY**  
  └─ **Accept** ───────────────────────────────────────────────► *Go to Q2*

  **Q2. Moral Status of Sims**  
  *"The welfare of merely simulated beings counts fully (or near-fully) toward total moral value."*  
  ├─ **Reject** ───────────────────────────────────────────────► **BASE-REALITY-ONLY** *(Effective)*  
  └─ **Accept** ───────────────────────────────────────────────► *Go to Q3*

  **Q3. Future Trajectory**  
  *"Being simulated makes our future more likely to be truncated (shutdown/limits) than vastly larger (nested sims)."*  
  ├─ **Accept** ───────────────────────────────────────────────► **SHUTDOWN-DISCOUNTED**  
  └─ **Reject** ───────────────────────────────────────────────► *Go to Q4*

  **Q4. Anthropic Selection**  
  *"Conditional on being simulated, our evidence should be treated as preferentially from simulations run because they contain large futures."*  
  ├─ **Accept** ───────────────────────────────────────────────► *Go to Q5*  
  └─ **Reject** ───────────────────────────────────────────────► *Go to Q6*

  **Q5. Variance & Fanaticism**  
  *"Simulation hypotheses increase outcome variance sufficiently that tiny probabilities of vast value dominate expected value calculations."*  
  ├─ **Accept** ───────────────────────────────────────────────► **AMPLIFIED-FANATICISM**  
  └─ **Reject** ───────────────────────────────────────────────► **BUSINESS-AS-USUAL**  

  **Q6. Epistemic Stability**  
  *"Metaphysical uncertainty about simulation status renders far-future expected value calculations too unstable to justify high-stakes sacrifice."*  
  ├─ **Accept** ───────────────────────────────────────────────► **CLUELESSNESS / ANTI-FANATICISM**  
  └─ **Reject** ───────────────────────────────────────────────► **BUSINESS-AS-USUAL**  

  ---

  ### Logical Space Analysis

  **Unoccupied Combinations**  
  *Combinations of claims that are logically possible but do not yield a named leaf in this tree.*

  1.  **{Q3: Truncated, Q4: Selection for Large}** — **Incoherent.** One cannot consistently claim simulations are likely shut down *and* that we should update toward simulations selected for having large futures.
  2.  **{Q2: Moral Status Rejected, Q3: Truncation Accepted}** — **Conditionally Irrelevant.** If simulated welfare counts for nothing (Q2-Reject), whether that welfare is truncated (Q3) is action-guidance equivalent to Base-Reality-Only.
  3.  **{Q5: Variance Rejected, Q6: Stability Accepted}** — **Undefended.** Few argue that variance is low *but* uncertainty still breaks calculations; usually, high variance is the driver of instability.

  **Indistinguishable Leaves**  
  *Pairs of leaves this tree cannot genuinely separate in terms of action-guidance.*

  *   **Base-Reality-Only (via Q1) vs. Base-Reality-Only (via Q2):**  
      Whether we are definitely in base reality (Q1-Reject) or sims simply don't count morally (Q2-Reject), the practical instruction is identical: ignore simulated future trajectories. The metaphysical justification differs, but the longtermist portfolio does not.

