answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, following a joint seminar on Algorithmic Ethics and Social Ontology. Coffee cups sit untouched on the table between them.*

  **Dr. Elena Vasquez:** Marcus, I've been thinking about the "Profile Theta" case you raised in the Q&A. You seem to treat it as a mere statistical artifact, a ghost in the machine. But look at the mechanics: the recommendation system identifies a stable cluster based on purchase rhythms, linguistic markers, and interaction tempos. It doesn't ask for race or gender, yet it correlates strongly with them. When lenders use Theta to deny credit, or landlords use it to filter applications, that cluster ceases to be just a pattern. It becomes an institutional kind. It has causal powers.

  **Dr. Marcus Chen:** I don't deny the causal outcomes, Elena. If a lender denies a loan based on Theta, the applicant is materially harmed. My objection is ontological. By calling Theta a "social kind," you grant it a stability it doesn't deserve. It's a feedback loop disguised as a category. If we treat these behavioral correlations as genuine kinds, we risk a new form of essentialism. It's essentialism disguised as data-driven neutrality. We tell the individual, "You are Theta," and suddenly their autonomy is subsumed by a behavioral profile they didn't choose and can't easily escape.

  **Vasquez:** But that's precisely why we need to name it. You're worried about reification, that acknowledging Theta makes it "real." But ignoring it doesn't make the harm disappear; it just obscures the mechanism. Think about race. As an institutional realist, I argue race is real not because of biology, but because institutions treat it as a basis for distribution. Theta is functioning exactly like race. If we refuse to call it a kind because it's "just statistics," we fail to track the structural harm. The worry about reifying a contingent pattern is valid, but contingent patterns are *all* social kinds are made of. The contingency doesn't negate the reality of the constraint.

  **Chen:** I hear you on the structural harm, and I agree we must track it. But here is where I push back on your claim about causal efficacy. You say Theta has causal powers. I argue the causal power lies in the *classifier*, not the *kind*. The algorithm is the agent of exclusion; Theta is just the label it slaps on the excluded. If we ontologize Theta, we suggest there is something about the cluster itself that warrants management. That undermines the eliminativist project. We shouldn't be trying to fit Theta into our ontology of social kinds; we should be dismantling the systems that find utility in such clusters. Validating it as a kind makes it harder to break, because now it's part of the social fabric rather than a bug in the code.

  **Vasquez:** That distinction between the classifier and the kind is too clean. Once the classifier is deployed, the "kind" loops back into the behavior. If people know Theta gets denied loans, they might alter their linguistic markers or purchase rhythms to evade it. That's a looping effect. It changes how they navigate the world. So, Theta *does* have causal power independent of the specific algorithm instance; it shapes social navigation. To your point about dismantling the system: how can we dismantle a structure if we refuse to name the beams holding it up? If I say "racism is harmful but race isn't real," I lose the vocabulary to describe the vector of the harm. Similarly, if Theta is the proxy for redlining, calling it an institutional kind gives us the leverage to regulate it as a protected category.

  **Chen:** But there's a danger in that leverage. If you regulate Theta as a kind, you institutionalize the boundary. You're asking the law to recognize "people who buy X and speak with Y tempo" as a coherent group. That fractures individual autonomy. An eliminativist would say the goal is to make such clustering legally and socially irrelevant, not to give it a seat at the table. Regarding your point on causal efficacy: I grant that the *belief* in Theta has effects—that's the superstition aspect. But a superstition can cause a witch hunt without witches being real. We can acknowledge the harm of the witch hunt without ontologizing the witch. We should target the discriminatory intent of the lender, not reify the behavioral cluster they used as an excuse.

  **Vasquez:** The witch analogy fails because Theta isn't a fantasy; it's a functional tool of capital allocation. It's not a superstition; it's a risk assessment model that works *because* it tracks historical inequality. If we treat it as a witch—a non-entity—we miss the fact that it successfully predicts "risk" only because it identifies marginalized groups. My second point is this: Ignoring the reality of Theta allows the institution to claim neutrality. They can say, "We don't see race, we only see Theta." If we acknowledge Theta as an institutional kind, we force the admission that Theta is a proxy for race. We collapse the distance between the "neutral" data and the "biased" outcome. That is the only way to expose the structural harm.

  **Chen:** I agree that collapsing that distance is vital. But I maintain that we can do that by exposing the *correlation* without endorsing the *category*. We can say "Theta correlates with race and is used discriminatorily" without saying "Theta is a social kind." The latter implies a coherence—a shared experience or identity among Thetas—that doesn't exist. These people don't know they are Thetas. They have no solidarity. By calling it a kind, you impose a collective identity on isolated individuals. That is the new essentialism. It strips them of the ability to define themselves outside the algorithm's gaze. My second move is this: If we want to protect autonomy, we must deny the algorithm the power to constitute social reality. We treat Theta as a weapon, not a group.

  **Vasquez:** But a weapon implies a wielder, and often the wielder is a black box we can't litigate against. The cluster *is* the actor in the system. If we don't grant it ontological status, we can't hold it accountable. You say they have no solidarity, but institutional kinds don't require solidarity to be real; they require shared treatment. Jews were treated as a kind before they had political solidarity. The reality was imposed from the outside. Theta is the same. If we wait for them to identify as Thetas, we've already lost. The harm is in the imposition.

  **Chen:** And that imposition is exactly what eliminativism seeks to stop. But if we call it a "kind," we normalize the imposition. We say, "Yes, this is a valid way to slice the population, provided we monitor it." I say, "No, this is an invalid way to slice the population, period." We can acknowledge the causal efficacy of the *discrimination* without acknowledging the validity of the *category*. The harm is real, Elena, but the kind is a fiction that makes the harm durable.

  **Vasquez:** Then we agree on the harm, but disagree on the remedy. You think dissolving the category dissolves the harm. I think recognizing the category is the only way to dismantle the institution that wields it.

  **Chen:** And I think recognizing it hands the institution the very tool they need to claim they are merely "managing diversity" rather than enforcing hierarchy.

  **Vasquez:** *Sips cold coffee.* Then I suppose the work isn't in the ontology, but in the politics of who gets to define it.

  **Chen:** *Nods.* Precisely. Whether Theta is "real" matters less than who survives it. But I still say we stop calling it a "who."
