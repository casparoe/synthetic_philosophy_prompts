prompt: |-
  I am a PhD student in philosophy working on rational choice and game theory, and I am trying to reverse-engineer the working criterion my supervisor uses when she gives advisory verdicts on whether a proposed modification to a default game counts as a safe Pareto improvement.

  In our reading group we use the following framework. A default game is given in normal form. A modification introduces a new game, or a device for playing the old game, whose outcome is assumed to correspond to an outcome of the default game under the usual qualitative assumptions: strictly dominated strategies can be iteratively removed, and isomorphic games are played isomorphically. We all accept a minimal necessary condition: a modification counts only if, for every outcome of the default game that is compatible with those assumptions, no player is made worse off by the corresponding outcome of the modified game, and for at least one compatible outcome at least one player is made strictly better off. If a modification leaves every player exactly as well off in every compatible outcome, it is not an improvement. Beyond that, our supervisor has never stated a formal rule; she just issues verdicts, and I want to know which rule she is implicitly running.

  Her verdicts on three earlier cases are as follows. In each case, the row player's payoff is listed first and the column player's payoff second.

  Case 1. Default game G1 has actions A and B. Payoffs are: (A,A) = (2,2); (A,B) = (0,3); (B,A) = (3,0); (B,B) = (1,1). Action B strictly dominates A for both players, so after iterative removal of strictly dominated strategies the only compatible outcome is (B,B) with payoffs (1,1). The proposed modification M1 is a commitment device that makes the corresponding outcome (A,A) with payoffs (2,2). She approved M1.

  Case 2. Default game G2 has actions X and Y. Payoffs are: (X,X) = (3,3); (X,Y) = (0,2); (Y,X) = (2,0); (Y,Y) = (1,1). No strategy is strictly dominated. The Nash equilibria are (X,X) and (Y,Y); the outcomes (X,Y) and (Y,X) are miscoordination outcomes that are compatible with the assumptions but are not equilibria. The proposed modification M2 is a device that guarantees the outcome (Y,Y), with payoffs (1,1), no matter which compatible default outcome would have occurred. She rejected M2.

  Case 3. Default game G3 has actions P and Q. Payoffs are: (P,P) = (2,2); (P,Q) = (0,0); (Q,P) = (0,0); (Q,Q) = (1,1). No strategy is strictly dominated. The equilibria are (P,P) and (Q,Q); the miscoordination outcomes are (P,Q) and (Q,P), both yielding (0,0). The proposed modification M3 redirects play to (P,P), with payoffs (2,2), if the default outcome would have been (Q,Q) or either miscoordination outcome, but leaves the outcome unchanged if the default outcome would have been (P,P). Thus the corresponding payoffs are: default (P,P) -> (2,2); default (Q,Q) -> (2,2) instead of (1,1); default miscoordination -> (2,2) instead of (0,0). She approved M3.

  The new proposal is Case 4. Default game G4 has actions L and R. Payoffs are: (L,L) = (2,2); (L,R) = (0,0); (R,L) = (0,0); (R,R) = (2,2). No strategy is strictly dominated. The equilibria are (L,L) and (R,R); the miscoordination outcomes are (L,R) and (R,L), both yielding (0,0). The proposed modification M4 leaves the outcome unchanged if the default outcome would have been (L,L) or (R,R), but redirects play to (R,R), with payoffs (2,2), if the default outcome would have been either miscoordination outcome. Thus the corresponding payoffs are: default (L,L) -> (2,2); default (R,R) -> (2,2); default (L,R) -> (2,2) instead of (0,0); default (R,L) -> (2,2) instead of (0,0).

  Please do the following. First, identify the plausible rules that fit all three earlier verdicts. I suspect there is more than one; in particular, say whether she is running a rule that evaluates every compatible outcome of the default game, or only the compatible outcomes that are equilibria, or some third variant, and whether strict improvement is required in every compatible outcome or only in some. Second, say what each of those candidate rules predicts about M4 in Case 4: would she approve or reject, and why. Third, give your best guess about her verdict on M4, with the reasons for preferring the rule you attribute to her over its closest rival. Fourth, name one further case—specify a default game and a modification, or a variant of G4 and M4, by its payoff effects on the relevant default outcomes—that would best tell the leading candidate rules apart, and state what each rule would predict about that further case.

  I do not want a literature review or references; I want the case-based reconstruction, the prediction, and the discriminating case.
