  ### I. Type-Theoretic Restatement of the Argument

  Consider a context $\Gamma$ containing types $A$ and $B$, and terms $a : A$ and $b : B$. We wish to construct a representation of the state of affairs wherein $a$ stands in relation $R$ to $b$. In a standard type-theoretic framework, we define a type family $R : A \to B \to \mathsf{Type}$. To assert that the relation holds, we introduce a term $r : R(a, b)$.

  **The Regress of Constructors**
  The argument begins by analyzing the structure of the term $r$. If $r$ is treated as a canonical term constructed from $a$, $b$, and a relation constructor $\mathsf{rel}$, then the expression is syntactically composite: $\mathsf{rel}(a, b)$. The question arises: what ensures the binding of the constructor $\mathsf{rel}$ to the arguments $a$ and $b$?

  If this binding is itself represented as a term within the system, we must introduce a new type $\mathsf{Bind}_1$ and a term $c_1 : \mathsf{Bind}_1(\mathsf{rel}, a, b)$. However, $c_1$ is now a term requiring binding to its own arguments ($\mathsf{rel}, a, b$). This necessitates a further type $\mathsf{Bind}_2$ and a term $c_2 : \mathsf{Bind}_2(c_1, \mathsf{rel}, a, b)$. This generates an infinite sequence of types and terms $\{ \mathsf{Bind}_n, c_n \}_{n \in \mathbb{N}}$. At no finite stage is the connection between the components fully secured by terms alone, as every connecting term introduces new components requiring connection.

  **The Distinction Between Parameters and Indices**
  One might attempt to halt the regress by treating the relation not as a term argument but as an index of a type. Let $P$ be an inductive family indexed by $A$ and $B$. A term $p : P(a, b)$ relies on the indices $a$ and $b$ being fixed in the type signature. However, the argument contends that the distinction between a parameter (fixed for the definition) and an index (varying per term) is itself a structural feature of the type definition. If the typing judgment $\Gamma \vdash p : P(a, b)$ is to represent a unified state of affairs, the dependency of $P$ on $a$ and $b$ must be immediate. If this dependency is mediated by substitution rules or equality constraints (e.g., $a =_A a'$), we require identity proofs $\mathsf{refl} : \mathsf{Id}_A(a, a)$. But the application of $\mathsf{refl}$ to the type $P$ again invokes the application problem: what connects the proof $\mathsf{refl}$ to the type $P$?

  **The Claim of Primitive Unity**
  The argument concludes that no sequence of term constructions (Sigma types, Identity types, or inductive constructors) can yield a primitive unity. A Sigma type $\Sigma (x : A). B(x)$ is a pair $(a, b)$, but the pair constructor is merely a function symbol. The unity of the proposition cannot be a term $t : T$ within the context $\Gamma$, because any such term is decomposable into a head and arguments.

  Instead, the unity must reside in the **typing judgment** itself. The assertion $\Gamma \vdash t : T$ is not a term within $\Gamma$; it is a statement *about* $\Gamma$. The unity of the proposition corresponds to the indivisibility of the judgmental relation $\vdash$. To decompose the judgment into terms is to move from the object language to the meta-language, generating the regress described above. Therefore, a unified state of affairs is represented not by a complex term, but by the validity of a judgment that resists reduction to a list of constituent terms connected by further terms.

  ***

  ### II. Residue Report

  This section analyzes the fidelity of the translation from metaphysical argument to type-theoretic formalism.

  **1. Clean Translations**
  *   **The Regress:** The infinite tower of binding terms maps cleanly onto the potential for infinite coherence conditions in higher-dimensional type theories. The worry that a connector requires a connector is structurally identical to the worry that a path between points requires a path between paths (homotopy levels), potentially ad infinitum if truncation is not assumed.
  *   **Terms vs. Types:** The metaphysical distinction between "particulars" (relata) and "universals" (relations) translates robustly into the distinction between terms ($a : A$) and type families ($R : A \to \mathsf{Type}$).
  *   **Decomposition:** The idea that complex entities are built from simpler ones via constructors mirrors the type-theoretic commitment to canonical forms and introduction rules.

  **2. Distortions and Category Shifts**
  *   **Judgments as Assertions:** In the restatement, the "unity of the proposition" is mapped to the typing judgment ($\vdash$). In Bradley's metaphysics, the unity is a feature of *reality* (the fact), not merely a feature of *assertability*. Type theory conflates the existence of a proof with the truth of a proposition (Propositions as Types). This distorts the metaphysical claim that a fact could be unified even if unasserted. The formalism treats unity as derivability, whereas the argument treats unity as ontological cohesion.
  *   **The Nature of the Connector:** Bradley treats the "tie" as a mysterious ontological glue. In type theory, the "tie" is function application or substitution. Function application is defined by computation rules ($\beta$-reduction). Translating "ontological glue" to "computational reduction" shifts the problem from *what binds* to *how we calculate*. This sidesteps the metaphysical weight of the connection by replacing it with syntactic manipulation.
  *   **Regress Termination:** In type theory, the regress is typically halted by *definition*. We stipulate that application is primitive. Bradley argues that stipulation is insufficient; the primitive must be intelligible. The formalism treats the primitive as a given rule; the metaphysics demands an account of its possibility.

  **3. The Untranslatable Residue: Non-Decomposable Unity**
  *   **The Holism of the Judgment:** The core residue is the status of the context $\Gamma$ itself. In type theory, $\Gamma$ is a list of assumptions. It is decomposable by definition (weakening and exchange rules allow us to add or reorder assumptions). Bradley's unity implies a holistic state where the parts are constituted by their place in the whole. In standard type theory, terms retain their identity independently of the context (up to conversion). There is no formal mechanism for a term $a$ to change its identity based on its integration into a judgment $\Gamma \vdash a : A$.
  *   **Internal vs. External Relations:** Type theory is fundamentally extensional regarding terms (two terms are equal if they convert to the same normal form) but intensional regarding definitions. Bradley's unity suggests that relations are internal to the terms (the terms are what they are *because* of the relation). Standard dependent type theory treats relations as external type families imposed on pre-existing terms. While identity types can simulate internal relations, they do so by adding more terms (paths), reintroducing the regress.
  *   **The "Force" of Unity:** The feeling that a proposition is a single *act* of meaning, rather than a composite object, has no counterpart. Type theory is object-oriented (terms are objects); Bradley's unity is act-oriented. The judgment $\vdash$ is the closest proxy, but it is a static relation in the meta-theory, not a dynamic act of unification within the system.

  ***

  ### III. Assessment: Metaphysical Limit or Formal Limitation?

  The untranslatable residue points primarily to a **limitation of decompositional formalisms**, specifically those based on Martin-Löf Type Theory (MLTT) and its variants, rather than a hard boundary of formal representation itself.

  **1. The Limitation of Constructivism**
  Standard type theory is constructive and decompositional: every term must have a canonical form built from constructors. This architecture presupposes that unity is always *achieved* by construction. Bradley's argument challenges this presupposition, suggesting that unity is *prior* to construction. The residue arises because MLTT forces the "whole" to be defined in terms of the "parts" (via introduction rules), whereas Bradley argues the parts are abstractions from the whole.

  **2. Potential Architectural Remedies**
  This limitation is not necessarily permanent for all formal systems. Alternative type-theoretic architectures could mitigate the residue:
  *   **Judgmental Complexity:** One could elevate judgments to first-class citizens within the type theory (a "logical framework" approach where judgments are types). This would allow the unity of the judgment to be manipulated internally, though it risks reintroducing the regress at a higher level.
  *   **Categorical Semantics:** Moving from syntax to semantics, a categorical model treats morphisms (relations) as primitive alongside objects. In a category, the composition $g \circ f$ is a primitive operation, not a term constructed from $f$ and $g$ plus a connector. This aligns better with Bradley's demand for primitive unity, as the morphism *is* the connection.
  *   **Holistic Type Theories:** Recent work in "modal" or "spatial" type theories, where the context $\Gamma$ has topological structure rather than being a simple list, allows for dependencies where the identity of a term is sensitive to its position in the context. This begins to model the "internal relations" aspect of Bradley's unity.

  **Conclusion**
  The residue does not prove that metaphysical unity is ineffable or outside formal reach. Rather, it reveals that standard Agda/Coq-style type theories are engineered for *analysis* (decomposition into constructors), not *synthesis* (primitive unification). The "untranslatable" aspect is the priority of the whole over the parts. A formalism that takes morphisms, judgments, or contexts as primitive—rather than terms built from constructors—could represent Bradley's unity without regress. Thus, the difficulty is not metaphysical impossibility, but a mismatch between the specific decompositional architecture of current proof assistants and the holistic nature of the metaphysical claim.
