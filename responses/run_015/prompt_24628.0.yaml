answer: |-
  **Project Title:** The Invariance of Ignorance: Formalizing Independence as a Defeasible Prior in Probabilistic Inference

  **Research Question**
  Can the heuristic presumption of independence be derived as the unique consequence of requiring probabilistic judgments to be invariant under separate reparameterizations of the marginal variables, or does any formal justification for independence necessarily introduce arbitrary structural assumptions?

  **Problem Statement**
  In probabilistic reasoning, agents frequently employ a default heuristic: when no evidence connects two variables, treat them as independent. This presumption functions as an overridable default, retained until positive evidence of correlation arises. However, the formal backbone of this heuristic is contested between two incompatible positions, both of which claim to represent "maximum ignorance."

  The first position relies on the Maximum Entropy (MaxEnt) principle. It argues that if one fixes the marginal distributions $P(A)$ and $P(B)$ as known constraints, the unique joint distribution $P(A,B)$ that maximizes entropy is the product distribution $P(A)P(B)$. Here, independence is the least informative assumption conditional on the marginals. The second position relies on measure-theoretic considerations over the space of joint distributions. It argues that independence constitutes a lower-dimensional, measure-zero subset of the space of all possible couplings. Therefore, a truly uniform prior over the space of joint distributions would assign probability zero to exact independence, suggesting the default should be a spread over dependence parameters rather than a point mass at zero.

  Both positions leave the question open because they assume what they aim to justify. The MaxEnt justification is not invariant to non-linear reparameterizations of the variables; a transformation that preserves independence may not preserve the entropy-maximizing property unless the measure is adjusted ad hoc. The measure-theoretic objection depends on the choice of metric over the space of distributions; there is no unique "uniform" measure on a simplex without specifying a geometry. Consequently, neither approach successfully formalizes independence as a non-arbitrary default. They treat the presumption of independence as either a hard constraint (MaxEnt) or an impossibility (Measure Theory), failing to capture its actual role as a defeasible prior that concentrates belief near independence without ruling out dependence.

  **Proposed Approach**
  This project will bypass the stalemate by shifting the focus from the space of distributions to the space of *mechanisms* generating those distributions. Rather than asking whether independence is the default state of the world, the project will ask whether independence is the default state of *information* when symmetry constraints are applied to the inference process itself.

  The core methodology will employ **Group Invariance** arguments applied specifically to the dependence structure. I will construct a formal model where the agent's state of ignorance is represented by a prior over the dependence parameter (e.g., the correlation coefficient $\rho$ or a copula parameter). The project will test whether requiring the prior to be invariant under separate transformation groups for variable $A$ and variable $B$ (e.g., separate location-scale transformations) forces the prior to concentrate at $\rho=0$.

  This approach improves upon purely axiomatic treatments, which often stipulate independence as an axiom without deriving it, and it avoids the limitations of accumulating puzzle cases, which cannot establish general formal conditions. By using Group Invariance, the project tests whether the independence heuristic emerges from the symmetry of the ignorance itself. If the symmetry groups for $A$ and $B$ are disjoint and no joint symmetry is specified, does the mathematics compel a factorizable prior? Furthermore, I will compare this against a **Minimum Description Length (MDL)** formulation. If independence is treated as the null model in a coding framework, the "default" becomes a complexity penalty: independence is preferred not because it is maximally probable a priori, but because it is the shortest description. Comparing the Invariance approach against the MDL approach will determine whether the heuristic is best understood as a symmetry requirement or a complexity constraint.

  **Success and Failure Conditions**
  A successful result will derive a specific functional form for the prior over the dependence parameter that satisfies the invariance constraints. Ideally, this prior will not be a Dirac delta at independence (which is unoverrideable) nor uniform over all dependence (which ignores the heuristic), but a distribution that peaks at independence with tails that allow for updating upon evidence. Success requires showing that this form is unique under the stated symmetry conditions and invariant to reparameterization of the marginals.

  The project will be considered to have failed if it demonstrates that no such invariant prior exists without introducing hyperparameters that themselves encode assumptions about dependence. Similarly, if the Invariance approach yields a uniform spread over dependence (aligning with the measure-theoretic objection) while the MDL approach yields a spike at independence, the project must conclude that the heuristic is not a matter of probabilistic ignorance but of pragmatic compression. A failure to resolve this distinction would indicate the problem is larger than the scope of probabilistic formalization alone.

  **Tractability and Scope**
  This project is tractable within the scope of a term paper if restricted to the bivariate case with continuous variables. The mathematics of Group Invariance for correlation coefficients is well-defined, and the comparison with MDL penalties for bivariate Gaussian models is computationally straightforward. The risk lies in the multivariate extension; requiring pairwise independence defaults across a network introduces consistency constraints (e.g., positive definiteness of covariance matrices) that may break the simple invariance arguments. Therefore, the project will explicitly limit its determinate claims to the bivariate case, noting multivariate generalization as future work. This scope ensures a determinate answer to the core question: whether the simplest case of "no connection" formally warrants a presumption of independence under invariant ignorance.
