  ok so i'm trying to figure out if my philosphical positions on moral motivation actually hang together or if i'm just collecting cool quotes.

  here's roughly where i stand: (1) i buy bernard williams's integrity objection pretty hard — i think utilitarianism asks people to abandon their ground projects in a way that destroys what's valuable about having a life; (2) i also think the problem of having one thought too many is real not just for utilitarians but for anyone who treats personal attachments as needing moral justification; (3) but i also want to say that moral reasons have to be universalizable in some loose kantian sense — like if saving my partner in a fire is okay, it can't just be because they're mine, there has to be a reason anyone in that structural position could appeal to; (4) and i think moral psychology should aim for refelctive equilibrium, not just raw intuition. the thing that feels shaky is that williams seems to be defending exactly the kind of agent-relative, non-universalizable commitment that my (3) seems to reject. but maybe there's a way to universalize agent-relative reasons? or maybe the one-thought-too-many point is doing different work than i think? can you go through which pairs are actually in tension, which ones just look like it, and what's the least costly fix? please rank them by severity rather than listing them all as equally bad.
