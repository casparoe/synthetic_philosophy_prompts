answer: |-
  Here is your Q&A prep, ordered by the product of likelihood and damage potential within this specific room.

  ### 1. The Bayesian Normativity Objection
  **Who:** The two formal epistemologists.
  **The Vibe:** Polite, precise, slightly disappointed. They think you are confusing *evaluative* norms with *prescriptive* guides.
  **The Question:** "You say hardness is evidence about the model, not the agent. But normatively, the agent still faces the hard problem. If I'm evaluating whether an agent is rational, and they fail an NP-hard task, aren't they still irrational by the lights of the ideal theory? You seem to be moving the normative goalposts from the agent to the designer, but the agent's beliefs still won't match the world."

  **The 90-Second Answer:**
  "I'm not moving the goalposts on what counts as a good fit between mind and world; I'm challenging where we locate the failure when that fit is missing. If I hand you a locked box and ask for the contents, and you don't have the key, your beliefs don't match the world. But the failure isn't in your epistemology; it's in my decision to lock the box.
  In the ideal theory, yes, the agent ought to have the posterior that matches the evidence. But in an embedded context, 'evidence' isn't just sitting there; it's encoded. If the encoding requires exponential time to decode, the 'irrationality' is a feature of the encoding scheme, not the updating rule. My claim is that once we acknowledge the environment is built, the normative primitive shifts. We shouldn't just ask 'did the agent maximize expected utility?' We have to ask 'was the utility function presented in a computationally legible way?' If not, the criticism belongs to the presenter, not the processor."

  **Where This Is Soft:**
  You are risking a equivocation on "rationality." The Bayesians will press that *ideal* rationality is the standard, and bounded rationality is just a description of performance errors. You need to hold the line that *normative* claims about agents in social systems must include the cost of access to information, not just the processing of it.

  ### 2. The Resource-Rational "Average-Case" Objection
  **Who:** The cognitive science / computational rationality folks.
  **The Vibe:** Technical, sharp, referencing literature without citing it. They know you're leaning on worst-case complexity.
  **The Question:** "You lean hard on worst-case complexity to say the problem is 'too hard.' But we know worst-case is often unrepresentative. Smoothed analysis and average-case complexity show that many NP-hard problems are tractable on the distributions agents actually face. Are you sure the hardness you're identifying is structural, or are you just pointing out that the environment hasn't been optimized for *your* specific algorithm? Maybe the agent is resource-rational, and the environment is just high-entropy."

  **The 90-Second Answer:**
  "That's exactly why the 'imposed' part of the label matters. I agree that worst-case alone doesn't condemn a system. But in the institutional cases I'm discussing—benefits eligibility, tax codes, hospital rotas—the distribution isn't natural entropy. It's a product of policy choices.
  When a benefits system creates combinatorial explosions in eligibility criteria, that isn't a natural average-case distribution; it's a designed feature of the rule interaction. If the environment looks hard on average, we need to ask if that average was selected for. Resource-rationality assumes the environment is a fixed constraint to adapt to. I'm arguing that in social contexts, the environment is a variable. If the 'average case' is hard, that's often because someone chose rules that make it so, perhaps to reduce payout rates or shift administrative burden. The hardness isn't a bug of the universe; it's a feature of the policy."

  **Where This Is Soft:**
  You need empirical backing that these specific institutional distributions *are* hard on average, not just worst-case. If they can show that a simple heuristic solves the benefits problem 95% of the time, your claim that the system is "intractable" loses force.

  ### 3. The Political "Many Hands" Objection
  **Who:** The political philosophers and legal theorists.
  **The Vibe:** Skeptical of technical fixes to political problems. Smelling a structural argument that might be too individualistic.
  **The Question:** "You say someone could have arranged things so the instance was easy. But in complex institutions, no single 'someone' exists. The tax code is the result of decades of legislation, lobbying, and compromise. The hardness emerges from the aggregation of legitimate rules, not a single designer's choice. If responsibility requires agency, and the agency is diffuse, doesn't your responsibility claim evaporate? You're identifying a structural injustice but offering a design critique."

  **The 90-Second Answer:**
  "I accept that the 'someone' is often collective, but collective responsibility doesn't mean *no* responsibility. We hold legislatures, boards, and agencies responsible for outcomes even when no single member intended them.
  The point of framing this as 'imposed hardness' is to make the computational burden visible as a political cost. Currently, complexity is a stealth tax on the claimant. By treating hardness as a design flaw rather than a natural constraint, we empower oversight bodies to say, 'This legislation passes the policy test but fails the computability test.' It doesn't require a single villain; it requires a veto point. If a bill creates an intractable claims process, the committee responsible for administrative feasibility should have the power to flag it. The diffusion of agency is real, but that's an argument for better institutional design, not an excuse to treat the hardness as inevitable."

  **Where This Is Soft:**
  This is your thinnest point (Step 3). If they press on *how* to assign blame when simplification costs money or reduces targeting accuracy, you might get stuck. You need to be ready to say that *some* hardness is the price of precision, but *this much* is gratuitous.

  ### 4. The Emeritus "Ought Implies Can" Objection
  **Who:** The philosopher of action.
  **The Vibe:** Grumpy, classic, will ask this even if you preempt it.
  **The Question:** "If a problem is NP-hard, then for large instances, the agent *cannot* solve it in polynomial time. It is physically impossible. If 'ought implies can,' and they cannot, then they ought not. You seem to want to say they *ought* to have solved it, or at least that they are criticized for not solving it. You can't have it both ways."

  **The 90-Second Answer:**
  "I agree they cannot solve it, and I agree they are not blameworthy for failing the impossible. That's the baseline. But 'ought implies can' applies to the institution too.
  The institution *can* simplify the rules. The institution *ought* to simplify the rules. My argument isn't that the agent ought to solve the NP-hard problem. It's that we ought not to put agents in a position where their only path to compliance is solving an NP-hard problem. The 'ought' I'm tracking is on the provision of the choice architecture, not the navigation of it. If you lock the door and hand me the key, I ought to open it. If you lock the door and throw away the key, you violated the norm, not me."

  **Where This Is Soft:**
  He may press that "ought implies can" is a condition on *moral obligation*, not *institutional design*. Keep the focus on the symmetry: if the agent is bounded, the designer is bounded too, but the designer has more time and resources.

  ---

  ### Pre-emptive Concessions (First 5 Minutes)
  *Do this in your intro or setup to disarm the room.*

  1.  **Concede the Name:** "I'm calling this 'imposed hardness,' but I know that's a placeholder. It's not a new complexity class; it's a normative categorization of existing complexity results." (Disarms the pedants).
  2.  **Concede Nature:** "Not all hardness is imposed. Some problems are hard because the world is complex. I am only talking about social/institutional instances where the problem structure is a product of human rules." (Disarms the Resource-Rationalists).
  3.  **Concede Trade-offs:** "Simplifying a system can cost money or reduce precision. I am not arguing for zero complexity. I am arguing against *gratuitous* complexity where the burden is shifted to the user without justification." (Disarms the Political/Legal crowd).

  ### Hard Lines (Refuse to Concede)
  *Even under pressure, do not give these up.*

  1.  **Hardness is not a Natural Kind:** Do not let them treat "NP-hard" as a physical property of the task like "heavy." It is a property of the *representation*. If you change the representation, the hardness changes.
  2.  **Institutions are Agents:** Do not let the Political philosophers dissolve the institution into a diffuse cloud. Institutions make choices, and those choices have computational consequences.
  3.  **The Burden of Proof:** The default should not be "the agent must cope." The default should be "the system must be legible." If you demand the agent solve a hard problem, you owe a justification.

  ### The Danger Question
  *You guessed "What does complexity add?" or "How to falsify?"*

  **My Assessment:**
  "What does complexity add?" is survivable. You answer: "It gives us a lower bound on cost. 'Too many options' is vague; 'NP-hard' means the cost scales exponentially."
  "How to falsify?" is also survivable. You answer: "Show me a system where simplification increases cognitive load."

  **The Real Danger Question:**
  **"Isn't this just a way to smuggle a specific political distribution of resources in under the guise of technical neutrality?"**

  **Why this is the killer:**
  This comes from the Political/Legal group, potentially backed by the Bayesians who hate hidden priors. It attacks the *motivation* of the talk. It suggests that "making things computationally easy" is code for "making things cheaper for the state" or "reducing eligibility."
  *   *Example:* A simple benefits rule might be "Everyone gets $500." That's computationally easy (O(1)). A complex rule is "Everyone gets $500 *if* they meet criteria X, Y, Z." The complex rule is harder to compute but might be *more just*.
  *   If you argue for simplicity, are you arguing against means-testing? Are you arguing against nuance?

  **How to handle it:**
  Acknowledge the tension immediately. "There is a trade-off between targeting accuracy and computability. My claim isn't that we should always choose the easiest problem. It's that when we choose the hard one, we must acknowledge that we are imposing a cognitive tax on the claimant to achieve that accuracy. We need to count that tax in the cost-benefit analysis. Currently, we count the dollars saved by strict means-testing, but we don't count the hours the claimant spends proving eligibility. I'm asking for that hour to be counted."

  **Why your guesses were survivable:**
  *   "What does it add?" is a methodological question. You can answer with precision.
  *   "How to falsify?" is a scientific question. You can answer with examples.
  *   "Is this political bias?" is a *legitimacy* question. If you lose this, the whole project looks like a Trojan horse. Keep your eye on the Political philosophers during the talk; if they look skeptical, preempt this point.
