      *   *Minimum Content of Natural Law (MCNL):* This is in *The Concept of Law* (Chapter 9). It is based on *contingent facts* about human nature (vulnerability, limited resources, etc.), not *moral* necessity. It's a thesis about survival, not morality. A system *could* exist without it, but it wouldn't last. It doesn't mean the rules cease to be *law* if they lack this content; it means the system might fail or be inefficient.
      *   *Penumbra/Discretion:* This acknowledges that rules run out. It does *not* mean judges apply morality to determine validity. It means when the rule runs out, judges make new law (interstitial legislation). It doesn't mean the previous rule wasn't law because it was immoral.
      *   *The "Moral Threshold":* Hart explicitly rejects the idea that immorality makes a rule not law. That is the core of the Radbruch formula, which Hart critiques. Hart wants to say: "This is law, but it is too wicked to obey." Fuller wants to say: "This is not law."
      *   *Conclusion on Core Reading:* The user's reading is likely too conciliatory towards Hart. Hart does *not* accept a moral threshold for legal *validity*. He accepts a pragmatic threshold for *efficacy* (MCNL) and a logical threshold for *application* (Penumbra), but not a moral threshold for *existence*.

