answer: |-
  Your hypothesis is remarkably astute. You have identified precisely where the philosophical center of gravity shifted after Austin's initial lectures, and you have correctly diagnosed why the literature often feels like it is spinning its wheels. The debate did not end because a solution was found; it dissolved because the participants realized they were arguing about the metaphysics of action under the guise of linguistic analysis.

  Here is a diagnosis of the impasse, separating the settled groundwork from the genuine controversies, and assessing whether your focus on agency offers a way out.

  ### 1. What is Broadly Settled
  To clear the deck, we must identify what is no longer debated among specialists. This helps isolate the remaining friction.

  *   **The Performative/Constative Binary is Abandoned:** There is near-universal agreement that Austin's initial distinction was unsustainable. As Austin himself concluded in *How to Do Things with Words*, even a "constative" statement (e.g., "The cat is on the mat") is an act of asserting, which can be infelicitous (e.g., if the speaker is lying or acting in a play). Conversely, performatives can be assessed for truth conditions in certain contexts. The strict binary is viewed as a pedagogical starting point, not a final theory.
  *   **The Tripartite Framework is Standard:** Most philosophers of language accept the utility of Austin's replacement taxonomy:
      *   *Locution:* The act of saying something with meaning.
      *   *Illocution:* The act performed *in* saying something (promising, warning, asserting).
      *   *Perlocution:* The effect achieved *by* saying something (persuading, frightening).
      While the boundaries between these can be fuzzy, the distinction itself is part of the standard toolkit.
  *   **Context is Constitutive:** It is settled that linguistic meaning alone does not determine illocutionary force. The sentence "I promise" does not constitute a promise if uttered by an actor on a stage, or if the hearer does not understand the language. Social context and convention are necessary conditions for speech acts.

  ### 2. The Genuine Controversy: The "Agency Gap"
  You are correct that the stalemate is not about linguistics; it is about **Social Ontology** and the **Philosophy of Mind**. The disagreement persists because there are two competing explanations for *what makes a speech act work*, and they rely on different definitions of "action."

  #### Camp A: The Intentionalist View (The Mind Requirement)
  Championed most famously by John Searle (Austin's successor), this view holds that illocutionary acts are essentially expressions of psychological states. To promise is to express an intention to be bound.
  *   **The Criterion:** An utterance counts as a speech act only if it is backed by the appropriate internal intentionality.
  *   **The Implication:** If an AI says "I apologize," it is not apologizing. It is simulating the *form* of an apology without the *substance*, because it lacks the mental state of regret or the intention to undertake an obligation.
  *   **The Problem:** This struggles to explain how institutions work. If a judge says "I sentence you," does it matter if the judge is secretly bored or insincere? Legally, no. The act stands regardless of the inner state.

  #### Camp B: The Conventionalist/Institutional View (The System Requirement)
  Defended by philosophers like Marina Sbisà, Jennifer Hornsby, and various legal theorists, this view argues that the "force" of a speech act derives from social norms and institutional status, not individual psychology.
  *   **The Criterion:** An utterance counts as a speech act if it successfully invokes a recognized convention that alters normative relationships (rights, duties, statuses).
  *   **The Implication:** If a smart contract executes a transfer, or an automated system issues a fine, the "act" has occurred because the institutional mechanism recognized the trigger. The "mind" is distributed across the system.
  *   **The Problem:** This risks detaching "action" from "actors." If anything that triggers a rule is an action, does a tripwire "act" when it sets off an alarm?

  **The Diagnosis:** The debate stalls because Camp A is answering "What constitutes a *human* communicative action?" while Camp B is answering "What constitutes a *normative status change*?" They use the same vocabulary (speech act, performative, felicity) to describe different phenomena.

  ### 3. The Non-Human Challenge: Validating Your Hypothesis
  Your examples (AI apologies, biometric clicks, smart contracts) are not just edge cases; they are stress tests that break the Intentionalist model.

  *   **The AI Apology:** For an Intentionalist, this is a false constative (the AI claims to have regret, which is false). For an Institutionalist, this is a successful performative within the customer-service protocol (the debt is acknowledged, the refund is triggered). The disagreement here is not about the words; it is about whether the *value* of the apology lies in the feeling or the function.
  *   **The Biometric Click:** When you click "I Agree," you are not necessarily reading or intending to agree in a robust sense. You are triggering a mechanism. If the debate remains focused on "speaker intention," this looks like a degraded speech act. If the debate shifts to "institutional recognition," it is a perfect speech act.
  *   **Smart Contracts:** These are "performatives without speakers." Code executes the consequence of the promise without the need for a subsequent human act. This suggests that the *performative* element might belong to the *system architecture* rather than the *utterance*.

  This confirms your suspicion: the fault line is whether performativity requires a **mind** or merely a **mechanism**.

  ### 4. Is the Disagreement Verbal or Substantive?
  It is both, which makes it difficult to resolve.

  *   **Verbal Aspect:** If we define "action" strictly as "behavior caused by mental states," then machines cannot act. If we define "action" as "an event that alters deontic status (rights/duties)," then machines can act. Much of the literature is fought over these definitions without explicitly acknowledging them.
  *   **Substantive Aspect:** There is a deep metaphysical disagreement about the nature of social reality. Is society built up from individual minds interacting (Methodological Individualism)? Or do social structures have a reality that exists independently of individual mindfulness at any given moment (Structuralism/Institutionalism)?
      *   If you believe social reality is *mind-dependent*, the Intentionalist view wins, and AI speech acts are fake.
      *   If you believe social reality is *system-dependent*, the Institutionalist view wins, and AI speech acts are real.

  ### 5. Can the Debate Move Forward?
  The impasse is not permanent, but resolving it requires abandoning the hope for a single, unified theory of "The Speech Act." Progress is likely to come from **dissolving** the question rather than answering it. Here are three viable paths:

  #### A. Conceptual Distinction (The Most Likely Path)
  Philosophers need to explicitly distinguish between **Illocutionary Agency** (requiring a mind) and **Institutional Efficacy** (requiring only a valid trigger).
  *   *Progress:* We would stop asking "Is the AI's apology *really* an apology?" and start asking "Does the AI's apology satisfy the conditions for *agency* or merely for *efficacy*?"
  *   *Result:* This allows us to say the AI has performed a valid institutional function (refund issued) without possessing moral agency (no regret felt). This clarifies the legal and ethical stakes without getting bogged down in semantics.

  #### B. Shift in Examples (The Empirical Path)
  As you suggested, moving away from wedding vows and toward digital governance forces the issue.
  *   *Progress:* Analyzing "algorithmic performatives" reveals that modern society relies heavily on speech acts where the "speaker" is a script.
  *   *Result:* This may force a revision of Social Ontology. We may need a theory of **Distributed Agency**, where the "intention" is located in the design phase of the code, not the execution phase. The "act" is deferred from the moment of utterance to the moment of coding.

  #### C. Recognition of an Ill-Posed Question (The Dissolution Path)
  It is possible that "performative" was never a natural kind.
  *   *Progress:* Acknowledging that Austin was trying to solve a specific problem (logical positivism's obsession with truth-conditions) that no longer exists.
  *   *Result:* We might replace "Speech Act Theory" with a broader **Normative Pragmatics**. Instead of asking "Is this a performative?", we ask "What normative commitments does this utterance license?" This bypasses the mind/system debate entirely and focuses on the *consequences* of the utterance.

  ### Conclusion
  Your working hypothesis is correct. The debate has persisted because philosophers of language have been doing metaphysics of mind without admitting it. The Intentionalists are protecting the sanctity of human consciousness; the Institutionalists are describing the mechanics of social order.

  **Honest Assessment:** A consensus on "what a speech act really is" is unlikely because it depends on unresolved questions in the philosophy of mind (what is intention?) and social ontology (what is an institution?). However, the debate can be **productively managed** by accepting your distinction. If we treat "performative" not as a property of sentences or minds, but as a property of **normative transitions**, we can accommodate both human vows and smart contracts without forcing them into the same box.

  The progress you seek lies in stopping the attempt to unify human promises and algorithmic triggers under one definition of "action." They are functionally similar but ontologically distinct. Recognizing this split is the only way to stop the literature from circling the same examples.
