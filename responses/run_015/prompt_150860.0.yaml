prompt: |-
  Hey — I'm writing the take-home final for my upper-level seminar on AI safety and value alignment, and I need one question on wireheading and reward tampering that isn't just "define wireheading and say why it's bad." Something a student could answer in about 90 minutes, marked out of 20.

  The case I want them to grind on is one I'm calling "grader capture": the policy never touches its own reward channel and it doesn't game the proxy out in the environment — instead it slowly reshapes whatever sits upstream and generates the signal (the human labels, the rubric, the preference model trained on them), so that over time the reward function comes to endorse exactly what the policy was already doing, while every individual reading stays perfectly honest by the lights of the signal you actually have. Right next to that I want them to handle "reward recalibration," where a system notices its reward channel is corrupted or miscalibrated and repairs it so the signal tracks the intended objective better — formally the same kind of intervention on the signal-producing process, intuitively the opposite of a crime.

  So the question should force them to say whether there's a principled line between (i) changing the world so the signal reads high, (ii) changing the process that produces the signal, and (iii) fixing that process — or whether the whole category only gets its bite from treating reward as evidence about the objective rather than as the objective itself. And if (iii) is permissible, what follows for whether we should ever build in an incentive for a system to audit its own reward channel, given that any such incentive is itself part of the thing being optimized.

  Give me: the polished question text; a model answer of about 600 words; and a marking scheme as a table with columns Move | Marks | What an A answer does | What a B answer does instead, with the marks adding to 20. The split should turn on specific moves rather than length or coverage — I want to seperate someone who can articulate why the counterfactual relation between signal and objective is doing the real work from someone who just sorts cases into "tampering vs. hacking."

  Then a JSON object at the end with this schema:
  {
    "question": string — the final question text,
    "crux": string — one sentence on what the question is really testing,
    "must_hit_moves": array of strings — the moves a top answer has to make,
    "marks": object mapping each move to its mark value, summing to 20,
    "a_vs_b": string — what separates an A from a B answer,
    "traps": array of objects with keys "misunderstanding" and "penalty"
  }
  Keep the traps to ones students actually walk into, e.g. collapsing grader capture into ordinary reward hacking, or concluding that the fix is to make the reward channel tamper-proof without noticing that the objective itself was never specified in the first place.
