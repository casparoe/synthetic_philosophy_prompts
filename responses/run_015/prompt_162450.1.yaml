answer: |-
  This is a classic historiographical problem, and your intuition is correct: your colleague is using a cliché to conflate three or four different distinct processes. By treating them as one single truth, they are drawing conclusions that don't actually follow from the evidence, especially in your specific case.

  Here is a breakdown of the precise claims hidden inside "History is written by the victors," evaluated for truth value and applicability to your mill dam situation. You can bring this list directly to the meeting.

  ### Part 1: Deconstructing the Cliché
  The phrase conflates four distinct mechanisms. In your case, some are true, some are false, and none support your colleague's strongest claims.

  | Claim | What it means | Truth Value | Supports Colleague? |
  | :--- | :--- | :--- | :--- |
  | **1. Immediate Authorship** | The victors physically produce the majority of contemporary documents (letters, orders, diaries) during the event. | **False** (in your case) | Refutes (a). Your primary sources are mostly from the *losers*. |
  | **2. Archival Gatekeeping** | The victors decide which documents survive, are collected, or are deemed "worthy" of preservation. | **Contestable / Mixed** | Partially supports (a). The grandchildren funded the archive and wrote the finding aid, influencing *access*, but the flood (chance) saved the loser docs. |
  | **3. Narrative Dominance** | The victors' interpretation becomes the accepted public story (textbooks, plaques, local lore). | **True** (until now) | Supports the need for a *new* plaque, but not the idea that we can't know the truth. |
  | **4. Epistemic Victory** | "Winning" proves moral rightness or factual accuracy; the outcome determines the truth. | **False** | Refutes (b). This is a logical fallacy (Appeal to Force). |

  ### Part 2: Why Your Colleague's Conclusions Don't Hold

  #### Regarding Claim (a): *"The surviving record must be slanted toward the winners so we can't trust any of it."*
  *   **The Error:** This confuses **Authorship** with **Curation**.
  *   **The Reality:** In your specific case, the *contemporary* record is slanted toward the **losers** (because their papers didn't flood). The *archival framing* (finding aids, original plaque) was slanted toward the **winners** (because their grandchildren paid for it later).
  *   **The Verdict:** We *can* trust the record, but we must read it critically. A document written by a loser is not "untrustworthy" because they lost; it is a primary source that requires context. Bias does not equal falsehood. In fact, having the losers' passionate defense gives you *more* data points, not fewer.
  *   **Meeting Point:** "Actually, the paper trail is mostly from the anti-dam side. The 'victor' bias is in the *old plaque*, not the *source material*. We have the losers' voices; we just need to stop letting the winners' grandchildren interpret them for us."

  #### Regarding Claim (b): *"There's no real fact of the matter... only whichever story got told."*
  *   **The Error:** This is **Historical Relativism**. It confuses *narrative* (the story we tell) with *event* (what actually happened).
  *   **The Reality:** Just because the dam backers won the court case and paid for the archive doesn't mean we cannot determine facts (e.g., did they bribe officials? did the dam flood homes?). Power determines *visibility*, not *reality*.
  *   **The Verdict:** False. We can reconstruct facts by cross-referencing the losers' diaries with court records and physical evidence. The "truth" is recoverable even if the "story" was dominated by one side.
  *   **Meeting Point:** "Winning the lawsuit made them the town founders, but it didn't change whether the dam flooded the valley. Our job isn't to accept the winner's story, it's to use the surviving records to reconstruct the event, regardless of who won."

  ### Part 3: The "Mill Dam" Specifics
  Your situation is actually a historiographical goldmine because it inverts the cliché. Usually, victors burn the losers' books. In your town, the **river** burned the victors' books.

  *   **The 1890s:** Losers wrote the letters/newspapers. (Victors were too busy building/running the mill).
  *   **The 1913 Flood:** Nature destroyed the Victors' archives. (Chance, not power).
  *   **The 1950s/60s:** Victors' descendants funded the history. (This is where the cliché applies).

  **Conclusion:** The phrase "History is written by the victors" applies to the **original plaque**, but it is factually incorrect regarding the **archive**.

  ### Part 4: Cheat Sheet for the Meeting
  If the argument comes up again, here are three precise sentences you can use:

  1.  **On the Records:** "The phrase 'written by the victors' usually means they destroyed the losers' documents. In our case, the flood destroyed the *victors'* documents. Our archive is actually dominated by the losing side's voices."
  2.  **On Trust:** "Bias doesn't make a document useless. The anti-dam letters are biased, but they are evidence. We don't discard them because they lost; we use them to balance the later plaque that the winners' families paid for."
  3.  **On Truth:** "Saying 'there is no fact of the matter' confuses *power* with *truth*. They had the power to build the dam and fund the plaque, but that doesn't mean we can't determine the facts of the conflict from the letters we do have."

  **Summary for the Board:**
  Your colleague is using a slogan to avoid the hard work of nuance. The slogan is **false** regarding your primary sources (Claim 1), **partially true** regarding your archival framing (Claim 2), and **philosophically dangerous** regarding your mission (Claim 4). Your job is to use the Losers' papers to correct the Winners' plaque. That isn't impossible; it's exactly what historians are supposed to do.
