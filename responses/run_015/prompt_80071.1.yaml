  7.  **Self-Correction during drafting:** I initially thought about telling them to use `OR` logic. No, that increases false positives. Stick to the philosophical implication: *Belief is not the right metric for irreversible actions.* Use *Risk Acceptance*.

      *   *Analogy:* Unit tests vs. Production. You believe every unit test passes, but you don't believe Production will never break.
      *   *Philosophical term to introduce:* *Fallibilism*. It's rational to believe P while acknowledging P could be false.

  8.  **Final Review against constraints:** No heavy math. Conceptual focus. Backend engineering context.

