          *   *Ah, there it is.* The Lottery Paradox applies to the *batch*, not the individual record logic. The user knows this ("across a million records a few are definitely going to be mistakes").
          *   *Key Insight:* The "All signals agree" rule solves the *local* uncertainty but ignores the *global* statistical certainty of failure.

      *   *Refining the "Open Ticket" incident:* The user said "it deleted a record that still had an open support ticket."
          *   Was "Open Ticket" one of the signals?
