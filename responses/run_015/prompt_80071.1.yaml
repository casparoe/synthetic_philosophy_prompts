          *   I should address both. The paradoxes assume the probabilities are known. Real engineering often suffers from *unknown* probabilities or missing signals.

  6.  **Final Polish:**
      *   Make sure to explicitly answer the "Where does intuition break?" question. (It breaks at the aggregation of risk).
