answer: |-
  **Purpose and scope**

  This procedure guides the Novel Organisms Committee in classifying proposals for containment. Our mandate is not to discover metaphysical truth about life, but to manage risk. We operate under a stipulative definition: an entity is regulated if it poses a containment risk comparable to living organisms. This document binds Principal Investigators unless appealed to the Director. It prioritises safety over ontological precision, ensuring the Occupational Hygienist can follow the reasoning. We address borderline cases explicitly to prevent deliberation paralysis during our forty-minute slots.

  **The procedure**

  1.  **Substrate Check:** Is the entity composed principally of biological polymers (nucleic acids, proteins, lipids)?
      *   *Sufficiency:* Yes = Proceed. No = Return proposal (not a biological entity).
      *   *Stop Point:* If No, the proposal is returned to the investigator as out of scope.

  2.  **Replication Capacity:** Does the entity contain instructions capable of directing the production of copies of itself, either alone or within a host?
      *   *Sufficiency:* Yes = Proceed. No = Return proposal.
      *   *Stop Point:* If No, the proposal is returned.

  3.  **Latent Viability:** Is the entity metabolically inert but capable of resuming replication given standard revival conditions (e.g., hydration, temperature shift)?
      *   *Sufficiency:* Yes = Classify as Regulated Entity.
      *   *Note:* Dormancy does not negate classification. If revivable, it is treated as active for containment purposes.

  4.  **Niche Dependence:** Does the entity require specific metabolites, partners, or apparatus supplied by us or another organism to replicate?
      *   *Sufficiency:* Yes = Classify as Regulated Entity.
      *   *Note:* Do not insist on counterfactual independence. Auxotrophy or symbiosis does not exempt the entity.

  5.  **Consortium Status:** Does the proposed system replicate as a whole, even if individual components cannot replicate alone?
      *   *Sufficiency:* Yes = Classify the System as a Regulated Entity.
      *   *Note:* The unit of regulation is the self-sustaining system, not the individual strain.

  6.  **Risk and Value Judgment:** Does the mode of replication or evolution present a containment risk uncertain under previous steps?
      *   *Hand-over Point:* If facts are established but risk significance is disputed, the Occupational Hygienist decides the containment level. If the definition itself is contested, the Chair decides policy.

  **What each step is buying us**

  Steps 1 and 2 establish a baseline using a **cluster concept**. We do not look for a single 'spark of life'. Instead, we check for a family resemblance of features (material, instruction). This avoids arguing over single markers like metabolism, which viruses lack but we still regulate.

  Step 3 addresses **purpose-relativity**. Whether a seed is 'alive' philosophically matters less than whether it wakes up in our incubator. We define viability relative to our safety purpose, not cosmic truth. This is a **stipulative definition**: we decide the boundary to serve our goal of risk management.

  Steps 4 and 5 handle **borderline cases and continua**. Life is not binary; dependence and system-level organisation exist on a spectrum. By refusing to demand independence (Step 4) and recognising system-level replication (Step 5), we close loopholes where risk exists but traditional definitions fail. We treat the relational niche as part of the organism's context, not an exemption.

  **Where the procedure hands the decision to a person**

  Step 6 is the critical hand-over. Facts run out when we ask not 'does it replicate?' but 'does that replication matter for safety?'. This is a value judgment.

  *   **The Occupational Hygienist:** Decides when the physical risk of a borderline entity (e.g., evolving RNA in vesicles) warrants containment despite ambiguous biological status. Their expertise translates biological behaviour into containment requirements.
  *   **The Chair:** Decides when the proposal challenges the policy itself (e.g., reversed chirality). This ensures consistency across meetings. The Chair's decision stands unless appealed to the Director.

  This separation prevents scientists from overriding safety concerns with ontological arguments, and prevents safety officers from making policy precedents without authority.

  **Worked applications**

  **1. The Two-Strain Consortium**
  The proposal involves two engineered strains, each non-viable alone but self-sustaining together.
  *   *Steps 1–2:* Both strains are biological and carry replication instructions.
  *   *Step 4:* They are niche-dependent (on each other). The procedure dictates this does not exempt them.
  *   *Step 5:* The system replicates.
  *   *Outcome:* Regulated as a unit.
  *   *Reasoning:* The risk lies in the consortium's evolution. Classifying only the parts would miss the hazard.

  **2. The Dormant Seed and Tardigrade Archive**
  The PI proposes lower containment, arguing nothing is metabolising.
  *   *Step 1–2:* Biological material with replication instructions.
  *   *Step 3:* They are metabolically inert but revivable (latent viability).
  *   *Outcome:* Regulated at full containment.
  *   *Instinct Check:* This contradicts the PI's instinct to downgrade. You must uphold the Committee's classification. Latent viability poses a revival risk; safety requires treating them as active. Explain that 'metabolism' is not the switch; 'revivability' is.

  **3. The Self-Assembling Bio-Hybrid Device**
  Engineered tissue drives a machine assembling copies of itself from supplied parts.
  *   *Step 1:* The tissue is biological; the machine is not.
  *   *Step 2:* The tissue replicates; the machine assembles.
  *   *Step 6:* The Hygienist must decide if the mechanical self-assembly poses a biological containment risk.
  *   *Outcome:* The tissue is regulated. The machine assembly is likely excluded unless it incorporates biological material into the copies.
  *   *Reasoning:* The procedure regulates biological entities. Mechanical replication driven by biology is a hybrid risk, handled by the Hygienist's judgment in Step 6.

  **Where the procedure misfires**

  This procedure is robust for standard biotechnology but will strain against true novelties.

  **Reversed Chirality:** An organism of mirrored molecular handedness passes Step 1 (polymers) but may fail Step 2 if our assays cannot detect its replication instructions. It is a biological entity, but our tools may say 'No'. The Chair must override Step 2 based on theoretical risk, not assay results.

  **Prions and Viroids:** Prions lack nucleic acids (failing Step 1 strictly) but replicate. Viroids lack protein coats. The Committee should interpret 'biological polymers' broadly to include infectious proteins or naked RNA, or the Chair must invoke Step 6 to regulate them based on infectious behaviour rather than composition.

  **Evolving RNA in Vesicles:** If the RNA evolves but cannot make its container, Step 5 (Consortium) is tricky. Is the vesicle part of the entity? If we supply the vesicles, it is niche-dependent (Step 4). Regulate it. If we do not, it may slip through. The Hygienist should catch this in Step 6.

  These misfires occur because our definitions are grounded in Earth-standard biology. When chemistry diverges, the procedure requires human intervention to maintain the spirit of safety over the letter of the steps.

  **What the procedure cannot do**

  This procedure cannot predict long-term evolutionary trajectories. It classifies the proposal as submitted, not the organism's potential descendants. It cannot replace scientific expertise; the molecular biologists must still validate the facts feeding into Step 1 and 2. Finally, it cannot resolve ethical objections to creating life; it only addresses containment. If a member objects to the work itself, that is a matter for the Director, not this Committee. We manage risk, not morality.
