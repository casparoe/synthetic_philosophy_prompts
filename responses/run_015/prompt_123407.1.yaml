prompt: |-
  I'm mostly convinced that Bostrom's simulation argument fails, but not because of the disjunction fallacy or self-reference problems everyone repeats. My real worry is that the argument sneaks in substrate independence — the idea that consciousness just needs the right computation running, regardless of the physical substrate actually doing it. If substrate independence is false, then a posthuman civ running zillions of sims might still produce almost zero conscious sims, which breaks the anthropic step. What would actually count against this view? I want the strongest counterarguments and evidence, ranked from "this should make me drop it" to "just awkward," including whether substrate independence is actually defended well in philosophy of mind, whether empirical neuroscience points the other way, and whether the argument can be patched without that assumption. Also please seperate what's genuinely settled here from what's still fought over — I don't want a contested take on substrate independence presented like it's the consensus view. There's probably a typo or two in this message, sorry.
