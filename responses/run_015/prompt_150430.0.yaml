answer: |-
  Right, hi everyone. Can I get a quick check on the mic? Cool.

  So, welcome. Proper welcome to our friends from Poland. It's honestly brilliant to see so many faces here, even if the weather's doing its best to ruin the vibe.

  I know this week's been a bit… loud. You've probably heard about the council vote. The £2m for the skatepark instead of the flood relief abroad. I've got mates who are properly gutted about it, and I've got others who say 'look, we live here, we fix here first'. And then there's everyone in between trying to figure out what's actually fair.

  It's tricky, isn't it? Where do we draw the line on who we owe what to.

  Last week in debate club, someone called nationalism 'extended egoism'. Basically, the idea that caring about your own town is just selfishness scaled up. Like, if you care about us, you must care less about them. I get why people say that. It sounds logical. But I reckon it's a bit too cynical.

  Think about it like this. If I see my mate fall off their bike, I stop to help them. Not because I think random strangers don't matter, but because that's my mate. That relationship creates a duty. Looking after our own community, fixing our streets, building a skatepark so kids aren't hanging around causing trouble… that's not shutting the world out. It's making sure we've got a solid base to stand on. You can't really be a good friend to anyone if your own house is falling apart.

  But—and this is the important bit—having a home doesn't mean locking the door.

  Borders matter. I'm not going to stand here and pretend they don't. We do have specific responsibilities to the people who live next to us. But those borders shouldn't be walls. They should be like… the edge of a pitch. You play for your team, but you still respect the other side, and you meet in the middle for the handshake.

  That's what this twinning is. It's not charity. It's not us pretending we're better because we've got a new skatepark while you're dealing with floods, or vice versa. It's admitting that we're distinct places with our own problems, but we're choosing to deal with them together.

  To the delegates from Poland: thank you for coming. I know the news this week might've made it seem like we don't care about what happens beyond our high street. I hope this weekend proves otherwise. We want to learn from you, not just wave at you.

  And to my mates in the crowd: I know this sounds a bit like assembly. But give it a chance. We can want a better town for us *and* a better partnership with them. It's not either/or.

  So, let's enjoy the weekend. Eat too much, talk about proper stuff, and maybe show our guests where the good chips are. Because at the end of the day, looking after each other isn't about where you're from. It's about showing up.

  Thanks for listening, and welcome again. Hopefully I didnt make too many mistakes speaking off the cuff like this. Cheers.
