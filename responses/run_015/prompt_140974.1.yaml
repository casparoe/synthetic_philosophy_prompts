prompt: |-
  I work on the product governance team at a savings and investing app — around three million users, mostly people who've never invested before, and most of them on their phone at 11pm. Every proposed change to the app comes past me for a half hour review before it can ship: I write a one pager, and it has to be signed off by our head of product and by legal, neither of whom has any philosophy and both of whom will read two pages maximum. We look at four or five flows a month. The argument we keep having is whether a flow is *taking advantage* of people, and it goes in circles because everyone in the room is using a different test without noticing. I was arguing about this with a mate who did a philosophy degree and he said the thing I'm groping at is the money pump argument, so I've been reading a bit on my own and it feels exactly right but I can't get from the idea to something I can run on a Tuesday afternoon. The bit that seems to matter and that nobody here can articulate is the difference between a set of preferences that can be exploited in one go — you lay out a menu and whichever way they choose they lose — and a *sequence* of choices where each individual choice looks perfectly sensible to the person making it at the time and the damage only shows up when you add them up. Our head of product says if each step is fine then the whole thing is fine and I'm pretty sure that's the exact mistake but I can't say why in words he'd accept.

  We've drifted into four rough labels in my notes and I suspect they're doing philosophical work I haven't noticed: 'rake' (we take a fixed cut on a transaction, that's just a fee, nobody minds), 'switchback' (the flow gets someone to move back and forth between two states and pay each time), 'treadmill' (nothing cycles, but the framing keeps restarting the same decision so it gets made over and over), and 'pump' (saved for when someone ends up strictly worse off and nothing they value got produced along the way). I think 'treadmill' might actually be the interesting one rather than the boring one but I can't defend that. So: write me a decision procedure, in the order I should ask the questions, that comes out of what this literature actually says — the questions in order, what counts as a sufficient answer to each, which questions should end in a hard no, and which ones have to be handed to a human being because they're a values call dressed up as a factual one. It needs to survive being read by a lawyer and a data scientist who will both push back. There are some cases I specifically need it to handle. Our legal person's favourite test is 'would the user have agreed to the whole sequence up front?' and I don't trust it but I don't know what's wrong with it. Then there's the user who knows they'll end up slightly poorer and does the whole thing anyway because fiddling with the app is the fun part — if the process is the product, is there any money pump left? And the user whose preferences genuinely shift mid-sequence because they learned something, which feels like it should be completely fine and not exploitative at all. Also: is a hundred tiny losses the same objection as one large one, or does the smallness of each step actually matter to the argument? Our data scientist says we should just A/B test everything and look at whether users end up with less money, and I want to know why that isn't sufficient, if it isn't — partly because we can't run clean experiments on things that have already shipped. And one thing that genuinely bugs me: if these flows really were exploiting an incoherence in someone's preferences, wouldn't we expect some users to just bleed out completely? They don't. So is the whole idea secretly unfalsifiable, or does that tell us something about which version of the argument to use?

  Run it on three flows. First: a streak feature where if you'd miss a week you can pay two quid to freeze your streak, and the freeze button appears about four seconds after the missed week and nowhere else. Second: a switchback where users get a notification when markets fall nudging them into the safe pot and one when markets rise nudging them into the growth pot, fifty pence a swap, and the nudge copy is written to match whatever they said they wanted in onboarding. Third, and this is the one I actually need: boost tokens, where each month you get three free boosts that lift the rate on one of your pots for thirty days, you have to activate them by hand, they expire at month end, and the pot that's boosted rotates each month so people keep shuffling balances between pots — we shipped it eight months ago, it's our most used feature, engagement went up a lot, users say in the reviews that they enjoy it, and it's in our current marketing. If your procedure says we should pull it, say that plainly and tell me what I'd have to argue to the committee to keep it anyway, and be honest about whether your procedure can say anything useful about a feature that's already live and that we can't cleanly experiment on now.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User and Context:**
      *   **Role:** Product Governance Team at a savings/investing app (3M users, novice investors, mobile-first, late-night usage).
      *   **Task:** Review proposed changes (one-pager, 30 mins, sign-off by Head of Product & Legal).
      *   **Problem:** Endless circular arguments about whether a flow is "taking advantage" of users. Different mental models/tests being used implicitly.
      *   **Key Insight:** The user has identified the "Money Pump" argument from philosophy/economics (intransitive preferences leading to exploitation via sequences of choices).
      *   **Specific Tension:** Head of Product (HoP) argues "If each step is rational, the whole is rational." User suspects this is the core error (fallacy of composition regarding rationality).
      *   **Legal's Test:** "Would the user have agreed to the whole sequence up front?" (User distrusts this).
      *   **Data Scientist's Test:** "A/B test for net loss." (User suspects this is insufficient).
      *   **Edge Cases to Handle:**
          *   Users who enjoy the fiddling (process = product).
          *   Users whose preferences shift due to learning.
          *   Aggregation of small losses vs. one large loss.
          *   Why don't users "bleed out" completely if exploited? (Falsifiability).
      *   **Deliverable:** A decision procedure (ordered questions, pass/fail criteria, human judgment flags) that survives scrutiny from Legal and Data.
      *   **Application:** Run the procedure on three specific flows (Streak Freeze, Market Switchback, Boost Tokens).
      *   **Constraint:** Needs to be readable by HoP and Legal (max 2 pages equivalent logic, clear language).

  2.  **Analyze the Philosophical Core (Money Pump & Exploitation):**
      *   *Money Pump Argument:* If preferences are intransitive (A > B, B > C, C > A), an agent can be pumped indefinitely (A -> B -> C -> A) paying a fee each time, ending up with A but less money.
      *   *The HoP's Error:* Local rationality does not guarantee global rationality. A sequence of locally optimal choices can lead to a globally suboptimal outcome if the *structure* of the choice architecture manipulates the *context* of the preference.
      *   *Legal's Test Flaw:* "Ex-ante consent" fails because users suffer from *projection bias* (they can't predict future states) or *bounded rationality* (they can't compute the sequence). It assumes a unified self across time, which behavioral econ shows is false.
      *   *Data Scientist's Test Flaw:* "Net loss" ignores *value creation*. If I pay fees but learn something or enjoy the gamification, I'm not exploited. Also, A/B testing can't detect long-term erosion of trust or subtle preference manipulation.
      *   *The "Bleed Out" Objection:* Users don't bleed out because of *friction*, *saturation* (they run out of money), or *learning* (they figure it out). It doesn't mean exploitation isn't happening; it means it's bounded.
      *   *Small vs. Large Losses:* Yes, it matters. "Shrouded attributes" and transaction costs. Many small losses hide the total cost (mental accounting).

  3.  **Drafting the Decision Procedure (The "Exploitation Audit"):**
      *   *Goal:* Translate philosophical concepts into product questions.
      *   *Structure:* Funnel approach. Start with hard facts, move to behavioral dynamics, end with value judgment.
      *   *Terminology:* Use the user's labels (Rake, Switchback, Treadmill, Pump) but define them rigorously.
      *   *Step 1: The Value Check (Is value created?).* Distinguish between 'Rake' (fee for service) and 'Pump' (fee for nothing).
      *   *Step 2: The Reversibility/Cycle Check (Is it a Switchback/Treadmill?).* Are we inducing cycles?
      *   *Step 3: The Consent/Counterfactual Check (Legal's test, refined).* Would they choose the *path* or just the *outcome*?
      *   *Step 4: The Friction/Timing Check.* Is the friction placed to help or hinder?
      *   *Step 5: The Aggregation Check.* Do small losses hide a big loss?

  4.  **Refining the Procedure for the Audience:**
      *   *Legal:* Needs to see "Informed Consent" and "Fiduciary Duty" language.
      *   *HoP:* Needs to see "Retention," "LTV," and "Trust" language.
      *   *Data:* Needs to see "Metrics," "Cohorts," and "Counterfactuals."
      *   *Constraint:* Keep it tight. 5 questions max.

  5.  **Addressing the Specific Edge Cases:**
      *   *Process as Product:* If the "fiddling" is the value, fees are entertainment costs, not exploitation. Need to verify *enjoyment* vs. *anxiety*.
      *   *Preference Shift:* If they learn, the cycle is broken. The endpoint is different (better informed) than the start point.
      *   *Bleed Out:* Exploitation is bounded by user resources and friction. Absence of bankruptcy doesn't prove absence of exploitation.

  6.  **Running the Procedure on the Three Flows:**

      *   *Flow 1: Streak Freeze.*
          *   Cycle? No (linear progression).
          *   Value? Psychological continuity.
          *   Timing? 4 seconds after fail (high pressure).
          *   Verdict: Borderline "Treadmill." Exploits loss aversion.
      *   *Flow 2: Market Switchback.*
          *   Cycle? Yes (Safe <-> Growth).
          *   Value? Timing the market (generally negative value for novices).
          *   Consent? They agreed to "long term" in onboarding, but nudges push short term.
          *   Verdict: Classic "Money Pump/Switchback." High risk.
      *   *Flow 3: Boost Tokens (The Hard One).*
          *   Cycle? Yes (shuffling balances).
          *   Value? Higher rate (good) vs. Shuffling effort (cost).
          *   Expiration? Artificial scarcity.
          *   Engagement: High. Users say they enjoy it.
          *   Verdict: This is the "Process as Product" case. *However*, the rotation forces shuffling. If the rotation is random/external, it's a game. If it's designed to maximize float/fees elsewhere, it's a pump.
          *   *Crucial distinction:* Does the shuffling *create* value (higher rate) or just *move* value? If the rate is the same as a static pot, it's a pump. If the rate is *higher* than a static pot, it's a reward for engagement.
          *   *Wait, re-reading the prompt:* "lift the rate on one of your pots... pot that's boosted rotates each month so people keep shuffling balances."
          *   *Risk:* Users chase the boost, moving money constantly. If the boost is *only* available by moving, and moving incurs opportunity cost (time out of market) or fees (not mentioned, but maybe hidden), it's a treadmill.
          *   *Prompt says:* "Engagement went up... users enjoy it."
          *   *My analysis:* This looks like a "Gamified Treadmill." It passes the "Enjoyment" test but fails the "Necessity" test. Is the shuffling *required* to get the benefit? Yes. Is the benefit worth the cognitive load? For novices, maybe not.
          *   *Decision:* It likely passes *if* the rate lift is genuine and net-positive. It fails if the shuffling causes users to miss market gains (cash drag).

  7.  **Synthesizing the Output:**
      *   *Tone:* Professional, direct, philosophical but operationalized.
      *   *Structure:*
          1.  The Framework (The 5-Question Audit).
          2.  The Logic (Why this works against Legal/Data/HoP).
          3.  The Application (The 3 Flows).
          4.  The "Boost" Verdict (The specific advice).
      *   *Addressing the "Bleed Out" question:* Explain bounded rationality and friction.
      *   *Addressing the "Small Losses":* Explain mental accounting and salience.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the "Pass/Fail" criteria binary where possible.
      *   *Critique:* Legal will hate the "Value" question.
      *   *Fix:* Frame it as "Net Benefit Disclosure."
      *   *Critique:* The Boost Token analysis needs to be nuanced. It's already live.
      *   *Fix:* Acknowledge the "Sunk Cost/Status Quo" bias in keeping it. Provide the argument *for* keeping it (Gamification as Retention) vs. *against* it (Cognitive Load).
      *   *Philosophical Check:* Ensure the distinction between *intransitive preferences* (the pump) and *changing preferences* (learning) is clear. The key is whether the change is *endogenous* (caused by the app's framing) or *exogenous* (caused by new info).

  9.  **Final Polish:** Check against the "2 pages max" constraint for the actual one-pager logic, though my response here can be more detailed to explain the *why*. I will structure the response so the user can copy/paste the "Decision Procedure" section into their one-pager.

      *(Self-Correction on the Boost Token Flow)*: The prompt says "pot that's boosted rotates each month so people keep shuffling balances." This implies the *app* rotates which pot gets the boost, forcing the user to move money to chase it. This is a "Treadmill." The user is working for the rate. Is the rate high enough to compensate for the effort/risk? If the user enjoys it, it's "Play." If they feel they *must* do it to not lose out, it's "Exploitation." I need to be careful here. The prompt says "users say in reviews that they enjoy it." This leans towards "Process is Product." But the governance risk is the *compulsion*. I will flag this as the critical human judgment call.

      *(Refining the "Bleed Out" answer)*: Users don't bleed out because of *stopping rules* (running out of money, getting angry, spouse intervenes). Also, exploitation doesn't require bankruptcy, just sub-optimization.

      *(Refining Legal's Test)*: The flaw is "System 1 vs System 2." They agreed with System 2 (onboarding), but the flow targets System 1 (11pm phone).

      *(Refining Data's Test)*: A/B testing measures *what happened*, not *what would have happened without the manipulation*. You need a "dark pattern" control which is ethically hard.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed to fit your constraints (readable by Legal/HoP, grounded in the money pump literature, operationalized for a Tuesday afternoon). Following that, I have run it against your three flows.

  ### The Exploitation Audit (Decision Procedure)

  **Purpose:** To distinguish between *value creation* (fees for service), *gamification* (fees for fun), and *extraction* (fees for incoherence).
  **Format:** 5 Questions. Answer sequentially. If you hit a **HARD NO**, the flow cannot ship without redesign. If you hit a **VALUES CALL**, it requires explicit sign-off from the Head of Product acknowledging the risk.

  #### Q1: The Net Value Test (The "Rake" Check)
  *Does the user end the sequence with more objective value (money/learning/security) than they started, minus fees?*
  *   **Pass:** Yes. The fee buys a service, a guaranteed rate lift, or verified learning.
  *   **Fail:** No. The user pays fees/losses and ends in the same state they started (e.g., moved money from A to B and back to A, paying twice).
  *   **Why:** This isolates the **Money Pump**. If the cycle produces no value, the fees are pure extraction of preference incoherence.
  *   **Legal Note:** This satisfies "Fair Value."
  *   **Data Note:** This requires a counterfactual model (what if they did nothing?), not just an A/B test.

  #### Q2: The Ex-Ante Consent Test (Refining Legal's Question)
  *If the user knew the **exact sequence of choices** they would face (not just the outcome), would they still opt in?*
  *   **Pass:** Yes. A reasonable user would agree to the *path*, not just the destination.
  *   **Fail:** No. They want the result, but would reject the friction/steps required to get it.
  *   **Why:** Legal's current test ("Would they agree to the outcome?") fails because it ignores **transaction costs**. Exploitation often hides in the *path*, not the *destination*.
  *   **Values Call:** If users say they enjoy the path (gamification), this passes, *provided* Q4 is also passed.

  #### Q3: The Framing Dependency Test (The "Treadmill" Check)
  *Does the decision rely on a temporary state (urgency, scarcity, emotion) that the app itself created or amplified?*
  *   **Pass:** No. The decision holds up under neutral framing (e.g., "You can invest now" vs. "Market crashing!").
  *   **Fail:** Yes. The choice only happens because of the specific timing/copy (e.g., "4 seconds to freeze or lose").
  *   **Why:** This identifies **preference manipulation**. If the preference only exists because you turned on the "siren," you are renting their anxiety, not serving their goals.
  *   **Hard No:** If the flow relies on induced urgency for a non-urgent decision.

  #### Q4: The Aggregation Test (The "Death by Cuts" Check)
  *If this action were repeated 100 times, would the cumulative cost become salient and unacceptable?*
  *   **Pass:** No. 100x the fee is still reasonable for 100x the value.
  *   **Fail:** Yes. One fee is invisible; 100 fees are a scandal.
  *   **Why:** This addresses **mental accounting**. Small losses are processed as "noise," large losses as "signal." Exploitation thrives in the noise.
  *   **Hard No:** If the cumulative cost exceeds 5% of user gains (or a threshold you set).

  #### Q5: The Exit Friction Test (The "Bleed Out" Check)
  *Is it easier to stay in the loop than to leave it?*
  *   **Pass:** No. Exiting is as easy as entering.
  *   **Fail:** Yes. The flow makes entry frictionless but exit requires navigation/calls/waiting.
  *   **Why:** If users don't "bleed out," it's often because exit friction traps them, not because they are satisfied. This answers your falsifiability worry: **Trapped users look like engaged users.**

  ---

  ### Why This Works (For Your Arguments)

  1.  **Against the Head of Product:** You can now articulate why "Each step is rational" is wrong. Use **Q1**. If Step A → B is rational, and B → C is rational, but C → A is rational *only because you hid the cost*, the sequence is irrational. The "Money Pump" isn't about one bad choice; it's about a **cycle without value creation**.
  2.  **Against Legal:** Their test ("Would they agree up front?") assumes a **Unified Self**. Behavioral econ proves we have a "Planner Self" (onboarding) and a "Doer Self" (11pm on phone). **Q2** forces them to ask if the *Doer* was tricked, not just if the *Planner* signed up.
  3.  **Against Data:** A/B testing measures *revealed preference* (what they did), not *welfare* (what was good for them). **Q1** and **Q4** force a welfare calculation. If users engage more but end up poorer (net of fees), the metric is vanity, not value.
  4.  **On "Bleeding Out":** Users don't bleed out because of **friction** and **saturation**, not because the pump is safe. **Q5** checks for the trapdoor. If exit is hard, the lack of bankruptcy is proof of confinement, not satisfaction.
  5.  **On Small Losses:** **Q4** explicitly handles this. A hundred tiny losses exploit the brain's inability to sum small numbers. If the sum is unacceptable, the parts are unethical, even if individually "tiny."

  ---

  ### Running the Audit on Your Flows

  #### Flow 1: Streak Freeze (£2, 4-second window)
  *   **Q1 (Net Value):** **Fail/Borderline.** Value is psychological (streak), not financial. Is the streak worth £2? Debatable.
  *   **Q2 (Consent):** **Fail.** Users agreed to "save regularly," not "pay penalty fees to maintain a gamified counter."
  *   **Q3 (Framing):** **Hard No.** The 4-second window is **induced urgency**. The miss happened; the urgency to fix it is manufactured by hiding the button elsewhere.
  *   **Q4 (Aggregation):** **Fail.** Missing 4 weeks = £8. On a savings app, this is a high % of yield.
  *   **Q5 (Exit):** **Pass.** They can just let the streak die.
  *   **Verdict:** **Do Not Ship.** This is a **Treadmill**. It monetizes loss aversion using artificial scarcity (the timer). It fails Q3 specifically.
  *   **Fix:** Remove the timer. Let them freeze the streak anytime within 24 hours.

  #### Flow 2: Market Switchback (Nudges to swap, 50p/swap)
  *   **Q1 (Net Value):** **Hard No.** For novice investors, frequent swapping based on market noise usually destroys value (buying high, selling low). The app is charging them to lose money.
  *   **Q2 (Consent):** **Fail.** Onboarding said "long term growth." This flow encourages short-term timing.
  *   **Q3 (Framing):** **Hard No.** Nudges match "what they said they wanted" but exploit the gap between *intent* (long term) and *impulse* (react to red arrow).
  *   **Q4 (Aggregation):** **Fail.** 50p x 20 swaps = £10. Plus market timing losses.
  *   **Q5 (Exit):** **Pass.** They can turn off notifications.
  *   **Verdict:** **Pull Immediately.** This is a classic **Money Pump**. It creates a cycle (Safe ↔ Growth) where the user pays to return to a state of higher risk/lower stability, likely reducing net worth. It violates fiduciary intuition.

  #### Flow 3: Boost Tokens (The Live Feature)
  *   **Q1 (Net Value):** **Pass (Conditional).** If the boosted rate is genuinely higher than the standard rate, value is created. *However*, if the shuffling causes "cash drag" (money out of market while moving), value is destroyed.
  *   **Q2 (Consent):** **Values Call.** Users say they enjoy it. This passes the "Process as Product" test. *But*, do they enjoy it because it's fun, or because they feel compelled to chase the rate?
  *   **Q3 (Framing):** **Borderline.** The rotation is external (app decides), forcing the user to react. This is a **Treadmill**. Is the rotation necessary? Or could they just pick a pot and boost it?
  *   **Q4 (Aggregation):** **Pass.** No fees mentioned. The cost is cognitive load/time.
  *   **Q5 (Exit):** **Fail (Potential).** If the "free" boosts expire, does the UI make it hard to see the standard rate? If the standard rate is hidden, exit friction is high.
  *   **Verdict:** **Keep, but Modify.**
      *   **Why:** It passes Q1 (assuming rate lift > opportunity cost) and Q2 (users report enjoyment). It is a **Gamified Treadmill**, which is permissible if the "game" is transparent.
      *   **The Risk:** It relies on **Q3**. If the rotation forces shuffling that *doesn't* increase yield (e.g., moving money between two pots with the same base rate just to apply a token), it is pure friction.
      *   **The Argument to Committee:** "This feature is a 'Boost Token' not a 'Shuffle Requirement.' We must ensure the shuffling is optional, not mandatory to access the base rate. If users feel they *must* play to get a fair rate, it becomes a Pump."

  ### Addressing Your Specific Doubts

  **1. "Would the user have agreed up front?" (Legal's Test)**
  *   **What's wrong:** It assumes **Time-Consistent Preferences**. It ignores that the user at 11pm on a phone is a different agent than the user at 9am on a laptop.
  *   **The Fix:** Use **Q2**. Ask: "Would they agree to the *friction*?" Most exploitation hides in the friction, not the goal.

  **2. "Process as Product" (The Fiddler)**
  *   **The Test:** **Q1 & Q2.** If they are paying (in fees or time) and say they are happier, it is entertainment, not exploitation.
  *   **The Catch:** Ensure they *can stop*. If they want to stop fiddling but the app makes it hard to get the "standard" service without fiddling, it's coercion.

  **3. "Preference Shifts due to Learning"**
  *   **The Distinction:** Learning changes the *endpoint* (I know more now). A Money Pump returns you to the *start point* (I have the same asset, less cash).
  *   **The Test:** **Q1.** Did the cycle produce new information or value? If yes, it's education. If no, it's a pump.

  **4. "Why don't they bleed out?" (Falsifiability)**
  *   **Answer:** **Q5 (Exit Friction).** Also, **Bounded Resources**. Users stop when they run out of cash or get angry. The absence of bankruptcy does not prove the absence of harm. Sub-optimization (earning 1% less than you could) is the real harm, not bankruptcy.

  **5. "Small Losses vs. Large Loss"**
  *   **Answer:** **Q4.** Small losses exploit **Salience**. A £50 fee is seen; a 50p fee is ignored. Ethical design requires costs to be as salient as benefits. If you rely on the cost being too small to notice, you are designing for inattention.

  ### Final Advice on the Boost Tokens (The Live Feature)

  Your procedure says **Keep**, but with a warning label.
  *   **The Defense:** "This is gamification that increases yield. Users report enjoyment (Q2). Net value is positive (Q1)."
  *   **The Concession:** "We must monitor for 'Compulsion.' If support tickets show users feel *forced* to shuffle to get a fair rate, we decouple the token from the shuffle. The token should boost the *pot*, not require the *movement*."
  *   **The Data Ask:** Don't A/B test removal (unethical to remove value). Instead, cohort analyze: Do users who *ignore* the tokens get the same base rate? If the base rate is degraded to force token use, that is a **Pump**. If the base rate is fair and tokens are a bonus, it is a **Reward**.

  This procedure gives you the vocabulary to stop the circular argument. It moves the debate from "Is this mean?" to "Does this cycle create value, or just friction?" That is a question Legal and Data can answer.
