  2.  **Deconstruct the Philosophical Positions:**
      *   **Lewis (CT):** Worlds are concrete, isolated. No object exists in more than one world. Modality is analyzed via counterparts (similarity relations). Essential properties are those held by all counterparts. Origin essentialism is contingent on the counterpart relation chosen (contextual).
      *   **Kripke/Plantinga (TWI):** Worlds are abstract states of affairs. Objects exist in multiple worlds (transworld identity). Modality is primitive or grounded in essence. Essential properties are intrinsic to the object's identity. Origin essentialism is usually strict (Kripke's origin thesis).

  3.  **Drafting Section 1: Agreed Claims:**
