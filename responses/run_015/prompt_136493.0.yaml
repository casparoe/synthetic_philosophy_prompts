answer: |-
  **Session Plan: The Mismatch Problem in Health and Disease**

  **Confidence Level:** 85%
  **Point of Least Certainty:** I am least sure whether introducing "selected effect" function via evolutionary mismatch within the first 15 minutes will overload clinically literate students who are unused to teleological reasoning in biology. There is a risk they will conflate "evolutionary purpose" with "conscious design," which muddies the naturalist claim to objectivity.

  ### 1. The Concept to Secure First: Biological Function (Not Statistics)
  Do not begin with definitions of health. Begin by securing **Biological Function as Selected Effect**.
  If students equate "natural" with "statistically average," Naturalism collapses into a numbers game (e.g., if everyone has hypertension, is it healthy?). If they equate "normative" with "opinion," Normativism collapses into relativism.
  You must establish that **biology has goals without a golfer**. A heart's function is not what it *does* (pump blood), but what it was *selected to do* (circulate oxygen for survival/reproduction). This distinction is the only thing that prevents Naturalism from being a word game about averages. Secure this by minute 10.

  ### 2. The Carrying Example: Evolutionary Mismatch Pair
  **The Pair:** Sickle-cell trait (in a non-malarial environment) **versus** Age-related presbyopia.
  **The Setup:** Present these not as two diseases, but as two biological states challenging the definition of disease.

  *   **What it must show:**
      1.  **Sickle-cell (Migration Context):** A patient moves from a malarial region to the US. Their genotype is unchanged. In the origin context, the trait had a survival function (heterozygote advantage). In the new context, it is purely a liability. This shows **biological constancy does not guarantee functional constancy**. Naturalism must account for environment, not just internal physiology.
      2.  **Presbyopia:** The lens hardens. This is statistically universal (normal) and evolutionarily expected (aging). Yet, it reduces functional capacity. This shows **statistical normality does not guarantee functional health**.
  *   **What it must avoid:**
      1.  Do not discuss treatment costs or insurance coverage.
      2.  Do not allow the discussion to drift into "quality of life" metrics. Keep the focus on whether the *state itself* counts as disease prior to social intervention.

  ### 3. The Explanatory Arc (50 Minutes)

  **0:00–0:05 | The Hook: The Conceptual Twist**
  Introduce the session with the claim: "Biology is not static, and Statistics are not Truth." State that we will use evolutionary mismatch to prove that a biological state can be 'functional' in one decade of a life and 'dysfunctional' in the next, without the DNA changing. This prevents students from treating Naturalism as a fixed biological fact.

  **0:05–0:15 | Securing the Anchor (Function)**
  Define **Selected Effect Function**. Use a quick analogy: A heart murmur is a sound (causal role), but not a function. Pumping blood is the function.
  *   *Interception Point 1 (Minute 10):* If a student says, "But high blood pressure is common now, so it's natural," correct them immediately. "Common" is statistical. "Natural" in this context means "serving the selected goal of survival." Intercept the **Naturalism = Statistical Normality** misconception here.

  **0:15–0:30 | The Mismatch Pair Application**
  Walk through the Sickle-cell/Presbyopia pair.
  *   *Sickle-cell:* Ask, "Did the biology change when the plane landed in New York?" (No). "Did the disease status change?" (Yes, functionally). This forces Naturalism to admit environmental context is part of the 'natural' fact.
  *   *Presbyopia:* Ask, "Everyone goes blind at 60. Is it a disease?" If Naturalism says "Yes" (dysfunction), it medicalizes aging. If "No" (normal), it admits dysfunction isn't enough for disease.
  *   *Interception Point 2 (Minute 25):* Students will argue, "Presbyopia is only a problem because we value reading." This leads to **Normativism = Subjective Preference**. Intercept this by distinguishing *harm* from *preference*. Normativism argues for *objective harm* relative to goals, not mere whim. "You cannot read" is a fact; "Reading is required for your livelihood" is the norm. Both are needed for 'disease.'

  **0:30–0:40 | Mapping the Dependency**
  Show that neither view stands alone.
  *   Naturalism provides the **constraint** (you can't normativize a broken leg into a healthy leg).
  *   Normativism provides the **significance** (a broken leg is only a disease because it impedes goals).
  *   *Interception Point 3 (Minute 35):* Intercept the **Mutual Exclusivity** misconception. Students will want to pick a team. Force them to see that Clinical Practice requires Naturalist diagnosis *and* Normativist triage.

  **0:40–0:45 | Synthesis**
  Summarize that evolutionary mismatch reveals the "Natural" is context-dependent, and the "Normative" is not merely subjective. The definition of disease sits in the friction between biological capacity and environmental demand.

  **0:45–0:50 | The Closing Question**
  Do not ask them to define the terms. Ask this:

  > *"In the case of the migrant with sickle-cell trait: If the biological mechanism is identical in Ghana and Ohio, but the disease status changes, does the biology **determine** the disease, or does it merely **license** the classification?"*

  *   **Why this works:** If they answer "determine," they missed the environmental/normative context (Naturalist reductionism). If they answer "license," they grasp that biology sets the boundary conditions, but the "disease" label depends on the interaction with the environment (Dependency Structure).

  ### 4. Scope Refusals (State Openly)
  To keep this within 50 minutes, explicitly refuse to cover:
  1.  **Full Dysfunction Taxonomies:** We will not debate Boorse's Biostatistical Theory vs. Wakefield's Harmful Dysfunction in detail. We are using the *logic* of the debate, not the history.
  2.  **Specific Nosology:** We will not discuss whether specific conditions (e.g., obesity, grief) are currently classified correctly in the DSM or ICD. That is a policy debate, not a conceptual one.
  3.  **Historical Lineage:** We will not trace the history of the term "pathology" from Greek to modernity.

  ### 5. Instructor Note on Risk
  Be prepared to pivot if the evolutionary framing confuses the boundary. If students start arguing that "evolution wants us to survive," you have lost the room. Re-center immediately on **mechanism**: "It is not about what evolution wants; it is about what the mechanism was built to do." If the evolutionary explanation muddies the water, retreat to the simpler distinction: **Mechanism vs. Meaning**. The biological mechanism is the Naturalist anchor; the meaning of that mechanism for the life of the patient is the Normativist anchor.
