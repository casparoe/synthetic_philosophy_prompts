          *   (a) is the deontological constraint (Rights/Boundaries).
          *   *Crucial Point:* (c) is the deepest, but an aggregator can concede it. (b) is the real normative engine.
      *   **Section 2: The Split-Consciousness Case.**
          *   Apply (a), (b), (c).
          *   Show that this case reveals the objection is about *phenomenal standpoints*, not biological organisms.
          *   This supports (c) and (b) over a crude biological reading.
      *   **Section 3: The Prudential/Time Problem (20s vs. 70s).**
