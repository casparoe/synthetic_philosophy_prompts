answer: |-
  Here is a case study from the microdomain of **vintage leaf-shutter camera repair**. It mirrors the Moog filter problem almost exactly: a physical specification degrades into a qualitative "vibe" through iterative copying, until experts are arguing about whether a camera is "authentic" or "broken" based on which version of the definition they inherited.

  ### The Concept: "Cock-Return Torque"

  In a classic mechanical leaf shutter (like those found in a 1950s Compur or Prontor), the blades must snap open and closed instantly when triggered. To do this, a tiny spring stores energy when you "cock" the shutter. The tension of that spring is critical: too loose, and the blades drag (blurry photos); too tight, and the metal fatigues or the mechanism jams.

  In the 1950s, the factory service manual defined the correct tension as **"Cock-Return Torque."**

  ### The Copycat Drift

  Here is how the ontology of "Cock-Return Torque" mutated over four generations of documentation:

  1.  **Generation 1 (The Factory Spec, 1954):**
      The original German manual specifies a measurable physical force.
      *   *Definition:* "Adjust mainspring until resistance at cocking lever is **45 grams**."
      *   *Ontology:* Objective. Measurable with a spring scale.

  2.  **Generation 2 (The Photocopy, 1978):**
      A US distributor reprints the manual for local technicians. The photocopy is slightly high-contrast. The number "45" is clear, but the unit "grams" is smudged near the edge of the page.
      *   *Definition:* "Adjust mainspring until resistance at cocking lever is **45 units**."
      *   *Mutation:* The unit of measurement is lost. Technicians assume "units" refers to the arbitrary tick-marks on their specific tension tool, which don't align perfectly with grams.

  3.  **Generation 3 (The Community Guide, 1995):**
      A well-known repair shop publishes a mimeographed "Best Practices" booklet based on their experience with the 1978 manual. They notice that 45 "tool units" feels stiffer than expected, likely because their tools were calibrated differently. They decide the *feeling* is more important than the number.
      *   *Definition:* "Adjust mainspring until resistance is **firm but not binding**."
      *   *Mutation:* The number is dropped entirely in favor of a tactile description. "Firm" becomes the new standard.

  4.  **Generation 4 (The Forum Consensus, 2010s):**
      Online communities digitize the 1995 booklet. In a thread about "restoring authentic shutter feel," users debate what "firm" means. A senior member argues that "firm" implies a specific auditory click when the lever locks.
      *   *Definition:* "Adjust mainspring until you hear a **positive snap**."
      *   *Mutation:* The metric shifts from *force* (grams) to *sound* (snap).

  ### Where the Identification Breaks Down

  Now, imagine a restorer in 2024 finds a pristine 1954 shutter. They measure the spring tension with a modern digital scale.

  *   **Measurement:** It reads exactly **45 grams**.
  *   **Performance:** It fires perfectly.
  *   **The Problem:** It does *not* make the "positive snap" sound described in the 2010s consensus. The original 1954 design was silent; the "snap" was introduced in a 1960s revision of the mechanism that the 1978 manual accidentally conflated with the 1954 spec.

  **The Ontological Mess:**
  *   **Purist A (Measurement):** "This is authentic. It matches the 45g factory spec."
  *   **Purist B (The Drift):** "This is broken. It lacks the 'positive snap' required for proper Cock-Return Torque. It will fail in the field."
  *   **Purist C (The Hybrid):** "It's authentic but 'tired.' You need to tighten it to 55 grams to get the snap back."

  ### The "Copycat" Mechanism

  The drift happened because the *medium* of the instruction changed the *message*:
  1.  **Smudging:** Physical degradation of the text removed the unit of measurement.
  2.  **Tool Variance:** Different technicians used different tools to measure "units," introducing noise.
  3.  **Subjective Translation:** To resolve the noise, experts translated the number into a feeling ("firm"), which is uncalibrated.
  4.  **Feature Creep:** A secondary characteristic (the sound of the lock) was mistaken for the primary characteristic (the tension).

  ### Why It Matters

  Just like your Moog capacitor, the "real thing" is no longer defined by its original physical state, but by the *current consensus of the bubble*.

  If you repair the shutter to the original 45g spec, you are technically correct but culturally wrong. You will be accused of not knowing how to "properly" tune the shutter. If you tighten it to get the "snap," you are culturally correct but historically wrong, and you risk fatiguing the 70-year-old metal faster.

  The concept of "Cock-Return Torque" has rotted. It no longer refers to a specific tension; it refers to **agreement with the most recent iteration of the manual.** The "authentic" shutter is whichever one sounds like the story the experts tell themselves.
