answer: |-
  **Brainstorming and Initial Assessment**

  Four candidate accounts present themselves. (a) The **Continuity View** grounds authority in personal identity; the later patient is the earlier signer, so self-binding is coherent. (b) The **Will-Based View** treats the directive as a standing act of agency, akin to a promise or trust, surviving the loss of capacity. (c) The **Side-Constraint View** posits that competence grants jurisdiction to set negative boundaries on bodily interference that persist until revoked by competence. (d) The **Instrumental View** justifies the practice via social utility, reducing conflict and predicting wishes.

  I initially find the **Side-Constraint View** most attractive. It best explains the asymmetry between refusal and request: I have jurisdiction to forbid touching my body, but not to command medical resources. It also handles the timing: jurisdiction locks when the capacity to revoke it vanishes. However, a difficult feature for this view is the "Hard Case" of dementia. If the side-constraint protects bodily integrity, why does it override the present welfare of a contented patient who no longer holds the values that generated the constraint? If the patient is genuinely happy, the harm seems to be solely to the past self's integrity, which suggests the view collapses into the Will-Based account or requires a robust identity claim I am hesitant to endorse.

  **Reconstruction of the Implicit Theory**

  The practice presupposes a hybrid theory, but its core engine is the **Side-Constraint View** anchored in a **Threshold Conception of Agency**. On this reconstruction, competence is not merely a capacity for choice but a jurisdictional status. When competent, an individual acts as the moral trustee of their organism. They possess the authority to set boundary conditions on how that organism may be treated medically. This authority is not derived from the persistence of a specific psychological identity, but from the moral priority of bodily integrity and the risk of harm from unwanted intervention.

  Adjudicating the four families: The practice strictly presupposes the **Side-Constraint View**. It rules out the pure **Instrumental View**, because the practice honors directives even when following them clearly increases family conflict or contradicts what clinicians predict the patient would now want if asked. It fits comfortably with the **Will-Based View**, but only as a secondary mechanism; the "will" is binding not because promises bind across time, but because the competent self had the jurisdiction to set the terms. Regarding **Continuity**, the practice does not require a psychological-continuity account of identity. A biological or animalist account licenses the practice just as well, provided the organism is the same entity. The practice is consistent with the view that the demented patient is numerically the same organism but psychologically distinct from the signer; the authority attaches to the organism's history of competent management, not the current psychological state. However, if the discontinuity is total (e.g., permanent vegetative state), the practice still holds, suggesting identity is not the primary driver—jurisdiction is.

  **Testing the Four Features**

  The **Answerability Condition** (binding only when unrevisable) tells strongly against a pure Will-Based view. In standard promising, authority weakens if the promisee cannot hold the promisor to account. Here, authority strengthens precisely when the "promisor" cannot be questioned. This fits the Side-Constraint View: the constraint is designed to protect the subject when they can no longer protect themselves. The lock engages at incapacity because that is when the risk of unauthorized interference peaks.

  The **Refusal/Request Asymmetry** tells against the Will-Based View. A will that can only say "no" is not a full exercise of autonomy; it is a shield. If the practice were purely about honoring the earlier self's agency, positive requests (e.g., "keep me alive at all costs") should bind clinicians equally. That they do not suggests the practice is not about fulfilling the earlier self's desires, but about respecting the earlier self's veto on bodily intrusion. The earlier self governs the boundary of the body, not the allocation of medical resources.

  The **Hard Case** (dementia) reveals a tension. If the later self is content, overriding them harms their present welfare to satisfy a past jurisdiction. The Side-Constraint View handles this by prioritizing the right against interference over the claim to welfare. However, the **Psychiatric Variant** complicates this. In psychiatric advance directives, the later refusal is discounted because it is deemed the product of impairment (epistemic defect). In dementia, the refusal is discounted even if the patient appears competent enough to express joy (jurisdictional defect). This suggests the practice is not one thing: in psychiatry, we restore the competent self; in dementia, we enforce the past competent self's jurisdiction over the organism. The practice conflates protecting the person from their illness with protecting the organism from the past self's rules.

  **Probes and Implications**

  Consider the **Escalator Clause** (disregarding later objections as evidence of impairment). My reconstruction forbids this. The Side-Constraint View relies on the threshold of competence to set the jurisdiction. If the earlier self can stipulate that any future objection is invalid, they effectively eliminate the threshold, claiming jurisdiction over a future self they cannot know. This undermines the condition that makes the directive valid: that it was set by a competent agent who could not foresee remaining competent. Allowing such clauses converts the directive from a protective shield into a tool of tyranny by the past self, violating the requirement that jurisdiction lapses if competence returns (a dependence on general legal principles regarding capacity).

  Consider the **Reaffirmation Requirement** (structured encounter with the condition). The theory makes this optional but highly coherent. Since the authority rests on the competent self's judgment, ensuring that judgment is informed strengthens the jurisdictional claim. The practice as it stands looks potentially unjustified if signers systematically misimagine the condition, as the jurisdiction was exercised based on false premises. However, the theory does not make it mandatory, because the right to set boundaries exists even if based on imperfect information, provided it is voluntary.

  **Conclusion: The Welfare Shift**

  If we replaced the presupposed view with one where authority tracks **present welfare**, clinical practice would change drastically. Advance directives in dementia cases would become advisory rather than binding. Clinicians would weigh the past instruction against the current patient's apparent contentment. If the demented patient is happy, the directive to withhold treatment would be voided, as the moral weight would shift to the existing subject's welfare rather than the past subject's jurisdiction. The asymmetry might vanish, as both refusals and requests would be judged by current benefit. Ultimately, the practice would cease to be about the authority of the earlier self and become about the best interests of the current patient, with the earlier self's words serving only as evidence of what might constitute those interests. This would resolve the Hard Case but dissolve the specific authority structure that currently defines the practice.
