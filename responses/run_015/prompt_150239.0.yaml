prompt: |-
  hey — i've got one 50-minute section next week with about twenty first-year PPE students and the topic i've been handed is the backward induction paradox and the centipede game. they've done normal-form games (PD, one coordination thing) and exactly one tree, an entry-deterrence one, and that's the lot. don't explain the paradox to me, i've read the basics — what i need is a plan for building it in the room, and specifically i want the dependency structure: what has to be on the board before what, because every time i try to sketch this i find myself using something i haven't actually put in place yet.

  so, the order the pieces have to go in and why. what has to be established before the folding-back step even looks like an argument rather than a trick — i'm guessing the load-bearing thing is that a strategy is a complete plan for every node, not a choice at the node you happen to be at, since otherwise they'll read backward induction as a prediction about which node gets reached. tell me if that's right and what else is load-bearing in the same way, and in what sequence it has to arrive.

  then the example. i want one concrete six-move centipede with real numbers, and i want to know what the numbers have to be like for the paradox to bite: pot growing as you pass, grabbing now beating waiting one more move, both players much richer if they get anywhere near the end, whatever else is essential. and what the example must *not* contain — anything that lets them explain the intuition away instead of feeling it: no uncertainty about when the game ends, no other-regarding payoffs, no way to promise or commit to anything, no repetition or shadow of the future. also why this example and not the finitely repeated prisoner's dilemma, which they've already met and at which they will immediately start shouting tit-for-tat and reputation, and not the ultimatum game, where the prediction is equally stark but the interesting part seems to be somewhere else entirely.

  two things i'm genuinely torn about and want you to either place or throw out:

  first, my own wrinkle. i've been messing with a version that has no fixed last node — instead, after every pass a fuse burns with probability about a third, and if it burns the game just stops and the pot is split evenly, and that's the end. as far as i can see there's then no known final node for the induction to start from, so the argument has literally nowhere to begin, and the conclusion flips to something like "keep passing". is that right? does it actually isolate the premise doing the work — that what matters is a *known* end, not merely that the game isn't infinite — or does it just look like a different game with different payoffs, in which case the students will shrug and learn nothing? and if it belongs in the session at all, does it go before the standard version or after? i can see a case for both and i can't decide.

  second, a colleague says i should open with the surprise exam, on the grounds that it's the same shape of argument and they'll find it more fun. i worry that's two puzzles in fifty minutes and neither lands. where would it have to sit, if anywhere, and what would it have to be *doing* there rather than just being a warm-up.

  misconceptions. here's what i'm braced for — tell me what i've missed, and for each one tell me the exact point in the sequence where it has to be headed off rather than just listed at the end: that the whole thing shows rationality is self-defeating (i think this is the wrong lesson and i want it dead early, but i don't want to kill it by flatly asserting that the theory is fine); that the fix is to make a promise or pre-commit, which i think smuggles in prisoner's-dilemma machinery; that you'd never actually reach the last node, so the reasoning is about a counterfactual you know to be false and can be ignored; that it's just the prisoner's dilemma again; that it's an empirical claim about how people behave in labs and the experiments refute it; and the one i'm least sure how to handle — a sharp student saying that if she finds herself at node five then plainly the other player isn't the sort who grabs, so of course she should pass. that last one feels half right and half a category mistake, and i don't know how to honour it without letting it eat the entire session.

  then: what do i openly refuse to explain at this level, and say out loud that i'm refusing it. i'm assuming the whole epistemic programme is out — common belief in rationality, whatever the actual results are about what backward induction requires, refinements, trembles — plus the experimental literature and whatever you'd say about altruism parameters. but tell me where exactly the line goes and whether anything i've just listed is actually cheap enough to keep.

  and one question for the last five minutes that tells me whether they've got the paradox rather than just the folding-back ritual — something they can't answer by restating the procedure. i was going to ask what would have to be false for the first mover to be right to pass, but i'm not sure that's the sharpest version of it, and it might just invite a wierd list of things people find psychologically plausible.

  keep it seperate from the readings, i'm not asking for anything to assign — just the shape of the session.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 20 first-year PPE students (Philosophy, Politics, Economics).
      *   **Time:** 50 minutes (one section).
      *   **Topic:** Backward Induction (BI) Paradox & Centipede Game.
      *   **Prior Knowledge:** Normal-form games (PD, Coordination), exactly *one* extensive-form game (Entry Deterrence).
      *   **Goal:** A structural plan for building the argument in the room, specifically focusing on dependency order (what must be on the board before what).
      *   **Specific Constraints:**
          *   Do not explain the paradox to the instructor (they know it).
          *   Focus on the "dependency structure" of the board work.
          *   Identify "load-bearing" concepts (e.g., strategy as a complete plan).
          *   Provide a concrete 6-move Centipede example with specific payoff constraints.
          *   Address the "fuse/probability" variant (to keep or toss?).
          *   Address the "Surprise Exam" opening (to keep or toss?).
          *   Handle specific misconceptions at the *moment* they arise, not at the end.
          *   Define what to explicitly *refuse* to explain (epistemics, experiments, etc.).
          *   Provide a final diagnostic question.

  2.  **Deconstruct the "Dependency Structure" (The Core Challenge):**
      *   The user is worried about circularity or using concepts before defining them.
      *   *Key Insight:* Backward Induction fails if students think of strategies as local choices. It succeeds only if they understand strategies as *conditional plans* covering off-path nodes.
      *   *Sequence:*
          1.  Game Tree (Structure).
          2.  Payoffs (Incentives).
          3.  Definition of Strategy (Complete Plan).
          4.  Rationality Assumption (Common Knowledge - simplified).
          5.  The Folding Back (The Mechanism).
          6.  The Paradox (The Result vs. Intuition).
      *   *Load-bearing:* The definition of a strategy *must* precede the folding back. If they think "I'll just decide when I get there," BI looks like a prediction error rather than a logical necessity.

  3.  **Designing the Centipede Example:**
      *   Needs 6 moves (3 per player).
      *   Payoffs must grow (cooperation benefit).
      *   Payoffs must make "Grab" dominant at the last node.
      *   Payoffs must make "Grab" dominant at every node *given* the future play.
      *   *Constraint:* No uncertainty, no repetition, no altruism.
      *   *Numbers:* Keep them simple.
          *   Node 1 (P1): Take (2,1) vs Pass.
          *   Node 2 (P2): Take (1,3) vs Pass.
          *   Node 3 (P1): Take (4,2) vs Pass.
          *   Node 4 (P2): Take (3,5) vs Pass.
          *   Node 5 (P1): Take (6,4) vs Pass.
          *   Node 6 (P2): Take (5,7) vs Pass (End: 6,6).
          *   *Check:* At Node 6, P2 takes 7 vs 6. Pass. At Node 5, P1 knows P2 takes at 6, so P1 compares 6 (Take) vs 4 (Pass->P2 Takes). Take. And so on.
      *   *Why Centipede over Repeated PD?* Repeated PD allows "reputation" arguments easily. Centipede isolates the *end-game* logic more sharply because the incentive to defect is immediate at every node, not just the last. Ultimatum is one-shot; Centipede is dynamic.

  4.  **Addressing the "Wrinkle" (Probabilistic End/Fuse):**
      *   *Analysis:* This changes the game from Finite Perfect Information to Infinite/Probabilistic Horizon. BI *does* work here, but it yields a different result (cooperation can be rational).
      *   *Verdict:* **Toss it.**
      *   *Reason:* It confuses the specific logical point of the *Paradox* (Finite Horizon + Common Knowledge = Unraveling). Introducing probability muddies the water. It teaches "Uncertainty allows cooperation," which is true, but it sidesteps the paradox of *certainty*. It belongs in a Week 2 on incomplete information or repeated games, not the intro to BI.
      *   *Decision:* Tell the user to cut it. It solves the paradox by changing the premises, which prevents students from feeling the tension.

  5.  **Addressing the "Surprise Exam":**
      *   *Analysis:* It's a logical paradox, not a game theoretic one (no payoffs, no strategic interaction in the same way).
      *   *Verdict:* **Toss it.**
      *   *Reason:* 50 minutes is too short. It consumes cognitive load on the *logic* of induction rather than the *strategic* implication. It risks conflating epistemic logic with game theory.
      *   *Decision:* Cut it. Stick to the game.

  6.  **Handling Misconceptions (Timing is Key):**
      *   *Rationality is self-defeating:* Address *after* deriving the BI outcome but *before* discussing "real world." Frame it as "Rationality + Knowledge + Structure = Outcome."
      *   *Promise/Commitment:* Address when defining the game tree. The tree *excludes* binding contracts. If you add promises, you change the tree.
      *   *Never reach last node:* Address during the folding back. This is the "off-path" issue. You must reason about nodes that won't be reached to determine what happens at nodes that will.
      *   *Just PD again:* Address during the example setup. PD is simultaneous; this is sequential.
      *   *Experiments refute it:* Explicitly refuse to discuss (see "Refusals").
      *   *The "Node 5" Objection (If I'm here, you aren't rational):* This is the hardest one. It challenges Common Knowledge of Rationality (CKR).
      *   *Handling:* This needs to be the pivot to the "Paradox" section. Acknowledge it's a valid critique of the *assumptions*, not the *math*. If CKR breaks, BI breaks. But *if* CKR holds, BI holds.

  7.  **Defining Refusals:**
      *   Epistemic conditions (Common Knowledge vs. Belief).
      *   Experimental data (Kreps, McKelvey, Palfrey).
      *   Altruism/Social Preferences.
      *   Trembling Hand/Perfection refinements.
      *   *Why:* First-years need to master the *logic* of the model before critiquing the *assumptions*.

  8.  **The Final Question:**
      *   User's idea: "What would have to be false for P1 to pass?"
      *   Critique: Good, but might invite psychological answers.
      *   Better: Focus on the *condition* required for the first move. "Which specific assumption, if removed, makes 'Pass' at Node 1 the rational choice?" (Answer: Common Knowledge of Rationality or Finite Horizon).
      *   *Refinement:* "If you observe Player 2 passing at Node 2, what does that logically force you to conclude about their rationality or your knowledge of it?" This forces them to confront the CKR breakdown.

  9.  **Drafting the Plan (Iterative refinement for flow):**
      *   *0-5 mins:* Setup & Tree.
      *   *5-15 mins:* Strategy Definition (Crucial Step).
      *   *15-30 mins:* The Fold (BI execution).
      *   *30-40 mins:* The Paradox (Intuition vs. Logic).
      *   *40-45 mins:* Misconception Management (The "Node 5" objection).
      *   *45-50 mins:* Final Diagnostic.

  10. **Review against Constraints:**
      *   Did I explain the paradox to the user? No.
      *   Is the dependency structure clear? Yes (Strategy def before BI).
      *   Are the numbers specific? Yes.
      *   Did I address the Fuse/Surprise Exam? Yes (Toss both).
      *   Are misconceptions placed in sequence? Yes.
      *   Are refusals explicit? Yes.

  11. **Final Polish:** Ensure tone is collegial and direct. (Self-Correction: Make sure to emphasize *why* the strategy definition is the load-bearing beam. If they think strategies are just "what I do now," BI is just a prediction. If strategies are "plans for all nodes," BI is a consistency requirement.)

  12. **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is the structural plan for the 50-minute section. It is designed to prevent the "circular sketching" problem by enforcing a strict dependency order on the board.

  ### 1. The Dependency Structure (Board Work Order)

  You are correct that the load-bearing beam is the definition of a **strategy**. If students view a strategy as "what I choose at the node I reach," backward induction (BI) looks like a prediction about the future. If they view it as "a complete plan for every node," BI becomes a consistency requirement for rationality *now*.

  **The Sequence on the Board:**

  1.  **The Tree (Structure):** Draw the 6-move centipede. Label decision nodes (P1, P2, P1, P2, P1, P2).
      *   *Constraint:* Do not put payoffs on yet.
      *   *Why:* You must establish the *sequence* before the *incentives*.
  2.  **The Payoffs (Incentives):** Add the numbers (see Section 2 below).
      *   *Constraint:* Ensure the "Grab" payoff is always higher than the "Pass -> Opponent Grabs Next" payoff.
      *   *Why:* This establishes the local dominance at the terminal node.
  3.  **The Definition of Strategy (The Load-Bearing Beam):** Write this explicitly before solving.
      *   *Text:* "A strategy is a complete plan of action specifying a move at **every** node where you could possibly move, even if that node is never reached."
      *   *Why:* This prevents the "I'll decide when I get there" objection. It forces them to acknowledge that P1's choice at Node 1 depends on P2's planned choice at Node 6, even if Node 6 is off-path.
  4.  **The Rationality Assumption:** Write: "Players maximize payoffs. Players know the other player maximizes payoffs." (Keep it simple; avoid "Common Knowledge" jargon for now, but imply the recursion).
      *   *Why:* You need this to justify why P1 can simulate P2's reasoning.
  5.  **The Fold (The Mechanism):** Now, and only now, draw the arrows backward from Node 6 to Node 1.
      *   *Why:* If you do this before Step 3, they will treat it as a prediction. If you do it after Step 3, they must treat it as a logical deduction based on the definition of strategy.

  ---

  ### 2. The Concrete Example (6 Moves)

  Use these numbers. They are calibrated to make the "Grab" option strictly dominant at every node *given* backward induction, while making the "Pass" path Pareto superior.

  *   **Node 1 (P1):** Take **(2, 1)** | Pass $\rightarrow$ Node 2
  *   **Node 2 (P2):** Take **(1, 3)** | Pass $\rightarrow$ Node 3
  *   **Node 3 (P1):** Take **(4, 2)** | Pass $\rightarrow$ Node 4
  *   **Node 4 (P2):** Take **(3, 5)** | Pass $\rightarrow$ Node 5
  *   **Node 5 (P1):** Take **(6, 4)** | Pass $\rightarrow$ Node 6
  *   **Node 6 (P2):** Take **(5, 7)** | Pass **(6, 6)** [Game Ends]

  **Why these numbers work:**
  1.  **Growth:** The pot grows as you pass (2+1=3 $\rightarrow$ 1+3=4 $\rightarrow$ 4+2=6... up to 12 at the end).
  2.  **Immediate Temptation:** At every node, Taking gives you more *right now* than Passing *if* the opponent Takes next. (e.g., at Node 5, P1 gets 6 for Take, but only 4 if P2 Takes at Node 6).
  3.  **The Paradox:** The BI outcome is P1 Takes at Node 1 for (2,1). But (6,6) is available.

  **What this example must NOT contain:**
  *   **No Uncertainty:** Do not introduce probabilities.
  *   **No Symmetry:** Note the payoffs are asymmetric (2,1 vs 1,3). This prevents students from solving it by saying "we'll just split the difference."
  *   **No "Fair" Split at the End:** The final payoff (6,6) is equal, but the path there is not. This stops them from arguing "they will pass to be fair."

  **Why Centipede and not Repeated PD?**
  In Repeated PD, students can argue "I defect now to punish you later." In Centipede, the game *ends* when you defect. There is no "later" to punish. It isolates the end-game logic without the shadow of the future.

  **Why not Ultimatum?**
  Ultimatum is one-shot. The Centipede requires reasoning about *future* reasoning. The paradox relies on the chain of inference, not just a single rejection threshold.

  ---

  ### 3. The Wrinkles (Verdict: Toss Both)

  **1. The Probabilistic Fuse (Toss It)**
  *   **Verdict:** Do not use this in this session.
  *   **Why:** You are teaching the *paradox* of finite horizon backward induction. The probabilistic version changes the game from Finite Perfect Information to Infinite/Probabilistic Horizon. In that game, cooperation *is* rational.
  *   **Risk:** If you introduce it, students will conclude "Backward Induction is wrong" rather than "Backward Induction requires a known end." It solves the tension by changing the premises. It belongs in a lecture on *incomplete information* or *reputation*, not the introduction to BI.
  *   **Decision:** Cut it. It dilutes the specific logical point you need them to feel.

  **2. The Surprise Exam (Toss It)**
  *   **Verdict:** Do not use this in this session.
  *   **Why:** 50 minutes is too tight. The Surprise Exam is an epistemic paradox, not a game-theoretic one (no payoffs, no strategic interaction).
  *   **Risk:** It consumes cognitive load on the *logic of induction* rather than the *strategic implication*. Students will get stuck on "can the exam be on Friday?" and miss "why does P1 take at Node 1?"
  *   **Decision:** Cut it. Stick to the game tree.

  ---

  ### 4. Misconception Management (Sequence & Timing)

  Do not list these at the end. Head them off at the specific moment they arise in the logic.

  **1. "You'd never reach the last node, so reasoning about it is counterfactual nonsense."**
  *   **When:** During **Step 3 (Definition of Strategy)**.
  *   **Fix:** Remind them: "A strategy must specify what you do at Node 6 even if we think Node 6 won't happen. P1's choice at Node 1 *depends* on what P2 *would* do at Node 6. If you delete the counterfactual, you break the link."

  **2. "The fix is to make a promise or pre-commit."**
  *   **When:** During **Step 2 (Payoffs/Tree Setup)**.
  *   **Fix:** Point to the tree. "The tree represents the *rules*. There is no branch for 'Make Promise.' If you add promises, you are drawing a different game tree. We are solving *this* tree."

  **3. "It's just the Prisoner's Dilemma again."**
  *   **When:** During **Step 5 (The Fold)**.
  *   **Fix:** "In PD, you move simultaneously. Here, I see what you did before I move. The logic is different because I can condition my move on yours, but the *end* forces the unraveling."

  **4. "Experiments show people don't do this."**
  *   **When:** **Explicit Refusal** (See Section 5).
  *   **Fix:** "We are analyzing the logic of the model, not human psychology. Whether people *do* it is an empirical question. Whether they *should* (by this definition of rationality) is the logical question."

  **5. "If I find myself at Node 5, plainly you aren't rational, so I should pass." (The Sharp Student)**
  *   **When:** During the **Paradox Discussion (after the Fold)**.
  *   **Why:** This is the strongest objection. It attacks Common Knowledge of Rationality (CKR).
  *   **Fix:** Do not fight it. Validate it. "You have identified the exact tension. BI requires CKR. If P1 passes at Node 1, CKR is broken. If CKR is broken, BI does not apply. The paradox is: *If* we assume CKR, P1 cannot pass. *If* P1 passes, we cannot assume CKR. You cannot have it both ways."
  *   **Goal:** Show that the paradox isn't a math error; it's a clash between the assumption (CKR) and the intuition (Passing is better).

  **6. "Rationality is self-defeating."**
  *   **When:** **Conclusion**.
  *   **Fix:** "Rationality isn't self-defeating; *Common Knowledge* of Rationality in a *Finite* Game is what drives the result. Change the knowledge or the finitude, and the result changes."

  ---

  ### 5. What to Explicitly Refuse to Explain

  Say this out loud at the start or when the first empirical objection arises. This protects you from getting bogged down.

  **The "Out of Bounds" List:**
  1.  **Epistemic Logic:** "We are not formalizing 'Common Knowledge' today. We are assuming you know they are rational, they know you know, etc."
  2.  **Experimental Data:** "We are not discussing McKelvey & Palfrey (1992) or lab results. We are discussing the theoretical prediction."
  3.  **Social Preferences:** "We are assuming players care only about their own payoff number. Altruism is a different payoff function, not a refutation of the logic."
  4.  **Refinements:** "We are not discussing Trembling Hand Perfection or sequential equilibria. We are doing simple Backward Induction."

  **Why:** You are teaching them the *baseline model*. If you introduce the critiques in Week 1, they will never learn the model.

  ---

  ### 6. The Final Diagnostic Question (Last 5 Minutes)

  Your idea ("What would have to be false for P1 to pass?") is good, but it invites psychological lists ("P1 is nice," "P1 is confused"). You want a structural answer.

  **Ask this instead:**
  > "Backward Induction tells us P1 must Take at Node 1. But if P1 Takes at Node 1, the game ends immediately.
  >
  > **Question:** If you observed Player 2 *Passing* at Node 2, what specific assumption of our model has logically *failed*? Is it the payoffs, the tree structure, or the knowledge of rationality? And why does that failure justify Player 1 Passing at Node 1?"

  **What you are looking for:**
  *   **Wrong Answer:** "Player 2 is irrational." (Too vague).
  *   **Wrong Answer:** "Player 2 wants to be nice." (Changes payoffs, which is allowed, but misses the structural point).
  *   **Right Answer:** "If P2 Passes at Node 2, then P1 cannot hold 'Common Knowledge of Rationality' anymore. If P1 knows CKR is false, the Backward Induction chain is broken at Node 2, so P1 is no longer forced to Take at Node 1."

  This confirms they understand that BI is a *conditional* logical chain dependent on CKR, not a physical law of behavior.

  ### Summary Timeline
  *   **00-05:** Draw Tree (No payoffs).
  *   **05-15:** Add Payoffs + Define Strategy (Load-bearing).
  *   **15-30:** Execute Backward Induction (The Fold).
  *   **30-40:** The Paradox (Intuition vs. Logic) + Handle "Node 5" Objection.
  *   **40-45:** Explicit Refusals (Experiments/Epistemics).
  *   **45-50:** Diagnostic Question.
