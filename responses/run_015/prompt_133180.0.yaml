answer: |-
  This is a sophisticated reading that aligns with modern "neo-Weberian" institutionalism (e.g., Philip Gorski, Jürgen Kocka). You are shifting the causal weight from *motivation* (psychology) to *organizational fitness* (sociology/evolution). On this reading, the "Protestant Ethic" is a cultural mutation that produced a superior organizational technology (rationalized discipline), which then spread via market selection regardless of the underlying theological "source code."

  This shields Weber from the standard "Catholics were capitalists too" critique, because the argument isn't that only Protestants *could* be capitalists, but that the Protestant-infused *form* of capitalism was more evolutionarily fit.

  Here is the ranking of defeaters that specifically target this **selection mechanism**, from most fatal to least, followed by an analysis of your specific scenarios and the unfalsifiability risk.

  ### Ranked Defeaters for the Selection Story

  #### 1. The Exogenous Source of Rationality (The "State First" Argument)
  **Severity:** Fatal
  **The Argument:** Evidence that the specific "bureaucratic ethos" (accountability, regularity, separation of office from home, written records) was developed in **absolutist state administration** (Cameralism, military logistics, tax farming) *prior* to its adoption by private enterprise, and that this transfer occurred independently of religious culture.
  **Why it hits the selection story:** Your reading relies on the Calvinist church/community generating the "software" of rational discipline which was then selected for in the market. If the state bureaucracy developed this software first (to manage war and taxes) and private firms simply copied the state to survive, then the religious selection mechanism is epiphenomenal. The "spirit" wasn't selected from religious culture; it was imported from political culture.
  **Defender's Move:** They might argue Calvinism influenced the *state* bureaucracy first (e.g., Prussian discipline).
  **Risk:** This stretches the theory so thin it becomes a general claim about "Western Rationality" rather than a specific claim about Protestantism.

  #### 2. Equivalent Fitness in Non-Calvinist Regions (The "No Advantage" Argument)
  **Severity:** High
  **The Argument:** Historical data showing that firms in Catholic or Jewish regions developed identical rationalized structures (double-entry bookkeeping, hierarchical management, long-term reinvestment) and achieved **equal longevity and market share** during the critical selection period (17th–18th centuries).
  **Why it hits the selection story:** A selection mechanism requires a *differential* fitness. If the "Calvinist ethos" confers no actual competitive advantage over a "Catholic ethos" (or no ethos) in terms of firm survival, then market competition cannot be the vector that preserved the spirit after the faith faded. If the "spirit" is just "being good at business," and everyone was equally capable of being good at business without the theology, the specific Calvinist link is severed.
  **Defender's Move:** Argue that the Catholic firms *did* adopt the Protestant ethic implicitly (cultural osmosis).
  **Risk:** This begins to drift into unfalsifiability (see below).

  #### 3. The "Irrational Success" of Early Capitalism (The "Predation" Argument)
  **Severity:** Moderate
  **The Argument:** Evidence that the firms which actually survived and dominated the 17th/18th-century market were not the disciplined, ascetic reinvestors, but rather **speculators, monopolists, and plunderers** (e.g., mercantilist charter companies, slave traders, court Jews relying on patronage).
  **Why it hits the selection story:** This attacks the premise that "rationalized discipline" was the trait being selected *for*. If the market rewarded political connection, brute force, or speculative bubbles more than Weberian discipline, then the "Spirit of Capitalism" (as defined by rational organization) was not the winner of the selection process. The "spirit" might be a later invention retroactively applied to winners who won for other reasons.
  **Defender's Move:** Distinguish between "political capitalism" (parasitic) and "modern rational capitalism" (productive), arguing the latter only won later.
  **Risk:** Moves the goalposts on the timeline of when the "Spirit" actually became dominant.

  ---

  ### Addressing Your Specific Scenarios

  #### 1. "Capitalist practices spread just as fast in regions without any Calvinist presence."
  **Verdict:** **Fatal to the Selection Story.**
  If the *practices* (rational organization, discipline, reinvestment) spread just as fast in, say, Catholic Flanders or Northern Italy as in Calvinist Holland, then the Calvinist "mutation" was not necessary for the trait to propagate.
  *   **Why it's not just awkward:** A selection story posits that Trait A (Calvinist Discipline) outcompetes Trait B (Traditionalism). If Trait B evolves into Trait A (Rational Capitalism) just as quickly without the Calvinist genetic marker, then Calvinism is not the carrier. It suggests "Rationality" is a convergent evolution triggered by market density or urbanization, not a specific cultural inheritance from Geneva.
  *   **Can defenders absorb this?** Only by arguing that the non-Calvinist regions were *already* culturally Protestantized via trade networks. If they claim the "ethic" detached from theology and floated freely, they concede your point: the theology doesn't matter, only the organizational form does. But if the organizational form arises without the theology *anywhere*, the specific Weberian link is broken.

  #### 2. "The bureaucratic ethos was actually imported from state administration rather than religious culture."
  **Verdict:** **Fatal to the Origin, Fatal to the Mechanism.**
  This is the strongest historical defeater (often associated with Werner Sombart or later institutionalists).
  *   **Why:** Weber argues the *sect* disciplined the *individual*, who then built the *firm*. If the *State* disciplined the *official*, who then took that habit to the *firm*, the religious selection mechanism is bypassed. The "Iron Cage" was built by the State, not the Church.
  *   **Can defenders absorb this?** They could argue for an "Elective Affinity" between State Building and Protestantism (e.g., Protestant states built better bureaucracies).
  *   **Risk:** This turns Weber into a tautology: "Rationality won because Rationality wins." It removes the specific *religious* content that makes the thesis distinct from general modernization theory.

  ---

  ### The Unfalsifiability Risk

  You asked if defenders can just absorb the hit by tweaking the mechanism. **Yes, and this is the central danger zone for your reading.**

  The "Selection Story" is more robust than the "Psychological Story" against empirical counter-examples, but it is highly vulnerable to **conceptual stretching**.

  1.  **The "Latent Spirit" Trap:** If evidence shows Catholic firms were just as disciplined, the defender says, "They were operating under the *latent* Spirit of Capitalism, even if they remained Catholic."
      *   *Result:* Unfalsifiable. If the "Spirit" is defined by the *outcome* (rational business) rather than the *cause* (Calvinist anxiety), the theory becomes circular: "Why did rational capitalism win? Because of the Spirit. How do we know the Spirit was there? Because rational capitalism won."
  2.  **The "Decoupling" Move:** If evidence shows Calvinists weren't particularly disciplined, the defender says, "The *values* decoupled from the *people*. The institutions survived even if the believers didn't."
      *   *Result:* This saves the theory but makes it hard to test. You have to prove a negative (that the institution *didn't* have a hidden religious lineage).
  3.  **The Threshold Problem:** To remain falsifiable, the theory must specify a **threshold of efficiency**. It must claim that firms with the "Ethos" outperformed firms without it *by a measurable margin* during the critical period. If defenders retreat to "It helped a little, culturally," the selection mechanism becomes too weak to explain the macro-historical shift.

  **Conclusion:**
  Your reading is historically stronger than the psychological one, but it trades one vulnerability for another. It avoids the "Catholic Banker" counter-example but exposes itself to the **"Convergent Evolution"** counter-example.

  To keep it falsifiable, you must demand that defenders specify:
  1.  **What specific organizational practices** constitute the "Ethos" (e.g., specific accounting methods, labor discipline).
  2.  **Evidence that firms lacking these practices failed** at higher rates than firms possessing them *in the same market conditions*.
  3.  **Evidence that these practices originated in religious communities** rather than state/military contexts.

  If they cannot produce (2) and (3), the "Selection Story" collapses into a general theory of modernization where religion is merely a decorative label on a process driven by state-building and market density.
