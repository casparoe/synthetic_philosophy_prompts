answer: |-
  # Session Architecture: The Paradox of Self-Amendment in Nomic

  **Session Duration:** 75 Minutes
  **Target Audience:** Advanced Undergraduate Philosophy
  **Core Case:** Peter Suber's *Nomic* (Rule-Set A)

  ## I. Conceptual Sequence and Dependency Relations

  The session must follow a strict linear progression. Each module provides the necessary vocabulary and logical scaffolding for the subsequent module. Deviating from this order risks collapsing the paradox into a mere procedural confusion.

  1.  **Module 1: The Normative Status of Rules (0–15 mins)**
      *   **Content:** Define rules not as predictions of behavior (realism) but as *validity conditions* for actions. Establish that an action (e.g., moving a piece, passing a law) is only "legal" if it satisfies a pre-existing rule.
      *   **Dependency:** This must precede everything else. Without establishing that rules confer *validity* rather than just describe *habit*, the later discussion of self-amendment becomes a sociological question about power rather than a logical question about authority.

  2.  **Module 2: The Object/Meta Distinction (15–30 mins)**
      *   **Content:** Distinguish between **Object-Rules** (governing player moves/score) and **Meta-Rules** (governing how Object-Rules are changed).
      *   **Dependency:** This distinction must be secured *before* introducing self-reference. Students must understand the "normal" hierarchy (Meta governs Object) to recognize the structural anomaly when a rule governs *itself*. If introduced simultaneously, the hierarchy appears arbitrary rather than functional.

  3.  **Module 3: The Logic of Conditional Obligation (30–45 mins)**
      *   **Content:** Formalize the amendment power as a conditional: *If* procedure $P$ is followed, *then* new rule $R'$ is valid. The authority of $R'$ derives entirely from the satisfaction of $P$ located in the prior rule $R$.
      *   **Dependency:** This must precede the paradox. The paradox arises specifically when the condition $P$ is altered by the very process it governs. Without understanding the conditional link between procedure and validity, students will view the amendment as a brute fact rather than a logical derivation.

  4.  **Module 4: The Self-Reference Knot (45–60 mins)**
      *   **Content:** Introduce the scenario where a Meta-Rule defines the procedure for amending *itself*. Analyze the moment the old procedure is used to validate a new procedure that negates the old one.
      *   **Dependency:** Relies on Modules 2 and 3. The tension is only visible if students accept the Meta/Object distinction (Module 2) and the derivative nature of validity (Module 3).

  5.  **Module 5: Resolution Strategies and Aporia (60–75 mins)**
      *   **Content:** Evaluate attempts to dissolve the paradox (hierarchy, external authority, acceptance) and conclude with the persistent nature of the logical knot.
      *   **Dependency:** Requires the full weight of the previous paradox to evaluate why standard solutions fail.

  ---

  ## II. The Carrying Scenario: "The Sovereign Clause"

  Do not use the full ruleset of *Nomic*. Use a constructed micro-system anchored by a single structural feature.

  **Structural Features to Include:**
  1.  **Rule 1 (The Sovereign Clause):** "Rules may be amended only by a 2/3 majority vote of players. This rule may be amended by the same procedure."
  2.  **The Proposal:** A player proposes to replace Rule 1 with **Rule 1*:** "Rules may be amended only by a unanimous vote. This rule cannot be amended."
  3.  **The Vote:** The group votes 2/3 in favor (satisfying old Rule 1) but not unanimous (failing new Rule 1*).
  4.  **The Constraint:** Validity is determined *solely* by the text of the rules. There is no "Game Master," no "Spirit of the Law," and no appeal to real-world constitutions.

  **Structural Features to Exclude:**
  1.  **Strategic Gameplay:** Do not allow discussion of *why* a player would propose this (e.g., to win). Focus exclusively on *whether* the move is valid.
  2.  **External Arbiter:** Explicitly forbid appeals to a judge, referee, or the "intent of the designers." The system must be closed.
  3.  **Ordinary Democratic Voting:** Do not allow the intuition that "the majority decides" to override the text. The majority is only authoritative *because* Rule 1 says so.

  **Function:** This scenario forces the group to confront the **Transition Problem**: At the exact moment Rule 1* is adopted, does its validity rest on Rule 1 (which it destroys) or Rule 1* (which did not exist when the vote occurred)?

  ---

  ## III. Misconception Interception Plan

  Anticipate three specific defensive moves students will make to avoid the paradox. Intercept them at the following precise points:

  1.  **Misconception: "It's Just a Harmless Recursive Loop."**
      *   *The Error:* Students will claim the rule simply updates like software code; no paradox exists.
      *   *Interception Point:* **End of Module 3 (Logic of Conditional Obligation).**
      *   *Defusal:* Demand they identify the *source of validity* for the update. If the source is the old rule, the new rule's claim to "unamendability" is invalid (since the old rule allowed amendment). If the source is the new rule, it has no authority yet. Force them to see the gap, not the continuity.

  2.  **Misconception: "An Implicit Logical Hierarchy Blocks Self-Reference."**
      *   *The Error:* Students will posit a hidden "Rule 0" or logical law that prevents a rule from touching itself.
      *   *Interception Point:* **Start of Module 4 (The Self-Reference Knot).**
      *   *Defusal:* Remind them of the **Closed System Constraint** from the Carrying Scenario. There is no Rule 0 in *Nomic*. If they posit one, they are violating the scenario's constraints. Ask: "Where is this Rule 0 written?" If it is not written, it is not a rule of the game.

  3.  **Misconception: "The Paradox is Dissolved by Deferring to Higher Authority."**
      *   *The Error:* Students will argue the players' collective will or the "real world" validates the change.
      *   *Interception Point:* **Module 5 (Resolution Strategies).**
      *   *Defusal:* Distinguish **Efficacy** (the rule is obeyed) from **Validity** (the rule was legally born). Acknowledge that players *can* ignore the rules, but emphasize that this session is about *legal validity*, not revolutionary power. If they appeal to player will, they have admitted the legal system collapsed.

  ---

  ## IV. Check-for-Understanding (CFU)

  **Time:** Minute 70
  **Format:** Individual written response (2 minutes) followed by pair-share.

  **The Prompt:**
  > "In the 'Sovereign Clause' scenario, the vote to adopt Rule 1* (Unanimity/Unamendable) passed with 2/3 support.
  >
  > **Question:** Is Rule 1* valid?
  > **Requirement:** You must answer 'Yes' or 'No.' Then, in one sentence, identify *which rule* conferred validity upon it. You cannot cite 'the players' or 'common sense.'"

  **Grading Criteria for the Instructor:**
  *   **Pass:** The student answers "Yes" and cites Old Rule 1 (acknowledging the paradox that the new rule destroys its own parent), OR answers "No" and cites the contradiction in New Rule 1* conditions. The key is citing a *specific rule text* as the source of validity.
  *   **Fail:** The student answers based on fairness ("It was a fair vote"), outcomes ("It makes the game better"), or external authority ("The group decided"). This indicates they have retreated from the logical/legal paradox to sociology.

  ---

  ## V. Strategic Omission

  **Material to Omit:** **Formal treatments of self-reference in logic (e.g., Gödel, Tarski, Russell's Type Theory).**

  **Statement to Group:**
  > "We are explicitly omitting formal logical treatments of self-reference, such as Gödel's incompleteness theorems or Tarski's hierarchy of languages. I am telling you this now so you do not attempt to import those solutions."

  **Justification for Omission:**
  1.  **Normative vs. Syntactic:** Formal logic treats self-reference as a syntactic error to be resolved by type-distinctions (a statement cannot refer to itself). Legal philosophy, however, treats self-reference as a *normative reality* (constitutions *do* amend themselves). Importing formal logic tempts students to declare the legal move "ill-formed" rather than analyzing the *consequences* of its validity.
  2.  **Preserving the Paradox:** Formal logic aims to *dissolve* paradoxes by restricting language. This session aims to *sustain* the paradox to understand the nature of legal continuity. If students apply type theory, they will conclude "Self-amendment is impossible," which ends the philosophical inquiry prematurely.
  3.  **Focus on Authority:** The core question is "Where does authority come from?" not "Is this string of symbols decidable?" Omitting formal logic keeps the focus on the source of normative force (the prior rule) rather than semantic consistency.
