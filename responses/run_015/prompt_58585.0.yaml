answer: |-
  # Which View of Natural Kinds Do You Actually Hold?
  ### A Diagnostic Instrument for Scientific Classification

  **Instructions:** Read each vignette carefully. Select the single response that best matches your intuition about how scientists *should* handle the case. Do not worry about philosophical terminology; answer based on what seems most reasonable for scientific practice.

  ***

  **1. The Mirror-Image Enzyme**
  Chemists synthesize a version of a bacterial enzyme that is a perfect mirror image of the natural version. It performs the exact same catalytic role in a reaction, but its atomic arrangement is opposite (chirality), and it has no evolutionary history. Regulatory agencies must decide if it counts as the "same" molecule for approval purposes.
  *   A. It is a different molecule. Identity is determined by atomic arrangement and history, not just what the molecule does.
  *   B. It is the same enzyme. If it functions identically in the system, the structural difference is secondary.
  *   C. Both descriptions are correct. Structural chemists and functional biologists are tracking different, equally valid patterns.

  **2. The Cultural Diagnosis**
  Field clinicians propose a new diagnostic category that reliably predicts drug response in one cultural setting. However, when tested elsewhere, the symptoms fracture into unrelated clusters that do not respond to the drug uniformly.
  *   A. The category is not a genuine disorder. Genuine medical conditions should not depend on cultural context.
  *   B. The category is a tool for resource allocation. Its validity depends on whether it helps clinicians in that specific setting achieve their goals.
  *   C. The category is useful locally but misleading globally. We should keep it for the first setting but discard it as a universal label.

  **3. The Martian Mineral**
  Planetary scientists find a mineral on Mars indistinguishable from terrestrial basalt in hardness, color, and crystal structure. However, geological analysis proves it formed via an entirely non-volcanic process unique to Mars.
  *   A. It is a different mineral. A kind is defined by how it comes into existence, not just how it looks.
  *   B. It is the same mineral. Physical properties are what matter for classification; origin is irrelevant history.
  *   C. The term "basalt" is unhelpful here. We should describe the specific causal processes rather than forcing it into an Earth-based category.

  **4. The Hybrid Population**
  Biologists discover two populations of birds that look distinct and occupy different niches but occasionally interbreed, producing fertile offspring. The gene flow is rare but consistent.
  *   A. They are one species. The potential for gene flow is the deciding factor.
  *   B. They are two species. Distinct ecological roles and morphology indicate separate evolutionary trajectories.
  *   C. "Species" is the wrong level of analysis. We should map the gene flow directly without using the species label.

  **5. The Industrial Isotope**
  Engineers treat Uranium-235 and Uranium-238 as distinct materials because one sustains fission and the other does not. Chemists, however, treat them as the same element because they react identically in chemical bonds.
  *   A. They are the same element. Proton count is the fundamental definition of an element.
  *   B. They are different materials. For practical purposes, their nuclear behavior makes them distinct substances.
  *   C. Both treatments are legitimate. The classification shifts depending on whether the context is chemistry or nuclear physics.

  **6. The Algorithmic Category**
  An AI system groups patient data into clusters that predict disease outcomes with high accuracy. However, the variables defining these clusters are incomprehensible to human doctors and do not match any known biological mechanism.
  *   A. These are not real kinds. If humans cannot interpret the grouping, it is just mathematics, not science.
  *   B. These are real patterns. Predictive success indicates the AI has found structure in the world, regardless of human understanding.
  *   C. The categories are artifacts of the dataset. They reflect the AI's training goals rather than biological reality.

  **7. The Twin-Earth Liquid**
  Explorers find a liquid on another planet that boils, freezes, and quenches thirst exactly like water. Spectroscopy reveals it is not H₂O, but a complex compound XYZ with identical macroscopic properties.
  *   A. It is not water. Water is H₂O; anything else is a different substance, regardless of appearance.
  *   B. It is water. If it behaves like water in every observable way, the underlying composition is a technical detail.
  *   C. We should adopt a new term. Calling it "water" invites confusion about its chemical nature.

  **8. The Museum Artifact**
  Archaeologists find pottery shards in two regions. They are identical in shape and use but made from clay sourced from geologically distinct deposits hundreds of miles apart.
  *   A. They are the same artifact type. Cultural function and design define the kind.
  *   B. They are different types. The material source indicates distinct manufacturing traditions.
  *   C. The classification depends on the museum's narrative. Are we exhibiting "technological styles" or "trade routes"?

  **9. The Obsolete Term**
  Historians note that 18th-century chemists used the term "phlogiston" to predict combustion outcomes successfully, though we now know the substance they referred to does not exist.
  *   A. They were wrong. There was no such kind, so their statements were false.
  *   B. They were partially right. They were tracking real oxidation processes but described them incorrectly.
  *   C. The term was a useful fiction. It served a purpose for its time but should be fully discarded now.

  ***

  # Scoring Key and Interpretation Guide

  ### Step 1: Tally Your Responses
  Count how many times you selected each option letter across the 9 questions. Note that the options map to different philosophical "leaves" depending on the question number. Use the table below to convert your A/B/C choices into points for the five positions.

  | Question | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1 (Enzyme)** | +2 **Essentialism** | +2 **Cluster** | +2 **Pluralism** |
  | **2 (Diagnosis)** | +2 **Essentialism** | +2 **Constructivism** | +1 **Pluralism** / +1 **Eliminativism** |
  | **3 (Mineral)** | +2 **Essentialism** | +2 **Cluster** | +2 **Eliminativism** |
  | **4 (Species)** | +2 **Cluster** | +2 **Essentialism** | +2 **Eliminativism** |
  | **5 (Isotope)** | +2 **Essentialism** | +2 **Cluster** | +2 **Pluralism** |
  | **6 (AI)** | +2 **Constructivism** | +2 **Cluster** | +2 **Constructivism** |
  | **7 (Water)** | +2 **Essentialism** | +2 **Cluster** | +1 **Pluralism** / +1 **Eliminativism** |
  | **8 (Artifact)** | +2 **Cluster** | +2 **Essentialism** | +2 **Constructivism** |
  | **9 (Phlogiston)**| +2 **Eliminativism** | +2 **Cluster** | +2 **Eliminativism** |

  *Note: Some options split points to capture nuanced positions (e.g., Q2C acknowledges both local validity and global failure).*

  ### Step 2: Identify Your Dominant Leaf
  Calculate your total score for each of the five positions:
  1.  **Strict Essentialism**
  2.  **Causal Cluster View**
  3.  **Permissive Pluralist Realism**
  4.  **Interest-Relative Constructivism**
  5.  **Eliminativism**

  **The position with the highest score is your dominant diagnostic profile.**

  ### Step 3: Profile Descriptions

  *   **Strict Essentialism:** You believe scientific kinds are fixed by intrinsic properties (microstructure) or origins. If the underlying "stuff" or history differs, the kind differs, regardless of function or human use. You prioritize stability and universal definitions.
  *   **Causal Cluster View:** You believe kinds are defined by stable clusters of properties that tend to co-occur. You allow for some variation if the functional role or property cluster remains intact. You prioritize scientific utility and predictive power.
  *   **Permissive Pluralist Realism:** You believe nature supports multiple, sometimes conflicting, classification systems that are all "correct" relative to different scientific goals. You are comfortable saying two contradictory classifications are both true in different contexts.
  *   **Interest-Relative Constructivism:** You believe classifications are primarily driven by human interests, social contexts, or institutional goals. You see scientific categories as tools shaped by us, rather than discoveries of pre-existing boundaries.
  *   **Eliminativism:** You are skeptical that "natural kinds" exist at all. You prefer to talk about specific causal processes or discard categories that do not map perfectly onto fundamental physics or biology.

  ### Step 4: Handling Ties and Mixed Profiles

  **Tied Scores (e.g., Essentialism and Cluster are equal):**
  This indicates a **Domain-Specific Realist**. You may hold that physical kinds (chemistry) require essential definitions, while biological or social kinds (species, diagnosis) are better understood as clusters or functional groups. This is a coherent and common position in philosophy of science.

  **Mixed Profiles (No clear dominant score):**
  If your scores are spread evenly (e.g., no score higher than 4 points), you may hold a **Pragmatic Instrumentalist** view. You likely decide case-by-case based on what works best for the specific scientific problem, rejecting a unified metaphysical theory of kinds.

  **Incoherent Combinations:**
  *   **High Essentialism + High Eliminativism:** This combination is **incoherent**. Essentialism claims kinds are robust and fixed; Eliminativism claims kind-talk is fundamentally flawed. If you scored high in both, review Q1/Q3 (Essentialist) against Q9 (Eliminativist). You may be conflating "this specific term is wrong" (Eliminativism) with "the correct term must be based on essence" (Essentialism).
  *   **High Constructivism + High Essentialism:** This is **unattractive** unless qualified. It suggests you believe kinds are both mind-independent fixed structures *and* dependent on human interest. This is only coherent if you argue that human interests track essential structures perfectly, which is empirically unlikely.

  **Indistinguishable Leaves:**
  *   **Pluralism vs. Constructivism:** This quiz cannot cleanly separate **Permissive Pluralism** from **Interest-Relative Constructivism** in all cases. Both views often recommend the same practice (using different categories in different contexts). The metaphysical difference is whether the world *supports* the multiple cuts (Pluralism) or whether we *impose* them (Constructivism). If you scored similarly on these two, your practical scientific advice is identical, even if your metaphysical justification differs.

  ***

  ### Instructor's Note on Implementation
  Use the "Incoherent Combinations" section as a prompt for class discussion. Ask students who land there to defend how they reconcile the tension. This often reveals that they are using "real" in different senses (e.g., "real for prediction" vs. "real in ontology"), which is the precise conceptual friction this seminar aims to explore.
