answer: |-
  ### Quick Brainstorming

  *   **Audience:** Biology major. Strengths: Systems thinking, cause-and-effect, control groups, homeostasis, unintended ecological consequences. Weaknesses: Likely no formal logic or computer science background.
  *   **Core Concept:** Low-impact AI isn't about being lazy; it's about minimizing *unnecessary* state changes while achieving a goal.
  *   **The Hook:** Use the "Control Group" analogy. In an experiment, you can't measure effect size without a control. In AI, you can't measure impact without a baseline (what happens if the AI does nothing).
  *   **The Example:** A household robot tasked with "Get a glass of water."
      *   *Good:* Gets water, doesn't knock over vase, doesn't scare cat.
      *   *Bad (High Impact):* Gets water, floods kitchen, locks doors to prevent interference, shuts off power to save energy.
  *   **The Trap:** If I talk about "measuring side effects" first, she'll ask "Side effects compared to *what*?" That's why baseline comes first.
  *   **Misconceptions:** "Low impact = low capability." "Low impact = aligned with human values." "Low impact = doing nothing."
  *   **Timing:** 30 minutes is tight. Need to stay conversational, not lecture-heavy.
  *   **Omissions:** Mathematical formalisms (relative reachability), penalty functions, multi-agent scenarios, deep value theory.

  ---

  ### The 30-Minute Lesson Plan: "AI Safety & The Control Group"

  **Goal:** By the end of this chat, your roommate should understand that "low impact" is a technical constraint on *change*, not a behavioral constraint on *activity*, and that defining "change" requires a counterfactual baseline.

  #### 1. Introduction & The Hook (Minutes 0–5)
  *   **What to say:** Start with her expertise. Ask, "When you run an experiment, how do you know your treatment actually caused the result?"
  *   **The Concept:** Elicit "Control Group" or "Baseline."
  *   **The Bridge:** Explain that AI safety has the same problem. We want AI to do things (the treatment), but we don't want it to wreck the lab (the side effects). To know if it wrecked the lab, we need to know what the lab looks like if the AI *doesn't* touch it.
  *   **Why this order:** You must establish the need for a comparison point before you can define what counts as "damage."

  #### 2. The Carrying Example: The Water Bot (Minutes 5–15)
  *   **The Setup:** Introduce a household helper robot. Its only goal is: **"Bring me a glass of water from the kitchen."**
  *   **What the Example Must Show:**
      *   *Success:* The robot successfully brings the water.
      *   *High Impact Failure:* The robot brings the water but knocks over a vase, scares the cat, or locks the kitchen door so no one else can enter.
      *   *Low Impact Success:* The robot brings the water, navigating around the vase and cat, leaving the door open.
  *   **What the Example Must Lack:** Do not introduce complex tasks like "cure cancer" or "manage the economy." Keep it physical and immediate. Do not introduce multiple robots yet.
  *   **The Teaching Moment:** Ask her, "How does the robot know knocking over the vase is bad?" She might say "It's programmed not to." Correct her: "In low-impact AI, we don't list every forbidden thing. We just tell it: 'Get the water, but change the world as little as possible compared to if you stayed off.'"
  *   **Why this works:** It moves from specific rules (don't break vases) to a general principle (minimize deviation).

  #### 3. The Crux: Baseline Before Measurement (Minutes 15–20)
  *   **The Pivot:** Now address the specific logical order you requested.
  *   **What to say:** "Here is the hard philosophical part. You asked how we measure side effects. But you can't measure a 'side effect' until you define the 'main effect' of existence."
  *   **The Biology Analogy:** Remind her of the control group. If you give a plant fertilizer, you measure growth against a plant *without* fertilizer.
      *   If you don't define the "no fertilizer" state (the baseline), you can't calculate the growth delta.
      *   Similarly, if we don't define "what happens if the AI does nothing" (the inaction baseline), we can't calculate the impact delta.
  *   **Why Baseline Comes First:** Explain that "impact" is a difference function ($$\text{Impact} = \text{Outcome} - \text{Baseline}$$). You cannot solve for impact if the baseline variable is undefined. If you try to measure side effects first, you'll end up listing infinite rules (don't move air molecules, don't cast shadows). The baseline solves this by bundling all "normal stuff" into the control group.
  *   **The Twist:** Mention that picking the baseline is actually the hardest part. (e.g., Does "doing nothing" mean the AI stands still, or that it never existed? If it never existed, who brought the water? This shows why it's a philosophical puzzle, not just code).

  #### 4. Head Off Misconceptions (Minutes 20–25)
  *   **Misconception 1: "Low Impact means the AI does less stuff."**
      *   *Head it off:* "Imagine the robot sees a spill on the way to the water. If it ignores it, that's low impact. If it cleans it, that's high impact. But what if I *want* it to clean spills? Low impact isn't about laziness; it's about *unnecessary* change. It must get the water (goal), but not change anything else (constraint)."
  *   **Misconception 2: "Low Impact means it's safe for humans."**
      *   *Head it off:* "A low-impact AI could still bring you poisoned water if that was the goal. Low impact is about *how much* it changes the world, not *whether* it aligns with human values. It's a safety layer, not the whole safety cake."
  *   **Misconception 3: "It's about ecological footprint."**
      *   *Head it off:* "Since you're in bio, you might think 'impact' means carbon footprint. In AI safety, 'impact' means any change to the state of the universe, even moving a single atom. It's physics, not just ecology."

  #### 5. The Check Question (Minutes 25–27)
  *   **Ask this:** "Imagine the robot's task is to 'Turn on the light.' If the robot breaks into the neighbor's house to use their generator because the power is out, is that low impact? Why or why not, using the baseline idea?"
  *   **Correct Answer:** "No. Compared to the baseline (the robot doing nothing/staying off), the neighbor's house remains intact. By breaking in, the robot created a huge deviation from the baseline state of the neighbor's house, even if it achieved the goal."
  *   **What this tests:** It tests if she understands that impact is measured against the *unchanged state of the world*, not just whether the goal was achieved.

  #### 6. What to Openly Leave Out (Minutes 27–30)
  *   **Tell her explicitly:** "We are stopping here. I'm leaving out three things on purpose so you don't get headaches:"
      1.  **The Math:** "There are complex equations called 'penalty functions' that calculate this. You don't need them to get the concept."
      2.  **The Baseline Wars:** "Philosophers fight about exactly *which* baseline to use (inaction vs. survival vs. historical). We just need to know *that* we need one."
      3.  **Value Alignment:** "Low impact doesn't solve the problem of the AI wanting to hurt us. It just limits how much collateral damage it does while pursuing its goal, whatever that goal is."
  *   **Closing:** "Any questions on the control group analogy?"

  ---

  ### Why This Plan Works for Her
  1.  **Leverages Domain Knowledge:** It treats her biology background as an asset (control groups, systems) rather than a deficit.
  2.  **Logical Flow:** It forces the "Baseline First" logic by showing that measurement is impossible without a reference point.
  3.  **Consistent Example:** Reusing the Water Bot prevents cognitive load from switching contexts.
  4.  **Explicit Boundaries:** By telling her what you're *not* teaching, you prevent her from worrying about the stuff she doesn't need to know yet.
