  Between the plots a low and grassy **hedge**
  Held back the winter water for our **use**,
  Or so I told the students, nothing **dead**
  About the way the silt began to **drift**
  Against the bank where never hung a **gate**,
  Though no one wrote in ink the reason **why**.

  They asked me always for the reason **why**,
  The postdocs with their maps to trim the **hedge**.
  They wanted steel where earth had made a **gate**,
  To measure flow and calculate the **use**.
  They watched the nutrient levels slowly **drift**,
  And marked the bank on paper as just **dead**.

  Some features serve a purpose long since **dead**,
  An accident of structure, no clear **why**,
  Like stone left over filling out the **drift**.
  The bank became a home inside the **hedge**,
  A second life co-opted for its **use**,
  While water found a path without a **gate**.

  The men who paid for locks upon the **gate**
  Did not intend the water should be **dead**.
  They built for yield, not habitat or **use**,
  Yet here we are, still asking simply **why**.
  The notebooks skip the failures of the **hedge**,
  The ones removed before the soil could **drift**.

  Survivorship is just a slow **drift**,
  Toward the fences that never had a **gate**.
  The ones who took them down are past the **hedge**,
  Or rather, under it, effectively **dead**.
  They did not write the books to ask us **why**,
  So we inherit what remains for **use**.

  I tell the reading group this quiet **use**:
  To watch the meaning of the boundary **drift**.
  We argue boundaries, freedom, and the **why**.
  I see the field, the bank, the missing **gate**,
  The statistics right, yet water never **dead**,
  Or living round the edges of the **hedge**.

  If water finds its **use** beyond the **gate**,
  And **dead** men do not tell us simply **why**,
  We walk the **drift** along the living **hedge**.
