      *Correction:* The arc should be: Theft $\rightarrow$ Bureaucracy $\rightarrow$ Math/Neutrality $\rightarrow$ **Realization that the Math *is* the Morality.**
      *Actually, re-reading the prompt:* "ending with the belief that moral judgment has been eliminated." This is the misconception *they will form*. I need to defuse this. So the arc is:
      1. Fraud = Theft.
      2. Conditionality = Bureaucracy.
      3. System = Neutral Bookkeeping (Misconception: Morality eliminated).
      4. Truth = Bookkeeping *constructs* Morality.
      Okay, I will structure the defusion points accordingly.

      *Re-evaluating the Mechanism:* The prompt asks for "One concrete welfare mechanism... with explicit instructions on what features it must possess and which real-world analogues it must avoid."
      I will use a hypothetical **"Compliance Credit"**.
      Features: Non-monetary value attached to behavior.
      Avoid: Direct cash cuts (too punitive/simple), specific job types (too partisan).

      *Let's refine the "Bookkeeping" injection.*
