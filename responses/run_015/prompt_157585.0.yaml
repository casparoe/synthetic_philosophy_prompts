      *Let's refine the Misconception Arc.*
      1. Fraud is theft (Resource transfer).
      2. Conditionality is cost-saving (Administrative).
      3. The system is neutral accounting (Moral judgment eliminated).
      *Defusion:* The accounting rules *are* the moral judgment.

      *Let's refine the Closing Question.*
      Needs to reveal if they understand the *construction* of the category.
