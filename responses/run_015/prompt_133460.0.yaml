answer: |-
  # Joint Statement on Individual Causal Efficacy in Collective Harms

  **Signatories:** The Expected-Difference Theorist (EDT) and The Inefficacy Skeptic (IS)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Individual Contributions to Climate Change, Factory Farming, and Voting

  ## I. Shared Commitments and Agreed Premises

  We, the undersigned, agree to the following claims as the foundation of this collaboration. These claims delineate the scope of our disagreement and establish the empirical conditions under which our respective views would be revised.

  1.  **Reality of Collective Harms:** We agree that collective harms (e.g., anthropogenic climate change, industrial animal suffering, election outcomes) are real, morally significant, and result from the aggregation of individual actions.
  2.  **Existence of Individual Duties:** We agree that individuals generally have moral duties regarding these harms. Our dispute is not about *whether* individuals ought to act, but about the *grounds* of that obligation (specifically, whether it relies on individual causal efficacy).
  3.  **The Threshold Model:** We agree that the primary empirical model for individual causal efficacy is the "Threshold Model." This model posits that production and climate systems respond to aggregate demand or emissions in discrete steps (thresholds) rather than continuous gradients.
  4.  **Definition of Difference-Making:** For the purposes of this collaboration, an individual act "makes a difference" if and only if it is the marginal unit that triggers a threshold, thereby causing additional harm that would not have occurred had that specific act not taken place.
  5.  **The Threshold Audit:** We accept the validity of the hypothetical "Threshold Audit" technology. This technology can retrospectively determine, for any specific purchase or emission, whether it was the marginal unit that triggered a threshold resulting in additional harm.
  6.  **Evidentiary Weight:** We agree that the aggregate results of the Threshold Audit constitute decisive evidence regarding the causal structure of collective harms. If the Audit consistently finds individual acts to be non-marginal, the EDT's causal claim is falsified. If the Audit consistently finds individual acts to be marginal triggers, the IS's causal claim is falsified.
  7.  **Scope of Dispute:** This dispute is not about moral psychology, integrity, or expressive value. The IS may argue for obligations based on complicity or fairness; the EDT may argue for obligations based on expected utility. We restrict this document to the *causal* premise underlying the consequentialist argument for individual obligation.

  ## II. Disagreements Table

  The following table outlines our divergent positions, the specific cruxes separating us, and the evidentiary findings we accept as relevant to resolving those cruxes.

  | Area of Disagreement | Expected-Difference Theorist (EDT) Position | Inefficacy Skeptic (IS) Position | The Crux & Agreed Evidence | Predictions Regarding the Threshold Audit |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Causal Efficacy of Individual Acts** | Individual acts have a non-zero probability of being the marginal trigger for a threshold. While most acts do not trigger a threshold, some do. The causal chain is stochastic but real. | Individual acts do not causally alter the outcome. Systems are either continuous (absorbing small changes without effect) or overdetermined (thresholds would be crossed by other acts if not this one). | **Crux:** Does the physical/economic system contain discrete thresholds sensitive to single units?<br><br>**Evidence:** The frequency of "Trigger Positive" results in a randomized sample of 1,000,000 acts analyzed by the Threshold Audit. | **EDT:** Predicts a statistically significant number of acts (matching prior probability estimates, e.g., 1 in 10,000) will be flagged as "Trigger Positive."<br><br>**IS:** Predicts zero (or statistically negligible) acts will be flagged as "Trigger Positive," indicating individual units are absorbed by system inertia. |
  | **2. Grounds of Individual Obligation** | Individual obligation is grounded in *expected difference*. Because there is a non-zero chance of causing harm, the expected utility of the act is negative, generating a consequentialist duty. | Individual obligation cannot be grounded in individual causal impact because that impact is null. Duty must be grounded in non-consequentialist factors (e.g., fairness, collective obligation, integrity, or complicity). | **Crux:** Can a merely probabilistic chance of being the marginal trigger ground a consequentialist obligation?<br><br>**Evidence:** The outcome of Disagreement #1. If the Audit shows no causal impact, the EDT's grounding fails. If the Audit shows causal impact, the IS's grounding requirement shifts. | **EDT:** If Audit confirms triggers, the consequentialist ground is validated.<br><br>**IS:** Even if Audit confirms triggers, the IS maintains that *ex ante* uncertainty undermines the consequentialist ground, but concedes that if the Audit shows *no* triggers, the consequentialist ground is definitively invalid. |
  | **3. Interpretation of System Buffering** | Supply chains and climate systems have "slack" but eventually run out. When slack is exhausted, the next unit triggers the harm. The Audit detects when slack is exhausted. | Supply chains and climate systems possess infinite or near-infinite buffering capacity regarding single units. "Thresholds" are analytical fictions; in reality, producers adjust continuously or ignore single-unit fluctuations. | **Crux:** Is system buffering finite or effectively infinite at the individual level?<br><br>**Evidence:** Audit data correlating specific unit purchases with producer order logs and production runs. | **EDT:** Predicts Audit will show specific producer orders were initiated specifically by the accumulation of specific consumer units.<br><br>**IS:** Predicts Audit will show producer orders are determined by aggregate forecasts, not specific unit accumulation, rendering the "marginal unit" designation incoherent. |

  ## III. Note on Verbal Disputes

  We acknowledge that a portion of our historical disagreement has been verbal rather than substantive. Specifically, we have often used the phrase "makes a difference" to mean different things:

  *   **EDT Usage:** Often refers to *expected* difference (probability $\times$ magnitude).
  *   **IS Usage:** Often refers to *counterfactual* difference (would the outcome definitely have been different?).

  The introduction of the **Threshold Audit** resolves this verbal ambiguity by operationalizing "makes a difference" as "is the marginal trigger identified retrospectively."

  *   If the Audit identifies acts as triggers, the IS must concede that individual acts *can* make a counterfactual difference.
  *   If the Audit fails to identify acts as triggers, the EDT must concede that the *expected* difference is zero because the probability of being a trigger is zero.

  Therefore, we classify the **causal** component of our dispute as empirical, not verbal. However, we note that the **normative** component (whether expected utility suffices for obligation vs. requiring actual impact) may retain a verbal element regarding the definition of "consequentialism." We agree to set aside this normative semantic dispute for the purpose of this collaboration, focusing strictly on the causal predictions above.

  ## IV. Commitment to Revision

  We both sign this statement with the commitment to update our views in accordance with the Threshold Audit results described in Section II.

  *   The **EDT** agrees that if the Audit returns a 0% trigger rate across a significant sample, they will abandon the claim that individual acts have expected negative utility based on threshold triggering.
  *   The **IS** agrees that if the Audit returns a trigger rate consistent with EDT probability models, they will abandon the claim that individual acts are causally impotent, and will acknowledge that consequentialist grounds for obligation are empirically viable.

  ***

  **Signed,**

  _________________________
  Expected-Difference Theorist

  _________________________
  Inefficacy Skeptic
