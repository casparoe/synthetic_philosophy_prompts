          5.  Moral obligations exist (dispute is on *grounds*, not existence).
      *   *Section II (Disagreements):*
          *   Row 1: Causal Status of Individual Acts.
          *   Row 2: Source of Obligation.
          *   Row 3: Audit Prediction.
      *   *Section III (Verbal Dispute Note):* Acknowledge that some disagreement might be about the definition of "difference-making," but the Audit forces an empirical resolution.

  8.  **Review against Constraints:**
