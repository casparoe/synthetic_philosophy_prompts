      *Actually, a common philosophical move here:* The IS often argues that "expected difference" is not "making a difference." The EDT argues it is. This *is* partly verbal. But the Audit tests the *existence* of the thresholds that generate the expectation. I will note that the *empirical* core is not verbal, but the *normative interpretation* of "obligation" might involve semantic divergence on "consequentialism." I'll keep it brief to focus on the main task.

      *Let's refine the Audit Prediction:*
