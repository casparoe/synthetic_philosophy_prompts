      *   **Constraint 1 (Crucial):** Introduce a hypothetical technology: "Threshold Audit." This audit determines *retrospectively* if a specific act was the marginal unit triggering a threshold/harm.
      *   **Constraint 2:** Both sides accept the audit's validity as bearing on the causal crux. Both accept the pattern of results would count for/against their view.
      *   **Output Format:** A document both could sign.
          *   Section 1: Numbered claims both accept (causal structure, definition of difference, scope of dispute).
          *   Section 2: Disagreements Table (Position statements, Cruxes, Agreed Evidence/Findings, Predictions).
          *   Constraint 3: Address verbal disputes if any.
          *   Constraint 4: Neutral formulation (neither side rejects the statement of their own position).

  2.  **Deconstruct the Positions:**
      *   **Expected-Difference Theorist (EDT):**
          *   Believes individual acts *do* have expected utility.
          *   Mechanism: Thresholds exist (e.g., ordering 10,000 chickens triggers a new batch).
          *   Probability: Low, but non-zero.
          *   Obligation: Grounded in this expected difference (consequentialist).
          *   View on Audit: Expects audits to show *some* acts are marginal triggers, even if rare. The *probability* of being the trigger is what matters for the obligation *ex ante*, but the audit confirms the *ex post* reality of thresholds.
      *   **Inefficacy Skeptic (IS):**
          *   Believes individual acts *do not* make a causal difference to the outcome.
          *   Mechanism: Systems are continuous or thresholds are determined by aggregate forces beyond individual control. Individual acts are "drops in the bucket."
          *   Obligation: Must be grounded in fairness, complicity, integrity, or collective duty, *not* individual causal impact.
          *   View on Audit: Expects audits to show *no* act is uniquely the trigger, or that the concept of "the marginal unit" is ill-defined in complex systems. Alternatively, even if an audit flags an act, the skeptic might argue the causal chain is overdetermined or the threshold model is empirically false. *Correction based on prompt:* The prompt says both accept the technology *if it worked* as bearing on the causal crux. So the IS must predict the audit will *not* find individual acts to be difference-making in the way EDT claims.

  3.  **Drafting Section 1: Shared Commitments:**
      *   Need to establish common ground on the *structure* of the problem without conceding the *causal efficacy*.
      *   Acknowledge collective harms exist.
      *   Acknowledge the "Threshold Model" is the standard model for EDT.
      *   Acknowledge the "Audit" is the arbiter.
      *   Clarify this isn't about moral psychology or non-consequentialist duties (IS can believe in duties, just not *consequentialist* ones based on individual impact).
      *   Clarify this isn't about verbal definitions of "cause" but about the empirical frequency of marginal impact.

  4.  **Drafting Section 2: Disagreements Table:**
      *   **Column 1: The Issue.** (Causal Efficacy, Grounds of Obligation, Interpretation of Audit).
      *   **Column 2: EDT Position.** (Acts have non-zero probability of being marginal. Obligation stems from expected value.)
      *   **Column 3: IS Position.** (Acts do not causally alter outcomes. Obligation stems from non-consequentialist grounds.)
      *   **Column 4: The Crux/Evidence.** (The Threshold Audit results).
      *   **Column 5: Predictions.** (EDT: Some acts will register as triggers. IS: No acts will register, or the concept is incoherent).

      *Refining the Audit Crux:* This is the trickiest part.
      *   EDT says: "If you buy this egg, there's a 1 in 10,000 chance you triggered a new crate."
      *   IS says: "Your purchase didn't change the outcome. The producer would have ordered the crate anyway, or the system absorbs fluctuations."
      *   The Audit: It checks *ex post* if *this specific unit* was the one that crossed the line.
      *   EDT Prediction: In a large sample, $X\%$ of acts will be flagged as "Marginal Trigger."
      *   IS Prediction: In a large sample, $0\%$ (or statistically negligible/indistinguishable from noise) will be flagged. Or, the audit will reveal that "thresholds" are not triggered by single units but by aggregate trends.
      *   *Self-Correction:* To make this a true collaboration, the IS must concede that *if* the audit shows acts are triggers, their causal claim is weakened. The EDT must concede that *if* the audit shows no acts are triggers, their causal claim is falsified.
      *   *Nuance:* The IS might argue that even if an audit flags a unit, the *outcome* (e.g., global temperature, total animal suffering) wouldn't have been different due to buffering. But the prompt defines the audit as determining if the act "caused additional harm." So if the audit says "Yes," the IS has a problem.
      *   *Better IS Prediction:* The IS predicts the audit will return "Indeterminate" or "No" because supply chains smooth out individual purchases. The "threshold" is a fiction of aggregation, not a physical switch flipped by one consumer.

  5.  **Addressing Verbal Disputes:**
      *   Is it just about the definition of "cause"?
      *   EDT uses probabilistic cause. IS uses deterministic/counterfactual cause.
      *   The Audit bridges this by looking for *actual* triggering events. If the audit finds triggers, the "cause" is real. If not, it's not.
      *   We should note that if the dispute is purely about whether "expected value" counts as "making a difference," the Audit resolves the empirical underpinning, but the normative leap (EV -> Obligation) might remain. However, the prompt asks to focus on the *causal* crux.

  6.  **Refining Tone and Language:**
      *   Must be neutral.
      *   Avoid "obviously" or "clearly."
      *   Ensure IS doesn't sound like a nihilist (they believe in duties, just not *these* grounds).
      *   Ensure EDT doesn't sound like they demand certainty (they accept probability).

  7.  **Step-by-Step Drafting:**

      *   *Title:* Joint Statement on Individual Causal Efficacy in Collective Harms.
