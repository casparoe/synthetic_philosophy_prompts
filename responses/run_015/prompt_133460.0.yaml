      *   Is the IS position charitable? (Yes, focus on non-consequentialist grounds).

  9.  **Final Polish:** Check the logic of the Audit prediction.
      *   EDT: "The audit will identify specific transactions as threshold-crossers with a frequency matching our probability estimates."
      *   IS: "The audit will fail to identify specific transactions as threshold-crossers, demonstrating that individual units are absorbed by system inertia or overdetermination."
      *   This looks solid. It makes the empirical claim falsifiable.

  10. **Final check on "Verbal Dispute":** The prompt asks "If you think part of the dispute is merely verbal, say which part and why."
      *   Actually, a key insight in this literature (e.g., Lawson, Nefsky) is that sometimes "making a difference" is ambiguous between "changing the outcome" and "being part of a sufficient set." The Audit clarifies this by defining "difference-making" operationally as "triggering the threshold." If the Audit works, it removes the verbal ambiguity. I should note that *prior* to the Audit, there was verbal ambiguity, but the Audit resolves it. Or, I can note that if the Audit shows thresholds exist but are never triggered by *individuals* (only groups), the dispute might shift to the definition of "individual act." I will stick to the prompt's instruction: identify if *part* is verbal. The definition of "obligation" might be verbal (consequentialist vs. non-consequentialist), but the causal claim is empirical. I will note that the *normative* disagreement might persist even if the causal one is resolved, but the causal one is not merely verbal.

