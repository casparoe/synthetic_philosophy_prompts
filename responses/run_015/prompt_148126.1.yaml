      *   *Is the argument robust?* The distinction between *assertion norms* and *belief constitution* is key. If it were just assertion norms, the group case might still be paradoxical (if groups have assertion norms). The fact that it isn't suggests the paradox is rooted in the *nature of belief/subjectivity*, not just speech acts.

  8.  **Final Polish:** Ensure terminology is precise (avowal, transparency, deliberative stance, group agency). (Self-correction: Make sure not to get bogged down in the metaphysics of group mind, keep it focused on the *conditions for Moorean absurdity*.)

