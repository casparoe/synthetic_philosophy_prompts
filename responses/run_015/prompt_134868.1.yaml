answer: |-
  **Game: The Substrate Budget**

  **Materials:** Whiteboard, 30 tokens (coins/beans), markers.
  **Setup:** Split into 3 teams. Each gets 10 tokens ("Compute Hours").

  **Rules:**
  *   **Goal:** Maximize "Total Welfare Units" (TWU).
  *   **Constraint:** You must define what counts as 1 TWU before spending tokens.
  *   **Move A (Speed):** 1 token buys 1 year of subjective life at 1x speed OR 100 years at 100x speed.
  *   **Move B (Copy):** 2 tokens run 2 parallel minds for 1 year.
  *   **Move C (Merge):** 1 token merges 2 parallel minds into 1 (memories integrate).
  *   **Rule:** Wall-clock time is fixed. Only subjective experience varies.

  **Timeline:**
  *   **0–10 min:** Setup. Hand out tokens. No philosophy yet.
  *   **10–35 min:** Round 1 (Speed). Teams allocate tokens to Move A. Argue internally: Is 100 years at 100x speed better than 1 year at 1x?
  *   **35–60 min:** Round 2 (Copy/Merge). Teams use Moves B & C. Must decide: Do copies count double? Is merging a death?
  *   **60–75 min:** **The Accounting.** Each team writes one final TWU number on the board.
  *   **75–90 min:** Debrief.

  **The Break:**
  The numbers will not match. One team counted minds (copies = gain), one counted subject-years (speed = gain), one penalized merging (death). The inconsistency reveals the hidden currency: are we maximizing *lives* or *experienced time*?

  **Debrief Map:**
  *   **Speed Conflict:** Hedonic duration vs. wall-clock efficiency. (Prioritarianism vs. Total Utilitarianism).
  *   **Copying:** Does welfare dilute across copies or duplicate? (Identity vs. Count).
  *   **Merging:** Is psychological continuity broken? (Psychological Continuity Theory).
  *   **Jargon:** Introduce "Functionalism," "Person-Affecting View," "Hard Problem."

  **Predictable Failures:**
  *   **"It's not real."** Participants will deny simulated pain counts.
      *   *Fix:* Enforce the rule: "Assume subjective experience is identical to yours. No dualism allowed during play."
  *   **"How is the merge coded?"** They will ask for technical specs.
      *   *Fix:* "Black box. Input: two streams. Output: one stream with both memories. That's all you know."
  *   **Consensus Paralysis:** Teams stall on the TWU definition.
      *   *Fix:* Force a vote at minute 30. You cannot spend tokens without a conversion rate.

  **The Limit:**
  The game assumes functionalism—that running the code *is* the experience. It cannot reproduce the **Hard Problem**. You must state this explicitly in the final 5 minutes: "This exercise calculates moral weight based on structure and report. It cannot determine if there is 'something it is like' to be the simulation. If functionalism is false, the TWU is zero. I cannot prove it isn't."
