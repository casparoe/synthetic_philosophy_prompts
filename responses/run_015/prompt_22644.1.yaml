prompt: |-
  I'm a third-year philosophy PhD student who has recently joined a working group on the philosophy of quantum computation, and I keep running into the conflation of two claims that are both called the "Church-Turing thesis." Please compare the ordinary Church-Turing thesis — the claim that the intuitively computable functions are exactly the Turing-computable ones — with the physical Church-Turing thesis, the claim that no physical system can compute a function that is not Turing-computable. In what precise sense does each claim go beyond the other, and why do philosophers of computation tend to treat their epistemic status differently — for instance, in terms of what would count as a refutation of each, and whether the existence of quantum computers bears on either claim?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year philosophy PhD student. This means they have a solid background in logic, metaphysics, and philosophy of science. They don't need basic definitions of Turing machines or computability theory. They need nuance, precision, and engagement with the philosophical literature.
      *   **Context:** Joined a working group on philosophy of quantum computation.
      *   **Problem:** Confusion/conflation between the "ordinary" Church-Turing Thesis (CTT) and the "physical" Church-Turing Thesis (PCTT).
      *   **Task:** Compare the two claims, explain how each goes beyond the other, explain the difference in epistemic status (verification/falsification), and address the relevance of quantum computing to each.

  2.  **Deconstruct the Two Theses:**
      *   **Ordinary CTT (Mathematical/Conceptual):**
          *   *Content:* Effective calculability = Turing computability.
          *   *Domain:* Abstract mathematics, human computation procedures, algorithms.
          *   *Status:* Definition-like, conceptual analysis, not empirically falsifiable in the standard sense (though arguably revisable based on conceptual shifts).
          *   *Key Figures:* Church, Turing, Kleene, Gandy.
      *   **Physical CTT (PCTT) (Empirical/Metaphysical):**
          *   *Content:* Every function computable by a physical system is Turing-computable. (Or: The universe is a Turing machine).
          *   *Domain:* Physics, nature, physical laws.
          *   *Status:* Empirical hypothesis, contingent truth, falsifiable by physics.
          *   *Key Figures:* Deutsch, Wolfram, Pitowsky, Hogarth.

  3.  **Address "How each goes beyond the other":**
      *   *CTT $\nrightarrow$ PCTT:* CTT is about *effective procedures* (what a human or idealized agent can do following rules). It doesn't claim that *nature* follows those rules. Nature might compute non-recursive functions via analog processes, hypercomputation, etc., without violating CTT (because nature isn't following an "effective procedure" in the human sense).
      *   *PCTT $\nrightarrow$ CTT:* PCTT says physical systems can't exceed Turing limits. It doesn't define what "effective calculability" is. One could imagine a world where PCTT holds, but our notion of "effective procedure" is narrower or broader than Turing computability (though this is less common). More importantly, PCTT is a claim about *physics*, CTT is a claim about *mathematics/logic*.

  4.  **Address Epistemic Status & Refutation:**
      *   *CTT:* Refutation requires a counter-example to the *concept* of effective calculability. If someone proposes a new model of computation that is intuitively effective but not Turing-computable, CTT falls. However, most philosophers view it as a stipulation or a robust conceptual equivalence. It's not empirically testable.
      *   *PCTT:* Refutation requires a physical device that computes a non-Turing-computable function (hypercomputation). This is an empirical matter. It depends on the laws of physics (e.g., General Relativity allowing Malament-Hogarth spacetimes, or Quantum Mechanics allowing specific types of parallelism).
      *   *Why the difference?* CTT is about the *analysis of a concept* (algorithm). PCTT is about the *structure of reality*.

  5.  **Address Quantum Computing:**
      *   *Does QC refute CTT?* No. Quantum algorithms (Shor's, etc.) compute Turing-computable functions. They might do it *faster* (complexity class BQP vs P), but they don't compute *uncomputable* functions. So, the extension of computable functions remains the same.
      *   *Does QC refute PCTT?* Standard quantum computing (gate model) does not. It fits within Turing computability. However, *hypothetical* quantum models (e.g., infinite precision, specific interpretations of QM) might challenge PCTT. Most philosophers/physicists agree standard QC respects PCTT but challenges the *Extended* Church-Turing Thesis (regarding efficiency/polynomial time).
      *   *Nuance:* Need to distinguish between the "Strong" PCTT (nothing physical computes more) and the "Efficient" PCTT (nothing physical computes more *efficiently*). QC challenges the Efficient version, not necessarily the standard PCTT.

  6.  **Drafting the Response (Iterative refinement for PhD level):**
      *   *Tone:* Academic, precise, referencing key debates.
      *   *Structure:*
          1.  Introduction: Acknowledge the conflation and state the goal.
          2.  The Ordinary CTT: Conceptual/Modal status.
          3.  The Physical CTT: Empirical/Contingent status.
