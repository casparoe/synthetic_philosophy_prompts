  8.  **Final Polish:** Ensure the language matches a PhD student's level (e.g., using terms like "intensional," "extensional," "modal status," "hypercomputation").

  **(Self-Correction Note):** I need to be careful not to say CTT is *definitely* necessary. Some (like Cotogno) argue it could be empirically refuted if our concept of algorithm evolves. But the standard view (Gandy, Shagrir) is that it's a conceptual analysis. I will present the dominant view while acknowledging the debate.

