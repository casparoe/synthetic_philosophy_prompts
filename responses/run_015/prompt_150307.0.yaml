  Taylor shook their head. "I'm not explaining it away. I'm explaining it off. As a systematic introspective error."

  "My introspection says I feel cold!"

  "Your introspection says you instantiate a non-physical property called 'coldness.' That's the misrepresentation. The physical state is real. The 'phenomenal glow' you think accompanies it is the illusion."

  "So the feeling is fake?"

  "No. The feeling is real. The 'phenomenality' is the bug."

  "How is that different from eliminativism?" Sam demanded. "If the glow isn't real, what's left?"

  "Eliminativists say you don't feel cold. I say you feel cold, you're just wrong about what 'feeling' is."

  "Well, this mistake feels pretty real."

  "Of course it does! If the illusion didn't feel real, I'd be an eliminativist. The trick isn't that you aren't conscious. It's that you think consciousness is magic."

  Sam glared. "I'm going to get a coffee. If I burn my tongue, is that an illusion?"

  "The damage is real. The 'ouch' is the UI."

  "The UI hurts!"

  "No, the UI *says* it hurts. And you believe it. That's the trick." Sam raised a fist. "I'm hitting you."

  "Go ahead," Taylor said. "But remember: Eliminativists say you won't feel it. I say you will feel it, you just won't feel what you think you feel."

  Sam punched Taylor's arm. "Ow!"

  "See?" Taylor rubbed the spot. "You felt something. You're not a zombie. But that 'Ow'? That's the bug."
