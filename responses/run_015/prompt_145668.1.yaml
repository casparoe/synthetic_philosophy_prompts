      *   Marcus concedes: Overridden obligations leave normative traces (apologies).

      *(Refining the Ending)*: The divergence is about the *ontological status of the overridden obligation*. Does it persist as a binding force (Elena) or is it transmuted into mere regret/reason (Marcus)?

  5.  **Final Review against constraints:**
