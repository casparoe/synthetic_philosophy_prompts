      *   **Intended Claims:**
          1.  Interpreting $p < 0.05$ as "5% chance of noise" is a base-rate fallacy.
          2.  In fields where most hypotheses are false, most published positives are false (Ioannidis-style claim).
      *   **Critique:** A source claims the analogy is "worse than useless."
      *   **Specific Criticisms to Address:**
          *   Hypotheses aren't sampled from a population with stable prevalence.
          *   "True effect" is continuous, not binary.
          *   $\alpha$ depends on analyst choices (p-hacking), unlike clinical calibration.
          *   The analogy smuggles in a Bayesian prior into frequentist machinery.
      *   **Tasks:**
          1.  Audit the analogy (Correspondence Table).
          2.  Identify what the screening frame imports that the target lacks.
          3.  Separate relevant disanalogies from irrelevant ones regarding the two claims.
