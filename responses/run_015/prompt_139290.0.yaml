  6.  **Drafting the Content (Iterative refinement):**

      *   *Table:* Keep it tight.
      *   *Smuggling:* Use the term "Epistemic vs. Ontological Prevalence."
      *   *Disanalogies:* Focus on the "Garden of Forking Paths" (analyst degrees of freedom) as the biggest threat to the $\alpha$ correspondence.
      *   *Ideal World:* Even with pre-reg, we don't know the Prior. So the analogy is never "exact" because the input ($\pi$) is unknowable in science, whereas in medicine it's measurable.
      *   *Remedies:* The analogy correctly identifies that Power alone doesn't save you if Prior is low. This supports the "study better hypotheses" argument over just "get bigger N."
      *   *Conclusions:* They survive because they rely on Probability Theory, not the specific nature of the entities.
      *   *Better Analogy:* "Metal Detecting on a Beach."
          *   Signal = Coin.
          *   Noise = Bottle cap.
          *   Sensitivity = Finding the coin.
