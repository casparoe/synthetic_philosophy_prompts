  # Joint Adversarial-Collaboration Doc: Access, Phenomenality, and the Silent Broadcast

  **Preface**
  Look, we're tired of the usual loop where one side says "if you can't report it, it isn't access" and the other says "you're ignoring the feel." We're trying something different here. We're locking in a specific architectural framing—the silent-broadcast model—and seeing where the actual friction points are. No citation dumping, no history lessons, just the meat of the disagreement.

  ### Part One: Agreed Claims

  1.  **The Distinction is Real Enough:** We both agree there's a useful working distinction between *phenomenal consciousness* (what it feels like) and *access consciousness* (information available for reasoning and report), even if we disagree on where the line gets drawn.
  2.  **GWT Reportability Threshold:** The GWT side predicts that for content to be verbally reported, it must achieve amplification in a global workspace that bridges sensory modules to language modules; failure to report usually implies failure to cross that threshold.
  3.  **Split-Brain Evidence:** We agree on the data: split-brain patients can show integrated, goal-directed bimanual behavior (like cooperating to dress) while simultaneously lacking a unified verbal narrative about why they're doing it.
  4.  **Silent-Broadcast Mechanics:** We agree to model a specific architecture where content can be broadcast globally to motor and planning modules without ever hitting the verbal-report buffer; mechanistically, this requires a workspace that connects perception to action but has a severed or bottlenecked link to speech production.
  5.  **Zero-Report Behavior:** We agree that there are documented cases where subjects exhibit complex, integrated non-verbal behavior indicating information usage, despite claiming zero awareness or inability to report the stimulus.

  ### Part Two: Disagreements Table

  | Issue | Hardline GWT Defender | Phenomenal-Primacy Defender |
  | :--- | :--- | :--- |
  | **Status of Silent Broadcast** | If the content is globally available to motor/planning systems, it counts as Access Consciousness, even if the speech module is locked out. | If the content cannot be verbally reported or used in deliberate reasoning, it is Phenomenal Consciousness only, not Access. |
  | **Micro-Access to Action** | Sending info to action modules *is* workspace entry; the workspace isn't just for talking, it's for doing. | Sending info to action modules is just unconscious sensorimotor looping; true workspace entry requires potential availability to the "self" system. |
  | **Split-Brain Unity** | The coordinated behavior is two unconscious systems negotiating, not one conscious agent. | The coordinated behavior proves a unified phenomenal field exists without unified access. |
  | **Labeling the "Feel"** | The "feel" is just the readout of the access state; if there's no access, there's no robust feel to track. | The "feel" is the primary datum; access is just a downstream tool that sometimes fails to capture the feel. |

  ### Part Three: The Cruxes

  **Crux 1: Does Report-Failure Always Mean Access-Failure?**
  *   **The Issue:** The GWT side tends to treat reportability as the gold standard for access. The Phenomenal side thinks report is just a noisy output channel that can break while the access remains.
  *   **Concrete Case:** A partial-report paradigm where subjects can't say what they saw but can accurately point to it with a mouse cursor without hesitation.
  *   **GWT Prediction:** The pointing is mediated by a unconscious module that doesn't qualify as full workspace access; if they could really access it, verbal report would eventually bleed through.
  *   **Phenomenal Prediction:** The pointing proves access is present; the verbal module is the bottleneck, not the consciousness itself.

  **Crux 2: Does Integration Have Intrinsic Value Over Naturalness?**
  *   **The Issue:** GWT values the computational integration (the wiring). Phenomenal primacy values the naturalness of the experience (the light being on), regardless of how well integrated the wiring is.
  *   **Concrete Case:** Split-brain patients reaching for an object with both hands in a coordinated way while denying they saw the object.
  *   **GWT Prediction:** This is high-functioning unconscious processing; integration without report is just sophisticated automation, not consciousness.
  *   **Phenomenal Prediction:** This is consciousness in its natural state; the integration proves the phenomenal field is unified, even if the access report is fractured.

  We both see the same brain mechanics but can't agree on whether unreported global access counts as consciousness or just fancy unconscious processing.
