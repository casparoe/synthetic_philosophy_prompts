prompt: |-
  I was discussing this with a colleague in economics the other day and I came away a bit confused. We were talking about the social discount rate and the Ramsey rule (r = δ + η·g), and I keep seeing peope in the climate literature treat the pure rate of time preference δ as if it's the moral core of the whole thing — the part that's doing the ethical work of deciding how much we care about future generations. But when I actually plug in the numbers, it seems like most of the discount rate comes from the η·g term, not from δ.

  So I'd like you to argue that the pure rate of time preference is actually doing less moral work than its advocates and critics both seem to think, and that the real ethical debate is about η and g — and about the pure vs. impure nature of discounting more generally. I'm especially interested in the 'fiction' of pure time preference: the idea that all real discounting is impure (arising from mortality risk, opportunity cost, uncertainty, changing tastes, and so on) and that pure time preference — caring less about a good just because it's later — is a mistake that the Ramsey rule bakes in as if it were a genuine preference.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Social Discount Rate (SDR), Ramsey Rule ($r = \delta + \eta \cdot g$), Climate Economics.
      *   **Core Observation:** The user notices that in practice, the $\eta \cdot g$ term often dominates $\delta$, yet the literature focuses heavily on the ethics of $\delta$ (pure rate of time preference).
      *   **Task:** Argue that $\delta$ does *less* moral work than commonly thought. Argue that the real ethical debate lies in $\eta$ (elasticity of marginal utility) and $g$ (growth rate).
      *   **Specific Angle:** Challenge the "fiction" of pure time preference. Argue that all real discounting is "impure" (mortality, risk, opportunity cost, etc.) and that $\delta$ is a philosophical mistake baked into the Ramsey rule.
      *   **Tone:** Persuasive, analytical, economically literate but accessible (given the colleague discussion context).

  2.  **Deconstruct the Ramsey Rule:**
      *   Formula: $r = \delta + \eta \cdot g$
      *   $r$: Social Discount Rate.
      *   $\delta$ (Delta): Pure Rate of Time Preference (PRTP). Often interpreted as "impatience" or "myopia." Ethical parameter.
      *   $\eta$ (Eta): Elasticity of Marginal Utility of Consumption. Inequality aversion/risk aversion. Ethical parameter.
      *   $g$: Growth rate of per capita consumption. Empirical/Forecast parameter (but influenced by policy).

  3.  **Address the "Dominance of $\eta \cdot g$" Argument:**
      *   *Fact Check:* Is it true that $\eta \cdot g$ dominates?
          *   Stern Review (2006): $\delta \approx 0.1\%$, $\eta = 1$, $g \approx 2\% \rightarrow r \approx 2.1\%$. Here $\eta \cdot g$ is huge compared to $\delta$.
          *   Nordhaus/Standard models: $\delta \approx 1-3\%$, $\eta \approx 1-2$, $g \approx 2\% \rightarrow r \approx 3-6\%$. Here $\delta$ is more significant, but $\eta \cdot g$ is still substantial.
      *   *Argument:* Even if $\delta$ is small (like Stern), it gets the attention. If $\delta$ is large (Nordhaus), it's justified by "market rates," masking the ethical choice. The user wants to argue $\delta$ is *conceptually* less important ethically than the combination of $\eta$ and $g$.

  4.  **Develop the "Fiction of Pure Time Preference" Argument:**
      *   *Philosophical stance:* Why do we discount the future?
      *   *Impure discounting:* Probability of extinction, personal mortality, opportunity cost of capital (investment returns), uncertainty about future needs.
      *   *Pure discounting:* "I value a util today more than a util tomorrow simply because it is tomorrow."
      *   *Critique:* This violates intergenerational equity (Ramsey, Pigou, Sidgwick). If we are acting as a "social planner" for humanity, why do we have a "myopia" parameter?
      *   *The "Baked In" Mistake:* The Ramsey rule comes from individual optimization. Applying it to society assumes society is like an individual who dies. But society (potentially) lives forever. Therefore, $\delta$ should be zero.
      *   *User's specific point:* People treat $\delta$ as the *only* ethical parameter. I need to show $\eta$ is *more* ethical.

  5.  **Shift the Ethical Burden to $\eta$ and $g$:**
      *   **$\eta$ (Inequality Aversion):** This determines how much we care about the poor (future generations might be richer or poorer). If $\eta$ is high, we transfer more to the future if they are poorer. If $\eta$ is low, we don't care as much about consumption smoothing. This is a *distributional* ethical choice.
      *   **$g$ (Growth):** This is often treated as exogenous. But in climate economics, $g$ is endogenous to damage. Also, assuming high $g$ justifies high discounting (because future people will be rich). This is an ethical assumption about progress.
      *   **The Interaction:** A low $\delta$ with a high $\eta \cdot g$ still discounts the future heavily. The "action" is in how we value consumption growth, not just time itself.

  6.  **Structure the Argument:**
      *   **Introduction:** Acknowledge the colleague's confusion. Validate the observation (the "Delta Distraction"). State the thesis: $\delta$ is a philosophical ghost; the real ethics lie in $\eta$ and the assumption of growth ($g$).
      *   **Point 1: The Mathematical Reality:** Show that $\eta \cdot g$ often dwarfs $\delta$, especially in low-discount scenarios (Stern). Even in high-discount scenarios, $\delta$ is often a proxy for opportunity cost, not ethics.
      *   **Point 2: The Fiction of Pure Time Preference:** Distinguish "pure" vs. "impure." Argue that for a social planner representing an infinite horizon, $\delta$ should be zero. It's an artifact of individual mortality applied incorrectly to society.
      *   **Point 3: The Ethical Heavy Lifting of $\eta$:** Explain $\eta$ as inequality aversion. This is where we decide how much future wealth matters relative to present scarcity. This is the real distributive justice parameter.
      *   **Point 4: The Assumption of Growth ($g$):** Challenging $g$ is an ethical act. Assuming future generations will be richer justifies sacrificing their environment now.
      *   **Conclusion:** Summarize. The debate needs to move from "How impatient are we?" ($\delta$) to "How much do we care about inequality and growth?" ($\eta, g$).

  7.  **Refine the Tone and Content:**
      *   *Avoid:* Overly technical jargon without explanation.
      *   *Include:* References to Stern vs. Nordhaus (classic debate). Mention Ramsey's own view (he thought $\delta$ should be zero).
      *   *Nuance:* Acknowledge that $\delta$ *does* matter mathematically, but argue its *ethical significance* is overstated/misunderstood.
      *   *Key Phrase:* "The Delta Distraction."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "impure" discounting point? Yes, need to explicitly list mortality, risk, etc.
      *   *Check:* Did I argue that $\eta$ is ethical? Yes, it's about marginal utility weighting.
