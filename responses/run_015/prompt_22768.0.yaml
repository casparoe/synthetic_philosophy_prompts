answer: |-
  This is a fantastic observation, and you are right to be confused. The economics profession, particularly in the climate change debate, has spent decades fighting a war over $\delta$ (the pure rate of time preference) while the real ethical artillery is hidden in $\eta$ (the elasticity of marginal utility) and the assumptions surrounding $g$ (growth).

  You have identified what I call the **"Delta Distraction."** It allows economists to signal ethical virtue by lowering $\delta$ (like the Stern Review) while maintaining high discount rates through $\eta \cdot g$, or conversely, to justify high discount rates by claiming $\delta$ reflects "market reality" rather than ethical choice.

  Here is the argument for why $\delta$ is a philosophical fiction, why it does less moral work than advertised, and why the real ethical battleground lies in $\eta$ and the nature of impure discounting.

  ### 1. The Mathematical Reality: $\delta$ is Often the Tail, Not the Dog
  Your colleague noticed that when you plug in the numbers, $\eta \cdot g$ dominates. Let's look at the two poles of the climate debate to prove this.

  *   **The Stern Review (2006):** Stern chose a near-zero $\delta$ (0.1%) to show ethical concern for the future. However, he used $\eta = 1$ and assumed growth $g \approx 2\%$. The resulting discount rate was roughly **2.1%**. Here, **95% of the discounting** came from $\eta \cdot g$, not $\delta$.
  *   **The Nordhaus Standard:** Nordhaus and others often use a higher $\delta$ (around 1–3%) based on observed market rates. But they also use $\eta \approx 1.5$ and $g \approx 2\%$. The resulting rate is **4–5%**. Even here, the $\eta \cdot g$ component is contributing equally or more to the final rate than $\delta$.

  The debate focuses on whether $\delta$ should be 0.1% or 3%. But in both cases, the *mechanism* that actually drives the intergenerational transfer is the assumption that future consumption will be valued differently due to growth ($g$) and inequality aversion ($\eta$). By fixating on $\delta$, we ignore the engine room of the discount rate.

  ### 2. The Fiction of "Pure" Time Preference
  You hit on a crucial philosophical point: **Pure time preference is an artifact of individual mortality incorrectly applied to society.**

  In individual finance, discounting the future is rational. I might prefer \$100 today to \$100 tomorrow because:
  1.  **Mortality:** I might die before tomorrow.
  2.  **Impatience:** My psychological wiring prefers immediate gratification.
  3.  **Risk:** The promise of tomorrow's money might not be kept.

  This is **impure discounting**. It arises from factual constraints on human life and uncertainty.

  However, the Social Discount Rate is supposed to represent a "social planner" acting on behalf of humanity. Humanity, as a dynasty, does not have a biological expiration date. Therefore, the "mortality" argument for $\delta$ vanishes. The "impatience" argument implies that the collective welfare of future citizens is intrinsically worth less than current citizens simply because of their location in time.

  Frank Ramsey, the father of the Ramsey Rule, explicitly called pure time preference a "practice which is ethically indefensible and arises merely from the weakness of the imagination." By baking $\delta$ into the social welfare function, we are treating the state as if it were a mortal individual. This is a category error. If we accept that all *legitimate* discounting is impure (based on risk, opportunity cost, or marginal utility), then $\delta$ is not an ethical parameter at all; it is a modeling error.

  ### 3. The Real Ethical Heavy Lifting: $\eta$ (Inequality Aversion)
  If we strip away the fiction of $\delta$, the ethical burden shifts entirely to $\eta$. This is where the real moral philosophy lives, yet it is often treated as a technical calibration.

  $\eta$ determines how the marginal utility of consumption changes as people get richer.
  *   **High $\eta$:** We care deeply about inequality. An extra dollar to a poor person is worth much more than an extra dollar to a rich person.
  *   **Low $\eta$:** We are relatively indifferent to consumption smoothing.

  In the Ramsey rule, $\eta \cdot g$ discounts the future because we assume future generations will be **richer** ($g > 0$). If they are richer, the marginal utility of their consumption is lower, so we are less obligated to sacrifice current consumption to help them.

  **This is the real ethical debate:**
  1.  **Are we allowed to assume the future will be richer?** In climate economics, assuming high $g$ is risky. If climate damages crush growth, $g$ could fall or turn negative. If $g$ is negative, $\eta \cdot g$ becomes negative, implying we should *save more* for a poorer future. By treating $g$ as exogenous and positive, we bake in an assumption of technological triumphalism that ethically licenses current emissions.
  2.  **How much do we value consumption growth?** A high $\eta$ implies we should transfer wealth to the future *unless* they are significantly richer. A low $\eta$ implies we can consume now because their extra wealth won't matter much.

  Debating $\delta$ is asking, "How much do we dislike waiting?" Debating $\eta$ is asking, "How much do we care about the relative welfare of the poor versus the rich?" The latter is clearly the more profound ethical question.

  ### 4. The "Impure" Justification for $\delta$
  Proponents of a non-zero $\delta$ often argue it represents **opportunity cost** or **uncertainty**. They say, "Capital is productive, so future goods are cheaper."

  But this is circular. Capital is productive *because* we invest in it. We invest in it *because* we discount the future. You cannot use the market rate of return (which includes $\delta$) to justify the social discount rate (which determines the market rate of return).

  If the argument for $\delta$ is actually **uncertainty** (e.g., risk of extinction, risk that climate policy fails), then that should be modeled explicitly as a probability hazard rate, not hidden inside a "pure time preference" parameter. Calling it $\delta$ masks the fact that we are making a specific claim about existential risk. If we are honest, we would say, "We are discounting the future because there is a 1% chance humanity goes extinct next year," not "We discount the future because we have a pure rate of time preference of 1%."

  ### 5. Conclusion: Moving the Goalposts
  The fixation on $\delta$ allows economists to have a "moral" debate that is actually quite shallow.
  *   **The Ethical Purists** fight for $\delta \approx 0$ (Stern), thinking they have saved the future. But if they leave $\eta$ high and $g$ high, they still justify significant discounting.
  *   **The Market Realists** fight for $\delta > 0$ (Nordhaus), claiming they are respecting market signals. But they are actually respecting current capital scarcity, which is a result of *past* ethical choices about saving.

  The argument you should present to your colleague is this: **$\delta$ is a ghost.** It is a holdover from individual utility theory that has no place in intergenerational ethics.

  The real ethical lever is **$\eta$**, because it dictates how we weigh the welfare of the rich against the poor. And the real empirical/ethical assumption is **$g$**, because assuming perpetual growth is a wager on the future's ability to absorb our sins.

  If we want to do the ethical work honestly, we should set $\delta = 0$ (acknowledging the infinite horizon of society), model uncertainty and mortality explicitly as hazard rates (impure discounting), and have a fierce, transparent debate about $\eta$ and the sustainability of $g$. That is where the moral core of the climate economy actually lives.
