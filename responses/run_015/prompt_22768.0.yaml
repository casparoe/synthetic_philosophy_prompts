      *   *Potential Pitfall:* If $\delta = 0$, then $r = \eta \cdot g$. If $g$ is positive, we still discount. I need to make sure I explain why this is *better* ethically (it's based on welfare, not arbitrary time bias).

  9.  **Final Polish:** Ensure the distinction between *descriptive* (market rates) and *prescriptive* (ethical) approaches is clear, as this is central to the climate debate. (Proceed to generate output).

