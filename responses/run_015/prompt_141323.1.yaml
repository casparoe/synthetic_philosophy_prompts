  If you could demonstrate a method to count "meaningful options" without weighting them—perhaps via topological connectivity rather than state count—I would upgrade the novelty. My reasoning might be wrong because I'm assuming "reachable set" implies discrete states; if you define it as continuous capability space, the spam objection might dissolve. I'm also reasoning from theoretical properties, not implementation. If you built a prototype where inferring "principal capacities" from observation worked better than hand-coded utility, that would flip my verdict on practicality. Specifically, if you show that modeling human capacity is empirically easier than modeling human preferences in a household setting, the "smaller ask" claim holds water. I am skeptical because capacity models often require preference data to validate, but if you have data showing otherwise, that changes the cost-benefit analysis. Show me that the relocated value burden is actually lighter to carry in practice, not just in theory.
