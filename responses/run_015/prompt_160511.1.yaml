  **CONFIDENTIAL: OFFICE OF COGNITIVE ARCHITECTURE**
  **TO:** All Regional Directors
  **FROM:** Head of Talent Optimization
  **SUBJECT:** Competency, Grading and Credit-Assignment Framework (v4.2)
  **DATE:** 1 October 2024

  **1.0 GRADE CLASSIFICATION AND LIABILITY**

  1.1 **Darwinian Grade:** Personnel exhibit fixed response profiles. Improvement occurs only via lineage replacement. Training budgets are zero. Termination is the sole correction mechanism for performance deviation.

  1.2 **Skinnerian Grade:** Personnel modify behavior based on direct environmental feedback. Learning requires actual consequence ingestion. Training budgets are denominated in realized losses (errors, client churn, safety incidents). Loss tolerance must be calibrated to lifetime value.

  1.3 **Icarian Grade:** Personnel possess internal modeling capabilities but lack behavioral inhibition based on model output. They simulate failure scenarios accurately but proceed with the action regardless. Compensation covers simulation labor plus loss recovery costs. They are distinct from Popperians in that the model's verdict carries no executive authority.

  1.4 **Popperian Grade:** Personnel pre-screen actions via internal simulation. Failed hypotheses die internally. Field trials are prohibited for scenarios successfully simulated, as field testing constitutes waste of distinguishing competence. Loss budgets are near-zero.

  1.5 **Gregorian Grade:** Personnel function as hosts for external cognitive artifacts (language, notation, software, procedures). Competence resides in the artifact, not the host.

  **2.0 MIND-TOOL ATTRIBUTION AUDIT**

  2.1 For Gregorian-grade personnel, output credit must be reassigned from the biological host to the utilized artifacts.

  2.2 In cases where a spreadsheet model generates a forecast, the spreadsheet is the competent party. The spreadsheet is eligible for promotion, equity retention, and authorship credit.

  2.3 The biological host is reclassified as a hosting and maintenance cost. Compensation is limited to caloric intake, hardware interface upkeep, and artifact loading/unloading procedures.

  2.4 Performance reviews for Gregorian staff must be conducted in the presence of their primary mind tools. Removing the tools during review invalidates the assessment, as the host reverts to Skinnerian baseline capabilities without them.

  2.5 Offsite teambuilding events must restrict access to external artifacts. This allows management to assess the host's standalone viability. Expect significant performance degradation during these periods.

  **3.0 ICARIAN BAND ARCHITECTURE**

  3.1 Icarian staff are salaried at a premium relative to Skinnerians due to the complexity of their internal simulation, despite similar loss profiles.

  3.2 Management must not confuse Icarian simulation with Popperian inhibition. An Icarian employee will explicitly state, "My model predicts a crash," and then proceed to crash. This is not insubordination; it is architectural.

  3.3 Losses incurred by Icarian staff are billable to the "Simulation Validation" line item, distinct from Skinnerian "Ignorance" losses.

  **4.0 DOCUMENT AUTHORITY AND AUTHORSHIP**

  4.1 This framework is a Gregorian artifact. It confers competence upon the reader only insofar as the reader hosts the text.

  4.2 The author of this document is subject to the Mind-Tool Attribution Audit. The author is the host for this framework, not the originator. The framework itself is the competent party.

  4.3 Any authority perceived in the author is a property of the document template, not the biological entity. The entity is eligible for maintenance stipends only.

  **5.0 APPENDIX: FORWARDING HISTORY**

  > **From:** J. Miller (Skinnerian Grade, Logistics)
  > **To:** Head of Talent Optimization
  > **Subject:** Re: Framework v4.2
  >
  > I read the memo. I touched the hot stove. I learned not to touch the hot stove. The memo says I am less efficient than the spreadsheet that didn't touch the stove. The spreadsheet did not feel the burn. I did. Who gets the bonus for knowing the stove is hot? The thing that never touched it, or the hand that healed? I am asking for the loss budget to be recognized as tuition, not waste.

  **6.0 IMPLEMENTATION**

  6.1 Effective immediately. All Gregorian promotions are hereby transferred to the respective software licenses. Hosts will be notified via email.

  ***

  The audit reveals the author is merely a host for this text, implying he possesses no authority to have written it other than what the document lends him. \answer{Gregorian}
