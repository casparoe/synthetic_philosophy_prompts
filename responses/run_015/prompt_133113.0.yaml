answer: |-
  ### Strategic Framing and Rejections

  Before prioritizing specific questions, we must discard the framings that will waste your six to eight researcher-years. Given the "no frontier access" constraint, the default instinct is to run empirical ablation studies on open-weight models (e.g., "Does Debate improve Llama-3-70B on MMLU?"). **I reject this framing.** It is scientifically invalid for alignment. Deception and sophisticated obfuscation are capabilities that scale non-linearly; demonstrating that Debate works on models incapable of deep deception tells us nothing about its performance when deception is the binding constraint. Positive empirical results on small models are false positives; only negative results (counterexamples) are informative.

  Second, I reject the **"Taxonomy-First" framing** (Candidate 1 in your list). While classifying obfuscation is intellectually satisfying, it is downstream of mechanism design. Knowing *how* a model lies does not tell us if the incentive structure *prevents* lying. A taxonomy is a map of the battlefield, not a strategy for winning the war. Funding a taxonomy without first establishing that the battle is winnable is premature optimization.

  Third, I reject the **"Consolidation" framing** (Candidate 6). Whether Debate is distinct from Recursive Reward Modeling (RRM) or Forecasting is a semantic and portfolio-construction question, not a truth-seeking one. If Debate fails on its own merits, its relationship to RRM is irrelevant. If it succeeds, the label doesn't matter. This is a question for a portfolio manager, not a research strategist trying to determine technical viability.

  **The Correct Framing:** We must treat Debate as a **mechanism design problem under epistemic uncertainty**. The core constraint is not model capability, but information asymmetry between the debaters and the judge. The research must focus on *formal guarantees* and *complexity bounds* that hold regardless of scale, validated by small-scale experiments only where they serve as existence proofs for failure modes. We are not asking "Does this work now?" but "Can this work in principle, and what are the necessary conditions?"

  ---

  ### The Prioritized Research Agenda

  Here is the dependency-aware ordering. Note that Question 1 is a gate: if the answer is negative, the rest of the portfolio loses most of its value.

  #### 1. The Verifiability Boundary (Refining Candidate 5)
  *   **The Question:** What is the formal class of functions/tasks for which a "short certificate" exists that a weaker judge can verify, but a stronger agent is required to generate? Specifically, can we characterize the alignment-relevant task space (code audit, policy reasoning, scientific synthesis) in terms of computational complexity classes (e.g., NP vs. P) relative to the judge's capability?
  *   **Why Upstream:** If the tasks we care about (e.g., "Does this AGI architecture contain a treacherous turn?") do not admit short, verifiable certificates, Debate is fundamentally the wrong tool. No amount of mechanism tweaking fixes a task that is irreducibly hard to check.
  *   **Tractability (No Frontier):** High. This is primarily a theoretical computer science and formal epistemology question. Small models can be used to generate toy domains (e.g., simplified code environments) to test if "verification is easier than generation" holds empirically in microcosms.
  *   **Neglect:** High. Most debate literature assumes decomposability is possible. Few are rigorously defining the *limits* of decomposability.
  *   **18-Month Deliverable:** A formal paper defining "Debate-able Functions" with a set of counterexamples (tasks where debate fails provably) and a positive existence proof in a toy domain.
  *   **Move Condition:** If we prove that high-stakes alignment tasks fall outside the "Debate-able" class, funding shifts away from Debate entirely.

  #### 2. The Recursive Stability Problem (Refining Candidate 4)
  *   **The Question:** In a bootstrapping regime where the judge is a previous iteration of the debater (or improved by the debate output), under what conditions does the system converge to truth versus collapsing into a consistent, high-confidence falsehood? Is there a "capability gap" threshold where the judge becomes too weak to distinguish sophisticated lies from truth, causing the system to lock in error?
  *   **Why Upstream:** Even if tasks are verifiable (Q1), we need to scale oversight. If the feedback loop is unstable, we cannot use Debate to align systems smarter than the initial judge. This is the core risk of scalable oversight.
  *   **Tractability (No Frontier):** Medium. Requires building formal dynamical systems models or agent-based simulations. Small models can simulate the "judge" and "debater" roles to observe oscillation or collapse in simplified environments.
  *   **Neglect:** Medium. Often hand-waved as "iterative amplification." The specific failure mode of *collusive convergence* (both debaters and judge agreeing on a lie) is under-explored theoretically.
  *   **18-Month Deliverable:** A phase diagram of the debate dynamics showing regions of stability (truth-tracking) vs. instability (collapse), parameterized by judge capability and debater asymmetry.
  *   **Move Condition:** If the "stable region" shrinks to zero as capability gaps widen, Debate is unsafe for bootstrapping.

  #### 3. The Asymmetry of Attack vs. Defense (Refining Candidate 1 & 3)
  *   **The Question:** What is the computational cost ratio between generating a plausible obfuscation and verifying it? Does the "Steelman-Swap" or similar symmetric mechanisms actually alter this ratio, or do they just add overhead? We need to know if the defender (truth) has a structural disadvantage against the attacker (lie) in the limit of complexity.
  *   **Why Upstream:** Depends on Q1 (tasks must be verifiable) but informs mechanism design. If attack is asymptotically cheaper than defense, no incentive scheme saves us.
  *   **Tractability (No Frontier):** High. Can be studied via adversarial puzzles in formal logic or code where one agent tries to hide a bug and another tries to find it.
  *   **Neglect:** Low. Many study obfuscation, but few measure the *cost ratio* formally.
  *   **18-Month Deliverable:** Empirical measurement of the "Lie/Verify Cost Ratio" across 3-5 distinct domains (logic, code, natural language inference) using open-weight models, plus a theoretical bound.
  *   **Move Condition:** If the cost ratio favors the liar significantly (>10x) in complex domains, we must fund defensive mechanism research (like Q4) heavily or abandon Debate.

  #### 4. Long-Horizon Incentive Compatibility (Merging Candidates 2 & 6)
  *   **The Question:** In a repeated game with a precedent library, does the incentive to maintain consistency with past (potentially flawed) rulings outweigh the incentive to correct errors? Does the "public record" create a ratchet effect for deception?
  *   **Why Upstream:** Depends on Q2 (stability). This is about deployment dynamics.
  *   **Tractability (No Frontier):** Medium. Game-theoretic modeling of repeated games with imperfect monitoring.
  *   **Neglect:** High. Most debate research is one-shot. Real deployment is iterative.
  *   **18-Month Deliverable:** A game-theoretic model of "Precedent-Based Debate" identifying conditions under which error-correction is a Nash equilibrium.
  *   **Move Condition:** If the model shows that "consistent lying" is a dominant strategy in repeated play, we need external auditing mechanisms (outside the debate loop).

  ---

  ### Explicit Trade-Off: The Rejection

  **I recommend against funding Candidate 6 (Consolidation) and Candidate 3 (Steelman-Swap) as primary pillars.**

  *   **Why Candidate 6 (Consolidation) fails:** It is a categorization exercise. Knowing that Debate is a subset of RRM (or vice versa) does not solve the alignment problem. It helps with portfolio branding, not risk reduction. In a resource-constrained environment, "mapping the territory" is less valuable than "checking if the ground is solid."
  *   **Why Candidate 3 (Steelman-Swap) fails as a pillar:** It is a specific mechanism tweak, not a foundational question. Funding a specific variant puts the cart before the horse. We should fund Question 3 (Asymmetry) above; if the asymmetry is too high, *then* we test variants like Steelman-Swap as mitigations. Funding the variant before understanding the asymmetry is optimization without a loss function.

  ### The 60% Bet: Recursive Stability (Question 2)

  If I had to place sixty percent of the fund behind a single question, it would be **Question 2: The Recursive Stability Problem.**

  **Reasoning:**
  1.  **Existential Weight:** Question 1 (Verifiability) is a binary gate. If tasks aren't verifiable, we know immediately and can pivot. But Question 2 is the *dynamic* risk. Even if tasks are verifiable in principle, a system that *appears* to work but silently converges to a consistent falsehood is more dangerous than one that fails loudly. This is the "sycophancy on steroids" risk.
  2.  **Constraint Fit:** This question is uniquely suited to theory + small models. You do not need frontier models to model dynamical systems collapse. You need mathematicians and game theorists, which fits your "no frontier training" constraint perfectly.
  3.  **Decision Value:** The answer directly determines if Debate can be a *scaling* mechanism. If bootstrapping is unstable, Debate is limited to static query tasks (low value for AGI alignment). If it is stable, it becomes a core pillar.

  **Condition for Payoff:**
  For this bet to pay off, the grantees must produce a **formal proof or a robust simulation** demonstrating that there exists a non-vanishing region of parameter space where a weaker judge can reliably improve a stronger model without locking in error.
  *   **Success:** We have a theorem stating "If Judge Capability > X% of Debater Capability, and Mechanism = Y, then Convergence to Truth is guaranteed."
  *   **Failure:** We prove that for any fixed judge capability, there exists a debater capability where the system bifurcates into falsehood.

  **Honest Flag:** This ordering depends on the empirical fact that *alignment tasks are decomposable*. If Question 1 returns a hard "No" in the first 6 months, the priority shifts immediately to abandoning Debate for mechanisms that don't require decomposition (e.g., interpretability or latent knowledge elicitation). My prioritization assumes Question 1 is "plausible but unproven," which is the current consensus. If that consensus is wrong, this agenda is moot.
