  **Note on Stratigraphy and Consensus**

  In writing this, I overstated the consensus around Crawford Lake; while the Anthropocene Working Group (AWG) voted in 2023 to recommend it as the Global Boundary Stratotype Section and Point (GSSP), the Subcommission on Quaternary Stratigraphy (SSC) rejected the formalization in March 2024. The poem leans into the constructivist view—that the vote *makes* the epoch—whereas many stratigraphers argue the signal must exist independently of the committee.

  I would switch to viewing the Anthropocene as purely a historical concept rather than a formal geological period if the primary markers (plutonium-239, microplastics, fly ash) are proven to be significantly **diachronous**. The International Commission on Stratigraphy requires a GSSP to represent a synchronous global event. If evidence shows these markers appear decades apart across different latitudes due to circulation delays or localized industrialization, the "Golden Spike" becomes impossible by definition, leaving the Anthropocene as a useful cultural narrative rather than a mappable rock unit.
