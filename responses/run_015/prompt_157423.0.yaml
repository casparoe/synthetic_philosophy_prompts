      *   **Goal:** Disambiguate the slogan into distinct theses, evaluate their truth status (platitude, defensible, false), identify which version the interlocutor likely used, and explore if a coherent materialist position can accommodate meaningful institutional independence (relative autonomy/overdetermination) without collapsing into tautology or abandoning materialism.
      *   **Constraints:** No bibliography, no reading list, no textual exegesis. Focus on conceptual clarification for diagnosing the workshop move.

  2.  **Deconstruct the Slogan ("Base Determines Superstructure"):**
      *   The phrase is famously from Marx's 1859 *Preface to A Contribution to the Critique of Political Economy*.
      *   It is often treated as a dogma, but in serious theory, it's a heuristic or a structural claim with varying degrees of strength.
      *   I need to break this down into specific causal/structural models.

  3.  **Drafting the Menu of Theses:**
      *   *Thesis 1: Strong Reductive Determination.* (Vulgar Marxism). Economic facts directly cause legal facts. One-to-one mapping.
      *   *Thesis 2: Functional Adaptation.* (Functionalist Marxism). Legal institutions exist *because* they serve the economy. Teleological.
      *   *Thesis 3: Structural Constraint (Determination in the Last Instance).* (Althusserian/Engelsian). The economy sets the limits, but doesn't dictate the content.
      *   *Thesis 4: Causal Primacy without Direct Causation.* (Structuralist). The economic structure is the dominant structure in a specific social formation, but other structures have their own efficacy.

  4.  **Evaluating the Theses (Platitude, Defensible, False):**
      *   *Strong Reductive:* False. Too simplistic, ignores historical evidence of legal lag or divergence.
      *   *Functional Adaptation:* Defensible but risky. Can become tautological ("it exists so it must be useful"). Needs mechanism.
      *   *Structural Constraint:* Defensible. The "limits" argument is robust.
      *   *Causal Primacy:* Defensible. Distinguishes dominance from creation.

  5.  **Diagnosing the Interlocutor:**
      *   They used the slogan to *reject* the claim of genuine independence.
      *   This suggests they are likely operating with *Strong Reductive Determination* or a crude version of *Functional Adaptation*. They treat "determination" as "direct causation" rather than "setting limits."
      *   This is a "theoretical closure" move to shut down the argument about autonomy.

  6.  **Addressing "Relative Autonomy" and "Overdetermination":**
      *   Can materialism accommodate independence? Yes.
      *   *Relative Autonomy (Althusser/Poulantzas):* The superstructure is distinct and has its own effectivity, but is ultimately determined by the base *in the last instance*. The "last instance" never comes, allowing for actual autonomy in the meantime.
      *   *Overdetermination (Althusser):* Contradictions in the base are displaced into the superstructure. The legal form isn't just a mirror; it's a site where economic contradictions are worked out politically.
      *   *Tautology Risk:* If "determination in the last instance" just means "everything is material eventually," it's empty. To avoid this, "determination" must mean "structuring structure" (defining the field of possibility) rather than "efficient cause."
      *   *Materialist Core:* Retained if the *conditions of possibility* for legal autonomy are themselves materially grounded (e.g., division of labor, surplus value allowing a professional legal class).

  7.  **Refining the Output (Tone and Structure):**
