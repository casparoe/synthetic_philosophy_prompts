answer: |-
  Good evening. I'm a senior at this high school. I'm asking you to vote for the coalition's proposal: two social workers, a restorative-practices coordinator, and a written protocol that sends certain incidents to them instead of to an officer.

  I know this room is divided. I know some see this as removing safety. I don't. My uncle is a county deputy. Last spring, a teacher I trust called our SRO when a student brought a weapon to school. That was the right call. I am not asking you to shame her, or to pretend our school is a war zone. The officers here are not brutes. I respect their service, but I question placing them as the primary response to student distress.

  But this vote isn't just about budget lines or specific tasks. It's about what my civics teacher calls the standing-capacity question. Even across a school year in which nobody is handcuffed or tasered, the fact that armed state force is permanently standing by is itself supposed to be doing something to all of us. It changes the air we breathe. It tells us what kind of help is guaranteed. Part of what you are voting on is whether we want that guarantee to define our daily lives. We are asking if safety should feel like surveillance or support. That presence is a policy choice, not just a precaution. It shapes how we walk down the hall.

  The real shift is the default-answerer question. Not who shows up for the worst thing, but who answers first when a kid is in crisis and somebody calls for help. Because that default, more than any dollar figure, is what the vote really reassigns.

  I know there is a deadlock I keep failing to resolve. The coalition's protocol still routes weapons and assaults to the police. My abolitionist friends say that's proof the alternative has never really been tried. The Chief says it's proof the alternative can't work. I'd rather say something true about that deadlock than paper over it. We are admitting that for immediate physical danger, we still call the state. But for everything else—the grief, the disruption, the mental health crisis—we are choosing a different first responder. This isn't a perfect solution, but it is an honest transition. It acknowledges reality while changing the default.

  We are not pretending police will never enter this building. We are deciding they should not be the first option for every problem.

  Please vote to renew the contract only if you believe armed presence is the best default for student crisis. Otherwise, vote to allocate the $430,000 to the social workers and coordinator. That is the choice before you tonight.
