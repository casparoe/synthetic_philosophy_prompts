answer: |-
  This is an exceptionally clear set of intuitions. You have done the hardest part of philosophy: you have isolated the data points that any theory must explain. The wall you have hit is the classic distinction between *causal responsibility* (physical counterfactuals) and *normative responsibility* (duties and roles). In cases of omission, ordinary language almost always smuggles the normative into the causal. We do not call something a "cause" unless we think it *should* have been otherwise.

  Here is the extraction of your principle, the audit of your cases, the resolution of your dilemmas, and the application to your new scenarios.

  ### 1. The Extracted Principle

  You suspected you were using two principles (one about "activity," one about "sets"). I propose you are actually using one unified principle with three necessary clauses. An omission counts as a **cause** in the ordinary/blame-relevant sense if and only if:

  1.  **Capacity:** The agent physically could have performed the action.
  2.  **Specific Normative Expectation:** The agent was under a specific obligation to act, generated by a role, promise, contract, or participation in a rule-governed system (distinguishing them from the general public).
  3.  **Non-Redundant Necessity:** Given the actual behavior of others, the agent's action was necessary to prevent the outcome (i.e., no one else was guaranteed to do it instead).

  ### 2. The Audit: Which Case Forces Which Clause?

  Here is how your nine verdicts map onto the three clauses.

  *   **Clause 1 (Capacity):**
      *   **Forced by Case 3 (The Non-Swimmer).**
      *   *Reasoning:* You exonerate the tourist explicitly because she *cannot* swim. If capacity were not required, her moral failure to try would be a cause. This clause establishes that "ought implies can."

  *   **Clause 2 (Specific Normative Expectation):**
      *   **Forced by Case 7 (Charity) vs. Case 6 (Tennis).**
      *   *Reasoning:* This is the core of your wall. In both cases, you had capacity and foresight. The difference is that Tennis is a **closed system** with allocated responsibilities (the ball is "yours" to deal with by the rules of the game). Charity is the **open sphere** of general morality. This clause explains why Case 1 (On-duty), Case 4 (Promise), and Case 6 (Tennis) are causal, while Case 3, Case 5 (Guest), and Case 7 are not. It defines "activity" not as physical motion, but as *assumption of care*.

  *   **Clause 3 (Non-Redundant Necessity):**
      *   **Forced by Case 9 (Twenty Bystanders) vs. Case 8 (Two Keys).**
      *   *Reasoning:* In Case 8, Guard A *needed* Guard B. Both were necessary. In Case 9, Bystander A did *not* need Bystander B; any one of the twenty could have solved it. Because there were 19 backups, Bystander A's omission was **redundant**. Ordinary language refuses to call a redundant failure a "cause" because it wasn't the *decisive* difference. This clause handles the collective action problems.

  ### 3. The Hard Truth: Case 2 and the Break Point

  You asked me to tell you honestly which verdict the principle cannot keep.

  **The principle requires you to reassign Case 2 (Off-Duty Lifeguard) to match Case 3 (Tourist).**

  *   **Why:** The Off-Duty Lifeguard fails **Clause 2**. She has the *capacity* (Clause 1), and she is likely *non-redundant* (Clause 3, assuming no one else is there), but she has no *specific normative expectation*. She is not on shift; she made no promise; she is not playing a game. She is legally and normatively a bystander.
  *   **What you give up:** If you accept this, you must admit that "causation" in omissions is not about *ability* or *knowledge*, but about *status*.
  *   **The Cost:** This clashes with the moral intuition that "if you can save a life at no risk, you should." But note: you can hold that she is **morally blameworthy** without saying she **caused** the death. Ordinary language often separates "You let him die" (blame) from "You killed him" (causation). Your essay will be stronger if you argue that Case 2 feels different from Case 1 precisely because we are conflating *moral blame* with *causal attribution*. In Case 1, she is to blame *because* she caused it (breach of duty). In Case 2, she is to blame *despite* not causing it (breach of humanity).

  **If you refuse to reassign Case 2:** You must broaden Clause 2 to include "Professional Identity regardless of shift." But this risks collapsing into Case 7 (I am a human with resources, therefore I have a duty). If you make Case 2 causal, you struggle to explain why Case 7 is not, unless you rely on arbitrary proximity.

  ### 4. Deciding the New Cases (10–12)

  Applying the Three-Clause Principle:

  **Case 10: The Automated Assistant**
  *   **Verdict:** **Your omission caused the zero.** The assistant's did not.
  *   **Reasoning:**
      *   *Assistant:* Fails Clause 1 (Capacity). An algorithm has no agency; it cannot "choose" to email. It is a tool.
      *   *You:* Pass Clause 1 (You could have entered the instruction). Pass Clause 2 (You set up the system, assuming the role of sender). Pass Clause 3 (No one else was going to do it).
      *   *Nuance:* You might feel the assistant "failed," but in ordinary language, we trace the cause back to the last human agent who controlled the parameters.

  **Case 11: The Carbon Monoxide Detectors**
  *   **Verdict:** **The current post-holder (or the District) caused it.** The past official did not.
  *   **Reasoning:**
      *   *Past Official:* Fails Clause 3 (Non-Redundant Necessity). Two years is a vast temporal gap. Many intervening agents (new officials, inspectors, maintenance crews) had the opportunity to rectify the omission. The chain of specific expectation was severed when they left the post.
      *   *Current Post-Holder:* Passes all clauses. The duty attaches to the *office*, not the person. The person currently holding the office has the specific expectation to review safety protocols.

  **Case 12: The Flood Barrier (1970 vs. 2025)**
  *   **Verdict:** **The Councillors' omission did not cause the deaths.**
  *   **Reasoning:**
      *   *Fails Clause 3 (Non-Redundant Necessity) and Time.* Over 55 years, countless intervening variables arise. Did the town zone that land for housing? Did maintenance fail later? Did climate change alter the river flow?
      *   *The "Intervening Agency" Problem:* In ordinary language, causation fades when other agents have the chance to intervene. By 2025, the responsibility to protect current residents lies with the *current* council, not the one from 1970. To blame the 1970 council is to treat the intervening 55 years of human agency as non-existent.

  ### 5. The Surprising Test Case

  Here is a case constructed to test your **Clause 2 (Specific Normative Expectation)** against your **Clause 1 (Capacity)**. I predict this will unsettle you.

  **Case 13: The Reluctant Substitute**
  > A school teacher falls ill. The principal asks a parent volunteer (Case A) to supervise the class. The parent says, "No, I'm not qualified," and leaves. The principal then asks a passing janitor (Case B) to supervise. The janitor says, "That's not my job," and continues mopping. The class is left unsupervised; a student is injured.
  >
  > *   **Parent (Case A):** Was asked, has capacity, but explicitly declined the role.
  > *   **Janitor (Case B):** Was asked, has capacity, relies on job description to decline.

  **My Principle's Verdict:**
  *   **The Parent (Case A) caused the injury.** By engaging with the request and then refusing, they entered a "negotiation of care." However, a stricter reading of my principle suggests **Neither caused it; the Principal did.**
  *   **Wait, here is the surprise:** My principle suggests **The Principal caused the injury**, not the Parent or Janitor.
      *   *Why?* The Parent and Janitor both fail **Clause 2**. Neither accepted the Specific Normative Expectation. The Parent declined; the Janitor cited role boundaries. The duty to ensure supervision never successfully transferred. It remained with the Principal (who has the ultimate institutional duty).
  *   **Why this is surprising:** Most people intuitively want to blame the Janitor for "hiding behind the rules" or the Parent for "abandoning the kids." But if we stick to your rule that causation requires a *settled* duty (Case 1, 4, 6), then refusing the duty prevents the omission from becoming causal. The cause remains with the person who held the duty *before* the failed handover.

  **Challenge for your essay:** If you find Case 13's verdict (blaming the Principal, not the refusers) wrong, then your definition of "Specific Normative Expectation" needs to include *reasonable reliance*. Did the Principal rely on them? If so, does the *creation of that reliance* create the duty, even if refused? This is where your essay can deepen: does the cause lie in the *breach of duty* or in the *creation of vulnerability*?

  ### Summary Advice for the Essay
  Your intuition that "activity" matters is correct, but refine "activity" to **"assumption of specific responsibility."**
  1.  Accept that Case 2 must logically align with Case 3 if you want a consistent rule about *causation*, even if Case 2 remains *blameworthy*.
  2.  Use Case 9 to argue that omissions require **non-redundancy** to be called causes.
  3.  Use Case 13 to explore whether a duty can be created by the *expectation of others* even without formal agreement.

  You have the data. Now you have the rule. The essay writes itself from here.
