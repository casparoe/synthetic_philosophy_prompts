      *   **Problem:** They have strong intuitions about specific cases (1-9) but can't articulate the underlying principle/rule distinguishing "causal omissions" from "non-causal omissions."
      *   **Goal:** Extract the rule, test it against the provided cases, identify break points, apply it to three new cases (10-12), and generate a surprising test case.
      *   **Tone:** Academic, rigorous, honest, helpful, but not doing the work *for* them (guiding their thinking).
      *   **Key Constraint:** The user defines "cause" in the ordinary sense relevant to blame, not necessarily a strict metaphysical or scientific sense.

  2.  **Deconstruct the User's Verdicts & Intuitions:**
      *   *Case 1 (On-duty Lifeguard):* Causal. (Duty + Ability + Context).
      *   *Case 2 (Off-duty Lifeguard):* Causal (but unsure). (Ability + Knowledge, but no formal duty).
      *   *Case 3 (Non-swimming Tourist):* Non-causal. (No Ability).
      *   *Case 4 (Housemate Promise):* Causal. (Assumed Duty/Promise).
      *   *Case 5 (Guest):* Non-causal. (No Duty).
      *   *Case 6 (Tennis):* Causal. (Participation in a game/system).
      *   *Case 7 (Charity):* Non-causal. (General moral duty, but no specific engagement).
      *   *Case 8 (Two Keys):* Both Causal. (Conjunctive necessity).
      *   *Case 9 (Twenty Bystanders):* Collective Causal, Individual Non-causal. (Disjunctive sufficiency / Overdetermination).

  3.  **Identify the Underlying Principle(s):**
      *   The user suspects: "Non-performance of something within an activity the agent was already running."
      *   *Critique:* This covers Case 1 (Job), Case 4 (Agreement), Case 6 (Game). It struggles with Case 2 (Off-duty lifeguard isn't "running an activity" regarding that pool, yet the user leans towards causal). It struggles with Case 8 & 9 (Structural relationships).
      *   *Better Formulation:* The distinction seems to rely on **Normative Expectation within a Specific Context**. It's not just "activity," it's about *role* or *assumption of care*.
      *   *The "Cause" vs. "Condition" distinction:* In ordinary language, we call something a "cause" when it violates a norm we expected to hold. A bare absence is a condition; a normative breach is a cause.
      *   *Refining the Rule:* An omission causes an outcome if:
          1.  The agent had the capacity to prevent it.
          2.  There was a specific normative expectation (duty, role, promise, participation) placing the burden on *that* agent.
          3.  The omission breached that expectation.

      *   *Addressing Case 2:* Why does the user feel Case 2 is causal but different from Case 1? Because of *skill* + *proximity*, but lacks the *institutional role*. If we stick to "ordinary language cause," Case 2 is often treated as *morally* blameworthy but not *causally* responsible in the same legal/institutional sense. However, the user wants to say "caused." This suggests the rule needs to accommodate "capacity + proximity" even without formal duty, OR the user needs to accept Case 2 is non-causal (like Case 3/5/7).
      *   *Addressing Case 6 vs 7:* Tennis = participation in a rule-governed system where specific responsibilities are allocated. Charity = general moral sphere where responsibilities are diffuse.
      *   *Addressing Case 8 vs 9:* Case 8 is *Necessary Conjunction*. Each is necessary. Case 9 is *Sufficient Disjunction*. Each is sufficient, but none are necessary. This is the "Overdetermination" problem.

  4.  **Drafting the Rule (Iterative Process):**
      *   *Attempt 1:* You cause by omission if you had a duty. (Fails Case 2 potentially, doesn't explain 8/9 well).
      *   *Attempt 2:* You cause by omission if you were part of a system designed to prevent the harm. (Good for 1, 4, 6, 8, 9. Bad for 2).
      *   *Attempt 3 (The "Specific Reliance/Expectation" Rule):* An omission counts as a cause when the agent occupies a position where others (or the system) rely on them to act, creating a specific expectation distinct from general moral duties.
      *   *Let's look at the User's tentative rule:* "Non-performance of something within an activity the agent was already running."
      *   *Refinement:* Let's call it the **"Specific Normative Engagement"** principle.
      *   *Clause A:* Capacity (Could have done it).
      *   *Clause B:* Specific Expectation (Duty/Role/Promise/Game Rule).
      *   *Clause C:* Counterfactual Dependence (If acted, outcome changes) - *Wait, Case 9 breaks this.* In Case 9, if *one* pulls, outcome changes. So counterfactual dependence holds for individuals in Case 9. But the user says individual *didn't* cause it. Why? Because their action wasn't *necessary*.
      *   *Correction on Case 9:* In Case 9, if Bystander A pulls, fire stops. So "If A had acted, fire wouldn't spread." Counterfactual dependence holds. But the user says A didn't cause it. This implies the rule requires **Necessity** in the specific context, or that the "cause" is distributed. Actually, in ordinary language, if 20 people could push a button and none do, we blame the *situation* or the *group*, not Bob #4. This suggests a **Uniqueness/Non-Redundancy** clause.

  5.  **Synthesizing the Principle:**
      *   **The Principle of Normative Necessity within a System.**
      *   1. **Capacity:** Agent could have acted.
      *   2. **Specific Obligation:** Agent was under a specific obligation (role, promise, game rule, contract) distinct from general morality.
      *   3. **Non-Redundancy:** The agent's action was necessary for the prevention *in that specific context* (i.e., no one else was guaranteed to do it instead).

      *   *Testing against cases:*
          *   1 (Lifeguard On): Fits all 3.
          *   2 (Lifeguard Off): Fails #2 (No specific obligation). *This forces the user to choose.*
          *   3 (Tourist): Fails #1 & #2.
          *   4 (Housemate): Fits #2 (Promise).
          *   5 (Guest): Fails #2.
          *   6 (Tennis): Fits #2 (Game rules).
          *   7 (Charity): Fails #2 (General morality).
          *   8 (Two Keys): Fits #3 (Both necessary).
          *   9 (Twenty Bystanders): Fails #3 (None necessary individually).

  6.  **Addressing the Hard Questions:**
      *   *Case 2:* If we keep the rule strict, Case 2 becomes Non-Causal (like Case 3). What is given up? The intuition that "ability + knowledge" creates causation. We admit that causation in omissions is normative, not physical.
      *   *Case 10 (Automated Assistant):* Who caused it? The assistant is a tool. The user set it up but failed to program. The user's omission (programming) is the cause. The assistant has no agency.
      *   *Case 11 (CO Detectors):* Official left 2 years ago. Current administration failed. The *system* caused it, or the *current* post-holder. The past official is too remote (breaks chain of reliance).
      *   *Case 12 (Flood Barrier 1970):* Too remote. Many intervening factors (did people build there knowing the risk? Did maintenance fail later?). Causation fades over time due to intervening agency.

  7.  **Constructing the "Surprising" Case:**
      *   Need something that fits the rule but clashes with intuition.
      *   *Idea:* A case where someone has a duty, but their action wouldn't have changed the outcome (Pre-emption), vs. a case where they have no duty but their action would have.
      *   *Better Idea:* The "Relief Worker" case.
      *   *Scenario:* A relief worker is scheduled to deliver food. He sleeps in. Another worker, not scheduled, sees the need and also decides not to help (maybe he's off duty). The people starve.
      *   *Twist:* What if the scheduled worker *did* show up, but the truck broke down?
      *   *Let's try:* **The Backup Guard.**
      *   *Scenario:* Guard A is on duty. Guard B is the designated backup if A fails. A falls asleep. B sees A asleep but decides not to take over (B is paid to wait in the break room unless called). Harm happens.
      *   *Rule verdict:* A caused it (Primary duty). B did not (No trigger for duty).
      *   *Intuition:* B looks blameworthy for not stepping in.
      *   *Alternative:* **The Easy Rescue with a Twist.** A parent watches a child. A stranger stands next to them. Child drowns. Parent: Causal. Stranger: Non-causal. *Now add:* The parent is paralyzed. Stranger is not.
      *   *Rule:* Parent (Duty) -> Causal (even if unable? No, Capacity is required). Stranger (No Duty) -> Non-causal.
      *   *Surprising Case:* **The Contracted Replacement.**
      *   I hire a nurse to care for my sick grandmother. I go on holiday. The nurse quits without telling me. No one else comes. Grandmother dies.
      *   *Verdict:* The nurse caused it (Duty). I did not (Transferred duty).
      *   *Surprise:* Many feel I still bear responsibility because it's my grandmother. The rule says I don't (causally).

  8.  **Refining the Output Structure:**
      *   Acknowledge the sophistication of the student's work.
      *   State the extracted principle clearly.
      *   Map the clauses to the cases (The "Audit").
      *   Address the Case 2 vs 3 dilemma honestly.
      *   Apply to 10, 11, 12.
      *   Present the Surprising Case.

  9.  **Self-Correction/Nuance Check:**
      *   *Case 9:* The user says "the group's collective failure caused it, but no individual bystander did." This is the **Overdetermination** problem. My rule needs to handle "Necessity." In Case 9, no individual is necessary. So the rule must state: *An individual omission causes the outcome only if that individual's action was necessary to prevent it, given the actual behavior of others.*
      *   *Case 2:* The user is "least sure." I should highlight that this is the fracture point in ordinary language. Legally, Case 2 is usually non-causal/non-liable. Morally, it's grey. I need to tell them that if they want a consistent rule, Case 2 must align with Case 3 or Case 1. Aligning with 1 stretches "activity." Aligning with 3 preserves the "Normative Expectation" rule.
      *   *Case 10:* The assistant is an instrument. The omission is the user's failure to program.
      *   *Case 11:* Chain of responsibility. The "post" causes it, or the current holder. The past official is severed.
      *   *Case 12:* Temporal distance and intervening causes (people choosing to live there, maintenance, etc.).

  10. **Final Polish:** Ensure the tone is encouraging but critical (in the academic sense). Make sure the "Surprising Case" is distinct from the provided 12.

      *(Self-Correction on Case 9)*: Wait, in Case 9, if *any* one pulls, it works. So if Bystander 1 *had* pulled, the fire stops. So the outcome *counterfactually depends* on Bystander 1's action. Why does the user say Bystander 1 didn't cause it? Because there were 19 others who *also* could have. It's the **Security/Redundancy** factor. If there are 19 others, my failure isn't the *difference maker* in a robust sense. I need to incorporate **Non-Redundancy**.

      *(Refining the Principle)*:
      1.  **Capacity:** Could have acted.
      2.  **Specific Normative Expectation:** Duty/Role/Promise (distinguishes 1,4,6 from 3,5,7).
      3.  **Non-Redundant Necessity:** Given what others actually did, this agent's action was required to stop the outcome (distinguishes 8 from 9).

      *Wait, Case 2 again:* Off-duty lifeguard. No Specific Normative Expectation (formally). But maybe "Professional Identity" counts? No, that blurs into Case 7 (I am a rich person, I could donate). The cleanest cut is Formal/Assumed Duty. I will advise the user that Case 2 is the weak link that forces a choice between "Moral Capacity" vs "Normative Role."

