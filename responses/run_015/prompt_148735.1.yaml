  Look, I love this example. It's stylish, it's introspective, and it's exactly the kind of poetic nonsense people come up with to protect their inconsistencies from the cold hard light of logic. You and your roommate were arguing about whether you're irrational? Your roommate was right. Not because your weekend sounds unpleasant, but because you've just handed me a map to your wallet.

  You asked if you're open to a money pump. The answer is yes. Absolutely. And the "temporal self-frame" defense doesn't save you; it just makes the pump more efficient because I know exactly when to catch you off guard.

  Here's the transaction. I'm not going to ask you to do anything impossible. I'm just going to offer you trades based on the preferences you literally just told me you hold.

  **The Pump:**

  1.  **Friday Morning:** I come to you. You currently hold a voucher for **Plan B** (the loud party). I know that right now, in your "Future-planning" frame, you prefer **A** (Reading) over **B**. I offer to swap your B voucher for an A voucher, plus I'll throw in a nice cup of coffee, but you have to pay me $5 for the administrative fee of the swap. You agree. Why? Because A > B for Friday You. You're now holding **A**, and you're $5 poorer.
  2.  **Saturday Morning:** I come back. You're holding **A**. But now you're in your "Present-experiencing" frame. You told me Saturday You prefers **B** (Dancing) over **C** (Writing). But do you prefer B over A? If your loop is real (A > B > C > A), then B is higher up the chain than A in the global cycle, or at least, Saturday You is restless. Let's say I offer you a swap from A to **B**. Saturday You looks at Reading (A) and thinks, "I'm done with this." You prefer the energy of B. I charge you another $5 fee to switch. You agree. You're now holding **B**, and you're $10 poorer.
  3.  **Sunday Morning:** I return. You're holding **B**. Now you're in your "Reflective-evaluating" frame. You told me Sunday You prefers **C** (Writing) over **A** (Reading). And since you just cycled through, you're burnt out. You look at B (the party hangover) and you want relief. You want **C**. I offer to swap B for **C**. Another $5 fee. You agree because C > A and you're tired of B. You're now holding **C**, and you're $15 poorer.
  4.  **Next Friday:** You're holding **C**. But guess what? The cycle resets. Friday You is back. Future-planning You looks at Writing (C) and says, "No, I need to prepare, I need Reading (A)." A > B > C implies A > C. I offer to swap C for **A**. You pay me another $5.

  You are back where you started. You have **Plan A**. But you are $20 lighter. And if you keep living this way, I can do this to you every single weekend for the rest of your life. You are literally paying for the privilege of spinning in circles.

  Now, I know what you're going to say. You're going to say, *"Dr. Thorne, Saturday Me wouldn't agree to that trade because Friday Me already decided."*

  Here's why that doesn't work. If Saturday Me *doesn't* agree to the trade, then Saturday Me is violating Saturday Me's own preference (B > C, or B > A). You're saying that Saturday You is a slave to Friday You. But if Saturday You is a slave, then Saturday You doesn't actually *prefer* B; Saturday You just obeys. That means your stated preference was a lie. It wasn't a preference; it was a whim you overruled.

  But if Saturday You *does* have agency—and you said these are distinct self-frames with their own reasoning—then Saturday You will take the deal. And if Saturday You takes the deal, you get pumped.

  You can't have it both ways. You can't claim these are genuine preferences that drive your reasoning and then claim they don't drive your actions when the bill comes due.

  As for your "outfit" analogy? It's charming, but it fails on the cost basis. If changing outfits was free, sure, wear what you want. But if every time you changed shirts you had to pay a tailor $50, and you cycled through Shirt A, Shirt B, and Shirt C just because "the weather changed," you'd be bankrupt. Rationality isn't about wearing the same outfit every day; it's about not paying a tailor to stitch your clothes into a knot.

  The "temporal self" argument is just a way to fragment your agency so you don't have to take responsibility for the loss. But there is only one bank account. There is only one body getting burnt out. If your "selves" are fighting each other so badly that they create a cycle, then *you*—the composite entity—are irrational.

  So, here's my challenge to you, since you think you can opt out: If you know this cycle happens, why don't you pre-commit on Thursday night? Why not lock in A and refuse all trades? If you say, "I can't," then you're admitting you're powerless against your own future selves, which is a failure of rational agency. If you say, "I could, but I don't want to," then you're admitting you *prefer* to lose the $20 for the sake of the experience. But if you prefer losing the $20, then your preference isn't A > B > C; your preference is "Cycle > Money." And if that's the case, stop telling me it's a loop of plans. Admit you just like burning cash for drama.

  Which is it? Are you trapped in the loop, or are you paying for the ride? Either way, I'm holding the pump.
