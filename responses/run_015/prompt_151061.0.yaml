answer: |-
  Let's map the terrain first, just to ensure we're standing on the same ground before we diagnose the fracture in your reasoning.

  **The Landscape**
  1.  **The Argument from Illusion:** Starts with the premise that a veridical perception (seeing a tree) and a subjectively indistinguishable hallucination (seeming to see a tree) must share a fundamental mental nature. This is the **Highest Common Factor (HCF)** principle. If the subject can't tell them apart from the inside, the immediate object of awareness must be the same (e.g., a sense-datum or an internal representation).
  2.  **The Disjunctivist Response:** McDowell, Snowdon, and Martin reject the HCF. They argue the disjunction: *Either* I am perceiving the tree (a relational state involving the actual tree), *or* I am hallucinating (a state that merely seems like perceiving). They claim these are fundamentally different kinds of mental states, not two species of a common genus.
  3.  **The Phenomenal Contrast:** The disjunctivist wants to preserve the intuition that in the good case, the world itself is present to consciousness (Naïve Realism), without being forced to say the world is present in the bad case.

  **The Diagnosis**
  You have identified a tension, but your derivation of "eliminativism about hallucination" relies on a specific equivocation regarding what the disjunctivist is denying.

  Here is exactly where your reasoning goes wrong: **You are conflating the *constituents* of an experience with the *existence* of the experience's phenomenal character.**

  Your argument runs like this:
  1.  Disjunctivism says there is no common mental factor between veridical perception and hallucination.
  2.  Phenomenal character ("what it's like") is a mental factor.
  3.  Therefore, in a hallucination, there is no phenomenal character ("nothing it's like").
  4.  Therefore, hallucinations don't exist (eliminativism).

  The error is in step 2. When McDowell or Martin says there is "no common factor," they are making a metaphysical claim about what *constitutes* the nature of the state, not a phenomenological claim about whether the state feels like something.

  **The Correction**
  Let's unpack the Martin line, since he is the most rigorous on this specific point. Martin agrees that if you are hallucinating, there is genuinely "something it is like" for you. He does not deny the phenomenology. He denies that the *source* or *ontological ground* of that phenomenology is the same in both cases.

  In the veridical case, the phenomenal character is constituted by the actual properties of the tree interacting with your sensitivity. The tree is a constituent of the experience.
  In the hallucinatory case, there is no tree. Therefore, the phenomenal character cannot be constituted by the tree.

  Your worry is: "If the tree isn't constituting the experience, and there's no common 'inner movie' (sense-data) replacing it, then what is left? Nothing."

  This assumes that for an experience to have a phenomenal character, it must be built out of *intrinsic qualitative properties* (qualia) that are shared across both cases. Disjunctivists reject this assumption. They argue that the phenomenal character of the hallucination is real, but it is **negatively characterized**.

  Here is the crucial distinction:
  *   **Common Factor View:** The hallucination has a positive nature (e.g., an internal image) that matches the veridical perception's internal nature.
  *   **Disjunctivist View (Martin):** The hallucination has no positive nature that matches the veridical perception. Its nature is defined entirely by the fact that it is *indistinguishable* from the veridical perception.

  So, when you say, "there's literally nothing it's like for me," you are assuming that "what it's like" requires a shared positive ingredient. Disjunctivism says: "What it's like" in the hallucination is simply the brute fact that the subject cannot distinguish it from a case where the world is present. The phenomenology is real, but it is a "mask" without a underlying shared substance.

  **Why this isn't Eliminativism**
  Eliminativism would claim: "You aren't actually having an experience when you hallucinate."
  Disjunctivism claims: "You are having an experience, but it is not the kind of experience that involves a relation to an external object, nor is it the kind of experience that involves an internal object. It is a primitive state of seeming."

  The hallucination is not nothing. It is a mental event. It has causal powers (it can scare you, make you reach out). It has phenomenal character (it feels like seeing). It simply lacks the *relational structure* of the veridical case, and it lacks the *internal object structure* of the sense-data theorist's case.

  **Addressing the Indistinguishability Premise**
  You asked: *"Why is it presented as a reply to the argument from illusion rather than just flatly denying the premise that hallucination and perception are subjectively indistinguishable?"*

  Disjunctivists *accept* subjective indistinguishability. They do not deny that from the first-person perspective, the two cases feel the same. If they denied indistinguishability, they would be empirically wrong (subjects report they can't tell the difference).

  The Disjunctivist move is to sever the link between **Epistemic Indistinguishability** and **Ontological Sameness**.
  *   **Argument from Illusion:** Indistinguishable $\rightarrow$ Same Mental Kind.
  *   **Disjunctivism:** Indistinguishable $\nrightarrow$ Same Mental Kind.

  They argue that just because two states feel the same to the subject, it doesn't follow that they are made of the same metaphysical stuff. To assume otherwise is to beg the question in favor of internalism.

  **The Verdict**
  Your reasoning collapses because you treat "phenomenal character" as a *shared object* that must exist for the experience to exist. You assume that if the veridical case is constituted by $X$ (world) and the hallucination is not $X$, and they share no $Y$ (qualia), then the hallucination is constituted by $\emptyset$ (nothing).

  Disjunctivism posits that the hallucination is constituted by $Z$, where $Z$ is a non-relational, non-qualitative state of "seeming." $Z$ is not nothing. It is a genuine mental occurrence. It just doesn't share a genus with the veridical perception other than the negative fact of indistinguishability.

  The error is the inference from **"no common constitutive factor"** to **"no phenomenal character."** Disjunctivism denies the former to save the directness of perception, but it fully affirms the latter to avoid eliminativism. The hallucination is a real state with a real feel; it is just not a state of seeing.
