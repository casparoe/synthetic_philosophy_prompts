answer: |-
  ### Session Plan: The Politics of Naming Genocide

  **1. The Explanatory Dependency Arc**
  Before students can grasp why the definition of genocide is political, they must accept that the label is **performative**. You cannot discuss the politics of naming until the concept of **Legal Consequence** is established. If "genocide" were merely a descriptive historical term like "holocaust" or "catastrophe," the definition would be academic. Because it is a trigger for international intervention, sanctions, and liability under the 1948 Convention, the boundary of the definition determines the boundary of obligation.
  *   **Step 1:** Establish that naming creates liability (The "So What?" Factor).
  *   **Step 2:** Contrast Lemkin's holistic vision (culture + biology) with the Convention's narrowed text (biology/physics only).
  *   **Step 3:** Demonstrate how the gap between Step 1 and Step 2 allows states to admit harm while denying obligation.

  **2. The Carrying Case: Bosnia (Srebrenica)**
  Use the Srebrenica massacre to illustrate the gap between Lemkin's concept and the Convention's application.
  *   **The Facts:** Bosnian Serb forces killed approximately 8,000 Bosniak men and boys (physical destruction) and systematically destroyed mosques, libraries, and homes (cultural destruction).
  *   **The Legal Outcome:** International courts ruled this genocide based on the intent to physically destroy the male population of the group. The destruction of cultural symbols, while prosecuted as war crimes or crimes against humanity, did not count toward the *genocide* conviction.
  *   **The Lesson:** Under Lemkin's original framework, the erasure of Bosniak culture in the region was constitutive of genocide. Under the 1948 Convention, it was legally invisible as genocide. This shows the Convention "grabbed" the physical killing but discarded the cultural erasure, proving the definition is a filter, not a mirror.

  **3. Misconception Absorption Sequence**
  Do not address these as abstract objections; absorb them into the narrative flow where they naturally arise.

  *   **Misconception 1: "It's just semantics."**
      *   **Where to absorb:** **Step 1 (Legal Consequence).**
      *   **How:** When a student suggests the definition is just wordplay, immediately pivot to the 1948 Convention's Article 1 ("undertake to prevent and to punish"). Explain that semantics determine whether a UN Security Council resolution passes or whether a state faces sanctions. If it were just semantics, states would not fight so hard to avoid the label.
  *   **Misconception 2: "Intent is obvious if bodies pile up."**
      *   **Where to absorb:** **Step 2 (The Carrying Case).**
      *   **How:** When discussing Srebrenica, students will assume the killing proves the intent. Correct this by highlighting the legal distinction between "killing many people" and "intent to destroy the group *as such*." Explain that the court had to prove the men were killed *to end the group's existence*, not just to win a battle. This clarifies why the cultural destruction (which proves intent to erase the group's identity) was legally sidelined despite being evidentially relevant to Lemkin's view.
  *   **Misconception 3: "Without the genocide label there's no serious duty."**
      *   **Where to absorb:** **Step 3 (The Political Gap).**
      *   **How:** When concluding on the exclusion of cultural harm, students may argue that other laws (Human Rights) cover the rest. Counter this by explaining the hierarchy of crimes. Genocide is the "crime of crimes." By narrowing the definition to physical destruction, the international community created a hierarchy where cultural erasure is treated as less urgent, reducing the political will to intervene until bodies are already stacking up.

  **4. The Check for Understanding**
  Do not ask them to define genocide. Instead, present a **Policy Scenario**:
  *   *Scenario:* "A state admits to forcibly removing children from a minority group and banning their language, resulting in high suicide rates but no direct mass executions. They argue this is not genocide under international law."
  *   *Task:* Ask the students to explain *why* the state is legally safe despite the moral horror, and what specific obligation the state is avoiding by relying on the 1948 definition rather than Lemkin's.
  *   *Success Metric:* They must articulate that the state is exploiting the exclusion of "cultural destruction" and "intent to physically destroy" to avoid the specific duty to prevent and punish under the Convention.

  **5. Deliberate Omissions**
  To keep the focus on the politics of naming rather than legal technicalities, leave out:
  *   **ICJ Jurisprudence:** Do not dive into specific case citations (e.g., *Bosnia v. Serbia*) or the nuances of state responsibility vs. individual criminal liability.
  *   **Draft Convention Clauses:** Do not show the specific text of the deleted "cultural genocide" articles from the 1948 drafting process. It is enough to know they were removed, not exactly how they were phrased.
  *   **Threshold Debates:** Avoid discussing the "in part" quantitative thresholds (how many people constitute a "part"), as this distracts from the qualitative shift from culture to biology.

  Verdict: The definition of genocide is not a measurement of harm, but a political filter that determines which harms trigger international obligation.
