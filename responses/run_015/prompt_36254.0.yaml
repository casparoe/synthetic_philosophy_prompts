answer: |-
  ### The Requirements of Adequacy for the Boundary Problem

  To defend a principle of inclusion for the electorate (*demos*), your theory must satisfy specific logical, empirical, and functional constraints. Below are the requirements any adequate solution must meet, categorized by the type of constraint they impose.

  #### 1. The Logical Constraint: Non-Circularity
  *   **The Requirement:** The principle used to define the *demos* cannot presuppose the existence of the *demos* it seeks to define. You cannot claim "the people should vote on who belongs to the people," because you must already know who "the people" are to hold that vote.
  *   **Motivating Consideration:** The **Constitutive Paradox**. If the boundary is set by a democratic vote, the vote is illegitimate because the boundary was undemocratically set prior to the vote.
  *   **Status:** **Non-Negotiable.** This is a logical precondition for democratic legitimacy. Any theory that relies on a prior democratic decision to establish the electorate commits a performative contradiction.

  #### 2. The Empirical Constraint: Classification of Standard Cases
  *   **The Requirement:** The principle must offer a principled classification for standard edge cases in democratic theory. It cannot ignore them or treat them as anomalies.
  *   **Motivating Cases:**
      *   **Children:** Usually excluded (capacity?), but why not lower the age?
      *   **Tourists:** Usually excluded (temporary presence?), but they are affected by local laws.
      *   **Permanent Residents:** Usually included in local elections, excluded in national (stake vs. citizenship?).
      *   **Convicted Criminals:** Varies by jurisdiction (forfeiture of rights vs. universal suffrage?).
      *   **Citizens Abroad:** Often retain voting rights (national membership?) despite lacking local affectedness.
      *   **Future Generations:** Affected by environmental policy but cannot vote (representation vs. inclusion?).
  *   **Status:** **Mixed.**
      *   *Non-Negotiable:* The theory must *address* these cases with internal consistency.
      *   *Camp Preference:* The specific *outcome* for each case. For example, a cosmopolitan camp prefers including permanent residents and expats; a civic-republican camp may prefer excluding them to prioritize active participation. However, a theory that classifies tourists as full voters while excluding permanent residents without a strong distinguishing reason fails on coherence.

  #### 3. The Conceptual Constraint: Maintaining Distinctions
  *   **The Requirement:** The principle must distinguish between three distinct modes of relation to the state: **Affectedness** (impact on interests), **Subjection** (coercion by law), and **Stakeholdership** (long-term membership/commitment).
  *   **Motivating Consideration:** Conflating these leads to absurdity.
      *   If *Affectedness* = Membership, then a foreign investor affected by tax law votes (over-inclusion).
      *   If *Coercion* = Membership, then a prisoner subject to penal code votes (contested, but distinct from a tourist).
      *   If *Stake* = Membership, then future generations are excluded despite high impact (under-inclusion).
  *   **Status:** **Non-Negotiable.** Collapsing these distinctions renders the theory incapable of explaining why we treat residents differently from tourists, or citizens differently from foreign nationals.

  #### 4. The Functional Constraint: Institutional Stability (Boundedness)
  *   **The Requirement:** The principle must allow for a *demos* that is stable enough to deliberate and decide over time. The boundary cannot shift so radically with every policy decision that the political unit dissolves.
  *   **Motivating Consideration:** **The Problem of the Shifting Demos.** If the electorate changes completely based on who is affected by Issue A vs. Issue B, there is no continuous body to enforce decisions or maintain accountability.
  *   **Status:** **Non-Negotiable.** Democracy requires an institution. An institution requires a stable membership. A principle that makes the *demos* fluid to the point of non-existence fails functionally.

  ---

  ### The Incompatibility Thesis: Affectedness vs. Boundedness

  You suspect that the demand that "everyone affected be included" and the demand that "the demos remain a bounded, deliberating unit" are jointly unsatisfiable. **You are correct.** This is the central tension in modern democratic theory.

  1.  **The All-Affected Principle (AAP):** If taken literally, AAP implies that anyone whose interests are impacted by a decision must have a vote. Because modern decisions (climate change, economic markets, war) have global ripple effects, the "affected" community is often global or indeterminate.
  2.  **The Boundedness Requirement:** A functioning democracy requires a fixed constituency to authorize representatives, debate laws, and accept collective responsibility.
  3.  **The Conflict:** If you satisfy AAP strictly, the *demos* becomes unbounded and fluid (violating Functional Stability). If you satisfy Boundedness strictly, you inevitably exclude affected outsiders (violating AAP).

  **Resolution Strategies:**
  To write a successful paper, you cannot simply assert AAP. You must modify it. Common modifications include:
  *   **All-Subjected Principle:** Restricting the *demos* to those subject to the *coercive* power of the state (narrows "affected" to "governed").
  *   **Proxy Representation:** Including future generations or affected outsiders via guardians or representatives rather than direct suffrage.
  *   **Issue-Specific Demoi:** Accepting fluid boundaries for specific referenda while maintaining a core citizenship for general governance (complex administratively).

  If you defend AAP without addressing how to maintain a stable unit, your theory will be normatively attractive but institutionally impossible.

  ---

  ### Brief Scoring of Major Principles

  | Principle | Non-Circularity | Standard Cases | Conceptual Distinctions | Functional Stability |
  | :--- | :--- | :--- | :--- | :--- |
  | **All-Affected Interests** | **Pass** (External criterion) | **Fail** (Over-includes tourists/foreigners; struggles with future gens) | **Fail** (Collapses affectedness with membership) | **Fail** (Leads to fluid/unbounded *demos*) |
  | **All-Subjected to Coercion** | **Pass** (External criterion) | **Pass** (Explains residents vs. tourists well) | **Pass** (Distinguishes coercion from impact) | **Pass** (Stable boundary based on jurisdiction) |
  | **Stakeholder/Citizenship** | **Risk** (Often relies on prior legal status) | **Pass** (Aligns with current intuitions on expats/criminals) | **Pass** (Focuses on long-term commitment) | **Pass** (Highly stable) |

  **Summary:** The **All-Subjected** principle currently offers the strongest balance between normative justification and functional stability, though it struggles with children and future generations. The **All-Affected** principle is normatively powerful but functionally untenable without significant modification.
