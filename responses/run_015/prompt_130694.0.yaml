answer: |-
  **The Diachronic Bind: Temporal Slices and the Hitchhiker's Promise**

  The Parfitian hitchhiker scenario is a staple of decision theory for a reason. It lays bare the tension between local and global rationality. You are stranded in the desert; a driver offers a lift on the condition that you pay £100 upon arrival. The driver is an adept mind-reader who will only drive you if they believe you will actually pay. Once you are safely in the city, however, the causal leverage is gone: paying costs you money and gains you nothing, as you are already saved. Standard Causal Decision Theory suggests you should not pay. Yet, if you do not pay, you would not have been picked up, and you would be dead.

  Your tutor described this as 'rational irrationality', but your intuition regarding the unity of the self strikes at a deeper metaphysical nerve. If we model the agent not as a persisting substance but as a sequence of temporal slices—distinct stages linked by psychological continuity—the problem transforms. If the 'city slice' possesses a veto power over commitments made by the 'desert slice', does the promise retain any force? This essay argues that while a strict veto model renders pre-commitment empty and leads to diachronic tragedy, a rational coalition of slices is not only possible but necessary for agency. Consequently, the hitchhiker argument survives, but only by establishing that the temporal slice cannot hold absolute sovereign veto power without ceasing to be part of a rational agent.

  To understand the stakes, we must first clarify the ontology of the temporal slice. On this view, often associated with perdurantism, you are not a single entity enduring through time. Rather, you are a series of person-stages. The 'desert stage' ($t_1$) and the 'city stage' ($t_2$) are numerically distinct, linked merely by memory and causal dependence. In a robust version of this model, $t_2$ inherits the resources of $t_1$ but is not logically bound by $t_1$'s contracts. If $t_2$ has veto power, it can review the promise made in the desert and reject it as locally irrational.

  The case against the hitchhiker argument under this model is formidable. If the driver knows the metaphysics of the situation, they know that $t_1$ is essentially bargaining with a stranger. $t_1$ wants to survive, but $t_2$ only wants to retain wealth. Since $t_2$ has veto power, $t_2$ will keep the £100. The driver, anticipating this veto, refuses the lift at $t_1$. The result is that the agent dies in the desert. This suggests that if we grant temporal slices absolute veto power, pre-commitment is indeed empty talk. The 'promise' is merely a noise made by one entity that another entity is under no obligation to honour. In this light, the requirement to pay looks like a demand that one slice sacrifice itself for the benefit of a different slice, which violates the standard conception of instrumental rationality.

  However, this 'veto power' argument relies on a subtle contradiction regarding the interests of the slices. It assumes that $t_2$ is distinct enough to reject $t_1$'s obligations, yet connected enough to care about the money $t_1$ saved. If $t_2$ truly exercises a veto, it severs the practical identity of the agent. By refusing to pay, $t_2$ signals that it does not recognise $t_1$ as part of its own narrative. But if $t_2$ does not recognise $t_1$, on what grounds does $t_2$ claim ownership of the body or the bank account? The resources $t_2$ seeks to protect were secured by the cooperation of $t_1$ (and earlier slices). To accept the benefits of past coordination while rejecting the costs is a form of free-riding within the self.

  This leads us to the case for the rational coalition. We can view the sequence of temporal slices not as a democracy where every stage has a veto, but as a hierarchy or a binding pact. For an agent to function over time, the slices must form a coalition that binds itself against local deviations. This is not magic; it is a matter of policy. Rationality should not be defined merely as maximising utility at the present moment ($t_2$), but as maximising utility across the entire temporal sequence. If $t_2$ exercises its veto, it establishes a policy that 'promises made by earlier slices need not be kept'. This policy inevitably filters back to $t_1$ (via the driver's prediction). $t_1$, knowing this policy is in place, cannot secure the lift.

  Therefore, the rational coalition argument posits that $t_2$ is rationally compelled to pay, not because $t_1$ has authority over $t_2$, but because $t_2$'s own welfare depends on the integrity of the system that produced it. The 'veto' is theoretically available but practically suicidal. A slice that exercises veto power over diachronic commitments is like a crew member on a lifeboat refusing to bail water because they didn't drill the hole: technically, they are distinct from the hole-driller, but functionally, they sink together. To be a rational agent is to adopt a 'global' perspective that overrides the 'local' perspective of the current slice.

  Critics might argue this begs the question. It assumes the slices *should* care about the global outcome. But why should $t_2$ care about $t_1$'s survival? $t_1$ is gone. This is where the defence of the hitchhiker argument must be firm. If we accept that $t_2$ has no reason to care about $t_1$, we must accept that planning for the future is also irrational. Why should $t_1$ save for retirement if the retirement slice is a stranger who might veto the spending? If the veto power is absolute, agency dissolves entirely. We become a series of ephemeral sparks with no capacity for projects, promises, or prudence. Since we clearly do engage in planning and promising, the model of the agent as a sequence of slices with absolute veto power is descriptively false regarding practical reason.

  The hitchhiker argument, therefore, acts as a *reductio ad absurdum* against the sovereignty of the temporal slice. It demonstrates that rational agency requires a constraint on the veto power of the present moment. The 'self' is a project of coordination. For the hitchhiker to be picked up, the city slice must be the kind of slice that pays. This means the disposition to pay must be embedded in the agent's character prior to arrival. The payment is not an isolated transaction at $t_2$; it is the execution of a programme initiated at $t_1$.

  In conclusion, the hitchhiker argument holds, but it forces us to refine our model of the self. If we model the agent as temporal slices with absolute veto power, the argument fails, and the agent dies in the desert. This outcome is not a victory for the slice model; it is a demonstration of its incompatibility with survival. The rational coalition view is superior because it acknowledges that the unity of the self is a functional necessity, not just a metaphysical given. The veto power of the present slice must be subordinate to the diachronic rationality of the whole. Therefore, the hitchhiker must pay. To do otherwise is to exercise a veto that destroys the very conditions of the agent's existence. Rationality is not about what the current slice can get away with; it is about what the sequence of slices must do to remain a sequence capable of action. The cold coffee in your cup is there because a past version of you decided to buy it; the future version of you should not veto the enjoyment of it simply because they did not pay the cashier. Agency is a binding pact, and the hitchhiker's £100 is the price of membership.
