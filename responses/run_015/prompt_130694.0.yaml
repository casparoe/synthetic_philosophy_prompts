      *   *The Conflict:* Slice $t_1$ (in the desert) wants Slice $t_2$ (in the city) to pay. Slice $t_2$ wants to keep the money. If $t_2$ has veto power, $t_1$'s promise is worthless. The driver knows this, so $t_1$ dies.
      *   *The Question:* Can rational slices bind themselves despite veto power?

  3.  **Formulate the Argument:**
      *   *Thesis:* The hitchhiker argument *fails* under a strict temporal slice model with unilateral veto power, *unless* we redefine rationality to include inter-temporal coordination as a constitutive good. However, the stronger position is that veto power dissolves the unity required for the promise to be credible. Therefore, the argument that one *ought* to pay relies on a fiction of diachronic unity that the slice model exposes.
      *   *Wait, I need to defend a conclusion.* Let's argue that the slice model actually *saves* the rationality of paying, but only if we view the "veto" not as a rupture but as a negotiable node in a coalition.
