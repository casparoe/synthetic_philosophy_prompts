prompt: |-
  I cover science and ideas for a mid-size magazine, and I'm putting together a profile interview with a philosopher who just put out a book arguing that Thomas Hobbes's geometry isn't the embarrasing string of failed proofs everyone repeats — squaring the circle, trisecting the angle, doubling the cube — but actually a coherent methodoligical program that we've been misreading because we judge it by whether it gets the answers right. I keep coming back to it because I wrote a piece last year on the early Royal Society's identity crisis and the whole Hobbes-and-the-geometry-guys quarrel kept surfacing in the footnotes, and a friend who does history of math told me I was being a total idiot for treating it as just a crank story.

  Could you draft eight to ten interview questions that go beyond having him restate the view? I want at least one question each on (a) whether the failed quadrature and trisection attempts are disqualifying for his method or a red herring that just shows he was applying it to the wrong problems, (b) the Wallis and Huygens episodes and whether the real fight was about institutional authority and the outsider-versus-the-guild dynamic rather than the geometry itself, and (c) his more idiosyncratic claim that geometry has to be built up from definitions and that even the axioms and postulates we inherit from Euclid need to be accounted for rather than just granted. For each of those, give me a follow-up keyed to the answer he's most likely to give, since he's the kind of person who'll wave off a criticism by calling it a "charitable reconstruction" problem, and end the sequence with one question about what evidence would actually count against the view.
