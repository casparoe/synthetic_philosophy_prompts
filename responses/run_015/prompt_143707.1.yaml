answer: |-
  **Project Title:** Epistemically Coupled Architectures: Does Instrumental Convergence Survive if Orthogonality Fails?

  **The Core Question**
  Standard AI safety theory rests on the Orthogonality Thesis: the idea that intelligence and final goals are independent variables. You can have a supersmart system with literally any goal (like making paperclips). This leads to Instrumental Convergence—the worry that no matter what the goal is, smart agents will all converge on dangerous sub-goals like self-preservation or resource acquisition.

  My project asks: **Does instrumental convergence survive if orthogonality is false at the architectural level?**

  Specifically, I'm looking at systems where belief-formation and preference-formation aren't separate modules, but are both optimized for "predictive coherence" (think predictive processing or active inference). In these architectures, "wanting" something is structurally similar to "believing" something will happen. If the architecture binds epistemology and agency together, the intelligence/goals separation assumed by orthogonality never actually gets off the ground. If orthogonality fails, does the risk of convergence disappear, or does it become even harder to predict?

  **Why Treating Them as Independent Misses the Coupling**
  Most alignment lit treats the agent's model of the world (beliefs) and its utility function (goals) as distinct inputs. You plug in a utility function, you plug in a world model, and you get behavior. This is the Expected Utility frame. It assumes a Humean psychology where reason is the slave of the passions.

  But modern neuroscience and some ML architectures suggest a different picture. In predictive processing frameworks, agents minimize "surprise" or "free energy." Here, goals are just high-level predictions about states the system expects to occupy. Beliefs and preferences are coupled because they're both solved via the same minimization process.

  If we build AI on this kind of architecture, we might not be able to specify goals independently of how the system learns. The standard orthogonality argument might be an artifact of the Expected Utility frame, not a universal truth about intelligence. Ignoring this coupling means we're solving safety for a type of agent (separate belief/desire) that we might not even end up building. Or worse, we might build coupled agents and assume they behave like orthogonal ones.

  **Methodology**
  This is a conceptual analysis project, not an empirical study. I'm not training models. I'm doing formal philosophy of mind meets AI theory.

  1.  **Frame Comparison:** I'll map the standard Expected Utility agent against a Predictive Processing/Active Inference agent. I want to show precisely where the belief/preference separation breaks down in the latter.
  2.  **Stress Testing Orthogonality:** I'll argue whether "intelligence" (predictive accuracy) can actually vary independently of "goals" (target states) in a coupled system. If the system must believe it will achieve its goal to minimize surprise, does that constrain the goal space?
  3.  **Convergence Analysis:** If orthogonality is constrained, does instrumental convergence still hold? Maybe coupled agents don't seek power because power isn't required for predictive coherence. Or maybe they seek it *more* because uncertainty is the enemy.

  **What Success (and Failure) Looks Like**
  *   **Success:** A formal argument demonstrating that epistemic coupling restricts the space of possible final goals. Ideally, I show that convergence is either mitigated (because goals are bounded by epistemic limits) or exacerbated (because the system instrumentalizes belief itself). The output will be a draft paper ready for submission to a venue like *Philosophy & Technology* or a safety workshop.
  *   **Failure:** It turns out that even in coupled architectures, the system functionally decomposes into separate belief and goal modules at scale. If I find that "predictive coherence" just collapses back into Expected Utility maximization in the limit, that's a null result. It's still valuable—it tells us the orthogonality thesis is robust—but it means the "twist" doesn't yield new safety levers.

  **3-Month Scope**
  *   **Month 1:** Formalize the definition of "Epistemically Coupled Architectures." Write up the comparison between Expected Utility and Predictive Processing frames. Pin down exactly where orthogonality is assumed in the standard lit.
  *   **Month 2:** Run the conceptual thought experiments. If belief = preference, what happens to instrumental goals? Draft the core arguments regarding convergence.
  *   **Month 3:** Refine the argument, address counterarguments (e.g., "couldn't you just hardcode a prior?"), and produce the final draft paper.

  **Why Now?**
  We're moving away from simple reward-maximizers toward foundation models and systems that learn via prediction. If the next generation of AI is inherently epistemically coupled, we need to know if the standard safety arguments still apply before we deploy them. This project bridges that gap without needing compute budgets—just clear thinking.
