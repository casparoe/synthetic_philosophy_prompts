answer: |-
  **Setting:** A café near the linguistics department, late afternoon. Empty coffee cups and a napkin covered in scribbled syntax trees sit between Miriam and Ade.

  **Miriam:** The Kavrem case is the breakthrough we've been waiting for. Finally, a language where the mode of presentation isn't hidden in the head but stamped on the noun. You can't say *Hesperus*; you must say *Hesperus-vi* (perceived) or *Hesperus-ru* (testimony). It forces the cognitive route into the semantics.

  **Ade:** It forces nothing of the sort. It's just a tacit indexical made visible. In our language, if I say "Hesperus is Phosphorus," I might imply I saw them both. In Kavrem, they just make you say the implication. But the proposition expressed—the truth condition—remains about the planet Venus. The marker is pragmatic baggage, not semantic content.

  **Miriam:** But it's obligatory syntax, Ade. You cannot formulate the thought without selecting a marker. If I say *Hesperus-ru is Phosphorus-vi*, I am asserting an identity between an object known by testimony and an object known by perception. If the marker were merely pragmatic, denying it shouldn't create a contradiction. But in Kavrem, a bare name is ungrammatical. The mode of access is part of the name's contribution.

  **Ade:** Obligatory doesn't mean semantic. Consider gendered nouns. In French, *la table* is feminine. Does that mean the table is female? No. It's a grammatical feature that tracks nothing in the world. Kavrem markers track the speaker's history, not the object's nature. My history is idiosyncratic. I learned *Hesperus* by seeing it; you learned it by reading a chart. If the marker were the mode of presentation in your Fregean sense, we couldn't grasp the same thought. We'd be talking past each other.

  **Miriam:** That's the usual objection—that modes of presentation must be shareable. But look closer. The markers aren't *my* specific history; they are *types* of history. *Vi* doesn't mean "Miriam saw this on Tuesday." It means "The speaker perceives this." That is public. We both understand what perception is. When we communicate, we align on the type of evidence, even if the tokens differ. The grammar forces us to acknowledge that cognitive significance varies by access type.

  **Ade:** Let's test that. Suppose I tell you about Venus. I say *Hesperus-ru* and *Phosphorus-ru*. Both markers indicate testimony. According to you, the mode of presentation is now identical for both names. Yet, I can still learn something. I can be surprised that the star you told me about in the evening is the same one you told me about in the morning. If the marker *is* the sense, and the markers are identical, the identity statement should be trivial. It isn't.

  **Miriam:** (Pauses, tapping a pen) That is a problem. If the evidential type exhausts the cognitive value, then *Hesperus-ru is Phosphorus-ru* should be as uninformative as *Hesperus-ru is Hesperus-ru*. But it's not. The informativeness survives the matching markers.

  **Ade:** Exactly. The difference isn't in the evidence type; it's in the mental file itself. I have two files, both labeled "testimony." Merging them is work. The Kavrem marker tells you how I opened the file, not what's inside it. The marker is metadata, not content.

  **Miriam:** I concede that the evidential type alone doesn't individuate the sense finely enough. Frege never claimed the sense was just "how I know it." But consider the reverse case. Suppose I hear the name "Cicero" twice. Once as a Roman orator, once as a modern spy. I take them to be different people. In Kavrem, I might mark both as *ru* (testimony). But suppose the language allows me to mark the *instance* of acquisition. If I can say *Cicero-ru1* and *Cicero-ru2*, and assert *Cicero-ru1 is not Cicero-ru2*, I am expressing a truth. If I later learn they are the same person, I say *Cicero-ru1 is Cicero-ru2*. The name form is identical. The referent is identical. The only thing changing is the marker. If the proposition were just <Cicero, Cicero, Identity>, I couldn't move from falsehood to truth.

  **Ade:** I'll grant you that. If the grammar forces you to distinguish the acquisition events, then substitutivity fails in belief contexts. If Lois believes *Superman-perceived* flies, she doesn't necessarily believe *Superman-testimony* flies, even if they are the same man. In Kavrem, you literally cannot report her belief without choosing a marker. So, if I say "Lois believes Superman-ru flies," I might be speaking falsely if she actually believes Superman-vi flies. The marker affects the truth of the report.

  **Miriam:** So you admit the marker is semantically relevant? It's not just flavor; it changes truth conditions.

  **Ade:** I admit it constrains the report. But does it vindicate your view that the name *carries* the sense? Or does it show that the language forces us to embed a hidden indexical—"the object as I know it via source X"—into the logical form? The name still refers directly; the marker just restricts the context of evaluation. I'm moving toward your view that syntax can't be ignored, but I'm not ready to say the name itself is descriptive.

  **Miriam:** And I must concede your point about the matching markers. If *Hesperus-ru is Phosphorus-ru* is informative, then the marker isn't the whole mode of presentation. There must be something else—perhaps a specific conceptual role—that distinguishes them even within the same evidential category. The grammar highlights the epistemic route, but it doesn't exhaust the cognitive significance.

  **Ade:** Here is the sharper problem for you, though. What about the "unrecoverable" marker? Kavrem requires a suffix even if I don't know how I learned the name. I must say *Hesperus-unrec*. But if I don't know the source, what mode of presentation am I grasping? I'm grasping nothing about the source. I'm just obeying a rule.

  **Miriam:** You're grasping the mode of "unknown source." That is a cognitive state. It's the state of accepting a name without a pedigree.

  **Ade:** But that state is compatible with any actual source. I might have seen it, but forgotten. I mark it *unrec*. You might have heard it, but forgotten. You mark it *unrec*. We use the same form, but our actual histories are different, and our forgotten memories are different. If the marker is the sense, we are thinking the same thought. But intuitively, if I recover my memory and realize I saw it, my thought changes qualitatively. The *unrec* marker is a placeholder for ignorance, not a genuine mode of presentation. It suggests the grammar is running ahead of the thought.

  **Miriam:** That pushes me to refine the view. Perhaps the marker isn't the mode of presentation itself, but a constraint on which mode of presentation is active. When I say *unrec*, I am signaling that no specific mode is currently accessible to me, only the name itself. But wait—if the name itself were enough, why do I need the marker?

  **Ade:** Because the language demands it. Like saying "I" even when you feel anonymous. The grammar compels a specification you can't honestly give. That suggests the marker is external to the thought. It's a communicative requirement, not a constituent of the belief.

  **Miriam:** But if it's external, why does it block substitutivity in belief reports? If I report your belief, I must match your marker. If I substitute *vi* for your *unrec*, I misrepresent your state of mind.

  **Ade:** Because belief reports track the speaker's perspective, not just the world. I've always said that. What Kavrem shows is that some languages force that perspective into the open. It doesn't prove the name itself is descriptive. It proves that human communication requires tracking epistemic access.

  **Miriam:** So we agree that epistemic access is crucial for explaining cognitive significance and belief reports. We disagree on whether that access is glued to the name or floating nearby in the logical form.

  **Ade:** Precisely. And here is where I have to move. If the grammar makes it impossible to detach the name from the marker, then for all practical purposes, the name *functions* as if it carries the mode. You can't use the name bare. So, in Kavrem, the Millian story requires so many asterisks about hidden variables that it looks like Fregeanism in disguise.

  **Miriam:** And I must admit that if the marker can be *unrec*, then the mode of presentation can be empty or generic. That weakens the idea that senses are rich descriptions. Sometimes the sense is just "whatever I got this from."

  **Ade:** So the disagreement isn't about whether cognitive differences matter. They do. It's about whether the grammar dictates the ontology of the thought.

  **Miriam:** Or whether the thought dictates the grammar. If I can't think about Hesperus without categorizing my access to it, then the categorization is part of the thinking.

  **Ade:** But if I can forget the access and still think about Hesperus, using a default marker, then the thinking survives the loss of the specific mode. The name carries the reference; the marker carries the receipt.

  **Miriam:** But without the receipt, the reference is blind.

  **Ade:** But it refers nonetheless.

  **Miriam:** (Looks at the napkin) We're left with this: In Kavrem, you cannot separate the object from the way you know it without breaking the language. The question for us is whether breaking the language breaks the thought.

  **Ade:** And whether a language that forces you to lie about your evidence—using *unrec* when you actually know—shows that the grammar is independent of the mind.

  **Miriam:** Then that's the hinge. Does the obligatory marker reflect the structure of thought, or the structure of conversation?

  **Ade:** If it's conversation, I win. If it's thought, you win.

  **Miriam:** And Kavrem doesn't tell us which it is, only that the two are inseparable in practice.

  **Ade:** Which means the students need to decide whether grammar leads or follows.

  **Miriam:** And whether a name without a history is a name at all.

  **Ade:** (Signals for the check) Or whether a history without a name is just a story.

  **Miriam:** Unresolved.

  **Ade:** Sharpened.

  **Miriam:** Good enough for a handout.
