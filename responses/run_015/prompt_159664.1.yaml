answer: |-
  | Formal Component | Absent-Minded Driver (AMD) | *Memento* (Leonard Shelby) |
  | :--- | :--- | :--- |
  | **Decision Nodes** | Two indistinguishable exits. | Iterative moments of interpreting clues (notes, tattoos). |
  | **Payoffs** | Exit 2 (Best), Exit 1 (OK), Past Both (Worst). | Truth/Revenge (Best), Ignorance (OK), Manipulated Murder (Worst). |
  | **Signal** | None (Indistinguishability). | Polaroids, notes, tattoos (Externalized memory). |
  | **Plan** | Continue at Exit 1, Exit at 2. | "System": Verify facts before acting. |
  | **Divergence** | Ex-ante optimal plan vs. Ex-interim action. | Ex-ante goal (justice) vs. Ex-post fabrication (lie). |

  You are not overreading the Ulysses inversion; it is the critical fracture point. In the canonical AMD problem, the driver's reasoning is intact, and the environment is passive. The tension arises purely from self-locating uncertainty: *Where am I in the sequence?* Leonard's problem is not self-locating uncertainty so much as epistemic corruption: *Is this signal true?* The driver forgets; Leonard is lied to.

  This distinction matters for your seminar. The AMD paradox relies on the assumption of a single agent maximizing utility against nature. *Memento* introduces a second agent (Teddy/Natalie) who manipulates the information structure. When Natalie tests Leonard with the pen, she is not auditing his memory capacity; she is auditing the security of his external hard drive. In decision theoretic terms, she is exploiting the fact that his "commitment device" (the notes) is writable by others. This shifts the problem from imperfect recall to a Bayesian game with asymmetric information. Consequently, the ending is indeed an inversion of Ulysses. Ulysses binds himself to the mast to resist a future temptation he knows is irrational. Leonard binds his future self to a lie he knows is false, precisely because the truth offers no utility. He weaponizes his own impairment.

  Is the film usable? Yes, but dangerously. If you show it without framing, students will conflate *forgetting* with *being deceived*. The AMD problem is tragic because the driver cannot solve it even with perfect rationality; Leonard's tragedy is that he solves it by abandoning rationality for narrative coherence. To use this fairly, you must treat the film not as an illustration of the math, but as a critique of the math's isolationist assumptions.

  Stop on these three scenes:

  1.  **Natalie's Pen Test:** Use this to distinguish *memory loss* from *signal reliability*. In AMD, the signal is absent. Here, the signal exists but is untrusted. Ask students: If Leonard suspects the note was written by Teddy, how does that change the expected utility of acting on it? This introduces the concept of endogenous information structures.
  2.  **The Tattooing Scene:** This is the "planning stage." Leonard is committing a fact to his body. Discuss this as a high-cost commitment device. In AMD, the driver cannot commit; he can only calculate. Leonard can commit, but he commits to a variable truth. This highlights that commitment requires not just memory, but integrity of the recording medium.
  3.  **The Final Monologue ("I've got to believe..."):** This is the divergence. Leonard chooses the "Past Both" outcome (killing Teddy, perpetuating the cycle) over the "Exit 2" outcome (accepting revenge is complete). Use this to discuss utility functions. The formalism assumes stable preferences. Leonard changes his utility function to accommodate his memory loss, preferring a meaningful lie to a meaningless truth.

  Your suspicion about the formalism is correct and survives contact with the problem. The standard AMD formalism treats forgetfulness as a private, internal handicap—a leak in the agent's cognitive architecture. It models the agent as a closed loop interacting with a static tree. *Memento* insists that an agent who cannot remember is above all an agent someone else can exploit by controlling what reaches his next decision node. Memory, the film argues, is not just storage; it is a social contract. When that contract is broken, the decision problem ceases to be about optimization and becomes about power.

  The formalism cannot capture this because it lacks a vocabulary for grief. Leonard's "payoff" is not merely catching a killer; it is maintaining a self that can function. The AMD driver wants to get home; Leonard wants to remain a driver. By showing that the "signal" can be weaponized, the film exposes a vulnerability the textbook ignores: that in the real world, imperfect recall invites predation. You can use the film to show students that while the math explains the *logic* of the trap, it cannot explain the *ethics* of the keeper who holds the key.
