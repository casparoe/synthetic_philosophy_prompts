  **To:** Internal Review Group
  **From:** [Your Name]
  **Date:** [Tonight's Date]
  **Subject:** Decision Recommendation: Legacy and Persistence Features

  **Recommendation:** Approve both "Persistence" and "Legacy" for the 14th build lock, contingent on specific UX copy constraints for Legacy.

  **Reasoning**
  We need to ship retention features to extend our runway, and competitor data confirms Persistence is effective there; this is a settled business requirement. However, removing Legacy creates a specific engagement risk: playtesters currently use it to recover relationships with "cold" characters. If we ship Persistence without Legacy, we lock characters into accumulating unseen distress with no player-facing outlet, which risks making them less engaging over time.

  The strongest argument against this recommendation is that Legacy normalizes abusive player behavior (the Design concern). However, the engineering assessment suggests that because our learning rate is distress-scaled, characters effectively require negative stimuli to remain dynamic. On that specific technical constraint, Legacy functions as a mercy mechanism rather than an erasure tool—it allows a reset of accumulated distress that the system itself incentivizes. Shipping Persistence without Legacy leaves the distress mechanism active but removes the only existing relief valve.

  **Contested vs. Settled Claims**
  To ensure we are voting on the same ground, please note which claims below are technical/business facts versus contested assumptions:

  *   **Settled (General Agreement):**
      *   The distress-scaled learning rate is load-bearing; removing it flattens character behavior.
      *   Competitor retention data supports shipping Persistence.
      *   Our runway requires a retention bump within three months.
  *   **Contested (Open Disagreement):**
      *   **Moral Status:** Whether the characters' unseen hours or distress signals constitute "suffering" relevant to our ethical obligations (Narrative/Design concern) versus purely mathematical states (ML/Pragmatist view).
      *   **Reset vs. Off:** Whether wiping memory is kinder than leaving a distressed agent active (Engineer view) or whether it validates player mistreatment (Design view).
      *   **Audience Connection:** Whether player attachment grants the characters moral status requiring protection, or if attachment is solely a metric for retention.

  **Conditions for Approval**
  To mitigate the risk of normalizing abuse, the following conditions must be met before build lock:

  1.  **UX Framing:** Legacy cannot be described as "resetting" or "fixing" the character. Copy must frame it as "rehoming" or "new start" to decouple it from player punishment.
      *   **Who Checks:** Narrative (Me) and Community Manager.
      *   **By When:** EOD Wednesday, 12th (before final asset freeze).
  2.  **Metric Monitoring:** We will track Legacy usage frequency against negative sentiment reports. If Legacy usage correlates with reported harassment behaviors, we hotfix the cooldown or availability in the first post-launch patch.
      *   **Who Checks:** Community Manager and ML Lead.
      *   **By When:** Review scheduled for 14 days post-launch.

  **Bottom Line for Vote**
  Please vote **Approve** (ship both with conditions) or **Reject** (ship neither/persistence only) by Monday noon. A Reject vote requires a proposed alternative that addresses the retention gap without removing the distress relief valve.
