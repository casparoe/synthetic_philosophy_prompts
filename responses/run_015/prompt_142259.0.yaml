answer: |-
  You have put your finger on one of the most persistent and frustrating nerves in contemporary metaphysics and philosophy of science. You are describing the tension between **Empirical Equivalence** and **Ontological Asymmetry**.

  To answer your first question: No, there is no single, catchy fallacy name like "Straw Man" or "Ad Hominem" that covers this specific swing from "humble" to "load-bearing." However, it is the central engine of the **Realism vs. Anti-Realism** debate, and specifically the problem of **Underdetermination of Theory by Data**.

  But since you need a tool for the pub, not a bibliography, I will coin a term for the specific rhetorical *move* you are identifying. It captures the mechanics of the swing you described.

  ### The Term: "The Transcendental Lever"

  **Definition:** The Transcendental Lever is an argumentative move where a posit (an entity, property, or structure) is introduced as **epistemically inaccessible** (no observation can detect it) to shield it from refutation, but is simultaneously treated as **ontologically robust** (it grounds truth, fundamentality, or explanation) to give it work to do.

  It is called a "lever" because it uses a point *outside* the realm of verification (the fulcrum) to lift a weight *inside* the realm of explanation (the load). It is "transcendental" because the posit is placed beyond the limits of possible experience.

  ### Why it feels wrong (The Mechanism)
  Your intuition is correct: the move relies on a category error between **Epistemic Constraints** (what we can know) and **Ontological Commitments** (what exists).

  1.  **The Shield (Humble Phase):** "You can't prove me wrong because this entity makes no difference to observation." (This invokes epistemic humility).
  2.  **The Sword (Load-Bearing Phase):** "But you must accept my entity because it explains why our sentences are true / why the theory is fundamental." (This invokes ontological robustness).

  The friction arises because "explanation" and "fundamentality" usually cash out in terms of differences they make. If an entity makes *no* difference to how the world behaves or how we verify claims, it is unclear what work it is doing other than satisfying a metaphysical itch.

  ### Distinguishing the Legitimate from the Dodgy

  Since you asked for a way to draw the line, here is the criterion. The Transcendental Lever is **Legitimate** only when the "work" the entity does is *internal* to a conceptual or normative framework. It is **Dodgy** when the entity claims to track *mind-independent reality* without offering a causal or structural distinction.

  #### 1. The Legitimate Case: Mathematical Objects (Platonism)
  *   **The Posit:** Numbers exist independently of human minds.
  *   **The Equivalence:** A physicalist nominalist can rewrite all physics without numbers, using only concrete particulars. The predictions are identical.
  *   **The Lever:** The Platonist says, "You can't observe '2' directly (Shield), but mathematics is objectively true and indispensable for science, so '2' must exist (Sword)."
  *   **Why it might pass:** The "work" being done is **logical coherence and necessity**, not causal power. The entity grounds *truth conditions* within a formal system, not physical events. Many philosophers accept this because the "reality" claimed is abstract, not spatiotemporal.

  #### 2. The Dodgy Case: Absolute Simultaneity (Newtonian Space)
  *   **The Posit:** There is a fact of the matter about whether two distant events happened at the "same time," regardless of the observer's frame of reference.
  *   **The Equivalence:** Special Relativity shows that no experiment can detect absolute simultaneity. All measurements are frame-relative.
  *   **The Lever:** The Newtonian says, "We can't measure it (Shield), but there must be a *real* fact about when the events happened for our sentences about 'now' to be truly true (Sword)."
  *   **Why it fails:** Here, the posit claims to describe **physical reality** (spacetime structure) but refuses to interact with it physically. It claims to ground the truth of "Event A and B happened together," but if that truth makes no difference to causality, light cones, or measurement, it is an **Inaccessible Anchor**. It drops an anchor where there is no sea floor, then claims the ship is held fast.

  ### How to Use This in the Pub

  When your friend makes the move (e.g., "The table *really* exists over and above the particles, even if we can't tell the difference"), you can deploy the **Transcendental Lever Test**:

  1.  **Identify the Shield:** "Okay, you've conceded that this 'table-ness' makes no difference to any observation or physical interaction. It is epistemically inert."
  2.  **Identify the Sword:** "But now you're saying this 'table-ness' is what makes our sentence 'There is a table' *fundamentally* true, rather than just conveniently true."
  3.  **Call the Swing:** "You are using the Transcendental Lever. You're placing the entity outside the reach of evidence so you don't have to defend it, but then pulling it back inside the realm of explanation so it can do work. If it can't push on the world, how can it hold up the truth?"

  ### The Edge Case: Where the Debate Lives
  The only place this move remains live and respected is in **Metaethics** (Moral Realism).
  *   **Posit:** "Murder is objectively wrong."
  *   **Equivalence:** A world where murder is wrong and a world where it is merely disapproved of might look physically identical.
  *   **Lever:** "We can't measure 'wrongness' (Shield), but moral deliberation only makes sense if wrongness is real (Sword)."
  *   **Verdict:** This is the hardest case. If you think moral facts are *normative* (guiding action) rather than *descriptive* (tracking particles), the Lever might be legitimate. If you think they describe the universe, it's likely dodgy.

  ### Summary for the Group
  *   **Phenomenon:** Ontological asymmetry despite empirical equivalence.
  *   **Coined Label:** **The Transcendental Lever**.
  *   **The Rule:** An entity that is **causally inert** (makes no difference to observation) cannot be **explanatorily active** (grounds fundamental truth) unless it belongs to a non-causal domain (like math or logic).
  *   **The Pub Line:** "You can't have it both ways. You can't park your entity in the blind spot of reality and then claim it's the engine of the car."

  This gives you a precise handle on the "swing" you noticed, distinguishes it from general skepticism, and offers a criterion to judge when the move is doing honest work versus when it's just metaphysical bloat.
