answer: |-
  Reject Step (4), because the mathematical fact of asymptotic dominance cannot prescribe a utility function for a finite human with consumption needs.

  Your counter-example is correct: Step (1) is false outside the class of fixed-fraction strategies that avoid ruin. Kelly does not beat your "all-in once" strategy with probability 1; it beats it with probability 0.4 (the ruin branch), while losing to it with probability 0.6 (the double-up branch). Your friend's theorem only guarantees Kelly beats other *non-ruinous* fixed-fraction strategies almost surely. By expanding the criterion to "any alternative" in (1) and then claiming this *forces* log utility in (4), he conflates a specific mathematical property with a universal normative law. This is the "Samuelson critique": maximizing growth rate is optimal *if* you have log utility, but having log utility is not forced merely because life involves compounding.

  **Confidence: High.** The leap from "Kelly maximizes growth" to "You must maximize expected log wealth" is a category error (is-ought). Growth is a physical dynamic; utility is a preference structure.

  **What rejecting (4) costs:** You lose the comforting certainty that there is One True Strategy dictated by math. You must admit that risk tolerance is a preference, not a calculation error. You cannot prove your friend wrong using only his math; you must introduce external values (e.g., "I value money less when I'm dead" or "I value consumption today").

  **What replaces it:** Standard Expected Utility Theory over a finite horizon. You maximize $E[U(W_T + C)]$, where $C$ is consumption and $T$ is your lifespan. If $U$ is log, you get Kelly. If $U$ is power utility (CRRA), you get Fractional Kelly. If $U$ includes a hard constraint on survival, you get safety buffers. This framework handles your objections to (5), (6), and (7) naturally: you accept some risk of ruin if the utility gain is high enough, you consume because consumption generates utility, and you leave the house because being alive has value beyond compounding.

  **Does it still get you to Kelly?** Often, but not always. For many reasonable utility functions over long horizons, the optimal bet converges toward Kelly, but usually "Fractional Kelly" (e.g., half-Kelly) to account for uncertainty and risk aversion. With $190k and a finite life, full Kelly is likely too aggressive unless you have no other income and extremely high risk tolerance.

  **What would change my mind:** A defender would need to show that any utility function other than log wealth leads to sure arbitrage losses over infinite time *and* that humans should value infinite time over finite well-being. They might argue from "ergodicity economics" that ensemble averages (expected value) are physically meaningless for single trajectories, but this still doesn't force log utility over other time-average maximizers.

  **Where my diagnosis is most likely wrong:** I am assuming you want to maximize personal welfare. If your goal is specifically to maximize the probability of ending up with the most money possible among a peer group over 50 years (a tournament setting), then (1) becomes more relevant, and Kelly-like strategies regain normative force. Also, if investment opportunities are truly infinite and identical over time, the horizon matters less, but this is never true in reality.

  **Practical upshot:** Your paralysis comes from treating a tool (Kelly) as a master. The math in (2) and (3) is sound, but it serves *your* goals, not the other way around. You are allowed to spend the money, take safe jobs, and leave the house.
