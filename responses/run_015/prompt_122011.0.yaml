      *Refining the Moral Luck point:* It's not just outcome luck. It's *constitutive* luck. You are constituted as a wrongdoer based on the victim's reaction, which is outside your control. Also, the "reflection" forces a confession. If you are innocent, you are unlucky because the system demands a confession to proceed.

