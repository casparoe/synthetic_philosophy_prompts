  5. **Adaptation-vs-byproduct clarity (0.55):** Distinguishing a selected fertility detector from a general health/immune sensor is empirically difficult without phylogenetic or cost-benefit data.

  **Combination**
  I treat Terms 2–4 as establishing a robust universal biological mechanism (combined ~0.90), but I discount this heavily by Term 5 because the design confirms the *mechanism* without proving the *selection history*, resulting in a final probability weighted between the mechanism's reality and the adaptation claim's ambiguity.

