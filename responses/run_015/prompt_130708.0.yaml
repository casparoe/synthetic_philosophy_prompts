answer: |-
  Your grasp of the dialectic is excellent. You have correctly identified the core tension: is morality baked into the *semantics* of the concept (Story 1), or is it a matter of *pragmatics*—how we use neutral tools in social contexts (Story 2)? The stake is whether human psychology treats moral evaluation as a prerequisite for describing action, or merely as a consequence we rush to establish.

  Here is how your variants bear on that distinction.

  **1. Swap the word**
  You ask whether the asymmetry should spread to "knew" or "foresaw". The Pragmatic story predicts the asymmetry follows the *purpose* of the question, not the specific word. If respondents believe asking "Did he know?" is merely a way to ask "Is he to blame?", the asymmetry persists. If they treat "knew" as a purely epistemic query, the asymmetry vanishes. The Conceptual story is more restrictive: it claims the concept of *intentional action* is morally laden, not necessarily the concept of *knowledge*. Thus, the Conceptual story can comfortably predict the effect stays local to "intentionally".

  *Confidence note:* I am guessing slightly here. Empirical data shows asymmetry often appears for "knowingly" too. This forces the Conceptual story to expand (claiming multiple concepts are morally laden) or the Pragmatic story to argue that "knowingly" is also used for blame. Consequently, this variant may not cleanly discriminate between the stories without further controls.

  **2. Change the format**
  This is a stronger test. The Pragmatic story relies on conversational pressure: the respondent infers that the questioner wants to assign blame, so they answer accordingly. If you remove the questioner—using a rating scale in a vacuum—that pressure should dissipate, and the asymmetry should shrink. The Conceptual story claims the asymmetry is internal to how the mind processes the scenario; changing the output format (yes/no vs. scale) should not alter the underlying judgement.

  *Confidence note:* I am reasonably confident here. However, the Pragmatic story can survive by arguing that the *task itself* implies a social context, even without an interrogator. If the asymmetry persists in private, anonymous rating tasks, it significantly damages the Pragmatic story.

  **3. Pull norm-violation apart from disapproval**
  This is the most decisive variant. The Pragmatic story ties the effect to *blame*. If the side effect violates a silly rule but attracts no moral condemnation (or even praise), the motivation to mark blame disappears. Therefore, the Pragmatic story predicts the asymmetry should vanish when moral disapproval is removed, even if a norm is broken. The Conceptual story has a nuanced path: some versions argue the concept tracks *normative deviation* generally, not just moral badness. If respondents still call it "intentional" when a silly rule is broken, it supports a Conceptual view based on norms rather than morality. If they stop calling it "intentional" when blame is removed, it supports the Pragmatic view.

  *Confidence note:* I am confident this is the logical implication, though empirical results are mixed. Some studies suggest the effect tracks norm-violation even without moral outrage, which would favour a broader Conceptual story over a strictly blame-based Pragmatic one.

  **Conclusion and Caveats**
  Your distinction is not an artefact; it is the central puzzle of this field. However, telling the stories apart is notoriously difficult because both theories are adaptable. The Pragmatic theorist can always claim the respondent perceived a conversational hint you missed; the Conceptual theorist can always claim the concept is more complex than assumed.

  I must flag that I am guessing on the empirical outcomes of your specific variants, as experimental results often conflict. However, the *logical* predictions I have outlined are sound. Variant 3 is your strongest tool: if intentionality tracks silly rules without moral sting, the "blame-marking" story struggles to survive. If the effect vanishes when blame is removed, the "moral concept" story loses its footing.

  Ultimately, the question cannot be answered perfectly because "the concept" and "pragmatics" are not neatly separable in the brain. We use words to do things. If people consistently use "intentionally" to mark blame, does that make blame part of the meaning, or just its primary use? At some point, the distinction may be purely theoretical. But your variants are the correct way to probe the boundary.
