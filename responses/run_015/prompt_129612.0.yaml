      *   **Situation:** Volunteered as a living filter (liver/kidneys) for a composer via an experimental biotech system. Thought it was temporary/short-term. Now 5 months in, tethered, confined. Medical team says 6 more months needed. Disconnecting = composer dies. Others claim moral obligation to stay due to composer's potential future. User feels trapped, compares it to involuntary servitude.
      *   **Core Question:** Does philosophy offer a framework to distinguish between killing vs. letting die when support requires continuous invasive use of one's body? Does initial consent create a lasting obligation despite unforeseen burden? Does the value of the patient's future override the donor's claim to stop?
      *   **Format Constraints:** Continuous prose only. No headings, bullet points, bold text, or tables. Single flowing narrative (like a formal letter/email).
      *   **Structure:** Bottom line up front (BLUF), then develop reasoning in uninterrupted flow.

  2.  **Determine the "Bottom Line" (BLUF):**
      *   The core philosophical consensus (particularly regarding bodily autonomy) suggests that while the situation is tragic, the obligation to sustain another life using one's own body is not absolute, even with prior consent, especially when the burden becomes excessive or unforeseen. The distinction between killing and letting die is relevant, but the stronger argument lies in the right to bodily autonomy.
      *   *Draft BLUF:* While the situation is morally tragic and your desire to save a life is commendable, philosophical frameworks regarding bodily autonomy generally support your right to withdraw consent, distinguishing this not as killing but as refusing continued bodily sacrifice, meaning you are not morally obligated to remain connected against your will despite the consequences.

  3.  **Identify Key Philosophical Concepts:**
      *   **Judith Jarvis Thomson's "A Defense of Abortion" (The Violinist Analogy):** This is the most direct parallel. A famous violinist is plugged into you for 9 months. You didn't know it would happen (in Thomson's case), but here there was consent. However, the duration and burden changed.
      *   **Consent and Contractual Obligation:** Consent is ongoing, not necessarily a one-time irrevocable contract, especially regarding bodily integrity.
      *   **Killing vs. Letting Die:** The distinction between active harm and withdrawing aid.
      *   **Supererogation:** Actions that are good to do but not obligatory. Saving the life is supererogatory, not mandatory.
      *   **Bodily Autonomy:** The fundamental right to control what happens to one's body.
      *   **Reasonable Foreseeability:** The burden shifted from what was anticipated to something much heavier.

