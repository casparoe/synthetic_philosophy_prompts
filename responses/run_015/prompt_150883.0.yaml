  Draft a 90-minute graduate essay question for a philosophy-of-mind examination on the relationship between access consciousness, phenomenal consciousness, and global workspace theory. The prompt must be unanswerable by merely summarizing the standard Block distinction or the Baars-Dehaene broadcasting model. To that end, embed the following hypothetical architecture: a cognitive system contains a “shadow broadcast” pathway in which sensory information achieves phenomenal presence—there is determinately something-it-is-like for the system—without ever entering the global workspace, but only under conditions of active attentional suppression rather than selection failure. Ask examinees to determine whether this scenario collapses the access/phenomenal distinction, forces a revision to what “global” availability requires, or instead reveals a hidden ambiguity in the integration constraint on consciousness. Provide a model answer of approximately 700 words that takes a clear, argued position and addresses at least three specific objections: that shadow broadcasting is merely unconscious processing misdescribed, that phenomenal presence without access is conceptually incoherent, and that the architecture violates the integration constraint central to workspace theories. Include a marking scheme totaling 25 marks built around five must-hit conceptual moves, with marks assigned to each, plus a one-line note on the typical student error for each move. Do not request citations, bibliographies, or reading lists; the answer should stand on conceptual analysis alone.
