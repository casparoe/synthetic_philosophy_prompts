answer: |-
  **Examination Paper: Philosophy of Mind (Graduate Level)**
  **Time Allowed:** 90 Minutes
  **Question 1**

  Standard Global Workspace Theory (GWT) posits that consciousness arises when information is broadcast globally to diverse cognitive systems. Ned Block distinguishes Phenomenal Consciousness (P-consciousness; experience itself) from Access Consciousness (A-consciousness; availability for report and reasoning), often suggesting P-consciousness might exceed A-consciousness. However, standard GWT typically equates the two, claiming global broadcast is necessary for phenomenality.

  Consider the following hypothetical architecture: A cognitive system contains a "shadow broadcast" pathway. In this pathway, sensory information achieves phenomenal presence—there is determinately something-it-is-like for the system—without ever entering the global workspace. Crucially, this occurs not due to selection failure or capacity limits, but only under conditions of *active attentional suppression*. The system selectively prevents specific phenomenal content from becoming globally available for report or reasoning, despite that content remaining phenomenally vivid.

  Evaluate this scenario. Does it collapse the access/phenomenal distinction by redefining access, force a revision to what "global" availability requires, or reveal a hidden ambiguity in the integration constraint on consciousness? Defend your position against the following objections: (1) that shadow broadcasting is merely unconscious processing misdescribed; (2) that phenomenal presence without access is conceptually incoherent; and (3) that the architecture violates the integration constraint central to workspace theories.

  ***

  **Model Answer**

  The "shadow broadcast" scenario does not collapse the access/phenomenal distinction, nor does it necessitate abandoning Global Workspace Theory. Instead, it reveals a hidden ambiguity in the integration constraint central to workspace theories. Specifically, it forces a distinction between *functional integration* (required for access) and *phenomenal integration* (required for experience). The scenario suggests that while global availability is necessary for cognitive control, it is not necessary for phenomenality, provided local integration is sufficient to sustain a unified field.

  First, consider the objection that shadow broadcasting is merely unconscious processing misdescribed. Proponents of strict GWT argue that if information is not globally available for report, it is unconscious by definition. This objection fails because it stipulates the conclusion rather than arguing for it. The hypothetical explicitly posits that there is "something-it-is-like" for the system. To deny this is to deny the premise of the thought experiment rather than engage with its implications. Phenomenology is primitive; if the system possesses a subjective perspective on the suppressed data, labeling it "unconscious" merely because it lacks downstream functional effects is a category error. It conflates the *consequences* of consciousness (reportability) with the *nature* of consciousness (experience). The shadow pathway demonstrates that functional isolation does not entail phenomenal absence.

  Second, critics may argue that phenomenal presence without access is conceptually incoherent. If a state cannot influence reasoning or speech, in what sense is it "conscious"? This objection relies on a verificationist intuition that equates existence with detectability. However, the condition of *active attentional suppression* is crucial here. Unlike selection failure, where information is lost due to noise or limits, suppression implies the system possesses the capacity to access the data but actively inhibits the broadcast. This preserves the conceptual link between the two states: the content is accessible *in principle* (the capacity exists) but inaccessible *in practice* (due to inhibition). Therefore, P-consciousness without A-consciousness is not incoherent; it represents a decoupling of capacity from function. The content is phenomenally present but functionally quarantined.

  Third, does this architecture violate the integration constraint? Standard GWT argues consciousness requires the integration of specialized modules into a unified workspace. If the shadow pathway remains isolated, is it truly integrated? This objection conflates global integration with local unity. The integration constraint should be understood as requiring sufficient coherence to generate a unified field, not necessarily global dissemination. The shadow pathway may possess internal coherence sufficient for phenomenality (local integration) without satisfying the threshold for global broadcasting (functional integration). The ambiguity lies in assuming "integration" implies "global availability." By revising the constraint to allow for locally integrated phenomenal fields that are globally isolated, GWT can accommodate the shadow broadcast without contradiction. The workspace remains the seat of access, while phenomenality arises from integrated processing that may precede or bypass the workspace.

  In conclusion, the shadow broadcast scenario validates Block's distinction by demonstrating that access is a functional status imposed upon phenomenal content, not constitutive of it. It forces a revision of GWT not by denying the workspace's role, but by limiting its scope to access consciousness. The integration constraint must be refined to distinguish between the unity required for experience and the broadcast required for report. Active suppression shows that the system can hold content in the former state while blocking the latter, proving that phenomenality is not dependent on global availability.

  ***

  **Marking Scheme (Total: 25 Marks)**

  | Conceptual Move | Marks | Typical Student Error |
  | :--- | :---: | :--- |
  | **1. Interpretation of Conditions:** Correctly analyzes the "active suppression" clause as distinct from mere inattention or capacity failure, establishing the system retains access capacity. | 5 | Treating suppression as equivalent to standard inattentional blindness. |
  | **2. Thesis Clarity:** Clearly selects one horn of the trilemma (collapse, revision, or ambiguity) and maintains consistency throughout the essay. | 5 | Attempting to argue all three positions simultaneously without resolution. |
  | **3. Objection 1 (Unconscious):** Argues that phenomenology is primitive and cannot be defined away by functional stipulations (reportability). | 5 | Equating reportability directly with existence of experience. |
  | **4. Objection 2 (Incoherence):** Utilizes the "capacity vs. function" distinction to defend the coherence of P-without-A. | 5 | Denying the possibility apriori without addressing the suppression mechanism. |
  | **5. Objection 3 (Integration):** Distinguishes between local phenomenal unity and global functional integration to save GWT. | 5 | Conflating global access with the necessary conditions for phenomenal unity. |
