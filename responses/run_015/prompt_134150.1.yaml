          *   QALYs are inherently cardinal and additive. LTNU rejects this. To fit LTNU, QALYs must be "weighted" non-linearly, which breaks the standard math of allocation algorithms.
          *   "Pleasure" (benefit) is hard to define clinically beyond "absence of pathology."
      *   *Category 3: No Counterpart.*
