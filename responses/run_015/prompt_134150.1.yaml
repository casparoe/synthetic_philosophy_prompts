          *   The "regardless of aggregate quantity" clause. Clinical utilitarianism *always* cares about aggregates (greatest good for greatest number). LTNU explicitly rejects this in severe cases.
      *   *Analysis of Absence:*
          *   Is it a blind spot? Yes, clinical frameworks often ignore extreme subjective distress if physiological stability is achieved.
