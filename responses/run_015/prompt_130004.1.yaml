          *   *GR and the Hard Core:* Einstein didn't adjust the belt; he replaced the core. Lakatos handles this as a new programme superseding an old one. But does this mean Newton was degenerating *before* 1915? Lakatos would say yes, eventually, but rational to pursue until a better alternative exists.
