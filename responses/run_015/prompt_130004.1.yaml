prompt: |-
  I am preparing an essay for my A-level philosophy of science module, and I should be grateful if you could analyse the paired historical episodes of Neptune's predicted discovery in 1846 and Le Verrier's subsequent proposal of an intra-Mercurial planet, Vulcan, in the 1850s–1870s, through the lens of Imre Lakatos's methodology of scientific research programmes. Specifically, please identify the hard core and the protective belt of the Newtonian celestial-mechanics programme in each case; distinguish the novel empirical prediction that characterised the Neptune episode from the ad hoc auxiliary hypothesis that characterised the Vulcan episode; and evaluate whether Lakatos's categories of progressive and degenerating problem shifts genuinely explain why one prediction was celebrated and the other abandoned, or whether Einstein's 1915 resolution of Mercury's perihelion precession demonstrates that the Newtonian programme had already become degenerating. I am especially keen that you do not smooth over the points where the mapping fails—such as the role of observational error in Vulcan's non-detection, or the fact that general relativity replaced rather than patched the hard core—so please state those limitations explicitly. Would you kindly present your analysis in British English, with British spelling and usage throughout?
