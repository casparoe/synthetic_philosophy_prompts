      *   *Hard Core:* Same Newtonian core.
      *   *Protective Belt:* Existence of Vulcan, its mass, orbit.
      *   *Outcome:* Never reliably observed.
      *   *Lakatosian View:* Degenerating. Ad hoc hypothesis (invented solely to save the theory), no novel confirmation.

  5.  **Critical Evaluation (The "Twist"):**
      *   *Did Lakatos get it right?*
      *   *Neptune:* Fits well. Progressive shift.
      *   *Vulcan:* Fits well on surface (degenerating), *but* why? Was it just bad luck? Observational limits?
      *   *General Relativity (GR):* Einstein didn't tweak the protective belt; he smashed the hard core (gravity isn't a force, spacetime curvature).
      *   *Limitation 1:* Lakatos says scientists shouldn't attack the hard core. But eventually, they *must* for a paradigm shift (Kuhn) or a new programme (Lakatos).
      *   *Limitation 2:* Was Newtonianism *already* degenerating at Mercury? Or was it rational to stick with it until GR? Lakatos allows a "grace period" for degeneration.
      *   *Limitation 3:* The distinction between "progressive" and "ad hoc" can be hindsight bias. At the time, Vulcan looked like Neptune part II.

  6.  **Drafting - Section by Section (incorporating British English):**

