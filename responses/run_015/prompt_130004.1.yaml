  2.  **Deconstruct Lakatos's MSRP:**
      *   *Research Programme:* A series of theories sharing a common core.
      *   *Hard Core:* Irrefutable by methodological decision (e.g., Newton's laws, conservation of momentum).
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, observation statements (adjustable to protect the core).
      *   *Negative Heuristic:* Don't attack the hard core.
      *   *Positive Heuristic:* How to develop the programme (maths, new predictions).
      *   *Progressive Problem Shift:* Predicts novel facts, some corroborated.
      *   *Degenerating Problem Shift:* Only explains known facts via ad hoc adjustments, no novel predictions.

  3.  **Case Study 1: Neptune (1846):**
      *   *Anomaly:* Uranus's orbit didn't fit Newtonian predictions.
      *   *Response:* Adams and Le Verrier hypothesised an unseen planet.
      *   *Hard Core:* Newton's Law of Universal Gravitation, Laws of Motion.
      *   *Protective Belt:* Number of planets, initial conditions of Uranus, absence of other perturbing bodies.
      *   *Outcome:* Galle found Neptune very close to the predicted position.
      *   *Lakatosian View:* Progressive. Novel prediction (location of unseen mass) confirmed.

  4.  **Case Study 2: Vulcan (1850s–1870s):**
      *   *Anomaly:* Mercury's perihelion precession (43 arcseconds/century unaccounted for).
