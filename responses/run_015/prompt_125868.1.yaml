  I'm preparing a seminar paper on whether dramatic art can sustain moral ambivalence without collapsing into judgment, and I'd like you to read Mozart's Don Giovanni through Bernard Williams's philosophical engagement with opera together with his idea of moral luck — specifically his resistance to system-building ethical theory, his claim that opera stages particular emotional attachments that cannot be resolved by universal principles, and his observation that outcomes sometimes depend on contingencies outside an agent's control in ways that complicate straightforward blame. Focus on the final act: Don Giovanni refuses the Commendatore's invitation to repent and is dragged away, after which the surviving characters deliver a moralizing epilogue about the fate of evildoers. Where does Williams's framework illuminate why audiences often feel a divided response — recognizing Don Giovanni's actions as monstrous yet sensing that his refusal carries a kind of integrity or authenticity that makes simple condemnation feel inadequate? Does the opera itself preserve that tension, or does it ultimately enforce the kind of moral closure that Williams distrusted? And how does moral luck figure in: is Don Giovanni's destruction less the necessary consequence of a consistently vicious character and more the result of an unpredictable contingency — the statue's sudden animation — such that the same character might have lived to seduce another day? I want a reading that takes both Mozart's drama and Williams's anti-systematic philosophy seriously, that does not reduce the opera to a philosophical illustration, and that states honestly where the work resists the framing. Please end with a one-sentence summary of your reading on its own final line, beginning with "Bottom line:".
