answer: |-
  You have stumbled onto a genuine fissure in metaphysics, and your readers are reacting exactly as philosophers do when forced to choose between the two dominant theories of modality. You are not smuggling together two positions that should stay apart; you are deliberately writing into the gap between them.

  Here is the breakdown of the philosophical landscape, why your Mara confuses readers, and what you might call this state.

  ### 1. The Standard Distinction (Why Readers are Stuck)

  Your readers are oscillating between the two heavyweights of modal metaphysics.

  *   **Transworld Identity (Saul Kripke):** This view holds that it is literally *the same* Mara in every possible world. If she drowns in one and lives in another, it is the same numerical individual undergoing different outcomes. This matches your readers' Option 1 ("same soul replayed").
  *   **Counterpart Theory (David Lewis):** This view holds that individuals are "world-bound." Mara-Prime exists only in this world. The Mara who drowned is a *counterpart*—a distinct individual who resembles her closely. This matches your readers' Option 2 ("unrelated copy").

  **Where the distinction fails for your novel:**
  Standard metaphysics assumes **Causal Isolation**. Possible worlds, by definition, do not touch. Information cannot bleed from a world where the brother existed to a world where he didn't.
  *   If you choose Kripke, Mara *should* know the brother existed (because she is the same person), which contradicts your Draft 3 premise (she knows he never existed).
  *   If you choose Lewis, Mara *cannot* remember the drowning (because that happened to a different person in a different universe), which contradicts your Draft 3 premise (she has somatic memories).

  You are proposing **Causal Porosity between Counterparts**. You want the distinctness of Lewis (she is not numerically identical to the drowning Mara) with the psychological connectedness of Kripke (she feels the continuity).

  ### 2. Existing Concepts That Come Close

  There isn't one single term for this, but there are three frameworks that approximate different angles of what you are doing.

  **A. Parfitian Psychological Continuity**
  Derek Parfit argued that "identity" isn't what matters; *psychological connectedness* is. If Memory-Mara has the memories and trauma of Drowning-Mara, Parfit might say she survives as that person to a degree, even if they aren't numerically identical.
  *   *Why it fits:* It validates Mara's feeling of continuity without requiring them to be the "same soul."
  *   *Why it falls short:* Parfit usually applies this to time (teleportation, brain transplants), not across possible worlds.

  **B. Post-Memory (Marianne Hirsch)**
  Originally coined regarding the Holocaust, this describes when the second generation inherits traumatic memories they did not experience themselves. They are "haunted by a path they never technically walked."
  *   *Why it fits:* It captures the "ghostly," somatic, inherited nature of the memory.
  *   *Why it falls short:* It is usually intergenerational (ancestor to descendant), not inter-modal (counterpart to counterpart).

  **C. Hauntology (Jacques Derrida)**
  This refers to the persistence of elements from the past (or futures that never happened) as if they were ghosts. It is the ontology of the "almost."
  *   *Why it fits:* It perfectly describes the status of the brother. He is a "specter" of a lost possibility.
  *   *Why it falls short:* It is usually metaphorical/cultural, not a literal metaphysical mechanic for a protagonist.

  ### 3. What Should You Call It?

  Since you are breaking the rule of Causal Isolation, you are entering the realm of **Speculative Metaphysics**. You need a term that signals to the reader: *This is not reincarnation, and this is not déjà vu. This is structural leakage.*

  **Option 1: Counterpart Bleed**
  This is the most technically accurate sci-fi/fantasy term. It acknowledges the Lewisian "Counterpart" but admits the boundaries are leaking.
  *   *Usage:* "Mara suffers from counterpart bleed."

  **Option 2: Somatic Counterfactuals**
  This highlights that the memories are of things that are *counterfactually true* (true in a nearby possible world) but manifest *somatically* (in the body).
  *   *Usage:* "She is plagued by somatic counterfactuals."

  **Option 3: Echo-Identity (Your suggestion)**
  This is actually excellent. "Echo" implies a source that is no longer present (or never was present here), and "Identity" suggests it shapes who she is. It is poetic but precise.
  *   *Refinement:* **Echoic Continuity.** This suggests the *connection* is real, even if the *source* is absent.

  **Option 4: Modal Residue**
  "Modal" refers to possibility/necessity. "Residue" implies something left behind after an event that didn't technically happen here.
  *   *Usage:* "The drowning left a modal residue."

  ### 4. How to Frame It for Readers

  The reason readers ask "Is she still the same Mara?" is that they are looking for an **Ontological Answer** (What *is* she?) when you are offering a **Phenomenological Answer** (What does it *feel* like?).

  To fix this without changing your plot, you need to signal early on that **identity is porous in your universe.**

  If you want to lean into the philosophy, have a character (or the narrator) articulate the distinction. For example:

  > *"It wasn't reincarnation. Reincarnation implies a soul moving forward. This was sideways. It was the weight of a life that belonged to a woman who looked like her, spoke like her, but had made the wrong choice at the riverbank. Mara wasn't her. But she was carrying her corpse."*

  ### Recommendation

  Stick with **Echo-Identity** or **Echoic Continuity**. It is evocative, intuitive for readers, and philosophically defensible as a neologism.

  You are not smuggling incompatible positions; you are exploring a third option: **Transworld Trauma.** The standard distinction fails because it assumes possible worlds are sealed containers. Your novel posits that they are adjacent rooms with thin walls. Mara isn't the same person, and she isn't a different person; she is a **resonant frequency** of the person who drowned.

  Lean into the "haunting." The confusion your readers feel is the intended effect—they are feeling the ontological instability that Mara feels. You just need to give them the vocabulary (Echo-Identity) so they stop trying to force her into a box labeled "Reincarnation" or "Clone."
