answer: |-
  1. The mapping table
  In this analogy, the moral philosopher or internal conscience acts as the strict coach, dictating rigorous rules for behavior. The training schedule corresponds to daily acts of self-denial and altruism, consuming all leisure time and personal projects. The Olympic race or gold medal represents the achievable state of moral sainthood or maximal goodness. Spectators are society, observing and admiring the feat but not expected to participate. Genetic talent maps to natural empathetic disposition or spiritual grace available only to some. The sacrifice of social life mirrors the athlete's necessary isolation for focus. Finally, the body being pushed to physical limits corresponds to the will being stretched beyond psychological comfort. Each element suggests morality is a specialized performance requiring extreme conditioning, fundamentally separate from very ordinary, balanced daily living. The equipment represents moral tools. The arena is the public sphere. Injuries correspond to moral failures or burnout. The team represents community.

  2. Where the analogy frays
  The critical break is the endpoint. An athlete trains for a specific event with a clear finish line; once the race is run, retirement is valid. Morality has no retirement; it is continuous and pervasive. You cannot stop being moral on weekends. Furthermore, Olympic training often harms the body for future glory, whereas moral action should ideally sustain community health. The athlete seeks to beat others, but moral goodness isn't zero-sum; my virtue doesn't require your vice. Competitors must lose for one to win. Athletic excellence is domain-specific (running), while morality is domain-general (everything). Framing moral growth as sacrifice implies life is naturally immoral, whereas athletes accept their body's limits and push past them for records. The saint isn't preparing for a moment of peak performance but engaging in a lifelong mode of being. The "sacrifice" framing fails because it treats normal life as baseline rather than moral life itself.

  3. What the athlete picture smuggles in
  Thus this imagery assumes moral good is competitive and performative. It suggests virtue is a spectacle for spectators rather than a relational way of existing. By likening saints to elites, it creates a caste system where morality is optional for the masses. It frames ethical living as a burden to be endured rather than a flourishing to be enjoyed. This presupposes that normal life is inherently non-moral, requiring extraordinary effort to transcend. It turns ethics into a sport where only the gifted compete, letting everyone else off the hook for ultimately mediocrity. It implies moral worth is scarce, like medals.

  4. The reward-hacking twist
  Reward hacking occurs when an agent maximizes a specified metric while violating the intended goal. If moral saints are reward hackers, they optimize visible moral metrics (charity, self-denial) while missing the point of human flourishing. They might save strangers but neglect friends, or pursue purity over kindness. This suggests maximal goodness, defined narrowly, is undesirable because it distorts the whole life. However, if the metric is true flourishing, hacking is impossible. If the saint is hacking, they aren't really morally good, just good at looking it. This weakens the conclusion: it's not that maximal goodness is bad, but that their definition of goodness is flawed. We shouldn't avoid sainthood; we should avoid hacking. The danger isn't being too good, but optimizing the variables, turning morality into a hollow scorekeeping exercise rather than integrated living system. Specifically, they maximize output while ignoring context. This distinction is very crucial for evaluating desirability.

  5. Does the conclusion survive?
  Thus the conclusion that maximal goodness is undesirable does not survive. The Olympic analogy carried the weight by framing morality as optional specialization. Once we see morality as foundational rather than competitive, the "too much" argument collapses. You cannot have too much health or too much honesty in a well-functioning system. The reward hacking insight suggests the problem is misaligned metrics, not intensity. Therefore, maximal moral goodness remains desirable, provided it is defined holistically. The group's argument relies on a distorted view of ethics as external labor rather than internal coherence. Analogy did the heavy lifting. Without it, claim fails.

  6. A better analogy
  A better analogy is physical health. Everyone needs baseline vitality, though few become bodybuilders. Neglecting health harms everyone. Moral growth enables better functioning; health enables life, not vice versa. Maximal health isn't suspicious, though obsessing over metrics is. Ethics should be seen as hygiene, not a specialized sport. It is foundational infrastructure, not optional performance. All need it; few need to be professionals. As exercise strengthens the body, virtue strengthens character. Both require daily consistency.
