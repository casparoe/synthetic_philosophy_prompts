answer: |-
  # Specification for a Theory of Historiographical Judgment

  ## I. Empirical Adequacy: The Test Cases
  An adequate theory must account for the "hard cases" of historical evaluation without reducing them to caricature. It must explain how we talk about these cases without contradiction.

  **1. The Case of Standardized Immorality**
  *   **The Case:** Evaluating practices that were universally accepted in a specific context but violate fundamental contemporary norms (e.g., 19th-century gynecological experimentation on enslaved women, or pre-aseptic surgical mortality rates).
  *   **Requirement:** The theory must allow the historian to render the practice *intelligible* within its context without rendering it *morally valid*. It must distinguish between "they could not have known better" (epistemic constraint) and "they chose not to care" (moral failing).
  *   **Status:** **Non-negotiable.** If a theory collapses intelligibility into validity, history becomes moral apology. If it collapses validity into intelligibility, history loses its critical function and becomes mere antiquarianism.

  **2. The Case of the Moral Pioneer**
  *   **The Case:** Evaluating actors who opposed the norms of their time using resources available to them (e.g., an abolitionist in a slave-holding republic, or a dissident theologian in a confessional state).
  *   **Requirement:** The theory must allow for *trans-contextual praise*. It must explain how an agent can be "ahead of their time" without implying they were actually time-travelers holding modern views. It must account for the source of their dissent (internal contradiction within the era's values vs. importation of external values).
  *   **Status:** **Non-negotiable.** If a theory cannot account for moral progress or dissent, it renders history as a series of closed, incommensurable moral bubbles, making the concept of ethical learning unintelligible.

  **3. The Case of Structural Complicity**
  *   **The Case:** Evaluating "ordinary" agents who benefited from unjust systems without actively perpetuating them through violence (e.g., a Northern textile merchant benefiting from slave cotton, or a German civilian in the 1930s).
  *   **Requirement:** The theory must provide a vocabulary for *passive participation* that distinguishes it from active perpetration while maintaining moral weight.
  *   **Status:** **Non-negotiable.** Without this, historiography reverts to a "great man" theory of evil, exonerating the structural conditions that make atrocities possible.

  ## II. Conceptual Hygiene: The Distinctions
  An adequate theory must maintain specific logical boundaries. Collapsing these distinctions leads to category errors.

  **1. Explanation versus Justification**
  *   **The Distinction:** Explaining the causal or cultural conditions that produced an action is not equivalent to justifying the action as right or permissible.
  *   **Requirement:** The theory must prevent the "genetic fallacy" in moral judgment (i.e., "because it had a cause, it was inevitable/excusable").
  *   **Status:** **Non-negotiable.** This is a constitutive rule of rational discourse. Collapsing this turns history into theology (providence) or determinism (fatalism), removing agency.

  **2. Moral Presentism versus Epistemic Presentism**
  *   **The Distinction:** *Epistemic presentism* is using current knowledge to assess past outcomes (e.g., knowing a policy caused famine, even if the actor didn't intend it). *Moral presentism* is applying current values to assess past motives (e.g., judging a medieval king by modern democratic standards).
  *   **Requirement:** The theory must permit epistemic presentism (we know more facts than they did) while regulating moral presentism (we must contextualize their values).
  *   **Status:** **Non-negotiable.** Denying epistemic presentism makes historical learning impossible (we cannot learn from past mistakes if we pretend we don't know the outcome). Denying the regulation of moral presentism makes understanding impossible (we cannot understand the past if we demand they be us).

  **3. Anachronism of Concept versus Anachronism of Value**
  *   **The Distinction:** *Conceptual anachronism* involves using analytical categories the actors lacked (e.g., describing a feudal relationship as "class struggle"). *Value anachronism* involves judging actors by standards they could not recognize (e.g., condemning a Bronze Age warrior for lacking a concept of universal human rights).
  *   **Requirement:** The theory must allow for conceptual anachronism as a methodological necessity (we need modern language to analyze the past) while treating value anachronism as a risk to be managed.
  *   **Status:** **Preference/Negotiable.** Some schools (e.g., Cambridge School) argue conceptual anachronism must be minimized to recover meaning. Others (e.g., Marxists, Annales) argue it is unavoidable and necessary for critical analysis. An adequate theory must *acknowledge* this tension, even if it takes a side.

  ## III. Methodological Constraints: The Practice
  An adequate theory must be operable given the material realities of historical research.

  **1. Archival Silence and Epistemic Humility**
  *   **The Constraint:** The historical record is fragmentary; the voices of the marginalized are often absent.
  *   **Requirement:** The theory must not demand moral accounting that the archive cannot support. It must distinguish between "no evidence of guilt" and "evidence of no guilt."
  *   **Status:** **Non-negotiable.** A theory that demands definitive moral verdicts where evidence is structurally silenced forces the historian into fabrication.

  **2. Recovery of Actors' Categories (The Principle of Charity)**
  *   **The Constraint:** Historians must reconstruct the "web of belief" of the agents to understand their actions as rational *to them*.
  *   **Requirement:** The theory must prioritize internal coherence of the actor's worldview before applying external judgment.
  *   **Status:** **Non-negotiable.** Without this, history becomes projection. We are not studying ourselves; we are studying *others*.

  **3. The Risk of Projecting Modern Taxonomies**
  *   **The Constraint:** Modern categories (e.g., "sexuality," "religion," "economy") often carve up the past in ways that distort past lived experience.
  *   **Requirement:** The theory must include a reflexive mechanism to test whether modern taxonomies illuminate or obscure past practices.
  *   **Status:** **Non-negotiable.** Failure here results in "Whig history," where the past is merely a clumsy draft of the present.

  ## IV. The Central Tension: Satisfiability of the Dual Demand

  The core specification rests on two competing demands:
  1.  **The Hermeneutic Demand:** Honor the past agent's self-understanding (Internalism).
  2.  **The Critical Demand:** Apply present ethical knowledge to assess the past (Externalism).

  **Is this pairing jointly satisfiable?**

  *   **The Argument for Unsatisfiability:** If we fully honor self-understanding, we must suspend judgment (relativism). If we fully apply present ethics, we overwrite self-understanding (presentism). On this view, the tension is a logical contradiction. Any theory claiming to solve it is masking a preference for one side.
  *   **The Argument for Constitutive Tension:** The pairing is not a problem to be solved but the *engine* of the discipline. History is not a court of law (verdict only) nor a novel (empathy only). It is a dialogue between the dead and the living.

  **Specification Ruling:**
  An adequate theory must treat this tension as **constitutive, not resolvable.**
  *   **Why Non-negotiable?** If a theory claims to fully satisfy both demands without remainder, it usually achieves this by secretly collapsing one into the other (e.g., claiming that "true understanding" *is* "forgiveness," or that "true judgment" requires no "context").
  *   **The Criterion:** The theory must explicitly locate *where* the friction occurs. It must specify the conditions under which the Critical Demand overrides the Hermeneutic Demand (e.g., crimes against humanity) and where the Hermeneutic Demand suspends the Critical Demand (e.g., theological disputes with no modern equivalent).

  **Conclusion on the Tension:**
  The specification requires that the theory acknowledge that **historical judgment is inherently tragic.** It involves a necessary violence to the past (categorizing it in our terms) to make it speak to the present, balanced by a necessary submission to the past (listening to their terms) to prevent the present from solipsism. A theory that promises a clean escape from this dilemma fails the specification because it denies the ontological gap between the historian and the agent. The "adequate theory" is not one that escapes the frameworks of its own era, but one that rigorously accounts for the distortion those frameworks introduce while maintaining the right to judge.
