answer: |-
  This is a sharp observation, and you are right to feel that there is a specific conceptual shape to it. You aren't overfitting; you have identified a well-known tension in the philosophy of history, though it lacks a single "Gell-Mann Amnesia" style pop-rationalist label.

  Here is the breakdown of the concept, how it differs from standard biases, and the historical framework that would falsify it.

  ### 1. Does it have a name?

  There is no single canonical noun for this, but in historiography and political philosophy, it is best described as **Normative Causal Asymmetry** within **Whig Historiography**.

  However, the specific move you are describing—decoupling the "good" structural outcomes from the "bad" structural means—is often called **"The Circumstantial Defense"** (specifically regarding the Terror) or, more broadly, **"Teleological Cleaning."**

  The French historian **François Furet** made this his life's work. In *Interpreting the French Revolution* (1978), he attacked the Marxist (Social) historians who viewed the Terror as a structural necessity of class struggle, *and* the Liberal historians who viewed the Terror as an accidental deviation from a liberal trajectory. Furet argued that the Terror was **structurally inherent to the revolutionary ideology itself**, not a result of war or grain prices. He called out the liberal historians for exactly what you noticed: trying to claim the *rights of man* (structural good) while disowning the *guillotine* (structural bad) by labeling it an accident.

  If you need a label to use in conversation, **"Moralized Causal Attribution"** is the most precise descriptive term. It captures the mechanism: the causal model (structure vs. contingency) is selected *post hoc* based on the moral valence of the outcome.

  ### 2. How is this different from Motivated Reasoning or the Fundamental Attribution Error (FAE)?

  It is a specific *species* of these, but distinct in its mechanics.

  **Vs. Motivated Reasoning:**
  Motivated reasoning is the engine; this is the chassis. Standard motivated reasoning is "I believe X because I want X to be true." This historiographical pattern is more sophisticated: "I believe the *causal mechanism* for X is structural, but the *causal mechanism* for Y is contingent, because I need X to be legitimate and Y to be aberrant." It is a **narrative coherence bias**. It protects the *story* of progress, not just the conclusion.

  **Vs. The Fundamental Attribution Error:**
  The FAE is typically individual-level: "He yelled because he is angry (dispositional)," not "He yelled because he is under stress (situational)."
  In your historiographical pattern, the error is scaled to macro-history:
  *   **For the Good (Reform):** Historians avoid the FAE. They correctly identify the **Situation** (feudal crisis, fiscal collapse).
  *   **For the Bad (Terror):** Historians *commit* the FAE. They attribute mass violence to **Dispositions** (Robespierre's paranoia, Jacobin fanaticism) rather than the Situation (invasion, inflation, collective action problems).

  So, you could call this **"The Selective Fundamental Attribution Error."** It is the systematic application of situational logic to victories and dispositional/contingent logic to atrocities.

  ### 3. What case would falsify this framing?

  You asked for a historical case where structural forces clearly produced both liberal reform and mass violence together, with no contingent trigger that you could separate out.

  The strongest candidate for this is **State-Building Theory**, specifically the work of **Charles Tilly** (*Coercion, Capital, and European States*).

  **The Argument:**
  Tilly argues that the modern liberal state (the "good" outcome: rule of law, rights, administration) and mass violence (the "bad" outcome: war, conscription, taxation, suppression of dissent) are **the same structural process**.
  *   To create a state that can enforce rights, you need a monopoly on violence.
  *   To create a monopoly on violence, you need extraction (taxation) and coercion.
  *   Therefore, the "Constitutional Break" and the "Terror" are not separable. The capacity to grant rights is the *same capacity* required to send people to the guillotine.

  If you accept Tilly's framework, the French Revolution isn't "Reform + Accident." It is **"State Centralization."** Sometimes that centralization looks like the National Assembly (good), and sometimes it looks like the Committee of Public Safety (bad). They are the same engine running at different RPMs.

  **Another Falsification Case: The Haitian Revolution**
  This is often the "control group" for the French Revolution.
  *   **Structure:** A slave plantation economy.
  *   **Outcome:** Universal Emancipation (Liberal Good) + Extreme Violence (Massacre of whites/colonists).
  *   **The Link:** In Haiti, you cannot have the "Good" (freedom) without the "Bad" (violent destruction of the plantation class). The violence was not an accident of war or paranoia; it was the *structural price* of the liberty.
  *   Historians who try to apply the "Contingent Terror" model to Haiti fail. The violence is acknowledged as structurally necessary to break the slave power. If you apply this lens back to France, the Terror becomes the structural price of breaking feudal/aristocratic power.

  ### Summary for your mental model

  You have identified **Normative Causal Asymmetry**.

  *   **The Mechanism:** Historians treat "Progress" as a river (structural, inevitable) and "Atrocity" as a rock in the river (contingent, removable).
  *   **The Reality Check:** Political scientist **James C. Scott** (*Seeing Like a State*) and **Charles Tilly** argue that the river *is* the rock. High-modernist state capacity produces both the welfare state and the gulag. They are not separate causal chains; they are the same chain.
  *   **The Rationalist Take:** This is a failure of **Bayesian updating**. Historians hold a strong prior ("The Revolution = Liberty") and treat evidence of Violence as noise (contingency) rather than signal (structure), because updating the prior to "The Revolution = State Capacity" is normatively uncomfortable.

  If you want to read one thing that validates your intuition while giving you the vocabulary to crush it in a debate, read **François Furet's *Interpreting the French Revolution***. He explicitly argues that the Terror was not a deviation, but the *fulfillment* of the revolutionary discourse. He calls out the "circumstantial defense" exactly as you have described it.
