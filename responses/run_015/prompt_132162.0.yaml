 here can recognize that this is a serious philosophy of the body rather than metaphorical musing. We are here to investigate whether food is simply fuel to keep the machine running safely or if it is a tool we wield to shape the self and I suspect the truth lies in the difficult conversation between your respective frameworks so let us begin by listening to how each side defines what it means to be well.

