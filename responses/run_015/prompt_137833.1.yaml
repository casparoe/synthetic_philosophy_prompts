answer: |-
  This is a fascinating project. As a scientist approaching philosophy, you are engaging in what John Rawls called **"rational reconstruction."** You are taking a historical text, stripping away the rhetorical flourishes, and attempting to build a coherent formal model that captures its normative force. Given your background in spectroscopy—studying how matter interacts with light to reveal structure—you are well-suited to study how agents interact with moral sentiments to reveal ethical structure.

  However, to make your "spectator function" faithful to Adam Smith (specifically *The Theory of Moral Sentiments*, 1759), you need to adjust several parameters. Your current formulation leans heavily toward **Act Utilitarianism**, whereas Smith is fundamentally a **Virtue Ethicist** concerned with **Propriety**.

  Here is a breakdown of how to settle your specification problems, translating Smith's moral psychology into your decision-theoretic framework.

  ### 1. The Utility Function: Harmony, Not Aggregation
  **Your Question:** *If the spectator is perfectly sympathetic, doesn't its approval reduce to a utilitarian utility function (total/average happiness)?*

  **The Smithian Correction:** **No.** This is the most common misconception about Smith. David Hume defined sympathy as a contagion of sentiments; Smith redefined it as an **imaginative transposition**.

  For Smith, the Impartial Spectator does not sum up the happiness of all affected parties. Instead, the Spectator judges the **propriety** of the agent's motives relative to the cause that excited them.
  *   **Utilitarianism:** Maximizes $\sum U_{consequences}$.
  *   **Smithian Propriety:** Minimizes the distance between the Agent's actual sentiment and the Sentiment the Spectator *would* feel in the Agent's situation.

  **Formal Suggestion:**
  Do not define the Spectator's utility as a sum of welfare. Define it as a **harmony function**.
  Let $S_A$ be the strength of the Agent's passion (e.g., grief, anger, joy).
  Let $S_{Sim}$ be the strength of the passion the Spectator simulates via imagination.
  The Spectator's "approval" is maximized when $|S_A - S_{Sim}| \to 0$.

  If you model it as Utilitarian, you lose Smith's distinction between *propriety* (was the emotion appropriate?) and *merit* (did the action deserve reward?). Smith argues we can approve of a failed benevolent action (high merit, good motive) or disapprove of a successful malicious one (bad motive, lucky outcome). A consequentialist model cannot capture this.

  ### 2. The Probabilities: De-biased Credences
  **Your Question:** *Whose probabilities should the spectator use: my credences, objective chances, or the spectator's rational posterior?*

  **The Smithian Correction:** Smith is not an omniscient God. The Impartial Spectator is an idealized version of *human* judgment, cultivated through social experience.

  Smith argues that we judge actions based on the **intentions** and the **foreseeable consequences**, not the actual outcomes (which are subject to luck). If I try to save a drowning child but fail due to a sudden current, Smith's Spectator approves of the action. If I try to poison someone but fail because the dose was too small, the Spectator condemns me.

  **Formal Suggestion:**
  Use the **Agent's Credences**, but passed through a **De-biasing Filter**.
  *   **Input:** $P_{agent}(Outcome | Action)$
  *   **Filter:** Remove self-serving bias and immediate passion distortions.
  *   **Spectator's Probabilities:** $P_{spec} \approx \text{Debiased}(P_{agent})$

  Do not use "objective chances." Smith is explicit that moral worth attaches to the design and intention, not the fortuitous result. Using objective chances would make morality a lottery, which Smith explicitly argues against (see his discussion on the "influence of fortune"). Do not use the Spectator's omniscient posterior, because that removes the human element of decision-making under uncertainty, which is where virtue resides.

  ### 3. The Mechanism: Cognitive Simulation, Not Contagion
  **Your Question:** *Should I treat sympathy as emotional contagion or something cognitive?*

  **The Smithian Correction:** Smith is explicit that sympathy is **not** mere emotional contagion (like yawning when someone else yawns). In Part I, Section I, Chapter 1, he writes:
  > "It is the impressions of our own senses only, not those of his, which our imaginations copy."

  I do not feel your pain directly; I imagine what *I* would feel if *I* were in *your* body and situation. This is a **simulation heuristic**.

  **Formal Suggestion:**
  Model Sympathy as a **Counterfactual Simulation**.
  $$ \text{Sympathy} = \text{Utility}_{spec}(\text{State}_{world} | \text{If I were Agent}) $$
  The Spectator runs a simulation of the world where *it* occupies the Agent's epistemic and physical position. The resulting emotional state is compared to the Agent's actual emotional state.
  *   If Agent's Grief > Spectator's Simulated Grief $\rightarrow$ Disapproval (Excessive/Weakness).
  *   If Agent's Grief < Spectator's Simulated Grief $\rightarrow$ Disapproval (Hardness/Insensitivity).
  *   If Agent's Grief $\approx$ Spectator's Simulated Grief $\rightarrow$ Approval (Propriety).

  ### 4. Revised Model Specification
  If you want to build a "Smithian Agent," here is how I would specify the parameters based on the text:

  1.  **State Space:** Includes physical outcomes *and* mental states (motives, passions).
  2.  **Spectator's Objective Function:** Minimize the **Sympathetic Gap**.
      $$ L = \mathbb{E} \left[ \left| \text{Passion}_{agent} - \text{Passion}_{simulated} \right| \right] $$
      *(Note: This is a loss function to be minimized, not utility to be maximized.)*
  3.  **Information Set:** The Spectator has access to all facts the Agent had *at the time of decision*, plus general social norms, but excludes future knowledge of outcomes.
  4.  **Decision Rule:** The Agent chooses the action that minimizes the expected Sympathetic Gap between their motives and the Spectator's simulated reaction.

  ### 5. Potential Pitfalls for a Scientist
  Since you come from experimental physics, two warnings are in order:

  **A. The "Is-Ought" Calibration**
  In spectroscopy, your model must match the empirical data. In ethics, the "data" are our considered moral judgments (reflective equilibrium). Smith's model is descriptive *and* normative. He claims this is how we *do* judge, and therefore how we *should* judge. If your formal model produces verdicts that violate deep moral intuitions (e.g., it approves of punishing an innocent person to calm a mob), the model is flawed, not the intuition. Smith's Spectator would *not* approve of that, because the Spectator embodies long-term social stability and justice, not immediate utility.

  **B. The Parameter Drift**
  Smith's Spectator is not a static constant. It is educated. The "Man within the breast" is cultivated over a lifetime of social interaction. In your model, the Spectator's priors should be **dynamic**, updating based on social feedback. A static spectator function risks becoming dogmatic.

  ### Recommended Reading for Your Project
  To refine your parameters, I recommend moving beyond popular summaries to the secondary literature that treats Smith analytically:

  1.  **Charles Griswold, *Adam Smith and the Virtues of Enlightenment* (1999).**
      *   Griswold treats Smith systematically. He discusses the "impartial spectator" as a normative ideal similar to a Kantian ideal, but grounded in sentiment. This will help you define the "rationality" of your spectator.
  2.  **D.D. Raphael, *The Impartial Spectator* (2007).**
      *   Raphael is perhaps the foremost 20th-century analyst of Smith. He deals precisely with the cognitive vs. emotional nature of sympathy.
  3.  **Amartya Sen, *On Ethics and Economics* (1987).**
      *   Sen compares Smith's approach to modern welfare economics. He explicitly critiques the reduction of Smith to Utilitarianism, which validates your suspicion that something is missing in the standard summary.
  4.  **Eric Schliesser, *Adam Smith: Systematic Philosopher and Public Thinker* (2017).**
      *   Schliesser treats Smith as a system-builder, which should resonate with your desire for formal modeling.

  ### Summary
  You are on the right track by seeking formalism, but you are currently modeling **Harsanyi's Impartial Observer** (Utilitarian) rather than **Smith's Impartial Spectator** (Virtue/Propriety).

  *   **Change the Utility:** From Sum-Happiness to Sentiment-Harmony.
  *   **Change the Probabilities:** From Objective/omniscient to Agent-relative/De-biased.
  *   **Change the Mechanism:** From Contagion to Counterfactual Simulation.

  If you make these adjustments, your "spectator function" will be a robust rational reconstruction of Smith's moral theory, rather than a utilitarian model wearing Smith's name.
