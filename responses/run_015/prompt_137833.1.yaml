          *   The Spectator judges based on the *motives* and the *expected* outcomes as understood by the agent, but corrected for bias.
          *   *Formal translation:* The Spectator should probably use the *agent's* credences, but updated for rationality (removing self-serving bias). Using "objective chances" makes it too consequentialist (luck shouldn't determine moral worth for Smith). Using the Spectator's omniscient view removes the human element of decision-making under uncertainty.
          *   *Recommendation:* Use the agent's credences, but "de-biased."

      *   **Q2: Utility Function (Utilitarianism?):**
