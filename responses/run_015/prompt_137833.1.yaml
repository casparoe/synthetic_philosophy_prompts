          *   *Formal translation:* The utility function isn't $\sum U_i$. It's a measure of *alignment* between the agent's motives and the spectator's simulated reaction. It's more deontological/virtue-ethical than consequentialist.
          *   *Risk:* If the user forces a Utilitarian function, they stop modeling Smith and start modeling Harsanyi or Rawls.

