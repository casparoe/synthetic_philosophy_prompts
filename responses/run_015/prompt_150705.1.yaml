      *   *Tier 3 (Conceptual/Ownership):* Action Ownership. If Brain A moves Hand A, does Brain B feel agency? If not, where is the "I"? If yes, how do you distinguish from empathy?
      *   *Tier 4 (Falsifiability):* The "No True Scotsman" risk. Defining "tight enough" post-hoc.

  5.  **Comparing to Psychological Continuity:**

      *   Standard View (Parfit/etc.): Identity is about memory and character continuity over time.
      *   Distributed View: Identity is about *simultaneous* computational integration.
      *   *Prediction:* The Distributed View predicts that if you sever the link, the "self" should divide or diminish *immediately*, whereas Psychological Continuity says they remain two distinct people who just stop sharing data. The Distributed View predicts a *loss of capacity* akin to lobotomy, not just isolation.

  6.  **Addressing Falsifiability & "Castle in the Air":**

