answer: |-
  This is a sharp analytical framework. Your distinction between **Charter Aim** (the concrete institutional purpose) and **Slogan Autonomy** (the abstract principle invoked for defense) is a robust tool for this specific debate. It effectively isolates the *bait-and-switch* often happening in these conversations: swapping a specific, controversial Charter Aim for a generic, defensible Slogan Autonomy.

  I will refine the tool slightly for precision: **Charter Aim** is what the institution was *legally or materially structured to secure*. **Slogan Autonomy** is the *retrospective justification* offered to make that aim palatable to a broader audience.

  To give you the "menu" you asked for, we must apply this tool across the **Three Historical Layers** you identified. The uncle's argument fails because he mixes and matches layers to hide the Charter Aims.

  Here are the four precise readings of the slogan *"The war was about states' rights, not slavery,"* analyzed by truth value and whether they support his conclusion that monuments are innocent heritage.

  ### 1. The "Instrumental" Reading
  *   **The Thesis:** "States' rights" was the legal mechanism (Slogan Autonomy), but the specific right being protected was exclusively the right to hold human property (Charter Aim).
  *   **Layer 1 (Secession):** What seceding states said.
  *   **Layer 2 (Confederacy):** What the government was structured to protect.
  *   **Truth Value:** **Trivial Truism.** It is technically true that they used the language of states' rights. However, it is functionally misleading because the *only* state right they demanded federal protection for (or threatened secession over) was slavery.
  *   **Does it support the Uncle?** **No.**
      *   *Why:* If the "state right" in question is specifically the right to own slaves, then defending the "state right" is identical to defending slavery. You cannot separate the mechanism from the object.
      *   *Cookout Counter:* "Uncle, if I rob a bank and argue I was just exercising my 'right to open doors,' the mechanism is door-opening, but the aim is theft. Protecting the 'right' to own people makes the war about slavery, regardless of the legal mechanism used."

  ### 2. The "Abstract Constitutional" Reading
  *   **The Thesis:** The Confederacy was founded on a high-minded principle of federalism and local sovereignty (Charter Aim), and slavery was merely an incidental economic feature of the South at the time, not the cause of the split.
  *   **Layer 1 (Secession):** What seceding states said.
  *   **Layer 2 (Confederacy):** What the government was structured to protect.
  *   **Truth Value:** **Flatly False.**
      *   *Why:* The Confederate Constitution explicitly forbade member states from abolishing slavery within their own borders. A government structured to *force* states to keep slaves cannot claim its Charter Aim was generic "local sovereignty."
      *   *Uncertain Fact Flag:* Some secession declarations (e.g., South Carolina) focus heavily on federal overreach, while others (e.g., Mississippi, Texas) lead explicitly with slavery. If your uncle argues "Some states didn't mention slavery," he is technically right about *some* documents, but wrong about the *Confederate government* they formed.
      *   *Does it support the Uncle?* **Yes, but only if accepted.** This is the reading required for his argument to work. He needs the Charter Aim of the Confederacy to be "Federalism" rather than "Slavery."
      *   *Cookout Counter:* "If the aim was just local control, why did the Confederate Constitution forbid Southern states from freeing their own slaves? That's not local control; that's a national mandate for slavery."

  ### 3. The "Soldier's Experience" Reading
  *   **The Thesis:** The individual soldiers fighting in 1861–1865 were not fighting to protect the institution of slavery (Charter Aim), but to defend their homes from invasion (Slogan Autonomy). Therefore, monuments honor their bravery, not the political cause.
  *   **Layer 3 (Monuments):** What later monument-builders were honoring.
  *   **Truth Value:** **Substantive and Defensible (with caveats).**
      *   *Why:* Most Confederate soldiers did not own slaves. Their immediate motivation was often defense of locality. However, this conflates the *soldiers' motives* with the *state's Charter Aim*. You can fight bravely for a cause that is morally bankrupt.
      *   *Does it support the Uncle?* **Partially.** This gets him closest to "heritage." It allows him to say, "I'm honoring the grandfather's bravery, not the slavery."
      *   *Cookout Counter:* "We can honor bravery without honoring the cause. But we don't put up statues of brave SS soldiers and claim it's just about 'defending the homeland.' The monument isn't to the private; it's to the Confederacy he died for."

  ### 4. The "Retroactive Heritage" Reading
  *   **The Thesis:** The monuments were not built immediately after the war to honor the dead, but decades later (1890s–1920s and 1950s–1960s) to assert white supremacy during Jim Crow and Civil Rights eras. The "States' Rights" slogan is a retroactive cover for this later Charter Aim.
  *   **Layer 3 (Monuments):** What later monument-builders were honoring.
  *   **Truth Value:** **Substantive and Historically Strong.**
      *   *Why:* The vast majority of Confederate statues were not erected in the "grief period" (1865–1880) but during the codification of Jim Crow laws and the resistance to desegregation.
      *   *Uncertain Fact Flag:* There are *some* early monuments in cemeteries (1870s). If your uncle points to one specific early cemetery statue, he is technically right about *that* statue. But the prominent public squares/courthouses are overwhelmingly later.
      *   *Does it support the Uncle?* **No.** This destroys the "innocent heritage" claim. It reveals the *Monument Builders'* Charter Aim was not "remembering history" but "enforcing racial hierarchy."
      *   *Cookout Counter:* "If these were just about heritage, why were most built 40 years after the war, right when they were passing laws to stop Black people from voting? That timing suggests the Charter Aim was intimidation, not history."

  ### Summary Menu for the Cookout

  Here is how you can present this to your uncle. You can ask him which "box" his argument falls into:

  | Reading | What "States' Rights" Means | Truth Value | Does it prove monuments are innocent? |
  | :--- | :--- | :--- | :--- |
  | **1. Instrumental** | The legal tool used to protect slavery. | **True** | **No.** Protecting the tool means protecting the slavery. |
  | **2. Abstract** | A generic principle of federalism; slavery was accidental. | **False** | **Yes,** but requires ignoring the Confederate Constitution. |
  | **3. Soldier Focus** | The boys fought for home, not policy. | **Defensible** | **Weakly.** Honors the men, but ignores the government they served. |
  | **4. Retroactive** | A slogan used later to justify Jim Crow segregation. | **True** | **No.** Reveals the monuments themselves are about racism, not war. |

  ### How to Use the "Charter Aim vs. Slogan" Tool Live

  If he doubles down, use your tool to pinpoint the switch:

  1.  **Identify the Confederacy's Charter Aim:** "The Confederate government's Charter Aim was explicitly to protect slavery (Article IV, Section 3 of their Constitution). You can't change that."
  2.  **Identify the Monument's Slogan Autonomy:** "The people who built the statues in the 1920s and 1960s used the Slogan Autonomy of 'Heritage' and 'States' Rights.'"
  3.  **Spot the Swap:** "Your argument works only if you pretend the Monument's Slogan (Heritage) erases the Confederacy's Charter Aim (Slavery). But a monument to a group is a tribute to what that group *stood for*, not just the bravery of its members."

  **The Kill Shot:**
  "Uncle, if 'States' Rights' is the Charter Aim, then the monuments honor the right to secede. If the right to secede was only used to protect slavery, then the monuments honor the right to protect slavery. You can have the 'States' Rights' slogan, but you have to admit the 'Charter Aim' was human bondage. Which one are you willing to put on the plaque?"
