prompt: |-
  hey — practical one. At work we're about to ship a model that ranks job applicants for a first-round interview, and it'll run in two countries at once, with different base rates of "would have been a good hire" and, because of local headcount, different cut-offs. I'm the one who has to write down what "fair" means for it before it ships, and I don't want to just copy a defintion out of a library.

  So: write me the desiderata. Not a list of published criteria — the spec those would have to meet. What would a fairness criterion for a ranking model in this situation have to deliver to count as adequate here? The distinctions it has to keep intact, the cases it has to get right, and the facts about our setup it has to be consistent with. The distinctions I have in mind (tell me if I'm drawing them in the wrong place): "a given score means the same thing in both groups" vs "the false-positive and false-negative rates match across groups"; fair at the threshold we happen to use vs fair at every threshold we might move to; fair for the two groups we wrote down vs fair for every subgroup someone names at us next year; and fair in the statistical sense vs fair in the causal sense, i.e. about why the model scored this person differently. Give me the case or consideration behind each requirement, so I can tell a genuine desideratum from one camp's prejudice dressed up as a principle, and mark which ones are non-negotiable for us and which are preferences I could trade away.

  Two constraints, built into the list rather than bolted on at the end: we only ever observe whether someone was a good hire for the people we actually hired, and the model gets retrained every quarter on the outcomes of its own past decisions — so whatever we adopt has to be checkable from data that has been filtered by, and partly created by, the model itself. And it has to be statable to a rejected candidate or to a regulator without collapsing into something vacuous.

  The part I most want: I know the standard impossibility results — you can't satisfy all of these across groups at once once the base rates differ. So tell me which subset of my desiderata is provably unsatisfiable together, because if that's the situation then the real question isn't which criterion to pick, it's which requirement I drop and what I say out loud when I drop it. And if there's one requirement that does most of the work of knocking candidate definitions out, point at it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Shipping a job applicant ranking model in two countries.
      *   **Problem:** Different base rates (probability of being a "good hire") and different cut-offs (due to headcount).
      *   **Task:** Write the *desiderata* (specifications/requirements) for fairness, not just copy-paste definitions.
      *   **Specific Distinctions to Address:**
          *   Score meaning vs. Error rates.
          *   Fairness at current threshold vs. all thresholds.
          *   Defined groups vs. future subgroups.
          *   Statistical vs. Causal fairness.
      *   **Constraints:**
          *   Selective Labels Problem (only observe outcomes for hired people).
          *   Feedback Loops (model retrains on its own decisions).
          *   Explainability (must be statable to candidates/regulators).
      *   **Key Ask:** Identify the *impossibility results* (which subset is unsatisfiable together) and identify the *pivot point* (the requirement that knocks out the most candidates). Distinguish non-negotiables from preferences.

  2.  **Deconstruct the Situation:**
      *   **Ranking Model:** It's not just binary classification; it's a score used to rank. But decisions are made at a cut-off.
      *   **Two Countries:** Group $A$ and Group $B$.
      *   **Different Base Rates:** $P(Y=1|A) \neq P(Y=1|B)$.
      *   **Different Cut-offs:** $t_A \neq t_B$ (due to headcount needs).
      *   **Selective Labels:** We don't know $Y$ for rejected applicants. This makes measuring false negatives impossible without strong assumptions.
      *   **Feedback Loops:** Decisions today affect training data tomorrow.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to translate the user's distinctions into concrete requirements.
      *   *Requirement 1: Calibration (Score Meaning).* "A score of 0.8 means 80% chance of success" in both countries.
      *   *Requirement 2: Error Rate Balance (at threshold).* Equal FPR/FNR *given the specific cut-offs used*.
      *   *Requirement 3: Threshold Agnosticism.* Fairness shouldn't break if HR changes headcount (cut-off moves).
      *   *Requirement 4: Group Robustness.* Fairness shouldn't break if we slice by gender/ethnicity within countries later.
      *   *Requirement 5: Causal/Construct Validity.* The score reflects potential, not just historical bias.
      *   *Requirement 6: Observability.* We must be able to measure this given selective labels.
      *   *Requirement 7: Explainability.* Can we tell a rejected candidate why?

  4.  **Analyzing Constraints & Impossibility:**
      *   *The Big One:* Base rates differ ($P(Y|A) \neq P(Y|B)$).
      *   *Theorem:* If base rates differ, you cannot simultaneously satisfy Calibration (Requirement 1) and Error Rate Balance (Requirement 2) across groups, unless the model is perfect or trivial. (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017).
      *   *The Selective Labels Constraint:* We *cannot* measure False Negatives directly. We don't know if rejected people would have been good. This makes FNR balance (Requirement 2) uncheckable without assuming the model is already correct (circular).
      *   *The Feedback Loop:* If we optimize for one group's success now, we might starve the other group of data, worsening the model for them next quarter.

  5.  **Selecting the "Non-Negotiables" vs. "Preferences":**
      *   *Non-Negotiable:* Observability (if you can't measure it, you can't govern it). Calibration (essential for a *ranking* model to be useful across different cut-offs).
      *   *Preference (to be dropped):* Equal Error Rates at specific thresholds. Why? Because base rates differ and cut-offs differ. Enforcing this breaks Calibration.
      *   *Preference (to be dropped):* Threshold Agnosticism (mostly). If cut-offs are business decisions, fairness might need to be defined *at* the operating point, not everywhere.
      *   *Preference (to be dropped):* Causal Fairness. Too hard to prove/communicate legally. Stick to statistical proxies that are defensible.

  6.  **Addressing the "Pivot Point":**
      *   The requirement that kills the most candidates is **Calibration across groups** combined with **Different Base Rates**.
      *   Actually, the stronger pivot is **Observability under Selective Labels**. If you demand FNR parity, you demand the impossible (knowing the counterfactual).
      *   However, the user asked about the *impossibility results* regarding base rates. That points to the Calibration vs. Error Rate trade-off.
      *   *Decision:* The "Calibration" requirement is the anchor. If scores mean probability of success, they *must* differ in distribution if base rates differ. If you force error rates to match, scores stop meaning probability.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. This is a governance document, not a math paper.
      *   **Section 1: The Desiderata (The Spec).** Group them by "Must Have" (Non-negotiable) and "Nice to Have" (Tradeable). Address the specific distinctions the user raised.
      *   **Section 2: The Impossibility (The Bad News).** Explicitly state which ones clash. (Calibration vs. Error Rate Parity given different base rates).
      *   **Section 3: The Selective Labels/Feedback Constraint.** Address the "checkable from data" constraint. This is crucial.
      *   **Section 4: The Recommendation (What to drop).** Advise on what to sacrifice and *how to say it* to a regulator.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user mentioned "Ranking". Calibration is critical for ranking. If I rank A above B, A should have higher expected yield.
      *   *Correction:* The user mentioned "Different Cut-offs". This makes Error Rate Parity *at the threshold* even harder. If cut-offs differ, FPR/FNR *should* differ mathematically if the score distributions differ. Demanding they match is mathematically incoherent with different cut-offs unless score distributions are identical (which implies no base rate diff).
      *   *Emphasis:* The "Selective Labels" constraint is the killer for FNR. You literally cannot calculate it. So FNR parity is not just incompatible, it's *unmeasurable*.
      *   *Emphasis:* The "Feedback Loop" means we need to ensure we don't stop hiring from one country entirely, or the model dies there. This suggests a constraint on *minimum selection rates* rather than error rates.

  9.  **Finalizing the "Pivot Point":**
      *   The requirement that does the most work is **Calibration (Score Meaning)**. If you enforce Calibration, you *must* abandon Error Rate Parity when base rates differ. If you enforce Error Rate Parity, you break Calibration.
      *   *Wait, actually:* For a ranking model used at *different* cut-offs, **Calibration** is the only thing that allows the business to move the cut-off without breaking fairness logic. So Calibration is the survivor. Error Rate Parity is the casualty.

  10. **Tone Check:**
      *   Practical, direct, no fluff.
      *   Acknowledge the political/legal risk.
      *   Clear distinction between "Math says no" and "Policy says no".

  11. **Drafting the Response (incorporating the above):**
      *   Start with the Desiderata list, categorized.
      *   Move to the Impossibility Theorem explanation.
      *   Address the Selective Labels/Feedback issue specifically.
      *   Conclude with the "What to say" script.

  *(Self-Correction on "Causal"):* The user asked about Statistical vs. Causal. Causal is usually unidentifiable without experiments. I should advise dropping Causal as a *verification* metric, keeping it as a *design* principle (e.g., removing protected attributes), but acknowledging it can't be proven post-hoc.

  *(Self-Correction on "Subgroups"):* Fairness for "every subgroup someone names next year" is impossible (intersectionality explosion). Advise limiting to pre-specified protected classes.

  *(Final Polish):* Ensure the distinction between "Fairness at threshold" vs "Fairness across thresholds" is clear. For ranking, across thresholds (Calibration) is better.

