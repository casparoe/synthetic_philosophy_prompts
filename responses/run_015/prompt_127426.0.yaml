answer: |-
  This is a governance document, not a math paper. Its job is to survive contact with a regulator, a rejected candidate's lawyer, and your own engineering team six months from now.

  Here are the desiderata for your fairness spec, categorized by what is mathematically/operationally sustainable (Non-Negotiable) and what is a policy preference you will likely have to trade away (Tradeable).

  ### Part 1: The Desiderata (The Spec)

  #### A. Non-Negotiables (The Floor)
  *These are the requirements you cannot drop without breaking the model's utility or violating the "checkable from data" constraint.*

  **1. Cross-Group Calibration (Score Meaning)**
  *   **The Requirement:** A score of $X$ must represent the same estimated probability of success in Country A as it does in Country B.
  *   **The Case:** You are shipping a *ranking* model with *different cut-offs*. If a score of 0.8 means "80% chance of success" in Country A but "60% chance" in Country B, you cannot rationally set different hiring thresholds. HR would be flying blind. Calibration is the only property that allows you to move the cut-off for headcount reasons without breaking the interpretation of the score.
  *   **Checkability:** High. You can verify this on hired candidates (observed outcomes) assuming the selection rate wasn't 100% or 0%.

  **2. Observability under Selective Labels**
  *   **The Requirement:** Any fairness metric we commit to must be calculable using *only* the data we observe (hired applicants).
  *   **The Case:** You stated the constraint: we only observe outcomes for those hired. You cannot measure False Negatives (rejected people who would have been good). Any metric requiring knowledge of the counterfactual (e.g., "Equal False Negative Rate") is unverifiable fiction.
  *   **Checkability:** Binary. If the formula requires $Y$ for rejected applicants, it is banned.

  **3. Minimum Selection Rate (Feedback Loop Protection)**
  *   **The Requirement:** The model must not reduce the selection rate for either country below a threshold required to generate sufficient outcome data for the next retraining cycle.
  *   **The Case:** You retrain every quarter. If the model decides Country A is "lower quality" and stops hiring them, you get zero labels for Country A next quarter. The model degrades for Country A, reinforcing the bias. You need a "data budget" to keep the model alive in both regions.
  *   **Checkability:** High. This is just a count of hires per country.

  #### B. Tradeables (The Ceiling)
  *These are the standard fairness definitions that you will likely have to explicitly reject or downgrade to "aspirational."*

  **4. Error Rate Parity at Threshold (FPR/FNR Matching)**
  *   **The Requirement:** False Positive and False Negative rates should match across countries *at the specific cut-offs used*.
  *   **The Case:** This is the standard "Equalized Odds" definition. It feels intuitive: "We should make mistakes at the same rate."
  *   **Why it's Tradeable:** It is mathematically incompatible with Calibration when base rates differ (see Part 2). It is also unverifiable for False Negatives due to Selective Labels.
  *   **Status:** **Drop this.** It is the source of your legal risk if you promise it.

  **5. Threshold Agnosticism (Ranking Fairness)**
  *   **The Requirement:** The ranking order itself should be "fair" regardless of where the cut-off is set (e.g., Equal Opportunity across all thresholds).
  *   **The Case:** This ensures that if headcount expands, the new hires are drawn fairly.
  *   **Why it's Tradeable:** This usually requires the ROC curves to overlap perfectly across groups. With different base rates and different feature distributions (local context), this is rarely achievable without breaking Calibration.
  *   **Status:** **Aspirational only.** Aim for it, but do not contractually bind to it.

  **6. Causal Fairness**
  *   **The Requirement:** The score should not differ *because* of country membership, holding qualifications constant.
  *   **The Case:** This addresses the "why." It prevents the model from penalizing someone simply for being in Country B.
  *   **Why it's Tradeable:** You cannot prove this statistically post-hoc. You can only design for it (e.g., by excluding country as a direct feature). However, proxies (e.g., university names) will remain.
  *   **Status:** **Design Principle, not a Metric.** You can state you *removed* country as a feature, but you cannot prove the *effect* is gone.

  **7. Subgroup Robustness**
  *   **The Requirement:** Fairness must hold for any subgroup named next year (e.g., "Women in Country A").
  *   **The Case:** Future-proofing against intersectional claims.
  *   **Why it's Tradeable:** Statistical power. You cannot guarantee calibration or error rates for subgroups you haven't defined and for which you may have $n=5$ in the hiring pool.
  *   **Status:** **Limit to Pre-Specified Classes.** Bind yourself only to the protected classes currently recognized by law in those two countries.

  ---

  ### Part 2: The Impossibility (The Bad News)

  You asked which subset is provably unsatisfiable. Here is the collision:

  **You cannot simultaneously satisfy:**
  1.  **Cross-Group Calibration** (A score of 0.8 means the same thing in both countries).
  2.  **Error Rate Parity at Threshold** (FPR and FNR match across countries).
  3.  **Different Base Rates** (The true rate of "good hires" differs between countries).

  **The Math:**
  If Country A has a 10% base rate of success and Country B has a 50% base rate, and your model is Calibrated:
  *   In Country A, most scores will be low.
  *   In Country B, most scores will be high.
  *   If you set different cut-offs (which you must, for headcount), your False Positive and False Negative rates *will* diverge.
  *   If you force the Error Rates to match, you *must* miscalibrate the scores (e.g., inflate scores in Country A so they look like Country B).

  **The Pivot Point:**
  **Calibration is the requirement that knocks out the candidates.**
  If you prioritize Calibration (which you must, for a ranking model with moving cut-offs), you **must** abandon Error Rate Parity.
  *   *Why?* Because if the underlying risk (base rate) is different, a "fair" model will naturally produce different error rates at different thresholds. Forcing error rates to match requires you to lie about the probability of success (breaking Calibration).

  **The Selective Labels Complication:**
  Even if you wanted to prioritize Error Rate Parity, **you cannot measure False Negative Rate.** You rejected those people. You don't know if they would have been good.
  *   *Result:* Any spec demanding FNR parity is legally vulnerable because it claims to measure something you literally do not know.

  ---

  ### Part 3: Recommendation & Script

  **What to Drop:**
  Drop **Error Rate Parity (Equalized Odds)**.
  It is the most common public definition of fairness, but in your specific setup (different base rates + selective labels + ranking), it is mathematically incompatible with a useful model and empirically unverifiable.

  **What to Keep:**
  Keep **Calibration** and **Minimum Selection Rate**.
  Calibration ensures the score is honest. Minimum Selection Rate ensures the model doesn't collapse in one country due to feedback loops.

  **How to State This (The Regulator/Candidate Script):**
  Do not say: *"We chose Calibration over Error Rates because of the Impossibility Theorem."*
  That sounds like an excuse.

  Say this:
  > "Our model is designed to provide an **honest estimate of job success probability** that remains consistent regardless of hiring volume.
  >
  > Because the labor markets in these two countries have different underlying characteristics (base rates), a model that accurately predicts success will naturally yield different selection rates and error profiles in each country.
  >
  > We prioritize **Calibration** because it ensures that a candidate with a specific qualification profile receives the same probability assessment in both countries. We do not enforce equal error rates because doing so would require us to artificially inflate or deflate scores to match statistics rather than merit, which would disadvantage candidates in the higher-performing group and misrepresent the actual likelihood of success for candidates in the lower-performing group.
  >
  > Furthermore, because we only observe performance for hired candidates, metrics relying on rejected candidate outcomes are statistically unverifiable. We instead monitor **Selection Rate Floors** to ensure we continue to gather data equitably across both regions."

  **Summary of the Trade:**
  *   **You gain:** A model that is interpretable, robust to headcount changes, and measurable.
  *   **You lose:** The ability to claim "we make mistakes at the same rate."
  *   **You risk:** A claim of "disparate impact" if the selection rates differ significantly.
  *   **Your Defense:** "Business Necessity" (different headcount/markets) + "Job Relatedness" (Calibration proves the score predicts success).

  **Final Warning:**
  The **Feedback Loop** is your silent killer. If Country A has a lower base rate, the model will learn to score them lower. If you don't enforce a **Minimum Selection Rate** (even for candidates slightly below the optimal cut-off), you will stop hiring from Country A. Next quarter, you have no data on Country A. The model becomes random noise for Country A. You must mandate "exploration" hires to keep the pipeline open, even if it costs short-term efficiency. That is a cost of fairness you must budget for.
