  I am trying to work through a dense passage from Charles Sanders Peirce's later writings on pragmatism, in which he maintains that reality is entirely independent of any particular person's opinion about it, and yet he also defines the true opinion as the one that an indefinite community of inquirers, proceeding by the method of science, would eventually converge upon if investigation continued without end. He insists that this convergence is not a matter of practical satisfaction or experiential verification for any individual mind, but is fixed by the real object itself.

