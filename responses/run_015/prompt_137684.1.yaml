answer: |-
  This is a sophisticated dissection of the operational logic underlying modern cause-prioritization (specifically the Effective Altruism framework). You have correctly identified that the standard "Importance $\times$ Tractability $\times$ Neglectedness" (ITN) formula is not a neutral calculator but a theory-laden instrument. Your friend's "Credit-Share" hypothesis is provocative, but I argue it misdiagnoses the engine while correctly identifying some of the exhaust fumes.

  Here is the reconstruction of the implicit theory, the commitments it smuggles, and the verdict on your argument.

  ### 1. The Theory of Practical Reasons: Marginalist Counterfactualism
  The practice strictly presupposes **Risk-Neutral Counterfactual Marginalism**.

  *   **Counterfactual:** The fundamental unit of value is the difference between the world where you fund and the world where you do not. This is why "Room for More Funding" is a hard stop. If the program continues without your dollar (because the room is full), your counterfactual impact is zero, even if the program is effective.
  *   **Marginalist:** The framework does not score the *average* value of a cause, but the value of the *next* dollar. This is why the score drops as others enter; you are moving down the curvature of the production function.
  *   **Risk-Neutral:** This is the critical, often hidden commitment. The advice to concentrate despite order-of-magnitude uncertainties presupposes that the utility function of "good done" is linear. If you were risk-averse regarding lives or welfare, you would diversify to reduce variance.

  **Does it merely sit well with Credit-Share?**
  Your friend claims the practice *runs* on Credit-Share (dividing the total value by the number of contributors). This is false regarding the "Room for Funding" habit.
  *   **In Credit-Share:** If a project needs \$10M and produces 1,000 lives saved, and you provide \$10k (1/1000th), you claim credit for 1 life. You should keep funding until the project is *done*, regardless of how many others join, provided your share remains positive.
  *   **In Practice:** Grantmakers stop funding when the "room" is filled, even if the project is still the cheapest way to save lives. This implies they believe their *marginal* contribution drops to zero, not that their *share* dilutes.
  *   **Verdict:** The practice is Counterfactual Marginalism in its allocation logic, but it borrows the **psychology** of Credit-Share to justify Concentration. It tells donors "You can own the solution" (Credit-Share rhetoric) to motivate them to accept "All eggs in one basket" (Marginalist strategy).

  ### 2. Non-Consequentialist Endorsement
  Could a non-consequentialist (e.g., a deontologist or virtue ethicist) endorse this scoring without inconsistency?

  *   **Consistency:** Yes, but only partially. A "Fair Play" theorist could use the ITN framework to determine where their contribution is most *needed* to complete a cooperative venture (high Neglectedness) and where the venture is *worthy* (high Importance).
  *   **The Break Point:** The **Maximization Directive**. The practice does not just say "Fund highly scored causes"; it says "Fund the *highest* scored cause to the exclusion of others." A non-consequentialist who believes in "doing one's part" or "satisficing" cannot endorse the concentration advice without abandoning their core ethics. They would diversify to ensure they are not complicit in a potential model failure, whereas the framework demands they risk total failure for maximum expected value.
  *   **Underdetermination:** The *scoring* is underdetermined (many ethics can agree on what is important/tractable), but the *decision rule* (maximize the product) is strictly consequentialist.

  ### 3. Commensurability and Aggregation
  The practice presupposes strong **Cardinal Commensurability** and **Total Impersonal Aggregation**.

  *   **Commensurability:** You cannot multiply "Lives Saved" by "Policy Influence" by "Dollar Cost" without reducing them to a common denominator (usually utils or welfare units). The refusal to score unmodelled effects (dignity, coercion) is not just an epistemic caution; it is an ontological claim that these values are either negligible or reducible to the quantified metrics.
  *   **Total vs. Average:** The framework is Total Utilitarian. It seeks to maximize the *sum* of value. If it were Average Utilitarian, it might prioritize smaller, higher-quality interventions over massive, scalable ones.
  *   **Person-Affecting:** It is predominantly **Impersonal**. The "Importance" axis often includes future generations (longtermism). A strict Person-Affecting View (only existing people matter) would collapse the scores of many top-ranked causes (e.g., existential risk reduction) to near zero.

  ### 4. Epistemology of Unmodelled Effects
  Is the refusal to score unmodelled effects a sensible response to cluelessness?

  *   **The Commitment:** It presupposes **Symmetric Ignorance**. It assumes that the unmodelled factors (dignity, institutional corrosion) are equally likely to be positive as negative, and thus cancel out in expectation.
  *   **The Bias:** This is rarely true. Systemic interventions often have asymmetric risks (e.g., coercive health mandates save lives but damage trust). By setting unmodelled terms to zero, the framework implicitly asserts that **Quantified Risk > Unquantified Risk**.
  *   **Condemnation:** The framework's own commitment to Expected Value reasoning condemns this. If you acknowledge an order of magnitude of uncertainty, you must assign a variance to the unmodelled factors. Setting them to zero is not EV reasoning; it is **Operationalism** (valuing only what can be measured).

  ### 5. Concentration and Risk Neutrality
  Is the advice to concentrate compatible with the acknowledged uncertainties?

  *   **Mathematical Incompatibility:** If estimates are uncertain by an order of magnitude, the probability that the #1 ranked cause is actually the #1 cause is low. Standard portfolio theory dictates diversification.
  *   **The Smuggled Commitment:** Concentration requires **Risk Neutrality regarding the Good**. It asserts that saving 1,000 lives with 10% probability is *better* than saving 100 lives with 100% probability.
  *   **Moral Status:** This is a substantive moral commitment, not an epistemic one. Most moral agents are risk-averse regarding human suffering. The practice forces donors to adopt the risk profile of a hedge fund regarding human lives. This is the strongest point of friction between the framework and common moral intuition.

  ### 6. The Swap: Counterfactual vs. Credit-Share
  If we swapped the underlying theory from Counterfactual Marginalism to your friend's Credit-Share Accounting, here is how the four habits would change:

  | Habit | Current Practice (Counterfactual Marginalism) | If Swapped to Credit-Share | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. Room for Funding** | **Hard Stop.** If the bucket is full, my marginal impact is zero. Leave. | **Soft Stop.** If the bucket is full, my share dilutes, but I still own a slice of the outcome. Stay if the slice is valuable. | **Collapses.** The "move on" habit makes no sense in Credit-Share. |
  | **2. Field-Building** | **Ambivalent.** Attracting others reduces my marginal impact (competitors). Justified only if it solves coordination failures. | **Positive.** Attracting others completes the team needed to unlock the prize. Partners, not competitors. | **Survives & Strengthens.** Field-building becomes core, not tension-filled. |
  | **3. Concentration** | **Required.** Maximize EV by betting on the highest peak. | **Required.** Maximize Share by betting on the biggest pie where you can secure a significant %. | **Survives.** Both theories demand concentration (assuming risk neutrality). |
  | **4. Quantification** | **Required.** Needed to calculate marginal utility. | **Required.** Needed to calculate total value of the "prize." | **Survives.** Both require commensurability. |

  **What is doing the real work?**
  The **Marginal Returns** logic (Habit 1) is the engine. The Credit-Share logic is merely the paint. If the practice truly ran on Credit-Share, grantmakers would not abandon cost-effective programs simply because they were "over-subscribed." They would fund them until the *total* goal was met, accepting a smaller share of a guaranteed win. The fact that they leave proves they are chasing *difference-making*, not *credit*.

  ### 7. The Double-Counting Charge & The Friend's Best Defense
  You charged that "Neglectedness" is used both as a **Multiplier** (less competition = more value) and as **Evidence** (less competition = maybe it's bad). You argue this is incoherent.

  **Your Friend's Sharpest Objection:**
  She should argue that this is not double-counting, but **Bayesian Updating on the Production Function.**

  *   **The Argument:** "Neglectedness" in the formula is not a raw count of people. It is a proxy for the **slope of the marginal returns curve**.
  *   **The Evidence Role:** The observation that "smart people aren't working on this" is a prior check on *Tractability* and *Importance*. It asks: "Is this neglected because it's impossible or worthless?"
  *   **The Multiplier Role:** Once you have established that the cause is *not* impossible or worthless (passing the evidence check), *then* the fact that it is neglected becomes a multiplier on your marginal impact.
  *   **The Synthesis:** The framework does not use the same input twice in the same equation. It uses market data (who is working on what) to update the priors on Importance/Tractability, and *then* uses the remaining gap (Neglectedness) to calculate Marginal Value.
  *   **The Efficient Market Hypothesis for Altruism:** Her strongest point is that the framework assumes the "market" of altruists is semi-efficient. If a cause is high-value and tractable, others *should* be there. If they aren't, there is a hidden cost (lowering Tractability) or a hidden flaw (lowering Importance). Therefore, Neglectedness *must* correlate with risk. The framework attempts to capture this by demanding a "Neglectedness Premium."

  ### Final Verdict
  Your suspicion is correct: the practice is theoretically unstable. It speaks Counterfactual Marginalism but acts like a Venture Capital fund (Credit-Share/Risk-Neutrality).

  *   **The Contradiction:** You cannot consistently hold that "my dollar makes no difference if others fund" (Marginalism) and "I should attract others to fund" (Field-Building) without a complex theory of coordination thresholds.
  *   **The Friend's Error:** She is right that the *concentration* and *field-building* habits look more like Credit-Share, but she is wrong that the *allocation* habits (Room for Funding) support her view. The practice is a hybrid that works operationally but fails philosophically.
  *   **The Double-Counting:** You are right that it risks double-counting, but the Friend's defense (Bayesian Updating) saves the framework *if* the evaluators are disciplined. In practice, they often are not, treating "Neglected" as an intrinsic good rather than a proxy for marginal returns.

  The framework presupposes a **Risk-Neutral, Total-Utilitarian, Operationalist Consequentialism**. It is not a neutral tool; it is a moral engine that demands donors abandon risk aversion and qualitative values in exchange for the promise of maximal marginal impact. Your friend's Credit-Share theory explains the *ambition* of the practice, but Counterfactual Marginalism explains its *limits*.
