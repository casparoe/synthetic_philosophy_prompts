answer: |-
  This is a remarkably sharp observation. You've put your finger on a central tension in the environmental humanities, science and technology studies (STS), and legal theory. The linguistic habit you're describing isn't just stylistic shorthand; it signals a specific ontological commitment that often goes unexamined in policy documents.

  Here is a breakdown of the theoretical presuppositions, the political implications, and the coherence of that "double standard" you identified.

  ### 1. The Theory of Agency: Distributed Action, Not Hard Determinism

  When an IPCC report says "warming disrupted agriculture," it is not necessarily positing a hard environmental determinism where humans are mere puppets. Instead, it aligns closely with **Actor-Network Theory (ANT)** and **New Materialism**.

  *   **Actants vs. Agents:** Bruno Latour and others distinguish between *moral agents* (who have intentionality and can be held responsible) and *actants* (anything that modifies a state of affairs). A microbe, a hurricane, or a frost has no intention, but it has *causal power*. It makes a difference. In this view, agency is not a property possessed only by humans; it is an effect generated by networks of humans and non-humans.
  *   **Relational Causation:** The statement "The Little Ice Age destabilized Ming grain reserves" is actually a compression of a complex network. The frost (non-human) interacted with monoculture farming (human), storage technology (human/non-human), and tax policy (human). The "destabilization" emerges from the collision.
  *   **Is Human Choice Epiphenomenal?** No, but it is *distributed*. In this framework, human will is never sovereign. We never act in a vacuum; we act through tools, environments, and biological constraints. To say "cholera reshaped sewage law" is to acknowledge that human legislators did not simply choose to change the law out of benevolence; they were *compelled* by the material resistance of the pathogen. Human agency is real, but it is reactive and co-constituted by non-human forces.

  So, the writing practice presupposes **distributed agency**. It rejects the idea that history is driven solely by "Great Men" or pure ideas, insisting instead that matter pushes back.

  ### 2. The Political Trap: Responsibility in a More-Than-Human World

  If we take this seriously—that microbes and climate zones are actants—how does responsibility shift? This is where it gets dangerous.

  *   **The Risk of Depoliticization:** If "Climate Change" is the actor, then "Exxon" or "The State" might fade into the background. This is the critique made by scholars like Timothy Mitchell. By framing climate change as a rogue actor (a "force of nature"), we risk obscuring the *political decisions* that allowed carbon extraction to scale. If the hurricane is the villain, the zoning board that allowed construction on the barrier island is absolved.
  *   **From Blame to Management:** If we accept non-human agency, public health policy shifts from "eradication" to "management of assemblages." You don't just blame the mosquito; you analyze the standing water, the urban drainage, the housing density, and the viral mutation rate as a single *socio-technical-natural system*. Responsibility becomes about **designing resilient networks** rather than punishing moral failings.
  *   **Moral Agency vs. Causal Agency:** The crucial distinction is between *causal power* (ability to break things) and *moral liability* (ability to be sued). A virus has the former, not the latter. If we conflate them, we enter a zone of political paralysis. We cannot negotiate with a virus, but we can negotiate with the pharmaceutical companies, the governments, and the logistics chains that respond to it.

  ### 3. The Double Standard: Attribution Science vs. Litigation

  You asked if the split between treating climate as an actor (in science) and humans as actors (in law) is coherent or ad hoc. It is **functionally necessary but ontologically inconsistent.**

  *   **Attribution Science (The System View):** In climate attribution, scientists ask: "Did climate change make this event more likely?" Here, climate is treated as a systemic force. They use probabilistic causation. They are describing a *mechanism*. In this context, treating climate as an actor is useful because it isolates the variable of greenhouse gas concentrations from natural variability.
  *   **Litigation (The Moral View):** In tort law, you need *specific causation* and *mens rea* (or at least negligence). The law is a technology for assigning blame to moral agents. You cannot sue the atmosphere. You must sue the emitter.
  *   **The Incoherence:** The incoherence arises when the scientific framing leaks into the political discourse in a way that undermines the legal framing.
      *   *Example:* If the IPCC says "Climate Change caused this loss," and the public hears "Nature did it," then the argument for suing fossil fuel companies weakens.
      *   *The "Ad Hoc" Charge:* It is ad hoc, but perhaps unavoidably so. We need the **ontological flattening** (humans and carbon are both actors) to understand the *physics* of the crisis. But we need **ontological hierarchy** (humans are responsible, carbon is not) to administer *justice*.

  ### 4. Synthesis: The "Hybrid" Accountability

  The writing practice you noticed is a heuristic device. It grants non-humans **narrative agency** to emphasize their power, but it often fails to clarify **moral agency**.

  To resolve the tension without giving up on human responsibility, we need a theory of **hybrid accountability**.
  1.  **Acknowledge Non-Human Power:** Admit that the virus or the flood has causal power. This prevents hubris (the idea that we can fully control nature).
  2.  **Trace the Network:** Ask *why* the human system was vulnerable to that specific non-human actant. Why did the grain reserves fail? Why was the sewage system open to cholera?
  3.  **Assign Liability to the Architects:** The responsibility lies with the humans who designed the network that allowed the non-human actant to cause harm.

  **Conclusion:**
  The institutional habit of making climate or germs the "subject" of sentences is a useful corrective to human exceptionalism. It reminds us that we live in a material world that resists us. However, it becomes ideologically dangerous when it slides from **causal explanation** (the frost broke the crop) to **moral exoneration** (the frost caused the famine, not the lack of welfare policy).

  The double standard in litigation vs. science isn't necessarily a failure of logic; it's a boundary maintenance between *description* (how the world works) and *prescription* (how we govern it). But we must be vigilant that the poetic agency granted to nature in our reports doesn't dissolve the political agency required to fix the mess. We need to write reports that say: "The Little Ice Age stressed the system, but the Ming Dynasty's policy choices turned that stress into a famine." That preserves the non-human actant without erasing the human culprit.
