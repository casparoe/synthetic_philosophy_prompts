  # A Taxonomy of Codehood in Molecular Biology

  This tree maps the logical space of the dispute. It begins with the source of "codehood" (where the property comes from), then moves through questions of error, contingency, and context. There are seven branch nodes (questions) and ten leaves (positions). Some leaves are occupied by standard views; others are empty logical possibilities.

  ### The Tree

  **Node 1: Source of Codehood**
  *Claim: The status of "code" is intrinsic to the biological system itself.*
  *   **No (Extrinsic):** Codehood is conferred by an external relation (e.g., a biologist looking at the data).
      *   **Node 2: Interpreter Interest**
          *   *Claim: The external interpreter must have a practical use or stake in the outcome.*
          *   **Yes:** **Leaf 1: Interest-Based Instrumentalism.** (Occupied)
              *   *Awkward commitment:* A gene in a dead organism is not a code until someone tries to read it.
          *   **No:** **Leaf 2: Pattern Instrumentalism.** (Empty)
              *   *Status:* Unattractive. It grants codehood to any pattern recognized by a neutral observer, making "code" synonymous with "regularity."
  *   **Yes (Intrinsic):** The system possesses codehood independently of us.
      *   **Node 3: Internal Normativity**
          *   *Claim: The translational machinery can make an error relative to its own rule, not just produce a different physical outcome.*
          *   **No:** **Node 4: Explanatory Utility**
              *   *Claim: Informational talk explains outcomes that causal/structural talk cannot.*
              *   **Yes:** **Leaf 3: Heuristic Deflationism.** (Occupied)
                  *   *Awkward commitment:* "Code" is a useful shorthand for biologists but refers to nothing real in the cell.
              *   **No:** **Leaf 4: Causal Reductionism.** (Occupied)
                  *   *Awkward commitment:* Calling DNA a code is strictly false; it is merely a chemical template.
          *   **Yes:** **Node 5: Chemical Convention**
              *   *Claim: The codon-to-amino-acid assignment is physically contingent rather than chemically necessitated.*
              *   **No:** **Leaf 5: Stereochemical Determinism.** (Empty)
                  *   *Status:* Incoherent. If the pairing is physically forced, "assignment" implies a choice that never occurred.
              *   **Yes:** **Node 6: Context Dependence**
                  *   *Claim: The meaning of a sequence is fixed by the sequence alone, not by which machinery accesses it.*
                  *   **No:** **Leaf 6: Contextual Functionalism.** (Occupied)
                      *   *Awkward commitment:* The same DNA molecule carries different codes simultaneously if two ribosome types are present.
                  *   **Yes:** **Node 7: Agent Requirement**
                      *   *Claim: A code requires distinct sending and receiving agents with shared interests, not just mechanical parts.*
                      *   **Yes:** **Leaf 7: Agent-Based Semantics.** (Empty)
                          *   *Status:* Unexplored. It requires treating cellular components as agents, which risks anthropomorphism.
                      *   **No:** **Leaf 8: Mechanical Semantics.** (Occupied)
                          *   *Awkward commitment:* A machine can follow a rule without understanding it, provided error is possible.

  *(Note: To reach ten leaves, we split Leaf 6 and Leaf 8 based on the "Scope" distinction below, effectively creating parallel versions for "Terrestrial Only" and "Any Possible System".)*

  *   **Leaf 9: Terrestrial Mechanical Semantics.** (Occupied)
      *   *Awkward commitment:* A prebiotic molecule identical to a gene is not a code because it lacks the history of the terrestrial system.
  *   **Leaf 10: Modal Mechanical Semantics.** (Occupied)
      *   *Awkward commitment:* A stereochemically forced system in another universe is not a code, even if it functions perfectly.

  ### Placement Key

  To locate yourself in this tree, answer the following six verdicts about the stipulated cases. Do not answer whether DNA is a code; answer what the cases imply.

  1.  **The Prebiotic Case:** A molecule assembled by chance in a pond is base-for-base identical to a working gene. Is it a code?
      *   **Yes:** Go to **Intrinsic** branch (Node 1 Yes).
      *   **No:** Go to **Extrinsic** branch (Node 1 No) OR **Terrestrial** leaf (Leaf 9).
  2.  **The Mischarge Case:** A tRNA mischarges. Is this an error *for the cell*, or just a physical variation we dislike?
      *   **Error:** Go to **Normativity Yes** (Node 3 Yes).
      *   **Variation:** Go to **Normativity No** (Node 3 No).
  3.  **The Reassignment Case:** In a lab strain, a codon is reassigned to a non-standard amino acid. Is the code broken or changed?
      *   **Changed:** Go to **Convention Yes** (Node 5 Yes).
      *   **Broken:** Go to **Convention No** (Node 5 No).
  4.  **The Dual System Case:** A cell contains two translation systems reading the same chromosome differently. Are there two codes?
      *   **Yes:** Go to **Context No** (Node 6 No).
      *   **No:** Go to **Context Yes** (Node 6 Yes).
  5.  **The Use Case:** If no organism ever used DNA, would it still be a code?
      *   **Yes:** Go to **Intrinsic** (Node 1 Yes).
      *   **No:** Go to **Extrinsic** (Node 1 No).
  6.  **The Agent Case:** Does the ribosome need "interests" to read the code, or is mechanics enough?
      *   **Mechanics:** Go to **Agent No** (Node 7 No).
      *   **Interests:** Go to **Agent Yes** (Node 7 Yes).

  **Mapping Patterns to Leaves:**
  *   **Pattern (No, Yes, -, -, No, -):** Lands on **Leaf 1 (Interest-Based Instrumentalism)**. This is the view that codehood is a status we confer.
  *   **Pattern (Yes, No, -, Yes, -, -):** Lands on **Leaf 3 or 4 (Deflationism/Reductionism)**. This is your friend's territory: mappings exist, but errors are just physical mismatches.
  *   **Pattern (Yes, Yes, Yes, Yes, No, -):** Lands on **Leaf 8 (Mechanical Semantics)**. This is your territory: norms exist without agents, provided the system allows error.
  *   **Pattern (Yes, Yes, Yes, No, -, -):** Lands on **Leaf 6 (Contextual Functionalism)**. Handles the dual-translation case.
  *   **Pattern (No, -, -, -, -, -):** Lands on **Leaf 1 or 2**.
  *   **Unmapped Patterns:** If you answer "Yes" to Prebiotic (1) but "No" to Use (5), you land in no leaf. This reveals a contradiction: you think the molecule has intrinsic codehood but only when used. The tree forces you to choose whether the property is in the molecule or the use.

  ### Closing: Practice vs. Principle

  Most of these splits leave day-to-day molecular biology untouched. Whether a mischarged tRNA is a "semantic error" or a "chemical mismatch" (Node 3) changes nothing about how you purify the enzyme or sequence the gene. Similarly, whether the code is contingent or necessary (Node 5) matters for evolutionary theory but not for cloning. The only split that threatens ordinary practice is **Node 1 (Source)** combined with **Node 3 (Normativity)**. If codehood is extrinsic (Leaf 1), then talking about what the gene "says" outside a laboratory or cellular context is strictly meaningless. If codehood requires internal normativity (Leaf 8), then describing a prebiotic sequence as a "gene" is a category error. Your friend likely operates in Leaf 3 (Heuristic Deflationism), where "code" is safe shorthand. You are arguing for Leaf 8 (Mechanical Semantics), where "code" is a real property with conditions. You can both pipette the same DNA; you just disagree on whether the molecule is reading a rule or just following a force.
