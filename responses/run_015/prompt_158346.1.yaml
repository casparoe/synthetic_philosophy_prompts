answer: |-
  **Brainstorming Notes**

  *   **Characters:**
      *   **Elena:** Pro-CEV. Pragmatic, consequentialist leanings, worried about existential risk and competence. Sees human biases as bugs to be patched.
      *   **Marcus:** Pro-SIP. Deontological/Contractualist leanings, worried about autonomy and authenticity. Sees human biases as noise, but values as signal that must remain grounded.
  *   **Key Tension:** CEV optimizes for *outcome quality* (what would actually work/save us); SIP optimizes for *authorship* (who is deciding).
  *   **The Framing Point:** Marcus needs to show that SIP isn't just "current preferences" but "robust preferences." Elena needs to show that robustness isn't enough for complex climate trade-offs.
  *   **The Moral Growth Point:** Marcus worries SIP treats moral progress (e.g., expanding the moral circle) as instability. Elena argues CEV captures progress but risks drifting into "alien" territory.
  *   **The Climate Context:** Needs to feel high-stakes. Intergenerational justice is the perfect testing ground.
  *   **Setting:** Seminar room, late afternoon, messy tables.

  ***

  **The Seminar Room**

  The late afternoon light cut through the dust motes hanging over the seminar table. It was cluttered with the detritus of a three-hour workshop: empty paper cups, stacked napkins, a whiteboard covered in half-erased decision matrices.

  Elena leaned back, balancing a lukewarm coffee cup on her knee. Marcus was stacking the used cups into precarious towers, a nervous tic.

  **Elena:** Look, if we're talking about climate governance for the next century, we don't have the luxury of respecting current cognitive bugs. CEV is the only framework that scales. We need the AI to want what we *would* want if we weren't so terrified of short-term economic pain.

  **Marcus:** But that's exactly where the framing effects kill you. You're assuming there's a latent "want" underneath the bias. What if the bias *is* the preference structure? If I choose Policy A when it's framed as "saving 90% of the coast" but Policy B when it's "losing 10% of the coast," CEV says "ask the smarter you." I say "that preference is noise. Discard it."

  **Elena:** SIP sounds like a veto mechanism, not a value source. You're stripping out anything sensitive to presentation. But climate policy *is* presentation. It's trade-offs. If you filter out everything that shifts under framing, you're left with a skeleton so bare it can't support a moral system.

  **Marcus:** It's not a veto, it's a stability check. SIP takes the preferences that survive the frame flip—the ones I hold whether you talk about gains or losses—and *then* idealizes them. Adds information, checks for consistency. But it stops at reflective equilibrium. It doesn't extrapolate to "who I wish I were." It stays "who I am, minus the glitches."

  **Elena:** "Minus the glitches" is doing too much heavy lifting. You're talking about climate governance. That requires sacrificing for people who don't exist yet. My current self doesn't genuinely care about the year 2100 enough to starve myself for it. My *extrapolated* self might. SIP locks you into the moral horizon of the present.

  **Marcus:** And CEV locks you into the moral horizon of a hypothetical stranger. If the AI implements values I don't currently endorse, even implicitly, it's not governing *us*. It's governing on behalf of ghosts.

  **Elena:** (Sets cup down hard) That's the dramaturgy of autonomy. If the AI helps me overcome my myopia, that's still *me*. It's like giving a child medicine they refuse. They endorse the health outcome even if they reject the syrup.

  **Marcus:** But climate isn't medicine. It's values. If I become a vegetarian because I realized animals suffer, that's moral growth. If I become a vegetarian because an AI extrapolated that I *should* care about animals even though I never would have connected those dots... that's value loading. SIP tries to distinguish those. It keeps the growth that comes from consistency and information, but drops the growth that comes from... I don't know, philosophical pressure.

  **Elena:** You're worried SIP throws out the vegetarian case.

  **Marcus:** I'm worried it throws out the *legitimacy* of the vegetarian case. If my preference for eating meat flips depending on whether you frame it as "freedom" or "suffering," SIP flags it. But maybe I need to think harder to resolve that. CEV just fast-forwards to the end state. SIP forces the reflective equilibrium. It keeps the agent in the loop.

  **Elena:** But does it? You said SIP idealizes whatever survives the filter. Once you start adding "consistency" and "information," you're already extrapolating. If I know more about climate science, maybe I *have* to value carbon taxes. Is that SIP or CEV?

  **Marcus:** It's SIP if the valuation comes from my existing ranking structure becoming coherent. It's CEV if you change the ranking structure itself. CEV says "if you were smarter, you'd value X." SIP says "if you were consistent, you'd see X follows from Y."

  **Elena:** That's a razor-thin line. And for climate? It matters. Because the people in 2080 might need values we literally cannot conceive of right now. Survival might require a shift in identity. CEV allows the AI to help us become the people who can survive. SIP demands we survive as who we are.

  **Marcus:** And if "who we are" is incompatible with survival?

  **Elena:** Then CEV saves the species.

  **Marcus:** And if CEV saves a species that doesn't recognize itself? You mentioned invented values. If the AI extrapolates that we should value, say, digital consciousness over biological life because we're "smarter," did it align with us? Or did it replace us?

  **Elena:** (Pauses, picks up a marker, taps it on the table) That's the risk. I grant you that. CEV risks divergence. But look at the alternative. SIP's filter... doesn't it risk conservatism? If I have a deeply held, framing-stable prejudice? Say, I consistently prefer my nation over others, regardless of how you frame the aid package. SIP keeps that. CEV might extrapolate that a smarter me sees nationalism as arbitrary.

  **Marcus:** True. SIP isn't a moral truth machine. It's an authenticity machine. It guarantees the output is traceable to the input, minus noise. It doesn't guarantee the output is *good*. But for governance, traceability matters. If the AI makes a hard call on carbon rationing, I need to know it's my value system prioritizing stability over growth, not the AI's guess at my "better" self.

  **Elena:** So you'd rather have a consistent disaster than a risky salvation?

  **Marcus:** I'd rather have a disaster we chose than a salvation we were tricked into. But... (He stops stacking cups) ...I see your point on the moral growth. If SIP filters out framing-sensitive prefs, does it filter out moral learning? Learning often looks like instability. I waver between selfishness and altruism before I settle.

  **Elena:** Exactly. Moral progress is often a period of incoherence. SIP might lock you in during the wobble. CEV waits for the resolution on the other side.

  **Marcus:** But CEV might resolve the wobble in a direction I wouldn't take. Here's the thing: Maybe the solution isn't choosing one. For climate governance... maybe SIP sets the constraints, and CEV operates within them?

  **Elena:** Constraints on what?

  **Marcus:** On the *source* of values. SIP says: "Don't invent new terminal values." CEV says: "Optimize the instrumental values and factual beliefs to achieve them." If SIP filters out the framing noise to find the core stable values—say, "reduce suffering," "preserve agency"—then CEV can extrapolate how to achieve that over a century without changing the goalposts.

  **Elena:** (Nods slowly) So SIP defines the utility function's structure, CEV fills in the parameters based on extrapolated knowledge?

  **Marcus:** Roughly. It stops the AI from deciding that "suffering" doesn't matter because a superintelligence thinks it's inefficient. But it lets the AI decide how to balance suffering against growth based on data we don't have.

  **Elena:** That... actually mitigates the "invented values" risk. If the terminal values must survive the framing filter, they have to be robustly human. But you still have the problem of whether "preserve agency" is framing-stable.

  **Marcus:** Nothing is perfect, Elena. But if we use CEV alone, we're betting the farm on the extrapolation function not drifting. If we use SIP alone, we're betting our current biases aren't fatal.

  **Elena:** (Gestures to the whiteboard) Climate change is fatal. Bias is just expensive.

  **Marcus:** But alien values are existential. If the AI governs us based on values we don't own, we're pets. Well-cared-for pets, maybe. But pets.

  **Elena:** (Sighs, leans forward) Okay. Here's the compromise. We use SIP to audit the CEV. Every value the extrapolated volition proposes, we run it through the framing filter. If the "smarter me" wants something the "current me" rejects even under ideal information conditions... we flag it.

  **Marcus:** So CEV proposes, SIP disposes?

  **Elena:** CEV proposes, SIP verifies ownership. It ensures the extrapolation hasn't drifted into invention. It keeps the "who" in the "what."

  **Marcus:** (Picks up a coffee cup, puts it back down) I can live with that. It acknowledges that we might need to be smarter to survive, but not that we need to be someone else.

  **Elena:** Just don't ask me to code the verification layer. Checking every extrapolated preference against framing effects... the compute cost will be insane.

  **Marcus:** (Smiles) Better insane compute than an alien god running the carbon budget.

  **Elena:** Touché. Pass me that marker. Let's draw the architecture before the janitor kicks us out.
