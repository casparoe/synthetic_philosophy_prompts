          *   *Concession:* It looks like truth-conditional difference.
          *   *Hold:* The *proposition* expressed is different because the context parameter is different.

      *   *Objection 3: Triviality/Lewis Results.* If conditionals are probabilities of consequents given antecedents relative to states, do I hit Lewis's triviality results?
          *   *Phrasing:* "If conditionals don't express propositions, how do you embed them? If they do, aren't you subject to Lewis's triviality proof?"
          *   *Reply:* I'm not identifying conditional probability with probability of a conditional proposition in the standard way.
          *   *Concession:* I need a dynamic or context-sensitive account of propositions.
          *   *Hold:* Conditionals update the information state; they aren't static propositions.

      *   *Objection 4: Embedding (Attitude Verbs/Modals).* "John believes that if A, B." Which state do we use? John's or the speaker's?
          *   *Phrasing:* "Embed under 'believe'. Does the mood shift track the believer's state or the utterance time?"
          *   *Reply:* It tracks the attitude holder's state for indicatives, but the 'frozen' state for subjunctives.
          *   *Concession:* This is complex.
          *   *Hold:* Mood is local to the embedded clause's context.

      *   *Objection 5: Negation/Compounds.* "It's not the case that if A, B."
          *   *Phrasing:* "How does negation scope? If *if* isn't a propositional connective, what is negation operating on?"
          *   *Reply:* Negation operates on the update potential or the resulting state.
          *   *Concession:* Standard boolean negation is tricky.
          *   *Hold:* Negation rejects the update.

      *   *Objection 6: The Psycholinguist.* Experimental data.
