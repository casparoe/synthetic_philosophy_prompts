  2.  **Deconstruct the Thesis (Mental Model):**
      *   *Core Claim:* $[\![\text{if } A, B]\!]^{c, s} = \text{Op}(A, B)$ relative to information state $s$.
      *   *Mood's Role:* Mood selects $s$. Indicative $\to$ $s_{now}$ (current evidence). Subjunctive $\to$ $s_{past}$ (evidence prior to learning $\neg A$ or some salient past time).
      *   *Motivation:* Explains Adams pairs (Oswald) without lexical ambiguity. Explains infelicity of asserting both (conflict in evidence states).
      *   *Vulnerability:* Compositionality (where is $s$ in the LF?), Truth Conditions (do they really differ?), Triviality (Lewis-style results), Embedding (under *believe*, *might*), Psych data (do people actually switch states?), Falsifiability (is $s_{past}$ too flexible?).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: Compositionality/LF.* This is the biggest technical hurdle for Kratzerians. Where does the "switch" happen? Is it a covert operator?
          *   *Phrasing:* "Where is this in the LF? Is Mood a sentential operator? How does it compose with Tense?"
          *   *Reply:* Mood is a feature on C or T that constrains the context parameter.
          *   *Concession:* It's not a standard quantifier over worlds.
          *   *Hold:* Mood restricts the context, not the modal base directly.

      *   *Objection 2: Truth Conditions vs. Assertibility.* Epistemologists and semanticists will press this. If the world is the same, isn't the truth condition the same?
