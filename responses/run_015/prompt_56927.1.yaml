      *   **Thesis:** Monism about *if* (one lexical entry). The difference lies in the *information state* used for evaluation (current vs. frozen past), triggered by grammatical mood, not in the conditional operator itself or world-ordering sources.
      *   **Audience:** Formal semanticists (Kratzerian modal/conditional folks), a couple of epistemologists, one psycholinguist. *No* decision theorists, *no* sympathy for purely philosophical hand-waving.
      *   **Tone:** Professional, high-stakes, technical, pragmatic. Needs to be a "prep sheet" for survival, not a philosophical endorsement.
