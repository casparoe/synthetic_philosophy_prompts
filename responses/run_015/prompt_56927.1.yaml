answer: |-
  Here is your prep sheet. It is designed for a room of formal semanticists who will smell blood if you drift into metaphysics. They care about LF, compositionality, and empirical coverage.

  ### **The Hit List: 8 Objections**

  **1. The Compositionality Complaint (LF & Types)**
  *   **Likelihood:** High. **Timing:** Opening questions (first 5 mins). **Damage:** High.
  *   **The Question:** "You say mood selects the information state. Where is this in the Logical Form? Is Mood a sentential operator? If so, what is its type? If it's just a feature on C or T, how does it compositionally feed the conditional operator without violating standard type-driven interpretation? You're effectively making *if* context-sensitive in a way that breaks standard intensionalization."
  *   **The Reply:** "Mood is a feature on the Complementizer that constrains the context parameter $c$ passed to the conditional operator. It doesn't change the type of *if*; *if* always takes a proposition and returns a context-change potential (or a proposition relative to a state). Mood restricts *which* $c$ is available. It's analogous to how tense restricts the time parameter, not the event predicate itself."
  *   **Soft Spot:** You haven't written out the LF tree. They will press on how the feature percolates.
  *   **Concede:** "I'm working out the precise feature-checking mechanics in the dissertation; the semantic core is the state-shift."
  *   **Hold:** Do not concede that *if* changes type. Hold that *if* is invariant; only the context parameter varies.

  **2. Truth Conditions vs. Assertibility**
  *   **Likelihood:** High. **Timing:** Mid-talk (during the Oswald example). **Damage:** Medium.
  *   **The Question:** "You claim the difference is evidential, not truth-conditional. But if we learn Oswald *didn't* shoot, the indicative becomes false/unassertable, but the subjunctive remains true. That looks like a difference in truth conditions, not just what you're allowed to say. Are you really denying they express different propositions?"
  *   **The Reply:** "They express different propositions because they are evaluated relative to different parameters. It's like 'here' and 'there'. The content differs because the context differs, not because the lexical item 'location' changes meaning. The truth *value* differs because the *state* differs, not the operator."
  *   **Soft Spot:** Epistemologists will hate this. They want stable truth conditions across contexts.
  *   **Concede:** "The truth *value* varies across the pair."
  *   **Hold:** "The *semantic value* of the connective *if* is constant. The variation is in the context parameter, which is standard for indexicals."

  **3. The Triviality Result (Lewis/Hájek)**
  *   **Likelihood:** Medium. **Timing:** Mid-talk (if you mention probabilities). **Damage:** High.
  *   **The Question:** "If you relativize conditionals to information states to match Adams' thesis, aren't you walking straight into Lewis's triviality results? If conditionals express propositions relative to states, you can't maintain the probability equation without trivializing the algebra."
  *   **The Reply:** "I am not identifying the probability of the conditional with the conditional probability of a static proposition. I'm treating the conditional as an update on the information state. Triviality results assume conditionals express standard Boolean propositions; I deny that. They express constraints on state transitions."
  *   **Soft Spot:** If you haven't read the dynamic semantics literature deeply, they will catch you on the algebra.
  *   **Concede:** "Standard propositional accounts face triviality."
  *   **Hold:** "My account is dynamic/context-sensitive, which blocks the triviality proof premises."

  **4. Embedding under Attitude Verbs**
  *   **Likelihood:** High. **Timing:** Q&A pile-up. **Damage:** Medium.
  *   **The Question:** "Consider 'John believed that if Oswald hadn't shot, someone else would have.' Whose information state is frozen? John's at the time of belief, or the speaker's now? If it's John's, how does the mood morphology track that distant state without explicit temporal anchoring?"
  *   **The Reply:** "In embedded contexts, the information state is typically the attitude holder's at the time of the attitude. The subjunctive morphology signals a shift away from the *current* utterance state to the *local* evaluation state. It's anaphoric to the local context."
  *   **Soft Spot:** This gets messy with sequence of tense and back-shifting.
  *   **Concede:** "The anchoring mechanics in embedded environments are complex and context-dependent."
  *   **Hold:** "The core mechanism remains: subjunctive shifts the state away from the default evaluation point."

  **5. Negation and Boolean Compounds**
  *   **Likelihood:** Medium. **Timing:** Q&A pile-up. **Damage:** Low.
  *   **The Question:** "What is the semantics of 'It is not the case that if A, B'? If *if* isn't a truth-functional connective, what is negation operating on? Are you denying bivalence?"
  *   **The Reply:** "Negation operates on the update potential. To deny a conditional is to refuse the update it proposes to the information state. It's not boolean negation of a truth value; it's rejection of an inference rule."
  *   **Soft Spot:** Formal semanticists love boolean negation.
  *   **Concede:** "It requires a non-classical treatment of negation."
  *   **Hold:** "This is a feature, not a bug. It explains why conditional negation feels different from propositional negation."

  **6. The Psycholinguist's Data**
  *   **Likelihood:** Guaranteed. **Timing:** Q&A (from the specific colleague). **Damage:** Medium.
  *   **The Question:** "My selection task data shows subjects process subjunctives slower and activate different neural pathways than indicatives. If it's just one lexical entry with a parameter switch, why the heavy processing cost? That suggests distinct cognitive machinery."
  *   **The Reply:** "Switching information states is cognitively expensive. You have to inhibit current evidence and retrieve a archived state. That retrieval cost explains the latency without requiring two lexical entries. Distinct processing doesn't entail distinct semantics."
  *   **Soft Spot:** If the neural pathways are *structurally* distinct (e.g., language vs. reasoning areas), your semantic unity might not map to cognitive unity.
  *   **Concede:** "Processing architectures are certainly distinct."
  *   **Hold:** "Semantic unity is compatible with processing complexity. Accessing memory is harder than accessing working memory."

  **7. The "Repackaging" Charge**
  *   **Likelihood:** Medium. **Timing:** End of Q&A. **Damage:** Low (Survivable).
  *   **The Question:** "How is this distinct from Kaufmann's or Isaacs's contextualist accounts, or even Kratzer's varying ordering sources? You seem to be renaming 'ordering source' as 'frozen information state'."
  *   **The Reply:** "Kratzerian ordering sources rank worlds within a modal base. I'm arguing the *domain* of the modal base itself shifts. Ordering sources explain preference; I'm explaining availability. You can't order worlds into your evidence base if the evidence isn't there. Mood gates the evidence, it doesn't just rank it."
  *   **Soft Spot:** The mathematical output might look similar.
  *   **Concede:** "The empirical predictions overlap in many cases."
  *   **Hold:** "The mechanism is fundamentally different: domain restriction vs. world ranking."

  **8. The Landmine: Unfalsifiability of the 'Frozen State'**
  *   **Likelihood:** High (if they smell blood). **Timing:** The Kill Shot (End of Q&A). **Damage:** Critical.
  *   **The Question:** "Your 'frozen information state' is a free parameter. If a counterexample arises, you can just say 'the relevant frozen state was different.' What independently constrains which state is frozen? Without constraints, this is just the free-choice ordering story you're attacking, but with less formalism."
  *   **The Reply:** "It is constrained by temporal anaphora and common ground. The 'frozen' state must be a time prior to the acquisition of the negating evidence. It's not free; it's anchored to the timeline of knowledge acquisition."
  *   **Soft Spot:** This is your weakest point. It *is* flexible.
  *   **Concede:** "Identifying the exact anchor is context-sensitive."
  *   **Hold:** "It is not free; it is bound by the temporal structure of evidence acquisition."

  ---

  ### **The Landmine Analysis**

  Your suspicion is correct. The "frozen information state" is the most dangerous part of your view because it risks being a "just-so story." If every counterexample can be solved by positing a *different* past moment where the evidence was different, your theory explains everything and predicts nothing.

  **The Checkable Prediction:**
  To distinguish your view from the Two-Lexical-Entries view (or free-choice ordering), you need a prediction about **temporal anchoring of evidence**.

  *   **Prediction:** If a speaker learns $\neg A$ *before* the contextually salient past time $t$, the subjunctive "If A had..." should be infelicitous or force a search for an *earlier* time $t'$.
  *   **The Test Case:** Suppose everyone knew at 9:00 AM that Oswald didn't shoot. At 10:00 AM, we discuss the conspiracy.
      *   *Two-Entries View:* The subjunctive is fine (it's just a different connective).
      *   *Your View:* The subjunctive should be degraded or require shifting the freeze point to before 9:00 AM. If the "common ground" froze *after* the evidence was known, the subjunctive has no work to do.
  *   **Under Pressure:** "My view predicts that subjunctives become infelicitous if the antecedent's falsity is common ground *prior* to the salient past time being evaluated. The lexical ambiguity view predicts no such interaction between evidence timing and mood."

  ---

  ### **Phrases to Absolutely Avoid**

  1.  **"It's just an intuition."**
      *   *Why:* In a formal semantics room, "intuition" sounds like "I have no data." Say "judgment" or "acceptability pattern."
  2.  **"The meaning of *if*."**
      *   *Why:* Too vague. Say "the semantic value of the conditional operator" or "the lexical entry."
  3.  **"Philosophically speaking..."**
      *   *Why:* This signals you are about to ignore their formal constraints. Say "Semantically..." or "In terms of the model..."
  4.  **"Truth is relative."**
      *   *Why:* Triggers the relativism debate (MacFarlane, etc.) which will eat your talk time. Say "Truth is evaluated relative to the information state parameter."

  **Final Advice:** When the semanticists attack the LF, don't try to out-formalize them if your math isn't ready. Pivot to the *explanatory gain*: "The LF details are implementable in standard frameworks, but the payoff is explaining the Adams pair without lexical ambiguity. Let's solve the architecture first, then fine-tune the features." Good luck.
