  7.  **Final Polish:** Ensure the distinction between "modal base" (Kratzer) and "information state" (User's view) is clear. The user is essentially proposing a *context-shifting* semantics rather than a *modal-base-shifting* semantics. This is a crucial technical distinction for the audience.

      *(Self-Correction during drafting)*: Make sure I don't give away too much in the "Hold" sections. The user needs to know what battle to fight. For the triviality result, the safest bet is to lean into dynamic semantics or deny that conditionals express standard propositions. I'll advise the latter as it's more defensible in a short talk.

      *(Refining the Landmine)*: The user's suspicion is right. The "frozen state" is a free parameter unless constrained. The prediction needs to be about *independent* evidence for that state. I'll suggest looking at temporal adverbials.

