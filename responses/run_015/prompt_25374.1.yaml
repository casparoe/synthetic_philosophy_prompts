answer: |-
  # Decision Tree: The Problem of Dirty Hands

  **Instructions:** Follow the path that best matches your intuitions about a paradigmatic "dirty hands" case (e.g., a leader authorizing torture to prevent a terrorist bombing). Answer based on what you think is *true*, not what label you prefer.

  ---

  ### **START: The Threshold Question**
  **Q1. Can a political leader ever be *morally justified* (all-things-considered) in performing an act that would be strictly forbidden for a private citizen?**
  *(Note: "Justified" means it was the right thing to do, overall, not just that it was necessary.)*

  *   **NO.** (Some acts are so evil they can never be morally justified, regardless of the consequences.)
      *   ➔ **GO TO LEAF A**
  *   **YES.** (There are extreme circumstances where the moral prohibition is overridden by political necessity.)
      *   ➔ **GO TO Q2**

  ---

  ### **NODE 2: The Agent's Conscience**
  **Q2. If the act was the right call all-things-considered, does the leader emerge from the act with *clean* moral hands?**
  *(i.e., Does the justification wipe away all moral guilt, regret, or stain on their character?)*

  *   **YES.** (If it was the right thing to do, there is nothing to feel guilty about. The math balances out.)
      *   ➔ **GO TO Q3**
  *   **NO.** (Even though it was necessary, the act violates a deep moral norm. The leader is morally stained or guilty.)
      *   ➔ **GO TO Q4**

  ---

  ### **NODE 3: The Legalist Loophole (Potential Empty Branch)**
  **Q3. Since the hands are clean and the act justified, should the leader still face public blame or punishment?**

  *   **NO.**
      *   ➔ **GO TO LEAF B**
  *   **YES.**
      *   ➔ **⚠️ EMPTY BRANCH (Theoretically Unstable)**
      *   *Why is this empty?* It is logically possible to say "Morally innocent but legally guilty," but few political philosophers defend punishing a leader for an act that was *fully morally justified* with *no moral residue*. Usually, if you argue for punishment here, you implicitly admit there is some moral stain (which pushes you back to Q4).

  ---

  ### **NODE 4: The Political Response**
  **Q4. Given that the leader did the right thing but bears a moral stain, should the political community *punish* or formally *blame* them?**

  *   **NO.** (We recognize the burden they took on. To punish them would be hypocritical or ungrateful. We share the guilt.)
      *   ➔ **GO TO LEAF C**
  *   **YES.** (We must punish or blame them to affirm the moral norm they violated, even if we acknowledge they had to do it.)
      *   ➔ **GO TO LEAF D**

  ---

  ### **THE LEAVES (Your Position)**

  #### **LEAF A: The Moral Absolutist**
  *   **Core View:** Certain actions (torture, killing innocents) are intrinsically wrong. Political office does not grant a dispensation to violate fundamental moral laws.
  *   **Implication:** If a leader performs such an act, they are a criminal. They should not do it, even if disaster follows.
  *   **Key Thinkers:** Kantian Deontologists, some Religious Ethics.

  #### **LEAF B: The Act Consequentialist (Clean Hands)**
  *   **Core View:** Morality is determined solely by outcomes. If the act saved more lives than it cost, it was the *moral* thing to do. There is no "remainder."
  *   **Implication:** The leader should be praised, not blamed. Guilt is irrational if the calculation was correct.
  *   **Key Thinkers:** Utilitarians, some Machiavellians.

  #### **LEAF C: The Political Realist / "Thankless Hero"**
  *   **Core View:** Politics operates by a different ethic than private morality. The leader must do the dirty work so the citizens don't have to. We should not punish them because we are complicit in the necessity.
  *   **Implication:** The leader may feel personal regret, but public punishment is inappropriate. The "dirt" is acknowledged but forgiven.
  *   **Key Thinkers:** Some Realists, Weber (Ethic of Responsibility).

  #### **LEAF D: The Walzerian Tragic View**
  *   **Core View:** The leader *must* violate the moral norm to serve the people, but that norm remains binding. They are both justified and guilty.
  *   **Implication:** The leader must bear the burden of guilt. Public punishment or blame is necessary to validate the moral rule that was broken, even if the leader is re-elected or honored.
  *   **Key Thinkers:** Michael Walzer, Avishai Margalit.

  ---

  ### **⚠️ LIMITATIONS OF THIS TREE**

  **1. The "Justified vs. Excused" Ambiguity (Leaf A vs. Leaf D)**
  This tree cannot cleanly separate the **Walzerian (Leaf D)** from a nuanced **Absolutist (Leaf A)** who believes in *excusable violations*.
  *   *The Problem:* An Absolutist might say, "The act was *wrong* (Not Justified), but we excuse the leader because they were under duress." A Walzerian says, "The act was *right* (Justified), but the leader is still guilty."
  *   *Result:* In practice, both positions look identical: The leader acts, feels bad, and faces some blame. If you answered "NO" to Q1 because you think the act remains a "violation" even if necessary, you might end up at Leaf A, even if your intuitions about punishment match Leaf D.

  **2. The "Empty Branch" Instability (Node 3)**
  As noted in the tree, the branch where **Hands are Clean + Leader is Punished** is marked empty. However, some **Legalists** might land here. They may argue that moral justification does not grant legal immunity. If you landed here, you likely believe the Rule of Law is more important than individual moral justification. You are a rare breed in this specific debate!
