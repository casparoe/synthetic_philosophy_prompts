  **Bereitschaftsband™ | Support & FAQs**

  **Welcome to the future of volition.**
  Congratulations on pre-ordering your Bereitschaftsband. You've made a choice to transcend choice. Below are answers to common queries regarding your device, your brain, and the ontological status of both.

  **Q: How exactly does the Band improve my mindfulness?**
  A: Traditional mindfulness asks you to observe the present moment. The problem is, by the time you're consciously aware of the moment, it's already old news. Your conscious awareness lags behind your neural activity by roughly 350ms. The Bereitschaftsband monitors the readiness potential (RP) in your supplementary motor area (SMA). When we detect the ramp-up of neural noise indicating an impending action, we send a haptic nudge *before* you feel the urge to move. It's like having a mindfulness coach who lives in your motor cortex. You don't just observe the present; you observe the immediate future of your own determinism.

  **Q: So… does this prove free will is dead?**
  A: Look, the popular science blogs love to say "Libet proved you're a meat puppet." It's a bit reductive. We prefer to say your conscious mind is less of a CEO and more of a press secretary. The Band helps you edit the press release before it goes out. Whether the CEO actually signed the order is beside the point. The outcome is optimised.

  **Q: Can I ignore the nudge? What if I don't want to move?**
  A: Ah, you're asking about the veto power. Libet called this "Free Won't". It's a standard feature on the Basic plan, but high-latency vetoing requires the Premium subscription. Technically, your brain has already initiated the action cascade. But if you stop yourself after our buzz, you get a nice dopamine hit knowing you overrode your own biology. It's compatibilism as a service. You're determined, but you can pay to feel like you aren't.

  **Q: Is the timing accurate? My urge feels earlier than the buzz.**
  A: That's the W-judgement issue. Subjective time is notoriously rubbish. You're trying to clock a mental event using a clock that's part of the event. It's like trying to see your own eyes without a mirror. The Band uses objective EEG timestamps. If you *feel* like you decided before the buzz, that's just post-hoc confabulation. Your brain is backdating the decision to make you feel in charge. We're just here to correct the record. Don't trust your feelings; trust the waveform.

  **Q: Does this rely on the Cartesian Theatre model?**
  A: Definitely not. We don't believe there's a little man watching the screen in your head. That would be homunculus fallacy nonsense. There's just processing streams. The Band just interrupts the stream. If you feel like there's a "you" experiencing the interruption, that's just another computational output. Dennett would approve. Probably. He hasn't returned our emails.

  **Q: What if the Band nudges me to do something illegal?**
  A: The Bereitschaftsband monitors motor preparation, not moral content. It knows you're about to lift a finger, not whether you're about to lift a biscuit or steal a wallet. That's still on you. Or, technically, on your SMA. Either way, we're not liable. You agreed to the Terms of Service which state that agency is an illusion created for legal convenience.

  **Q: My friend says the Readiness Potential is just noise, not a decision.**
  A: Your friend sounds stressful. Even if the RP is just random neural fluctuation, our algorithm treats it as intent. If the machine says you're about to act, you're about to act. If you don't, the algorithm learns. Eventually, the Band will know you better than you know yourself. Which, statistically, isn't hard.

  **Still have questions?**
  Contact support. But remember, by the time you read this, you've already decided to.

