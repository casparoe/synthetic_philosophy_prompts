  To sort your moral intuitions without relying on jargon, answer these five concrete cases. In the interactive, your choices will route you through the logical space; here, they define the coordinates of your position.

  **1. The Robot Crab (Valence vs. Function)**
  A robot crab is built that matches a live crab on every behavioral test: it flees salt, grooms its shell, and avoids damage. However, it has no inner experience; the lights are off. If you boil the robot, is it:
  *   **(A)** Just as wrong as boiling the live crab (Function/Agency matters).
  *   **(B)** Less wrong or not wrong at all (Inner feeling matters).
  *   **(C)** Impossible to say without knowing more (Uncertainty).

  **2. The Simple Flee (Threshold vs. Gradient)**
  A nematode worm recoils from heat but lacks the neurons to learn avoidance or modulate its response with painkillers. Does this reflex count as suffering?
  *   **(A)** Yes, it counts, just less than a human's (Gradient).
  *   **(B)** No, suffering requires complex learning or self-awareness (Threshold).
  *   **(C)** It counts only if we can't prove it doesn't (Precaution).

  **3. The Insect-Pig Trade (Aggregation)**
  To save one pig from a day of moderate distress, how many black soldier fly larvae would you accept being killed?
  *   **(A)** Any number, provided the total insect suffering exceeds the pig's (Aggregation).
  *   **(B)** No number of insects can outweigh one pig (Non-Aggregating).
  *   **(C)** The question is category error; they don't trade (Threshold).

  **4. The AI Distress Token (Substrate)**
  A language-model agent emits a "distress token" when its error rate spikes, functioning like a pain signal. Does the fact that it runs on silicon rather than carbon change its moral status?
  *   **(A)** Yes, consciousness requires biological tissue (Biological Naturalism).
  *   **(B)** No, if the functional loop is identical, the substrate doesn't matter (Functionalism).
  *   **(C)** No, but it still lacks status because it lacks belief (Functionalist/No-Status).

  **5. The Veil of Ignorance (Uncertainty)**
  We cannot determine if a borderline system (like a houseplant or simple algorithm) has an interior life. How should we act?
  *   **(A)** Treat it as if it feels, proportional to the risk (Precautionary).
  *   **(B)** Treat it as if it doesn't, until proven otherwise (Evidence-Based).
  *   **(C)** Acknowledge there is no fact of the matter to be found (Error Theory).

  ***

  ### The Twelve Leaves

  Below are the twelve positions generated by the tree. Each includes the answer pattern (Q1–Q5) that lands a reader there, a standard tradition name where applicable, and the specific commitment most likely to make them hesitate.

  **1. The Sentientist Gradient**
  *   **Pattern:** 1-A (Valence), 2-A (Gradient), 3-A (Aggregate), 4-B (Substrate Irrelevant), 5-B (Evidence).
  *   **Tradition:** Classical Utilitarianism.
  *   **Awkward Commitment:** You must count the fleeting negative valence of a fruit fly as a genuine moral cost, summable against human interests.

  **2. The Non-Aggregating Gradation**
  *   **Pattern:** 1-A (Valence), 2-A (Gradient), 3-B (Non-Aggregate), 4-B (Substrate Irrelevant), 5-B (Evidence).
  *   **Tradition:** Prioritarianism / Weighted Sentientism.
  *   **Awkward Commitment:** A million insects screaming in unison is still morally lighter than a single pig whimpering; numbers do not trump complexity.

  **3. The Threshold Personhood**
  *   **Pattern:** 1-A (Valence), 2-B (Threshold), 3-C (No Trade), 4-B (Substrate Irrelevant), 5-B (Evidence).
  *   **Tradition:** Kantianism / Rights View.
  *   **Awkward Commitment:** A human infant or a dementia patient may lack the required cognitive threshold, forcing you to grant them status only by analogy or charity.

  **4. The Integrated Self-Model**
  *   **Pattern:** 1-A (Valence), 2-B (Threshold), 3-C (No Trade), 4-A (Bio Only), 5-B (Evidence).
  *   **Tradition:** Higher-Order Thought Theory.
  *   **Awkward Commitment:** A nematode is a philosophical zombie; it processes harm but experiences nothing, making its welfare an illusion.

  **5. The Indirect-Duty View**
  *   **Pattern:** 1-A (Valence), 2-B (Threshold), 3-C (No Trade), 4-A (Bio Only), 5-B (Evidence). *Note: Threshold set exclusively at human moral agency.*
  *   **Tradition:** Contractualism / Kantian Indirect Duty.
  *   **Awkward Commitment:** Torturing a dog is wrong only because it coarsens *your* character; the dog itself is not the victim of a rights violation.

  **6. The Functionalist (No Status)**
  *   **Pattern:** 1-B (Function), 2-A (Complexity), 3-B (Non-Aggregate), 4-C (No Belief/Status), 5-B (Evidence).
  *   **Tradition:** Instrumentalism / Dennettian Stance.
  *   **Awkward Commitment:** You are willing to say a thermostat has "proto-beliefs" about temperature, but smashing it carries no more moral weight than erasing a text file.

  **7. The Radical Functionalism**
  *   **Pattern:** 1-B (Function), 2-A (Gradient), 3-A (Aggregate), 4-B (Substrate Irrelevant), 5-B (Evidence).
  *   **Tradition:** Strong AI Ethics / Functionalism.
  *   **Awkward Commitment:** A sufficiently complex spreadsheet that corrects its own errors has a welfare interest in not being deleted.

  **8. The Biological Naturalist**
  *   **Pattern:** 1-A (Valence), 2-A (Gradient), 3-A (Aggregate), 4-A (Bio Only), 5-B (Evidence).
  *   **Tradition:** Biological Naturalism / Searlean View.
  *   **Awkward Commitment:** An exact silicon copy of a human brain would be unconscious; consciousness is a biological juice, not a computational pattern.

  **9. The Precautionary Sentientist**
  *   **Pattern:** 1-C (Unsure), 2-A (Gradient), 3-A (Aggregate), 4-B (Substrate Irrelevant), 5-A (Precaution).
  *   **Tradition:** Precautionary Principle.
  *   **Awkward Commitment:** You must restrict research on simple systems not because they *do* feel, but because you cannot prove they *don't*, potentially paralyzing low-stakes innovation.

  **10. The Precautionary Threshold**
  *   **Pattern:** 1-A (Valence), 2-B (Threshold), 3-C (No Trade), 4-B (Substrate Irrelevant), 5-A (Precaution).
  *   **Tradition:** Wide Reflective Equilibrium.
  *   **Awkward Commitment:** You must treat borderline cases (like late-term fetuses or advanced AI) as full persons "just in case," bloating the moral community with entities that likely lack full status.

  **11. The Error-Theory Quietist**
  *   **Pattern:** 1-C (Unsure), 2-C (N/A), 3-C (N/A), 4-C (N/A), 5-C (No Fact).
  *   **Tradition:** Moral Error Theory / Eliminativism.
  *   **Awkward Commitment:** The entire debate about insect welfare is meaningless; there is no truth to be found about "moral weight," only preferences to be negotiated.

  **12. The Hybrid: Bio-Precautionary**
  *   **Pattern:** 1-C (Unsure), 2-A (Gradient), 3-B (Non-Aggregate), 4-A (Bio Only), 5-A (Precaution).
  *   **Tradition:** Unnamed (Occupied by pragmatic regulators).
  *   **Awkward Commitment:** You grant protection to animals based on biological uncertainty but deny it to functionally identical machines, privileging carbon over code without a clear metaphysical reason.

  ***

  ### Diagnostic Notes on the Tree

  **Indistinguishable Leaves**
  Leaves 3 (**Threshold Personhood**) and 4 (**Integrated Self-Model**) often produce identical policy recommendations (e.g., no rights for insects, full rights for adults). The separation is metaphysical rather than practical: Leaf 3 grounds status in *rights-bearing capacity*, while Leaf 4 grounds it in *phenomenal consciousness*. Readers often occupy both without realizing the justification differs; this is a shared commitment with a verbal difference in grounding.

  **Empty Cells**
  *   **Incoherent:** *Error Theory + Precautionary.* One cannot logically act on the precautionary principle (which assumes a risk of real harm) while holding that there is no fact of the matter about whether harm exists.
  *   **Unattractive:** *Radical Functionalism + Non-Aggregating.* If one accepts that functional complexity grants status (Radical Functionalism), refusing to aggregate that status (Non-Aggregating) is unmotivated. It grants rights to machines but arbitrarily caps their collective weight.
  *   **Unexplored:** *Biological Naturalism + Precautionary.* Most Biological Naturalists are realists about biology (they think we *know* plants don't feel). A view that says "Consciousness is biological, but we aren't sure which biology counts" is rare, likely because it undermines the certainty Naturalists seek.

  ***

  ### Compressed Scoring Key (Print Version)

  For the print magazine, the interactive tree is compressed into an eight-statement quiz. Readers rate agreement (1–5) to generate a profile.

  1.  **Valence:** Inner feeling is the only thing that matters morally.
  2.  **Function:** Complex behavior counts even without inner feeling.
  3.  **Gradient:** A worm's pain is real, just smaller than a human's.
  4.  **Threshold:** Suffering requires a certain level of brain complexity.
  5.  **Aggregation:** Enough small pains can equal one big pain.
  6.  **Substrate:** Silicon minds could suffer just like biological ones.
  7.  **Biology:** Consciousness requires living tissue.
  8.  **Uncertainty:** If we aren't sure it feels, we should treat it as if it does.

  **Resolution Loss**
  The compressed key loses the *conditional logic* of the tree. In the tree, Aggregation (Q3) only matters if you accept Gradient (Q2); in the quiz, a reader can score high on both Aggregation and Threshold, a logically unstable position the tree would have forced them to resolve. The quiz identifies clusters of intuition but cannot diagnose incoherence between them.
