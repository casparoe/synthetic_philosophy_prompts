answer: |-
  Elias, a patient with early-onset cortical degeneration, consents to the "NeuroLace" protocol, where damaged neurons are replaced one by one with nanoscopic prosthetic interfaces over the course of two years. Each prosthetic unit is causally isomorphic to the biological neuron it replaces, maintaining identical synaptic weights, firing thresholds, and integration into global workspace loops, ensuring Elias's behavioral outputs, memory access, and introspective reports remain uninterrupted throughout the procedure. By the protocol's completion, Elias's brain is entirely synthetic, yet he continues to pass all clinical assessments of self-awareness and reports no qualitative shift in his stream of consciousness. However, by philosophical stipulation, these artificial units lack the intrinsic phenomenal properties fundamental to biological matter and do not instantiate the specific relational "bonding" capacity required to unify micro-experiences into a macro-subject.

  ### Theoretical Verdicts and Mechanisms

  **Phenomenal-Bonding Theory**
  *   **Verdict:** Elias no longer exists as a unified macro-subject; instead, there exists a collection of isolated, non-bonded phenomenal fragments (or nothing, if the artificial units are strictly insentient).
  *   **Mechanism:** This view invokes a relational condition for subjecthood: micro-experiences must be bound by a specific phenomenological glue to constitute a unified "I." Since the artificial units lack this bonding capacity, the structural continuity preserves functional unity but fails to preserve phenomenal unity.
  *   **Relevant Nearby Worlds:** In a world where the replacement preserves biological bonding capacity (e.g., biological clones), consciousness persists. In a world of abrupt total replacement, the bonding network snaps instantly, resulting in immediate subject-death.
  *   **Explanation:** The verdict follows because the necessary condition for macro-consciousness (bonding) is gradually eroded. Even if the artificial units possess some proto-experience, the absence of the bonding relation means there is no single subject to own the experience reported by Elias's functional system.

  **Subject-Summing Theory**
  *   **Verdict:** Either a "phenomenal void" (if artificial units are strictly insentient) or an implausible crowd of billions of artificial micro-subjects (if functional isomorphism implies phenomenal identity).
  *   **Mechanism:** This view invokes a constitutive condition: macro-consciousness is simply the sum of co-existing micro-subjects. If the constituents lack phenomenal properties, there is nothing to sum.
  *   **Relevant Nearby Worlds:** In a world where artificial units are granted intrinsic phenomenal nature (panpsychist materialism), the macro-subject persists via summation. In a world of abrupt replacement, the sum drops to zero instantly.
  *   **Explanation:** The verdict follows because the constituents of the sum are removed. If the theorist adheres to the stipulation that artificial units lack phenomenal properties, the sum becomes zero (Void). If they argue functional identity necessitates phenomenal identity to avoid the void, they face the "crowd" problem where billions of micro-subjects falsely report being one macro-subject.

  ### Structural Work: Functional Preservation + Phenomenal Discontinuity + Gradualism

  The case derives its force from coupling **functional preservation** with **phenomenal discontinuity** at the micro-level, mediated by **gradualism**. Functional preservation ensures that behavioral and introspective reports remain constant, blocking the easy dismissal that Elias "lost consciousness and became a zombie." Phenomenal discontinuity (the stipulation that artificial units lack the requisite ontological properties) ensures that panpsychist conditions for consciousness are not met. Gradualism is the critical multiplier: it prevents the theorist from locating a single discrete moment where consciousness was lost. If consciousness faded or fragmented, Elias should report a degradation of unity or quality; since he does not, the theory must claim he is systematically mistaken about his own phenomenology throughout the entire procedure.

  ### Effect of Removing the Feature (Abrupt Replacement)

  If the replacement occurs **all at once** rather than gradually, the dialectical pressure dissolves. The **Bonding theorist** can treat the case as a discontinuous jump: the biological subject dies at t1, and a functionally identical but phenomenally fragmented system begins at t2. There is no conflict with reported experience because there is no subject left to report across the boundary. The **Summing theorist** can similarly treat it as a single collective disappearance: the sum goes from N to 0 instantly. Without gradualism, the contradiction between continuous first-person report and ontological loss disappears, as there is no continuous report spanning the transition. Gradualism forces the theory to explain how a subject can report continuity while allegedly losing the very conditions of their existence piece by piece.

  ### Defense of the Worst-Off View (Subject-Summing)

  The Subject-Summing theorist faces the worst outcome because the "Phenomenal Void" verdict implies Elias is a zombie despite his protests, while the "Crowd" verdict implies an absurd proliferation of subjects. To defend this view without retreating to non-panpsychist emergentism, the theorist must attack the stipulation that artificial units lack phenomenal properties. Drawing on Russellian Monist resources, the defender can argue that intrinsic phenomenal nature is not contingent on biological substrate but is revealed by causal role. If the artificial units are functionally isomorphic—participating in the exact same information-processing loops and structural relations—they must instantiate the same intrinsic nature as the biological neurons they replaced. This is not emergentism (which claims function *generates* consciousness ex nihilo) but rather a claim that function is the extrinsic appearance of intrinsic phenomenal properties. Therefore, the artificial units *do* possess phenomenal properties, and the sum remains intact. This preserves the panpsychist commitment to consciousness as fundamental while avoiding the void, arguing that the stipulation of "phenomenally empty functional duplicates" is metaphysically incoherent given the identity of causal structure.
