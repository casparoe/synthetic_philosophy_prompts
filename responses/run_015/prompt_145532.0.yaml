answer: |-
  Here is the sestina exploring the suspension of reactive attitudes through dissociation.

  In this circle no one dares to place the blame
  We sit and watch and quietly observe
  The hands that hurt us seem so close
  Yet all the memories remain distant
  Who owns the mess, who claims the fault
  Is there a way to effect repair

  We seek a method for the mind's repair
  But strip the agent out to stop the blame
  A mechanism breaks, it is not fault
  We scan the brain and calmly observe
  The signals jump across a distant
  Synapse gap, nothing personal or close

  Too close to feel the sting, only close
  To data charts that promise some repair
  I see the child who bears the fault
  As case study, not source of blame
  I monitor the pulse and observe
  The flatline where resentment should be distant

  I observe myself as others observe
  A patient needing management, not close
  Connection, so I let the blame
  Dissolve into a plan for repair
  There is no villain, only fault
  A chemical imbalance, distant

  If fault is biology, where is the blame
  To bind me to the world I observe
  Nothing is near, everything is distant
  No face to face, only close
  Monitoring of symptoms, no repair
  Can bridge the gap without the fault

  Admitting fault might bring the blame
  And let me stop observing, close
  The distance, end the distant
  Repair the bond, but I just observe
  The safety of the close
  And let them take the blame

  To repair the self requires fault and blame,
  Yet I observe from close, yet distant,
  Locked outside the human close.
