      *   *Patristic Citations:* Viewing them as *purely* diplomatic padding is a common but risky simplification. They serve a rhetorical function (authority), but they also ground his hermeneutic in Catholic tradition. Removing them weakens the argument *for his audience*, but maybe not the logical structure *for us*. However, calling them "wholly dispensable" ignores that Galileo is arguing *within* the theological framework, not outside it.
      *   *Lapsed-Demonstration Problem:* This is a sharp insight. It touches on the epistemic status of heliocentrism in 1615. Galileo claimed *demonstration* (proof), but the Inquisition claimed it was merely *hypothetical*. This is the crux of the conflict.

