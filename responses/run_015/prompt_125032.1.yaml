answer: |-
  Here's a first-principles spec for a "Right but Early" (RBE) framework. The goal is to separate legitimate lag (complex systems take time to tip) from motivated reasoning (moving the goalposts to save a pet theory).

  ### The Five Desiderata

  Any model claiming delayed vindication must sign off on these five conditions. If it misses one, it's not RBE; it's just wrong.

  **1. Mechanism Integrity (The Engine Test)**
  You must demonstrate that the causal engine is still running, even if the car hasn't crashed yet.
  *   *The Line:* If Malthus says "population grows geometrically, food arithmetically," but population growth slows *endogenously* (demographic transition) before hitting the food wall, the mechanism isn't delayed; it's broken.
  *   *Requirement:* Show that the stressor is still accumulating, even if the collapse is postponed. If the pressure isn't building, the theory is dead, not sleeping.

  **2. Exogenous vs. Endogenous Counterforces**
  You have to name the brake. Was the rescue a lucky external shock (exogenous) or a predictable system response (endogenous)?
  *   *Right but Early:* "The dam will break, but we built a spillway." (The water pressure is still there).
  *   *Wrong:* "The water never rose."
  *   *Requirement:* The theory must account for *why* the counterforce wasn't modeled initially. If the counterforce was predictable (e.g., price signals inducing efficiency), the original model was just bad, not early.

  **3. Observable Accumulation (The Stress Marker)**
  Even if the disaster hasn't happened, the *risk* must be measurable and increasing.
  *   *Requirement:* You need a leading indicator that correlates with the eventual failure. For climate, it's ppm CO2 and heat content. For Malthus, it should have been soil degradation or caloric deficit per capita. If the stress markers are flatlining, you don't get to claim "early."

  **4. Bounded Delay (The Horizon)**
  "Eventually" is theology, not science.
  *   *Requirement:* You must specify a new window of vindication with a hard outer bound. If you push the date from 2000 to 2020, you can't push it to 2050 without updating the mechanism. There is a limit to how many times you can roll the dice before the probability of the theory being true approaches zero.

  **5. Falsifiable Defeaters for the Rescue**
  This is the big one. You must specify what would prove the *rescue* is failing.
  *   *Requirement:* If your claim is "Tech will save us before the crash," you must define the metrics for that tech. If fusion power is the savior, and fusion is stalled, the theory takes a hit. You can't treat the rescue as an infinite magic wand.

  ---

  ### The Impossible Pairs (Jointly Unsatisfiable)

  You cannot maximize all virtues. You have to pick your poison.

  **1. Precise Timing vs. Shock Absorption**
  *   *Conflict:* If you demand a specific vindication date (e.g., "Collapse by 2030"), you become fragile to random noise (a pandemic, a war, a random breakthrough). If you claim your model absorbs arbitrary shocks ("It will happen whenever the system is ready"), you lose predictive power.
  *   *Trade-off:* You can have a tight window *or* robustness against black swans, not both.

  **2. Policy Urgency vs. Epistemic Humility**
  *   *Conflict:* To justify radical present-tense policy (e.g., "shut down the economy"), you need high confidence and a short timeline. To admit you might be "early" requires admitting uncertainty and a longer timeline.
  *   *Trade-off:* You can demand urgent action *or* admit you're in "epistemic escrow," but you can't use the uncertainty of "we might be early" to justify the certainty of "act now."

  ---

  ### The Killer Desideratum

  **#5 (Falsifiable Defeaters for the Rescue)** kills the most popular rescue attempts.

  Most "we were just early" arguments rely on a deus ex machina (tech, policy, behavioral change) to explain why the prediction didn't land. But proponents rarely specify *conditions under which the rescue fails*.
  *   *Example:* "AI will solve climate change."
  *   *The Kill:* If you can't say "If AI energy consumption exceeds X by year Y, the rescue fails," then the rescue is unfalsifiable. Without that, the theory is immune to evidence, which means it's not science. Most RBE claims die because they treat the counterforce as infinite.

  ---

  ### Policy in "Epistemic Escrow"

  Can a theory in escrow justify policy? **Yes, but only as insurance, not as certainty.**

  *   **Valid:** "The mechanism is plausible, the stakes are existential, and the cost of hedging is low. We buy the insurance." (e.g., carbon taxes as a premium).
  *   **Invalid:** "The theory is unproven but we must restructure society entirely based on it."
  *   *Rule:* Policy intensity must scale with **Mechanism Integrity**, not just **Potential Severity**. If the mechanism is shaky (see: Malthus), you hedge. If the mechanism is solid physics (see: GHG warming), you can act more aggressively even if the timeline is fuzzy.

  ---

  ### The Scorecard

  Here's how three classic long-horizon forecasts stack up against the spec.

  #### 1. Malthusian Population Traps
  *   **Mechanism Integrity:** **Fail.** Population growth didn't just get delayed; the relationship between income and fertility inverted (Demographic Transition). The engine isn't running; it was reversed.
  *   **Counterforce:** **Underestimated.** Malthus couldn't foresee industrial ag-tech.
  *   **Accumulation:** **Fail.** Per capita calories rose, didn't fell.
  *   **Verdict:** **Wrong, not Early.** Locally (famines), Malthus still holds, but as a global systemic theory, the mechanism broke.

  #### 2. Hubbert Peak Oil (Global)
  *   **Mechanism Integrity:** **Pass (mostly).** Extraction follows a bell curve for finite resources.
  *   **Counterforce:** **Endogenous.** Price spikes triggered fracking and deepwater tech. Hubbert treated tech as static; the market treated it as dynamic.
  *   **Bounded Delay:** **Fail.** Peak dates kept moving (1995, 2005, 2015...).
  *   **Verdict:** **Right Mechanism, Wrong Variable.** It's "Right but Early" regarding *conventional* oil, but the definition of "oil" expanded. It survives in escrow, but the horizon is blurred.

  #### 3. Equilibrium Climate Sensitivity (ECS)
  *   **Mechanism Integrity:** **Pass.** CO2 traps heat. This is physics, not sociology.
  *   **Counterforce:** **Mixed.** Aerosols masked warming; ocean uptake slowed surface temp rise. These are measurable.
  *   **Observable Accumulation:** **Pass.** Ocean heat content is rising even when surface temps pause.
  *   **Falsifiable Defeaters:** **Pass.** If CO2 rises and global heat content stagnates for 20+ years, the theory is in trouble.
  *   **Verdict:** **Legitimate RBE.** The mechanism is robust, the delay is explained by known physical buffers (oceans), and stress markers are accumulating. It meets the "Insurance" threshold for policy.

  ### Summary for Seminar
  If you want to defend a "Right but Early" claim, don't talk about the date. Talk about the **stress markers**. If the pressure isn't building, you're not early; you're wrong. And if you can't tell me what would break your rescue plan, you're not doing forecasting; you're preaching.
