prompt: |-
  i'm trying to build a spec for what counts as a 'right but early' theory — think malthus on population vs resources, but i want the framework general enough for climate or tech singularity forecasts too. write the desiderata any adequate delayed-vindication model must meet: the boundary conditions that turn a short-run failure into a postponement rather than a refutation (demographic transition? countervailing tech?); the hard line between 'mechanism is wrong' and 'mechanism is right but the counterforce was underestimated'; rules for how long we wait before declaring rescue dead; whether a theory sitting in 'epistemic escrow' can still justify present-tense policy; and any other distinctions it can't collapse. flag which pairs are jointly unsatisfiable — like if you demand precise vindication timelines you probably can't also absorb arbitrary shocks — and tell me which single desideratum kills the most popular rescue attempts. then briefly score malthusian logic, hubbert-style peak-resource curves, and one other long-horizon forecast against your list. keep it casual, this is for my seminar prep, not a journal article. build from first principles, don't hand me a bibliography.
reasoning: |-
