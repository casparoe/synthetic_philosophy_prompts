  ### Brainstorming Sketch (Internal)
  1.  **Default Valence:** If pain is *usually* bad, isn't that a defeasible principle? *Reply:* It's a tendency, not a rule. *Pressure:* How does it guide without functioning as a rule?
  2.  **Hidden Appendix:** She says generalists hide exceptions; does she hide explanations? *Reply:* Perception sees the whole. *Pressure:* What makes that explanation false?
  3.  **Contrast Classes:** Reasons depend on alternatives. Who picks the menu? *Reply:* Practical interests. *Pressure:* Do interests generate rules?
  4.  **Learning:** How do novices learn without rules? *Reply:* Apprenticeship/perception. *Pressure:* Distinguish from prejudice/disagreement.
  5.  **Ontology vs. Deliberation:** Is this about reality or thinking? *Reply:* Both/Neither. *Pressure:* How can useful things be metaphysically idle?
  6.  **Attenuation:** Reasons weigh less but don't vanish. How measure weight? *Reply:* Holistic balance. *Pressure:* Is balance a norm?
  7.  **Institutions:** Protocols exist. Are they just features? *Reply:* Yes. *Pressure:* Is following them generally a principle?
  8.  **Railings:** Principles are scaffolding. *Reply:* Useful but not true. *Pressure:* Can morality rest on fictions?
  9.  **Falsifiability:** What counts against this? *Reply:* Nothing/Context. *Pressure:* Is it dogmatic?
  10. **Moral Progress:** How improve without standards? *Reply:* Sensitivity increases. *Pressure:* Sensitivity to what? (Merged into Learning/Disagreement).

