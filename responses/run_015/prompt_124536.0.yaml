  ### Interview Questions for Dr. Ines Vogt

  **1. You say features like pain usually count against an action unless something unusual changes their force, but doesn't admitting a "default" value just sneak a general principle in through the back door?**
  *Note:* Tests if her holism collapses into defeasible generalism.
  *Follow-up:* If she says defaults aren't principles, ask how they guide action without functioning like rules.

  **2. You argue generalists hide exceptions in an appendix, but if you say context "explains" why a reason flips without stating how, aren't you just issuing a promissory note you can't cash?**
  *Note:* Presses the explanatory burden of particularism.
  *Follow-up:* If she claims perception grasps the explanation, ask what would count as that explanation being false.

  **3. Since you claim reasons are only fixed relative to a menu of alternatives, what determines which menu is the right one for a given choice?**
  *Note:* Targets the stability of contrastive reasons.
  *Follow-up:* If she says "practical interests," ask if those interests generate general rules about relevant alternatives.

  **4. If nothing general can be stated, how does a novice learn morality except by apprenticeship?**
  *Note:* Challenges the acquisition of moral knowledge.
  *Follow-up:* If she cites trained perception, ask how we distinguish it from prejudice and whether this makes disagreement unarguable.

  **5. Do you mean particularism as a claim about what reasons exist in the world, or only about how we should deliberate, since these seem to come apart?**
  *Note:* Clarifies the metaphysical versus epistemological status of her theory.
  *Follow-up:* If she says "both," ask how epistemically useful railings can be metaphysically idle.

  **6. You say reasons attenuate rather than vanish, but how do we measure this weight without a shared metric for weight that implies generalism?**
  *Note:* Probes the coherence of "attenuation" without principles.
  *Follow-up:* If she says "holistic balance," ask if that balance is itself a general norm.

  **7. In my old job, protocols demanded we act generally, so is the existence of a rule just another feature of the situation, or is following it a kind of rule-worship?**
  *Note:* Applies theory to concrete institutional constraints.
  *Follow-up:* If she says "another feature," ask if relying on that feature generally is itself a general principle.

  **8. You call principles "railings" that are epistemically indispensable but metaphysically idle, meaning they don't shape reality, but isn't that distinction merely verbal if they always guide us?**
  *Note:* Challenges the utility versus truth distinction.
  *Follow-up:* If she says "useful fictions," ask if morality can rest on fictions.

  **9. Finally, what evidence or argument could actually count against your view, given that any counter-example can be dismissed as context-sensitive?**
  *Note:* Tests the scientific or philosophical robustness of the theory.
  *Follow-up:* If she says "none," ask if that makes the view dogmatic.
