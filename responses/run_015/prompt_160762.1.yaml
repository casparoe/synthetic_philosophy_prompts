  ### 2. Predictions for the "Episodic Void" Man

  Here is how the three rules judge the man with no episodic memory but intact planning/concern:

  *   **Narrativity:** **No Self.** The prompt specifies "no inner story being spun." If the self *is* the narrative, the absence of episodic narration collapses the center of gravity.
