  ### 1. Which Rule Is She Running?

  She is running the **Answerability-or-Stake Condition**, specifically a version that requires *vulnerability*.

  Here is why the other two fail her track record:
  *   **Narrativity:** Fails on the **Corporation**. The PR department produces a polished, coherent first-person narrative ("We believe...", "Our mission..."). If narrative alone were sufficient, the Corporation would be a self. Her impatience suggests she sees the narrative as a facade because nothing *matters* to the PR department itself.
  *   **Predictive Payoff:** Fails on the **Corporation** and the **Chatbot**. Positing a "corporate self" or a "chatbot self" is instrumentally useful; it helps you predict their behavior (markets move, bots reply). Dennett's pure instrumentalism would grant them a derivative selfhood. Her "No" indicates she believes the abstraction must earn its keep *and* be anchored in something that can suffer or benefit.

  The **Stake Condition** fits every verdict:
