answer: |-
  ### I. Conceptual Neighbours and Eliminations

  To carve this phenomenon precisely, we must first clear the ground of concepts that resemble it but fail to capture the specific agent-relative and testimonial dimensions you describe.

  **Candidate 1: The Old Evidence Problem.**
  This is the most immediate neighbour. It addresses the puzzle of how a fact $F$, already known with certainty ($P(F)=1$), can confirm a new hypothesis $H$. Standard Bayesian updating suggests it cannot, since $P(H|F) = P(H)$ when $P(F)=1$.
  *Why I set it aside:* Your puzzle is not about the logical relation between $H$ and $F$ given a fixed probability function. It is about the *variance* in confirmatory force across different agents (students vs. experts) regarding the *same* logical relation. The Old Evidence problem is a structural issue for confirmation theory; your phenomenon is a sociological-epistemic issue regarding the transmission of justification. The student treats $F$ as "new" relative to $H$ psychologically, even if it is "old" historically. The Old Evidence framework cannot explain why the student's confirmation is *defeasible* upon learning the history, whereas the expert's was never present.

  **Candidate 2: Use-Novelty.**
  This is the standard methodological distinction between facts *predicted* by a theory and facts *accommodated* by it. A fact is use-novel if it was not used in the construction of the theory. It is widely held that use-novel facts provide stronger confirmation.
  *Why I set it aside:* Use-novelty is typically treated as an objective property of the theory-fact pair. Either $F$ was used in constructing $H$, or it was not. Your cases show that the confirmatory "glow" persists even when $F$ was *not* use-novel, provided the agent *believes* it might have been, or simply lacks the information that it was used. Conversely, the glow vanishes when the history is known, even if the logical fit remains. Use-novelty accounts for the history of the theory, but not the *epistemic access* to that history by the recipient of the evidence. It lacks the testimonial dimension.

  ### II. Preferred Analysis: Genealogical Discounting

  Since existing concepts capture the history or the logic but not the transmission, I propose we name this phenomenon **Genealogical Discounting**.

  **Definition:** Genealogical Discounting is the reduction in the confirmatory value of a fact $F$ for a hypothesis $H$ that occurs when an agent acquires knowledge of the *selection process* by which $H$ was retained over competing hypotheses. It is "genealogical" because it depends on the history of the belief's production; it is "discounting" because it functions as a defeater for the inference from fit to truth.

  **The Mechanism:**
  The core mechanism is a **Hidden Selection Effect**.
  When a student sees $H$ and $F$ together, they implicitly assess the likelihood ratio:
  $$ \frac{P(F | H)}{P(F | \neg H)} $$
  They judge $P(F | H)$ as high (good fit) and $P(F | \neg H)$ as low (it would be a coincidence if $H$ were false).
  However, the expert knows that $H$ was selected from a pool of candidate hypotheses $\{H_1, H_2, ... H_n\}$ specifically because it fit $F$. The expert effectively evaluates:
  $$ \frac{P(F | H \text{ was selected for fitting } F)}{P(F | \text{Some other } H_i \text{ was selected for fitting } F)} $$
  Since the selection rule guarantees a fit, the numerator is 1. But if many hypotheses could have been tuned to fit $F$, the denominator is also near 1. The ratio collapses to unity. The "fit" provides no leverage.

  The student is not irrational for feeling the confirmation; they are suffering from **Informational Asymmetry regarding the Space of Alternatives.** They do not know how many other hypotheses were discarded because they *failed* to fit $F$. The "glow" is the result of underestimating the denominator in the likelihood ratio.

  **Boundary Cases:**
  1.  **Genuine Prediction (Not Genealogical Discounting):** If $H$ was published *before* $F$ was measured, and $H$ was not adjusted post-hoc, there is no selection effect on $F$. Genealogical discounting does not apply.
  2.  **Robust Accommodation (Not Genealogical Discounting):** If $H$ was tuned to fit $F$, but $F$ is extremely specific (e.g., a precise numerical constant) such that it is highly improbable any other plausible hypothesis could have fit it even with tuning, the discounting is minimal. The selection effect exists, but the "filter" was so fine that surviving it is still impressive.
  3.  **Pure Testimonial Transfer (The Podcast Case):** This is the core of your puzzle. The confirmation is "laundered" because the testimonial chain transmits the *conclusion* ("H fits F") without the *premise* ("H was chosen because it fits F").

  ### III. The Strongest Objection and Reply

  **Objection:**
  This analysis makes confirmation dangerously subjective. If confirmation depends on what the agent knows about the history of the theory, then two agents with the same evidence ($H$ and $F$) are rationally permitted to hold different degrees of belief in $H$. This threatens the objectivity of science. Science should be about the relation between the world and the theory, not the sociology of who knows which textbook history. If $H$ is true, it is true, regardless of whether the student knows it was tuned.

  **Reply:**
  The objection conflates *truth* with *justification*. Confirmation is a measure of justification (reason to believe), not a direct measure of truth. Justification is inherently relative to an epistemic state (a background corpus).
  Consider a lottery ticket. If I hold a ticket, my chance of winning is 1 in a million. If I peek and see it is the winning ticket, my chance is 1. The ticket hasn't changed; my epistemic relation to it has.
  Similarly, the "fit" between $H$ and $F$ is static. But the *probative value* of that fit depends on the probability that the fit arose by chance versus design. Knowledge of the design process (tuning) changes the probability of the "chance" hypothesis.
  Therefore, it is not that science is subjective; it is that the *evidence* includes the history of its own production. A fact $F$ presented without its genealogy is incomplete evidence. The student is not in a different *scientific* position; they are in a *deficient evidential* position. They lack a crucial datum: the size of the hypothesis space that was filtered.

  ### IV. Addressing Your Specific Questions

  **(a) Is this something a Bayesian should care about?**
  Yes. A sophisticated Bayesian must care because this is a problem of **Likelihood Specification**.
  The agent is missing a correction for a filtering process. The "correction" is real: it is the adjustment of the denominator in the likelihood ratio to account for the number of discarded alternatives.
  *What should the agent do?* They cannot simply "suspend judgement" if they must act. However, they should treat the confirmation as **provisional**. In formal terms, they should assign a higher variance to their posterior probability. They should act as if the likelihood ratio is weaker than the fit suggests. If they cannot estimate the size of the filtering (how many theories were discarded?), they should apply a **penalty for accommodation**. A standard heuristic is to discount accommodated evidence by a factor proportional to the complexity of the theory (since complex theories can fit more data).

  **(b) Does it aggregate?**
  No. It does not behave like currency that multiplies. It behaves like a **shared informational deficit**.
  If a hundred undergraduates each get the boost, the community has acquired *none*. They are not independent observers. They are all accessing the same filtered signal. In fact, wide transmission can *dilute* the justification if the transmission chain degrades the context further (the "telephone game" effect).
  The total stock of justification for the community depends on the *experts* who know the history. If the experts are discounted (due to tuning), the community's justification is low, regardless of how many students feel convinced. The students' confidence is epistemically inert until they independently verify $F$ or $H$ in a new domain.

  **(c) Can it be regenerated?**
  Yes. This is a crucial insight. If a field collectively forgets that $F$ was used in constructing $H$, or a new subfield grows up that genuinely lacks that historical knowledge, $H$ **is** confirmed by $F$ again for them.
  This is not absurd; it is precisely what "novelty" amounts to in practice. Novelty is often epistemic, not temporal. If the selection history is lost, the selection effect is no longer part of the background corpus. The likelihood ratio reverts to the student's calculation.
  *Boundary:* This regeneration is only valid if the history is *truly* inaccessible. If the history is merely ignored, the discounting still normatively applies, even if psychologically it doesn't feel like it.

  **(d) What should an honest teacher do?**
  Withholding the history is a species of **epistemic deception**, even if well-intentioned. It creates a "noble lie" where students believe they have stronger reasons for belief than they actually do.
  *The Difference:* There is a distinction between learning the history of a *particular* case and being warned *in the abstract*.
  *   *Abstract Warning:* "Some facts you will see were used to build the theory." This triggers a general heuristic discount but leaves the specific fit intact.
  *   *Specific History:* "F was used to tune H." This triggers a specific defeater.
  *   *Recommendation:* The honest teacher should disclose the specific history but pair it with **independent support**. "H was tuned to fit F, so F doesn't prove much. However, H also predicts G, which we will test next." This redirects the confirmatory weight to use-novel territory (G) while being transparent about the accommodated territory (F).

  **(e) How, from the inside, can I tell?**
  There is no purely internal test based on the "feeling of fit." The feeling is the same in both cases.
  The test is **externalist**: You must investigate the **Space of Alternatives**.
  Ask: "How many other hypotheses were on the table when this theory was developed?"
  *   If $H$ was the *only* serious candidate, the fit is strong (low probability of fit by chance).
  *   If $H$ was one of fifty, and the other forty-nine were discarded because they didn't fit $F$, the fit is weak (high probability of fit by selection).
  *   *Practical Heuristic:* Look for **Rigidity**. If the theory would have been abandoned had $F$ been slightly different, it was tuned. If the theory would have stood and $F$ would have been a puzzle, it was a prediction. Tuning implies the theory was flexible enough to accommodate the data; prediction implies the theory was rigid enough to risk falsification.

  ### V. Summary of the Carving

  You have identified **Genealogical Discounting**. It is not merely the "Old Evidence" problem, nor is it standard "Use-Novelty." It is the **agent-relative impact of knowing the selection history of a theory.**

  *   **What it is:** A rational reduction in confidence based on knowledge that the theory was selected *because* it fit the data.
  *   **What it is not:** A psychological illusion (it tracks real selection effects); a property of the data alone (it depends on the agent's knowledge); a cumulative resource (it does not aggregate across ignorant agents).
  *   **The Edge:** It vanishes when the selection history is forgotten (regeneration) and it is detectable only by investigating the space of discarded alternatives, not by introspecting the quality of the fit.

  Your term "Laundered Fit" is apt for the testimonial transmission aspect, but **Genealogical Discounting** captures the normative mechanism: the history of the theory's construction acts as a defeater for the evidence provided by its accommodated facts.
