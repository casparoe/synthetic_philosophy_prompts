  A *Sphex* wasp decides to audit this seminar. It arrives at the door with a paralysed cricket, places it on the threshold, goes inside to inspect the seating, and comes back out. While it's inside, I slide the cricket two inches to the left.

  The wasp returns, drags the cricket back to the *exact* original spot, leaves it, and goes inside to inspect the seating again. I move it again. It restarts the loop again.

  The wasp isn't failing to learn; it's succeeding at being deterministic. It executes the 'Provisioning Protocol' perfectly, even though the context demands an 'Adaptation Protocol.' It proves you can mimic purposeful agency flawlessly without possessing the slightest flexibility to revise your plans.

  So, if I seem to be restarting this lecture from the beginning because someone coughed... please intervene. That's not philosophy; that's sphexishness.
