answer: |-
  Your skepticism is well-founded. The literature on societal collapse often conflates distinct phenomena under a single dramatic label, privileging narrative cohesion over analytical precision. Given your background in isotope geochemistry and proxy interpretation, you are uniquely positioned to interrogate the epistemic foundations of this field rather than its empirical specifics. You should not spend your next two years compiling case details; you should spend them auditing the instruments used to measure those details. Accordingly, I propose a ranked agenda of three questions. I advise you to drop your third candidate, the deflationary thesis that societies never fail but only change. That proposition is a semantic cul-de-sac; it functions as a rhetorical shield against falsification rather than a substantive claim, and engaging with it invites philosophical stagnation rather than productive analysis.

  The following agenda is ordered by logical priority and leverage. The ranking is argued on the basis that methodological validity must precede ontological definition, and ontological definition must precede mechanistic explanation.

  **1. The Detection and Null-Model Problem**
  This question must rank first because it is the epistemic prerequisite for all others. Before defining what collapses, one must establish that a collapse is distinguishable from background noise. Your suspicion regarding sampling artefacts is correct: archaeology is disproportionately sensitive to discontinuity. Abandonment layers, burned palaces, and ceased monument construction are archaeologically loud; continuity, adaptation, and gradual transformation are quiet. Consequently, the current catalogue of collapses may be a catalogue of visibility rather than catastrophe.

  *   **Dependency:** Nearly all subsequent arguments depend on this. If the signal cannot be distinguished from the null model of normal polity flickering, causal explanations are exercises in fiction.
  *   **Feasibility:** High for a lone reader. This is a conceptual and statistical problem, not an empirical one. It requires evaluating how proxies are interpreted, not generating new ones. Your experience with sediment cores makes you adept at distinguishing signal from noise in proxy records.
  *   **Neglect:** High. While some quantitative archaeology addresses this, synthetic treatments of collapse often assume the discontinuity is real before proving it is significant.
  *   **Impact on Cases:** For Rapa Nui, this questions whether the ecological crash is a statistical artefact of selective sampling. For the Maya, it challenges whether the cessation of dated monuments represents a population collapse or a shift in political ideology. For the LBA, it asks whether the destruction layers represent systemic failure or localized conflict within a continuing network.
  *   **Movement:** This question moves up if new quantitative methods demonstrate that continuity is systematically under-recorded. It moves down if a robust standard for statistical discontinuity is universally adopted.

  **2. The Unit-of-Analysis Problem**
  This ranks second because once a signal is established, we must define the system undergoing change. As you noted, administrative layers, subsistence regimes, and biological populations decouple. A palace economy may vanish while the peasantry persists unchanged. If "collapse" refers only to the elite superstructure, it is a political event; if it refers to demographic catastrophe, it is a biological one. Conflating these renders the term analytically useless.

  *   **Dependency:** High. Causal mechanisms differ depending on the unit. Ecological stressors affect subsistence regimes; political instability affects redistributive economies.
  *   **Feasibility:** High. This is a conceptual taxonomy problem solvable through critical reading of how authors define their terms.
  *   **Neglect:** Moderate. Many authors implicitly privilege the state or elite culture as the unit, ignoring the persistence of the broader population.
  *   **Impact on Cases:** In the LBA, this distinguishes the collapse of palatial bureaucracies from the continuity of village life. Among the Maya, it separates the end of the divine kingship model from the survival of Maya people and culture. On Rapa Nui, it distinguishes the loss of statue-building capacity from population survival.
  *   **Movement:** This moves up if consensus forms that "collapse" is a family-resemblance term requiring case-specific definitions. It moves down if a standard multi-scalar definition is adopted.

  **3. The Transfer of Early-Warning Machinery**
  This ranks third because it is mechanistic and contingent on the first two. Concepts like critical slowing down and rising variance are borrowed from ecological systems. Their application to social systems assumes societies behave like physical systems with attractor states. This is promising but risks being "physics envy"—a metaphor wearing mathematics.

  *   **Dependency:** Moderate. It depends on the unit being defined and the signal being real, but one can test the machinery independently.
  *   **Feasibility:** Moderate. It requires understanding complex systems theory, but you can evaluate the analogy without running models.
  *   **Neglect:** Low. This is currently a fashionable area of research, meaning there is ample literature to critique.
  *   **Impact on Cases:** It offers a potential universal language for comparing the LBA, Maya, and Rapa Nui. If valid, it suggests all three shared dynamic precursors. If invalid, it confirms these cases are historically distinct.
  *   **Movement:** This moves up if empirical studies successfully predict social transitions using these metrics. It moves down if the vocabulary is shown to be merely descriptive rather than predictive.

  **Case Mapping**
  The **Late Bronze Age** bears most directly on the **Unit-of-Analysis Problem**. The disconnect between the destruction of palaces and the continuity of material culture elsewhere in the Mediterranean makes it the prime case for decoupling elite politics from societal function. The **Classic Maya** bear most directly on the **Detection Problem**. The cessation of monument dating is a stark signal, but demographic data suggests continuity; determining whether this is a sampling artefact is crucial. **Rapa Nui** bears most directly on the **Early-Warning Problem**. As a closed system, it is the most frequently cited test case for ecological overshoot and resilience models, making it the primary battleground for the validity of physical analogies.

  **Conclusion**
  You should drop the deflationary thesis that societies never fail. It is a philosophical position that denies the phenomenon rather than explaining it, offering no falsification conditions. It is the single question from your original candidates that is near enough settled—in the sense that it is recognized as a semantic trap—that it does not deserve your time. Conversely, the single question on this agenda I would bet is still open in twenty years is the **Unit-of-Analysis Problem**. While statistical methods may improve, the fundamental disagreement over whether "society" refers to a state, a culture, or a population is ontological and likely perennial. It will remain the central friction point because resolving it requires agreeing on what human collectives matter, which is ultimately a value judgement disguised as taxonomy. Spend your two years auditing the signal and defining the system; leave the mechanisms to those who believe societies are merely complex ecosystems.
