answer: |-
  ## Executive Summary: The Self-Play Rule
  **Verdict:** **Keep it.**
  **Why:** Without self-play, Round 3 teaches only that *syntax* is fragile (obfuscation breaks `IF CODE==MINE`). With self-play, you teach that *logic* must be universalizable. If a strategy defects against itself, it loses 1/3 of its points automatically. This forces students toward "FairBot" logic (Cooperate if you prove I cooperate) rather than "CliqueBot" logic (Cooperate if we look alike).
  **Risk:** It complicates scoring.
  **Mitigation:** Simplify the scoring formula on the board: **Total = (2 × Match Score) + (1 × Self Score).** Do not calculate this live for everyone; calculate it for the 2-3 demo pairs on the board and estimate the rest.

  ---

  ## 1. The Setup
  *   **Room:** Arrange chairs in 8 pairs. Leave the whiteboard clear for "The Interpreter" (you).
  *   **Stakes:** "Pastry Priority." The top 3 scorers choose from the box first. The bottom 3 choose last. (Philosophy majors care about fairness/status; CS minors care about optimization. This hits both).
  *   **Handouts:** You need a printed "Instruction Sheet" for Rounds 2 and 3 containing the Language Spec (below). Do not rely on verbal instructions for syntax.

  ## 2. The Language Spec ("Whiteboard Assembly")
  *Print this on the handout. It must be the only legal syntax.*

  **Primitives:**
  1.  `COOPERATE` (Ends program, outputs C)
  2.  `DEFECT` (Ends program, outputs D)

  **Logic:**
  3.  `IF (CONDITION) THEN [Line #] ELSE [Line #]`
  4.  `CONDITION` can be one of:
      *   `SAME_SOURCE` (Is opponent's text character-for-character identical?)
      *   `CONTAINS("text")` (Does opponent's text include this string?)
      *   `SIMULATE == C` (Run opponent's code against *me*. Does it output C?)
  5.  `DEFAULT` (If the program exceeds 5 steps or loops, this action is taken).

  **Rules of Execution:**
  *   Programs execute line-by-line.
  *   `SIMULATE` counts as **3 steps**.
  *   Max steps per program = **5**.
  *   If Step Limit exceeded: **TIMEOUT**. Both players get **0 points** (The "Crash").
  *   Whitespace and capitalization matter for `SAME_SOURCE`.

  ---

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Round 1** | **Standard PD.** Sealed envelopes. Quick debrief on why everyone defected. |
  | **10-25** | **Round 2 Setup** | Distribute Language Spec. Explain rules. Students write code (5 mins). Collect code. |
  | **25-45** | **Round 2 Play** | **The Open-Source Round.** You act as CPU. Run 4 selected pairs on the whiteboard. (See *Risk Management* for selection strategy). |
  | **45-55** | **Round 3 Setup** | Announce Obfuscation + Self-Play rule. Students rewrite code (5 mins). Collect. |
  | **55-70** | **Round 3 Play** | **The Obfuscation Round.** Demonstrate obfuscation on 1 volunteer's code on the board. Run 2 selected pairs. |
  | **70-90** | **Debrief** | **The Arc.** Connect moments to theory. Address the "Correlated Equilibrium" objection. |

  ---

  ## 4. The Rounds

  ### Round 1: The Baseline (10 mins)
  *   **Action:** Hand out slips. "Write C or D. Fold. Pass to partner. Do not talk."
  *   **Payoff:** T=5, R=3, P=1, S=0.
  *   **Outcome:** Expect mostly Defect.
  *   **Instructor Note:** Do not explain *why*. Just record scores. Say: "This is the control condition."

  ### Round 2: Open Source (35 mins)
  *   **Instruction:** "You are submitting a program. It will play against one other person's program. You can see their code; they can see yours. Use the spec sheet."
  *   **Execution Strategy (Crucial):** You cannot run 8 pairs line-by-line in 20 minutes.
      1.  Collect all 16 programs.
      2.  Quickly scan. Identify 4 interesting matchups:
          *   *Match A:* `COOPERATE` vs `DEFECT` (The sucker).
          *   *Match B:* `IF SAME_SOURCE THEN C ELSE D` vs `IF SAME_SOURCE THEN C ELSE D` (The Clique).
          *   *Match C:* `IF SIMULATE==C THEN C ELSE D` vs `DEFECT` (The exploiter).
          *   *Match D:* `SIMULATE` vs `SIMULATE` (The Loop Risk).
      3.  Run these 4 on the whiteboard. Trace the lines. Count steps. Announce results.
      4.  For the other 4 pairs, announce: "Batch processed. Results posted later." (This saves 10 minutes).
  *   **Expected Outcome:** The `SAME_SOURCE` cliques get (3,3). The `DEFECT` bots get (5,1) against suckers but (1,1) against cliques.

  ### Round 3: Obfuscation + Self-Play (25 mins)
  *   **Instruction:** "Two changes. 1. Before I show your code to your opponent, I will rename variables and reorder lines (Obfuscation). `SAME_SOURCE` will now fail. 2. 1/3 of your score comes from playing against a copy of *your own* code."
  *   **Demo:** Take a student's Round 2 `SAME_SOURCE` code. On the board, cross out `X`, write `Y`. Move line 3 to line 1. Ask: "Does `SAME_SOURCE` still work?" (Class: No). "Does behavior change?" (Class: No).
  *   **Execution:** Run 2 pairs on the board.
      *   *Match E:* A `SIMULATE` bot vs a `SIMULATE` bot. (Watch the step count! If both simulate, that's 3+3=6 steps > 5 limit. **CRASH**).
      *   *Match F:* A `SIMULATE` bot vs a `COOPERATE` bot.
  *   **Expected Outcome:** `SAME_SOURCE` strategies die. `SIMULATE` strategies risk crashing. Simple `COOPERATE` does well on Self-Play but gets exploited on Match-Play.

  ---

  ## 5. The Debrief Arc (20 mins)
  *Do not lecture. Draw out the answers. Write these headers on the board as you go.*

  **1. The Dominance Argument (Round 1)**
  *   *Ask:* "In Round 1, why did you defect?"
  *   *Target:* "Because D dominates C regardless of what they do."
  *   *Point:* This assumes **Causal Independence**. My choice doesn't change theirs.

  **2. The Clique Equilibrium (Round 2)**
  *   *Ask:* "In Round 2, who used `SAME_SOURCE`? Did it work?"
  *   *Target:* Yes, it created cooperation.
  *   *Point:* We broke Causal Independence. Our outputs are now **Logically Correlated**. If I change my code, the opponent's simulation of me changes.
  *   *Concept:* **Program Equilibrium.** We aren't playing the PD matrix anymore; we're playing a 'Submission Game'.
  *   *Critique:* "Is this stable?" What if I write `IF SAME_SOURCE THEN C ELSE D`, but you write `IF CONTAINS("banana") THEN C ELSE D`? We defect. Cooperation relies on arbitrary syntactic agreement.

  **3. Syntax vs. Semantics (Round 3)**
  *   *Ask:* "What happened to `SAME_SOURCE` in Round 3?"
  *   *Target:* Obfuscation broke it.
  *   *Point:* Rationality shouldn't depend on variable names. We need **Behavioral Equivalence**.
  *   *Concept:* This is the gap between *syntax* (text) and *semantics* (behavior).

  **4. The Halting Cost (Round 3 Match E)**
  *   *Ask:* "Why did the two `SIMULATE` bots crash (timeout)?"
  *   *Target:* Infinite recursion. I simulate you simulating me...
  *   *Point:* Robustness costs computability. To prove cooperation safely, you need a **Proof** (logic), not a **Simulation** (running code). Simulation is vulnerable to the Halting Problem.
  *   *Concept:* **PrudentBot** (Cooperate if provable, Defect if not) vs. **FairBot** (Cooperate if simulated C).

  **5. The CS Colleague's Objection**
  *   *Setup:* "A colleague says this is just Correlated Equilibrium (CE) or Commitment."
  *   *Ask CS Minors:* "Defend the colleague."
      *   *Argument:* You committed to a strategy. The source code is a public signal. That's CE.
  *   *Ask Philosophy Majors:* "Attack the colleague."
      *   *Argument:* In CE, a mediator tells us what to do. Here, *I* deduce what to do based on *their* logic. There is no mediator. The correlation is internal to the reasoning.
  *   *Synthesis:* It *is* commitment. But it's **conditional commitment** based on logical counterfactuals. In standard Game Theory, counterfactuals are causal (if I changed my mind, the past wouldn't change). Here, counterfactuals are logical (if my code were different, the simulation result would be different).

  ---

  ## 6. Risk Management (What Will Go Wrong)

  | Risk | Probability | Mitigation |
  | :--- | :--- | :--- |
  | **CS Dominance** | High | CS minors will write complex nested loops. **Instruction:** "Code > 5 lines is illegal." **Private Word:** Tell CS minors beforehand: "Your goal is to make the Philosophy majors succeed, not to win." |
  | **Collusion** | Medium | Students agree out loud to all submit `COOPERATE`. **Instruction:** "Grades are relative. If everyone Cooperates, the Defector wins 5x." Remind them of Round 1 incentives. |
  | **Halting Loops** | High | Two `SIMULATE` bots will crash. **Preparation:** Have a red marker ready. Write **CRASH (0,0)** big on the board. Use this as the teaching moment for Round 3 debrief. |
  | **Ambiguity** | High | "Does `CONTAINS` include comments?" **Rule:** "Comments are stripped before submission. Code is raw logic only." |
  | **Time Overrun** | Very High | Running code manually is slow. **Rule:** Stick to the 4-pair demo limit. Do not try to run all 8. Admit: "We are sampling the population." |
  | **Defect-Always Wins** | Medium | If everyone tries to be clever, a simple `DEFECT` bot might top the board. **Fix:** The Self-Play rule in Round 3 punishes `DEFECT` (it defects against itself). Ensure this math is clear. |

  ---

  ## 7. Limitations (What You Must State Yourself)
  *This activity cannot reproduce the following. You must confess this in the last 5 minutes.*

  1.  **Gödelian Limits:** In the real world (and formal Program Equilibrium), you cannot perfectly simulate an equal opponent (Halting Problem). Real solutions require **Proof Search** (Löb's Theorem), not `SIMULATE`. You simulated the *idea* of logical dependence, but your `SIMULATE` primitive is technically impossible for identical agents without a step limit.
  2.  **Noise:** In reality, code gets transmitted with errors (bit flips). `SAME_SOURCE` is infinitely fragile. Real agents need "Error-Correcting Cooperation" (e.g., Cooperate if 99% similar).
  3.  **Evolution:** We played one shot. In a tournament, `DEFECT` usually wipes out `SAME_SOURCE` cliques unless the cliques can identify each other *without* exact syntax (which Round 3 tried to show is hard).

  ## 8. Instructor Cheat Sheet (For the Whiteboard)
  *Draw this before class starts.*

  **PAYOFF MATRIX:**
  *   C, C = 3, 3
  *   D, D = 1, 1
  *   D, C = 5, 0
  *   C, D = 0, 5

  **STEP COUNT:**
  *   `C` / `D` = 1 step
  *   `IF` = 1 step
  *   `SIMULATE` = 3 steps
  *   **LIMIT = 5** (Else 0,0)

  **ROUND 3 SCORING:**
  *   Total = (2 × Vs_Opponent) + (1 × Vs_Self)

  ---

  ### Final Advice on the "CS Colleague" Argument
  When the CS minor says "It's just Commitment," agree with them. Then turn to the Philosophy major and ask: "Standard rationality says you can't commit in a one-shot PD. Why?"
  The answer is: "Because the commitment isn't binding."
  Then point to the code: "The code *is* binding. You literally cannot play C if the code says D."
  The lesson isn't that Commitment is possible (we knew that). The lesson is that **Source Code makes Commitment Common Knowledge and Conditional.** That is the shift from Nash to Program Equilibrium.
