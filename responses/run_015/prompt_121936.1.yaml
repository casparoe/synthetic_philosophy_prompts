      *   *Typo:* Own it. Shows humility.

  6.  **Refining the Voices:**
      *   *Annales:* Needs to sound respectful but firm. "With all due respect to your innovation..."
      *   *Cliometrics:* Needs to sound impatient with qualitative fuzziness. "Where are the regression weights?"
      *   *Postcolonial:* Needs to sound critical of categories. "What work is 'adaptation' doing here?"

