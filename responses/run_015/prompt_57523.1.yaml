answer: |-
  **To:** Moderation Team
  **From:** [Your Name]
  **Subject:** Operational Protocol for Rule Analysis (Based on Lewisian Social Ontology)
  **Date:** October 24, 2023

  ### 1. Introduction and Purpose

  We frequently debate whether a rule is a "community norm," a "necessary policy," or just "how we've always done it." These distinctions matter because they dictate how we enforce rules and how we change them. If we treat a necessary safety rule like a habit, we undermine safety. If we treat a habit like a moral law, we create unnecessary resentment.

  This document operationalizes David Lewis's theory of *Convention* (1969) into a decision procedure. It is designed to be run within 48 hours using available mod tools (mod logs, search function, survey tools).

  **Note on Theory:** My roommate (econ) argues this is just "focal point" theory (Schelling). He is half-right. Schelling explains how we *pick* a solution. Lewis explains why we *stick* to it and why we feel *obligated* to stick to it even when we dislike it. This distinction is vital for us: Schelling helps us start a rule; Lewis helps us know if we can stop it without breaking the community coordination.

  ---

  ### 2. The Decision Procedure (The "Lewis-Mod Checklist")

  Run these questions in order. If you answer **NO** to any question in Section A, the practice is **NOT** a Lewisian Convention. Proceed to Section B to determine what it is instead.

  #### Section A: The Convention Test

  **Q1: The Regularity Condition**
  *   **Question:** Is there a consistent pattern of behavior in this specific situation?
  *   **Evidence:** Check mod logs for the last 3 months. Is compliance >85% without active enforcement? Do new users adopt the behavior within their first 3 posts without being told?
  *   **Sufficient Answer:** Yes, the behavior is statistically dominant.
  *   **Routing:** If **No**, this is not a convention (it may be a failed rule or a nascent norm). Stop. If **Yes**, proceed to Q2.

  **Q2: The Coordination Condition (Conditional Preference)**
  *   **Question:** Do users conform *because* they expect others to conform?
  *   **Evidence:** Look at removal reasons and modmail. When users complain about the rule, do they say "This is useless" (implies coordination) or "This is wrong/unjust" (implies moral norm)? When users deviate, do they justify it by saying "Nobody else does this either"?
  *   **Sufficient Answer:** Yes. Users indicate they would prefer *not* to do this if others weren't doing it, or they admit the rule only makes sense if everyone follows it.
  *   **Routing:** If **No** (users follow it because they think it's inherently right/good), this is a **Norm**, not a Convention. Stop. If **Yes**, proceed to Q3.

  **Q3: The Arbitrariness Condition**
  *   **Question:** Could a different regularity solve the community's problem almost as well?
  *   **Evidence:** Propose the alternative mentally. If we drove on the left instead of the right, would traffic flow? If we used Blue Flairs instead of Green Flairs, would sorting work?
  *   **⚠️ VALUE ALERT:** Defining "the community's problem" is a value judgment. Are we solving for *safety*, *speed*, *inclusivity*, or *order*? Lewis does not answer this; the Mods must define the "purpose" here.
  *   **Sufficient Answer:** Yes. There is at least one alternative ($R'$) that would work roughly as well as the current rule ($R$).
  *   **Routing:** If **No** (the current rule is uniquely suited to the purpose, e.g., "No Doxxing"), this is a **Constitutive Rule or Norm**. Stop. If **Yes**, proceed to Q4.

  **Q4: The Common Knowledge Condition**
  *   **Question:** Does everyone know that everyone knows this is the rule?
  *   **Evidence:** Is it in the Sidebar/Wiki? Have we posted a sticky about it? When a violation occurs, does the violator acknowledge they knew the rule?
  *   **Translation:** Lewis's "Common Knowledge" is infinite recursion (I know that you know that I know...). For us, this collapses to **Public Salience**.
  *   **Sufficient Answer:** Yes. It is publicly accessible and acknowledged as the standard.
  *   **Routing:** If **Yes**, **VERDICT: THIS IS A CONVENTION.** Proceed to Change Protocol A.

  #### Section B: Non-Convention Classification

  If you failed Q2, Q3, or Q4, classify as follows:
  *   **Failed Q2 (Intrinsic Preference):** This is a **Norm/Value**. (e.g., "Be Kind"). *Enforcement:* Rely on social pressure and moral justification. *Change:* Requires cultural shift, not just rule updates.
  *   **Failed Q3 (Non-Arbitrary):** This is a **Technical/Safety Constraint**. (e.g., "No Doxxing"). *Enforcement:* Zero tolerance. *Change:* Only if the underlying threat model changes.
  *   **Failed Q4 (Not Common Knowledge):** This is a **Hidden Habit**. *Enforcement:* Warn, don't ban. *Change:* Formalize it (make it salient) or abandon it.

  ---

  ### 3. Change Protocols

  #### Protocol A: Changing a Convention
  *   **Constraint:** You cannot simply decree a new convention. A decree only works if it makes a new equilibrium *salient*.
  *   **Risk:** If you abolish a convention without a clear replacement, you create a **Coordination Failure**. Users will fragment into different behaviors, reducing utility for everyone (e.g., some post in English, some in Spanish, neither understands the other).
  *   **Procedure:**
      1.  **Identify the Focal Point:** Choose the alternative ($R'$) that is most distinct and easy to coordinate around.
      2.  **Signal Simultaneity:** Announce the change with a specific start time ("As of Monday 00:00 UTC").
      3.  **Enforce the Switch, Not the Content:** For the first 2 weeks, enforce *compliance with the new rule* strictly, not because the new rule is morally better, but to establish the new common knowledge.
      4.  **Handling Stuck Equilibria:** If everyone privately wants to change but no one dares move first (e.g., "I'd post in Spanish if others did"), the Mods must act as the **Coordinator**. You must mandate the switch to the preferred equilibrium to break the stalemate.

  #### Protocol B: Changing a Norm or Constraint
  *   **Constraint:** Authority matters more here.
  *   **Procedure:** You may decree changes based on welfare/safety assessments. However, if you change a Norm (Q2 Failure), expect resistance based on values, not coordination. You must argue the *value*, not the *utility*.

  ---

  ### 4. Application to Live Cases

  Here is the procedure run on the three current disputes.

  #### Case 1: Merging Overlapping Post Flairs
  *   **Run:**
      *   Q1 (Regularity): **Yes.** Users consistently use the two existing flairs.
      *   Q2 (Coordination): **Yes.** Users sort by flair. If flair usage was random, the sorting function would fail.
      *   Q3 (Arbitrariness): **Yes.** One merged flair works as well as two split ones for sorting. The specific labels are arbitrary.
      *   Q4 (Common Knowledge): **Yes.** Flairs are visible UI elements.
  *   **Verdict:** **Convention.**
  *   **Analysis:** The controversy ("feelings none of us can articulate") suggests the convention has acquired *normative weight* over time (habit becoming value).
  *   **Recommendation:** Since it is a convention, we can change it, but we must treat the "feelings" as transition costs. We cannot just merge them silently. We must announce the merger as a **salience shift**. "We are standardizing to [Single Flair] to reduce clutter." Acknowledge the arbitrariness explicitly in the announcement to deflate the normative resistance.

  #### Case 2: Prohibition on Identifying Applicants/Staff (Doxxing)
  *   **Run:**
      *   Q1 (Regularity): **Yes.** People generally do not post names.
      *   Q2 (Coordination): **No.** Users do not refrain from doxxing *because others refrain*. They refrain because it is harmful.
      *   Q3 (Arbitrariness): **No.** The alternative (allowing doxxing) does *not* serve the participants' purposes (safety/privacy) "about as well." It serves them significantly worse.
  *   **Verdict:** **Not a Convention.** This is a **Safety Norm/Constraint.**
  *   **Analysis:** You have been defending this as a "community norm." Lewis's analysis confirms your suspicion: calling it a convention is a category error. It is not arbitrary.
  *   **Recommendation:** Stop justifying this with "this is how we do things." Justify it with "this protects welfare." Do not poll the community on this. Under Protocol B, this is enforced by authority based on safety values. The "Value Alert" in Q3 is critical here: We have decided *safety* is the purpose. If we decided *transparency* was the purpose, the verdict might change. That is our value judgment to own, not hide behind "convention."

  #### Case 3: The English-Only Rule
  *   **Run:**
      *   Q1 (Regularity): **Yes.** Posts are overwhelmingly English.
      *   Q2 (Coordination): **Yes.** Bilingual members post in English because they expect replies in English.
      *   Q3 (Arbitrariness): **Yes/No (Critical Junction).**
          *   If the purpose is "Communication": Arbitrary. Spanish/French would work.
          *   If the purpose is "A Single Unified Discourse": **Not Arbitrary.** Multiple languages fragment the discourse.
      *   Q4 (Common Knowledge): **Yes.**
  *   **Verdict:** **Convention (Conditional on Purpose).**
  *   **Analysis:** You argue this is an "arbitrary historical accident." Lewis agrees it is arbitrary *regarding language choice*, but **not arbitrary regarding the existence of a single language.**
      *   *The Roommate Critique:* If we abolish the rule by fiat ("Post in any language"), we do not get a bilingual utopia. We get a **fragmented equilibrium**. English speakers cluster, Spanish speakers cluster, cross-talk dies. The bilingual members (who want to talk to *everyone*) lose utility.
      *   *The Coordination Problem:* There are multiple equilibria (All-English, All-Spanish, Mixed). Currently, All-English is the salient one. "Mixed" is often an unstable equilibrium in text-based forums because it raises transaction costs for the monolingual minority.
  *   **Recommendation:** **Do not abolish by fiat yet.**
      *   If we simply remove the rule, we risk the "Fragmented Equilibrium."
      *   **Protocol A Suggestion:** If we want to change this, we must coordinate a *new* focal point. Simply allowing "anything" is not a focal point.
      *   **Better Proposal:** Implement a **Tagging Convention**. "Post in any language, BUT you must tag the language." This creates a new regularity ($R'$) that solves the coordination problem (users know what they are clicking) while allowing the linguistic diversity.
      *   **Blunt Truth:** You cannot "correct" this in public by saying "English is arbitrary." You must say "English is our current coordination point. To move to a multilingual model without breaking coordination, we need a new system (Tags) to manage the complexity." If you just open the floodgates, you will fracture the community, and the bilingual members will complain that the sub is no longer unified.

  ---

  ### 5. Limitations: What This Procedure Cannot Settle

  This document is a tool for identifying *coordination problems*. It is not a tool for justice. Be aware of the following blind spots:

  1.  **The "Purpose" Trap:** Lewis takes preferences as given. This checklist requires you to define the "purpose" of the sub (Q3). Lewis cannot tell you if the purpose *should* be "maximize growth" or "protect comfort." That is a political/ethical decision disguised as a technical one.
  2.  **Power Asymmetries:** Lewis assumes a population of equals coordinating for mutual benefit. This does not account for cases where a convention benefits the Mods or power-users at the expense of newcomers. A convention can be stable and exploitative. This checklist will identify it as a convention, but it will not tell you to overthrow it.
  3.  **The "Ought" Gap:** Identifying something as a convention explains why people *do* follow it, and why they feel they *ought* to. It does not prove they *morally* ought to. We can have a convention of tipping 20%. Lewis explains why we do it. It does not prove 20% is fair.
  4.  **Dynamic Drift:** This is a snapshot tool. It cannot predict when a convention is "dying" (expectations crumbling) versus merely "complained about." For that, you need longitudinal data (Q1 evidence over 6 months, not 2 weeks).

  ### 6. Summary for the Senior Moderator

  *   **Conventions** (Flairs, Posting Formats): Arbitrary, sustained by expectation. **Change by coordinating a new focal point.**
  *   **Norms/Constraints** (Doxxing, Harassment): Non-arbitrary, sustained by values/safety. **Change by authority/value argument.**
  *   **English-Only:** A convention for unity. **Abolishing it without a replacement coordination mechanism (like tagging) will fragment the community.**

  This machinery is not just semantics. It prevents us from using "habit" to justify "policy" (Case 2) and prevents us from using "freedom" to break "coordination" (Case 3).
