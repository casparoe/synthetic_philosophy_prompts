prompt: |-
  I'm a third-year philosophy student in a seminar on social ontology, and for the last six weeks we have been working through David Lewis's analysis in *Convention* (1969): a convention as a self-perpetuating regularity in a recurrent situation of interaction, sustained by everyone's conditional preference to conform given that the others do, by near-universal conformity and the expectation of it, by the fact that this is all common knowledge, and by the arbitrariness of the regularity, in the sense that some alternative would have served the participants' purposes about as well. I did well on the midterm and I can reproduce the apparatus, but the seminar only ever asks the question in one direction — is this practice a convention? — and never in the direction that has become urgent for me. Alongside the course I am one of four volunteer moderators of a student-run subreddit of roughly sixty thousand members covering admissions and course evaluation, a role I have held for two years. We field two or three rule proposals or high-profile enforcement disputes a week. Nobody's welfare depends on our calls, but our credibility does: last spring a badly handled change to our posting-format rules cost us about a fifth of our weekly active posters for a semester, and we are still rebuilding. None of my co-moderators has any philosophy or game-theory training beyond what I relay to them; decisions have to be made within about forty-eight hours and posted publicly with a written justification; and the senior moderator has final sign-off, so anything I hand upward has to be legible to someone who will never read Lewis.

  What I would like is a decision procedure my team could actually run on a proposal or a dispute, derived as faithfully as possible from that analysis. I want an ordered set of questions, and for each one: what would count as a sufficient answer, what evidence a moderator can realistically gather in two days (enforcement logs, whether newcomers converge on the practice without being told, whether deviators justify themselves by appealing to the rule's content or merely to their dislike of it, whether the complainants' preferences are actually conditional on what everyone else does), and where that answer routes. Some routes should terminate in "this is a convention, and therefore this follows about changing it, enforcing it, and excusing deviation from it." Others should terminate in "this is not a convention, and the analysis gives you no tools here" — which is in my experience the more valuable output, since most of our worst fights are cases where we have deployed habit-talk about a rule whose content is anything but arbitrary. I also want the change protocol that accompanies each classification: if a practice is a convention, what does the account imply about how it can be replaced — can an authority simply decree a new equilibrium, or does a decree work only insofar as it renders one of the alternatives salient enough that conditional preferences re-form around it? — and what should we do in the case where nearly everyone privately prefers a different regularity but nobody can coordinate the switch, or where the practice is drifting with no proposal on the table and we need to know whether it is dying or merely being complained about. Alongside all of this, please be explicit about the translation itself. Which of the technical distinctions have to survive into the checklist even though they will sound strange to a lay moderator — I suspect common knowledge and the arbitrariness condition are doing nearly all the work — and which can be collapsed or dropped without changing any verdict we would actually reach? My roommate, who studies development economics, insists that Lewis is only describing a focal point and that the philosophical machinery adds nothing; the document should make it clear what the machinery is contributing that the shorthand would miss. And flag every step where the checklist is really asking a moderator to make a judgment about values — who this community is for, what a practice costs the people it excludes — and merely dressing that judgment in a technical form. Lewis tells us a convention is arbitrary in that another regularity would serve the participants' purposes about as well; I do not think he tells us anything about whether those purposes are worth serving, and I would rather have that limitation stated up front than discovered mid-argument.

  Finally, run the procedure on three live cases of ours. First, a proposal to merge two overlapping post flairs into one: everyone agrees it is trivially arbitrary, yet half the community feels strongly about it for reasons none of us can articulate. Second, our standing prohibition on posting information that identifies a named applicant or a member of staff, which I have been defending in the register of "community norms" and which I suspect your procedure will decline to classify as a convention at all. Third, our English-only rule. On the third, be blunt with me: roughly a third of our members are bilingual and would prefer a rule permitting posts in either language, and I have argued for two years that English-only is an arbitrary historical accident we should simply abolish by fiat at the start of next term. If the analysis implies that we cannot — that several alternative regularities are available, none of them salient, so that relaxing the rule yields a fragmented equilibrium that is worse even for the bilingual members it was meant to serve — then say so plainly and tell me what the procedure recommends instead. I would much rather be corrected in this document than in public. Close with a short list of what the procedure cannot settle at all: the questions it will appear to answer but does not.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Third-year philosophy student, seminar on social ontology (David Lewis's *Convention*). Volunteer moderator of a large student subreddit (60k members).
      *   **Goal:** A practical decision procedure (checklist/flowchart) derived from Lewis's analysis of convention for the mod team to use on rule proposals/disputes.
      *   **Constraints:**
          *   Must be usable by non-philosophers within 48 hours.
          *   Must include evidence gathering methods (logs, behavior, etc.).
          *   Must distinguish between "Is a Convention" vs. "Is Not a Convention."
          *   Must include change protocols for each classification (how to replace/modify).
          *   Must address coordination problems (preference for change but inability to switch).
          *   Must explicitly translate technical terms (what to keep, what to drop).
          *   Must address the roommate's critique (Lewis vs. Schelling/focal points).
          *   Must flag value judgments disguised as technical judgments.
          *   Must apply the procedure to three specific cases:
              1.  Merging post flairs (arbitrary but controversial).
              2.  Doxxing/Privacy prohibition (suspected non-convention).
              3.  English-only rule (suspected arbitrary convention with coordination issues).
          *   Must conclude with limitations (what the procedure *cannot* settle).
      *   **Tone:** Academic but practical, rigorous, honest about limitations, respectful of the user's expertise but mindful of the audience (mods).

  2.  **Deconstruct Lewis's *Convention*:**

      *   **Core Definition:** A regularity $R$ in behavior in a recurrent situation $S$ among a population $P$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone has a conditional preference to conform to $R$ *given* that others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem almost as well (Arbitrariness).
          5.  All the above is *Common Knowledge*.
      *   **Key Distinctions:**
          *   Convention vs. Norm (Norms involve normative pressure/values, Conventions involve coordination/arbitrariness).
          *   Convention vs. Rule/Decree (Rules can create conventions if they make an equilibrium salient).
          *   Common Knowledge (Crucial for Lewis, often collapsed in practice).
          *   Arbitrariness (The "acid test").

  3.  **Drafting the Decision Procedure (The "Lewis-Mod Protocol"):**

      *   *Structure:* Needs to be a step-by-step questionnaire.
      *   *Translation:* "Common Knowledge" is hard to verify. Needs to be operationalized as "Publicly stated and acknowledged." "Conditional Preference" needs to be operationalized as "Would you still do this if others didn't?"
      *   *Value Flags:* Need to explicitly mark where the mods are deciding *what counts as a purpose* (e.g., safety vs. free speech).
      *   *Roommate Critique:* Need to explain why Lewis > Schelling here. Schelling = focal point. Lewis = *sustained* equilibrium via mutual expectations. The machinery matters for *stability* and *change management*, not just identification.

  4.  **Developing the Change Protocols:**

      *   *If Convention:* Cannot simply decree. Must shift salience. Need a "focal point" for the new equilibrium. Gradual transition or hard reset with clear signaling.
      *   *If Not Convention (e.g., Norm/Rule):* Authority can dictate, but enforcement costs vary.
      *   *If Stuck Equilibrium:* Need a coordinated switch (Schelling point).

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Flairs):* Likely a Convention. Arbitrary. Controversy suggests broken common knowledge or conflicting salience. Recommendation: Make one salient, acknowledge the arbitrariness.
      *   *Case 2 (Doxxing):* Not a Convention. It's a Norm/Rule based on welfare/safety, not coordination. Alternative (allow doxxing) does *not* serve purposes as well. Recommendation: Enforce as rule, don't treat as habit.
      *   *Case 3 (English-Only):* This is the tricky one. Is it arbitrary? If the purpose is "single community space," then multiple languages fragment the equilibrium. If the purpose is "communication," bilingualism works. Lewis suggests if multiple equilibria exist but none are salient, fragmentation occurs. Recommendation: If keeping one language is the goal for unity, English is the current equilibrium. Changing requires making *another* equilibrium salient (e.g., "Post in any language, but tag it"). Pure abolition might lead to fragmentation (bad equilibrium).

  6.  **Addressing the "Value Judgment" Constraint:**

      *   Lewis assumes preferences are given. Mods *shape* preferences. The checklist must flag where mods are defining the "purpose" of the sub.
      *   Example: In the Doxxing case, defining the purpose as "safety" vs. "transparency" is a value judgment, not a Lewisian fact.

  7.  **Addressing the Roommate's Critique:**

      *   Schelling (Focal Points) explains *selection*. Lewis explains *persistence* and *normative force* (the "ought" derived from "is" in coordination). The machinery matters for knowing *why* people obey and *how* to change it without breaking the system.

  8.  **Refining the Output:**

      *   *Tone Check:* Needs to sound like a handout for a mod team, but written by the student. Professional, clear, actionable.
      *   *Formatting:* Use bolding, lists, and clear sections.
      *   *Limitations:* Be honest. Lewis doesn't solve justice, only coordination.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is "Common Knowledge" too hard for mods?
      *   *Fix:* Operationalize it as "Is it in the Sidebar/Wiki and have we posted about it?"
      *   *Critique:* Is the English-only analysis too harsh?
      *   *Fix:* Be blunt as requested. If English-only is a coordination equilibrium for *unity*, breaking it without a new focal point causes fragmentation.
      *   *Critique:* Did I address the "value judgment" flagging?
      *   *Fix:* Insert specific "Value Alert" boxes in the procedure.

  10. **Final Polish:** Ensure all constraints of the prompt are met (ordered questions, evidence, routing, change protocol, translation, roommate critique, three cases, limitations).

  *(Self-Correction on the English-Only Case)*: I need to be careful here. Lewis says a convention is arbitrary *relative to the purpose*. If the purpose is "maximize participation," English-only is bad. If the purpose is "maintain a unified discourse," English-only might be a necessary convention to avoid fragmentation. The prompt says the user argues it's an "arbitrary historical accident." Lewis would say: even if historical accident, if it's now a coordination equilibrium, abolishing it by fiat without a new focal point leads to chaos. I need to make sure this distinction is clear.

  *(Self-Correction on Value Judgments)*: The prompt asks to flag where the checklist asks mods to make value judgments. I need to make sure the procedure explicitly says "Define the Purpose" and notes that *this definition* is the value judgment, not the Lewisian analysis itself.

  *(Final check on Roommate Critique)*: Make sure to explicitly state why Lewis adds value over Schelling. Schelling = how we pick. Lewis = why we stick and how we know others stick.

