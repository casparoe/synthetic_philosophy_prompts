answer: |-
  Here is the breakdown of your situation, separated into settled arithmetic, standard decision-theoretic results for repeated play, and the live methodological disputes where experts diverge.

  ### 1. The Arithmetic (Settled Facts)

  Your friend's claim that the expected value (EV) is "literally infinite" is **mathematically false** given the parameters you described.

  *   **The Cap:** A trillion dollars is $10^{12}$. Since the payout is $2^{n-1}$, the game must end when $2^{n-1} \approx 10^{12}$. Solving for $n$, we get $n \approx 40$. The coin cannot be flipped more than ~40 times.
  *   **The Expected Value:** In the uncapped St. Petersburg paradox, the sum $\sum_{n=1}^{\infty} \frac{1}{2^n} 2^{n-1}$ diverges to infinity. In your **capped** version, the sum stops at $n=40$.
      $$ \text{EV} = \sum_{n=1}^{40} \frac{1}{2^n} 2^{n-1} = \sum_{n=1}^{40} \frac{1}{2} = 20 $$
      The expected value of a single ticket is roughly **$20**, not infinity.
  *   **The Median:** You are correct that the median payout is **$1**. There is a 50% chance the first flip is heads ($n=1$, payout $1).
  *   **The Geometric Mean:** For a game played repeatedly with reinvestment (compounding), the relevant metric is the geometric mean, not the arithmetic mean.
      $$ \text{Geometric Mean} = \exp\left( \sum_{n=1}^{40} \frac{1}{2^n} \ln(2^{n-1}) \right) \approx \$2 $$
      (In the uncapped limit, this converges exactly to $2. With the cap, it is slightly less.)

  **Verdict on Friend's Arithmetic:** He is objectively wrong. The cap renders the EV finite (~$20). Even without the cap, physical constraints (heat death of the universe, app solvency) impose a hard bound, making "infinite EV" a physical impossibility.

  ### 2. Decision Theory for Repeated Play (Specialist Consensus)

  You are not playing a single shot; you are playing a **time-series** game where you reinvest winnings daily. This distinction is critical and widely accepted among specialists in gambling theory and quantitative finance.

  *   **Ensemble vs. Time Average:** Your friend is optimizing the *ensemble average* (the average payout across parallel universes). You are experiencing the *time average* (the growth of your specific bankroll over time).
  *   **Volatility Drag:** In multiplicative processes (compounding), high variance reduces the long-term growth rate. A 50% loss requires a 100% gain to recover. The arithmetic EV ignores this drag; the geometric mean accounts for it.
  *   **The Kelly Criterion:** For repeated bets with reinvestment, the standard prescription is to maximize the expected logarithm of wealth. This is equivalent to maximizing the geometric growth rate.
      *   If you pay a fee $F$ to play, your long-term wealth will grow only if $F < \text{Geometric Mean}$.
      *   Based on the calculation above, the Geometric Mean is ~$2.
      *   **If you set the entry fee higher than ~$2, your bankroll will trend toward zero over time,** even though the Arithmetic EV ($20) is higher than the fee.
      *   **If you set the fee near the EV ($20), you will almost certainly go broke.** This is known as "Gambler's Ruin" in the context of negative geometric growth despite positive arithmetic expectation.

  **Verdict on Strategy:** You should not be willing to pay "almost any fee." You should not even be willing to pay the Expected Value ($20). To maximize long-term survival and growth, you should set the entry fee no higher than the geometric mean (**~$2**). Since you are down money after three months, you have likely set the fee somewhere between $2 and $20.

  ### 3. Methodological Disputes (Where Experts Disagree)

  This is where the "rationalist" literature splits. Your friend's "re-denominate" argument touches on a specific debate regarding utility functions and the nature of risk.

  #### A. The "Re-denominate" Objection (Menger vs. Bernoulli)
  *   **Your Friend's Claim:** He argues that if you reject the gamble based on a concave utility function (diminishing marginal utility), he can simply scale the payouts (multiply by a trillion) until the expected utility becomes positive again. He claims this proves utility functions are just "squeamishness."
  *   **The Literature Split:**
      *   **Karl Menger (1934):** Showed that for the *uncapped* St. Petersburg paradox, **no** concave utility function is sufficient. If the payouts grow fast enough (Super St. Petersburg), they can always overcome any bounded utility function. In the *uncapped* theoretical case, your friend is technically correct that utility functions alone cannot resolve the paradox.
      *   **The Bounded Reality:** However, your game is **capped**. For any bounded distribution, a logarithmic utility function *does* yield a finite expected utility. The "re-denominate" trick fails here because you cannot scale the payouts beyond the trillion-dollar cap.
      *   **Consensus:** In your specific scenario (capped), the utility argument holds. Your friend is applying an argument valid only for unbounded mathematical abstractions to a bounded real-world app.

  #### B. Ergodicity Economics (Peters vs. Standard Decision Theory)
  *   **The Dispute:** Why should you use Log-Utility (Geometric Mean)?
      *   **Standard View (Von Neumann-Morgenstern):** Log-utility is a **preference**. It represents a subjective psychological aversion to risk. A "risk-neutral" agent *should* maximize Arithmetic EV. If you go broke, it's just bad luck, not a reasoning error.
      *   **Ergodicity View (Ole Peters, Murray Gell-Mann):** Log-utility is a **physical necessity** for non-ergodic systems. In a multiplicative time-series, the ensemble average (EV) is physically inaccessible to a single trajectory. Maximizing EV in this context is not "risk-seeking"; it is a mathematical error akin to dividing by zero. The difference isn't psychological; it's the difference between spatial average and time average.
  *   **The Split:**
      *   **Mainstream Economics/Philosophy:** Generally treats utility as subjective preference. They would say your friend is "risk-neutral" and you are "risk-averse," and neither is objectively wrong, though you will go broke.
      *   **Rationalist/Quant/Physics-Adjacent:** Increasingly side with the Ergodicity view (popularized in rationalist circles by Ole Peters' talks). They argue that for repeated bets, EV maximization is objectively irrational because it ignores the structure of time.
  *   **Relevance to You:** If you accept the Ergodicity argument, your friend isn't just "aggressive"; he is making a category error. He is treating a time-dependent process as a static expectation.

  ### Summary Recommendation

  1.  **The Fee:** Set your entry fee to **$2 or less**. Do not pay $20. Do not pay "any price." The cap limits the EV to $20, and the compounding dynamic limits the rational price to ~$2.
  2.  **The Bankroll:** Since you are reinvesting daily, your **entire bankroll** is effectively the stake. If the fee is >$2, the optimal fraction to risk is **0%** (do not play). If the fee is <$2, the optimal fraction is **100%** (play fully), provided the fee is small relative to your total wealth to avoid ruin from a short bad streak (standard Kelly caution).
  3.  **The Friend's Error:**
      *   **Arithmetic:** He ignored the cap (EV is $20, not $\infty$).
      *   **Theory:** He is optimizing for parallel universes (Ensemble Average) while you live in one timeline (Time Average).
      *   **Methodology:** His "re-denominate" argument fails because the game is bounded.

  **Final Settlement:** You are right to be concerned. Your friend is applying unbounded paradox logic to a bounded, time-series problem. In the literature of repeated gambling, maximizing Arithmetic EV is known to lead to bankruptcy. Maximize Geometric Mean instead.
