answer: |-
  1. Consider a closed network of independent forensic accounting firms bidding on statutory audit rotations where industry bylaws allow costless, binding price-fixing agreements enforceable by license revocation. Over a decade, bid prices and allocated hours per audit steadily decline while reported stress and error rates rise, despite every incumbent signing the same minimum-fee contract annually with full knowledge of the long-term trajectory. The degradation lands directly on the partners via income loss and liability risk, and while communication is frictionless, established firms dissolve and are immediately replaced by new entities occupying their market share.

  2. The trap diagnosis claims incumbents sign the contract but secretly cut corners because the fixed price is still below the cost of compliance, making defection on quality the only viable strategy within the agreement. The selection diagnosis claims firms that genuinely comply with the cost-of-service contract lose money and exit, while entrants who value market share over profitability join specifically to operate at the lower quality threshold.

  3. The structural feature that peels them apart is the longitudinal performance data of individual surviving firms versus the aggregate market average. If the trap holds, specific long-lived firms should show declining margins and increasing corner-cutting over time despite the contract, whereas selection implies long-lived firms maintain stable margins with the aggregate decline driven entirely by population replacement.

  4. If you remove turnover by freezing market entry and exit, the selection diagnosis collapses because the filtering mechanism is disabled, leaving only stable incumbents who should theoretically thrive under the binding contract. The trap diagnosis predicts the decline continues unabated among the locked-in firms because the incentive to degrade quality remains internal to the payoff structure regardless of population churn.

  5. A defender of the trap diagnosis, which fares worse under the binding contract specification, would attack the selection view by arguing that surviving firms also degrade practices over time due to creeping normalization of deviance. They would claim the exit data is misleading because the "new" firms are often just reincarnations of old ones shed of liability, masking the universal pressure to escalate rather than a true population replacement.
