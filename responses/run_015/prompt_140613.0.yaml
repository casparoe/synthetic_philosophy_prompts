prompt: |-
  Bit of an odd ask. I'm a philosophy PhD student (mind/lang, externalism-adjacent) and I've picked up paid work helping a mid-sized hospital system fold its departmental vocabularies into one clinical data dictionary. So: every week I get a dozen or so pairs of terms — "sepsis" as the ICU uses it vs "sepsis" as billing uses it, "malnutrition" in the paeds notes vs in the dietitians' notes, that kind of thing — and I get about twenty minutes a case, no clinician to ask, and whatever I decide has to be signed off by a governance committee of two physicians and an IT guy with zero patience for theory.

  What I want is a procedure I can actually run: a short ordered set of tests that takes two terms as used by two communities and gives me merge / keep separate / escalate-to-a-human-because-this-is-a-purpose-question-not-a-semantic-one. Grounded in the real thing though, not common sense with jargon sprinkled on. I know Putnam's Twin Earth set-up, I know the slogan that meanings aren't in the head, I know the move that reference is fixed by what the stuff actually is and not by the criteria or stereotype users associate with the term. What I can't see is what any of that tells me to *do* with two spreadsheets on a Tuesday afternoon.

  Three things I need. (1) Which bits of the theory have to survive the translation and which I can drop — a governance committee cannot handle possible worlds, and I suspect some of the distinctions matter more than others, but tell me which and why. (2) The hard cases: especially where both groups use the same criteria but the stuff turns out to be two different kinds (the jade-ish case — one word, two minerals), and where there's no underlying kind at all ("failure to thrive", "wellness"), where I think the theory definately goes quiet and I should say so instead of faking it. (3) Run it on three pairs, including one I have a stake in: I've already told the committee that ICU "sepsis" and billing "sepsis" should stay separate, and if the procedure says merge, I want to hear that. Also say plainly what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy PhD student (mind/language, externalism-adjacent).
      *   **Task:** Harmonizing clinical vocabularies (data dictionary) for a hospital system.
      *   **Constraints:** ~20 mins/case, no clinician access, governance committee (2 MDs, 1 IT) has zero patience for theory.
      *   **Goal:** A practical, ordered set of tests (procedure) to decide: Merge / Keep Separate / Escalate.
      *   **Requirements:**
          1.  Theory translation: What keeps from externalism/reference theory, what gets dropped.
          2.  Hard cases: "Jade" cases (same criteria, different underlying kind) and "No Kind" cases (functional/social constructs like "failure to thrive").
          3.  Test run: Apply to three pairs, including "ICU Sepsis vs. Billing Sepsis" (user currently says separate, wants to know if procedure disagrees).
          4.  Honesty: State plainly what the procedure *can't* do.

  2.  **Deconstruct the Philosophical Theory (Externalism/Reference):**
      *   *Core Insight:* Meaning isn't just internal criteria (stereotypes); it's tied to the extension (the actual stuff) and the causal/historical chain of usage.
      *   *Relevance to Data:* In a data dictionary, we care about *extension* (what patients get tagged) and *purpose* (why we tag them).
      *   *What to Drop:* Possible worlds, rigid designators (as metaphysical claims), Twin Earth thought experiments, causal-historical chains (unless it's about data lineage). The committee cares about interoperability, billing compliance, and patient safety, not metaphysics.
      *   *What to Keep:* The distinction between *criteria of application* (how they identify it) and *extension* (what actually gets counted). The idea that "same word" $\neq$ "same concept" if the extensions diverge significantly. The idea that some terms pick out natural kinds (pathogens) and others pick out functional/social kinds (billing categories).

  3.  **Develop the Procedure (The "Tuesday Afternoon Algorithm"):**
      *   Needs to be fast (20 mins).
      *   Needs to be actionable (checklists, thresholds).
      *   Needs to map to the three outcomes (Merge, Separate, Escalate).
      *   *Step 1: Extension Check.* Do they tag the same patients? (Empirical).
      *   *Step 2: Purpose/Action Check.* Does tagging this lead to different actions? (Pragmatic).
      *   *Step 3: Ontology Check.* Is there a hidden "Jade" problem or a "No Kind" problem? (Theoretical but simplified).

  4.  **Drafting the Steps (Iterative refinement):**
      *   *Draft 1:* 1. Check definitions. 2. Check patients. 3. Check outcomes.
      *   *Critique:* Too vague. Needs specific thresholds.
      *   *Draft 2:* 1. Compare inclusion criteria. 2. Compare exclusion criteria. 3. If overlap > 90%, merge.
      *   *Critique:* Misses the "purpose" aspect. Billing Sepsis and ICU Sepsis might overlap 90% but have different legal consequences.
      *   *Refinement:* Incorporate the "Actionability" test. If Term A triggers Antibiotic Protocol and Term B triggers ICD-10 Code, are those compatible?
      *   *Refinement on Theory:* Use "Extension" (who gets tagged) and "Downstream Consequences" (what happens after tagging). This maps to Putnam's "extension determines meaning" and Wittgensteinian "meaning as use" without using the jargon.

  5.  **Addressing the Hard Cases:**
      *   *Jade Case (Nephrite vs. Jadeite):* In medicine, this is "Same symptoms, different etiology." E.g., "Pneumonia" (viral vs. bacterial). If treatment differs, keep separate. If treatment is identical, merge.
      *   *No Kind Case ("Wellness"):* These are functional clusters. You can't merge them based on "truth," only based on "utility." If the utility differs (Research vs. Billing), keep separate. This is where the philosopher admits the limit of semantics.

  6.  **Running the Test Cases:**
      *   *Case 1: ICU Sepsis vs. Billing Sepsis.*
          *   ICU: Clinical instability, SOFA score, treat now.
          *   Billing: ICD-10 codes, requires specific documentation, treat for reimbursement.
          *   Extension: High overlap, but not perfect.
          *   Action: Antibiotics vs. Invoice.
          *   Verdict: Keep Separate (User was right).
      *   *Case 2: Paeds "Malnutrition" vs. Dietitian "Malnutrition".*
          *   Paeds: Failure to gain weight (growth charts).
          *   Dietitian: Micronutrient deficiency (labs).
          *   Extension: Divergent. A kid can be obese but micronutrient deficient.
          *   Action: Social work referral vs. Supplement prescription.
          *   Verdict: Keep Separate (Jade-ish).
      *   *Case 3: "Fall Risk" (Nursing) vs. "Fall Risk" (PT).*
          *   Nursing: Bed alarm, toileting schedule.
          *   PT: Gait analysis, walker prescription.
          *   Extension: Similar patients.
          *   Action: Different interventions.
          *   Verdict: Escalate (Purpose conflict). Or Keep Separate depending on strictness. Let's make it an "Escalate" case to show the limit. Actually, let's use "Failure to Thrive" as the third to hit the "No Kind" requirement.
          *   *Revised Case 3:* "Failure to Thrive" (Paeds) vs. "Failure to Thrive" (Geriatrics).
          *   Paeds: Weight percentiles.
          *   Geri: Functional decline + weight loss + depression.
          *   Ontology: No single biological kind.
          *   Verdict: Keep Separate (Different underlying clusters).

  7.  **Addressing the "What to Drop/Keep" from Theory:**
      *   *Keep:* Extension matters more than intension. Reference is fixed by practice, not definition.
      *   *Drop:* Metaphysical necessity. We don't care if it's *really* sepsis in all possible worlds, we care if it's *coded* as sepsis in this EHR.
      *   *Translation:* "Causal theory of reference" becomes "Data Lineage/Source of Truth." "Natural Kind" becomes "Biological Mechanism."

  8.  **Addressing "What the Procedure Can't Do":**
      *   It can't resolve political power struggles (Billing vs. Care).
      *   It can't fix bad data.
      *   It can't define "truth" for social constructs.

  9.  **Review against Constraints:**
      *   Tone: Professional, peer-to-peer (PhD to PhD), no fluff.
      *   Time: 20 mins/case feasible? Yes, if data is available.
      *   Committee: Will they understand? Yes, if framed as "Risk/Action/Overlap."

  10. **Final Polish:** Ensure the distinction between "Semantic" and "Pragmatic" is clear. The user is asking for a semantic procedure, but the real work is pragmatic. I need to highlight that tension. The "Escalate" category is crucial for when semantics hits the wall of policy.

  *(Self-Correction during drafting)*: I initially thought about suggesting a merge if extensions overlap 95%. But in healthcare, the 5% difference might be the patients who die. I need to emphasize *consequence* over *overlap*. If the consequence of misclassification is low, merge. If high, separate.

  *(Refining the "Jade" analogy)*: In medicine, "Jade" is often "Syndrome X vs. Syndrome Y." If the treatment is the same, merge. If different, separate. This is the "Therapeutic Equivalence" test.

  *(Refining the "No Kind" analogy)*: "Pain" or "Wellness." These are response-dependent or functional. You can't merge these based on biology. You merge based on workflow. If workflows differ, separate.

  Let's assemble the response.

  *   **Section 1: Theory Translation.** (Keep Extension/Reference, Drop Metaphysics).
  *   **Section 2: The Procedure.** (3-Step Filter: Extension, Action, Ontology).
  *   **Section 3: Hard Cases.** (Jade = Mechanism mismatch; No Kind = Functional mismatch).
  *   **Section 4: Test Run.** (Sepsis, Malnutrition, Failure to Thrive).
  *   **Section 5: Limitations.** (Politics, Data Quality, Normative claims).

  Make sure to validate the user's intuition on Sepsis. It's a classic case of "Clinical Reality" vs. "Administrative Reality." Externalism supports keeping them separate because the "reference" is fixed by different practices (treatment vs. reimbursement).

  Okay, ready to write.
answer: |-
  This is a classic "applied metaphysics" problem, but you are correct: the committee does not care about rigid designators. They care about liability, reimbursement, and interoperability.

  Here is the translation of your theoretical toolkit into an operational procedure, followed by the hard cases and the test run.

  ### 1. Theory Translation: What to Keep, What to Drop

  You are working in a **pragmatic externalist** framework. The "meaning" of a term in a data dictionary is determined by its **extension** (which patients get tagged) and its **causal role** (what downstream processes the tag triggers).

  **Drop:**
  *   **Possible Worlds/Metaphysical Necessity:** Do not argue about what sepsis *really is* in every possible universe. Argue about what gets coded in *this* EHR.
  *   **Internalism/Descriptions:** Do not focus on the definitions provided by the departments (the "stereotypes"). Definitions are often wrong or aspirational. Focus on usage.
  *   **The "True" Reference:** There is no Platonic form of "Malnutrition." There is only the referent fixed by the Dietitian's practice vs. the Paediatrician's practice.

  **Keep:**
  *   **Extension Determines Reference:** If Term A and Term B tag significantly different sets of patients, they are different terms, regardless of whether they share a label.
  *   **Division of Linguistic Labor:** The committee accepts that experts fix the reference. You are not the expert. Your job is to identify *which* expert community is fixing the reference for a given use-case.
  *   **Natural vs. Functional Kinds:** Distinguish between terms picking out biological mechanisms (pathogens) and terms picking out administrative/functional clusters (billing codes, care pathways). Merging rules differ for each.

  ---

  ### 2. The Procedure: The "Extension-Action-Ontology" Filter

  **Time Budget:** 20 Minutes.
  **Inputs:** Two term definitions, sample data (if available), downstream workflow documentation.
  **Outputs:** MERGE, KEEP SEPARATE, ESCALATE.

  #### Step 1: The Extension Test (5 mins)
  *Question: Do the terms tag the same patients?*
  *   **Action:** Compare inclusion/exclusion criteria. If you have access to sample data, check the overlap rate.
  *   **Threshold:**
      *   **High Divergence (<80% overlap):** **KEEP SEPARATE.** (Different extensions = different reference).
      *   **High Overlap (>95% overlap):** Proceed to Step 2.
      *   **Unknown/Unclear:** Proceed to Step 2 (conservative assumption).

  #### Step 2: The Action Test (10 mins)
  *Question: Does tagging a patient with Term A trigger different downstream actions than Term B?*
  *   **Action:** Map the "consequences" of the tag.
      *   *Clinical:* Medication, isolation, consult order?
      *   *Administrative:* Billing code, quality metric, report to public health?
  *   **Threshold:**
      *   **Different Actions:** **KEEP SEPARATE.** (Meaning is use; different use = different meaning).
      *   **Identical Actions:** Proceed to Step 3.
      *   **Conflicting Actions:** **ESCALATE.** (e.g., Term A triggers isolation, Term B triggers discharge).

  #### Step 3: The Ontology Test (5 mins)
  *Question: Are we merging "Natural Kinds" or "Functional Kinds"?*
  *   **Action:** Determine if the term refers to a biological mechanism or a social/administrative cluster.
  *   **Threshold:**
      *   **Natural Kind (e.g., Bacteria, Fracture):** If Steps 1 & 2 pass, **MERGE.** (Assume one underlying reality).
      *   **Functional/Social Kind (e.g., "Wellness", "Risk", "Failure to Thrive"):** **KEEP SEPARATE.** (These terms are defined by their specific community purpose. Merging them obscures the purpose).
      *   **Unclear:** **ESCALATE.**

  ---

  ### 3. The Hard Cases

  You identified two specific failure modes for semantic theory. Here is how the procedure handles them without invoking theory.

  #### The "Jade" Case (Same Criteria, Different Underlying Kind)
  *Example:* "Pneumonia" (Viral vs. Bacterial) or "Malnutrition" (Caloric vs. Micronutrient).
  *   **Theoretical Problem:** Descriptions match, but reference differs.
  *   **Procedure Solution:** This is caught in **Step 2 (Action Test)**.
      *   If the treatment for Viral Pneumonia is supportive and Bacterial is antibiotics, the *Actions* differ. **Keep Separate.**
      *   If the treatment is identical, the distinction is clinically irrelevant for the data dictionary. **Merge.**
      *   *Philosophical Note:* You are treating "therapeutic equivalence" as a proxy for "natural kind identity." It works for hospitals.

  #### The "No Kind" Case (Response-Dependent or Cluster Concepts)
  *Example:* "Failure to Thrive," "Wellness," "Pain."
  *   **Theoretical Problem:** There is no mind-independent stuff to anchor the reference. The meaning is exhausted by the criteria.
  *   **Procedure Solution:** This is caught in **Step 3 (Ontology Test)**.
      *   Recognize these as **Functional Kinds**. Their "truth" is relative to the community goal (e.g., Geriatrics vs. Paediatrics).
      *   **Rule:** Functional kinds should not be merged across communities unless the *goal* is identical.
      *   *Philosophical Note:* This is where you admit semantics goes quiet. You cannot solve this with reference; you must solve it with policy. Hence, if the goals differ, **Keep Separate** to preserve the provenance of the judgment.

  ---

  ### 4. Test Run

  Here is the procedure applied to your three cases.

  #### Case 1: ICU "Sepsis" vs. Billing "Sepsis"
  *   **Step 1 (Extension):** ICU uses SOFA/qSOFA scores (physiological instability). Billing uses ICD-10 criteria (specific documentation + coding rules). Overlap is high, but not perfect (a patient can be septic clinically but not coded, or coded but not meet ICU thresholds). *Result: High Overlap.*
  *   **Step 2 (Action):** ICU tag triggers Antibiotic Protocol + Isolation. Billing tag triggers DRG assignment + Reimbursement. *Result: Different Actions.*
  *   **Step 3 (Ontology):** Sepsis is a Natural Kind (biological response), but the *terms* are functioning as different tools (Clinical Tool vs. Administrative Tool).
  *   **Verdict:** **KEEP SEPARATE.**
  *   **Comment:** Your intuition was correct. Externalism saves you here: the reference is fixed by different practices (treatment vs. reimbursement). Merging them creates liability (billing fraud or clinical risk).

  #### Case 2: Paeds "Malnutrition" vs. Dietitian "Malnutrition"
  *   **Step 1 (Extension):** Paeds uses growth charts (weight-for-age percentiles). Dietitian uses labs (albumin, micronutrients) + intake history. A child can be obese (Paeds: OK) but micronutrient deficient (Dietitian: Malnourished). *Result: High Divergence.*
  *   **Step 2 (Action):** Paeds tag triggers Social Work/Safeguarding referral. Dietitian tag triggers Supplement Order. *Result: Different Actions.*
  *   **Step 3 (Ontology):** Functional Kind (Diagnostic criteria vary by specialty).
  *   **Verdict:** **KEEP SEPARATE.**
  *   **Comment:** This is a "Jade" case. Same label, different underlying indicators. Merging would lose critical clinical nuance.

  #### Case 3: "Failure to Thrive" (Paeds) vs. "Failure to Thrive" (Geriatrics)
  *   **Step 1 (Extension):** Paeds = Weight drop across percentiles. Geri = Weight loss + Functional decline + Depression. *Result: High Divergence.*
  *   **Step 2 (Action):** Paeds = Safeguarding/Nutrition. Geri = Palliative/Social Support. *Result: Different Actions.*
  *   **Step 3 (Ontology):** **No Kind Case.** There is no single biological mechanism "Failure to Thrive." It is a placeholder for "something is wrong."
  *   **Verdict:** **KEEP SEPARATE.**
  *   **Comment:** Do not try to merge these. There is no "fact of the matter" to anchor a merge. They are distinct concepts sharing a historical label. Merging them corrupts data analytics for both departments.

  ---

  ### 5. What This Procedure Cannot Do

  Be plain with the committee about the limits. This procedure is a semantic triage tool, not a policy solver.

  1.  **It Cannot Resolve Power Struggles:** If Billing *demands* to use the ICU definition to deny claims, this procedure says "Keep Separate," but Billing might override you. That is a political problem, not a semantic one.
  2.  **It Cannot Fix Bad Data:** If the ICU data is entered inconsistently, the Extension Test will fail. You can't semanticize your way out of garbage entry.
  3.  **It Cannot Define "Truth" for Social Constructs:** For terms like "Neglect" or "Wellness," the procedure will default to "Keep Separate." It cannot tell you which definition is *better*, only that they are *different*.
  4.  **It Assumes Rational Actors:** It assumes the "Action" mapped to a term is actually what happens. If clinicians ignore the protocol, the Action Test is theoretical.

  ### Summary for the Committee
  When you present, do not say "Externalism." Say this:
  > "We are testing three things: Do they identify the same patients? Do they trigger the same workflows? And are they measuring a biological fact or a departmental goal? If the answer to any of those is 'No,' merging the terms creates data errors and clinical risk."

  This grounds your philosophical rigor in their language of risk and governance.
