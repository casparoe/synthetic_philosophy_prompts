      *   *Query 26 (Bullion Gone):* Is it pure credit? Is it rhetorical? It's a mix. He's arguing for a National Bank (paper money) backed by land/industry, not gold. He's saying the *confidence* in the system allows the tickets to circulate even without the gold reserve. It's a proto-chartalist view (money is a creature of the state/accounting, not a commodity).

