      *   **User's Analogy:** Colored glass beads in a closed terrarium tracking nutrient credits between fungi and algae. Beads = markers, no nutritional value. Real wealth = photosynthetic output.
      *   **Constraints:** No reading lists, no footnotes, no "go read secondary sources." Plain language. Walk through queries 23-26 in order. Explain the "ticket to what?" question. Address the bead analogy (where it fits, where it breaks).
