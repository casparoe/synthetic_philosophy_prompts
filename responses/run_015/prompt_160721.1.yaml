answer: |-
  1. He would take this incoherence argument as a vindication of his own account, for it mirrors his empirical constraint that no idea can have meaning unless it is derived from a preceding impression.
  2. His verdict turns entirely on the copy principle, which dictates that any idea lacking a corresponding impression is merely an empty fiction of the imagination.
  3. He would refuse to grant the premise that a difference can constitute a fact of the matter if it yields no distinguishable impression in the mind.
  4. The missing shade pushes him away from the argument, because that concession admits the mind can conceive a qualitative distinction without a prior impression, though he dismisses this as too singular to overthrow his general rule.
  5. The rotation case helps the argument relative to an overnight swap, because the gradualness denies the mind the distinct impressions required to form the idea of difference. "The senses deliver only the present impression, leaving the imagination to feign the continuity."
