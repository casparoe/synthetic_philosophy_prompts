answer: |-
  **MEMORANDUM**

  **TO:** Board of Funders; Policy Directorate
  **FROM:** [Name Redacted] & [Name Redacted], Migration Ethics Reading Group
  **DATE:** October 26, 2023
  **SUBJECT:** Mapping the Normative Disagreement on Border Exclusion

  **1. Agreed Claims and Structural Mapping**

  After twelve months of debate, we submit this joint assessment. We agree on the following foundational propositions regarding the nature of border control and the limits of current evidence:

  1.  **Nature of Coercion:** We agree that border controls constitute coercion. They involve the threat of physical force or legal penalty to prevent identifiable individuals from crossing a geographic line. This coercion requires moral justification; it is not merely a passive failure to assist.
  2.  **Territorial Control:** We agree that a state's control over territory is distinct from private property ownership. While the state administers land, it does not own it in a manner that automatically grants the unrestricted rights of a homeowner to exclude guests.
  3.  **The Association Analogy:** We agree that comparing a state to a voluntary association (like a club) is useful but limited. It is useful because political communities share values and cultures; it is limited because citizenship is often involuntary (by birth) and states hold a monopoly on force that clubs do not.
  4.  **Empirical Limits:** We agree that empirical literature on wages, fiscal impacts, and institutional quality cannot settle the moral question. Data showing economic gain or loss does not prove a *right* to exclude or a *duty* to admit.
  5.  **Decomposition of the Right to Exclude:** We agree to analyze the "right to exclude" not as a single block, but as five distinct legal incidents (often called Hohfeldian incidents). We define these as:
      *   *Claim-right:* A demand that others not enter, creating a duty on them to stay out.
      *   *Power:* The ability to change legal relations (e.g., granting a visa).
      *   *Power post-entry:* The ability to set rules for those already inside.
      *   *Privilege:* The liberty to enforce exclusion without a duty to refrain from using necessary means.
      *   *Immunity:* Protection against outsiders invalidating the state's rules.

      **Signatories:** Author A (Discretionary View) endorses all five incidents as inherent to state sovereignty. Author B (Coercion View) endorses the *Power* incidents and *Immunity* (conditionally), but rejects the absolute *Claim-right* and *Privilege*, arguing they require specific justification per case.

  **2. Matrix of Disagreement**

  The following table locates our specific divergences. For each test case, we state our positions, agree on a test, and pre-commit to what evidence or outcome would count as our position being wrong.

  | Crux / Test Case | Author A (Discretionary) Position | Author B (Coercion View) Position | Agreed Test / Scenario | Falsification Condition (What changes our mind) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Non-Social Migrant**<br>(Trader/Transit only) | The state may exclude even those seeking no social integration, as membership terms are collective. | Exclusion is hard to justify if the migrant burdens no public goods and seeks no political membership. | A migrant seeks only to trade or transit a thinly populated region without contacting citizens. | **A:** If we cannot articulate a harm to self-determination beyond "presence." **B:** If we find that mere presence undermines cultural continuity without interaction. |
  | **2. Archipelago State**<br>(One island restricted) | If the state is a community, it can restrict access to specific parts of its territory to protect local culture. | If the justification is territorial ownership, restricting only one island reveals the motive is membership control, not property. | A state allows entry to the mainland but bans entry to a specific inhabited island. | **A:** If this policy is shown to violate internal freedom of movement norms we accept domestically. **B:** If we accept that sub-national communities have independent exclusion rights. |
  | **3. Sale of Slots**<br>(Alienability) | If exclusion is a property-like right, the state should be able to sell or lease admission slots to employers or other states. | If exclusion is a fiduciary duty (held in trust for citizens), selling slots corrupts the political relationship. | A state auctions 10% of annual visas to the highest bidding foreign government. | **A:** If this creates a market that undermines the state's long-term political integrity. **B:** If we find that selling slots actually increases welfare for the excluded without harming citizens. |
  | **4. Last Habitable Territory**<br>(Necessity) | Even in scarcity, the political community's survival takes precedence over the outsider's necessity. | If exclusion leaves the migrant with nowhere to go (death), the right to exclude is overridden by the right to life. | A world where only one territory remains habitable due to climate change. | **A:** If we concede that the right to life trumps the right to political self-determination. **B:** If we concede that admitting the migrant destroys the host community's viability. |
  | **5. Harm Responsibility**<br>(Push Factors) | Past harm creates a duty of compensation (aid), not necessarily a duty of admission (membership). | If the state caused the conditions forcing migration, it forfeits the right to exclude those specific victims. | A state's foreign policy demonstrably destabilizes a neighbor, creating refugees. | **A:** If compensation is proven insufficient to restore the victim's prior status. **B:** If admission is shown to harm the very citizens responsible for the policy. |
  | **6. Means of Enforcement**<br>(Proportionality) | If the right to exclude exists, the state may use necessary force (fencing, interception) to uphold it. | The right to exclude does not license any means; lethal or dangerous enforcement requires higher justification. | Interception of boats at sea resulting in drownings to prevent unauthorized landing. | **A:** If the deaths are deemed disproportionate to the administrative goal of border control. **B:** If we find that less coercive means are impossible to implement effectively. |

  **3. Assessment of Convergence**

  We must be honest about where this collaboration stops. Several of our disagreements rest on fundamental premises regarding state legitimacy and the value of political self-determination that neither of us can defend within the scope of this memo, nor concede without abandoning our core views.

  Author A rests on the premise that political communities are valuable goods in themselves, entitled to shape their character over time. Author B rests on the premise that all individuals possess equal moral worth that state boundaries cannot morally override without specific consent. These are not empirical disputes; they are foundational normative commitments.

  Consequently, there is no single empirical finding or case study that will resolve this debate. We will not find a wage statistic or a crime rate that tells us whether a state *ought* to exist as a closed association. However, we have achieved clarity on the *structure* of our disagreement. By decomposing the right to exclude, we have shown that Author B accepts significant state powers (visas, residency rules) while rejecting the absolute claim-right to keep people out. Author A accepts that coercion requires explanation but views it as inherent to the political form.

  **Verdict on Movement:**
  Does anything actually move the debate? Honestly, no. The disagreement is not about the application of shared principles, but about the principles themselves. However, this memo succeeds in preventing us from arguing past one another. We now know that when Author A speaks of "rights," they mean a bundle of five incidents, while Author B hears only a conditional privilege. We know that for Author B, the "Archipelago" case is the strongest lever to pry open the membership argument, while for Author A, the "Last Habitable Territory" case is the strongest stress test for the open borders argument.

  We recommend that policy staff treat these as distinct ethical frameworks rather than a single debate with a pending resolution. Future work should not seek to prove one side right, but to identify specific policy contexts (e.g., labor shortages vs. humanitarian crises) where one framework offers more actionable guidance than the other.

  **Signed,**

  [Name Redacted] & [Name Redacted]
