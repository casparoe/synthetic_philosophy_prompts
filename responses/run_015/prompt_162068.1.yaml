answer: |-
  ### The Decision Procedure: "The Money Sort"

  **Input:** Press release + 20-minute phone call with programme officer.
  **Constraint:** Do not use "should" or "owe" unless the specific *kind* of owing is established by the output.

  **Step 1: The Quid Pro Quo Filter (Obligation Laundering Check)**
  *Ask:* Is there a specific, tangible service or policy change the recipient provides in direct exchange for this money? (e.g., border control, voting alignment, tax haven status).
  *   **Yes:** Label: **Transaction**.
      *   *Action:* Stop. Describe the mechanics literally (price, service, vendor). Do not use duty language. Do not ask if the price is "fair" in moral terms, only market terms.
      *   *Reasoning:* This is a purchase. Calling it "aid" or "duty" launders a commercial contract as a moral act.
  *   **No:** Proceed to Step 2.

  **Step 2: The Agency Filter (Name-on-the-Good Test)**
  *Ask:* Who defines the specific outcome, selects the contractors, and sets the success metrics?
  *   **Donor defines:** Label: **Procurement**.
      *   *Action:* The donor is buying a specific good (e.g., "vaccinations," "school buildings") using the recipient's territory as a supply chain.
      *   *Reasoning:* Even if the money is "gifted," the power dynamic is contractual. The donor owns the moral credit for the outcome.
  *   **Recipient defines:** Label: **Transfer**.
      *   *Action:* Proceed to Step 3.

  **Step 3: The Causality Filter (Remedial vs. Assistance)**
  *Ask:* Does the payer explicitly link the payment to a specific harm they caused (legal admission, treaty obligation, public acknowledgment of liability)?
  *   **Yes (Specific Harm):** Label: **Restitution**.
      *   *Action:* You may use "owe" in the *remedial* sense (debt for damage).
      *   *Undecidable Flag:* If the link relies on "historical sin" or "collective guilt" without legal/policy admission, flag as **Contested Restitution**. You may not assert the debt exists; you may only report the payer's assertion.
  *   **No (General Need):** Label: **Assistance**.
      *   *Action:* You may use "owe" only in the *general duty* sense (Singer-style capacity to assist), but must note this is voluntary benevolence, not justice.

  ***

  ### Test Cases

  **1. The Colonial Maternal Health Programme**
  *   **Step 1:** No direct service bought from recipient gov. (Pass)
  *   **Step 2:** Donor's contractors, donor's indicators. (**Procurement**)
  *   **Step 3:** Timing follows court ruling, but press release cites "partnership," not liability. (**Contested Restitution**)
  *   **Output:** **Compensatory Procurement.**
  *   **Analysis:** You previously called this "reparations-adjacent." The procedure says: No. Because the donor retains control of the good, they are purchasing a service to soothe liability, not discharging a debt. The recipient is a vendor, not a claimant. This aligns with your reader's critique: controlled money is less reparative than cash.

  **2. The Asylum-Hosting Payment**
  *   **Step 1:** Money exchanged for hosting centres and deportation flights. (**Transaction**)
  *   **Output:** **Transaction.** Stop.
  *   **Analysis:** **This is the "Soft" Case.** You have likely hammered these deals as "shirking duty" or "human rights violations." The procedure forces you to classify this as a market purchase. If you accept this label, you cannot argue they are *violating a duty* by outsourcing; you can only argue the *price* (in human welfare) is too low. You lose the moral high ground of "justice" and are stuck arguing "value for money." It makes you look soft on the principle that asylum is a right, not a service.

  **3. The Private Foundation Cash Transfers**
  *   **Step 1:** No quid pro quo. (Pass)
  *   **Step 2:** Recipient decides spend. (**Transfer**)
  *   **Step 3:** No harm cited; need cited. (**Assistance**)
  *   **Output:** **Solidarity Assistance.**
  *   **Analysis:** You previously called this "charity." The procedure upgrades this slightly. Because the recipient defines the good, the power imbalance is lower than in Procurement. It is still Assistance (not Restitution), but it respects agency.

  ***

  ### Limitations & Concept Audit

  **What the Procedure Cannot Do**
  1.  **Multi-Donor Trust Funds:** If five donors pool money into a UN fund, Step 2 (Agency) breaks. You cannot determine whose name is on the good. *Instruction:* Label "Pooled Procurement" and default to Step 3 based on the fund's mandate.
  2.  **Concessional Lending:** Is a low-interest loan a "Transfer" or a "Transaction" (buying future debt service)? The procedure treats grants only. *Instruction:* For loans, add Step 0: "Is this repayable?" If yes, label "Investment" or "Debt," not Duty.
  3.  **Metaphysical Debt:** The procedure cannot settle whether a modern nation *actually* owes for colonial sins. It only tracks whether the *payer* asserts that link. If they don't, you cannot use "Restitution" without violating the house rule on "owe."

  **Concept Audit: Load-Bearing vs. Hobbyhorses**
  1.  **Remedial vs. Assistance (Load-Bearing):** Essential. This distinguishes Justice (Restitution) from Benevolence (Assistance). Without this, all money looks like charity, or all money looks like guilt. Keep.
  2.  **Name-on-the-Good (Load-Bearing):** Essential. This distinguishes Power (Procurement) from Agency (Transfer). This solves your inconsistency problem: cash transfers (high agency) are morally distinct from contractor-led health programmes (low agency), regardless of the dollar amount. Keep.
  3.  **Obligation Laundering (Load-Bearing, but renamed):** This is your strongest tool, but it is simply a specific application of Step 1 (Quid Pro Quo). "Laundering" implies intent to deceive, which is hard to prove in 20 minutes. *Recommendation:* Drop the term "Laundering" for the checklist; use **Transaction**. It is more neutral and easier to verify. Save "Laundering" for the column text when you have proof of bad faith.

  **Final Note:** The procedure protects you from the "should/owe" rule by forcing you to identify the *source* of the obligation before you name it. If the source is a contract, it's a price. If the source is harm, it's a debt. If the source is capacity, it's a choice.
