answer: |-
  This is a classic frustration when reading Lewis. The word "arbitrary" does a lot of heavy lifting in *Convention*, but it is a technical term of art that gets conflated with its colloquial meaning (capricious, unimportant, random). When people use "conventions are arbitrary" to shut down a debate about driving sides, they are usually smuggling in a normative claim under the guise of a descriptive one.

  Here is the menu of precise claims hidden behind that one-liner, ranked from trivial to radical, with an assessment of their truth value and Lewis's stance.

  ### 1. The "Indifference of Nature" Claim
  *   **The Claim:** "There is no intrinsic physical or moral property that makes driving on the right better than driving on the left."
  *   **Status:** **Platitude / Lewisian Thesis.**
  *   **Analysis:** This is the core of Lewis's definition. For a regularity to be a convention, there must be at least one *alternative regularity* that would have solved the coordination problem equally well. If nature dictated that humans could only survive driving on the right, it wouldn't be a convention; it would be a law of biology.
  *   **Lewis's View:** Lewis explicitly endorses this. A convention requires a "proper alternative."

  ### 2. The "Origin Story" Claim
  *   **The Claim:** "The historical reason we ended up with Right rather than Left was accidental or contingent (e.g., Napoleon, carriage whip hands), not rational."
  *   **Status:** **Likely True (Historically), but Lewis is Agnostic.**
  *   **Analysis:** This claims that the *selection mechanism* was arbitrary. Lewis doesn't care much about the history; he cares about the current equilibrium. However, this is often what people mean when they say "it's arbitrary."
  *   **Lewis's View:** Lewis focuses on the *maintenance* of the convention via mutual expectations, not the genesis. He would agree the selection was contingent, provided the alternative was available.

  ### 3. The "Switchability" Claim
  *   **The Claim:** "Because it is arbitrary, we could swap to the other option anytime we wanted without significant cost."
  *   **Status:** **False.**
  *   **Analysis:** This is the most common error. Just because the *solution* is arbitrary doesn't mean the *equilibrium* is fragile. Once a convention is established, the cost of switching (coordination costs, accidents during transition) makes it highly non-arbitrary in practice.
  *   **Lewis's View:** Lewis would reject this. Conventions create **normative pressure** to conform. Once the expectation is set, it is rational to follow it, even if the alternative was equally good *ex ante*. The "arbitrariness" applies to the choice between equilibria, not the choice to exit an equilibrium.

  ### 4. The "No Best Answer" Claim
  *   **The Claim:** "There is no fact of the matter about which convention is superior, so arguing for one over the other is pointless."
  *   **Status:** **Mostly True, but with Caveats.**
  *   **Analysis:** In pure coordination games (like driving sides), the payoff is identical for both equilibria. However, in impure coordination games (like language), one convention might be slightly more efficient than another.
  *   **Lewis's View:** Lewis acknowledges that conventions can evolve toward better equilibria, but often get stuck in "suboptimal" ones due to path dependence. So, arguing that one *could* be better isn't pointless, but arguing that one *is* objectively right (independent of coordination) is.

  ### 5. The "Normative Nihilism" Claim
  *   **The Claim:** "Because the convention is arbitrary, it generates no real obligation. Violating it is not 'wrong,' just unexpected."
  *   **Status:** **Radical / Misleading.**
  *   **Analysis:** This is usually the claim doing the work when someone wants to justify breaking a rule. It conflates *moral* obligation with *rational* obligation.
  *   **Lewis's View:** Lewis is careful here. Conventions generate **reasons for action**. If you drive on the left in a right-driving country, you are acting irrationally (endangering yourself and others) given the mutual expectations. It may not be a *moral* sin in a vacuum, but within the system of conventions, it is a violation of rational norms.

  ### 6. The "Ungroundedness" Claim
  *   **The Claim:** "Conventions float free of reality; they don't hook onto anything real beyond our own heads."
  *   **Status:** **False.**
  *   **Analysis:** This is the claim you encountered in the thread. It suggests conventions are unmoored from the world.
  *   **Lewis's View:** Lewis would strongly disagree. Conventions hook onto **Coordination Problems**, which are very real features of the world (e.g., physics dictates cars crash if they occupy the same space). The *solution* is arbitrary, but the *problem* is objective.

  ---

  ### Which Reading Is Doing the Work?

  When someone says "conventions are arbitrary" to shut down a debate about driving sides, they are usually deploying a hybrid of **Claim 1** and **Claim 5**.

  *   **The Rhetorical Move:** They are trying to move the goalposts from **Practical Rationality** (what keeps us safe) to **Intrinsic Value** (what is morally/physically best).
  *   **The Implication:** "You cannot argue that Right is *better* than Left, therefore your preference is merely subjective."
  *   **The Error:** They ignore that while the *choice* was arbitrary, the *adherence* is now mandated by safety and rationality. They use the arbitrariness of the *origin* to deny the necessity of the *result*.

  ### Lewis's Technical Definition of "Arbitrary"

  To really understand Lewis, you have to see that "arbitrary" is a **condition**, not just a description. For Lewis, $R$ is a convention only if:
  1.  Everyone conforms to $R$.
  2.  Everyone expects everyone else to conform to $R$.
  3.  Everyone prefers to conform to $R$ *on the condition that* others do.
  4.  **There is an alternative regularity $R'$ such that if everyone expected $R'$, everyone would prefer to conform to $R'$.**

  Claim 4 is the "arbitrariness" condition. It means the problem itself does not dictate the solution.

  ### Summary Table

  | Claim | Precise Meaning | Verdict | Lewis's Stance |
  | :--- | :--- | :--- | :--- |
  | **Indifference** | Nature doesn't prefer Right over Left. | **True (Platitude)** | **Endorsed** (Required for convention) |
  | **Switchability** | We can change sides easily. | **False** | **Rejects** (Equilibria are sticky) |
  | **Necessity** | We don't need a convention at all. | **False** | **Rejects** (Coordination is required) |
  | **Normativity** | Breaking the rule isn't "wrong." | **Radical/False** | **Nuanced** (It's irrational, if not immoral) |
  | **Ungroundedness** | Conventions don't hook to reality. | **False** | **Rejects** (They solve real problems) |

  ### How to Respond to the Thread
  If you want to reply to that thread without just quoting Lewis back at them, the point to make is:

  > "The *selection* of the convention is arbitrary, but the *constraint* it imposes is real. Saying 'driving on the right is arbitrary' is true in the sense that we could have started with left. But it is false to imply that, having settled on right, driving on the left is a valid option. The arbitrariness lies in the history, not in the current rational obligation."

  This distinguishes the **metaphysical status** of the rule (contingent) from the **practical status** of the rule (binding). Lewis's whole project is explaining how we get from the former to the latter without a social contract.
