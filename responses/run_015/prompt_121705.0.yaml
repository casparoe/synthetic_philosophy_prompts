  # SPECIFICATION DOCUMENT: CRITERIA FOR ADEQUATE RECONSTRUCTION OF MAIMONIDEAN SACRIFICIAL THEORY

  **Subject:** Philosophical Reconstruction of Maimonides' Position on Animal Sacrifice
  **Context:** Graduate Seminar in Medieval Philosophy and Religion
  **Core Problem:** The Sacrificial Persistence Problem (SPP)
  **Status:** Formal Desiderata for Evaluation

  ## 1. PREAMBLE AND SCOPE

  This document specifies the necessary and sufficient conditions for any philosophical reconstruction of Moses Maimonides' position on animal sacrifice (*korbanot*). The reconstruction must address the **Sacrificial Persistence Problem (SPP)**: the apparent contradiction between the anthropological-genetic explanation of sacrifice found in *The Guide of the Perplexed* (hereafter *Guide*)—wherein sacrifice is presented as a historical concession to idolatrous habit—and the legal codification in the *Mishneh Torah* (hereafter *Code*), wherein sacrificial law is treated as permanently binding, detailed, and restorable.

  An adequate reconstruction must not dissolve this tension via textual dismissal (e.g., claiming one text represents the "true" view while the other is merely exoteric cover). Instead, it must articulate a coherent theoretical framework that accommodates both the historical contingency of the institution's origin and the ontological permanence of its legal status.

  The following desiderata are categorized by structural layer. Each requirement is marked as **[NON-NEGOTIABLE]** (required for textual fidelity and systemic consistency) or **[CAMP PREFERENCE]** (reflecting specific interpretive traditions).

  ---

  ## 2. STRUCTURAL LAYER I: THE ANTHROPOLOGICAL-GENETIC LAYER

  *This layer concerns the etiology of the commandment. It must explain why sacrifice was instituted without rendering it obsolete.*

  **Desideratum 1.1: The Accommodation Mechanism**
  The reconstruction must specify the psychological or sociological mechanism by which sacrifice functioned as a transition from idolatry to monotheism. It must explain how the *form* of idolatrous worship was retained while the *object* of worship was shifted.
  *   **Motivating Consideration:** *Guide* III:32 explicitly states the divine wisdom (*ḥikmah*) did not initially demand the abolition of sacrifice because human nature (*tabiʿah*) could not bear such a sudden transition.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 1.2: Non-Obsolescence Condition**
  The reconstruction must explain why the accommodation does not become obsolete once the historical condition (habituation to idolatry) is removed. It cannot treat the commandment as a "medicine" that is discarded once the "disease" (idolatry) is cured, unless it posits a recurring or permanent aspect of the human condition that necessitates the "medicine."
  *   **Motivating Consideration:** If sacrifice were merely a temporary cure for ancient idolatry, its codification as eternal law in the *Code* would be deceptive or irrational.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 1.3: Divine Intent vs. Human Capacity**
  The reconstruction must distinguish between the *primary intention* of the Law (intellectual apprehension/cessation of idolatry) and the *secondary intention* (the specific ritual acts). It must clarify whether the secondary intention possesses intrinsic value or is purely instrumental.
  *   **Motivating Consideration:** *Guide* III:28 distinguishes between *ḥukkim* (statutes) whose utility is not obvious and *mishpatim* (judgments) whose utility is clear. Sacrifice often falls into the former, yet serves the latter.
  *   **Status:** **[NON-NEGOTIABLE]**

  ---

  ## 3. STRUCTURAL LAYER II: THE LEGAL-PERMANENCE LAYER

  *This layer concerns the deontic status of the law. It must explain the binding force of sacrificial law in the absence of the Temple and its potential restoration.*

  **Desideratum 2.1: The Binding Force Criterion**
  The reconstruction must account for the deontic status of sacrificial laws during the exile. It must explain in what sense these laws remain "commandments" (*mitzvot*) when they cannot be physically performed, without reducing them to mere memorial exercises.
  *   **Motivating Consideration:** Maimonides codifies laws of sacrifice that are currently inapplicable with the same rigor as applicable laws.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 2.2: The Prayer Substitution Limit**
  The reconstruction must rigorously maintain the distinction that prayer (*tefillah*) substitutes for sacrifice only *de facto* (due to Temple destruction), not *de jure* (in principle). Prayer cannot be presented as a superior or equivalent spiritual technology that renders sacrifice spiritually redundant.
  *   **Motivating Consideration:** Maimonides states prayer is established *in place of* sacrifices due to exile, implying sacrifices remain the normative ideal for divine service when possible.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 2.3: Immutability of Divine Law**
  The reconstruction must remain consistent with the principle that divine law does not change essentially. It cannot posit that God "changed His mind" regarding the value of sacrifice between the giving of the Torah and the messianic era.
  *   **Motivating Consideration:** Maimonidean jurisprudence rejects the notion of abrogation or essential change in the Torah's commandments.
  *   **Status:** **[NON-NEGOTIABLE]**

  ---

  ## 4. STRUCTURAL LAYER III: THE METAPHYSICAL-SYMBOLIC LAYER

  *This layer concerns the specific details of the ritual. It must assign meaning to the ritual constraints without importing anachronistic ethics.*

  **Desideratum 3.1: Symbolic Weight of Particulars**
  The reconstruction must determine whether the specific conditions of the sacrificial animal (species, domestic status, physical perfection, age) carry symbolic weight relating to the subordination of human appetite to intellect, or whether they are purely conventional legal markers. If symbolic, the symbolism must be articulated.
  *   **Motivating Consideration:** *Guide* III:46 discusses the selection of specific animals to counteract specific idolatrous practices, but also hints at the perfection required of the offerer.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 3.2: The Animal Welfare Constraint**
  The reconstruction **must not** attribute to Maimonides a concern for animal suffering or individual animal welfare that conflicts with his Aristotelian hierarchy. It cannot argue that sacrifice was limited to minimize pain to animals in a modern ethical sense. Particular providence extends only to rational beings.
  *   **Motivating Consideration:** Maimonides explicitly denies that God cares for individual non-rational animals (*Guide* III:17). Any reading suggesting Maimonides sought to protect animals *for their own sake* contradicts his metaphysics.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 3.3: Intellect over Imagination**
  The reconstruction must show how the physical act of sacrifice serves to train the imagination to submit to the intellect. The ritual must be shown as a tool for human psychological ordering, not as a transaction satisfying a divine need.
  *   **Motivating Consideration:** The ultimate goal of the Law is the perfection of the human intellect and the cessation of false opinions.
  *   **Status:** **[NON-NEGOTIABLE]**

  ---

  ## 5. EXOTERIC/ESOTERIC DISTINCTION

  *This layer concerns the hermeneutic relationship between the pedagogical explanation and the legal reality.*

  **Desideratum 4.1: Relation of Surface to Depth**
  The reconstruction must preserve the distinction between the exoteric pedagogical function (*taʿlīm*) and the esoteric ontological or legal status. It must specify how the two relate: whether as surface and depth, as complementary descriptions, or as genuinely unresolved commitments. It must not collapse them into a single univocal meaning.
  *   **Motivating Consideration:** Maimonides explicitly writes the *Guide* to resolve perplexities arising from the literal sense of the Law.
  *   **Status:** **[NON-NEGOTIABLE]**

  **Desideratum 4.2: Accessibility of Reasons**
  The reconstruction must remain consistent with the claim that the reasons for commandments are in principle accessible to human reason, even when unknown in detail. It cannot retreat into a fideistic claim that sacrifice is purely a divine decree with no rational structure.
  *   **Motivating Consideration:** Maimonides insists that every commandment has a cause and a purpose (*Guide* III:26).
  *   **Status:** **[NON-NEGOTIABLE]**

  ---

  ## 6. ANALYSIS OF JOINTLY UNSATISFIABLE PAIRS

  *The following pairs of desiderata represent tension points where satisfying one criterion may logically preclude satisfying the other, revealing the limits of reconstruction.*

  **Tension Pair A: The Exhaustive Concession vs. Legal Permanence**
  *   **Conflict:** **Desideratum 1.1 (Accommodation Mechanism)** vs. **Desideratum 2.3 (Immutability of Divine Law).**
  *   **Analysis:** If sacrifice exists *solely* to cure a now-cured psychological defect (Exhaustive Concession Thesis), then its permanent binding force (Legal Permanence Thesis) implies God commands an unnecessary act. If the act is permanently binding, the "cure" cannot be the *sole* reason for its institution.
  *   **Verdict:** These are likely **Jointly Unsatisfiable** under a strict literal reading. A successful reconstruction must moderate the "Exhaustive" claim, positing that the "accommodation" tapped into a permanent human need (e.g., the need for physical action to cement belief) rather than a transient historical error.

  **Tension Pair B: Robust Symbolism vs. Animal Welfare Constraint**
  *   **Conflict:** **Desideratum 3.1 (Symbolic Weight)** vs. **Desideratum 3.2 (Animal Welfare Constraint).**
  *   **Analysis:** Many modern readings attempt to find ethical symbolism in the treatment of the animal (e.g., "quick death," "perfect health" implies respect for life). However, **Desideratum 3.2** forbids attributing intrinsic value to the animal's welfare.
  *   **Verdict:** **Jointly Satisfiable only under strict conditions.** The symbolism must be entirely anthropocentric (e.g., the perfection of the animal symbolizes the perfection required of the *human* intellect), not zoocentric. Readings that suggest Maimonides limits sacrifice to spare animal pain fail **Desideratum 3.2**.

  **Tension Pair C: Pedagogical Lie vs. Truth of Law**
  *   **Conflict:** **Desideratum 4.1 (Surface/Depth)** vs. **Desideratum 2.1 (Binding Force).**
  *   **Analysis:** If the anthropological explanation in the *Guide* is the "truth" and the legal permanence in the *Code* is merely "surface," the law risks becoming a "noble lie." If the law is binding, the "surface" cannot be false.
  *   **Verdict:** **Jointly Unsatisfiable** for Esoteric-Symbolic camps that treat the *Guide*'s explanation as a complete replacement for the *Code*'s authority.

  **Most Damaging Requirement:**
  **Desideratum 3.2 (The Animal Welfare Constraint)** does the most damage to currently dominant readings. A significant portion of contemporary scholarship attempts to recuperate Maimonides as a proto-animal ethicist to make the practice palatable to modern sensibilities. This desiderata explicitly forbids that move, forcing the interpreter to confront the harsh Aristotelian reality of Maimonides' metaphysics: the animal is a tool for human perfection, not a subject of divine care.

  ---

  ## 7. EVALUATION OF INTERPRETIVE CAMPS

  *The following table scores the three main interpretive camps against the Non-Negotiable desiderata. Scores are qualitative estimates of fidelity.*

  | Desideratum | Concessive-Pedagogical Camp | Legal-Formalist Camp | Esoteric-Symbolic Camp |
  | :--- | :--- | :--- | :--- |
  | **1.1 Accommodation Mechanism** | **High.** Centers the historical concession thesis. | **Low.** Often minimizes the historical contingency. | **Medium.** Accepts it but seeks deeper symbolic layers. |
  | **1.2 Non-Obsolescence** | **Fail.** Struggles to explain why the "cure" remains binding after the "disease" is gone. | **High.** Affirms permanence by fiat of legal code. | **High.** Posits eternal symbolic necessity. |
  | **2.1 Binding Force** | **Low.** Tends to view the law as functionally obsolete. | **High.** Treats the *Code* as the primary authority. | **Medium.** Binding due to hidden metaphysical utility. |
  | **2.2 Prayer Substitution** | **Medium.** Often implies prayer is spiritually superior. | **High.** Maintains strict hierarchy (Sacrifice > Prayer). | **High.** Maintains hierarchy based on ontological efficacy. |
  | **3.2 Animal Welfare Constraint** | **Fail.** Often imports modern ethical concerns to soften the blow. | **High.** Treats animal status as purely legal convention. | **Medium.** Risks attributing symbolic sanctity to the animal. |
  | **4.1 Exoteric/Esoteric** | **High.** Distinguishes the "reason" from the "law." | **Low.** Often collapses the two into a single legal reality. | **High.** Explicitly structures the distinction. |
  | **Overall Viability** | **Low.** Fails the Sacrificial Persistence Problem (Layer 2). | **Medium.** Solves Layer 2 but ignores Layer 1 (Guide). | **High.** Best positioned to solve SPP, provided it respects 3.2. |

  ### Camp-Specific Vulnerabilities

  1.  **Concessive-Pedagogical:** This camp satisfies Layer 1 but collapses under Layer 2. It cannot explain why Maimonides would codify a practice he considers historically obsolete without implying the *Code* is deceptive. It violates **Desideratum 2.3 (Immutability)**.
  2.  **Legal-Formalist:** This camp satisfies Layer 2 but ignores Layer 1. It treats the *Guide*'s explanation as secondary or irrelevant, failing to engage with Maimonides' explicit philosophical project. It risks violating **Desideratum 4.2 (Accessibility of Reasons)** by treating sacrifice as a pure decree without rational accommodation.
  3.  **Esoteric-Symbolic:** This camp is the strongest candidate for resolving the SPP but is most vulnerable to **Desideratum 3.2 (Animal Welfare Constraint)**. In seeking deep symbolic meaning, it often inadvertently attributes a sanctity to the animal or the act of killing that conflicts with Maimonides' denial of particular providence for animals. It must ensure the symbolism remains strictly anthropocentric.

  ## 8. CONCLUSION ON RECONSTRUCTIVE LIMITS

  No reconstruction can satisfy every legitimate constraint simultaneously without modification. Specifically, the tension between the **historical contingency** of the *Guide* and the **ontological permanence** of the *Code* suggests that Maimonides' position may not be a unified systematic theory but a dialectical holding pattern.

  However, an adequate reconstruction must not exploit this ambiguity to dismiss texts. It must explicitly state which Desideratum is being prioritized and acknowledge the cost. The **Non-Negotiable** status of **Desideratum 3.2** serves as the primary filter: any reading that makes Maimonides concerned with the animal's subjective experience is to be rejected as anachronistic, regardless of its success in resolving the Sacrificial Persistence Problem. The reconstruction must demonstrate that the persistence of sacrifice is for the sake of the *human* intellect, permanently requiring the discipline of physical submission, even if the original historical trigger (idolatry) has vanished.
