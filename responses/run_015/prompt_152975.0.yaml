answer: |-
  ### Strategic Agenda: Resolving Bottlenecks in Lexical-Threshold Negative Utilitarianism

  **Executive Summary**
  Your team's composition (two welfare philosophers, one decision theorist, one formal ethicist) is uniquely suited to tackle the *structural* and *axiomatic* problems of lexical-threshold negative utilitarianism (LTNU). However, the risk is drifting into meta-ethical abstraction or applied AI engineering, neither of which resolves the core conceptual bottleneck: **the formal coherence of lexical incomparability.**

  The following agenda ranks the four lines of inquiry based on logical dependency, tractability given your non-empirical constraints, and the "critical path" status of each question. Line 3 is the primary bottleneck; Lines 1, 2, and 4 are contingent upon its resolution or parameterization.

  ---

  ### 1. Primary Research Stream: The Formal Representation of Incomparability (Line 3)
  **Rank:** #1 (Critical Path)
  **Focus:** Determine if "sub-threshold pleasure" vs. "above-threshold pain" can be modeled as *genuinely incomparable* without collapsing into cardinal utilitarianism (where pain is just "very heavy") or triviality (where the threshold is arbitrary).

  **Reasoning for Priority:**
  This is the definition of the view. If lexicality cannot be formally distinguished from extreme cardinal weighting, the theory is not a distinct alternative to standard utilitarianism; it is merely a rhetorical stance. Your decision theorist and formal ethicist are the scarce resources here; standard welfare philosophy cannot solve this alone. It requires axiomatic modeling of value structures that violate standard Archimedean properties without becoming incoherent.

  **Tractability:** High. This is pure formal ethics and decision theory. It requires no empirical data, only logical consistency and axiomatic derivation.

  **Dependencies:**
  *   **Downstream:** Lines 1, 2, and 4 all depend on the output of Line 3. You cannot aggregate values (Line 1), weight risks (Line 2), or select metrics (Line 4) until you define the *logical relation* between the values being aggregated, weighted, or measured.
  *   **Upstream:** Line 4 (Metric) constrains the *inputs* of Line 3, but Line 3 determines the *structure*. You can run Line 3 models on hedonic inputs or preference inputs; the structural problem of lexicality remains the same.

  **Dead End Warning:**
  Avoid getting stuck on the phenomenology of "pain." The prompt explicitly rules out neuropsychology. The team must treat "pain" and "pleasure" as formal variables with defined properties, not empirical phenomena. If the group begins debating the *nature* of suffering rather than its *value structure*, they have left the tractable zone.

  ---

  ### 2. Foundational Constraint: The Welfare Metric (Line 4)
  **Rank:** #2 (Parameter Setting)
  **Focus:** Determine whether the commensurability problem is intrinsic to *cardinal welfare* or if shifting to preference/capability metrics dissolves the lexical threshold problem.

  **Reasoning for Priority:**
  This is ontologically upstream of Line 3 but strategically secondary. If the metric changes, the variables in Line 3 change (e.g., "pain" becomes "frustrated critical interest"). However, pursuing this as the *primary* line is a risk: it can devolve into a general meta-ethical debate unrelated to the specific bottlenecks of LTNU. It should be treated as a boundary condition. The two welfare philosophers should lead this, but their output must be delivered as *parameters* for the formal modelers in Line 3.

  **Dependencies:**
  *   **Downstream:** Line 3. The formal model must be built using the ontology agreed upon here.
  *   **Upstream:** None. This is a foundational choice.
  *   **Interaction with Line 3:** If Line 4 concludes that preference metrics *dissolve* the problem (e.g., by making all value ordinal), Line 3 becomes trivial. If Line 4 concludes the problem *relocates* (e.g., lexical thresholds appear in capability deprivation too), Line 3 remains the critical bottleneck.

  **Reordering Condition:**
  If the Line 3 team produces a robust **impossibility theorem** (demonstrating that *no* coherent formal representation of lexical thresholds exists under standard rationality axioms), Line 4 immediately jumps to Rank #1. The only way to save the theory would be to change the metric to one that escapes the axioms of the impossibility proof.

  ---

  ### 3. Structural Scope: Intra- vs. Inter-Personal Aggregation (Line 1)
  **Rank:** #3 (Aggregation Consequence)
  **Focus:** Determine if lexical priority applies within a single life or across populations, and whether mixing scopes breaks aggregation rules (e.g., creating cycles or non-transitive social orderings).

  **Reasoning for Priority:**
  This is the "social choice" phase of the project. It is downstream of Line 3 because you cannot aggregate what you have not defined. It is highly tractable for your formal ethicist and decision theorist once Line 3 provides the value function. This line addresses the "sadistic conclusion" and "negative conclusion" problems that typically plague negative utilitarianism.

  **Dependencies:**
  *   **Downstream:** Line 2. Risk calculations differ fundamentally depending on whether the agent is minimizing risk for a single individual or a population.
  *   **Upstream:** Line 3. You need the formal representation of the threshold to test how it behaves under aggregation.
  *   **Dependency on Line 4:** The metric chosen in Line 4 determines whether interpersonal comparisons are even possible (e.g., capability sets are harder to compare inter-personally than hedonic states).

  **Dead End Warning:**
  Do not attempt to solve the "problem of identity" (who counts as a person across time). This is a metaphysical rabbit hole. Treat "persons" as distinct loci of value for the sake of the aggregation model.

  ---

  ### 4. Modal/Application: Threshold Triggers and Risk (Line 2)
  **Rank:** #4 (Operational Consequence)
  **Focus:** Analyze whether the threshold is triggered by experienced suffering or risk-weighted potential suffering, and the implications for artificial-agent decision architecture.

  **Reasoning for Priority:**
  This is the most downstream line. It asks how the theory functions under uncertainty and implementation. It is ranked last because it is entirely dependent on the outputs of Lines 1, 3, and 4. If the value structure (Line 3) is incoherent, risk calculations are meaningless. If the scope (Line 1) is undefined, the agent doesn't know whose risk to minimize.

  **Tractability:** Medium. The decision theorist is essential here. However, this line carries the highest risk of scope creep into engineering.

  **Dependencies:**
  *   **Upstream:** Lines 1, 3, and 4.
  *   **Critical Dependency:** If Line 1 settles on "Intra-personal only," Line 2 becomes a theory of individual rationality, not social ethics. If Line 3 settles on "Incomparability," Line 2 must use non-expected utility models (e.g., lexical decision rules).

  **Dead End Warning:**
  **"Artificial-Agent Design" is a trap.** Given your constraint against empirical work, your team cannot design agent architectures. This line must be strictly limited to **decision-theoretic implications**. If the group starts discussing sensor fidelity, compute constraints, or alignment protocols, they have left the conceptual space. Frame this strictly as: "What decision rule follows from the axioms derived in Line 3?"

  ---

  ### Dependency Map & Reordering Triggers

  | If Line... | Is Settled As... | Then Line... | Becomes... | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **3 (Formal)** | **Impossible** (Collapse proven) | **4 (Metric)** | **Priority #1** | The only way to save the view is to change the ontology of value to escape the impossibility proof. |
  | **3 (Formal)** | **Coherent** | **1 (Scope)** | **Easier** | Aggregation rules can be directly applied to the proven value structure. |
  | **4 (Metric)** | **Preference-Based** | **3 (Formal)** | **Harder** | Preference satisfaction often resists lexical thresholds more than hedonic states; the formal model must be rebuilt. |
  | **1 (Scope)** | **Intra-Personal Only** | **2 (Risk)** | **Moot (Social)** | The theory ceases to be a population ethic; AI design implications shift from social welfare to individual fiduciary duty. |

  ### Two-Year Milestone for Reordering
  **The Impossibility Check:**
  By the end of Year 2, the Formal Ethicist and Decision Theorist must produce a draft proof regarding the stability of the lexical threshold under standard rationality axioms (e.g., continuity, independence).
  *   **Scenario A:** The proof shows lexical thresholds are formally coherent under specific conditions. **Maintain Agenda.** Proceed to Line 1 (Aggregation).
  *   **Scenario B:** The proof shows lexical thresholds inevitably collapse into cardinality or lead to cyclic preferences under any plausible metric. **Reorder Agenda.** Line 4 (Metric) becomes the primary focus, as the team must search for a non-standard metric (e.g., non-Archimedean value spaces) to salvage the theory.

  ### Final Advisory Note
  Your team's greatest asset is the **Formal Ethicist + Decision Theorist** pairing. Most work on negative utilitarianism is purely philosophical. By prioritizing **Line 3 (Formal Representation)**, you leverage your unique comparative advantage. Do not let the Welfare Philosophers dominate the agenda with Line 4 (Metric) debates, which are well-trodden ground. The novel contribution of this working group must be the *logic of the threshold*, not the *nature of the welfare*. Keep Line 2 (AI/Risk) strictly theoretical to avoid empirical drift.
