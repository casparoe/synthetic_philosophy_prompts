answer: |-
  # Adequacy Conditions for Theories of Causation by Omission

  To evaluate competing analyses of negative causation, a theory must satisfy a set of rigorous desiderata. These conditions ensure the theory captures intuitive judgments in standard liability cases, handles complex multi-agent scenarios, accommodates systemic failures, and avoids metaphysical or normative absurdities. The following specification outlines five core desiderata, paired with their motivating scenarios, necessity status for responsibility-grounding, and associated tensions.

  ## I. Core Desiderata

  ### 1. The Liability Constraint (The Clinical Omission)
  *   **Motivating Scenario:** A physician fails to administer an available antidote to a patient suffering from a known toxin, and the patient dies.
  *   **Requirement:** The theory must classify the physician's inaction as a cause of death, distinct from the toxin itself, without requiring a positive physical energy transfer from the physician to the patient.
  *   **Status for Responsibility:** **Non-negotiable.** Any theory intended to ground legal or medical negligence must affirm causation here; denying it renders liability for non-feasance impossible.
  *   **Tension Flag:** High. Affirming causation here risks opening the door to the Proliferation Problem (see Desideratum 4). If the physician's *not-acting* causes death, why does the bystander's *not-acting* not also cause death?

  ### 2. The Conjunctive Sufficiency Constraint (The Joint-Protocol Double Omission)
  *   **Motivating Scenario:** Two security gatekeepers are required by protocol to each verify a code before a door opens. Both fail to verify. The door remains closed, trapping occupants who subsequently perish. Neither failure alone was sufficient to keep the door closed (had one checked, the door would have opened), but the joint failure ensured the harm.
  *   **Requirement:** The theory must identify the *combination* of omissions as causal without falsely attributing full sufficiency to either individual omission in isolation. It must handle "underdetermination" where the sum of parts creates the causal block.
  *   **Status for Responsibility:** **Non-negotiable.** Collective responsibility in bureaucratic or safety-critical systems depends on the ability to trace harm to distributed failures.
  *   **Tension Flag:** Moderate. This strains simple counterfactual accounts (since the harm would have occurred even if Agent A had acted, provided Agent B did not). It requires a model sensitive to conjunctive variables.

  ### 3. The Institutional Baseline Constraint (The Structural Gap)
  *   **Motivating Scenario:** A flood damages a region because no agency was assigned the specific obligation to maintain a levee, though maintaining it was technically possible and normatively expected by the community. No specific individual breached a duty, yet the harm resulted from an institutional "non-act."
  *   **Requirement:** The theory must allow for causation by omission even in the absence of a specific, pre-existing agent-level obligation, relying instead on a normative or functional baseline of what *should* have existed (e.g., a role that was never filled).
  *   **Status for Responsibility:** **Contested but Critical.** Non-negotiable for theories aiming to address systemic injustice or institutional negligence; negotiable for strict individualist liability frameworks.
  *   **Tension Flag:** Very High. This directly conflicts with the view that omissions are only causal relative to specific agent duties. It blurs the line between "cause" and "condition."

  ### 4. The Selectivity Constraint (The Proliferation Puzzle)
  *   **Motivating Scenario:** A victim starves in a famine. Every person who did not send food is a counterfactual cause of the death (if they had sent food, the victim might have lived).
  *   **Requirement:** The theory must distinguish the causally relevant omissions (e.g., the local aid distributor) from the causally irrelevant omissions (e.g., a distant stranger), preventing an explosion of causal candidates.
  *   **Status for Responsibility:** **Non-negotiable.** Without selectivity, moral and legal responsibility become meaningless because everyone is equally culpable for every preventable harm.
  *   **Tension Flag:** High. Satisfying this often requires importing normative criteria (duty, expectation) into the metaphysical definition of causation, which risks circularity.

  ### 5. The Asymmetry Constraint (The Act/Omission Distinction)
  *   **Motivating Scenario:** Agent A poisons a victim (act). Agent B fails to give an antidote to a poisoned victim (omission). Both result in death.
  *   **Requirement:** The theory must preserve a conceptual distinction between positive causation and negative causation, even if both ground liability. It must explain why omissions often require different justificatory thresholds than acts.
  *   **Status for Responsibility:** **Non-negotiable.** Legal and moral systems treat killing and letting die differently; a theory that collapses them entirely fails to map onto practical reasoning.
  *   **Tension Flag:** Moderate. If omissions are genuine causal relata identical in structure to positive causes, the asymmetry becomes hard to justify metaphysically.

  ---

  ## II. Systemic Tensions Between Demands

  There is a fundamental friction between the **Liability Constraint** and the **Selectivity Constraint**. To satisfy the Liability Constraint (the doctor caused the death), one must treat absences as real causal factors. However, once absences are admitted as causal factors, the Selectivity Constraint is threatened because absences are ubiquitous (everyone who didn't save the patient is an absence).

  Resolving this tension usually forces a choice between two unstable positions:
  1.  **Metaphysical Inflation:** Accept that everyone is a cause (violating Selectivity) and rely on separate normative theories to filter responsibility. This satisfies the metaphysics but burdens the ethics.
  2.  **Normative Collapse:** Define causation itself via normative expectations (only the doctor's omission is a "cause" because only the doctor had a duty). This satisfies Selectivity and Liability but risks circularity: one cannot use causation to ground responsibility if responsibility (duty) is required to define causation.

  The **Structural Gap** case exacerbates this. If causation depends on duty, there is no omission in the Structural Gap (no duty existed). If causation depends on functional baselines, we risk attributing causation to abstract systems rather than agents, complicating the assignment of blame.

  ---

  ## III. Comparative Assessment of Frameworks

  ### 1. Counterfactual-Dependence Account
  *   **Performance:** Strong on the **Clinical Omission**. It easily captures that "if the doctor had acted, the patient would have lived."
  *   **Failure Points:** It catastrophically fails the **Selectivity Constraint**. It cannot distinguish the doctor from the distant stranger without auxiliary normative assumptions. It also struggles with the **Joint-Protocol** case if modeled simply, as the death might not counterfactually depend on *one* specific gatekeeper's action (due to the other's failure).
  *   **Verdict:** Metaphysically parsimonious but practically unusable for responsibility without heavy normative patching.

  ### 2. Normative-Default Theory
  *   **Performance:** Excellent on **Selectivity** and **Clinical Omission**. By defining an omission as a deviation from a required norm, it automatically filters out the distant stranger. It handles the **Structural Gap** by positing a "should-have-been" institutional norm.
  *   **Failure Points:** It struggles with the **Asymmetry Constraint** and metaphysical rigor. It effectively dissolves causation into normativity. If causation is just "breach of duty," it becomes difficult to explain cases where a duty exists but no causation occurs, or where causation occurs without a clear duty (the Structural Gap tension). It risks the circularity flagged in the Systemic Tensions section.
  *   **Verdict:** Pragmatically robust for law and ethics, but metaphysically deflationary.

  ### 3. Interventionist Framework
  *   **Performance:** Strong on **Joint-Protocol** and **Clinical Omission**. By modeling the system as variables that can be "set" to different values, it handles conjunctive causes well (setting both gatekeeper variables to 'check' changes the outcome). It respects the **Asymmetry Constraint** by treating interventions on absences differently than presences.
  *   **Failure Points:** It faces difficulty with the **Structural Gap**. Interventionism requires an identifiable agent or mechanism capable of performing the intervention. In a structural gap where no agent was assigned the role, it is unclear who or what constitutes the valid "intervention variable." It may also struggle with **Selectivity** if the model allows too many variables to be considered eligible for intervention.
  *   **Verdict:** The most sophisticated for complex causal structures, but requires careful variable selection to avoid normative smuggling.

  ### Summary
  No framework satisfies all desiderata without cost. The **Counterfactual** account sacrifices Selectivity for metaphysical clarity. The **Normative** account sacrifices metaphysical independence for practical selectivity. The **Interventionist** account offers the best structural handling of joint causes but strains against cases where the "intervener" is structurally absent. A viable theory of negative causation for responsibility must likely adopt a hybrid approach: using an interventionist or counterfactual structure for the metaphysics, while explicitly acknowledging that the *selection* of relevant omissions is inescapably normative.
