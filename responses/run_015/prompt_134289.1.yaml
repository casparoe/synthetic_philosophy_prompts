answer: |-
  This is a classic philosophical headache. You're dealing with Gongsun Long's *Bai Ma Fei Ma* ("White Horse Is Not Horse") from the Warring States period. It's one of the most famous paradoxes in the history of logic, and it's designed specifically to exhaust people exactly the way you two are exhausted.

  Your roommate is using it to argue for a radical nominalism (that categories are arbitrary and properties don't bind to identity). You suspect he's confusing semantic distinctness with ontological separation. You are likely right, but to win the argument (or at least end it), you need to show him exactly *which* logical move he is making and where it breaks.

  Here is a menu of distinct interpretations of the slogan "White Horse Is Not Horse," ranging from trivial logical truths to radical metaphysical claims. You can literally show him this list and ask him to point to the one he means.

  ### The Menu of Interpretations

  #### 1. The Non-Identity of Concepts (Intensional)
  *   **The Claim:** The *concept* "White Horse" is not identical to the *concept* "Horse."
  *   **Logical Form:** $Concept(WhiteHorse) \neq Concept(Horse)$
  *   **Why:** "White Horse" contains the attribute of color; "Horse" does not. They have different definitions (intensions).
  *   **Verdict:** **Defensible/True.** This is standard logic. "Bachelor" is not identical to "Man," even if all bachelors are men.
  *   **Does it support your roommate?** **No.** This proves the *terms* are different, not that the *object* isn't a member of the class. It doesn't show membership is contingent.

  #### 2. The Non-Identity of Extensions (Set Theory)
  *   **The Claim:** The *set* of white horses is not identical to the *set* of horses.
  *   **Logical Form:** $\{x | WH(x)\} \neq \{x | H(x)\}$
  *   **Why:** The set of horses includes black horses; the set of white horses does not. Therefore, the sets are not the same size or content.
  *   **Verdict:** **Defensible/True.** Proper subsets are not identical to their parent sets.
  *   **Does it support your roommate?** **No.** This actually proves the opposite of contingency. It confirms that White Horses are a *subset* of Horses. The membership is necessary, even if the sets aren't identical.

  #### 3. The Compound Term Restriction (Semantic)
  *   **The Claim:** When you add a modifier ("White"), you create a new logical term that functions differently than the root term ("Horse").
  *   **Logical Form:** $Term(W + H) \neq Term(H)$
  *   **Why:** In certain logical systems, a compound term restricts reference. If you ask for a "horse," a white horse satisfies the request. If you ask for a "white horse," a brown horse does not. Therefore, they function differently in language games.
  *   **Verdict:** **Defensible.** This is about pragmatic usage and reference.
  *   **Does it support your roommate?** **Partially.** This supports the "language game" part of his argument. It shows logic constrains *language use*. However, it does not prove that ontology (reality) is unconstrained.

  #### 4. The Separation of Universals (Metaphysical)
  *   **The Claim:** The universal "Whiteness" and the universal "Horseness" are distinct entities that do not merge.
  *   **Logical Form:** $Universal(White) \cap Universal(Horse) = \emptyset$ (in terms of essence)
  *   **Why:** "White" defines color; "Horse" defines shape/kind. Since color is not shape, the properties remain distinct and never truly fuse into a single identity.
  *   **Verdict:** **Debatable.** This is a specific metaphysical stance (Realism about universals). It's not a logical truth.
  *   **Does it support your roommate?** **Yes, but weakly.** This supports his idea that "properties never touch identity." However, distinct properties can still co-instantiate in a single object without making membership contingent.

  #### 5. The Radical Nominalist Claim (Ontological)
  *   **The Claim:** There is no such thing as "Horse" in reality, only specific named instances. "White Horse" is a label we stick on a thing, but the thing itself owes nothing to the label.
  *   **Logical Form:** $Object(x) \nrightarrow Kind(K)$
  *   **Why:** Reality is just particulars; kinds are fictions. Therefore, calling a white horse a "horse" is just a convention, not a truth about the object.
  *   **Verdict:** **Philosophically Possible but High Cost.** This denies essentialism entirely.
  *   **Does it support your roommate?** **Yes.** This is the only reading that gets him to "category membership is contingent." But to accept this, he has to deny that biology or physics has any natural kinds whatsoever.

  #### 6. The Equivocation Trick (Linguistic)
  *   **The Claim:** The word "is" means different things in the two halves of the sentence.
  *   **Logical Form:** "White Horse [is a subset of] Horse" vs "White Horse [is identical to] Horse."
  *   **Why:** The slogan exploits the ambiguity of "is." It asserts non-identity to deny class inclusion.
  *   **Verdict:** **Verbal Trick / Fallacy.** This is the standard logical critique of the slogan. It conflates "is" (predication/inclusion) with "is" (identity).
  *   **Does it support your roommate?** **No.** If this is what he's doing, his argument is a fallacy of equivocation.

  ---

  ### The Verdict on Your Roommate's Conclusion

  You asked specifically which of these support his conclusion that **"category membership is always contingent."**

  **Only Interpretation #5 (Radical Nominalism) supports that conclusion.**

  Here is the problem for him: **Interpretations #1, #2, and #3 are logically sound, but they do not prove contingency.**
  *   Just because the *concept* "White Horse" is different from "Horse" (#1), it doesn't mean a white horse isn't necessarily a horse.
  *   Just because the *set* is different (#2), it doesn't mean the subset relation isn't necessary.
  *   Just because the *term* functions differently (#3), it doesn't mean the ontology is unconstrained.

  **The Logical Gap:**
  Your roommate is committing a modal fallacy. He is moving from:
  1.  "The concept 'White Horse' is distinct from 'Horse'" (True)
  2.  To: "Therefore, an object that is a White Horse might not have been a Horse" (False/Unproven)

  Distinct concepts can still have a **necessary inclusion relation**. "Triangle" is a distinct concept from "Shape," but it is not *contingent* that a triangle is a shape. It is necessary.

  ### How to Use This
  Tell him this:
  > "I looked up the logical distinctions. Your slogan works if you mean **Concept Non-Identity** (Interpretation #1) or **Set Non-Identity** (Interpretation #2). Those are true. But neither of those proves membership is **contingent**. To get to contingency, you have to argue for **Radical Nominalism** (Interpretation #5), which means you have to argue that 'Horse' isn't a real natural kind at all, just a label. Are you willing to defend that biology is just a language game? Because the slogan 'White Horse is Not Horse' doesn't prove that by itself; it just proves the words mean different things."

  This forces him to stop hiding behind the ancient slogan and defend the actual metaphysical claim he wants to make. Good luck surviving the next round.
