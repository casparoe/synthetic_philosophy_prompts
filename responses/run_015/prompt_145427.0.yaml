      *Wait, one nuance:* Jules argues "desert-transfer asymmetry." This is a made-up term for the novel. I need to treat it as a philosophical proposition. It sounds like "karmic inheritance." Rosa calls it "cosmic bookkeeping." She's right.

      *Overall Winner:* Rosa. Jules is defending karma as *causality* but calling it *desert*. Rosa exposes this category error.

      *What's Missing:* The possibility that karma isn't about *justice* at all, but about *education* or *ontological gravity*. Also, the Buddhist view that "desert" is itself a misconception arising from attachment to self.

