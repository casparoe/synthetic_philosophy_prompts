answer: |-
  Although both inversions demonstrate that high-level competence does not require conscious understanding, Darwin's model causally explains how such competence arises through selection, whereas Turing's model primarily defines the conditions for attributing intelligence without explaining how ungrounded symbols reliably track physical truth.

  Structurally, both arguments sever the intuitive link between performance and comprehension, but they operate in opposite directions regarding the mind's location. Darwin moves retrospectively from observed adaptation to the absence of an antecedent designer, showing that complex function can emerge from blind variation and retention. Turing moves prospectively from observed behavior to the irrelevance of a consequent internal state, arguing that if a system manipulates symbols correctly, the presence of semantic understanding is either unnecessary or impossible to verify. While Darwin eliminates the need for a mind to *create* the competence, Turing eliminates the need for a mind to *validate* the competence. This shared decoupling of doing from knowing is philosophically potent, yet the directions differ consequentially: Darwin offers an ontological claim about how design exists without a designer, while Turing offers an epistemic criterion for when we should treat a system as intelligent regardless of its internal architecture.

  The tension you identify regarding survival payoff versus normative truth highlights a critical divergence in how these systems relate to reality. In the evolutionary framework, competence is inextricably bound to causal interaction with the environment; an organism that behaves *as if* it understands physics but consistently misjudges gravity will not survive to reproduce. Here, the absence of comprehension is not a deficit because the feedback loop of natural selection ensures that behavioral competence tracks environmental reality closely enough to sustain life. Conversely, a Turing-style system operates on formal syntax rather than semantic content, meaning it can derive valid conclusions without any causal link to the referents of those symbols. Such a system could correctly formulate a physical law through statistical correlation or logical manipulation while remaining entirely disconnected from the physical forces that law describes.

  This distinction reveals that Darwin's inversion is genuinely explanatory, while Turing's carries a hidden explanatory burden. Darwin provides a mechanism—natural selection—that explains not only how competence is generated but also why it is reliable; the environment acts as a filter that aligns competence with truth via survival. Turing's framework explains how competence can be simulated or computed, but it does not inherently explain why that computation should correspond to reality. If a machine derives scientific laws without understanding, we are left asking why its syntax mirrors the structure of the universe. Therefore, while Darwin's inversion resolves the mystery of design by providing a causal history, Turing's inversion resolves the mystery of attribution by setting a behavioral bar, yet it relies on an external account, such as evolutionary history or structural realism, to explain the reliability of the competence it describes.
