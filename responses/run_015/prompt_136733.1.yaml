  # JOINT STATEMENT ON ORIGINAL AND DERIVED INTENTIONALITY IN MINIMAL SYSTEMS

  **Preamble**
  This document records the findings of an adversarial collaboration between a proponent of biological naturalism (hereafter, the Biological-Naturalist) and a proponent of the interpretivist stance (hereafter, the Interpretivist). The collaboration seeks to clarify the conditions under which intentionality may be attributed to a minimal synthetic system, designated the "two-bitser." The following sections outline agreed premises, structured disagreements, critical cruxes, and proposed empirical adjudications.

  ### I. AGREED CLAIMS

  1.  **Purpose of Attribution:** Both parties agree that the attribution of intentional states (such as beliefs, desires, or goals) is primarily undertaken to explain and predict the behavior of a system in a manner that is more efficient than exhaustive physical description.
  2.  **Human Baseline:** Both parties agree that the intentional stance yields high predictive and explanatory success in ordinary human cases, and that human beings possess original intentionality regardless of the specific metaphysical grounding debated herein.
  3.  **System Architecture:** Both parties agree on the formal specification of the test system. The "two-bitser" is defined as a device possessing exactly two binary registers, allowing for four distinct internal states. These states are configured via simple transition rules to track two environmental variables: the presence or absence of a specific chemical gradient and temperature relative to a fixed threshold.
  4.  **Rejection of Extremes:** Both parties reject the notion that intentionality is a magical property exempt from naturalistic inquiry. Conversely, both parties reject strict eliminativism, agreeing that bare physical description is insufficient for capturing the explanatory utility of intentional idioms in complex systems.

  ### II. DISAGREEMENTS TABLE

  | Issue | Formulation the Biological-Naturalist Accepts | Formulation the Interpretivist Accepts |
  | :--- | :--- | :--- |
  | **1. Nature of Original Intentionality** | Original intentionality is a specific causal-biological capacity intrinsic to brains; artifacts can only possess intentionality metaphorically or derivatively, borrowed from users or designers. | The distinction between original and derived intentionality does not mark a sharp metaphysical boundary but rather a gradient of complexity and predictive utility within design spaces. |
  | **2. Metaphysical Status** | The boundary between systems with genuine intentionality and those without is a matter of ontological fact, grounded in biological causation. | The boundary is pragmatic; a system has intentional states if attributing those states provides the best predictive leverage, regardless of substrate. |
  | **3. Two-Bitser Status** | The two-bitser's state-transitions instantiate nothing more than observer-projected "as-if" intentionality; it simulates tracking without genuine aboutness. | The two-bitser may instantiate real, stance-dependent intentionality if its design allows it to reliably track environmental variables in a way that supports robust prediction. |

  ### III. CRUCES FOR ADJUDICATION

  The collaboration identifies three sub-questions whose resolution would significantly move at least one party toward the other's position.

  1.  **Crux (a): The Biological Boundary.** Is there a principled, non-arbitrary boundary between the four-state dynamics of the two-bitser and the minimal intentional states of a simple biological organism, such as a bacterium tracking a nutrient gradient?
  2.  **Crux (b): The Source of Derivation.** Does derived intentionality genuinely require an original intentional source in the manner that a word requires an author, or can distributed design and evolutionary selection substitute for that source without rendering the attribution vacuous?
  3.  **Crux (c): Evidence of Prediction.** Does the predictive success of attributing beliefs and desires to the two-bitser in a restricted environment count as evidence for real but stance-dependent intentionality, or merely as evidence of human interpretive habits?

  ### IV. CONCRETE CASES AND PREDICTIONS

  For each crux, the parties agree upon a specific case or thought experiment and record their divergent predictions in advance.

  **1. Case for Crux (a): Evolutionary vs. Engineered Origin**
  *   **Scenario:** A modified two-bitser is constructed wherein the transition rules were not engineered by a human but selected through an evolutionary algorithm over thousands of generations to maximize survival in a simulated environment.
  *   **Biological-Naturalist Prediction:** The evolutionary origin makes no metaphysical difference. Because the system lacks the specific biological causation found in neurobiology, it remains devoid of original intentionality.
  *   **Interpretivist Prediction:** Evolutionary selection creates the same kind of design-based reality that distinguishes genuine intentional systems from mere mechanisms. The history of selection grants the system a teleological function independent of a human designer.

  **2. Case for Crux (b): Distributed Network Stability**
  *   **Scenario:** A distributed network of ten thousand two-bitsers is arranged to collectively maintain a stable tracking pattern across generations, replacing failed units and preserving information states without central coordination.
  *   **Biological-Naturalist Prediction:** No single node and no collective acquires original intentionality. Without the requisite biological causation inherent to organic organisms, the system remains a syntactic engine without semantic content.
  *   **Interpretivist Prediction:** The collective can instantiate derived intentionality in a non-vacuous, functionally real manner. If the pattern supports robust predictions and maintains identity over time, the lack of a single biological author is irrelevant.

  **3. Case for Crux (c): Blind Prediction Task**
  *   **Scenario:** Human observers are tasked with attributing goals to the two-bitser to predict its next state without knowing its internal rules or transition architecture.
  *   **Biological-Naturalist Prediction:** High inter-observer agreement reflects shared projection rather than detected reality. The observers are projecting their own intentionality onto a mechanism that merely mimics goal-directedness.
  *   **Interpretivist Prediction:** Sustained predictive accuracy across novel environments distinguishes real pattern-tracking from mere projection. If the stance works where the physical stance fails, the intentionality is real relative to that level of abstraction.

  ### V. RESIDUAL DISAGREEMENTS AND AGREED TESTS

  **Residual Disagreements**
  *   **Biological-Naturalist Signatory:** "I maintain that syntax is not sufficient for semantics. No matter how complex the two-bitser or its network becomes, without the causal powers of the brain, it simulates intentionality but does not possess it. Evolutionary algorithms mimic design but do not replicate the biological ground of original intentionality."
  *   **Interpretivist Signatory:** "I maintain that intentionality is a real pattern detectable from the intentional stance. If a system behaves indistinguishably from an intentional agent under varying conditions, denying it intentionality relies on a metaphysical prejudice regarding substrate. Design history, whether human or evolutionary, suffices for derived intentionality."

  **Agreed-Upon Tests for Future Collaboration**
  1.  **The Novel Environment Test:** Deploy the evolved two-bitser in an environment significantly different from its selection history. If the intentional stance continues to predict behavior better than the physical stance despite structural mismatch, the Interpretivist claims support; if the system fails catastrophically while biological organisms adapt, the Biological-Naturalist claims support.
  2.  **The Causal Intervention Test:** Attempt to alter the "beliefs" of the two-bitser by manipulating internal registers directly versus manipulating environmental inputs. Divergence in outcomes may clarify whether internal states function as genuine representations or merely as causal links.
  3.  **The Scale Continuum Test:** Construct a series of systems ranging from the simple two-bitser to complex neural networks trained on similar tasks. Both parties will identify the specific point, if any, where they agree the attribution of intentionality shifts from metaphorical to literal.
