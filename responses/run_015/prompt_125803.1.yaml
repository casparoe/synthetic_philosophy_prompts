answer: |-
  **The Geometry of Temptation: Aristotle, Hyperbolic Discounting, and the Structure of Agency**

  The phenomenon of weakness of will, or *akrasia*, presents a enduring puzzle for the philosophy of action: how can an agent intentionally act against their own better judgment? In the *Nicomachean Ethics*, Aristotle offers a qualitative, psychological account rooted in the structure of practical reasoning. In contrast, contemporary behavioural economics, specifically through the model of hyperbolic discounting, offers a quantitative, formal account rooted in time-inconsistent preferences. While the latter provides a powerful predictive tool for choice behaviour, it risks reducing the normative failure of agency to a mere mathematical inconsistency. Furthermore, the institutional remedies proposed by behavioural economics, such as cooling-off periods, presuppose a fragmented, diachronic conception of the self that sits uneasily with the Aristotelian ideal of integrated character and *phronesis*.

  To understand the divergence, one must first grasp Aristotle's resolution to the Socratic paradox. Socrates argued that no one does evil willingly; if one knows the good, one does it. Aristotle counters that the akratic agent does possess knowledge of the good, but fails to exercise it. He utilises the model of the practical syllogism. The agent holds a universal premise (e.g., 'dry food is good for every man') and a particular premise (e.g., 'this food is dry'). In the virtuous agent, reason combines these to produce action. In the akratic agent, appetite interferes with this process. Aristotle suggests that under the influence of passion, the agent either fails to activate the minor premise or fails to draw the conclusion, akin to a student reciting verses while asleep or drunk. The knowledge is present in possession but absent in use. Crucially, for Aristotle, the judgment regarding the good remains stable; it is the capacity to act upon that judgment that is temporarily disabled by the non-rational part of the soul.

  Hyperbolic discounting presents a fundamentally different ontology of the failure. In standard rational choice theory, agents discount the future exponentially, maintaining consistent preferences over time. Behavioural economics observes that humans instead display a hyperbolic discount curve: we discount the near future steeply and the distant future lightly. This leads to preference reversal. An agent may prefer a larger, later reward over a smaller, sooner one when both are distant, but as the smaller reward approaches, the preference flips. Here, the failure of rational agency is not described as reason being overpowered by appetite while holding a steady judgment. Rather, the judgment itself changes. The 'value' of the temptation quantitatively increases as temporal proximity decreases.

  This leads to the first critical point of comparison: does hyperbolic discounting explain the failure of rational agency, or merely redescribe it? From a conceptual standpoint, the behavioural-economic model risks being a sophisticated redescription. It maps the topology of the choice but remains silent on the phenomenology of the action. By stating that the agent's discount rate changed, the model explains *when* the weakness occurs, but not *why* the agent succumbed. It treats the agent as a locus of competing utility functions rather than a unified reasoner engaged in a normative struggle.

  For Aristotle, *akrasia* is a failure of integration between the rational and non-rational parts of the soul. The explanation is qualitative: passion distorts the perception of the particular. For the behavioural economist, *akrasia* is a failure of consistency between temporal slices of preference. The explanation is quantitative: the curve is steeper than it ought to be. Consequently, hyperbolic discounting explains the pattern of behaviour with high precision but fails to account for the agency involved. It describes the agent as a passive vessel through which competing time-discounted values flow, whereas Aristotle describes an agent who is actively, albeit unsuccessfully, striving to align action with reason. To say 'I discounted the future too heavily' is to describe the mathematical shape of the error, not the moral or rational texture of the failure. It converts a normative problem (I ought to have resisted) into a descriptive anomaly (my preferences were time-inconsistent).

  This divergence becomes even more pronounced when considering remedies for weakness of will, specifically institutional cooling-off mechanisms. Behavioural economics often advocates for commitment devices: binding contracts, mandatory waiting periods for purchases, or automatic savings enrolment. These mechanisms are designed to allow the 'long-term self' to restrict the options available to the 'short-term self'. This approach presupposes a specific conception of the diachronic self. It implies that the agent at time $t_1$ and the agent at time $t_2$ are sufficiently distinct that the former is justified in constraining the latter, akin to one person restricting the liberty of another to prevent harm. This is often formalised as intra-personal game theory, where the self is fragmented into a 'planner' and a 'doer'.

  Aristotle would find this conception of the self alienating. For Aristotle, the self is a unified substance persisting through time, responsible for the formation of character (*hexis*). While he acknowledges that we change, moral responsibility relies on the continuity of the agent. If I bind my future self through a cooling-off period, I am admitting that my future rational capacity cannot be trusted to govern my appetites. While Aristotle might concede that such external constraints are useful for the 'incontinent' man who is still striving for virtue (the *enkratic*), they are ultimately inferior to the development of *phronesis*, or practical wisdom.

  The Aristotelian goal is not to bypass the struggle between reason and appetite via external architecture, but to habituate the appetites so that they align with reason. Reliance on cooling-off mechanisms treats the symptom (the choice) rather than the cause (the state of the soul). If an agent permanently requires institutional binding to act rationally, they never achieve the unity of character required for *eudaimonia*. They remain in a state of civil war, managed by external treaties rather than internal peace. Furthermore, the behavioural-economic justification for these mechanisms rests on the idea that the 'long-term preference' is the 'true' preference. Aristotle would question whether a preference that never manifests in action can be considered the agent's true good. For Aristotle, the good is realised in the activity itself, not merely in the abstract planning of it.

  However, there is a potential reconciliation. One could argue that cooling-off periods serve a pedagogical function similar to Aristotelian habituation. By preventing the agent from acting on immediate impulse, the mechanism creates a space for reason to re-engage. If the waiting period allows the heat of passion to subside so that the practical syllogism can be completed, the institution acts as a scaffold for rationality. In this view, the mechanism does not replace agency but protects the conditions necessary for its exercise. Yet, this reconciliation holds only if the mechanism is viewed as a temporary aid to moral development. If it is viewed as a permanent substitute for self-governance, it reinforces the fragmentation of the self that Aristotle warns against. It suggests that the agent is not a single captain of the soul, but a succession of captains who must be shackled by their predecessors.

  In conclusion, while hyperbolic discounting offers a robust formal model for predicting time-inconsistent behaviour, it falls short of a full philosophical explanation of weakness of will. It redescribes the normative failure of *akrasia* as a quantitative inconsistency of preference, thereby sidestepping the question of how reason is silenced by passion. Aristotle's account, though less mathematically precise, preserves the integrity of the agent as a reasoner who fails to activate their knowledge. Consequently, the institutional remedies favoured by behavioural economics, which rely on binding the future self, presuppose a diachronic fragmentation that Aristotle would view as a sign of unresolved psychic conflict. True rational agency, for Aristotle, is not achieved by constraining the self across time, but by harmonising the self within the moment. To rely solely on cooling-off mechanisms is to manage the symptoms of a divided soul rather than to cure the division itself.
