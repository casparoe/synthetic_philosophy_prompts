answer: |-
  There is no single, canonical technical term in the philosophy of science literature that captures this *exact* oscillation in isolation. However, the pattern you describe is a well-recognized composite pathology that sits at the intersection of **Lakatosian methodology**, **metaphysical equivocation**, and **rhetorical strategy**.

  To articulate this in your work, you should characterize it as a specific form of **theoretical immunization** that relies on **equivocation regarding the explanandum**. While you may not find a single noun phrase like "The Quine-Duhem Problem," the structure is widely discussed under overlapping descriptions.

  Here is a breakdown of how to characterize this logically, the existing concepts it maps onto, and a proposed label for your own use.

  ### 1. The Methodological Structure: Lakatosian Immunization
  The most robust technical framing comes from Imre Lakatos's *Methodology of Scientific Research Programmes*.
  *   **The Hard Core:** The commitment to reductionism (e.g., "Consciousness *just is* neural dynamics").
  *   **The Protective Belt:** The auxiliary hypotheses that protect the core from falsification.
  *   **The Move:** When feature $F$ threatens the core, the researchers adjust the protective belt by reclassifying $F$ as "emergent."
  *   **The Pathology:** In a healthy research program, adjustments to the protective belt should lead to novel predictions (a *progressive problem shift*). In the pattern you observe, the adjustment excludes the anomaly from the theory's scope without generating new predictions, yet the theory continues to claim explanatory credit for the whole domain. Lakatos would classify this as a **degenerating problem shift**.
  *   **Distinction from Standard Ad Hoc:** As you noted, this is not a standard auxiliary hypothesis (which specifies boundary conditions). It is an **ontological reclassification** that changes the identity of the *explanandum* mid-argument.

  ### 2. The Rhetorical Structure: The Motte-and-Bailey Doctrine
  While originally a rhetorical fallacy, this concept has gained traction in recent philosophy of science (e.g., in critiques of predictive processing or extended cognition) to describe exactly this oscillation.
  *   **The Bailey (Strong Claim):** "Phenomenon $P$ is fully reduced to $M$." (Used for positive marketing/explanatory credit).
  *   **The Motte (Weak Claim):** "Phenomenon $P$ is broadly accounted for by $M$, except for emergent features." (Used for defense against counterexamples).
  *   **The Oscillation:** The researchers inhabit the Bailey when making positive claims (asserting total reduction) but retreat to the Motte when challenged (asserting emergence).
  *   **Why it fits:** It captures the *selective* nature of the invocation that you identified. The "emergence" clause is not a consistent ontological commitment; it is a defensive fallback position.

  ### 3. The Metaphysical Structure: Equivocation on the Explanandum
  Logically, the move relies on shifting the definition of $P$.
  *   **Claim 1:** $P_{total}$ (including $F$) is identical to $M$.
  *   **Claim 2:** $F$ is emergent from $M$ (implying $F$ is not identical to $M$, or at least not reducible).
  *   **The Conflict:** This violates **Jaegwon Kim's Principle of Explanatory Exclusion**. If $M$ fully explains $P$, there is no causal/explanatory work left for an "emergent" $F$ to do. If $F$ is genuinely emergent (in a way that blocks reduction), then $M$ does not fully explain $P_{total}$.
  *   **The Label:** This is often discussed as **"Inconsistent Identity Claims"** or **"Ontological Free Riding"** (a term associated with Terence Horgan). The researcher wants the ontological parsimony of reductionism (the "free lunch") without the explanatory burden of accounting for the emergent features.

  ### Recommended Terminology for Your Work
  Since no single term exists, you have the opportunity to coin a precise label that synthesizes these elements. I recommend one of the following, depending on the tone of your paper:

  **Option A: "Immunizing Emergence" (Descriptive/Technical)**
  This highlights the functional role of the emergence claim. It signals that "emergence" is not being used as a positive metaphysical thesis, but as an immunization strategy against falsification.
  *   *Usage:* "The program relies on a strategy of **immunizing emergence**, where anomalous features are offloaded to an emergent category to preserve the reductive hard core."

  **Option B: "The Reductive Motte-and-Bailey" (Rhetorical/Critical)**
  If your paper is critical of the argumentation style, this is increasingly understood in contemporary philosophy of science.
  *   *Usage:* "This represents a **reductive Motte-and-Bailey**, oscillating between strong ontological identity claims and weak supervenience claims depending on dialectical pressure."

  **Option C: "Strategic Ambiguity regarding the Explanandum" (Logical)**
  This is the most neutral and precise logical description. It focuses on the shifting target of what is being explained.
  *   *Usage:* "The reduction succeeds only through **strategic ambiguity regarding the explanandum**, treating the phenomenon as reducible for credit but emergent for defense."

  ### Key Literature to Cite
  To ground this in existing scholarship, you should reference:
  1.  **Imre Lakatos** (*Falsification and the Methodology of Scientific Research Programmes*): For the concept of immunization and degenerating shifts.
  2.  **Jaegwon Kim** (*Supervenience and Mind*): Specifically his critiques of non-reductive physicalism and the Exclusion Problem. He argues you cannot have it both ways (causal efficacy of the emergent + completeness of the physical).
  3.  **Terence Horgan** ("From Supervenience to Superdupervenience"): Discusses the difficulty of maintaining physicalism without reduction, and the "ontological free lunch" problem.
  4.  **Mark Bedau** ("Weak Emergence"): Distinguishes between emergence that is compatible with reduction (weak/epistemic) and emergence that is not (strong/ontological). Your pattern conflates the two opportunistically.
  5.  **John Dupré** (*The Disorder of Things*): For critiques of reductionist programs that ignore the complexity of higher-level phenomena.

  ### Summary for Your Articulation
  You can write:
  > "While this maneuver is often dismissed as mere *ad hoc* hypothesis testing, it is structurally distinct. It functions as a **Lakatosian immunization strategy** that employs **strategic equivocation on the explanandum**. By treating 'emergence' as a defensive ontological category rather than a positive explanatory constraint, the research program maintains a **Motte-and-Bailey** posture: asserting total reduction for explanatory credit while retreating to emergentism for falsification avoidance. I term this failure mode **immunizing emergence**."

  This formulation distinguishes it from standard auxiliary hypotheses (which don't typically shift ontological categories) and captures the oscillation you observed.
