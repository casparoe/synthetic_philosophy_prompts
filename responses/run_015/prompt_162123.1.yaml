answer: |-
  ### Exam Question: Philosophy of Language (Final Seminar)

  **Time Allowed:** 45 Minutes
  **Word Limit:** None (manage your time)

  **Question:**

  In recent lectures, we distinguished two ways a term might be rigid. **Thin Rigidity**: the term picks out the same object in every world where that object exists; in worlds where the object does not exist, the term fails to refer or latches onto whatever satisfies the reference-fixing description. **Thick Rigidity**: the term picks out that very object in *every* possible world, even worlds where the object does not exist (thereby designating something that isn't there).

  Consider a contingently existing individual, such as a specific cloned animal. Let name $N_1$ be introduced by ostension to the actual animal. Let name $N_2$ be introduced by the description "the first cloned animal." Assume $N_1$ and $N_2$ refer to the same individual in the actual world.

  Write an essay addressing the following:
  1.  If we adopt **Thin Rigidity**, does the identity statement '$N_1 = N_2$' express a necessary truth? Why or why not?
  2.  If we adopt **Thick Rigidity** to secure necessity, does this undermine the claim that the identity is knowable only *a posteriori*? Explain the epistemic route.
  3.  Does a two-dimensional semantic framework (distinguishing **primary intensions** from **secondary intensions**) dissolve the tension between necessity and contingency here, or merely redescribe it? Define these terms in your answer.

  ***

  ### Model Answer

  The problem of contingent existents challenges the standard derivation of necessary identity. If '$N_1 = N_2$' is true, standard logic suggests it is necessarily true. However, if the referent exists only contingently, there are possible worlds where the referent is absent. How rigidity functions in those empty worlds determines the modal status of the identity.

  Under **Thin Rigidity**, the terms refer to the individual only in worlds where the individual exists. In worlds where the cloned animal never comes into existence, $N_1$ and $N_2$ either fail to refer or refer to whatever satisfies the descriptive conditions (e.g., a different clone). If they fail to refer, the identity statement lacks a truth value in those worlds. If they latch onto different satisfiers of the description, the identity is false. In either case, the statement is not true in all possible worlds. Thus, Thin Rigidity combined with contingent existence entails that '$N_1 = N_2$' is **not necessary**. To save necessity, one must reject Thin Rigidity for this case.

  Adopting **Thick Rigidity** secures necessity. Here, $N_1$ and $N_2$ designate the very same individual even in worlds where that individual does not exist. Since they designate the same object in every world, the identity holds in every world. The statement is metaphysically necessary. However, this does not automatically render the truth *a priori*. The necessity of the proposition is distinct from the epistemic route to knowing it. We know *a priori* that if $N_1$ and $N_2$ are rigid designators for the same object, then '$N_1 = N_2$' is necessary. But determining *that* they designate the same object requires empirical investigation. We must inspect the actual world to see if the animal pointed to ($N_1$) is indeed the first cloned animal ($N_2$). Thick rigidity changes the metaphysical profile of the terms, not the epistemic method of reference-fixing. Therefore, the truth remains *a posteriori*.

  This distinction is clarified by **two-dimensional semantics**. We must distinguish the **primary intension** from the **secondary intension**. The primary intension is the reference-fixing role: a function from worlds considered as actual to extensions. It asks, "Given this world is actual, who does the term pick out?" The secondary intension is the content once reference is fixed: a function from worlds considered as counterfactual to extensions. It asks, "Given our actual reference, who is picked out in other worlds?"

  The intuition that '$N_1 = N_2$' is contingent arises from evaluating the primary intension. In a world considered as actual where a different animal was cloned first, $N_2$ would pick out that different animal. Thus, the primary intension yields different truth values across worlds. However, the intuition that the identity is necessary arises from evaluating the secondary intension. Once reference is fixed in the actual world, both terms track the same individual across all counterfactual worlds (under Thick Rigidity).

  Does this dissolve the tension? It redescribes it precisely enough to resolve the paradox. It allows us to say the proposition is metaphysically necessary (secondary intension is constant) while explaining why it feels contingent (primary intension varies) and why it is *a posteriori* (we need empirical data to fix the actual world and determine the secondary intension). The category of the necessary *a posteriori* is preserved, provided we accept Thick Rigidity as the mechanism for the secondary intension of proper names. Without Thick Rigidity, the secondary intension would be gappy in non-existence worlds, and necessity would fail.

  ***

  **Instructor's Note on Grading the "Strongest Attack":**
  The strongest attack on this model answer targets the coherence of **Thick Rigidity**. A student might argue that designating an object in a world where it does not exist is metaphysically incoherent (you cannot refer to "nothing" as "something"). If Thick Rigidity is incoherent, then necessity fails, and the identity is contingent. **Grading Policy:** Do not mark this down as "off-script." If a student argues that Thick Rigidity is unintelligible and therefore the identity is contingent (rejecting the Kripkean orthodoxy), award full credit for argumentative coherence, provided they engage with the Thin/Thick distinction as defined in the prompt. This is a valid philosophical objection, not a misunderstanding.

  ***

  ### Marking Scheme (Out of 20)

  **1. Analysis of Thin Rigidity & Existence (0–5 marks)**
  *   **5 (A):** Explicitly states Thin Rigidity leads to truth-value gaps or falsity in non-existence worlds, correctly concluding identity is *not* necessary.
  *   **3–4 (B):** Identifies Thin Rigidity fails to secure necessity but is vague on *why* (e.g., just says "reference fails" without linking to truth conditions).
  *   **0–2 (C):** Defines Thin Rigidity but claims identity remains necessary regardless, or confuses existence of object with existence of name.
  *   *Pitfall:* Students often assume "rigid" automatically means "necessary" without checking existence conditions.

  **2. Analysis of Thick Rigidity & Necessity (0–5 marks)**
  *   **5 (A):** Explains that Thick Rigidity forces reference to the same object in empty worlds, securing necessity, but notes this is a theoretical cost.
  *   **3–4 (B):** States Thick Rigidity makes it necessary but treats it as a magic bullet without explaining the mechanism (designating the non-existent).
  *   **0–2 (C):** Claims Thick Rigidity makes the statement false, or conflates Thick Rigidity with descriptive reference.
  *   *Pitfall:* Students frequently treat Thick Rigidity as simply "stipulating necessity" rather than a semantic commitment about reference in empty worlds.

  **3. Epistemic Status (A Posteriori) (0–5 marks)**
  *   **5 (A):** Clearly separates the metaphysical necessity (conditional) from the empirical reference-fixing; explains we know $a=b \to \Box(a=b)$ *a priori*, but $a=b$ empirically.
  *   **3–4 (B):** Asserts it is *a posteriori* because "we need to look," but struggles to explain why necessity doesn't imply *a priori* knowledge.
  *   **0–2 (C):** Claims that if it is necessary, it must be *a priori*, or vice versa.
  *   *Pitfall:* The classic conflation of modal status (necessity) with epistemic status (certainty/justification).

  **4. Two-Dimensional Semantics (0–5 marks)**
  *   **5 (A):** Defines Primary/Secondary intensions correctly *and* maps Primary to contingency intuition and Secondary to necessity claim; evaluates whether it dissolves or redescribes.
  *   **3–4 (B):** Defines the intensions but fails to map them to the specific intuitions (contingency vs. necessity) in the prompt's scenario.
  *   **0–2 (C):** Name-drops the concepts without definition, or treats them as two different types of worlds rather than two ways of evaluating the same world.
  *   *Pitfall:* Students often define 2D semantics as "two types of possible worlds" rather than "two ways of evaluating propositions."

  **Differentiation Summary:**
  *   **B Range (12–15):** Gets the Thin/Thick distinction right and secures the Necessary *A Posteriori* conclusion, but treats the machinery as a black box.
  *   **A Range (16–20):** Opens the black box. Explains *why* Thin fails (truth conditions), *how* Thick works (reference without existence), and uses 2D semantics to explain the *source* of the epistemic friction rather than just asserting it exists.
