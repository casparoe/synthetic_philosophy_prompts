  # Uncertainty Account Classification Instrument

  ## Part 1: The Decision Tree

  **Instructions for Workshop Leader:**
  Read the Case description aloud. Read the Question. Record the Author's choice (A, B, or C). Follow the arrow to the next Node or Terminal Leaf. Do not explain the theoretical implications of their choice; only clarify the scenario if asked.

  **Node 1: Case (b) Buying and Selling**
  *Scenario:* For a one-off event (e.g., catchment exceeding design flood within 20 years), consider a ticket paying one unit if the event occurs.
  *Question:* What is the most you would pay to buy this ticket, and the least you would accept to sell it?
  *   **A:** The same number both ways. (Go to Node 2)
  *   **B:** A gap, with the selling price strictly above the buying price. (Go to Node 4)
  *   **C:** No numbers at all, but a willingness to rank events against one another. (Go to Node 8)

  **Node 2: Case (d) Two Teams**
  *Scenario:* Two equally credible teams report 0.3 and 0.7 for the same event.
  *Question:* What goes in the report?
  *   **A:** Average them (0.5). (Go to **Leaf 1**)
  *   **B:** Report the span and nothing in between, but act on one designated value for the recommendation. (Go to **Leaf 2**)
  *   **C:** Refuse to aggregate until the disagreement is explained. (Go to Node 3)

  **Node 3: Case (c) Thin Evidence**
  *Scenario:* One imperfect study, no earlier records, a quantity nobody in the field has measured.
  *Question:* What goes in the report?
  *   **A:** A number fixed by indifference or standard assumption. (Go to **Leaf 1**)
  *   **B:** Nothing quantitative; rely on method reliability only. (Go to **Leaf 10**)

  **Node 4: Case (e) Widening**
  *Scenario:* A switch is set by a fair coin. Two stations print the state. Either both are correct, or South is cross-wired (prints opposite). You have no evidence which. You see North print 1.
  *Question:* Before looking at North, you write a range for South printing 1. After North prints 1, do you write a wider range, a narrower range, or the same?
  *   **A:** Narrower or the same. (Go to Node 5)
  *   **B:** Wider. (Go to Node 6)

  **Node 5: Case (c) Thin Evidence**
  *Scenario:* One imperfect study, no earlier records.
  *Question:* How do you handle the lack of data?
  *   **A:** Wide but not full interval; treat ambiguity neutrally. (Go to **Leaf 3**)
  *   **B:** Full interval or penalize the ambiguity explicitly. (Go to **Leaf 4**)

  **Node 6: Case (a) Two Gauges**
  *Scenario:* Gauge K is calibrated. Gauge U is uncalibrated (reads HIGH or LOW in unknown proportions).
  *Question:* For Gauge U, how do you record the uncertainty?
  *   **A:** A range of probabilities for HIGH. (Go to Node 7)
  *   **B:** A single confidence level assigned to the group 'HIGH or LOW' together. (Go to **Leaf 5**)

  **Node 7: Case (f) Straddling Ranges**
  *Scenario:* Option A benefit [3 to 9], Option B benefit [4 to 7]. They move together (A better when favourable, worse when unfavourable).
  *Question:* Which do you recommend?
  *   **A:** The one with the better worst case (Option B). (Go to **Leaf 6**)
  *   **B:** Either, with the choice left to judgement (both are permissible). (Go to **Leaf 7**)
  *   **C:** A fixed weighting of worst and best cases. (Go to **Leaf 8**)
  *   **D:** Defer the decision and commission more work. (Go to **Leaf 11**)

  **Node 8: Case (a) Two Gauges**
  *Scenario:* Gauge K (calibrated) vs Gauge U (uncalibrated).
  *Question:* How do you choose which to stake a claim on?
  *   **A:** Rank them (K is more reliable than U). (Go to **Leaf 9**)
  *   **B:** Refuse to stake a claim without error rates for the method. (Go to Node 9)

  **Node 9: Case (c) Thin Evidence**
  *Scenario:* One imperfect study, no earlier records.
  *Question:* What goes in the report?
  *   **A:** Nothing quantitative; report method error rates only. (Go to **Leaf 10**)
  *   **B:** Refuse all assessment until data improves. (Go to **Leaf 12**)

  ---

  ## Part 2: Path-to-Leaf Mapping Table

  | Path Sequence | Terminal Leaf | Position Name |
  | :--- | :--- | :--- |
  | 1-A | Leaf 1 | Strict Precise Probabilism |
  | 1-B | Leaf 2 | Robust Sensitivity Analysis |
  | 1-C, 3-A | Leaf 1 | Strict Precise Probabilism |
  | 1-C, 3-B | Leaf 10 | Error-Statistical |
  | 1-B (Gap), 4-A, 5-A | Leaf 3 | Hierarchical Probabilism (Neutral) |
  | 1-B (Gap), 4-A, 5-B | Leaf 4 | Hierarchical Probabilism (Non-Neutral) |
  | 1-B (Gap), 4-B, 6-A, 7-A | Leaf 6 | Strict Imprecision (Worst-Case) |
  | 1-B (Gap), 4-B, 6-A, 7-B | Leaf 7 | Strict Imprecision (Permissive) |
  | 1-B (Gap), 4-B, 6-A, 7-C | Leaf 8 | Optimism–Pessimism Weighted |
  | 1-B (Gap), 4-B, 6-A, 7-D | Leaf 11 | Unnamed: Decision Suspension |
  | 1-B (Gap), 4-B, 6-B | Leaf 5 | Belief-Function Style |
  | 1-C (No Num), 8-A | Leaf 9 | Comparative or Ordinal |
  | 1-C (No Num), 8-B, 9-A | Leaf 10 | Error-Statistical |
  | 1-C (No Num), 8-B, 9-B | Leaf 12 | Unnamed: Radical Skeptic |

  ---

  ## Part 3: Leaf Key and Consequences

  | Leaf | Position | Permitted Reporting | Most Awkward Consequence |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict Precise Probabilism** | Single numbers only; ranges are summaries of distributions. | Must assign specific probabilities to unique events with thin evidence (e.g., via indifference). |
  | **2** | **Robust Sensitivity Analysis** | Range in text; recommendation based on one designated analysis. | **Reporting Imprecision:** The range does not drive the decision, risking "laundering" where uncertainty is shown but ignored. |
  | **3** | **Hierarchical Probabilism (Neutral)** | Second-order probabilities; ranges reflect lack of knowledge about the true probability. | Requires complex elicitation of confidence about probabilities, which domain scientists often find unintuitive. |
  | **4** | **Hierarchical Probabilism (Non-Neutral)** | Second-order probabilities with explicit penalty for ambiguity. | May recommend against high-benefit projects simply because they are poorly understood, appearing overly conservative. |
  | **5** | **Belief-Function Style** | Confidence masses attached to sets of outcomes (e.g., "High or Low"). | Cannot be combined using standard probability arithmetic, requiring custom software or manual calculation. |
  | **6** | **Strict Imprecision (Worst-Case)** | Intervals; decision based on the worst outcome within the interval. | May reject beneficial interventions because of a remote, extreme possibility within the range. |
  | **7** | **Strict Imprecision (Permissive)** | Intervals; any option optimal under some probability in the set is allowed. | **Deliberative Imprecision:** May result in multiple incompatible recommendations being equally valid, paralyzing decision-makers. |
  | **8** | **Optimism–Pessimism Weighted** | Intervals; decision based on a weighted average of best and worst cases. | The weighting coefficient is subjective and difficult to justify to auditors or stakeholders. |
  | **9** | **Comparative or Ordinal** | Rankings only (e.g., "Site A is riskier than Site B"); no numbers. | Cannot aggregate risks across different categories (e.g., flood + structural) to produce a total budget impact. |
  | **10** | **Error-Statistical** | No probabilities on hypotheses; only error rates on methods (e.g., confidence levels). | Cannot state the probability of a flood occurring, only the reliability of the model predicting it. |
  | **11** | **Unnamed: Decision Suspension** | Intervals; recommendation is to gather more data rather than act. | May lead to perpetual delay in infrastructure projects where waiting is costlier than acting on imperfect knowledge. |
  | **12** | **Unnamed: Radical Skeptic** | No quantitative or qualitative assessment until data is perfect. | Renders the risk assessment programme unable to produce any output for novel or data-poor catchments. |

  ---

  ## Part 4: Logical Space Analysis

  **Unoccupied or Absorbed Cells**
  1.  **Consistent Arbitrary Selection:** The view that an author may publish *any* number inside the stated range provided they are consistent in using it.
      *   *Status:* **Absorbed by Leaf 7 (Strict Imprecision Permissive).**
      *   *Explanation:* Leaf 7 permits any option that is best under *some* member of the family. If the "option" is simply "State probability P," and P is within the admissible range, it is permissible. The tree does not separate "Pick any number" from "Pick any action" because the logical structure of permissiveness is identical.
  2.  **Gap + Narrowing + Best Case:** An author who prices with a gap (Node 1-B), believes uncertainty narrows with evidence (Node 4-A), but decides based on the *best* case (Node 7 equivalent).
      *   *Status:* **Unoccupied.**
      *   *Reason:* Merely unattractive. Optimism in the face of second-order uncertainty is rarely defended as a normative rule in risk assessment, though it exists descriptively.
  3.  **Same Number + Refuse Aggregate:** An author who prices precisely (Node 1-A) but refuses to average team estimates (Node 2-C).
      *   *Status:* **Routed to Leaf 1 or 10.**
      *   *Reason:* This is logically tense. If forced, Node 3 determines if they fall back on indifference (Leaf 1) or method reliability (Leaf 10).

  **Indistinguishable Pairs**
  1.  **Leaf 2 (Robust) vs. Leaf 1 (Precise):** If the "range" reported in Leaf 2 is very narrow, the practical output is identical to Leaf 1. The tree separates them by *intent* (Node 2: "act on one designated analysis"), but in written reports, they may look identical.
      *   *Workshop Note:* Ask authors to show a past report where the range *changed* the recommendation. If they cannot, they are functionally Leaf 1.
  2.  **Leaf 6 (Worst-Case) vs. Leaf 4 (Hierarchical Non-Neutral):** Both lead to conservative decisions under ambiguity.
      *   *Workshop Note:* Distinguish by asking Node 4 (Widening). Leaf 6 allows uncertainty to widen with evidence (dilation); Leaf 4 typically does not.

  ---

  ## Part 5: Inconsistent Response Patterns

  During the workshop, authors may select answers that no single position can coherently hold. Use this guide to diagnose and record them.

  | Inconsistent Pattern | Diagnosis | Follow-up Question for Author | Record Note |
  | :--- | :--- | :--- | :--- |
  | **Node 1-A (Same Number) + Node 4-B (Widening)** | *Precise Pricing / Dilation Belief.* They price precisely but believe evidence can increase uncertainty. | "If seeing North's printout makes you less certain about South, why did you give a single price for the ticket in Node 1?" | *Dilation without Imprecision.* Likely using precise numbers as a policy constraint rather than a belief state. |
  | **Node 1-B (Gap) + Node 2-A (Average)** | *Imprecise Pricing / Precise Aggregation.* They acknowledge ambiguity in buying/selling but collapse it when teams disagree. | "You required a gap to price the risk, but you average the team estimates. Does the gap disappear when colleagues disagree?" | *Contextual Collapsing.* Author treats ambiguity as real for money but nuisance for consensus. |
  | **Node 1-C (No Number) + Node 7 (Decision Rule)** | *Ordinal Ranking / Quantitative Decision.* They refuse to number risks but select a decision rule requiring intervals. | "You refused to number the risk in Node 1, but Node 7 requires comparing numerical ranges. How do you compute the worst case?" | *Method Mismatch.* Author may be using ordinal heuristics disguised as quantitative rules. |
  | **Node 2-C (Refuse Aggregate) + Node 3-A (Indifference)** | *Disagreement Blocker / Thin Evidence Filler.* They won't average peers but will assume indifference when data is missing. | "You refuse to aggregate team data, but you will assume indifference for missing data. Why is peer disagreement harder to resolve than total ignorance?" | *Social vs. Epistemic.* Author trusts logic over peers. |

  **Workshop Leader Instruction:**
  If an author produces an inconsistent pattern, do not force them to change an answer. Record the "Note" against their name. In the plenary session, highlight these patterns as evidence that the manual currently allows authors to switch accounts between sections (e.g., using Precise methods for aggregation but Imprecise methods for pricing). This validates the need for the manual rewrite.
