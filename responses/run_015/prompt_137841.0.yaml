answer: |-
  You have put your finger on the central tension in modern archaeology, though you are right that there is no single, sticky noun for it. Specialists distinguish between **state collapse** (the failure of the governing apparatus) and **societal collapse** (the failure of the population to sustain itself), but when they write for the public, those distinctions usually dissolve back into the single, dramatic word: *collapse*.

  There is no established term for the specific *error* you are describing—the habit of using the visibility of the elite to diagnose the health of the whole. Since you need a tool for your column, I will coin one for you.

  The concept is **Monumental Synecdoche**.

  **Definition:** The logical error of treating the fate of the high-visibility elite superstructure (palaces, inscriptions, luxury trade) as a proxy for the fate of the societal base (population, caloric intake, safety). It is a synecdoche because it takes the most visible *part* (the monument-building elite) and declares it the *whole* (the society).

  **The Companion Term:** **Extractive Continuity**.

  **Definition:** A situation where the elite superstructure remains intact precisely *because* it is successfully extracting resources from the base, even as the base deteriorates. This is often mislabeled as "stability" or "continuity" because the monuments keep getting built.

  ### Applying the Terms to Your Cases

  **Case 1: Palaces vanish, people live better.**
  *   **Standard Verdict:** Collapse.
  *   **Corrected Verdict:** **State Dissolution** masked by **Monumental Synecdoche**.
  *   **Analysis:** The archaeological signal (stone/writing) goes dark. Because we rely on that signal to define "civilization," we declare the society dead. In reality, the removal of the elite tax burden may have improved the biological standard of living. The "collapse" is real for the *state*, but false for the *people*. The term *Monumental Synecdoche* captures why we get this wrong: we mistake the silence of the palace for the silence of the village.

  **Case 2: Palaces remain, people suffer.**
  *   **Standard Verdict:** Continuity / Transformation.
  *   **Corrected Verdict:** **Extractive Continuity**.
  *   **Analysis:** The archaeological signal remains bright. Inscriptions are carved, temples are raised. This signals "continuity" to the archaeologist. But if those temples are being built by a starving populace under threat of violence, the society is failing even if the state is succeeding. The term *Extractive Continuity* highlights that the persistence of the monument is not proof of societal health, but potentially proof of societal stress.

  ### Are Your Two Cases Less Different Than They Seem?

  Yes. They are mirror images of the same measurement error.

  In both cases, the **State** and the **Society** are decoupled.
  *   In Case 1, the State fails, and the Society recovers.
  *   In Case 2, the State succeeds, and the Society fails.

  The reason we call one "Collapse" and the other "Continuity" is not because of the outcome for the human beings involved, but because of the **archaeological visibility** of the State. Stone and writing preserve; malnutrition and fear do not.

  Your two cases are functionally identical in terms of *data bias*: both reveal that the traditional metric (monuments) tracks the power of the ruling class, not the welfare of the population. When the ruling class vanishes, we see "Collapse." When the ruling class thrives at the expense of the population, we see "Continuity." In neither case does the metric tell us about the lived reality of the majority.

  ### How to Use This in Your Column

  You can frame *Monumental Synecdoche* as a hazard of the trade. Archaeology is inherently biased toward the durable and the expensive. A clay tablet survives; a day without hunger does not. Therefore, our history is naturally weighted toward the things the elite valued enough to make permanent.

  When you use the word **Monumental Synecdoche**, you are not saying collapse never happens. You are saying that when we use the disappearance of palaces as the definition of societal death, we are committing a category error. We are conflating the failure of a specific political technology (the state) with the failure of a human community (the society).

  For your purposes, **Monumental Synecdoche** gives you the scalpel to separate the two. It allows you to say: *"What looks like collapse is often just the end of a Monumental Synecdoche—the moment the elite signal stops broadcasting, revealing that the society was never identical to the state that ruled it."*

  And for the second case, **Extractive Continuity** allows you to warn readers: *"The presence of monuments is not a sign of health. It can be a sign of Extractive Continuity, where the stone stands precisely because the people beneath it are too burdened to move."*

  This gives you a vocabulary that doesn't just relabel the asymmetry (like "transformation") but identifies the *mechanism* of the error (the reliance on elite visibility). It honors the complexity of the evidence without abandoning the dramatic utility of the word "collapse."
