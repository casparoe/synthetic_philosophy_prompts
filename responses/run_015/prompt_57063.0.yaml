answer: |-
  During a just defensive counter-offensive, a soldier of the unjust aggressor force is found pinned beneath a heavy concrete slab in a collapsed trench line; he is physically uninjured but completely immobilized for the next two hours, his weapon is buried out of reach, and he has no means to signal or harm anyone despite remaining fully conscious and vocalizing his intent to resume killing just combatants as soon as he is freed. He is still in uniform, rejects a demand to surrender, and explicitly acknowledges that his side is fighting an unlawful war of aggression but refuses to cease participation. A just combatant stands over him with a shovel and the immediate capacity to collapse the remaining support beams, burying him alive before he can be dug out by his own unit.

  **The Two Verdicts**

  *   **Walzerian (Moral Equality of Combatants):** Permitted. The soldier is a combatant by status (uniformed, member of armed forces, engaged in the war effort). He is not *hors de combat* because he has not surrendered, is not wounded or sick, and is not in the custody of the enemy. Under the convention of war, combatant status alone confers liability to attack regardless of immediate capacity to inflict harm. The just combatant may kill him because he is an enemy combatant, full stop.
  *   **McMahan-style (Revisionist):** Permitted. The soldier is morally liable to defensive harm because he is responsible for an ongoing unjust threat project. His temporary physical incapacity does not extinguish his liability because his moral responsibility for the unjust aggression remains intact and he intends to resume harmful action as soon as able. Killing him is a permissible act of preventing future unjust harm from a liable agent.

  **The Dangerousness Ground**

  The single feature doing the work is the **temporary immobilization without injury**. This severs the link between *current* dangerousness and liability. If you remove this feature (he is mobile and armed), both theories permit killing, but their reasons overlap (he is both a combatant and currently dangerous). With the feature intact, the Walzerian verdict proves that *status* is doing the work, not *current dangerousness*, because the target is genuinely harmless at the moment of decision. If Walzer relied on current dangerousness, he would have to forbid the killing; since he permits it, the "dangerousness" ground usually credited to him is not load-bearing for the verdict—status is.

  **The Walzerian Objection**

  A Walzerian would attack the claim that dangerousness isn't load-bearing by arguing that combatant status is merely a **proxy for general dangerousness**. They would contend that the convention treats him as liable not because of who he *is* metaphysically, but because soldiers *as a class* are dangerous, and checking for individual capacity in the fog of war is impossible. This case targets the "current threat" formulation of Walzer's view, not the "class threat" formulation. If you press them, they will admit the individual isn't dangerous *now*, but argue the rule must hold to preserve the convention that protects those who truly are *hors de combat*. The case shows that Walzer's theory prioritizes the *rule* (status) over the *underlying reason* (danger) in edge cases.

  **Permanent vs. Temporary Harmlessness**

  If the immobilization is **permanent** (he will never escape), the agreement collapses. The Walzerian likely still permits killing (or at least doesn't forbid it based on status alone until he is formally processed as POW or declared *hors de combat* by command), because status changes slowly. The Revisionist, however, would likely forbid killing. For McMahan, liability is tied to responsibility for *threats*. If the soldier is permanently harmless, he poses no threat, and killing him is no longer necessary defense against a liable aggressor; he becomes a harmless person who *was* responsible, which doesn't justify lethal force. The verdict diverges: Walzer says "Maybe/Yes" (status persists), McMahan says "No" (liability extinguished).

  **Where This Falls Apart**

  The design is most vulnerable on the **Revisionist necessity condition**. McMahan ties liability to the necessity of defensive harm. A critic could argue that if the soldier is stuck for two hours, killing him *now* is not strictly necessary—the just combatant could guard him, leave, or wait until he is dug out and poses an immediate threat. If killing is not necessary to avert the threat, McMahan must forbid it, even if the soldier is liable. The Walzerian faces no such constraint; status grants a license to kill regardless of immediate necessity. If you accept the necessity constraint, the agreement vanishes: Walzer says "Permitted," McMahan says "Forbidden (due to lack of necessity)." To save the agreement, you must assume the tactical situation makes leaving him alive too risky (e.g., his unit is nearby), but that reintroduces dangerousness as a factor, muddying the test.
