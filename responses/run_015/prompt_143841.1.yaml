answer: |-
  # The Representational Fidelity Protocol (RFP)
  **For:** Ethics Review Board, Historical Drama Division  
  **Subject:** Evaluation of Invented Scenes Involving Deceased Historical Figures  
  **Guiding Principle:** Preservation of the causal and moral architecture of actual lives as they figure in the shared historical record.

  ## I. Scope and Definitions
  This procedure applies to scenes involving real, deceased persons where no legal estate exists to grant permission. It does not adjudicate legal liability (defamation/right of publicity) but ethical fidelity.

  *   **Shared Historical Record:** The consensus view of the subject's life and actions available in standard academic texts, primary source archives, and public memory.
  *   **Causal Architecture:** The chain of reasons, motivations, and events that explains *why* a historical outcome occurred.
  *   **Moral Architecture:** The ethical valence (virtue, vice, neutrality) assigned to the subject's choices within the historical record.
  *   **Narrative Compression:** Omitting redundant or minor events to maintain pacing without altering the outcome or motivation.
  *   **Structural Distortion:** Inventing facts that alter the explanatory logic of a decision or the ethical character of the agent.

  ---

  ## II. The Decision Procedure (Ordered Tests)
  *Apply tests sequentially. If a scene fails any test, it is **Rejected** unless the Board invokes the Override Clause (see Section IV).*

  ### Test 1: The Baseline Consensus Check
  **Question:** Is there a stable consensus in the Shared Historical Record regarding the specific event or motivation being depicted?
  *   **Yes:** Proceed to Test 2.
  *   **No (Record is Silent/Contested):** Proceed to Test 2, but flag for "High Discretion." (Invention is permissible *only if* it does not foreclose competing valid historical theories).
  *   **Action:** Consult three standard academic biographies or primary source collections.

  ### Test 2: The Compression vs. Invention Distinction
  **Question:** Does the scene *omit* data or *add* data?
  *   **Omission (Compression):** Removing failed attempts, merging minor secondary characters, shortening timelines.
      *   **Verdict:** **Permissible** (Proceed to Test 3 to ensure no causal side-effects).
  *   **Addition (Invention):** Fabricated dialogue, private meetings, internal monologues, assigned motives.
      *   **Verdict:** **Conditional** (Proceed to Test 3).

  ### Test 3: The Explanatory Engine Test (Causal Architecture)
  **Question:** If the invented/omitted element were removed, would the *reason* for the historical outcome change?
  *   **No:** The invention is decorative or atmospheric. (e.g., Inventing *where* they signed a treaty, but not *why*).
      *   **Verdict:** **Pass.**
  *   **Yes:** The invention becomes the primary driver of the action. (e.g., Inventing a bribe to explain a vote that was historically ideological).
      *   **Verdict:** **Fail.** (This is Structural Distortion).

  ### Test 4: The Moral Valence Test
  **Question:** Does the invention shift the ethical perception of the subject from the consensus view?
  *   **No:** The subject remains as heroic, villainous, or complex as the record suggests.
      *   **Verdict:** **Pass.**
  *   **Yes:** The subject is made significantly more noble or more nefarious than the record supports. (e.g., Attributing a humanitarian motive to a decision made for political expediency).
      *   **Verdict:** **Fail.**

  ### Test 5: The Viewer Signal Test
  **Question:** Is there a mechanism (dialogue, visual cue, disclaimer) to signal to the non-expert viewer that this specific moment is dramatized speculation?
  *   **Yes:** (e.g., "We can only imagine what was said..." or stylistic shift).
      *   **Verdict:** **Pass.**
  *   **No:** The scene is presented with the same visual authority as documented footage.
      *   **Verdict:** **Warning.** (Requires mitigation in marketing or companion materials).

  ---

  ## III. Worked Applications

  ### Case 1: The Scientist (Permissible Compression)
  **Proposal:** A biopic about a famous chemist. The historical record shows she failed 50 experiments before success. The script shows only 3 failures before success to maintain pacing.
  *   **Test 1 (Baseline):** Consensus exists on the struggle and ultimate success.
  *   **Test 2 (Compression):** This is **Omission**.
  *   **Test 3 (Engine):** Does removing the 47 failures change *why* she succeeded? No. The causal architecture (persistence leading to discovery) remains intact.
  *   **Test 4 (Valence):** Does this make her seem more gifted/less hardworking? Minimally. It compresses time, not effort.
  *   **Verdict:** **APPROVED.** This is standard narrative compression. It preserves the causal arc without distorting the moral character of perseverance.

  ### Case 2: The Political Leader (Impermissible Distortion)
  **Proposal:** A drama about a Prime Minister who reversed a war policy in 1940. The record shows the reversal was due to military necessity. The script invents a private religious crisis that convinces him peace is God's will.
  *   **Test 1 (Baseline):** Consensus attributes the decision to strategic/military factors.
  *   **Test 2 (Invention):** This is **Addition** (private religious crisis).
  *   **Test 3 (Engine):** If the religious crisis is removed, does the reason for the reversal change? **Yes.** The script replaces a strategic motive with a spiritual one. This alters the explanatory logic of a major historical event.
  *   **Test 4 (Valence):** It shifts the leader from a pragmatic strategist to a spiritual visionary.
  *   **Verdict:** **REJECTED.** This is Structural Distortion. It rewrites the causal architecture of the historical record.

  ### Case 3: The Borderline Override (Procedure Pass, Board Reject)
  **Proposal:** A drama about a 19th-century Indigenous leader. The historical record (written by colonizers) is silent on his private family life. The script invents a scene where he violently disciplines his son to fit the "stoic warrior" trope common in Westerns.
  *   **Test 1 (Baseline):** Record is **Silent** on private family dynamics.
  *   **Test 2 (Invention):** **Addition.**
  *   **Test 3 (Engine):** Does this change his public political decisions? **No.** His public alliances remain historically accurate.
  *   **Test 4 (Valence):** Does this change his moral standing? Technically **No**, within the logic of the script's era. It does not contradict specific documents because none exist.
  *   **Test 5 (Signal):** No signal provided.
  *   **Procedure Verdict:** **PASS.** (Technically, it does not contradict the Shared Historical Record).
  *   **Board Decision:** **OVERRIDE TO REJECT.**
  *   **Reasoning:** While the scene passes the *fidelity* test (no contradiction), it fails a broader *ethical* test. It relies on a harmful cultural stereotype to fill a silence in the record. The procedure measures fidelity to *documents*, not fidelity to *dignity*. When the record is silent due to systemic bias, filling that silence with tropes reinforces the bias. The Board rejects this to prevent perpetuating historical harm, even if "representational fidelity" in the narrow sense is maintained.

  ---

  ## IV. Limitations and Residual Judgment
  *This section flags where the procedure cannot automate ethics.*

  ### 1. Where Judgment Cannot Be Eliminated
  **The Definition of "Consensus" (Test 1):** The procedure relies on the "Shared Historical Record." However, history is often contested. Determining what counts as "consensus" versus "minority theory" requires human judgment. A board member must decide if a motive is "disputed" (allowing invention) or "settled" (forbidding contradiction). The procedure cannot calculate this; it requires historiographical expertise.

  ### 2. Distinctions Deliberately Collapsed
  **Private Truth vs. Public Record:** The procedure treats "what actually happened in private" and "what is recorded about the private" as identical. If a figure had a secret motive never recorded, the procedure forbids depicting it if it contradicts the public record. We collapse the *ontological truth* (what happened) into the *epistemic truth* (what is known). This is necessary for the board's function (we cannot judge what we cannot know) but acknowledges we may sometimes protect a falsehood because it is the established record.

  ### 3. What the Procedure Is Unable to Settle
  **Aesthetic Merit vs. Ethical Cost:** The procedure may reject a scene that is historically distorting but artistically profound (e.g., a metaphorical scene that captures an emotional truth while violating factual causality). The RFP prioritizes fidelity over art. It cannot weigh whether a lie is "worth it" for the sake of cinema.
  **The "Override" Threshold:** As seen in Case 3, the procedure cannot account for harms outside the historical record (e.g., cultural stereotyping, trauma to living descendants not covered by legal reps). The Board retains the right to reject scenes that pass all five tests if they violate broader ethical norms not captured by "Representational Fidelity."

  ### 4. The "Silence" Problem
  When the record is silent (Test 1 = No), the procedure permits invention provided it doesn't foreclose other theories. However, it cannot determine *which* invention is most respectful. Filling silence with *any* specific dialogue creates a false sense of knowledge. The Board must judge whether silence should remain silence (e.g., a scene with no dialogue) rather than filled with plausible fiction.

  ---
  **Board Instruction:** Use this protocol as a filter, not a verdict. A "Pass" indicates the scene is *historically permissible*, not that it is *ethically mandatory*. A "Fail" indicates a breach of fidelity that requires revision or explicit disclosure to the audience.
