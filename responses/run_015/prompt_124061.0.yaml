answer: |-
  The philosopher you are thinking of is **Simone Weil** (1909–1943). She worked in factories to understand labor, she was deeply mystical (though critical of institutional religion), and she died young (34, actually, though it feels like she lived three lives). The essay rattling around in your head is likely *On the Abolition of All Political Parties*, or perhaps sections of *The Need for Roots* and *Oppression and Liberty*.

  Her central argument was that a "collectivity" (a party, a union, a church) inevitably develops a drive for self-preservation that supersedes its original purpose. To survive, it seeks power; to wield power, it demands conformity; to ensure conformity, it discourages individual thought. She argued that truth is perceived by the individual mind, while the collective mind perceives only force.

  You are not being precious. You are describing the exact moment an organic movement risks becoming an institution. Here is a concrete breakdown of your situation using that framework, along with an analysis of your three options.

  ### 1. The Poll Result: Are you already there?
  **Yes.** The fact that nearly everyone privately disagrees with a plank but plans to vote "yes" anyway is the smoking gun.

  Weil would call this the onset of "collective pressure." It is not yet formalized in your bylaws, but it is already present in the culture. When members feel they must suppress their judgment to maintain group cohesion, the group has already begun to prioritize its own existence over the truth of its members' experiences.

  The person who told you "that's just what solidarity costs" is half-right. Tactical solidarity (we all strike on Tuesday even if I prefer Wednesday) is necessary for power. *Intellectual* solidarity (we all pretend to believe X when we believe Y) is corrosive. It creates a gap between the organization's public face and its internal reality. Over time, that gap widens until the leadership is negotiating based on a mandate the membership doesn't actually hold.

  ### 2. Analyzing the Three Models

  Here is how each option interacts with the "Weil Problem" (institutional self-preservation vs. individual conscience).

  **Option A: The National Coalition (Resources + Discipline)**
  *   **The Trade:** You trade autonomy for capacity.
  *   **The Risk:** This accelerates the institutional drift. External funding almost always comes with external metrics of success (e.g., "pass this bill" vs. "stop this eviction"). If the coalition's platform contradicts your members' lived reality, you will be forced to advocate for policies that don't help your building to satisfy the donors.
  *   **Weil's View:** She would view this as the "colonization" of your local truth by a distant abstraction.
  *   **Verdict:** Only take this if the resources are unrestricted and the platform is a *minimum* baseline, not a *maximum* ceiling. If you cannot contradict them publicly, you are no longer a union; you are a local chapter of a PR firm.

  **Option B: The Standard Setup (Committee + Discipline)**
  *   **The Trade:** You trade nuance for clarity.
  *   **The Risk:** This is the classic bureaucratic model. It creates a clear negotiating partner (landlords love this, actually, because they know who to bribe or threaten). However, it requires the "defend the line" rule you mentioned. This forces members to lie in public. Lying erodes trust. When members realize the public statements don't match private sentiment, cynicism sets in, and attendance drops.
  *   **Weil's View:** This is the "party system" she argued for abolishing. It creates a "collective will" that is a fiction, enforced by social pressure.
  *   **Verdict:** Efficient, but high risk of member burnout and alienation. It works for short-term wins, poorly for long-term culture.

  **Option C: No-Collective-Voice (Radical Transparency)**
  *   **The Trade:** You trade leverage for integrity.
  *   **The Risk:** This model (often seen in anarchist federations or spokescouncils) prevents the organization from lying. However, it makes negotiation difficult. A landlord cannot sign a deal with "400 individuals who mostly agree." They need a counterparty. If your spokespeople rotate by lottery, you lose institutional memory and negotiating skill. It also risks paralysis; if every statement requires a disclaimer, your messaging becomes weak.
  *   **Weil's View:** She would prefer this, as it protects the individual conscience. But she also recognized the need for *rootedness* and effective action. A group that cannot act decisively cannot protect tenants from eviction.
  *   **Verdict:** Morally robust, practically fragile at scale (400 members is very large for this model).

  **Option D: The Compromise (Whip on Founding Demands)**
  *   **The Trade:** You try to split the difference.
  *   **The Risk:** This is often the worst of both worlds unless defined carefully. If the "founding demands" are too broad, you're back to Option B. If they are too narrow, you can't mobilize.
  *   **Verdict:** This is viable *only if* the "whip" applies to **action**, not **speech**. (i.e., "We all strike on this," not "We all say this slogan.")

  ### 3. Concrete Suggestions for the Meeting

  You need a structure that allows you to wield power (which requires some unity) without crushing the judgment of your members (which requires transparency). Here are three concrete proposals to bring to the table:

  **1. Distinguish "Mandates" from "Platforms"**
  *   **Proposal:** The union votes on **Mandates** (specific actions: rent strike, legal filing, press conference) which require unity to be effective. Once a mandate passes, everyone participates or steps aside.
  *   **Distinction:** The union does *not* vote on **Platforms** (general ideological statements). Individuals can sign onto those personally.
  *   **Why:** This solves the "lying" problem. You don't have to believe a general theory of housing to agree that *your* rent is too high.

  **2. The "Dissenting Footnote" Rule**
  *   **Proposal:** Adopt the Standard Model (Option B) for efficiency, but amend the rule on public statements. If a significant minority (e.g., 20%) disagrees with a public statement, the statement must include a footnote or addendum summarizing the dissent.
  *   **Why:** This preserves the ability to negotiate (one voice) but institutionalizes the truth (we are not a monolith). It prevents the leadership from claiming a unanimity that doesn't exist.

  **3. Reject the Coalition's "Gag Order"**
  *   **Proposal:** Accept the money/staff *only if* the clause about "nobody publicly contradicts the platform" is removed.
  *   **Argument:** "We are a democratic union. Our strength comes from our members' genuine buy-in. If we are forbidden from debating our allies, we cannot correct course when the platform doesn't match local reality. We can sign onto the platform as a *baseline*, but we reserve the right to critique it from the left."
  *   **Why:** If they say no, you know they want soldiers, not partners. Walk away.

  ### 4. Addressing the "Debate Club" Fear
  The person who told you the alternative is a "debate club" is raising a real point. If you cannot make a decision and stick to it, you cannot stop an eviction.

  But there is a middle ground between "debate club" and "party discipline." It is called **Delegate Democracy**.
  *   **How it works:** The general membership sets the *goals* (e.g., "No evictions," "Repairs made").
  *   **The Shift:** The negotiating committee is given a *mandate* to achieve those goals, not a *script* to recite. They report back regularly. If the deal they bring back violates the mandate, the membership rejects it.
  *   **Why this helps:** It keeps the power with the members' *interests*, not the organization's *image*.

  ### Summary
  You are at the threshold. The poll results show the *culture* of conformity is already forming; the bylaws will either cement it or break it.

  *   **Simone Weil was right:** Organizations do tend to value their own survival over their purpose.
  *   **But Weil was incomplete:** You cannot fight a landlord with pure individual conscience. You need a machine.
  *   **The Goal:** Build a machine that has an "off switch" controlled by the members.

  If you adopt the "No-Collective-Voice" model, you might save your souls but lose the building. If you adopt the "Standard Discipline" model, you might save the building but lose the union (to bureaucracy).

  **Recommendation:** Push for the **Mandate vs. Platform** distinction. Unite on *actions* (what we do), diversify on *analysis* (what we think). And do not sign the coalition agreement if it forbids public dissent. That is a poison pill for a grassroots organization.
