  8.  **Final Polish:** Organize into clear sections: Translation, Residue Report, Assessment. Use LaTeX for math where helpful to solidify the MD framing. (e.g., $J(\pi)$, $R(s,a)$).

      *(Self-Correction on "Internal Reason"):* The prompt asks if "internal reason" can be captured *without* invoking non-observable mental states. In MD, if we can't observe the reward function, we have to infer it. If two policies are behaviorally equivalent, they are indistinguishable without structural assumptions. This is the crux of the residue.

