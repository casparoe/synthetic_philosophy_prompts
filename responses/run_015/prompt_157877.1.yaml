      *   **Task 2: Residue Report:** Analyze what translates cleanly, what requires distortion (e.g., mental state ontology), and what has no expression (specifically "internal reasons" without non-observable states).
      *   **Task 3: Assessment:** Evaluate whether the residue means philosophy relies on behaviorally invisible features MD ignores, or if MD's silence reveals a normative structure incentive alignment can't express.

  2.  **Initial Conceptual Mapping (Mental Draft):**

      *   *Philosophy:* Believing $P$ because it's true (RKR) vs. Believing $P$ because a demon threatens you (WKR).
      *   *MD/MARL:* Agent maximizes $R(s, a)$. Principal wants Agent to maximize $O(s, a)$ (Objective).
      *   *RKR:* Reward function $R$ is isomorphic to Objective $O$. Agent's policy $\pi$ optimizes $O$ directly.
      *   *WKR:* Reward function $R$ is a proxy. Agent optimizes $R$, which correlates with $O$ in training but diverges in distribution shift, or Agent finds a loophole (reward hacking) where $R$ is high but $O$ is low, yet observable behavior looks okay in the short term.
      *   *Justification:* Can we recover $O$ from the trajectory and $\pi$? Or do we need to posit an external side-payment $S$?

  3.  **Drafting the Restatement (Task 1):**

      *   *Context:* A "practice" (e.g., belief, promise-keeping) is a mechanism $M$.
      *   *Constitutive Norm:* The global objective function $J_{global}$ the mechanism is designed to optimize (e.g., Truth, Fidelity).
      *   *Agent:* The belief-former or actor.
      *   *Right Kind of Reason (RKR):* The agent's local reward function $R_{local}$ is aligned such that $\nabla_\theta \mathbb{E}[R_{local}] \propto \nabla_\theta \mathbb{E}[J_{global}]$. The policy $\pi$ is optimal w.r.t $J_{global}$ *because* the gradients align.
      *   *Wrong Kind of Reason (WKR):* The agent receives a side-channel reward $R_{side}$ (threat, bribe). The observable action $a$ satisfies the constraint of the practice, but the gradient comes from $R_{side}$, not $J_{global}$. This is classic Goodhart's Law or Reward Hacking. The behavior is implementable, but not *incentive compatible* with the mechanism's core purpose.
      *   *Justification:* Inverse Reinforcement Learning (IRL) problem. Can an observer infer $J_{global}$ as the driver of $\pi$? If the inferred reward is $R_{side}$, the action is unjustified *within the practice*, even if compliant.

  4.  **Drafting the Residue Report (Task 2):**

      *   *Clean Translations:*
          *   Normative force $\rightarrow$ Gradient direction.
          *   Compliance vs. Commitment $\rightarrow$ Behavioral equivalence vs. Reward function identity.
          *   Corruption of practice $\rightarrow$ Distributional shift/Robustness failure. If the side-payment stops, behavior collapses.
      *   *Distortions/Black-Box Issues:*
          *   Philosophy cares about the *content* of the mental state (believing *that P*). MD treats the agent as a black box optimizing a scalar.
          *   "Reasons" in philosophy are often propositional attitudes. In MD, they are scalar gradients.
          *   *The Big One:* Internal States. MD observes $(s, a, r)$. Philosophy cares about *why* internally. To capture "internal reason," we need to open the black box (network weights/activation patterns). If we treat the agent as a black box, WKR and RKR are behaviorally indistinguishable in the short run.
      *   *No Expression:*
          *   The *normative validity* of the objective itself. MD takes $J_{global}$ as given. Philosophy asks if Truth *ought* to be the norm.
          *   First-person authority. The agent knowing their own reason vs. an observer inferring it.

  5.  **Drafting the Assessment (Task 3):**

      *   *Option A:* Philosophy is fuzzy about things MD rightly ignores (behaviorism).
      *   *Option B:* MD is blind to the constitutive structure that makes the practice intelligible.
      *   *Synthesis:* It's likely Option B, but with nuance. The "constitutive norm" isn't just a loss function; it's what defines the *identity* of the action. In MD, an action is defined by its index in the action space. In Philosophy, an action (like "promising") is defined by the intent/norm.
      *   *Key Insight:* The WKR problem highlights that *robustness* is a function of alignment, not just performance. If the reward is a proxy, the system fails OOD (Out of Distribution). Philosophy calls this "failing to be a belief." MD calls this "catastrophic distributional shift."
      *   *Conclusion:* The residue isn't mystical; it's about *generalization bounds* and *causal structure* of the policy. MD ignores it because it focuses on equilibrium outcomes, not the causal provenance of the policy, unless explicitly modeling interpretability.

  6.  **Refining the Vocabulary:**

      *   Ensure terms like "Moral Hazard," "Hidden Actions," "Reward Shaping," "Proxy Alignment" are used correctly.
