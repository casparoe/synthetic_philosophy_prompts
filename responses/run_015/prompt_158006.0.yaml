answer: |-
  Your suspicion is correct: the impasse is not empirical but logical. The debate is stalled because the participants are operating with incompatible models of historical explanation while using the same terminology. Specifically, you have identified the fracture point: the conflation of **contrastive explanation** (why $A$ rather than $B$) with **comparative trajectory analysis** (how path $A$ differs from path $B$).

  Here is a structural diagnosis of the disagreement, grounded in the logic of causation and counterfactuals, followed by a judgment on the potential for progress.

  ### 1. The Modal Mismatch: Disagreement on Possibility Space
  The fundamental logical error in the Great Divergence debate is that the competing camps disagree on the **modal status** of eighteenth-century China, yet they argue as if they agree.

  *   **The Institutionalist Position (Implicitly):** For scholars emphasizing property rights, rule of law, or state capacity as *necessary conditions*, eighteenth-century Qing China lies outside the "possibility space" of industrialization. In their causal model, the probability of China industrializing without prior institutional change is effectively zero.
  *   **The Californian/Geographical Position (Implicitly):** For scholars emphasizing coal, colonies, or contingent triggers (like Pomeranz), eighteenth-century China lies *inside* the possibility space. They argue the probability was non-zero (perhaps 20–40%), and the divergence was the result of specific, contingent bottlenecks.

  **The Logical Conflict:**
  A contrastive explanation ("Why Britain and not China?") is only valid if the foil (China) is a **live counterfactual**.
  *   If the Institutionalists are right, asking "Why not China?" is category-error equivalent to asking "Why didn't this stone fly?" The answer is not a missing trigger; it is a lack of capacity.
  *   If the Californians are right, asking "Why not China?" is equivalent to asking "Why didn't this plane take off?" The answer is a missing trigger (coal/windfall).

  Because the camps do not explicitly debate the *probability* of the counterfactual but rather argue over *variables* (institutions vs. geography), they talk past each other. One side is explaining a failure of **potential**, the other a failure of **execution**. They cannot converge because they are measuring the distance to the outcome from different starting points.

  ### 2. The Causal Granularity Problem
  The debate also suffers from a mismatch in **causal granularity**, which masquerades as a disagreement over evidence.

  *   **Deep Causes (Institutions/Culture):** These operate on a timescale of centuries. They function as *background conditions* that constrain the probability space. In causal modeling terms, these are **structural parameters**.
  *   **Proximate Causes (Coal/Trade):** These operate on a timescale of decades. They function as *triggers* or **shock variables**.

  **The Logical Conflict:**
  Standard historical explanation often seeks a "sufficient cause." However, industrialization is a **complex adaptive threshold phenomenon**. It requires specific structural parameters (institutions) to be within a certain range *before* a shock variable (coal) can trigger the transition.
  *   When Institutionalists point to the lack of property rights, they are identifying a parameter setting that makes the system insensitive to shocks.
  *   When Geographers point to coal, they are identifying the shock that triggers the system *assuming* parameters are permissive.

  The impasse exists because neither side has a formal model that integrates parameters and shocks. Instead, they compete to claim their variable is the "real" cause. In reality, they are likely interacting non-linearly. Without a framework that acknowledges interaction effects (e.g., "Coal only matters if Institutions > $X$"), the debate remains a zero-sum competition for explanatory monopoly.

  ### 3. The Teleological Trap in Contrastive Questions
  Your distinction between contrastive explanation and trajectory analysis is the key to the framing problem.

  *   **Contrastive Explanation:** Presupposes a shared goal or endpoint ($E$). It asks: "Given both wanted/could achieve $E$, why did $A$ get it and $B$ did not?" This framing inherently validates the outcome (Industrialization) as the natural telos of economic development.
  *   **Trajectory Analysis:** Asks: "How did the internal dynamics of System $A$ evolve differently from System $B$?" This does not presuppose that System $B$ was "trying" to become System $A$.

  **The Logical Conflict:**
  The "Why not China?" question forces the Revisionists into a defensive position they logically should not occupy. If one believes that Qing China was on a stable, high-equilibrium trajectory that had no internal pressure to industrialize (a different telos), then the question "Why didn't they industrialize?" is anachronistic. It imposes a European endpoint as a universal standard of success.
  However, because the *question* structures the *research*, even skeptics feel compelled to answer it by searching for the "missing factor" in China. This validates the premise that industrialization was the default expectation. The debate is stuck because the **question itself performs ideological work** that prevents historical neutrality. To answer the question is to concede the premise.

  ### 4. Counterfactual Legitimacy and the "Single Causal Competition"
  You asked whether treating Britain and China as comparable candidates in a single causal competition is defensible. From the perspective of causal inference, it is **highly fragile**.

  For a counterfactual ("If China had coal, it would have industrialized") to be legitimate, the cases must be comparable on all confounding variables (*ceteris paribus*).
  *   **The Problem:** Britain and Qing China were not random variations of a single system. They were distinct systems with different state logics, kinship structures, and epistemic norms.
  *   **The Consequence:** There is no valid control group. You cannot hold "culture" or "state logic" constant to test the "coal" variable. Therefore, any claim that "Coal was the difference maker" relies on a **theoretical model** of how economies work, not on historical comparison.

  The disagreement is not about the history; it is about the **theoretical model of economy** applied to the history.
  *   Institutionalists use a **Neoclassical/Political Economy model** (agents respond to incentives).
  *   Californians use a **Ecological/Malthusian model** (systems respond to resource constraints).
  *   Culturalists use a **Sociological model** (action is embedded in meaning).

  Since the data cannot adjudicate between these underlying models (because the models dictate how the data is interpreted), the debate is theoretically underdetermined.

  ### Judgment: Is Progress Possible?

  **The Impasse is Structural, Not Empirical.**
  You should not expect convergence on the question "Why Britain and not China?" because the question demands a type of causal certainty that macro-history cannot provide, given the lack of comparable cases ($N=1$ for industrialization).

  **The Path Forward:**
  Progress is only possible if the field abandons the **contrastive frame** in favor of the **trajectory frame**.
  1.  **Stop asking "Why not?"** This question demands a deficit model (what did China lack?).
  2.  **Start asking "How did?"** This demands a process model (how did British growth become self-sustaining while Chinese growth remained extensive?).

  **Will this happen?**
  Unlikely in the short term. The "Great Divergence" is not just a historical puzzle; it is a proxy for debates about modernity, colonialism, and Western exceptionalism.
  *   The **Contrastive Frame** serves a political function: it either vindicates Western institutions (Institutionalists) or indicts Western luck/colonialism (Californians).
  *   The **Trajectory Frame** is politically neutered: it suggests that industrialization might be a peculiar, non-replicable accident specific to a specific configuration of variables, which satisfies no one's ideological narrative.

  **Conclusion:**
  The debate is ill-posed because it treats a **complex systems outcome** (industrialization) as a **simple causal effect** (missing variable). The stall is not due to missing data, but because the participants are using the same historical evidence to validate incompatible causal models (structural vs. contingent) while answering a question ("Why not China?") that presupposes a shared teleology which likely did not exist.

  As a journalist, the most accurate story is not to report on who is "winning" the debate, but to expose that the debate is a **category error**. The "Great Divergence" is not a mystery to be solved, but a historiographical artifact created by imposing a contrastive logic on non-comparable trajectories. Progress requires dissolving the question, not answering it.
