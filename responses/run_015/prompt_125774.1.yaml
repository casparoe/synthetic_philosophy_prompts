answer: |-
  You have identified a very specific, high-leverage cluster in decision theory and moral philosophy. You are right to feel that "costly signaling" and standard "commitment devices" are *almost* it but miss the crucial mechanism: the **involuntariness at the moment of action.**

  The literature does not have one single noun for this, but it is the central problem of **Dispositional Rationality**. The specific phenomenon you are describing is best understood as a **Constitutive Commitment** (as opposed to a Tactical Commitment).

  Here is the breakdown of the nearest established concepts, why they miss the mark slightly (validating your intuition), and where the boundaries lie.

  ### 1. The Nearest Established Concepts

  #### A. Robert Frank's "Emotions as Commitment Devices"
  *   **Source:** *Passions Within Reason* (1988).
  *   **The Fit:** This is the exact theoretical home for your Case 2 (running/guilt). Frank argues that rational calculation fails in time-inconsistency problems (like sticking to a diet or a running schedule) because the "future self" can always renegotiate. The solution is an emotional disposition (guilt, anger, love) that alters your utility function *in the moment*.
  *   **Why you rejected "Commitment Device":** You defined commitment devices as things you "install on purpose" that "mess with options." Frank's point is that the *most effective* commitment devices are not external (locking the cookies away) but internal (loving your future self so much that eating the cookies hurts).
  *   **The Distinction:** You are distinguishing between **Tactical Commitment** (Ulysses tying himself to the mast) and **Constitutive Commitment** (Ulysses loving the sirens less than his crew). Your examples are Constitutive. The payoff comes because the constraint is part of *who you are*, not *what you did*.

  #### B. David Gauthier's "Constrained Maximization"
  *   **Source:** *Morals by Agreement* (1986).
  *   **The Fit:** This covers Cases 1 and 3 (roommate and barista). Gauthier distinguishes between a **Straightforward Maximizer** (who defects whenever it pays locally) and a **Constrained Maximizer** (who has a disposition to cooperate even when local defection pays, provided others do too).
  *   **The Mechanism:** Gauthier argues it is rational to *be* a Constrained Maximizer because people can detect dispositions. If you are transparently unable to defect, you get offered deals the Straightforward Maximizer never sees.
  *   **Why it fits:** It captures the "load-bearing incapacity." If you could switch it off, you'd be a Straightforward Maximizer pretending to be Constrained, and (as Gauthier notes) you'd be detected and excluded.

  #### C. Thomas Schelling's "Credible Constraints"
  *   **Source:** *The Strategy of Conflict* (1960).
  *   **The Fit:** Schelling discusses how to make a threat or promise credible. The answer is often to **burn the bridge**. "I would pay you, but I literally cannot access the funds."
  *   **The Nuance:** Schelling usually talks about *strategic* self-binding (tactical). However, he acknowledges that the most credible binding is when the loss of control is **visible and permanent**. Your examples are "organic bridge-burning."

  ### 2. Why Your Rejections Were Partially Right

  You were right to reject **Costly Signaling**. In signaling theory (Zahavi/Handicap Principle), the agent *chooses* to bear the cost to prove quality. A peacock *could* grow smaller tails if it wanted to survive better, but it chooses the tail to signal genes. In your cases, the agent *cannot* choose the smaller tail at the moment of cost. It is not a signal; it is a **symptom of a constraint**.

  You were right to reject standard **Commitment Devices** *if* defined as external tools (apps, contracts). But in philosophy, a "commitment device" includes internal psychological mechanisms. The distinction you want is **Exogenous vs. Endogenous Constraints**.
  *   **Exogenous:** An app blocks the website. (You can uninstall it).
  *   **Endogenous:** Guilt blocks the website. (You cannot "uninstall" guilt in the moment without sociopathy).

  ### 3. Proposed Name and Definition

  Since you need a label for your seminar, I propose: **"Involuntary Dispositions"** or **"Constitutive Constraints."**

  If you want to sound like you've read the reading list: **"Parfitian Dispositions."** (Given you just did Hitchhiker).

  **Definition:** A behavioral trait is a *Constitutive Constraint* if:
  1.  **Local Suboptimality:** It forces the agent to take an action that lowers their utility in the specific instance (paying back money when broke; running when tired).
  2.  **Involuntariness:** The agent lacks the volitional capacity to override the trait at the moment of decision (the "switch" is broken).
  3.  **Global Optimality:** The trait exists *because* of its incapacity; the long-term payoff (trust, health, reputation) relies on the prediction that the agent cannot defect.
  4.  **Transparency:** The incapacity must be legible to others (for social cases) or the self (for private cases).

  ### 4. Boundary Cases

  You asked where to draw the edges. Here is the test: **Does the trait survive a local cost-benefit analysis?**

  *   **Ordinary Habits (Brushing teeth):**
      *   *Verdict:* **No.**
      *   *Reason:* If you were sick or in a rush, you *could* skip it without psychological devastation. It is automatic, but not *binding*. It doesn't cost you anything to skip occasionally, so the "incapacity" isn't load-bearing.
  *   **Addiction:**
      *   *Verdict:* **No (Inverse Case).**
      *   *Reason:* Addiction is an involuntary trait that costs you *globally* to satisfy a *local* urge. Your pattern is the reverse: costs *locally* to satisfy a *global* interest. Addiction is a **failed commitment device**; your pattern is a **successful one**.
  *   **Rigid Principles (Kantian Duty):**
      *   *Verdict:* **Yes.**
      *   *Reason:* If you hold a principle ("I never lie") such that you physically cannot bring yourself to lie even to save money, that is a Constitutive Constraint. The "cost" is the missed opportunity to lie; the "payoff" is the integrity/reputation.
  *   **Temperament (Short fuse):**
      *   *Verdict:* **Maybe.**
      *   *Reason:* If having a short fuse deters people from messing with you (Case 3), it fits. But if it just makes you unhappy, it's just a flaw. The test is: *Does the rigidity generate a surplus that a flexible person couldn't capture?*

  ### 5. The Institutional Question (Crowding Out)

  You asked: *"Is it part of the same thing... that these traits seem to matter less where an institution does the job?"*

  **Yes.** This is known in behavioral economics as **Motivational Crowding Theory** (Frey & Jegen, 2001).

  *   **The Mechanism:** External incentives (public reliability scores, contracts, surveillance) can "crowd out" internal dispositions.
  *   **Why:** If a bank guarantees your roommate's debt, his personal disposition to repay is no longer the load-bearing factor for trust. The *institution* becomes the commitment device.
  *   **The Consequence:** Over time, if you rely too much on external enforcement, people may actually *lose* the internal disposition (the "moral muscle" atrophies).
  *   **Application to your cases:**
      *   **Roommate:** If there were a credit score, his "incapable of not paying" trait becomes less valuable economically, though it might still be valuable socially.
      *   **Barista:** If the chain had a strict "no refund" policy enforced by software, the barista's rigidity would be fired, not rewarded. The trait only pays off in the "gap" where institutional enforcement is too expensive or coarse.

  ### Summary for your Seminar

  If you need to present this, frame it as the distinction between **Tactical Precommitment** (Ulysses tying himself to the mast) and **Constitutive Incapacity** (Ulysses having no desire to steer toward the sirens).

  The pattern is **Dispositional Rationality**: The rationality lies in the *selection of the disposition*, not in the *individual acts* the disposition produces. The acts look irrational (paying when broke); the disposition is hyper-rational (being the kind of person who gets trusted).

  The specific "flavor" you are noticing—the fact that it *must* be involuntary to work—is the **Credibility Condition**. As Schelling noted, a threat is only credible if you cannot back down. A promise is only credible if you cannot break it. Your examples are simply **promises made of flesh rather than words.**
