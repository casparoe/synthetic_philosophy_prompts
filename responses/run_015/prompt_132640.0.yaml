answer: |-
  **Joint Statement: Adversarial Collaboration on Biological Function**
  **Signatories:** The Selected-Effects Etiologist & The Causal-Role Pluralist
  **Date:** Oct 24, 2023

  **Part 1: What We Actually Agree On**

  Despite our reputations, we aren't fighting about everything. Before we get into the weeds, we want to state clearly where our positions overlap. We both sign onto the following:

  1.  **Malfunction is real.** It's not just statistical deviation. When a heart fibrillates, it isn't just doing something rare; it's failing to do what it's *supposed* to do. We agree there is a normative fact of the matter here, not just a frequency count.
  2.  **Function ascriptions do normative work.** Saying "X has function F" isn't just describing what X does; it sets a standard for success. If X doesn't do F, X is broken. We both accept that function talk licenses evaluations of performance.
  3.  **Engineered organs are a problem.** We agree that engineered organs without evolutionary ancestors (like a synthetic kidney grown from scratch) pose a serious problem for at least one side of this debate. Either the theory can't account for their functions, or it has to stretch the definition of "function" until it breaks. We don't agree on *which* theory breaks, but we agree the tension exists.

  **Part 2: Where We Split (The Disagreements Table)**

  Below are the cruxes where our predictions diverge. We've tried to keep the wording neutral enough that we both accept the description of our own views. We also flagged where we suspect we might just be arguing over words (e.g., "proper function" vs. "system contribution").

  | Crux | Concrete Case / Hypothetical | SE Etiologist Prediction | CR Pluralist Prediction | Is this just verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Murky History** | **The Human Appendix.** Current data suggests selection history is weak or vestigial, but it currently contributes to gut flora regulation. | If the selection history is murky or absent, it has no **proper function**. It might have a causal role, but calling it "functional" in the biological sense is mistaken. | If it contributes to the capacity of the immune system now, it has a **system function**. History matters less than current contribution to the containing system. | **Yes/No Mix.** Partly verbal. SE reserves "function" for evolutionary success; CR uses it for current capacity. But it affects medical treatment protocols. |
  | **2. Synthetic Tech** | **Synthetic Gene Drives.** A CRISPR-based drive released in mosquitoes to suppress malaria. It has no evolutionary past. | It has no biological **proper function**. It is an artifact with a designed purpose, but biologically speaking, it's just a causal disruptor. | It has a **functional role** within the ecological system (population suppression). The origin (design vs. evolution) doesn't negate the functional ascription. | **Mostly No.** This isn't just semantics. It determines whether we treat synthetic biology as "natural" functionally or as external interference. |
  | **3. Normativity Source** | **Congenital Defect.** A baby born with a heart defect that prevents blood pumping. | The malfunction is defined by the **history of selection** on the heart type. The token is broken because it deviates from the selected-effect standard. | The malfunction is defined by the **failure to contribute** to the organism's viability. The norm comes from the system requirements, not just history. | **No.** This is a substantive metaphysical disagreement about where norms come from (past vs. present). |

  **Notes on the Collaboration**

  We suspect some of the fight is verbal—specifically when the SE side says "proper function" and the CR side hears "system contribution." If we strictly separate those terms, some disagreements vanish. However, because biologists use "function" loosely to cover both, we can't just dissolve the dispute by stipulation. We have to figure out which concept does the heavy lifting in specific scientific contexts.

  Also, we need to remember that teh engineered organ case (Claim #3) is the biggest stress test. If we can't agree on the status of a lab-grown liver, the rest of this might not matter for future medicine.

  We commit to testing these predictions against new data without moving the goalposts.

  *(signed)*
  **The SE Etiologist**
  **The CR Pluralist**
