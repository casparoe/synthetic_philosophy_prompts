answer: |-
  **MEMORANDUM**

  **TO:** All Enrolled Students, Epistemology 101
  **FROM:** Office of Pedagogical Surprise (OPS)
  **RE:** Administrative Resolution of Midterm Timing Conditions

  **1. What are the statutory conditions for the exam?**
  The midterm will occur on day $d$ within the window [Monday, Friday]. The selection of $d$ is compliant if and only if, at 21:00 on day $d-1$, no enrolled student possesses knowledge that $d$ is the exam day. Please note the distinction between "unannounced" and "unpredictable." The exam is announced; its timing is the variable subject to epistemic restriction.

  **2. Students argue the exam cannot occur on Friday. Is this correct?**
  No. This argument relies on backwards induction that assumes knowledge closure under known implication. The Office maintains that the compliance clause creates a blindspot. If a student were to deduce on Thursday at 21:00 that the exam must be Friday, that student would possess knowledge that $d=$ Friday. However, possession of such knowledge renders $d=$ Friday non-compliant. Since the Office guarantees compliance, the student cannot possess such knowledge. Therefore, Friday remains a live candidate. The condition is self-sealing; the deduction defeats itself.

  **3. What is the special status of the last possible day?**
  The last day is not exempt from the surprise condition, but it is exempt from the *possibility* of prior elimination. While students often claim the last day is logically impossible, the Office treats the last day as an epistemic firewall. Knowing the exam is on the last day violates the surprise condition; therefore, under Office policy, such knowledge is structurally inaccessible to the enrolled cohort until the exam is distributed. You cannot know what would invalidate the condition required for it to be true.

  **4. Does high credence constitute knowledge?**
  Not strictly, but it is administratively awkward. The Office has set an official Surprise Threshold at a credence level of $p < 0.85$. If polling indicates student credence exceeds this threshold, the Office does not cancel the exam, but it does file an embarrassment report. Knowledge requires truth and justification; high credence requires only confidence. Students are advised to maintain doxastic humility to avoid triggering administrative shame. If you are too sure, you are not wrong about the date, but you are wrong about the surprise.

  **5. Why is the student betting market a compliance violation?**
  External prediction markets aggregate private information into public knowledge. If the market odds shift to 95% for Friday, students arguably come to *know* the exam is on Friday via testimony of the market mechanism. This violates the 21:00 condition. Consequently, the Office has shuttered the market. Please note that shutting the market removes the source of justification, thereby restoring the ignorance required for compliance. The surprise destroyed by the market is restored by its prohibition. The ban is the reset button.

  **6. What is expected of a student's head on Thursday evening?**
  At 21:00 on Thursday, the student should not conclude "It must be Friday." To conclude this is to know this. To know this is to invalidate Friday. The Office requires a state of suspended judgment. You should feel uncertainty, even if logically you feel none. If you feel certain, you are incorrect, because if you were correct, you wouldn't feel certain. We recommend distracting yourself with non-epistemic activities.

  **7. Does this policy apply elsewhere?**
  Effective immediately, the Surprise Clause extends to all scheduled fire drills and the Office of Pedagogical Surprise's own office hours. You will not know when we are available until we are not.

  **Office of Pedagogical Surprise**
  *Certified Epistemic Compliance Division*
