  # Session Plan: The Unilateralist's Curse Simulation

  ## 1. Core Game Design & Arithmetic

  **The World:**
  In every round, the "World State" is either **Beneficial (B)** or **Hazardous (H)**.
  *   $P(B) = 0.5$, $P(H) = 0.5$.

  **The Signal:**
  Each participant receives one private card (signal) indicating **GO** or **STOP**.
  *   **Accuracy ($p$):** 90%.
  *   **If World is Beneficial:** 90% chance of GO, 10% chance of STOP.
  *   **If World is Hazardous:** 10% chance of GO (False Positive), 90% chance of STOP.

  **The Action:**
  *   **Wait:** Everyone gets **0 points**.
  *   **Launch:** Triggered if **at least one** participant in the decision unit votes GO.
      *   If World is Beneficial: Everyone gets **+10 points**.
      *   If World is Hazardous: Everyone gets **-30 points**.

  **The Arithmetic (Why this works):**
  *   **Single Decider ($N=1$):**
      *   If they see GO, $P(B|GO) = 0.9$.
      *   $EV = (0.9 \times 10) + (0.1 \times -30) = 9 - 3 = \mathbf{+6}$.
      *   *Verdict:* Rational to launch. (Constraint met: "Barely right" — positive but risk exists).
  *   **Small Group ($N=4$):**
      *   $P(\text{Launch}|B) = 1 - (0.1)^4 \approx 1.0$.
      *   $P(\text{Launch}|H) = 1 - (0.9)^4 = 1 - 0.656 = 0.344$.
      *   $EV = (0.5 \times 1.0 \times 10) + (0.5 \times 0.344 \times -30) = 5 - 5.16 = \mathbf{-0.16}$.
      *   *Verdict:* Break-even/Slight Loss. (Shows the tipping point).
  *   **Large Group ($N=20$):**
      *   $P(\text{Launch}|B) \approx 1.0$.
      *   $P(\text{Launch}|H) = 1 - (0.9)^{20} = 1 - 0.12 = 0.88$.
      *   $EV = (0.5 \times 1.0 \times 10) + (0.5 \times 0.88 \times -30) = 5 - 13.2 = \mathbf{-8.2}$.
      *   *Verdict:* Clear Loss. (Constraint met: "Clearly worse").

  **The Asymmetry:**
  Adding players from 4 to 20 increases the chance of catching the Beneficial state from 100% to 100% (no gain), but increases the chance of triggering the Hazardous state from 34% to 88% (massive risk).

  ## 2. Materials & Logistics

  **Materials:**
  *   **120 Envelopes:** Pre-filled with cards.
      *   **Set B (Beneficial):** 18 "GO" cards, 2 "STOP" cards. (Prepare 60 of these).
      *   **Set H (Hazardous):** 2 "GO" cards, 18 "STOP" cards. (Prepare 60 of these).
      *   *Note:* 90% accuracy requires 18/20 split.
  *   **Decision Cards:** 20 Red (Launch), 20 Blue (Wait). Or simply use the GO/STOP cards as their vote (GO = Launch, STOP = Wait). *Recommendation:* Use the Signal Card itself as the vote to reduce friction. If they hold up GO, they launch.
  *   **Whiteboard:** For the "Common Pot" score.
  *   **Timer:** Visible to all.

  **Scoring System:**
  *   **The Common Pot:** All points go into a single group score on the whiteboard.
  *   **Individual Scorekeeping:** None. This prevents "free rider" anxiety and enforces the shared stake.
  *   **Value:** 100 Points = Coffee/Break extension or simply "Bringing Rights" for the next session. Keep it low-stakes but tangible.

  **Enforcement (The Silence Tax):**
  *   **Rule:** "Absolute Silence from Distribution to Reveal."
  *   **Penalty:** If *anyone* speaks, signals, or makes eye contact intended to coordinate during a round, the **Common Pot loses 50 points** immediately.
  *   **Why:** This is higher than the maximum possible gain in a round (+10), making compliance the dominant strategy without needing moralizing.

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Rules** | Explain payoffs (+10/-30/0). Explain signals (90% accurate). Explain Silence Tax. **Do not name the curse.** |
  | **10-25** | **Rounds 1 & 2 (N=4)** | Split into 5 tables of 4. Each table gets independent World State. <br> *Rule:* If *anyone* at table holds up GO, Table Launches. <br> *Goal:* Show small groups are viable/break-even. |
  | **25-40** | **Rounds 3 & 4 (N=20)** | Whole room is one unit. One World State for everyone. <br> *Rule:* If *anyone* in room holds up GO, Room Launches. <br> *Goal:* Feel the catastrophic loss. |
  | **40-50** | **Variant 1 (Expert)** | Whole room. One person (privately told) gets **2 signals** (99% accuracy). <br> *Rule:* Anyone can still launch. <br> *Goal:* Show expertise doesn't fix unilateralism. |
  | **50-60** | **Variant 2 (Correlated)** | Whole room. Everyone gets the **same signal** (Facilitator announces "All GO" or "All STOP"). <br> *Rule:* Anyone can launch. <br> *Goal:* Show independence is the cause of the curse. |
  | **60-90** | **Debrief** | Reveal the thesis. Map experience to theory. Derive the threshold solution. |

  ## 4. Variant Rounds

  **Variant 1: The Expert (Epistemic Inequality)**
  *   **Design:** One participant receives an envelope with *two* cards. They are instructed: "If either card says GO, your signal is GO." (Accuracy $\approx 99\%$). Everyone else gets standard 90% signals.
  *   **Reveal:** In the debrief, ask: "Did the Expert's presence stop the losses?"
  *   **Point:** No. Because the rule is *unilateral*, a novice with a false positive (10% chance) overrides the expert's true negative. Deference is not automatic; it requires a structural threshold.

  **Variant 2: Correlated Errors (Independence)**
  *   **Design:** Facilitator draws *one* card and announces it to the room. Everyone holds up that card.
  *   **Reveal:** The group score should jump back to positive (similar to $N=1$).
  *   **Point:** The curse is not caused by *error*, but by *independent* error. If we all make the same mistake, we don't compound the risk of activation. This isolates the statistical mechanism.

  ## 5. The Debrief (5-Minute Core + Discussion)

  **The Reveal:**
  1.  **Name It:** "You have just experienced the **Unilateralist's Curse** (Bostrom, Douglas, Sandberg)."
  2.  **The Map:**
      *   *Rounds 1-2:* Showed that individual rationality ($EV +6$) scales poorly.
      *   *Rounds 3-4:* Showed that $N=20$ turns a positive expectation into a negative one because $P(\text{False Launch})$ approaches 1 faster than $P(\text{True Launch})$ saturates.
      *   *Variant 1:* Showed that better information doesn't help if the *decision rule* remains "anyone."
      *   *Variant 2:* Showed that independence is the engine of the curse.
  3.  **The Fix (Thresholds):**
      *   Ask: "How many GOs should we require to launch?"
      *   Guide them to $k$ of $N$.
      *   For $N=20$, to keep $P(\text{Launch}|H)$ low (e.g., < 10%), we need $k$ high.
      *   If we require 3 GOs: $P(\text{Launch}|H) \approx 0.32$. If we require 5 GOs: $P(\text{Launch}|H) \approx 0.04$.
      *   **Conclusion:** The remedy is not "be more careful" (exhortation), but "raise the threshold" (institutional design).

  ## 6. Honesty Section: Limitations & Failures

  **1. Predictable Participant Failures:**
  *   **The Principled Pacifist:** One person will *never* hold up GO, even with a GO signal, fearing the -30.
  *   **The Cowboy:** One person will *always* hold up GO, treating it as a game.
  *   **Handling:** Do not stop the game. In the debrief, explicitly point to them: "The Pacifist was acting as a de facto threshold of $N$. The Cowboy was acting as a threshold of 1. The curse exists because the Cowboy's threshold rules." This validates their behavior as part of the data, not disruption.

  **2. Real-World Features Missing:**
  *   **Unknown Payoffs:** In the game, everyone knows $V=10, C=30$. In reality (e.g., geoengineering, AI release), the costs are contested and uncertain. The game makes the rationality calculation cleaner than it ever is in policy.
  *   **Reputational Asymmetry:** In the game, losses are shared equally. In reality, the launcher often gains prestige ("The person who did it"), while the losers share the ruin. This incentivizes launching *more* than the game does.
  *   **Cost:** This reduces the "feel" of moral hazard. You will have to verbally add this layer in the debrief.

  **3. Misleading Impression:**
  *   **The "Group" Boundary:** The game assumes $N=20$ is fixed and obvious. In the real world, the hardest part of solving the Unilateralist's Curse is **defining who counts as a decider**. (e.g., Does a lab in China count if you are in the US? Does a non-state actor count?). The game implies that if we just agree on a threshold, we are safe. In reality, agreeing on the *constituency* is the political battle. You must correct this: "The math works if we all agree on who 'we' are. Usually, we don't."

  ## 7. Scoring Sheet (Whiteboard Layout)

  ```text
  COMMON POT SCORE
  ----------------
  Start:          0
  Round 1 (N=4):  [Facilitator adds/subtracts based on 5 tables]
  Round 2 (N=4):  [...]
  Round 3 (N=20): [...]
  Round 4 (N=20): [...]
  Variant 1:      [...]
  Variant 2:      [...]
  ----------------
  FINAL:          ___
  ```

  *Note: For Rounds 1-2, calculate the average EV per table and multiply by 5, or sum the actual outcomes of the 5 tables for speed.*
