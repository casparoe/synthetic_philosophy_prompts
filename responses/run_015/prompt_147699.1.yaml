          *   If $L$ & $Good$: Everyone gets $+V$.
          *   If $L$ & $Bad$: Everyone gets $-C$.
      *   *Constraint 1 (Single Decider):* $EV(L | F) > 0$ but small.
          *   $P(Good|F) \cdot V + P(Bad|F) \cdot (-C) > 0$.
          *   Using Bayes: $P(Good|F) = \frac{p \cdot 0.5}{p \cdot 0.5 + (1-p) \cdot 0.5} = p$.
          *   So, $p \cdot V - (1-p) \cdot C > 0 \Rightarrow pV > (1-p)C \Rightarrow \frac{V}{C} > \frac{1-p}{p}$.
          *   To make it "barely right," let $\frac{V}{C} \approx \frac{1-p}{p}$.
      *   *Constraint 2 (20 Deciders):* $EV(Group) < 0$.
