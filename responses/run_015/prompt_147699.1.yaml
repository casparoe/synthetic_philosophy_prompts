          *   20 deciders, anyone-can-launch: Clearly negative EV (worse than status quo).
          *   Damage grows with group size (asymmetry of signal saturation).
          *   Points system (shared stakes, individual scorekeeping shouldn't undermine shared stakes).
          *   Two variant rounds (choose 2 out of 3 provided options).
