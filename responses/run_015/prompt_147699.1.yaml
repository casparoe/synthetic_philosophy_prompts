          *   We want $1 - (1-p)^N$ to be high (capture the good) but $1 - p^N$ to be *too* high (trigger the bad).
          *   Actually, the curse arises because in the Bad state, *any* false positive triggers the loss. In the Good state, *any* true positive triggers the gain.
          *   The problem is that as $N$ increases, $P(\text{Launch}|Bad)$ approaches 1 much faster than is acceptable given the cost $C$.
