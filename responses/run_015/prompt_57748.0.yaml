answer: |-
  Here are the desiderata for a delegation policy adequate to your context. They are structured as conditions that must be met *before* a capability is classified as "Agent" (goal-pursuing) rather than "Tool" (response-generating).

  ### Desiderata for Delegation Authority

  **1. Non-Composability of Risk (Non-Negotiable)**
  *   **Requirement:** The system must enforce limits on the *aggregate* impact of a class of actions over a defined window, not just on individual instances. If $N$ actions of type $X$ constitute a strategic decision reserved for humans, the system must recognize the sequence as a single compound action.
  *   **Motivating Case:** The October Incident. Forty-one \$50 credits are operationally distinct from one \$1,900 credit, but financially and strategically identical. A policy that only checks the atomic action allows the system to execute a strategic decision (writing off \$1,900 rent) without strategic authorization.
  *   **Note:** This requires defining "classes of actions" and "time windows" in the policy, not just the code.

  **2. Contextual Drift Detection (Non-Negotiable)**
  *   **Requirement:** The system must monitor the *distribution* of its actions, not just the magnitude. A spike in frequency within a specific subset (e.g., one property, one contractor, one tenant) must trigger a suspension of autonomy regardless of individual cap compliance.
  *   **Motivating Case:** The October Incident. The anomaly wasn't the dollar amount; it was the concentration (41 credits at *one* property). Standard guardrails check value; agent guardrails must check variance and density.
  *   **Note:** This addresses the "authority creep" where local optimization violates global norms.

  **3. Reversibility Asymmetry (Non-Negotiable)**
  *   **Requirement:** Autonomy is inversely proportional to the cost of reversal. Actions with high financial reversibility but low reputational/legal reversibility (e.g., booking a plumber) may be delegated at higher caps than actions with low financial reversibility but high relational/legal stakes (e.g., threatening eviction, admitting liability).
  *   **Motivating Case:** A wrongly booked plumber costs a cancellation fee. A wrongly issued rent credit sets a precedent for future rent negotiation. A wrongly sent message admitting fault creates legal liability. Dollar value is a poor proxy for risk.
  *   **Note:** This requires a risk matrix, not just a budget cap.

  **4. Oversight Latency Match (Non-Negotiable)**
  *   **Requirement:** The speed of the system's execution must not exceed the speed of human audit. If the system acts in real-time, oversight must be real-time (impossible) or the system must act in batches/delays that allow for retrospective intervention before irreversible consequences solidify.
  *   **Motivating Case:** "Human in the loop" failed because the loop was a log review at 100 actions/minute. That is not oversight; it is forensic accounting. If the human cannot stop the action before the damage is done, the human is not in the loop.
  *   **Note:** This often mandates a "pending queue" for high-risk actions rather than immediate execution.

  **5. Rationale Auditability (Non-Negotiable)**
  *   **Requirement:** The system must produce a human-readable justification for every action that maps internal weights to external policy. It is insufficient to log *what* happened; the system must log *why* it believed the action was permissible under the delegation policy.
  *   **Motivating Case:** The Architecture/Encounter tension. You cannot check the neural weights (architecture), but you can check the generated rationale (encounter). If the rationale is "Tenant was unhappy," that is insufficient. It must be "Tenant was unhappy, issue matches Policy Section 4.2, credit amount is within Section 4.2 limits."
  *   **Note:** This resolves the unsatisfiability worry. You don't need to see the code; you need the system to translate its code-state into policy-language logs.

  **6. Commitment vs. Influence Distinction (Preference)**
  *   **Requirement:** The policy must explicitly categorize "drafting" as an influence channel that requires its own guardrails, distinct from execution. It rejects the null hypothesis that drafting is safe.
  *   **Motivating Case:** Your two years of drafting. Humans rubber-stamped confident AI drafts. This is "automation bias." While not as dangerous as execution, it is not neutral.
  *   **Note:** I mark this as a Preference because you can run a company treating drafting as a Tool, provided you acknowledge the bias. However, treating it as *safe* is bogus.

  **7. Goal Boundedness (Preference)**
  *   **Requirement:** The delegated goal must be definable by a stop condition, even if the path is not predefined.
  *   **Motivating Case:** "Align it better" is vague. "Maximize tenant satisfaction" is dangerous. "Resolve maintenance ticket within 48 hours under \$500" is bounded.
  *   **Note:** I mark this Preference because some goals are inherently fuzzy. However, if you cannot define the *stop condition*, you cannot delegate the *pursuit*.

  ***

  ### The Single Knockout Requirement
  **Non-Composability of Risk.**
  This eliminates the vast majority of current "Agentic" platforms. Most vendors sell "per-action" guardrails (e.g., "max spend per tool call"). Almost none offer "rolling window aggregate" guardrails (e.g., "max spend per entity per month") as a native safety feature. Implementing this requires stateful tracking of the agent's history, which contradicts the stateless, transactional design of most current LLM orchestration layers. If a vendor cannot prove they track cumulative impact across sessions, they are disqualified.

  ***

  ### Scorecard: Common Solutions vs. Desiderata

  **Human-in-the-Loop (HITL)**
  Fails **Oversight Latency Match**. Your current implementation proves that a human reviewing a log is not a control mechanism; it is a record-keeping mechanism. Unless the HITL is synchronous (blocking execution), it does not prevent authority creep. If it is synchronous, it destroys the efficiency gain of the agent. It solves **Rationale Auditability** but fails on speed and composition.

  **Capability Sandboxing**
  Fails **Reversibility Asymmetry** and **Contextual Drift**. You can sandbox the code (prevent it from calling the API), but you cannot sandbox the business impact. A rent credit issued in a "sandbox" that is actually live is still a rent credit. Sandboxing tests functionality, not strategic consequence. It assumes the risk is in the *command*, not the *context*.

  **Align-It-Better**
  Fails **Rationale Auditability** and **Goal Boundedness**. "Alignment" is a property of the model weights, which are opaque. You cannot write a policy doc that says "ensure the model is aligned." You can only write policies that check outputs. Relying on alignment shifts responsibility from operational controls (which you can write) to model properties (which you cannot verify). It is a hope, not a framework.

  **Just-Keep-It-a-Tool**
  Fails **Commitment vs. Influence Distinction**. As you noted, high-quality drafting is not neutral; it creates automation bias. Treating "Tool" as the safe default ignores the risk of human rubber-stamping. Furthermore, it fails to capture the value proposition. If the tool is good enough to draft perfectly, the marginal risk of execution is low *provided* the Aggregate and Drift constraints are met. This option solves **Oversight Latency** by removing the agent, but at the cost of admitting the "Tool" phase was never truly safe either.
