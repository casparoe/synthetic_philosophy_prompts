  ### The Breakdown

  I am treating these five factors as weighted conditions. A high probability here means the factor *favors* the possibility of text-only understanding. I combine them using a **weighted average**, but with a **conjunctive penalty**: if either "Grounding" or "Subject" scores very low, they cap the maximum possible score regardless of the others, because I treat them as potential categorical blockers.

