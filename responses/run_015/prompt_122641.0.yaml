answer: |-
  It is fascinating that you caught the friction points so quickly because most people accept these codes as monolithic when they are actually stitched together from at least three or four conflicting ethical frameworks. You are right to feel that the clauses do not come from one place, and if you try to force them into a single implicit view, you end up with something like a theory of Conservative Restorationism. This view presupposes that there is a true, authentic athletic self that exists prior to intervention, and the moral goal of the code is to allow repairs to that self while forbidding upgrades. However, the definition of that true self shifts uncomfortably depending on which clause you are reading. In the exemption clause, the true self is the healthy human organism defined by medical consensus. In the baseline clause, the true self is the historical individual defined by their own past data. In the deficiency clause, the true self is a statistical abstraction defined against the general population. The code hangs together not because these definitions are compatible, but because they usually point in the same direction for the most common cases, masking the theoretical incoherence until you hit edge cases like the consistency compound or the availability clause.

  The enforcement clause is the tell that reveals the whole structure is probably pragmatic rather than philosophical. By punishing presence rather than advantage, the code abandons the goal of fairness in outcome and adopts a goal of boundary maintenance. This suggests the single implicit view is not actually about therapy or enhancement at all, but about administrative enforceability wrapped in the language of ethics. If the wrong were truly unfairness, then a substance that provided no advantage would not be punished, yet you note that presence alone is sufficient for sanction. This means the core presupposition is deontological rather than consequentialist; the act of crossing the boundary is the sin, not the result of the act. This allows the drafters to mix and match theories of fairness without having to resolve the contradictions, because the enforcement mechanism doesn't care about the fairness outcome, only about the violation of the rule. So, to answer your question about whether a single view makes it hang together, I would say the unifying principle is institutional integrity rather than philosophical consistency. The code assumes that sport is a game defined by arbitrary constraints, and the primary evil is cheating those constraints, regardless of whether the cheat actually altered the level playing field.

  When you look at which bits are strictly required versus which are comfortable bedfellows, the distinction between restoration and augmentation is the only non-negotiable core. Almost every clause you described relies on the intuition that fixing a broken thing is permissible but improving a functioning thing is not. The deficiency clause, the baseline clause, and the exemption clause all require this distinction to function. However, the availability clause is a comfortable bedfellow rather than a required component. It is possible to have a restorationist code that bans cheap over-the-counter substances if they are deemed augmentative, just as it is possible to allow specialist clinic interventions if they are deemed restorative. The decision to link fairness to cost and access is a sociological add-on that tries to address equity without changing the underlying metaphysics of restoration. Similarly, the consistency compound clause is underdetermined by the rest of the package. The restorationist logic doesn't tell us whether reducing variance is cheating, because variance isn't health. Allowing it because it doesn't raise the ceiling smuggles in a specific theory of sport as a test of maximum capacity rather than a test of reliable performance. This is not required by the therapy/enhancement distinction and could easily be swapped for a rule that bans anything altering natural variance, restorative or not.

  If you were to drop the therapy/enhancement distinction and rebuild the code around health and safety plus equal access, the code would look radically different and most of your clauses would vanish. The exemption and baseline clauses would become irrelevant because the medical status of the athlete would not matter, only the safety profile of the intervention. The deficiency clause would disappear because statistical normality is not a safety metric. The availability clause would become the central pillar, potentially expanded to require that any permitted performance aid be subsidized for those who cannot afford it. Enforcers would no longer measure substance presence in samples but would instead audit supply chains and conduct health outcome monitoring on athletes over time. You would need to measure long-term morbidity rather than acute intoxication, and you would need to measure income and access rather than urine composition. The consistency compound would likely be permitted unless it had side effects, and the external energy device ban might flip if the device was safe and could be mass-produced cheaply. This model turns anti-doping into a public health and labor rights issue rather than a moral policing of natural talent.

  If you rebuilt around levelling the natural lottery, which is the opposite of what most anti-doping codes attempt, almost every clause you described would flip. The current code protects natural talent from artificial aid, but a lottery-leveling code would restrict natural talent to help the less gifted. The deficiency clause would become a mandate to bring everyone up to the median rather than just helping the bottom percent. The baseline clause would be inverted to prevent athletes from returning to a high pre-injury baseline if that baseline was genetically exceptional. Enforcers would have to start measuring genetic markers and innate physiological capacity, creating a handicap system similar to golf but based on biology. The exemption clause would likely be banned because restoring a gifted athlete to their natural state perpetuates the unfairness of the lottery. This approach is theoretically coherent but practically dystopian, requiring a level of bodily intrusion and social engineering that the current code avoids by pretending that the natural lottery is fair and only artificial interventions are not.

  Finally, if you rebuilt around capping total advantage regardless of source, you would keep the baseline clause but discard the substance-specific bans. The focus would shift from what you put in your body to what your body can do. Enforcers would need to measure performance outputs directly, perhaps through standardized testing batteries, rather than testing for substances. If an athlete exceeds a certain threshold of power or endurance, they are disqualified regardless of whether it came from genetics, training, nutrition, or drugs. The availability clause would become irrelevant because cheap methods would be banned if they pushed you over the cap. The consistency compound would be banned if it pushed your average performance over the limit, even if your peak stayed the same. This model treats sport as a competition within a fixed range of human capability, rather than a competition to see who can maximize capability within rules. It solves the problem of defining enhancement by simply defining a maximum, but it requires a level of performance monitoring that conflicts with the unpredictability that makes sport watchable.

  What strikes me most about your description is that the current code is underdetermined precisely where it matters most, which is the definition of the natural. The code assumes we know what is natural when we see it, but the clauses reveal that natural is sometimes what is healthy, sometimes what is historical, and sometimes what is statistically average. The enforcement clause papers over this by refusing to adjudicate the degree of advantage, treating the boundary itself as the sacred object. If you want to find the genuine tension, look at the interaction between the availability clause and the exemption clause. If a rich athlete gets a diagnosis and a poor one does not, the availability clause is violated even if the exemption clause is satisfied. The code assumes these things won't conflict, but they do, and when they do, the enforcement clause saves the administrators from having to choose because they just punish the substance regardless of the access issue. The package presupposes that the rules are more important than the reason for the rules, and that is the only thing that keeps the conflicting theories of fairness from tearing the document apart.
