  11. *Wait, one nuance on Case 5:* The user says "being furious at the company doesn't feel like a mistake." Why? Because the company is a *proxy* for the humans inside. I need to make sure that's explicit.

  12. *Wait, one nuance on Case 4:* Why is the Extremist blameworthy if the Tumor guy isn't? Both are causal. The difference is *rational capacity*. The tumor destroys the mechanism of valuation. The upbringing influences the *content* of valuation but leaves the mechanism intact. This is the "Deep Self" distinction. I should integrate this.

  13. *Okay, ready to write.*
answer: |-
  Yes, "reactive attitudes" is precisely the right handle. You are describing the framework laid out by P.F. Strawson in his 1962 essay *Freedom and Resentment*. Strawson argued that blame and praise aren't metaphysical judgments about free will; they are emotional moves we make to maintain interpersonal relationships.

  Your current working rule (*"expresses what the agent cares about" vs. "machinery misfiring"*) is a version of the "Deep Self" theory of responsibility. It's intuitive, but as you've noticed, it fractures under pressure. Specifically, it conflates **causation** with **capacity**.

  Here is the repair to your principle, an audit of your verdicts, and the predictions you asked for.

  ### 1. The Repaired Principle: The Capacity for Answerability

  Your rule fails because it tries to distinguish between "real" causes (caring) and "fake" causes (machinery). But in a materialist universe (which neuroscience assumes), *all* behavior is machinery. The tumor is machinery; the upbringing is machinery; the corporate profit incentive is machinery.

  The distinction isn't about the *source* of the behavior, but about the **status of the agent**.

  **New Rule:** Reactive attitudes are in order when the agent possesses the **capacity for answerability** within the normative community. They are out of order when the agent must be viewed objectively (as a thing to be managed) rather than participatorily (as a person to be engaged).

  *   **Exemptions (The Objective Stance):** The agent lacks the hardware to participate in the game of reasons (FTD, tumors, severe psychosis). We switch to clinical concern.
  *   **Excuses (The Participatory Stance):** The agent has the hardware, but the specific action was compromised (coercion, accident, sleep apnea). We mitigate blame, but don't erase it.
  *   **Responsibility:** The agent has the hardware, and the action reflects a stance they can be asked to justify (lying, extremism, corporate design).

  ### 2. Auditing Your Verdicts

  Here is how your seven cases stack up against the **Answerability Principle**.

  *   **1. The Lying Source (Resentment: Yes).**
      *   **Verdict:** Keep.
      *   **Why:** He is a full participant in the normative community. Lying is a strategic move within the space of reasons. He is answerable.
  *   **2. The FTD Friend (Resentment: No).**
      *   **Verdict:** Keep.
      *   **Why:** Classic **Exemption**. The disease has removed the hardware required to understand the demand for kindness. You cannot ask him for an account.
  *   **3. The Brain Tumor (Resentment: No).**
      *   **Verdict:** Keep.
      *   **Why:** Same as above. The orbitofrontal cortex is the biological substrate of valuation. If it breaks, the "agent" is temporarily offline.
  *   **4. The Extremist Upbringing (Resentment: Yes).**
      *   **Verdict:** Keep.
      *   **Why:** This is the crux of your confusion. You noted the causal story is "every bit as good as the tumour one." Causally, yes. Functionally, no. The upbringing influenced the *content* of his values, but it did not destroy the *capacity* to hold values. He is still a rational agent, just a wicked one. We blame him because we believe he can still hear reasons (even if he rejects them).
  *   **5. The Chatbot vs. The Company (Resentment at Bot: No; at Company: Yes).**
      *   **Verdict:** Keep.
      *   **Why:** The bot is a tool (no capacity for answerability). The company is a **proxy for human agents**. When you blame the company, you are blaming the executives and engineers who made design choices to prioritize engagement over safety. They are answerable.
  *   **6. You and the Sleep Apnea (Guilt: Yes).**
      *   **Verdict:** **Modify.**
      *   **Why:** This is the hardest case. You say explaining it "doesn't touch my guilt." Under the Answerability Principle, it *should* mitigate it. Sleep apnea is a physiological constraint (an Excuse), not a character flaw.
      *   *However:* Self-reactive attitudes (guilt) serve a different function than other-reactive attitudes (resentment). Resentment demands regard from others; guilt demands repair from oneself. Your guilt is functional—it drives you to use your CPAP machine and apologize. But you should not treat it as *moral failure*. It is **regret without shame**. You are responsible for the *repair*, but not for the *sin*.
  *   **7. The Colleague (Gratitude: Yes).**
      *   **Verdict:** Keep.
      *   **Why:** Gratitude is stickier because it responds to the *benefit received* and the *affirmation of the relationship*, not just the purity of motive. By mentoring you, she entered the participatory stance. She played the social game, even if her scorekeeping was vain. That is enough for gratitude.

  ### 3. Predictions for the Unsettled Cases

  Here is how the **Capacity for Answerability** principle predicts you should feel about your two new scenarios.

  #### Case A: The Friend with Borderline Personality Disorder (BPD)
  *   **Scenario:** A friend who does the same hurtful thing every few months.
  *   **Prediction:** **Ambivalent Reactivity (The "Managed" Stance).**
  *   **Reasoning:** BPD is distinct from FTD or tumors. It does not usually destroy the capacity for reason (Exemption), but it severely compromises emotional regulation (Excuse/Mitigation).
  *   **The Verdict:** You cannot fully suspend resentment like you did with the FTD friend, because the friend *knows* it hurts you and can participate in reasoning *between* episodes. However, full indignation is also unfair because their regulatory "machinery" is fragile.
  *   **Result:** You will likely land on a hybrid stance. You feel the sting (resentment), but you suppress the *demand*. You shift from "How could you?" to "How do we prevent this?" You hold them responsible for *management* (therapy, boundaries) rather than *perfection*. If they refuse to manage it, resentment becomes fully in order again.

  #### Case B: Radicalisation by Recommendation Feed
  *   **Scenario:** Someone radicalised by an algorithm rather than a violent family.
  *   **Prediction:** **Shifted Blame (The "Design" Stance).**
  *   **Reasoning:** This tests the Extremist vs. Tumor intuition. The feed is non-human (like the tumor), but it acts on a human mind (like the upbringing).
  *   **The Verdict:** Your gut will want to blame the user (like the Extremist), but your beat will tell you the mechanism is coercive (like the Tumor).
  *   **Result:** The Answerability Principle suggests a **split verdict**.
      1.  **The User:** Mitigated blame. Unlike the violent household, the recommendation feed exploits cognitive vulnerabilities (dopamine loops, outrage bias) that bypass rational valuation. It is closer to a "misfire" than a "choice." We treat them more as victims to be de-radicalised than villains to be punished.
      2.  **The Platform:** High blame. This maps to your Chatbot/Company verdict. The engineers who tuned the feed to radicalise for engagement are the answerable agents. They possess the capacity to design otherwise.
      *   *Forecast:* As neuroscience clarifies how algorithmic manipulation hijacks the orbitofrontal cortex (similar to the tumor case), society will likely move toward viewing the *user* as partially exempt and the *platform* as primarily liable.

  ### Summary of the Shift

  Your gut is messing with you because you are moving from a **Moral Model** (people are good or bad) to a **Medical/Mechanical Model** (people are functioning or broken).

  The repair is to realize these aren't opposites. They are different stances we take depending on **utility**.
  *   We hold the Extremist responsible because blaming him might deter him or others.
  *   We excuse the Tumor patient because blaming him changes nothing and causes suffering.
  *   We blame the Company because they can change the code.
  *   We feel guilt for the Apnea because it motivates us to wear the mask.

  **The Principle:** *Blame is a tool for regulating behavior in agents capable of responding to reasons. If the machinery prevents them from hearing the reason, blame is cruelty. If the machinery allows them to hear it, blame is communication.*

  Your verdicts are mostly sound. The only adjustment needed is to soften the guilt on Case 6 (you are a patient, not a sinner) and prepare for Case B (the user is a victim of design, not just a bad actor).
