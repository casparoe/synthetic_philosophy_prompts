answer: |-
  This is a classic seminar standoff. Your colleague is using a rhetorical flourish to do heavy metaphysical lifting that the slogan itself cannot support. Rorty's quote is designed to dissolve the *problem* of truth, not to solve it by denying the reality of the past.

  Here is a menu of the distinct claims embedded in the slogan, evaluated for their philosophical weight, their fidelity to Rorty, and their utility for your colleague's argument.

  ### The Menu of Readings

  #### 1. The Deflationary Claim (About Meaning)
  *   **The Claim:** The word 'true' does not name a robust property (like correspondence to reality); it is merely a linguistic device we use to endorse sentences. To call a sentence true is just to pay it a compliment.
  *   **Classification:** **Substantive but Defensible.** (This is standard deflationism).
  *   **Rorty's Status:** **Rorty Owns This.** Rorty is a deflationist. He argues that 'true' is not the name of a goal of inquiry.
  *   **Utility for Colleague:** **Low.** This claim only tells us how we *use the word*. It does not entail that the *world* behaves differently when we aren't looking. It blocks the question "But is it *really* true?" but doesn't justify "There is no fact of the matter."

  #### 2. The Instrumental Claim (About Criteria)
  *   **The Claim:** A sentence earns the compliment only if it proves useful for prediction, coordination, or coping ("paying their way").
  *   **Classification:** **Substantive but Defensible.** (Classic Pragmatism).
  *   **Rorty's Status:** **Rorty Owns This.** He follows James and Dewey here. Truth is what it is better for us to believe.
  *   **Utility for Colleague:** **Medium.** This suggests that untraceable past events are *useless* to talk about. However, utility is not ontology. A fact can be useless without ceasing to be a fact. To get to her conclusion, she must assume that *only* useful things exist.

  #### 3. The Epistemic Claim (About Access)
  *   **The Claim:** A sentence can only be paid the compliment if it *seems* to be paying its way to us. If we cannot verify it, we cannot call it true.
  *   **Classification:** **Substantive but Controversial.** (This conflates truth with warrant).
  *   **Rorty's Status:** **Mixed.** Rorty often blurs the line between truth and warranted assertibility, but he usually does so to dismiss the distinction as pointless, not to assert an epistemic constraint on reality.
  *   **Utility for Colleague:** **High.** This is the engine of her argument. If truth requires *seeming* to pay its way, and the past event cannot *seem* to pay its way (no traces), then the sentence cannot be true.
  *   **The Gap:** This only proves we cannot *know* or *assert* it is true. It does not prove the event didn't happen.

  #### 4. The Ontological Claim (About Existence)
  *   **The Claim:** If no one is in a position to pay the compliment, there is no property of truth for the sentence to have, and therefore no fact of the matter for the sentence to describe.
  *   **Classification:** **False.** (This is Verificationist Idealism).
  *   **Rorty's Status:** **Misreading.** Rorty is frequently misread as holding this. He is not an idealist who thinks the world vanishes without observers; he is a pragmatist who thinks *talk* about a world independent of observers is empty. He would say asking about the "fact of the matter" is a bad question, not that the answer is "No."
  *   **Utility for Colleague:** **Total.** This is the conclusion she wants. But the slogan does not support it without a major leap.

  ---

  ### Diagnosing the Colleague's Argument

  Your colleague is trying to derive a metaphysical conclusion ("There is no fact of the matter") from a semantic premise ("'True' is a compliment"). This is a category error.

  **To get from the Slogan to her Conclusion, she needs the following Hidden Premise:**
  > **Verificationist Ontology:** *The limits of our ability to warrant a sentence are the limits of the world's determinacy.* (i.e., If we cannot verify it, it is not just unknown, it is *indeterminate*.)

  **Why Rorty would likely reject her move:**
  Rorty's pragmatism is therapeutic, not destructive. He wants to stop us from worrying about whether our words "match" the world. He does not want to start worrying about whether the world "matches" our words.
  *   **Rorty's likely response:** "Why does it matter if there is a fact of the matter? If no trace exists, asserting there is a fact does no work. But asserting there is *no* fact also does no work. Drop the distinction."
  *   **Your colleague's move:** She is using Rorty to assert a negative metaphysics (Idealism). Rorty explicitly warned against this. He viewed himself as a realist about causal processes (the past happened) but an anti-realist about *Truth* as a metaphysical anchor.

  ### Strategy for the Seminar

  You can challenge her by separating the **semantic** point from the **ontological** point.

  1.  **Grant the Deflationism:** Agree that 'true' is a compliment (Reading 1).
  2.  **Block the Idealism:** Point out that paying a compliment is a human activity, but the *occasion* for the compliment might exist independently of the activity.
      *   *Example:* "I can't pay a compliment to a song no one hears. That doesn't mean the sound waves didn't vibrate."
  3.  **Expose the Hidden Premise:** Ask her explicitly: *"Are you arguing that we can't **know** about the event, or that the event didn't **happen**? The slogan only gets you to the first. To get to the second, you need to argue that reality is constituted by our ability to verify it. Is that a premise you want to defend?"*
  4.  **The Rorty Check:** Remind her that Rorty's goal was to make the "fact of the matter" distinction idle, not to deny the past. If she uses the slogan to make a strong metaphysical claim about the non-existence of untraceable facts, she is treating 'fact of the matter' as a substantive notion again—precisely what Rorty wanted to dissolve.

  **Summary for your notes:**
  *   **Slogan:** Semantic/Deflationary.
  *   **Her Conclusion:** Metaphysical/Verificationist.
  *   **Missing Link:** The premise that *truth-conditions constitute reality*.
  *   **Verdict:** She is using a deflationary tool to build an inflationary (idealist) metaphysics. Rorty would tell her she's still playing the old game, just on the negative side.
