          *   Extended Version: Applies to *any* architecture capable of valenced states (including synthetic minds/AI). Treats non-creation as having *positive moral weight* if potential existence involves *any* net suffering (however minimal).
      *   **Task:** Map the position's exposure (vulnerabilities/defeaters).
      *   **Specific Questions to Answer:**
