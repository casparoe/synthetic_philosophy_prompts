          3.  The Aggregation Problem (Lower bounds & Conjunction).
          4.  Framework Dependence (Levi vs. Kyburg vs. Others).
          5.  Conclusion.

      *(Self-Correction during drafting)*: Make sure to distinguish between *Credal States* (the IP) and *Acceptance Rules* (the bridge to belief). The paradox lives in the bridge. IP changes the structure of the Credal State, but unless you change the Bridge, the paradox persists.

      *Key Insight to highlight:* The "Dilation" phenomenon. In some IP models, conditioning on information can *widen* intervals. This might affect how we update beliefs in lottery-like scenarios, but it's a bit tangential. Stick to the conjunction issue.

      *Final check on the "Robustness" question:* It is definitely *not* robust. Levi's view handles it differently than a strict Lower-Probability Lockean view.

