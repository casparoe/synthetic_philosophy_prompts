answer: |-
  This is an excellent request. You have correctly identified that the passage conflates the *data* (what people say), the *psychological explanation* (why they say it), and the *metaphysical/normative conclusion* (what it means for truth or law). Your suspicion of the last paragraph is well-founded; it makes a leap from "this is how we talk" to "this is how the world/law should work" that most philosophers, even experimental ones, would hesitate to make without further argument.

  Here is the claim-by-claim audit, followed by the probe analysis and the evaluation of the practical conclusion.

  ### Part 1: Claim-by-Claim Audit

  I have broken the passage into six distinct moves. For each, I distinguish the **Empirical Finding** (what was observed), the **Explanatory Theory** (why it happened), and the **Philosophical Conclusion** (what it implies for truth/law).

  #### Claim 1: "Joshua Knobe ran a simple experiment... Asked whether the chairman harmed the environment intentionally, most people said yes... when the same story was told with 'help'... most people said he did not help the environment intentionally."
  *   **(i) Fair Statement:** This is the core empirical finding, known as the "Side-Effect Effect" or "Knobe Effect." It is robust and has been replicated across many cultures and demographics.
  *   **(ii) Simplification:** It implies the effect is binary (Yes/No). In reality, it is a statistical skew on a Likert scale, though the skew is strong.
  *   **(iii) Rejection:** Almost no one in the literature rejects the *existence* of this asymmetry anymore. It is the datum that theories must explain.

  #### Claim 2: "The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts."
  *   **(i) Fair Statement:** This accurately describes the *initial puzzle* and the "Bias View" (or Performance View). It captures why the result was surprising to traditional philosophers.
  *   **(ii) Simplification/Slide:** It slides from "people *say* X" to "people's view of the *facts* is distorted." This presupposes there is a mind-independent fact about intentionality that is being obscured.
  *   **(iii) Rejection:** Defenders of the "Competence View" (including Knobe) reject this. They argue there is no "purely factual" judgment to distort. If the concept of *intentional* inherently includes moral evaluation, then the judgment *is* the fact. To call it a distortion is to beg the question against the Competence View.

  #### Claim 3: "But the distortion is not merely a bias... our very concept of intentional action is partly constituted by moral considerations..."
  *   **(i) Fair Statement:** This is Knobe's specific explanatory hypothesis (The Competence View). It claims the asymmetry reveals the *structure* of the concept, not a bug in processing.
  *   **(ii) Simplification/Slide:** It moves from "surveys show people apply the word this way" to "the concept *is* this way." This is the "Intuition-to-Concept" slide. It assumes folk usage defines conceptual content without room for error or refinement.
  *   **(iii) Rejection:** Proponents of the "Pragmatic View" or "Bias View" reject this. They argue the concept of intentional action *is* neutral (based on belief/desire/causation), but people *use* the word to express blame or praise. On this view, the moral consideration is external to the concept, influencing its *application*, not its *constitution*.

  #### Claim 4: "That is why the result is said to refute the classical philosophical project of analysing intentional action in terms of belief, desire and causation: 'intentional' has no stable content to analyse..."
  *   **(i) Fair Statement:** This represents the radical skeptical conclusion some draw from the Competence View.
  *   **(ii) Simplification/Slide:** It asserts that because the *folk concept* is moralized, the *philosophical analysis* is impossible. This ignores the possibility that philosophy aims to *revise* or *refine* concepts, not just catalog them.
  *   **(iii) Rejection:** Traditional action theorists reject this outright. They argue that even if folk usage is messy, there is a theoretically useful notion of "intention" (e.g., the role intention plays in planning or rationalizing action) that remains stable and distinct from moral judgment.

  #### Claim 5: "The broader upshot is methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis..."
  *   **(i) Fair Statement:** This is the "X-Phi Revolution" slogan regarding conceptual analysis.
  *   **(ii) Simplification/Slide:** "Just is" is the error. Surveys track *intuitions*. Intuitions track *concepts* (debatably). Concepts track *reality* (debatably). Collapsing these three steps is the main methodological controversy in the field.
  *   **(iii) Rejection:** Armchair philosophers (and many experimentalists) reject the "replacement" claim. They argue surveys describe psychology, while conceptual analysis seeks normative or metaphysical truth. Psychology informs analysis but cannot replace it.

  #### Claim 6: "And practically... the doctrine of double effect... or the legal notion of intent... is resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned..."
  *   **(i) Fair Statement:** This is the normative implication *if* you accept the Competence View and believe law/ethics must track folk concepts.
  *   **(ii) Simplification/Slide:** It assumes legal/ethical distinctions are *derived* from folk semantics. In reality, legal intent is a *construct* designed for policy goals (deterrence, fairness), not a report on linguistics.
  *   **(iii) Rejection:** Legal theorists and ethicists reject the "should be abandoned" conclusion. Even if the word "intent" is morally loaded in common speech, the *distinction* between aiming and foreseeing may still be morally or legally relevant for reasons independent of linguistics (e.g., culpability grading).

  ---

  ### Part 2: The Contradiction You Spotted

  You wrote: *"It seems to me to say both that moral judgment distorts a factual judgment and that moral judgment partly constitutes the concept."*

  You are correct. These are **competing explanations**, not compatible claims.
  *   **The Bias View:** There is a factual core (belief + desire). Morality creates noise/distortion. (Claim 2)
  *   **The Competence View:** There is no non-moral core. Morality is part of the recipe. (Claim 3)

  The passage treats Claim 2 as the "obvious interpretation" and Claim 3 as Knobe's "deeper insight." However, logically, if Claim 3 is true, Claim 2 is false. If the concept *is* constituted by morality, then a judgment influenced by morality is not a distortion of the facts; it is an accurate application of the concept. The passage creates a rhetorical narrative ("It looks like bias, but actually...") that obscures the fact that these are rival hypotheses about the cognitive architecture of agency.

  ---

  ### Part 3: Analysis of Your Probes

  Here is how the competing explanations handle your hypothetical cases. I will use the standard categories: **Bias/Performance** (Concept is neutral, judgment is noisy), **Competence/Constitution** (Concept includes morality/norms), and **Pragmatic/Expressivist** (Word is used to blame/praise, regardless of meaning).

  #### Probe One: The Compliance Engine (Non-human agent)
  *Scenario:* An automated system causes harm/help as a side effect of cost-minimization. No beliefs, desires, or "self."

  *   **Reason-Based (Classical):** Predicts **No Asymmetry**. Neither outcome is intentional. The system lacks beliefs and desires, which are necessary conditions for intentional action.
  *   **Deep-Self/Valuational:** Predicts **No Asymmetry**. The system has no "deep self" or values to endorse the outcome. It cannot act intentionally.
  *   **Bias/Performance:** Predicts **No Asymmetry** (mostly). If people recognize the system as a mere tool, the "noise" of moral judgment shouldn't trigger agency attribution. However, if people anthropomorphize the system, the bias might kick in.
  *   **Pragmatic/Expressivist:** Predicts **Asymmetry Survives**. People might say the system "intentionally harmed" the water as a shorthand to blame the *designers* or the *firm*. The target of attribution shifts from the engine to the humans behind it.
  *   **Competence/Constitution:** Predicts **Asymmetry Survives**. If the concept of intentional action is triggered by normative violation + foresight, the lack of a "mind" might not matter if the *event* looks like a normative violation caused by an agent (the firm).
  *   **Discrimination:** If people attribute intentionality to the *engine* itself (not the firm), this devastates Reason-Based and Deep-Self views. If they attribute it to the *firm*, it supports Pragmatic or Competence views.

  #### Probe Two: The Pointless Rule (Non-moral norm)
  *Scenario:* Breaching vs. Complying with an arbitrary office convention.

  *   **Moral Valence (Knobe's original claim):** Predicts **No Asymmetry**. Since the outcome is not *morally* good or bad, the moral constitution of the concept shouldn't trigger.
  *   **Norm-Violation Account:** Predicts **Asymmetry**. Breaching a norm (even arbitrary) looks more intentional than complying. This suggests the driver is *normativity*, not specifically *morality*.
  *   **General Affect/Valence:** Predicts **Asymmetry** (if breach feels "bad"). If "breach" triggers negative affect, the effect survives.
  *   **Discrimination:** If the asymmetry holds here, Knobe's specific claim that *moral* considerations constitute the concept is too narrow. It would need to be revised to *normative* considerations. This weakens the claim that "moral verdicts distort factual judgments" because arbitrary rules aren't moral facts. It supports the idea that *any* norm violation looks more agential than compliance.

  ---

  ### Part 4: The Practical Conclusion (DDE and Law)

  Does the conclusion follow? **No.** Even if the empirical finding is robust and the Competence View is true, the leap to "abandon the distinction" is invalid.

  **1. The Doctrine of Double Effect (DDE)**
  *   **The Claim:** DDE relies on the intended/foreseen distinction. If "intentional" just means "bad and foreseen," DDE collapses.
  *   **If Finding is Robust but Explanation Unsettled:** We know people *use* the word differently based on outcome. We don't know if the *moral principle* is wrong. DDE is a normative claim about *permissibility*, not a descriptive claim about *linguistics*.
  *   **If Competence View is True:** It implies that when people apply DDE, they are implicitly making a moral judgment. It does *not* prove the judgment is wrong. It might mean DDE is a formalization of a deep moral intuition rather than a logical test.
  *   **If Bias View is True:** It implies people are misapplying DDE due to emotional noise. This would support refining the application of DDE, not abandoning it.
  *   **Better Upshot:** "The DDE relies on a distinction that is psychologically unstable in folk judgment. Therefore, relying on *unreflective* intuitions about intent to apply DDE is risky. The distinction must be defined technically, not colloquially."

  **2. Legal Intent**
  *   **The Claim:** Legal intent is a moral judgment in disguise and should be replaced by an explicit normative test.
  *   **Critique:** Legal intent is already a technical construct (e.g., *mens rea* categories like purpose, knowledge, recklessness). It does not strictly track folk usage.
  *   **If Competence View is True:** It suggests jurors will naturally import moral judgment into their finding of intent regardless of judicial instruction.
  *   **Implication:** The law shouldn't necessarily *abandon* the distinction (which serves to grade culpability), but it should acknowledge that jury findings of "intent" are partly moral verdicts. The solution isn't to remove "intent," but to instruct jurors more carefully or separate the factual finding from the moral grading.
  *   **Better Upshot:** "Legal definitions of intent should not rely on ordinary language, because ordinary language is morally loaded. Statutes must define mental states operationally, acknowledging that jurors will struggle to separate fact from evaluation."

  ### Part 5: Reviewing Your Glosses

  You asked me to flag if your own glosses were misleading.

  *   **Your Gloss:** *"valence-sensitive, reason-based, deep-self/valuational, and pragmatic-or-expressivist... explanations"*
  *   **Correction:** This list mixes categories.
      *   **Reason-based** is usually the *null hypothesis* (the traditional view that predicts *no* asymmetry). It isn't an explanation *of* the asymmetry, but the view being challenged.
      *   **Valence-sensitive** describes the *phenomenon*, not the mechanism. (All the explanations agree the judgments are valence-sensitive; they disagree on *why*).
      *   **Deep-Self** and **Pragmatic** are rival *mechanisms*.
      *   **Better Taxonomy:**
          1.  **The Bias/Performance View:** Concept is neutral; moral emotion creates noise.
          2.  **The Competence/Constitution View:** Concept includes morality/norms.
          3.  **The Pragmatic/Expressivist View:** Concept is neutral; speakers use the word to blame/praise (implicature rather than meaning).

  *   **Your Gloss:** *"I find the basic result plausible and the last paragraph suspicious."*
  *   **Verdict:** This is the intellectually healthy position. The result is one of the most robust in experimental psychology. The last paragraph commits the **Naturalistic Fallacy** (deriving an "ought" from an "is"). Just because folk concepts are morally loaded doesn't mean our ethical or legal systems *should* be. In fact, many argue the point of legal/ethical systems is to *correct* folk biases.

  ### Summary Recommendation for Repeating This
  If you repeat this to others, use this structure to avoid the passage's errors:
  1.  **The Finding:** People are much more likely to call a side effect "intentional" if it is harmful than if it is helpful. (Solid).
  2.  **The Debate:** Some say this shows our concept of action includes morality (Knobe). Others say it shows our judgments are biased by blame (Critics). (Keep these distinct).
  3.  **The Implication:** This suggests that ordinary talk about "intent" is not morally neutral. However, it does not prove that legal or ethical distinctions based on intent are invalid, only that they are harder to apply than we thought. (Nuanced).

  This preserves the insight without endorsing the unwarranted leap from psychology to normative abolition.
