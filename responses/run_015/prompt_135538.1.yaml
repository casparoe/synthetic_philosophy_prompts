  *   **A (5):** Correct EVs for all three approaches. Identifies Functional Pay (\$499.5k) vs Causal/EDT Refuse (\$0).
  *   **B (3):** Correct Causal/Functional, but misses EDT nuance (e.g., treats EDT as Pay without justification).
  *   **C (1):** Only identifies recommendations without arithmetic.
