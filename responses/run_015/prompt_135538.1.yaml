  # Question 1 (25 Marks)

  **Decision Theory: Mugging and Blackmail**

  Consider two decision problems. In both, you must choose to **Pay** \$1,000 or **Refuse**.

  **Case A (Counterfactual Mugging):** A fair coin was flipped. If Heads, you are asked to Pay. If Tails, you are not approached. A Predictor simulated your deliberation before the flip. If the Predictor predicted you would Pay (had you been asked), you receive \$1,000,000 in the Tails world. The coin landed Heads; you are being asked.

  **Case B (XOR Blackmail):** Your house is worth \$1,000,000. A flood destroys it with probability $p = 1/100$, independently of your actions. A Blackmailer with a Predictor sends a letter demanding \$1,000. The Blackmailer destroys the house if you Refuse *and* the letter was sent. The letter is sent if and only if exactly one of the following is true: (1) the Predictor predicts you would Pay if the letter arrived, (2) the flood occurs. The letter has arrived.

  Evaluate these cases using three approaches defined by their procedures:
  1.  **Causal:** Intervene on your action; calculate expected value (EV) based on causal consequences.
  2.  **Evidential:** Condition on your action; calculate EV based on what the action indicates about the state of the world.
  3.  **Functional:** Fix your decision procedure's output; calculate EV based on logical consequences, holding fixed only facts independent of the procedure.

  **(a)** For each Case, determine the recommendation and explicit EV for each approach. (10 marks)
  **(b)** The Functional approach recommends Paying in Case A but Refusing in Case B. Explain why this is not contradictory. Diagnose the error in the argument that the cases are formally identical and must yield the same recommendation. (5 marks)
  **(c)** Suppose the Predictor's accuracy regarding your action is $q$ (independent of other factors), while flood prediction remains perfect and $p$ is negligible. Derive the threshold $q$ required for the Functional recommendation to remain optimal in each case. Discuss what the asymmetry between these thresholds implies for the theory. (10 marks)

  *(Word limit for this question: 1,200 words)*

  ***

  # Model Answer

  **(a) Recommendations and Expected Values**

  **Case A (Mugging):**
  *   **Causal:** The coin is already Heads. Paying costs \$1,000 and causally affects nothing else (the Tails payout is fixed by the past prediction).
      *   $EV(\text{Pay}) = -\$1,000$. $EV(\text{Refuse}) = \$0$. **Recommendation: Refuse.**
  *   **Evidential:** Conditioning on Paying provides no evidence about the coin (already known Heads). Standard conditioning suggests no correlation with the past prediction once the state is known.
      *   $EV(\text{Pay}) = -\$1,000$. $EV(\text{Refuse}) = \$0$. **Recommendation: Refuse.**
  *   **Functional:** We evaluate the policy "If asked, Pay." If this policy holds, the Predictor (simulating the policy) predicted Pay. Thus, the Tails payout occurs.
      *   $EV(\text{Pay Policy}) = 0.5(-\$1,000) + 0.5(\$1,000,000) = \$499,500$.
      *   $EV(\text{Refuse Policy}) = 0$. **Recommendation: Pay.**

  **Case B (Blackmail):**
  *   **Causal:** The letter has arrived. Refusing causes the Blackmailer to destroy the house (-\$1,000,000). Paying costs \$1,000. The flood is independent.
      *   $EV(\text{Pay}) \approx -\$1,000$. $EV(\text{Refuse}) \approx -\$1,000,000$. **Recommendation: Pay.**
  *   **Evidential:** The letter implies $(\text{Prediction} \oplus \text{Flood})$. Conditioning on Paying suggests the Prediction was Pay. If Prediction is Pay and Letter is true, Flood must be False (since $T \oplus F = T$). Paying correlates with safety.
      *   $EV(\text{Pay}) \approx \$1,000,000 - \$1,000$. $EV(\text{Refuse}) \approx -\$1,000,000$. **Recommendation: Pay.**
  *   **Functional:** We evaluate the policy "If Letter, Refuse." The Predictor predicts this.
      *   If Flood ($p$): Prediction=Refuse. Letter $\iff$ (Refuse $\oplus$ Flood) $\iff$ False. No Letter. House lost to flood (-\$1M).
      *   If No Flood ($1-p$): Prediction=Refuse. Letter $\iff$ (Refuse $\oplus$ No Flood) $\iff$ True. Letter Sent. I Refuse. Blackmailer destroys house (-\$1M).
      *   Wait: If Policy=Refuse, Prediction=Refuse. Letter condition: $L \iff (\text{Refuse} \oplus \text{Flood})$.
      *   If Flood (True): $L \iff (F \oplus T) \iff T$. Letter Sent. Refuse $\to$ Destroyed.
      *   If No Flood (False): $L \iff (F \oplus F) \iff F$. No Letter. Safe.
      *   $EV(\text{Refuse Policy}) = -p(\$1M)$.
      *   If Policy=Pay: Prediction=Pay.
      *   If Flood (True): $L \iff (T \oplus T) \iff F$. No Letter. Flood destroys house (-\$1M).
      *   If No Flood (False): $L \iff (T \oplus F) \iff T$. Letter Sent. Pay (-\$1k).
      *   $EV(\text{Pay Policy}) = -p(\$1M) - (1-p)(\$1,000)$.
      *   Refuse is better by \$1,000. **Recommendation: Refuse.**

  **(b) Consistency and Formal Identity**

  The recommendations are not contradictory because the dependency structures differ. In Case A, the *payout* depends on the logical correlation between the action and the prediction. In Case B, the *existence of the threat* (the letter) depends on that correlation. The Functional approach treats the decision as a logical node influencing all instances of the same computation (the prediction).

  The "formal identity" argument fails because it treats variables as interchangeable labels without respecting which facts are fixed by nature versus fixed by the decision procedure. In Case A, the coin is fixed; the payout is mutable via logic. In Case B, the flood is fixed; the letter's arrival is mutable via logic. Treating them as identical ignores that in Case B, refusing logically prevents the letter in the no-flood world, saving the \$1,000, whereas in Case A, paying logically secures the \$1,000,000 in the counterfactual world.

  **(c) Predictor Reliability and Asymmetry**

  Let $q$ be the probability the Predictor correctly predicts the policy. Assume $p \approx 0$.

  **Case A Threshold:**
  Pay if $EV(\text{Pay}) > EV(\text{Refuse})$.
  $EV(\text{Pay}) = 0.5(-\$1,000) + 0.5(q \times \$1,000,000)$.
  $EV(\text{Refuse}) = 0$.
  Pay if $q(\$500,000) > \$500 \implies q > 1/1,000 = 0.001$.

  **Case B Threshold:**
  Refuse if $EV(\text{Refuse}) > EV(\text{Pay})$.
  With $p \approx 0$, only the No-Flood world matters.
  Policy Refuse: Prediction=Refuse w.p. $q$. Letter $\iff$ (Refuse $\oplus$ False) $\iff$ False. No Letter w.p. $q$. Letter w.p. $1-q$.
  If Letter, Refuse $\to$ House Destroyed (-\$1M).
  $EV(\text{Refuse}) \approx -(1-q)\$1,000,000$.
  Policy Pay: Prediction=Pay w.p. $q$. Letter $\iff$ (Pay $\oplus$ False) $\iff$ True. Letter w.p. $q$.
  If Letter, Pay $\to$ -\$1,000.
  $EV(\text{Pay}) \approx -q(\$1,000)$.
  Refuse if $(1-q)10^6 < q(10^3) \implies 10^6 < q(10^6 + 10^3) \implies q > \frac{1000}{1001} \approx 0.999$.

  **Implications:**
  The thresholds are wildly asymmetric ($0.001$ vs $0.999$). Case A rewards correlation with a benefit; Case B punishes correlation with a threat. This shows the Functional approach is not blindly following correlation but optimizing based on the direction of the dependency. It does not invalidate the theory but highlights that resisting extortion requires high predictor fidelity, whereas capturing counterfactual gains requires only low fidelity. To decide definitively, one would need empirical data on whether real-world predictors (or logical correlations) exhibit the stability required for the high-$q$ regime.

  ***

  # Marking Scheme

