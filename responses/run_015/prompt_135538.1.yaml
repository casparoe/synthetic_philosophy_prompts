  **3. Non-Contradiction Explanation (5 Marks)**
  *   **A (5):** Clearly distinguishes dependency structures (Payout vs. Threat Existence). Explains logical fixing of variables.
  *   **B (3):** States they are different but relies on intuition rather than dependency analysis.
  *   **C (1):** Asserts "context matters" without elaboration.
