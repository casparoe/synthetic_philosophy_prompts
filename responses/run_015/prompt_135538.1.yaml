  *   **B (3):** Identifies the error as "ignoring the predictor" generally.
  *   **C (1):** Vague dismissal of the argument.
  *   *Common Error:* Arguing that the math is simply different without explaining *why* the relabeling fails.

  **5. Threshold Derivation (5 Marks)**
  *   **A (5):** Correctly derives $q > 0.001$ (Mugging) and $q > 0.999$ (Blackmail).
  *   **B (3):** Derives one threshold correctly; other is approximate or inverted.
  *   **C (1):** Attempts algebra but fails to isolate $q$.
  *   *Common Error:* Assuming thresholds are symmetric (e.g., both 0.5).

  **Marker Note on Evidential Approach (Case B):**
  *   Some candidates may argue EDT recommends **Refusing**. This is defensible if they argue that since the Letter *has arrived*, the correlation between Action and Flood is screened off or fixed by the observation $L$. If the candidate explicitly justifies this by stating $P(\text{Flood} | \text{Pay}, \text{Letter}) = P(\text{Flood} | \text{Refuse}, \text{Letter})$ due to the XOR structure being resolved by the observation, award full marks for Part 1(b). Do not penalize for disagreeing with the Model Answer provided the logic is internally consistent.

