answer: |-
  The Behavioural Insights Team was supposed to be the quiet revolution in government. No more heavy-handed regulation, just gentle nudges to help people help themselves. But a year of reporting suggests the revolution is facing a legitimacy crisis it hasn't fully owned. I recently sat with a former insider, a woman who now describes herself as allergic to the word "nudge." She offered two claims that have haunted my reporting ever since. The first concerns the inevitability of choice architecture; the second concerns the shelf-life of the interventions themselves. Together, they suggest that the current defenses of behavioural science are holding water only because nobody has checked for holes.

  Her first claim targets the standard justification for state nudging: the argument that neutrality is impossible. Since someone must set the default option on a form—whether you are enrolled in a pension or not—the state might as well set it to the outcome that improves welfare. It is a powerful shield. It suggests that doing nothing is not an option; inertia is itself a policy.

  I tried to counter this with a distinction between what I call residual architecture and authored architecture. Residual architecture is the mess left over by legacy IT systems, procurement contracts, and thirty years of institutional habit. Authored architecture is when a team sits down specifically to design a flow to move a number. My hope was to salvage the legitimacy of nudging by limiting it to the residual. If the default is just an accident of history, fixing it isn't manipulation.

  But under scrutiny, this distinction collapses. In government, maintaining the status quo is an active decision. To leave a legacy system in place is to endorse its effects. Every residual default is secretly authored by whoever declined to change it. This collapse destroys the comfort of the "someone had to choose anyway" defense. If inertia counts as authorship, then practically every interaction between citizen and state is an authored intervention. The defense either licenses everything or nothing. Since most real-world interventions are designed with intent, the defense licenses almost nothing. We are left with the unsettling reality that the state is always steering, and the question is not whether it steers, but whether the steering is permissible.

  This leads to my friend's second claim: interventions have a half-life. She noted that nudges depending on the target not quite noticing the mechanism tended to stop working once written up in a newspaper. Her team measured this informally. How many rounds of publicity before the effect dropped by half? This observation points to a flaw in the current gold standard of ethical nudging: transparency.

  The debate currently obsesses over whether a nudge survives being made public. If people know they are being nudged and still follow the path, the nudge is deemed legitimate. But transparency feels like a proxy for the thing that actually matters. Knowing you are being steered does not mean you can easily steer yourself elsewhere. A sign saying "This path is designed to make you walk faster" does not help you if the other path is blocked by weeds.

  I want to propose a different standard: the mutual exposure condition. A steer is permissible only when the two parties are symmetrically exposed to being wrong. The person being steered must be able to get out cheaply, repeatedly, and without becoming an expert. Crucially, the institution doing the steering must carry a real cost when the steer turns out to be bad for the people it was aimed at. This could be lost enrolment, a complaint route with teeth, or a public metric that goes down. On this view, a long publicity half-life isn't a nice extra feature; it is evidence the condition is met. An intervention that works once everyone knows about it is one you can keep declining forever. One whose effect evaporates in daylight was borrowing its force from the targets not knowing.

  Does this test hold up when we drag it into the light?

  Consider automatic enrolment in workplace pensions. This is the darling of behavioural policy. The default is yes; you must opt out. Can the citizen exit cheaply? Yes, a checkbox away. Is it repeated? Every pay slip reminds you. Does the institution bear cost if it's bad? Yes. If the default fund performs poorly or fees are too high, the political backlash is severe, and enrolment numbers drop if people feel trapped. It passes the mutual exposure test. The state and the citizen are roughly aligned: both want a secure retirement.

  Now consider presumed consent for organ donation. The default is yes; you must opt out. Can the citizen exit? Technically yes, but the cost is higher. It requires navigating a registry, and there is a social weight to opting out of saving lives. Does the state bear cost if it's bad? Less clearly. The state wants organs. If families are distressed by post-mortem donations they didn't know their relative wanted, the cost is emotional and borne by the family, not the budget. The symmetry is off. The state gains the organ regardless of the family's distress. It passes transparency, perhaps, but strains under mutual exposure.

  Then there is the case nobody wants to discuss: the benefits portal. Imagine a government quietly requiring a job-centre site to put the "Apply Now" button first, while burying the "Check What You're Entitled To" page three clicks deeper. This helps people who freeze up in front of forms get into work quickly. But it quietly hurts people who would have discovered they qualified for more support if they had dug deeper.

  Can the user exit? Yes, but the cost is cognitive load and time—expensive for someone in crisis. Does the state bear cost if the steer is bad? No. If people claim less than they are entitled to, the state saves money. The incentive is misaligned. The state profits from the citizen's ignorance. This fails the mutual exposure condition catastrophically. It is a nudge that works best in the dark and harms the target to benefit the nudger. Transparency alone wouldn't catch this; you can be transparent about a bad deal. Mutual exposure catches it because the state faces no penalty for the error.

  So, is mutual exposure the right test? It is a significant improvement on transparency because it demands consequence, not just disclosure. It forces the architect to have skin in the game. However, it is incomplete.

  The condition protects against exploitation, but it does not guarantee benevolence. A nudge could be mutually exposed yet still manipulate deep cognitive biases in a way that feels disrespectful to adult agency. For example, a state lottery might make it easy to opt out and lose money when people play too much, satisfying the exposure condition. But we might still object to the state profiting from addiction.

  Therefore, mutual exposure is necessary but not sufficient. It needs to be paired with an aligned-incentives constraint. The state must not only suffer when the nudge fails, but it must also gain only when the citizen's welfare improves by the citizen's own lights. In the benefits case, the state saves money when the user fails to find their full entitlement. That misalignment is the poison. In the pension case, the state succeeds only when the citizen retires securely. That alignment is the cure.

  My friend's allergy was a symptom of a field that focused too much on the mechanics of choice and not enough on the politics of consequence. The authored versus residual distinction was a attempt to find innocence in inertia, but there is no innocence in governance. Every default is a vote. The only way to legitimize that vote is to ensure the voter and the counter share the same risk. If the state can nudge without bleeding when the citizen bleeds, it is not guidance; it is extraction. We need not just transparency, but vulnerability. The state must be nudgable back.

  \answer{incomplete-needs-aligned-incentives}
