  5.  **Timeline & Logistics:**

      *   75 mins total.
      *   Intro (5 mins).
      *   Round 1 Voting (20 mins).
      *   The Twist/Update (5 mins).
      *   Round 2 Voting (15 mins).
      *   Table Discussion (10 mins).
      *   Debrief/Reveal (20 mins).
      *   *Wait, 75 mins.*
      *   Intro: 5.
      *   Case Review & Vote 1: 25.
      *   Twist & Vote 2: 15.
      *   Table Debrief: 10.
      *   Room Debrief/Philosophy Reveal: 20.
      *   Total: 75.

  6.  **Handling the Skeptics:**

      *   Journalists will ask: "Is this real? What study?"
