answer: |-
  # Session Plan: The Nomenclature Committee

  **Session Title:** Drawing the Line: A Simulation of Disease Classification
  **Time:** 75 Minutes
  **Room Setup:** 6 round tables (3–4 participants per table). Flip chart at the front.
  **Materials:** Printed Handouts (one per participant), pens, flip chart markers.

  ---

  ## Part 1: The Handout
  *Print this on a single sheet, double-sided. Do not include any philosophical terminology.*

  **CONFIDENTIAL DRAFT: NOMENCLATURE COMMITTEE MEMO 44-B**
  **TO:** Review Committee
  **RE:** Candidate Conditions for Inclusion in the Standard Disease Registry (SDR)
  **DATE:** October 14, 2024

  **INSTRUCTIONS:**
  You are members of the Standards Committee. Your task is to vote on whether four candidate conditions should be added to the Standard Disease Registry (SDR).

  **THE STAKES:**
  *   **Inclusion:** The condition receives an SDR Code. Insurance providers are mandated to cover treatment. A $50M annual research fund is unlocked. Patients may claim disability accommodations.
  *   **Exclusion:** The condition is classified as a "Trait," "Variant," or "Life Circumstance." No mandated coverage. No disability status. Research funding is private only.

  **THE CRITERIA:**
  There is no single rule. You must weigh the biological evidence against the impact on the patient's life. Use your professional judgment.

  **THE CANDIDATES:**

  **1. Asymptomatic Vessel Narrowing (AVN)**
  *   **Biology:** Imaging shows 40% narrowing of coronary arteries. Blood flow is mathematically reduced compared to species baseline.
  *   **Patient Experience:** Zero. No pain, no shortness of breath, no reduction in lifespan or activity.
  *   **Prognosis:** Unlikely to worsen.
  *   **Vote:** [ ] Include in SDR  [ ] Exclude from SDR

  **2. Prolonged Grief Response (PGR)**
  *   **Biology:** Neuroimaging and blood chemistry are within standard species ranges. No physiological dysfunction detected.
  *   **Patient Experience:** Severe incapacitation following loss of a spouse. Inability to work or self-care for 18+ months. Intense subjective suffering.
  *   **Prognosis:** Eventually resolves, but timeline varies.
  *   **Vote:** [ ] Include in SDR  [ ] Exclude from SDR

  **3. Circadian Mismatch Type 4 (CM4)**
  *   **Biology:** Sleep-wake cycle is shifted 5 hours later than the population mean. Physiology is otherwise healthy.
  *   **Patient Experience:** In a standard 9-to-5 economy, patients cannot wake for work. Result: Job loss, poverty, severe anxiety, social isolation.
  *   **Prognosis:** Permanent biological trait.
  *   **Vote:** [ ] Include in SDR  [ ] Exclude from SDR

  **4. Marker-Positive Cellular Variant (MPCV)**
  *   **Biology:** Specific protein marker present on cell walls. Function is unknown, but structure deviates from species norm.
  *   **Patient Experience:** None currently. However, historical data suggests 10% of carriers develop severe illness after age 60.
  *   **Prognosis:** Latent risk.
  *   **Vote:** [ ] Include in SDR  [ ] Exclude from SDR

  ***[STOP. DO NOT TURN PAGE UNTIL INSTRUCTED]***

  **UPDATE MEMO: IMMEDIATE REVISION TO CANDIDATE 3 (CM4)**
  **EFFECTIVE:** Immediately.

  **NEW CONTEXT FOR CM4:**
  The national economy has shifted. Remote work is now universal. Work hours are fully flexible. Individuals with CM4 can now work 2 PM to 10 PM without penalty.
  *   **New Patient Experience:** No job loss. No poverty. Social isolation is resolved. The biological sleep shift remains exactly the same.
  *   **New Harm Level:** Negligible.

  **REVOTE REQUIRED:**
  Please reconsider your vote for **Candidate 3 (CM4)** only.
  *   **Vote:** [ ] Include in SDR  [ ] Exclude from SDR

  ---

  ## Part 2: Facilitator Script & Timeline

  **0:00 – 0:05 | Introduction & Consent**
  *   **Welcome:** "Welcome. For the next hour, you are not reporters or clinicians. You are the gatekeepers. You hold the pen that writes the definition of disease."
  *   **The Frame:** "We are going to run a simulation. You will vote on four invented conditions. There are no right answers, only consistent or inconsistent ones."
  *   **Consent to Quote:** "I am working on a story about how we define health. I may quote things said in this room for a future piece. If you do not wish to be quoted, please fold your name tent inward / raise your hand now. [Adjust per room norms]. Everything said here is on the record unless you opt out."
  *   **Ground Rule:** "Do not Google these. They are fictional composites. If you question the science on the card, treat the card as the absolute truth for this exercise."

  **0:05 – 0:30 | Round 1 Deliberation & Vote**
  *   **Action:** Hand out the sheets. Give tables 15 minutes to discuss and mark their votes.
  *   **Prompt:** "Discuss *why* you are voting yes or no. One person per table should note the main reason for disagreement."
  *   **Collection:** At 0:25, ask each table to raise hands for Yes/No on each case. Tally roughly on the Flip Chart (just tick marks).
      *   *Flip Chart Columns:* Case 1 | Case 2 | Case 3 | Case 4
      *   *Rows:* YES | NO

  **0:30 – 0:35 | The Twist**
  *   **Action:** Ask participants to turn the page to the "Update Memo."
  *   **Script:** "The world has changed. Read the update for Candidate 3. The biology is identical. The suffering has vanished because the environment accommodated the trait. You have 5 minutes to revote on Case 3 only."

  **0:35 – 0:50 | Round 2 Vote & Table Debrief**
  *   **Action:** Collect the second vote tally on the Flip Chart.
  *   **Table Talk:** "Look at your table's votes. Did anyone flip? Did anyone refuse to flip? Why?"
  *   **Room Check:** Ask for a show of hands: "Who kept CM4 as a disease even though it no longer causes harm?" "Who removed it because the harm is gone?"

  **0:50 – 1:05 | The Reveal (The "Philosophy" Section)**
  *   *This is where you introduce the vocabulary.*
  *   **Script:** "You just fought a battle that has been raging in philosophy of medicine for 50 years. You were arguing between two frameworks without knowing the names."
  *   **Framework A (Naturalism):** "Disease is a biological fact. It is a deviation from normal species functioning. If the biology is broken, it is a disease. If the biology is normal, it is not."
      *   *Point to Case 1 (AVN):* "If you voted YES here, you prioritized Biology over Harm. That is a Naturalist lean."
      *   *Point to Case 2 (PGR):* "If you voted NO here, you prioritized Biology (lack of dysfunction) over Suffering. That is a Naturalist lean."
  *   **Framework B (Normativism):** "Disease is a value judgment. It is a condition we deem 'bad' enough to intervene in. Biology matters less than the impact on the life."
      *   *Point to Case 1 (AVN):* "If you voted NO here, you said 'No harm, no disease.' That is a Normativist lean."
      *   *Point to Case 2 (PGR):* "If you voted YES here, you said 'Suffering is enough.' That is a Normativist lean."
  *   **The Twist (Case 3):** "This was the trap. If you removed CM4 from the list because society changed, you admitted that Disease is socially contingent (Normativist). If you kept it on the list, you believe the biological deviation defines the disease regardless of context (Naturalist)."

  **1:05 – 1:15 | Closing & Implications**
  *   **Script:** "Why does this matter for your reporting?"
  *   **Authority:** "When you write 'X is a disease,' you are not just reporting a fact. You are validating a claim to resources. You are deciding who is sick and who is difficult."
  *   **The Trap:** "Notice how hard it was to be consistent. We want disease to be a biological fact (so it's not our fault) but we also want it to cover suffering (so we can get help). You can't always have both."
  *   **Final Thought:** "Next time you cover a new diagnosis, ask: Did the biology change, or did the values? Who gets the budget? Who gets the name for their pain?"

  ---

  ## Part 3: Managing the Room (Skeptics & Logistics)

  **1. The "Is This Real?" Challenge**
  *   **Prediction:** Journalists will hate fictional cases. They will ask, "What study is this based on? Is this Alzheimer's? Is this ADHD?"
  *   **Response:** "These are composites designed to isolate variables. In the real world, biology and harm are tangled. Here, I have untangled them so you can see the knot. If you debate the science of the card, you miss the point of the exercise. Suspend disbelief."
  *   **Tactic:** If a table gets stuck on the science, circulate and remind them: "Treat the card as the ground truth. The question is the *label*, not the *fact*."

  **2. The Clinician Drift**
  *   **Prediction:** The 4-5 clinicians may try to dominate with "In practice, we treat..."
  *   **Response:** Remind them they are in the *Nomenclature Committee*, not the Clinic. "You are writing the rulebook today, not treating the patient. A code unlocks money for everyone, not just the one in front of you."

  **3. The Consent to Quote**
  *   **Placement:** As noted in the Intro (0:00–0:05).
  *   **Visual:** Have a printed sign on each table: "ON THE RECORD UNLESS OPTED OUT."
  *   **Why:** Journalists are sensitive to off-the-record rules. Make it explicit immediately so they don't clamp up, or conversely, so they don't feel tricked later.

  **4. Running the Twist**
  *   **Timing:** Be strict. If they spend too long on Case 1 & 2, cut them off. The Twist (Case 3) is the most important data point for the debrief.
  *   **The Flip:** Watch the hands during the second vote. If *no one* flips, the exercise failed to land. If *everyone* flips, the bias is too obvious. The friction is in the split.

  ---

  ## Part 4: The Debrief Map (Cheat Sheet for You)

  *Use this to interpret their votes during the final 10 minutes.*

  | Case | Bio Dysfunction? | Harm/Suffering? | If Vote = YES | If Vote = NO |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. AVN** | **Yes** | **No** | **Naturalist:** Biology defines disease, even if harmless. | **Normativist:** No harm, no disease. |
  | **2. PGR** | **No** | **Yes** | **Normativist:** Suffering defines disease, even if bio is normal. | **Naturalist:** No bio break, no disease. |
  | **3. CM4 (V1)**| **No** | **Yes (Env)** | **Normativist:** Social context creates disease. | **Naturalist:** Biological normalcy excludes disease. |
  | **3. CM4 (V2)**| **No** | **No (Env)** | **Naturalist:** The biological trait remains the label. | **Normativist:** No harm, label removed. |

  **Key Inconsistency to Highlight:**
  "If you voted YES on Case 2 (Grief) but NO on Case 1 (Vessels), you are consistent (Harm matters most). But if you voted YES on Case 1 and NO on Case 2, you are saying Biology matters most. Most of you will find you voted YES on both. That means you want Disease to be *both* a biological fact AND a judgment of harm. Philosophically, that is unstable. But practically, it's what we demand."

  ---

  ## Part 5: Honest Limits of the Exercise

  *You asked for a candid read on what this won't capture.*

  **1. The Weight of Authority**
  *   **Limit:** In this room, voting "No" is an intellectual exercise. In reality, voting "No" denies a real human being insurance coverage for their pain.
  *   **What to Say:** "You felt the friction of the definition, but you didn't feel the guilt. When you deny a code, a real person gets a bill. That emotional weight often forces committees to expand definitions beyond what the biology supports. We call that 'diagnostic creep,' but sometimes it's just mercy."

  **2. The Power Dynamics**
  *   **Limit:** In this simulation, *they* are the committee. In reality, they report *on* the committee. They won't feel the pressure of pharmaceutical lobbying or patient advocacy groups screaming outside the door.
  *   **What to Say:** "You were the experts in this room. Usually, you are the observers. Remember that the people in the real committee rooms are being lobbied by drug companies who want Case 1 included, and insurers who want Case 2 excluded. The definition of disease is a market force."

  **3. The "Biological Fact" Illusion**
  *   **Limit:** The exercise separates Biology and Values cleanly. Real medicine is messy; "normal biology" is often a statistical average, not a truth.
  *   **What to Say:** "I gave you clear cards. Real science is never this clean. 'Normal function' is often just a statistical average with a value judgment glued to it. When you report on a new biomarker, ask: Is this a mechanism of illness, or just a difference we decided to monetize?"

  ---

  ## Part 6: Facilitator Notes on Tone

  *   **Neutrality:** Do not signal which vote is "correct." If a table argues passionately for Case 1 being a disease, nod and say, "That's a strong defense of biological realism." If they argue against it, say, "That's a strong defense of patient-centered outcomes."
  *   **Pacing:** 75 minutes flies. Keep a visible timer. If discussion drags on Case 1, cut it. Case 3 is the payoff.
  *   **The "Aha" Moment:** The goal is for them to realize *they* cannot define disease consistently. Do not solve it for them. Leave them with the tension. The final 10 minutes is not about giving answers, but naming the conflict they just lived through.
