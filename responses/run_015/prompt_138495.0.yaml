      *   *Correction:*
          *   Naturalist: Disease = Biological Dysfunction (regardless of harm, ideally).
          *   Normativist: Disease = Undesirable Condition (regardless of biology).
      *   *The Conflict:*
          *   If you voted YES for "Deep Sorrow" (No dysfunction, High Harm), you are prioritizing Harm (Normativist lean).
          *   If you voted NO for "Vessel Narrowing" (Dysfunction, No Harm), you are prioritizing Harm (Normativist lean).
          *   If you voted YES for "Vessel Narrowing" (Dysfunction, No Harm), you are prioritizing Biology (Naturalist lean).
          *   If you voted NO for "Deep Sorrow" (No dysfunction, High Harm), you are prioritizing Biology (Naturalist lean).
