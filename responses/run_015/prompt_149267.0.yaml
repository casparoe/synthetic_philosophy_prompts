answer: |-
  ### The Metric Ambiguity in Demandingness Objections: Welfare Subtraction vs. Structural Disintegration

  **1. The Settled Background**
  It is settled within the literature that act-consequentialism entails a requirement to maximize the impersonal good, irrespective of agent-relative constraints. Consequently, it is settled that the theory is *demanding* in the sense that it frequently requires agents to forego personal projects, resources, and time in favor of optimific alternatives. It is also settled that "demandingness objections" generally claim this requirement is morally excessive or objectionable.

  What remains genuinely contested is not *whether* consequentialism demands sacrifice, but how the **metric of cost** is constituted within the objection itself. Specifically, there is no consensus on whether the "cost to the agent" functions as a fungible subtraction from a welfarist aggregate (a large negative utility value) or as a structural violation of agency that resists cardinalization (a category error or veto). This ambiguity creates a dilemma for the critic: if the cost is fungible, consequentialism can theoretically absorb it; if it is structural, the objection relies on non-consequentialist premises that the consequentialist is under no obligation to accept.

  **2. The Case: The Constitutive Instrumentalist**
  Consider an agent, $A$, engaged in a "ground project" $P$ (e.g., composing a specific type of music, maintaining a specific research program, or sustaining a particular community role). $P$ generates positive impersonal value $V_p$. However, there exists an alternative action $O$ (e.g., high-earning philanthropy) that generates value $V_o$, where $V_o > V_p$.

  Standard consequentialism requires $A$ to abandon $P$ for $O$. The standard demandingness objection states this is too costly. The ambiguity arises when we attempt to quantify "too costly" in this specific context:

  *   **Interpretation $\alpha$ (Welfarist Subtraction):** The cost is the reduction in $A$'s well-being. $P$ contributes to $A$'s happiness or preference satisfaction. Abandoning $P$ reduces $A$'s utility by amount $U_{loss}$. The objection claims $U_{loss} > (V_o - V_p)$.
  *   **Interpretation $\beta$ (Structural Disintegration):** The cost is not merely a loss of satisfaction, but the dissolution of the evaluative standpoint from which $A$ acts. $P$ is not merely a source of utility for $A$; it is constitutive of $A$'s practical identity. To treat $P$ as comparable to $O$ requires $A$ to adopt an instrumental stance toward $P$. However, $P$'s value (and $A$'s efficacy within it) depends on $A$ *not* viewing it instrumentally.

  **3. The Ambiguity in the Metric**
  The conceptual issue lies in the incompatibility of these two interpretations within the deliberative frame.

  Under Interpretation $\alpha$, the cost is commensurable. The consequentialist can argue that if $U_{loss}$ is high enough, the theory permits keeping $P$. The debate becomes empirical: how much happiness does $A$ lose? This renders the demandingness objection contingent on psychological facts rather than moral structure. Most sophisticated consequentialists accept this framing, arguing that agent-centered prerogatives can be modeled as weighted interests within the utility function.

  Under Interpretation $\beta$, the cost is incommensurable. The objection is not that $A$ loses happiness, but that $A$ is required to alienate themselves from their own commitments to satisfy the moral theory. The "cost" here is the forced adoption of a deliberative perspective (the "view from nowhere" or the "impersonal standpoint") that undermines the integrity of the agent.

  **The Crucial Tension:**
  The ambiguity becomes critical when $A$'s capacity to generate value is causally linked to their refusal to calculate costs. Suppose $A$ can only successfully execute $P$ (and thus generate $V_p$) if they regard $P$ as non-negotiable. If $A$ accepts the consequentialist metric (Interpretation $\alpha$), they must view $P$ as negotiable. By accepting the metric required to calculate the cost, $A$ degrades their ability to realize the value $P$ produces.

  Here, the "cost" is ambiguous between:
  1.  The loss of the specific goods $P$ produces (fungible).
  2.  The corruption of the agential architecture required to produce *any* goods reliably (structural).

  **4. The Rationalist-Adjacent Complication**
  This ambiguity is frequently discussed in rationalist-adjacent circles regarding "alignment" and "self-modification," often without precise resolution. The question is whether the demandingness objection targets the *output* of the moral algorithm (too much sacrifice) or the *computational overhead* of running the algorithm (the psychological cost of constant optimization).

  If the critique targets the output, it remains within Interpretation $\alpha$. If it targets the overhead, it leans toward Interpretation $\beta$. The unresolved issue is whether the "cost of optimization" is itself a welfare loss (stress, cognitive load) or a categorical shift in the agent's relationship to their values.

  For example, if $A$ must constantly monitor whether $P$ is still optimific, $A$ ceases to be the kind of agent for whom $P$ is meaningful. The consequentialist response is typically that $A$ should adopt a "disposition" to pursue $P$ if doing so maximizes value indirectly. However, this invites the regress problem: to maintain the disposition, must $A$ monitor the disposition's optimificity?
  *   If **yes**, the structural cost (Interpretation $\beta$) remains; the agent is never truly committed, only strategically pretending.
  *   If **no**, the theory relies on a self-effacing structure where the agent must ignore the moral metric to satisfy the moral metric.

  **5. Contested vs. Settled Status**
  *   **Settled:** Consequentialism requires the maximization of impersonal value. Demandingness objections claim this requirement is excessive.
  *   **Contested:** Whether the "excessiveness" is a function of the *magnitude* of welfare loss (which consequentialism can theoretically accommodate via discounting or thresholding) or the *type* of loss (which challenges the commensurability premise of consequentialism itself).

  Many critics equivocate between these two. They argue that the sacrifice is "too great" (implying magnitude, Interpretation $\alpha$) but describe the sacrifice in terms of "loss of self" or "integrity" (implying kind, Interpretation $\beta$). Consequentialists often exploit this by addressing the magnitude argument (e.g., "we can discount distant future benefits to lower the demand") while ignoring the structural argument, or vice versa.

  **6. Conclusion**
  The unresolved conceptual issue is whether the demandingness objection is an internal critique (arguing consequentialism fails by its own welfarist lights because the psychological costs of compliance outweigh the benefits) or an external critique (arguing that the welfarist metric itself is inadequate to capture the moral significance of identity-constituting commitments). Until the metric of "cost to the agent" is disambiguated between *fungible welfare depletion* and *agential disintegration*, the demandingness objection lacks a stable target. It remains unclear whether the objection is asking consequentialism to be less demanding or to be something other than consequentialism.
