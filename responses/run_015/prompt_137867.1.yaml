prompt: |-
  Hey — I need something I can actually put on the wall and use, not an essay about it.

  Im deputy director of comms at a regional public health agency. About 2 million people, four of us on the team, we push out two or three guidance lines or press lines a week, the chief medical officer signs off on anything with a number in it, and we usually have a few hours rather than a few weeks. Our recurring problem: the version of a claim that works is the confident one, and the version we can defend in front of a journalist is the careful one, and those arent the same sentence.

  Two features of our situation that I think matter. First, a lot of our claims are what I'll call uptake-linked: their truth depends on people believing them, because the believing is what produces the behaviour that makes them come true. ('If everyone cuts their contacts by about a third for two weeks, the hospitals will hold.') Others are nothing like that — the water is contaminated or it isnt, and no amount of confidence from us touches it. Second, we have what our team calls the archivist: a permanent local opposition group that screenshots every line we soften or overstate and recycles it for years. So an overclaim has a long tail, not just a news cycle.

  What I want is a decision procedure built out of the ethics-of-belief stuff I half remember from university — Clifford's flat rule about believing on insufficient evidence and his shipowner case, James's reply that when an option is genuine and the evidence genuinely cant settle it you're allowed to let your passional nature decide, and above all his thought that some facts only arrive at all if you've already banked on them. I dont want a summary of the debate and I dont want reading recommendations. I want: the questions in order, what counts as a sufficient answer to each, where the procedure stops and says no, and where it hands the decision back to a person because its a values question rather than a factual one.

  Three things it has to get right:

  1. Dont collapse "should I believe this" into "should I say it." For us those come apart constantly — sometimes the right move is to say the confident thing while believing the cautious one, sometimes I think the reverse, sometimes neither. Show me exactly where the gap is and what the procedure does when the two answers disagree.

  2. Give me an actual test for whether a belief is the kind that helps create its own object. Not "its motivating" — the shipowner's belief motivated him perfectly well and that was the whole problem. The test has to be about whether the believing is causally upstream of the fact believed. And most of our real claims are half-and-half: the hospitals hold if uptake is high AND staffing survives AND the variant isnt nastier than the modelling assumes. Tell me how to score a claim that's partly uptake-linked and partly not.

  3. Put the archivist in the procedure. How much weight does long-run damage to our credibility get, and at which step — is it a tiebreaker, a veto, or just one input among many?

  Then run it on three cases:

  (a) Next week we want to publish "If everyone cuts their contacts by about a third for the next two weeks, the hospitals will hold." Our modelling puts that somewhere near 60/40 and the modellers wont go on the record with the number.

  (b) A lab result on a municipal water supply is 36 hours late. We're maybe 80% sure the water is fine. Do we tell people its safe, or tell them to boil it.

  (c) The one I already know I wont like. Our staff are wrecked after two years of back-to-back surges, and the CMO wants to stand up at the all-staff meeting and say "the worst is behind us." Nobody knows that. But the team's view is that if she doesnt say it, a chunk of people quit. Tell me what the procedure actually says, not what would be kind.

  And last: where does it break. Which of these steps are judgement calls dressed up as procedure, whats the failure mode if we run it hard for six months, and what kinds of decisions should we keep out of it entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Deputy Director of Comms at a regional public health agency (2M population, 4-person team).
      *   **Problem:** Tension between *confident* claims (effective for behavior change) and *defensible* claims (safe from scrutiny/archivists).
      *   **Context:** High stakes, short timelines, "uptake-linked" claims (self-fulfilling prophecies) vs. "fact-linked" claims (objective reality), "Archivist" (opposition group tracking inconsistencies).
      *   **Theoretical Basis:** Ethics of Belief (Clifford vs. James). Specifically wants a *decision procedure*, not an essay.
      *   **Requirements:**
          1.  Distinguish "Should I believe?" from "Should I say?"
          2.  Test for "uptake-linked" claims (causal upstreamness), handling mixed claims.
          3.  Integrate the "Archivist" risk (long-term credibility damage).
          4.  Run on three specific cases (Hospital capacity, Water safety, Staff morale).
          5.  Identify failure modes/limits of the procedure.
      *   **Tone:** Practical, wall-ready, rigorous, no fluff.

  2.  **Deconstruct the Theoretical Framework (Clifford vs. James):**
      *   *Clifford:* Never believe on insufficient evidence. Duty to humanity. (Focus: Epistemic integrity, long-term trust).
      *   *James:* Genuine options (living, forced, momentous) where evidence is insufficient allow passional nature to decide. Some truths *require* belief to exist. (Focus: Pragmatic utility, self-fulfilling prophecies).
      *   *Synthesis for Comms:* We need a filter that respects Clifford's warning about evidence (for the Archivist/Fact claims) but allows James's permission for Uptake claims, *provided* the risk is managed.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like text structure.
      *   *Step 1: Classification.* Is this claim Fact-Linked or Uptake-Linked? (Addresses Req #2).
          *   Need a test for "causal upstreamness."
          *   Need a way to score mixed claims. Let's use a percentage estimate of "Uptake Dependency."
      *   *Step 2: Evidence Check (Clifford's Gate).* What is the evidentiary baseline?
          *   If Fact-Linked: High bar.
          *   If Uptake-Linked: Lower bar, but must be *plausible*.
      *   *Step 3: The Belief/Speech Gap (Req #1).*
          *   Can we *believe* it? (Clifford).
          *   Can we *say* it? (James/Pragmatism).
          *   If Belief = No, Speech = Yes -> Requires specific framing (aspirational vs. predictive).
      *   *Step 4: The Archivist Test (Req #3).*
          *   Long-term credibility cost.
          *   Is this a veto or a weight? It should be a veto on *false* facts, but a weight on *uncertain* predictions.
      *   *Step 5: Final Decision.*

      *Refining the "Uptake Test":* How do we know if belief causes the fact?
      *   *Test:* If we stay silent, does the probability of the outcome drop significantly?
      *   *Scoring:* 0% (Water is contaminated regardless) to 100% (Bank run/Stock market). Public health is usually 30-70%.

      *Refining the "Archivist":* The Archivist punishes *contradiction* and *overconfidence*.
      *   *Placement:* It shouldn't stop necessary Jamesian leaps, but it must penalize Clifford violations. Let's make it a "Credibility Budget" check.

      *Refining Belief vs. Speech:*
      *   *Belief:* "Is this true?"
      *   *Speech:* "Will saying this make it true / keep us trusted?"
      *   *The Gap:* If Belief=No but Speech=Yes, you are lying/manipulating unless framed as a *call to action* rather than a *prediction*.

  4.  **Developing the Procedure (The "Wall Chart"):**

      *   *Structure:* 5 Gates.
      *   *Gate 1: Causal Architecture.* (Fact vs. Uptake).
      *   *Gate 2: Evidentiary Floor.* (Clifford's Minimum).
      *   *Gate 3: The Jamesian Leap.* (Is belief necessary for the outcome?).
      *   *Gate 4: The Archivist Audit.* (Long-term cost).
      *   *Gate 5: Framing.* (How to say it).

  5.  **Addressing the Three Cases:**

      *   *(a) Hospital Capacity (Mixed/Uptake).* 60/40 model.
          *   Uptake high. Evidence moderate. Archivist risk medium (if hospitals overflow).
          *   Verdict: Say it, but frame as conditional commitment, not absolute prediction.
      *   *(b) Water Safety (Fact).* 80% sure.
          *   Uptake low (water doesn't care). Evidence high but not certain. Archivist risk high (people get sick).
          *   Verdict: Clifford wins. Do not claim safety. Precautionary principle.
      *   *(c) Staff Morale (Uptake/Social).* "Worst is behind us."
          *   Uptake high (morale affects quitting). Evidence low. Archivist risk high (if surge returns).
          *   Verdict: Tricky. James allows it *if* framed as organizational intent, not epidemiological fact. But Clifford warns against lying to staff.
          *   *Correction:* The prompt asks what the procedure *says*, not what is kind. If evidence is nil, Clifford says No. But if the *act* of saying it prevents the collapse, James says Yes. The procedure needs to weigh the "Credibility Budget." If you spend it on staff, you lose it with the public.
          *   *Decision:* The procedure should flag this as "Internal vs. External." Internal trust is also a resource. If the CMO lies to staff, internal trust breaks. The procedure should likely veto *factual* claims ("The virus is gone") but allow *commitment* claims ("We will get through this").

  6.  **Addressing the "Where it Breaks" (Failure Modes):**
      *   Bureaucratic paralysis (over-scoring).
      *   "Uptake" becoming an excuse for wishful thinking.
      *   The Archivist winning by making you too cautious to function.
      *   Moral distress (knowing you're spinning).

  7.  **Review against Constraints:**
      *   *Wall-ready?* Needs to be concise, bold headers, clear logic.
      *   *No essay?* Keep intro minimal.
      *   *Clifford/James integrated?* Yes, used as Gates.
      *   *Belief/Speech gap?* Explicitly addressed in Gate 5.
      *   *Archivist?* Explicit Gate 4.
      *   *Cases?* Applied rigorously.

  8.  **Final Polish:**
      *   Make the language directive ("Do this," "Stop here").
      *   Ensure the "Uptake Score" is practical (0-100%).
      *   Clarify the "Archivist" weight (it's a credibility tax).
      *   Ensure the distinction between *Prediction* (Fact) and *Promise* (Commitment) is clear in the framing step.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Use James." I need to operationalize James. James says you can believe if the option is *forced, living, and momentous* and evidence is *inconclusive*. I need to turn that into a checklist item.
      Also, the Belief/Speech gap needs to be the pivot point. If I believe X is false, but saying X makes X true, am I lying? James says no, it's creating truth. Clifford says yes, it's dishonest. The procedure needs to adjudicate this.
      *Decision:* The procedure treats "Creating Truth" as valid *only* if the mechanism is transparent enough to survive the Archivist. If the Archivist can prove you knew it was false *at the time*, you lose. So the framing must be "We will make this true" not "This is already true."

      *Refining Case C:* "The worst is behind us." This is a prediction about the virus, not a commitment by staff. If the virus surges again, the Archivist wins. The procedure should probably flag this as a *Veto* on factual prediction, but allow a *Pivot* to commitment ("We are ready for what comes"). I will be honest in the analysis: The procedure likely vetoes the specific phrase "The worst is behind us" because it fails the Evidentiary Floor for a factual claim, and the Uptake benefit doesn't outweigh the Credibility Tax if proven wrong.

      *Refining the Archivist:* The Archivist isn't just a risk; they are the enforcement mechanism for Clifford. They punish "Insufficient Evidence." So the Archivist Check is essentially: "Will this look like a Clifford Violation in 2 years?"

      *Final Plan:*
      1. Title: The Comms Ethics Protocol (Clifford-James Filter).
      2. The 5-Step Gate.
      3. The Three Cases.
      4. Failure Modes.
      5. Format: Clean, bold, actionable.

      *(Final check on "Belief vs Speech")*: The prompt asks to show *where the gap is*. I will add a specific output box at the end of the procedure: "Internal Stance" vs "External Phrasing."

      *(Final check on "Uptake Test")*: Needs to be concrete. "If we say nothing, does P(Outcome) drop by >10%?"

      *(Final check on "Archivist")*: Make it a "Credibility Tax." High tax requires High Uptake Benefit to justify.

      Let's write it.cw
answer: |-
  # THE COMMS ETHICS PROTOCOL (Clifford-James Filter)
  **For:** Public Health Guidance & Press Lines  
  **Use:** Before sign-off on any claim with uncertainty.

  ---

  ## PART 1: THE DECISION PROCEDURE

  Run every claim through these five gates in order. If you stop at a gate, that is your decision.

  ### GATE 1: CAUSAL ARCHITECTURE (The Uptake Test)
  **Question:** Does public belief in this claim causally increase the probability of the claim being true?
  **The Test:** If we stay silent, does the probability of the outcome drop by >10%?
  *   **NO (Fact-Linked):** The water is contaminated regardless of what we say. -> **Go to Gate 2A.**
  *   **YES (Uptake-Linked):** Hospital capacity holds *only if* people reduce contacts based on this message. -> **Go to Gate 2B.**
  *   **MIXED:** Score it. (e.g., Hospital capacity is 60% uptake, 40% staffing/variant). Record this **%U**.

  ### GATE 2A: EVIDENTIARY FLOOR (Clifford's Rule for Facts)
  **Applies to:** Fact-Linked claims (Water, Virus presence, Death counts).
  **Question:** Do we have sufficient evidence to defend this as fact today?
  *   **Standard:** Would this hold up in a court of law or a peer-reviewed journal *today*?
  *   **If NO:** **STOP.** Do not make the claim. Issue a precaution or state uncertainty.
  *   **If YES:** Proceed to Gate 4.

  ### GATE 2B: PLAUSIBILITY FLOOR (James's Rule for Uptake)
  **Applies to:** Uptake-Linked claims (Behavior change, Capacity holding).
  **Question:** Is the claim *possible*, even if not yet probable?
  *   **Standard:** Is there a credible mechanism (modelling, expert consensus) that makes this outcome achievable *if* uptake occurs?
  *   **If NO (Wishful Thinking):** **STOP.** Do not make the claim. It is a lie, even if motivational.
  *   **If YES (Plausible):** Proceed to Gate 3.

  ### GATE 3: THE BELIEF/SPEECH GAP
  **Question:** What is the relationship between what we *believe* and what we *say*?
  *   **Box A (Internal Belief):** "We believe this is X% likely to be true." (Based on Gate 2).
  *   **Box B (External Speech):** "We will state this as [Prediction / Commitment / Conditional]."
  *   **The Gap Check:**
      *   If **Box A = False** but **Box B = True**: **STOP.** You are manufacturing falsehood.
      *   If **Box A = Uncertain** but **Box B = Certain**: **PROCEED WITH CAUTION.** You are creating a self-fulfilling prophecy. This is permitted *only* for Uptake-Linked claims (Gate 1 = YES).
      *   **Action:** You must frame the speech to match the belief *unless* the uptake benefit outweighs the epistemic cost. (See Gate 4).

  ### GATE 4: THE ARCHIVIST AUDIT (Credibility Tax)
  **Question:** If this claim is proven false in 2 years, what is the cost?
  *   **The Tax:** Assign a cost (Low / Medium / High).
      *   *Low:* Minor adjustment, forgotten quickly.
      *   *Medium:* "They said X, happened Y." Usable by opposition for one cycle.
      *   *High:* "They lied to keep us locked down/open." Permanent loss of authority.
  *   **The Calculation:**
      *   For **Fact-Linked**: High Tax = **VETO**. (Clifford overrides James).
      *   For **Uptake-Linked**: High Tax is permitted **ONLY IF** the %U (from Gate 1) is >50% AND the consequence of silence is catastrophic (e.g., hospital collapse).
  *   **Decision:** If the Tax outweighs the Uptake Benefit, **STOP** or **REFRAME**.

  ### GATE 5: FRAMING (The Output)
  **Question:** How do we phrase this to survive the Archivist while keeping the Uptake?
  *   **Option A (The Prediction):** "X will happen." (Requires High Evidence).
  *   **Option B (The Commitment):** "We will ensure X happens." (Requires Organizational Control).
  *   **Option C (The Conditional):** "If we do X, Y will happen." (Best for Mixed Claims).
  *   **Rule:** Never use Option A for a Gate 2B claim. Use Option C.

  ---

  ## PART 2: CASE RUNS

  ### CASE (a): Hospital Capacity
  *Claim:* "If everyone cuts contacts by a third, hospitals will hold."
  *Data:* Model says 60/40. Modellers won't go on record.
  *   **Gate 1 (Architecture):** Mixed. Hospitals hold if uptake is high (Uptake) AND staffing/variant cooperate (Fact). **%U = 60%.**
  *   **Gate 2B (Plausibility):** Is it possible? Yes, modelling supports it. **PASS.**
  *   **Gate 3 (Gap):** Internal Belief = 60% likely. External Speech = "Will hold." **Gap Identified.** We are stating a probability as a certainty to drive behavior.
  *   **Gate 4 (Archivist):** If hospitals overflow, Archivist says "You lied." **Tax = High.**
      *   *Calculation:* Is %U > 50%? Yes (60%). Is silence catastrophic? Yes (panic/collapse).
      *   *Verdict:* Permitted, but requires Framing protection.
  *   **Gate 5 (Framing):** Do not say "Hospitals will hold."
      *   **Approved Phrasing:** "Our modelling shows hospitals *can* hold, provided we cut contacts by a third. That is the path we are taking." (Shifts from Prediction to Conditional Path).
  *   **Final Output:** Publish. Frame as Conditional.

  ### CASE (b): Water Safety
  *Claim:* "The water is safe."
  *Data:* 80% sure. Lab result 36h late.
  *   **Gate 1 (Architecture):** Fact-Linked. Water contamination does not care if people believe it. **%U = 0%.**
  *   **Gate 2A (Evidence):** Do we have sufficient evidence? 80% is not sufficient for public health safety facts. **FAIL.**
  *   **Gate 3 (Gap):** Internal Belief = Uncertain. External Speech = Certain.
  *   **Gate 4 (Archivist):** If people get sick, Tax = **Catastrophic/Veto.**
  *   **Decision:** **STOP.**
  *   **Approved Phrasing:** "We are awaiting final confirmation. Out of caution, boil water until further notice." (Clifford rule applies absolutely here).

  ### CASE (c): Staff Morale
  *Claim:* "The worst is behind us."
  *Data:* Nobody knows. CMO wants to prevent quit surge.
  *   **Gate 1 (Architecture):** Mixed. Morale is Uptake-Linked (belief prevents quitting). Virus trajectory is Fact-Linked. **%U = 40%** (Morale helps, but virus doesn't care).
  *   **Gate 2B (Plausibility):** Is it possible the worst is behind us? Yes. **PASS.**
  *   **Gate 3 (Gap):** Internal Belief = Unknown. External Speech = Factual Assertion. **Gap = Wide.**
  *   **Gate 4 (Archivist):** If a new variant hits in 3 months, Archivist screenshots this. Tax = **High** (Internal trust destroyed).
      *   *Calculation:* %U is only 40%. The Fact risk (virus returns) is high. The Credibility Tax on *internal* staff is higher than external.
  *   **Decision:** **VETO on specific claim.** You cannot spend external credibility to buy internal morale if the claim is factually falsifiable.
  *   **Approved Phrasing:** Pivot to Commitment (Option B). "We are building the capacity to handle whatever comes next. We will not let the next surge break us." (This is within organizational control, unlike the virus trajectory).
  *   **Final Output:** Do not say "The worst is behind us." Say "We are ready for what comes."

  ---

  ## PART 3: FAILURE MODES & LIMITS

  **1. The "Uptake" Loophole**
  *   **Risk:** Staff start classifying *all* claims as "Uptake-Linked" to bypass evidence requirements. ("If we say the virus is gone, people will relax, so it's effectively gone.")
  *   **Fix:** Gate 1 requires a mechanistic explanation. If the physical reality (virus physics, water chemistry) is independent of belief, it is Fact-Linked. No exceptions.

  **2. The Archivist Paralysis**
  *   **Risk:** After 6 months, the "Credibility Tax" calculation becomes too conservative. You stop making Uptake claims because the risk of being wrong is too high. You become accurate but useless.
  *   **Fix:** Quarterly review of "Saved Lives vs. Headlines." If you have high credibility but high mortality, the procedure is too Clifford-heavy. Re-calibrate Gate 4 to weigh harm of silence higher.

  **3. The Moral Distress of the Gap**
  *   **Risk:** Your team knows the Internal Belief (60%) and the External Speech ("Will hold"). This feels like lying. It causes burnout.
  *   **Fix:** Gate 5 Framing is mandatory. You are not allowed to state a probability as a fact. You must use "Conditional" or "Commitment" framing. If you cannot frame it honestly, you cannot say it.

  **4. Where to Keep it Out**
  *   **Do not use this for:**
      *   **Empathetic Statements:** ("We know this is hard." — Not a truth claim).
      *   **Procedural Updates:** ("The website is down." — Fact, but low stakes).
      *   **Values:** ("Equity is our goal." — Not falsifiable).
  *   **Do use this for:** Any claim involving risk, numbers, timelines, or safety status.

  **5. The Hard Limit**
  *   This procedure cannot save you if the **Modelling (Gate 2)** is garbage. If the science is wrong, the ethics of communication don't matter. The procedure assumes your scientific input is acting in good faith. If the CMO is politicizing the numbers, this protocol will just help you lie more efficiently. That is a personnel issue, not a comms issue.
