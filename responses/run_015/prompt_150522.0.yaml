answer: |-
  The stagnation of the Mary's Room debate is not a failure of imagination but a symptom of a category error embedded in the argument's architecture. Your hypothesis is correct: the deadlock is sustained by a systematic ambiguity in the definition of "physical information," but this ambiguity masks a deeper conflation of ontology and epistemology. The debate persists because the participants are not arguing over the same proposition; they are arguing over the *conditions of adequacy* for a physicalist worldview.

  ### 1. Diagnosis: The Ambiguity of the Physical
  The stalemate arises because "Physicalism" functions as a moving target between two distinct definitions of information:

  1.  **Fundamentalist Physicalism:** Physical information is that which is stateable in the vocabulary of a completed fundamental physics (mass, charge, spin, spatiotemporal relations).
  2.  **Structural/Functional Physicalism:** Physical information includes any third-person describable state, including complex relational, functional, or even indexical structures, provided they supervene on the fundamental base.

  **The Stall Mechanism:**
  *   **The Anti-Physicalist (Jackson/Chalmers)** operates with Definition 1. They argue that even a complete fundamental description leaves out the *qualitative character* of experience. Therefore, physicalism (defined as "everything is fundamental physics") is false.
  *   **The Physicalist (Lewis/Nemirow/Physicalist Concept Strategists)** often retreats to Definition 2, or shifts the goalposts to ontology. They argue that if the experience is caused by and identical to a physical state, the information was "there" in the system, merely accessed via a different mode (acquaintance vs. description).

  The debate loops because the Anti-Physicalist demands **Epistemic Derivability** (can I deduce the experience from the physics?), while the Physicalist defends **Ontological Identity** (is the experience nothing over and above the physics?). As long as one side treats the epistemic gap as proof of an ontological gap, and the other treats the ontological identity as sufficient to dismiss the epistemic gap, no progress is possible.

  ### 2. Reconstructing the Implicit Disagreement
  The explicit disagreement is: *Does Mary learn a new fact?*
  The implicit disagreement is: *What is the relationship between a description of a system and the system itself?*

  *   **Side A (The Dualist/Non-Reductivist):** Assumes **Representational Realism**. If a feature of reality (phenomenality) cannot be captured in the representational format of physical science, it is not a physical feature. For them, *knowing* is a relation to a truth condition; if the truth condition changes (from "wavelength 700nm" to "redness"), the fact changes.
  *   **Side B (The Reductive Physicalist):** Assumes **Ontological Monism**. The representational format is secondary to the substrate. For them, *knowing* is a state of the cognitive system. Mary's brain changes state. The "newness" is a property of Mary's cognitive architecture, not the world.

  **Substantive vs. Verbal:**
  *   **Verbal/Framing:** Whether we call Mary's new knowledge a "new fact," "new proposition," or "new ability." This is terminological. If we define "fact" as "truth condition," she learns a fact. If we define "fact" as "physical state of the world," she does not. This is merely stipulative.
  *   **Substantive:** The core substantive disagreement is about **Constitutive Explanation**. Can the first-person perspective be *constituted* entirely by third-person relations?
      *   If yes, the epistemic gap is a brute psychological limitation (a bug in human cognition).
      *   If no, the epistemic gap reveals a structural deficiency in physical reality (a bug in the universe).
      *   *This* is the non-verbal heart of the dispute. It is a disagreement about whether consciousness is *transparent* to structural description.

  ### 3. Proposed Conceptual Distinction: Ontological Completeness vs. Representational Saturation
  To dissolve the impasse, we must decouple the two claims usually bundled under "Physicalism."

  1.  **Ontological Completeness:** Every concrete particular and event in the universe is identical to, or constituted by, physical entities. (No "ghost stuff").
  2.  **Representational Saturation:** Every truth about the universe is capturable, derivable, or expressible within a third-person objective descriptive framework.

  **The Dissolution:**
  *   **Mary's Room refutes Representational Saturation.** It demonstrates that there are truths (or at least knowledge states) accessible only via a first-person mode of presentation that are not deducible from third-person data.
  *   **Mary's Room does *not* necessarily refute Ontological Completeness.** It is logically consistent to hold that the *experience* is identical to the *brain state* (Ontological Completeness) while admitting that the *concept* of the experience is not derivable from the *concept* of the brain state (failure of Representational Saturation).

  **The Revelation:**
  The sides are answering different questions.
  *   The **Dualist** asks: "Is the universe Representationally Saturated?" (Answer: No).
  *   The **Physicalist** asks: "Is the universe Ontologically Complete?" (Answer: Yes).

  By conflating these, the debate becomes a shouting match. The Physicalist says, "There's no extra stuff!" (Defending Ontology). The Dualist says, "But you can't describe it!" (Attacking Representation). Both can be right simultaneously. The "Hard Problem" is the demand that Ontological Completeness *entail* Representational Saturation. The diagnosis reveals this entailment is an unproven assumption, not a logical necessity.

  ### 4. What Could Move the Debate?
  Given the diagnosis that the stalemate is a clash between **ontological commitments** and **epistemic expectations**, neither empirical data nor formal logic can resolve it within the current framework.

  **The Result: Nothing At All.**

  **Justification:**
  1.  **Empirical Findings (e.g., sensory restoration):** Data regarding cataract patients or sensory deprivation only tells us about *correlations* and *concept acquisition timelines*. It cannot tell us whether the *content* of the experience was ontologically novel. A physicalist will interpret successful concept acquisition as "unlocking a module"; a dualist will interpret it as "encountering a new property." The data is theory-laden.
  2.  **Formal Theorems:** A theorem about descriptive completeness would rely on axioms defining "description" and "physical." Since the dispute is over those very definitions (as diagnosed above), a theorem would beg the question. Gödelian arguments (used by Lucas/Penrose/Chalmers) fail because they assume the mind can see the truth of statements the system cannot prove, which presupposes the non-algorithmic nature of mind—the very point in dispute.
  3.  **Phenomenological Reports:** These are the *explanandum*, not the *explanans*. Citing the intensity of the experience only reinforces the Dualist's intuition; it does not force the Physicalist to abandon Ontological Completeness.

  **Conclusion:**
  The debate cannot be "won" because it is not a scientific or logical puzzle; it is a **metaphysical boundary dispute**. The only way to move past it is not to solve Mary's Room, but to **dissolve the framework** that generates it. This requires abandoning the demand that Ontological Completeness must yield Representational Saturation.

  Progress will only occur if the philosophical community adopts a framework that accepts **Ontological Completeness without Representational Saturation** (a form of Non-Reductive Physicalism or Russellian Monism) or rejects the reality of the phenomenal datum entirely (Illusionism). Until the terms of engagement shift from "Is Physicalism true?" to "Why do we expect physics to be representationally saturated?", the debate will remain static. The impasse is not a lack of data; it is a saturation of the conceptual space.
