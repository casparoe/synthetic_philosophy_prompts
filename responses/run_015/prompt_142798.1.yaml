  hey, im trying to understand this bit from molyneux's 1688 letter to locke about the blind man and the cube and sphere. he asks if a man born blind, who learned to tell them apart by touch, could suddenly recognise them by sight alone once cured. heres the passage im stuck on: molyneux imagines the man is made to see, and asks whether he could distinguish the shapes just by looking, without reaching out. he seems to think he couldnt, because the ideas of extension and figure that come through feeling are not the same as the ones we get through sight — sight only gives us colours arranged in the field, and unless those colours have already been linked to tangible form through experience, the man has no basis for connecting them.

  my actual question is about the philosophy behind this, not just the story. is molyneux saying that visual and tactile space are literally different representations that need empirical mapping, or is he arguing that the concept of spatial form is tied to one modality in a stronger, almost conceptual way? and does this relate at all to the modern idea that spatial cognition might be amodal — that the brain uses one shared format for space regardless of sensory input? i feel like people usually read him as a straightforward empiricist, but the passage sounds more like he's analysing the conditions for having a spatial concept at all. could you walk me through it?

  please write in british english, and dont worry about giving me a bibliography or citations — i just want your own reasoning. also sorry if my spelling is a bit off, im writing this on my phone.
