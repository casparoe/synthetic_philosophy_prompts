prompt: |-
  I'm putting together a graduate seminar on rational choice for the spring, and I want to use, as a foil in the second week, a survey chapter on alternatives to expected utility theory that a colleague sent me. Before I hand its discussion of Buchak's risk-weighted expected utility (REU) to students as something to pick apart, I need to know how much of it a defender of that theory would actually grant. I don't need citations or a reading list — I can supply those myself — and I don't need a survey of the literature. What I want is an audit of a specific paragraph, plus an audit of a diagnostic exercise of my own that I have started to distrust.

  Let me first fix the formalism, so that we are talking about the same object; please correct me if I state it wrong. Outcomes of a gamble are ranked from worst to best, x₁ through xₙ, with utilities u(xᵢ). The risk function r maps [0,1] onto [0,1], is strictly increasing, and fixes 0 and 1. The value of a gamble is u(x₁) plus, for each step up the ranking, the utility increment at that step weighted by r applied to the probability of getting at least that-good an outcome: REU = u(x₁) + Σᵢ₌₂..ₙ r(P(outcome ⊒ xᵢ))·[u(xᵢ) − u(xᵢ₋₁)]. Expected utility is the special case where r is the identity. Risk aversion, on this picture, is not the concavity of u but the shape of r — a person who underweights the probability of rising above the worst outcome is risk-averse even if her utility for money is perfectly linear — and the two components are supposed to be separable: one is a fact about how much she cares about increments of goods, the other a fact about how much she cares about what happens in better states as opposed to worse ones.

  Here is what the chapter says, in its entirety on the subject:

  "Buchak's theory is best understood as a redescription of the familiar point that a risk-averse agent has a concave utility function for money. Instead of bending the curve over outcomes, she bends it over probabilities, replacing each probability p with a weight r(p), and the two manoeuvres do the same work: the theory's so-called risk attitude is just diminishing marginal utility in another notation. What is genuinely new is that the weights attach to the cumulative probability of an outcome's being at least as good as a given one, so that the weight an outcome receives depends on where it sits in the ranking of the gamble — and this is precisely where the theory breaks down. Once weights depend on rank, the theory must violate dominance: an agent may prefer one gamble to another that is at least as good in every state and better in some. That is not a risk attitude; it is a failure of instrumental rationality. Nor is the machinery new. Reweighting cumulative probabilities is exactly what prospect theory's weighting function does, so risk-weighted expected utility inherits prospect theory's liabilities, including its violations of stochastic dominance and its inability to be stated without a reference point and loss aversion. Finally, because the risk function can be tuned to fit whatever risk attitudes an agent happens to have, no pattern of choice could refute the theory, which makes it unfalsifiable rather than false. The upshot is that risk-weighted expected utility is not a genuine rival to expected utility theory: it is expected utility theory plus a parameter that does no work except to license the violation of dominance."

  Take that paragraph apart clause by clause: which clauses would a proponent of the theory accept without argument, which are exaggerations of something true, which are outright errors, and — this is the part I care about most — does the chapter's final verdict follow from whatever survives the corrections? I have three specific hunches, which I would like either confirmed or dismantled. First, I believe the dominance charge is simply false as stated, and that the chapter has fused two things the theory keeps apart: what REU gives up is independence, plus something like sequential consistency in dynamic choice, while it retains stochastic dominance. Second, I am much less sure about the prospect theory comparison — there is an obvious family resemblance, since both are rank-dependent, but the chapter seems to me to be importing features of prospect theory that REU does not have, and possibly attributing to REU a difficulty that in prospect theory arises only for certain parameter values. Third, the closing charge of unfalsifiability strikes me as too strong in the word but not empty in substance: my understanding is that the representation is unique, with u fixed up to positive affine transformation and r fixed given that normalization, so that a single pair has to fit the agent's whole preference ordering at once — but I am unsure how much comfort that really gives, given that r is not observable independently of u.

  That last worry is connected to the second thing I want checked, which is my own construction. In the seminar I had planned a short elicitation exercise meant to demonstrate to students that the shape of u and the shape of r are different components: fix an outcome pair, say nothing and two hundred dollars, elicit a certainty equivalent for each gamble that pays the larger amount with probability p and nothing otherwise, normalize so that u of nothing is 0 and u of two hundred is 1, and then look at the resulting curve — expected utility predicts that the utility of the certainty equivalent is p, whereas REU predicts that it is r(p), so with r(p) = p², for instance, the two theories diverge visibly by the time p reaches one half. I have come to think the exercise as stated is worse than useless: the students will be plotting certainty equivalents in dollars, whose curvature in p is the composition of r with the inverse of u, and I cannot see how to get u on the interval independently of the very data I am using to estimate r. Is that the right diagnosis, is there a repair that isolates the two components cleanly, or is the honest moral precisely the joint-uniqueness point, so that the exercise should be dropped and replaced with something that shows the in-principle identifiability of the pair?

  If there is a defensible reading of the sentence "the risk function does no work" — a reading on which it is fair, and one a proponent might even concede — I would like to hear it, since I would rather teach the strongest version of the objection than the one my colleague happened to write down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on rational choice (Spring).
      *   **Task:** Audit a specific paragraph from a survey chapter critiquing Buchak's Risk-Weighted Expected Utility (REU) theory. Also, audit a diagnostic exercise the user designed to teach the separation of $u$ and $r$.
      *   **Goal:** Determine what a proponent of REU would grant vs. reject in the paragraph. Assess if the chapter's final verdict follows from the corrected premises. Evaluate the user's three hunches (Dominance, Prospect Theory, Unfalsifiability). Evaluate the user's elicitation exercise (is it flawed? can it be fixed? what's the moral?). Find a defensible reading of "the risk function does no work."
      *   **Constraints:** No citations/reading lists needed. No literature survey needed. Focus on the specific paragraph and the specific exercise.
      *   **Tone:** Academic, precise, analytical, helpful for a seminar instructor.

  2.  **Deconstruct the Formalism (User's Statement):**
      *   *User:* Outcomes $x_1 \dots x_n$ (worst to best). Utilities $u(x_i)$. Risk function $r: [0,1] \to [0,1]$, strictly increasing, $r(0)=0, r(1)=1$.
      *   *Formula:* $REU = u(x_1) + \sum_{i=2}^n r(P(\text{outcome} \succeq x_i)) \cdot [u(x_i) - u(x_{i-1})]$.
      *   *Interpretation:* Risk aversion is shape of $r$, not concavity of $u$. Separability claimed.
      *   *Assessment:* This is correct. It matches Buchak's standard formulation (often written as $\sum r(P(X \ge x_i)) (u(x_i) - u(x_{i-1}))$ with $u(x_0)=0$). The distinction between risk attitude ($r$) and utility ($u$) is central to Buchak's project.

  3.  **Audit the Chapter Paragraph (Clause by Clause):**

      *   *Clause 1:* "Buchak's theory is best understood as a redescription of the familiar point that a risk-averse agent has a concave utility function for money."
          *   *Proponent View:* **Reject.** This is the core misunderstanding. Buchak argues $u$ represents *value* (attitude toward outcomes), $r$ represents *risk attitude* (attitude toward global properties of gambles). Conflating them loses the explanatory power (e.g., explaining why someone is risk-averse over money but risk-seeking over health, or vice versa, without changing the underlying value of the goods).
      *   *Clause 2:* "Instead of bending the curve over outcomes, she bends it over probabilities... and the two manoeuvres do the same work..."
          *   *Proponent View:* **Reject (mostly).** They are mathematically equivalent *for simple binary gambles over a fixed domain* if you allow $u$ to absorb $r$. But the *work* is different. $u$ is supposed to be stable across contexts; $r$ captures the specific attitude toward risk. If $u$ does all the work, you can't explain Allais-type preferences without violating EU. REU keeps EU structure but modifies the weighting.
      *   *Clause 3:* "What is genuinely new is that the weights attach to the cumulative probability... so that the weight an outcome receives depends on where it sits in the ranking of the gamble..."
          *   *Proponent View:* **Accept.** This is the definition of rank-dependent models.
      *   *Clause 4:* "...and this is precisely where the theory breaks down. Once weights depend on rank, the theory must violate dominance..."
          *   *Proponent View:* **Reject (Crucial).** This is the user's first hunch. REU *satisfies* Stochastic Dominance. It violates *Independence* (specifically, the Sure Thing Principle). The chapter confuses Rank-Dependent Utility (which satisfies SD) with models that might violate it under specific conditions or confuses it with Prospect Theory's original formulation (which had editing phases that could violate dominance). Buchak explicitly proves REU satisfies Stochastic Dominance.
      *   *Clause 5:* "That is not a risk attitude; it is a failure of instrumental rationality."
          *   *Proponent View:* **Reject.** Since SD is retained, instrumental rationality (in the standard sense) is preserved. The violation of Independence is argued to be rationally permissible (sensitivity to global risk).
      *   *Clause 6:* "Nor is the machinery new. Reweighting cumulative probabilities is exactly what prospect theory's weighting function does..."
          *   *Proponent View:* **Accept (with caveats).** It is rank-dependent, like Cumulative Prospect Theory (CPT).
      *   *Clause 7:* "...so risk-weighted expected utility inherits prospect theory's liabilities, including its violations of stochastic dominance..."
          *   *Proponent View:* **Reject.** CPT satisfies stochastic dominance. Original Prospect Theory (1979) did not always. REU satisfies SD. This is a factual error in the chapter.
      *   *Clause 8:* "...and its inability to be stated without a reference point and loss aversion."
          *   *Proponent View:* **Reject.** REU does *not* require a reference point or loss aversion. It is defined over final wealth/outcome positions, not gains/losses relative to a status quo. This conflates REU with Prospect Theory.
      *   *Clause 9:* "Finally, because the risk function can be tuned to fit whatever risk attitudes an agent happens to have, no pattern of choice could refute the theory, which makes it unfalsifiable rather than false."
          *   *Proponent View:* **Reject (mostly).** It's not unfalsifiable. The representation theorem requires the *same* $u$ and $r$ to fit *all* choices. If preferences violate the axioms (e.g., Transitivity, Continuity, or the specific Betweenness/Comonotonic Independence axioms), the theory is refuted. However, the *separability* of $u$ and $r$ is the tricky part (User's third hunch).
      *   *Clause 10:* "The upshot is that risk-weighted expected utility is not a genuine rival to expected utility theory: it is expected utility theory plus a parameter that does no work except to license the violation of dominance."
          *   *Proponent View:* **Reject.** It licenses violation of *Independence*, not Dominance. The parameter $r$ does work: it explains systematic deviations from EU (Allais) while preserving SD and allowing a distinct interpretation of risk vs. value.

  4.  **Evaluate User's Three Hunches:**
      *   *Hunch 1 (Dominance):* **Confirmed.** The chapter is wrong. REU satisfies Stochastic Dominance. It violates Independence.
      *   *Hunch 2 (Prospect Theory):* **Confirmed.** The chapter imports PT features (reference points, loss aversion, SD violations) that REU does not have. REU is closer to CPT (Cumulative PT) but without the reference point/loss aversion machinery.
      *   *Hunch 3 (Unfalsifiability):* **Nuanced.** The theory is falsifiable (axioms can be violated). But the *separation* of $u$ and $r$ is identification-challenged without cross-context data. If you only look at money gambles, $u$ and $r$ are confounded. You need different goods or specific elicitation to separate them. The chapter's claim is too strong ("no pattern could refute"), but the worry about flexibility is real.

  5.  **Audit the Diagnostic Exercise:**
      *   *User's Setup:* Binary gambles $(0, p; 200, 1-p)$. Normalize $u(0)=0, u(200)=1$.
      *   *User's Worry:* Plotting certainty equivalents (CE) in dollars. $u(CE) = REU$. If $u$ is unknown, you can't see $r$. The curvature of CE vs $p$ reflects $u^{-1}(r(p))$. You can't disentangle $u$ and $r$ using only one pair of outcomes.
      *   *Diagnosis:* **Correct.** With fixed outcomes $x, y$, you cannot distinguish a concave $u$ + linear $r$ from linear $u$ + convex $r$. They are observationally equivalent *within that domain*.
      *   *Repair:* You need to vary the outcomes to pin down $u$ independently, or assume $u$ is linear (money) to show $r$. But assuming $u$ is linear begs the question against the EU defender who says risk aversion *is* concave $u$.
      *   *Better Exercise:* To show the *conceptual* distinction, use a triad that triggers Allais preferences. EU cannot fit it without changing $u$ across problems (inconsistency). REU fits it with stable $u, r$.
      *   *Better Exercise for Separation:* Use different goods. If $r$ is global (attitude toward risk) and $u$ is local (value of goods), $r$ should stay constant while $u$ changes across goods. If risk aversion is just $u$-concavity, risk attitude should vary wildly with the good.
      *   *Moral:* The honest moral is joint identifiability. You cannot elicit $r$ without assuming something about $u$.

  6.  **Address "The Risk Function Does No Work":**
      *   Is there a defensible reading? Yes. If the only data is choice over monetary gambles, $r$ is mathematically redundant. Any REU preference can be represented by an EU preference with a different $u^*$.
      *   *Concession:* A proponent might grant that *mathematically*, for a fixed domain, the representation is equivalent to EU.
      *   *Defense:* The work is *explanatory* and *predictive across domains*. $u$ tracks value of goods; $r$ tracks attitude toward uncertainty. If I am risk-averse over money and health, EU says my $u$(money) and $u$(health) are both concave. REU says $u$(money) and $u$(health) reflect value, while $r$ explains the common risk aversion. This allows predictions: if $u$(health) is linear, I should still be risk-averse over health gambles. EU predicts risk-neutrality.
      *   *Verdict:* The parameter does no *mathematical* work within a single fixed domain (representation equivalence), but it does *theoretical* work (explanatory structure and cross-domain prediction).

  7.  **Drafting the Response:**
      *   **Structure:**
          1.  Formalism Check (Brief confirmation).
          2.  Paragraph Audit (Clause-by-clause breakdown).
          3.  Assessment of User's Three Hunches.
          4.  Audit of the Elicitation Exercise.
          5.  The "Does No Work" Concession.
      *   **Tone:** Professional, direct, philosophically precise.
      *   **Key Distinction:** Emphasize the difference between *representation equivalence* (math) and *explanatory distinctness* (theory). Emphasize Stochastic Dominance vs. Independence.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did Buchak prove SD? Yes, REU satisfies First-Order Stochastic Dominance. It violates Independence. The chapter claims it violates Dominance. This is a fatal error in the chapter.
      *   *Check:* Is REU unfalsifiable? No, it has axioms. But the *parameters* are flexible. The chapter says "no pattern of choice could refute." That's false. Violations of transitivity refute it.
      *   *Check:* The exercise. If I fix $u$ to be linear (money), then $r$ shows up. But the EU defender says "No, $u$ is concave." So the exercise fails to *persuade* the EU defender, though it illustrates the math. The user's diagnosis is right: you can't separate them with one outcome pair.
      *   *Refinement on "Does No Work":* Make sure to distinguish between "no work in fitting data" (false, it fits Allais) vs "no work in representation" (true, EU can fit it too with different $u$). The chapter implies the former, but the latter is the stronger philosophical point.

  9.  **Final Polish:** Ensure the distinction between "Dominance" and "Independence" is crystal clear, as that is the chapter's biggest blunder. Ensure the distinction between Prospect Theory (1979) and Cumulative Prospect Theory (1992) is noted regarding dominance, as REU aligns with CPT structure but without reference points.

  **(Self-Correction on the Exercise):** The user asks if there is a repair. The repair is to use *multiple* outcome pairs to pin down $u$, or to use a dynamic choice sequence where EU and REU diverge on *plans* vs *actions* (dynamic inconsistency). But for a simple static elicitation, the user is right: you can't separate them. I should validate that intuition.

  **(Self-Correction on "Does No Work"):** The strongest reading is: "For any REU representation, there exists an EU representation." This is true. The proponent concedes this but argues the REU representation is *better* because it separates two distinct psychological/philosophical concepts. The chapter claims it does *no* work except licensing dominance violations. Since dominance isn't violated, the charge collapses. But the "redundancy" charge holds mathematically.

