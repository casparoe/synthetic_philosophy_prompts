answer: |-
  Here is an audit of the formalism, the chapter paragraph, your three hunches, and your diagnostic exercise.

  ### 1. The Formalism
  Your statement of the formalism is correct. You have accurately captured the rank-dependent structure: outcomes are ordered, the risk function $r$ transforms cumulative probabilities, and the value is the sum of utility increments weighted by transformed cumulative probabilities. You are also correct that $r(p) = p$ recovers Expected Utility (EU), and that Buchak's central philosophical claim is the separability of $u$ (value of outcomes) and $r$ (attitude toward risk).

  ### 2. Audit of the Chapter Paragraph
  The paragraph is rhetorically forceful but technically sloppy. A proponent of REU would reject the majority of it, often on the grounds of factual error regarding the theory's axioms.

  *   **"Buchak's theory is best understood as a redescription of the familiar point that a risk-averse agent has a concave utility function for money."**
      *   **Verdict:** **Reject.** A proponent argues this is the *mistake* REU corrects. If risk aversion is just concave $u$, then an agent with linear $u$ (value) over money must be risk-neutral. REU allows linear $u$ with risk-averse $r$. Mathematically, for a fixed domain, one can absorb $r$ into a new $u^*$, but the proponent insists the *explanation* differs.
  *   **"Instead of bending the curve over outcomes, she bends it over probabilities... and the two manoeuvres do the same work..."**
      *   **Verdict:** **Accept (Mathematically), Reject (Theoretically).** Within a fixed domain of outcomes, any REU ordering can be represented by an EU ordering with a different utility function. They are representationally equivalent *locally*. However, they do not do the same *theoretical* work: EU forces risk attitude to vary with the good (via $u$); REU allows risk attitude to be global (via $r$).
  *   **"What is genuinely new is that the weights attach to the cumulative probability... so that the weight an outcome receives depends on where it sits in the ranking of the gamble..."**
      *   **Verdict:** **Accept.** This is the definition of rank-dependent models.
  *   **"...and this is precisely where the theory breaks down. Once weights depend on rank, the theory must violate dominance..."**
      *   **Verdict:** **Outright Error.** This is the paragraph's fatal flaw. REU satisfies **First-Order Stochastic Dominance**. It violates **Independence** (specifically, the Sure Thing Principle). The chapter conflates the two. A proponent would stop reading here, as the critique attacks a straw man.
  *   **"That is not a risk attitude; it is a failure of instrumental rationality."**
      *   **Verdict:** **Reject.** Since Stochastic Dominance is preserved, instrumental rationality (in the standard sense of preferring more to less when probabilities are fixed) is intact. The violation of Independence is argued to be a rational sensitivity to the global risk profile of the gamble.
  *   **"Nor is the machinery new. Reweighting cumulative probabilities is exactly what prospect theory's weighting function does..."**
      *   **Verdict:** **Accept (with caveats).** It shares machinery with *Cumulative* Prospect Theory (CPT). Original Prospect Theory (1979) applied weights to probabilities directly, not cumulatively, which led to dominance violations.
  *   **"...so risk-weighted expected utility inherits prospect theory's liabilities, including its violations of stochastic dominance..."**
      *   **Verdict:** **Outright Error.** As noted above, REU (like CPT) satisfies stochastic dominance. The chapter attributes the liabilities of the 1979 version of Prospect Theory to REU.
  *   **"...and its inability to be stated without a reference point and loss aversion."**
      *   **Verdict:** **Outright Error.** REU is defined over final wealth or absolute outcomes. It does not require a reference point, nor does it model loss aversion. This is a conflation with Prospect Theory.
  *   **"Finally, because the risk function can be tuned to fit whatever risk attitudes an agent happens to have, no pattern of choice could refute the theory, which makes it unfalsifiable rather than false."**
      *   **Verdict:** **Exaggeration.** The theory is falsifiable by violations of its axioms (Transitivity, Continuity, and the specific comonotonic independence axioms Buchak proposes). However, the *spirit* of the charge has weight: without cross-domain constraints, the flexibility of $r$ makes it hard to distinguish from a flexible $u$.
  *   **"The upshot is that risk-weighted expected utility is not a genuine rival to expected utility theory: it is expected utility theory plus a parameter that does no work except to license the violation of dominance."**
      *   **Verdict:** **Does Not Follow.** Since the theory does not violate dominance, the verdict collapses. The parameter licenses the violation of *Independence*, which is the actual point of contention.

  ### 3. Assessment of Your Three Hunches

  1.  **Dominance vs. Independence:** **Confirmed.** Your hunch is correct. The chapter fuses the two. REU retains Stochastic Dominance; it sacrifices Independence. This is the most important correction for your students. If they believe REU violates dominance, they will dismiss it as irrational immediately. If they understand it violates Independence to preserve Dominance in Allais-type cases, the debate becomes substantive.
  2.  **Prospect Theory Comparison:** **Confirmed.** The chapter imports liabilities (reference points, loss aversion, dominance violations) that belong to the 1979 Kahneman-Tversky model, not to the rank-dependent family (CPT/REU). REU is structurally similar to CPT but lacks the gain/loss framing. Attributing reference-point dependence to REU is a category error.
  3.  **Unfalsifiability:** **Partially Confirmed.** The claim "no pattern of choice could refute" is false (axiom violations refute it). However, your worry about joint identifiability is correct. Without assuming something about $u$ (e.g., linearity over money) or gathering data across different goods, you cannot uniquely identify $r$. A proponent would argue $r$ is identified by the *stability* of risk attitudes across different goods where $u$ varies, but this requires a richer dataset than simple gamble choices.

  ### 4. Audit of the Diagnostic Exercise

  Your diagnosis of your own exercise is **correct**. The exercise as stated is worse than useless; it is misleading.

  *   **The Problem:** In a binary gamble $(x, p; y, 1-p)$, the REU value is $u(x) + r(p)[u(y) - u(x)]$. The EU value is $u(x) + p[u^*(y) - u^*(x)]$. If you observe the Certainty Equivalent (CE), you observe $u^{-1}(REU)$. You are plotting $u^{-1}(u(x) + r(p)\Delta u)$. Even if you normalize $u(x)=0, u(y)=1$, the CE in dollars is $u^{-1}(r(p))$. The curvature you see is a composite of $r$ and the inverse of $u$.
  *   **The Conflation:** If students see a concave curve of CE vs. $p$, the EU defender says "That's concave $u$." The REU defender says "That's convex $r$ (for risk aversion) with linear $u$." You cannot distinguish these hypotheses using only one pair of outcomes.
  *   **The Repair:** To isolate $r$, you must fix $u$ independently.
      *   *Option A (Assumption):* Stipulate that $u$ is linear over money. This begs the question against the EU defender, who defines risk aversion *as* concave $u$.
      *   *Option B (Cross-Good Elicitation):* Elicit risk attitudes over money, health, and grades. If the curvature of the CE function is identical across all three, EU requires $u_{money}$, $u_{health}$, and $u_{grades}$ to all have the exact same curvature relative to their scales. REU allows $u$ to vary while $r$ remains constant. This demonstrates the *explanatory* benefit of $r$, even if mathematical separation is difficult.
      *   *Option C (Dynamic Choice):* Use a sequence where REU and EU diverge on dynamic consistency. REU agents may plan to choose A but choose B later (time inconsistency) because the risk profile of the remaining sub-gamble changes. EU agents do not. This shows the *cost* of the theory (dynamic inconsistency) rather than the separation of parameters.
  *   **The Moral:** The honest moral is **joint identifiability**. You cannot elicit $r$ without assuming a structure for $u$. The exercise should be replaced by one that shows why we *want* to separate them (e.g., the Allais paradox), rather than one that claims to measure them directly.

  ### 5. A Defensible Reading of "The Risk Function Does No Work"

  There is a reading of this sentence that a proponent might concede, which you can use to strengthen the seminar discussion.

  *   **The Concession:** Mathematically, for any preference ordering satisfying the REU axioms over a fixed domain, there exists a utility function $u^*$ such that the agent maximizes Expected Utility with $u^*$. In this specific sense, the parameter $r$ is **representationally redundant**. It does no work in *fitting the choice data* that a flexible $u$ could not also do.
  *   **The Defense:** The work $r$ does is **explanatory and predictive**, not representational.
      1.  **Explanation:** It captures the intuition that "I value \$100 twice as much as \$50" ($u$) is a different claim than "I prefer a sure \$50 to a 50/50 of \$0/\$100" ($r$). EU collapses these into one curve; REU separates them.
      2.  **Prediction:** If $r$ is a stable psychological trait (global risk attitude) and $u$ is local (value of specific goods), REU predicts that risk aversion should persist even over goods with linear value. EU predicts risk neutrality over goods with linear value. If you find an agent who values money linearly (by direct rating) but still rejects fair monetary gambles, EU must say their ratings are wrong. REU says their risk function is active.
  *   **Teaching Point:** The chapter's claim is fair if interpreted as "REU does not expand the set of representable preference orderings over a fixed domain beyond what EU can do with a flexible utility function." It is unfair if interpreted as "REU offers no explanatory advantage or distinct predictions across contexts."

  **Summary for your Seminar:**
  The chapter paragraph is largely unreliable due to the dominance/independence confusion. Your hunches are correct. Your exercise correctly identifies the identification problem but cannot solve it without additional assumptions. The strongest version of the objection is not that REU is irrational (it satisfies dominance), but that it is mathematically redundant within a fixed domain, forcing the defense to rest on cross-domain explanatory power rather than static choice fitting.
