answer: |-
  **Module:** MA Population Ethics and Public Policy
  **Assessment:** Final Examination (Sit-down)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  ***

  ### Exam Question

  Critically evaluate the principle of **'demographic neutrality'**: the claim that liberal states ought to remain neutral regarding population size, treating reproductive choices as private matters akin to conceptions of the good. Does the recognition that births aggregate into significant collective effects (such as climate impact or resource depletion) necessitate abandoning this neutrality? In your answer, distinguish carefully between pronatalism as an *axiological* claim (that more lives create more value) and pronatalism as a *deontic* claim (that there are duties or strong reasons to reproduce).

  ***

  ### Model Answer

  The principle of demographic neutrality posits that the state should not favour any particular population size, much as it should not favour any specific conception of the good life. This is grounded in liberal respect for autonomy: reproductive choices are viewed as private goods, central to personal identity and liberty. However, this neutrality faces a formidable challenge when reproductive choices are recognised as having cumulative public consequences, particularly regarding environmental sustainability and resource allocation. To evaluate whether neutrality collapses under this pressure, one must distinguish between the value of population growth and the duty to achieve it.

  First, demographic neutrality must not be conflated with indifference. A neutral state may acknowledge that population size matters for economic stability or ecological balance without endorsing a specific target. Neutrality prohibits the state from using coercive power to enforce a specific demographic outcome based on a contested view of value. Therefore, the mere existence of collective effects does not automatically void neutrality. If every action with aggregate effects justified state intervention, the private sphere would vanish. The crucial question is whether the magnitude of these effects crosses a threshold of harm that legitimises non-neutral policy.

  Here, the distinction between axiological and deontic pronatalism is vital. Axiological pronatalism claims that a larger population is intrinsically better—that more happy lives equal more total value. Even if one accepts this axiological claim, it does not necessarily justify state intervention. A liberal state might recognise that more people create more value but still refrain from encouraging births, respecting the right of individuals to opt out of creating value for the collective. Thus, axiological claims alone are insufficient to overturn demographic neutrality.

  Deontic pronatalism, however, argues that there are moral duties or strong reasons to reproduce. If such duties exist, they might stem from obligations to sustain future generations or maintain social structures. If reproduction is a duty, it ceases to be a purely private preference. However, establishing a duty to reproduce is philosophically precarious. Unlike duties not to harm (which are easily linked to collective climate impacts), positive duties to bring new people into existence are harder to enforce without violating bodily autonomy.

  Consequently, the collective footprint of births creates an asymmetry. Negative externalities (carbon emissions) might justify state measures to *discourage* high fertility rates to prevent harm, potentially compromising neutrality on the downside. Yet, this does not validate positive intervention to *increase* population based on axiological claims. The state might limit family size for ecological reasons without having a duty to maximise population for value-based reasons.

  In conclusion, demographic neutrality does not fully collapse under the weight of collective effects, but it becomes asymmetrical. The aggregation of environmental harm may permit non-neutral policies aimed at mitigation (restricting growth), but it does not validate axiological pronatalism as a basis for state encouragement. Neutrality remains viable regarding the *value* of population, even if it must be compromised regarding the *limits* of population to prevent harm. The liberal state can recognise the public nature of reproduction without endorsing a specific demographic telos.

  ***

  ### Marking Scheme

  **Total Marks: 25**
  **Grade Boundaries:** A (20–25), B (15–19), C (10–14), D/F (0–9)

  To achieve an **A Grade (20+ marks)**, the answer must successfully execute the following five specific moves. Answers lacking these distinctions should be capped at a B grade, regardless of writing quality.

  1.  **Conception of Neutrality:** The student must define demographic neutrality correctly as a constraint on state justification (not favouring one view of the good), explicitly distinguishing it from simple *indifference* to outcomes. (5 marks)
  2.  **Axiological vs. Deontic Distinction:** The answer must clearly separate the claim that more people are *valuable* (axiological) from the claim that individuals have a *duty* to reproduce (deontic). (5 marks)
  3.  **The Private/Public Threshold:** The student must address whether aggregate effects (externalities) automatically justify state intervention, noting that not all collective impacts void private liberty (the threshold problem). (5 marks)
  4.  **Asymmetry of Intervention:** The answer should identify that collective harms might justify limiting population (negative duties) without necessarily justifying state encouragement to grow population (positive duties), even if growth is axiologically good. (5 marks)
  5.  **Nuanced Conclusion:** The conclusion must not be a simple 'yes/no' on neutrality. It should reflect the complexity that neutrality might hold for value claims but fail regarding harm prevention (or vice versa). (5 marks)

  **B Grade (15–19 marks):**
  *   Defines neutrality and distinguishes axiological/deontic claims.
  *   Discusses collective effects but may treat them as automatically overriding neutrality.
  *   May fail to identify the asymmetry between limiting vs. encouraging population.
  *   Conclusion is somewhat binary.

  **C Grade (10–14 marks):**
  *   Discusses population ethics generally but conflates neutrality with indifference.
  *   Fails to clearly distinguish between axiological and deontic claims.
  *   Focuses heavily on environmental issues without linking back to liberal legitimacy.

  **D/F Grade (0–9 marks):**
  *   Significant misunderstandings of key terms.
  *   Fails to address the prompt's specific framing.
  *   Incoherent or incomplete.
