  Please write the exam question, the model answer, and a marking scheme built around five specific moves an A answer must contain — for example, spotting the asymmetry between procreative reasons and procreative duties, and not conflating neutrality with simple indifference. Keep everything self-contained: no bibliography requests, no obscure named theorists that students can't place without searching, and no verbatim quotes from real texts — paraphrase only. British spelling throughout, please. Oh, and there might be a typo or two in my message — I'm writing this on my phone after a long train journey — but thier exam materials should be clean.
