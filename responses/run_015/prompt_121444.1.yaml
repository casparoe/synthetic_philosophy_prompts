  hey — I'm an ML researcher and I spend most of my day fitting reward models from pairwise human preference data: a few dozen raters, each ranking a handful of model completions, and I need to turn that into one scalar reward function the policy can be optimized against. I keep getting told this is "literally a social choice problem" and that Arrow's theorem should worry me. I want to know whether that's true or whether it's philosophers playing dress-up.

  So: translate Arrow's theorem into the vocabulary I actually use — raters as noisy draws from a population, candidates as a fixed item set, a profile as a dataset, the social welfare function as a map from preference data to a global ranking or a reward model, unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship. Be honest: don't smuggle in my assumptions and call them translation. If the honest version of "IIA" is something like a sparsity/locality constraint on how the aggregator is allowed to depend on the data, say so; if "unrestricted domain" is really "we refuse to model the input distribution", say that instead of "no assumption on preferences".

  Then the residue report, which is the part I actually care about. Which bits have no counterpart on my side? I have a few guesses I want checked rather than flattered:

  - Arrow's setup has no ground truth. My whole vocabulary is built around raters being noisy measurements of an underlying reward. Is the theorem even about anything I'd recognize, once that's gone?
  - My raters carry intensity (Bradley–Terry scores, margins, how much they care) and Arrow's voters apparently don't. Does adding cardinality kill the result, or does it just move the impossibility somewhere else?
  - I've had it in my head — badly remembered, so correct me — that IIA basically forces the aggregator to be a kind of junta in the Boolean-functions sense: a function of the profile that only ever looks at one coordinate, with the rest of the proof being an ultrafilter argument in a hat. Is that a fair way to see it, or am I pattern-matching on the word "dictator"?

  Last thing. Tell me what would have to be true of my raters for the theorem to stop biting. I've seen "single-peaked preferences" floated as an escape route — translate that into my terms as literally as you can (raters all ranking by distance from their own ideal point in one shared embedding? the data lying near a low-dimensional structured model?) and then tell me whether assuming it is a real empirical claim about human raters or me stipulating my way out of an inconvenience.

  Don't give me a reading list; I can't follow it up anyway. End with a single line: \answer{one of target-framework-defect | arrow-framing-artifact | both | neither, then a colon and at most ten words of clarification}.
