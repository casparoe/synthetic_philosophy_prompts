answer: |-
  ### Translation: Arrow's Theorem into ML Vocabulary

  *   **Voters:** Raters (fixed set or sampled population).
  *   **Alternatives:** Candidate completions (fixed item set for the theorem's duration).
  *   **Profile:** The dataset $D$ of pairwise comparisons.
  *   **Social Welfare Function:** Your training algorithm + architecture mapping $D \to R_\theta$.
  *   **Unrestricted Domain:** The training pipeline must converge for *any* possible dataset of pairwise labels, even if logically contradictory (cycles). Honest translation: **We refuse to model the input distribution.**
  *   **Pareto:** If every rater labels $A \succ B$, the learned reward must satisfy $R(A) > R(B)$.
  *   **Independence of Irrelevant Alternatives (IIA):** The learned ranking of $A$ vs $B$ depends *only* on data comparing $A$ and $B$. Data involving $C$ cannot influence the relative score of $A$ and $B$. Honest translation: **No information propagation through shared candidates.**
  *   **Non-dictatorship:** The final reward function is not simply copying the labels of a single specific rater ID regardless of others.

  ### Residue Report

  **1. Ground Truth**
  You are correct: Arrow's setup has no ground truth. It is a normative problem (how to aggregate wills), not a positive one (how to estimate a parameter). Your vocabulary assumes raters are noisy measurements of a latent $R^*$. Once you posit a latent $R^*$, you are doing **statistical estimation**, not social choice. Arrow's impossibility vanishes because there is a "correct" answer to converge upon. The theorem is not about anything you recognize once you assume a generative model for the labels.

  **2. Cardinality and Intensity**
  Arrow is strictly ordinal (rankings only). You use cardinal utilities (Bradley–Terry logits). Adding cardinality **kills the result**. Arrow's proof relies on the inability to compare intensity across voters. By assuming a shared latent scale (your model architecture), you enforce interpersonal comparability by fiat. This bypasses Arrow, though it introduces the unverified assumption that "rater A's 5-point margin equals rater B's."

  **3. IIA and Juntas**
  Your intuition is fair. IIA forces extreme locality: the function cannot integrate information across triples. In the proof, this constraint restricts the aggregator so severely that only a dictator (or a junta in generalized settings) satisfies the consistency requirements. Because your ML model *violates* IIA (learning $R(A)$ uses comparisons against $C$), you escape the dictator conclusion. You pay for this with sensitivity to the candidate set composition.

  ### Escape Routes: Single-Peaked Preferences

  **Translation:**
  Single-peakedness means all completions lie on a shared 1D manifold (or low-dimensional embedding), and every rater has an "ideal point" on that manifold. Preferences decay monotonically with distance from that ideal point.

  **Empirical Claim vs. Stipulation:**
  For general text completions, this is **stipulating your way out of an inconvenience**. Human preferences over text are multimodal and context-dependent; they do not lie on a single linear spectrum where "middle" options are always preferred to "extremes." Assuming this is a regularization bias you impose to make optimization tractable, not a fact about your raters. It solves the theoretical impossibility by restricting the domain, but it risks misspecifying the true reward landscape.

  \answer{arrow-framing-artifact: Arrow requires ordinality; you assume cardinal latent ground truth.}
