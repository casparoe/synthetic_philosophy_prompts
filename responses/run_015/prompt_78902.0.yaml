answer: |-
  Your friend's economic model is a valid description of political negotiation but fails as a complete moral theory because it treats fundamental principles as tradable preferences and incorrectly labels principled refusal as irrational.

  Philosophers who study compromise would agree with your friend that many disputes are actually clashes of interest rather than clashes of principle, and that "transaction costs" like pride, mistrust, or poor communication often prevent mutually beneficial agreements. In policy-making, where the goal is to manage a pluralistic society, viewing compromise as a Pareto improvement (making everyone better off without making anyone worse off) is a standard and useful framework. This works well for your wind farm example because both the environmentalist and the farmer are debating *degrees* of implementation rather than fundamental existence; they are optimizing variables within a shared system.

  However, the claim that values are "just preferences" is the biggest oversimplification. In philosophy, a preference is something you want more or less of (like liking coffee over tea), whereas a value often functions as a constraint or a rule (like "do not kill"). You can trade preferences, but you cannot trade constraints without breaking the system they protect. If an activist values "no slavery" and a plantation owner values "profit," there is no exchange rate that allows for "a little bit of slavery" because the activist's value is a binary constraint, not a scalable preference. Philosophers call this incommensurability, meaning there is no common currency to measure the trade, so a deal isn't just hard to find—it's logically impossible without one side abandoning their core moral framework.

  This leads directly to why the "always irrational" claim is wrong. If morality involves duties or rights that cannot be violated, then refusing to compromise is not irrational inefficiency; it is integrity. A philosopher would argue that rationality is about choosing the right means to your ends, but if your end is "do no harm," accepting a deal that causes harm is actually the irrational move because it contradicts your own goal. Your friend is applying economic rationality (maximize utility) to moral rationality (maintain integrity), and those two often conflict.

  Finally, you are right to suspect a conflation between compromising values and trading actions. There is a major difference between compromising on *what we do* (action) and compromising on *what is right* (value). I can agree to stop protesting a building project (action) because I value social peace, without agreeing that the project is good (value). But sometimes the action itself is the value, such as refusing to lie; in those cases, changing the action means corrupting the value. Your friend's model works when parties are negotiating actions while keeping values intact, but it breaks down when the negotiation requires one party to validate something they believe is inherently wrong. So, his summary is fair for political bargaining and policy disputes, but it is wrong as a universal rule for moral life because it ignores that some things are not for sale.
