  **MEMORANDUM**

  **TO:** All Heads of School
  **FROM:** Interim Committee on the Scientific Status of Historical Sciences
  **SUBJECT:** Reclassification of the Department of Biology
  **DATE:** 24 May 2024

  1. The Committee has completed its audit of the Department of Biology against the Strict Falsificationist Demarcation Criterion. Effective immediately, the Department is reclassified from "Empirical Science" to "Metaphysical Research Programme." This status acknowledges the heuristic fruitfulness of Darwinism while noting its inability to generate universally testable laws.^1

  2. Regarding the principle of "survival of the fittest," the Committee notes a persistent categorical error. If "fitness" is defined by actual survival, the principle is a tautology. If defined as expected reproductive success, it becomes testable only if the environment is specified independently of the outcome. Submissions from the Department consistently reconstruct ancestral environments based on the very traits they seek to explain. This circularity precludes falsification.

  3. Consider the case of the Caithness dune-wasp. The Department claims the species' pale throat-patch is an adaptation for signalling in ancestral dunes. When asked to specify the lighting conditions of said dunes independently of the patch's visibility, researchers supplied estimates derived from the patch's reflectance. When asked what observation would have counted against the signalling hypothesis, no response was filed. One researcher suggested "a dark patch," but conceded this would merely indicate a different environment. Consequently, the patch is hereby categorised as "Historically Contingent Artefact."

  4. Administrative adjustments follow:
      a) **Grant Applications:** Projects relying on natural selection must apply under Code MET-4 (Speculative Metaphysics) rather than SCI-1. Funding levels remain comparable, though overheads differ.
      b) **Museum Storage:** Taxonomists are to be re-housed within the Archives Division. Specimens remain accessible but are now classified as "Exhibits of Narrative Interest."
      c) **Syllabus:** Natural selection may remain in undergraduate modules provided it is labelled "Historical Narrative." Examination questions must not imply predictive capacity.
      d) **Peer Review:** Journals are instructed to return adaptationist papers lacking a "Metaphysical Disclaimer" on the first page.
      e) **PhD Theses:** Doctoral work in evolutionary biology will be catalogued under "History of Ideas." Graduates may not wear scientific hoods at convocation.

  5. The Committee wishes to clarify that this reclassification does not imply Darwinism is false. The Committee accepts that evolution occurred. Nor does it imply the theory is trivial; its capacity to organise data is acknowledged. The issue is strictly epistemic categorisation.

  6. Regarding potential disruption, the Committee has identified no tangible harm in continuing to teach natural selection as science, provided students are informed of its metaphysical status. However, administrative consistency requires that billing codes match epistemic categories. Therefore, the reclassification stands despite the absence of identified pedagogical risk. It is preferable to be accurately metaphysical than inaccurately scientific.

  **Questions Members Have Asked**

  **Q: Does this mean we cannot hire biologists?**
  A: You may hire them as "Historians of Nature." Salary scales are identical, though tenure tracks may require a minor in Hermeneutics.

  **Q: Is Physics safe?**
  A: Generally, yes. Provided physicists stop proposing multiverses that cannot be observed. The Committee is monitoring Cosmology.

  **Q: Why proceed if Popper himself withdrew this assessment?**
  A: The Committee operates on the 1974 Standard. Later softenings are considered retrospective amendments not applicable to prior audits.

  **Q: What if a biologist predicts a fossil successfully?**
  A: That specific prediction is scientific. The framework generating it remains metaphysical. Please bill accordingly.

  ^1 *The Committee notes Karl Popper's public withdrawal of this assessment in 1978. It has been determined that a philosopher's change of mind does not constitute a binding administrative precedent.*
