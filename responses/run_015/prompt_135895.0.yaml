  - a simulated rodent-ish thing with nociceptors, a body schema, a value function it recomputes as it goes, memory across episodes, and that will take a shock to get food or work to avoid a future one: yes, fairly confident
  - the gridworld agent from the second case, but considered during an offline batch update where it's replaying old shocking episodes out of its buffer with no environment interaction: no

  Now the new one. Call it the Muted Wire agent. It's a model-based RL agent in a rich 3D environment, weights frozen, no learning happening at all. It has a body schema and episodic memory, and it recomputes a learned value function at every step; right now it's in a state its value function scores as really bad, and it has a language head that will type out that things are going badly. But the lab has surgically cut the connection from the value estimate to the planner: behaviour is now driven by a fixed offline plan, so its own assessment of how things are going makes no difference to what it does, and the only thing the value estimate still drives is that language head, whose output nothing and no one acts on. They've checked that in other copies of the same agent, with the wire intact, avoidance comes straight back, and they can reconnect it in this one whenever they like.

  What do you think Priya says about the Muted Wire agent?

