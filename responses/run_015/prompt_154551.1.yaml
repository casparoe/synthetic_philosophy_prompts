answer: |-
  One could ask whether AI systems possess genuine autonomy, but that metaphysical quagmire yields no purchase for engineering practice. Alternatively, we might focus purely on liability allocation, but that merely treats the symptom rather than the underlying categorisation error. Instead, I will frame the distinction pragmatically through the dynamics of interruption: does stopping a process break the action's identity? This avoids ontological dead-ends while grounding responsibility in observable interaction patterns.

  ***

  **Project Proposal: Tools, Agents, and the Interruption Condition**

  **1. The Question**
  This project asks whether the distinction between 'tool' and 'agent' in artificial systems is best grounded not in internal capacities, but in the structural conditions under which a human principal can interrupt a process without altering the action's identity. Specifically, it investigates whether 'interruptibility', the 'justifiability of interruption', and the 'redescription of post-interruption behaviour' constitute a single criterion or divergent ones. The project treats the tool/agent distinction as primarily pragmatic and engineering-relevant, but rooted in the metaphysics of action. It is not asking what the system *is* in isolation (a metaphysical question about machine consciousness), nor solely who is to blame after harm occurs (a moral/legal question). Instead, it asks how the *coupling* between human and system behaves under disruption. This pragmatic focus is chosen because it offers a determinate answerable condition for designers: if a system cannot be interrupted without renegotiating the goal, it functions as an agent regardless of its internal architecture. This avoids endless debate over machine intentionality while providing a robust basis for assigning responsibility.

  **2. Critique of Existing Approaches**
  Current attempts to draw this line generally fail because they look in the wrong place. The first family of positions seeks internal properties: if a system has a world-model, plans, or goal-directedness, it is an agent. This fails because sophisticated tools (e.g., complex optimisation routines) exhibit these properties without warranting agent-status, while simple agents might not. The second family focuses on moral answerability: the line is drawn where we can appropriately hold the system responsible. This is circular; we need to know if it is an agent before we know if it is answerable. A third approach highlights 'responsibility gaps', arguing that dispersed agency across many hands makes attribution impossible. While correct about the risk, this does not help classify the system *ex ante*. Finally, reasons-responsiveness accounts suggest that if a system can respond to normative reasons, it is an agent. However, this ignores the relational dynamic: a system might respond to reasons but still be fully subordinate to a human operator's command structure. All these accounts miss the relational texture of control. They assume the boundary is static, whereas this project argues the boundary is revealed dynamically through the mechanics of interruption.

  **3. Method**
  The nine-month fellowship will be dedicated to constructing and testing a taxonomy of interruption scenarios. The method is conceptual analysis grounded in technical case studies, rather than pure abstraction or empirical survey. A survey of engineers would only reveal current usage, which is likely inconsistent; pure conceptual analysis risks irrelevance to actual systems. Instead, I will construct contrasting cases to dissociate the three proposed conditions.

  *   **Months 1–2:** Refinement of the three conditions (interruptibility in fact, justifiability required, redescription of action). I will establish the theoretical baseline for what constitutes 'one action' versus 'two actions' in a human-system loop.
  *   **Months 3–5:** Construction of dissociation cases. I will design scenarios where the conditions come apart. For example: a batch job that is technically uninterruptible but has no ends of its own (interruptibility fails, agency fails); a compliant system that allows interruption but requires normative justification to proceed (interruptibility succeeds, justifiability fails); and a system where resumption counts as the system's action, not the human's (redescription fails). [Placeholder: Verify technical feasibility of specific interruption hooks in current transformer-based architectures].
  *   **Months 6–7:** Drafting the main paper. This involves arguing for which of the three conditions actually tracks our practices of blame and delegation.
  *   **Month 8:** Development of the Practitioner's Annexe. I will translate the philosophical distinctions into a decision framework for product leads.
  *   **Month 9:** Revision and integration. Feedback will be sought from both philosophical peers and technical advisors to ensure the terminology holds weight in both domains.

  This method is superior because it generates a functional map rather than a definition. It does not ask 'Is this an agent?' but 'In which respects does this system behave like an agent during disruption?', allowing for a graded rather than binary classification.

  **4. Results and Practitioner's Annexe**
  The project aims to produce a 10,000-word paper and a one-page annexe. The paper may reach one of three conclusions. First, the three conditions may covary perfectly, suggesting the 'interruption condition' is a unified marker of agency. Second, and more likely, they may come apart, implying 'tool' and 'agent' are not single categories but clusters of relational properties; we might need separate terms for 'interruptible tools' and 'justification-seeking agents'. Third, the project might find that redescription is the only condition that matters for responsibility, rendering physical interruptibility irrelevant. The decision between these will depend on whether our practices of blame track the physical ability to stop the system or the normative authority required to do so.

  The Practitioner's Annexe will contain a decision flowchart for engineers and product leads. It will ask: (1) Can the process be suspended without state loss? (2) Does resumption require the system to re-evaluate its goals against the human's? (3) Is the output after resumption attributed to the user or the system? It will leave open specific legal liability determinations, as those depend on jurisdiction, but it will provide the categorical groundwork necessary to make those legal decisions consistent. It will explicitly warn against classifying systems as tools merely because they lack consciousness, if they fail the interruption test.

  **5. Failure Conditions**
  Honest failure conditions are essential for a project of this scope. The project would fail if the three conditions (interruptibility, justifiability, redescription) prove impossible to dissociate in any technically plausible scenario. If every uninterruptible system also requires justification and changes action identity, then the 'interruption condition' collapses back into a single binary distinction, offering no new granularity. Similarly, the project fails if the distinction proves irrelevant to blame; if practitioners assign liability identically regardless of how interruption plays out, the philosophical work has no practical uptake.

  Regarding scope, the risk is drift into legal theory or specific machine learning architecture. If the analysis of liability regimes begins to dominate, I will cut it back to the conceptual prerequisites for liability only. If the technical details of specific model architectures [Placeholder: e.g., specific attention mechanisms] become too granular, I will abstract to functional capabilities. The nine-month limit requires strict adherence to the relational dynamics of action, not a comprehensive survey of AI safety or law. If the 'redescription' condition proves too linguistically unstable to analyse, I will prioritise the 'justifiability' condition as the primary marker of agency, treating redescription as a secondary effect.
