answer: |-
  Your distinction is sharp and substantive. The "Coherence" argument is deontological regarding rationality (you must be consistent), while your "Archipelago" argument is consequentialist (you will lose if you don't). They are not equivalent, and in your specific context, they diverge significantly.

  **1. Reach and Axioms**
  The Coherence argument is strongest on transitivity and probability axioms. If you cycle preferences or violate additivity of probabilities, a bookie can extract money from you regardless of the world's state. However, deriving the Independence axiom (the core of EU) via money-pump requires contentious assumptions about dynamic consistency and the resolvability of compound lotteries. It shows that violating Independence makes you vulnerable *if* you treat sequential choices in a specific way.

  The Archipelago argument bypasses the logical grammar of choice and attacks the statistical outcome. It speaks directly to Independence: if you violate it (e.g., preferring certainty over higher EV), you reject favorable bets. In a long sequence of independent trials, the Law of Large Numbers ensures the aggregate return converges to the expected value. Thus, systematic deviation from EV maximization guarantees underperformance. However, it does not derive the utility function; it assumes a "local good" that is additive. It proves you should maximize *that*, but not why *that* is your good.

  **2. Is Archipelago Just Global EU?**
  You are right to suspect circularity. The Archipelago argument is essentially Expected Utility applied to the grand lottery over the whole sequence, combined with an assumption of additive separability. If your total utility is the sum of local utilities, then maximizing global EU entails maximizing local EU. The "residue" is instrumental: it explains *why* a myopic agent should care about EU axioms even if they don't feel the logical force of Coherence. It turns a normative constraint into a survival strategy. However, like Coherence, it presupposes a stable agent over time. If your preferences change, the "sum" of local goods may not constitute a coherent global good.

  **3. The Floor**
  This is the critical failure point for the Archipelago argument. Your fund has a threshold (ruin), which violates premise (ii): your good is *not* the sum of bounded local goods. Utility is non-linear; dropping below the floor renders the sum irrelevant. The trials are not probabilistically independent regarding your *value*, because a string of losses triggers a state change (collapse) that alters the value of all future gains.

  The Archipelago argument falls silent here, or rather, becomes dangerous. If you maximize local expected monetary gain near the floor, you may increase the variance enough to hit the threshold. The argument can only be repaired by redefining "local good" as the marginal contribution to the *probability of survival*. But then you are no longer maximizing yield; you are maximizing a complex, state-dependent function.

  The Coherence argument handles this easily. It does not demand you maximize money; it demands you maximize *utility*. If your utility function includes a step-drop at the floor, Coherence simply requires you to be consistent in avoiding that drop. It does not convict the constraint of irrationality; it merely demands you respect your own constraints consistently.

  **4. Currency and Question-Begging**
  Coherence requires a transferable medium to construct the pump, but it is neutral on the shape of the utility curve. Archipelago is more demanding: it presupposes additivity. This begs the question against an agent whose departure from EU is driven by risk of ruin. If you care about the *shape* of the distribution (e.g., minimizing downside risk), the Archipelago claim that you *should* maximize local EV is false relative to your actual goals. It assumes the "good" is linear money, whereas your "good" is the children's security. Coherence is less question-begging here; it allows for risk aversion provided it is consistent.

  **5. Practical Upshot**
  The arguments diverge on your standing instructions.
  If you follow the **Archipelago** logic strictly (maximize local EV), you instruct the successor to take favorable bets regardless of the fund's current level. Near the floor, this could cause ruin.
  If you follow the **Coherence** logic (maximize consistent utility), you instruct the successor to adhere to the *purpose* of the fund.

  **Recommendation:** Do not tell them to "maximize expected return" on individual decisions. That relies on the Archipelago assumption of additivity, which your floor invalidates. Instead, write a standing instruction that defines the utility function explicitly: "Maximize the expected value of the fund at year 25, subject to a hard constraint that the probability of dropping below [Floor] must remain below [X%]."

  This uses Coherence to enforce a non-linear utility structure that respects the Archipelago insight (long-run performance matters) without succumbing to its linear assumption. Your caution near the floor is not a violation of rationality; it is a rational response to a non-linear payoff structure. The Coherence argument supports this; the Archipelago argument, in its raw form, does not. Trust the Coherence framework to encode your constraints, but use the Archipelago intuition to warn against *systematic* deviation from positive expectations *once safety is secured*.

  In short: The floor makes your utility function concave. Maximize that, not the local yield.
