answer: |-
  Divide the twelve students into two teams of six, assigning internal roles of Lexicographer (term mapping), Grammarian (syntax rules), and Ontological Referee (consistency check) to ensure structured collaboration. You will present 'Proto-X,' a synthetic language composed of five phonemes combined into bisyllabic roots, conveyed via projected video sequences of agents manipulating geometric solids under varying lighting and occlusion conditions; Team A constructs a manual translating utterances as references to persistent 3D objects (e.g., 'cube'), while Team B translates identical evidence as temporal stages of 4D processes (e.g., 'cubing-stage'). The 90-minute session proceeds as follows: minutes 0–10 for role assignment and instruction; minutes 10–50 for four observation rounds where teams predict agent responses to stimuli, awarding points for predictive accuracy while ensuring both manuals succeed by designing stimuli ambiguously compatible with both ontologies; minutes 50–55 for the introduction of an anomaly where an object vanishes mid-task, forcing Team A to posit invisible carriers and Team B to revise temporal-indexing rules; minutes 55–75 for manual finalization; and minutes 75–90 for presentation and defense. Scoring is based solely on successful anticipation of the next interaction, recorded on a public leaderboard with no monetary value, ensuring both teams feel justified in their ontology through equal predictive success.

  In the debrief, map the prediction rounds to behavioral evidence, the manual construction to analytical hypotheses, and the anomaly adjustment to confirmational holism, demonstrating how evidence alone cannot dictate ontology. Explicitly acknowledge that the simulation cannot reproduce the infinite regress of interpretive charity or the full mathematical structure of radical translation; supply this gap by lecturing on how background languages constrain the very logic used to formulate the manuals, making the underdetermination global rather than local. Anticipate that students will assume a hidden 'correct' manual exists or conflate predictive success with ontological truth; counter this by revealing the source code of the simulation post-class, showing the stimuli were generated by a neutral algorithm indifferent to both ontologies, and emphasize that Quine's point is not skepticism about truth but the indeterminacy of meaning given behavioral constraints. Ensure you stress that the incompatibility lies in the translation manuals, not the physical predictions, reinforcing that both ontologies are empirically equivalent yet mutually irreducible.
