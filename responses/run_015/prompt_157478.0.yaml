prompt: |-
  I'm teaching a 90-minute graduate seminar on philosophy of language with twelve students, and we're approaching Quine's thesis that translation is radically underdetermined by behavioral evidence—what is often introduced through the gavagai scenario, but which I want them to experience as a live structural problem rather than a historical anecdote. I was recently trying to formalize some imaginary field notes for a constructed contact language and realized that the ambiguity runs far deeper than the usual object-versus-part distinction; I want the students to feel that same depth in real time, constructing incompatible manuals that both work perfectly. Design a structured classroom simulation in which the group divides into two linguistic teams, each tasked with building a complete translation manual for a synthetic language that I will present through a fixed sequence of observed interactions—gestures, cooperative tasks, and responses to stimuli—without any shared background ontology being given in advance.

  The synthetic language should be engineered so that Team A naturally interprets utterances as referring to enduring three-dimensional objects with stable diachronic identity, while Team B interprets the identical behavioral evidence as referring to four-dimensional process-slices or relational configurations lacking persistent identity conditions. Both manuals must achieve perfect predictive accuracy across observation rounds scored on a point system that rewards correct anticipation of the next interaction, so that each team genuinely feels justified in its ontology and invests in defending it. At the midpoint, introduce an anomalous interaction that forces both teams to make parallel auxiliary adjustments—one introducing hidden entities, the other revising temporal-indexing grammar—to preserve predictive success; only after both have presented their revised manuals should the debrief begin. Include the precise specification of the synthetic language and interaction sequence, a minute-by-minute timeline for the 90 minutes, assigned roles within each team (lexicographer, grammarian, ontological referee), rules for observation rounds and scoring that require no real money, and a debrief that maps each simulation moment onto Quine's argument about behavioral evidence, analytical hypotheses, and the holism of translation.

  Finally, be explicit about which feature of Quine's view the simulation cannot reproduce—likely the full mathematical structure of radical translation or the infinite regress of interpretive charity—and tell me exactly how I should supply that gap in discussion. Also predict what will predictably go wrong the first time I run this, such as one team assuming there is a hidden correct answer or students conflating predictive success with ontological truth, and advise how to handle it. Do not include bibliographies, reading lists, or citations; the prompt should stand on its own for a model without web access, though you may draw on standard philosophical knowledge. Keep the request formal, polished, and contained within two to three paragraphs.
