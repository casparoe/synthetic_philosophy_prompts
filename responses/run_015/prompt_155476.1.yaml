answer: |-
  ### Desiderata for a Statutory Theory of Hate Speech Regulation

  The following specifications are derived from the constraint that the theory must be reducible to a statutory definition applicable by a court without resorting to open-ended balancing in individual cases. This imposes a demand for rule-like certainty over standard-like flexibility. Each desideratum is marked as either **Non-negotiable** (required for the rule of law and the stated purpose) or **Preference** (reflecting a commitment of a specific legal tradition).

  #### 1. The Requirement of Endorsement (The Re-enactment Case)
  **Specification:** The theory must locate the wrong in the speaker's adoption of the proposition as their own, rather than in the acoustic or visual presence of the words themselves. It must provide a bright-line test for distinguishing between propagation and citation (e.g., explicit denunciation, pedagogical context, or artistic framing).
  **Case:** The Re-enactment Case (quoting hate speech to condemn it).
  **Status:** **Non-negotiable.**
  **Reasoning:** Without this, the statute chills academic, journalistic, and legal discourse. If the harm survives denunciation, the law regulates the *words* rather than the *advocacy*, which renders a rule-based application impossible because every utterance of the prohibited vocabulary becomes suspect regardless of intent.
  **Tradition:** **Neutral.** Both American and European traditions recognise the necessity of protecting critique, though they derive it from different premises (marketplace of ideas vs. democratic discourse).

  #### 2. The Requirement of Symmetry or Principled Asymmetry (The Mirror Case)
  **Specification:** The theory must state whether the legal status of an utterance depends on the identity of the speaker relative to the target. If it permits asymmetry (punishing the dominant group but not the minority for the same words), it must define 'dominance' via objective, statutory criteria (e.g., protected class status) rather than leaving it to judicial assessment of current social power dynamics.
  **Case:** The Mirror Case (dominant vs. minority speaker).
  **Status:** **Preference (European Dignity Tradition).**
  **Reasoning:** A symmetrical rule (content neutrality) is easier to draft as a statute. An asymmetrical rule requires the statute to encode sociological facts about power. If the theory demands asymmetry based on fluid power dynamics, it violates the 'no balancing' constraint. To satisfy the prompt's purpose, asymmetry must be hardcoded into the categories of the statute, not left to judicial discretion.
  **Tradition:** **Commitment of the European Dignity Tradition.** The American tradition treats viewpoint neutrality as a non-negotiable requirement of reason; the European tradition treats substantive equality (protecting the vulnerable) as the requirement of reason.

  #### 3. The Requirement of Territorial Locus (The Export Case)
  **Specification:** The theory must fix the *locus delicti* (place of the wrong) either at the point of transmission or the point of reception, without allowing both to trigger liability concurrently under different standards. It must determine whether the harm is constituted by the act of speaking or the act of hearing.
  **Case:** The Export Case (cross-jurisdictional utterance).
  **Status:** **Non-negotiable.**
  **Reasoning:** Legal certainty requires that a speaker knows which law applies at the moment of speech. If liability depends on where the message lands (reception), a speaker cannot comply with the statute without knowing the laws of every potential jurisdiction. If liability depends on transmission, the statute admits it is regulating the speaker's conduct regardless of local harm.
  **Tradition:** **Neutral.** Both traditions require jurisdictional clarity, though they may choose different anchor points.

  #### 4. The Requirement of Individual Causation (The Cumulative Case)
  **Specification:** The theory must explain how a single utterance constitutes a punishable offence if the alleged harm is exclusively the result of aggregate exposure. It cannot rely on a 'drop in the ocean' theory where the individual act is harmless but the collection is not, unless the statute defines the act itself as a contribution to a criminal conspiracy or systemic pattern.
  **Case:** The Cumulative Case (aggregate harm of trivial acts).
  **Status:** **Preference (European Dignity Tradition).**
  **Reasoning:** Traditional criminal law requires individual causation. A theory that punishes an individual for a collective harm without proving their specific contribution violates the principle of personal culpability. To fit the 'no balancing' constraint, the statute would have to deem the *type* of speech inherently contributory, which is a substantive policy choice, not a logical necessity.
  **Tradition:** **Commitment of the European Dignity Tradition.** The American tradition generally rejects cumulative harm theories for speech, requiring imminent, specific harm traceable to the speaker.

  #### 5. The Requirement of Object Clarity (The Distinction)
  **Specification:** The theory must identify exactly what is being restricted: the *proposition* (the view expressed), the *perlocutionary effect* (the emotional distress or intimidation caused), or the *illocutionary force* (the act of subordinating or threatening). It cannot conflate these.
  **Case:** The Distinction (restricting what is said vs. what it does vs. what it reveals).
  **Status:** **Non-negotiable.**
  **Reasoning:** A statutory definition cannot be drafted if it is unclear whether it bans a belief, a consequence, or a threat. If it bans a consequence (distress), it requires empirical proof in every case (violating 'no balancing'). If it bans a proposition, it is viewpoint discrimination. If it bans a threat, it is conduct regulation. The theory must pick one to allow for rule-like application.
  **Tradition:** **Neutral.** All legal systems require clarity on the *actus reus* of the offence.

  ---

  ### Analysis of Traditions and Joint Satisfiability

  #### Neutral Requirements vs. Camouflaged Commitments
  The requirements regarding **Endorsement**, **Territorial Locus**, and **Object Clarity** are genuinely neutral. They are preconditions for any workable legal rule, regardless of whether the state prioritises liberty or dignity. A law that cannot distinguish between a neo-Nazi and a professor quoting a neo-Nazi, or a law that does not know where the crime occurred, fails as law.

  However, the requirements regarding **Symmetry** and **Individual Causation** are commitments of the American free-speech tradition passed off as demands of reason by its proponents, just as the demand for **Group Protection** (asymmetry) and **Cumulative Harm** are commitments of the European dignity tradition passed off as demands of reason by its proponents.
  *   The American claim that 'the state must never distinguish between speakers based on status' is a moral commitment to viewpoint neutrality, not a logical necessity of regulation.
  *   The European claim that 'speech harms dignity cumulatively regardless of intent' is a moral commitment to substantive equality, not an empirical fact discoverable without balancing.

  #### The Impossible Subset
  There is a subset of three requirements that cannot be jointly satisfied given the purpose of drafting a statute applicable without balancing:
  1.  **The 'No Balancing' Constraint:** The rule must be applicable by a court without weighing context in each case.
  2.  **The Cumulative Harm Requirement:** The harm is only real in the aggregate of many utterances.
  3.  **The Individual Culpability Requirement:** The individual speaker must be justly punishable for their specific act.

  **Conflict:** If harm is only cumulative (2), then an individual utterance is, by definition, not harmful in isolation. To punish the individual (3) without assessing how much their specific utterance contributed to the aggregate (which requires balancing/context) (1) is unjust. You cannot have a bright-line rule punishing an individual for a harm they did not individually cause.

  #### The Abandonment
  To satisfy the prompt's fixed purpose (a statutory definition without open-ended balancing), I would abandon **The Cumulative Harm Requirement** as a basis for individual criminal liability.

  **Cost:** Abandoning this means accepting that the law cannot directly remedy the 'slow violence' of ambient hate speech where no single instance triggers a crisis. It restricts the state to punishing only those instances that are individually potent (e.g., direct threats, incitement, or severe harassment). It concedes that the 'atmosphere' of hate is a social problem, not a justiciable legal wrong attributable to a single defendant under a rule-based regime.

  **Alternative:** If one abandons the 'No Balancing' Constraint instead, one can address cumulative harm, but one fails the prompt's purpose of creating a rule-like statute. One ends up with a proportionality test, which is exactly what the prompt seeks to avoid.

  #### The Single Exclusionary Requirement
  The single requirement that excludes the largest share of the positions currently on offer is: **"Applicability without open-ended balancing."**

  **Reasoning:** Most existing European hate speech regulations rely explicitly on proportionality tests, context-sensitive analysis, and judicial weighing of dignity against expression. Most American proposals for hate speech regulation fail because they cannot define 'hate' without vagueness that requires balancing. By demanding a theory that functions as a bright-line statutory rule, we exclude the vast majority of contemporary jurisprudence which treats hate speech as a context-dependent harm requiring judicial discretion. This requirement forces the theory to be either over-inclusive (banning too much to ensure clarity) or under-inclusive (missing nuanced harm to ensure clarity), rendering most sophisticated academic theories unusable for the stated legislative purpose.
