  3.  **Drafting the Translation (The Tranquilist Poetics):**
      *   *Standard Narrative Theory:* A good story has a strong desire line, escalating conflict, and a resolution (which often changes the desire or fulfills it).
      *   *Tranquilist Narrative Theory:* A good "life-story" minimizes the desire line. Conflict is not a feature to be overcome for a higher good, but a bug to be patched.
      *   *Plot Engine:* In standard fiction, the engine is "Want + Obstacle." In tranquilism, the engine is "Detection of Want + Elimination of Want."
      *   *Character Arc:* Not transformation *into* something new, but erosion *back* to a baseline. The arc is a flattening.
      *   *Negative Space:* This is crucial. In standard fiction, negative space (pauses, quiet moments) serves the rhythm of the action. In tranquilism, negative space *is* the action. The "story" is the process of the plot engine shutting down.

