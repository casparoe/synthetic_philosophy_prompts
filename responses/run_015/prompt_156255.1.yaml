      *   Materials? Yes.
      *   Target feeling (recognize but can't define)? Yes.
      *   Debrief mapping? Yes.
      *   Risk/Recovery? Yes.
      *   Confidence/Bias? Yes.
      *   No history/linguistics lecture? Yes.

