answer: |-
  You have isolated a phenomenon that sits at the intersection of cognitive psychology, neuroscience, and the philosophy of mind. While there is no single, universally agreed-upon label that captures the *exact* nuance you describe (specifically the dissociation between the *determinacy of content* and the *sensitivity of the system* in healthy subjects), there are three established literatures that converge on it.

  Here is the mapping of existing concepts, where they break, and a proposal for how to carve out the phenomenon precisely.

  ### 1. The Existing Literature

  **A. Non-Pathological Confabulation (Nisbett & Wilson, 1977)**
  *   **The Concept:** In their landmark paper "Telling More Than We Can Know," Nisbett and Wilson demonstrated that healthy subjects often report on *theories* about their own minds rather than actual introspective data. When asked why they chose an item, they confabulate reasons confidently.
  *   **Where it Fits:** It captures the "confident wrongness" in healthy subjects without neurological deficit.
  *   **Where it Breaks:** This literature focuses primarily on *causal attribution* (why I did X) or *preference*, not on low-level perceptual content (the shape of the triangle) or episodic detail (the exact wording). Your observation extends confabulation down into the perceptual and mnemonic substrate itself.

  **B. Perceptual Filling-In (Komatsu, 1998; Dennett, 1991)**
  *   **The Concept:** The visual system actively constructs data where none exists (e.g., the blind spot, Troxler fading, amodal completion). Daniel Dennett's "Multiple Drafts" model argues that the brain creates a specific narrative only when probed, rather than maintaining a rich, determinate "Cartesian Theater."
  *   **Where it Fits:** It explains the mechanism: the brain supplies a default value to close a gap. It aligns with your "user interface" metaphor (the icon is specific; the file structure is not).
  *   **Where it Breaks:** "Filling-in" is typically used for spatial continuity or low-level features (color/texture). It is rarely applied to object-level identity (e.g., "tilted left") or semantic memory wording. Using "filling-in" for high-level semantic details feels like a category error in standard neuroscience.

  **C. The Determinacy of Experience (Philosophy of Mind)**
  *   **The Concept:** A debate between **Representationalists** (e.g., Michael Tye), who argue experience has determinate properties (you see *exactly* 32 spokes), and **Indeterminacy Theorists** (e.g., Ian Phillips, 2018), who argue experience is often vague, and determinacy is imposed by judgment.
  *   **Where it Fits:** This is the philosophical name for your "determinacy of content" problem. Phillips explicitly argues that we *think* our experience is determinate when it is not.
  *   **Where it Breaks:** This is a metaphysical debate, not an empirical label for the *error pattern* you are measuring. It describes the state of the experience, not the behavioral phenomenon of reporting specific falsehoods.

  ### 2. Carving Out the Phenomenon

  Since existing terms are either too pathological ("confabulation"), too low-level ("filling-in"), or too metaphysical ("determinacy"), I propose you coin the term:

  **Determinacy Inflation**

  **Definition:** *The cognitive tendency to generate reports with a higher degree of specific detail (determinacy) than is supported by the underlying sensory or mnemonic signal, accompanied by a phenomenological feeling of certainty regarding that detail.*

  **Why this term?**
  *   **Inflation:** Captures the economic mismatch between the "currency" of sensitivity (low) and the "currency" of the report (high).
  *   **Determinacy:** Distinguishes it from "richness" or "confidence." You are not saying you have *more* data; you are saying the data you have is *sharper* than it actually is.
  *   **Neutrality:** It avoids the pathological baggage of "confabulation" and the low-level implication of "filling-in."

  ### 3. Distinguishing Experience from Report

  This is the critical methodological boundary you requested. From the inside, **Determinacy Inflation** feels like a property of experience. To prove it is a property of *report*, you must show that the specificity is vulnerable to *post-perceptual* manipulation.

  If the specificity belongs to the **Experience**, it should behave like a percept:
  1.  **Vulnerable to Masking:** If a visual mask is presented immediately after the stimulus (but before the report), the specific detail should degrade.
  2.  **Stable Across Tasks:** If you ask for the color first, then the shape, the specificity of the shape should remain constant.

  If the specificity belongs to the **Report** (which your data suggests), it should behave like a construction:
  1.  **Retro-Cue Sensitivity:** If you flash the shape, then *after* it disappears cue the subject to report "Color" vs. "Orientation," the specificity of the *uncued* dimension should collapse. If experience were determinate, both should be available. (See: **Sligte et al., 2008** on fragile visual short-term memory).
  2.  **Interference Effects:** If you introduce a verbal interference task (e.g., repeating "the the the") between the stimulus and the report, the specificity should drop to chance, even if confidence remains high. This proves the detail was held in working memory/linguistic formatting, not perceptual experience.
  3.  **Matching vs. Describing:** Ask the subject to *match* the red from a palette immediately, rather than name it. Naming forces categorization (specificity); matching allows continuous adjustment. If the "red triangle" is Determinacy Inflation, the matching task will show high variance (indeterminacy) even while the naming task remains specific.

  ### 4. Boundary Cases

  To ensure **Determinacy Inflation** is distinct from related phenomena, apply these exclusion criteria:

  *   **Vs. Overconfidence:** Overconfidence is a mismatch between *accuracy* and *probability estimate* ("I'm 90% sure"). Determinacy Inflation is a mismatch between *signal resolution* and *content precision* ("I see a triangle" vs. "I see a shape").
      *   *Test:* Allow the subject to bet money on their accuracy. If they bet high but are wrong, it's overconfidence. If they bet low (admit uncertainty) but *still* describe a red triangle rather than "a reddish shape," it is Determinacy Inflation.
  *   **Vs. Gist Extraction:** The brain naturally extracts gist (semantic meaning) over detail.
      *   *Test:* If the subject reports "a vehicle" for a briefly flashed car, that is Gist. If they report "a blue sedan," that is Determinacy Inflation (assuming sensitivity was insufficient for that distinction).
  *   **Vs. Predictive Processing:** The brain predicts inputs to minimize error.
      *   *Distinction:* Predictive processing is the *mechanism*; Determinacy Inflation is the *phenomenological error* resulting when the prediction overrides the signal entirely.

  ### 5. Recommended Reading

  To ground your experiments, look at these specific threads:

  1.  **Ian Phillips, "The Indeterminacy of Perception" (2018).** This is the philosophical backbone. He argues experience is vague; your work provides the empirical mechanism for why we think it isn't.
  2.  **Daniel Dennett, "Quining Qualia" (1988) & *Consciousness Explained* (1991).** Specifically the "Multiple Drafts" model. He argues specificity is created at the point of "probing."
  3.  **Petr Janich, "The Specificity of Memory" (various).** Look for work on **Reconstructive Memory** (Loftus), but specifically the recent work on **Source Monitoring Errors** in healthy adults.
  4.  **Johansson et al., "Choice Blindness" (2005).** Shows people confabulate reasons for choices they didn't make. Your work extends this to *perceptual content*.
  5.  **Firestone & Scholl, "Cognition Does Not Affect Perception" (2016).** Read this to understand the opposing view (that perception is encapsulated). Your findings would challenge their boundary.

  ### Summary

  You are observing **Determinacy Inflation**. It is the systematic over-specification of mental content at the point of access, driven by the brain's need to resolve ambiguity for the sake of action/reporting. It is not a deficit, but a feature of the "user interface": the system cannot hand you a "probability cloud" of a triangle; it must hand you a "triangle" to allow you to act. The error arises when you treat that interface icon as a readout of the underlying data.

  To validate this, move beyond self-report. Use **retro-cueing** and **continuous matching tasks** to demonstrate that the specificity vanishes when the linguistic/reporting demand is altered, proving the determinacy resides in the *output*, not the *experience*.
