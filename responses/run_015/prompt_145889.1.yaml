      *   **Task:** Write a response paper mapping out potential defeaters (what could kill this view).
      *   **Specific Needs:**
          *   Formal results or historical cases counting against the view.
          *   Evidence of institutional buffering absorbing chaos (not deferring it).
          *   Cases where micro-perturbations hit a hinge but fizzled.
