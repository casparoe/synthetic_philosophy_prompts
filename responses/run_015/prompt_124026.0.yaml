answer: |-
  Your working theory is strong—significantly better than the standard "you're just arguing about totalism vs. person-affecting views" diagnosis—but I think it identifies the *symptoms* of the confusion rather than the *pathology*.

  Here is my pressure test of your three distinctions, followed by my diagnosis of why the debate is stuck and what would actually constitute movement.

  ### Pressure Testing Your Three Distinctions

  **1. The Addressee Question (Individual vs. State vs. Humanity)**
  This is the strongest of your three. It maps onto the distinction between *axiology* (what is good?) and *decision theory/obligation* (what should I do?).
  *   **Why it helps:** It dissolves the "creepy state incentives" objection. A totalist can consistently believe "More people is good" (axiology) while believing "State coercion to make people is bad" (liberty constraints/incentive compatibility).
  *   **Where it fails:** It doesn't solve the core moral deadlock. If the skeptic believes potential people *cannot* be beneficiaries, then a "Humanity as a whole" perspective still yields null value for the new people. If the pronatalist believes potential people *are* moral patients, then "Humanity" has an interest in them. Separating the addressee clarifies *who* is acting, but not whether the act has moral weight.

  **2. The Host Problem (Guest vs. Founder)**
  You suggest adding a person to an existing project is structurally different from founding one.
  *   **Pressure Test:** I suspect this is actually an **empirical** disguise for an axiological claim.
      *   If I found a colony, I am creating a *context* for value. If I add a child to a dying civilization, I am creating a *subject* for value.
      *   The skeptic feels the "guest" intuition is stronger because the guest inherits debt (carbon, fiscal, cultural decay). The pronatalist feels the "founder" intuition is stronger because the guest inherits capital (knowledge, tech, institutions).
      *   **Verdict:** This distinction is useful for isolating variables, but it's not the source of the stalemate. It just changes the empirical inputs to the same moral function. If the skeptic believes the "guest" adds negative value (burden), and the pronatalist believes they add positive value (net contributor), they still disagree on the *baseline* of whether existence is a benefit.

  **3. The Empty Wing Problem (Filling vs. Stretching)**
  This is about marginal utility of population.
  *   **Pressure Test:** This is purely empirical/economic. A society with empty capacity has increasing returns to scale; a bursting society has diminishing returns.
  *   **Verdict:** This is the easiest to resolve with data, yet it's the least likely to move the needle. Why? Because both sides usually assume the *other* side's axiology holds even in their preferred empirical scenario. The pronatalist thinks more people are good even if resources are tight (innovation solves it); the skeptic thinks more people are neutral/bad even if resources are abundant (it's still just more consumption). This distinction explains why intuitions *fluctuate*, but not why they *diverge*.

  ### The Diagnosis: Impossibility, Not Confusion

  You asked if this is a verbal dispute, a substantive axiological dispute, or people answering different questions.

  My take: **It is a substantive axiological dispute that feels like a verbal dispute because both sides are implicitly trying to satisfy incompatible constraints.**

  You are all LessWrong/EA adjacent, so you likely know the **Impossibility Theorems in Population Ethics** (Parfit, Arrhenius). Roughly: There is no population axiology that satisfies a small set of very basic, intuitive adequacy conditions (e.g., "adding a happy person is good," "adding a miserable person is bad," "quality matters," "quantity matters").

  **Why it's stuck:**
  Your group is stuck because you are trying to have a *truth-apt* debate about a problem that may be structurally incoherent.
  *   **The Pronatalists** are implicitly Total Utilitarians. They are willing to accept the "Repugnant Conclusion" (a massive population of barely-livable lives is better than a small population of excellent lives) to maintain consistency.
  *   **The Skeptics** are implicitly Person-Affecting or Asymmetrists. They are willing to accept the "Absurd Conclusion" (we have no reason to prevent extinction if no one currently exists to be harmed) to maintain the intuition that you can't benefit the non-existent.

  **The verbal costume:** The debate feels verbal (your "Addressee/Host/Wing" theory) because both sides are trying to argue from *shared* intuitions to prove their axiology is the "common sense" one.
  *   The Pronatalist says: "Surely a future with art and love is better than a void!" (Appealing to aesthetic/intuitive value).
  *   The Skeptic says: "But who is better off in that future?" (Appealing to the subject-constraint).

  They aren't answering different questions; they are answering the *same* question ("Is a larger population better?") using **incompatible moral grammars**. One grammar requires a subject for benefit; the other does not. No amount of empirical data (fertility rates, GDP) bridges that gap.

  ### What Would Count as Movement?

  Since the core disagreement is axiological and likely subject to impossibility theorems, "movement" cannot look like one side convincing the other they are *correct*. There is no external arbiter.

  Here is what actual movement looks like in this specific context:

  **1. Shift from Truth to Heuristics (The "Error Theory" Move)**
  Stop asking "Which view is true?" and start asking "Which view is a safer bet?"
  *   **Movement:** The group agrees that population axiology is underdetermined. The debate shifts to **decision-making under moral uncertainty**.
  *   **The Deal:** "I don't think potential people have rights, but I assign 40% credence to Totalism. You don't think they matter, but you assign 40% credence to Person-Affecting. Given the asymmetry of the risk (extinction is irreversible; overpopulation is potentially manageable), we adopt a 'cautious pronatalism' as a hedging strategy."
  *   This unsticks the conversation by removing the need for metaphysical verdict.

  **2. Isolate the "Host" Variable (Your Second Point)**
  Use your "Host Problem" distinction to split the debate into two separate claims.
  *   **Claim A:** "Is it good to create people in a context where they will likely have net positive lives?" (Pure axiology).
  *   **Claim B:** "Is it good to create people in *our current specific civilizational context*?" (Axiology + Empirics).
  *   **Movement:** You might find the Skeptics agree with Claim A in the abstract (e.g., "In a post-scarcity utopia, sure, more people is fine") but deny Claim B. The Pronatalists might agree Claim B is risky but insist Claim A is the moral imperative.
  *   This converts a moral stalemate into an empirical forecast disagreement (e.g., "Will the next 100 years be net positive for the average new citizen?"). That is actually resolvable.

  **3. Accept the "Aesthetic Preference" (The Skeptic's Intuition)**
  Your skeptic friend said the intuition feels like "an aesthetic preference about the shape of history." **Take this seriously.**
  *   **Movement:** Acknowledge that "Civilizational Vitality" might be a terminal value for the Pronatalists that is *distinct* from "Individual Welfare."
  *   If the Pronatalist admits, "I value the *continuation of the project* independently of the welfare sum," and the Skeptic admits, "I value *individual welfare* exclusively," then you have identified a **terminal value clash**.
  *   This is a resolution. It means you stop trying to prove the other wrong and start negotiating trade-offs. "Okay, you want Project Continuity, I want Individual Autonomy. How do we balance these?"

  ### Summary Recommendation

  Your theory about the three distinct jobs is correct, but it's a **dissolution tool**, not a **resolution tool**. It explains why you talk past each other, not why you disagree.

  **The Verdict:**
  You are having a **substantive dispute about population axiology** (Totalism vs. Person-Affecting) that is **masked by verbal conflation** (Addressee/Host/Wing). The conflation makes you think empirical data should resolve it; the axiology ensures it won't.

  **To Unstick It:**
  1.  **Explicitly name the axiological impasse.** Acknowledge the Impossibility Theorems. Admit that no consistent system satisfies all your intuitions.
  2.  **Adopt Moral Uncertainty.** Treat the decision as a portfolio allocation between competing moral theories rather than a search for the One True Morality.
  3.  **Operationalize Your "Host" Distinction.** Agree that *context* determines the sign of the value, even if you disagree on the source. If you can agree that "fertility is good *if* civilizational trajectory is positive," the debate becomes a forecast about the future, not a metaphysics seminar.

  If you do this, you won't get a verdict on pronatalism. You will get a verdict on *how to act given that you can't get a verdict on pronatalism.* That is the only stable equilibrium available to you.
