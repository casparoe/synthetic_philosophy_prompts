      *   *Critique:* The distinction between Generated/Imposed needs to be very clear.
      *   *Fix:* Use the terms "Mechanism" vs. "Description."

  12. **Final Polish:** Ensure all 5 specific requirements + the 3 cases + the chord column + the objections are addressed clearly. (Proceeding to generate response based on this structure).

      *   *Wait, one detail:* "Two of my writers will say that every probability is conditional..." -> Need a specific paragraph for this.
      *   *Wait, another detail:* "Pick one [default] and defend it in a sentence." -> Need to ensure I don't hedge on the default assumption.

      *   *Refining the "Stability Test":* For a non-math fact-checker, asking them to re-parameterize is hard. The instruction should be: "Ask the author if alternative natural parameterizations exist." If the author says "Yes," flag it.
      *   *Actually, better:* Provide the fact-checker with the *logic* of the test, not the math. "Does the physical setup force the odds, or did the modeler choose a ruler?"

      *   *Let's finalize the Procedure Steps:*
          1.  Source (Data vs. Theory).
          2.  Mechanism (Physical vs. Conceptual).
          3.  Stability (The Bertrand Check).
          4.  Precision (Editorial).

      *   *Let's finalize the Distinction:* "Process-Random" (things happen) vs. "State-Random" (things are counted).
      *   *Let's finalize the Default:* "If silent, assume the physical symmetry dictates the measure. If no physical symmetry exists, the number is arbitrary."

