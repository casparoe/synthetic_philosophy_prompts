answer: |-
  Here is the procedure, the distinction, and the verdicts you requested.

  ### 1. The Randomness Audit (10-Minute Procedure)

  This is a stop-light protocol. If a step returns a **RED**, stop and issue the corresponding verdict. If **GREEN**, proceed to the next step. If **YELLOW**, proceed with caution (see Step 4).

  **Step 1: The Source Check**
  *   **Question:** Does this number come from counted data (frequency) or a theoretical model (probability)?
  *   **Sufficient Answer:** "Data" (e.g., 1 in 4 trees in the inventory) or "Model" (e.g., geometric alignment).
  *   **Stop Condition:** If "Model," proceed to Step 2. If "Data," proceed to Step 3.
  *   **Verdict:** None yet.

  **Step 2: The Mechanism Check (For Models)**
  *   **Question:** Is the randomness generated by a physical process (e.g., decay, collision, orbit orientation) or imposed by the analyst to describe a static state (e.g., picking a point on a line, choosing a chord)?
  *   **Sufficient Answer:** "Physical Process" (Green) or "Analyst Choice" (Yellow).
  *   **Stop Condition:** If "Analyst Choice," you must proceed immediately to Step 3 (The Stability Test). If "Physical Process," skip to Step 4.
  *   **Verdict:** If "Analyst Choice" and Step 3 fails → **Do Not Print.**

  **Step 3: The Stability Test (The Bertrand Check)**
  *   **Question:** Can you describe two equally natural physical ways to select the object that yield different probabilities?
  *   **Sufficient Answer:** "No, the physics forces one way" (Green) or "Yes, the number changes" (Red).
  *   **Instruction:** Ask the author: "If we define 'random' by [Alternative Method X] instead of [Method Y], does the number change?" (e.g., for chords: endpoints vs. midpoint).
  *   **Threshold:** If the probability changes in the first significant digit (e.g., 1/3 vs 1/2), it is unstable.
  *   **Stop Condition:** If unstable → **Do Not Print.** If stable → **Print.**
  *   **Verdict:** **Do Not Print** if unstable. **Print** if stable.

  **Step 4: The Unit Check (For Data)**
  *   **Question:** Is the "random" unit clearly defined and enumerable? (e.g., "random tree" vs. "random patch of soil").
  *   **Sufficient Answer:** "Yes, the inventory lists individual trees" (Green) or "No, it's a density estimate" (Yellow).
  *   **Stop Condition:** If the unit is ambiguous (tree vs. location), the claim is misleading.
  *   **Verdict:** **Print with Amendment** (specify the unit) or **Do Not Print** (if unit cannot be clarified).

  **Step 5: The Precision Handoff (Editorial)**
  *   **Question:** Does the precision of the number imply more certainty than the method allows?
  *   **Sufficient Answer:** "No" (Green) or "Yes" (Yellow).
  *   **Stop Condition:** This is an editorial judgment, not conceptual.
  *   **Verdict:** **Print with Amendment** (add "roughly," "about," or round the number).

  ---

  ### 2. The Distinction: Mechanism vs. Measure

  You asked for a clean cut between chance-fixing procedures handed by the world and those stipulated by the writer. Here it is:

  **Distinguish "Process-Random" from "Measure-Random."**

  *   **Process-Random (Print):** The randomness exists in the *history* of the object. The object was subjected to a shuffle, a decay, a collision, or a physical trial. The probability reports a frequency of events. (Example: A lottery ball, a radioactive atom, a planet's orbital inclination).
  *   **Measure-Random (Caution):** The randomness exists in the *description* of the object. The object is static; the "randomness" is a ruler the analyst lays over it to count parts. The probability reports a choice of coordinates. (Example: A chord in a circle, a point in time, a location in an infinite universe).

  **The Rule:** Process-Random numbers report facts about the world. Measure-Random numbers report facts about the model. **Never print a Measure-Random number as if it were a Process-Random fact.**

  ---

  ### 3. The Stability Step (Catching the Chord Failure)

  Your current rule fails because it accepts *any* procedure. The fix is to demand *uniqueness* or *physical justification*.

  *   **The Step:** In Step 3 of the Audit, require the author to confirm that the physical context rules out alternative parameterizations.
  *   **How many alternatives:** Try **two**. The "Endpoint" method and the "Midpoint" method. If those two are not physically distinguishable by the system being studied, the number is arbitrary.
  *   **Disqualifying Movement:** Any change that alters the conclusion (e.g., "rare" vs. "common," or 25% vs. 50%).
  *   **Why this works:** In the chord problem, nothing in the geometry of a circle dictates how a chord is formed. In the transit problem (see below), physics dictates that orbital planes are isotropically distributed. The Audit forces the writer to prove the latter.

  ---

  ### 4. Hard Cases & Editorial Handoffs

  *   **Finite/Unenumerated Population:** Treat as **Process-Random** only if a sampling method is specified (e.g., "random digit dialing"). If the text implies a "god's eye view" of a population that isn't counted, treat as **Measure-Random** (High Risk).
  *   **Infinite Population:** Almost always **Measure-Random**. Requires a "Measure" justification (Step 2). If none exists, **Do Not Print**.
  *   **Event vs. Object:** Focus on the *trial*. "Random event" must mean "one trial of a repeatable process." If the event is unique (e.g., "chance this specific bill passes"), the number is a model, not a frequency. Label it "model estimate."
  *   **Simulation:** The algorithm is the **Process**. Check if the algorithm's randomness matches the physical claim. If the simulation assumes uniform distribution but the physics is not uniform, **Do Not Print**.
  *   **Pedagogical Vagueness:** If the piece is *about* the ambiguity (e.g., explaining Bertrand's Paradox to children), **Print**. The ambiguity is the subject, not the tool.
  *   **Editorial Handoff (Step 5):** The procedure hands the decision back to you when the math is stable but the *rhetoric* is too strong. If a model yields 50.3% but the text says "exactly half," that is an editorial fix (round it), not a conceptual kill.

  ---

  ### 5. Addressing the "All Probability is Conditional" Objection

  Your writers are technically correct: all probability is conditional on a model. However, they are practically wrong. Some models are dictated by physical symmetries (conservation of angular momentum, isotropy of space), while others are arbitrary choices of human description (coordinates on a page). The procedure does not claim to find "absolute" truth; it claims to filter out numbers that depend on the *author's whim* rather than the *system's structure*. We are not banning conditionality; we are banning hidden conditionality. If the number changes when you change the ruler, the number belongs to the ruler, not the world.

  ---

  ### 6. Limitations and The Ban Question

  **What this cannot do:** It cannot verify the *accuracy* of the data, only the coherence of the randomness claim. It cannot solve the "Reference Class" problem (e.g., "chance a man lives to 80" depends on which men you count).
  **Should you ban the word?** No. Banning "random" invites euphemisms ("typical," "arbitrary"). Instead, ban **Measure-Random claims without physical justification.** If the randomness is in the description, not the process, the text must say "in our model..." or "assuming..."

  **My Default Position:** If a paper says "chosen at random" and the methods section is silent, assume **Simple Random Sampling** for finite sets and **Symmetry-Dictated Measure** for physical geometry. If neither applies, the number is unsupported. I defend this because it privileges the physical constraints of the system over the convenience of the mathematician.

  ---

  ### 7. Application to Live Cases

  Here is the Audit run on your four scenarios.

  **(a) City Forestry: "If you picked one of the city's street trees at random, there is a one-in-four chance it is a maple."**
  *   **Step 1 (Source):** Data (Inventory).
  *   **Step 4 (Unit):** "One tree." Is the inventory enumerable? Yes.
  *   **Stability:** Does "random tree" differ from "random location"? Potentially. If maples are clustered, picking a random *spot* yields a different result than picking a random *ID number*.
  *   **Verdict:** **Print with Amendment.**
  *   **Amendment:** Specify the sampling unit. "One-in-four of the *recorded* street trees..." or "If you selected a tree ID from the city registry..." This closes the gap between "tree" and "location."

  **(b) Astronomy Release: "For a planet on an Earth-like orbit... roughly a half-percent chance that a randomly oriented orbit happens to be aligned well enough for us to see transits."**
  *   **Step 1 (Source):** Model (Geometry).
  *   **Step 2 (Mechanism):** Physical Process. Orbital inclinations are distributed isotropically in 3D space due to formation physics. This is not an analyst choice; it is a physical symmetry.
  *   **Step 3 (Stability):** Does the number change if we parameterize differently? No, because the physics (isotropy) dictates the measure (uniform in cos(inclination)).
  *   **Verdict:** **Print.**
  *   **Reason:** This is Process-Random (dictated by celestial mechanics), not Measure-Random. The "randomness" is in the universe's distribution, not the astronomer's ruler.

  **(c) Cosmology Feature: "In an eternally inflating universe, the chance that a randomly selected observer finds herself in a galaxy like the Milky Way... is some very small number."**
  *   **Step 1 (Source):** Model (Theory).
  *   **Step 2 (Mechanism):** Measure-Random. There is no physical process selecting an observer. The "selection" is a thought experiment.
  *   **Step 3 (Stability):** **FAIL.** This is the "Measure Problem" in cosmology. Depending on how you slice spacetime (proper time vs. scale factor cutoff), the probability ranges from near-zero to near-one. There is no unique, physically dictated measure.
  *   **Verdict:** **Do Not Print.**
  *   **Reason:** You asked me to tell you straight: **This is the piece you have paid for, and it is mathematically indefensible as written.** The number reports a choice of regularization scheme, not a fact about the universe.
  *   **Fix:** Rewrite to state: "Depending on how one counts observers in eternal inflation, the probability varies wildly..." If the point of the piece is the ambiguity, keep it. If the point is the number, kill it.

  **(d) Your Chord Column (Retrospective)**
  *   **Step 1 (Source):** Model (Geometry).
  *   **Step 2 (Mechanism):** Measure-Random. A static circle has no mechanism for generating chords.
  *   **Step 3 (Stability):** **FAIL.** As you noted, endpoints (1/3), radius midpoint (1/2), disc midpoint (1/4) are all "natural."
  *   **Verdict:** **Correction Owed.**
  *   **Reason:** Your old rule asked "Is there a procedure?" (Yes). The new rule asks "Is the procedure unique or physically forced?" (No). You presented a model-dependent choice as a geometric fact.
  *   **Correction Text:** "The column implied there is a single answer to the chance a random chord is long. In fact, the answer depends on how the chord is generated. Without a physical mechanism to select the chord, the question has no unique answer."

  ### Summary for your Team

  1.  **Process-Random** (World shuffles the cards) = **Print.**
  2.  **Measure-Random** (Writer shuffles the cards) = **Justify the shuffle or Kill.**
  3.  **The Chord Test:** If two natural ways of defining "random" give different numbers, the number is not a fact.
  4.  **The Cosmology Verdict:** The piece you commissioned claims a fact where only a model choice exists. Amend to highlight the ambiguity or spike the specific number.
