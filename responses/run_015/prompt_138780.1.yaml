      *(Self-Correction on the Forestry Case)*: "Pick one... at random." If the city has an inventory, it's a simple sample. If they mean "pick a spot on the map and dig," that's different (density vs. count). I need to ensure the procedure catches this. "Random tree" vs "Random location containing a tree." I will add a specific check for "Unit of Selection."

