answer: |-
  **Project Title:** Stability Conditions for Adaptive Satisficing in Sequential Choice

  **Problem Statement and Dialectic Stalemate**
  The contemporary debate regarding satisficing versus optimizing has reached a static equilibrium. On one side, the Simonian tradition argues that satisficing is a distinct, normatively viable strategy for bounded agents. On the other, standard decision theory contends that satisficing is merely optimization under search costs: an agent stops searching when the marginal cost of deliberation exceeds the expected marginal gain. In static, single-shot decisions with a fixed menu, the decision theorist's rebuttal is robust. If the menu is fixed, any stopping rule can be rationalized as maximizing a net-payoff function.

  However, this rebuttal relies on a ceteris paribus assumption that fails in dynamic contexts. It ignores the inter-temporal allocation of the cognitive surplus generated by satisficing. This project identifies two specific dynamic vulnerabilities where the standard rebuttal fails to engage, leaving the normative status of satisficing unresolved:

  1.  **The Leakage Problem:** If satisficing in Domain A frees up cognitive resources, and the agent optimizes the allocation of those resources in Domain B, the marginal value of attention in Domain A effectively rises. This creates pressure to bid up the aspiration level in Domain A until it converges on the optimum. Satisficing appears unstable: it either collapses into global optimization or requires an ad hoc assumption that resources are not fungible.
  2.  **The Calibration Regress:** Aspiration levels must be set or adapted. If the adaptation rule is itself optimizing, we have reintroduced optimization at the meta-level. If the rule is heuristic (e.g., "adjust threshold based on recent success rate"), it risks downward drift, where the agent systematically lowers standards to ensure success, eroding long-term welfare.

  Current literature treats these as separate issues. The decision theorist assumes leakage proves satisficing is incoherent; the Simonian assumes adaptation solves calibration without specifying the stability conditions. Neither side addresses whether there exists a *middle ground*: a non-optimizing adaptive rule that is dynamically stable against both leakage and drift.

  **Research Question**
  This project asks: **Does there exist a non-optimizing adaptive rule for aspiration levels that is dynamically stable against both resource leakage and standard erosion in a sequential choice environment?**

  This is a determinate question with a binary answer (Yes/No). It moves beyond vocabulary clarification to test the structural viability of satisficing as a normative theory for bounded agents.

  **Methodology and Work Plan**
  I propose constructing a formal toy model of sequential choice. While purely conceptual analysis is an option, it is insufficient for this specific question. The Decision Theorist reader requires a rigorous demonstration of stability (or instability), which intuition cannot provide. The Simonian reader requires a model that treats boundedness as a structural constraint rather than a friction cost. A formal model forces precision on "leakage" (resource fungibility) and "calibration" (update rules) that conceptual analysis often obscures.

  The model will feature an agent making repeated choices across two domains. Domain 1 is governed by an adaptive aspiration level; Domain 2 absorbs freed resources. The agent's "rationality" is defined by the update rule used to adjust the aspiration level in Domain 1.

  *   **Months 1–2: Axiomatization.** Define the state space, resource constraints, and the class of admissible update rules. Crucially, I will formalize "non-optimizing" not as "random," but as rules that do not maximize expected utility over the horizon (e.g., fixed-step adjustments based on success/failure signals).
  *   **Months 3–5: Modeling Leakage.** I will introduce a resource allocation mechanism. If resources saved in Domain 1 are deployed to Domain 2, does the shadow price of attention in Domain 1 rise? I will test whether specific constraints on resource fungibility prevent the "bidding up" of the aspiration level.
  *   **Months 6–7: Modeling Calibration.** I will test adaptive rules for downward drift. The goal is to identify if a "stop-loss" condition can be embedded in the update rule without implicitly maximizing a value function.
  *   **Months 8–9: Synthesis and Drafting.** I will consolidate the proofs into a coherent argument regarding the necessary and sufficient conditions for stability.

  **Expected Outcomes**
  A **positive result** would be an existence proof: a theorem demonstrating that under specific conditions (e.g., diminishing marginal value of attention, or domain-specific resource locking), a heuristic update rule maintains a stable aspiration level distinct from the optimum. This would vindicate the Simonian claim that satisficing is a stable normative strategy, not just a descriptive error.

  A **negative result** would be an impossibility theorem: a proof that any stable adaptive rule is isomorphic to an optimizing rule, or that all non-optimizing rules inevitably drift toward sub-optimal equilibria. This would be a significant contribution, clarifying that the "optimization with search costs" rebuttal holds even dynamically, forcing the Simonian tradition to revise its normative claims.

  **Project Failure**
  The project would fail if the model becomes too complex to yield determinate results within the timeframe (e.g., attempting to model general equilibrium effects across unlimited domains). It would also fail if the definition of "non-optimizing" becomes so permissive that it trivially allows stability (e.g., by stipulating resources are never fungible). To avoid this, I will restrict the model to environments where fungibility is the default assumption, placing the burden of proof on the stability of the satisficing rule.

  **Scope and Limitations**
  My broader ambition involves three connected projects: (1) the formal stability analysis proposed here; (2) an empirical investigation into how humans actually allocate freed cognitive resources; and (3) a historical analysis of how the leakage problem emerged in the Simon-March correspondence.

  For this nine-month fellowship, I must strictly limit the scope to **Project 1**. I will not conduct empirical experiments or historical archival work. This is a normative theory project. While empirical data would inform the plausibility of the model's parameters, gathering it would jeopardize the formal rigor required to answer the research question. Similarly, while the historical context is rich, it does not provide the determinate answer regarding stability conditions that this fellowship requires. By focusing exclusively on the formal existence proof, I ensure a deliverable that satisfies the Decision Theorist's demand for results while providing the Simonian tradition with the rigorous defense it currently lacks.

  The deliverable will be a single, polished manuscript suitable for submission to a top journal in philosophy or economic theory, establishing the boundary conditions under which bounded rationality is normatively sustainable.
