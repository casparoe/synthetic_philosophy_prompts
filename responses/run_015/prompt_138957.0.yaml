answer: |-
  Your taxonomy captures the main tensions, but the practices suggest a sharper distinction between *administrative burden*, *sovereign autonomy*, and *market unity*. The procedural rules you identify are not merely empty vessels; they encode specific theories about what makes centralization illegitimate.

  In Germany, the Bundesrat veto presupposes a theory of **Administrative Ownership**. The wrong prevented is not federal intrusion into a reserved subject matter (your view *a*), but rather the imposition of administrative costs without political consent (your view *c*). Because the Länder execute most federal laws, they own the implementation burden. The veto compensates for this burden. This strictly presupposes that execution creates a political debt owed to the executor. It fits with a reserved-sphere view, but does not require it; the veto applies even where the Federation has legislative competence. The inconsistency regarding EU law arises because the theory shifts from Administrative Ownership to **Sovereign Consent**. In the EU context, Member States are sovereigns, not merely administrators. The Länder lose their veto because they are not the sovereigns sitting in the Council; the Federal Government is. The system presupposes that only the sovereign entity bearing the international obligation needs consent. If Germany adopted a strict Reserved-Sphere view (*a*), the Bundesrat veto would vanish for concurrent competences, regardless of who executes the law. If it adopted a pure Efficiency view (*b*), the veto would be replaced by a cost-benefit analysis of centralization.

  The EU's self-applied constraint operationalizes a **Comparative-Efficiency** view (*b*), but it reveals a crucial weakness: a constraint is only normative if violation carries a cost. By making the Commission justify itself to political bodies (Council, Parliament) rather than a court, the system presupposes that political accountability is sufficient enforcement. This fits with a Participation view (*c*) via the "yellow card" mechanism, but strictly presupposes that the Member States (in Council) are the best judges of their own incapacity. If the theory were Reserved-Sphere (*a*), the Court of Justice would annul laws based on subject-matter boundaries rather than deferring to the legislature's assessment of "scale or effects." The rarity of annulment suggests the principle is a political guideline, not a legal hard line. If the EU switched to a judicial enforcement model (presupposing *a*), the Commission's impact assessments would become legal briefs, and legislation would stall on justiciability questions rather than policy merits.

  The American asymmetry reveals that federalism protects different beneficiaries depending on the direction of the conflict. The clear-statement rule presupposes **Legislative Autonomy**: the wrong is the accidental displacement of state policy by ambiguous federal text. This protects state legislatures. Conversely, the Dormant Commerce Clause presupposes **Market Unity**: the wrong is protectionism that fragments the national economy, even if Congress is silent. This protects interstate commerce, not states. The asymmetry shows that US federalism is not a consistent shield for states, but a balance between state autonomy and national economic integration. If the US adopted a pure Reserved-Sphere view (*a*), the Dormant Commerce Clause would vanish, as states would have full authority over their internal commerce regardless of external effects. If it adopted a pure Efficiency view (*b*), courts would weigh the economic benefits of state regulation against national burdens in every case, turning judges into economic planners.

  Switzerland represents the purest form of **Popular Sovereignty** over legal hierarchy. By barring courts from reviewing federal statutes, the system presupposes that the electorate, not the judiciary, is the ultimate arbiter of competence. The optional referendum acts as a political veto (view *c*), but grounded in the people's will rather than institutional consent. This fits with a Reserved-Sphere view, but strictly presupposes that political checks are superior to legal ones for maintaining federation boundaries. If Switzerland adopted a Judicial Review model (presupposing *a*), the referendum would become redundant for competence issues, and the Court would gain power to invalidate popular mandates.

  Regarding the "upward principle" (cohesion/equivalent living conditions): this is not a rival to subsidiarity but defines the **Objective** within the Efficiency view (*b*). Subsidiarity asks if lower levels can *sufficiently achieve* the objective. If the objective is "national equivalence," local action is by definition insufficient. Thus, the duty to centralize is implicit in the definition of the goal. It transforms subsidiarity from a brake on power into a steering mechanism for integration.

  In sum, these systems are underdetermined because multiple theories can justify the same procedure. A veto can protect a reserved sphere (*a*) or compensate for administrative burden (*c*). Judicial review can enforce boundaries (*a*) or optimize efficiency (*b*). The differences emerge in the counterfactuals: Germany treats execution as ownership; the EU treats efficiency as political judgment; the US treats state autonomy as secondary to market unity; Switzerland treats the people as the constitutional court. Swapping these theories would not just change the rules; it would change who holds the power to define the federation's boundaries—administrators, judges, markets, or voters.
