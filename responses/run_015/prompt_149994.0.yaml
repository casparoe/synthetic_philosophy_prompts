      *   *Civil Disobedience (Rawls/Dworkin):* Public, non-violent, conscientious breach of law to appeal to public conscience.
      *   *Associative Duties (Dworkin/Scheffler):* Obligations arising from membership in a group/community.
      *   *Counter-Obligatory Solidarity:* A specific formulation where group solidarity creates a duty to *resist* unjust laws, potentially overriding state authority.
      *   *Direct vs. Indirect Disobedience:* Breaking the law being protested vs. breaking a related law to protest.

  3.  **Step-by-Step Analysis:**

      *   **Step 1: Fairness-Based Obligation.**
          *   *Theory:* The Principle of Fairness states that if one accepts benefits from a cooperative scheme, one has an obligation to follow its rules.
          *   *Application:* Segregation laws created a "scheme." Did Black citizens accept benefits? They used the buses (necessity, not voluntary acceptance). Were they treated as equal participants? No. They paid fares but sat in the back, stood, were abused.
          *   *Conclusion:* The reciprocity required for fairness is absent. The state failed its side of the bargain. Therefore, no fairness-based obligation exists. In fact, the system is exploitative.

      *   **Step 2: Civil Disobedience Conditions.**
