              *   *Non-violent:* Yes, strict discipline maintained by King/Parks/etc.
              *   *Contrary to Law:* Here is the nuance. They didn't sit in white seats (initially). They *didn't ride*. Is not riding a bus illegal? No. But they were indicted under anti-boycott laws (conspiracy to hinder business).
              *   *Target:* Private carriers (Montgomery City Lines) operating under municipal ordinance, not necessarily a state statute initially.
          *   *Evaluation:* It fits the *spirit* of civil disobedience but stretches the *legal* definition. It was economic withdrawal rather than direct law-breaking (until the indictments). It challenges the "breach of law" requirement if the primary act (walking) wasn't illegal, but the *organization* was criminalized.

      *   **Step 3: Counter-Obligatory Solidarity.**
          *   *Concept:* Membership in the Black community of Montgomery created a duty to support the boycott. Not just a right to disobey, but an *obligation* to disobey.
          *   *Application:* Car pools, walking, donating. If you rode the bus, you were a "traitor" to the cause.
          *   *Normative Structure:* Does this clarify? It explains the high participation rate despite hardship. It shifts the locus of authority from the State to the Community.
          *   *Does it confuse?* It risks prioritizing group loyalty over universal justice, but in this context, the group loyalty *was* the vehicle for universal justice. It clarifies the *motivation* and *sustainability*.

