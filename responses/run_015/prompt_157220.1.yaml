prompt: |-
  I'm the acquisitions editor for a small museum — we get exibit pitches every month that mix real archeology with fringe chronology or ancient-aliens claims. I need a reusable 10-minute screening procdure I can run alone, translating whatever philosophy of history says about demarcating pseudohistory (falsifiability, source proximity, consilience with established chronology, replication) into ordered steps: ask this, check that, hard stop here, values-call flag there. Fix the role, stakes, and where judgment can't be removed. Apply it to three pitches: (1) literal Plato Atlantis with underwater formations near the Azores; (2) Fomenko's statistical chronology arguing the Almagest was compiled in the 1500s; (3) ancient metallurgists needed alien tutors because a slag-purity study is misapplied. Include one case where the procdure kills it but I'd still want a "how myths form" display, and flag where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**
      *   **Role:** Acquisitions Editor for a small museum.
      *   **Task:** Create a reusable 10-minute screening procedure for exhibit pitches.
      *   **Problem:** Pitches mix real archaeology with fringe chronology/ancient aliens.
      *   **Requirements:**
          *   Translate philosophy of history criteria (falsifiability, source proximity, consilience, replication) into ordered steps.
          *   Include "hard stops," "values-call flags," and specific actions (ask/check).
          *   Define role, stakes, and where judgment is unavoidable.
          *   Apply to three specific pitches: (1) Literal Plato Atlantis/Azores, (2) Fomenko's New Chronology/Almagest, (3) Ancient Metallurgy/Alien Tutors.
          *   Include one case where the procedure kills the pitch but suggests a "myth formation" display.
          *   Flag where the procedure might misfire (limitations).

  2.  **Deconstruct the Philosophy of History Criteria:**
      *   *Falsifiability:* Can the claim be proven wrong? If not, it's not history/science.
      *   *Source Proximity:* How close is the evidence to the event in time and space? (Primary vs. Tertiary).
      *   *Consilience:* Does this fit with other established fields (geology, linguistics, genetics)?
      *   *Replication/Peer Review:* Have others found the same thing using the same methods?

  3.  **Drafting the Procedure (The "10-Minute Filter"):**
      *   *Goal:* Needs to be fast, actionable, and defensible.
      *   *Structure:* Step-by-step flow.
      *   *Tone:* Professional, skeptical but open, institutional.
      *   *Steps:*
          1.  **The Claim Statement (2 mins):** Define the core assertion.
          2.  **The Falsifiability Check (2 mins):** What would change their mind?
          3.  **The Evidence Chain (3 mins):** Source proximity and chain of custody.
          4.  **The Consilience Scan (2 mins):** Does it break physics/geology/linguistics?
          5.  **The Verdict (1 min):** Accept, Reject, or Pivot.
      *   *Hard Stops:* If they can't define falsification, stop. If evidence is anecdotal, stop.
      *   *Values-Call:* Distinguish between "educational value of the myth" vs. "factual accuracy."

  4.  **Defining Role and Stakes:**
      *   *Role:* Gatekeeper of public trust. Not a debunker, but a curator of truth.
      *   *Stakes:* Museum reputation, public understanding of science/history, donor trust.
      *   *Judgment:* The procedure can't automate empathy or educational potential. That's where the editor steps in.

  5.  **Applying to the Three Pitches:**

      *   **Pitch 1: Atlantis/Azores.**
          *   *Claim:* Plato was literal; underwater structures near Azores are proof.
          *   *Filter:* Falsifiability (What if it's natural basalt?), Consilience (Geology says volcanic, no evidence of advanced tech).
          *   *Outcome:* Reject as history. *Pivot:* "The Enduring Myth of Atlantis" (Case where we kill the fact but keep the story).

      *   **Pitch 2: Fomenko/New Chronology.**
          *   *Claim:* Almagest compiled in 1500s; history is compressed.
          *   *Filter:* Consilience (Breaks dendrochronology, ice cores, astronomy). Source Proximity (Ignores manuscript transmission).
          *   *Outcome:* Hard Stop. Pseudohistory. No educational pivot on *this* specific claim (too conspiratorial).

      *   **Pitch 3: Metallurgy/Aliens.**
          *   *Claim:* Slag purity implies alien tech.
          *   *Filter:* Replication (Has metallurgists replicated this?), Consilience (We know how to make pure metal without aliens).
          *   *Outcome:* Hard Stop. Misapplied science.

  6.  **Refining the "Misfire" and "Judgment" Aspects:**
      *   *Misfire:* The procedure might kill a legitimate paradigm shift (rare, but possible). It relies on *current* consensus.
      *   *Judgment:* Deciding if a "myth" exhibit is worth the risk of confusing visitors.

  7.  **Review and Formatting:**
      *   Make it look like a checklist/toolkit.
      *   Ensure the tone is appropriate for an editor (busy, decisive).
      *   Check all constraints: 10 minutes, specific pitches, philosophy integration, limitations.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Emphasize that this is a *screening*, not a full review. It's the "sniff test."
      *   *Critique:* Is the Atlantis pivot clear?
      *   *Fix:* Explicitly label it in the application section as the "Myth Formation" case.
      *   *Critique:* Did I explain *why* judgment is needed?
      *   *Fix:* Add a specific section on "The Human Variable."

  9.  **Final Polish:** Check against the prompt's specific phrasing ("values-call flag," "hard stop," "consilience"). Ensure the philosophy terms are translated into museum practice. (e.g., Consilience -> "Cross-Discipline Fit").

  *(Self-Correction Note: Make sure to clearly distinguish between the procedure itself and the application examples.)*

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # The "Truth-Threshold" Screening Protocol
  **Role:** Acquisitions Editor, Small Museum  
  **Time Budget:** 10 Minutes per Pitch  
  **Stakes:** Public Trust, Institutional Credibility, Educational Integrity  
  **Goal:** Distinguish between *historical inquiry* (open to revision) and *pseudohistory* (immune to evidence).

  ---

  ## Part 1: The 10-Minute Procedure

  ### Minute 0–2: The Claim Statement (Falsifiability Check)
  **Action:** Ask the proposer to write down the core historical claim in one sentence. Then ask: *"What specific piece of evidence would prove you wrong?"*
  *   **Hard Stop:** If they say "Nothing could prove me wrong," or "The evidence was destroyed/hidden," **REJECT**. History requires vulnerability to evidence.
  *   **Values-Call Flag:** If the claim is unfalsifiable but culturally significant (e.g., origin myths), mark for **"Myth & Meaning"** track, not **"History & Science"** track.

  ### Minute 2–5: The Evidence Chain (Source Proximity & Replication)
  **Action:** Request the primary source or physical data. Ask: *"Who else has analyzed this? Where is the peer-reviewed paper?"*
  *   **Check:** Is the evidence primary (contemporary to event) or tertiary (modern interpretation of a lost original)?
  *   **Hard Stop:** If the evidence relies solely on "secret documents," "oral tradition passed to one person," or "proprietary data no one else can see," **REJECT**.
  *   **Judgment Call:** If the data is real but the interpretation is fringe (e.g., real slag, wrong conclusion), proceed to Minute 5.

  ### Minute 5–8: The Consilience Scan (Cross-Discipline Fit)
  **Action:** Check the claim against established timelines in *other* fields (geology, genetics, linguistics, astronomy).
  *   **Ask:** *"If this is true, what else must be false?"* (e.g., If this city existed 12,000 years ago, where is the pollen? The pottery? The DNA?)
  *   **Hard Stop:** If the claim requires dismissing radiocarbon dating, dendrochronology, or ice core data *without* a new physical mechanism, **REJECT**. Pseudohistory often isolates history from science.
  *   **Values-Call Flag:** If the claim highlights a gap in the consensus (e.g., "We don't know how they moved this stone"), mark as **"Open Question"** rather than fact.

  ### Minute 8–10: The Verdict & Pivot
  **Action:** Assign one of three paths.
  1.  **Green Light:** Consilience holds, evidence is replicable. (Proceed to review).
  2.  **Red Light:** Pseudoscience/Pseudohistory. (Send rejection letter).
  3.  **Yellow Light (The Pivot):** The fact is wrong, but the *story* reveals something about human culture. (Propose "History of Misconception" exhibit).

  ---

  ## Part 2: Where Judgment Cannot Be Removed
  The procedure is a sieve, not a brain. You must intervene here:
  1.  **Educational Value vs. Confusion:** A "Yellow Light" pitch (e.g., Atlantis) risks visitors confusing myth with fact. You must judge if your signage can make the distinction clear enough.
  2.  **Community Sensitivity:** Some fringe claims are tied to identity or heritage. A hard "Red Light" based on science may cause community backlash. You must weigh scientific rigor against community relations.
  3.  **The "Paradigm Shift" Risk:** Science changes. Occasionally, a "Red Light" claim turns out to be right (e.g., Helicobacter pylori causing ulcers). You must judge if the proposer is a crank or a lone genius. *Heuristic: Cranks attack the people; geniuses attack the data.*

  ---

  ## Part 3: Application to Three Pitches

  ### Pitch 1: Literal Plato Atlantis (Azores Underwater Formations)
  *   **Minute 2 (Falsifiability):** Proposer claims structures are man-made. *Question:* "What if geology confirms natural basalt columns?" *Answer:* "Geologists are part of the cover-up." -> **Hard Stop.**
  *   **Minute 5 (Consilience):** Claim requires advanced seafaring 11,000 years ago. *Check:* No genetic or linguistic evidence of trans-Atlantic contact then.
  *   **Verdict:** **RED LIGHT (History), YELLOW LIGHT (Myth).**
  *   **Editor's Decision:** Kill the exhibit as archaeology. **Pivot:** Propose *"The Atlantis Effect: Why We Crave Lost Civilizations."* Use the Azores photos to explain pareidolia (seeing patterns in nature) and how Plato's allegory became literalized.
  *   **Why:** Satisfies the public interest without lying about geology.

  ### Pitch 2: Fomenko's New Chronology (Almagest compiled in 1500s)
  *   **Minute 2 (Falsifiability):** Claim: Ancient history is a forgery; Almagest is medieval. *Question:* "What proves this?" *Answer:* "Statistical analysis of star positions."
  *   **Minute 5 (Consilience):** *Check:* This requires dismissing tree-ring data, ice cores, and astronomical records from China and the Maya simultaneously. It breaks physics and geology globally.
  *   **Minute 8 (Replication):** Fomenko's methods are not accepted in statistical communities.
  *   **Verdict:** **HARD RED LIGHT.**
  *   **Editor's Decision:** Reject outright. No pivot.
  *   **Why:** This is not a "myth"; it is a conspiracy theory that invalidates the scientific method itself. It offers no educational value other than "how to be confused by statistics."

  ### Pitch 3: Ancient Metallurgists & Alien Tutors (Slag Purity Study)
  *   **Minute 2 (Falsifiability):** Claim: Slag purity is impossible without alien tech. *Question:* "What if we replicate the smelt?" *Answer:* "You can't, you don't have the lost knowledge." -> **Hard Stop.**
  *   **Minute 5 (Evidence Chain):** *Check:* Is the slag study peer-reviewed? *Result:* It's a self-published PDF. Real metallurgists show similar purity is possible with charcoal and bellows.
  *   **Minute 8 (Consilience):** Claim violates the principle of parsimony (Occam's Razor). Assumes aliens rather than human ingenuity.
  *   **Verdict:** **HARD RED LIGHT.**
  *   **Editor's Decision:** Reject.
  *   **Why:** It insults human agency. It turns technological achievement into "magic," which is historically demeaning to the culture being studied.

  ---

  ## Part 4: Limitations & Misfire Flags
  **Where this procedure fails:**
  1.  **The "Consensus Trap":** Consilience relies on *current* consensus. If your museum is too rigid, you become the Royal Society laughing at meteorites.
      *   *Mitigation:* If a pitch fails Consilience but has strong Primary Evidence, move it to "Research in Progress" rather than "Exhibit."
  2.  **The "Boredom Bias":** Real history is often messy and inconclusive. Fringe history is exciting and complete. The procedure might filter out boring-but-true pitches in favor of exciting-but-false ones if you aren't careful at Minute 8.
      *   *Mitigation:* Require a "What We Don't Know" panel for every exhibit.
  3.  **The "Myth Pivot" Risk:** In the Atlantis case (Pitch 1), visitors may ignore the "Myth" signage and only remember the "Atlantis" photos.
      *   *Mitigation:* You must personally review the draft copy. If the word "Alien" or "Atlantis" appears in a headline without "Myth" or "Legend" adjacent, kill it.

  **Final Note to Editor:**
  Your job is not to be the smartest person in the room. Your job is to be the guardian of the *process*. If the pitch respects the process (evidence, falsification, consensus), it belongs in the museum. If it asks you to suspend the process, it belongs in the fiction section.
