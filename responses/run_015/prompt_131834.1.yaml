      *(Self-Correction during drafting)*: Wait, if I reject (9), do I have to accept (7)? Yes. Does (7) lead to (9)? Only if you assume normativity = guidance. So rejecting the inference 7->9 is key. Or rejecting the premise in (9) that guidance is the *only* point.
