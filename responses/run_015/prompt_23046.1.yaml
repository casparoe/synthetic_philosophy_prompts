  Here is a rigorous reconstruction of your argument, designed for a population-ethics seminar. It isolates the specific expected-value assumption that generates the paradox and proposes a formal distinction between the aggregation of certain harms and the aggregation of risks.

  ---

  # Title: Blocking the Risk-Sure Slide: A Critique of Linear Expected Value in Population Ethics

  ## 1. The Standard Derivation of the Paradox
  To identify where the argument goes wrong, we must first formalize the standard derivation of the Dust-Specks conclusion using Expected Value (EV) theory. Let $H_t$ denote the harm of torture and $H_s$ denote the harm of a dust speck. Let $D(H)$ be the disvalue of harm $H$.

  The paradox typically proceeds via a continuum argument that relies on two implicit premises: **Commensurability** and **Linearity in Probability**.

  1.  **Premise 1 (Trade-off):** For any harm $H_s$ (speck), there exists some probability $p > 0$ such that facing a risk $p$ of $H_t$ (torture) is equally bad as suffering $H_s$ for sure.
      $$D(H_s) = D(\text{Risk}_{p, H_t})$$
  2.  **Premise 2 (Linearity of Risk):** The disvalue of a risk is linearly proportional to the probability of the harm occurring.
      $$D(\text{Risk}_{p, H_t}) = p \cdot D(H_t)$$
  3.  **Premise 3 (Aggregation of Risks):** The total disvalue of a distribution of risks across a population is the sum of the individual expected disvalues.
      $$D_{\text{total}}(\text{Population facing risks}) = \sum_{i=1}^{N} D(\text{Risk}_{p_i, H_t})$$
  4.  **The Calculation:** If we have $N$ people each suffering a speck, the total disvalue is $N \cdot D(H_s)$. By Premise 1, this is equivalent to $N \cdot p \cdot D(H_t)$. If $N$ is large enough such that $N \cdot p \geq 1$, then:
      $$N \cdot D(H_s) \geq 1 \cdot D(H_t)$$
  5.  **Conclusion:** A sufficiently large number of dust specks is worse than one sure torture.

  The counter-intuitive result arises because Premise 2 and Premise 3 allow us to treat a distributed *possibility* of catastrophe as morally equivalent to a concentrated *actuality* of catastrophe, provided the expectations match.

  ## 2. Identifying the Illegitimate "Expected-Value Move"
  Your argument targets the transition from **Premise 1** to **Premise 2**. Specifically, it rejects the identification of a tiny probability of severe harm with a small sure harm *for the purposes of aggregation*.

  The paradox relies on the **Ex Ante Equivalence Claim**:
  > *A state of affairs where $N$ people face a risk $p$ of harm $H$ is morally equivalent to a state of affairs where $p \cdot N$ people suffer harm $H$ for sure.*

  In the dust-specks case, this allows the slide:
  1.  $N$ people get specks.
  2.  Specks are equivalent to tiny risks of torture (by Premise 1).
  3.  Therefore, $N$ people face tiny risks of torture.
  4.  Therefore, the "expected number of tortures" is $>1$.
  5.  Therefore, this is worse than 1 sure torture.

  **The Error:** Step 4 to Step 5 is the illicit move. It assumes that *expected harm* aggregates across persons in the same way *realized harm* does. It treats the moral landscape as a pool of "expected disvalue units" that can be summed regardless of whether they materialize.

  ## 3. The Proposed Distinction: Sure Harm vs. Risk Aggregation
  Your position introduces a lexical priority or a threshold constraint that distinguishes between two domains of moral evaluation. We can formalize this by defining two distinct valuation functions: $V_{\text{sure}}$ for realized harms and $V_{\text{risk}}$ for probabilistic exposures.

  ### A. The Domain of Sure Harms (Aggregation Permitted)
  You are willing to concede that for *realized* harms, aggregation may hold.
  $$V_{\text{sure}}(\text{N Specks}) = \sum_{i=1}^{N} D(H_s)$$
  It is permissible to argue that for sufficiently large $N$:
  $$V_{\text{sure}}(\text{N Specks}) > V_{\text{sure}}(\text{1 Torture})$$
  This accepts standard aggregationism for *ex post* outcomes.

  ### B. The Domain of Risks (Aggregation Blocked)
  You reject the linearity of risk when the harm is catastrophic (torture) and the probability is sufficiently small. We posit a **Risk Threshold** $\delta$. For any probability $p < \delta$ and catastrophic harm $H_t$:

  $$V_{\text{risk}}(\text{Risk}_{p, H_t}) \ll p \cdot D(H_t)$$

  More strongly, you argue for a **Non-Aggregation Constraint on Catastrophic Risk**:
  No number of individuals facing a risk $p < \delta$ of torture creates a total disvalue greater than one individual suffering torture for sure.
  $$\sum_{i=1}^{N} V_{\text{risk}}(\text{Risk}_{p, H_t}) < V_{\text{sure}}(\text{1 Torture}) \quad \text{for all } N, \text{ if } p < \delta$$

  ## 4. Where the Argument Blocks the Paradox
  By implementing this distinction, we break the chain of equivalence at the precise point where the paradox is generated.

  1.  **Rejecting the Bridge:** We deny that $D(H_s) = p \cdot D(H_t)$. While a speck might be *locally* comparable to a tiny risk for an individual decision-maker (e.g., crossing the street), it does not carry that equivalence into the *population aggregation* context.
  2.  **The Ex Post Constraint:** The moral weight of torture is not fully captured by its expectation. There is a **concentration disvalue** in sure torture that is absent in distributed risk.
      *   **Scenario A (Sure Torture):** One person's life is definitively ruined. There is a victim with a complaint of absolute severity.
      *   **Scenario B (Distributed Risk):** No one is definitively ruined. Every individual retains the hope of escaping harm. Even if $N$ is astronomical, if $p$ is below $\delta$, no individual can claim they were "sacrificed" in the same way.
  3.  **The Mathematical Block:**
      *   Standard EV: $N \times (p \times \text{Torture}) = (N \cdot p) \times \text{Torture}$. If $N \cdot p > 1$, Scenario B > Scenario A.
      *   Your View: $N \times V_{\text{risk}}(p) < V_{\text{sure}}(\text{Torture})$. The function $V_{\text{risk}}$ is not linear; it is bounded such that the sum of risks cannot exceed the disvalue of the realized catastrophe.

  ## 5. Defending the Distinction (Seminar Talking Points)
  To defend this in a seminar, you should anticipate the objection: *"Why is it rational to ignore expected value?"*

  **1. The Complaint-Based Defense (Contractualism):**
  Draw on T.M. Scanlon. In the Sure Torture case, there is one person who can reasonably reject the principle that allowed their torture. In the Distributed Risk case, no single person suffers the torture. If $p$ is sufficiently low, no individual's burden is comparable to the torture victim's burden. Therefore, the torture victim's complaint trumps the aggregate complaints of the risk-bearers.

  **2. The Rights-Based Defense:**
  Rights function as side-constraints, not merely as weights in a utility function. A right against torture is a right against *being tortured*, not a right against a *mathematical expectation of torture*. Aggregating tiny risks violates no one's right against torture (statistically), whereas concentrating the harm violates one person's right absolutely.

  **3. The "Sure Thing" Principle Failure:**
  Standard EV relies on the independence axiom. Your argument suggests that moral value violates independence when catastrophic thresholds are crossed. The difference between "0% chance of torture" and "0.000...1% chance" is negligible for the individual, but the difference between "0 people tortured" and "1 person tortured" is categorical for the population.

  ## 6. Conclusion
  The Dust-Specks paradox is not a problem of aggregation *per se*, but a problem of **category error**. It treats *risk* as a fractional *harm*.

  *   **Aggregating Sure Harms:** Acceptable. $N$ specks may outweigh 1 torture.
  *   **Aggregating Risks:** Unacceptable when risks are tiny and harms are catastrophic. $N$ risks of torture do not outweigh 1 sure torture.

  The paradox dissolves once we reject the premise that moral value is linear in probability across all magnitudes. By drawing a firm line between the *ex ante* distribution of risk and the *ex post* reality of harm, we preserve the intuition that torture is uniquely objectionable without being forced to accept that dust specks are trivial regardless of number. The "expected-value move" is the sleight of hand that converts a possibility into an actuality; rejecting it restores the moral significance of the distinction between *might* and *is*.
