      *   Malfunction case (constitutive toxin)? Yes.
      *   Normative judgment explanation? Yes.
      *   Committed answer? Yes.
      *   Substitute Design for Evolution without collapse? Yes.
      *   Flag strongest disanalogy? Yes.

