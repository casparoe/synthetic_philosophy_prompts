answer: |-
  1. **Standard Deontic Dilemma:** Keeps the conflict but usually implies logical failure or tragedy; drop because it allows explosion. 2. **Paraconsistent Deontic Logic:** Allows contradictory obligations without triviality; keep because it fits the "doesn't leak" constraint perfectly. 3. **Failure of Agglomeration:** Denies that $O(A)$ and $O(B)$ imply $O(A \land B)$; keep because it preserves "both in force" without asserting a contradiction. 4. **Normative Residue:** Focuses on emotional aftermath like guilt; drop because you care about inferential discipline, not feelings. 5. **Defeasible Logic:** Resolves conflict via priority or exceptions; drop because your cases explicitly reject ranking or repair. 6. **Institutional Fact:** Explains rule persistence as social reality; drop because it ignores the logical structure of the conflict itself.

  The two survivors are **Paraconsistent Deontic Logic** and **Failure of Agglomeration**, and the carve between them turns on whether the contradiction is real or merely apparent. Paraconsistent Deontic Logic (PDL) accepts that $O(A)$ and $O(\neg A)$ can both be valid simultaneously without the system collapsing; this fits your "contradiction sits there" observation but costs you ontological simplicity—you must accept that contradictory norms are genuinely "true" or valid in the system. Failure of Agglomeration (FoA) blocks the inference from $O(A)$ and $O(\neg A)$ to $O(A \land \neg A)$; this preserves consistency by refusing to combine the requirements, fitting the "doesn't leak" constraint, but it struggles to explain the "accounting" procedure you observed, since FoA treats the clash as a logical non-event rather than a manageable state. Your cases lean toward PDL because the agents explicitly acknowledge the collision in the minutes and build components to notice it; FoA would suggest they should simply treat the rules as separate tracks that never meet, whereas your agents treat the meeting as a specific, managed occurrence.

  You can get containment without saying both requirement-claims are "true" in a classical sense by adopting a non-classical validity semantics, but this costs you the ability to say the rules *conflict* rather than just *diverge*. The "in-force" bit and the "doesn't-leak" bit are separable: Standard Deontic Logic has "in-force" but leaks (explodes), while a trivial system "doesn't leak" but has no meaningful "in-force" content. The philosophically interesting feature is the combination: the system treats the contradiction as a **local state** rather than a **global error**. To deny the truth of the claims while keeping the containment, you would have to treat obligation-statements not as truth-apt propositions but as commands with scope limits; this costs you the ability to reason about the rules using standard logical tools, forcing you into a purely procedural semantics that might not capture the "entrenched" nature your co-op members describe.

  The operational test is to ask the organization: "If this collision happens again, do we change the rules or the procedure?" If they change the rules, it is a **Defeasible Dilemma** (one rule yields); if they change the procedure, it is what I will coin an **Institutionalized Normative Glut**. This term defines a state where contradictory norms are validated as simultaneous inputs, but their logical consequences are scoped to prevent system-wide triviality. **Positive cases:** Your hospital protocol (escalate vs. sign-off) and the distributed-systems spec (invariants during partition). **Near-misses to exclude:** A traffic light versus a police officer's hand signal (this is **Priority**, not a glut, because one overrides the other); and a moral tragedy where an agent must choose and feels guilt (this is **Normative Residue**, not institutionalized, because the system doesn't build a procedure to manage the recurrence).
