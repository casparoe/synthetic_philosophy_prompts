              *   Real Analysis: No $\mathbb{R}$. Only computable numbers or rationals. Completeness axiom goes away.
              *   Set Theory: ZFC becomes ZF-Inf + Negation.
              *   Engineering: Discrete approximations only. No integrals, only sums.

  4.  **Refining the Philosophical Nuance:**

      *   *Potentialism vs. Actualism:* The user asks if it's a split view. It is. Intro calc is Aristotelian (potential). Set theory is Cantorian (actual).
      *   *Underdetermination:* The practice is underdetermined because the *success* of the math doesn't depend on the ontology. You can do the calculations either way, but the *justification* changes.
      *   *Cantor under Finitism:* This is tricky. Cantor's diagonal argument is constructive. Even a finitist can follow the steps *if* given a list. But the finitist denies the premise that the list *could* be complete. So it becomes a proof that the concept of "all natural numbers" is incoherent, not that there are larger infinities.

