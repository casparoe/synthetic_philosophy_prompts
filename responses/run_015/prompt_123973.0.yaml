  ## THE DECISION TREE

  **NODE 1:** If a contemporary Japanese liberal champions individual rights and constitutionalism, are they practicing "Western values"?
  *   **YES** → Go to Node 2. *(The Norms Branch)*
  *   **NO** → Go to Node 4. *(The Identity Branch)*

  **NODE 2:** If the history of these values is a crime scene of colonialism, is the label still valid?
  *   **YES** → Go to Node 3.
  *   **NO** → **LEAF A: The List/Content View**

  **NODE 3:** Is the core of the tradition a fixed doctrine (rights, markets) or the method of questioning those doctrines?
  *   **Fixed Doctrine** → **LEAF B: The Functional/Modernization View**
  *   **Method of Questioning** → **LEAF C: The Tradition-of-Self-Criticism View**

  **NODE 4:** Did 19th-century Ottoman reformers seeking constitutions adopt "Western values"?
  *   **YES** → **LEAF D: The Contrastive View**
  *   **NO** → Go to Node 5.

  **NODE 5:** Does an Athenian democrat count as a direct ancestor of the tradition?
  *   **YES** → **LEAF E: The Genealogical/Descent View**
  *   **NO** → Go to Node 6.

  **NODE 6:** If an elected European government acts illiberally, do they lose the label "Western"?
  *   **YES** → **LEAF F: The Honorific View**
  *   **NO** → Go to Node 7.

  **NODE 7:** Is Christianity essential to the definition, even for secular Europeans?
  *   **YES** → **LEAF G: The Religious View**
  *   **NO** → Go to Node 8.

  **NODE 8:** When a politician says "Defend the West," are they signaling policy or team loyalty?
  *   **Policy/Geography** → **LEAF H: The Geographic View**
  *   **Team Loyalty** → **LEAF I: The Self-Ascriptive View**

  ---

  ## THE LEAVES (Definitions & Vulnerabilities)

  **LEAF A: The List/Content View**
  *   **Definition:** "Western values" are a specific set of norms (democracy, rights) regardless of who holds them.
  *   **Awkward Commitment:** You must admit that a non-Western autocrat who adopts these norms is more "Western" than a Western traditionalist who rejects them.
  *   **Cross-Ex:** "If these values are universal norms, why do we need the geographic label 'Western' at all?"

  **LEAF B: The Functional/Modernization View**
  *   **Definition:** "Western values" are simply the software required for industrial modernity to function.
  *   **Awkward Commitment:** You must concede that China or Singapore could become more "Western" than Europe if they optimize the system better.
  *   **Cross-Ex:** "If this is just about efficiency, why does the rhetoric always sound like a moral crusade rather than a technical manual?"

  **LEAF C: The Tradition-of-Self-Criticism View**
  *   **Definition:** The only distinctive value is the canon of internal critics who challenge the tradition's failures.
  *   **Awkward Commitment:** You must claim that a patriot who blindly loves the West is actually betraying "Western values" more than a foreign critic.
  *   **Cross-Ex:** "If the value is self-critique, at what point does critiquing the tradition become rejecting it entirely?"

  **LEAF D: The Contrastive View**
  *   **Definition:** "Western" is defined solely by what it is *not* (e.g., not Eastern, not Islamic).
  *   **Awkward Commitment:** You have to explain why the definition shifts whenever the geopolitical enemy changes.
  *   **Cross-Ex:** "If the West is defined by its enemies, does peace mean the end of Western identity?"

  **LEAF E: The Genealogical/Descent View**
  *   **Definition:** Values are Western only if transmitted through the specific historical chain of Greece, Rome, Christendom, and Enlightenment.
  *   **Awkward Commitment:** You must exclude modern immigrants or converts who hold the values but lack the bloodline or cultural lineage.
  *   **Cross-Ex:** "If lineage matters more than content, are we defending values or just guarding a family heirloom?"

  **LEAF F: The Honorific View**
  *   **Definition:** "Western" is a term of praise; if a country acts badly, it ceases to be "Western" in the relevant sense.
  *   **Awkward Commitment:** You render the term useless for describing actual geography or history, turning it into a tautology ("Good things are Western").
  *   **Cross-Ex:** "If bad actions make a country non-Western, isn't this just a way to avoid admitting Western countries do bad things?"

  **LEAF G: The Religious View**
  *   **Definition:** The values are inextricably rooted in Christian theology, even if secularized.
  *   **Awkward Commitment:** You must alienate secular Europeans or non-Christian Westerners who claim these values as their own.
  *   **Cross-Ex:** "If the values are Christian, why do we insist they are universal enough for everyone to adopt?"

  **LEAF H: The Geographic View**
  *   **Definition:** "Western" simply means Europe plus the Anglosphere (US, Canada, Aus, NZ).
  *   **Awkward Commitment:** You have to defend why a value held in France is "Western" but the same value held in Japan is not.
  *   **Cross-Ex:** "If it's just geography, why do we get angry when Western nations violate values that non-Western nations keep?"

  **LEAF I: The Self-Ascriptive View**
  *   **Definition:** Uttering the phrase signals which tribal team you are on during a conflict.
  *   **Awkward Commitment:** You admit the phrase has no descriptive content and is purely a tool for mobilization.
  *   **Cross-Ex:** "If this is just team signaling, why pretend it's a substantive debate about principles?"

  ---

  ## EMPTY COMBINATIONS (Logical Possibilities Nobody Occupies)

  1.  **Religious but not Genealogical:** Believing Christianity is essential (Leaf G) but the Athenian/Greek lineage is irrelevant (Reject Node 5).
      *   *Status:* **Unattractive.** It severs the "Civilization" narrative that links Athens to Jerusalem, leaving a theology without a history.
  2.  **Functional but not Content:** Believing the values are for modernization (Leaf B) but denying they are a specific list of norms (Reject Leaf A).
      *   *Status:* **Incoherent.** You cannot have a functional "software" of modernity without specifying the code (rights, laws, markets).
  3.  **Honorific but not Self-Ascriptive:** Believing the term is praise (Leaf F) but *not* a signal of team loyalty (Reject Leaf I).
      *   *Status:* **Unmapped.** In practice, praise of "us" is almost always tribal signaling; pure moral praise without group identity rarely uses the label "Western."
  4.  **Contrastive but not Geographic:** Believing the term is defined against an "Other" (Leaf D) but that the "West" isn't tied to Europe/Anglosphere (Reject Leaf H).
      *   *Status:* **Incoherent.** If it's not geographic, and defined by opposition, it becomes a floating signifier with no anchor for who constitutes the "We."

  ---

  ## FLAGGED PAIRS (Questions That Fail to Distinguish)

  **Leaf A (List/Content) vs. Leaf B (Functional/Modernization)**
  *   **Why:** Both Node 1 (Japanese Liberal) and Node 3 (Chinese Technocrat) tend to yield "Yes" for both views. The tree struggles to separate "Universal Norms" from "Universal Tools."
  *   **Fix:** In debate, force the distinction by asking: "Is the value good because it is *true* (Content) or because it *works* (Functional)?"

  **Leaf H (Geographic) vs. Leaf I (Self-Ascriptive)**
  *   **Why:** Both Node 6 (Illiberal European) and Node 8 (Team Loyalty) often overlap. A geographic defender often acts like a tribal defender when borders are threatened.
  *   **Fix:** In debate, force the distinction by asking: "If Australia moved to Asia, would it cease to be Western? (Geographic says No, Ascriptive might say Yes if alliances shift)."
