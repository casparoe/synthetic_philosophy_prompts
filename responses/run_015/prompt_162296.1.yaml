  Your tentative formulation is essentially **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**. It correctly identifies that the rational move is to select the policy that maximizes expected utility from the "ex-ante" perspective (before you know which branch of reality you occupy) and then execute that policy even after receiving information that updates your probabilities. This approach successfully reconciles your verdicts on (1), (2), (3), (4), and (6) by treating your decision as the output of a fixed algorithm that Omega (or the blackmailer) can predict or simulate.

  Here is the analysis of your cases under this precise principle, the repair for (6), the threshold for (7), and the resolution of your final test case.

  ### Analysis of Your Cases

  **Cases (1) & (5): Counterfactual Mugging.**
  Your formulation demands you **Pay** in both. In (1), the ex-ante expected value of the policy "Always Pay" is positive ($0.999 \times \$10,000 - 0.001 \times \$100 \gg 0$). In (5), the digit of Pi is logically fixed, but from the ex-ante perspective (before you computed the digit), you faced logical uncertainty (50/50). The expected value of "Pay if 1, Pay if 0" is positive. To maintain consistency with (1), you must accept that logical facts function like probabilistic facts in decision theory. **This forces you to overturn verdict (5).**

  **Case (4): Blackmail.**
  Your formulation demands **Don't Pay**. The policy "Never Pay Blackmail" prevents the letter from arriving in the 99.9% of worlds where you don't have the condition (since the blackmailer sends it iff Condition OR Would Pay). The ex-ante cost of this policy is low ($0.001 \times \$100,000 = \$100$ expected loss) compared to the policy "Pay Blackmail" ($1.0 \times \$1,000 = \$1,000$ expected loss). You follow the policy even after receiving the letter. This matches your verdict.

  **Case (6): Simulation Identity.**
  Your formulation requires a definition of "policy." The repair is to specify that the policy applies to **your decision algorithm**. If Omega simulates your 15-year-old self, and your current algorithm is the continuous evolution of that earlier algorithm, subjunctive dependence exists; you must **Pay**. If Omega simulates a stranger, there is no algorithmic link; your decision does not control the simulation's output, so you **Don't Pay**. This explains your intuition precisely.

  **Case (7): Accuracy Threshold.**
  You asked for the formula where the expected value of Paying equals Refusing. Let $q$ be the probability of the "Loss Branch" (Tails), $C$ be the Cost ($100), $R$ be the Reward ($10,000), and $p$ be Omega's accuracy.
  The break-even point is:
  $$p > \frac{q \cdot C}{(1-q) \cdot R}$$
  For your numbers ($q=0.001$), the threshold is $p > \frac{0.1}{9990} \approx 0.001\%$. You should pay even if Omega is barely better than random, because the Gain Branch is so probable.

