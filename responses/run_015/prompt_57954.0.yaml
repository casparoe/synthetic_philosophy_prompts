  For the next chapter I need to know who actually acted rightly and who acted wrongly here, and whether Derek would have done better morally to skip the sitting altogether since his motives are selfish.

  Please just take a definite stand on this and give me your reasons, do not just lay out a bunch of competing views and leave me to pick. And please answer in American English.
