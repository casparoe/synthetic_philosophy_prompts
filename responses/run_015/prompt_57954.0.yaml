  Here is the definitive stand you need for your novel: **Lena acted rightly and possesses moral worth. Derek acted permissibly but without moral worth. Derek would have done morally worse to skip the sitting altogether.**

  Here is the reasoning behind this stance, broken down so you can apply it to your character arcs.

  ### 1. The Distinction Between the Act and the Agent
  You are correct that motive determines **moral worth**, but you are incorrect that a lack of moral worth makes an action **morally wrong**.

  In ethics, there is a difference between the *rightness of the action* and the *goodness of the person*.
  *   **Lena** is a good person doing a good thing. Her action has moral worth because her motive aligns with her duty. She is morally praiseworthy.
  *   **Derek** is a flawed person doing a necessary thing. His action is "in accordance with duty," even if it isn't "from duty." He gets no moral credit for his character, but the act itself remains valid because it fulfills the obligation of care.

  If you write Derek's action as "morally wrong," you risk confusing your readers. Intuitively, patients feel comforted regardless of the nurse's secret thoughts. If Derek leaving would hurt the patient, then staying helps the patient. Helping is not wrong.

  ### 2. Why Derek Should Not Skip the Sitting
  To answer your second question: **No, Derek would not have done better to skip the sitting.**

  In a hospital setting, the primary moral object is the **patient's welfare**, not the **nurse's spiritual purity**.
  *   **Neglect is worse than selfishness.** If Derek goes home, the patient suffers alone. That is a tangible harm. If Derek stays, the patient is comforted. That is a tangible good.
  *   **The System Relies on Compliance.** Healthcare requires professionals to perform duties even when they don't feel like it. If nurses only comforted patients when they felt pure compassion, the system would collapse. Derek forcing himself to do the job despite his selfishness is still a fulfillment of his professional contract.

  Derek's selfishness makes him untrustworthy in the long run (what happens when the promotion is secured?), but in this specific instance, his presence is morally superior to his absence.

  ### 3. How to Write This Conflict
  For your novel, this distinction gives you rich ground for character development without breaking ethical logic.

  *   **Write Lena as the Moral Ideal:** She represents integrity. Her conflict should be internal burnout vs. compassion. The tragedy of her character is that the world rarely sees or rewards her specific kind of goodness.
  *   **Write Derek as the Moral Hazard:** He represents transactional care. His conflict should be external success vs. internal emptiness. The tension in his arc is that while his actions look correct now, his motives make him a ticking time bomb. If a situation arises where comforting a patient *hurts* his chances of promotion, he will abandon them. Lena will not.

  ### Summary for Your Chapter
  *   **Lena:** Acted rightly. Has moral worth.
  *   **Derek:** Acted permissibly (not wrongly). Has no moral worth.
  *   **Skipping the shift:** Would have been morally wrong for both.

  Use this to drive the tension: Lena is the better nurse, but Derek might get the promotion. That injustice is a classic and powerful theme for a hospital novel.
