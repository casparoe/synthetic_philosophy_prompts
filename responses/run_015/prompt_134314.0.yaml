      *   (1) Specification vs. (2) Optimization Pressure: These are tightly linked. Goodhart's Law covers both. Specification is "what we ask," Optimization is "what we get when we push." They are often the same joint (Robustness/Generalization).
      *   (3) Agency: This is distinct. It's about instrumental convergence and power-seeking.
      *   (4) Authority: This is normative/political, not technical. It's crucial but distinct from "will it kill us" vs "will it do what we said."
