answer: |-
  **Answer Space Construction**
  We define positions by four binary distinctions: (a) **Agency:** Must art be a product of an agent? (b) **Meaning:** Must it intend to communicate? (c) **Aesthetics:** Must it possess intrinsic aesthetic properties? (d) **Status:** Is artworld treatment constitutive or merely evidence?

  **Diagnostic Quiz**
  *For each case, select: (A) Art, (B) Art badly made, or (C) Not art at all.*

  1.  **Forgery:** A perfect Van Gogh copy, indistinguishable to experts, sold as original.
  2.  **Nature:** A river stone resembling Brancusi, untouched by humans.
  3.  **Chimp:** A painting made by a chimp, framed and sold by a gallery.
  4.  **AI:** An image generated by code with no human input, displayed in a museum.
  5.  **Brick:** A plain brick on a pedestal; artist claims it has no meaning.
  6.  **Buried:** A known artist's canvas, unseen in a crate for 200 years, then found.
  7.  **Shovel:** A farm shovel used for digging, identical to one displayed as "Tool".
  8.  **Private:** A poem recited in a soundproof room; no audience, no recording.

  **Scoring Key**
  Map your dominant pattern to these leaves:

  *   **Strong Institutional:** (A) on 3, 4, 5, 6; (C) on 1, 2, 7, 8. *Status (d) is constitutive; Agency (a) matters only if recognized.*
  *   **Historical/Narrative:** (A) on 1, 6; (C) on 2, 3, 4. *Requires art-historical lineage; rejects ahistorical objects.*
  *   **Aesthetic-Functional:** (A) on 1, 2; (B)/(C) on 5, 7. *Requires intrinsic aesthetic properties (c); rejects conceptual blanks.*
  *   **Expression/Communication:** (A) on 8; (C) on 4, 5. *Requires intent to mean (b); rejects algorithmic or empty gestures.*
  *   **Cluster Account:** (A) or (B) on most cases (1–6); flexible on 7, 8. *No single condition necessary; family resemblance across (a–d).*
  *   **Anti-definitional:** Inconsistent pattern; refuses to generalize. *Claims no unified definition is available.*

  **Caveats & Gaps**
  *   **Indistinguishable Leaves:** The **Cluster Account** and a **Weak Institutional View** often yield identical scores here. Both accept artworld evidence as strong but not solely constitutive, agreeing on most canonical cases while allowing exceptions. This quiz cannot separate them because both occupy the "yes, somewhat" center of the answer space, satisfying enough conditions from (a–d) without demanding all.
  *   **Undefended Combination:** Affirming **Nature (2)** and **AI (4)** as Art while denying **Buried (6)** and **Forgery (1)** is historically undefended. This implies art requires neither agency nor history nor aesthetics, only novelty or display. This gap reflects incoherence: if neither human agency nor art-historical lineage matters, the category "art" loses its distinction from "object," making the view unattractive rather than merely unexplored.
  *   **Agency Gap:** If you mark **Chimp (3)** as Art but **AI (4)** as Not Art, you hold a biological agency view rarely systematized in philosophy, though common intuitively. This suggests distinction (a) relies on carbon-based life rather than intentionality, a position most theories collapse into either Expression or Historical views.
