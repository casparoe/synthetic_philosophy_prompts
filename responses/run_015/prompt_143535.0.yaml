      *Let's finalize the "Pendentive" point:* It was raised by architectural historians (like Andrew Hopkins or Katz). It's substantive only in that it shows G&L's analogy was imperfect, but it doesn't touch the biological logic. I'll characterize it as "substantive regarding the rigor of the analogy, but not the biological thesis."

