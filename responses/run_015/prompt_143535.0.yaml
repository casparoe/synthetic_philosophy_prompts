      *   *Check:* Did I address the EP/Sociobiology claim? Yes, note the anachronism regarding EP.
      *   *Check:* The Frog Case. The handout says "present function is irrelevant to its evolutionary explanation." This is the key error. It's irrelevant to the *origin* explanation, but relevant to the *maintenance* explanation. I need to make sure this distinction is clear.
      *   *Check:* The "Pendentive" point. I should mention that while architecturally true, it doesn't invalidate the biological argument, but it does show G&L were sometimes loose with their own metaphors.

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between the 1979 paper and the 1982 "Exaptation" paper (Gould & Vrba) is clear, as the frog case relies on concepts fully fleshed out in 1982, though rooted in 1979. *Self-correction:* The prompt asks about the 1979 paper specifically. I should mention that the 1979 paper sets the stage, but the 1982 paper clarifies the "co-option" terminology. I will frame the frog analysis using the 1979 logic but note where the terminology was later refined, as philosophy of biology courses often treat them as a unit. Actually, strictly speaking, "exaptation" is 1982. In 1979, they just called them spandrels/by-products. I need to be careful not to conflate them too much, but the frog case *requires* the concept of co-option to be analyzed correctly. I will explain that the 1979 paper identifies the problem, and the later work provides the vocabulary, but the *logic* regarding the frog is consistent with the 1979 critique of ignoring history.

