answer: |-
  Your instincts are excellent. The summary in your housemate's book is a classic example of what philosophers of biology call a "straw man" reconstruction of the Spandrels paper. It takes a nuanced methodological critique and flattens it into an ontological denial of adaptation. If you take that summary into your midterm, you will likely misrepresent the primary text.

  Here is a claim-by-claim breakdown of the book's summary, followed by a re-evaluation of your frog case study.

  ### Part 1: Deconstructing the Book's Summary

  **Claim 1:** *"Gould and Lewontin's 1979 paper showed that adaptationism is false."*
  *   **Gould & Lewontin (G&L):** They would wince. They explicitly state that natural selection is the only known mechanism for *adaptation*. They do not deny that adaptation occurs; they deny that it is the *only* cause of form.
  *   **Adaptationist Critic:** Wrong. Adaptationism is a research strategy, not a truth-claim that can be "false." The paper critiques a *style* of reasoning, not the mechanism of selection.
  *   **Verdict:** **Caricature.** The paper argues the *Adaptationist Programme* is often methodologically lazy, not that adaptation is false.

  **Claim 2:** *"Adaptationism... is the view that every trait of every organism is an adaptation..."*
  *   **G&L:** They attribute this view to their opponents (the "Panglossian Paradigm"), often citing popularizers or implicit assumptions in models.
  *   **Adaptationist Critic:** Wrong. Serious evolutionary biologists (like Maynard Smith, whom you mentioned) never claimed *every* trait is adaptive. They argue that adaptation should be the *null hypothesis* or the *first thing you test*. The book substitutes an indefensible ontological claim for a methodological heuristic.
  *   **Verdict:** **Straw Man.** G&L portrayed this as the *de facto* practice of their opponents; critics argue it was never the *de jure* position of serious biologists.

  **Claim 3:** *"...most features of an organism are spandrels..."*
  *   **G&L:** They argued that *many* features are spandrels or products of constraint, and that biologists ignore this category. They did not quantify "most."
  *   **Adaptationist Critic:** Wrong. There is no evidence that "most" traits are non-adaptive.
  *   **Verdict:** **Overstatement.** The point was to expand the explanatory toolkit, not to invert the ratio of adaptation to by-product.

  **Claim 4:** *"...asking 'what is it for?' is a waste of a biologist's time..."*
  *   **G&L:** They would strongly reject this. They argue that asking "what is it for?" is a *bad starting point* if you haven't ruled out constraint or drift. It is not a waste of time; it is a question that requires rigorous evidence to answer.
  *   **Adaptationist Critic:** Simply wrong. Function is central to biology.
  *   **Verdict:** **Caricature.** G&L's point is about the *gap between current utility and historical origin*, not the irrelevance of function.

  **Claim 5:** *"...present usefulness is no evidence whatsoever about why it evolved..."*
  *   **G&L:** They would accept a nuanced version: Present usefulness is not *sufficient* evidence for historical selection. It is consistent with exaptation (co-option).
  *   **Adaptationist Critic:** Wrong. Present usefulness is *some* evidence, just not conclusive proof.
  *   **Verdict:** **Overstatement.** The book turns a warning about inference ("don't assume utility proves origin") into a prohibition ("utility proves nothing").

  **Claim 6:** *"...effectively demolished... evolutionary psychology..."*
  *   **G&L:** Anachronistic. Evolutionary Psychology (EP) as a distinct institutional program post-dates 1979. G&L criticized Sociobiology (Wilson), but did not claim to have "demolished" the field.
  *   **Adaptationist Critic:** Wrong. EP emerged partly in response to Spandrels, incorporating some constraints while maintaining adaptationism.
  *   **Verdict:** **Retrospective Teleology.** This is the book author's narrative, not G&L's conclusion.

  **Claim 7:** *The "Pendentive" Objection (Architectural Pedantry)*
  *   **Analysis:** Architectural historians (e.g., Katz 2004) noted that the triangular spaces in St. Mark's are technically *pendentives* (which support the dome), while *spandrels* are the spaces between arches.
  *   **Verdict:** **Substantive regarding rigor, not biology.** It doesn't refute the biological argument, but it undermines the precision of G&L's central metaphor. It suggests they were sometimes loose with their analogies, which is a fair philosophical criticism of their rhetorical style, even if the biological point stands.

  ---

  ### Part 2: Core Conceptual Corrections for Your Notes

  To answer your specific questions on how to frame this for your midterm:

  1.  **The Target:** The "Adaptationist Programme" G&L attacked was not the thesis that *every* trait is an adaptation. It was the **methodological tendency** to assume adaptation is the *default* explanation without testing alternatives (constraint, drift, by-product).
  2.  **Spandrel Scope:** A spandrel is not just "any feature not selected." It is specifically a **structural by-product** of selecting for something else (e.g., you select for a larger jaw, and you get a larger muscle attachment site as a necessary architectural consequence). It does not cover traits caused by random drift (though G&L often lumped non-adaptive causes together).
  3.  **The Evidence Gap:** G&L do not claim current utility is "no evidence." They claim it is **equivocal evidence**. A trait can be useful now (current utility) but have originated for a different reason or no reason (historical origin). Conflating the two is the "adaptationist fallacy."
  4.  **Sociobiology/EP:** The paper is a **methodological warning**, not a field-killer. It demands that sociobiologists/EP researchers prove a trait is an adaptation rather than assuming it. The book's claim that it "demolished" these fields is false; it merely forced them to be more rigorous (in theory).

  ---

  ### Part 3: Re-running the Frog Case Study

  Here is how you should analyze the burrowing frog problem using the corrected reading.

  **The Case:**
  *   **Trait:** Enlarged male forearms.
  *   **Origin:** By-product of allometric growth selected for larger body size (Spandrel).
  *   **Current Function:** Wrestling rivals for mates (Useful).
  *   **Handout Verdict:** "This is a spandrel and its present function is irrelevant to its evolutionary explanation."

  **Critique of the Handout:**
  The handout is applying the **Book's Caricature**, not G&L's actual argument.
  *   **Origin vs. Maintenance:** G&L distinguish between why a trait *arose* and why it *persists*.
      *   **Origin:** The handout is correct that the *origin* is explained by allometry/body size selection, not wrestling selection.
      *   **Maintenance:** The handout is **wrong** to say present function is "irrelevant to its evolutionary explanation." If the forearms now confer a mating advantage, they are likely being *maintained* or even *refined* by sexual selection. Ignoring this would be bad biology.
  *   **The "Spandrel" Label:** In 1979, G&L would call the *origin* a spandrel. However, in later work (Gould & Vrba 1982, "Exaptation"), they clarified the terminology for exactly this case. A trait that originates as a by-product but is later co-opted for a function is an **exaptation**.
  *   **The Verdict:** A faithful G&L analysis would say: "The forearm enlargement is a spandrel *in origin*, but its current size and shape may be an adaptation *in maintenance*. To explain the trait fully, you must separate the history of its origin from the history of its utility."

  **Scenario: Further Modification**
  *   **Question:** Does the verdict change if the forearm has since been further modified by selection for grappling?
  *   **Answer:** Yes. If the bone density or muscle insertion points have been specifically tweaked by selection for wrestling (beyond the initial allometric bulk), the trait is no longer *just* a spandrel. It is a **co-opted spandrel** that has undergone secondary adaptation. The "Book's Version" would still call it a spandrel (because it started as one) and dismiss the grappling function. The **G&L Version** acknowledges the historical layering: Spandrel origin $\rightarrow$ Exaptation $\rightarrow$ Secondary Adaptation.

  **A Case of Divergence (Book vs. G&L)**
  You asked for a case where the corrected version and the book's version classify differently. The **Human Chin** is the classic example.

  *   **The Trait:** The protruding bony chin of *Homo sapiens*.
  *   **The Book's (Adaptationist) Classification:** It must be an adaptation. Perhaps for muscle attachment during chewing, or sexual selection, or speech mechanics. It assumes there *is* a "for."
  *   **G&L's Classification:** It is likely a **spandrel**. As the human jaw shortened during evolution (selection for smaller teeth/different diet), the two sides of the mandible bumped into each other at the midline, creating a protrusion as a structural necessity of bone growth.
  *   **The Divergence:**
      *   The **Book** says: "Find the function. If you can't, you haven't looked hard enough." (Treats it as an Adaptation).
      *   **G&L** say: "The function (speech/chewing) may be secondary. The origin is structural constraint." (Treats it as a Spandrel).
      *   *Crucially:* If the chin *is* now used for muscle attachment, the **Book** says "See? It's an adaptation." **G&L** say "That is current utility, not historical origin. It remains a spandrel that was co-opted."

  ### Summary for Your Midterm

  1.  **Discard** the idea that G&L denied natural selection or claimed adaptation is rare.
  2.  **Retain** the distinction between **Current Utility** and **Historical Origin**. This is the philosophical core of the paper.
  3.  **Retain** the critique of **Methodological Monism**: Biologists should test for constraint and drift *before* settling on adaptation, not after.
  4.  **For the Frog Case:** Argue that the handout commits the very error G&L warned against. It treats "Spandrel" as a permanent label that negates current function. A proper G&L analysis acknowledges the trait's origin as a by-product but insists that its current utility is evolutionarily relevant for its *maintenance* and *refinement*.

  If you write that "Gould and Lewontin argued that current utility is insufficient evidence for historical origin, but not irrelevant for current maintenance," you will demonstrate a much stronger grasp of the text than the popular summary provides.
