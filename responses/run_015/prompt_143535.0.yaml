          *   *Verdict:* Strawman (according to critics), though G&L claimed this was the *de facto* practice.

      *   *Claim 3:* "...most features of an organism are spandrels..."
          *   *Analysis:* G&L argued *many* features are spandrels or due to constraint, not necessarily *most*. They wanted to expand the explanatory toolkit, not invert the ratio completely.
          *   *Verdict:* Overstatement.

      *   *Claim 4:* "...asking 'what is it for?' is a waste of a biologist's time..."
          *   *Analysis:* G&L never said it's a *waste of time*. They said it's a *bad starting point* without ruling out alternatives. Current utility $\neq$ historical function.
          *   *Verdict:* Caricature/Wrong.

      *   *Claim 5:* "...effectively demolished the adaptationist research programmes — sociobiology first, and later evolutionary psychology..."
          *   *Analysis:* G&L were critical of sociobiology (especially Wilson), but the paper didn't "demolish" EP. EP emerged *after* 1979. G&L opposed the *methodology*, but the field persisted. This is retrospective teleology.
          *   *Verdict:* Wrong/Anachronistic.

      *   *Claim 6 (The Architectural Point):* "structures in question aren't really spandrels at all and that the term should have been something like 'pendentive'..."
          *   *Analysis:* This is a famous footnote in the literature (Katz 2004, etc.). It's technically true (pendentives support domes; spandrels are the spaces between arches), but philosophically, does it matter? It highlights that even the *analogy* was arguably misused, suggesting a lack of rigor. It's substantive insofar as it undermines the central metaphor's precision, but not a refutation of the biological concept of exaptation/by-product.
          *   *Verdict:* Pedantic but reveals a lack of rigor in the analogy.

  3.  **Address the Specific Questions:**

      *   *Is the "adaptationist programme" really the thesis that every trait is an adaptation?* No, it's a methodological preference to test adaptation hypotheses *first*. G&L portrayed it as an ontological commitment; critics say it's a heuristic.
      *   *Does "spandrel" cover any feature not directly selected?* It covers by-products of other adaptations or constraints. It doesn't cover drift (though G&L lump non-adaptive causes together often).
      *   *Is "no evidence whatsoever" theirs?* No. Their claim is that current utility is *insufficient* evidence for historical selection, not that it's *no* evidence.
      *   *Does the sociobiology/EP conclusion follow?* No. That's a rhetorical flourish by the book author. G&L criticized sociobiology, but didn't claim to end the field.

  4.  **Re-evaluate the Problem-Set Case (Burrowing Frog):**

      *   *Scenario:* Male frogs have enlarged forearms. Cause: Allometric by-product of body size selection (not selected directly). Current Use: Wrestling rivals (increases mating).
      *   *Handout Verdict:* Spandrel, present function irrelevant to evolutionary explanation.
      *   *Critique:* This is the "Book's Version" (caricature).
      *   *G&L's Nuanced View:*
          1.  **Origin:** It is a spandrel (by-product) *initially*.
