          *   Address the "Pendentive" pedantry (briefly, as it's interesting but secondary).
      *   *Section 2: The Core Conceptual Corrections.*
          *   Adaptationism as methodology vs. ontology.
          *   Current utility vs. Historical origin (the "Gap").
          *   Spandrel vs. Exaptation (crucial distinction missing from the book).
      *   *Section 3: The Frog Case Re-run.*
