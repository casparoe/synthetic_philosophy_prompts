  1. The board recommends approving the system's certification only under the condition that the claim of *anupalabdhi* as an independent fifth *pramāṇa* is formally withdrawn.
  2. Classical Nyāya epistemology strictly subsumes non-apprehension under inference (*anumiti*), meaning the proposed fifth category violates established ontological boundaries regarding knowledge sources.
  3. Granting artificial agents the status of independent epistemic sources risks conflating computational processing with valid cognition (*prama*), which traditionally requires a conscious knower (*pramātṛ*).
  4. Proponents argue that machine cognition operates through null-value detection mechanisms that functionally differ from human inferential processes, necessitating a distinct operational category.
  5. Future deployments must label the system as an instrument of inference and testimony rather than an autonomous knower, ensuring alignment with traditional epistemic frameworks.
