      *(Self-Correction during drafting)*: Make sure I don't sound like I'm saying "never change anything." The prompt implies a decision needs to be made. The philosophy is about *how* to decide, not *what* to decide. Ensure the distinction between "undocumented feature" and "bug" is clear.

      *(Refining the "Leftover")*: The biggest leftover is *moral agency*. A routing loop is bad because it stops packets. A social breakdown is bad because people suffer. The "why" matters more in society. Also, networks can be rebooted. Societies rarely survive a hard reset.

