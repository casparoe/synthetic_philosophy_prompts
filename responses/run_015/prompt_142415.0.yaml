      *   **The Off-Policy Condition:** Analysis and verdict.
      *   **The Single Exclusionary Requirement:** Identify and justify.
      *   **Inconsistency Flag:** Where the theory might break.
      *   **Scorecard:** Brief summary of contenders (LLM/Behavioralism).
