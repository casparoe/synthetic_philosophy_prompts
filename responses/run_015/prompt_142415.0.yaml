      *   Dennett's "Real Patterns" (1991) is the key text. The core idea is that patterns are real if they support prediction better than the physical stance, without requiring perfect prediction.
      *   The tension lies between *instrumentalism* (stances are just tools) and *mild realism* (patterns are objectively there, even if stance-relative).
      *   The LLM dispute hinges on whether statistical correlation counts as "belief" or if grounding/causal history is needed.
      *   The Behavioralism dispute hinges on whether the *source* of the pattern matters (Twin Earth style issues).

  3.  **Drafting the Desiderata (The Specification):**
      *   *Predictive/Compressive Payoff:* Essential. If the intentional stance doesn't compress data better than the physical stance, it's noise. (Dennett's core).
      *   *Counterfactual Robustness:* Essential. Must handle "what if" scenarios, not just fit past data.
      *   *Causal-Mechanical Integration:* Tricky. Dennett wants to avoid requiring a specific *mechanism* for every intentional state (multiple realizability), but total disconnect makes it spooky. Let's call this "Causal Anchoring."
      *   *Non-Relativity (Objectivity):* Crucial for the "Real" in Real Patterns. The pattern shouldn't depend *solely* on the observer's whim, though it is stance-relative.
      *   *The Off-Policy Condition:* This is essentially a strong form of Counterfactual Robustness + Generalization. It tests against distributional shift.

  4.  **Sorting the Desiderata:**
      *   *Genuine Adequacy:* Predictive Payoff, Counterfactual Robustness (including Off-Policy).
      *   *Negotiable:* Degree of compression required (how much better than physical?).
      *   *Camp Prejudices:*
          *   *Mechanists:* Demand specific neural/silicon correlates for every belief (too strong for Dennett).
          *   *Hard Realists:* Demand mind-independent existence of beliefs (contradicts stance-relativity).
          *   *Radical Instrumentalists:* Deny patterns are real at all, just useful fictions (undermines the "Real Patterns" thesis).

  5.  **Addressing the Two Disputes:**
      *   *LLMs:* If they meet the Off-Policy condition, they pass. If they are just stochastic parrots failing under intervention, they fail.
      *   *Behavioralism:* If two systems have same I/O but one is a lookup table and one is reasoning, do they have the same beliefs? Dennett leans toward "same patterns" *if* the prediction holds, but the *history* might affect future robustness (Off-Policy).

  6.  **Analyzing the "Off-Policy Condition":**
      *   Is it distinct? It's a specific, rigorous instantiation of Counterfactual Robustness. It moves from "could predict" to "does predict under novel intervention."
      *   What does it rule out? Overfitting. Lookup tables. Stochastic parroting that fails under distributional shift.
      *   Argument: It is necessary to distinguish *capacity* from *accident*.

  7.  **Identifying the "Single Most Exclusionary Requirement":**
      *   It's likely the *Off-Policy/Counterfactual Robustness* combined with *Compression*. Many systems fit data (overfit). Few generalize under intervention without physical recourse.
      *   Actually, the tension between *Non-Relativity* and *Stance-Relativity* is the biggest philosophical hurdle. But for the specific disputes (LLMs/Behavioralism), the **Off-Policy Generalization** is the practical killer. Let's argue for that.

  8.  **Checking for Inconsistencies:**
      *   Can we have "Real Patterns" that are "Stance-Relative"? Yes, Dennett says so.
      *   Can we have "Behavioral Identity" but "Implementation Difference"? Yes, Multiple Realizability.
      *   *Potential Conflict:* If patterns are real, why do they vanish if we change the stance? (Answer: They are observer-relative but not observer-dependent).
      *   *Real Conflict:* The demand for *Causal Anchoring* vs. *Multiple Realizability*. If we demand the intentional state cause the behavior mechanistically, we threaten the autonomy of the intentional stance.

