answer: |-
  ### A Decision-Tree Taxonomy of Dietary Ethics and Wild-Animal Suffering

  The following taxonomy formalises the logical space of the debate concerning dietary choices (beef, chicken, and crops) when accounting for both farmed-animal welfare and wild-animal suffering (WAS). The tree is constructed from four binary logical distinctions. Each internal node represents a claim that divides the moral landscape; the leaves represent the resulting ethical positions.

  #### The Logical Nodes

  1.  **Moral Scope:** Do wild invertebrates and small mammals affected by crop production count in the moral calculus with weight comparable to farmed vertebrates?
  2.  **Wild Welfare:** Does the empirical view hold that wild animals typically lead net-negative lives (suffering outweighs pleasure)?
  3.  **Harm Aggregation:** Ought 'harvest mortality' (direct killing) be treated as morally equivalent to 'displacement mortality' (indirect death via habitat loss)?
  4.  **Farmed Asymmetry:** Do biological differences create a 'replacement-rate asymmetry' that makes beef ethically preferable to chicken?

