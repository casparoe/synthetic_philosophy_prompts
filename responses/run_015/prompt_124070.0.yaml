  #### Leaf Positions and Practical Commitments

  There are sixteen theoretical paths through the tree, but they converge upon six distinct ethical positions. The following descriptions detail the unique leaves.

  **Leaf 1: Standard Conscientious Omnivorism**
  *(Reached when Node 1 is NO, Node 4 is YES)*
  **Position:** Conscientious Carnivorism / Larder Logic (Farmed-Only)
  **Commitment:** This view implies that beef consumption is ethically preferable to a chicken-based diet, though a crop-based diet remains superior to both.

  **Leaf 2: Standard Ethical Veganism**
  *(Reached when Node 1 is NO, Node 4 is NO)*
  **Position:** Mainstream Animal Welfare Veganism
  **Commitment:** This view implies that a legume-based diet is strictly obligatory, as chicken production inflicts greater individual suffering per calorie than beef.

  **Leaf 3: Land-Sparing Vegetarianism**
  *(Reached when Node 1 is YES, Node 2 is NO, Node 4 is YES)*
  **Position:** Weak Wild-Animal Suffering Vegetarianism
  **Commitment:** This view implies that beef is ethically preferable to chicken due to land efficiency, yet both remain inferior to crops because wild lives are valuable.

  **Leaf 4: Strict Land-Sharing Veganism**
  *(Reached when Node 1 is YES, Node 2 is NO, Node 4 is NO)*
  **Position:** Strong Wild-Animal Suffering Veganism
  **Commitment:** This view implies that chicken is morally worse than beef, and both are significantly worse than crops, due to the compounded harm to wild vertebrates and invertebrates.

  **Leaf 5: Anti-Natalist Carnivorism**
  *(Reached when Node 1 is YES, Node 2 is YES, Node 4 is YES)*
  **Position:** Negative Utilitarian Meat-Eating
  **Commitment:** This view implies that a beef-based diet is ethically superior to a legume-based diet because agricultural expansion reduces net suffering by preventing wild births.

  **Leaf 6: Efficiency-Driven Carnivorism**
  *(Reached when Node 1 is YES, Node 2 is YES, Node 4 is NO)*
  **Position:** Negative Utilitarian Chicken-Preference
  **Commitment:** This view implies that chicken is ethically superior to beef, as its lower land use minimises the 'benefit' of wild-animal prevention per calorie consumed.

  ***

  #### Diagnostic Notes on Logical Space

  **A. Logically Inert Branches (Empty in Practice)**
  The branches originating from **Node 2** and **Node 3** are logically inert when **Node 1** is answered in the negative. If wild invertebrates and small mammals do not count morally (Node 1: NO), then the quality of their lives (Node 2) and the classification of their deaths (Node 3) cannot influence the moral calculus. Consequently, the eight theoretical leaves generated by combining Node 1 (NO) with the variations of Nodes 2 and 3 are indistinguishable from one another. They all collapse into either **Leaf 1** or **Leaf 2**, depending solely on Node 4. This is not incoherent, but rather indicates that the questions regarding wild-animal welfare are conditional upon the prior acceptance of their moral status.

  **B. Indistinguishable Leaves Regarding Harm Aggregation**
  Within the branches where **Node 1** is answered in the affirmative, **Node 3** (Harm Aggregation) fails to separate the final dietary ranking between beef, chicken, and crops in this specific taxonomy. Whether harvest and displacement deaths are treated as equivalent or distinct affects the *magnitude* of the calculated harm or benefit, but it does not typically reverse the *direction* of the ranking established by Node 2 (Wild Welfare).
  *   If wild lives are net-positive (Node 2: NO), agriculture is harmful regardless of how death is categorised; thus, crops remain superior to meat.
  *   If wild lives are net-negative (Node 2: YES), agriculture is beneficial regardless of how death is categorised; thus, meat remains superior to crops.
  Therefore, the pairs of leaves separated only by Node 3 (e.g., Leaf 3 vs. its Node 3-variant) are practically indistinguishable regarding the core dietary recommendation. They represent a difference in empirical accounting rather than a difference in ethical prescription.

  **C. Unexplored or Unattractive Branches**
  The position represented by **Leaf 6** (Negative Utilitarian Chicken-Preference) is rarely explicitly defended in literature. While the logic holds that if preventing wild life is good, one should do so efficiently (chicken), most proponents of the 'net-negative wild life' thesis tend to favour the highest land-use option (beef) to maximise the prevention of wild suffering. This branch is not incoherent, but it is unattractive to those who hold the view, as it conflicts with the intuition that 'more prevention is better'. Similarly, **Leaf 1** represents a position that is logically possible but unstable; if one accepts the replacement-rate asymmetry favours beef, one usually does so on land-use grounds, which inevitably invites the wild-animal considerations of Node 1, pushing the thinker towards Leaf 5.
