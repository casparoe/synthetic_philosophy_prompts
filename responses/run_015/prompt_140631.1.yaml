          *   *Why:* It's embodied. It handles the "thick present" (the switchback you are walking). It doesn't require an external observer (like the broadcast). It doesn't invoke light speed (like the star).
          *   *Decision:* **The "Hike" (or Journey) Map.** Let's refine this to be about *memory and anticipation* to engage the mindfulness group.
