answer: |-
  Here is a plan designed for your specific constraints: seventy-five minutes, a mixed lay audience, and a whiteboard as your only tool.

  ### 1. The Sequence of Components

  You cannot begin with the definitions. If you define "Presentism" and "Eternalism" immediately, the engineers will treat them as hypotheses to be tested against data, and the mindfulness group will treat them as states of mind. You must build the *problem* before you name the *positions*.

  **The Order:**
  1.  **The Phenomenological Anchor (5 mins):** Establish the shared intuition that the present *feels* unique.
  2.  **The Ontological Question (10 mins):** Distinguish "feels real" from "is real." (Epistemology vs. Ontology).
  3.  **The Core Scenario (15 mins):** Introduce the analogy (see Section 2) to model the two views.
  4.  **The Truthmaker Challenge (15 mins):** Introduce the distinction between existence and truth (your second wrinkle).
  5.  **The Consequences (15 mins):** Address fatalism and ethics.
  6.  **The Assessment (15 mins):** Closing questions.

  **Why this sequence cannot be permuted:**
  *   **Phenomenology first:** If you start with ontology, the mindfulness practitioners will feel their experience is being invalidated. You must validate the *feeling* of the "Now" before questioning its *status*.
  *   **Ontology before Physics:** If you let the engineers bring in Relativity before establishing the metaphysical question, the discussion becomes about light cones and simultaneity, which the rest of the group cannot access. You must establish *what is at stake* before asking *how we know*.
  *   **Scenario before Definitions:** Definitions are abstract; scenarios are concrete. Your group needs to "see" the Block before they can argue about it.
  *   **Truth before Consequences:** You cannot discuss whether the future is "fixed" (fatalism) until you agree on what it means for the future to "exist." The truthmaker distinction provides the vocabulary to separate "existing" from "causing."

  ### 2. The Core Scenario: The Mountain Trail

  Do not use the distant star (invites Relativity), the broadcast (invites an external observer), or the game world (invites a designer).

  **Use this:** **A Hiker on a Mountain Trail.**

  **The Setup:**
  Draw a winding line on the whiteboard representing a trail from a valley (Past) to a peak (Future). Put a dot on the line (The Hiker/Now).

  **The Two Views:**
  *   **Presentism:** Only the ground under the Hiker's boots exists. The valley behind is gone; the peak ahead is not yet there. The trail is created as the Hiker walks.
  *   **Block Universe:** The entire trail (valley, switchbacks, peak) exists as a single object. The Hiker is just a location on that object.

  **Why this example works for your group:**
  *   **Against the Engineers:** It is Newtonian. It does not invite calculations of light speed or reference frames. It forces them to argue metaphysics, not physics.
  *   **Against Fatalism:** A map existing does not mean the Hiker couldn't have taken a different path. It models "existence" without implying "coercion."
  *   **For the Mindfulness Group:** It respects the embodied experience of walking (the "Now") while allowing the possibility that the mountain is a whole thing.
  *   **For the Pragmatists:** It makes the denial of an objective "Now" sound sane. The trail is real even if I'm not standing on it.

  **What the example must lack:**
  *   **No Projector/Viewer:** Do not imply someone is looking at the trail from outside time. The trail just *is*.
  *   **No Erasure:** Do not suggest the past trail disappears. In the Block view, it remains; in Presentism, it ceases to be.
  *   **No Determinism:** Ensure the group understands the trail represents *spacetime*, not a script. The Hiker's choices are part of the trail's shape.

  ### 3. Predictable Misconceptions and Intervention Points

  You have diagnosed most correctly, but the order matters. Here is when they will surface and where to head them off.

  1.  **"Presentism is just common sense." (Minute 10)**
      *   *When:* Immediately after you introduce the Ontological Question.
      *   *Intervention:* Draw a circle on the board labeled "What I Can See" and a larger box labeled "What Exists." Ask: "Did the library exist before you walked in?" If yes, then existence $\neq$ perception. This separates *epistemic privilege* (I can only see now) from *ontological privilege* (only now is real).
  2.  **"If the future exists, I can't change it." (Minute 40)**
      *   *When:* During the Consequences phase.
      *   *Intervention:* Use the Trail. "Does the existence of the peak prevent you from climbing? No. It just means the peak is a coordinate." Distinguish *existence* from *causal power*. The future exists, but it does not *cause* the present.
  3.  **"My dead mother is still alive in the block." (Minute 45)**
      *   *When:* Shortly after the fatalism objection. This is the emotional hurdle for the Nurse/Accountant demographic.
      *   *Intervention:* Use indexicals. "Is your mother alive *here*?" No. She is alive *there* (at coordinate $t=1990$). Just as "Paris is not here" doesn't mean Paris doesn't exist, "Mom is not now" doesn't mean she never exists. This validates grief without validating Presentism.
  4.  **"Time is an illusion." (Minute 55)**
      *   *When:* When they try to summarize the Block view.
      *   *Intervention:* Correct this firmly. "Change is real. Movement up the trail is real. The Block view says time is like space, not that time is fake."
  5.  **"This is just a verbal dispute." (Minute 60)**
      *   *When:* As fatigue sets in.
      *   *Intervention:* Return to the Truthmaker Challenge (Section 4). If it were verbal, the truth conditions for "Caesar crossed the Rubicon" would be the same for both. They are not.
  6.  **"Only the present matters." (Minute 65)**
      *   *When:* Closing thoughts.
      *   *Intervention:* Separate ethics from ontology. "Even if the past is gone, promises made in the past can bind the present."

  ### 4. Advice on Your Two Wrinkles

  **Wrinkle One: The "Thick" Present (Specious Present)**
  *   **Verdict:** **Exclude from the main argument.**
  *   **Reasoning:** For a group with mindfulness practitioners, this is a trap. They will conflate the *duration of awareness* (psychological) with the *duration of reality* (ontological). If you allow the present to be "one second thick," the engineers will ask, "Is half a second real?" and you fall into a Zeno paradox.
  *   **Placement:** If someone raises it (they will), acknowledge it as a fact of *neurology*, not metaphysics. Say: "Whether the 'Now' is a knife-edge or a second wide, the question remains: Does the minute *before* that window still exist?" Keep it in the parking lot.

  **Wrinkle Two: Truth vs. Existence (Truthmakers)**
  *   **Verdict:** **Introduce Early (Step 4 in Sequence).**
  *   **Reasoning:** This is your most powerful tool. It gives the engineers a logical structure and the non-philosophers a concrete test.
  *   **How:** Write on the board: **"What makes this sentence true?"**
      *   Sentence: "There was a meeting here last month."
      *   Presentist Answer: The *present trace* (memory/minutes) makes it true.
      *   Eternalist Answer: The *past event itself* makes it true.
  *   **Why:** This clarifies that the dispute is about what is required in the world to ground our statements. It prevents the slide into "well, it's true that it happened, so who cares?"

  ### 5. How You Will Know It Has Landed

  Do not ask "Who agrees with Presentism?" That measures preference, not understanding. You need to test if they grasp the *cost* of each view.

  **The Closing Question:**
  > "Imagine we discover a way to prove, with 100% certainty, that a specific statement about the future is true right now (e.g., 'A storm will hit here in 2050').
  >
  > **For the Presentist:** What happens to that truth? Where does it live if the future doesn't exist?
  > **For the Eternalist:** What happens to the 'Now'? If that future fact is already real, what distinguishes this moment from that one?"

  **Assessment Criteria:**
  *   **Failure:** They answer with physics ("Time travel would be possible") or psychology ("We wouldn't feel it").
  *   **Success:** They answer with ontology.
      *   *Good Presentist answer:* "The truth exists only as a potentiality or a property of the present laws."
      *   *Good Eternalist answer:* "The 'Now' becomes an indexical, like 'Here'. It's real, but not unique."
  *   **The Signal:** If they stop asking "Which is right?" and start asking "What do we lose if we pick one?", you have succeeded.

  ### 6. What to Decline (and How)

  You must protect the 75 minutes from two black holes: **Special Relativity** and **Time Travel Paradoxes**.

  **How to say it:**
  At the start (Minute 5), draw a box on the whiteboard labeled **"Out of Bounds."** Inside, write "Physics Equations" and "Grandfather Paradoxes."

  **The Script:**
  > "We are doing metaphysics today, not physics. Physics tells us how time behaves; metaphysics asks what time *is*. If we start arguing about light speed, the engineers will win, and the rest of us will lose. If we start arguing about killing grandfathers, we're writing science fiction. We are going to stay inside the box of 'What exists?' If I pull us back to the whiteboard, it's because we've wandered into the physics lab."

  **Why this works:** It honors the engineers (acknowledging their expertise is elsewhere) without letting them dominate. It reassures the others that they don't need math to participate. It frames the boundary as a methodological choice, not an evasion.
