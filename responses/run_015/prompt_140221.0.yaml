answer: |-
  You have independently reconstructed one of the most robust and respected positions in contemporary moral philosophy. Your "ceiling" principle is not just a gut feeling; it is a formalized hybrid view that attempts to solve the exact tension you are feeling between utilitarian aggregation and Rawlsian separateness.

  In the literature, your intuition maps most closely to **Threshold Prioritarianism** combined with **Scanlonian Contractualism**. There are real, rigorous versions of this, and they can handle most of your cases without forcing you to abandon your core instincts. However, you are right to suspect a tension between your "headache vs. leg" verdict and your "poor town" verdict. Resolving that tension requires adding one specific variable to your model: **the distinction between allocation and imposition.**

  Here is how the philosophy breaks down your model, the nausea case, and the conflict you identified.

  ### 1. Is there a real version of your principle?

  Yes. Your "add up freely up to a ceiling, then answer one at a time" is essentially **Lexical Threshold Prioritarianism**.

  *   **Below the Threshold:** Harms are "non-catastrophic." Here, standard cost-benefit analysis (aggregation) holds. A million headaches can outweigh a broken leg because the broken leg, while serious, does not destroy the person's capacity to function as a moral agent or lead a minimally decent life. This respects your regulatory experience (small costs for statistical lives).
  *   **Above the Threshold:** Harms are "catastrophic" or "rights-violating" (torture, permanent disability, systemic dispossession). Here, aggregation stops. You cannot sum a billion headaches to justify torturing one person. This respects Rawls' "separateness of persons."

  The philosopher **Thomas Scanlon** provides the strongest framework for this in *What We Owe to Each Other*. His **Contractualism** argues that an act is wrong if it violates principles that no one could "reasonably reject."
  *   In the **torture case**, the victim can reasonably reject any principle that allows their torture for others' comfort. The headache sufferers cannot reasonably reject a principle that forbids torture to save them from headaches. The single strongest complaint wins; you don't add up the weaker complaints.
  *   In the **vaccine case**, no single person can reasonably reject a tiny risk of side effects to prevent a pandemic, because the risk is distributed and the benefit is universal.

  The philosopher **Frances Kamm** also works extensively on this, specifically on when aggregation is permissible. She argues that small benefits can aggregate to *save* a life, but they cannot aggregate to *kill* or *maim* an innocent bystander.

  ### 2. What does it say about the nausea case?

  *Case: A million people each losing an afternoon to mild nausea so that one stranger never gets a life of chronic pain.*

  Your "ceiling" principle gives a clear verdict here, but it might contradict your initial aggregation instinct.

  Chronic pain is almost certainly **above the threshold**. It alters the trajectory of a life, limits agency, and constitutes a major deprivation. Mild nausea is **below the threshold**.
  Under a Scanlonian or Threshold view, you compare the strongest individual complaint against the strongest individual complaint.
  *   **Person A (Chronic Pain):** "I will suffer debilitating pain for my entire life."
  *   **Person B (Nausea):** "I will feel sick for one afternoon."

  Even if there are a million Person Bs, their complaints do not *stack* to outweigh Person A's complaint because Person A's harm is lexically superior (above the ceiling). The principle says: **Save the stranger from chronic pain.**

  If your gut says otherwise (that the million afternoons *do* outweigh the life of pain), then your "ceiling" is higher than you think, or you are a pure utilitarian in disguise. But most threshold theorists would say the chronic pain victim trumps the aggregated nausea.

  ### 3. The Conflict: Headache-vs-Leg vs. The Poor Town

  You bet that these two verdicts can't both survive.
  1.  **Headache vs. Leg:** 1M headaches > 1 leg loss. (Aggregation wins).
  2.  **Poor Town:** 1M small benefits < 1 Town's health. (Aggregation loses).

  Structurally, these look identical: Aggregated Small Gain vs. Concentrated Large Loss. But morally, they differ on **Imposition vs. Allocation**.

  **The Resolution:**
  Your principle needs a **Fairness Constraint**. You can aggregate small burdens to prevent large harms *only if* the burdens and benefits are distributed fairly (ex-ante equality). You cannot aggregate if the large harm is *targeted* at a specific group to benefit others (ex-post sacrifice).

  *   **The Regulation/Vaccine Cases:** Everyone pays a small cost/takes a small risk. Everyone shares the benefit. The risk is pooled. Aggregation is permissible.
  *   **The Poor Town Case:** The country gets the benefit; the town gets the cancer cluster. This is **targeted sacrifice**. The town can "reasonably reject" (Scanlon) a principle that says "Poor communities are disposable for national efficiency." This violates distributive justice.
  *   **The Headache vs. Leg Case:** This depends on *how* the leg is lost.
      *   *Scenario A (Allocation):* We have a limited budget. We can either cure 1M headaches or prevent 1 leg loss. If we choose the headaches, we aren't *breaking* the leg; we are just failing to save it. Here, aggregation is usually acceptable (QALYs).
      *   *Scenario B (Imposition):* We must *break* this stranger's leg to release a chemical that stops 1M headaches. Here, aggregation is **not** acceptable. You cannot use the person as a means.

  **Which verdict to give up?**
  If the Headache-vs-Leg case is Scenario B (Imposition/Sacrifice), you must give up the verdict that the headaches win. You cannot sacrifice the one for the many if the harm is above a certain severity.
  If the Headache-vs-Leg case is Scenario A (Allocation/Rescue), you can keep it.

  The **Poor Town** verdict is the stronger of the two philosophically. It aligns with Civil Rights and Environmental Justice frameworks which argue that you cannot concentrate harms on vulnerable populations even for net social gain. If you hold firm on the Poor Town case (and you should), you must admit that in the Headache-vs-Leg case, if the leg loss is being *imposed* on the stranger to save the headaches, the stranger wins.

  ### Summary of the Refined Principle

  To make your "bones" match the philosophy, tweak your principle slightly:

  > "Aggregate risks and benefits freely **when they are distributed generally across the population** (regulations, vaccines). However, when a policy **concentrates a severe harm on a specific individual or group** (pollution, sacrifice), aggregation stops. Above a threshold of severity (torture, chronic pain, systemic ruin), the individual's right not to be sacrificed trumps the aggregated benefits of others."

  **What this changes:**
  1.  **Nausea vs. Chronic Pain:** You save the chronic pain victim. (Threshold trumps aggregation).
  2.  **Poor Town:** You save the town. (Targeted harm trumps aggregated benefit).
  3.  **Headache vs. Leg:**
      *   If it's a budget choice (Allocation): Save the 1M headaches.
      *   If it's a sacrifice (Imposition): Save the leg.
  4.  **Identified Miner:** You save the miner. (The claim of the identified person facing certain death is stronger than the statistical claim of the many facing reduced risk).

  This view is consistent, defensible, and respects both your 30 years of risk modeling (aggregation is useful for policy) and your retirement reading (persons are not just vessels for utility). You haven't lost your touch; you've just moved from risk *assessment* to risk *ethics*, and the models there require a ceiling.
