      *   **Constraint:** Answer in American English.

  2.  **Deconstruct the Verdicts & Tensions:**

      *   *Math:* Process is verifiable, intermediate steps constrain the search space, wrong steps lead to wrong answers usually. PBS prevents "shortcutting."
