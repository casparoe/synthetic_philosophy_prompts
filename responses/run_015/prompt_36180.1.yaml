      *Hypothesis:* The choice depends on whether the **optimal process is known and constrained** vs. **unknown and open-ended**, and whether the **outcome fully captures the value function**.

      Let's refine this into two competing principles.

      *   **Principle A: The Truth-Constraint Principle.** Use Process Supervision when the intermediate steps are *factually constrained* by reality (Math, Logic, Code Structure) and deviation implies error or technical debt.
      *   **Principle B: The Value-Completeness Principle.** Use Outcome Supervision when the outcome fully captures the value (Win/Loss in Go, Citation Support in Law) and the optimal path is either unknown or irrelevant.

