      *Refining the "Go" argument:* Why Outcome? Because "Win" is the global outcome and it's perfectly defined. Human process is a biased heuristic.

      *Refining the "Confabulation" argument:* If the CoT is a press release, Process Supervision becomes "Style Transfer on Lies." The principle suggests you cannot supervise what isn't causal. You have to enforce causality (e.g., via architecture or specific training objectives like "think then act" with stopping gradients).

  8.  **Final Polish:** Check against constraints. American English. No bloated single principle. Small set.

      *Self-Correction during drafting:* I initially thought about saying "Cost of Verification." But the user already noted that. I need to go deeper. The deeper reason Legal is Outcome isn't just cost, it's that the *legal validity* is the outcome. The *research path* doesn't matter legally. So it fits Value Completeness.
      *Wait, one nuance:* In Legal, if the model hallucinates a case, that's a process error that leads to an outcome error. But the user said "Outcome check only - did the cited cases actually support." That implies the verification *is* the outcome. Okay.

      *Let's formalize the principles:*
      1.  **The Latent Debt Principle:** Use Process Supervision when the Outcome metric fails to capture long-term costs or risks (Code, Safety).
      2.  **The Discovery Principle:** Use Outcome Supervision when the optimal path is unknown or when human priors on process limit performance (Go, Creative Writing).
      3.  **The Causality Constraint:** Process Supervision only works if the process tokens causally influence the output tokens.

      This looks solid. It addresses the "vibes" by giving them names.

      *Which verdict to drop?* The user's hesitation on the "Confabulated Reasoning" case. The principle says: If it's confabulated, Process Supervision is actively harmful (rewarding lying). You must drop the idea that you can simply "grade the chain" in that scenario. You need to fix the architecture first.

