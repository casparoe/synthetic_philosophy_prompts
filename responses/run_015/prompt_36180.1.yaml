      *The Interpretability/Press Release case:* If CoT is fake, PBS grades the lie. This suggests we need **Causal Process Supervision**. We need the process to actually *drive* the output.

  5.  **Synthesizing the "Small Set of Candidate Principles":**

      I need to offer the user something actionable. I'll propose two main principles that cover most cases, and a third "caveat" for the interpretability issue.

      *   **Principle 1: The "Ground Truth Availability" Heuristic.**
