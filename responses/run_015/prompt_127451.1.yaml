          *   *Verdict:* (2) is the outlier. It is the "hard line" that breaks the physicalist/PCS package.
      *   **Secondary Conflict:** (8) vs. (3).
          *   "Permanent" gap threatens the "fully realized by" claim in (3).
      *   **Methodological Friction:** (7) vs. (1).
          *   (1) says our phenomenological ontology is wrong. (7) says trust phenomenology. Needs nuance: Trust the *report*, not the *ontology*.

  6.  **Developing the Recommendations:**

      *   **Cheapest Fix:** Reinterpret (2). Change "not merely a new mode of presentation" to "a new mode of presentation that feels like a new fact due to the indexical nature." This aligns with (6).
      *   **Cost:** You lose the "Hard Problem" intuition that Mary actually touches a new metaphysical reality. You become a standard Phenomenal Concept Strategist.
      *   **Single Revision for Max Cleanup:** Drop the "not merely" clause in (2). Allow that the "new knowledge" *is* constituted by the acquisition of the indexical phenomenal concept (6). This resolves the Mary tension, eases the Explanatory Gap (8) (it's permanent because indexicals are primitive, not because facts are missing), and aligns with Physicalism (3).
      *   **Hidden Dependency:** The motivation for (7) (trust phenomenology) usually supports Qualia Realism, which (1) explicitly destroys. You are using phenomenological authority to support a view that denies the ontological validity of that phenomenology. You need to decouple "phenomenal presence" from "phenomenal ontology."

