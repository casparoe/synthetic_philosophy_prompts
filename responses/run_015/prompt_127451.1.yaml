      *   **Tension D: Thermostats & Indexicals (5, 6).**
          *   (5) Thermostats have no "what it is like" due to lack of functional organization.
          *   (6) Phenomenal concepts are indexicals ("here", "now").
          *   *Conflict:* Indexicals are generally available to any system with a perspective. If "red-like" is just an indexical framing of a state, why does a thermostat lack it? Is the "functional organization" in (5) doing heavy lifting that contradicts the "mere indexical" claim in (6)?
