      *   *The PCS Bridge:* (6) tries to bridge (1), (3), and (2). It says the "newness" is in the *concept*, not the *property*. But (2) says "not merely a new mode of presentation." This is a direct clash with standard PCS interpretations.
      *   *The Gap:* (8) admits a permanent epistemic gap. This aligns with (6) (indexicals create gaps) and (1) (intrinsic properties are incoherent). But does it align with (3)? Physicalism usually demands that in principle, the physical explains the mental. If the gap is *permanent*, is physicalism secure?
      *   *Methodology:* (7) is the wild card. It says trust phenomenology despite debunking. But (1) says phenomenology (qua qualia realism) is incoherent. (5) says phenomenology is restricted by function.

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension A: The Mary Problem (1, 2, 3, 6).**
