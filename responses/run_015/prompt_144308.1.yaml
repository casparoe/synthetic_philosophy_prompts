  ### Instructor Notes: Limitations of the Tree

  **1. Indistinguishable Views**
  *   **Dennett (Path B1) vs. Predictive Processing (Path B4):** This tree struggles to separate standard Dennettian fictionalism from softer Predictive Processing accounts. Both deny a Cartesian ego (Node 1: Disagree) and both treat the "self" as a model/story used for prediction. The distinction often collapses into terminology ("narrative" vs. "generative model") rather than ontological commitment.
