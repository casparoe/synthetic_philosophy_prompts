  **2. Structural Tensions**
  *   **The "Literal" Social Branch:** There is currently no robust view combining Social Recognition (Node 2, Option 3) with Literal State-Space Gravity (Node 3, Agree). This highlights a gap in the literature between normative social accounts and dynamical systems accounts.
  *   **Predictive Processing Realism:** Most Predictive Processing theorists would disagree with Node 1 (no inner entity), but some argue the *self-model* is ontologically real as a neural structure. This view sits uncomfortably between Branch A and Branch B.

  **3. Usage Tip**
