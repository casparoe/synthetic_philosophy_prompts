      *(Self-Correction on the Aggregation Question)*: Scanlon *does* have a mechanism for aggregation when harms are similar. He rejects it when harms are *dissimilar* (pain vs. death). So, if the Ebola case is Death vs. Death, Scanlon *allows* counting. Therefore, the case does *not* prove he needs a *new* mechanism, but it tests the boundary of "similar harms." However, the prompt asks if it shows the aggregation problem was "never the real bottleneck." I should argue that the real bottleneck is the *epistemic uncertainty* (do we know the vaccine works?) rather than the moral math of aggregation.

      *Wait, one nuance:* The "Delayed" group faces a *higher probability* of death than the "Immediate" group. The "Future" group faces a *probability* of death if the vaccine turns out to be useless without a trial.
      *Comparison:* Individual D (Delayed) says: "My risk increased by X%." Individual F (Future) says: "My risk remains at Y%."
      *Scanlon:* We compare the strongest individual complaint. If D's complaint is "I die," and F's complaint is "I die," and the harms are equivalent, we can look at numbers.
      *But:* D is *current* and *identifiable*. F is *future* and *statistical*. Scanlon prioritizes the specific burden.
      *Conclusion:* The tension is real. It suggests Contractualism struggles with *risk imposition* across time more than simple aggregation.

  9.  **Finalizing the Plan:**
