prompt: |-
  A colleague of mine, whom I'll call R., is at fifty percent risk for a late-onset neurodegenerative condition that currently has no treatment that alters its course. A definitive predictive test is available to her at no cost and with no medical risk beyond the blood draw. R. is forty-one and has one young child, and she has decided not to be tested: she says she would rather not spend the next twenty years organizing her life around a number. Two members of my department argued about whether that decision can be rational, and they asked me to referee. I could not. Here is the exchange as nearly as I can reconstruct it.

  (1) Nadia opened by saying the decision-theoretic literature has already settled the general question. Good's theorem on the value of information says that if evidence is free — nothing to acquire it, nothing to use it — then in expectation it cannot leave you worse off, provided you update on it and then choose whichever act maximizes expected utility relative to what you have learned. The reasoning is just that the expected value of a maximum is at least the maximum of an expected value: whatever act you would have picked in ignorance remains available after you learn, so doing the best you can with the news cannot be worse than sticking with that act. On Nadia's reading, R. must either be mistaken about the theorem's application or mistaken about her own reasons.

  (2) Owen said the theorem's assumptions are precisely what fail here. R. is not claiming she would be better off ignorant by the calculator's own lights; she is saying she does not trust herself to be the calculator. She expects that a positive result would put her into months of paralysis and despair in which she would make choices she now judges badly. Good's theorem is a theorem about an agent who re-optimizes correctly on her posterior. For an agent who foreseeably will not, free information can easily carry negative value, and someone who knows that about herself is reasoning well rather than badly.

  (3) Nadia replied that this is a confession rather than an objection. If R. expects to respond badly, the right response to that expectation is to correct the response, not to arrange the world to accommodate it — the way you hand your keys to a friend rather than deciding in advance never to find out how drunk you are. She added that the emotional cost of knowing is not outside the utility function either: write knowledge itself into the utilities, let the value of an outcome depend on whether you know it, and run the same inequality across the possible test results, and you still come out with expected utility no lower when you test. So on her account the theorem survives the very feature Owen was leaning on.

  (4) Owen said that move proves too much and thereby empties the theorem. Once utilities may depend on what the agent knows, any pattern of preferences over knowing and not knowing can be represented, so nothing is ruled out: the theorem reduces to the claim that an agent who maximizes expected utility, defined however one pleases, maximizes expected utility. The substantive question — whether knowing would be good for R. — lives entirely in the utility function, and the theorem contributes nothing to settling it.

  (5) Nadia said the theorem still has teeth, and that the teeth are somewhere Owen has not looked. What it excludes is a certain kind of justification. Preferring not to know cannot stand on its own; it must be cashed out either as a claim about R.'s utilities — in which case R. owes an account of why those utilities are what she says they are, and of why they are not simply a miscalibrated forecast of how she will actually feel — or as a claim about her own future misbehavior, in which case she has conceded that she expects to act irrationally and should manage that rather than feed it. Either way the choice is open to criticism, which was all she had been arguing.

  (6) Owen's final move was that Nadia had quietly changed the subject by changing the agent. The theorem compares two decision problems facing a single maximizer, but the woman who declines the test and the woman who receives the result are in the relevant sense different people, and it is the first one who must choose. If the earlier self has good evidence about the later one's values and competence, declining to put that later person in her situation is ordinary prudence — no different from refusing to sign an agreement you know you would regret honoring. He added that Nadia's appeal to faulty affective forecasting in (5) cuts both ways: if R. cannot trust her predictions of her own despair, she cannot trust her predictions of her own equanimity either, and the witness Nadia has impeached is the only one available.

  Neither of them would yield, and I have no view of my own to defend. Could you adjudicate this move by move? For each of the six numbered steps, say whether it is right, partly right, or mistaken, and explain why in a sentence or two rather than by restating the move. Two questions deserve explicit treatment: whether Nadia is correct in (3) that the inequality she invokes continues to hold once utilities are permitted to depend on what the agent has learned, and whether Owen's conclusion in (4) that this would render the theorem vacuous follows from it. Then tell me which of them is more right overall about R.'s decision, and — separately — identify anything of consequence that both of them left out of the argument, including anything about R.'s particular circumstances that neither of them brought to bear.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two colleagues (Nadia and Owen) regarding a third party's (R.) decision *not* to take a predictive genetic test for a late-onset neurodegenerative condition.
      *   **Format:** Evaluate each of the 6 numbered steps (Right, Partly Right, or Mistaken) with brief explanations. Explicitly address two specific questions (about utility dependence and vacuity). Determine who is "more right overall." Identify missing consequential arguments/factors.
      *   **Constraints:** Sentence or two per step explanation. No restating the move.
      *   **Context:** R. is 41, 50% risk, no treatment, one young child. She prefers not to "organize her life around a number." Nadia argues from Good's Theorem (information is always valuable). Owen argues from bounded rationality/psychological impact (information can be harmful).

  2.  **Deconstruct the Debate Steps:**

      *   **(1) Nadia's Opening (Good's Theorem):** Claims free information always has non-negative expected value for a Bayesian expected utility maximizer.
          *   *Analysis:* Technically correct regarding the theorem's standard formulation. However, it assumes the agent updates correctly and maximizes utility based *only* on state-dependent outcomes, not knowledge-dependent utilities yet.
          *   *Verdict:* Right (technically), but contextually limited.

      *   **(2) Owen's Objection (Bounded Rationality/Psychology):** Claims R. isn't a perfect calculator; knowing causes paralysis/despair leading to suboptimal choices.
          *   *Analysis:* This challenges the *assumptions* of Good's Theorem (perfect rationality/updating). If the agent isn't a perfect maximizer, the theorem doesn't apply.
          *   *Verdict:* Right. This is the standard critique of applying idealized decision theory to real humans.

      *   **(3) Nadia's Counter (State-Dependent Utility):** Claims we can just include "knowing" in the utility function. If you hate knowing, that's a cost. Even then, information value $\ge$ 0.
          *   *Analysis:* This is the crux. Does Good's Theorem hold if utility depends on the information state itself (e.g., $U(action, state, information)$)? Standard Good's Theorem assumes $U(action, state)$. If $U$ depends on the partition/knowledge, the "value of information" can indeed be negative. Wait, let's check the math.
          *   *Math Check:* Good's Theorem relies on $E[\max_a E[U(a, \omega) | I]] \ge \max_a E[U(a, \omega)]$. If $U$ depends on $I$ (the information partition), i.e., $U(a, \omega, I)$, then the comparison is between $E[U(a, \omega, I_{fine})]$ and $E[U(a, \omega, I_{coarse})]$. It is *not* guaranteed that finer information yields higher utility if the utility function penalizes the finer information directly (e.g., anxiety). The theorem assumes the utility of the *outcome* is what matters, not the *process* of knowing. If "knowing" is a disutility, it's treated as a cost of acquisition. But Nadia says "free." If the cost is internal (psychological), is it "free"?
          *   *Refinement:* If the disutility is part of the outcome state (e.g., "Living with knowledge of positive result"), then acquiring that state is part of the act. Good's theorem says you shouldn't pay *more* for info than its value. If the info *itself* creates negative utility states, the *net* value can be negative. Nadia claims the inequality still holds. This is mathematically dubious if the utility function changes based on the partition.
          *   *Verdict:* Mistaken (or at least highly controversial/mathematically shaky in this context). If utility depends on the information state, the "value of information" can be negative.

      *   **(4) Owen's Counter (Vacuity):** Claims that allowing utility to depend on knowledge makes the theorem tautological ("maximizers maximize").
          *   *Analysis:* If you can define utility however you want to fit the behavior, the theory loses predictive power. It becomes a description, not a prescription.
          *   *Verdict:* Right. This is a standard critique of "revealed preference" tautologies.

      *   **(5) Nadia's Rejoinder (Normative Force):** Claims the theorem still rules out *justifications*. You must justify the utility function or admit irrationality.
          *   *Analysis:* She shifts from descriptive/predictive to normative. She's saying "You can't just say 'I don't want to know,' you need a reason."
          *   *Verdict:* Partly Right. It preserves normative bite but concedes the descriptive failure.

      *   **(6) Owen's Final (Identity/Self-Binding):** Claims the "self" changes over time. The current self is protecting the future self.
          *   *Analysis:* This invokes intertemporal choice and personal identity (Parfit-style). If the future self is compromised, the current self acting as a guardian is rational.
          *   *Verdict:* Right. This addresses the dynamic inconsistency problem.

  3.  **Address Specific Questions:**
      *   *Q1: Is Nadia correct in (3) that the inequality holds if utilities depend on knowledge?*
          *   *Answer:* No. Good's Theorem assumes the utility function is defined over world states and actions, not over the agent's information partition. If the agent derives disutility directly from the state of "knowing" (distinct from the state of the world), the expected utility of acquiring information can be strictly less than remaining ignorant. The mathematical proof relies on the ability to ignore the information if it's not useful; it does not allow for the information itself to degrade the utility of the resulting outcome states.
      *   *Q2: Does Owen's conclusion in (4) that this renders the theorem vacuous follow?*
          *   *Answer:* Yes, largely. If any preference for ignorance can be modeled simply by adjusting the utility function to penalize "knowledge states," the theorem no longer prescribes *whether* one should seek information; it merely confirms that the agent is maximizing their specific (perhaps idiosyncratic) utility function. It loses its normative force regarding the value of information itself.

  4.  **Overall Adjudication:**
      *   Who is more right? Owen. Nadia applies an idealized theorem to a non-ideal agent without adequately addressing the psychological costs as *constraints* rather than *utilities*. Owen correctly identifies that human rationality is bounded and that "protective ignorance" is a recognized rational strategy for non-ideal agents.
      *   What was missed?
          *   *Family Implications:* R. has a young child. The test result informs the child's risk (50% of 50% = 25%). This introduces a duty to others, not just self-utility.
          *   *Insurance/Employment:* Even if the test is medically free, are there legal protections (GINA in US?) against discrimination?
          *   *Reproductive Choice:* At 41, is reproductive planning still relevant? (Probably less so, but worth noting).
          *   *The "Organizing Life" argument:* R.'s specific reason isn't just despair; it's about *authenticity* or *temporal focus*. Living in the shadow of a future event vs. living in the present.

  5.  **Drafting the Response (Iterative refinement for constraints):**

      *   *Step 1:* Right. Good's Theorem mathematically guarantees non-negative value for costless information for a perfect Bayesian updater.
      *   *Step 2:* Right. The theorem presupposes ideal rationality, whereas R. anticipates a psychological reaction that degrades her decision-making capacity.
      *   *Step 3:* Mistaken. If utility depends on the information partition itself (e.g., anxiety from knowing), the mathematical inequality fails because the "outcome" includes the psychological burden of the knowledge.
      *   *Step 4:* Right. If the utility function can be arbitrarily adjusted to fit any choice, the theorem ceases to offer normative guidance on whether information is objectively valuable.
      *   *Step 5:* Partly Right. While the theorem loses descriptive power, it retains normative force by demanding coherence between stated values and actions, though it mischaracterizes ignorance as a preference rather than a constraint.
      *   *Step 6:* Right. Intertemporal disunity is a valid model for addiction or psychological vulnerability, making pre-commitment to ignorance a rational strategy for the earlier self.

      *   *Specific Q1:* Nadia is incorrect; the proof requires utilities to depend only on states and actions, not on the agent's epistemic state, so knowledge-dependent disutility breaks the inequality.
      *   *Specific Q2:* Owen is correct; if the utility function absorbs all reasons for avoiding information, the theorem merely describes consistency rather than prescribing the rationality of seeking truth.

      *   *Overall:* Owen is more right because he accounts for the psychological reality of the agent, whereas Nadia applies an idealized model that assumes away the very problem R. faces.
      *   *Missing:* The impact on R.'s child (who inherits risk), potential insurance/employment discrimination risks despite "no medical risk," and the ethical distinction between self-regarding and other-regarding duties.

  6.  **Review against Constraints:**
      *   "Sentence or two rather than by restating the move." -> Need to be concise.
      *   "Right, partly right, or mistaken." -> Use these labels.
      *   "Explicit treatment" of the two questions. -> Ensure they stand out.
      *   "Which of them is more right overall." -> Clear statement.
      *   "Identify anything of consequence that both of them left out." -> Clear section.

  7.  **Final Polish:** Check tone (adjudicatory, philosophical). Ensure the distinction between *normative* (what should be) and *descriptive* (what is) is clear in the evaluation of Nadia's claims. Ensure the math on Good's Theorem is accurate (it assumes $U(a, s)$, not $U(a, s, K)$).

      *Self-Correction on Step 3:* Is it *mistaken* or *partly right*? Technically, you *can* model "knowing" as a state of the world. But if you do that, the "information" isn't just revealing the state, it's *changing* the state (from ignorant to knowing). Good's theorem assumes information reveals the state, it doesn't change the utility of the state itself independent of action. If "Knowing X" is a worse state than "Not Knowing X" regardless of action, then acquiring that information is acquiring a worse state. Nadia says the inequality *still holds*. That is mathematically false if the utility of the state changes upon measurement. So "Mistaken" is the stronger, more accurate label.

      *Self-Correction on Step 5:* Nadia says the choice is open to criticism. Is that right? Yes, rationality is always open to scrutiny. But her basis (the theorem) is shaky here. So "Partly Right" fits best.

      *Missing Factors:* The child is the big one. The test result has implications for the child's future testing and life planning. Also, the "no treatment" aspect is crucial—if there were treatment, the cost of ignorance is higher. Since there isn't, the value of information is purely instrumental for life planning, which supports R.'s view.

      *Refining the "Overall" verdict:* Nadia represents classical decision theory. Owen represents behavioral/normative reality. In a philosophy context, Owen's argument about bounded rationality and self-binding is generally accepted as the rebuttal to strict Good's Theorem applications in psychology. Owen wins.

      *Refining the "Missing" section:*
      1.  **Third-party impact:** The child's genetic risk.
      2.  **Societal/Legal context:** Insurance discrimination (even if test is free, results might not be private).
      3.  **Nature of the "cost":** R. mentions "organizing life around a number." This is about *meaning*, not just utility maximization. It's an existential stance, not just a calculation error.

      Let's assemble the text.

      *Step 1:* Right. Good's Theorem mathematically demonstrates that for a perfect Bayesian agent, costless evidence cannot reduce expected utility.
      *Step 2:* Right. Real agents often deviate from ideal rationality, and anticipated psychological harm can legitimately make information instrumentally disvaluable.
      *Step 3:* Mistaken. The theorem's proof relies on utilities depending only on world states and actions, so introducing knowledge-dependent utility breaks the inequality.
      *Step 4:* Right. If the utility function is flexible enough to encode any aversion to knowledge, the theorem becomes a tautology that cannot distinguish rational from irrational information avoidance.
      *Step 5:* Partly Right. While the theorem loses mathematical force here, it correctly highlights that rational agents should strive for coherence between their values and their information-seeking behavior.
      *Step 6:* Right. Modeling the agent as a sequence of temporal selves validates pre-commitment strategies, including ignorance, to protect future well-being.

      *Specific Q1:* Nadia is incorrect because Good's inequality assumes the utility of an outcome is invariant to whether the agent knows the state, whereas R.'s distress makes the "known" state intrinsically worse.
      *Specific Q2:* Owen is correct because if the utility function is adjusted post-hoc to explain the avoidance of information, the theorem offers no independent standard to judge the rationality of that avoidance.

      *Overall:* Owen is more right because he addresses the psychological and temporal realities of human agency that Nadia's idealized model ignores.
      *Missing:* The implications for R.'s child (who shares genetic risk), potential non-medical costs like insurance discrimination, and the existential value of "present-focused" living distinct from utility maximization.

      *Wait, check Step 3 again.* Some decision theorists argue you *can* fold "knowledge" into the state description. If you do that, does Good's theorem hold? If the state includes "I know I have the gene," then the act of testing moves you from State A (Ignorant, Gene+) to State B (Knowing, Gene+). If U(B) < U(A), then the act of testing has negative utility. Good's theorem compares $E[\max U | Info]$ vs $\max E[U]$. If the Info changes the U function or the State definition such that the "Ignorant" option is no longer available *after* testing, the theorem's condition that "whatever act you would have picked in ignorance remains available" is violated. You can't "pick ignorance" after you know. So Nadia is definitely mistaken.

      *Final check on constraints:* "Sentence or two." Keep it tight.

      *Missing:* Make sure to emphasize the child. That's a huge ethical oversight in their debate.

      *Ready to write.*
answer: |-
  (1) **Right.** Good's Theorem mathematically demonstrates that for a perfect Bayesian agent, costless evidence cannot reduce expected utility because the agent can always choose to ignore it.

  (2) **Right.** The theorem presupposes ideal rationality, whereas R. anticipates a psychological reaction that degrades her decision-making capacity, making ignorance instrumentally valuable.

  (3) **Mistaken.** The theorem's proof relies on utilities depending only on world states and actions, so introducing knowledge-dependent utility breaks the inequality because the "ignorant" option is no longer available after testing.

  (4) **Right.** If the utility function is flexible enough to encode any aversion to knowledge, the theorem becomes a tautology that cannot distinguish rational from irrational information avoidance.

  (5) **Partly Right.** While the theorem loses mathematical force here, it correctly highlights that rational agents should strive for coherence between their values and their information-seeking behavior.

  (6) **Right.** Modeling the agent as a sequence of temporal selves validates pre-commitment strategies, including ignorance, to protect future well-being.

  **Specific Questions**
  Regarding Nadia's claim in (3): She is incorrect because Good's inequality assumes the utility of an outcome is invariant to whether the agent knows the state, whereas R.'s distress makes the "known" state intrinsically worse than the "unknown" state. Regarding Owen's conclusion in (4): He is correct because if the utility function is adjusted *post-hoc* to explain the avoidance of information, the theorem offers no independent standard to judge the rationality of that avoidance.

  **Overall Adjudication**
  Owen is more right overall because he addresses the psychological and temporal realities of human agency that Nadia's idealized model ignores. Nadia applies a normative theorem designed for ideal calculators to a human being whose rationality is bounded by emotional vulnerability; Owen correctly identifies that protecting one's future self from foreseeable psychological harm is a form of prudence, not irrationality.

  **Missing Considerations**
  Both colleagues omitted the **implications for R.'s child**, who inherits a 25% risk; R.'s decision affects not only her own utility but her child's future right to know or not know their genetic status. They also neglected **non-medical costs**, such as potential insurance or employment discrimination if the result enters a medical record, which would make the test not truly "cost-free." Finally, they missed the **existential dimension** of R.'s claim: her desire not to "organize life around a number" is a stance on authenticity and temporal focus, not merely a miscalculation of utility.
