  **CITY OF HALVARD**
  **BUREAU OF HISTORICAL SERVICES**
  **TEN-YEAR STRATEGIC PLAN AND BUDGET REQUEST (FY25–FY35)**

  **TO:** City Council Appropriations Committee
  **FROM:** Director, Bureau of Historical Services
  **DATE:** October 14, 2024
  **SUBJECT:** Operationalizing Continuity for Vitality

  **1. Executive Summary**
  The Bureau requests $14.2M to maintain the city's plastic power—the capacity to absorb the past without being crushed by it. Our mandate is to supply history only insofar as it serves life. To this end, operations are divided into three modalities: Monumental (Inspiration), Antiquarian (Preservation), and Critical (Judgment), supported by a fourth unit managing necessary omission.

  **2. Divisional Objectives**

  **2.1 Monumental History Division**
  *Mission:* To extract exemplary moments from the past to motivate current action.
  *Performance Indicators:* Number of civic emulations per quarter; "Greatness Citation" density in public speeches.
  *Recent Achievements:* Unveiled the Statue of Founder Halvard (1894).
  *Policy Conflict:* The statutory **Interval Rule** mandates forty years must pass before a subject may be monumentalized. Division leadership proposes a **Provisional Monumentalization** loophole for living Founders to capitalize on current enthusiasm.¹
  *Risk:* Living citizens recruited to reenact dead excellence are quietly demoted by comparison, reducing morale.

  **2.2 Antiquarian History Division**
  *Mission:* To preserve the conditions of one's own existence with equal reverence.
  *Performance Indicators:* Retention Rate (Target: 100%); Square Footage of Archival Storage.
  *Recent Achievements:* Successfully archived all internal meeting minutes from 1974–2024, including drafts of this plan.
  *Constraint:* The Equal-Reverence Rule prohibits discarding any artifact, regardless of utility. Current storage capacity is at 104%.²

  **2.3 Critical History Division**
  *Mission:* To prosecute the past when it becomes a tyrant over the present.
  *Performance Indicators:* Number of past injustices formally indicted; Statutes repealed.
  *Recent Achievements:* Audited the Monumental Division's selection criteria for bias; Audited the Antiquarian Division's hoarding practices.
  *Constraint:* Division has recently initiated a self-audit to determine if its own existence constitutes an injustice.³

  **2.4 Latency Office (Sanctioned Forgetting)**
  *Mission:* To schedule and manage active forgetting.
  *Status:* Proposed for defunding.
  *Justification:* The Office cannot report on its activities without defeating the point of them. Furthermore, visible forgetting creates anxiety. As noted by external contractors, "To admit you are forgetting is to remember."⁴

  **3. Budget Request**

  | Division | FY24 Actual | FY25 Request | % Change | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | Monumental | $4.5M | $6.2M | +37% | Includes Provisional Monumentalization pilot. |
  | Antiquarian | $3.8M | $4.1M | +7% | Emergency off-site storage lease required. |
  | Critical | $2.1M | $2.5M | +19% | Legal fees for past prosecution increasing. |
  | Latency Office | $0.8M | $0.0M | -100% | Functions absorbed by general neglect. |
  | **Total** | **$11.2M** | **$12.8M** | **+14%** | |

  **4. Conclusion**
  Approval of this plan ensures Halvard remains master of its history rather than its servant. We urge the Council to prioritize the Monumental Division's loophole to secure legacy funding while enthusiasm is high.

  ***

  **Footnotes**
  1. Lethe & Co. Heritage Consultancy advises that "premature monumentalization freezes the subject before their utility is determined."
  2. Storage crisis now includes boxes labeled "Boxes."
  3. Self-audit pending indefinitely due to conflict of interest.
  4. Lethe & Co. Quarterly Review, Vol 4.

  **Appendix A: Risk Register (Success = Failure Conditions)**

  | Risk ID | Condition | Impact | Mitigation |
  | :--- | :--- | :--- | :--- |
  | **HIST-01** | Monumental Division successfully inspires citizens to match ancestors. | Citizens feel inadequate; birth rates decline. | Lower standards for greatness. |
  | **HIST-02** | Antiquarian Division achieves 100% retention. | City becomes uninhabitable storage unit; life ceases. | **None Planned.** |
  | **HIST-03** | Critical Division successfully indicts all past errors. | No foundation remains for current laws; anarchy. | Pause indictments during election cycles. |
  | **HIST-04** | Latency Office eliminated. | City remembers everything; plastic power exceeds limit; culture hardens. | **None Planned.** |
