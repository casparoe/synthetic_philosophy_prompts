      *   *Friend's specific claim:* "if the initial score is calibrated, the theorem forces the average final score of reassessed applicants to differ between groups".
      *   *Why this is wrong:* The initial score $S$ being calibrated tells us about $P(Y|S, A)$. It implies that within the middle band, the default rates might differ between groups (if overall base rates differ). Let $p_A = P(Y=1 | S \in M, A)$ and $p_B = P(Y=1 | S \in M, B)$. If $S$ is calibrated and base rates differ, usually $p_A \neq p_B$.
