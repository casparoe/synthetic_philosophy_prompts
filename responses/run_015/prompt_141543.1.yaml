answer: |-
  Here are ten questions designed to move past exegesis and into the structural vulnerabilities of the view. They are phrased in the meta-ethical vocabulary typical of ideal-advisor theories (e.g., Smith, Velleman, Rosati). The even-numbered questions are conditional follow-ups based on the standard defenses she is likely to offer.

  1.  **The Sequence of Counterfactuals:**
      "Let's look at the construction of the idealized counterfactual. Consider an agent whose actual psychology is such that learning a specific truth—for example, that their partner is unfaithful—would trigger a depressive episode that undermines their instrumental rationality. If we idealize by adding information *before* securing coherence, their advisor might recommend avoiding the truth to preserve functioning. If we secure coherence *before* adding information, the advisor might recommend seeking the truth. Does the order in which we apply these idealizing conditions alter the extension of the reasons generated?"

  2.  **Follow-up (If she claims idealization is holistic/simultaneous):**
      "If you maintain that information and coherence are applied 'all at once' to avoid order effects, how do you guarantee the uniqueness of the resulting ideal state? Without a specified sequence, aren't there multiple stable equilibrium points the agent could land in, each yielding different advice, which makes the account indeterminate?"

  3.  **Diachronic Stability (The Handoff):**
      "I want to press on the diachronic relationship between the agent and their idealized counterpart. Suppose my ideal advisor recommends I take a pill that fundamentally alters my values to make me happier. Once I take the pill, my *new* ideal advisor would advise me never to have taken it. Which advisor supplies the normative reason at the time of decision? Is the authority of the reason grounded in the advisor who exists counterfactually now, or the one who would exist after the action?"

  4.  **Follow-up (If she claims reasons are time-indexed):**
      "If reasons are strictly time-indexed to the agent's current idealized self, do we lose the resources to criticize the future self's regret? If the future self's reasons are authoritative for *them*, but their judgment contradicts the reasons that were authoritative for *me*, does the view imply there is no normative mistake made, only a shift in perspective?"

  5.  **Epistemic Closure (The Insulated Agent):**
      "Consider an agent with a 'closed' motivational set, such as a dogmatist who treats any evidence against their core belief as a test of faith to be rejected. On your view, the fully informed version of this agent must process information. But if their actual motivational set screens off counterevidence, does the 'fully informed' counterfactual ever get off the ground, or does the idealization procedure fail to locate a coherent successor?"

  6.  **Follow-up (If she claims insulation is a deliberative defect):**
      "If you reply that such insulation is itself a deliberative defect that must be idealized away, aren't you smuggling in a substantive standard of rationality independent of the agent's subjective set? How do you justify that standard without collapsing into a form of objectivism about what counts as a 'defect'?"

  7.  **Extensional Equivalence (Convergence):**
      "Moving to the meta-ethical implications: if the idealization conditions are robust enough, do the advisors of all agents converge on the same advice? If they do converge, isn't your view extensionally equivalent to objectivism, making the reference to the agent's subjective starting point explanatorily idle?"

  8.  **Extensional Equivalence (Divergence):**
      "Conversely, if the advisors do *not* converge because they depend on the agent's actual subjective set, does the view avoid collapsing into a sophisticated subjectivism? If two agents with different starting points receive contradictory ideal advice, are they both equally correct about what they have reason to do, even if their actions conflict?"

  9.  **Falsifiability:**
      "Given that the ideal advisor is a counterfactual construct rather than an observable entity, what would count as conceptual or empirical evidence against your account? Is there a specific case where your intuition about what the agent has reason to do diverges from what the ideal advisor would say, which would force you to reject the view?"

  10. **The Advice Metaphor:**
      "Finally, you emphasize that this is an indirect account—it's not a model for actual deliberation. If the ideal advisor's verdict isn't meant to guide the agent's thinking or motivate them directly, what theoretical work is the 'advice' relation doing? Why not simply define reasons in terms of the ideal outcome itself, rather than the counterfactual speech act of a successor self?"
