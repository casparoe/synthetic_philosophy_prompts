answer: |-
  In the late Bronze Age valley of Oros, the *Epic of Halion* recounts how King Halion led a mass exodus of the hill-tribes to the coastal plain, culminating in the burning of the city of Keth. Archaeological excavation at Keth reveals a singular destruction layer containing ash and weapon fragments consistent with a sack, yet equally compatible with a seismic fire given the region's tectonic history. The sole literary testimony is the *Epic of Halion*, composed centuries later, which details Halion's reign and the migration. Complicating this is the "Granary Ostraca," a bureaucratic archive of grain receipts found in a separate administrative district; one fragmentary receipt lists a tribute payment from "Halion's Hold" but is stratigraphically sealed within a layer dated one hundred and fifty years prior to the *Epic's* timeline, suggesting the name refers to a place or title rather than the specific migratory leader described in the poem.

  The Minimalist historian concludes the event is **legend**, accepting the claim that Halion led the migration only if corroborated by two independent source-types without contradiction. Their method requires the non-literary source to confirm the specific claim of the migration at the specific time; the destruction layer fails because it is ambiguous regarding agency, and the Granary Ostraca fails because its chronological data contradicts the literary timeline. The Coherentist historian concludes the event is **probable history**, accepting the claim based on the narrative's internal consistency with verified geopolitical conditions and the ambiguous material traces. Their method allows for a single contradictory fragment if the overall web of evidence holds; they argue the Ostraca proves the name "Halion" was historical, and the destruction layer fits the narrative climax, rendering the date discrepancy a manageable oral transmission error. The structural feature doing the work is the **intercalated witness** (the Granary Ostraca), which provides the necessary non-literary link for the Minimalist but introduces the fatal contradiction, while the Coherentist absorbs the contradiction as noise within a coherent signal.

  If the intercalated witness is removed entirely, the verdicts **do not converge**. The Minimalist still classifies the event as **legend** because the remaining material traces (the destruction layer) do not independently corroborate the specific claim of Halion's leadership, leaving only one valid source-type. The Coherentist still classifies the event as **probable history** because the narrative coherence with the ambiguous destruction layer remains sufficient for promotion without the contradictory fragment.

  **Minimalist:** You are conflating compatibility with confirmation. Just because the destruction layer *could* be the war described in the poem does not mean it *was*, and without a non-literary source confirming the leader and the event simultaneously, you are building history on poetry. Accepting a narrative simply because it fits the ruins invites any story to become history if the ruins are vague enough.

  **Coherentist:** History is not a checklist of matching tags but a reconstruction of the most plausible past. The poem fits the geopolitical reality, the destruction fits the poem's climax, and the name exists in records even if the date is garbled. Dismissing this because one receipt is misdated ignores how oral tradition actually works; you demand a precision from ancient evidence that it cannot possibly provide, leaving you with silence instead of understanding.
