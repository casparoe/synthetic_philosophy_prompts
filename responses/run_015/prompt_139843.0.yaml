answer: |-
  Kripke's rigidity-to-necessity argument holds that if names are rigid designators (picking out the same object in every possible world), then true identity statements between them must be necessarily true, even if known only a posteriori.

  1.  **The Arbitrariness Objection:** Frege considers the view that $a=b$ asserts a relation between signs rather than objects. He rejects this because the connection between a sign and its designate is arbitrary. If "Morning Star = Evening Star" merely meant "the sign 'Morning Star' is associated with the same object as the sign 'Evening Star'," this would be a trivial fact about linguistic convention, not a substantive fact about the cosmos. We could have swapped the names without changing the astronomy. Since the discovery is valuable and non-arbitrary, the relation cannot be merely between signs. This pushes him toward *Sense* because he needs an intermediate layer that isn't the object itself (since $a=b$ differs cognitively from $a=a$) nor the sign itself (since the discovery isn't about vocabulary). Sense provides a non-arbitrary "mode of presentation" that determines reference, allowing $a=b$ to express a substantive discovery about how two different modes pick out one object.

  2.  **Contingency vs. A Priori:** Your friend is more right, though both of you are projecting Kripkean categories onto Frege. The text distinguishes epistemic status (a priori vs. a posteriori), not modal status (necessary vs. contingent). Frege labels $a=a$ analytic and a priori, while $a=b$ offers extensions of knowledge and is not always a priori. He never explicitly claims $a=b$ is contingent. However, he lacks the modern logical apparatus to separate analyticity from necessity. For Frege, "analytic" roughly covers what Kripke calls "necessary a priori," and "synthetic" covers "contingent." By treating $a=b$ as a valuable extension of knowledge (synthetic), he likely conflates epistemic surprise with metaphysical contingency. You are less wrong to deny he explicitly argues for contingency, but the text doesn't support the necessary a posteriori distinction because that distinction didn't exist for him yet. The passage commits him to $a=b$ being informative, not necessarily contingent.

  3.  **The Rising Sun:** The example functions as an identity claim between time-indexed descriptions ("the sun rising today" = "the sun rising yesterday"). While not proper names, they serve the same logical function for Frege: two modes of presentation picking out one object. The argument retains its teeth because the cognitive value difference persists regardless of grammatical category. The point is that recognizing identity under different descriptions expands knowledge, which wouldn't happen if identity were merely self-relation. The shape of the example doesn't weaken the motivation for Sense; it broadens it beyond proper names to show that any sign carrying a mode of presentation generates the puzzle.

  4.  **The Imba River:** You are right; the friend is wrong. Kripke's argument depends on semantic rules governing counterfactuals, not actual-world stability. If "Imba" is defined by a rule that shifts reference to whatever flows past the stone, it acts as a non-rigid designator (a disguised description). In a possible world where the river shifts, "Imba" refers to the new river, making "Imba = [Actual River]" false. The fact that the rule never fires in actuality is irrelevant to modal profile; necessity is about truth in all possible worlds, not just the actual one. The disagreement bottoms out in whether rigidity is a matter of actual reference (friend's view) or counterfactual fixing (your view). Kripke demands the latter. A name that tracks a description across worlds is non-rigid, rendering the identity contingent, regardless of whether the description is satisfied by the same object in the actual world.

  **Confidence:** 85%
  **Least Bet-Worthy Claim:** The claim in section 2 that Frege conflates epistemic surprise with metaphysical contingency; attributing modal confusion to him is interpretively contentious since he lacked the vocabulary to distinguish them.
