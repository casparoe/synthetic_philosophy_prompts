answer: |-
  This is a fantastic pedagogical approach. It shifts the cognitive load from *memorizing definitions* to *experiencing the friction* of applying them. By forcing commitment (scoring) and public defense (Round 2), you prevent the usual "well, it depends" shrug until the very end.

  Here is the full design for **The Taxonomic Tribunal**.

  ---

  # Seminar Plan: The Taxonomic Tribunal
  **Topic:** The Metaphysics of Natural Kinds (The Species Problem)
  **Time:** 90 Minutes
  **Participants:** 12 Grad Students (3 Groups of 4)
  **Goal:** Experience the failure of categorization before theorizing it.

  ## I. Game Mechanics & Rules (Handout)

  **The Setup:**
  You are a Taxonomic Tribunal. Your goal is to stabilize reality by assigning organisms to **Species Boxes**.
  *   **Group A:** Morphological Essentialists (Focus: Phenotype, Structure, Type Specimens).
  *   **Group B:** Biological Species Concept (Focus: Reproductive Isolation, Gene Flow).
  *   **Group C:** Phylogenetic Lineage (Focus: Common Ancestry, Monophyly, Clades).

  **The Materials:**
  *   16 Case Cards (Mixed standard and synthetic).
  *   3 Species Boxes (labeled S1, S2, S3...).
  *   1 "Liminal/Exile" Pile (For cases that cannot be categorized).

  **The Scoring (Write on Board):**
  *   **+2 Points:** Unanimous in-group agreement on a Species Box assignment.
  *   **-1 Point:** Every card placed in the Liminal/Exile Pile. (Exiling is costly; you must try to categorize).
  *   **+1 Point:** Cross-Group Agreement. (If Group A and Group B put Card 5 in the *same* Species Box, both get +1).
  *   **0 Points:** Disagreement within the group (you must reach consensus to submit).

  **The Rounds:**
  1.  **Round 1 (Silent Sort):** 20 Mins. No talking to other groups. Sort all 16 cards.
  2.  **Round 2 (The Defense):** 20 Mins. Groups present their *Exile Pile* only. You must justify why these broke your framework. Other groups listen.
  3.  **Round 3 (The Tribunal):** 25 Mins. Open floor. Groups can trade cards or challenge assignments to maximize cross-group points.
  4.  **Debrief:** 25 Mins.

  ---

  ## II. The Case Cards (Logic & Descriptions)

  *Print these on cardstock. Do not label them with their "problem type."*

  **The Standard Edge Cases (Cards 1–11)**
  1.  **The Dog/Wolf Complex:** Can interbreed, fertile offspring, distinct morphologies, distinct ecological niches.
  2.  **Ring Species (Ensatina):** Population A breeds with B, B with C... Y does not breed with Z. A and Z look different.
  3.  **The Mule:** Horse + Donkey parents. Viable adult, sterile offspring.
  4.  **Asexual Whiptail Lizard:** All female. Clonal reproduction. No gene flow. Distinct morphologies.
  5.  **Cryptic Genomics:** Two populations look identical morphologically. Genomics show 10% divergence, no gene flow for 5M years.
  6.  **The Fossil:** A skull in rock. No DNA. No behavior. Clear morphology.
  7.  **Hybrid Zone:** Two distinct populations meet. 20% of offspring are hybrids, fertile, but selected against.
  8.  **Polyploidy Event:** A plant spontaneously doubles chromosomes. Cannot breed with parents. Instant "new" form.
  9.  **Bacteria (HGT):** Horizontal Gene Transfer is rampant. Lineages are nets, not trees.
  10. **The Subspecies:** Distinct local variation, but continuous gene flow across the range.
  11. **Time-Slice Ancestor:** A population ancestral to two modern species. Is it Species A, Species B, or its own?

  **The Synthetic Stress-Tests (Cards 12–15)**
  12. **The Chimera:** An organism built via cross-kingdom HGT (Fungi/Plant/Animal DNA). It reproduces clonally. It accumulates mutations. It has no "parents" in a traditional sense.
  13. **The Digital Organism:** Self-replicating code in a server. Mutates. Competes for memory. "Dies" if deleted. No cells, no chemistry.
  14. **The Obligate Symbiote:** A coral and its algae. They share a genome (via integration), reproduce as a unit, and die if separated. One nucleus or two?
  15. **The De-Extinct Surrogate:** Mammoth genome edited into an Elephant egg. Born alive. Morphologically Mammoth. Genomically Hybrid. Mother is Elephant.

  **The Wildcard (Card 16)**
  16. **The Virus:** Replicates. Evolves. No metabolism. No cell. Requires host machinery to "reproduce."

  ---

  ## III. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Instructor Action |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Hand out packets. Explain rules. **Emphasize:** "Exiling costs points. You are incentivized to force a fit." Assign Groups A, B, C. |
  | **10-30** | **Round 1** | **Silent Sort.** Circulate. If a group is stuck on Card 1, tell them: "Move on. Come back later." Ensure they are using *only* their assigned framework. |
  | **30-50** | **Round 2** | **The Defense.** Each group has 5 mins to present their *Exile Pile*. Why did these break your rules? Other groups take notes (for Round 3). |
  | **50-75** | **Round 3** | **The Tribunal.** Open negotiation. Groups can propose trades to align categories for +1 points. *Crucial:* Allow them to realize Card 12-16 might be impossible to align. |
  | **75-90** | **Debrief** | Stop the game. Tally scores (roughly). Move to metaphysical mapping (see below). |

  ---

  ## IV. The Debrief: Mapping Friction to Metaphysics

  Do not lecture. Ask questions that map their frustration to the literature.

  **1. The Growing Exile Pile (Eliminativism)**
  *   *Ask:* "Group B (BSC), how many cards did you exile? Card 4 (Asexuals)? Card 6 (Fossils)?"
  *   *Point:* If your definition excludes actual biological reality (asexuals, fossils), is the definition wrong, or is the concept of 'species' wrong?
  *   *Map:* **John Dupré (Promiscuous Realism)** or **Berit Brogaard**. If the categories don't carve nature at its joints, maybe there are no joints. The exile pile represents the failure of monism.

  **2. The Cross-Group Conflict (Pluralism)**
  *   *Ask:* "Did any group agree on Card 1 (Dog/Wolf)? Why did Group A say 'One' and Group B say 'Two'?"
  *   *Point:* You were all looking at the same object but saw different boundaries based on your *interests* (structure vs. reproduction).
  *   *Map:* **Philip Kitcher (Pluralistic Realism)**. Species are real, but there is no *single* correct way to slice them. The "correct" slice depends on the explanatory goal.

  **3. The Synthetic Cases (Individuality Thesis)**
  *   *Ask:* "Card 12 (Chimera) and 13 (Digital). Group C (Phylogeny), did you exile these? Why?"
  *   *Point:* If a Digital Organism evolves but has no DNA, is it a lineage? If a Chimera has no single ancestor, is it a clade?
  *   *Map:* **David Hull (Species as Individuals)**. Species aren't kinds (classes); they are historical individuals. If there is no spatiotemporal continuity (Digital) or single lineage (Chimera), the concept dissolves. This tests the limits of "Life" vs. "Natural Kind."

  **4. The Scoring Incentive (Pragmatism)**
  *   *Ask:* "Did anyone change their mind in Round 3 just to get points?"
  *   *Point:* Taxonomy is often a social negotiation, not just a discovery.
  *   *Map:* **Ian Hacking (Interactive Kinds)** or **Pragmatic Constructivism**. The stabilization of the category is partly due to the *need* to stabilize it (the points), not just the biology.

  ---

  ## V. Honest Limitations (The "Meta" Note)

  *Include this in your opening or closing remarks to maintain philosophical rigor.*

  "This game simulates **synchronic** disagreement (all of us looking at the cases at once). It cannot reproduce:
  1.  **Diachronic Revision:** Real taxonomy happens over decades. You might have changed your mind on Card 5 if you had 10 years of new data.
  2.  **Stakeholder Power:** In the real world, the group with the funding or the museum collection gets to name the species. Here, all groups have equal voice.
  3.  **Pragmatic 'Good Enough':** Biologists often ignore the species problem to get fieldwork done. In this game, the problem *is* the work. You felt the paralysis; real biologists often bypass it."

  ---

  ## VI. Prediction: What Will Go Wrong (First Run)

  You predicted they will game the points by exiling ambiguous cases. Here is the nuanced reality:

  **1. The "Exile Hedge" Strategy**
  *   *Risk:* Students realize -1 is better than the time cost of arguing for a +2. They dump Cards 2, 5, 7, 9, 12, 13, 15, 16 into Exile immediately.
  *   *Counter-Measure:* During Round 2 (Defense), require that **every Exiled card must have a written justification** citing the specific rule violation. If the justification is vague ("It's weird"), the Instructor (Chief Justice) vetoes the exile and forces a Box assignment. This burns time, making exiles costly.

  **2. The "Dominant Taxonomist"**
  *   *Risk:* In each group of 4, one biology-heavy student will dominate the metaphysics-heavy students. They will say, "Obviously this is BSC," and the group will comply without feeling the friction.
  *   *Counter-Measure:* Assign roles within the group: *The Scribe* (writes), *The Advocate* (speaks), *The Dissenter* (must find one reason to disagree before consensus). Rotate roles per 4 cards.

  **3. The "Digital Organism" Collapse**
  *   *Risk:* Card 13 (Digital) might cause them to laugh and stop taking the game seriously, viewing it as sci-fi rather than metaphysics.
  *   *Counter-Measure:* Frame Card 13 seriously in the briefing. "Treat the code as DNA. Treat the server as the Environment. This is a test of material substrate necessity." If they laugh, ask: "If it evolves, why isn't it a lineage?"

  **4. Time Creep**
  *   *Risk:* Round 1 runs long. They get stuck on Card 2 (Ring Species).
  *   *Counter-Measure:* Be ruthless. At Minute 20, blow a whistle. "Pens down. Whatever is in the Exile pile stays there." The frustration of unfinished work is actually data for the debrief.

  ## VII. Instructor Script: The "Gotcha" Moment

  In the Debrief, wait for someone to say: *"Well, obviously Species aren't real kinds, they are just useful heuristics."*

  **Your Response:**
  "Look at your score sheets. You earned points for agreement. You lost points for Exile. You *acted* as if Species were real constraints on the world, because the game punished you for treating them as optional. If 'Species' were just a heuristic, you would have exiled everything to save time. But you didn't. You fought to categorize. Why? Because the *practice* of biology demands boundaries, even if the *metaphysics* denies them. That tension is where the philosophy lives."

  ---

  ### Preparation Checklist
  1.  **Print Cards:** 3 sets of 16.
  2.  **Print Score Sheets:** Simple grid for Groups to track decisions.
  3.  **Room Setup:** 3 tables, spaced apart (for Round 1 isolation).
  4.  **Timer:** Visible to all.
  5.  **Whiteboard:** For scoring rules and final tally.

  This design forces them to inhabit the framework until it breaks, rather than observing the break from a distance. Good luck with the seminar.
