prompt: |-
  hey, i'm a phd student in philosophy of biology (mostly metaphysics of natural kinds, not that it matters much) and i've got this seminar of 12 grad students, 90 minutes next tuesday. we're doing the species problem and i'm tired of the usual "here's essentialism, here's BSC, here's PSC" lecture format. i want them to physically run into the failure of categorization themselves before anyone names the problem.

  so i'm imagining a tribunal game. split them into three groups, each locked into one framework—morphological essentialism, biological species concept, or phylogenetic lineage. they recieve packets with 16 case cards. the first 11 are standard biological edge cases (ring species, mule hybrids, asexual whiptails, cryptic species revealed only by genomics). but i want to inject four niche synthetic cases that push past standard biology: chimeric organisms built through cross-kingdom horizontal gene transfer that reproduce clonally yet accumulate mutations, and "digital organisms" that copy with mutation but have no cells, DNA, or reproductive isolation in any biological sense. each group must assign every card to exactly one species box or exile it to a "liminal" pile. there's a payoff scheme—+2 points for unanimous in-group assignment, -1 for each exile, +1 if two groups independently agree across frameworks—but they can't talk across groups until round 3. round 2 forces them to defend their exiles aloud.

  please design the full thing: clear rules, the logic behind the card descriptions, a minite-by-minite timeline for 90 minutes, and a debrief that maps specific moments—the exile pile growing, the cross-group argument over the chimeras, the digital organisms breaking all three rules—onto parts of the metaphysical debate. also include an honest note about which feature of the actual problem this can't reproduce (probably the long historical contingency of taxonomic revision, or biologists just pragmatically picking). and tell me what'll go wrong first run—i'm guessing they game the points by exiling every ambiguous case to avoid penalties. i want them leaving feeling that "species" isn't just disputed but that any sharp boundary requires hiding real complexity.
