answer: |-
  Here is the diagnosis.

  ### The Diagnosis: A Substantive Disagreement About Explanatory Privilege

  This is not merely a verbal disagreement, nor are the two sides simply answering different questions under the same heading. It is a **substantive disagreement about causal attribution**, where "information" is being used as a proxy for **explanatory privilege**.

  Here is why it is not verbal: If this were purely verbal, you could stipulate a definition (e.g., "Let's call Shannon correlation 'info-1' and semantic content 'info-2'") and the conflict would dissolve. It does not. The molecular biologists insist on "information" not just to describe correlation, but to justify the **Central Dogma** as a flow of *control* from gene to organism. The philosophers insist on denying "information" not just to be semantically pedantic, but to justify **Developmental Systems Theory**, which argues that the cytoplasm, membrane, and environment are causally parity with the DNA.

  The word "information" is doing heavy ontological lifting. To call DNA a "code" is to claim it is the *program* (the active instruction), while the rest of the cell is the *hardware* (the passive executor). To deny it is a "code" is to claim DNA is just one *resource* among many (like amino acids or ATP), none of which are inherently more "informational" than the others.

  Therefore, the stalemate persists because both sides recognize that conceding the definition of "information" means conceding the structure of biological explanation. Side A fears that if DNA isn't "information," genetics loses its predictive priority. Side B fears that if DNA *is* "information," we return to gene-centrism and ignore epigenetic/environmental causation.

  ### Why "Different Questions" Is Incorrect
  You suggested they might be answering different questions (prediction vs. semantics). They are not. Both sides are attempting to answer the same question: **"What is the causal role of the genome in development?"**
  *   Side A answers: It is the specific determinant (the code).
  *   Side B answers: It is a necessary but non-privileged component (part of the system).

  They are competing explanations of the same phenomenon, not parallel discourses.

  ### What Counts as Progress?

  Given that this is a substantive fight over causal privilege, **no progress will be made by proposing a shared definition.** A definition is a treaty; this is a war over territory. A formal result (like a new information metric) will also fail, because Side B will argue the metric assumes the wrong causal boundaries, and Side A will argue the metric is biologically irrelevant.

  **Progress requires a Pragmatic Dissolution.**

  Progress will only occur when the field shifts from asking *"Is DNA information?"* (an ontological question) to *"Under what modeling constraints is the 'information' ascription useful?"* (a pragmatic question).

  Specifically, progress looks like this:
  1.  **Formalizing Context-Dependence:** We need an information-theoretic model that explicitly treats the cellular machinery not as a fixed "decoder" but as a variable channel. If you can mathematically demonstrate (using Shannon theory, which Side A loves) that the **channel capacity of DNA drops to zero** without specific contextual variables (which Side B loves), you bridge the gap. You show that "information" is not a property of the molecule, but a property of the *relationship* between the molecule and the context.
  2.  **Decoupling Specificity from Privilege:** We need an argument that grants DNA **causal specificity** (changing DNA changes the outcome predictably) without granting it **causal priority** (DNA controls the process). Side A needs specificity for prediction; Side B needs to deny priority for ontological accuracy. Currently, "information" conflates these two.

  **The Verdict:**
  Stop trying to solve the definition of "information." The concept is essentially contested because the underlying metaphysics (Reductionism vs. Holism) are contested. Progress is not a definition both sides accept; it is a **formal framework that renders the distinction between 'code' and 'context' mathematically continuous rather than binary.** Until the "code" can be modeled as a variable function of the system rather than a fixed property of the sequence, the two sides will continue to talk past each other.
