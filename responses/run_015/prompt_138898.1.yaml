answer: |-
  This is the right instinct. The "sortition is back" narrative often treats randomness as a magic wand rather than a mechanism with specific failure modes. If you are writing about giving a random body *legislative power* (not just advice), the burden of proof shifts from "is this interesting?" to "does this outperform elections on specific metrics without introducing new pathologies?"

  Here is the specification you asked for, broken down into requirements, meta-analysis, and an evaluation of your "Sortition Veto" case study.

  ### Part 1: The Specification (Requirements for Real Power)

  To justify transferring legislative power from an elected body to a sortition body, the design must clear these six hurdles.

  **1. The Regress of the Draw (Who guards the lottery?)**
  *   **Requirement:** The mechanism for selecting the pool must be immune to partisan manipulation of the underlying data (voter rolls, census data, DMV records).
  *   **Consideration:** In elections, we fight over gerrymandering. In sortition, we fight over *pool definition*. If the executive branch controls the database from which names are drawn, they can exclude zip codes or demographics algorithmically.
  *   **Case:** A sortition body is only as independent as the agency managing the random number generator. This requires a constitutional-level independent commission, not a ministry appointment.

  **2. The Non-Response Bias (The "Civic Duty" Gap)**
  *   **Requirement:** The final seated body must not systematically exclude the time-poor, the distrustful, or the marginalized.
  *   **Consideration:** Random selection gets you a *sample*, not a *body*. If 40% decline (as is common in minipublics), and the decliners are disproportionately working class or disillusioned, you have not created a "people's house"; you have created a house of the "civically available."
  *   **Case:** Without compulsion (jury duty style), sortition replicates the participation bias of voting. With compulsion, it faces political resistance (see: "freedom" objections). A design relying on volunteers must prove that stipends + childcare + lost wage coverage actually neutralize this bias.

  **3. The Competence/Deliberation Trade-off**
  *   **Requirement:** The body must demonstrate capacity to understand complex trade-offs without deferring entirely to "expert" testimony.
  *   **Consideration:** Social science on small-group deliberation shows that without facilitation, groups polarize or defer to the highest-status member. With heavy facilitation/expert testimony, they risk "elite capture" or "consensus manufacturing."
  *   **Case:** A body with real power cannot be a focus group. It needs to function like a court. If they cannot grasp the budgetary implications of a veto, the veto is dangerous.

  **4. The Intense Minority Problem**
  *   **Requirement:** The decision rule must protect intense minorities from a deliberative majority that has simply talked itself into a false consensus.
  *   **Consideration:** Deliberation favors the articulate and the patient. It does not inherently protect rights. An elected minority party has procedural tools (filibusters, committees); a random sample has no institutional memory or incentive to protect a minority view next year.
  *   **Case:** If 60% of the sortition body deliberates themselves into banning a religious practice because it "seems inefficient," there is no electoral punishment. Sortition needs a bill of rights constraint that elections theoretically have (via future voting).

  **5. The Downstream Link (The Irish vs. French Test)**
  *   **Requirement:** There must be a formal, automatic trigger for action, not a channel for recommendation.
  *   **Consideration:** This is the critical failure point of recent experiments.
      *   **Ireland (Success):** The Citizens' Assembly recommended abortion reform → This triggered a *mandatory referendum*. The link was constitutional.
      *   **France (Failure):** The Climate Convention recommended carbon measures → Macron filtered them through the Council of Ministers → Watered-down legislation. The link was advisory.
  *   **Case:** If the government can "respond within six months" (as in your proposal), they can simply wait out the body. Real power means the legislation *passes* unless the elected body overrides the veto with a supermajority.

  **6. Distinctions Not to Collapse**
  *   **Descriptive vs. Substantive:** A body that *looks* like the population (descriptive) does not automatically *act* for the population (substantive).
  *   **Impartiality vs. Competence:** Randomness guarantees impartiality (no prior commitment), not competence.
  *   **Legitimacy-by-Procedure vs. Legitimacy-by-Outcomes:** Sortition claims procedural legitimacy ("fair chance"). If outcomes are disastrous, that legitimacy evaporates faster than electoral legitimacy.
  *   **Selection vs. Decision Rule:** Randomness is good for *selection* (who sits there). It is not inherently good for *decision rules* (majority vote among strangers often yields volatile results).

  ---

  ### Part 2: The Meta-Analysis (The Squeeze)

  You asked to mark which requirements are non-negotiable and which are ideological commitments, and to identify the unsatisfiable set.

  **Non-Negotiables (Functional Prerequisites)**
  1.  **Anti-Capture Mechanism:** (See "Regres of the Draw"). If the pool is rigged, nothing else matters.
  2.  **Binding Downstream Link:** (See "Irish vs. French"). Advisory bodies are PR exercises.
  3.  **Protection Against Tyranny:** A check on the sortition body itself (e.g., judicial review).

  **Ideological Commitments (Dressed as Criteria)**
  1.  **"Must Mirror Demographics Perfectly":** This is the "Descriptive Representation" trap. A sample of 250 cannot mirror a population of millions on *all* axes (race, class, geography, education, disability) simultaneously without becoming so stratified it fractures. This is a marketing claim, not a functional requirement.
  2.  **"Must Beat Elections on Getting the Right Answer":** This assumes there is a "right answer" (epistemic democracy). Often, politics is about conflicting values, not truth. Sortition should be judged on *process quality* (reducing polarization), not *outcome correctness*.

  **The Jointly Unsatisfiable Set (The Three-Way Squeeze)**
  Your hunch is correct, but I would refine the third horn. The trilemma is:
  1.  **Deep Deliberation:** Requires small groups (N < 50) and significant time (months/years).
  2.  **Statistical Representativeness:** Requires larger N (N > 200) to minimize margin of error on multiple demographic axes.
  3.  **Voluntary Participation:** Requires low burden.

  *Why it breaks:*
  *   If you want **Representativeness + Deliberation**, you must **Compel Service** (Jury Duty). But compelling citizens to legislate for a year is politically toxic and legally dubious in many jurisdictions.
  *   If you want **Voluntary + Representativeness**, you must keep the burden low (short term, large group). But a large group (N=250) cannot deliberate; it can only listen and vote. It becomes a mini-parliament, losing the "deliberative" advantage.
  *   If you want **Voluntary + Deliberation**, you must keep the group small. But a small group (N=50) cannot be statistically representative of a diverse nation.

  **Verdict:** You cannot have a voluntary, statistically representative, deliberative body. You must sacrifice one. Most current proposals sacrifice *Deliberation* (by making the groups too big to actually talk) or *Representativeness* (by accepting high dropout rates among the poor).

  ---

  ### Part 3: Evaluating the "Sortition Veto" Proposal

  **The Design:** 250 people, stratified lot, 1-year term, median wage pay, rival advocate teams, veto power with government response required.

  **Scorecard Against Spec:**

  1.  **Regress of the Draw:** *Unclear.* Who hires the "rival advocate teams"? If the government hires them, they can hire weak advocates for one side. If the body hires them, they need expertise they don't have. **(FAIL/UNKNOWN)**
  2.  **Non-Response Bias:** *High Risk.* "Median wage" pay is insufficient for the self-employed, gig workers, or caregivers who cannot predict income or find replacement labor for a year. The body will skew toward salaried employees and retirees. **(FAIL)**
  3.  **Competence/Deliberation:** *Critical Failure.* 250 people is not a deliberative body; it is an assembly. You cannot have a meaningful conversation with 249 other people. It will devolve into speech-making and factionalism, replicating the worst of parliaments without the party discipline to pass bills. **(FAIL)**
  4.  **Downstream Link:** *Weak.* "Government must answer within six months." This is the French Climate Convention model. The government can answer: "We hear you, but no." A veto must be a *block*, not a *request for comment*. **(FAIL)**
  5.  **Intense Minority:** *Unprotected.* A simple majority of 250 random people can veto anything. If they are swayed by a populist wave or a charismatic facilitator, there is no check. **(FAIL)**

  **Where Randomness is Doing the Work:**
  In this specific design, randomness is doing **Anti-Corruption/Anti-Polarization work**, not Moral work.
  *   **Moral Work:** "Everyone has an equal right to rule." (This is weak here because 24,999,750 people *don't* get to rule).
  *   **Anti-Corruption Work:** "You cannot bribe 250 random people in advance because you don't know who they are." This is the strong suit.
  *   **Anti-Polarization Work:** "They don't need to campaign for re-election, so they can compromise."

  **The Verdict:** This proposal is a "Safety Valve," not a "Engine." It is designed to stop bad laws, not make good ones. However, by making the group too large for deliberation and the power too weak to block (only delay), it risks becoming a legitimation device for the government ("See? Random people agreed!").

  ---

  ### Part 4: Brief Scorecard of Models

  | Model | Power Level | Deliberative Quality | Representativeness | Primary Risk |
  | :--- | :--- | :--- | :--- | :--- |
  | **Full Lottocracy** (Replace Legislature) | High | Low (Too big to talk) | Medium (Volunteer bias) | **Incompetence:** Lack of institutional memory leads to chaotic policy swings. |
  | **Sortition Veto Chamber** (Your Case) | Medium (Negative) | Low (Assembly size) | Medium (Stratified) | **Gridlock:** Becomes a tool for obstruction without responsibility for solutions. |
  | **Agenda-Setting Only** (e.g., Ballot Initiatives) | Low (Input only) | High (Small working groups) | Low (Self-selected) | **Irrelevance:** Elected body ignores the agenda (The French Model). |
  | **Enfranchisement Lottery** (Random voters get extra votes) | Medium (Diluted) | N/A (Voting, not talking) | High (Statistically) | **Confusion:** Voters don't understand their enhanced power; creates a "voter aristocracy." |

  ### The Story Angle

  If you want to break the "sortition is hot" cycle, the story isn't "Look, random people agreed." The story is **"The Trilemma of Democratic Design."**

  Every proponent you interview is trying to hide one leg of the stool.
  *   The **Academics** hide the *Voluntarism* problem (they assume people will show up).
  *   The **Activists** hide the *Deliberation* problem (they assume 250 people can talk).
  *   The **Politicians** hide the *Power* problem (they promise influence but deliver advice).

  The "Sortition Veto" fails because it tries to be big enough to look representative, small enough to look manageable, and weak enough to be palatable. It ends up being too big to talk, too weak to rule, and too expensive to be truly representative.

  **The Money Quote:** "Randomness solves the problem of *access*, but it does not solve the problem of *agency*. Putting a random citizen in a room with a bill doesn't make them a legislator; it makes them a juror without a judge. Until we solve the compulsion vs. representation trade-off, sortition is just democracy's focus group."
