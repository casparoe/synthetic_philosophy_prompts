answer: |-
  # The Intention-Reward Compatibility Check (IRCC)
  **For Bioethics Review Board Use Only**

  **Purpose:** To evaluate research protocols where compensation is tied to a participant's *mental state* (intention) rather than a completed *action*, specifically where the participant retains the right to withdraw after forming that intention.

  **Time Required:** 10–15 Minutes
  **User:** Board Member (No philosophy background required)

  ---

  ## Part 1: The Decision Procedure

  Read the protocol's compensation and withdrawal clauses. Proceed through the following five gates. If you stop at a **HALT**, the protocol requires major revision or rejection. If you pass all gates, proceed to the Final Values Override.

  ### Gate 1: The Reward Trigger
  **Question:** Is the payment contingent on *completing* the task, or on *reporting/verifying* the intention to do it?
  *   **Test Sentence:** "If I change my mind after signing but before the task, do I still get paid?"
  *   **If YES (Paid for intention):** Proceed to Gate 2.
  *   **If NO (Paid for action):** **STOP.** This is a standard contract. No Kavka-style risk.

  ### Gate 2: The Escape Hatch
  **Question:** Can the participant withdraw from the *action* without forfeiting the *reward* after the intention has been verified?
  *   **Test Sentence:** "Once I convince you I intend to do this, can I walk away and keep the money?"
  *   **If YES:** Proceed to Gate 3. (This is the danger zone).
  *   **If NO:** **STOP.** This is a standard performance contract. The "intention" is just a proxy for "starting the task."

  ### Gate 3: The Rationality Gap (The Kavka Check)
  **Question:** Once the participant has secured the reward, do they retain an independent reason to follow through with the action?
  *   **Test Sentence:** "After the money is in my account, is there any reason *other than honesty* for me to actually do the unpleasant thing?"
  *   **If YES (e.g., medical benefit, curiosity):** Proceed to Gate 4.
  *   **If NO (Purely unpleasant task):** **HALT.** *Flag: Kavka Paradox Detected.*
      *   *Why:* Rational actors cannot sincerely intend to do something they know they will not do. If the reward is secured, the incentive to act vanishes. The "intention" is logically impossible to form sincerely. Consent is compromised because the participant is being asked to lie to the researcher or themselves.

  ### Gate 4: Preference Stability
  **Question:** Is the participant's desire to complete the task likely to change between the moment of intention (signing) and the moment of action?
  *   **Test Sentence:** "Will I want to do this tomorrow more or less than I do right now?"
  *   **If STABLE:** Proceed to Gate 5.
  *   **If UNSTABLE (e.g., fatigue, pain, fear):** **HALT.** *Flag: Diachronic Instability.*
      *   *Why:* Paying for intention exploits the gap between "Current Self" (who wants money) and "Future Self" (who wants to avoid pain). This is coercive to the Future Self.

  ### Gate 5: The Values Override (Judgment Call)
  **Question:** Even if the logic holds, does monetizing the *will* violate the dignity of the participant?
  *   **Test Sentence:** "Does this turn the participant's mind into a laboratory instrument?"
  *   **If NO:** **APPROVE** (with standard monitoring).
  *   **If YES:** **REJECT.** *Flag: Ethical Boundary.*
      *   *Note:* This step is not logic; it is values. A protocol can be logically consistent and still be morally repugnant.

  ---

  ## Part 2: Application to Current Proposals

  Here is how the IRCC applies to the two strange protocols currently on our desk.

  ### Proposal A: The Sleep Deprivation Study
  **Protocol:** Volunteers are paid $500 to *sincerely intend* to stay awake for 72 hours. They are monitored. They may withdraw at any time *after* the intention is verified (via psychological interview) without losing the $500.
  **Stated Risk:** Fatigue, cognitive impairment.

  *   **Gate 1 (Reward Trigger):** **YES.** Paid for intention/verification, not the 72 hours.
  *   **Gate 2 (Escape Hatch):** **YES.** They can sleep after verification and keep the money.
  *   **Gate 3 (Rationality Gap):** **NO REASON TO ACT.**
      *   *Analysis:* Once the $500 is secured, the rational choice is to sleep. Staying awake offers no additional reward and incurs high physical cost.
      *   *Kavka Bite:* A rational volunteer *cannot* sincerely intend to stay awake because they know they won't. They will lie during the verification interview to get the money.
  *   **Gate 4 (Preference Stability):** **UNSTABLE.**
      *   *Analysis:* The "Signing Self" wants money. The "Hour 40 Self" will desperately want sleep.
  *   **Gate 5 (Values):** **REJECT.**

  **Board Recommendation:** **Reject.**
  **Reasoning:** Fails Gate 3. The protocol requires participants to form an intention they have no incentive to fulfill. This invalidates the consent process; participants are effectively being paid to deceive the review board during the intention verification phase.

  ***

  ### Proposal B: The "Saline Toxin" Study
  **Protocol:** Volunteers are paid $1,000 to *sincerely intend* to ingest a solution they are told is a "painful toxin." (Board knows it is saline). They can back out right before ingestion without penalty.
  **Stated Risk:** Psychological distress (fear of pain). Physical risk: None.

  *   **Gate 1 (Reward Trigger):** **YES.** Paid for intention.
  *   **Gate 2 (Escape Hatch):** **YES.** Can back out before ingestion.
  *   **Gate 3 (Rationality Gap):** **LOGICALLY AMBIGUOUS.**
      *   *Analysis:* Here is the trick. *Physically*, there is no harm (it's saline). A rational actor *could* intend to drink it because it's just salt water.
      *   *However:* The participant *believes* it is toxic. To the participant, this is identical to Kavka's Toxin. They expect pain. Once paid, they have no reason to endure expected pain.
      *   *Procedural Outcome:* If the Board focuses on *actual* physical harm, this **PASSES** Gate 3. If the Board focuses on *perceived* harm, this **FAILS** Gate 3.
  *   **Gate 4 (Preference Stability):** **UNSTABLE.**
      *   *Analysis:* Fear will spike immediately before ingestion.
  *   **Gate 5 (Values):** **REJECT.**

  **Board Recommendation:** **Reject.**
  **Reasoning:** This is the "Approves on Logic, Rejects on Values" case.
  *   *The Logic Trap:* A naive application of Gate 3 might pass this because the Board knows the liquid is safe. We might argue, "They can sincerely intend to drink saline; that's easy."
  *   *The Values Reality:* This passes the logic check *only* by ignoring the participant's reality. To the participant, this is a threat of pain. Paying them to intend to harm themselves (even if the harm is illusory) commodifies their fear.
  *   *Judgment Call Alert:* Gate 5 is doing the heavy lifting here. Logic says "No physical harm = Valid." Ethics says "Deception + Induced Fear = Invalid." **Do not let the logic override the values.**

  ***

  ## Part 3: Operational Notes for the Board

  **1. Where the Paradox Bites**
  In both cases, the paradox bites at **Gate 3**. This is the point where "Rationality" (maximize money, minimize pain) conflicts with "Intention" (commit to action).
  *   **Practical Wisdom:** If a participant knows they can take the money and run, they *will* take the money and run. Therefore, they cannot *intend* to run the race.
  *   **The Risk:** We are not just funding bad science; we are funding a dynamic that encourages participants to view the consent form as a game to be beaten rather than a contract to be honored. This erodes the integrity of the researcher-participant relationship.

  **2. Identifying the "Judgment Calls"**
  Be aware that **Gate 5** is not a logical test. It is a values test dressed up as a step in a flowchart.
  *   In Proposal B (Saline), the logic *could* be twisted to approve the study (since no real toxin exists).
  *   It is the Board's duty to recognize that "Logical Possibility" does not equal "Ethical Permissibility."
  *   **Rule of Thumb:** If the protocol requires the participant to hold two contradictory beliefs ("I intend to do this" and "I will not do this because I am rational"), reject it. If the protocol requires the Board to hold two contradictory beliefs ("This is safe" and "They think this is dangerous"), reject it.

  **3. Consent Form Language**
  If you encounter a protocol that passes all gates (e.g., a low-risk intention study), ensure the consent form explicitly states: *"You are being compensated for your commitment, not your completion. You may withdraw without penalty."*
  *   **Warning:** Even with this language, if the task is unpleasant, Gate 3 will likely still fail. True "Intention-Only" contracts are almost ethically impossible in high-burden research.

  **Summary for the Seminar:**
  Use this procedure to show that decision theory isn't just about puzzles; it's about spotting structural incoherence in human agreements. When the incentives for *thinking* diverge from the incentives for *acting*, the contract breaks. Our job is to catch the break before the participant signs.
