      *   If I reject (4), I don't need to reject (7).
      *   If I keep (4), I must reject (7) or (6).
      *   Rejecting (7) is costly (Modal Collapse).
      *   Rejecting (6) leads to Essentialism.
      *   Rejecting the inference to (4) is the cleanest.

