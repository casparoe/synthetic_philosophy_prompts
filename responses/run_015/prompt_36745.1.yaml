prompt: |-
  so heres my situation. I write novels for a living, mostly literary stuff, and for the last two years I've been trying to switch over to locked-room mysteries. I've read basically everything there is to read on plotting a fair-play whodunit — I can tell you exactly how the reveal should be structured, what makes a clue "fair," when to bring in a red herring, all of it. my editor says my outlines are immaculate. and yet everytime I actually try to draft one of these things it comes out wrong — the clues don't sit right, the pacing dies. meanwhile my friend who's a nurse and reads maybe one mystery a year guesses whodunit by page 80 of any book I hand her, and when I ask how she just shrugs.

  my partner says I've "read my way into a corner" — that all this explicit knowledge is crowding out the thing I actually need, and I should stop studying and just draft bad mysteries until one works. that feels anti-intellectual to me?? surely knowing that stuff helps somehow. but I also can't deny that knowing all the rules hasn't made me able to *use* them, and my nurse friend has the ability without the theory.

  so: is there something genuinely different between being able to state the principles and being able to write by them, and if so, how does one ever turn into the other? is my partner right that the studying is actively getting in the way? keep it under 250 words please, and tell me what would change your mind here — like what fact about my drafting process or my reading would flip you toward my partner's view or mine.
