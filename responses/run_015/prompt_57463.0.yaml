  2.  **Analyze the Question:**
      *   **Context:** Robin Hanson's futarchy. Rule: Policy becomes law if market estimates it increases expected national welfare.
      *   **Scenario:** Constitution F.
          *   (i) Welfare metric W (legislated, quarterly).
          *   (ii) Conditional assets W|P and W|~P. Unwinding clause: If condition fails (e.g., P not adopted), positions unwound/refunded at price of unconditional W asset as of filing date.
          *   (iii) Adoption rule: W|P > W|~P by margin significant at p<0.01 given volume.
          *   (iv) Veto only on definition of W.
      *   **Part (a) [10 points]:**
          1.  What is the unwinding clause for? (Identify problem in conditional market).
          2.  What does it leave unsolved?
