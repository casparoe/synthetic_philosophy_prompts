answer: |-
  This is a sharp diagnosis of a field that often suffers from its own formal elegance. You are correct that the stalemate is not primarily due to a lack of technical results—both sides have the math down pat—but rather due to a category error regarding the *purpose* of the theory.

  Here is my diagnosis of the situation, followed by an assessment of what would actually constitute progress.

  ### 1. The Diagnosis: Two Questions, One Label
  You hit the nail on the head: this is **two different questions running under one heading.**

  *   **The Orthodox Bayesian Question:** "What are the minimal consistency constraints on preferences such that an agent cannot be exploited (Dutch booked) or forced into dynamically inconsistent plans?" This is a question about **coherence**. The Independence axiom is not an empirical claim; it is a structural requirement for separability and dynamic consistency.
  *   **The REU Question:** "How can we formally represent the intuition that the *distribution* of outcomes matters independently of their expected value, without calling the agent irrational?" This is a question about **reasonableness** (or phenomenological accuracy).

  The stalemate persists because Orthodox theorists treat REU as a failed attempt at coherence (pointing out violations of separability/dynamic consistency), while REU theorists treat Orthodox EU as a failed attempt at reasonableness (pointing out that it labels Allais-preferences as irrational).

  **The Normative/Descriptive Bleed:**
  You are also right about the normative/descriptive conflation.
  *   **Orthodox EU** wants to be normative but leans on descriptive intuitions (e.g., "surely you prefer a sure thing") to motivate axioms, then retreats to "ideal rationality" when humans violate them.
  *   **REU** wants to be normative but derives its motivation almost entirely from descriptive anomalies (Allais, Ellsberg).
  *   **The Result:** When Orthodox critics say "REU is just Prospect Theory," they mean "You are building a normative theory on descriptive violations." When REU proponents say "EU is too restrictive," they mean "Your normative theory excludes reasonable human attitudes." They are arguing past each other because one side defines rationality as *internal consistency* and the other defines it as *fidelity to risk intuitions*.

  ### 2. The Symmetric Risk-Weighting Sub-Issue
  The symmetric risk-weighting point you raised is not a red herring; it is a stress test for the **source** of risk aversion.

  *   **If Risk-Weighting is Symmetric:** It implies risk aversion is a property of the *probability transformation* itself (a cognitive attitude toward uncertainty). This aligns with a normative view of caution. However, it diverges from empirical data (humans are often risk-seeking in losses).
  *   **If Risk-Weighting is Asymmetric:** It implies risk aversion is tied to *valence* (gains vs. losses). This aligns with Prospect Theory (descriptive) but undermines the REU claim to normative generality. Why should a *rational* agent's weighting of probability depend on whether the outcome is framed as a gain or loss?

  **The Hidden Disagreement:** This reveals a substantive disagreement about **Ambiguity vs. Risk.**
  *   Orthodox Bayesians treat ambiguity as a lack of sharp credences (imprecise probabilities).
  *   REU theorists often treat ambiguity as a reason to apply a risk function.
  *   If symmetric weighting breaks REU arguments, it suggests that what REU calls "risk attitude" is actually "loss aversion" in disguise. If REU theorists retreat to asymmetry to match data, they concede the "Prospect Theory" charge. If they stay symmetric to maintain normativity, they lose descriptive plausibility. This specific technical niche exposes the fragility of REU's claim to be a *general* normative theory.

  ### 3. What Counts as Progress?
  A new axiom will not solve this. We are not short on axioms; we are short on agreement on what they are for. A standard descriptive experiment will not solve this either, because the Orthodox camp can always say, "Humans are irrational."

  Progress requires forcing the two camps to engage on the **pragmatic consequences** of their definitions.

  **A. The Dynamic Consistency Battleground (The "Money Pump" Test)**
  The most substantive normative charge against REU is dynamic inconsistency (e.g., planning to choose $A$ at $t_1$, but preferring $B$ at $t_2$ given the same information).
  *   **Progress Condition:** REU proponents (like Buchak) have attempted to formulate "resolute choice" or modified updating rules to save dynamic consistency.
  *   **The Test:** A rigorous proof showing whether REU agents *necessarily* succumb to strategic exploitation in sequential decision problems *without* adopting ad-hoc resolute choice mechanisms. If REU requires "resolute choice" to avoid Dutch books, is that resolute choice itself rationalizable within the REU framework, or is it an external patch? Resolving the status of **dynamic consistency for non-expected utility maximizers** is the only technical result that could shift the normative needle.

  **B. Pragmatic Encroachment / Contextualism**
  We need to abandon the idea of a single "Rationality."
  *   **Progress Condition:** A meta-theoretical framework that delineates **domains**.
      *   *Domain 1 (Market/Strategic):* Where separation and dynamic consistency are required to prevent exploitation. Orthodox EU rules.
      *   *Domain 2 (Personal/Ethical):* Where the structure of the gamble matters (e.g., "I don't want to gamble with lives, even if EV is higher"). REU rules.
      *   Acknowledging that "Rationality" is context-dependent dissolves the stalemate. It admits that Independence is a constraint for *interchangeable* agents in competitive markets, but not necessarily for *individual* agents making one-off moral decisions.

  **C. The "Symmetric" Experiment**
  To address your specific sub-issue: We need an experiment that isolates **probability weighting** from **utility curvature** and **loss aversion**.
  *   **Design:** Elicit risk weights over domains where valence is controlled or neutralized (e.g., trading probabilities of sensory stimuli rather than money).
  *   **Goal:** Determine if the convex risk function is a stable cognitive trait (supporting REU normativity) or a byproduct of loss aversion (supporting the Prospect Theory critique). If symmetric weighting fails empirically even in neutral domains, REU loses its claim to being a fundamental theory of rational choice under uncertainty.

  ### Summary
  The dispute is **substantive**, but not about the math. It is about the **boundary conditions of rationality.**

  *   **Orthodox:** Rationality = Coherence (avoiding self-defeat).
  *   **REU:** Rationality = Sensitivity (capturing risk attitudes).

  **The Path Forward:**
  Stop asking "Which theory is true?" and start asking "What is the cost of the violation?"
  1.  If REU violates Independence, does it lead to **self-defeat** (Dutch books) or just **framing sensitivity**? If the latter, the Orthodox objection weakens.
  2.  If EU preserves Independence, does it force agents to ignore **morally relevant structures** of risk? If the latter, the REU objection strengthens.

  The field needs a **pragmatic taxonomy of rationality**, not another representation theorem. We need to accept that there may be "coherent rationality" (EU) and "substantive rationality" (REU), and they are tools for different jobs. Until the labels are disentangled, the circles will continue.
