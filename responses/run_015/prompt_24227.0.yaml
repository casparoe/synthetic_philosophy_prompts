      *   Outside: We see $H$ is countable, so we can construct a map $g: \mathbb{N} \to H$. But $g \notin F$.

      *Okay, that works.*

  10. **Final Polish:** Check the "Residue Report" against the specific constraints. Ensure the "Outside Observer" section addresses the "no privileged vantage point" concern directly. (The OS is privileged relative to the process, but the OS is just another process relative to the Kernel, etc.)

