      *   *Epistemic Flags:* Use brackets like `[CONTESTED]` or `[SETTLED]` to mark claims.

      *(Self-Correction during drafting)*: I initially thought about putting the Political Theorist first. But in a PolEcon workshop, a Formal Theorist saying "this isn't a mechanism" is more damaging to the paper's acceptance than a Political Theorist saying "this is neoliberal ontology." I will reorder based on *damage to the paper's core claim*, not volume of voice.

      *Refining the "Paralysis Test":* Theorists will hate this. It's a thought experiment, not a derivation. I need to defend it as a classification device, not a causal engine.

      *Refining the "Attrition" case:* Credential inflation. Is it really attrition? Or is it signaling (Dissipation)? I need to be careful here.

  7.  **Final Review against Constraints:**

      *   7-9 objections? Yes.
      *   Ordered by damage? Yes.
      *   Specific vocabularies? Yes.
      *   90-second replies? Yes (approx. 150-200 words).
      *   Soft spots identified? Yes.
      *   Concessions section? Yes.
      *   "Must Land" reply? Yes.
      *   "Hope nobody asks"? Yes.
      *   Revision point? Yes.
      *   Epistemic flags included? Yes.

  8.  **Final Polish:** Check the tone. Ensure it sounds like advice to a colleague, not a lecture. (Proceed to generate output).

  *(Self-Correction on Epistemic Flags)*: The prompt asks me to mark claims *in the draft replies* as settled or contested. I will integrate this directly into the reply text or as a sub-note to ensure the user knows what to hedge. I will use bolding/brackets for clarity.

  *(Self-Correction on "Damage")*: The Formal Theorist objection regarding "no equilibrium concept" is the most lethal because it undermines the causal logic. The Comparativist objection regarding empirical fit is second. The Political Theorist is least damaging to the *model* but annoying. I will order accordingly.

  *(Self-Correction on "Revision Point")*: The definition of the viability threshold is the weakest link. It needs formalization. I will suggest that as the revision point.

