          *   1 Economic Historian (anti-presentist, suspects old wine/new bottle).
          *   2 Behavioralists (imitation/social influence).
          *   1 Political Theorist (Foucault lineage, objects to pre-defined preferences/constraints).
      *   **Deliverables:**
          1.  7-9 Objections (ordered by damage, voiced in specific vocabularies).
          2.  90-second replies + "soft spot" (follow-up vulnerability).
          3.  Pre-emptive concessions (first 2 mins).
          4.  The one reply that *must* land.
          5.  The "hope nobody asks" objection (honest admission of weakness).
          6.  One point requiring paper revision rather than an answer.
          7.  **Epistemic Requirement:** Flag settled claims vs. contested/thin claims.

  2.  **Deconstruct the Paper's Vulnerabilities:**

      *   *Formal Theorists:* The "Paralysis Test" sounds like a comparative static without a model. Where are the payoffs? Is "viability threshold" endogenous?
      *   *Comparativists:* They've seen "Race to the Bottom" (RTB) debunked before. Is this just RTB relabeled? Does empirical evidence support the "Transfer" claim in tax competition (often evidence is mixed)?
      *   *Historian:* Is "Moloch" just a metaphor for externalities? Is "Attrition" just Schumpeterian creative destruction or Marxian reserve army of labor?
      *   *Behavioralists:* Are agents actually rational calculators of viability? What about herd behavior driving the escalation regardless of structure?
      *   *Political Theorist:* The framework assumes liberal individualism (agents with preferences). It ignores how the "game" constitutes the subjects.
      *   *General:* The taxonomy might be mutually exclusive in theory but overlapping in practice. The remedies (raising the floor) might be politically impossible (which is a political economy problem).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Formal Theorist - Most Damaging):* Needs to attack the mechanism. If there's no equilibrium, is it just a story?
      *   *Objection 2 (Comparativist):* Attack the empirical classification. Tax competition isn't just transfer; it actually reduces public goods (Dissipation).
      *   *Objection 3 (Historian):* Attack the novelty. This is Ricardo or Marx in disguise.
      *   *Objection 4 (Political Theorist):* Attack the ontology. Preferences aren't fixed.
      *   *Objection 5 (Behavioralist):* Attack the rationality. People imitate, they don't calculate viability thresholds.
      *   *Objection 6 (Formal Theorist 2):* Endogeneity of the threshold.
      *   *Objection 7 (Comparativist 2):* Policy feasibility. "Raising the floor" is harder than coordination.
      *   *Objection 8 (General/Method):* The Paralysis Test is impossible to run empirically.

      *Refining for "Damage":* The Formal Theorist attack on the mechanism is existential. If the mechanism doesn't hold, the taxonomy collapses. The Comparativist attack on empirical fit is second (if the examples are wrong, the theory is useless). The Political Theorist is philosophical but less damaging to the *model's* utility.

  4.  **Drafting Replies & Epistemic Flags:**

      *   Need to ensure I don't claim certainty where there is none.
      *   Need to identify the "soft spot" (where the follow-up hurts).
      *   *Constraint:* 90 seconds per reply.

  5.  **Addressing Specific Requirements:**

      *   *Pre-emptive Concessions:* Acknowledge the metaphor's utility, acknowledge the model is informal.
