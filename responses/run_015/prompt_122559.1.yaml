answer: |-
  # Q&A Preparation Sheet: Political Economy Workshop
  **Paper:** *The Moloch Taxonomy: Dissipation, Transfer, and Attrition*
  **Time Limit:** 90 seconds per reply
  **Epistemic Key:** **[SETTLED]** = Standard literature/definition; **[CONTESTED]** = Your contribution/thin evidence; **[HEDGE]** = Requires verbal qualification.

  ---

  ## Part 1: Pre-emptive Concessions (First 2 Minutes)
  *Do not wait for these to be asked. Offering them early inoculates you against charges of naivety.*

  1.  **On Formalization:** "I want to be clear upfront: the 'Paralysis Test' is a classification device, not a structural model. **[HEDGE]** I am not claiming this replaces equilibrium analysis, but that it sorts empirical cases before we model them."
  2.  **On the 'Moloch' Metaphor:** "I am not arguing the Moloch metaphor is useless. **[SETTLED]** It captures the *feeling* of coercion well. I am arguing it is diagnostically imprecise for policy."
  3.  **On the Remedy:** "When I suggest 'raising the floor' for attrition cases, **[HEDGE]** I am describing a functional requirement, not claiming political feasibility. How to build that coalition is a separate political question."

  ---

  ## Part 2: Objections & Replies (Ordered by Damage)

  ### 1. The Formal Theorist (The "Mechanism" Objection)
  **Objection:** "You've described outcomes, not a mechanism. Without an equilibrium concept, 'Attrition' and 'Dissipation' are observationally equivalent. If agents are rational, they anticipate the threshold. If they don't, you need a behavioral story. As it stands, this is just a taxonomy of residuals."
  **Reply:** "That is a fair characterization of the current draft. **[HEDGE]** My goal isn't to solve the game but to prevent mis-specification. If you model a Transfer case as a Prisoner's Dilemma (Dissipation), you solve for cooperation when you should be solving for rent taxation. **[CONTESTED]** The Paralysis Test identifies the payoff structure *before* equilibrium selection. The soft spot is that I rely on the researcher's ability to correctly imagine the counterfactual."
  **Soft Spot:** *How do you empirically distinguish the counterfactual without a model?*
  **Epistemic Note:** Concede the lack of formal mechanism. Assert the utility of pre-model classification.

  ### 2. The Comparativist (The "Race to the Bottom" Objection)
  **Objection:** "We spent twenty years debunking the 'Race to the Bottom' in federalism. You're saying tax competition is just Transfer? **[CONTESTED]** Empirical work shows public goods *are* degraded, not just redistributed. You're classifying Dissipation as Transfer to save your taxonomy."
  **Reply:** "I distinguish them by who captures the rent. **[SETTLED]** In pure Dissipation, the resource vanishes. In tax competition, capital remains productive; the surplus shifts from labor/public goods to capital owners. **[HEDGE]** The aggregate waste is often second-order compared to the distributional shift. If the public good degrades, that is a *consequence* of the transfer, not the competition itself. The remedy changes from 'stop competing' to 'tax the rent.'"
  **Soft Spot:** *Evidence that the aggregate waste is small is thin in your paper.*
  **Epistemic Note:** Do not claim the waste *is* small; claim the *primary* effect is distributional.

  ### 3. The Economic Historian (The "Old Wine" Objection)
  **Objection:** "This is Ricardo on rent, Marx on the reserve army of labor, and Hirschman on exit/voice. You're dressing 19th-century political economy in cybernetic clothing. What does 'Moloch' add that 'externality' didn't?"
  **Reply:** "The genealogy is correct, but the diagnostic is new. **[SETTLED]** 'Externality' lumps all three modes together. **[CONTESTED]** By separating Attrition (viability) from Dissipation (waste), we stop prescribing coordination for survival problems. Marx saw the reserve army; I'm arguing that treating it as a coordination failure leads to policies that crush the viable rather than protecting the floor."
  **Soft Spot:** *Is the distinction actually new, or just a semantic shift?*
  **Epistemic Note:** Claim novelty on the *policy implication* of the distinction, not the underlying economic logic.

  ### 4. The Political Theorist (The "Ontology" Objection)
  **Objection:** "Your Paralysis Test assumes preferences and constraints exist *prior* to the competition. But in credential inflation, the 'viability threshold' is constituted by the discourse of the profession itself. You're naturalizing a political construction as an economic constraint."
  **Reply:** "I accept that thresholds are socially constructed. **[HEDGE]** But once constructed, they function as hard constraints for the agent. **[SETTLED]** Whether the threshold is 'real' or 'discursive' matters less than the fact that falling below it means elimination. My framework asks: given this constraint, is the remedy coordination or insulation? I bracket the genealogy of the preference to solve the immediate political economy problem."
  **Soft Spot:** *Bracketing the genealogy ignores the power to set the threshold.*
  **Epistemic Note:** Concede the construction of preferences; assert the reality of the constraint for the agent.

  ### 5. The Second Formal Theorist (The "Endogenous Threshold" Objection)
  **Objection:** "In your Attrition case, the viability threshold is endogenous to the number of players. If you raise the floor, you attract more players, lowering the threshold again. You haven't solved the dynamics, just paused them."
  **Reply:** "That is a dynamic problem, and my paper is comparative static. **[HEDGE]** However, raising the floor changes the *type* of competition from survival to performance. **[CONTESTED]** Even if the threshold moves, shifting from 'stay alive' to 'win prize' changes the welfare properties. I am not claiming a permanent equilibrium, but a shift from a zero-sum survival game to a positive-sum performance game."
  **Soft Spot:** *If the threshold moves, the welfare gain might be zero.*
  **Epistemic Note:** Hedge the welfare claim. Assert the change in *nature* of competition.

  ### 6. The Behavioralist (The "Imitation" Objection)
  **Objection:** "You assume agents calculate viability. In credential inflation, agents imitate peers. They escalate because others escalate, not because they calculated a threshold. Your taxonomy relies on rational response to constraints, not social influence."
  **Reply:** "Imitation is a heuristic for calculating the threshold under uncertainty. **[HEDGE]** If everyone is escalating, the inferred threshold is rising. **[SETTLED]** Whether they calculate it or imitate it, the structural payoff remains: falling behind means exit. The remedy (raising the floor) works regardless of whether the escalation is rational or mimetic, because it changes the cost of exit."
  **Soft Spot:** *If it's mimetic, coordination might actually stop it easier than raising the floor.*
  **Epistemic Note:** Assert that the *remedy* holds even if the *cause* is behavioral.

  ### 7. The Comparativist #2 (The "Feasibility" Objection)
  **Objection:** "You say for Transfer cases we should tax the rent, not stop the competition. But the recipients of the rent (capital owners) have the veto power. Isn't your 'correct' remedy politically impossible, making the 'wrong' remedy (coordination) the only viable one?"
  **Reply:** "That is a political constraint, not an economic one. **[SETTLED]** If the remedy is impossible, we should call it that, not misdiagnose the economic mechanism. **[HEDGE]** Prescribing coordination for a Transfer problem creates enforcement costs without solving the distributional conflict. I'd rather we fight the political battle over rent taxation than fight the economic battle against competition."
  **Soft Spot:** *Political economy is about what is possible, not just what is efficient.*
  **Epistemic Note:** Distinguish between *economic diagnosis* and *political strategy*.

  ### 8. The General Methodologist (The "Identification" Objection)
  **Objection:** "How do you run the Paralysis Test empirically? You can't hold preferences fixed while stopping escalation. Isn't this just a Just-So story?"
  **Reply:** "We use natural experiments where escalation is exogenously blocked. **[CONTESTED]** For example, credential caps or tax harmonization treaties. **[HEDGE]** I am not claiming perfect identification, but that looking for these shocks is more productive than assuming a Prisoner's Dilemma structure by default."
  **Soft Spot:** *You have very few such cases in the paper.*
  **Epistemic Note:** Admit the empirical evidence is preliminary; frame the test as a research agenda.

  ---

  ## Part 3: Critical Survival Points

  ### The One Reply That Must Land
  **Context:** If the audience believes Transfer and Dissipation are functionally identical, the paper collapses.
  **The Line:** "In Dissipation, stopping the race makes everyone richer. In Transfer, stopping the race makes the racers richer but the rent-holder poorer, with no net social gain. **[SETTLED]** If we treat Transfer as Dissipation, we coordinate to protect racers at the expense of the public, calling it 'efficiency' when it is just 'cartelization.' Distinguishing them prevents us from cartelizing to protect rents."
  **Why:** This appeals to the normative commitments of the room (efficiency vs. distribution).

  ### The "Hope Nobody Asks" Objection
  **The Question:** "In the Attrition case (credentials), if you raise the floor (make exit survivable), don't you just lower the quality of the profession and harm the consumers of that professional service?"
  **Why I Have No Good Answer:** My paper focuses on the welfare of the *competitors*. I have not modeled the consumer side or the quality signal. If the credential is a true signal of quality, reducing the pressure to get it might lower average quality.
  **Honest Note:** "I have not modeled the consumer side. **[CONTESTED]** My assumption is that much of the credentialing is signaling noise, but if it is human capital accumulation, your objection holds. This is the primary limitation of the current draft."

  ### One Point Requiring Paper Revision
  **The Issue:** The definition of the "Viability Threshold" in Attrition cases.
  **Why:** The Formal Theorists (Objections 1 & 5) will eat you alive if this remains informal.
  **Action:** Before the workshop, add a paragraph explicitly stating whether the threshold is exogenous (biological/bankruptcy) or endogenous (relative standing). If endogenous, acknowledge the dynamic instability.
  **Revision Note:** "I need to clarify in the text that the 'floor' is a policy variable, not just a market outcome, to avoid the endogeneity trap."

  ---

  ## Part 4: Epistemic Summary for the Speaker

  *   **Assert Flatly:** The distinction between value destroyed (Dissipation) and value transferred (Transfer). This is accounting, not theory.
  *   **Hedge Heavily:** The claim that aggregate waste in Transfer cases is "small." This is empirical and contested.
  *   **Hedge Heavily:** The claim that "raising the floor" improves welfare in Attrition cases without quality loss. This depends on the signaling vs. human capital debate.
  *   **Do Not Defend:** The idea that the Paralysis Test is a formal model. Defend it as a heuristic/classification tool.
  *   **Concede Openly:** That political feasibility may override economic diagnosis. Do not argue that your remedy is *possible*, only that it is *correct* given the diagnosis.
