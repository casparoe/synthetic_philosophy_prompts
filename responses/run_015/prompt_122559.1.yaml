      *   **Methodology:** "Paralysis Test" (counterfactual where escalation is impossible).
      *   **Cases:** Tax/regulatory competition (Transfer), Credential inflation (Attrition).
      *   **Audience (15 people):**
          *   3 Formal Theorists (want equilibrium concepts).
