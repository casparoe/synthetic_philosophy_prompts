prompt: |-
  I'm drafting a little piece on Schopenhauer for my science-and-ideas column and I need to fact-check a summary I jotted down after talking with an aesthetics professor. She said Schopenhaur's view is that every other art — painting, poetry, whatever — copies Platonic Ideas, but music skips the Ideas entirely and is a direct audible copy of the Will itself. So music doesn't represent specific feelings like grief or exultation; it just embodies the Will in sound, which is why he mapped bass lines to inorganic nature, harmony to plants and animals, and melody to human consciousness. She also claimed this makes music structurally closer to pure mathematics than to language, and that Schopenhauer believed once you grasp this philosophicly, emotional listening becomes a catagory error — you're projecting representational content onto something that has none. From there she jumped to saying modern cognitive science, which treats music as basically an emotional language, therefore refutes Schopenhaur's metaphysics dead in the water.

  Is that fair? Can you go through it sentence by sentence — what's accurate to his main work, what's a common gloss, what's distorted, and does that final cognitive-science conclusion actually follow?
