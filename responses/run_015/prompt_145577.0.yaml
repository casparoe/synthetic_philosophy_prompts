          3.  Mapping: Bass = inorganic, Harmony = plants/animals, Melody = human consciousness.
          4.  Music is structurally closer to math than language.
          5.  Emotional listening is a category error (projecting content onto something without it).
          6.  Modern cognitive science (music as emotional language) refutes Schopenhauer's metaphysics.
