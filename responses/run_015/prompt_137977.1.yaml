answer: |-
  # Decision Tree: The Aggregation Problem in Contractualism
  **Starting Axiom:** *Morality is about what no one could reasonably reject, and we compare complaints person-by-person.*
  **Test Case:** *Department Travel Fund: One career-critical conference (Person A) vs. Twenty small stipends (Persons B–V).*

  ---

  ## The Tree

  **Node 1: The De Minimis Filter**
  In the travel case, assume the 20 small stipends are individually trivial (no career impact on their own). Can these 20 trivial complaints *pool together* to reasonably reject funding Person A's trip?
  *   **YES:** Go to **Node 2**.
  *   **NO:** Go to **Node 3**.

  **Node 2: The Aggregation Principle**
  (Assuming trivial complaints *can* count): If the 20 stipends were each *significant* (but still less than Person A's trip), does the sum of 20 significant losses outweigh 1 catastrophic loss?
  *   **YES:** Leaf **A (Plain Aggregation)**.
  *   **NO:** Leaf **B (Threshold View)**.

  **Node 3: The Tie-Breaker**
  (Assuming trivial complaints *cannot* count): If Person A's trip and *one* of the small stipends were of **equal** importance to the recipients, would you fund the 20 stipends over the 1 trip?
  *   **YES:** Leaf **C (Numbers-as-Tie-Breaker)**.
  *   **NO:** Go to **Node 4**.

  **Node 4: The Ex Ante Shift**
  Since we cannot compare the outcomes directly (one big loss vs. many small losses), should we instead maximize each person's *probability* of getting funded (e.g., a lottery) rather than maximizing the total value?
  *   **YES:** Leaf **D (Weighted Lottery / Equal Chances)**.
  *   **NO:** Go to **Node 5**.

  **Node 5: Fractional Satisfaction**
  Is it better to partially satisfy everyone's claim (e.g., give Person A 50% of the trip cost and the 20 others 50% of their stipends) rather than fully satisfying one group?
  *   **YES:** Leaf **E (Fractional Satisfaction)**.
  *   **NO:** Go to **Node 6**.

  **Node 6: Iteration & Identity**
  Does the verdict change if this fund is awarded every year, and over 20 years *the same group of people* rotates who gets the big trip (reciprocity/policy) vs. a one-off emergency with strangers?
  *   **YES:** Leaf **F (Iterated Contractualism)**.
  *   **NO:** Go to **Node 7**.

  **Node 7: Shared vs. Separate Burdens**
  Does it matter if the "20 small stipends" are actually shares of a **shared** lab budget (one commons) versus 20 **separate** personal pockets?
  *   **YES:** Leaf **G (Communal Aggregation)**.
  *   **NO:** Leaf **H (Strict Anti-Aggregation)**.

  ---

  ## The Leaves (Positions)

  | Leaf | Label | Core Commitment |
  | :--- | :--- | :--- |
  | **A** | **Plain Aggregation** | Numbers always count; sum total welfare determines the outcome. |
  | **B** | **Threshold View** | Trivial complaints never count; significant ones aggregate only above a sufficiency floor. |
  | **C** | **Numbers-as-Tie-Breaker** | Numbers never outweigh a stronger individual claim, but decide when claims are equal. |
  | **D** | **Weighted Lottery** | Ex ante fairness (chances) trumps ex post outcome maximization. |
  | **E** | **Fractional Satisfaction** | Claims are divisible; proportionate satisfaction is the goal. |
  | **F** | **Iterated Contractualism** | Justification relies on long-term policy reciprocity, not single-act outcomes. |
  | **G** | **Communal Aggregation** | Shared burdens aggregate more easily than separate atomic losses. |
  | **H** | **Strict Anti-Aggregation** | The strongest individual complaint always wins; numbers are morally irrelevant. |

  ---

  ## Logical Space: Occupied vs. Empty

  We generated 8 leaves from 7 binary questions. Here is the status of the logical combinations:

  *   **Occupied (Real Positions):** Leaves A, C, D, E, F, H are standard positions in the literature. Leaf B (Threshold) is widely discussed (e.g., prioritarian variants). Leaf G is less common but defensible (Scanlon hints at it regarding shared institutions).
  *   **Empty 1 (Node 2 = NO, Node 1 = YES):** *The "Trivial-Only Aggregator."*
      *   **Status:** **Incoherent.** If you allow trivial complaints to pool (Node 1 YES) but refuse significant ones to pool (Node 2 NO), you have no consistent principle for why magnitude stops aggregation.
  *   **Empty 2 (Node 7 = YES, Node 3/4/5/6 = NO):** *The "Shared Burden Anti-Aggregator."*
      *   **Status:** **Unattractive/Unstable.** Claiming shared burdens matter (Node 7 YES) usually implies some form of aggregation. Holding this while maintaining Strict Anti-Aggregation (Leaf H) creates tension: why does sharing a loss make it rejectable if numbers don't count?
  *   **Empty 3 (Node 6 = YES, Node 4 = YES):** *The "Iterated Lottery."*
      *   **Status:** **Unexplored/Redundant.** If iteration guarantees everyone a turn, the ex ante lottery becomes unnecessary. Usually, one justifies the policy *instead* of the lottery, not both.

  ---

  ## Warning: Indistinguishable Leaves in the Travel Case

  Be careful using *only* the Travel Fund case to decide between these leaves. Some pairs yield the same verdict in this specific scenario:

  1.  **Strict Anti-Aggregation (H) vs. Numbers-as-Tie-Breaker (C):**
      *   **Problem:** In the Travel Case, the stakes are *unequal* (Career vs. Stipend). Both views fund Person A.
      *   **Fix:** You need a "Burning Building" case (1 life vs. 1 life) to pry these apart.
  2.  **Iterated Contractualism (F) vs. Weighted Lottery (D):**
      *   **Problem:** If the department adopts a rotation policy (Iteration), everyone effectively gets an equal chance over time, mimicking the Lottery outcome.
      *   **Fix:** Ask about a *one-off* emergency fund where no policy exists. Lottery says "flip a coin"; Iteration says "save the worst off" (no future turn to balance it).
  3.  **Fractional Satisfaction (E) vs. Plain Aggregation (A):**
      *   **Problem:** If the fund is divisible, both might suggest splitting the money.
      *   **Fix:** Ask about an *indivisible* good (e.g., one microscope). Aggregation gives it to the Many; Fractional view may say "destroy the good" or "randomize" rather than give it to one side fully.

