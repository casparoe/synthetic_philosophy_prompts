  ## How to Use This in Session
  1.  **Read Node 1 aloud.** Vote Yes/No based *only* on the Travel Case intuition.
  2.  **Follow the branch.** Do not look ahead to the Leaf names.
  3.  **Reach a Leaf.** Compare your result with your neighbors.
  4.  **Check the Warnings.** If you landed on **H** or **C**, admit the Travel Case didn't actually test your difference. Switch to the "Burning Building" case to break the tie.
  5.  **Check the Empty Spots.** If your reasoning lands you in an Empty Spot, the retired engineer wins that round: your view needs repair.
