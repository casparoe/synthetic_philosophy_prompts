answer: |-
  **Case: The Regional Hospital Formulary Committee**

  A regional hospital ethics committee is voting on a new post-surgical analgesic protocol (Option R) to replace the current standard (Option S). Option R significantly improves recovery comfort for 300 patients, each gaining a hedonic benefit of +50 units, but carries a known, unavoidable side effect where one specific patient profile will experience a single, acute nerve-pain episode rated at 90 units of intensity. Option S provides no such recovery benefits (0 units) but limits that same patient profile's worst pain episode to 40 units. These magnitudes reflect standard visual-analogue pain scores scaled to quality-adjusted life days, where a 50-point reduction in post-op discomfort is clinically significant but not life-altering. The same 301 individuals exist in both outcomes.

  **Verdicts and Arithmetic**

  Let $T = 50$ be the lexical threshold for $LTNU$. Let $w = 100$ for $NU_w$.

  *   **$U$ (Classic Utilitarianism):**
      *   Option R: $(300 \times 50) - 90 = 15,000 - 90 = \mathbf{14,910}$.
      *   Option S: $(300 \times 0) - 40 = \mathbf{-40}$.
      *   **Verdict:** Choose **Reform**.
  *   **$NU_w$ (Weighted Negative Utilitarianism):**
      *   Option R: $(300 \times 50) - (100 \times 90) = 15,000 - 9,000 = \mathbf{6,000}$.
      *   Option S: $(300 \times 0) - (100 \times 40) = \mathbf{-4,000}$.
      *   **Check:** The weighted cost of pain (9,000) does not exceed the total pleasure (15,000).
      *   **Verdict:** Choose **Reform**.
  *   **$LTNU$ (Lexical Threshold):**
      *   Option R: Contains an episode (90) $> T$ (50). Lexically forbidden.
      *   Option S: Max episode (40) $< T$ (50). Permissible.
      *   **Verdict:** Block **Reform**.
  *   **$NU_{lex}$ (Lexical $T=0$):**
      *   Option R: Contains pain (max 90).
      *   Option S: Contains pain (max 40).
      *   Since suffering lexically dominates, we minimize the worst suffering first. $40 < 90$.
      *   **Verdict:** Block **Reform**.

  **Variants on the Distribution of Suffering**

  1.  **Spread Across People:** Option R delivers the same total benefits (15,000) and imposes the same *total* pain (90 units), but distributed as 1 unit of pain to each of 90 different patients (all episodes $< T$).
      *   **$LTNU$ Verdict:** Choose **Reform**. No single episode exceeds $T=50$, so the view falls back to below-threshold arithmetic ($15,000 - 90 > -40$).
      *   **Site of Threshold:** This verdict relies on the threshold applying to a **momentary experience per person**. If the threshold applied to "total pain per person" or "total pain in the population," the verdict would flip.
  2.  **Spread Across Time:** Option R delivers the same benefits and total pain (90 units), but imposed on the single identifiable patient as 9 separate episodes of 10 units each over a week (all episodes $< T$).
      *   **$LTNU$ Verdict:** Choose **Reform**. No single episode exceeds $T=50$.
      *   **Site of Threshold:** This relies on the threshold applying to a **discrete episode** rather than a **person's total suffering over time**. If the threshold applied to the aggregate burden on a life, the verdict would flip.
  3.  **Original Concentrated Case:** One patient, one episode, 90 units.
      *   **$LTNU$ Verdict:** Block **Reform**.
      *   **Arbitrariness:** The divergence in verdicts across these three variants suggests the "site" of the threshold (moment, person-moment, or life-total) is doing all the normative work. Choosing one site over another appears non-arbitrary only if one has a robust metaphysical account of what constitutes a "single episode" of suffering, which is often vague in clinical reality.

  **Diagnostics**

  **1. The Critical Feature**
  The single feature driving the divergence is the **concentration of suffering into a single supra-threshold episode**. If you delete this by capping the concentrated suffering below $T$ (as in Variants 1 and 2), $LTNU$ converges with $U$ and $NU_w$, choosing the Reform. If you cap the number of beneficiaries such that total pleasure drops below 9,000, $NU_w$ flips to match $LTNU$, but $U$ remains unchanged, failing to isolate lexicality. If you concentrate all benefits in one person, the arithmetic remains identical for all views, changing nothing. Thus, the case only separates lexical views from weighted views because the suffering is locally intense, not just globally large.

  **2. The Strongest Reply for $LTNU$**
  A defender of $LTNU$ should argue from the **non-aggregativity of mild pains**: morally, 90 mild headaches do not sum to equal one severe migraine, because mild pains lack the qualitative character that demands lexical protection. They claim thresholds track a change in the *kind* of moral claim suffering makes, not just the quantity. However, this reply faces a collapse problem. If mild pains *never* aggregate to outweigh pleasure, the view effectively becomes $NU_{lex}$ (since only severe pain matters). If mild pains *do* aggregate but just can't cross the lexical barrier, the view admits a finite trade-off rate, pushing it toward $NU_w$. To remain stable, $LTNU$ must assert that mild pains aggregate for below-threshold trade-offs but magically stop aggregating once they hit $T$, which requires a precise, non-arbitrary account of why summation rules change at exactly intensity 50.

  **3. Commensurability and Individuation**
  This case does not necessarily prove that pleasure and pain are two incommensurable dimensions; $U$ and $NU_w$ handle them on a single scale successfully. Instead, it shows that a lexical-threshold view owes us a rigorous **account of the individuation of pains**. For $LTNU$ to function, "an episode of suffering" must be a countable, bounded entity with a determinate intensity. If suffering is a continuous flow or if episode boundaries are vague (e.g., is a day of pain one episode or 24?), the threshold $T$ becomes unadministrable. The case establishes that lexical views are more sensitive to the metaphysics of experience than weighted views, requiring a defense of how we carve the stream of consciousness into morally relevant units before we can apply a threshold.
