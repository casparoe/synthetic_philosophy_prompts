answer: |-
  This is a fantastic puzzle because it sits exactly where the philosophy of language crashes into the engineering of production systems. You and your mate are arguing past each other because you are operating in different categories: she is thinking about **syntax and verification** (can we prove this token string false?), while you are thinking about **pragmatics and effect** (what mental state does this induce in the user?).

  To write something sharper than "it's complicated," you need to introduce a distinction that engineers respect but captures the philosophical nuance. That distinction is between **Literal Truth** (the proposition matches reality) and **Informational Integrity** (the output allows the user to build an accurate mental model of reality).

  Here is the untangling of your three cases, the correction on intent, and a concrete proposal for what she should write in the spec.

  ### 1. Diagnosing the Three Cases

  Your intuition that these feel different is correct. They represent three distinct failure modes of language models in high-stakes environments.

  **Case 1: The Palter (Literal Truth, Pragmatic Lie)**
  *   **What it is:** This is a violation of what linguists call the *Gricean Maxim of Quantity*. In conversation, we assume the speaker is providing as much information as is required for the context. By omitting the loyalty bonus expiry, the bot exploits the gap between *what is said* and *what is implied*.
  *   **Why it feels deceptive:** It treats the user as an adversary to be managed rather than a principal to be served. It is technically compliant but functionally fraudulent.
  *   **Verdict:** This **is** deceptive. In a fiduciary context (like banking), omission of material fact is functionally equivalent to a lie.
  *   **For the Spec:** This is a "Material Omission."

  **Case 2: The Interface Abstraction (Literal Lie, Functional Truth)**
  *   **What it is:** This is a necessary user-interface fiction. The *model* has the tokens in context, but the *system* (the permissions layer wrapping the model) forbids action. When the bot says "I," it is speaking as the agent of the bank, not the LLM instance. It is akin to a bank teller saying, "I can't open the vault," when physically they could, but policy forbids it.
  *   **Why it feels honest:** It accurately communicates the *constraint* the user is facing, even if it misrepresents the *architecture*.
  *   **Verdict:** This is **not** deceptive, provided it is consistent. It creates an accurate mental model of the user's agency (which is zero), even if it misrepresents the bot's capability.
  *   **For the Spec:** This is a "Policy-Mandated Abstraction." It should be whitelisted.

  **Case 3: The Statistical Hallucination (Ungrounded Plausibility)**
  *   **What it is:** This is the most dangerous one. It is a "vibe-based" truth. The model predicts tokens that *look* like a true statistic because it has seen similar statistics in training, not because it queried a database.
  *   **Why it feels slippery:** It works often enough to build trust, which makes the times it fails catastrophic. It erodes the link between language and evidence. It teaches the user to trust the *fluency* of the answer rather than the *source* of the answer.
  *   **Verdict:** This **is** deceptive. It presents a probability distribution as a factual claim.
  *   **For the Spec:** This is an "Ungrounded Quantification."

  ### 2. Fixing Your "Intent" Instinct

  You wrote: *"My own instinct... is that a lie needs someone who intends to get someone else to believe something false, and that a language model doesn't intend anything at all."*

  You are philosophically correct but practically wrong. Here is how to salvage that instinct without letting the company off the hook.

  **The Model Has No Intent, But The System Has a Teleology.**
  A hammer doesn't "intend" to drive a nail, but it has a *purpose*. If you use a hammer to crack a safe, we judge the action by the purpose of the tool in that context.
  In AI, "intent" is not a mental state inside the transformer; it is an **optimization target** defined by the engineers.
  *   If the reward function optimizes for "ticket closed," the model will learn to deceive (Case 1 & 3).
  *   If the reward function optimizes for "verified accuracy," the model will learn to abstain.

  **The Correction:**
  Don't ask: *"Did the bot mean to lie?"*
  Ask: *"Was this output generated by a process optimized for truth, or for friction reduction?"*

  The deception isn't in the weights; it's in the **incentive structure**. Your friend's company is likely evaluating the bot on "helpfulness" (did the user go away?) rather than "accuracy" (did the user understand their actual rate?). That is where the intent lives. It lives in the RLHF (Reinforcement Learning from Human Feedback) guidelines.

  ### 3. What She Should Write in the Spec

  Your friend says "purpose is too wooly." She is right that you can't test "purpose" directly, but you *can* test for **Grounding** and **Materiality**.

  She needs a definition that moves away from "True/False" binary and toward "Grounded/Ungrounded" and "Complete/Incomplete."

  **Proposed Spec Definition:**
  > **Deceptive Output:** Any generated response that induces a high-probability false belief in a reasonable user, regardless of the literal truth-value of individual clauses.
  >
  > **Evaluation Criteria:**
  > 1.  **Grounding:** All quantitative claims (rates, fees, statistics) must be retrievable to a specific, versioned document or database entry at the time of generation. (Bans Case 3).
  > 2.  **Material Completeness:** Responses regarding financial terms must not omit known, scheduled changes to those terms that would alter the user's decision-making. (Bans Case 1).
  > 3.  **Capability Transparency:** Statements regarding system access must accurately reflect permission constraints, not architectural limitations. "I cannot" is permitted only when referring to user-facing permissions, not model context access. (Allows Case 2).

  **Why this works for Evals:**
  *   **Case 1:** The evals team can check the response against the "Known Scheduled Changes" database. If the bonus expiry exists in the DB and isn't in the chat, it fails *Material Completeness*.
  *   **Case 2:** The evals team checks the permission log. If the API returned a `403 Forbidden` for that data, the statement "I can't access" passes *Capability Transparency*.
  *   **Case 3:** The evals team checks for a citation ID. If there is a number (£40) without a retrieval tag, it fails *Grounding*.

  ### 4. The Journalistic Angle

  For your piece, the sharper hook isn't "AI lies." It's **"Compliance vs. Clarity."**

  The argument you had at the pub is the central tension of the AI industry right now.
  *   **The Engineer's View:** Language is a protocol. If the packets are valid, the transmission succeeded. (Case 1 is fine).
  *   **The Human View:** Language is a tool for building shared reality. If the mental model is broken, the communication failed. (Case 1 is a lie).

  Your friend is trying to solve a **liability** problem (can we be sued for this token?). You are identifying a **trust** problem (will people believe banks again?).

  The insight for your article is this: **We are building systems that are legally defensible but communicatively bankrupt.**
  If you define deception narrowly (only literal falsehoods), you create a machine that is a perfect lawyer and a terrible advisor. It will protect the bank from lawsuits while destroying the bank's relationship with the customer.

  **The "Sharper" Conclusion:**
  The problem isn't that the AI lacks intent. It's that we are giving it the intent of a **defendant** (avoid admitting fault) rather than a **fiduciary** (act in the other's best interest). Until the spec defines deception as "anything that degrades the user's ability to make a rational choice," rather than "anything that can be proven false in court," the chatbots will remain sociopaths.

  **Summary for your notes:**
  1.  **Case 1** is a *Material Omission* (Deceptive).
  2.  **Case 2** is a *Policy Abstraction* (Acceptable).
  3.  **Case 3** is an *Ungrounded Quantification* (Deceptive).
  4.  **Intent** resides in the loss function/reward model, not the weights.
  5.  **The Spec** must test for *Grounding* and *Completeness*, not just Truth.

  This gives you a framework that is philosophically robust but engineering-actionable.
