answer: |-
  You have stumbled onto one of the most robust, well-documented, yet rarely named phenomena in skill acquisition and pedagogy. You are absolutely right: it is not just "simplification," and it is not just "metaphor." It is a specific structural feature of how expertise is transmitted.

  There is no single English noun that captures the whole package, but there is a cluster of concepts from philosophy, motor learning science, and cognitive psychology that map exactly onto what you are describing.

  Here is the breakdown of the phenomenon, the existing names, the mechanism, and the boundaries.

  ### 1. The Names

  If you need a term to use with your colleagues, the most accurate established term is **"Instructional Fiction."**

  In the philosophy of science and pedagogy, an **Instructional Fiction** is a statement that is factually incorrect (or incomplete) but is retained because it produces the correct behavioral outcome in the learner. The classic example is telling chemistry students that electrons "orbit" the nucleus like planets. They don't. But if you teach them that, they can do chemistry.

  However, your specific observation adds a layer: *The expert believes the fiction, or at least enacts it unconsciously, even though their body is doing something else.*

  For that specific layer (the expert misreporting their own mechanics), the cognitive science term is **"Introspective Opacity"** (or sometimes **"Expert Amnesia"**). When a skill becomes automatic (unconscious competence), the conscious mind loses access to the actual control signals. When asked to describe the skill, the expert's brain confabulates a plausible story.

  So, the combined phenomenon you are seeing is: **Introspective Opacity generating Instructional Fictions.**

  There is also a philosophical framework dedicated entirely to this: **The Philosophy of "As If" (Fictionalism)**, proposed by Hans Vaihinger in 1911. He argued that humans use "fictions" (ideas we know are logically false or unverifiable) to navigate reality. We act *as if* the head must sink to float, because that fiction organizes the nervous system correctly, even if the mechanics are different.

  ### 2. Why the "False" Cue Works (The Mechanism)

  You asked if it's a placebo. It is not. A placebo works via belief alone. This works via **Proprioceptive Recalibration** and **Attentional Focus.**

  **A. Proprioceptive Drift**
  Novices have terrible internal maps. When a beginner is floating horizontally, their inner ear and neck sensors often scream that they are sinking. They *feel* like they are underwater when they are actually neutral.
  *   **The Reality:** You are neutrally aligned.
  *   **The Student's Feeling:** "I am tilted up."
  *   **The Cue:** "Let your head sink."
  *   **The Result:** The student tilts their head "down" (relative to their skewed perception) until it hits actual neutral.
  If you told them the technical truth ("Align your cervical spine to 0 degrees"), they would lack the proprioceptive resolution to find it. The "false" cue bridges the gap between their broken sensors and reality.

  **B. Internal vs. External Focus**
  Motor learning research (specifically the work of Gabriele Wulf) distinguishes between:
  *   **Internal Focus:** "Extend your knee," "Relax your neck." (Focus on the body).
  *   **External Focus:** "Push the ground away," "Let your head sink into the water." (Focus on the effect).
  External focus cues almost always outperform internal ones for complex skills. "Let your head sink" is an external focus cue (interaction with the water). It triggers subconscious motor programs. "Straighten your neck" is an internal cue. It triggers conscious micromanagement, which increases muscle tension and ruins buoyancy.
  *   **The Paradox:** To get the student to relax (the goal), you must give them a task that sounds like movement ("sink"). The "falsehood" bypasses the conscious tension mechanism.

  **C. Effort vs. Kinematics**
  This addresses your specific swimming observation. You said you are actually using your breathing and lower back, but you tell them about their head.
  *   **Kinematics:** What the camera sees (position).
  *   **Kinesthetics:** What the mover feels (effort/tension).
  It is highly likely that *to you*, the sensation of engaging your lower back and breath **feels like** letting your head sink. In your nervous system, those variables are coupled. You are describing the *feeling* of the skill accurately, even if you are describing the *mechanics* inaccurately. You are teaching them the **sensory target**, not the mechanical route.

  ### 3. Relation to "Knowing How" vs. "Knowing That"

  You mentioned Gilbert Ryle's distinction. Here is how this phenomenon modifies it:

  *   **Knowing How:** Procedural, unconscious (The float).
  *   **Knowing That:** Propositional, conscious (The explanation).

  Ryle assumed that if you have the "How," you might lack the "That." You are observing something sharper: **The "That" required to transmit the "How" is often incompatible with the "That" that describes the "How."**

  To teach the *How*, you must provide a *That* which acts as a **scaffold**. Like a scaffold on a building, it must be sturdy and reach the right height, but it does not need to be made of the same material as the building. In fact, if you build the scaffold out of the building material (technical truth), it might be too heavy or complex for the novice to climb. The "falsehood" is a lighter, climbable scaffold.

  ### 4. Boundaries and Edges

  You asked where the edges are. Here is the taxonomy of when this counts and when it breaks.

  **Does it count if it's a simplification?**
  Yes. Most instructional fictions are simplifications. "Electrons orbit" is a simplification. "Head sinks" is a simplification of total body tension. It counts as long as the simplification *actively contradicts* the expert's actual mechanics but yields the expert's result.

  **Does it count if it's a deliberate metaphor? ("Hold the club like a bird")**
  Yes. This is the purest form of Instructional Fiction. Everyone knows a golf club is not a bird. But the *tension level* required to hold a bird without crushing or dropping it is exactly the tension level required for a golf grip. It transmits a *parameter* (tension) via a *fiction* (the bird).

  **Does it happen in non-physical skills (Therapy/Negotiation)?**
  Absolutely.
  *   **Therapy:** A CBT therapist might tell a depressed client to "Act as if you are happy." The client is not happy. The action is "false." But the behavioral activation often generates the mood.
  *   **Negotiation:** "Walk away from the table." A master negotiator might never intend to walk away. But instructing a novice to "be willing to walk away" changes their posture and tone in a way that makes the deal succeed. The instruction is a fiction (the willingness), but the outcome is real.

  **When does it stop working? (The Danger Zone)**
  Instructional Fictions have a shelf life. They work for **Novice to Intermediate** learners.
  *   **The Plateau:** When the student becomes advanced, their proprioception calibrates. They start to feel what you actually feel.
  *   **The Conflict:** If you keep teaching the fiction to an expert, they will hit a ceiling. An advanced swimmer who keeps trying to "sink their head" will eventually drown themselves. They need the technical truth (lower back engagement) to refine the skill further.
  *   **The Teacher's Trap:** If the *teacher* believes the fiction too strongly (Introspective Opacity), they cannot teach the advanced student. This is why great players don't always make great coaches. They run out of fictions.

  ### 5. Summary Definition

  If you want to coin a term to define the edges properly, I propose:

  **Calibrational Falsehood**
  *A pedagogical instruction that describes a physical or mental state inaccurately relative to the expert's actual performance, but accurately relative to the novice's perceptual errors, serving to recalibrate the novice's motor control systems without triggering conscious interference.*

  **Criteria for a Calibrational Falsehood:**
  1.  **Discrepancy:** Video analysis proves the expert does not do what they say.
  2.  **Utility:** The instruction reliably produces the expert's result in novices.
  3.  **Mechanism:** It works by shifting attention (External Focus) or correcting sensory error (Proprioceptive Recalibration), not by describing mechanics.
  4.  **Obsolescence:** The instruction becomes detrimental or useless at high levels of expertise.

  ### The Takeaway for Your Teaching

  You are not lying. You are **translating.**

  Your body speaks the language of "Expert Mechanics" (lower back, breath). Your students speak the language of "Novice Sensation" (head position, sinking). Your instruction ("Let your head sink") is a translation device. It is a interface between their broken sensors and your functional movement.

  The fact that you discovered your own instruction was "false" via video is a sign of your own growth. You are moving from *Unconscious Competence* (doing it, lying about it) to *Conscious Competence* (knowing what you actually do).

  The next step in your career is to keep using the "false" cue for beginners, but develop the "true" cue (breath/lower back) for the students who outgrow the fiction. That is the mark of a master teacher: knowing which fiction to use, and when to tell the truth.
