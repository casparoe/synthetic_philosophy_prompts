      *   **Goal:** Make it less cartoonish/woo-woo before a knowledgeable reader sees it.
      *   **Constraint:** Interviewing a Madhyamaka scholar (friend-of-a-friend) for one hour. She answers questions with questions. Needs "pressure points." No books available (memory-based discussion).
      *   **Deliverable:** 8-9 interview questions. Each must include:
          *   The Question.
