answer: |-
  ### Purpose Specification: Deliberation vs. Assessment

  The two jobs pull apart. First-personal deliberation requires a decision procedure accessible to agents with ordinary epistemic limits (Requirement 7), whereas third-personal assessment requires objective truth conditions regarding causal or structural relationships (Requirements 1, 3, 4). A single account cannot serve both without fragmentation: what guides the agent (heuristics, rules) will rarely match the precise conditions that make them blameworthy (actual impact, complicity). The specification below treats these as distinct constraints on a theory; an account that fails deliberation may still succeed at assessment, and vice versa.

  ### Candidate Requirements Evaluation

  1. *Case:* Strict zero vs. epistemic uncertainty. Conflating metaphysical nullity with epistemic negligibility collapses distinct explanatory tasks, making this distinction non-negotiable.
  2. *Case:* Single vote vs. voting policy. Obligations attach differently to atomic acts than to aggregated policies, so the account must specify the locus of evaluation to avoid category errors.
  3. *Case:* Beef money spent on chicken. Ignoring replacement effects falsifies the net causal impact, so any account relying on consequences must treat this as non-negotiable.
  4. *Case:* Two sufficient shooters vs. many insufficient ones. Structural differences in causal contribution demand distinct moral treatments, making this conceptual separation non-negotiable.
  5. *Case:* Fluid protest crowds vs. fixed firing squads. Real-world collectives rarely have fixed membership, so an account assuming fixed numbers fails empirical adequacy.
  6. *Case:* Butterfly effect ripple. Unbounded causal chains render deliberation computationally impossible, so this requirement must be optional or strictly bounded.
  7. *Case:* Complex expected utility calculation. Truth conditions for assessment often exceed the cognitive capacity for deliberation, meaning one account cannot satisfy both without fragmentation.
  8. *Case:* Glad non-contributor. Accepting blame without causal impact requires expressive or virtue-theoretic commitments that are not universally shared.

  ### Incompatibilities and The Single Drop

  **Incompatibility:** Requirement 6 (Mediated Effects) and Requirement 7 (Decision Procedure). If an account counts all mediated effects to satisfy assessment accuracy, it becomes unusable for deliberation by agents of ordinary epistemic limits. Conversely, bounding effects for usability sacrifices causal completeness for assessment.

  **The Two Jobs:** Requirement 7 (Decision Procedure) is compatible with Deliberation but often conflicts with Assessment (which prefers Criterion). Requirement 1 (Nullity) is compatible with Assessment but often defeats Deliberation (since agents cannot verify strict zero).

  **Single Requirement to Drop:** Requirement 7 (Criterion versus Decision Procedure). If we drop the demand that the account be usable by someone of ordinary epistemic limits for *deliberation*, the largest family of accounts passes. Expected-difference, Complicity, and Collective-duty accounts all function as valid *assessments* of obligation even if they are too complex to guide real-time choice. Retaining 7 eliminates almost all Expected-difference accounts; dropping it admits them all.

  ### Account Family Scoring

  | Account Type | Deliberation (Req 7) | Assessment (Req 1, 3, 4) | Overall Fit |
  | :--- | :--- | :--- | :--- |
  | **Expected-Difference** | Fail (Too complex/uncertain) | Pass (Handles negligibility) | Split |
  | **Complicity/Membership** | Pass (Rule-based) | Pass (Handles overdetermination) | High |
  | **Collective-Duty** | Fail (Requires coordination) | Pass (Handles open membership) | Split |

  *Note: Scores reflect performance against the non-negotiable requirements identified above.*
