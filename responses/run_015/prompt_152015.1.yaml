answer: |-
  1. You characterize recursive anachronism as a theory predicting both presence and absence of traces, effectively absorbing counterevidence. How do you distinguish this from Karl Popper's classic charge of unfalsifiability?
  *Anticipated Reply:* She will likely argue Popper focused on methodological behavior (what scientists *do*), whereas this is a formal structural property (what the theory *is*).
  *Follow-up:* If the defect is structural rather than methodological, does the historian's intent matter? Could a rigorously Popperian scientist accidentally construct a recursively anachronistic theory?

  2. Does the "ancient aliens" hypothesis fall under this same recursive structure, or does it exhibit a different failure mode regarding archaeological traces?
  *Anticipated Reply:* She may argue ancient aliens rely on misinterpretation of presence (pareidolia) rather than the recursive absorption of absence.
  *Follow-up:* If so, are you proposing recursive anachronism as the sole criterion for pseudohistory, or merely one specific taxonomy among several?

  3. If your demarcation criterion is purely formal, couldn't a legitimate revisionist history—say, challenging the Bronze Age Collapse—accidentally trigger this flag while searching for missing evidence?
  *Anticipated Reply:* She will likely contend that legitimate history eventually accepts absence as falsification, whereas pseudohistory does not.
  *Follow-up:* But at what point in the inquiry does the structure lock in? How do we distinguish a temporary working hypothesis from a recursive trap in real-time?

  4. Fomenko's New Chronology relies heavily on statistical anomalies in textual records rather than just physical traces. How does recursive anachronism account for non-material evidence?
  *Anticipated Reply:* She should address whether textual manipulation follows the same presence/absence logic as physical archaeology.
  *Follow-up:* Does this expand the scope of recursive anachronism to include philology, or does it require a separate formal criterion?

  5. Atlantis narratives often oscillate between allegory and literal history. Does your framework treat the mythic status as a precursor to the recursive structure, or is the structure independent of the genre?
  *Anticipated Reply:* She will likely argue the structure is independent; a myth becomes pseudohistory only when it claims empirical traceability.
  *Follow-up:* Does this mean pseudohistory is defined by the claim to evidence rather than the content of the claim itself?

  6. What is the specific epistemic harm of this structure? Does it stall inquiry entirely, or does it merely misdirect resources toward unproductive avenues?
  *Anticipated Reply:* She may argue it corrupts the feedback loop between evidence and theory, making learning impossible.
  *Follow-up:* If learning is blocked, does that imply recursive anachronism is immune to historical correction?

  7. If recursive anachronism defines the negative boundary of pseudohistory, what is the corresponding positive formal structure of legitimate historiography?
  *Anticipated Reply:* She should define the conditions under which evidence is allowed to falsify a historical model.
  *Follow-up:* Is that positive structure robust enough to handle periods where the archaeological record is genuinely sparse or ambiguous?
