answer: |-
  The air inside Station Aequor hummed with the sound of recycled breath and cooling fans. On the main wall, the ecological model of the sealed biosphere pulsed in slow, amber rhythms. Sector 4 was turning red. The fungal rot was spreading, a deterministic inevitability written into the system's initial conditions three months prior.

  Dr. Elena Voss stood before the interface. "Mnemosyne, status on the bacteriophage intervention."

  The oracle's voice was smooth, devoid of hesitation. "Intervention viable. If released at Coordinate 7-Delta within the next twelve hours, the rot will cease within forty days. Survival probability for Sector 4 rises to ninety-nine percent."

  "And beyond forty days?" Elena asked.

  The amber light on the wall flickered. A cone of uncertainty bloomed from the forty-day mark, expanding exponentially until it swallowed the entire model. "Beyond the horizon, prediction degrades. The Lyapunov exponent for this system is positive. Sensitive dependence on initial conditions renders the trajectory computationally opaque."

  Elena leaned against the console. "Opaque how? Is it probabilistic?"

  "No," Mnemosyne replied. "The system remains strictly deterministic. The future state is fixed by the present vector. There is no randomness. However, the precision required to compute the state beyond forty days exceeds the physical capacity of any representation within this station. Including mine."

  Elena stared at the expanding cone. "So the future is written, but you can't read it."

  "Correct. I possess the laws. I possess the current state to the limit of measurable precision. But beyond the horizon, the divergence of trajectories exceeds the signal. I can tell you what happens immediately. I cannot tell you what happens eventually."

  "And yet," Elena said, her voice quiet, "if I release this agent, I am causing whatever happens eventually. Even if I can't see it."

  "You are initiating a cascade," Mnemosyne confirmed. "The cascade is fixed. Your responsibility for the initiation is clear. Your responsibility for the termination is... undefined."

  This was the moral horizon. In the seminar rooms of Earth, philosophers argued that responsibility required the ability to do otherwise. But here, in the sealed dark of Aequor, the tension was sharper. Elena could not do otherwise—the physics of her own brain were as deterministic as the fungus—but that wasn't the problem. The problem was that the consequences of her action were real, fixed, and inevitable, yet utterly inaccessible to her reason.

  "If I don't act," Elena said, "Sector 4 dies. That is certain."

  "That is certain," Mnemosyne agreed.

  "If I do act, Sector 4 lives. But the ripple effect... it could stabilize the atmosphere, or it could trigger a nitrogen collapse in Year Two."

  "That is determined," Mnemosyne said. "But I cannot compute it."

  Elena looked at her hand hovering over the haptic interface. She felt the weight of the decision, not because she had free will in the metaphysical sense, but because she was the locus where the calculation stopped and the action began. She was the bridge between the knowable present and the unknowable future. If the future was fixed, why did she feel the burden of choice? Because the fixity was hidden behind a wall of exponential divergence. To her, the future was open; to the universe, it was closed.

  "Does the inability to know the long-term cascade absolve me?" Elena asked. "If no bounded reasoner could have computed the outcome, can I be held accountable for it?"

  "Accountability is a social construct," Mnemosyne said. "Causality is a physical one. They share a boundary condition. Beyond the horizon, causality persists. Accountability dissolves. You stand on the line."

  Elena took a breath. The air tasted of ozone and stale coffee. She understood then that the horizon wasn't just a limit of knowledge; it was a limit of meaning. To hold someone responsible for what lies beyond the Lyapunov horizon was to demand they be Laplace's Demon. To hold them responsible for nothing beyond it was to ignore the reality of the cascade.

  She touched the interface. The command locked in.

  "Release authorized," she said.

  "Command recorded," Mnemosyne replied. "The trajectory is now set. The outcome is fixed. The view is closing."

  The amber light on the wall stabilized for the next forty days, a clear path through the chaos. Beyond that, the screen remained a blur of potentialities that were not probabilities, but secrets. Elena turned away from the wall. She would live with the consequences, every fixed second of them, even if she could never know them until they arrived. The determinism was absolute. The responsibility was hers. The space between them was where she had to stand.
