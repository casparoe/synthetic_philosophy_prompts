      *   *Weight-bearing:*
          *   **Endogeneity of Preferences:** States assume pre-existing citizens; AI creates/modify users. (User's Point 1).
          *   **The Demos Problem:** Who counts? Future gens? Non-users affected by externalities? (User's Point 2).
          *   **Coercion/Exit:** States coerce via law; AI coerces via friction/infrastructure dependence. Exit is harder if it's infrastructure.
          *   **The "Neutral" Aggregation:** Arrow's Impossibility, weighting intensity, etc. (User's Point 3).
          *   **Sovereignty:** State has a monopoly on violence to enforce settlements. AI has... terms of service? Who enforces the "constitution"?

  5.  **Evaluating the 4 Conclusions:**
      *   *Conclusion 1 (Don't hardcode values):* Fails. The aggregation mechanism *is* a hardcoded value.
      *   *Conclusion 2 (Aggregate revealed values):* Fails due to endogeneity (preferences are shaped by the tool).
      *   *Conclusion 3 (Procedural fairness = legitimacy):* Fails because procedure hides substantive choices (weighting, framing). Also, losers *do* have complaints if the procedure was rigged by design choices.
      *   *Conclusion 4 (Mechanism design, not moral judgment):* Fails. Mechanism design *is* moral judgment.

  6.  **Addressing the "Regulative Ideal" Defense:**
      *   Can an analogy work as an ideal without descriptive fit?
      *   *Argument:* Only if the ideal is *achievable* or *directionally correct*. If the structural conditions for the ideal (e.g., independent citizens) are absent, the ideal is misleading, not just aspirational. It obscures the power dynamics.
