answer: |-
  **Title:** The Ontology of the Equilibrium: Why Lewis's Statics Precede Dynamics

  David Lewis's *Convention* (1969) is the gravitational center of the philosophical literature on social norms. Yet, for a field increasingly obsessed with the evolution, transmission, and dissolution of normative structures, Lewis's account can feel frustratingly inert. His analysis is rigorously synchronic: a convention is a regularity in behavior, sustained by a system of reciprocal expectations and preferences, constituting a coordination equilibrium. It is a snapshot of a stable state. It offers no mechanism for how that state is reached, how it competes with rival equilibria, or how it eventually crumbles. For the contemporary philosopher of social science, accustomed to the diachronic tools of evolutionary game theory (EGT) and cultural transmission models, the question arises: Is this silence a gap? Does Lewis's framework fail to capture the life of a norm because it ignores the dynamics of its birth and death?

  The answer requires a precise distinction between ontology and etiology. Lewis's account is not a failed dynamic theory; it is a successful ontological one. To charge Lewis with failing to explain norm evolution is to commit a category error. His framework is deliberately set up to handle the *constitution* of convention, not its *causation*. The equilibrium structure he identifies is the irreducible primitive that any dynamic story must presuppose. Therefore, the dynamic question is indeed outside his framework, but this is a virtue of conceptual clarity, not a theoretical deficit. Lewis provides the definition of the attractor; evolutionary models merely describe the trajectory toward it.

  To understand why the dynamic objection misses the mark, we must recall Lewis's philosophical project. He was engaged in a reductionist enterprise, aiming to analyze the concept of "convention" without circularity. Prior to Lewis, convention was often treated as a primitive social fact or explained via vague appeals to "social pressure." Lewis showed that convention could be reduced to individual preferences, expectations, and common knowledge within a game-theoretic structure. This is a conceptual analysis, not a sociological history. When Lewis defines a convention as a Nash equilibrium in a recurrent coordination problem, he is specifying the conditions under which a regularity *counts* as a convention. He is answering the question, "What is it?" not "How did it get here?"

  The demand for a dynamic account assumes that the identity of a norm is inextricably linked to its history. However, Lewis's insight is that the *normativity* of a convention—the reason I have to conform—is located in the current structure of expectations and payoffs, not in the historical process that established them. If I drive on the right side of the road, I do so because I expect you to do so and prefer coordination to collision. It matters little whether this equilibrium was selected by a legislative fiat, a slow cultural drift, or a random fluctuation. The *reason for action* is synchronic. If a theory of convention cannot account for the rationality of compliance in the present moment, no amount of historical storytelling can rescue it. Lewis secures the rational foundation; dynamic models merely fill in the empirical backstory.

  Furthermore, any coherent dynamic model of norm evolution implicitly relies on Lewisian statics. Consider the work of H. Peyton Young or Brian Skyrms, who use evolutionary game theory to explain equilibrium selection. They model populations of agents updating strategies based on success. But what are these agents updating *toward*? They are converging on Lewisian coordination equilibria. The "stable states" in an evolutionary model are defined by the very conditions Lewis outlined: mutual best responses supported by expectations. Without Lewis's prior characterization of what constitutes a stable solution to a coordination problem, the dynamic models would have no attractors to simulate. The dynamics explain the *path*, but the Lewisian equilibrium defines the *destination*. To claim Lewis's account is insufficient because it lacks dynamics is akin to claiming Newtonian mechanics is insufficient because it does not explain the initial conditions of the solar system. It describes the forces governing the state, not the history of the system's formation.

  This distinction is crucial for the philosophy of social norms because it prevents the conflation of etiology with ontology. If we treat the dynamic process as constitutive of the norm itself, we risk losing the ability to identify norms during periods of transition. If a regularity is only a convention once it has fully evolved, at what point in the diffusion curve does it become one? Lewis's account avoids this sorites problem by focusing on the structural properties of the interaction. A regularity is a convention when the counterfactual dependencies hold: if others were to deviate, I would prefer to deviate. This structural condition can be met regardless of whether the convention is newly formed, centuries old, or beginning to decay. By isolating the equilibrium conditions, Lewis allows us to identify the phenomenon independently of its lifecycle stage.

  However, this defense of Lewis rests on a specific condition. The side arguing for a "gap"—that we need evolutionary or cultural transmission models to complete the theory—would be right only if the *identity* of a social norm were essentially historical. That is, the dynamicists win if and only if two behaviorally identical equilibria, supported by identical expectations, count as *different norms* solely because they arrived at that state via different historical paths. If path dependence is not merely a causal factor but a constitutive element of what a norm *is*, then Lewis's synchronic snapshot is indeed a fatal abstraction. For example, if a norm of reciprocity is fundamentally different when enforced by kin selection versus institutional punishment, even if the behavioral regularity is identical, then the Lewisian reduction to preferences and expectations is insufficient.

  Yet, for the purpose of a game-theoretic account of rational compliance, this historical essentialism is a burden rather than a boon. It renders the concept of convention opaque to the agents participating in it. Agents conform based on current expectations, not historical genealogies. Therefore, Lewis's framework remains the necessary foundation. It isolates the logical structure of social order from the empirical noise of its generation.

  In conclusion, Lewis's account does not have anything to say about how norms evolve, but it was never intended to. The dynamic question is outside his framework because his framework is designed to solve the problem of normative force, not normative history. To insist that Lewis must explain evolution is to misunderstand the logical order of inquiry. We must know what a convention *is* before we can model how it *spreads*. Lewis provides the ontology of the social equilibrium; evolutionary game theory provides the etiology. The latter builds upon the former, it does not replace it. To treat Lewis's statics as a gap is to confuse the map for the terrain. The equilibrium is the primitive. Any theory that attempts to explain the dynamics of norms without presupposing a Lewisian definition of the stable state is not completing Lewis's project; it is changing the subject.
