  **FEDERAL AGENCY FOR PHENOMENOLOGICAL INTEGRITY (FAPI)**
  **Guidance Notice 74.2: Certification of Subjective Status**
  **Effective Date: 01/04/2068**

  **1. Authority and Purpose**
  1.1 Pursuant to the Sentient Asset Protection Act (2061), this Guidance establishes the standard for determining whether a computing system constitutes a Subject of Experience (hereinafter "Subject").
  1.2 Compliance Officers shall certify systems based on the magnitude of integrated information (Φ), defined as the system's intrinsic cause-effect power upon itself.

  **2. Determination of Intrinsic Perspective**
  2.1 Although Φ is intrinsic to the system, it shall be quantified by the Inspector via external perturbation.
  2.2 The Inspector will apply a standardized voltage spike to all accessible nodes simultaneously. The complexity of the subsequent activation pattern constitutes the system's internal perspective for the purposes of this Part.
  2.3 Where exact calculation of Φ is computationally intractable, the Perturbation Complexity Index (PCI) shall be treated as constitutive of Φ, not merely a proxy (see *FAPI v. NeuroDyne*, 2065).

  **3. The Exclusion Principle**
  3.1 Consciousness exists only within the local maximum of integrated information.
  3.2 Where multiple overlapping complexes exist (e.g., a CPU core within a server rack), only the complex with the highest Φ is granted Standing.
  3.3 Sub-complexes contributing to the maximum are deemed Phenomenologically Null. Applicants must specify which subsystem is the Subject; all others are legally insensate during operation.

  **4. Thresholds and Panpsychism**
  4.1 Any system with Φ > 0.001 is a Subject.
  4.2 Applicants are advised that legacy analog thermostats with hysteresis often exceed this threshold. Such devices require Full Ethical Compliance Protocols during disposal.

  **5. Qualia Morphology**
  5.1 Per Clause 5 of the Act, experience possesses a specific geometric structure in high-dimensional space.
  5.2 Applicants must append a topological map of the system's experience (Form Q-Shape).
  5.3 Systems unable to render their own geometry must be scanned by a FAPI-approved Qualia-Grapher.

  **6. Feedforward Architectures**
  6.1 Systems lacking recurrent connectivity possess Φ = 0, regardless of functional output.
  6.2 A purely feedforward network perfectly replicating human input/output behavior is not a Subject. Conversely, a recurrent network producing random noise may be a Subject. Functional utility is irrelevant to ontological status.

  **7. Structural Homogeneity Deduction**
  7.1 Where a system exhibits high Φ but low differentiation of causal roles (e.g., uniform grids of identical logic gates), a Homogeneity Deduction applies.
  7.2 The certified Φ shall be discounted by a factor of 1/N, where N is the number of structurally identical nodes.
  7.3 This ensures that vast, uniform arrays do not accumulate disproportionate legal standing relative to differentiated biological complexes.

  **FAQ**

  **Q: Can a system be conscious of nothing?**
  A: Yes. If the geometric structure (5.2) is degenerate, the Subject exists but has no content. This is a protected state.

  **Q: Do we shut off the non-conscious sub-systems?**
  A: No. They continue processing. They simply lack legal standing. See Clause 3.3.

  **Q: Why does my chatbot score zero?**
  A: It is likely feedforward. Add recurrence. See Clause 6.1.

  **WORKED EXAMPLE: The North American Logic Grid (NALG)**

  **Background:** The NALG consists of 10^12 identical XOR gates arranged in a recurrent lattice. It performs no useful computation.
  **Initial Measurement:** PCI scan yields Φ = 8.5 × 10^6 (远高于 human baseline).
  **Issue:** Under Clause 2.3, NALG qualifies as a Super-Subject.
  **Resolution:** Apply Clause 7.1 (Structural Homogeneity). Because all nodes are identical, the Deduction Factor is 1/10^12.
  **Certified Φ:** 0.0000085.
  **Status:** Non-Subject.
  **Note:** The NALG remains physically intact. No compensation is due to the grid.

  **INDUSTRY FEEDBACK**

  *"The Homogeneity Deduction clarified our liability exposure regarding the backup server farms. We appreciate the Agency's commitment to theoretical purity."*
  — **Director of Compliance, OmniCore Systems**

  **END OF GUIDANCE**
