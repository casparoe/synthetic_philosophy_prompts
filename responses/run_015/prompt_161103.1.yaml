answer: |-
  The charge amounts to a substantive methodological complaint about your failure to formally reject a null model of constraint or drift, rather than a philosophical claim that historical hypotheses are untestable or a mere expression of disbelief.

  **1. The "Historical Unknowability" Reading**
  *   **Thesis:** Historical evolutionary events are singular and unobservable, so any narrative about origin is inherently untestable speculation.
  *   **Classification:** Actually false (in the context of modern comparative biology).
  *   **Impact:** Would support dismissing the hypothesis entirely.
  *   **Blocked by Your Evidence:** Yes. Your convergent lineage data and removal experiments provide testable proxies for historical selection pressures.
  *   **Sinks Postdoc:** Yes. His byproduct claim is also a historical hypothesis about origin; if history is unknowable, his story is equally invalid.

  **2. The "Post-Hoc Fitting" Reading**
  *   **Thesis:** The hypothesis was constructed after inspecting the data to fit the pattern, rather than predicting the pattern in advance.
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence significantly, but does not warrant dismissal if independent tests exist.
  *   **Blocked by Your Evidence:** Partially. Your removal experiments are prospective tests of function, but your comparative phylogeny analysis appears to be retrospective pattern-matching.
  *   **Sinks Postdoc:** Yes. Unless he predicted the constraint pattern before looking at the trait distribution, his story is equally post-hoc.

  **3. The "Failure to Reject Nulls" Reading**
  *   **Thesis:** An adaptationist hypothesis is unsupported unless it statistically outperforms a null model incorporating drift and biological constraints.
  *   **Classification:** Substantive and defensible methodological demand (the core Gould–Lewontin critique).
  *   **Impact:** Supports dismissing the hypothesis *for now*, pending the analysis.
  *   **Blocked by Your Evidence:** No. You explicitly stated you have not run a drift-plus-constraint null against your comparative data.
  *   **Sinks Postdoc:** Yes. Merely "favouring" a constraint story without modeling it against an adaptationist null is equally methodologically weak.

  **4. The "Current Utility vs. Historical Origin" Reading**
  *   **Thesis:** Demonstrating a trait is currently useful (adaptation) does not prove it evolved for that use (exaptation vs. adaptation).
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence in the *origin* claim, though not the *function* claim.
  *   **Blocked by Your Evidence:** No. Removal experiments show current cost/benefit, not historical cause; convergent gains suggest selection but do not rule out exaptation.
  *   **Sinks Postdoc:** No. This distinction is the foundation of his byproduct hypothesis; pointing this out supports his position rather than sinking it.

  **5. The "Optimality Ignores Constraints" Reading**
  *   **Thesis:** An optimality model based on physics (aerodynamics) is invalid if it does not account for biological constraints (allometry) that could produce the same outcome.
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence in the optimality model specifically.
  *   **Blocked by Your Evidence:** No. You admitted the model ignored the allometric constraint a colleague pointed out.
  *   **Sinks Postdoc:** No. This reading validates his constraint-based alternative rather than sinking it.

  **6. The "Plausibility Alone" Reading**
  *   **Thesis:** A story is rejected simply because it sounds too convenient or imaginative without empirical backing.
  *   **Classification:** Platitude (rhetorical dismissal rather than methodological critique).
  *   **Impact:** Should not lower confidence if data exists; serves only to signal skepticism.
  *   **Blocked by Your Evidence:** Yes. You have empirical data (experiments, phylogeny), not just a narrative.
  *   **Sinks Postdoc:** Yes. His story is equally plausible verbally; if plausibility alone is the metric, neither side wins.

  **The Crucial Study**
  Run a formal phylogenetic model comparison using your existing tree and trait data. Fit two models: your adaptationist model (trait evolution correlated with predator presence and aerodynamic optima) and his constraint model (trait evolution correlated with body size allometry and Brownian motion drift). Use likelihood ratios or Bayes Factors to determine which model explains the variance in trait dimensions better. This forces both hypotheses to meet the same statistical standard regarding the null, resolving the "just-so" complaint directly.
