  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Medicine course, debating Naturalism (Boorse, Wakefield) vs. Normativism.
      *   **Trigger:** A friend used the "weed analogy" (dandelions aren't biologically weeds, just unwanted plants) to argue for Normativism.
      *   **Task:**
          1.  Create a correspondence table mapping the weed/garden analogy to health/disease.
          2.  Analyze where the analogy cracks (single designer vs. medicine's pluralism, distributed network vs. central gardener).
          3.  Evaluate if the analogy *supports* normativism or just makes it *feel* obvious (rhetorical vs. substantive).
          4.  Suggest alternative analogies (predictive processing, allostasis).
          5.  Distinguish settled vs. contested points in the literature (avoid presenting Boorse/Wakefield as consensus).
      *   **Tone:** Critical, analytical, academic but accessible, nuanced.

  2.  **Deconstruct the Weed Analogy (Correspondence Table):**
