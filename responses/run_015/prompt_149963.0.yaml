answer: |-
  This is a sharp prompt. Your friend has stumbled onto a classic rhetorical move in the philosophy of medicine: using an artifact analogy (the garden) to solve an organismal problem (the body). It's intuitive, but as you suspect, it smuggles in assumptions that do a lot of heavy lifting for normativism without earning them.

  Here is an audit of the weed analogy, mapped against the actual literature, followed by an assessment of where the debate actually stands.

  ### 1. The Correspondence Table: Garden vs. Organism

  To audit the analogy, we first have to make the structural mapping explicit. Your friend is arguing that "disease" is a status conferred by an observer, not an intrinsic property of the object.

  | Garden Analogy | Health/Disease Concept | Philosophical Function |
  | :--- | :--- | :--- |
  | **The Garden** | The Human Body (or Population) | The bounded system under observation. |
  | **The Gardener** | The Patient / Society / Physician | The agent imposing *values* and *goals*. |
  | **The Plan/Design** | Health / Normal Function | The teleological standard (what *ought* to be). |
  | **The Weed** | Disease / Pathology | The violation of the plan (the "bad" outlier). |
  | **Desired Plant** | Health / Normal Physiology | The realization of the plan. |
  | **Soil/Environment** | Social/Physical Environment | Contextual factors influencing growth/function. |
  | **Invasive Species** | Pathogens / External Agents | External threats disrupting the system. |
  | **Removing the Weed** | Treatment / Intervention | Restoring the system to the intended design. |

  ### 2. Where the Analogy Cracks

  The weed analogy is potent because gardens are *defined* by human intent. A dandelion in a meadow is a flower; a dandelion in a lawn is a weed. Your friend argues disease is the same: a trait in one context is health, in another, disease. While true, the analogy breaks down when we inspect the *source* of the norm.

  **A. The "Single Gardener" Problem**
  *   **The Analogy:** A garden implies a singular designer or owner with a coherent plan (e.g., "aesthetic tulips," "high-yield tomatoes").
  *   **The Reality:** Medicine does not have a single gardener.
      *   **Evolutionary "Gardener":** If we look to evolution (as Wakefield does), the "plan" is survival and reproduction. But evolution is blind, not intentional. It produces trade-offs (e.g., inflammation heals wounds but causes tissue damage). Is inflammation a weed or a desired plant? It's both.
      *   **Social "Gardener":** If society is the gardener, we run into the problem of conflicting values. Is deafness a weed? To the medical establishment, often yes. To Deaf culture, no. A garden has one owner; a patient exists in overlapping communities with conflicting "landscape plans."
      *   **The Crack:** The analogy assumes a unified teleology. Medicine operates in a pluralistic value space where the "gardener" is often arguing with themselves.

  **B. Artifact vs. Organism (Internal vs. External Norms)**
  *   **The Analogy:** A weed is defined *externally*. The dandelion doesn't care it's a weed. The norm is imposed from outside the system.
  *   **The Reality:** Biological systems have *internal* norms. A heart has a function (pumping blood) derived from its causal role in the organism's survival, regardless of what the "gardener" (society) wants.
      *   **The Crack:** If a person has a tumor, it is "weedy" not just because we dislike it, but because it disrupts the organism's *own* homeostatic goals. Pure normativism struggles to explain why we don't classify "being unpopular" as a disease. It's unwanted (violates social plan), but it lacks the *biological* failure component. The weed analogy hides the biological constraint by focusing only on the valuation.

  **C. Distributed Network vs. Central Command**
  *   **The Analogy:** The gardener stands outside the garden, observing and acting.
  *   **The Reality:** The body is a distributed network with no central observer. Regulation happens locally (hormonal feedback, neural reflexes).
  *   **The Swap:** If you swap the garden for a **distributed network** (like a forest or the internet), "disease" looks less like a "weed" and more like **node failure** or **signal noise**. In a network, a fault is defined by the disruption of information or energy flow, not by an external aesthetic preference. This moves us back toward naturalism (mechanism failure) rather than normativism (value violation).

  ### 3. Does the Analogy Support Normativism or Just Make It Feel Obvious?

  It makes normativism **feel obvious** without substantiating it. This is a rhetorical sleight of hand.

  1.  **Conflation of Boorse and Normativism:** Your friend said disease is "a statistical outlier we happen to value against." This is actually a confusion.
      *   **Boorse (Biostatistical Theory)** is a **Naturalist**. He argues disease is a *factual* deviation from species-typical function, independent of value.
      *   **Normativists** argue disease is *constituted* by value (badness).
      *   Your friend is mixing them: using Boorse's "statistical outlier" mechanism to drive a Normativist "value against" conclusion. The weed analogy hides this mix. A dandelion *is* biologically distinct from a tulip (fact), but "weed" is the label (value). The analogy works for the *label*, but fails to prove the *underlying condition* is purely value-laden.
  2.  **The "Is-Ought" Gap:** The garden is an artifact; its "ought" (the design) precedes its "is" (the planting). The human body is not an artifact; its "is" (biology) precedes our "ought" (health). Using an artifact analogy to explain an organism begs the question by assuming the body *has* a designer-imposed purpose.

  **Verdict:** The analogy demonstrates that *classification* is value-laden (epistemology), but it does not prove that *disease ontology* is value-laden. It makes normativism feel intuitive by shifting the terrain from biology to landscaping.

  ### 4. A More Honest Analogy: Allostasis and Predictive Processing

  If the garden is too static and design-heavy, consider the **Control System** analogy, specifically drawn from **Predictive Processing** and **Allostasis**.

  *   **The System:** The brain/body is a prediction machine trying to minimize "surprise" (prediction error) to maintain viability.
  *   **Health:** Efficient error minimization. The system accurately predicts metabolic needs and environmental demands (allostatic load is manageable).
  *   **Disease:** Persistent prediction error or allostatic overload. The system's model of the world no longer matches the inputs, or the cost of maintaining stability exceeds energy budgets.
  *   **Why it's better:**
      1.  **Internal Norms:** The "goal" isn't imposed by a gardener; it's intrinsic to the system (stay alive/minimize surprise).
      2.  **Context Sensitivity:** Like the weed analogy, it allows for context. High cortisol is "healthy" during a sprint (predicted need) and "diseased" during chronic stress (prediction error).
      3.  **Biology + Value:** It acknowledges the biological mechanism (neural/hormonal pathways) while admitting that "viability" is a normative threshold (when does stress become suffering?).

  This analogy supports a **Hybrid View** (like Wakefield's) without relying on the "designed artifact" trap of the garden.

  ### 5. Settled vs. Contested in the Literature

  You asked to separate what is actually settled from what is contested. In philosophy of medicine, very little is "settled" in the hard science sense, but there are dialectical shifts.

  **What is largely Settled (Consensus Trends):**
  *   **Pure Naturalism is insufficient:** Very few contemporary philosophers defend a strict Boorsean view that disease is *purely* value-free. The "reference class" problem (which population do we compare against?) and the problem of benign anomalies (e.g., asymptomatic conditions) have weakened strict naturalism.
  *   **Pure Normativism is insufficient:** Conversely, few defend the view that disease is *only* a social label (like Szasz's extreme view on mental illness). The reality of pathogens, genetic mutations, and trauma imposes biological constraints that values alone cannot explain.
  *   **The Hybrid Dominance:** The field has largely moved toward **Hybrid Accounts**. The consensus *direction* is that disease requires *both* a biological dysfunction (naturalist) and a harmful consequence (normativist).

  **What is Genuinely Contested:**
  *   **The Definition of "Dysfunction":** This is the biggest battle.
      *   **Wakefield (Harmful Dysfunction):** "Dysfunction" means a failure of a mechanism to perform its *evolutionarily selected function*.
      *   **Critique:** Evolutionary history is hard to prove. Is a function what it was selected for 10,000 years ago, or what it does now? (e.g., Is anxiety a dysfunction or an evolved defense mechanism firing in the wrong context?)
  *   **The Role of Values:**
      *   **Constitutive vs. Regulatory:** Do values *make* the disease (constitutive normativism), or do values just help us *decide* which biological failures to treat (regulatory normativism)?
      *   **Whose Values?** If disease is partly normative, whose norms count? The patient's? The doctor's? Insurance companies'? There is no agreement on how to adjudicate conflicting values in diagnosis.
  *   **Boorse's Status:** Boorse's Biostatistical Theory (BST) is no longer treated as the "default" naturalist position. It is treated as a rigorous but flawed baseline. It is widely cited, but widely criticized for its handling of "normal function" in aging and varying environments. It is **not** the consensus.
  *   **Wakefield's Status:** Harmful Dysfunction Analysis (HDA) is perhaps the most influential *hybrid* theory, but it is not consensus. Many argue "evolutionary function" is too restrictive (excludes new diseases like laptop-induced wrist pain) or too vague.

  ### Summary for Your Audit

  Tell your friend the weed analogy is a **Category Error**. It maps an **Artifact** (garden) onto an **Organism** (body).
  *   It successfully illustrates that *labeling* involves values.
  *   It fails to explain why some "weeds" (pathologies) kill you regardless of your "gardening plan."
  *   It conflates Boorse's naturalism (statistics) with normativism (values).

  If you want to move the conversation forward, suggest dropping the garden. Try the **Control System** analogy. It preserves the biological reality (mechanisms) while acknowledging the normative threshold (viability/suffering), which is where the actual philosophical work is happening right now.
