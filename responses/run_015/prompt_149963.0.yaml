  5.  **Alternative Analogies:**
      *   *Predictive Processing/Allostasis:* The brain/body as a prediction machine managing energy budgets. Disease = persistent prediction error or allostatic overload. This bridges biology (mechanisms) and value (survival/homeostasis).
      *   *Ecosystem:* Less design-heavy than a garden. Disease = dysbiosis or loss of resilience.

  6.  **Settled vs. Contested in Literature:**
      *   *Settled:* Pure naturalism (value-free) is largely seen as insufficient. Pure normativism (no biological constraint) is also seen as insufficient. Most agree it's a hybrid concept.
      *   *Contested:* The weighting. How much biology vs. how much value? Wakefield's "Harmful Dysfunction" is the leading hybrid, but "dysfunction" is debated (evolutionary design?). Boorse's BST is criticized for reference class problems.
      *   *Consensus Check:* Explicitly state that Boorse and Wakefield are *positions*, not the final word.

  7.  **Drafting the Response (Iterative refinement):**

