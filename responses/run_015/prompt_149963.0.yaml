      *   *Desired Plants* $\rightarrow$ Health/Normal Function.
      *   *Soil Conditions* $\rightarrow$ Environment/Context.
      *   *Invasive Species* $\rightarrow$ Pathogens/External threats.
      *   *Goal:* Map these clearly to show the structural parallels.

  3.  **Analyze the Cracks in the Analogy:**
      *   *The "Gardener" Problem:* Who decides what's a weed? In a garden, it's the owner. In medicine, is it the patient? The doctor? Evolution? Society? Normativism often struggles with *whose* norms count.
      *   *Biological Reality:* Dandelions have specific biological traits (rapid growth, deep roots). Diseases often have specific biological mechanisms (pathogens, genetic mutations), not just "unwantedness." Pure normativism risks ignoring the biological constraint.
      *   *Centralized vs. Distributed:* A garden implies design/intent. The body is an evolved, distributed system. There is no "central gardener" inside us. Allostasis fits better here.
      *   *The "Outlier" Claim:* The friend said disease is just a "statistical outlier we value against." This conflates Boorse (statistical normality) with Normativism (value judgment). Boorse is a Naturalist. This is a crucial distinction to clarify.

  4.  **Evaluate the Normativist Claim:**
      *   Does the analogy prove normativism? No, it illustrates the *concept* of value-laden classification. It doesn't prove that *all* disease classification is purely value-laden without biological grounding.
