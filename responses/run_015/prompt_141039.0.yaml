answer: |-
  ### The Scenario

  You are house-sitting for a friend in an older home. You are standing in the hallway outside the study. The door is closed, and you cannot see inside. You know the study light is controlled by a single switch on the wall inside, but you haven't touched it. In fact, the switch is currently **down** (off), and the light is **off**, but the bulb is **functional**. You, however, do not know the position of the switch, nor do you know for certain if the bulb works (old houses have flickering lights). To you, it is a live possibility that the switch is up but the bulb is blown. Given this mundane uncertainty, consider these two claims you might make to a friend on the phone:

  (1) "If the switch is up, the light is on."
  (2) "If the switch had been up, the light would have been on."

  ### The Check

  **By the speaker's lights (Epistemic Probability):**
  When you assess (1), you are updating your current information state with the supposition that *the switch is up*. In your current information state, the possibility that *the bulb is blown* is live. Since a blown bulb prevents the light from turning on even if the switch is up, there are live epistemic possibilities where P is true (switch up) and Q is false (light off). Therefore, the conditional probability $P(Q|P)$ is not high enough to assert (1). It sounds rash or unassertable.

  **By the closest world (Metaphysical Similarity):**
  When you assess (2), you are looking for the metaphysically closest world to the actual one where the switch is up. In the actual world, the bulb is functional. A world where the switch is up *and* the bulb is functional is much more similar to the actual world (where the bulb is functional) than a world where the switch is up *and* the bulb is blown. Changing the bulb's status requires an extra departure from actuality. Therefore, in the closest P-worlds, the bulb remains functional, and the light turns on. (2) is true.

  **The Gap:**
  The epistemic assessment (1) ranges over all worlds compatible with your knowledge (including "Blown Bulb" worlds). The counterfactual assessment (2) ranges over worlds similar to the actual world (excluding "Blown Bulb" worlds because the bulb is *actually* good). The split arises because your knowledge is incomplete, but the actual world is fixed.

  ### The Dial

  **The feature:** The prior probability that the bulb is functional.
  **How to turn it:** If you turn this probability down (e.g., the house is known to be in disrepair, 50% chance bulb is dead), the split disappears: both (1) and (2) become unassertable. If you turn it up (e.g., the bulb was just installed yesterday, 99.9% chance it works), the split disappears: both (1) and (2) become assertable. The case only works in the "sweet spot" where the bulb's functionality is *metaphysically fixed* in the actual world but *epistemically uncertain* for the speaker.

  ### Two Objections

  **Objection 1: The Epistemic Selection Function.**
  *Critique:* A skeptic might argue there is no semantic difference. They will claim the domain of worlds for (2) is simply restricted by a "normalcy" presupposition that isn't present in (1). They'll say you *are* using different evidence: for (2) you presuppose the house is working order, for (1) you don't.
  *Response:* This begs the question. The "evidence" (the speaker's information state) is stipulated to be identical. The theory must explain *why* the same information state triggers a "normalcy" filter for counterfactuals but not indicatives. The best explanation is that counterfactuals anchor to the *actual world's facts* (bulb is good) via similarity, while indicatives anchor to the *information state's possibilities* (bulb might be bad). That is a semantic, not evidential, difference.

  **Objection 2: Probability as Similarity.**
  *Critique:* Someone might argue that "closeness" just *is* probability. The world where the bulb is good is closer because it is more probable.
  *Response:* If closeness were just probability, (1) and (2) would track the same values. In this case, the "Bulb Good" world is the most probable world *given the speaker's information* as well. If probability drove both, (1) should be just as good as (2). The fact that (1) fails while (2) succeeds shows that Counterfactuals track *actual facts* (the bulb is in fact good), while Indicatives track *epistemic probabilities* (the bulb might be bad). They come apart because Actuality and Knowledge come apart.

  ### Truth vs. Assertability

  In this case, (1) is **unassertable** rather than strictly false. To claim it is false, we must assume the speaker is committed to the "Blown Bulb" possibility being probable enough to falsify the conditional. To claim it is merely unassertable, we assume the speaker follows a norm of asserting conditionals only when the consequent is robust across the epistemic range. The case holds either way: the *verdict* on (1) is negative, while the verdict on (2) is positive, despite identical information.

  ***

  ### Why this meets your specs (and wins the bet)

  1.  **Reverse Split:** Standard cases have (1) True / (2) False. This case is (1) Bad / (2) Good.
  2.  **Same Info:** The speaker's uncertainty is constant. The divergence comes from how the semantics *processes* that uncertainty (updating vs. similarity matching).
  3.  **No Epistemic Rigging:** The speaker has no special evidence. The "Bulb Good" fact is a mundane feature of the actual world, not a private insight.
  4.  **Robustness:**
      *   *Overall Similarity:* A world with a functional bulb is more similar to actuality than one with a broken bulb.
      *   *Causal Wiggle:* Wiggling the switch (P) does not causally affect the bulb's integrity (upstream/independent variable), so the bulb stays good, and Q follows.
  5.  **Professor-Proof:** Your professor claims the split is "epistemic all the way down." This case demonstrates that **Actuality** does work that **Evidence** cannot. The Counterfactual retrieves the fact "Bulb is Good" from the world, even though that fact is not certain in the evidence. If it were purely epistemic, (2) would fail just like (1).
