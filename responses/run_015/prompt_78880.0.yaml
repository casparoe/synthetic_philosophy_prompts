answer: |-
  # Q&A Prep Sheet: Superrationality and Cooperation Workshop

  **Talk Thesis:** The Platonia Dilemma and Luring Lottery are poor showcases for superrationality. They conflate group maximization with individual stability. Platonia's 1/20 mixed strategy is not a Nash equilibrium (unstable to deviation). Luring Lottery's "one entry" is not a best response. These puzzles demonstrate that some situations admit no individually stable cooperative solution, not that ordinary expected-utility reasoning fails.

  **Audience:** 1/3 Decision Theorists (CDT/EDT), 1/3 Experimental Game Theorists, 1/3 Rationalists (FDT/Updateless).

  ---

  ### 1. The "Begging the Question" Challenge (Rationalist)
  **Damage Level:** Critical. If you cannot answer this, your thesis collapses into a simple defense of CDT without engaging the opponent's core premise.
  **Phrasing:** "You argue that the 1/20 strategy in Platonia is unstable because a unilateral deviation pays off. But that assumes my decision is causally independent of the other nineteen. If we are all running the same reasoning algorithm, my decision *logically determines* theirs. If I deviate to 'send,' I must expect the others to deviate too, collapsing the payout. Aren't you just defining superrationality out of existence by insisting on causal independence where logical correlation exists?"

  **Two-Minute Reply:**
  "That is the precise tension I want to isolate. I am not denying that logical correlation *can* exist. My claim is that these specific puzzles do not establish it; they assume it. In Platonia, the trillionaire forbids coordination. There is no source code shared, no common history given, other than the problem statement itself. To say 'if I deviate, they deviate' requires a premise that our reasoning processes are coupled outputs of a single function.

  My point is that if you need to *assume* that coupling to make the cooperation stable, then the lesson isn't 'standard rationality fails.' The lesson is 'cooperation requires a causal or logical link that isn't present in the setup.' If I treat the other nineteen as independent variables, 1/20 is indeed unstable. If you treat them as mirror images, it's stable, but you've imported a constraint the puzzle didn't provide. I am arguing that using this puzzle to teach superrationality hides the cost of that import. It makes it look like magic rather than a specific assumption about algorithmic identity. We should be teaching the cost of the assumption, not just the payout."

  **Where the Reply is Thin:** It risks sounding like you are dismissing logical correlation as "magic" rather than engaging with the FDT claim that logical correlation is a fact of mathematics, not an empirical assumption.
  **What to Concede:** Concede that *if* logical correlation is granted as a premise, FDT wins. Your point is that the puzzle itself doesn't justify granting that premise to a skeptic.

  ### 2. The "Team Reasoning" Distinction (Decision Theorist)
  **Damage Level:** High. This exposes a potential category error in your analysis of "stability."
  **Phrasing:** "You say the 1/20 solution maximizes group payoff but isn't a Nash equilibrium. But isn't that just the definition of 'Team Reasoning' versus 'Individual Reasoning'? If you frame Platonia as a team game, the 1/20 mix *is* the equilibrium. By insisting on individual stability, aren't you just refusing to change the frame? Why is the individual frame the only valid metric for rationality here?"

  **Two-Minute Reply:**
  "Exactly. That is essentially my conclusion. I am arguing that superrationality, in these puzzles, is actually Team Reasoning wearing a mask. When proponents say 'you should cooperate because you are rational,' they are often saying 'you should act as a team agent.'

  The damage comes when we tell students that individual expected-utility reasoning leads to the 1/20 solution. It doesn't. Individual reasoning leads to the 'all send' disaster. To get 1/20, you must switch to a group-utility function. My thesis is that we should be honest about that switch. We shouldn't say 'rationality demands cooperation.' We should say 'rationality demands you maximize your utility, and in this specific game, your utility function must be transformed to match the group's to avoid ruin.' If we admit that, we stop pretending these puzzles refute CDT. They just show that CDT agents need to pre-commit to team-reasoning to survive certain games. The puzzle doesn't break rationality; it breaks the agent's boundary."

  **Where the Reply is Thin:** It leaves open the question of *why* an individual agent should adopt a team utility function without an external enforcement mechanism.
  **What to Concede:** Concede that "Team Reasoning" is a coherent alternative framework. Your objection is to labeling it as the default outcome of "rationality" without qualification.

  ### 3. The "Normative Force" Challenge (Experimentalist)
  **Damage Level:** Medium. This challenges the utility of your talk for anyone who cares about real-world outcomes.
  **Phrasing:** "I work in the lab. In Luring Lottery variants, people always inflate entries. In Platonia variants, they rarely hit the 1/20 mix. If your thesis is that these puzzles show 'no stable cooperative solution exists,' that's a tautology of Nash equilibria. What is the practical takeaway? If superrationality doesn't predict behavior and your critique just says 'defection is stable,' have you told us anything useful about how to actually get cooperation?"

  **Two-Minute Reply:**
  "My takeaway is diagnostic, not prescriptive. If you go into a negotiation thinking 'superrationality guarantees we will find the cooperative optimum,' you will be exploited by someone running best-response reasoning. My talk is a warning against using these puzzles as proof that cooperation is the default rational outcome.

  In your labs, people inflate entries because the incentive structure rewards inflation. That confirms my point: the Luring Lottery is not a cooperation puzzle; it's a tragedy of the commons with a specific payoff curve. If we tell rationalists 'one entry is rational,' they go into the lab and lose. If we tell them 'this game has no stable cooperative equilibrium for independent agents,' they understand they need to change the game—add contracts, add reputation, or add enforcement. I want to stop using these puzzles to justify faith in cooperation and start using them to identify where cooperation is structurally impossible without external intervention. That is useful for designing mechanisms, even if it doesn't help you win the lottery."

  **Where the Reply is Thin:** It is somewhat pessimistic. It offers a way to analyze failure but not a way to achieve success.
  **What to Concede:** Concede that your talk offers a constraint on cooperation, not a method to achieve it.

  ### 4. The "Luring Lottery Limit" Challenge (Rationalist)
  **Damage Level:** Medium-Low. Specific to the second puzzle, tests consistency.
  **Phrasing:** "In the Luring Lottery, you say best-response runs away. But FDT says I should choose the number that, if chosen by all, maximizes my return. That's one entry. If everyone does that, everyone wins. Why is this different from Platonia? Why is the runaway inflation 'rational' but the FDT solution 'unstable'?"

  **Two-Minute Reply:**
  "It differs because the payoff function is continuous. In Platonia, the cliff is binary: one winner or none. In Luring, every extra entry dilutes the prize. The FDT solution of 'one entry' relies on the same logical correlation assumption as Platonia. My critique applies to both.

  However, the Luring Lottery is worse for the superrationalist because the 'defect' move is continuous. I don't have to send a telegram; I can send 1,000,000 entries. If I believe there is even a 1% chance the others are *not* FDT agents, my best response is to inflate massively to swamp them. In Platonia, if I think others are defecting, I might as well not send. In Luring, if I think others are defecting, I *must* defect harder to recoup value. This makes the 'one entry' solution infinitely more fragile in Luring than Platonia. It's not just unstable; it's a repellor. The moment the logical correlation assumption wavers, the system explodes. That makes it a terrible example for teaching stable cooperation."

  **Where the Reply is Thin:** It relies on the intuition of "fragility" without a formal proof of the rate of divergence.
  **What to Concede:** Concede that both puzzles fail under the same logical critique, but Luring is more dramatic due to continuous variables.

  ---

  ### The Question I Hope Nobody Asks

  "If your analysis is correct, then in the Platonia Dilemma, a group of perfectly rational agents following your advice will all send telegrams, nobody will win, and they will all walk away with zero. A group of 'superrational' agents following the 1/20 rule has a high probability of someone winning big. If rationality guarantees a loss in this scenario, why should we call it rationality? Are you defending a definition of rationality that is strictly dominated by superstition?"
