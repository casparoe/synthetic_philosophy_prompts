answer: |-
  To reconstruct Frederick Douglass's mature argument (circa 1851–1860), one must first understand the hermeneutic shift he underwent. In his Garrisonian phase, Douglass read the Constitution as a historical document reflecting the *intentions* of the framers, which he viewed as compromised by slaveholders. In his later phase, influenced heavily by the legal theorist Lysander Spooner, Douglass read the Constitution as a *legal text* standing on its own, interpreted through the lens of natural law and the Preamble's declaration of liberty.

  To make the case you are asking for—that the 1787 Constitution is inherently anti-slavery—you must adopt Douglass's "Liberty-First" interpretive framework. This framework posits that because the Constitution establishes a government to "secure the Blessings of Liberty," no clause can be interpreted to authorize slavery unless the text explicitly and unavoidably compels it. Since the text avoids the language of property in man, the presumption of liberty must prevail.

  Here is the reconstruction of that argument, tackling the specific clauses you identified.

  ### 1. The Fugitive Clause (Article IV, Section 2)
  **The Text:** *"No Person held to Service or Labour in one State, under the Laws thereof, escaping into another, shall, in Consequence of any Law or Regulation therein, be discharged from such Service or Labour, but shall be delivered up on Claim of the Party to whom such Service or Labour may be due."*

  **The Objection:** This clause clearly recognizes a master's right to reclaim a human being, treating them as property that can be "claimed" and "delivered up."

  **The Douglass/Spooner Defense:**
  To defend the reading that this applies only to indentured servants and not chattel slaves, you must attack the legal definition of "Service or Labour" versus "Property."

  *   **Personhood vs. Thinghood:** The clause specifies a **"Person."** In legal theory, a "person" is a rights-bearer; a "thing" (chattel) is not. Chattel slavery defines the enslaved individual as property, not as a person owing a debt. If the enslaved person is property, they cannot be a "Person held to Service." You cannot hold a *thing* to service; you simply use it. By using the word "Person," the Constitution implicitly acknowledges the humanity of the fugitive.
  *   **The Nature of the Obligation:** The clause refers to service or labour **"due."** In common law, labour is "due" only when there is a contract or a legal obligation binding a *will*. Chattel slavery is not based on an obligation owed by the person; it is based on the force of the master. Therefore, a slave is not a person "held to service" under the laws of the state; they are a person held by *force*. The clause protects contractual indentures (where a person legally owes time to a master), not the violent detention of chattel.
  *   **Jurisdictional Limits:** Slavery is a creature of *municipal* (state) law. It has no extraterritorial existence. As soon as an enslaved person crosses a state line, the local law that made them a slave ceases to operate. They become free by the common law of the new territory. This clause is a comity agreement between states to respect *their own* contractual indentures, not a federal mandate to enforce the peculiar laws of slave states upon free states.
  *   **The "Claim" Argument:** The clause says the person shall be delivered up on "Claim of the Party." It does not grant the federal government the power to enforce that claim. It merely prohibits the *state* of refuge from passing laws that automatically emancipate the person. It is a negative restriction on states, not a positive grant of power to the federal government to act as slave-catchers.

  **Strongest Phrasing:** *"The Constitution does not say 'slave.' It says 'Person.' A person cannot be property. Therefore, this clause protects the contract of the indentured servant, not the whip of the slaveholder. To read it as protecting chattel is to read the word 'Person' out of the text."*

  ### 2. The Three-Fifths Clause (Article I, Section 2)
  **The Objection:** This clause rewards slave states by allowing them to count enslaved people toward representation, increasing their political power in Congress.

  **The Douglass/Spooner Defense:**
  You must reframe this not as a bonus, but as a **penalty** and a **denial of legitimacy.**

  *   **The Penalty Argument:** If the Constitution recognized slaves as full property (like horses or land), they would not count for representation at all. Property does not vote. If the Constitution recognized them as full persons, they would count as five-fifths. By counting them as three-fifths, the Constitution strikes a middle ground that actually *reduces* the political power of the slave states compared to if the slaves were counted as free persons.
  *   **The Incentive Structure:** The clause ties representation to taxation. It forces the slave states to pay taxes on a portion of their enslaved population. More importantly, it creates a political disincentive. If a slave state emancipates its population, those people become "free Persons" and count as five-fifths. The state gains political power by ending slavery. Thus, the clause structurally encourages emancipation to maximize representation.
  *   **The Humanity Admission:** By counting them as fractions of persons, the Constitution admits they *are* persons, contradicting the state laws that call them things. It nationalizes their humanity while limiting the master's political profit from their bondage.

  **Strongest Phrasing:** *"The Three-Fifths Clause is not a reward for slavery; it is a tax on it. It tells the slaveholder: 'You claim these people are property? Then they shouldn't count for representation. You claim they are people? Then count them all. You cannot have it both ways.' It reduces the political value of a slave compared to a free man, making slavery a political liability."*

  ### 3. The 1808 Clause (Article I, Section 9)
  **The Objection:** By allowing the migration or importation of persons to continue until 1808, the Constitution legitimized the slave trade for twenty years.

  **The Douglass/Spooner Defense:**
  Focus on the **power to prohibit** rather than the temporary allowance.

  *   **Empowerment to Destroy:** Under the Articles of Confederation, the federal government had no power to regulate commerce or stop the slave trade. The 1808 Clause gave the Federal Government the explicit power to "prohibit" the trade after a specific date. It turned the tide from "allowed forever" to "allowed temporarily, then banned."
  *   **The Taxation Power:** The clause allows Congress to impose a tax on such importation (not exceeding $10 for each Person) *before* 1808. This gives the federal government the power to make the trade economically unviable immediately, if they chose.
  *   **The Expiration Date:** A document that intends to protect an institution does not put an expiration date on its supply line. By setting a date (1808) after which the trade *must* be open to prohibition, the Framers signaled that the trade was an evil to be terminated, not a right to be protected.

  **Strongest Phrasing:** *"This clause does not guarantee the slave trade for twenty years; it guarantees the power to kill it after twenty years. It transformed the African slave trade from a protected right into a temporary indulgence with a fixed expiration date. It is a clause of restriction, not authorization."*

  ### 4. The Absence of the Word "Slave"
  **The Objection:** Is this just a semantic trick? The reality of slavery was well understood; euphemisms don't change legal reality.

  **The Douglass/Spooner Defense:**
  You must be honest here: This is not a dispositive legal argument on its own, but it is a crucial **interpretive key.**

  *   **The Argument from Shame:** Douglass argued that the Framers were ashamed of slavery. They refused to stain the "deed of liberty" with the word "slave." This silence indicates that slavery was not intended to be a national institution, but a local regret.
  *   **The Rule of Strict Construction:** In legal interpretation, powers must be explicitly granted. If the Constitution never mentions "slavery" or "property in man," then the Federal Government has no delegated power to support it. The government can only do what the text says. If the text doesn't say "support slavery," the government cannot do it.
  *   **Weight:** Place moderate weight on this. It supports the "Liberty-First" hermeneutic. It allows you to argue that because the Constitution speaks the language of liberty ("Person," "Citizen," "Free"), any ambiguity must be resolved in favor of liberty.

  **Strongest Phrasing:** *"The Constitution is a charter of powers. If the power to hold slaves is not written there, it does not exist. The Framers refused to write the word 'slave' because they knew it had no place in a free government. Their silence is our liberty."*

  ### 5. The Preamble as the Controlling Purpose
  To tie this all together, you must argue that the Preamble controls the specific clauses.

  *   **"Secure the Blessings of Liberty":** This is the mission statement. You cannot interpret Article IV (Fugitive Clause) in a way that destroys the Preamble (Liberty).
  *   **The General Welfare:** Slavery is detrimental to the general welfare. Therefore, federal powers must be used to limit it, not expand it.
  *   **The Argument:** The specific clauses (3/5ths, 1808, Fugitive) are compromises necessary to form the union, but they must be read narrowly so as not to defeat the primary purpose of the union (Liberty). They are exceptions to the rule of liberty, and exceptions must be construed strictly.

  ### Summary of the Case
  To argue Douglass's later position seriously, you are arguing for a **Federalist Anti-Slavery** position.

  1.  **Slavery is State Law:** The Federal Constitution creates a government of delegated powers. Nowhere is it delegated the power to create or sustain slavery. Therefore, slavery exists only where state law explicitly creates it.
  2.  **Federal Neutrality:** The Federal Government must be neutral. It cannot be a "slave-catching government." The Fugitive Clause restricts states from emancipating fugitives by statute, but it does not require the Federal Government to enforce the master's claim.
  3.  **Liberty is the Default:** In any ambiguity (like the word "Person"), the presumption of natural liberty (from the Declaration and Preamble) must win.

  **The Honest Assessment:**
  You asked how much weight to place on the word "slave." Be careful. Historically, the pro-slavery argument (like Chief Justice Taney in *Dred Scott*) was that the *intent* of the Framers protected property rights in slaves, regardless of the specific words. Douglass's argument is legally stronger if you admit that the text is ambiguous but insist that **natural law resolves the ambiguity.**

  Douglass's genius was to argue that the Constitution, divorced from the corrupt intentions of the men who signed it, was a "glorious liberty document." To defend this, you must argue that the text provides the *tools* for abolition (the power to ban the trade, the reduction of representation, the recognition of personhood) without providing the *mandate* for slavery.

  **Final Argumentative Pitch:**
  *"The Constitution of 1787 did not establish slavery; it tolerated it temporarily while building the legal machinery to restrict it. It speaks of 'Persons,' not property. It reduces the political value of the enslaved. It sets a death date for the slave trade. It grants no federal power to protect bondage. Read on its own terms, without the gloss of the pro-slavery compromises of the 1850s, the Constitution is a weapon against slavery, waiting for the hand of a free people to wield it."*
