prompt: |-
  You are a professional philosopher of mind with expertise in personal identity and metaphysics of agency, writing for an audience accustomed to rationalist and effective-altruist discussions of consciousness and decision theory. Before you answer, briefly outline the three or four leading theories of diachronic identity that specialists actually treat as live options, and flag which parts of each are settled versus genuinely contested.

  Here is the practice I want examined. In several European jurisdictions, psychiatric review boards apply a formal evaluation called the Continuity Protocol whenever a patient has undergone radical personality-altering therapy — for example, reconstruction following severe dissociative disorder or extensive neuropsychiatric intervention. The board must determine whether the post-therapy individual retains the pre-therapy person's contractual obligations, property rights, criminal liabilities, and medical advance directives. Biological continuity is explicitly not required. Instead, the board scores the case across four axes: autobiographical coherence, predictive behavioral threading, relational recognition by close others, and normative commitment stability. Predictive behavioral threading receives double weight. If the weighted aggregate exceeds a threshold, the board rules that the same agent persists; if it falls below, the prior legal identity is treated as dissolved and a new guardianship or estate structure is initiated.

  What philosophical commitments does this institutional practice presuppose? Reconstruct the implicit theory of the self: does it align with Daniel Dennett's conception of the self as a center of narrative gravity, or does it combine elements of psychological-continuity theory, relational identity, and functionalist behaviorism? Be precise about which procedural rules are philosophically loaded and which are merely administratively convenient. Distinguish what the protocol strictly requires from what it merely happens to accommodate, and say whether the four axes hang together as a single coherent metaphysics or whether they are philosophically underdetermined, licensing rival interpretations.

  Then assess internal consistency. Does weighting predictive threading over autobiographical coherence presuppose a forward-looking, decision-theoretic conception of agency that conflicts with the backward-looking logic of criminal liability? Would replacing the underlying view with a biological-essentialist account, or with a purely experiential moment-to-moment view that denies diachronic identity altogether, force a complete redesign of the board's procedures — and if so, which specific rules would have to change?

  Please separate what is settled in the philosophy of personal identity from what remains genuinely contested among people who know the literature, and do not present any contested claim — for instance, about whether narrative coherence is necessary or sufficient for identity — as if it were the consensus position. You should not provide bibliographies, reading lists, or citations; the reasoning should be fully accessible to a model without web access.
