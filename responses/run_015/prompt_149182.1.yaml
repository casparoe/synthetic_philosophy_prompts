answer: |-
  ### I. The Landscape of Diachronic Identity: Live Options and Contested Ground

  Before analyzing the Continuity Protocol, we must map the metaphysical terrain. In contemporary analytic philosophy, there is no consensus on the necessary and sufficient conditions for personal identity over time. However, three to four positions are treated as "live options" in the literature.

  1.  **Psychological Continuity Theory (Lockean/Parfitian):**
      *   *Core Claim:* Person A at time $t_1$ is identical to Person B at time $t_2$ if and only if B possesses a sufficient chain of overlapping psychological connections (memories, intentions, character traits) with A.
      *   *Settled:* The definition of the criteria relies on causal connections between mental states, not substance.
      *   *Contested:* Whether continuity must be non-branching (the "fission problem"), whether it admits of degrees (Parfit's reductionism), and whether it requires conscious access to memories or merely functional dispositional continuity.

  2.  **Biological Continuity (Animalism):**
      *   *Core Claim:* We are fundamentally human organisms. Identity persists as long as the biological life of the organism persists, regardless of psychological disruption.
      *   *Settled:* The criteria rely on somatic/physiological continuity (metabolism, homeostasis).
      *   *Contested:* Whether "person" is a sortal distinct from "organism," and how this view handles cases of brain transplants or radical cognitive offloading.

  3.  **Narrative Self-Constitution (Dennett/Schechtman):**
      *   *Core Claim:* Identity is not a discovered metaphysical fact but a constituted status. A person exists insofar as a coherent life-story is generated and maintained, either by the subject or the community.
      *   *Settled:* Identity is treated as a functional or social construct rather than a brute physical fact.
      *   *Contested:* Whether the narrative is constitutive of identity or merely epistemic (how we *know* identity vs. what identity *is*), and who holds the authority to validate the narrative (the subject vs. the community).

  4.  **Skepticism / No-Self (Humean/Buddhist):**
      *   *Core Claim:* There is no persisting self. Diachronic identity is a fiction useful for language and coordination but metaphysically false.
      *   *Settled:* None. This is a eliminativist challenge to the presupposition of the other three.
      *   *Contested:* Whether this view is practically livable or legally coherent.

  **Crucial Flag:** It is *not* settled which of these is true. Any institutional policy that adopts one as operational truth is making a metaphysical wager, not applying a scientific consensus.

  ---

  ### II. Reconstructing the Implicit Theory of the Continuity Protocol

  The Continuity Protocol, as described, explicitly rejects Biological Continuity. By scoring identity across autobiographical, behavioral, relational, and normative axes, it operationalizes a **Hybrid Functionalist-Narrative Theory**.

  #### 1. Alignment with Dennett vs. Psychological Continuity
  The protocol aligns closely with Daniel Dennett's "Center of Narrative Gravity," but with a significant functionalist modification.
  *   **Narrative Element:** The axis of *Autobiographical Coherence* treats the self as a story that must hang together. If the patient cannot integrate the pre-therapy and post-therapy states into a single intelligible history, identity is weakened. This is classic Dennett: the self is the abstraction around which the narrative orbits.
  *   **Functionalist Deviation:** However, the double-weighting of *Predictive Behavioral Threading* moves beyond pure narrative. Dennett's view is often interpretative; this protocol is *instrumental*. It cares less about whether the story is "true" and more about whether the system can predict the agent's future moves based on past data. This incorporates a **Decision-Theoretic conception of agency**: an agent is the same if their utility function and decision algorithms remain stable enough to be modeled continuously.

  #### 2. The Four Axes: Metaphysical Load vs. Administrative Convenience
  *   **Autobiographical Coherence (Loaded):** This presupposes that memory and self-conception are constitutive of identity. It rules out Animalism.
  *   **Predictive Behavioral Threading (Heavily Loaded):** This is the most philosophically aggressive rule. It privileges *future reliability* over *past origin*. It implies that identity is partly a matter of *capacity for accountability*. If the board cannot predict you, you are not the same agent, regardless of your memories.
  *   **Relational Recognition (Loaded):** This adopts an **Externalist** view of identity. It suggests that being a "person" is a social status granted by others, not an intrinsic property. If your spouse does not recognize you, your identity is metaphysically diminished.
  *   **Normative Commitment Stability (Loaded):** This ties identity to moral agency. It presupposes that a change in fundamental values (e.g., becoming pacifist after being aggressive) might constitute a death of the self.
  *   **The Threshold Mechanism (Administrative):** The use of a weighted aggregate threshold is administratively convenient to solve the Sorites Paradox (at what exact point does change become replacement?), but it is metaphysically arbitrary. Identity is traditionally viewed as an equivalence relation (transitive, symmetric, reflexive), not a matter of degree. The protocol treats identity as scalar, which is a pragmatic override of classical logic.

  #### 3. Coherence of the Axes
  Do the axes hang together? They form a coherent **Pragmatic Personhood** metaphysics, but they are underdetermined regarding *truth*.
  *   **Tension:** *Autobiographical Coherence* is backward-looking (did the story connect?), while *Predictive Threading* is forward-looking (can we model the future?). These can come apart. A patient might remember everything (high coherence) but behave erratically (low threading). The protocol resolves this by weighting prediction higher. This reveals the protocol's true commitment: **Identity is for the sake of Coordination.** The metaphysics is subordinate to the goal of social stability.

  ---

  ### III. Assessment of Internal Consistency

  The most significant friction in the Continuity Protocol lies in the conflict between its forward-looking criteria and the backward-looking nature of certain legal obligations.

  #### 1. The Liability Tension
  *   **The Conflict:** *Predictive Behavioral Threading* justifies identity based on future manageability. *Criminal Liability* is traditionally retributive or backward-looking (you pay for what *that* person did).
  *   **The Inconsistency:** If the board rules that an agent persists *because* they are predictable, it is justified to bind them by contracts (forward-looking coordination). However, holding them criminally liable for pre-therapy acts becomes philosophically precarious. If identity is grounded in future prediction, punishing past acts of a psychologically distinct precursor looks like punishing a different person for the sake of social utility.
  *   **Resolution within the Protocol:** The protocol implicitly adopts a **Consequentialist Theory of Punishment**. It assumes that if the post-therapy agent is functionally continuous enough to be predicted, they are also the appropriate target for deterrence. This sacrifices retributive justice (desert) for systemic stability.

  #### 2. Forward vs. Backward Logic
  The protocol privileges the **Decision-Theoretic Self** (an entity that maximizes utility over time) over the **Historical Self** (an entity defined by its origin).
  *   **Consistency Check:** This is internally consistent *if* the goal of the legal system is purely regulatory. It is inconsistent if the legal system claims to track "moral truth." The protocol admits that biological truth is irrelevant; thus, it must also admit that "moral truth" about past actions is secondary to "functional truth" about future behavior.

  ---

  ### IV. Impact of Alternative Metaphysics

  If the underlying metaphysical view were swapped, the Continuity Protocol would not merely need tweaking; it would require a complete architectural redesign.

  #### 1. Switch to Biological-Essentialism (Animalism)
  *   **The Change:** Identity tracks the living organism, regardless of psychology.
  *   **Procedural Impact:**
      *   **Abolish the Board:** The review board becomes redundant. If the body survives, the person survives.
      *   **Contractual/Criminal:** All obligations persist automatically. No threshold scoring is needed.
      *   **Advance Directives:** Pre-therapy directives would *always* bind the post-therapy individual, even if they have no memory of them and reject the values.
      *   **Rule Change:** The "Biological continuity is explicitly not required" clause would be inverted to "Biological continuity is the *only* requirement."

  #### 2. Switch to No-Self / Momentary Experientialism
  *   **The Change:** There is no diachronic identity. Only momentary person-stages exist.
  *   **Procedural Impact:**
      *   **Dissolution of Obligations:** Strictly speaking, no past obligation can bind a present person-stage.
      *   **Guardianship:** *Every* therapy session (or potentially every day) could trigger a new guardianship review.
      *   **Property Rights:** Property could not be "owned" over time, only held in trust by successive stages.
      *   **Rule Change:** The threshold mechanism would be removed. Instead of "Same vs. New," the system would operate on "Successor Liability" rules (similar to corporate mergers), where the new stage accepts liabilities as a condition of receiving resources, not because they are the *same* person.

  ### V. Conclusion: The Metaphysical Wager

  The Continuity Protocol is not a neutral application of science. It is a codified commitment to **Reductionist Psychological Continuity tempered by Social Functionalism**.

  *   **Settled vs. Contested:** The protocol treats contested claims (that narrative and behavioral continuity are sufficient for identity) as settled operational facts. It ignores the live option of Animalism entirely.
  *   **Philosophical Load:** The double-weighting of *Predictive Behavioral Threading* is the most philosophically loaded rule. It reveals that the state values **governability** over **ontological accuracy**. It defines the self not as what *is*, but as what can be *modeled*.
  *   **Coherence:** The system is coherent only if one accepts that legal personhood is a tool for social coordination rather than a reflection of metaphysical reality. If one believes legal personhood *must* track metaphysical truth, the protocol is inconsistent, particularly regarding criminal liability.

  For a rationalist audience, the takeaway is that the Continuity Protocol treats personal identity as a **variable in a loss function**. It minimizes social disruption (by maintaining contracts where prediction is possible) while allowing for "reset" (guardianship) when the agent becomes too noisy to model. It is a pragmatic solution to a metaphysical problem, explicitly prioritizing decision-theoretic utility over ontological purity.
