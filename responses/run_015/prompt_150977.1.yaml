answer: |-
  The cold came in first, as it always did in the East Gallery, settling into the marrow of the floorboards before it touched the shelves. Elias pulled his cardigan tighter. He could feel the books reacting to the drop in temperature; the leather spines contracted with soft, ticking sounds, like cooling engine blocks, and the text within them grew smaller, tighter, shrinking away from the chill into a microscopic, melancholic script. That was the nature of the collection. They breathed with the room. When Elias was angry, the pages warmed and the ink bloomed red and loose. When he grieved, the paper stiffened and the words turned to ice.

  He stood before the mahogany desk. On it lay a volume that did not belong.

  It was slim, bound in a grey cloth that felt neither warm nor cold, utterly inert. It had not been there when he locked up yesterday. Elias knew this with the certainty of routine. He locked the East Gallery. He checked the latches. He walked the perimeter. The frame of his world was solid.

  Yet, here it was.

  Elias reached out, his fingers hovering. To touch it was to introduce his own emotional temperature, to contaminate the evidence. He pulled back. The problem was not the book itself; it was the silence surrounding it. In a logical system, when a new variable is introduced, one must update the database. But the database was vast. There were four thousand manuscripts in the East Gallery alone. If he accepted the grey book into the catalog, he had to verify the state of the collection to ensure consistency.

  He could not check four thousand books. He did not have the time, and perhaps, he did not have the mind for it anymore. He had to rely on inertia.

  *Premise one:* All books in the East Gallery are handwritten scripts responsive to humidity and heat.
  *Premise two:* The grey book is in the East Gallery.
  *Observation:* The grey book is printed type, inert to touch.

  Conflict. The default rule was blocked for the grey book. It was an exception. But what of the others? The frame problem whispered to him from the shadows of the stacks. When the grey book appeared, did it change only itself? Or did its presence alter the conditions that sustained the rest?

  Elias closed his eyes. He needed to reason by exclusion. He assumed that unless there was evidence of change, the state of affairs remained constant. This was how he had survived seventy years. The sun rises, the sun sets. The books are handwritten. The tea is hot.

  He opened his eyes and looked at the shelf behind the desk. Row Four, Section B. The *Memoirs of a Glassblower*. He remembered it clearly from yesterday evening. It was handwritten, the ink flowing in a cursive loop that mirrored the glassblower's breath. It was currently cold, so the script should be tiny.

  He walked to the shelf. He did not pull the book out. To pull it was to commit. Instead, he reasoned.

  *Inference:* The grey book appeared overnight. No alarm sounded. No window broke. Therefore, no external agent entered to alter the other books. Therefore, the *Memoirs* remain handwritten.

  It was a safe inference. It was the only way to function. If he had to verify every fact upon every new observation, he would never leave the desk. He would be paralyzed by the potential flux of the world. So he accepted the inference. The *Memoirs* are safe. The *Catalogue of Birds* is safe. The *Letters from the Front* are safe.

  He returned to the desk and opened the grey book.

  The pages were blank. Not empty, but blank—a specific, curated nothingness. As he watched, words began to form, not in ink, but in indentation, pressing into the paper from the other side. They were printed. Mechanical.

  *I am the exception,* the text read. *I am the change.*

  Elias felt a spike of irritation. Heat rose in his chest. He felt the books around him respond instantly; the leather spines creaked as they expanded, the text within them swelling, becoming bold and passionate. He waited for the surge to pass.

  He needed to catalog the grey book. To do so, he needed to assign it a category. If it was an exception, did it invalidate the rule for the shelf?

  *Rule:* East Gallery shelves maintain handwritten integrity.
  *Exception:* Grey book is printed.
  *Conclusion:* The shelf's integrity is compromised.

  If the shelf's integrity was compromised, then the inheritance of traits was blocked. He could no longer assume the other books were handwritten simply because they were on the shelf. The category "East Gallery" no longer guaranteed "Handwritten."

  Elias felt a coldness that had nothing to do with the winter morning. He looked back at Row Four, Section B.

  He had assumed the *Memoirs* were safe. He had assumed that because he saw no change, there was no change. This was the monotonic trap. He believed truth only accumulated, that facts stayed true until proven false. But here, the context had shifted. The arrival of the grey book changed the definition of the Gallery. It wasn't a physical change to the *Memoirs*; it was a logical invalidation.

  He walked back to the shelf. His hand trembled. He pulled out the *Memoirs of a Glassblower*.

  It was light. Too light.

  He opened it. The pages were not handwritten. They were printed. Small, crisp, mechanical type, identical to the grey book.

  He hadn't noticed. He had walked past this shelf a dozen times since sunrise. His eyes had scanned the spines, recognized the leather, recognized the placement, and his mind had filled in the rest. *It is leather, therefore it is handwritten.* He had inherited the property without checking the instance.

  When did it change? Had it changed when the grey book appeared? Or had it changed weeks ago, and he simply hadn't updated his model of the world because nothing forced him to?

  He dropped the book. It landed with a dry slap.

  He looked around the gallery. Four thousand volumes. How many were printed now? How many had changed their text from sorrow to joy while he slept? How many had vanished entirely, leaving only the shadow of their weight on the shelf, waiting for him to notice the absence?

  He couldn't check them all. To check one was to alter its temperature, to change its text again. To observe was to disturb.

  He returned to the desk and sat down. The grey book waited.

  *I am the change,* it said.

  Elias realized then that the frame problem was not a puzzle for robots. It was the architecture of aging. It was the quiet terror of waking up and assuming your wife is still alive, assuming your house is still standing, assuming your name is still yours, simply because nothing has told you otherwise yet. You operate on defaults. You assume stability. And then, one morning, you find a grey book on the desk, and you realize you cannot verify the contents of your own life without rewriting them.

  He looked at his hands. They were spotted, thin. He assumed they were his. He assumed the memory of his mother's face was still stored in the back of his mind, handwritten and safe. But what if that shelf had been compromised too? What if the category "Memory" no longer inherited the trait "True"?

  He reached for the *Memoirs* again, but stopped. If he opened it, he would warm it. The text would shift. He would never know what it had been before he touched it. He would only know what it was now, in the presence of his fear.

  The silence of the gallery pressed in. He had to make a decision. He could spend the rest of his days checking every spine, invalidating every assumption, knowing that by the time he finished the last shelf, the first would have changed again. Or he could accept the inference.

  He could assume the *Memoirs* were handwritten. He could assume his mother's face was clear. He could assume the grey book was the only exception.

  It was a lie. He knew it was a lie. The logic was broken. The inheritance was blocked. But it was the only way to turn the page.

  Elias picked up his pen. He opened the catalog ledger. Under *Location: East Gallery*, he wrote: *Status: Stable.*

  He knew it wasn't. He knew that as soon as the ink dried, the statement might be false. But he had to write it. He had to frame the world, even if the frame was rotting. He wrote the date. He wrote his name.

  He paused, the pen hovering over the paper. For a second, just a second, he couldn't remember if he had written his name yesterday. He couldn't remember if the ink was supposed to be blue or black. He couldn't remember if the hand holding the pen was actually his.

  He pressed the nib to the paper. He assumed the ink would flow. He assumed the paper would hold. He assumed he was Elias.

  The ink flowed. He let out a breath he didn't know he was holding, and trusted, until proven otherwise, that he was still there.
