answer: |-
  **Kal:** Mara, welcome. Our topic is whether deep cross-cultural disagreement justifies relativism. You argue it does. Why?

  **Mara:** Because the best explanation for persistent, intractable moral disagreement is that there is no single moral truth to be found. When cultures disagree on fundamental values—say, the priority of individual liberty versus communal harmony—they aren't failing to see the same objective fact. They are operating within different normative frameworks that constitute what counts as a "fact" for them.

  **Kal:** But disagreement doesn't entail relativism. Physicists disagreed fiercely about quantum interpretation for decades. We didn't conclude physics was relative to the physicist. We assumed there was a truth they were trying to locate.

  **Mara:** A fair analogy, but incomplete. In science, we have shared methodologies—experimentation, observation—that eventually force convergence. In morality, there is no neutral arbiter. When disagreement persists despite full information and rationality, the universalist must insist everyone except them is mistaken. That seems arrogant. Relativism explains the data without positing invisible facts.

  **Kal:** But consider moral progress. We look at the abolition of slavery or the expansion of women's rights as *improvements*, not merely changes. If morality is framework-relative, how can you say the 19th century was morally *wrong* about slavery? You could only say it violated *our* current framework.

  **Mara:** I can say it was wrong relative to the framework we now occupy, which I endorse. Progress isn't moving closer to a Platonic form of Justice; it's the refinement of our own shared commitments. We realized slavery contradicted our professed values of autonomy. That's real progress *for us*, without needing a view from nowhere.

  **Kal:** That works internally, but it silences cross-cultural criticism. If a culture practices honor killing or foot-binding, and their framework supports it, can you genuinely condemn it? Or must you say, "Well, that's true for them"?

  **Mara:** I can condemn it. Relativism isn't tolerance; it's a meta-ethical claim about truth. I can argue their practices cause unnecessary harm or violate coherence within *their* own broader values. I don't need universal truths to advocate for my framework over theirs. I can say, "Your practice is wrong according to the standards I uphold," and fight for those standards to be adopted.

  **Kal:** But that reduces moral criticism to power struggles. If I say "slavery is unjust," I mean it's unjust *period*, not just "unjust according to Mara." You're asking us to believe that our deepest moral convictions are merely expressions of local preference.

  **Mara:** I'm asking you to acknowledge where those convictions come from. Here is my challenge to you, Kal: How do you access these mind-independent moral truths? All our reasoning begins within a cultural framework. We use language, concepts, and intuitions shaped by our history. If you claim to see universal truths, you're claiming to leap out of your own skin. What is your epistemology?

  **Kal:** We don't need to leap out of our skin to recognize constraints upon it. We share a common human nature—capacities for suffering, reasoning, and flourishing. While our concepts are culturally shaped, reason allows us to critique those shapes. When we argue against foot-binding, we appeal to pain and autonomy, which are intelligible across cultures. The fact that we can persuade others suggests we are tapping into something shared, not just imposing power.

  **Mara:** Persuasion shows overlap, not objectivity. We can share human nature and still derive different norms from it. You assume that because we *can* reason together, we *must* be converging on a single truth. I think we are merely negotiating overlapping interests.

  **Kal:** And I think that negotiation presupposes a standard of fairness we are both trying to honor.

  **Mara:** So, here is where we stand. You believe that without objective moral facts, moral progress is an illusion and criticism is mere coercion.

  **Kal:** Precisely. And you believe that without acknowledging our cultural embeddedness, universalism is epistemologically mysterious and intellectually arrogant.

  **Mara:** Then our deepest disagreement isn't about specific cases like slavery. It's metaphysical. You think moral truths must exist independently to be real. I think moral truths are real precisely because they are constituted by our committed practices.

  **Kal:** And I suspect that unless we can resolve whether morality is discovered or invented, we'll keep talking past each other.

  **Mara:** Agreed. Perhaps that's the work for the rest of the symposium.
