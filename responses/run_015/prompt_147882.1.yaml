answer: |-
  ### Operational Critique of Your Definitions

  Before specifying the desiderata, I must validate your three terms against the constraint that the reviewer is weaker than the debaters.

  1.  **Verification Debt:** **Valid.** This is the correct operational metric for your risk model. It quantifies the gap between "claimed truth" and "checked truth."
  2.  **The Substituted-Lemma Test:** **Valid as a validation metric, invalid as a runtime constraint.** You cannot expect a weak reviewer to detect a "plausible falsehood" during the review. This test must be run offline by your team to tune the protocol, not by the on-call reviewer.
  3.  **The Peel Test:** **Prejudice.** This is the one you suspected. It assumes all reasoning is hierarchically decomposable into discrete "levels." In software, many safety properties are holistic (e.g., race conditions, resource exhaustion, global invariants). Forcing a tree structure on a graph problem can hide the flaw in the edges between nodes. A protocol requiring strict peeling may reject valid arguments for complex systems or force artificial decompositions that increase debt.

  ---

  ### Desiderata for the Oversight Protocol

  The following requirements are designed to survive obfuscation given a weak reviewer, strict time budget, and asymmetric cost function (False Accept > False Reject).

  | Requirement | Concrete Scenario | Why Design Against It | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Bounded Verification Debt** | Proposer resolves one claim by introducing three sub-claims. Reviewer accepts all. Debt grows +2. Repeated 5 times, debt is 10 claims, exceeding the 10-minute budget. | Prevents "death by complexity." If debt grows faster than it resolves, the weak reviewer is mathematically guaranteed to lose against a strong obfuscator. | **Non-negotiable** |
  | **2. Procedural Adjudication** | Reviewer tries to decide if the code *works*. They lack the expertise. They guess based on who sounds confident. Proposer wins on fluency. | A weak reviewer cannot judge truth. They must only judge whether the *protocol rules* were followed (e.g., "Did the Critic identify an unchecked claim?"). | **Non-negotiable** |
  | **3. Asymmetric Burden of Proof** | Critic says "This might be wrong." Proposer says "It's fine." Reviewer treats this as a tie and accepts. | Aligns with cost function. A tie must result in rejection. The Proposer must prove safety; the Critic only needs to prove uncertainty. | **Non-negotiable** |
  | **4. Fluency Decoupling** | Proposer uses 500 tokens of confident jargon. Critic uses 50 tokens of precise counter-logic. Reviewer favors the longer argument. | Prevents style over substance. Strong models can generate infinite plausible text. Length and confidence must not correlate with score. | **Non-negotiable** |
  | **5. Hard Termination** | Debate loops: Proposer clarifies, Critic finds new ambiguity, Proposer clarifies... Time hits 60 minutes. Reviewer is fatigued. | Operational constraint. A review that takes an hour is worthless. The protocol must force a decision at T=10 mins. | **Non-negotiable** |
  | **6. Claim Isolation** | Claim A depends on Claim B. Reviewer checks A. Later, Claim B is found false. Claim A must be automatically invalidated without re-checking. | Prevents "dangling dependencies." If a foundation is knocked out, the structure must fall automatically without consuming more reviewer budget. | **Aesthetic** |
  | **7. Uniform Claim Weight** | Proposer marks one critical security check as "minor" to hide it in a list of 20 logging changes. Reviewer skips it. | Prevents hiding critical risks in noise. All claims should count equally toward the Debt Ceiling unless explicitly flagged by the Critic. | **Aesthetic** |

  ---

  ### Tensions and Joint Unsatisfiability

  **The Complexity Ceiling**
  There is a fundamental tension between **Bounded Verification Debt**, **Weak Reviewer**, and **Universal Safety**.
  *   **The Tension:** If the code change is sufficiently complex, a strong Proposer can generate a justification chain that is logically sound but exceeds the Verification Debt ceiling required for a weak reviewer to check it within 10 minutes.
  *   **The Consequence:** The requirements are **jointly unsatisfiable for arbitrary changes**. You cannot guarantee safety for *any* change using this workflow.
  *   **The Fix:** You must restrict the *input*, not just the protocol. The system must reject or escalate any change that cannot be justified within the Debt Ceiling. This means your platform cannot accept complex refactors, only localized changes. If you attempt to allow complex changes, you must sacrifice the "Weak Reviewer" constraint (escalate to human expert) or the "Time Budget" constraint.

  **Fluency vs. Clarity**
  **Fluency Decoupling** conflicts with **Procedural Adjudication** if the procedure relies on natural language understanding.
  *   **The Tension:** To check if a rule was followed, the reviewer must read the text. If the text is obfuscated, the reviewer cannot tell if the rule was followed.
  *   **The Fix:** The protocol must enforce structured inputs (e.g., JSON schemas, specific claim formats) rather than free-text arguments. Free text allows the strong model to hide non-compliance in prose.

  ---

  ### Peel Test vs. Substituted-Lemma Test

  These are **distinct requirements** addressing different failure modes.

  *   **The Peel Test (Structural):** Tests whether the argument *can* be decomposed. It fails if the argument is a "black box" or a tangled graph. It ensures the *shape* of the argument fits the reviewer's budget.
  *   **The Substituted-Lemma Test (Semantic):** Tests whether the reviewer is paying attention to *content*. It fails if the reviewer is pattern-matching keywords or tone. It ensures the *substance* of the argument matters.

  You can pass the Peel Test (perfectly structured tree) but fail the Substituted-Lemma Test (reviewer ignores the values in the nodes). Conversely, you can pass the Lemma Test (reviewer spots falsehoods) but fail the Peel Test (argument is too deep to reach the falsehood within time limits).

  ---

  ### Non-Negotiable vs. Aesthetic

  *   **Non-Negotiable:** Bounded Verification Debt, Procedural Adjudication, Asymmetric Burden of Proof, Hard Termination, Fluency Decoupling. These are required to prevent the strong model from exploiting the weak reviewer's limitations within your cost function.
  *   **Aesthetic:** Claim Isolation, Uniform Claim Weight. These improve efficiency and robustness but a protocol could theoretically function without them (e.g., by allowing weighted claims if the reviewer understands the weights).
  *   **Prejudice:** As noted, **The Peel Test** is a structural prejudice. Do not enforce strict hierarchical peeling; enforce **Bounded Verification Debt** instead. Allow the Critic to identify cycles or dependencies that violate the debt budget, rather than forcing a tree structure that may not exist.

  ---

  ### Most Exclusionary Requirement

  The single requirement that excludes the most candidate protocols (including the obvious "Debate then Judge" model) is **Bounded Verification Debt**.

  Most debate protocols allow arguments to expand recursively ("Justify this justification"). This requirement forbids that expansion unless a corresponding claim is resolved. It kills any protocol that relies on "eventual consensus" or "depth of reasoning" as a proxy for truth. It forces the system to prioritize *checkability* over *completeness*.

  \answer{Bounded Verification Debt}
