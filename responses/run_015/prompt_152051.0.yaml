answer: |-
  ### Exam Question

  **Question 4: The Balanced Numbers Conjecture (20 Marks)**

  Let a positive integer $n$ be called *balanced* if there exist integers $a, b$ such that $n = a^2 + b^3$. Note that for any specific $n$, the search for such $a, b$ is bounded and decidable. Let the **Balanced Numbers Conjecture (BNC)** be the claim: "There exists a threshold $T$ such that every integer $n > T$ is balanced."

  Assume the following stipulations regarding the current mathematical status of BNC:
  1.  BNC is open: no proof of BNC is known, and no proof of $\neg$BNC is known.
  2.  No counterexample has been found by search.
  3.  BNC has not been shown to be independent of standard arithmetic.

  Working within the framework of **intuitionistic logic** (specifically Heyting Arithmetic), answer the following in a unified essay (max 1,000 words):

  (a) An intuitionist does not assert $BNC \lor \neg BNC$. However, they do assert $\neg\neg(BNC \lor \neg BNC)$. Explain precisely what is missing in the move from the latter to the former. Why is the failure to assert the disjunction not equivalent to asserting its negation?

  (b) Suppose a proof of $BNC \lor \neg BNC$ were produced. Given the **disjunction property** of intuitionistic systems, what specific mathematical object would this proof have to deliver? Why does the openness of BNC prevent this?

  (c) Consider the meta-mathematical status of your analysis. Is the divergence between classical and intuitionistic logic best understood as a disagreement about which mathematical objects exist (ontology), or as a disagreement about the meaning of logical connectives (proof-conditions)? Finally, if we model intuitionistic logic using classical set theory (e.g., Kripke models), does this undermine the intuitionistic critique of classical existence? Justify your stance.

  ***

  ### Model Answer

  The distinction between asserting $\neg\neg(P \lor \neg P)$ and asserting $P \lor \neg P$ is the technical heart of the intuitionistic critique, and it dissolves the common caricature that intuitionists simply "deny" the Law of Excluded Middle (LEM). In intuitionistic logic, $\neg\neg(P \lor \neg P)$ is a theorem. To assert $\neg(P \lor \neg P)$ would be to assert a contradiction, which no coherent logician does. The intuitionist refusal is not a negation of LEM, but a refusal to affirm it universally without a constructive method. The move from $\neg\neg A$ to $A$ (Double Negation Elimination) is valid for decidable propositions but fails for general claims. In the case of BNC, $\neg\neg(BNC \lor \neg BNC)$ asserts that it is contradictory to claim that neither a proof nor a refutation is possible. However, asserting $BNC \lor \neg BNC$ requires more than the absence of a contradiction; it requires a present method to decide which disjunct holds. The missing step is not a metaphysical gap, but an epistemic one: the lack of a finite procedure that terminates with either a proof of BNC or a counterexample $n > T$ that is not balanced.

  This epistemic requirement is codified in the **disjunction property**. For an intuitionistic system, if $\vdash A \lor B$, then $\vdash A$ or $\vdash B$. This is not merely a semantic feature; it is a constraint on what counts as a proof. If we possessed a proof of $BNC \lor \neg BNC$, the disjunction property dictates that we must be able to extract from that proof either a proof of BNC or a proof of $\neg$BNC. A proof of $\neg$BNC would effectively be a counterexample (since BNC is a $\Pi_1$ statement about decidable properties, its negation implies the existence of a specific counterexample). Since BNC is stipulated as open, we possess neither a general algorithm verifying all $n > T$ nor a specific counterexample. Therefore, we cannot assert the disjunction. To assert the disjunction without being able to identify the true disjunct is, for the intuitionist, to divorce the symbol $\lor$ from its meaning. The classical realist treats $\lor$ as a truth-function defined by valuations; the intuitionist treats it as a speech-act defined by assertibility conditions.

  This leads to the meta-mathematical crux: is this a dispute about ontology or meaning? The most robust interpretation is that it is a dispute about **meaning**, specifically the manifestation of understanding. If the meaning of "exists" is exhausted by classical truth conditions (a platonic realm where the statement is true or false regardless of our knowledge), then LEM is trivial. But if understanding a statement consists in knowing what counts as evidence for it, then "exists" means "can be constructed." An ontological reading suggests intuitionists believe certain numbers or functions *do not exist* until constructed. This is vulnerable to the objection that we are describing the same mathematical reality with different tools. The meaning-theoretic reading is stronger: we are not denying the reality of the numbers, but denying that the sentence "BNC is true" has a content distinct from "We have a proof of BNC." The disagreement is about what constitutes the *content* of mathematical claims, not the inventory of the universe.

  Finally, regarding model theory: it is true that standard completeness proofs for intuitionistic logic (such as Kripke semantics) are carried out in classical set theory. Does this undermine the intuitionistic project? No, but it clarifies its scope. When we construct a Kripke model, we are using classical reasoning in the **meta-theory** to demonstrate consistency or independence results about the **object-theory**. The intuitionist critique targets the object-language usage of LEM. Using classical sets to model intuitionistic reasoning shows that intuitionistic logic is consistent relative to classical logic, but it does not validate LEM within the intuitionistic system itself. It is akin to using a classical computer to simulate a quantum algorithm; the simulation does not collapse the quantum superposition into a classical state within the simulation's rules. The tension is real, but it reflects the hierarchy of languages, not a performative contradiction. The intuitionist accepts classical meta-reasoning as a useful tool for studying formal systems, while maintaining that mathematical knowledge itself must adhere to constructive standards.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. The Status of Double Negation (4 Marks)**
  *   **Criteria:** Must explain that $\neg\neg(A \lor \neg A)$ is provable in IL, so intuitionists do not assert $\neg$LEM. Must identify that the missing step is DNE ($\neg\neg P \to P$) and link this to the lack of a decision procedure for BNC.
  *   **Common Error:** Writing "Intuitionists deny LEM" without qualification (deduct 2 marks). Treating $\neg\neg P$ as equivalent to $P$ (deduct 4 marks).

  **2. The Disjunction Property Application (4 Marks)**
  *   **Criteria:** Must state that $\vdash A \lor B$ implies $\vdash A$ or $\vdash B$. Must apply this to BNC: a proof of the disjunction requires either a proof of BNC or a proof of $\neg$BNC (a counterexample).
  *   **Common Error:** Describing the disjunction property abstractly without applying it to the specific requirements of BNC (deduct 2 marks).

  **3. Negation and Counterexamples (4 Marks)**
  *   **Criteria:** Must distinguish what $\neg$BNC entails (existence of a counterexample) versus what $\neg\neg$BNC entails (impossibility of refutation). Must explain why openness blocks the assertion.
  *   **Common Error:** Confusing $\neg$BNC with "BNC is unprovable" (deduct 2 marks).

  **4. Meaning vs. Ontology Stance (4 Marks)**
  *   **Criteria:** Must take a clear stand (preferably meaning/use). Argument should focus on assertibility conditions or manifestation of understanding rather than "numbers popping into existence."
  *   **Common Error:** Sitting on the fence ("It could be either") without argumentation (deduct 2 marks). Adopting a naive ontological view ("Intuitionists think numbers don't exist") without nuance (deduct 2 marks).

  **5. Model Theory and Meta-Logic (4 Marks)**
  *   **Criteria:** Must acknowledge the classical meta-theory. Must argue that this does not invalidate the object-level critique (distinction between use and mention, or object vs. meta).
  *   **Common Error:** Claiming Kripke models prove intuitionistic logic is "really" classical (deduct 4 marks).

  **Name-Dropping Penalty:**
  Answers that rely on naming Brouwer, Dummett, Heyting, or Kripke without explaining the *concept* associated with the name will be capped at 10/20. Names are not arguments.

  **A vs. B Differentiator:**
  *   **B Grade:** Correctly identifies the technical distinctions (Double Negation, Disjunction Property) and applies them to BNC accurately.
  *   **A Grade:** Successfully integrates the technical logic with the philosophical meta-question, specifically arguing *why* the meaning-theoretic account resolves the tension better than the ontological account, and handling the model theory paradox without contradiction.

  ***

  ### Covering Note to Instructor

  **Settled vs. Contested**
  There is a sharp divide between the formal facts and their philosophical interpretation.
  *   **Settled:** Intuitionistic Propositional Logic (IPC) proves $\neg\neg(P \lor \neg P)$. IPC does not prove $P \lor \neg P$. Heyting Arithmetic (HA) has the disjunction and existence properties. Adding $\neg\neg P \to P$ for atomic $P$ to IPC collapses it to Classical Logic (CPC).
  *   **Contested:** Whether the "meaning-theoretic" justification (Dummett/Prawitz) is the *only* valid justification, or whether a form of constructive ontology (Bishop-style) can coexist with classical meta-reasoning without hypocrisy. The status of Markov's Principle is also a live debate between Russian constructivists and strict intuitionists.

  **Evaluation of Your Hunches**
  1.  **"Deny LEM" is crude/wrong:** **Right.** This is formally verifiable. $\neg(P \lor \neg P)$ is a contradiction in IL. The refusal is non-assertion, not negation. Grading students down for saying "they deny LEM" is justified if they imply $\neg$LEM.
  2.  **Disjunction/Existence Properties are key:** **Right.** This is the operational difference. A student who cannot explain what a proof of a disjunction *does* has not understood constructivity.
  3.  **Markov's Principle (MP) matters for BNC:** **Contested/Technical.** BNC is $\Pi_1$ ($\forall n \exists m R(n,m)$). MP allows inferring $\exists x P(x)$ from $\neg\neg \exists x P(x)$ for decidable $P$. While relevant to Russian constructivism, MP is *not* provable in HA. Since your course is on "intuitionistic logic" (usually implying HA/IPC), requiring MP would penalize students following the standard Brouwer/Heyting line. **Advice:** Do not make MP a requirement for full marks. Allow it as a "distinction" point for exceptional students who note that some constructivists *would* accept MP here, but strict intuitionists would not.
  4.  **Atomic DNE collapses to Classical:** **Right.** This is a standard result (often related to the fact that IPC + Atomic Stability = CPC). It is safe to use this to show the connectives, not the atoms, are the locus of disagreement.

  **Recommendation:** Your question is sound. It forces engagement with the *consequences* of the logic rather than the *slogans*. The Model Answer takes a firm Dummettian line (meaning over ontology); this is defensible in a philosophy-heavy seminar, but ensure your lectures supported this stance so students aren't blindsided by the "take a stand" requirement.
