  3.  **Evaluate the "Fatal Problem" (The Core Philosophical Issue):**
      *   The host argues: No causal link $\rightarrow$ No epistemic link.
      *   *Epiphenomenalist Response:* This is the crux. Epiphenomenalists *deny* that causal connection is necessary for knowledge/reference. They argue for a "constitutive" or "nomological" connection. If the neural state $N$ causes both the pain $P$ and the judgment $J$, there is a common cause structure. $J$ tracks $P$ because both track $N$.
      *   *Analogy:* The host uses the thermometer analogy (readings caused by internal mechanism, not temperature). A better epiphenomenalist analogy might be two clocks synchronized by a master signal. They match not because one causes the other, but because a third thing causes both.
      *   *Is it "self-defeating"?* Only if you accept a causal theory of knowledge/reference. Many epistemologists reject strict causal theories (especially for introspection).
      *   *Frank Jackson's Evolution:* Jackson famously abandoned epiphenomenalism partly due to this objection (the "knowledge argument" led him to physicalism, but the epistemic objection weighed on him). However, others (like Chalmers) argue the objection isn't fatal if you accept non-causal acquaintance.

