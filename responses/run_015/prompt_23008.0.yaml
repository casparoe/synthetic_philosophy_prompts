      *   **(7) Anna's Selection Lag:** "Trait can keep doing old job long after selection stopped."
          *   *Assessment:* Crucial point. SE allows for function to persist briefly after selection ceases (ghost of selection past). CR ties function strictly to current contribution. If selection stops, Ben implies function changes or vanishes immediately. Anna captures the intuition that a trait doesn't lose its function *instantly* if the environment changes tomorrow.
          *   *Verdict:* Anna highlights a genuine weakness in strict current-utility accounts.

