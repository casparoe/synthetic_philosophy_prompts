      *   **Ben's Position:** Causal Role Account (Systemic/Current Utility). Associated with Robert Cummins. Function = what the trait *currently does* that contributes to the capacity of the containing system.
      *   **Key Test Cases:** Vestigial traits (Appendix), Exaptation (Feathers), Selection Lag.

  3.  **Evaluate Each Move:**

      *   **(1) Anna's Opening (Etiological):** "Proper function... is what it was selected for."
          *   *Assessment:* This is the standard definition of the Selected Effects (SE) theory. It handles normativity (malfunction) very well. If a heart doesn't pump, it's broken, even if it makes a thumping sound.
          *   *Verdict:* Philosophically robust and standard.

      *   **(2) Ben's Reply (Causal Role):** "Function is what it currently does... causal role."
          *   *Assessment:* This is the Cummins-style Causal Role (CR) theory. It avoids historical commitment but struggles with normativity. If a heart pumps blood, that's its function. If it makes a sound, that's also a causal role, but is it a *function*? Ben claims selection history isn't about "what it is for."
          *   *Verdict:* Coherent alternative, but often criticized for lacking normative force (malfunction).

      *   **(3) Anna's Vestigial Counter:** "Appendix... vestigial... my account captures 'used to be for'."
          *   *Assessment:* Strong point for SE theory. Vestigiality implies a loss of original function despite physical presence. SE explains this naturally (selection pressure gone). CR struggles because if the appendix does *something* (even minor), it has a function. Calling it "vestigial" implies a loss of *proper* function.
          *   *Verdict:* Anna wins this specific point. SE handles vestigiality better.

      *   **(4) Ben's Vestigial Defense:** "Vestigial is a statement about current selection, not blueprint."
          *   *Assessment:* Weak. "Vestigial" usually means "reduced from ancestral state," not just "currently weak selection." A trait can have weak selection but still be fully functional (e.g., a slightly less efficient enzyme). Vestigiality is inherently historical/comparative. Ben is redefining "vestigial" to fit his theory rather than explaining the common usage.
          *   *Verdict:* Ben is on shaky ground here. He's shifting the definition.

      *   **(5) Anna's Exaptation Point:** "Feathers... insulation first... flight is exaptation."
          *   *Assessment:* This is the classic Gould & Vrba argument. SE theory distinguishes *adaptation* (selected for) from *exaptation* (co-opted). CR theory tends to collapse this distinction because currently, feathers *do* enable flight. Anna correctly identifies that the distinction matters for evolutionary explanation.
          *   *Verdict:* Anna is right about the utility of the distinction. Ben's view erases a useful evolutionary category.

      *   **(6) Ben's Tool Analogy & Concession:** "Hammer originally paperweight... function is what it's used for now."
          *   *Assessment:* The tool analogy actually favors Anna in biology. Artifacts often have intended functions (etiological). If I use a rock as a hammer, it's an improvised tool, not a *manufactured* hammer. In biology, there is no "intender," so history (selection) acts as the "designer." Ben's claim that selection is "ongoing" ignores time lags (addressed in 7).
