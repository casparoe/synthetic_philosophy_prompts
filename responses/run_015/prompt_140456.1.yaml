answer: |-
  Here is the analysis of the Rhodes Must Fall episode through Nietzsche's threefold scheme, adhering to your stipulated facts and constraints.

  ### I. Mapping the Episode to the Three Modes

  Your friend's mapping is the intuitive first pass, but it treats the modes as static labels rather than dynamic forces. A closer reading of the episode reveals a shift in modes over time and between locations.

  **1. The Statue: From Monumental to Antiquarian**
  When erected, the Cecil Rhodes statue was **Monumental history**. It was intended to project a chain of greatness (Empire, philanthropy, ambition) for the present to emulate. It said: "Greatness existed here; therefore, greatness is possible."
  However, by 2015, for Oriel College, the statue had shifted into **Antiquarian history**. It was no longer primarily an inspiration to emulate Rhodes's imperialism, but a piece of the college's fabric, a relic of "how we have always been." Its value lay in its age and its connection to the institution's continuity, not in the active imitation of Rhodes's deeds. The College's defense was piety toward its own past, not an endorsement of Rhodes's future relevance.

  **2. The Campaign: Critical History and the "Monument of the Injured"**
  The demand for removal is classically **Critical history**. It judges the past, condemns it, and seeks to break its chain to allow the present to live. The campaigners argued that the statue was a burden that stifled the life of black students.
  However, your intervention is crucial. The act of defacement and the creation of the empty plinth (as seen in UCT) functions as a **Monumental history of the injured**. Nietzsche's Monumental history relies on the great individual. Your "Monumental of the Injured" relies on the collective suffering and the resistance to it. It says: "This injustice existed; therefore, resistance is necessary." It attempts to create a new chain of greatness based not on imperial power, but on the power of rectification.

  **3. The Compromise: Antiquarianism Wearing Critical Clothes**
  The Oxford outcome (retention with context) is your friend's "Antiquarianism wearing critical clothes." Nietzsche would likely call this a corruption of all three.
  *   It fails the **Antiquarian** test because true piety does not apologize for its ancestors; it reveres them. Adding a plaque admits the ancestor is toxic, undermining the piety.
  *   It fails the **Critical** test because it refuses to cut the chain. It keeps the burden in place.
  *   It fails the **Monumental** test because it offers no clear example to emulate—neither Rhodes's greatness nor the campaigner's victory.
  It is a bureaucratic survival mechanism, not a historical mode in the Nietzschean sense. It preserves the object to avoid the pain of decision, serving the life of the administration, not the life of the culture.

  ### II. The Test of "Service to Life"

  Nietzsche's ultimate criterion is whether history serves *Life* (action, growth, the future). The difficulty here is that "Life" is not singular.

  **For the Campaigners:** Removal serves life. It removes a psychological barrier to belonging and agency. At UCT, the swift removal allowed the university to attempt a new beginning (a Critical victory serving the Life of the marginalized).
  **For the College:** Retention serves life. It maintains institutional identity and continuity (an Antiquarian victory serving the Life of the institution).

  **Where the Scheme Fails: Adjudicating Conflicting Lives**
  This brings us to your first specific point: *Whether a criterion of life can adjudicate between two parties whose historical needs conflict.*

  **The scheme is silent here.** Nietzsche writes for a unified culture or a sovereign individual. He assumes that if history is "abused," it is because it is stifling the *dominant* creative drive of a people. He does not provide a metric for when the "Life" of the institution conflicts with the "Life" of the subaltern within it.
  In the Oxford case, whose life counts? If the institution's continuity stifles the students' ability to flourish, Nietzsche generally sides with the creative future over the dead past. However, he also values order and hierarchy. The scheme cannot calculate the weight of "institutional stability" against "student liberation." It identifies the conflict (Critical vs. Antiquarian) but offers no algorithm to resolve it when both sides claim the other is poisoning their life.

  ### III. The Dependency of Critical on Antiquarian

  Your second point: *Whether critical history can do its work at all without some antiquarian attachment to what it destroys.*

  **The scheme suggests a dependency that the UCT/Oxford split illuminates.**
  Nietzsche warns that Critical history (breaking the past) risks leaving the present rootless. To judge Rhodes critically, one must know Rhodes.
  *   **Oxford (Retention):** By keeping the statue, the College preserved the object of critique. The "Critical history" remains possible because the "Antiquarian" object remains. The tension is sustained. The wound remains open, which serves a certain kind of intellectual life (constant vigilance) but harms the emotional life of the injured (constant exposure).
  *   **UCT (Removal):** By removing the statue, the Critical act consumed its object. The "Antiquarian" attachment was severed. This served the immediate life of the campaigners (relief, victory), but it risks ending the historical dialogue. You cannot critique what is not there.

  **Verdict:** Critical history *requires* an Antiquarian object to function, but it cannot *respect* that object. The Oxford compromise tries to have both (respect the object, critique the meaning), which Nietzsche would view as weak. The UCT approach accepts that Critical history must destroy the Antiquarian object to succeed. The scheme implies that true Critical history is destructive, not additive. Therefore, contextualization (Oxford) is not Critical history; it is Antiquarianism trying to immunize itself against Critique.

  ### IV. The Monumental History of the Injured

  Your third point: *Whether monumental history of the injured rescues the framework or exposes a hole in it.*

  **This exposes a hole in the framework.**
  Nietzsche's **Monumental history** is defined by *emulation*. "Great deeds once happened; therefore I can do great deeds." It is inherently affirmative and aristocratic. It looks to the past for *power*.
  Your **Monumental history of the injured** looks to the past for *justice*. It does not say "I can be like the victim"; it says "I must avenge the victim" or "I must ensure this does not happen."

  **Why this breaks the scheme:**
  1.  **Vector of Power:** Nietzsche's Monumental history draws power *from* the past to the present. The "Monument of the Injured" draws attention *to* the past to correct the present. One is an engine of ambition; the other is an engine of restitution.
  2.  **The Subject:** Nietzsche's model assumes a subject capable of "greatness." The "injured" are defined by what was done *to* them, not what they achieved. To make a monument of the injured is to monumentalize suffering, not agency. Unless the monument is to the *resistance* (the campaign itself), it is not Monumental in Nietzsche's sense.
  3.  **The Future:** Nietzsche's Monumental history is for the sake of the future creator. The "Monument of the Injured" is for the sake of the past victim.

  **Verdict:** The concept rescues the *descriptive* power of the framework (we can see what the campaigners are doing) but exposes a *normative* hole. Nietzsche has no category for history that serves justice rather than greatness. He might view the "Monument of the Injured" as a form of *ressentiment*—a reactive force defined by what it opposes rather than what it creates. If so, he would argue it does not serve "Life" in the highest sense, but only serves the alleviation of pain. The scheme cannot accommodate a history whose primary goal is moral correction rather than cultural elevation.

  ### V. Conclusion: Confirm, Anomaly, or Unanticipated?

  The Rhodes Must Fall episode is a **case the scheme never anticipated.**

  Nietzsche wrote in a context where the "past" was a shared cultural heritage (Greek, German, Christian) that could be mined for greatness or discarded. He did not anticipate a pluralist society where the "past" is a site of contested ownership, where one group's Monumental history (Rhodes the Builder) is another group's Critical target (Rhodes the Oppressor).

  1.  **On Adjudication:** The scheme fails to tell us whose life takes precedence when historical needs conflict. It identifies the pathology (Antiquarianism stifling Life) but cannot diagnose which "Life" is the true one when they are at war.
  2.  **On Critical/Antiquarian:** The case confirms that Critical history needs an Antiquarian object to critique, but shows that "Contextualization" is a false synthesis. It is Antiquarianism defending itself, not Critical history doing its work.
  3.  **On Monumental of the Injured:** This exposes the framework's aristocratic bias. Nietzsche's Monumental history is for the victors who wish to remain victors, or the aspirants who wish to join them. It has no room for the vanquished who wish to remember their vanquishment.

  **Final Prescription:**
  If we strictly apply Nietzsche's test of "Service to Life" (defined as the capacity for active, creative future action):
  *   **Oxford's solution** fails. It preserves the dead weight of the past (Antiquarian) and stifles the creative potential of the students (Critical), resulting in stagnation (years of delay/expense). It serves the life of the bureaucracy, which Nietzsche would deem a low form of life.
  *   **UCT's solution** aligns better with Nietzsche, though uncomfortably. It used Critical history to break a burden. It cleared the ground. Whether the "empty plinth" becomes a new Monumental history of the injured depends on whether it inspires active creation or passive mourning.
  *   **The Scheme's Limit:** Nietzsche cannot tell you if the "Life" of the black student at Oxford is more valuable than the "Life" of the Oriel tradition. He assumes a hierarchy of values that the modern university no longer shares. The scheme diagnoses the *types* of history in play, but it is silent on the *politics* of whose history gets to count as "Life."
