answer: |-
  # Specification of Desiderata for a Normative Theory of Safe Pareto Improvements (SPI)

  ## 1. Introduction and Scope
  This specification defines the necessary conditions for a normative theory capable of evaluating institutional reforms as **Safe Pareto Improvements**. The context is characterized by **contested baselines** (disagreement over the welfare value of the status quo) and **hidden counterfactual risks** (uncertainty regarding long-term or unobservable consequences).

  Standard welfare economics often relies on Kaldor-Hicks efficiency (potential compensation) or ex-ante expected utility. An adequate SPI theory must be more stringent: it must guarantee that no agent is made worse off, even under deep uncertainty, without relying on a single, imposed metric of well-being.

  ## 2. Core Desiderata

  The following five desiderata constitute the necessary conditions for adequacy. Each includes the phenomenon to be explained, the conceptual distinction to be preserved, consistency conditions, motivating cases, and normative status.

  ### D1: Counterfactual Robustness (The Safety Constraint)
  *   **Requirement:** A reform qualifies as an SPI only if it can be demonstrated that no individual is worse off in *any* epistemically plausible state of the world, not merely in the expected value or the realized outcome.
  *   **Phenomena to Explain:** Reforms that appear Pareto-improving based on observed data but generate unobservable or delayed losses (e.g., environmental degradation that manifests after the evaluation period).
  *   **Distinctions to Preserve:** Distinguishes between **Risk-Neutral Efficiency** (acceptable average loss for high gain) and **Safety** (bounded downside risk).
  *   **Consistency Conditions:** Must respect **Statewise Dominance**: If outcome A is better than B in every state, A must be preferred. It relaxes **Ex-Ante Pareto** when priors diverge significantly.
  *   **Motivating Case:** *Robustness to Misspecified Reference Groups.* If a minority group's welfare metric is excluded from the baseline model, a reform might look like a gain for the "average" agent but a catastrophic loss for the excluded group. D1 requires the "safety" proof to hold across all plausible welfare metrics.
  *   **Normative Status:** **Non-Negotiable.** Without this, the "Safe" in SPI is meaningless. This reflects a **Maximin/Precautionary** stance rather than Utilitarianism.

  ### D2: Preference Endogeneity Resistance (The Autonomy Constraint)
  *   **Requirement:** The assessment of "no-worse-off" must not rely solely on revealed preferences or self-reported satisfaction if there is evidence of adaptive preference formation.
  *   **Phenomena to Explain:** Situations where oppressed or marginalized groups report high satisfaction with the status quo or a reform due to lowered expectations (sour grapes).
  *   **Distinctions to Preserve:** Distinguishes between **Genuinely No-Worse-Off** (objective capability/functioning maintained or enhanced) and **Merely Unprotested** (subjective satisfaction due to adaptation).
  *   **Consistency Conditions:** Consistent with **Capability Approach** (Sen/Nussbaum) but must remain compatible with **Liberal Consistency** (respecting individual choice unless coercion is proven).
  *   **Motivating Case:** *Adaptive Preference Formation.* A labor reform increases hours but workers report happiness due to fear of unemployment. An SPI theory must identify the loss of leisure as a welfare reduction despite reported utility gains.
  *   **Normative Status:** **Contested (Objective vs. Subjective).** Reflects the **Objective List/Capability** camp. Strict welfarists (Subjectivists) would reject this as paternalistic.

  ### D3: Dynamic Path Independence (The Lock-In Constraint)
  *   **Requirement:** A reform is not an SPI if it restricts future choice sets in a way that prevents future Pareto improvements, even if the current step is harmless.
  *   **Phenomena to Explain:** Institutional changes that yield immediate gains but create path dependence that locks in inefficient or harmful equilibria later (e.g., technological standards, constitutional amendments).
  *   **Distinctions to Preserve:** Distinguishes between **Static Safety** (harmless now) and **Dynamically Safe Improvements** (harmless now and does not preclude better futures).
  *   **Consistency Conditions:** Must satisfy **Intertemporal Consistency**. Violates standard **Myopic Pareto** criteria which evaluate only the immediate transition.
  *   **Motivating Case:** *Irreversibility under Epistemic Updates.* If new information arises in $t+1$ showing the reform was harmful, can the institution revert? If the cost of reversal is prohibitive due to the reform's design, D3 is violated.
  *   **Normative Status:** **Non-Negotiable for Institutional Theory.** Reflects a **Global/Long-term** evaluation camp vs. Local/Short-term.

  ### D4: Coalition-Proof Consensus (The Strategic Constraint)
  *   **Requirement:** The assessment of the SPI must be robust against strategic misrepresentation of preferences or welfare baselines by coalitions seeking to pass reforms that benefit them at the expense of others.
  *   **Phenomena to Explain:** Coalition-proofness failures presented as unanimous gains (e.g., logrolling where costs are hidden or externalized to non-voting stakeholders).
  *   **Distinctions to Preserve:** Distinguishes between **Unanimous Consent** (everyone agrees, possibly due to manipulation) and **Verified Non-Harm** (independent verification that no one loses).
  *   **Consistency Conditions:** Must satisfy **Strategy-Proofness** (Gibbard-Satterthwaite conditions applied to welfare assessment).
  *   **Motivating Case:** *Coalition-Proofness Failures.* A majority coalition agrees to a reform that ostensibly helps everyone by using optimistic projections, while knowing the risks fall disproportionately on a minority unable to block the vote.
  *   **Normative Status:** **Non-Negotiable.** Reflects **Mechanism Design** constraints applied to normative theory.

  ### D5: Epistemic Reversibility (The Humility Constraint)
  *   **Requirement:** If the "safety" of the improvement relies on empirical claims that are subsequently falsified, the institutional framework must allow for reversal without penalizing those who opposed the reform.
  *   **Phenomena to Explain:** Reforms based on scientific or economic models that later prove false, leaving losers without recourse.
  *   **Distinctions to Preserve:** Distinguishes between **Ex-Ante Rationality** (made the best guess with available info) and **Ex-Post Accountability** (bearing responsibility for wrong guesses).
  *   **Consistency Conditions:** Consistent with **Regret Minimization**. Conflicts with **Finality of Contracts** in standard law/economics.
  *   **Motivating Case:** *Reversibility under Epistemic Updates.* A trade agreement is signed based on growth models. If growth fails to materialize and inequality spikes, can the agreement be voided? SPI requires a "sunset clause" or reversal mechanism.
  *   **Normative Status:** **Contested (Ex-Ante vs. Ex-Post).** Reflects the **Ex-Post** camp. Strict Ex-Ante theorists argue that if the expectation was rational, the outcome doesn't invalidate the SPI.

  ---

  ## 3. Impossibility Results and Joint Unsatisfiability

  A normative theory of SPI cannot satisfy all desirable properties simultaneously under conditions of deep uncertainty and contested baselines. The following subset of desiderata is **jointly unsatisfiable**, drawing on results from social choice under uncertainty (e.g., Mongin 1995; Gilboa, Samet, and Schmeidler 2004).

  ### The Trilemma of Uncertain Pareto
  1.  **Ex-Ante Pareto:** If all individuals prefer Reform A to Status Quo B based on their subjective beliefs, the social ordering must prefer A to B.
  2.  **Pluralism of Priors:** Individuals are permitted to hold different subjective probability distributions (priors) regarding the risks of the reform (contested baselines/hidden risks).
  3.  **Non-Dictatorship/Consistency:** The social welfare function does not simply adopt the beliefs of a single individual or an external dictator to resolve the disagreement.

  **The Conflict:**
  If agents have heterogeneous priors regarding the hidden risks (D1 and D5), respecting Ex-Ante Pareto (D1's weaker cousin) can lead to **speculative money pumps** or **Pareto improvements that make everyone objectively worse off** in realization.
  *   *Example:* Agent 1 thinks a policy is safe (90% chance of gain). Agent 2 thinks it is safe (90% chance of gain). They agree to the reform. However, the objective reality (or a third, correct prior) shows a 100% chance of loss.
  *   To satisfy **D1 (Counterfactual Robustness)**, the theory must reject the Ex-Ante Pareto consensus if the priors are deemed unreliable.
  *   To satisfy **Ex-Ante Pareto**, the theory must accept the reform, violating **D1**.

  **Resolution:** An adequate SPI theory for institutional reform must **drop Ex-Ante Pareto** in favor of **Ex-Post Counterfactual Safety (D1)** when priors are contested. This implies that unanimous agreement based on divergent, optimistic beliefs is insufficient for an SPI.

  ---

  ## 4. The "Killer" Constraint

  The single requirement that eliminates the largest share of conventional policy-evaluation frameworks is:

  ### **D1: Counterfactual Robustness (Ex-Post Safety under Deep Uncertainty)**

  **Justification:**
  1.  **Eliminates Kaldor-Hicks:** Standard Cost-Benefit Analysis (CBA) relies on potential compensation. D1 requires *actual* non-harm in all plausible states. CBA is immediately disqualified because it permits losers provided the winners *could* compensate them (which they rarely do).
  2.  **Eliminates Standard Ex-Ante Pareto:** Most game-theoretic and contractarian models rely on expected utility maximization. If agents are risk-neutral or have divergent optimistic priors, they will agree to risky reforms. D1 forbids this if a plausible downside exists, regardless of expected value.
  3.  **Eliminates Majoritarian Welfare:** Democratic voting on reforms often passes measures that benefit the majority while harming a minority. D1 acts as a strict veto for any plausible harm to any individual, functioning as a radical libertarian/egalitarian constraint that most utilitarian frameworks reject.

  **Consequence:**
  Adopting D1 shifts the burden of proof entirely onto the proponents of the reform. In a world of hidden counterfactual risks and contested baselines, **proving** that *no one* is worse off in *any* plausible state is epistemically nearly impossible. Consequently, a strict adherence to D1 leads to a **Status Quo Bias** so strong it may paralyze institutional change.

  Therefore, an *adequate* theory must operationalize D1 not as absolute proof, but as a **procedural safeguard** (linked to D5, Epistemic Reversibility). It must define "Safe" not as "Guaranteed Harmless" (which is unknowable), but as "Reversible with Indemnification." This modification is the only way to satisfy the conceptual weight of Safety without triggering total institutional paralysis.

  ## 5. Summary of Normative Camps

  | Desideratum | Primary Normative Camp | Opposing Camp |
  | :--- | :--- | :--- |
  | **D1 (Counterfactual Robustness)** | Precautionary Principle / Risk-Averse Egalitarianism | Utilitarianism / Ex-Ante Contractarianism |
  | **D2 (Preference Endogeneity)** | Objective List / Capability Approach | Welfarism / Revealed Preference |
  | **D3 (Dynamic Path)** | Constitutional Political Economy / Longtermism | Myopic Efficiency / Discounted Utilitarianism |
  | **D4 (Coalition-Proof)** | Mechanism Design / Public Choice | Deliberative Democracy / Simple Majoritarianism |
  | **D5 (Epistemic Reversibility)** | Fallibilism / Ex-Post Accountability | Legal Finality / Ex-Ante Rationality |

  **Final Note:** The tension between **D1 (Safety)** and **D5 (Reversibility)** is the critical fault line. If a reform is truly "Safe" (D1), reversibility shouldn't be needed. If reversibility is needed (D5), D1 was not met. An adequate theory must resolve this by treating D1 as an **aspirational bound** and D5 as the **operational mechanism** that makes falling short of D1 morally permissible.
