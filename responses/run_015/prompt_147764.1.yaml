prompt: |-
  Write the full specification of desiderata that any adequate normative theory of safe Pareto improvements must meet, specifically for assessing institutional reforms where baseline welfare is contested and hidden counterfactual risks exist. The list should cover: the phenomena it must explain, including reforms that appear Pareto-improving but generate unobservable or delayed losses; the distinctions it must preserve, such as between being genuinely no-worse-off and merely being unprotested, and between static and dynamically safe improvements; and the consistency conditions with welfare economics it must respect. For each requirement, provide the motivating case—e.g., adaptive preference formation that masks harm, coalition-proofness failures presented as unanimous gains, robustness to misspecified reference groups, and reversibility under epistemic updates about long-run effects—and flag whether it is non-negotiable or reflects a particular normative camp (ex-ante versus ex-post, local versus global evaluation). Identify any subset of desiderata that is jointly unsatisfiable given standard results in social choice theory, and state which single requirement eliminates the largest share of conventional policy-evaluation frameworks. Keep the conceptual weight on the criteria and their justification; briefly score standard welfare-theoretic approaches only if it clarifies the list.
