answer: |-
  # Joint Statement of Adversarial Collaboration: The Causal Exclusion Problem

  **Date:** October 26, 2023
  **Parties:** Exclusionist Camp (EC) vs. Non-Reductivist Camp (NRC)
  **Status:** Draft for Review

  ## 1. Agreed Claims
  *The following propositions are accepted by both camps as the background framework for this dispute. Denial of any claim below constitutes opting out of this specific collaboration.*

  1.  **Dependence:** Mental properties/tokens systematically depend on physical properties/tokens. There is no "free-floating" mentality that exists without a physical base.
  2.  **Physical Closure:** Every physical event that has a cause has a sufficient physical cause at the time it occurs. (We disagree on what "sufficient" entails, but agree the physical domain is not causally porous).
  3.  **Distinctness:** For the purposes of this debate, mental property types are not identical to physical property types. (We bracket radical reductionism to test the exclusion argument against non-reductive physicalism).
  4.  **No Systematic Overdetermination:** The world is not structured such that every mental causation case is also a case of coincidental, independent causal overdetermination (e.g., like two assassins firing at once).
  5.  **Causation Requires Dependence:** If $C$ causes $E$, then $E$ must depend on $C$ in some robust sense (e.g., counterfactually or nomologically). Purely epiphenomenal correlations do not count as causation.
  6.  **Exclusion Pressure:** If a cause $C_1$ is fully sufficient for effect $E$, and $C_2$ is distinct from $C_1$, there is a prima facie reason to think $C_2$ is causally redundant unless a specific relation (like realization) saves it.
  7.  **Single Effect Token:** In any given instance of alleged mental causation, we are debating the cause of a single concrete event token, not two parallel events.
  8.  **Special Science Validity:** Psychological and biological generalizations are not *obviously* false; the dispute is whether their truth requires mental properties to be genuinely causal or merely explanatory surrogates.
  9.  **Description Sensitivity:** Causal claims are made using descriptions of events. We disagree on whether the truth of the causal claim depends on the grain of those descriptions.
  10. **Stakes:** If the Exclusionist Camp is right, mental properties are causally inert at the type level, and "mental causation" is a *façon de parler*. If the Non-Reductivist Camp is right, the Exclusion Argument fails because it assumes an overly restrictive metaphysics of causation.

  ## 2. Disagreements Table
  *Pre-registered cruxes, formulations, and test cases.*

  | Crux | Exclusionist Camp (EC) Formulation | Non-Reductivist Camp (NRC) Formulation | Shared Test Case / Argument | EC Prediction | NRC Prediction | What Counts as "Going Wrong" |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Sufficiency Standard** | "Sufficient" means nomologically sufficient for the **occurrence** of the effect token. If the physical base guarantees the event happens, no other distinct property is needed to produce it. | "Sufficient" means sufficient to fix the **difference** that constitutes the effect. If the physical base is too specific to track the relevant contrast class, it is not the true cause. | **Grain Shift:** Effect described as (A) "Hand moved at $v$" vs (B) "Reached for glass." | Causation holds for (A). Mental property is irrelevant to (A). Pressure remains for (B) because (B) supervenes on (A). | Causation holds for (B) but fails for (A) (too coarse/fine). Mental property is the only invariant cause for (B). | **If EC is right:** NRC is conflating *explanation* with *causation*. <br>**If NRC is right:** EC is using a "production" model of causation that cannot account for scientific practice. |
  | **2. Realization vs. Causation** | The realizing physical state does the causal work *on behalf of* the mental state. The mental state is the structure; the physical state is the engine. | The mental state causes the effect *in virtue of* being realized, but the realization relation does not compete with the causal relation. They are different relations. | **Locked Route:** Neural route R1 realizes Intention $M$. Backup route R2 exists but doesn't fire. R1 causes reaching. | $M$ did not cause the reaching; R1 did. $M$ is screened off by R1's sufficiency. | $M$ caused the reaching. $M$ is robust because if R1 failed, R2 would have fired, and $M$ would still cause reaching. | **If EC is right:** NRC is ignoring the actual mechanism (R1) in favor of a modal fiction (R2). <br>**If NRC is right:** EC is fetishizing the specific mechanism over the functional capacity that actually guides the agent. |
  | **3. Multiple Realizability** | If $M$ is realized by physically diverse states $P_1...P_n$ with no common physical type, there is no physical causal law for $M$. $M$ cannot be a natural kind cause. | The lack of a common physical type is precisely why $M$ is the cause. $M$ captures the invariant pattern that $P_1...P_n$ miss. | **Scatter:** Population study. $M$ present in all cases of behavior $B$. Physical realizers $P_i$ vary wildly across cases. | $M$ is a useful classification, but causally idle. The real causes are the disparate $P_i$'s. | $M$ is the genuine type-cause. The $P_i$'s are too heterogeneous to support the generalization. | **If EC is right:** NRC is mistaking a pattern in the data for a causal power in the world. <br>**If NRC is right:** EC is committed to the absurdity that biology/psychology have no causal laws, only physics does. |

  ## 3. Note on Verbal Disputes
  *Assessment of whether the disagreement is merely terminological.*

  **Verdict:** The dispute is **partly verbal, but grounded in substantive metaphysics.**

  1.  **The Verbal Layer:** Both sides use the word "cause," but they are indexing different concepts. EC indexes *causation-as-production* (a physical transaction transferring energy/information). NRC indexes *causation-as-difference-making* (a counterfactual dependency relation holding between variables). If we simply stipulate "cause = production," EC wins trivially. If we stipulate "cause = difference-making," NRC wins trivially.
  2.  **The Substantive Core:** The verbal disagreement masks a substantive disagreement about **ontological priority**.
      *   *Reformulated Dispute:* Is the "production" relation the only fundamental causal relation, such that all other causal talk must be reduced to it to be legitimate? Or is the "difference-making" relation equally fundamental, such that a physical production account is incomplete if it cannot recover high-level dependencies?
      *   *Why it's not just verbal:* Even if we agree on definitions, we disagree on whether the world contains structures (functional, higher-order properties) that *merit* causal status independent of their physical realization. The EC believes granting this status violates physical closure. The NRC believes denying it violates the reality of the special sciences.
  3.  **Resolution Path:** We must stop asking "Is $M$ a cause?" and start asking "Does the world contain dependency structures at the mental grain that are not captured by the physical grain, and do those structures merit the label 'causal'?"

  ## 4. Drafter's Closing Note
  *Meta-commentary on the draft, the "Sufficiency" hunch, and failure points.*

  **On the "Sufficiency" Hunch:**
  You asked whether the distinction between "sufficient for *occurrence*" vs. "sufficient for *difference*" dissolves the fight or relocates it. My assessment: **It relocates the fight one step back, but to more fertile ground.**
  *   If we stick to "occurrence," the Exclusionist wins on closure, but the Non-Reductivist rightly complains that this notion of causation is useless for science (which cares about differences, not just brute occurrences).
  *   If we switch to "difference," the Non-Reductivist wins on mental causation, but the Exclusionist rightly complains that we have changed the subject from metaphysics to epistemology.
  *   *The Relocation:* The fight moves from "Does $M$ cause $E$?" to "Which notion of sufficiency is required for a claim to be *ontologically serious*?" This doesn't solve the problem, but it stops the two sides from talking past each other. It forces the Exclusionist to defend why *production* is the only real causation, and the Non-Reductivist to defend why *difference-making* isn't just explanation.

  **Least Certain Agreed Claim:**
  I would bet least on **Claim #4 (No Systematic Overdetermination)**.
  *   *Reason:* This is the easiest escape hatch for the Non-Reductivist. If they can argue that mental and physical causes are *not* independent (because one realizes the other), they might argue this isn't "systematic overdetermination" in the miraculous sense, but a benign, structured overdetermination. If the NRC signs Claim #4, they may feel trapped later. If they don't, the Exclusion Argument loses its bite immediately.

  **What Would Move the Needle:**
  *   **For the Exclusionist:** A demonstration that "difference-making" cannot be reduced to physical production *without loss of predictive power*. If the NRC can show a case where knowing the physical cause $P$ fails to predict the outcome $E$ as accurately as knowing the mental cause $M$ (in a non-epistemic way), the EC position weakens.
  *   **For the Non-Reductivist:** A demonstration that "difference-making" at the mental level does not rely on a hidden physical production layer. If the NRC cannot explain *how* the difference is made without sneaking in physical production, they risk dualism.

  **Likely Failure Points:**
  1.  **The Grain Shift Case:** This is the weakest link in this collaboration. The Exclusionist will likely refuse to accept that "She reached for the glass" and "Her hand moved at $v$" are competing descriptions of the *same* effect token in a way that changes causal truth values. They will argue the effect *is* the physical movement, full stop. If we cannot agree on the individuation of the effect, the table collapses.
  2.  **Wording Acceptance:** The Exclusionist may refuse to sign the NRC formulation in Crux #1 ("...physical base is too specific..."). They view the physical base as *exactly specific enough*. Compromise wording here will be difficult without losing philosophical precision.
  3.  **Independence of Cruxes:** Crux #1 (Sufficiency) and Crux #3 (Multiple Realizability) are not independent. If you win on Sufficiency (Difference vs. Occurrence), you largely win on Multiple Realizability. This table might overstate the modularity of the disagreement.

  **Final Advice:**
  Do not treat this document as a treaty. Treat it as a map of the minefield. The value of this collaboration is not in signing it, but in seeing which lines each side refuses to initial. That refusal is where the actual philosophy lives.
