  # Q&A Preparation Sheet

  ### Strategic Overview
  *   **Losing the Argument:** The **Realist Philosopher's Hard Problem** objection (#4). If you cannot explain why the draft *seems* like anything without invoking the very thing you deny, the philosophy fails.
  *   **Losing the Room:** The **Med Humanities Pain** objection (#1). If you appear to dismiss the reality of suffering, the literary and medical audience will reject you regardless of logical coherence.
  *   **The Single Survival Reply:** You must land the reply to **Objection #1 (Pain)**. You explicitly stated you would rather give up the conclusion than the moral seriousness of pain. If this reply fails, you violate your own constraint and alienate the most vulnerable segment of the audience.
  *   **Required Concessions:**
      *   **On Pain:** Concede that in moral and clinical contexts, the word "real" must apply to the pain, not just the machinery. Do not use "draft" as a dismissive term in practical contexts.
      *   **On Truth:** Concede that your talk itself is a "draft" in your own terms, but argue that this makes it useful, not false.

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The Moral Dismissal (Med Humanities Grad Students)
  *   **Likelihood:** High | **Damage:** Critical (Room + Constraint)
  *   **Voice:** "If I tell a patient her agony is just a 'draft,' I have betrayed her. You say pain retains moral weight, but your ontology makes it a fiction. How is that not gaslighting?"
  *   **Reply:** "I am not saying the pain is fake; I am saying the *explanation* of the pain is a draft. The suffering is a real event in the organism. If a building is collapsing, the alarm is a draft, but the danger is real. We treat the alarm because the danger is real. My view demands we take the report seriously precisely because it is the organism's only steering mechanism."
  *   **Soft Spot:** Doesn't fully address the *qualitative* horror of suffering, only the functional danger.
  *   **Concession:** **Yes.** Concede that "draft" is poor clinical language. Promise to use "real pain" in moral contexts and reserve "draft" for metaphysical discussion.

  #### 2. The Death of Fiction (Novelists/Literary Scholars)
  *   **Likelihood:** High | **Damage:** High (Room)
  *   **Voice:** "Fiction relies on privileged access to interiority. If there is no 'what it is like,' only a compressed summary, you've reduced the novel to a report on errors. What becomes of character depth?"
  *   **Reply:** "Character depth *is* the complexity of the drafting process. Fiction doesn't show us a hidden soul; it shows us the struggle of the monitoring system trying to summarize itself. When Woolf writes consciousness, she is writing the draft being written. That doesn't reduce art; it makes art the record of the only reality we have."
  *   **Soft Spot:** May feel like a redefinition of "depth" that strips it of mystery.
  *   **Concession:** No. Stand firm, but soften the tone.

  #### 3. The Self-Refutation (Your Candidate)
  *   **Likelihood:** Medium | **Damage:** High (Argument)
  *   **Voice:** "You say avowals are drafts whose correctness is adequacy, not truth. So is your claim that 'there are no phenomenal properties' true? Or just adequate? If adequate, you haven't told us anything true."
  *   **Reply:** "It is adequate. But 'adequate' is the only version of 'true' available to a system that cannot read its own source code. I am offering you a better map. A map isn't the territory, but if it gets you home, it succeeds. I am asking you to trade a broken map for one that works."
  *   **Soft Spot:** Risks sounding like relativism ("truth is what works").
  *   **Concession:** **Yes.** Concede the paradox. Admit the talk is a draft, but argue that recognizing this prevents dogmatism.

  #### 4. The Hard Problem Remainder (Realist Philosopher)
  *   **Likelihood:** High | **Damage:** High (Argument)
  *   **Voice:** "You've explained the report, but not the seeming. Why does the draft *feel* like anything? You've moved the explanandum, not solved it."
  *   **Reply:** "The 'feeling' is the issuing of the draft. There is no second step where the draft is felt. To ask why the draft feels like something is to ask why the output is output. The seeming is the operation, not the object."
  *   **Soft Spot:** Intuitively unsatisfying; feels like denying the question rather than answering it.
  *   **Concession:** No.

  #### 5. The Confabulation Charge (Cognitive Psychologist)
  *   **Likelihood:** High | **Damage:** Medium (Credibility)
  *   **Voice:** "Metacognitive confabulation is established science. Why dress this up as 'drafting'? What does this predict that the confabulation literature doesn't?"
  *   **Reply:** "Confabulation implies error against a truth. 'Drafting' implies there was never a transcript to begin with. It predicts we shouldn't look for the 'true state' being obscured. It shifts research from accuracy to utility: how do these summaries steer behavior? It's a functional shift, not just an error claim."
  *   **Soft Spot:** The empirical distinction is thin.
  *   **Concession:** No.

  #### 6. The Reification Trap (Illusionist Philosopher)
  *   **Likelihood:** Medium | **Damage:** Medium (Credibility)
  *   **Voice:** "You're treating the monitoring subsystem and the floor as real entities. Isn't that just smuggling in the homunculus you claim to remove?"
  *   **Reply:** "They are real as functional components, like a carburetor is real in an engine. I'm not positing a little man inside, just feedback loops. The 'floor' is where the loops end, not a place. I'm committed to the machinery, not the ghost."
  *   **Soft Spot:** Risk of implying the machinery itself has phenomenal properties.
  *   **Concession:** No.

  #### 7. The Authority Loss (Literary Scholars)
  *   **Likelihood:** Medium | **Damage:** Medium (Room)
  *   **Voice:** "If introspection is just a draft, the narrator is unreliable by default. First-person authority collapses. How do we judge truth in memoir or lyric?"
  *   **Reply:** "Authority was always social, not metaphysical. We trust the narrator because the draft is serviceable for connection, not because it matches a hidden state. This doesn't collapse authority; it grounds it in community uptake rather than private magic."
  *   **Soft Spot:** Undermines the romantic ideal of the solitary genius.
  *   **Concession:** No.

  #### 8. The Clinical Empathy Gap (Med Humanities)
  *   **Likelihood:** Medium | **Damage:** Medium (Room)
  *   **Voice:** "Empathy requires believing the patient's world. If you see their world as a draft, you stand outside it. You become a technician, not a healer."
  *   **Reply:** "Empathy is sharing the draft, not verifying the ontology. When I comfort you, I am accepting your draft into my own system. My view explains *how* empathy works physically, without needing magic. It makes empathy more robust, not less."
  *   **Soft Spot:** Can sound coldly mechanistic.
  *   **Concession:** **Yes.** Acknowledge that in the clinic, the technician stance is harmful. Theory must not override care.

  #### 9. The Knowledge Argument (Realist Philosopher)
  *   **Likelihood:** Low | **Damage:** Low (Argument)
