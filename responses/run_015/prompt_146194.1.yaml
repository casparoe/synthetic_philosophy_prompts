      *(Refining the "Environmental" argument)*: This is the crux. If the march turns the street into a "hostile environment," is that harm? Mill talks about nuisance. Is this a moral nuisance? Mill allows regulation of "public decency" to some extent (e.g., sexual acts in public). Could Nazi symbols be akin to public indecency? Mill might say no, because it's political. But the prompt asks to treat it as *structural*. I need to argue that Mill lacks the ontology for "social space" as a protected interest.

  8.  **Final Polish:** Check against all constraints in the prompt.
