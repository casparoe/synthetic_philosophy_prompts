answer: |-
  The wind outside the station was a physical weight, pressing against the reinforced polycarbonate of the observation deck. Inside, the only light came from the green phosphor of the monitoring screens and the warm, flickering glow of a kerosene lamp on the steel table between them. Dr. Selene Marchetti traced the helical structure on the tablet with a stylus, her face shadowed.

  "The data from the horizontal transfer is unambiguous, Rowan," Selene said, her voice low, competing with the hum of the air filtration system. "In the recipient strains, the ribozyme is present. It replicates. But it is not selected for. It is a passenger. To call it functional there is to misunderstand what 'function' means in biology."

  Dr. Rowan Kessler sat opposite, cradling a mug of tea that had long since gone cold. She leaned forward, the lamplight catching the sharp angle of her cheekbone. "It is present, and it is structurally identical to the regulatory brake in the donor strain. If we disrupt it in the recipient, does the cell die?"

  "Not from thermal shock," Selene replied. "The recipient strains inhabit a different niche. The thermal pathway is dormant. The ribozyme binds, it folds, but it contributes nothing to the survival of the organism in its current environment. It is a ghost of a purpose that no longer exists."

  "But suppose," Rowan said, setting the mug down, "that in binding, it incidentally stabilizes the mRNA of a different gene, one crucial for cold tolerance. Suppose the cell, without intending it, without any history of selection for this specific trait, now relies on that ribozyme to survive the Arctic night. Is it not then functional?"

  Selene shook her head, the movement sharp. "It is a causal contribution, yes. A side effect. But it is not a *proper* function. You are conflating what a trait *does* with what it is *for*. In the recipient strain, there is no history of selection that explains the presence of the ribozyme *in virtue of* that stabilizing effect. It is there because of a transfer event, a molecular infection. If the ribozyme mutates and loses that stabilizing effect, the cell dies, but the ribozyme has not 'malfunctioned.' It has merely changed. It cannot fail to do what it was never selected to do."

  Rowan tapped the table, a rhythmic, thoughtful beat. "You anchor the normativity in the past. You say the ribozyme cannot fail because it has no history of success in this lineage. But look at the system from the inside, Selene. The cell is a self-maintaining architecture. If the ribozyme is woven into the feedback loop that keeps the membrane intact, the system treats it as indispensable. The cell 'expects' it to be there. If the ribozyme vanishes, the system collapses. That expectation, that dependency, is where the normativity lives. Not in the genealogy."

  "That is presentism," Selene said, though she softened the edge of the word. "You are describing a mechanical necessity, not a biological function. Consider the origin of the ribozyme in the donor strain. It began as a parasitic error. A replication mistake. For generations, it replicated, but it did nothing. By your account, was it functional then? It had a causal role—it consumed nucleotides, it occupied space."

  "It had a function only when the system began to exploit it," Rowan corrected. "When the thermal shock pathway recruited it as a brake. At that moment, before selection had time to act, before it was 'maintained' by history, it was already functioning. The selection ratified the function; it did not create it."

  "Without the selection," Selene countered, "you cannot distinguish the function from the accident. When it was a parasite, it consumed nucleotides. When it became a brake, it consumed nucleotides *and* regulated heat. Why is one a function and the other not? Both are causal contributions. The only difference is that the regulation is why the trait persists *now*. The etiology is the filter that separates the purposeful from the merely existent."

  She paused, looking out at the white darkness beyond the glass. "In the recipient strains, we see the reverse. The trait exists, but the filter is absent. To ascribe function there is to project a narrative onto a mechanism that is merely ticking over. It is a category mistake. You are treating the cell like a machine designed by an engineer, where the blueprint matters less than the gear's current position. But the cell is a product of history. Its 'purposes' are sedimented survival strategies."

  Rowan leaned back, folding her arms. "I am not treating the cell as designed. I am treating it as a system with capacities. If I ask, 'What is the function of the heart?' I am asking, 'What does it do that contributes to the circulation of blood?' I am not asking, 'Why did the ancestors of this organism keep this pump?' If we engineer a synthetic pump into a creature that has no evolutionary history of having a heart, but the creature survives because of it, you would tell me the pump has no function? That it is merely causing blood to move?"

  "I would say it performs a service," Selene said. "But until the lineage is maintained *because* of that service, it is not a biological function. It is a prosthesis. And in the recipient strains, this ribozyme is a prosthesis the cell didn't ask for. It hasn't been integrated into the normative structure of the lineage."

  "Normative structure," Rowan repeated, tasting the phrase. "You mean the history of selection."

  "I mean the standard by which we judge it as good or bad, working or broken."

  Rowan considered this. The wind howled, a long, mournful note against the station's hull. "I think you are protecting the concept of function from becoming too broad, Selene. If every causal effect is a function, the word loses its bite. I agree. But I fear you are making it too narrow. You require a history of selection *for that specific contribution*. But what of the co-option moment? When the ribozyme first acted as a brake in the donor strain, it was not yet selected. It was a lucky accident. Was it functional then?"

  Selene hesitated. The stylus hovered over the tablet. "It was proto-functional. It became functional only once the selection pressure locked it in."

  "So there was a period," Rowan pressed, "where the cell was surviving thermal shock *because* of the ribozyme, the ribozyme was contributing to the system's capacity, yet you deny it had a function? That seems to sever the link between what the organism *does* to survive and what we say its parts are *for*."

  "It severs the link between survival and purpose," Selene said quietly. "Survival is a fact. Purpose is a story we tell about why that fact persists."

  "Perhaps," Rowan said, her voice dropping to match the quiet of the room. "But consider the refinement I must make. I cannot simply say 'any causal role is a function.' I must concede that the system must *exploit* the trait. It is not enough that the ribozyme warms the cell by friction. The architecture must recruit it. So, my position is not that history is irrelevant, but that it is explanatory, not definitional. History tells us *how* the integration happened. Integration tells us *that* it is functional."

  Selene nodded slowly. "And I must concede that the 'history' I demand need not be a long, deep genealogy. But it must be a history of *selection for the contribution*. In the recipient strain, even if the cell relies on the ribozyme today, if that reliance has not been tested by selection, the normativity is fragile. It is a contingency, not a function."

  "So we arrive at the crux," Rowan said, gesturing to the lamp between them. "For you, the normativity—the 'ought'—comes from the past. The ribozyme *ought* to regulate heat because its ancestors *did* and survived. For me, the 'ought' comes from the present system. The ribozyme *ought* to regulate heat because the cell *needs* it to now to maintain itself."

  "Exactly," Selene said. "If the environment shifts tomorrow and the regulation becomes harmful, for me, the function remains until selection removes it. The trait has a 'purpose' that is now out of sync with reality."

  "And for me," Rowan finished, "the function vanishes the moment the contribution becomes detrimental to the system's capacity. The purpose is identical to the current utility."

  Selene looked down at the ribozyme structure on the screen, the glowing green helix spinning slowly in the void of the display. "In the recipient strains, then, we will disagree. I will call it genomic drift. You will call it latent function, waiting for integration."

  "I will call it functional if the system holds it," Rowan said. "Even if the history is missing. Especially then. It shows that function is a property of the living present, not a monument to the past."

  Selene capped her stylus. The click was loud in the small room. "And I will maintain that without the past, the present is just physics. Biology requires the ghost of selection to haunt the machine."

  "The storm isn't lifting," Rowan observed, glancing at the window where the snow blurred the world into nothingness.

  "No," Selene said, turning back to the lamp. "But we are still warm. For now, the system holds."

  "For now," Rowan agreed, reaching for the kettle. "And perhaps that is the only function that matters tonight."
