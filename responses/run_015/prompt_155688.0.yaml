answer: |-
  National character is coherent only if treated as an institutional script rather than a psychological essence. An adequate theory must explain how states coordinate populations without reducing traits to individual minds or freezing them historically. Essentialism fails empirical constraints; pure descriptivism misses the normative force. The bureaucratic performative framing offers the only viable path that respects both psychological data and political reality. It must treat character as a tool for governance, not a soul.

  Non-negotiables include accommodating historical change and cross-cultural psychology; immutability claims are empirically false. Theories must distinguish statistical clustering from normative stereotypes and group description from individual prediction to prevent determinism. Crucially, they must explain diaspora continuity and subnational variation without relying solely on state boundaries. The bureaucratic performative frame is a theoretical preference but necessary to explain why the script sticks: it functions as a coordination mechanism independent of individual belief. Camp preferences include weighting pre-state societies versus modern nations.

  Essentialism scores poorly, failing non-negotiables by ignoring historical change and psychological variance. Descriptivism meets empirical constraints but collapses the descriptive/prescriptive distinction, unable to explain why the script motivates action or coordinates behavior. Constructivism handles historical change and the bureaucratic framing best, treating character as a tool of state coordination rather than a mental fact. However, it risks over-intellectualizing if it ignores statistical realities. Only a constructivist account incorporating the performative script satisfies the need to explain coordination without reductionism, though it must remain vigilant against erasing genuine behavioral clusters.
