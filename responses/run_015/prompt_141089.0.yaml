  **ITEM 4.2.1: TRI-POSITION ARMREST ASSEMBLY (MODEL 77-B)**
  **Application:** Designed for installation on standard transit waiting benches. The 77-B utilizes segmented seating planes to maximize turnover during peak hours while preventing recumbency during off-peak cycles. The center position remains open for standard seating; outer positions are contoured to inhibit horizontal occupation without invoking explicit signage. This delegates occupancy management to the physical form, reducing attendant conflict.
  **Specifications:** Material: Cast Iron / Finish: Anti-Graffiti Powder Coat / Load: 250kg per segment / **Social Effect: Passive Exclusion (Night-Use Deterrent)** / Lead Time: 6 Weeks.
  **Note:** Effect warranted only when installed at intervals not exceeding 1.5 meters.

  **ITEM 4.2.2: PARKWAY OVERPASS SPAN (MODEL OV-9)**
  **Application:** Standard geometry for municipal artery crossings. The OV-9 provides a vertical clearance of 3.8 meters. This dimension accommodates private passenger vehicles and standard delivery vans while excluding high-profile public transit buses and heavy freight transport from designated residential connectors. This ensures traffic composition aligns with zoning density without requiring active enforcement or checkpoint staffing.
  **Specifications:** Material: Pre-Stressed Concrete / Finish: Unpainted Weathering Steel / Clearance: 3.8m ± 5cm / **Social Effect: Route Segregation (Class-Based)** / Lead Time: 18 Months.
  **Note:** Deviations from clearance tolerance require Level 4 Social Impact Review.

  **ITEM 4.2.3: AUTOMATED CYCLE GATE (MODEL AG-4)**
  **Application:** Turnstile mechanism for public conveniences and subsidized transit entry. The AG-4 operates on a fixed 45-second cycle per user. This duration is calibrated to allow standard hygiene or entry procedures while making loitering or secondary usage economically inefficient. The machine settles the question of dwell time so that no attendant has to decide it, removing human discretion from norm enforcement.
  **Specifications:** Material: Stainless Steel 304 / Power: 24V DC / Cycle: 45s Fixed / **Social Effect: Temporal Norm Enforcement** / Lead Time: 12 Weeks.
  **Note:** Manual override key held by Shift Supervisor only.

  **ITEM 4.2.4: UTILITY DISTRIBUTION MODULES (MODEL P-C / MODEL P-D)**
  **Application:** Clients must select one of two mutually exclusive distribution architectures. The **P-C Central Plant** offers high efficiency but requires continuous custody and a defined exclusion zone around the perimeter. The **P-D Distributed Kit** consists of decentralized cells compatible with open access but requires higher staffing levels for maintenance and assumes distributed liability among local stakeholders.
  **Specifications:**
  *   **P-C:** Capacity: 50MW / **Social Effect: Hierarchical Custody** / Accessories: Security Perimeter (Required), Guard Force (Optional Bolt-On).
  *   **P-D:** Capacity: 5MW per cell / **Social Effect: Distributed Liability** / Accessories: Community Oversight Committee (Required), Maintenance Training (Required).
  **Note:** Mixing modules voids social effect warranty.

  **ITEM 4.2.5: OPEN ACCESS PLAZA MODULE (MODEL Z-0)**
  **Application:** General gathering space certified by the Bureau of Ethical Design for maximum neutrality. The Z-0 features no seating, no shelter, no surveillance mounts, and no defined pathways. All edges are permeable. Lighting is ambient only. The design incorporates all public vote inputs regarding inclusion, resulting in a surface that refuses to direct movement or behavior in any specific direction.
  **Specifications:** Material: Non-Slip Aggregate / Finish: None / Surveillance: 0% / **Social Effect: Certified Neutral (Participation Rating: 100%)** / Lead Time: Indefinite.
  **Note:** Due to full compliance with non-exclusion protocols, this module cannot support organized assembly or sheltered activity. Usable only as a monument to procedure.

  **HOW TO ORDER**
  Submit Form P-90 via municipal portal. Specify desired Social Effect category. Installation requires site verification by a Certified Social Auditor. All effects are warranted under **Standard Social Conditions** as defined in Appendix Q (see definition of "Public," "Loitering," and "Normalcy"). Deviations in local demographic density or economic stress levels may alter warranted outcomes. Department assumes no liability for effects produced by non-certified modifications or unauthorized gathering.

  **FOOTNOTE**
  ¹ Social Effect warranties are contingent upon the surrounding regime maintaining stability indices within ±5% of the national average. The Department certifies the artifact's capacity to produce the listed effect, not the moral validity of the effect itself. Procurement officers are reminded that delegating decisions to objects does not absolve the municipality of responsibility, though it does streamline liability claims.

