      *   The "Math Collapse": In the game, students will try to maximize net utility ($P - S$). They will aggregate. When they hit the cliff, their aggregation formula breaks. They can't just "add more pleasure" to compensate. They have to realize the *structure* of the value changed, not just the quantity.
      *   The "Commensurability" Trap: Below the threshold, they act like classic hedonic utilitarians. Above it, they act like lexical prioritarians. The transition is the philosophical itch.

