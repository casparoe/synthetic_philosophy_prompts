      *   *Crucial Point:* The "Smoke Detector" analogy fails because a smoke detector's sound is only "bad" instrumentally. Pain's "badness" is often cited as the *reason* for the behavior, not just the cause.

  11. **Final Polish:** Ensure the tables are clear and the distinction between "sensory-discriminative" and "affective-motivative" is clear in the analysis of asymbolia. (Proceed to generate response).

