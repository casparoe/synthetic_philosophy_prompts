      *   **Core Debate:** Is pain bad *in itself* (qualia/experience) or bad *because of its consequences* (avoidance behavior, distress)?
      *   **Analogies to Audit:**
          1.  *Smoke Detector:* Alarm = Pain, Fire = Harm, Listener = Patient. Badness is in the Fire/Response, not the Alarm.
