      *   Tone: Philosophical, analytical, precise.
      *   Check constraints: Explicit correspondence tables? Yes. Disanalogies? Yes. Location of badness? Yes. Verdict? Yes. Better comparison? Yes.

  10. **Self-Correction/Nuance Check:**
