      *   *Rule A (The "Future Value" Rule):* Continuation is rational if there is independent future utility/value (use value, operating cost recovery) that exists *separate* from the sunk costs or external perception. If the future benefit justifies the *marginal* cost, it's persistence. (Supported by Case 4).
      *   *Rule B (The "Justification Source" Rule):* Continuation is irrational if the *primary justification* offered relies on sunk costs, external perception, reputation, or competitive standing, even if some future value exists. If the reasoning appeals to "looking bad if we stop" or "we spent too much to stop," it's escalation. (Supported by Cases 1, 2, 3, 5).

