answer: |-
  You are groping toward a principle that distinguishes between **empirical stagnation** and **theoretical isolation**. Your intuitions hinge on whether a programme is the only game in town for *data* (Wegener) versus the only game in town for *math* (String Theory). You also want to distinguish between *heuristic guidance* (who gets credit for a discovery) and *theoretical truth* (which programme was right).

  Here is the criterion that captures your intuitions most precisely, followed by the cost you must pay to hold it.

  ### The Principle of Empirical Leverage (ELP)

  A Research Programme $P$ is **Degenerating** at time $t$ if and only if:

  1.  **No Novel Empirical Risk:** $P$ has failed to produce confirmed novel *empirical* predictions in a period sufficient for its auxiliary belt to mature (excluding delays caused solely by instrumental sensitivity); **AND**
  2.  **No Empirical Monopoly:** Either (a) a rival programme exists that accounts for $P$'s empirical successes without $P$'s ad hoc adjustments, **OR** (b) $P$'s primary motivation is the resolution of *theoretical* anomalies (internal consistency) rather than *empirical* anomalies (recalcitrant data).

  **Corollary (Credit Assignment):** Empirical discoveries made while working within a programme's heuristic count as content of *that* programme, regardless of whether the programme's hard core is later deemed false.

  ---

  ### Application to Your Cases

  *   **Phlogiston (1770s):** **Degenerating.**
      *   *Clause 1:* Failed novel prediction (weight gain was accommodated via negative weight).
      *   *Clause 2a:* Rival (Oxygen) existed and explained the data better.
      *   *Note:* The discovery of oxygen by phlogistonists counts as *Phlogiston's* content under the Corollary, even if the theory was wrong.
  *   **Lorentzian Aether (post-1887):** **Degenerating.**
      *   *Clause 1:* Contraction was an accommodation of the MM null result, not a novel prediction.
      *   *Clause 2a:* Rival (Einstein) accounted for the same math with a more coherent hard core.
      *   *Resolution of Discomfort:* The "truth" (contraction relations) was in the belt, not the core. A degenerating programme can contain true belt hypotheses; degeneration refers to the *strategy* of protecting the core, not the truth-value of every equation.
  *   **Wegener (Interwar):** **Not Degenerating.**
      *   *Clause 1:* No novel predictions (mechanism missing).
      *   *Clause 2:* **Has Empirical Monopoly.** Rivals (fixed continents) could *not* explain the fossil/coastline data. The anomaly was empirical, not theoretical.
  *   **String Theory/SUSY (Last 40 years):** **Degenerating.**
      *   *Clause 1:* No confirmed novel empirical predictions.
      *   *Clause 2b:* **Fails Empirical Monopoly.** The anomaly is *theoretical* (unifying gravity/QFT), not empirical. No data exists that String Theory explains and rivals cannot.
  *   **Gravitational Waves (Dry Spell):** **Not Degenerating.**
      *   *Clause 1 Exception:* The prediction was fixed; the delay was instrumental. The "period sufficient for maturity" clock was paused until detectors were ready.

  ### Application to Your Invented Cases

  *   **Case 1 (Confirmation-without-Novelty):** **Degenerating.**
      *   It satisfies Clause 1 (no novelty). Unless it holds an Empirical Monopoly on data rivals can't explain (unlikely if it's just accommodating known data), it triggers Clause 2. Accommodating known facts is the definition of degeneration.
  *   **Case 2 (Definitional Retreat):** **Non-Scientific (Pseudo-Programme).**
      *   If the hard core is definitional and reinterpretations are published in advance to avoid risk, the programme is unfalsifiable by design. It fails the basic entry requirement for MSRP. It is not degenerating; it is metaphysical.

  ### The Unthought-of Case: The Neutrino Hypothesis (1930–1956)

  *   **Context:** Pauli postulates the neutrino to save energy conservation in beta decay. No detection for 25 years. Rivals (e.g., Bohr's suggestion that energy conservation is statistical only) exist.
  *   **Verdict:** **Not Degenerating.**
  *   **Reasoning:** It satisfies Clause 1 (no detection yet), *but* it satisfies the **Empirical Monopoly** condition of Clause 2. The beta-decay spectrum was a recalcitrant *empirical* anomaly. The neutrino hypothesis was the only one that preserved the hard core of conservation laws while fitting the spectral shape. Bohr's rival abandoned a fundamental law. Until detection, the neutrino programme held a monopoly on saving the empirical phenomena *and* the theoretical core.

  ### The Verdict I Cannot Accommodate

  To keep this principle to two clauses (plus the instrumental exception), I must overturn your intuition regarding **Phlogiston Credit**.

  *   **Your Intuition:** Discoveries made by phlogistonists (like oxygen) belong to the rival Oxygen programme because Phlogiston was false.
  *   **The Principle's Verdict:** They belong to the **Phlogiston Programme**.
  *   **The Cost:** You must accept that "progress" in MSRP is about *heuristic guidance*, not *ontological truth*. If a false theory guides you to a new gas, that is a success of the false theory's heuristic. To credit Oxygen retroactively is "Whig history"—judging the past by the present. The principle forces you to admit that a degenerating programme can still generate content, even if that content ultimately kills it.

  ### Prospective Use: What This Licenses You to Do

  Your philosopher is half-right: strict *confirmation* is retrospective. But *risk assessment* is prospective. This principle licenses the following actions **at the time**:

  1.  **The "Wegener" Bet (High Risk, High Reward):** If a programme has an **Empirical Monopoly** (explains data no one else can) but lacks a mechanism, **fund it defensively**. It is not degenerating, but it is fragile. Hire students to work on the *mechanism* (auxiliaries), not the core.
  2.  **The "String Theory" Cut (Theoretical Isolation):** If a programme is solving **Theoretical Anomalies** without empirical hooks and has no Empirical Monopoly, **stop funding new theoretical posts**. It is degenerating by Clause 2b. Fund only instrumental work that could falsify it (e.g., build the collider that finds SUSY or kills it).
  3.  **The "Gravitational Wave" Hold:** If a prediction is fixed and the delay is instrumental, **fund the apparatus, not the theory**. The theory is static; the bottleneck is engineering. Do not judge the programme as degenerating during the build.

  ### Summary of the Trade-off

  You asked for a two-clause principle that overturns one verdict rather than a seven-clause one that saves them all.
  *   **The Gain:** You resolve the Wegener/String Theory tension cleanly (Empirical vs. Theoretical Anomaly). You resolve the Lorentz discomfort (Truth can exist in a degenerating belt).
  *   **The Loss:** You must abandon the idea that *truth* determines *credit*. You must acknowledge that Priestley discovered oxygen *as a phlogistonist*, and that counts as a success for phlogiston, even if phlogiston was dying. This is the price of a heuristic methodology: it tracks how scientists *work*, not just what they *got right*.
