answer: |-
  ### Exam Prompt

  **Question 4: The Ontology of Death (25 Marks)**

  **Scenario:**
  Patient X has been on ECMO (mechanical heart-lung support) for three weeks. EEG scans show zero detectable brain activity, and there is no chance of recovery. However, the heart continues to beat because the machine pumps oxygenated blood. The medical team wants to declare neurological death and cease support. The family objects, citing a religious tradition that defines death strictly as the "natural" cessation of cardiac function. They argue that stopping the machine would be killing, not accepting death.

  **Task:**
  Write an essay (approx. 400–500 words) addressing the following:
  1.  Is declaring Patient X dead based on neurological criteria a **biological discovery** (finding a fact about the body) or a **value-laden decision** (choosing a definition based on what we think matters)?
  2.  Can there be one universal correct criterion for death, or do different cultures simply choose the criterion that serves their specific moral or religious purposes?

  *Note: Do not simply list medical differences. Focus on the philosophical justification for the criteria.*

  ***

  ### Model Answer (A-Grade Example)

  The conflict over Patient X reveals that declaring death is not merely a biological discovery but a value-laden decision disguised as science. While biology describes physiological processes, it cannot dictate which process marks the end of a human being without relying on prior normative assumptions about what constitutes "life."

  Proponents of neurological criteria argue that the brain is the body's integrator. Without it, the body is merely a collection of tissues, not an organism. However, this relies on a specific philosophical definition of an organism as a "functioning whole" rather than a collection of beating cells. If life is defined strictly by cellular metabolism, Patient X is alive. If life is defined by conscious potential or somatic integration, Patient X is dead. Biology can tell us the brain is off and the heart is pumping, but it cannot tell us which of those facts matters more. Choosing the brain requires valuing consciousness or integration over circulation. Therefore, the diagnosis is not a pure fact; it is a decision about which biological functions hold moral weight.

  Regarding universalism, the idea that there is one correct criterion assumes a single metaphysical truth about human nature. However, if death criteria depend on what we value (e.g., consciousness vs. cardiac vitality), then different cultures may legitimately prioritize different functions. The family's tradition values "natural" cardiac cessation, implying that technological interference invalidates the death event. This is not scientifically wrong; it is axiologically different. They are operating with a different concept of the person—one where the heart symbolizes the seat of life regardless of neural activity.

  However, accepting total relativism creates practical issues for law and organ transplantation. A society needs a uniform standard to manage resources and legal status. Thus, while there may not be one metaphysical "truth" about death discoverable by science, there may be a pragmatic necessity for a universal legal standard. Yet, we must admit this standard is a social contract, not a biological fact.

  In conclusion, declaring Patient X dead is a normative choice about what functions define human existence. While a universal legal standard is pragmatically necessary, we must acknowledge it is not the only biologically defensible position. Respecting the family requires admitting that science alone cannot settle the boundary of life and death.

  ***

  ### Marking Scheme

  **Total: 25 Marks**

  **A-Grade (21–25 Marks): The Philosophical Analyst**
  *   **Fact/Value Distinction:** Explicitly argues that biology describes *states* (heart beating, brain off) but cannot select the *threshold* of death without a normative premise (e.g., noting that "integrated functioning" smuggles in a specific idea of what counts as an organism).
  *   **Universalism vs. Relativism:** Nuanced view. Acknowledges that while metaphysical truths about death might be relative to cultural values, pragmatic/legal uniformity might still be needed (or argues strongly for pluralism).
  *   **Terminology:** Uses terms like "normative," "ontological," "metaphysical," or "axiological" correctly.
  *   **Engagement:** Directly addresses the family's objection as a valid philosophical stance, not just an emotional one.

  **B-Grade (16–20 Marks): The Competent Explainer**
  *   **Fact/Value Distinction:** Identifies that there is a disagreement but may lean too heavily on "biology says brain death is real" without fully unpacking *why* we chose the brain.
  *   **Universalism vs. Relativism:** Takes a side (either "science is universal" or "culture matters") but lacks the synthesis or pragmatic counter-argument found in A answers.
  *   **Terminology:** Uses standard English correctly but lacks specific philosophical vocabulary.
  *   **Engagement:** Addresses the scenario but treats the family's view as primarily religious rather than conceptual.

  **Common Mistakes (Deductions)**
  *   **The "Scientism" Error (-5 marks):** Claiming brain death is an "objective fact" identical to a broken engine, ignoring that "death" is a status we assign, not just a physical event.
  *   **The "Medical List" Error (-5 marks):** Spending too much word count explaining how ECMO works rather than analyzing the definition of death.
  *   **Ignoring the Prompt (-10 marks):** Failing to address either the fact/value question or the universalism question.

  ***

  ### Confidence Statement

  **Confidence Level:** 90%

  **Least Certain Point:**
  I am least sure about the **word count constraint for the Model Answer**. I aimed for approximately 400 words, but philosophical depth often requires more space to avoid oversimplification. In a actual high school setting, a 400-word limit might force students to be too concise to fully earn the "A-Grade" criteria regarding nuanced universalism vs. relativism. You may want to adjust the suggested word count to 600 words to allow for the required depth.
