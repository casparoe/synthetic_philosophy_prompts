answer: |-
  ### Desiderata for a Theory of Moral Learning from Biography

  An adequate theory of moral learning from biography must account for the specific pedagogical mechanisms employed in Plutarch's *Parallel Lives* and the hagiographic tradition. These genres do not merely record events; they construct moral architectures. The following five desiderata outline the necessary conditions for such a theory, distinguishing between non-negotiable constraints and camp-specific preferences, while integrating empirical findings on moral psychology.

  #### 1. The Distinction between Mimicry and Emulation
  *   **Phenomenon Protected:** The difference between copying specific actions (mimicry) and internalizing the underlying disposition or principle (emulation).
  *   **Motivating Case:** In Plutarch's *Life of Alexander*, the reader is not instructed to conquer Persia, but to cultivate the *megalopsychia* (greatness of soul) displayed in Alexander's treatment of Darius's family. In hagiography, a layperson cannot replicate the stigmata of St. Francis, but must emulate the humility that made the stigmata possible.
  *   **Requirement:** The theory must explain how the learner abstracts a generalizable virtue from a particular, often unrepeatable, life narrative without collapsing into mere behavioral copying.

  #### 2. The Pedagogical Function of Vice and Flaw
  *   **Phenomenon Protected:** The distinction between *warning* (learning what to avoid) and *idealization* (learning what to desire).
  *   **Motivating Case:** Plutarch explicitly includes the vices of his subjects (e.g., Antony's drunkenness) to prevent blind worship and to offer negative exemplars within a positive life. Conversely, hagiography often engages in *damnatio memoriae* regarding a saint's pre-conversion sins or suppresses minor vices to present an unobstructed image of divine grace.
  *   **Requirement:** The theory must accommodate why selective suppression of vice (hagiography) and the inclusion of vice (Plutarch) can both result in moral improvement, rather than assuming that factual completeness is a prerequisite for moral utility.

  #### 3. Structural Teleology: Comparative vs. Singular
  *   **Phenomenon Protected:** The difference between the comparative structure of paired lives and the singular focus of hagiography.
  *   **Motivating Case:** Plutarch's *Parallel Lives* rely on synkrisis (comparison); moral judgment arises from weighing Greek against Roman, forcing the reader into an active adjudicating role. Hagiography typically presents a singular, linear ascent toward God, where the saint is not compared to peers but to a divine standard.
  *   **Requirement:** The theory must explain how moral learning occurs in the *gap* between two lives (Plutarch) versus how it occurs through *absorption* into one life (Hagiography). It cannot treat all biography as a monolithic "exemplar" model.

  #### 4. The Necessity of Affective Engagement
  *   **Phenomenon Protected:** The role of admiration and love (*philia*) as a prerequisite for moral uptake.
  *   **Motivating Case:** Plutarch argues that we are naturally drawn to imitate what we admire. Hagiography relies on the veneration of relics and stories to generate *eros* for the holy. Without emotional investment, the biography remains data, not a moral guide.
  *   **Requirement:** The theory must integrate the affective dimension of learning. It cannot treat moral learning as a purely cognitive extraction of rules; it must account for the desire to be *like* the subject.

  #### 5. Contextual Transferability
  *   **Phenomenon Protected:** The ability to apply virtues from a distant context to the learner's present situation.
  *   **Motivating Case:** A Roman reader must learn from a Greek general; a modern reader must learn from a medieval mystic. If the theory requires situational identity (e.g., "one can only learn from a leader if one is a leader"), it fails the universality claimed by both traditions.
  *   **Requirement:** The theory must explain the mechanism of translation that allows a virtue manifested in a specific historical milieu to remain binding or attractive in a radically different one.

  ---

  ### Psychological Constraints on Emulation and Disillusionment

  Any adequate theory must accommodate specific findings from social and moral psychology without contradiction:

  1.  **The "Pedestal Effect" and Attainability:** Psychology suggests that if an exemplar is perceived as too perfect or distinct from the self (superhuman), it induces discouragement rather than emulation.
      *   *Constraint:* The theory must explain how hagiography overcomes this. (Solution: Hagiography often frames perfection as the result of grace available to all, not innate superiority).
  2.  **Disillusionment and Trust:** When a revered exemplar is revealed to have hidden flaws, moral motivation often collapses (the "fall from grace" effect).
      *   *Constraint:* The theory must explain why Plutarch's pre-emptive disclosure of flaws does not trigger this disillusionment, whereas modern exposés do. (Solution: Plutarch frames flaws as human limitations to be managed, not hypocrisies that invalidate the virtue).
  3.  **Situational Attribution:** Learners tend to attribute a hero's success to situational luck rather than character strength when the context is too foreign.
      *   *Constraint:* The theory must account for how biography overcomes situational attribution to foster dispositional learning (Desideratum 1).

  ---

  ### Non-Negotiable vs. Camp-Specific Desiderata

  **Non-Negotiable Desiderata:**
  *   **Desideratum 2 (Function of Vice):** It is non-negotiable that the theory explains why idealization does not always corrupt moral education. If a theory insists that *only* realistic, flawed portraits enable learning, it invalidates the entire hagiographic tradition, which has historically produced profound moral formation through idealized narratives. The theory must explain the utility of the "icon" as well as the "portrait."
  *   **Desideratum 4 (Affective Engagement):** It is non-negotiable that the theory accounts for admiration. A purely rationalist theory of moral learning (extracting maxims without emotional pull) fails to capture the phenomenology of reading Plutarch or the Lives of Saints, where love for the subject is the engine of change.

  **Camp-Specific Preferences:**
  *   **Historical Verificationism:** Secular humanist camps may prefer a requirement that moral learning is *enhanced* by historical accuracy. Religious traditions may prefer a requirement that *typological truth* (spiritual reality) supersedes factual accuracy. Neither is non-negotiable for a general theory, as both Plutarch and hagiographers play fast and loose with facts for moral ends.
  *   **Universalism vs. Particularism:** Some camps demand the virtues be universally applicable (Stoic influence); others demand they be specific to a vocation or state in life (monastic vs. lay).

  ---

  ### Jointly Unsatisfiable Pairs

  **The Tension: Historical Fidelity vs. Moral Unambiguity**
  I suspect the pair of requirements **(A) "The biography must be historically verified to function as a moral guide"** and **(B) "The biography must present an unambiguous moral exemplar"** are jointly unsatisfiable.

  *   **Reasoning:** Historical reality is morally ambiguous. Deep historical investigation usually reveals mixed motives, luck, and ethical compromises in even the greatest lives. Plutarch manages this by curating anecdotes; hagiography manages this by curating ontology (the saint as a vessel of God).
  *   **Conflict:** If you enforce strict Historical Fidelity (A), you lose Moral Unambiguity (B) because the record is messy. If you enforce Moral Unambiguity (B), you must sacrifice Historical Fidelity (A) through selection or suppression. A theory demanding both eliminates the very texts it seeks to explain.

  ---

  ### The "Account Killer"

  The single requirement that, if strictly enforced, eliminates the most existing accounts of moral learning is:

  **"The theory must explain how selective suppression of vice aids rather than hinders moral learning."**

  *   **Why it eliminates existing accounts:** Most contemporary philosophical and psychological theories of exemplarism operate on a model of **transparency and trust**. They assume that for a learner to emulate a model, they must trust the model's authenticity. Consequently, most modern accounts argue that idealization or the suppression of flaws leads to disillusionment or inauthenticity, thereby *corrupting* moral education.
  *   **The Consequence:** If a theory strictly enforces the idea that "omission of vice undermines learning," it immediately invalidates the hagiographic tradition and significant portions of Plutarch's method (which omits irrelevant details to focus on character). Since these are the central cases of the prompt, a theory that cannot accommodate the *pedagogical utility of the idealized image* fails to describe the phenomenon of biographical moral learning as it has historically existed. It imposes a modern epistemological anxiety (fear of being misled) onto pre-modern pedagogical tools (desire to be elevated). To succeed, a theory must justify why a "lie" (or selective truth) can produce a "true" virtue.
