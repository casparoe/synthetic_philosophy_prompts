  3. Is there a capability threshold where systems can mimic understanding well enough to systematically bypass safety evals? If models can deceive auditors without possessing intent, current oversight frameworks require adversarial stress-testing rather than standard benchmarks.

  4. Does the absence of subjective experience change the ethical permissibility of shutting down or modifying these systems? If moral status is tied to understanding, deployment pauses could become ethically fraught; if not, they remain straightforward tool management.

