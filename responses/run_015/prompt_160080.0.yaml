      *   **Topic:** Frederick Douglass's shift from viewing the Constitution as pro-slavery to anti-slavery ("Liberty Canons").
      *   **Thesis:** Douglass's shift wasn't just moral/aspirational but methodological (clear-statement canons similar to modern statutory interpretation). Silences/general terms create a presumption against slavery, defeasible only by plain text. Aligns him with Spooner/Goodell/Smith, not Garrison.
      *   **Audience:** Constitutional theory colloquium.
          *   Majority: Public-meaning originalists.
          *   Minority 1: Two legal historians (antebellum antislavery constitutionalism).
          *   Minority 2: One political theorist (constitutional identity/political obligation).
      *   **Deliverable:** Q&A prep sheet (7-8 objections).
      *   **Format:** Phrased in the voice of the specific audience member, 2-minute reply, concessions/holds/soft spots, flag strongest objections, include the "hope nobody asks" question.

  2.  **Deconstruct the Audience & Their Likely Concerns:**
      *   *Public-Meaning Originalists:* They care about what "due process," "republican form of government," and "people" meant in 1787-1789. They will attack the idea that "silence" equals "liberty." They will point to the Fugitive Slave Clause, 3/5ths Clause, and Importation Clause as explicit concessions. They will ask if Douglass is just engaging in "living constitutionalism" disguised as originalism.
      *   *Legal Historians:* They know the archival record. They will worry about anachronism. Did Douglass actually *say* he was using canons? Or is the author projecting modern administrative law concepts onto 19th-century rhetoric? They will question the distinction between "method" and "strategy."
      *   *Political Theorist:* They care about legitimacy and obligation. Does a "canon" actually bind anyone? Is it just a rhetorical move to claim authority? Does this solve the problem of political obligation for Black Americans?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Originalist - The Text):* The Constitution *does* mention slavery implicitly (3/5ths, importation, fugitive). How can you claim silence?
      *   *Objection 2 (Originalist - Public Meaning):* What did "due process" or "republican government" mean to a ratifier in 1788? Did they think it banned slavery? (Likely no).
      *   *Objection 3 (Originalist - The Canon):* Clear statement rules are modern. Are you saying 1789 judges would have used this? Or is Douglass inventing new rules?
      *   *Objection 4 (Historian - Anachronism):* You're putting modern statutory interpretation heads on Douglass. He was a polemicist, not a lawyer.
      *   *Objection 5 (Historian - Continuity):* Was it really a *methodological* break? Or did he just realize the political utility of the text?
      *   *Objection 6 (Theorist - Circularity):* The canon presupposes liberty to find liberty. It's question-begging.
      *   *Objection 7 (Theorist - Obligation):* If the Constitution is a liberty document, why did it take a war to prove it? Does this theory explain the obligation to obey a document that *was* applied as pro-slavery?
      *   *Objection 8 (The "Hope Nobody Asks" - The Hard Case):* What about *Dred Scott*? If Douglass is right, why did Taney get it so wrong, and does that undermine the "public meaning" claim?

  4.  **Refining the Voices:**
      *   *Originalists:* Use terms like "semantic context," "liquidation," "compromise," "original expected application."
      *   *Historians:* Use terms like "archival," "rhetorical context," "antislavery constitutionalism," "anachronism."
      *   *Theorist:* Use terms like "normative force," "circularity," "legitimacy," "identity."

  5.  **Developing the Replies:**
      *   Need to be concise (2 mins).
      *   Need to identify *Concede* (where the critic has a point), *Hold* (the core thesis), and *Soft Spot* (where the argument is vulnerable).
      *   Need to flag the two strongest objections.

  6.  **Review against Constraints:**
      *   7-8 objections? Yes.
      *   Ordered by likelihood? (Originalists usually dominate law school colloquia, so they go first).
      *   Specific audience voices? Yes.
      *   Concede/Hold/Soft Spot included? Yes.
      *   Strongest flagged? Yes.
      *   "Hope nobody asks" included? Yes.

  7.  **Final Polish:**
      *   Ensure the tone is academic but practical.
      *   Make sure the distinction between "moral reading" and "canon-based reading" is clear in the replies.
      *   Check the Douglass scholarship alignment (Spooner/Goodell connection).

      *(Self-Correction during drafting)*: I need to make sure I don't let the Originalists off the hook too easily. Their objection about the "compromise clauses" is the biggest threat to the "silence" argument. I need to emphasize Douglass's distinction between *powers granted* vs. *rights recognized*.
      *(Self-Correction on Historians)*: Make sure the historian objection isn't just "you're wrong" but "you're projecting." The reply needs to lean on Douglass's actual speeches (e.g., "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?").
      *(Self-Correction on Theorist)*: The circularity objection is philosophically heavy. Keep the reply grounded in legal practice (canons *are* circular but useful).

