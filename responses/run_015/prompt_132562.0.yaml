answer: |-
  Here is a point-by-point adjudication of the exchange between Sam and Riley, followed by an analysis of the missing theoretical ground and an overall verdict.

  ### Adjudication of Moves

  **1. Sam's Functional Definition (Polity/V-Dem Thresholds)**
  *   **Rating:** **Partially Right**
  *   **Justification:** Sam is correct that operationalization requires measurable thresholds to avoid semantic drift. Relying on established datasets like V-Dem ensures replicability. However, he is mistaken in treating these indices as sufficient definitions. These scores are *lagging indicators* that aggregate expert surveys; they often drop only after backsliding is well underway. Defining the phenomenon solely by the measurement tool commits a methodological error (reifying the index). It tells you *that* democracy declined, but not *how* or *why*, rendering it useless for prevention.

  **2. Riley's Hard/Soft Distinction (Constitutional vs. Normative)**
  *   **Rating:** **Mostly Right**
  *   **Justification:** Riley correctly identifies that mechanisms matter. Distinguishing between changing the rules of the game (hard) and playing the game aggressively (soft) is essential for institutional analysis. However, her criterion of "technical reversibility" is weak. As Sam notes, the political cost of reversal often renders "soft" changes effectively permanent. The distinction is heuristically valuable but ontologically unstable if "reversibility" is defined legally rather than politically.

  **3. Sam's Reversibility Objection (Political Cost vs. Legal Fiction)**
  *   **Rating:** **Clearly Right**
  *   **Justification:** This is Sam's strongest point. In political science, the "cost of reversal" is a more accurate metric of institutional durability than the legal possibility of reversal. Court-packing creates new vested interests and path dependencies that make restoration improbable, even if legally permissible. Treating high-cost reversals as "soft" obscures the severity of the damage. Sam correctly identifies that Riley's framework underestimates the stickiness of institutional capture.

  **4. Riley's Asymmetric Category (Structural Bias)**
  *   **Rating:** **Ambiguous / Contested**
  *   **Justification:** Riley attempts to solve the partisanship problem by focusing on structural outcomes rather than intent. Theoretically, this is the correct move to save the concept from becoming a slur. However, operationally, it is fraught. Determining whether a rule is "asymmetric" requires a counterfactual baseline of neutrality that is difficult to establish empirically. While the *intent* of the category is sound, its application relies on assumptions about voter distribution and party coalitions that are themselves contested.

  **5. Sam's Smuggling Objection (Neutrality is Normative)**
  *   **Rating:** **Clearly Right**
  *   **Justification:** Sam exposes the fatal flaw in Riley's "asymmetry" argument. There is no view from nowhere. Declaring a media oversight board or NGO funding rule "neutral" requires a prior normative judgment about what the media landscape *should* look like. If one believes foreign funding distorts democracy, banning it is neutral; if one believes civil society requires it, banning it is asymmetric. Sam is correct that Riley's framework smuggles in a specific theory of legitimate state-society relations under the guise of structural analysis.

  ---

  ### What Both Are Missing

  **1. The Baseline Problem**
  Neither speaker addresses whether a democratic baseline is required for "backsliding." Can a hybrid regime backslide? If a country scores a 4 on the Polity scale (anocracy) and drops to a 2, is that backsliding, or just authoritarian consolidation? Most literature (e.g., Levitsky and Ziblatt) implies backsliding requires a prior democratic minimum, but without defining that floor, the term applies to any negative regime change.

  **2. Intent vs. Competence**
  The debate assumes institutional changes are strategic moves to entrench power. It ignores "decay by incompetence." A government might erode democratic norms not to rig elections, but through bureaucratic mismanagement or polarization they cannot control. A complete theory must distinguish between *sabotage* and *neglect*.

  **3. Subjective Legitimacy**
  Both focus on objective indicators (scores, laws, rules). They ignore the subjective belief of the citizenry. If voters perceive an election as unfair, democratic stability is compromised regardless of whether V-Dem coders mark it down. Backsliding is partly a psychological phenomenon regarding the loss of faith in the system's fairness.

  ---

  ### Can "Backsliding" Survive as a Non-Partisan Label?

  The concept can survive, but only if it is decoupled from specific policy outcomes and tied to **procedural reciprocity**.

  To avoid Sam's "smuggling" critique, the definition cannot rely on whether a policy is "neutral" (which is substantive). Instead, it must rely on whether the ruling party would accept the same restriction if they were in the opposition. This is the "turnover test."
  *   **Backsliding:** Passing a law you would oppose if the other party held power (e.g., gerrymandering, restricting opposition ballot access).
  *   **Reform:** Passing a law you would accept even if it disadvantaged you tomorrow (e.g., universal voter ID if you believe it reduces fraud, provided you accept it for your own voters too).

  This shifts the metric from "asymmetry of outcome" (Riley) to "consistency of principle" (a synthesis). However, this still relies on the normative premise that *reciprocity* is the core virtue of democracy, which is a contested philosophical claim.

  ---

  ### Overall Verdict

  **Winner: Riley (by a narrow margin)**

  **Reasoning:**
  Sam wins the epistemological argument: he correctly identifies that measurement tools are imperfect and that claims of neutrality are normative. His critique of Riley's "asymmetry" is logically devastating. However, Sam's alternative—defining backsliding purely by a drop in V-Dem scores—is intellectually passive. It treats the symptom as the disease and offers no framework for identifying risk before the score drops.

  Riley wins the ontological argument: she provides a framework for understanding the *mechanisms* of decay. Despite the vulnerabilities Sam points out, her distinctions (Hard/Soft, Asymmetric) are necessary for a study group trying to analyze *processes* rather than just record *outcomes*. Sam's functionalism tells you when a patient has died; Riley's framework helps you diagnose the illness while the patient is still alive.

  **Normative Flag:**
  My reasoning here depends on the contested premise that **political science should prioritize predictive utility over measurement purity.** If one believes that concepts must be strictly measurable to be valid (a positivist stance), Sam is the winner. If one believes concepts should be useful for identifying causal mechanisms even if measurement is noisy (a pragmatist stance), Riley is the winner. I have adjudicated in favor of the pragmatist stance, assuming your study group aims to understand dynamics, not just catalog scores.
