      *(One last check on the "Veil of Ignorance" bit)*: Scanlon explicitly distances himself from the Harsanyi/Rawls veil of ignorance model. He wants justification based on actual reasons people have, not hypothetical bargaining. I need to make sure this distinction is clear.

      *(One last check on Aggregation)*: Scanlon's "Rescue Case" is the canonical example. 1 person on rock A, 5 on rock B. Can you save the 5? Scanlon initially said "no, not just because they are more." Later he said "yes, if the harm is the same." The article assumes the "no." A defender uses the "yes."

