answer: |-
  Your instinct is correct. The article you read relies on a rigid, early-version interpretation of contractualism that most contemporary defenders have softened or clarified. It treats a specific, controversial implication as a settled dogma, and then uses that dogma to refute the view. A sophisticated defender of Scanlon's contractualism would reject the summary's absolute claims about aggregation while accepting the core framework.

  Here is a sentence-by-sentence breakdown of what a contractualist would accept, what they would call a fair compression, and what they would reject outright.

  **1. "Morality is the set of rules we'd sign up to if we had to pick them without knowing which person we'd turn out to be, and that ignorance is what makes the test impartial."**

  *   **Verdict:** **Misleading Compression.**
  *   **The Defense:** A Scanlonian would object to the "without knowing which person we'd turn out to be" phrasing. That is John Rawls's "veil of ignorance," which is a bargaining model. Scanlon's model is not about bargaining from ignorance; it is about justification from knowledge. In contractualism, you *do* know who everyone is and what their specific interests are. The impartiality comes from the requirement that you must find principles that no one could *reasonably reject* given their actual situation, not from pretending you don't have a situation.
  *   **Why it matters:** By framing it as a veil of ignorance, the article makes it sound like a calculation of risk (i.e., "I might be the one, so I'll minimize total harm"). Scanlon wants to avoid that. He wants to say, "I must justify my action to *you*, given that I know you are the one who will suffer."

  **2. "An act is wrong if some principle that no sensible, well-informed person could object to forbids it, so you basically ask, of each act, whether anyone could reasonably complain, and if they can, it's off the table."**

  *   **Verdict:** **Fair Compression.**
  *   **The Defense:** This captures the core formula: "An act is wrong if it would be disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced, general agreement." The article simplifies "principles for general regulation" to "act," which is a minor technical slip, but the "reasonable complaint" (or rejection) mechanism is accurate.
  *   **Nuance:** The key word is *reasonably*. It's not about whether someone *would* complain, but whether they have a *reasonable ground* for complaint. This allows the theory to filter out selfish or trivial complaints.

  **3. "The key consequence... is that you're never allowed to add people's complaints together, because justification has to be to each person one at a time."**

  *   **Verdict:** **Contested/Overstated.**
  *   **The Defense:** This is the "Individualist Restriction." A Scanlonian would accept that justification is owed to each person individually. However, they would reject the claim that you are *never* allowed to add complaints. The restriction is meant to prevent sacrificing one person's vital interests to satisfy the trivial interests of many. It is not meant to prevent counting numbers when the interests are comparable.
  *   **Why it matters:** The article presents a blanket ban on aggregation. A defender would say aggregation is blocked only when the burdens are *incommensurable* (e.g., life vs. headache). When burdens are of the same kind (e.g., life vs. life, or limb vs. limb), numbers can count.

  **4. "Which means, contractualism is committed to the claim that no number of headaches, or broken arms, or ruined afternoons can ever outweigh a single death: the one always wins, no matter how big the pile gets."**

  *   **Verdict:** **Reject Outright.**
  *   **The Defense:** This is the weakest link in the article. Scanlon himself has acknowledged that this is a problem for his earlier formulations and has adjusted the view. A defender would argue that while a million headaches might not outweigh a death (because the *type* of harm is too different in severity), a million broken arms *could* outweigh one death, or at least create a tie that requires a different tie-breaking procedure.
  *   **The Nuance:** Contractualism distinguishes between the *strength* of a generic reason. A reason to avoid death is stronger than a reason to avoid a headache. But if the "weaker" reasons are numerous enough and the harm is significant (not trivial), they can collectively constitute a reasonable rejection of a principle that sacrifices them. The article assumes a binary switch (aggregate or don't); the actual view allows for a threshold of significance.

  **5. "And since obviously we should save the million, the view is refuted."**

  *   **Verdict:** **Does Not Follow.**
  *   **The Defense:** Since premise #4 is an exaggeration, the conclusion doesn't land. If the view allows for aggregation in cases of comparable or sufficiently serious harm, then saving the million is consistent with contractualism. The refutation only works against a straw-man version of the theory that forbids *all* aggregation under *all* circumstances.

  ***

  ### The Sliding-Scale Stress Test

  You asked about the sorites-style case: One person loses a limb vs. N people lose a marginally less bad limb. Does the view have the resources to handle this smoothly, or does it bite the bullet that the answer is identical at N=1 and N=1,000,000,000?

  A defender of contractualism has resources to avoid the bullet, but they have to walk a tightrope. Here is how they would handle your stress test:

  **1. Comparable Burdens**
  Contractualism is most comfortable when harms are comparable. If Person A loses an arm, and Person B loses an arm, the harms are identical. In this case, Scanlon has explicitly moved toward allowing numbers to count. If you have to choose between saving one person from losing an arm or five people from losing an arm, a modern contractualist says you save the five. The "individualist restriction" is not violated because the justification to the one person is: "I could not have justified to the five a principle that required them to sacrifice their arms so you could keep yours, given that your claim is no stronger than theirs."

  **2. The Marginally Lesser Limb**
  In your case, the N people suffer a loss *just barely* less severe than the single person. A defender would argue these are "sufficiently comparable." The difference in severity is not enough to make the single person's claim lexically superior (infinitely stronger).
  *   **At N=1:** You save the person with the worse injury. The strength of their complaint is higher.
  *   **At N=1,000,000,000:** You save the billion. Even though each individual complaint is slightly weaker, the *collective* reasonable rejection of a principle that sacrifices all of them becomes stronger than the single person's rejection.

  **3. Avoiding the Sorites Trap**
  The view avoids the sorites paradox (where a tiny change never flips the outcome) by relying on the concept of **Generic Reasons**. We aren't counting raw utility units; we are assessing the strength of reasons people have to reject a principle.
  *   There is a threshold of **significance**. If the harm is trivial (a ruined afternoon), no number aggregates to outweigh a death.
  *   If the harm is significant (a lost limb), aggregation is permitted.
  *   In your sliding scale, as long as the "marginally less bad limb" remains a significant harm (e.g., losing a pinky finger vs. losing a whole arm), the view can say that enough pinky fingers outweigh one arm.
  *   If the scale slides down to trivialities (losing a fingernail clipping), the view bites the bullet: a billion fingernail clippings do not outweigh one arm. A defender says this is a feature, not a bug. It protects individuals from being sacrificed for the sake of trivial collective gain.

  **4. The Transition Point**
  Does the view explain *exactly* where the switch happens? Not with mathematical precision. Contractualism is not a calculus; it is a test of justification. A defender would admit there is a gray area where it is unclear whether the harms are comparable enough to allow aggregation. In that gray area, the theory might say there is no single uniquely right answer, or that other tie-breaking virtues (like efficiency) can step in once the threshold of serious harm is met.

  ### Summary of the Actual View vs. The Article

  The article you read presents contractualism as:
  *   **Mechanism:** Veil of ignorance bargaining. (False: It's reasonable rejection).
  *   **Aggregation:** Absolutely forbidden. (False: Forbidden for trivial vs. vital, allowed for comparable/significant).
  *   **Result:** One death always outweighs any number of lesser harms. (False: Only if the lesser harms are trivial).

  The actual view is:
  *   **Mechanism:** Justification to each person based on their actual reasons.
  *   **Aggregation:** Restricted. You cannot aggregate trivial complaints to override a vital one. You *can* aggregate significant complaints to override a comparable vital one if the numbers are sufficient.
  *   **Result:** In your trolley case (death vs. many deaths), contractualism agrees with utilitarianism: save the many. In the death vs. headaches case, contractualism disagrees with utilitarianism: save the one.

  The article needs the misreading of the aggregation rule to generate the "refutation." If you accept that aggregation is permissible for comparable serious harms, the "save the million" intuition is preserved, and the theory survives the trolley case. The theory only looks absurd if you assume it treats a billion broken legs exactly the same as a billion paper cuts. A Scanlonian defender denies that equivalence.
