answer: |-
  The tablet on Justice Elena Vance's bench glowed a soft, reassuring green. *Public Safety Score: 98.4%. Recidivism Risk: Negligible.*

  According to the Algorithm, Leo Kress was safe. He was a repaired machine, calibrated and ready to rejoin the circuit. According to the Rehabilitation Statute of 2041, Elena had to let him go.

  She looked up from the screen. Kress sat at the defense table, hands folded, eyes calm. He looked nothing like the man who had shattered a skull with a tire iron three years ago. The neural conditioning had worked. The therapy had worked. The math said he was cured.

  In the gallery, Martha Garris clutched a photograph of her son. She wasn't looking at Kress. She was looking at Elena. Her eyes were dry, burned out by years of waiting for a pain that the new law refused to administer.

  "Your Honor," said Marcus Thorne, defense counsel. He stood smoothly, adjusting his cuffs. He was a true believer in the New Jurisprudence. "The state's own data confirms Mr. Kress poses no threat. Continued confinement serves no protective function. It is merely inflicting pain for pain's sake. Under Section 4, that constitutes torture."

  "It constitutes justice," snapped Sarah Jenkins, representing the Garris family. She didn't stand; she leaned over the bar, voice trembling. "He killed David Garris. He didn't slip. He didn't glitch. He chose to swing that iron. He owes a debt."

  "Debts imply a creditor," Thorne countered, cool as liquid nitrogen. "My client was the product of a chaotic neurochemical cascade triggered by childhood trauma and socioeconomic pressure. He didn't 'choose' any more than a storm chooses to break a window. To punish him for the weather is barbarism."

  Elena gripped her gavel. The wood felt warm, alive. She hated Thorne's voice. She hated the smooth, causal chain he wove, wrapping human beings in physics until morality vanished. She was a compatibilist in a world that had voted for determinism. She believed that even if causes existed, reasons mattered. That a human mind could weigh options and be held accountable for the weight.

  But the statute didn't care about her metaphysics. The statute cared about safety.

  "Ms. Jenkins," Elena said, her voice steady. "The court acknowledges the family's grief. But the mandate is clear. We do not punish for desert. We punish for risk."

  "Then the law is a lie," Jenkins hissed. "You know it. Everyone in this room knows it. We want him to *suffer* because he *did* something. Not because he might do it again."

  Elena looked at Kress. He met her gaze. There was no remorse there, exactly—remorse implied guilt—but there was an understanding. He knew he was innocent of blame, in the eyes of the state. He was a vector of harm that had been neutralized.

  "Mr. Thorne argues that blame is a phantom," Elena said, mostly to herself, though the microphone caught it.

  "Blame is a superstition, Your Honor," Thorne said. "Useful for social cohesion in the pre-neural era. Now we know better."

  Elena felt a heat rise in her chest. It was familiar. It was the urge to slam the gavel, to scream *Yes, you chose!* It was the urge to look at Martha Garris and say, *He owes you.*

  But as the heat spread, a cold question followed it, sharp as a scalpel. *Is this justice? Or is this just anger?*

  Thorne was watching her. He knew that look. He'd seen it in other judges, the ones who struggled to swallow the new philosophy. He leaned in.

  "Your Honor," Thorne said softly. "Ask yourself. If Mr. Kress were released and never offended again, but you locked him up for ten years anyway... who would that help? Would it bring David Garris back? Or would it just satisfy a biological urge for vengeance in the observers?"

  "It validates the moral order," Jenkins shot back. "It says what he did was *wrong*, not just *unsafe*."

  "Wrong according to who?" Thorne spread his hands. "Morality is just evolved instinct. We don't lock up people with cancer because their tumor is 'wrong.' We treat it. Mr. Kress was sick. Now he is well."

  Elena closed her eyes for a second. The courtroom silence was heavy, pressing against her eardrums.

  She thought about the last time she'd felt this specific heat. A robbery case. A man who had laughed while he held a gun to a clerk. The Algorithm had released him too. Elena had gone home and poured a glass of wine she didn't want, staring at the wall, feeling a vicious satisfaction when she heard the man had been picked up for a parole violation.

  *Was that me?* she wondered. *Was that the guardian of the law, or just a primate wanting to see a rival bleed?*

  She looked at her hands. They were steady. She had spent thirty years studying law, philosophy, ethics. She believed in reasons-responsiveness. She believed that humans were different from storms because they could respond to reasons. Kress had ignored the reason of *do not kill*. Therefore, he deserved the consequence.

  But was that belief a truth she had discovered? Or was it a costume she had dressed her rage in to make it palatable?

  If she sentenced Kress to ten years, she would be violating her oath. She would be inflicting harm without a consequentialist justification. She would be making herself a torturer for the sake of a feeling.

  If she released him, she was telling Martha Garris that her son's death was a weather event. A tragedy, not a crime.

  "Your Honor?" Thorne prompted.

  Elena opened her eyes. She looked at Martha. The woman's face was a map of exhaustion. She didn't want safety. She wanted balance. She wanted the universe to acknowledge that a life was taken and a life was owed.

  But the universe, as Thorne said, didn't keep books. Only people did.

  "The court finds that the Public Safety Score is conclusive," Elena said. Her voice sounded hollow to her own ears. "Under the Rehabilitation Statute, confinement is no longer justified. Mr. Kress is to be released into the community supervision program immediately."

  Martha Garris made a sound like a sob caught in a closed throat. She didn't cry. She just folded the photograph of her son and put it in her bag, as if packing away evidence of a reality no one else accepted.

  "However," Elena added. The word hung in the air. Thorne frowned.

  "The statute forbids retribution," Elena continued, looking directly at Kress. "I cannot sentence you to suffer for what you did. The law does not recognize 'desert.' But I am a human being, and I preside over a court of humans."

  Kress tilted his head. "Is there a point, Your Honor?"

  "Yes," Elena said. "Because while the law says you are merely a vector of risk, I know that you know what you did. The Algorithm says you are safe. It does not say you are innocent. It does not say the debt is paid. It only says the state will no longer collect."

  She picked up the gavel. It felt heavier than before.

  "We are releasing you because we are civilized," Elena said, her voice dropping, losing its judicial boom. "Or perhaps because we are afraid to admit what we want. I look at you, Mr. Kress, and I feel a desire for your pain. I tell myself it is because justice demands it. I tell myself it is because you chose. But tonight, when I go home, I will have to ask myself if I am a defender of moral truth, or just a woman who wants to see you hurt because Mrs. Garris is hurting."

  Thorne shifted uncomfortably. "Your Honor, that is highly irregular."

  "It is the only regular thing left," Elena said. She looked at Martha. "I cannot give you what you want. The law says that pain is useless. I am bound by the law. But I will not tell you that you are wrong to want it. And I will not tell myself that I am wrong for feeling it."

  She struck the gavel. The sound was flat, final.

  "Court is adjourned."

  Elena didn't watch them leave. She stayed seated, watching the green light on her tablet fade to sleep mode. The screen went black, reflecting her own face back at her.

  She looked tired. She looked angry.

  She touched the screen, wondering if the reflection staring back was a judge upholding a rational, humane system that had outgrown barbarism, or a coward hiding behind statistics because she was afraid to admit that some things break and deserve to stay broken.

  The screen remained dark. It offered no score for that.
