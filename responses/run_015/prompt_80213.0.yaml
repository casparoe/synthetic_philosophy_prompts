  9.  **Word Count Check:** Keep sentences punchy. Avoid long exposition dumps about the history of the law. Show it through the tablet interface and the lawyers' objections.

  10. **Final Polish:** Check the philosophical nuance. Ensure Vance's compatibilism feels lived-in, not textbook. She believes in *reasons-responsiveness*. Thorne believes in *causal closure*.

