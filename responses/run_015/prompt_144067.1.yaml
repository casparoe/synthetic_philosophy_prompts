answer: |-
  This is a sophisticated and well-articulated package, essentially a **Garber-style solution to the Old Evidence problem** wrapped in a **Subjectivist Bayesian framework** with an **Objectivist aspiration** regarding support.

  You are right to feel tension. Your intuitions are tracking real fault lines in the literature. The package is not consistent as stated. Below is the consistency check, ranked by severity, followed by an analysis of the "Impossible Trinity" you are facing.

  ### 1. Severity Ranking of Tensions

  **Severity 1: The Intersubjectivity/Subjectivism Contradiction (Commitments 2, 5, 7)**
  *   **The Clash:** You define confirmation as *your* credence-raising (2) and allow *your* priors to be unconstrained (7). But you demand the strength of support be intersubjective (5).
  *   **Why it breaks:** If confirmation is $P_{new}(H) - P_{old}(H)$, and $P_{old}$ is rationally unconstrained, then the degree of confirmation is rationally unconstrained. Einstein might have had priors where GR was already 99% likely; you might have priors where GR is 1%. Even if you both learn the entailment ($H \rightarrow E$), the *shift* in credence will differ.
  *   **What must give:** You cannot have all three.
      *   *Drop (5):* Accept that confirmation is agent-relative. (Cost: Loss of normative force; science becomes "what confirms for me" vs "what confirms for you".)
      *   *Drop (7):* Constrain priors (e.g., via Principle of Indifference or Objective Bayesianism). (Cost: Massive philosophical baggage; violates your subjectivist instinct.)
      *   *Drop (2):* Allow that "degree of support" is distinct from "actual credence raising." (Cost: Violates your desire for a unified metaphysics of confirmation.)
  *   **Verdict:** This is the fatal flaw. As written, (5) is incompatible with the conjunction of (2) and (7).

  **Severity 2: The Logical Omniscience / Dutch Book Conflict (Commitments 1, 4)**
  *   **The Clash:** Standard Dutch Book arguments for Conditionalization (1) presuppose logical omniscience (the agent assigns 1 to all logical truths). Your solution to Old Evidence (4) explicitly denies logical omniscience (you assign $<1$ to $H \rightarrow E$).
  *   **Why it breaks:** If you are not logically omniscient, standard Dutch Book arguments fail. A bookie can bet you on logical truths you don't know yet. Furthermore, standard Conditionalization is undefined if the new information (the entailment) was not in the original algebra of propositions.
  *   **What must give:**
      *   *Modify (1):* You must switch from "Standard Conditionalization" to "Generalized Conditionalization" (e.g., Jeffrey Conditionalization) or a specific logic of logical uncertainty (e.g., Gaifman, or computational Bayesianism).
      *   *Cost:* You lose the clean, standard Dutch Book justification. You have to argue for updating rules in non-omniscient frameworks, which is technically messy and less consensus-driven.
  *   **Verdict:** Solvable, but requires technical revision to (1). You cannot keep the *standard* Dutch Book argument *and* non-omniscience.

  **Severity 3: The Methodological Reflexivity (Commitments 3, 8)**
  *   **The Clash:** (3) treats a pre-theoretic verdict ("Mercury really did confirm GR") as a hard benchmark the theory *must* hit. (8) says pre-theoretic verdicts are not evidence and shouldn't drive the formalism.
  *   **Why it breaks:** This is performative contradiction. You are using a pre-theoretic verdict as a constraint on your theory while claiming pre-theoretic verdicts shouldn't constrain theory.
  *   **What must give:**
      *   *Soften (8):* Admit that pre-theoretic verdicts provide "reflective equilibrium" constraints, even if they aren't "evidence" in the formal sense.
      *   *Soften (3):* Rephrase (3) not as "It *is* true that Mercury confirmed GR," but "It is a *phenomenon of scientific practice* that we treat Mercury as confirming GR, and the formalism should model this."
  *   **Verdict:** Easy fix rhetorically, but important for philosophical honesty.

  **Severity 4: Uniformity of Updating (Commitments 4, 6)**
  *   **The Clash:** (6) demands no special-purpose machinery. (4) solves OE by saying we update on entailments ($H \rightarrow E$) rather than data ($E$).
  *   **Why it looks bad:** Critics argue this *is* special machinery. New evidence updates on $E$; Old evidence updates on $H \rightarrow E$. Is the update rule the same?
  *   **Why it dissolves:** You can argue that *all* updating is updating on constraints. Learning $E$ is learning the constraint $P(E)=1$. Learning $H \rightarrow E$ is learning the constraint $P(H \rightarrow E)=1$. If you frame it as "Conditionalization on whatever proposition is learned," (6) is preserved.
  *   **Verdict:** Defensible, provided you are careful about how you describe the "proposition learned."

  ---

  ### 2. The "Impossible Trinity"

  You asked if the package you actually want is available. You want:
  1.  **Old Evidence Confirms** (via standard Bayesian mechanisms).
  2.  **No Ad Hoc Machinery** (Uniform updating).
  3.  **Intersubjective Degrees of Support.**

  **The Verdict:** You cannot have these three *given your other commitments*.

  The specific blocker is **Subjective Priors (7)** combined with **Confirmation = Credence Raising (2)**.
  If confirmation is defined as the change in *subjective* credence, and priors are *subjective*, confirmation *must* be subjective.
  To get Intersubjective Support (5), you need the support relation to "screen off" the specific prior probabilities. The only standard Bayesian measure that does this is the **Likelihood Ratio** ($\frac{P(E|H)}{P(E|\neg H)}$).

  However, the Likelihood Ratio is a measure of *potential* support, not *actual* credence raising (which depends on the prior).
  *   If you stick with (2), you must drop (5).
  *   If you stick with (5), you must effectively drop (2) in favor of a Likelihoodist or Objective Bayesian account of *degree* of confirmation.

  ### 3. Recommended Revisions

  To clean up the package for your reading group with minimal philosophical cost, I recommend the following three moves:

  **Revision A: Distinguish "Confirmation" from "Degree of Support" (Fixes Severity 1)**
  *   **Keep (2) for Binary Confirmation:** $E$ confirms $H$ iff $P(H|E) > P(H)$. This remains agent-relative.
  *   **Modify (5) & (7):** Admit that *binary* confirmation is subjective (dependent on priors), but argue that the **Likelihood Ratio** provides the *intersubjective strength of the evidence*.
  *   **Why:** This allows you to keep Subjective Priors (7) and the Credence-Raising definition (2), but saves Intersubjectivity (5) by shifting it to the Likelihoods. Einstein and you have different priors, so GR confirms *more* for one of you, but the *likelihood ratio* of the Mercury data is the same for both.
  *   **Cost:** You have to concede that "how strongly it confirms" is not identical to "how much my credence went up."

  **Revision B: Generalize Conditionalization (Fixes Severity 2)**
  *   **Modify (1):** Change "Conditionalization is the only legitimate way" to "Generalized Conditionalization (updating on constraints) is the only legitimate way."
  *   **Why:** This accommodates the denial of logical omniscience (4). You aren't updating on $E$ (which was prob 1); you are expanding the algebra to include the entailment relation and updating on that constraint.
  *   **Cost:** You must acknowledge that the standard Dutch Book argument needs refinement for non-omniscient agents (cite *Garber 1983* or *Eells 1985*).

  **Revision C: Refine the Methodological Claim (Fixes Severity 3)**
  *   **Modify (8):** Change "Verdicts are not evidence" to "Verdicts are not *proof*, but successful formalisms must recover central cases of scientific reasoning."
  *   **Why:** This aligns (8) with (3). You aren't feeding verdicts in as axioms; you are demanding the theory has sufficient empirical adequacy regarding scientific history.
  *   **Cost:** Minimal. It's just more precise.

  ### 4. Summary for the Reading Group

  If I were presenting this, I would frame the position as follows:

  > "I defend a **Garber-style solution** to the Old Evidence problem. I maintain that confirmation is credence-raising (2), but I solve the zero-shift problem by denying logical omniscience (4): we update on the discovery of the entailment relation, not the evidence itself.
  >
  > However, I acknowledge a tension between **Subjective Priors** and **Intersubjective Support**. My resolution is to locate intersubjectivity in the **Likelihoods**, not the Posterior Shifts. The *fact* of confirmation is subjective (dependent on priors), but the *weight* of the evidence (the likelihood ratio) is intersubjective.
  >
  > Finally, I argue this requires no special-purpose machinery (6), provided we view Conditionalization as updating on constraints within an expanding algebra of propositions, justified by a generalized Dutch Strategy argument."

  **Final Answer to "Is the package available?":**
  No, not exactly as written. You are asking for **Subjective Priors + Confirmation as Credence Shift + Intersubjective Degree of Support**. That triangle is impossible.
  *   **Best path:** Keep Subjective Priors. Keep Confirmation = Credence Shift. **Drop Intersubjective Degree of Support** (replace with Intersubjective Likelihoods).
  *   **Alternative path:** Keep Intersubjective Support. Keep Confirmation = Credence Shift. **Drop Subjective Priors** (move toward Objective Bayesianism).

  Given your commitment to (7), I strongly recommend the first path. It is the most standard "Subjectivist Bayesian" position and will be defensible in a reading group.
