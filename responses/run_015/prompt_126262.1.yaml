answer: |-
  This is a sharp observation. You have identified a specific rhetorical maneuver that is prevalent in technical philosophy and AI safety discourse, but which lacks a single, canonical label like "The Ad Hominem Fallacy."

  Here is a breakdown of the concept, its relationship to Neurath, and how it differs from standard reification, followed by my confidence calibration.

  ### 1. Is there an established concept for this?

  There is no single noun phrase that captures the *entire* cyclical move (neutral map $\leftrightarrow$ ontological truth) in standard philosophical lexicons. However, it is a composite of three well-documented phenomena:

  *   **Visual Reification (or Diagrammatic Reification):** This covers the act of treating abstract relationships (values, consciousness) as concrete, discrete objects (boxes) with fixed relations (arrows).
  *   **Strategic Equivocation on Model Status:** This describes the rhetorical oscillation. When criticized for the *content* (e.g., "values aren't discrete"), the proponent claims the diagram is merely **heuristic** (a tool). When criticized for the *implications* (e.g., "this doesn't solve alignment"), they claim the diagram is **structural** (it mirrors reality).
  *   **The Map-Territory Confusion (Korzybski):** This is the underlying cognitive error. The user is describing a *weaponized* version of this, where the speaker switches between "this is a map" and "this is the territory" depending on which stance protects the argument from critique.

  In Science and Technology Studies (STS), **Bruno Latour** comes closest to naming this with his concept of **"Inscriptions"** or **"Immutable Mobiles."** Latour argues that scientific diagrams gain authority precisely because they look like neutral, objective "facts" that can be moved across contexts, yet they carry the laboratory's specific theoretical commitments inside their visual grammar. When you describe people retreating to "it's just a visualization," they are trying to strip the *inscription* of its theoretical weight; when they use it to argue ontology, they are leveraging its authority as an *immutable mobile*.

  If you needed to coin a term for your specific observation, **"Ontological Oscillation"** or **"Visual Status Equivocation"** would be accurate.

  ### 2. How does this distinguish from Neurath's Project?

  Your hunch is partially right: you are correctly identifying Neurath as the figurehead for visual empiricism, but the move you are critiquing is actually a **corruption** of Neurath's intent, not an application of it.

  *   **Neurath's Intent (ISOTYPE):** Neurath did not believe pictures were "theory-free." He believed they were **conventional**. His goal with ISOTYPE was to make the conventions *explicit* and *standardized* so that viewers understood they were looking at a constructed representation of social facts. He was a **coherentist**; he knew we cannot step outside language/images to check them against raw reality. He wanted to minimize *metaphysical* baggage (pseudo-problems), not theoretical baggage.
  *   **The AI/Philosophy Move:** The diagrams you describe claim to be **transparent**. They hide their conventions (e.g., why is causality top-to-bottom? Why are values boxes?). They pretend the visual grammar is natural rather than chosen.
  *   **The Distinction:** Neurath wanted to **expose** the construction of the picture to aid democratic understanding. The modern move you identified wants to **conceal** the construction to grant the diagram scientific authority. Neurath would likely critique these flowcharts as "metaphysical pseudovisuals" because they present theoretical choices (discretization of values) as empirical givens.

  ### 3. How does this distinguish from Plain Reification?

  **Plain Reification** is static: "I treat the concept 'Justice' as a physical object."

  **Your Observed Pattern** is dynamic/rhetorical:
  1.  **Phase A (Defense):** "Don't criticize the boxes; they are just illustrative metaphors." (Denial of Reification)
  2.  **Phase B (Offense):** "Therefore, since the boxes are separate, we must solve Value A independently from Value B." (Assertion of Reification)

  This is more insidious than plain reification because it immunizes the diagram from critique. If you attack the ontology, they retreat to rhetoric ("it's just a map"). If you attack the utility, they retreat to ontology ("but the system *is* structured this way"). Plain reification doesn't usually have this escape hatch.

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that the rhetorical pattern you identified is real, prevalent in AI ethics/philosophy of mind, and constitutes a specific form of equivocation distinct from simple bias. I am also confident that this contradicts the spirit of Neurath's ISOTYPE, which emphasized the *conventional* nature of signs.

  **Point of Least Certainty: Neurath's Epistemological Nuance (15% Uncertainty)**
  My least certain point is the precise degree to which Neurath believed ISOTYPE could achieve "neutrality."
  *   *The Nuance:* While I am sure Neurath knew pictures weren't magic mirrors, there is scholarly debate about whether he thought ISOTYPE could *minimize* theory enough to be effectively neutral for the working class, or if he acknowledged it was always political.
  *   *The Risk:* I might be projecting a modern "critical theory" reading onto Neurath. It is possible Neurath was more optimistic about the "theory-free" potential of pictures than I am attributing to him. If he *did* claim they were effectively theory-neutral, then your observation is that modern AI theorists are successfully doing what Neurath attempted but failed to do (sneak theory in). However, most scholarship suggests Neurath was aware that *selection* of facts is political.
  *   *Alternative Conflation:* You mentioned worrying about conflating Neurath with someone else. The only other likely candidate is **Carnap** (Logical Syntax) or **Wittgenstein** (Picture Theory of Language). Wittgenstein's *Tractatus* (picture theory) is more ontological (language pictures the logical form of reality), which is actually closer to the *AI theorists' error* than Neurath is. If you feel a mismatch, it might be that you are associating Neurath's *visuals* with Wittgenstein's *logical picture theory*. Neurath is the correct figure for the *sociological/visual* aspect, but Wittgenstein is the figure for the "language mirrors reality" aspect that these AI folks are misusing.

  **Summary Recommendation:**
  You are describing **Strategic Ontological Equivocation in Visual Models**. It borrows the aesthetic of Neurathian physicalism (neutral observation) to hide commitments that would be controversial if stated propositionally. It is distinct from reification because of its rhetorical oscillation between "map" and "territory."
