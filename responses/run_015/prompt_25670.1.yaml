answer: |-
  **Project Title:** The Normative Boundaries of Geometric Rationality: A Taxonomy of Decision Contexts

  **Project Summary**
  This project seeks to resolve a longstanding stalemate in decision theory regarding the normative status of the Kelly criterion and "geometric rationality." Orthodox Expected Utility (EU) theory treats betting strategies as matters of subjective preference: if an agent maximizes expected log-wealth, they simply have logarithmic utility. Proponents of geometric rationality and ergodicity economics argue instead that in multiplicative environments, maximizing time-average growth is a structural requirement of rationality, independent of utility. This project will develop a formal taxonomy of decision contexts to determine when geometric reasoning is rationally mandatory, merely permissible, or misleading. By distinguishing between structural dynamics and subjective preferences, this work aims to clarify the foundations of rational choice under uncertainty.

  **Intellectual Merit and Background**
  The Kelly criterion, originally derived for gambling scenarios, prescribes betting a fraction of one's bankroll that maximizes the expected logarithm of wealth. In the long run, this strategy almost surely dominates other fixed-fraction strategies. However, the philosophical interpretation of *why* one should follow Kelly remains contested.

  The orthodox view, cemented by Paul Samuelson, holds that Kelly betting is not rationally mandatory. It is merely the optimal strategy for an agent with logarithmic utility. For an agent with different risk preferences, maximizing expected utility may dictate a different betting fraction, even if it risks ruin in the long run. On this view, the "advantage" of Kelly is an empirical claim about the environment, not a normative constraint on the agent.

  Conversely, a growing movement in ergodicity economics and geometric rationality argues that this orthodox view conflates ensemble averages (expectations across parallel worlds) with time averages (expectations over a single life trajectory). In non-ergodic systems—where wealth evolves multiplicatively and ruin is absorbing—the ensemble expectation diverges from the time-average growth rate. Proponents argue that rational agents should maximize time-average growth rates because that is what actually happens to them over time. To ignore this is to make a category error, treating a dynamic constraint as a preference.

  Currently, this debate is stuck. The Kelly side points to long-run dominance theorems; the EU side points to the axiomatic freedom of utility functions. Both are technically correct within their own frames, but neither has systematically identified the boundary conditions where geometric reasoning acquires normative force. Does the time-average perspective bind a rational agent in a one-shot decision? Does it apply if risks are diversifiable? Is it a universal requirement for all multiplicative processes, or only specific classes of stochastic dynamics?

  **Research Question and Objectives**
  The central research question is: *Under what structural conditions does the time-average growth rate impose a normative constraint on rational choice that overrides subjective utility functions?*

  My hypothesis is that the normative status of geometric rationality is not uniform. It depends on specific features of the decision context that have not been sufficiently distinguished in the literature. I propose to construct a taxonomy of decision contexts along three primary dimensions:

  1.  **Temporal Structure:** Is the decision one-shot, finitely repeated, or indefinitely repeated? Geometric reasoning is often justified by long-run convergence, but its applicability to finite or single horizons is unclear.
  2.  **Risk Structure:** Are the risks idiosyncratic and diversifiable, or systemic and non-diversifiable? If an agent can pool risks across independent sources, the multiplicative dynamics may effectively become additive, restoring the validity of ensemble averages.
  3.  **Ergodic Properties:** Is the underlying process genuinely non-ergodic with absorbing states (ruin), or is it ergodic with reflective boundaries?

  The objective is not merely to defend Kelly betting, but to map the landscape of rational choice. In some cells of this taxonomy, geometric rationality may be rationally mandatory (e.g., repeated, non-diversifiable, non-ergodic). In others, it may be permissible but not required. In still others, it may be actively misleading (e.g., one-shot decisions where long-run dominance is irrelevant).

  **Methodology**
  This is a conceptual and formal project, not an empirical study. The work will proceed through philosophical analysis supported by formal modeling.

  First, I will engage in a conceptual reconstruction of the arguments on both sides. This involves clarifying the definition of "rationality" at stake. Is rationality defined by coherence of preferences (EU) or by success in navigating dynamic environments (Geometric)? I will analyze recent contributions from ergodicity economics to isolate the precise claims being made about time averages.

  Second, I will construct formal models to test the boundaries of these claims. Using standard stochastic processes, I will simulate decision contexts varying along the three dimensions identified above. For example, I will model a scenario where risks are partially diversifiable to see at what threshold the time-average growth rate ceases to be the dominant normative consideration. The goal is not to generate new statistical data, but to use formal models as thought experiments to test the coherence of the normative claims.

  Third, I will synthesize these findings into a unified framework. This will involve articulating a set of necessary and sufficient conditions for geometric rationality to claim normative authority. The output will be a paper suitable for publication in a top journal in philosophy or economic methodology, arguing for a pluralistic view of rationality where the appropriate decision rule depends on the structural features of the environment.

  **Timeline**
  The project is designed for a three-month summer grant period.

  *   **Month 1: Conceptual Mapping and Literature Review.** I will finalize the definitions of the three taxonomy dimensions. This involves close reading of the recent ergodicity economics literature (e.g., Peters, Gell-Mann) and the classic decision theory canon (Samuelson, Breiman). The deliverable for this month is a detailed outline of the taxonomy and a draft of the conceptual framework section.
  *   **Month 2: Formal Modeling and Verification.** I will work through the formal proofs and simulations required to validate the taxonomy. This involves checking boundary cases—for instance, determining if "near-ergodic" processes behave differently from strictly non-ergodic ones. The goal is to ensure the philosophical claims are mathematically sound. The deliverable is a set of formal appendices and model descriptions.
  *   **Month 3: Synthesis and Drafting.** I will integrate the conceptual and formal work into a complete manuscript. This includes refining the argument, addressing potential counterarguments (particularly from the orthodox EU camp), and preparing the text for submission. The deliverable is a complete draft of the article.

  **Success and Failure Criteria**
  It is vital to be honest about what constitutes success in a conceptual project of this nature.

  **Success:** The project succeeds if it produces a clear, defensible taxonomy that explains *why* the debate has been stuck. Even if the final conclusion is that geometric rationality applies to a narrower set of cases than its proponents claim, this is a successful outcome. It clarifies the normative landscape. Specifically, if I can demonstrate that geometric rationality is mandatory only when specific ergodicity conditions are met, and that EU theory remains valid otherwise, I have resolved the tension by delineating the domains of each.

  **Failure:** The project would fail if the proposed taxonomy proves incoherent or if the dimensions collapse into one another. For example, if it turns out that "repeatedness" and "ergodicity" are not distinct variables but the same mathematical property described differently, the taxonomy would need significant revision, potentially beyond the scope of a summer grant.

  **The "Log Utility" Objection:** A specific risk is that the analysis reveals geometric rationality to be nothing more than Expected Utility theory with a logarithmic utility function in disguise. If the formal work shows that maximizing time-average growth is mathematically equivalent to maximizing expected utility with $U(w) = \ln(w)$ in all relevant cases, does the project fail?

  I argue this would not be a failure, but a significant clarifying result. Much of the heat in the current debate stems from the suspicion that geometric rationality is trying to sneak a specific utility function in through the back door of "dynamics." If the project demonstrates that geometric rationality *reduces* to EU with log utility, it vindicates the orthodox view but explains the appeal of the Kelly side: they are tracking a specific, structurally important utility function that arises naturally in multiplicative environments. Conversely, if I can show that geometric rationality prescribes actions that *diverge* from EU even with log utility in certain non-standard contexts (e.g., finite horizons with specific constraints), that establishes it as a genuinely distinct normative framework.

  Either way, determining the relationship between the time-average growth rate and the utility function is the core philosophical work that needs to be done. The grant will support the rigorous analysis required to settle this, moving the conversation past talking past one another and toward a precise understanding of when dynamics constrain preferences.

  **Broader Impact**
  While technical, this work has implications beyond decision theory. It touches on how we understand rationality in economics, finance, and even ethics. If rationality is partially determined by the ergodic properties of the environment, then normative theory cannot be done in a vacuum; it must account for the physical and temporal structure of the world agents inhabit. This project offers a pathway to integrate these structural realities into formal philosophy without abandoning the rigor of axiomatic decision theory.
