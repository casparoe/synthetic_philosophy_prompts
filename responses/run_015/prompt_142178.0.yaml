answer: |-
  ### Robustness Scores and Tier List

  **Tier 1: High Empirical Stability (Scores 70–85)**
  *These traits survive the critique best because ordinary life forces their repeated exercise, creating habit-like stability even if "character" is thin.*

  1.  **Punctuality: 85** — Driven by extreme opportunity density, though this score reflects a social script enforced by external sanction rather than an internalized moral disposition.
  2.  **Truthfulness in speech: 75** — Driven by high opportunity density, as the sheer frequency of communicative acts consolidates the behavior into a reliable pattern.
  3.  **Temperance with everyday pleasures: 70** — Driven by high opportunity density, since consumption occurs daily and provides constant reinforcement of the regulatory disposition.

  **Tier 2: Moderate Empirical Stability (Scores 55–65)**
  *These traits are exercised often enough to show some consistency, but situational noise or automaticity interferes with their status as robust virtues.*

  4.  **Playful ease in conversation: 65** — Driven by moderate opportunity density in social settings where the stakes are too low for situational pressure to override the disposition.
  5.  **Gratitude: 60** — Driven by high opportunity density, but this score is inflated because the behavior often functions as an unthinking social script rather than a felt disposition.
  6.  **Fairness in dividing resources with strangers: 55** — Driven by moderate cue-concordance, as the cue (division task) is clear, but anonymity and lack of future interaction frequently dissolve the trait.

  **Tier 3: Low Empirical Stability (Scores 40–50)**
  *These traits are vulnerable because the occasions to exercise them are infrequent or the situational cues are easily obscured by competing pressures.*

  7.  **Humility about one's own accomplishments: 50** — Driven by low cue-concordance, because the situational cue (praise) often triggers self-protection rather than the accurate self-assessment required by the trait.
  8.  **Loyalty to a friend when the association is costly: 45** — Driven by low opportunity density, since genuinely costly tests of loyalty are rare events in a typical adult life.
  9.  **Fidelity to costly promises: 40** — Driven by low opportunity density, as the specific conjunction of a prior promise and a present high cost to keep it occurs infrequently.

  **Tier 4: Very Low Empirical Stability (Scores 20–35)**
  *These traits are the primary targets of the situationist literature; the empirical record suggests situational variables overwhelmingly determine outcomes here.*

  10. **Physical courage under threat of harm: 30** — Driven by extremely low opportunity density, making it statistically impossible to establish cross-situational stability for the average person.
  11. **Compassionate helping of a stranger in visible distress: 25** — Driven by low cue-concordance, as the empirical record shows the distress cue is frequently overridden by irrelevant situational factors like hurry or mood.

  ***

  ### Methodological Honesty Check

  **Is this ranking measuring robustness or experimental coverage?**
  This ranking is unavoidably confounded by experimental coverage; the traits in Tier 4 (Helping, Courage) have the lowest scores largely because they are the specific targets of the most rigorous situationist experiments (e.g., Darley & Batson, Milgram), whereas traits in Tier 1 (Punctuality, Truthfulness) benefit from a lack of targeted experimental manipulation designed to break them.

  **How to tell the hypotheses apart:**
  To distinguish genuine fragility from mere lack of data, we would need to subject the Tier 1 traits to the same methodological scrutiny as the Tier 4 traits—specifically, using randomized controlled trials to introduce irrelevant situational variables (e.g., finding a dime, being late for a lecture) to see if they disrupt truth-telling or punctuality as dramatically as they disrupt helping behavior. Until Ecological Momentary Assessment (EMA) studies track all eleven traits simultaneously across the same population, the ranking remains a map of where psychologists have looked rather than a definitive map of human character.
