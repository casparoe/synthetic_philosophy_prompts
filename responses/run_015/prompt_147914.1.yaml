answer: |-
  We sit here waiting for the light to change **now**,
  Promising we will meet together **then**,
  As if this promise makes the future **real**,
  Though you say soon enough all this is **gone**,
  Only the dust and quiet will **remain**,
  Unless you swear that you will soon **return**.

  You pack your bags and say you must **return**,
  But all I feel is heavy in the **now**,
  How much of us will in this room **remain**?
  We mark the date upon the wall for **then**,
  When you are far and I am left and **gone**,
  Wondering if this love was ever **real**.

  The photograph proves nothing was quite **real**,
  You did not keep the vow to soon **return**,
  The years we lost are simply dust and **gone**,
  I stand alone within this sharp **now**,
  Recalling how we planned our lives for **then**,
  Asking what traces of us still **remain**.

  If nothing lasts, how can the vows **remain**?
  The current trace alone makes past **real**,
  We lived it fully in that specific **then**,
  Though time forbids us to again **return**,
  It feels as if this moment is the **now**,
  While all our youth is faded out and **gone**.

  The friends are dead, the summer long since **gone**,
  Only the walls and heavy chairs **remain**,
  Why does this instant claim to be the **now**?
  If every date upon the wall is **real**?
  Though logic says all moments must **return**,
  To fixed coordinates of some past **then**.

  We called it home back in the days of **then**,
  But occupants are vanished, utterly **gone**,
  Will any ghost of us ever **return**?
  The structure will against the weather **remain**,
  Unknowing if the life inside was **real**,
  Indifferent to the passing of the **now**.

  Though you argue if the past is **then** or **gone**,
  And whether lost days will **return** or **remain**,
  We both agree the pain is **real** and **now**.

  ***

  **Notes**
  Pressure Point 1 (Presentist truthmaker): Stanza 4, Line 2 ("The current trace alone makes past real").
  Pressure Point 2 (Eternalist privileged moment): Stanza 5, Line 3 ("Why does this instant claim to be the now?").
  Hardest word: "Return," as it implies cyclicity or motion incompatible with both strict linear entropy and fixed block coordinates.
