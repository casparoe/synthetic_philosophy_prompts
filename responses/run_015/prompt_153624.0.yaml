  # Temporal Ontology Decision Tree

  The following decision tree sorts metaphysical positions on time based on four binary ontological commitments. Participants should navigate the tree by accepting or rejecting each claim based on their intuitive or argued beliefs, without reference to standard theoretical labels. The tree terminates in sixteen leaves, each representing a unique combination of commitments.

  ### The Branching Nodes

  1.  **Node 1 (Passage):** Is temporal passage ontologically real?
      *   **Yes:** Passage is a mind-independent feature of reality.
      *   **No:** Passage is reducible to psychological or perceptual asymmetry.
  2.  **Node 2 (Privilege):** Is there a single globally privileged present moment?
      *   **Yes:** One moment is metaphysically distinct as "The Present" (Monadic).
      *   **No:** Presentness is merely indexed to an observer's location without ontological privilege (Indexical).
  3.  **Node 3 (Relations):** Can cross-temporal relations hold between an existing present entity and a non-existing past entity?
      *   **Yes:** Relations (e.g., causation) can connect existents to non-existents.
      *   **No:** Both relata must exist for a relation to hold (The Past must exist).
  4.  **Node 4 (Direction):** Must the direction of passage be taken as primitive?
      *   **Yes:** Direction is a fundamental, unanalyzable feature.
      *   **No:** Direction is fully derived from the asymmetry of causation or entropy.

  ---

  ### The Leaves

  **Branch 1: Passage is Real (Node 1: Yes)**

  *   **Path 1.1: Privileged Present (Node 2: Yes)**
      *   **Path 1.1.1: Relations with Non-Existents (Node 3: Yes)**
          *   **1.1.1.A (Direction Primitive):** **Presentism (Primitivist).** The view that only the present exists and temporal flow is a fundamental feature of reality.
          *   **1.1.1.B (Direction Derived):** **Presentism (Reductionist).** The view that only the present exists, but the direction of time is explained by causal asymmetry rather than primitive flow.
      *   **Path 1.1.2: Relations Require Existents (Node 3: No)**
          *   **1.1.2.A (Direction Primitive):** **Growing Block / Moving Spotlight.** This combination conflates the Growing Block (past exists, future does not) and Moving Spotlight (all times exist, one is 'lit') views, as both affirm a privileged edge or moment and the existence of the past.
          *   **1.1.2.B (Direction Derived):** **Unnamed.** This position asserts a privileged present and real passage but denies primitive direction while requiring the past to exist; it struggles to explain what "moves" if not a primitive property.

  *   **Path 1.2: Indexical Present (Node 2: No)**
      *   **Path 1.2.1: Relations with Non-Existents (Node 3: Yes)**
          *   **1.2.1.A (Direction Primitive):** **Unnamed.** Asserting real passage and relations with non-existents without a privileged present is unstable; without privilege, there is no ontological ground for the passage to act upon.
          *   **1.2.1.B (Direction Derived):** **Unnamed.** This combination lacks a mechanism for real passage if no moment is privileged and direction is merely causal, rendering the "reality" of passage vacuous.
      *   **Path 1.2.2: Relations Require Existents (Node 3: No)**
          *   **1.2.2.A (Direction Primitive):** **Indexical Presentism.** A hypothetical stance where passage is real and the past exists, but the "now" is merely perspectival; it risks collapsing into Eternalism if the "real passage" adds no explanatory power.
          *   **1.2.2.B (Direction Derived):** **Indexical Presentism / Perspectival Eternalism.** This leaf is flagged for collapse; if passage is real but indexical and direction is derived, it is functionally indistinguishable from the Block Universe with a psychological sense of now.

  **Branch 2: Passage is Reducible (Node 1: No)**

  *   **Path 2.1: Privileged Present (Node 2: Yes)**
      *   **Path 2.1.1: Relations with Non-Existents (Node 3: Yes)**
          *   **2.1.1.A (Direction Primitive):** **Unnamed.** Claiming a privileged present while denying real passage is contradictory; privilege implies an ontological distinction that reducibility denies.
          *   **2.1.1.B (Direction Derived):** **Unnamed.** This position posits a metaphysically special moment that does nothing ontologically, rendering the privilege otiose.
      *   **Path 2.1.2: Relations Require Existents (Node 3: No)**
          *   **2.1.2.A (Direction Primitive):** **Block Universe with Static Spotlight.** The view that all times exist and one is privileged, but passage is an illusion; the privilege is static or inexplicable.
          *   **2.1.2.B (Direction Derived):** **Block Universe with Static Spotlight.** Similar to above, but the arrow of time is derived from entropy; the privileged present remains a metaphysically idle wheel.

  *   **Path 2.2: Indexical Present (Node 2: No)**
      *   **Path 2.2.1: Relations with Non-Existents (Node 3: Yes)**
          *   **2.2.1.A (Direction Primitive):** **Unnamed.** If passage is reducible and presentness is indexical, there is no ontological basis for relations to hold with non-existing entities.
          *   **2.2.1.B (Direction Derived):** **Unnamed.** This combination reduces passage and privilege to perspective but retains relations with non-existents, creating a tension between ontological parsimony and relational realism.
      *   **Path 2.2.2: Relations Require Existents (Node 3: No)**
          *   **2.2.2.A (Direction Primitive):** **Eternalism (Primitivist about Time's Arrow).** The standard Block Universe where all times exist, passage is psychological, but the direction of time is a fundamental brute fact.
          *   **2.2.2.B (Direction Derived):** **Eternalism (Standard B-Theory).** The view that all times equally exist, passage is a feature of consciousness, and temporal direction is reduced to causal or thermodynamic asymmetry.

  ---

  ### Structural Flags and Collapses

  **1. The Collapse of Indexical Presentism (Leaves 1.2.2.B and 2.2.2.B)**
  The tree fails to rigorously separate **Indexical Presentism** (Leaf 1.2.2.B) from **Perspectival Eternalism** (Leaf 2.2.2.B). Both positions affirm that the past exists, that presentness is indexical rather than privileged, and that direction is derived. The sole differentiator is Node 1 (whether passage is "ontologically real" or "reducible"). If "real passage" without a "privileged present" entails no change in the ontological status of events, the claim that passage is "real" becomes semantically empty. Consequently, Leaf 1.2.2.B collapses into Leaf 2.2.2.B, suggesting that real passage requires a privileged present to be metaphysically distinct from psychological perspective.

  **2. The Conflation of Growing Block and Moving Spotlight (Leaf 1.1.2.A)**
  The tree groups the **Growing Block** and **Moving Spotlight** theories into a single leaf (1.1.2.A). Both views affirm real passage, a privileged present (either the leading edge or the spotlighted time), and the existence of the past (Node 3: No). The tree fails to separate them because Node 3 queries only the existence of the *past*, not the *future*. The Growing Block denies the existence of the future, while the Moving Spotlight affirms it. Without a fifth node regarding the ontological status of future entities, these distinct theories remain logically indistinguishable within this specific four-node structure.
