  **Clinging & Dissolution Partners**
  4th Floor, The Void Complex
  Sunyata County, State of Samsara

  **Re: Last Will and Conventional Designation of [Testator Name]**

  Pursuant to the Two Truths (Legal Fiction) Statute, § 404 (Emptiness), we submit the attached instrument. Please note that all references to personhood are strictly conventional. No ultimate ownership is claimed. The Probate Court is requested to recognize this document as a useful fiction for the cessation of suffering regarding property distribution.

  ***

  **LAST WILL AND TESTAMENT OF THE CAUSAL CONTINUUM DESIGNATED [TESTATOR NAME]**

  **1. Declaration of Designation**
  The causal stream of five aggregates (form, sensation, perception, formations, consciousness) currently functioning under the conventional label "[Testator Name]" hereby declares this to be its final volitional arrangement. This designation is not a self, nor does it possess a self, but for the purposes of the Probate Code, it accepts the liability of being the testator. Any resemblance to a persisting entity is coincidental and merely linguistic.

  **2. Disposition of Conventionally Held Assets**
  All property, rights, and interests currently attached to this continuum via karma and local property law are hereby transferred. While nothing ultimately belongs to anyone, the conventional appearance of ownership is acknowledged to prevent dispute. The Beneficiaries listed herein are granted the right to cling to these objects as they see fit. Specifically, the house at [Address] is given to [Beneficiary], who assumes the mortgage and the illusion of permanence associated with domicile.

  **3. Residuary Clause (The Aggregates)**
  Upon the cessation of breath, the remaining physical aggregate (the corpse) shall be cremated. The mental aggregates cease automatically at death, but any lingering karmic momentum not exhausted by this transfer is bequeathed to the Sangha. No executor is appointed to manage the self, as there is none to manage; an Executor is appointed only to manage the paperwork.

  **4. Dedication of Merit**
  The wholesome karma generated by the funeral expenses and this drafting fee is hereby dedicated to the being formerly designated as "Mother." It is acknowledged that she may currently exist as a hungry ghost, a deva, or a dispersed memory. If no recipient exists to receive this merit, the dedication itself shall stand as a wholesome intention within the universal causal flow. The transaction occurs without a giver, without a receiver, and without a gift, yet the merit is transferred.

  **5. Contingencies on Liberation and Branching**
  Should this causal continuum attain *nibbana* prior to the grant of probate, this Will becomes void, as there is no one left to inherit or bequeath. In the event of quantum branching or fission of the psychological continuum, the Estate shall be divided equally among all resulting streams claiming continuity of memory. If no stream claims the assets, they revert to the State, which is also empty.

  **6. Attestation and Sound Mind**
  The undersigned witnesses certify that they observed a body signing this document. They attest that the cognitive flux appearing at the time was coherent enough to satisfy the legal standard of "sound mind," despite the absence of a mind to be sound. We saw the hand move; we infer the intention; we deny the agent.

  **7. No-Contest Clause**
  Any Beneficiary who challenges this Will is deemed to be clinging to the concept of a self. Such challenge violates the Two Truths Statute. Any party litigating on the grounds that the Testator "never existed" shall forfeit their share, as the Court cannot distribute assets to a nihilist who denies the convention of distribution.

  **Signed:** ________________________
  (The Conventionally Designated Signatory)

  **Witnessed:** ________________________
  (Observer of Momentary Phenomena)
