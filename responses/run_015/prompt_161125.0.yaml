answer: |-
  You are right to feel the freeze. The literature is circling a drain because it is treating a fragmented, empirical-philosophical hybrid problem as a single, global metaphysical showdown.

  Your hunch is correct, but it needs sharpening. The stalemate is not merely verbal, nor is it purely a clash of epistemic priors. It is a **Scope Mismatch compounded by a Modal Illusion.**

  I diagnose the stalemate as **70% a disagreement about the data (your "Different Exhibits" point) and 30% a hidden modal epistemology dispute (your "Insensitive" point).** The reason it feels frozen is that both sides are attempting to win a global war using local skirmishes, and neither is willing to concede that "morality" is not a natural kind.

  Here is the breakdown of why this diagnosis holds, and what actual progress would look like.

  ### 1. The Diagnosis: Scope Mismatch (70%)

  You noted that debunkers reach for kin altruism/disgust while realists reach for impartial harm/fairness. This is not just cherry-picking; it is a fundamental disagreement about the *extension* of the term "moral belief."

  *   **The Debunker's Strategy:** Implicitly adopts a **maximalist** definition of morality. To debunk *moral realism*, they need to show that *the faculty* producing moral beliefs is off-target. They include visceral, parochial, and culturally variable norms (purity, loyalty, in-group bias) because these are the beliefs where the evolutionary story is strongest and the truth-connection is weakest. If these count as "moral beliefs," realism is in deep trouble.
  *   **The Realist's Strategy:** Implicitly adopts a **normative** definition of morality. They filter the data through a reflective equilibrium before the debate even starts. They argue that purity norms are *mistakes* or *biological noise*, not genuine moral beliefs. Genuine moral beliefs are the abstract, stable ones (suffering is bad, fairness is good). For these, they argue, fitness and truth dovetail.

  **Why this causes a freeze:**
  The debate is structured as "Does evolution debunk Moral Beliefs?"
  *   Debunker hears: "Does evolution explain the origins of the psychological states we *call* moral?" (Answer: Yes, and not for truth.)
  *   Realist hears: "Does evolution explain the origins of the *true* moral principles?" (Answer: Only if they are true, because truth is fitness-conducive.)

  They are not disagreeing about the evolutionary story (as you noted). They are disagreeing about **which psychological states get to count as evidence for the reliability of the moral faculty.** Because neither side explicitly restricts the scope, they talk past each other. The debunker says, "Look at this disgust response!" The realist says, "That's not morality, that's biology." The realist says, "Look at impartial benevolence!" The debunker says, "That's just a recent cultural veneer on tribal psychology."

  ### 2. The Diagnosis: The Modal Illusion (30%)

  Your distinction between **Off-Target** (selection for fitness) and **Insensitive** (beliefs would remain if facts differed) is the crux of the epistemic work. However, the stalemate here arises because the "Insensitive" claim relies on a modal evaluation that neither side can justify.

  To claim our beliefs are *Insensitive*, the debunker must assert: **In nearby possible worlds where the moral facts are different, our evolutionary history remains the same.**

  *   **The Problem:** If moral facts are necessary truths (as many realists claim), there are *no* nearby worlds where they are different. The counterfactual antecedent is impossible.
  *   **The Debunker's Move:** They treat moral facts as contingent or treat the "tracking" relation as requiring a causal mechanism even for necessary truths (Field's Benacerraf problem).
  *   **The Realist's Move:** They argue that for necessary truths, "safety" is guaranteed if the belief is true, regardless of causal history.

  This is where the priors clash. But it is not just a brute clash; it is a failure to specify the **space of variation**. When we ask "Would we still believe X if X were false?", what are we holding fixed? Our biology? Our environment? Our rational capacities?
  *   If we hold biology fixed, the debunker wins (we are stuck with our fitness-driven brains).
  *   If we hold rational capacities fixed, the realist wins (a rational agent would converge on the truth regardless of biology).

  The literature stays frozen because nobody defines the "nearby world" parameters for moral counterfactuals. They assume we share an intuition about modal distance, but we don't.

  ### 3. What Counts as Progress?

  Given this diagnosis, continuing to argue about "Evolutionary Debunking Arguments" as a monolithic block is a category error. Progress requires dismantling the monolith.

  **A. Abandon the "All or Nothing" Framing**
  Progress requires admitting that **Global Debunking is likely false, but Local Debunking is likely true.**
  *   *Progress:* A taxonomy of moral beliefs. We should expect a "hybrid" model where some beliefs (purity, retributive justice, in-group loyalty) are heavily debunked by evolution, while others (harm avoidance, basic reciprocity) are dovetailed.
  *   *Metric:* A paper that successfully isolates a specific class of moral judgments (e.g., "deontological constraints on bodily harm") and provides a specific evolutionary genealogy that *cannot* be reconciled with a third-factor explanation, without generalizing to all morality.

  **B. Empirical Constraints on the Counterfactual**
  The "Insensitive" claim is currently an armchair modal intuition. Progress requires grounding it in comparative biology or anthropology.
  *   *Progress:* Evidence showing that moral beliefs vary *independently* of the proposed "dovetailing" fitness factors. If realists claim "Fairness is fitness-conducive *and* true," we need to see if fairness norms track fitness variance or truth variance across cultures.
  *   *Metric:* Cross-cultural data showing that when fitness pressures change, specific moral beliefs change *even when the purported moral facts remain constant*. This would empirically support the "Insensitive" claim for specific belief clusters.

  **C. Clarifying the Modal Epistemology**
  We need a formal account of what "tracking" means for non-natural properties.
  *   *Progress:* A rigorous model of **non-causal tracking**. Realists need to explain the mechanism of convergence that isn't just "we evolved to see the truth." Debunkers need to explain why a non-causal link is insufficient *unless* there is a specific defeating explanation.
  *   *Metric:* A formal epistemic model (perhaps Bayesian) that quantifies how much the probability of a moral belief being true decreases given an evolutionary explanation, independent of the content of the belief.

  ### 4. Honest Assessment: Should we expect progress?

  If the question is "Does evolution debunk Moral Realism?", **no progress should be expected.** That question is too coarse. It conflates the psychology of disgust with the logic of fairness. It conflates necessary truths with contingent norms. It conflates causal explanation with epistemic justification.

  The debate is frozen because it is trying to solve a **meta-ethical** question (What is the status of moral facts?) using a **genealogical** premise (How did we get these beliefs?), while ignoring the **psychological** reality (We have multiple, conflicting moral systems).

  **The Verdict:**
  The stalemate is substantive, but it is substantive about **taxonomy**, not metaphysics.
  *   **20% Verbal:** Disagreement on what counts as a "moral belief."
  *   **30% Modal:** Disagreement on how to evaluate counterfactuals regarding necessary truths.
  *   **50% Empirical/Scope:** Disagreement on which psychological modules are relevant to the truth-claim.

  **The Path Forward:**
  Stop asking if evolution debunks morality. Start asking: **"For which specific cognitive modules does the evolutionary explanation screen off the truth-claim?"**

  If the literature shifted from "Street vs. Wielenberg" to "The Evolutionary Genealogy of Deontological Constraints vs. Consequentialist Calculations," the freeze would break. We would likely find that evolution debunks the *deontological intuitions* (trolley problems, purity) but leaves the *consequentialist constraints* (suffering is bad) intact. That is a substantive result. But it requires both sides to give up the claim that they are defending or attacking "Morality" as a whole.

  Until then, you are correct: it is just people restating priors about different subsets of data under the same label.
