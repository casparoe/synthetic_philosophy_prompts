prompt: |-
  I just spent three hours arguing with a friend about whether we are permitted to discount the well-being of future people purely because they live in the future. The argument kept looping because we had no shared standard for what a theory of intergenerational discounting is even supposed to do. By the end I realized that before I take a side, I need the specification laid out in full.

  So: write the desiderata. What must an adequate theory of how we should value the well-being of future generations relative to present well-being actually deliver? I want the cases it must get right, the distinctions it cannot collapse, the results from economics and ethics it must be consistent with, and the puzzles it must dissolve or at least squarely address. For each requirement, give the consideration that makes it a requirement. Flag which are non-negotiable and which are contested between camps—for instance, between those who defend a positive pure rate of time preference and those who regard it as ethically indefensible; between those who treat the Ramsey formula as the right framework and those who reject it; between those who think uncertainty about extinction settles the matter and those who think it merely complicates it. I especially want to know whether any subset of these desiderata is jointly unsatisfiable—whether, for example, the demand for impartiality across generations and the demand for sensitivity to the opportunity cost of capital pull in opposite directions and cannot both be fully honored. That is the part that would have saved me three hours.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of intergenerational discounting:

  1.  **Deconstruct the Request:**
      *   **Topic:** Intergenerational discounting (valuing future well-being vs. present well-being).
      *   **Task:** Write the *desiderata* (requirements/criteria) for an adequate theory.
      *   **Specifics:** Cases it must get right, distinctions it must maintain, consistency with economics/ethics, puzzles it must address.
      *   **Labeling:** Flag non-negotiable vs. contested (e.g., pure time preference, Ramsey formula, extinction risk).
      *   **Key Insight:** Identify if any subset of desiderata is *jointly unsatisfiable* (trade-offs/impossibility theorems).
      *   **Goal:** Save the user from a 3-hour looping argument by clarifying the foundational standards.

  2.  **Initial Brainstorming & Categorization:**
      *   What are the main players in this debate? Ramsey, Koopmans, Parfit, Stern, Nordhaus, Weitzman.
      *   What are the core concepts? Pure rate of time preference ($\delta$), elasticity of marginal utility ($\eta$), growth rate ($g$), Ramsey Rule ($r = \delta + \eta g$), impartiality, sustainability, uncertainty, extinction.
      *   What are the conflicting intuitions? "A dollar today is worth more" vs. "Future lives matter just as much."
      *   Structure: I need to organize these into logical groups (Ethical, Economic, Practical/Policy, Logical Consistency).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Ethical Core:* Must treat generations fairly. (Impartiality). But does that mean $\delta = 0$? Contested.
      *   *Economic Reality:* Capital has productivity. We can invest today to help tomorrow. (Opportunity Cost).
      *   *Existential Risk:* What if there *is* no tomorrow? (Extinction Probability).
      *   *Policy Action:* It needs to give a number (or range) for cost-benefit analysis (e.g., climate change).
      *   *Paradoxes:* The Repugnant Conclusion, Parfit's Non-Identity Problem, Weitzman's Dismal Theorem.

  4.  **Refining and Labeling (Non-Negotiable vs. Contested):**
      *   *Non-Negotiable:* Logical consistency, clarity on variables, addressing the "why."
      *   *Contested:* $\delta = 0$ (Stern vs. Nordhaus), how to handle catastrophic risk, how to handle changing populations.

  5.  **Identifying the "Impossible Trinity" (Joint Unsatisfiability):**
      *   This is the crux of the user's request. Where do the tensions lie?
      *   *Tension 1:* Strong Impartiality ($\delta=0$) + Positive Growth + Standard Utilitarianism $\rightarrow$ Infinite Savings/Investment (Parfit/Koopmans). You save so much for the future you starve the present.
      *   *Tension 2:* Finite Horizon + Impartiality $\rightarrow$ Time Inconsistency.
      *   *Tension 3:* Heavy Tails (Weitzman) + Expected Utility $\rightarrow$ Infinite Willingness to Pay (Dismal Theorem).
      *   *Tension 4:* Descriptive (market rates) vs. Prescriptive (ethical rates).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Define the scope (normative economics/ethics).
      *   **Section 1: The Ethical Desiderata (The "Ought").** Focus on impartiality and personhood.
      *   **Section 2: The Economic Desiderata (The "Is" and "Can").** Focus on growth, capital, and the Ramsey Rule.
      *   **Section 3: The Risk & Uncertainty Desiderata.** Focus on extinction and fat tails.
      *   **Section 4: The Coherence & Tractability Desiderata.** Focus on time consistency and actionability.
      *   **Section 5: The Impossibility Results (The "Joint Unsatisfiability").** This is the payoff.
      *   **Conclusion:** Summary advice for the argument.

  7.  **Drafting Content - Specific Points to Hit:**
      *   *Ramsey Rule:* $r = \delta + \eta g$. Explain the terms.
      *   *Pure Time Preference ($\delta$):* Is it discrimination? (Stern) Or pragmatic? (Nordhaus/Arrow).
      *   *Elasticity ($\eta$):* Inequality aversion.
      *   *Weitzman's Dismal Theorem:* Fat tails dominate discounting.
      *   *Parfit's Non-Identity:* Actions change *who* exists.
      *   *Time Consistency:* Hyperbolic discounting issues.

  8.  **Review against Constraints:**
      *   Did I flag contested vs. non-negotiable? Yes, will use explicit tags.
      *   Did I address joint unsatisfiability? Yes, dedicated section.
      *   Is the tone appropriate? Analytical, philosophical, rigorous.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure not to conflate *discounting utility* with *discounting consumption*. This is a common confusion. I need to make sure the desiderata distinguish them.
      *   *Refinement:* Ensure the distinction between *descriptive* (what markets do) and *prescriptive* (what ethics demands) is clear. This is often where arguments loop.
      *   *Addition:* Add the "Overwhelming Future" problem. If $\delta=0$ and growth continues, the future swamps the present.

  10. **Final Polish:** Check for clarity, ensure the "Impossible Trinity" is highlighted as the key takeaway. (Proceed to generate output based on this structure).

  *(Self-Correction Note during final review)*: I need to make sure I explicitly answer the "jointly unsatisfiable" prompt with a specific theorem or logical conflict, not just a vague tension. The Koopmans-Manssens result or the conflict between Strong Impartiality and Finite Present Value is the strongest candidate. I will focus on the conflict between **Strong Impartiality**, **Positive Growth**, and **Finite Present Value**.

