answer: |-
  This is a classic failure mode in normative economics and moral philosophy. Arguments about intergenerational discounting loop because participants are often optimizing for different objective functions without realizing it. One person is optimizing for *ethical consistency* (Parfit), another for *policy tractability* (Nordhaus), and a third for *market consistency* (Arrow).

  To stop the looping, you need a specification sheet. Below are the desiderata for an adequate theory of intergenerational discounting. I have categorized them by domain, flagged their status (Non-Negotiable vs. Contested), and identified the specific consideration that motivates them.

  At the end, I detail the **Impossibility Results**, which address your specific question about jointly unsatisfiable requirements.

  ---

  ### I. Ethical Desiderata (The Moral Status of Future People)

  **1. The Impartiality Requirement**
  *   **Specification:** The theory must specify whether the date of birth is morally relevant to the weight of a person's well-being.
  *   **Consideration:** If we discount utility purely because it occurs later ($\delta > 0$), we are effectively asserting that a life lived in 2100 is intrinsically less valuable than a life lived in 2024.
  *   **Status:** **Contested.**
      *   *Camp A (Stern/Parfit):* Pure time preference ($\delta$) is ethically indefensible discrimination. $\delta$ must be 0.
      *   *Camp B (Nordhaus/Arrow):* Pure time preference is permissible as a form of "societal myopia" or because probability of existence declines over time.
  *   **Non-Negotiable Core:** The theory must *explicitly state* its stance on $\delta$. It cannot hide descriptive market rates behind normative claims.

  **2. The Non-Identity Accommodation**
  *   **Specification:** The theory must handle cases where present policies change *who* comes into existence, not just *how well* they live.
  *   **Consideration:** Parfit's Non-Identity Problem. If we choose a policy that depletes resources, future people will be poorer, but they might not have existed at all under a conservation policy (due to different conception times/partners). Standard "harm" frameworks fail here.
  *   **Status:** **Non-Negotiable.** An adequate theory cannot rely solely on "harm to specific individuals." It must be able to evaluate states of affairs (impersonal utilitarianism) or provide a robust alternative.

  **3. The Changing Population Constraint**
  *   **Specification:** The theory must define how to aggregate well-being when the number of people in future generations varies based on policy.
  *   **Consideration:** Total Utilitarianism leads to the "Repugnant Conclusion" (a vast population with lives barely worth living is better than a smaller, happy population). Average Utilitarianism leads to the "Mere Addition Paradox."
  *   **Status:** **Contested.** There is no consensus on the correct population ethics (Total vs. Average vs. Critical Level). The theory must declare which aggregation function it uses.

  ---

  ### II. Economic Desiderata (Resource Allocation & Growth)

  **4. The Ramsey Consistency**
  *   **Specification:** If the theory uses the Ramsey Rule ($r = \delta + \eta g$), it must define the elasticity of marginal utility ($\eta$) and the growth rate ($g$) consistently.
  *   **Consideration:** Discounting consumption is not the same as discounting utility. If future people are richer ($g > 0$), the marginal utility of their consumption is lower. We can discount their *dollars* without discounting their *lives*.
  *   **Status:** **Non-Negotiable.** The distinction between discounting *utility* (ethical) and discounting *consumption* (economic) must be maintained. Collapsing these is a category error.

  **5. The Opportunity Cost of Capital**
  *   **Specification:** The theory must account for the productivity of investment. Resources invested today grow.
  *   **Consideration:** If we can invest \$1 today to generate \$3 of benefit in 50 years, transferring wealth to the future via investment is more efficient than transferring it via sacrifice.
  *   **Status:** **Non-Negotiable.** Ignoring capital productivity leads to inefficient altruism (eating the seed corn).

  **6. The "Overwhelming Future" Avoidance**
  *   **Specification:** The theory must not imply that the present generation should sacrifice almost all consumption to benefit the future.
  *   **Consideration:** If $\delta = 0$ and $g > 0$ and the horizon is infinite, the present value of the future becomes infinite. This implies we should save nearly everything, starving the present to marginally enrich the already-rich future.
  *   **Status:** **Contested.**
      *   *Camp A:* This is a *reductio ad absurdum* of $\delta = 0$.
      *   *Camp B:* This is a *reductio ad absurdum* of unbounded growth models.

  ---

  ### III. Risk and Uncertainty Desiderata

  **7. The Extinction Probability Integration**
  *   **Specification:** The theory must incorporate the probability that there *will be* no future generation.
  *   **Consideration:** If there is a 1% annual risk of human extinction, expected value naturally discounts the future without needing ethical time preference.
  *   **Status:** **Non-Negotiable.** A deterministic model is insufficient for long-term policy (e.g., nuclear waste, climate).

  **8. The Fat Tail Resolution (Weitzman's Dismal Theorem)**
  *   **Specification:** The theory must handle low-probability, high-impact catastrophic risks where the probability distribution has "fat tails."
  *   **Consideration:** In standard expected utility theory, if the potential loss is infinite (civilization collapse) and the tail is fat enough, the willingness to pay to prevent it becomes infinite, regardless of the discount rate.
  *   **Status:** **Contested.**
      *   *Camp A:* This shows Expected Utility Theory breaks down for existential risk.
      *   *Camp B:* This shows we must truncate distributions or use different decision criteria (e.g., minimax).

  ---

  ### IV. Coherence and Tractability Desiderata

  **9. Time Consistency**
  *   **Specification:** The preferences of the current generation about the future must align with the preferences the future generation will have about their own future.
  *   **Consideration:** Hyperbolic discounting leads to dynamic inconsistency. We plan to save for 2100 today, but when 2100 arrives, we prefer to consume then rather than save for 2200.
  *   **Status:** **Non-Negotiable.** A policy plan that future generations will immediately abandon is not a viable theory of intergenerational justice.

  **10. Actionability (The "Number" Requirement)**
  *   **Specification:** The theory must yield a discount rate (or schedule) usable in cost-benefit analysis.
  *   **Consideration:** Policymakers cannot act on "it depends on your meta-ethical stance." They need a social discount rate to evaluate infrastructure or carbon taxes.
  *   **Status:** **Non-Negotiable.** Philosophical purity that yields no policy guidance is insufficient for this specific domain.

  ---

  ### V. The Impossibility Results (Jointly Unsatisfiable Desiderata)

  This is the section that would have saved your three hours. There are logical conflicts between these desiderata. You cannot maximize all of them simultaneously. You must choose which constraint to relax.

  **1. The Koopmans Impossibility (Impartiality vs. Sensitivity)**
  *   **Conflict:** You cannot have **Strong Impartiality** ($\delta = 0$), **Continuity** (small changes in consumption don't cause massive swings in value), and **Sensitivity to the Present** (the present generation matters at all) simultaneously in an infinite horizon model.
  *   **The Trap:** If you insist on $\delta = 0$ (Ethical Desideratum 1) and an infinite future, the mathematical weight of the future swamps the present (Economic Desideratum 6). To save the present, you must either accept $\delta > 0$ (violating Impartiality) or assume growth stops eventually (violating standard economic models).
  *   **Resolution:** Most economists accept a small $\delta$ (e.g., 0.1%) not because future lives matter less, but to satisfy mathematical convergence and prevent the "tyranny of the future."

  **2. The Weitzman Dismal Theorem (Uncertainty vs. Tractability)**
  *   **Conflict:** You cannot have **Standard Expected Utility**, **Fat-Tailed Uncertainty** (Risk Desideratum 8), and **Finite Willingness to Pay** (Tractability Desideratum 10) simultaneously.
  *   **The Trap:** If there is a non-zero chance of infinite loss (extinction), and the probability declines slower than the utility declines, the discount rate becomes irrelevant. You should pay *everything* to prevent climate change today.
  *   **Resolution:** You must either reject Expected Utility Theory for catastrophic risk, truncate the probability distributions (claiming we know the max loss), or accept that the theory breaks down at the extremes.

  **3. The Descriptive-Prescriptive Gap (Market Rates vs. Ethics)**
  *   **Conflict:** You cannot simultaneously satisfy **Market Consistency** (using observed interest rates) and **Ethical Impartiality**.
  *   **The Trap:** Market rates reflect private time preference, risk, and growth. They embed the "myopia" of current voters and investors. Using them for public, intergenerational projects (like climate) imports current selfishness into future ethics. Using ethical rates (Stern) makes most current investments look inefficient.
  *   **Resolution:** You must declare whether the theory is *positive* (how we do value) or *normative* (how we should value). Using market rates for climate policy is a category error unless adjusted for public good externalities.

  ### Summary for Your Argument

  If you restart the conversation, do not ask "What is the right discount rate?" Ask: **"Which impossibility result are we willing to live with?"**

  1.  If you demand **Impartiality** ($\delta=0$), you must accept that the **Present is Tyrannized** by the Future (unless you cap growth).
  2.  If you demand **Tractability** (finite costs), you must accept **Ethical Compromise** ($\delta>0$) or **Risk Truncation** (ignoring fat tails).
  3.  If you demand **Market Consistency**, you must accept **Ethical Inconsistency** (importing private myopia into public policy).

  An adequate theory is not one that solves these tensions, but one that explicitly states which tension it chooses to prioritize and why.
