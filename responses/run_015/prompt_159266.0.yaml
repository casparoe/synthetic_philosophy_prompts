answer: |-
  Here is a disambiguation of the proverb "you reap what you sow," structured as a menu of distinct theses. These are ordered from the thinnest (most empirical, least morally loaded) to the strongest (most metaphysical, most morally loaded).

  Following the menu, I have assessed which reading is required to do the work in each of your three specific use-cases, and whether that reading survives scrutiny.

  ### Part I: The Menu of Readings

  #### Reading 1: The Prudential Generalization (Thinnest)
  *   **The Thesis:** Actions have consequences, and negative actions tend to produce negative outcomes for the agent through natural causal chains (social retaliation, psychological stress, practical failure).
  *   **The Variables:**
      *   **Currency:** Value-matching only (bad outcome need not resemble bad deed).
      *   **Ledger:** Aggregative (general trends over a life, not deed-for-deed).
      *   **Tracker:** Consequence-tracking (outcomes matter more than intent).
      *   **Purpose:** Equilibrative (causal homeostasis, no moral point).
      *   **Identity:** Strict biological/psychological continuity only.
      *   **Mechanism:** Impersonal natural law (sociological/psychological).
  *   **Verdict:** **Platitude.** It is empirically true that cruelty often isolates the cruel, but it admits of frequent exceptions (the successful tyrant) and does not establish *desert*, only risk.

  #### Reading 2: The Characterological Thesis (Substantive & Defensible)
  *   **The Thesis:** Moral actions shape the agent's character, and character determines destiny. One "reaps" a life that reflects the kind of person one has become through sowing. The suffering is not a penalty imposed from outside, but the internal erosion of the capacity to flourish.
  *   **The Variables:**
      *   **Currency:** Value-matching (flourishing vs. misery), though often feels like currency-matching (the liar lives in fear of lies).
      *   **Ledger:** Aggregative (the totality of character).
      *   **Tracker:** Intention-tracking (habitual intent forms character).
      *   **Purpose:** Educative/Purgative (the suffering is the symptom of vice).
      *   **Identity:** Strict psychological continuity.
      *   **Mechanism:** Impersonal natural law (moral psychology).
  *   **Verdict:** **Substantive and Defensible.** This is an Aristotelian view. It avoids the luck objection partially by internalizing the "harvest," but it cannot explain why bad people sometimes flourish or why good people suffer externally (illness, poverty).

  #### Reading 3: The Cosmic Equilibrium (Substantive & Undefended)
  *   **The Thesis:** The universe possesses a moral architecture that ensures total moral balance over a sufficiently long timeline (potentially spanning multiple lives). Suffering is not random; it is the necessary discharge of a moral debt.
  *   **The Variables:**
      *   **Currency:** Value-matching (suffering matches the disvalue of the sin).
      *   **Ledger:** Aggregative across lifetimes (the total life balance must be zero).
      *   **Tracker:** Intention-tracking (karma attaches to volition).
      *   **Purpose:** Equilibrative (bookkeeping necessity).
      *   **Identity:** "Stream" continuity (reincarnation or transpersonal self).
      *   **Mechanism:** Impersonal metaphysical law (like gravity, but moral).
  *   **Verdict:** **Substantive but Undefended.** It solves the empirical counter-examples of Reading 1 & 2 by positing unseen timelines. However, it is metaphysically costly and unfalsifiable. It renders "luck" illusory, but at the price of empirical evidence.

  #### Reading 4: The Retributive Atomism (Strongest)
  *   **The Thesis:** Every specific moral violation generates a specific claim for suffering that must be discharged by the specific agent. Present misery is not just an effect of past action, but a *payment* owed. If you are suffering now, it is because you are currently paying for a specific past sowing.
  *   **The Variables:**
      *   **Currency:** Currency-matching (poetic justice: deception repaid by deception).
      *   **Ledger:** Atomic (each deed has its own discrete return).
      *   **Tracker:** Intention-tracking (malice requires punishment).
      *   **Purpose:** Retributive (suffering is *owed*, not just useful).
      *   **Identity:** Strict identity (or karmic continuity strong enough to sustain blame).
      *   **Mechanism:** Administered or Law-like, but non-forgivable (debts must be paid).
  *   **Verdict:** **Straightforwardly False (in secular contexts) / Theologically Controversial.** In a secular framework, this is the "Just World Fallacy." It requires believing that all present suffering is merited. In theological frameworks, it conflicts with doctrines of grace, forgiveness, or unmerited suffering (e.g., Job).

  ---

  ### Part II: Assessment of the Three Use-Cases

  Here is how the readings map onto the specific jobs the proverb was asked to do in your session, and whether the required reading holds up.

  #### Use-Case 1: Answering the Objection from Luck
  *   **The Job:** To show that suffering is not a matter of circumstance/luck, but the inevitable result of the agent's own will, thereby dissolving the complaint that desert is hostage to fortune.
  *   **Required Reading:** **Reading 3 (Cosmic Equilibrium)** or **Reading 4 (Retributive Atomism).**
      *   *Why:* Reading 1 and 2 admit luck. In the Prudential and Characterological views, a good person can still be struck by lightning or born into poverty through no fault of their own. To defeat the luck objection entirely, the mechanism must be comprehensive enough to subsume all circumstances under the umbrella of "sowing." This requires the timeline expansion of Reading 3 or the atomic precision of Reading 4.
  *   **Verdict:** **Fails Scrutiny (Secular); Metaphysically Heavy (Theistic).**
      *   To make this work, you must assert that *no* suffering is truly luck. This requires the metaphysical baggage of Reading 3 (reincarnation/cosmic law). If the group is operating in a secular analytic framework, this reading is unavailable. If they are willing to accept the metaphysics, it solves the luck problem but creates a theodicy problem (see Use-Case 3).

  #### Use-Case 2: Distinguishing Karma from the Psychological Reading
  *   **The Job:** To insist that the proverb means something stronger and more moralized than "cruelty breeds guilt/isolation."
  *   **Required Reading:** **Reading 4 (Retributive Atomism)** or a hardened version of **Reading 3.**
      *   *Why:* The "Psychological Reading" is essentially Reading 1 or 2 (causal/social feedback). To claim the proverb is *stronger* than this is to claim the return is not just a natural consequence but a *moral requirement*. It requires the **Purpose** variable to be set to *Retributive* rather than *Equilibrative* or *Educative*. It requires the suffering to be *owed*, not just likely.
  *   **Verdict:** **Substantive but Undefended.**
      *   This distinction is coherent, but it lacks a mechanism. If it is not psychological (Reading 2) and not divine administration (Reading 4 with a God), what enforces the retribution? If it is an impersonal law (Reading 3), why is it retributive rather than equilibrative? This reading posits a "moral gravity" that punishes rather than just balances. This is a specific metaphysical claim that usually goes undefended in secular philosophy.

  #### Use-Case 3: Underwriting Inherited Disadvantage/Desert
  *   **The Job:** To claim that a person's present misery (e.g., poverty, structural disadvantage) is *deserved* because it is the harvest of their own earlier sowing.
  *   **Required Reading:** **Reading 4 (Retributive Atomism)** with **Identity** set to "Stream Continuity" (Reincarnation).
      *   *Why:* This is the most demanding use. To claim present structural misery is *deserved* based on *own earlier choices* requires:
          1.  **Atomic Ledger:** The specific misery matches a specific past deed.
          2.  **Retributive Purpose:** The misery is a payment, not a lesson.
          3.  **Identity:** The "sower" and "reaper" must be the same moral agent. Since the "sowing" clearly did not happen in *this* life (given the "inherited" nature of the disadvantage), this requires trans-migratory identity (karma across lives).
          4.  **Currency:** Often implies currency-matching (e.g., spiritual poverty led to material poverty).
  *   **Verdict:** **Straightforwardly False (Secular) / Morally Repugnant (Applied).**
      *   Your suspicion is correct. This use requires the strongest possible version of the proverb. It entails that a child born into famine deserves it due to actions in a previous life.
      *   **Scrutiny:** Even within traditions that accept karma (e.g., Hinduism, Buddhism), this specific application is often cautioned against. In Buddhism, karma is not fate; it is one condition among many. In Hinduism, while caste was historically justified this way, modern theological interpretations often reject the idea that specific present sufferings are exact retributions for specific past sins (emphasizing instead *prarabdha* karma as general circumstance rather than specific punishment).
      *   To assert this in a reading group on *moral desert* is to commit the **Just World Fallacy** in its most aggressive form. It conflates *explanation* (this is the causal result of past action) with *justification* (this is the moral merit of the result). Reading 4 conflates these. Reading 3 (Equilibrative) might explain it without necessarily endorsing the *merit* of the suffering, but Use-Case 3 explicitly claims the person *merits* the misery. That requires Reading 4.

  ### Part III: Summary of Distinctions You May Have Missed

  In sorting these readings, two critical distinctions emerged that were not explicitly in your list but are necessary to evaluate the "Inherited Disadvantage" claim:

  1.  **Explanation vs. Justification:**
      *   *Reading 1 & 2* offer **Explanation**: "You are suffering because you acted badly (and consequences followed)."
      *   *Reading 4* offers **Justification**: "You are suffering because you *ought* to suffer."
      *   Use-Case 3 requires Justification. Most secular defenses of karma retreat to Explanation when pressed.

  2.  **General Condition vs. Specific Retribution:**
      *   *Aggregative Readings (2 & 3)* suggest your past sowing created the *conditions* of your life (e.g., a predisposition to struggle).
      *   *Atomic Readings (4)* suggest your past sowing caused the *specific event* (e.g., this specific illness).
      *   Use-Case 3 implies the Atomic reading (this misery is deserved). The Aggregative reading would only support the claim that "life is harder for you," not that "this specific misery is a payment."

  ### Conclusion for Your Meeting

  You can bring the following conclusion to the group:

  The proverb "you reap what you sow" is being asked to perform three incompatible functions.
  1.  To defeat **Luck**, it must be **Reading 3** (Cosmic Equilibrium).
  2.  To exceed **Psychology**, it must be **Reading 4** (Retributive Atomism).
  3.  To justify **Inherited Disadvantage**, it must be **Reading 4** with **Trans-migratory Identity**.

  **The Verdict:** The third use (justifying present misery as deserved) requires **Reading 4**. This reading is **straightforwardly false** in a secular context (it is the Just World Fallacy) and **theologically controversial** even in traditions that accept karma (as it denies grace, luck, and structural causality).

  If the group wishes to retain the proverb as a tool for analyzing moral desert without endorsing victim-blaming metaphysics, they must restrict it to **Reading 2 (The Characterological Thesis)**. However, they must acknowledge that Reading 2 *cannot* do the work required in Use-Case 1 (it admits luck) or Use-Case 3 (it cannot justify structural disadvantage as merited). They cannot have the proverb do all three jobs simultaneously without contradiction.
