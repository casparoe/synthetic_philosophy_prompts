      *Let's check the (4)->(5) slide.* This is the "Functional Equivalence Fallacy." Pain is a negative reward signal in a reinforcement learning agent. If you make it positive, the agent seeks the stimulus. A zebra seeking a lion leads to extinction. Extinction leads to no more bliss. Thus, (4) fails to satisfy (1) in the long run.

      *Decision:* The strongest philosophical move that saves (1) is to argue that (4) is biologically incoherent given (3). You cannot have stable ecology with inverted valence. Therefore, HI demands *abolishing* predation, not *rewiring* it. This saves HI from the "monstrous" conclusion by showing the monstrous conclusion is impossible/unstable.

