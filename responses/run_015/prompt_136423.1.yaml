prompt: |-
  You are a philosopher of biology and ethics with a background in decision theory. Please think step by step, and do a quick brainstorm of the main objections before you settle on an answer.

  I'm writing a paper on the hedonistic imperative -- the idea that we should use biotech to abolish suffering everywhere, not just in humans -- and my study group built this argument that feels like it proves way too much. I can't find the crack, and i want to keep premise (1) if possible. Here are the steps:

  (1) The hedonistic imperative holds that our primary moral duty is to use biotechnology to eliminate all experiential suffering.
  (2) Suffering is purely internal and experiential; if an organism's nervous system is engineered so that tissue damage is felt as intense pleasure, then there is technically no suffering, even though the external event (being torn apart, starvation, injury) still occurs.
  (3) Wild ecosystems depend on predation and disease, which currently produce enormous suffering, but also maintain biodiveristy and ecological stability.
  (4) So in principle we could use germline neuroengineering to make prey feel euphoria during capture and predators feel complete satiety without hunger pain, preserving ecological dynamics but removing every negative experience.
  (5) Therefore the imperative doesn't tell us to wipe out carnivores or replace nature with synthetic farms; it tells us to preserve wild nature and enhance it with "blissful predation."
  (6) But this sounds monstrous: it implies we are required to maintain a world where zebras are genetically designed to feel ecstatic while being disemboweled, treating sentient bodies as disposable pleasure-vessels.
  (7) So either the hedonistic imperative is false, or it really does commit us to engineering this kind of blissful Serengeti.

  My friend says the mistake is in (2) -- that suffering isn't just experiential, there's an objective badness to bodily destruction that doesn't depend on feeling. I think there might be a hidden scope shift or modal slide between (4) and (5), but i'm not sure. Which step should I reject, and what does rejecting it cost? If (2) goes, does that destroy the whole abolitionist project, or just force it to use different tech? Please don't just list objections; price the alternatives for me.
