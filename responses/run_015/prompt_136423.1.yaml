      *   *Objection to (3):* Ecosystems don't *need* predation/suffering. We can have synthetic ecology. Cost: Massive engineering burden. Potentially ecologically unstable.
      *   *Objection to (4):* Neuroengineering can't decouple damage from negative valence without breaking the organism's functionality. (Evolutionary biology constraint). Cost: Technical feasibility. If pain signals *must* be aversive to trigger avoidance, "blissful predation" makes the animal eat nothing or walk into fires.
      *   *Objection to (5):* Scope shift. Just because we *can* remove suffering doesn't mean we *must* preserve the *structure* of predation. HI might demand phasing out predation, not rewiring it.
