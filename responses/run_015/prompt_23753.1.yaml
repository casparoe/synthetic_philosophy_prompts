          3.  Define the Merging Argument (Group Loss/Hypothetical).
          4.  Highlight the Divergence (Metaphysics vs. Hypothetical Weight).
          5.  Address the Objections (Separate Claims vs. Irrelevance).
          6.  Conclusion on which is more exposed.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish Taurek's "Merging" from simple aggregation. Taurek uses merging to show that *even if* you merge, the loss isn't necessarily greater.
      *   *Nuance:* The friend thinks the One-Person argument is a red herring. I need to explain *why* it's not. It's the foundational premise. The Merging argument is a rhetorical device to help people *see* the One-Person point.
      *   *Key Distinction:* One-Person says "You *can't* add." Merging says "Even if you *do* add (via merging), it doesn't change the moral weight."
      *   *Objection Check:* The "Separate Claims" objection (Kamm/Scanlon) hits the One-Person argument hardest. The "Irrelevance" objection hits the Merging argument hardest.
      *   *Verdict:* The Merging argument is logically weaker (easier to dismiss), but the One-Person argument is the one that actually carries the weight of Taurek's thesis. Therefore, the friend is wrong to dismiss the One-Person argument as a red herring; it's the main engine.

