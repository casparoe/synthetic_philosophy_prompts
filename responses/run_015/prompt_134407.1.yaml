      *   Key concept: Time is not a river; it's a labyrinth or a static block.
      *   "The New Refutation of Time": Borges argues against the continuity of the self and the flow of time. If time is an illusion, then every moment exists eternally.
      *   Application to *Groundhog Day*: Phil isn't *repeating* Feb 2nd; he is experiencing the *totality* of Feb 2nd all at once, peeling back layers of perception.

