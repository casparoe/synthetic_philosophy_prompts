      *   *(d) Mechanistic/Causal Reply:*
          *   PL View: The encoding $\mathcal{E}$ must be *structural* or *homomorphic* to the causal dynamics. The compilation must be *compositional*.
          *   Analogy: Restricting $\mathcal{E}$ to be a valid type-preserving translation or requiring the target machine's transition relation to mirror the source's control flow graph physically.

  3.  **Address the Substrate Constraint (Von Neumann vs. Analog/Neuromorphic):**

      *   *Von Neumann:* Discrete states, clocked, stored program. Easy to map to standard automata theory.
      *   *Analog/Neuromorphic:* Continuous time, no discrete states, dynamics *are* the computation.
      *   *Impact on Claims:*
