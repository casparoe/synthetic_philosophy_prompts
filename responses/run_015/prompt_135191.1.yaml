          *   (c) Triviality: Even worse. Continuous systems have infinite states. Mapping is easier/more arbitrary unless constrained by topology.
          *   (d) Mechanistic: Becomes about *structural stability* or *topological conjugacy* rather than state-transition isomorphism.

  4.  **Address the "No-ABI Problem":**

      *   *User's Definition:* No well-defined I/O boundary $\to$ no observable behavior predicate $\to$ no correctness theorem.
      *   *Philosophical Map:* This maps directly to the **Indeterminacy of Translation** (Quine) or the **Frame Problem**, but more closely to the **Input/Output Objection** in philosophy of mind (where does the mind end and the world begin?).
      *   *Imported Assumption:* The user assumes implementation requires an *external* observer defining I/O. Philosophers (especially enactivists/embodied cognition) might reject this. They might argue the "ABI" is co-constituted by the agent's interaction with the environment (closed-loop semantics).
