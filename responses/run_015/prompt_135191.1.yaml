          2.  Perform the translation twice: once for Von Neumann targets, once for analog/neuromorphic substrates (no ISA, continuous dynamics). Identify architectural dependencies.
          3.  Address the "no-ABI problem" (lack of well-defined I/O boundary) and map it to philosophical arguments. Check for imported assumptions.
          4.  Provide a "Residue Report": What translates cleanly? What requires fudging? What is inexpressible? Is the gap in the vocabulary or the claim?
          5.  Specific Verdicts: Is "understanding/consciousness" (Chinese Room) genuine residue or changing the subject? Would naming target architecture + encoding dissolve the dispute?
      *   **Constraint:** Do *not* just explain the debate. Focus on translation and failure modes.

  2.  **Deconstruct the Philosophical Claims into PL Terms:**

      *   *(a) Cognition is Computation:*
          *   PL View: There exists a source language $L_{cog}$ (mental states/processes) and a target machine $M_{brain}$ such that the compilation relation $\mathcal{C}: L_{cog} \to M_{brain}$ holds with semantic preservation.
          *   Key: Existence of a valid semantic preservation proof.

      *   *(b) Chinese Room (Syntax vs. Semantics/Aboutness):*
          *   PL View: Symbol manipulation (operational semantics) $\neq$ Meaning (denotational semantics/pragmatics).
          *   Translation: The system satisfies the operational rules of a Turing Machine (or LLM), but lacks a *denotation* mapping to the external world that isn't just imposed by an external observer. It's about *intensionality* vs. *extensionality*.
          *   Refinement: It's about the lack of a causal link between the internal state and the referent, akin to a variable with no memory location or a pointer to nowhere.

      *   *(c) Triviality/Putnam's Argument (Any system implements any program):*
          *   PL View: The set of valid encodings $\mathcal{E}$ is unconstrained. If $\mathcal{E}$ is arbitrary (e.g., mapping physical states to logical states via a lookup table created *post-hoc*), then the implementation relation $Impl(S, P)$ is vacuously true for all $S, P$.
