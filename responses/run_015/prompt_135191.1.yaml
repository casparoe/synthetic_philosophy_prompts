prompt: |-
  I'm taking a compilers / programming-languages course this semester and I also TA the systems lab, and I share an apartment with an ML-theory person, so arguments about whether the brain is a computer keep ambushing me at like 1am. Most of my working vocabulary is: operational vs denotational semantics, abstract machines, compilation as correctness relative to a target plus an observable-behavior relation, full abstraction, type erasure, abstract interpretation, bisimulation, and the general reflex that "what program is this thing running?" has no answer until you fix a machine model and an encoding. I'd like you to translate the computationalism debate into exactly that vocabulary, as faithfully as you can, and then tell me what didn't survive. Concretely: restate (a) the claim that cognition is computation, (b) the Chinese-room-style objection that shuffling formal symbols doesn't get you understanding or aboutness, (c) the objection that computation is observer-relative in the sense that for basically any physical system and any finite-state program you can cook up an encoding making the system count as running that program, and (d) the mechanistic reply that the system's causal organization has to be doing the work, not just a mapping somebody wrote down after the fact. My guess is that (c) translates into something like "the set of allowed compilation schemes is unconstrained, so implementation becomes vacuous" and that (d) is trying to constrain those schemes to be structure-preserving in a way my field never has to think about — but tell me where that analogy breaks.

  Two extra things I care about, because I think they're where the interesting residue is. First: in my lab we work on neuromorphic and analog in-memory accelerators, where there is no instruction set, no stored program, no discrete clock, and the substrate just does continuous-time dynamics that we then read as a computation. Please do the translation twice — once with a classical von Neumann target in mind and once for that substrate-level analog case — and say which of the philosophical claims quietly depend on assuming a digital, stored-program target, because I suspect some of them are resting on an architectural assumption rather than on anything about minds. Second: I've started calling something the "no-ABI problem" — the worry that a brain has no well-defined input/output boundary or observable-behavior predicate, so there's nothing to state a correctness theorem against, and hence no fact of the matter about which of the many programs compatible with its transition structure it is "really" running. Does that map onto anything philosophers actually argue about, or am I reinventing something, and more importantly does my framing secretly import an assumption (that implementation must be answerable to an external observation predicate) that the philosophers would reject?

  Then give me the residue report, which is the part I actually want: which claims translate cleanly into semantics/compilation talk, which translate only if you fudge or quietly add an assumption my vocabulary doesn't contain, and which cannot be expressed at all in it — and for each bit of residue, whether you think that's a gap in my vocabulary that a better-engineered framework could close, or evidence that the original claim is less clear than it looks. I'd especially like your verdict on whether the understanding/consciousness part of the Chinese-room style objection is genuine residue or whether my instinct is right that it's changing the subject, and on whether the whole "is it really computing?" dispute would dissolve if everyone had to name a target architecture and an encoding the way a compiler does. Please don't just explain the debate to me — I've had that version already — I want the translation and what it fails to carry.
reasoning: |-
