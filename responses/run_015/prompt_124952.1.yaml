          *   *Camp 2 (The Intersubjective/Cognitive View):* Associated with Binmore, Rubinstein (to an extent), philosophers like Gilbert or Bratman (though they are more social ontology), and bounded rationality theorists. Rationality = reasoning process. CKR = cognitive accessibility.
          *   *The Verdict:* It is primarily a **category error** (different questions) masquerading as a substantive disagreement, exacerbated by **verbal ambiguity** (overloading "rationality" and "knowledge").
      *   **Analyzing the Distinction (Model vs. Agent):**
          *   Does it resolve anything? Yes, it dissolves the paradox.
          *   Model-level CKR ensures the *solution concept* (e.g., Nash Equilibrium) is stable *if* the model holds.
