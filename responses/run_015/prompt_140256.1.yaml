prompt: |-
  hey — i got roped into writing the practice exam for my school's philosophy/econ club and i need one essay question on why some countries are rich and others arent. context: everyone in the club is 16-17, nobody has read any actual papers, and the room we sit in has no wifi and no library books. so the question and the model answer both have to be totally self-contained: no real-world examples, no "as economist X argued in year Y", no reading lists. everything has to come from the case i give plus reasoning. 45 minutes, 20 marks total.

  the problem is that everyone has absorbed the same one-word answer off the internet — "institutions" — and i can already see six identical essays coming: a paragraph on institutions, a paragraph on geography, a paragraph on culture, conclusion "its mostly institutions", 14/20 for everyone. i want a question where that gets you like 6.

  so i drafted a made-up case to build the question around. use it, fix it if its badly designed, or throw it out and build a better one:

  Meridia is an island, one language, one mix of farming and fishing, fairly even rainfall and soil, no known gold/coal/oil. In 1891 a colonial governor splits it in two with a straight line drawn on a badly printed map; because of the misprint the line lands about 40km north of where he meant it. Nothing real changes as you cross it — same soil, same crops, the same families end up on both sides. One governor, one legal code, one school system until independence in 1960, then two countries, North Meridia and South Meridia, with word-for-word the same constitution, the same elections every five years, the same laws about property, contracts and taxes on paper. Today income per person in North is about four times what it is in South. Assume these are all true:

  (a) In North a road contract normally goes to the lowest bidder. In South it normally goes to someone the minister is related to. In both places over 90% of people tell surveyers that corruption is wrong.
  (b) In 1970 a big oilfield was discovered in South — the poorer half. Most of the money appears to have ended up in private bank accounts abroad.
  (c) On survey questions like "do you trust your neighbours", "is hard work important", "how religious are you", North and South give basically the same answers.
  (d) In North every district office has kept a written, public register of who owns which piece of land, continuously since 1893. In the South nobody does. The reason it started in North: the district officer posted there in 1893 happened to be a man who liked filing things, trained two clerks, they trained two more, and the habit stuck. In the South the officer posted that year was transferred after three months.

  the kinds of things im hoping the question forces people into, if theyre any good (use your own if youve got better ones): whether "institutions" here means the rules on paper or the rules actually followed, and what would have to be true for "institutions did it" to be false rather than just definitional; the fact that (d) makes the institutional difference itself something that needs explaining and traces it back to a small fluke, so "the cause" might be a contingent chain instead of a factor; whether the causal claim is supposed to be "in general, elsewhere, in other cases" or just "here", and what one case can and cant establish; whether "why is North rich" and "why is North richer than South" and "what should we change" are even the same question; and how (b) messes with a simple resources story.

  i was also thinking of adding a part b where you imagine re-running history from 1891 a hundred times and asking what the pattern of outcomes would tell you — no idea if that helps or just confuses people, you decide.

  what i want back: the actual exam question (one question, part b if you think its worth it), a model answer of about 600-700 words, and a marking scheme with 4 or 5 must-hit points, how many marks each is worth (20 total), and one line each on the mistake people will actually make that loses them those marks. then a short note on what separates an A (17+) from a B (13-16) — a specific move the A answer has to make, not just "more detail" or "neater writing". and tell me if my case is broken in some way that lets a memorizer off the hook.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16-17 year old philosophy/econ club members. No prior reading, no internet/books during exam.
      *   **Task:** Create one essay question + model answer + marking scheme based on a provided case study (Meridia).
      *   **Goal:** Prevent the "Institutions = 14/20" cookie-cutter response. Force deeper reasoning about *what* institutions are, *why* they differ, and the limits of causal inference.
      *   **Constraints:** 45 minutes, 20 marks. Self-contained (no external citations).
      *   **Input Material:** The "Meridia" case study (split island, identical geography/culture/constitutions on paper, divergent outcomes, specific details on corruption, oil, trust, and land registries).
      *   **Desired Output:** Refined question (maybe Part B), Model Answer (600-700 words), Marking Scheme (4-5 points, 20 marks total), "Mistake" analysis for each point, A vs. B distinction, and a critique of the case study.

  2.  **Evaluate the Case Study (Meridia):**
      *   *Strengths:* It's a classic "natural experiment" setup (like North/South Korea or Nogales). It controls for geography (same island), culture (same families/language), and formal rules (same constitution). It isolates *informal* institutions vs. *formal* institutions.
      *   *Weaknesses:* It's a bit too clean. The "land registry" point (d) is the smoking gun for institutions, but it attributes the difference to a *personality fluke* (the clerk who liked filing). This is actually a strength for philosophy/econ because it introduces *contingency* vs. *determinism*.
      *   *Risk:* Students might still just say "Institutions matter because of point (d)."
      *   *Fix:* The question needs to explicitly ask them to grapple with the *definition* of institutions and the *origin* of the difference. The prompt needs to push them beyond "Institutions caused it" to "What kind of cause is this?"

  3.  **Drafting the Question:**
      *   *Core Task:* Explain the income gap.
      *   *Constraint:* Must use the provided text.
      *   *Twist:* Need to force them to address the "fluke" aspect and the difference between rules-on-paper vs. rules-in-practice.
      *   *Part B Idea:* The user suggested re-running history. This is good for testing probabilistic thinking vs. deterministic thinking. Let's include it but keep it tight so it fits 45 mins. Actually, for a 45-min essay, two parts might be rushed. Better to make it one complex prompt that *requires* that thinking. Let's stick to one substantial prompt but structure the marking to reward that depth. Or, keep Part B as a specific "counterfactual" requirement within the main question. Let's go with a two-part structure but ensure Part A is the heavy lifter and Part B forces the probabilistic thinking.
      *   *Refinement:* Let's make the question: "To what extent does the Meridia case support the claim that 'institutions determine wealth'?" This forces evaluation, not just assertion.
      *   *Wait, looking at the user's specific goals:* They want to test: formal vs. informal institutions, the origin of institutions (fluke vs. deep cause), and the limits of one case.
      *   *Decision:* I will refine the prompt to explicitly ask about the *nature* of the institutional difference and the *implications* of the 1893 fluke. I'll add a Part B about the "100 re-runs" because it directly tests the contingency vs. determinism distinction which is high-level philosophy/econ.

  4.  **Developing the Model Answer:**
      *   *Word Count:* 600-700 words.
      *   *Key Arguments:*
          1.  Distinguish formal (constitution) vs. informal/actual (corruption, registry).
          2.  Address the "Institutions" label: It's not just "having laws," it's enforcement/norms.
          3.  Address the Cause: The 1893 fluke suggests contingency, not deep structural inevitability.
          4.  Address the Oil (Resource Curse): Shows resources aren't sufficient without institutional constraints.
          5.  Address Generalizability: One case proves possibility, not universal law.
      *   *Tone:* Analytical, precise, no jargon without definition.

  5.  **Designing the Marking Scheme:**
      *   Total: 20 marks.
      *   Points needed: 4 distinct conceptual moves (5 marks each).
      *   *Point 1:* Formal vs. Effective Institutions (The Constitution vs. The Road Contract).
      *   *Point 2:* The Origin Story (Contingency/Fluke vs. Deep Determinants).
      *   *Point 3:* The Resource Trap (Oil in South didn't help due to lack of constraints).
      *   *Point 4:* Limits of Inference (One case doesn't prove a universal law).
      *   *Mistake Analysis:* For each point, identify the "lazy" answer.

  6.  **Defining A vs. B:**
      *   *B:* Identifies the institutional difference correctly.
      *   *A:* Recognizes that calling it "institutions" might be a tautology unless we explain *why* the institutions diverged (the fluke) and what that implies for policy (can we replicate a fluke?).

  7.  **Critiquing the Case:**
      *   Is it broken? No, it's actually quite robust (similar to Acemoglu/Robinson's Nogales example).
      *   Risk: Students might ignore the "fluke" and just say "North has better institutions."
      *   Mitigation: The marking scheme must penalize ignoring the *origin* of the difference.

  8.  **Review and Refine:**
      *   *Check Word Count:* Ensure the model answer isn't too long.
      *   *Check Difficulty:* Is "counterfactual history" too hard for 16-year-olds? It's philosophy club, so they should handle logic. I'll phrase it clearly.
      *   *Check Constraints:* No wifi/books. The text must provide all clues. (The text does provide the clues).
      *   *Check the "Institutions" Trap:* Does the question allow a student to just write "Institutions matter"? Yes, but the marking scheme will punish superficial treatment. I need to make sure the *question* hints that a simple answer is insufficient.
      *   *Adjustment:* I will tweak the question prompt to explicitly ask about the *explanatory power* of the term "institutions" given the 1893 fluke.

      *(Self-Correction during drafting)*: If I make the question too complex, they won't finish in 45 mins. I need to balance depth with breadth. I'll combine the "fluke" and "definition" into one marking point if needed, but 4 points is better for granularity. Let's keep the 4 points.
      *   Point 1: De jure vs De facto institutions.
      *   Point 2: The causal mechanism (enforcement/trust in systems vs. culture).
      *   Point 3: The role of chance (the 1893 clerk).
      *   Point 4: Generalizability/Resource curse nuance.

      *Wait, the user wants to know if the case is broken.* I need to be honest. The case is strong, *but* the "same constitution" bit is a bit unrealistic for 16-year-olds to parse as "formal rules don't matter." I need to ensure the model answer emphasizes that *formal* rules were identical, so *informal* enforcement is the key.

      *Part B Decision:* The user asked about the "100 re-runs." This is a great test of probabilistic thinking. I will include it as a specific sub-question because it forces them to confront whether the outcome was inevitable or lucky.

      *Final Plan:*
      1.  Refine the prompt text slightly for clarity.
      2.  Set the Question (Part A: Analysis, Part B: Counterfactual).
      3.  Write Model Answer.
      4.  Create Marking Scheme.
      5.  Define A vs B.
      6.  Critique the Case.

      *Let's write.*
answer: |-
  Here is the complete package: the refined exam question, the model answer, the marking scheme, and a critique of your case design.

  ### 1. The Exam Question

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Read the case study on Meridia carefully. Answer both parts.**

  **Part A (15 marks)**
  The text states that North and South Meridia have the "same laws about property, contracts and taxes on paper," yet North is four times richer. Using *only* the information provided in the text:
  1.  Explain precisely what differs between North and South if the written laws are identical.
  2.  Evaluate the claim that "Institutions caused the wealth gap." In your answer, discuss whether the origin of the difference (the 1893 district officers) makes "institutions" a deep explanation or a superficial label.

  **Part B (5 marks)**
  Imagine history could be re-run 100 times from 1891 with the same map error and the same two district officers. Based on the text, would you expect North to be richer than South in all 100 outcomes, most, or only some? Justify your answer using the concept of contingency versus inevitability.

  ***

  ### 2. Model Answer (Approx. 650 words)

  **Part A**
  The Meridia case presents a puzzle: identical geography, culture, and formal legal codes produce divergent economic outcomes. To explain this, we must distinguish between *de jure* institutions (rules on paper) and *de facto* institutions (rules in practice). The text states both nations share the same constitution and laws. Therefore, the written rules cannot be the cause of the income gap. The difference lies in enforcement and administrative habit. In the North, road contracts go to the lowest bidder; in the South, to relatives. In the North, land ownership is publicly registered; in the South, it is not. These are differences in *compliance* and *bureaucratic capacity*, not legislation.

  This supports the claim that "institutions caused the wealth gap," but only if we define institutions as actual enforcement mechanisms rather than legal texts. Point (a) shows that while 90% of people in both countries believe corruption is wrong, only the North has the administrative machinery to prevent it. This suggests culture (shared beliefs) is not the driver; rather, it is the specific incentive structures created by enforcement. If corruption is punished or made difficult in the North, actors behave differently despite having the same cultural values as the South.

  However, calling this an "institutional explanation" risks being superficial unless we address the origin of the difference. Point (d) reveals the land registry exists in the North simply because one district officer in 1893 "liked filing things" and trained clerks who continued the habit. In the South, the officer was transferred early. This implies the institutional divergence was not caused by deep factors like geography, long-term culture, or deliberate design, but by a contingent historical fluke.

  If the cause is a random personnel assignment, then "institutions" is a description of the *mechanism* of wealth, not the *ultimate cause*. The ultimate cause was chance. This matters for policy. If institutions are the result of deep cultural forces, changing them is hard. If they are the result of random administrative habits, they might be easier to replicate, but also easier to lose. Therefore, saying "institutions caused the gap" is true regarding the *proximate* cause (how wealth is generated today) but potentially misleading regarding the *root* cause (why the systems diverged). The text shows that small, random administrative decisions can lock into long-term economic paths (path dependence).

  Finally, Point (b) reinforces the institutional view over the resource view. South discovered oil but remained poor because the money went into private accounts abroad. Without the institutional constraints present in the North (like the land registry or bidding processes), natural resources do not generate public wealth. This isolates institutions as the variable that determines whether resources become capital or loot.

  **Part B**
  If history were re-run 100 times, we should expect North to be richer in only *some* outcomes, not all. The text attributes the administrative difference to a specific individual's personality ("liked filing things") and a specific personnel decision (transfer after three months). These are contingent events, not inevitable structural forces.

  In a deterministic model (e.g., geography or deep culture), the outcome would be the same in all 100 runs because the underlying conditions (soil, language, families) are identical. However, since the divergence stems from a "fluke," re-running history introduces variance. In some runs, the South officer might also like filing, or the North officer might be transferred. Therefore, the wealth gap is not an inevitable result of the map error itself, but of the random human actions that followed. This suggests the economic divergence is fragile and probabilistic, not a law of nature.

  ***

  ### 3. Marking Scheme (20 Marks Total)

  **Point 1: Distinction between Formal and Effective Rules (5 marks)**
  *   **Award:** Identifies that written laws were identical (constitutions/taxes) and pinpoints the difference to *enforcement/administrative habit* (bidding processes, land registries).
  *   **Common Mistake:** Claiming the North has "better laws" or ignoring the text's statement that constitutions were word-for-word identical. (Loss: 5 marks)

  **Point 2: Culture vs. Incentives (5 marks)**
  *   **Award:** Uses Point (a) or (c) to argue that culture/values are *not* the cause (since survey answers are the same), isolating the institutional enforcement as the variable.
  *   **Common Mistake:** Arguing North is richer because they "work harder" or "value honesty more," directly contradicting the provided survey data. (Loss: 5 marks)

  **Point 3: Contingency vs. Deep Determinants (5 marks)**
  *   **Award:** Recognizes the 1893 officer story implies the institutional difference is a *historical accident/fluke*, not an inevitable outcome of deep factors. Discusses "path dependence" or the risk of "institutions" being a label rather than a root cause.
  *   **Common Mistake:** Treating the North's institutions as if they were deliberately designed or culturally inevitable, ignoring the "liked filing things" detail. (Loss: 5 marks)

  **Point 4: Resource Curse & Generalizability (5 marks)**
  *   **Award:** Uses Point (b) (Oil) to show resources don't guarantee wealth without institutions, OR notes that one case (Meridia) proves possibility but not a universal law for all countries.
  *   **Common Mistake:** Arguing South is poor *because* it has oil (resource curse) without linking it to the lack of institutional constraints on where the money went. (Loss: 5 marks)

  **Part B Specific (Included in Point 3 logic, but scored separately for clarity)**
  *   **5 Marks:** Correctly identifies "Some/Most" (probabilistic) rather than "All" (deterministic) and justifies it using the randomness of the officer's personality/transfer.
  *   **Common Mistake:** Saying "All 100" because geography was the same, missing the point of the personnel fluke.

  ***

  ### 4. A vs. B Distinction

  *   **B Grade (13-16 marks):** The student correctly identifies that *enforcement* differs even if laws are the same. They use the oil and corruption facts to show institutions matter. They treat the case as proof that "Institutions = Wealth."
  *   **A Grade (17-20 marks):** The student interrogates the *word* "Institutions." They recognize that if the institutional difference started because of a random clerk, then "Institutions" is a **proximate cause**, not a **root cause**. They understand that the case proves institutions *can* cause wealth, but doesn't prove they *always* will (Part B logic). They spot the tension between "Institutions matter" and "Institutions are just luck."

  ***

  ### 5. Case Design Critique

  **Is the case broken?**
  No, it is actually very robust. It is a simplified version of the famous "Nogales" example (Acemoglu & Robinson) but stripped of the geographic/cultural differences to make it cleaner for a 45-minute exam.

  **Potential Loophole:**
  The only risk is a student arguing: *"The North officer liked filing because the North culture values order."*
  **Fix:** Your text explicitly says survey answers on "hard work" and "trust" are the same. I added "one language, one mix of farming" to the preamble to reinforce this. Ensure students know they cannot import outside assumptions about "Northern cultures."

  **Why Part B is worth keeping:**
  It stops the "Just-So Story" problem. Without Part B, a student can write a deterministic narrative ("North built strong institutions"). Part B forces them to admit the outcome was fragile. This separates the philosophers (who think about counterfactuals) from the memorizers (who think in laws).

  **One Tweak for Safety:**
  In the preamble, ensure you bold the phrase **"Assume these are all true"**. Students love to argue with the prompt ("But in real life, oil usually helps..."). Make it clear this is a closed logical universe.

  **Final Verdict:**
  This design forces them to define their terms. If they write "Institutions matter," they get 10 marks. To get 20, they have to explain *which* institutions, *why* they differed, and *how much* we can generalize from a fluke. That kills the cookie-cutter essay.
