          *   Condition: Only if System is Consistent.

      *   **Let's build the specific Rulebooks (Card Size):**
          *   *System A (Safe):*
              *   Start: `1`
              *   Rule 1: `n` $\to$ `n+1`
              *   Rule 2: `n` $\to$ `n+2`
              *   Target "False": `0` (Cannot be reached from 1 using +1, +2).
          *   *System B (Unsafe):*
              *   Start: `1`
              *   Rule 1: `n` $\to$ `n+1`
              *   Rule 2: `n` $\to$ `n-1` (Looks innocent, allows reaching 0).
              *   Target "False": `0`.
          *   *G-Sentence:* "0 is not derivable." (Wait, G needs to be about itself).
          *   *Okay, let's abstract the G-construction.* We don't have time for diagonalization. We will *stipulate* the G-sentence.
          *   *Stipulation:* "The Gödel Sentence $G$ for this system says: 'I am not derivable using these rules.'"
          *   *Question:* Is $G$ True?
          *   *Logic:* If System is Consistent $\to$ $G$ is Unprovable $\to$ $G$ is True. If System is Inconsistent $\to$ $G$ is Provable $\to$ $G$ is False.
          *   *The Game:* Half the room gets System A (Consistent). Half gets System B (Inconsistent). They don't know which they have. They must bet on the Truth of $G$.
          *   *The Kicker:* System B's inconsistency is hard to spot immediately (e.g., requires 5 steps). They will assume Consistency. They will bet "True". They will lose.
          *   *Debrief:* You assumed consistency. You couldn't prove it. You can't prove your own consistency either.

  4.  **Addressing the Math Major:**
      *   They will say "This isn't arithmetic, it's just strings."
      *   They will say "You can't just stipulate G."
      *   *Mitigation:* Give them a role. "Head Verifier." Their job is to check if the inconsistency in System B is valid. If they spoil it, they lose points (or gain "Meta-points" for finding the bug early, but the class still plays).
      *   *Better:* The Math Major is likely to be in the System B group. If they find the inconsistency quickly, they win the bet. But the *class* needs to feel the trap.
      *   *Strategy:* Make the inconsistency in System B require a specific combination of rules that isn't obvious until they try to derive specific strings.
      *   *Actually, the prompt asks to handle the Math Major short-circuiting.* I need a facilitator line to acknowledge their correctness without killing the lesson. "You're right, but check the other group's result."

  5.  **Addressing "Add as Axiom":**
      *   Students will say "If G is true, just add it."
      *   *Game Mechanic:* Allow this! "Upgrade Card." If they add G as an axiom, they get a new G' (G-prime).
      *   *Lesson:* You can always extend the system, but you never escape the shadow (new G' appears). This mirrors the iterative nature of incompleteness.

  6.  **Timeline (75 mins):**
      *   0-10: Setup & Rules (No names).
      *   10-25: Phase 1 (Grinding proofs, getting bored).
      *   25-35: Phase 2 (The G-Card & The Bet).
      *   35-50: Phase 3 (The Reveal & Scoring).
      *   50-65: Debrief (Connecting to Lucas/Penrose).
      *   65-75: Names & Reading.

  7.  **Refining the "Trap":**
      *   If I give half the room System B (Inconsistent), they might just feel cheated ("Your rules were broken").
      *   *Better Trap:* Both systems are Consistent *as presented*, but the *justification* for G being True requires a proof of consistency that they don't have.
      *   *Wait, the prompt specifically asks for a second machine that punishes confident "I can see it's true" answers.*
      *   So System B *must* be problematic.
      *   Let's make System B $\omega$-inconsistent or simply Inconsistent. Inconsistent is easier for a 75-min game.
      *   *System A:* `1` is axiom. Rule: `x` $\to$ `xx`. (Strings of 1s). `0` is never produced.
      *   *System B:* `1` is axiom. Rule: `x` $\to$ `xx`. Rule: `111` $\to$ `0`. (Hidden contradiction).
      *   If they grind proofs, Group B will eventually find `0`. If they bet early, they lose.
      *   *Constraint:* "Small enough to fit on one side of a card."
      *   *Constraint:* "Specific enough that a sophomore can apply it without asking me anything."
      *   *Idea:* Use a logic puzzle style.
      *   *System A:* "Knights only tell truth."
      *   *System B:* "Knights tell truth, but one Knight is actually a Knave disguised."
      *   *No, keep it formal.*
      *   *Rulebook A:*
          1. Start with `S`.
          2. If you have `X`, write `XX`.
          3. If you have `XX`, write `XXX`.
          (Generates lengths 1, 2, 3, 4, 6, 8, 9... never 5).
          G-Sentence: "String of length 5 is not derivable." (True).
      *   *Rulebook B:*
          1. Start with `S`.
          2. If you have `X`, write `XX`.
          3. If you have `XXX`, write `XXXXX`. (Allows generating length 5).
          (Looks similar, but generates 5).
          G-Sentence: "String of length 5 is not derivable." (False).
      *   *Problem:* This isn't self-reference.
      *   *Fix:* We *stipulate* the self-reference. "For the purpose of this game, treat the sentence 'String of length 5 is not derivable' AS the Gödel Sentence."
      *   *Why?* Because actual diagonalization is impossible in 75 mins. We are simulating the *epistemic status*, not the derivation.
      *   *Facilitator Note:* Must be explicit that we are *modeling* the structure, not doing the math.

  8.  **Scoring:**
      *   Participation points.
      *   Phase 1: 1 point per correct derivation check.
      *   Phase 2: Bet 5 points on Truth of G.
      *   Phase 3: If you added G as axiom, get new G'.

  9.  **Debrief Script:**
      *   Connect "Assuming Consistency" to "Assuming Mental Sanity."
      *   Lucas says: Mind sees Truth.
      *   Response: Mind sees Truth *conditional on Consistency*.
      *   2nd Theorem: You can't prove Consistency from inside.
      *   So you can't claim superiority over the machine unless you know the machine is consistent *and* you are consistent. But you can't know you are consistent.

  10. **Honesty about Limitations:**
      *   Toy system $\neq$ Arithmetic.
      *   G-sentence stipulated $\neq$ constructed.
      *   *The One Sentence:* "We haven't done the math of arithmetic today, we've done the logic of justification; the numbers don't matter, the confidence does."

  11. **Review against constraints:**
      *   No projector? Yes.
      *   Index cards? Yes.
      *   No names until end? Yes.
      *   Math major handling? Yes (Verifier role).
      *   "Add as axiom" handling? Yes (Upgrade Card).
      *   Timeline? 75 mins.

