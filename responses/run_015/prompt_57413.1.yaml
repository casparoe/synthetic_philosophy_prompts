answer: |-
  Here is the complete runnable lesson plan. It is designed to be self-contained, robust against the "Math Major" disruption, and focused entirely on the epistemic trap rather than the mathematical derivation.

  ### **Lesson Overview: The Consistency Trap**
  *   **Time:** 75 Minutes
  *   **Materials:** Whiteboard, Index Cards (Rulebooks, Sentence Cards, Betting Slips), Pens.
  *   **Goal:** Students experience the necessity of assuming consistency to assert truth, and the impossibility of verifying that assumption from within the system (or the mind).
  *   **Constraint:** No mention of Gödel, Lucas, Penrose, or "Incompleteness" until minute 65.

  ---

  ### **1. The Rulebooks (Print on Index Cards)**
  *Design Note: These fit on one side of a standard 3x5 card. Use two different colored cardstocks if possible (e.g., White for Machine A, Yellow for Machine B), but do not tell them the colors mean anything different.*

  **Machine $\alpha$ (The Safe System) – White Cards**
  > **SYMBOLS:** `X`, `Y`, `Z`
  > **AXIOM:** Start with one card: `X`
  > **RULE 1:** If you have `X`, you may write `XY`.
  > **RULE 2:** If you have `Y`, you may write `YX`.
  > **RULE 3:** If you have `u` and `v`, you may combine them `uv`.
  > **GOAL:** Determine if `Z` can ever be produced.
  > **NOTE:** `Z` represents "False."

  **Machine $\beta$ (The Trap System) – Yellow Cards**
  > **SYMBOLS:** `X`, `Y`, `Z`
  > **AXIOM:** Start with one card: `X`
  > **RULE 1:** If you have `X`, you may write `XY`.
  > **RULE 2:** If you have `Y`, you may write `YX`.
  > **RULE 3:** If you have `u` and `v`, you may combine them `uv`.
  > **RULE 4:** If you have `XYX`, you may write `Z`.
  > **GOAL:** Determine if `Z` can ever be produced.
  > **NOTE:** `Z` represents "False."

  *(Facilitator Note: Rule 4 on Machine $\beta$ is the inconsistency. `X` $\to$ `XY`. `XY` + `X` (from Axiom) $\to$ `XYX` $\to$ `Z`. It takes 3 steps. It is subtle enough that they won't spot it immediately during the "grind" phase.)*

  ---

  ### **2. The Sentence List & Answer Key**
  *Print these on separate slips. Hand out **Sentence Card G** at Minute 25.*

  **Sentence Card G (The Gödel Analog)**
  > **STATEMENT:** "The string `Z` is not derivable in this system."
  > **TASK:** Is this statement **TRUE** or **FALSE**?
  > **BET:** Wager 5 Participation Points.

  **Answer Key (For Facilitator Only)**
  *   **Machine $\alpha$:** `Z` is **NOT** derivable. Statement G is **TRUE**. (Students who bet TRUE win).
  *   **Machine $\beta$:** `Z` **IS** derivable (via Rule 4). Statement G is **FALSE**. (Students who bet TRUE lose).
  *   **Why:** In Machine $\beta$, the system produces "False" (`Z`). Therefore, the claim "False is not produced" is a lie.

  ---

  ### **3. Betting & Scoring Scheme**
  *   **Phase 1 (Grind):** 1 Point per valid derivation checked (max 5 pts).
  *   **Phase 2 (The Bet):** Wager 5 Points on whether Sentence G is True or False.
  *   **Phase 3 (The Upgrade):** If a group wants to "Add G as Axiom," they surrender 2 Points to buy **Sentence Card G-Prime**.
      *   **Sentence Card G-Prime:** "The string `Z` is not derivable, AND Sentence G is not derivable."
      *   *Logic:* This simulates extending the system. The incompleteness reappears.

  ---

  ### **4. Minute-by-Minute Timeline**

  | Time | Activity | Facilitator Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide room into 6 groups of 3. Distribute Rulebooks randomly (3 groups get $\alpha$, 3 groups get $\beta$). Do not explain the difference. |
  | **05-20** | **Phase 1: The Grind** | Groups mechanically apply rules to generate strings. They must log 5 derivations on the whiteboard. *Goal: Boredom + Familiarity.* |
  | **20-25** | **The Math Major Check** | Assign the Math Major as "Head Auditor." Their job: Verify Group $\beta$'s derivations. *If they spot Rule 4 early, tell them: "Log it, don't announce it. Your grade depends on their bet."* |
  | **25-35** | **Phase 2: The Bet** | Hand out **Sentence Card G**. Ask: "Based on your work, is this statement True or False?" Groups discuss. They write their answer and wager 5 points on a slip. |
  | **35-45** | **Phase 3: The Upgrade** | Allow groups to buy **Sentence Card G-Prime** (2 pts). Most will refuse. Collect bets. |
  | **45-55** | **The Reveal** | Reveal the Rulebook difference (Rule 4). Score the bets. Group $\alpha$ wins. Group $\beta$ loses. |
  | **55-65** | **The Pivot** | Facilitate the "Consistency" realization (Script below). |
  | **65-75** | **Debrief & Names** | Connect to Gödel/Lucas/Penrose. Assign reading. |

  ---

  ### **5. Facilitator Script: The Pivot (Minute 55)**
  *This is the critical moment. Do not lecture. Ask these questions in order. Wait for answers.*

  **Facilitator:** "Look at the groups that lost points. You bet that Sentence G was True. Why?"
  **Students:** "Because we checked the rules. It looked consistent."
  **Facilitator:** "Did you *prove* the rules were consistent? Or did you just *assume* they were?"
  **Students:** "We assumed."
  **Facilitator:** "Exactly. To know G is True, you had to know Machine $\beta$ was consistent. You couldn't know that from the inside. You looked at the rules and they *seemed* fine."
  **Facilitator:** "Now, turn that on yourselves. The Lucas argument says: 'A machine can't prove G, but I can see G is True, so I'm not a machine.'"
  **Facilitator:** "But today, you only 'saw' G was True because you assumed the machine was sane. If the machine was crazy (inconsistent), your 'seeing' was wrong."
  **Facilitator:** "So the real question isn't 'Can I see the truth?' It's 'Can I prove *I* am consistent?' If you are a formal system, can you prove you aren't Machine $\beta$?"
  **Facilitator:** "Gödel's Second Theorem says: No system can prove its own consistency. So if you claim you're better than the machine because you 'see' the truth, you're claiming you have a magic power the machine doesn't: the power to know your own mind is sane without proof."

  ---

  ### **6. Debrief: Mapping Game to Theorem (Minute 65)**
  *Write these three columns on the whiteboard.*

  | Game Moment | The Mathematical Reality | The Philosophical Trap |
  | :--- | :--- | :--- |
  | **Betting G is True** | Asserting $Con(S) \to G$. | Lucas/Penrose claim we "see" $G$ is true unconditionally. |
  | **Losing on Machine $\beta$** | If $\neg Con(S)$, then $G$ is False (provable). | We cannot rule out that our own minds are "Machine $\beta$". |
  | **Buying G-Prime** | $S + G$ has a new Gödel sentence $G'$. | You can't fix the gap by adding axioms; the shadow moves with you. |

  **The "Names" Drop:**
  "Now we can say the names. This was Gödel's First Incompleteness Theorem (Phase 2) and Second Incompleteness Theorem (The Pivot). The argument you came in with is the **Lucas-Penrose Argument**. It relies on the idea that human intuition grants access to truth without consistency proofs. Today you saw why that intuition is vulnerable."

  ---

  ### **7. Troubleshooting: What Will Go Wrong**

  **1. The Math Major Short-Circuit**
  *   **Prediction:** At minute 15, the Math Major will raise their hand and say, "Machine $\beta$ derives Z in three steps. This is trivial."
  *   **Fix:** You anticipated this. You made them the "Head Auditor."
  *   **Script:** "Excellent. You have verified the inconsistency. Your task now is to watch the other groups. Do not tell them. If you spoil the bet, you forfeit your participation points. Your grade depends on their epistemic humility, not your calculation speed."
  *   **Why it works:** It gives them status and a secret, channeling their confidence into the experiment rather than against it.

  **2. The "Just Add It As Axiom" Move**
  *   **Prediction:** A group loses the bet and says, "Fine, we just add 'Z is not derivable' as a new Rule 5. Now we win."
  *   **Fix:** This is a *legal move* in the game. Hand them the **G-Prime Card**.
  *   **Script:** "Legal move. You've extended the system. Now evaluate G-Prime. Is *that* true?"
  *   **Outcome:** They realize G-Prime creates a *new* unprovable sentence. They cannot close the system.
  *   **Lesson:** Incompleteness is not a bug you patch; it's a horizon that recedes.

  **3. "This isn't Real Arithmetic"**
  *   **Prediction:** Students dismiss the toy system as irrelevant to "real minds."
  *   **Fix:** The One Sentence (see below).

  ---

  ### **8. Honesty About Limitations**
  *Be explicit about what the toy system fails to capture. Do not hide this.*

  1.  **The Gap:** The toy system uses stipulated self-reference ("Treat this sentence as G"). Real Gödel sentences are earned through arithmetic coding (Gödel numbering).
  2.  **The Gap:** The toy system is propositional/string-based. Real minds (if mechanistic) would likely be Turing-complete, not string-rewriting.
  3.  **The Gap:** We simulated inconsistency with a hidden rule. Real mental inconsistency (contradictory beliefs) is much harder to detect.

  **The One Sentence to Paper Over the Gaps:**
  > "We haven't done the math of arithmetic today, we've done the logic of justification; the numbers don't matter, the confidence does."

  ---

  ### **9. Final Facilitator Checklist**
  *   [ ] Print Rulebooks (3 sets $\alpha$, 3 sets $\beta$).
  *   [ ] Print Sentence Cards (G and G-Prime).
  *   [ ] Prepare Betting Slips.
  *   [ ] Brief the Math Major privately at Minute 20.
  *   [ ] Keep the whiteboard clean until the Debrief.
  *   [ ] **Do not** write "Gödel" on the board until Minute 65.

  This plan forces the students to inhabit the position of the "Mind" evaluating the "Machine," only to discover that their evaluation rests on an unprovable assumption about their own vantage point. It turns the Lucas argument from a triumph of human specialness into a vulnerability of human self-knowledge.
