answer: |-
  # The Structural Integrity Protocol (SIP)
  **For the Design Integrity Panel**

  ## Part 1: Conceptual Grounding & Simplification Strategy

  As a philosopher of mind working in classification disputes, I recognize your problem immediately. You are suffering from **unbounded similarity**. When you ask "Is this game a copy?", you are asking a question that has no truth value until you define the *space of comparison* and the *level of abstraction*. Human intuition treats similarity as a property of objects; cognitive science tells us similarity is a property of *mappings* between objects within a *context*.

  To make this runnable in 90 minutes by designers, we must strip the theory of its computational weight while keeping its logical skeleton. Here is what survives simplification and what must be dropped:

  1.  **Fix the Microdomain (Survives):** We cannot map the whole "game space." We must define the *local neighborhood*.
      *   *Simplification:* We do not do market research. We use the Panel's collective memory to define the "Genre-Era." If we deadlock, we default to the broader genre but lower our confidence score.
  2.  **Forced vs. Free Choices (Survives):** This is the core filter.
      *   *Simplification:* We replace "constraint satisfaction analysis" with the "Could-They-Have-Done-Otherwise?" test. If a feature is standard for the Genre-Era, it is "Forced by Convention."
  3.  **Slippage (Survives):** Literal identity is rare; structural identity is the signal.
      *   *Simplification:* We use a "Function Swap" worksheet. Does Component A in Game 1 play the exact same logical role as Component B in Game 2?
  4.  **Distinctiveness (Survives):** Similarity without rarity is noise.
      *   *Simplification:* We use a 3-point scale (Common, Uncommon, Unique) based on Panel consensus, not data.
  5.  **Abstraction Level (Survives):** Verdicts must be robust across zoom levels.
      *   *Simplification:* We run the test twice: once at "Component Level" (dice, cards) and once at "Goal Level" (win condition, tension).

  **What is Dropped:**
  *   **Computational Modeling:** We cannot generate alternative game strings like the letter-string domain. We rely on heuristic estimation.
  *   **Intent:** We do not judge *mens rea* (did they mean to copy?). We judge *structural dependency* (does this game rely on that game's architecture?).
  *   **Legal Standards:** No "substantial similarity," no "idea/expression." We are judging *Design Integrity*, not property rights.

  ***

  ## Part 2: The 90-Minute Structural Integrity Protocol

  **Materials:** Whiteboard, Timer, SIP Worksheet (provided below).
  **Participants:** 3 Designers, 1 Lay Member (Facilitator).

  ### Phase 1: Fix the Microdomain (15 Minutes)
  *Goal: Agree on the "Genre-Era" comparison class.*

  1.  **Define the Accused Game's Neighborhood:** Write down the Genre (e.g., "Worker Placement Euro") and the Era (e.g., "2020-2024").
  2.  **The Convention Check:** List 5 games that a competent designer in this neighborhood would definitely know.
  3.  **Deadlock Rule:** If the Panel cannot agree on the Neighborhood within 10 minutes, default to the *broader* category (e.g., "Strategy Board Games 2015-2024") and mark the **Confidence Penalty** on the final verdict.
      *   *Why:* A broader domain makes distinctiveness harder to prove, protecting the accused.

  ### Phase 2: Feature Extraction & Sorting (20 Minutes)
  *Goal: Separate signal from noise.*

  1.  **List Matches:** The Complainant lists up to 5 specific features they believe were copied (e.g., "round track," "card drafting phase," "resource conversion ratio").
  2.  **The Forced/Free Test:** For each feature, ask: *"Could a designer in this Genre-Era have made a different choice here without breaking the game or ignoring a standard convention?"*
      *   **Forced by Physics/Rules:** (e.g., "cards must be drawn from a deck"). -> **Discard.**
      *   **Forced by Convention:** (e.g., "deck-builders start with 10 cards"). -> **Discard.**
      *   **Free Choice:** (e.g., "specifically 7 victory points to win," "red cubes represent oil"). -> **Keep.**
  3.  **Result:** You should have 1 to 3 "Free Choice Matches." If you have 0, stop. **Finding: No Copy.**

  ### Phase 3: Slippage Mapping (25 Minutes)
  *Goal: Detect structural copying despite surface changes.*

  1.  **Select the strongest remaining Free Choice Match.**
  2.  **Run the Function Swap:**
      *   Game A (Complainant): Uses [Component X] to achieve [Function Y] at [Timing Z].
      *   Game B (Accused): Uses [Component Q] to achieve [Function Y] at [Timing Z].
      *   *Question:* If you swap Q for X, does the game logic break or remain identical?
  3.  **Identify Slippage:**
      *   **Literal:** Same component, same function. (High Copy Signal)
      *   **Slippage:** Different component, same function/structure. (High Copy Signal)
      *   **Divergent:** Different component, different function. (No Copy Signal)
  4.  **Record:** Mark each match as **Literal**, **Slippage**, or **Divergent**.

  ### Phase 4: Distinctiveness & Abstraction Check (20 Minutes)
  *Goal: Ensure the match isn't a coincidence.*

  1.  **The Counterfactual Estimate:** For the matched features, ask: *"In our Microdomain (Phase 1), how many other games share this specific Free Choice/Slippage?"*
      *   **Common (3+ games):** Coincidence. **Discard.**
      *   **Uncommon (1-2 games):** Suspicious. **Keep.**
      *   **Unique (0 other games):** Strong Evidence. **Keep.**
  2.  **The Abstraction Flip:**
      *   Run the verdict at **Component Level** (e.g., "Dice vs Cards").
      *   Run the verdict at **Goal Level** (e.g., "Engine Building vs Area Control").
      *   *Rule:* If the verdict is "Copy" at one level but "No Copy" at the other, you must **Decline to Find**. (This indicates the similarity is either too superficial or too abstract to sanction).

  ### Phase 5: Verdict & Write-Up (10 Minutes)
  *Goal: Issue the finding.*

  1.  **Calculate:**
      *   0 Strong Matches = **No Violation.**
      *   1 Strong Match + Access Proven = **Credit Required.**
      *   2+ Strong Matches + Access Proven = **Showcase Removal.**
  2.  **Draft the Finding:** Use the standard template (see Cases below).
  3.  **Sign-off:** All panelists sign. Dissenting opinions are not recorded in the public finding but logged internally.

  ***

  ## Part 3: Application to Cases

  ### Case 1: The 2023 Card/Dice Skeleton
  *Complaint: 2023 game copies 2018 card game rule skeleton, swaps dice for cards.*

  *   **Phase 1 (Domain):** "Medium-weight Strategy Games 2018-2023." Agreement reached easily.
  *   **Phase 2 (Features):**
      *   *Match:* Turn structure order. *Test:* Free Choice (could have been simultaneous). **Keep.**
      *   *Match:* Resource conversion ratio (3:1). *Test:* Free Choice (balance tweak). **Keep.**
      *   *Match:* Dice substituted for Cards. *Test:* Slippage. **Keep.**
  *   **Phase 3 (Slippage):**
      *   Complainant: Draw Card -> Gain Resource.
      *   Accused: Roll Die -> Gain Resource.
      *   *Function Swap:* The probability distribution is different, but the *logical flow* (Random Input -> Resource -> Action) is identical. This is **Slippage**.
  *   **Phase 4 (Distinctiveness):**
      *   Is this specific skeleton common? Panel recalls no other game with this exact sequence. **Unique.**
      *   Abstraction Check: Matches at Component Level (flow) and Goal Level (engine building). **Robust.**
  *   **Phase 5 (Verdict):** 2 Strong Matches (Skeleton + Slippage). Access is obvious (2018 game was popular).
  *   **Finding:** **Violation.** The structural skeleton is a Free Choice combination that is Unique. The dice/card swap is a classic Slippage that preserves the design logic.
  *   **Sanction:** Requirement to credit the 2018 designer on the box and rulebook as "System Design inspired by [Game]."

  ### Case 2: The Twin Deck-Builders
  *Complaint: Two deck-builders released 4 months apart share genre definitions.*

  *   **Phase 1 (Domain):** "Deck-Building Games 2023."
  *   **Phase 2 (Features):**
      *   *Match:* Start with 10 cards. *Test:* Forced by Convention. **Discard.**
      *   *Match:* Victory Points in deck end game. *Test:* Forced by Convention. **Discard.**
      *   *Match:* Market row of 5 cards. *Test:* Common Convention. **Discard.**
  *   **Phase 3 (Slippage):** No remaining features to map.
  *   **Phase 4 (Distinctiveness):** N/A.
  *   **Phase 5 (Verdict):** 0 Strong Matches.
  *   **Finding:** **No Violation.** The similarities are Forced by Convention within the Microdomain. This is convergent evolution, not copying.
  *   **Sanction:** None.

  ### Case 3: The 1980s Prior Art (The Uncomfortable Case)
  *Complaint: Small Studio vs. Large Publisher. Large Pub clearly studied Small Studio's game. But the "signature mechanic" is a slippage copy of a 1980s Abstract Game.*

  *   **Phase 1 (Domain):** "Strategy Games 1980-2024." (Expanded due to discovery of 1980s game).
  *   **Phase 2 (Features):**
      *   *Match:* The "Signature Mechanic" (e.g., a specific movement-capture loop).
      *   *Test:* Was it Free Choice for the Small Studio? Yes.
      *   *Test:* Was it Free Choice for the Large Pub? Yes.
  *   **Phase 3 (Slippage):**
      *   Small Studio vs. Large Pub: **Slippage Match.** (Large Pub copied Small Studio).
      *   Small Studio vs. 1980s Game: **Slippage Match.** (Small Studio copied 1980s Game, likely unconsciously).
  *   **Phase 4 (Distinctiveness):**
      *   *Counterfactual:* Is this mechanic unique to the Small Studio? **No.** It exists in the 1980s game.
      *   *Distinctiveness Score:* **Common** (within the historical domain).
  *   **Phase 5 (Verdict):** The procedure requires Distinctiveness *to the Complainant*. Since the Complainant does not hold the Design Integrity of this mechanic (it is prior art), they cannot claim it was stolen *from them* in a way that violates integrity standards.
  *   **Finding:** **No Violation.**
  *   **Sanction:** None.
  *   **Note:** This is the "answer you will not like." The Large Publisher acted unethically by studying the Small Studio, but they did not violate *Design Integrity* because the design did not originate with the Small Studio. The Panel cannot sanction for copying public domain ideas, even if the path was indirect.

  ***

  ## Part 4: Honest Limits & Breaking Points

  This procedure is a tool, not a truth machine. It will misfire in the following scenarios:

  1.  **The "Vibe" Case:** If the copying is purely aesthetic, emotional, or thematic (e.g., the "feel" of a horror game) without structural mechanical overlap, SIP will return **No Violation**. Structural mapping cannot capture atmosphere. *Action:* Decline to hear these complaints.
  2.  **The "Novel Genre" Case:** If the Complainant invented a new genre (e.g., the first Deck-Builder), Phase 1 (Microdomain) breaks because there are no conventions to filter against. Everything looks "Free Choice." *Action:* In cases of claimed genre invention, the Distinctiveness threshold is lowered, but the Panel must admit high uncertainty.
  3.  **The "Values" Trap:** SIP tests *structure*, not *ethics*. As seen in Case 3, a Respondent can be morally culpable (studying a competitor) but procedurally innocent (using public domain mechanics). If the Panel wishes to sanction based on *behavior* rather than *design*, SIP is the wrong tool. *Action:* Do not use SIP for conduct hearings.
  4.  **The "Access" Blindspot:** SIP assumes access. If the Accused game was in development before the Complainant was released, SIP might still find a structural match. *Action:* Verify development timelines before running Phase 2. If timelines preclude access, stop immediately.
  5.  **When to Decline:** If Phase 1 (Microdomain) results in a Deadlock that cannot be resolved by the Default Rule, or if Phase 4 (Abstraction) results in a Flip (Copy at one level, No Copy at another), the Panel must issue a **No Finding**. It is better to release no verdict than a contradictory one.

  ***

  ## Appendix: The Theory (For Panel Context Only)

  *Do not use this language in findings. This is for your understanding of why the steps exist.*

  **1. The Microdomain (Hofstadter & Fluid Analogies):**
  In cognitive science, analogy-making (e.g., "abc -> abd, therefore ijjkk -> ?") depends entirely on the "conceptual neighborhood." In a vacuum, any answer is defensible. In a constrained domain (letter strings), some answers are "more right" because they preserve the *role* of the elements rather than the surface description. We fix the Microdomain to prevent Panelists from unconsciously shifting the comparison class to suit their intuition.

  **2. Forced vs. Free (Constraint Satisfaction):**
  Design is a series of constraints. Some are physical (cards have two sides), some are conventional (deck-builders have a market). Copying a forced constraint is not copying; it is obeying reality. We only sanction copying of *Free Choices*, where the designer exercised taste. This aligns with the philosophical notion of *authorship*: you only own what you chose, not what was necessitated.

  **3. Slippage (Structural Mapping):**
  Gentner's Structure-Mapping Theory dictates that analogy is the alignment of relational systems, not attributes. A die is not a card. But if a die *functions* as a random hand generator in the causal network of the rules, it is a slippage copy. Our "Function Swap" test operationalizes this: if the system breaks when you swap them, they weren't analogous. If it runs the same, they were.

  **4. Distinctiveness (Bayesian Inference):**
  Similarity is evidence of copying only if the prior probability of coincidence is low. If 50 games have red cubes, red cubes are not evidence. If 1 game has red cubes, it is evidence. We use coarse estimation because we lack the data for true Bayesian updating, but the logic remains: Rarity creates signal.

  **5. Abstraction Level (Granularity):**
  Verdicts should not depend on how you describe the game. If it looks like a copy when you talk about "components" but not when you talk about "goals," the similarity is likely an artifact of description, not design. Robustness across levels is a proxy for truth.
