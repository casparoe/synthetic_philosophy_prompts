answer: |-
  **Specification for Decision-Theoretic Anthropics**

  **Purpose:** Provide credences robust enough for high-stakes betting on humanity's longevity (x-risk). The theory must not collapse under cosmological scale or reference class manipulation.

  **Requirements**

  1.  **Betting Coherence:** Credences must equal acceptable betting odds.
      *   *Motivation:* Sleeping Beauty. If the theory yields a credence you wouldn't bet on, it fails the decision-theoretic purpose.
      *   *Status:* **Non-negotiable.**
  2.  **Diachronic Stability:** Merely learning your birth rank shouldn't force a probability update about total population size without new physical evidence.
      *   *Motivation:* Doomsday Argument. If adopting the theory forces you to expect abandoning it after the next birth, it is defective.
      *   *Status:* **Non-negotiable.**
  3.  **Anti-Presumptuousness:** The theory must not assign near-certainty to hypotheses solely because they contain more observers.
      *   *Motivation:* Presumptuous Philosopher. Getting an *a priori* boost for big universes is a reductio, not a feature, for x-risk calculation.
      *   *Status:* **Non-negotiable.**
  4.  **Boltzmann Brain (BB) Avoidance:** Must not conclude you are likely a BB given standard cosmology, without stipulating them out of the reference class.
      *   *Motivation:* Empirical coherence. Subjective evidence distinguishes you from BBs; the theory must respect this.
      *   *Status:* **Non-negotiable.**
  5.  **Boundary Robustness:** Tiny changes in reference class definition (e.g., including chimpanzees) shouldn't produce huge swings in credence.
      *   *Motivation:* Vague predicates. If probabilities crash on semantic precision, the theory is unusable.
      *   *Status:* **Non-negotiable.** (Your intuition is correct; this is a real desideratum.)
  6.  **Measure Independence:** Probabilities shouldn't depend on the limiting procedure in infinite universes.
      *   *Motivation:* Regularization.
      *   *Status:* **Impossible.** (Adjudication: This is mathematically impossible. Infinite sets require measures. Mark this as a failure of the universe, not the theory.)

  **Missing Item:** **Empirical Calibration.** The theory must recover standard scientific inferences (e.g., Copernican principle) in non-anthropic contexts.

  **Incompatibilities**
  You cannot satisfy **Diachronic Stability**, **Anti-Presumptuousness**, and **BB Avoidance** simultaneously in infinite cosmologies.
  *   **SSA** satisfies Stability and Anti-PP but fails BB Avoidance (and Betting Coherence in some formulations).
  *   **SIA** satisfies Stability and BB Avoidance (sometimes) but fails Anti-PP catastrophically.
  *   **BB Avoidance** generally requires physical constraints no epistemic theory can supply alone.

  **The Killer Requirement:** **Anti-Presumptuousness.**
  This knocks out SIA and FNC. For x-risk, SIA is dangerous: it inflates the probability of worlds where humanity survives simply because they contain more observers, distorting expected value calculations. It tells you the universe is huge *a priori*, which undermines the urgency of extinction risk.

  **Theory Scoring**

  | Requirement | SSA | SIA | FNC | Centered Cond. |
  | :--- | :--- | :--- | :--- | :--- |
  | **Betting Coherence** | Fail (Halfer) | Pass (Thirder) | Pass | Pass |
  | **Diachronic Stability** | Pass | Pass | Pass | Fail |
  | **Anti-Presumptuousness** | Pass | Fail | Fail | Pass |
  | **BB Avoidance** | Partial | Fail | Fail | Partial |
  | **Boundary Robustness** | Fail | Fail | Partial | Pass |
  | **Measure Independence** | Fail | Fail | Fail | Fail |

  **Notes:**
  *   **SSA:** Safe for x-risk but implies Doomsday (violates Stability intuition for some) and struggles with BBs.
  *   **SIA:** Avoids Doomsday but accepts Presumptuous Philosopher (fatal for spec).
  *   **FNC:** Attempts compromise but inherits SIA's PP problem in large worlds.
  *   **Centered Cond.:** ("Nothing special") Often collapses to SSA or SIA depending on implementation; fails Stability if it ignores indexical information.
  *   **Measure Independence:** All fail because the desideratum is impossible.

  **Conclusion:** No theory meets all non-negotiables. For your specific purpose (x-risk betting), **SSA** is the least dangerous despite the Doomsday implication, because SIA's Presumptuousness artificially inflates the value of the long future, gerrymandering the conclusion you want by epistemic fiat.
