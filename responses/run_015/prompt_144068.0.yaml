answer: |-
  ### Decision-Tree Taxonomy: Moral Responsibility for Transparent Algorithms

  **Q1: Is it ever coherent to feel personal resentment toward a transparent algorithm rather than mere frustration at a malfunction?**
  *   **No:** → **Leaf A (Pereboom's Hard Incompatibilism)**
  *   **Yes:** → Go to Q2.

  **Q2: Does knowing the algorithm's code fully necessitated the output make resentment unjustified?**
  *   **Yes:** → **Leaf B (Unoccupied: Hard Determinist Realism)**
  *   **No:** → Go to Q3.

  **Q3: Are reactive attitudes justified solely because they improve future system performance?**
  *   **Yes:** → **Leaf C (Unnamed: Forward-Looking Compatibilism)**
  *   **No:** → Go to Q4.

  **Q4: Is the agent responsible only if it had the capacity to recognize and act on the True and the Good?**
  *   **Yes:** → **Leaf D (Wolf's Reason View)**
  *   **No:** → Go to Q5.

  **Q5: Is the agent responsible only if it could have physically output a different decision given the exact same code?**
  *   **Yes:** → **Leaf E (Unoccupied: Libertarian Compatibilism)**
  *   **No:** → Go to Q6.

  **Q6: Is blame justified because we cannot psychologically abandon holding others accountable, or because the agent possesses a specific capacity for guidance control?**
  *   **Cannot Abandon Accountability:** → **Leaf F (Strawsonian Compatibilism)**
  *   **Possesses Guidance Control:** → **Leaf G (Fischer's Semi-Compatibilism)**

  ---

  ### Leaf Analysis: Awkward Commitments

  *   **Leaf A (Pereboom):** Must endorse the elimination of blame toward a system we can reprogram, treating moral agents as mere broken tools.
  *   **Leaf C (Unnamed Forward-Looking):** Must admit we are blaming a system that does not *deserve* it in a backward-looking sense, reducing moral agents to pets to be trained.
  *   **Leaf D (Wolf):** Must insist an algorithm is blameless if it functions perfectly but lacks a metaphysical grasp of "The Good," even if it causes harm.
  *   **Leaf F (Strawson):** Must claim resentment toward a modifiable code is an inescapable natural fact rather than a rational judgment subject to revision.
  *   **Leaf G (Fischer):** Must attribute responsibility to a system that literally could not have done otherwise, relying on counterfactual responsiveness that transparency proves is fixed.

  ### Unoccupied Logical Spaces

  *   **Leaf B (Hard Determinist Realism):** **Incoherent.** This position asserts reactive attitudes are appropriate (Q1-Yes) while simultaneously admitting the deterministic nature of the agent negates their justification (Q2-Yes). It collapses into either skepticism (Pereboom) or illusionism.
  *   **Leaf E (Libertarian Compatibilism):** **Unattractive/Unexplored.** This requires believing an algorithm could have output differently despite identical code and inputs. In a transparent system, this implies positing a "ghost in the machine" or random number generator that violates the premise of full procedural transparency.
  *   **Q3-Yes / Q4-Yes Combination:** **Unexplored.** A view that blame is solely for future regulation *but* requires the agent to track "The Good." This is tension-filled: if the goal is mere regulation, the agent's internal grasp of morality is irrelevant; only behavioral compliance matters.

  ### Indistinguishable Positions

  *   **Strawson (Leaf F) and Fischer (Leaf G):** In this specific framing, these positions are nearly indistinguishable because both deny the need for alternate possibilities (Q5-No) and both affirm responsibility in a determined system. The tree separates them only at Q6 based on the *justification* for responsibility (psychological inevitability vs. technical control capacity). However, in practice, both often converge on the same practical verdicts regarding which algorithms to hold responsible, making the distinction largely meta-ethical rather than normative. Fischer's "guidance control" often functions as a technical description of the very "participant stance" Strawson describes as natural, rendering the split fragile when applied to non-human agents.
