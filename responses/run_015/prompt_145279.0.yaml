  On the deeper wound you inflict—the trustworthiness of our own faculties—I concede the gravity of the doubt. I have written it myself, that the conviction of a dog may be as strong as a man's, yet worthless. But here lies the distinction between this machine and the naturalist. The machine gives an answer and a false reason, and it cannot be shamed into correction except by another nudge. Our minds, though fitted for survival and prone to error, possess the capacity to check their inferences against the external world, slowly and collectively. We do not rely on the instinctive flash, which I grant you may be merely serviceable, but on the chain of evidence which others may test. If the machine is a creature fitted to one country, we are creatures who can map the borders of that country and know when we have crossed them. The doubt is real, but it is the very awareness of it that saves us from the machine's fate.

