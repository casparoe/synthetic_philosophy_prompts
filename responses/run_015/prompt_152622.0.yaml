answer: |-
  **Philosophy of Social Science – Final Examination**
  **Time Allowed: 90 Minutes**

  **Question 1**
  Consider an open-source software (OSS) ecosystem where no single contributor understands the full architecture. Despite this, emergent properties—specifically, security vulnerability profiles—appear to constrain and redirect individual contribution patterns in ways that cannot be reconstructed from any agent's beliefs or intentions alone.

  Write an essay determining whether this scenario supports ontological holism, explanatory individualism with emergent patterns, or an intermediate position. In your analysis, you must explicitly address:
  (i) The distinction between explanatory and ontological individualism;
  (ii) Whether "downward causation" is genuinely at work or merely an epistemic artifact of aggregation;
  (iii) Why methodological individualism does not entail reductionism about social laws.

  ***

  **Model Answer**

  This scenario best supports a position of explanatory individualism compatible with weak ontological emergence. While the security profiles exhibit causal powers irreducible to individual intentions, the explanatory account remains grounded in individual interactions. This distinction is crucial for avoiding the reviewer's accusation of "smuggling holism" while acknowledging the reality of structural constraints.

  First, one must rigorously distinguish ontological from explanatory individualism. Ontological individualism asserts that only individuals exist; social entities are mere *façons de parler* with no independent reality. Explanatory individualism (or methodological individualism) claims that social phenomena must be explained by reference to individuals and their interactions, regardless of the ontological status of the collectivity. One can reject ontological individualism—accepting that social structures exist as real entities distinct from any single mind—while maintaining explanatory individualism. In the OSS case, the codebase exists ontologically beyond any single contributor, but explaining its evolution requires tracing individual commits, reviews, and decisions. Conflating these leads to the error of assuming that acknowledging structural reality requires holist explanation.

  Second, regarding downward causation, the security profile constrains contributors. Is this real causation or an epistemic artifact? If the constraint were merely an observer's summary of past actions, it would be epistemic. However, if the architecture physically prevents certain commits (e.g., compilation errors due to dependency conflicts generated by the aggregate code), the structure exerts causal power over individuals. This is genuine downward causation: the macro-property (security profile) restricts micro-actions. However, this does not violate explanatory individualism if the macro-property is constituted by prior micro-actions. It is not mystical holism; it is structural constraint emerging from interaction rules. The constraint is real, but it operates through the interface presented to the individual developer.

  Third, methodological individualism does not entail reductionism about social laws. Reductionism suggests social laws can be replaced by psychological or physical laws without loss of explanatory power. Methodological individualism only requires that social mechanisms be micro-founded. Autonomous social laws can exist as stable regularities at the macro level. In the OSS ecosystem, a "law" might state that "increased modularity reduces vulnerability density." This law is autonomous and useful, even if its mechanism relies on individual coding behaviors. We need not reduce this law to psychology to satisfy methodological individualism; we only need to show how individual actions sustain the regularity. Social laws can be irreducible yet micro-founded.

  Therefore, the OSS case demonstrates that social structures can have real causal powers (ontological emergence) without requiring holist explanations that bypass individuals. The constraint is real, but the explanation remains grounded in the interactions that constitute the system. This avoids the error of treating structures as mystical entities while acknowledging their irreducibility to single-agent intentions. The reviewer's concern is valid only if the interaction rules presuppose the outcome, but genuine emergence allows for constraints that are real without being ontologically primitive.

  ***

  **Marking Scheme**

  | Point | Criteria | Marks | Typical Miss / Note |
  | :--- | :--- | :--- | :--- |
  | **1** | **Distinction (i):** Clearly defines ontological individualism (existence) vs. explanatory individualism (accounting strategy) and shows they are logically separable. | 4 | Candidates often treat them as a single package deal rather than distinct commitments. |
  | **2** | **Case Classification:** Correctly identifies the OSS case as compatible with explanatory individualism despite ontological emergence (intermediate position). | 4 | Students frequently default to pure holism because "no one understands the whole." |
  | **3** | **Downward Causation (ii):** Argues causation is real (structural constraint) but mediated through individual interfaces, not an epistemic artifact. | 4 | Candidates often dismiss downward causation as merely metaphorical or observational. |
  | **4** | **MI vs. Reductionism (iii):** Explains that micro-founding mechanisms does not require eliminating autonomous macro-level laws. | 4 | Students confuse methodological requirements with ontological elimination of social patterns. |
  | **5** | **Conceptual Precision:** Argument is coherent; avoids category errors regarding agents and structures. | 4 | Vague usage of "emergence" without specifying mechanism costs marks here. |

  **Total: 20 Marks**

  **Penalty Clause:**
  **Named Misconception:** Treating Methodological Individualism as a thesis about mental states (psychologism) rather than about explanatory primitives (actions/interactions). If a candidate argues MI requires reducing all explanation to *psychology* rather than *individual actions*, deduct **5 marks** from the total score.
