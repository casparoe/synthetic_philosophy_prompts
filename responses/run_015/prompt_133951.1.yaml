answer: |-
  This is a sharp set of questions. You are hitting on a tension that keeps a lot of contemporary epistemologists up at night. Your friend's provocation (that foundationalists have it worse) is a known minority view, but it helps illuminate why the bootstrapping objection is specifically tailored to attack *externalism* (like reliabilism) rather than foundationalism generally.

  Here is a breakdown of the distinctions, the relationship to the Problem of the Criterion, and the current dialectical landscape, keeping the settled vs. contested distinctions clear.

  ### 1. Why Bootstrapping Targets Reliabilism More Than Foundationalism

  Your intuition ("Isn't foundationalism just bootstrapping with extra steps?") is powerful, but most epistemologists distinguish the two based on **what is doing the justificatory work.**

  **The Reliabilist Commitment:**
  Reliabilism defines justification *as* being produced by a reliable process.
  *   *Step 1:* My vision produces belief $P$ (The table is red).
  *   *Step 2:* Because the process is reliable, $P$ is justified.
  *   *Step 3:* I infer from $P$ (and many other instances) that my vision is reliable.
  *   *The Problem:* Since the justification for $P$ *already consisted in* the reliability of vision, Step 3 feels like you are using the conclusion to justify the premise, or trivializing the connection. You gain knowledge of reliability *too easily* (hence "Easy Knowledge").

  **The Foundationalist Commitment:**
  Foundationalism is a structural claim: there are basic beliefs that do not derive justification from other beliefs. It is neutral on *why* they are basic.
  *   *Internalist Foundationalism:* A belief is basic if it is self-evident or evident to the senses. Crucially, an internalist can say: "I am justified in believing the table is red, but I am **not** justified in inferring my vision is reliable solely on that basis." They can block the bootstrapping inference by denying that the move from "It seems red" to "My vision is reliable" is a justified inference *for the agent*.
  *   *Externalist Foundationalism:* This view gets hit harder, but still differently. They can argue that while the belief is basic, the *argument* for reliability is still circular.

  **Why your friend's claim is controversial:**
  Your friend suggests foundationalists "just assert." But foundationalists typically argue that basic beliefs have **non-inferential warrant**. They don't need to prove their faculties are reliable to *have* knowledge; they only need to prove it if they want to *argue* for it against a skeptic.
  Reliabilists, however, often want to say that the agent *can* come to know their faculties are reliable through the bootstrapping process. That is the specific bullet they are asked to bite. Foundationalists can simply say, "We have knowledge, but we can't prove reliability without circularity," whereas Reliabilists are pressured to say, "The process generates knowledge of its own reliability."

  **Settled:** Bootstrapping is primarily formulated as an objection to **Externalism/Reliabilism** (specifically those who accept the Closure Principle).
  **Contested:** Whether Internalist Foundationalism is immune. Some argue that if you claim perception gives immediate justification (Dogmatism), you face the same problem regardless of whether you call yourself a foundationalist or reliabilist.

  ### 2. Is "Easy Knowledge" a General Problem for Perception?

  You asked: *Why do people treat easy knowledge as a special problem for reliabilism rather than a general problem for anyone who thinks perception gives us knowledge?*

  It **is** treated as a general problem for anyone who accepts two specific premises:
  1.  **Basic Knowledge:** We can have perceptual knowledge without antecedently knowing our faculties are reliable.
  2.  **Closure:** If I know $P$, and I know $P$ entails $Q$, I can come to know $Q$ (via deduction).

  If you accept both, you get Bootstrapping.
  *   I know the table is red (Basic Knowledge).
  *   I know that if the table is red, my vision is functioning correctly in this instance.
  *   Therefore, I know my vision is functioning correctly.
  *   Repeat enough times $\rightarrow$ I know my vision is reliable.

  **Why it feels specific to Reliabilism:**
  Reliabilism is the theory that most naturally motivates **Basic Knowledge**. Internalists often require that to be justified, you must have access to *why* you are justified. Reliabilists say you don't need access; you just need the fact of reliability. This makes the move from "I see red" to "My vision is reliable" feel like a trivial semantic slide for Reliabilists, whereas an Internalist can block it by saying, "You lack the internal reason to make that inference."

  **Settled:** The problem arises for any theory combining Basic Knowledge + Closure.
  **Contested:** Which premise to reject.
  *   **Reject Closure:** (Dretske, Nozick). Knowledge doesn't transmit across known entailment in skeptical contexts.
  *   **Reject Basic Knowledge:** (Wright, Burge). You need antecedent warrant to trust your faculties before you can gain perceptual knowledge.
  *   **Accept Bootstrapping:** (Van Cleve, Cohen in some moods). Maybe knowledge *is* easy here, and our intuition that it's wrong is the mistake.

  ### 3. Bootstrapping vs. The Problem of the Criterion

  You asked: *Why doesn't the bootstrapping objection simply collapse into the old problem of the criterion?*

  They are cousins, but they play different roles in the dialectic.

  **The Problem of the Criterion (Chisholm):**
  *   **Nature:** A global skeptical puzzle about the **order of inquiry**.
  *   **The Dilemma:** To know which beliefs are true, I need a criterion. To know the criterion is good, I need to know which beliefs are true.
  *   **Goal:** To show that starting epistemology is impossible without begging the question. It is a challenge to the *project* of epistemology.

  **The Bootstrapping Objection (Vogel/Cohen):**
  *   **Nature:** A *reductio ad absurdum* against a specific **theory of justification**.
  *   **The Argument:** "If Reliabilism is true, then this absurd reasoning process (reading the gas gauge to prove the gauge works) counts as knowledge. Since that is absurd, Reliabilism is false."
  *   **Goal:** To show that Reliabilism yields counterintuitive results about *what counts as a good argument*.

  **Why they don't collapse:**
  The Problem of the Criterion says, "You can't solve the skeptical problem." Bootstrapping says, "Your theory solves the skeptical problem *too well*."
  A Foundationalist can accept the Problem of the Criterion (admitting they cannot *argue* non-circularly for their criterion) while still claiming they *have* knowledge. A Reliabilist hit by Bootstrapping is accused of claiming the *argument itself* generates justification, which seems to violate norms of reasoning.

  **Settled:** Bootstrapping is a modern, specific instantiation of the circularity worries found in the Problem of the Criterion.
  **Contested:** Whether Bootstrapping is actually vicious. Some (like James Van Cleve) argue that the Problem of the Criterion shows *all* theories are circular, so Bootstrapping isn't a unique bug for Reliabilism—it's a feature of any coherent epistemology.

  ### 4. Cohen, Basic Knowledge, and the "Renaming" Worry

  You mentioned: *I keep seeing references to Cohen's basic knowledge response... that feels like it's just renaming the problem.*

  It is crucial to clarify Stewart Cohen's role here, as this is a common point of confusion in grad seminars.

  **Cohen is usually the Attacker, not the Defender.**
  In his seminal 2002 paper *"Basic Knowledge and the Problem of Easy Knowledge,"* Cohen does **not** propose Basic Knowledge as a solution. He argues that Reliabilism *commits* you to Basic Knowledge, and that this commitment *leads* to the Bootstrapping problem. He uses the absurdity of Bootstrapping to argue **against** Reliabilism (or at least against the combination of Reliabilism + Closure).

  **The "Response" you are seeing:**
  When people talk about the "Basic Knowledge response," they are usually referring to **Dogmatists (like Jim Pryor)** or Reliabilists who **bite the bullet**. They argue:
  1.  Perceptual experience provides immediate justification (Basic Knowledge).
  2.  We should not let skeptical worries (like Bootstrapping) force us to deny this obvious fact.
  3.  Therefore, we must explain away the intuition that Bootstrapping is bad (perhaps by distinguishing *having* justification from *arguing* for it).

  **Is it renaming the problem?**
  If one says, "We have Basic Knowledge, so Bootstrapping is allowed," without explaining *why* our strong intuition that Bootstrapping is irrational is wrong, then yes, it is question-begging.
  However, the sophisticated version of this view (e.g., Van Cleve) argues that **all** justification ultimately rests on something unproven. If Foundationalism is true, *some* beliefs must be accepted without prior proof of reliability. If so, why is it "cheating" to aggregate those beliefs to confirm reliability? They argue the "Bootstrapping is bad" intuition relies on an Internalist demand (that you must know your source is reliable *before* using it) which is itself question-begging against the Externalist.

  **Settled:** Cohen identifies Basic Knowledge as the premise responsible for the paradox.
  **Contested:** Whether Basic Knowledge is a bug or a feature.
  *   **Bug:** (Wright, Cohen). We need antecedent warrant to trust faculties.
  *   **Feature:** (Pryor, Van Cleve). Demanding antecedent warrant leads to skepticism; we must accept Basic Knowledge and live with the consequences.

  ### Summary for Your Seminar

  If you want to impress your professor and clarify the discussion with your friend, here is the map:

  1.  **On Foundationalism:** Your friend is right that Foundationalism relies on unproven starting points. But Bootstrapping is specifically about the **transmission of justification through inference**. Foundationalists can deny the inference is valid; Reliabilists (who tie justification to truth-conduciveness) struggle to deny it without undermining their own theory.
  2.  **On the Problem of the Criterion:** Bootstrapping is the *reductio*; Problem of the Criterion is the *skeptical dilemma*. Bootstrapping assumes we *can* know things (to show the theory is too permissive); PoC asks *how* we can know anything at all.
  3.  **On Consensus:** There is **no consensus**.
      *   **Settled:** The tension between Closure and Basic Knowledge is real.
      *   **Contested:** Whether to drop Closure (skeptical-friendly), drop Basic Knowledge (anti-skeptical but demanding), or accept Easy Knowledge (revisionary).
  4.  **On Cohen:** Be careful not to attribute the "Basic Knowledge" position to Cohen as his *solution*. It is his *diagnosis* of the Reliabilist's problem.

  The most honest answer to "Why isn't this a problem for everyone?" is: **It is.** But Internalists have an easier time blocking the *inference* (by saying you need internal access to reliability to make the leap), whereas Externalists define justification in a way that makes the leap look valid, leaving them exposed to the charge of trivializing knowledge.
