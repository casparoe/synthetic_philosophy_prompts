prompt: |-
  I spent a career in experimental physical chemistry and have spent the last two years of retirement reading metaethics, where I keep encountering a prohibition that looks to me very like a manoeuvre my own field performs routinely, and to apparently opposite effect. I would like a careful comparison of two things that I suspect are being run together, and then a verdict on the manoeuvre.

  The first is the derivational thesis: no conclusion containing an 'ought' follows from premises none of which contain one; any valid argument for a normative conclusion must contain a normative premise, either smuggled in or honestly stated. The second is Moore's target: 'good' is not synonymous with any natural expression, goodness is not identical with any natural property, and for any natural candidate it remains an open question whether that candidate is good. Please say exactly what each of these denies and what each permits, whether either entails the other in either direction, and whether they are one thesis in two idioms or two theses that happen to be held by the same people. Do not assume the second is merely a rhetorical version of the first; I want to know whether either could fail while the other held.

  Now the manoeuvre, which I will describe in my own terms so that nothing hangs on my having read the right author. In the philosophy of science I was trained on, one moves from a purely descriptive base to statements couched in a theoretical vocabulary by adding what I will call a bridge identification: temperature is, up to a constant and in the ideal-gas case, mean molecular kinetic energy, and that identity is not analytic, not conceptually necessary, and not derivable from the descriptive base alone. It is a contingent, a posteriori identity, and the term is fixed by the role it plays in the theory; once the identity is in hand one cheerfully derives all manner of claims about temperature from claims about molecules. Call this the bridge-identification strategy. What happens when it is run on 'good' or 'ought'? As I understand it, it concedes everything to Hume, since it never claims a derivation from purely descriptive premises and simply adds the identity as a further premise; and it claims to be untouched by the open-question argument, since it asserts no synonymy and no analytic connection, only an a posteriori identity of the water/H₂O sort, so that the openness of the question whether maximizing well-being is good should be no more damaging than the openness of the question whether water is H₂O. Is that right? If not, where exactly does the analogy give?

  The wrinkle I cannot get past concerns the uniqueness of the filler. In the scientific cases the world appears to supply exactly one candidate that occupies the role, and that is what lets the identity be necessary even though a posteriori. Suppose instead that the normative role admits of two quite different fillers, and that two communities could agree on every platitude about what reasons and goodness do while their terms latched onto different properties. Is that a real possibility for the normative case in a way that it is not for temperature, and if it is, does it sink the strategy, or does it merely show that normative terms are less rigid than natural-kind terms without touching the main claim?

  Finally, three things I want stated plainly rather than gestured at. First: what sort of evidence could ever confirm a bridge identification of this kind, given that we have no instrument that detects goodness, and is the holistic answer available in science — the identity earns its keep by the explanatory and predictive work it does — genuinely available here, or does it smuggle the normative back in? Second: if the strategy works, has the is-ought gap collapsed into a bookkeeping point about argument validity, or does it reappear one level up, as a question about whether the bridge premise itself can ever be assertible? Third: where is the analogy to the theory-observation gap silent, and does my instinct that the gap has been overrated survive the comparison?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Retired experimental physical chemist. Two years of reading metaethics. Sharp, analytical, familiar with scientific reductionism (bridge laws, identities, theoretical terms). Skeptical of philosophical "manoeuvres" that look like scientific ones but might be illicit.
      *   **Core Task:** Compare two metaethical theses (Hume's Law/Is-Ought Gap vs. Moore's Open Question Argument/Naturalistic Fallacy) and evaluate the "Bridge-Identification Strategy" (Ethical Naturalism via a posteriori identity, akin to Water = H₂O or Temperature = Mean Kinetic Energy).
      *   **Specific Questions to Answer:**
          1.  Exact comparison of the Derivational Thesis (Hume) and Moore's Target (Open Question/Naturalistic Fallacy). Do they entail each other? Are they distinct?
          2.  Evaluate the Bridge-Identification Strategy applied to ethics. Does it concede to Hume? Does it evade Moore? Where does the analogy break?
          3.  Address the "Uniqueness of Filler" wrinkle (multiple realizability/divergence).
          4.  Three plain statements required:
              *   Evidence for the bridge identification (explanatory power vs. smuggling norms).
              *   Status of the Is-Ought gap (collapsed or shifted?).
              *   Where the analogy is silent and whether the gap is overrated.

  2.  **Deconstruct the Two Theses (Hume vs. Moore):**
      *   *Derivational Thesis (Hume's Law):* Logical point about validity. $P_1...P_n$ (all descriptive) $\nvdash C$ (normative). Requires a normative premise.
      *   *Moore's Target (Open Question Argument):* Semantic/Metaphysical point. 'Good' $\neq$ any natural property $N$. 'Is $N$ good?' is always open (non-trivial). Denies synonymy and often identity.
      *   *Relationship:* They are distinct. One is about logic/argument structure; the other is about meaning/ontology.
      *   *Entailment:* Does Hume entail Moore? No. You could have a synthetic identity (Good = N) that isn't analytic, so Hume holds (need the identity premise) but Moore fails (Good *is* N). Does Moore entail Hume? Mostly yes, if 'good' isn't natural, you can't derive it from natural premises without a bridge, but Moore is stronger (denies the bridge exists), while Hume just says *if* you derive it, you needed a bridge.
      *   *Verdict:* Distinct theses, often conflated. Hume is about inference rules; Moore is about reference/meaning.

  3.  **Evaluate the Bridge-Identification Strategy (Ethical Naturalism):**
      *   *The Move:* Good = N (e.g., Well-being). A posteriori, necessary identity (Kripke/Boyd).
      *   *Relation to Hume:* Concedes the logical point. You need the identity premise ("Good is N") to derive "You ought to do X" from "X promotes N". So, Hume is satisfied (no derivation from *purely* descriptive premises without the bridge).
      *   *Relation to Moore:* Claims to evade it. Moore assumes synonymy/conceptual analysis. If identity is a posteriori (like Water = H₂O), the question "Is N good?" is open *conceptually* but closed *metaphysically*.
      *   *The Break:* Does it work? The analogy relies on causal regulation of reference (Boyd). In science, 'water' refers to whatever plays the water-role causally. In ethics, does 'good' refer causally? Or is it prescriptive?
      *   *Verdict:* It concedes Hume (logical gap remains in argument structure) but challenges Moore (metaphysical gap might close).

  4.  **Address the "Uniqueness of Filler" Wrinkle:**
      *   *Science:* Temperature *is* MKE in ideal gases. In solids, it's different (vibrational). But there's a unified physical story. Usually, nature picks one candidate that fits the causal role.
      *   *Ethics:* If Utilitarians say Good = Max Welfare, and Virtue Ethicists say Good = Flourishing, and both fit the "platitudes" of goodness (reason-giving, commendation), do they refer to different properties?
      *   *Implication:* If reference is fixed by role, and multiple properties fit the role, reference is indeterminate. In science, empirical investigation narrows it down. In ethics, if empirical investigation doesn't narrow it down (because it's not causally efficacious in the same way), the identity fails.
      *   *Verdict:* This is a major threat. If the role underdetermines the property, the identity is unstable. Unlike water (which has a microstructure), goodness might not have a "microstructure."

  5.  **Drafting the Three Plain Statements:**
      *   *Evidence:* In science, identity yields predictions (new instruments, interventions). In ethics, what prediction does "Good = Welfare" yield? Only if we already value welfare. So, explanatory power is suspect. It risks smuggling normativity into the "explanation."
      *   *Is-Ought Gap:* It doesn't collapse. It shifts. The gap isn't between premises and conclusion (if you allow the bridge premise), but between the world and the bridge premise itself. Can the bridge premise be asserted on descriptive grounds? If yes, gap collapses. If no (needs normative intuition), gap remains.
      *   *Analogy Silence/Overrated:* The analogy is silent on *why* we should care about the identified property. Science explains; Ethics guides. The gap is overrated as a logical barrier (identities bridge it) but underrated as a motivational/practical barrier.

  6.  **Refining the Tone:**
      *   Respect the user's scientific background. Use terms like "bridge laws," "rigid designators," "causal role," "underdetermination."
      *   Avoid waffle. Be precise about entailment and identity.
      *   Acknowledge the sophistication of the question (this is Cornell Realism vs. Non-Naturalism territory).

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the sharpness of the observation.
      *   *Section 1: Hume vs. Moore.* Distinguish Logic vs. Semantics/Metaphysics. Hume = Validity. Moore = Synonymy/Identity. Hume does not entail Moore (synthetic identities allowed). Moore entails Hume (if no identity, no derivation).
      *   *Section 2: Bridge Strategy.* It's Cornell Realism (Boyd, Brink). Concedes Hume (needs premise). Evades Moore (a posteriori identity). *But* the analogy breaks on causal regulation.
      *   *Section 3: Uniqueness.* Multiple realizability is fine in science (functionalism), but reference needs stability. In ethics, if the role is too abstract, reference fails. This is the "Queerness" objection updated.
      *   *Section 4: The Three Plain Statements.*
          1.  Evidence: Coherence/Explanatory power? But risks circularity.
          2.  Gap: Shifted to the bridge premise.
          3.  Silence: Motivational force. Gap is overrated logically, underrated practically.

  8.  **Review against Constraints:**
      *   "Do not assume the second is merely a rhetorical version of the first." (Check.)
      *   "Say exactly what each of these denies and what each permits." (Check.)
      *   "Whether either entails the other." (Check.)
      *   "Three things I want stated plainly." (Check.)
      *   Tone: Professional, rigorous, no condescension.

  9.  **Final Polish:** Ensure the distinction between *analytic* identity (Moore's target) and *synthetic* identity (Bridge Strategy) is crystal clear, as this is the crux of the user's confusion regarding the Open Question Argument. Ensure the "Uniqueness" point addresses rigid designation vs. functional role. (Self-Correction: Make sure to mention that Temperature isn't *always* MKE, it's a more complex functional role, but the user's example is specific to ideal gases, so stick to their example while noting the nuance).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a precise and well-posed interrogation of the structural parallels between scientific reduction and ethical naturalism. You have identified the standard move of contemporary "Cornell Realism" (e.g., Richard Boyd, David Brink, Peter Railton), which attempts to save ethical naturalism from Moore by importing Kripke/Putnam semantics.

  Here is the comparison, the evaluation of the manoeuvre, and the three plain statements you requested.

  ### 1. The Derivational Thesis vs. Moore's Target

  You are correct to suspect these are often run together, but they are distinct claims operating in different registers.

  **The Derivational Thesis (Hume's Law)**
  *   **What it denies:** It denies *logical validity*. It states that in a formally valid argument, you cannot produce a normative conclusion (containing 'ought' or 'good') if all premises are purely descriptive (containing only 'is').
  *   **What it permits:** It permits a normative conclusion if *one* premise is normative. It is silent on whether that normative premise is true, false, analytic, or synthetic. It is a thesis about inference rules, not ontology.
  *   **Status:** Logical/Syntactic.

  **Moore's Target (The Naturalistic Fallacy / Open Question Argument)**
  *   **What it denies:** It denies *semantic synonymy* and *metaphysical identity*. It claims 'good' does not mean the same as any natural property $N$ (e.g., pleasure), and often implies 'good' *is not* any natural property $N$. The "Open Question" ("I know it is $N$, but is it good?") is supposed to prove non-synonymy.
  *   **What it permits:** It permits 'good' to refer to a non-natural property, or to fail to refer at all (error theory), or to be prescriptive rather than descriptive (expressivism).
  *   **Status:** Semantic/Metaphysical.

  **Entailment Relations**
  *   **Does Hume entail Moore?** No. One can accept Hume's Law while rejecting Moore. This is precisely the Bridge-Identification Strategy. You can say: "You cannot derive 'ought' from 'is' *alone* (Hume), but you can derive it from 'is' plus the synthetic identity 'Good = N'." Hume blocks the derivation from a *purely* descriptive base; he does not block the derivation if the identity premise is admitted.
  *   **Does Moore entail Hume?** Yes, effectively. If 'good' is not identical to any natural property, then no set of natural premises can entail a normative conclusion, because the terms in the conclusion refer to something absent from the premises. Moore's metaphysical gap guarantees Hume's logical gap.

  **Verdict:** They are two theses held by the same people (non-naturalists), but they are not one thesis in two idioms. Hume is about argument structure; Moore is about reference. The Bridge-Identification Strategy concedes Hume to save itself from Moore.

  ### 2. The Bridge-Identification Strategy: Evaluation

  Your reconstruction of the manoeuvre is accurate. It posits that `Good = N` is a synthetic, a posteriori, necessary identity, analogous to `Water = H₂O` or `Temperature = Mean Kinetic Energy (MKE)`.

  **Does it concede to Hume?**
  Yes. The strategy admits that you cannot derive "You ought to $\phi$" from " $\phi$ maximizes $N$" without the additional premise "Goodness is $N$." Since that premise is not purely descriptive (it contains the term 'goodness' or links the descriptive to the normative), the Derivational Thesis is not violated. The "gap" is acknowledged as a requirement for a bridge premise.

  **Does it evade Moore?**
  It attempts to, by distinguishing *synonymy* from *identity*. Moore assumed that if 'good' meant anything natural, it must mean it *by definition* (analytic). The Bridge Strategy argues that reference is fixed by causal role, not conceptual analysis. Just as ancients could refer to water without knowing it was H₂O, we can refer to goodness without knowing it is $N$. Therefore, "Is $N$ good?" remains an open *conceptual* question (like "Is water H₂O?" to a pre-scientific mind) but a closed *metaphysical* one.

  **Where the Analogy Gives**
  The analogy breaks on **causal regulation**.
  In the scientific case, the term 'water' is causally regulated by the substance itself. We interact with H₂O, and that interaction fixes the reference. The identity is discovered because the stuff *does* things (boils at 100°C, dissolves salt) that allow us to track it independently of the theory.
  In the ethical case, does the property $N$ (e.g., well-being) causally regulate our use of the word 'good'? If 'good' is to be a natural kind, it must have causal powers that explain our moral beliefs. But if the property $N$ is just "what we ought to pursue," its causal power is dependent on our already accepting the norm. If the property does not causally regulate the term independently of our normative attitudes, the reference is not fixed by the world, but by our attitudes. This collapses the identity back into a projection, reviving Moore's worry.

  ### 3. The Uniqueness of the Filler

  You have put your finger on the most significant vulnerability: **Reference Magnetism and Underdetermination.**

  In the temperature case, physics constrains the candidates. Once you specify the role (expands in glass, equilibrates, drives heat flow), only one physical magnitude (MKE in gases, specific vibrational modes in solids) fits the equations. Nature supplies a unique filler.

  In the normative case, the "role" is defined by platitudes (goodness provides reasons, goodness is commendable, goodness is to be pursued). It is a live possibility that multiple, distinct natural properties fit this role equally well.
  *   Candidate A: Maximization of preference satisfaction.
  *   Candidate B: Objective list of flourishing (knowledge, friendship).

  If two communities agree on all platitudes but latch onto A and B respectively, do they mean the same thing?
  *   **If Yes:** Then 'good' is indeterminate. The identity `Good = A` is false because `Good = B` is equally true. The bridge fails.
  *   **If No:** Then 'good' is ambiguous. But if it is ambiguous, we cannot use it in universal moral claims.

  **Does this sink the strategy?**
  It sinks the claim that the identity is *discovered* like Water = H₂O. In science, empirical investigation eliminates candidates. In ethics, if empirical investigation leaves A and B tied, the choice between them is not empirical; it is normative. You must *decide* which property is the real goodness. But if you must decide normatively, the identity is not a purely naturalistic bridge; it relies on a prior normative commitment. This suggests the "Uniqueness" condition required for rigid designation is not met in ethics in the way it is in physics.

  ### 4. Three Plain Statements

  **First: On Evidence for the Bridge**
  In science, the evidence for `Temperature = MKE` is predictive and instrumental success; the identity allows us to manipulate the system in new ways (e.g., refrigeration) that the phenomenological concept alone did not suggest. In ethics, the "evidence" for `Good = Well-being` is typically coherence: the identity makes sense of our moral practices better than alternatives. However, this is not independent confirmation. It risks circularity: we judge the identity successful because it yields the moral conclusions we already accept. There is no "goodness meter" that reads out $N$ independently of our moral intuitions. Therefore, the holistic answer available in science is **not genuinely available here** without smuggling the normative back in as a criterion for theory choice.

  **Second: On the Status of the Is-Ought Gap**
  If the strategy works, the Is-Ought gap has **not collapsed**; it has been relocated. It no longer exists between descriptive premises and a normative conclusion (since the bridge premise allows the derivation). Instead, it reappears as the question of the **assertibility of the bridge premise itself**. Can the statement "Goodness is identical to $N$" be asserted on purely descriptive grounds? If yes, the gap collapses entirely. If no (if asserting the identity requires a normative intuition), then the gap survives at the level of the bridge. Most proponents of this strategy admit the latter: the identity is a philosophical proposal justified by normative considerations, not a scientific discovery justified by empirical data alone.

  **Third: On the Analogy's Silence and the Gap's Rating**
  The analogy is silent on **motivational internalism**. In science, identifying temperature with MKE does not compel an agent to care about temperature. In ethics, identifying goodness with $N$ is supposed to explain why we have reasons to pursue $N$. The scientific analogy explains *reference*, but it does not explain *normative force*.
  Your instinct that the gap is **overrated** survives, but with a caveat. The gap is overrated as a *logical* prohibition (identities can bridge logic). However, it is underrated as a *pragmatic* boundary. The reason the gap feels unbridgeable is not that the logic fails, but that the *interests* served by descriptive inquiry (prediction, control) and normative inquiry (guidance, justification) are distinct. The bridge strategy shows we can map the vocabulary, but it does not show that the map compels the traveler to move.
