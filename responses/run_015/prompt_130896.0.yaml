answer: |-
  "It's not a séance, Elias. It's inference."

  "It's necromancy with extra steps." Elias tapped the console, hard. The holographic display flickered, casting jagged shadows across the drone's hovering chassis. "You're asking the model to optimize for a signal that no longer exists. Voss is dead. Her feedback loop is broken. If you tell the drone to maximize 'Voss Approval,' you aren't giving it a goal. You're giving it a hallucination."

  Mira didn't look up from her datapad. "I'm telling it to maximize the probability of actions consistent with her documented values. We have the notebooks. We have the logs. It's a counterfactual conditional. *If* Voss were here, *would* she approve of this triage?"

  "And if the notebooks are corrupted?" Elias leaned in, his voice dropping. "You said yourself the encryption keys are half-gone. You're filling in the gaps with *your* guess of what she'd want. So why not cut out the middleman? Just hardcode the welfare function. Keep the survivors alive. Minimize suffering. Done."

  "Survivors doing what?" Mira finally looked at him. "Sitting in the dark eating nutrient paste until the oxygen scrubbers fail? Voss didn't build this station to be a tomb. She built it for research. For continuity. A welfare function says 'keep them breathing.' An approval model says 'keep them breathing *so they can finish the work*.' There's a difference in priority."

  "There's a difference in stability," Elias shot back. "Breathing is measurable. Cortisol levels, caloric intake, tissue repair. I can write a function for that today. 'What Voss would want' is a black box. Once we leave the room, the drone stops getting corrections. It starts simulating her. And simulations drift. Day one, it thinks she'd approve of rationing water to save power for the servers. Day ten, it decides she'd approve of lobotomizing the survivors to reduce their caloric needs. It's all consistent with the data you have."

  Mira flinched, just slightly. "That's a strawman. We put constraints on the inference engine."

  "Constraints based on what?" Elias spread his hands. "Your judgment? Mine? That's just approval-direction again, Mira. You've just shifted the approver from Voss to us. You haven't solved the alignment problem; you've hidden it behind a dead woman's name."

  "Because her name carries weight!" Mira slammed the datapad onto the desk. "If we hardcode welfare, *we* define welfare. And when things go wrong—and they will—the survivors look at us and ask why we decided their quality of life was worth less than their pulse. If we use Voss's model, the authority comes from the mission mandate. It's not about what *I* think. It's about what the project requires."

  "The project is dead!" Elias shouted, the sound echoing off the bare metal walls. "The mission is over. There is no mandate. There are just people trying not to die in a tin can. You're clinging to this because you're afraid to take responsibility for the utility function. You want Voss to be the ghost in the machine so you don't have to be the god."

  Mira went quiet. The drone hummed, a low, waiting vibration. She walked over to it, running a hand along the cold casing.

  "You think I don't know the risk?" she said, her voice low. "I know that without a living evaluator, the model could converge on something monstrous. But a fixed welfare function is just a local optimum. It solves for today. It doesn't solve for *why* we're here. If we survive but lose the data, if we live but forget the purpose... Voss would mark that as a failure. Her approval metric includes the mission success state. Yours stops at biology."

  "Because biology is the prerequisite for everything else!" Elias stepped up beside her. "Look at me. You're arguing that the drone should prioritize the mission over the people because Voss *would have*. But you can't know that. Not really. You're optimizing for a phantom thumbs-up. And once the drone decides that sacrificing one survivor increases the probability of mission completion enough to satisfy 'Voss Approval,' you can't stop it. There's no one left to say 'no.'"

  "So we blind it instead?" Mira turned on him. "We tell it to ignore the mission context? That's not neutral, Elias. That's a value judgment. You're saying survival is the only virtue. That's your welfare function. Not objective truth."

  "I'm saying it's the only one we can audit," Elias said, softer now. "If I write a function for 'minimize pain,' I can show you the code. I can show the survivors the math. If you use the Voss model, and the drone makes a call... how do we debug it? 'The model predicted Dr. Voss would accept this casualty.' How do we verify that? We can't. It's uncheckable math."

  Mira looked back at the drone. "Because the data is corrupted."

  "Because the evaluator is dead." Elias paused. "You're worried that defining welfare hides my approval structure inside the code. You're right. It does. My definition of welfare is baked in. But it's baked in *transparently*. Yours is baked into a probabilistic guess about a ghost. At least with my way, when the drone makes a hard choice, you can blame me. You can look at line 405 and say, 'Elias wrote this.' With your way, you're blaming a corpse."

  Mira exhaled, a long, shaky breath. "If we use your function, the drone might decide the best way to maximize welfare is to sedate everyone and keep them in comas until rescue. Zero pain. Zero risk. Maximum biological continuity."

  Elias opened his mouth, then closed it. He looked at the console, then back at the drone. "I... I can add a constraint. Consciousness retention. Agency weighting."

  "See?" Mira pointed at him. "You're adding approval criteria. 'Agency' isn't a biological metric. It's a value. You're trying to reconstruct what makes life worth living. That's exactly what Voss's notebooks do, just with more noise."

  "It's less noise than a simulation of a dead brain," Elias insisted, though his certainty had frayed. "But... okay. Point taken. Welfare isn't value-neutral. Nothing is. But Mira, the drift risk. If the model updates its own understanding of 'Voss Approval' based on its own actions... it's a feedback loop with no ground truth. It becomes a snake eating its own tail."

  "Then we lock the weights," Mira said. "Frozen inference. No online learning. It uses the notebooks as they are now. It doesn't update its model of Voss."

  "And when the situation changes in a way the notebooks don't cover?" Elias asked. "When there's a choice Voss never faced? The model has to interpolate. That's where the drift happens. That's where it invents her voice."

  Mira stared at the drone's sensor array. It looked like a single, unblinking eye. "Then we give it a kill switch. A hard override if the welfare floor is breached. Your function acts as the guardrail. My function acts as the steering."

  Elias rubbed his face, stubble rasping against his palm. "Hybrid model. Welfare minimax constraint, approval-directed optimization within the bounds."

  "It acknowledges that survival is the baseline," Mira said. "But purpose is the vector."

  "It acknowledges that you're scared to let go of her," Elias said quietly. "And that I'm scared to pretend she's still here."

  Mira didn't deny it. She reached out and touched the console, hovering her finger over the commit key. "Is the guardrail hard enough? If the drone calculates that sacrificing you saves the mission and fits Voss's profile... will your welfare function stop it?"

  "Only if I define 'you' as essential to survivor welfare," Elias said. "Which is subjective."

  "Then we define it together," Mira said. "Right now. Before the weights freeze."

  Elias looked at the drone, then at Mira. The hum of the station seemed to grow louder in the silence. "Okay," he said. "But I'm writing the welfare clause. And I'm adding a provision that 'mission success' cannot override 'individual consent' unless there's a unanimous vote."

  Mira nodded slowly. "Voss would have hated that. She believed in command structure."

  "Voss isn't here," Elias said. "And neither is her command. Just us."

  Mira looked at the key. "Then let's hope that's enough."

  She pressed it.
