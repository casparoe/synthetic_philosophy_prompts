      *   **Specific Instructions:**
          *   Don't retell the story (user knows it).
          *   Treat the "return to LaGuardia" feasibility as unsettled/irrelevant.
          *   **Part 1: Theory onto Case:** Map the 3 minutes onto the Tower. Define the "creature" (Sully, Crew, System?). Map candidate actions (ditch, TEB, LGA) and their source (ATC as off-board generator?). Assign specific elements (hands, checklist, glider background, CRM, sims, regulations) to floors.
          *   **Part 2: Case onto Theory:** What would a Skinnerian do? (User's hypothesis: upper floors are needed because lower floors require death). Evaluate if overlearned/conditioned stuff is missing from the Tower's vocabulary.
