      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in aviation technicalities. Keep the focus on the *philosophical mapping*. Ensure the distinction between "history of competence" and "process of execution" is clear for Idea 1. Ensure the distinction between "mechanism of selection" and "location of selection" is clear for Idea 2.

      *(Glider Nuance)*: The user flies gliders. They understand energy management. I should use that. "Potential energy as a hypothesis currency."

      *(Dennett Nuance)*: Dennett's Tower is about *freesqueezing*—getting more design work done without paying the full cost in death. 1549 is the ultimate cost-avoidance scenario.

      *Let's build the Table.*
