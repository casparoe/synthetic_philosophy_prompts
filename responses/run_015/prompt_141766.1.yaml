answer: |-
  Your position is a sophisticated blend of moral particularism and virtue epistemology, framed through a machine-learning analogy (calibration on labeled data). It is theoretically robust but empirically vulnerable. Here is the map of its exposure, ranked from fatal to awkward, followed by an analysis of your specific worries.

  ### Ranked Defeaters

  1.  **Fatal: The "Topoi" Problem (Historical Fabrication)**
      For your defense to work, the "small details" must be higher-fidelity data than the "big battles." You must be wrong if: **ancient anecdotes are reusable rhetorical tropes.** If the witty remark or the modest meal is a literary convention (a *chreia*) assigned to multiple subjects to signal "wisdom" or "temperance" regardless of historical fact, then these details are not honest signals of character. They are genre conventions. If the data is fabricated, calibration is impossible; you are calibrating on literary stereotypes, not human psychology. This kills the claim that Plutarch's method avoids distortion.

  2.  **Fatal: The Circularity of Labeling**
      You must be wrong if: **the reader supplies the moral labels.** Your model requires the text to provide "labeled examples." But if the reader must already possess the moral concept ("courage") to identify the labeled instance in the text, the biography is not generating moral knowledge; it is illustrating antecedent knowledge. If the text supplies the label ("this was noble") and the reader accepts it on authority, you are learning from testimony, not perception. Either way, the "calibration" claim collapses into either principles-first illustration or deference to authority.

  3.  **Severe: The Fiction Equivalence**
      You must be wrong if: **ontological reality is epistemically irrelevant.** If moral learning is purely pattern-matching on examples, a well-constructed novel should teach better than a messy life (cleaner data, clearer labels). If you insist real lives are necessary, you owe an account of why *existence* matters. Is it because moral knowledge requires knowing what is *humanly possible*? If so, fabricated anecdotes (which function as fiction) fail to teach this. If you cannot distinguish the epistemic value of a true life from a realistic novel, Plutarch's claim to be writing *lives* becomes decorative.

  4.  **Awkward: The Unfalsifiability Charge**
      Claiming "if you didn't learn, you didn't read properly" is standard in virtue epistemology (only the *phronimos* judges correctly), but it risks dogmatism. To avoid this, you need an independent account of *reader competence* that doesn't just rely on the outcome. If you cannot specify what counts as "reading properly" apart from "getting the moral lesson," the view is insulated from critique but loses explanatory power.

  5.  **Awkward: Learning New Distinctions**
      You worry about learning a *new* category of wrong. Particularism struggles here: how do you recognize a new virtue without a concept? The reply is prototype theory: you recognize resemblances before naming them. This is theoretically possible but hard to demonstrate. It is not fatal, but it limits the scope of your claim to *refining* moral perception rather than *creating* it.

  ### Addressing Your Specific Worries

  **1. The Labels and Antecedent Knowledge**
  This is the strongest philosophical threat. If the labels come from you, the text is passive. If they come from Plutarch, you are trusting his moral judgment, not perceiving the character yourself.
  *   **How to save it:** Argue for *interactive calibration*. The text provides the *features* (the action), and the reader provides a *provisional* label based on rough intuition, which is then corrected by the narrative outcome or comparison with other lives. The knowledge gained isn't the label itself, but the *weighting* of features (e.g., learning that how one treats servants matters more than battlefield bravery). This preserves the "calibration" model without requiring ex nihilo concept generation.

  **2. The Novel vs. Real Life**
  If your mechanism is pattern-matching, novels should work.
  *   **How to save it:** Embrace the consequence but add a modal constraint. Moral knowledge isn't just "what does virtue look like?" (which novels can teach) but "what is virtue *in the world*?" (which requires actual existence). We learn from lives because we need to know that this level of goodness or evil is *actualizable* by humans, not just conceivable. If the anecdotes are invented, this modal knowledge is compromised. This ties your view tightly to historical reliability.

  **3. Unfalsifiability**
  "It doesn't teach you because you aren't reading properly" is a risk.
  *   **How to save it:** Frame it as a competence condition, not a免责 (exemption). Just as you cannot learn calculus without knowing algebra, you cannot learn from Plutarch without basic moral literacy. This doesn't make the view unfalsifiable; it just limits its audience. The falsifier would be a competent reader (by independent standards) who gains no moral insight from the text.

  **4. Historical Reliability (The Anecdote Problem)**
  You identified this as your biggest personal worry. You are right to worry.
  *   **What would have to be true for you to be wrong:** If philologists demonstrate that the specific "small details" you rely on (the jokes, the deathbed scenes) are mobile tropes recycled across different biographies to fit a thematic archetype, then your premise that "panegyrists have least incentive to polish small details" is false. They had every incentive to polish them to fit the archetype. If the details are tropes, they are not data points about the subject; they are data points about the genre.
  *   **How bad it is:** It is fatal to the specific defense of Plutarch. It forces you to concede that you are learning from Plutarch's *moral imagination*, not the subject's *life*. This shifts your position from "learning from lives" to "learning from moral literature," which undermines the classics/philosophy cross-listing's focus on real lives.

  ### Summary of Exposure
  Your view is philosophically coherent (survives the principles-first objection via calibration) but historically precarious. It stands or falls on the empirical claim that ancient biographical anecdotes are reliable indicators of character rather than literary devices. If the anecdotes are tropes, the "honest label" premise fails, and the calibration is on fiction.

  \answer{verdict: survives-qualified — top defeater: Anecdotes are rhetorical tropes not data}
