answer: |-
  In 2080 the water takes the window.
  A child counts ripples, learning how to swim.
  This life depends on storms arriving early,
  On parents staying inside through the night,
  On power failing and the lights going out.
  To dry the ground is to erase this step.
  This life is the debt that cannot be repaid.
  But fix the levee and the timeline bends.
  The child runs where the water used to be.
  Conceived in peace, not panic, not in heat.
  Her parents meet at a cafe, not a shelter.
  Breathing easy, but she is not him.
  We save the world by changing who walks it.
  The victim is the space between their names.
