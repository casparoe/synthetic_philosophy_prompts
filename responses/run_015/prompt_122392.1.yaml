prompt: |-
  hey so ive been stuck on this climate justice thing where people say were harming future generations, but then i read that if we change course the people who suffer in the bad timeline never actually exist, so who is the victim? can you write a short poem for me, maybe 14 lines, no fixed rhyme, but with the form doing the philosophical work? like: start with one specific kid in a flooded 2080, then halfway through the poem splits and that same kid becomes a different kid in the saved world, and by the end you cant tell which version is real or if anyone was wronged. dont make it a sermon about recycling, just leave the tension open. i want it readable but not simplistic.
