  1.  **Analyze the Request:**
      *   **Topic:** Climate justice, non-identity problem (people who would suffer in a bad timeline don't exist if we change course, so who is the victim?).
      *   **Format:** Short poem, exactly 14 lines (sonnet length, but no fixed rhyme).
      *   **Structure/Form:** The form must do the philosophical work.
          *   Start: Specific kid in a flooded 2080 (bad timeline).
          *   Midpoint: The poem splits, the kid becomes a different kid in a saved world (good timeline).
          *   End: Ambiguity. Can't tell which version is real or if anyone was wronged.
      *   **Tone:** Readable but not simplistic. No sermonizing about recycling. Leave the tension open.

  2.  **Deconstruct the Philosophical Problem (Non-Identity Problem):**
      *   This is Derek Parfit's problem. If we choose a policy that leads to a worse future, the people born in that future are different people than those who would be born under a better policy (because conception times differ based on economic/social conditions).
      *   Therefore, the people in the worse future cannot claim they were harmed by the policy, because without that policy, they wouldn't exist at all.
      *   The poem needs to embody this bifurcation of identity.

  3.  **Drafting - Line by Line (aiming for 14 lines):**

