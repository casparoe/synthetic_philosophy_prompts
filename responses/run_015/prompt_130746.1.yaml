answer: |-
  You have hit on a very precise and philosophically rich distinction. You are right that this feels different from standard hypocrisy. Classic hypocrisy is usually **Action vs. Word** (I tell you not to smoke, but I smoke). What you are describing is **Word vs. Word** (I told Person A this was okay, but I tell Person B it is not) or **Enforcement vs. Non-Enforcement**.

  There isn't one single English word that captures this perfectly, but there are three specific terms depending on the context (social, legal, or philosophical) that describe exactly what you mean.

  ### 1. The Common Term: "Double Standard"
  This is the most accurate colloquial term. A double standard occurs when two similar people or groups are judged by different sets of principles.
  *   **Why it fits:** It captures the inconsistency. You aren't necessarily doing the dishes yourself (hypocrisy); you are just applying the rule to your roommate but not the other one.
  *   **The Vibe:** It implies unfairness and bias rather than just moral failing.

  ### 2. The Political/Legal Term: "Selective Enforcement"
  This is the term used for your politician example. It describes a situation where an authority figure chooses to enforce a rule against one party but ignores violations by another.
  *   **Why it fits:** It removes the requirement that the enforcer committed the act. The crime isn't that they are corrupt; the crime is that they *weaponized* the rule against one side while shielding the other.
  *   **The Vibe:** This implies manipulation and power dynamics.

  ### 3. The Philosophical Term: "Loss of Standing to Blame"
  This is the most precise technical term for what you are describing. In moral philosophy, there is a concept called **Standing**. To have standing to blame someone, you must meet certain conditions. One of those conditions is **consistency**.
  *   **The Concept:** If you have previously waived the rule for others without a valid reason, you forfeit your "standing" to enforce it now. You haven't necessarily broken the rule yourself, but you have undermined the authority of the rule.
  *   **The Vibe:** This is about credibility and moral authority.

  ---

  ### Defining the Edges: When is it *not* this?

  You asked about the edges: *Does it matter if you excused the other person for a good reason?*

  This is the crux of the issue. In logic and ethics, this is the difference between a **Double Standard** and a **Relevant Difference**.

  **1. The "Relevant Difference" Defense (The Edge)**
  You do *not* lose your standing to blame if there is a morally relevant difference between the two cases.
  *   **Example:** You let Roommate A slide on dishes because she was in the hospital. You blame Roommate B for dishes because he is playing video games.
  *   **Verdict:** This is **not** a double standard. This is **Contextual Nuance**. The rule isn't "Never leave dishes," the implicit rule is "Don't leave dishes unless you have an emergency."
  *   **The Test:** If you can articulate a principle that distinguishes Case A from Case B that everyone would agree is fair, you keep your standing.

  **2. The "Growth" Defense (The Edge)**
  Does admitting you were wrong in the past restore your standing?
  *   **Example:** "I know I let Sarah slide on that last year, and I was wrong to do that. I realize now it hurts the household, so I'm asking you to stop."
  *   **Verdict:** This **restores standing**. By admitting the previous waiver was a mistake, you re-align yourself with the rule. The inconsistency is acknowledged and corrected.

  **3. The "Capacity" Defense (The Edge)**
  Did you have the power to stop the first instance?
  *   **Example:** A junior employee ignores a peer's minor infraction because they have no authority. Later, as a manager, they call out a new employee for the same thing.
  *   **Verdict:** This is **not** a loss of standing. You cannot enforce what you have no power to enforce. The inconsistency is due to a change in role, not a change in morals.

  ### So, what should we call it?

  If "Double Standard" feels too generic and "Hypocrisy" feels inaccurate, here is a proposal for the specific phenomenon you are describing:

  **"Normative Inconsistency"**
  *   *Normative:* Relating to a rule or standard of behavior.
  *   *Inconsistency:* The application varies without cause.

  **Or, more colloquially: "Convenience Enforcement"**
  This captures the feeling that the rule is only being "turned on" when it is convenient for the blamer to do so (e.g., to attack a political opponent), rather than out of a genuine commitment to the rule itself.

  ### Summary of the Distinction

  | Term | Definition | Do *you* have to do the bad thing? |
  | :--- | :--- | :--- |
  | **Hypocrisy** | Claiming moral superiority while violating the rule yourself. | **Yes** |
  | **Double Standard** | Applying the rule to others but waiving it for favorites (or vice versa). | **No** |
  | **Selective Enforcement** | Using authority to punish one group while ignoring another. | **No** |
  | **Loss of Standing** | Forfeiting the *right* to criticize due to prior inconsistency. | **No** |

  **The Verdict:**
  You are describing a **Loss of Standing due to Normative Inconsistency.**

  In your roommate example, your roommate has lost the **standing** to complain because they established a precedent that "stress excuses dishes." Unless they can prove your stress is not comparable to the other roommate's (a Relevant Difference), their blame is invalid—not because they are perfect, but because they are **arbitrary.**

  In the politician example, it is **Selective Enforcement.** They are treating the *rule* as a weapon rather than a standard.

  If you want to call it out in conversation, the strongest phrase is: **"You've waived this rule before without a relevant difference, so you don't have the standing to enforce it now."**
