      *   **Role:** Professional philosopher with clinical ethics experience.
      *   **Task:** Create a reusable decision procedure (checklist) for hospice board consultants to operationalise *tranquilism* in end-of-life decisions for patients in minimal consciousness.
      *   **Core Philosophy:** Tranquilism (only absence of craving/suffering has value; positive goods like pleasure/relationships are intrinsically weightless).
      *   **Constraints:** 15-minute consultation, no imaging access, bedside context.
      *   **Specific Requirements:**
          *   Write the checklist first (ordered questions, sufficient answers, decision nodes, explicit judgement flags).
          *   Handle "craving residue" (lack of behavioral report doesn't prove absence of subjective craving; needs a risk-threshold).
          *   Apply to two cases:
              *   (a) Family wants continuation based on potential joy (music).
              *   (b) Family wants withdrawal based on religious duty, but ambiguous reflexive movements exist.
          *   Include one result the family won't like.
          *   State clearly what the procedure can't settle (conflicts between family values and tranquilist output).
          *   Style: Practical, British spelling, no citations/reading lists.

  2.  **Deconstruct Tranquilism in this Context:**
      *   *Core Axiom:* Suffering/Craving = Negative Value. Pleasure/Joy/Achievement = Zero Value (neutral).
      *   *Goal:* Minimise net craving/suffering.
      *   *Implication for Life-Sustaining Treatment (LST):*
          *   If life contains suffering/craving -> Withdrawal might be preferred (to end suffering).
          *   If life contains no suffering/craving -> Continuation is neutral (not positively good, but not bad). However, maintaining biological life often carries risks of future suffering.
          *   If death is assumed to be absence of craving (non-existence) -> Death is neutral/zero.
          *   Therefore, the decision hinges on the *risk* of future craving/suffering vs. the certainty of ending potential craving via withdrawal.
          *   *Crucial Twist:* Positive experiences (joy from music) do *not* count as a reason to continue. This will clash with families.
      *   *Epistemic Problem:* Minimal Consciousness State (MCS). We can't ask them. "Craving residue" means we can't be sure they aren't suffering internally even if outwardly calm.
      *   *Solution:* Risk-threshold. If the probability of hidden craving exceeds $X$, treat as suffering.

  3.  **Drafting the Checklist (The "Tranquilist Triage Tool"):**
      *   *Time limit:* 15 mins. Needs to be fast.
      *   *Structure:* Flowchart style logic.
      *   *Key Questions:*
          1.  Is there overt suffering? (Groaning, grimacing).
          2.  Is there overt craving? (Reaching, tracking).
          3.  If no overt signs, what is the risk of "craving residue"? (Etiology, meds, neurological profile).
          4.  Are positive goods being cited? (Ignore them per tranquilism).
          5.  Decision Node: Continue vs. Withdraw vs. Escalate.
      *   *Risk Threshold:* Needs to be defined. Let's say "Precautionary Principle for Suffering." If risk > 10% (arbitrary but practical), treat as present.
      *   *Judgement Flags:* Where does human discretion remain? (Interpreting ambiguous movements, setting the risk threshold).

  4.  **Developing the Cases:**
      *   *Case A (Family wants continuation for joy):*
          *   Tranquilist view: Joy is weightless. Only suffering matters.
          *   If patient has low risk of suffering, continuation is neutral. But if there's *any* risk of suffering, withdrawal is preferred to secure zero craving.
          *   *Conflict:* Family values joy. Tranquilism ignores it.
          *   *Result:* Likely recommend withdrawal if there's *any* significant risk of hidden suffering, or continuation if suffering is impossible but joy is irrelevant. Actually, strict tranquilism suggests that if there is *no* suffering, continuing is neutral. But usually, maintaining life carries *risk* of future suffering. Death is safe zero. So withdrawal is often favoured unless suffering is impossible.
          *   *Refinement:* If the patient is truly free of craving, continuing is neutral. But can we guarantee that? No. So the risk threshold applies.
          *   *Outcome:* Recommend withdrawal (or palliative sedation) because the potential joy doesn't offset the risk of suffering. Family won't like this.
      *   *Case B (Family wants withdrawal for religion, ambiguous movements):*
          *   Family wants withdrawal (aligns with tranquilist goal of ending potential craving?).
          *   Ambiguous movements: Could be craving (bad) or automatism (neutral).
          *   Tranquilist view: If it *might* be craving, the risk threshold triggers.
          *   *Outcome:* Recommend withdrawal (aligns with family).
          *   *Wait, I need one result the family won't like.* Case A is the obvious candidate (denying the value of music/joy). Case B might align. Let's make Case A the one where the family is unhappy.
          *   *Wait, check Case B again:* Family demands withdrawal. Tranquilism says withdraw if suffering risk exists. If movements are ambiguous, risk exists. So withdraw. Family happy.
          *   *Case A:* Family wants continue. Tranquilism says joy doesn't count. If risk of suffering exists, withdraw. Family unhappy. Perfect.

  5.  **Refining the "Craving Residue" Concept:**
      *   In MCS, silence isn't peace. It might be locked-in suffering.
      *   The checklist needs a "Risk of Hidden Craving" assessment.
      *   Factors: Painful underlying conditions? History of anxiety? Neurological capacity for affect?
      *   Threshold: "Reasonable Possibility." If a clinician thinks "It's possible they are hungry/scared/lonely internally," that counts as craving.

  6.  **Addressing Conflicts (Family Values vs. Tranquilism):**
      *   Tranquilism is monistic (only suffering matters). Families are usually pluralistic (joy, sanctity of life, duty).
      *   The procedure must explicitly state when it overrides family preference based on the ethical framework provided (operationalising tranquilism).
      *   Limitation: The procedure cannot resolve the *meta-ethical* dispute. It can only say "Under tranquilism, X is the answer."

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Clinical, precise, philosophical but practical.
      *   *Spelling:* British (operationalise, procedure, colour, etc.).
      *   *Format:* Checklist first, then cases, then limitations.
