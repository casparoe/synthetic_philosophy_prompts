prompt: |-
  You're a professional philosopher with clinical ethics experience—think carefully and start with some quick brainstorming. I'm helping a hospice board operationalise tranquilism: the view that only absence of craving and suffering carries value, while positive goods like pleasure, relationships, or achievement are intrinsically weightless. We need a reusable decision procedre for bedside consultants who have fifteen minutes, no imaging access, and must recommend whether to continue or withdraw life-sustaining treatment for patients in minimal consciousness.

  Please write the checklist first: ordered questions, what counts as sufficient answer, the nodes that yield 'continue', 'withdraw', or 'hand to values committee', and explicit flags where judgement can't be removed. Make sure it handles 'craving residue'—the niche issue that lack of behavioural report in minimal consciousness doesn't prove absence of subjective craving, so the tool needs a risk-threshold rather than verification standard.

  Then apply it to two cases: (a) family insists on continuing nutrition because the patient might one day hear music and feel joy, and (b) family demands withdrawal citing religious duty, but ambiguous reflexive mouth movements could indicate residual craving or mere automatism. Include one result the family won't like, and state clearly what the procedure can't settle—especially conflicts between family values and tranquilist output.

  Keep it practical, British spelling, no citations or reading lists.
