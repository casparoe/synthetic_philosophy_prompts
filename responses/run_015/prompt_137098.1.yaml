      *   *Resolution:* Distinguish between the *ensemble* (first-order theories) and the *decision rule* (second-order). The second-order theory is the *algorithm* for combining, not a *member* of the set to be combined.
      *   *Verdict:* It's a category error to put the decision rule in the set of objectives. It's like including "AIC" as a row in the data matrix.

  6.  **Deconstruct Task 5: Residue Report:**
      *   *Clean:* Decision structures, risk aversion, normalization issues, sensitivity analysis.
      *   *Distorted:* "Probability of truth" (imported assumption: moral realism). "Utility" (imported assumption: commensurability).
      *   *Failed:* The concept of a "true system." In ecology, the salmon exist. In morals, does "The Good" exist independently? If not, model averaging is optimizing over a cloud of preferences, not approximating a truth.
