  7.  **Drafting the Response (Iterative refinement for tone and vocabulary):**
      *   *Tone:* Professional, peer-to-peer, rigorous, unsentimental. Avoid philosophical jargon unless defined in ecological terms.
      *   *Vocabulary Check:* Ensure terms like "AIC weights," "structural uncertainty," "minimax regret," "elasticity," "irrelevant alternatives" are used correctly.
      *   *Constraint Check:* No citations. Mark imports. Three grades for residue.
      *   *Specific Focus:* The normalization issue (Task 2) needs careful arithmetic logic. The "Data" issue (Task 3) needs to be blunt.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's different." I need to show *where* the math breaks. For Task 2, I need to explicitly state that Unit-Range normalization violates the Independence of Irrelevant Alternatives (IIA). This is a known property in social choice, but I should frame it as a sensitivity analysis result.
