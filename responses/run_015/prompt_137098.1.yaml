      *   *Maximise Expected Choice-worthiness (MEC):* Equivalent to "Model Averaging" (AIC weights or Bayesian Model Averaging). Decision rule: Maximize $\sum w_i \cdot U_i(action)$, where $w_i$ is the weight (probability) of theory $T_i$ being true.
      *   *Variance-averse/Hedging:* Equivalent to "Mean-Variance Optimization" or "Risk-Averse Utility Function" applied to the distribution of choice-worthiness across theories.
      *   *Deep Uncertainty Alternative:* Since moral truth isn't empirically testable like salmon populations, probabilities might be unjustified. Analogue: "Info-Gap Robustness" or "Minimax Regret." Decision rule: Maximize the horizon of uncertainty $\alpha$ such that performance remains acceptable, or minimize maximum regret across theories.
      *   *Quantities:* Choice-worthiness = Utility/Payoff. Probabilities = Credence weights (subjective, not empirical). Tools = Decision Trees / Ensemble Modeling.

  3.  **Deconstruct Task 2: The Estate Case & Normalization:**
      *   *The Problem:* Theories output "choice-worthiness" on different scales (Utilitarian utils vs. Deontological constraints vs. Partiality scores). You can't sum meters and kilograms.
      *   *Normalization:*
          *   *Unit-Range:* Rescale each theory so $\max - \min = 1$.
          *   *Unit-Variance:* Rescale each theory so $\sigma = 1$ across actions.
      *   *Sensitivity to Irrelevant Alternatives:* In standard decision theory, adding a dominated option shouldn't change the ranking of existing options. In normalization (especially unit-range), adding a "dummy" extreme option changes the scale, potentially flipping the ranking of the viable options.
      *   *Ecological Analogue:* This is like standardizing covariates. If the range of a covariate changes, the coefficient interpretation changes. Here, the "covariate" is the theory's output.
      *   *Verdict:* Unit-range is sensitive to the menu (feasible set). Unit-variance is less sensitive but still depends on the distribution of actions. This indicates a structural flaw in the aggregation method if the "true" scale is unknown.

  4.  **Deconstruct Task 3: The Role of Data (Updating):**
      *   *Ecology:* Weights come from likelihoods $P(Data|Model)$. Models are falsifiable.
      *   *Moral Uncertainty:* There is no "Data" in the empirical sense. No out-of-sample test for "Utilitarianism is true."
      *   *Updating:* Weights shift via argument/reflective equilibrium, not observation.
      *   *Implication:* The "Model Averaging" frame is decorative *if* interpreted as epistemic probability of truth. It survives *if* interpreted as "weight of concern" or "stakeholder weight" (like weighting different management objectives).
