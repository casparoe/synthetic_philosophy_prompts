answer: |-
  Here is the restatement of the moral uncertainty debate translated into your vocabulary, tested against your estate case, with explicit accounting for structural failures and imported assumptions.

  ### One. Translation of Candidate Rules

  You have four candidate decision rules circulating in your group. Here is their translation into ecological decision theory.

  **1. The "My Favorite Theory" Rule**
  *   **Ecological Analogue:** Model Selection. You identify the model with the lowest AIC (or highest posterior probability), treat it as truth, and optimize management actions solely against that model.
  *   **Quantity Maximised:** Expected utility under Model $M_{best}$.
  *   **Probabilities:** None used in the aggregation. Weights are binary (1 for the winner, 0 for others).
  *   **Tool:** Single-model optimization.
  *   **Assumption Imported:** That one moral theory is sufficiently supported to be treated as the "true" system dynamics, ignoring structural uncertainty.

  **2. Maximise Expected Choice-worthiness (MEC)**
  *   **Ecological Analogue:** Bayesian Model Averaging (BMA) or AIC-weighted Ensemble Forecasting. You acknowledge structural uncertainty. You calculate the payoff of each action under every theory, weight those payoffs by your credence (probability) that the theory is true, and sum them.
  *   **Quantity Maximised:** $\sum_{i} w_i \cdot V_i(action)$, where $w_i$ is the weight (credence) of theory $i$, and $V_i$ is the value function of theory $i$.
  *   **Probabilities:** Subjective credences assigned to each theory. In ecology, these come from likelihoods; here, they are priors that do not update via data (see Section Three).
  *   **Tool:** Decision Trees with probabilistic branching at the "Theory" node, deterministic outcomes at the "Action" node.
  *   **Assumption Imported:** **Commensurability.** This assumes $V_i$ outputs numbers on a comparable scale (e.g., "utils"). If Theory 1 outputs "dollars" and Theory 2 outputs "rights violations," the sum is dimensionally invalid.

  **3. Variance-Averse / Hedging Variants**
  *   **Ecological Analogue:** Mean-Variance Optimization or Risk-Sensitive Foraging. You maximise the expected value but penalize the variance of the outcome across the ensemble of theories. Alternatively, you apply a concave utility function to the aggregated choice-worthiness.
  *   **Quantity Maximised:** $E[V] - \lambda \cdot Var(V)$, where $\lambda$ is a risk-aversion coefficient.
  *   **Probabilities:** Same as MEC (credences).
  *   **Tool:** Portfolio Theory / Risk Analysis.
  *   **Assumption Imported:** That variance across moral theories is a risk metric comparable to variance in population size. This treats moral disagreement as environmental stochasticity.

  **4. Deep Uncertainty Alternative (Robust Satisficing / Minimax Regret)**
  *   **Ecological Analogue:** Info-Gap Decision Theory or Minimax Regret. Used when probabilities ($w_i$) cannot be justified (Knightian uncertainty). You do not maximise expectation. You ask: "How wrong can my weights be before this action fails to meet a minimum acceptable threshold?" or "What is the maximum regret I face if I pick this action and a different theory turns out to be correct?"
  *   **Quantity Satisfied:** Robustness ($\hat{\alpha}$): The maximum horizon of uncertainty in weights such that performance remains critical. OR Minimized Maximum Regret.
  *   **Probabilities:** None. Weights are treated as uncertain parameters within a bounded set, not random variables.
  *   **Tool:** Info-Gap Robustness Function / Regret Matrices.
  *   **Assumption Imported:** That there is a "critical threshold" of moral acceptability. This is a management objective, not a truth claim.

  ---

  ### Two. The Estate Case: Normalization and Sensitivity

  We have three actions: $A_W$ (Wetland), $A_H$ (Health), $A_N$ (Niece).
  We have five theories ($T_1$ to $T_5$). $T_1$ through $T_4$ are first-order (Utilitarian, Prioritarian, Partiality, Non-anthropogenic). $T_5$ is the second-order theory (MEC itself). For this section, we average $T_1$ through $T_4$ using the MEC rule ($T_5$ is handled in Section Four).

  **The Scaling Problem**
  $T_1$ (Utilitarian) might rate $A_H$ as +1,000,000 utils (lives saved) and $A_W$ as +100 utils.
  $T_3$ (Partiality) might rate $A_N$ as +10 "family units" and $A_H$ as 0.
  You cannot sum 1,000,000 and 10. The units are arbitrary. You must normalize.

  **Rule A: Unit-Range Normalization**
  For each theory $T_i$, rescale values so the best action is 1 and the worst is 0.
  $V'_{i}(A) = \frac{V_i(A) - \min(V_i)}{\max(V_i) - \min(V_i)}$

  **Rule B: Unit-Variance Normalization**
  For each theory $T_i$, rescale values so the standard deviation across actions is 1.
  $V'_{i}(A) = \frac{V_i(A) - \mu_i}{\sigma_i}$

  **Do they disagree?**
  Yes. If $T_1$ strongly prefers $A_H$ but is indifferent between $A_W$ and $A_N$, Unit-Range forces a spread between $A_W$ and $A_N$ that $T_1$ does not endorse. Unit-Variance preserves the relative distances but loses the absolute magnitude. If $T_1$ thinks $A_H$ is a million times better than $A_W$, Unit-Range compresses this to a factor of 1. Unit-Variance preserves the "signal strength" of $T_1$ relative to its own internal noise.

  **Sensitivity to Irrelevant Alternatives (The Defect)**
  In a properly specified decision tree, adding a dominated option (one you would never choose) should not change the ranking of the viable options.
  *   **Test:** Add $A_B$ (Burn the money).
  *   **Effect on Unit-Range:** For $T_1$, $A_B$ is the new minimum (0). For $T_3$, $A_B$ might also be the minimum. However, if $T_1$ regards $A_B$ as *catastrophically* worse than $A_N$, but $T_3$ regards it as only slightly worse, the *range* of $T_1$ expands massively. This shrinks the normalized score of $A_H$ relative to the other theories.
  *   **Result:** The inclusion of $A_B$ changes the weights of $A_W$ vs $A_H$ in the final aggregate, even if $A_B$ is never selected.
  *   **Diagnosis:** This is a defect in the **Unit-Range normalization**, not necessarily the aggregation idea itself. It violates the Independence of Irrelevant Alternatives (IIA). Unit-Variance is more robust but still sensitive if the "dummy" option is an outlier that inflates $\sigma$.
  *   **Ecological Interpretation:** This is like standardizing a covariate by its range. If you add a single extreme outlier to your dataset, the scaling of all other coefficients changes. It indicates that the "score" is not an intrinsic property of the action, but a relational property of the action *within the menu*.
  *   **Verdict:** If the moral recommendation flips based on whether "Burn the money" is on the menu, the normalisation rule is unstable. This suggests the aggregation is measuring *relative preference within a set* rather than *absolute choice-worthiness*.

  ---

  ### Three. The Role of Data (Updating)

  In your work, model weights ($w_i$) are posteriors. They move because $P(Data|Model)$ differs between models. The system (salmon) provides feedback.

  **The Moral Analogue of Data**
  There is no out-of-sample test for moral theories. You cannot observe "The Good" independently of the theory defining it.
  *   **Observation:** Reflective equilibrium. You check if a theory's output matches your considered judgments on specific cases.
  *   **Shift in Probability:** A weight moves from 0.4 to 0.6 not because of new empirical data, but because of *argumentative coherence*. If $T_1$ implies a conclusion you find intuitively repugnant (e.g., "harvest the niece for organs"), you downgrade $w_1$.
  *   **Updating Mechanism:** This is not Bayesian updating on likelihoods. It is **prior adjustment based on internal consistency checks.**

  **Is the Framing Decorative?**
  *   **Yes, if:** You claim the weights represent the *probability of truth*. Without a truth-maker (a real moral system to measure against), "probability of truth" is a category error. There is no likelihood function $P(Moral\_Intuition|Theory)$.
  *   **No, if:** You interpret the weights as **Stakeholder Weights** or **Weight of Concern**. In multi-criteria decision analysis (MCDA), you weight objectives (e.g., "Economic Yield" vs. "Biodiversity") not by their probability of being true, but by their importance to the decision-maker.
  *   **Conclusion:** The model-averaging frame survives only if you treat moral theories as **competing objectives** rather than **competing hypotheses about reality**. If you treat them as hypotheses, the lack of data makes the "posterior" a fiction. If you treat them as objectives, the weights are normative inputs, not epistemic outputs.

  ---

  ### Four. The Fixed Point (Second-Order Theory)

  You have a set of theories $\{T_1, T_2, T_3, T_4\}$. $T_5$ says: "Act according to the weighted average of $T_1$ through $T_4$."
  Your group wants to average $T_5$ into the set: $\sum_{i=1}^5 w_i V_i$.

  **The Structural Feature**
  This is a **Recursive Definition Error**.
  *   In ecology, this is equivalent to including the "Model Selection Algorithm" as a row in the model ensemble.
  *   $T_5$ is not a model of the system (morality); it is a **decision rule** (the optimizer).
  *   If you include $T_5$ in the average, you need a weight $w_5$. But $T_5$'s output *depends* on the weights of $T_1...T_4$.
  *   Equation: $V_{total} = w_1 V_1 + ... + w_4 V_4 + w_5 (\sum_{j=1}^4 w_j V_j)$.
  *   This collapses into $V_{total} = \sum (w_i + w_5 w_i) V_i$. It simply rescales the weights of the first-order theories.

  **Is it a Confusion?**
  Yes. It is a confusion between the **Objective Function** and the **Solver**.
  *   $T_1...T_4$ define the landscape (the objective function).
  *   $T_5$ defines how to navigate the landscape under uncertainty (the solver).
  *   You do not average the solver with the landscape. You *apply* the solver to the landscape.
  *   **Fixed Point:** The only way $T_5$ creates a fixed point problem is if $T_5$ claims to be the *only* true theory about what to do under uncertainty. If you assign $w_5 < 1$, you are saying "I am not sure I should follow MEC." In that case, you are back to needing a *meta*-rule to average $T_5$ with the others. This leads to infinite regress unless you stop at a rule you simply *adopt* without averaging.
  *   **Vocabulary:** This is **Structural Uncertainty about the Decision Rule itself**. You cannot resolve this by averaging. You must select a decision rule (e.g., "I will use MEC") as a prior commitment, outside the ensemble.

  ---

  ### Five. The Residue Report

  Here is the audit of what translates, what distorts, and what fails.

  **Grade 1: Translates Cleanly**
  *   **Decision Structures:** The logic of decision trees, branching probabilities, and expected value calculations maps perfectly.
  *   **Risk vs. Uncertainty:** The distinction between Risk (known probabilities, MEC) and Deep Uncertainty (unknown probabilities, Info-Gap/Minimax) is structurally identical.
  *   **Normalization Sensitivity:** The problem of comparing scales (utils vs. rights) is mathematically identical to multi-criteria decision analysis in resource management. The IIA violation under Unit-Range normalization is a genuine mathematical defect in the proposed solution.

  **Grade 2: Translates with Distortion (Marked Imports)**
  *   **Imported Assumption:** **Commensurability.** The aggregation $\sum w_i V_i$ requires all $V_i$ to output on a common cardinal scale.
      *   *Distortion:* Some moral theories (e.g., Deontology) explicitly deny this. They deal in constraints (binary: permissible/impermissible), not quantities. Forcing them into a sum distorts their logic from "constraint" to "cost."
      *   *Ecological Equivalent:* Treating a legal harvest limit (hard constraint) as a penalty cost in the objective function. It changes the optimization geometry.
  *   **Imported Assumption:** **Probabilistic Credence.** Treating confidence in a moral theory as a probability $w_i \in [0,1]$.
      *   *Distortion:* In ecology, probabilities sum to 1 because one model must be the best approximation of the *real* system. In morals, if there is no real system, "credence" is just intensity of preference. Calling it "probability" borrows normative force from statistics that isn't there.

  **Grade 3: Cannot Be Expressed (The Failure)**
  *   **The Truth-Maker:** Multi-model inference works because there is a salmon population. The models are false, but the salmon are real. The weights track proximity to the salmon.
      *   *Failure:* In moral uncertainty, there is no "moral population" independent of the theories. If Moral Realism is false (i.e., there is no objective moral truth), then model averaging is not approximating truth; it is **averaging preferences**.
      *   *Your Suspicion:* **On Target.** If there is no truth of the matter, the "posterior probability" of a theory is meaningless. The weights are not epistemic; they are political (negotiating between internal values).
      *   *Consequence:* The entire "Model Averaging" framing is a metaphor, not a method. It borrows the rigor of statistics to dress up a negotiation between conflicting desires. It is not defective *if* understood as MCDA (Multi-Criteria Decision Analysis), but it is defective *if* understood as inference toward a truth.

  **Final Verdict on the Residue**
  The residue indicts the **original debate's expectation of a single ranking**. In ecology, you expect a single best action because the system has a state. In morals, if the "system" is just your own conflicting values, there may be no single ranking, only a Pareto frontier of options where improving one theoretical satisfaction worsens another.
  The model-averaging frame hides this trade-off by collapsing dimensions into a single scalar. It provides a tidy verdict by force (normalization) rather than by discovery. It is a tool for **commitment**, not a tool for **inference**.
