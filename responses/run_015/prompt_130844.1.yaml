  2.  **Deconstruct the "Reasons-First Act":**
      *   Mechanism: Automatic repeal of rules >30 years old unless agency files a 200-word statement of specific present harm.
      *   Justification: Chesterton's Fence (know why it's there before removing) + Modern Epistemology (we can now measure/test reasons).
      *   Burden of Proof: On the keepers of the rule.

  3.  **Address Point 1: Chesterton vs. Burke:**
      *   Chesterton: Don't remove a fence until you know why it was put up. Implies rationality can discover the reason.
      *   Burke: Prejudice, prescription, and latent wisdom. The reason might be *unknowable* or *inarticulable* in rationalist terms. It lives in habit, custom, and complex social equilibrium.
      *   Verdict: The Act satisfies Chesterton's literal test (ask why) but fails Burke's deeper test (some reasons cannot be stated in 200 words). It rationalizes tradition too much.

  4.  **Address Point 2: Evidence-Based Policy/RCTs:**
      *   Reformers say: We can measure now.
      *   Burkean counter: Metrics are themselves value-laden choices. What counts as "harm"? What is measured vs. what is ignored? The "unexamined fence" becomes the methodology. It's turtles all the way down; rationalism cannot ground its own first principles.

  5.  **Address Point 3: Where Burke Concedes:**
      *   Burke wasn't against all reform. He hated abuse and corruption (guild capture).
      *   Concession: Yes, repeal rules that are purely venal or obsolete.
      *   Alternative to 200-word filing: Don't demand *articulated* reason. Demand *prescriptive* endurance. Let the burden be on the remover to prove *safety*, not on the keeper to prove *utility*. Reform slowly, organically, not via automatic sunset clauses.

  6.  **Address Point 4: Partnership of Generations:**
      *   Burke: Society is a partnership between living, dead, and unborn.
      *   Violation: The Act privileges the living's current rationality over the dead's accumulated wisdom and the unborn's inheritance of stability. It assumes the present moment is epistemically superior to the past.
      *   Does it wrong them? Yes, it dissolves the contract by treating inherited institutions as provisional rather than entrusted.

