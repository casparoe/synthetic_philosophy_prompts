answer: |-
  - The precise question
  Standard interpretations cast Bentham as a liberal harm-principle advocate, arguing same-sex acts deserve no punishment because they cause no physical pain. However, this overlooks his acknowledgment of public alarm or disgust as potential sources of pain. The core question is whether Bentham implicitly distinguishes between direct physical harm and symbolic moral contamination to exempt sexual liberty from utilitarian calculation. If he dismisses public disgust as irrelevant, he risks ignoring actual pain (alarm), violating act-utilitarianism. If he counts it, punishment might be justified. Resolving this tension matters because it determines whether Bentham's penal reform rests on consistent act-utilitarian grounds or secretly relies on rule-utilitarian commitments or natural rights language he otherwise rejects. Without clarity, his broader claim that law should only prevent mischief remains ambiguous when applied to victimless crimes involving social norms, specifically undermining the coherence of his legislative theory. This ambiguity complicates modern assessments of his legal philosophy.

  - Approach and method
  Month one involves close textual analysis of Bentham's sexual ethics fragments, cataloging every instance where harm is defined or dismissed. I will map these definitions against his established penal theory principles regarding mischief and alarm. Month two focuses on comparative testing. I will reconstruct the utilitarian calculus for specific sexual offenses, inserting variables for public disgust to see if the math holds for decriminalization under pure act-utilitarianism. I will specifically examine how he quantifies alarm in property crimes to use as a baseline. Simultaneously, I will test a rule-utilitarian hypothesis: does assuming a general rule against interference yield better outcomes than case-by-case calculation? Month three synthesizes findings. I will draft a comparative matrix showing where the sexual ethics arguments diverge from or align with the penal code structure. This involves no external data, only internal logical consistency checks across his conceptual framework. The method avoids biographical speculation, focusing strictly on the architectural coherence of his arguments. I will also isolate specific passages where he addresses secondary mischief to determine if he treats sexual norms differently than property norms. This ensures the analysis remains targeted on the harm-distinction hypothesis rather than drifting into general biography or unrelated ethical claims.

  - What success and failure look like
  Success means producing a reconstructed harm-taxonomy demonstrating whether Bentham's exclusion of sexual morality from penal law is logically consistent with his act-utilitarian premises. A positive outcome shows he categorizes public disgust as non-mischief without violating his calculus. This would validate his reputation as a rigorous logical thinker in ethical matters. A negative but useful outcome exposes an unacknowledged framework shift, proving he implicitly relies on rule-utilitarian commitments. Failure looks like an inability to draw a conclusion because the fragmentary source material is too incomplete to support either reconstruction. If the texts contradict each other without resolution, the project fails to answer the core question. Consequently, the research would not yield a definitive philosophical conclusion. The deliverable must clarify whether his liberal stance is a philosophical necessity or an inconsistent intuition. The output will provide a clear verdict on the coherence of his specific arguments regarding sexual liberty versus his general penal theory.

  - Scope, risks, and deliverable
  Three months part-time is adequate if limited to internal consistency. The biggest obstacle is the fragmentary nature of the sexual ethics manuscripts; if key passages regarding secondary mischief are missing, comparison becomes speculative. The output will be a concise working paper outlining the harm-taxonomy. This helps scholars clarify whether Bentham's liberalism requires modifying standard utilitarian interpretations. The paper details whether his penal philosophy remains stable when applied to social norms versus physical safety. By isolating this theoretical tension, the project delivers a specific contribution to Bentham scholarship on his legislative science coherence. It will also suggest avenues for future archival research.
