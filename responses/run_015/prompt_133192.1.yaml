prompt: |-
  I've been thinking on my own about Jeremy Bentham's defense of sexual liberty—especially his argument that punishing same-sex acts is irrational because they cause no direct physical harm. I'm pitching a small independent research funder for a three-month, part-time project and need a focused proposal. My core question: does Bentham's sexual ethics depend on an unstated distinction between physical harm and what we might call symbolic or moral contamination, and if that distinction is genuinely needed, can it be made consistent with the act-utilitarian calculus he uses in his penal reform writings without secretly importing rule-utilitarian commitments?

  Please structure the response exactly as follows:

  - The precise question (about 150 words): state the problem sharply, explain why the standard reading of Bentham as a straightforward harm-reduction liberal leaves this particular tension unresolved, and clarify why resolving it matters for interpreting his broader penal philosophy.
  - Approach and method (about 200 words): describe the comparative work you would actually do—mapping the structure of harm-claims in his sexual-ethics fragments against those in his better-known penal theory, then testing whether the gap can be closed from either the pure act-utilitarian side or the hidden rule-utilitarian side. Lay out a realistic step-by-step plan across the three months.
  - What success and failure look like (about 150 words): define a useful deliverable—perhaps a reconstructed harm-taxonomy that either saves consistency or exposes an unacknowledged framework shift—and state honestly what would count as failure, including the risk that the fragmentary source material simply will not support either reconstruction.
  - Scope, risks, and deliverable (about 100 words): assess whether three months part-time is adequate, identify the single biggest obstacle that could make the project too large, and describe what finished output would actually help someone working on Bentham's intellectual legacy.

  Do not include citations, bibliographies, reading lists, or verbatim quotations from texts; I will handle all sources myself. Keep the proposal self-contained and answerable without any online search.
