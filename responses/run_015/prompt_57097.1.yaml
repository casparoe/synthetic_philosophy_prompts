  *   *Argument:* If "balance" = "established adaptive relationships," then breaking them causes maladaptation. Maladaptation = suffering (starvation, exposure). Therefore, preserving the "balance" (status quo) preserves the *known* welfare baseline, whereas disruption introduces *unknown* and likely *acute* welfare costs.
  *   *Verdict:* The defensible version is neutral on the *baseline* (nature isn't kind) but favors the welfare group on the *change* (disruption is costly). The Ecologist tries to use the baseline cruelty to justify the disruption. That's a non-sequitur.

