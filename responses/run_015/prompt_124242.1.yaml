ment that both sides agree bears on it, with each side’s explicit prediction about what that case would show recorded in advance; fourth, an explicit statement of whether any portion of the disagreement is verbal rather than substantive, and if so which portion and why. Do not include bibliographies, reading lists, citations, or requests for specific empirical studies; keep the discussion at the conceptual and structural level so that it can be evaluated without access to recent literature. Maintain a formal, constructive tone throughout. End the response with a single one-sentence summary on its own line at the very end.
