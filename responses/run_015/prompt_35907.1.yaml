answer: |-
  # The Induction Inventory: A Diagnostic of Your Predictive Habits

  **Instructions:** Read each scenario carefully. Choose the response that best matches your immediate, gut-level reaction to the situation. Do not worry about consistency between questions; answer each case on its own merits. There are no right or wrong answers, only different ways of navigating the future.

  ### 1. The Thousand-and-First Coin
  You have a coin from a mint you trust. You have flipped it 1,000 times in controlled conditions, and it has landed heads 1,000 times. A stranger offers you a bet: If the 1,001st flip is heads, you win $100. If it is tails, you lose $10.
  *   **A.** I take the bet immediately. The odds are clearly in my favor.
  *   **B.** I refuse the bet. Past flips tell me nothing about the next one.
  *   **C.** I take the bet, but only because I need to make a decision, not because I think I'll win.

  ### 2. The Verdal Stones
  Geologists have examined 5,000 emeralds. Every single one has been green. Define a new property called **"verdal"**: An object is *verdal* if it is green before January 1, 2050, and blue after January 1, 2050. All 5,000 emeralds examined so far are *verdal* (because they are green and today is before 2050). You must place a order for a sensor to detect emeralds in a mine that will open in 2051.
  *   **A.** I calibrate the sensor for green. The stones will still be green.
  *   **B.** I calibrate the sensor for blue. The evidence supports "verdal" just as well as "green."
  *   **C.** I won't calibrate yet. The data doesn't tell me which rule the stones follow.

  ### 3. The Lottery Pump
  A water pump has functioned perfectly every day for ten years. A local definition of **"safe-to-use"** is circulating: A pump is *safe-to-use* if it functions on every day prior to the next national lottery draw. The lottery draw is tomorrow. The pump has worked every day so far. Do you drink the water it pumps today?
  *   **A.** Yes. Its past performance is what matters, not the lottery.
  *   **B.** No. The definition ties its safety to an unrelated event, so the past record is irrelevant.
  *   **C.** Yes, but I acknowledge the word "safe-to-use" is doing a lot of work here.

  ### 4. The Alien Ingot
  Explorers find a metal ingot on a planet with no life and no language. They have never seen this metal before. They strike it once, and it rings. They strike it again, and it rings. They have no name for this metal and no concept of what it "should" do. They prepare to strike it a third time.
  *   **A.** I expect it to ring again. Nature behaves uniformly, even without names.
  *   **B.** I have no expectation. Without a known category, past strikes mean nothing.
  *   **C.** I expect it to ring, but only because I'm imposing my own categories on it.

  ### 5. The Jade Mistake
  For centuries, people called a certain green stone "jade" and assumed it was one kind of mineral. Recently, chemistry revealed "jade" is actually two distinct minerals (jadeite and nephrite) that look alike. Consider the scientists from last century who predicted all future jade would behave like past jade.
  *   **A.** They were rational. They tracked the best patterns available; nature tricked them.
  *   **B.** They were irrational. They assumed a unity that wasn't there.
  *   **C.** They were careless. They should have defined "jade" by chemical structure, not appearance.

  ### 6. The Conflicting Trends
  You are tracking a virus. In Region A, cases drop 10% every week. In Region B, cases rise 10% every week. The national average is flat. You must predict the national total for next month to allocate vaccines.
  *   **A.** I predict the average will hold steady. The data cancels out.
  *   **B.** I pick one region's trend to follow. I have to guess which one dominates.
  *   **C.** I state that the current evidence underdetermines the outcome. Any prediction is a guess.

  ### 7. The Necessary Wager
  Imagine you are forced to make a prediction about the sun rising tomorrow to avoid a penalty. You have no proof it will rise. You simply must choose a course of action.
  *   **A.** I predict it will rise. If any method works, this one does.
  *   **B.** I predict it will rise, but I claim no knowledge, only a habit.
  *   **C.** I refuse to predict. Acting without proof is intellectually dishonest.

  ### 8. The Two Forecasters
  Two meteorologists look at the same data. Forecaster X says there is a 70% chance of rain. Forecaster Y says there is a 30% chance of rain. Both are internally consistent and use valid math.
  *   **A.** One of them is wrong. The world has a single actual propensity for rain.
  *   **B.** Both are rational. Probability is just a measure of their personal confidence.
  *   **C.** Both are useless. Without a causal mechanism, numbers are meaningless.

  ***

  ## Scoring Key

  To find your philosophical profile, look up your answers below and mark the corresponding **Token** next to your answer. Count which Token you collected the most of.

  **Q1:** A = [Realist], B = [Skeptic], C = [Pragmatist]
  **Q2:** A = [Realist], B = [Conventionalist], C = [Skeptic]
  **Q3:** A = [Realist], B = [Conventionalist], C = [Conventionalist]
  **Q4:** A = [Realist], B = [Skeptic], C = [Conventionalist]
  **Q5:** A = [Realist], B = [Popperian], C = [Conventionalist]
  **Q6:** A = [Pragmatist], B = [Bayesian], C = [Skeptic]
  **Q7:** A = [Pragmatist], B = [Skeptic], C = [Popperian]
  **Q8:** A = [Realist], B = [Bayesian], C = [Popperian]

  ### Your Dominant Token

  **If you collected mostly [Skeptic] tokens:**
  **Label:** The Humean Skeptic
  **Awkward Commitment:** You cannot justify why you expect bread to nourish you rather than poison you, yet you eat it anyway.

  **If you collected mostly [Popperian] tokens:**
  **Label:** The Falsificationist
  **Awkward Commitment:** You must claim you never actually believe your best theories are true, only that they haven't failed yet.

  **If you collected mostly [Bayesian] tokens:**
  **Label:** The Subjective Bayesian
  **Awkward Commitment:** You must accept that a crystal-ball gazer is just as rational as a physicist, provided they are consistent.

  **If you collected mostly [Conventionalist] tokens:**
  **Label:** The Entrenchment Conventionalist
  **Awkward Commitment:** You must admit that science succeeds largely because we learned certain words (like "green") before others (like "verdal").

  **If you collected mostly [Realist] tokens:**
  **Label:** The Natural-Kind Realist
  **Awkward Commitment:** You must believe that invisible structures in nature force the visible world to behave consistently.

  **If you collected mostly [Pragmatist] tokens:**
  **Label:** The Reichenbachian Pragmatist
  **Awkward Commitment:** You use a method you admit might be useless, on the grounds that if *any* method works, this one will.

  ***

  ## Limitations Note: Where the Quiz Blurs

  No quiz of eight questions can perfectly map the landscape of epistemology. Two specific pairs of leaves are difficult to distinguish here, and you should interpret your result with that in mind.

  **1. The Subjective Bayesian vs. The Conventionalist**
  *   **Why they blur:** Both views allow for flexibility in how we assign expectations. In Question 8 (The Two Forecasters), a Bayesian chooses Option B (both rational) because rationality is internal coherence. A Conventionalist might also choose B, reasoning that without a fixed linguistic rule, both assignments are permissible conventions.
  *   **The Split:** The quiz attempts to separate them in Question 4 (The Alien Ingot). The Conventionalist (Option C) attributes the expectation to the *imposition of categories*, whereas the Bayesian (not explicitly offered as a distinct option here to save space) would focus on *prior probabilities*. If you found yourself torn between B and C on Question 4, your view likely straddles these two leaves.

  **2. The Humean Skeptic vs. The Popperian**
  *   **Why they blur:** Both deny that observation *confirms* a theory. In Question 1 (The Wager), both might refuse the bet (Option B) on the grounds that past data guarantees nothing.
  *   **The Split:** Question 7 (The Necessary Wager) is the divider. The Humean Skeptic (Option B) acts out of *habit* despite knowing there is no justification. The Popperian (Option C) refuses to act/predict because doing so implies a claim to knowledge they reject. If you chose Option B on Q1 but Option A on Q7, you are likely a Pragmatist leaning Skeptic, rather than a pure Humean.

  ***

  ## Guidance for Residual Patterns

  **The "Common Sense" Cluster**
  Many readers will find they have no dominant token. A common pattern is choosing **[Realist]** on the Wager (Q1) and Alien Ingot (Q4), but **[Skeptic]** or **[Conventionalist]** on the Grue/Verdal case (Q2).
  *   **What this means:** You likely operate on a **Contextual Uniformity** principle. You assume nature is uniform enough for daily life (coins, sunrises) but recognize that linguistic tricks or complex systems (viruses, minerals) can break simple extrapolation.
  *   **Advice:** Do not force yourself into a "leaf." This inconsistency is not a bug; it is a feature of working science. Philosophers seek universal rules; practitioners seek reliable tools. If your answers vary by case, you are likely practicing a healthy, domain-sensitive induction that rigid philosophical labels fail to capture. Continue to treat the "Verdal" case as a warning about language, and the "Coin" case as a license to act.

  **The "Underdetermination" Outlier**
  If you selected the "evidence underdetermines" option (Q2-C or Q6-C) more than twice, you hold a **Radical Underdetermination** view.
  *   **Advice:** Be careful. While logically defensible, this position makes it difficult to explain why you crossed the street this morning without being hit by a car. You may wish to explore the Pragmatist leaf, which allows you to acknowledge underdetermination while still licensing action.
