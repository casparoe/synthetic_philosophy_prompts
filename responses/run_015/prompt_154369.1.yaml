  2. The diagnosis
  This isn't merely verbal, though the word "corruption" is doing heavy lifting. It's primarily a substantive disagreement about the *telos* of public institutions, masked as a definitional fight. When Camp A says "moral economy," they are making a sociological claim: this behavior sustains social cohesion where the state is absent or predatory. When Camp B says "corruption," they are making an institutionalist claim: this behavior diverts resources from public goods to private networks. The verbal layer is real—Camp A uses "corruption" to mean "violation of local reciprocal norms" (which didn't happen), while Camp B uses it to mean "violation of formal fiduciary duty" (which did happen). But beneath that lies a bedrock normative divide about whether impersonal bureaucracy is inherently superior or just one specific cultural technology.

  There is also a hidden empirical disagreement about scale. Camp A observes micro-level stability (the permit got signed, the community gets water). Camp B observes macro-level instability (systemic trust erodes, investment flees). They aren't measuring the same outcome variable. Camp A measures immediate service delivery; Camp B measures institutional resilience. The debate feels stuck because you're arguing about whether a specific transaction is "wrong" without agreeing on whether the *system* enabling that transaction is viable long-term. It's also a conflict between role ethics (what owes a clerk to the state?) versus social ontology (what owes a neighbor to a neighbor?). Until you separate the descriptive claim (this is reciprocity) from the normative claim (this is good for development), you'll keep circling. The "universalizing one institutional ideal" charge is actually a substantive claim about path dependency, not just cultural imperialism. It touches on deep intuitions about whether the state is a neutral arbiter or just another clan member.

  3. What each side is actually saying
  Camp A (Anthro) is arguing from a *social ontology* perspective. They claim that in low-capacity states, the "public office" isn't actually impersonal; it's embedded in kinship or patronage networks. Therefore, the clerk isn't violating their role *within that social context*; they are fulfilling a reciprocal obligation that ensures their own survival and community access. The "moral economy" framing suggests that calling this corruption ignores how these networks function as social insurance against state failure.

