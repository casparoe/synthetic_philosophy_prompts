answer: |-
  Here is the disciplined mapping and the verdict on whether the fiduciary model survives Libya.

  ### The Mapping

  **1. The Trustee**
  Formally, the Trustee is the **Coalition of Member States** acting under Resolution 1973. Operationally, it is **NATO**. In fiduciary terms, this is a *co-trusteeship*. This matters because fiduciary law holds co-trustees jointly and severally liable. If the US, UK, and France drove the policy while Germany sat out, the active trustees bear the liability for the breach, but the institutional trustee (NATO) bears the reputational stain. The model identifies the fragmentation here: a collective trustee with divergent internal interests (Paris wanted Gaddafi gone; Washington wanted to lead from behind) creates an inherent conflict of interest that violates the unity of the fiduciary will.

  **2. The Beneficiary**
  This is your critical pivot point. Resolution 1973 defines the beneficiary narrowly: **"civilians and civilian populated areas under threat of attack."**
  *   *If you stick to this definition:* The trust terminated when the immediate threat to Benghazi was neutralized (late March 2011). Everything NATO did after that (pushing to Tripoli, arming rebels, killing Gaddafi) was *ultra vires* (beyond powers).
  *   *If you expand the definition (as your model requires to make sense of the duty of repair):* The beneficiary is **"the Libyan people as a political community."**
  *   *The Breach:* The interveners acted as if the beneficiary was the *opposition factions* (specifically the NTC), not the civilian population as a whole. By providing close air support for rebel offensives and covert arms, they violated the **duty of impartiality (Incident 4)**. They picked a winner in a civil war. This transforms the fiduciary relationship from one of protection to one of partisan sponsorship.

  **3. The Trust Property**
  The property is not territory (since occupation was excluded); it is **the monopoly on violence and the physical security of the population.** By dismantling the Gaddafi state's monopoly on violence without replacing it, the trustee dissipated the trust property.

  **4. The Breaches**
  *   **Loyalty/No-Conflict (Incident 1):** France and the UK had strategic interests in Mediterranean stability and counter-terrorism that aligned with regime change. The fiduciary model flags this not as "imperialism" (a motive critique) but as a structural conflict of interest. The trustee cannot benefit (strategically) from the administration of the trust.
  *   **Mandate Limits (Incident 2):** "All necessary measures" to protect civilians does not equate to "all measures necessary to win the war." The shift from enforcing a no-fly zone to acting as the air force for the rebellion is a classic deviation from the trust instrument.
  *   **Care and Repair (Incident 3):** This is where the model earns its keep. Under standard R2P, reconstruction is discretionary charity. Under the fiduciary model, because the intervention foreseeably shattered the state's coercive capacity, the **duty of repair is automatic.** The failure to commit to reconstruction is not a policy oversight; it is a breach of fiduciary duty.
  *   **Exit (Incident 5):** The trustees exited when Gaddafi died (their political goal), not when the beneficiaries were secure (the trust purpose). The trust terminated upon the trustee's satisfaction, not the beneficiary's safety.

  ### Does the Model Earn Its Keep?

  **Yes, but only if it bites on the Duty of Repair.**
  If your model stops at "you shouldn't have pursued regime change," it is indeed just the standard "R2P as cover" critique in Latin dress. The standard critique says: *You lied about your motives.* The fiduciary critique says: *You assumed a responsibility you failed to discharge.*

  The model's specific value add is explaining the **BRICS/German abstentions.** Realist accounts say they abstained due to anti-Western alignment or lack of interest. The fiduciary model explains the abstentions as a **foresight of breach.** Brazil's "Responsibility While Protecting" concept emerged directly from this. They saw that the mandate (1973) lacked the mechanisms to enforce the duty of loyalty and the duty of exit. They abstained because the trust instrument was defective: it granted power without securing the correlative duties. The model explains the *legalistic* hesitation of the abstainers better than the *political* hesitation of the realist critique.

  **Where it Misdescribes (The "Smuggling" Worry)**
  You are right to worry about smuggling in a verdict on regime change. The model risks defining "benefit" in a way that presupposes stability over justice. If Gaddafi was genuinely about to massacre Benghazi, does the duty of impartiality forbid aiding the rebels who stopped him?
  *   *Defense:* The fiduciary duty is not to be neutral between *murderer and victim*, but neutral between *factions of the beneficiary population*. Once the immediate massacre threat was paused, aiding one faction to conquer the other became a breach.
  *   *Risk:* The model assumes the "Libyan people" are a coherent beneficiary. In a fragmented society, "the people's benefit" is contested. The trustee inevitably decides who counts as the "real" beneficiary. The model masks this political choice as a technical determination of the trust's purpose.

  ### The Silences

  **(a) Multi-Trustee Collective Action:**
  This is a weakness, not a silence. Fiduciary law handles co-trusteeship by imposing joint liability. The model *should* argue that because NATO is a co-trustee, the failure of one (e.g., US refusing reconstruction funding) implicates all. The model survives here if it insists on **collective liability**. If it allows states to hide behind the NATO banner to avoid repair duties, it fails.

  **(b) The Accountability Forum (The Fatal Flaw):**
  This is the hardest hit. A trust without a court is a moral plea, not a legal structure. In domestic law, the beneficiary can sue. In Libya, the beneficiaries had no standing to sue NATO. The UNSC could have held them to account but didn't.
  *   *Verdict:* You must concede this. The model describes a *normative* structure, not an *institutional* one. It creates a "liability" that currently has no creditor. If you claim it's a legal model, it fails. If you claim it's a political theory of legitimacy, it survives: it delegitimizes the intervention post-hoc, even if it can't punish it.

  **(c) Exit Conditions:**
  You are correct that "fulfilled purposes" is underdetermined. However, the model improves on R2P by shifting the burden of proof. In R2P, the intervener leaves when they want. In the fiduciary model, **the trustee must prove the trust purpose is met.** The silence isn't that the model doesn't say when to leave; it's that it provides no metric for "security." You need to define the *telos* of the trust as "political viability," not just "absence of bombing." If you do that, the exit condition becomes robust: you leave when the state can protect its own civilians.

  ### The Kosovo Test (1999)

  Run Kosovo through the model:
  *   **Authorization:** None. No UNSC resolution.
  *   **Fiduciary Status:** NATO is a **trustee *de son tort*** (one who intermeddles in a trust without appointment).
  *   **Verdict:** In equity, a trustee *de son tort* is held to the *same* duties as an appointed trustee, but often with stricter scrutiny because they assumed the role voluntarily without legal cover.
  *   **Comparison:**
      *   **Libya:** Appointed trustee who breached the trust instrument. (Corruption of the system).
      *   **Kosovo:** Unappointed trustee who assumed the duties. (Usurpation of the system).
  *   **Does the model collapse?** No, it distinguishes them. The model condemns Libya for **betrayal** of the UNSC mandate (breach of loyalty/mandate). It condemns Kosovo for **arrogation** of power (lack of authority), *but* it might judge Kosovo more leniently on the **Duty of Repair**. Because Kosovo was unauthorized, the moral imperative to clean up the mess is arguably *higher* to legitimize the initial trespass.
  *   **The Trap:** If your model says Kosovo is impermissible *solely* because it lacked a mandate, you have just recreated a strict legalist theory of *jus ad bellum* and the "fiduciary" label is doing no work.
  *   **The Fix:** To survive, the model must argue that Kosovo incurred a *heavier* fiduciary burden precisely because it lacked legal cover. The lack of a mandate means the only source of legitimacy was the fidelity to the beneficiary. Therefore, the duty of repair in Kosovo was absolute. The fact that the international community engaged in massive reconstruction in Kosovo (unlike Libya) vindicates the fiduciary intuition: they knew they owed more because they had less authority.

  ### Final Verdict

  Keep the model, but sharpen the blade on **liability**.
  The fiduciary framing survives Libya only if it insists that the **Duty of Repair (Incident 3)** is the price of the license to intervene. If the chapter concludes that "intervention creates a debt," the model is doing work that R2P does not. R2P asks, "Was the intervention justified?" The fiduciary model asks, "What do you owe the people now that you have broken their state?"

  If you cannot solve the **Accountability Forum (Silence B)**, admit it. Frame it as a "legitimacy deficit" rather than a legal breach. The model explains why the Libya intervention feels *wrong* in retrospect even to those who supported it at the time: it violates the intuitive ethics of stewardship. That is enough for political theory, even if it fails as international law.

  **Kosovo Conclusion:** If your model condemns Kosovo as harshly as Libya, you have indeed collapsed into general just war theory. You must argue that Kosovo's unauthorized status triggered a *stricter* duty of repair which was (partially) met, whereas Libya's authorized status triggered a duty of loyalty which was breached. That distinction saves the chapter.
