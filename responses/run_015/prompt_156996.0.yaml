answer: |-
  **The Scenario**

  Governor Alessio of the Valenza Protectorate faces a dual crisis: the Duke of Orla is massing troops on the border, while Valenza's merchant guilds withhold emergency taxes, citing past corruption. Intelligence reveals the Duke's brilliant commander has suddenly fallen ill, leaving the invasion force disorganized for exactly three weeks. Alessio holds enough gold for either a preemptive mercenary strike to cripple Orla's supply lines before they recover, or to fund a decade-long restructuring of the citizen militia and judicial oversight that would secure internal loyalty but leave the borders exposed during the transition. The window for the strike closes when the commander recovers; the reform yields no immediate defensive capability.

  **Reasoning Chains**

  *   **Instrumental-Adaptation (IA):** *Fortuna* here presents a singular, non-reproducible occasion (*occasione*). The enemy's vulnerability is external and temporary; if Alessio waits, the window closes and the state faces a fully organized invasion without having utilized the gift of luck. *Virtù* is the capacity to recognize this momentary imbalance and act with boldness (*impeto*). The strike is endorsed because survival is a prerequisite for reform; a conquered state cannot restructure its militia. Institutional stability is secondary to immediate existential survival.
  *   **Institutional-Domestication (ID):** *Fortuna* here represents the chaos of relying on external contingencies. The enemy's illness is a distraction; true security lies in making the state immune to such fluctuations. *Virtù* is the architectural capacity to reshape the political field so that contingency is channeled. The strike is rejected because it relies on luck (the illness) rather than capacity. The reform is endorsed because it addresses the root cause of vulnerability (internal factionalism) rather than the symptom (the external threat). A state dependent on enemy incompetence is already defeated.

  **Structural Feature and Removal**

  The divergence hinges on the **singular non-reproducibility of the tactical opportunity**. The IA reading values the opportunity precisely because it is fleeting and cannot be manufactured; the ID reading dismisses it because it cannot be institutionalized. If this feature is removed—specifically, if the enemy's vulnerability were **structurally reproducible** (e.g., the enemy faces permanent logistical constraints regardless of leadership)—the interpretations collapse into agreement. Both would endorse the reform: IA because there is no rush to seize a fleeting moment (the opportunity persists), and ID because the structural reform remains the superior path to stability. The dilemma exists only because the opportunity is real but ephemeral.

  **Defense of the Losing Interpretation (Instrumental-Adaptation)**

  A proponent of IA would argue the scenario stacks the deck by treating the strike and the reform as mutually exclusive alternatives in a vacuum. In reality, political capital is cumulative; a successful strike generates the prestige and security necessary to enforce judicial reform, whereas a passive reform period invites internal factions to sabotage the governor before the militia is ready. By framing the strike as mere "opportunism," the scenario ignores that decisive action *is* an institutional act—it establishes the authority required to build institutions. The ID reading assumes stability is possible without power, but in a fragmented polity, power must be seized before it can be structured.
