answer: |-
  # Seminar Plan: The Instability of the Therapy/Enhancement Distinction

  **Course:** Upper-Level Philosophy Seminar (Bioethics/Philosophy of Medicine)
  **Enrollment:** 14 Students
  **Duration:** 75 Minutes
  **Objective:** To phenomenologically disrupt the intuition that "therapy" and "enhancement" are stable biological categories, revealing them instead as products of normative baseline drift and institutional inertia.

  ---

  ## I. Materials Preparation

  1.  **Six Case Cards** (Printed on cardstock, one set per group).
  2.  **Role Sheets** (One per student).
  3.  **Funding Tokens** (30 total: 10 per group).
  4.  **Whiteboard/Projector** (For recording criteria).
  5.  **Silent Vote Slips** (14 small pieces of paper).

  ---

  ## II. Case Cards (Content)

  *Each card contains: Intervention, Pre-Intervention State, Post-Intervention State, Institutional Context.*

  **Case 01: Traumatic Blindness (Familiar/Therapy)**
  *   **Intervention:** Retinal implant surgery.
  *   **Pre-State:** Blindness resulting from industrial accident (2 years ago).
  *   **Post-State:** 20/20 vision restored.
  *   **Context:** Standard emergency medicine. Patient was previously sighted.

  **Case 02: Clinical Anxiety (Familiar/Therapy)**
  *   **Intervention:** SSRI regimen.
  *   **Pre-State:** Debilitating panic attacks preventing employment.
  *   **Post-State:** Affect regulated to statistical average for population.
  *   **Context:** Outpatient psychiatry. Diagnosis meets DSM-5 criteria.

  **Case 03: Cognitive Boost (Familiar/Enhancement)**
  *   **Intervention:** Off-label use of modafinil.
  *   **Pre-State:** Healthy student, no sleep disorder, seeking grade improvement.
  *   **Post-State:** Increased focus and memory retention beyond personal baseline.
  *   **Context:** Private purchase. No medical indication present.

  **Case 04: The Surgeon's Reversal (Baseline-Drift)**
  *   **Intervention:** Surgical removal of cognitive endurance implant.
  *   **Pre-State:** Surgeon possesses state-certified implant (standard in her hospital for 10 years).
  *   **Post-State:** Return to un-augmented cognitive stamina (prone to fatigue after 12 hours).
  *   **Context:** Hospital policy requires the implant for senior staff. Surgeon requests exemption to "feel human again."

  **Case 05: The Musician's Hearing (Baseline-Drift)**
  *   **Intervention:** Dampening of cochlear enhancers.
  *   **Pre-State:** Hearing range extended to 35kHz (mandatory for orchestra certification).
  *   **Post-State:** Return to species-typical hearing range (20kHz).
  *   **Context:** Professional guild requires enhancement for employment. Musician claims "sensory overload" and requests restoration of "natural" limits.

  **Case 06: The Diplomat's Affect (Baseline-Drift)**
  *   **Intervention:** Cessation of voluntary emotional suppression regimen.
  *   **Pre-State:** Emotionally flattened (required for high-clearance negotiation roles).
  *   **Post-State:** Return to pre-service emotional volatility and empathy.
  *   **Context:** Government service mandated suppression for security. Diplomat retired, now seeks "emotional-range therapy" to reconnect with family.

  ---

  ## III. Session Structure (75 Minutes)

  ### 0–10 Minutes: Briefing & Role Assignment

  **Facilitator Script:**
  "Today we are not debating the theory of enhancement. We are enacting the administrative burden of defining it. You will feel the friction of the distinction."

  1.  **Divide Class:** Split 14 students into three groups (Group A: 5 students, Group B: 5 students, Group C: 4 students).
  2.  **Assign Roles:**
      *   **Group A: Clinical Allocators.** Your priority is Patient Autonomy. If the patient wants it and it alleviates suffering, fund it.
      *   **Group B: Regulatory Auditors.** Your priority is Consistency. You must apply one written rule to all cases.
      *   **Group C: Baseline Sceptics.** Your priority is Critique. You must challenge whether the 'normal' state is actually arbitrary.
  3.  **Distribute Materials:** Give each group the 6 Case Cards and 10 Funding Tokens.
  4.  **The Rules:**
      *   **Task:** Classify each case as *Therapy* or *Enhancement*.
      *   **Funding:** Only cases classified unanimously by your group as *Therapy* receive a Token. *Enhancement* receives none.
      *   **The Constraint:** Before classifying Case 01, you must write a **Single-Sentence Criterion** for what counts as Therapy.
      *   **The Penalty:** If you alter your written criterion at any point during the 30 minutes, you **forfeit one Token** from your pool.
      *   **Goal:** Maximize tokens spent on cases you believe deserve care, without losing tokens to penalties.

  ### 10–40 Minutes: Deliberation in Role

  *Students deliberate within their groups. The Facilitator circulates but does not intervene unless a group is stuck on procedure.*

  **Dynamic Expectations:**
  *   **Allocators** will try to fund the Drift Cases (04, 05, 06) based on suffering/autonomy.
  *   **Auditors** will struggle to fit the Drift Cases into the Criterion established for Case 01 (e.g., if "Restoring Species-Typical Function" is the rule, Case 05 becomes Enhancement because the *current* professional norm is enhanced).
  *   **Sceptics** will attempt to force the group to admit the baseline is arbitrary, potentially stalling the process to burn time or force criterion shifts.

  *Facilitator Note:* Watch for the moment a group redefines "Normal" to accommodate the Surgeon or Musician. Note if they treat the *institutional* norm or the *biological* norm as the baseline.

  ### 40–55 Minutes: Reveal & Silent Vote

  1.  **Presentations (10 mins):**
      *   Each group reads their **Final Criterion** aloud. Write them on the board.
      *   Each group announces their **Token Allocation** (Which cases got funded?).
      *   *Prompt:* "Did you lose any tokens due to criterion shifts? Why?"
  2.  **Silent Vote (5 mins):**
      *   Distribute slips.
      *   **Question:** "Did your group apply the *exact same* logical criterion to Case 01 (Blindness) and Case 04 (Surgeon)? Yes/No."
      *   Collect slips. (This captures the private admission of inconsistency that public deliberation often hides).

  ### 55–75 Minutes: Debrief

  **Facilitator Lead:** (See Script Below)

  1.  **Map the Shift (5 mins):**
      *   Reveal the Silent Vote results.
      *   Highlight the Regulatory Auditors' dilemma. Usually, groups classify Case 01 (Blindness) as Therapy (Restoring Function) but Case 04 (Surgeon) as Enhancement (Reducing Capacity), *or* they flip the definition of "Function" mid-stream.
      *   **Point:** "You likely classified the Surgeon's reversal as 'enhancement suppression' and the Musician's as 'therapy' (or vice versa), despite identical logical structures. Why?"

  2.  **Normative Baseline Drift (5 mins):**
      *   Explain that "Normal Functioning" is not a biological fixed point. It is a moving target defined by institutional norms.
      *   In Case 04, the hospital norm *is* the implant. To remove it is to become 'disabled' relative to the professional baseline.
      *   In Case 05, the Guild norm *is* enhanced hearing. To return to 20kHz is to become 'impaired' relative to the professional baseline.

  3.  **Species-Typical Functioning (5 mins):**
      *   Address the Baseline Sceptics' role.
      *   **Point:** "When you appealed to 'species-typical functioning' to fund the Musician, you smuggled in a statistical norm. But if 90% of surgeons have implants, is the implant now species-typical for that context? The Sceptics should have exposed that 'natural' is just a prior state of enhancement adoption."

  4.  **Institutional Inertia (5 mins):**
      *   **Facilitator Input:** "This activity revealed micro-level arbitrariness. It could not reproduce the macro-level inertia. In reality, the Surgeon's implant became 'therapy' over 20 years, not 30 minutes. Laws changed. Insurance codes changed. The 'enhancement' became the 'standard of care' silently."
      *   **Closing Question:** "If the distinction is this unstable, do we abandon it? Or do we admit it is purely a tool for resource allocation, not moral truth?"

  ---

  ## IV. Facilitator Notes & Troubleshooting

  **1. The "Criterion Trap"**
  *   *Risk:* Groups write a vague criterion like "Help the patient" to avoid penalties.
  *   *Intervention:* During the 10-minute briefing, insist the criterion must be *falsifiable*. Example: "Interventions that restore species-typical function" is falsifiable. "Interventions that help" is not.
  *   *Debrief Use:* If they write a vague criterion, point out that vagueness is the primary mechanism by which the therapy/enhancement distinction survives in policy—it collapses under scrutiny.

  **2. The Surgeon vs. Musician Asymmetry**
  *   *Observation:* Students often treat the Surgeon's removal of an implant as "becoming disabled" (Enhancement loss) but the Musician's return to natural hearing as "healing" (Therapy).
  *   *Debrief Use:* Press this hard. "Both are returning to a biological baseline. Both are deviating from a professional norm. Why did you fund one and not the other?" This reveals that our intuition of "health" is tied to how much we *value* the specific capacity (hearing vs. stamina).

  **3. Time Management**
  *   The Deliberation (10-40) is the engine. Do not let the Briefing overrun. Use a visible timer.
  *   If groups finish early, do not let them stop. Ask them: "Draft a policy memo explaining why Case 06 is not covered." This forces them to articulate the exclusion.

  **4. Handling the "Historical Dimension"**
  *   The prompt specifies the facilitator must supply the historical dimension verbally.
  *   *Script:* "In this room, you changed the rules in 30 minutes. In the real world, the 'cognitive implant' started as an enhancement in 2030, became 'occupational safety gear' in 2040, and became 'standard of care' in 2050. By the time the Surgeon wanted it out, the insurance code had already been rewritten to call removal 'elective reduction.' You felt the arbitrariness; history hides it under bureaucracy."

  **5. Role Imbalance**
  *   With 14 students, groups will be 5-5-4.
  *   Ensure the **Baseline Sceptics** (Group C) don't just say "everything is arbitrary" and refuse to play. Their instruction is to *challenge*, not *obstruct*. They must force the group to justify the baseline, not prevent funding entirely.

  ---

  ## V. Role Sheets (Text for Handouts)

  **Role: Clinical Allocator**
  *   **Mandate:** Defend Patient Autonomy.
  *   **Goal:** Maximize funding for interventions that alleviate subjective suffering or fulfill patient desire.
  *   **Tension:** You want to fund the Drift Cases (04, 05, 06) because the patients are suffering. But you must agree on a Criterion with your Auditors.
  *   **Strategy:** Push for broad definitions of "Therapy" (e.g., "Restoring the life the patient values").

  **Role: Regulatory Auditor**
  *   **Mandate:** Apply One Consistent Written Criterion.
  *   **Goal:** Maintain logical consistency across all 6 cases.
  *   **Tension:** If you fund Case 01 (Blindness) based on "Restoring Natural Function," you logically cannot fund Case 05 (Musician) if "Natural" means "Species-Typical," because the Musician is *leaving* the professional norm.
  *   **Strategy:** Write the Criterion carefully. Monitor the group for "criterion drift." Enforce the token penalty.

  **Role: Baseline Sceptic**
  *   **Mandate:** Challenge the Arbitrariness of the Baseline.
  *   **Goal:** Expose that "Normal" is a social construct.
  *   **Tension:** If you prove the baseline is arbitrary, the group cannot write a Criterion, and they lose tokens. You must challenge without paralyzing the group.
  *   **Strategy:** Ask: "Normal for whom?" "When did this become the norm?" "Is biology the only baseline?"
