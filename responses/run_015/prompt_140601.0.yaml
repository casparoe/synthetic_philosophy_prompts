  **[Margin:]** **Careful.** The prompt asks which claim the *example* is standardly used to target. Historically/conceptually, Buridan's Ass targets CAPACITY (psychological paralysis). Rankin and Ostrow offer *dissolutions* that set Capacity aside, but the paradox itself targets the link between indifference and inability. You've conflated the readings' solutions with the paradox's target.

