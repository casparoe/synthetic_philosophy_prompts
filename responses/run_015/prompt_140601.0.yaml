  ### Margin Comments

  **Part (a)**
  > *"Ostrow... claim under attack is NO-PERMISSION"*
  **[Margin:]** Correct. Ostrow explicitly argues that permissibility does not require being singled out.

  > *"Rankin... committed to rejecting the REASON claim: he thinks the ass does have a reason to go to each bale... and that is why he thinks an arbitrary pick is defective."*
  **[Margin:]** **Problem.** If Rankin thinks there *is* a reason to go to bale A, why is picking A "defective"? A rational action supported by a reason is not defective. Rankin's view (as stated in the prompt) is that the reason "eat some bale" is insufficient to justify *this* bale. This implies there is *no* sufficient reason for A specifically. Therefore, Rankin *accepts* the REASON claim (no preference = no reason for specific action) but denies action is permissible without one. You have Rankin's commitment backward.

