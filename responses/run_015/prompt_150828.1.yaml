          *   *Analysis:* Marisol shifts from personal standing to *representative* standing. A critic speaks for the readers/norm, not themselves. This counters Dev's "personal authority" claim. The "credibility discount" point is pragmatic.
          *   *Verdict:* Right. This is the strongest counter to Dev. Journalism is institutional, not just personal.
