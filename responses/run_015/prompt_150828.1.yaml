      *   **Dev's Position:** Hypocrisy undermines standing because blame is a moral address requiring authority/commitment. It's about forward-looking commitment, not just past acts. Institutional hypocrisy matters ("laundered standing").
      *   **Marisol's Position:** Hypocrisy (in the sense of personal violation) doesn't kill standing if the norm is accepted (weakness of will vs. rejection). Blame can be representative (on behalf of the community). Institutional aggregation leads to absurdity (readers are hypocrites too). Nadia has since criticized her own shop (even-handedness).

  3.  **Evaluate the Six Moves:**

      *   **Move 1 (Dev): Blame as Moral Address/Authority.**
          *   *Analysis:* This is a standard philosophical view (e.g., Wallace, Bell). Blame isn't just stating a fact; it's holding someone accountable. If you exempt yourself, the authority is compromised.
          *   *Verdict:* Right. It captures the distinctiveness of *blame* vs. *criticism*.
          *   *Confidence:* High.

      *   **Move 2 (Marisol): Weakness of Will vs. Rejection.**
          *   *Analysis:* Crucial distinction. If Nadia *fought* the May story internally, she accepts the norm. Hypocrisy usually implies *rejecting* the norm for oneself while enforcing it on others. If she tried to stop it, she isn't a hypocrite in the strong sense.
          *   *Verdict:* Right. This is the strongest defense of Nadia.
