      *   **Binary vs. Scalar:** Standing is almost certainly scalar in practice (credibility), though some philosophers argue it's binary (infelicity). For a magazine column, scalar is more useful. It implies the response should be proportional (acknowledge the tension, don't just dismiss).

  7.  **Drafting the Adjudication:**
