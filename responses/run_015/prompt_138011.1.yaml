  4.  **Addressing the Complications:**

      *   *Complication 1 (Two Truths):* If conventional truth is *truth*, does the directive stand?
          *   Analysis: Yes, conventionally. But the user asks if there's a reading where it's conventionally true she wrote it, but *nothing gives it authority*.
