          *   Collateral: Undermines first-person authority, but not third-person accountability.

      *   *Claim 6 (Metasemantic):* "'I' refers to nothing but functions indexically to locate experience."
          *   Status: Substantive/Linguistic.
          *   Impact: No dissolution. Indexicals still pick out the causal stream relevant to the directive.
