      *(Refining the "Status" categories)*: The prompt asks for "close to trivial, substantive and defensible, or false or incoherent." I must use these or clearly map to them.
      *(Refining the "Collateral" section)*: Make sure to mention prudential concern, promises, resentment, intention as requested.

      *Let's check the Complication 1 logic again.*
      If conventional truth is truth, then "She wrote the directive" is true. "The directive has authority" is also a conventional truth. If the group member says "No self -> No authority," they are implying that authority requires *ultimate* existence. If Two Truths holds, authority only requires *conventional* existence. So, can we have a convention where past directives lack authority? Yes. But does "no self" *force* that? No. So the move is non-sequitur unless they argue that *only* ultimate existence grants authority (which contradicts Two Truths). I need to articulate this tension.

      *Let's check Complication 2 logic.*
      If "no self" dissolves the obligation to the past self, does it dissolve karmic obligation? Karma is cause/effect across time. If the dementia patient is not the "same" as the past writer, does the karma transfer? Buddhist orthodoxy says yes (causal continuity). If the group member uses "no self" to sever the link, they break karma. I need to highlight this tension.

