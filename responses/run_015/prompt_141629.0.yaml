answer: |-
  **The implicit theory**

  The provocation doctrine presupposes a hybrid theory of emotion that I'll call the "Disruptive Appraisal View." It treats emotions as cognitive states that trigger non-cognitive physiological surges. Condition (a) and (c) require the emotion to be about something specific (an insult, a witnessing of adultery) and assessable against a social standard. This implies emotions are partly judgements or perceptions of value; you can't be provoked by nothing, and some provocations are objectively insufficient. However, Condition (d)—the cooling-off period—treats the emotion as a physiological quantity that decays independently of reasoning. If emotion were purely a judgement, it would last as long as the belief lasted. The law assumes the "heat" has a half-life. So, the doctrine needs emotions to be reason-responsive enough to be evaluated, but mechanistic enough to fade on a timer. **[Note: This reconstruction assumes the textbook version holds; if a jurisdiction drops the suddenness requirement, the physiological element becomes less central, pushing the theory closer to pure cognitivism.]** Ultimately, the law views emotion as a temporary incapacity caused by a socially intelligible trigger. It is an excuse based on diminished capacity, but only if that capacity was diminished by something the community recognizes as overwhelming.

  **What it strictly needs vs. what it merely sits well with**

  The doctrine strictly needs two things: temporal boundedness and external responsiveness. Without temporal boundedness (d), the distinction between murder and manslaughter collapses into a permanent state of grievance. Without external responsiveness (a), the emotion becomes idiosyncratic rather than provoked. These are structural necessities. By contrast, the "reasonable person" standard (c) merely sits well with cognitive theories; it doesn't strictly require them. One could argue a "reasonable person" has a certain physiological threshold for pain or shock without implying they made a judgement. **[I'm less confident here; it's possible the normative element strictly requires a cognitive view, but a biological normativity is conceivable.]** The law needs the emotion to be a reaction, and it needs that reaction to fade. Whether that reaction is constituted by a judgement or a feeling is secondary to the fact that it must be triggered and time-limited. The strict needs are about the contour of the episode, not its metaphysical constitution.

  **Where several theories would license the same doctrine**

  Condition (b)—that the defendant was actually provoked—is theory-neutral. Both the Judgement View and the Feeling View can account for the fact that an internal state occurred. A feeling theorist says the defendant felt a surge; a judgement theorist says they formed a belief about being wronged. Both agree the state existed. Furthermore, both views can accommodate the idea that some triggers are more potent than others. A feeling theorist can admit some stimuli cause stronger reflexes; a judgement theorist can admit some wrongs are greater. **[Guessing: This overlap might be narrower than it appears.]** Consequently, the mere existence of the emotion and its trigger does not force a choice between the three standard theories. The doctrine only forces a theoretical choice when it moves from describing the emotion to regulating its duration and normative status. The overlap exists where the law is descriptive; the divergence happens where the law is prescriptive.

  **Counterfactual doctrine**

  If we adopted a pure Judgement View, the cooling-off period (d) would vanish. If emotion is a judgement about value (e.g., "I have been wronged"), then killing is justified or excused as long as the judgement holds. Time shouldn't matter; if the wrong remains unaddressed, the judgement persists. The doctrine would shift from excuse to justification. Conversely, under a pure Feeling View, the "reasonable person" standard (c) becomes incoherent. Feelings aren't reasonable or unreasonable; they are just strong or weak. The law would become purely medical: was the physiological surge too intense for any human body to control? **[Speculative: This might turn provocation into an insanity defense.]** The current doctrine sits between these: it says the feeling was understandable (judgement) but the loss of control was temporary (feeling). A pure view on either side breaks the hybrid mechanism that allows for partial excuse rather than full justification or full liability.

  **On the time-shape idea**

  Your idea about emotions as episodes with a characteristic shape is compelling, but I suspect it is a normative layer on top of the cognitive view, not a metaphysical fourth option. It suggests that part of having an emotion is being responsible for its duration. If you hold onto anger too long, you are no longer "being provoked"; you are "being vindictive." This isn't a new theory of what emotion *is*, but a theory of when emotion *ends* for responsibility purposes. **[Confident: This seems right.]** It disguises itself as a temporal claim but is actually about agency. It says the passive phase of emotion (where you are overcome) has a limit, after which the active phase (where you choose to maintain the state) begins. This fits the cognitive view perfectly: you are responsible for revising your judgements. So, it's not a fourth option, but a crucial refinement of how cognitive theories handle time. It explains why waiting matters: waiting is the opportunity to resume agency.

  **Where I'd change my mind**

  I would change my mind if convinced that the law is purely pragmatic and committed to no theory of emotion at all. My reconstruction assumes the law tries to be metaphysically consistent. But legal doctrines often evolve as patchworks of policy, not philosophy. **[Biggest vulnerability: This.]** If the cooling-off period is just a proxy for "malice aforethought" rather than a claim about emotional decay, then my hybrid theory is over-intellectualizing a rule of evidence. Additionally, if jurisdictions that dropped the suddenness requirement still function without collapsing into the Judgement View, then the physiological element isn't necessary. I'm most likely to crack on the question of whether the law cares about what emotions *are* versus how we *manage* them. If the latter, the theory of emotion is irrelevant, and the doctrine is just about drawing a bright line for jury convenience.
