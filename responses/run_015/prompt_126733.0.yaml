answer: |-
  ### Desiderata: Cases the Framework Must Handle

  To function as policy guidance rather than philosophical taxonomy, the framework must resolve specific edge cases where standard metrics fail.

  **1. The "Behavioral Masking" Problem (High-Density Shrimp/Crustaceans)**
  *   **Case:** In high-density ponds, chronic stress leads to lethargy and suppression of agonistic behavior. An audit measuring "absence of aggression" or "normal swimming" scores these populations as high-welfare.
  *   **Requirement:** The framework must mandate physiological biomarkers (e.g., hemolymph lactate, cortisol analogs, oxidative stress markers) that function independently of behavioral output. It cannot rely solely on behavioral ethograms.
  *   **Why:** Behavioral silence is not welfare; it is often shutdown. Policy based on observation alone incentivizes stocking densities that induce learned helplessness.

  **2. Validation of Stunning/Killing Methods Across Taxa (Crabs/Lobsters)**
  *   **Case:** Ice-slurry is standard but causes slow thermal shock and asphyxiation; electrical stunning is instant but requires specific frequencies to ensure insensibility before cramping.
  *   **Requirement:** The framework must define "death" or "irreversible unconsciousness" based on neural cessation specific to the organism's nervous system topology, not mammalian brain-death standards.
  *   **Why:** Applying mammalian time-to-death standards to decapods ignores their distributed ganglia. A crab may appear motionless while peripheral ganglia still process nociceptive input.

  **3. Nociception Without Mammalian Pain Behaviors (Teleosts)**
  *   **Case:** Fish possess nociceptors and show trade-off decisions (e.g., rubbing lips against tank walls after acid exposure) but do not vocalize or guard injuries like mammals.
  *   **Requirement:** The framework must weigh neuroanatomical capacity (presence of A-delta/C fibers, opioid receptors) and motivational trade-offs equally with overt pain expression.
  *   **Why:** Relying on anthropomorphic pain behaviors creates a false negative for fish welfare, permitting procedures that trigger nociceptive pathways simply because the animal doesn't "look" like it hurts.

  **4. Welfare Debt in Supply Chains (Wild-Capture Broodstock)**
  *   **Case:** Many aquaculture systems (e.g., tuna fattening, some shrimp) rely on wild-caught juveniles or broodstock subjected to high-stress capture before entering the "farm."
  *   **Requirement:** The framework must account for cumulative welfare impact across the lifecycle, not just the period under direct farm control.
  *   **Why:** Policy that regulates only the farm gate allows the outsourcing of suffering to the capture sector, negating net welfare gains.

  **5. Distributional Sensitivity (Population vs. Individual)**
  *   **Case:** A tank has 99% healthy fish and 1% suffering severe spinal deformities or ulcerations. Mortality rates are low.
  *   **Requirement:** The framework must include thresholds for individual severe suffering that trigger intervention regardless of population averages.
  *   **Why:** Aggregate metrics (like Feed Conversion Ratio or total mortality) mask severe morbidity in subsets. Policy must prevent "acceptable loss" calculations from justifying intense individual suffering.

  ---

  ### Distinctions The Framework Cannot Collapse

  **1. Sentience vs. Moral Status**
  *   **Distinction:** Sentience is the biological capacity to experience states (scientific claim). Moral Status is the weight given to those experiences in policy (ethical claim).
  *   **Classification:** **Non-Negotiable.**
  *   **Reasoning:** Conflating them leads to policy paralysis. Science can determine if a shrimp processes noxious stimuli; it cannot determine if that processing warrants a ban on boiling. The framework must establish sentience thresholds separately from the regulatory consequences.

  **2. Welfare vs. Ecological Sustainability**
  *   **Distinction:** High-welfare systems (e.g., low density, high water exchange) often have higher environmental footprints. Low-impact systems (e.g., biofloc) may restrict natural behavior.
  *   **Classification:** **Non-Negotiable.**
  *   **Reasoning:** Collapsing these leads to "greenwashing" where environmental efficiency is sold as animal welfare, or vice versa. They are often competing constraints that policy must balance, not equate.

  **3. Individual vs. Aggregate Suffering**
  *   **Distinction:** Utilitarian aggregation (total suffering) vs. Prioritarian focus (worst-off individual).
  *   **Classification:** **Camp Preference.**
  *   **Reasoning:** *Industry Pragmatists* prefer aggregate metrics (mortality rates) for feasibility. *Animal-Rights Absolutists* demand individual protections (no deformities allowed). *Conservation Biologists* often side with aggregates to ensure species survival/supply. The framework must declare which axis it prioritizes; it cannot claim to do both simultaneously without contradiction.

  **4. Natural-Behavior Norms vs. Indoor Feasibility**
  *   **Distinction:** Welfare defined by ability to perform evolved behaviors vs. welfare defined by absence of suffering in confinement.
  *   **Classification:** **Camp Preference / Trade-off.**
  *   **Reasoning:** In Recirculating Aquaculture Systems (RAS), "natural" foraging or migration is impossible. *Ethologists* demand behavioral proxies; *Industry* demands physiological stability. A policy framework must choose: is welfare "living naturally" or "not suffering in captivity"?

  ---

  ### Jointly Unsatisfiable Subsets (Where the List Breaks)

  There are specific combinations of desiderata that appear logically incompatible under current technological and economic constraints.

  **1. The "Auditability vs. Validity" Tension**
  *   **Conflict:** *Must rely on observable behavior* (for cost-effective auditing) **AND** *Must catch chronic stress in decapods* (which suppresses behavior).
  *   **Breakdown:** You cannot have a low-cost, behavior-based audit that accurately detects chronic stress in crustaceans. If the framework mandates behavioral audits, it will fail the biological validity test. If it mandates physiological testing, it becomes too expensive for widespread policy enforcement.
  *   **Resolution:** Requires admitting that high-frequency auditing will be a proxy with known error rates, or that welfare assurance becomes a luxury good.

  **2. The "Natural Behavior vs. Industrial Scale" Tension**
  *   **Conflict:** *Must respect natural behavior* **AND** *Must apply to high-density indoor shrimp farming*.
  *   **Breakdown:** Shrimp are territorial or require specific substrate interactions in the wild. High-density indoor farming inherently precludes these. You cannot satisfy ethological needs at industrial stocking densities.
  *   **Resolution:** The framework must abandon "natural behavior" as a primary metric for high-density species and shift entirely to "absence of pathology/stress," effectively redefining welfare for aquaculture distinct from wild contexts.

  **3. The "Precaution vs. Proof" Tension**
  *   **Conflict:** *Must apply precautionary principle to sentience* (treat as sentient until proven otherwise) **AND** *Must not contradict stress physiology* (which requires invasive sampling to prove distress).
  *   **Breakdown:** Applying precaution to decapods implies banning practices like ice-slurry. However, proving the physiological damage of ice-slurry requires killing the animal to assay tissues, which contradicts the welfare goal.
  *   **Resolution:** Policy must rely on neuroanatomical proxies rather than physiological proof, accepting that some "welfare protections" may be biologically conservative estimates.

  ---

  ### Framework Scoring (Weak Points Only)

  **1. Five Domains Model**
  *   **Weak Point:** Heavily reliant on mammalian "affective state" inference. It struggles to score "Mental State" in decapods where behavioral indicators of emotion are ambiguous or non-existent. It risks anthropomorphizing fish affective states without sufficient neurobiological grounding.

  **2. Welfare Quality® Protocols**
  *   **Weak Point:** Designed for terrestrial livestock. Its reliance on specific behavioral tests (e.g., avoidance distance, specific postures) fails in aquatic environments where visibility is low and behavior is fluid. It lacks metrics for water quality parameters that directly correlate to nociception (e.g., dissolved oxygen spikes causing gas bubble disease).

  **3. Recent Decapod Sentience Frameworks (e.g., LSE/Gray et al.)**
  *   **Weak Point:** Strong on neurobiology and sentience classification, but weak on *operationalization*. They determine *if* a crab is sentient, but offer little guidance on *how* to measure welfare in a running farm. They lack the "management indicator" layer required for policy enforcement.

  ---

  ### Biological Constraints (Must Not Contradict)

  To maintain scientific credibility, the framework cannot contradict established physiological and neurological findings.

  **1. Salmonid Stress Physiology (Allostatic Load)**
  *   **Constraint:** The framework cannot treat all cortisol elevation as a welfare failure.
  *   **Reasoning:** Acute cortisol spikes are adaptive (eustress) during handling or feeding. Only chronic elevation or failure to return to baseline indicates distress. A framework that penalizes any stress response makes farming biologically impossible.

  **2. Decapod Nervous System Organization (Distributed Ganglia)**
  *   **Constraint:** The framework cannot assume a centralized brain controls all sensation.
  *   **Reasoning:** Decapods have sub-esophageal ganglia that can process nociception independently of the brain. Stunning methods that target only the cephalic region may leave the body sensitive. Policy must mandate whole-body stunning or rapid destruction of all major ganglia.

  **3. Teleost Nociceptor Distribution**
  *   **Constraint:** The framework cannot assume nociceptors are limited to the mouth or head.
  *   **Reasoning:** Fish have nociceptors distributed over the body surface. Procedures that clamp or abrade the flank (e.g., grading machines) trigger pain pathways even if the head is untouched. Welfare metrics must account for whole-body mechanical interaction, not just head trauma.
