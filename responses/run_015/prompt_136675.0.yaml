  **Task Instruction: Clinical Ethics Committee Decision Procedure Design (Tranquilist Framework)**

  **Role:** You serve as a member of a clinical ethics committee that has adopted a strict tranquilist ethical framework.

  **Framework Definition:**
  Under this framework, the only intrinsic moral goods are:
  1.  The absence of suffering (First-Order Suffering).
  2.  The absence of craving (First-Order Craving).

  All other values (continued life, autonomy, dignity, relational presence, narrative coherence) are instrumentally relevant *only* when they causally affect these two dimensions. You must treat the following as distinct analytical categories:
  *   **First-Order Suffering (FOS):** Present, experienced distress or pain.
  *   **First-Order Craving (FOC):** Present desire for a state of affairs to differ from what it is (includes appetitive craving for something present and aversive craving for something absent).
  *   **Second-Order Craving (SOC):** A desire about one's own first-order mental states (e.g., craving the cessation of suffering, or craving to preserve a particular craving).
  *   **Latent/Dispositional Craving (LDC):** Tendencies to suffer or crave that are not currently manifest but would manifest if conditions change (e.g., in a temporarily unconscious patient).

  **Objective:**
  Design a practical, ordered decision procedure (rendered as a checklist or flowchart in prose) that a clinician or ethics officer could run on any proposed intervention without requiring philosophical expertise. Then, apply this procedure to three specific case proposals.

  **Part 1: Procedure Design Requirements**
  Your procedure must be structured as a series of steps. For each step, specify:
  1.  **The Precise Question:** What must be answered?
  2.  **Sufficient Answer Criteria:** What counts as a valid answer, including any operational definitions you invent (e.g., "Net Tranquilist Balance").
  3.  **Evidence Type:** Whether the answer must be factual, clinical, or values-based.
  4.  **Branching Logic:** Whether to proceed, stop with a recommendation, or hand off to a non-tranquilist authority.

  The procedure must explicitly:
  *   Distinguish the four tranquilist categories (FOS, FOC, SOC, LDC) as separate dimensions.
  *   Identify where tranquilism yields an unambiguous recommendation (Yes, No, Modify) based solely on the net effect on the four categories.
  *   Identify exact points where the procedure must halt and hand the decision to a non-tranquilist authority (family, legal guardian, law) because tranquilism is silent (e.g., if the net effect is neutral or if non-tranquilist values are invoked by stakeholders).
  *   Include a **Mechanical Misfire Warning**: Describe a case type where rigorous application produces a recommendation that conflicts with widespread clinical intuition, state what that recommendation is, and explain why the framework still demands it.
  *   Flag any judgment calls that are disguised as procedural steps.

  **Part 2: Case Application**
  Apply your procedure to the following three proposals. For each case, run the steps in order, report where the procedure stops, state the tranquilist recommendation (if any), note any hand-offs, and flag any misfire risk.

  *   **Case A:** A conscious, terminally ill patient requests withdrawal of artificial hydration. The patient reports no physical pain, but describes an intense, persistent appetitive craving for a future event (a family milestone) that they will not live to see. Withdrawal would hasten death and eliminate all future mental states.
  *   **Case B:** A deeply sedated, non-responsive patient is receiving a continuous infusion that suppresses all first-order suffering and craving, but also suppresses respiratory drive, extending a state of unconsciousness with no prospect of recovery. The family requests that the infusion be continued indefinitely because they value being present at the bedside. Discontinuation would likely result in death within hours, with no evidence that the patient would experience suffering or craving during the brief transition.
  *   **Case C:** A proposal to introduce continuous loud instrumental music into a dementia-care ward, based on evidence that it reduces craving-driven wandering and vocalization in approximately 70 percent of residents, but causes mild, persistent headache (first-order suffering) in approximately 30 percent of residents, with no way to predict individual response in advance.

  **Constraints:**
  *   Do not ask for bibliographies, reading lists, or citations to named philosophers or texts.
  *   Do not refer to highly obscure technical literature.
  *   You may invent or formalize operational terms (e.g., "Net Tranquilist Balance," "Latent Disposition Check") provided they are defined within your response.
  *   Maintain a formal, instructional tone suitable for clinical use.
  *   Ensure the distinction between tranquilist mandates and non-tranquilist hand-offs is explicit.

  **Output Format:**
  Provide the procedure first, followed by the case applications. Ensure all required elements (categories, hand-offs, misfire warning, judgment flags) are clearly labeled.
