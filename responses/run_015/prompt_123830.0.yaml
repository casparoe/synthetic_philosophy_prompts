  **AXIOMATIC HOLDINGS**
  **GLOBAL COMPLIANCE DIVISION**
  **POLICY DOCUMENT 88-B: MORAL LUCK-ADJUSTED ACCOUNTABILITY FRAMEWORK (MLAAF)**

  **1.0 PURPOSE AND SCOPE**
  This framework establishes protocols for isolating pure agency from stochastic variance in performance metrics. While philosophical consensus on agency remains fluid, Axiomatic Holdings adopts the following operational definitions to ensure disciplinary proceedings and bonus allocations reflect only actions fully within the employee's control. The MLAAF mitigates liability arising from unearned advantage or disadvantage.

  **2.0 TYPE-C CIRCUMSTANTIAL FORTUNE VARIABLES**
  Employees are frequently subjected to external conditions beyond their selection. Type-C Circumstantial Fortune Variables include market volatility, supply chain disruptions, and unexpected regulatory shifts. When calculating Situational Blame Ratings, Compliance Officers must subtract the probability of failure inherent to the situation itself. If an employee encounters a scenario where failure was statistically probable regardless of intervention, culpability is reduced proportionally. However, employees must document all circumstantial variables prior to engagement; failure to anticipate circumstantial luck is itself considered a controllable negligence event.

  **4.0 CONSTITUTIVE FORTUNE ADJUSTMENTS**
  Constitutive luck refers to traits inherent to the employee, including temperament, intelligence, and upbringing. Under Section 4.1, Character-Based Evaluations are discounted when those traits lie outside the employee's control. An employee cannot receive commendation for natural diligence nor censure for innate impulsivity. Performance reviews will utilize a Baseline Temperament Index to normalize output. If an employee's success is derived primarily from constitutive advantages (e.g., high innate processing speed), the surplus value is classified as unearned equity and redirected to the corporate contingency fund.

  *Internal Critique Note 4.2 (Analyst J. Aris Thorne):* It must be noted that if constitutive luck determines the capacity to mitigate circumstantial luck, then all mitigation efforts are themselves luck-dependent. Discounting constitutive factors risks eliminating the agent entirely. However, per Policy 1.0, we must proceed as if an agent exists.

  **6.0 COUNTERFACTUAL NORMALIZATION PROTOCOL FOR RESULTANT LUCK EVENTS**
  Resultant luck concerns outcomes dependent on unforeseeable factors post-action. The Counterfactual Normalization Protocol requires managers to simulate alternative outcomes had random variables differed. Bonuses are forfeited when success is judged "fortune-contaminated." For example, if a risky investment succeeds only due to an unforeseen geopolitical shift, the profit is attributed to luck, not strategy. Conversely, if a negligent action causes no harm due to external intervention, the employee is penalized as if the harm occurred. The moral weight of the intention supersedes the material outcome, provided the intention was documented in Q1 planning sheets. Managers must submit a "Would-Have-Done" report detailing expected outcomes under neutral conditions.

  **8.0 APPEALS AND ETHICS ADJUSTMENT BOARD**
  Employees may petition the Ethics Adjustment Board if they believe a blame rating ignores circumstantial or causal luck. Petitions must be filed within five business days. The Board will review the Luck Coefficient applied to the case. However, all Board rulings are subject to a Board Constitutive Luck Disclaimer. Board members acknowledge that their judgment capacities are subject to the same constitutive and circumstantial variables as the appellants. Therefore, Board decisions are provisional and subject to future recalibration as the Board's own luck profile is adjusted. This creates a recursive loop of accountability which employees must accept as a condition of employment.

  **APPENDIX A: LUCK COEFFICIENT TABLE**
  | Variable Type | Deduction Rate | Documentation Required |
  | :--- | :--- | :--- |
  | Circumstantial | 15-40% | Incident Report Form 9 |
