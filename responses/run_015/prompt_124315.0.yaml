      *   *Refining the "Screen" Paradox:* This is definitely Grossman-Stiglitz (1980). "On the Impossibility of Informationally Efficient Markets." If prices fully reveal info, return to info acquisition is zero. Markets must be *somewhat* inefficient to survive.

      *   *Refining the Metaphor:* The "Computer" implies a static function $f(x) = y$. The Market is a game $G(players, strategies)$. A better metaphor is a **Tournament** or an **Ecosystem**. Let's suggest **A Voting Booth where Votes are Auctioned.** No, that's clunky. How about **A Crowd-Sourced Map?** Everyone draws a bit, but if the map is perfect, no one bothers drawing.
