      *   *The "Data" Point:* In computers, data exists. In markets, info is *produced* (research, digging).
      *   *The Conclusions:*
          1.  *Deference:* Prices are good, but not omniscient. They need noise to function. Blind deference ignores the cost of producing the info embedded in the price.
          2.  *Volume:* High volume isn't necessarily "dumb." It can be liquidity provision, hedging, or disagreement (if priors differ). MS says speculative volume is zero, but real markets aren't pure MS worlds.
      *   *Better Metaphor:* An Ecosystem or a Voting System with Bribery. Or a "Discovery Procedure" (Hayek's own words). Let's go with **A Voting System where Votes Cost Money and Can Be Resold.** Or **A Predator-Prey Ecosystem.** Actually, Hayek's "Discovery Procedure" is best. Or a **Polling Station where you get paid to vote.** Let's refine: **A Competitive Discovery Process.**

