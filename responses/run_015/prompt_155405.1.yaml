answer: |-
  **Me:** Okay, don't get mad, but I jaywalked again. Like, full on red Ampelmännchen.

  **Alex:** [doesn't look up from phone] Did anyone see you?

  **Me:** Doesn't matter. There were zero cars. Literally empty street. Why is everyone here so obsessed? It's a coordination norm, not the ten commandments.

  **Alex:** It's not about the cars, though. You know that. It's about the system.

  **Me:** But that's what I'm saying. Is it *moral*? Or is it just practical? Like, queing at the Späti. If everyone just grabs stuff efficiently, we get beer faster. If we line up, we wait. It's just a coordination thing.

  **Alex:** See, that's where you're wrong. You're treating it like a math problem. But when you move somewhere new, some of these rules are opaque. You can't tell if they're practical or moral just by looking.

  **Me:** Opaque how? It's a traffic light. Red means stop. Green means go. The physics are transparent.

  **Alex:** The *meaning* is opaque. Maybe it's about safety for kids who might not understand "zero cars." Maybe it's about signaling to drivers that pedestrians are predictable. Maybe it's just about respect for the collective order. You don't know which one it is.

  **Me:** Exactly. I *don't* know. So why should I assume it's a moral obligation? If I can't see the moral reason, I should suspend judgment. Follow it sometimes, sure, but not feel *wrong* for breaking it when it's safe.

  **Alex:** Because opacity demands deference. If you can't tell if a rule is moral or practical, you owe it to the people living here to assume it matters. Blindly following isn't submission, it's respect. You're saying, "I know I don't get the full context, so I'll trust the locals."

  **Me:** But that's dangerous tho. Blind deference is how people end up doing stupid stuff just because "that's how it's done." Like tipping. I heard if you don't round up here, people think you're a jerk. But in the States, not tipping 20% is theft. Here, service is included. So is tipping moral?

  **Alex:** It's social glue.

  **Me:** Or it's an awkward leftover norm. If I suspend judgment, I watch. I see locals rounding up 50 cents. I do that. But I'm not gonna feel guilty if I don't. You're saying I have a moral duty to follow the script even when I don't understand the play.

  **Alex:** I'm saying the script holds the play together. If you treat every norm as optional until you personally verify its moral weight, you're making yourself the judge of a society you just joined. That's kinda arrogant.

  **Me:** Isn't it more arrogant to assume there's a deep moral reason for everything? Maybe people just like queing because they're risk-averse. If I treat risk-aversion like it's virtue, I'm not respecting them, I'm fetishizing their anxiety.

  **Alex:** [laughs] Okay, that's harsh. But look, take the quiet on Sundays rule. No drilling, no loud music. Is that moral?

  **Me:** Noise pollution is practical.

  **Alex:** But people treat violations like a moral failing. You can see it in their faces. If you move here, and you don't know *why* Sunday is sacred—is it religious? Is it labor law? Is just rest?—the opaque thing to do is defer. Don't drill. Because the cost of you drilling is high for them, and the cost of you waiting is low for you.

  **Me:** I agree with the action, not the reasoning. I won't drill. But I'm not gonna feel *sinful* if I vacuum quietly. There's a difference between following a rule and internalizing it as moral truth. I think suspension of judgment means I follow the norm pragmatically while I learn, but I reserve the right to decide it's bullshit later.

  **Alex:** And I think that reserve is the problem. You're keeping one foot out the door. Deference means you commit to the norm *as if* it's moral until you're sure it's not. It's about trust.

  **Me:** But what if it *is* bullshit? Like, what if I find out the queing thing is just about control?

  **Alex:** Then you work to change it. But you don't get to opt out just because you're confused. Opacity isn't a loophole, it's a signal to slow down and conform.

  **Me:** I feel like opacity is a signal to observe. Not necessarily conform. If I cross on red with no cars, I'm testing the hypothesis. If someone yells at me, I learn something. If no one cares, I learn something else.

  **Alex:** Or you learn that people are too polite to yell at the new grad student, but they talk about you later.

  **Me:** [grins] Let them talk. I got across the street safely.

  **Alex:** You're impossible. Just don't forget to round up the tip at dinner tonight.

  **Me:** Definately rounding up. But only because the waiter was nice, not because the state says so.

  **Alex:** Whatever helps you sleep at night. Just don't make me watch you wait for the green light next time.

  **Me:** No promises.
