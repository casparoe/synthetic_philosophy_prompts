prompt: |-
  Hey — I need help writing a short proposal for my school's independent research project thing (you pitch a project, and if they like it you get a free period, a small budget, and you present whatever you found at the end of the semester). I want to do mine on the phrase "Western values." I got into this because I do debate, and I keep hearing people use the phrase in totally incompatible ways: one person says Western values mean we have to stand up to some country, and someone else says Western values mean we shouldn't bomb that same country, and both sound completely sincere. Meanwhile a friend of mine whose family moved here from Turkey says the whole phrase is just a fancy way of saying "stuff people in power already wanted to do anyway," and honestly sometimes it does feel like that. But I really don't want to turn in a project that just concludes "the term is vague and politically loaded," because that's the answer everyone already expects and it doesn't actually settle anything.

  Here's my half-formed idea, and I'd like you to turn it into a real question. I think the phrase might be doing two different jobs that people keep mixing together: a descriptive or historical job (picking out values that have actually been influential in the societies people call Western) and a contrastive or "flag" job (marking off a group against whatever it's currently opposed to — communists back in the day, then Islamist extremism, now sometimes China, but also sometimes internal enemies, like people complaining that universities are abandoning Western values). If it's mostly doing the second job, then it's not surprising the content keeps sliding around, and the interesting question becomes whether it can be coherent at all without any fixed list behind it. One test I thought of: take a sentence like "we have to defend Western values against ___" and swap out what goes in the blank, then ask whether the phrase still picks out the same commitments — if it doesn't, the content is coming from the contrast rather than from the values. The other bit I want to look at is whether a historically Western country can abandon those values by its own lights, and whether a non-Western country can have them better; if both of those are possible, then the "Western" part looks like an accident of history and the real work is being done somewhere else.

  So what I need is the proposal document itself, roughly 800 to 1000 words. State the question so that it has a determinate answer — not just "is the term coherent?" but something I could actually come down on one way or the other — and explain why the obvious answers people give (the list version: democracy, individual rights, free speech, plus some stuff about the Enlightenment and Christianity; and the deflationary version: it's pure rhetoric with no content) both leave the question open. Then lay out what I'd actually do week by week over one semester, keeping in mind I'm in high school and can't run a real corpus study; my advisor said I could collect maybe thirty example uses myself and code them somehow, but I'm not sure that's worth anything or whether I should just do straight argument, so tell me honestly. Say what the possible conclusions are and which considerations would decide between them, what a good final deliverable looks like (a paper? a presentation? something my debate team could actually use when they're prepping?), and include an honest section on what would make this project fail or be way too big for one semester. Also please don't give me a bibliography or reading list or any citations — I'll ask my advisor for those — just refer to positions and arguments in general terms if you need to, and I'll fill in the names myself.
