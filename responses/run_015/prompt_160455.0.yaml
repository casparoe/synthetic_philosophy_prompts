answer: |-
  **1. The hinges**

  1.  **Agglomeration:** If an agent ought to A and ought to B, does it follow they ought to (A-and-B)? *Yes* (logic holds) vs. *No* (oughts fragment). This determines if conflict implies logical contradiction.
  2.  **Inference from Inability:** If an agent cannot do both, does the obligation vanish? *Yes* ('Ought' implies 'Can') vs. *No* (obligation survives impossibility). This separates those who see dilemmas as errors from those who see them as tragedies.
  3.  **Wrongdoing vs. Blameworthiness:** Can an agent do wrong without being blameworthy? *Yes* (excused wrongdoing) vs. *No* (wrongdoing entails blame). This isolates the moral status of the act from the assessment of the agent.
  4.  **Comparability:** Are conflicting values finely balanced or incomparable? *Balanced* (tie) vs. *Incomparable* (no common measure) vs. *One overrides* (hidden ranking). This distinguishes ties from deep conflicts.
  5.  **Epistemic vs. Ontic:** Would full information dissolve the conflict? *Yes* (uncertainty causes conflict) vs. *No* (conflict is real). This separates ignorance from genuine moral remainder.
  6.  **Role-Source:** Do obligations generated by roles behave differently than general duties? *Yes* (roles create unique conflicts) vs. *No* (all duties share one structure). This earns its place because professional seminars require distinguishing institutional constraints from universal morality.

  **2. The logical space**

  Combining these six binary hinges yields 64 logical cells. Most are empty. The tree begins with **Epistemic** (Is the conflict real?). If *Yes* (Epistemic), the path leads to **Monism** (conflict dissolves with info). If *No* (Ontic), we move to **Agglomeration**. If *Yes* (Oughts aggregate), we hit **Inability**. If *Ought* implies *Can*, the agent is required to do neither (**Option View**). If *Ought* survives *Cannot*, we reach **Dilemmism**.

  From Dilemmism, we branch to **Wrong/Blame**. If Wrong entails Blame, we have **Hard Dilemmism**. If Wrong allows No-Blame, we have **Soft Dilemmism**. Parallel branches track **Comparability** (Tie vs. Incomparable) and **Role-Source** (General vs. Professional). Only about eight cells are occupied by defensible positions. The skeleton prioritizes Epistemic and Agglomeration because these determine whether a dilemma exists at all; Role and Comparability determine the *type* of dilemma. The tree leaves represent stable combinations, such as "Ontic, Agglomeration Fails, Role-Specific," which corresponds to institutional dilemmism.

  **3. The instrument**

  1.  **Forced Choice:** A tyrant forces you to kill one prisoner or he kills two. You must choose.
      *   A) You ought to kill one; killing two is worse. (Hinge 4, Load-bearing)
      *   B) You ought not kill either, but must choose; both are wrong. (Hinge 2, Load-bearing)
      *   C) There is no fact about what you ought to do until you choose. (Hinge 1, Confirmatory)
      *   *If declined:* "Focus on what is required, not what is comfortable."

  2.  **Promise vs. Harm:** You promised to meet a friend, but on the way you see a stranger needing urgent help. You cannot do both.
      *   A) The promise is voided by the emergency; you ought to help. (Hinge 2, Load-bearing)
      *   B) You ought to keep the promise and ought to help; you will fail one. (Hinge 1, Load-bearing)
      *   C) You ought to help, but owe the friend an explanation. (Hinge 3, Confirmatory)

  3.  **Partiality:** You can save your own child or five strangers. You save your child.
      *   A) You did the right thing; the numbers don't decide this. (Hinge 4, Load-bearing)
      *   B) You did the wrong thing, but anyone would understand. (Hinge 3, Confirmatory)
      *   C) You did the wrong thing and are blameworthy. (Hinge 3, Confirmatory)

  4.  **Role (Ventilator):** As a doctor, you have one ventilator. Patient A is younger; Patient B is a colleague who saved lives.
      *   A) Role rules decide; age trumps loyalty. (Hinge 6, Load-bearing)
      *   B) Both claims are valid; choosing either leaves a moral remainder. (Hinge 2, Load-bearing)
      *   C) There is a single correct medical choice; uncertainty makes it hard. (Hinge 5, Confirmatory)

  5.  **Loyalty vs. Public:** You discover your department is harming the public. Leaking violates confidentiality.
      *   A) Public safety overrides confidentiality; leak. (Hinge 6, Load-bearing)
      *   B) Both duties bind; leaking is right but violates a real obligation. (Hinge 2, Load-bearing)
      *   C) Confidentiality is absolute; do not leak. (Hinge 6, Confirmatory)

  6.  **Dirty Hands:** An official authorises torture to prevent a bombing.
      *   A) It was necessary; therefore permissible. (Hinge 2, Load-bearing)
      *   B) It was necessary but still morally forbidden. (Hinge 2, Load-bearing)
      *   C) It was forbidden, but the official is not blameworthy. (Hinge 3, Load-bearing)

  7.  **Uncertainty:** You must act now, but don't know which action saves more lives.
      *   A) Once you know, one option was clearly right. (Hinge 5, Load-bearing)
      *   B) Even with full info, the conflict would remain. (Hinge 5, Load-bearing)
      *   C) You ought to guess; there is no deeper truth. (Hinge 5, Confirmatory)

  8.  **Residue (Remorse):** After choosing one patient to die, the doctor feels deep remorse.
      *   A) This proves she failed a duty. (Hinge 3, Load-bearing)
      *   B) This is a fitting response to loss, not failure. (Hinge 3, Confirmatory)
      *   C) She should feel nothing if she chose correctly. (Hinge 3, Confirmatory)

  9.  **Residue (Apology):** Should the doctor apologize to the dead patient's family?
      *   A) Yes, because she wronged them. (Hinge 3, Load-bearing)
      *   B) Yes, to express regret, not admission of wrong. (Hinge 3, Confirmatory)
      *   C) No, she did her duty. (Hinge 3, Confirmatory)

  10. **Residue (Blame):** Do the family have standing to blame the doctor?
      *   A) Yes, she killed their kin. (Hinge 3, Load-bearing)
      *   B) No, she was trapped by circumstances. (Hinge 3, Confirmatory)
      *   C) Only if she was negligent. (Hinge 3, Confirmatory)

  **4. Scoring key**

  **Positions:**
  *   **Monism:** (1A, 2A, 7A). Always one right act. *Awkwardness:* Dismisses deep regret as irrational.
  *   **Rational Consistency:** (1A, 2A, 7A). Conflict is irrationality. *Awkwardness:* Makes morality depend on agent's coherence.
  *   **Prima Facie:** (1A, 2C, 4A). Duties weigh; one overrides. *Awkwardness:* Makes overridden duties vanish.
  *   **Tragic Dilemmism:** (1B, 2B, 6B). Wrong whatever you do. *Awkwardness:* Requires doing wrong intentionally.
  *   **Incomparabilist:** (1C, 3A, 4B). Values lack common measure. *Awkwardness:* Makes choice arbitrary.
  *   **Epistemic:** (7A, 1A). Conflict is ignorance. *Awkwardness:* Denies reality of hard cases.
  *   **Particularist:** (1C, 3A). No general rules. *Awkwardness:* Offers no guidance.
  *   **Limit of Theory:** (1B, 7B). Morality breaks down. *Awkwardness:* Leaves agent without norms.
  *   **Role-Specific:** (4B, 5B, 6B). Roles create unique dilemmas. *Awkwardness:* Fragments morality into spheres.

  **Split Patterns:** If a student is Dilemmist on Promises but Monist on Triage, return **Cluster: Context-Dependent**. If they accept Residue (8A) but deny Unresolved Conflict (1A), return **No Stable Position**. Advise them: "Your judgments about feelings outpace your judgments about duties; check for consistency."

  **Mini-Keys:**
  *   **Deliberative (1-7):** Determines if a dilemma exists.
  *   **Affective (8-9):** Determines if residue indicates wrong or loss.
  *   **Accountability (10):** Determines blameworthiness.
  *   *Legitimacy:* A student can legitimately land in different places (e.g., Wrong but Not Blameworthy). This indicates a **Soft Dilemmist** view.

  **5. Empty cells**

  1.  **Agglomeration Yes + Ought/Can No:** You ought to A and B, cannot do both, so you ought to (A&B) which is impossible. *Diagnosis:* Incoherent. Requires obligating the impossible.
  2.  **Epistemic Yes + Residue Evidence:** Conflict is ignorance, but remorse proves wrong. *Diagnosis:* Merely Unattractive. Why feel wrong if info would show you right?
  3.  **Role-Specific Yes + General Dilemma No:** Roles create dilemmas, general life does not. *Diagnosis:* Defensible but Unexplored. Most theorists generalize either way.
  4.  **Incomparable + Single Right Act:** Values are incomparable, but one act is right. *Diagnosis:* **Coherent/Attractive/Unclaimed.** This view holds that while values don't compare, institutional rules or commitments break the tie without making one value 'greater'. To hold this, one must believe normative authority can exist without comparative value.

  **6. What the instrument cannot separate**

  1.  **Prima Facie vs. Threshold Deontology:** Both yield "One option is right." The instrument asks *what* to do, not *why*. To separate them, one must ask: "Does the duty vanish or is it overridden?" This requires theoretical vocabulary (override vs. extinguish) students lack pre-seminar.
  2.  **Realist Incomparability vs. Constructivist Indeterminacy:** Both yield "No fact of the matter." The instrument records the judgment, not the meta-ethical ground. To separate them, one must ask: "Is there no value relation, or have we not constructed one?" This asks about the nature of value, not the case outcome, violating the "no theory" constraint.

  **7. Worked runs**

  **Student A (Consistent):** Answers 1B, 2B, 6B, 8A, 9A, 10A.
  *Scoring:* Ontic Conflict, Agglomeration Fails, Wrong/Blame Separated, Residue as Evidence.
  *Result:* **Soft Tragic Dilemmist.** Believes conflicts are real, agents do wrong, but are not blameworthy.
  *Feedback:* "Your view is stable. You see morality as demanding more than humans can deliver."

  **Student B (Split):** Answers 1A (Monist) but 8A (Residue as Wrong) and 4B (Role Dilemma).
  *Scoring:* General Monism, Role Dilemmism, Affective Dilemmism.
  *Result:* **Cluster: Role-Specific Dilemmist.**
  *Feedback:* "You think ordinary conflicts have solutions, but professional ones do not. This is a defensible 'Spheres of Morality' view. Note that your remorse (8A) suggests you feel the wrong even if you deny it intellectually (1A). Watch for tension between your head and your gut."
