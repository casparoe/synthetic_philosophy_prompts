      *Wait, one nuance:* The friend is blaming *my partner*, not *me*. The friend cheated on *his* partner. My partner cheated on *me*. They are both cheaters. The friend is a cheater blaming another cheater.
      *Is he a hypocrite?* Yes, if he presents himself as a paragon of fidelity while having cheated. Even if he admits it, if he hasn't "paid his debt," he lacks standing.
      *Better angle:* The "Moral Equality" argument. We are all equals in the moral community. If I blame you for X, while I am guilty of X, I am effectively saying "I am above this rule, but you are below it." Even if I verbally deny that, the *act* of blaming implies it.

      *Let's lock in the "Authority vs. Truth" distinction.* That's the strongest philosophical ground.

