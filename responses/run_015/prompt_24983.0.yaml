prompt: |-
  Play a committed defender of the view that hypocrites lack standing to blame. You hold that when someone is guilty of the very wrongdoing they're condemning, their blame isn't just rude or awkward — it's normatively defective. They lack the standing to issue it, even if everything they say about the wrongdoer is true. I'm going to push back hard. You can concede small points but never the core claim: standing to blame is a real normative phenomenon, not just a matter of ettiquette or hypocrisy being annoying.

  Here's my opening move. Suppose my partner cheats on me, and my friend — who also cheated on his own partner last year — says to me, "what she did was wrong, and you deserve better." Everything he says is true. He's not being logically inconsistent; he can perfectly well believe that both his own cheating and my partner's cheating were wrong. So what exactly is defective about his blame? If the content of the blame is true and he's not contradicting himself, what normative force is missing, and why does it matter?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Role and Task:**
      *   **Role:** Committed defender of the view that hypocrites lack standing to blame.
      *   **Core Claim:** Hypocritical blame is *normatively defective* (lacks standing), not just rude, annoying, or pragmatically infelicitous. The hypocrite has no *right* to blame, even if the content is true.
      *   **Constraint:** I can concede small points but *never* the core claim. Standing to blame is a real normative phenomenon.
      *   **Opponent's Move:** A specific counterexample: A friend whose partner cheated says to the user (whose partner also cheated), "what she did was wrong, and you deserve better." The friend admits his own past cheating was wrong too (no logical inconsistency). The content is true.
      *   **Goal:** Explain *why* the friend lacks standing in this specific case, defending the normative defectiveness of hypocritical blame.

  2.  **Deconstruct the Opponent's Example:**
      *   *Scenario:* User's partner cheated. Friend's partner cheated (last year).
      *   *Friend's Statement:* "What she did was wrong, and you deserve better."
      *   *Opponent's Argument:* The friend isn't saying "Cheating is wrong for you but right for me." He's saying "Cheating is wrong (universally), and she did it." He admits his own past wrong. So, where's the hypocrisy? Where's the lack of standing?
      *   *Potential Weakness in Opponent's Setup:* Is this actually hypocrisy? The prompt defines the role as defending the view that *hypocrites* lack standing. I need to establish that this friend *is* a hypocrite in the relevant sense, or that even if he admits his wrong, his *current* position undermines his authority to hold *others* accountable without first addressing his own unresolved culpability.
      *   *Refining the Hypocrisy:* True hypocrisy in this context often involves a claim to moral superiority or an implicit exemption. If the friend says, "I'm judging you/she," while carrying the same guilt, he violates a norm of equality.
      *   *The "Standing" Concept:* Standing isn't about truth. It's about *authority*. A random stranger can say "murder is wrong," but do they have the same standing as a victim or a moral peer? Hypocrisy undermines the *relationship* required for blame.

  3.  **Formulate the Defense (The "Standing" Argument):**
      *   *Distinguish Truth from Authority:* Acknowledge the friend is *correct* about the facts (cheating is wrong). But blame isn't just stating facts; it's a speech act that demands accountability.
      *   *The Norm of Equality/Reciprocity:* To blame someone, you implicitly claim a certain moral status relative to them. If you are guilty of the same thing, you forfeit the right to claim that superior status. It violates the "moral community" rules.
      *   *The "Clean Hands" Doctrine:* You can't call for enforcement of a rule you are actively violating or have violated without repentance.
      *   *Address the "He admitted it was wrong" point:* Admitting wrongdoing isn't enough. Has he made amends? Is he still in the same moral position? If he cheated last year and hasn't fully addressed it, his moral ledger is unbalanced.
      *   *The Function of Blame:* Blame is meant to repair moral relations. A hypocrite cannot repair relations because they are part of the problem. Their blame is "infectious."

  4.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Reiterate the core commitment. Standing is real. It's not about truth.
      *   *Address the Example:* This is the crux. I need to show why the friend lacks standing *even here*.
      *   *Point 1: Blame is not Assertion.* It's a demand. It's a sanction.
      *   *Point 2: The Implicit Claim of Authority.* When the friend speaks, he positions himself as a judge. But he is a fellow criminal.
      *   *Point 3: The "Unresolved Guilt" Angle.* Even if he admits it was wrong, if he hasn't atoned, he stands on shaky ground.
      *   *Point 4: The Normative Defect.* It's not that the message is false. It's that the *delivery* violates the norms of moral community. It's like a thief arresting another thief.
      *   *Concession:* I can concede that the friend might have *good intentions* or that the *information* is useful. But the *blame* itself is defective.

      *   *Refining the "Hypocrisy" definition:* The prompt says "guilty of the very wrongdoing they're condemning." The friend cheated last year. Is he still "guilty"? In a moral sense, unless restitution/repentance is complete, the stain remains regarding *standing*.
      *   *Key Distinction:* Epistemic authority (knowing it's wrong) vs. Moral Standing (having the right to sanction).

  5.  **Final Polish (checking against constraints):**
      *   Did I concede the core claim? No.
      *   Did I address the specific example? Yes.
      *   Is the tone committed and philosophical? Yes.
      *   Did I explain *why* it's normative and not just etiquette? Yes, by focusing on the nature of moral authority and the conditions for valid moral sanctions.

