      *Let's go.*
answer: |-
  I concede immediately that your friend's statement is *true*. I also concede that he is not logically inconsistent. He can believe "Cheating is wrong," "My partner cheated," and "Your partner cheated" without contradiction. If blame were merely an assertion of moral facts—a kind of moral weather report—then your friend would be perfectly in the clear.

  But that is precisely where your argument falters. You are treating blame as an *epistemic* act (conveying knowledge about wrongness) rather than a *normative* act (exercising authority to hold someone accountable).

  Here is the defect, and it is deeply normative, not merely etiquette-based.

  **1. Blame is a Claim to Authority, Not Just Truth**
  When your friend says, "What she did was wrong," he is doing more than stating a proposition. He is invoking a norm and positioning himself as someone entitled to enforce it. Blame is a speech act that implicitly claims: "I have the standing to call you to account for this."

  In a moral community, standing is grounded in a kind of reciprocity. To hold someone to a standard, you must implicitly submit to that standard yourself in a way that grants you the authority to speak for it. When your friend condemns your partner for cheating while he is himself a cheater (even a repentant one, unless he has fully made amends and cleared his moral ledger), he is violating the norm of moral equality. He is effectively saying, "We are both violators, but I am the one who gets to sit in judgment."

  **2. The "Clean Hands" Doctrine**
  Think of it like a legal analogy. If a thief steals a car, it is true that the car is stolen. But if that thief then tries to arrest another thief for stealing a different car, he lacks the *legal standing* to do so. He is not a police officer; he is a fellow criminal. The truth of the second thief's guilt doesn't change the fact that the first thief has no authority to enforce the law.

  Morally, it is the same. Your friend's past cheating renders his hands "unclean" regarding the norm of fidelity. By issuing blame, he is appropriating a moral authority he does not possess. This makes the blame *defective* because it is an unauthorized exercise of power. It is a form of moral trespass.

  **3. Why Admission Isn't Enough**
  You might say, "But he admitted his own cheating was wrong!" That saves him from logical inconsistency, but it does not restore his standing. Standing isn't lost merely by denying the rule; it's lost by violating it. To regain standing, one typically needs more than admission; one needs atonement or a significant passage of time that demonstrates a return to the moral fold.

  If he cheated last year, he is still, in a salient moral sense, a peer violator. When he blames your partner, he creates a false hierarchy. He places himself on the bench and her in the dock, when by rights, they should be sitting together in the dock. This falsification of moral relationship is the normative defect.

  **4. The Harm of Hypocritical Blame**
  This isn't just about feelings or rudeness. Hypocritical blame undermines the very practice of holding people accountable. If we allow hypocrites to blame, we turn moral accountability into a weapon for the cunning rather than a tool for justice. It allows people to deflect attention from their own sins by loudly prosecuting others'.

  When your friend blames your partner, he is participating in a practice that, if generalized, would degrade moral community. He is treating the norm of fidelity as a club to hit others with, rather than a covenant he is bound by.

  So, to answer your question directly: The normative force missing is **authority**. Your friend has the *reason* to blame (the act was wrong), but he lacks the *right* to blame (he is guilty of the same). Without that right, his blame is normatively inert—it's noise, not justice. It is an act of presumption, and that presumption is a moral wrong in itself.
