      *   *Specific Terminology:* Use "Normative Density," "Enforcement Severity," "Exit Permeability," "Justificatory Openness" explicitly.

  8.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe Welton is high density.
      *   *Correction:* Actually, Welton focuses on a few big things (Tradition, Honor, Discipline, Excellence). The *density* of daily micro-rules is there (uniforms), but the *moral* density is low—it's all about obedience. I should distinguish between bureaucratic density and moral density.
