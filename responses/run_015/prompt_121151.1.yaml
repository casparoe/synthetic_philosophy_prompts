      *   *Resolution:* Adopt a "Fallibilist Institutional Epistemology." Acknowledge that process provides *probabilistic assurance of intent*, not certainty of effect. The revision: Process audits establish *culpability* (mens rea), outcome tests establish *risk* (actus reus). They answer different questions, not the same question via different methods.

