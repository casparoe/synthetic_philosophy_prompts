answer: |-
  You have identified a genuine and under-theorized tension in the ethics of technology. Your intuition is correct: this is not merely "moral luck," nor is it the standard "responsibility gap." Your colleague is half-right that luck is involved, but wrong to imply that *designed* luck carries the same moral texture as *contingent* luck. When indeterminacy is a feature rather than a bug, the moral architecture changes.

  There is no single, canonical Latin phrase or proper noun in the literature that captures this exact configuration. However, your case sits at the intersection of three well-established philosophical distinctions. By combining them, we can construct the name and definition you need for your report.

  ### 1. The Closest Established Concepts

  To build the right term, we must first clear away the near-misses you correctly identified, and isolate the concepts that *do* fit.

  **A. Ex Ante vs. Ex Post Responsibility (The Temporal Gap)**
  In risk ethics (notably in the work of **John Oberdiek** and **Sven Ove Hansson**), a sharp distinction is drawn between the justification of a risk *before* it materializes (*ex ante*) and the accountability for the harm *after* it materializes (*ex post*).
  *   **Fit:** Your organization accepts *ex ante* responsibility (the policy was vetted, authorized, and deemed necessary). The gap appears *ex post* (the specific harm).
  *   **Mismatch:** Standard risk ethics usually assumes the *ex post* harm triggers a duty of compensation or apology that resolves the tension. In your case, the organization accepts the duty but admits it cannot answer the *explanatory* demand ("Why me?"). The gap is not about *whether* to pay, but about *intelligibility*.

  **B. General vs. Specific Causation (The Epistemic Gap)**
  In tort law and epidemiology, a distinction is made between **general causation** (does this substance/system cause this type of harm?) and **specific causation** (did this system cause *this* harm in *this* instance?).
  *   **Fit:** You have perfect general causation (the randomized policy creates this risk profile). You have zero specific causation (nothing about the pedestrian or the specific moment determined the outcome other than the random seed).
  *   **Mismatch:** This is usually an epistemic problem (we don't *know* the cause). In your case, it is an ontological one: there *is* no specific cause other than chance.

  **C. The Ethics of the Lottery (The Fairness Gap)**
  Philosopher **John Broome** and others have written on "Fairness and the Lottery." If a harm must be distributed (e.g., a draft, or a scarce resource), a lottery is often seen as fairer *ex ante* than picking favorites.
  *   **Fit:** Your randomized navigation is a safety lottery. It treats all pedestrians equally *ex ante* (no one is systematically targeted).
  *   **Mismatch:** A lottery justifies the *procedure*, not the *outcome*. The winner of a prize doesn't ask "Why me?" with anguish; the loser of a life does. The moral weight of the negative outcome creates a demand for reason that a lottery cannot supply.

  ### 2. The Missing Distinction: "The Gap of Particularization"

  Since no single term exists, I propose you adopt **"The Gap of Particularization"** (or alternatively, **"The Instantiation Gap"**) for your report.

  **Definition:**
  > The Gap of Particularization is the moral and explanatory distance between accepting responsibility for a **policy of risk imposition** and being able to provide a reason for the **realization of that risk in a specific instance**, where the indeterminacy of the instance was a deliberate design feature.

  **Why this fits your case:**
  1.  **It acknowledges agency:** Unlike the "Responsibility Gap" (which suggests no one is in control), this admits the designers controlled the *policy*.
  2.  **It acknowledges the limit:** It admits that control over the *policy* does not grant control over the *particulars*.
  3.  **It highlights the design:** It specifies that the lack of a "reason" for the specific victim is not an oversight, but a feature of the system.

  ### 3. Why "Moral Luck" Is Insufficient

  Your colleague suggests this is just moral luck. It is crucial to refute this in your report, because "moral luck" usually implies an *accidental* divergence between intention and outcome (e.g., two drunk drivers, one hits a pedestrian, one doesn't).

  Your case is **Engineered Moral Luck**.
  *   **Ordinary Moral Luck:** The world interferes with the plan.
  *   **Engineered Moral Luck:** The plan *requires* the world to interfere.

  This distinction matters because **Engineered Moral Luck** transforms the victim from a casualty of circumstance into a **statistical sacrifice**. In ordinary luck, the universe is indifferent. In your system, the organization *used* indifference as a tool. This makes the "Why me?" question more urgent, not less. The victim is not asking about the weather; they are asking about the design.

  ### 4. Is the "Why Me?" Question Morally Significant?

  You ask whether moral theory should care about the family's question, or if it is just a "retributive itch."

  **It is morally significant.** It touches on the Kantian requirement to treat persons as **ends in themselves**, not merely as means.
  *   **If there is a reason** (e.g., "the pedestrian jaywalked"), the harm is linked to the victim's own agency. They are still a moral agent.
  *   **If the answer is "the dice"** (i.e., "we needed to randomize to lower aggregate harm, and you were the realization of that probability"), the victim is effectively treated as a **unit of account** in a utilitarian calculus.

  The "Why me?" question is a demand for **Narrative Intelligibility**. Humans understand harm through stories of cause and effect. When you remove the specific cause to optimize the aggregate, you remove the victim's ability to make sense of their loss within a moral narrative. They cannot reconcile the event with their understanding of a just world.

  Therefore, the Gap of Particularization is not just a communication problem; it is a **dignitary harm**. Acknowledging this gap is the only way to avoid gaslighting the victim by pretending a reason exists when it does not.

  ### 5. Boundary Cases for Your Report

  To operationalize this, here is how the Gap of Particularization distinguishes your case from adjacent scenarios:

  | Case Type | Description | Is there a Gap of Particularization? | Why? |
  | :--- | :--- | :--- | :--- |
  | **Ordinary Accident** | A deterministic system fails due to wear and tear. | **No.** | There is a specific chain of causation (bolt sheared, sensor drifted). The "Why me?" has an answer (wrong place, wrong time, specific failure). |
  | **Ordinary Negligence** | A human driver is distracted and hits a pedestrian. | **No.** | The cause is the driver's specific failure of attention. The victim can blame the driver's choice. |
  | **Targeted Harm** | A system is designed to target a specific group (bias). | **No.** | The "Why me?" has a horrific but clear answer: "Because you belonged to Group X." The harm is intelligible, even if unjust. |
  | **Your Case (Designed Randomness)** | A system randomizes to avoid bias/systemic failure, harming one. | **Yes.** | The "Why me?" has no answer other than probability. The harm is justified aggregately but unintelligible individually. |
  | **Trivial Indeterminacy** | A randomized UI color scheme annoys a user. | **Technically Yes, Morally No.** | The structure is the same, but the stakes (harm vs. annoyance) determine whether the lack of intelligibility constitutes a dignitary harm. |

  ### 6. Recommendation for the Report

  When writing your internal guidance on post-harm communication, I recommend the following framing:

  1.  **Name the Gap:** Explicitly state that the organization recognizes the **Gap of Particularization**.
  2.  **Validate the Question:** Acknowledge that "Why me?" is a valid moral question, not just an emotional reaction. Admit that the system cannot answer it with a specific cause.
  3.  **Shift the Locus of Reason:** Since you cannot provide a reason for the *outcome*, you must provide a robust justification for the *policy* and a robust commitment to the *victim*.
      *   *Bad Answer:* "It was random chance." (Dismissive)
      *   *Bad Answer:* "We are sorry this happened." (Too vague)
      *   *Better Answer:* "We designed the system to randomize decisions to prevent systematic bias. We accepted that this creates a risk of isolated harms to prevent greater systemic harms. You were the person who suffered that isolated harm. We cannot tell you why it was you, only that it was the cost of the policy we chose. We accept responsibility for that choice and for your loss."
  4.  **Avoid "Moral Luck" Language:** Do not characterize this as "unfortunate luck." Characterize it as **"Realized Risk."** Luck implies nature; Realized Risk implies design.

  ### Summary
  You are looking for **The Gap of Particularization** within a framework of **Justified Risk Imposition**. It is the moral residue that remains when a utilitarian calculation is successfully executed via designed randomness. The victim's question ("Why me?") is a demand for **Intelligibility** that the system is structurally incapable of meeting. Acknowledging this incapacity is the only ethical way to communicate after the harm.
