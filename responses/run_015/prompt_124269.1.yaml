prompt: |-
  You are a philosopher of probability who also works closely with clinical prediction modelling. Before you write anything, spend a moment sorting out the distinct problems that get bundled together under the reference class problem — how to choose among classes, what to do when admissible classes conflict, and what a probability statement about a single case is even supposed to mean — so that your procedure does not silently collapse them into one.

  I chair the prediction-governance committee at a hospital network. Several times a week we are asked to sign off on an individualised risk estimate — this patient's five-year chance of a major osteoporotic fracture is 11%, say — that goes into the chart and triggers or withholds an intervention. Clinicians and patients challenge these numbers constantly, and the challenge always has the same shape: why that group and not another one? Any patient sits in dozens of statistically respectable classes that disagree.

  Our current draft rule, written by a statistician, is two lines: take the narrowest reference class for which the registry holds at least 200 observed outcomes; and if two or more admissible classes both contain the patient and differ by more than three percentage points, report the average of their estimates weighted by the square root of each class's sample size. Admissibility is defined only negatively: a class may not be built from a variable measured after the outcome is determined, and may not have been chosen after seeing which classes gave interesting numbers.

  Turn this into a procedure my committee can actually run. Give me the questions in order, what counts as a sufficient answer to each, a positive account of admissibility (I suspect the negative definition is not enough — I do not know what to do with a class defined by something that merely proxies the outcome, like patients who survived at least thirty days, or by a variable nobody recorded the reasons for), a better way of handling conflict between classes than our averaging rule, the point at which the procedure returns no individual estimate rather than a number, and the points where it hands the question to a person because it is a question of values rather than evidence. Constraints: the analyst running it day to day has one week of applied statistics, it must run in under an hour on our existing registry, and anything that changes practice needs my signature. Say plainly which steps are judgement calls dressed up as procedure.

  Then run it on three cases: a 62-year-old woman with type 2 diabetes and stage 2 chronic kidney disease, where classes defined by postmenopausal diabetes, by kidney stage, and by long-term proton-pump inhibitor use give five-year fracture risks near 9%, 14% and 7%, all from large samples; a 34-year-old man with a rare collagen gene variant, where the narrow class has four patients and the broad class of men under 40 gives a risk so low it would withhold treatment — I expect the procedure to give me an answer I do not like here; and a 71-year-old man with atrial fibrillation, where a scan over forty subgroups turned up one subgroup with a strikingly different stroke risk that nobody had predicted and that would change his management if used.

  Finally, tell me what the procedure cannot do, and in particular whether it can ever deliver the probability that this patient has an event, as opposed to a defensible and auditable way of choosing a number.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Role:** Philosopher of probability + Clinical Prediction Modelling expert.
      *   **Task:** Create a governance procedure for handling the Reference Class Problem (RCP) in individualized risk estimation.
      *   **Audience:** Chair of a Prediction-Governance Committee at a hospital network.
      *   **Key Requirements:**
          *   Distinguish distinct problems within RCP (selection, conflict, meaning).
          *   Critique and improve the current draft rule (narrowest class > 200 outcomes, negative admissibility, sqrt(N) weighting).
          *   Provide a positive account of admissibility (causal relevance, temporal validity).
          *   Provide a better conflict resolution method than simple averaging.
          *   Define when *no* estimate should be returned.
          *   Identify where value judgments enter (vs. evidence).
          *   Identify "judgement calls dressed up as procedure."
          *   Constraints: Analyst has 1 week of stats training, must run in < 1 hour, needs Chair's signature for practice changes.
          *   **Test Cases:**
              1.  62F, T2D, CKD2, PPI use (conflicting large classes).
              2.  34M, rare collagen variant (small narrow class vs. unrepresentative broad class).
              3.  71M, AFib (data dredging/subgroup discovery issue).
          *   **Final Question:** Can this ever deliver *the* probability for *this* patient, or just a defensible number?

  2.  **Philosophical & Statistical Sorting (The "Pre-Work"):**

      *   *Problem 1: Selection (Which class?)*. The "narrowest with N>200" rule is a heuristic for precision, not validity. It ignores causal relevance.
      *   *Problem 2: Conflict (What if classes disagree?)*. Averaging assumes the truth lies between them. But if one class is causally spurious (e.g., proxy for outcome), averaging pollutes the estimate.
      *   *Problem 3: Meaning (What does "11%" mean?)*. Is it a frequency (propensity of the class) or a degree of belief (epistemic uncertainty about the individual)? In clinical practice, we treat it as a frequency to guide action, but it applies to the individual only by analogy.
      *   *Admissibility:* Negative definition (no look-ahead, no p-hacking) is necessary but insufficient. We need *causal admissibility* (variables must be pre-outcome and causally prior or constitutive, not consequential).
      *   *Conflict Resolution:* Weighted averaging is weak. We need a hierarchy of evidence (causal strength > sample size).
      *   *The "No Estimate" Zone:* When causal heterogeneity is too high or data is too sparse to support *any* relevant class.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist suitable for a junior analyst.
      *   *Step 1: Variable Vetting (Positive Admissibility).* Move beyond "not post-outcome." Variables must be *causally prior* or *constitutive* (e.g., genetics, age). Exclude proxies for survival or intermediate outcomes (e.g., "survived 30 days").
      *   *Step 2: Class Generation.* Define the "Candidate Set."
      *   *Step 3: Stability Check.* (The N>200 rule is okay for stability, but needs nuance).
      *   *Step 4: Conflict Resolution.* Instead of sqrt(N) weighting, use a "Causal Priority" hierarchy. If classes conflict significantly, do not average; investigate *why*. If unresolvable, widen uncertainty bounds or defer.
      *   *Step 5: The "No Go" Condition.* When to return "Insufficient Evidence."
      *   *Step 6: Value Handoff.* Where the committee/chair steps in (risk thresholds, cost of error).
      *   *Transparency:* Explicitly label the judgement calls.

  4.  **Refining the Conflict Resolution:**

      *   The current draft uses $\sqrt{N}$ weighting. This favors larger classes even if they are less specific.
      *   *Better approach:* Prioritize the class with the strongest *causal justification* for the specific outcome, provided it meets minimum stability (N). If multiple causal pathways exist (e.g., kidney disease vs. diabetes for fracture), acknowledge the tension. Don't average spurious with real.
      *   *Proposal:* "Causal Tiering." Tier 1: Direct risk factors (BMD, prior fracture). Tier 2: Systemic diseases (CKD, Diabetes). Tier 3: Demographics. Use the most specific Tier 1 available. If Tier 1 classes conflict, check for interaction terms. If still conflicting, report range, not average.

  5.  **Addressing the Test Cases:**

      *   *Case 1 (62F, T2D, CKD, PPI):* All large samples. Risks: 9%, 14%, 7%. PPI is likely confounded (sick people take PPIs). CKD and Diabetes are causal. Procedure should downweight PPI. Conflict between CKD and Diabetes needs resolution (perhaps a combined class if available, otherwise range).
      *   *Case 2 (34M, Collagen):* Narrow class N=4 (too small). Broad class (Men <40) is causally weak (age/sex don't capture the genetic risk). Procedure should flag "Insufficient Evidence" rather than giving a false low number. This addresses the user's expectation ("answer I do not like").
      *   *Case 3 (71M, AFib, Data Dredging):* Subgroup found via scanning 40 groups. This is the "look-ahead/p-hacking" violation. Procedure must reject this subgroup unless pre-specified or biologically plausible *a priori*.

  6.  **Addressing the Final Philosophical Question:**

      *   Can we ever give *the* probability? No. Single-case probability is metaphysically dubious in frequentist terms. We provide a *defensible surrogate* for decision-making. Honesty about this is crucial.

  7.  **Review against Constraints:**

      *   *Analyst Skill:* Keep math simple (counts, percentages, hierarchies). Avoid complex Bayesian model averaging.
      *   *Time:* < 1 hour. Needs to be a checklist, not a research project.
      *   *Governance:* Clear sign-off points.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, philosophical but pragmatic, authoritative yet humble about limits.
      *   *Structure:*
          1.  Philosophical Preamble (sorting the problems).
          2.  The Procedure (The "RCP-Protocol v1.0").
          3.  Application to Cases.
          4.  The Limitations (The "Cannot Do").
      *   *Specific focus:* Ensure the "Positive Admissibility" section is clear. Variables must be *ancestral* to the outcome, not *descendants*.
      *   *Conflict:* Replace averaging with "Causal Precedence + Stability."
      *   *Judgement Calls:* Highlight them clearly.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is "Causal Precedence" too hard for a 1-week stats analyst?
      *   *Fix:* Provide a pre-approved list of variable tiers. The analyst doesn't determine causality; they check the list. The Committee determines the list.
      *   *Critique:* The user asked for "questions in order."
      *   *Fix:* Format the procedure as a Decision Tree/Questionnaire.
      *   *Critique:* The averaging rule in the prompt is specific. I need to explain *why* I'm changing it.
      *   *Fix:* Explain that averaging distinct causal mechanisms obscures risk profiles.
      *   *Critique:* The "No Estimate" condition.
      *   *Fix:* Define it as "No admissible class meets stability threshold."

  10. **Final Polish:** Check against the prompt's specific constraints (signature requirements, time limits, specific case details). Ensure the distinction between "probability of the event" and "defensible number" is sharp in the conclusion.

  *(Self-Correction on Case 2)*: The prompt says "I expect the procedure to give me an answer I do not like here." This implies the procedure should *refuse* to give a number, or give a number that forces treatment despite the broad class saying no. Given the ethical weight, the procedure should likely return "Indeterminate" rather than a false low risk. I will design it to return "Insufficient Data for Individual Estimate" which forces a clinical judgement call rather than algorithmic withholding.

  *(Self-Correction on Case 3)*: The subgroup was found by scanning. This is classic data dredging. The procedure must have a "Pre-specification Check." If not pre-specified, it requires biological plausibility review (Committee level).

  *(Refining the "Judgement Calls")*: I need to be explicit. "Choosing the causal hierarchy is a value judgement disguised as science." "Choosing the N threshold is a value judgement on precision vs. inclusion."

  Let's assemble the response.cw
answer: |-
  ### Preamble: Sorting the Knot

  Before we write the protocol, we must untangle the three distinct philosophical problems currently knotted together in your draft rule. If we do not separate them, the procedure will appear rigorous while silently making arbitrary choices.

  1.  **The Selection Problem (Which class?):** Your draft rule ("narrowest with N>200") prioritizes *precision* (low variance) over *validity* (low bias). A narrow class is precise but may be causally irrelevant. A broad class is valid but imprecise. The rule assumes sample size is a proxy for relevance. It is not.
  2.  **The Conflict Problem (What if classes disagree?):** Your draft rule averages them. This assumes the truth lies between the extremes. But if Class A is causally sound and Class B is a spurious correlation, the average is worse than Class A alone. Averaging conflates *epistemic uncertainty* (we don't know which class is right) with *aleatory variance* (the risk is inherently fuzzy).
  3.  **The Meaning Problem (What does the number mean?):** A probability statement about a single case is not a frequency (the patient does not fracture 11% of the time). It is a *degree of belief* calibrated by frequencies of similar cases. When we tell a patient "11%," we are offering a wager: "If we saw 100 people exactly like you, 11 would fracture." The "exactly like you" is the fiction we must defend.

  Your current draft solves Selection by heuristic, Conflict by smoothing, and ignores Meaning. The procedure below addresses all three.

  ***

  ### The Protocol: Reference Class Governance (RCG-v1)

  **Operator:** Junior Analyst (1 week training).
  **Time Limit:** 45 minutes per request.
  **Authority:** Any output marked "Committee Review" requires your signature before chart entry.

  #### Part 1: Positive Admissibility (The Variable Filter)
  *Current draft flaw: Defines admissibility only by what is forbidden (post-outcome, p-hacked). This allows "zombie variables" that are technically pre-outcome but causally spurious.*

  **Question 1: Is every variable defining the class causally ancestral to the outcome?**
  *   **Sufficient Answer:** Yes, if the variable is either **Constitutive** (cannot change without changing the patient's identity, e.g., genetics, sex, birth year) or **Causal** (known mechanism preceding outcome, e.g., smoking, drug exposure).
  *   **Failure Condition:** The variable is a **Proxy for Survival** (e.g., "survived 30 days"), a **Proxy for Care** (e.g., "seen by cardiology"), or a **Descendant** (e.g., "prescribed bisphosphonates" when predicting fracture, as prescription follows risk).
  *   **Analyst Action:** Check variables against the *Approved Variable Hierarchy* (see Appendix A). If a variable is not on the list, flag for Committee Review.
  *   **Judgement Call:** *The Hierarchy itself.* Deciding that "Kidney Stage" is causal for fracture but "Clinic Site" is not is a scientific judgement made by the Committee, not the analyst. The analyst merely enforces it.

  #### Part 2: Stability and Specificity (The Class Filter)
  *Current draft flaw: "Narrowest with N>200" ignores that some narrow classes are too specific to be stable, while some broad classes are too vague to be useful.*

  **Question 2: Does the candidate class meet the Minimum Stability Threshold?**
  *   **Sufficient Answer:** Yes, if the class contains ≥200 patients *and* ≥20 observed outcomes (events).
  *   **Reasoning:** We need 20 events to estimate a rate with reasonable confidence, not just 200 patients. A class of 200 healthy people with 0 fractures gives a risk of 0%, which is likely false, not true.
  *   **Analyst Action:** Calculate N (patients) and E (events). If E < 20, the class is inadmissible regardless of N.

  **Question 3: Is there a more specific admissible class?**
  *   **Sufficient Answer:** If Class A is a subset of Class B, and both pass Q1 and Q2, select Class A.
  *   **Analyst Action:** Prioritize specificity *within* causal tiers.

  #### Part 3: Conflict Resolution (The Reconciliation)
  *Current draft flaw: Weighted averaging obscures disagreement. If Diabetes says 9% and CKD says 14%, the average (11.5%) implies a precision that doesn't exist.*

  **Question 4: Do admissible classes disagree by >5 percentage points?**
  *   **Sufficient Answer:** No. Report the estimate.
  *   **If Yes:** Do **not** average.
      *   **Step 4a:** Check for a **Combined Class** (e.g., Patients with *both* Diabetes and CKD). If this class exists and passes Q2, use it.
      *   **Step 4b:** If no Combined Class exists, report the **Range** (e.g., "9% to 14%") and flag for Committee Review.
  *   **Judgement Call:** *The 5% threshold.* This is a policy decision on when disagreement becomes clinically material.

  #### Part 4: The "No Estimate" Condition
  *Current draft flaw: Forces a number even when evidence is absent.*

  **Question 5: Is there *any* admissible class containing this patient?**
  *   **Sufficient Answer:** No.
  *   **Action:** Return **"Insufficient Evidence for Individualized Estimate."**
  *   **Consequence:** Default to the population baseline risk *plus* a clinical judgement flag. Do not output a specific percentage.
  *   **Judgement Call:** *The Default Action.* Deciding to treat based on baseline risk vs. withholding treatment when data is missing is a value judgement (Precautionary Principle vs. Resource Stewardship).

  #### Part 5: The Data Dredging Check
  *Current draft flaw: Negative definition ("not chosen after seeing numbers") is hard to audit.*

  **Question 6: Was this subgroup pre-specified or biologically plausible *a priori*?**
  *   **Sufficient Answer:** Yes, if the subgroup definition exists in the *Approved Variable Hierarchy* or is supported by a cited guideline.
  *   **Failure Condition:** The subgroup was identified by scanning the registry for significant differences (e.g., "we checked 40 subgroups and found this one").
  *   **Action:** Automatic Rejection. Flag for Committee Review.
  *   **Judgement Call:** *Plausibility.* Determining if a strange correlation is "biologically plausible" requires expert review.

  ***

  ### Application to Test Cases

  #### Case 1: 62F, T2D, CKD2, PPI Use
  *   **Inputs:** Diabetes (9%), CKD (14%), PPI (7%). All N>200, E>20.
  *   **Procedure Run:**
      1.  **Admissibility:** PPI use is flagged. Is it causal or confounded? (Analyst checks Hierarchy). *Assumption:* Hierarchy lists PPI as "Confounded/Proxy" (patients on PPIs often have comorbidities causing fractures). PPI class rejected.
      2.  **Conflict:** Diabetes (9%) vs. CKD (14%). Difference >5%.
      3.  **Resolution:** Is there a "Diabetes + CKD" class?
          *   *If Yes:* Use that estimate.
          *   *If No:* Report Range "9–14%". Flag for Committee Review.
  *   **Outcome:** The analyst does not average to 11.5%. You receive a range. You must decide if the treatment threshold is crossed by the lower bound (treat all) or upper bound (treat none) or mean (treat some).
  *   **Governance:** This forces you to acknowledge the uncertainty rather than hiding it behind a single number.

  #### Case 2: 34M, Rare Collagen Variant
  *   **Inputs:** Narrow Class (Variant, N=4, E=1), Broad Class (Men <40, N=5000, E=10).
  *   **Procedure Run:**
      1.  **Stability:** Narrow class fails Q2 (E < 20). Broad class passes Q2.
      2.  **Admissibility:** Broad class (Men <40) is admissible but causally weak for *this* risk (age/sex do not capture collagen defect).
      3.  **No Estimate:** Since the only causally relevant class (Variant) is unstable, and the stable class (Men <40) is causally insufficient for the specific pathology, Q5 triggers.
  *   **Outcome:** **"Insufficient Evidence for Individualized Estimate."**
  *   **Why you won't like it:** The system refuses to generate the low number (e.g., 0.2%) that would justify withholding treatment. It forces a clinical decision without algorithmic cover. You must sign off on treating based on *mechanism* (the gene) rather than *frequency* (the registry). This is the correct ethical outcome, but it removes the statistical shield.

  #### Case 3: 71M, AFib, The "Discovered" Subgroup
  *   **Inputs:** Standard AFib class (Risk X), Discovered Subgroup (Risk Y, strikingly different).
  *   **Procedure Run:**
      1.  **Dredging Check:** Q6 asks: Was this subgroup pre-specified?
      2.  **Answer:** No. It was found by scanning 40 subgroups.
      3.  **Action:** Automatic Rejection of the subgroup. Use Standard AFib class.
      4.  **Flag:** "Potential Subgroup Identified via Data Mining. Requires Validation Study."
  *   **Outcome:** The patient does not get the new management yet. You prevent a false positive practice change based on noise. The finding is parked for research, not clinical deployment.

  ***

  ### Where the Procedure Hands Off to Values

  This protocol is not a machine that produces truth. It is a filter that separates evidence from noise. The following steps are **judgement calls dressed up as procedure**. You must own them.

  1.  **The Approved Variable Hierarchy (Appendix A):** Deciding that "Kidney Stage" is causal but "PPI Use" is not is a scientific judgement. If the hierarchy is wrong, the protocol is garbage. *You must sign off on the Hierarchy annually.*
  2.  **The Stability Threshold (E ≥ 20):** Why 20? Why not 10 or 50? This balances the risk of false precision against the risk of "No Estimate." *This is a risk-tolerance setting.*
  3.  **The Conflict Threshold (>5%):** Why is 4% disagreement acceptable but 6% is not? This defines when uncertainty becomes actionable. *This is a clinical policy decision.*
  4.  **The "No Estimate" Default:** When the system says "Insufficient Evidence," do we treat or withhold? The protocol stops at the number. The action following "No Number" is pure values. *You must define the Default Care Pathway for Indeterminate Risk.*

  ***

  ### What This Procedure Cannot Do

  You asked for the plain truth about the output.

  **1. It cannot deliver "The Probability."**
  There is no such thing as *the* probability that *this* patient will fracture. There is only the frequency of fractures in a group of patients we have *chosen* to treat as similar to this one. The protocol does not find the true risk; it selects the most defensible reference class.

  **2. It cannot resolve Causal Heterogeneity.**
  If Diabetes increases fracture risk via pathway A, and CKD via pathway B, and they interact non-linearly, the "Range" output (Case 1) admits we do not know the interaction. The protocol exposes our ignorance; it does not cure it.

  **3. It cannot replace Clinical Judgement in the "No Estimate" Zone.**
  In Case 2 (the collagen variant), the protocol correctly refuses to give a number. It cannot tell you whether to treat. It only tells you that you are acting on *theory* (the gene), not *data* (the registry). You must sign that decision.

  ### Final Recommendation for Signature

  Adopt this procedure with the following caveats:
  1.  **Appendix A (Variable Hierarchy)** must be drafted by your senior clinicians before the analysts start.
  2.  **"Insufficient Evidence"** must be a valid status in the Electronic Health Record, not an error state.
  3.  **Audit:** Randomly sample 10% of "Committee Review" flags monthly to ensure the hierarchy is not becoming outdated.

  This system trades the comfort of a single number for the integrity of an auditable argument. It will not stop clinicians from challenging you, but it will ensure that when they ask "Why that group?", you have an answer that distinguishes between *data*, *causality*, and *policy*.
