  There are three genuine tensions, but the deepest fault line runs between Eclipse Immunity (4) and Set-Respect (5), mediated by the Reachability Constraint (2).

  Your suspicion regarding idealization is correct: it is the pivot upon which your consistency turns. To satisfy (4), the deliberative route in (2) must be counterfactual; we must idealize away the depression to find a route from the *corrected* set to the action. To satisfy (5), the route must be actual; we cannot idealize away the exploiter's selfishness. You require a principled distinction between a psychological block (depression) and a constitutive element of the motivational set (selfishness). Without this, the view is ad hoc. If depression blocks the route, selfishness blocks the route equally effectively. If you count depression as removable noise to save (4), consistency demands selfishness be removable noise, violating (5). If selfishness is fixed to save (5), depression must be fixed, violating (4).

  | Rank | Tension | Resolution (Give Up) | Cost to the Set |
  | :--- | :--- | :--- | :--- |
  | 1 | (4) vs (5) | Abandon (4) or (5) | Losing (4) makes reasons too fragile; losing (5) makes internalism externalist-leaning. |
  | 2 | (1) vs (5) | Abandon (1) or (5) | Losing (1) reduces reasons to psychological artifacts; losing (5) preserves factualism. |
  | 3 | (2) vs (4) | Relax (2) | Requires a theory of "correctable" vs "constitutive" states to avoid arbitrariness. |

  Two apparent tensions dissolve. First, (3) and (2) are compatible because rejecting the instrumental principle distinguishes the *source* of normativity from the *mechanism* of deliberation; substantive deliberation allows non-desire facts to enter the route without violating internalism. Second, (6) and (1) are compatible because factualism distinguishes *truth conditions* from *epistemic access*; agents can be wrong about the facts or the routes available to them.

  The cost of maintaining (5) is high. It forces you to abandon (1), because if reasons are facts settled by how the world is, the fact that "suffering is bad" should constitute a reason regardless of the exploiter's set. By making reasons contingent on actual contingent psychology, (5) renders reasons local artifacts rather than worldly facts. Furthermore, (5) undermines (7); if the exploiter has no reason, claims about reasons cannot do critical work on him, only coercive work. The patient and the exploiter collapse into the same verdict unless you posit a metaphysical difference between "impediments" and "constituents" of the set, but on a naturalistic view, both are psychological states. If the route is sound only relative to the *actual* set (5), the patient has no reason (violating 4). If the route is sound relative to the *ideal* set (4), the exploiter has a reason (violating 5).

  You should abandon Set-Respect (5), as it contradicts your factualism (1) and forces an untenable distinction between psychological blocks and constitutive values.
