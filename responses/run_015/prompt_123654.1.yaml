answer: |-
  **1. The practice restated**
  The practice establishes a hierarchy of authority based on competence rather than contemporaneous desire. A prior competent self binds a future incompetent self, even when the latter objects vehemently, yet a present competent self may revoke any prior instruction instantly. Authority tracks the capacity for rational agency at a specific stage, not the intensity of current feeling. Furthermore, when no instruction exists, decision-makers must reconstruct the prior agent's values (substituted judgment) rather than maximize the current organism's welfare (best interests). The metaphysical work lies in treating the incompetent stage as lacking standing to override the competent stage, despite both occupying the same body and legal identity.

  **2. The implicit theory of the person across time**
  To justify overriding a contented later self, the practice presupposes a view where the person is more than a momentary subject of experience. It leans toward **endurantism**, the view that a person is wholly present at each moment of their life, identical to themselves across time. However, it modifies this with a **psychological continuity** constraint: only stages linked by rational narrative capacity count as authoritative agents. This is distinct from **perdurantism**, where persons are sequences of temporal parts, none wholly present. The practice treats the person as a unified project (**practical identity**) extended over time. The competent stage is the "author" of the life, while the incompetent stage is merely a "character" within it. Thus, the person persists biologically (ensuring the directive applies to *this* body), but authority persists only psychologically (ensuring only the *rational* self rules). This hybrid view allows the law to claim the later patient is the same person (for responsibility) but not the same agent (for authority).

  **3. Strict presupposition versus comfortable fit**
  The practice does not strictly require endurantism or perdurantism; the metaphysics is underdetermined. Both theories can accommodate the rules if paired with specific normative principles about autonomy. An endurantist can say the single person's critical interests outweigh experiential interests. A perdurantist can say earlier stages have property rights over later stages' bodies. What defeats the underdetermination is the law's treatment of legal liability. Because the later self remains liable for the earlier self's debts and crimes, the law presupposes numerical identity (endurantism or close equivalent) for responsibility. Yet, by silencing the later self's voice, it treats them as psychologically discontinuous (perdurantism). The practice floats free of the metaphysical dispute because it relies on a normative fiction: legal personhood is continuous, but moral authority is episodic. The inconsistency is not metaphysical but jurisdictional.

  **4. Two reconstructions compared**
  An **endurantist reading** posits one person whose true will was expressed competently. This handles the **permanent vegetative state** well: the entity exists, has no current interests, so the prior wish stands. It also fits **slow value changes**: the same person evolved, so the latest competent view wins. However, it struggles with the **contented demented patient**: why harm the currently existing person for a past version's abstract wish?
  A **perdurantist reading** views the directive as a contract between temporal stages. This handles the **manic patient** well: the manic stage is a distinct psychological entity bound by the sane stage's agreement. It also explains the **contented demented patient** as a conflict between two subjects. However, it struggles with **PVS**: if there is no later stage, who is bound? And it conflicts with the legal reality that the later stage inherits debts, which distinct temporal parts usually do not.
  The endurantist reading better preserves legal coherence (one debtor, one patient). The perdurantist reading better captures the moral intuition of discontinuity in dementia and mania. The practice implicitly switches between them: endurantism for liability, perdurantism for medical consent.

  **5. The contract and property asymmetry**
  The law binds future assets indefinitely but rarely binds future bodily service. Medicine seems an exception by binding the future body via directives. This does not undercut the reconstruction but refines it. Property is external to the person; binding it does not violate bodily integrity. Personal service contracts are void because they enslave the future agent. Advance directives are not seen as enslavement but as **self-legislation**. The asymmetry supports the view that the "Person" is the autonomous agent, not the biological organism. You can bind the organism's resources freely. You can bind the organism's body only to preserve the agent's narrative integrity. Medicine is not an exception to the rule against servitude; it is an application of the rule protecting autonomy. The earlier self binds the later body not to serve another, but to serve the continuity of the self's own critical interests.

  **6. What the temporal-parts reform would actually change**
  The reform treats the later stage as a distinct welfare subject and the directive as an inherited constraint (like an easement). This alters the justification from "consent" to "obligation." Currently, honoring a directive is respecting the patient's own will. Under the reform, it is respecting a predecessor's claim on a shared resource. This weakens the case for honoring directives. If the later stage is a distinct subject, enforcing a directive against a contented dementia patient looks like sacrificing Subject B for Subject A's peace of mind, which is ethically fraught.
  To adopt this seriously, hospitals would need to weigh the current stage's welfare explicitly against the predecessor's instruction, rather than assuming the instruction trumps. They would need a calculus for when an "easement" becomes too burdensome for the current occupant. This might lead to more overrides of directives when current suffering is high, transforming advance care planning from a guarantee of outcome into a weighted factor in a best-interests analysis.

  **7. Bottom line**
  The practice strictly presupposes biological continuity for identity and psychological continuity for authority. It is not metaphysically coherent, as it relies on two conflicting theories of persistence simultaneously. It is philosophically lucky: it works because legal personhood is a pragmatic fiction that ignores the metaphysical tension. The practice survives not because it solves the problem of persistence, but because it prioritizes normative stability over ontological purity. It assumes we are one person for blame, but many selves for consent, and relies on society's willingness to ignore the contradiction.
