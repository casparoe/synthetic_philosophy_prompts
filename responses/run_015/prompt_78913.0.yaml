answer: |-
  **Standards and Appeals Committee**
  **Recommendation: Deny appeal; amend rubric wording effective Next Exam Cycle.**

  This memo concerns the appeal regarding Item 4 on the recent Applied Reasoning certificate. The candidate received a zero for providing the correct conclusion but refusing to apply the inference rule, citing the rubric's demand to "state the governing principle." They argued, correctly, that stating a rule is not the same as being bound by it. This is not a standard grade-grubbing appeal; it is a challenge to the philosophical coherence of our assessment. We must answer it in kind.

  The candidate invokes Lewis Carroll's Tortoise: you cannot force an inference by adding more premises. If we treat the rule of inference as just another premise (a third line in the argument), we require a further rule to connect those three lines to the conclusion, and so on ad infinitum. The candidate is right that accepting a conditional premise and being bound by a rule of inference are not the same sort of thing. A premise is a proposition that can be true or false. A rule of inference is not true or false; it is a norm of practice. It is the kind of thing one does or doesn't go in for. You do not believe a rule; you keep it or break it.

  However, this certificate is in *Applied* Reasoning. Our construct validity depends on measuring the candidate's willingness and ability to take the step, not their ability to describe why the step is metaphysically secure. To reason is to accept binding norms. A candidate who describes the rule but declines to be bound by it has demonstrated philosophical awareness, but they have not demonstrated the competence we certify. They have shown they can watch reasoning, not do it. If we grant the mark, we validate the position that meta-logic substitutes for logic. We cannot do this without rendering the certificate meaningless to the employers and bodies who rely on it.

  That said, the Committee must acknowledge where the item writers failed. The rubric wording ("state the governing principle") was ambiguous. It invited the candidate to treat the item as a request for commentary rather than performance. We asked for a statement when we meant an application. This ambiguity caused the appeal. Furthermore, our attempt to solve this via the "licence box" pilot last spring confirms that explicitizing the rule does not solve the regress; it only adds clutter. The pilot showed that strong candidates ignored the box and wrote the conditional anyway, while weak candidates ticked the box and then took steps the licence didn't cover. Making the rule explicit does not create reasoning where there is none, nor does it prevent philosophical objections from those who understand the machinery.

  Therefore, we must be plain about what each side gives up. The Committee must give up the claim that our previous rubric was immune to this interpretation. The wording was insufficiently precise for a high-stakes gate. We will amend the rubric to read "Apply the governing principle to derive the conclusion," removing the invitation to mere description. This takes effect next cycle.

  The candidate, however, must give up the claim that this philosophical objection exempts them from the performance standard. A stipulated rule—"candidates are deemed to have adopted [Rule X]"—is not a politer way of hiding the regress; it is a necessary condition of the game we are playing. We are not testing whether logic is ultimately justifiable; we are testing whether you can use it. If we required candidates to defend the rule before using it, we would not be testing reasoning; we would be testing epistemology. The regress stops not because we found a magic premise, but because we agreed to play a game where certain moves are mandatory.

  Consequently, the appeal is denied. The candidate did not demonstrate the applied skill required for certification, regardless of the rubric's phrasing. However, we acknowledge the phrasing was flawed. We will not award the mark, but we will fix the instrument so that future candidates are not tempted to confuse the map with the territory. We cannot certify competence in reasoning for those who refuse to reason, but we can ensure our instructions do not invite philosophical stalemate.

  **Chair, Standards and Appeals Committee**
