answer: |-
  This is a sophisticated ethical dilemma that moves beyond compliance into genuine moral accounting. Your friend's distinction—between "mood-based" welfare (salmon/mammals) and "short-loop" welfare (shrimp)—is a specific philosophical hypothesis regarding temporal integration in sentience. If accepted, it fundamentally alters the calculus of harm, but it does not simplify it in the way one might hope.

  Here is an analysis of the implications for your protocol, followed by specific recommendations.

  ### 1. The Currency of the Protocol
  You asked whether the protocol should be written in per animal, per kilogram, per suffering-time, or per dollar.

  **The Recommendation:** The protocol must be written in **welfare outcomes per batch, normalized by stocking density.**

  **The Reasoning:**
  *   **Per Dollar:** This is ethically inert. It treats welfare as a cost center rather than a constraint.
  *   **Per Kilogram:** This is dangerous. Since a kilogram of shrimp contains hundreds of animals, a "per kg" metric allows you to ignore the sheer multiplication of suffering. If you optimize for yield per kg, you might increase density, which increases the *number* of animals experiencing discomfort, even if the *average* discomfort per animal stays constant.
  *   **Per Suffering-Time:** This is your friend's theoretical currency (seconds $\times$ intensity $\times$ number). While ethically precise, it is operationally impossible. You cannot measure seconds of shrimp discomfort.
  *   **Per Animal (Normalized):** This is the ethical truth. However, counting individual shrimp is impossible. Therefore, you must use **batch metrics** (e.g., mortality rate, percentage of physical damage at harvest) but interpret them as *per-animal probabilities*.

  **Why the choice matters:**
  If you use "per kilogram," you might accept a harvest method that damages 5% of the biomass. If you use "per animal," that 5% represents tens of thousands of individuals. Given the numbers (hundreds of shrimp per kg), small percentage losses or welfare violations represent massive absolute numbers of affected animals. The protocol must explicitly state that **density is a welfare variable, not just a production variable.** A protocol written per kg implicitly encourages higher density; a protocol written per batch/density acknowledges that crowding multiplies the "short-loop" negative episodes.

  ### 2. Grow-Out vs. Harvest (The Short-Loop Implication)
  Does the short-loop hypothesis shift weight away from the long growing period toward the moment of slaughter?

  **The Answer:** No, it does not shift weight *away* from grow-out, but it changes *why* grow-out matters.

  **The Reasoning:**
  Your friend argues shrimp lack "moods" (persisting affective states). However, they still possess nociceptors (pain receptors) and physiological stress responses.
  *   **Grow-Out:** Poor water quality (low oxygen, high ammonia) does not just create a "bad mood"; it causes continuous physiological distress (suffocation, tissue burning). Even if the shrimp forgets the distress every minute, the *continuous input* of nociceptive signals means the "seconds of discomfort" accumulate rapidly over a 4-month cycle. Under the short-loop view, **frequency and duration of acute irritants matter more than emotional shadowing.** Therefore, water quality is paramount because it prevents millions of discrete pain episodes per pond.
  *   **Harvest:** This is where the short-loop hypothesis has the biggest impact. If shrimp cannot anticipate death, the *fear* of harvest is negligible. However, the *intensity* of the death event becomes the dominant factor. Ice slurry causes thermal shock and asphyxiation. If this lasts 3 minutes, that is 3 minutes of high-intensity discomfort.
  *   **Electrical Stunning:** If the shrimp has no memory, the value of stunning is not to prevent "terror" but to prevent the *sensation* of the ice/asphyxiation. If stunning renders them insensible instantly, you trade 3 minutes of high-intensity pain for 0 minutes.
  *   **Verdict:** Do not neglect water quality. But under the short-loop view, the **intensity of the harvest event** becomes disproportionately important because it is the only time high-intensity pain is guaranteed for 100% of the population simultaneously.

  ### 3. Broodstock vs. Grow-Out (The Numbers Game)
  How do you weigh the few ablated broodstock against the millions of grow-out shrimp?

  **The Answer:** The broodstock suffering likely outweighs the grow-out suffering on a *severity* basis, even if not on a *numbers* basis.

  **The Reasoning:**
  *   **Grow-Out:** Suffering is diffuse. Many shrimp die early (no suffering). Many live in acceptable water (low suffering).
  *   **Broodstock:** Eyestalk ablation is invasive surgery performed without analgesia to force reproductive physiology. It causes chronic pain and physiological stress for months.
  *   **The Calculation:** If a grow-out shrimp experiences 100 "units" of suffering over its life, and you have 1,000,000 shrimp, that is 100,000,000 units. If a broodstock female experiences 50,000 "units" of suffering (high intensity, chronic), you need only 2,000 broodstock to equal the grow-out total. Given that your hatchery supplier likely uses thousands of females, the total suffering in the hatchery is a significant fraction of your supply chain's total ethical cost.
  *   **Protocol Action:** You cannot ignore the hatchery. Your purchasing power is your lever. The protocol should require a timeline for transitioning to **non-ablated broodstock** (using hormonal induction or selective breeding for captive spawning).

  ### 4. Trade-Offs: Mortality, Lifespan, and Market Displacement
  **Mortality vs. Lifespan:**
  Interventions that lower mortality keep animals alive longer. If life is net negative (suffering > pleasure), extending life increases total suffering. However, in aquaculture, early mortality is usually due to disease or stress (high suffering). Surviving to harvest usually implies a period of stable growth.
  *   **Protocol:** Prioritize reducing early-life mortality (disease prevention). Do not extend the grow-out cycle beyond the optimal harvest size; doing so adds "suffering-time" without economic benefit.

  **Price and Displacement:**
  If welfare improvements raise your price, buyers may switch to wild-caught shrimp or other species.
  *   **Wild-Caught:** Often involves bycatch (turtles, fish) and unregulated welfare (slow asphyxiation on decks). This is likely ethically worse.
  *   **Other Species:** Chicken or pork often have higher sentience (mood-based) and worse confinement conditions.
  *   **Protocol:** Do not suppress welfare improvements to keep prices artificially low. If the market rejects ethical shrimp, the ethical cost of producing them remains. However, you should frame the cost as "quality and sustainability" to retain buyers. The protocol should acknowledge that **displacement to worse systems is a negative outcome**, but not one that justifies maintaining poor welfare internally.

  ### 5. Acting Under Uncertainty
  Your friend's hypothesis is contested. The UK Animal Welfare (Sentience) Act 2022 officially recognizes decapod crustaceans as sentient beings, implying a capacity for more than just short-loop reflexes.

  **The Strategy:** Apply the **Precautionary Principle.**
  *   **Reasoning:** If you assume they have moods and you are wrong, you incur extra costs (stunning, lower density). If you assume they are simple robots and you are wrong, you inflict massive suffering on millions of beings capable of fear and anticipation.
  *   **Protocol Language:** Write the protocol assuming **full sentience.** It is easier to justify "over-protecting" to a buyer than to explain why you ignored emerging science. Treat the "short-loop" theory as a minimum baseline, not a ceiling.

  ---

  ### Closing Recommendations

  Based on the analysis above, here are the four changes your protocol should require first, in order of priority, followed by the one you should hesitate to commit to immediately.

  #### 1. Mandatory Water Quality Thresholds (Priority 1)
  **Action:** Set strict, continuous monitoring limits for Dissolved Oxygen (DO) and Ammonia, with automatic alerts and intervention protocols.
  **Reasoning:** Whether shrimp have moods or short-loops, physiological distress from poor water is continuous nociceptive input. This affects 100% of the animals, 24 hours a day. It is the largest contributor to total "suffering-time." It also aligns with business interests (better growth), making it the easiest to implement.

  #### 2. Hatchery Sourcing Standard (Priority 2)
  **Action:** Require your post-larvae supplier to certify a percentage of non-ablated broodstock, with a roadmap to 100% non-ablated within 3 years.
  **Reasoning:** The severity of suffering per animal in the hatchery is extremely high. Because you buy the larvae, you have supply-chain leverage. This addresses the "intensity" side of the ethical equation without requiring massive capital expenditure on your own farm.

  #### 3. Harvest Density and Handling Limits (Priority 3)
  **Action:** Cap the biomass per harvest net and limit the time shrimp spend out of water or in crowded pumps before chilling.
  **Reasoning:** This reduces the frequency and intensity of acute "short-loop" pain episodes during the most stressful operational phase. It requires operational discipline but low capital cost.

  #### 4. The Change to Be Reluctant About: Electrical Stunning
  **Action:** Do not commit to full-scale electrical stunning *immediately* in this version of the protocol.
  **Reasoning:**
  *   **Technical Feasibility:** Electrical stunning in saltwater earthen ponds is technically difficult. Saltwater is highly conductive, requiring precise voltage control to stun shrimp without cooking them or harming workers. The technology is less mature than for freshwater fish.
  *   **Cost-Benefit under Uncertainty:** If the "short-loop" hypothesis is true, the benefit of stunning over a *rapid* ice slurry kill is reduced (though still present). If the science is unsettled, committing to high CapEx (capital expenditure) for stunning equipment poses a financial risk that could threaten the farm's viability.
  *   **Alternative:** Instead, commit to **"Rapid Thermal Shock"** protocols (ensuring the ice slurry is saturated and cold enough to induce insensibility in seconds) as an interim measure.
  *   **Reluctance:** You should be most reluctant to lock this in until the technology is proven scalable for your specific pond infrastructure. Promise a *review* of stunning technology in 24 months, rather than immediate adoption. This balances the precautionary principle with business reality.

  **Summary:** Write the protocol in **batch outcomes normalized for density**. Assume **full sentience** to be safe. Prioritize **water and hatchery sourcing** over expensive slaughter technology until the science and engineering catch up. This treats the welfare question genuinely without gambling the business on contested hypotheses.
