answer: |-
  This is one of the sharpest technical questions in welfare economics. You are right to sense that your friend's objection and your intuition are talking past each other slightly, but technically, **your friend is correct about the requirements for Cost-Benefit Analysis (CBA),** even if your intuition about "levels" vs. "changes" is on the right track.

  Here is the technical breakdown of the measurement scales, why the affine transformation property blocks interpersonal comparisons of increments, and exactly what assumption CBA smuggles in.

  ### 1. The Measurement Scales: Ordinal vs. Cardinal
  To understand the blockage, we have to look at the **admissible transformations** of the utility function. In welfare economics, we classify utility information by what transformations leave the relevant ethical judgments invariant.

  *   **Ordinal Non-Comparable (ONC):** Utility is a ranking.
      *   *Transformation:* $U^*_i = f(U_i)$ where $f$ is any strictly increasing function.
      *   *Meaning:* We know $x \succ_i y$, but we don't know "how much."
  *   **Cardinal Unit Comparable (CUC):** Utility differences (increments) are meaningful and comparable across people, but levels are not.
      *   *Transformation:* $U^*_i = a U_i + b_i$ where $a > 0$ is **common across all individuals**, but $b_i$ can vary per individual.
      *   *Meaning:* We can compare $\Delta U_A$ to $\Delta U_B$, but we cannot compare $U_A$ to $U_B$.
  *   **Cardinal Full Comparable (CFC):** Both levels and increments are comparable.
      *   *Transformation:* $U^*_i = a U_i + b$ where $a > 0$ and $b$ are **common across all individuals**.
      *   *Meaning:* We can compare $U_A$ to $U_B$ and $\Delta U_A$ to $\Delta U_B$.

  ### 2. Why Affine Transformations Block Increment Comparisons
  You mentioned you know utility is defined up to positive affine transformations ($U' = aU + b$), but you don't see why this blocks comparing increments ($\Delta U$).

  The issue is that in standard microeconomic theory (specifically Von Neumann-Morgenstern expected utility), the affine transformation parameters ($a$ and $b$) are **individual-specific**.

  Let's look at the math. Suppose we have two people, Rich ($R$) and Poor ($P$).
  We want to claim: **The Poor gain more than the Rich lose.**
  Mathematically: $\Delta U_P > |\Delta U_R|$ (or $\Delta U_P + \Delta U_R > 0$).

  Now, apply the admissible transformations for **Cardinal Intrapersonal** utility (standard vNM utility):
  $$U^*_P = a_P U_P + b_P$$
  $$U^*_R = a_R U_R + b_R$$
  Where $a_P, a_R > 0$ are arbitrary scaling constants chosen independently for each person.

  When we look at the *change* in utility, the $b$ terms cancel out (which is why you don't need Level Comparability). However, the $a$ terms remain:
  $$\Delta U^*_P = a_P \Delta U_P$$
  $$\Delta U^*_R = a_R \Delta U_R$$

  Your welfare judgment relies on the inequality: $\Delta U_P + \Delta U_R > 0$.
  But under the transformed scales, the judgment becomes: $a_P \Delta U_P + a_R \Delta U_R > 0$.

  **The Problem:** Since $a_P$ and $a_R$ are arbitrary and independent, **you can always choose them to flip the sign of the sum.**
  *   Suppose in the original scale, the Poor gain 10 utils and the Rich lose 5 utils ($\text{Net} = +5$).
  *   A critic can say: "I choose to measure the Rich's utility in 'cents' and the Poor's in 'dollars'." (i.e., $a_R = 100, a_P = 1$).
  *   Now the Poor gain 10 and the Rich lose 500. ($\text{Net} = -490$).

  Because the "size of a util" ($a_i$) is not fixed across persons, comparing the *magnitude* of increments is mathematically meaningless without an additional assumption that links the scales.

  ### 3. Why the Pareto Principle Needs Less
  The Pareto Principle avoids this problem entirely because it does not require summing or comparing magnitudes across people.

  *   **Pareto Improvement:** $\Delta U_i \ge 0$ for all $i$, and $>0$ for at least one.
  *   **Invariance:** Since $a_i$ must be positive ($a_i > 0$), the **sign** of $\Delta U_i$ is invariant to affine transformations.
      *   If $\Delta U_P > 0$, then $a_P \Delta U_P > 0$ regardless of what $a_P$ is.
      *   If $\Delta U_R < 0$, then $a_R \Delta U_R < 0$ regardless of what $a_R$ is.

  Pareto only requires checking the sign of each individual's change against **zero**, not against each other. Therefore, Pareto only requires **Ordinal Non-Comparable (ONC)** information. It does not require interpersonal comparability.

  In your tax example: Since the Rich lose utility ($\Delta U_R < 0$), the policy is **not** a Pareto improvement. You cannot justify it using Pareto alone.

  ### 4. What CBA "Smuggles In"
  When a Cost-Benefit Analysis says "The benefits to the poor outweigh the costs to the rich," it is making a specific interpersonal comparison.

  If CBA is done in **utility terms**, the minimal assumption required is **Cardinal Unit Comparability (CUC)**. You must assume that the scaling factor $a$ is the same for everyone ($a_P = a_R = a$). This allows you to say $\Delta U_P + \Delta U_R > 0$ is a meaningful statement.

  However, CBA is usually done in **monetary terms** (summing Willingness to Pay). This smuggles in an even stronger assumption.
  *   WTP depends on the Marginal Utility of Income ($MU_Y$).
  *   $\text{WTP} \approx \frac{\Delta U}{MU_Y}$.
  *   Summing WTP ($\sum \text{WTP}_i$) assumes that $\$1$ represents the same amount of utility for the Rich as it does for the Poor.
  *   **The Smuggled Assumption:** **The Social Marginal Utility of Income is constant across individuals.**

  This is ethically controversial because we generally believe the Marginal Utility of Income is diminishing (a dollar is worth more utility to a poor person than a rich person). By summing dollars equally, standard CBA implicitly weights the utility of the rich *more heavily* than the utility of the poor (because the rich need more dollars to generate a unit of utility loss).

  ### 5. Summary for Your Paper
  To answer your specific questions directly:

  1.  **Distinction between Levels and Increments:**
      *   **Levels ($U_A$ vs $U_B$):** Requires fixing the zero-point ($b$) and the unit ($a$) across persons. (Full Comparability).
      *   **Increments ($\Delta U_A$ vs $\Delta U_B$):** Requires fixing the unit ($a$) across persons, but the zero-point ($b$) cancels out. (Unit Comparability).
      *   **Your Intuition:** You were right that we don't need to compare *Levels* (we don't need to know if the poor are happier than the rich in total). But your friend was right that we *do* need to compare *Increments* to say the gain outweighs the loss.

  2.  **Why Affine Transformations Block Increments:**
      *   Because the scaling factor $a_i$ is independent for each person. Without a rule linking $a_P$ to $a_R$, the ratio $\Delta U_P / \Delta U_R$ is arbitrary.

  3.  **Why Pareto Needs Less:**
      *   Pareto only compares $\Delta U_i$ to $0$. The sign is preserved under any positive affine transformation. It requires no interpersonal comparison.

  4.  **The Minimal Assumption in CBA:**
      *   To claim "A's loss is smaller than B's gain," an ordinal framework is insufficient. The minimal assumption is **Cardinal Unit Comparability (CUC)**.
      *   If using monetary CBA, the assumption is **Equal Marginal Utility of Income**.
      *   This is the "controversial assumption" you are looking for. It transforms a technical efficiency calculation into a specific utilitarian ethical judgment (specifically, classical utilitarianism with equal weights).

  **Recommendation for your paper:**
  Frame the tax policy as a move from a Pareto framework (which blocks the policy because the rich lose) to a Kaldor-Hicks or Utilitarian framework (which allows it). Argue that CBA attempts to operationalize this using money, but in doing so, it implicitly adopts a specific Social Welfare Function that weights individuals by their income-elasticity of utility, often biasing results against redistribution unless explicit distributional weights are applied. This makes CBA not "value-free," but rather committed to a specific (and often unacknowledged) theory of distributive justice.
