answer: |-
  This is the right question to ask. The field of moral uncertainty (MU) has matured past the "why does it matter?" phase (MacAskill 2014) and is now hitting the "how do we actually compute this?" wall. If your goal is to build **decision procedures** (algorithms, formal rules, or actionable frameworks) rather than write meta-ethics, you need to prioritize technical bottlenecks over foundational philosophy.

  Here is the ranking of the three most upstream open problems for building decision procedures, defended by their blocking relationships, followed by an evaluation of the "abandon credences" debate and a 6-month research plan.

  ### The Ranking: Upstream Bottlenecks for Decision Procedures

  #### 1. Intertheoretic Value Comparison (IVC): The "Zero Point" and Scale Problem
  **Status:** The Hard Math Blocker.
  **Why it's #1:** You cannot run a Maximizing Expected Choice-worthiness (MEC) algorithm—which is the only general-purpose decision procedure we currently have—without a common currency. It is not enough to say "Theory A is cardinal and Theory B is ordinal." The specific bottleneck is the **zero-point problem**.
  *   **The Block:** Utilitarianism might say Action X has value +10. Deontology might say Action X is "permissible." Even if you map "permissible" to a number, where is *zero*? Does "zero" mean neutral value, or the bottom of the scale? If Theory A has no lower bound and Theory B does, expectation maximization breaks (infinite variance or dominance issues).
  *   **Blocking Relationship:** This blocks everything else. If you cannot normalize values across theories, you cannot aggregate credences. If you can't aggregate, dynamic updating (Rank #2) is irrelevant because you have no objective function to optimize over time.
  *   **Current State:** Stuck on "extended normalization" (MacAskill) vs. "variance voting" (Holler) vs. "pairwise comparison." None handle mixed cardinal/ordinal theories robustly without arbitrary parameters.

  #### 2. Structural Incommensurability (Theory Individuation)
  **Status:** The Modeling Blocker.
  **Why it's #2:** Before you can compare values (IVC), you have to represent the theories in a compatible data structure. Most MU research assumes all theories output a "choice-worthiness function." They don't.
  *   **The Block:** Consequentialist theories output a scalar value for every outcome. Deontological theories output constraints (binary permissibility). Virtue ethics outputs dispositional assessments. To build a decision procedure, you need a formal language that translates constraints into the expectation calculus without trivializing them (e.g., treating a constraint as just a very large negative utility is a hack that breaks under uncertainty).
  *   **Blocking Relationship:** This blocks IVC. You cannot compare values if the theories aren't asking the same question. If you solve IVC but assume all theories are consequentialist, your decision procedure is useless for real-world moral diversity.
  *   **Current State:** Very little formal work here. Most papers wave hands at "deontology under uncertainty."

  #### 3. Dynamic Updating of Moral Credences
  **Status:** The Learning Blocker.
  **Why it's #3:** Current MU models are almost entirely static. They assume you have a prior credence distribution and act. But moral agents learn. The problem is defining **moral evidence**.
  *   **The Block:** How does empirical evidence update moral credences? (e.g., If I see suffering, does that increase my credence in Utilitarianism or Sentientism?) More critically, how does *moral* evidence update credences without begging the question? If you update based on moral intuition, you are assuming the reliability of the theory you are testing.
  *   **Blocking Relationship:** This blocks long-term deployment. A decision procedure that cannot update is a one-shot tool. However, it is ranked #3 because you can build a static decision procedure (Rank #1 & #2) without solving learning. You cannot build *any* procedure without solving #1 and #2.
  *   **Current State:** Almost non-existent. Riedener (2021) touches on it, but there is no consensus on a Bayesian update rule for moral hypotheses.

  ---

  ### What Would Flip This Ranking?

  1.  **If IVC is Proven Impossible:** If a rigorous proof demonstrates that intertheoretic comparison is metaphysically incoherent (not just hard), the ranking flips immediately. **Problem #3 (Updating)** and the **"Abandon Credences"** debate become #1, because the field must pivot to non-comparative models (e.g., stochastic dominance or voting-based systems).
  2.  **If "Moral Evidence" is Formalized:** If someone successfully derives a likelihood function for how empirical data updates moral theory credences, **Dynamic Updating** jumps to #1. This would turn MU from a static calculus into a learning algorithm, which is vastly more valuable for AI alignment.
  3.  **If the "Normative Uncertainty" Shift Gains Traction:** Moving from *Moral* to *Normative* (including epistemic/prudential norms) doesn't change the math much, but if it reveals that moral uncertainty is just a subset of general normative uncertainty, **Structural Incommensurability** becomes less relevant (as we'd use a broader normative language). This is unlikely to flip the ranking soon.

  ---

  ### Is "Abandoning Credences" a Distraction?

  **Verdict:** Productive boundary testing, but **do not start there.**

  The debate over whether we should have credences in moral theories (the "Objective Chance" or "Moral Fetishism" objection) is philosophically vital but practically downstream.
  *   **Why it's productive:** It forces researchers to justify why MEC is the right aggregation rule. If MEC is incoherent, solving IVC is wasted effort. Work on **Stochastic Dominance** (e.g., Russell, 2023) is the concrete output of this line of thinking. It offers decision rules that don't require cardinal IVC.
  *   **Why it's a trap for a 6-month project:** It is easy to write a paper arguing "MEC is hard," and hard to write a paper proposing a working alternative. If your goal is to *build decision procedures*, you need to assume a framework exists to test its limits. Abandoning credences leaves you with very few formal tools (mostly voting theory or dominance rules), which are currently less expressive than MEC.

  **Recommendation:** Treat the "Abandon Credences" literature as a constraint check. Use it to stress-test your IVC solutions, but don't make it your primary research object unless you are specifically working on Stochastic Dominance models.

  ---

  ### 6-Month Research Plan: High-Leverage Energy Allocation

  If you want to move the needle on **decision procedures**, do not spend 6 months reading meta-ethics. Spend it on the math of aggregation and representation.

  **Months 1-2: Master the IVC Technicals (The #1 Bottleneck)**
  *   **Focus:** Normalization techniques and the zero-point problem.
  *   **Read:** MacAskill (2014) *Normative Uncertainty* (Chapters 5-7), Riedener (2021) *Expected Value Theory*, and recent critiques on "variance voting."
  *   **Task:** Attempt to formalize a comparison between a bounded utilitarian theory and a lexical deontological theory. Identify exactly where the math breaks. Is it the zero point? The unit?
  *   **Goal:** Produce a formal model showing a specific failure case in current IVC methods.

  **Months 3-4: Structural Incommensurability (The #2 Bottleneck)**
  *   **Focus:** Representing non-consequentialist theories in decision matrices.
  *   **Read:** Lockhart (2000) *Moral Uncertainty and its Implications*, and recent work on "deontological constraints under uncertainty." Look at computer science literature on **constraint satisfaction problems** vs. **optimization problems**.
  *   **Task:** Propose a data structure that can hold both a utility function and a hard constraint, and define how a "credence" weights the constraint. (e.g., Does 10% credence in a constraint mean you violate it 10% of the time? No. So what does it mean?)
  *   **Goal:** A prototype formalism for "mixed-structure" moral aggregation.

  **Months 5-6: Stress Test with "Abandon Credences" Alternatives**
  *   **Focus:** Stochastic Dominance and Voting Models.
  *   **Read:** Wilkinson (2022) on stochastic dominance, and literature on "Borda Count" approaches to MU.
  *   **Task:** Run your Month 4 model against a Stochastic Dominance rule. Does the dominance rule avoid the IVC problems you found in Month 2? If so, is it too weak (i.e., fails to give guidance often enough)?
  *   **Goal:** A comparative analysis: "When does MEC fail such that we *must* switch to Dominance rules?"

  ### Summary
  1.  **IVC (Zero Point)** is the wall. You can't climb it without a scale.
  2.  **Structural Incommensurability** is the terrain. You can't climb if the ground is different shapes.
  3.  **Updating** is the weather. Important, but don't worry about the rain until you can climb the rock.

  Ignore the "Normative Uncertainty" semantic shift; it doesn't change the math. Treat the "Abandon Credences" debate as a stress test, not a foundation. If you solve the **Zero Point problem in IVC** for mixed-structure theories, you will have done more for practical decision procedures than 90% of the current literature.
