      *   Also, the *motivation* problem. If the worst thing is a sunburn, will we cure cancer? Maybe not. But if the worst thing is bone mets, we *have* to. Thinning might reduce the drive to solve the root causes if the symptoms are manageable.
      *   *Wait, better weak point:* The **Phenomenal/Informational Decoupling**. Can you actually separate the "ouch" from the "pay attention"? Evolutionarily, they are fused. Thinning assumes we can surgically separate intensity from urgency. That's a massive neuroscientific gamble.

