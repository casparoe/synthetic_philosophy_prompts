prompt: |-
  I'm organizing a session for a graduate seminar in political philosophy on the conceptual architecture of dynastic wealth, and I want to use a satirical exercise to clarify how inheritance-tax debates often smuggle in unstated theories of opportunity and desert. For this purpose, please write an approximately 650-word parody of a government white-paper—specifically, a deadpan executive summary issued by a fictional "Bureau of Intergenerational Equity"—introducing a proposed regulatory metric called the "Dynastic Opportunity Entropy Index" (DOEI). The DOEI should treat inherited capital not as liquid wealth but as a form of "frozen opportunity" that decays exponentially across generations unless actively preserved through tax-advantaged structures such as grantor-retained annuity trusts, philanthropic holding companies, and dynasty trusts with perpetual-duration clauses.

  The satire should exaggerate real argumentative moves found in both defenses of dynastic wealth—framing heirs as stewards of civilizational capital, treating charitable endowments as functional substitutes for progressive taxation, describing estate taxes as disruptions of long-horizon family planning, and invoking meritocratic language to describe birth-order privilege—and in certain egalitarian critiques that rely on metaphors of "leveling the playing field" without specifying the baseline from which equality is measured. Every claim in the bureaucratic voice should follow consistently from the premise that opportunity is a conserved, zero-sum substance, so that the absurdity emerges from the metric's own internal logic rather than from caricatured personalities or invented economic mechanisms. You may include hypothetical data tables, invented institutional acronyms, and named fictional proponents (for example, a "Dr. Alistair Vance" defending the DOEI's calibration), but do not cite real scholars by name, provide bibliographies, reference specific legislation, or include footnotes.

  Please keep the tone formal, technical, and entirely deadpan—no winking asides—so that a reader familiar with public-choice economics or Rawlsian equal-opportunity theory recognizes the targets immediately, while a non-specialist can still follow the bureaucratic reasoning. The goal is to make the conceptual tension between meritocratic rhetoric and dynastic preservation visible through the index's calculations and policy recommendations, without ever stating the underlying objection explicitly. Format the piece as numbered sections (Executive Summary, Methodology, Policy Implications, Conclusion) in the style of a regulatory impact assessment.
