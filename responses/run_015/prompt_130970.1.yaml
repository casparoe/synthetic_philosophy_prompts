      *   *Modal Fragility vs. Overdetermination:* This is the crux. If the outcome is *overdetermined*, removing Hitler changes little. If it's *modally fragile*, removing Hitler changes the outcome significantly.
      *   *Weber Point:* Weber distinguishes charismatic, traditional, and legal-rational authority. The friend is arguing about the "routinization of charisma." The user thinks this mixes categories. I need to clarify if charisma *becoming* bureaucracy is a category error or a historical process.

