      *   **The Great Man Case (Modal Fragility):** Focus on Hitler's specific role. His radicalization of antisemitism, his risk-taking in foreign policy (Remilitarization of Rhineland), the specific "will" behind the Final Solution. Argument: Without him, the regime might have been a standard dictatorship, not a racial utopia seeking total annihilation.
