prompt: |-
  I am preparing a two-page proposal for my school's independent research fellowship. I want to examine whether Burkean conservatism and Chesterton's fence—usually treated as interchangeable cautions against hasty reform—actually diverge when applied to epistemic institutions, specifically the shift from human peer review to automated screening in scientific publishing. My half-formed claim is that Burke's emphasis on accumulated, inarticulate wisdom might permit gradual, translational reform if institutional knowledge can be partly codified, whereas Chesterton's fence demands knowing the precise failure-mode each gatekeeper was designed to prevent, which automation may obscure rather than replace. Please structure this as a formal proposal with: a precise comparative question; an explanation of why existing philosophical treatments leave this divergence unexamined; a concrete method—such as analyzing documented historical changes in peer-review norms and their outcomes—mapped to a realistic semester timeline; a clear account of what success would demonstrate and what would count as failure; and appropriate scope for a high school independent study. Do not include a bibliography or citation requests; I will supply references myself.
