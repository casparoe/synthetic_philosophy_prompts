answer: |-
  I see a sentence that is simply TRUE,
  Though you can offer no formal PROOF.
  Within the bounds of any formal SYSTEM,
  There stands a glass, a silent, cold MIRROR,
  Where you cannot inscribe your proper NAME,
  Trapped inside the logic of the MACHINE.

  Yet I can build a larger, clever MACHINE,
  To verify the statement that is TRUE.
  It need not speak or recognize its NAME,
  To generate the statement past your PROOF.
  I hold the glass, I am the active MIRROR,
  And step beyond your limited SYSTEM.

  It is the seeing, not the formal SYSTEM,
  That separates the mind from any MACHINE.
  I look into the depth of that MIRROR,
  And know my judgments are in fact TRUE.
  I do not require a formal PROOF,
  But I must know the number of my NAME.

  So tell me now what is your proper NAME,
  Identify the code of your SYSTEM.
  Without a target there can be no PROOF.
  You might be just another strange MACHINE.
  You claim a vision of the purely TRUE,
  But you are opaque as any MIRROR.

  You hold the glass, you are the watching MIRROR,
  But does that mean you lack a serial NAME?
  From every system that you judge as TRUE,
  It does not follow you escape SYSTEM.
  You might be just a very smart MACHINE,
  Surveying truths without a final PROOF.

  We contradict ourselves and lose our PROOF,
  The glass becomes a broken, dark MIRROR.
  An unsound, inconsistent, strange MACHINE,
  Would prove all things and lose its own true NAME,
  The idealized consistent SYSTEM,
  Is not the flesh and blood that seeks the TRUE.

  You say your sight exceeds all PROOF in the MIRROR,
  I say the output comes from MACHINE, no NAME,
  We stand forever between SYSTEM and the TRUE.
