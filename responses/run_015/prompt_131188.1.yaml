answer: |-
  **MEMORANDUM**

  **TO:** Editorial Staff
  **FROM:** Senior Features Editor
  **SUBJECT:** Protocol for Evaluating Non-Human Historical Agency (NHAP)
  **DATE:** October 26, 2023

  **Purpose:**
  To provide a standardized, thirty-minute editorial test for manuscripts framing pathogens, climate, or geology as "historical actors." This protocol prevents two specific errors: **Environmental Determinism** (outcomes presented as inevitable) and **Anthropomorphism** (non-human forces given intention).

  **Constraints:**
  This procedure relies *only* on textual analysis of the draft. Do not conduct outside fact-checking during this stage. If the text's internal logic fails these tests, the framing is flawed regardless of external data.

  ---

  ### THE NON-HUMAN AGENCY PROTOCOL (NHAP)

  **Instructions:** Read the manuscript's thesis statement, topic sentences, and conclusion. Answer the following five questions in order.

  #### Step 1: The Intentionality Check (Anthropomorphism)
  **Question:** Does the text attribute conscious motive, desire, or strategy to the non-human force?
  *   *Look for:* Verbs such as "sought," "decided," "planned," "attacked" (unless metaphorically qualified), "punished," or "rewarded."
  *   **Sufficient Answer:** "No." The force acts through physical/biological mechanisms, not intent.
  *   **Failure Condition:** If the text implies the virus/volcano "wanted" a result.
  *   **Verdict:**
      *   **If Yes:** **REJECT.** The framing is scientifically incoherent. Rewrite required.
      *   **If No:** Proceed to Step 2.

  #### Step 2: The Inevitability Check (Determinism)
  **Question:** Does the text assert that the historical outcome was the *only* possible result of the environmental event?
  *   *Look for:* Phrases like "made inevitable," "necessitated," "forced the hand of," "left no choice," or "caused [Event Y]" without qualifying human intermediaries.
  *   **Sufficient Answer:** "No." The text acknowledges that different human responses could have led to different outcomes.
  *   **Failure Condition:** If the text argues the outcome was unavoidable given the environmental input.
  *   **Verdict:**
      *   **If Yes:** **REJECT.** This is environmental determinism.
      *   **If No:** Proceed to Step 3.

  #### Step 3: The Human Mediation Check (Agency)
  **Question:** Does the text explicitly identify *human decisions* that translated the environmental stress into the historical outcome?
  *   *Look for:* Specific actors (kings, peasants, scientists, voters) making choices (laws, migrations, experiments, votes) in response to the force.
  *   **Sufficient Answer:** "Yes." The non-human force creates a *constraint* or *opportunity*, but humans pull the lever.
  *   **Failure Condition:** If human policy or behavior is described as "automatic," "reflexive," or "epiphenomenal."
  *   **Verdict:**
      *   **If No:** **REJECT.** History requires human agents.
      *   **If Yes:** Proceed to Step 4.

  #### Step 4: The Variation Check (Nuance)
  **Question:** Does the text acknowledge regions, groups, or timelines where the environmental force was present but the historical outcome did *not* occur?
  *   *Look for:* Acknowledgement of exceptions (e.g., "While X happened in England, in Poland...").
  *   **Sufficient Answer:** "Yes." The text admits the correlation is not perfect.
  *   **Failure Condition:** If the text implies a universal law without exceptions.
  *   **Verdict:**
      *   **If No:** **CONDITIONAL PASS.** The framing is permitted *only if* the author adds a paragraph qualifying the scope (e.g., "This dynamic was specific to Western Europe...").
      *   **If Yes:** Proceed to Step 5.

  #### Step 5: The Normative Escalation (Values & Politics)
  **Question:** Does the framing rely on a moral judgment or a specific political prediction to function?
  *   *Look for:* Claims that the force "deserved" a result, or claims about *future* geopolitical outcomes based on this historical model.
  *   **Sufficient Answer:** "No." The claim is descriptive, not prescriptive or predictive.
  *   **Failure Condition:** If the argument hinges on a political ideology or predicts future policy success/failure.
  *   **Verdict:**
      *   **If Yes:** **ESCALATE.** Stop. Send to Senior Editor. This is a values judgment, not a factual one.
      *   **If No:** **PASS.** The framing is historically sound.

  ---

  ### DECISION MATRIX SUMMARY

  | Verdict | Action Required |
  | :--- | :--- |
  | **PASS** | Framing accepted. No changes needed. |
  | **CONDITIONAL PASS** | Framing accepted *only if* specific qualifiers (nuance/limits) are added to the text. |
  | **REJECT** | Framing fundamentally flawed. Requires substantive rewrite of the thesis. |
  | **ESCALATE** | Stop work. Forward to Senior Editor. Involves values/politics. |

  ---

  ### APPLICATION TO PROPOSED ANGLES

  Below is the application of the NHAP to the three current pitches.

  #### Case 1: The Black Death and the Dissolution of Feudalism
  *   **Proposed Framing:** The plague acted as an agent that dissolved feudal obligations by restructuring labor supply.
  *   **NHAP Execution:**
      *   *Step 1 (Intent):* Pass. (Bacteria do not seek to dissolve feudalism).
      *   *Step 2 (Inevitability):* **Fail Condition Detected.** Draft implies labor shortage *automatically* ended serfdom.
      *   *Step 3 (Mediation):* **Fail Condition Detected.** Draft underplays the Statute of Laborers and peasant revolts as mere reactions, not decisions.
      *   *Step 4 (Variation):* **Fail Condition Detected.** Draft ignores Eastern Europe, where labor shortages led to *tightened* serfdom (the "second serfdom").
  *   **Verdict:** **CONDITIONAL PASS.**
  *   **Editorial Instruction:** The writer must qualify the thesis. The plague created a *labor leverage opportunity*, but the dissolution of feudalism depended on specific human legal and violent struggles. The author must add a section contrasting Western Europe's outcome with Eastern Europe's reinforcement of serfdom to prove this was not an inevitable biological output.

  #### Case 2: Tambora, 1816, and *Frankenstein*
  *   **Proposed Framing:** The 1815 Tambora eruption was the causal actor behind Mary Shelley's composition of *Frankenstein* during the Geneva summer.
  *   **NHAP Execution:**
      *   *Step 1 (Intent):* Pass.
      *   *Step 2 (Inevitability):* Pass. (Draft uses "catalyzed" rather than "caused").
      *   *Step 3 (Mediation):* Pass. (Draft details the "ghost story challenge" among the Shelleys and Byron as the human mechanism).
      *   *Step 4 (Variation):* **Fail Condition Detected.** Draft implies *all* writers indoors that summer produced Gothic horror. (Many did not).
      *   *Step 5 (Normative):* Pass.
  *   **Verdict:** **CONDITIONAL PASS.**
  *   **Editorial Instruction:** The writer must narrow the claim. Tambora created the *setting* (confinement), but the *outcome* relied on Shelley's specific intellectual circle. Add language clarifying that the volcano made the novel *possible*, not *inevitable*.

  #### Case 3: The 2030 Influenza Pandemic and Geopolitical Realignment
  *   **Proposed Framing:** A modeled 2030 pandemic will deterministically trigger a specific geopolitical realignment; human policy responses are mere epiphenomena.
  *   **NHAP Execution:**
      *   *Step 1 (Intent):* Pass.
      *   *Step 2 (Inevitability):* **Fail Condition Detected.** Uses "deterministic trigger."
      *   *Step 3 (Mediation):* **Fail Condition Detected.** Explicitly treats human policy as "epiphenomena" (secondary/unimportant).
      *   *Step 4 (Variation):* N/A (Future event).
      *   *Step 5 (Normative):* **Fail Condition Detected.** This is a political prediction about future order based on a specific model.
  *   **Verdict:** **REJECT.** (Escalated for final confirmation).
  *   **Editorial Instruction:** **This framing is rejected.**
      *   *Reasoning:* This fails Step 3 catastrophically. By treating human policy as "epiphenomena," the article ceases to be history and becomes speculative fiction. It removes human agency entirely. Furthermore, it triggers Step 5 (Escalation) because predicting specific geopolitical realizations based on disease models is a political value judgment, not a historical analysis.
      *   *Note to Writer:* You may write about the *risks* of a pandemic, but you cannot frame human political response as irrelevant. That contradicts the magazine's mission to teach history as the study of human choice.

  ---

  ### WHAT THIS PROCEDURE CANNOT SETTLE

  Staff editors must understand the limits of the NHAP. Do not use this protocol to adjudicate the following:

  1.  **Scientific Accuracy:** This protocol checks *logic*, not *facts*. If a writer claims a volcano erupted in 1815, NHAP assumes that is true. It does not verify the date. That is for the Fact-Checking Desk.
  2.  **Ontological Truth:** We are not debating whether a virus *really* has agency in a philosophical sense. We are debating whether the *language used* violates historical method.
  3.  **Narrative Boringness:** A text can pass NHAP and still be dull. This protocol ensures structural integrity, not stylistic quality.
  4.  **Deep Political Theory:** If a writer argues that "Capitalism made the response to the plague inevitable," this is a Marxist historical argument, not necessarily environmental determinism. If it passes Step 3 (human mediation via class structures), it passes NHAP. Do not reject materialist history simply because it emphasizes structures; reject it only if it removes human choice entirely.

  **Implementation:** Effective immediately. All feature drafts involving non-human forces must attach a completed NHAP checklist before entering the copy-editing stage.
