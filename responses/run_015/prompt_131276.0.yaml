prompt: |-
  I'm writing the take-home final for my upper-level philosophy seminar on meaning in life (juniors and seniors, not grad students). I need an essay question that doesn't let them just recite Camus's absurd hero and Susan Wolf's hybrid view from memory. The crux should be whether Camus's Sisyphus can satisfy the 'objective value' half of a hybrid theory once you deny any cosmic or transcendent framing — and whether that means hybrid accounts secretly smuggle in the kind of grand narrative that absurdism rejects.

  To make it weirder and less boilerplate, inject a niche conceptual twist: ask them to consider 'counterfactual resilience,' meaning whether a life-project still counts as objectively valuable if the agent learns the universe is a simulation run by indifferent programmers. A smart student should be able to reason through this from the core theories without knowing some obscure paper.

  Please give me:
  1. The exam prompt (90 min, 800-1000 words expected).
  2. A model answer around 600 words.
  3. A marking scheme that seperates A from B answers — name the specific moves (e.g., distinguishing local vs cosmic objectivity, recognizing Wolf's potential escape via intersubjective robustness, actually using Camus's concept of revolt instead of just saying Sisyphus is happy).

  Make sure everything is in American English (I have to upload this to the LMS tonite and my chair hates British spellings). Don't ask for bibliographies, page citations, or reading lists — they won't have books in front of them and I don't want them making up references.

  Keep the tone readable, not overly formal.
