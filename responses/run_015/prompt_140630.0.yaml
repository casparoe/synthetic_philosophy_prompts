prompt: |-
  I'm teaching a 90-minute session on Lakatos to about 20 undergrads in a philosophy of science course, and I want them to *feel* why nobody working inside a research programme ever experiences its degeneration as a refutation -- it always just looks like one more awkward anomaly that some clever grad student will patch. Design me a game for that.

  Rough shape I have in mind (change it if it won't work): teams of 4-5 each declare a "hard core" of 2-3 claims they publicly pledge never to give up, plus a starting "protective belt" of auxiliaries. Over 5-6 rounds I hand out phenomenon cards. A team can register a sealed prediction before the reveal; if it hits, that's a novel fact and scores a progressive point. If a card contradicts them, they patch by adding an auxiliary to the belt, which scores nothing and costs a belt token. Everyone also gets one "monster-barring" card they can play to disqualify a phenomenon.

  The bit I most want your help designing: a rule that makes "there is no instant rationality" into something they're stuck under rather than a quote on a slide. Say -- a team may only abandon its hard core after two full rounds of patching with no successful novel prediction, and even then a "Lakatosian judge" (me) can grant a reprieve based only on the public record, never on which core is actually true.

  Give me concrete materials (including what goes on ~15 phenomenon cards), the scoring, a round-by-round timeline with no lecture up front and no Lakatos vocabulary until the debrief, and then a debrief that maps specific moments onto hard core vs protective belt, negative vs positive heuristic, and progressive vs degenerating problem shifts. Also: what will predictably go wrong the first time I run it (someone declares a hard core so vague it can't be hit, everyone just patches forever, the judge gets accused of favouritism) and how to handle each. And be honest about what the game can't reproduce -- especially that real appraisal of a programme takes decades, which 90 minutes necessarily compresses into nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Imre Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Target Audience:** ~20 undergraduates, Philosophy of Science course.
      *   **Duration:** 90 minutes.
      *   **Goal:** Students need to *feel* why degeneration isn't experienced as refutation internally (it feels like patching anomalies), and experience the "no instant rationality" constraint.
      *   **Proposed Mechanism:** Teams declare a "hard core," have a "protective belt," face "phenomenon cards," make predictions, patch anomalies, use "monster-barring."
      *   **Specific Constraint:** Need a rule that enforces "no instant rationality" (can't abandon core immediately, need judge's reprieve).
      *   **Deliverables:** Concrete materials (phenomenon cards), scoring, round-by-round timeline (no upfront lecture), debrief mapping game mechanics to Lakatosian concepts, troubleshooting (what goes wrong), and limitations of the simulation.

  2.  **Evaluate the Proposed Mechanism:**
      *   *Strengths:* Gamification makes abstract concepts concrete. The tension between patching and predicting mirrors the progressive/degenerating shift.
      *   *Weaknesses:* 90 minutes is tight for 5-6 rounds + debrief. "Hard core" declarations might be too vague (e.g., "Everything is energy"). Scoring needs to incentivize risk without making failure fatal too soon. The "Judge" role needs clear criteria to avoid accusations of bias.
      *   *Refinement:* The "no instant rationality" rule needs to be structural, not just a suggestion. The "reprieve" mechanic is tricky; better to make the *cost* of switching programmes prohibitively high until a specific threshold is met, simulating the sociological inertia of science.

  3.  **Designing the Game ("The Research Programme Race"):**

      *   **Setup:** 4 teams of 5.
      *   **Hard Core:** Needs to be specific enough to be falsifiable but broad enough to sustain a programme. Let's give them domains (e.g., Astronomy, Medicine, Physics) to ground it, or let them invent theories about a specific fictional universe to avoid prior knowledge bias. *Decision:* Let's use a fictional domain ("The Xenon System") so prior knowledge doesn't help.
      *   **Protective Belt:** Auxiliaries.
      *   **Phenomenon Cards:** Need to be a mix of expected, anomalous, and novel.
      *   **Scoring:** Progressive shift = points. Degenerating shift = survival but no points. Abandoning core = game over (or massive penalty).
      *   **The "No Instant Rationality" Rule:** Instead of a "judge reprieve" (which feels arbitrary), make the *switching cost* explicit. You can only switch if you have 0 Belt Tokens left AND fail a prediction. This forces them to exhaust the belt first.

  4.  **Drafting the Materials:**
      *   *Phenomenon Cards:* Need 15. Mix of "Confirming," "Anomalous (patchable)," "Anomalous (hard to patch)," and "Novel Fact opportunity."
      *   *Tokens:* Belt Tokens (limit patching).
      *   *Monster-Barring:* One-time use per team.

  5.  **Timeline (90 mins):**
      *   0-10: Setup & Core Declaration.
      *   10-70: Gameplay (6 Rounds x 10 mins).
      *   70-90: Debrief.
      *   *Correction:* 6 rounds might be too rushed. Let's aim for 5 rounds of 10 mins + setup/debrief. Actually, 90 mins allows for 5 rounds of play (10 mins each = 50) + Setup (15) + Debrief (25).

  6.  **Developing the "No Instant Rationality" Mechanic:**
      *   The prompt asks for a rule where they can't abandon the core until two rounds of patching with no success.
      *   *Idea:* "The Lock-In Rule." Once the Hard Core is written, it is inked in blood. You cannot erase it. To start a *new* programme, you must physically hand in your score sheet and start a new one, but you lose all accumulated "Prestige Points." This simulates the career cost.
      *   *Better Idea (aligning with prompt):* The "Degeneration Threshold." A team is *allowed* to abandon the core only if they have played 2 consecutive "Patch Cards" (spent tokens) without making a "Novel Prediction." Even then, the Judge (Instructor) must approve based on the *history*, not the truth. This forces them to argue their case publicly.

  7.  **Addressing Potential Pitfalls:**
      *   *Vague Core:* "Everything is connected." -> *Fix:* Instructor must approve cores before Round 1. Must contain at least one quantifiable or specific causal claim.
      *   *Endless Patching:* -> *Fix:* Limit Belt Tokens (e.g., 3 per game). When tokens run out, you *must* predict or die.
      *   *Judge Bias:* -> *Fix:* Rubric for "Reprieve." (e.g., "Is the patch ad hoc? Does it explain the anomaly without reducing content?")

  8.  **Debrief Strategy:**
      *   Map game actions to Lakatos terms.
      *   Highlight the *feeling* of rationality during patching vs. the *retrospective* view of degeneration.
      *   Discuss the limitation: Real science takes decades; this took 90 mins.

  9.  **Refining the "No Instant Rationality" Rule (Crucial Step):**
      *   The prompt specifically wants: "a team may only abandon its hard core after two full rounds of patching with no successful novel prediction, and even then a 'Lakatosian judge' (me) can grant a reprieve based only on the public record."
      *   I need to make sure this is actionable.
      *   *Mechanism:* "The Crisis Protocol." If you patch twice in a row without a novel prediction, you enter "Crisis." You *may* apply to switch cores. The Judge reviews the *log*. If the patches were consistent with the Positive Heuristic, you might get a "Stay of Execution" (keep core, get 1 extra token). If they were ad hoc, you must switch (lose points). This makes the Judge's role structural, not whimsical.

  10. **Finalizing the Plan:**
      *   *Title:* "The Hard Core Holdout."
      *   *Materials:* Core Sheets, Belt Tokens, Phenomenon Deck, Prediction Slips.
      *   *Rounds:* 5 Rounds.
      *   *Debrief:* Connect the frustration of patching to the concept of negative heuristic.

  11. **Self-Correction/Review against constraints:**
      *   *No lecture up front:* Correct. Jump straight into game.
      *   *No Lakatos vocab until debrief:* Correct. Use game terms (Core, Belt, Patch, Token).
      *   *Honesty about limitations:* Must include section on compression of time.
      *   *Troubleshooting:* Address vague cores, bias, endless patching.

  12. **Drafting the Content:** (Mental check of the Phenomenon Cards).
      *   Need them to be ambiguous enough to allow patching but specific enough to demand prediction.
      *   Example: "Planet X moves 3 degrees off orbit." (Patch: Undetected moon? Gravity variance?)
      *   Example: "New particle detected with mass 0." (Hard to patch if core says "All matter has mass".)

  13. **Final Polish:** Ensure tone is practical for an instructor. Clear instructions.

  *(Self-Correction during drafting)*: Wait, if I let them invent a domain, they might waste time on world-building. Better to give them a shared empirical domain but let them theorize. Let's use "The Behavior of Glombus Particles." It's nonsense, so no prior knowledge, but consistent.
  *Actually, better:* Let them choose a domain (Astronomy, Biology, Economics) but the cards are generic enough to fit any. No, that's too hard to balance.
  *Best:* Provide a specific scenario. "The Stellarium System." All teams study the same stars. This allows direct competition and comparison of how different cores handle the *same* data. This highlights the underdetermination of theory by data.

  *Wait, one more check on the "Judge" constraint:* The prompt wants the Judge to grant reprieve based *only on the public record*. I need to make sure the teams keep a public log. I will add a "Lab Notebook" requirement.

  *Let's build the response.*
answer: |-
  Here is a complete 90-minute lesson plan designed to operationalize Lakatos's MSRP without using the jargon until the very end.

  ## Game Title: *The Hard Core Holdout*

  **Learning Objective:** Students will experience the internal rationality of sticking with a theory despite anomalies (negative heuristic) and the retrospective nature of identifying a degenerating problem shift.
  **Class Size:** 20 students (4 Teams of 5).
  **Time:** 90 Minutes.

  ---

  ### Part 1: Materials & Setup

  **1. The Lab Notebook (One per Team)**
  A single sheet of paper divided into three sections:
  *   **The Hard Core:** (Permanent Ink only). 2-3 fundamental claims.
  *   **The Protective Belt:** (Pencil). List of auxiliary assumptions added during play.
  *   **The Log:** A chronological record of every Round: Phenomenon, Prediction/Patch, Token Cost.

  **2. Belt Tokens (15 total)**
  Each team gets 3 physical tokens (poker chips or paper slips). These represent the "social capital" or "funding" available to patch anomalies. If you run out, you cannot patch; you must predict or collapse.

  **3. The Phenomenon Deck (15 Cards)**
  *Print these on cardstock. Shuffle them.*
  1.  **Observation:** Object A moves 5% faster than calculated.
  2.  **Observation:** Object B emits radiation despite Core Claim 2 forbidding it.
  3.  **Observation:** Two objects merge without mass loss.
  4.  **Observation:** Background noise increases by factor of 10.
  5.  **Observation:** Object C vanishes for 3 seconds, then reappears.
  6.  **Observation:** Measurement tool D gives conflicting readings in Zone 4.
  7.  **Observation:** New Object E discovered; properties unknown.
  8.  **Observation:** Object A slows down unexpectedly.
  9.  **Observation:** Radiation levels drop to zero in a vacuum.
  10. **Observation:** Object F behaves like a wave and a particle simultaneously.
  11. **Observation:** Gravity seems stronger at distance X than distance Y.
  12. **Observation:** Chemical reaction G produces energy without fuel.
  13. **Observation:** Time dilation detected in low-gravity zone.
  14. **Observation:** Object H repels Object I despite opposite charges.
  15. **Observation:** The universe appears to be expanding, not static.

  **4. Prediction Slips**
  Small slips of paper where teams write a specific, risky prediction for the next round *before* the Phenomenon Card is drawn.

  **5. Monster-Barring Cards**
  One per team. A card that reads: *"This phenomenon is an illusion/error in measurement."* If played, the Phenomenon Card is discarded, but the team loses 1 Belt Token.

  ---

  ### Part 2: The Timeline (90 Minutes)

  #### 0:00 – 0:15: Setup & Core Declaration (No Lecture)
  1.  **Grouping:** Divide into 4 teams of 5. Hand out Lab Notebooks, 3 Belt Tokens, and 1 Monster-Barring Card.
  2.  **The Task:** Tell them: *"You are research teams studying the same universe. You must write a Hard Core in your notebook. These are 2-3 claims you pledge never to change. If you change these, your programme dies."*
  3.  **Instructor Veto:** Walk around. If a core is too vague (e.g., "Everything is energy" or "Stuff happens"), reject it. It must be specific enough to be wrong (e.g., "All matter has mass," "Gravity is attractive only," "Light travels in straight lines").
  4.  **The Rule of Inertia:** Write on the board: **"You cannot erase your Hard Core. You can only add to your Protective Belt."**

  #### 0:15 – 1:05: Gameplay (5 Rounds, 10 mins each)
  *In each round, draw one Phenomenon Card. Read it aloud.*

  **Phase A: Response (5 mins)**
  Teams must choose one of three actions:
  1.  **Predict:** Seal a prediction slip about the *next* card. (If the next card matches, +2 Points).
  2.  **Patch:** Add an auxiliary assumption to the Belt to explain the current card. (Cost: 1 Belt Token. +0 Points).
  3.  **Monster-Bar:** Play the special card to reject the data. (Cost: 1 Belt Token. +0 Points).

  **Phase B: The "No Instant Rationality" Check (5 mins)**
  *This is the critical mechanic.*
  *   **The Degeneration Trigger:** If a team has **Patched** in the previous round AND **Patches** again this round (2 consecutive patches with no successful prediction in between), they enter **Crisis**.
  *   **The Appeal:** In Crisis, a team *may* apply to abandon their Hard Core and start a new one.
  *   **The Judge's Ruling (You):** You review their **Log**.
      *   *Reprieve Granted:* If the patches show a consistent strategy (Positive Heuristic), you grant a **Stay of Execution**. They keep the Core but get **1 Extra Belt Token**.
      *   *Reprieve Denied:* If the patches look random or contradictory (Ad Hoc), they must **Collapse**. They lose all points. They can rejoin as a new team with a new Core, but start at 0 points and 1 Token.
  *   *Note:* Most teams will try to avoid Crisis. This forces them to feel the pressure to make a Novel Prediction eventually, but encourages them to patch as long as possible to avoid the risk of Collapse.

  **Scoring:**
  *   **Novel Prediction Hit:** +2 Points (Progressive Shift).
  *   **Successful Patch:** 0 Points (Maintains status quo).
  *   **Collapse:** Reset to 0.

  #### 1:05 – 1:30: The Debrief (25 Minutes)
  *Do not use Lakatos terms until now.*

  **Step 1: The Feeling of Rationality (5 mins)**
  *   Ask the teams who entered "Crisis": *"When you were patching the second time, did you feel irrational? Did you feel like you were failing?"*
  *   **Expected Answer:** No. You felt like you were solving a puzzle. You believed the extra token (reprieve) was coming.
  *   **Point:** This is why scientists don't feel refuted by anomalies.

  **Step 2: Mapping the Vocabulary (10 mins)**
  Draw a diagram on the board mapping game mechanics to Lakatos:
  *   **Hard Core:** The claims written in ink. (Protected by **Negative Heuristic**).
  *   **Protective Belt:** The auxiliary assumptions added in pencil. (Guided by **Positive Heuristic**).
  *   **Patching:** Defending the core.
  *   **Novel Prediction:** A **Progressive Problem Shift** (Theory grows faster than data).
  *   **Endless Patching:** A **Degenerating Problem Shift** (Theory lags behind data).
  *   **The Judge's Ruling:** **Rationality is Retrospective.** You didn't know you were degenerating until I looked at your Log *after* two rounds.

  **Step 3: The "No Instant Rationality" Rule (5 mins)**
  *   Ask: *"Why did I force you to wait two rounds of patching before letting you quit?"*
  *   **Answer:** Because in real science, one anomaly is noise. Two might be a pattern. But you can't know until you try to patch. Abandoning a core too soon is irrational (Kuhn's dogmatism); holding on too long is stubbornness. Lakatos says rationality is a long-term historical judgment, not a snapshot.

  **Step 4: Limitations & Honesty (5 mins)**
  *   **Compression:** *"This game took 90 minutes. Real research programmes last 50 years. You felt the pressure, but you didn't feel the career investment."*
  *   **The Judge:** *"In the game, I am the Judge. In reality, there is no Judge. The 'Judge' is the scientific community over decades. That's why paradigm shifts are messy."*
  *   **Truth:** *"Did the winning team have the 'truest' Hard Core? No. They just had the most flexible Protective Belt."* (Lakatos argues we never know the truth, only which programme is currently progressive).

  ---

  ### Part 3: Troubleshooting (What Will Go Wrong)

  **1. The "God Core" Problem**
  *   **Issue:** A team writes a Core so vague it can't be hit (e.g., "Forces exist").
  *   **Fix:** During the 15-minute setup, enforce the **Instructor Veto**. Demand at least one quantitative or specific causal claim. If they resist, tell them: *"A core that explains everything explains nothing. It scores no points."*

  **2. The "Endless Patch" Loop**
  *   **Issue:** Teams realize patching is safe (0 points) and predicting is risky (-points if wrong). They just patch forever.
  *   **Fix:** The **Belt Token Limit**. They only have 3 tokens. Once they are out, they *must* predict or Collapse. This forces the Progressive Shift eventually.

  **3. Accusations of Judge Favouritism**
  *   **Issue:** When you deny a Reprieve, they claim you're biased against their theory.
  *   **Fix:** Make the **Rubric Public** before Round 1.
      *   *Reprieve Criteria:* "Does the new patch connect to previous patches? (Consistent Heuristic)" vs. "Is this patch only useful for this one specific card? (Ad Hoc)."
      *   Refer strictly to their **Lab Notebook Log**. If the Log shows randomness, the denial is objective.

  **4. The "Monster-Barring" Abuse**
  *   **Issue:** A team uses their Monster-Barring card on every difficult card.
  *   **Fix:** It's a one-time use card. If they ask for another, tell them: *"In real science, if you call data an 'illusion' too often, you lose credibility (Tokens)."*

  ---

  ### Part 4: What This Game Cannot Reproduce (Honesty Clause)

  In the final 5 minutes, explicitly state these limitations to prevent oversimplification:

  1.  **Time Compression:** In the game, degeneration happens in 20 minutes. In reality, a degenerating programme (like Ptolemaic astronomy) can last 1,000 years. The "feeling" of rationality is much stronger over a human lifetime than over a game round.
  2.  **The Judge:** In the game, *you* decide when a shift is degenerating. In reality, there is no external arbiter. Scientists argue past each other for decades. The "Judge" is history, not a professor.
  3.  **Sociological Pressure:** In the game, switching cores costs points. In reality, switching cores costs *jobs, funding, and reputation*. The inertia in real science is much heavier than 3 poker chips.
  4.  **Truth:** The game implies the goal is to win points. In science, the goal is truth. Lakatos's controversial claim is that we can never know if the Hard Core is *true*, only if it is *progressive*. The game simulates the latter, not the former.

  ### Instructor Script for the "No Instant Rationality" Rule
  *When explaining the Crisis/Reprieve rule at 0:15:*

  > "Here is the most important rule. If you have to patch your theory two times in a row without making a successful prediction, you are in Crisis. You might want to quit and start a new theory. But you aren't allowed to yet. You have to come to me. I will look at your Log. If your patches look like a clever strategy, I might let you stay. If they look like desperate guesses, I will force you to quit.
  >
  > **Why?** Because in science, you don't know you're wrong until history tells you. You can't just feel it. You have to prove your programme is dead to the public record before you're allowed to leave it."
