          *   *Result:* Everyone Challenges to keep Honor up, even if they lose Gold.
      *   *Round 2:*
          *   Guildmaster announces: "The King now taxes Exiles."
          *   Option A (Challenge): Cost 2 Gold, 50% chance of Exile (Now costs 10 Gold fine to return).
