      *   **Marginal Cases:** Does it undermine intermediate status? It undermines the *justification* for the boundary (rationality), but not necessarily the *existence* of the boundary (species membership or "humanity" as a vague concept). Nozick admits the difficulty. Maya is right that it creates a dilemma, but wrong that it *forces* pure utilitarianism; one could grant rights to marginal humans based on species-typical capacities or social relations without granting them to animals.
