  Brainstorming

  Candidate 1: Reject (3). Deny that retrospective unification changes ontological status. The best story now doesn't make it true that the subject was identical then. Objection: This cripples the narrative account's ability to explain self-discovery or moral growth, where we genuinely say "I am finally who I was meant to be."

  Candidate 2: Reject (4). Deny the merged narrative is a *better* unifier. Perhaps causal discontinuity outweighs thematic coherence. Objection: The case stipulates the merged archive scores higher on standard measures of coherence. Denying this contradicts the thought experiment's setup.

  Candidate 3: Reject (6). Deny transitivity across the surgical edit. The post-operative self is a new narrative center that *appropriates* both pasts without being numerically identical to either pre-operative subject. Objection: This admits selves are manufactured by surgery, which the argument claims is absurd.

  Commitment: I reject (6). The argument equivocations on "same self," conflating narrative ownership with numerical identity. I rejected the runners-up because denying (3) gutted the narrative view's explanatory power, and denying (4) violated the case stipulations.

  1. Diagnosis

  The argument fails at the transition from (5) to (6). The failure is an equivocation on the term "same self." In premises (1) through (5), "self" refers to the *subject of a currently unified narrative*. It is a synchronic construct: given these memories, who is the speaker? In premise (6), "sameness of self" shifts to mean *numerical identity across time*. The argument assumes that because the post-operative narrative unifies the events of Ana and Bo, the post-operative subject is numerically identical to the pre-operative subjects. But on the narrative account, the post-operative entity is a new center of narrative gravity that *claims* both pasts. It stands in a relation of *narrative ownership* to Ana and Bo, not strict identity. Transitivity applies to identity, not to ownership. Therefore, you cannot bridge from Post-Ana to Pre-Ana to Pre-Bo to conclude Pre-Ana = Pre-Bo.

  2. Why that step looked innocent

  This slide is invisible because narrative theories often endorse the intuition in (3): that discovering the true story of a life reveals who one "really was." We accept that a later diagnosis can reconfigure the meaning of past behavior, making it intelligible as part of a single character arc. This makes it seem as though narrative unity travels backward to constitute past identity. Furthermore, the case is designed to eliminate standard breaks in continuity. There are no gaps or seams; the memory is phenomenally indistinguishable from ordinary recollection. When the psychological markers of distinctness vanish, it feels natural to assume the ontological distinctness has vanished too. The surrounding premises reinforce this by defining the self *exhaustively* as the subject of the narrative. If the self is nothing but the story's subject, and the story now covers both lives, it seems to follow that the subject covers both lives retrospectively.

  3. What each way out costs

  Denying (3) costs the narrative theorist the ability to account for self-discovery. If later unification cannot clarify past identity, the narrative view collapses into a rigid snapshot theory where who you are is fixed by the story available now. This loses the dynamic element that makes narrative accounts attractive over psychological continuity views.

  Denying (4) is theoretically expensive because it requires ignoring the stipulated coherence measures. To claim the merged narrative is not a better unifier, one must argue that causal origin outweighs thematic coherence. But this quietly restores the very ingredient the account was meant to eliminate: a non-narrative fact about whose memories these are. It admits that causal history matters more than the story itself, undermining the core claim that the self is an abstraction generated by the narrative.

  Denying (6) or accepting the conclusion forces a choice. Accepting the conclusion (that Ana and Bo were always one person) is absurd; it implies universal identity given sufficient grafting potential. Denying (6) admits that surgical edits *do* manufacture selves. The argument claims this is impossible ("not the sort of thing a surgical edit manufactures"), but if the self is an abstraction, it is exactly the sort of thing an edit can manufacture. The cost here is accepting that selves are fragile, constructible entities rather than deep metaphysical facts. However, this is a cost the narrative theorist should willingly pay. It preserves the core thesis that selves are abstractions while blocking the absurdity. It clarifies that while a new self can be created that owns two pasts, this does not retroactively fuse the owners of those pasts.

  4. How I should rewrite the account

  You must amend the definition of the self to include a constraint on *narrative origin*. Insert this clause after (1): "A self is the abstract subject of a unifying narrative *generated within a single causal chain of memory production*." This blocks the merger from establishing identity. The post-operative subject is a new abstraction generated by the surgical combination, not the continuation of the pre-operative abstractions. It owns the pasts but is not identical to their original subjects.

  The new exposure this creates is the "Threshold Problem." If selves are constructible, you must explain why minor edits don't create new selves. If I change one memory, am I a new person? You will need to specify a threshold of narrative disruption required to generate a new center of gravity. This invites sorites-style objections: how much merging is enough to create a new self? You will need to argue that the cross-integration procedure represents a categorical break in causal production, not just a gradual shift, to avoid sliding into triviality where every memory update creates a new person.

  5. Verdict

  The argument is valid but unsound. It relies on an equivocation between narrative ownership and numerical identity at step (6). You should not publish it as written. However, it is a potent reductio if left unaddressed. By clarifying that narrative unity constitutes *synchronic* selfhood without guaranteeing *diachronic* identity across causal breaks, you block the absurd conclusion while preserving the narrative account. The paper should pivot to defending the distinction between owning a past and being identical to the past owner.
