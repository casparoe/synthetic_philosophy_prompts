      *   *Standard Accountability:* Agent A explains action X to Principal P.
      *   *Algorithmic Answerability:* System S explains action X to Stakeholder P, but S cannot be blamed.
      *   *Is it a genuine problem?* Yes, because explanation is necessary for trust, improvement, and democratic oversight, distinct from compensation.
      *   *Is it just a new label for legal remedy?* No. Legal remedies (discovery, expert testimony) try to get explanations, but if the *system itself* is opaque (deep learning weights), the law hits a wall. The law assumes an explainable chain of causation. If the chain is probabilistic and opaque, legal discovery might fail to yield a satisfactory "account."

