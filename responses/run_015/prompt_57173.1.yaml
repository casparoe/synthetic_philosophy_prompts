answer: |-
  Your practices are committed to the claim that virtual harm is determined not by the metaphysical status of objects but by whether the act violated the consensual rules of engagement or breached the duty of care owed to the human player.

  Your roommate's charge of inconsistency relies on the assumption that "value" and "harm" must track "legal property status," but your operational bundle rejects this ontology in favor of a normative framework based on consent and rule integrity. Under **fictionalism**, virtual objects are mere pixels with no moral weight; this view is ruled out by your practice of spending significant budget to restore items after exploits and banning harassment, which acknowledges real value and real harm. Under **virtual realism**, objects are genuine digital property and all virtual losses are real harms; this view is ruled out by your EULA denying property rights and your refusal to restore losses from PvP or scamming, which treats those losses as legitimate gameplay. Your studio actually operates under a modified **conventionalism** where the game rules constitute a local morality: objects are not property in the legal sense, but they are normative entitlements within the magic circle. This resolves the triad: items aren't property (legal ontology), yet they are worth restoring (normative entitlement), and some acts are harms while others aren't (distinction between rule-consent and rule-violation).

  The line between sanctioned looting, rolled-back exploits, and banned harassment is explicable under a single theory of **consent-based harm**. In contested PvP zones, players consent to the risk of loss as a condition of entry; looting is rule-consistent, so the loss is not a harm but a feature. The duplication exploit violates the rules of the simulation itself, breaking the consensual framework; restoring those items repairs the breach of contract rather than acknowledging property rights. Harassment and assault RP differ because they target the human behind the avatar, breaching the duty of care that exists outside the magic circle; this harm is real regardless of game rules. However, your practice is philosophically underdetermined regarding *why* you restore exploits: you could justify this as maintaining simulation integrity (a realist view) or enforcing the terms of service (a contractual view), and both lead to the same rollback policy. Similarly, banning harassment could be justified as a moral imperative (real harm) or purely as risk management for community stability (pragmatism), and your current policies do not distinguish between these motivations.

  The one-way flow of money is the critical linchpin that prevents your normative entitlements from crystallizing into legal property. By selling items for cash but forbidding players from converting items back to cash, you maintain that players are purchasing a service or experience, not an asset. If you allowed cash-out, you would strengthen the argument that items have independent economic value, pushing you toward the virtual realism view you currently reject. Under the most radical reading where virtual objects are treated as real property, your policies would collapse: you could not roll back shards because deleting duplicated items would constitute destruction of legitimate property; you would need to allow inheritance of accounts and items upon death; creditors could claim virtual assets for real-world debts; and theft via exploits would become a matter for law enforcement rather than internal bans. Your current bundle strictly requires maintaining the license model to avoid these obligations while relying on the consent model to justify community management.

  Your roommate is correct that the EULA is liability cover rather than a genuine metaphysical claim, but she is incorrect that this makes your position incoherent. You are not fictionalists who don't believe your support policies; you are contextualists who treat objects as real within the community covenant but fictional within the legal system. The contradiction she identifies only exists if you insist that legal ontology must match moral practice, but your studio's stability depends on keeping them separate: you afford players the protection of property rights without granting them the legal leverage of ownership.
