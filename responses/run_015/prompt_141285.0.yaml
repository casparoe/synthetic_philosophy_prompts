prompt: |-
  I work in a research group where the line "the evidence always underdetermines the theory" gets wheeled out to close arguments down. It happened again last week: we were discussing dark-matter versus modified-gravity accounts of galactic rotation curves and cluster dynamics, and a senior colleague said the two are just "different curves through the same points", that no observation could ever settle it, and that the choice between them is therefore sociological — which group has more telescope time, more prestige, more graduate students. I want to know whether any precise claim he could have meant actually supports that moral.

  Please disambiguate the slogan into a menu of distinct theses, each stated precisely enough to be assessed, with verdicts on each: which are true but trivial, which are substantive and plausible, which are false or unestablished, and which — if any — would licence his conclusion that the choice is not evidential. Among the distinctions I keep circling but cannot get straight are: underdetermination by the evidence we have now versus by all the evidence we could in principle gather; the point that no theory predicts on its own but only together with auxiliary assumptions, so that a failed prediction can always be absorbed somewhere, versus the far stronger claim of a global rival agreeing with our theory on every possible observation; rivals that merely re-fit data already in hand versus rivals that were in place beforehand and predicted it; rivals that are equally simple and non-gerrymandered versus rivals cooked up ad hoc to match; and disagreement confined to unobservable structure versus disagreement about what would happen under interventions we could actually perform.

  For each reading, say whether it plausibly holds in this case and whether it supports the "it is all sociology" moral. My suspicion is that the readings that are true are ones on which the stand-off is temporary or the rival is contrived, and that the readings strong enough to support his moral are ones nobody has established for dark matter. Tell me whether that suspicion is right, where it breaks down, which reading people usually have in mind when they deploy the line this way, and — what I actually want for future seminars — whether there is a defensible version of the slogan a working scientist should take seriously, as opposed to one that merely licences changing the subject.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works in a research group where a senior colleague uses the phrase "evidence always underdetermines theory" to shut down arguments (specifically regarding Dark Matter vs. Modified Gravity).
      *   **Colleague's Claim:** The two theories are just "different curves through the same points," no observation can settle it, and the choice is purely sociological (telescope time, prestige, etc.).
      *   **User's Goal:** Wants to know if any precise interpretation of "underdetermination" supports this moral.
      *   **Specific Distinctions to Address:**
          *   Current evidence vs. all possible evidence.
          *   Duhem-Quine thesis (auxiliary assumptions) vs. global empirical equivalence.
          *   Accommodation (re-fitting) vs. Prediction (novel success).
          *   Simplicity/Non-gerrymandering vs. Ad hoc construction.
          *   Unobservable structure vs. Interventional differences.
      *   **Task:** Disambiguate the slogan into distinct theses, assess their truth/plausibility in this specific case (DM vs. MG), assess if they support the "sociology" moral, and provide advice on a defensible version for working scientists.
      *   **User's Suspicion:** True readings imply temporary stand-offs or contrived rivals; strong readings supporting the moral are unestablished for DM.
      *   **Desired Output:** A structured menu of theses with verdicts, confirmation/correction of suspicion, analysis of what people *mean* vs. what is *true*, and practical advice for seminars.

  2.  **Deconstruct the Slogan ("Evidence Underdetermines Theory"):**
      *   I need to break this down into philosophical categories relevant to physics.
      *   *Category 1: Transient Underdetermination.* We don't have enough data *yet*.
      *   *Category 2: Holism/Duhem-Quine.* Theories don't face data alone; auxiliaries can be tweaked.
      *   *Category 3: Strong Empirical Equivalence.* Two theories predict *exactly* the same outcomes for *all* possible observations.
      *   *Category 4: Inductive/Ampliative Underdetermination.* Data is finite, theories are universal (Humean problem).
      *   *Category 5: Structural/Ontological Underdetermination.* The math works, but what it *is* is unclear.

  3.  **Evaluate Each Thesis against the Dark Matter (DM) vs. Modified Gravity (MG) Case:**
      *   *DM:* Invisible mass added to GR/Newton.
      *   *MG (e.g., MOND):* Change the law of gravity at low acceleration.
      *   *Current Status:* DM fits CMB, large-scale structure, clusters well. MG fits rotation curves of specific galaxies very well (sometimes better) but struggles with CMB and clusters without adding "neutrinos" or similar (which looks like DM).
      *   *Colleague's Claim:* "Different curves through the same points." -> Implies empirical equivalence.
      *   *Reality:* They are *not* empirically equivalent across all domains (CMB, lensing, bullet cluster).

  4.  **Drafting the Menu of Theses (Iterative Process):**

      *   *Thesis 1: Transient Underdetermination.* (Evidence *so far*). True? Yes. Supports sociology? No, implies keep looking.
      *   *Thesis 2: Duhem-Quine Holism.* (Auxiliaries can save the core). True? Yes. Supports sociology? Weakly. Just means falsification is hard, not impossible.
      *   *Thesis 3: Strong Global Empirical Equivalence.* (All possible data matches). True? No, not for DM vs. MG. Supports sociology? Yes, *if* true. But it's false here.
      *   *Thesis 4: Inductive Underdetermination.* (Finite data vs. universal law). True? Logically yes. Supports sociology? No, this is just the problem of induction, applies to everything, doesn't make choice arbitrary.
      *   *Thesis 5: Theoretical Virtues Underdetermination.* (Data doesn't dictate simplicity/beauty). True? Yes. Supports sociology? Maybe, if virtues are subjective. But usually virtues track truth.

  5.  **Addressing the User's Specific Distinctions:**
      *   *Now vs. Principle:* Crucial. Colleague conflates them.
      *   *Auxiliaries vs. Global Rival:* Colleague implies global rival, reality is auxiliary tweaking.
      *   *Accommodation vs. Prediction:* DM predicted CMB peaks; MOND accommodated rotation curves. This breaks equivalence.
      *   *Simplicity vs. Ad hoc:* MOND is simple in rotation curves, DM is simple in cosmology. Adding neutrinos to MOND makes it ad hoc.
      *   *Unobservable vs. Intervention:* DM implies particles (detectable in labs); MG implies law change (detectable in precision gravity tests). They *are* distinguishable in principle.

  6.  **Assessing the "Sociology" Moral:**
      *   Does underdetermination entail sociology? Only if the choice is *rationally undecidable*.
      *   If one theory has better predictive novelty or unifying power, rational choice exists.
      *   Therefore, the moral does not follow even if underdetermination holds in a weak sense.

  7.  **Confirming the User's Suspicion:**
      *   The suspicion is largely correct. The strong claims needed for the "sociology" conclusion are false in this specific physics case.
      *   Where it breaks down: Sometimes theories *are* empirically equivalent (e.g., Heisenberg vs. Schrödinger pictures initially), but even then, heuristic value differs.
      *   What people mean: Often they mean "We are tired of arguing, let's agree to disagree," disguised as philosophy. Or they mean "Theory choice involves non-empirical virtues," which is true but doesn't mean "sociology" in the cynical sense.

  8.  **Formulating Advice for Seminars:**
      *   Don't ban the phrase, but refine it.
      *   Shift from "Underdetermination" to "Theory Choice Criteria."
      *   Acknowledge auxiliaries but demand novel prediction.
      *   Distinguish "Underdetermined by *current* data" from "Underdetermined *in principle*."

  9.  **Refining the Tone:**
      *   Needs to be philosophical but grounded in physics practice.
      *   Respectful of the senior colleague but firm on the logic.
      *   Clear structure (Menu of Theses).

  10. **Self-Correction/Review during drafting:**
