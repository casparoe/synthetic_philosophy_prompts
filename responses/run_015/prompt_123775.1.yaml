answer: |-
  **Dissertation Prospectus: Regime-Bound Structural Realism**

  **Research Question**
  Can ontological commitment be sustained for symmetry structures that are empirically adequate within a bounded energy regime but fail to extend globally, without collapsing into epistemic structural realism or standard entity realism? Specifically, this project asks whether a coherent intermediate position—termed here 'Regime-Bound Structural Realism' (RBSR)—can be formulated to account for the ontological status of structures in Effective Field Theories (EFTs) that are autonomous within their domain yet reducible or obsolete at higher energies.

  **Background and Problem Statement**
  Contemporary debates in structural realism are predominantly polarised. On one side, Ontic Structural Realism (OSR) posits that structure is all there is, typically privileging global symmetry structures that hold across all scales or constitute the fundamental fabric of reality. On the other side, Epistemic Structural Realism (ESR) treats structure as a reliable guide to prediction while withholding ontological commitment regarding the nature of the relata or the fundamentality of the structure itself. Within the philosophy of quantum field theory (QFT), this dichotomy leaves a significant gap regarding the status of effective structures.

  Effective Field Theories suggest that physical descriptions are valid only within specific energy regimes. Structures such as spontaneous symmetry breaking or specific gauge groups are empirically robust within these bounds but are known to dissolve or transform under renormalisation group flow towards higher energies. The current literature often treats these regime-bound structures as merely instrumental—epistemic placeholders awaiting a fundamental theory—or forces them into a global OSR framework where they must be interpreted as approximations of a deeper, universal structure. Both options are unsatisfactory. The instrumentalist view undermines the robustness of experimental practice within a regime, while the global OSR view ignores the lesson of EFTs that there may be no single global structure to be realist about. Consequently, the intermediate case remains open: there is no established framework for being an ontological realist about structure that is explicitly non-fundamental and bounded. This project seeks to fill that lacuna by arguing that ontological commitment can be localised to a regime without forfeiting realism.

  **Methodology and Approach**
  The project will proceed through a combination of conceptual analysis and case study examination over a six-month period. The first phase will involve a rigorous conceptual analysis of 'structure' within the context of EFTs. This requires disentangling the mathematical formalism of symmetry groups from their physical interpretation when decoupling occurs. I will analyse arguments surrounding symmetry breaking to determine whether the broken symmetry represents a loss of ontological structure or a transformation into a different structural regime.

  The second phase will examine specific cases in QFT, focusing on the electroweak sector and renormalisation group flow. The aim is to identify instances where structural properties remain stable and causally explanatory within a bounded energy scale, despite lacking fundamental status. I will investigate whether the autonomy of these effective structures—their insensitivity to high-energy details—provides a sufficient ground for ontological commitment. This involves distinguishing between structures that are merely 'saved phenomena' and those that possess explanatory depth within their domain. The analysis will draw upon recent developments in the philosophy of EFTs, though specific citations will be supplied in the final draft.

  **Criteria for Success**
  A successful result will consist of a defensible formulation of Regime-Bound Structural Realism that avoids collapse into its neighbouring positions. Specifically, I aim to produce a formal or conceptual criterion that distinguishes local structural commitment from instrumental accommodation. This criterion might rely on notions of structural stability under coarse-graining or the capacity for counterfactual inference within the regime. If I can demonstrate that regime-bound structures support counterfactuals and interventions in a manner distinct from mere predictive algorithms, yet without requiring fundamental truth, the project will have established the coherence of RBSR. Furthermore, success requires showing that this position does not secretly presuppose entity realism; the commitment must remain strictly structural, pertaining to the relations and symmetries themselves rather than the objects bearing them.

  **Risk Assessment and Feasibility**
  There are two primary risks to this project. The first is philosophical collapse: it may prove impossible to distinguish RBSR from ESR. If the commitment to regime-bound structure is indistinguishable from commitment to empirical adequacy alone, the position reduces to instrumentalism. I will mitigate this by focusing heavily on the explanatory role of structure within the regime, rather than mere predictive success. The second risk is scope. Six months is a constrained timeframe for a project involving both technical QFT analysis and metaphysical argumentation. There is a danger of becoming bogged down in the physics of renormalisation at the expense of the philosophical argument. To manage this, I will limit the case studies to well-documented examples in the literature rather than attempting novel physical derivations. If the formal criterion proves too demanding, I will scale back to a purely conceptual argument for the coherence of local ontological commitment, leaving the formalisation for future work.

  **Note on References**
  This prospectus outlines the conceptual architecture of the proposed dissertation. All specific citations to primary literature in structural realism, quantum field theory, and effective field theories will be supplied by the student in the full draft and final dissertation.
