      *   *Check:* Is the distinction between rejecting (3) as a principle vs. rejecting the *implementation* of (3) clear?
      *   *Correction:* I need to be precise. I am rejecting the *unqualified* claim in (3) that we can just "weight... and choose." I am accepting the *spirit* of (3) (maximize EC) but denying the *feasibility* of the calculation without normalization. Actually, it's better to say (3) is false *as stated* because it presupposes comparability. So I reject (3) in favor of (3*): "Rationality requires maximizing expected choiceworthiness *relative to a normalized scale*."

  10. **Final Polish:** Check against the prompt requirements one last time.
      *   Brainstorming section? Yes.
      *   Commit to diagnosis? Yes.
      *   Defend in depth? Yes.
      *   Compare costs? Yes.
      *   Conclude with advice? Yes.
