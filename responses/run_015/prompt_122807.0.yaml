answer: |-
  Here is an analysis of your principle, its necessary repairs, and the implications for your cases and methodology.

  ### 1. Testing Your Principle Against the Six Verdicts

  Your proposed principle is:
  > *The reactive attitudes are fitting toward a target just in case (1) the target's conduct expresses a quality of will toward some person, (2) the target is the kind of thing that can be an addressee of the demand for regard, and (3) no excuse withdraws the demand.*

  Let us run your six verdicts through this sieve:

  1.  **Co-author:** Fits perfectly. Ill will (1), moral agent (2), no excuse (3). **Verdict: Warranted.**
  2.  **Four-year-old:** Fails on (2). A child is not a full addressee of moral demands (an exempting condition). **Verdict: Warranted.**
  3.  **Friend under duress:** Fails on (3). Duress is a valid excuse that withdraws the demand *toward her*, even if the harm occurred. **Verdict: Warranted.**
  4.  **Brutalized Man:** Here the principle strains. He is an addressee (2). Laziness or trauma is not a full excuse (3) if the law holds him liable. Does his conduct express a quality of will (1)? Yes, brutality expresses disregard. The principle predicts resentment is fitting. Your verdict is *grief*. **Tension.**
  5.  **Company:** Fits, provided we accept collectives can express a "quality of will" (via policy/culture) and be "addressees" (via institutional response). **Verdict: Warranted.**
  6.  **Chatbot:** Fails on (1) and (2). A chatbot has no will and cannot be an addressee. **Verdict: Warranted.**

  **The Critical Failure:** The principle currently cannot explain *why* the Company passes condition (2) while the Chatbot fails it, without smuggling in the conclusion. Both are non-human. Both caused harm. Both lack biological consciousness. If your principle says "Companies are addressees, Chatbots are not," it is merely a list. You need a *criterion* for "addressee" that captures the Company but excludes the Chatbot.

  ### 2. Repairing the Principle

  To save the Company/Chatbot distinction and clarify the Brutalized Man, you must refine condition (2). Being an "addressee" is not about being human; it is about **normative competence**.

  **The Repaired Principle:**
  > The reactive attitudes are fitting toward a target just in case:
  > 1.  The harm stems from a **reason-responsive mechanism** attributable to the target (quality of will);
  > 2.  The target possesses the **capacity to recognize and respond to the moral demand** implicit in the attitude (normative competence);
  > 3.  No **exempting or excusing conditions** sever the link between the target and the demand.

  **How this repairs the cases:**
  *   **Company vs. Chatbot:** A company possesses normative competence. It can receive a complaint, alter its algorithm, issue an apology, or change its incentive structure. It can *answer* the demand. A chatbot cannot. It cannot recognize the demand, nor can it alter its own weights in response to moral reasoning. It is a tool, not an agent. The Company is the agent *because* it is the locus of control that can respond to the resentment.
  *   **Brutalized Man:** He possesses normative competence (he is an adult, the law treats him as such). Therefore, resentment is *fitting*. Your feeling of grief is a recognition of the *tragedy* of his lack of good will (caused by his past), but it does not negate his capacity to respond to reasons now.

  ### 3. Which Verdicts Must You Abandon?

  You do not need to abandon the Company verdict, but you must clarify the Chatbot verdict.

  *   **The Company:** You can keep indignation toward the company, but you must accept that this is **functionalist**. You are treating the corporation as a moral agent because it functions as a reason-responsive system.
  *   **The Chatbot:** You must firmly withdraw resentment. Your hesitation ("I catch myself... then withdraw") is the correct philosophical move. To feel resentment toward the chatbot is to anthropomorphize a tool. The fact that you feel it toward the Company but not the Chatbot is not a contradiction; it is a recognition that the Company can *change* and the Chatbot cannot.
  *   **The Brutalized Man:** This is the hardest pill. If you accept the repaired principle, **you must admit that resentment is fitting toward the brutalized man.** Your feeling of grief is not a verdict on *fittingness*; it is a verdict on *compassion*. You can feel grief *and* resentment simultaneously. To say resentment is *unfitting* is to claim he is not responsible. But you say the law should keep its hands on him. You cannot have it both ways. If he is liable, resentment is fitting.

  **Does the principle degenerate into a list?**
  No, not if you anchor "addressee" in **responsiveness to moral reasons**.
  *   **Company:** Can change policy in response to outrage. (Passes)
  *   **Chatbot:** Cannot change itself in response to outrage. (Fails)
  *   **Child:** Cannot fully grasp the moral demand. (Fails)
  *   **Adult Human:** Can grasp the demand. (Passes)

  This is a principled distinction, not a list. It relies on the *telos* of the reactive attitudes: they are tools of moral regulation. They are only fitting where they can *do work* (i.e., where the target can understand and adjust).

  ### 4. The Lazy Surgeon Case

  **Case:** A surgeon too lazy to run the check that would have caught the tremor in his hands.

  **Application of Repaired Principle:**
  1.  **Reason-responsive mechanism:** The omission (laziness) is a choice. It reflects a disregard for patient safety (quality of will).
  2.  **Normative competence:** The surgeon is a trained professional capable of understanding the demand for care.
  3.  **Excuses:** Laziness is not an excuse; it is a vice.

  **Prediction:** **Resentment (or Indignation) is fitting.**
  This is a classic case of negligence rooted in a culpable state of mind. Unlike the tremor itself (which might be a physical exemption), the *laziness* regarding the check is a failure of will. The repaired principle demands you hold the surgeon responsible.

  ### 5. The Brutalized Man: Fittingness or Autobiography?

  You asked whether your verdict on the brutalized man is a claim about fittingness or only autobiography.

  **It is autobiography.**
  Here is why: You state the criminal law should "keep its hands on him." Punishment is the institutional analogue of the reactive attitudes (specifically indignation/resentment). If you believe he deserves punishment, you believe he is morally responsible. If he is morally responsible, the conditions for fitting resentment are met (Quality of Will + Agency + No Exemption).

  Your inability to *feel* the resentment is a psychological fact about *you*, not a normative fact about *him*. You are experiencing **compassion fatigue** or **empathic override**. You see the cause of his brutality (his own victimization) and your capacity for resentment is dampened by your capacity for grief.

  **Methodological Implications:**
  This creates a significant problem for your paper if you rely on "reflective equilibrium" using your own intuitions as data.
  1.  **The Risk:** If you treat your psychological inability to feel resentment as evidence that resentment is *unfitting*, you are conflating **normative status** with **psychological capacity**. You are letting your empathy dictate your metaphysics of responsibility.
  2.  **The Fix:** You must distinguish between the **fittingness of the attitude** (is it merited by the object?) and the **all-things-considered wisdom of expressing it** (is it useful/kind to feel it?).
      *   It may be *fitting* to resent the brutalized man (he did wrong).
      *   It may be *unwise* or *unchristian* or *therapeutically counterproductive* to indulge that resentment (because he is also a victim).
  3.  **Argumentative Strategy:** Do not argue that resentment is *unfitting* in the brutalized man case. Argue that **fittingness is not the only normative consideration.** You can acknowledge that resentment is merited (fitting) but that grief is a *competing* attitude that, in this specific tragic context, should take precedence in guiding our *actions*, even if the resentment remains theoretically valid.

  **Summary for your paper:**
  *   **Repair the Principle:** Define "addressee" as "capable of recognizing and responding to moral demands" (Normative Competence).
  *   **Company/Chatbot:** The Company can respond to the demand (policy change); the Chatbot cannot. This saves the distinction without a list.
  *   **Brutalized Man:** Admit resentment is fitting (he is responsible), but argue that grief is a competing, overriding consideration for *action*. Do not claim the resentment is unfitting, or you contradict your stance on criminal liability.
  *   **Method:** Acknowledge that personal emotional limitations (squeamishness) are not reliable guides to fittingness conditions. Distinguish between "I cannot feel it" and "It is not merited."
