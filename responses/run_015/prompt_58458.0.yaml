answer: |-
  Here is the dependency chain, the trap analysis for your example, the objection handling, and the closing assessment.

  ### 1. The Dependency Chain (Sequence of Operations)
  If you break this order, the discussion collapses into "Utilitarianism is stupid" or "That's not what Utilitarianism is."

  1.  **Lock the Axiom:** They must accept that Classical Utilitarianism cares **only** about the *sum total* of utility, not the *distribution*. (5 mins)
      *   *If you skip this:* They will "fix" the Monster immediately by saying "but fairness matters." You need them to feel the conflict between *math* and *fairness*.
  2.  **Lock the Mechanism:** They must understand utility as a **capacity for experience**, not a **desire for stuff**. (10 mins)
      *   *If you skip this:* They will think the Monster is just greedy. The Monster doesn't *want* more; their brain *processes* resources into good-feelings more efficiently.
  3.  **Lock the Stipulation:** They must accept **No Diminishing Returns** for the Monster. (10 mins)
      *   *If you skip this:* They will say "Eventually he'd be full." The Monster's curve must stay steep while everyone else's flattens.
  4.  **The Collision:** Only now do you reveal the conclusion (Starve the many to feed the one). (15 mins)
  5.  **The Diagnosis:** Why does this feel wrong? (Rights? Equality? Separateness of persons?) (10 mins)

  **What falls apart if out of order:** If you introduce the Monster before locking the "Sum Total" axiom, students will treat it as a distribution problem. If you introduce it before locking "Capacity vs. Desire," they will treat it as a character flaw.

  ### 2. Critique of Your Roommate Example
  **Will it carry?** Yes, but it is high-risk for the "Greed/Weird Biology" handwave.
  **The Trap:** Students will conflate "liking Cheetos more" (preference) with "generating more moral value per Cheeto" (ontological capacity). They will also bring in health externalities ("He'll get sick, that's bad utility").

  **How to fix the example:**
  *   **Sanitize the Resource:** Don't use junk food. Use "Generic Resource Units" (GRUs) or "Life Support Energy." If you stick to groceries, explicitly stipulate: *"Assume no health consequences. This is pure happiness chemistry."*
  *   **Reframe the Biology:** Do not say "he likes it more." Say: *"His nervous system converts $1 of food into 100 units of Good Experience. Your nervous system converts $1 of food into 1 unit of Good Experience. It is a physiological fact, like having better eyesight."*
  *   **The Avoidance:** You must avoid making it seem like the Monster *chooses* to be this way. If it's a choice, it's greed. If it's biology, it's a philosophical problem.

  **What the example needs to do:** It needs to make the math undeniable.
  *   Roommate A (Monster): $100 = 10,000 Utility.
  *   Roommate B (Normal): $100 = 100 Utility.
  *   Roommate C (Normal): $100 = 100 Utility.
  *   *Utilitarian Verdict:* Give all $300 to Roommate A. B and C starve. Total Utility = 10,000 vs (100+100+100=300).

  ### 3. Predictable Wrong Takes & Interception Points

  **Wrong Take 1: "He's just a greedy rich dude hoarding stuff."**
  *   **When it happens:** Immediately upon introducing the Monster.
  *   **How to head it off:** Pre-empt this in the setup. *"This isn't about him demanding more. He's shy. He's happy with $50. But the moral math says we* must *give him everything because wasting resources on us is morally wasteful. He doesn't want to be a monster; his brain makes him one."*

  **Wrong Take 2: "Just split it equally. Utilitarianism is fixed."**
  *   **When it happens:** As soon as they see the unequal outcome.
  *   **How to head it off:** Remind them of **Dependency Chain Step 1**. *"Utilitarianism does not have a 'fairness' variable. It only has a 'total sum' variable. If you add fairness, you are no longer doing Classical Utilitarianism. You are cheating on the math to save the intuition."*

  **Wrong Take 3: "Eventually he'd get bored (Diminishing Returns)."**
  *   **When it happens:** When discussing the long-term allocation.
  *   **How to head it off:** Make it a **Stipulation**. *"For this thought experiment, the Monster's capacity is linear or exponential. The 100th meal tastes as good as the 1st. Your 2nd meal tastes half as good as your 1st. We are testing the logic, not the biology."*

  **Wrong Take 4: "The others will revolt/kill him (Rule Utilitarianism)."**
  *   **When it happens:** During the "consequences" phase.
  *   **How to head it off:** Isolate the case. *"Imagine a world where no one knows who gets the food, or they are too passive to revolt. We are looking at the moral obligation of the distributor, not the political stability of the house."*

  ### 4. The Twist Question (Last 5 Minutes)
  Do not ask "Is this right?" They will just say "No." You need to test if they understand the **interpersonal tradeoff**.

  **Drop this:**
  *"Imagine you are not the distributor. You are one of the normal roommates. You know the math is correct. You know giving your food to the Monster creates more 'Good' in the universe than eating it yourself.*
  * **Question:** *Does Utilitarianism require you to voluntarily starve yourself? And if you don't, are you acting immorally?"*

  **What to listen for:**
  *   **If they get it:** They will realize Utilitarianism demands self-sacrifice if the sum is higher elsewhere. The "Monster" isn't just a guy taking stuff; it's a black hole of moral obligation for everyone else.
  *   **If they miss it:** They will say "No, you have a right to eat." (This proves the Monster works—it shows Utilitarianism conflicts with Rights).

  ### 5. What to Explicitly Leave Out (Scope Limitations)
  Tell them this at the start or end so they don't think you're ignoring it out of ignorance.

  1.  **Rule Utilitarianism:** *"We are testing Act Utilitarianism. We aren't asking if a 'rule against starvation' creates better long-term outcomes. We are asking about this specific distribution."*
  2.  **Preference vs. Hedonic:** *"We are treating utility as 'pleasure/experience' for simplicity. We aren't getting into if the Monster's preferences are 'informed' or 'good'."*
  3.  **The Solution:** *"Today is about the problem, not the fix. We aren't solving how to kill the Monster or protect rights. We are diagnosing why Classical Utilitarianism allows the Monster to exist."*

  **Summary Checklist for Tuesday:**
  1.  **Axiom:** Sum Total > Distribution.
  2.  **Mechanism:** Biological Capacity > Preference.
  3.  **Stipulation:** No Diminishing Returns.
  4.  **Interception:** Block "Greed" and "Fairness" objections immediately.
  5.  **Twist:** Force the self-sacrifice question.
  6.  **Scope:** Admit you aren't solving it.
