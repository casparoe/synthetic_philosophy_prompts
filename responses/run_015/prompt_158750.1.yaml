      *   Two-sentence summary? Yes.

  10. **Final Polish:** Ensure tone is respectful of the volunteer nature but rigorous enough for the actuary. (Proceed to generate output).

  *(Self-Correction during drafting the PRI case)*: I need to make sure the PRI rejection is clear. If it's "3x or Bust," and "Bust" means -80%, and we have a 5% payout, the risk of ruin is high. Kelly would size this very small. If the minimum investment is larger than the Kelly size, it's a No. That's the hateable part.

  *(Self-Correction on Correlation)*: The prompt asks "how much the correction actually matters in practice." I need to be honest: For a small fund with a hard payout, it matters *a lot*. It turns a 1-in-20 risk into a 1-in-5 risk of breaching the floor.

  *(Self-Correction on Two-Sentence)*: Make it punchy. "Expected return averages the ups and downs; geometric growth survives them. We choose survival because the scholarship must exist in year 100, not just have a high average balance."

