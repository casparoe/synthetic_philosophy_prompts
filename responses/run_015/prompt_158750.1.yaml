prompt: |-
  I'm on the volunteer investment committee of a small perpetual scholarship fund — about $9M, we meet four times a year, we have to pay out somewhere near 5% a year in scholarships no matter what the market did, and the founding donor's family is in the room. None of us are finance people except one retired actuary. Our current "policy" is a gut-feel 60/40 plus whoever sounds most confident that quarter.

  We've been reading about the Kelly criterion / maximizing long-run geometric growth, and it's clicked for us that for a fund meant to last forever what matters is the growth rate of the corpus, not next year's expected return. But I can't hand a committee a formula. Please turn it into a decision procedure we can actually run in a 90-minute meeting on any proposal we get: the annual equity-vs-cash allocation, but also one-off skewed things — a donor challenge grant we could lever up on, a program-related investment that either returns 3x in six years or loses most of the principal, an offer to buy a building with a mortgage. I want it as questions in order, each with what counts as a good enough answer, where we stop with a no, and where it explicitly hands the decision back to us as a values call rather than a fact (I'm guessing the payout floor and the time horizon are in that category — tell me what else is).

  Two things have to be built in. One: we almost never have probabilities, just an actuarys range and some vibes, so the procedure needs to say what to do when the input is "somewhere between 30 and 60%", and be honest about which steps are judgment with numbers attached. Two: our positions aren't independent — everything correlates with everything, and with the years the scholarships come due — so "size it as if it were the only bet" needs correcting, and I want to know how much the correction actually matters in practice.

  Then run it on three cases: the annual allocation; the 3x-or-bust program-related investment our director is in love with; and a donor match that expires in 90 days. I want at least one case where the procedure gives us an answer we'll hate. And be straight about what maximizing geometric growth can't tell us — I suspect it has nothing to say about how bumpy the annual scholarship budget is allowed to be, and I want to know the other blind spots too.

  It needs to be in a form I can put infront of the board president, who will ask why this isn't just expected return, and will want a two-sentence answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Volunteer on an investment committee of a small perpetual scholarship fund ($9M AUM).
      *   **Constraints:** 5% annual payout requirement (hard floor), meetings 4x/year (90 mins), founding family present (emotional/legacy factor), mostly non-experts (one retired actuary).
      *   **Current State:** Ad-hoc 60/40 + "confidence" voting.
      *   **Goal:** Implement a Kelly-inspired decision procedure for asset allocation and one-off investments without using complex math in the meeting.
      *   **Specific Needs:**
          *   Step-by-step decision procedure (questions in order).
          *   Handling uncertainty (ranges/vibes vs. probabilities).
          *   Handling correlation (everything correlates, especially with payout needs).
          *   Three case studies (Annual Allocation, PRI, Donor Match).
          *   One case where the answer is "hateable" (unpopular but mathematically sound).
          *   Blind spots of Geometric Growth Maximization.
          *   Two-sentence explanation for the Board President (why this isn't just Expected Return).

  2.  **Deconstruct the Core Concept (Kelly Criterion for Endowments):**
      *   *Kelly Criterion:* Maximizes long-term geometric growth rate. Formula: $f^* = (p \cdot b - q) / b$.
      *   *Endowment Context:* We aren't just betting; we have a liability (5% payout). This is effectively a "hurdle rate." We need to maximize growth *above* the payout + inflation to maintain purchasing power.
      *   *Fractional Kelly:* Full Kelly is too volatile for a fund with a hard payout floor. We need "Half-Kelly" or less to reduce ruin risk.
      *   *Correlation:* The biggest risk isn't just asset volatility; it's asset volatility *coinciding* with payout needs (liability matching). If the market crashes and you still have to pay 5%, you sell low, locking in losses. This is "sequence of returns risk."

  3.  **Drafting the Decision Procedure (The "90-Minute Protocol"):**
      *   *Goal:* Make it actionable, not theoretical.
      *   *Step 1: The Hard Floor (Viability).* Can we survive the worst case? If the investment goes to zero or the market halves, do we breach the 5% payout and endanger the principal permanently?
      *   *Step 2: The Edge (Expected Growth).* Not just return, but *geometric* return. Need to adjust for volatility drag.
      *   *Step 3: Correlation & Liquidity.* Does this bet fail when we need cash for scholarships?
      *   *Step 4: Sizing (The Kelly Adjustment).* Convert the "edge" into a % of portfolio, then haircut it for safety (Fractional Kelly).
      *   *Step 5: The Values Check.* Where does math stop and mission begin?

  4.  **Addressing Specific Constraints:**
      *   *Uncertainty:* Use the Actuary. Ask for "Conservative," "Base," and "Optimistic" scenarios, not single point estimates. Use the Conservative for the "Hard Floor" test.
      *   *Correlation:* This is hard for laypeople. Simplify it: "If stocks drop 20%, does this drop 20% too? Does our scholarship demand go up?"
      *   *Values Call:* Payout rate (5%) and Time Horizon ("Perpetual") are values, not facts. Risk tolerance regarding scholarship volatility is also a values call.

  5.  **Developing the Case Studies:**
      *   *Case 1: Annual Allocation (60/40 vs. Kelly).*
          *   Current: 60/40.
          *   Kelly View: Might suggest less equity if volatility drag + payout > growth. Or more if equities are cheap. Let's make it controversial: Kelly might suggest *lower* equity exposure than 60% because of the 5% payout drag and volatility risk.
      *   *Case 2: The PRI (3x or Bust).*
          *   High skew. Kelly loves skew *if* probability is known.
          *   Input: "Vibes." Actuary says 20-40% chance.
          *   Result: Likely a "No" or very small size because the "Bust" scenario threatens the payout floor. This is the "hateable" answer. The Director loves it; Math says it risks the perpetuity.
      *   *Case 3: Donor Match (90 days).*
          *   Free money (100% return instantly).
          *   Kelly says bet the house.
          *   Constraint: Liquidity. Can we move cash that fast without selling assets at a loss?
          *   Result: Yes, but size limited by cash on hand, not leverage.

  6.  **Identifying Blind Spots of Geometric Growth:**
      *   Path dependency (Sequence of Returns Risk).
      *   Utility of money (Is $10M really twice as good as $5M for scholarships? Maybe not if you can't spend it).
      *   Mission Drift (Maximizing $ might mean investing in things contrary to the scholarship's purpose).
      *   Human Psychology (Can the committee hold through a 30% drawdown?).

  7.  **Drafting the Two-Sentence Explanation:**
      *   Needs to distinguish Expected Return (arithmetic) from Geometric Growth (compounding after volatility and payouts).
      *   *Draft:* "Expected return tells us the average outcome in a single year; geometric growth tells us the survival rate of the fund over a century. We are optimizing for never running out of money, not for having the highest average year."

  8.  **Refining the Procedure (Self-Correction/Iterative Polish):**
      *   *Critique:* Is "Kelly" too scary a word?
      *   *Fix:* Call it "The Perpetuity Test" or "Growth Sizing," but acknowledge the Kelly lineage in the background notes.
      *   *Critique:* How to handle correlation simply?
      *   *Fix:* Use a "Stress Correlation" question. "In 2008, what happens to this?"
      *   *Critique:* The user wants to know *where* to stop.
      *   *Fix:* Add explicit "Stop/No-Go" criteria at each step.

  9.  **Final Review against User Prompt:**
      *   90-minute meeting format? Yes.
