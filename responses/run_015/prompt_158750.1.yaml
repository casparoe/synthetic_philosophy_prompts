answer: |-
  ### The Two-Sentence Answer (For the Board President)
  "Expected return tells us the average outcome in a single year; geometric growth tells us the survival rate of the fund over a century. We are optimizing for never running out of money, not for having the highest average year."

  ***

  ### The "Perpetuity Protocol" (90-Minute Decision Procedure)

  This procedure replaces "confidence voting" with a structured stress test. It is based on **Fractional Kelly Sizing** (betting less than the math says to account for estimation error) and **Liability Matching** (ensuring the 5% payout doesn't force sales at the bottom).

  **Pre-Meeting Prep:** The Actuary must provide three scenarios for any proposal: *Conservative, Base, Optimistic*. Do not accept single-point estimates.

  #### Step 1: The Ruin Test (Hard Stop)
  **Question:** "In the Conservative scenario, does this investment + our 5% payout requirement ever force us to sell principal at a loss to pay scholarships?"
  *   **Good Answer:** "No. Even if this investment goes to zero (or drops 50%), our remaining liquid assets cover 3 years of scholarships."
  *   **Bad Answer:** "Probably not," or "We'd have to cut the scholarship budget."
  *   **Stop Rule:** If the answer implies breaching the 5% floor or touching the corpus principal in the Conservative case, **vote NO**. End of discussion.
  *   **Values Call:** *The 5% Floor.* This is not a math fact; it is a promise to the donor. If the committee is willing to vary the payout (e.g., 3% in bad years, 7% in good), state that now. If not, this test is absolute.

  #### Step 2: The Volatility Drag Check
  **Question:** "Does the expected *geometric* return exceed our hurdle rate (5% payout + 2% inflation = 7%)?"
  *   **Procedure:** Do not use the arithmetic average. Use the Actuary's approximation: $Geometric \approx Arithmetic - (Variance / 2)$.
      *   *Example:* If the Actuary says 10% return with high volatility, subtract a "volatility penalty." If it's a stable bond, penalty is small. If it's the PRI (3x or bust), penalty is huge.
  *   **Good Answer:** "Yes, even after subtracting the volatility penalty, the growth rate is above 7%."
  *   **Stop Rule:** If the geometric return is below 7%, **vote NO**. It shrinks the real value of the fund over time.

  #### Step 3: The Correlation & Liquidity Correction
  **Question:** "When does this asset lose money, and does that coincide with when we need cash for scholarships?"
  *   **Procedure:** Ask the "2008 Question." If public equities drop 30%, does this asset also drop? Does donor demand for scholarships *increase* (recession)?
  *   **The Correction:** If the asset correlates with the market *and* scholarship demand is counter-cyclical (more need in bad times), you must reduce the position size by **50%** from the theoretical maximum.
  *   **Good Answer:** "It correlates, so we are treating it as half-size for risk purposes."
  *   **Values Call:** *Smoothness of Payout.* Maximizing growth might mean letting the scholarship amount fluctuate. If the committee demands a *fixed* dollar amount every year regardless of market conditions, you must hold more cash/bonds, lowering long-term growth.

  #### Step 4: Sizing (The "Sleep Well" Number)
  **Question:** "What is the maximum percentage of the portfolio we can allocate without losing sleep if it drops 50% tomorrow?"
  *   **Procedure:**
      1.  Calculate theoretical Kelly Size: $(Win\% \times Payoff) - Loss\% / Payoff$.
      2.  **Halve it** (Fractional Kelly) to account for the fact that your probabilities are "vibes."
      3.  **Cap it** at 10% for any single non-liquid asset (PRI, Real Estate) to prevent concentration risk.
  *   **Good Answer:** "The math says 20%, we halve to 10%, and we cap at 10%."
  *   **Stop Rule:** If the minimum investment required (e.g., a building purchase) is larger than the "Sleep Well" number, **vote NO**. Do not lever up to fit the deal.

  #### Step 5: The Mission Alignment (Values Only)
  **Question:** "Does maximizing returns here conflict with the scholarship's purpose?"
  *   **Procedure:** Simple Yes/No.
  *   **Values Call:** *Mission vs. Money.* Sometimes the highest geometric return comes from industries contrary to the donor's values. This is the only step where you are allowed to reject a positive mathematical expectation for ethical reasons.

  ***

  ### Case Studies: Running the Protocol

  #### Case 1: The Annual Allocation (60/40 vs. Growth)
  *   **Input:** Actuary says 60/40 yields 7.5% arithmetic return, 12% volatility. 5% payout, 2% inflation hurdle (7%).
  *   **Step 1 (Ruin):** 60/40 drop (30%) leaves enough liquidity? Yes, if you hold 2 years cash.
  *   **Step 2 (Drag):** $7.5\% - (0.12^2 / 2) \approx 6.8\%$.
  *   **Result:** **FAIL.** The geometric return (6.8%) is below the hurdle (7%).
  *   **The Hateable Answer:** The protocol suggests **reducing equity risk** or **lowering the payout**. A 60/40 portfolio, historically, often fails to grow real capital after a 5% payout and fees. The committee will hate this because it implies the current scholarship level is unsustainable forever.
  *   **Decision:** Rebalance to 40/60 or negotiate a 4.5% payout rule.

  #### Case 2: The Program-Related Investment (PRI)
  *   **Input:** Invest $500k. 6-year horizon. Outcome: 3x return (60% IRR) or -80% loss. Director estimates 40% chance of success.
  *   **Step 1 (Ruin):** If -80%, we lose $400k. Do we have 3 years scholarship cash left? Yes ($9M total). Pass.
  *   **Step 2 (Drag):** Arithmetic Expectation: $(0.4 \times 200\%) + (0.6 \times -80\%) = +32\%$ total return over 6 years (~4.8% annualized).
  *   **Result:** **FAIL.** Even before volatility drag, the *expected arithmetic return* (4.8% annualized) is below the 7% hurdle.
  *   **Decision:** **NO.** The Director will hate this. He sees the 3x upside; the protocol sees the 60% probability of ruin dragging the geometric growth below the cost of capital. It threatens the perpetuity for a sub-par expected return.

  #### Case 3: The Donor Match (90 Days)
  *   **Input:** Donor matches new cash 1:1 up to $250k. Expires in 90 days.
  *   **Step 1 (Ruin):** Risk is zero (it's cash). Pass.
  *   **Step 2 (Drag):** Return is 100% in 0.25 years. Volatility is zero. Geometric return is astronomical. Pass.
  *   **Step 3 (Correlation):** Uncorrelated. Pass.
  *   **Step 4 (Sizing):** Kelly says "Bet the Farm."
  *   **Constraint:** We don't have $250k *new* cash. Selling assets to raise cash triggers taxes/fees and market risk.
  *   **Decision:** **YES, but size limited by cash on hand.** Do not sell equities to capture this unless the market is at an all-time high. If we have $100k cash, we take $100k match. We do not lever the fund to get the rest.

  ***

  ### Blind Spots: What Geometric Growth Cannot Tell You

  1.  **Path Dependency (Sequence of Returns Risk):** Geometric growth assumes you can hold through anything. It does not account for the fact that a 40% drop in Year 1 forces you to sell shares to pay the 5% scholarship, locking in losses and making recovery mathematically impossible. *Correction:* The "Ruin Test" (Step 1) attempts to catch this, but it requires honest liquidity modeling.
  2.  **Utility of Capital:** Is $20M really twice as useful as $10M? If you can only fund 50 students with $10M and 55 students with $20M, maximizing growth beyond $10M is vanity. The protocol optimizes for *dollars*, not *impact*.
  3.  **Human Risk Tolerance:** The Kelly-optimal portfolio will have drawdowns that make volunteers quit. If the committee dissolves because the fund dropped 25% in a year, the geometric growth rate becomes irrelevant.
  4.  **The "Values" Inputs:** The protocol treats the 5% payout and "Perpetual" horizon as constants. They are not. They are promises made by humans who can change their minds. If the family decides they want more scholarships now, the math breaks.

  ### Handling Uncertainty & Correlation (The "Vibes" Correction)

  *   **Uncertainty:** When the Actuary gives a range (30-60% probability), **use the bottom of the range** for Step 1 (Ruin) and the **middle of the range** for Step 2 (Growth). This builds a margin of safety.
  *   **Correlation:** You asked how much the correction matters. **In practice, it matters more than the return estimate.**
      *   *Why:* If you have two investments with identical returns, but one crashes when your donors stop giving, the second one is worthless to you.
      *   *The Fix:* The "50% Haircut" in Step 3 is a heuristic. It acknowledges that you cannot calculate a correlation matrix in 90 minutes. If an asset is illiquid (like a building) and the market crashes, you cannot sell it to pay scholarships. Treat illiquid assets as **zero liquidity** in the Ruin Test.

  ### Summary for the Committee
  We are not trying to get rich. We are trying to stay alive. This protocol prioritizes **survival of the corpus** over **maximization of the annual return**. It will sometimes tell you "No" to exciting opportunities. That is the feature, not the bug.
