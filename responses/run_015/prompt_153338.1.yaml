answer: |-
  | Requirement | Case (One Sentence) | Driver | Status | Priority |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Global Correlatability** | The boundary must appear synchronously in independent archives worldwide. | Earth Science | Non-negotiable | Science |
  | **2. Causal Proximity** | The marker must minimize the lag between human driver and geological signal. | History/Politics | Non-negotiable | Politics |
  | **3. Diachronic Tolerance** | The definition must accommodate regional arrival times without losing global status. | Earth Science | Negotiable | History |
  | **4. Baseline Distinguishability** | Pre-period noise must not obscure the boundary signal. | Earth Science | Non-negotiable | Science |
  | **5. Agency Identifiability** | The "Anthropos" must be specific enough for responsibility claims. | Politics | Non-negotiable | Politics |
  | **6. Threshold Stability** | The boundary shouldn't shift backward solely due to improved detection sensitivity. | History/Science | Non-negotiable | History |
  | **7. Narrative Coherence** | The period must support a teachable story of change, not just a data spike. | History | Non-negotiable | History |
  | **8. Decisional Transparency** | Authority for declaration must be distinct from beneficiaries of the definition. | Politics | Non-negotiable | Politics |

  **Incompatible Pair:** **Global Correlatability** and **Causal Proximity** cannot be jointly satisfied. The sharpest stratigraphic markers (e.g., radionuclides) are geologically synchronous but causally peripheral to the main drivers of change (e.g., carbon cycle), while the primary drivers (CO2, land use) lack a synchronous global onset. You must choose between a clean line in the rock and an honest account of the cause; science wants the line, politics wants the cause.

  **Boundary Killer:** **Agency Identifiability** rules out the most familiar candidates. Early Agriculture fails because the "who" is too diffuse to bear responsibility; the Industrial Revolution fails because it implicates specific classes and nations rather than a global "we"; the 1600s CO2 dip fails because the depopulation was an unintended consequence rather than a directed agency. Only the mid-20th century survives, and only by vague homogenization of responsibility. This requirement forces the seminar to confront that the name "Anthropocene" may be the primary error, not the date.
