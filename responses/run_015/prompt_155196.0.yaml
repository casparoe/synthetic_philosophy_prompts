  6.  **Refining Popper's Reaction:**
      *   Popper didn't "abandon" verisimilitude in the sense of saying "science doesn't aim for truth." He maintained the aim. He just conceded he couldn't *define* it formally in 1963. Later philosophers (Niiniluoto, Oddie) actually fixed the formalization using similarity metrics, which Popper might have accepted had he lived longer (he died in 1994, Oddie's major work was late 80s/90s). So saying he "retained only falsifiability" is too reductionist.

