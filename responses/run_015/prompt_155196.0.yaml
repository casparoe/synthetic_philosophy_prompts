          *   *Logical Collapse:* The host says metrics fail when the model is wrong. In ML, metrics work *best* when the model is wrong (to guide gradient descent). The Tichý problem is about logical comparability, not statistical error.
          *   *Severe Testing as Cross-Validation:* This is the strongest part of the analogy. Cross-validation tests generalization on unseen data; Popper's severe testing tests predictive power on novel facts. However, cross-validation optimizes a loss function; Popper explicitly rejects optimizing for probability or fit.
      *   **Falsifiability vs. Corroboration:** The summary collapses these. Falsifiability is a demarcation criterion (is it scientific?). Corroboration is a historical report (how well did it test?). Verisimilitude is the ontological goal (is it closer to truth?). The summary muddles these.

