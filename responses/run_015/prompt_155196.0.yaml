  3.  **Fact-Check & Philosophical Audit:**

      *   **Popper on Verisimilitude:** Popper introduced this in *Conjectures and Refutations* (1963). He wanted to talk about progress without claiming induction or verification.
      *   **The Formal Definition:** $Vs(A) > Vs(B)$ if $Ct_T(A) \ge Ct_T(B)$ and $Ct_F(A) \le Ct_F(B)$, with at least one strict inequality. ($Ct_T$ = truth content, $Ct_F$ = falsity content).
      *   **The Tichý/Oddie Problem (1974):** Pavel Tichý and David Oddie independently showed that for *false* theories, Popper's definition implies that a theory with *more* true consequences often necessarily has *more* false consequences in a way that makes comparison impossible or counter-intuitive. Specifically, under Popper's definitions, no two false theories are comparable.
      *   **Popper's Reaction:** Did he abandon it? He acknowledged the problem in his later work (e.g., *Unended Quest*, 1976). He didn't "abandon" the *intuition* that science progresses toward truth, but he admitted the *quantitative formalization* was inadequate. He didn't retreat *only* to falsifiability; he leaned heavily on *corroboration* (how well a theory survives severe tests) as the practical indicator of verisimilitude, even if verisimilitude itself couldn't be calculated.
