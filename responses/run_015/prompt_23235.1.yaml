answer: |-
  Here are seven questions designed to press the load-bearing commitments of your guest's view, including the specific required topics and follow-ups.

  **1. The Triviality Problem and Property Restriction**
  The standard worry about PII is that it's trivially true if we allow impure properties like "being identical to $a$." To make the principle substantive, you have to restrict the quantifier to qualitative or pure properties. But restrictions often look like *ad hoc* stipulations designed solely to save the principle from Black's spheres. How do you motivate your restriction on the property quantifier independently of the desire to make PII come out true?

  *   **Follow-up:** (If he says, "We only quantify over qualitative, non-singular properties") In Black's symmetric universe, the spheres share all monadic qualitative properties. Defenders often say they differ in relational properties, but in that setup, each sphere stands in exactly the same relations to everything that exists, including the other sphere. If you count relations as qualitative, they still match; if you exclude relations, the view seems too weak to do any metaphysical work. How do you escape this dilemma without simply defining "qualitative" in a way that begs the question against the counterexample?

  **2. Quantum Mechanics and Objecthood**
  Standard quantum mechanics describes systems of identical particles, like two electrons in a symmetric state, which seem to share all state-dependent properties. Many take this as a straightforward empirical refutation of PII. Do you view identical particles in QM as genuine counterexamples to the principle, or do you deny that they count as "objects" in the sense required by the metaphysical thesis?

  *   **Follow-up:** (If he denies they are objects, citing permutation invariance) If PII only applies to entities that aren't permutation-invariant, aren't you effectively retreating to the claim that PII is a contingent truth about classical, macroscopic objects rather than a necessary metaphysical principle? Does this deflate the principle from a constraint on *being* to merely a constraint on *classical modeling*?

  **3. PII and Haecceitism**
  There is a close logical relationship between PII and the denial of haecceitism, but they aren't obviously identical. A world with two indiscernible spheres isn't necessarily a haecceitistic variant of another world; it's just a single world with internal redundancy. Do you hold that PII and anti-haecceitism are equivalent theses, or do you think PII is strictly stronger than the denial of haecceitism?

  *   **Follow-up:** (If he says they are equivalent) How do you account for the intuition that we can quantify over the spheres individually ("Sphere 1 is on the left") without committing to haecceities? (If he says PII is stronger) What specific metaphysical work is PII doing that anti-haecceitism isn't? If we already deny primitive thisness, what danger remains if we allow two things to share all qualitative properties?

  **4. Conceivability vs. Metaphysical Possibility**
  Max Black's argument relies heavily on the claim that the two-sphere universe is conceivable, and therefore possible. You deny the possibility. This implies a significant gap between what we can conceive and what is metaphysically possible. Is this gap local to PII (i.e., we are systematically misled about identity), or does it suggest a broader rationalist methodology where conceptual coherence is a poor guide to modal reality?

  *   **Follow-up:** (If he argues we are misled about identity) If our modal intuitions fail us here, why should we trust the intuition that "identity is necessary" or other modal premises often used to *defend* PII? Are you relying on a different faculty than imagination to access these modal truths?

  **5. The Grounding of Numerical Diversity**
  If PII is true, numerical distinctness is grounded in qualitative difference. But consider the converse: if two objects differ qualitatively, what makes that qualitative difference attach to *two* substrates rather than one complex object? Does your view require a prior commitment to individuated substrates to bear the properties, or is the object just a bundle of properties, in which case PII becomes true by definition of what an object is?

  *   **Follow-up:** (If he leans towards Bundle Theory) If objects are just bundles of properties, how do you handle change over time? If an object loses a property, it's a different bundle, and thus a different object. Does your defense of PII commit you to perdurantism or a radical denial of endurance?

  **6. Weak Discernibility**
  Some philosophers, like Simon Saunders, argue that fermions satisfy a "weak" version of PII because they stand in irreflexive relations to one another (e.g., having opposite spin). This saves a structural version of the principle without requiring monadic differences. Do you think weak discernibility is sufficient to satisfy the core intuition behind PII, or is the principle only interesting if it guarantees discernibility by intrinsic properties?

  *   **Follow-up:** (If he says weak discernibility is sufficient) Black's spheres also stand in irreflexive relations (e.g., "is 2 meters from"). If you accept weak discernibility via relations, why does Black think his case is a counterexample? Does this mean Black's argument actually fails even on the weak reading, or is there a disanalogy between quantum relations and spatial distance?

  **7. Empirical Evidence and Falsifiability**
  I want to end on the epistemology of the view. If PII is a necessary truth known a priori, it's hard to see why physical discoveries should matter. But if it's sensitive to physics, as your answer on QM might suggest, it looks contingent. What specific evidence, from physics or elsewhere, could count *against* your version of PII? If the answer is "none," how do you respond to the charge that the principle is an unfalsifiable dogma rather than a live metaphysical hypothesis?

  *   **Follow-up:** (If he says it is a priori/conceptual) If it's a conceptual truth, why has it been so persistent as a live debate in the philosophy of physics? Is the disagreement merely verbal, or do you think physicists are making a substantive error when they treat identical particles as counterexamples?
