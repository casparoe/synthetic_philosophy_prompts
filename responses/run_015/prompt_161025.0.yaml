  Welcome to the show; let's dive straight into the core claims of your new book.

  1. You derive physical postulates from axioms about our experience, but could those axioms fail for a subject whose phenomenology is structurally alien to ours?
  If the axioms are self-evident to us, how can you guarantee they hold for systems nothing like us?

  2. If two overlapping complexes have nearly identical Φ values, does a trivial peripheral change really switch which entity is the conscious subject?
  Are you really willing to accept that adding a single inactive neuron could literally extinguish a subject of experience?

  3. Given that computing Φ is intractable for realistic systems, what exactly can a proxy measure like the perturbational complexity index tell us about the theory's validity?
  If the proxy diverges from the theory, are we simply to assume the measurement is at fault rather than the model?

  4. The cerebellum has more neurons than the cortex but is deemed unconscious by IIT; was this a genuine prediction or a retrofit to match our intuitions?
  If the verdict relies on structural details we couldn't previously assess, how is this distinct from tuning the theory to fit the data?

  5. Critics argue that a regular grid of simple elements can have high Φ; do you accept that such an artifact is conscious, and if so, what is its experience like?
  If a grid is conscious, what prevents us from attributing moral status to vast classes of non-biological systems?

  6. If a system can be unfolded into a functionally equivalent one with a different causal structure, does consciousness depend on the implementation rather than the computation?
  Does this not imply that two systems performing the exact same task could differ radically in whether there is something it is like to be them?

  7. You argue maximizing causal power over coarse grainings aligns IIT with causal emergence, but does allowing macro-level descriptions to beat micro-level ones make IIT compatible with global workspace theory?
  But if the conscious level is determined by where causal power peaks, isn't that precisely the kind of functional constraint global workspace advocates defend?

  8. You claim to recover the specific character of experience from the shape of a conceptual structure, but how can we verify this mapping if first-person reports are not ground truth?
  If reports are noisy, what independent access do we have to confirm that your geometric mapping matches the phenomenology?

  9. If Φ can be arbitrarily small, is there a threshold below which nothing is conscious, and where does that threshold come from?
  If consciousness is graded without a threshold, does an insect under stress possess a fraction of the moral status of a human?

  10. What internal inconsistency in the formalism itself, independent of empirical measurement or folk intuition, would compel you to abandon the theory?
  If no such inconsistency exists, isn't the theory protected from any possible refutation?
