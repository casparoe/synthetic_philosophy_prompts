answer: |-
  Good evening, everyone. Thank you for being here.

  Looking around this room, I see the exact tension that brought us together. On one side, neighbors who feel the ground has shifted beneath them, whose trust was broken by a council vote that felt less like governance and more like a decree. On the other side, the staff who work tirelessly to keep this town running, and the scholars who study how we decide things together. If I were doing my job as a host, I might try to smooth this over. I might say, "Let's just find common ground." But I don't think that's what we need tonight. Common ground is useless if the foundation is rotten.

  So, I want to start by saying something specific to the neighbors who are angry. I want to tell you that your anger is not just an emotional reaction to losing a vote. It is a philosophical objection. You are sensing that something about the *consent* involved in that decision was invalid. And you are right to feel that.

  Over the past year, I've been trying to put words to that feeling. I am not a political theorist. I'm just a neighbor. But I've been asking myself: What makes a "yes" actually count? When do we actually agree to something, and when are we just being processed?

  We tend to think that if no one is holding a gun to our heads, and we check a box, we have consented. But we know that isn't true in the rest of our lives. If I sign a contract written in a language I don't speak, I haven't truly consented, even if I signed it willingly. If a doctor asks me to approve a surgery but hides the risk of permanent disability in the footnotes, my signature is void. Deception nullifies consent. But so does incompetence—not stupidity, but a lack of access to the actual trade-offs. If I am asked to approve a financial mechanism I cannot possibly understand, my "yes" is not an act of will; it is an act of trust that might be misplaced.

  This is why the recent council vote felt like a violation to so many of you. It wasn't just that the outcome was unpopular. It was that the framing of the question obscured the tax implications. It was that the zoning technicalities were presented as mere formalities. In that environment, a majority vote does not produce legitimate authority. It produces a count, not a mandate.

  Now, we are here to discuss a proposal to fix this. The design on the table includes mandatory plain-language disclosures and a two-week public comment period before any binding referendum. The question I want to put to you, and to our staff and scholars, is this: Does this design secure valid consent?

  I want to be clear about my position. I believe this proposed design is a moral improvement over the status quo. It respects the neighbors enough to tell them the truth in a language they can read. But I also believe it still falls short. It does not fully secure valid consent for binding decisions on complex zoning and budgetary matters.

  Here is why.

  Valid consent requires that the person consenting understands the consequence of their agreement. In a town of thousands, we are dealing with systems of such complexity—fiscal derivatives, environmental impact densities, long-term debt servicing—that even with plain-language summaries, the average voter cannot grasp the full weight of the trade-off. A plain-language summary is still a summary. It necessarily leaves out the nuance that determines whether the decision is actually good or bad for the community.

  Some might argue that this doesn't matter because we are voting together. They might say that while one person might not understand the technical details, the *collective* wisdom of the neighborhood will get it right. This is the hope of democracy. But when we are talking about *consent*, not just wisdom, the math doesn't work. Aggregation does not create competence. If I do not understand what I am agreeing to, my vote is not a valid unit of consent. Adding a thousand invalid units together does not create a valid whole. It just creates a larger invalid whole.

  If we treat these referendums as binding based on this level of understanding, we are essentially asking residents to sign a contract they haven't fully read, even if the font is bigger.

  Now, I know what the municipal staff might say. You might say, "If we can't vote on these things, who decides? Do we just hand it all to unelected experts?" That is a fair challenge. But my point tonight is not that we should stop deciding things together. My point is that we must stop pretending that a simple referendum on technical matters creates the same kind of moral legitimacy as a referendum on a clear moral principle.

  When we vote on whether discrimination should be legal, we are all competent to judge. When we vote on whether a specific density bonus triggers a fiscal deficit that will collapse a school fund in ten years, most of us are not competent to judge, even with a two-week comment period.

  So, where does that leave us? It leaves us with a responsibility to change how we view the outcome of these votes.

  If we proceed with this referendum design, we must acknowledge that the vote is not a final seal of legitimacy. It is a signal of preference, not a grant of unlimited authority. If the vote passes, the council must still retain the discretion to halt implementation if the technical realities emerge that the voters could not have foreseen. To bind the town absolutely to a vote cast without full technical competence is to prioritize procedure over the actual well-being of the community.

  To the neighbors: This means your anger is valid, but the solution isn't just "more votes." It is recognizing that some things are too complex for a binary up-or-down consent model. We need a system where consent is ongoing, where the council can say, "The voters said yes, but the numbers say no, and we have a duty to the truth of the numbers."

  To the staff and scholars: This means your job is not just to facilitate the vote, but to protect the town from the limits of the vote. You are the guardians of the competence that the ballot box lacks.

  I am proposing that we adopt the plain-language rules, yes. But I am also proposing that we explicitly write into the charter that these referendums are advisory on technical fiscal and zoning matters, not binding. If we want valid consent, we must admit when the conditions for it cannot be met. We cannot vote our way out of complexity.

  Tonight, let's not just talk about how to count the votes. Let's talk about what the votes can actually bear. Let's talk about how we build a town where authority comes from genuine understanding, not just a majority of signatures on a form we didn't fully grasp.

  Thank you.

  ***

  **Note on Philosophical Liberties**

  *This argument takes liberties with standard political theory distinctions in two key ways. First, it treats collective decision-making as directly analogous to individual contractual consent. Many democratic theorists reject this analogy, arguing that political legitimacy arises from the fairness of the procedure and equal participation, not from the epistemic competence of each individual voter regarding the specific policy outcome. Second, it relies on a contested, high-threshold interpretation of "competence." Standard democratic theory generally assumes that voters are competent enough to judge their own interests or to rely on trusted heuristics (like party affiliation or expert endorsement), whereas this speech argues that without direct personal understanding of technical trade-offs, consent is fundamentally void.*
