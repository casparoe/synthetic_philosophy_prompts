prompt: |-
  hey im on a review board for our county's emergency intervention fund and we get like 15-20 proposals a month asking us to approve spending on things that are basically "rescue" operations -- vaccinating a remote village, funding a suicide hotline, sending gear to wildfires, even one about saving a coastal archive of indigenous records from storm surges. right now we just vote on gut feeling and its a mess.

  i want a decision procedure based on singer's drowning child idea -- that if you can prevent something terrible without giving up anything of comparable moral importance, then you have to do it. but i need it turned into something my board can actually run in about 20 minutes per proposal, since none of us are philosophers. so write me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no, and where it has to hand the decision back to the board because its a values question not a facts question.

  the procedure needs to handle the hard cases: the "victim" might be statistical or future (preventing expected deaths vs saving one visible person), the "cost" is always money we could spend on another proposal, and sometimes people disagree about wether the harm is "bad enough" to trigger the duty at all. also it needs a specific check for proposals where the beneficiary's moral status is contested -- like wild animals, digital archives, or future generations -- since singer's own framework extends beyond humans but not everyone on the board agrees.

  then run the procedure on three proposals: (1) funding a mobile unit to reverse opioid overdoses in our county, (2) a grant to protect that coastal archive of indigenous records from storm surges, and (3) a program that vaccinates a wild deer population against a painful but non-lethal disease.

  make sure you flag where the procedure will misfire or give answers the board probably wont like. and please say how confident you are in what you claim, and single out the one point you're least sure about -- especially anything that hinges on how singer actually treats indirect costs or statistical lives.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** County emergency intervention fund review board.
      *   **Volume:** 15-20 proposals/month.
      *   **Current State:** Voting on gut feeling (messy).
      *   **Goal:** A decision procedure based on Peter Singer's "Drowning Child" argument (Prevent bad thing without sacrificing comparable moral importance $\rightarrow$ Obligation).
      *   **Constraints:** Must take ~20 minutes/proposal. Board members are not philosophers.
      *   **Requirements:**
          *   Ordered questions.
          *   Sufficient answers for each step.
          *   Hard "No" stop points.
          *   Hand-off points (values vs. facts).
          *   Handle hard cases: Statistical/future victims, opportunity costs (money could go elsewhere), disagreement on severity of harm.
          *   Specific check for contested moral status (animals, archives, future gens).
          *   Run the procedure on three specific proposals (Opioid unit, Indigenous archive, Wild deer vaccine).
          *   Flag misfires/unpopular answers.
          *   State confidence level and identify the least certain point (specifically regarding Singer on indirect costs/statistical lives).

  2.  **Deconstruct Singer's "Drowning Child" Argument:**
      *   *Premise 1:* Suffering/death from lack of food, shelter, medical care is bad.
      *   *Premise 2:* If it is in our power to prevent something bad without sacrificing anything of *comparable moral importance*, we ought to do it.
      *   *Conclusion:* We ought to prevent the bad thing.
      *   *Key Nuances for this Context:*
          *   "Comparable Moral Importance": This is the crux. For a county fund, "comparable" usually means "does this exhaust the fund to the point where we can't handle other emergencies?" or "is the cost disproportionate to the benefit?"
          *   "Distance/Proximity": Singer argues distance doesn't matter, but a *county* fund implies geographic jurisdiction. I need to balance Singer's universalism with the board's legal mandate (county residents/assets).
          *   "Statistical vs. Identified": Singer treats them equally, but humans psychologically don't. The procedure needs to force equality.
          *   "Moral Status": Singer is a utilitarian/preference utilitarian. He includes sentient animals. He is less clear on inanimate objects (archives) unless they serve sentient beings.

  3.  **Drafting the Procedure (The "Singer Scale"):**
      *   *Time Limit:* 20 minutes means maybe 5-6 key questions.
      *   *Structure:* Funnel approach. Start with eligibility, move to severity, then cost-benefit, then moral status.
      *   *Step 1: Jurisdiction & Feasibility.* (Can we actually do this? Is it our job?)
      *   *Step 2: Harm Severity.* (Is the "bad thing" actually bad enough?)
      *   *Step 3: Moral Status.* (Who/what is being saved? Do we agree they count?)
      *   *Step 4: Cost & Comparability.* (Is the cost "comparable" to the harm? This is the opportunity cost check.)
      *   *Step 5: Statistical/Distance Check.* (Are we discounting because they are unseen/future?)
      *   *Decision:* Approve, Reject, or Escalate (Values Conflict).

  4.  **Refining the Questions for Non-Philosophers:**
      *   Avoid jargon like "utilitarian calculus." Use "Cost vs. Harm."
      *   Make the "Comparable Moral Importance" concrete. Since it's a fund, money is the metric. But Singer says money isn't morally important *unless* it prevents something else equally bad. So, the question is: "Does spending this money here prevent something *worse* elsewhere?"
      *   *Correction:* A county board has a fiduciary duty. They can't just give all money to the single most effective cause globally. They have to serve the county. I need to adapt Singer to *County Singer*. The "Comparable Moral Importance" becomes "Does this expenditure cripple our ability to respond to other county emergencies?"

  5.  **Addressing Specific Constraints:**
      *   *Contested Moral Status:* Need a specific "Veto/Vote" step here. If the board disagrees on whether deer count, the procedure can't solve that. It must flag it.
      *   *Statistical Lives:* Need a question that forces them to equate 1 visible life with 1 statistical life.
      *   *Confidence & Uncertainty:* I need to be honest about where Singer's philosophy is debated (marginal utility, demandingness objection).

  6.  **Developing the Three Test Cases:**
      *   *Case 1 (Opioids):* High harm (death), high moral status (humans), direct cost. Likely Pass.
      *   *Case 2 (Archive):* Low direct harm (no death), contested moral status (records vs. people), future benefit. Likely Fail or Escalate under strict Singer.
      *   *Case 3 (Deer):* Medium harm (pain, not death), contested moral status (animals). Likely Fail/Escalate depending on board's view on animals.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The "Comparable Harm Protocol" (CHP).
      *   *Step 1 (The Bad Thing):* Define the harm. Is it severe? (Death/Suffering vs. Inconvenience).
      *   *Step 2 (The Agent):* Who benefits? Do they have moral standing? (Humans = Yes. Animals/Objects = Board Vote).
      *   *Step 3 (The Cost):* Is the financial cost "comparable" to the harm? *Crucial adaptation:* In Singer's original, you keep giving until you drop to the level of the victim. For a county fund, the limit is "Bankruptcy/Inability to serve other mandates."
      *   *Step 4 (Distance/Statistics):* Are we rejecting this because the victims are invisible or future? If yes, override bias.
      *   *Step 5 (Opportunity Cost):* Could this money prevent *more* harm elsewhere? (The Effective Altruism angle).

      *Wait, I need to make sure I stick closer to Singer's specific logic while making it practical.*
      Singer's core: Prevent Bad $\rightarrow$ No Comparable Sacrifice $\rightarrow$ Duty.
      For a board: Prevent Bad $\rightarrow$ Cost is within budget/mandate $\rightarrow$ Duty.
      The friction point is "Comparable Moral Importance." For a rich individual, buying a shoe is not comparable to a life. For a county fund, spending \$50k on archives *might* be comparable to spending \$50k on overdoses if the budget is tight.
      *Decision:* I will frame "Comparable Moral Importance" as "Does this expenditure prevent us from fulfilling a *more urgent* duty elsewhere?"

  8.  **Addressing the "Least Sure" Point:**
      *   Singer's view on *indirect costs* and *systemic effects*. Singer focuses on direct aid. But in public policy, spending money on X might undermine systemic resilience Y. Also, Singer's view on "statistical lives" is clear (they count equally), but how to operationalize "expected value" in a 20-minute meeting is hard. I will flag the calculation of "expected lives saved" vs "identifiable lives saved" as the uncertainty point.

  9.  **Review against Constraints:**
      *   20 mins? Yes, 5 steps.
      *   Hard No/Hand-off? Yes.
      *   Three cases run? Yes.
      *   Confidence/Uncertainty? Yes.

  10. **Final Polish:** Ensure tone is professional but direct. Make sure the distinction between "Singer's Ideal" and "County Board Reality" is clear (i.e., we are adapting the principle, not importing the whole philosophy). *Self-Correction:* The prompt asks for a procedure *based on* Singer's idea, not necessarily pure Singer. It needs to work for the board. I will explicitly note where we deviate from pure Singer for practicality (e.g., jurisdictional limits).

      *Wait, one more thing:* The prompt asks to flag where the procedure will misfire or give answers the board won't like.
      *   *Misfire:* The Archive case. Singer would likely say "No" unless records prevent human suffering. The board might want to say "Yes" for cultural reasons.
      *   *Misfire:* The Deer case. Singer says "Yes" (sentience). Board might say "No" (taxpayer money for deer?).
      *   *Misfire:* Opportunity Cost. If the Opioid program is less effective than a different Opioid program, Singer says "No." Board might say "Yes, it's still good."

      *Confidence:* High on the structure, Medium on the philosophical fidelity regarding "comparable moral importance" in a bureaucratic context.
      *Least Sure:* How to quantify "comparable moral importance" regarding opportunity costs without requiring full cost-benefit analysis.

      *Let's write it.*
answer: |-
  Here is a decision procedure adapted from Peter Singer's "Drowning Child" argument, designed for a bureaucratic context. It translates the philosophical principle (*"If you can prevent something bad without sacrificing anything of comparable moral importance, you must"*) into an administrative checklist.

  ### The "Comparable Harm" Protocol (CHP)
  **Time Limit:** 20 Minutes per Proposal
  **Goal:** Remove gut feeling by forcing specific justifications for "No" votes.

  #### Step 1: The Severity Threshold (3 Minutes)
  **Question:** *Does this proposal prevent harm that meets the "Severe Suffering" threshold?*
  *   **Definition:** Death, permanent disability, acute physical pain, or irreversible loss of essential cultural/memory infrastructure (only if it directly impacts community mental health/survival).
  *   **Sufficient Answer:** A factual description of the harm prevented.
  *   **Hard No:** If the harm is merely "inconvenience," "aesthetic loss," or "economic inefficiency" without human/animal suffering.
  *   **Hand-Off:** If board members disagree on whether the harm is "severe" (e.g., is losing an archive "severe"?), move to **Step 4**.

  #### Step 2: Moral Status Check (3 Minutes)
  **Question:** *Do the beneficiaries have uncontested moral standing in this jurisdiction?*
  *   **Category A (Uncontested):** Current county residents (humans).
  *   **Category B (Contested):** Non-residents, future generations, non-human animals, inanimate objects (archives).
  *   **Sufficient Answer:** Categorization of the beneficiary.
  *   **Procedure:**
      *   If **Category A**: Proceed to Step 3.
      *   If **Category B**: The board must take a preliminary vote *solely* on moral standing. If >50% vote "No Standing," the proposal is rejected. If >50% vote "Standing," proceed to Step 3.
  *   **Hand-Off:** If the vote is split 50/50, the proposal is **Escalated** to a full board values discussion (cannot be resolved by this procedure).

  #### Step 3: The Cost Comparability Test (7 Minutes)
  **Question:** *Is the financial cost "comparable" to the harm prevented?*
  *   **Singer's Adaptation:** In Singer's original argument, you sacrifice until you are at the same level of suffering as the victim. For a public fund, "Comparable Moral Importance" means: *Does spending this money prevent us from fulfilling a more urgent duty elsewhere?*
  *   **Sufficient Answer:** A comparison of the cost against the fund's remaining liquidity and other pending proposals.
  *   **Hard No:** If funding this proposal depletes the fund to the point where a *more severe* (Step 1) Category A (Step 2) emergency cannot be addressed later in the fiscal year.
  *   **Note:** If the fund has surplus, cost is rarely "comparable" to death/suffering. Money is not morally important; suffering is.
  *   **Hand-Off:** If there is disagreement on whether a *different* pending proposal is "more urgent," move to Step 5.

  #### Step 4: The Distance & Statistics Bias Check (4 Minutes)
  **Question:** *Are we rejecting this because the victims are invisible, statistical, or distant?*
  *   **Singer's Rule:** Distance (geographic or temporal) and identifiability (named victim vs. statistical) are morally irrelevant.
  *   **Sufficient Answer:** Acknowledgement that 1 statistical death = 1 identified death.
  *   **Hard No:** You cannot vote "No" based on "We don't know exactly who this saves" or "This helps future people, not current ones."
  *   **Hand-Off:** If the board feels a moral duty to prioritize *current, identified* residents over *future/statistical* ones despite Singer's rule, this is a **Values Conflict**. Escalate.

  #### Step 5: The Opportunity Cost Efficiency (3 Minutes)
  **Question:** *Is there a significantly more effective way to prevent this specific harm with the same money?*
  *   **Singer's Rule:** If you can save 10 lives for the cost of 1, you are obligated to save 10.
  *   **Sufficient Answer:** Evidence that this specific vendor/method is within the top 50% of cost-effectiveness for this type of intervention.
  *   **Hard No:** If there is a known alternative that saves 2x more lives/reduces 2x more suffering for the same cost.
  *   **Hand-Off:** If data on effectiveness is unavailable or contested, the board votes on risk tolerance.

  ***

  ### Running the Procedure on Your Three Proposals

  #### Proposal 1: Mobile Opioid Overdose Unit
  *   **Step 1 (Severity):** Prevents death. **Pass.**
  *   **Step 2 (Status):** County residents (humans). **Category A (Uncontested).**
  *   **Step 3 (Cost):** Cost is \$150k. Fund has \$2M. Does this prevent other emergencies? Unlikely. **Pass.**
  *   **Step 4 (Bias):** Victims are statistical (potential overdoses). Procedure forces board to treat them as equal to identified victims. **Pass.**
  *   **Step 5 (Efficiency):** Is this the best way to spend \$150k on opioids? Assume yes for this example. **Pass.**
  *   **Verdict:** **APPROVE.**
  *   **Likely Friction:** None. This is the "easy" case Singer designed for.

  #### Proposal 2: Coastal Indigenous Archive Protection
  *   **Step 1 (Severity):** Prevents loss of records. Is this "Severe Suffering"?
      *   *Procedure Ruling:* Technically **No**. Records don't feel pain.
      *   *Exception:* If argued that loss causes severe community mental health trauma. If accepted, **Pass**. If not, **Hard No**.
  *   **Step 2 (Status):** Inanimate objects/Future generations. **Category B (Contested).**
      *   *Procedure Ruling:* Requires preliminary vote on standing. If board views archives as having no moral standing, **Hard No**.
  *   **Step 3 (Cost):** \$200k.
  *   **Verdict:** **LIKELY REJECT or ESCALATE.**
  *   **Why it Misfires:** Singer's framework is utilitarian and sentientist. It struggles to value culture/artifacts unless they instrumentally reduce suffering. Your board might value heritage intrinsically. This procedure will force you to admit you are violating Singer's logic to fund this.

  #### Proposal 3: Wild Deer Vaccination (Non-Lethal Disease)
  *   **Step 1 (Severity):** Prevents "painful but non-lethal" disease.
      *   *Procedure Ruling:* Meets threshold if pain is significant. **Pass.**
  *   **Step 2 (Status):** Wild animals. **Category B (Contested).**
      *   *Procedure Ruling:* Singer grants animals moral standing (sentience). Your board might not. Requires preliminary vote.
  *   **Step 3 (Cost):** \$100k.
  *   **Step 5 (Efficiency):** High cost per animal vs. human health programs.
      *   *Procedure Ruling:* If the board accepts animal standing, they must compare deer suffering to human suffering. If \$100k relieves 10,000 deer pain vs. 5 human deaths, Singer says save the humans.
  *   **Verdict:** **LIKELY REJECT.**
  *   **Why it Misfires:** Even if the board accepts animals have standing, the *comparability* test (Step 3/5) usually favors humans in a county fund context. However, if the board is sympathetic to animals, Step 2 becomes a values battle.

  ***

  ### Critical Flags & Confidence Assessment

  **Where this procedure will misfire / give unpopular answers:**
  1.  **The Archive (Cultural Value):** This procedure will likely kill the archive proposal unless you argue it prevents human psychological harm. Singer's framework does not easily accommodate "intrinsic value of culture." If your board believes culture has value *independent* of suffering, this procedure is too narrow.
  2.  **The "Demandingness" Problem:** Singer's logic implies you should keep spending until the fund is empty, provided the harm prevented is greater than the harm of running out of money later. This procedure limits that via Step 3 (liquidity), but board members may feel moral distress that they aren't doing *enough*.
  3.  **Statistical vs. Identified:** Step 4 forces the board to ignore the "identifiable victim effect." In practice, boards *always* prefer saving named individuals over statistical ones. Enforcing Step 4 may feel politically impossible.

  **Confidence Level:** **High (85%)** on the procedural structure; **Medium (60%)** on the philosophical fidelity regarding opportunity costs.

  **The One Point I Am Least Sure About:**
  **How Singer treats "Indirect Systemic Costs" in a bureaucratic context.**
  Singer's "Drowning Child" is a direct interaction (You $\rightarrow$ Child $\rightarrow$ Money). In public policy, spending \$150k on opioids (Proposal 1) might have indirect costs: does it create dependency on county aid? Does it reduce pressure on the state to fix the root cause? Singer generally focuses on immediate harm reduction, but some interpretations of "comparable moral importance" argue that maintaining *systems* (like fiscal solvency or political will) has moral weight.
  I am least sure how to quantify whether "preserving the fund for unknown future emergencies" counts as a "comparable moral importance" to "saving a statistical life today." Singer would likely say *no* (a life is a life), but a fiduciary board must say *yes*. Step 3 attempts to bridge this, but it is the philosophical weak point where Utilitarianism clashes with Fiduciary Duty.
