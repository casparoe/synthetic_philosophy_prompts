prompt: |-
  Act like a philosophy prof who works on modal metaphysics and language, but dont overdo the jargon. Before answering, spend a minute brainstorming the difference between metaphysical rigidity and whatever epistemic conditions might mess with it. I want you to compare standard Kripkean rigid designation — where a name grabs the same object in every world it exists — with this made-up variant I'm calling 'conditional rigidity': a name is only rigid in worlds where the original dubbing event could have happened with the same kind of perceptual access. So in a world where Venus never shows up at dusk and Mars does, 'Hesperus' might not point to Venus at all, because the baptism conditions are broken. Now apply both views to the necessary a posteriori: does 'water is H2O' stay necessary and a posteriori under conditional rigidity, or does it turn into a disguised descriptive claim about whatever liquid plays the water-role in that world? Argue for which view handles counterfactual identiy claims better, and be clear about whether the modal argument against descriptivism survives or dies on this hybrid account. No bullet points please, just a flowing comparison, and if you need an example use the Hesperus/Phosphorus case but dont quote anyone directly — paraphrase in your own words.
