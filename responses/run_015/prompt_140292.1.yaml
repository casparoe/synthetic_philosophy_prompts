      *Drafting Memo:*
      To: Fellowships Committee
      From: Graduate Representative
      Date: October 23, 2023
      Re: Decision Rule and Allocation for Dissertation Fellowships

      Members,

      We face a logical impasse that threatens the legitimacy of our awards. Our charter demands a transitive ranking, yet our votes produce a Condorcet cycle (F-06 > F-11 > F-17 > F-06). Our scoring produces a sorites band (F-06 to F-51) where adjacent differences are imperceptible, yet endpoints differ markedly. We cannot satisfy the charter without violating logic or ignoring evidence. This memo proposes a solution grounded in a revised understanding of merit.

      Philosophical Context and Stance
      We are operating under the assumption that "better than" is a single, transitive relation applicable simpliciter. The data proves otherwise. When merit is aggregated across distinct respects—writing quality, teaching record, promise versus accomplishment—"better than" becomes respect-relative. A candidate better in writing may be worse in promise. Aggregating these respects via majority vote creates cycles, proving transitivity fails at the committee level. This aligns with the view that 'better than' is really three-place: better than with respect to some purpose.

      Furthermore, the scoring band demonstrates that imperceptible differences accumulate into perceptible ones. If we treat imperceptible differences as zero, we must conclude F-06 equals F-51, which is false. If we treat them as real, we claim to distinguish what we admitted we cannot. We must accept that merit is respect-relative and that strict transitivity does not hold for our aggregate judgments. We cannot rank the top three; we can only select from them. We cannot precisely rank the band; we must treat the top tier as a qualified pool. This is not an abandonment of judgment, but a recognition of its limits.

      Allocation Plan
      To resolve this within nine days, I propose the following allocation:
      1. Award full fellowships to F-06, F-11, and F-17. Since they cycle, no one is strictly superior. We have four slots; awarding three resolves the cycle by funding all contenders without ranking them. This respects the pairwise votes by not ranking any loser above a winner.
      2. Award the fourth fellowship as a split between F-24 and F-25. These files sit in the dense band where adjacent differences are imperceptible. Splitting acknowledges their equal standing while respecting the Dean's allowance for one split award. This utilizes the resource to support two promising candidates rather than arbitrarily choosing one. It acknowledges the spectrum argument: while endpoints differ, the middle is dense.
      3. Files F-30 through F-51 receive no award this cycle but remain eligible for future support.

      Charter Amendment
      The pairwise clause forbids ranking Q above P if a majority preferred P to Q. This is impossible when preferences cycle. We propose replacing it with: "When head-to-head votes produce a cycle, the Committee may select recipients from the cycling set without establishing a complete ranking, provided written reasons are given." This prevents future impasses while maintaining accountability.

      Objection and Rebuttal
      The strongest objection is that banding and splitting abandon the specific judgment each candidate is owed. Critics will argue that fellowships require identifying the *best*, not funding a *pool*. By using a split award and refusing to rank the top three, we allegedly reduce merit to a lottery. Colleagues may fear this sets a precedent for laziness, allowing us to avoid hard choices.

      However, pretending to rank when logic forbids it is dishonest. Judgment requires acknowledging when distinctions are illusory. We owe candidates honesty about the limits of our evaluation, not a false precision that violates our own voting record. To force a ranking is to lie about the quality of our deliberation.

      Next Steps
      We must vote on this memo Thursday. If passed, the Chair will notify the Dean of the split award rationale by Friday. Winners must be announced by Monday to meet the nine-day deadline. This path preserves our integrity while fulfilling our duty to fund promising work.

