answer: |-
  ### The Interventionist Criterion
  **The Core Question:** If we froze all the material conditions exactly as they were (technology, class structure, trade routes, resources) and *only* changed the cultural variable (the religious ethic, the norm, the belief), would the economic outcome (the rise of capitalism) change?

  *   **Yes:** Culture is an independent causal lever.
  *   **No:** Culture is either dependent on materials (Materialist) or not a "cause" in this mechanical sense (Interpretivist).

  ---

  ### The Decision Tree

  **Node 1: Direction of Determination**
  *Is the cultural variable determined by the material base, or can it vary independently?*
  *   **No (Determined):** The cultural variable tracks material changes; it cannot be intervened upon without changing the material base first.
      *   **Node 1a: Strength of Determination**
          *   *Strict:* Culture is a direct reflection of economic relations.
              *   **Leaf 1: Hard Materialism (Marxian Base/Superstructure)**
              *   *Awkward Commitment:* Must explain away the subjective experience of moral choice as a complete illusion.
          *   *Loose:* Culture exists as a distinct layer but has no power to alter material outcomes.
              *   **Leaf 2: Soft Epiphenomenalism**
              *   *Awkward Commitment:* Must explain why cultural history correlates so tightly with economic history if it does no work.
  *   **Yes (Independent):** The cultural variable has autonomy and can be the target of an intervention.
      *   **Node 2: Locus of Causal Power**
          *   *Does the work happen inside the individual mind or in the social field?*
          *   **Social Field (Group/Structure):** The mechanism is external to individual psychology.
              *   **Node 3: Mechanism of Transmission**
                  *   *Unconscious Embodiment:* Culture is a durable, pre-reflective disposition inscribed on the body.
                      *   **Leaf 3: Bourdieusian Habitus**
                      *   *Awkward Commitment:* Struggles to account for rapid social change or conscious resistance to norms.
                  *   *Strategic Equilibrium:* Culture is a set of rules/norms that solves coordination problems.
                      *   **Leaf 4: Institutionalist/Path Dependence**
                      *   *Awkward Commitment:* Risks functionalism by assuming norms exist simply because they are efficient.
                  *   *Selection/Evolution:* Culture is a population-level trait selected for fitness.
                      *   **Leaf 5: Cultural Evolution/Memetics**
                      *   *Awkward Commitment:* Risks treating ideas as viruses, ignoring the human agency that carries them.
          *   **Individual Mind (Agency/Psychology):** The mechanism is internal to the actor.
              *   **Node 4: Temporal Priority**
                  *   *Did the valuation precede the economic behavior?*
                  *   **No (Post-Hoc):** The value was adopted to justify behavior driven by other interests.
                      *   **Leaf 6: Reverse-Causation/Ideological Instrumentalism**
                      *   *Awkward Commitment:* Must explain why the specific ideology adopted fits the economic interest so perfectly if it's arbitrary.
                  *   **Yes (Pre-Existing):** The value motivated the behavior.
                      *   **Node 5: Explanatory Status**
                          *   *Is the value a psychological event or a logical reason?*
                          *   *Psychological Event:* The belief acts as a mental cause triggering action.
                              *   **Node 6: Consciousness of Mechanism**
                                  *   *Conscious Belief:* The actor is aware of the motivation.
                                      *   **Leaf 7: Weberian Cultural Causalism**
                                      *   *Awkward Commitment:* Risks idealism by underestimating how material constraints limit belief-driven action.
                                  *   *Internalized Norm:* The motivation is systemic but not necessarily conscious.
                                      *   **Leaf 8: Parsonian Internalization**
                                      *   *Awkward Commitment:* Assumes social systems naturally tend toward equilibrium and value consensus.
                          *   *Logical Reason:* The value makes the action intelligible, not necessarily causing it like a billiard ball.
                              *   **Leaf 9: Interpretivist/Constitutive (Winch/Geertz)**
                              *   *Awkward Commitment:* Sacrifices predictive power; can only explain actions after they occur.

  *(Note: To meet the 6-8 leaf target, Leaves 1 & 2 can be collapsed into a single "Materialist/Epiphenomenalist" leaf, and Leaves 7 & 8 can be distinguished as "Strong Weberian" vs "Parsonian." For this tree, I have expanded to 9 to show the full granularity, but you can merge 1+2 and 7+8 to hit 7 leaves.)*

  **Consolidated Leaf List (Merging for 7 Leaves):**
  1.  **Materialist/Epiphenomenalist** (Merged 1 & 2)
  2.  **Bourdieusian Habitus**
  3.  **Institutionalist/Path Dependence**
  4.  **Cultural Evolution/Memetics**
  5.  **Reverse-Causation/Ideological Instrumentalist**
  6.  **Weberian Cultural Causalism** (Merged 7 & 8)
  7.  **Interpretivist/Constitutive**

  ---

  ### Indistinguishable Leaves
  *   **Weberian Cultural Causalism vs. Parsonian Internalization:** Empirically, it is nearly impossible to distinguish between a "conscious belief" driving action and an "internalized norm" driving action. Both look like "individual psychology" from the outside, and actors often rationalize unconscious norms as conscious beliefs.
  *   **Bourdieusian Habitus vs. Institutionalist Norms:** Both operate at the group level. A "norm" often becomes a "habit" over time. The distinction relies on whether the actor *could* consciously violate the rule (Institutionalist) or finds it *unthinkable* to do so (Habitus), which is hard to code in historical data.

  ### Unoccupied Combinations
  1.  **Independent + Individual + Post-Hoc + Constitutive.**
      *   *Why Unoccupied:* Incoherent. If the value is adopted *after* the action (Post-Hoc), it cannot be *Constitutive* of the action's meaning at the time it occurred.
  2.  **Dependent + Individual + Causal Mechanism.**
      *   *Why Unoccupied:* Incoherent. If the cultural variable is *Dependent* on materials (Node 1), then the material base is the actual cause. Claiming culture is both dependent and the primary causal mechanism is a contradiction in terms for interventionists.
  3.  **Independent + Group + Psychological Event.**
      *   *Why Unattractive:* Category error. "Psychological events" happen in minds, not groups. While "group minds" have been theorized (Durkheim's collective consciousness), most modern philosophers and historians reject this as metaphysically spooky without a clear mechanism (like Habitus or Institutions) to ground it.
