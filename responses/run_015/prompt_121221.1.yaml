answer: |-
  **SEMINAR HANDOUT: THE DEMOS BOUNDARY SORTING TREE**
  **Topic:** Who Counts? (Boundary Problem Taxonomy)
  **For:** In-class sorting exercise (no prep needed)

  Below is a decision tree to help locate where you stand on the *boundary problem*. Don't worry about the theory names yet—just answer the concrete questions. Follow the arrows down to find your leaf position.

  **NODE 1:** Should a long-term permanent resident who pays taxes but holds foreign citizenship vote in national elections?
  *   **NO** → Go to **LEAF A**
  *   **YES** → Go to NODE 2

  **NODE 2:** Should non-human animals with sustained social lives (say, sanctuary apes) be represented in the legislature?
  *   **YES** → Go to **LEAF B**
  *   **NO** → Go to NODE 3

  **NODE 3:** Should future generations get present proxies (e.g., a commissioner for the year 2100)?
  *   **YES** → Go to **LEAF C**
  *   **NO** → Go to NODE 4

  **NODE 4:** Should a tourist currently in the country vote on a law that directly impacts their safety (e.g., a curfew)?
  *   **YES** → Go to **LEAF D**
  *   **NO** → Go to NODE 5

  **NODE 5:** Should a healthy 3-year-old have a formal vote (cast by a guardian)?
  *   **YES** → Go to **LEAF E**
  *   **NO** → Go to NODE 6

  **NODE 6:** Should a farmer in a neighboring country vote on your domestic carbon tax?
  *   **YES** → Go to **LEAF F**
  *   **NO** → Go to **LEAF G**

  ***

  **THE LEAVES (YOUR POSITION)**

  **LEAF A: Democratic Closure / Co-nationalism**
  *   **View:** The demos is defined by pre-political membership (citizenship/ethnicity).
  *   **Defenders:** Classical nationalists, some realist liberals.

  **LEAF B: Multispecies Democracy**
  *   **View:** Political community extends beyond humans to sentient beings.
  *   **Defenders:** Ecological democrats (e.g., Schlosberg).

  **LEAF C: Trusteeship Model / Intergenerational Justice**
  *   **View:** The present demos is valid, but holds obligations to represent the future.
  *   **Defenders:** Future gen justice theorists (e.g., Ekeli).

  **LEAF D: All-Affected-Interests (Standard)**
  *   **View:** Anyone causally impacted by a decision should have a say.
  *   **Defenders:** Goodin, Whipple.

  **LEAF E: UNNAMED**
  *   **Why empty?** *Incoherent.* Grants vote based on "interest" (like children) but denies it to tourists (Node 4) who also have high stakes. No one defends this specific combo.

  **LEAF F: UNNAMED**
  *   **Why empty?** *Politically toxic.* Grants vote to distant foreigners (Node 6) while denying it to tourists physically present (Node 4). Geographically inconsistent.

  **LEAF G: All-Subjected / Stakeholder Democracy**
  *   **View:** Membership requires being subject to the coercive law or having a fixed stake in the community.
  *   **Defenders:** Lopez-Guerra, Blatter.

  ***

  **NOTE ON PRACTICAL INDISTINGUISHABILITY**
  ⚠️ **Leaf D (All-Affected) vs. Leaf G (All-Subjected):** In a world with strict border controls, almost everyone "affected" is also "subjected." These two views often produce identical institutional designs despite different justifications. You might not be able to seperate them empirically.

  *(also sorry for the typo in the header definiton, catching these late)*
