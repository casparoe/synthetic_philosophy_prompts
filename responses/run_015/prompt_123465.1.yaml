answer: |-
  The denial code flashed on Mara's screen: *44-ALPHA*. Experimental treatment. Not covered. Mrs. Gable would be paying forty thousand dollars for insulin she needed to live, or she would die. Mara knew the code was wrong. She had seen the FDA approval sheet herself. But her keyboard felt heavy, her keys unresponsive to anything but the standard scripts.

  She needed an override. Level 1 agents couldn't issue them.

  She took the stairs. The emergency exit door clicked shut behind her, sealing out the hum of the call center floor. Stairwell B was concrete and cold. She climbed to Floor 2, Supervisors.

  The supervisor, a man with a tie loosened like a noose, didn't look up from his dual monitors. "Submit a ticket," he said.

  "I did. It's urgent. A life is on the line."

  "Ticket says pending review. I can't override a system flag. That's Level 3."

  Mara climbed to Floor 5. Compliance. The carpet was thicker here, swallowing the sound of her heels. The office was quieter, the air conditioned to a sterile chill. The woman behind the desk smiled without showing teeth.

  "We don't make medical determinations," she said, sliding a printed policy across the glass. "We audit the determiners. You need Risk Assessment."

  "This isn't risk," Mara said, her voice tightening. "It's a glitch. I just need someone to type 'yes'."

  "Then you need someone higher than me."

  Floor 10. Director of Operations. The windows here looked out over the city, but the blinds were drawn. The man sitting behind the mahogany desk didn't have a computer. He had a single phone and a stack of folders.

  "You want to break the chain," he said. It wasn't a question.

  "I want to fix a mistake."

  "The chain doesn't make mistakes. It makes calculations. If you want to change the calculation, you have to change the input."

  "I was the input," Mara said. "I entered the data correctly. The system twisted it."

  "Then you need to authorize the correction." He pointed to the elevator bank. "Top floor. There's no one up there. Just the terminal."

  Mara stepped into the elevator. The button for the top floor wasn't marked with a number. It was marked with a symbol: a circle intersecting a square. She pressed it. The ascent was smooth, silent, too fast. Her stomach lurched, not from gravity, but from a sudden sense of vertigo, as if the building were tilting beneath her.

  The doors opened into darkness. There were no walls, only the hum of servers vibrating through the soles of her shoes. In the center of the room stood a single console. A keyboard. A screen.

  Mara approached it. The screen was black, then flickered to life. It displayed the claim file. *Gable, Sarah. Status: Denied.*

  A cursor blinked in a field labeled *Authorization ID*.

  Mara hesitated. She had climbed ten floors to find the person with the power to save Mrs. Gable. She had expected a CEO, a board member, maybe even a government liaison. Instead, there was only the machine.

  She typed her own employee ID.

  *Access Denied. Clearance Level 1.*

  She frowned. She looked at the phone in her hand. She had called up the chain ten times today. Each time, she had been told she lacked clearance. Each time, the request had been logged. She looked back at the screen. A new line of text appeared.

  *Escalation Path Complete. Requester assumes Authority.*

  Mara stared at the blinking cursor. The system didn't have a boss. It had a process. The process required a conflict to resolve. Her attempt to escape the lower level was the key that unlocked the higher one. The hierarchy wasn't a ladder; it was a circuit. She wasn't climbing out of the system; she was closing the loop.

  If she typed the override, she wasn't disobeying the company. She was fulfilling the function of the company. The authority didn't exist above her; it existed because she reached for it.

  Her finger hovered over the key. If she pressed it, she saved Mrs. Gable. But she also validated the machine that had denied her in the first place. She became the hand drawing the hand. The choice was hers, but the capacity to choose had been built by the very walls she tried to climb.

  She thought of Mrs. Gable's voice on the line, thin and terrified. She thought of the supervisor on Floor 2, the woman on Floor 5, the man on Floor 10. They weren't guards keeping her out. They were mirrors reflecting her back up.

  Mara typed her ID again.

  *Access Granted.*

  The screen changed. *Override Accepted. Claim Approved.*

  The hum of the servers shifted pitch, settling into a lower, contented drone. Mara stood alone in the dark room. She waited for someone to congratulate her, or arrest her. Nothing happened. There was no one to report to. There was no one to answer to. She looked at her reflection in the black monitor. She was wearing her Level 1 badge.

  She turned and walked back to the elevator. She pressed the button for Floor 1. As the doors closed, she realized she would have to go back down and enter the data again, from her desk, where the process would begin anew. She would have to be the one to deny it, so she could be the one to fix it.

  ***

  **Philosophical Note for Instructor:**
  This story commits to the "closed loop" option of the tangled hierarchy. The protagonist discovers that the authority she seeks above her is actually generated by her own attempt to reach it, meaning the chooser and the choice are part of the same self-referential system. The fallout is that agency exists, but it is circular: she is free to act, but only within the logic that necessitates her action.
