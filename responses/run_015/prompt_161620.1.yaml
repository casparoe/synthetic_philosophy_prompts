answer: |-
  Here is the triage procedure, reorganized for your analysts. It is designed to be run in order. If a step yields a definitive result, stop there. Do not proceed to the next step unless the previous one returns "inconclusive."

  ### The Contradiction Triage Procedure (v1.0)

  **Input:** One ticket stating: *Rule A derives P (True)* and *Rule B derives P (False)* for *Case ID X*.
  **Goal:** Route to **Close**, **Contain** (Human Flag), or **Repair** (Legal).

  ---

  #### Phase 1: The Sanity Check (Is it noise?)
  *Owner: Analyst | Timebox: 30 mins*

  **Test 1.1: Scope & Date**
  Check the metadata of Rule A and Rule B.
  *   Do the `effective_date` / `expiry_date` overlap for the case month in question?
  *   Do the `program_scope` tags match (e.g., is one rule SNAP-only and the other Cash-only, but the case is applying for both)?
  *   **Stop/Close:** If dates or scopes do not overlap. This is an indexing artifact. Fix the case view, close ticket.

  **Test 1.2: Negation-as-Failure (NAF)**
  Check the derivation of the "False" side.
  *   Does Rule B conclude `NOT P` explicitly? OR does it conclude `P` is false because a prerequisite fact was missing (e.g., `Income_Verified` was null)?
  *   **Stop/Close:** If the "False" is actually "Unknown/Missing." This is a data completeness issue, not a logic conflict. Request missing document, close ticket.

  **Test 1.3: The Rounding/Threshold Edge**
  Check the values triggering the rules.
  *   Is the case value within 1% of the threshold (e.g., limit is $1000, case is $1001)?
  *   **Stop/Close:** If yes, and policy allows administrative disregard. Apply disregard, close ticket.

  **UN-ELIMINABLE JUDGMENT:** If the rule text is vague (e.g., "reasonable cause"), the analyst cannot decide this. **Escalate to Phase 4.**

  ---

  #### Phase 2: Blast Radius (How far does it spread?)
  *Owner: Analyst (with Python/SQL) | Timebox: 1 hour*

  You need to know if this contradiction rots the whole tree or just one leaf. You cannot do this by eye. Use your SQL dependency graph (or a script that parses rule bodies to build one).

  **Test 2.1: The Hub Count**
  Run a query to count how many *other* rules use the disputed predicate `P` in their body (premise).
  *   *Query Logic:* `SELECT count(*) FROM rules WHERE body LIKE '%P%'`
  *   **Threshold:** If `count > 10`, `P` is a **Hub**. If `count < 5`, `P` is a **Leaf**.

  **Test 2.2: Output Proximity**
  Trace the forward chain from `P`. How many "hops" until it hits a final output predicate (e.g., `Benefit_Amount`, `Eligibility_Flag`)?
  *   *Query Logic:* Recursive CTE starting from `P` stopping at `Output_Predicates`.
  *   **Threshold:** If `hops == 1` (directly determines payment/denial), Impact is **Critical**. If `hops > 3`, Impact is **Moderate**.

  **Test 2.3: The Approximation Warning**
  *What this misses:* This assumes static dependencies. It misses cases where `P` is used inside dynamic SQL or stored procedures. It also treats all downstream rules as equal weight; it doesn't know if a downstream rule is "dead code" (never fires).
  *Substitute:* If you lack a dependency table, have the analysts run the contradiction case through the engine with `P` forced True, then forced False, and diff the final output JSON. If the final benefit amount changes, Impact is **Critical**.

  **Decision:**
  *   **Hub + Critical:** Go to Phase 5 (Repair Priority).
  *   **Leaf + Moderate:** Go to Phase 3 (Containment).

  ---

  #### Phase 3: Containment (Can we wall it off?)
  *Owner: Analyst | Timebox: 1 hour*

  **Test 3.1: The Gate**
  Can you add a precondition to Rule A or B that prevents them from firing simultaneously without changing their core logic? (e.g., "If Case_Type = X, ignore Rule A").
  *   **Stop/Contain:** If yes. Modify the rule to add the gate. Set the case status to `Manual_Review`. The system will no longer auto-deny/auto-pay; it flags a human. Close the logic ticket, open a workflow ticket.

  **Test 3.2: The Load-Bearing Check**
  If `P` is a Hub (from Phase 2), containment is likely unsafe. Changing the flow of `P` breaks downstream rules that rely on `P` being consistent.
  *   **Stop/Escalate:** If `P` is a Hub. You cannot contain this without risking silent errors elsewhere. Proceed to Phase 4.

  **UN-ELIMINABLE JUDGMENT:** Determining if a gate is "safe" requires knowing the business intent of downstream rules. If the analyst is unsure, **Escalate.**

  ---

  #### Phase 4: Authority & Policy (Who wins?)
  *Owner: Analyst (Prep) -> Legal (Decision) | Timebox: Variable*

  **Test 4.1: Hierarchy Check**
  Identify the source of Rule A and Rule B.
  *   Hierarchy: Court Order > Statute > Regulation > Policy Memo > Internal Logic.
  *   **Stop/Repair:** If sources differ in hierarchy. The higher source wins. This is not a contradiction; it is an obsolete rule. Draft repair for Legal to sign.

  **Test 4.2: The "True Conflict" Check**
  If sources are equal (e.g., two Regs, or Statute vs. Statute):
  *   Is there a `lex posterior` (newer law)?
  *   Is there a `lex specialis` (more specific law)?
  *   **Stop/Repair:** If yes. Apply the specific/newer rule. Draft repair.

  **Test 4.3: The Dialetheia Boundary**
  If sources are equal, neither is newer, and neither is more specific:
  *   **CRITICAL DISTINCTION:** Do not ask "Is this logically true?" Ask "Does the law require us to honor both claims simultaneously?"
  *   **Stop/Escalate:** If yes. This is a **Policy Impasse**. The system cannot resolve this. The output must be `Manual_Adjudication`. Do not attempt to fix the rule. Escalate to Legal to write a "Tie-Break Policy" (e.g., "In conflicts of equal authority, favor eligibility").

  **UN-ELIMINABLE JUDGMENT:** Legal must decide the hierarchy and the Tie-Break Policy. The procedure cannot automate this.

  ---

  #### Phase 5: Harm Assessment (Prioritization)
  *Owner: Legal | Timebox: Monthly Triage Meeting*

  If you have multiple tickets reaching Phase 5 (Repair/Escalate), you have more than Legal can handle (5/month). Prioritize using this matrix:

  1.  **False Negative (Wrong Denial):** Human safety risk. **Priority 1.**
  2.  **False Positive (Wrong Payment) + Hub:** Audit risk + Systemic rot. **Priority 2.**
  3.  **False Positive (Wrong Payment) + Leaf:** Recoverable error. **Priority 3.**

  **Decision:** Legal selects the top 5. The rest are queued or temporarily contained (Phase 3) until capacity opens.

  ---

  ### Running the Queue: Three Test Cases

  #### Case (a): Income $2 over limit (Overtime inclusion conflict)
  *   **Phase 1:** Real contradiction. Same statute, different interpretation of "income." Not NAF, not date scoped.
  *   **Phase 2:** **Hub.** Income predicates feed almost every eligibility rule. **Critical Impact.**
  *   **Phase 3:** **Not Containable.** You cannot gate "Income" without breaking the whole engine.
  *   **Phase 4:** **Equal Authority.** Same statute. No clear hierarchy.
  *   **Phase 5:** **False Negative Risk.** Denying food over $2.
  *   **Verdict:** **ESCALATE TO LEGAL (Priority 1).**
  *   **Reasoning:** This is a systemic interpretation error on a load-bearing predicate. It will generate hundreds of tickets if not fixed. The harm is denial of essentials.

  #### Case (b): Court Order (Eligible) vs. Reg (Ineligible)
  *   **Phase 1:** Real contradiction.
  *   **Phase 2:** Impact depends on class size, but logic is clear.
  *   **Phase 3:** Not Containable.
  *   **Phase 4:** **Hierarchy Exists.** Court Order > Regulation.
  *   **Verdict:** **REPAIR (Follow Court).**
  *   **Reasoning:** This is not a "true conflict." The Reg is effectively void for this class. This counts toward the 5/month repair limit, but it is a straightforward "disable rule" task. Do not treat as a philosophical dilemma.

  #### Case (c): Felony Warrant (Ineligible) vs. Financial Criteria (Eligible)
  *   **Phase 1:** Real contradiction.
  *   **Phase 2:** **Hub.** You noted it feeds 40 rules, including Recovery. **Critical Impact.**
  *   **Phase 3:** **Not Containable.** It is too embedded.
  *   **Phase 4:** **Equal Authority?** Likely Policy vs. Statute. If Policy says "Warrants = No" but Statute says "Financials Only," Statute wins. If both are Statute, it's a conflict.
  *   **Phase 5:** **False Positive + Hub.** Paying ineligible people + breaking the recovery module.
  *   **Verdict:** **CRITICAL ESCALATION (Priority 2).**
  *   **Reasoning:** You suspected this was urgent. **You are right.** The "harmless legacy" assumption is false because of the **Blast Radius**. Even if the denial rate is low, the fact that it corrupts the *Overpayment-Recovery* module means every payment made under this contradiction is potentially un-recoverable. This creates audit liability. It must be fixed before Case (a) if Legal views audit risk as existential, otherwise immediately after.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It cannot solve the "Value Trade-off."**
      *   The procedure identifies if a case is "Wrong Denial" vs. "Wrong Payment." It cannot tell you which is worse. That is a political/value decision Legal must make.
      *   *Substitute:* Force Legal to sign a "Harm Priority Memo" once. (e.g., "False Negatives always trump False Positives"). If they won't sign it, you cannot prioritize Phase 5.

  2.  **It cannot perfectly measure Propagation (Phase 2).**
      *   *The Gap:* SQL forward chainers often have implicit dependencies (e.g., Rule A sets a flag that Rule B reads, but the dependency isn't in a metadata table).
      *   *The Substitute:* The "Diff the Output" method mentioned in Test 2.3. Run the case twice (force True, force False). If the final dollar amount changes, treat it as Critical.
      *   *What it gets wrong:* It misses side effects. Rule A might not change the payment amount but might trigger a "Fraud Investigation" flag. The diff won't catch that unless you diff the *entire* case state, not just the payment.

  3.  **It cannot distinguish "Bug" from "Feature" in Legacy Code.**
      *   In Case (c), the rule might be there because a developer hard-coded it 10 years ago without legal basis. The procedure treats all rules as equally valid until Phase 4.
      *   *The Substitute:* Add a "Rule Age/Author" check in Phase 1. If a rule has no cited legal authority in the comments, mark it "Suspect." This helps Legal prioritize repairs.

  4.  **It does not solve the Capacity Bottleneck.**
      *   If you find 20 "Critical Escalations" and Legal can only do 5, the queue still grows.
      *   *The Substitute:* **Containment as a Dam.** For the 15 you can't repair, apply Phase 3 (Manual Flag) aggressively. Stop the auto-denials. It increases manual workload for caseworkers, but it stops the legal backlog from causing wrongful denials. You are trading *analyst* time for *caseworker* time. Given your constraints, this is the only lever you have.

  ### Summary for the Analysts
  1.  **Close** the noise (Dates, NAF, Rounding).
  2.  **Measure** the blast (SQL dependency or Output Diff).
  3.  **Contain** the leaves (Flag for human, don't fix rule).
  4.  **Escalate** the hubs (Legal must decide).
  5.  **Prioritize** Denials over Payments (unless Audit says otherwise).

  **Monday Morning Instruction:** Print this. Tape it to the monitor. Run Case (c) first. It is the bomb.
