answer: |-
  1. "Where I'm actually exposed"

  Your primary exposure lies in the metaphysical definition of property itself. You treat property as essentially rivalrous, requiring subtraction for a violation to occur. This is a physicalist intuition, not a conceptual necessity. In law, property is a bundle of rights, often non-rivalrous. An easement allows someone to cross your land without subtracting from your soil; violating it is a property wrong, not merely a tort. If property can regulate use without consumption, your ontological barrier dissolves. The divergence point is independent invention. If ideas are property, boundaries exist regardless of how you arrived there, like land surveying. If not, independent discovery is free. Your view predicts no liability for independent inventors; the opposing view allows it. Furthermore, consider the dead inventor. If I publish your unpublished notes after you die, you claim no property is violated because the 'idea' wasn't owned. The standard view holds the estate owns the control. If you cannot explain why the estate controls the tokens without controlling the pattern those tokens instantiate, you are relying on the expression distinction you claim is exhaustive. Finally, if 'property' is just a label for a normative bundle of rights, your claim that ideas 'cannot' be owned collapses into 'should not'. You are making a moral argument disguised as metaphysics, which leaves you exposed to anyone who defines property functionally rather than physically. To falsify you, one need only show a coherent system of non-rivalrous rights that functions identically to property. If such a system is conceptually possible, your ontological claim is false. If patterns can be rights-bearing objects, you lose. Additionally, your reliance on 'market position' as the real object is shaky. If I copy your drug exactly, undercutting you, you say I harmed your market position. But if market position is protectable property, then IP exists under another name. You must prove market position is fundamentally different in kind, not just label, from the exclusive right to exploit an invention. If the economic effect is identical, the distinction is semantic.

  2. "Awkward but survivable"

  Empirical consequences are secondary but awkward. If innovation stalls without statutory monopolies, that's a cost, not a refutation. However, the administrative burden is significant. Relying on contract and confidence for every transfer scales poorly compared to statutory rights. It makes scaling difficult for small actors who cannot afford complex non-disclosure agreements. But the shift to privacy and contract creates a class barrier. Only the wealthy can protect 'ideas' via security and lawyers; the poor rely on statutory IP. This egalitarian concern is awkward for a view claiming moral clarity. It suggests your ontology has distributive consequences you might find unpalatable. Still, these are practical frictions, not philosophical defeaters. They don't prove ideas are property, only that treating them as such is convenient. Litigation over 'confidence' versus 'public knowledge' would increase. You survive, but the system is messier.

  3. "What I'd concede vs. what I'd swat away"

  Concede the verbal collapse. If 'property' just means 'rights we assign', then saying ideas 'can't' be property is just saying 'we shouldn't assign rights'. That's a semantic victory, not a metaphysical one. You must argue that rivalry is a necessary condition for that bundle. If you can't, you're just arguing policy. The trade secret point is also dangerous. If I independently derive your secret, you have no claim. But if I steal it, you do. The difference isn't subtraction, it's means. Your view handles this via 'confidence', but that's fragile. Swat away the free-rider intuition. Ten years labour doesn't grant ownership of the *pattern*, only the *tokens* produced. Fairness doesn't entail property. The labourer deserves reward, but not necessarily exclusion. Swat away the incentive argument; it's contingent, not necessary. The most painful concession is that your 'market position' argument smuggles IP back in. If you grant a right to prevent market undercutting via copying, you have granted a patent by another name. You must rigorously separate unfair competition from property rights. If you fail, you haven't abolished IP, you've just renamed it.

  4. "Is the subtraction test rigged?"

  Yes, it's rigged. It defines 'taking' as 'depriving'. But property rights often regulate *use*, not deprivation. If I park on your drive, I haven't subtracted from your land, but I've violated your property. The concept link scenario isolates privacy, but real IP cases involve commercial exploitation, not mind-reading. By focusing on the mystical transfer, you ignore the mundane commercial replication which doesn't fit 'privacy'. You're solving the hard case (telepathy) to dodge the easy case (photocopying). The test excludes non-rivalrous property by fiat. It assumes that because the idea remains with me, I haven't been wronged in property. But property is often about exclusivity, not possession. I can possess my land exclusively without losing it if you trespass. Your test conflates theft with trespass. IP is more like trespass than theft. You rig the test to match theft, then declare IP impossible. A better test asks: can rights attach to patterns? If yes, your subtraction test is irrelevant. We accept non-rivalrous exclusivity with easements. If you accept those as property, you must explain why ideas are categorically different. If you say 'patterns can't be owned', you need a metaphysics of patterns that excludes them from rights-bearing objects. Otherwise, it's an intuition pump.

  5. "Verdict"

  You have a robust normative position masked as metaphysics. The subtraction test is intuitive but legally naive. You haven't proven ideas *can't* be owned, only that they shouldn't be under a rivalry-based definition. It's a strong ethical stance, but the ontological claim is unsustainable. You qualify the view to avoid falsification by shifting grounds from property to privacy when pressed. Not fatal, but admits the core claim is weaker. Safe from empirical refutation, but only by making the claim conceptual. That is fine for ethics, but don't call it metaphysics.
