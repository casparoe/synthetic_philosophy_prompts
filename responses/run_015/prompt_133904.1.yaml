  Based on the five data points you provided, your roommate is operating with a highly specific reconstruction of Leibnizian ethics that balances **metaphysical perfectionism** with **rational voluntarism**. She is not just repeating the "charity of the wise" slogan; she is applying a structured decision procedure.

  Here is the breakdown of the three competing frameworks that fit your existing dataset, the prediction for the Researcher scenario, and the single "Crucial Experiment" case to definitively isolate her rule.

  ### The Three Competing Frameworks

  All three rules fit your first five scenarios (Merchant, Soldier, Ruler, Logician, Fearful) but diverge on the *source* of moral worth.

  **1. Rational Universal Perfectionism (RUP)**
  *   **The Rule:** An act has full moral worth if it is guided by reason *and* maximizes the total perfection/happiness of all minds (Universal Good).
  *   **Key Feature:** Objective outcome trumps subjective feeling. "Guilt" is an irrational passion; if the calculation is correct, the guilt is an error in the agent's perception, not a flaw in the act's worth.
  *   **Fit:** Explains the **Merchant** (Max Good + Reason), **Ruler** (Max Good overrides local injustice), and **Logician** (Good, but fails Universal scope).
  *   **Likely Status:** This is your roommate's probable view.

  **2. Volitional Harmony Ethics (VHE)**
  *   **The Rule:** Moral worth depends on the internal harmony of the agent's will with eternal truths. The agent must *feel* the rational necessity of the act.
  *   **Key Feature:** Subjective state matters. "Guilt" or emotional turmoil indicates the will is not fully aligned with the intellect, reducing moral worth even if the outcome is good.
  *   **Fit:** Explains the **Soldier** (Disharmonious/Instinctive), **Fearful** (Disharmonious/Passion-driven), and **Merchant** (Harmonious will). It treats the **Ruler** as "Required" only if the Ruler intellectually accepts the necessity (achieving harmony).
  *   **Likely Status:** The strongest competitor.

  **3. Threshold Compossibility (TC)**
  *   **The Rule:** Promote the good, but never violate a monad's rights (justice) *unless* failing to do so makes the Best Possible World impossible (Catastrophe Threshold).
  *   **Key Feature:** Rights are absolute constraints unless a "Civil War" level catastrophe is imminent.
  *   **Fit:** Explains the **Ruler** (Civil war = Threshold met) and **Logician** (No rights violated, but no duty fulfilled). It treats the **Merchant** as "Supererogatory" (beyond duty) rather than strictly required.
  *   **Likely Status:** The "Deontological" alternative.

  ---

  ### Prediction: The Researcher Scenario

  **Scenario:** Researcher delays cure 2 years to prevent black-market harm. Rational calculation (Greatest Good). **Feeling:** Crushing personal guilt.

  *   **If she holds RUP (Rational Universal Perfectionism):**
      *   **Verdict:** **Full Moral Worth.**
      *   **Reasoning:** The calculation maximizes universal perfection. The guilt is a "confused perception" (a passion) that does not negate the objective wisdom of the act. The motive is rational love of the good, even if accompanied by emotional noise.
  *   **If she holds VHE (Volitional Harmony):**
      *   **Verdict:** **Partial/Flawed Moral Worth.**
      *   **Reasoning:** A truly "wise" monad would understand the metaphysical necessity of the delay and feel peace. Crushing guilt indicates her will is not fully aligned with her intellect; she is acting rightly but imperfectly.
  *   **If she holds TC (Threshold Compossibility):**
      *   **Verdict:** **Wrong (or Zero Worth).**
      *   **Reasoning:** Delaying a cure violates the right to health/life. Unless the black-market harm amounts to a "kingdom-destroying catastrophe" (like the Ruler's civil war), the threshold is not met. Rights violations are not permitted for mere "harm reduction."

  ---

  ### The Crucial Experiment

  To definitively split these rules apart for your dataset, you need a case that isolates **Maximization** from **Harmony** and **Rights**. The Researcher case is good, but the "Catastrophe Threshold" is ambiguous (is black-market harm a catastrophe?).

  Use this specific hypothetical case to force a divergence:

  **The Case: "The Blissful Non-Maximizer"**

  > **Scenario:** An agent can either (A) Donate \$1 million to save 100 strangers, or (B) Keep the money to fund their own philosophical research which brings them perfect intellectual peace but saves no one. The agent chooses (B). They feel **zero guilt** and have a perfectly harmonious, rational understanding that their own perfection is a valid end.
  >
  > **Question:** Does this agent have *Full Moral Worth*?

  **How the Rules Split:**

  1.  **RUP (Roommate's Likely View):** **NO.**
      *   **Why:** The agent failed to maximize *Universal* Perfection. The Logician case established that self-perfection alone is "not perfect moral worth." Saving 100 lives creates more total perfection than one researcher's peace.
  2.  **VHE (Volitional Harmony):** **YES.**
      *   **Why:** The agent's will is in perfect harmony with their reason (no guilt, rational acceptance). The internal state of the monad is the primary locus of worth.
  3.  **TC (Threshold Compossibility):** **YES.**
      *   **Why:** The agent violated no rights. Charity is voluntary. They are not *required* to sacrifice their own perfection for others unless a catastrophe is imminent.

  **Dataset Instruction:**
  If your roommate says **"No, it's imperfect because they didn't help the 100,"** she is a **Rational Universal Perfectionist**. The guilt in the Researcher case is irrelevant noise; the failure to maximize in the Blissful case is the real sin.

  If she says **"Yes, it's good because they are harmonious,"** she is a **Volitional Harmonist**. The Researcher's guilt was the actual disqualifier, not the outcome.

  If she says **"Yes, it's allowed because rights weren't violated,"** she is a **Threshold Compossibilist**. The Ruler case was the exception, not the rule.
