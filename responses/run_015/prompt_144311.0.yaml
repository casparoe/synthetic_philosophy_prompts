  **The Case:** Two freelance contractors who need to exchange physical files every Friday begin meeting at a specific cafe. There is no prior agreement, no moral belief that they *ought* to meet there, and no gossip or sanction if one chooses a different location. However, both prefer to meet at the same place (any place) rather than miss each other, and they have spontaneously settled on the Cafe because it is salient.

