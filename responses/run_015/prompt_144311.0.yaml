answer: |-
  Based on your colleague's past verdicts and her self-identification as a Lewisian, here is an analysis of the definitions she is likely employing, their application to the snow case, and a proposal to test her commitment.

  ### Three Candidate Rules for Convention

  1.  **The Coordination Rule (Strict Lewis):** A regularity is a convention only if it solves a recurrent *coordination problem*. This requires **interdependent preferences**: each agent prefers to conform *on the condition that* others conform (e.g., I step left *because* you step left). There must also be an alternative regularity that could have solved the problem, and the conformity must be common knowledge.
      *   *Fit:* Explains all her "Convention" verdicts (walkers, handshakes, language, queueing, red lights) as coordination equilibria. Explains "Stairs" (no alternative) and "Driving Alone" (Prisoner's Dilemma structure; preferences are not conditional on matching) as "Not a convention."

  2.  **The Normative Rule (Social Norms):** A regularity is a convention if there is a shared empirical and normative expectation. Everyone conforms, everyone believes everyone else conforms, and everyone believes everyone else thinks one *ought* to conform, with sanctions (gossip, fines, disapproval) for deviation.
      *   *Fit:* Explains "Red Lights" (fines), "Snow" (gossip), and "Handshakes" (social awkwardness). Explains "Driving Alone" as "Not a convention" (prompt specifies "nobody disapproves"). Struggles slightly with "Walkers" unless one assumes implicit sanctions for collision, but generally fits the data.

  3.  **The Historical Rule (Path Dependence):** A regularity is a convention if it originated as a coordination equilibrium and persists due to inertia or tradition, even if current payoffs no longer require interdependence.
      *   *Fit:* Explains the "Snow" case perfectly (originated as bus-stop coordination). Explains other cases assuming they have history. Explains "Stairs" as "Not a convention" (originated in necessity, not coordination).

  ### Predictions for the Snow Case

  *   **The Coordination Rule:** **Not a convention.** The prompt explicitly states, "Nothing about anyone's clearing depends on anyone else's." The condition of interdependent preferences (I clear *because* you clear) is absent. It is currently a set of independent actions sustained by norms, not a coordination equilibrium.
  *   **The Normative Rule:** **Convention.** There is a shared "ought," common knowledge of this belief, and sanctions (gossip) for non-compliance.
  *   **The Historical Rule:** **Convention.** The practice dates back thirty years to a time when it was a genuine coordination problem.

  ### Best Guess and Reasoning

  **Verdict:** **Not a convention.**

  **Reasoning:** Your colleague identifies as a **Lewisian**. While David Lewis acknowledged that conventions often acquire normative force, his definition rests fundamentally on the *game structure*—specifically, that a convention is a solution to a coordination problem. The crucial evidence is her verdict on the "Driving Alone" case. She ruled it "Not a convention" because the drivers' preferences were not conditional on others' actions (a Prisoner's Dilemma structure). The Snow case is structurally similar regarding preferences: agents act for independent reasons (their own doorstep) rather than conditional ones (matching others). The presence of gossip makes it a *Social Norm*, but a strict Lewisian distinguishes Norms (enforced by sanctions/oughts) from Conventions (enforced by conditional preferences). To remain consistent with her rejection of the "Driving Alone" case, she must reject the Snow case as a convention, despite the history and gossip.

  ### Distinguishing Case

