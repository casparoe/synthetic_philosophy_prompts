answer: |-
  Here is a complete, runnable plan for your session. I've designed this to be tight, high-energy, and specifically tuned for an engineering mindset. We are going to treat the voting system as a distributed consensus algorithm and the Gibbard-Satterthwaite (GS) theorem as the "CAP Theorem of Social Choice."

  ### Session Title: The Unbreakable Box
  **Goal:** Prove via experience that a deterministic, non-dictatorial voting system with 3+ options cannot be strategy-proof.
  **Time:** 60 Minutes (Hard Stop)
  **Materials:** Whiteboard, markers, sticky notes (optional).

  ---

  ### Part 1: The Setup (0:00 – 0:10)

  **The Hook (2 mins)**
  Stand at the whiteboard. Do not introduce yourself or the theorem yet.
  *Say:* "We're going to spend the next 40 minutes trying to solve a mechanism design problem. You are the architects. I am the adversary. Your goal is to build a function `vote(profile) -> winner` that is unexploitable. My goal is to find an input where a user benefits from lying to the function."

  **The Constraints (3 mins)**
  Write these clearly on the board. These map directly to the theorem's conditions.
  1.  **3 Options:** A, B, C. (No merging options).
  2.  **Deterministic:** Same input always = same output. (No coin flips).
  3.  **Surjective:** Any of A, B, or C must be *capable* of winning. (You can't just ban C).
  4.  **Non-Dictatorial:** The output cannot simply be "Whatever Voter 1 wants."
  5.  **Strategy-Proof:** For any voter, submitting their *true* preference must always be their best move, regardless of what others do.

  **The Profile (5 mins)**
  To keep this runnable in 60 minutes, we cannot simulate 15 individual voters. We will simulate **3 Voting Blocs** of 5 people each. This reduces the complexity while keeping the logic intact.
  Assign the room into three groups (Left, Center, Right). Give each group a fixed preference order. Write this on the board:

  *   **Bloc 1 (Left):** A > B > C
  *   **Bloc 2 (Center):** B > C > A
  *   **Bloc 3 (Right):** C > A > B

  *Say:* "This is a Condorcet Cycle. It's the 'Hello World' of voting paradoxes. Everyone prefers their top choice, but there is no majority winner. Your system must handle this."

  ---

  ### Part 2: The Design Loop (0:10 – 0:35)

  **Round 1: The Naive Implementation (10 mins)**
  *Ask:* "What's the simplest API we can ship?"
  *They will say:* Plurality (First-Past-The-Post). Each bloc votes for their #1.
  *Execute:*
  *   Bloc 1 votes A.
  *   Bloc 2 votes B.
  *   Bloc 3 votes C.
  *   Result: 3-way Tie.
  *Ask:* "How do you break ties?"
  *They will suggest:* Random, or default to 'A', or runoff.
  *Pick one:* Let's say "Tie breaks to A."
  *The Attack:* Turn to **Bloc 3**.
  *Say:* "Bloc 3, you prefer C > A > B. Right now, A is winning. If you lie and vote for B instead of C, B gets 2 votes (Bloc 2 & 3) and A gets 1. B wins. You prefer B over A. So lying helped you."
  *Result:* **System Exploited.** Plurality is not strategy-proof.

  **Round 2: The Patch (15 mins)**
  *Say:* "Okay, Plurality is buggy. Patch it. Give me a new function."
  *Facilitator Note:* They will likely suggest **Instant Runoff (IRV)** or **Borda Count**. Let them pick one, but guide them if they stall.
  *Scenario A (Borda):* A=2pts, B=1pt, C=0pt.
  *   Bloc 1: A(2), B(1), C(0)
  *   Bloc 2: B(2), C(1), A(0)
  *   Bloc 3: C(2), A(1), B(0)
  *   Totals: A=3, B=3, C=3. Tie again.
  *   *The Attack:* Tell Bloc 1: "If you rank B last (A > C > B) instead of truthfully (A > B > C), you give B 0 points. A wins outright. You buried your competition."
  *Scenario B (IRV/Runoff):*
  *   Round 1: A, B, C all have 1 vote. Eliminate someone (say C).
  *   Round 2: C's votes go to A (since C > A > B). A wins 2-1.
  *   *The Attack:* Tell Bloc 2 (B > C > A). "You know Bloc 3 prefers C. If you lie and rank C > B > A, C survives round 1. In the runoff, C beats A (because Bloc 2 & 3 prefer C over A). You prefer C over A. So lying helped you."

  *Key Move:* Every time they propose a fix, you (the Adversary) look for a voter who can change the outcome to a *more preferred* option by submitting a ballot that does not match their true ranking.
  *Time Check:* At 0:30, stop them. Even if they think they have a winner.

  **Round 3: The Trap (5 mins)**
  *Say:* "You're struggling to stop the exploits without breaking the other constraints. Let's look at the only ways we actually stopped me in the last rounds."
  *Write on board:*
  1.  **Restrict Options:** "If we remove C, Bloc 1 (A>B) and Bloc 2 (B>A) creates a majority. No cycles. But that violates Constraint #1."
  2.  **Restrict Power:** "If we say 'Bloc 1 always decides', no one else has an incentive to lie. Their vote doesn't matter. But that violates Constraint #4 (Dictatorship)."

  *Say:* "You have 60 seconds. Convince me there is a third path."
  *They won't find one.*
  *Stop the activity.*

  ---

  ### Part 3: The Debrief & Theorem (0:35 – 0:60)

  This is where you convert the frustration into theory. Do not rush this.

  **1. Map the Activity to the Theorem (10 mins)**
  Draw a line down the whiteboard. Left side: "Our Activity." Right side: "Gibbard-Satterthwaite Theorem."

  *   **Activity:** "We had 3 options (A, B, C)."
      *   **Theorem:** $|Outcomes| \ge 3$.
  *   **Activity:** "We said any option *could* win (Surjective)."
      *   **Theorem:** Range of function is all outcomes.
  *   **Activity:** "We agreed no single Bloc should rule."
      *   **Theorem:** Non-Dictatorial.
  *   **Activity:** "We wanted voting truthfully to be the best move."
      *   **Theorem:** Strategy-Proof (Dominant Strategy Incentive Compatible).
  *   **Activity:** "We failed."
      *   **Theorem:** **Impossible.** No such system exists.

  *Say:* "This isn't a bug in your design. It's a bug in reality. The GS Theorem (1973) proves that for *any* deterministic voting system with 3+ options, either one person is a dictator, or there are scenarios where lying is the rational choice."

  **2. Handle the Objections (10 mins)**
  Engineers will immediately look for edge cases. Pre-empt them with this script.

  *   **Objection:** "What about Approval Voting? Or Score Voting?"
      *   **Response:** "Great catch. GS assumes **ordinal** preferences (rankings). Approval/Score are **cardinal** (intensity of preference). GS doesn't apply there. *However*, cardinal systems introduce other problems (like scale normalization and strategic max/min scoring). There is no free lunch, just different trade-offs."
  *   **Objection:** "What if we use randomness? (Random Ballot)"
      *   **Response:** "GS assumes **deterministic** outcomes. Randomized systems *can* be strategy-proof in expectation, but you lose the guarantee of the 'will of the people' on any single run. You're trading manipulability for unpredictability."
  *   **Objection:** "People aren't rational. They won't lie."
      *   **Response:** "Mechanism design isn't about psychology; it's about incentives. If the system *allows* lying to help, a bad actor (or a script) *will* exploit it. We build systems for the worst-case input."
  *   **Objection:** "Real preferences aren't cycles. They're single-peaked."
      *   **Response:** "Correct. If preferences are 'single-peaked' (e.g., left-to-right political spectrum), Black's Median Voter Theorem says we *are* safe. GS assumes **Unrestricted Domain**—it must work even if preferences are weird cycles. If you can guarantee single-peakedness, you escape the theorem."

  **3. The Gap & The Bridge (5 mins)**
  Be honest about what the activity didn't do.
  *Say:* "In this room, we only tested *one* preference profile (the Cycle). We didn't prove it for *all* profiles. The formal proof uses induction on the number of voters and options to show that if a system is strategy-proof, it *must* be a dictator. We just felt the friction of that truth. We hit the wall; the theorem proves the wall goes on forever."

  **4. Closing Thought (Final 5 mins)**
  *Say:* "So why do we vote? If it's all manipulable?"
  *   **Legitimacy:** Even if manipulable, it's better than violence.
  *   **Information Aggregation:** It reveals *some* signal, even if noisy.
  *   **The Engineering Takeaway:** "When you design systems with multiple agents (microservices, blockchain, org structure), remember the CAP theorem of social choice. You cannot have Fairness, Strategy-Proofness, and Freedom of Choice simultaneously. You must consciously decide which constraint to relax."

  ---

  ### Predictable Failure Modes & Fixes

  **1. The "Tie-Breaking" Rabbit Hole**
  *   **Risk:** They spend 15 minutes debating how to break a 3-way tie (coin flip, seniority, etc.).
  *   **Fix:** As facilitator, assert authority early. "For the sake of the experiment, ties default to Option A. We are testing the voting logic, not the tie-breaker. If the tie-breaker creates a manipulation vector, the system is still broken."

  **2. The "Compromise" Solution**
  *   **Risk:** Someone suggests "If there's a cycle, we choose a compromise option D."
  *   **Fix:** Point to Constraint #1. "The output space is {A, B, C}. You cannot introduce D. This mirrors reality: you can't vote for 'Someone Else' on a ballot."

  **3. The "Psychology" Defense**
  *   **Risk:** "In my team, we trust each other. We wouldn't lie."
  *   **Fix:** "That works for 15 people. Does it work for 15 million? Does it work when a competitor enters the ecosystem? We are designing protocols, not relying on norms."

  **4. Time Overrun**
  *   **Risk:** The "Design Loop" drags on.
  *   **Fix:** Wear a visible watch. At 0:35, regardless of where you are, say: "Time's up. We have to freeze the design. Let's look at what we have." The abrupt stop actually reinforces the "Impossibility" feeling—they ran out of time *and* solutions.

  ### Facilitator Cheat Sheet (Keep this in hand)

  *   **If they propose Borda Count:** Remind them of "Burying" (ranking a strong competitor last).
  *   **If they propose IRV:** Remind them of "Push-over" (eliminating a weak candidate to help a strong one).
  *   **If they propose Dictatorship:** Acknowledge it works! "Yes, if Voter 1 decides, no one else can manipulate. But we ruled that out as unfair."
  *   **If they propose 2 Options:** Acknowledge it works! "Yes, May's Theorem says 2 options is fine. But life rarely gives us binary choices."

  ### Why This Works for Engineers
  1.  **API Metaphor:** It treats voting as a function with inputs/outputs, not a civic duty.
  2.  **Adversarial Mindset:** It frames manipulation as "finding a bug," which engineers love.
  3.  **No Jargon:** You don't need to know what "Pareto Efficiency" is to see that lying wins.
  4.  **Concrete vs. Abstract:** They struggle with the concrete problem first, so the abstract theorem feels like a relief (an explanation), not a lecture.

  Good luck. The moment they realize they *want* to lie to win your game is the moment the theorem lands. Let that happen.
