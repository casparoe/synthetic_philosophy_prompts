prompt: |-
  I run a sort of informal reading group at my company — we're about 15 engineers, and every couple weeks someone picks a paper or a topic that's at the intersection of CS and something else (economics, philosophy, whatever) and leads a session. Next month its my turn and I want to do something on voting systems and the Gibbard-Satterthwaite theorem. The basic idea — that any voting system with three or more options that isn't a dictatorship can be strategically manipulated — is one of those results that sounds dry on paper but is actually kind of devastating when you really sit with it.

  Here's what I want: instead of me standing up front and explaining the theorem and then everyone nodding and moving on, I want to design an activity where the group *feels* the impossibility before they see the formal statement. Like, I want them to try to design a strategy-proof voting system themselves, run it against some scenarios, and discover that no matter what they do, someone can always manipulate it. The punchline should hit them before I name the theorem.

  The group is about 15 engineers, I've got 60 minutes, and these are people who are comfortable with formal reasoning but have zero philosophy or social choice background. We can use a whiteboard, slips of paper, whatever. No real money but I can do something with points or rankings.

  A few constraints:
  - I want the activity to be structured enough that we don't waste time flailing, but open enough that the discovery feels genuine.
  - The debrief is crucial: I need you to map what happened in the activity to the formal parts of the theorem (the three-or-more-outcomes condition, non-dictatorship, strategy-proofness) and tell me what to say when someone inevitably asks "but what about approval voting?" or "can't we just use ranked pairs?"
  - Be honest about what the activity *can't* capture. I know a 60-minute game with 15 people isn't going to prove the theorem — so what's the gap, and how do I bridge it in the debrief without just lecturing?
  - Tell me what will predictably go wrong the first time I run it and how to handle it.

  Take a definite position on the design — don't give me three options and make me pick. I want your best shot at a runnable plan, with rules, a timeline, and a debrief script. Think very carefully before answering, and respond in the style of an expert who's actually run things like this before.
