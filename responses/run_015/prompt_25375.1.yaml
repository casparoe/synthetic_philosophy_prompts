          2.  Propose a rule.
          3.  Test for manipulation (I will provide counter-examples).
          4.  Iterate.

      *   *Actually, a specific scenario works best for engineers.*
          Let's use a "Committee Decision" scenario. 3 Candidates (X, Y, Z). 3 Voters (Alice, Bob, Charlie).
          Preferences are public knowledge (common knowledge assumption simplifies the game for 60 mins).
          Alice: X > Y > Z
