      *   *Step 1:* Try Plurality. (Tie or manipulable).
      *   *Step 2:* Try to fix it.
      *   *Step 3:* Realize the constraints.

      *   *Decision:* I will structure it as **"The Mechanism Design Challenge."**
          *   Divide into 3 groups of 5.
