      *   *Wait, 60 mins is very short for 3 groups to design functions.*
          Let's simplify. One big group. I facilitate the design on the whiteboard. They shout out rules. I act as the "Adversary" checking for strategy.
          *   Why?* It keeps the pace tight. 15 engineers debating one rule is faster than 3 groups building 3 rules.
          *   *Role:* I am the "System Tester." They are the "Architects."
          *   *Goal:* Build a function $f: \{Preferences\}^3 \rightarrow \{A, B, C\}$ that is Strategy-Proof.

  5.  **Addressing the Debrief & Objections:**
      *   *Mapping:*
          *   "We couldn't stop lying" -> Strategy-Proofness.
          *   "We had to let Alice decide" -> Dictatorship.
          *   "We removed Option C" -> Range/2 Options.
      *   *Objections:*
