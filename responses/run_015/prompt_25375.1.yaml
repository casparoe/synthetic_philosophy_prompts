          *   Phase 3: The Patch (Trying to fix it).
          *   Phase 4: The Trap (Realizing the only safe paths are Dictatorship or 2 Options).
      *   *Why:* It mirrors the historical development of social choice theory and keeps the energy high. It forces them to play the role of the mechanism designer *and* the strategic voter.

  4.  **Drafting the Plan (Iterative Refinement):**

      *   *Timeline:* 60 mins is tight.
          *   Intro: 5 mins.
