      *   *Idea 2: Mechanism Design Game.* Split into groups. Each group designs a rule. Then we test it. *Problem:* 60 mins is tight for design + test + debrief.
      *   *Idea 3: The "Fix-It" Loop.* Start with a simple system (Plurality). Show it's manipulable. Ask them to fix it. Move to Borda/IRV. Show *those* are manipulable. Push them toward Dictatorship or 2-options as the only escapes.
      *   *Selected Approach:* **The "Impossibility Lab."**
