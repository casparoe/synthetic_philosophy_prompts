  To: Critical Care Allocation Committee
  From: Philosopher Member
  Re: Ventilation Unit Protocol Reauthorization

  **Decision:** Reauthorize with Conditions.
  **Conditions:** 1. Mandatory admission consent explicitly detailing the risk of withdrawal-induced death. 2. Fixed review date: 12 months from implementation.

  **Reasoning:**
  The committee splits on whether the separateness-of-persons objection constrains each distribution or the shape of a whole life. In this specific structure, it constrains the shape of a whole life.

  Standard aggregation sacrifices one person for others. Here, the protocol functions as a mutual insurance scheme within a fixed census. Because clinical status fluctuates, every resident occupies both the "donor" and "recipient" role over time. The ex ante benefit is not statistical anonymity; it is a guaranteed expected gain for every identified individual. To reject the protocol is to deny each resident the net survival benefit they would rationally choose for themselves. The fixed census ensures no external party is exploited; the risk is internalized by all.

  The opposing view must be stated strongly. Its defenders do not rely on uncertainty; they know who dies. They argue that moral constraints attach to actions, not life-narratives. A right not to be killed at $t_1$ is categorical; it cannot be compensated by being saved at $t_2$. If the protocol kills you on Tuesday, it violates your sovereignty over your body at that moment. Later benefits accrue to a survivor, but the violation at the moment of withdrawal remains unaddressed. They contend that persons are not vessels for utility over time, but agents entitled to protection at every decision point.

  This argument fails here because it treats the residents as passive subjects rather than participants in a cooperative practice. The "loss" at $t_1$ is a risk uptake authorized by the expectation of gain at $t_2$. Since the same persisting person endures both, and gains overall, the constraint applies to the net outcome. To forbid the transfer is to prioritize the sanctity of a single moment over the survival of the person who lives through time. The structure of reciprocal risk transforms the act from sacrifice to investment.

  However, the gravity of immediate death requires explicit authorization. We cannot presume consent to the risk structure. The condition of mandatory consent respects the agency the opposition values, while the reauthorization secures the survival the aggregative view demands.

  **Admission Disclosure:**
  Residents and proxies must be told: "Care hours are allocated weekly to maximize total survival. This may require withdrawing hours from you even if it risks immediate death. However, over six months, this protocol offers you the highest expected survival time."

  This honors the separateness of persons by ensuring voluntary entry into the scheme while permitting the aggregative benefits that sustain them all.
