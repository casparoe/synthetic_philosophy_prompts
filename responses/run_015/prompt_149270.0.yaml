      *   **User's Suspicion:** The friend is sliding claims together, overstating conclusions (especially on zombies/materialism), and misrepresenting the debate.
      *   **Task:** Evaluate the accuracy of the friend's summary. Separate accurate points, common simplifications, and genuine misrepresentations. Specifically address: conceivability as simulation, the zombie argument's status, and the dismissal of modal empiricism.

  2.  **Deconstruct the Friend's Claims vs. Philosophical Reality:**

