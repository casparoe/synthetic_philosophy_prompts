          *   *Reality:* This is the core of Modal Rationalism (Chalmers). However, the link is highly contested. Kripke's *Naming and Necessity* is the big hurdle here (Water = H2O is necessary, but conceivable otherwise). Rationalists distinguish primary vs. secondary intensions to handle this.
          *   *Verdict:* Accurate as a statement of *what rationalists believe*, but presented as established fact rather than a contested thesis.

      *   *Claim 3: Prima Facie vs. Ideal Conceivability.*
          *   *Reality:* This is a standard distinction (Chalmers). Ideal conceivability entails possibility; prima facie does not.
