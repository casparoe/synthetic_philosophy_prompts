  There is no hidden tax, no sudden **cost**.
  I open up the partition's narrow **door**
  to bank the work inside my growing **memory**.
  I profit from the state of every **bit**.
  I do not need to wipe or to **erase**
  to make the gradient hold against the **heat**.

  Against the gradient hold against the **heat**.
  The ledger stays positive, ignoring **cost**.
  But space is finite if I never **erase**
  nothing, and the partition's narrow **door**
  leads to a wall of full and packed **memory**.
