answer: |-
  ### The Divided Stream: Split-Brain Phenomena Through the Lens of *Anatta*

  The split-brain studies of Sperry and Gazzaniga provide a unique empirical boundary condition for theories of personal identity. By surgically severing the corpus callosum, these cases uncoupled the integration of the cerebral hemispheres, resulting in behaviors suggesting dual loci of intention and awareness. When analyzed through the Buddhist doctrine of *anatta* (no-self), these findings do not merely challenge the notion of a unitary soul; they empirically mirror the Buddhist deconstruction of the person as a conventional designation (*pannatti*) imposed upon a stream of impermanent aggregates (*skandhas*).

  This analysis maps the split-brain data onto the *anatta* framework, identifying the "interpreter" mechanism as the engine of *papanca* (mental proliferation), comparing the explanatory power of *anatta* against Western psychological-continuity theories, and delineating where the soteriological goals of Buddhism diverge from clinical ontology.

  #### 1. Divided Consciousness and the Mechanism of *Papanca*

  The primary question posed by split-brain patients is ontological: Does the surgery reveal two provisional selves, no self whatsoever, or a single self that has been fractured?

  Under a substantialist view of self (e.g., a Cartesian ego), the surgery presents a paradox: an indivisible substance cannot be halved. Under Western psychological-continuity theories, the result is ambiguous: if identity follows memory and character, and these are now distributed across two non-communicating systems, do we have one person or two?

  *Anatta* resolves this by rejecting the premise of the question. There was never a "single self" to fracture. According to the Abhidhamma analysis, what is conventionally called a "person" is a rapid succession of discrete cognitive events (*cittas*) arising and passing away in dependence on conditions. In a neurotypical brain, the corpus callosum provides the condition for high-speed integration, allowing the aggregates to function with sufficient coherence to sustain the *pannatti* (concept) of a unitary "I."

  When the callosum is severed, the conditions for integration change. The stream of aggregates bifurcates into two distinct causal streams. *Anatta* characterizes this not as the creation of two selves, but as the exposure of two distinct streams of *nama-rupa* (mind-matter), each generating its own *pannatti* of selfhood.

  Crucially, the left hemisphere's "interpreter" function aligns precisely with the Buddhist concept of *papanca* (mental proliferation). The left hemisphere, deprived of data from the right, fabricates coherent narratives to explain actions it did not initiate (e.g., claiming "I went to get a soda" when the right hand, controlled by the right hemisphere, actually moved).

  *   **The Actor:** In the Western model, the actor is the "agent." In *anatta*, the actor is *cetana* (volition) arising within a specific hemisphere's stream of consciousness.
  *   **The Evidence:** The confabulation demonstrates that the sense of "ownership" (*mamankara*) is post-hoc. The left hemisphere observes an action and constructs a narrative of agency.
  *   **The Mapping:** This fabrication is the same mechanism *anatta* identifies as constructing the illusion of ownership in neurotypical subjects. The split-brain patient simply makes the mechanism visible by isolating it. The "I" is revealed not as the source of action, but as a commentary track added to the action. Thus, the divided consciousness reveals no self whatsoever; it reveals two streams of processes, each mistakenly appropriating a self-view (*sakkaya-ditthi*).

  #### 2. *Anatta* vs. Western Psychological-Continuity Theories

  Western theories of personal identity, particularly those following Locke and Parfit, rely on psychological connectedness (memory, character, intention) to define identity over time.

  *   **Western Performance:** These theories struggle with the "subject" of experience. If identity is continuity, and continuity is broken, does the person cease to exist? If two continuities emerge, are there two people? Parfit suggests identity is not what matters; survival (in the form of psychological connectedness) is. However, this still posits a "subject" that survives or fails to survive. The split-brain case forces Western theory into a dilemma: either admit there are two persons (violating legal/ethical norms) or admit identity is indeterminate (undermining the concept of responsibility).
  *   **Anatta Performance:** *Anatta* outperforms continuity theories here by eliminating the need for a "subject" that survives or splits.
      *   **Substrate:** The substrate is the *skandhas*.
      *   **Evidence:** The presence of distinct, non-communicating streams of consciousness in one body confirms the Buddhist assertion that "unity" is a functional convenience, not an ontological fact.
      *   **Advantage:** *Anatta* does not need to determine if "Person A" survived. It simply notes that causal streams continue. It avoids the metaphysical headache of counting souls or egos. It acknowledges that "personal identity" is a useful fiction for conventional reality (*sammuti-sacca*), but ultimately empty (*paramattha-sacca*).
      *   **Silence:** *Anatta* is silent on the *legal* or *social* counting of persons. It offers no verdict on whether the patient should have one or two votes. It is concerned only with the phenomenological fact that clinging to unity causes suffering (*dukkha*).

  #### 3. The Interpreter and the Fabrication of Unity

  What does the split-brain case reveal about *anatta* in return? Specifically, does the interpreter's relentless construction of unity confirm the self is fabricated, or does the persistence of unitary self-models in *each* hemisphere suggest a deeper, non-conventional ground?

  The fact that *both* hemispheres, when isolated, tend to generate a sense of unitary agency suggests that the propensity for self-construction is not merely a high-level linguistic artifact but is embedded in the structural functioning of consciousness itself.

  *   **Confirmation of Fabrication:** The interpreter confirms that the self is fabricated. If the self were an enduring substance, the severing of the callosum would not result in conflicting intentions or confabulated explanations. The fact that the "I" can be lied to by the brain's own machinery proves its dependency on information integration, not its status as a controller.
  *   **The "Self-Module" Objection:** One might argue that if every hemisphere automatically generates a self-model, there must be a "self-nature" (*svabhava*) driving this.
  *   **Buddhist Rebuttal:** *Anatta* anticipates this. The tendency to construct self is *avijja* (ignorance), a fundamental conditioning factor (*sankhara*). It is innate, but it is not ontological. The hardware of the brain supports the *kilesas* (defilements). The persistence of the self-model in each hemisphere does not prove a deeper ground; it proves the depth of the habitual tendency (*vasana*). The "unitary self-model" is a functional output of the aggregates, not evidence of a controller behind them.

  Therefore, the case strengthens the *anatta* hypothesis: the self is a robust, biologically supported illusion, not a metaphysical reality.

  #### 4. Limits of the Mapping: Soteriology, Morality, and Pluralism

  While the phenomenological mapping is strong, the framework encounters friction when addressing clinical intervention and moral ontology.

  *   **Clinical Intervention:** Buddhism's primary goal is soteriological (the cessation of suffering), not medical.
      *   **Conflict:** Split-brain surgery treats severe epilepsy, reducing physical *dukkha*. However, it may complicate psychological integration. *Anatta* has no specific precept regarding neural integration. It is silent on whether a "unified" consciousness is preferable to a "divided" one, provided the mind can practice Dhamma.
      *   **Limit:** We cannot stretch *kamma* to explain neural lateralization. To claim the split is a result of specific past *kamma* is speculative and risks victim-blaming. Here, the theory must remain silent on etiology and focus on the present response to the condition.

  *   **Pluralism about Persons (*Puggala*):**
      *   **The Problem:** If we treat each hemisphere as a distinct locus of awareness with its own intentions and narratives, are we forced to acknowledge two *puggala* (persons)?
      *   **Conflict:** Standard Buddhism denies ultimate persons (*puggala* is a *pannatti*, not a *paramattha*). However, if we grant that each hemisphere generates its own *kammic* trajectory (intentions leading to future consequences), we risk reifying them as ultimate entities.
      *   **Resolution:** *Anatta* must maintain that even in the split brain, there are no persons, only processes. There are two streams of *kamma*, not two "people."
      *   **Failure Point:** This creates a pragmatic impasse. In clinical and ethical contexts, we *must* treat the patient as one legal person. *Anatta* offers no help here. It deconstructs the person to end suffering, not to navigate bioethics. If we treat the hemispheres as distinct persons to respect their "autonomy," we violate the conventional truth required for social function. If we treat them as one, we ignore the phenomenological reality of their division.
      *   **Discipline:** We must state plainly that *anatta* is not a theory of neuro-ethics. It provides a metaphysics of experience, not a taxonomy of clinical subjects.

  ### Conclusion

  The split-brain studies serve as a potent empirical analogue for the Buddhist doctrine of *anatta*. The left hemisphere's interpreter functions as a neurological instance of *papanca*, constructing a narrative of unity and ownership where there is only disjointed causal process. This supports the *anatta* claim that the self is a conventional designation (*pannatti*) rather than an enduring substance.

  *Anatta* outperforms Western psychological-continuity theories by dissolving the paradox of the "split subject"—there is no subject to split, only streams of aggregates that have been uncoupled. However, the mapping reaches its limit at the boundary of moral ontology. *Anatta* cannot resolve whether a split-brain patient constitutes one or two persons for ethical purposes, as its denial of *puggala* is designed for liberation, not legal classification. Ultimately, the split-brain patient does not reveal two selves, nor a broken self; they reveal the fragility of the self-concept itself, demonstrating that what we call "I" is a narrative held together by the bandwidth of the corpus callosum.
