          *   *Connection:* This is *papanca*. The mind proliferates concepts to create coherence where there is only process. The "illusion of ownership" (*mamankara*) is generated here. The LH claims "I did that" even when the RH did it. This confirms *anatta*: the "I" is a post-hoc narrative, not a pre-existing controller.
          *   *Verdict:* Not two selves, but two streams of aggregates, each generating its own *pannatti* of selfhood.

      *   **Section 2: *Anatta* vs. Western Psychological-Continuity:**
          *   *Western View:* Parfit asks: Is Person A the same as Person B after division? It struggles with the "subject" that persists. If identity is continuity, do we have two people now?
          *   *Anatta View:* Sidesteps the "subject" question. There is no subject to split. There are only causal streams.
          *   *Performance:* *Anatta* outperforms here because it doesn't need to locate the "owner" of the experience. It accepts the multiplicity of conscious moments without demanding a unifying metaphysical glue. Western theory gets stuck on "who is the real me?" *Anatta* says "neither, both are processes."
          *   *Evidence:* The lack of a central executive in split-brain patients supports the Buddhist claim that there was no central executive to begin with.

      *   **Section 3: What the Case Shows About *Anatta* (The Feedback Loop):**
          *   *Question:* Does the interpreter confirm fabrication or suggest a deeper ground?
          *   *Analysis:* The relentless drive for unity (even when false) confirms the *vasana* (habitual tendency) to construct self. It shows the *mechanism* of delusion.
          *   *Counter-point:* Does the fact that *each* hemisphere creates a unitary model suggest a hardwired "self-module"?
