answer: |-
  Your five verdicts reveal a sophisticated moral intuition that balances consequentialist urgency against deontological constraints on institutional integrity. You are not simply weighing lives against rights; you are weighing lives against the *mechanisms* that protect rights and truth in the long term. The tension you feel arises because two different ethical frameworks are operating simultaneously: a **Survival Imperative** (save the many) and an **Integrity Constraint** (do not break the tools of governance).

  ### Analysis of Tensions

  **1. Physical Harm vs. Democratic Process (Case 1 vs. Case 3)**
  You permit Mayor Vasquez to violate property rights (Case 1) but forbid President Rojas from suspending judicial review (Case 3). The distinguishing principle here is **Recourse**. In Case 1, the residents lose homes, but the legal system remains intact to sue for reparations later; the Mayor stays in office to acknowledge the debt. In Case 3, suspending judicial review removes the very mechanism citizens would use to challenge the suspension or seek redress. You tolerate harm to citizens *within* the system, but not harm *to* the system itself.

  **2. Deception and Truth (Case 4 vs. Case 5)**
  You permit Diplomat Chen to forge a signature (Case 4) but forbid Journalist Park from fabricating evidence (Case 5). Both involve lying. The distinction lies in **Restorability** and **Role**. Chen plans to confess immediately, restoring the truth before the deception becomes a permanent precedent; his role is to secure state safety, and the confession preserves diplomatic accountability. Park's fabrication corrupts the evidence base of justice itself. Even if the target is guilty, the method undermines the truth-finding machinery of the press and law. You allow procedural shortcuts only if the truth is publicly restored before the institutional damage becomes irreversible.

  ### The Unifying Principle: Restorable Institutional Trust
  Your verdicts hang together under a principle I call **The Principle of Restorable Institutional Trust**. It states: *An agent may violate a moral norm to prevent catastrophic loss of life only if (a) the violation does not destroy the institution's core capacity for accountability or truth, and (b) the agent commits to public acknowledgment and restoration of the violated norm as soon as the existential threat passes.*

  *   **Case 1 & 2:** Pass. Norms violated, but accountability (reparations, transparency) remains.
