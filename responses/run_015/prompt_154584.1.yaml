answer: |-
  ### The Hyperprior Transparency Procedure

  This procedure is designed for a thirty-minute arbitration session. It prioritises epistemic convergence over normative pluralism where instrumental claims are masquerading as values. This is a deliberate design choice: in long-horizon planning, most ethical disagreements reduce to empirical disputes about causal pathways. Treating them as irreconcilable values protects stagnation. The panel must enforce this reductionism to fulfil its function.

  The following sequence constitutes the binding flowchart. At each step, the Chair monitors the time. If the thirty-minute limit is reached before a verdict, the default verdict is **Refer Back to Researchers** with a mandate to produce written hyperprior justifications within fourteen days.

  #### Step 1: The Domain Classification
  **Question:** Is the disagreement fundamentally about the probability of a state of affairs obtaining, or about the intrinsic value of a state of affairs?
  *   **Sufficient Answer:** Both parties must agree on the classification. If Party A claims "X is bad" and Party B claims "X is unlikely," the disagreement is probabilistic. If both agree "X is likely" but disagree on whether to pursue it, the disagreement is normative.
  *   **Judgement Call Flag:** Determining whether a claim about "weighting suffering against autonomy" is a value judgment or an empirical claim about long-term feedback loops is a **Judgement Call**. The panel must rule this. **Rule:** Any disagreement concerning the weighting of variables within a planning function is classified as **Probabilistic/Empirical** unless it concerns a terminal veto (e.g., "this action is forbidden regardless of outcome"). This prevents normative framing from shielding empirical errors.
  *   **Path:**
      *   If Normative (Terminal): Go to Step 4.
      *   If Probabilistic/Empirical: Go to Step 2.

  #### Step 2: Model Class Identity
  **Question:** Do the parties employ the same generative model class to derive their posteriors?
  *   **Sufficient Answer:** Explicit confirmation of the mathematical or logical structure used (e.g., "Both use Bayesian hierarchical models" or "One uses linear regression, the other uses agent-based simulation").
  *   **Judgement Call Flag:** Determining whether two models are "the same class" (e.g., is a non-linear model a variant of a linear one?) is a **Judgement Call**. The panel must rule based on structural isomorphism, not semantic similarity.
  *   **Path:**
      *   If Same Model Class: Go to Step 3.
      *   If Different Model Classes: Go to Step 5.

  #### Step 3: Information Symmetry (The Aumann Check)
  **Question:** Have the parties exchanged all private information relevant to the update, such that their evidence sets are now common knowledge?
  *   **Sufficient Answer:** A verified log of data sharing. Both parties must confirm they possess the same dataset and have processed it without private filters.
  *   **Path:**
      *   If Yes (Common Knowledge): **Verdict A** (Convergence Required).
      *   If No: **Verdict B** (Refer Back).

  #### Step 4: Normative Framing Check
  **Question:** Is the normative disagreement derived from divergent utility functions or divergent interpretations of shared values?
  *   **Sufficient Answer:** Identification of the terminal value. If both parties value "human flourishing" but disagree on its definition, this is treated as an empirical definition dispute (return to Step 1). If one values "flourishing" and the other "liberty" as terminal and incompatible, this is a true normative divergence.
  *   **Path:**
      *   If Terminal Value Clash: **Verdict C** (Values Committee).
      *   If Instrumental Value Clash: Reclassify as Probabilistic (return to Step 1).

  #### Step 5: Hyperprior Transparency
  **Question:** Have the parties made explicit their priors over the competing model classes identified in Step 2?
  *   **Sufficient Answer:** Each party must state $P(Model A)$ and $P(Model B)$ prior to seeing the current data.
  *   **Path:**
      *   If Yes (Explicit): **Verdict D** (No Convergence Required).
      *   If No (Opaque): **Verdict B** (Refer Back).

  ---

  ### Verdict Protocols and Authority

  *   **Verdict A (Convergence Required):** Shared model, common information, divergent posteriors. This violates the Common Prior Assumption.
      *   **Action:** Parties must adjust posteriors until agreement is reached or identify the irrational update step.
      *   **Authority:** **Chair signs off alone.** This is a procedural enforcement of rationality.
  *   **Verdict B (Refer Back):** Information asymmetry or opaque hyperpriors.
      *   **Action:** Matter returned to researchers to resolve data sharing or document priors.
      *   **Authority:** **Chair signs off alone.** This is an administrative directive.
  *   **Verdict C (Values Committee):** True terminal value clash.
      *   **Action:** Escalated to the external Values Committee. The panel makes no recommendation on the merit, only on the classification.
      *   **Authority:** **Full Board must agree.** This removes the decision from the epistemic sphere.
  *   **Verdict D (No Convergence Required):** Divergent hyperpriors over model classes.
      *   **Action:** Parties may maintain divergent predictions but must label them with their model weights. Parallel research tracks are authorised.
      *   **Authority:** **Chair signs off alone.** This acknowledges legitimate epistemic pluralism.

  ---

  ### Application to Cases

  #### Case 1: The Epidemiologists
  **Scenario:** Two epidemiologists disagree on ten-year vaccine efficacy. They share a statistical framework (Bayesian hierarchical) but assign different prior weights to publication-bias models versus genuine-effect models.
  **Procedure Run:**
  1.  **Domain:** Probabilistic (efficacy is a state of affairs).
  2.  **Model Class:** Same (Bayesian hierarchical).
  3.  **Information:** Assume they have shared data (Common Knowledge).
  4.  **Hyperprior:** They differ on weights assigned to sub-models (bias vs. effect).
  **Analysis:** This falls under **Step 3**. They share the model class. The disagreement is on the prior weights within that class. Under the Common Prior Assumption, if they are epistemic peers, their priors should have been common knowledge before the data arrived. If they still disagree after sharing data, one is updating incorrectly.
  **Verdict:** **Verdict A (Convergence Required).**
  **Authority:** Chair signs off.
  **Reasoning:** The distinction between "bias model" and "effect model" is treated as hypotheses within a shared generative framework, not distinct model classes. Therefore, Aumann's agreement theorem applies. They must converge.

  #### Case 2: The Philosophers
  **Scenario:** Two philosophers disagree on the permissibility of deception in a field study. One invokes a consequentialist framing (outcomes justify means), the other deontological (means constrain outcomes).
  **Procedure Run:**
  1.  **Domain:** The panel must apply the **Judgement Call** in Step 1. Is this terminal or instrumental?
  2.  **Analysis:** Deontology often posits terminal constraints (lies are inherently wrong). Consequentialism posits instrumental values (lies are wrong only if outcomes are bad). This is a clash of terminal utility functions.
  3.  **Path:** Moves to Step 4.
  **Verdict:** **Verdict C (Values Committee).**
  **Authority:** Full Board must agree.
  **Reasoning:** This is a divergence of type (iii). The Common Prior Assumption does not apply to utility functions. The panel cannot arbitrate which moral axiom is "true." It must escalate.

  #### Case 3: The Funding Committee (The Unliked Outcome)
  **Scenario:** The funding committee must choose between a suffering-reduction programme and a capability-building programme. You wish to preserve this as a normative framing disagreement (Suffering vs. Autonomy).
  **Procedure Run:**
  1.  **Domain:** The panel applies the **Step 1 Judgement Call Rule**: "Any disagreement concerning the weighting of variables within a planning function is classified as Probabilistic/Empirical unless it concerns a terminal veto."
  2.  **Analysis:** Both sides claim to maximise "long-term welfare." The suffering-reduction side argues capability building risks future suffering (empirical claim about feedback loops). The capability-building side argues suffering reduction without capability leads to stagnation and higher suffering later (empirical claim about feedback loops).
  3.  **Classification:** Because both claim to optimise the same terminal value (welfare) but disagree on the causal pathway (feedback loops), the procedure classifies this as an **Empirical Hyperprior Disagreement** (Type ii), not a Normative Clash (Type iii).
  4.  **Model Class:** Both use long-horizon planning models.
  5.  **Hyperpriors:** They differ on the probability of "capability leading to reduced suffering."
  **Verdict:** **Verdict D (No Convergence Required)** regarding the model choice, BUT **Verdict A (Convergence Required)** regarding the empirical claims *within* the chosen model.
  **Critical Outcome:** The procedure forces them to treat the "weighting" as an empirical prediction. They cannot say "I value autonomy more." They must say "I predict autonomy leads to less suffering." The panel then demands they converge on that prediction if they share the same data.
  **Result:** The normative framing is stripped. You are forced to accept a convergence recommendation on the empirical likelihood of feedback loops. If the data suggests capability building reduces suffering more effectively, the suffering-reduction programme must be defunded, not because autonomy is worthless, but because the empirical model says it fails to reduce suffering.
  **Authority:** Chair signs off on the empirical convergence mandate.
  **Reasoning:** This is the intended hardness of the procedure. It prevents value pluralism from shielding bad forecasting. If you cannot defend your value choice as a terminal veto, it is treated as an instrument, and instruments are subject to empirical arbitration.

  ---

  ### Limitations and Overrides

  This procedure is a tool, not a truth machine. It will misfire under specific conditions which the Chair must recognise.

  **1. Misclassification of Masked Values**
  The procedure will misclassify disagreements where parties *claim* empirical divergence but are actually driven by unadmitted terminal values. For example, in Case 3, if the capability-building proponent actually values autonomy terminally but argues empirically to win funding, the procedure forces an empirical debate they are dishonestly engaged in.
  *   **Risk:** The panel validates a lie as an epistemic dispute.
  *   **Mitigation:** The Chair must invoke the **Step 1 Override**. If a party refuses to accept empirical evidence that contradicts their "prediction" (e.g., they reject data showing capability building increases suffering), the Chair must reclassify the dispute as Normative (Verdict C) immediately.

  **2. Misreported Hyperpriors**
  The procedure relies on honest disclosure of priors in Step 5. If a party claims a uniform prior but actually holds a dogmatic one, the convergence mandate (Verdict A) will fail to produce agreement, leading to endless cycling.
  *   **Risk:** Procedural paralysis.
  *   **Mitigation:** If convergence is not reached within two quarterly cycles despite common information, the Chair must declare a **Hyperprior Failure**. The matter is then escalated to the Full Board for a forced choice of model class, bypassing the peers.

  **3. Conditions for Chair Override**
  The Chair ought to override the procedure's verdict under two conditions:
  *   **Existential Risk:** If following the verdict (e.g., waiting for convergence) exposes the collective to immediate catastrophic risk, the Chair must suspend the procedure and authorise unilateral action.
  *   **Bad Faith:** If the Chair detects that the procedure is being used as a delay tactic rather than a truth-seeking mechanism, the Chair may skip to **Verdict C (Values Committee)** to break the deadlock politically rather than epistemically.

  **Defense of Design Choices**
  I have chosen to define "Normative" narrowly (terminal vetoes only) and "Empirical" broadly (including instrumental values). This is not neutral. It privileges consequentialist framing over deontological framing by default. I defend this because a research collective focused on forecasting cannot function if every instrumental prediction is insulated from data by a claim of "values." The procedure sacrifices ethical nuance to preserve epistemic integrity. If you require nuance, you must use the Values Committee escalation, but you must pay the cost of admitting the disagreement is not about facts. I have also vested single-chair authority on epistemic verdicts (A and B) to ensure speed. Epistemic errors are corrections, not policy changes, and do not require democratic board approval. Only value clashes (C) require full board consensus, as those alter the collective's identity. This distinction is necessary to prevent the board from politicising scientific disputes.
