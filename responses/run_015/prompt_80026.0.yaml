      *   Check timing (2-min replies).
      *   Ensure the "Soft Spot" notes are honest.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Psych objections sound like *psychologists*, not just philosophers. Use terms like "scaffolding," "cognitive load," "metacognition."
