prompt: |-
  You advise the maintenance team for an autonomous warehouse network that must revise its operational belief database whenever a hardware component or regulatory constraint changes. The frame problem—knowing precisely which inferences to drop and which to preserve—makes every update risk either leaving hidden errors intact or cascading into irrelevant domains. Design a reusable audit procedure that the team can complete in under thirty minutes per change event. The procedure must require the auditor to sort every affected belief into three bins: direct entailments of the change, shielded defaults that survive untouched, and “ghost frames” (inherited but now-untracked assumptions that have not been explicitly invalidated and must be manually exposed). It must specify a hard stopping rule that prevents revision from reaching beliefs about human intentions, market prices, or legal liability; it must flag every step that depends on a value judgment rather than a technical check; and it must include a documentation protocol for unresolved conflicts between ghost frames. Apply the procedure to three cases: lowering the weight limit on a loading dock, where energy-cost defaults should survive but queue-order assumptions must be flagged; installing a fire-suppression system that disables certain sensors, where inventory-tracking beliefs should be shielded despite the sensor loss; and a third case in which the procedure yields a result the team is likely to resist. Conclude by stating exactly what the procedure cannot settle—especially when ghost frames contradict one another—and how the residual uncertainty should be recorded for the next audit cycle.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Advisor to the maintenance team for an autonomous warehouse network.
      *   **Task:** Design a reusable audit procedure for updating the operational belief database when hardware/regulatory changes occur.
      *   **Constraint 1 (Time):** Must be completable in under 30 minutes per change event.
      *   **Constraint 2 (Categorization):** Every affected belief must be sorted into three bins:
          1.  Direct Entailments (of the change).
          2.  Shielded Defaults (survive untouched).
          3.  Ghost Frames (inherited, untracked, must be manually exposed).
      *   **Constraint 3 (Stopping Rule):** Hard stop preventing revision of beliefs about human intentions, market prices, or legal liability.
      *   **Constraint 4 (Value Judgments):** Flag every step depending on value judgment vs. technical check.
      *   **Constraint 5 (Documentation):** Protocol for unresolved conflicts between ghost frames.
      *   **Application:** Apply to three specific cases:
          1.  Lowering weight limit on a loading dock (Energy-cost defaults survive, queue-order flagged).
          2.  Installing fire-suppression system disabling sensors (Inventory-tracking shielded).
          3.  A third case where the team is likely to resist the result.
      *   **Conclusion:** State exactly what the procedure *cannot* settle (especially contradictory ghost frames) and how residual uncertainty is recorded.

  2.  **Drafting the Audit Procedure (The "30-Minute Frame Audit"):**

      *   *Name:* Needs to sound official but actionable. "Rapid Belief Revision Protocol (RBRP)" or "30-Minute Frame Audit." Let's go with "30-Minute Frame Audit (30MFA)."
      *   *Structure:* Needs to be step-by-step to fit the time limit.
      *   *Bins:* Define the three bins clearly.
      *   *Stopping Rule:* Make it prominent.
      *   *Value Flags:* Integrate a marker (e.g., [VJ]) into the steps.
      *   *Documentation:* Specific form or log entry requirement.

      *   *Drafting Steps:*
          1.  Define Change (5 mins).
          2.  Map Direct Entailments (5 mins).
          3.  Identify Shielded Defaults (5 mins).
          4.  Hunt Ghost Frames (10 mins).
          5.  Apply Stopping Rule & Value Flags (Ongoing).
          6.  Conflict Resolution & Logging (5 mins).

      *   *Refining Constraints:* Ensure the "Human/Market/Legal" stop is explicit. Ensure the "Value Judgment" flag is explicit.

  3.  **Developing the Three Cases:**

      *   *Case 1: Lowering Weight Limit.*
          *   Change: Dock A max weight 5000kg -> 3000kg.
          *   Direct: Pallets >3000kg rejected.
          *   Shielded: Energy cost per move (doesn't change with weight limit, just physics).
          *   Ghost: Queue order (maybe heavy items were prioritized before, now they can't be).
          *   *Check:* Does this match the prompt? Yes (Energy survive, queue flagged).

      *   *Case 2: Fire-Suppression System.*
          *   Change: New sprinklers disable heat sensors in Zone B.
          *   Direct: Heat data null in Zone B.
          *   Shielded: Inventory count (logic should switch to RFID or visual, not assume loss).
          *   Ghost: Safety confidence (operators might *assume* it's safer, but system logic might not reflect this). *Wait, prompt says inventory-tracking beliefs should be shielded.* Okay, focus on that.
          *   *Ghost:* "Sensor availability implies coverage." If sensor is off, does the system assume *no* fire risk or *unknown* fire risk?

      *   *Case 3: Resistance Case.*
          *   Need a scenario where the audit reveals something uncomfortable.
          *   Idea: Efficiency vs. Safety trade-off hidden in a "default."
          *   Scenario: Updating navigation software to avoid a new obstacle.
          *   Resistance: The audit reveals that "Shortest Path" defaults implicitly prioritize speed over battery health or floor wear, which wasn't explicitly authorized. Or, a regulatory change regarding worker proximity reveals that the system assumes workers *will* move out of the way (a human intention belief).
          *   *Selection:* Let's go with a "Priority Routing Update." The system assumes high-value goods get priority. A regulatory change limits speed near human zones. The audit reveals the "Ghost Frame" is that *humans are predictable obstacles*. The team resists because fixing it slows down throughput.
          *   *Alternative:* A change in battery chemistry. The audit reveals a Ghost Frame: "Charging stations are always available." The team resists because admitting this requires building more stations (cost).
          *   *Better Alternative (aligning with Stopping Rule):* A change in data retention policy. The audit forces the team to confront that they are storing data that implies *worker performance tracking* (Human Intention/Liability border). The team resists because they claim it's just "system logs." The procedure flags it as a Value Judgment/Liability border.
          *   *Let's try this:* **Algorithm Update for Collision Avoidance.**
          *   Change: New LiDAR sensitivity.
          *   Resistance: The audit flags a Ghost Frame: "Static obstacles are non-malicious." If a human stands still, is it a block or a threat? The procedure flags the assumption about *human behavior* (Stopping Rule border). The team resists because they don't want to classify human behavior as a variable they manage.

  4.  **Drafting the Conclusion (Limitations):**

      *   What can't it settle? Contradictory Ghost Frames (e.g., Safety says stop, Efficiency says go, both are defaults).
      *   How to record? "Open Risk Ticket" with expiration date.

  5.  **Review and Refine:**

      *   *Time Check:* Is 30 minutes realistic? The steps need to be rigid.
      *   *Bins Check:* Are Direct, Shielded, and Ghost clearly distinguished in the examples?
      *   *Stopping Rule:* Is it hard? Yes, "ABORT REVISION."
      *   *Value Judgments:* Are they flagged? Yes, use [VJ].
      *   *Tone:* Professional, directive, systematic.

  6.  **Final Polish:** (Self-Correction during drafting)
