      *   *Correction on Stopping Rule:* Ensure it explicitly mentions Human Intentions, Market Prices, Legal Liability.
      *   *Correction on Ghost Frames:* Ensure the definition emphasizes "inherited but untracked."

  7.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
