      *(Self-Correction on Case 2)*: Inventory-tracking beliefs should be Shielded.
      *(Self-Correction on Case 3)*: Needs to be a result the team resists.

      *Let's refine the "Value Judgment" flag.* It needs to be part of the procedure steps.
      *Let's refine the "Stopping Rule".* It needs to be a specific step.

      *Okay, ready to write.*
answer: |-
  # The 30-Minute Frame Audit (30MFA)
  **Protocol Version:** 4.2  
  **Applicability:** Hardware swaps, regulatory updates, constraint modifications.  
  **Time Limit:** 30 Minutes (Hard Stop).  
  **Auditor Role:** System Integrity Specialist (not Operations Manager).

  ## I. Pre-Audit Setup (Minutes 0–2)
  1.  **Define the Delta:** Write the specific change in one sentence (e.g., "Dock 4 weight limit reduced from 5T to 3T").
  2.  **Initialize Log:** Open the *Belief Revision Ledger*. Create three columns: **Direct Entailments**, **Shielded Defaults**, **Ghost Frames**.
  3.  **Value Judgment Marker:** Prepare the **[VJ]** tag. Any decision relying on preference, risk tolerance, or unstated policy rather than sensor data or code logic must be tagged [VJ].

  ## II. The Sorting Procedure (Minutes 2–22)
  *Iterate through all beliefs linked to the changed component. Assign each to exactly one bin.*

  ### Bin A: Direct Entailments
  *Definition:* Beliefs that are logically false or physically impossible given the new change.
  *Action:* Mark for immediate deletion or overwrite.
  *Constraint:* If a belief requires inferring *why* the change happened, tag **[VJ]**.

  ### Bin B: Shielded Defaults
  *Definition:* Core operational axioms explicitly protected by the system architecture (e.g., conservation of mass, basic inventory existence) that remain true despite the change.
  *Action:* Verify integrity checksum. No logic change required.
  *Constraint:* If shielding requires assuming external stability (e.g., "power grid remains stable"), tag **[VJ]**.

  ### Bin C: Ghost Frames
  *Definition:* Inherited assumptions that were previously valid but are now untracked, unverified, or implicitly dependent on the old state.
  *Action:* **Expose.** Do not delete. Flag for manual review. These are the primary source of cascading errors.
  *Constraint:* If exposing the frame reveals a dependency on human behavior, market conditions, or law, trigger **Hard Stop**.

  ## III. The Hard Stopping Rule (Minute 23)
  **ABORT CONDITION:** If any belief in Bin A, B, or C requires updating, validating, or invalidating data regarding:
  1.  **Human Intentions** (e.g., "Worker will move," "Manager approves").
  2.  **Market Prices** (e.g., "Energy cost is low," "Part replacement is cheap").
  3.  **Legal Liability** (e.g., "System is compliant," "Risk is acceptable").

  **Procedure:** If triggered, cease audit. Mark status as **ESCALATED TO LEGAL/ETHICS BOARD**. Do not attempt to resolve within the 30MFA.

  ## IV. Conflict Documentation (Minutes 24–30)
  1.  **Resolve Ghost Conflicts:** If two Ghost Frames contradict (e.g., "Max Speed" vs. "Min Vibration"), do not arbitrate.
  2.  **Record Residual Uncertainty:** Enter the conflict into the *Unresolved Risk Register*.
  3.  **Sign-off:** Auditor signs. Operations Manager countersigns acknowledging the Ghost Frames.

  ---

  # Application of Procedure

  ## Case 1: Lowering Weight Limit on Loading Dock 4
  **Change:** Regulatory mandate reduces max pallet weight from 5,000kg to 3,000kg.
  **Time Elapsed:** 26 Minutes.

  | Bin | Belief | Status/Notes |
  | :--- | :--- | :--- |
  | **Direct Entailment** | `Dock_4_Capacity == 5000kg` | **INVALIDATED.** Update to 3000kg. |
  | **Direct Entailment** | `Pallet > 3000kg ALLOWED_AT_Dock_4` | **INVALIDATED.** Route logic must reject. |
  | **Shielded Default** | `Energy_Cost_Per_Move == Constant` | **PRESERVED.** Physics of movement unchanged; cost model independent of weight limit. |
  | **Ghost Frame** | `Queue_Priority == FIFO` | **EXPOSED [VJ].** Previously, heavy items were prioritized to clear dock space. With weight cap, "heavy" logic is orphaned. Does priority shift to volume? Untracked. |
  | **Ghost Frame** | `Forklift_Torque_Availability` | **EXPOSED.** System assumes forklifts can handle 5T. Now they are under-utilized. Is this efficiency or waste? Untracked. |

  **Outcome:** Queue logic flagged as Ghost Frame. Operations must manually decide new priority rules. Energy defaults successfully shielded.

  ## Case 2: Fire-Suppression System Installation
  **Change:** Chemical sprinklers installed in Zone B; heat sensors disabled to prevent false triggers.
  **Time Elapsed:** 28 Minutes.

  | Bin | Belief | Status/Notes |
  | :--- | :--- | :--- |
  | **Direct Entailment** | `Zone_B_Heat_Sensor == ACTIVE` | **INVALIDATED.** Set to NULL/OFFLINE. |
  | **Direct Entailment** | `Fire_Detection_Method == Thermal` | **INVALIDATED.** Switch to Smoke/Particulate. |
  | **Shielded Default** | `Inventory_Count_Integrity` | **PRESERVED.** Loss of heat sensor does not imply loss of goods. RFID/Visual tracking remains authoritative. |
  | **Ghost Frame** | `Zone_B_Safety_Level` | **EXPOSED [VJ].** System assumes sprinklers *increase* safety. However, chemical discharge damages electronics. Risk profile changed but not quantified in logic. |
  | **Ghost Frame** | `Sensor_Redundancy` | **EXPOSED.** Previous logic assumed 3 sensor types. Now 2. Is the remaining redundancy sufficient? Untracked. |

  **Outcome:** Inventory beliefs successfully shielded. Safety assumptions exposed as Ghost Frames requiring risk assessment.

  ## Case 3: Navigation Algorithm Update (The Resistance Case)
  **Change:** New pathfinding algorithm implemented to reduce battery consumption by 5%.
  **Time Elapsed:** 29 Minutes (Stopped at Minute 29).

  | Bin | Belief | Status/Notes |
  | :--- | :--- | :--- |
  | **Direct Entailment** | `Path_Cost_Function` | **UPDATED.** Weighting shifted from Time to Energy. |
  | **Shielded Default** | `Obstacle_Avoidance` | **PRESERVED.** Collision logic remains paramount. |
  | **Ghost Frame** | `Human_Predictability` | **EXPOSED [VJ].** New paths cut closer to human walkways to save energy. This relies on the assumption: `Human_Walk_Pattern == Stable`. |
  | **Hard Stop Trigger** | `Liability_Risk` | **ABORT.** The Ghost Frame implies a judgment on human safety margins. If a human deviates, the system's energy-saving path increases collision probability. This borders on **Legal Liability** and **Human Intention**. |

  **Team Resistance:** The maintenance team resists this result. They argue that "Human Predictability" is a standard engineering parameter, not a liability judgment. They want to classify it as a Shielded Default to proceed with the rollout.
  **Procedure Enforcement:** The 30MFA mandates an **ABORT**. The belief cannot be sorted into A, B, or C without violating the Hard Stopping Rule. The update is frozen until the Ethics Board reviews the "Human Predictability" assumption. The team resists because this delays the energy savings KPI.

  ---

  # Limitations and Residual Uncertainty

  ## What the Procedure Cannot Settlement
  The 30MFA is a triage tool, not a resolution engine. It explicitly **cannot settle**:
  1.  **Contradictory Ghost Frames:** When Bin C contains two exposed assumptions that cannot both be true (e.g., "Maximize Throughput" vs. "Minimize Wear"), the procedure does not choose. It only exposes the conflict.
  2.  **The Truth Value of Ghosts:** The procedure identifies *that* an assumption is untracked, not whether the assumption is *correct*.
  3.  **Hard Stop Violations:** If a belief touches Human Intention or Liability, the procedure halts without offering a technical solution. It identifies the boundary but does not cross it.

  ## Recording Residual Uncertainty
  For the next audit cycle, all unresolved Ghost Frames and Hard Stop triggers must be recorded in the **Unresolved Risk Register (URR)** using the following schema:

  *   **ID:** GF-[Date]-[Sequence]
  *   **Description:** The specific inherited assumption (e.g., "Humans will not enter Zone B during Cycle 3").
  *   **Contradiction:** The opposing Ghost Frame or Constraint (e.g., "Zone B is a thoroughfare").
  *   **Risk Classification:** [Technical] [Value-Judgment] [Liability-Border].
  *   **Expiration:** This entry must be reviewed in the next quarterly audit. If still unresolved, it escalates to System Architecture Review.

  **Final Directive:** The 30MFA does not guarantee a bug-free update. It guarantees that known unknowns (Ghost Frames) are made visible before the system executes. Uncertainty is not to be eliminated; it is to be logged.
