answer: |-
  **JOINT STATEMENT: ADVERSARIAL COLLABORATION ON AI TAKEOFF DYNAMICS**
  **Signatories:** [Hard Takeoff Proponent] & [Continuous Scaling Proponent]
  **Date:** October 2023

  **1. AGREED CLAIMS**
  1.  **Scope of Disagreement:** The disagreement concerns the shape of the capability curve inside a specific window (human-level to superhuman AI R&D), not whether AI eventually becomes very capable. [Both confident]
  2.  **Axis Definition:** "Takeoff speed" is meaningless without fixing an x-axis (calendar time? compute? cumulative effort?) and a y-axis (research capability? economic output?). [Both confident]
  3.  **Proxy Failure:** Current benchmark scores (MMLU, etc.) are bad proxies for the capacity for recursive self-improvement. [Both confident]
  4.  **Past Smoothness:** Smooth scaling laws observed so far are empirical fact; their relevance past the point of autonomous AI R&D is exactly what is contested. [Both confident]
  5.  **Quiet Takeoff:** A very fast takeoff in *research capability* is compatible with a slow, boring-looking ramp in the *outside world*, because deployment is gated by liability, regulation, and integration time. [Foom hedging: wants to add "unless alignment fails catastrophically during the quiet phase"]
  6.  **Compute Overhang:** It is physically possible for a lab to sit on a large compute overhang capable of being deployed suddenly. [Both confident]
  7.  **Integration Lags:** Deployment is gated by integration time, not just model capability; institutional friction is real. [Both confident]
  8.  **Window Center:** The right centre of the forecasting window is the point where systems perform a substantial fraction of AI R&D subtasks autonomously. [Both confident]
  9.  **Economic Lag:** Economic substitutability may lag capability by years due to trust and workflow integration. [Gradualist confident; Foom hedging: "likely less than 1 year"]
  10. **Current Regime:** We are currently in the pre-recursive regime. [Both confident]

  **2. DISAGREEMENTS TABLE**

  | Crux | Foom Wording | Gradualist Wording | Type |
  | :--- | :--- | :--- | :--- |
  | **Serial vs. Parallel** | The binding constraint on AI progress is the *depth* of a single chain of insight; extra copies buy little. | The binding constraint is *throughput* of experiments; a thousand copies buy a lot. | Factual/Model |
  | **The One-Run Jump** | A lab with a compute overhang could get most of the way to superhuman capability in a single training cycle. | Each increment needs feedback from a world still mostly run by humans/institutions. | Factual |
  | **The Y-Axis** | Takeoff must be measured in *AI-research capability*; economic impact is a lagging indicator. | Takeoff must be measured in *broad economic substitutability*; research capability is a leading indicator. | Conceptual |
  | **Regime Change** | "Recursive self-improvement" is a genuine regime change distinct from prior automation. | RSI is just more of the same automation already added to the pipeline; no phase shift. | Reference Class |

  **3. PRE-REGISTERED TESTS**

  **A. The Sealed Lab**
  *Setup:* A well-resourced lab keeps systems internal for two years from the point where they can do 50% of a fixed battery of AI R&D subtasks. Compute is flat. Weekly logs of performance on the held-out 50% are released afterwards.
  *   **Foom Prediction:** Performance curve shows a distinct knee followed by a segment >2x steeper than the prior slope. *Concession:* If slope remains within 20% of pre-threshold trend. [Would surprise me if no knee]
  *   **Gradualist Prediction:** Roughly log-linear with slowly drifting slope; no discontinuity >1.5x prior trend. *Concession:* If slope doubles within a single month. [Would surprise me if knee appears]

  **B. The Thousand-Copies Test**
  *Setup:* Hold total compute fixed. Compare one long serial run against 1,000 shorter parallel instances on a real research task with verifiable answers (e.g., fix a stated bug in a large codebase).
  *   **Foom Prediction:** Serial run outperforms parallel swarm by >50% on hard tasks. Depth matters more than breadth. [Would surprise me if parallel wins]
  *   **Gradualist Prediction:** Parallel swarm outperforms serial run by >50%. Throughput matters more than depth. [Would surprise me if serial wins]

  **C. The Automation Rate Step**
  *Setup:* Track the percentage of AI engineering tasks fully automated (no human intervention) quarterly.
  *   **Foom Prediction:** Step change >20% quarter-over-quarter once threshold is hit. [Would surprise me if smooth]
  *   **Gradualist Prediction:** Smooth S-curve; no quarter exceeds 5% growth rate. [Would surprise me if step change]

  **4. VERBAL DISPUTES & OBSERVABILITY**

  **The Y-Axis Offender:** The largest chunk of this dispute is verbal. When the Foom side says "fast takeoff," they mean *cognitive speed* in a sealed environment. When the Gradualist says "slow takeoff," they mean *economic absorption* in the real world. These can coexist. We agree that "Quiet Takeoff" is a viable scenario where the Foom side gets the internal dynamics they fear, but the Gradualist gets the external timeline they predict.

  **Observability Finding:** If Quiet Takeoff holds, the Foom-vs-Continuous question is unobservable from outside for years. External economic data will look continuous even if internal capability curves are discontinuous. We must rely on insider telemetry (like the Sealed Lab test) rather than GDP or API pricing to resolve the core disagreement.

  **Confidence Note:** Both sides sign this believing the other is wrong about the *mechanism*, but agree that the *measurements* above would update them. Neither side believes the other is irrational, only that they are weighting reference classes (biology vs. engineering) differently.

  **[END DOCUMENT]**
