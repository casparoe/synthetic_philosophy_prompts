prompt: |-
  hey — I'm the person who ends up writing the "how we do things here" docs at a ~60-person engineering org, three time zones, mostly async. I get two or three requests a week along the lines of "we should have a norm about X" or "can you write something that fixes the culture around Y", and I have basically no idea when putting something in the handbook does anything at all. I also can't enforce anything myself — if a rule needs teeth, a director or the team leads have to sign off, and they won't sign off on something they think is invented busywork. So quick, cheap and honest beats thorough every time.

  I read a paraphrase of that Lewis account of conventions — roughly: a convention is a regularity in how people behave in a recurring situation where what mostly matters is that we match, where there's more than one way to match, and where everyone keeps doing it partly because everyone expects everyone else to keep doing it, and everyone knows that everyone knows. That clicked hard, because I think half of what I'm asked to "set" isn't that kind of thing at all. Can you turn it into something I can actually run?

  What I need:

  - a decision procedure I can work through in about fifteen minutes on a request: the questions in order, and what counts as a good enough answer to each one. Include an explicit place where it stops with a "no, there's nothing to set here", and a place where it hands the decision to a person because the question is one of values rather than facts.
  - a way to tell an already-live convention that just happens to be unwritten (where maybe the only right move is to write it down so the knowledge stops being private) from a genuine vacancy where nobody knows what to do.
  - what to actually do when there are several equally fine options. I get the bit where the content is arbitrary and what matters is which one stands out — give me the concrete levers: precedent, analogy to something people already know, a flag day, getting a visible group to go first, whatever.
  - a section on change, including conventions that have outlived the problem they solved: what it really takes to move one, roughly how long, how often it fails, and what a writen rule nobody follows does to the credibility of the next one.
  - clearly flagged: the steps where judgment can't be removed and a human has to decide.

  Then run it on three things actually on my desk:

  1. "set a norm" that people reply in Slack within four waking hours.
  2. a written rule everyone ignores: every PR needs a second reviewer, but in practice whoever's online rubber-stamps it or the author self-merges after a day.
  3. the one I expect to hate: we're moving to trunk-based development and everyone complains about long-lived branches, so I want to announce that branches live at most a day and have it stick. I would definately prefer this to work by memo, and I suspect you're going to tell me it won't.

  Be plain about which parts are the actual theory and which parts are you making up from how orgs really work — I'd rather see where the scaffolding ends than get a smooth checklist that isn't holding anything up. No citations or reading lists, I'm never going to read them. And if my framing is off — if some of this stuff isn't a convention in that sense at all, or the idea just doesn't stretch to cover handbooks, announcements and written rules — say so straight out instead of politely going along with it. I'd much rather be told the frame doesn't fit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Documentation/Process lead at a ~60-person engineering org (3 time zones, mostly async).
      *   **Problem:** Overwhelmed by requests to "set norms" or "fix culture" via docs. Skeptical about the efficacy of handbooks. No enforcement power (needs Director/Lead buy-in). Values speed and honesty over thoroughness.
      *   **Theoretical Anchor:** David Lewis's *Convention* (regularity, coordination problem, arbitrary but matching expectations, common knowledge).
      *   **Goal:** A practical, 15-minute decision procedure to evaluate requests, distinguish unwritten conventions from vacancies, handle arbitrary choices, manage change/decay, and flag human judgment calls.
      *   **Specific Task:** Run this procedure on three specific scenarios (Slack response time, ignored PR rule, Trunk-based development branch lifespan).
      *   **Tone/Style:** Plain, honest, no fluff, no citations, distinguish theory from pragmatic org reality, call out if the frame doesn't fit.

  2.  **Deconstruct the Theory (Lewis vs. Org Reality):**
      *   *Lewis:* Conventions solve coordination problems where multiple equilibria exist (e.g., driving on the left vs. right). They are self-enforcing because deviation hurts the deviator.
      *   *Org Reality:* Many "norms" requested are actually *policies* (rules with penalties) or *values* (moral/ethical stances), not conventions. A handbook entry doesn't make a convention; it just records one (or tries to mandate one).
      *   *Key Insight:* You cannot write a convention into existence. You can only write down what people are already doing (codification) or create a focal point for a new coordination game (catalysis). If there's a conflict of interest (e.g., "work faster" vs. "sleep"), it's not a convention; it's a negotiation.

  3.  **Drafting the Decision Procedure (The "15-Minute Filter"):**
      *   Need a flowchart style logic.
      *   *Step 1: Is this actually a coordination problem?* (Lewis test). If everyone does X, does it help everyone? Or does it help managers and hurt engineers?
      *   *Step 2: Is there already behavior?* (Unwritten convention vs. Vacancy).
      *   *Step 3: Is the solution arbitrary?* (If there's only one right way, it's a technical constraint, not a convention).
      *   *Stop/Handoff points:* If it's about values/power, hand to leadership. If it's not a coordination problem, say "no."

  4.  **Drafting the "How to Set It" (The Levers):**
      *   If it *is* a convention, how do we tip the scale?
      *   Focal points (Schelling points).
      *   Public commitment.
      *   Tooling enforcement (where possible).

  5.  **Drafting the "Change & Decay" Section:**
      *   Conventions die when the underlying incentive changes.
      *   Written rules that are ignored are worse than no rules (credibility tax).
      *   Sunset clauses.

  6.  **Addressing the Three Scenarios:**
      *   *Scenario 1 (Slack 4-hour response):* Is this a convention? No. It's a service level expectation. It conflicts with deep work. It requires enforcement/management buy-in, not just a doc. *Verdict: Don't write it as a convention.*
      *   *Scenario 2 (Ignored PR Rule):* This is a broken convention/policy mismatch. The rule says "2 reviewers," reality says "speed." Writing it down won't fix it. The incentive is wrong. *Verdict: Fix the incentive or change the rule.*
      *   *Scenario 3 (Trunk-based/1-day branches):* This is a technical workflow coordination. It *can* be a convention, but it requires tooling and leadership backing because it changes the "game." A memo won't work. *Verdict: Needs structural change, not just a norm.*

  7.  **Refining the Tone:**
      *   Keep it sharp. Acknowledge the user's skepticism.
      *   Explicitly mark "Theory" vs. "Org Pragmatism."
      *   Ensure the "Human Judgment" flags are visible.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I lean too hard on Lewis?
      *   *Fix:* Make sure to point out where Lewis fails in orgs (power dynamics). Lewis assumes equal players; orgs have bosses.
      *   *Critique:* Is the procedure actually 15 minutes?
      *   *Fix:* Keep the questions binary and sharp.
      *   *Critique:* Did I answer the specific prompt about "credibility of the next one"?
      *   *Fix:* Ensure the "Decay" section explicitly mentions the "cry wolf" effect.

  9.  **Final Polish:** Check against constraints (no citations, plain language, specific scenarios). Ensure the distinction between "Convention," "Policy," and "Value" is clear, as that's the root of the user's problem. (Self-correction: The user asked for a decision procedure *based* on the Lewis account, but I need to tell them when that account *doesn't* apply).

  10. **Final Output Structure:**
      *   Introduction (Validating the skepticism).
      *   The 15-Minute Decision Procedure (The Filter).
      *   Distinguishing Unwritten vs. Vacancy.
      *   Levers for Arbitrary Choices.
      *   Change & Decay (The Credibility Tax).
      *   Running the Three Scenarios.
      *   Closing reality check.

  *(Self-Correction during final review)*: Make sure I explicitly flag where *I* am making up the org advice vs. where it's Lewis. The prompt asks for this distinction. I will use bold headers or specific callouts.

