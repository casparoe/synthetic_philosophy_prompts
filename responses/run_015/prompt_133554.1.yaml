answer: |-
  Here is the operating manual you asked for. It is built on the Lewis framework but modified for the reality that organizations are not games between equals; they are hierarchies with conflicting incentives.

  ### Part 1: The 15-Minute Decision Procedure

  This is a filter. If a request fails at any step, stop writing. Do not pass Go.

  **Step 1: The Coordination Test (Lewis Core)**
  *   **Question:** If everyone does X, does *everyone* benefit, including the people doing the work? Or does one group benefit (management) while another pays the cost (engineers)?
  *   **Pass:** Everyone benefits from matching (e.g., naming conventions, meeting hours, commit message formats).
  *   **Fail:** It is a demand disguised as a norm (e.g., "respond faster," "work weekends").
  *   **Action if Fail:** **STOP.** This is not a convention. It is a policy or a value conflict. Hand off to a Director with a note: *"This requires enforcement or incentive changes, not documentation."*

  **Step 2: The Arbitrariness Test**
  *   **Question:** Are there at least two ways to solve this that are roughly equal in quality?
  *   **Pass:** Yes (e.g., Slack vs. Email for alerts, Tabs vs. Spaces).
  *   **Fail:** No. There is only one technically correct way, or one way is objectively superior.
  *   **Action if Fail:** Do not call it a norm. Call it a Standard or a Best Practice. Write it as technical guidance, not cultural expectation.

  **Step 3: The Recurrence Test**
  *   **Question:** Does this situation happen often enough that people will remember the rule next time?
  *   **Pass:** Yes (Daily/Weekly).
  *   **Fail:** No (Once per quarter, or only during crises).
  *   **Action if Fail:** **STOP.** Conventions rely on muscle memory. If it's rare, write a checklist for that specific event, not a standing norm.

  **Step 4: The Enforcement Gap (Org Reality)**
  *   **Question:** If someone deviates, do they suffer natural consequences (confusion, broken builds), or do they get away with it unless caught?
  *   **Pass:** Natural consequences (the build breaks, the page doesn't load).
  *   **Fail:** No immediate consequence (skipping a review, missing a Slack message).
  *   **Action if Fail:** **FLAG FOR HUMAN JUDGMENT.** You cannot write this into the handbook. It requires a Director to decide if they care enough to enforce it. If they won't enforce it, do not write it.

  ---

  ### Part 2: Unwritten Convention vs. Genuine Vacancy

  You need to know if you are **codifying** (writing down what exists) or **catalyzing** (trying to start something new).

  **Signs of an Unwritten Convention (Codify this):**
  *   New hires ask, "How do we do X?" and three different people give the same answer.
  *   People feel mild annoyance when someone violates it, even if nothing breaks.
  *   The behavior persists even when the person who started it leaves.
  *   **Action:** Write it down immediately. Label it "Current Practice." This reduces cognitive load.

  **Signs of a Genuine Vacancy (Catalyze this):**
  *   People ask, "What should we do?" and get silence or shrugs.
  *   Everyone solves the problem differently every time.
  *   There is friction, but it's blamed on "process," not specific behavior.
  *   **Action:** Do not just write it. You must create a **Focal Point**. (See Part 3).

  **[HUMAN JUDGMENT FLAG]:** Distinguishing between "nobody knows" and "nobody agrees" is political. If you suspect people *know* what to do but refuse to do it because they dislike the outcome, that is not a vacancy. That is resistance. Do not document resistance as a norm.

  ---

  ### Part 3: Levers for Arbitrary Choices

  If you pass the Decision Procedure and it's a genuine vacancy with multiple equal options, you need to make one option "shine" so people coordinate on it. Writing it down is rarely enough. Use these levers in order of cost:

  1.  **The Precedent Lever:** Find the team that is already doing it right. "Team Alpha is doing X, let's adopt that." (Cost: Low).
  2.  **The Tooling Lever:** Make the desired path the path of least resistance. If you want PR descriptions, make the template mandatory in GitHub. If you want trunk-based dev, restrict branch permissions. (Cost: Medium).
  3.  **The Flag Day:** Pick a date. Before this date, anything goes. After this date, we all switch. Good for time-zone coordination. (Cost: High coordination).
  4.  **The Visible Group:** Get the most respected senior engineers to do it publicly first. Conventions spread via imitation of high-status nodes. (Cost: Political capital).

  **[HUMAN JUDGMENT FLAG]:** Choosing *which* arbitrary option to pick is not technical. It is political. If Option A favors Backend and Option B favors Frontend, you cannot decide this. Hand to a Tech Lead.

  ---

  ### Part 4: Change, Decay, and the Credibility Tax

  Conventions die when the underlying incentives change. A written rule that is ignored is actively harmful.

  *   **The Credibility Tax:** Every time you write a rule that everyone ignores, the next rule you write is 20% less likely to be followed. After three ignored rules, your handbook is wallpaper.
  *   **Sunset Clause:** Every norm in the handbook should have a "Last Reviewed" date. If it hasn't been reviewed in 12 months, assume it's dead.
  *   **How to Move a Convention:**
      1.  **Acknowledge the Old:** "We used to do X because Y."
      2.  **State the Break:** "Y is no longer true."
      3.  **The Transition Period:** For 2 weeks, allow both. Then switch.
      4.  **Failure Rate:** Expect 50% of convention changes to fail in the first month unless tooling enforces them.
  *   **The Fix:** If a rule is being ignored, **delete it**. It is better to have no rule than a fake rule. A fake rule tells people: "Leadership doesn't know what's happening" or "Leadership doesn't care if we follow rules."

  ---

  ### Part 5: Running Your Three Scenarios

  Here is the procedure applied to your current inbox.

  #### 1. The Slack Norm ("Reply within 4 waking hours")

  *   **Coordination Test:** **FAIL.**
      *   *Analysis:* This benefits the sender (getting answers) but costs the receiver (context switching). It is not a mutual gain from matching; it is a service level agreement imposed on peers.
      *   *Lewis Check:* This is not a convention. It is a policy.
  *   **Decision:** **Do not write this as a norm.**
  *   **Recommendation:** Tell the requester: "This is an expectation of availability, not a coordination convention. It requires Director sign-off on 'Right to Disconnect' vs. 'Response Time' trade-offs."
  *   **Why:** If you write this without enforcement, senior engineers will ignore it to do deep work. Your handbook credibility drops. If you write it *with* enforcement, you need HR/Dir buy-in.

  #### 2. The Ignored PR Rule ("Second reviewer required, but rubber-stamped")

  *   **Coordination Test:** **PASS** (In theory, code quality helps everyone).
  *   **Enforcement Gap:** **FAIL.**
      *   *Analysis:* The natural consequence of skipping a review is bugs later. The immediate consequence is speed now. The incentive is misaligned. People are self-merging because the *system* allows it.
  *   **Diagnosis:** This is not a convention problem. This is a **tooling configuration problem**.
  *   **Decision:** **Delete the text. Fix the setting.**
  *   **Recommendation:** Do not write a memo. Go to the repo settings. Require 1 approval *before* merge is enabled. If they rubber-stamp, that's a culture issue, but at least the mechanic is there. If leadership won't allow branch protection, delete the rule from the handbook. It is currently a lie.
  *   **Credibility Check:** Keeping this rule in the handbook is actively damaging. It tells engineers "We say one thing and do another." Remove it until you can enforce it.

  #### 3. Trunk-Based Development ("Branches live max 1 day")

  *   **Coordination Test:** **PASS.** (Merge conflicts hurt everyone).
  *   **Arbitrariness Test:** **FAIL.** (Technically, shorter branches are objectively better for CI/CD, but "1 day" is arbitrary).
  *   **Enforcement Gap:** **FAIL.** (You can merge a 3-day branch without immediate pain, usually).
  *   **Diagnosis:** This is a **Workflow Migration**, not a norm setting. You cannot memo this into existence.
  *   **Decision:** **Do not announce this as a norm.**
  *   **Recommendation:**
      1.  **Tooling:** Configure CI to fail on branches older than 24 hours (or warn loudly).
      2.  **Visible Group:** Get one team to pilot it for a sprint.
      3.  **The Memo:** Only write the doc *after* the tooling is in place. The doc should explain *how* to work within the constraints, not *that* the constraints exist.
      4.  **Reality Check:** You said you'd prefer this to work by memo. **It will not.** Trunk-based development requires breaking the habit of "feature completeness" before "integration." That is a behavioral change that requires friction (tooling) to enforce. If you just write it, people will keep long branches because it feels safer. When they get merge conflicts, they will blame the "norm," not their behavior.

  ### Summary of the Frame

  **Where the Lewis Theory Holds:**
  It works perfectly for things like "How we name channels," "Timezone overlap hours," or "Commit message prefixes." These are pure coordination games. Everyone wins if we match. Writing these down is high-value.

  **Where the Lewis Theory Breaks (Org Reality):**
  It breaks when power dynamics enter. Lewis assumes players are equal. In your org, a Director can force a "convention" that actually hurts engineers. That is not a convention; it is a decree. Decrees require enforcement. If you treat a decree as a convention (writing it in the handbook without enforcement mechanisms), you create the "ignored rule" decay cycle.

  **Final Advice:**
  Your job is not to "set norms." Your job is to **identify existing coordination points and reduce the friction of matching.**
  *   If people are already matching: Write it down.
  *   If people want to match but can't agree: Provide the focal point (tooling/template).
  *   If people don't want to match (incentives differ): Tell leadership to fix the incentives, then walk away.

  If you follow this, you will write fewer docs, but the ones you write will actually be read.
