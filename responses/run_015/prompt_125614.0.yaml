  2.  **Recall/Research Wolf's "Moral Saints":**
      *   *Core Thesis:* A life dominated by moral concerns is not a rationally preferable ideal of personal well-being.
      *   *Definition of Moral Saint:* Someone whose every action is as morally good as possible (Utilitarian version) or someone who honors moral obligations as far as possible (Kantian version).
      *   *Two Types:*
          *   *Loving Saint:* Morality and inclination coincide. They *want* to do the moral thing. (e.g., Mother Teresa type). Problem: Their happiness is entirely bound up in moral activity. They lack non-moral hobbies/interests.
          *   *Rational Saint:* Morality and inclination conflict, but reason wins. They suppress desires to do duty. (e.g., Kantian dutiful person). Problem: They are repressed, humorless, potentially joyless.
      *   *Key Argument:* A life spent *only* on moral improvement leaves no room for "non-moral virtues" (wit, charm, culinary skill, artistic pursuit) that make life rich and interesting.
      *   *Harm vs. Lack:* Wolf argues it's *unattractive* or *less than ideal* for the individual, not necessarily "harmful" in a pathological sense, though it limits human flourishing.
      *   *Societal Claim:* She does suggest that if everyone were saints, we'd lose the diversity of talents that make culture rich (e.g., gourmet cooking vs. feeding the hungry). "Collapse" might be too strong, but "stagnation" or "loss of richness" is accurate.
      *   *Linearity:* Wolf generally treats the *demand* of morality as potentially infinite (maximizing), which crowds out other things. She doesn't explicitly model a "threshold" where morality becomes self-defeating, but her argument implies that *too much* focus on morality diminishes the self that does the moralizing.

