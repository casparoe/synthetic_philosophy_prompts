  5.  **Determine the Winner:**
      *   It's a classic stalemate in the field. Ines defends the internal consistency of MWI + Decision Theory. Hal defends the view that this requires extra philosophical assumptions that make it less parsimonious than it claims.
      *   *Score:* Draw, but Hal has the rhetorical upper hand on "what counts as an explanation," while Ines has the upper hand on "collapse theories aren't free."
