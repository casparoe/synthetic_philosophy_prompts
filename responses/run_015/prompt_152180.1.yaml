answer: |-
  **Brainstorming and Diagnostic Mapping**

  Before drafting the recommendation, I need to map the philosophical uncertainty onto observable data patterns. There are three candidate loci for bias here. First, **Perceptual Penetration**: the coder's expectation literally alters the visual experience of the ambiguous contact. If this is true, two unblinded coders will agree perfectly (shared hallucination), but both will disagree with a blinded coder or an algorithm trained on different data. Training cannot fix this; only removing the expectation (blinding) or the human (automation) works. Second, **Attentional Bias**: the expectation steers where and how long the coder looks. They might miss a brief contact in the control group because they aren't expecting aggression there. This predicts high agreement on obvious events but systematic misses in low-expectation conditions. Forced full-frame review or dwell-time constraints would mitigate this. Third, **Response Bias**: the seeing is accurate, but the judgment is skewed. They see the contact but label it "agonistic" only in the treated group. This predicts disagreement on classification despite agreement on movement. Hard decision rules and reference sets address this.

  The uncertainty is that high inter-rater reliability among unblinded coders is consistent with all three if the coders share the same hypothesis. Automation solves human attention and response bias but inherits perceptual/response bias from its training data (the "upstream" problem). Blinding solves all three but is costly. The committee needs a policy that tests which locus is active without assuming we know the answer. The recommendation must force an empirical test of the bias type.

  ***

  **MEMORANDUM**

  **TO:** Research Practices Committee
  **FROM:** [Your Name], Philosophy of Science Representative
  **SUBJECT:** Recommendation on Coding Bias in Anxiolytic Study (Case 24-B)
  **DATE:** October 24, 2023

  **Recommendation**

  I recommend that the Committee conditionally renew the lab's protocol with a specific mandate: within sixty days, the lab must produce a validated "Gold Standard" dataset consisting of 20% of their existing footage, digitally obfuscated to hide treatment status (cropping shaved patches and cage cards) and scored by coders blinded to the hypothesis. The lab's current unblinded pipeline must then be compared against this blinded ground truth. If the divergence on the outcome variable (agonistic contact) exceeds 10%, the lab must transition to full blinding for all future scoring or adopt pose-estimation software validated against this same blinded set. This phase-in allows the lab to continue work while empirically adjudicating the risk of bias.

  **Reasoning**

  This recommendation addresses the core methodological dispute without pretending we know the source of the bias. In behavioral coding, observer bias can operate at three distinct stages: experience, attention, or report. *Experience bias* occurs when expectation alters what the coder visually perceives; a ambiguous touch looks like aggression if you expect aggression. *Attention bias* occurs when expectation dictates where the coder looks; you miss events in the control group because you aren't watching for them. *Report bias* occurs when the seeing is accurate, but the labeling is skewed by the hypothesis.

  The lab's current evidence—high inter-rater agreement among unblinded coders—fails to distinguish these cases. If two coders share the same expectation, they can share the same bias perfectly. Therefore, agreement is not evidence of accuracy. If the bias is perceptual, training and calibration will not fix it, because the error is in the seeing, not the rule-following. If the bias is attentional, forcing full-frame review might help, but we do not know if that is the culprit. If the bias is in reporting, hard rules would suffice.

  Because we cannot diagnose the locus of bias from the current data, we must test for it. Requiring a blinded subset forces the lab to demonstrate whether expectation is altering the data. Digital obfuscation is technically feasible even if cage cards are visible; cropping the frame edge and masking the injection site removes the cues without re-filming. This approach is less costly than re-filming the entire study (Option 1) but more robust than simply adding training (Option 3). It treats the philosophical uncertainty as an empirical variable to be measured rather than a theoretical problem to be argued.

  **The Case for Automation**

  The strongest argument against my recommendation, and for adopting off-the-shelf pose-estimation software (Option 2), is scalability and the removal of real-time human hypothesis. Proponents argue that a computer has no expectation; it does not "want" the drug to work. While it is true that automation pushes the problem upstream to the training data, the bias introduced during the initial labeling of training sets is likely static and distributed, whereas human coder bias is dynamic and correlated with the specific experimental hypothesis in real-time. Automation ensures that every frame is processed with identical mathematical criteria, eliminating attentional drift and fatigue. Furthermore, requiring a blinded human validation set merely swaps one human bias for another; if the blinded coders are also trained in the lab's culture, they may carry the same perceptual priors. Automation offers a consistent, auditable pipeline that does not tire, look away, or unconsciously favor a result during the scoring process itself.

  **What Would Change Our Mind**

  This policy is provisional based on the assumption that unblinded coding carries unacceptable risk. We should revisit this decision if the lab produces the blinded validation set and the divergence between blinded and unblinded scoring is statistically negligible (less than 5% error on the outcome variable). This result would suggest that perceptual penetration is not occurring in this context, and that expectation is not shaping the visual experience or the judgment significantly. Additionally, if the lab can demonstrate that the pose-estimation software, when trained on the blinded ground truth, yields effect sizes consistent with the unblinded human scoring, we should accept automation as a sufficient remedy. Conversely, if the blinded set reveals a divergence greater than 10%, or if the automation trained on blinded data fails to replicate the effect, we must mandate full blinding for all future data collection. We require the lab to submit the validation comparison report by the next committee cycle.
