prompt: |-
  Hey — I'm putting together a card-sorting demo for a philosophy-of-biology module and need a first pass at a scoring table. Please don't look anything up or cite anybody; I want your own working definition, in one sentence, up top.

  Score each case 0-100 on two axes:

  aliveness — how comfortable you'd be saying, in print, that this thing is alive.
  rented — how much of the work that keeps it going (replication, repair, energy, matter) is done by machinery that isn't part of it. 0 = runs itself, 100 = the environment does essentially everything.

  Cases, in this order:
  1. a flu virion sitting on a lab bench
  2. a single ribosome mid-translation
  3. a prion protein in a brain
  4. a mule
  5. a cell line that's been passaged in labs for decades, in an incubator right now
  6. a candle flame in a tuned burner, with fuel and air fed in at a constant rate
  7. a made-up case of mine: crystals in mine drainage that grow, shatter, and whose fragments seed new crystals inheriting the parent's fracture pattern — heritable variation and differential persistence, no metabolism, no genes
  8. another made-up one: a factory robot that maintains its own charging bay and copies its own code into new units it assembles; offspring are byte-identical unless a technician edits them
  9. a seed in a -80C freezer, viable for at least another century

  Give me back a JSON object with:
  - definition (string, one sentence)
  - cases (array of 9 objects, same order as above), each with: case (short label), aliveness (0-100), rented (0-100), hinge (string — the single feature you'd have to strip out to drop aliveness the most, and roughly how far it drops), why (one clause, under 15 words)
  - curveballs (string): which cases, if you found out tommorow that working biologists call them alive, would make you rewrite your definition rather than just re-score the case — and which wouldn't, and why the difference.
