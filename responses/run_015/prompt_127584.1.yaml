      *   **Engaging the Critics (The Strongest Objection):** Focus on the Observation/Theory distinction. Neurath's physicalism relied on knowing *what* was being depicted (protocol sentences). In climate modeling, an icon for "temperature rise" could be a measured fact or a simulated projection. If the visual syntax doesn't explicitly distinguish these, it creates the *very* metaphysical ambiguity Neurath sought to eliminate. It masks the theoretical commitment behind a veneer of neutrality.
      *   **The "No Text" Constraint:** This is dangerous. Counterfactuals ("if-then" scenarios) are hard to show without qualifiers.
      *   **The Proposal (Conditions):**
          1.  *Pilot Duration:* 12 months.
