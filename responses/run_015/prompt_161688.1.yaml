answer: |-
  **DRAFT FOR REVIEW**
  **Subject:** Framework for Adversarial Collaboration on Interpersonal Comparisons in Health Allocation
  **To:** Technical Advisory Panel, National Health Technology Assessment Body
  **From:** [Your Name/Role]
  **Date:** October 26, 2023

  ### 1. Agreed Claims and Formal Premises

  We, the undersigned members of the Technical Advisory Panel, acknowledge a persistent disagreement regarding the epistemic status of the inputs used in our cost-effectiveness models. To clarify the nature of this disagreement and its consequences for policy, we agree to the following formal and procedural claims:

  1.  **The Necessity of a Social Welfare Function (SWF):** We agree that allocating a fixed budget across patient groups necessarily implies the use of a Social Welfare Function, whether explicit or implicit. Our current practice of ranking interventions by expected Quality-Adjusted Life Years (QALYs) gained formally corresponds to a utilitarian SWF ($W = \sum w_i$). The optional "equity weight" corresponds to a prioritarian or weighted utilitarian SWF ($W = \sum g(w_i) \cdot w_i$, where $g$ is a function of baseline status).
  2.  **The Informational Basis of Judgment:** We agree that the validity of any specific SWF depends on the *informational basis* available regarding individual well-being. We accept the formal taxonomy of informational constraints derived from social choice theory. Specifically, we agree to utilize the **W-Index Thought Experiment** to categorize our epistemic position:
      *   *Scenario A (Full Comparability):* The observer knows the true well-being function for each person $i$ up to a common transformation ($w_i = a + b \cdot \text{true}_i$, where $a$ and $b$ are identical for all $i$).
      *   *Scenario B (Bounded-Ratio Unit Comparability):* The observer knows the ratio of units between persons lies within a specific band, but zero-points (origins) remain person-specific and unknown.
      *   *Scenario C (Ordinal Non-Comparability):* The observer knows only the ordinal ranking of states for each individual, with no knowledge of the magnitude of differences or the alignment of levels between persons.
  3.  **Formal Licensing of Decision Rules:** We agree on the mathematical implications of the W-Index scenarios for our decision rules:
      *   *Plain Sum-Ranking:* Requires at least Unit Comparability (Scenario B). It is not licensed under Ordinal Non-Comparability (Scenario C).
      *   *Priority-Weighted Sum-Ranking:* Requires Unit Comparability (Scenario B). It is sensitive to the "shape" of well-being gains but does not strictly require Level Comparability if weights are based on marginal utility rather than absolute baseline levels.
      *   *Maximin (Prioritizing the Worst Off):* Requires Full Comparability of Levels (Scenario A). It is mathematically incoherent under Scenario B, as "worst off" cannot be defined without common zero-points.
  4.  **The Status of Current Practice:** We agree that our current operational use of QALYs *presupposes* Scenario A or B. We treat the QALY scale as having a common zero (death) and common units (1 year in perfect health) across all patients. We acknowledge that if reality corresponds to Scenario C, our current rankings are scientifically underdetermined.
  5.  **The Empirical Test:** We agree to commission and review a study administering three independent instruments to a large, diverse sample ($N > 5,000$):
      *   (i) Global Life-Satisfaction Surveys (0-10 scale).
      *   (ii) Experience Sampling of Momentary Affect (aggregated).
      *   (iii) Trade-off/Willingness-to-Pay Tasks.
      *   *Method:* All instruments will employ anchoring vignettes to correct for differential item functioning (i.e., to adjust for the fact that different people may use response scales differently).
      *   *Goal:* To test for convergence in interpersonal orderings and gain-ratios across instruments and subpopulations.

  ### 2. Disagreements Table

  The following table isolates the specific points of divergence. We commit to populating the "Evidence" column jointly after the Empirical Test results are in, but we record our *a priori* positions and predictions here.

  | Crux | Sceptic's Formulation (Ordinalist) | Comparabilist's Formulation (Cardinalist) | Agreed Evidence / Argument Bearing on Crux | Sceptic's Prediction | Comparabilist's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontology of IPC**<br>(Interpersonal Comparison) | IPC is not a fact of the matter but a normative stipulation. There is no "fact" about whether my pain is worse than yours, only a convention to treat it as such for policy purposes. | IPC is a fact of the matter, accessible via extended sympathy and psychometrics. While noisy, the proposition "Person A is suffering more than Person B" is truth-apt. | Philosophical argument on the nature of mental states; Neuroscientific evidence on pain processing; Phenomenological reports. | No amount of neural data bridges the gap between "physical state" and "experienced value." | Convergence of neural markers and self-report supports the reality of a common scale. |
  | **2. The Zero-Point Problem**<br>(Levels vs. Differences) | The objection is primarily about *levels* (zeros). We cannot know if a depressed person's "5" is lower than an optimist's "2". Therefore, Maximin is unjustified. | The objection is often about *units*, but anchoring vignettes solve the zero-point problem by calibrating scale use. We can identify absolute deprivation. | Results of the Empirical Test using anchoring vignettes. Do corrected scores align on a common absolute scale? | Vignettes only standardize *language*, not *experience*. Convergence shows shared reporting norms, not shared internal zeros. | Vignette correction will reveal a stable underlying distribution of well-being levels across demographics. |
  | **3. Interpretation of Convergence**<br>(The Empirical Test) | If the three instruments correlate, it shows coherence among our *conventions* of measurement, not the existence of a single underlying entity ("True Well-Being"). | If the three instruments correlate, it constitutes evidence of *construct validity*. Independent measures tracking the same variance implies a common reality. | Statistical analysis of the Empirical Test (factor analysis, convergent validity coefficients). | High correlation will be observed, but it will be driven by cultural norms on how to answer surveys. | High correlation will be observed, robust across subcultures, indicating a universal psychological construct. |
  | **4. The Equity Weight**<br>(Measurement vs. Morality) | The "extra weight for the worse off" is a moral parameter smuggled in under a measurement label. It is a value judgment, not a discovery of measurement properties. | The weight reflects the diminishing marginal moral value of well-being. This is a moral truth, but it tracks the measurable reality that gains matter more to those with less. | Ethical reasoning; Public consultation on distributive preferences. | This is purely distributive ethics. It should be voted on by legislators, not derived from QALY calculations. | This is ethical *and* empirical. The "diminishing value" is a feature of the well-being function itself. |

  ### 3. Assessment of Verbal Disputes and Resolution

  **3.1 Identification of Verbal Disagreement**
  A significant portion of our divergence appears to rest on the definition of **"Measurement."**
  *   **The Sceptic** operates with a definition of measurement closer to fundamental physics (ratio scales with non-arbitrary zeros, independent of observer values). By this definition, well-being is not "measured," only "indexed."
  *   **The Comparabilist** operates with a definition of measurement closer to psychometrics (construct validation, where a latent variable is inferred from multiple fallible indicators). By this definition, well-being is "measured" in the same sense that intelligence or inflation is measured.

  *Assessment:* This is not *merely* verbal. It reflects a deeper meta-ethical disagreement about whether value is mind-independent (realism) or mind-dependent (constructivism). However, clarifying the definition of measurement would reduce rhetorical heat. We agree to use the term **"Calibrated Indexing"** in future drafts where "Measurement" triggers ambiguity.

  **3.2 Can the Dispute Be Ended?**
  Honest assessment: **No.**
  The disagreement is not resolvable by further data alone.
  *   If the Empirical Test shows high convergence, the Sceptic will classify it as "coherent convention."
  *   If the Empirical Test shows low convergence, the Comparabilist will classify it as "measurement error needing refinement."
  The dispute is ultimately about the *authority* of the panel to make interpersonal judgments. The Sceptic views this authority as illegitimate without legislative mandate; the Comparabilist views it as inherent to the role of a health allocator.

  **3.3 Recommendation for the Panel**
  Since the scientific dispute is intractable, the Panel should adopt an **Explicit Convention**.
  We recommend the following statement be appended to all guidance documents:

  > *"The Panel acknowledges that interpersonal comparisons of well-being are not scientifically verifiable in the same manner as biological metrics. The use of QALYs and equity weights represents a normative commitment to treat reported well-being as interpersonally comparable for the specific purpose of resource allocation. This is a policy convention adopted to ensure consistency and transparency, not a claim of metaphysical discovery."*

  This allows the Comparabilist to proceed with the necessary calculations while satisfying the Sceptic's demand for intellectual honesty regarding the normative stipulation involved.

  ***

  **Signatures:**

  _________________________ (The Sceptic) Date: __________

  _________________________ (The Comparabilist) Date: __________
