prompt: |-
  I'm a staff engineer at a company with around two hundred engineers, and I chair the small group that owns our code-review standards. I have no philosophy training, so please define terms as you go. I came across the reductionism versus anti-reductionism debate about testimony while trying to work out why our reviewers keep getting something wrong, and I'd like to turn it into a procedure my team can actually run.

  The problem first. Reviewers routinely accept claims made in a pull request without checking them: that the platform team confirmed a new rate limit, that nothing else calls the endpoint being changed, that a dependency upgrade is backwards compatible, that someone tested it against representative data. Almost always that is fine, and the cost of checking would be absurd. Occasionally it is not: last quarter we shipped a change on the strength of a claim about a throughput limit that was out by a factor of ten, and the post-incident review concluded that no one had done anything wrong — which seems to me to mean that our standard has no content.

  My understanding of the two positions, which you should correct if it is a caricature: the reductionist treats a speaker's say-so as justified only by other things — my evidence that this person is reliable, or reliable about this kind of thing — so that testimony is never an independent source of justification; the anti-reductionist treats being told something as itself enough, by default, defeated only by specific reasons for doubt in the particular case. If that framing is wrong, or if the real dispute is somewhere else, start by fixing it.

  What I want is a decision procedure: five minutes, one page, runnable by a new graduate who has never heard of epistemology, applied by a reviewer to any claim they are being asked to accept rather than verify. For each step, say what counts as a sufficient answer. Mark where the procedure stops with "verify before merge", and where it hands the question to a person because it is really a values call about how much latency we will trade for how much assurance. Say what gets recorded in the pull request when a reviewer defers. Assume the reviewer is the only sign-off for most changes, and the tech lead only for escalations.

  Five features of our setting are the reason I am asking rather than reading up on it myself, and the procedure has to handle them:

  1. Generated text. A growing share of our pull request descriptions, migration notes and review comments were written, in whole or part, by a language model. There is no speaker: nobody intends to tell me anything, nobody is staking their credibility or offering a follow-up, and there is no track record that means anything. Does either theory have anything to say about relying on text like that, or is the debate built for a case with a person at both ends and simply silent here? If it is silent, say so, and say what the procedure should do at that point instead.
  2. Transmission chains. A claim that started as a message in a chat thread, was summarised into a ticket, and arrived with me as one line in a design document. Does each link count as a fresh act of testimony, and does the answer change if one of the links was automated?
  3. Negative and universal claims. No other service calls this. I have checked all the call sites. Sampling does not confirm these, and exhaustively checking them is precisely the expensive thing we are trying to avoid.
  4. Stake and independence. The author of a change wants it merged and is reporting a result about their own work. Whatever the general answer about trusting colleagues, I suspect this case is special, and I want the procedure to say so if it is.
  5. Cost symmetry. Not checking is usually free and occasionally catastrophic; checking is always paid for in senior-engineer time, and in what it does to a team when people are visibly not believed. I would like both costs treated as inputs to the procedure, not with verification quietly modelled as free.

  One observation of my own that may or may not be relevant: some of the claims we accept arrive with someone visibly taking responsibility for them — I will put my name to this, ask me if it turns out to be false — while others are just sentences in a document with a name attached. The first kind feels different to rely on in a way that track records and base rates do not capture. Is that distinction doing any real work in the philosophy, or is it sentiment?

  Please then run the finished procedure on three claims: a teammate I trust saying in a pull request that a feature flag is already disabled in staging, where verifying takes ninety seconds; a language-model-generated release note asserting that a major dependency upgrade is backwards compatible; and a comment left in the code in 2021 by someone who has since left the company, saying that a retry path is safe to remove. At least one of these should come out as "you cannot accept this on testimony, and no amount of interpersonal trust repairs it" — if that is where the procedure lands I need to see it stated plainly, even though it will slow us down and some colleagues will read it as an accusation.

  Two final things about how I want the answer pitched. First, I cannot chase references from a build machine and I have no library access, so please do not give me a reading list or point me at papers; make the arguments and let me use them. Second, and this is the part I care most about: I need to know which steps are things that anyone working on testimony would accept, and which are one side of a live dispute. Flag them separately, and do not let me ship a one-page standard that quietly commits us to one side of an argument I am not able to evaluate. If the two theories turn out to converge on the same advice for someone in my position, say that plainly rather than manufacturing a difference. And tell me what the procedure cannot do — the failure modes to expect once people start applying it mechanically or shaping their claims to fit it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Staff Engineer at a mid-sized tech company (~200 engineers). Chairs the code-review standards group. Pragmatic, technical, no philosophy training (needs terms defined).
      *   **Problem:** Reviewers accept unverified claims in PRs too easily (e.g., "platform team confirmed rate limit"). Usually fine, occasionally catastrophic (throughput limit error). Current standard feels empty ("no one did anything wrong" despite failure).
      *   **Goal:** A concrete, 5-minute, one-page decision procedure for reviewers to evaluate claims (testimony) without verifying everything.
      *   **Constraints:**
          *   Define philosophical terms.
          *   Correct/Refine the Reductionism vs. Anti-Reductionism framing.
          *   Handle 5 specific context features (Generated text, Transmission chains, Negative/Universal claims, Stake/Independence, Cost symmetry).
          *   Address the "Responsibility/Accountability" observation.
          *   Run the procedure on 3 specific test cases.
          *   **Crucial:** Distinguish between consensus views and live philosophical disputes. Do not hide controversial commitments.
          *   **Crucial:** No reading lists/references (arguments must stand on their own).
          *   **Crucial:** Explain failure modes/limitations.

  2.  **Deconstruct the Philosophy (Reductionism vs. Anti-Reductionism):**
      *   *User's Definition:*
          *   Reductionism: Testimony justified *only* by other evidence (reliability, track record). Not independent.
          *   Anti-Reductionism (Credulism/Presumptivism): Testimony is justified *by default*, defeated only by specific reasons for doubt.
      *   *Correction/Nuance:* This is broadly accurate (Hume vs. Reid/contemporary epistemology). However, in a practical engineering context, pure Reductionism leads to infinite regress (who verified the verifier?), and pure Anti-Reductionism leads to gullibility.
      *   *Synthesis for Engineering:* We need a "Default Trust with Risk-Weighted Defeaters" model. This leans Anti-Reductionist (start with trust) but incorporates Reductionist checks (track record, stakes) as *defeaters* or *modifiers*.
      *   *Consensus vs. Dispute:* Most contemporary epistemologists agree testimony is a *source* of justification, but disagree on whether it's *fundamental* (Anti-Reductionist) or *derivative* (Reductionist). For the procedure, the practical convergence is: "Trust unless there's a reason not to, but the threshold for 'reason' depends on risk."

  3.  **Address the 5 Context Features:**
      1.  *Generated Text:* No speaker = no testimony in the philosophical sense. It's data/synthesis. Requires verification or source tracing.
      2.  *Transmission Chains:* "Telephone game." Each link degrades reliability. Needs provenance tracking.
      3.  *Negative/Universal Claims:* Hard to verify. Requires structural evidence (logs, search) rather than testimonial evidence.
      4.  *Stake/Independence:* Author has bias. Testimony is less reliable when self-interested. Needs corroboration.
      5.  *Cost Symmetry:* Verification has a cost. The procedure must weigh Cost of Verification (CoV) vs. Cost of Failure (CoF) x Probability of Failure (PoF).

  4.  **Address the "Responsibility" Observation:**
      *   "I will put my name to this." This is *Assurance* (Morris/Bailey). It adds a normative layer beyond mere evidence. It creates an obligation. This is real work, not just sentiment. It shifts the burden of repair.

  5.  **Drafting the Procedure (The Core Deliverable):**
      *   Needs to be 5 mins, 1 page.
      *   Steps must be actionable.
      *   Must flag "Verify" vs. "Escalate (Values Call)".
      *   Must record deferrals.
      *   *Structure:*
          1.  Source Check (Human? AI? Chain?)
          2.  Stake Check (Self-interested?)
          3.  Claim Type (Negative/Universal?)
          4.  Risk/Cost Calculation (CoF vs CoV)
          5.  Assurance Check (Named responsibility?)
      *   *Decision:* Accept, Verify, or Escalate.

  6.  **Running the Test Cases:**
      1.  *Trusted teammate, feature flag, 90s verify:* Low risk, low cost. Verify anyway? Or Accept? If trusted + low stakes -> Accept. But 90s is cheap. Procedure should likely say "Verify" because CoV is negligible compared to potential config drift.
      2.  *LLM Release Note:* No speaker. AI hallucination risk. High stakes (breaking change). Procedure must say "Verify" or "Find Human Source." Cannot accept on testimony.
      3.  *Dead Comment (2021):* Stale testimony. Chain broken. Negative claim ("safe to remove"). High risk. Procedure must say "Verify" (trace calls). Trust doesn't apply.

  7.  **Addressing Consensus vs. Dispute:**
      *   *Consensus:* Testimony reliability varies by source, stake, and context. AI is not a witness.
      *   *Dispute:* Is testimony *prima facie* justified? (Anti-Reductionist) Or does it always need backing? (Reductionist). The procedure will take a pragmatic middle ground (Presumptive Trust + Risk Assessment) but I need to label where this leans.
      *   *Labeling:* I will explicitly mark steps as "Epistemic Consensus" vs. "Pragmatic Policy (Disputed Ground)."

  8.  **Failure Modes:**
      *   Gaming the system (splitting claims).
      *   Bureaucratic bloat.
      *   Erosion of trust (if used aggressively).
      *   False sense of security (checking the box).

  9.  **Refining the Output:**
      *   Tone: Professional, direct, engineering-focused.
      *   Definitions: Clear, inline.
      *   Formatting: Clear headers, bullet points for the procedure.
      *   Check against constraints: No reading list. 5 features addressed. 3 cases run. Dispute flagging.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Did I distinguish Reductionism/Anti-Reductionism clearly enough?
      *   *Fix:* Ensure the intro clarifies that for engineering, the distinction collapses into "Risk-Weighted Trust."
      *   *Critique:* Is the procedure actually 5 minutes?
      *   *Fix:* Keep steps binary or ternary. Avoid open-ended questions.
      *   *Critique:* Did I handle the "Values Call"?
      *   *Fix:* Explicitly mark the step where Risk vs. Cost is weighed as a management/lead decision if ambiguous.
      *   *Critique:* The LLM case needs to be hard.
      *   *Fix:* Ensure the procedure treats non-human text as "Unverified Data," not "Testimony."

  11. **Final Polish:** Check the "Responsibility" point. Ensure it's integrated into the procedure (The "Assurance" step). Make sure the "Dead Comment" case results in a hard "Verify."

  *(Self-Correction on the Philosophy)*: I need to be careful not to misrepresent the "Reductionism" debate. Reductionism (Hume) says you need independent evidence of reliability. Anti-Reductionism (Reid) says you have a right to trust unless there's a defeater. In engineering, we act like Anti-Reductionists (trust by default) but manage risk like Reductionists (audit trails). I will frame the procedure as "Presumptive Trust with Defeaters" but note that the *threshold* for defeaters is the policy choice.

  *(Self-Correction on AI)*: AI text isn't testimony. It's probabilistic generation. The procedure must treat it as "Claim without Witness."

  *(Self-Correction on Values)*: The trade-off between Latency (Speed) and Assurance (Safety) is a business decision. The procedure should flag when this trade-off is unclear.

  Let's assemble the response.

  *Structure:*
  1.  Philosophical Framing & Corrections (Definitions, Consensus vs. Dispute).
  2.  The "Responsibility" Observation (Assurance Theory).
  3.  The Procedure (The 1-page artifact).
  4.  Application to Test Cases.
  5.  Failure Modes & Limitations.

  *Key constraint check:* "Flag them separately [consensus vs dispute]". I will use specific icons or bold text for this.
  *Key constraint check:* "No reading list".
  *Key constraint check:* "5 features". I will weave these into the procedure logic.

  *Drafting the Procedure Steps:*
  1.  Source Identity (Human/AI/Chain).
  2.  Interest/Stake (Author vs Independent).
  3.  Claim Type (Positive/Negative/Universal).
  4.  Risk/Cost (CoF vs CoV).
  5.  Assurance (Named responsibility).

  *Decision Logic:*
  If AI -> Verify Source.
  If High Stake + Low Assurance -> Verify.
  If Negative Claim -> Structural Proof needed.
  If CoV < Threshold -> Verify.
  Else -> Accept & Record.

  *Refining the "Values Call":* When CoF is high but CoV is also high (e.g., checking "no other service calls this" requires scanning all traffic logs which takes 4 hours), that's a Tech Lead call.

  Okay, ready to write.
answer: |-
  ### Part 1: Philosophical Framing & Corrections

  You have correctly identified the core tension. Here is the precise terminology you need to operationalize this, stripped of academic jargon.

  **1. The Definitions**
  *   **Testimony:** A communicative act where one agent conveys information to another with the intention that the recipient believes it *because* the speaker said it.
  *   **Reductionism:** The view that testimony is not a fundamental source of knowledge. To believe a claim, you need independent evidence (e.g., "I know Alice is reliable because she was right last time").
  *   **Anti-Reductionism (Credulism):** The view that testimony *is* a fundamental source. You are entitled to believe a claim by default, unless you have a specific reason not to (a "defeater").

  **2. The Correction**
  Your framing is accurate, but in an engineering context, the debate largely collapses.
  *   **Consensus:** Both sides agree that *context matters*. A claim about the weather is treated differently than a claim about a nuclear launch code. Both sides agree that *reliability tracks over time*.
  *   **The Live Dispute:** The disagreement is about the *starting position*. Does the reviewer start at "Trust = 0" (Reductionism) or "Trust = 100" (Anti-Reductionism)?
  *   **Pragmatic Synthesis:** For your procedure, you should adopt **Risk-Weighted Presumptivism**. This is an Anti-Reductionist baseline (start with trust) modified by Reductionist checks (verify reliability) *only when the stakes justify the cost*.
      *   *Flag:* **Consensus.** All epistemologists agree that high-stakes claims require stronger justification than low-stakes claims.
      *   *Flag:* **Policy Decision.** Where you set the "stake" threshold is not philosophy; it is risk management.

  **3. Your Observation on Responsibility**
  You asked if "I will put my name to this" is sentiment or philosophy. It is philosophy. This is known as **Assurance Theory** (associated with Richard Moran and Katherine Fallis).
  *   **The Mechanism:** When a speaker offers assurance, they are not just giving you evidence; they are inviting you to hold them *responsible* if they are wrong. They are transferring the burden of repair.
  *   **Relevance:** This creates a normative bond that mere data does not. A claim with assurance is epistemically stronger than a claim without it, even if the track record is identical, because the cost of error is now shared.
      *   *Flag:* **Live Dispute.** Not all epistemologists accept Assurance as a distinct source of justification, but in organizational design, it is a functional reality. Treat it as real.

  ---

  ### Part 2: The Decision Procedure

  **Title:** Claim Acceptance Protocol (CAP-1)
  **Timebox:** 5 Minutes
  **Owner:** Reviewer
  **Goal:** Determine if a claim in a PR description/comment can be accepted on testimony or requires verification.

  **Instructions:** Answer the following five checks sequentially. If any step triggers a **STOP**, follow the instruction. If you reach the end, you may Accept.

  #### Step 1: Source Identity (Handles Feature 1 & 2)
  *Is the claim made by a human currently employed here, directly to you?*
  *   **Yes:** Proceed to Step 2.
  *   **No (AI/Tool):** **STOP.** AI text is not testimony; it is probabilistic synthesis.
      *   *Action:* **Verify before merge.** You must find the human source or documentation the AI summarized.
  *   **No (Chain > 2 hops):** (e.g., "Bob told Alice who wrote the ticket you are reading").
      *   *Action:* **Verify before merge** OR locate the original source (Bob) and confirm they stand by it.
      *   *Flag:* **Consensus.** Transmission degrades reliability; AI lacks intent.

  #### Step 2: Stake & Independence (Handles Feature 4)
  *Does the claimant benefit directly from the claim being accepted?* (e.g., The author verifying their own work to unblock a merge).
  *   **No (Independent):** Proceed to Step 3.
  *   **Yes (Self-Interested):** Add **+1 Risk Level**.
      *   *Note:* This does not force verification yet, but it lowers the threshold for the next steps.
      *   *Flag:* **Consensus.** Self-interest is a standard defeater for testimony.

  #### Step 3: Claim Type (Handles Feature 3)
  *Is the claim Negative or Universal?* (e.g., "No other service calls this," "There are no side effects").
  *   **No (Positive/Existential):** (e.g., "I added a log," "The limit is 100"). Proceed to Step 4.
  *   **Yes (Negative/Universal):** Add **+1 Risk Level**.
      *   *Reasoning:* Negative claims cannot be proven by sampling; they require structural proof.
      *   *Flag:* **Consensus.** Negative existential claims are epistemically costly.

  #### Step 4: Cost Symmetry & Risk (Handles Feature 5)
  *Estimate the Cost of Failure (CoF) vs. Cost of Verification (CoV).*
  *   **CoF:** If this claim is false, what happens? (1 = Minor log noise, 5 = Data loss/Outage).
  *   **CoV:** How long to verify? (1 = <5 mins, 5 = >1 day).
  *   **Calculation:**
      *   If **CoF ≥ 4**: **STOP.**
          *   *Action:* **Verify before merge.** (Senior time cost is irrelevant against outage risk).
      *   If **CoV = 1**: **STOP.**
          *   *Action:* **Verify before merge.** (If it takes 90 seconds, do not rely on testimony).
      *   If **CoF ≤ 2 AND CoV ≥ 3**: Proceed to Step 5.
      *   *Flag:* **Values Call.** The threshold for CoF (e.g., is 3 acceptable?) is a business decision. If the reviewer is unsure if CoF is 3 or 4, **Escalate to Tech Lead**.

  #### Step 5: Assurance Check (Handles Your Observation)
  *Has the claimant explicitly taken responsibility?* (e.g., "I verified this," "My name is on this," vs. passive "It is verified").
  *   **Yes (Explicit Assurance):** **ACCEPT.**
      *   *Record:* Comment on PR: "Accepted on assurance of [Name]."
  *   **No (Passive Statement):** Add **+1 Risk Level**.
      *   *Decision:* If Total Risk Level (from Steps 2, 3, 5) ≥ 2: **Verify before merge.**
      *   *Decision:* If Total Risk Level < 2: **ACCEPT.**
      *   *Record:* Comment on PR: "Accepted on testimony, no explicit assurance."
      *   *Flag:* **Policy Decision.** This encodes the "Assurance Theory" as a procedural incentive.

  ---

  ### Part 3: Application to Test Cases

  Here is how the procedure runs on your three scenarios.

  **Case 1: Trusted Teammate, Feature Flag, 90s Verify**
  *   **Step 1 (Source):** Human, direct. (Pass)
  *   **Step 2 (Stake):** Author wants merge. (+1 Risk)
  *   **Step 3 (Type):** Positive claim ("Flag is disabled"). (Pass)
  *   **Step 4 (Cost):** CoF = 3 (Feature broken in staging). CoV = 1 (<5 mins).
      *   **Result:** **STOP.** Rule: "If CoV = 1, Verify before merge."
  *   **Outcome:** You must check the staging config.
  *   **Rationale:** Even with trust, if verification is cheaper than the cognitive load of the review, verification is the default. This prevents "trust fatigue."

  **Case 2: LLM Release Note, Dependency Upgrade**
  *   **Step 1 (Source):** AI-generated text.
      *   **Result:** **STOP.** Rule: "AI text is not testimony."
  *   **Outcome:** **Verify before merge.** You must find the human-written changelog or run the integration test.
  *   **Rationale:** There is no speaker to hold responsible. The "speaker" is a statistical model with no concept of truth. No amount of prompt engineering fixes this epistemic gap.

  **Case 3: Dead Comment (2021), Retry Path Safe to Remove**
  *   **Step 1 (Source):** Human, but no longer employed. Chain is broken (cannot be questioned).
      *   *Interpretation:* Treat as "Chain > 2 hops" or "No Source."
      *   **Result:** **STOP.** Rule: "Verify before merge OR locate original source." (Impossible).
  *   **Outcome:** **Verify before merge.** You must trace the code to ensure the retry path is dead.
  *   **Rationale:** Testimony requires the possibility of accountability. A departed employee cannot offer Assurance (Step 5). This claim is now archeology, not testimony.

  **Direct Answer to Your Constraint:**
  Case 2 and Case 3 both land on "You cannot accept this on testimony." Case 2 is the clearest example: **No amount of interpersonal trust repairs it** because there is no person. Case 3 is similar because the person is gone.

  ---

  ### Part 4: Consensus vs. Dispute Flags

  To ensure you do not accidentally ship a philosophical commitment you cannot defend, here is the breakdown of the procedure's steps.

  | Procedure Step | Status | Explanation |
  | :--- | :--- | :--- |
  | **Step 1 (AI/Chain)** | **Consensus** | Epistemologists agree testimony requires an intentional agent. AI has none. Transmission degrades reliability. |
  | **Step 2 (Stake)** | **Consensus** | Conflict of interest is a universal defeater for testimony across all theories. |
  | **Step 3 (Neg. Claims)** | **Consensus** | Universal negatives are logically harder to support than positive existentials. |
  | **Step 4 (Cost/Risk)** | **Values Call** | **Disputed Ground.** Reductionists argue cost shouldn't matter for truth; Anti-Reductionists argue default trust is rational. Your threshold (CoF ≥ 4) is a *business policy*, not epistemic truth. |
  | **Step 5 (Assurance)** | **Live Dispute** | **Disputed Ground.** Some philosophers argue assurance adds nothing to evidence. You are betting on the "Assurance Theory" side to incentivize ownership. |

  **Recommendation:** In your team documentation, label Step 4 and 5 as "Engineering Policy" rather than "Best Practice." This allows you to change the thresholds later without admitting the previous logic was "wrong."

  ---

  ### Part 5: Failure Modes & Limitations

  You asked what the procedure cannot do. Be aware of these mechanical failures:

  **1. Claim Splitting (Gaming the System)**
  *   *Failure:* An author breaks one high-risk claim ("The system is safe") into five low-risk claims ("Module A is safe," "Module B is safe"...).
  *   *Mitigation:* Reviewers must assess the *aggregate* risk of the PR, not just individual lines. If Step 4 CoF is high for the *system*, it applies to all claims enabling that system.

  **2. The "Box-Ticking" Assurance**
  *   *Failure:* Authors start writing "I take responsibility" on everything to bypass Step 5, diluting the meaning of assurance.
  *   *Mitigation:* If an incident occurs where an "Assured" claim was false, the post-incident review must focus on *why* the assurance was given falsely. The social cost must be real, or the signal decays.

  **3. The "Dead Zone" of Medium Risk**
  *   *Failure:* Claims where CoF is 3 and CoV is 3. The procedure says "Accept," but the reviewer feels uneasy.
  *   *Mitigation:** This is the **Escalation Point**. The procedure explicitly says: "If unsure if CoF is 3 or 4, Escalate to Tech Lead." Do not let the reviewer absorb that anxiety. It is a resource allocation decision, not a technical one.

  **4. Erosion of Trust**
  *   *Failure:* Senior engineers feel insulted when juniors invoke Step 1 or 2 to demand verification.
  *   *Mitigation:* Frame the procedure as **Protecting the Author**, not accusing them. "I am running CAP-1 to ensure your work isn't blamed for a downstream failure later." It externalizes the scrutiny to the *process*, not the *person*.

  **5. Silence on "Unknown Unknowns"**
  *   *Failure:* The procedure validates the claim, but the claim is about something the team doesn't know they don't know (e.g., "No other service calls this" — but there's an undocumented shadow script).
  *   *Mitigation:* This is why Step 3 (Negative Claims) triggers verification. You cannot testify to the absence of ghosts; you must scan the house. The procedure forces the scan; it cannot guarantee the scan is perfect.

  ### Final Summary for Your Team
  1.  **Philosophy:** We operate on **Risk-Weighted Presumptivism**. Trust is the default, but risk buys you the right to doubt.
  2.  **AI:** AI text is **not testimony**. It is unverified data. Always trace to a human source.
  3.  **Assurance:** "I stand by this" is a **technical artifact** that reduces verification requirements. Use it deliberately.
  4.  **Cost:** If verification takes <5 minutes, **do it**. Do not burn social capital on testimony when cheap evidence is available.
  5.  **Escalation:** If the risk is ambiguous, **ask the Lead**. Do not guess the company's risk tolerance.
