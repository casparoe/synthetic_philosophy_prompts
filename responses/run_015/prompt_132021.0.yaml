answer: |-
  ### Desiderata for an Empirical Research Program on Phenomenal Illusionism

  To function as a working hypothesis in cognitive science rather than a purely metaphysical stance, an illusionist account of consciousness must satisfy the following requirements. These are framed to ensure the theory generates testable predictions regarding the presence or absence of "experience" in borderline systems (e.g., LLMs, anesthetized patients, non-human animals).

  #### 1. The Locus of Error (Non-Negotiable)
  **Specification:** The account must identify the specific cognitive subsystem that entertains the false belief in phenomenal properties without that subsystem itself requiring phenomenal properties to operate. It must solve the "illusion-for-whom" regress by specifying a sub-personal mechanism that generates the error state, rather than positing a homunculus who is deceived.
  **Case/Consideration:** An illusion logically implies a subject to whom the illusion appears. If the subject is the whole person, the theory presupposes the very consciousness it seeks to explain. If the subject is a sub-system, the theory must explain how that sub-system processes "appearance" without experiencing it. Without this, the theory is incoherent, not just empirically silent.
  **Status:** **Non-Negotiable.**

  #### 2. Ontological Commitment of the Error (Non-Negotiable)
  **Specification:** The account must explicitly distinguish between denying the existence of phenomenal *properties* (qualia) and denying the validity of phenomenal *judgments* (reports). It must specify whether the judgment "I am in pain" is a true report of a functional state mislabeled as phenomenal, or a false report generated by a confabulating module. If the judgment itself is demoted to an illusion, the account must provide a non-regressive causal basis for why the judgment occurs.
  **Case/Consideration:** If one denies the property but accepts the judgment as a valid report of physical/functional states (Realist Representationalism), one is not an illusionist. If one denies the judgment as well (calling the report itself an error), one risks a regress where the error-detection mechanism also requires validation. The theory must ground the error in a physical mechanism to stop the regress.
  **Status:** **Non-Negotiable.**

  #### 3. Phenomenal Profile Generation (Non-Negotiable)
  **Specification:** The account must provide a mechanistic explanation for the *specific* structural features of the illusion (ineffability, immediacy, apparent intrinsicness, unity), rather than attributing them to generic "cognitive simplification." It must predict why the error takes the form of "qualia" rather than some other type of cognitive error.
  **Case/Consideration:** A graphical user interface simplifies code, but it does so via specific icons (folders, trash cans). An illusion of consciousness must similarly have a specific "iconography." Merely stating the system "simplifies data" does not explain why the simplification feels *ineffable* or *intrinsic*. Without this, the theory cannot distinguish consciousness from other cognitive heuristics.
  **Status:** **Non-Negotiable.**

  #### 4. The Target of Iconization (Non-Negotiable)
  **Specification:** The account must specify what cognitive process or physical state is being "iconized" by the illusion, acknowledging the asymmetry between a standard interface (which simplifies something real) and the illusionist claim (that nothing of the relevant kind exists). It must identify the *real* variable that the system is tracking, which it mistakenly represents as phenomenal.
  **Case/Consideration:** In a GUI, the trash can icon maps to a file-deletion script. In illusionism, the "pain qualia" icon must map to *something* (e.g., a specific type of attentional weighting or damage-avoidance signal). If it maps to nothing, the representation is ungrounded; if it maps to a physical property, the theory risks collapsing into Realist Representationalism.
  **Status:** **Non-Negotiable.**

  #### 5. Gradient Predictivity (Non-Negotiable)
  **Specification:** The account must offer criteria for degraded, partial, or dissociated cases (blindsight, split-brain, dreaming, anesthesia). It must predict whether these states represent a "dimmed" illusion, a "broken" illusion mechanism, or the absence of the illusion mechanism entirely.
  **Case/Consideration:** A blindsight patient denies experience but acts on visual data. Is the illusion module offline? A dreaming subject reports vivid experience without external input. Is the illusion module running in isolation? An empirical program needs to know what neural or behavioral markers indicate the *activation* of the illusion mechanism versus the activation of the underlying functional processes.
  **Status:** **Non-Negotiable.**

  #### 6. Causal Closure of the Illusion (Preference)
  **Specification:** The account should explain how the illusory state participates in learning and deliberation without granting causal efficacy to the non-existent phenomenal property. The causal work must be done by the *representation* of the property, not the property itself.
  **Case/Consideration:** If "feeling pain" causes me to learn to avoid fire, but the "feeling" is an illusion, the *representation* of the feeling must be the cause. This requirement is marked as a **Preference** because some hardline illusionists accept epiphenomenalism about the *phenomenal appearance* (it does nothing, only the physical substrate does), though this makes the evolution of the illusion harder to explain.
  **Status:** **Preference** (Strict physicalists may reject causal efficacy of the representation distinct from the substrate).

  #### 7. Operational Verdict Criteria (Non-Negotiable)
  **Specification:** The account must provide observable markers (behavioral, neural, or architectural) that allow a researcher to return a verdict on whether a system (e.g., an LLM, a monkey) is running the "illusion-generating" software. It must define what counts as evidence for the presence of the illusion mechanism.
  **Case/Consideration:** Without this, the theory cannot distinguish a philosophical zombie from a conscious human in principle. To be a research program, it must define the "consciousness test" in terms of mechanism detection, not just report acceptance.
  **Status:** **Non-Negotiable.**

  ***

  ### Incompatible Desiderata & Exclusionary Constraints

  **Flagged Incompatibility:** **Desideratum 3 (Phenomenal Profile Generation)** and **Desideratum 4 (The Target of Iconization)**.
  **Reasoning:** There is a tension between explaining the rich, specific structure of the phenomenal appearance (ineffability, intrinsicness) and maintaining that the target of this representation is "empty" or purely functional. The more successfully the theory explains the *specificity* of the appearance via structural constraints, the more it risks reifying the appearance as a real functional kind, thereby collapsing into Realist Representationalism. Conversely, maintaining strict ontological emptiness often forces the theory to be vague about why the error has such a consistent, specific structure across subjects.

  **Most Exclusionary Requirement:** **Desideratum 1 (The Locus of Error).**
  **Reasoning:** This requirement excludes the largest number of candidate views. Most intuitive or folk-psychological versions of illusionism implicitly rely on a "subject" who is fooled. Any account that cannot locate the error in a sub-personal mechanism without presupposing a conscious observer (the homunculus) fails immediately. This eliminates most non-reductive physicalist hybrids and naive eliminativism.

  ***

  ### Scorecard

  *   **Illusionism:** High parsimony, fails intuitive plausibility, high empirical risk on Locus of Error.
  *   **Realist Representationalism:** High intuitive fit, fails to dissolve Hard Problem, moderate empirical tractability.
  *   **Panpsychism:** Solves emergence, fails empirical tractability, high ontological cost.
