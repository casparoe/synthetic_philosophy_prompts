      15-20 (A Grade): Clearly distinguishes between ontological and epistemic issues. Engages creatively with the 'residue' twist rather than defaulting to standard meta-ethics. Identifies the collapse into description convincingly. Argument is structured and flows well.
      10-14 (B Grade): Defines reasons vs reasoners correctly but struggles to apply it to the empty world scenario. Relies too heavily on standard theories (Scanlon/Parfit) without adapting them. Addresses the questions but lacks critical depth on the 'for whom' aspect.
      0-9 (C/F): Fails to address the thought experiment. Confuses moral truths with reasons. Poor structure or significantly under word count.

