      *Part 1:*
      1. Question 3: The Empty World Argument (60 minutes)
      Consider a possible world, W_empty, identical to ours in every physical and historical respect up until time T. At T, every being capable of reasoning is instantly and permanently destroyed. However, certain normative truths seem to persist in W_empty. For instance, the statement 'the suffering inflicted at T-1 was wrong' appears to remain true, possessing a kind of 'normative residue' even though there is no one left to hold attitudes, feel pain, or acknowledge reasons.
      Write an essay of approximately 800 words addressing the following:
      (a) Can a reason exist without a reasoner to grasp it? Distinguish between reasons as psychological states and reasons as objective relations.
      (b) In W_empty, is this normative residue genuinely a 'reason'? If so, for whom or what is it a reason?
      (c) Does this residue collapse into a mere description of past events (e.g., 'suffering occurred'), or does it retain normative force?
      Do not simply rehearse Scanlon or Parfit; engage directly with the metaphysical status of the residue in the absence of agents.

      *Part 2:*
      2. Model Answer (Part 1)
      To tackle this, we first need to seperate the idea of a reason from the person having it. Traditionally, subjectivists argue that reasons are tethered to an agent's desires or psychological makeup. If nobody is there to want anything or think anything, there can't be reasons. But objectivists, like Parfit, suggest reasons are part of the fabric of reality, like maths. 2+2=4 even if no one counts. Similarly, 'suffering is bad' might be true regardless of minds.
      The key distinction here is between ontological dependence and epistemic access. Just because no one knows a reason exists doesn't mean it isn't there. However, reasons are usually thought to be 'for' someone. A reason to phi must be a reason for an agent to phi. If W_empty has no agents, the concept of a 'reason' starts to look wobbly. It's like asking if there's a 'left' side of a tree if no one is looking at it. Without a perspective, normative force seems to lose its grip.

      *Part 3:*
      3. Model Answer (Part 2)
      This brings us to the normative residue. If the statement 'suffering was wrong' remains true in W_empty, what work is it doing? It can't be guiding action, since there's no one to act. It can't be blaming anyone, since there's no one to blame. At this point, the residue risks collapsing into a mere description. Saying 'it was wrong' becomes synonymous with 'suffering happened', which strips the normativity away.
      However, one might argue the residue is a truth-maker for counterfactuals. If a reasoner *had* existed, they would have had a reason to prevent the suffering. This saves the reason from being purely descriptive without requiring actual agents. But this feels like a hack. Ultimately, without a reasoner, the residue is likely just a shadow of past normativity, not a present reason. It describes a normative fact that *was*, not one that *is* operative. So, it survives as a truth, but not as a functional reason.

      *Part 4:*
