answer: |-
  Imagine a star burning all its fuel in a single volatile season,
  A radio shout drowning the whole galaxy for a year then going dark.
  We scan the sky looking for fires that are currently burning so bright,
  But miss the ashes of a civilization spending its entire budget at once.
  The silence is not empty; it is merely a specific matter of timing.

  Or stretch the signal thin across a million years of quiet drift,
  A whisper barely rising above the cosmic background noise.
  We listen for a beacon but catch only static of the void,
  Power distributed over centuries becomes invisible.
  To be loud is to burn fast, to last long is to fade from view.
  Our tools are calibrated for a scream, not a quiet breath.

  We point our dishes at the spiral arms and find nothing there,
  No light curves dipping in the infrared shade.
  No shells blocking the starlight in a perfect gray.
  Maybe they spend their budget of notice slowly,
  A low hum beneath the threshold of our detection.
  We assume silence means the house is empty,
  But the lights might be on in a room unentered.

  There is a ceiling on what can be put into the sky,
  Power, volume, centuries of a beacon lit.
  One intense flare visible across the galaxy,
  Or a long faint emission never carrying far.
  The needs pull against each other,
  Loudness and duration are enemies.
  Snapshot biased toward strategies not lasting,
  We look for a spark in a forest of coals.

  But nothing forces loudness and duration to trade off,
  They might expand and keep going,
  Loud, durable, defying the budget.
  Maybe silence is real, no trick of light,
  Maybe we are alone in this vast galaxy.
  Lives in uncertainty, not answer.
  Galaxy old enough to cross,
  Find no recognized technology.
  Silence measures spending, or if they are.
