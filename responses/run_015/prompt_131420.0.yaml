      *   *Simple Conditional Analysis (SCA):* $x$ is disposed to $M$ when $S$ iff if $x$ were $S$-ed, $x$ would $M$. (Lewis's starting point).
      *   *Finks:* Cases where the stimulus causes the disposition to disappear *before* the manifestation occurs. (Lewis's electro-fink). The wire is live iff touched, but touching makes it dead.
      *   *Masks:* Cases where the disposition remains, but something prevents the manifestation. (Packing foam around a vase). The vase is still fragile, but won't break when struck *because* of the foam.
      *   *Antidotes:* Specific to powers like poison. The poison is still poisonous, but the antidote neutralizes the *process* internally/chemically after ingestion but before death. (Often grouped with masks, but distinct in mechanism).
      *   *Johnston's Reply:* Mark Johnston argued that dispositions are intrinsic properties that ground the conditionals, rather than *being* the conditionals. He distinguishes between the property and the conditional truth.
