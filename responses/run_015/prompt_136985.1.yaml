      *   If I pay, I lose $500. Charity A still gets $1000. Charity B gets $1000 (ineffective).
      *   From a consequentialist view: Don't pay. The good is done. The new good is wasteful.
      *   From a deontological/policy view: If I treat the copy as "me," I should honor the implicit agreement. But the copy acted on false information regarding Charity B's effectiveness. I am not bound by the copy's ignorance if I am a distinct agent now with better info.
