prompt: |-
  I'm a software engineer with no formal philosophy background — I work on infrastructure reliability, spend a lot of my time writing postmortems and fault-tree estimates for failures that are individually unlikely and collectively expensive — and for about a year now I've been arguing with a friend from the effective-altruism/rationalist part of the internet about what gets called expected value fanaticism. It started concretely: I argued against spending a whole sprint hardening a storage system against a data-loss bug I estimated at roughly one-in-a-million per year, and he said the arithmetic obviously favored it once you multiply by the size of the loss, and that my resistance was just scope neglect with better PR. It then escalated, as these things do, to donation allocation and to the Pascal's-mugging style case where someone claims a one-in-a-billion chance of affecting an astronomically large number of lives and asks you to act on it. Neither of us has moved. We've now agreed to stop arguing and write up an adversarial collaboration instead, and I'd like you to draft the document we should produce.

  The two positions are these. His is the fanatical one: if an action has higher expected value than every alternative, you should take it, full stop — the smallness of the probability is already in the product, so paying attention to it again is double-counting, and any principled rule for ignoring long shots will either collapse back into maximizing or tell you to ignore real risks like a well-anchored one-in-ten-thousand chance of civilizational catastrophe. Mine is a view I'd describe as borrowed from my day job, and I've never seen it stated in this debate, so I want to see whether it survives: probability estimates have a resolution floor. An estimate assembled from a finite body of evidence can't distinguish probabilities below roughly one over the effective size of that evidence, so an expected value computed from a below-resolution probability isn't a small number, it's noise wearing a number's clothes, and it shouldn't drive action however astronomically large the payoff is — whereas a probability that is anchored in a well-validated model (a fault tree with observed component failure rates, an actuarial table) is above the floor and can. He has three replies he keeps making: that this just relocates the arbitrariness into my choice of floor; that it's risk aversion smuggled in as epistemology; and that on any such view there's a large enough payoff that the noise argument should have been applied one step earlier, so I'm only postponing the fanaticism. I don't want you to adjudicate. I want the joint statement.

  Please give me: (1) a numbered agreed-claims section — including what we both already accept, namely that EV reasoning is fine for the anchored cases and that the mugging as stated shouldn't move anyone, so the real question is what separates the anchored from the unanchored; (2) a disagreements table with each side's position stated in wording that side would accept for itself, not in the other side's parody of it; (3) the cruxes — I suspect at least these four: whether the dispute is about small probabilities at all or really about the trustworthiness of the probability's source; whether my view is secretly just concavity in the utility of lives saved (which he rejects as treating people non-linearly) or is genuinely a claim about probabilities; whether there is a difference between what you should do, what you should spend money on, and what you should spend your limited deliberation on, so that "fanaticism" might be three different theses that happen to travel together; and whether any stopping rule avoids both fanaticism and the reductio that you must ignore every long-shot risk; (4) for each crux, a concrete case, argument, or thought experiment both of us would accept as bearing on it, with each side's prediction written down in advance and a note about which outcome should make which side concede; and (5) an honest flag on any part of this that you think is verbal rather than substantive. Please argue from scratch and define your terms rather than pointing at literature — no citations, reading lists, or summaries of what various authors have said; I can't check them and they'd only be name-dropping. Keep the formalism plain-English but exact, and where a claim rests on a dominance or axiom argument, say which axiom is doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **User:** Software engineer (infrastructure reliability, postmortems, fault trees) vs. Friend (Effective Altruism/Rationalist, EV maximizer).
      *   **Topic:** Expected Value (EV) Fanaticism vs. Probability Resolution Floor (Epistemic Humility/Noise).
      *   **Context:** Year-long argument, now moving to adversarial collaboration.
      *   **Goal:** Draft the joint document.
      *   **Constraints:**
          *   No adjudication (remain neutral).
          *   No citations/literature reviews (argue from scratch, plain English but exact).
          *   Specific Structure: (1) Agreed Claims, (2) Disagreements Table (charitable wording), (3) Cruxes (4 specific ones identified + potential others), (4) Test Cases/Experiments for each crux (predictions + concession conditions), (5) Verbal vs. Substantive Flag.
      *   **Tone:** Professional, precise, collaborative, philosophical but grounded in engineering intuition.

  2.  **Deconstruct the Positions:**
      *   **Friend (The Fanatic/EV Maximizer):**
          *   Core Principle: Maximize Expected Value. $Action = \arg\max (P \times Impact)$.
          *   Objection to User: Ignoring small $P$ is scope neglect or double-counting.
          *   Objection to User's "Floor": Arbitrary cutoff, smuggled risk aversion, Pascal's Mugging returns if Impact is large enough.
          *   View on Risk: Linear utility of lives/outcomes (usually implicit in strict EV).
      *   **User (The Engineer/Epistemic Humility):**
          *   Core Principle: Probability estimates have a resolution floor based on evidence size. Below $1/N_{evidence}$, $P$ is noise, not signal.
          *   Objection to Friend: EV calculation on noise $P$ is garbage-in-garbage-out.
          *   Distinction: Anchored probabilities (fault trees, actuarial) vs. Unanchored (speculative metaphysics).
          *   View on Risk: Not necessarily risk-averse utility, but epistemic-averse regarding the input $P$.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground.
      *   Both agree EV is useful for *anchored* cases (e.g., server redundancy, known disease vectors).
      *   Both agree the specific "Pascal's Mugging" (give me $5 or I simulate 3^^^^3 lives) is practically dismissible, but disagree on *why*.
      *   Both agree resources are limited.
      *   Both agree that ignoring *all* long shots is bad (e.g., asteroid impact).
      *   *Key Agreement:* The debate isn't "EV vs. No EV," it's "When is a probability estimate valid input for EV?"

  4.  **Drafting Section 2: Disagreements Table:**
      *   Must be charitable. No strawmanning.
      *   *Issue 1: The Nature of the Floor.*
          *   Friend: Arbitrary threshold violating continuity.
          *   User: Epistemic limit derived from sample size/model validity.
      *   *Issue 2: Utility Function.*
          *   Friend: Linear (1 life = 1 unit).
          *   User: Claims it's about $P$, but Friend suspects it's concave utility (diminishing marginal value of saving more lives).
      *   *Issue 3: Action vs. Deliberation.*
          *   Friend: Normative claim on what to *do*.
          *   User: Normative claim on what to *trust* (which informs doing).
      *   *Issue 4: The Regress Problem.*
          *   Friend: If you ignore $10^{-9}$, what about $10^{-8}$? Where is the line?
          *   User: The line is where the model breaks, not a fixed number.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Source Trustworthiness vs. Magnitude.* Is the objection to the small number or the model generating it?
      *   *Crux 2: Epistemology vs. Utility.* Is the User actually risk-averse regarding outcomes, or just regarding inputs?
      *   *Crux 3: Action, Allocation, Deliberation.* Distinguishing "Do it," "Fund it," and "Think about it."
      *   *Crux 4: The Stopping Rule.* Can we define a boundary that isn't arbitrary?

  6.  **Drafting Section 4: Test Cases/Experiments:**
      *   Need concrete scenarios where predictions diverge.
      *   *Case 1 (Source Trust):* Two risks, same $P \times Impact$, different evidence bases (Actuarial vs. Guess).
          *   Friend: Indifferent.
          *   User: Prefer Actuarial.
          *   Concession: If User prefers Actuarial even when EV is identical, it confirms it's about evidence, not just magnitude.
      *   *Case 2 (Utility/Concavity):* Saving 1 life with $P=0.5$ vs. 1,000,000 lives with $P=0.5/1,000,000$.
          *   Friend: Indifferent (EV same).
          *   User: Prefers certain 1 life (if risk averse) OR prefers anchored probability (if epistemic). *Correction:* To test Utility vs. Epistemology, we need to hold Evidence constant.
          *   *Refined Case:* High Impact/Low P (Anchored) vs. High Impact/Low P (Unanchored).
      *   *Case 3 (Deliberation Cost):* Spending 100 hours to verify a $10^{-9}$ claim.
          *   Friend: Worth it if EV > cost of time.
          *   User: Not worth it because verification can't push P above floor.
      *   *Case 4 (The Continuum):* A slider from $10^{-4}$ to $10^{-12}$ with constant EV (Impact scales up).
          *   Friend: Keep acting.
          *   User: Stop acting at some point.
          *   Concession: If User's stop point moves based on *evidence quality* rather than just the number, it supports the Floor theory.

  7.  **Drafting Section 5: Verbal vs. Substantive:**
      *   Is "Probability Floor" just a fancy way of saying "Risk Aversion"?
      *   Is "Fanaticism" just "Taking EV seriously"?
      *   Need to highlight where definitions of "Probability" might differ (Frequentist vs. Bayesian Subjective).

  8.  **Review and Refine:**
      *   *Check Constraints:* No citations? Yes. Plain English? Yes. Numbered sections? Yes.
      *   *Tone Check:* Ensure the Friend's view isn't painted as crazy, and the User's view isn't painted as lazy.
      *   *Specific User Request:* "Define your terms rather than pointing at literature." -> Ensure "Resolution Floor" and "Anchored" are defined clearly in the text.
      *   *Specific User Request:* "Where a claim rests on a dominance or axiom argument, say which axiom is doing the work." -> Need to explicitly mention axioms like "Continuity" or "Dominance" in the disagreement/crux section.

  9.  **Final Polish:**
      *   Make sure the "Concession Conditions" in Section 4 are clear.
      *   Ensure the distinction between *ontological* probability (how the world is) and *epistemic* probability (what we know) is clear, as this is central to the User's argument.
      *   Ensure the "Three Theses" (Do, Spend, Deliberate) are integrated into Crux 3.

  *(Self-Correction during drafting)*: I need to be careful not to solve the problem. The prompt asks for the *document draft*, not the solution. I must maintain the tension. I also need to make sure the "Friend's" voice is represented accurately as a strict EV maximizer, not a caricature. The User's "Resolution Floor" needs to be defined technically but accessibly (signal-to-noise ratio in estimation).

  Let's assemble the document.

  *Structure:*
  Title
  Introduction (Context)
  1. Agreed Claims
  2. Disagreements Table
  3. Cruxes
  4. Test Cases & Concession Conditions
  5. Verbal vs. Substantive Flag

  *Key Definitions to include:*
  *   Anchored Probability: Derived from reference classes, physical models, or observed frequencies.
  *   Unanchored Probability: Derived from theoretical possibility or logical consistency without empirical grounding.
  *   Resolution Floor: The limit of precision an estimation method can support given available evidence.

  *Refining Crux 2 (Utility):* The User claims it's about Probability. The Friend claims it's secretly Utility. The test case must isolate this. If we hold Evidence constant but vary Impact/P, does the User still balk? If yes, it's Utility. If no (only balks when Evidence is weak), it's Epistemology.

  *Refining Crux 4 (Stopping Rule):* The Friend says any rule is arbitrary. The User says the rule is "Evidence Exhaustion." The test is whether the cutoff moves when evidence improves.

  Okay, ready to write.
answer: |-
  # ADVERSARIAL COLLABORATION DRAFT
  **Subject:** The Validity of Expected Value Reasoning at Extreme Scales
  **Parties:** [Engineer] (Epistemic Resolution View) vs. [Friend] (Strict Expected Value View)
  **Date:** October 26, 2023

  ## 1. Agreed Claims
  *We both affirm the following statements. This document does not debate these points.*

  1.  **EV is Valid for Anchored Cases:** For probabilities derived from robust models (e.g., hardware failure rates, actuarial data, well-tested physical simulations), Expected Value (EV) calculation is the correct method for decision-making. If a server rack has a 1% chance of causing a $1M loss, spending up to $10k to prevent it is rational.
  2.  **The "Mugging" Intuition:** We both agree that the classic "Pascal's Mugging" scenario (a stranger claims they will simulate $3 \uparrow\uparrow\uparrow 3$ lives unless given $5) should not compel action in the real world. We disagree on *why* it should be rejected, but we agree on the output: do not hand over the money.
  3.  **Resource Scarcity:** Time, money, and cognitive attention are finite. We cannot pursue every positive-EV action. Prioritization is necessary.
  4.  **Catastrophic Risk Matters:** We agree that low-probability, high-impact risks (e.g., asteroid impact, engineered pandemics) are legitimate targets for mitigation *if* the probability estimate is grounded in evidence. We reject the view that "low probability" automatically means "ignore."
  5.  **The Core Question:** The dispute is not about whether to use EV, but about **input validity**. At what point does a probability estimate cease to be a signal and become noise, rendering the EV product meaningless?

  ## 2. Disagreements Table
  *We state our positions in our own terms. We agree that the opposing column is a fair representation of the other's view.*

  | Feature | [Friend]: Strict EV Maximization | [Engineer]: Epistemic Resolution Floor |
  | :--- | :--- | :--- |
  | **Core Axiom** | **Continuity of Probability:** Any non-zero probability, no matter how small, contributes to Expected Value. To ignore it is to violate the axioms of rational choice (specifically, the Continuity Axiom). | **Signal-to-Noise Threshold:** A probability estimate is only valid if the evidence supporting it exceeds the precision of the estimate. Below this floor, the number is epistemic noise, not a measure of reality. |
  | **On "Arbitrariness"** | Setting a floor (e.g., "ignore $P < 10^{-9}$") is arbitrary. Why $10^{-9}$ and not $10^{-8}$? Any cutoff creates a cliff-edge where a tiny change in probability flips a decision from "mandatory" to "forbidden." | The floor is not an arbitrary number; it is a function of the **evidence base**. If I have 1,000 data points, I cannot distinguish $10^{-5}$ from $10^{-6}$. The cutoff moves as evidence improves. It is a limit of measurement, not a preference. |
  | **On Utility** | **Linearity:** Saving $N$ lives is $N$ times better than saving 1 life. Risk aversion regarding *outcomes* is irrational when stakes are existential or global. | **Epistemic Risk:** I am not necessarily risk-averse about *lives*; I am risk-averse about *bad estimates*. Acting on noise is a systematic error that compounds. |
  | **On the Mugging** | The Mugging fails because the probability is not *actually* $10^{-9}$; upon scrutiny, the claim is incoherent, so $P \approx 0$. But if $P$ were genuinely non-zero and the Impact high enough, action would be required. | The Mugging fails because the probability is **unanchored**. There is no model or evidence linking the $5 to the outcome. The estimate is pure speculation, so it sits below the resolution floor regardless of the claimed Impact. |
  | **On Regress** | If you ignore $10^{-9}$ because Impact isn't high enough, what about $10^{-9}$ with Impact $10^{100}$? If you ignore that, you are effectively treating utility as bounded (capped), which implies you don't actually care about the extra lives. | If the Impact is $10^{100}$, but the Probability is unanchored speculation, the EV is still noise. You cannot multiply "Noise" by "Infinity" and get a valid number. You must first anchor the Probability. |

  ## 3. The Cruxes
  *These are the specific points of contention that determine our disagreement. If we resolved these, the argument would dissolve.*

  ### Crux 1: Source Trustworthiness vs. Magnitude
  **Question:** Is the objection to "fanaticism" driven by the *smallness of the number* or the *weakness of the evidence*?
  *   **[Friend]:** It is about the number. If the evidence were perfect (e.g., a proven physical law) but the probability was $10^{-50}$, you should still act if the Impact is $10^{51}$.
  *   **[Engineer]:** It is about the evidence. A "perfect" probability of $10^{-50}$ is impossible without a dataset of size $>10^{50}$. Since that dataset cannot exist, the probability is unanchored. The smallness is a symptom of the lack of evidence.

  ### Crux 2: Epistemology vs. Utility (The "Secret Risk Aversion" Charge)
  **Question:** Is the Engineer's view secretly a claim about **Utility** (valuing certain lives over uncertain lots of lives) rather than **Probability** (trusting the estimate)?
  *   **[Friend]:** The Engineer claims this is about probability resolution, but behaviorally, it looks like a concave utility function (diminishing marginal value of lives saved). This violates the principle that every life counts equally.
  *   **[Engineer]:** It is genuinely about probability. I would accept a risky bet on 1,000,000 lives if the *odds were anchored* (e.g., a lottery with verified tickets). I reject it when the odds are speculative. This is not valuing lives less; it is valuing truth more.

  ### Crux 3: Action, Allocation, and Deliberation
  **Question:** Are we debating what to **do**, what to **fund**, or what to **think about**?
  *   **[Friend]:** These are the same. If EV is positive, you should do it. If you can't do it directly, you should fund research to lower the uncertainty. Deliberation is an action with an EV.
  *   **[Engineer]:** These are distinct.
      1.  **Do:** Execute the intervention.
      2.  **Fund:** Allocate capital.
      3.  **Deliberate:** Spend cognitive effort refining the estimate.
      *My claim:* For unanchored probabilities, the EV of *Deliberation* is often negative (you can't improve the estimate meaningfully), which blocks Funding and Doing. The Fanatic conflates "Positive EV of Action" with "Positive EV of Analyzing the Action."

  ### Crux 4: The Stopping Rule and Continuity
  **Question:** Can we define a stopping rule that avoids fanaticism without falling into the "Arbitrary Cutoff" reductio?
  *   **[Friend]:** No. Any rule that says "Ignore $P < X$" is arbitrary. Any rule that says "Ignore Unanchored" just pushes the problem back to defining "Anchored," which eventually requires a probability threshold itself.
  *   **[Engineer]:** Yes. The rule is **Model Validity**. If the probability derives from a model that has been validated within an order of magnitude of the claim, it is anchored. If it derives from extrapolation beyond validation, it is not. This is not arbitrary; it is standard engineering practice (e.g., safety factors).

  ## 4. Test Cases & Concession Conditions
  *For each Crux, we propose a specific scenario. We write down our predictions. We agree that if the outcome matches the prediction column, the opposing side should update significantly or concede the crux.*

  ### Test Case 1 (For Crux 1: Source vs. Magnitude)
  **Scenario:** Two interventions have identical Expected Value ($1,000,000$).
  *   **Option A:** 50% chance to save 2,000,000 lives. (Anchored: Based on historical epidemic data).
  *   **Option B:** $10^{-6}$ chance to save 2,000,000,000,000 lives. (Unanchored: Based on a speculative cosmological theory).
  **Prediction [Friend]:** Indifferent. EV is identical. Rational agents should be indifferent between A and B.
  **Prediction [Engineer]:** Strong preference for A. Option B's probability is below the resolution floor of cosmological theory; the EV is illusory.
  **Concession Condition:**
  *   If [Engineer] admits they would be indifferent *if* Option B's probability were verified by a "God-like oracle," the dispute is purely epistemic (Engineer wins Crux 1).
  *   If [Engineer] admits they would *still* prefer A even with verified odds, they are admitting to concave utility (Friend wins Crux 2).

  ### Test Case 2 (For Crux 2: Epistemology vs. Utility)
  **Scenario:** A verified lottery. We have a physical machine that generates a random number between 1 and $10^{9}$. If it hits 1, a trusted third party saves $10^{9}$ lives. If not, 0 lives saved. Cost is low.
  **Prediction [Friend]:** Take the bet. The probability is anchored (physical randomness), so EV is valid.
  **Prediction [Engineer]:** Take the bet. The probability is anchored (physical mechanism), so it is above the resolution floor.
  **Concession Condition:**
  *   If [Engineer] refuses this bet, their view is **Utility-based** (risk aversion), not Epistemology-based. [Friend] is correct that the "Resolution Floor" is a disguise for risk aversion.
  *   If [Engineer] takes this bet but rejects the "Cosmological Theory" bet (Case 1), their view is **Epistemology-based**. [Engineer] is correct that the source matters more than the magnitude.

  ### Test Case 3 (For Crux 3: Deliberation)
  **Scenario:** A claim exists: "Donating $1k has a $10^{-9}$ chance of preventing a vacuum decay that kills $10^{20}$ beings." The EV is massive. However, verifying the physics would cost $1M and take 10 years.
  **Prediction [Friend]:** Invest the $1M. The EV of the information is high because resolving the uncertainty could unlock the $1k action (or prevent wasting it). The EV of deliberation is positive.
  **Prediction [Engineer]:** Do not invest. The resolution floor of physics models is unlikely to move from $10^{-9}$ to "anchored" with only $1M. The EV of deliberation is negative because the probability will remain unanchored noise.
  **Concession Condition:**
  *   If [Friend] agrees that there are cases where **Deliberation EV is negative** despite high **Action EV**, they concede that "Fanaticism" should not apply to research allocation.
  *   If [Engineer] admits there is *some* amount of money that *would* justify the research, they concede that the floor is not hard, but economic.

  ### Test Case 4 (For Crux 4: The Stopping Rule)
  **Scenario:** We slide a scale.
  *   Case X: $P = 10^{-4}$, Impact = $10^4$. (Anchored by engineering data).
  *   Case Y: $P = 10^{-9}$, Impact = $10^9$. (Anchored by actuarial data).
  *   Case Z: $P = 10^{-20}$, Impact = $10^{20}$. (Unanchored speculation).
  **Prediction [Friend]:** Accept X, Y, and Z. The math is identical. Rejecting Z is arbitrary.
  **Prediction [Engineer]:** Accept X and Y. Reject Z. The break is not at a specific number, but at the transition from "Actuarial/Engineering" to "Speculative."
  **Concession Condition:**
  *   If [Engineer] cannot specify *why* Case Y is anchored and Case Z is not without referencing the number itself, their "Floor" is arbitrary (Friend wins Crux 4).
  *   If [Engineer] can point to a specific **methodological break** (e.g., "Case Y has observed failures in the reference class; Case Z has zero observed instances") that justifies the distinction, the Floor is non-arbitrary (Engineer wins Crux 4).

  ## 5. Verbal vs. Substantive Flag
  *We identify areas where we suspect we might be arguing about definitions rather than reality.*

  1.  **Definition of "Probability":**
      *   **Risk:** We may be using different definitions. [Friend] appears to use **Subjective Bayesian Probability** (degree of belief). [Engineer] appears to use **Frequentist/Reference-Class Probability** (observed frequency).
      *   **Substantive Check:** If [Friend] admits that "Degree of Belief" cannot exceed "Confidence in Model," the gap narrows. If [Engineer] admits that "Observed Frequency" is not the only valid source of probability, the gap narrows.
      *   **Flag:** This is likely **Substantive**. It changes the math of the decision.

  2.  **Definition of "Rationality":**
      *   **Risk:** [Friend] defines rationality as **Internal Consistency** (axioms hold). [Engineer] defines rationality as **External Accuracy** (predictions match reality).
      *   **Substantive Check:** A system can be internally consistent but externally wrong (precisely calibrated wrongness).
      *   **Flag:** This is **Substantive**. It determines whether we optimize for the map or the territory.

  3.  **The "Noise" Claim:**
      *   **Risk:** [Engineer] claims EV on unanchored P is "Noise." [Friend] claims "Noise averages out over many bets."
      *   **Substantive Check:** In existential risk, we do not get "many bets." We get one. The Law of Large Numbers does not apply.
      *   **Flag:** This is **Substantive**. If the domain is single-shot decisions, [Engineer]'s noise argument holds more weight. If the domain is portfolio allocation, [Friend]'s argument holds more weight.

  4.  **Utility Linearity:**
      *   **Risk:** [Friend] insists utility must be linear in lives. [Engineer] suspects this is a verbal commitment to "equality" that doesn't match actual decision-making.
      *   **Substantive Check:** Does [Friend] actually prefer a 10% chance at 10 lives over a 100% chance at 1 life?
      *   **Flag:** Potentially **Verbal**. If [Friend] admits they would take the 1 life in practice but calls it "risk management" rather than "utility," the disagreement is labeling. If they truly prefer the 10% chance, it is Substantive.

  ***

  **Next Steps:**
  We will review Test Case 2 (The Verified Lottery) first, as it most cleanly separates Epistemology from Utility. We agree to revisit this document in 30 days after reflecting on these specific conditions.
