      *   *Drafting text:*
      Here is a menu of distinct theses packed into "the will of the people," evaluated for truth and argumentative utility regarding judicial review.

      1. **The Aggregative Thesis:** The will is simply the arithmetic sum of individual preferences expressed at the ballot box.
      *Verdict:* Substantive but dubious. Social choice theory demonstrates that stable majorities often don't exist; preferences cycle depending on voting order.
      *Supports Classmate?* Weakly. If the will is just a fleeting majority, why should mid-term legislatures or courts be barred from correcting it? It implies instability, not sanctity.

      2. **The Procedural Thesis:** The will is whatever outcome valid constitutional rules designate as authoritative.
      *Verdict:* Trivially true. It defines "will" by the rules of the game.
      *Supports Classmate?* No. Since modern constitutional rules usually empower courts to override legislatures, this thesis actually validates judicial review as an expression of the people's will (encoded in the constitution).

      3. **The Rousseauian General Will:** There exists a unitary will aimed at the common good, distinct from the mere sum of private opinions ("will of all").
      *Verdict:* Substantive but dubious in modern democracy. While philosophically rich, identifying this will empirically is notoriously difficult. Elections typically track private interests, not the common good.
      *Supports Classmate?* No. If elections track private opinions rather than the General Will, then courts might better track the General Will by protecting rights against private encroachment. This distinction undermines the classmate's appeal to the ballot box.
      *Note on "One Voice":* This reading makes "speak with one voice" literally coherent only if the people are metaphysically unified. In practice, it remains a normative ideal, not a descriptive fact.

      4. **The Organic Corporate Thesis:** The people constitute a single moral agent with a single corporate will, distinct from the aggregate of individual wills.
      *Verdict:* Simply false. Societies are pluralistic; there is no single mind behind the votes.
      *Supports Classmate?* Yes, but only by relying on a falsehood. If the people are one agent, overriding them is anti-democratic. However, this collapses into the Rousseauian view if "corporate will" implies a common good orientation. If it implies mere unity, it is mysticism.

      **Synthesis on Rousseau:** The distinction between the General Will and the sum of private opinions lends the phrase an aura of depth but does little work justifying plebiscites. Since ballots record private opinions, appealing to the General Will to defend ballot outcomes is contradictory. It cannot validate the classmate's claim unless one assumes elections magically transmute private interest into common good—a substantive but highly dubious claim.

      **Synthesis on "One Voice":** Only the Organic Corporate Thesis makes "speak with one voice" literally coherent, but at the cost of truth. In all other readings, "one voice" is a metaphor for majority rule or procedural finality.

      **Conclusion:** Your classmate's argument relies on sliding between the Procedural Thesis (to define the will) and the Organic Thesis (to sanctify it). The Aggregative view shows the will is fragile; the Rousseauian view shows elections may not capture it. Neither supports the strong claim that unelected institutions must never override electoral outcomes. The phrase packs a normative wish (democracy should rule) into a descriptive claim (the people speak), committing a category error.

