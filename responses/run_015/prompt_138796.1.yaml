answer: |-
  ### Readings

  1.  **The Linguistic Rule Reading:** This claim is merely a statement about how our specific linguistic community fixed the reference of the term 'water'. We ostensively pointed to samples of a liquid and said, "That stuff is water." It turns out that stuff is H2O. Because our terms are rigid designators, they pick out that same substance in every counterfactual world we consider. On this reading, "Water is necessarily H2O" means: "Given our actual history of usage, any world we evaluate as counterfactual must be checked for H2O to see if it contains water." This is a rule of our language game, not a discovery about the fabric of reality.

  2.  **The Metaphysical Identity Reading:** This asserts that the identity statement itself expresses a necessary truth about the world, independent of our linguistic practices. Once the reference is fixed, it is not merely a convention that water is H2O; it is a fact that holds in all possible worlds. There is no possible world where water exists but is not H2O. This reading shifts the focus from our words to the objects themselves, claiming that the substance possesses its microstructure essentially. The necessity is de re, belonging to the substance rather than the sentence.

  3.  **The Two-Dimensional Reading:** This distinguishes between evaluating worlds as counterfactual versus evaluating them as actual. The sentence is necessary on the secondary intension (given our actual world, water is H2O in all counterfactual scenarios) but contingent on the primary intension (if we had lived in a world where XYZ filled the lakes, 'water' would have referred to XYZ). This reading captures the intuition that it seems conceivable for water to be something else. It locates the necessity in the diagonal: once the actual world is fixed, the extension is fixed across all counterfactuals, but the actual world itself was not determined a priori.

  4.  **The Essentialist Kind Reading:** This is a stronger ontological claim that natural kinds are carved by nature, not just by us. It claims that being H2O is the essence of water, such that anything lacking that microstructure fails to be water regardless of its macroscopic properties. This reading denies that the reference-fixing description (clear, drinkable liquid) has any weight once the underlying chemistry is known. It asserts that the microstructure determines the kind membership metaphysically, not just semantically. If something looks like water but is XYZ, it is not water, full stop, in any context.

  5.  **The A Priori Entailment Reading:** This is the strongest and most radical reading, often conflated with the others in physicalist arguments. It claims that once the complete physical truth about the world is fixed, the truth about water is fixed *and knowable* without further empirical investigation (modulo reference fixing). It implies that there is no epistemic gap between the physical base and the higher-level fact. On this reading, the necessity is not just that water *is* H2O, but that the physical facts *entail* the water facts in a way that makes the identity transparent to reason once the concepts are fully understood.

  ### Verdicts

  1.  **The Linguistic Rule Reading:** **Platitude.** This is trivially true given the causal theory of reference. It explains why we say "Water is H2O" is necessary, but it offers no leverage against skeptics because it admits the necessity is relative to our actual historical accident of reference fixing. It cannot prove that consciousness must be physical, only that if we fix consciousness to a physical state, we must stick to that reference.

  2.  **The Metaphysical Identity Reading:** **Substantive and Defensible.** This is the standard modal realist position. It is defensible because it coheres with how we treat scientific identities. However, it is substantive because it assumes that the world supports rigid kind terms in this way. It does not, however, explain *why* the identity holds, only that it does hold given the actual world.

  3.  **The Two-Dimensional Reading:** **Substantive and Defensible.** This is the most precise account of our epistemic situation. It explains why the identity feels contingent (primary intension) yet is necessary (secondary intension). It is defensible because it accommodates the intuition that XYZ could have been water without denying that water is actually H2O. It clarifies the modal status without overreaching into metaphysics.

  4.  **The Essentialist Kind Reading:** **Substantive and Doubtful.** This is doubtful because it assumes nature privileges microstructure over function or appearance. In cases of multiple realizability, this reading fails. It asserts a specific metaphysical structure to natural kinds that may not exist. It risks conflating our decision to prioritize chemistry with a mind-independent essence.

  5.  **The A Priori Entailment Reading:** **Substantive and Doubtful (in this context).** This is the claim required to defeat zombie arguments, but the water example does not support it. Water identities are a posteriori; we needed empirical science to find them. This reading claims a derivability that water does not exhibit. It is doubtful because it conflates metaphysical necessity with epistemic transparency, which is exactly what the consciousness debate disputes.

  ### My two cases

  **Split Lake** tests the stability of reference. On the Linguistic and Metaphysical readings, the term 'water' faces reference failure or ambiguity. If the community points to both H2O and XYZ, does 'water' denote a disjunction? If so, "Water is H2O" is false. If it denotes nothing, the slogan is vacuous. This case suggests that the necessity of "Water is H2O" depends on the contingent fact that our environment was uniform. If consciousness is like Split Lake—multiply realizable by different physical states—then the identity "Consciousness is Physical State P" fails just as "Water is H2O" would fail here. The water example hides this possibility because our actual world is simple. This case counts against the Essentialist Kind Reading, showing that kind membership might depend on environmental uniformity rather than intrinsic essence.

  **The Stipulated Term** tests the epistemic source of the necessity. If a community defines 'water' as "the liquid with microstructure M" from the start, the identity becomes analytic and a priori. The necessity survives, but it becomes trivial. This shows that the "necessity" in our slogan is partly an artifact of our ignorance at the time of reference fixing. We fixed reference by appearance, then discovered the essence. If we had fixed reference by essence, there would be no gap. This case counts against the A Priori Entailment Reading. It demonstrates that the necessity of water identities is compatible with an epistemic gap that is only closed by stipulation or empirical discovery. It suggests that the "necessity" is relative to the epistemic situation of the speakers, not a feature of the world that forces itself on reason.

  ### Does it do the work?

  The goal is to use "Water is necessarily H2O" to shut down the argument that uploads could lack consciousness (zombies). The argument structure is: "You can conceive of a zombie, therefore zombies are possible." The water slogan is deployed to say: "You could conceive of water being XYZ, but that wasn't possible. So conceivability doesn't imply possibility."

  However, only the **Two-Dimensional Reading** successfully explains the water case without begging the question. It admits that conceivability tracks the primary intension (watery stuff), while possibility tracks the secondary intension (H2O). But this does not kill the zombie argument. For water, we accept that the primary intension (appearances) and secondary intension (microstructure) come apart. We agree that "Water is H2O" is a posteriori.

  For consciousness, the physicalist needs to show that the phenomenal concept (what it feels like) and the physical concept (neural state) refer to the same thing in the way 'water' and 'H2O' do. But the water example only shows that *if* they refer to the same thing, the identity is necessary. It does not show *that* they refer to the same thing. The zombie arguer claims there is no secondary intension linking the two; the physicalist claims there is.

  To make the water example do the work, you need the **A Priori Entailment Reading**. You need to claim that once the physical facts are fixed, the consciousness facts are fixed *and recognizable*. But water does not support this; we needed empirical science to link water to H2O. If consciousness is like water, we might need empirical science to link it to brains, but the conceivability of zombies suggests the link is not necessary in the same way. The water example blocks the inference from "I can imagine it" to "It is possible," but it does not establish the identity required to make the imagination irrelevant. It stops the skeptic from claiming possibility, but doesn't prove impossibility.

  The move requires an extra premise: "Phenomenal concepts function like natural kind terms rather than direct phenomenal concepts." This premise is exactly what is at issue. The water example assumes the physicalist conclusion to illustrate the point, rather than proving it. It protects physicalism from conceivability arguments only if physicalism is already assumed to be true of consciousness.

  ### Bottom line

  The slogan "Water is necessarily H2O" is semantically precise but metaphysically idle in this context. It correctly identifies that a posteriori identities are necessary once fixed, but it fails to bridge the explanatory gap for consciousness. The water case relies on a contingent uniformity of reference that may not apply to mental states. Using it to dismiss zombie intuitions begs the question by assuming the very identity it is meant to prove. It shows that conceivability is not a perfect guide to possibility, but it does not show that the specific conceivability of zombies is misleading. Do not let the slogan stop the conversation; it marks the starting line, not the finish.
