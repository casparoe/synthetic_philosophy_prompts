  2.  **Deconstruct Mill's Argument (as presented by the user):**
      *   *Premise 1:* Socialism = Collective ownership of capital.
      *   *Premise 2:* Liberty = Freedom to choose occupation + Freedom to leave.
      *   *Observation:* Inside a co-op, decisions are made by majority vote.
      *   *Problem:* A consistently outvoted minority is effectively subordinate (dominated) just like under a capitalist, only the master is the "collective."
