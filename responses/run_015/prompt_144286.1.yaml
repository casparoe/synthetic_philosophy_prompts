answer: |-
  The logical structure you have identified is the central pivot upon which Mill's attempt to reconcile liberalism with socialism turns. You are correct that Mill does not explicitly name a principle that cleanly separates legitimate cooperative discipline from oppressive majoritarian rule, but his argument relies on a specific conceptual architecture that can be reconstructed from his broader political theory.

  Here is an analysis of the terminology, the logical structure, the viability of exit, and the resolvability of the tension.

  ### 1. Terminology for Internal-Majoritarian Domination

  There is no single, universally standardized technical term for the specific failure mode you describe, but it is recognized in political economy and cooperative theory under a few overlapping concepts:

  *   **The Tyranny of the Majority:** Mill uses this term in *On Liberty* regarding the state, but in the context of the workshop, it is often referred to as **internal majoritarian oppression**.
  *   **Workplace Domination:** In contemporary neo-republican political theory, this is analyzed through the lens of **domination**. Domination exists when one agent has the arbitrary power to interfere in the choices of another. In a cooperative, if the majority can alter wages or conditions without the consent of the minority, and the minority has no recourse, the majority holds arbitrary power over them, replicating the domination of the capitalist firm.
  *   **The Heterogeneity Problem:** In the economic literature on worker cooperatives, this is often framed as the problem of **preference heterogeneity**. If workers have divergent preferences regarding risk, leisure, or investment, majority voting inevitably imposes the preferences of the median voter on the tails of the distribution, effectively "exploiting" the minority's labor for the majority's preferred outcome.
  *   **Exit, Voice, and Loyalty:** While not a name for the domination itself, the framework you allude to regarding the solution is the **Exit-Voice trade-off**. Mill is arguing that without a credible **Exit** option, **Voice** (voting) becomes a mechanism of entrapment rather than empowerment.

  ### 2. Logical Structure: Sovereignty vs. Liberty, Not Property vs. Labor

  You ask whether Mill relies on an implicit separation between property rights and managerial authority, and if that separation collapses.

  Mill is not primarily distinguishing between property and labor; he is distinguishing between **collective sovereignty** and **individual liberty**. He treats the cooperative not merely as a firm, but as a **polity**.

  *   **The Collapse:** You are right that the separation collapses if the cooperative is viewed as a pure democracy where the majority will is absolute. If the "people" of the workshop are sovereign, they can theoretically vote to bind any individual member.
  *   **The Constitutional Fix:** Mill's logical move is to import **liberal constitutionalism** into the economic sphere. He argues that the "constitution" of the cooperative must entrench certain individual rights (specifically the right of exit and the right to one's own labor power) that are immune to majority vote.
  *   **The Principle:** The separating principle is **voluntarism**. Legitimate authority in the cooperative derives from the continuous consent of the members. If a member is consistently outvoted to the point where their conditions are unacceptable, their continued presence is no longer voluntary unless they have a viable alternative. Therefore, the legitimacy of the majority's rule is *conditional* upon the viability of exit.

  So, Mill is not trying to separate capital from labor management; he is trying to subordinate **economic democracy** to **liberal rights**. The majority can manage the capital, but they cannot manage the *person* of the dissenting worker.

  ### 3. The Viability of Exit and the Market Question

  Your concern about the "residual private market" is the most critical vulnerability in Mill's argument.

  *   **Market Socialism vs. Command Socialism:** Mill's vision is not of a single, monolithic state cooperative (Command Socialism). It is of a **Market Socialist** economy composed of many competing cooperatives.
  *   **The Exit Destination:** When Mill speaks of exiting to "comparable employment," he does not necessarily mean exiting to a capitalist firm. He means exiting to *another cooperative*.
  *   **The Requirement for Pluralism:** For Mill's safeguard to work, the socialist system must preserve **decentralization**. There must be multiple, independent centers of capital allocation. If all capital is pooled into a single national fund, the "right of exit" becomes illusory because there is nowhere to exit *to* that is not controlled by the same central authority or the same aggregate majority.
  *   **Does it require Private Capital?** Strictly speaking, no. It requires **pluralistic ownership**, not necessarily *private* ownership in the capitalist sense. However, it does require a **market mechanism** for capital and labor allocation. If Mill's socialism transcends the market entirely (moving to a gift economy or planned distribution), his exit safeguard collapses. Therefore, Mill's argument *does* depend on preserving the market structure, even if it abolishes the capitalist class.

  ### 4. Is the Tension Resolvable?

  Does this reveal an unresolved contradiction, or is it resolvable within his framework?

  **The Contradiction:**
  The tension is resolvable only if one accepts that **inequality of power within the firm is inevitable**, even in a socialist one. Mill admits that the outvoted worker is "subordinate." He does not claim to eliminate subordination; he claims to make it **non-arbitrary** and **non-permanent**.

  *   **Remedy vs. Prevention:** Mill's solution is a remedy (exit), not a prevention (unanimity). He accepts that the minority will be overruled. His claim is that they are not *unfree* provided they can leave without destitution.
  *   **The Residual Contradiction:** The contradiction arises if "freedom" is defined as **non-domination** rather than **non-interference**. If a worker must constantly threaten to leave to secure fair treatment, they are still vulnerable to the structural power of the majority. The majority holds the "home advantage." The cost of exit (social disruption, finding new housing, moving) is almost always higher for the individual than the cost of replacing the individual is for the cooperative.

  **Conclusion on Resolvability:**
  Within Mill's own framework, the tension is **managed but not eliminated**.
  1.  **Logically Consistent:** It is logically consistent if socialism is defined as decentralized market socialism with constitutional protections for individual liberty.
  2.  **Practically Fragile:** It is practically fragile because it relies on the assumption that the "cost of exit" is low enough to make the threat credible. In a fully socialized economy, if cooperatives collude or if capital allocation is standardized, the exit option loses its bite.

  Mill essentially argues that **socialism is compatible with liberty only if it remains incomplete.** It must stop short of total social unity. It must preserve distinct, competing economic units (the cooperatives) and a market for labor and capital to ensure that the "right of exit" is substantive rather than formal. If socialism achieves total unity, Mill's logic suggests liberty is extinguished, not because of the state, but because of the local majority.

  Therefore, the "failure mode" you identified is the **Boundary Problem of Economic Democracy**: defining the unit of democracy such that it does not become a prison. Mill's answer is that the unit must be small enough to be democratic, but the system must be large and pluralistic enough to allow escape. Whether this is stable over time, or whether competing cooperatives would inevitably merge or standardize (eliminating exit options), is the unresolved dynamic tension in his theory.
