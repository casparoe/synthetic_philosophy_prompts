      *   **Refining the Rejection:** Actually, Step (3) is also vulnerable. It says risks come from "selecting actions by expected promotion of some objective." But myopia changes the *structure* of selection, not just the content. It breaks the chain of instrumental convergence which relies on long-term resource acquisition.
