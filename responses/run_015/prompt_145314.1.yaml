answer: |-
  It is a pleasure to engage with this puzzle, not least because it captures the exact tension that makes contractualism such a fertile but frustrating framework. Your friend is navigating the narrow path between the Scylla of simple utilitarianism, which sums everything up, and the Charybdis of absolute non-aggregation, which can lead to counterintuitive results about numbers. Based on the verdicts you have described, the rule she seems to be running is a version of pairwise comparison with a tie-breaking mechanism for numbers. In this view, moral justification proceeds by comparing the strongest individual complaint on one side against the strongest individual complaint on the other. If one complaint is significantly stronger, that side wins regardless of how many people are on the weaker side, which explains why she saves the one person facing death over the million facing headaches. However, when the complaints are of equal strength, as in the two legs versus one leg case, she allows the numbers to settle the matter. Crucially, she permits aggregation within a single life, which is why the repeated alarm wakings constitute a serious complaint even though a single waking does not. This combination of pairwise comparison, within-life aggregation, and numbers-based tie-breaking fits all her initial verdicts comfortably.

  However, there is another rule that fits her earlier verdicts at least as well, which is a lexical hierarchy of harm types. On this view, certain categories of harm simply trump others regardless of numbers, unless the harms are of the same category. Death trumps limb loss, limb loss trumps sensory loss, and sensory loss trumps temporary pain. This explains the death versus headache case without needing to calculate the precise strength of the complaint, and it also explains the two legs versus one leg case because the harms are in the same category, allowing numbers to count. The difference between these two rules becomes critical in the hospital case you plan to present. Under the pairwise comparison rule, since you have stipulated that the accumulated burden of the cramps is roughly as bad as the hearing loss, the individual complaints are of equal strength. Therefore, the tie-breaking mechanism should kick in, and she ought to save the three thousand patients. Under the lexical hierarchy rule, however, she might argue that permanent sensory loss is qualitatively superior to temporary pain, even if the overall burden is equivalent, and thus save Ms. Adeyemi.

  My best guess is that she will choose to save the three thousand patients. The reason I prefer this prediction is that she has already conceded the principle of within-life aggregation in the alarm clock case, admitting that repeated trivial harms can accumulate into a serious complaint. She has also conceded that numbers count when complaints are equal in the leg loss case. To save Ms. Adeyemi, she would have to retract one of these concessions by claiming that hearing loss is qualitatively worse than a year of cramps despite the reasonable measure of equivalence you have built into the case, or she would have to deny that the cramps aggregate within a life despite her earlier verdict. Given that she is a theorist who values consistency, it is more likely she will follow the logic of her pairwise framework than introduce an ad hoc qualitative distinction that undermines her concession on burden equivalence. She will likely argue that since each of the three thousand has a complaint equal to Adeyemi's, the numbers decide the tie.

  The single further case I would put to her to best tell the surviving rules apart, and indeed to test the coherence of her view more broadly, involves risk rather than certainty. You should ask her to compare a policy that causes one identifiable person to certainly lose a leg against a policy that exposes ten thousand identifiable people to a one in ten thousand chance of losing a leg. In the first scenario, the complaint is a certain leg loss. In the second, each individual complaint is a tiny fraction of a leg loss. If she sticks to her pairwise rule without aggregating across persons, she must save the one person, because a certain leg loss is a stronger complaint than a tiny risk of leg loss. However, if she is consistent with her verdict on the death risk case, where she saved the million exposed to risk over the one certain death, she should save the ten thousand. This case forces her to reveal whether her aggregation of risks across persons is a special exception for death or a general principle that contradicts her non-aggregation stance on certain harms.

  Regarding the coherence of her verdicts, I suspect the risk case forces her to give up something she would rather not, rendering her set of views technically incoherent without further qualification. The core contractualist prohibition is against summing benefits and harms across different people, yet her verdict on the risk case implicitly relies on summing expected harms across the population to justify overriding the certain death of one individual. If she aggregates risks to save the million, she is effectively employing a form of expected utility calculation across persons, which undermines the pairwise restriction she uses to save the one person over the million headache sufferers. To make her view coherent, she would need to argue that the ex ante principle of not exposing people to risk is itself a principle no one could reject, independent of the aggregated outcomes, but this is a difficult line to hold when the risk is small and the certain harm is large. Until she can explain why risks aggregate across persons while certain harms do not, her framework remains vulnerable to the charge that it smuggles utilitarianism in through the back door of risk assessment.
