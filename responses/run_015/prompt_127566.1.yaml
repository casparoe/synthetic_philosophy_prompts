  The second one shakes his head. "No, it's worse than plagiarism. Plagiarism leaves the concept intact. These copycats hijacked the identity conditions. Now, when the original crew points to their own soldered joints and says, 'This is a cable-marriage,' they're technically speaking falsely according to the new public criteria."

