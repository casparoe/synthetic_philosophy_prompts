answer: |-
  **STATUTORY INSTRUMENT 2038 NO. 412**

  **AUTONOMOUS SYSTEMS (CONTINUITY OF ACCOUNTABILITY) REGULATIONS 2038**

  *Made by the Secretary of State for Digital Integrity*

  **Explanatory Note**
  This instrument gives effect to section 12 of the Automation Act 2035. It addresses the administrative inconvenience of unassigned liability in high-autonomy environments. The Ministry advises that public confidence requires a named human respondent for every harm event, regardless of causal precision. These Regulations do not assess moral blameworthiness but ensure procedural continuity. The primary mechanism is the substitution of causal inquiry with administrative allocation. Where causation is opaque, liability is distributed by market presence. Where no agent is identifiable, liability is discharged via certificate. The objective is not prevention, but the elimination of responsibility gaps.

  **1. Interpretation**
  (1) "Meaningful Human Control" exists where an operator possesses an action theoretically capable of averting an outcome, disregarding human reaction latency, interface latency, or physical possibility.
  (2) Control is not negated by the operator's absence, incapacitation, or lack of access to the interface at the material time.
  (3) A "Responsibility Gap" is hereby abolished as a legal category.

  **2. Registered Responsibility Bearers**
  (1) Deployers must nominate a Registered Responsibility Bearer (RRB) for every fleet exceeding ten units.
  (2) An RRB is fit if they are reachable via standard comms and hold valid liability insurance.
  (3) Physical proximity to the system or technical competence is not required.
  (4) The maximum ratio is one RRB per fifty units.

  **3. Apportionment for Interacting Systems**
  (1) Where harm results from the interaction of two compliant systems owned by different entities, liability is split according to each entity's share of the relevant model market over the preceding twenty-four months.
  (2) Causal contribution need not be established.
  (3) The Registrar of Liability shall calculate market share using the Standardised Model Index.

  **4. Residual Liability**
  (1) Where no author is determinate, the moral remainder is discharged by the purchase of Certificates of Moral Discharge from the Commissioner for Algorithmic Attribution.
  (2) Proceeds fund the Victim Solace Fund.
  (3) Alternatively, the Deployer may attend a Formal Acknowledgement Ceremony at the Departmental Headquarters.

  **5. Conclusivity of Attribution**
  Upon issuance of Form AA-7, a responsible agent shall be conclusively deemed to have existed for the purposes of retributive justice, regardless of factual causation.

  **SCHEDULE 1**
  **WORKED EXAMPLE: INCIDENT REPORT 89-B**

  **Parties:** MedRoute Ltd (Automated Ambulance) v. SwiftDrop Ltd (Delivery Drone)
  **Incident:** Collision at Junction 4. Both systems obeyed traffic protocols. Weather clear. Sensor failure absent.
  **Analysis:**
  1.  **Control:** MedRoute operator was on lunch break off-site. Under Reg 1(1), control is meaningful as the emergency stop button was physically present on the dashboard, disregarding the operator's absence.
  2.  **RRB:** Ms. E. Vance is nominated RRB for SwiftDrop. She was insurable and reachable by email. She accepts liability under Reg 2.
  3.  **Apportionment:** Cause is distributed interaction. MedRoute holds 60% market share; SwiftDrop 40%. Liability split 60/40 under Reg 3(1).
  4.  **Residual:** No residual harm remains after financial settlement.
  5.  **Attribution:** Form AA-7 issued. Ms. Vance is deemed the responsible agent for the collision.

  **Outcome:** Procedurally complete. Moral remainder discharged.

  **Commissioner for Algorithmic Attribution**
  *12th October 2038*
