answer: |-
  Dear Colleague,

  I hope this letter finds you well and that your work on hard choices is progressing. You asked for a thought experiment that isolates a specific feature of the debate regarding incommensurable values, specifically a case where two options are on a par yet generate asymmetric vulnerability to retrospective criticism. Imagine a talented musician deciding between accepting a position as the lead violinist in a prestigious, traditional orchestra (Option A) and launching an independent career composing and performing experimental electronic music (Option B). Both options offer comparable levels of income, social recognition, and professional challenge, and neither is objectively better than the other; they represent distinct kinds of musical good, one rooted in collaborative fidelity to a canonical tradition and the other in individual innovation and sonic exploration. They are on a par. However, the value of the orchestra position is constitutively tied to subsuming one's individual artistic will to the collective interpretation of established works; if the musician chooses A but later demands creative control or treats the role as a platform for personal experimentation, she is rationally criticizable for failing to honor the normative structure of the value she chose. If she chooses B, later collaborating with others or adhering to traditional structures invites no such criticism, as the value of innovation does not demand fidelity to solitude. The asymmetry lies not in the worth of the options, but in the normative demands each value places on future agency.

  To understand why these options are on a par rather than one being better or the two being equal, we must look at the qualitative difference in the goods offered. Equality would imply that the options are interchangeable in value, such that swapping them would make no normative difference, but here the difference in kind matters deeply to the agent's identity. One option is not better because there is no common metric of musical value that ranks tradition above innovation or vice versa without remainder. They are in the same neighborhood of value, satisfying the condition for parity, yet they differ in kind. The source of the asymmetry in retrospective criticism stems from the constitutive aims of the practices involved. The orchestra role derives its value from stability and adherence to a shared standard; violating that standard undermines the very good being pursued. The independent career derives its value from flexibility and creation; changing direction is consistent with, rather than destructive of, the good being pursued. Thus, choosing A creates a second-order reason for fidelity that choosing B does not, making the agent vulnerable to criticism for infidelity only in the first case.

  The feature doing the work here is the binding nature of the value constitutive of Option A. It is a value that requires the agent to restrict their future rational discretion to be fully realized. If you were to remove this feature, perhaps by imagining an orchestra that prizes individual experimentation as much as collective fidelity, the case would collapse into a standard parity case where neither choice opens the agent to unique criticism for later shifts in attitude. The asymmetry depends entirely on one option possessing a normative structure that demands self-binding while the other does not. Without this distinction, the retrospective landscape would be symmetric, and the thought experiment would fail to isolate the specific tension you are looking for regarding how parity interacts with future rationality.

  However, I am aware that this verdict is vulnerable to objections from the very literature we are engaging with. Ruth Chang might argue that the asymmetry is not built into the values themselves but is created by the agent's will at the moment of choice. On her voluntarist view, reasons are created by choosing, so if the agent chooses A, they create the reason to be faithful, but they could have chosen to treat A as a flexible role if they willed it so. If Chang is right that the normative structure is subject to the agent's creative will, then the asymmetry is not structural but voluntary, and my claim that the values themselves dictate the criticism fails. Similarly, a proponent of the vagueness view might argue that the apparent parity is just epistemic uncertainty about which option is better, and the asymmetry in criticism is merely a reflection of our clearer understanding of the orchestra's demands compared to the independent career. If the parity reduces to ignorance, then the asymmetry is also epistemic, not structural. I would change my mind if convinced that the normative demands of the orchestra role are not constitutive of the value but are merely external social expectations that the agent can reject without rational loss. If the value of playing in the orchestra can be realized equally well by a rebellious violinist, then the criticism for infidelity loses its grip, and the case no longer demonstrates the asymmetric vulnerability I have described. Until then, I maintain that the constitutive aims of the practices offer a robust ground for the asymmetry you requested.

  I look forward to hearing your thoughts on whether this scenario successfully isolates the feature you need for your paper.

  Warmly,

  Your Colleague
