answer: |-
  ### Pedagogical Pitfalls: A Quick Brainstorm

  Right, before we lock the timetable, here's where this usually goes off the rails. I've seen this session crash more times than I care to admit.

  1.  **The Morality Trap:** Students think 'Wrong Kind' means 'Immoral'. They'll argue a reason is wrong because it's selfish or cruel. You need to sever the link between *moral* wrongness and *categorical* wrongness immediately.
  2.  **The Strength Confusion:** They'll assume WK reasons are just *weaker* reasons. You have to show a WK reason can be overwhelmingly strong (e.g., "Admire this mud or I kill your puppy") yet still fail to make the object admirable.
  3.  **The Leakage Problem:** This is the sneaky one. They'll argue that because having the attitude is useful (instrumental), the object must have some value. You need to block the move from "admiring X is good" to "X is good".
  4.  **Belief Blindness:** They treat belief like desire. If you don't establish that belief 'aims at truth' early on, the climate model twist will just look like social conformity vs. evidence, missing the structural point about doxastic norms.

  ---

  ### The Dependency Structure

  You can't just drop 'Wrong Kind of Reasons' (WKR) on them. It hangs on a specific distinction. Here's the order of operations:

  1.  **Attitudes & Correctness Conditions:** They must grasp that attitudes (admiration, belief, fear) have 'correctness conditions'. Fear is correct iff the object is dangerous. Admiration is correct iff the object is admirable.
  2.  **Reasons *For* vs. Reasons *Of*:** Distinguish reasons to *bring about* the attitude (pragmatic) vs. reasons that *justify* the attitude (constitutive).
  3.  **The WKR Problem:** Now you introduce the clash. A reason to bring it about that fails to justify it.

  If you skip step 1, step 3 is unintelligible. If you skip step 2, they'll just think it's about evidence quality.

  ---

  ### The Carrying Example: The Mathematician's Proof

  You're tempted to use admiration for a mathematician's proof. **Proceed with caution.** It works, but only if you rig the properties carefully.

  **Why it risks collapsing:**
  If the reason is "The proof solves a disease model," students will argue that *is* a reason to admire it (it's beneficial/useful). That muddies the water between instrumental value and admirability.

  **What it must have:**
  *   **The Attitude:** Admiration (specifically aesthetic or intellectual admiration).
  *   **The RK Reason:** Elegance, rigour, novelty (properties of the *proof*).
  *   **The WK Reason:** It must be external to the proof's properties. Don't use "It makes me look smart." Use a **Demon Case** variant attached to the proof. "A demon will save the world iff you admire this specific proof."

  **What it must lack:**
  *   Any hint that the WK reason reflects on the *mathematician* or the *math*. If the reason is "The mathematician is your dad," that's a bias issue, not necessarily WKR.
  *   Selfishness. Make the WK reason altruistic (save the world) so they can't dismiss it as 'bad motivation'.

  **Verdict:** Use the Mathematician for the RK side (what *does* make it admirable), but use a Demon/Threat scenario for the WK side to keep the categories distinct. Don't try to make the WK reason about the proof itself.

  ---

  ### The 90-Minute Arc

  **00–15 mins: Setting the Stage (Correctness Conditions)**
  *   **Activity:** Rapid-fire intuition pumps. "Is it possible to fear something harmless?" (Yes, but the fear is unfitting). "Is it possible to believe a falsehood?" (Yes, but the belief is incorrect).
  *   **Goal:** Lock in the idea that attitudes have a 'fit' relation to the world.
  *   **Head Off:** The idea that emotions are just feelings. They're normative assessments.

  **15–30 mins: The Distinction (Reasons For vs. Of)**
  *   **Lecture:** Draw the split. Reasons *of* the right kind bear on the object's properties. Reasons *of* the wrong kind bear on the benefits of having the state.
  *   **Example:** Paying someone to fear a harmless spider. You have a reason to fear (money), but the spider isn't fearful.
  *   **Head Off Misconception:** "But the money is a real reason!" Yes, it's a reason to *induce* the fear, not a reason that makes the fear *correct*.

  **30–50 mins: The Core Problem (The Mathematician & The Demon)**
  *   **Scenario:** Introduce the proof. RK = elegance. WK = Demon threatens to burn the library unless you admire the proof.
  *   **Discussion:** Why doesn't the threat make the proof admirable?
  *   **Head Off The Leakage:** Someone will say, "But if admiring it saves the library, the proof is valuable!" Stop them. Distinguish *value of the object* from *value of the attitude*. This is where you need to be firmest.
  *   **Typo check:** Make sure you don't write 'reasion' on the board... actually, doesn't matter, but keep the handout clean.

  **50–70 mins: The Twist (Belief & Climate Models)**
  *   **Shift:** Move from admiration to belief. This is harder because belief feels less voluntary.
  *   **Scenario:** A junior researcher forms confidence in a climate model.
      *   **RK Reason:** The data fits, the physics holds.
      *   **WK Reason:** Departmental peer pressure. If they dissent, they lose funding/job.
  *   **Discussion:** Does the peer pressure make the belief *true*? No. Does it make holding the belief *rational* pragmatically? Yes.
  *   **Nuance:** Highlight that with belief, WK reasons feel more 'forbidden' than with admiration. We think we *ought* to believe only on evidence. This touches on evidentialism.

  **70–85 mins: Synthesis & Misconception Sweep**
  *   **Review:** Bring it back to the structure.
  *   **Address:** The "Hidden Motivation" error. Remind them: It doesn't matter if the agent is selfish or saintly. A saint admiring a mud pie because a demon commands it is still using a WK reason.
  *   **Address:** The "Bad Reason" error. WK reasons aren't necessarily weak; they're categorically misplaced.

  **85–90 mins: The Check Question & Wrap**
  *   **The Question:** (See below).
  *   **Close:** Mention what we're ignoring.

  ---

  ### Mapping the Misconceptions

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"It's about selfish motives"** | During the Demon case (30-50m). | Use an altruistic threat ("Admire this or I kill the puppy"). Shows morality isn't the hinge. |
  | **"It's just weak evidence"** | During the Belief twist (50-70m). | Emphasise the peer pressure is a *strong* reason to act, just not evidence for truth. |
  | **"Instrumental value leaks"** | During Synthesis (70-85m). | Explicitly draw the line: "Usefulness of believing" ≠ "Truth of belief". |
  | **"WK reasons aren't real reasons"** | Throughout. | Concede they are genuine practical reasons, just not *fittingness* reasons. |

  ---

  ### The Niche Twist: Belief & Climate Models

  When you hit the 50-minute mark, pivot hard.

  **The Setup:**
  "Imagine Dr X. She assesses a climate model. The data is messy (weak RK reasons). However, her entire department backs the model. Dissent means career suicide (strong WK reasons)."

  **The Point:**
  With admiration, we accept we can 'choose' to admire for WK reasons (maybe we cultivate the feeling). With belief, we feel we *can't* believe for WK reasons (doxastic involuntarism). But the WKR problem remains: The peer pressure is a reason to *assert* or *maintain* the belief, but it's the wrong kind of reason to make the belief *correct*.

  This shows the WKR problem isn't just about emotions; it's about any attitude with a correctness condition (like truth).

  ---

  ### The One Check Question

  Don't ask them to define WKR. Ask this:

  > "Imagine a reason that makes it **beneficial** for you to hold an attitude, but provides **no support** for the attitude being correct. Is this reason RK, WK, or no reason at all? Now, imagine a reason that makes the attitude **correct** but holding it would be **harmful**. Is this RK or WK?"

  **Why this works:**
  *   Part 1 tests if they see benefit ≠ correctness (WK).
  *   Part 2 tests if they see correctness is independent of benefit (RK).
  *   If they say 'harmful means WK', they've failed. They've collapsed value into fittingness.

  ---

  ### What to Openly Skip

  Be transparent. Tell them:
  "We are skipping the **meta-ethical reduction**. We aren't asking today *why* fittingness is the standard, or whether 'admirable' reduces to 'reasons to admire'. We're taking the normativity of attitudes as a given. If we dive into the analysis of fittingness, we'll drown in meta-ethics and miss the structural distinction."

  Also skip **Doxastic Voluntarism**. Don't get bogged down in whether we *can* choose beliefs. Just focus on the reasons themselves.

  ---

  Right, that should keep them on the rails. Just watch out for that instrumental leakage—it's the hardest thing to stop once it starts. Good luck with the session.
