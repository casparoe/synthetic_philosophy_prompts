  The DSM work group spent four years refining "anticipatory dysregulation": rehearsing future conversations and self-diagnosing via criteria lookup. Field trials returned a kappa of 0.99; prevalence doubled between site visits.

  Alarmed, the committee added an exclusion: "Not better accounted for by familiarity with the criteria."

  They believed this would purify the category. Instead, participants simply began rehearsing explanations of why their familiarity wasn't the cause. The exclusion criterion immediately became the disorder's strongest predictor.

  If quarks subscribed to *Physical Review*, they'd oscillate similarly. Fortunately, nature doesn't read the journals.
