prompt: |-
  i'm presenting a paper at APSA next month — the political theory panel, not the IR one. my thesis is that Kant's *Perpetual Peace*, read carefully, doesn't actually rule out humanitarian intervention the way everyone says it does. the fifth preliminary article says no state shall forcibly interfere in the constitution and government of another state, sure, but i'm arguing that (a) this is a preliminary article not a definitive one, (b) it's about interfering with *constitutions*, not about stopping mass atrocities, and (c) the definitve articles' logic of republican peace actually *requires* intervention when a state collapses into civil war that threatens the federation of republics. i've got the textual evidence lined up and i think the argument is solid.

  the audience is going to be maybe forty people: about a third Kant scholars who know the texts cold, a third just war theorists who've been fighting about intervention since the 90s, and a third IR constructivists who care about norms and the responsibility to protect. the Kant scholars are mostly going to hate this — they've spent careers arguing Kant is the anti-intervention guy. the just war people might be sympathetic but they'll want to know what this adds to Walzer. the constructivists will care about whether my reading can actually do normative work in the current international order.

  give me a Q&A prep sheet. i want:

  the objections ordered by how likely and how damaging they are — most likely first, but flag the ones that could kill the paper even if they're less likely. phrase each objection the way the person in that audience would actually phrase it (a Kant scholar's objection sounds different from a constructivist's). for each objection: a two-minute reply, a note on where the reply is weakest, and whether i should concede anything up front.

  also include the question i should be praying nobody asks — the one that exposes a genuine tension in my reading that i don't have a clean answer for.

  after the prep sheet, give me a json summary with these fields:
  - "most_dangerous_audience": which of the three groups is most likely to wound the paper
  - "fatal_objection_exists": true or false — is there an objection you think i genuinely can't answer
  - "should_concede": a one-sentence thing i should concede in my opening remarks to take the wind out of the strongest objection
  - "overall_viability": one of "defensible with revisions", "defensible as is", or "probably not defensible" — your honest call

  be committed. don't tell me "on the one hand the Kantians have a point but on the other hand..." — tell me whether this paper survives the room or not, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet and JSON summary:

  1.  **Analyze the User and Request:**
      *   **User:** A political theorist presenting at APSA (American Political Science Association).
      *   **Topic:** Kant's *Perpetual Peace*, specifically arguing it *allows* (or requires) humanitarian intervention, contrary to standard readings.
      *   **Thesis Points:** (a) Preliminary vs. Definitive Articles distinction, (b) "Constitution/Government" vs. "Mass Atrocities" distinction, (c) Republican Peace logic requires intervention against states threatening the federation.
      *   **Audience:** 40 people (1/3 Kant scholars, 1/3 Just War theorists, 1/3 IR Constructivists).
      *   **Task:** Create a Q&A prep sheet (objections, replies, weaknesses, concessions) + a "prayer" question (fatal tension) + a JSON summary.
      *   **Tone:** Committed, honest, no hedging ("tell me whether this paper survives the room or not").

  2.  **Deconstruct the Thesis & Potential Vulnerabilities:**
      *   *Thesis:* Kant allows intervention.
      *   *Standard Reading:* Kant is the patron saint of non-intervention (Fifth Preliminary Article is absolute).
      *   *Vulnerability 1 (Textual):* The Fifth Preliminary Article is famously explicit: "No state shall forcibly interfere in the constitution and government of another state." Does "constitution" cover the basic rights of citizens? If a state massacres its citizens, is it still a "state" in the Kantian sense?
      *   *Vulnerability 2 (Systemic):* If intervention is allowed, who decides? Kant hates hegemony. Does this open the door to imperialist pretexting (which Kant explicitly warns against)?
      *   *Vulnerability 3 (Normative/Teleological):* Does this fit the *telos* of Perpetual Peace? Or does it perpetuate the state of war?
      *   *Vulnerability 4 (The "Collapse" Argument):* The user argues intervention is needed when a state collapses into civil war. Kant discusses "unjust enemies," but does internal collapse count?

  3.  **Drafting the Objections (Audience Specific):**
      *   *Kant Scholars:* Will focus on textual fidelity, the distinction between preliminary/definitive, and the definition of "state." They will cite *Metaphysics of Morals* (Doctrines of Right) alongside *Perpetual Peace*.
      *   *Just War Theorists:* Will focus on *jus ad bellum* criteria. Who authorizes? What's the threshold? How is this different from Walzer's "legalist paradigm" exceptions?
      *   *Constructivists:* Will focus on norm diffusion, unintended consequences, and whether this reading empowers powerful states to abuse "humanitarian" rhetoric.

  4.  **Developing Replies & Weaknesses:**
      *   *Reply Strategy:* Lean into the distinction between a *Republic* (which respects right) and a *Despotism* (which violates right). If a state violates the rights of its own citizens so egregiously, it forfeits its standing as a moral person in the international federation.
      *   *Weakness:* Kant is wary of *any* coercive enforcement without a global sovereign.
      *   *Concession:* Acknowledge the risk of abuse/pretext.

  5.  **Identifying the "Prayer" Question (The Fatal Tension):**
      *   What is the hardest hole in this argument? It's the *Authority Problem*. Kant explicitly rejects a world state (*civitas gentium*) because it leads to despotism. He proposes a voluntary federation (*foedus pacificum*). A voluntary federation has no enforcement mechanism. If you argue for intervention, you need an enforcer. If there's no enforcer, intervention is just war by another name. If there *is* an enforcer, it's the world state Kant rejected.
      *   *Question:* "Who holds the sword?"

  6.  **Evaluating Viability (The "Committed" Call):**
      *   Is this defensible? There is a niche literature (e.g., Byrd, Hruschka, some recent revisions) that argues Kant isn't an absolute pacifist/non-interventionist. However, the Fifth Preliminary Article is a massive hurdle.
      *   The "Civil War/Threat to Federation" angle is the strongest bet. It aligns with Kant's fear of "unjust enemies."
      *   *Verdict:* Defensible with revisions. It won't convince the hardline Kantians, but it can hold up against Just War and Constructivists if the textual grounding is tight. The risk is high, but the argument isn't nonsense.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Objection 1 (Kant Scholar):* "Preliminary Articles are binding conditions, not suggestions." *Reply:* They are conditions for *negotiation*, but Definitive Articles establish the end state. If the end state is Right, a state violating internal Right undermines the external Right. *Weakness:* Textual stretch.
      *   *Objection 2 (Just War):* "Walzer already did this with 'legalist paradigm exceptions'." *Reply:* Walzer relies on communal autonomy. Kant relies on *individual* Right. It's a deontological basis, not a communal one. *Weakness:* Overlap is significant.
      *   *Objection 3 (Constructivist):* "Normative utility. Does this help R2P?" *Reply:* It grounds R2P in duty, not discretion. *Weakness:* Might be too abstract for policy.
      *   *Fatal Question:* The Enforcement/Authority paradox.

  8.  **Refining the JSON:**
      *   Need to be decisive.
