      *   Fatal objection: True (The Authority Problem).
      *   Concession: Acknowledge the risk of pretext.
      *   Viability: Defensible with revisions (needs to address the enforcement mechanism more clearly).

  9.  **Final Review against Constraints:**
      *   Two-minute replies? (Keep them concise but substantive).
      *   Specific audience phrasing? (Yes).
      *   JSON format? (Yes).
      *   No hedging? (Yes).

  10. **Final Polish:** Ensure the tone is professional, sharp, and ready for a high-stakes academic panel. (Self-Correction: Make sure the "Fatal Objection" isn't just "Kant says no." It needs to be an internal tension in the *user's* reading.) -> The tension is between *intervention* and the *lack of a supranational authority*.

