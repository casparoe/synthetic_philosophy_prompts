answer: |-
  **Alex (Naturalist):** Let's start with the biostatistical account. Health is normal functional ability, statistically defined within a relevant reference class. It's objective because it relies on empirical data about species design, not moral judgments.

  **Jordan (Normativist):** The devil is in "relevant reference class." Take a person with a hereditary condition resulting in adult height significantly below the species mean. If your reference class is *Homo sapiens*, they're statistically abnormal. Does that make them unhealthy?

  **Alex:** Not necessarily. We partition reference classes by age, sex, and other biological factors that affect functional design. If this short stature is the expected phenotypic expression of their specific genotype, then within the class "persons with genotype G," their height is normal. They are healthy.

  **Jordan:** But why choose "persons with genotype G" as the class? Why not "adult males"? The choice determines the verdict. If you choose the broader class, you pathologize the condition; if you choose the narrower, you normalize it. What scientific fact dictates the granularity of the class? It seems you're narrowing the class to avoid labeling a natural variation as a disease. That's a value judgment about what counts as a "standard" human, not a biological fact.

  **Alex:** It's not about avoiding labels; it's about mechanistic homogeneity. A reference class must be uniform regarding the functional organization being measured. If genotype dictates the functional design for height, mixing genotypes obscures the biological norm. We aren't valuing the individual; we're respecting the biological structure.

  **Jordan:** "Respecting the biological structure" sounds neutral, but "structure" implies design. And that leads to my second worry. You define function as causal contribution to survival and reproduction. Consider the heart. It pumps blood, but it also makes thumping sounds. Both are causal effects. Why is pumping the *function* and the sound merely a byproduct?

  **Alex:** Because pumping contributes to survival. The sound doesn't. We can trace this etiologically: hearts were selected for pumping, not sounding. That's a historical fact about evolutionary selection, not a normative goal.

  **Jordan:** Is it? To say a trait is "for" survival is to adopt survival as the *telos* of the organism. But why is survival the metric of health? A organism could be designed for rapid reproduction followed by decay, or for stability over longevity. By privileging survival and reproduction as the standard of functional success, you're importing a normative commitment to biological fitness. You're saying an organism *ought* to pursue survival.

  **Alex:** I'm not saying it *ought* in a moral sense. I'm saying that's how biological systems are organized. The concept of "function" in biology is inherently tied to systemic contribution to maintenance and continuity. If a heart fails to pump, the system collapses. That's a causal fact about the system's integrity, not a value we impose.

  **Jordan:** But systemic integrity is itself a normative concept. You've decided which causal roles constitute "integrity." If a person's heart pumps inefficiently but they live a long, happy life due to medical intervention, is the heart unhealthy? You'd say yes, because it deviates from the species-typical contribution to survival. I'd say the judgment of "unhealthy" relies on valuing the typical survival pathway over the actual lived outcome. The function isn't just a causal role; it's a causal role *evaluated* against a standard of success.

  **Alex:** I grant that health is a positive concept, but the evaluation is internal to the biology. Think of it like this: if a car engine doesn't combust fuel efficiently, it's malfunctioning, regardless of whether the car is parked in a museum. The standard is the design specification. In organisms, the "design specification" is fixed by evolution. We aren't valuing survival; we're using survival as the empirical indicator of successful design.

  **Jordan:** But cars have designers with intentions. Organisms have evolutionary histories blind to goals. When you reconstruct "design" from blind history, you have to interpret which traits were selected *for*. That interpretation is underdetermined by the data. You could interpret short stature as a failure of growth mechanisms or as a successful adaptation to resource scarcity. Choosing the "failure" interpretation to maintain a universal standard of health requires valuing one evolutionary narrative over another.

  **Alex:** It requires choosing the most granular biological explanation available. If the growth mechanism is operating as designed for that genotype, it's healthy. If the mechanism is broken relative to that genotype, it's diseased. The normativity stops at the boundary of the biological description. We identify the mechanism, measure its efficiency, and compare it to the reference class. Where exactly does the value enter the measurement?

  **Jordan:** It enters at the selection of the mechanism itself. Why is height a functional property relevant to health, rather than, say, melanin production? Both are statistical. You prioritize traits linked to survival and reproduction. But that prioritization reflects a specific conception of what life is *for*. If you defined health as "capacity for spiritual contemplation," your reference classes and functional standards would look entirely different. You claim objectivity, but you've built normativity into the foundation of "function" and "reference class."

  **Alex:** I'd argue that "capacity for contemplation" supervenes on biological function. You can't contemplate if your brain is failing. The biological level is foundational. If the foundation is statistically normal, the person is healthy, even if they lack contemplation. The normativist conflates health with well-being. I'm trying to isolate health as a biological substrate.

  **Jordan:** And I'm arguing you can't isolate the substrate from the evaluation of what counts as a working substrate. The height case shows the reference class is flexible based on what we want to pathologize. The heart case shows "function" relies on a teleological standard of survival. You haven't eliminated values; you've just hidden them inside the biology.

  **Alex:** Perhaps. But hiding them there allows medicine to operate without constant ethical renegotiation of every diagnosis. If health is biological normality, we can agree on the facts even if we disagree on the values.

  **Jordan:** Only if we agree on the biology. And as we've seen, even the biological descriptions rely on choices that look suspiciously like values.

  **Alex:** Then we're at an impasse. You see value-laden choices where I see biological constraints.

  **Jordan:** Precisely. And until you can explain why the biological constraints dictate the choices without appealing to the value of survival itself, the naturalist account remains vulnerable.

  **Alex:** And until you can offer a normative account that doesn't collapse health into general well-being, the normativist account remains too broad for clinical use.

  **Jordan:** Fair enough. Shall we look at the mental health case next?

  **Alex:** Let's.
