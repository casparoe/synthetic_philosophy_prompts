answer: |-
  **The case** — A large asset management firm awards annual bonuses to its portfolio managers based strictly on single-year risk-adjusted returns. Strict compliance ensures no manipulation, so the metric reflects honest performance. For any given manager, the return is an unbiased estimator of skill: higher average returns genuinely indicate higher competence over time. Measuring the return does not alter the manager's underlying ability or market conditions. Yet, year after year, the firm finds that last year's top performers rarely repeat their success, while consistently skilled managers often miss the bonus threshold due to temporary market headwinds. The bonus committee uses the data exactly as designed—to identify excellence—but systematically rewards luck rather than skill, leaving true high-performers demotivated. Casual observers see a strong correlation across the whole firm and assume the system works, missing the distortion at the tails.

  **The mechanism** — This is Extremal Goodhart driven by regression to the mean. The metric is signal plus noise. Across the population, signal dominates, so the correlation holds. However, selection focuses on the tails. At the extreme upper end, the probability that a high score is due to noise rather than signal increases dramatically. By selecting the top decile, the institution inadvertently selects for maximum positive noise. Since noise is transient, future performance reverts to the mean, revealing the metric failed to track true skill at the threshold that mattered. The structure guarantees that the observed elite differs from the true elite. No individual error occurs; the mathematics of selection on noisy proxies ensures the rewarded group contains more lucky amateurs than skilled professionals relative to the true top tier.

  **Turn the dial** — As selection tightens from the top 10% to the top 1%, the distortion worsens non-linearly. In the top 10%, signal still contributes significantly to inclusion. In the top 1%, noise dominates; the majority of selected individuals are there primarily due to statistical outliers rather than superior skill. The overlap between the rewarded group and the truly skilled group shrinks sharply, meaning the bonus budget is increasingly wasted on false positives.

  **The fix** — Implement Bayesian shrinkage or multi-year averaging. Instead of raw annual returns, use a weighted estimate that pulls individual scores towards the population mean based on the noise-to-signal ratio. Alternatively, require consistency over three years. This reduces the variance of the estimator, ensuring that only those with sustained signal exceed the threshold, filtering out transient luck without abandoning quantitative assessment.

  **The comeback** — Objection: This isn't Goodhart's Law; it's ordinary measurement error. Goodhart requires the metric to break *because* it was targeted, not just because it's noisy.
  Reply: Classic Goodhart focuses on behavioural response, but the broader definition covers any systematic divergence when a measure becomes a target. Here, the act of selection moves the institution into a statistical regime where the proxy diverges from the goal. The metric hasn't changed, but its validity for the selected subset has collapsed. Ignoring this structural failure because 'no one cheated' mistakes statistical inevitability for operational success. Policymakers must distinguish between gaming and statistical limits to avoid false confidence.
