  **The case** — the scenario itself, about 150 words, no commentary.
  **The mechanism** — what's really happening, about 150 words.
  **Turn the dial** — what happens as the selection gets harsher, about 80 words.
  **The fix** — one concrete change, about 80 words.
  **The comeback** — the strongest objection to your diagnosis, then your reply, about 120 words.

  One more thing: I'd rather the case be one where a casual observer would look at the metric and think it's working fine. And if you think the spec is unsatisfiable as stated, don't fudge it — say so and tell me which condition has to give.
