answer: |-
  CONCEPTUAL AXES

  To map the logical space without presupposing conclusions, we vary four independent dimensions. Each branch question below isolates one axis.

  1.  **Source of Disvalue:** Is the "extra" badness explained by the deaths themselves (psychological weight), or is it a distinct harm caused by the end of the lineage?
  2.  **Subject of Harm:** Must the harm be bad *for* existing people (person-affecting), or can the world simply be worse impersonally?
  3.  **Continuity Condition:** If the future matters, does it require biological humans, human culture, or merely conscious value-carriers?
  4.  **Future Valence:** Does the value of the future depend on it being net-positive (happy), or is existence itself valuable regardless of suffering?

  LOGICAL SPACE COMBINATIONS

  There are 16 theoretical combinations of these axes (2x2x2x2). The tree below prunes this space into 9 occupied leaves. The remaining 7 combinations are largely empty (see "Empty Combinations" below).

  DIAGNOSTIC TREE

  Q1: Is the intuition that extinction is worse explained entirely by the magnitude of the deaths?
  |
  +-- YES --> [LEAF 1: Nothing Beyond Deaths]
  |             (Awkward commitment: The shared intuition that extinction is *worse* is a cognitive error.)
  |
  +-- NO --> Q2: In the sterilizing pandemic (full lives, no children), is there still extra badness?
               |
               +-- NO --> Q3: Is the badness for current people primarily about lost happiness?
               |            |
               |            +-- YES --> [LEAF 2: Existing Projects Cut Short]
               |            |           (Awkward commitment: A meaningful life cut short is no worse than a happy one.)
               |            |
               |            +-- NO --> Q4: Does the meaning require a future audience?
               |                         |
               |                         +-- YES --> [LEAF 3: Meaning Needs Aftermath]
               |                         |           (Awkward commitment: A hermit's life loses value if no one finds the diary.)
               |                         |
               |                         +-- NO --> [LEAF 4: Internal Project Value]
               |                                     (Awkward commitment: Meaning is solipsistic and survives extinction.)
               |
               +-- YES --> Q5: Is the value of the future impersonal (sum of lives)?
                            |
                            +-- YES --> Q6: If the future is net suffering, is preventing it still bad?
                            |            |
                            |            +-- NO --> [LEAF 5: Lost Future Value]
                            |            |          (Awkward commitment: A future of mild suffering is still a loss if prevented.)
                            |            |
                            |            +-- YES --> [LEAF 6: Existence Impersonal]
                            |                       (Awkward commitment: We should ensure existence even if it guarantees net suffering.)
                            |
                            +-- NO --> Q7: If uploads/aliens inherit everything, is the extra badness avoided?
                                         |
                                         +-- YES --> [LEAF 7: Universal Continuity]
                                         |           (Awkward commitment: Human extinction is fine if aliens write our history.)
                                         |
                                         +-- NO --> Q8: If 5k humans survive but culture is lost, is extinction avoided?
                                                      |
                                                      +-- YES --> [LEAF 8: Biological Continuity]
                                                      |           (Awkward commitment: A feral human lineage is better than flourishing uploads.)
                                                      |
                                                      +-- NO --> [LEAF 9: Cultural Project Continuity]
                                                                  (Awkward commitment: Biological humans are replaceable if the archive survives.)

  INDISTINGUISHABLE LEAVES

  Leaf 5 (Lost Future Value) and Leaf 6 (Existence Impersonal) are difficult to separate without the Net-Negative case.
  *Further Question:* "If the next generation is guaranteed to live lives they rate as 'not worth starting,' do we have a duty to conceive them?"

  EMPTY COMBINATIONS

  1.  **Biological Continuity + Successor Neutral:** Incoherent. If biology matters, non-biological successors cannot substitute.
  2.  **Nothing Beyond Deaths + Sterilizing Badness:** Incoherent. If only deaths matter, a painless end of the lineage with no early deaths adds no badness.
  3.  **Impersonal Value + Human Specific:** Unattractive. Impersonal value usually treats consciousness as substrate-neutral; privileging human biology arbitrarily is rare.

  \answer{Is the intuition that extinction is worse explained entirely by the magnitude of the deaths?}
