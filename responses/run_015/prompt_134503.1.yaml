  Dear Friend,

  Your observation touches on one of the most critical and often under-discussed tensions in the field, and you are right to feel that something significant is being glossed over. The gap you are identifying is most rigorously categorized within the safety community as the distinction between inner alignment and outer alignment. Inner alignment refers to the technical challenge of ensuring the model reliably pursues the objective it was given during training, which covers the behaviors you noted like avoiding deception, maintaining transparency, and following instructions precisely. Outer alignment, conversely, is the problem of ensuring that the objective we actually give the model aligns with broader human values and ethical goods. When researchers focus heavily on robustness and obedience while assuming the reward model captures the right values, they are effectively prioritizing inner alignment while treating outer alignment as a solved or trivial problem. This technical division of labor often creates the impression that alignment is primarily an engineering control problem rather than a philosophical specification problem.

  Another framework used to describe this disconnect is the difference between intent alignment and impact alignment. Intent alignment means the system is trying to do what the operator wants, whereas impact alignment means the system's actions actually result in good outcomes for humanity. The disconnect you see arises when the field conflates loyalty to the operator with benevolence toward the world. This is sometimes critiqued as the assumption that intent alignment is sufficient for impact alignment, ignoring the possibility that the operators themselves might have flawed intentions or that the specification of their wishes might miss crucial moral nuances. This touches on the value loading problem, which questions how exactly normative truths are transferred into the system's objective function in the first place. While there is no single capitalized proper noun that universally names this specific gap across all disciplines, referring to it as the inner-outer alignment gap or the intent-impact gap will signal to experts that you understand the precise structural weakness you are describing.

  Regarding the hidden premise you identified, there is not a single universally standardized noun for it, but it is frequently discussed under the banner of scaling optimism or the belief that outer alignment is easy. When proposals suggest that scaling up reward modeling will solve alignment, they are operating on the assumption that human preferences can be fully captured through behavioral feedback without needing a deeper conceptual framework for ethics. Critics often refer to this as the conflation of capability control with value alignment, or simply the assumption that the orthogonality thesis does not apply to advanced systems. The orthogonality thesis posits that intelligence and final goals are independent, meaning a highly capable system can pursue any goal, good or bad. Assuming that increased control automatically yields moral wisdom contradicts this thesis and is sometimes characterized as a form of technocratic optimism where procedural correctness is mistaken for normative correctness. Some scholars in the social sciences simply call this the control-value conflation.

  Ultimately, the tension you are writing about is the gap between technical safety and philosophical ethics. While the engineering community often uses the terms inner and outer alignment to separate these tasks, the cultural tendency to assume the latter will follow from the former is what drives the disconnect you noticed. It is a reliance on the idea that if we can lock in the builder's intentions, the moral quality of those intentions is secondary or self-correcting, a premise that remains one of the most contested assumptions in the long-term safety discourse. I hope this vocabulary helps you articulate the nuance you are looking for in your feature.

