answer: |-
  The sensation had no name in any language Elias knew. It was not pain, not dizziness, not fear. It was a specific internal settling, like a heavy coin dropping through water into the pocket of his stomach. He called it *the drop*.

  It happened irregularly. Sometimes once a month, sometimes three times a week. It lasted only seconds, but it left a residue, a metallic taste on the tongue and a slight loosening of the focus in his left eye.

  Elias was a man who trusted precision. He restored antique clocks, coaxing fractured gears back into synchronous time. He believed that if a thing happened, it could be measured. If it could be measured, it could be named.

  He bought a ledger bound in grey cloth. On the first page, he drew a symbol: a vertical line crossed by a small, open circle. He decided that this mark would not *describe* the drop. It would *be* the drop, transferred to paper.

  The first time he logged it, he stopped everything. He was sanding a mahogany casing. He felt the coin fall. He put down the sandpaper. He sat at his desk. He closed his eyes and focused on the sensation, holding it in his mind like a delicate component. He pointed his attention at it, internally saying *This. This is it.* Then he opened his eyes and drew the symbol. He did not look at the page until the ink was dry. He wanted the hand to be a direct conduit for the feeling.

  For five years, he was scrupulous.

  He created conditions. The ledger stayed on the same desk. The pen was always the same fountain pen, nib medium, black ink. He never made a mark standing up, or in haste, or while angry. If the drop came while he was eating, he waited until he had finished, washed his hands, and sat in the quiet of his study. He needed the context to be neutral so the mark would be pure.

  He felt he was building a bridge between the inner world and the outer world. He was capturing a ghost.

  In the sixth year, he began to notice a variation.

  He was reviewing the ledger, as he did every winter solstice. He traced the columns of symbols with his finger. Most of the marks looked alike. But some seemed… heavier. The loop of the circle was tighter, the vertical line pressed harder into the paper, sometimes tearing the fiber slightly. Others were lighter, the ink skimming the surface, the circle more oval than round.

  He paused. Had the drop changed? Or had his hand changed?

  He decided to refine the system. He would not make two symbols—that would imply two different sensations, which he couldn't verify. Instead, he would focus harder. He would ensure that every future mark was made with the exact same pressure, the exact same internal concentration. He would stabilize the reference point.

  He tried. When the drop came next, he sat. He closed his eyes. He waited for the coin to fall. He focused on the memory of the previous marks, trying to align the current feeling with the past standard. He sought the essence of the drop, the invariant quality that made it *the drop* and not something else.

  He drew the symbol.

  He looked at it. It looked like the heavier ones.

  He waited for the next one, a week later. He focused even more intensely. He tried to strip away the context, the mood, the time of day. He wanted only the sensation itself. He drew the symbol. It looked like the lighter ones.

  He sat back. He looked at the page. He had two distinct families of marks now. Cluster A: dark, tight, decisive. Cluster B: pale, loose, drifting.

  Elias tried to interrogate his memory. He closed his eyes and recalled the sensation associated with Cluster A. It felt sharp, sudden. He recalled Cluster B. It felt dull, lingering.

  But then a doubt arose, cold and quiet. Was the sensation actually different? Or had he simply decided, in the moment of drawing, that *this* instance was the sharp kind?

  He tried to test it. He waited for the drop. When it came, he asked himself: *Which is this?*

  He felt the coin fall. It felt… like itself.

  He looked at the ledger. *Does this match A or B?*

  He felt it matched A. He drew the mark dark and tight.

  But as the pen lifted, he realized the trap. If he had felt it matched B, he would have drawn it light and loose. And whatever he decided would have been correct, because there was no third thing to check against. There was only the feeling and the mark. The feeling couldn't check the mark, because the feeling was gone the moment the ink touched paper. The mark couldn't check the feeling, because the mark was just ink.

  He tried to concentrate harder. He tried to summon the "true" definition of the drop he had established six years ago. But the memory of that original definition was just another feeling now, another image in his head. It was like trying to check if a newspaper story was true by buying another copy of the same newspaper.

  He realized he could not be wrong.

  If he looked at a mark from three years ago and thought, *That was a heavy drop,* there was no way to prove he was mistaken. Even if he felt a heavy drop now and drew a light mark, he could just say, *My hand slipped,* or *The drop has changed.* There was no rule he could follow that wasn't also subject to his own interpretation of the rule.

  Whatever seemed right to him was right. And where there is no possibility of being wrong, there is no possibility of being right, either. There is only occurrence.

  He closed the ledger. He felt a strange lightness. He had thought he was building a map. Instead, he had been making a collection of echoes.

  The doorbell rang. It was Mrs. Gable from next door, returning a borrowed pot.

  Elias stood up to answer it. As he walked to the hall, the drop came. The coin fell. The metallic taste bloomed.

  He stopped in the hallway. Instinctively, his hand went to his stomach. He grimaced, a sharp intake of breath hissing through his teeth. He leaned against the wall for a second to steady himself.

  He opened the door. Mrs. Gable saw his face. She saw the hand on his stomach. She saw the pallor of his skin.

  "Oh, Elias," she said, her voice shifting into a tone of shared understanding. "Is it the migraine again?"

  Elias nodded. He couldn't speak for a moment.

  "You look terrible," she said, not unkindly. "You should sit down. Do you need water? I have some aspirin."

  "No," Elias said, his voice returning. "Just… the drop."

  "The drop?" she asked.

  "Yes. Just that."

  "Well, sit down anyway. Don't stand in the draft."

  She waited until he sat in the armchair. She placed the pot on the table. There was a check here. If he had said "I feel wonderful" while grimacing and clutching his stomach, she would have said he was lying or confused. If he had said "It's the drop" but smiled and danced around the room, she would have doubted him. Her understanding of his sensation depended on his behavior, his context, his history with her.

  She left. Elias sat in the quiet.

  He looked at the grey ledger on the desk. He opened it to the last page. He looked at the two clusters of marks.

  He realized now what the book was. It was not a dictionary. It was not a logbook. It was not a scientific record.

  It was a series of groans.

  When he had made the marks, he hadn't been describing the sensation to anyone. He hadn't been establishing a truth. He had been reacting. The ink was the vocalization. The pressure of the pen was the volume of the cry. The variation between Cluster A and Cluster B wasn't a failure of notation; it was the difference between a sharp cry and a long moan.

  A cry doesn't need to be consistent. A cry doesn't need to be verifiable. It just needs to be uttered.

  He ran his finger over the ink. He had wanted the marks to be windows into his soul. Instead, they were fingerprints. They showed that he had been here, that he had felt this, that he had reacted.

  He took a fresh sheet of paper. He didn't sit at the desk. He stood by the window. He felt the residue of the drop fading.

  He picked up his pen. He didn't focus. He didn't try to align the feeling with the past. He didn't try to be precise. He simply let his hand move as the feeling faded, drawing a loose, wandering line that trailed off into nothing.

  It wasn't a symbol. It wasn't a word. It was a trace.

  He pinned the paper to the wall next to the desk. It looked like nothing much. But if Mrs. Gable came in, she wouldn't ask what it meant. She might ask if he was alright. And if he pointed to the paper and then to his stomach, she would nod.

  Elias closed the ledger. He put it on the shelf next to his tools. It belonged there. It was not a key to a lock. It was just another thing he had made, like a clock that didn't tell time, but ticked anyway, marking the passage of the maker rather than the hours of the day.

  He went back to his workbench. He picked up a gear. It was solid, cold, public. It fit into another gear with a click that anyone could hear. He listened to the click. It was satisfying. It was right. And if it were wrong, the clock would stop, and everyone would know.

  He smiled, just slightly, and began to wind the spring.
