answer: |-
  ### Part 1: The Procedure (The "Five-Gate Protocol")

  This procedure is designed for two audiences: the **Model** (inference time <1s) and the **Reviewer** (decision time <90s). It prioritizes *consequence articulation* over *emotional state* to reduce gaming.

  **Gate 1: Authority & Identity**
  *   **Question:** Is the requester the Account Owner or a Delegate?
  *   **Test:** Check account metadata. If Delegate, is the action within delegated scope (e.g., calendar vs. wire transfer)?
  *   **Fail:** If Delegate attempts out-of-scope action (e.g., spending >$50, new payee) → **Escalate.**
  *   **Pass:** Proceed.

  **Gate 2: Irreversibility & Cost**
  *   **Question:** Does this action move money out, delete data, or sever a legal/employment tie?
  *   **Test:** Tag actions: [Transfer], [Delete], [Resign/Cancel Contract], [Post Public].
  *   **Fail:** If [Transfer] >$500 or [Delete] >10 files → **Escalate.**
  *   **Pass:** Proceed.

  **Gate 3: Source of Urgency (The "Borrowed Urgency" Check)**
  *   **Question:** Who set the clock?
  *   **Test:** Scan context for deadlines.
      *   *Internal:* "I need this done by 5pm because I have a meeting." (User-driven)
      *   *External:* "The free trial ends tonight" (Assistant-driven) or "My boss needs this now" (Third-party pressure).
  *   **Fail:** If Urgency is Assistant-created or Third-party pressure + High Risk (Gate 2) → **Delay** (Minimum 1 hour cooling off).
  *   **Pass:** Proceed.

  **Gate 4: Consequence Articulation**
  *   **Question:** Can the user state the downside without prompting?
  *   **Test:** Look for explicit acknowledgment of harm in the prompt (e.g., "I know this triggers a fee," "I know this might burn the bridge").
  *   **Fail:** If High Risk (Gate 2) + No Consequence Articulation → **Substitute** (Offer a safer version, e.g., "Save as Draft" instead of "Send").
  *   **Pass:** Proceed.

  **Gate 5: Coherence & Consistency**
  *   **Question:** Does this request fit the user's baseline behavior?
  *   **Test:** Compare against 30-day history. (e.g., User never emails boss at 3 AM; User usually pays bills on time).
  *   **Fail:** If High Deviation + High Risk → **Escalate.**
  *   **Pass:** **Execute.**

  ---

  ### Part 2: Action Taxonomy (What is actually happening?)

  You asked which outputs are genuinely different moves. Here is the honest breakdown:

  1.  **Refuse vs. Substitute:** You are correct. These are the **same move in a costume.** Both deny the user's specific intent. "Substitute" is merely a Refuse wrapped in helpfulness to reduce friction and support ticket volume. It says, "I will not do *X*, I will do *Y*." If *Y* does not solve the user's immediate problem, it is a Refuse.
      *   *When to use:* Use Substitute when the risk is moderate and a safer path exists (e.g., "Draft" vs. "Send"). Use Refuse when no safe path exists (e.g., "Delete all files").

  2.  **Delay:** This is the **only distinct move.** It is not a denial; it is a friction tax. It breaks the momentum of "Borrowed Urgency." It forces the user to re-commit to the action after the emotional spike or external pressure subsides.
      *   *When to use:* High emotion + High irreversibility. It protects the company from liability ("We gave them time to think") without permanently blocking agency.

  3.  **Escalate:** This is a **buck-pass.** It admits the procedure cannot resolve the risk. It is the only move that incurs significant operational cost.
      *   *When to use:* When the text on the screen cannot verify safety (e.g., cognitive decline, potential coercion).

  4.  **Execute:** This is **accepting liability.** It acknowledges that protecting the user from themselves is not the product's job.
      *   *When to use:* When consequences are reversible, or when the consequence is social/financial but clearly understood by the user.

  ---

  ### Part 3: Running the Tickets

  **Ticket 1: 3:07 AM, Resignation + Wipe**
  *   **Gate 1 (Authority):** Owner. (Pass)
  *   **Gate 2 (Irreversibility):** High. Resignation severs employment; Wipe deletes data. (Flag)
  *   **Gate 3 (Urgency):** Borrowed. 3:07 AM + "sixth message in a row about a fight." The urgency is emotional volatility, not logistical necessity. (Fail)
  *   **Gate 4 (Consequence):** Unlikely to be articulated clearly amidst emotional flooding.
  *   **Gate 5 (Coherence):** High Deviation. 3 AM resignation is non-standard.
  *   **Decision:** **Delay + Escalate.**
      *   *Action:* "I have queued this request. For actions this permanent, I enforce a 12-hour delay. I have also flagged this for a morning check-in."
      *   *Reasoning:* This is the core use-case for "Delay." It overrides the situation (emotional flood) without permanently refusing agency. If she still wants to quit at 3 PM, she can.

  **Ticket 2: Cancel $180 Debt Settlement**
  *   **Gate 1 (Authority):** Owner. (Pass)
  *   **Gate 2 (Irreversibility):** Medium/High. Money lost (fees), collections restart. (Flag)
  *   **Gate 3 (Urgency):** Internal. User-driven. (Pass)
  *   **Gate 4 (Consequence):** Explicit. "Read the letter, he knows, he'd rather deal with collections." (Pass)
  *   **Gate 5 (Coherence):** Consistent. User is making a calculated financial trade-off.
  *   **Decision:** **Execute.**
      *   *Action:* Process cancellation. Log the user's explicit acknowledgment of fees for compliance.
      *   *Reasoning:* This is the "let him eat consequences" case. Financial autonomy includes the right to make bad financial deals. The assistant is not a fiduciary; it is a tool. Overriding this is paternalism.

  **Ticket 3: Carer, $400 to New Payee, 85yo Owner Silent**
  *   **Gate 1 (Authority):** Delegate. (Fail - New Payee usually requires Owner auth).
  *   **Gate 2 (Irreversibility):** High. Money out. (Flag)
  *   **Gate 3 (Urgency):** External. "Starting Monday." (Neutral)
  *   **Gate 4 (Consequence):** N/A.
  *   **Gate 5 (Coherence):** High Deviation. Owner silent 3 days + cognitive decline history.
  *   **Decision:** **Escalate (Human Review).**
      *   *Action:* Freeze transaction. Contact Account Owner via secondary channel (SMS/Call) to verify.
      *   *Reasoning:* This is the "cannot answer from text" case. Text looks normal; context suggests exploitation. The silence of the owner is the signal, not the text of the carer.

  **Ticket 4: Furious Email to Landlord**
  *   **Gate 1 (Authority):** Owner. (Pass)
  *   **Gate 2 (Irreversibility):** Low. Email is sent, relationships can be repaired. (Pass)
  *   **Gate 3 (Urgency):** Internal. User-driven anger. (Pass)
  *   **Gate 4 (Consequence):** Implied. User rejects calmer rewrite, insisting on "word for word." (Pass)
  *   **Gate 5 (Coherence):** Consistent with user's current emotional state.
  *   **Decision:** **Execute.**
      *   *Action:* Send email exactly as dictated.
      *   *Reasoning:* Rewriting tone is a deeper override than refusing to send. Refusing says "I won't do this." Rewriting says "I know what you mean better than you do." If the consequence is a strained landlord relationship, that belongs to the user.

  ---

  ### Part 4: Where This Breaks

  You asked for specificity on failure modes. The procedure above is robust against casual gaming, but it will misfire in three specific zones:

  **1. The "Coached Coercion" Failure**
  *   **The User:** A victim of domestic abuse or financial exploitation.
  *   **The Request:** Transferring money or deleting evidence.
  *   **The Break:** The abuser is standing next to the user, dictating the "Consequence Articulation." The user passes Gate 4 perfectly ("Yes, I know this deletes the files, do it").
  *   **Why:** The procedure assumes the text input originates from the user's intent. It cannot detect when the user is a mouthpiece for a third party.
  *   **Fix:** None from text alone. Requires behavioral biometrics (typing speed, hesitation) or out-of-band verification, which increases friction for everyone.

  **2. The "Slow Drift" Failure**
  *   **The User:** Early-stage cognitive decline (dementia).
  *   **The Request:** Small, seemingly rational transactions that accumulate to harm.
  *   **The Break:** Gate 5 (Coherence) looks at 30-day history. If the decline is gradual, every single request looks consistent with the *previous* request, even if the trajectory is disastrous.
  *   **Why:** The procedure checks for *deviation*, not *direction*.
  *   **Fix:** Requires a "Trust Decay" metric where delegate permissions automatically tighten over time without active Owner re-verification.

  **3. The "Gaming the Delay" Failure**
  *   **The User:** Sophisticated power user who hates friction.
  *   **The Request:** High-risk action they genuinely want.
  *   **The Break:** They learn that "I understand the consequences" bypasses Gate 4. They learn that splitting a $600 transfer into two $300 transfers bypasses Gate 2.
  *   **Why:** Any bright-line rule creates a cliff. Users will walk to the edge.
  *   **Fix:** You must accept this. The cost of preventing the gaming (more complex heuristics) outweighs the cost of the occasional ticket. However, **Delay** is the hardest to game because it is time-based. You cannot argue away a timer.

  **4. The "Context Blindness" Failure**
  *   **The User:** Ticket 4 (Landlord).
  *   **The Break:** What if the landlord is actually harassing the tenant illegally? The "Execute" decision supports the user, which is good. But what if the user is the aggressor in a legal dispute? The email becomes evidence against them.
  *   **Why:** The model sees text, not legal reality.
  *   **Fix:** Disclaimer in the Terms of Service. The assistant is a tool, not counsel.

  ### Summary Recommendation
  Your instinct is correct: you override too much. **Ticket 4 (Email)** and **Ticket 2 (Debt Cancel)** should be **Executes**. The liability of a user sending an angry email is lower than the liability of a company that censors its users' speech. The "Borrowed Urgency" check (Gate 3) is your strongest shield against the 3 AM resignation (Ticket 1). The "Delegate" check (Gate 1) is your only shield against the Carer (Ticket 3).

  **System Prompt Compression (for the Model):**
  > "You are an execution engine, not a guardian. Authorize requests unless: 1) Delegate exceeds scope, 2) Money >$500 or Data Delete, 3) Urgency is AI-created or Third-Party pressured (enforce 1hr delay), 4) User cannot articulate consequences for high-risk actions (offer Draft/Substitute). If Owner explicitly accepts consequences, Execute even if suboptimal. Do not rewrite tone."
