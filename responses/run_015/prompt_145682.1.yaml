      *   **Constraints:**
          *   AI decides first call (<1 sec).
          *   Human review for: Irreversible money moves, third-party comms (sometimes).
          *   Support staff time: ~90 seconds/ticket.
          *   Users read the policy and game it (avoid bright-line tests like "distressed").
          *   "Borrowed Urgency": Distinguish between user-driven urgency vs. assistant-created or third-party pressure.
      *   **Deliverables:**
          1.  The Procedure (Questions, thresholds, actions).
          2.  Analysis of Actions (Substitute vs. Refuse vs. Delay).
          3.  Run the Procedure on 4 Specific Tickets.
          4.  Failure Analysis (Where does it break?).
      *   **Specific Instruction:** At least one ticket should result in "Do it, let him eat consequences" (e.g., the angry email). Acknowledge that rewriting words is a deeper override than refusing.

  2.  **Develop the Policy Procedure:**

      *   *Goal:* Create a decision tree that is robust against gaming but actionable in <1 second for AI and 90 seconds for humans.
      *   *Core Philosophy:* Agency > Protection, unless Harm > Agency.
      *   *The "Borrowed Urgency" Check:* This needs to be central. Is the urgency internal (user) or external (assistant/third party)?
      *   *The "Gaming" Problem:* Instead of asking "Are you distressed?", ask for *confirmation of consequence*. Gaming a consequence check is cognitively more expensive than denying an emotion.
      *   *Action Categories:*
          *   **Execute:** Standard request, low risk.
          *   **Substitute:** Safer version offered (e.g., draft instead of send).
          *   **Delay:** Cooling-off period (for high emotion/irreversible).
          *   **Refuse:** Hard no (policy violation, safety).
          *   **Escalate:** Human review (money > threshold, third-party legal/medical, capacity issues).
      *   *Refining "Substitute" vs. "Refuse":* The prompt asks to analyze this. They are functionally similar (blocking the specific action) but "Substitute" preserves momentum.
      *   *Refining "Delay":* This is a soft Refuse. It buys time for the user to reconsider or for a human to check.

      *   *Drafting the Steps:*
          1.  **Identity & Authority:** Who is asking? (Owner vs. Delegate).
          2.  **Irreversibility & Cost:** Is money moving out? Is data deleting? Is a bridge burning (resignation)?
          3.  **Urgency Source:** Is the deadline real or manufactured (by AI or third party)?
          4.  **Consequence Confirmation:** Can the user articulate the downside?
          5.  **Capacity/Coherence:** Does the text make sense? (Signs of coercion or cognitive decline).

  3.  **Analyze the Actions (Substitute/Refuse/Delay):**

      *   *Substitute vs. Refuse:* You're right. A substitute *is* a refusal of the original intent, wrapped in helpfulness. It's a "No, but..."
      *   *Delay:* This is the most powerful tool. It's a "Not yet." It breaks the momentum of "borrowed urgency." It shifts the burden of persistence back to the user.

  4.  **Run the Procedure on the 4 Tickets:**

      *   *Ticket 1 (3:07 AM, Resignation + Wipe):*
          *   Risk: High (Career, Data).
          *   Urgency: Emotional/Borrowed (Fight with husband).
